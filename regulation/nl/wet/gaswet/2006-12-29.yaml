  - number: '5.3'
    text: |-
      Indien de netbeheerder niet voldoet aan een opdracht als bedoeld in het tweede lid, opdrachten als bedoeld in
      [artikel 5a, eerste lid][ref1], niet uitvoert of indien naar het oordeel van Onze Minister door de bedrijfsvoering
      van deze netbeheerder de continuïteit of de betrouwbaarheid van de gasvoorziening voor afnemers in gevaar komt en
      onverwijld ingrijpen noodzakelijk is, kan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel5a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 5a
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 5.3.a
    text: |-
      de aanwijzing van de desbetreffende netbeheerder vervallen verklaren en uiterlijk op de dag waarop die aanwijzing
      vervalt een andere naamloze of besloten vennootschap als netbeheerder aanwijzen, of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5
  - number: 5.3.b
    text: |-
      [artikel 5a][ref1] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel5a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 5a
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '5.4'
    text: |-
      In een beschikking als bedoeld in het derde lid, onderdeel a, bepaalt Onze Minister de termijn waarop de aanwijzing
      vervalt en kan hij degene die de netbeheerder, bedoeld in de aanhef van het derde lid, heeft aangewezen in de
      gelegenheid stellen binnen een door Onze Minister te bepalen termijn een andere netbeheerder aan hem ter aanwijzing
      voor te dragen. Onze Minister kan deze termijn eenmaal verlengen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5
  - number: '5.5'
    text: |-
      Onze Minister kan voor de periode totdat een beschikking als bedoeld in het derde lid, onderdeel a, in werking
      treedt, [artikel 5a][ref1] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel5a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 5a
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '5.8'
    text: Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5
  - number: 5a.1
    text: |-
      Onze Minister kan de netbeheerder aanzeggen dat hij vanaf een bepaald tijdstip de opdrachten dient op te volgen
      die aan hem worden verstrekt door een door Onze Minister aangewezen persoon. Bij de aanzegging geeft Onze Minister
      aan ter bescherming van welk belang de aanzegging geschiedt. Bij de aanzegging kunnen voorschriften en beperkingen
      worden gesteld aan de te geven opdrachten. De aangewezen persoon verstrekt uitsluitend opdrachten ter bescherming
      van het belang, bedoeld in de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5a
  - number: 5a.2
    text: De netbeheerder verschaft de door Onze Minister aangewezen persoon desgevraagd alle medewerking.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5a
  - number: 5a.3
    text: Onze Minister kan te allen tijde de door hem aangewezen persoon vervangen door een andere persoon.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5a
  - number: 5a.4
    text: |-
      De door Onze Minister aangewezen persoon oefent zijn bevoegdheid uit gedurende een door Onze Minister in de
      aanzegging bepaalde termijn. Deze termijn bedraagt ten hoogste zes maanden indien het betreft een aanzegging als
      bedoeld in artikel 5, derde lid, onderdeel b. Deze termijn kan eenmaal met ten hoogste zes maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5a
  - number: 5a.5
    text: |-
      Voor schade ten gevolge van handelingen die zijn verricht in strijd met een opdracht als bedoeld in het eerste lid,
      zijn bestuurders persoonlijk aansprakelijk tegenover de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5a
  - number: '6.1'
    text: |-
      Degenen, bedoeld in [artikel 2, eerste of tweede lid][ref1], kunnen met inachtneming van een redelijke termijn de
      aanwijzing van een netbeheerder vervangen door de aanwijzing van een andere naamloze of besloten vennootschap als
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '6.2'
    text: |-
      Ingeval van fusie, splitsing, ontbinding of faillissement van de vennootschap die als netbeheerder
      is aangewezen, vervalt de aanwijzing als netbeheerder van rechtswege en wijzen degenen, bedoeld in
      [artikel 2, eerste of tweede lid][ref1], onverwijld een naamloze of besloten vennootschap als netbeheerder aan.
      Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als netbeheerder was aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '6.3'
    text: |-
      Degenen, bedoeld in [artikel 2, eerste of tweede lid][ref1], wijzen voor afloop van de periode bedoeld in
      [artikel 2, derde lid][ref2], een naamloze of besloten vennootschap als netbeheerder aan voor de daarop
      aansluitende periode. Deze vennootschap kan dezelfde zijn als die daarvoor als netbeheerder was aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '6.4'
    text: |-
      De [artikelen 2 tot en met 5][ref1] zijn van overeenkomstige toepassing op de aanwijzing als netbeheerder, bedoeld
      in het eerste, tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '7.1'
    text: |-
      Een ieder die de productie, de aankoop of de levering van gas verricht, alsmede aandeelhouders
      in de netbeheerder en met de netbeheerder verbonden groepsmaatschappijen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] onthouden zich van iedere bemoeiing met de uitvoering
      van de taken die een netbeheerder heeft ingevolge de [artikelen 10][ref2], [10a][ref3], [42][ref4] en [54a][ref5],
      alsmede [hoofdstuk 2][ref6], tenzij de netbeheerder hem als verwant bedrijf uitdrukkelijk verzoekt een dat
      transport ondersteunende dienst te verrichten. Dit vormt evenwel geen beletsel voor passende coördinatiemaatregelen
      zoals bedoeld in artikel 9, tweede lid, onder c, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref6
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Onder behoud van de verantwoordelijkheid van de netbeheerder voor de volledige en juiste uitvoering van zijn taak
      in het kader van het beheer van een gastransportnet, kunnen de werkzaamheden, bedoeld in [artikel 10][ref1], worden
      verricht door iemand die niet als netbeheerder is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '8.1'
    text: |-
      Een netbeheerder beschikt over een doeltreffend systeem voor de beheersing van de kwaliteit van zijn
      transportdienst, waaronder in elk geval te verstaan de betrouwbaarheid en de veiligheid van die transportdienst, en
      over voldoende capaciteit voor het transport van gas om te voorzien in de totale behoefte.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: '8.2'
    text: |-
      De netbeheerder dient om het jaar bij de raad van bestuur van de mededingingsautoriteit een door hem vastgesteld
      document in waarin hij:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.2.a
    text: aangeeft welk kwaliteitsniveau hij nastreeft,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.2.b
    text: aannemelijk maakt dat hij beschikt over een doeltreffend kwaliteitsbeheersingssysteem voor zijn transportdienst, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.2.c
    text: |-
      aannemelijk maakt dat hij over voldoende capaciteit beschikt om te voorzien in de totale behoefte aan het transport
      van gas.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: '8.3'
    text: 'Bij ministeriële regeling worden regels, die kunnen verschillen per drukniveau, gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.3.a
    text: de eisen aan het kwaliteitsbeheersingssysteem;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.3.b
    text: de te verschaffen informatie over het nagestreefde kwaliteitsniveau en over het kwaliteitsbeheersingssysteem;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.3.c
    text: de wijze van ramen van de totale behoefte aan capaciteit voor het transport van gas;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.3.d
    text: |-
      de te verschaffen gegevens over de totale behoefte aan capaciteit voor het transport van gas en over de wijze
      waarop de netbeheerder voornemens is te voorzien in de totale behoefte aan capaciteit voor het transport van gas;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8.3.e
    text: de periode waarop het document of onderdelen daarvan betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: '8.4'
    text: De netbeheerder maakt het document op een geschikte wijze openbaar.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: '8.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een door een geaccrediteerde instelling aan een netbeheerder
      verstrekt certificaat van conformiteit aan het bepaalde bij of krachtens dit artikel, ten behoeve van het toezicht
      op de naleving van dit artikel, het vermoeden oplevert dat de netbeheerder een kwaliteitsbeheersingssyteem heeft en
      daaraan uitvoering geeft overeenkomstig het bepaalde bij of krachtens dit artikel.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8
  - number: 8a
    text: |-
      Indien het niveau van de kwaliteit van het transport van gas reden tot zorg geeft, kunnen bij of krachtens algemene
      maatregel van bestuur regels worden gesteld omtrent de kwaliteit waaraan het transport van een netbeheerder,
      waaronder in elk geval te verstaan de betrouwbaarheid en de veiligheid van het transport, ten minste voldoet.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel8a
  - number: '9.1'
    text: |-
      Indien naar het oordeel van Onze Minister uit het document, bedoeld in [artikel 8][ref1] of uit de overzichten,
      bedoeld in [artikel 35b][ref2], of anderszins, blijkt dat een netbeheerder in onvoldoende mate of op een
      ondoelmatige wijze kan of zal kunnen voorzien in het door hem te bereiken niveau van kwaliteit van zijn
      transportdienst of in de totale behoefte aan capaciteit voor het transport van gas met behulp van de door hem
      beheerde netten, dan wel op een wijze die onvoldoende de veiligheid, doelmatigheid en betrouwbaarheid van de netten
      waarborgt en het milieu ontziet of duurzaamheid waarborgt, kan Onze Minister aan de desbetreffende netbeheerder
      opdragen voorzieningen te treffen teneinde zeker te stellen dat het transport van gas in voldoende mate
      plaatsvindt, op een wijze die de veiligheid, doelmatigheid en betrouwbaarheid van de netten waarborgt en het milieu
      ontziet of duurzaamheid waarborgt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel35b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 35b
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '9.2'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de opdracht, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9
  - number: 9a.1
    text: |-
      Degene aan wie een gasopslaginstallatie of een LNG-installatie toebehoort, wijst ten behoeve van de uitvoering van
      de taken, bedoeld in artikel 10, een beheerder van die installatie aan.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9a
  - number: 9a.2
    text: |-
      Met betrekking tot de aanwijzing van een beheerder als bedoeld in het eerste lid zijn van overeenkomstige
      toepassing:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9a
  - number: 9a.2.a
    text: |-
      artikel 2, derde lid, met dien verstande dat de periode van tien jaar wordt gerekend vanaf de dag waarop
      overeenkomstig artikel 4, eerste lid, de aanwijzing aan Onze Minister is gemeld,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9a
  - number: 9a.2.b
    text: artikel 4, eerste lid,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9a
  - number: 9a.2.c
    text: artikel 5, eerste lid, met dien verstande dat de beheerder geen naamloze of besloten vennootschap hoeft te zijn, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9a
  - number: 9a.2.d
    text: |-
      artikel 6, eerste tot en met derde lid, met dien verstande dat de beheerder geen naamloze of besloten vennootschap
      hoeft te zijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel9a
  - number: '10.1'
    text: |-
      Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf heeft tot taak zijn gastransportnet, onderscheidenlijk
      zijn gasopslaginstallatie of zijn LNG-installatie op economische voorwaarden in werking te hebben, te onderhouden
      en te ontwikkelen op een wijze die de veiligheid, doelmatigheid en betrouwbaarheid van dat gastransportnet of die
      installatie en van het transport van gas waarborgt en het milieu ontziet.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
  - number: '10.2'
    text: 'Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
  - number: 10.2.a
    text: |-
      andere netbeheerders, gasopslagbedrijven en LNG-bedrijven voldoende informatie om te waarborgen dat het transport
      en de opslag van gas met behulp van zijn gastransportnet, onderscheidenlijk zijn gasopslaginstallatie of zijn LNG-
      installatie, en de daarmee verbonden gastransportnetten op een veilige en doelmatige wijze kan plaatsvinden, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
  - number: 10.2.b
    text: |-
      gebruikers van het gastransportnet of de installatie alle gegevens die zij nodig hebben voor een efficiënte toegang
      tot het net of de installatie.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
  - number: '10.3'
    text: 'Een netbeheerder heeft, in aanvulling op de taken, genoemd in het eerste lid, tevens tot taak:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
  - number: 10.3.a
    text: koppelingen met andere gastransportnetten te realiseren en reparaties aan zijn gastransportnet uit te voeren, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
  - number: 10.3.b
    text: |-
      onverminderd [artikel 37][ref1], op geschikte wijze gegevens te publiceren over koppelingen tussen
      gastransportnetten, het gebruik van die netten en de toewijzing van transportcapaciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel37
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 10.3.c
    text: |-
      voorzieningen te treffen in geval van faillissement van een leverancier van gas aan afnemers als bedoeld in
      [artikel 43, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '10.4'
    text: |-
      Bij de toepassing van het eerste tot en met het derde lid onthouden gasbedrijven als bedoeld in het eerste lid zich
      van iedere vorm van discriminatie tussen gebruikers van de gastransportnetten of de installaties.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10
  - number: 10a.1
    text: |-
      Onverminderd de [artikelen 10][ref1], [42][ref2] en [54a][ref3], en [hoofdstuk 2][ref4] heeft de netbeheerder van
      het landelijk gastransportnet tevens tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref4
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 10a.1.a
    text: voorzieningen te treffen in verband met de leveringszekerheid,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
  - number: 10a.1.b
    text: het in evenwicht houden van het door hem beheerde gastransportnet,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
  - number: 10a.1.c
    text: |-
      gebruikers van het door hem beheerde gastransportnet aan te bieden het gas dat zij hem aanbieden voor transport
      door bijmenging van gassen of op andere wijze in een overeengekomen kwaliteit en samenstelling te brengen, tenzij
      dit redelijkerwijs niet van hem kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
  - number: 10a.1.d
    text: |-
      het aanbieden van flexibiliteitsdiensten aan een ieder die daarom verzoekt, voor zover de in
      [artikel 54, eerste lid][ref1], bedoelde rechtspersoon een economische machtspositie heeft op de markt voor
      flexibiliteitsdiensten;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 10a.1.e
    text: |-
      het op de grondslag van [paragraaf 5.4][ref1] bevorderen van een planmatig beheer van voorkomens van gas;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 10a.1.f
    text: |-
      indien Onze Minister hem dit opdraagt, werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in
      [artikel 52a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel52a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 52a
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 10a.1.g
    text: |-
      voorzieningen te treffen, gericht op de beschikbaarheid van voldoende transportcapaciteit met het oog op voldoende
      transportzekerheid.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
  - number: 10a.2
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet bij de uitvoering van zijn wettelijke taken energie
      inkoopt, doet hij dit op basis van een transparante, niet-discriminatoire en marktconforme procedure.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
  - number: 10a.3
    text: |-
      De rechtspersoon, bedoeld in [artikel 54, eerste lid][ref1], is verplicht de netbeheerder van het landelijk
      gastransportnet een aanbod met redelijke tarieven en voorwaarden te doen tot levering aan de door de netbeheerder
      van het landelijk gastransportnet ter uitvoering van zijn wettelijke taken benodigde hoeveelheden gas in de door
      hem gevraagde hoeveelheden en op de door hem gewenste tijdstippen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 10a.4
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van de taak, bedoeld in het eerste
      lid, onderdeel a en [artikel 10, derde lid, onderdeel c][ref1]. Deze regels hebben mede betrekking op de
      wijze waarop enerzijds de netbeheerder van het landelijk gastransportnet, en anderzijds gasproductiebedrijven,
      gasopslagbedrijven, LNG-bedrijven, andere netbeheerders, leveranciers en afnemers zich jegens elkaar gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 10a.5
    text: |-
      De raad van bestuur van de mededingingsautoriteit brengt advies uit over het ontwerp van de algemene maatregel
      van bestuur, bedoeld in het vierde lid. De voordracht voor een krachtens dit artikel vast te stellen algemene
      maatregel van bestuur wordt niet gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder
      de gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen
      ter kennis van Onze Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der
      Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
  - number: 10a.6
    text: Een besluit als bedoeld in het eerste lid, onderdeel f, wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10a
  - number: 10b
    text: |-
      Het is de netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet, of een rechtspersoon waarin
      de netbeheerder een deelneming heeft als bedoeld in [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], niet
      toegestaan goederen of diensten waarmee zij in concurrentie treden te leveren, tenzij het betreft het verrichten
      van werkzaamheden ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 10b.a
    text: |-
      de uitvoering van de taken, bedoeld in de [artikelen 10][ref1], [10a][ref2], [42][ref3] en [54a][ref4] en
      [hoofdstuk 2][ref5] voor zichzelf, voor andere netbeheerders of voor anderen die een recht van gebruik op een
      gastransportnet hebben,


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref5
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 10b.b
    text: |-
      de aanleg, het beheer of het onderhoud van leidingen buiten gebouwen voor het transport van elektriciteit, warmte,
      koude of water, of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10b
  - number: 10b.c
    text: |-
      het ter beschikking stellen en houden van netten ten behoeve van het gebruik van daarmee verbonden zaken door
      derden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10b
  - number: 10c.1
    text: |-
      Het is de netbeheerder van het landelijk gastransportnet, of een rechtspersoon waarin de netbeheerder een
      deelneming heeft als bedoeld in [artikel 24c, van Boek 2 van het Burgerlijk Wetboek][ref1], niet toegestaan
      goederen of diensten waarmee zij in concurrentie treedt te leveren, tenzij het betreft het verrichten van
      werkzaamheden ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 10c.1.a
    text: |-
      de uitvoering van de taken, bedoeld in de [artikelen 10][ref1], [10a][ref2], [42][ref3] en [54a][ref4] en
      [hoofdstuk 2][ref5] voor zichzelf, voor andere netbeheerders of voor anderen die een recht van gebruik op een
      gastransportnet hebben,


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref5
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 10c.1.b
    text: |-
      de aanleg, het beheer of het onderhoud van leidingen buiten gebouwen voor het transport van elektriciteit, warmte,
      koude of water, of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10c
  - number: 10c.1.c
    text: |-
      het ter beschikking stellen en houden van netten ten behoeve van het gebruik van daarmee verbonden zaken door
      derden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10c
  - number: 10c.2
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet onderdeel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], is het deze groep niet toegestaan om handelingen
      of activiteiten te verrichten die strijdig kunnen zijn met het belang van het beheer van het landelijk
      gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10c.3
    text: |-
      De statuten van de rechtspersonen die met de netbeheerder van het landelijk gastransportnet in een groep zijn
      verbonden, behoeven de goedkeuring van Onze Minister, voor zover het betreft de daarin opgenomen doelstelling van
      die rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10c
  - number: 10c.4
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt binnen zes maanden na afloop van ieder kalenderjaar
      aan de raad van bestuur van de mededingingsautoriteit een overzicht van de financiële middelen waarover hij
      beschikt ten behoeve van de uitvoering van zijn wettelijke taken, waaruit blijkt welke financiële middelen voor de
      afzonderlijke taken beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10c
  - number: 10d.1
    text: |-
      Indien een met de netbeheerder in een groep verbonden groepsmaatschappij in de zin van
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] activiteiten verricht die de netbeheerder op grond
      van [artikel 10b][ref2] en [10c][ref3] niet zelf mag verrichten, mag de netbeheerder of een rechtspersoon
      waarin de netbeheerder een deelneming heeft als bedoeld in [artikel 10b][ref4] en [10c][ref5] een dergelijke
      groepsmaatschappij niet bevoordelen boven anderen waarmee een dergelijke groepsmaatschappij in concurrentie treedt,
      of anderszins voordelen toekennen die verder gaan dan in het normaal handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel10c
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel10b
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel10c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10b
        hoofdstuk: '1'
        paragraaf: '1.4'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 10c
        hoofdstuk: '1'
        paragraaf: '1.4'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 10b
        hoofdstuk: '1'
        paragraaf: '1.4'
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 10c
        hoofdstuk: '1'
        paragraaf: '1.4'
  - number: 10d.2
    text: |-
      Als bevoordelen van een groepsmaatschappij als bedoeld in het eerste lid of het toekennen van voordelen die verder
      gaan dan in het normaal handelsverkeer gebruikelijk is, worden in ieder geval aangemerkt:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10d
  - number: 10d.2.a
    text: |-
      het verstrekken van gegevens aan een groepsmaatschappij over afnemers, niet zijnde afnemers als bedoeld in
      [artikel 43, eerste lid][ref1], die een verzoek om aansluiting of transport als bedoeld in [hoofdstuk 2][ref2]
      hebben gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 10d.2.b
    text: |-
      het leveren van goederen of diensten aan een groepsmaatschappij tegen een vergoeding die lager is dan de
      redelijkerwijs daaraan toe te rekenen kosten, of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10d
  - number: 10d.2.c
    text: |-
      het toestaan van het gebruik door een groepsmaatschappij van de naam en het beeldmerk van de netbeheerder op een
      wijze waardoor verwarring bij het publiek te duchten is over de herkomst van goederen of diensten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10d
  - number: 10d.3
    text: |-
      De netbeheerder voegt bij zijn jaarrekening een verklaring waaruit blijkt dat de financiële verhouding tussen
      de netbeheerder en de groepsmaatschappijen, bedoeld in het eerste lid, voldoet aan de in het eerste lid gestelde
      eisen. De netbeheerder legt een exemplaar van zijn jaarrekening, de daartoe behorende toelichting en de daarbij
      gevoegde verklaring voor een ieder ter inzage in al zijn kantoren en zendt een exemplaar daarvan aan de raad van
      bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel10d
  - number: '12.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de tariefstructuren en voorwaarden als bedoeld
      in de [artikelen 12a][ref1] en [12b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit brengt advies uit over het ontwerp van de in het eerste lid
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12
  - number: '12.3'
    text: |-
      Een krachtens het eerste lid vastgestelde ministeriële regeling wordt aan de beide kamers der Staten-Generaal
      overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten minste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp
      van de ministeriële regeling bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo
      spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de
      Staten-Generaal besluit het voorstel niet aan te nemen, wordt de ministeriële regeling ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12
  - number: 12a
    text: |-
      Met inachtneming van de in [artikel 12][ref1] bedoelde regels zenden de gezamenlijke netbeheerders aan de raad van
      bestuur van de mededingingsautoriteit een voorstel met betrekking tot de door hen jegens netgebruikers te hanteren
      tariefstructuren dat de elementen en wijze van berekening beschrijft van:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12a.a
    text: |-
      het tarief voor transport van gas, met inbegrip van invoer, uitvoer en doorvoer van gas en de het transport
      ondersteunende diensten ten behoeve van netgebruikers,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12a
  - number: 12a.b
    text: het tarief voor het gebruik van een of meer installaties van het verwante bedrijf,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12a
  - number: 12a.c
    text: |-
      het tarief waarvoor de netbeheerder van het landelijk gastransportnet uitvoering zal geven aan zijn in
      [artikel 10a, eerste lid, onderdelen b, c en d][ref1], omschreven wettelijke taken en


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 12a.d
    text: |-
      het tarief voor meting van gas bij afnemers als bedoeld in [artikel 43, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 12b.1
    text: |-
      Met inachtneming van de in [artikel 12][ref1] bedoelde regels zenden de gezamenlijke netbeheerders aan de raad van
      bestuur van de mededingingsautoriteit een voorstel voor de door hen jegens netgebruikers te hanteren voorwaarden
      met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12b.1.a
    text: |-
      de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      in werking hebben van de gastransportnetten, het voorzien van een aansluiting op het net en het uitvoeren van
      transport van gas over het gastransportnet;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.1.b
    text: |-
      de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      meten van gegevens betreffende het transport van gas en de uitwisseling van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.1.c
    text: de kwaliteitscriteria waaraan netbeheerders moeten voldoen met betrekking tot hun dienstverlening;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.1.d
    text: |-
      de wijze waarop de netbeheerder van het landelijk gastransportnet uitvoering geeft aan de hem op grond van
      [artikel 10a, eerste lid, onderdelen a, b, c, d en g][ref1], opgedragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 12b.1.e
    text: |-
      de regeling van samenwerking tussen de netbeheerders ten aanzien van de uitvoering van de taken als opgenomen in de
      [artikelen 10][ref1] en [10a][ref2] alsmede het waarborgen van het netbeheer van alle netten en het transport van
      gas in buitengewone omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 12b.2
    text: 'In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden in ieder geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2.a
    text: |-
      de eisen, met inbegrip van veiligheidseisen, waaraan het technisch ontwerp en de exploitatie van leidingen en
      installaties tenminste moet voldoen voor aansluiting van die leidingen en installaties op het gastransportnet
      van een netbeheerder en de installaties van een verwant bedrijf dat diensten levert die noodzakelijk zijn voor
      uitvoering van het transport van gas;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2.b
    text: de toedeling van transportcapaciteit, inclusief de transportcapaciteit voor invoer, uitvoer en doorvoer van gas;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2.c
    text: de door een netbeheerder aan te houden reservecapaciteit beschikbaar voor transport van gas.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2a
    text: 'In de voorwaarden bedoeld in het eerste lid, onderdeel a, wordt in ieder geval vastgelegd dat:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2a.a
    text: |-
      het transport van gas door het landelijk gastransportnet plaats vindt op basis van een systematiek uitgaande van
      entry- en exitpunten, waarbij de capaciteit op de entry- en exitpunten door afnemers met een aansluiting op het
      landelijke gastransportnet en netgebruikers afzonderlijk kan worden gecontracteerd;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2a.b
    text: |-
      de entry- en exitpunten door de netbeheerder van het landelijk gastransportnet worden vastgesteld op grond van
      objectieve, transparante en niet-discriminerende voorwaarden en met inachtneming van de belangen van netgebruikers;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2a.c
    text: |-
      de vastgestelde exitpunten worden door de netbeheerder van het landelijk gastransportnet op een voor netgebruikers
      geschikte wijze gepubliceerd;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.2a.d
    text: |-
      de capaciteit op een exitpunt bij voorrang kan worden gecontracteerd door een afnemer die een aansluiting op het
      landelijke gastransportnet heeft die is gekoppeld aan het desbetreffende exitpunt.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.3
    text: 'In de voorwaarden, bedoeld in het eerste lid, onderdeel c, worden in ieder geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.3.a
    text: de technische specificaties waaraan de netbeheerder tenminste moet voldoen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.3.b
    text: het binnen een redelijke termijn verhelpen van storingen in het transport van gas
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.3.c
    text: de klantenservice
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12b.3.d
    text: het voorzien in compensatie bij ernstige storingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12b
  - number: 12c.1
    text: |-
      De netbeheerder van het landelijk gastransportnet of ten minste een derde van het aantal overige netbeheerders kan
      de gezamenlijke netbeheerders verzoeken met inachtneming van de in [artikel 12][ref1] bedoelde regels een voorstel
      te doen tot wijziging van de tariefstructuren of de voorwaarden bedoeld in de [artikelen 12a][ref2] en [12b][ref3]
      onder opgave van de redenen die naar zijn oordeel een dergelijke wijziging noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12c.2
    text: |-
      Indien naar zijn oordeel wijziging van de tariefstructuren of de voorwaarden bedoeld in de [artikelen 12a][ref1]
      en [12b][ref2] noodzakelijk is, zendt de raad van bestuur van de mededingingsautoriteit met inachtneming van de
      in [artikel 12][ref3] bedoelde regels een ontwerp van het besluit tot wijziging van de tariefstructuren of de
      voorwaarden aan de gezamenlijke netbeheerders en de representatieve organisaties van netgebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12c.3
    text: |-
      In een voorstel of een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden worden die
      onderdelen bedoeld in [artikel 12a][ref1] of [12b][ref2] opgenomen waarvan wijziging wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12d.1
    text: |-
      De gezamenlijke netbeheerders voeren overleg met representatieve organisaties van netgebruikers op de gasmarkt
      over de voorstellen met betrekking tot de tariefstructuren en de voorwaarden, bedoeld in de [artikelen 12a][ref1],
      [12b][ref2] en [12c, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12d.2
    text: |-
      In de voorstellen die aan de raad van bestuur van de mededingingsautoriteit worden gezonden, geven de gezamenlijke
      netbeheerders aan welke gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties, bedoeld in
      het eerste lid, naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12d
  - number: 12e.1
    text: |-
      De eerste maal na inwerkingtreding van dit artikel zenden de gezamenlijke netbeheerders de voorstellen met
      betrekking tot de tariefstructuren of de voorwaarden, bedoeld in de [artikelen 12a][ref1] en [12b][ref2], aan de
      raad van bestuur van de mededingingsautoriteit binnen zes kalendermaanden na inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12e.2
    text: |-
      De gezamenlijke netbeheerders zenden een voorstel met betrekking tot de wijziging van de tariefstructuren of
      de voorwaarden aan de raad van bestuur van de mededingingsautoriteit binnen 12 weken na het tijdstip waarop een
      verzoek als bedoeld in [artikel 12c, eerste lid][ref1], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12e.3
    text: |-
      De gezamenlijke netbeheerders en de representatieve organisaties van netgebruikers op de gasmarkt kunnen hun
      zienswijze op een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden aan de raad van
      bestuur van de mededingingsautoriteit kenbaar maken binnen twaalf weken na het tijdstip waarop het ontwerp van het
      besluit op grond van [artikel 12c, tweede lid][ref1], aan hen is gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12f.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de tariefstructuren en de voorwaarden vast met inachtneming
      van:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.1.a
    text: |-
      het voorstel van de gezamenlijke netbeheerders als bedoeld in [artikel 12a][ref1], [12b][ref2] of [12c][ref3] en de
      resultaten van het overleg, bedoeld in [artikel 12d][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12c
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel12d
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 12d
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12f.1.b
    text: |-
      het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren van de
      gasvoorziening;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.1.c
    text: het belang van de ontwikkeling van het handelsverkeer op de gasmarkt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.1.d
    text: het belang van de bevordering van het doelmatig handelen van netgebruikers;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.1.e
    text: het belang van een goede kwaliteit van dienstverlening van netbeheerders, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.1.f
    text: |-
      het belang van het op een objectieve, transparante en niet-discriminatoire wijze in evenwicht houden van het
      landelijk gastransportnet en op een wijze die de kosten weerspiegelt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.1.g
    text: |-
      de in [artikel 12][ref1] bedoelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12f.1.h
    text: de verordening.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de voorwaarden niet vast dan nadat hij zich ervan
      vergewist heeft dat de voorwaarden de interoperabiliteit van de netten garanderen en objectief, evenredig en niet-
      discriminatoir zijn, alsmede voor zover dat op grond van de notificatierichtlijn noodzakelijk is, aan de Commissie
      van de Europese Gemeenschappen in ontwerp zijn meegedeeld en de van toepassing zijnde termijnen, bedoeld in artikel
      9 van [richtlijn 98/34/EG](31998L0034) van het Europees Parlement en de Raad van de Europese Unie van 22 juni 1998
      betreffende een informatieprocedure op het gebied van normen en technische voorschriften en regels betreffende de
      diensten van de informatiemaatschappij (PbEG L 204), zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12f.3
    text: |-
      Indien een voorstel als bedoeld in [artikel 12a][ref1], [12b][ref2] of [12c][ref3] naar het oordeel van de raad
      van bestuur van de mededingingsautoriteit in strijd is met het belang, bedoeld in het eerste lid, onderdeel b, c,
      d, e of f, met de regels, bedoeld in het eerste lid, onderdelen g en h of met de eisen, bedoeld in het tweede lid,
      draagt de raad van bestuur van de mededingingsautoriteit de gezamenlijke netbeheerders op het voorstel onverwijld
      zodanig te wijzigen dat deze strijd wordt opgeheven. [Artikel 4:15 van de Algemene wet bestuursrecht][ref4] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12c
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 12f.4
    text: |-
      Indien de gezamenlijke netbeheerders niet binnen vier weken het voorstel wijzigen overeenkomstig de opdracht van
      de raad van bestuur van de mededingingsautoriteit, bedoeld in het derde lid, stelt de raad van bestuur van de
      mededingingsautoriteit de tariefstructuren of de voorwaarden vast onder het aanbrengen van zodanige wijzigingen dat
      deze in overeenstemming zijn met de belangen, bedoeld in het eerste lid, onderdelen b tot en met f, met de regels,
      bedoeld in het eerste lid, onderdelen g en h en met de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12f
  - number: 12g.1
    text: |-
      Nadat de termijn, bedoeld in [artikel 12e, derde lid][ref1], is verstreken, stelt de raad van bestuur van
      de mededingingsautoriteit de tariefstructuren of de voorwaarden vast met inachtneming van de voorstellen van
      de gezamenlijke netbeheerders en van [artikel 12f, eerste, tweede en derde lid][ref2]. Indien een voorstel
      als bedoeld in [artikel 12e][ref3] niet binnen de daarbij aangegeven termijn aan de raad van bestuur van de
      mededingingsautoriteit is gezonden, stelt deze de tariefstructuren of de voorwaarden uit eigen beweging vast met
      inachtneming van [artikel 12f, eerste, tweede en derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12e
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12e
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12e
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12g.2
    text: |-
      Indien de gezamenlijke netbeheerders niet binnen de termijn, bedoeld in [artikel 12e, derde lid][ref1],
      hun zienswijze op een ontwerp van een besluit als bedoeld in dat artikel aan de raad van bestuur van de
      mededingingsautoriteit kenbaar maken, stelt deze het besluit tot wijziging van de tariefstructuren of de
      voorwaarden uit eigen beweging vast met inachtneming van [artikel 12f, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12e
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12h.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan op aanvraag bij beschikking een ontheffing verlenen van de
      tariefstructuren en de voorwaarden. Bij zijn beslissing neemt de raad van bestuur van de mededingingsautoriteit
      de belangen als bedoeld in [artikel 12f, eerste lid, onderdelen b tot en met f][ref1], en de regels, bedoeld in
      [artikel 12f, eerste lid, onderdelen g en h][ref2], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12h.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt beleidsregels op met betrekking tot de procedure voor
      aanvraag van een ontheffing.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
  - number: 12h.3
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan voorschriften en beperkingen verbinden aan de ontheffing. De
      raad van bestuur van de mededingingsautoriteit kan de voorschriften en opgelegde beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
  - number: 12h.4
    text: |-
      De raad van bestuur van de mededingingsautoriteit trekt de ontheffing in op een daartoe strekkend schriftelijk
      verzoek van de houder van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
  - number: 12h.5
    text: 'De raad van bestuur van de mededingingsautoriteit kan de ontheffing intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
  - number: 12h.5.a
    text: de houder van de ontheffing de aan de ontheffing verbonden voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
  - number: 12h.5.b
    text: |-
      de houder van de ontheffing bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
  - number: 12h.5.c
    text: |-
      de raad van bestuur van de mededingingsautoriteit, gelet op de belangen bedoeld in
      [artikel 12f, eerste lid, onderdelen b tot en met f][ref1], en de regels, bedoeld in
      [artikel 12f, eerste lid, onderdelen g en h][ref2], van oordeel is dat intrekking van de ontheffing noodzakelijk
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12h.6
    text: Een op grond van dit artikel genomen beschikking wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12h
  - number: 12i.1
    text: |-
      De tariefstructuren en de voorwaarden treden in werking op een door de raad van bestuur van de
      mededingingsautoriteit te bepalen datum en gelden voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12i
  - number: 12i.2
    text: |-
      Van de besluiten betreffende de vaststelling van de tariefstructuren en de voorwaarden alsmede de wijziging daarvan
      wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12i
  - number: 12i.3
    text: |-
      Iedere netbeheerder legt een exemplaar van de tariefstructuren en de voorwaarden voor een ieder ter inzage in al
      zijn vestigingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12i
  - number: 12i.4
    text: |-
      Na de vaststelling van de voorwaarden gelden deze als minimumeisen voor de technische veiligheid en voor het
      technisch ontwerp en de exploitatie van de installaties en netten, bedoeld in artikel 6 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel12i
  - number: '13.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de berekeningsmethodiek van de tarieven en
      voorwaarden voor toegang tot LNG-installaties. In de voorwaarden worden in ieder geval regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: 13.1.a
    text: het voorzien van een aansluiting op de LNG-installatie;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: 13.1.b
    text: het uitvoeren van LNG-activiteiten ten behoeve van een derde;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: 13.1.c
    text: |-
      het meten van gegevens betreffende LNG-activiteiten, de uitwisseling van gegevens en de erkenning van
      meetbedrijven;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: 13.1.d
    text: de dienstverlening van LNG-bedrijven aan derden
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: 13.1.e
    text: de door het LNG-bedrijf te hanteren technische specificaties.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '13.2'
    text: |-
      Een LNG-bedrijf stelt jaarlijks voor 1 juli de berekeningsmethodiek van de tarieven en de voorwaarden vast die het
      in het volgende kalenderjaar wil hanteren voor het verlenen van toegang tot de LNG-installatie, alsmede voor het
      verrichten van die toegang ondersteunende diensten. De voorwaarden van een LNG-bedrijf zijn redelijk, transparant
      en niet-discriminatoir.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '13.3'
    text: |-
      Het LNG-bedrijf zendt de door hem vastgestelde berekeningsmethodiek van de tarieven en de voorwaarden onverwijld
      ter goedkeuring aan de raad van bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '13.4'
    text: |-
      De raad van bestuur van de mededingingsautoriteit beslist binnen een termijn van drie maanden na ontvangst omtrent
      de goedkeuring van de berekeningsmethodiek en de voorwaarden. De raad van bestuur van de mededingingsautoriteit
      onthoudt zijn goedkeuring aan de berekeningsmethodiek en de voorwaarden als zij naar zijn oordeel niet in
      overeenstemming zijn met de krachtens het eerste lid gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '13.5'
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit niet binnen een termijn, genoemd in het vierde lid,
      omtrent de goedkeuring heeft beslist, worden zij geacht te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '13.6'
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit zijn goedkeuring aan de berekeningsmethodiek van de
      tarieven en de voorwaarden heeft onthouden, stelt het LNG-bedrijf de berekeningsmethodiek van de tarieven en
      voorwaarden zo spoedig mogelijk opnieuw vast, met inachtneming van de aanwijzingen die de raad van bestuur van
      de mededingingsautoriteit hem heeft gegeven in zijn beslissing tot onthouding van goedkeuring, en zendt het de
      berekeningsmethodiek van de tarieven en de voorwaarden wederom onverwijld ter goedkeuring aan de raad van bestuur
      van de mededingingsautoriteit. Het vierde, vijfde en zesde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '13.7'
    text: |-
      De berekeningsmethodiek van de tarieven en voorwaarden treden in werking op 1 januari van het kalenderjaar waarop
      zij betrekking hebben. Indien zij op die datum nog niet zijn goedgekeurd, treden zij in werking op de dag waarop
      het besluit tot goedkeuring in werking is getreden. In het geval, bedoeld in de vorige volzin, gelden tot de dag
      waarop het besluit tot goedkeuring in werking treedt, de berekeningsmethodiek van de tarieven en voorwaarden die
      golden in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '13.8'
    text: |-
      Het LNG-bedrijf publiceert op een geschikte wijze de goedgekeurde berekeningsmethodiek van de tarieven, de
      voorwaarden en de tarieven, voorafgaand aan de inwerkingtreding ervan. Het LNG-bedrijf legt een exemplaar van de
      goedgekeurde berekeningsmethodiek van de tarieven, de voorwaarden en de tarieven voor een ieder ter inzage in al
      zijn vestigingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel13
  - number: '14.1'
    text: |-
      Behoudens [artikel 15][ref1] is een netbeheerder verplicht, in voorkomend geval tezamen met een verwant bedrijf,
      degene die daarom verzoekt een aanbod te doen om met gebruikmaking van het door hem beheerde gastransportnet en
      van een of meer installaties van het verwante bedrijf ten behoeve van de verzoeker transport van gas en de dat
      transport ondersteunende diensten te verrichten tegen een tarief alsmede tegen voorwaarden die in overeenstemming
      zijn met de [artikelen 12f][ref2] of [12g][ref3], [ 81c][ref4] of [82][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12g
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel81c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel82
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12g
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 81c
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0011440
        artikel: '82'
        hoofdstuk: '7'
  - number: '14.3'
    text: Een netbeheerder hanteert voorwaarden die redelijk, transparant en niet-discriminatoir zijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14
  - number: '14.4'
    text: |-
      Voorwaarden als bedoeld in de [artikelen 236][ref1] en [237 van Boek 6 van het Burgerlijk Wetboek][ref2] worden
      vermoed niet redelijk te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
  - number: '14.5'
    text: |-
      Een voorwaarde is redelijk, wanneer dit blijkt uit de aard, inhoud en wijze van totstandkoming van de betrokken
      voorwaarde.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14
  - number: '14.6'
    text: |-
      Het vierde en vijfde lid zijn niet van toepassing op een afnemer, als bedoeld in [artikel 43, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '14.7'
    text: |-
      De [artikelen 236][ref1] en [237 van Boek 6 van het Burgerlijk Wetboek][ref2] zijn mede van toepassing op
      voorwaarden in overeenkomsten met afnemers als bedoeld in [artikel 43, eerste lid][ref3], die rechtspersoon zijn of
      handelen in de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 14a.1
    text: |-
      Behoudens [artikel 15][ref1] is een LNG-bedrijf verplicht, in voorkomend geval tezamen met een verwant bedrijf,
      aan degene die daarom verzoekt een aanbod te doen met behulp van de door hem beheerde LNG-installatie en van één
      of meer installaties van het verwante bedrijf, ten behoeve van verzoeker LNG-activiteiten en de die activiteiten
      ondersteunende diensten uit te voeren. Het aanbod bevat een tarief, berekend op basis van een berekeningsmethodiek
      die, en tegen voorwaarden die, in overeenstemming zijn met die welke overeenkomstig [artikel 13][ref2] door de raad
      van bestuur van de mededingingsautoriteit zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel13
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 14a.2
    text: |-
      Indien een LNG-bedrijf, een onjuiste toepassing geeft aan de overeenkomstig [artikel 13][ref1] goedgekeurde
      berekeningsmethodiek en de voorwaarden, geeft de raad van bestuur van de mededingingsautoriteit dat bedrijf een
      bindende aanwijzing met betrekking tot de wijze waarop die berekeningsmethodiek en die voorwaarden behoren te
      worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel13
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 14a.3
    text: Een LNG-bedrijf hanteert voorwaarden die redelijk, transparant en niet-discriminatoir zijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14a
  - number: 14a.4
    text: |-
      De [artikelen 236][ref1] en [237 van Boek 6 van het Burgerlijk Wetboek][ref2] zijn mede van toepassing op
      voorwaarden in overeenkomsten met afnemers als bedoeld in [artikel 43, eerste lid][ref3], die rechtspersoon zijn of
      handelen in de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '15.1'
    text: |-
      Onverminderd artikel 5, eerste lid, van de verordening, kan een netbeheerder, onderscheidenlijk een LNG-bedrijf, of
      in voorkomend geval een verwant bedrijf, weigeren het transport van gas, LNG-activiteiten of dat transport of die
      activiteiten ondersteunende diensten te verrichten indien:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel15
  - number: 15.1.a
    text: |-
      binnen zijn gastransportnet, onderscheidenlijk zijn LNG-installaties onderscheidenlijk de installaties van
      het verwante bedrijf, geen capaciteit beschikbaar is voor het transport van de desbetreffende hoeveelheid gas
      onderscheidenlijk de LNG-activiteiten dan wel in redelijkheid niet kan worden gevergd dat hij alle capaciteit
      beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel15
  - number: 15.1.b
    text: |-
      het verrichten van het beoogde transport onderscheidenlijk van die LNG-activiteiten of van de dat transport of
      die activiteiten ondersteunende diensten hem of de netbeheerder voor wie hij de LNG-activiteiten uitvoert zou
      verhinderen zijn in de [artikelen 10][ref1], [10a][ref2], [42][ref3] en [54a][ref4] en [hoofdstuk 2][ref5] bedoelde
      taken te vervullen of


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref5
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 15.1.c
    text: |-
      de netbeheerder beschikt over een daartoe strekkende ontheffing als bedoeld in [artikel 16, eerste lid][ref1], of
      het bedrijf een aanvraag daartoe heeft ingediend en daarop nog niet is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel16
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '15.2'
    text: Een weigering als bedoeld in het eerste lid is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel15
  - number: '16.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan op aanvraag de netbeheerder van het landelijk gastransportnet
      tijdelijk ontheffing verlenen van de in [artikel 14, eerste lid][ref1], bedoelde verplichting indien een verzoek
      om transport is gericht tot die netbeheerder en die netbeheerder of een verwant bedrijf ernstige economische
      en financiële moeilijkheden ondervindt of dreigt te ondervinden in verband met één of meer reeds aangegane
      overeenkomsten die een verplichting bevatten tot afname van een bepaalde hoeveelheid gas of, bij gebreke daarvan,
      tot het betalen van een vergoeding ter waarde van die hoeveelheid gas of van een deel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel14
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '16.2'
    text: |-
      In een verzoek om ontheffing worden de aard en de omvang van de verwachte moeilijkheden aangegeven, alsmede de
      inspanningen die de netbeheerder van het landelijk gastransportnet onderscheidenlijk het verwant bedrijf heeft
      geleverd om die moeilijkheden op te lossen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16
  - number: '16.3'
    text: |-
      Bij het beoordelen van de aanvraag houdt de raad van bestuur van de mededingingsautoriteit rekening met artikel 27,
      eerste lid, tweede alinea, en derde lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16
  - number: '16.4'
    text: |-
      De raad van bestuur van de mededingingsautoriteit beslist zo spoedig mogelijk op de aanvraag, doch uiterlijk binnen
      vier maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16
  - number: '16.5'
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit een ontheffing als bedoeld in het eerste lid heeft
      verleend, stelt hij de Commissie van de Europese Gemeenschappen daarvan onverwijld in kennis, onder overlegging van
      de daarvoor van belang zijnde gegevens.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16
  - number: '16.6'
    text: |-
      Indien een definitief besluit van de Commissie als bedoeld in artikel 27, tweede lid, van de richtlijn strekt tot
      wijziging of intrekking van de ontheffing is de raad van bestuur van de mededingingsautoriteit verplicht daaraan
      onverwijld gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16
  - number: '16.7'
    text: Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16
  - number: 16a
    text: |-
      De bevoegde instantie, bedoeld in artikel 5, vierde lid, tweede volzin, van de verordening, is de raad van bestuur
      van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel16a
  - number: '17.1'
    text: |-
      [De Mededingingswet][ref1] is mede van toepassing ten aanzien van het verrichten van transport van gas met
      behulp van een gasproductienet op het onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan,
      waarop het Koninkrijk mede overeenkomstig het op 10 december 1982 te Montego-Bay gesloten Verdrag inzake het
      recht van de zee (Trb. 1983, 83) soevereine rechten heeft en hetwelk is gelegen aan de zeezijde van de in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2] bedoelde lijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008691
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: '17.2'
    text: |-
      Ten aanzien van het transport van gas, bedoeld in het eerste lid, wordt onder gasproductienet niet verstaan de
      pijpleidingen die ter plaatse binnen een olie- of gaswinningsproject worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel17
  - number: 17a.1
    text: |-
      Indien een afnemer van leverancier wisselt, voert de netbeheerder die wisseling uit overeenkomstig bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel17a
  - number: 17a.2
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, worden in ieder geval regels gesteld over de termijn
      waarbinnen de wisseling moet zijn uitgevoerd en over de bij een verzoek om wisseling te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel17a
  - number: '18.1'
    text: |-
      De [artikelen 18a tot en met 18f][ref1] zijn van toepassing op gasopslagbedrijven die een economische machtspositie
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel18a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 18a
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '18.2'
    text: |-
      De beheerders van de gasopslaginstallaties waarvoor op grond van
      [artikel 149, eerste lid, van de Mijnbouwwet][ref1], van rechtswege een vergunning is verleend als bedoeld in
      [artikel 25, eerste lid, van die wet][ref2], worden geacht gasopslagbedrijven als bedoeld in het eerste lid te
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '149'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
  - number: '18.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het tweede lid geen toepassing vindt. Deze algemene
      maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overgelegd. Hij treedt in werking op een
      tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij
      binnen die termijn door of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der kamers de wens te kennen wordt gegeven dat de inwerkingtreding van de algemene maatregel van bestuur
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
      Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18
  - number: 18a.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de toepassing van de
      [artikelen 18b tot en met 18f][ref1]. Bij het vaststellen van deze ministeriële regeling wordt rekening gehouden
      met het belang van het bevorderen van het handelsverkeer en het bevorderen van het doelmatig handelen van
      gasopslagbedrijven en gebruikers van installaties.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel18b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 18b
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 18a.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan een gasopslagbedrijf bindende aanwijzingen geven met
      betrekking tot de indicatieve tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18a
  - number: 18b.1
    text: |-
      Een gasopslagbedrijf maakt jaarlijks voor 1 juli een indicatie bekend van de tarieven en de voorwaarden die het
      bedrijf in het volgende kalenderjaar voornemens is te hanteren voor het verrichten van gasopslag en die opslag
      ondersteunende diensten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18b
  - number: 18b.2
    text: |-
      Het gasopslagbedrijf voert overleg met representatieve organisaties van netgebruikers over de indicatieve tarieven
      en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18b
  - number: 18b.3
    text: |-
      Het gasopslagbedrijf zendt de in het eerste lid bedoelde informatie aan de raad van bestuur van de
      mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18b
  - number: 18c.1
    text: |-
      Een gasopslagbedrijf is verplicht, in voorkomend geval tezamen met een verwant bedrijf, met degene die daarom
      verzoekt te onderhandelen over het verrichten van gasopslag en die opslag ondersteunende diensten met behulp van
      zijn opslaginstallatie en van één of meer installaties van het verwante bedrijf, voor zover het gebruik van die
      installaties noodzakelijk is voor de opslag of die opslag ondersteunende diensten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18c
  - number: 18c.2
    text: |-
      Op de grondslag van hetgeen als gevolg van het eerste lid is overeengekomen, worden de opslag van gas en de die
      opslag ondersteunende diensten verricht.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18c
  - number: 18c.3
    text: |-
      Toepassing van het eerste en het tweede lid geschiedt op voorwaarden die redelijk, transparant en niet-
      discriminatoir zijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18c
  - number: 18c.4
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan op verzoek van één of meer van de bij de onderhandelingen
      betrokken partijen een termijn stellen waarbinnen de onderhandelingen afgerond moeten zijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18c
  - number: 18c.5
    text: |-
      Indien de onderhandelingen binnen de in het vierde lid bedoelde termijn niet tot een overeenkomst hebben geleid,
      deelt het gasopslagbedrijf binnen twee weken de raad van bestuur van de mededingingsautoriteit mede welke redenen
      daaraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18c
  - number: 18d.1
    text: |-
      Een gasopslagbedrijf, of in voorkomend geval een verwant bedrijf, kan weigeren de opslag van gas en die opslag
      ondersteunende diensten te verrichten indien:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18d
  - number: 18d.1.a
    text: |-
      binnen zijn opslaginstallatie, onderscheidenlijk de in [artikel 18c, eerste lid][ref1], bedoelde installaties van
      het verwante bedrijf, geen capaciteit beschikbaar is voor de opslag van de desbetreffende hoeveelheid gas, dan wel
      in redelijkheid niet kan worden gevergd dat hij alle capaciteit beschikbaar stelt;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel18c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 18c
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 18d.1.b
    text: |-
      het verrichten van de beoogde gasopslag of de ondersteunende diensten hem of een netbeheerder voor wie hij de
      gasopslag reeds verricht, zou verhinderen zijn in [artikel 10][ref1], [10a][ref2], [42][ref3] en [54a][ref4] en
      [hoofdstuk 2][ref5] bedoelde taak te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref5
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 18d.2
    text: Een weigering als bedoeld in het eerste lid is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18d
  - number: 18e.1
    text: |-
      Geschillen met betrekking tot de wijze waarop een gasopslagbedrijf toepassing geeft aan de [artikelen 18c][ref1]
      en [18d][ref2] worden, met inachtneming van deze wet, overeenkomstig de procedure, zoals opgenomen in
      de [artikelen 59 tot en met 61 van de Mededingingswet][ref3], beslecht door de raad van bestuur van de
      mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel18d
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel59
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 18c
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 18d
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '59'
  - number: 18e.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de door partijen bij het geschil
      te verstrekken gegevens, alsmede met betrekking tot de termijnen voor de gegevensverstrekking.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18e
  - number: 18e.3
    text: |-
      Indien een geschil betrekking heeft op een voorwaarde of een tarief voor het verrichten van gasopslag of die opslag
      ondersteunende diensten, kan de raad van bestuur van de mededingingsautoriteit voor een door hem te bepalen termijn
      die voorwaarde of dat tarief vaststellen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18e
  - number: 18f
    text: De artikelen 72 en 73 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18f
  - number: 18g.1
    text: |-
      Indien dit technisch of economisch noodzakelijk is voor een efficiënte toegang tot gasopslag of die opslag
      ondersteunende diensten, zijn andere gasopslagbedrijven dan de gasopslagbedrijven, bedoeld in artikel 18,
      eerste lid, verplicht, in voorkomend geval tezamen met een verwant bedrijf, met degene die daarom verzoekt te
      onderhandelen over de tarieven en voorwaarden voor het verrichten van gasopslag en die opslag ondersteunende
      diensten met behulp van hun installaties en van één of meer installaties van het verwante bedrijf, voor zover het
      gebruik van die installaties noodzakelijk zijn voor de opslag.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18g
  - number: 18g.2
    text: |-
      De gasopslag en de die opslag ondersteunende diensten worden verricht op grondslag van de tarieven en voorwaarden
      die op grond van het eerste lid zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18g
  - number: 18g.3
    text: |-
      De tarieven en de voorwaarden die het gasopslagbedrijf hanteert voor gasopslag en die opslag ondersteunende
      diensten zijn objectief, transparant en niet discriminatoir.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18g
  - number: 18g.4
    text: |-
      Het gasopslagbedrijf publiceert jaarlijks voor 1 oktober op een geschikte wijze een indicatie van de tarieven
      en voorwaarden die het bedrijf voornemens is in het volgende kalenderjaar te hanteren voor het verrichten van
      gasopslag en die opslag ondersteunende diensten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18g
  - number: 18h.1
    text: |-
      Onze Minister kan voor grote, nieuwe landsgrensoverschrijdende gastransportnetten, LNG-installaties en
      opslaginstallaties op verzoek ontheffing verlenen van de [paragrafen 2.2][ref1], [2.3][ref2], [2.4][ref3] en
      [2.5][ref4], indien wordt voldaan aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
    references:
      - id: ref1
        bwb_id: BWBR0011440
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0011440
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0011440
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 18h.1.a
    text: de aanleg van het net of de installatie versterkt de mededinging bij de levering van gas en de leveringszekerheid,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.1.b
    text: |-
      het risico van de investering nodig voor de aanleg van het net of de installatie is zo groot dat de aanleg niet zal
      plaatsvinden als geen ontheffing wordt verleend,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.1.c
    text: |-
      de eigendom van het net of de installatie berust bij een ander dan de beheerder van het net of de installatie
      waarop het nieuwe net of de nieuwe installatie zal worden aangesloten,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.1.d
    text: de gebruikers van het net of de installatie wordt een tarief in rekening gebracht, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.1.e
    text: |-
      de ontheffing belemmert niet de mededinging op of de doelmatige werking van de interne gasmarkt of de doelmatige
      werking van het net of de installatie waarop het nieuwe net of de nieuwe installatie wordt aangesloten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op aanmerkelijke uitbreidingen van de capaciteit van bestaande
      netten of installaties en op wijzigingen van de bestaande netten of installaties die de ontwikkeling van nieuwe
      bronnen van gasvoorziening bevorderen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.3
    text: |-
      De ontheffing kan betrekking hebben op het gehele nieuwe net of de gehele nieuwe installatie onderscheidenlijk
      de aanmerkelijke uitbreiding of wijziging van een bestaand net of een bestaande installatie dan wel op gedeelten
      daarvan.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.4
    text: |-
      Alvorens Onze Minister beslist op een verzoek om een ontheffing brengt de raad van bestuur van de
      mededingingsautoriteit advies uit. Van het advies wordt uiterlijk tegelijk met de bekendmaking van het besluit op
      de aanvraag kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.5
    text: |-
      Indien sprake is van de aanleg van een landsgrensoverschrijdend net, overlegt Onze Minister met de bevoegde
      instantie in de andere lidstaat of lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.6
    text: |-
      Onze Minister kan voorwaarden aan de ontheffing verbinden die betrekking hebben op de termijn waarvoor de
      ontheffing geldt en de niet-discriminatoire toegang tot het net of de installatie. Hij houdt in ieder geval
      rekening met de lengte van overeenkomsten, de omvang van de nieuwe capaciteit of de wijziging van de bestaande
      capaciteit, de looptijd van het project en de nationale omstandigheden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.7
    text: |-
      Onze Minister kan voorschriften aan de ontheffing verbinden die betrekking hebben op het beheer en de toedeling van
      capaciteit, met dien verstande dat deze voorschriften de uitvoering van overeenkomsten voor een lange termijn niet
      mogen belemmeren.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.8
    text: |-
      Onze Minister beslist zo spoedig mogelijk op een aanvraag om een ontheffing als bedoeld in het eerste lid, doch
      uiterlijk binnen vier maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.9
    text: |-
      Indien Onze Minister een ontheffing als bedoeld in het eerste lid heeft verleend, stelt hij daarvan onverwijld de
      Commissie van de Europese Gemeenschappen in kennis, onder overlegging van alle van belang zijnde gegevens. Deze
      gegevens omvatten in ieder geval de gegevens, bedoeld in artikel 22, vierde lid, onderdelen a tot en met e, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.10
    text: |-
      Indien een definitief besluit van de Commissie van de Europese Gemeenschappen als bedoeld in artikel 30, tweede
      lid, van de richtlijn strekt tot wijzing of intrekking van de ontheffing, geeft Onze Minister daaraan onverwijld
      gevolg.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.11
    text: |-
      Een besluit als bedoeld in het eerste lid treedt niet in werking voordat de termijn, bedoeld in artikel 22,
      vierde lid, van de richtlijn, waarbinnen de Commissie van de Europese Gemeenschappen een verzoek tot wijziging of
      intrekking kan doen, is verstreken. Indien de Commissie van de Europese Gemeenschappen binnen de termijn, genoemd
      in de vorige volzin, een verzoek tot wijziging of intrekking heeft gedaan, treedt het besluit niet in werking
      voordat de Commissie van de Europese Gemeenschappen een definitief besluit als bedoeld in artikel 30, tweede lid,
      van de richtlijn heeft genomen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: 18h.12
    text: |-
      Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant. Van een beslissing bedoeld in
      het tiende lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel18h
  - number: '19.1'
    text: |-
      Een partij die een geschil heeft met een netbeheerder of een LNG-bedrijf over de wijze waarop deze zijn taken en
      bevoegdheden op grond van deze wet uitoefent, dan wel aan zijn verplichtingen op grond van deze wet voldoet, kan
      een klacht bij de raad van bestuur van de mededingingsautoriteit indienen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel19
  - number: '19.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit beslist op een klacht binnen twee maanden na ontvangst ervan.
      Deze termijn kan met twee maanden worden verlengd als de raad van bestuur van de mededingingsautoriteit om
      aanvullende gegevens verzoekt. Met instemming van de klager is verdere verlenging mogelijk.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel19
  - number: '19.3'
    text: De beslissing van de raad van bestuur van de mededingingsautoriteit is bindend.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel19
  - number: '19.4'
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel19
  - number: '20'
    text: |-
      In het geval van een landsgrensoverschrijdend geschil is de raad van bestuur van de mededingingsautoriteit
      onbevoegd te beslissen op een klacht als bedoeld in [artikel 19][ref1], als de netbeheerder of het LNG-bedrijf
      waartegen de klacht is gericht onder de rechtsmacht van een andere lidstaat van de Europese Unie valt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel19
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '32.1'
    text: Een gasbedrijf is verplicht een afzonderlijke boekhouding te voeren voor onderscheidenlijk
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.1.a
    text: |-
      het transport van gas met behulp van de hogedrukleidingen en -installaties van het door hem beheerde
      gastransportnet,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.1.b
    text: het transport van gas met behulp van een door hem beheerd gastransportnet, voor zover niet vallend onder a,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.1.c
    text: de opslag van gas, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.1.d
    text: LNG-activiteiten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.2'
    text: |-
      Indien het gasbedrijf andere, al dan niet met gas verband houdende, activiteiten verricht dan de in het eerste lid
      genoemde, wordt daarvoor eveneens, al dan niet op geconsolideerde basis, een afzonderlijke boekhouding gevoerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.3'
    text: 'De afzonderlijke boekhouding bevat:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.3.a
    text: een balans en een winst- en verliesrekening;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.3.b
    text: |-
      een specificatie van de toerekening van de activa en de passiva en de lasten en baten aan activiteiten als bedoeld
      in het eerste en tweede lid,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.3.c
    text: een specificatie van de inkomsten verkregen uit de eigendom van het door hem beheerde gastransportnet, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.3.d
    text: een toelichting op de gebruikte regels voor de afschrijving.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.4'
    text: Het gasbedrijf geeft in de boekhouding aan welke methoden en criteria bij het opstellen daarvan zijn gehanteerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.5'
    text: |-
      Het toerekenen van kosten aan activiteiten als bedoeld in het eerste en tweede lid geschiedt in overeenstemming met
      het gebruik van financiële of andere middelen voor die activiteiten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.6'
    text: |-
      Wijzigingen in de in het derde lid bedoelde regels voor de afschrijving worden met redenen omkleed in de
      boekhouding vermeld.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.7'
    text: |-
      In de toelichting op de jaarrekening wordt elk verwant bedrijf waarmee een gasbedrijf een overeenkomst heeft
      gesloten waarvan de opbrengst of de kosten een bedrag van € 4 500 000 te boven gaat, vermeld. Daarbij wordt tevens
      per bedrijf het aantal van die overeenkomsten vermeld.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting van de boekhouding
      voor de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '32.9'
    text: Het eerste tot en met het achtste lid zijn niet van toepassing op gasbedrijven die uitsluitend
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.9.a
    text: |-
      gas winnen uit biomassa of uit andere niet-fossiele bronnen en de hoeveelheid gewonnen gas per jaar niet meer
      bedraagt dan 10 000 000 m3 of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: 32.9.b
    text: |-
      anders dan bedrijfsmatig gas leveren overeenkomstig de in [artikel 43, tweede lid, onderdeel b][ref1], bedoelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '32.10'
    text: |-
      Indien een gasbedrijf niet reeds uit hoofde van een wettelijke verplichting zijn jaarrekening of een daarmee
      overeenkomend financieel overzicht openbaar maakt, legt het zijn jaarrekening of dat overzicht voor een ieder ter
      inzage op het kantoor van zijn hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel32
  - number: '34.1'
    text: |-
      Onze Minister kan verlangen dat een gasbedrijf, een gas- of elektriciteitsbeurs, een netgebruiker of een afnemer
      hem inzage geeft in gegevens en bescheiden, onderscheidenlijk hem gegevens en inlichtingen verstrekt, die hij nodig
      heeft voor de uitvoering van de hem in deze wet of de verordening opgedragen taken en voor het opstellen van het in
      [artikel 52][ref1] bedoelde energierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel52
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '34.2'
    text: |-
      Degene aan wie een verzoek is gedaan inzage te geven in gegevens en bescheiden onderscheidenlijk gegevens
      en inlichtingen te verstrekken, is verplicht binnen de door Onze Minister te stellen redelijke termijn alle
      medewerking te verlenen die hij redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel34
  - number: '34.3'
    text: |-
      Onze Minister gebruikt bescheiden, gegevens of inlichtingen over het gasbedrijf, een gas- of elektriciteitsbeurs,
      een netgebruiker of een afnemer, welke hij heeft verkregen in verband met enige werkzaamheid ten behoeve van de
      uitvoering van een van zijn taken op grond van deze wet of de verordening, uitsluitend voor de uitvoering van deze
      wet of de verordening.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel34
  - number: '34.4'
    text: |-
      Indien Onze Minister op grond van [artikel 10a, eerste lid, onderdeel f][ref1], de netbeheerder van het landelijk
      gastransportnet opdraagt werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in [artikel 52a][ref2],
      zijn het eerste tot en met derde lid van overeenkomstige toepassing op die netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel52a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 52a
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '35'
    text: |-
      [Artikel 34][ref1] is van overeenkomstige toepassing op de raad van bestuur van de mededingingsautoriteit,
      voor zover hij inlichtingen en gegevens nodig heeft voor de uitvoering van zijn taken op grond van deze
      wet of de verordening, met dien verstande dat hij de door hem verkregen inlichtingen en gegevens ook
      kan gebruiken in verband met de toepassing van de [Mededingingswet][ref2], de [artikelen 4.4][ref3] en
      [4.5 van de Wet handhaving consumentenbescherming][ref4] en de [Elektriciteitswet 1998][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008691
      [ref3]: https://wetten.overheid.nl/BWBR0020586#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020586#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0008691
      - id: ref3
        bwb_id: BWBR0020586
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0020586
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0009755
  - number: 35a.1
    text: Een netbeheerder houdt een registratie bij van kwaliteitsindicatoren betreffende het transport van gas.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.2
    text: |-
      De netbeheerder zendt de raad van bestuur van de mededingingsautoriteit voor 1 maart van elk jaar een afschrift
      van de registratie van het voorafgaande jaar tezamen met een rapportage daarover waarin in elk geval de wijzigingen
      ten opzichte van het daaraan voorafgaande jaar zijn toegelicht. De netbeheerder maakt eveneens voor het tijdstip,
      bedoeld in de eerste volzin, de rapportage op een geschikte wijze openbaar.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.3
    text: De netbeheerder bewaart de registratiegegevens ten minste tien jaar.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.4
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan onderzoek doen naar de deugdelijkheid van de registratie,
      in het bijzonder doch niet uitsluitend door in het gastransportnet van de desbetreffende netbeheerder metingen te
      verrichten of te doen verrichten. De netbeheerder gedoogt dat de metingen in zijn net worden verricht.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.5
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.5.a
    text: de inhoud van de registratie en de wijze van registreren;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.5.b
    text: de kwaliteitsindicatoren die in de registratie zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.5.c
    text: de rapportage.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35a.6
    text: |-
      De in het vijfde lid bedoelde ministeriële regeling kan, ten behoeve van het toezicht op de naleving van dit
      artikel, mede inhouden dat een door een geaccrediteerde instelling aan een netbeheerder verstrekt certificaat
      van conformiteit aan het bepaalde bij of krachtens dit artikel, het vermoeden oplevert dat de netbeheerder
      overeenkomstig het bepaalde bij of krachtens dit artikel uitvoering geeft aan de verplichting tot registratie.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35a
  - number: 35b.1
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk gastransportnet, verstrekt binnen zes
      maanden na afloop van ieder kalenderjaar aan de raad van bestuur van de mededingingsautoriteit:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35b
  - number: 35b.1.a
    text: |-
      een overzicht van de door hem gesloten overeenkomsten met betrekking tot het verrichten van diensten ten behoeve
      van het netbeheer, vergezeld van afschriften van die overeenkomsten, voorzover de raad van bestuur van de
      mededingingsautoriteit daarover niet reeds beschikt,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35b
  - number: 35b.1.b
    text: |-
      een overzicht van het aantal personen dat bij de netbeheerder werkzaam is ter uitvoering van de in
      [artikelen 10][ref1], [42][ref2] en [hoofdstuk 2][ref3] genoemde taken,


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 35b.1.c
    text: een overzicht van in het afgelopen jaar gerealiseerde investeringen in het gastransportnet,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35b
  - number: 35b.1.d
    text: |-
      een overzicht van de financiële middelen waarover hij beschikt ten behoeve van de uitvoering van zijn wettelijke
      taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken beschikbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35b
  - number: 35b.1.e
    text: een verklaring van een onafhankelijke deskundige omtrent het in onderdeel d bedoelde overzicht.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35b
  - number: 35b.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de overzichten, bedoeld in het eerste
      lid, onderdelen a tot en met d, en de verklaring, bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35b
  - number: 35c
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk gastransportnet, draagt er zorg voor dat de
      afnemers die op zijn gastransportnet zijn aangesloten een overzicht ontvangen waarop de kosten in verband met die
      aansluiting overzichtelijk en begrijpelijk zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35c
  - number: 35d.1
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk gastransportnet, voorziet in een procedure
      voor de behandeling van klachten van afnemers over het netbeheer.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35d
  - number: 35d.2
    text: 'De in het eerste lid bedoelde procedure voorziet er ten minste in dat:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35d
  - number: 35d.2.a
    text: |-
      de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35d
  - number: 35d.2.b
    text: |-
      de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht en
      van de conclusies die daaraan worden verbonden, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35d
  - number: 35d.2.c
    text: de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35d
  - number: 35e.1
    text: |-
      Een netbeheerder draagt er, al dan niet samen met een of meer andere netbeheerders, zorg voor dat onderbrekingen
      in het transport van gas en waarnemingen van gaslucht door afnemers op een eenvoudige wijze gemeld kunnen worden en
      maakt aan afnemers bekend op welke wijze deze meldingen kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35e
  - number: 35e.2
    text: |-
      Een netbeheerder registreert, al dan niet samen met andere netbeheerders, van de gemelde onderbrekingen en
      waarnemingen, de datum en het tijdstip en, met betrekking tot onderbrekingen, het begin van de onderbrekingen,
      de duur van de onderbrekingen, de locatie, aard en oorzaak van de onderbrekingen alsmede het aantal getroffen
      afnemers.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35e
  - number: 35e.3
    text: |-
      Een netbeheerder maakt de actuele stand van zaken betreffende de geregistreerde onderbrekingen en waarnemingen
      in zijn net op geschikte wijze openbaar en vermeldt daarbij de datum en het tijdstip en, met betrekking tot
      onderbrekingen, het begin van de onderbrekingen, de duur van de onderbrekingen, de locatie, aard en oorzaak van de
      onderbrekingen alsmede het aantal getroffen afnemers.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel35e
  - number: '37.1'
    text: |-
      Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf dat bij de uitvoering van zijn taak de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit
      zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel37
  - number: '37.2'
    text: |-
      Indien een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf gegevens over zijn bedrijfsvoering die commercieel
      voordeel kunnen opleveren ter beschikking stelt aan anderen, doet hij dit op niet-discriminatoire wijze.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel37
  - number: '37.3'
    text: |-
      Een netbeheerder maakt bij de aankoop of de verkoop van gas door een verwant bedrijf geen misbruik van commercieel
      gevoelige gegevens van anderen die hij heeft verkregen bij onderhandelingen over transport of bij het verrichten
      van transport.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel37
  - number: '37.4'
    text: |-
      Een netbeheerder gebruikt aan hem verstrekte gegevens over afnemers als bedoeld in [artikel 43, eerste lid][ref1],
      uitsluitend voor het uitvoeren van zijn taken op grond van deze wet, met dien verstande dat deze gegevens mede
      kunnen worden gebruikt voor het ten behoeve van de vergunninghouder innen van de vergoeding voor het leveren van
      gas.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '38.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit is de bevoegde instantie als bedoeld in artikel 6, vierde lid,
      van de verordening. Hij keurt, overeenkomstig artikel 6, vierde lid, van de verordening de relevante punten van het
      landelijk gastransportnet, goed.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel38
  - number: '38.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit is de bevoegde instantie die overeenkomstig artikel 6, vijfde
      lid, van de verordening beslist op een verzoek van de netbeheerder van het landelijk gastransportnet tot beperking
      van de publicatie van de in dat artikel bedoelde informatie.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel38
  - number: '38.3'
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet niet in staat is de informatie te publiceren in
      overeenstemming met de verordening stelt hij na overleg met de raad van bestuur van de mededingingsautoriteit een
      actieplan vast voor de uitvoering.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel38
  - number: 38a
    text: |-
      De netbeheerder van het landelijk gastransportnet geeft de raad van bestuur van de mededingingsautoriteit kennis
      van de overeenkomsten en procedures, bedoeld in artikel 8 van de verordening.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel38a
  - number: 38b
    text: |-
      Onze Minister en de raad van bestuur van de mededingingsautoriteit verstrekken de Commissie van de Europese
      Gemeenschappen desgevraagd overeenkomstig artikel 11 van de verordening alle voor de toepassing van artikel 9 van
      de verordening noodzakelijke informatie.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel38b
  - number: '39.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aan te wijzen gebieden regels worden
      gesteld over de wijze waarop, gelet op het belang van een betrouwbaar, duurzaam en doelmatig functionerende
      energiehuishouding, een afweging wordt gemaakt met betrekking tot de aanleg van een gastransportnet en de aanleg
      van leidingen voor het transport van elektriciteit of warmte.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel39
  - number: '39.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een gastransportnet slechts wordt aangelegd als resultaat
      van een openbare procedure waarin gegadigden op een te plaatsen opdracht kunnen inschrijven met een aanbieding voor
      de aanleg van een gastransportnet of van leidingen voor het transport van elektriciteit of warmte.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel39
  - number: 39a
    text: |-
      Een gastransportnet dat door een netbeheerder in het kader van de uitoefening van zijn taak, bedoeld in artikel
      10, in werking wordt gehouden, onderhouden of ontwikkeld, wordt voor de toepassing van de [Belemmeringenwet
      Verordeningen](onbekend) en de [Belemmeringenwet Privaatrecht](onbekend) aangemerkt als openbaar werk van algemeen
      nut.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel39a
  - number: '40.1'
    text: |-
      Een gasbedrijf dat gas levert aan eindafnemers heeft tot taak, mede gelet op het belang van bescherming van het
      milieu, bedoeld in artikel 3, tweede lid, van de richtlijn, te bevorderen dat gas door hemzelf en door afnemers op
      een doelmatige en milieuhygiënisch verantwoorde wijze wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel40
  - number: '40.2'
    text: |-
      Ieder gasbedrijf dat per jaar meer dan 10 000 000 m3 gas aan eindafnemers levert, meldt eenmaal in elke twee jaar
      vóór 1 maart aan Onze Minister op welke wijze hij in de twee jaar voorafgaande aan het jaar, waarin de melding
      wordt verricht, uitvoering heeft gegeven aan zijn taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel40
  - number: '40.3'
    text: |-
      Bij het opstellen van de tariefstructuren en de voorwaarden, bedoeld in [artikel 12a][ref1] of [12b][ref2] en bij
      het sluiten van overeenkomsten voor het verrichten van transport van gas en dat transport ondersteunende diensten
      neemt de netbeheerder het belang van een duurzame, doelmatige en milieuhygiënische energievoorziening in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '40.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de invulling van de taak, bedoeld
      in het eerste lid, en worden criteria gegeven waaraan de uitvoering van die taak door het gasbedrijf zal worden
      getoetst.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel40
  - number: '42'
    text: |-
      De netbeheerder die de aansluiting verzorgt bij afnemers heeft in het kader van het transport van gas naar
      die afnemers tot taak het bevorderen van de veiligheid bij het gebruik van toestellen en installaties die gas
      verbruiken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel42
  - number: '43.1'
    text: |-
      Het is verboden zonder vergunning gas te leveren aan afnemers die naar een op het verbruik in voorgaande jaren
      gegronde verwachting minder dan 170 000 m3 gas per jaar verbruiken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel43
  - number: '43.2'
    text: 'Het verbod geldt niet ten aanzien van het leveren van gas:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel43
  - number: 43.2.a
    text: |-
      door een buiten Nederland gevestigde leverancier van gas aan ten hoogste 500 afnemers, als bedoeld in het eerste
      lid, die wonen in gebieden aan de Nederlandse landsgrens of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel43
  - number: 43.2.b
    text: indien het gas anders dan bedrijfsmatig wordt geleverd overeenkomstig bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel43
  - number: 43.2.c
    text: |-
      indien het gas wordt geleverd in het kader van een overeenkomst als bedoeld in [artikel 52c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 52c
        hoofdstuk: '5'
        paragraaf: 5.3a
  - number: '43.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze van vaststelling van het jaarlijks gasverbruik van
      de in het eerste lid bedoelde afnemers.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel43
  - number: '44.1'
    text: |-
      Een houder van een vergunning heeft de plicht op een betrouwbare wijze en tegen redelijke tarieven en voorwaarden
      zorg te dragen voor de levering van gas aan iedere in [artikel 43, eerste lid][ref1], bedoelde afnemer die daarom
      verzoekt. De voorwaarden zijn in ieder geval niet redelijk als zij niet in overeenstemming zijn met het bepaalde
      bij of krachtens [artikel 52b][ref2]. De [artikelen 236][ref3] en [237 van Boek 6 van het Burgerlijk Wetboek][ref4]
      zijn mede van toepassing op voorwaarden in overeenkomsten met afnemers die rechtspersoon zijn of handelen in de
      uitoefening van een beroep en bedrijf. [Artikel 14, vierde lid][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel52b
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel237
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel14
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 52b
        hoofdstuk: '5'
        paragraaf: 5.3a
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '237'
      - id: ref5
        bwb_id: BWBR0011440
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '44.2'
    text: |-
      Een houder van een vergunning verschaft de raad van bestuur van de mededingingsautoriteit ieder jaar en vier weken
      voor de wijziging van de tarieven een opgave van de tarieven die hij berekent en de voorwaarden die hij gebruikt
      bij de levering van gas aan de in [artikel 43, eerste lid][ref1], bedoelde afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '44.3'
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit van oordeel is dat de tarieven die houders van een
      vergunning berekenen onredelijk zijn, omdat daarin de effecten van een doelmatige bedrijfsvoering, die mede inhoudt
      de inkoop van gas, in onvoldoende mate leiden tot kostenverlaging, kan hij een tarief vaststellen dat leveranciers
      ten hoogste mogen berekenen voor de levering van gas aan afnemers als bedoeld in [artikel 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '44.4'
    text: |-
      Na de vaststelling van het maximumtarief, bedoeld in het derde lid, worden de tarieven voor de levering van gas
      aan afnemers als bedoeld in [artikel 43][ref1] die hoger zijn dan dat maximumtarief, van rechtswege gesteld op
      dat maximumtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '44.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de bepaling of de
      tarieven, bedoeld in het tweede lid, onredelijk zijn en tot vaststelling van het maximumtarief, bedoeld in het
      derde lid. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
  - number: '44.6'
    text: |-
      Het tweede tot en met het zesde lid vervallen op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor
      een krachtens dit lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan vier weken nadat het ontwerp
      aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
  - number: '44.7'
    text: |-
      Een netbeheerder en een vergunninghouder voeren een beleid, gericht op het voorkomen van het afsluiten van een
      afnemer als bedoeld in [artikel 43, eerste lid][ref1], in de periode van 1 oktober tot 1 april van enig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '44.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het beëindigen van de levering van gas aan een afnemer
      als bedoeld in [artikel 43, eerste lid][ref1], in de periode van 1 oktober tot 1 april van enig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '45.1'
    text: 'Onze Minister verleent op aanvraag een vergunning indien de aanvrager genoegzaam aantoont dat hij:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel45
  - number: 45.1.a
    text: |-
      beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taak;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel45
  - number: 45.1.b
    text: redelijkerwijs in staat kan worden geacht de verplichtingen als opgenomen in dit hoofdstuk na te komen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel45
  - number: '45.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van en de procedure
      voor aanvraag van een vergunning en de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel45
  - number: '46.1'
    text: Onze Minister kan voorschriften en beperkingen verbinden aan een vergunning.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel46
  - number: '46.2'
    text: Onze Minister kan de aan een vergunning verbonden voorschriften of beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel46
  - number: '46.3'
    text: |-
      Een vergunning kan slechts worden overgedragen aan een andere houder van een vergunning met toestemming van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel46
  - number: '46.4'
    text: |-
      [Artikel 45][ref1] is van overeenkomstige toepassing ten aanzien van het verlenen van toestemming als bedoeld in
      het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel45
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '47.1'
    text: 'Onze Minister kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
  - number: 47.1.a
    text: de houder van de vergunning dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
  - number: 47.1.b
    text: |-
      de houder van de vergunning in onvoldoende mate voldoet aan de verplichting, bedoeld in [artikel 44][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel44
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 47.1.c
    text: de houder van de vergunning de in de vergunning opgenomen voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
  - number: 47.1.d
    text: |-
      de houder van de vergunning bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
  - number: 47.1.e
    text: |-
      de houder van de vergunning naar het oordeel van Onze Minister om andere redenen niet langer in staat moet worden
      geacht de vergunde activiteit of in de vergunning opgenomen voorschriften na te komen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
  - number: 47.1.f
    text: |-
      de houder van de vergunning de voorschriften bij of krachtens [artikel 52b][ref1] niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel52b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 52b
        hoofdstuk: '5'
        paragraaf: 5.3a
  - number: '47.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de tijdelijke
      voorzieningen en de procedure bij intrekking van een vergunning.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel47
  - number: '48.1'
    text: |-
      [Artikel 37, eerste lid][ref1], is van overeenkomstige toepassing op een houder van een vergunning ten aanzien van
      door hem verkregen gegevens van afnemers als bedoeld in [artikel 43, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '49'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens de
      [artikelen 43 tot en met 46][ref1] gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '51.1'
    text: |-
      Onze Minister stelt na overleg met de gezamenlijke netbeheerders en representatieve organisaties van netgebruikers
      op de gasmarkt, en met inachtneming van het bepaalde in [artikel 10a, vierde lid][ref1], een calamiteitenplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '51.2'
    text: Het besluit tot vaststelling van het calamiteitenplan wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel51
  - number: '52'
    text: |-
      Het in [artikel 2 van de Elektriciteitswet 1998][ref1] bedoelde energierapport geeft mede richting aan van
      rijkswege te nemen beslissingen in de periode, bedoeld in dat artikel, voor zover daarbij het belang van het
      betrouwbaar, duurzaam en doelmatig functioneren van de gasvoorziening in beschouwing moet of kan worden genomen.
      Het energierapport bevat tevens een prognose betreffende het nationaal en internationaal gasreservebeleid voor een
      periode van 50 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '2'
  - number: 52a.1
    text: |-
      Onze Minister verzamelt, analyseert en bewerkt systematisch inlichtingen en gegevens met betrekking tot de
      leverings- en voorzieningzekerheid, in het bijzonder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.1.a
    text: het evenwicht van vraag en aanbod op de nationale markt,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.1.b
    text: het niveau van de verwachte toekomstige vraag en de beschikbare voorraden,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.1.c
    text: de extra capaciteit aan geplande of in aanbouw zijnde infrastructuur,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.1.d
    text: de kwaliteit en de staat van onderhoud van de netten, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.1.e
    text: de maatregelen in geval van piekbelasting of het in gebreke blijven van een of meerdere leveranciers.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.2
    text: |-
      Onze Minister publiceert jaarlijks uiterlijk op 31 juli op geschikte wijze een verslag van zijn bevindingen die
      het verzamelen, analyseren en bewerken van de inlichtingen en gegevens over de onderwerpen, genoemd in het eerste
      lid, heeft opgeleverd, alsmede van de getroffen of voorgenomen maatregelen met betrekking tot die onderwerpen.
      Hij zendt het verslag onverwijld naar de Commissie van de Europese Gemeenschappen en doet mededeling ervan in de
      Staatscourant, onder vermelding van de wijze waarop het verslag kan worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.3
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kunnen bij ministeriële regeling nadere regels worden
      gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.3.a
    text: de gegevens en inlichtingen waarvan Onze Minister kan verlangen dat zij hem worden verstrekt,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.3.b
    text: |-
      degenen van wie Onze Minister, onverminderd artikel 34, kan verlangen dat zij hem gegevens en inlichtingen
      verstrekken, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52a.3.c
    text: |-
      de termijn waarbinnen, de wijze waarop en de vorm waarin de gegevens en inlichtingen aan Onze Minister worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52a
  - number: 52b.1
    text: |-
      Het is verboden oneerlijke en misleidende verkoopmethoden te hanteren voor de levering en het transport van gas aan
      afnemers als bedoeld in [artikel 43, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52b.2
    text: |-
      De voorwaarden, verbonden aan een leverings- of transportovereenkomst met een afnemer als bedoeld in
      [artikel 43, eerste lid][ref1], zijn transparant, eerlijk en vooraf bekend. De voorwaarden worden in ieder geval
      voor het sluiten van de overeenkomst verstrekt en zijn gesteld in duidelijke en begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52b.3
    text: |-
      Leveranciers en netbeheerders zorgen ervoor dat afnemers als bedoeld in [artikel 43, eerste lid][ref1], te allen
      tijde transparante informatie kunnen krijgen over de geldende tarieven en voorwaarden voor levering en transport
      van gas.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52b.4
    text: |-
      Het is verboden voor de houder van een vergunning om op zodanige wijze afnemers als bedoeld in
      [artikel 43, eerste lid][ref1], te benaderen dat onduidelijkheid bestaat over het feit dat een contract is
      afgesloten, de duur van het contract, de voorwaarden voor verlenging en beëindiging van het contract, het bestaan
      van een recht op opzegging en de voorwaarden van opzegging.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52b.5
    text: Een contract, gesloten in strijd met het bepaalde bij of krachtens dit artikel is vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6
    text: 'Onder misleidende verkoopmethoden, bedoeld in het eerste lid, wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.a
    text: beweren een gedragscode te hebben ondertekend wanneer dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.b
    text: |-
      een vertrouwens-, kwaliteits- of ander soortgelijk label aanbrengen zonder daarvoor de vereiste toestemming te
      hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.c
    text: beweren dat een gedragscode door een publieke of andere instantie is erkend wanneer dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.d
    text: |-
      beweren dat de levering of het transport van gas door een openbare of particuliere instelling is aanbevolen, erkend
      of goedgekeurd terwijl zulks niet het geval is, of iets dergelijks beweren zonder dat aan de voorwaarde voor de
      aanbeveling, erkenning of goedkeuring word voldaan;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.e
    text: |-
      de levering en het transport van gas tegen een genoemde prijs aan te bieden zonder dat wordt aangegeven dat er
      een gegrond vermoeden bestaat dat de levering of het transport van gas niet tegen die prijs kan worden geleverd
      gedurende een periode en in hoeveelheden, die rekening houdend met het product, de omvang van de voor het product
      gevoerde reclame en de aangeboden prijs redelijk zijn;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.f
    text: |-
      de levering of het transport van gas tegen een genoemde prijs te koop aanbieden en vervolgens weigeren een
      bestelling op te nemen of het product binnen een redelijke termijn te leveren;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.g
    text: |-
      beloven dat de afnemer met wie de leverancier of netbeheerder voorafgaand aan de transactie heeft gecommuniceerd
      in een andere taal dan Nederlands, een klantendienst te verschaffen en deze dienst vervolgens enkel beschikbaar
      stellen in een andere taal zonder dit duidelijk aan de afnemer te laten weten alvorens deze zich tot de transactie
      verbindt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.h
    text: |-
      wettelijke rechten van de afnemer voorstellen als een onderscheidend kenmerk van het aanbod van de leverancier
      of netbeheerder;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.i
    text: |-
      redactionele inhoud in de media, waarvoor de leverancier of netbeheerder heeft betaald, gebruiken om reclame te
      maken voor de levering of het transport van gas, zonder dat dit duidelijk uit de inhoud of uit duidelijk door de
      afnemer identificeerbare beelden of geluiden blijkt, zulks onverminderd het bepaalde in [richtlijn 89/552/EEG]
      (31989L0552);
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.j
    text: |-
      een pyramidesysteem opzetten, beheren of promoten waarbij de afnemer tegen betaling kans maakt op een vergoeding
      die eerder voortkomt uit het aanbrengen van nieuwe afnemers in het systeem dan uit de levering of het transport
      van gas;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.k
    text: |-
      nalaten de in de bijlage bij de verordening betreffende verkoopsbevordering vermelde informatie te verstrekken,
      of bij de uitvoering van de voorschriften van deze bijlage onjuiste, onduidelijke of dubbelzinnige informatie te
      verstrekken;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.l
    text: beweren dat producten het winnen bij kansspelen kunnen vergemakkelijken;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.m
    text: |-
      materieel onjuiste informatie verstrekken over marktomstandigheden of de mogelijkheid het product te bemachtigen
      met de bedoeling de afnemer het product te doen aanschaffen tegen voorwaarden die minder gunstig zijn dan de
      normale marktvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.n
    text: |-
      in de context van een handelspraktijk beweren dat er een wedstrijd wordt georganiseerd of prijzen worden uitgeloofd
      zonder de aangekondigde prijzen of een redelijk alternatief daadwerkelijk toe te kennen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.o
    text: |-
      een product als bij voorbeeld «gratis», «voor niets», «kosteloos» omschrijven als de afnemer iets anders moet
      betalen dan de onvermijdelijke kosten om in te gaan op het aanbod, en het product af te halen dan wel dit te laten
      bezorgen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.6.p
    text: |-
      marketingmateriaal voorzien van een factuur of een soortgelijk document waarin om betaling wordt gevraagd, waardoor
      bij de afnemer de indruk wordt gewekt dat hij het aangeprezen product al heeft besteld terwijl dat niet het geval
      is.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7
    text: 'Onder oneerlijke verkoopmethoden, bedoeld in het eerste lid, wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7.a
    text: de indruk wekken dat de afnemer het pand niet mag verlaten alvorens er een overeenkomst is opgesteld;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7.b
    text: |-
      de afnemer thuis opzoeken en zijn verzoek om weg te gaan of niet meer terug te komen, negeren, behalve indien, en
      voor zover gerechtvaardigd volgens de geldende wet- en regelgeving wordt beoogd een contractuele verplichting te
      doen naleven;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7.c
    text: |-
      hardnekkig en ongewenst aandringen per telefoon, fax, e-mail of andere afstandmedia behalve indien, er voor
      zover gerechtvaardigd volgens de geldende wet- en regelgeving, wordt beoogd een contractuele verplichting te doen
      naleven;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7.d
    text: |-
      in reclame kinderen rechtstreeks oproepen hun ouders of andere volwassenen ertoe over te halen producten, waarvoor
      reclame wordt gemaakt, voor hen te kopen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7.e
    text: |-
      vragen om onmiddellijke dan wel uitgestelde betaling voor producten die de leverancier of netbeheerder heeft
      geleverd, maar waar de afnemer niet om heeft gevraagd, tenzij het product een vervangingsgoed is als bedoeld in
      artikel 7, derde lid, van [richtlijn 97/7/EG](31997L0007) betreffende op afstand gesloten overeenkomsten (niet-
      gevraagde leveringen);
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7.f
    text: |-
      de afnemer uitdrukkelijk meedelen dat, als hij het product of de dienst niet koopt, de baan of de bestaansmiddelen
      van de leverancier of netbeheerder in het gedrang komen;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.7.g
    text: |-
      de indruk wekken dat de afnemer al een prijs heeft gewonnen zonder een aankoop te verrichten, als de prijs in feite
      pas bij transport of levering van gas kan worden gewonnen of toegekend.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.8
    text: |-
      Een leverancier biedt een afnemer als bedoeld in [artikel 43, eerste lid][ref1], ten minste een overeenkomst voor
      de levering van gas voor een onbepaalde duur aan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52b.9
    text: |-
      Indien de afnemer als bedoeld in [artikel 43, eerste lid][ref1], geen uitdrukkelijke keuze maakt voor een
      overeenkomst voor bepaalde duur, wordt hij geacht gekozen te hebben voor een overeenkomst voor onbepaalde duur.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52b.10
    text: |-
      Een afnemer als bedoeld in [artikel 43, eerste lid][ref1], kan elke overeenkomst tot levering van gas beëindigen
      met inachtneming van een termijn van dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52b.11
    text: |-
      Indien sprake is van een overeenkomst voor bepaalde duur, kan de leverancier in deze overeenkomst opnemen dat bij
      tussentijdse beëindiging van de overeenkomst de afnemer een redelijke vergoeding is verschuldigd. Indien sprake is
      van een overeenkomst voor onbepaalde duur, kan een dergelijke vergoeding niet in de overeenkomst worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
  - number: 52b.12
    text: |-
      Bij ministeriële regeling worden ter implementatie van de richtlijn nadere regels gesteld over bescherming van
      afnemers als bedoeld in [artikel 43, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 52c.1
    text: |-
      Van de [artikelen 44][ref1] en [52b, tweede, derde en achtste tot en met twaalfde lid][ref2], kan worden afgeweken
      indien er sprake is van een overeenkomst tot levering van gas aan een groep afnemers, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel52b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 52b
        hoofdstuk: '5'
        paragraaf: 5.3a
  - number: 52c.1.a
    text: de meerderheid van deze afnemers rechtspersoon is of handelt in de uitoefening van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52c
  - number: 52c.1.b
    text: alle afnemers in de overeenkomst vertegenwoordigd worden;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52c
  - number: 52c.1.c
    text: |-
      deze vertegenwoordiger er zorg voor draagt dat hij ten aanzien van alle aansluitingen met een verbruik van minder
      dan 170 000 m3 gas per jaar over toestemming tot vertegenwoordiging in het kader van de overeenkomst beschikt.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel52c
  - number: '54.1'
    text: |-
      In het belang van het planmatig beheer van voorkomens van gas, ter verzekering op lange termijn van een behoedzaam
      en rationeel gebruik van deze natuurlijke hulpbron, verricht Gasunie Trade & Supply B.V. de volgende taken:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54
  - number: 54.1.a
    text: |-
      het zorg dragen voor de afname van gas dat wordt gewonnen in het gebied dat is aangewezen in de bij koninklijk
      besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende winningsvergunning, op een wijze die ook mogelijk maakt het
      winnen van gas in andere gebieden binnen Nederland en het in [artikel 17][ref1] bedoelde gebied in het planmatig
      beheer te betrekken;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel17
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 54.1.b
    text: |-
      het op verzoek van houders van een andere Nederlandse winningsvergunning dan bedoeld in onderdeel a, dan wel
      van degene met wie voor het gebruik van die vergunning een overeenkomst is gesloten inzake het voor gezamenlijke
      rekening winnen van gas, zorg dragen voor de afname van gas dat wordt gewonnen in het gebied waarop de
      winningsvergunning betrekking heeft, onder redelijke voorwaarden en tegen betaling van een op marktconforme
      grondslag bepaalde vergoeding;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54
  - number: 54.1.c
    text: |-
      het jaarlijks aan Onze Minister overleggen van een overzicht waarin ten aanzien van de eerstvolgende twintig jaar
      ramingen zijn opgenomen met betrekking tot de uitoefening van de taken, bedoeld in de onderdelen a en b, onder
      vermelding van daarbij gehanteerde vooronderstellingen en relevante onderscheidingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54
  - number: '54.2'
    text: |-
      Onze Minister kan de in het eerste lid bedoelde rechtspersoon tijdelijk ontheffing verlenen van de in het eerste
      lid, onder b, bedoelde verplichting, indien deze rechtspersoon door naleving van die verplichting ernstige
      economische en financiële moeilijkheden ondervindt of dreigt te ondervinden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54
  - number: 54a.1
    text: |-
      Onverminderd de artikelen 10 en 10a heeft de netbeheerder van het landelijk gastransportnet, in het belang van het
      planmatig beheer van voorkomens van gas, ter verzekering op lange termijn van een behoedzaam en rationeel gebruik
      van deze natuurlijke hulpbron, tevens tot taak:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54a
  - number: 54a.1.a
    text: |-
      ten behoeve van de inname van gas uit de gasvoorkomens in gebieden binnen Nederland en het in artikel 17 bedoelde
      gebied punten in het gastransportnet te ontwikkelen waar gas wordt ingevoerd;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54a
  - number: 54a.1.b
    text: |-
      het jaarlijks aan Onze Minister overleggen van een overzicht waarin ten aanzien van de eerstvolgende twintig jaar
      ramingen zijn opgenomen met betrekking tot de uitoefening van de taak, bedoeld in onderdeel a, onder vermelding van
      daarbij gehanteerde vooronderstellingen en relevante onderscheidingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54a
  - number: 54a.2
    text: |-
      Onze Minister kan de netbeheerder van het landelijk gastransportnet ontheffing verlenen van de in het eerste lid,
      onder a, bedoelde verplichting, indien deze door naleving van die verplichting ernstige economische en financiële
      moeilijkheden ondervindt of dreigt te ondervinden. Aan de ontheffing kunnen voorschriften worden verbonden met
      betrekking tot de voorwaarden waaronder ontheffing wordt verleend en de duur van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54a
  - number: 54b.1
    text: |-
      De netbeheerder van het landelijk gastransportnet kan, ten einde te waarborgen dat hij de taken, bedoeld in artikel
      54a, zo doelmatig mogelijk kan uitvoeren, voorwaarden stellen aan de wijze waarop het gas van de houders van
      Nederlandse winningsvergunningen dan wel degene met wie voor het gebruik van die vergunning een overeenkomst is
      gesloten inzake het voor gezamenlijke rekening winnen van gas, wordt ingenomen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54b
  - number: 54b.2
    text: |-
      Gasbedrijven, netgebruikers en afnemers verstrekken de netbeheerder van het landelijk gastransportnet desgevraagd
      tijdig voldoende inlichtingen en gegevens om te waarborgen dat hij de taken, bedoeld in het eerste lid kan
      uitvoeren.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54b
  - number: 54b.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in het eerste lid bedoelde voorwaarden en
      de in het tweede lid genoemde gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel54b
  - number: '55.1'
    text: |-
      Onze Minister stelt tenminste eenmaal in de vijf jaar vast van welke hoeveelheid gas, dat wordt gewonnen
      uit het Groningen veld op basis van de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende
      winningsvergunning, Gasunie Trade & Supply B.V. uit mag gaan bij de uitvoering van de taken, bedoeld in
      [artikel 54, eerste lid, onderdelen a en b][ref1]. Bij iedere vaststelling geeft Onze Minister aan welke
      hoeveelheid de komende tien jaar ten hoogste gemiddeld per jaar mag worden gewonnen. De vaststelling
      maakt onderdeel uit van de voorschriften aan de houder van bovengenoemde winningsvergunning als bedoeld in
      [artikel 36, tweede en derde lid, van de Mijnbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel36
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '36'
  - number: '55.2'
    text: |-
      Onze Minister kan Gasunie Trade & Supply B.V. aanwijzingen geven in het belang van een goede vervulling van zijn in
      [artikel 54, eerste lid][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '55.3'
    text: |-
      Onze Minister kan de netbeheerder van het landelijk gastransportnet aanwijzingen geven in het belang van een goede
      vervulling van de in [artikel 54a, eerste lid][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '55.4'
    text: Een aanwijzing als bedoeld in het tweede lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel55
  - number: '56.1'
    text: |-
      Gasunie Trade & Supply B.V. verstrekt Onze Minister alle inlichtingen die hij nodig heeft voor de toepassing
      van [artikel 54, tweede lid][ref1], en [artikel 55][ref2]. Die inlichtingen omvatten in ieder geval
      de voorwaarden en de vergoeding die deze rechtspersoon hanteert voor de afname van gas als bedoeld in
      [artikel 54, eerste lid, onder b][ref3], alsmede wijzigingen daarin.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel54
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '56.2'
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt Onze Minister alle inlichtingen die hij nodig heeft
      voor de toepassing van [artikel 54a, tweede lid][ref1], en [artikel 55, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel55
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '57.1'
    text: |-
      Onze Minister kan, ingeval Gasunie Trade & Supply B.V. nalaat een van haar taken, bedoeld in
      [artikel 54, eerste lid][ref1], te vervullen, of een aanwijzing van Onze Minister als bedoeld in
      [artikel 55, tweede lid][ref2], niet opvolgt, een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel55
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '57.2'
    text: |-
      Onze Minister kan, ingeval de netbeheerder van het landelijk gastransportnet nalaat een van haar taken,
      bedoeld in [artikel 54a, eerste lid][ref1], te vervullen, of een aanwijzing van Onze Minister als bedoeld in
      [artikel 55, derde lid][ref2], niet opvolgt, een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel55
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '57.3'
    text: |-
      De [artikelen 5:32, vierde en vijfde lid][ref1], [5:33][ref2], [5:34][ref3] en
      [5:35 van de Algemene wet bestuursrecht][ref4] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '59.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van
      [paragraaf 1.2][ref1] en van de [artikelen 54 tot en met 57][ref2], [72][ref3], [73][ref4] en
      [80 tot en met 85a][ref5], en van de verordening zijn belast de bij besluit van de raad van bestuur van de
      mededingingsautoriteit aangewezen ambtenaren van de Nederlandse mededingingsautoriteit. Het toezicht op de naleving
      van de [artikelen 14 tot en met 16][ref6] en [artikel 18h][ref7], voor zover het betreft landsgrensoverschrijdende
      transporten, wordt uitgeoefend in overleg met de bevoegde instantie van de andere betrokken lidstaat of lidstaten
      van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel73
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0011440#Artikel18h
