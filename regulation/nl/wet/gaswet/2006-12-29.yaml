$id: gaswet
regulatory_layer: WET
publication_date: '2024-12-17'
valid_from: '2006-12-29'
bwb_id: BWBR0011440
url: https://wetten.overheid.nl/BWBR0011440/2006-12-29
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter uitvoering van richtlijn 98/30/EG van het
    Europees Parlement en de Raad van de Europese Unie van 22 juni 1998 betreffende gemeenschappelijke regels voor de
    interne markt voor aardgas (PbEG 1998, L 204), de mogelijkheden voor levering en in- en uitvoer van gas en voor
    het gebruik van infrastructuur voor gastransport te verruimen en daarvoor met inachtneming van het belang van het
    betrouwbaar, duurzaam, milieuhygiënisch verantwoord en doelmatig functioneren van de gasvoorziening een regeling
    tot stand te brengen met betrekking tot het transport en de levering van gas;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.b
    text: |-
      gas: stof die bij een temperatuur van 15° Celsius en bij een druk van 1,01325 bar in gasvormige toestand verkeert
      en in hoofdzaak bestaat uit methaan of een andere stof die vanwege haar eigenschappen aan methaan gelijkwaardig is;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.c
    text: |-
      gasproductienet: een of meer pijpleidingen die onderdeel uitmaken van een olie- of gaswinningsproject of die worden
      gebruikt voor het transport van gas rechtstreeks van een gaswinningsproject naar een verwerkingsinstallatie, een
      opslagplaats of een aanlandingsplaats;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.d
    text: |-
      gastransportnet: niet tot een gasproductienet behorende, met elkaar verbonden leidingen of hulpmiddelen bestemd
      of gebruikt voor het transport van gas, met inbegrip van landsgrensoverschrijdende leidingen, hulpmiddelen en
      installaties waarmee dat transport ondersteunende diensten worden verricht, behoudens voor zover deze leidingen en
      hulpmiddelen zijn gelegen binnen de installatie van een afnemer;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.e
    text: |-
      netbeheerder: een vennootschap die op grond van [artikel 2][ref1] is aangewezen voor het beheer van een of meer
      gastransportnetten,


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.1.f
    text: |-
      gasopslaginstallatie: een installatie voor de opslag van gas, met inbegrip van het gedeelte van een LNG-installatie
      dat voor opslag wordt gebruikt, maar met uitzondering van het gedeelte dat wordt gebruikt voor gasproductie,
      en met uitzondering van installaties die uitsluitend ten dienste staan van de netbeheerder van het landelijk
      gastransportnet bij de uitvoering van zijn taken;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.g
    text: 'gasopslagbedrijf: een ieder die een gasopslaginstallatie beheert;'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.h
    text: |-
      LNG-installatie: een installatie die gebruikt wordt voor het vloeibaar maken van gas, of voor de invoer, de
      verlading, of de hervergassing van vloeibaar gas, met inbegrip van ondersteunende diensten en tijdelijke opslag
      die nodig zijn voor het proces van hervergassing en de daaropvolgende levering aan het transportsysteem, met
      uitzondering van de gedeeltes van de installatie die gebruikt worden voor opslag;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.i
    text: 'LNG-bedrijf: een ieder die een LNG-installatie beheert;'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.j
    text: |-
      gasbedrijf: een netbeheerder, een gasopslagbedrijf, een LNG-bedrijf of een natuurlijke persoon of een rechtspersoon
      die de productie, de aankoop of de levering van gas verricht, maar geen eindafnemer van dit gas is;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.k
    text: |-
      verwant bedrijf: verbonden onderneming in de zin van artikel 41 van de zevende [richtlijn nr. 83/349/
      EEG](31983L0349) van de Raad van 13 juni 1983 op de grondslag van artikel 54, derde lid, sub g, van
      het Verdrag betreffende de geconsolideerde jaarrekening of een geassocieerde onderneming in de zin van
      [artikel 33, eerste lid][ref1], daarvan of een onderneming die aan dezelfde aandeelhouders toebehoort;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel33
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 1.1.l
    text: 'netgebruiker: degene voor wie met behulp van een gastransportnet het transport van gas wordt verricht;'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.m
    text: |-
      aansluiting: één of meer verbindingen tussen een gastransportnet en een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 1.1.n
    text: |-
      landelijk gastransportnet: een gastransportnet, met uitzondering van een gastransportnet als bedoeld in
      [artikel 18h, eerste lid][ref1], dat uitsluitend of in hoofdzaak is bestemd of wordt gebruikt voor het op landelijk
      niveau transporteren van gas;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel18h
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 18h
        hoofdstuk: '2'
        paragraaf: 2.4a
  - number: 1.1.o
    text: 'afnemer: een persoon met een aansluiting op een gastransportnet;'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.p
    text: |-
      vergunninghouder: een houder van een leveringsvergunning als bedoeld in [artikel 43][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 1.1.q
    text: |-
      richtlijn: [richtlijn nr. 2003/55/EG](32003L0055) van het Europese Parlement en de Raad van de Europese Unie van
      26 juni 2003 betreffende gemeenschappelijke regels voor de interne markt voor aardgas en houdende intrekking van
      [richtlijn 98/30/EG](31998L0030) (PbEG L 176);
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.r
    text: |-
      raad van bestuur van de mededingingsautoriteit: de raad van bestuur van de mededingingsautoriteit, genoemd in
      [artikel 2 van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
  - number: 1.1.t
    text: |-
      ondersteunende diensten: de diensten die nodig zijn voor de toegang tot of de werking van gastransportnetten,
      LNG-installaties of opslaginstallaties, met inbegrip van het opvangen van fluctuaties in de belasting van het
      gastransportnet en menging, maar met uitzondering van de installaties die uitsluitend ten dienste staan van de
      netbeheerder van het landelijk gastransportnet bij de uitvoering van zijn taken;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.u
    text: |-
      economische eigendom: het krachtens een rechtsverhouding gerechtigd zijn tot alle rechten en bevoegdheden ten
      aanzien van een goed, met uitzondering van het recht op levering, en het gehouden zijn om alle verplichtingen
      ten aanzien van dat goed voor zijn rekening te nemen en daarmee het volledige risico van waardeverandering of
      tenietgaan van het goed te dragen, zonder dat het goed geleverd is;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: 1.1.v
    text: |-
      verordening: de verordening (EG) nr. 1775/2005 van het Europees Parlement en de Raad van de Europese Unie van
      28 september 2005 betreffende de voorwaarden voor de toegang tot aardgastransmissienetten (PbEU L 289).
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kan deze wet geheel of gedeeltelijk van toepassing worden verklaard op andere
      gasvormige stoffen dan de stof, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel1
  - number: '2.1'
    text: |-
      Degene aan wie een gastransportnet toebehoort, wijst voor het beheer van dat net, ten behoeve van de uitvoering van
      de taken, bedoeld in de [artikelen 10][ref1] en [42][ref2] en [hoofdstuk 2][ref3], een of meer naamloze of besloten
      vennootschappen als netbeheerder aan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid, wijst degene aan wie het landelijk gastransportnet geheel of voor het grootste
      gedeelte toebehoort, in voorkomend geval na overleg met anderen aan wie een gedeelte van dat gastransportnet
      toebehoort, voor het beheer van dat gehele net, ten behoeve van de uitvoering van de taken, bedoeld in de
      [artikelen 10][ref1], [10a][ref2], [42][ref3] en [54a][ref4] en [hoofdstuk 2][ref5], één naamloze of besloten
      vennootschap als netbeheerder van het landelijk gastransportnet aan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref5
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: '2.3'
    text: |-
      Onverminderd [artikel 6][ref1] geldt een aanwijzing als bedoeld in het eerste of tweede lid voor een periode
      van tien jaar, te rekenen vanaf de dag waarop Onze Minister heeft ingestemd met de aanwijzing op grond van
      [artikel 4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel4
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 2a.1
    text: |-
      Onze Minister kan op diens aanvraag aan degene aan wie een ander gastransportnet dan het landelijk gastransportnet
      toebehoort, een ontheffing verlenen van het gebod, bedoeld in [artikel 2, eerste lid][ref1], voor zover het een net
      betreft waarop een beperkt aantal andere natuurlijke personen of rechtspersonen zijn aangesloten en:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 2a.1.a
    text: |-
      het gastransportnet bestemd is om de aanvrager te voorzien van gas dan wel om het centrale bedrijfsproces van de
      aanvrager te ondersteunen, of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.1.b
    text: |-
      het gastransportnet bestemd is om een aantal samenwerkende natuurlijke personen of rechtspersonen te voorzien
      van gas en de samenwerking van deze personen een betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord
      functionerende energiehuishouding in hun vestigingen ten doel heeft, of
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.1.c
    text: |-
      ten aanzien van het gastransportnet kwaliteitseisen van toepassing zijn die in betekenende mate afwijken van de
      kwaliteitseisen die voor een gastransportnet gebruikelijk zijn, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.1.d
    text: de aanvrager geen netbeheerder is en niet in een groepsmaatschappij met een netbeheerder verbonden is.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.2
    text: |-
      Indien een ontheffing als bedoeld in het eerste lid is verleend, sluit de ontheffinghouder een overeenkomst met de
      netbeheerder van het gastransportnet waarop zijn net is aangesloten om te waarborgen dat de uitvoering van de taken
      van die netbeheerder niet wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.3
    text: |-
      Aan een ontheffing kunnen voorschriften worden verbonden met betrekking tot de toegang tot het net, het uitvoeren
      van taken als bedoeld in de [artikelen 10][ref1] en [42][ref2] en [hoofdstuk 2][ref3] en met betrekking tot de
      tarieven en voorwaarden die daarbij gehanteerd moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 2a.4
    text: 'Onze Minister kan een ontheffing intrekken indien degene aan wie de ontheffing is verleend:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.4.a
    text: niet langer voldoet aan de voorwaarden, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.4.b
    text: in strijd handelt met het tweede lid of de voorschriften, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.4.c
    text: |-
      bij de aanvraag om een ontheffing onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2a.5
    text: |-
      In afwijking van het eerste lid, onderdeel d, kan aan een aanvrager die in een groepsmaatschappij met een
      netbeheerder is verbonden een ontheffing worden verleend, indien van hem in redelijkheid niet kan worden verwacht
      dat hij een netbeheerder aanwijst voor het gastransportnet waarop de aanvraag betrekking heeft. Een netbeheerder
      onthoudt zich van bemoeienis met het beheer van het net waarop de ontheffing betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2a
  - number: 2b.1
    text: |-
      [Artikel 2, eerste lid][ref1], is niet van toepassing voor degene aan wie een gastransportnet toebehoort dat de
      grens van Nederland overschrijdt met uitsluitend als doel de gastransportnetten van Nederland en een ander land
      onderling te koppelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 2b.2
    text: |-
      Degene aan wie een gastransportnet als bedoeld in het eerste lid toebehoort, wijst voor het beheer van dat
      transportnet een interconnector-beheerder aan. De aanwijzing wordt gemeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2b
  - number: 2b.3
    text: |-
      Een aanwijzing als bedoeld in het tweede lid geldt voor een periode van tien jaar, te rekenen vanaf de dag waarop
      de aanwijzing aan Onze Minister is gemeld.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2b
  - number: 2b.4
    text: |-
      [Artikel 5, eerste lid][ref1], en [6, eerste tot en met derde lid][ref2] zijn van overeenkomstige toepassing, met
      dien verstand dat de interconnector-beheerder geen naamloze of besloten vennootschap behoeft te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel6
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 2b.5
    text: |-
      [Artikel 3, eerste lid, tweede lid, onderdeel d, en derde lid][ref1], [3a, tweede lid][ref2], [3c][ref3],
      [4, eerste lid][ref4], [10, eerste, tweede en vierde lid][ref5], [12 tot en met 16][ref6], [19][ref7], [20][ref8],
      [37][ref9] en [39a][ref10] zijn van overeenkomstige toepassing. [Artikel 3, tweede lid, onderdeel d][ref11], en
      [4, eerste lid][ref12] zijn van overeenkomstige toepassing waar het betreft de verhouding tussen de eigenaar van
      het in het eerste lid bedoelde gastransportnet en de interconnector-beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel3c
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0011440#Artikel19
      [ref8]: https://wetten.overheid.nl/BWBR0011440#Artikel20
      [ref9]: https://wetten.overheid.nl/BWBR0011440#Artikel37
      [ref10]: https://wetten.overheid.nl/BWBR0011440#Artikel39a
