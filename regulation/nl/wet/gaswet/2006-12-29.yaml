        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref6
        bwb_id: BWBR0011440
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 60ac.2
    text: |-
      Indien daarvoor naar zijn oordeel aanleiding bestaat, gelet op het voorschrift waarop de overtreding betrekking
      heeft, geeft de raad van bestuur van de mededingingsautoriteit een bindende aanwijzing als bedoeld in
      [artikel 60, tweede lid][ref1], alvorens een last onder dwangsom op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel60
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ac
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 60ac.3
    text: |-
      Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de raad
      van bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ac
  - number: 60ac.4
    text: |-
      [Artikelen 5:32, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ac
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 60ac.5
    text: |-
      De bevoegdheid tot het opleggen van een last onder dwangsom vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ac
  - number: 60ad.1
    text: 'De raad van bestuur van de mededingingsautoriteit kan in geval van overtreding van het bepaalde bij of krachtens:'
