  - number: 60ad.2
    text: |-
      Bij de vaststelling van de hoogte van boete houdt de raad van bestuur van de mededingingsautoriteit in ieder geval
      rekening met de ernst en de duur van de overtreding.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ad
  - number: 60ad.3
    text: |-
      De berekening van de netto-omzet, bedoeld in het eerste lid, geschiedt op de voet van
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ad
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: 60ae.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit legt geen bestuurlijke boete op voor zover de overtreding niet
      aan de overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ae
  - number: 60ae.2
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ae
  - number: 60ae.3
    text: |-
      Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ae
  - number: 60af.1
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit vaststelt dat een overtreding als bedoeld in
      [artikelen 60ac][ref1] of [60ad][ref2] is begaan, maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel60ac
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel60ad
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60af
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 60ac
        hoofdstuk: '5'
        paragraaf: 5.5a
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 60ad
        hoofdstuk: '5'
        paragraaf: 5.5a
  - number: 60af.2
    text: 'Het rapport is gedagtekend en vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60af
  - number: 60af.2.a
    text: de naam van de overtreder,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60af
  - number: 60af.2.b
    text: de overtreding alsmede het overtreden voorschrift, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60af
  - number: 60af.2.c
    text: zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60af
  - number: 60af.3
    text: Een afschrift van het rapport wordt toegezonden aan de overtreder.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60af
  - number: 60ag.1
    text: |-
      Indien aan een handeling van de raad van bestuur van de mededingingsautoriteit redelijkerwijs de gevolgtrekking kan
      worden verbonden dat aan de overtreder een bestuurlijke boete zal worden opgelegd, is er geen verplichting meer van
      de zijde van die overtreder om ten behoeve van deze oplegging een verklaring omtrent de overtreding af te leggen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ag
  - number: 60ag.2
    text: De overtreder wordt hierop gewezen alvorens hem mondeling wordt gevraagd inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ag
  - number: 60ah.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de overtreder desgevraagd in de gelegenheid de gegevens
      waarop het voornemen tot het opleggen van een bestuurlijke boete berust, in te zien en daarvan afschriften te
      vervaardigen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ah
  - number: 60ah.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] wordt de overtreder altijd in de
      gelegenheid gesteld zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ah
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 60ah.3
    text: |-
      Indien blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt de raad van bestuur van de
      mededingingsautoriteit er zoveel mogelijk zorg voor dat deze gegevens aan de overtreder worden medegedeeld in een
      voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ah
  - number: 60ai.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit beslist omtrent het opleggen van de last onder dwangsom of de
      bestuurlijke boete binnen dertien weken na de dagtekening van het rapport.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.2
    text: |-
      Mandaat tot het opleggen van een bestuurlijke boete wordt niet verleend aan degene die van de overtreding een
      rapport heeft opgemaakt.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3
    text: 'In de beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3.a
    text: 'indien een last onder dwangsom wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3.a.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3.a.2°
    text: de inhoud van de last en de termijn waarvoor deze geldt;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3.b
    text: 'indien een bestuurlijke boete wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3.b.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3.b.2°
    text: het bedrag van de boete;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60ai.3.c
    text: |-
      de overtreding ter zake waarvan de last of de bestuurlijke boete wordt opgelegd alsmede het overtreden wettelijk
      voorschrift.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ai
  - number: 60aj.1
    text: |-
      Een beschikking als bedoeld in [artikel 60ai][ref1] wordt, nadat zij bekend is gemaakt, ter inzage gelegd bij de
      raad van bestuur van de mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel60ai
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60aj
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 60ai
        hoofdstuk: '5'
        paragraaf: 5.5a
  - number: 60aj.2
    text: Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60aj
  - number: 60ak.1
    text: |-
      Een bestuurlijke boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking
      is getreden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ak
  - number: 60ak.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop de in het eerste lid genoemde
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ak
  - number: 60ak.3
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ak
  - number: 60al.1
    text: |-
      Bij gebreke van betaling binnen de in [artikel 60ak, derde lid][ref1], bedoelde termijn van twee weken kan de raad
      van bestuur van de mededingingsautoriteit de verschuldigde boete, verhoogd met de op de aanmaning en invordering
      betrekking hebbende kosten, invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel60ak
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60al
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 60ak
        hoofdstuk: '5'
        paragraaf: 5.5a
  - number: 60al.2
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete is verschuldigd bij deurwaardersexploit betekend en levert
      een executoriale titel op in de zin van [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60al
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 60al.3
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60al
  - number: 60al.4
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60al
  - number: '61.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit, met uitzondering van een besluit op grond van de
      [artikel 16][ref1] en [60ad][ref2], kan een belanghebbende beroep instellen bij het College van beroep voor het
      bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel60ad
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 60ad
        hoofdstuk: '5'
        paragraaf: 5.5a
  - number: '61.2'
    text: |-
      Indien beroep wordt ingesteld tegen een besluit als bedoeld in de [artikelen 16][ref1] en [60ad][ref2] is, in
      afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref3], de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel60ad
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 60ad
        hoofdstuk: '5'
        paragraaf: 5.5a
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '61.3'
    text: |-
      Voor zover een door de raad van bestuur van de mededingingsautoriteit genomen besluit, genomen op grond van de
      [artikelen 12f][ref1], [12g][ref2], [81][ref3], [81c][ref4] en [82][ref5] aangemerkt wordt als algemeen verbindend
      voorschrift, kan een belanghebbende beroep instellen bij het College van beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12g
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel81
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel81c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel82
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12g
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '81'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 81c
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0011440
        artikel: '82'
        hoofdstuk: '7'
  - number: '61.4'
    text: |-
      Een representatieve organisatie van netgebruikers op de gasmarkt wordt geacht belanghebbende te zijn bij besluiten
      genomen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel61
  - number: '62'
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd het transporteren en het leveren van gas in het belang van
      de energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel62
  - number: '63'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een besluit op grond van het Verdrag tot oprichting
      van de Europese Gemeenschap regels worden gesteld met betrekking tot de voorwaarden die door een gasbedrijf in het
      belang van de veiligheid en de doelmatigheid worden gesteld voor het leveren van gas of voor het aansluiten van
      toestellen of installaties die gas verbruiken, en de toepassing van zodanige voorwaarden.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel63
  - number: '64.1'
    text: |-
      Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een door Onze Minister vast
      te stellen vergoeding verschuldigd voor het verlenen van een ontheffing als bedoeld in [artikel 2a][ref1], een
      instemming als bedoeld in [artikel 4, tweede lid][ref2], van een aanwijzing als bedoeld in [artikel 5][ref3],
      een ontheffing als bedoeld in [artikel 16][ref4] of [artikel 18h][ref5] of van een vergunning als bedoeld in
      [artikel 43][ref6], welke vergoeding verschuldigd is voor ten hoogste de kosten van de bemoeiingen met betrekking
      tot de instemming, de aanwijzing, de ontheffing, de vergunning onderscheidenlijk het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel18h
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 2a
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 18h
        hoofdstuk: '2'
        paragraaf: 2.4a
      - id: ref6
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '64.2'
    text: |-
      Overeenkomstig de regels, bedoeld in het eerste lid, kunnen aan netbeheerders, LNG-bedrijven, gasopslagbedrijven
      en vergunninghouders tevens de kosten in rekening worden gebracht die gemaakt worden voor de uitvoering van de
      taken en de uitoefening van de bevoegdheden, bedoeld in de [artikelen 12f][ref1], [12g][ref2], [13][ref3] en
      [18 tot en met 18f][ref4], [80 tot en met 82][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12g
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel80
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12g
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref5
        bwb_id: BWBR0011440
        artikel: '80'
        hoofdstuk: '7'
  - number: '64.3'
    text: |-
      Indien een ingevolge het eerste of tweede lid verschuldigd bedrag niet is betaald binnen de daarvoor gestelde
      termijn, wordt het desbetreffende bedrag vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop die
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel64
  - number: '64.4'
    text: |-
      Indien niet is betaald binnen de termijn bedoeld in het derde lid, wordt degene die het bedrag is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag, verhoogd met de wettelijke rente en de kosten van de
      aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel64
  - number: '65.1'
    text: |-
      Bij gebreke van betaling binnen de termijn, bedoeld in [artikel 64, derde lid][ref1], kan het verschuldigde
      bedrag verhoogd met de wettelijke rente en de op de aanmaning betrekking hebbende kosten, worden ingevorderd bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel64
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '64'
        hoofdstuk: '5'
        paragraaf: '5.9'
  - number: '65.2'
    text: |-
      Het dwangbevel wordt op kosten van degene die het bedrag is verschuldigd bij deurwaardersexploit betekend en
      levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel65
  - number: '65.3'
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel65
  - number: '65.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel65
  - number: '66.1'
    text: |-
      Onze Minister zendt zo spoedig mogelijk na een juli 2006, en vervolgens telkens na vier jaar, aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66
  - number: '66.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud van het verslag. Het verslag bevat in
      ieder geval een evaluatie van de doeltreffendheid en de effecten van de wet met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66
  - number: 66.2.a
    text: de voorzienings- en leveringszekerheid van gas;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66
  - number: 66.2.b
    text: de marktordening en de marktwerking;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66
  - number: 66.2.c
    text: |-
      mede gelet op de [Mededingingswet][ref1], het toezicht en de naleving.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '66.3'
    text: De Nederlandse Mededingingsautoriteit is belast met de uitvoering van de evaluatie.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66
  - number: 66a
    text: |-
      Indien dat noodzakelijk is in het belang van een voldoende transparante en liquide markt voor vraag en aanbod van
      gas, transportcapaciteit, opslagcapaciteit of productiecapaciteit of in het belang van de daarmee verband houdende
      leveringszekerheid, zullen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66a
  - number: 66a.a
    text: |-
      de wijze waarop of de voorwaarden waaronder producenten, gasopslagbedrijven, LNG-bedrijven, handelaren,
      leveranciers of netbeheerders gas, transportcapaciteit, opslagcapaciteit of productiecapaciteit waarover zij
      beschikken, aanbieden;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66a
  - number: 66a.b
    text: |-
      de informatie die producenten, gasopslagbedrijven, LNG-bedrijven, handelaren, leveranciers of netbeheerders
      verstrekken met betrekking tot de vraag en aanbod van gas, transportcapaciteit, opslagcapaciteit of
      productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66a
  - number: 66b.1
    text: |-
      Onze Minister wijst een of meer rechtspersonen aan die tot taak hebben een beurs tot stand te brengen en in stand
      te houden. Onze Minister kan regels stellen met betrekking tot de procedure voor aanwijzing van een beurs.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66b
  - number: 66b.2
    text: |-
      Een rechtspersoon, bedoeld in het eerste lid, stelt een beursreglement op. Het beursreglement behoeft de
      goedkeuring van Onze Minister. Van het besluit tot goedkeuring wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66b
  - number: 66b.3
    text: |-
      De netbeheerder van het landelijk gastransportnet is verplicht aan de rechtspersoon, bedoeld in het eerste lid,
      de gevraagde medewerking te verlenen, voor zover deze medewerking noodzakelijk is voor een goede uitvoering van de
      aan deze rechtspersoon opgelegde taak. Onze Minister kan nadere regels stellen over de door de netbeheerder van het
      landelijk gastransportnet te verlenen medewerking.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66b
  - number: 66b.4
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, die bij de uitvoering van zijn taak de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover de artikelen van deze wet hem tot mededeling verplichten of
      uit zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66b
  - number: 66b.5
    text: |-
      Producenten, leveranciers, handelaren, gasopslagbedrijven, LNG-bedrijven, afnemers en aandeelhouders onthouden zich
      van elke bemoeiing met de uitvoering van de taak die is opgedragen aan de rechtspersoon, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66b
  - number: 66c
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de voorwaarden die leveranciers hanteren ten opzichte
      van vergunninghouders. Deze regels kunnen betrekking hebben op de zekerheden die worden gevraagd voor de levering
      van gas aan vergunninghouders.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel66c
  - number: '72.1'
    text: |-
      Een netbeheerder meldt jaarlijks voor 1 februari aan Onze Minister alle in het voorgaande kalenderjaar gesloten
      overeenkomsten tot transport van gas die strekken tot landsgrensoverschrijdende leveringen van gas.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel72
  - number: '72.2'
    text: |-
      Bij de in het eerste lid bedoelde melding worden in ieder geval vermeld het land of de landen waar naartoe of
      van waaruit het gas werd of zal worden getransporteerd, de hoeveelheid gas die onderwerp was of zal zijn van elk
      transport en de termijn waarvoor de overeenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel72
  - number: '72.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de melding.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel72
  - number: '73.1'
    text: |-
      Met inachtneming van artikel 23, tweede lid, van de richtlijn, kunnen bij ministeriële regeling afnemers,
      handelaren, leveranciers, overeenkomsten en landen worden aangewezen ten aanzien waarvan toestemming van Onze
      Minister vereist is voor het transport van gas vanuit een ander land naar Nederland.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel73
  - number: '73.2'
    text: |-
      De in het eerste lid bedoelde aanwijzing vindt slechts plaats indien uit de in [artikel 72][ref1] bedoelde
      meldingen blijkt dat een verstoring van het evenwicht bij het openstellen van de gasmarkten optreedt of dreigt op
      te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel72
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '72'
        hoofdstuk: '7'
  - number: '73.3'
    text: |-
      Bij de toepassing van het bepaalde bij of krachtens dit artikel houdt Onze Minister rekening met de vraag of
      een aanwijzing of een weigering tot het geven van toestemming noodzakelijk en proportioneel is in het licht van
      het doel ervan, alsmede met de vraag of de aanwijzing of de weigering de ontwikkeling van het handelsverkeer zou
      beïnvloeden in een mate die strijdig is met de belangen van de Gemeenschap, bedoeld in artikel 3, vijfde lid, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel73
  - number: '73.4'
    text: |-
      Het is verboden zonder toestemming van Onze Minister het transport van gas te verrichten in het kader van een
      overeenkomst tot transport van gas die strekt tot de invoer van gas indien de overeenkomst, het daarbij betrokken
      land, de betrokken afnemer of leverancier in de in het eerste lid bedoelde ministeriële regeling is aangewezen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel73
  - number: '80'
    text: |-
      De tarieven voor het transport van gas en voor de dat transport ondersteunende diensten worden vastgesteld
      overeenkomstig de [artikelen 81 tot en met 81c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '81'
        hoofdstuk: '7'
  - number: 80a
    text: |-
      Het tarief voor meting van gas bij afnemers als bedoeld in [artikel 43, eerste lid][ref1], wordt vastgesteld
      overeenkomstig [artikel 81e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel81e
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 81e
        hoofdstuk: '7'
  - number: '81.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt na overleg met de gezamenlijke netbeheerders en met
      representatieve organisaties van partijen op de gasmarkt, met inachtneming van het belang dat door middel van
      marktwerking ten behoeve van afnemers de doelmatigheid van de bedrijfsvoering en de meest doelmatige kwaliteit
      van het transport worden bevorderd, de methode tot vaststelling van de korting ter bevordering van de doelmatige
      bedrijfsvoering, van de kwaliteitsterm en van het rekenvolume van elke tariefdrager van elke dienst waarvoor een
      tarief wordt vastgesteld, vast.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81
  - number: '81.2'
    text: |-
      De korting ter bevordering van de doelmatige bedrijfsvoering heeft onder meer ten doel te bereiken dat de
      netbeheerder in ieder geval geen rendement kan behalen dat hoger is dan in het economisch verkeer gebruikelijk en
      dat de gelijkwaardigheid in de doelmatigheid van de netbeheerders wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81
  - number: '81.3'
    text: |-
      De kwaliteitsterm geeft de aanpassing van de tarieven in verband met de geleverde kwaliteit aan en heeft ten doel
      netbeheerders te stimuleren om de kwaliteit van hun transportdienst te optimaliseren.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81
  - number: '81.4'
    text: |-
      De rekenvolumina die een netbeheerder gebruikt bij het voorstel, bedoeld in [artikel 81b][ref1], zijn
      gebaseerd op daadwerkelijk gefactureerde volumina in eerdere jaren, of worden door de raad van bestuur van de
      mededingingsautoriteit geschat indien deze betrekking hebben op nieuwe tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81b
        hoofdstuk: '7'
  - number: 81a.1
    text: |-
      Ten behoeve van het voorstel, bedoeld in [artikel 81b][ref1], stelt de raad van bestuur van de
      mededingingsautoriteit voor iedere netbeheerder afzonderlijk voor een periode van ten minste drie en ten hoogste
      vijf jaar vast:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81b
        hoofdstuk: '7'
  - number: 81a.1.a
    text: de korting ter bevordering van de doelmatige bedrijfsvoering,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81a
  - number: 81a.1.b
    text: de kwaliteitsterm, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81a
  - number: 81a.1.c
    text: het rekenvolume van elke tariefdrager van elke dienst waarvoor een tarief wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81a
  - number: 81a.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan het in het eerste lid, onderdeel c, bedoelde rekenvolume
      gedurende de in dat lid bedoelde periode wijzigen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81a
  - number: 81b.1
    text: |-
      Iedere netbeheerder die het transport van gas verricht dat bestemd is voor levering aan afnemers zendt
      jaarlijks voor 1 oktober aan de raad van bestuur van de mededingingsautoriteit een voorstel voor de tarieven
      die deze netbeheerder ten hoogste zal berekenen voor het transport van gas aan die afnemers en de dat transport
      ondersteunende diensten, met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81b
  - number: 81b.1.a
    text: |-
      het uitgangspunt dat de kosten worden toegerekend aan de tariefdragers betreffende de diensten die deze kosten
      veroorzaken,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81b
  - number: 81b.1.b
    text: |-
      de tariefstructuren vastgesteld op grond van [artikel 12f][ref1] of [12g][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12g
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12g
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 81b.1.c
    text: |-
      het bepaalde bij of krachtens [artikel 81a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81a
        hoofdstuk: '7'
  - number: 81b.1.d
    text: |-
      de formule: waarbij TI = de totale inkomsten uit de tarieven uit het jaar t, te weten de som van de
      vermenigvuldiging van elk tarief in het jaar t en het op basis van [artikel 81a, onderdeel c][ref1], vastgestelde
      rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld; TI = de totale inkomsten uit de tarieven
      in het jaar voorafgaande aan het jaar t, te weten de som van de vermenigvuldiging van elk tarief in het jaar t-
      1 en het op basis van [artikel 81a, onderdeel c][ref2], vastgestelde rekenvolume van elke tariefdrager waarvoor
      een tarief wordt vastgesteld; cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens),
      berekend uit het quotiënt van deze prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t,
      en van deze prijsindex, gepubliceerd in de zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks
      wordt vastgesteld door het Centraal Bureau voor de Statistiek; x = de korting ter bevordering van de doelmatige
      bedrijfsvoering; q = de kwaliteitsterm, die de aanpassing van de tarieven in verband met de geleverde kwaliteit
      aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel81a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81b
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81a
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 81a
        hoofdstuk: '7'
  - number: 81b.2
    text: |-
      Een netbeheerder kan, gelijktijdig met het voorstel, bedoeld in het eerste lid, een voorstel doen voor een
      tariefverhoging ter dekking van de kosten voor de een uitzonderlijke en aanmerkelijke investering ter uitbreiding
      van het door de netbeheerder beheerde net.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81b
  - number: 81c.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt met betrekking tot het transport van gas dat bestemd is
      voor levering aan afnemers voor iedere netbeheerder de tarieven, die kunnen verschillen voor de verschillende
      netbeheerders en voor de onderscheiden tariefdragers en die deze ten hoogste mag berekenen voor het transport van
      dat gas en de dat transport ondersteunende diensten, jaarlijks vast.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81c
  - number: 81c.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan de tarieven die zullen gelden in het jaar t corrigeren,
      indien de tarieven die golden in het jaar of de jaren voorafgaand aan het jaar t:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81c
  - number: 81c.2.a
    text: |-
      bij rechterlijke uitspraak of met toepassing van [artikel 6:18 van de Algemene wet bestuursrecht][ref1] zijn
      gewijzigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 81c.2.b
    text: |-
      zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de raad van bestuur van de
      mededingingsautoriteit, indien hij de beschikking had over juiste of volledige gegevens, tarieven zou hebben
      vastgesteld die in aanmerkelijke mate zouden afwijken van de vastgestelde tarieven;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81c
  - number: 81c.2.c
    text: zijn vastgesteld met gebruikmaking van geschatte gegevens en de feitelijk gegevens daarvan afwijken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81c
  - number: 81c.3
    text: |-
      Indien het voorstel niet binnen de termijn, bedoeld in [artikel 81b, eerste lid][ref1], aan de raad van bestuur
      van de mededingingsautoriteit is gezonden, stelt deze de tarieven voor de desbetreffende netbeheerder uit eigen
      beweging vast met inachtneming van [artikel 81b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81b
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 81b
        hoofdstuk: '7'
  - number: 81d.1
    text: |-
      De tarieven treden in werking op een door de raad van bestuur van de mededingingsautoriteit te bepalen datum en
      gelden tot 1 januari van het jaar, volgend op de datum van inwerkingtreding van het besluit tot vaststelling van
      de tarieven.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81d
  - number: 81d.2
    text: |-
      Indien op 1 januari de tarieven voor het volgende jaar nog niet zijn vastgesteld, gelden de tarieven tot de datum
      van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81d
  - number: 81d.3
    text: |-
      Iedere netbeheerder legt een exemplaar van de voor hem geldende tarieven voor een ieder ter inzage in al zijn
      vestigingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81d
  - number: 81e.1
    text: 'Het tarief voor de meting van gas bij afnemers als bedoeld in artikel 43, eerste lid, heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81e
  - number: 81e.1.a
    text: het van het net afgenomen en verbruikte gas;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81e
  - number: 81e.1.b
    text: |-
      het meedelen van de gegevens aan de desbetreffende afnemer en aan de netbeheerder op wiens net de afnemer is
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81e
  - number: 81e.2
    text: |-
      De tarieven voor de meting van gas bij afnemers als bedoeld in artikel 43, eerste lid, worden vastgesteld door
      de directeur van de dienst na overleg met de gezamenlijke netbeheerders en met representatieve organisaties van
      partijen op de gasmarkt. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot procedure
      tot vaststelling van de tarieven voor de meting van gas bij afnemers als bedoeld in artikel 43, eerste lid, en de
      wijze van berekening van deze tarieven.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel81e
  - number: '82.1'
    text: |-
      In afwijking van [artikel 80][ref1] worden de tarieven ter uitvoering van de taken, genoemd in [artikel 10][ref2]
      en [10a, eerste lid, onderdeel b, c en d][ref3], door de netbeheerder van het landelijk gastransportnet,
      vastgesteld overeenkomstig dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '80'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '82.2'
    text: |-
      Voor elke taak van de netbeheerder van het landelijk gastransportnet, genoemd in de [artikelen 10][ref1] en
      [10a][ref2] stelt de raad van bestuur van de mededingingsautoriteit de methode van regulering vast, voor een
      periode van ten minste drie en ten hoogste vijf jaar, na overleg met de gezamenlijke netbeheerders en met
      representatieve organisaties van partijen op de gasmarkt en met inachtneming van het belang dat de doelmatigheid
      van de bedrijfsvoering op de meest doelmatige kwaliteit van de uitvoering van deze taken worden bevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '82.3'
    text: |-
      De netbeheerder van het landelijk gastransportnet zendt jaarlijks voor 1 september aan de raad van bestuur
      van de mededingingsautoriteit een voorstel voor de tarieven voor uitvoering van de taken genoemd in de
      [artikelen 10][ref1] en [10a][ref2], met inachtneming van de tariefstructuren vastgesteld op grond van
      [artikel 12f][ref3] of [12g][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel12g
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 12f
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 12g
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '82.4'
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de tarieven die kunnen verschillen voor de
      onderscheiden tariefdragers jaarlijks vast. De raad van bestuur van de mededingingsautoriteit stelt na overleg
      met de gezamenlijke netbeheerders en met representatieve organisaties van netgebruikers op de gasmarkt een
      doelmatigheidskorting vast. De raad van bestuur van de mededingingsautoriteit stelt de doelmatigheidskorting
      telkens vast voor een periode van ten minste drie en ten hoogste vijf jaren. De doelmatigheidskorting heeft tot
      doel om een doelmatige bedrijfsvoering te bevorderen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
  - number: '82.5'
    text: |-
      [Artikel 81c tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81c
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81c
        hoofdstuk: '7'
  - number: '82.6'
    text: |-
      Indien een voorstel niet binnen de termijn, bedoeld in het derde lid aan de raad van bestuur van de
      mededingingsautoriteit is gezonden stelt deze de tarieven uit eigen beweging vast met inachtneming van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
  - number: '82.7'
    text: |-
      De door de raad van bestuur van de mededingingsautoriteit vastgestelde tarieven treden in werking op een door de
      raad van bestuur van de mededingingsautoriteit te bepalen datum en gelden tot 1 januari van het jaar, volgend op de
      datum van inwerkingtreding van het besluit tot vaststelling van de tarieven.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
  - number: '82.8'
    text: |-
      Indien op 1 januari de tarieven voor het volgende jaar nog niet zijn vastgesteld, gelden de tarieven tot de datum
      van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
  - number: '82.9'
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert de voor hem geldende tarieven op een geschikte wijze.
      Tevens legt de netbeheerder van het landelijk gastransportnet de voor hem geldende tarieven voor een ieder ter
      inzage in al zijn vestigingen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel82
  - number: '83'
    text: |-
      Netbeheerders zenden Onze Minister voor 1 maart van elk jaar een rapportage omtrent de naleving door hen van de
      kwaliteitscriteria, bedoeld in [artikel 12b, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '85.1'
    text: |-
      Indien zich in de periode tussen 1 juli 1996 en de datum van de aanwijzing van de netbeheerder, bedoeld
      in [artikel 2][ref1], een wijziging heeft voorgedaan met betrekking tot de eigendom van de aandelen in de
      rechtspersoon aan wie het desbetreffende gastransportnet toebehoort of de eigendom van dat net, is voor de
      instemming met de aanwijzing van de netbeheerder vereist, dat Onze Minister geen bedenkingen heeft tegen die
      wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '85.2'
    text: |-
      Iedere wijziging met betrekking tot de eigendom van een gastransportnet of van de aandelen in een netbeheerder
      behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85
  - number: '85.3'
    text: |-
      Onze Minister kan zijn instemming onthouden, indien de wijziging met betrekking tot de eigendom van een
      gastransportnet of van de aandelen in de netbeheerder ertoe zou leiden dat een natuurlijke persoon of rechtspersoon
      buiten de kring van hen aan wie aandelen in een netbeheerder toebehoren, rechten op een gastransportnet of op
      aandelen in de netbeheerder zou krijgen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85
  - number: '85.4'
    text: |-
      Onze Minister onthoudt zijn instemming indien de wijziging met betrekking tot de eigendom van een gastransportnet
      of de aandelen in een netbeheerder ertoe zou leiden dat een natuurlijke persoon of rechtspersoon buiten de kring
      van hen aan wie aandelen in een netbeheerder toebehoren, rechten op een gastransportnet of op aandelen in een
      netbeheerder zou krijgen. Bij ministeriële regeling kan een datum worden bepaald tot welke Onze Minister zijn
      instemming onthoudt. Deze ministeriële regeling wordt niet vastgesteld dan nadat Onze Minister daarover overleg met
      de Tweede Kamer der Staten-Generaal heeft gevoerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85
  - number: '85.5'
    text: |-
      Indien Onze Minister zijn instemming onthoudt en de voorgenomen wijziging met betrekking tot de eigendom van een
      gastransportnet of van de aandelen voortgang vindt, kan Onze Minister een andere rechtspersoon aanwijzien als
      netbeheerder van het net dat door de desbetreffende netbeheerder wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85
  - number: '85.6'
    text: |-
      De [artikelen 10:29 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      op het verlenen van instemming met de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 85a
    text: Artikel 85 is niet van toepassing op de netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85a
  - number: 85b.1
    text: |-
      Een gastransportnet waarvoor een netbeheerder, niet zijnde een netbeheerder als bedoeld in artikel 2, tweede lid,
      is aangewezen wordt niet beschikbaar gesteld als zekerheid voor het aantrekken van financiële middelen, behoudens
      voorzover dit geschiedt ten behoeve van het netbeheer.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85b
  - number: 85b.2
    text: |-
      Er worden geen rechten gevestigd op basis van de toekomstige inkomsten uit een gastransportnet waarvoor een
      netbeheerder is aangewezen, behoudens voorzover dit geschiedt ten behoeve van het netbeheer.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel85b
  - number: '88.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel88
  - number: '88.2'
    text: |-
      De [artikelen 14, derde tot en met zesde lid][ref1], treden in werking met ingang van 1 juli 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel14
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '88.3'
    text: |-
      De [artikelen 43 tot en met 49][ref1] treden in werking met ingang van het tijdstip waarop [hoofdstuk 3][ref2]
      vervalt, dan wel op een eerder, bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0011440
        hoofdstuk: '3'
