  - number: '3.1'
    text: |-
      Een rechtspersoon die de productie, de aankoop of de levering van gas verricht wordt niet aangewezen als
      netbeheerder.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3
  - number: '3.2'
    text: |-
      De statuten van de netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet, bevatten in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3
  - number: 3.2.a
    text: de instelling van een raad van commissarissen,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3
  - number: 3.2.b
    text: |-
      de bepaling dat de leden van het bestuur en de meerderheid van de leden van de raad van commissarissen direct noch
      indirect een binding hebben met een rechtspersoon die de productie, aankoop of levering van gas verricht,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3
  - number: 3.2.c
    text: |-
      de bepaling dat aan de goedkeuring van de raad van commissarissen ten minste zijn onderworpen
      de besluiten van het bestuur van de rechtspersoon, bedoeld in [artikel 164, eerste lid][ref1],
      of [274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 3.2.d
    text: |-
      de bepaling dat de aandeelhouders van de netbeheerder zich onthouden van iedere bemoeiing met de uitvoering van
      de taken die op grond van de [artikelen 10][ref1] en [42][ref2] en [hoofdstuk 2][ref3] aan een netbeheerder zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3
    references:
