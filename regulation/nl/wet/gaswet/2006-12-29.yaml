        hoofdstuk: '2'
  - number: '3.3'
    text: |-
      Een netbeheerder mag een activiteit als bedoeld in het eerste lid uitoefenen indien die activiteit een dat
      transport ondersteunende dienst is.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3
  - number: 3a.1
    text: 'De statuten van de netbeheerder van het landelijk gastransportnet bevatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3a
  - number: 3a.1.a
    text: de instelling van een raad van commissarissen,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3a
  - number: 3a.1.b
    text: |-
      de bepaling dat de leden van het bestuur en de meerderheid van de leden van de raad van commissarissen direct noch
      indirect een binding hebben met een rechtspersoon die de productie, aankoop of levering van gas of elektriciteit
      verricht of met een aandeelhouder van die rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3a
  - number: 3a.1.c
    text: |-
      de bepaling dat aan de goedkeuring van de raad van commissarissen ten minste zijn onderworpen de besluiten van het
      bestuur van de rechtspersoon, bedoeld in [artikel 164, eerste lid](onbekend), of [274, eerste lid, van Boek 2 van
      het Burgerlijk Wetboek](onbekend), en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3a
  - number: 3a.1.d
    text: |-
      de bepaling dat de aandeelhouders van de netbeheerder zich onthouden van iedere bemoeiing met de uitvoering van de
      taken die op grond van de artikelen 10, 10a, 42, 54a en hoofdstuk 2 aan de netbeheerder zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3a
  - number: 3a.2
    text: |-
      Het eerste lid, onderdeel d, vormt geen beletsel voor passende coördinatiemaatregelen zoals bedoeld in artikel 9,
      tweede lid, onderdeel c, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3a
  - number: 3a.3
    text: |-
      De netbeheerder van het landelijk gastransportnet mag een activiteit als bedoeld in artikel 3, eerste lid
      uitoefenen indien die activiteit noodzakelijk is voor de uitvoering van zijn wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3a
  - number: 3c.1
    text: |-
      Een netbeheerder die deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] stelt een reglement vast, waarin regels worden gesteld
      die beogen discriminatie bij de uitoefening van zijn taken en bevoegdheden op grond van deze wet te voorkomen.
      Het reglement bevat in ieder geval regels ten aanzien van het gedrag van werknemers die ertoe strekken dat
      discriminatie als bedoeld in de vorige volzin wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3c.2
    text: |-
      De netbeheerder draagt er zorg voor dat elke werknemer is gebonden aan het reglement en ziet er op toe dat het
      reglement nauwgezet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3c
  - number: 3c.3
    text: |-
      De netbeheerder stelt jaarlijks een verslag op over de wijze waarop uitvoering is gegeven aan het reglement,
      en welke maatregelen in dat kader zijn genomen. Hij zendt het verslag naar de raad van bestuur van de
      mededingingsautoriteit en draagt zorg voor publicatie ervan op een geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel3c
  - number: '4.1'
    text: |-
      De netbeheerder meldt aan Onze Minister onverwijld na zijn aanwijzing zijn naam en adres en de naam en het adres
      van zijn aandeelhouders en zendt aan Onze Minister een beschrijving van het gastransportnet dat door hem wordt
      beheerd. Tenminste eenmaal per jaar meldt hij Onze Minister iedere wijziging van de namen of adressen en zendt hij
      hem een beschrijving van de wijziging van het gastransportnet dat door hem wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel4
  - number: '4.2'
    text: |-
      De aanwijzing behoeft de instemming van Onze Minister. Hij onthoudt zijn instemming of kan voorschriften verbinden
      aan de instemming indien niet is voldaan aan de [artikelen 3][ref1], [3a][ref2], [3b][ref3] of [3c][ref4] of indien
      de aangewezen netbeheerder in onvoldoende mate in staat is of zal zijn om aan een verplichting als bedoeld in de
      [artikelen 34][ref5] en [35][ref6] te voldoen, om een taak als bedoeld in de [artikelen 10][ref7], [10a][ref8],
      [42][ref9] of [54a][ref10] uit te voeren, aan [hoofdstuk 2][ref11] te voldoen of indien hij niet voldoet aan een
      verbod als bedoeld in de [artikelen 10b][ref12], [10c][ref13] of [10d][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel3b
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel3c
