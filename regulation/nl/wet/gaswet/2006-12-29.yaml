  - number: '4.3'
    text: |-
      Indien Onze Minister voorschriften verbindt aan zijn instemming, strekken deze er slechts toe de geconstateerde
      tekortkomingen, bedoeld in het tweede lid, weg te nemen.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel4
  - number: '5.1'
    text: |-
      Indien het aanwijzen van een netbeheerder als bedoeld in [artikel 2, eerste of tweede lid][ref1], niet is geschied
      binnen vier weken na de aanleg van een gastransportnet dan wel onverwijld na het intrekken of vervallen van
      een eerdere aanwijzing, wijst Onze Minister een naamloze of besloten vennootschap aan als netbeheerder van dat
      gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '5.2'
    text: |-
      Indien Onze Minister vaststelt dat niet meer voldaan wordt aan de [artikelen 3][ref1], [3a][ref2], [3b][ref3]
      of [3c][ref4] of dat een netbeheerder in onvoldoende mate in staat is of zal zijn om aan een verplichting als
      bedoeld in de [artikelen 34][ref5] en [35][ref6] te voldoen, om een taak als bedoeld in [artikel 10][ref7],
      [10a][ref8], [42][ref9] of [54a][ref10] uit te voeren, aan hoofdstuk 2 te voldoen of indien hij niet voldoet
      aan een verbod als bedoeld in de [artikelen 10b][ref11], [10c][ref12] of [10d][ref13], kan hij de desbetreffende
      netbeheerder opdragen door hem noodzakelijk geachte voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel3b
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel3c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel35
      [ref7]: https://wetten.overheid.nl/BWBR0011440#Artikel10
