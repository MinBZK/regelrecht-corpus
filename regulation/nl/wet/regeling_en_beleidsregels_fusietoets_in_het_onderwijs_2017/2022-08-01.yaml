articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      b. *commissie:* adviescommissie, bedoeld in [artikel 64c, derde lid, van de WPO][ref1],
      [artikel 66c, derde lid, van de WEC][ref2], [artikel 3.30, zesde lid, van de WVO 2020][ref3],
      [artikel 2.1.8, tweede lid, van de WEB][ref4], en [artikel 16.16b, derde lid van de WHW][ref5];

      c. *WPO:* [Wet op het primair onderwijs][ref6];

      d. *WEC:* [Wet op de expertisecentra][ref7];

      e. *WVO 2020:* [Wet voortgezet onderwijs 2020][ref8];

      f. *WEB:* [Wet educatie en beroepsonderwijs][ref9];

      g. *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref10];

      h. *school:* school als bedoeld in [artikel 1 van de WPO][ref11], [artikel 1 van de WEC][ref12] en
      [artikel 1.1 van de WVO 2020][ref13];

      i. *instelling:* instelling als bedoeld in [artikel 1.1.1 van de WEB][ref14] en [artikel 1.8 van de WHW][ref15];

      j. *fusie:* fusie als bedoeld in [artikel 64 van de WPO][ref16], [artikel 66 van de WEC][ref17],
      [artikel 3.30 van de WVO 2020][ref18], [artikel 1.1.1 van de WEB][ref19], en [artikel 16.16 van de WHW][ref20];

      k. *mbo-student:* student als bedoeld in de [WEB][ref21];

      l. *ho-student:* student als bedoeld in de [WHW][ref22].


