  - number: '5'
    text: |-
      Bij het advies, bedoeld in [artikel 3, tweede lid][ref1], en in [artikel 2.1.8, tweede lid, van de WEB][ref2],
      onderzoekt de commissie of sprake is van een significante belemmering van de daadwerkelijke variatie in het
      onderwijsaanbod, bedoeld in artikel 2.1.8, eerste lid, van de WEB, waarbij de commissie in haar advies ten aanzien
      van de goedkeuring in ieder geval de volgende aspecten betrekt bij de afweging of er sprake is van een significante
      belemmering:

      a. de regionale context, waaronder begrepen leerlingendaling;

      b. toegankelijkheid van een divers onderwijsaanbod:

      1°. keuzevrijheid en variatie van het onderwijsaanbod;

      2°. bereikbaarheid en spreiding van onderwijsvoorzieningen;

      c. doelmatigheid:

        - *intern:* (financiële) continuïteit en stabiliteit van scholen en bestuur voor en na de fusie, alsmede de te
      verwachten financiële schaalvoordelen- en nadelen;
        - *extern:* onderwijsaanbod in relatie tot het aanbod van andere instellingen en de regionale arbeidsmarkt;

      d. kwaliteit en responsiviteit van het onderwijs;

      e. menselijke maat;

      f. intern en extern draagvlak.


      [ref1]: https://wetten.overheid.nl/BWBR0039819#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0039819/2022-08-01#Artikel5
