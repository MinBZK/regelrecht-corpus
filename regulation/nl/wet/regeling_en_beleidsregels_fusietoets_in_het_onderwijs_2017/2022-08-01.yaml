    text: |-
      1 De noodzaak tot advisering ten aanzien van de goedkeuring, bedoeld in [artikel 64c, tweede lid, van de WPO][ref1],
      [artikel 3.30, vijfde lid, van de WVO 2020][ref2] en [artikel 66c, tweede lid, van de WEC][ref3], en voor
      bestuursoverdrachten als bedoeld in [artikel 17 van de WPO][ref4], [artikel 3.16 van de WVO 2020][ref5], of
      [artikel 28 van de WEC][ref6], ontbreekt.

      2 Fusies waarbij zowel een school als bedoeld in [artikel 1.1 van de WVO 2020][ref7], als een
      instelling als bedoeld in [artikel 1.1.1 van de WEB][ref8], of een instelling voor hoger onderwijs als
      bedoeld in [artikel 1.1, onderdeel g, van de WHW][ref9], is betrokken, worden voor advies voorgelegd
      aan de commissie als bedoeld in [artikel 2.1.8, tweede lid, van de WEB][ref10] of als bedoeld in
      [artikel 16.16b, derde lid, van de WHW][ref11].


