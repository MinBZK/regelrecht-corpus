    handelende in overeenstemming met de Minister van Economische Zaken.

    Gelet op artikel 4:81 van de Algemene wet bestuursrecht, de artikelen 64b, derde lid, en 64c, derde en vierde
    lid, van de Wet op het primair onderwijs, de artikelen 66b, derde lid, en 66c, derde en vierde lid, van de Wet
    op de expertisecentra, de artikelen 53g, vierde lid, en 53h, vierde en vijfde lid, van de Wet op het voortgezet
    onderwijs, de artikelen 2.1.10, derde lid, en 2.1.11, tweede en derde lid, van de Wet educatie en beroepsonderwijs
    en de artikelen 16.16a, vijfde lid, en 16.16b, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk
    onderzoek;

