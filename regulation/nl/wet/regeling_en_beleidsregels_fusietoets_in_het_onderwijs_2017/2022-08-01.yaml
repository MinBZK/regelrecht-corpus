      1 Het modelformulier voor de aanvraag wordt vastgesteld overeenkomstig [bijlage 1][ref1]. Voor de aanvraag kan
      tevens het digitale aanvraagformulier van de website van de Dienst Uitvoering Onderwijs worden gebruikt. Dit is te
      vinden op: https://www.duo.nl/zakelijk/formulieren/.

      2 Het modelformulier voor de fusie-effectrapportage wordt vastgesteld overeenkomstig [bijlage 2][ref2].

      3 De aanvraag en daarbij behorende stukken, bedoeld in [artikel 64b, eerste lid, van de WPO][ref3],
