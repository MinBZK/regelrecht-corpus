        artikel: 2.1.8
  - number: '6'
    text: |-
      In het hoger onderwijs is in ieder geval sprake van een significante belemmering van de daadwerkelijke variatie
      van het onderwijsaanbod, bedoeld in [artikel 16.16b, eerste lid, van de WHW][ref1], indien de fusie leidt tot
      substantieel nadelige effecten voor het onderwijsaanbod op de korte termijn of indien dit voorzienbaar is op de
      langere termijn, zonder dat daarvoor een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16.16b
    url: https://wetten.overheid.nl/BWBR0039819/2022-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 16.16b
  - number: '7'
    text: |-
      Rechtvaardigingsgronden als bedoeld in [artikel 6][ref1], kunnen in het hoger onderwijs in ieder geval zijn:

      a. de omstandigheid dat bij het achterwege blijven van de fusie de continuïteit of de variatie van het
      onderwijsaanbod in gevaar komt, hetgeen onder meer kan blijken uit een daling of binnen vijf jaar te verwachten
      daling van het aantal ho-studenten;

      b. de omstandigheid dat bij het achterwege blijven van de fusie de kwaliteit van het onderwijs in redelijkheid niet
      geborgd kan worden; en

      c. de omstandigheid dat er binnen de beschikbare financiële middelen geen alternatieve mogelijkheden dan fusie te
      vinden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0039819#Artikel6
    url: https://wetten.overheid.nl/BWBR0039819/2022-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0039819
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 7a
    text: |-
      Indien er sprake is van samenloop met een vorming, wijziging of beëindiging van een verticale scholengemeenschap
      als bedoeld in [paragraaf 3 van de Regeling verticale scholengemeenschap](onbekend), vinden de fusie en de
      vorming, wijziging of beëindiging van de verticale scholengemeenschap gelijktijdig plaats op 1 augustus van enig
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0039819/2022-08-01#Artikel7a
  - number: '8'
    text: |-
      Aanvragen die voor 1 augustus 2018 in behandeling zijn genomen door de adviescommissie, bedoeld
      in de [artikelen 64c, derde lid, van de WPO][ref1], [66c, derde lid, van de WEC][ref2] en
      [artikel 3.30, vijfde lid, van de WVO 2020][ref3], worden afgedaan overeenkomstig de Regeling en beleidsregels
      fusietoets in het onderwijs 2017, zoals deze luidde op 31 juli 2018.


