---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_aanvraag_vergunning_en_uitvoering_vergelijkende_toets_dvb_t
regulatory_layer: WET
publication_date: '2013-02-15'
valid_from: '2001-07-27'
bwb_id: BWBR0012634
url: https://wetten.overheid.nl/BWBR0012634/2001-07-27
preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Verkeer en Waterstaat;

    Gelet op de artikelen 4, eerste lid, 6, eerste lid, 8, eerste lid, en 10, eerste lid, van het Frequentiebesluit,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             minister:

              Minister van Onderwijs, Cultuur en Wetenschappen;



            b
            besluit:

              [Frequentiebesluit][ref1];



            c
             DVB-T:

              Digital Video Broadcasting-Terrestrial, systeem van aardse digitale omroeptechnologie, gebaseerd op de
      standaard ETSI EN 300 744;



            d
            aanvraag:

              aanvraag om de vergunning voor DVB-T;



            e
             aanvrager:

              degene die een aanvraag doet;



            f
            aanvraagdocument:

              document, als bedoeld in [artikel 5, eerste lid, van het besluit][ref2], ten behoeve van DVB-T;



            g
            multiplex:

              de radiofrequenties binnen het bereik van 470 tot 862 MHz, elk met een bandbreedte van 8 MHz, die benodigd
      zijn voor de opbouw van een van de vier DVB-T-verzorgingsgebieden;



            h
             vergunninghouder:

              de houder van een vergunning voor DVB-T.


      [ref1]: https://wetten.overheid.nl/BWBR0009997
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel5
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009997
      - id: ref2
        bwb_id: BWBR0009997
        artikel: '5'
  - number: '2.1'
    text: |-
      Voor DVB-T is één vergunning beschikbaar volgens het DVB-T systeem, voor het gebruik van frequentieruimte binnen
      het frequentiebereik 470 - 862 MHz.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel2
  - number: '2.2'
    text: |-
      Binnen de frequentieruimte, bedoeld in het eerste lid, exploiteert de vergunninghouder ten hoogste vier
      multiplexen.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel2
  - number: '2.3'
    text: |-
      De voor DVB-T beschikbare frequentieruimte wordt op basis van de voortgang van het internationale
      frequentiecoördinatieproces met betrekking tot DVB-T voortdurend geactualiseerd. Een actueel overzicht van de
      beschikbare frequentieruimte is tot het tijdstip waarop de vergunning voor DVB-T wordt verleend verkrijgbaar bij de
      divisie Telecom van de Inspectie Verkeer en Waterstaat, Postbus 450, 9700 AL Groningen.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel2
  - number: '3'
    text: |-
      De vergunning voor DVB-T wordt verleend door middel van de procedure van een vergelijkende toets, met inachtneming
      van [artikel 14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel14
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '14'
  - number: '4.1'
    text: |-
      Degene die in aanmerking wenst te komen voor de vergunning voor DVB-T, verzoekt de minister per brief om toezending
      van een aanvraagdocument. Het aanvraagdocument kan worden opgevraagd met ingang van 30 juli 2001.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel4
  - number: '4.2'
    text: |-
      Het verzoek wordt als volgt geadresseerd: De Minister van Onderwijs, Cultuur en Wetenschappen p/a mevrouw mr.
      W.H.G. Kroon-Welp, notaris Pels Rijcken & Droogleever Fortuijn Postbus 11756 2502 AT Den Haag Nederland
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel4
  - number: '4.3'
    text: |-
      Een aanvraagdocument wordt toegezonden na ontvangst van een bedrag van zevenhonderdvijftig gulden (EUR 340,34) dat
      onder vermelding van ‘aanvraagdocument vergunning voor DVB-T’ wordt overgemaakt op onderstaand bankrekeningnummer:
      228166837 F. van Lanschot Bankiers N.V., Den Haag t.n.v. Pels Rijcken & Droogleever Fortuijn, derdengelden
      notariaat, inzake DVB-T.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel4
  - number: '5.1'
    text: |-
      Eenieder aan wie een aanvraagdocument is toegezonden, kan vragen met betrekking tot dat document per brief en per
      elektronische post aan de minister stellen. Vragen gesteld per elektronische post worden tevens per brief gesteld.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel5
  - number: '5.2'
    text: |-
      Degene die een vraag als bedoeld in het eerste lid stelt, vergezelt iedere vraag van een niet tot zijn identiteit
      herleidbare versie.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel5
  - number: '5.3'
    text: |-
      De vragen, bedoeld in het eerste en tweede lid, worden uiterlijk 17 augustus 2001, om 14.00 uur per brief door de
      minister ontvangen.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel5
  - number: '5.4'
    text: |-
      De vragen worden geadresseerd op de wijze, bedoeld in [artikel 4, tweede lid][ref1]. De elektronische post wordt
      verzonden naar het adres whg.kroon@prdf.nl.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel4
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '4'
  - number: '5.5'
    text: |-
      De minister verzendt de antwoorden op de vragen die tijdig per brief zijn ontvangen uiterlijk op 7 september 2001
      en stuurt de gestelde vragen met de daarop gegeven antwoorden gelijktijdig in afschrift aan eenieder aan wie een
      aanvraagdocument is toegezonden.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel5
  - number: '5.6'
    text: De identiteit van de vragensteller is alleen aan de notaris bekend.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel5
  - number: '6.1'
    text: |-
      De aanvraag omvat de gegevens en bescheiden, bedoeld in de bij deze regeling behorende bijlage, volgens de
      specificaties in die bijlage.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel6
  - number: '6.2'
    text: De aanvraag wordt ingedeeld overeenkomstig de bijlage, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel6
  - number: '6.3'
    text: |-
      De door de aanvrager in te dienen aanvraag is in de Nederlandse taal gesteld en is aangeduid als origineel
      exemplaar. Dit exemplaar wordt ondertekend door de aanvrager.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel6
  - number: '6.4'
    text: De aanvraag omvat zeven als zodanig aangeduide afschriften van het origineel exemplaar, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel6
  - number: '6.5'
    text: |-
      Indien er verschillen bestaan tussen het origineel exemplaar, bedoeld in het derde lid, en de afschriften, bedoeld
      in het vierde lid, is het origineel exemplaar van de aanvraag bindend.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel6
  - number: '6.6'
    text: |-
      De aanvrager informeert de minister onmiddellijk over de wijzigingen met betrekking tot de gegevens en bescheiden,
      bedoeld in het eerste lid, die na indiening van de aanvraag plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel6
  - number: '7.1'
    text: Elke aanvrager dient slechts één aanvraag in.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel7
  - number: '7.2'
    text: De aanvraag wordt uiterlijk 28 september 2001, om 14.00 uur ontvangen.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel7
  - number: '7.3'
    text: |-
      Indien de aanvraag via de post wordt verzonden, wordt deze als volgt geadresseerd: De Minister van Onderwijs,
      Cultuur en Wetenschappen p/a mevrouw mr. W.H.G. Kroon-Welp, notaris Pels Rijcken & Droogleever Fortuijn Postbus
      11756 2502 AT Den Haag Nederland
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel7
  - number: '7.4'
    text: |-
      Indien de aanvraag niet via de post wordt verzonden, wordt deze geadresseerd aan en afgeleverd op het volgende
      adres: De Minister van Onderwijs, Cultuur en Wetenschappen p/a mevrouw mr. W.H.G. Kroon-Welp, notaris Pels Rijcken
      & Droogleever Fortuijn Koningin Julianaplein 30 Gebouw Babylon Kantoren A, 5e verdieping Den Haag Nederland
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel7
  - number: '7.5'
    text: De minister bevestigt schriftelijk de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel7
  - number: '8.1'
    text: Een aanvrager kan een schriftelijk verzoek indienen om zijn aanvraag mondeling toe te lichten.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel8
  - number: '8.2'
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt uiterlijk ontvangen op het tijdstip, bedoeld in
      [artikel 7, tweede lid][ref1], en op het adres, bedoeld in [artikel 7, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012634#Artikel7
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0012634
        artikel: '7'
  - number: '9'
    text: |-
      Indien de aanvraag niet voldoet aan een of meer van de in de [artikelen 4][ref1] en [7][ref2] gestelde eisen,
      wordt de aanvraag niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012634#Artikel7
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012634
        artikel: '7'
  - number: '10.1'
    text: |-
      Indien de aanvraag niet voldoet aan een of meer van de in [artikel 6][ref1] gestelde eisen, stelt de minister de
      aanvrager in de gelegenheid het verzuim binnen een week te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel6
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '6'
  - number: '10.2'
    text: |-
      Indien het verzuim, bedoeld in het eerste lid, binnen de termijn, bedoeld in het eerste lid, niet is hersteld,
      of de aanvraag ook na herstel niet voldoet aan een of meer van de in [artikel 6][ref1] gestelde eisen, wordt de
      aanvraag niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel6
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '6'
  - number: '11.1'
    text: |-
      De Minister van Verkeer en Waterstaat deelt de aanvrager binnen twee weken na de datum, bedoeld in
      [artikel 7, tweede lid][ref1], schriftelijk mee of zijn aanvraag in behandeling wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel7
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '7'
  - number: '11.2'
    text: |-
      Indien is voldaan aan de in de [artikelen 4][ref1], [6][ref2] en [7][ref3] gestelde eisen, wordt de aanvrager
      getoetst aan de eisen, bedoeld in [artikel 12][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012634#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012634#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0012634#Artikel12
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012634
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0012634
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0012634
        artikel: '12'
  - number: '12'
    text: 'Een aanvrager voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.a
    text: |-
      wat betreft rechtsvorm van de aanvrager: de aanvrager is een rechtspersoon, opgericht in overeenstemming met het
      recht van een van de lidstaten van de Europese Unie of een van de overige lidstaten van de Europese Economische
      Ruimte, en heeft zijn statutaire hoofdzetel, zijn hoofdbestuur of zijn hoofdvestiging binnen de Europese
      Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.b
    text: 'wat betreft de financiële positie van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.b.1º
    text: |-
      de aanvrager verkeert niet in staat van faillissement, noch is een verzoek tot faillietverklaring van de aanvrager
      ingediend;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.b.2º
    text: |-
      de aanvrager is geen surseance van betaling verleend, noch is ten aanzien van de aanvrager surseance van betaling
      aangevraagd;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.b.3º
    text: er is geen beslag gelegd op een of meer bedrijfsmiddelen van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.b.4º
    text: |-
      de aanvrager kan aantoonbaar beschikken over voldoende financiële middelen ten behoeve van de ingebruikneming van
      de frequenties;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.c
    text: 'wat betreft de kennis en ervaring van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.c.1º
    text: |-
      de aanvrager beschikt aantoonbaar over kennis van en ervaring met de aanleg van een infrastructuur voor
      televisieomroep;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.c.2º
    text: |-
      de aanvrager beschikt aantoonbaar over kennis van en ervaring met de instandhouding en exploitatie van een
      infrastructuur voor televisieomroep, waarbij deze ervaring ten minste een aaneengesloten periode van één jaar
      beslaat en voortduurt op het moment van de vergelijkende toets;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.c.3º
    text: |-
      de aanvrager beschikt aantoonbaar over specifieke kennis van en ervaring met de aanleg, instandhouding en
      exploitatie van een infrastructuur voor aardse televisieomroep ten behoeve van het leveren van diensten gebaseerd
      op de DVB-T-standaard ETSI EN 300 744, waarbij deze kennis en ervaring ook verkregen of opgedaan mag zijn door
      middel van voldoende grootschalige technische experimenten met en onderzoek naar DVB-T;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.c.4º
    text: de aanvrager beschikt aantoonbaar over kennis van de Nederlandse markt voor de doorgifte van televisiesignalen;
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: 12.d
    text: |-
      wat betreft de technische middelen: de aanvrager beschikt aantoonbaar over de technische middelen die hem in staat
      stellen een infrastructuur voor DVB-T in Nederland aan te leggen, in stand te houden en te exploiteren.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel12
  - number: '13.1'
    text: |-
      De minister stelt binnen vier weken na de datum, bedoeld in [artikel 7, tweede lid][ref1], vast of de aanvrager
      voldoet aan de eisen, bedoeld in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012634#Artikel12
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0012634
        artikel: '12'
  - number: '13.2'
    text: |-
      Indien uit de aanvraag blijkt dat is voldaan aan de eisen, bedoeld in [artikel 12][ref1], stelt de Minister van
      Verkeer en Waterstaat de aanvrager hiervan onverwijld schriftelijk op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel12
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '12'
  - number: '13.3'
    text: |-
      Indien uit de aanvraag blijkt dat niet is voldaan aan de eisen, bedoeld in [artikel 12][ref1], wijst de Minister
      van Verkeer en Waterstaat de aanvraag af en stelt de aanvrager van deze afwijzing onverwijld schriftelijk op de
      hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel12
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '12'
  - number: '14.1'
    text: |-
      Indien slechts een aanvrager voldoet aan de eisen, bedoeld in [artikel 12][ref1], verleent de Minister van Verkeer
      en Waterstaat de vergunning voor DVB-T aan de aanvrager zonder toepassing van een vergelijkende toets.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel12
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '12'
  - number: '14.2'
    text: |-
      Indien meer dan een aanvrager voldoet aan de eisen, bedoeld in [artikel 12][ref1], worden de aanvragen van deze
      aanvragers beoordeeld in een vergelijkende toets aan de hand van de criteria, bedoeld in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0012634#Artikel16
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0012634
        artikel: '16'
  - number: '15'
    text: |-
      Indien [artikel 14, tweede lid][ref1], wordt toegepast en een aanvrager het verzoek, bedoeld in
      [artikel 8][ref2], heeft gedaan, stelt de minister hem daartoe binnen vijf weken na de datum, bedoeld in
      [artikel 7, tweede lid][ref3], in de gelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0012634#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0012634#Artikel7
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0012634
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0012634
        artikel: '7'
  - number: '16.1'
    text: |-
      Bij de uitvoering van de vergelijkende toets worden de bedrijfsplannen, bedoeld in de bij deze regeling behorende
      bijlage, van de aanvragers onderling vergeleken en wordt getoetst aan de hand van de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.1.a
    text: |-
      de concurrentiekracht van het aanbod van televisieprogramma's van de aanvrager ten opzichte van het aanbod van
      televisieprogramma's die via omroepnetwerken worden uitgezonden,
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.1.b
    text: de plannen voor nieuwe diensten,
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.1.c
    text: de aanpak van het interferentieprobleem,
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.1.d
    text: de plannen voor de ingebruikname van de multiplexen,
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.1.e
    text: de maatregelen ter bevordering van een open toegang tot de infrastructuur voor DVB-T,
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.1.f
    text: de technische samenwerking met de publieke omroep, en
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.1.g
    text: de plannen om aan te sluiten bij de Europese standaardisering van de ontvangers.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: '16.2'
    text: 'Bij de toetsing aan het criterium, bedoeld in het eerste lid, onderdeel a, wordt nagegaan:'
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.2.a
    text: of het aanbod van televisieprogramma's van de aanvrager naar verwachting een breed publiek zal aanspreken, en
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: 16.2.b
    text: |-
      of de tarieven voor het aanbod van televisieprogramma's van de aanvrager een gunstige prijs/kwaliteitsverhouding
      hebben ten opzichte van de tarieven voor het aanbod van televisieprogramma's die via omroepnetwerken worden
      uitgezonden.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel16
  - number: '17.1'
    text: |-
      De minister kan in het kader van de uitvoering van de vergelijkende toets de aanvrager om nadere gegevens en
      bescheiden verzoeken, die voor de beslissing op de aanvraag nodig zijn.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel17
  - number: '17.2'
    text: |-
      De nadere gegevens en bescheiden, bedoeld in het eerste lid, kunnen slechts betrekking hebben op de criteria
      bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel16
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '16'
  - number: '18.1'
    text: |-
      Nadat de vergelijkende toets heeft plaatsgevonden maakt de minister aan de aanvrager die het best voldoet aan
      de criteria, bedoeld in [artikel 16][ref1], bekend, dat hij voornemens is hem voor te dragen aan de Minister van
      Verkeer en Waterstaat als degene die in aanmerking komt voor de vergunning voor DVB-T.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel16
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '16'
  - number: '18.2'
    text: |-
      De minister stelt de aanvrager, bedoeld in het eerste lid, niet eerder in kennis van het voornemen, bedoeld in
      het eerste lid, dan nadat ten minste vier weken zijn verstreken na de datum van verzending van de schriftelijke
      kennisgevingen, bedoeld in [artikel 13, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel13
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '13'
  - number: '18.3'
    text: |-
      De aanvrager, bedoeld in het eerste lid, geeft binnen een termijn van een week aan of hij de vergunning en de
      daaraan verbonden voorschriften en beperkingen aanvaardt.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel18
  - number: '18.4'
    text: |-
      Indien de aanvrager, bedoeld in het eerste lid, de vergunning aanvaardt, wordt de vergunning op voordracht van de
      minister door de Minister van Verkeer en Waterstaat aan hem verleend.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel18
  - number: '18.5'
    text: |-
      Indien de aanvrager, bedoeld in het eerste lid, de vergunning niet aanvaardt, wordt de procedure bedoeld in het
      eerste tot en met vierde lid overeenkomstig toegepast op de eerstvolgende aanvrager die na de aanvrager die de
      vergunning niet aanvaardt, het best voldoet aan de criteria, bedoeld in [artikel 16][ref1], en zonodig herhaald
      totdat een aanvrager de vergunning en de daaraan verbonden voorschriften en beperkingen wel aanvaardt.


      [ref1]: https://wetten.overheid.nl/BWBR0012634#Artikel16
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012634
        artikel: '16'
  - number: '18.6'
    text: |-
      Nadat de vergunning aan de aanvrager is verleend, wijst de Minister van Verkeer en Waterstaat de overige aanvragen
      af.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel18
  - number: '19'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel19
  - number: '20'
    text: 'Deze regeling wordt aangehaald als: Regeling aanvraag vergunning en uitvoering vergelijkende toets DVB-T.'
    url: https://wetten.overheid.nl/BWBR0012634/2001-07-27#Artikel20
