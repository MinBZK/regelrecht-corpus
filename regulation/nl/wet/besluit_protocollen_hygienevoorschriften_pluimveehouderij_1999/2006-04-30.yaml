  text: |-
    gelet op de Verordening hygiënevoorschriften pluimveehouderij 1999,

    op 11 november 1999 vastgesteld het navolgende

    BESLUIT
  url: https://wetten.overheid.nl/BWBR0010848/2006-04-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit neemt de terminologie, als omschreven in
      [artikel 1 van de Verordening hygiënevoorschriften pluimveehouderij 1999][ref1], over.


      [ref1]: https://wetten.overheid.nl/BWBR0010849#Artikel1
    url: https://wetten.overheid.nl/BWBR0010848/2006-04-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010849
        artikel: '1'
  - number: '2'
    text: |-
      Ten aanzien van de aanwezigheid en het gebruik van drinkwatersystemen op pluimveebedrijven dienen de voorschriften
      die zijn gesteld in het in [bijlage I][ref1] opgenomen Protocol in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010848
    url: https://wetten.overheid.nl/BWBR0010848/2006-04-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010848
  - number: '3'
    text: |-
      Ieder bedrijf dat hygiëne-onderzoeken, onderzoeken op de aanwezigheid van Salmonella en/of Campylobacter in de stal
      op pluimveebedrijven en/of kuikenbroederijen of drinkwateronderzoeken verricht en dat erkend wil worden door de
      Voorzitter, dient te voldoen aan de eisen van het in [bijlage II][ref1] opgenomen Protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0010848
    url: https://wetten.overheid.nl/BWBR0010848/2006-04-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010848
  - number: '4'
    text: |-
      Ieder bedrijf dat hygiëne-onderzoeken op pluimveebedrijven verricht en dat erkend wil worden door de Voorzitter
      dient het hygiëne-onderzoek uit te voeren volgens de voorschriften van het in [bijlage III][ref1] opgenomen
      Protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0010848
    url: https://wetten.overheid.nl/BWBR0010848/2006-04-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010848
  - number: '5'
    text: |-
      Ieder bedrijf dat onderzoeken op de aanwezigheid van Salmonella en/of Campylobacter in de stal op pluimveebedrijven
      verricht en dat erkend wil worden door de Voorzitter dient het onderzoek uit te voeren volgens de voorschriften van
      het in [bijlage IV][ref1] opgenomen Protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0010848
    url: https://wetten.overheid.nl/BWBR0010848/2006-04-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010848
  - number: '6'
    text: |-
      Laboratoria die erkend willen worden, als bedoeld in artikel 4, achtste lid, van de verordening, dienen te voldoen
      aan de in [Bijlage V][ref1] opgenomen erkenningsvoorwaarden.

      Erkende laboratoria dienen de analyse van de monsters uit te voeren overeenkomstig de voorschriften opgenomen in
      [Bijlage VI][ref2], [VII][ref3], [VIII][ref4] en [IX][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010848
      [ref2]: https://wetten.overheid.nl/BWBR0010848
      [ref3]: https://wetten.overheid.nl/BWBR0010848
      [ref4]: https://wetten.overheid.nl/BWBR0010848
      [ref5]: https://wetten.overheid.nl/BWBR0010848
    url: https://wetten.overheid.nl/BWBR0010848/2006-04-30#Artikel6
    references:
