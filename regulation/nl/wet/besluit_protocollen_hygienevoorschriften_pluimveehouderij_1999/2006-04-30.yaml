  - number: '7'
    text: |-
      De door het Bestuur in [Bijlage X][ref1] aangewezen instantie(s) is (zijn) belast met de controle op de naleving
      van het bepaalde bij of krachtens de [Verordening hygiënevoorschriften pluimveehouderij 1999][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010848
      [ref2]: https://wetten.overheid.nl/BWBR0010849
