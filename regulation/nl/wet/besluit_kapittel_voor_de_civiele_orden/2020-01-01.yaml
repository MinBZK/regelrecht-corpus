---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_kapittel_voor_de_civiele_orden
regulatory_layer: WET
publication_date: '2019-09-26'
valid_from: '2020-01-01'
bwb_id: BWBR0007026
url: https://wetten.overheid.nl/BWBR0007026/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 17 juni 1994, Stafafdeling Constitutionele Zaken en
    Wetgeving, nr. CW94/U627;

    Gelet op de artikelen III en VII van de rijkswet van 15 april 1994 houdende wijziging van de wet van 4 april 1892,
    houdende instelling van de Orde van Oranje-Nassau, en van de wet van 29 september 1815, houdende instelling van de
    Orde van de Nederlandse Leeuw, alsmede instelling van het Kapittel voor de civiele orden (Stb. 1994, 350);

    De Raad van State van het Koninkrijk gehoord (advies van 4 augustus 1994, No. W04.94.0410/K);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 16 november 1994, Directoraat-Generaal
    Openbaar Bestuur, nr. KP94/71;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel1
  - number: 1.b
    text: 'Het Kapittel: het Kapittel voor de civiele orden.'
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel1
  - number: 1a
    text: 'Het Kapittel heeft tevens tot taak:'
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel1a
  - number: 1a.a
    text: Onze Minister wie het aangaat te adviseren over het verlenen van de Erepenning voor Menslievend Hulpbetoon;
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel1a
  - number: 1a.b
    text: voorlichting te geven over de werking van het decoratiestelsel.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel1a
  - number: '2.1'
    text: |-
      De voorzitter en de overige leden van het Kapittel worden op voordracht van Onze Minister bij koninklijk besluit
      benoemd, zulks met uitzondering van de Kanselier van de Orde van de Nederlandse Leeuw. De leden wordt op hun
      aanvraag ontslag verleend. In bijzondere gevallen kunnen zij bij koninklijk besluit in hun functie worden geschorst
      en uit hun functie worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      De voorzitter en de overige te benoemen leden worden benoemd op grond van hun goede inzicht in de maatschappelijke
      verhoudingen. Bij de benoeming wordt gestreefd naar een brede maatschappelijke samenstelling van het Kapittel.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      Ambtenaren van ministeries en andere personen die belast zijn met de beoordeling van voorstellen tot verlening van
      een onderscheiding, worden niet benoemd tot lid van het Kapittel.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel2
  - number: '2.4'
    text: |-
      De leden als bedoeld in het tweede lid worden voor een periode van vier jaar benoemd. Zij kunnen ten hoogste
      eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel2
  - number: '2.5'
    text: Het Kapittel wijst uit zijn midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het Kapittel wordt ondersteund door de Kanselarij der Nederlandse orden, waarvan het bureau van het Kapittel
      onderdeel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3
  - number: '3.2'
    text: Het Kapittel wordt bijgestaan door een secretaris die de leiding heeft over het bureau van het Kapittel.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3
  - number: '3.3'
    text: De secretaris en de medewerkers van het bureau zijn geen lid van het Kapittel.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit wordt, het Kapittel gehoord, besloten tot het aangaan van een arbeidsovereenkomst
      met de secretaris. Tot beëindiging van de arbeidsovereenkomst wordt bij koninklijk besluit,
      het Kapittel gehoord, besloten, tenzij de arbeidsovereenkomst wordt opgezegd op grond van
      [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: '3.5'
    text: De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan het Kapittel.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3
  - number: '3.6'
    text: Het Kapittel stelt regels vast met betrekking tot de werkwijze van het bureau.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3
  - number: 3a.1
    text: |-
      Ten aanzien van de ambtenaren van de Kanselarij der Nederlandse orden en de secretaris gelden de voor
      alle ambtenaren geldende arbeidsvoorwaarden die zijn opgenomen in de laatstelijk afgesloten collectieve
      arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Op verzoek van de Kanselarij der Nederlandse orden kunnen in de collectieve arbeidsovereenkomst, bedoeld in het
      eerste lid, andere arbeidsvoorwaarden voor de ambtenaren van de Kanselarij der Nederlandse orden worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel3a
  - number: '4'
    text: Het Kapittel stelt, onder goedkeuring van Onze Minister, een instructie vast over zijn werkwijze.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het Kapittel kan zich rechtstreeks wenden tot bestuursorganen en andere organisaties en personen met een verzoek
      om inlichtingen.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel5
  - number: '5.2'
    text: Het Kapittel kan deskundigen uitnodigen om aan vergaderingen deel te nemen.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      Voor het vaststellen van een advies is de aanwezigheid van tenminste drie leden vereist. De adviezen van het
      Kapittel worden uitgebracht overeenkomstig het gevoelen van de meerderheid van de aanwezige leden.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij staking van de stemmen beslist de stem van de voorzitter van de vergadering. Van die omstandigheid wordt in het
      advies melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel6
  - number: '6.3'
    text: |-
      Desgewenst kan een lid zijn afwijkende mening ingebracht ter vergadering, in een minderheidsnota bij het advies
      voegen.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het Kapittel verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister die het aangaat zendt een afschrift van het besluit inzake een voorstel tot verlening van een
      onderscheiding aan het Kapittel.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel7
  - number: '8'
    text: |-
      Het Kapittel verricht zijn werkzaamheden binnen het raam van de middelen welke hem jaarlijks ingevolge de
      desbetreffende begrotingswet ter beschikking worden gesteld, overeenkomstig de [Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013891
  - number: '9'
    text: |-
      Het Kapittel brengt Onze Minister jaarlijks voor 1 juni verslag uit van zijn werkzaamheden en bevindingen gedurende
      het daaraan voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      De voorzitter onderscheidenlijk de leden van het Kapittel ontvangen met inachtneming van het
      [Besluit vergoedingen adviescolleges en commissies][ref1] een vaste vergoeding welke is gebaseerd op het maximum
      van schaal 18 onderscheidenlijk van schaal 17 zoals overeengekomen in de in [artikel 3a, eerste lid][ref2],
      bedoelde collectieve arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0025279
      [ref2]: https://wetten.overheid.nl/BWBR0007026#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025279
      - id: ref2
        bwb_id: BWBR0007026
        artikel: 3a
  - number: '10.2'
    text: |-
      Voorts ontvangen de voorzitter en de leden een vergoeding van reis- en verblijfkosten en een
      telefoonkostenvergoeding volgens het als tweede vermelde percentage, genoemd in het koninklijk besluit van 22
      september 1977, houdende regeling van de vergoeding aan ambtenaren van kosten verbonden aan het gebruik van de
      privé-telefoonaansluiting voor dienstdoeleinden (*Stb.* 1977, 527).
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel10
  - number: '11'
    text: |-
      In afwijking van [artikel 3][ref1] kan de secretaris voor de eerste maal nadat dit besluit in werking is getreden
      worden benoemd zonder dat het Kapittel is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0007026#Artikel3
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007026
        artikel: '3'
  - number: '12'
    text: |-
      De artikelen I, onderdeel F, II, onderdelen E en F, III en IV van de rijkswet van 15 april 1994, houdende wijziging
      van de wet van 4 april 1892, houdende instelling van de Orde van Oranje-Nassau, en van de wet van 29 september
      1815, houdende instelling van de Orde van de Nederlandse Leeuw, alsmede instelling van het Kapittel voor de civiele
      orden (*Stb.* 1994, 350) en dit besluit treden in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin dit besluit wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit Kapittel voor de civiele orden.'
    url: https://wetten.overheid.nl/BWBR0007026/2020-01-01#Artikel13
