preamble:
  text: |-
    Gelet op artikel 12b, tweede lid, van de Binnenschepenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014428/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de controle op de inbouw en het functioneren van een radarinstallatie of een bochtaanwijzer, alsmede voor
      de afgifte van de verklaring, bedoeld in artikel 9 van de Voorschriften omtrent de inbouw en de controle van
      het functioneren van radarinstallaties en bochtaanwijzers voor de Rijnvaart, is de hierna volgende vergoeding
      verschuldigd:

      a. voor periodieke inspectie en afgifte van een verklaring € 154;

      b. voor herinspectie als gevolg van geconstateerde gebreken € 124.
    url: https://wetten.overheid.nl/BWBR0014428/2003-01-01#Artikel1
  - number: '2'
    text: Deze regeling treedt in werking met ingang van 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0014428/2003-01-01#Artikel2
  - number: '3'
    text: 'Deze regeling wordt aangehaald als: Regeling tarieven controle radarinstallaties en bochtaanwijzers Rijnvaart 2003.'
    url: https://wetten.overheid.nl/BWBR0014428/2003-01-01#Artikel3
