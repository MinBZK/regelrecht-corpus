        paragraaf: '3'
  - number: '25'
    text: |-
      1 De beoordeling van de kennis van de kandidaat wordt voor elk examenonderdeel afzonderlijk weergegeven in cijfers,
      waaraan een waardering wordt toegekend tussen 1,0 en 10,0 waarbij het cijfer 1,0 de laagste en het cijfer 10,0 de
      hoogste waardering aangeeft. In plaats van een waardering als bedoeld in de eerste volzin mag worden volstaan met
      de aanduiding “voldoende” of “onvoldoende”.

      2 De kandidaat is voor een examen bedoeld, in [artikel 23, eerste lid][ref1], geslaagd als hij voor elk van de
      onderdelen van het examen tenminste het cijfer 6,0 heeft behaald.

      3 Bij de beoordeling van de gemaakte opgaven van de onderdelen waarin examen wordt afgenomen, wordt, indien een
      opgave volgens het systeem van meerkeuze moet worden beantwoord, slechts voor het juiste antwoord het daarbij
      behoren-de aantal punten van de door de examencommissie vastgestelde waarderingsgraad toegekend. De kandidaat
      behaalt een voldoende voor een onderdeel van het examen indien hij tenminste 70 % van het totaal der punten heeft
      behaald.

      4 Indien een opgave van een onderdeel waarin examen wordt afgenomen niet moet worden beantwoord volgens het systeem
      van de meerkeuze wordt aan het oordeel van de commissie overgelaten hoeveel punten van de waarderingsgraad voor het
      antwoord kunnen worden toegekend. De kandidaat behaalt een voldoende voor een onderdeel van het examen indien hij
      tenminste 60 % van het totaal der punten heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel23
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '26'
    text: |-
      1 De voorzitter verleent, op verzoek van een kandidaat, geheel of gedeeltelijk ontheffing van een der examens,
      bedoeld in [artikel 23, eerste lid][ref1], indien deze kandidaat is geslaagd voor een ander examen, welke is
      afgenomen door een bevoegde autoriteit en dat naar het oordeel van de commissie gelijkwaardig is aan een der
      examens, bedoeld in [artikel 23, eerste lid][ref2].

      2 Het verzoek, bedoeld in het eerste lid, wordt uiterlijk 5 jaar nadat het gelijkwaardige examen met goed gevolg is
      afgelegd, ingediend.

      3 Een overzicht van dergelijke examens ligt bij het secretariaat van de commissie ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel23
