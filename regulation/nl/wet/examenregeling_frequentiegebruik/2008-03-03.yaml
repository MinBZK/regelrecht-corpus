  - number: '9'
    text: |-
      1 Indien een kandidaat zich ten aanzien van het examen aan enig bedrog heeft schuldig gemaakt en dit voor of
      tijdens het examen wordt ontdekt, wordt hem door de personen bedoeld in [artikel 7, eerste lid][ref1], of door of
      namens de voorzitter de deelname of de verdere deelname aan het examen ontzegd.

      2 Indien een kandidaat in enig ander opzicht in strijd met bij of krachtens deze regeling vastgestelde
      voorschriften heeft gehandeld en dit voor of tijdens het examen wordt ontdekt, wordt hem door de personen, bedoeld
      in [artikel 8, eerste lid][ref2], of door of namens de voorzitter de deelname of de verdere deelname aan het examen
      worden ontzegd.

      3 Indien de in het eerste of tweede lid bedoelde handelwijze van de kandidaat eerst na afloop van het examen wordt
      ontdekt, wordt door of namens de voorzitter het examen van de kandidaat die zich hieraan schuldig heeft gemaakt,
      ongeldig verklaard.

      4 Indien onvoorziene omstandigheden daartoe aanleiding geven, kan door of namens de voorzitter worden besloten dat
      het examen geheel of gedeeltelijk opnieuw wordt afgenomen.

      5 In de gevallen, bedoeld in het eerste tot en met derde lid, wordt door de in [artikel 7, eerste lid][ref3],
      bedoelde personen of door of namens de voorzitter daarvan onverwijld een schriftelijk verslag gemaakt.

      6 Het verslag dient te bevatten:

      a. het tijdstip waarop en het examen waarbij het voorval is geconstateerd;

      b. het tijdstip waarop het voorval heeft plaatsgevonden;

      c. de naam van de betrokken kandidaat;

      d. een duidelijke omschrijving van het voorval;

      e. de datum en het tijdstip waarop het verslag is opgemaakt;

      f. de zienswijze van de kandidaat;

      g. de naam en de handtekening van degene die het verslag heeft gemaakt.

      7 Een afschrift van het verslag wordt overhandigd dan wel zo spoedig mogelijk toegezonden aan de betrokken
      kandidaat. Voorts wordt -indien van toepassing- onverwijld een afschrift gezonden naar de voorzitter.

      8 De voorzitter informeert de betrokken kandidaat uiterlijk tien werkdagen na de datum waarop het verslag is
      opgemaakt over de verdere gang van zaken met betrekking tot het geconstateerde voorval.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0010039#Artikel7
