articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             wet:

              [Telecommunicatiewet][ref1];



            b
             besluit:

              [Frequentiebesluit][ref2];



            c
            commissie:

              examencommissie belast met het afnemen van een examen als bedoeld in deze regeling;



            d
             voorzitter:

              voorzitter van de commissie of bij ontstentenis van deze de plaatsvervangend voorzitter;



            e
             kandidaat:

              degene die zich voor deelneming aan een examen heeft aangemeld;



            f
            HAREC-certificaat:

              geharmoniseerde amateurradiozendexamen certificaat (HAREC), bedoeld in de Recommandatie T/R 61-02 van de
      Conférence Européenne des Postes et des Télécommunications (CEPT);



            g
             GMDSS:

              Global Maritime Distress and Safety System, het wereldwijde radiocommunicatiesysteem ten behoeve van de
      veiligheid van de scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel1
    references:
