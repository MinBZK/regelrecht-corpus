        bwb_id: BWBR0009997
  - number: '3'
    text: |-
      De voorzitter stelt datum, tijdstip en plaats van het examen vast. Van de wijze van aanmelding voor deelname aan
      het examen wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel3
  - number: '4'
    text: |-
      1 De vergoeding voor deelname aan een examen, dan wel een onderdeel van een examen wordt voorafgaande aan het
      examen binnen de door de voorzitter te bepalen termijn voldaan.

      2 Na tijdige voldoening van de verschuldigde vergoeding verzendt de voorzitter aan de kandidaat ten minste negen
      dagen voor de vastgestelde datum van het examen een schriftelijke uitnodiging tot deelname.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel4
  - number: '5'
    text: |-
      De vergoeding, bedoeld in [artikel 4, eerste lid][ref1], wordt niet terugbetaald indien een kandidaat zich
      terugtrekt dan wel niet op het examen verschijnt, tenzij bijzondere omstandigheden naar het oordeel van de
      voorzitter daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel4
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6'
    text: |-
      1 De commissie stelt de exameneisen vast.

      2 De kandidaat wordt voor de aanvang van het examen in kennis gesteld van de exameneisen.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel6
  - number: '7'
    text: |-
      1 Tijdens het examen zijn ten minste twee leden van de commissie dan wel door de commissie aangewezen personen
      aanwezig.

      2 De kandidaat legitimeert zich op verzoek van een van de in het eerste lid bedoelde personen.

      3 De kandidaat volgt de gegeven aanwijzingen met betrekking tot het examen.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel7
  - number: '8'
    text: |-
      1 In afwijking van het bepaalde in deze regeling kan de voorzitter een bijzonder examen afnemen indien:

      a. de gezondheidstoestand van een kandidaat het afnemen van het examen op de wijze, bedoeld in de
      [artikelen 3][ref1], [14, derde lid][ref2], en [16][ref3] , niet toelaat;

      b. een kandidaat gedurende lange periodes buiten Nederland verblijft;

      c. een kandidaat onvoldoende de Nederlandse taal beheerst.

      2 Tevens kan de voorzitter besluiten een bijzonder examen af te nemen indien bijzondere omstandigheden naar het
      oordeel van de voorzitter daartoe aanleiding geven.

      3 Het bijzondere examen wordt afgenomen door twee leden van de commissie.

      4 De voorzitter stelt datum, tijdstip en plaats van het bijzondere examen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010039#Artikel16
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel8
    references:
