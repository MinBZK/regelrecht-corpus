        paragraaf: '2'
  - number: '16'
    text: |-
      1 De examens Radiotechniek en Voorschriften I en II worden schriftelijk afgenomen.

      2 De tijdsduur van deze examens is ten minste een uur en ten hoogste twee uur.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel16
  - number: '17'
    text: |-
      1 Het examen Radiotechniek en Voorschriften I bestaat uit 50 vragen met 4 antwoordmogelijkheden. Het examen is met
      goed gevolg afgelegd indien de kandidaat ten minste 35 vragen goed heeft beantwoord.

      2 Het examen Radiotechniek en Voorschriften II bestaat uit 40 vragen met 3 antwoordmogelijkheden. Het examen is met
      goed gevolg afgelegd indien de kandidaat ten minste 29 vragen goed heeft beantwoord.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel17
  - number: '18'
    text: |-
      Een kandidaat, die heeft deelgenomen aan een bijzonder examen als bedoeld in [artikel 8][ref1], heeft het examen
      met goed gevolg afgelegd indien hij naar het oordeel van twee examinatoren heeft aangetoond dat hij voldoende
      kennis bezit op het gebied van de radiotechniek en de voorschriften die voor de amateurradiodienst gelden, voor
      zover het betreft de examens Radiotechniek en Voorschriften I of II.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel8
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19'
    text: |-
      Indien de kandidaat is geslaagd voor een buitenlands amateur-examen en op grond daarvan een, van de bevoegde
      autoriteit verkregen, HAREC-certificaat kan overleggen, is de kandidaat vrijgesteld van de examens, genoemd in
      [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel14
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '20'
    text: |-
      Indien het examen, genoemd in [artikel 14, eerste lid, onderdeel a][ref1], met gunstig gevolg is afgelegd, wordt
      door Agentschap Telecom van het Ministerie van Economische Zaken aan de kandidaat, op diens verzoek en tegen een
      door hem te betalen vergoeding, een HAREC-certificaat toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel14
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '21'
    text: |-
      Voor deelname aan een examen voor het verkrijgen van een certificaat van bediening moet de kandidaat de leeftijd
      van 16 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel21
  - number: '22'
    text: |-
      Bij de examens ter verkrijging van een vergunning voor het gebruik van frequentieruimte ten dienste van de
      maritieme radiocommunicatie worden kandidaten onderworpen aan een onderzoek naar hun:

      a. vaardigheid in de bediening van de maritieme radiozendapparaten;

      b. naar hun kennis van de bij of krachtens de wet gestelde regels, alsmede van de voorschriften en beperkingen
      die verbonden zijn aan vergunningen voor het gebruik van frequentieruimte ten dienste van de maritieme
      radiocommunicatie;

      c. naar hun kennis betreffende afwikkeling van het nood-, spoed- en veiligheidsverkeer, het openbaar verkeer, het
      onderling verkeer en het nautisch verkeer;

      d. naar hun kennis van de bepalingen van de maritiem mobiele dienst en de maritiem mobiele satellietdienst als
      bedoeld in de Radio Regulations van de Internationale Unie voor Telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel22
  - number: '23'
    text: |-
      1 De examens worden onderverdeeld in de volgende categorieën:

      a. het examen ter verkrijging van het algemeen certificaat maritieme radiocommunicatie;

      b. het examen ter verkrijging van het beperkt certificaat maritieme radiocommunicatie;

      c. het examen ter verkrijging van het basiscertificaat marifonie;

      d. het examen ter verkrijging van de module GMDSS-B.

      2 Deelname aan het examen voor de module GMDSS-B alsmede de verkrijging van deze module is slechts mogelijk nadat
      men is geslaagd voor het examen ter verkrijging van het basiscertificaat marifonie, of een daarmee gelijkgesteld
      certificaat.

      3 De exameneisen liggen ter inzage bij het examensecretariaat.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel23
  - number: '24'
    text: |-
      1 Voorzover praktische vaardigheden deel uitmaken van het examen mag de termijn tussen het schriftelijk examen en
      het praktijkgedeelte ten hoogste vijf jaar bedragen.

      2 De tijdsduur van de examens, bedoeld in [artikel 23, eerste lid][ref1], bedraagt:

      a. het examen ter verkrijging van het algemeen certificaat maritieme radio-communicatie: maximaal twee uur en
      dertig minuten, welke tijd als volgt wordt verdeeld over de onderdelen waarin examen wordt afgenomen:

      1º. voorschriften, procedures en techniek: 90 minuten

      2º. Engels: 30 minuten

      3º. aardrijkskunde: 30 minuten.

      b. het examen ter verkrijging van het beperkt certificaat maritieme radiocommunicatie: maximaal 90 minuten;

      c. het examen ter verkrijging van het basiscertificaat marifonie: maximaal 60 minuten;

      d. het examen ter verkrijging van de module GMDSS-B: 30 minuten.

      3 In afwijking van [artikel 7, eerste lid][ref2], is in geval van het examen, bedoeld in
      [artikel 23, eerste lid, onder c, en d][ref3], ten minste een lid van de commissie dan wel een door de voorzitter
      aangewezen persoon aanwezig, welke namens de voorzitter verantwoordelijk is voor het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0010039#Artikel23
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
