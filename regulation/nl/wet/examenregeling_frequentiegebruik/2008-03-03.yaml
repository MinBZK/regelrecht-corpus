        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12'
    text: In de gevallen waarin deze regeling niet voorziet, beslist de voorzitter.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel12
  - number: '13'
    text: |-
      Bij de examens ter verkrijging van een vergunning voor het gebruik van frequentieruimte ten dienste van het doen
      van onderzoekingen worden kandidaten onderworpen aan een onderzoek naar hun:

      a. radiotechnische kennis;

      b. vaardigheid in de bediening van het radiozendapparaat voorzover zulks nodig is met betrekking tot het gebruik
      van het radiozendapparaat;

      c. kennis van de bij of krachtens de wet gestelde regels, alsmede de voorschriften en beperkingen die verbonden
      zijn aan vergunningen voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen;

      d. kennis van de bepalingen van de amateur-dienst en amateur-satellietendienst volgens de Radio Regulations van de
      Internationale Unie voor Telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel13
  - number: '14'
    text: |-
      1 De examens worden onderverdeeld in de volgende categorieën:

      a. Radiotechniek en Voorschriften I;

      b. Radiotechniek en Voorschriften II.

      2 De exameneisen van de in het eerste lid bedoelde categorieën examens liggen ter inzage bij het
      examensecretariaat.

      3 De examens worden groepsgewijs afgenomen.
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel14
  - number: '15'
    text: |-
      Voor de melding en registratie van het gebruik van frequentieruimte met de bestemming ‘amateur’ of
      ‘amateursatelliet’ is in ieder geval vereist dat de kandidaat is geslaagd voor het volgende examen:

      a. voor volledige toegang tot de frequentieruimte, zoals met de letter F aangeduid in
      [bijlage 10 bij de Regeling gebruik van frequentieruimte zonder vergunning 2008][ref1]: het examen, genoemd in
      [artikel 14, eerste lid, onderdeel a][ref2];

      b. voor beperkte toegang tot de frequentieruimte, zoals met de letter N aangeduid in
      [bijlage 10 bij de Regeling gebruik van frequentieruimte zonder vergunning 2008][ref3]: het examen, genoemd in
      [artikel 14, eerste lid, onderdeel b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0023553
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0023553
      [ref4]: https://wetten.overheid.nl/BWBR0010039#Artikel14
    url: https://wetten.overheid.nl/BWBR0010039/2008-03-03#Artikel15
