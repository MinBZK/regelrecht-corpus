preamble:
  text: |-
    Gelet op artikel 11, eerste lid, onder b en c, en tweede lid, van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             wet:

              [Telecommunicatiewet][ref1];



            b
             besluit:

              [Frequentiebesluit][ref2];



            c
            commissie:

              examencommissie belast met het afnemen van een examen als bedoeld in deze regeling;



            d
             voorzitter:

              voorzitter van de commissie of bij ontstentenis van deze de plaatsvervangend voorzitter;



            e
             kandidaat:

              degene die zich voor deelneming aan een examen heeft aangemeld;



            f
            HAREC-certificaat:

              geharmoniseerde amateurradiozendexamen certificaat (HAREC), bedoeld in de Recommandatie T/R 61-02 van de
      Conférence Européenne des Postes et des Télécommunications (CEPT);



            g
             GMDSS:

              Global Maritime Distress and Safety System, het wereldwijde radiocommunicatiesysteem ten behoeve van de
      veiligheid van de scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0009997
  - number: '2'
    text: |-
      Voor het verkrijgen van een certificaat van bediening als bedoeld in artikel 4 van de Regeling aanvraag en
      toelating vergunningen op volgorde van binnenkomst of bij wijze van voorrang, en het verkrijgen van een vergunning
      voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen als bedoeld in [artikel 5][ref1]
      van genoemde regeling, is vereist dat de kandidaat met goed gevolg een examen heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel5
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3'
    text: |-
      De voorzitter stelt datum, tijdstip en plaats van het examen vast. Van de wijze van aanmelding voor deelname aan
      het examen wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel3
  - number: '4'
    text: |-
      1 De vergoeding voor deelname aan een examen, dan wel een onderdeel van een examen wordt voorafgaande aan het
      examen binnen de door de voorzitter te bepalen termijn voldaan.

      2 Na tijdige voldoening van de verschuldigde vergoeding verzendt de voorzitter aan de kandidaat ten minste negen
      dagen voor de vastgestelde datum van het examen een schriftelijke uitnodiging tot deelname.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel4
  - number: '5'
    text: |-
      De vergoeding, bedoeld in [artikel 4, eerste lid][ref1], wordt niet terugbetaald indien een kandidaat zich
      terugtrekt dan wel niet op het examen verschijnt, tenzij bijzondere omstandigheden naar het oordeel van de
      voorzitter daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel4
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6'
    text: |-
      1 De commissie stelt de exameneisen vast.

      2 De kandidaat wordt voor de aanvang van het examen in kennis gesteld van de exameneisen.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel6
  - number: '7'
    text: |-
      1 Tijdens het examen zijn ten minste twee leden van de commissie dan wel door de commissie aangewezen personen
      aanwezig.

      2 De kandidaat legitimeert zich op verzoek van een van de in het eerste lid bedoelde personen.

      3 De kandidaat volgt de gegeven aanwijzingen met betrekking tot het examen.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel7
  - number: '8'
    text: |-
      1 In afwijking van het bepaalde in deze regeling kan de voorzitter een bijzonder examen afnemen indien:

      a. de gezondheidstoestand van een kandidaat het afnemen van het examen op de wijze, bedoeld in de
      [artikelen 3][ref1], [14, derde lid][ref2], [16][ref3] en [18][ref4], niet toelaat;

      b. een kandidaat gedurende lange periodes buiten Nederland verblijft;

      c. een kandidaat onvoldoende de Nederlandse taal beheerst.

      2 Tevens kan de voorzitter besluiten een bijzonder examen af te nemen indien bijzondere omstandigheden naar het
      oordeel van de voorzitter daartoe aanleiding geven.

      3 Het bijzondere examen wordt afgenomen door twee leden van de commissie.

      4 De voorzitter stelt datum, tijdstip en plaats van het bijzondere examen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010039#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0010039#Artikel18
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel8
