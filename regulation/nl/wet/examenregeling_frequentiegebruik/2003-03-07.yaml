  - number: '28'
    text: |-
      1 Het certificaat wordt verkregen door het indienen

      van een verzoek en overlegging van de daartoe benodigde bescheiden bij het examensecretariaat van de divisie
      Telecom van de Inspectie Verkeer en Waterstaat.

      2 Dit verzoek wordt uiterlijk 5 jaar nadat het examen met gunstig gevolg is afgelegd ingediend.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel28
  - number: '29'
    text: |-
      Jaarlijks, vóór 1 mei, brengt de commissie aan de directeur-hoofdinspecteur van de divisie Telecom van de Inspectie
      Verkeer en Waterstaat verslag uit van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel29
  - number: '30'
    text: |-
      1 De leden van de commissie ontvangen uit ’s Rijks kas een vergoeding van reis- en verblijfkosten.

      2 Het vacatiegeld voor de leden, de voorzitter en de plaatsvervangend voorzitter, dat zij ontvangen voor zover hun
      benoeming niet haar oorzaak vindt in het ambt dat zij bekleden, komt overeen met het maximumbedrag, genoemd bij de
      categorie "algemeen" in [artikel 2 van de Regeling maximumbedragen vacatiegeld](onbekend) 1999.

      3 Vacatiegelden worden toegekend overeenkomstig het [Vacatiegeldenbesluit 1988][ref1] (Stb. 205).


      [ref1]: https://wetten.overheid.nl/BWBR0004317
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004317
  - number: '31'
    text: |-
      1 De commissie is samengesteld uit door de Minister van Verkeer en Waterstaat benoemde leden.

      2 De leden worden voorgedragen door de directeur-hoofdinspecteur van de divisie Telecom van de Inspectie Verkeer
      en Waterstaat.

      3 De voor te dragen personen dienen ter zake van één of meer onderwerpen, waarover het onderzoek zich uitstrekt,
      deskundig te zijn.

      4 Het voorzitterschap alsmede het secretariaat van de commissie wordt verzorgd door de divisie Telecom van de
      Inspectie Verkeer en Waterstaat.

      5 Het secretariaat staat onder leiding van de secretaris.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel31
  - number: '32'
    text: |-
      De leden van de commissie kunnen worden ontslagen door de Minister van Verkeer en Waterstaat:

      a. op eigen verzoek;

      b. op grond van nalatigheid.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel32
  - number: '33'
    text: |-
      Als instantie, welke is belast met het afnemen van de examens ter verkrijging van een vergunning voor het gebruik
      van frequentieruimte ten dienste van het doen van onderzoekingen, wordt aangewezen de Examencommissie voor
      amateurradiozendexamens.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel33
  - number: '34'
    text: |-
      De examencommissie heeft als taak:

      a. het tenminste tweemaal per jaar organiseren van examens, waarin kandidaten worden onderworpen aan een onderzoek;

      b. het vaststellen van het resultaat van het ingestelde onderzoek, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel34
  - number: '35'
    text: |-
      In de commissie zijn vertegenwoordigd de landelijke verenigingen van radiozendamateurs en bestaat uit ten minste 20
      en ten hoogste 30 leden.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel35
  - number: '36'
    text: |-
      1 De commissie benoemt uit haar midden een aantal leden die, onder verantwoordelijkheid van de voorzitter, belast
      zijn met de uitvoering van de besluiten van de commissie.

      2 De commissie kan uit haar midden werkgroepen instellen die, onder verantwoordelijkheid van de voorzitter, belast
      zijn met de uitvoering van [artikel 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel34
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010039
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '37'
    text: |-
      Als instantie, welke is belast met het afnemen van de examens ter verkrijging van een vergunning voor het gebruik
      van frequentieruimte ten dienste van maritieme radiocommunicatie, wordt aangewezen de Examencommissie voor
      maritieme radiocommunicatie, welke is belast met het afnemen van de examens ter verkrijging van het algemeen
      certificaat maritieme radiocommunicatie, het beperkt certificaat maritieme radiocommunicatie, het basiscertificaat
      marifonie, en de module GMDSS-B, voorzover de examens niet onder verantwoordelijkheid van de Minister van
      Onderwijs, Cultuur en Wetenschappen vallen.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel37
  - number: '38'
    text: |-
      De commissie heeft als taak:

      a. het tenminste eenmaal per jaar organiseren van examens, waarin kandidaten worden onderworpen aan een onderzoek;

      b. het vaststellen van het resultaat van het ingestelde onderzoek, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel38
  - number: '39'
    text: |-
      1 In de commissie zijn vertegenwoordigd instellingen die mede zorg dragen voor de organisatie van de examens.

      2 Het voorzitterschap alsmede het secretariaat van de commissie wordt verzorgd door de divisie Telecom van de
      Inspectie Verkeer en Waterstaat. Het secretariaat staat onder leiding van de secretaris.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel39
  - number: '40'
    text: De commissie is bevoegd de haar opgelegde taak geheel of gedeeltelijk uit te besteden aan derden.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel40
  - number: '41'
    text: Deze regeling treedt in werking met ingang van 15 december 1998.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel41
  - number: '42'
    text: 'Deze regeling wordt aangehaald als: Examenregeling frequentiegebruik.'
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel42
