        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12'
    text: In de gevallen waarin deze regeling niet voorziet, beslist de voorzitter.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel12
  - number: '13'
    text: |-
      Bij de examens ter verkrijging van een vergunning voor het gebruik van frequentieruimte ten dienste van het doen
      van onderzoekingen worden kandidaten onderworpen aan een onderzoek naar hun:

      a. radiotechnische kennis;

      b. vaardigheid in de bediening van het radiozendapparaat, waaronder het seinen en opnemen van morsetekens,
      voorzover zulks nodig is met betrekking tot het gebruik van het radiozendapparaat;

      c. kennis van de bij of krachtens de wet gestelde regels, alsmede de voorschriften en beperkingen die verbonden
      zijn aan vergunningen voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen;

      d. kennis van de bepalingen van de amateur-dienst en amateur-satellietendienst volgens de Radio Regulations van de
      Internationale Unie voor Telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel13
  - number: '14'
    text: |-
      1 De examens worden onderverdeeld in de volgende categorieën:

      a. Radiotechniek en Voorschriften I;

      b. Radiotechniek en Voorschriften II;

      c. Opnemen en Seinen van morsetekens.

      2 De exameneisen van de in het eerste lid bedoelde categorieën examens liggen ter inzage bij het
      examensecretariaat.

      3 De examens worden groepsgewijs afgenomen.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel14
  - number: '15'
    text: |-
      Voor het verkrijgen van een vergunning voor het gebruik van frequentieruimte ten dienste van het doen van
      onderzoekingen in de hieronder aangegeven categorieën is in ieder geval vereist dat de kandidaat is geslaagd voor
      de volgende examens:

      a. voor categorie A: de examens, genoemd in [artikel 14, eerste lid, onder a en c][ref1];

      b. voor categorie C: het examen, genoemd in [artikel 14, eerste lid, onder a][ref2];

      c. voor categorie N: het examen, genoemd in [artikel 14, eerste lid onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010039#Artikel14
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel15
    references:
