  - number: '20'
    text: |-
      1 Indien de kandidaat is geslaagd voor een buitenlands amateur-examen en op grond daarvan een, van de bevoegde
      autoriteit verkregen, HAREC-certificaat niveau A respectievelijk B kan overleggen, is de kandidaat vrijgesteld
      van de examens, genoemd in [artikel 14, eerste lid, onder a en c][ref1], respectievelijk van het examen genoemd in
      [artikel 14, eerste lid, onder a][ref2].

      2 Indien de kandidaat is geslaagd voor een ander buitenlands amateur-examen dan bedoeld in het eerste
      lid, of voor een ander examen in het opnemen en seinen van morsetekens, dat is afgenomen door een bevoegde
      autoriteit en dat naar het oordeel van de commissie gelijkwaardig is aan een der examens bedoeld in
      [artikel 14, eerste lid][ref3], geeft de voorzitter hem geheel of gedeeltelijk ontheffing van één of meer examens
      bedoeld in [artikel 14, eerste lid][ref4]. Een overzicht van gelijkwaardige examens ligt bij het secretariaat van
      de commissie ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel14
