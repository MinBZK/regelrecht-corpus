  - number: '10'
    text: |-
      1 Een kandidaat wordt binnen dertig dagen na het afleggen van het examen door de commissie geïnformeerd omtrent de
      uitslag daarvan.

      2 Over de uitslag en de inhoud van het examen wordt niet gecorrespondeerd.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel10
  - number: '11'
    text: |-
      Van een beslissing als bedoeld in [artikel 9, eerste tot en met derde lid][ref1], kan de kandidaat binnen dertig
      dagen in beroep gaan bij de de directeur-hoofdinspecteur van de divisie Telecom van de Inspectie Verkeer en
      Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel9
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel11
    references:
      - id: ref1
