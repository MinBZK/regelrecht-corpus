      - id: ref3
        bwb_id: BWBR0010039
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16'
    text: |-
      1 De examens Radiotechniek en Voorschriften I en II worden schriftelijk afgenomen.

      2 De tijdsduur van deze examens is ten minste een uur en ten hoogste twee uur.

      3 Het examen Opnemen en Seinen van morsetekens bestaat uit twee opneemproeven gevolgd door twee seinproeven. Een
      kandidaat die voor beide opneemproeven een onvoldoende heeft behaald komt niet in aanmerking voor deelname aan
      de seinproeven.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel16
  - number: '17'
    text: |-
      1 Het examen Radiotechniek en Voorschriften I bestaat uit 50 vragen met 4 antwoordmogelijkheden. Het examen is met
      goed gevolg afgelegd indien de kandidaat ten minste 35 vragen goed heeft beantwoord.

      2 Het examen Radiotechniek en Voorschriften II bestaat uit 40 vragen met 3 antwoordmogelijkheden. Het examen is met
      goed gevolg afgelegd indien de kandidaat ten minste 29 vragen goed heeft beantwoord.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel17
  - number: '18'
    text: |-
      1 Zowel het onderdeel opnemen als het onderdeel seinen bestaat uit twee proeven van elk maximaal vijf minuten.
      Niet of niet juist opgenomen of geseinde tekens binnen een groep van vijf opeenvolgende tekens worden als één
      fout gerekend. De groep van vijf tekens wordt bepaald te beginnen met de niet of niet juist opgenomen of geseinde
      morsetekens.

      2 Een kandidaat heeft een voldoende voor een opneemproef indien binnen de vastgestelde tijd de examentekst wordt
      opgeschreven in leesbaar handschrift en met niet meer dan acht fouten. De kandidaat heeft een voldoende voor het
      onderdeel opnemen indien één van de opneemproeven met een voldoende is gewaardeerd.

      3 Fouten in het seinschrift worden als verbeterd beschouwd indien een kandidaat na een geseind vergissingsteken
      (minimaal acht punten) opnieuw is begonnen met het laatst goed geseinde woord. Na de gestelde examentijd niet
      geseinde tekens van de te verzenden tekst worden elk als één fout gerekend.

      4 Een kandidaat heeft een voldoende voor een seinproef indien binnen de vastgestelde tijd de examentekst wordt
      geseind in regelmatig seinschrift en met niet meer dan acht fouten. De kandidaat heeft een voldoende voor het
      onderdeel seinen indien één van de seinproeven met een voldoende is gewaardeerd.

      5 Het examen is met goed gevolg afgelegd indien de kandidaat zowel voor een onderdeel opnemen als voor een
      onderdeel seinen een voldoende heeft behaald.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel18
  - number: '19'
    text: |-
      Een kandidaat, die heeft deelgenomen aan een bijzonder examen bedoeld in [artikel 8][ref1], heeft het examen met
      goed gevolg afgelegd indien hij naar het oordeel van twee examinatoren heeft aangetoond dat hij:

      a. voldoende kennis bezit op het gebied van de radiotechniek en de voorschriften die voor de amateurradiodienst
      gelden, voor zover het betreft de examens Radiotechniek en Voorschriften I of II;

      b. voldoende vaardigheid bezit in het opnemen en seinen van morsetekens, voorzover het betreft het examen in het
      opnemen en seinen van morsetekens met een snelheid van twaalf woorden per minuut.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel8
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel19
