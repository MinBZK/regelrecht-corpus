  - number: '21'
    text: |-
      Indien de examens genoemd in [artikel 14, eerste lid, onder a en c][ref1], respectievelijk het examen genoemd
      in [artikel 14, eerste lid, onder a][ref2], met gunstig gevolg is afgelegd, wordt door de Hoofddirectie
      Telecommunicatie en Post van het Ministerie van Verkeer en Waterstaat aan de kandidaat, op diens verzoek en tegen
      een door hem te betalen vergoeding, een HAREC-certificaat niveau A respectievelijk B toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel14
