  - number: '22'
    text: |-
      Voor deelname aan een examen voor het verkrijgen van een certificaat van bediening moet de kandidaat de leeftijd
      van 16 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel22
  - number: '23'
    text: |-
      Bij de examens ter verkrijging van een vergunning voor het gebruik van frequentieruimte ten dienste van de
      maritieme radiocommunicatie worden kandidaten onderworpen aan een onderzoek naar hun:

      a. vaardigheid in de bediening van de maritieme radiozendapparaten;

      b. naar hun kennis van de bij of krachtens de wet gestelde regels, alsmede van de voorschriften en beperkingen
      die verbonden zijn aan vergunningen voor het gebruik van frequentieruimte ten dienste van de maritieme
      radiocommunicatie;

      c. naar hun kennis betreffende afwikkeling van het nood-, spoed- en veiligheidsverkeer, het openbaar verkeer, het
      onderling verkeer en het nautisch verkeer;

      d. naar hun kennis van de bepalingen van de maritiem mobiele dienst en de maritiem mobiele satellietdienst als
      bedoeld in de Radio Regulations van de Internationale Unie voor Telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel23
  - number: '24'
    text: |-
      1 De examens worden onderverdeeld in de volgende categorieën:

      a. het examen ter verkrijging van het algemeen certificaat maritieme radiocommunicatie;

      b. het examen ter verkrijging van het beperkt certificaat maritieme radiocommunicatie;

      c. het examen ter verkrijging van het basiscertificaat marifonie;

      d. het examen ter verkrijging van de module GMDSS-B.

      2 Deelname aan het examen voor de module GMDSS-B alsmede de verkrijging van deze module is slechts mogelijk nadat
      men is geslaagd voor het examen ter verkrijging van het basiscertificaat marifonie, of een daarmee gelijkgesteld
      certificaat.

      3 De exameneisen liggen ter inzage bij het examensecretariaat.
    url: https://wetten.overheid.nl/BWBR0010039/2003-03-07#Artikel24
  - number: '25'
    text: |-
      1 Voorzover praktische vaardigheden deel uitmaken van het examen mag de termijn tussen het schriftelijk examen en
      het praktijkgedeelte ten hoogste vijf jaar bedragen.

      2 De tijdsduur van de examens, bedoeld in [artikel 24, eerste lid][ref1], bedraagt:

      a. het examen ter verkrijging van het algemeen certificaat maritieme radio-communicatie: maximaal twee uur en
      dertig minuten, welke tijd als volgt wordt verdeeld over de onderdelen waarin examen wordt afgenomen:

      1º. voorschriften, procedures en techniek: 90 minuten

      2º. Engels: 30 minuten

      3º. aardrijkskunde: 30 minuten.

      b. het examen ter verkrijging van het beperkt certificaat maritieme radiocommunicatie: maximaal 90 minuten;

      c. het examen ter verkrijging van het basiscertificaat marifonie: maximaal 60 minuten;

      d. het examen ter verkrijging van de module GMDSS-B: 30 minuten.

      3 In afwijking van [artikel 7, eerste lid][ref2], is in geval van het examen, bedoeld in
      [artikel 24, eerste lid, onder c, en d][ref3], ten minste een lid van de commissie dan wel een door de voorzitter
      aangewezen persoon aanwezig, welke namens de voorzitter verantwoordelijk is voor het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0010039#Artikel24
