        artikel: '6'
      - id: ref4
        bwb_id: BWBR0036510
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.1'
    text: Er is een Raad voor strafrechtstoepassing en jeugdbescherming.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel2
  - number: '2.2'
    text: De Raad is gevestigd te ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel2
  - number: '3'
    text: De Raad is belast met de taken die hem bij of krachtens de wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel3
  - number: '4.1'
    text: |-
      De Raad wordt gevormd door een voorzitter en ten hoogste vijftien andere leden. De Raad kan uit de andere leden
      ondervoorzitters aanwijzen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel4
  - number: '4.2'
    text: |-
      In de Raad kunnen buitengewone leden worden benoemd. De buitengewone leden hebben bij de vervulling van hun taak de
      bevoegdheden van een lid van de Raad. De buitengewone leden kunnen met bepaalde taken worden belast.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel4
  - number: '4.3'
    text: |-
      Voor de toepassing van deze wet wordt onder leden mede begrepen buitengewone leden, voor zover niet uit enige
      bepaling anders volgt.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel4
  - number: '5.1'
    text: |-
      De voorzitter wordt, de Raad gehoord, op voordracht van Onze Minister bij koninklijk besluit benoemd. Voor de
      benoeming van de andere leden doet de Raad een aanbeveling. De aanbeveling wordt gedaan gehoord de afdeling van de
      Raad waarvan het te benoemen lid deel zal uitmaken.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel5
  - number: '5.2'
    text: |-
      De leden worden bij koninklijk besluit benoemd in de Afdeling advisering of de Afdeling rechtspraak. De benoeming
      kan worden gewijzigd, met dien verstande dat een benoeming in de Afdeling rechtspraak slechts op verzoek van het
      lid kan worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel5
  - number: '5.3'
    text: |-
      De benoeming geschiedt voor een periode van ten hoogste vier jaren. Herbenoeming kan tweemaal en telkens voor ten
      hoogste vier jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel5
  - number: '5.4'
    text: Onze Minister draagt zorg voor openbaarmaking van een vacature in de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel5
  - number: '6.1'
    text: |-
      De leden van de Raad worden benoemd op grond van de deskundigheid die nodig is voor een goede vervulling van de
      in de [artikelen 3][ref1], [24][ref2] en [28][ref3] genoemde taken alsmede op grond van maatschappelijke kennis
      en ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0036510#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036510#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0036510#Artikel28
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036510
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036510
        artikel: '24'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0036510
        artikel: '28'
        hoofdstuk: '4'
  - number: '6.2'
    text: 'Van de Raad maken in ieder geval deel uit:'
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.2.a
    text: met rechtspraak belaste leden van de rechterlijke macht,
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.2.b
    text: deskundigen uit de kring van het maatschappelijk werk,
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.2.c
    text: deskundigen op het gebied van de gedragswetenschappen,
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.2.d
    text: advocaten, en
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.2.e
    text: artsen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: '6.3'
    text: 'Voor benoeming als lid komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.3.a
    text: |-
      personen, werkzaam onder de verantwoordelijkheid van Onze Minister, indien hun onafhankelijkheid of onpartijdigheid
      hetzij door hun positie, hetzij door de aard van hun werkzaamheden in het geding zou kunnen komen;
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.3.b
    text: |-
      personen die werkzaam zijn bij of deel uitmaken van een instantie die toezicht houdt op de tenuitvoerlegging van
      vrijheidsbenemende of vrijheidsbeperkende straffen of maatregelen of op de uitvoering van de jeugdreclassering,
      bedoeld in [artikel 1.1 van de Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 6.3.c
    text: |-
      personen tegen wie bezwaren bestaan voor wat betreft de vervulling van de functie, die blijken uit de justitiële
      gegevens, bedoeld in het [Besluit justitiële en strafvorderlijke gegevens][ref1], of uit politiegegevens, bedoeld
      in [artikel 1, onder a, van de Wet politiegegevens][ref2]; de bezwaren hebben betrekking op het vertrouwelijk
      karakter van de functie alsmede de aan de functie verbonden bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016544
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016544
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '1'
  - number: '6.4'
    text: 'Voor benoeming als lid in de Afdeling rechtspraak komen niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.4.a
    text: |-
      ambtenaren of andere personen, werkzaam onder de verantwoordelijkheid van Onze Minister op het terrein van de
      tenuitvoerlegging van vrijheidsbenemende of vrijheidsbeperkende straffen of maatregelen;
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: 6.4.b
    text: |-
      de personen, bedoeld in
      [artikel 1, onderdeel b, onder 1° en onder 4°, van de Wet op de rechterlijke organisatie][ref1], met uitzondering
      van de raadsheren in buitengewone dienst en de advocaten-generaal in buitengewone dienst bij de Hoge Raad;


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 6.4.c
    text: |-
      bestuursleden, leden van een raad van toezicht, medewerkers of personeelsleden van een instelling als bedoeld
      in [artikel 3.3 van de Wet forensische zorg][ref1] die werkzaam zijn op het terrein van de tenuitvoerlegging van
      vrijheidsbenemende of vrijheidsbeperkende straffen of maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '3'
  - number: 6.4.d
    text: |-
      bestuursleden, leden van een raad van toezicht, medewerkers of personeelsleden van een gecertificeerde instelling
      als bedoeld in [artikel 1.1 van de Jeugdwet][ref1], bij de uitvoering van de jeugdreclassering als bedoeld in
      artikel 1.1 van de Jeugdwet;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '6.5'
    text: |-
      Bij de samenstelling van de Raad wordt gestreefd naar evenredige deelneming van vrouwen en personen behorende tot
      etnische of culturele minderheidsgroepen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel6
  - number: '7.1'
    text: De leden van de Raad worden op eigen aanvraag bij koninklijk besluit ontslagen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel7
  - number: '7.2'
    text: |-
      De leden worden voorts door de Raad, bij een met redenen omkleed besluit ontslagen, geschorst of bij ongeschiktheid
      wegens ziekte met een andere taak belast en de leden worden door de voorzitter van de Raad bij met redenen omkleed
      besluit, gewaarschuwd overeenkomstig [hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1], met
      dien verstande dat: - in plaats van «de rechterlijk ambtenaar» wordt gelezen: het lid;
        - in plaats van «Hoge Raad» wordt gelezen: Raad;
        - in plaats van «procureur-generaal» wordt gelezen: voorzitter;
        - in plaats van «plaatsvervangend procureur generaal» wordt gelezen: voorzitter van de Afdeling
      bestuursrechtspraak;
        - in plaats van «een gerecht» wordt gelezen: de Raad;
        - in plaats van «functionele autoriteit» wordt gelezen: voorzitter;
        - de Raad de mededeling van beslissingen, bedoeld in
      [artikel 46p, vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2], doet aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '7.3'
    text: |-
      De [artikelen 46i, vijfde lid][ref1], [46k, vijfde lid][ref2], en
      [46l tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref3] zijn van overeenkomstige toepassing, met
      dien verstande dat wordt gelezen: - in plaats van «de rechterlijke ambtenaar»: het lid;
        - in plaats van «Hoge Raad»: Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46l
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de vergoeding van reis- en verblijfkosten en verdere
      vergoedingen aan leden van de Raad vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel8
  - number: '9.1'
    text: |-
      De leden onthouden zich van deelname aan activiteiten van de Raad die, gelet op andere functies die zij vervullen,
      kan leiden tot een verstrengeling van belangen of verantwoordelijkheden of tot een verlies van onafhankelijkheid of
      onpartijdigheid van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel9
  - number: '9.2'
    text: |-
      De leden van de Afdeling rechtspraak stellen het bestuur van de Raad in kennis van hun overige betrekkingen. Zo
      mogelijk geschiedt de kennisgeving zodra het voornemen bestaat tot het gaan vervullen van de betrekking. Ook indien
      zij geen overige betrekkingen vervullen, stellen zij het bestuur daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel9
  - number: '9.3'
    text: De kennisgevingen worden jaarlijks geactualiseerd en gepubliceerd op de website van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel9
  - number: '10.1'
    text: De Raad heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel10
  - number: '10.2'
    text: |-
      De secretaris wordt, na overleg met de voorzitter van de Raad, door Onze Minister benoemd, bevorderd, geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel10
  - number: '10.3'
    text: De secretaris is voor zijn werkzaamheden voor de Raad uitsluitend verantwoording schuldig aan de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel10
  - number: '10.4'
    text: De secretaris is geen lid van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel10
  - number: '11.1'
    text: Aan de secretaris kunnen medewerkers worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel11
  - number: '11.2'
    text: Medewerkers worden, na overleg met de secretaris, door Onze Minister benoemd, bevorderd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel11
  - number: '11.3'
    text: Medewerkers zijn geen lid van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister draagt, na overleg met de Raad, zorg voor de nodige voorzieningen ten behoeve van de werkzaamheden
      van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel12
  - number: '13'
    text: De Raad wordt vertegenwoordigd door de voorzitter en de secretaris.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel13
  - number: '14.1'
    text: |-
      De Raad stelt een bestuursreglement vast. Dit bevat in ieder geval regels over werkwijzen en procedures met het
      oog op een goede en zorgvuldige uitoefening van de verschillende taken. Daarbij kan worden voorzien in nadere
      waarborgen tegen vermenging van de adviserende en rechtsprekende taak van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel14
  - number: '14.2'
    text: |-
      Het reglement alsmede elke wijziging daarvan wordt zo spoedig mogelijk gezonden aan Onze Minister en behoeft diens
      goedkeuring.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel14
  - number: '15'
    text: De Raad kan zich voor het inwinnen van inlichtingen wenden tot daartoe door Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel15
  - number: '16.1'
    text: |-
      De Raad kan zich doen bijstaan door andere dan de in [artikel 15][ref1] bedoelde personen, voor zover dat voor de
      vervulling van zijn taken nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0036510#Artikel15
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0036510
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.2'
    text: |-
      [Artikel 8][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036510#Artikel8
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0036510
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '17.1'
    text: |-
      De leden van de Raad hebben te allen tijde toegang tot alle plaatsen in de inrichtingen en instellingen die
      onder verantwoordelijkheid van Onze Minister een taak uitoefenen in het kader van de tenuitvoerlegging van
      vrijheidsstraffen, vrijheidsbeperkende straffen, vrijheidsbenemende maatregelen en vrijheidsbeperkende maatregelen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel17
  - number: '17.2'
    text: |-
      De leden van de Raad ontvangen van de directeur van de inrichting of de instelling die is belast met
      de tenuitvoerlegging van een vrijheidsstraf, een vrijheidsbeperkende straf of een vrijheidsbenemende of
      vrijheidsbeperkende maatregel, of van de personen, werkzaam bij die inrichting of instelling, alle door hen
      gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel17
  - number: '17.3'
    text: |-
      De leden van de Raad die bij de uitvoering van hun taak de beschikking krijgen over gegevens waarvan zij het
      vertrouwelijke karakter kennen of redelijkerwijs moeten vermoeden, zijn verplicht tot geheimhouding van die
      gegevens, behoudens voor zover enig wettelijk voorschrift hen tot bekendmaking verplicht of uit hun taak de
      noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel17
  - number: '18'
    text: |-
      De Raad zendt jaarlijks voor 1 april aan Onze Minister een ontwerp voor de begroting voor het daaropvolgende
      kalenderjaar van de aan zijn taakvervulling verbonden uitgaven.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel18
  - number: '19.1'
    text: De Raad zendt Onze Minister jaarlijks voor 15 november een werkprogramma voor het komende kalenderjaar toe.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel19
  - number: '19.2'
    text: Onze Minister verstrekt de Raad tijdig een overzicht van de voornemens om advies te vragen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel19
  - number: '20'
    text: |-
      De Raad houdt bij het vervullen van zijn taken zo veel mogelijk rekening met het werkprogramma. Onverminderd de
      Comptabiliteitswet 2001 vervult hij zijn taak met de middelen die ingevolge de desbetreffende begrotingswet ter
      beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel20
  - number: '21'
    text: |-
      De Raad stelt jaarlijks voor 1 april een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en de doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel21
  - number: '22'
    text: |-
      De Raad verstrekt desgevraagd aan Onze Minister de voor de uitoefening van diens taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel22
  - number: '23.1'
    text: De Raad kent een Afdeling advisering.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel23
  - number: '23.2'
    text: 'De Afdeling advisering bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel23
  - number: 23.2.a
    text: de voorzitter van de Raad en
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel23
  - number: 23.2.b
    text: de leden en buitengewone leden die in de Afdeling advisering zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel23
  - number: '23.3'
    text: De voorzitter van de Raad is tevens voorzitter van de Afdeling advisering.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel23
  - number: '24'
    text: |-
      De Afdeling advisering adviseert Onze Minister desgevraagd of uit eigen beweging over de toepassing en uitvoering
      van beleid en regelgeving op het terrein van de strafrechtstoepassing en omtrent jeugdigen, mede in het licht van
      de overige werkzaamheden hem bij of krachtens de wet opgedragen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel24
  - number: '25'
    text: |-
      De Afdeling advisering kan zich verdelen in secties en kan de uitoefening van bepaalde taken opdragen aan
      commissies uit zijn midden.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel25
  - number: '26.1'
    text: De Raad kent een Afdeling rechtspraak.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel26
  - number: '26.2'
    text: De Afdeling rechtspraak bestaat uit de leden en buitengewone leden die in de Afdeling rechtspraak zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel26
  - number: '27.1'
    text: |-
      Bij koninklijk besluit wordt, op voordracht van Onze Minister, uit de leden van de Afdeling rechtspraak een
      voorzitter van de Afdeling rechtspraak benoemd. Voor de benoeming doet de Raad een aanbeveling, de Afdeling
      rechtspraak gehoord.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel27
  - number: '27.2'
    text: |-
      De benoeming geldt voor de periode gelijk aan die waarin de betrokkene als lid van de Raad is benoemd. Zij kan
      slechts op verzoek van de voorzitter worden ingetrokken en vervalt in geval van ontslag als lid van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel27
  - number: '27.3'
    text: De voorzitter regelt de werkzaamheden van de Afdeling rechtspraak.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel27
  - number: '28'
    text: De Afdeling rechtspraak is belast met rechtspraak die hem bij de wet is opgedragen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel28
  - number: '29.1'
    text: De Afdeling rechtspraak vormt en bezet op voorstel van de voorzitter beroepscommissies.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel29
  - number: '29.2'
    text: De samenstelling geschiedt overeenkomstig de door de wet- en regelgeving gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel29
  - number: '29.3'
    text: |-
      Een lid van de Afdeling rechtspraak dat betrokken is geweest bij de totstandkoming van een advies van de Raad,
      neemt geen deel aan de behandeling van een geschil over een rechtsvraag waarop dat advies betrekking had.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel29
  - number: '30'
    text: 'Het is de leden van de Afdeling rechtspraak en de ten behoeve van deze afdeling werkzame medewerkers verboden:'
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel30
  - number: 30.a
    text: |-
      hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie wordt
      gevorderd;
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel30
  - number: 30.b
    text: de gevoelens te openbaren die in raadkamer zijn geuit; en
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel30
  - number: 30.c
    text: |-
      over een voor hen aanhangige zaak of over een zaak die naar zij weten of redelijkerwijs kunnen vermoeden, voor hen
      aanhangig zal worden, op enigerlei bijzondere wijze in contact te treden met partijen, gemachtigden of degene die
      een partij bijstaat.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel30
  - number: '31.1'
    text: |-
      Op verzoek van een der partijen kan elk van de leden van de beroepscommissie die de betreffende beroepszaak
      behandelen dan wel de voorzitter die een schorsingsverzoek behandelt, worden gewraakt op grond van feiten en
      omstandigheden waardoor de onpartijdigheid schade zou kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.2'
    text: |-
      Wanneer een wrakingsverzoek wordt gedaan, wordt de behandeling van het beroep dan wel de behandeling van het
      schorsingsverzoek geschorst. Indien het wrakingsverzoek ter zitting wordt gedaan, wordt van het verhandelde een
      proces-verbaal opgemaakt waarin de reden voor de wraking is vermeld.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.3'
    text: Het lid wiens wraking is verzocht, kan in de wraking berusten.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.4'
    text: |-
      Het wrakingsverzoek wordt behandeld door een wrakingskamer, waarin het lid wiens wraking wordt verzocht geen
      zitting heeft.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.5'
    text: |-
      De verzoeker en het lid wiens wraking is verzocht, worden in de gelegenheid gesteld te worden gehoord dan wel hun
      opmerkingen schriftelijk kenbaar te maken. De wrakingskamer kan ambtshalve of op verzoek van de verzoeker of het
      lid wiens wraking is verzocht, bepalen dat zij niet in elkaars aanwezigheid worden gehoord.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.6'
    text: Nadat op het verzoek is beslist, kan de wrakingskamer de behandeling van het beroep voortzetten.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.7'
    text: |-
      Een volgend verzoek om wraking in dezelfde beroepszaak van hetzelfde lid van de beroepscommissie wordt niet in
      behandeling genomen, tenzij feiten of omstandigheden worden voorgedragen die pas na het eerdere verzoek aan de
      verzoeker bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.8'
    text: |-
      In geval van misbruik kan worden bepaald dat een volgend verzoek niet in behandeling wordt genomen. Hiervan wordt
      in de beslissing melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '31.9'
    text: Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel31
  - number: '32.1'
    text: De Afdeling rechtspraak stelt een regeling vast voor de behandeling van klachten.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel32
  - number: '32.2'
    text: |-
      Klachten zijn niet mogelijk ten aanzien van gedragingen waartegen ingevolge een wettelijk geregelde voorziening
      een procedure bij een rechterlijke instantie openstaat of heeft opengestaan, dan wel beroep openstaat of heeft
      opengestaan tegen een uitspraak die in een zodanige procedure is gedaan. Klachten kunnen evenmin een rechterlijke
      beslissing betreffen.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel32
  - number: '32.3'
    text: De regeling, bedoeld in het eerste lid, wordt gepubliceerd op de website van de Raad.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel32
  - number: '33.1'
    text: |-
      De procureur-generaal bij de Hoge Raad kan cassatie in het belang der wet instellen
      tegen de uitspraken van de Afdeling rechtspraak. Hij handelt in dat geval overeenkomstig
      [artikel 456, eerste lid, van het Wetboek van Strafvordering][ref1], met dien verstande dat hij zich de stukken van
      het geding doet opzenden door de Raad. De [artikelen 443][ref2], [444][ref3] en 456, derde lid, van het Wetboek van
      Strafvordering zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel456
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel443
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel444
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '456'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '443'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '444'
  - number: '33.2'
    text: |-
      [Artikel 456, vierde lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing, met dien
      verstande dat de procureur-generaal bij de Hoge Raad het aldaar bedoelde afschrift aan de Raad zendt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel456
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '456'
  - number: '39.1'
    text: |-
      Zij die op het tijdstip van inwerkingtreding van deze wet lid zijn van de Raad, blijven lid van de Raad gedurende
      de resterende termijn van hun benoeming. [Artikel 4][ref1] blijft zo nodig buiten toepassing. Zij zijn lid van de
      Afdeling advisering en de Afdeling rechtspraak, tenzij bij koninklijk besluit anders wordt bepaald, onverminderd de
      tweede volzin van [artikel 5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036510#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036510#Artikel5
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0036510
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036510
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '39.2'
    text: |-
      Zolang de Raad meer leden telt dan voorzien in [artikel 4][ref1] kunnen, indien een vacature ontstaat, in afwijking
      van dat artikel nieuwe leden worden benoemd of leden worden herbenoemd, indien een evenwichtige samenstelling
      van de Raad, dan wel [artikel 6, tweede lid][ref2], dit vergt, mits het aantal leden daardoor niet groter wordt
      dan voor het ontstaan van de vacature. Leden van de Raad die op het tijdstip van inwerkingtreding van deze wet
      onderdeel uitmaken van het bestuur van de Raad kunnen na afloop van de resterende termijn van hun benoeming en
      in afwijking van artikel 4 worden herbenoemd, mits het aantal leden daardoor niet groter wordt dan voordat het
      bestuurslid werd herbenoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0036510#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036510#Artikel6
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0036510
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036510
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '39.3'
    text: |-
      Plaatsvervangende leden die zijn benoemd voor het tijdstip van inwerkingtreding van deze wet, zijn als
      buitengewoon lid belast met de taak of taken waarmee zij op de dag voor de datum van inwerkingtreding van
      deze wet waren belast, tenzij bij koninklijk besluit anders wordt bepaald, onverminderd de tweede volzin van
      [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036510#Artikel5
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0036510
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '40'
    text: |-
      De [Instellingswet Raad voor strafrechtstoepassing en jeugdbescherming][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011940
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011940
  - number: '41'
    text: |-
      Deze wet wordt aangehaald als: Instellingswet Raad voor strafrechtstoepassing en jeugdbescherming, met vermelding
      van het jaartal van het Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel41
  - number: '42'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel42
