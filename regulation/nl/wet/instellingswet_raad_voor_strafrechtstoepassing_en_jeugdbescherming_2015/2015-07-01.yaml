preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtsprekende taak van de Raad voor
    strafrechtstoepassing en jeugdbescherming te versterken door de toetsingsgronden voor penitentiaire rechtspraak
    uit te breiden, de mogelijkheid tot cassatie in het belang der wet in te voeren en de rechtsprekende en
    adviserende taak van de Raad scherper te scheiden en daartoe de Instellingswet Raad voor strafrechtstoepassing en
    jeugdbescherming opnieuw vast te stellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Veiligheid en Justitie;
        - *vrijheidsstraf:* gevangenisstraf, hechtenis, vervangende hechtenis, militaire detentie, jeugddetentie en
      vervangende jeugddetentie;
        - *vrijheidsbeperkende straf:* voorwaardelijke vrijheidsstraf en taakstraf;
        - *vrijheidsbenemende maatregel:* voorlopige hechtenis, vreemdelingenbewaring, gijzeling, terbeschikkingstelling
      met bevel tot verpleging, plaatsing in een inrichting voor jeugdigen, plaatsing in een justitiële jeugdinrichting
      of een gesloten accommodatie als bedoeld in [artikel 1.1 van de Jeugdwet][ref1] in verband met de tenuitvoerlegging
      van een machtiging als bedoeld in de [artikelen 6.1.2][ref2] en [6.1.3 van de Jeugdwe][ref3]t, plaatsing in een
      inrichting voor stelselmatige daders en vrijheidsbeneming die op andere gronden dan de in onderdeel b genoemde
      gronden plaatsvindt;
        - *vrijheidsbeperkende maatregel:* voorwaardelijke vrijheidsbenemende maatregel;
        - *de Raad:* de Raad voor strafrechtstoepassing en jeugdbescherming, bedoeld in [artikel 2, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0036510#Artikel2
    url: https://wetten.overheid.nl/BWBR0036510/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
