preamble:
  text: |-
    Gelet op artikel 5.1, eerste lid, onderdeel a, van de Wet luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021304/2007-02-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het uitoefenen van de burgerluchtvaart is verboden tot een hoogte van 609,2 meter boven gemiddeld zeeniveau in:

      a. Een rechthoekig gebied boven de paleizen Huis ten Bosch en Noordeinde, het landgoed De Horsten en het Binnenhof
      en omgeving, aangeduid als EHP 26, als aangegeven bijlage A bij deze regeling, waarvan de hoekpunten samenvallen
      met de coördinaten:

      52° 03’ 43” NB - 004° 18’ 20” OL,

      52° 06’ 25” NB - 004° 24’ 20” OL,

      52° 07’ 37” NB - 004° 26’ 03” OL,

      52° 08’ 36” NB - 004° 23’ 50” OL,

      52° 05’ 17” NB - 004° 16’ 27” OL.

      b. Een rechthoekig gebied boven het kasteel Drakensteijn en omgeving, aangeduid als EHP 25, als aangegeven in
      bijlage B van deze regeling, waarvan de hoekpunten samenvallen met de coördinaten:

      52° 11’ 08” NB - 005° 12’ 30” OL,

      52° 12’ 22” NB - 005° 17’ 15” OL,

      52° 11’ 21” NB - 005° 17’ 56” OL,

      52° 10’ 09” NB - 005° 13’ 11” OL.
    url: https://wetten.overheid.nl/BWBR0021304/2007-02-22#Artikel1
  - number: '2'
    text: |-
      Het verbod, genoemd in [artikel 1][ref1], is niet van toepassing op:

      a. luchtvaartuigen van het Korps Landelijke Politiediensten, Dienst Luchtvaartpolitie,

      b. luchtvaartuigen die gebruikt worden ten behoeve van het vervoer van leden van het Koninklijk Huis, staatshoofden
      en ministers,

      c. helikopters die worden gebruikt voor spoedeisende hulpverlening door traumateams en het d. vervoer van
      slachtoffers of voor zoek- en reddingsacties,

      e. ambulancevluchten voor het Westeinde Ziekenhuis in Den Haag, en

      f. burgerluchtvaartuigen die ontheffing hebben gekregen van de Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0021304#Artikel1
    url: https://wetten.overheid.nl/BWBR0021304/2007-02-22#Artikel2
