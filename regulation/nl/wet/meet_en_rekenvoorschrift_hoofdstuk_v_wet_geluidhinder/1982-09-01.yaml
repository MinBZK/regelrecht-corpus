  - number: '6.2'
    text: |-
      Er kan een andere dan een van de in de bijlagen I, II of III bij dit besluit beschreven methoden worden toegepast
      in gevallen waarin aannemelijk wordt gemaakt dat:
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel6
  - number: 6.2.a
    text: |-
      de andere methode een belangrijke tijd- of kostenbesparing oplevert en in de betreffende situatie nagenoeg even
      nauwkeurig is als de methode die ingevolge de [artikelen 3][ref1], [4][ref2] en [5][ref3] zou moeten worden
      toegepast, of


      [ref1]: https://wetten.overheid.nl/BWBR0003513#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003513#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003513#Artikel5
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003513
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003513
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003513
        artikel: '5'
  - number: 6.2.b
    text: |-
      de andere methode in de betreffende situatie belangrijk nauwkeuriger is dan de methode die ingevolge de
      [artikelen 3][ref1], [4][ref2] en [5][ref3] zou moeten worden toegepast, of


      [ref1]: https://wetten.overheid.nl/BWBR0003513#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003513#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003513#Artikel5
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003513
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003513
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003513
        artikel: '5'
  - number: 6.2.c
    text: |-
      de andere methode voldoende nauwkeurig is en geen van de in de bijlagen I, II en III bij dit besluit beschreven
      methoden in de betreffende situatie leidt tot een voldoende representatief equivalent geluidsniveau.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel6
  - number: '6.3'
    text: |-
      Indien toepassing aan het tweede lid wordt gegeven, dient de toe te passen methode de goedkeuring te hebben van
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel6
  - number: '7'
    text: |-
      De resultaten van het akoestisch onderzoek, ter bepaling van het equivalente geluidsniveau als bedoeld in
      [artikel 2][ref1], worden vastgelegd in een rapport, ingericht overeenkomstig het in bijlage IV bij dit besluit
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003513#Artikel2
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003513
        artikel: '2'
  - number: '8'
    text: |-
      De waarde van het overeenkomstig de [artikelen 3][ref1], [4][ref2], [5][ref3] of [6][ref4] bepaalde equivalente
      geluidsniveau wordt afgerond naar het dichtstbijzijnde gehele getal, waarbij een halve eenheid wordt afgerond naar
      het even getal.


