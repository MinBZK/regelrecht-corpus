preamble:
  text: |-
    Gelet op artikel 73 van de Wet geluidhinder (Stb. 1979, 99);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:


              *etmaalperiode:*


              het gedeelte van een etmaal, waarover het equivalente geluidsniveau wordt bepaald, te weten de dag (07.00–
      19.00 uur), de avond (19.00–23.00 uur) of de nacht (23.00–07.00 uur);




              *immissiepunt:*


              de plaats waarop het equivalente geluidsniveau wordt bepaald;




              *representatieve bedrijfssituatie:*


              toestand waarbij de voor de geluidproduktie relevante omstandigheden kenmerkend zijn voor een
      bedrijfsvoering bij volledige capaciteit in de te beschouwen etmaalperiode;




              *representatieve geluidoverdracht:*


              de geluidoverdrachtssituatie onder gemiddelde Nederlandse klimatologische omstandigheden;




              *monopool:*


              een puntvormige geluidsbron die in elke richting evenveel geluidsenergie uitstraalt;




              *immissierelevante bronsterkte:*


              het geluidsvermogensniveau in octaafbanden van een denkbeeldige monopool, gelegen in het centrum van de
      werkelijke geluidsbron, die in de richting van het immissiepunt dezelfde geluiddrukniveaus veroorzaakt als de
      werkelijke geluidsbron;




              *bedrijfstoestand:*


              toestand met bepaalde voor de immissierelevante bronsterkte van belang zijnde kenmerken;




              *stoorgeluid:*


              het op een bepaalde plaats optredende geluid, veroorzaakt door andere geluidsbronnen dan die waarvan het
      equivalente geluidsniveau wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel1
  - number: '2.1'
    text: |-
      Bij de bepaling van het equivalente geluidsniveau op een immissiepunt buiten een woning of ander gebouw ten behoeve
      van de vaststelling van de geluidsbelasting vanwege een industrieterrein of een gedeelte daarvan wordt rekening
      gehouden met:
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.a
    text: |-
      de over de betreffende etmaalperiode energetisch gemiddelde immissierelevante bronsterkte bij een representatieve
      bedrijfssituatie;
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.b
    text: de representatieve geluidoverdracht tussen geluidsbron en immissiepunt;
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.c
    text: de verzwakking van het geluid ten gevolge van de geometrische uitbreiding van het geluidsveld;
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.d
    text: de verzwakking van het geluid door absorptie van geluidenergie in de atmosfeer;
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.e
    text: de invloed van de bodem op de geluidoverdracht;
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.f
    text: reflecties van het geluid;
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.g
    text: afschermingen van het geluid;
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: 2.1.h
    text: de invloed van de vegetatie op de geluidoverdracht.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: '2.2'
    text: |-
      Bij de bepaling van het equivalente geluidsniveau op een immissiepunt buiten een woning of ander gebouw ten behoeve
      van de vaststelling van de geluidsbelasting vanwege een industrieterrein of een gedeelte daarvan wordt slechts
      rekening gehouden met het op het immissiepunt invallend geluid.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de vaststelling van de geluidsbelasting vanwege een industrieterrein plaatsvindt ten behoeve van de
      vaststelling van een geluidszone rond dat terrein, bevindt het immissiepunt zich op 5 m boven het maaiveld.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: '2.4'
    text: |-
      Indien vaststelling van de geluidsbelasting vanwege een industrieterrein plaatsvindt ten behoeve van de
      vaststelling van de geluidsbelasting van de gevel van een woning of ander gebouw, bevindt het immissiepunt zich op
      het punt van de gevel, waar de hoogste geluidsbelasting optreedt.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel2
  - number: '3'
    text: |-
      Bepaling van het equivalente geluidsniveau vanwege een industrieterrein of een gedeelte daarvan vindt plaats
      volgens de in bijlage I bij dit besluit beschreven methode.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel3
  - number: '4'
    text: |-
      In gevallen waarin toepassing van de in bijlage I bij dit besluit beschreven meetmethode niet mogelijk is of leidt
      tot een voor de betreffende situatie onvoldoende representatief equivalent geluidsniveau, wordt de in bijlage II
      bij dit besluit beschreven meetmethode in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel4
  - number: '5'
    text: |-
      In gevallen waarin ook de toepassing van de in bijlage II bij dit besluit beschreven meetmethode niet mogelijk
      is of leidt tot een voor de betreffende situatie onvoldoende representatief equivalent geluidsniveau, wordt de in
      bijlage III bij dit besluit beschreven rekenmethode in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel5
  - number: '6.1'
    text: |-
      Er kan afgeweken worden van de in de [artikelen 3][ref1], [4][ref2] en [5][ref3] neergelegde voorkeursvolgorde,
      mits aannemelijk wordt gemaakt dat de toe te passen methode voor de betreffende situatie leidt tot een equivalent
      geluidsniveau dat nagenoeg even representatief is als het equivalente geluidsniveau waartoe de methode, die volgens
      de voorkeursvolgorde zou moeten worden toegepast, zou leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003513#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003513#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003513#Artikel5
    url: https://wetten.overheid.nl/BWBR0003513/1982-09-01#Artikel6
