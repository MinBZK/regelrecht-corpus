valid_from: '2022-01-01'
bwb_id: BWBR0007286
url: https://wetten.overheid.nl/BWBR0007286/2022-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter uitvoering van richtlijn 92/109/EEG van de Raad van de Europese
    Gemeenschappen van 14 december 1992 inzake de vervaardiging en het in de handel brengen van bepaalde stoffen die
    worden gebruikt voor de illegale vervaardiging van verdovende middelen en psychotrope stoffen (PbEG L 370) en
    in verband met de uitvoering van verordening (EEG) nr. 3677/90 van de Raad van de Europese Gemeenschappen van
    13 december 1990, houdende maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale
    vervaardiging van verdovende middelen en psychotrope stoffen (PbEG L 357) noodzakelijk is bij de wet regelen te
    stellen ten aanzien van de vervaardiging en het in de handel brengen van bepaalde chemicaliën alsmede ten aanzien
    van de op het terrein van in-, uit- en doorvoer te verlenen vergunningen en de sanctionering van de overtreding van
    de bepalingen van de verordening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel1
  - number: 1.b
    text: |-
      [Verordening nr. 273/2004](32004R0273): [verordening (EG) nr. 273/2004](32004R0273) van het Europees Parlement en
      de Raad van 11 februari 2004 inzake drugsprecursoren (PbEU L 47);
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel1
  - number: 1.c
    text: |-
      [Verordening nr. 111/2005](32005R0111): [verordening (EG) nr. 111/2005](32005R0111) van de Raad van
      22 december 2004 houdende voorschriften voor het toezicht op de handel tussen de Gemeenschap en derde landen in
      drugsprecursoren (PbEU L 22);
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel1
  - number: 1.d
    text: |-
      *Uitvoeringsverordening:* Uitvoeringsverordening (EU) 2015/1013 van de Commissie van 25 juni 2015 tot vaststelling
      van voorschriften met betrekking tot Verordening (EG) nr. 273/2004 van het Europees Parlement en de Raad inzake
      drugsprecursoren en Verordening (EG) nr. 111/2005 van de Raad houdende voorschriften voor het toezicht op de handel
      tussen de Unie en derde landen in drugsprecursoren (PbEU 2015, L 162);
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel1
  - number: 1.e
    text: |-
      *Gedelegeerde Verordening:* Gedelegeerde Verordening (EU) 2015/1011 van de Commissie van 24 april 2015 tot
      aanvulling van Verordening (EG) nr. 273/2004 van het Europees Parlement en de Raad inzake drugsprecursoren en
      Verordening (EG) nr. 111/2005 van de Raad houdende voorschriften voor het toezicht op de handel tussen de Unie en
      derde landen in drugsprecursoren, en tot intrekking van Verordening (EG) nr. 1277/2005 van de Commissie (PbEU 2015,
      L 162).
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel1
  - number: '2'
    text: 'Het is verboden te handelen in strijd met voorschriften gesteld bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel2
  - number: 2.a
    text: |-
      de artikelen 3, tweede, derde, zesde lid en lid 6 bis, en 8, eerste en tweede lid, van Verordening nr. 273/2004 en
      de artikelen 6, eerste lid, 7, eerste lid, 8, eerste lid, 9, 12, eerste lid, en 20 van Verordening nr. 111/2005;
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel2
  - number: 2.b
    text: artikel 3, achtste lid, van de Gedelegeerde Verordening;
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel2
  - number: 2.c
    text: |-
      de artikelen 3, eerste lid, 4, eerste, tweede en derde lid, 5, eerste tot en met zesde lid, en 7, eerste alinea,
      van Verordening nr. 273/2004, de artikelen 3, 4, 5, 14, tweede lid, en 22 van Verordening nr. 111/2005 en de
      artikelen 3, eerste en negende lid, 5, eerste lid, eerste alinea, van de Gedelegeerde Verordening, de artikelen 6,
      eerste alinea, 7, eerste lid, en 11, achtste, negende en tiende lid van de Uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel2
  - number: 2a
    text: |-
      [Artikel 2][ref1] kan bij algemene maatregel van bestuur worden gewijzigd in verband met aanpassingen van
      verwijzingen naar bindende EU-rechtshandelingen of onderdelen daarvan, voor zover de aanpassingen niet inhoudelijk
      van aard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007286#Artikel2
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007286
        artikel: '2'
  - number: '3.1'
    text: |-
      Het besluit op een aanvraag van een vergunning of een registratie, een speciale vergunning of een speciale
      registratie, als bedoeld in Verordening nr. 273/2004 en Verordening nr. 111/2005, dan wel het besluit tot schorsing
      of intrekking van een vergunning of registratie, een speciale vergunning of een speciale registratie, wordt genomen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor zover Verordening nr. 273/2004, Verordening nr. 111/2005, Uitvoeringsverordening of de Gedelegeerde
      Verordening uitdrukkelijk een grondslag geeft voor het stellen van voorschriften door de lidstaten kunnen bij
      regeling van Onze Minister uitvoeringsregels van ondergeschikte aard worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat voor de behandeling van een aanvraag om een vergunning of
      een registratie als bedoeld in het eerste lid een kostendekkende vergoeding is verschuldigd. De hoogte van deze
      vergoeding kan per categorie van vergunningen, registraties of precursoren verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel3
  - number: '4.1'
    text: |-
      Indien er een redelijk vermoeden bestaat dat geregistreerde stoffen als bedoeld in Verordening nr. 273/2004
      en Verordening nr. 111/2005 bestemd zijn voor de illegale vervaardiging van verdovende middelen of psychotrope
      stoffen, verbiedt Onze Minister het binnen of buiten het douanegebied van de Unie brengen van deze stoffen.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4
  - number: '4.2'
    text: Het is verboden te handelen in strijd met een verbod als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4
  - number: '4.3'
    text: Onze Minister kan een verbod als bedoeld in het eerste lid opheffen.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4
  - number: 4a.1
    text: |-
      Het is verboden een stof die op grond van het tweede lid is aangewezen, in te voeren, uit te voeren, te vervoeren
      of voorhanden te hebben.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4a
  - number: 4a.2
    text: |-
      De aanwijzing van een stof als bedoeld in het eerste lid, geschiedt bij ministeriële regeling, van Onze Minister
      van Justitie en Veiligheid mede namens Onze Minister, indien:
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4a
  - number: 4a.2.a
    text: |-
      is gebleken dat een stof, niet zijnde een geregistreerde stof of een op een lijst van niet-geregistreerde stoffen
      geplaatste stof als bedoeld in [Verordening nr. 273/2004](32004R0273) en [Verordening nr. 111/2005](32005R0111),
      kan worden gebruikt voor de illegale vervaardiging van verdovende middelen of psychotrope stoffen; en
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4a
  - number: 4a.2.b
    text: geen legale toepassing van de stof bekend is.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4a
  - number: 4a.3
    text: |-
      De aanwijzing van een stof als bedoeld in het tweede lid vervalt van rechtswege indien een aangewezen stof
      wordt geregistreerd of op een lijst van niet-geregistreerde stoffen wordt geplaatst op grond van [Verordening
      nr. 273/2004](32004R0273) of [Verordening nr. 111/2005](32005R0111). Hiervan wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel4a
  - number: '5.1'
    text: 'De bij besluit van Onze Minister aangewezen ambtenaren zijn belast met:'
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel5
  - number: 5.1.a
    text: het toezicht op de naleving van het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel5
  - number: 5.1.b
    text: |-
      het verrichten van taken die worden gevorderd door Verordening nr. 273/2004, Verordening nr. 111/2005, de
      Gedelegeerde Verordening en de Uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de aanwijzing, bedoeld in het eerste lid, ambtenaren betreft, ressorterende onder een ander ministerie dan
      dat van Onze Minister, wordt het desbetreffende besluit genomen in overeenstemming met Onze Minister die het mede
      aangaat.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel5
  - number: '24'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet voorkoming misbruik chemicaliën.'
    url: https://wetten.overheid.nl/BWBR0007286/2022-01-01#Artikel25
