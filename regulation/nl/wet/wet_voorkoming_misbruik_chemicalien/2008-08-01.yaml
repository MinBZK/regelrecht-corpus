$id: wet_voorkoming_misbruik_chemicalien
regulatory_layer: WET
publication_date: '2025-11-10'
valid_from: '2008-08-01'
bwb_id: BWBR0007286
url: https://wetten.overheid.nl/BWBR0007286/2008-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter uitvoering van richtlijn 92/109/EEG van de Raad van de Europese
    Gemeenschappen van 14 december 1992 inzake de vervaardiging en het in de handel brengen van bepaalde stoffen die
    worden gebruikt voor de illegale vervaardiging van verdovende middelen en psychotrope stoffen (PbEG L 370) en
    in verband met de uitvoering van verordening (EEG) nr. 3677/90 van de Raad van de Europese Gemeenschappen van
    13 december 1990, houdende maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale
    vervaardiging van verdovende middelen en psychotrope stoffen (PbEG L 357) noodzakelijk is bij de wet regelen te
    stellen ten aanzien van de vervaardiging en het in de handel brengen van bepaalde chemicaliën alsmede ten aanzien
    van de op het terrein van in-, uit- en doorvoer te verlenen vergunningen en de sanctionering van de overtreding van
    de bepalingen van de verordening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel1
  - number: 1.b
    text: |-
      [Verordening nr. 273/2004](32004R0273): [verordening (EG) nr. 273/2004](32004R0273) van het Europees Parlement en
      de Raad van 11 februari 2004 inzake drugsprecursoren (PbEU L 47);
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel1
  - number: 1.c
    text: |-
      [Verordening nr. 111/2005](32005R0111): [verordening (EG) nr. 111/2005](32005R0111) van de Raad van 22
      december 2004 houdende voorschriften voor het toezicht op de handel tussen de Gemeenschap en derde landen in
      drugsprecursoren (PbEU L 22);
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel1
  - number: 1.d
    text: |-
      [Verordening nr. 3677/90](31990R3677): [verordening nr. 3677/90](31990R3677) (EEG) van de Raad van 13 december
      1990 houdende maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale vervaardiging van
      verdovende middelen en psychotrope stoffen (PbEG L 357);
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel1
  - number: 1.e
    text: |-
      Uitvoeringsverordening: [verordening (EG) nr. 1277/2005](32005R1277) van de Commissie van 27 juli 2005 tot
      vaststelling van uitvoeringsbepalingen van [Verordening nr. 273/2004](32004R0273) van het Europees Parlement en de
      Raad inzake drugsprecursoren en van [Verordening nr. 111/2005](32005R0111) van de Raad houdende voorschriften voor
      het toezicht op de handel tussen de Gemeenschap en derde landen in drugsprecursoren (PbEU L 202).
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel1
  - number: '2'
    text: 'Het is verboden te handelen in strijd met voorschriften gesteld bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel2
  - number: 2.a
    text: |-
      de artikelen 3, tweede en derde lid, en 8 van [Verordening nr. 273/2004](32004R0273), de artikelen 6, eerste lid,
      8, eerste lid, 9, 12, eerste lid, en 20 van [Verordening nr. 111/2005](32005R0111).
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel2
  - number: 2.b
    text: |-
      artikel 7, eerste lid, van [Verordening nr. 111/2005](32005R0111) en artikel 10, eerste lid, van de
      Uitvoeringsverordening;
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel2
  - number: 2.c
    text: |-
      de artikelen 3, eerste en zesde lid, 4, 5 en 7 van [Verordening nr. 273/2004](32004R0273) en de artikelen 3, 4,
      5, 14, tweede lid, en 22 van [Verordening nr. 111/2005](32005R0111) en de artikelen 3, 10, tweede, derde en vierde
      lid, en 27 van de Uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel2
  - number: '3.1'
    text: |-
      De beslissing op een aanvraag voor een vergunning als bedoeld in [Verordening nr. 273/2004](32004R0273) en
      [Verordening nr. 111/2005](32005R0111) geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel3
  - number: '3.2'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de speciale vergunning en registratie
      als bedoeld in artikel 3, tweede en zesde lid, van [Verordening nr. 273/2004](32004R0273).
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel3
  - number: '3.3'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat voor de behandeling van een aanvraag om een vergunning als
      bedoeld in het eerste lid een kostendekkende vergoeding is verschuldigd. De hoogte van deze vergoeding kan per
      categorie van vergunningen of precursoren verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel3
  - number: '4.1'
    text: |-
      Indien er een redelijk vermoeden bestaat dat geregistreerde stoffen bestemd zijn voor de illegale vervaardiging
      van verdovende middelen of psychotrope stoffen, verbiedt Onze Minister het binnen of buiten het grondgebied van de
      Gemeenschap brengen van deze stoffen.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel4
  - number: '4.2'
    text: Het is verboden te handelen in strijd met een verbod als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel4
  - number: '4.3'
    text: Onze Minister kan een verbod als bedoeld in het eerste lid opheffen.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel4
  - number: '13.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel13
  - number: 13.1.a
    text: |-
      de buitengewone opsporingsambtenaren van de Belastingdienst / Fiscale inlichtingen- en opsporingsdienst –
      Economische controledienst van het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel13
  - number: 13.1.b
    text: de bij besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel13
  - number: '13.2'
    text: Van een besluit als bedoeld in het eerste lid, onder c, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel13
  - number: '24'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet voorkoming misbruik chemicaliën.'
    url: https://wetten.overheid.nl/BWBR0007286/2008-08-01#Artikel25
