---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_voorkoming_misbruik_chemicalien
regulatory_layer: WET
publication_date: '2025-11-10'
valid_from: '1998-01-01'
bwb_id: BWBR0007286
url: https://wetten.overheid.nl/BWBR0007286/1998-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter uitvoering van richtlijn 92/109/EEG van de Raad van de Europese
    Gemeenschappen van 14 december 1992 inzake de vervaardiging en het in de handel brengen van bepaalde stoffen die
    worden gebruikt voor de illegale vervaardiging van verdovende middelen en psychotrope stoffen (PbEG L 370) en
    in verband met de uitvoering van verordening (EEG) nr. 3677/90 van de Raad van de Europese Gemeenschappen van
    13 december 1990, houdende maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale
    vervaardiging van verdovende middelen en psychotrope stoffen (PbEG L 357) noodzakelijk is bij de wet regelen te
    stellen ten aanzien van de vervaardiging en het in de handel brengen van bepaalde chemicaliën alsmede ten aanzien
    van de op het terrein van in-, uit- en doorvoer te verlenen vergunningen en de sanctionering van de overtreding van
    de bepalingen van de verordening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: 1.1.b
    text: |-
      de richtlijn: [richtlijn 92/109/EEG](31992L0109) van de Raad van de Europese Gemeenschappen van 14 december 1992
      inzake de vervaardiging en het in de handel brengen van bepaalde stoffen die worden gebruikt voor de illegale
      vervaardiging van verdovende middelen en psychotrope stoffen (*PbEG* L 370);
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: 1.1.c
    text: |-
      de verordening: [verordening (EEG) nr. 3677/90](31990R3677) van de Raad van de Europese Gemeenschappen van
      13 december 1990, houdende maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale
      vervaardiging van verdovende middelen en psychotrope stoffen (*PbEG* L 357), zoals deze laatstelijk is gewijzigd
      bij [verordening (EEG) nr. 2959/93](31993R2959) van de Commissie van 27 oktober 1993 tot wijziging van [verordening
      (EEG) nr. 3769/92](31992R3769) ter uitvoering en tot wijziging van [Verordening (EEG) nr. 3677/90](31990R3677) van
      de Raad houdende maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale vervaardiging
      van verdovende middelen en psychotrope stoffen (*PbEG* L 267);
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: 1.1.d
    text: 'de Gemeenschap: de Europese Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: 1.1.e
    text: |-
      geregistreerde stof: een in bijlage I bij de richtlijn opgenomen stof, met inbegrip van mengsels welke dergelijke
      stoffen bevatten;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: 1.1.f
    text: |-
      in de handel brengen: het al dan niet tegen betaling aan derden ter beschikking stellen van geregistreerde stoffen,
      die in de Gemeenschap zijn vervaardigd of in het vrije verkeer gebracht;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: 1.1.g
    text: |-
      deelnemer aan het handelsverkeer: elke natuurlijke of rechtspersoon die betrokken is bij de vervaardiging, de
      voortbrenging, de verwerking, de handel in of de distributie van geregistreerde stoffen of die betrokken is bij
      aanverwante activiteiten zoals de bemiddeling en opslag van geregistreerde stoffen.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: '1.2'
    text: |-
      Tot geregistreerde stoffen worden niet gerekend geneesmiddelen als bedoeld in [artikel 1, eerste lid, onder ][ref1]
      of andere preparaten die geregistreerde stoffen bevatten, mits zij op zodanige wijze zijn samengesteld dat deze
      stoffen niet op eenvoudige wijze kunnen worden gebruikt of met eenvoudige middelen kunnen worden teruggewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel1
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '1'
  - number: '1.3'
    text: |-
      Een wijziging van een bijlage bij de richtlijn treedt voor de toepassing van deze wet in werking met ingang van de
      dag waarop aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel1
  - number: '2'
    text: |-
      Deelnemers aan het handelsverkeer en personen of rechtspersonen als bedoeld in artikel 1, tweede lid, onder
      *e*, van de verordening stellen Onze Minister onverwijld in kennis van alle voorvallen die doen vermoeden dat
      geregistreerde stoffen die in de handel zullen worden gebracht, zullen worden vervaardigd of voor de in-, uit-, of
      doorvoer zijn bestemd, misbruikt kunnen of zullen worden voor de illegale vervaardiging van verdovende middelen of
      psychotrope stoffen.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel2
  - number: '3'
    text: |-
      Het vervaardigen of in de handel brengen van geregistreerde stoffen van categorie 1 van bijlage I bij de richtlijn
      zonder vergunning van Onze Minister is verboden.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel3
  - number: '4'
    text: |-
      Een houder van een vergunning als bedoeld in [artikel 3][ref1] stelt de desbetreffende geregistreerde stoffen
      slechts ter beschikking van personen, rechtspersonen daaronder begrepen, of instellingen, die behoren tot een bij
      ministeriële regeling aangewezen categorie van personen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007286#Artikel3
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007286
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      Het is aan anderen dan houders van een vergunning als bedoeld in [artikel 3][ref1] en aan personen of instellingen
      als bedoeld in [artikel 4][ref2] verboden geregistreerde stoffen van categorie 1 van bijlage I bij de richtlijn
      voorhanden te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007286#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007286#Artikel4
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007286
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007286
        artikel: '4'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Onze Minister kan regelen stellen omtrent de bij een aanvraag van een vergunning als bedoeld in [artikel 3][ref1]
      te verschaffen gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007286#Artikel3
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007286
        artikel: '3'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Aan een vergunning kunnen voorschriften en beperkingen worden verbonden, waaronder een beperking van de
      geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: '6.3'
    text: 'Een vergunning wordt niet verleend indien:'
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: 6.3.a
    text: |-
      er redenen zijn om aan te nemen dat de competentie of de integriteit van de aanvrager hem ongeschikt maken voor het
      vervaardigen of in de handel brengen van geregistreerde stoffen of,
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: 6.3.b
    text: er redelijke vermoedens bestaan dat de overeenkomstig het eerste lid verstrekte informatie vals of onjuist is.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: '6.4'
    text: 'Een vergunning kan worden ingetrokken of gewijzigd indien:'
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: 6.4.a
    text: |-
      blijkt dat de in verband met de aanvraag van een vergunning verstrekte gegevens zodanig onjuist of onvolledig zijn
      dat op die aanvraag een andere beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste gegevens
      bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: 6.4.b
    text: |-
      degene, aan wie de vergunning is verleend, daarvan geen gebruik maakt en niet aannemelijk is, dat deze daarvan
      binnen redelijke termijn gebruik zal maken;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: 6.4.c
    text: |-
      degene, aan wie de vergunning is verleend, in strijd handelt met de bij of krachtens deze wet gestelde regelen, met
      de aan de vergunning verbonden voorschriften of met de beperkingen, waaronder de vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: 6.4.d
    text: |-
      er redenen zijn aan te nemen dat niet langer wordt voldaan aan de voorwaarden voor het verkrijgen van een
      vergunning.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel6
  - number: '7.1'
    text: |-
      De deelnemers aan het handelsverkeer dragen zorg dat alle transacties die leiden tot het in de handel brengen
      van geregistreerde stoffen van categorie 1 of categorie 2 van bijlage I bij de richtlijn, naar behoren zijn
      gedocumenteerd. Handelsbescheiden, zoals facturen, vrachtbrieven, administratieve bescheiden, vervoers- of andere
      verzendingsdocumenten, bevatten voldoende informatie om de volgende elementen met zekerheid te kunnen vaststellen:
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel7
  - number: 7.1.a
    text: een omschrijving van de geregistreerde stof;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel7
  - number: 7.1.b
    text: |-
      de hoeveelheid en het gewicht van de geregistreerde stof en, indien het een mengsel betreft, de hoeveelheid
      en het gewicht van dit mengsel alsook de hoeveelheid en het gewicht of het percentage van de daarin aanwezige
      geregistreerde stof;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel7
  - number: 7.1.c
    text: de naam en het adres van de leverancier, de distributeur en de geadresseerde.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel7
  - number: '7.2'
    text: |-
      De documentatie, bedoeld in het eerste lid, bevat bovendien een verklaring van de afnemer, waarin de
      gebruiksdoeleinden van de stoffen worden gespecificeerd. Onze Minister stelt regelen ter uitvoering van de
      krachtens artikel 2, eerste lid, onder *b*, van de richtlijn vastgestelde toepassingsmodaliteiten.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ten aanzien van transacties die betrekking hebben op
      geregistreerde stoffen van categorie 2 van bijlage I bij de richtlijn, indien de betrokken hoeveelheden de in
      bijlage II bij de richtlijn aangegeven waarden niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel7
  - number: '7.4'
    text: |-
      De deelnemers aan het handelsverkeer bewaren de in het eerste en tweede lid bedoelde documenten gedurende
      een tijdvak van ten minste drie jaar te rekenen vanaf het einde van het kalenderjaar waarin de desbetreffende
      transactie heeft plaatsgevonden en houden die documenten gedurende die periode ter beschikking van de ambtenaren,
      bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007286#Artikel13
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007286
        artikel: '13'
        paragraaf: '4'
  - number: '8'
    text: |-
      De deelnemers aan het handelsverkeer dragen zorg dat de geregistreerde stoffen van de categorieën 1 en 2, alvorens
      zij in de handel worden gebracht, in elk geval zijn voorzien van een etiket, waarop de naam van de betrokken stof
      is aangebracht zoals deze is vermeld in bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel8
  - number: '9'
    text: |-
      De deelnemers aan het handelsverkeer die betrokken zijn bij de vervaardiging of het in de handel brengen van
      geregistreerde stoffen van categorie 2 van bijlage I bij de richtlijn, verstrekken aan Onze Minister een opgave van
      de adressen van de bedrijfsruimten waar zij deze stoffen vervaardigen of van waaruit zij deze stoffen verhandelen.
      Zij brengen wijzigingen daarin ter kennis van die minister.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel9
  - number: '10'
    text: 'Het is verboden te handelen in strijd met voorschriften gesteld bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel10
  - number: 10.a
    text: artikel 2 *bis*, eerste lid, eerste volzin, van de verordening;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel10
  - number: 10.b
    text: artikel 4, eerste lid, van de verordening;
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel10
  - number: 10.c
    text: |-
      artikel 2, artikel 2 *bis*, tweede lid, artikel 4, zesde lid, eerste alinea en tweede alinea, eerste volzin,
      artikel 5, eerste lid, tweede lid, derde lid, eerste en tweede alinea, en artikel 5 *bis*, eerste en tweede lid,
      van de verordening.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel10
  - number: '11.1'
    text: |-
      De beslissing op een aanvraag van een vergunning als bedoeld in artikel 2 *bis*, eerste lid, van de verordening
      geschiedt door Onze Minister, de beslissing op een aanvraag van een vergunning als bedoeld in artikel 4, eerste
      lid, 5 eerste lid, of 5 *bis* eerste lid, van de verordening, geschiedt door Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel11
  - number: '11.2'
    text: |-
      Aan een vergunning kunnen voorschriften en beperkingen worden verbonden waaronder een beperking van de
      geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister kan het binnenbrengen van een in de bijlage bij de verordening opgenomen stof in Nederland van
      buiten het grondgebied van de Gemeenschap of het verlaten van een dergelijke stof uit Nederland naar buiten het
      douanegebied van de Gemeenschap verbieden indien hij redelijkerwijs kan vermoeden dat zij bestemd zijn voor de
      illegale vervaardiging van verdovende middelen of psychotrope stoffen. Het is verboden te handelen in strijd met
      een zodanig verbod.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel12
  - number: '13.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister en Onze Minister van Economische Zaken aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel13
  - number: '13.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel13
  - number: '21'
    text: |-
      Van een wijziging van een bijlage bij de richtlijn wordt door Onze Minister onverwijld mededeling gedaan in de
      *Staatscourant* met vermelding van het tijdstip waarop zij voor de toepassing van deze wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel21
  - number: '24'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet voorkoming misbruik chemicaliën.'
    url: https://wetten.overheid.nl/BWBR0007286/1998-01-01#Artikel25
