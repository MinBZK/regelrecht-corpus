  - number: '3'
    text: |-
      1 De minister verstrekt op aanvraag een kleine innovatievoucher aan een ondernemer als bedoeld in
      [artikel 2, eerste lid][ref1]. [Artikel 2, derde lid, onder a en c][ref2] is van overeenkomstige toepassing.

      2 Geen kleine innovatievoucher wordt verstrekt aan een ondernemer aan wie op grond
      van deze regeling reeds een kleine of grote innovatievoucher is verstrekt of aan
      wie op grond van de [Beleidsregel verstrekking innovatievouchers 2004][ref3],
      de [Beleidsregel verstrekking innovatievouchers pilot 2005][ref4] of de
      [Beleidsregel verstrekking innovatievouchers pilot 2005 tweede fase][ref5] een innovatievoucher is verstrekt.

      3 Geen kleine innovatievoucher wordt verstrekt aan een ondernemer in het kader van een kennisoverdrachtproject dat
      een kennisvraag betreft van een aantal ondernemers gezamenlijk.

      4 Geen kleine innovatievoucher wordt verstrekt aan een ondernemer aan wie door een of meer bestuursorganen in de
      drie aan de aanvraag voorafgaande jaren reeds € 97.500 of meer aan subsidie is verstrekt zonder goedkeuring van de
      Commissie van de Europese Gemeenschappen.


