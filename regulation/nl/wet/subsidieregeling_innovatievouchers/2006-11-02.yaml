  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: de Minister van Economische Zaken;

      b. ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht
      is ingesteld, die een onderneming in stand houdt;

      c. kennisinstelling:

      1°. een onder [a, b, c, f of g van de bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instelling voor hoger onderwijs en een onder [i van de bijlage bij die wet](onbekend) bedoeld
      academisch ziekenhuis, Nyenrode Business Universiteit alsmede andere instellingen van hoger onderwijs, die op
      basis van [artikel 6.9][ref1] of [16.14 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] zijn
      aangewezen en zich als kennisinstelling in de zin van deze regeling bij de minister hebben aangemeld;

      2°. instellingen als bedoeld in [artikel 1.1.1, onderdeel b][ref3], [artikel 12.3.8][ref4] en
      [artikel 12.3.9 van de Wet educatie en beroepsonderwijs][ref5];

      3°. een andere dan onder 1° bedoelde geheel of gedeeltelijk, meerjarig door de overheid gefinancierde
      onderzoeksinstelling zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke of
      technische kennis uit te breiden;

      4°. een geheel of gedeeltelijk, meerjarig door een andere lidstaat van de Europese Unie gefinancierde

        - openbare instelling voor hoger onderwijs of een daaraan verbonden ziekenhuis gelijkwaardig aan een instelling
      respectievelijk academisch ziekenhuis als bedoeld onder 1°;
        - instelling van middelbaar beroepsonderwijs gelijkwaardig aan een instelling als bedoeld onder 2°; of
        - onderzoeksinstelling zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke en
      technische kennis uit te breiden;

      5°. een rechtspersoon ten aanzien waarvan een instelling als bedoeld onder 1°, 2°, 3° of 4° direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft;
        - volledig aansprakelijk vennoot is; of
        - overwegende zeggenschap heeft;

      6°. een onderzoeksinstelling zonder winstoogmerk die tot doel heeft om, via het doen van eigen onderzoek en het
      ontwikkelen en testen van technische toepassingen, de technologische kennis op een specifiek terrein te bevorderen,
      geen instelling is als bedoeld onder 1° tot en met 5° en zich als kennisinstelling in de zin van deze regeling bij
      de minister heeft aangemeld;

      7°. een onderzoeksafdeling, die onderdeel vormt van een onderneming of groep die niet als hoofddoelstelling
      onderzoek en ontwikkeling heeft en die in 2005 kosten voor onderzoek en ontwikkeling had van ten minste
      € 60.000.000;

      d. kennisoverdrachtproject: een door een kennisinstelling verrichte activiteit, bestaande uit het, al dan niet op
      basis van te verrichten nader onderzoek, beantwoorden van een toepassingsgerichte kennisvraag van een ondernemer
      of ten hoogste 10 ondernemers gezamenlijk, uitgaande van voor de ondernemer nieuwe kennis met betrekking tot de
      vernieuwing van producten, productieprocessen of diensten en van welke activiteit de gevolgen naar verwachting
      grotendeels ten goede zullen komen aan de Nederlandse economie;

      e. grote innovatievoucher: een op grond van [artikel 2, eerste lid][ref6], van deze regeling door de minister aan
      een ondernemer afgegeven document, dat deze ondernemer kan inleveren bij een kennisinstelling ten behoeve van de
      uitvoering van een kennisoverdrachtproject waarbij van de ondernemer een eigen bijdrage verlangd wordt;

      f. kleine innovatievoucher: een op grond van [artikel 3, eerste lid][ref7], van deze regeling door de minister aan
      een ondernemer afgegeven document, dat deze ondernemer kan inleveren bij een kennisinstelling ten behoeve van de
      uitvoering van een kennisoverdrachtproject zonder dat een eigen bijdrage van de ondernemer verlangd wordt.

      2 Geen kennisoverdrachtproject in de zin van deze regeling is een project waarbij de beantwoording van een
      toepassingsgerichte kennisvraag uitsluitend plaatsvindt door het leveren van goederen, het geven van cursussen of
      het uitvoeren van verkoopgerichte marktactiviteiten.


