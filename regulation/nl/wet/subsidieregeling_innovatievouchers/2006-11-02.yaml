        artikel: 4:5
  - number: '6'
    text: De minister geeft een beschikking binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019805/2006-11-02#Artikel6
  - number: '7'
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een kennisinstelling die een kennisoverdrachtproject heeft
      uitgevoerd en in verband daarmee een of meer geldige grote innovatievouchers of een geldige kleine innovatievoucher
      overlegt.

      2 Geen subsidie wordt verstrekt voor een kennisoverdrachtproject in verband waarmee de ondernemer en de
      kennisinstelling reeds voor de afgiftedatum van de innovatievoucher verplichtingen jegens elkaar zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0019805/2006-11-02#Artikel7
  - number: '8'
    text: |-
      1 De subsidie bedraagt tweederde deel van het bedrag van de door de kennisinstelling voor het
      kennisoverdrachtproject gemaakte kosten, exclusief eventueel in rekening te brengen omzetbelasting, maar niet
      meer dan € 5000 per overgelegde grote innovatievoucher en, indien het kennisoverdrachtproject gericht is op het
      beantwoorden van een kennisvraag van meerdere ondernemers gezamenlijk, niet meer dan € 50.000 in totaal.

      2 De subsidie bedraagt het bedrag van de door de kennisinstelling voor het kennisoverdrachtproject gemaakte kosten,
      exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 2500 voor de overgelegde kleine
      innovatievoucher.

      3 De door de kennisinstelling gemaakte kosten bestaan voor maximaal eenderde deel uit kosten
      die de kennisinstelling heeft gemaakt doordat de kennisinstelling het onderzoek in het kader van
      het kennisoverdrachtproject gedeeltelijk heeft uitbesteed aan een derde, niet zijnde een bij dat
      kennisoverdrachtproject betrokken aanvrager.

      4 Indien het in het vorige lid bedoelde eenderde deel van de kosten wordt overschreden, bedragen de door de
      kennisinstelling gemaakte kosten als bedoeld in het eerste lid, anderhalf maal de kosten van eigen onderzoek van
      de kennisinstelling.

      5 Niet subsidiabel zijn kosten die in het kader van stages van studenten van kennisinstellingen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0019805/2006-11-02#Artikel8
  - number: '9'
    text: |-
      1 Een aanvraag om subsidie wordt na afloop van het kennisoverdrachtproject ingediend met gebruikmaking van een
      formulier, overeenkomstig het model dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref1].

      2 De aanvraag moet binnen 6 maanden nadat de voucher aan de ondernemer is verstrekt, zijn ontvangen. Op een voor
      het einde van de termijn daartoe ingediend schriftelijk verzoek kan de minister deze termijn eenmalig verlengen.

      3 De aanvraag gaat vergezeld van:

      a. de ten behoeve van de uitvoering van het kennisoverdrachtproject bij de kennisinstelling ingeleverde grote
      innovatievouchers of kleine innovatievoucher;

      b. een kopie van de factuur die de kennisinstelling in verband met het kennisoverdrachtproject aan de ondernemer
      heeft verstuurd, overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019805
