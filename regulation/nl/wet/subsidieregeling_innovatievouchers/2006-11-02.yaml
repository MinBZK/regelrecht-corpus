  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag een grote innovatievoucher aan een ondernemer, die een kleine of middelgrote
      onderneming in stand houdt in de zin van [verordening (EG) nr. 70/2001](32001R0070) van de Commissie van de
      Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag
      op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10), die een kennisoverdrachtproject wil laten
      uitvoeren waarvan de resultaten ten goede komen aan de activiteiten die de ondernemer in Nederland verricht.

      2 Per ondernemer kan per kalenderjaar één grote innovatievoucher worden verstrekt.

      3 Geen grote innovatievoucher wordt verstrekt aan een ondernemer:

      a. die een onderneming in stand houdt als bedoeld in artikel 1, onder a, van [verordening (EG) nr. 69/2001]
      (32001R0069) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de
      artikelen 87 en 88 van het EG-verdrag op de de minimis-steun (PbEG L 10);

      b. aan wie door een of meer bestuursorganen in de drie aan de aanvraag voorafgaande jaren reeds € 95.000 of meer
      aan subsidie is verstrekt zonder goedkeuring van de Commissie van de Europese Gemeenschappen;

      c. die failliet is verklaard, aan wie surséance van betaling is verleend, ten aanzien van wie de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of voor wie een verzoek daartoe bij de
      rechtbank is ingediend;

      d. die reeds eerder een aanvraag om verstrekking van een grote of kleine innovatievoucher heeft gedaan waarop de
      minister nog geen beschikking heeft afgegeven als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel6
