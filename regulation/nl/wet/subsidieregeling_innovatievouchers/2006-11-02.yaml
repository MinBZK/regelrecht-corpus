  - number: '4'
    text: |-
      1 De aanvraag door een ondernemer van een grote of kleine innovatievoucher wordt ingediend met gebruikmaking van
      een formulier, overeenkomstig het model dat is opgenomen in de bij deze regeling behorende [bijlage 1][ref1] en
      gaat vergezeld van de bescheiden, overeenkomstig hetgeen in het formulier is vermeld.

      2 Een ondernemer kan ten hoogste één voucher tegelijkertijd aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019805
    url: https://wetten.overheid.nl/BWBR0019805/2006-11-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019805
  - number: '5'
    text: |-
      1 Bij ministeriële regeling wordt bepaald gedurende welke periodes grote innovatievouchers en kleine
      innovatievouchers kunnen worden aangevraagd en wordt per periode bepaald hoeveel grote innovatievouchers en kleine
      innovatievouchers voor binnen dezelfde periode ingediende aanvragen beschikbaar zijn.

      2 Voor het jaar 2006

      a. vangt de in het eerste lid bedoelde aanvraagperiode aan op de dag dat deze regeling in werking treedt en eindigt
      deze op 15 december 2006; en

      b. bedraagt het in het eerste lid bedoelde aantal grote innovatievouchers 3000 en het aantal kleine
      innovatievouchers 3000.

      3 De minister verdeelt de beschikbare grote innovatievouchers en kleine innovatievouchers in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft
      voldaan aan enig voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de voorschriften met betrekking tot de verdeling als datum van ontvangst geldt.

      4 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      grote innovatievouchers of het beschikbare aantal kleine innovatievouchers zou worden overschreden, stelt de
      minister de onderlinge rangschikking van deze aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
