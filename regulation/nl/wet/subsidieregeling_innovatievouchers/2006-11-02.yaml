  - number: '10'
    text: |-
      De minister geeft een beschikking, inhoudende de subsidievaststelling, binnen dertien weken na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0019805/2006-11-02#Artikel10
  - number: '11'
    text: De minister beslist afwijzend op een aanvraag indien de aanvraag niet voldoet aan deze regeling.
    url: https://wetten.overheid.nl/BWBR0019805/2006-11-02#Artikel11
  - number: '12'
    text: |-
      1 De ondernemer wendt geen grote of kleine innovatievoucher aan voor een kennisoverdrachtproject waarvoor reeds
      door een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie is verstrekt of dat deel uitmaakt
      van een project of programma waarvoor reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen
      subsidie is verstrekt.

      2 De minister kan bij de subsidievaststelling verplichtingen opleggen met betrekking tot het verlenen van
      medewerking door de subsidie-ontvanger aan een evaluatie van de toepassing van deze regeling.
    url: https://wetten.overheid.nl/BWBR0019805/2006-11-02#Artikel12
