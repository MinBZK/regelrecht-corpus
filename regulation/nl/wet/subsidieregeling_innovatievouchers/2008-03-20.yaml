preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.a
    text: 'minister: de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.b
    text: |-
      ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.c
    text: 'kennisinstelling:'
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.c.1°
    text: |-
      een onder [a, b, c, f of g van de bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instelling voor hoger onderwijs en een onder [i van de bijlage bij die wet](onbekend) bedoeld
      academisch ziekenhuis, Nyenrode Business Universiteit alsmede andere instellingen van hoger onderwijs, die op
      basis van [artikel 6.9][ref1] of [16.14 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] zijn
      aangewezen en zich als kennisinstelling in de zin van deze regeling bij de minister hebben aangemeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
  - number: 1.1.c.2°
    text: |-
      instellingen als bedoeld in [artikel 1.1.1, onderdeel b][ref1], [artikel 12.3.8][ref2] en
      [artikel 12.3.9 van de Wet educatie en beroepsonderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 1.1.c.3°
    text: |-
      een andere dan onder 1° bedoelde geheel of gedeeltelijk, meerjarig door de overheid gefinancierde
      onderzoeksinstelling zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke of
      technische kennis uit te breiden;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.c.4°
    text: |-
      een geheel of gedeeltelijk, meerjarig door een andere lidstaat van de Europese Unie gefinancierde - openbare
      instelling voor hoger onderwijs of een daaraan verbonden ziekenhuis gelijkwaardig aan een instelling
      respectievelijk academisch ziekenhuis als bedoeld onder 1°;
        - instelling van middelbaar beroepsonderwijs gelijkwaardig aan een instelling als bedoeld onder 2°; of
        - onderzoeksinstelling zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke en
      technische kennis uit te breiden;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.c.5°
    text: |-
      een rechtspersoon ten aanzien waarvan een instelling als bedoeld onder 1°, 2°, 3° of 4° direct of indirect: - meer
      dan de helft van het geplaatste kapitaal verschaft;
        - volledig aansprakelijk vennoot is; of
        - overwegende zeggenschap heeft;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.c.6°
    text: |-
      een onderzoeksinstelling zonder winstoogmerk die tot doel heeft om, via het doen van eigen onderzoek en het
      ontwikkelen en testen van technische toepassingen, de technologische kennis op een specifiek terrein te bevorderen,
      geen instelling is als bedoeld onder 1° tot en met 5° en zich als kennisinstelling in de zin van deze regeling bij
      de minister heeft aangemeld;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.c.7°
    text: |-
      een onderzoeksafdeling, die onderdeel vormt van een onderneming of groep die niet als hoofddoelstelling onderzoek
      en ontwikkeling heeft en die in 2005 kosten voor onderzoek en ontwikkeling had van ten minste € 60.000.000;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.d
    text: |-
      kennisoverdrachtproject: een door een kennisinstelling verrichte activiteit, bestaande uit het, al dan niet op
      basis van te verrichten nader onderzoek, beantwoorden van een toepassingsgerichte kennisvraag van een ondernemer
      of ten hoogste 10 ondernemers gezamenlijk, uitgaande van voor de ondernemer nieuwe kennis met betrekking tot de
      vernieuwing van producten, productieprocessen of diensten en van welke activiteit de gevolgen naar verwachting
      grotendeels ten goede zullen komen aan de Nederlandse economie;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: 1.1.e
    text: |-
      grote innovatievoucher: een op grond van [artikel 2, eerste lid][ref1], van deze regeling door de minister aan
      een ondernemer afgegeven document, dat deze ondernemer kan inleveren bij een kennisinstelling ten behoeve van de
      uitvoering van een kennisoverdrachtproject waarbij van de ondernemer een eigen bijdrage verlangd wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel2
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019805
        artikel: '2'
        paragraaf: '2'
  - number: 1.1.f
    text: |-
      kleine innovatievoucher: een op grond van [artikel 3, eerste lid][ref1], van deze regeling door de minister aan
      een ondernemer afgegeven document, dat deze ondernemer kan inleveren bij een kennisinstelling ten behoeve van de
      uitvoering van een kennisoverdrachtproject zonder dat een eigen bijdrage van de ondernemer verlangd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel3
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019805
        artikel: '3'
        paragraaf: '2'
  - number: '1.2'
    text: |-
      Geen kennisoverdrachtproject in de zin van deze regeling is een project waarbij de beantwoording van een
      toepassingsgerichte kennisvraag uitsluitend plaatsvindt door het leveren van goederen, het geven van cursussen of
      het uitvoeren van verkoopgerichte marktactiviteiten.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel1
  - number: '2.1'
    text: |-
      De minister verstrekt op aanvraag een grote innovatievoucher aan een ondernemer, die een kleine of middelgrote
      onderneming in stand houdt in de zin van [verordening (EG) nr. 70/2001](32001R0070) van de Commissie van de
      Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag
      op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10), die een kennisoverdrachtproject wil laten
      uitvoeren waarvan de resultaten ten goede komen aan de activiteiten die de ondernemer in Nederland verricht.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel2
  - number: '2.2'
    text: Per ondernemer kan per kalenderjaar één grote innovatievoucher worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel2
  - number: '2.3'
    text: 'Geen grote innovatievoucher wordt verstrekt aan een ondernemer:'
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel2
  - number: 2.3.a
    text: |-
      aan wie door een of meer bestuursorganen in de drie aan de aanvraag voorafgaande jaren reeds tot een hoger bedrag
      subsidie is verstrekt zonder goedkeuring van de Commissie van de Europese Gemeenschappen dan voor de sector waartoe
      de betrokken onderneming behoort is vastgesteld in de Verordeningen van de Commissie van de Europese Gemeenschappen
      betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel2
  - number: 2.3.b
    text: |-
      die failliet is verklaard, aan wie surséance van betaling is verleend, ten aanzien van wie de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of voor wie een verzoek daartoe bij de
      rechtbank is ingediend;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel2
  - number: 2.3.c
    text: |-
      die reeds eerder een aanvraag om verstrekking van een grote of kleine innovatievoucher heeft gedaan waarop de
      minister nog geen beschikking heeft afgegeven als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel6
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019805
        artikel: '6'
        paragraaf: '2'
  - number: '2.4'
    text: |-
      Indien het voor de betrokken ondernemer geldende de-minimisplafond, bedoeld in onderdeel a van het derde lid, niet
      al is bereikt door andere subsidies, wordt het bedrag dat gelet op dat plafond ten hoogste met inzet van de voucher
      kan worden vergoed, op de voucher vermeld.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel2
  - number: '3.1'
    text: |-
      De minister verstrekt op aanvraag een kleine innovatievoucher aan een ondernemer als bedoeld in
      [artikel 2, eerste lid][ref1]. [Artikel 2, tweede lid, derde lid, onder a en b, en vierde lid][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019805#Artikel2
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019805
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019805
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Geen kleine innovatievoucher wordt verstrekt aan een ondernemer aan wie op grond
      van deze regeling reeds een kleine of grote innovatievoucher is verstrekt of aan
      wie op grond van de [Beleidsregel verstrekking innovatievouchers 2004][ref1],
      de [Beleidsregel verstrekking innovatievouchers pilot 2005][ref2] , de
      [Beleidsregel verstrekking innovatievouchers pilot 2005 tweede fase][ref3] of
      [artikel 2:22 van de Regeling LNV-subsidies][ref4] een innovatievoucher is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017163
      [ref2]: https://wetten.overheid.nl/BWBR0018052
      [ref3]: https://wetten.overheid.nl/BWBR0018805
      [ref4]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017163
      - id: ref2
        bwb_id: BWBR0018052
      - id: ref3
        bwb_id: BWBR0018805
      - id: ref4
        bwb_id: BWBR0021281
        artikel: '2'
  - number: '3.3'
    text: |-
      Geen kleine innovatievoucher wordt verstrekt aan een ondernemer in het kader van een kennisoverdrachtproject dat
      een kennisvraag betreft van een aantal ondernemers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel3
  - number: '3.4'
    text: |-
      Het tweede lid is niet van toepassing indien eerder een kleine of grote innovatievoucher werd verstrekt ten behoeve
      van een subsidie krachtens [paragraaf 4][ref1], dan wel indien het betreft de aanvraag van een innovatievoucher die
      daarvoor wordt verstrekt; in het laatste geval wordt dat op de voucher vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019805
        paragraaf: '4'
  - number: '4.1'
    text: |-
      De aanvraag door een ondernemer van een grote of kleine innovatievoucher wordt ingediend met gebruikmaking van een
      formulier, overeenkomstig het model dat is opgenomen in de bij deze regeling behorende [bijlage 1][ref1] en gaat
      vergezeld van de bescheiden, overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019805
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019805
  - number: '4.2'
    text: Een ondernemer kan ten hoogste één voucher tegelijkertijd aanvragen.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel4
  - number: '5.1'
    text: |-
      Bij ministeriële regeling wordt bepaald gedurende welke periodes grote innovatievouchers en kleine
      innovatievouchers kunnen worden aangevraagd en wordt per periode bepaald hoeveel grote innovatievouchers en kleine
      innovatievouchers voor binnen dezelfde periode ingediende aanvragen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel5
  - number: '5.2'
    text: Voor het jaar 2006
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel5
  - number: 5.2.a
    text: |-
      vangt de in het eerste lid bedoelde aanvraagperiode aan op de dag dat deze regeling in werking treedt en eindigt
      deze op 15 december 2006; en
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel5
  - number: 5.2.b
    text: |-
      bedraagt het in het eerste lid bedoelde aantal grote innovatievouchers 3000 en het aantal kleine innovatievouchers
      3000.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel5
  - number: '5.3'
    text: |-
      De minister verdeelt de beschikbare grote innovatievouchers en kleine innovatievouchers in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft
      voldaan aan enig voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de voorschriften met betrekking tot de verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.4'
    text: |-
      Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      grote innovatievouchers of het beschikbare aantal kleine innovatievouchers zou worden overschreden, stelt de
      minister de onderlinge rangschikking van deze aanvragen vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel5
  - number: '6'
    text: De minister geeft een beschikking binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel6
  - number: '7.1'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een kennisinstelling die een kennisoverdrachtproject heeft
      uitgevoerd en in verband daarmee een of meer geldige grote innovatievouchers of een geldige kleine innovatievoucher
      overlegt.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel7
  - number: '7.2'
    text: |-
      Geen subsidie wordt verstrekt voor een kennisoverdrachtproject in verband waarmee de ondernemer en de
      kennisinstelling reeds voor de afgiftedatum van de innovatievoucher verplichtingen jegens elkaar zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel7
  - number: '8.1'
    text: |-
      De subsidie bedraagt tweederde deel van het bedrag van de door de kennisinstelling voor het kennisoverdrachtproject
      gemaakte kosten, exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 5000 dan wel het
      krachtens [artikel 2, vierde lid][ref1], op de voucher vermelde bedrag per overgelegde grote innovatievoucher en,
      indien het kennisoverdrachtproject gericht is op het beantwoorden van een kennisvraag van meerdere ondernemers
      gezamenlijk, niet meer dan € 50.000 in totaal.


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel2
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019805
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      De subsidie bedraagt het bedrag van de door de kennisinstelling voor het kennisoverdrachtproject gemaakte kosten,
      exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 2500 dan wel het krachtens
      [artikel 2, vierde lid][ref1], op de voucher vermelde bedrag voor de overgelegde kleine innovatievoucher.


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel2
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019805
        artikel: '2'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      De door de kennisinstelling gemaakte kosten bestaan voor maximaal de helft uit kosten die de kennisinstelling
      heeft gemaakt doordat de kennisinstelling het onderzoek in het kader van het kennisoverdrachtproject gedeeltelijk
      heeft uitbesteed aan een derde, niet zijnde een bij dat kennisoverdrachtproject betrokken aanvrager. Geen subsidie
      wordt verstrekt voor zover het onderzoek is uitbesteed aan een persoon, die ook een dienstbetrekking heeft met
      de kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel8
  - number: '8.4'
    text: |-
      Indien de in het vorige lid bedoelde helft van de kosten wordt overschreden, bedragen de door de kennisinstelling
      gemaakte kosten, in aanmerking te nemen bij de toepassing van het eerste lid, tweemaal de kosten van het eigen
      onderzoek van de kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel8
  - number: '8.5'
    text: |-
      Niet subsidiabel zijn kosten die in het kader van stages van studenten van kennisinstellingen worden gemaakt, noch
      kosten voor activiteiten waarvoor studenten studiepunten krijgen.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel8
  - number: '9.1'
    text: |-
      Een aanvraag om subsidie wordt na afloop van het kennisoverdrachtproject ingediend met gebruikmaking van een
      formulier, overeenkomstig het model dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019805
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019805
  - number: '9.2'
    text: |-
      De aanvraag moet binnen een jaar nadat de voucher aan de ondernemer is verstrekt, zijn ontvangen. Op een voor het
      einde van de termijn daartoe ingediend schriftelijk verzoek kan de minister deze termijn eenmalig verlengen.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel9
  - number: '9.3'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel9
  - number: 9.3.a
    text: |-
      de ten behoeve van de uitvoering van het kennisoverdrachtproject bij de kennisinstelling ingeleverde grote
      innovatievouchers of kleine innovatievoucher;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel9
  - number: 9.3.b
    text: |-
      een kopie van de factuur die de kennisinstelling in verband met het kennisoverdrachtproject aan de ondernemer heeft
      verstuurd, overeenkomstig hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel9
  - number: '10'
    text: |-
      De minister geeft een beschikking, inhoudende de subsidievaststelling, binnen dertien weken na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel10
  - number: '11'
    text: |-
      De minister beslist afwijzend op een aanvraag indien de aanvraag niet voldoet aan deze regeling, dan wel indien op
      de overgelegde voucher is vermeld, dat zij zal worden gebruikt voor subsidiëring krachtens [paragraaf 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019805
        paragraaf: '4'
  - number: '12.1'
    text: |-
      De ondernemer wendt geen grote of kleine innovatievoucher aan voor een kennisoverdrachtproject waarvoor reeds door
      een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie is verstrekt of dat deel uitmaakt van
      een project of programma waarvoor reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen
      subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel12
  - number: '12.2'
    text: |-
      De minister kan bij de subsidievaststelling verplichtingen opleggen met betrekking tot het verlenen van medewerking
      door de subsidie-ontvanger aan een evaluatie van de toepassing van deze regeling.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel12
  - number: '13.1'
    text: |-
      De ondernemer aan wie op grond van [paragraaf 2][ref1] een voucher is verstrekt, kan deze ook gebruiken ten behoeve
      van een subsidie in de kosten van het aanvragen en verkrijgen van een octrooi, indien dat doel bij de aanvraag is
      aangegeven en op de voucher is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019805
        paragraaf: '2'
  - number: '13.2'
    text: |-
      De subsidie wordt, onder overlegging van de voucher, binnen een jaar nadat de voucher aan de ondernemer is
      verstrekt, bij de Minister aangevraagd, met gebruikmaking van een formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019805
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019805
  - number: '13.3'
    text: |-
      De aanvraag gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van een kopie van facturen die
      een persoon, die krachtens [artikel 23b van de Rijksoctrooiwet][ref1] of artikel 134, eerste lid, van het Europees
      Octrooiverdrag, bevoegd is als gemachtigde op te treden, of een tot octrooiverlening bevoegde autoriteit aan de
      ondernemer heeft verstuurd in verband met de octrooiaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23b
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23b
  - number: '13.4'
    text: |-
      Indien een grote innovatievoucher wordt overgelegd bedraagt de subsidie tweederde deel van het bedrag dat de
      gemachtigde of octrooiverlenende autoriteit als bedoeld in het derde lid blijkens de factuur aan de ondernemer in
      rekening heeft gebracht, exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 5000 dan
      wel het krachtens [artikel 2, vierde lid][ref1], op de voucher vermelde bedrag. Indien een kleine innovatievoucher
      wordt overgelegd bedraagt de subsidie het factuurbedrag, exclusief eventueel in rekening te brengen omzetbelasting,
      maar niet meer dan € 2500 dan wel het krachtens [artikel 2, vierde lid][ref2], op de voucher vermelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0019805#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019805#Artikel2
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019805
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019805
        artikel: '2'
        paragraaf: '2'
  - number: '13.5'
    text: |-
      De Minister geeft een beschikking, inhoudende de subsidievaststelling, binnen dertien weken na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
  - number: '13.6'
    text: 'Geen subsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
  - number: 13.6.a
    text: indien reeds eerder met gebruikmaking van een voucher subsidie is verstrekt krachtens deze paragraaf;
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
  - number: 13.6.b
    text: voor zover de gefactureerde kosten reeds vóór de afgiftedatum van de innovatievoucher zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel13
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling innovatievouchers.'
    url: https://wetten.overheid.nl/BWBR0019805/2008-03-20#Artikel15
