preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen aan te brengen in de wetgeving van
    het Ministerie van Sociale Zaken en Werkgelegenheid en enkele andere ministeries;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044455/2021-01-01#ArtikelAanhef
articles:
  - number: XXI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met uitzondering van
      [artikel II][ref1], dat in werking treedt met ingang van de dag na de datum van uitgifte van het Staatsblad waarin
      deze wet wordt geplaatst en terugwerkt tot en met 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0044455#ArtikelII
    url: https://wetten.overheid.nl/BWBR0044455/2021-01-01#ArtikelXXI
    references:
      - id: ref1
