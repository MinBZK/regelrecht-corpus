valid_from: '2007-04-01'
bwb_id: BWBR0005181
url: https://wetten.overheid.nl/BWBR0005181/2007-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is mede uit het oogpunt van vereenvoudiging en
    vermindering van regelgeving, alsmede uit het oogpunt van decentralisatie nieuwe voorschriften te geven omtrent het
    bouwen en de volkshuisvesting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.a
    text: |-
      bouwen: het plaatsen, het geheel of gedeeltelijk oprichten, vernieuwen of veranderen en het vergroten van
      een bouwwerk, alsmede het geheel of gedeeltelijk oprichten, vernieuwen of veranderen en het vergroten van een
      standplaats;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.b
    text: 'slopen: het afbreken van een bouwwerk of een gedeelte daarvan;'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.c
    text: |-
      gebouw: elk bouwwerk, dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.d
    text: |-
      woonkeet: een loods, keet of ander soortgelijk bouwwerk, bestemd om te voorzien in een tijdelijke behoefte aan
      woongelegenheid;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.e
    text: |-
      woonwagen: voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen kan
      worden verplaatst;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.f
    text: |-
      bestemmingsplan: een bestemmingsplan als bedoeld in de Wet op de Ruimtelijke Ordening dan wel een
      stadsvernieuwingsplan als bedoeld in de Wet op de stads- en dorpsvernieuwing;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.g
    text: |-
      rooilijn: de lijn die, behoudens toegelaten afwijkingen, bij het bouwen aan de wegzijde of aan de van de weg
      afgekeerde zijde niet mag worden overschreden;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.h
    text: |-
      standplaats: een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.i
    text: |-
      norm: een document, uitgegeven door een deskundig, onafhankelijk instituut, waarin wordt omschreven aan welke eisen
      een bouwmateriaal, bouwdeel of bouwconstructie moet voldoen dan wel waarin een omschrijving wordt gegeven van een
      keurings-, meet- of berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.j
    text: |-
      kwaliteitsverklaring: een schriftelijk bewijs, voorzien van een merkteken, aangewezen door Onze Minister, afgegeven
      door een deskundig, onafhankelijk instituut, aangewezen door Onze Minister, op grond waarvan een bouwmateriaal,
      bouwdeel of samenstel van bouwmaterialen of bouwdelen dan wel een bouwwijze, indien dat bouwmateriaal, bouwdeel
      of samenstel van bouwmaterialen of bouwdelen dan wel die bouwwijze bij het bouwen wordt toegepast, wordt geacht te
      voldoen aan krachtens deze wet aan dat bouwmateriaal, bouwdeel of samenstel van bouwmaterialen of bouwdelen dan wel
      die bouwwijze gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.k
    text: |-
      aansluitvoorwaarden: door representatieve organisaties van openbare nutsbedrijven, van andere instellingen of van
      gemeenten opgestelde voorschriften waaraan moet worden voldaan, opdat een woning of gebouw kan worden aangesloten
      op het leidingnet van die bedrijven, instellingen of gemeenten;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.l
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.m
    text: 'inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.n
    text: |-
      toegelaten instelling: instelling als bedoeld in [artikel 70][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
  - number: 1.1.o
    text: |-
      fonds: Centraal Fonds voor de Volkshuisvesting, bedoeld in [artikel 71][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '71'
        hoofdstuk: V
        afdeling: 3A
  - number: 1.1.p
    text: |-
      reguliere bouwvergunning: bouwvergunning als bedoeld in [artikel 44, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1.1.q
    text: |-
      lichte bouwvergunning: bouwvergunning als bedoeld in [artikel 44][ref1], derde juncto eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1.1.r
    text: |-
      welstandscommissie: door de gemeenteraad benoemde onafhankelijke commissie die aan burgemeester en wethouders
      advies uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk of standplaats,
      waarvoor een aanvraag om bouwvergunning is ingediend, in strijd is met redelijke eisen van welstand;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1.1.s
    text: |-
      stadsbouwmeester: door de gemeenteraad benoemde onafhankelijke deskundige die aan burgemeester en wethouders advies
      uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk of standplaats, waarvoor een
      aanvraag om bouwvergunning is ingediend, in strijd is met redelijke eisen van welstand.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder woning mede verstaan een afzonderlijk
      gedeelte van een gebouw, welk gedeelte tot bewoning is bestemd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1
  - number: 1a.1
    text: |-
      De eigenaar van een bouwwerk, standplaats, open erf of terrein of degene die uit anderen hoofde bevoegd is tot
      het daaraan treffen van voorzieningen draagt er zorg voor dat als gevolg van de staat van dat bouwwerk, die
      standplaats, dat open erf of terrein geen gevaar voor de gezondheid of veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1a
  - number: 1a.2
    text: |-
      Een ieder die een bouwwerk of standplaats bouwt, gebruikt, laat gebruiken of sloopt, dan wel een open erf of
      terrein gebruikt of laat gebruiken, draagt er, voor zover dat in diens vermogen ligt, zorg voor dat als gevolg van
      dat bouwen, gebruik of slopen geen gevaar voor de gezondheid of veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1a
  - number: 1b.1
    text: |-
      Tenzij een bouwvergunning als bedoeld in [artikel 40][ref1] het uitdrukkelijk toestaat, is het verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1b.1.a
    text: |-
      een gebouw te bouwen, voor zover daarbij niet wordt voldaan aan de op dat bouwen van toepassing zijnde
      voorschriften, bedoeld in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.1.b
    text: |-
      een bouwwerk, niet zijnde een gebouw, te bouwen, voor zover daarbij niet wordt voldaan aan de op dat bouwen van
      toepassing zijnde voorschriften, bedoeld in [artikel 2, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.1.c
    text: |-
      een standplaats te bouwen, voor zover daarbij niet wordt voldaan aan de op dat bouwen van toepassing zijnde
      voorschriften, bedoeld in [artikel 2, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.2
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
  - number: 1b.2.a
    text: |-
      een bestaand gebouw in een staat te brengen, te laten komen of te houden die niet voldoet aan de op de staat van
      dat gebouw van toepassing zijnde voorschriften, bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.2.b
    text: |-
      een bestaand bouwwerk, niet zijnde een gebouw, in een staat te brengen, te laten komen of te houden
      die niet voldoet aan de op de staat van dat bouwwerk van toepassing zijnde voorschriften, bedoeld in
      [artikel 2, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.2.c
    text: |-
      een bestaande standplaats in een staat te brengen, te laten komen of te houden die niet voldoet aan de op de staat
      van die standplaats van toepassing zijnde voorschriften, bedoeld in [artikel 2, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.3
    text: |-
      Tenzij een bouwvergunning als bedoeld in [artikel 40][ref1] het uitdrukkelijk toestaat, is het verboden een gebouw,
      bouwwerk, niet zijnde een gebouw, of standplaats, dan wel deel daarvan, in stand te laten voor zover bij het bouwen
      daarvan niet is voldaan aan de op dat bouwen van toepassing zijnde voorschriften, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
  - number: '2.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden uit het oogpunt van veiligheid, gezondheid, bruikbaarheid,
      energiezuinigheid en milieu technische voorschriften gegeven omtrent het bouwen van woningen, woonketen, woonwagens
      en andere gebouwen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '2.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt van
      veiligheid, gezondheid en bruikbaarheid voorschriften gegeven omtrent de staat van bestaande woningen, woonketen en
      woonwagens en van bestaande andere gebouwen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt van
      veiligheid, gezondheid en milieu technische voorschriften gegeven omtrent het bouwen van bouwwerken, geen gebouw
      zijnde.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '2.4'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt van
      veiligheid en gezondheid technische voorschriften gegeven omtrent de staat van bestaande bouwwerken, geen gebouw
      zijnde.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '2.5'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt
      van veiligheid, gezondheid, bruikbaarheid en milieu technische voorschriften gegeven omtrent het bouwen van
      standplaatsen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '2.6'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt
      van veiligheid, gezondheid en bruikbaarheid technische voorschriften gegeven omtrent de staat van bestaande
      standplaatsen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '2.7'
    text: Aan een voorschrift omtrent het bouwen van een bouwwerk of standplaats kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '2.8'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid, treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel2
  - number: '3'
    text: |-
      Bij of krachtens de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur kan worden verwezen naar:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 3.a
    text: normen of delen van normen en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel3
  - number: 3.b
    text: kwaliteitsverklaringen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel3
  - number: '4'
    text: |-
      Indien een bouwwerk of standplaats gedeeltelijk wordt vernieuwd, veranderd of vergroot, zijn de voorschriften,
      bedoeld in [artikel 2][ref1], voor zover zij betrekking hebben op dat bouwen, slechts van toepassing op die
      vernieuwing, verandering of vergroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '5'
    text: |-
      Op de voordracht van Onze Minister wordt de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur in
      overeenstemming gebracht met technische voorschriften omtrent het bouwen, die zijn of worden gegeven bij of
      krachtens een andere algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '6.1'
    text: |-
      Bij een voorschrift, gegeven bij of krachtens de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur,
      kan worden bepaald dat burgemeester en wethouders van dat voorschrift ontheffing kunnen verlenen tot een bij dat
      voorschrift aangegeven niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '6.2'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid, mogen slechts voorwaarden worden verbonden ter bescherming van de
      belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister kan op verzoek van een aanvrager om bouwvergunning, bedoeld in [artikel 40, eerste lid][ref1], in
      bijzondere gevallen ontheffing verlenen van de bij of krachtens de in [artikel 2][ref2] bedoelde algemene maatregel
      van bestuur gegeven voorschriften, met dien verstande dat, indien het verzoek betrekking heeft op voorschriften als
      bedoeld in [artikel 5][ref3], hij de ontheffing slechts kan verlenen in overeenstemming met het bij of krachtens de
      desbetreffende wet daartoe bevoegd verklaarde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, gaat vergezeld van een verklaring van burgemeester en wethouders, dat
      zij de desbetreffende bouwvergunning zullen verlenen indien ontheffing als bedoeld in dat lid, is verkregen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
  - number: '7.3'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid, mogen slechts voorwaarden worden verbonden ter bescherming van de
      belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
  - number: '7.4'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking van de beslissing op een verzoek als bedoeld in het
      eerste lid, doet Onze Minister daarvan mededeling aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
  - number: '7.5'
    text: |-
      De verlening van de verklaring, bedoeld in het tweede lid, en de verlening van ontheffing, bedoeld in het eerste
      lid, worden geacht voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1]
      deel uit te maken van de beschikking waarop zij betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '7.6'
    text: |-
      In een geval als bedoeld in het eerste lid, dat betrekking heeft op een tunnel in het trans-Europese wegennet die
      langer is dan 500 meter kan Onze Minister de in het eerste lid bedoelde ontheffing slechts verlenen indien dat
      noodzakelijk is voor het toepassen van innovatieve veiligheidsvoorzieningen of innovatieve veiligheidsprocedures,
      en de in artikel 14 van [richtlijn nr. 2004/54/EG](32004L0054) van het Europees parlement en de Raad van de
      Europese Unie van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in het trans-Europese wegennet (PbEU
      L 167, gerectificeerd in PbEU L 201) voorgeschreven procedure is doorlopen en op grond daarvan van rechtswege
      toestemming is verkregen of door de Europese Commissie toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
  - number: '7.7'
    text: |-
      In een geval als bedoeld in het zesde lid verzoekt de tunnelbeheerder, bedoeld in de
      [Wet aanvullende regels veiligheid wegtunnels][ref1], aan Onze Minister om de ontheffing als bedoeld in het eerste
      lid niet te verlenen dan nadat het voornemen daartoe aan de Europese Commissie is voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019516
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019516
  - number: '7.8'
    text: |-
      Het eerste, derde, vierde, zesde en zevende lid zijn van overeenkomstige toepassing indien voor het bouwen geen
      bouwvergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7
  - number: 7a.1
    text: |-
      Onze Minister kan met het oog op duurzaam bouwen in een bijzonder geval burgemeester en wethouders toestaan door
      hun voorgestelde nadere voorschriften op te leggen ter voldoening aan de technische voorschriften, gegeven bij of
      krachtens de algemene maatregel van bestuur, bedoeld in [artikel 2][ref1]. Dit toestaan kan ook betrekking hebben
      op door burgemeester en wethouders voorgestelde, uit het oogpunt van milieu op te leggen technische voorschriften,
      waarin de algemene maatregel van bestuur, bedoeld in [artikel 2][ref2], niet voorziet. Een verzoek van burgemeester
      en wethouders geschiedt mede aan de hand van een door Onze Minister ter beschikking gesteld formulier. Het verzoek,
      alsmede de daarbij voorgestelde op te leggen voorschriften zijn gemotiveerd en van een toelichting voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 7a.2
    text: |-
      Onze Minister beslist binnen acht weken na ontvangst van een verzoek om toestemming. Hij kan die beslissing eenmaal
      voor ten hoogste vier weken verdagen. Indien toestemming wordt verleend, geldt die toestemming alleen voor het
      geval waarop het verzoek betrekking heeft. Aan een toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7a
  - number: 7a.3
    text: 'De toestemming op een verzoek van burgemeester en wethouders is van rechtswege verleend indien Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7a
  - number: 7a.3.a
    text: niet binnen acht weken na ontvangst van het verzoek een beslissing op dat verzoek heeft genomen,
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7a
  - number: 7a.3.b
    text: |-
      niet binnen acht weken na ontvangst van het verzoek van burgemeester en wethouders heeft besloten de beslissing op
      dat verzoek te verdagen, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7a
  - number: 7a.3.c
    text: |-
      niet binnen de termijn waarmee de beslissing op het verzoek van burgemeester en wethouders is verdaagd, een
      beslissing op dat verzoek heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7a
  - number: 7b.1
    text: |-
      Tenzij een bouwvergunning als bedoeld in [artikel 40][ref1] het uitdrukkelijk toestaat, is het verboden te
      bouwen, voor zover daarbij niet wordt voldaan aan de op dat bouwen van toepassing zijnde voorschriften, bedoeld
      in [artikel 8, tweede lid, onderdelen c en g, en vijfde lid][ref2], met dien verstande dat voorschriften van
      stedenbouwkundige aard als bedoeld in dat vijfde lid niet van toepassing zijn op het bouwen waarvoor op grond van
      [artikel 43][ref3] geen bouwvergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
  - number: 7b.2
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
  - number: 7b.2.a
    text: |-
      een bouwwerk of standplaats te gebruiken of te laten gebruiken, anders dan in overeenstemming met de op dat gebruik
      van toepassing zijnde voorschriften, bedoeld in [artikel 8, tweede lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.2.b
    text: |-
      een open erf of terrein te gebruiken of te laten gebruiken, anders dan in overeenstemming met de op dat gebruik van
      toepassing zijnde voorschriften, bedoeld in [artikel 8, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.2.c
    text: |-
      een open erf of terrein in een staat te brengen, te laten komen of te houden die niet voldoet aan de op de staat
      van dat open erf of terrein van toepassing zijnde voorschriften, bedoeld in artikel 8, tweede lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
  - number: 7b.2.d
    text: |-
      te slopen, tenzij daarbij wordt voldaan aan de op dat slopen van toepassing zijnde voorschriften, bedoeld in
      [artikel 8, tweede lid, onderdeel d en g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.3
    text: |-
      Een verbod als bedoeld in het eerste of tweede lid heeft mede betrekking op het niet voldoen aan de voorschriften
      met betrekking tot het bouwen, het gebruik, de staat of het slopen van een bouwwerk, bedoeld in:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
  - number: 7b.3.a
    text: |-
      [artikel 8, zevende lid][ref1], voor zover deze voorschriften in de bouwverordening zijn opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.3.b
    text: |-
      [artikel 8, achtste lid][ref1], indien en voor zover deze voorschriften op grond van het negende lid van dat
      artikel rechtstreeks gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.4
    text: |-
      Tenzij een bouwvergunning als bedoeld in [artikel 40][ref1] het uitdrukkelijk toestaat, is het verboden een
      bouwwerk, standplaats dan wel deel daarvan in stand te laten voor zover bij het bouwen daarvan niet is voldaan aan
      de op dat bouwen van toepassing zijnde voorschriften, bedoeld in het eerste of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
  - number: '8.1'
    text: |-
      De gemeenteraad stelt een bouwverordening vast, die uitsluitend de voorschriften, bedoeld in het tweede tot en met
      zesde lid, bevat.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: '8.2'
    text: 'De bouwverordening bevat voorschriften omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.a
    text: |-
      het gebruik van woningen, woonketen, woonwagens, andere gebouwen, bouwwerken, geen gebouwen zijnde, en
      standplaatsen, waaronder in elk geval zijn begrepen voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.a.1°
    text: de beschikbaarheid van drinkwater en energie;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.a.2°
    text: de reinheid;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.a.3°
    text: het bestrijden van schadelijk of hinderlijk gedierte;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.a.4°
    text: de brandveiligheid en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.a.5°
    text: |-
      voor zover het woningen, woonketen of woonwagens betreft, het aantal personen dat in een dergelijk gebouw mag
      wonen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.b
    text: het gebruik van open erven en terreinen en de staat, waarin deze zich moeten bevinden;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.c
    text: het tegengaan van bouwen op verontreinigde bodem;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.d
    text: het slopen, waaronder begrepen voorschriften omtrent selectief slopen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.e
    text: |-
      de wijze van inrichting en indiening van een aanvraag om woonvergunning als bedoeld in [artikel 60][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel60
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '60'
        hoofdstuk: IV
        afdeling: '2'
  - number: 8.2.f
    text: |-
      de overdraagbaarheid van een bouwvergunning als bedoeld in [artikel 40, eerste lid][ref1], en van een
      woonvergunning als bedoeld in [artikel 60][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel60
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '60'
        hoofdstuk: IV
        afdeling: '2'
  - number: 8.2.g
    text: |-
      het uitvoeren van bouw- of sloopwerkzaamheden, waaronder in elk geval zijn begrepen voorschriften met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.g.1°
    text: de veiligheid op de bouw- of sloopplaats;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.g.2°
    text: de tijdstippen waarop met het bouwen of het slopen mag worden en wordt begonnen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.g.3°
    text: |-
      de tijdstippen waarop met het bouwen of het slopen moet zijn begonnen en het bouwen of het slopen moet zijn
      beëindigd, alsmede de wijze van gereedmelding van het bouwen of het slopen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.g.4°
    text: de termijn gedurende welke het bouwen of het slopen ten hoogste mag stilliggen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.g.5°
    text: bescheiden die op de bouw- of sloopplaats aanwezig moeten zijn;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.g.6°
    text: |-
      opmetingen, ontgravingen, opbrekingen en onderzoekingen, die met betrekking tot het bouwen of het slopen
      noodzakelijk zijn en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.2.g.7°
    text: |-
      het tijdstip en de wijze van overleggen van kwaliteitsverklaringen en van nadere gegevens met betrekking tot de
      installaties voor drinkwater en energie.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: '8.3'
    text: 'De voorschriften, bedoeld in het tweede lid, onderdeel c, hebben uitsluitend betrekking op bouwwerken:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.3.a
    text: waarin voortdurend of nagenoeg voortdurend mensen zullen verblijven,
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.3.b
    text: |-
      voor het bouwen waarvan een reguliere bouwvergunning is vereist, met uitzondering van bouwwerken die naar aard en
      omvang gelijk zijn aan een bouwwerk voor het bouwen waarvan op grond van [artikel 43][ref1] geen bouwvergunning is
      vereist of een geval als bedoeld in [artikel 44, tweede lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 8.3.c.1°
    text: die de grond raken, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.3.c.2°
    text: ten aanzien waarvan het bestaande, niet-wederrechtelijke gebruik niet wordt gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: '8.4'
    text: 'De voorschriften, bedoeld in het tweede lid, onderdeel c, hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.4.a
    text: het verrichten van onderzoek naar aard en mate van verontreiniging van de bodem;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.4.b
    text: aard en omvang van het onderzoek, en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.4.c
    text: inrichting van het op te stellen onderzoeksrapport.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: '8.5'
    text: |-
      De bouwverordening kan voorschriften bevatten van stedenbouwkundige aard. Tot die voorschriften kunnen behoren
      voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.5.a
    text: de wegen waaraan mag worden gebouwd;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.5.b
    text: de rooilijnen, en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: 8.5.c
    text: de plaatsing van bouwwerken ten opzichte van elkaar, mede uit het oogpunt van bereikbaarheid van die bouwwerken.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: '8.6'
    text: |-
      De bouwverordening bevat tevens voorschriften omtrent de samenstelling, inrichting en werkwijze van de
      welstandscommissie. Zij kan bepalen dat er in plaats van een welstandscommissie een stadsbouwmeester
      wordt aangesteld, in welk geval de bouwverordening voorschriften bevat over de rol en de functie van de
      stadsbouwmeester. Voorts kan de bouwverordening nadere voorschriften bevatten omtrent de verslagen, bedoeld in de
      [artikelen 12b, derde lid][ref1], en [46, achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12b
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '8.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in de bouwverordening voorschriften worden gegeven
      omtrent andere onderwerpen dan die, genoemd in het tweede, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: '8.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bevordering van eenheid in de bouwverordeningen regelen worden
      gegeven omtrent de inhoud van de voorschriften, bedoeld in het tweede tot en met vierde, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
  - number: '8.9'
    text: |-
      De gemeenteraad brengt binnen een jaar na het in werking treden van de krachtens het achtste lid en de krachtens
      [artikel 120][ref1] gegeven voorschriften de bouwverordening met die voorschriften in overeenstemming. Zolang de
      bouwverordening niet met die voorschriften in overeenstemming is gebracht, gelden die voorschriften rechtstreeks.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: '9.1'
    text: |-
      Voor zover de voorschriften van de bouwverordening niet overeenstemmen met de voorschriften van het desbetreffende
      bestemmingsplan blijven eerstbedoelde voorschriften buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel9
  - number: '9.2'
    text: |-
      De voorschriften van de bouwverordening blijven van toepassing indien het desbetreffende bestemmingsplan geen
      voorschriften bevat, die hetzelfde onderwerp regelen, tenzij het desbetreffende bestemmingsplan anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel9
  - number: '10'
    text: |-
      De in de bouwverordening vervatte voorschriften omtrent de rooilijnen en de plaatsing van bouwwerken ten opzichte
      van elkaar zijn niet van toepassing op het gedeeltelijk vernieuwen of veranderen van een bouwwerk, voor zover het
      te vernieuwen of veranderen gedeelte van dat bouwwerk overeenkomstig het destijds geldende recht in afwijking van
      die voorschriften tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel10
  - number: '11.1'
    text: |-
      Bij een in de bouwverordening gegeven voorschrift kan worden bepaald, dat burgemeester en wethouders bevoegd zijn
      van dat voorschrift ontheffing te verlenen, tenzij het een voorschrift betreft waarmee de bouwverordening krachtens
      [artikel 8, negende lid][ref1], in overeenstemming is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '11.2'
    text: |-
      Bij een in de algemene maatregel van bestuur, bedoeld in [artikel 8, achtste lid][ref1], gegeven voorschrift kan
      worden bepaald, dat burgemeester en wethouders bevoegd zijn ontheffing te verlenen van dat voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '11.3'
    text: |-
      Aan een ontheffing als bedoeld in het eerste of tweede lid, mogen slechts voorwaarden worden verbonden ter
      bescherming van de belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel11
  - number: '12.1'
    text: 'Het uiterlijk van:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12
  - number: 12.1.a
    text: |-
      een bestaand bouwwerk, met uitzondering van een tijdelijk bouwwerk als bedoeld in [artikel 45, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
  - number: 12.1.b
    text: een bestaande standplaats,
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12
  - number: 12.1.c
    text: |-
      een te bouwen bouwwerk voor het bouwen waarvan op grond van [artikel 43][ref1] geen bouwvergunning is vereist,


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
  - number: '12.2'
    text: |-
      De gemeenteraad kan besluiten dat, in afwijking van het eerste lid en [artikel 44, eerste lid, onderdeel d][ref1],
      voor een daarbij aan te wijzen gebied of voor een of meer daarbij aan te wijzen categorieën van bestaande en te
      bouwen bouwwerken of standplaatsen geen redelijke eisen van welstand van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: '12.3'
    text: |-
      Voor zover de toepassing van de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], leidt tot strijd
      met het bestemmingsplan of met in de bouwverordening opgenomen voorschriften van stedenbouwkundige aard, blijven
      die criteria buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '12.4'
    text: |-
      De gemeenteraad betrekt de ingezetenen van de gemeente en belanghebbenden bij de voorbereiding van
      besluiten als bedoeld in het tweede lid, onderdelen a en b, op de wijze voorzien in de krachtens
      [artikel 150 van de Gemeentewet][ref1] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: 12a.1
    text: |-
      De gemeenteraad stelt een welstandsnota vast, inhoudende beleidsregels waarin in ieder geval de criteria zijn
      opgenomen die burgemeester en wethouders toepassen bij hun beoordeling:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
  - number: 12a.1.a
    text: |-
      of het uiterlijk en de plaatsing van een bouwwerk of standplaats, waarop de aanvraag om bouwvergunning betrekking
      heeft, met uitzondering van een tijdelijk bouwwerk als bedoeld in [artikel 45, eerste lid][ref1], zowel op zichzelf
      beschouwd als in verband met de omgeving of de te verwachten ontwikkeling daarvan, in strijd zijn met redelijke
      eisen van welstand;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
  - number: 12a.1.b
    text: 'of het uiterlijk van:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
  - number: 12a.1.b.1°
    text: |-
      een bestaand bouwwerk, met uitzondering van een tijdelijk bouwwerk als bedoeld in [artikel 45, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
  - number: 12a.1.b.2°
    text: een bestaande standplaats,
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
  - number: 12a.1.b.3°
    text: |-
      een te bouwen bouwwerk voor het bouwen waarvan op grond van [artikel 43][ref1] geen bouwvergunning is vereist,


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
  - number: 12a.2
    text: |-
      [Artikel 12, vierde lid][ref1], is van overeenkomstige toepassing op de vaststelling of wijziging van de
      welstandsnota.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12a.3
    text: |-
      De criteria, bedoeld in het eerste lid, zijn zoveel mogelijk toegesneden op de onderscheidene categorieën
      bouwwerken en standplaatsen. De criteria kunnen verschillen naargelang de plaats waar een bouwwerk of standplaats
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
  - number: 12a.4
    text: |-
      Ter bevordering van de eenheid in welstandsnota's kunnen bij algemene maatregel van bestuur voorschriften worden
      gegeven omtrent categorieën van bouwwerken en standplaatsen als bedoeld in het derde lid en de daarop toe te passen
      criteria.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
  - number: 12a.5
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het vierde lid treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12a
  - number: 12b.1
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester baseert haar onderscheidenlijk zijn advies slechts op de
      criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], doch betrekt daarbij, indien van toepassing, het
      bepaalde in [artikel 12, derde lid][ref2]. De adviezen van de welstandscommissie dan wel de stadsbouwmeester zijn
      openbaar. Een advies van de welstandscommissie dan wel de stadsbouwmeester inhoudende dat een bouwplan in strijd is
      met redelijke eisen van welstand, wordt schriftelijk uitgebracht en deugdelijk gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.2
    text: |-
      De door de welstandscommissie of stadsbouwmeester gehouden vergaderingen zijn openbaar.
      Een vergadering of gedeelte daarvan is niet openbaar in gevallen als bedoeld in
      [artikel 10, eerste lid, van de Wet openbaarheid van bestuur][ref1] en in gevallen waarin het belang van
      openbaarheid niet opweegt tegen de in [artikel 10, tweede lid, van die wet][ref2] genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 12b.3
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester legt de gemeenteraad eenmaal per jaar een verslag
      voor van de door haar onderscheidenlijk hem verrichte werkzaamheden. In het verslag wordt ten minste
      uiteengezet op welke wijze zij onderscheidenlijk hij toepassing heeft gegeven aan de criteria, bedoeld in
      [artikel 12a, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.4
    text: |-
      Een voorzitter of ander lid van een welstandscommissie kan voor een termijn van ten hoogste drie jaar worden
      benoemd in een welstandscommissie die in de betreffende gemeente werkzaam is. Zij kunnen eenmaal voor een
      termijn van ten hoogste drie jaar worden herbenoemd in dezelfde commissie. De eerste en tweede volzin zijn van
      overeenkomstige toepassing op de stadsbouwmeester.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12b
  - number: 12c
    text: |-
      Burgemeester en wethouders leggen de gemeenteraad eenmaal per jaar een verslag voor waarin zij ten minste
      uiteenzetten:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12c
  - number: 12c.a
    text: op welke wijze zij zijn omgegaan met de adviezen van de welstandscommissie dan wel de stadsbouwmeester;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12c
  - number: 12c.b
    text: |-
      in welke categorieën van gevallen zij de aanvraag voor een lichte bouwvergunning niet aan de welstandscommissie dan
      wel de stadsbouwmeester hebben voorgelegd en op welke wijze zij in die gevallen zelf toepassing hebben gegeven aan
      de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 12c.c
    text: |-
      in welke gevallen waarin niet is of wordt voldaan aan [artikel 12, eerste lid][ref1], zij zijn overgegaan tot
      toepassing van bestuursdwang of oplegging van een last onder dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: '13'
    text: |-
      Burgemeester en wethouders kunnen, indien dit naar hun oordeel noodzakelijk is, degene die als
      eigenaar van een gebouw, bouwwerk, niet zijnde een gebouw, of standplaats, dan wel uit anderen
      hoofde bevoegd is tot het daaraan treffen van voorzieningen, verplichten tot het binnen een door
      hen te bepalen termijn treffen van zodanige voorzieningen, dat de staat van dat gebouw, dat bouwwerk
      of die standplaats nadien komt te liggen op een niveau dat hoger is dan het niveau dat overeenkomt
      met de voorschriften, bedoeld in [artikel 1b, tweede lid, onderdeel a, b, respectievelijk c][ref1],
      zonder dat deze hoger komt te liggen dan het niveau dat overeenkomt met de voorschriften, bedoeld in
      [artikel 1b, eerste lid, onderdeel a, b, respectievelijk c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
  - number: 13a
    text: |-
      Indien niet wordt voldaan aan [artikel 12, eerste lid][ref1], kunnen burgemeester en wethouders, tenzij toepassing
      is gegeven aan het tweede lid van dat artikel, degene die als eigenaar van een bouwwerk of standplaats dan wel
      uit anderen hoofde bevoegd is tot het treffen van voorzieningen daaraan, verplichten tot het binnen een door hen
      te bepalen termijn treffen van zodanige door hen daarbij aan te geven voorzieningen, dat nadien wordt voldaan aan
      [artikel 12, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: '14.1'
    text: |-
      Indien een gebouw, een open erf of een terrein op grond van [artikel 97][ref1], dan wel een gebouw op grond
      van [artikel 174a van de Gemeentewet][ref2], een verordening als bedoeld in [artikel 174 van die wet][ref3] of
      [artikel 13b van de Opiumwet][ref4] is gesloten, kan bij besluit van burgemeester en wethouders degene die als
      eigenaar of uit anderen hoofde bevoegd is tot het in gebruik geven van dat gebouw, worden verplicht om naar hun
      keuze het gebouw binnen een daarbij te bepalen termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '97'
        hoofdstuk: VI
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 174a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '174'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: 13b
  - number: 14.1.a
    text: |-
      in gebruik te geven aan een andere persoon dan degene die als gevolg van de sluiting het gebruik van het gebouw
      heeft moeten staken, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: 14.1.b
    text: |-
      in beheer te geven aan een persoon, die uit hoofde van beroep of bedrijf op het terrein van de huisvesting werkzaam
      is, of aan een op dat terrein werkzame instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: '14.2'
    text: 'Burgemeester en wethouders kunnen in hun besluit:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: 14.2.a
    text: |-
      personen of instellingen als bedoeld in het eerste lid, onderdelen a en b, noemen uit welke degene tot wie het
      besluit is gericht een keuze moet maken, of, indien dit naar het oordeel van burgemeester en wethouders niet
      mogelijk is, een persoon of instelling als hier bedoeld noemen aan wie het gebouw binnen een daarbij aangegeven
      termijn en op een daarbij aangegeven wijze in gebruik dan wel in beheer moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: 14.2.b
    text: |-
      indien het gebouw, al dan niet met het bijbehorende erf, noodzakelijke voorzieningen behoeft om weer op redelijke
      wijze tot bewoning of gebruik te kunnen dienen, degene die als eigenaar of uit anderen hoofde tot het treffen van
      die voorzieningen bevoegd is, ertoe verplichten om binnen een door hen te bepalen termijn de door hen aan te geven
      voorzieningen te treffen, en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: 14.2.c
    text: zo nodig, andere voorwaarden aan de uitvoering van het besluit stellen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: '14.3'
    text: |-
      Indien het eerste lid, onderdeel b, van toepassing is stellen burgemeester en wethouders een beheersvergoeding
      vast. De in dat onderdeel bedoelde persoon of instelling stelt na overleg met degene tot wie het in dat lid
      bedoelde besluit is gericht, de huurprijs vast op een bedrag dat redelijk is in het economische verkeer en stelt de
      ontvangen huurprijs, na aftrek van de beheersvergoeding, ter beschikking van degene tot wie dat besluit is gericht.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: '14.4'
    text: |-
      Een in het eerste lid, onderdeel a of b, bedoelde persoon of instelling die het gebruik of beheer van het gebouw
      heeft beëindigd, doet daarvan binnen veertien dagen na de dag van beëindiging mededeling aan burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: '14.5'
    text: |-
      Onder beheer wordt in dit artikel verstaan het in gebruik geven van een gebouw en het daarna verrichten van al
      die handelingen met betrekking tot dat gebouw die volgens het burgerlijk recht tot de verantwoordelijkheid van een
      eigenaar behoren.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14
  - number: 14a
    text: |-
      Degene, tot wie een besluit als bedoeld in [artikel 13][ref1], [13a][ref2] of [14, eerste lid][ref3], is gericht,
      of zijn rechtsopvolger en iedere verdere rechtsopvolger, is verplicht daaraan te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Burgemeester en wethouders kunnen gelijktijdig met een besluit als bedoeld in [artikel 13][ref1], [13a][ref2]
      of [14, eerste lid][ref3], besluiten tot toepassing van bestuursdwang of oplegging van een last onder dwangsom,
      gericht op naleving van het eerstgenoemde besluit. In dat geval worden beide besluiten gelijktijdig bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '15.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid maakt het besluit tot toepassing van bestuursdwang of
      oplegging van een last onder dwangsom, wat betreft de mogelijkheid van bezwaar en beroep, deel uit van het in
      [artikel 13][ref1], [13a][ref2] of [14, eerste lid][ref3], bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '16'
    text: |-
      Degene die als eigenaar van een woning of uit anderen hoofde daartoe bevoegd is, treft de voorzieningen waarvoor
      ingevolge de [Wet maatschappelijke ondersteuning][ref1] geldelijke steun is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020031
  - number: '40.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40
  - number: 40.1.a
    text: te bouwen zonder of in afwijking van een door burgemeester en wethouders verleende bouwvergunning,
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40
  - number: 40.1.b
    text: |-
      een bouwwerk, standplaats of deel daarvan dat is gebouwd zonder of in afwijking van een door burgemeester en
      wethouders verleende bouwvergunning, in stand te laten,
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40
  - number: '40.2'
    text: |-
      Ingeval een caravan als bedoeld in [artikel 1, eerste lid, onderdeel c, van de Wet op de openluchtrecreatie][ref1]
      is aan te merken als een bouwwerk, is niettemin voor het plaatsen daarvan geen bouwvergunning vereist in de
      gevallen, bedoeld in het derde lid van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '1'
  - number: 40a.1
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de wijze van inrichting en indiening van
      een aanvraag om bouwvergunning, alsmede omtrent de daarbij over te leggen gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40a
  - number: 40a.2
    text: |-
      Bij de maatregel kan worden bepaald dat daarbij aan te geven gegevens en bescheiden mogen worden overgelegd binnen
      een daarbij te bepalen termijn nadat de bouwvergunning is afgegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40a
  - number: 40a.3
    text: |-
      In afwijking van het eerste lid kunnen voorschriften van technische of administratieve aard als bedoeld in dat lid
      bij ministeriële regeling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40a
  - number: 40b.1
    text: |-
      Burgemeester en wethouders tekenen onverwijld de datum van ontvangst aan op het geschrift waarbij de aanvraag om
      bouwvergunning is ingediend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40b
  - number: 40b.2
    text: Burgemeester en wethouders zenden de aanvrager onverwijld een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel40b
  - number: '41'
    text: |-
      Van een aanvraag om bouwvergunning wordt binnen twee weken na ontvangst daarvan door burgemeester en wethouders
      kennisgegeven in een van gemeentewege uitgegeven blad of een dag-, nieuws- of huis-aan-huisblad.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel41
  - number: '43.1'
    text: 'Geen bouwvergunning is vereist voor het bouwen:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
  - number: 43.1.a
    text: |-
      ingevolge een besluit als bedoeld in[ artikel 13][ref1], dan wel een besluit tot toepassing van bestuursdwang of
      oplegging van een last onder dwangsom;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
  - number: 43.1.b
    text: dat tot het gewone onderhoud behoort, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
  - number: 43.1.c
    text: |-
      dat bij algemene maatregel van bestuur is aangemerkt als van beperkte betekenis, waarbij tevens voorschriften
      kunnen worden gegeven omtrent het gebruik van het bouwwerk of de standplaats.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
  - number: '43.2'
    text: 'Het eerste lid, onderdeel c, is niet van toepassing op het bouwen:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
  - number: 43.2.a
    text: |-
      in, op, aan of bij een monument als bedoeld in de [Monumentenwet 1988][ref1] of een monument als bedoeld in een
      provinciale of gemeentelijke monumentenverordening, of


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 43.2.b
    text: |-
      in een beschermd stads- of dorpsgezicht als bedoeld in de [Monumentenwet 1988][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: '43.3'
    text: |-
      De voordracht voor een krachtens het eerste lid, onderdeel c, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel43
  - number: '44.1'
    text: 'De reguliere bouwvergunning mag slechts en moet worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
  - number: 44.1.a
    text: |-
      de aanvraag en de daarbij overgelegde gegevens naar het oordeel van burgemeester en wethouders niet aannemelijk
      maken dat het bouwen waarop de aanvraag betrekking heeft voldoet aan de voorschriften die zijn gegeven bij of
      krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1] of [120][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 44.1.b
    text: |-
      de aanvraag en de daarbij overgelegde gegevens naar het oordeel van burgemeester en wethouders niet aannemelijk
      maken dat het bouwen waarop de aanvraag betrekking heeft voldoet aan de voorschriften die zijn gegeven bij de
      bouwverordening of, zolang de bouwverordening daarmee nog niet in overeenstemming is gebracht, met de voorschriften
      die zijn gegeven bij een algemene maatregel van bestuur als bedoeld in [artikel 8, achtste lid][ref1], dan wel bij
      of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 120][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 44.1.c
    text: het bouwen in strijd is met een bestemmingsplan of met de eisen die krachtens zodanig plan zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
  - number: 44.1.d
    text: |-
      het uiterlijk of de plaatsing van het bouwwerk of de standplaats, waarop de aanvraag betrekking heeft, met
      uitzondering van een tijdelijk bouwwerk als bedoeld in [artikel 45, eerste lid][ref1], zowel op zichzelf beschouwd
      als in verband met de omgeving of de te verwachten ontwikkeling daarvan, in strijd is met redelijke eisen van
      welstand, beoordeeld naar de criteria, bedoeld in [artikel 12a, eerste lid][ref2], onderdeel a, tenzij burgemeester
      en wethouders van oordeel zijn dat de bouwvergunning niettemin moet worden verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 44.1.e
    text: |-
      voor het bouwen een vergunning ingevolge de [Monumentenwet 1988][ref1] of een provinciale of gemeentelijke
      monumentenverordening is vereist en deze niet is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: '44.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald voor welke categorieën van gevallen geen reguliere bouwvergunning
      is vereist, doch kan worden volstaan met een lichte bouwvergunning. De voordracht voor een krachtens de eerste
      volzin vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan
      de beide kamers der Staten-Generaal is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
  - number: '44.3'
    text: 'Op de lichte bouwvergunning is het eerste lid van overeenkomstige toepassing, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
  - number: 44.3.a
    text: |-
      onderdeel a van dat lid slechts van toepassing is voor zover de voorschriften die in dat onderdeel zijn bedoeld,
      betrekking hebben op constructieve veiligheid, en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
  - number: 44.3.b
    text: |-
      onderdeel b van dat lid slechts van toepassing is voor zover de voorschriften die in dat onderdeel zijn bedoeld,
      van stedenbouwkundige aard zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44
  - number: 44a.1
    text: |-
      In afwijking van [artikel 44, eerste lid][ref1], en [artikel 56a, tweede en derde lid][ref2], kan de reguliere
      bouwvergunning tevens worden geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 56a
        hoofdstuk: IV
        afdeling: '1'
  - number: 44a.1.a
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], met dien verstande
      dat voor de toepassing van [artikel 3 van die wet][ref2] in deze wet onder betrokkene mede wordt verstaan degene
      die op grond van feiten en omstandigheden redelijkerwijs met een aanvrager van de bouwvergunning gelijk kan worden
      gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 44a.1.b
    text: |-
      indien het advies van de Commissie voor de tunnelveiligheid, bedoeld in
      [artikel 6, derde lid, onderdeel b, van de Wet aanvullende regels veiligheid wegtunnels][ref1], daartoe aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
  - number: 44a.2
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid, onderdeel a, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '45.1'
    text: 'In een bouwvergunning voor:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: 45.1.a
    text: een woonkeet;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: 45.1.b
    text: |-
      een bouwwerk, bestemd om in een tijdelijke behoefte, niet zijnde bewoning, te voorzien, niet zijnde een
      seizoensgebonden bouwwerk als bedoeld in het zesde lid;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: 45.1.c
    text: een bouwwerk dat slechts toelaatbaar is ingevolge een voorlopige bestemming of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: 45.1.d
    text: |-
      een bouwwerk ten aanzien waarvan [artikel 17 van de Wet op de Ruimtelijke Ordening][ref1] wordt toegepast,


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '17'
  - number: '45.2'
    text: In de gevallen, bedoeld in het eerste lid, onderdelen *a* en *b*, is de termijn ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: '45.3'
    text: |-
      In het geval, bedoeld in het eerste lid, onderdeel *c*, wordt de termijn vastgesteld overeenkomstig hetgeen bij het
      bestemmingsplan omtrent de duur van de bestemming is bepaald.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: '45.4'
    text: |-
      In het geval, bedoeld in het eerste lid, onderdeel d, is de termijn gelijk aan die, waarvoor de vrijstelling,
      bedoeld in [artikel 17 van de Wet op de Ruimtelijke Ordening][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '17'
  - number: '45.5'
    text: 'De termijnen kunnen worden verlengd, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: 45.5.a
    text: |-
      de termijn ten aanzien van een woonkeet slechts kan worden verlengd, indien een kortere termijn dan vijf jaren is
      gesteld, en wel tot ten hoogste vijf jaren;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: 45.5.b
    text: |-
      de termijn ten aanzien van een bouwwerk dat slechts toelaatbaar is ingevolge een voorlopige bestemming slechts kan
      worden verlengd, indien de duur van de bestemming inmiddels is verlengd en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: 45.5.c
    text: |-
      de termijn ten aanzien van een bouwwerk waarop [artikel 17 van de Wet op de Ruimtelijke Ordening][ref1] is
      toegepast, slechts kan worden verlengd, indien de termijn, bedoeld in dat artikel, is verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '17'
  - number: '45.6'
    text: |-
      In de bouwvergunning voor een seizoensgebonden bouwwerk wordt bepaald binnen welke opeenvolgende tijdvakken van een
      kalenderjaar dat bouwwerk wordt opgericht, gebruikt en gesloopt en voor welke periode de vergunning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: '45.7'
    text: |-
      In een geval als bedoeld in het eerste lid, onderdeel a, b of c, is de rechthebbende na het verstrijken van
      de in de bouwvergunning gestelde termijn gehouden het bouwwerk hetzij terstond te slopen hetzij terstond in
      overeenstemming te brengen met de van toepassing zijnde voorschriften. In een geval als bedoeld in het zesde lid is
      de rechthebbende gehouden het bouwwerk te slopen binnen het in de bouwvergunning daartoe vastgestelde tijdvak.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
  - number: '45.8'
    text: |-
      In het geval, bedoeld in het eerste lid, onderdeel *d*, is na het verstrijken van de termijn
      [artikel 17, vierde tot en met zevende lid, van de Wet op de Ruimtelijke Ordening][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '17'
  - number: '46.1'
    text: 'Burgemeester en wethouders beslissen omtrent een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
  - number: 46.1.a
    text: 'om een lichte bouwvergunning: binnen zes weken na ontvangst van de aanvraag;'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
  - number: 46.1.b
    text: 'om een reguliere bouwvergunning: binnen twaalf weken na ontvangst van de aanvraag;'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
  - number: 46.1.c
    text: |-
      om een reguliere bouwvergunning die overeenkomstig [artikel 56a, eerste lid][ref1], in twee fasen wordt verleend:
      telkens binnen zes weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
        hoofdstuk: IV
        afdeling: '1'
  - number: '46.2'
    text: |-
      Burgemeester en wethouders kunnen hun beslissing omtrent een aanvraag om een reguliere bouwvergunning, dan wel,
      indien die vergunning overeenkomstig [artikel 56a, eerste lid][ref1], in twee fasen wordt verleend, hun beslissing
      omtrent een aanvraag om bouwvergunning eerste of tweede fase, eenmaal met ten hoogste zes weken verdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
        hoofdstuk: IV
        afdeling: '1'
  - number: '46.3'
    text: |-
      Het eerste lid is niet van toepassing, indien de aanvraag betrekking heeft op een bouwwerk, voor het bouwen waarvan
      slechts bouwvergunning kan worden verleend, nadat vrijstelling is verleend als bedoeld in de [artikelen 15][ref1],
      [17][ref2] of [19 van de Wet op de Ruimtelijke Ordening][ref3]. Een aanvraag om bouwvergunning die
      slechts kan worden ingewilligd na vrijstelling als bedoeld in de [artikelen 15][ref4], [17][ref5] of
      [19 van de Wet op de Ruimtelijke Ordening][ref6] wordt geacht mede een verzoek om zodanige vrijstelling in te
      houden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002375#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0002375
        artikel: '15'
      - id: ref5
        bwb_id: BWBR0002375
        artikel: '17'
      - id: ref6
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '46.4'
    text: Indien burgemeester en wethouders niet voldoen aan het eerste lid is de bouwvergunning van rechtswege verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
  - number: '46.5'
    text: |-
      Verlening van de bouwvergunning ingevolge het vierde lid wordt aangemerkt als een besluit in de zin van
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '46.6'
    text: |-
      Indien de vergunning een woonkeet betreft, doen burgemeester en wethouders tegelijkertijd met of zo spoedig
      mogelijk na de bekendmaking mededeling van de in het eerste lid bedoelde beslissing aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
  - number: '46.7'
    text: |-
      Indien de vergunning een bouwwerk betreft dat behoort tot een beschermd stads- of dorpsgezicht in de zin van
      de [Monumentenwet 1988][ref1], doen burgemeester en wethouders tegelijkertijd of zo spoedig mogelijk na de
      bekendmaking mededeling van de in het eerste lid bedoelde beslissing aan de Rijksdienst voor de Monumentenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: '46.8'
    text: |-
      Burgemeester en wethouders leggen de gemeenteraad eenmaal per jaar een verslag voor waarin zij uiteenzetten op
      welke wijze zij toepassing hebben gegeven aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
  - number: '46.9'
    text: |-
      Indien een beslissing als bedoeld in het eerste of tweede lid afwijkt van het advies van de welstandscommissie of
      de stadsbouwmeester wordt zulks met de redenen voor de afwijking bij de bekendmaking vermeld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel46
  - number: '48.1'
    text: |-
      Burgemeester en wethouders leggen een aanvraag voor een reguliere bouwvergunning voor advies voor aan de
      welstandscommissie dan wel de stadsbouwmeester die in de betreffende gemeente werkzaam is. Een aanvraag voor een
      lichte bouwvergunning kunnen zij voor advies aan die welstandscommissie dan wel de stadsbouwmeester voorleggen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel48
  - number: '48.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel48
  - number: 48.2.a
    text: indien voor het betreffende bouwwerk of de betreffende standplaats geen redelijke eisen van welstand gelden, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel48
  - number: 48.2.b
    text: |-
      indien bij voorbaat vaststaat dat de bouwvergunning reeds op een andere grond moet worden geweigerd dan wegens
      strijd met redelijke eisen van welstand.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel48
  - number: '49.1'
    text: |-
      Indien [artikel 46, derde lid][ref1], van toepassing is en de aanvraag om bouwvergunning slechts
      kan worden ingewilligd na verlening van vrijstelling als bedoeld in de artikelen [15][ref2] of
      [17 van de Wet op de Ruimtelijke Ordening][ref3], beslissen burgemeester en wethouders omtrent die aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '17'
  - number: 49.1.a
    text: |-
      binnen vier weken nadat zij hebben beslist tot het verlenen van vrijstelling als bedoeld in
      [artikel 15 van de Wet op de Ruimtelijke Ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel15
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '15'
  - number: 49.1.b
    text: |-
      binnen vier weken nadat zij overeenkomstig [artikel 18 van de Wet op de Ruimtelijke Ordening][ref1] hebben beslist
      tot het verlenen van vrijstelling als bedoeld in [artikel 17 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '17'
  - number: '49.2'
    text: |-
      Indien [artikel 46, derde lid][ref1], van toepassing is en de aanvraag om bouwvergunning slechts kan worden
      ingewilligd na verlening van vrijstelling als bedoeld in [artikel 19 van de Wet op de Ruimtelijke Ordening][ref2],
      beslissen burgemeester en wethouders omtrent die aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '19'
  - number: 49.2.a
    text: 'indien geen verklaring van geen bezwaar van gedeputeerde staten is vereist:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
  - number: 49.2.a.1°
    text: |-
      binnen zes weken nadat de in [artikel 19a, vierde lid, van de Wet op de Ruimtelijke Ordening][ref1] juncto
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref2] bedoelde termijn voor het naar voren brengen
      van zienswijzen is verstreken, indien het een lichte bouwvergunning betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 49.2.a.2°
    text: binnen twaalf weken na afloop van de onder 1° bedoelde termijn, indien het een reguliere bouwvergunning betreft;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
  - number: 49.2.b
    text: 'indien een verklaring van geen bezwaar van gedeputeerde staten is vereist:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
  - number: 49.2.b.1°
    text: binnen zes weken na ontvangst van die verklaring, indien het een lichte bouwvergunning betreft;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
  - number: 49.2.b.2°
    text: binnen twaalf weken na ontvangst van die verklaring, indien het een reguliere bouwvergunning betreft.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
  - number: '49.3'
    text: |-
      Indien burgemeester en wethouders, of in voorkomend geval, de gemeenteraad de vrijstelling hebben onderscheidenlijk
      heeft verleend en niet wordt voldaan aan het eerste of tweede lid, is de bouwvergunning van rechtswege verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
  - number: '49.4'
    text: |-
      Verlening van de bouwvergunning ingevolge het derde lid wordt aangemerkt als een besluit in de zin van
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '49.5'
    text: |-
      De verlening van de vrijstelling wordt geacht voor de mogelijkheid van beroep ingevolge
      [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] deel uit te maken van de beschikking waarop zij betrekking
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '50.1'
    text: |-
      In afwijking van [artikel 46, eerste lid][ref1], houden burgemeester en wethouders de beslissing op een
      aanvraag om bouwvergunning aan indien er geen grond is om de vergunning te weigeren en voor het gebied, waarin
      het bouwwerk zal worden uitgevoerd, voordat de aanvraag is ingekomen een voorbereidingsbesluit als bedoeld
      in [artikel 21 van de Wet op de Ruimtelijke Ordening][ref2] in werking is getreden, een ontwerp voor een
      bestemmingsplan of voor een herziening daarvan ter inzage is gelegd, een bestemmingsplan of een herziening daarvan
      is vastgesteld, dan wel een bestemmingsplan of een herziening daarvan na vaststelling ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel21
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '21'
  - number: '50.2'
    text: |-
      De aanhouding duurt totdat het voorbereidingsbesluit overeenkomstig
      [artikel 21, vierde of zesde lid, van de Wet op de Ruimtelijke Ordening][ref1] is vervallen, de termijn,
      genoemd in [artikel 25 van die wet][ref2] is overschreden, de termijn voor terinzagelegging, genoemd in
      [artikel 26 van die wet][ref3] is overschreden dan wel het bestemmingsplan of de herziening daarvan in werking
      is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel26
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '26'
  - number: '50.3'
    text: |-
      In afwijking in zoverre van het tweede lid, duurt de aanhouding voort indien nog niet is voldaan aan een
      verplichting als bedoeld in [artikel 30][ref1] of [40a van de Wet op de Ruimtelijke Ordening][ref2] of een
      ingevolge [artikel 30][ref3], [40a][ref4] of [40b van die wet][ref5] vastgesteld plan nog niet in werking is
      getreden. De aanhouding eindigt in elk geval indien binnen een jaar na het verlopen van de termijn, bedoeld in
      [artikel 30 van genoemde wet][ref6], geen ontwerp van een bestemmingsplan of van een herziening daarvan ter inzage
      is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel40a
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel40a
      [ref5]: https://wetten.overheid.nl/BWBR0002375#Artikel40b
      [ref6]: https://wetten.overheid.nl/BWBR0002375#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: 40a
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '30'
      - id: ref4
        bwb_id: BWBR0002375
        artikel: 40a
      - id: ref5
        bwb_id: BWBR0002375
        artikel: 40b
      - id: ref6
        bwb_id: BWBR0002375
        artikel: '30'
  - number: '50.4'
    text: |-
      In afwijking van het eerste lid kunnen burgemeester en wethouders de bouwvergunning verlenen indien het bouwplan
      niet in strijd is met het in voorbereiding zijnde bestemmingsplan of met de in voorbereiding zijnde herziening
      daarvan dan wel met het provinciaal en nationaal ruimtelijk beleid. Burgemeester en wethouders beslissen omtrent de
      aanvraag om bouwvergunning overeenkomstig [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '50.5'
    text: |-
      In afwijking van het eerste lid kunnen burgemeester en wethouders de bouwvergunning eveneens
      verlenen indien het bouwplan in strijd is met het in voorbereiding zijnde bestemmingsplan of met de
      in voorbereiding zijnde herziening daarvan, mits het bouwplan is voorzien van een goede ruimtelijke
      onderbouwing en vooraf van gedeputeerde staten de verklaring is ontvangen, dat zij tegen het verlenen
      van vergunning geen bezwaar hebben. Het besluit tot vergunningverlening bevat een beschrijving
      van het betrokken bouwplan, de ruimtelijke onderbouwing en de afwegingen die aan het verlenen van
      vergunning ten grondslag liggen. Op de voorbereiding van het besluit omtrent vergunningverlening is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder. Indien geen verklaring van geen bezwaar is vereist, beslissen burgemeester en
      wethouders in afwijking van [artikel 3:18, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2],
      binnen vier weken nadat de termijn voor het naar voren brengen van zienswijzen is verstreken.
      [Artikel 19a, eerste en vijfde tot en met elfde lid, van de Wet op de Ruimtelijke Ordening][ref3] is van
      overeenkomstige toepassing. Het besluit houdende verlening van de verklaring van geen bezwaar wordt geacht voor de
      mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref4] deel uit te maken van de
      beschikking waarop het betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: 19a
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '50.6'
    text: |-
      In afwijking van het eerste lid kunnen burgemeester en wethouders de bouwvergunning eveneens verlenen indien het
      bouwplan in strijd is met het in voorbereiding zijnde bestemmingsplan of met de in voorbereiding zijnde herziening
      daarvan en het betreft:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
  - number: 50.6.a
    text: |-
      een bouwvergunning als bedoeld in [artikel 45][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
  - number: 50.6.b
    text: |-
      een geval als bedoeld in [artikel 19, tweede of derde lid, van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '50.7'
    text: |-
      Op de voorbereiding van een besluit tot vergunningverlening als bedoeld in het zesde lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '50.8'
    text: |-
      Na het verstrijken van de aanhoudingsduur, bedoeld in het tweede lid, na de bekendmaking van de verklaring van
      geen bezwaar, bedoeld in het vijfde lid, of na de terinzageligging overeenkomstig het zevende lid, beslissen
      burgemeester en wethouders omtrent de aanvraag om bouwvergunning overeenkomstig [artikel 46][ref1], zulks in
      afwijking van [artikel 3:18, eerste, tweede en vierde lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '51.1'
    text: |-
      In afwijking van [artikel 46, eerste lid][ref1], houden burgemeester en wethouders de beslissing omtrent een
      aanvraag om bouwvergunning eveneens aan, indien er geen grond is om de vergunning te weigeren en de aanvraag een
      bouwwerk betreft, behorend tot een beschermd stads- of dorpsgezicht in de zin van de [Monumentenwet 1988][ref2],
      waarvoor nog geen ter bescherming daarvan strekkend bestemmingsplan geldt. De in de eerste volzin
      bedoelde plicht tot aanhouding geldt niet voor zover de aanvraag betrekking heeft op bouwen als bedoeld in
      [artikel 43, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004471
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004471
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
  - number: '51.2'
    text: |-
      De in het eerste lid, eerste volzin, bedoelde aanhouding duurt totdat omtrent goedkeuring van een ter voldoening
      aan [artikel 36, tweede lid, van de Monumentenwet 1988][ref1] vast te stellen of te herzien bestemmingsplan
      onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel36
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '36'
  - number: '51.3'
    text: |-
      Onverminderd [artikel 50, vierde en vijfde lid][ref1], kunnen burgemeester en wethouders, in afwijking van
      het eerste lid, eerste volzin, de bouwvergunning verlenen indien het bouwplan niet in strijd is met het in
      voorbereiding zijnde, ter bescherming van het beschermde stads- of dorpsgezicht strekkende bestemmingsplan en
      vooraf van gedeputeerde staten de verklaring is ontvangen dat zij tegen het verlenen van de vergunning geen bezwaar
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        afdeling: '1'
  - number: '51.4'
    text: |-
      De in het derde lid en [artikel 50, vijfde lid][ref1], bedoelde verklaringen worden gelijktijdig
      bekendgemaakt. [Artikel 19a, achtste lid, eerste volzin, van de Wet op de Ruimtelijke Ordening][ref2] is
      alsdan niet van toepassing op de verklaring van geen bezwaar, bedoeld in [artikel 50, vijfde lid][ref3].
      Alvorens het besluit omtrent de in het derde lid bedoelde verklaring te nemen horen gedeputeerde staten de
      Rijksdienst voor de Monumentenzorg. Van het besluit wordt onverwijld mededeling gedaan aan genoemde dienst.
      [Artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref4] is niet van toepassing. Het besluit
      houdende verlening van de verklaring van geen bezwaar wordt geacht voor de mogelijkheid van beroep ingevolge
      [hoofdstuk 8 van de Algemene wet bestuursrecht][ref5] deel uit te maken van de beschikking waarop het betrekking
      heeft. Gedeputeerde staten kunnen een verklaring weigeren wegens strijd met een goede ruimtelijke ordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '51.5'
    text: |-
      Na het verstrijken van de aanhoudingsduur, bedoeld in het tweede lid, of na de bekendmaking van de verklaring van
      geen bezwaar, bedoeld in het derde lid, beslissen burgemeester en wethouders omtrent de aanvraag om bouwvergunning
      overeenkomstig [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: 51a
    text: |-
      Indien een plusregio als bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente
      of gemeenten Amsterdam, Arnhem en Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of
      Utrecht omvat, is begrepen in een regionaal structuurplan, horen gedeputeerde staten tevens het dagelijks bestuur
      van die plusregio alvorens zij besluiten omtrent de verklaring van geen bezwaar, bedoeld in [artikel 50][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        afdeling: '1'
  - number: '52.1'
    text: |-
      In afwijking van [artikel 46, eerste lid][ref1], houden burgemeester en wethouders de beslissing omtrent een
      aanvraag om bouwvergunning eveneens aan, indien er geen grond is om de vergunning te weigeren en het bouwen
      tevens is aan te merken als het oprichten of veranderen van een inrichting waarvoor een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref2] of [artikel 15, onderdeel ][ref3] is vereist, tenzij de beschikking op
      de aanvraag om laatstbedoelde vergunning reeds is gegeven, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 52.1.a
    text: |-
      over het ontwerp van de beschikking geen zienswijzen naar voren zijn gebracht en de beschikking niet afwijkt van
      dat ontwerp, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52.1.b
    text: 'indien het onder a gestelde niet van toepassing is:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52.1.b.1°
    text: zes weken zijn verstreken na de dag waarop een exemplaar van die beschikking ter inzage is gelegd, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52.1.b.2°
    text: binnen die termijn een verzoek om voorlopige voorziening is gedaan en op dat verzoek is beslist.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: '52.2'
    text: 'De in het eerste lid bedoelde aanhouding eindigt:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52.2.a
    text: |-
      indien de beschikking op de aanvraag om de ingevolge de in het eerste lid genoemde wetten vereiste vergunning
      is gegeven, over het ontwerp van de beschikking geen zienswijzen naar voren zijn gebracht en de beschikking
      niet afwijkt van dat ontwerp: op de dag waarop burgemeester en wethouders van het ingevolge de in het eerste lid
      genoemde wetten bevoegde gezag een exemplaar van die beschikking hebben ontvangen, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52.2.b
    text: 'indien het onder a gestelde niet van toepassing is:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52.2.b.1°
    text: |-
      zes weken zijn verstreken na de dag waarop een exemplaar van de beschikking op de aanvraag om die vergunning ter
      inzage is gelegd, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52.2.b.2°
    text: |-
      indien binnen die termijn een verzoek om voorlopige voorziening is gedaan, met ingang van de dag na die waarop op
      dat verzoek is beslist.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: '52.3'
    text: |-
      Na de in het tweede lid bedoelde beëindiging van de aanhouding verlenen burgemeester en wethouders de
      bouwvergunning, tenzij het vierde lid van toepassing is, binnen vier weken na de beëindiging van de aanhouding.
      Indien burgemeester en wethouders niet binnen die termijn beslissen, is de bouwvergunning van rechtswege verleend.
      [Artikel 46, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '52.4'
    text: |-
      Indien het bouwplan waarop de aanvraag om bouwvergunning betrekking heeft, wijziging behoeft als gevolg van de
      vergunning in verband waarmee de beslissing op de aanvraag om bouwvergunning werd aangehouden, delen burgemeester
      en wethouders dit binnen twee weken na de beëindiging van de aanhouding aan de aanvrager van de bouwvergunning
      mede. Zij stellen hem daarbij in de gelegenheid binnen vijf weken een gewijzigde aanvraag om bouwvergunning in te
      dienen. Burgemeester en wethouders beslissen omtrent de gewijzigde aanvraag om bouwvergunning binnen vier weken.
      Indien burgemeester en wethouders niet binnen die termijn beslissen, is de bouwvergunning van rechtswege verleend.
      [Artikel 46, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '52.5'
    text: |-
      Indien de aanvrager van de bouwvergunning geen gebruik maakt van de hem overeenkomstig het vierde lid geboden
      gelegenheid, is de bouwvergunning van rechtswege verleend met ingang van de dag na de dag waarop de termijn van de
      hem geboden gelegenheid is verstreken. [Artikel 46, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '52.6'
    text: |-
      Indien burgemeester en wethouders niet zelf het bestuursorgaan zijn dat bevoegd is tot verlening van de vergunning
      in verband waarmee de beslissing op de aanvraag om bouwvergunning werd aangehouden, zenden zij een afschrift van de
      aanhouding, bedoeld in het eerste lid, onderscheidenlijk de beslissingen, bedoeld in het derde en vierde lid, aan
      het desbetreffende, krachtens de in het eerste lid genoemde wetten bevoegde gezag. Tevens stellen zij dat gezag in
      kennis van de verlening van de bouwvergunning ingevolge het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52
  - number: 52a.1
    text: |-
      In afwijking van [artikel 46, eerste lid][ref1], houden burgemeester en wethouders de beslissing op een aanvraag
      om bouwvergunning eveneens aan, indien er geen grond is de bouwvergunning te weigeren en uit het onderzoeksrapport,
      bedoeld in [artikel 8, vierde lid, onderdeel c][ref2], blijkt dat de bodem ter plaatse van het te bouwen
      bouwwerk in zodanige mate is verontreinigd dan wel bij hen uit anderen hoofde een redelijk vermoeden bestaat dat
      overeenkomstig de [Wet bodembescherming ][ref3]sprake is van een geval van ernstige verontreiniging. Het besluit
      tot aanhouding van de beslissing op de aanvraag om bouwvergunning wordt genomen binnen twee weken na ontvangst van
      die aanvraag en het onderzoeksrapport; indien er geen grond is de bouwvergunning te weigeren en de beslissing niet
      binnen deze termijn is genomen en uit het onderzoeksrapport blijkt dat de bodem ernstig is verontreinigd, is die
      beslissing van rechtswege genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003994
  - number: 52a.2
    text: |-
      De aanhouding duurt totdat het krachtens de [Wet bodembescherming][ref1] bevoegd gezag met het saneringsplan,
      bedoeld in [artikel 39, eerste lid, van die wet][ref2], overeenkomstig het tweede lid van dat artikel, heeft
      ingestemd dan wel overeenkomstig [artikel 29, eerste lid][ref3], juncto [37, eerste lid, van die wet][ref4]
      heeft vastgesteld dat geen sprake is van een geval van ernstige verontreiniging ten aanzien waarvan
      spoedige sanering noodzakelijk is. In geval van een melding als bedoeld in [artikel 28][ref5] juncto
      [39b van de Wet bodembescherming][ref6], duurt de aanhouding totdat is gebleken dat de melding overeenkomstig de
      bij of krachtens die wet gestelde eisen is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0003994
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0003994
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0003994
        artikel: '37'
      - id: ref5
        bwb_id: BWBR0003994
        artikel: '28'
      - id: ref6
        bwb_id: BWBR0003994
        artikel: 39b
  - number: 52a.3
    text: |-
      Indien het bouwplan, waarop de aanvraag om bouwvergunning betrekking heeft, wijziging behoeft door het
      saneringsplan waarmee is ingestemd, delen burgemeester en wethouders dit binnen twee weken na de beëindiging van de
      aanhouding aan de aanvrager van de bouwvergunning mede. Zij stellen hem daarbij in de gelegenheid binnen vijf weken
      een gewijzigde aanvraag om bouwvergunning in te dienen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52a
  - number: 52a.4
    text: |-
      Na de beëindiging van de aanhouding of, indien toepassing is gegeven aan het derde lid, beslissen burgemeester en
      wethouders op de aanvraag om bouwvergunning overeenkomstig [artikel 46][ref1], met dien verstande dat de termijn,
      die in het eerste lid van dat artikel is genoemd, aanvangt op de dag die volgt op de datum waarop de aanhouding is
      beëindigd. Indien toepassing is gegeven aan het derde lid en de aanvrager van de bouwvergunning niet binnen vijf
      weken een gewijzigde aanvraag om bouwvergunning heeft ingediend, is de bouwvergunning van rechtswege geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '53.1'
    text: |-
      In afwijking van [artikel 46, eerste lid][ref1], houden burgemeester en wethouders de beslissing
      omtrent een aanvraag om bouwvergunning eveneens aan, indien er geen grond is om de vergunning
      te weigeren en voor het gebouw een aanvraag is ingediend om een toelating als bedoeld in
      [artikel 5, tweede lid, van de Wet toelating zorginstellingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '5'
  - number: '53.2'
    text: |-
      De in het eerste lid bedoelde aanhouding eindigt, indien Onze Minister van Volksgezondheid,
      Welzijn en Sport voor het betrokken bouwproject een toelating heeft verleend als bedoeld in
      [artikel 5, tweede lid, van de Wet toelating zorginstellingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
  - number: '53.3'
    text: |-
      Zo spoedig mogelijk na de bekendmaking doen burgemeester en wethouders mededeling van de aanhouding, bedoeld in het
      eerste lid, alsmede van de beëindiging van de aanhouding, aan het gezag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel53
  - number: '53.4'
    text: |-
      Na de in het tweede lid bedoelde beëindiging van de aanhouding verlenen burgemeester en wethouders de
      bouwvergunning, tenzij het zesde lid van toepassing is, binnen vier weken na de beëindiging van de aanhouding.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel53
  - number: '53.5'
    text: |-
      Indien burgemeester en wethouders niet voldoen aan het vierde lid, is de bouwvergunning, behoudens in een geval
      als bedoeld in het zesde lid, van rechtswege verleend. [Artikel 46, vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '53.6'
    text: |-
      Indien het bouwplan, waarop de aanvraag om bouwvergunning betrekking heeft, als gevolg van een vergunning als
      bedoeld in het tweede lid, in verband waarmee de beslissing op de aanvraag om bouwvergunning is aangehouden, naar
      het oordeel van burgemeester en wethouders wijziging behoeft, stellen zij de aanvrager van de bouwvergunning in de
      gelegenheid binnen vijf weken nadat zij hem mededeling hebben gedaan van de in het tweede lid bedoelde beëindiging
      van de aanhouding, een gewijzigde aanvraag om bouwvergunning in te dienen. Burgemeester en wethouders beslissen
      omtrent de gewijzigde aanvraag om bouwvergunning overeenkomstig [artikel 46][ref1]. Artikel 47 is op de gewijzigde
      aanvraag om bouwvergunning van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '53.7'
    text: |-
      Indien de aanvrager van de bouwvergunning geen gebruik maakt van de hem overeenkomstig het zesde lid geboden
      gelegenheid, is de bouwvergunning van rechtswege verleend met ingang van de dag na de dag waarop de termijn van de
      hem geboden gelegenheid is verstreken. [Artikel 46, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '54.1'
    text: |-
      In afwijking van [artikel 46, eerste lid][ref1], houden burgemeester en wethouders de beslissing omtrent
      een aanvraag om bouwvergunning eveneens aan, indien voor het bouwwerk een vergunning als bedoeld in
      [artikel 11, tweede lid, van de Monumentenwet 1988][ref2] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '11'
  - number: '54.2'
    text: 'De in het eerste lid bedoelde aanhouding eindigt:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel54
  - number: 54.2.a
    text: |-
      indien tegen het besluit, bedoeld in [artikel 11, tweede lid, van de Monumentenwet 1988][ref1], geen beroep is
      ingesteld, met ingang van de dag waarop zes weken zijn verstreken na de bekendmaking van dat besluit, of


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
  - number: 54.2.b
    text: |-
      indien tegen het besluit, bedoeld onder a, binnen zes weken na de bekendmaking ervan beroep is ingesteld, met
      ingang van de dag na de dag waarop het verzoek van de vergunninghouder om de opschorting van dat besluit op te
      heffen, is toegewezen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel54
  - number: '54.3'
    text: |-
      Zo spoedig mogelijk na de bekendmaking doen burgemeester en wethouders mededeling van de aanhouding, bedoeld in het
      eerste lid, aan het gezag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel54
  - number: '54.4'
    text: |-
      Burgemeester en wethouders beslissen binnen twee weken na beëindiging van de in het tweede lid bedoelde aanhouding
      op de aanvraag om bouwvergunning. Tegelijkertijd met de bekendmaking wordt mededeling gedaan van de beëindiging van
      de aanhouding.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel54
  - number: '54.5'
    text: |-
      Indien burgemeester en wethouders niet voldoen aan het vierde lid en de vergunning, bedoeld in
      [artikel 11, tweede lid, van de Monumentenwet 1988][ref1] is verleend of moet worden geacht te zijn verleend, is de
      bouwvergunning van rechtswege verleend. [Artikel 46, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '55.1'
    text: |-
      In afwijking van [artikel 46, eerste lid][ref1], houden burgemeester en wethouders de beslissing omtrent een
      aanvraag om bouwvergunning eveneens aan, indien naar hun oordeel voor het bouwen van het bouwwerk ontheffing als
      bedoeld in [artikel 7, eerste lid][ref2], is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '55.2'
    text: |-
      De in het eerste lid bedoelde aanhouding eindigt op de dag, volgende op de dag waarop burgemeester en wethouders
      het in [artikel 7, vierde lid][ref1], bedoelde afschrift hebben ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '55.3'
    text: |-
      Burgemeester en wethouders doen de bekendmaking van de aanhouding, bedoeld in het eerste lid, vergezeld gaan van
      een verklaring als bedoeld in [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '55.4'
    text: |-
      Na beëindiging van de aanhouding, bedoeld in het tweede lid, beslissen burgemeester en wethouders binnen twee weken
      omtrent de aanvraag om bouwvergunning, met dien verstande dat de bouwvergunning moet worden verleend, indien de
      ontheffing, bedoeld in [artikel 7, eerste lid][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '55.5'
    text: |-
      Tegelijkertijd met de bekendmaking van de in het vierde lid bedoelde beslissing wordt mededeling gedaan van de in
      het tweede lid bedoelde beëindiging van de aanhouding.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel55
  - number: '55.6'
    text: |-
      Indien burgemeester en wethouders niet voldoen aan het vijfde lid en de ontheffing, bedoeld in
      [artikel 7, eerste lid][ref1], is verleend, is de bouwvergunning van rechtswege verleend. Artikel 46, vijfde lid,
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '56'
    text: |-
      Burgemeester en wethouders mogen aan de bouwvergunning slechts voorwaarden verbinden ter bescherming van de
      belangen, ten behoeve waarvan de voorschriften strekken krachtens welke de vergunning wordt verleend en waaraan het
      bouwwerk, waarop de aanvraag betrekking heeft, moet voldoen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56
  - number: 56a.1
    text: Een reguliere bouwvergunning wordt op aanvraag in twee fasen verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
  - number: 56a.2
    text: |-
      De bouwvergunning eerste fase mag slechts en moet worden geweigerd indien een weigeringsgrond als bedoeld in
      [artikel 44, eerste lid, onderdeel b, c, d of e][ref1], van toepassing is, met dien verstande dat onderdeel b van
      dat lid slechts van toepassing is voor zover de daar bedoelde voorschriften van stedenbouwkundige aard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.3
    text: |-
      De bouwvergunning tweede fase mag slechts en moet worden geweigerd indien een weigeringsgrond als bedoeld in
      [artikel 44, eerste lid, onderdeel a of b][ref1], van toepassing is, met dien verstande dat onderdeel b van dat lid
      niet van toepassing is voor zover de daar bedoelde voorschriften van stedenbouwkundige aard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.4
    text: 'De aanvraag om bouwvergunning tweede fase kan eerst worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
  - number: 56a.4.a
    text: |-
      na afloop van de termijn waarbinnen overeenkomstig [artikel 46, eerste lid, onderdeel c, of tweede lid][ref1], op
      de aanvraag om bouwvergunning eerste fase moet worden beslist, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.4.b
    text: 'indien op een eerder tijdstip op die aanvraag is beslist: nadat die beslissing is bekendgemaakt.'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
  - number: 56a.5
    text: 'Indien de bouwvergunning in twee fasen wordt verleend, wordt in:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
  - number: 56a.5.a
    text: |-
      [artikel 41][ref1] in plaats van «aanvraag om bouwvergunning» gelezen: aanvraag om bouwvergunning eerste, dan wel
      tweede fase;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '41'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.5.b
    text: |-
      [artikel 48][ref1], eerste lid, in plaats van «aanvraag voor een reguliere bouwvergunning» gelezen: aanvraag om
      bouwvergunning eerste fase;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.5.c
    text: |-
      de [artikelen 49, eerste lid][ref1], [50, eerste lid][ref2], [51, eerste lid][ref3], en [54, eerste lid][ref4], in
      plaats van «aanvraag om bouwvergunning» gelezen: aanvraag om bouwvergunning eerste fase;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel54
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '51'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '54'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.5.d
    text: |-
      [artikel 49, tweede lid, onderdeel a, onder 2°, en onderdeel b, onder 2°][ref1], in plaats van «binnen twaalf
      weken» telkens gelezen «binnen zes weken», en in plaats van «reguliere bouwvergunning» telkens: aanvraag om
      bouwvergunning eerste fase;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.5.e
    text: |-
      de [artikelen 52, eerste lid][ref1], [52a, eerste lid][ref2], [53, eerste lid][ref3], en [55, eerste lid][ref4], in
      plaats van «aanvraag om bouwvergunning» telkens gelezen: aanvraag om bouwvergunning tweede fase.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel55
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '52'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 52a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '53'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '55'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.6
    text: 'Burgemeester en wethouders kunnen het besluit waarbij de bouwvergunning eerste fase is verleend, intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
  - number: 56a.6.a
    text: |-
      blijkt, dat zij dit besluit ten gevolge van een onjuiste of onvolledige opgave hebben genomen, of dat gegevens of
      bescheiden als bedoeld in [artikel 40a, tweede lid][ref1], niet tijdig zijn overgelegd, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 40a
        hoofdstuk: IV
        afdeling: '1'
  - number: 56a.6.b
    text: |-
      niet binnen 12 maanden na het onherroepelijk worden van het besluit een aanvraag om bouwvergunning tweede fase
      is ingediend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
  - number: 56a.7
    text: |-
      Het besluit waarbij de bouwvergunning eerste fase is verleend, vervalt indien niet binnen twee jaren na het
      onherroepelijk worden ervan een aanvraag om bouwvergunning tweede fase is ingediend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
  - number: 56a.8
    text: |-
      Indien het bouwplan waarvoor de bouwvergunning eerste fase is verleend als gevolg van hun besluit omtrent de
      aanvraag om bouwvergunning tweede fase zodanige wijziging behoeft dat naar het oordeel van burgemeester en
      wethouders wederom een toetsing aan de weigeringsgronden van de eerste fase noodzakelijk is, delen zij dit
      onverwijld mede aan de aanvrager van de bouwvergunning tweede fase. Zij stellen hem daarbij in de gelegenheid
      binnen vijf weken een gewijzigde aanvraag om bouwvergunning eerste fase in te dienen. Burgemeester en wethouders
      beslissen omtrent die gewijzigde aanvraag binnen vier weken. Indien burgemeester en wethouders niet binnen die vier
      weken beslissen, is de bouwvergunning eerste fase van rechtswege verleend. De bouwvergunning eerste fase, zoals
      die in tweede instantie is verleend, treedt, voor zover die afwijkt van de primaire bouwvergunning eerste fase,
      in de plaats van de primaire bouwvergunning eerste fase. [Artikel 46, vijfde lid][ref1], is van overeenkomstige
      toepassing. Indien de aanvrager geen gebruik maakt van de gelegenheid die hem krachtens de tweede volzin is
      geboden, is de bouwvergunning van rechtswege geweigerd met ingang van de dag na de dag waarop de termijn van de hem
      geboden gelegenheid is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: 56b.1
    text: |-
      In afwijking van [artikel 46, eerste lid, onderdeel c, en tweede lid][ref1], houden burgemeester en
      wethouders de beslissing omtrent de aanvraag om bouwvergunning tweede fase aan indien er geen grond
      is om de vergunning te weigeren en de termijn voor het indienen van een bezwaarschrift tegen het
      besluit, waarbij de bouwvergunning eerste fase is verleend, nog niet is verstreken. In afwijking van
      [artikel 46, eerste lid, onderdeel c, en tweede lid][ref2], houden burgemeester en wethouders de beslissing omtrent
      de aanvraag om bouwvergunning tweede fase eveneens aan indien er geen grond is om de vergunning te weigeren en
      indien gedurende de termijn, bedoeld in de eerste volzin, bij de voorzieningenrechter van de rechtbank een verzoek
      om schorsing van het besluit als bedoeld in de eerste volzin is ingediend en op dat verzoek positief is beslist.
      De aanhouding eindigt op de dag na de dag dat de termijn, bedoeld in de eerste volzin, is verstreken zonder dat een
      bezwaarschrift is ingediend, of, indien wel een bezwaarschrift is ingediend en het besluit als bedoeld in de eerste
      volzin is geschorst, op de dag dat de schorsing ingevolge [artikel 8:85 van de Algemene wet bestuursrecht][ref3]
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 56b.2
    text: |-
      In afwijking van [artikel 46, eerste lid, onderdeel c, en tweede lid][ref1], houden burgemeester en wethouders de
      beslissing omtrent de aanvraag om bouwvergunning tweede fase eveneens aan indien er geen grond is om de vergunning
      te weigeren en toepassing is gegeven aan [artikel 56a, achtste lid, tweede volzin][ref2]. De aanhouding eindigt op
      de dag na de dag dat een gewijzigde aanvraag om bouwvergunning eerste fase is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 56a
        hoofdstuk: IV
        afdeling: '1'
  - number: '57.1'
    text: 'Burgemeester en wethouders stellen een openbaar register in, waarin aantekening wordt gehouden van:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel57
  - number: 57.1.a
    text: aanvragen om bouwvergunning;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel57
  - number: 57.1.b
    text: verleende bouwvergunningen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel57
  - number: 57.1.c
    text: bouwvergunningen die van rechtswege zijn verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel57
  - number: '57.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat burgemeester en wethouders ook andere gegevens aantekenen
      in het register, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel57
  - number: '57.3'
    text: |-
      Bij de maatregel kan worden bepaald binnen welke termijn de gegevens, bedoeld in het eerste en tweede lid, dienen
      te worden aangetekend. Die termijn kan voor de verschillende gegevens verschillend worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel57
  - number: '58'
    text: |-
      De eigenaar of hoofdgebruiker van een naburig ander gebouw wordt, overeenkomstig bij de bouwverordening gegeven
      voorschriften, door burgemeester en wethouders binnen twee weken na de dag waarop een bouwvergunning van rechtswege
      is verleend, schriftelijk van deze verlening in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel58
  - number: '59.1'
    text: 'Burgemeester en wethouders kunnen de bouwvergunning geheel of gedeeltelijk intrekken:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
  - number: 59.1.a
    text: |-
      indien blijkt, dat zij de vergunning ten gevolge van een onjuiste of onvolledige opgave hebben verleend of dat
      gegevens of bescheiden als bedoeld in [artikel 40a, tweede lid][ref1], niet tijdig zijn overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 40a
        hoofdstuk: IV
        afdeling: '1'
  - number: 59.1.b
    text: |-
      indien blijkt dat de houder niet heeft voldaan aan een voorwaarde als bedoeld in [artikel 56][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '56'
        hoofdstuk: IV
        afdeling: '1'
  - number: 59.1.c
    text: indien binnen de in de bouwverordening bepaalde termijn geen begin is gemaakt met de bouwwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
  - number: 59.1.d
    text: indien de werkzaamheden langer dan de in de bouwverordening bepaalde termijn hebben stilgelegen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
  - number: 59.1.e
    text: op verzoek van de vergunninghouder, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
  - number: 59.1.f
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], met dien verstande
      dat voor de toepassing van [artikel 3 van die wet][ref2] in deze wet onder betrokkene mede wordt verstaan degene
      die op grond van feiten en omstandigheden redelijkerwijs met een vergunninghouder gelijk kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '59.2'
    text: |-
      Een vergunning met toepassing van [artikel 45][ref1] verleend, kan bovendien worden ingetrokken, indien de
      voorschriften omtrent het onderhoud en het gebruik niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
  - number: '59.3'
    text: |-
      Een intrekking als bedoeld in het tweede lid, heeft hetzelfde rechtsgevolg als het verstrijken van de in de
      vergunning gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
  - number: '59.4'
    text: |-
      Voordat toepassing wordt gegeven aan onderdeel f van het eerste lid kan het
      Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '59.5'
    text: |-
      Op de voorbereiding van een intrekking van een bouwvergunning is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '60.1'
    text: |-
      Het is verboden zonder vergunning van burgemeester en wethouders (woonvergunning) een bestaand gebouw dan wel een
      gedeelte van een bestaand gebouw, dat, ofschoon niet ongeschikt voor bewoning, laatstelijk niet of wederrechtelijk
      als woning of woonwagen werd gebruikt, als woning of woonwagen in gebruik te geven of te nemen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel60
  - number: '60.2'
    text: |-
      De woonvergunning mag alleen en moet worden geweigerd indien het beoogde gebruik van het gebouw dan wel het
      gedeelte van het gebouw niet voldoet aan de voorschriften van de bouwverordening of in strijd is met het
      desbetreffende bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel60
  - number: '60.3'
    text: |-
      Het eerste lid is niet van toepassing op het als woning of woonwagen in gebruik geven of nemen van een bestaand
      gebouw dan wel een gedeelte van een bestaand gebouw, dat, ofschoon ongeschikt voor bewoning, overeenkomstig de
      daarvoor geldende voorschriften voor bewoning geschikt is gemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel60
  - number: '60.4'
    text: |-
      De [artikelen 46][ref1], [47][ref2], [50][ref3], [51][ref4], [51a][ref5], [56][ref6] en [59][ref7] zijn
      van overeenkomstige toepassing, voor zover het betreft de bepalingen die betrekking hebben op de reguliere
      bouwvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel51a
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel56
      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel59
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '51'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 51a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0005181
        artikel: '56'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0005181
        artikel: '59'
        hoofdstuk: IV
        afdeling: '1'
  - number: 61a.1
    text: |-
      Het is een toegelaten instelling als bedoeld in [artikel 70, eerste lid][ref1], in bij of krachtens algemene
      maatregel van bestuur aangegeven gevallen, verboden zonder vergunning van Onze Minister haar onroerende zaken
      te vervreemden aan of daarop een recht van erfpacht, van opstal of van vruchtgebruik te vestigen ten behoeve van
      een wederpartij die geen zodanige toegelaten instelling en geen huurder van een onroerende zaak van een zodanige
      toegelaten instelling is. Onze Minister stelt voor het aanvragen van een zodanige vergunning en het in verband
      daarmee door de betrokken toegelaten instelling verstrekken van gegevens een formulier vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
  - number: 61a.2
    text: |-
      Onze Minister kan de in het eerste lid bedoelde vergunning weigeren, indien de toegelaten instelling bij een
      voorgenomen vervreemding aan of vestiging van een recht als bedoeld in dat lid naar zijn oordeel:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
  - number: 61a.2.a
    text: onvoldoende rekening houdt met de gevolgen daarvan voor de huurders van de betrokken onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
  - number: 61a.2.b
    text: |-
      onvoldoende motiveert waarom zij afziet van vervreemding aan of vestiging van een zodanig recht ten behoeve van een
      andere wederpartij, of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
  - number: 61a.2.c
    text: |-
      de bij of krachtens algemene maatregel van bestuur gegeven, op een handeling als bedoeld in het eerste lid van
      toepassing zijnde voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
  - number: 61a.3
    text: |-
      Onze Minister kan de in het eerste lid bedoelde vergunning intrekken, indien hem blijkt dat hij de vergunning ten
      gevolge van een onjuiste of onvolledige opgave heeft verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
  - number: 61a.4
    text: |-
      Onze Minister kan de in het eerste lid bedoelde vergunning tevens weigeren of intrekken in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 61a.5
    text: |-
      Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '62.1'
    text: |-
      Bij algemene maatregel van bestuur kan, ten einde gegevens te verkrijgen omtrent omvang en samenstelling van de
      woningvoorraad en omtrent gebruik en bezetting van woningen, worden bepaald dat een algemene woningtelling wordt
      gehouden. In die maatregel worden tijdstip, doel en inhoud van de woningtelling omschreven.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel62
  - number: '62.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen nadere voorschriften omtrent
      de woningtelling worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel62
  - number: '62.3'
    text: |-
      De colleges van burgemeester en wethouders verlenen hun medewerking aan de uitvoering van de in het eerste lid
      bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel62
  - number: '62.4'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur worden voorschriften gegeven omtrent de aan
      gemeenten uit ’s Rijks kas toe te kennen vergoeding van ter zake gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel62
  - number: '63.1'
    text: |-
      Bij koninklijk besluit kunnen burgemeester en wethouders worden verplicht, overeenkomstig bij dat besluit te geven
      voorschriften, een bijzonder onderzoek naar de staat van de volkshuisvesting in te stellen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel63
  - number: '63.2'
    text: |-
      Aan gemeenten kunnen financiële middelen uit ’s Rijks kas worden verstrekt ter bestrijding van de kosten, verbonden
      aan een onderzoek als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel63
  - number: '64'
    text: |-
      Onze Minister verstrekt eenmaal per jaar aan de Staten-Generaal een verslag van de aard en het aantal van de
      woningen die in het jaar, voorafgaand aan het jaar waarin het verslag wordt aangeboden, zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel64
  - number: '65.1'
    text: |-
      Burgemeester en wethouders alsmede gedeputeerde staten verstrekken overeenkomstig bij of krachtens algemene
      maatregel van bestuur gegeven voorschriften informatie ten behoeve van de door Onze Minister ingevolge
      [artikel 64][ref1] aan de Staten-Generaal te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel64
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '64'
        hoofdstuk: V
        afdeling: '2'
  - number: '65.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden in elk geval voorschriften
      gegeven omtrent de aard en omvang van de te verstrekken informatie, de instanties die, alvorens de informatie
      wordt verstrekt, moeten worden gehoord, alsmede de wijze waarop, het tijdstip waarop en de instantie waaraan de
      informatie moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel65
  - number: '69'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 65][ref1], treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel65
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '65'
        hoofdstuk: V
        afdeling: '2'
  - number: '70.1'
    text: |-
      Verenigingen met volledige rechtsbevoegdheid en stichtingen, die zich ten doel stellen uitsluitend op het gebied
      van de volkshuisvesting werkzaam te zijn en niet beogen uitkeringen te doen anders dan in het belang van de
      volkshuisvesting, kunnen bij koninklijk besluit worden toegelaten als instellingen, uitsluitend in het belang van
      de volkshuisvesting werkzaam.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70
  - number: '70.2'
    text: |-
      De toelating, bedoeld in het eerste lid, kan bij koninklijk besluit worden geweigerd of ingetrokken. De toelating
      wordt in elk geval geweigerd, indien de vereniging of de stichting niet voldoet aan het eerste lid of de toelating
      niet in het belang van de volkshuisvesting is te achten. De toelating wordt ingetrokken, indien de toegelaten
      instelling niet langer uitsluitend op het gebied van de volkshuisvesting werkzaam is of uitkeringen doet anders dan
      in het belang van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70
  - number: '70.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere dan de in het tweede lid bedoelde gevallen worden aangegeven,
      waarin de toelating wordt of kan worden geweigerd dan wel wordt of kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70
  - number: '70.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de toelating, alsmede omtrent
      weigering en intrekking van de toelating. Daarbij kan worden bepaald, dat de statuten van de vereniging of de
      stichting voorschrijven dat bij ontbinding van de vereniging of de stichting de vereffening geschiedt door een of
      meer door burgemeester en wethouders van de gemeente, waar de vereniging of de stichting haar woonplaats heeft,
      aangewezen vereffenaars.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70
  - number: 70a.1
    text: |-
      Bij koninklijk besluit kan worden bepaald dat de toegelaten instellingen binnen een bij dat besluit gestelde
      termijn hun statuten moeten aanpassen aan de voorschriften omtrent de toelating, zoals deze luiden op de dag waarop
      dat besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70a
  - number: 70a.2
    text: |-
      Indien een toegelaten instelling geen uitvoering geeft aan een besluit als bedoeld in het eerste lid, kan de
      toelating worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70a
  - number: 70b.1
    text: |-
      Tegen een koninklijk besluit dat strekt tot intrekking van de toelating staat beroep open bij de Afdeling
      bestuursrechtspraak van de Raad van State. De Afdeling oordeelt in hoogste ressort over het beroep. Zij geeft
      daarbij aanvankelijk overeenkomstige toepassing aan [artikel 8:52 van de Algemene wet bestuursrecht][ref1] en kan
      nadien overeenkomstige toepassing geven aan [artikel 8:53 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 70b.2
    text: |-
      Nadat een koninklijk besluit dat strekt tot intrekking van de toelating onherroepelijk is geworden, wordt de
      vereniging of de stichting op vordering van Onze Minister ontbonden door de rechtbank binnen welker rechtsgebied
      zij gevestigd is.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70b
  - number: 70c.1
    text: |-
      De toegelaten instellingen huisvesten bij voorrang personen die door hun inkomen of door andere omstandigheden
      moeilijkheden ondervinden bij het vinden van hun passende huisvesting. Bij het in gebruik geven van door hen
      beheerde woningen met een verhoudingsgewijs lage huurprijs geven zij zo veel mogelijk voorrang aan woningzoekenden
      die, gelet op hun inkomen, in het bijzonder op die woningen zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2
    text: |-
      De toegelaten instellingen nemen bij hun werkzaamheden voorts de daaromtrent bij of krachtens algemene maatregel
      van bestuur gegeven voorschriften in acht. Deze voorschriften betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.a
    text: het verwerven, bouwen, bezwaren en vervreemden van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.b
    text: het treffen van voorzieningen aan woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.c
    text: het verhuren van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.d
    text: de wijze van beheer van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.e
    text: de exploitatie van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.f
    text: de bestemming van batige saldi;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.g
    text: het financiële beleid en beheer;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.h
    text: de verslaglegging;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.i
    text: de inrichting van de administratie en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.2.j
    text: overleg met en verplichtingen ten opzichte van huurders.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur kan worden bepaald dat het eerste lid, alsmede
      voorschriften als bedoeld in het tweede lid, van toepassing zijn op gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70c.4
    text: |-
      Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kunnen de in dat lid genoemde
      voorschriften voorts worden gegeven voor standplaatsen en woonwagens, instellingen waarin aan ten minste vijf
      personen van 65 jaar of ouder duurzaam verblijf en verzorging wordt verschaft, onroerende aanhorigheden van
      woningen, standplaatsen, woonwagens en zodanige verzorgingshuizen, alsmede de woonomgeving.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70c
  - number: 70d.1
    text: |-
      De toegelaten instellingen staan onder toezicht van Onze Minister, behoudens
      [artikel 71a, eerste lid, aanhef en onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
  - number: 70d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden omtrent het toezicht nadere voorschriften gegeven. Daarbij
      kan worden bepaald dat in de bij die maatregel aangegeven gevallen:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70d
  - number: 70d.2.a
    text: |-
      Onze Minister een toegelaten instelling een aanwijzing kan geven om een of meer handelingen te verrichten of na
      te laten;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70d
  - number: 70d.2.b
    text: een toegelaten instelling bepaalde handelingen slechts kan verrichten na voorafgaande goedkeuring of
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70d
  - number: 70d.2.c
    text: |-
      ten behoeve van door een toegelaten instelling te verrichten handelingen een plan wordt opgesteld door een door
      Onze Minister aan te wijzen persoon of instantie.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70d
  - number: 70e.1
    text: |-
      Indien een toegelaten instelling ernstige schade aan het belang van de volkshuisvesting berokkent, redelijkerwijs
      in die situatie geen verbetering te voorzien is en een andere daartegen gerichte maatregel dan het onder bewind
      stellen van die toegelaten instelling niet doeltreffender zou zijn, kan de rechtbank binnen welker rechtsgebied die
      toegelaten instelling gevestigd is haar onder bewind stellen op een daartoe strekkend verzoek van Onze Minister.
      Onze Minister kan bij zijn verzoek personen voor benoeming tot bewindvoerder voordragen en voorstellen doen omtrent
      hun beloning.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70e
  - number: 70e.2
    text: |-
      De rechtbank behandelt het verzoek binnen twee weken nadat hij het heeft ontvangen. Hij kan inzage nemen of,
      door daartoe door hem aangewezen deskundigen, doen nemen van zakelijke gegevens en bescheiden van de betrokken
      toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70e
  - number: 70e.3
    text: |-
      Een toegelaten instelling die surseance van betaling heeft aangevraagd, aan welke surseance van betaling is
      verleend, van welke het faillissement is aangevraagd of die failliet is verklaard kan niet onder bewind worden
      gesteld in de zin van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70e
  - number: 70f.1
    text: |-
      Bij een beslissing waarbij een toegelaten instelling onder bewind wordt gesteld, benoemt de rechtbank een of meer
      bewindvoerders en regelt hij hun beloning. De beloning komt voor rekening van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70f
  - number: 70f.2
    text: |-
      De bewindvoerders maken onverwijld een uittreksel van de uitspraak bekend in de Staatscourant en in een of meer bij
      de uitspraak aangewezen nieuwsbladen. Het uittreksel vermeldt naam en woonplaats van de toegelaten instelling en de
      woonplaats of het kantoor van de bewindvoerders, alsmede de datum van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70f
  - number: 70f.3
    text: |-
      De uitspraak is uitvoerbaar bij voorraad, onverminderd enige daartegen gerichte voorziening. Gedurende acht dagen
      na de uitspraak kan daartegen hoger beroep worden ingesteld bij het gerechtshof binnen welks rechtsgebied de
      betrokken toegelaten instelling gevestigd is. Het gerechtshof behandelt het beroep binnen twee weken nadat het het
      beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70f
  - number: 70f.4
    text: |-
      Gedurende acht dagen na de uitspraak van het gerechtshof in hoger beroep kan daartegen beroep in cassatie worden
      ingesteld. De Hoge Raad behandelt het beroep binnen twee weken nadat hij het beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70f
  - number: 70g.1
    text: |-
      De bewindvoerders oefenen bij uitsluiting alle bevoegdheden uit van de organen van de toegelaten instelling, tenzij
      de rechtbank heeft bepaald dat een orgaan zijn bevoegdheden kan blijven uitoefenen. Zij doen voorts onverwijld
      aan de Kamer van Koophandel en Fabrieken binnen welker gebied de toegelaten instelling gevestigd is opgaaf van de
      uitspraak van de rechtbank en van de gegevens omtrent zichzelf die omtrent een bestuurder worden verlangd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70g
  - number: 70g.2
    text: |-
      Een rechtshandeling die door een orgaan van de toegelaten instelling wordt verricht na de uitspraak van de
      rechtbank en voor het tijdstip waarop degenen die bij die rechtshandeling een belang hebben voor het eerst van
      die uitspraak kennis kunnen nemen, is geldig. Het tijdstip, bedoeld in de eerste volzin, is de tweede dag na de
      dagtekening van de Staatscourant waarin een uittreksel van die uitspraak is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70g
  - number: 70h.1
    text: |-
      De leden van de organen van de toegelaten instelling en de personen die voor haar werkzaamheden verrichten,
      verlenen alle door de bewindvoerders gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70h
  - number: 70h.2
    text: |-
      Indien meer dan een bewindvoerder is benoemd, is voor de geldigheid van hun handelingen toestemming van de
      meerderheid of, bij staking van stemmen, een beslissing van de president van de rechtbank vereist.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70h
  - number: 70h.3
    text: |-
      De rechtbank kan te allen tijde een bewindvoerder ontslaan en hem door een andere bewindvoerder vervangen, dan
      wel aan hem een of meer bewindvoerders toevoegen, een en ander ambtshalve dan wel op verzoek van die bewindvoerder
      zelf, van een of meer andere bewindvoerders of van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70h
  - number: 70h.4
    text: |-
      De bewindvoerders brengen tijdens de uitoefening van hun bevoegdheden telkens na verloop van drie maanden, alsmede
      na beëindiging daarvan, zo spoedig mogelijk verslag over hun werkzaamheden uit aan de rechtbank en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70h
  - number: 70i.1
    text: |-
      Het bewind eindigt twee jaar na de uitspraak van de rechtbank waarbij de betrokken toegelaten instelling onder
      bewind is gesteld. Het bewind eindigt voorts met onmiddellijke ingang na het onherroepelijk worden van een
      benoeming van een of meer bewindvoerders in een aan de betrokken toegelaten instelling verleende surseance van
      betaling of van een of meer curatoren in haar faillissement.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70i
  - number: 70i.2
    text: |-
      Indien naar het oordeel van Onze Minister voor het tijdstip, genoemd in de eerste volzin van het eerste
      lid, de voorwaarden zijn geschapen waaronder de toelating niet langer ernstige schade aan het belang van de
      volkshuisvesting berokkent en niet op korte termijn ernstige schade aan dat belang zal berokkenen, verzoekt hij
      de rechtbank het bewind op te heffen. Bij zijn besluit waarbij het bewind wordt opgeheven, ontslaat de rechtbank
      de bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70i
  - number: 70j.1
    text: |-
      Verenigingen met volledige rechtsbevoegdheid en stichtingen, die mede in het belang van de volkshuisvesting
      werkzaam zijn, kunnen bij koninklijk besluit als toegelaten instelling worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70j
  - number: 70j.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de toelating, weigering en
      intrekking van de toelating, alsmede omtrent de werkzaamheden van en het toezicht op instellingen als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70j
  - number: 70j.3
    text: |-
      De [artikelen 70, tweede, derde en vierde lid][ref1], [70a][ref2], [70b][ref3], [70d tot en met 70i][ref4] en
      [105][ref5] zijn voorzover mogelijk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70b
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel105
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70j
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70a
        hoofdstuk: V
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 70b
        hoofdstuk: V
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 70d
        hoofdstuk: V
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
  - number: 70k
    text: |-
      Een algemene maatregel van bestuur als bedoeld in de [artikelen 70][ref1], [70c][ref2], [70d][ref3] en [70j][ref4]
      treedt niet eerder in werking dan twee maanden na de datum van uitgifte van het Staatsblad waarin hij is geplaatst.
      Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70j
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel70k
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70c
        hoofdstuk: V
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 70d
        hoofdstuk: V
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 70j
        hoofdstuk: V
        afdeling: '3'
  - number: '71'
    text: |-
      Er is een Centraal Fonds voor de Volkshuisvesting. Het Centraal Fonds voor de Volkshuisvesting bezit
      rechtspersoonlijkheid. Het is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71
  - number: 71a.1
    text: 'Het fonds:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71a
  - number: 71a.1.a
    text: |-
      verstrekt subsidie aan toegelaten instellingen ter bevordering van de sanering van toegelaten instellingen die
      niet beschikken over de noodzakelijk te achten financiële middelen, of, volgens bij algemene maatregel van bestuur
      gegeven voorschriften, ter tegemoetkoming in de kosten van werkzaamheden van toegelaten instellingen, en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71a
  - number: 71a.1.b
    text: |-
      verricht taken in het kader van het toezicht op toegelaten instellingen, voorzover die taken bij algemene maatregel
      van bestuur zijn aangegeven, welke taken de financiële aspecten van de werkzaamheden van die instellingen betreffen
      en tot welke taken kan behoren het aan Onze Minister verschaffen van inzicht in de financiële situatie van die
      instellingen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71a
  - number: 71a.2
    text: Uit het fonds worden geen garanties verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71a
  - number: 71a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent maatregelen die het fonds jegens
      toegelaten instellingen kan nemen bij het door hen niet nakomen van een jegens het fonds bestaande verplichting.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71a
  - number: 71a.4
    text: |-
      Onze Minister informeert beide kamers der Staten-Generaal over het hem verschafte inzicht in de financiële
      situatie, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71a
  - number: 71b.1
    text: |-
      Het fonds stelt jaarlijks voor 1 december beleidsregels vast, waarin wordt bepaald op welke wijze het fonds
      uitvoering geeft aan [artikel 71a][ref1] en de daarop berustende algemene maatregelen van bestuur. De beleidsregels
      zijn van toepassing op het eerstvolgende kalenderjaar. Het fonds doet een afschrift van de beleidsregels aan Onze
      Minister toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
  - number: 71b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de inhoud en de
      bekendmaking van de in het eerste lid bedoelde beleidsregels.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71b
  - number: 71c.1
    text: |-
      Het bestuur van het fonds bestaat met inbegrip van de voorzitter uit ten minste drie en ten hoogste vijf leden.
      Onze Minister benoemt de voorzitter en de andere bestuursleden.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71c.2
    text: De bestuursleden worden, behoudens tussentijds ontslag, benoemd voor de tijd van ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71c.3
    text: |-
      De bestuursleden kunnen te allen tijde ontslag nemen door een schriftelijke kennisgeving aan Onze Minister. Degene
      die in het bestuur is benoemd ter vervulling van een tussentijds opengevallen plaats treedt af op het tijdstip
      waarop degene in wiens plaats de benoeming is geschied had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71c.4
    text: 'Onverenigbaar met het bestuurslidmaatschap van het fonds zijn:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71c.4.a
    text: |-
      het lidmaatschap van een orgaan van, en een functie bij, een toegelaten instelling of een organisatie die zich ten
      doel heeft gesteld de belangen van toegelaten instellingen te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71c.4.b
    text: |-
      het lidmaatschap van een college van burgemeester en wethouders of van een orgaan van een organisatie die zich ten
      doel heeft gesteld de belangen van gemeenten te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71c.4.c
    text: een functie als ambtenaar bij een ministerie en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71c.4.d
    text: |-
      een functie als ambtenaar bij een gemeente, een functie bij een organisatie als bedoeld in onderdeel b, een functie
      bij een financiële instelling en enige andere functie, indien de aan de betrokken functie verbonden werkzaamheden
      meebrengen dat een betrokkenheid ontstaat of kan ontstaan bij de werkzaamheden van het fonds of bij de ontwikkeling
      of de uitvoering van het rijksbeleid op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71c
  - number: 71d.1
    text: Het fonds stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71d
  - number: 71d.2
    text: |-
      Het bestuursreglement en elke wijziging daarvan behoeft de goedkeuring van Onze Minister. Onze Minister kan het
      bestuursreglement gedeeltelijk goedkeuren of aan de goedkeuring voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71d
  - number: 71d.3
    text: |-
      Indien Onze Minister het voornemen heeft aan het bestuursreglement geheel of gedeeltelijk goedkeuring te onthouden,
      dan wel voorwaarden aan de goedkeuring te verbinden, stelt hij het fonds daarvan in kennis en stelt hij het in de
      gelegenheid binnen ten hoogste vier weken na die kennisgeving wijzigingen in het bestuursreglement aan te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71d
  - number: 71e.1
    text: De middelen van het fonds worden gevormd door de bijdragen, bedoeld in het tweede lid, en andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71e
  - number: 71e.2
    text: |-
      Elke toegelaten instelling die op 1 januari van een kalenderjaar als zodanig bestaat, is over dat kalenderjaar een
      bijdrage aan het fonds verschuldigd. Het fonds bepaalt de hoogte van de bijdrage volgens bij of krachtens algemene
      maatregel van bestuur te geven voorschriften. Het besluit tot bepaling van de hoogte van de bijdrage behoeft de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71e
  - number: 71e.3
    text: |-
      Onze Minister kan, indien hij van oordeel is dat het fonds op de in het tweede lid bedoelde datum over voldoende
      financiële middelen zal beschikken om zonder storting van een bijdrage als bedoeld in dat lid ten minste een jaar
      uitvoering te geven aan [artikel 71a, eerste lid][ref1], voor die datum bepalen dat een zodanige bijdrage niet
      verschuldigd is over het jaar waarin die datum valt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
  - number: 71f.1
    text: Het fonds stelt jaarlijks voor 1 november een begroting vast voor het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71f
  - number: 71f.2
    text: De begroting behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71f
  - number: 71f.3
    text: Bij ministeriële regeling kunnen voorschriften omtrent de inrichting van de begroting worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71f
  - number: 71g.1
    text: |-
      Het fonds brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over het afgelopen kalenderjaar
      uit, dat vergezeld gaat van een verklaring omtrent de getrouwheid van de jaarrekening en de rechtmatigheid van
      de gedane uitgaven, afgegeven door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het
      Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71g
  - number: 71g.2
    text: Het fonds stelt de in het eerste lid genoemde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71g
  - number: 71g.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent het financiële verslag en de
      accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71g
  - number: 71h
    text: |-
      Het fonds stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71h
  - number: 71i
    text: |-
      Het fonds verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71i
  - number: 71j.1
    text: |-
      De rechtspositie van het personeel van het fonds is in overeenstemming met de regels die gelden voor ambtenaren die
      zijn aangesteld bij ministeries, met dien verstande dat waar in deze regels een bevoegdheid is toegekend aan een
      andere minister dan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, deze bevoegdheid wordt uitgeoefend
      door het bestuur van het fonds.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71j
  - number: 71j.2
    text: Bij algemene maatregel van bestuur kan worden afgeweken van de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71j
  - number: 71k.1
    text: |-
      Indien naar het oordeel van Onze Minister het fonds ernstig in gebreke blijft of op korte termijn ernstig in
      gebreke zal blijven bij het verrichten van zijn taken, kan hij het bestuur van het fonds schorsen of ontslaan,
      in welke gevallen hij in vervanging van het geschorste of ontslagen bestuur voorziet, met dien verstande dat een
      schorsing niet langer duurt dan noodzakelijk is om de voorwaarden te scheppen waaronder het fonds naar het oordeel
      van Onze Minister zijn taken weer naar behoren kan verrichten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71k
  - number: 71k.2
    text: |-
      Indien en zolang een geschorst of ontslagen bestuur niet kan worden vervangen, verricht Onze Minister de taken van
      het fonds, in welk geval:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71k
  - number: 71k.2.a
    text: dit geschiedt op kosten van het fonds en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71k
  - number: 71k.2.b
    text: Onze Minister dit onverwijld meedeelt aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71k
  - number: 71l
    text: |-
      Onze Minister zendt zo spoedig mogelijk na 1 januari 2002 en vervolgens telkens na vier jaar aan de Staten-Generaal
      een verslag over de doeltreffendheid en doelmatigheid van het functioneren van het fonds.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel71l
  - number: '73'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in de [artikelen 71a][ref1], [71b][ref2] en [71e][ref3], treedt niet
      eerder in werking dan twee maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de
      plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel71b
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel71e
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 71b
        hoofdstuk: V
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 71e
        hoofdstuk: V
        afdeling: 3A
  - number: '75.1'
    text: |-
      Burgemeester en wethouders kunnen, ingeval dit noodzakelijk is voor het naar behoren uitvoeren van deze wet,
      besluiten rechtstreeks van gemeentewege voorzieningen in het belang van de volkshuisvesting te treffen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel75
  - number: '75.2'
    text: |-
      Indien ter uitvoering van het eerste lid van gemeentewege woningen, woonwagens of standplaatsen worden gebouwd,
      geschiedt dit slechts, indien aannemelijk is, dat door het bouwen van woningen, woonwagens of standplaatsen door
      toegelaten instellingen niet voldoende in de woningbehoefte zal worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel75
  - number: '80.1'
    text: |-
      Indien blijkt, dat in een gemeente onvoldoende wordt voorzien in de volkshuisvesting, kan bij koninklijk besluit,
      gedeputeerde staten gehoord, de gemeenteraad onderscheidenlijk burgemeester en wethouders of het bevoegde gezag van
      een samenwerkingsverband van gemeenten worden verplicht de in dat besluit aangegeven voorzieningen in het belang
      van de volkshuisvesting te treffen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel80
  - number: '80.2'
    text: |-
      Indien blijkt, dat in een provincie onvoldoende wordt voorzien in de volkshuisvesting, kunnen bij koninklijk
      besluit, de inspecteur gehoord, provinciale staten of gedeputeerde staten worden verplicht de in dat besluit
      aangegeven voorzieningen in het belang van de volkshuisvesting te treffen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel80
  - number: '80.3'
    text: |-
      Bij het in het eerste en tweede lid bedoelde besluit kan worden bepaald op welke wijze en binnen welke termijn aan
      dat besluit moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel80
  - number: '80.4'
    text: |-
      Indien de gemeenteraad onderscheidenlijk burgemeester en wethouders of het bevoegde gezag van het
      samenwerkingsverband van gemeenten niet binnen de in het derde lid bedoelde termijn heeft voldaan aan het in het
      eerste lid bedoelde besluit, geven gedeputeerde staten uitvoering aan dat besluit op kosten van de gemeente of het
      samenwerkingsverband van gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel80
  - number: '80.5'
    text: |-
      Indien provinciale staten of gedeputeerde staten niet binnen de in het derde lid bedoelde termijn hebben voldaan
      aan het in het tweede lid bedoelde besluit, geeft Onze Minister uitvoering aan dat besluit op kosten van de
      provincie.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel80
  - number: '80.6'
    text: |-
      Indien hetgeen ingevolge het derde lid is bepaald, niet strookt met de voorschriften van enige plaatselijke,
      regionale of provinciale verordening, blijven die voorschriften buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel80
  - number: '81.1'
    text: |-
      Uit 's Rijks kas kunnen aan gemeenten, plusregio’s als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] of provincies financiële middelen worden verstrekt
      voor andere activiteiten dan die waarvoor ingevolge de [Wet stedelijke vernieuwing][ref2] subsidie kan worden
      verleend, voorzover deze activiteiten passen in het rijksbeleid met betrekking tot het bouwen, het wonen en de
      woonomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0011788
  - number: '81.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent het verstrekken van financiële
      middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: '81.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen voorschriften worden gegeven omtrent het
      door provincies overdragen van krachtens het tweede lid aan hen toegekende bevoegdheden en verplichtingen aan een
      gemeente of aan een plusregio. De voorschriften betreffen in elk geval:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: 81.3.a
    text: het geval waarin een provincie bevoegdheden en verplichtingen al dan niet dient over te dragen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: 81.3.b
    text: |-
      de gehoudenheid van een provincie uitvoering te geven aan een door Onze Minister gegeven aanwijzing ter zake van
      een overdracht als bedoeld in onderdeel a, binnen een in die aanwijzing bepaalde termijn, en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: 81.3.c
    text: de wijze waarop in geval van overdracht verantwoording aan Onze Minister wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: '81.4'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kan worden bepaald dat de
      gemeenteraad, het algemeen bestuur van een plusregio of provinciale staten voorschriften geeft of geven omtrent
      het door burgemeester en wethouders, het dagelijks bestuur van een plusregio of gedeputeerde staten verstrekken van
      subsidie ten laste van de uit ’s Rijks kas aan hen verstrekte financiële middelen voor de activiteiten, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: '81.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bevordering van eenheid in de voorschriften, bedoeld in het vierde
      lid, regelen worden gegeven omtrent de inhoud van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: '81.6'
    text: |-
      De gemeenteraad, het algemeen bestuur van een plusregio of provinciale staten brengen de door hen gegeven
      voorschriften, bedoeld in het vierde lid, binnen zes maanden na het van kracht worden van de algemene maatregel
      van bestuur, bedoeld in het vijfde lid, in overeenstemming met de bij die algemene maatregel van bestuur gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel81
  - number: '82.1'
    text: |-
      Uit 's Rijks kas kan aan anderen dan gemeenten, plusregio's als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] of provincies subsidie worden verstrekt voor andere
      activiteiten dan die waarvoor ingevolge de [artikelen 19][ref2] en [20 van de Wet stedelijke vernieuwing][ref3]
      subsidie kan worden verleend, voorzover deze activiteiten passen in het rijksbeleid met betrekking tot het bouwen,
      het wonen en de woonomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0011788#Artikel20
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0011788
        artikel: '20'
  - number: '82.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent het verstrekken van subsidie,
      bedoeld in het eerste lid. De voorschriften betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.a
    text: de doeleinden waarvoor de subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.b
    text: degenen aan wie de subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.c
    text: de wijze van aanvragen van de subsidie;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.d
    text: de bij de subsidie-aanvraag over te leggen gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.e
    text: de termijnen voor de beslissing op de subsidie-aanvraag;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.f
    text: de gronden om geen subsidie te verstrekken;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.g
    text: de voorwaarden waaronder de subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.h
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.i
    text: de totstandkoming van het subsidiebedrag;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.j
    text: de termijnen voor de beslissing omtrent de subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.k
    text: de vaststelling van het subsidieplafond en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: 82.2.l
    text: de wijze van verdeling van het beschikbare bedrag.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel82
  - number: '83'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in de [artikelen 81][ref1] en [82][ref2], treedt niet eerder in
      werking dan twee maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing
      wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel82
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '81'
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '82'
        hoofdstuk: V
        afdeling: '5'
  - number: '84'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het door burgemeester
      en wethouders, gedeputeerde staten en het dagelijks bestuur van een samenwerkingsverband van gemeenten verstrekken
      van voor het verstrekken van financiële middelen van belang zijnde gegevens. De financiële gevolgen van het
      verstrekken van die gegevens worden niet gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel84
  - number: '86'
    text: |-
      Gegevens betreffende de door het Rijk verstrekte financiële middelen en subsidie worden jaarlijks op een door Onze
      Minister te bepalen wijze bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel86
  - number: '88.1'
    text: |-
      Alle stukken, opgemaakt ter uitvoering van de afdelingen 4 en 5 van dit hoofdstuk, voor zover die stukken
      betrekking hebben op bij of krachtens algemene maatregel van bestuur gegeven categorieën van woningen,
      standplaatsen of woonwagens, zijn vrij van legesheffing, van de kosten van legalisatie en van griffiekosten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel88
  - number: '88.2'
    text: |-
      De in het eerste lid bedoelde vrijdom van legesheffing geldt niet ten aanzien van bij de in dat lid bedoelde
      algemene maatregel van bestuur aangewezen vormen van legesheffing. Bij die algemene maatregel van bestuur kunnen
      ter zake nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel88
  - number: '93.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel93
  - number: '93.2'
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel93
  - number: '94.1'
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel94
  - number: '94.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '94.3'
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel94
  - number: '95.1'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking zenden burgemeester en wethouders aan de inspecteur
      een afschrift van elke verordening, elk besluit of elk aan de raad overlegd verslag, de volkshuisvesting
      betreffende. De financiële gevolgen van het zenden van die afschriften worden niet gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel95
  - number: '95.2'
    text: |-
      Burgemeester en wethouders geven aan de inspecteur alle door deze verlangde inlichtingen omtrent de naleving van de
      wetten en de krachtens die wetten gegeven voorschriften op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel95
  - number: '96.1'
    text: |-
      Met het toezicht op de uitvoering van het bij of krachtens deze wet bepaalde zijn tevens belast de bij besluit van
      de commissaris van de Koning aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel96
  - number: '96.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '97.1'
    text: |-
      Indien overtreding van de bij of krachtens [hoofdstuk I][ref1], [II][ref2], [III][ref3], of [IV][ref4]
      gegeven voorschriften met betrekking tot de staat of het gebruik van een gebouw, open erf of terrein
      gepaard gaat met een bedreiging van de leefbaarheid of een gevaar voor de veiligheid of de gezondheid,
      en er een klaarblijkelijk gevaar is op herhaling van de overtreding, kunnen burgemeester en wethouders
      besluiten dat gebouw, dat open erf of dat terrein te sluiten. De [artikelen 5:24, vierde lid][ref5], en
      [5:25 tot en met 5:28 van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '97.2'
    text: |-
      Burgemeester en wethouders bepalen in het besluit, bedoeld in het eerste lid, de duur van de
      sluiting en doen dat besluit zo spoedig mogelijk inschrijven in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1]. [Artikel 24 van dat boek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '100'
    text: |-
      Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bepaalde bij of krachtens de
      [hoofdstukken I tot en met IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
  - number: 100a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [hoofdstukken I tot en met IV][ref1] zijn
      belast de bij besluit van burgemeester en wethouders aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
  - number: 100a.2
    text: |-
      De krachtens het eerste lid aangewezen ambtenaren zijn bevoegd met medeneming van de benodigde apparatuur een
      woning te betreden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100a
  - number: 100a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het uitoefenen van
      toezicht op de naleving van de bij of krachtens de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur
      gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 100b.1
    text: |-
      Onze Minister kan, indien dat in het belang van de naleving van het bepaalde bij of krachtens [hoofdstuk I][ref1],
      [II][ref2], [III][ref3] of [IV][ref4] dringend geboden is, vorderen dat burgemeester en wethouders ter zake van de
      overtreding van een bij of krachtens [hoofdstuk I][ref5], [II][ref6], [III][ref7] of [IV][ref8] gesteld voorschrift
      binnen een door hem te stellen termijn een beschikking tot toepassing van bestuursdwang of oplegging van een last
      onder dwangsom uitvoeren, dan wel geven en uitvoeren. Burgemeester en wethouders doen van de wijze waarop gevolg is
      gegeven aan de vordering schriftelijk mededeling aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
      [ref5]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
      [ref6]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref7]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref8]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0005181
        hoofdstuk: I
      - id: ref6
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref8
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: 100b.2
    text: |-
      Indien burgemeester en wethouders niet of niet volledig gevolg geven aan een vordering kan Onze Minister voor
      rekening van de gemeente daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100b
  - number: 100b.3
    text: |-
      [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is van toepassing, met dien verstande dat voor «het
      bestuursorgaan dat bestuursdwang heeft toegepast» wordt gelezen: burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 100b.4
    text: |-
      Onze Minister kan bij zijn vorderingsbesluit bepalen dat in afwijking van
      [artikel 5:25 van de Algemene wet bestuursrecht][ref1] de aan de uitvoering van de beschikking verbonden kosten
      voor rekening van de gemeente blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 100c.1
    text: |-
      Burgemeester en wethouders maken jaarlijks hun voornemens bekend met betrekking tot de wijze waarop in het komende
      jaar uitvoering zal worden gegeven aan de bestuursrechtelijke handhaving van het bepaalde bij of krachtens de
      [hoofdstukken I tot en met IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
  - number: 100c.2
    text: |-
      Burgemeester en wethouders doen jaarlijks verslag aan de gemeenteraad van de wijze waarop in het voorgaande
      jaar uitvoering is gegeven aan de bestuursrechtelijke handhaving van het bepaalde bij of krachtens de
      [hoofdstukken I tot en met IV][ref1], alsmede van het door hen gevoerde beleid bij de uitvoering van die
      hoofdstukken. Burgemeester en wethouders zenden gelijktijdig met de aanbieding van het verslag aan de gemeenteraad
      een afschrift ervan aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
  - number: 100d
    text: |-
      Een besluit tot toepassing van bestuursdwang of oplegging van een last onder dwangsom gericht op naleving van
      het bepaalde bij of krachtens [hoofdstuk I][ref1], [II][ref2], [III][ref3] of [IV][ref4] kan inhouden dat het
      bouwen, gebruik of slopen wordt gestaakt dan wel dat voorzieningen, met inbegrip van het slopen van een bouwwerk
      of standplaats, gericht op het tegengaan of beëindigen van gevaar voor de gezondheid of de veiligheid worden
      getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: 100e.1
    text: |-
      Een besluit tot toepassing van bestuursdwang of oplegging van een last onder dwangsom gericht op naleving van
      het bepaalde bij of krachtens [hoofdstuk I][ref1], [II][ref2], [III][ref3] of [IV][ref4] geldt mede jegens
      de rechtsopvolger van degene aan wie dat besluit is opgelegd alsmede jegens iedere verdere rechtsopvolger en
      kan, tenzij bijzondere omstandigheden zich daartegen verzetten, jegens die rechtsopvolger of iedere verdere
      rechtsopvolger worden ten uitvoer gelegd, met dien verstande dat de kosten van die tenuitvoerlegging en een te
      innen dwangsom bij de betreffende rechtsopvolger dan wel iedere verdere rechtsopvolger kunnen worden ingevorderd,
      zulks ter beoordeling van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: 100e.2
    text: |-
      Het eerste lid geldt uitsluitend voor zover het in dat lid bedoelde besluit na de bekendmaking
      ervan is aangeboden ten behoeve van inschrijving in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1]. [Artikel 24, derde lid, van dat boek][ref2] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel100e
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '101.1'
    text: |-
      Onverminderd de artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden kunnen,
      ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de artikelen 101a, 102, en 103 gezamenlijk in werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel101
  - number: '101.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel101
  - number: '101.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel101
  - number: '101.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel101
  - number: '101.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel101
  - number: '101.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel101
  - number: '104'
    text: |-
      Indien toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gegeven voorschriften leidt
      tot het slopen van een bouwwerk, worden de overblijvende materialen door burgemeester en wethouders in het openbaar
      verkocht, tenzij, naar redelijkerwijs is te verwachten, bij onderhandse verkoop een hogere opbrengst kan worden
      verkregen. De opbrengst wordt, na aftrek van de kosten van het slopen en van de verkoop, aan de rechthebbende
      uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel104
  - number: '105.1'
    text: |-
      Onze Minister kan aan een toegelaten instelling die in strijd handelt met het bepaalde bij of
      krachtens [artikel 70][ref1], [70a][ref2] of [70c][ref3], of met een maatregel als bedoeld in
      [artikel 70d, tweede lid, tweede volzin, onderdeel a, b of c][ref4], een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70a
        hoofdstuk: V
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 70c
        hoofdstuk: V
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 70d
        hoofdstuk: V
        afdeling: '3'
  - number: '105.2'
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '105.3'
    text: |-
      Dwangsommen die zijn verbeurd door toepassing van het eerste lid worden gestort in het Centraal Fonds voor de
      Volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel105
  - number: 105a
    text: |-
      Overtreding van [artikel 14, vierde lid][ref1], wordt gestraft met geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '116'
    text: |-
      Op de gezamenlijke voordracht van Onze Minister en van Onze Minister die het mede aangaat, kan bij koninklijk
      besluit worden bepaald, dat deze wet niet van toepassing is op een in dat besluit aan te wijzen werk ten behoeve
      van de landsverdediging.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel116
  - number: '118'
    text: |-
      Indien de bekendmaking van beschikkingen op grond van deze wet niet kan geschieden op de wijze als voorzien in
      [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1], geschiedt zij door openbare bekendmaking op
      het perceel waarop de beschikking betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '120.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met het oog op de nakoming van
      voor Nederland verbindende internationale verplichtingen die betrekking hebben op of samenhangen met onderwerpen
      waarin bij of krachtens deze wet is voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120
  - number: '120.2'
    text: |-
      Gedragingen in strijd met voorschriften als bedoeld in het eerste lid, niet zijnde voorschriften als bedoeld in
      [artikel 8, negende lid][ref1], zijn verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 120a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat Onze Minister bij wege van experiment
      tijdelijk van bij of krachtens algemene maatregel van bestuur gegeven voorschriften kan afwijken of een zodanige
      afwijking kan toestaan.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120a
  - number: 120a.2
    text: 'Indien toepassing wordt gegeven aan het eerste lid, wordt in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120a
  - number: 120a.2.a
    text: de wijze waarop tot een keuze voor experimenten als bedoeld in het eerste lid wordt gekomen;
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120a
  - number: 120a.2.b
    text: de ten hoogste toegestane tijdsduur van een afwijking als bedoeld in het eerste lid en
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120a
  - number: 120a.2.c
    text: |-
      de wijze waarop tot de vaststelling wordt gekomen of een experiment als bedoeld in het eerste lid zodanig geslaagd
      is, dat het wettelijk voorschrift waarvan bij wege van dat experiment is afgeweken zou moeten worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120a
  - number: 120b
    text: |-
      Onze Minister is belast met de bestuursrechtelijke handhaving van het verbod, bedoeld in
      [artikel 120, tweede lid][ref1], en beschikt daartoe over de bevoegdheid tot toepassing van bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel120b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: '121'
    text: |-
      De bevoegdheid, de gemeenteraad toekomende overeenkomstig [artikel 149 van de Gemeentewet][ref1], mag niet worden
      uitgeoefend ten aanzien van de onderwerpen waarin is voorzien bij of krachtens de algemene maatregelen van bestuur,
      bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel149
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '149'
  - number: 121.a
    text: |-
      [artikel 12a, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 121.b
    text: |-
      [artikel 40a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 40a
        hoofdstuk: IV
        afdeling: '1'
  - number: 121.c
    text: |-
      [artikel 43, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
  - number: 121.d
    text: |-
      [artikel 44, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 121.e
    text: |-
      [artikel 70c, tweede lid, eerste volzin][ref1], voorzover die algemene maatregel van bestuur betrekking heeft op
      toegelaten instellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 70c
        hoofdstuk: V
        afdeling: '3'
  - number: 121.f
    text: |-
      [artikel 100a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel100a
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 100a
        hoofdstuk: VI
        afdeling: '2'
  - number: '122'
    text: |-
      De gemeente kan geen rechtshandelingen naar burgerlijk recht verrichten ten aanzien van de onderwerpen waarin bij
      of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 2][ref1], en in [hoofdstuk IV][ref2] van deze
      wet is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: '125'
    text: |-
      De intrekking van de [Woningwet van 12 juli 1962][ref1] heeft geen gevolgen voor de geldigheid van de krachtens
      die wet bij koninklijk besluit dan wel door Onze Minister gegeven voorschriften, tenzij krachtens deze wet anders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '126.1'
    text: |-
      Gedurende ten hoogste een jaar na het tijdstip van inwerkingtreding van [hoofdstuk II, afdeling 2][ref1], blijft de
      op grond van de [Woningwet van 12 juli 1962][ref2] geldende gemeentelijke bouwverordening, voor zover deze niet in
      strijd is met de bij of krachtens deze wet gegeven voorschriften, van kracht en geldt deze als de bouwverordening,
      genoemd in [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002379
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002379
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '126.2'
    text: |-
      De bouwverordening, genoemd in [artikel 8][ref1], wordt vastgesteld binnen zes maanden na het tijdstip van
      inwerkingtreding van [hoofdstuk II, afdeling 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
        afdeling: '2'
  - number: '127.1'
    text: |-
      Aanschrijvingen die op grond van de [Woningwet van 12 juli 1962][ref1] zijn uitgevaardigd en waartegen geen beroep
      meer kan worden ingesteld, gelden als aanschrijvingen als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '127.2'
    text: |-
      Aanschrijvingen die op grond van de [Woningwet van 12 juli 1962][ref1] zijn uitgevaardigd en waartegen nog beroep
      kan worden ingesteld dan wel beroep is ingesteld, worden afgedaan overeenkomstig genoemde wet en gelden als
      aanschrijvingen als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '128.1'
    text: |-
      Besluiten tot onbewoonbaarverklaring die op grond van de [Woningwet van 12 juli 1962][ref1] zijn genomen en
      waartegen geen beroep meer kan worden ingesteld, gelden als beslissingen tot onbewoonbaarverklaring als bedoeld in
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '128.2'
    text: |-
      Besluiten tot onbewoonbaarverklaring die op grond van de [Woningwet van 12 juli 1962][ref1] zijn genomen en
      waartegen nog beroep kan worden ingesteld dan wel beroep is ingesteld, worden afgedaan overeenkomstig genoemde wet
      en gelden als beslissingen tot onbewoonbaarverklaring als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '129.1'
    text: |-
      Verzoeken om toestemming als bedoeld in [artikel 46 van de Woningwet van 12 juli 1962][ref1], alsmede enig
      beroep, ingesteld tegen een beslissing omtrent een dergelijk verzoek, worden afgedaan overeenkomstig genoemde wet.
      Verzoeken als bedoeld in dit lid, gelden als aanvragen om vergunning als bedoeld in [artikel 61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel129
    references:
      - id: ref1
