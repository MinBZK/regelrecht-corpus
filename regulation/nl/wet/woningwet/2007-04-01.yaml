        afdeling: '2'
  - number: '131.2'
    text: |-
      Woonvergunningen als bedoeld in [artikel 55 van de Woningwet van 12 juli 1962][ref1], waartegen geen beroep meer
      kan worden ingesteld, gelden als woonvergunningen als bedoeld in [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel60
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel131
