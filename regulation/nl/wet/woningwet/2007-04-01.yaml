  - number: '131.1'
    text: |-
      Aanvragen om woonvergunning als bedoeld in [artikel 55 van de Woningwet van 12 juli 1962][ref1], alsmede enig
      beroep, ingesteld tegen een beslissing omtrent een dergelijke aanvraag, worden afgedaan overeenkomstig genoemde
      wet. Aanvragen als bedoeld in dit lid, gelden als aanvragen om woonvergunning als bedoeld in [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel60
    url: https://wetten.overheid.nl/BWBR0005181/2007-04-01#Artikel131
