preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is mede uit het oogpunt van vereenvoudiging en
    vermindering van regelgeving, alsmede uit het oogpunt van decentralisatie nieuwe voorschriften te geven omtrent het
    bouwen en de volkshuisvesting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.a
    text: 'bouwen: plaatsen, geheel of gedeeltelijk oprichten, vernieuwen, veranderen of vergroten;'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.b
    text: 'slopen: het afbreken van een bouwwerk of een gedeelte daarvan;'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.c
    text: |-
      gebouw: elk bouwwerk, dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
