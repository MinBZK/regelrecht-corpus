  - number: 1.1.g
    text: |-
      rooilijn: de lijn die, behoudens toegelaten afwijkingen, bij het bouwen van een bouwwerk aan de wegzijde of aan de
      van de weg afgekeerde zijde niet mag worden overschreden;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.h
    text: |-
      norm: een document, uitgegeven door een deskundig, onafhankelijk instituut, waarin wordt omschreven aan welke eisen
      een bouwmateriaal, bouwdeel of bouwconstructie moet voldoen dan wel waarin een omschrijving wordt gegeven van een
      keurings-, meet- of berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.i
    text: |-
      kwaliteitsverklaring: een schriftelijk bewijs, voorzien van een merkteken, aangewezen door Onze Minister, afgegeven
      door een deskundig, onafhankelijk instituut, aangewezen door Onze Minister, op grond waarvan een bouwmateriaal,
      bouwdeel of samenstel van bouwmaterialen of bouwdelen dan wel een bouwwijze, indien dat bouwmateriaal, bouwdeel of
      samenstel van bouwmaterialen of bouwdelen dan wel die bouwwijze bij het bouwen van een bouwwerk wordt toegepast,
      wordt geacht te voldoen aan krachtens deze wet aan dat bouwmateriaal, bouwdeel of samenstel van bouwmaterialen of
      bouwdelen dan wel die bouwwijze gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.j
    text: 'Onze Minister: Onze Minister voor Wonen, Wijken en Integratie;'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.k
    text: 'inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.l
    text: |-
      toegelaten instelling: instelling als bedoeld in [artikel 70][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
