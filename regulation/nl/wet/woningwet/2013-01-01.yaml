        afdeling: 3A
  - number: 1.1.n
    text: |-
      welstandscommissie: door de gemeenteraad benoemde onafhankelijke commissie die aan burgemeester en wethouders
      advies uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk, waarvoor een aanvraag
      om een omgevingsvergunning voor het bouwen van dat bouwwerk is ingediend, in strijd is met redelijke eisen van
      welstand;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.o
    text: |-
      stadsbouwmeester: door de gemeenteraad benoemde onafhankelijke deskundige die aan burgemeester en wethouders advies
      uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk, waarvoor een aanvraag om een
      omgevingsvergunning voor het bouwen van dat bouwwerk is ingediend, in strijd is met redelijke eisen van welstand;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1.1.p
    text: |-
      stedelijke vernieuwing: op stedelijk gebied gerichte inspanningen die strekken tot verbetering van de leefbaarheid
      en veiligheid, bevordering van een duurzame ontwikkeling en verbetering van de woon- en milieukwaliteit,
      versterking van het economisch draagvlak, versterking van culturele kwaliteiten, bevordering van de sociale
      samenhang, verbetering van de bereikbaarheid, verhoging van de kwaliteit van de openbare ruimte of anderszins tot
      structurele kwaliteitsverhoging van dat stedelijk gebied.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder woning mede verstaan een afzonderlijk
      gedeelte van een gebouw, welk gedeelte tot bewoning is bestemd.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder bouwwerk mede verstaan de daarvan deel
      uitmakende installaties.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
  - number: 1a.1
    text: |-
      De eigenaar van een bouwwerk, open erf of terrein of degene die uit anderen hoofde bevoegd is tot het daaraan
      treffen van voorzieningen draagt er zorg voor dat als gevolg van de staat van dat bouwwerk, open erf of terrein
      geen gevaar voor de gezondheid of veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Een ieder die een bouwwerk bouwt, gebruikt, laat gebruiken of sloopt, dan wel een open erf of terrein gebruikt of
      laat gebruiken, draagt er, voor zover dat in diens vermogen ligt, zorg voor dat als gevolg van dat bouwen, gebruik
      of slopen geen gevaar voor de gezondheid of veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1a
  - number: 1b.1
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk
      toestaat, is het verboden een bouwwerk te bouwen, voor zover daarbij niet wordt
      voldaan aan de op dat bouwen van toepassing zijnde voorschriften, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel a, tweede lid, aanhef en onderdeel d, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.2
    text: |-
      Het is verboden een bestaand bouwwerk, open erf of terrein in een staat te brengen, te laten komen of te houden die
      niet voldoet aan de op de staat van dat bouwwerk, open erf of terrein van toepassing zijnde voorschriften, bedoeld
      in [artikel 2, eerste lid, aanhef en onderdeel b, tweede lid, aanhef en onderdeel a, en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.3
    text: |-
      Het is verboden een bouwwerk, open erf of terrein in gebruik te nemen, te gebruiken of te laten gebruiken, anders
      dan in overeenstemming met de op die ingebruikneming of dat gebruik van toepassing zijnde voorschriften, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel c, tweede lid, aanhef en onderdeel b, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.4
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk toestaat, is het verboden een
      bouwwerk, dan wel deel daarvan, in stand te laten voor zover bij het bouwen daarvan niet is voldaan aan de op dat
      bouwen van toepassing zijnde voorschriften, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1b
  - number: 1b.5
    text: |-
      Het is verboden te slopen voor zover daarbij niet wordt voldaan aan de op dat slopen van toepassing zijnde
      voorschriften, bedoeld in [artikel 2, tweede lid, aanhef en onderdelen c en d, en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '2.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden technische voorschriften gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: 2.1.a
    text: het bouwen van een bouwwerk;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: 2.1.b
    text: de staat van een bestaand bouwwerk;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: 2.1.c
    text: het in gebruik nemen of gebruiken van een bouwwerk.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: '2.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen technische voorschriften worden gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: 2.2.a
    text: de staat van een open erf of terrein;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: 2.2.b
    text: het in gebruik nemen of gebruiken van een open erf of terrein;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: 2.2.c
    text: het slopen;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: 2.2.d
    text: het uitvoeren van bouw- of sloopwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden omtrent de onderwerpen, bedoeld in het eerste lid, onderdeel
      c, en het tweede lid, onderdelen c en d, andere dan technische voorschriften gegeven. Tot de voorschriften
      omtrent het onderwerp, bedoeld in het eerste lid, onderdeel c, behoren in ieder geval: a. voorschriften
      inhoudende een verbod tot ingebruikneming of gebruik zonder het doen van een gebruiksmelding aan het bevoegd
      gezag; b. voorschriften inhoudende de bevoegdheid om bij de bouwverordening, bedoeld in [artikel 8][ref1],
      af te wijken van het aantal personen vanaf waar bij het bieden van nachtverblijf aan die personen krachtens
      [artikel 2.1, eerste lid, onder d, van de Wet algemene bepalingen omgevingsrecht][ref2] een vergunning voor het
      in gebruik nemen of gebruiken van een bouwwerk is vereist. Tot de voorschriften omtrent de onderwerpen, bedoeld
      in het tweede lid, onderdelen c en d, behoren in ieder geval: a. voorschriften inhoudende de verplichting om
      het voornemen te slopen aan het bevoegd gezag te melden; b. voorschriften inhoudende de verplichting te voldoen
      aan aanvullende voorschriften die door het bevoegd gezag bij beschikking kunnen worden gegeven met het oog op
      de lokale situatie. Tot de voorschriften omtrent de onderwerpen, bedoeld in het eerste lid, onderdeel c, en het
      tweede lid, onderdeel d, kunnen behoren voorschriften omtrent de beschikbaarheid van gegevens en bescheiden. Tot de
      voorschriften omtrent het onderwerp, bedoeld in het tweede lid, onderdeel d, kunnen daarnaast behoren voorschriften
      inhoudende de verplichting om de feitelijke aanvang van het uitvoeren van bouwwerkzaamheden, voor zover daarvoor
      een omgevingsvergunning is verleend, of sloopwerkzaamheden aan het bevoegd gezag te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '2.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen omtrent de onderwerpen, bedoeld in het eerste lid, onderdeel
      a, en het tweede lid, onderdelen a en b, andere dan technische voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: '2.5'
    text: |-
      De voorschriften, bedoeld in het eerste, tweede, derde en vierde lid, kunnen uitsluitend worden gegeven vanuit het
      oogpunt van veiligheid, gezondheid, bruikbaarheid, energiezuinigheid of milieu.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: '2.6'
    text: |-
      De voordracht voor een krachtens het eerste, tweede, derde of vierde lid vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2, eerste of tweede lid][ref1], kan
      worden verwezen naar:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 3.a
    text: normen of delen van normen en
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel3
  - number: 3.b
    text: kwaliteitsverklaringen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel3
  - number: '4'
    text: |-
      Indien een bouwwerk gedeeltelijk wordt vernieuwd, veranderd of vergroot, zijn de voorschriften, bedoeld in
      [artikel 2][ref1], voor zover zij betrekking hebben op dat bouwen, slechts van toepassing op die vernieuwing,
      verandering of vergroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '5'
    text: |-
      Op de voordracht van Onze Minister wordt een algemene maatregel van bestuur als bedoeld in
      [artikel 2, eerste lid][ref1], in overeenstemming gebracht met technische voorschriften omtrent het bouwen van een
      bouwwerk, die zijn of worden gegeven bij of krachtens een andere algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '6.1'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2, eerste lid][ref1],
      kan worden bepaald dat van een daarbij gegeven voorschrift omtrent het bouwen van een bouwwerk
      bij een omgevingsvergunning voor het bouwen van een bouwwerk kan worden afgeweken tot een bij dat
      voorschrift aangegeven niveau of, indien sprake is van het geheel of gedeeltelijk vernieuwen of
      veranderen of het vergroten van een bouwwerk dat tevens kan worden aangemerkt als een activiteit
      met betrekking tot een monument als bedoeld in [artikel 2.1, eerste lid, onder f][ref2], dan wel
      [artikel 2.2, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref3], in het belang van de
      monumentenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '6.2'
    text: |-
      Het bevoegd gezag kan van een bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 2, tweede of derde lid][ref1], gegeven voorschrift omtrent het slopen of het uitvoeren van bouw- of
      sloopwerkzaamheden ontheffing verlenen, voor zover dat bij of krachtens die algemene maatregel van bestuur is
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.1'
    text: |-
      Onze Minister kan op verzoek van een aanvrager om een omgevingsvergunning voor het bouwen van een bouwwerk in
      bijzondere gevallen ontheffing verlenen van de bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 2, eerste lid][ref1], gegeven voorschriften omtrent bouwen, met dien verstande dat, indien het verzoek
      betrekking heeft op voorschriften als bedoeld in [artikel 5][ref2], hij de ontheffing slechts kan verlenen in
      overeenstemming met het bij of krachtens de desbetreffende wet daartoe bevoegd verklaarde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, gaat vergezeld van een verklaring van het bevoegd gezag, dat het de
      desbetreffende omgevingsvergunning zal verlenen indien ontheffing als bedoeld in dat lid, is verkregen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid, mogen slechts voorwaarden worden verbonden ter bescherming van de
      belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
  - number: '7.4'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking van de beslissing op een verzoek als bedoeld in het
      eerste lid, doet Onze Minister daarvan mededeling aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
  - number: '7.5'
    text: |-
      De verlening van de verklaring, bedoeld in het tweede lid, en de verlening van ontheffing, bedoeld in het eerste
      lid, worden geacht voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1]
      deel uit te maken van de beschikking waarop zij betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '7.6'
    text: |-
      In een geval als bedoeld in het eerste lid, dat betrekking heeft op een tunnel in het trans-Europese wegennet die
      langer is dan 500 meter kan Onze Minister de in het eerste lid bedoelde ontheffing slechts verlenen indien dat
      noodzakelijk is voor het toepassen van innovatieve veiligheidsvoorzieningen of innovatieve veiligheidsprocedures,
      en de in artikel 14 van [richtlijn nr. 2004/54/EG](32004L0054) van het Europees parlement en de Raad van de
      Europese Unie van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in het trans-Europese wegennet (PbEU
      L 167, gerectificeerd in PbEU L 201) voorgeschreven procedure is doorlopen en op grond daarvan van rechtswege
      toestemming is verkregen of door de Europese Commissie toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
  - number: '7.7'
    text: |-
      In een geval als bedoeld in het zesde lid verzoekt de tunnelbeheerder, bedoeld in de
      [Wet aanvullende regels veiligheid wegtunnels][ref1], aan Onze Minister om de ontheffing als bedoeld in het eerste
      lid niet te verlenen dan nadat het voornemen daartoe aan de Europese Commissie is voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019516
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019516
  - number: '7.8'
    text: |-
      Het eerste, derde, vierde, zesde en zevende lid zijn van overeenkomstige toepassing indien voor het bouwen op
      grond van [artikel 2.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] geen omgevingsvergunning
      is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7a.1
    text: |-
      Onze Minister kan met het oog op duurzaam bouwen in een bijzonder geval het bevoegd gezag toestaan door hem
      voorgestelde nadere voorschriften op te leggen ter voldoening aan de technische voorschriften omtrent bouwen,
      gegeven bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2, eerste lid][ref1].
      Dit toestaan kan ook betrekking hebben op door het bevoegd gezag voorgestelde, uit het oogpunt van milieu op
      te leggen technische voorschriften omtrent bouwen, waarin een algemene maatregel van bestuur als bedoeld in
      [artikel 2, eerste lid][ref2], niet voorziet. Een verzoek van het bevoegd gezag geschiedt mede aan de hand van een
      door Onze Minister ter beschikking gesteld formulier. Het verzoek, alsmede de daarbij voorgestelde op te leggen
      voorschriften zijn gemotiveerd en van een toelichting voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 7a.2
    text: |-
      Onze Minister beslist binnen acht weken na ontvangst van een verzoek om toestemming. Hij kan die beslissing eenmaal
      voor ten hoogste vier weken verdagen. Indien toestemming wordt verleend, geldt die toestemming alleen voor het
      geval waarop het verzoek betrekking heeft. Aan een toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7a
  - number: 7a.3
    text: 'De toestemming op een verzoek van het bevoegd gezag is van rechtswege verleend indien Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7a
  - number: 7a.3.a
    text: niet binnen acht weken na ontvangst van het verzoek een beslissing op dat verzoek heeft genomen,
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7a
  - number: 7a.3.b
    text: niet binnen acht weken na ontvangst van het verzoek heeft besloten de beslissing op dat verzoek te verdagen, of
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7a
  - number: 7a.3.c
    text: |-
      niet binnen de termijn waarmee de beslissing op het verzoek is verdaagd, een beslissing op dat verzoek heeft
      genomen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7a
  - number: 7b.1
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk toestaat, is het verboden
      een bouwwerk te bouwen, voor zover daarbij niet wordt voldaan aan de op dat bouwen van toepassing zijnde
      voorschriften, bedoeld in [artikel 8, tweede en vijfde lid][ref1], met dien verstande dat voorschriften van
      stedenbouwkundige aard als bedoeld in dat vijfde lid niet van toepassing zijn op het bouwen waarvoor op grond van
      [artikel 2.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref2] geen omgevingsvergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7b.2
    text: |-
      Het verbod, bedoeld in het eerste lid, heeft mede betrekking op het niet voldoen aan de voorschriften met
      betrekking tot het bouwen, van een bouwwerk, bedoeld in:
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7b
  - number: 7b.2.a
    text: |-
      [artikel 8, zevende lid][ref1], voor zover deze voorschriften in de bouwverordening zijn opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.2.b
    text: |-
      [artikel 8, achtste lid][ref1], indien en voor zover deze voorschriften op grond van het negende lid van dat
      artikel rechtstreeks gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.3
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk toestaat, is het verboden een
      bouwwerk dan wel deel daarvan in stand te laten voor zover bij het bouwen daarvan niet is voldaan aan de op dat
      bouwen van toepassing zijnde voorschriften, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel7b
  - number: '8.1'
    text: |-
      De gemeenteraad stelt een bouwverordening vast, die uitsluitend de voorschriften, bedoeld in het tweede tot en met
      zesde lid, bevat.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      De bouwverordening bevat voorschriften omtrent het tegengaan van het bouwen van een bouwwerk op verontreinigde
      bodem.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: '8.3'
    text: 'De voorschriften, bedoeld in het tweede lid, hebben uitsluitend betrekking op bouwwerken:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.3.a
    text: waarin voortdurend of nagenoeg voortdurend mensen zullen verblijven,
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.3.b
    text: |-
      voor het bouwen waarvan een omgevingsvergunning is vereist, met uitzondering van
      bouwwerken die naar aard en omvang gelijk zijn aan een bouwwerk waarvoor op grond van
      [artikel 2.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] een dergelijke vergunning niet is
      vereist, en


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 8.3.c.1°
    text: die de grond raken, of
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.3.c.2°
    text: ten aanzien waarvan het bestaande, niet-wederrechtelijke gebruik niet wordt gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: '8.4'
    text: 'De voorschriften, bedoeld in het tweede lid, hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.4.a
    text: het verrichten van onderzoek naar aard en mate van verontreiniging van de bodem;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.4.b
    text: aard en omvang van het onderzoek, en
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.4.c
    text: inrichting van het op te stellen onderzoeksrapport.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: '8.5'
    text: |-
      De bouwverordening kan voorschriften bevatten van stedenbouwkundige aard. Tot die voorschriften kunnen behoren
      voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.5.a
    text: de wegen waaraan een bouwwerk mag worden gebouwd;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.5.b
    text: de rooilijnen, en
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: 8.5.c
    text: de plaatsing van bouwwerken ten opzichte van elkaar, mede uit het oogpunt van bereikbaarheid van die bouwwerken.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: '8.6'
    text: |-
      De bouwverordening bevat tevens voorschriften omtrent de samenstelling, inrichting en werkwijze van de
      welstandscommissie. Zij kan bepalen dat er in plaats van een welstandscommissie een stadsbouwmeester
      wordt aangesteld, in welk geval de bouwverordening voorschriften bevat over de rol en de functie van de
      stadsbouwmeester. Voorts kan de bouwverordening nadere voorschriften bevatten omtrent de verslagen, bedoeld in
      [artikel 12b, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12b
        hoofdstuk: II
        afdeling: '3'
  - number: '8.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in de bouwverordening voorschriften worden gegeven
      omtrent andere onderwerpen dan die, genoemd in het tweede, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: '8.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bevordering van eenheid in de bouwverordeningen regelen worden
      gegeven omtrent de inhoud van de voorschriften, bedoeld in het tweede tot en met vierde, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
  - number: '8.9'
    text: |-
      De gemeenteraad brengt binnen een jaar na het in werking treden van de krachtens het achtste lid en de krachtens
      [artikel 120][ref1] gegeven voorschriften de bouwverordening met die voorschriften in overeenstemming. Zolang de
      bouwverordening niet met die voorschriften in overeenstemming is gebracht, gelden die voorschriften rechtstreeks.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: '9.1'
    text: |-
      Voor zover de voorschriften van de bouwverordening niet overeenstemmen met de voorschriften van het desbetreffende
      bestemmingsplan blijven eerstbedoelde voorschriften buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      De voorschriften van de bouwverordening blijven van toepassing indien het desbetreffende bestemmingsplan geen
      voorschriften bevat, die hetzelfde onderwerp regelen, tenzij het desbetreffende bestemmingsplan anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel9
  - number: '10'
    text: |-
      De in de bouwverordening vervatte voorschriften omtrent de rooilijnen en de plaatsing van bouwwerken ten opzichte
      van elkaar zijn niet van toepassing op het gedeeltelijk vernieuwen of veranderen van een bouwwerk, voor zover het
      te vernieuwen of veranderen gedeelte van dat bouwwerk overeenkomstig het destijds geldende recht in afwijking van
      die voorschriften tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Bij een in de bouwverordening gegeven voorschrift kan worden bepaald, dat daarvan kan worden afgeweken bij
      een vergunning voor een bouw- of sloopactiviteit als bedoeld in [artikel 2.1, eerste lid, onder a][ref1],
      respectievelijk [2.2, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '11.2'
    text: |-
      Van een voorschrift dat overeenkomstig [artikel 8, negende lid][ref1], in de bouwverordening is opgenomen kan
      slechts worden afgeweken voor zover dat is toegestaan op grond van een algemene maatregel van bestuur krachtens
      artikel 8, achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '12.1'
    text: 'Het uiterlijk van:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12
  - number: 12.1.a
    text: |-
      een bestaand bouwwerk, met uitzondering van een bouwwerk, niet zijnde een seizoensgebonden bouwwerk, waarvoor in de
      omgevingsvergunning voor het bouwen van dat bouwwerk is bepaald dat dit slechts voor een bepaalde periode in stand
      mag worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12
  - number: 12.1.b
    text: |-
      een te bouwen bouwwerk voor het bouwen waarvan op grond van
      [artikel 2.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] geen omgevingsvergunning is vereist,


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '12.2'
    text: |-
      De gemeenteraad kan besluiten dat, in afwijking van het eerste lid en
      [artikel 2.10, eerste lid, onder d, van de Wet algemene bepalingen omgevingsrecht][ref1], voor een daarbij aan
      te wijzen gebied of voor een of meer daarbij aan te wijzen categorieën van bestaande en te bouwen bouwwerken geen
      redelijke eisen van welstand van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '12.3'
    text: |-
      Voor zover de toepassing van de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], leidt tot strijd
      met het bestemmingsplan of met in de bouwverordening opgenomen voorschriften van stedenbouwkundige aard, blijven
      die criteria buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '12.4'
    text: |-
      De gemeenteraad betrekt de ingezetenen van de gemeente en belanghebbenden bij de voorbereiding van besluiten
      krachtens het tweede lid op de wijze voorzien in de krachtens [artikel 150 van de Gemeentewet][ref1] vastgestelde
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: 12a.1
    text: |-
      De gemeenteraad stelt een welstandsnota vast, inhoudende beleidsregels waarin in ieder geval de criteria zijn
      opgenomen die het bevoegd gezag toepast bij de beoordeling:
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.1.a
    text: |-
      of het uiterlijk en de plaatsing van een bouwwerk waarop de aanvraag om een omgevingsvergunning voor het bouwen
      van een bouwwerk betrekking heeft, zowel op zichzelf beschouwd, als in verband met de omgeving of de te verwachten
      ontwikkeling daarvan, in strijd zijn met redelijke eisen van welstand;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.1.b
    text: of het uiterlijk van een bestaand bouwwerk in ernstige mate in strijd is met redelijke eisen van welstand.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.2
    text: |-
      [Artikel 12, vierde lid][ref1], is van overeenkomstige toepassing op de vaststelling of wijziging van de
      welstandsnota.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12a.3
    text: 'De criteria, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.3.a
    text: |-
      hebben geen betrekking op bouwwerken, waarvoor in de omgevingsvergunning voor het bouwen van die bouwwerken
      wordt bepaald dat deze slechts voor een bepaalde periode in stand mogen worden gehouden, met uitzondering van
      seizoensgebonden bouwwerken;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.3.b
    text: zijn zoveel mogelijk toegesneden op de onderscheiden categorieën bouwwerken;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.3.c
    text: kunnen verschillen naargelang de plaats waar een bouwwerk is gelegen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.4
    text: |-
      Ter bevordering van de eenheid in welstandsnota's kunnen bij algemene maatregel van bestuur voorschriften worden
      gegeven omtrent categorieën van bouwwerken als bedoeld in het derde lid en de daarop toe te passen criteria.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12a.5
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het vierde lid treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12a
  - number: 12b.1
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester baseert haar onderscheidenlijk zijn advies slechts op de
      criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], doch betrekt daarbij, indien van toepassing, het
      bepaalde in [artikel 12, derde lid][ref2]. De adviezen van de welstandscommissie dan wel de stadsbouwmeester zijn
      openbaar. Een advies van de welstandscommissie dan wel de stadsbouwmeester inhoudende dat een bouwplan in strijd is
      met redelijke eisen van welstand, wordt schriftelijk uitgebracht en deugdelijk gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.2
    text: |-
      De door de welstandscommissie of stadsbouwmeester gehouden vergaderingen zijn openbaar.
      Een vergadering of gedeelte daarvan is niet openbaar in gevallen als bedoeld in
      [artikel 10, eerste lid, van de Wet openbaarheid van bestuur][ref1] en in gevallen waarin het belang van
      openbaarheid niet opweegt tegen de in [artikel 10, tweede lid, van die wet][ref2] genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 12b.3
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester legt de gemeenteraad eenmaal per jaar een verslag
      voor van de door haar onderscheidenlijk hem verrichte werkzaamheden. In het verslag wordt ten minste
      uiteengezet op welke wijze zij onderscheidenlijk hij toepassing heeft gegeven aan de criteria, bedoeld in
      [artikel 12a, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.4
    text: |-
      Een voorzitter of ander lid van een welstandscommissie kan voor een termijn van ten hoogste drie jaar worden
      benoemd in een welstandscommissie die in de betreffende gemeente werkzaam is. Zij kunnen eenmaal voor een
      termijn van ten hoogste drie jaar worden herbenoemd in dezelfde commissie. De eerste en tweede volzin zijn van
      overeenkomstige toepassing op de stadsbouwmeester.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12b
  - number: 12c
    text: |-
      Burgemeester en wethouders leggen de gemeenteraad eenmaal per jaar een verslag voor waarin zij ten minste
      uiteenzetten:
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12c
  - number: 12c.a
    text: op welke wijze zij zijn omgegaan met de adviezen van de welstandscommissie dan wel de stadsbouwmeester;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12c
  - number: 12c.b
    text: |-
      in welke gevallen waarin niet is of wordt voldaan aan [artikel 12, eerste lid][ref1], zij zijn overgegaan tot
      oplegging van een last onder bestuursdwang of oplegging van een last onder dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12d.1
    text: |-
      Het bevoegd gezag kan, indien een vereniging van eigenaars ten behoeve van een bij haar in beheer zijnd gebouw niet
      beschikt over een onderhoudsplan en dat gebouw is gelegen in een gebied waarin de leefbaarheid naar het oordeel van
      het bevoegd gezag onder druk staat, die vereniging van eigenaars verplichten tot het binnen een door het bevoegd
      gezag te bepalen termijn laten opstellen van een onderhoudsplan door een deskundig persoon of een deskundige
      instantie en tot het van kracht laten blijven van dat plan gedurende zijn looptijd. Voor zover die looptijd langer
      is dan vijf jaar, omvat de in de vorige volzin bedoelde verplichting mede de verplichting het onderhoudsplan elke
      vijf jaar door een deskundig persoon of een deskundige instantie te laten herzien.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
  - number: 12d.2
    text: |-
      Het bevoegd gezag legt een verplichting als bedoeld in het eerste lid niet op dan nadat met toepassing van
      [artikel 127a van Boek 5 van het Burgerlijk Wetboek][ref1] een vergadering van eigenaars is bijeengeroepen
      en de vereniging van eigenaars niet binnen drie maanden nadat die vergadering heeft plaatsgevonden over een
      onderhoudsplan beschikt. De eerste volzin is niet van toepassing, indien redelijkerwijs voorzienbaar is dat het
      bijeenroepen van de vergadering van eigenaars, bedoeld in die zin, dan wel het in acht nemen van de termijn van
      drie maanden, bedoeld in die zin, er niet toe zal leiden dat de vereniging van eigenaars uit eigen beweging een
      onderhoudsplan opstelt of laat opstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel127a
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: 127a
  - number: 12d.3
    text: 'Het onderhoudsplan, bedoeld in het eerste lid, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
  - number: 12d.3.a
    text: |-
      de onderhouds- en herstelwerkzaamheden aan en de vernieuwingen van die gedeelten van het gebouw waarover de
      vereniging van eigenaars het beheer voert over een periode van vijf jaar;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
  - number: 12d.3.b
    text: |-
      een schatting van de aan de werkzaamheden en de vernieuwingen, bedoeld in onderdeel a, verbonden kosten en een
      gelijkmatige toerekening van die kosten aan de onderscheiden jaren;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
  - number: 12d.3.c
    text: |-
      een schatting van de benodigde jaarlijkse reservering voor andere dan de gewone jaarlijkse kosten na de periode
      waarop het onderhoudsplan betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
  - number: 12d.4
    text: |-
      De vereniging van eigenaars zendt binnen vier weken na het opstellen van het onderhoudsplan, bedoeld in het eerste
      lid, een afschrift van het plan aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
  - number: 12d.5
    text: |-
      Indien een machtiging tot het bijeenroepen van een vergadering van eigenaars als bedoeld in
      [artikel 127a, eerste lid, aanhef, van Boek 5 van het Burgerlijk Wetboek][ref1] wordt afgegeven binnen vijf jaar
      nadat een eerdere machtiging is afgegeven, kan het bevoegd gezag de betrokken vereniging van eigenaars verplichten
      tot het uitbesteden van het beheer aan een professionele beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel127a
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: 127a
  - number: '13'
    text: |-
      Het bevoegd gezag kan degene die als eigenaar van een gebouw of een bouwwerk, niet zijnde een gebouw, dan
      wel uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen, verplichten tot het binnen een
      door het bevoegd gezag te bepalen termijn treffen van voorzieningen waardoor de staat van dat gebouw of dat
      bouwwerk komt te liggen op een niveau dat hoger is dan het niveau dat overeenkomt met de voorschriften, bedoeld
      in [artikel 1b, tweede lid][ref1], zonder dat dit hoger komt te liggen dan het niveau dat overeenkomt met de
      voorschriften, bedoeld in artikel 1b, eerste lid, mits die voorzieningen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
  - number: 13.a
    text: |-
      onderdeel zijn van een onderhoudsplan voor een gebouw als bedoeld in [artikel 12d, eerste lid][ref1], en niet
      binnen de daarvoor in het onderhoudsplan gestelde termijn zijn uitgevoerd, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
  - number: 13.b
    text: naar het oordeel van het bevoegd gezag anderszins noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel13
  - number: 13a
    text: |-
      Indien niet wordt voldaan aan [artikel 12, eerste lid][ref1], kan het bevoegd gezag, tenzij toepassing is gegeven
      aan het tweede lid van dat artikel, degene die als eigenaar van een bouwwerk dan wel uit anderen hoofde bevoegd is
      tot het treffen van voorzieningen daaraan, verplichten tot het binnen een door hem te bepalen termijn treffen van
      zodanige door hem daarbij aan te geven voorzieningen, dat nadien wordt voldaan aan [artikel 12, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: '14.1'
    text: |-
      Indien een gebouw, een open erf of een terrein op grond van [artikel 17][ref1], dan wel een gebouw op grond
      van [artikel 174a van de Gemeentewet][ref2], een verordening als bedoeld in [artikel 174 van die wet][ref3] of
      [artikel 13b van de Opiumwet][ref4] is gesloten, kan bij besluit van het bevoegd gezag degene die als eigenaar of
      uit anderen hoofde bevoegd is tot het in gebruik geven van dat gebouw, open erf of terrein, worden verplicht om
      naar keuze van het bevoegd gezag het gebouw, open erf of terrein binnen een daarbij te bepalen termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 174a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '174'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: 13b
  - number: 14.1.a
    text: |-
      in gebruik te geven aan een andere persoon dan degene die als gevolg van de sluiting het gebruik van het gebouw,
      open erf of terrein heeft moeten staken, of
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: 14.1.b
    text: |-
      in beheer te geven aan een persoon, die uit hoofde van beroep of bedrijf op het terrein van de huisvesting werkzaam
      is, of aan een op dat terrein werkzame instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: '14.2'
    text: 'Het bevoegd gezag kan in zijn besluit:'
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: 14.2.a
    text: |-
      personen of instellingen als bedoeld in het eerste lid, onderdelen a en b, noemen uit welke degene tot wie het
      besluit is gericht een keuze moet maken, of, indien dit naar het oordeel van het bevoegd gezag niet mogelijk
      is, een persoon of instelling als hier bedoeld noemen aan wie het gebouw, open erf of terrein binnen een daarbij
      aangegeven termijn en op een daarbij aangegeven wijze in gebruik dan wel in beheer moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: 14.2.b
    text: |-
      indien het gebouw, open erf of terrein noodzakelijke voorzieningen behoeft om weer op redelijke wijze tot bewoning
      of gebruik te kunnen dienen, degene die als eigenaar of uit anderen hoofde tot het treffen van die voorzieningen
      bevoegd is, ertoe verplichten om binnen een door hem te bepalen termijn de door hem aan te geven voorzieningen te
      treffen, en
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: 14.2.c
    text: zo nodig, andere voorwaarden aan de uitvoering van het besluit stellen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      Indien het eerste lid, onderdeel b, van toepassing is stelt het bevoegd gezag een beheersvergoeding vast. De in
      dat onderdeel bedoelde persoon of instelling stelt na overleg met degene tot wie het in dat lid bedoelde besluit
      is gericht, de huurprijs vast op een bedrag dat redelijk is in het economische verkeer en stelt de ontvangen
      huurprijs, na aftrek van de beheersvergoeding, ter beschikking van degene tot wie dat besluit is gericht.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      Een in het eerste lid, onderdeel a of b, bedoelde persoon of instelling die het gebruik of beheer van het gebouw,
      open erf of terrein heeft beëindigd, doet daarvan binnen veertien dagen na de dag van beëindiging mededeling aan
      het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: '14.5'
    text: |-
      Onder beheer wordt in dit artikel verstaan het in gebruik geven van een gebouw, open erf of terrein en het daarna
      verrichten van al die handelingen met betrekking tot dat gebouw, open erf of terrein die volgens het burgerlijk
      recht tot de verantwoordelijkheid van een eigenaar behoren.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14
  - number: 14a
    text: |-
      Degene, tot wie een besluit als bedoeld in [artikel 12d][ref1], [13][ref2], [13a][ref3] of [14, eerste lid][ref4],
      is gericht, of zijn rechtsopvolger en iedere verdere rechtsopvolger, is verplicht daaraan te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Het bevoegd gezag kan gelijktijdig met een besluit als bedoeld in [artikel 12d][ref1], [13][ref2], [13a][ref3] of
      [14, eerste lid][ref4], besluiten tot oplegging van een last onder bestuursdwang of oplegging van een last onder
      dwangsom, gericht op naleving van het eerstgenoemde besluit. In dat geval worden beide besluiten gelijktijdig
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '15.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid maakt het besluit tot oplegging van een last onder bestuursdwang
      of oplegging van een last onder dwangsom, wat betreft de mogelijkheid van bezwaar en beroep, deel uit van het in
      [artikel 12d][ref1], [13][ref2], [13a][ref3] of [14, eerste lid][ref4], bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '16'
    text: |-
      Degene die als eigenaar van een woning of uit anderen hoofde daartoe bevoegd is, treft de voorzieningen waarvoor
      ingevolge de [Wet maatschappelijke ondersteuning][ref1] geldelijke steun is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020031
  - number: '17.1'
    text: |-
      Indien overtreding van de bij of krachtens [hoofdstuk I][ref1], [II][ref2], of [III][ref3] gegeven voorschriften
      met betrekking tot de staat of het gebruik van een gebouw, open erf of terrein gepaard gaat met een bedreiging
      van de leefbaarheid of een gevaar voor de veiligheid of de gezondheid, en er een klaarblijkelijk gevaar is op
      herhaling van de overtreding, kan het bevoegd gezag besluiten dat gebouw, open erf of terrein te sluiten. De
      [artikelen 5:24, eerste en tweede lid][ref4], en [5:25 tot en met 5:28 van de Algemene wet bestuursrecht][ref5]
      zijn van overeenkomstige toepassing. Het bevoegd gezag kan van de overtreder de ingevolge
      [artikel 5:25 van de Algemene wet bestuursrecht][ref6] verschuldigde kosten invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '17.2'
    text: Het bevoegd gezag bepaalt in het besluit, bedoeld in het eerste lid, de duur van de sluiting.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel17
  - number: '18'
    text: |-
      Indien het bevoegd gezag een besluit als bedoeld in [artikel 13][ref1], [13a][ref2],
      [14, eerste lid][ref3], of [17][ref4] heeft genomen en, nadat dat besluit is genomen, een ander
      bestuursorgaan ten aanzien van het betrokken bouwwerk, open erf of terrein het bevoegd gezag wordt, is
      [artikel 5.2, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref5] op een zodanig besluit van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '17'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '5'
  - number: '62.1'
    text: |-
      Bij algemene maatregel van bestuur kan, ten einde gegevens te verkrijgen omtrent omvang en samenstelling van de
      woningvoorraad en omtrent gebruik en bezetting van woningen, worden bepaald dat een algemene woningtelling wordt
      gehouden. In die maatregel worden tijdstip, doel en inhoud van de woningtelling omschreven.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel62
  - number: '62.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen nadere voorschriften omtrent
      de woningtelling worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel62
  - number: '62.3'
    text: |-
      De colleges van burgemeester en wethouders verlenen hun medewerking aan de uitvoering van de in het eerste lid
      bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel62
  - number: '62.4'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur worden voorschriften gegeven omtrent de aan
      gemeenten uit ’s Rijks kas toe te kennen vergoeding van ter zake gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel62
  - number: '63.1'
    text: |-
      Bij koninklijk besluit kunnen burgemeester en wethouders worden verplicht, overeenkomstig bij dat besluit te geven
      voorschriften, een bijzonder onderzoek naar de staat van de volkshuisvesting in te stellen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel63
  - number: '63.2'
    text: |-
      Aan gemeenten kunnen financiële middelen uit ’s Rijks kas worden verstrekt ter bestrijding van de kosten, verbonden
      aan een onderzoek als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel63
  - number: '64'
    text: |-
      Onze Minister verstrekt eenmaal per jaar aan de Staten-Generaal een verslag van de aard en het aantal van de
      woningen die in het jaar, voorafgaand aan het jaar waarin het verslag wordt aangeboden, zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel64
  - number: '65.1'
    text: |-
      Burgemeester en wethouders alsmede gedeputeerde staten verstrekken overeenkomstig bij of krachtens algemene
      maatregel van bestuur gegeven voorschriften informatie ten behoeve van de door Onze Minister ingevolge
      [artikel 64][ref1] aan de Staten-Generaal te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel64
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '64'
        hoofdstuk: V
        afdeling: '2'
  - number: '65.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden in elk geval voorschriften
      gegeven omtrent de aard en omvang van de te verstrekken informatie, de instanties die, alvorens de informatie
      wordt verstrekt, moeten worden gehoord, alsmede de wijze waarop, het tijdstip waarop en de instantie waaraan de
      informatie moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel65
  - number: '69'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 65][ref1], treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel65
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '65'
        hoofdstuk: V
        afdeling: '2'
  - number: '70.1'
    text: |-
      Verenigingen met volledige rechtsbevoegdheid en stichtingen, die zich ten doel stellen uitsluitend op het gebied
      van de volkshuisvesting werkzaam te zijn en niet beogen uitkeringen te doen anders dan in het belang van de
      volkshuisvesting, kunnen bij koninklijk besluit worden toegelaten als instellingen, uitsluitend in het belang van
      de volkshuisvesting werkzaam.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70
  - number: '70.2'
    text: |-
      De toelating, bedoeld in het eerste lid, kan bij koninklijk besluit worden geweigerd of ingetrokken. De toelating
      wordt in elk geval geweigerd, indien de vereniging of de stichting niet voldoet aan het eerste lid of de toelating
      niet in het belang van de volkshuisvesting is te achten. De toelating wordt ingetrokken, indien de toegelaten
      instelling niet langer uitsluitend op het gebied van de volkshuisvesting werkzaam is of uitkeringen doet anders dan
      in het belang van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70
  - number: '70.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere dan de in het tweede lid bedoelde gevallen worden aangegeven,
      waarin de toelating wordt of kan worden geweigerd dan wel wordt of kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70
  - number: '70.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de toelating, alsmede omtrent
      weigering en intrekking van de toelating. Daarbij kan worden bepaald, dat de statuten van de vereniging of de
      stichting voorschrijven dat bij ontbinding van de vereniging of de stichting de vereffening geschiedt door een of
      meer door burgemeester en wethouders van de gemeente, waar de vereniging of de stichting haar woonplaats heeft,
      aangewezen vereffenaars.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70
  - number: 70a.1
    text: |-
      Bij koninklijk besluit kan worden bepaald dat de toegelaten instellingen binnen een bij dat besluit gestelde
      termijn hun statuten moeten aanpassen aan de voorschriften omtrent de toelating, zoals deze luiden op de dag waarop
      dat besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70a
  - number: 70a.2
    text: |-
      Indien een toegelaten instelling geen uitvoering geeft aan een besluit als bedoeld in het eerste lid, kan de
      toelating worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70a
  - number: 70b.1
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State geeft bij de behandeling van een beroep tegen een
      koninklijk besluit dat strekt tot intrekking van de toelating, aanvankelijk overeenkomstige toepassing aan
      [artikel 8:52 van de Algemene wet bestuursrecht][ref1] en kan nadien overeenkomstige toepassing geven aan
      [artikel 8:53 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 70b.2
    text: |-
      Nadat een koninklijk besluit dat strekt tot intrekking van de toelating onherroepelijk is geworden, wordt de
      vereniging of de stichting op vordering van Onze Minister ontbonden door de rechtbank binnen welker rechtsgebied
      zij gevestigd is.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70b
  - number: 70c.1
    text: |-
      De toegelaten instellingen huisvesten bij voorrang personen die door hun inkomen of door andere omstandigheden
      moeilijkheden ondervinden bij het vinden van hun passende huisvesting. Bij het in gebruik geven van door hen
      beheerde woningen met een verhoudingsgewijs lage huurprijs geven zij zo veel mogelijk voorrang aan woningzoekenden
      die, gelet op hun inkomen, in het bijzonder op die woningen zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2
    text: |-
      De toegelaten instellingen nemen bij hun werkzaamheden voorts de daaromtrent bij of krachtens algemene maatregel
      van bestuur gegeven voorschriften in acht. Deze voorschriften betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.a
    text: het verwerven, bouwen, bezwaren en vervreemden van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.b
    text: het treffen van voorzieningen aan woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.c
    text: het verhuren van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.d
    text: de wijze van beheer van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.e
    text: de exploitatie van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.f
    text: de bestemming van batige saldi;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.g
    text: het financiële beleid en beheer;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.h
    text: de verslaglegging;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.i
    text: de inrichting van de administratie en
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.2.j
    text: overleg met en verplichtingen ten opzichte van huurders.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur kan worden bepaald dat het eerste lid, alsmede
      voorschriften als bedoeld in het tweede lid, van toepassing zijn op gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70c.4
    text: |-
      Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kunnen de in dat lid genoemde
      voorschriften voorts worden gegeven voor standplaatsen en woonwagens, instellingen waarin aan ten minste vijf
      personen van 65 jaar of ouder duurzaam verblijf en verzorging wordt verschaft, onroerende aanhorigheden van
      woningen, standplaatsen, woonwagens en zodanige verzorgingshuizen, alsmede de woonomgeving.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70c
  - number: 70d.1
    text: |-
      De toegelaten instellingen staan onder toezicht van Onze Minister, behoudens
      [artikel 71a, eerste lid, aanhef en onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
  - number: 70d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden omtrent het toezicht nadere voorschriften gegeven. Daarbij
      kan worden bepaald dat in de bij die maatregel aangegeven gevallen:
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70d
  - number: 70d.2.a
    text: |-
      Onze Minister een toegelaten instelling een aanwijzing kan geven om een of meer handelingen te verrichten of na
      te laten;
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70d
  - number: 70d.2.b
    text: een toegelaten instelling bepaalde handelingen slechts kan verrichten na voorafgaande goedkeuring of
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70d
  - number: 70d.2.c
    text: |-
      ten behoeve van door een toegelaten instelling te verrichten handelingen een plan wordt opgesteld door een door
      Onze Minister aan te wijzen persoon of instantie.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70d
  - number: 70e.1
    text: |-
      Indien een toegelaten instelling ernstige schade aan het belang van de volkshuisvesting berokkent, redelijkerwijs
      in die situatie geen verbetering te voorzien is en een andere daartegen gerichte maatregel dan het onder bewind
      stellen van die toegelaten instelling niet doeltreffender zou zijn, kan de rechtbank binnen welker rechtsgebied die
      toegelaten instelling gevestigd is haar onder bewind stellen op een daartoe strekkend verzoek van Onze Minister.
      Onze Minister kan bij zijn verzoek personen voor benoeming tot bewindvoerder voordragen en voorstellen doen omtrent
      hun beloning.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70e
  - number: 70e.2
    text: |-
      De rechtbank behandelt het verzoek binnen twee weken nadat hij het heeft ontvangen. Hij kan inzage nemen of,
      door daartoe door hem aangewezen deskundigen, doen nemen van zakelijke gegevens en bescheiden van de betrokken
      toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70e
  - number: 70e.3
    text: |-
      Een toegelaten instelling die surseance van betaling heeft aangevraagd, aan welke surseance van betaling is
      verleend, van welke het faillissement is aangevraagd of die failliet is verklaard kan niet onder bewind worden
      gesteld in de zin van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70e
  - number: 70f.1
    text: |-
      Bij een beslissing waarbij een toegelaten instelling onder bewind wordt gesteld, benoemt de rechtbank een of meer
      bewindvoerders en regelt hij hun beloning. De beloning komt voor rekening van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70f
  - number: 70f.2
    text: |-
      De bewindvoerders maken onverwijld een uittreksel van de uitspraak bekend in de Staatscourant en in een of meer bij
      de uitspraak aangewezen nieuwsbladen. Het uittreksel vermeldt naam en woonplaats van de toegelaten instelling en de
      woonplaats of het kantoor van de bewindvoerders, alsmede de datum van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70f
  - number: 70f.3
    text: |-
      De uitspraak is uitvoerbaar bij voorraad, onverminderd enige daartegen gerichte voorziening. Gedurende acht dagen
      na de uitspraak kan daartegen hoger beroep worden ingesteld bij het gerechtshof binnen welks rechtsgebied de
      betrokken toegelaten instelling gevestigd is. Het gerechtshof behandelt het beroep binnen twee weken nadat het het
      beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70f
  - number: 70f.4
    text: |-
      Gedurende acht dagen na de uitspraak van het gerechtshof in hoger beroep kan daartegen beroep in cassatie worden
      ingesteld. De Hoge Raad behandelt het beroep binnen twee weken nadat hij het beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70f
  - number: 70g.1
    text: |-
      De bewindvoerders oefenen bij uitsluiting alle bevoegdheden uit van de organen van de toegelaten instelling, tenzij
      de rechtbank heeft bepaald dat een orgaan zijn bevoegdheden kan blijven uitoefenen. Zij doen voorts onverwijld
      aan de Kamer van Koophandel en Fabrieken binnen welker gebied de toegelaten instelling gevestigd is opgaaf van de
      uitspraak van de rechtbank en van de gegevens omtrent zichzelf die omtrent een bestuurder worden verlangd.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70g
  - number: 70g.2
    text: |-
      Een rechtshandeling die door een orgaan van de toegelaten instelling wordt verricht na de uitspraak van de
      rechtbank en voor het tijdstip waarop degenen die bij die rechtshandeling een belang hebben voor het eerst van
      die uitspraak kennis kunnen nemen, is geldig. Het tijdstip, bedoeld in de eerste volzin, is de tweede dag na de
      dagtekening van de Staatscourant waarin een uittreksel van die uitspraak is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70g
  - number: 70h.1
    text: |-
      De leden van de organen van de toegelaten instelling en de personen die voor haar werkzaamheden verrichten,
      verlenen alle door de bewindvoerders gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70h
  - number: 70h.2
    text: |-
      Indien meer dan een bewindvoerder is benoemd, is voor de geldigheid van hun handelingen toestemming van de
      meerderheid of, bij staking van stemmen, een beslissing van de president van de rechtbank vereist.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70h
  - number: 70h.3
    text: |-
      De rechtbank kan te allen tijde een bewindvoerder ontslaan en hem door een andere bewindvoerder vervangen, dan
      wel aan hem een of meer bewindvoerders toevoegen, een en ander ambtshalve dan wel op verzoek van die bewindvoerder
      zelf, van een of meer andere bewindvoerders of van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70h
  - number: 70h.4
    text: |-
      De bewindvoerders brengen tijdens de uitoefening van hun bevoegdheden telkens na verloop van drie maanden, alsmede
      na beëindiging daarvan, zo spoedig mogelijk verslag over hun werkzaamheden uit aan de rechtbank en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70h
  - number: 70i.1
    text: |-
      Het bewind eindigt twee jaar na de uitspraak van de rechtbank waarbij de betrokken toegelaten instelling onder
      bewind is gesteld. Het bewind eindigt voorts met onmiddellijke ingang na het onherroepelijk worden van een
      benoeming van een of meer bewindvoerders in een aan de betrokken toegelaten instelling verleende surseance van
      betaling of van een of meer curatoren in haar faillissement.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70i
  - number: 70i.2
    text: |-
      Indien naar het oordeel van Onze Minister voor het tijdstip, genoemd in de eerste volzin van het eerste
      lid, de voorwaarden zijn geschapen waaronder de toelating niet langer ernstige schade aan het belang van de
      volkshuisvesting berokkent en niet op korte termijn ernstige schade aan dat belang zal berokkenen, verzoekt hij
      de rechtbank het bewind op te heffen. Bij zijn besluit waarbij het bewind wordt opgeheven, ontslaat de rechtbank
      de bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70i
  - number: 70j.1
    text: |-
      Verenigingen met volledige rechtsbevoegdheid en stichtingen, die mede in het belang van de volkshuisvesting
      werkzaam zijn, kunnen bij koninklijk besluit als toegelaten instelling worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70j
  - number: 70j.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de toelating, weigering en
      intrekking van de toelating, alsmede omtrent de werkzaamheden van en het toezicht op instellingen als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70j
  - number: 70j.3
    text: |-
      De [artikelen 70, tweede, derde en vierde lid][ref1], [70a][ref2], [70b][ref3], [70d tot en met 70i][ref4] en
      [105][ref5] zijn voorzover mogelijk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70b
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel105
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel70j
