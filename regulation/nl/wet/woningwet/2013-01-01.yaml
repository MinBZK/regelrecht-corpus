    text: |-
      fonds: Centraal Fonds voor de Volkshuisvesting, bedoeld in [artikel 71][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71
    url: https://wetten.overheid.nl/BWBR0005181/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
