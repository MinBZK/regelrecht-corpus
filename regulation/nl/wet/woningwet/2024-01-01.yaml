  - number: '1.3'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt mede verstaan onder: - *de huurder:* a.
      de medehuurder in de zin van de [artikelen 266][ref1] en [267 van Boek 7 van het Burgerlijk Wetboek][ref2];
      b. de persoon, bedoeld in [artikel 268 lid 2 van Boek 7 van het Burgerlijk Wetboek][ref3]; c. degene die de
      woongelegenheid met toestemming van de toegelaten instelling huurt van een huurder die haar huurt van die
      toegelaten instelling;
        - *woning:* afzonderlijk gedeelte van een gebouw, welk gedeelte tot bewoning is bestemd, met het daarbij behorende
      deel van de grond.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel267
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel268
