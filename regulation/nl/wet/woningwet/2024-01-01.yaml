  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt voorts verstaan onder: - *dochtermaatschappij:*
      dochtermaatschappij als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] van een toegelaten
      instelling;
        - *verbonden onderneming:* rechtspersoon, niet zijnde een vereniging van eigenaars als bedoeld
      in [afdeling 2 van titel 9 van Boek 5 van het Burgerlijk Wetboek][ref2], of vennootschap: a.
      welke een dochtermaatschappij is; b. in welke een toegelaten instelling deelneemt in de zin van
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref3], of c. met welke een toegelaten instelling anderszins
      een duurzame band heeft, waaronder mede wordt begrepen het hebben van stemrechten in de algemene vergadering van
      die rechtspersoon;
        - *woningvennootschap:* met een toegelaten instelling verbonden onderneming, na bewerkstelliging van een juridische
      scheiding overeenkomstig [hoofdstuk IV, afdeling 3, paragraaf 5][ref4];
        - *samenwerkingsvennootschap:* met een toegelaten instelling verbonden vennootschap onder firma of commanditaire
      vennootschap, door een toegelaten instelling overeenkomstig bij algemene maatregel van bestuur daaromtrent
      gegeven voorschriften aangegaan met een of meer andere toegelaten instellingen die alle in dezelfde
      gemeenten als die toegelaten instelling feitelijk werkzaam zijn, behoudens het bepaalde bij en krachtens
      [artikel 21, vijfde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Afdeling2
