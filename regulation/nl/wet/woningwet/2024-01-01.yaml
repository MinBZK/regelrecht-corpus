  - number: 7ab.1
    text: |-
      Bij algemene maatregel van bestuur worden categorieën bouwwerken aangewezen ten aanzien waarvan het bouwen wordt
      onderworpen aan een instrument voor kwaliteitsborging.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ab
  - number: 7ab.2
    text: |-
      De aanwijzing van de categorieën bouwwerken geschiedt met inachtneming van de bij of krachtens de algemene
      maatregel van bestuur, bedoeld in het eerste lid, vastgestelde gevolgklassen voor de verschillende typen
      bouwwerken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ab
  - number: 7ab.3
    text: |-
      Voor het bouwen van een bouwwerk dat onder een categorie bouwwerken als bedoeld in het eerste lid valt, wordt door
      een kwaliteitsborger een door de toelatingsorganisatie tot het stelsel van kwaliteitsborging toegelaten instrument
      voor kwaliteitsborging toegepast dat afgestemd is op de gevolgklasse waaronder het type bouwwerk valt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ab
  - number: 7ab.4
    text: |-
      Op grond van [artikel 4.3, eerste lid, aanhef en onder a, of vierde lid, van de Omgevingswet][ref1] worden regels
      gesteld met betrekking tot het in gebruik nemen van bouwwerken als bedoeld in het eerste lid. Tot die regels
      behoort in ieder geval de verplichting om voor het in gebruik nemen van het bouwwerk aan het bevoegd gezag een
      dossier te overleggen dat inzicht geeft of het gerealiseerde bouwwerk voldoet aan de voorschriften die zijn
      gesteld op grond van [artikel 4.3, eerste lid, aanhef en onder a, of vierde lid, van de Omgevingswet][ref2], of
      [artikel 120][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ab
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 7ac.1
    text: |-
      Een instrument voor kwaliteitsborging is gericht op de integrale beoordeling van
      het bouwen van een bouwwerk aan de voorschriften die zijn gesteld op grond van
      [artikel 4.3, eerste lid, aanhef en onder a, of vierde lid, van de Omgevingswet][ref1], of [artikel 120][ref2], en
      beschrijft op welke wijze de kwaliteitsborging bij het bouwen dient te worden ingericht en uitgevoerd om ervoor te
      zorgen dat in overeenstemming met deze voorschriften wordt gebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 7ac.2
    text: |-
      De instrumentaanbieder ziet erop toe dat de toepassing van het instrument voor kwaliteitsborging plaatsvindt
      overeenkomstig de in het instrument gestelde eisen aan de beoordeling en de beschrijving, bedoeld in het eerste
      lid, en treft de maatregelen die nodig zijn om een onjuiste toepassing van het instrument tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld waaraan de beoordeling en de beschrijving,
      bedoeld in het eerste lid, minimaal dienen te voldoen. Deze regels strekken er in ieder geval toe dat in een
      instrument voor kwaliteitsborging wordt voorgeschreven:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.a
    text: op welke wijze de kwaliteitsborger voorziet in de beoordeling, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.b
    text: |-
      op welke wijze de kwaliteitsborger waarborgt dat de werkzaamheden in het kader van kwaliteitsborging
      reproduceerbaar en transparant zijn;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.c
    text: |-
      in welke gevallen toestemming wordt verleend om het instrument voor kwaliteitsborging als kwaliteitsborger toe
      te passen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.d
    text: |-
      op welke wijze de onafhankelijke uitvoering van de werkzaamheden in het kader van de kwaliteitsborging wordt
      gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.e
    text: |-
      aan welke minimumeisen voor opleiding en ervaring de personen die de werkzaamheden in het kader van de
      kwaliteitsborging uitvoeren, dienen te voldoen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.f
    text: |-
      op welke wijze de verantwoordelijkheid voor de toepassing van het instrument voor kwaliteitsborging is geregeld in
      de administratieve organisatie van de kwaliteitsborger;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.g
    text: |-
      welke gegevens en bescheiden beschikbaar moeten zijn voor de toelatingsorganisatie en de instrumentaanbieder in
      verband met het toezicht op de goede werking en de juiste toepassing van het instrument voor kwaliteitsborging;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.h
    text: |-
      welke gegevens en bescheiden bij de afronding van de werkzaamheden in het kader van de kwaliteitsborging aan de
      opdrachtgever dienen te worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ac.3.i
    text: |-
      op welke wijze de instrumentaanbieder toeziet op de juiste toepassing van het instrument voor kwaliteitsborging
      en welke maatregelen worden getroffen om een onjuiste toepassing van het instrument voor kwaliteitsborging tegen
      te gaan.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ac
  - number: 7ad.1
    text: |-
      De toelatingsorganisatie beslist op aanvraag van de instrumentaanbieder over de toelating van een instrument voor
      kwaliteitsborging tot het stelsel van kwaliteitsborging voor het bouwen. Bij of krachtens algemene maatregel van
      bestuur worden regels gesteld met betrekking tot de wijze waarop de aanvraag om toelating van het instrument voor
      kwaliteitsborging wordt gedaan, de gegevens die daarbij van de instrumentaanbieder worden verlangd en de termijn
      waarbinnen de beschikking op de aanvraag wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ad
  - number: 7ad.2
    text: 'De toelatingsorganisatie weigert de toelating van het instrument voor kwaliteitsborging, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ad
  - number: 7ad.2.a
    text: |-
      het instrument voor kwaliteitsborging niet voldoet aan de bij of krachtens [artikel 7ac, derde lid][ref1], gestelde
      regels;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ac
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ad
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ac
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ad.2.b
    text: de instrumentaanbieder in faillissement of surseance van betaling verkeert.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ad
  - number: 7ad.3
    text: |-
      Een beschikking tot toelating van het instrument voor kwaliteitsborging vermeldt in ieder geval de gevolgklasse en
      het type bouwwerk waarop het instrument is gericht.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ad
  - number: 7ae.1
    text: |-
      De toelatingsorganisatie trekt de toelating van een instrument voor kwaliteitsborging in, indien de
      instrumentaanbieder daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ae
  - number: 7ae.2
    text: 'De toelatingsorganisatie kan de toelating van een instrument voor kwaliteitsborging intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ae
  - number: 7ae.2.a
    text: |-
      de gegevens die met het oog op de toelating zijn verstrekt, zodanig onjuist of onvolledig blijken, dat op
      de aanvraag om toelating een andere beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ae
  - number: 7ae.2.b
    text: |-
      het toegelaten instrument voor kwaliteitsborging niet meer voldoet aan de bij of krachtens
      [artikel 7ac, derde lid][ref1], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ac
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ac
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ae.2.c
    text: |-
      de instrumentaanbieder handelt in strijd met het bepaalde in [artikel 7ac, tweede lid][ref1], of met een of meer
      andere uit de toelating van een instrument voor kwaliteitsborging voortvloeiende verplichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ac
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ac
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ae.2.d
    text: de instrumentaanbieder failliet is verklaard.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ae
  - number: 7ae.3
    text: |-
      Indien de toelating van een instrument voor kwaliteitsborging wordt ingetrokken, blijft het instrument
      geldig gedurende zes maanden na de datum waarop de beschikking tot intrekking van de toelating is
      gegeven, in de gevallen waarin de kwaliteitsborging met toepassing van dat instrument voor die datum is
      aangevangen. De toelatingsorganisatie kan een kortere termijn vaststellen of bepalen dat de toepassing van
      het instrument voor kwaliteitsborging terstond wordt beëindigd, indien de kwaliteitsborging met toepassing
      van het betreffende instrument leidt tot strijdigheden met de voorschriften, die zijn gesteld op grond van
      [artikel 4.3, eerste lid, aanhef en onder a, of vierde lid, van de Omgevingswet][ref1], of [artikel 120][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ae
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 7af.1
    text: |-
      De toelatingsorganisatie kan de toelating van een instrument voor kwaliteitsborging schorsen voor een door haar
      vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7af
  - number: 7af.2
    text: |-
      De toelating van een instrument voor kwaliteitsborging wordt in ieder geval geschorst, indien de
      instrumentaanbieder in surseance van betaling verkeert.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7af
  - number: 7af.3
    text: 'De toelatingsorganisatie vermeldt in de beschikking tot schorsing:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7af
  - number: 7af.3.a
    text: de reden van schorsing;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7af
  - number: 7af.3.b
    text: de termijn waarbinnen geconstateerde tekortkomingen moeten zijn hersteld, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7af
  - number: 7af.3.c
    text: de gevolgen van het achterwege blijven van herstel.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7af
  - number: 7af.4
    text: |-
      Het instrument voor kwaliteitsborging kan gedurende de termijn van schorsing worden toegepast in de
      gevallen waarin de kwaliteitsborging met toepassing van dat instrument voor de datum waarop de beschikking
      tot schorsing is gegeven, is aangevangen. De toelatingsorganisatie kan een kortere termijn vaststellen
      of bepalen dat de toepassing terstond wordt beëindigd, indien de kwaliteitsborging met toepassing van
      het betreffende instrument leidt tot strijdigheid met de voorschriften, die zijn gesteld op grond van
      [artikel 4.3, eerste lid, aanhef en onder a, of vierde lid, van de Omgevingswet][ref1], of [artikel 120][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7af
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 7ag.1
    text: |-
      De toelatingsorganisatie kan de instrumentaanbieder een waarschuwing geven, inhoudende dat door de
      toelatingsorganisatie geconstateerde tekortkomingen bij de toepassing van het instrument voor kwaliteitsborging
      worden onderzocht en dat aan de toelatingsorganisatie wordt gerapporteerd over de oorzaken van die tekortkomingen
      en de wijze waarop deze worden hersteld.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ag
  - number: 7ag.2
    text: |-
      In de beschikking tot het geven van de waarschuwing vermeldt de toelatingsorganisatie de termijn waarbinnen aan de
      waarschuwing gevolg moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ag
  - number: 7ah.1
    text: |-
      De instrumentaanbieder van een toegelaten instrument voor kwaliteitsborging verstrekt de toelatingsorganisatie de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ah
  - number: 7ah.1.a
    text: aan welke kwaliteitsborgers hij toestemming heeft verleend het instrument toe te passen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ah
  - number: 7ah.1.b
    text: |-
      welke kwaliteitsborgers een waarschuwing hebben gekregen in verband met tekortkomingen bij de toepassing van het
      instrument; en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ah
  - number: 7ah.1.c
    text: ten aanzien van welke kwaliteitsborgers de toestemming om het instrument toe te passen is geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ah
  - number: 7ah.2
    text: |-
      De instrumentaanbieder van een toegelaten instrument voor kwaliteitsborging informeert de toelatingsorganisatie
      onverwijld over zijn door de rechtbank uitgesproken faillissement of surseance van betaling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ah
  - number: 7ah.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het verstrekken van
      de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ah
  - number: 7ai.1
    text: 'De toelatingsorganisatie houdt een register bij van:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
  - number: 7ai.1.a
    text: |-
      toegelaten instrumenten voor kwaliteitsborging, met vermelding van de gevolgklassen en de typen bouwwerken waarop
      de instrumenten zijn gericht;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
  - number: 7ai.1.b
    text: instrumentaanbieders van de toegelaten instrumenten voor kwaliteitsborging;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
  - number: 7ai.1.c
    text: |-
      door de instrumentaanbieder bij of krachtens [artikel 7ah, eerste en derde lid][ref1], verstrekte gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ah
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ah
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ai.1.d
    text: |-
      aan instrumentaanbieders krachtens [artikel 7ag][ref1] gegeven waarschuwingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ag
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ag
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ai.1.e
    text: |-
      schorsingen van de toelating van instrumenten voor kwaliteitsborging krachtens [artikel 7af][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7af
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7af
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ai.1.f
    text: |-
      intrekkingen van de toelating van instrumenten voor kwaliteitsborging krachtens [artikel 7ae][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ae
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ae
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ai.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de in het register
      op te nemen gegevens en de verwerking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
  - number: 7ai.3
    text: Het register wordt kosteloos langs elektronische weg ter beschikking gesteld aan een ieder.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ai
  - number: 7aj.1
    text: 'De instrumentaanbieder is een vergoeding verschuldigd voor de kosten die samenhangen met:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7aj
  - number: 7aj.1.a
    text: |-
      het behandelen van een aanvraag om toelating van een instrument voor kwaliteitsborging tot het stelsel van
      kwaliteitsborging voor het bouwen als bedoeld in [artikel 7ad][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ad
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7aj
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ad
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7aj.1.b
    text: |-
      het bijhouden van de gegevens in het register, bedoeld in [artikel 7ai, eerste lid, onder a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ai
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7aj
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ai
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7aj.2
    text: |-
      De instrumentaanbieder is een bijdrage verschuldigd in de kosten die verband houden met het toezicht op de naleving
      van het bepaalde bij of krachtens [artikel 7ac][ref1] en [artikel 7ah][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ac
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7ah
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7aj
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ac
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 7ah
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7aj.3
    text: |-
      De toelatingsorganisatie stelt de vergoedingen en de bijdrage, bedoeld in het eerste en tweede lid, alsmede de
      wijze van betaling van deze vergoedingen en bijdrage, vast.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7aj
  - number: 7aj.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van het
      eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7aj
  - number: 7ak.1
    text: Er is een toelatingsorganisatie kwaliteitsborging bouw.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
  - number: 7ak.2
    text: 'De toelatingsorganisatie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
  - number: 7ak.2.a
    text: |-
      het beslissen op aanvragen om toelating van instrumenten voor kwaliteitsborging tot het stelsel van
      kwaliteitsborging voor het bouwen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
  - number: 7ak.2.b
    text: |-
      het houden van toezicht op de naleving van het bepaalde bij of krachtens [artikel 7ac][ref1] en
      [artikel 7ah][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ac
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7ah
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ac
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 7ah
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ak.2.c
    text: |-
      het geven van waarschuwingen met betrekking tot de toepassing van toegelaten instrumenten voor kwaliteitsborging,
      het schorsen of het intrekken van toelatingen als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
  - number: 7ak.2.d
    text: |-
      het bijhouden van het register, bedoeld in [artikel 7ai][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ai
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ai
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ak.2.e
    text: |-
      het vaststellen van de vergoedingen en de bijdrage, bedoeld in [artikel 7aj, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7aj
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7aj
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7ak.2.f
    text: |-
      het geven van voorlichting over de toepassing van de regels met betrekking tot de toelating van instrumenten voor
      kwaliteitsborging tot het stelsel van kwaliteitsborging voor het bouwen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
  - number: 7ak.2.g
    text: het monitoren en evalueren van het functioneren van het stelsel van kwaliteitsborging voor het bouwen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
  - number: 7ak.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitoefening van de
      taken, bedoeld in het tweede lid, en kunnen aan de toelatingsorganisatie andere taken dan de taken, genoemd in het
      eerste lid, worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ak
  - number: 7al.1
    text: De toelatingsorganisatie bestaat uit een voorzitter en ten hoogste twee andere leden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7al
  - number: 7al.2
    text: De leden worden benoemd voor een periode van ten hoogste vier jaar en kunnen eenmalig worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7al
  - number: 7am
    text: |-
      Onze Minister stelt ten behoeve van de uitoefening van de in [artikel 7ak, tweede lid][ref1], bedoelde taken,
      personeel ter beschikking van de toelatingsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7am
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ak
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1a
  - number: 7an.1
    text: |-
      De kosten van de toelatingsorganisatie die samenhangen met de uitoefening van de in
      [artikel 7ak, tweede lid, onder a en d][ref1], bedoelde taken, worden bekostigd uit de vergoedingen, bedoeld in
      [artikel 7aj, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7aj
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7an
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ak
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 7aj
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7an.2
    text: |-
      De kosten van de toelatingsorganisatie die samenhangen met de uitoefening van de in
      [artikel 7ak, tweede lid, onder b][ref1], bedoelde taak, worden deels bekostigd uit de bijdrage, bedoeld in
      [artikel 7aj, tweede lid][ref2], en deels bekostigd door Onze Minister, volgens een bij of krachtens algemene
      maatregel van bestuur te bepalen verdeelsleutel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7aj
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7an
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ak
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 7aj
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: 7an.3
    text: |-
      De kosten van de toelatingsorganisatie die samenhangen met de uitoefening van de in
      [artikel 7ak, tweede lid, onder c, f en g][ref1], bedoelde taken worden bekostigd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7an
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ak
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1a
  - number: 7ao.1
    text: De toelatingsorganisatie stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ao
  - number: 7ao.2
    text: |-
      In het bestuursreglement worden de hoofdlijnen van de inrichting en de werkwijze van de organisatie van de
      toelatingsorganisatie vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ao
  - number: 7ap
    text: |-
      In het jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1], beschrijft de
      toelatingsorganisatie tevens de wijze waarop het stelsel van de kwaliteitsborging voor het bouwen in dat jaar heeft
      gefunctioneerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel7ap
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 12d.1
    text: |-
      Het college van burgemeester en wethouders kan, indien een vereniging van eigenaars ten behoeve van een bij haar
      in beheer zijnd gebouw niet beschikt over een onderhoudsplan en dat gebouw is gelegen in een gebied waarin de
      leefbaarheid naar het oordeel van het college van burgemeester en wethouders onder druk staat, die vereniging van
      eigenaars verplichten tot het binnen een door het college van burgemeester en wethouders te bepalen termijn laten
      opstellen van een onderhoudsplan door een deskundig persoon of een deskundige instantie en tot het van kracht
      laten blijven van dat plan gedurende zijn looptijd. Voor zover die looptijd langer is dan vijf jaar, omvat de in
      de vorige volzin bedoelde verplichting mede de verplichting het onderhoudsplan elke vijf jaar door een deskundig
      persoon of een deskundige instantie te laten herzien.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
  - number: 12d.2
    text: |-
      Het college van burgemeester en wethouders legt een verplichting als bedoeld in het eerste lid niet op dan nadat
      met toepassing van [artikel 127a van Boek 5 van het Burgerlijk Wetboek][ref1] een vergadering van eigenaars is
      bijeengeroepen en de vereniging van eigenaars niet binnen drie maanden nadat die vergadering heeft plaatsgevonden
      over een onderhoudsplan beschikt. De eerste volzin is niet van toepassing, indien redelijkerwijs voorzienbaar is
      dat het bijeenroepen van de vergadering van eigenaars, bedoeld in die zin, dan wel het in acht nemen van de termijn
      van drie maanden, bedoeld in die zin, er niet toe zal leiden dat de vereniging van eigenaars uit eigen beweging een
      onderhoudsplan opstelt of laat opstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel127a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: 127a
  - number: 12d.3
    text: 'Het onderhoudsplan, bedoeld in het eerste lid, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
  - number: 12d.3.a
    text: |-
      de onderhouds- en herstelwerkzaamheden aan en de vernieuwingen van die gedeelten van het gebouw waarover de
      vereniging van eigenaars het beheer voert over een periode van vijf jaar;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
  - number: 12d.3.b
    text: |-
      een schatting van de aan de werkzaamheden en de vernieuwingen, bedoeld in onderdeel a, verbonden kosten en een
      gelijkmatige toerekening van die kosten aan de onderscheiden jaren;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
  - number: 12d.3.c
    text: |-
      een schatting van de benodigde jaarlijkse reservering voor andere dan de gewone jaarlijkse kosten na de periode
      waarop het onderhoudsplan betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
  - number: 12d.4
    text: |-
      De vereniging van eigenaars zendt binnen vier weken na het opstellen van het onderhoudsplan, bedoeld in het eerste
      lid, een afschrift van het plan aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
  - number: 12d.5
    text: |-
      Indien een machtiging tot het bijeenroepen van een vergadering van eigenaars als bedoeld in
      [artikel 127a, eerste lid, aanhef, van Boek 5 van het Burgerlijk Wetboek][ref1] wordt afgegeven binnen vijf jaar
      nadat een eerdere machtiging is afgegeven, kan het college van burgemeester en wethouders de betrokken vereniging
      van eigenaars verplichten tot het uitbesteden van het beheer aan een professionele beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel127a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: 127a
  - number: '13'
    text: |-
      Het college van burgemeester en wethouders kan degene die als eigenaar van een gebouw of uit anderen hoofde
      bevoegd is tot het daaraan treffen van voorzieningen, verplichten tot het binnen een door het college te bepalen
      termijn treffen van voorzieningen die onderdeel zijn van een onderhoudsplan voor een gebouw als bedoeld in
      [artikel 12d, eerste lid][ref1], en niet binnen de daarvoor in het onderhoudsplan gestelde termijn zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
  - number: 13b.1
    text: |-
      Onder beheer wordt in dit artikel verstaan het aan derden in gebruik geven van een gebouw, open erf of terrein, het
      innen van de huurpenningen namens de eigenaar of degene die tot ingebruikgeving bevoegd was alsmede het verrichten
      van alle handelingen met betrekking tot dat gebouw, open erf of terrein die volgens het burgerlijk recht tot de
      rechten en plichten van een eigenaar behoren met uitzondering van vervreemden en bezwaren.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.2
    text: |-
      Het college van burgemeester en wethouders kan degene die als eigenaar of uit anderen hoofde bevoegd is tot het
      in gebruik geven van een gebouw, open erf of terrein, verplichten om het gebouw, open erf of terrein in beheer te
      geven aan het college van burgemeester en wethouders, aan een persoon die uit hoofde van beroep of bedrijf op het
      terrein van de huisvesting werkzaam is, of aan een op dat terrein werkzame instelling, dan wel in gebruik te geven
      aan een andere persoon dan degene die als gevolg van een sluiting als bedoeld in onderdeel c het gebruik van het
      gebouw, open erf of terrein heeft moeten staken, indien:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.2.a
    text: |-
      ter zake van een overtreding van op grond van [artikel 4.3 van de Omgevingswet][ref1] gestelde voorschriften voor
      bouwactiviteiten, sloopactiviteiten en het gebruik en het in stand houden van bouwwerken of van voorschriften
      over het gebruik of de staat van open erven of terreinen gegeven in een omgevingsplan, die naar het oordeel van
      het college van burgemeester en wethouders gepaard gaat met een gevaar voor de gezondheid of de veiligheid, een
      opgelegde last onder dwangsom niet heeft geleid tot het ongedaan maken of beëindigen van die overtreding, of


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 13b.2.b
    text: |-
      ter zake van een overtreding van voorschriften over het gebruik van gebouwen, open erven of terreinen of over
      het tegengaan van hinder gegeven in een omgevingsplan, die naar het oordeel van het college van burgemeester en
      wethouders gepaard gaat met een bedreiging van de leefbaarheid, een opgelegde last onder dwangsom niet heeft geleid
      tot het ongedaan maken of beëindigen van die overtreding, of
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.2.c
    text: |-
      het gebouw, open erf of terrein op grond van [artikel 17][ref1], dan wel het gebouw op grond van
      [artikel 174a van de Gemeentewet][ref2], een verordening als bedoeld in [artikel 174 van die wet][ref3] of
      [artikel 13b van de Opiumwet][ref4] is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 174a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '174'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: 13b
  - number: 13b.3
    text: |-
      Het college van burgemeester en wethouders kan voorwaarden stellen aan de uitvoering van de verplichting een
      gebouw, open erf of terrein in beheer of gebruik te geven, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.4
    text: |-
      Indien het gebouw, open erf of terrein noodzakelijke voorzieningen of aanpassingen behoeft om weer op redelijke
      wijze tot bewoning of gebruik te kunnen dienen, kan het college van burgemeester en wethouders besluiten, al dan
      niet gelijktijdig met het besluit, bedoeld in het tweede lid, dat degene aan wie het beheer is gegeven binnen een
      bepaalde termijn die voorzieningen of aanpassingen uitvoert. De uitvoering van deze voorzieningen of aanpassingen
      geschiedt op kosten van degene tot wie het in het tweede lid bedoelde besluit is gericht.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.5
    text: |-
      Het is degene tot wie een besluit als bedoeld in het tweede lid is gericht, verboden gedurende de termijn waarvoor
      een gebouw, open erf of terrein in beheer is gegeven beheershandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.6
    text: |-
      Degene aan wie het beheer is gegeven, stelt na overleg met degene tot wie het in het tweede lid bedoelde besluit
      is gericht, de huurprijs vast op een bedrag dat redelijk is in het economische verkeer en voldoet aan de voor de
      betreffende huurprijs geldende wettelijke regels.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.7
    text: |-
      Indien degene ten aanzien van wie een beheermaatregel als bedoeld in het tweede lid van kracht is, de overtreding,
      bedoeld in het tweede lid, onderdeel a of b begaat ten aanzien van een ander gebouw, open erf of terrein dan
      waarvoor de maatregel is opgelegd, en die overtreding gaat naar het oordeel van het college van burgemeester en
      wethouders gepaard met een bedreiging van de leefbaarheid of een gevaar voor de gezondheid of de veiligheid, kan
      het college van burgemeester en wethouders diegene ten aanzien van dat andere gebouw, open erf of terrein een
      beheermaatregel als bedoeld in het tweede lid opleggen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.8
    text: Het college van burgemeester en wethouders beëindigt het beheer
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.8.a
    text: |-
      zodra de overtreding bedoeld in het tweede lid, onderdeel a of b, en het gevaar voor de gezondheid of veiligheid
      respectievelijk de bedreiging van de leefbaarheid naar zijn oordeel zijn beëindigd;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.8.b
    text: |-
      indien van toepassing, de noodzakelijke voorzieningen of aanpassingen, bedoeld in het vierde lid, zijn getroffen,
      en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
  - number: 13b.8.c
    text: |-
      de beheervergoeding, bedoeld in [artikel 14, tweede lid][ref1], en de verschuldigde kosten voor het treffen van de
      voorzieningen of aanpassingen, bedoeld in het vierde lid, zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Indien een gebouw, open erf of terrein in beheer is gegeven als bedoeld in [artikel 13b, tweede lid][ref1], stelt
      het college van burgemeester en wethouders een beheervergoeding vast die degene tot wie het in artikel 13b, tweede
      lid bedoelde besluit is gericht, is verschuldigd aan het college van burgemeester en wethouders ten behoeve van
      het beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.2'
    text: De beheervergoeding bestaat uit een kostendekkende vergoeding voor de uitvoering van het beheer.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel14
  - number: '14.3'
    text: |-
      Degene tot wie het in [artikel 13b, tweede lid][ref1] bedoelde besluit is gericht, betaalt de beheervergoeding en
      de verschuldigde kosten voor het treffen van de voorzieningen of aanpassingen, bedoeld in artikel 13b, vierde lid,
      aan de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.4'
    text: |-
      Het college van burgemeester en wethouders kan de beheervergoeding en de verschuldigde kosten van de voorzieningen
      of aanpassingen, bedoeld in [artikel 13b, vierde lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.5'
    text: |-
      Het college van burgemeester en wethouders kan de door de beheerder geïnde huurpenningen verrekenen
      met de beheervergoeding en de verschuldigde kosten van de voorzieningen of aanpassingen, bedoeld in
      [artikel 13b, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.6'
    text: |-
      De beheerder draagt de door hem geïnde huurpenningen slechts af aan degene tot wie het in
      [artikel 13b, tweede lid][ref1] bedoelde besluit is gericht, voor zover geen geldschulden, bedoeld in het derde
      lid, open staan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: 14a
    text: |-
      Degene, tot wie een besluit als bedoeld in [artikel 12d][ref1], [13][ref2] of [13b, tweede lid][ref3], is gericht,
      of zijn rechtsopvolger en iedere verdere rechtsopvolger, is verplicht daaraan te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Het college van burgemeester en wethouders kan gelijktijdig met een besluit als bedoeld in [artikel 12d][ref1],
      [13][ref2] of [13b, tweede lid][ref3], besluiten tot oplegging van een last onder bestuursdwang of oplegging van
      een last onder dwangsom, gericht op naleving van het eerstgenoemde besluit. In dat geval worden beide besluiten
      gelijktijdig bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '15.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid maakt het besluit tot oplegging van een last onder bestuursdwang
      of oplegging van een last onder dwangsom, wat betreft de mogelijkheid van bezwaar en beroep, deel uit van het in
      [artikel 12d][ref1], [13][ref2] of [13b, tweede lid][ref3], bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '17.1'
    text: |-
      Indien herhaaldelijke overtreding van op grond van [artikel 4.3 van de Omgevingswet][ref1] gestelde voorschriften
      voor bouwactiviteiten, sloopactiviteiten en het gebruik en het in stand houden van bouwwerken of van voorschriften
      over het gebruik of de staat van open erven en terreinen gegeven in een omgevingsplan naar het oordeel van het
      college van burgemeester en wethouders gepaard gaat met een gevaar voor de gezondheid of de veiligheid kan het
      college van burgemeester en wethouders besluiten dat gebouw, open erf of terrein te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: '17.2'
    text: |-
      Indien herhaaldelijke overtreding van voorschriften over het gebruik van gebouwen, open erven of terreinen of het
      tegengaan van hinder gegeven in een omgevingsplan naar het oordeel van het college van burgemeester en wethouders
      gepaard gaat met een bedreiging van de leefbaarheid kan het college van burgemeester en wethouders besluiten dat
      gebouw, open erf of terrein te sluiten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel17
  - number: '17.3'
    text: |-
      Het college van burgemeester en wethouders kan bij de sluiting, bedoeld in het eerste en tweede lid, van de
      overtreder de ingevolge [artikel 5:25 van de Algemene wet bestuursrecht][ref1] verschuldigde kosten invorderen
      bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '17.4'
    text: |-
      Het college van burgemeester wethouders bepaalt in het besluit, bedoeld in het eerste en tweede lid, de duur van
      de sluiting.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel17
  - number: '18'
    text: |-
      Indien het college van burgemeester en wethouders een besluit als bedoeld in [artikel 13][ref1],
      [13b, tweede lid][ref2], of [17][ref3] heeft genomen en, nadat dat besluit is genomen, een ander bestuursorgaan
      bevoegd wordt ten aanzien van het betrokken gebouw, open erf of terrein blijft het college van burgemeester en
      wethouders dat het besluit heeft genomen bevoegd met betrekking tot dat besluit totdat het besluit onherroepelijk
      is geworden en is tenuitvoergelegd of is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '17'
        hoofdstuk: III
  - number: 18a.1
    text: |-
      Een wooncoöperatie is een vereniging met volledige rechtsbevoegdheid die zich ten doel stelt om haar leden in
      staat te stellen zelfstandig te voorzien in het beheer en onderhoud van de door hen bewoonde woongelegenheden en
      de direct daaraan grenzende omgeving. Indien die woongelegenheden zijn gesplitst in appartementsrechten in de zin
      van [artikel 106 van Boek 5 van het Burgerlijk Wetboek][ref1], betreft dat beheer en onderhoud uitsluitend die
      gedeelten van die woongelegenheden, welke zijn bestemd om door de leden van de wooncoöperatie als afzonderlijk
      geheel te worden gebruikt, onverminderd een regeling als bedoeld in [artikel 112 lid 4 van dat boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel112
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '106'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '112'
  - number: 18a.2
    text: |-
      Eigenaren of huurders van ten minste vijf in elkaars nabijheid gelegen woongelegenheden die financieel,
      administratief, bouwtechnisch, stedenbouwkundig of anderszins een eenheid vormen, kunnen een wooncoöperatie
      oprichten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel18a
  - number: 18a.3
    text: Een wooncoöperatie treft een regeling voor de behandeling van klachten en geschillen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel18a
  - number: 18a.4
    text: Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent wooncoöperaties.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel18a
  - number: '19.1'
    text: |-
      Onze Minister kan verenigingen met volledige rechtsbevoegdheid en stichtingen die zich ten doel stellen uitsluitend
      op het gebied van de volkshuisvesting werkzaam te zijn en beogen hun financiële middelen uitsluitend in het belang
      van de volkshuisvesting in te zetten, toelaten als instellingen, uitsluitend in het belang van de volkshuisvesting
      werkzaam. In het daartoe strekkende verzoek vermeldt de vereniging of de stichting in elk geval de gronden voor dat
      verzoek, de gemeente waar zij voornemens is woonplaats te houden en de gemeenten waar zij voornemens is feitelijk
      werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: '19.2'
    text: |-
      Voordat Onze Minister op het verzoek, bedoeld in het eerste lid, beslist, stelt hij de colleges van burgemeester
      en wethouders van de in dat lid bedoelde gemeenten, en de in het belang van de huurders van de woongelegenheden
      van de betrokken vereniging of stichting werkzame huurdersorganisaties en bewonerscommissies in de gelegenheid
      hun zienswijzen daarop aan hem kenbaar te maken. Die colleges, organisaties en commissies kunnen binnen vier weken
      nadien hun zienswijzen aan hem doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: '19.3'
    text: 'Onze Minister kan de toelating weigeren, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: 19.3.a
    text: de vereniging of de stichting niet voldoet aan het bepaalde bij of krachtens het eerste lid;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: 19.3.b
    text: |-
      de vereniging of de stichting naar zijn oordeel niet voldoende financieel draagkrachtig is of haar financiële
      continuïteit niet voldoende is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: 19.3.c
    text: sprake is van gebreken in de akte van oprichting van de vereniging of de stichting;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: 19.3.d
    text: |-
      personen die ingevolge het bepaalde bij of krachtens
      [artikel 25, tweede lid, vierde of zesde lid, of zevende lid][ref1], of [30, derde, zesde of achtste lid][ref2],
      geen lid zouden moeten respectievelijk kunnen zijn van het bestuur respectievelijk de raad van commissarissen van
      een toegelaten instelling aan de statuten van de vereniging of de stichting het recht kunnen ontlenen om personen
      in dat bestuur of die raad te benoemen of personen voor een zodanige benoeming voor te dragen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: 19.3.e
    text: |-
      aan de statuten van de vereniging of de stichting het recht kan worden ontleend tot het verkrijgen van de eigendom
      van de onroerende zaken of hun onroerende en infrastructurele aanhorigheden van de vereniging of de stichting op
      een wijze die met het bepaalde bij en krachtens deze wet in strijd is of
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: 19.3.f
    text: die toelating naar zijn oordeel anderszins niet in het belang van de volkshuisvesting is te achten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: '19.4'
    text: 'Onze Minister kan de toelating intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: 19.4.a
    text: |-
      de toegelaten instelling niet langer uitsluitend op het gebied van de volkshuisvesting werkzaam is of haar
      financiële middelen niet uitsluitend in het belang van de volkshuisvesting inzet, of
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: 19.4.b
    text: |-
      de toegelaten instelling naar zijn oordeel het belang van de volkshuisvesting zodanige schade berokkent of bij
      handhaving van de toelating op korte termijn zal berokkenen, dat haar toelating niet langer in dat belang is te
      achten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: '19.5'
    text: Van een besluit tot toelating of tot intrekking van de toelating wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: '19.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het verzoek, bedoeld
      in het eerste lid, te verstrekken gegevens en de behandeling van dat verzoek.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel19
  - number: '20.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State geeft bij de behandeling van een beroep
      tegen een besluit tot intrekking van de toelating aanvankelijk overeenkomstige toepassing aan
      [artikel 8:52 van de Algemene wet bestuursrecht][ref1] en kan nadien overeenkomstige toepassing geven aan
      [artikel 8:53 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '20.2'
    text: |-
      Nadat een besluit tot intrekking van de toelating onherroepelijk is geworden, wordt de toegelaten instelling op
      verzoek van Onze Minister ontbonden door de rechtbank in het arrondissement waarin zij gevestigd is.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
  - number: '20.3'
    text: |-
      De werking van een besluit tot intrekking van de toelating wordt opgeschort totdat de uitspraak tot ontbinding in
      kracht van gewijsde gaat.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
  - number: '20.4'
    text: 'De toelating eindigt:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
  - number: 20.4.a
    text: door inwerkingtreding van een besluit tot intrekking daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
  - number: 20.4.b
    text: |-
      door het in kracht van gewijsde gaan van een uitspraak tot ontbinding van de toegelaten instelling in andere
      bij de wet bepaalde gevallen dan dat, bedoeld in het tweede lid, of van een beschikking als bedoeld in
      [artikel 19a lid 2 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 19a
  - number: 20.4.c
    text: |-
      door de ontbinding van de toegelaten instelling in andere bij de wet bepaalde gevallen dan die, bedoeld in de
      onderdelen a en b, of
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
  - number: 20.4.d
    text: |-
      op het tijdstip waarop de toegelaten instelling ophoudt te bestaan als gevolg van een zuivere splitsing als bedoeld
      in [artikel 334a lid 2 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '20.5'
    text: |-
      Na ontbinding van een toegelaten instelling treedt Onze Minister of een door hem daartoe aangewezen persoon of
      instantie op als vereffenaar van haar vermogen. De vereffening leidt ertoe dat dat vermogen uitsluitend bestemd
      blijft voor het behartigen van het belang van de volkshuisvesting. Bij algemene maatregel van bestuur worden nadere
      voorschriften omtrent de vereffening gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel20
  - number: '21.1'
    text: |-
      De toegelaten instelling verbindt zich niet met een rechtspersoon of vennootschap dan nadat Onze Minister dat op
      een daartoe strekkend verzoek van de toegelaten instelling heeft goedgekeurd. Onze Minister onthoudt in elk geval
      zijn goedkeuring, indien:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: 21.1.a
    text: |-
      naar zijn oordeel de toegelaten instelling of rechtspersoon of vennootschap niet voldoet of zal voldoen aan het
      bepaalde bij en krachtens dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: 21.1.b
    text: |-
      naar zijn oordeel sprake is van een uit dat zich verbinden voortvloeiend niet aanvaardbaar risico dat door
      de toegelaten instelling in de betrokken rechtspersoon of vennootschap in te brengen vermogen niet voor de
      volkshuisvesting bestemd blijft;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: 21.1.c
    text: |-
      indien het verzoek niet inhoudt dat toepassing wordt gegeven aan [artikel 50a, eerste lid][ref1]: de in het belang
      van de huurders van haar woongelegenheden werkzame huurdersorganisaties aan de toegelaten instelling niet hebben
      medegedeeld dat zij met de verbinding instemmen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
  - number: 21.1.d
    text: |-
      de statuten van de rechtspersoon of de akte van de vennootschap met welke de toegelaten instelling voornemens is
      zich te verbinden niet voldoen aan [artikel 23][ref1] of aan de bij algemene maatregel van bestuur daaromtrent
      gegeven voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel23
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '2'
  - number: 21.1.e
    text: |-
      overeenkomstig bij of krachtens algemene maatregel van bestuur daaromtrent te geven voorschriften de financiële
      continuïteit van de toegelaten instelling of die rechtspersoon of vennootschap niet voldoende is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: 21.1.f
    text: |-
      de toegelaten instelling voornemens is die rechtspersoon of vennootschap anderszins vermogen te verschaffen dan
      door middel van het inbrengen van kapitaal of het verstrekken van een lening overeenkomstig bij of krachtens
      algemene maatregel van bestuur daaromtrent te geven voorschriften of
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: 21.1.g
    text: |-
      de toegelaten instelling voornemens is zich in enigerlei opzicht garant te stellen voor die rechtspersoon of
      vennootschap.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: '21.2'
    text: |-
      De goedkeuring, bedoeld in het eerste lid, is niet vereist voor een verbinding van een toegelaten instelling met
      een vereniging, waaraan de toegelaten instelling niet op andere wijze vermogen verstrekt dan met een periodieke
      contributie.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: '21.3'
    text: |-
      De goedkeuring, bedoeld in het eerste lid, is niet vereist voor een verbinding van een toegelaten instelling met
      een samenwerkingsvennootschap.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: '21.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het eerste lid, te verstrekken gegevens, de wijze waarop de toegelaten instelling degenen
      die een belang hebben bij de verbinding daarbij betrekt en de gronden waarop Onze Minister die verbinding kan
      goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: '21.5'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om toe te staan dat een samenwerkingsvennootschap in een
      andere gemeente feitelijk werkzaam is dan de gemeenten waarin die toegelaten instelling feitelijk werkzaam is,
      op welk verzoek Onze Minister beslist overeenkomstig bij algemene maatregel van bestuur daaromtrent te geven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21
  - number: 21a.1
    text: |-
      De toegelaten instelling verschaft een met haar verbonden onderneming niet anderszins vermogen dan door middel
      van het bij haar oprichting inbrengen van kapitaal of het aan die onderneming bij haar oprichting verstrekken van
      een lening als bedoeld in [artikel 21, eerste lid, onderdeel f][ref1]. Zij stelt zich na die oprichting niet in
      enigerlei opzicht garant voor die onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
  - number: 21a.2
    text: |-
      De toegelaten instelling verschaft een op 1 juli 2015 met haar verbonden onderneming geen ander vermogen dan het
      vermogen dat zij tot dat tijdstip aan die onderneming heeft verschaft, en stelt zich niet anderszins voor die
      onderneming garant dan zoals zij dat tot dat tijdstip heeft gedaan. De door haar aan een zodanige onderneming tot
      dat tijdstip gedane garantstellingen hebben uitsluitend betrekking op werkzaamheden van die onderneming waarmee
      voor dat tijdstip een aanvang is gemaakt, of met betrekking tot welke uit schriftelijke, uitsluitend op die
      werkzaamheden betrekking hebbende, stukken blijkt dat het maken van die aanvang wordt beoogd. Bij of krachtens
      algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21a
  - number: 21a.3
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om een ontheffing van een verbod als bedoeld in het eerste of
      tweede lid, op welk verzoek Onze Minister beslist overeenkomstig bij algemene maatregel van bestuur daaromtrent te
      geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21a
  - number: 21a.4
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op het verschaffen van vermogen aan en garantstellingen
      voor samenwerkingsvennootschappen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21a
  - number: 21b
    text: |-
      De winst van een met een toegelaten instelling verbonden besloten vennootschap met beperkte aansprakelijkheid als
      bedoeld in [artikel 175 van Boek 2 van het Burgerlijk Wetboek][ref1] komt de aandeelhouders ten goede. Van het
      bepaalde in de [artikelen 201][ref2] en [216 van dat boek][ref3] wordt niet afgeweken ten nadele van toegelaten
      instellingen die aandelen in die besloten vennootschap houden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel201
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel216
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '175'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '201'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '216'
  - number: 21c.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de categorieën van financiële instellingen aangewezen, met
      uitsluitend welke de toegelaten instelling transacties aangaat voor het verrichten van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21c
  - number: 21c.2
    text: |-
      Het door een toegelaten instelling aangaan van transacties met een instelling die behoort tot een categorie als
      bedoeld in het eerste lid voor het doen bouwen of verwerven van onroerende zaken of onroerende of infrastructurele
      aanhorigheden is niet toegestaan, voor zover daardoor het totaal van van zodanige instellingen aangetrokken
      financiële middelen komt te liggen boven een bij algemene maatregel van bestuur te bepalen percentage van de
      overeenkomstig [artikel 35, tweede lid][ref1], bepaalde actuele waarde van de onroerende zaken en hun onroerende en
      infrastructurele aanhorigheden van de toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 21d.1
    text: |-
      De vestiging van een recht van pand of hypotheek op zaken en daarmee verbonden rechten van een toegelaten
      instelling of een met haar verbonden onderneming die samenhangen met werkzaamheden op het gebied van de
      volkshuisvesting die niet behoren tot de diensten van algemeen economisch belang, welke vestiging geschiedt ten
      behoeve van het met een instelling die behoort tot een categorie als bedoeld in [artikel 21c, eerste lid][ref1],
      kunnen aangaan van transacties voor het verrichten van zodanige werkzaamheden, wordt niet door enig beding van
      derden of een vestiging van zodanige rechten ten behoeve van derden beperkt. Een zodanig beding of zodanige
      vestiging is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
        hoofdstuk: IV
        afdeling: '1'
  - number: 21d.2
    text: |-
      De vestiging van een recht van pand of hypotheek op zaken en daarmee verbonden rechten van een toegelaten
      instelling die samenhangen met werkzaamheden op het gebied van de volkshuisvesting die behoren tot de diensten
      van algemeen economisch belang, welke vestiging geschiedt ten behoeve van het door de borgingsvoorziening
      kunnen garanderen van de door toegelaten instellingen aan te trekken leningen voor het verrichten van
      zodanige werkzaamheden, wordt niet beperkt door enig beding van of een vestiging van zodanige rechten ten
      behoeve van anderen dan de borgingsvoorziening of instellingen die behoren tot een categorie als bedoeld in
      [artikel 21c, eerste lid][ref1]. Een zodanig beding of zodanige vestiging is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
        hoofdstuk: IV
        afdeling: '1'
  - number: 21d.3
    text: |-
      Bedingen of vestigingen van rechten als bedoeld in het eerste of tweede lid, die tot stand zijn gekomen voor 1 juli
      2015 blijven van kracht, behoudens hun nietigheid of vernietigbaarheid ingevolge enig ander wettelijk voorschrift
      dan die leden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
  - number: 21d.4
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
  - number: 21d.4.a
    text: 'de in dat lid bedoelde vestigingen van rechten ten behoeve van de borgingsvoorziening, indien en zolang:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
  - number: 21d.4.a.1°
    text: |-
      de situatie, bedoeld in [artikel 29, eerste lid, eerste volzin][ref1], zich voordoet en die situatie betrekking
      heeft op of gevolgen heeft voor het kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij
      en krachtens [artikel 47, eerste lid, onderdelen a tot en met i][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 21d.4.a.2°
    text: |-
      bij een toegelaten instelling of een met haar verbonden onderneming de financiële middelen ontbreken
      om haar werkzaamheden te kunnen voortzetten, die situatie betrekking heeft op of gevolgen heeft voor
      het kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij en krachtens
      [artikel 47, eerste lid, onderdelen a tot en met i][ref1], het bestuur heeft nagelaten die situatie onverwijld aan
      Onze Minister en de borgingsvoorziening te melden, en de borgingsvoorziening dit schriftelijk aan het bestuur heeft
      medegedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 21d.4.b
    text: bedingen die strekken tot het bepaalde in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21d
  - number: 21e
    text: |-
      Toegelaten instellingen, huurdersorganisaties, bewonerscommissies, gemeenteraden en colleges van burgemeester en
      wethouders kunnen, indien zij dit raadzaam achten, besluiten ter raadpleging voorleggen aan de huurder, bedoeld in
      artikel 1, eerste lid, onderdeel e, van de Wet op het overleg huurders verhuurder.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21e
  - number: 21f
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven
      omtrent de wijze waarop de borgingsvoorziening in compensatie als bedoeld in
      [artikel 1, eerste lid, begripsomschrijving van compensatie, onderdeel a][ref1], voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
        hoofdstuk: I
  - number: 21g
    text: |-
      De rijksbelastingdienst verstrekt Onze Minister op zijn verzoek de gegevens die naar zijn oordeel noodzakelijk zijn
      om de geschiktheid en de betrouwbaarheid, bedoeld in de [artikelen 25, tweede lid][ref1], [30, derde lid][ref2],
      en [59b, tweede lid][ref3], te beoordelen, alsmede de gegevens die naar zijn oordeel noodzakelijk zijn ten behoeve
      van het toezicht op de governance en de integriteit, bedoeld in [artikel 61, tweede lid, onderdeel b][ref4]. Bij of
      krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel59b
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel21g
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 59b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '5'
  - number: '22.1'
    text: |-
      Tenzij daarvan in het bepaalde bij of krachtens dit hoofdstuk wordt afgeweken, zijn de [titels 1][ref1],
      [7][ref2], [8, afdeling 2][ref3], en [9 van Boek 2 van het Burgerlijk Wetboek][ref4] van toepassing op de
      toegelaten instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003045
  - number: '22.2'
    text: 'Tenzij daarvan in deze afdeling wordt afgeweken:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel22
  - number: 22.2.a
    text: |-
      zijn de bepalingen van [titel 2 van Boek 2 van het Burgerlijk Wetboek][ref1] van toepassing op de toegelaten
      instellingen die verenigingen zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 22.2.b
    text: |-
      zijn de bepalingen van [titel 6 van dat boek][ref1] van toepassing op de toegelaten instellingen die stichtingen
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '22.3'
    text: |-
      Toegelaten instellingen zetten zich niet in de zin van [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1] om
      in een andere rechtsvorm dan die, genoemd in [artikel 19, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '23.1'
    text: |-
      In de statuten van een toegelaten instelling of van een met haar verbonden onderneming wordt bepaald dat zij
      uitsluitend respectievelijk mede werkzaam is op het gebied van de volkshuisvesting, en wordt dat gebied omschreven
      overeenkomstig het bepaalde bij en krachtens [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '23.2'
    text: |-
      De toegelaten instelling en een met haar verbonden onderneming behoeft voor de wijziging van haar statuten,
      respectievelijk wijzigingen van haar statuten of akte, die betrekking hebben op haar werkzaamheden op het
      gebied van de volkshuisvesting, de goedkeuring van Onze Minister, en legt daartoe elke voorgenomen wijziging
      respectievelijk zodanige wijziging aan hem voor.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het bestuur van een toegelaten instelling die een stichting is, is bevoegd de statuten te wijzigen, tenzij de
      statuten een ander daartoe bevoegd orgaan aanwijzen. Bij een toegelaten instelling die een vereniging is, is de
      algemene vergadering bevoegd de statuten te wijzigen, op voorstel van het bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel24
  - number: '24.2'
    text: Een bepaling in de statuten die wijziging van een statutaire bepaling uitsluit, is nietig.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel24
  - number: '24.3'
    text: |-
      Een bepaling in de statuten die de bevoegdheid tot wijziging van een of meer andere bepalingen van de statuten
      beperkt, kan slechts worden gewijzigd met inachtneming van gelijke beperking.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel24
  - number: '24.4'
    text: Een wijziging in de statuten komt, op straffe van nietigheid, tot stand bij notariële akte.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel24
  - number: '24.5'
    text: |-
      De bestuurders leggen een authentiek afschrift van de wijziging en de gewijzigde statuten neer ten kantore van
      het handelsregister.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel24
  - number: '24.6'
    text: |-
      De [artikelen 43 leden 2 tot en met 6][ref1], [44 lid 2][ref2], [291 lid 2][ref3], [293][ref4] en
      [294 van Boek 2 van het Burgerlijk Wetboek][ref5] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel291
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel293
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel294
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '291'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '293'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '294'
  - number: '25.1'
    text: |-
      Bestuurders zijn natuurlijke personen. De benoeming van bestuurders geschiedt voor de eerste maal
      bij de akte van oprichting. Opvolgende bestuurders worden door de raad van commissarissen benoemd.
      [Artikel 37 leden 1 tot en met 6 van Boek 2 van het Burgerlijk Wetboek][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel37
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '37'
  - number: '25.2'
    text: |-
      Alvorens de raad van commissarissen bestuurders benoemt, verzoekt deze Onze Minister om zijn zienswijze op de
      geschiktheid van die personen voor het lidmaatschap van het bestuur en de betrouwbaarheid van die personen aan haar
      kenbaar te maken. Aan de zienswijze kunnen voorwaarden worden verbonden. Onze Minister kan binnen vier weken zijn
      zienswijze aan de toegelaten instelling doen toekomen, welke termijn hij, onder schriftelijke kennisgeving daarvan
      aan de toegelaten instelling voor het verstrijken van die termijn, eenmalig met een door hem daarbij te bepalen
      termijn van ten hoogste vier weken kan verlengen. Een benoeming als bedoeld in de eerste volzin zonder dat Onze
      Minister daarover een positieve zienswijze heeft uitgebracht is, indien dat niet het gevolg is van zijn handelen
      of nalaten, strijdig met het belang van de volkshuisvesting. Bij of krachtens algemene maatregel van bestuur worden
      nadere voorschriften gegeven omtrent de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '25.3'
    text: |-
      Een bestuurder wordt benoemd voor een periode van ten hoogste vier jaar, en kan steeds voor een periode van ten
      hoogste vier jaar worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '25.4'
    text: |-
      Het lidmaatschap van het bestuur is onverenigbaar met een lidmaatschap van een orgaan van een rechtspersoon of
      vennootschap, of enige andere functie, waarvan de uitoefening door de bestuurder nadelig kan zijn voor de belangen
      van de toegelaten instelling of waarvan de uitoefening kan leiden tot de schijn van belangenverstrengeling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '25.5'
    text: |-
      Het bestuur is zodanig samengesteld dat geen verwevenheid ontstaat tussen het bestuur en een ander orgaan van de
      toegelaten instelling, of een orgaan van een andere rechtspersoon of vennootschap, die nadelig kan zijn voor de
      belangen van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '25.6'
    text: |-
      Het lidmaatschap van het bestuur kan worden verenigd met een functie die niet voldoet aan de eisen van het vierde
      lid, of het bestuur kan in afwijking van het vijfde lid worden samengesteld, indien daarmee het belang van de
      volkshuisvesting is gediend en door de toegelaten instelling afdoende maatregelen worden genomen om de risico’s
      van die vereniging of die samenstelling te beperken. Bij of krachtens algemene maatregel van bestuur kunnen nadere
      voorschriften worden gegeven omtrent de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '25.7'
    text: |-
      Degene die voor benoeming in het bestuur, of in het bestuur van een dochtermaatschappij of een
      samenwerkingsvennootschap, in aanmerking wenst te komen, wordt niet daarin benoemd dan nadat hij aan de instantie
      die tot die benoeming bevoegd is een verklaring heeft overgelegd, die inhoudt dat hij niet eerder een bestuurlijke
      of toezichthoudende functie heeft bekleed bij enige rechtspersoon of vennootschap die op het maatschappelijke
      belang gerichte werkzaamheden verricht ten aanzien waarvan, als gevolg van zijn handelen of nalaten, een aanwijzing
      of maatregel is opgelegd en dat hij nooit voor een financieel-economisch delict is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '25.8'
    text: Iedere bestuurder kan te allen tijde worden geschorst en ontslagen door de raad van commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '25.9'
    text: |-
      De statuten bevatten voorschriften omtrent de wijze waarop, in geval van ontstentenis of belet van de bestuurders,
      voorlopig in het bestuur wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel25
  - number: '26.1'
    text: |-
      Aan de goedkeuring van de raad van commissarissen zijn, behoudens in bij algemene maatregel van bestuur bepaalde
      gevallen, onderworpen de besluiten van het bestuur omtrent:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.a
    text: |-
      overdracht of overgang van de door de toegelaten instelling in stand gehouden onderneming dan wel een overwegend
      deel van die onderneming aan een derde;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.b
    text: |-
      het aangaan of verbreken van duurzame samenwerking van de toegelaten instelling met een andere rechtspersoon of
      vennootschap dan wel als volledig aansprakelijke vennote in een commanditaire vennootschap of vennootschap onder
      firma, indien deze samenwerking of verbreking van ingrijpende betekenis is voor de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.c
    text: |-
      het doen van een investering ten behoeve van de volkshuisvesting, indien daarmee ten minste € 3 000 000,– gemoeid
      is;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.d
    text: wijziging van de statuten of, bij een toegelaten instelling die een vereniging is, een voorstel daartoe;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.e
    text: |-
      ontbinding van de toegelaten instelling of, bij een toegelaten instelling die een vereniging is, een voorstel
      daartoe;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.f
    text: aangifte van faillissement en aanvraag van surseance van betaling van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.g
    text: |-
      gelijktijdige beëindiging of beëindiging binnen een kort tijdsbestek van de arbeidsovereenkomst van een
      aanmerkelijk aantal werknemers van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.h
    text: |-
      ingrijpende wijziging in de arbeidsomstandigheden van een aanmerkelijk aantal werknemers van de toegelaten
      instelling of van personen die als zelfstandigen of in een rechtspersoon of vennootschap daarin werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.i
    text: |-
      het vervreemden van onroerende zaken en hun onroerende en infrastructurele aanhorigheden van de toegelaten
      instelling, het daarop vestigen van een recht van erfpacht, opstal of vruchtgebruik, en het overdragen van de
      economische eigendom daarvan, telkens indien daarmee ten minste een bij algemene maatregel van bestuur bepaald
      bedrag gemoeid is, welk bedrag verschillend kan worden bepaald ten aanzien van verschillende categorieën beoogde
      verkrijgers van die zaken en aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: 26.1.j
    text: |-
      het vaststellen van het overzicht, bedoeld in [artikel 43, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 26.1.k
    text: |-
      een fusie als bedoeld in [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1] van de toegelaten instelling
      en betrokkenheid van de toegelaten instelling bij een verkrijging van het gehele vermogen als bedoeld in
      [artikel 53, negende lid][ref2], of, bij een toegelaten instelling die een vereniging is, een voorstel daartoe; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
  - number: 26.1.l
    text: andere, in de statuten bepaalde, onderwerpen dan die, bedoeld in de onderdelen a tot en met k.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: '26.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de goedkeuring, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: '26.3'
    text: |-
      Het ontbreken van de goedkeuring van de raad van commissarissen van een besluit als bedoeld in het eerste lid tast
      de vertegenwoordigingsbevoegdheid van bestuur of bestuurders niet aan.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel26
  - number: '27.1'
    text: |-
      Aan de goedkeuring van Onze Minister, op een daartoe strekkend verzoek van de toegelaten instelling, zijn,
      behoudens in bij of krachtens algemene maatregel van bestuur bepaalde gevallen, onderworpen de besluiten van het
      bestuur omtrent:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
  - number: 27.1.a
    text: |-
      het vervreemden van onroerende zaken en hun onroerende en infrastructurele aanhorigheden van de toegelaten
      instelling, het daarop vestigen van een recht van erfpacht, opstal of vruchtgebruik, en het overdragen van de
      economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
  - number: 27.1.b
    text: het vervreemden door de toegelaten instelling van aandelen in een dochtermaatschappij en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
  - number: 27.1.c
    text: |-
      overdracht of overgang van de door de toegelaten instelling in stand gehouden onderneming dan wel een overwegend
      deel van die onderneming aan een derde.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
  - number: '27.2'
    text: |-
      Onze Minister kan besluiten om een besluit als bedoeld in het eerste lid, aanhef en
      onderdeel a of c, niet goed te keuren in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], met dien verstande
      dat onder betrokkene als bedoeld in [artikel 1, eerste lid, van die wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '1'
  - number: 27.2.a
    text: |-
      voor de toepassing van de [artikelen 3][ref1], [4][ref2], [12][ref3], [26][ref4], [30][ref5] en
      [32 van die wet][ref6] wordt verstaan de wederpartij van de toegelaten instelling en


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0013798#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0013798#Artikel32
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0013798
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0013798
        artikel: '30'
      - id: ref6
        bwb_id: BWBR0013798
        artikel: '32'
  - number: 27.2.b
    text: |-
      voor de toepassing van de [artikelen 28, derde lid][ref1], en [33 van die wet][ref2] die wederpartij mede wordt
      verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel33
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '33'
  - number: '27.3'
    text: |-
      Voordat Onze Minister toepassing geeft aan het tweede lid, kan hij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies vragen
      als bedoeld in [artikel 9 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '27.4'
    text: |-
      Een besluit als bedoeld in het eerste lid, aanhef en onderdeel a of b, dat wordt genomen of uitgevoerd zonder dat
      Onze Minister het heeft goedgekeurd, is nietig.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
  - number: '27.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het eerste lid, te verstrekken gegevens, de wijze waarop Onze Minister degenen die een
      belang hebben bij de goedkeuring, bedoeld in dat lid, daarbij betrekt en de gronden waarop Onze Minister zodanige
      besluiten kan goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel27
  - number: '28'
    text: |-
      Besluiten van het bestuur kunnen bij of krachtens de statuten worden onderworpen aan de goedkeuring van de raad van
      commissarissen en de algemene vergadering, voor zover uit de wet niet anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien naar het oordeel van het bestuur bij een toegelaten instelling of een met haar verbonden onderneming
      de financiële middelen ontbreken om haar werkzaamheden te kunnen voortzetten, meldt het dat onverwijld aan
      Onze Minister en de borgingsvoorziening. Het bestuur stelt voorts een plan voor financiële sanering van de
      toegelaten instelling op, indien de situatie, bedoeld in de eerste volzin, betrekking heeft op of gevolgen
      heeft voor het kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij en krachtens
      [artikel 47, eerste lid, onderdelen a tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '29.2'
    text: |-
      Indien naar het oordeel van het bestuur een toegelaten instelling in enig kalenderjaar niet zal voldoen aan
      [artikel 48, eerste lid, eerste volzin][ref1], meldt het dat onverwijld aan Onze Minister en aan degenen voor wie
      toepassing van artikel 48, achtste lid, tweede volzin, overigens directe gevolgen kan hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 29a.1
    text: |-
      Het bestuur van de toegelaten instelling of een dochtermaatschappij doet onverwijld, op diens verzoek of eigener
      beweging, aan de raad van commissarissen of Onze Minister mededeling van alle feiten en omstandigheden met
      betrekking tot welke het voor dat bestuur duidelijk is of redelijkerwijs duidelijk zou moeten zijn dat zij van
      invloed kunnen zijn op enig door hem te nemen besluit omtrent de goedkeuring van enig door dat bestuur daartoe aan
      hem ingevolge dit hoofdstuk voorgelegd plan of voornemen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel29a
  - number: 29a.2
    text: Het opzettelijk niet voldoen aan het eerste lid is een overtreding.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel29a
  - number: 29b
    text: |-
      Het bestuur voorziet in het behouden en ontwikkelen van de kennis en de vaardigheden die met inachtneming van het
      bij en krachtens deze wet bepaalde noodzakelijk zijn voor het geschikt blijven van natuurlijke personen voor het
      lidmaatschap van het bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel29b
  - number: '30.1'
    text: |-
      De toegelaten instelling heeft een raad van commissarissen. De raad bestaat uit drie of meer commissarissen die
      natuurlijke personen zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.2'
    text: |-
      De benoeming van commissarissen geschiedt voor de eerste maal bij de akte van oprichting. Opvolgende commissarissen
      worden benoemd door de raad van commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.3'
    text: |-
      Alvorens de raad van commissarissen commissarissen benoemt, verzoekt deze Onze Minister om zijn zienswijze op de
      geschiktheid van de betrokken personen voor het lidmaatschap van de raad van commissarissen en de betrouwbaarheid
      van die personen aan haar kenbaar te maken. Aan de zienswijze kunnen voorwaarden worden verbonden. Onze Minister
      kan binnen vier weken zijn zienswijze aan de toegelaten instelling doen toekomen, welke termijn hij, onder
      schriftelijke kennisgeving daarvan aan de toegelaten instelling voor het verstrijken van die termijn, eenmalig met
      een door hem daarbij te bepalen termijn van ten hoogste vier weken kan verlengen. Een benoeming als bedoeld in de
      eerste volzin zonder dat Onze Minister daarover een positieve zienswijze heeft uitgebracht is, indien dat niet het
      gevolg is van zijn handelen of nalaten, strijdig met het belang van de volkshuisvesting. Bij of krachtens algemene
      maatregel van bestuur worden nadere voorschriften gegeven omtrent de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.4'
    text: |-
      Een commissaris wordt benoemd voor een periode van ten hoogste vier jaar en kan worden herbenoemd. De al dan niet
      aaneengesloten totale periode waarin een commissaris lid is van de raad van commissarissen van dezelfde toegelaten
      instelling is ten hoogste acht jaar. Indien een lid van de raad van commissarissen van een fuserende toegelaten
      instelling, na toepassing van het bepaalde in artikel 53, toetreedt tot de raad van commissarissen van de
      verkrijgende toegelaten instelling, dan wordt dat voor de toepassing van dit lid niet aangemerkt als een benoeming
      of herbenoeming.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.5'
    text: |-
      Een commissaris is deskundig en heeft geen persoonlijk belang in de toegelaten instelling
      of de met haar verbonden ondernemingen. Er is geen arbeidsovereenkomst als bedoeld in
      [artikel 610 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1] tussen een commissaris en de toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '30.6'
    text: |-
      Het lidmaatschap van de raad van commissarissen is onverenigbaar met een voormalig lidmaatschap of lidmaatschap
      van een orgaan van een rechtspersoon of vennootschap, of enige andere functie, waarvan de uitoefening door de
      commissaris nadelig kan zijn voor de belangen van de toegelaten instelling of waarvan de uitoefening kan leiden tot
      de schijn van belangenverstrengeling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.7'
    text: |-
      De raad van commissarissen is zodanig samengesteld dat de commissarissen ten opzichte van elkaar, het bestuur en
      welk deelbelang dan ook onafhankelijk en kritisch kunnen opereren. Voorts is de samenstelling zodanig dat geen
      verwevenheid ontstaat tussen de raad van commissarissen en een orgaan van een andere rechtspersoon of vennootschap
      die nadelig kan zijn voor de belangen van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.8'
    text: |-
      Degene die voor benoeming in de raad van commissarissen, of in de raad van commissarissen van een
      dochtermaatschappij, in aanmerking wenst te komen, wordt niet daarin benoemd dan nadat hij aan de instantie die
      tot die benoeming bevoegd is een verklaring heeft overgelegd, die inhoudt dat hij niet eerder een bestuurlijke of
      toezichthoudende functie heeft bekleed bij enige rechtspersoon of vennootschap die op het maatschappelijke belang
      gerichte werkzaamheden verricht ten aanzien waarvan, als gevolg van zijn handelen of nalaten, een aanwijzing of
      maatregel is opgelegd en dat hij nooit voor een financieel-economisch delict is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.9'
    text: Commissarissen kunnen huurders van woongelegenheden van toegelaten instellingen zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.10'
    text: 'De statuten bepalen in elk geval, dat:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.10.a
    text: |-
      de in het belang van de huurders van woongelegenheden van de toegelaten instelling werkzame huurdersorganisaties
      gezamenlijk het recht hebben een bindende voordracht te doen voor twee of meer commissarissen, indien de raad
      van commissarissen uit vier of meer commissarissen bestaat, dan wel een bindende voordracht te doen voor één
      commissaris, indien die raad uit drie commissarissen bestaat;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.10.b
    text: |-
      indien er geen zodanige huurdersorganisatie is, het in onderdeel a bedoelde voordrachtsrecht berust bij de
      bewonerscommissies gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.10.c
    text: |-
      indien geen voordracht als bedoeld in onderdeel a is gedaan op grond van onderdeel a of b, de raad van toezicht
      er zorg voor draagt dat de huurders van de woongelegenheden van de toegelaten instelling in de gelegenheid worden
      gesteld om een zodanige voordracht te doen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.10.d
    text: |-
      de raad van commissarissen bij de benoeming van commissarissen niet aan een voordracht als bedoeld in onderdeel a
      voorbijgaat, tenzij door die benoeming in strijd met het bepaalde bij of krachtens dit artikel zou worden gekomen,
      of tenzij de algemene vergadering van een toegelaten instelling die een vereniging is het bindende karakter aan
      die voordracht heeft ontnomen, in welke gevallen de raad van commissarissen hetzelfde aantal commissarissen uit de
      kring van huurders van woongelegenheden van toegelaten instellingen of uit de kring van huurdersorganisaties als
      bedoeld in onderdeel a benoemt als het aantal waarop die voordracht betrekking had;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.10.e
    text: |-
      die algemene vergadering slechts besluit om het bindende karakter aan een voordracht als bedoeld in onderdeel a te
      ontnemen, indien op die vergadering een aantal stemmen kan worden uitgebracht dat ten minste de helft bedraagt van
      het aantal stemmen dat door de stemgerechtigden gezamenlijk kan worden uitgebracht, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.10.f
    text: |-
      indien geen voordracht als bedoeld in onderdeel a is gedaan op grond van onderdeel a, b of c, de raad van
      commissarissen er zorg voor draagt dat hetzelfde aantal commissarissen uit de huurders van de woongelegenheden
      van de toegelaten instelling wordt benoemd als waarop een zodanige voordracht betrekking zou kunnen hebben gehad,
      met dien verstande dat door die benoeming niet in strijd met het bepaalde bij of krachtens dit artikel mag worden
      gekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.11'
    text: |-
      Het aantal op grond van het tiende lid, onderdeel a, b of c, voorgedragen commissarissen of het aantal op grond van
      het tiende lid, onderdeel f, benoemde commissarissen, is zodanig, dat zij tezamen ten minste een derde deel en niet
      de meerderheid van de raad van commissarissen kunnen uitmaken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '30.12'
    text: 'De statuten bevatten voorschriften omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.12.a
    text: |-
      de wijze waarop, in geval van ontstentenis of belet van de commissarissen, voorlopig in de raad van commissarissen
      wordt voorzien,
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.12.b
    text: |-
      het, door de raad van commissarissen onder begeleiding van personen of instanties buiten de toegelaten instelling,
      met een frequentie van ten minste een maal per twee jaar beoordelen van het functioneren van die raad,
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: 30.12.c
    text: |-
      de wijze waarop binnen de raad van commissarissen beslissingen worden genomen, met dien verstande dat het bepaalde
      in het vorige lid van overeenkomstige toepassing is op de onderlinge stemverhoudingen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel30
  - number: '31.1'
    text: |-
      Bij de vervulling van hun taak richten de commissarissen zich naar het belang van de toegelaten instelling en de
      door haar in stand gehouden onderneming, naar het te behartigen maatschappelijke belang en naar het belang van de
      betrokken belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel31
  - number: '31.2'
    text: |-
      De raad van commissarissen voorziet in het behouden en ontwikkelen van de kennis en de vaardigheden die met
      inachtneming van het bij en krachtens deze wet bepaalde noodzakelijk zijn voor het geschikt blijven van personen
      voor het lidmaatschap van de raad van commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel31
  - number: '31.3'
    text: |-
      In bij of krachtens algemene maatregel van bestuur te bepalen gevallen stelt de raad van commissarissen Onze
      Minister op de hoogte van zijn werkzaamheden ter uitoefening van zijn taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel31
  - number: '33.1'
    text: |-
      De ondernemingskamer van het gerechtshof Amsterdam is exclusief bevoegd een commissaris of de raad van
      commissarissen te ontslaan. Zij gaat daartoe uitsluitend over op verzoek, wegens verwaarlozing van zijn taak,
      wegens andere gewichtige redenen of wegens ingrijpende wijziging van de omstandigheden op grond waarvan het
      aanblijven als commissaris of als raad van toezicht redelijkerwijs niet van de toegelaten instelling kan worden
      verlangd. Het verzoek kan worden ingediend door de toegelaten instelling, te dezen vertegenwoordigd door het
      bestuur of de raad van commissarissen, of door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel33
  - number: '33.2'
    text: |-
      De raad van commissarissen of Onze Minister kan een commissaris schorsen. De schorsing vervalt van rechtswege,
      indien de toegelaten instelling of Onze Minister niet binnen een maand na de aanvang van de schorsing een verzoek
      tot ontslag bij de ondernemingskamer heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel33
  - number: '34'
    text: '*[vervallen]*'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het bestuur stelt jaarlijks een jaarrekening op, waarop van [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1]
      uitsluitend de [afdelingen 2 tot en met 6][ref2], [8][ref3], [10][ref4], [11][ref5], [13][ref6] en [16][ref7] van
      overeenkomstige toepassing zijn, met uitzondering van de bepalingen van die afdelingen die gezien hun inhoud niet
      op verenigingen of stichtingen van toepassing kunnen zijn en van bij algemene maatregel van bestuur aangewezen
      bepalingen of delen van bepalingen van die afdelingen. Bij die maatregel kan, uitsluitend indien het aanwijzen van
      een bepaling of deel daarvan als bedoeld in de eerste volzin dat noodzakelijk maakt, worden bepaald dat bepalingen
      of delen van bepalingen anders worden gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling8
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling10
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Afdeling13
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Afdeling16
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '8'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '10'
      - id: ref5
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref6
        bwb_id: BWBR0003045
        afdeling: '13'
      - id: ref7
        bwb_id: BWBR0003045
        afdeling: '16'
  - number: '35.2'
    text: |-
      In de jaarrekening waardeert het bestuur, overeenkomstig bij of krachtens algemene maatregel van bestuur
      daaromtrent te geven nadere voorschriften, de onroerende zaken en hun onroerende en infrastructurele aanhorigheden
      tegen de actuele waarde.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel35
  - number: '35.3'
    text: |-
      De jaarrekening wordt vastgesteld binnen zes maanden na afloop van het betrokken boekjaar van de toegelaten
      instelling. De vaststelling geschiedt in geval van een toegelaten instelling die een stichting is door de raad van
      commissarissen en in geval van een toegelaten instelling die een vereniging is door de algemene vergadering, tenzij
      de statuten hiertoe de raad van commissarissen aanwijzen. Vaststelling van de jaarrekening strekt niet tot kwijting
      aan een bestuurder onderscheidenlijk commissaris.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel35
  - number: '35.4'
    text: |-
      [Artikel 150 van Boek 2 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel150
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '150'
  - number: '35.5'
    text: |-
      De [artikelen 48 lid 3][ref1] en [299a van Boek 2 van het Burgerlijk Wetboek][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel299a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 299a
  - number: '35.6'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de inrichting van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel35
  - number: '36.1'
    text: |-
      Het bestuur stelt, onverminderd het vierde lid, jaarlijks een jaarverslag op, waarop van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] uitsluitend de [afdelingen 7 tot en met 10][ref2]
      en [16][ref3] van overeenkomstige toepassing zijn, met uitzondering van de bepalingen van die afdelingen
      die gezien hun inhoud niet op verenigingen of stichtingen van toepassing kunnen zijn, en van bij
      algemene maatregel van bestuur aangewezen bepalingen of delen van bepalingen van die afdelingen.
      [Artikel 35, eerste lid, tweede volzin][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling7
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling16
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel35
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '16'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '36.2'
    text: |-
      In het jaarverslag wordt een opgave opgenomen van de nevenfuncties van een bestuurder als bedoeld in
      [artikel 25, eerste lid][ref1], en van een commissaris als bedoeld in [artikel 30, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: '36.3'
    text: |-
      In het jaarverslag doet de raad van commissarissen afzonderlijk verslag van de wijze waarop hij in
      het verslagjaar toepassing heeft gegeven aan het bepaalde bij en krachtens de [artikelen 26][ref1],
      [31, eerste en tweede lid][ref2], en [35, derde lid][ref3], en van de naleving in dat jaar van het bepaalde bij en
      krachtens [artikel 30][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: '36.4'
    text: |-
      Bij de toepassing van het eerste, tweede en derde lid wordt mede, afzonderlijk, verslag gedaan ten
      aanzien van de met de betrokken toegelaten instelling verbonden ondernemingen, met uitzondering van de
      samenwerkingsvennootschappen waarin zij vennote bij wijze van geldschieting is.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36
  - number: 36a.1
    text: |-
      Het bestuur stelt jaarlijks een volkshuisvestingsverslag op, waaruit elke gemeente of openbaar lichaam waar de
      toegelaten instelling feitelijk werkzaam is kan afleiden welke gegevens met name op die gemeente of dat openbaar
      lichaam betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36a
  - number: 36a.2
    text: |-
      In het volkshuisvestingsverslag wordt verslag gedaan van de wijze waarop in het verslagjaar het belang van de
      volkshuisvesting is gediend en van het beleid dat in het verslagjaar ten aanzien van de belanghebbenden is gevoerd,
      en wordt mededeling gedaan over de verwachte gang van zaken omtrent het beleid van de toegelaten instelling met het
      oog op dat belang.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36a
  - number: 36a.3
    text: |-
      Bij de bepaling van het aantal woongelegenheden dat de toegelaten instelling in het verslagjaar in eigendom had,
      begrijpt zij steeds mede de woongelegenheden die zij in het verslagjaar heeft verkregen als gevolg van een fusie
      als bedoeld in [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
  - number: 36a.4
    text: |-
      De toegelaten instelling stelt een overzicht op met verantwoordingsgegevens over het verslagjaar,
      welk overzicht mede betrekking heeft op de met haar verbonden ondernemingen. Het overzicht wordt
      ingericht overeenkomstig bij ministeriële regeling te geven voorschriften, mede ter uitvoering van
      [artikel 49, zevende lid, eerste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
  - number: 36a.5
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de inhoud van het volkshuisvestingsverslag,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel36a
  - number: '37.1'
    text: |-
      De toegelaten instelling verleent opdracht tot onderzoek van de jaarrekening, bedoeld in [artikel 35][ref1],
      het jaarverslag, bedoeld in [artikel 36][ref2], en het overzicht, bedoeld in [artikel 36a, vierde lid][ref3],
      aan een registeraccountant of aan een Accountant-Administratieconsulent ten aanzien van wie bij de
      inschrijving in het in [artikel 36, eerste lid, van de Wet op het accountantsberoep][ref4] bedoelde
      register een aantekening is geplaatst als bedoeld in artikel 36, tweede lid, onderdeel i, van die wet.
      [Afdeling 9 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref5] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0032573#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Afdeling9
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0032573
        artikel: '36'
      - id: ref5
        bwb_id: BWBR0003045
        afdeling: '9'
  - number: '37.2'
    text: De bevoegdheid tot het verlenen van de opdracht berust bij de raad van commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel37
  - number: '37.3'
    text: |-
      De opdracht omvat mede het opstellen van een assurance-rapport inzake het volkshuisvestingsverslag en het
      overzicht, bedoeld in [artikel 36a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '37.4'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven omtrent het onderzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel37
  - number: '38.1'
    text: |-
      De toegelaten instelling doet jaarlijks voor 1 juli aan het college van burgemeester en wethouders van de
      gemeente waar zij haar woonplaats heeft, aan de colleges van burgemeester en wethouders van de gemeenten waar
      zij feitelijk werkzaam is,  aan Onze Minister en aan de in het belang van de huurders van haar woongelegenheden
      werkzame huurdersorganisaties en bewonerscommissies, met overeenkomstige toepassing van het bepaalde in
      [artikel 2 van de Wet op het overleg huurders verhuurder][ref1], toekomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 38.1.a
    text: |-
      de ingevolge de [artikelen 35 tot en met 36a][ref1] opgestelde stukken over het aan die datum voorafgaande
      kalenderjaar en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 38.1.b
    text: |-
      de verklaring, bedoeld in [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '38.2'
    text: 'De toegelaten instelling doet jaarlijks voor 1 juli aan Onze Minister toekomen:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
  - number: 38.2.a
    text: |-
      het assurance-rapport, bedoeld in [artikel 37, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel37
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 38.2.b
    text: |-
      het accountantsverslag, bedoeld in [artikel 393, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 38.2.c
    text: |-
      een bestuursverklaring bij de gegevens die zijn opgenomen in het overzicht, bedoeld in
      [artikel 36a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '38.3'
    text: |-
      De toegelaten instelling doet, indien zij van gemeenten als bedoeld in het eerste lid zienswijzen ontvangt op
      stukken als bedoeld in onderdeel a van dat lid, die zienswijzen onverwijld aan Onze Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
  - number: '38.4'
    text: |-
      Onze Minister kan de stukken, bedoeld in het eerste, tweede en derde lid, beoordelen en doet zijn oordeel aan de
      toegelaten instelling en de betrokken in de aanhef van het eerste lid bedoelde colleges toekomen. Bij of krachtens
      algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent die beoordeling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel38
  - number: '39'
    text: |-
      Onze Minister, de huurdersorganisaties en de bewonerscommissies zijn naast degenen, genoemd in
      [artikel 346 van Boek 2 van het Burgerlijk Wetboek][ref1], bevoegd tot het indienen van een verzoek als bedoeld in
      [artikel 345 van dat boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel346
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel345
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '346'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '345'
  - number: '40'
    text: |-
      De toegelaten instellingen, de samenwerkingsvennootschappen en, voor zover zij werkzaam zijn op het gebied van de
      volkshuisvesting, de andere met toegelaten instellingen verbonden ondernemingen zijn uitsluitend feitelijk werkzaam
      in gemeenten in Nederland, in gemeenten in de directe nabijheid van Nederland of in de openbare lichamen Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel40
  - number: '41.1'
    text: |-
      Indien de toegelaten instelling voornemens heeft tot het doen bouwen of verwerven van onroerende zaken of
      onroerende of infrastructurele aanhorigheden in een gemeente in Nederland, vraagt zij een verklaring van geen
      bezwaar aan bij het college van burgemeester en wethouders van die gemeente en van de gemeente waar zij haar
      woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41
  - number: '41.2'
    text: |-
      De toegelaten instelling maakt geen aanvang met het doen bouwen of verwerven van onroerende zaken of onroerende
      of infrastructurele aanhorigheden in een gemeente als eerstbedoeld in het eerste lid, indien een college van
      burgemeester en wethouders als bedoeld in dat lid bezwaar daartegen heeft gemaakt, of zolang zij niet van elk van
      die colleges van burgemeester en wethouders een verklaring van geen bezwaar heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41
  - number: '41.3'
    text: |-
      De toegelaten instelling doet de verklaringen van geen bezwaar toekomen aan Onze Minister met de stukken, bedoeld
      in [artikel 38, eerste lid][ref1], voor de in dat lid bedoelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '41.4'
    text: |-
      Indien een toegelaten instelling niet binnen twee maanden nadat zij een aanvraag als bedoeld in het eerste lid
      heeft ingediend van elk van de colleges van burgemeester en wethouders, bedoeld in dat lid, een verklaring van geen
      bezwaar heeft ontvangen, kan zij Onze Minister verzoeken om in het belang van de volkshuisvesting het doen bouwen
      of verwerven van onroerende zaken of onroerende of infrastructurele aanhorigheden in de gemeente, eerstbedoeld in
      dat lid, goed te keuren.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41
  - number: '41.5'
    text: |-
      Voordat Onze Minister op het verzoek, bedoeld in het vierde lid, beslist, stelt hij de colleges van burgemeester
      en wethouders van de gemeenten, bedoeld in het eerste lid, die bezwaar hebben gemaakt tegen het aldaar doen bouwen
      of verwerven van onroerende zaken of onroerende of infrastructurele aanhorigheden door de toegelaten instelling,
      in de gelegenheid hun zienswijzen daarop aan hem kenbaar te maken. Die colleges kunnen binnen vier weken nadien hun
      zienswijzen aan hem doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41
  - number: '41.6'
    text: |-
      Het eerste tot en met vijfde lid zijn, met betrekking tot de openbare lichamen Bonaire, Sint Eustatius en Saba, van
      overeenkomstige toepassing op het orgaan dat in die openbare lichamen met het dagelijkse bestuur is belast.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41
  - number: 41a.1
    text: |-
      Indien de toegelaten instelling voornemens is feitelijk werkzaam te zijn in een gemeente in de directe nabijheid
      van Nederland, legt zij dat voornemen ter goedkeuring aan Onze Minister voor.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41a
  - number: 41a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de goedkeuring, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41a
  - number: 41b.1
    text: |-
      Onze Minister kan, op verzoek van de colleges van burgemeester en wethouders van twee of meer aan elkaar grenzende
      gemeenten in Nederland, goedkeuren dat, in afwijking van [artikel 41][ref1], de in een of meer van die gemeenten
      feitelijk werkzame toegelaten instellingen en samenwerkingsvennootschappen in al die gemeenten feitelijk werkzaam
      mogen zijn. Van het besluit van Onze Minister wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 41b.2
    text: |-
      Onze Minister geeft uitsluitend toepassing aan het eerste lid, indien de colleges, bedoeld in dat lid, in hun
      verzoek aannemelijk hebben gemaakt dat zij alle gelegen zijn in hetzelfde vanuit het oogpunt van het functioneren
      van de woningmarkt als een geheel te beschouwen gebied.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41b
  - number: 41b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de toepassing
      van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41b
  - number: 41c.1
    text: |-
      Na toepassing van [artikel 41b, eerste lid][ref1], maken de toegelaten instellingen en de
      samenwerkingsvennootschappen, bedoeld in dat lid, in andere gemeenten dan die, bedoeld in dat lid,
      geen aanvang met het doen bouwen of verwerven van woongelegenheden of aanhorigheden als bedoeld in
      [artikel 45, tweede lid, onderdeel a][ref2], of van gebouwen of aanhorigheden als bedoeld in artikel 45, tweede
      lid, onderdelen d en g, en verrichten geen handelingen met het oog op het maken van die aanvang. De eerste volzin
      is niet van toepassing op het bouwen van haar zodanige woongelegenheden of aanhorigheden ter plaatse van haar
      woongelegenheden of hun onroerende of infrastructurele aanhorigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 41c.2
    text: |-
      Het eerste lid is niet van toepassing, indien en zolang de toegelaten instellingen of samenwerkingsvennootschappen,
      bedoeld in [artikel 41b, eerste lid][ref1], zich bij hun werkzaamheden in het bijzonder richten op de huisvesting
      van bij algemene maatregel van bestuur aangewezen categorieën van personen. Andere toegelaten instellingen als
      bedoeld in dat lid kunnen Onze Minister verzoeken om een ontheffing van het verbod, bedoeld in het eerste lid, op
      welk verzoek Onze Minister mede ten aanzien van de betrokken samenwerkingsvennootschappen beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 41c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het toepassingsbereik
      van het eerste lid en omtrent de bij het verzoek, bedoeld in het tweede lid, tweede volzin, te verstrekken
      gegevens, de wijze waarop de toegelaten instelling degenen die een belang hebben bij de in die volzin bedoelde
      ontheffing daarbij betrekt en de gronden waarop Onze Minister die ontheffing kan verlenen of weigeren.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41c
  - number: 41d
    text: |-
      Bij algemene maatregel van bestuur kunnen gebieden als bedoeld in [artikel 41b, tweede lid][ref1], worden
      aangewezen, bij welke aanwijzing [artikel 41c][ref2] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41c
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '42.1'
    text: |-
      De gemeenteraad stelt een woonvisie vast, waarin het gemeentelijke volkshuisvestingsbeleid voor ten hoogste de
      eerstvolgende vijf kalenderjaren is neergelegd. De gemeente voert overleg daarover met andere gemeenten, voor zover
      die gemeenten daarbij een rechtstreeks belang hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel42
  - number: '42.2'
    text: |-
      De toegelaten instelling draagt met haar werkzaamheden naar redelijkheid bij aan de uitvoering van de woonvisie
      van de gemeenten waar zij feitelijk werkzaam is. De eerste volzin is niet van toepassing, zolang de colleges van
      burgemeester en wethouders van die gemeenten geen bescheiden aan de toegelaten instelling hebben verstrekt, waarin
      zij op hoofdlijnen een toegelicht inzicht verschaffen in hun voorgenomen woonvisie, waarover zij met betrekking
      tot onderwerpen waarbij andere gemeenten een rechtstreeks belang hebben overleg hebben gevoerd met de colleges van
      burgemeester en wethouders van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel42
  - number: '42.3'
    text: |-
      De toegelaten instelling zet haar middelen bij voorrang in om te voldoen aan het eerste lid, eerste volzin, en
      overigens ten behoeve van de volkshuisvesting. Daartoe behoort tevens het inzetten van middelen ten behoeve van het
      door andere toegelaten instellingen toepassing geven aan het eerste lid, eerste volzin. Bij algemene maatregel van
      bestuur kunnen gevallen worden bepaald waarin de toegelaten instelling toepassing geeft aan de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel42
  - number: '42.4'
    text: |-
      De toegelaten instelling bestemt batige saldi en andere middelen, voor zover aanhouding daarvan niet
      noodzakelijk is voor haar voortbestaan in financieel opzicht, uitsluitend voor werkzaamheden op het gebied van
      de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel42
  - number: '42.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van het
      tweede lid, eerste volzin, en het derde lid, en omtrent de indicatie van de middelen welke de toegelaten instelling
      ter beschikking staan ter uitvoering van het tweede lid, eerste volzin.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel42
  - number: '43.1'
    text: |-
      De toegelaten instelling stelt een overzicht op van voorgenomen werkzaamheden, waaruit de colleges van
      burgemeester en wethouders van de gemeenten waar zij feitelijk werkzaam is kunnen afleiden welke werkzaamheden
      op hun grondgebied zijn voorzien, en welke bijdrage daarmee is beoogd aan de uitvoering van de woonvisie van die
      gemeenten. Het overzicht heeft betrekking op de eerstvolgende vijf kalenderjaren en heeft mede betrekking op de met
      de toegelaten instelling verbonden ondernemingen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel43
  - number: '43.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de inhoud van het overzicht, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel43
  - number: '44.1'
    text: |-
      De toegelaten instelling verzoekt jaarlijks op uiterlijk 1 april om een overleg met de colleges van burgemeester
      en wethouders van de gemeenten waar zij feitelijk werkzaam is, en de in het belang van de huurders van haar
      woongelegenheden werkzame huurdersorganisaties en bewonerscommissies, met overeenkomstige toepassing van het
      bepaalde in [artikel 2 van de Wet op het overleg huurders verhuurder][ref1], in verband met afspraken over de
      uitvoering van de woonvisie van die gemeenten in ten minste het kalenderjaar dat direct volgt op die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '2'
  - number: '44.2'
    text: |-
      De toegelaten instelling draagt er zorg voor dat de betrokken colleges van burgemeesters en wethouders en de
      organisaties en commissies, bedoeld in het eerste lid, jaarlijks op 1 juli of een andere met de betrokken colleges
      van burgemeester en wethouders en de organisaties en commissies overeengekomen datum beschikken over het overzicht,
      bedoeld in [artikel 43, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '44.3'
    text: |-
      Indien het overleg, bedoeld in het eerste lid, niet binnen zes maanden na de in het tweede lid genoemde datum tot
      afspraken leidt, kan het college van burgemeester en wethouders, de toegelaten instelling of de organisaties en
      commissies, bedoeld in het tweede lid, het geschil dat aan het tot stand komen van die afspraken in de weg staat
      binnen vier weken na het ontstaan van het geschil schriftelijk en onderbouwd ter behandeling voorleggen aan Onze
      Minister, die vervolgens een bindende uitspraak doet.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44
  - number: '44.4'
    text: |-
      Onze Minister betrekt bij de behandeling, bedoeld in het derde lid, de woonvisie van die gemeenten, de financiële
      mogelijkheden van de toegelaten instelling en de bij of krachtens deze wet gegeven voorschriften, en stelt het
      betrokken college van burgemeester en wethouders, de betrokken toegelaten instelling en de betrokken organisaties
      en commissies binnen twaalf weken in kennis van zijn bindende uitspraak over het geschil, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44
  - number: '44.5'
    text: |-
      Onze Minister kan de termijn, genoemd in het vierde lid, door schriftelijke kennisgeving daarvan aan het betrokken
      college van burgemeester en wethouders, de betrokken toegelaten instelling en de betrokken organisaties en
      commissies, telkens verlengen met een door hem daarbij te bepalen termijn van ten hoogste vier weken, van welke
      verlenging hij kennis geeft voor het verstrijken van de eerstgenoemde dan wel de voor de laatste maal verlengde
      termijn.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44
  - number: '44.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van het
      derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44
  - number: 44a.1
    text: |-
      De toegelaten instelling doet jaarlijks voor 15 december volgend op de in [artikel 44, eerste lid][ref1],
      bedoelde datum aan Onze Minister, aan de colleges van burgemeester en wethouders van de gemeenten
      waar zij feitelijk werkzaam is, en aan de in het belang van de huurders van haar woongelegenheden
      werkzame huurdersorganisaties en bewonerscommissies, met overeenkomstige toepassing van het bepaalde in
      [artikel 2 van de Wet op het overleg huurders verhuurder][ref2], toekomen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 44a.1.a
    text: |-
      een overeenkomstig bij ministeriële regeling te geven voorschriften ingericht overzicht omtrent de onderwerpen,
      bedoeld in [artikel 43, eerste lid][ref1], welk overzicht mede betrekking heeft op de met haar verbonden
      ondernemingen; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 44a.1.b
    text: een bestuursverklaring bij de gegevens die zijn opgenomen in het overzicht, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44a
  - number: 44a.2
    text: |-
      De toegelaten instelling stelt de op grond van [artikel 44, eerste lid][ref1], gemaakte en geldende afspraken waar
      zij partij bij is langs elektronische weg algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 44a.3
    text: |-
      Onze Minister kan het overzicht beoordelen, in welk geval hij zijn oordeel aan de toegelaten instelling doet
      toekomen. Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent die beoordeling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44a
  - number: 44b.1
    text: |-
      De toegelaten instelling verstrekt aan de colleges van burgemeester en wethouders van de gemeenten
      waar zij feitelijk werkzaam is, en aan de in het belang van de huurders van haar woongelegenheden
      werkzame huurdersorganisaties en bewonerscommissies, met overeenkomstige toepassing van het bepaalde in
      [artikel 2 van de Wet op het overleg huurders verhuurder][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 44b.1.a
    text: |-
      gegevens over haar werkzaamheden met betrekking tot de financiering waarvan een zodanige gemeente zich borg heeft
      gesteld en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44b
  - number: 44b.1.b
    text: |-
      andere gegevens, waarvan kennisneming naar het oordeel van die colleges, organisaties of commissies wenselijk is
      uit het oogpunt van een goede beoordeling van de wijze waarop die toegelaten instelling bijdraagt aan of voornemens
      is bij te dragen aan de uitvoering van de woonvisie van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44b
  - number: 44b.2
    text: |-
      Het eerste lid is niet van toepassing indien en zolang het college van burgemeester en wethouders van een gemeente
      geen bescheiden aan de toegelaten instelling heeft verstrekt, waarin zij op hoofdlijnen een toegelicht inzicht
      verschaft in de door die gemeente voorgenomen woonvisie, waarover zij met betrekking tot onderwerpen waarbij andere
      gemeenten een rechtstreeks belang hebben overleg heeft gevoerd met de colleges van burgemeester en wethouders van
      die gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44b
  - number: 44d.1
    text: |-
      Indien een toegelaten instelling of samenwerkingsvennootschap die grond in eeuwigdurende erfpacht heeft van de
      gemeente, de bestemming van die grond wil wijzigen in bestemd voor huurwoningen met een aanvangshuurprijs van
      ten minste het bedrag, bedoeld in [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref1], en ten
      hoogste een in een gemeentelijke verordening bepaalde, jaarlijks te indexeren aanvangshuurprijs, kan de gemeente
      aan de toestemming, bedoeld in[ artikel 89 lid 2 van Boek 5 van het Burgerlijk Wetboek][ref2], niet de voorwaarde
      verbinden dat de canon wordt verhoogd. Een andersluidend beding in de akte van vestiging is vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel89
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44d
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '89'
  - number: 44d.2
    text: |-
      Indien een toegelaten instelling of samenwerkingsvennootschap als gevolg van toepassing van het eerste lid een
      financieel voordeel heeft ten opzichte van andere marktpartijen, komt dit voordeel ten goede aan de uitvoering
      van de diensten van algemeen economisch belang, die aan haar of de samenwerkingsvennootschap zijn opgedragen. Bij
      algemene maatregel van bestuur worden nadere voorschriften gegeven over de wijze waarop dit voordeel wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel44d
  - number: '45.1'
    text: |-
      De toegelaten instellingen, de met hen verbonden ondernemingen van welke zij de enige verstrekker van kapitaal
      zijn en de samenwerkingsvennootschappen zijn uitsluitend werkzaam op het gebied van de volkshuisvesting. Indien
      een toegelaten instelling een deel van het kapitaal van een met haar verbonden onderneming inbrengt, is die
      onderneming, overeenkomstig bij of krachtens algemene maatregel van bestuur daaromtrent te geven voorschriften, ten
      minste naar rato van dat deel werkzaam op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: '45.2'
    text: |-
      Het gebied van de volkshuisvesting omvat uitsluitend het door de toegelaten instelling of door een met haar
      verbonden onderneming:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.a
    text: |-
      doen bouwen en verwerven van voor permanent verblijf bedoelde woongelegenheden en hun onroerende en
      infrastructurele aanhorigheden, alsmede bezwaren, toewijzen, verhuren, vervreemden en doen slopen van haar zodanige
      woongelegenheden en aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, daarop
      vestigen van een recht van erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.b
    text: |-
      in stand houden van en treffen van voorzieningen aan haar voor permanent verblijf bedoelde woongelegenheden en hun
      onroerende en infrastructurele aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen,
      en aan de direct daaraan grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.c
    text: 'verlenen van diensten aan:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.c.1°
    text: |-
      bewoners van voor permanent verblijf bedoelde woongelegenheden en aan leden van wooncoöperaties aan welke zij
      zodanige woongelegenheden heeft vervreemd, voor zover die diensten rechtstreeks verband houden met de bewoning of
      betrekking hebben op overhead ten behoeve van de verduurzaming van deze woongelegenheden of het duurzaam in stand
      houden daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.c.2°
    text: |-
      personen die haar te kennen geven voor permanent verblijf bedoelde woongelegenheden te willen betrekken, voor zover
      die diensten rechtstreeks verband houden met hun huisvesting; en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.c.3°
    text: |-
      huurders van gebouwen bedoeld in de onderdelen d of g, voor zover die diensten rechtstreeks verband houden met het
      gebruik van deze gebouwen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.d
    text: |-
      doen bouwen en verwerven van gebouwen die een maatschappelijke gebruiksbestemming hebben en hun onroerende en
      infrastructurele aanhorigheden, alsmede bezwaren, verhuren, vervreemden en doen slopen van haar zodanige gebouwen
      en aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, daarop vestigen van een
      recht van erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.e
    text: |-
      in stand houden van en treffen van voorzieningen aan haar gebouwen als bedoeld in onderdeel d en hun onroerende
      en infrastructurele aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, en aan de
      direct daaraan grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.f
    text: |-
      bijdragen aan de leefbaarheid in de directe nabijheid van woongelegenheden of andere onroerende zaken van de
      toegelaten instelling of van woongelegenheden als bedoeld in het zevende lid, of ten behoeve van de huurders van
      die woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.g
    text: |-
      doen bouwen en verwerven van gebouwen die een kleinschalige bedrijfsmatige gebruiksbestemming hebben en hun
      onroerende en infrastructurele aanhorigheden, alsmede bezwaren, verhuren, vervreemden en doen slopen van haar
      zodanige gebouwen en aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, daarop
      vestigen van een recht van erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.h
    text: |-
      in stand houden van en treffen van voorzieningen aan haar gebouwen als bedoeld in onderdeel g en hun onroerende
      en infrastructurele aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, en aan de
      direct daaraan grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.i
    text: |-
      verrichten van de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden,
      genoemd in de onderdelen a tot en met h, waartoe behoren het verwerven of doen slopen van onroerende zaken,
      indien dat geschiedt met het oog op het op de grond waar die zaken gelegen zijn verrichten van werkzaamheden
      overeenkomstig het bepaalde bij en krachtens de onderdelen a, d en g, het derde of vierde lid en het zesde lid;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.j
    text: |-
      verlenen van diensten ten behoeve van de bedrijfsvoering of administratie, waaronder mede begrepen het toewijzen
      van woongelegenheden en aanhorigheden, van haar verbonden ondernemingen of van toegelaten instellingen en met hen
      verbonden ondernemingen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.2.k
    text: |-
      faciliteren van huurdersorganisaties of bewonerscommissies bij de aan hen opgedragen taken bij of krachtens deze
      wet en de [Wet op het overleg huurders verhuurder][ref1] en verlenen van diensten ten behoeve van de administratie
      van huurdersorganisaties of bewonerscommissies;


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: 45.2.l
    text: |-
      verbetering van de energetische prestatie, waaronder begrepen het opwekken van hernieuwbare energie, van haar voor
      permanent verblijf bedoelde woongelegenheden of die van een andere toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: '45.3'
    text: |-
      Het gebied van de volkshuisvesting omvat de werkzaamheden, genoemd in het tweede lid, onderdelen d tot en
      met h, die behoren tot de diensten van algemeen economisch belang, en, voor zover daarmee verband houdende,
      de werkzaamheden, bedoeld in het tweede lid, onderdeel i, voor zover deze worden verricht in gebieden waar
      woongelegenheden in eigendom van toegelaten instellingen gelegen zijn, en voor zover de gebouwen, bedoeld in de
      onderdelen d en g van dat lid, een op een wijk, buurt of buurtschap in een zodanig gebied gerichte functie hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: '45.4'
    text: |-
      Het gebied van de volkshuisvesting omvat de werkzaamheden, genoemd in het tweede lid, onderdelen a tot en met
      h, die niet behoren tot de diensten van algemeen economisch belang, en, voor zover daarmee verband houdende, de
      werkzaamheden, bedoeld in het tweede lid, onderdeel i, voor zover:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.4.a
    text: |-
      zij worden verricht in gebieden waar woongelegenheden in eigendom van toegelaten instellingen gelegen zijn, en voor
      zover de gebouwen, bedoeld in de onderdelen d en g van dat lid, een op een wijk, buurt of buurtschap in een zodanig
      gebied gerichte functie hebben;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.4.b
    text: zij worden verricht op bebouwde grond;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.4.c
    text: |-
      indien zij door toegelaten instellingen of samenwerkingsvennootschappen worden verricht op niet bebouwde
      grond: die werkzaamheden bijdragen aan de diensten van algemeen economisch belang welke aan hen ingevolge
      [artikel 47, eerste lid][ref1], zijn opgedragen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 45.4.d
    text: |-
      indien werkzaamheden als genoemd in het tweede lid, onderdeel g, en, voor zover daarmee verband houdende,
      werkzaamheden als bedoeld in het tweede lid, onderdeel i, door andere met toegelaten instellingen verbonden
      ondernemingen worden verricht op niet bebouwde grond: die werkzaamheden bijdragen aan het verrichten van hun andere
      werkzaamheden op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: '45.5'
    text: |-
      Het derde lid, het vierde lid, aanhef en onderdelen a en b, en het ten aanzien daarvan bepaalde krachtens het
      zesde lid, is niet van toepassing op met toegelaten instellingen verbonden ondernemingen, met uitzondering van
      samenwerkingsvennootschappen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: '45.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent het toepassingsbereik van het tweede
      lid, onderdelen a, b, c, d, f, g, i, j, k en l, en derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: '45.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen gevallen worden bepaald waarin en voorwaarden worden gesteld
      waaronder het de toegelaten instellingen, de met hen verbonden ondernemingen en de samenwerkingsvennootschappen, is
      toegestaan om de volgende werkzaamheden te verrichten, die alsdan tot het gebied van de volkshuisvesting behoren:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.7.a
    text: het toewijzen en verhuren van woongelegenheden en aanhorigheden van derden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.7.b
    text: |-
      het in stand houden van en het treffen van kleinschalige voorzieningen aan gebouwen en woongelegenheden en
      aanhorigheden van derden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.7.c
    text: |-
      het huren van gebouwen en woongelegenheden en aanhorigheden van derden, ten behoeve van het verrichten van de
      werkzaamheden, bedoeld in de onderdelen a en b, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: 45.7.d
    text: |-
      het verlenen van diensten ten behoeve van de bedrijfsvoering of administratie van derden, voor zover die
      werkzaamheden betrekking hebben op verhuur van woongelegenheden en aanhorigheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel45
  - number: '46.1'
    text: |-
      De toegelaten instelling geeft, behoudens het bepaalde bij en krachtens de
      [artikelen 49a, tweede en vierde lid][ref1], [50][ref2] en [50a][ref3], voorrang aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 49a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
  - number: 46.1.a
    text: |-
      het huisvesten of doen huisvesten van personen die door hun inkomen of door andere omstandigheden moeilijkheden
      ondervinden bij het vinden van hun passende huisvesting, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
  - number: 46.1.b
    text: |-
      de werkzaamheden, genoemd in [artikel 45, tweede lid, onderdelen a, b en c][ref1], en, voor
      zover daarmee verband houdende, de werkzaamheden, bedoeld in artikel 45, tweede lid, onderdeel
      i, voor zover die te verhuren woongelegenheden betreffen met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: '46.2'
    text: |-
      De toegelaten instelling gaat slechts overeenkomsten van huur en verhuur aan, voor zover aan ten minste een
      bij algemene maatregel van bestuur te bepalen percentage van huishoudens als eerstbedoeld of laatstbedoeld in
      [artikel 20, tweede lid, van de Wet op de huurtoeslag][ref1], die een huishoudinkomen hebben dat niet hoger is dan
      het voor het betrokken huishouden toepasselijke bedrag, bedoeld in [artikel 14 van die wet][ref2], woongelegenheden
      waarvoor huurtoeslag ontvangen kan worden op grond van die wet worden verhuurd met een huurprijs van ten hoogste
      het in [artikel 20, tweede lid, van die wet][ref3] eerstgenoemde respectievelijk laatstgenoemde bedrag. Bij
      algemene maatregel van bestuur kunnen huishoudens worden uitgezonderd van en nadere voorschriften worden gegeven
      omtrent de toepassing van de eerste volzin. Bij ministeriële regeling kunnen eisen worden gesteld aan de wijze
      waarop de inkomensvaststelling door de toegelaten instelling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel20
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '20'
  - number: '46.3'
    text: |-
      Indien een toegelaten instelling met een jongere als bedoeld in
      [artikel 274c lid 2 van Boek 7 van het Burgerlijk Wetboek][ref1] een overeenkomst van huur en verhuur op grond van
      dat artikel is aangegaan, vervalt de inschrijving van die jongere om in aanmerking te komen voor een woning niet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274c
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 274c
  - number: '46.4'
    text: |-
      Op verzoek van de toegelaten instelling of een woonruimteverdeler, wijst Onze Minister deze toegelaten instelling
      of woonruimteverdeler aan ten behoeve van het toepassen van een digitale procedure voor de inkomensvaststelling,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
  - number: '46.5'
    text: |-
      De overeenkomstig het vierde lid aangewezen toegelaten instelling of woonruimteverdeler verzoekt een woningzoekende
      en de overige meerderjarige personen die deel uitmaken van diens huishouden om in te stemmen met een digitale
      procedure voor de inkomensvaststelling, bedoeld in het tweede lid, waarbij het inkomensgegeven digitaal wordt
      verstrekt aan de aangewezen toegelaten instelling of woonruimteverdeler en het burgerservicenummer van de
      woningzoekende en van de overige meerderjarige personen die deel uitmaken van diens huishouden wordt verwerkt
      door de aangewezen toegelaten instelling of woonruimteverdeler, ten behoeve van de registratie van de inschrijving
      van die woningzoekende en ten behoeve van de inkomensvaststelling, bedoeld in het tweede lid. Ten behoeve
      van het verkrijgen van de instemming van de woningzoekende verstrekt de aangewezen toegelaten instelling of
      woonruimteverdeler daaraan voorafgaand informatie over de te volgen digitale procedure en de daarbij behorende
      gegevensverwerkingen, die de woningzoekende nodig heeft om daarover een afgewogen beslissing te nemen. Als
      de woningzoekende instemt, is de aangewezen toegelaten instelling of woonruimteverdeler verplicht de digitale
      procedure voor de inkomensvaststelling toe te passen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
  - number: '46.6'
    text: |-
      De woningzoekende en de overige meerderjarige personen die deel uitmaken van diens huishouden kunnen de instemming,
      bedoeld in het vijfde lid, op ieder moment intrekken, waarna de overeenkomstig het vierde lid aangewezen toegelaten
      instelling of woonruimteverdeler onverwijld de digitale procedure voor de inkomensvaststelling beëindigt en de
      daartoe verkregen gegevens verwijdert.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
  - number: '46.7'
    text: |-
      Indien de woningzoekende en de overige meerderjarige personen die deel uitmaken van diens huishouden
      instemmen met het verzoek, bedoeld in het vijfde lid, raadpleegt de overeenkomstig het vierde lid
      aangewezen instelling of woonruimteverdeler het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref1] teneinde het
      burgerservicenummer van de woningzoekende vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '46.8'
    text: |-
      De overeenkomstig het vierde lid aangewezen toegelaten instelling of woonruimteverdeler beëindigt de verwerking van
      het burgerservicenummer ten behoeve van de registratie van de inschrijving van de woningzoekende onverwijld nadat
      de woningzoekende is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
  - number: '46.9'
    text: |-
      De overeenkomstig het vierde lid aangewezen toegelaten instelling beëindigt de verwerking van het
      burgerservicenummer ten behoeve van de inkomensvaststelling, bedoeld in het tweede lid, in ieder geval binnen drie
      jaar gerekend vanaf de dag dat de inkomensvaststelling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
  - number: '46.10'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven over de verwerking van het
      burgerservicenummer, als bedoeld in het vijfde en het zevende lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46
  - number: 46a
    text: |-
      [Artikel 2 van de Wet goed verhuurderschap][ref1] is van overeenkomstige toepassing op toegelaten instellingen en
      dochtermaatschappijen, met uitzondering van het tweede lid, onderdeel a, onder 3°, van dat artikel, indien door de
      toegelaten instelling gebruik wordt gemaakt van een woonruimteverdeelsysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
  - number: '47.1'
    text: |-
      Als diensten van algemeen economisch belang zijn, behoudens het bepaalde bij en krachtens de
      [artikelen 49a, tweede en vierde lid][ref1], [50][ref2] en [50a][ref3], aan de toegelaten instellingen en aan de
      samenwerkingsvennootschappen opgedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 49a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
  - number: 47.1.a
    text: |-
      het huisvesten of doen huisvesten van personen die door hun inkomen of door andere omstandigheden moeilijkheden
      ondervinden bij het vinden van hun passende huisvesting;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: 47.1.b
    text: |-
      het doen bouwen en verwerven van voor permanent verblijf bedoelde te verhuren woongelegenheden met een huurprijs
      van ten hoogste het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag
      en hun onroerende en infrastructurele aanhorigheden, alsmede bezwaren, toewijzen, verhuren, vervreemden en doen
      slopen van zodanige woongelegenheden en aanhorigheden, daarop vestigen van een recht van erfpacht, opstal of
      vruchtgebruik, en overdragen van de economische eigendom daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 47.1.c
    text: |-
      het bezwaren, verhuren, vervreemden en doen slopen van voor permanent verblijf bedoelde te verhuren woongelegenheden
      die geen zelfstandige woning zijn als bedoeld in [artikel 247 van Boek 7 van het Burgerlijk Wetboek][ref1] met
      een huurprijs die hoger is dan het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2]
      genoemde bedrag en hun onroerende en infrastructurele aanhorigheden, daarop vestigen van een recht van erfpacht,
      opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 47.1.d
    text: |-
      het doen bouwen en verwerven van voor permanent verblijf bedoelde, anders dan in verband met verhuren toe te
      wijzen, woongelegenheden en hun onroerende en infrastructurele aanhorigheden, alsmede het bezwaren, toewijzen,
      vervreemden en doen slopen van haar zodanige woongelegenheden en aanhorigheden, daarop vestigen van een recht van
      erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: 47.1.e
    text: |-
      de werkzaamheden, genoemd in het bepaalde bij en krachtens
      [artikel 45, tweede lid, onderdelen b en c, en zesde lid][ref1], voor zover zij gebouwen als bedoeld in artikel
      45, tweede lid, onderdeel d, of woongelegenheden als bedoeld in onderdeel b, c of d of hun onroerende of
      infrastructurele aanhorigheden betreffen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 47.1.f
    text: |-
      de werkzaamheden, genoemd in [artikel 45, tweede lid, onderdelen d en f][ref1], en de bij algemene maatregel van
      bestuur te bepalen werkzaamheden als genoemd in het bepaalde bij en krachtens artikel 45, tweede lid, onderdelen d,
      e en f, en derde en zesde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 47.1.g
    text: |-
      de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd en bedoeld
      in de onderdelen a tot en met f, waartoe behoren het verwerven of doen slopen van onroerende zaken, indien dat
      geschiedt met het oog op het op de grond waar die zaken gelegen zijn verrichten van werkzaamheden overeenkomstig
      het bepaalde bij en krachtens de onderdelen b, d en f en het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: 47.1.h
    text: |-
      de werkzaamheden, genoemd in het bepaalde bij en krachtens
      [artikel 45, tweede lid, onderdeel j, en zesde lid][ref1], voor zover zij worden verricht ten behoeve van andere
      toegelaten instellingen en noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd en
      bedoeld in de onderdelen a tot en met f, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 47.1.i
    text: |-
      de werkzaamheden, genoemd in het bepaalde bij en krachtens
      [artikel 45, tweede lid, onderdelen k en l, en zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 47.1.j
    text: |-
      het ter vervreemding verwerven van voor permanent verblijf bedoelde woongelegenheden en hun onroerende en
      infrastructurele aanhorigheden waartoe de toegelaten instelling contractueel gehouden is jegens een derde aan wie
      de toegelaten instelling deze eerder heeft vervreemd en het vervreemden van die woongelegenheden en aanhorigheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: '47.2'
    text: |-
      De toegelaten instellingen en de samenwerkingsvennootschappen komt uitsluitend compensatie toe voor de
      werkzaamheden, genoemd en bedoeld in het eerste lid. Bij algemene maatregel van bestuur worden nadere voorschriften
      gegeven omtrent de compensatie.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: '47.3'
    text: |-
      De opdracht, bedoeld in het eerste lid, heeft een werkingsduur van 25 jaar. Onze Minister begint uiterlijk vijf
      jaar voor het einde van die werkingsduur een onderzoek naar de noodzaak, de doeltreffendheid en de effecten in de
      praktijk van die opdracht. Hij rondt dat onderzoek uiterlijk twee jaar nadien af.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: '47.4'
    text: |-
      Indien, na het verstrijken van de werkingsduur van een opdracht als bedoeld in het eerste lid, werkzaamheden op
      het gebied van de volkshuisvesting niet opnieuw als diensten van algemeen economisch belang worden opgedragen,
      blijft het recht op compensatie voor die werkzaamheden bestaan, indien daarmee voor dat verstrijken een aanvang
      is gemaakt, of met betrekking tot welke uit schriftelijke, uitsluitend op die werkzaamheden betrekking hebbende,
      stukken blijkt dat het maken van die aanvang wordt beoogd, en zolang zij als zodanig voortduren. Bij of krachtens
      algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de toepassing van de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: '47.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent het toepassingsbereik van het
      eerste lid, onderdeel g.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47
  - number: 47a.1
    text: |-
      De toegelaten instelling gaat, behoudens het bepaalde bij en krachtens de
      [artikelen 49a, tweede en vierde lid][ref1], [50][ref2] en [50a][ref3], met betrekking tot haar woongelegenheden,
      bedoeld in [artikel 47, eerste lid, onderdelen b en c][ref4], voor zover deze als zelfstandige woning, bedoeld in
      [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref5], worden verhuurd geen overeenkomsten van huur en verhuur
      voor bepaalde tijd aan voor de duur van twee jaar of korter.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel234
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 49a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '234'
  - number: 47a.2
    text: |-
      Het eerste lid is niet van toepassing op personen die deel uitmaken van een bij ministeriële regeling te bepalen
      groep. Met die personen gaat de toegelaten instelling geen overeenkomst van huur en verhuur aan welke een gebruik
      van woonruimte betreft als bedoeld in [artikel 232 lid 2 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel232
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '232'
  - number: '48.1'
    text: |-
      De toegelaten instelling gaat, behoudens het bepaalde bij en krachtens de
      [artikelen 49a, tweede en vierde lid][ref1], [50][ref2] en [50a][ref3], met betrekking tot ten minste 92,5% dan wel
      het in de afspraken, bedoeld in [artikel 44, eerste lid][ref4], overeengekomen lagere percentage, dat niet lager is
      dan 85, van de woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen b en c][ref5], en gedurende 25 jaar
      slechts overeenkomsten van huur en verhuur aan, indien het huishoudinkomen niet hoger is dan de inkomensgrens,
      of indien in die woongelegenheden bij algemene maatregel van bestuur te bepalen categorieën van personen worden
      gehuisvest. Bij ministeriële regeling worden voorschriften gegeven omtrent de in verband met de toepassing van
      dit lid aan de toegelaten instelling te verstrekken gegevens. [Artikel 46, vierde tot en met negende lid][ref6],
      alsmede hetgeen bepaald is bij de algemene maatregel van bestuur, bedoeld in artikel 48, tiende lid, is van
      overeenkomstige toepassing op de inkomenstoets die noodzakelijk is om te voldoen aan dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
    references:
      - id: ref1
