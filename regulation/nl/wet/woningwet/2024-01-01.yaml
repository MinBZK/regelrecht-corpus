        afdeling: '3'
  - number: '48.2'
    text: |-
      Indien de toegelaten instelling woongelegenheden als bedoeld in het eerste lid verhuurt aan of heeft ondergebracht
      in een rechtspersoon of vennootschap welke overeenkomsten als bedoeld in dat lid aangaat met natuurlijke
      personen, of een rechtspersoon of vennootschap welke zodanige woongelegenheden verhuurt aan een rechtspersoon
      of vennootschap welke zodanige overeenkomsten aangaat, draagt zij er, overeenkomstig bij algemene maatregel van
      bestuur daaromtrent te geven nadere voorschriften, zorg voor dat die rechtspersoon of vennootschap met betrekking
      tot die woongelegenheden het bepaalde bij en krachtens dat lid naleeft, en is de ministeriële regeling, bedoeld in
      de tweede volzin van dat lid, van toepassing op de aan die rechtspersoon of vennootschap te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
  - number: '48.3'
    text: |-
      De toegelaten instelling gaat met betrekking tot haar woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c][ref1], die niet behoren tot het in het eerste lid bedoelde deel
      daarvan, overeenkomsten van huur en verhuur aan overeenkomstig bij algemene maatregel van bestuur daaromtrent te
      geven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '48.4'
    text: |-
      De toegelaten instelling gebruikt gegevens met betrekking tot het huishoudinkomen uitsluitend voor de uitvoering
      van het eerste en derde lid, en van krachtens deze wet gegeven voorschriften, indien die zodanig zijn dat de hoogte
      van dat inkomen voor een goede uitvoering daarvan bepalend of medebepalend is. Zij draagt er zorg voor dat de in
      het tweede lid bedoelde rechtspersoon of vennootschap dienovereenkomstig handelt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
  - number: '48.5'
    text: |-
      Een of meer toegelaten instellingen kunnen Onze Minister verzoeken voor hen een lager percentage te bepalen dan
      het voor hen op grond van het eerste lid geldende percentage. Bij het verzoek maken de verzoekende toegelaten
      instelling of instellingen aannemelijk dat de verhouding tussen de vraag naar en het aanbod van woongelegenheden
      als bedoeld in [artikel 47, eerste lid, onderdelen b en c][ref1], zodanig is dat zij het eerste lid van dit artikel
      redelijkerwijs niet kunnen naleven. Bij het verzoek voegen zij voorts een voorstel voor de bepaling voor een of
      meer andere toegelaten instellingen van een zodanig hoger percentage dan het percentage, genoemd in het eerste lid,
      dat de betrokken toegelaten instellingen gezamenlijk voldoen aan dat lid. Bij inwilliging van het verzoek bepaalt
      Onze Minister dat lagere en dat hogere percentage op een zodanige wijze, dat de toegelaten instellingen op welke
      zijn besluit daartoe betrekking heeft gezamenlijk voldoen aan het eerste lid. Bij algemene maatregel van bestuur
      worden nadere voorschriften gegeven omtrent de toepassing van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '48.6'
    text: |-
      De toegelaten instelling gaat gedurende 25 jaar met betrekking tot gebouwen als bedoeld in
      [artikel 45, tweede lid, onderdeel d][ref1], op welke de algemene maatregel van bestuur, bedoeld in
      [artikel 47, eerste lid, onderdeel f][ref2], van toepassing is behoudens in bij algemene maatregel van bestuur
      bepaalde gevallen slechts overeenkomsten van huur en verhuur aan met verenigingen of stichtingen die zich blijkens
      hun statuten uitsluitend ten doel stellen diensten te leveren of werkzaamheden te verrichten die zijn gericht op
      het maatschappelijke belang, met overheidsinstellingen dan wel met natuurlijke personen die de gebouwen huren met
      het uitsluitende doel daarin op het maatschappelijk belang gerichte werkzaamheden te verrichten, met uitsluiting
      van commercieel gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '48.7'
    text: |-
      Indien de toegelaten instelling woongelegenheden van derden verhuurd als bedoeld bij en krachtens
      [artikel 45, zevende lid, onderdeel a][ref1], wordt deze verhuur betrokken in de berekening van het percentage,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '48.8'
    text: |-
      Onze Minister beoordeelt jaarlijks voor 1 december of de toegelaten instelling in het aan die datum voorafgaande
      jaar het bepaalde bij en krachtens het eerste tot en met vierde en zesde lid heeft nageleefd of doen naleven,
      waarbij hij, indien van toepassing, het betrokken in het vijfde lid bedoelde percentage in aanmerking neemt, en
      verstrekt dat oordeel aan de toegelaten instelling. Hij kan overeenkomstig bij algemene maatregel van bestuur
      daaromtrent te geven voorschriften besluiten, dat de toegelaten instelling geen compensatie toekomt voor
      werkzaamheden die behoren tot de diensten van algemeen economisch belang. Dat besluit is een besluit in de zin van
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 48a
    text: |-
      Het bepaalde bij en krachtens deze paragraaf is slechts van toepassing, indien en zolang de toegelaten instelling
      geen toepassing geeft aan [artikel 50a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
  - number: '49.1'
    text: |-
      De toegelaten instellingen houden een zodanige administratie bij dat de registratie van de activa en passiva die
      zijn verbonden met de diensten van algemeen economisch belang welke aan hen en aan de samenwerkingsvennootschappen
      zijn opgedragen, respectievelijk met hun overige werkzaamheden, gescheiden is. De eerste volzin is niet van
      toepassing, indien en zolang:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: 49.1.a
    text: |-
      de totale nettojaaromzet, verminderd met de opbrengsten uit levering van onroerende zaken, van een toegelaten
      instelling minder dan € 37.853.186,35 heeft bedragen gedurende de twee laatst afgesloten boekjaren, en het aandeel
      in die omzet van haar werkzaamheden die niet behoren tot de diensten van algemeen economisch belang in die jaren
      minder was dan 5%, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: 49.1.b
    text: |-
      in enig boekjaar het aandeel van haar investeringen in werkzaamheden die niet behoren tot de diensten van algemeen
      economisch belang in het totaal van haar investeringen minder is dan 10%.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: '49.2'
    text: |-
      Toegelaten instellingen die werkzaamheden verrichten welke de handel tussen lidstaten van de Europese Unie niet
      op merkbare wijze ongunstig kunnen beïnvloeden, van welke de totale nettojaaromzet minder dan € 40 miljoen heeft
      bedragen gedurende twee boekjaren, of ten aanzien van welke de door hen in enigerlei vorm ontvangen overheidssteun
      is vastgesteld ingevolge een open, doorzichtige en niet-discriminerende procedure houden een zodanige administratie
      bij dat:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: 49.2.a
    text: de registratie van de lasten en baten van hun verschillende werkzaamheden gescheiden zijn;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: 49.2.b
    text: |-
      alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: 49.2.c
    text: |-
      de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: '49.3'
    text: |-
      De toegelaten instellingen, bedoeld in de aanhef van het tweede lid, bewaren de in de onderdelen a, b en c van dat
      lid bedoelde gegevens gedurende vijf jaar, gerekend vanaf het einde van het boekjaar waarop de gegevens betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: '49.4'
    text: |-
      Indien de Europese Commissie verzoekt om terbeschikkingstelling van gegevens als bedoeld in het bepaalde bij
      en krachtens dit artikel, verstrekken de toegelaten instellingen, bedoeld in de aanhef van het tweede lid, Onze
      Minister op diens verzoek binnen de door hem gestelde termijn de desbetreffende gegevens. Onze Minister doet de
      gegevens toekomen aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: '49.5'
    text: |-
      Het in het tweede lid, aanhef, genoemde bedrag kan bij ministeriële regeling worden gewijzigd, indien de wijziging
      voortvloeit uit een bindend besluit van een instelling van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: '49.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de toepassing van het eerste
      lid, de wijze van scheiding door de toegelaten instellingen van baten, lasten, activa en passiva, en omtrent het
      beschikbaar komen van financiële middelen voor de uitvoering van de diensten van algemeen economisch belang welke
      aan hen en aan de samenwerkingsvennootschappen zijn opgedragen, respectievelijk van hun overige werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
  - number: '49.7'
    text: |-
      De administratie en het in [artikel 36a, vierde lid][ref1], bedoelde overzicht van de toegelaten instellingen
      worden met inachtneming van het eerste tot en met zesde lid ingericht, behoudens het bepaalde bij en krachtens
      [artikel 49a, tweede en vierde lid][ref2], en [50][ref3]. Bij of krachtens algemene maatregel van bestuur worden
      nadere voorschriften gegeven omtrent de inrichting van de administratie, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 49a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
  - number: 49a.1
    text: |-
      De toegelaten instelling geeft geen toepassing aan de [artikelen 49, eerste lid, eerste zin][ref1], en
      [25b, eerste lid, van de Mededingingswet][ref2], of aan artikel 49, eerste lid, eerste zin, en tweede lid, dan
      nadat de beoogde wijze waarop hieraan toepassing zal worden gegeven is goedgekeurd door Onze Minister. Zij doet een
      voorstel daartoe aan hem toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25b
  - number: 49a.2
    text: |-
      De toegelaten instelling kan in het voorstel Onze Minister verzoeken om toepassing te geven aan
      [artikel 50, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
  - number: 49a.3
    text: |-
      Onze Minister neemt binnen twaalf weken na ontvangst van het voorstel een besluit omtrent de goedkeuring
      daarvan, welke termijn hij, door schriftelijke kennisgeving daarvan aan de toegelaten instelling, telkens
      kan verlengen met een door hem daarbij te bepalen termijn van ten hoogste zes weken, van welke verlenging
      hij kennis geeft voor het verstrijken van de eerstgenoemde dan wel de voor de laatste maal verlengde
      termijn. De toegelaten instelling geeft toepassing aan de [artikelen 49, eerste lid, eerste volzin][ref1], en
      [25b, eerste lid, van de Mededingingswet][ref2], of aan artikel 49, eerste lid, eerste volzin, en tweede lid, met
      ingang van 1 januari volgend op het tijdstip waarop Onze Minister het voorstel heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25b
  - number: 49a.4
    text: |-
      Indien het goedgekeurde voorstel een verzoek bevat als bedoeld in het tweede lid, is daarop het tweede lid van
      [artikel 50][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
  - number: '50.1'
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling bepalen dat werkzaamheden als genoemd en bedoeld in het
      bepaalde bij en krachtens [artikel 47, eerste lid, onderdelen b tot en met f][ref1], ten aanzien van een toegelaten
      instelling of samenwerkingsvennootschap niet behoren tot de diensten van algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '50.2'
    text: 'Bij toepassing van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
  - number: 50.2.a
    text: |-
      is [artikel 21d][ref1] mede van toepassing ten aanzien van die werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21d
        hoofdstuk: IV
        afdeling: '1'
  - number: 50.2.b
    text: |-
      behoren de betrokken werkzaamheden niet tot de werkzaamheden waaraan de betrokken toegelaten instelling ingevolge
      [artikel 46, aanhef en eerste lid, onderdeel b][ref1], voorrang geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 50.2.c
    text: |-
      komt de betrokken toegelaten instelling of samenwerkingsvennootschap geen compensatie toe voor de betrokken
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
  - number: 50.2.d
    text: |-
      is [artikel 48][ref1] niet van toepassing op die werkzaamheden en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 50.2.e
    text: |-
      worden de baten, lasten, activa en passiva die zijn verbonden met die werkzaamheden administratief samengevoegd met
      die, verbonden met de overige werkzaamheden van de betrokken toegelaten instelling of samenwerkingsvennootschap die
      niet behoren tot de diensten van algemeen economisch belang.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
  - number: '50.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het eerste lid, te verstrekken gegevens, de wijze waarop Onze Minister degenen die een belang
      hebben bij toepassing van dat lid daarbij betrekt en de gronden waarop Onze Minister dat lid kan toepassen dan wel
      van die toepassing kan afzien.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50
  - number: 50a.1
    text: |-
      Om een juridische scheiding te bewerkstelligen brengt de toegelaten instelling haar werkzaamheden die niet
      behoren tot de diensten van algemeen economisch belang, en alle daarmee samenhangende baten, lasten, activa
      en passiva, overeenkomstig bij of krachtens algemene maatregel van bestuur te geven voorschriften onder
      in een of meer woningvennootschappen. Woningvennootschappen zijn naamloze vennootschappen als bedoeld in
      [artikel 64 van Boek 2 van het Burgerlijk Wetboek][ref1] of besloten vennootschappen met beperkte aansprakelijkheid
      als bedoeld in [artikel 175 van dat boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel175
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '175'
  - number: 50a.2
    text: |-
      De toegelaten instelling stelt een voorstel tot bewerkstelliging van de juridische scheiding op. Zij kan,
      overeenkomstig bij algemene maatregel van bestuur daaromtrent te geven voorschriften, daarin opnemen dat andere
      werkzaamheden en daarmee samenhangende baten, lasten, activa en passiva dan die, bedoeld in het eerste lid,
      eerste volzin, in een woningvennootschap worden ondergebracht. Bij toepassing van de tweede volzin van dit lid is
      [artikel 50, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
  - number: 50b.1
    text: |-
      De toegelaten instelling bewerkstelligt geen juridische scheiding dan nadat Onze Minister dat heeft goedgekeurd.
      Zij doet daartoe het voorstel, bedoeld in [artikel 50a, tweede lid][ref1], aan hem toekomen. Onze Minister neemt
      binnen twaalf weken na ontvangst van het voorstel een besluit omtrent de goedkeuring, welke termijn hij, onder
      schriftelijke kennisgeving daarvan aan de toegelaten instelling, telkens kan verlengen met een door hem daarbij
      te bepalen termijn van ten hoogste zes weken, van welke verlenging hij kennis geeft voor het verstrijken van de
      eerstgenoemde dan wel voor de laatste maal verlengde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
  - number: 50b.2
    text: |-
      Op een verzoek om goedkeuring van een voorgenomen juridische
      scheiding zijn de [artikel 21, eerste lid, tweede volzin][ref1], en
      [53, tweede lid, derde lid, aanhef en onderdeel a, en vierde lid, aanhef en onderdeel f][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
  - number: 50b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      voorstel, bedoeld in het eerste lid, te verstrekken gegevens, de wijze waarop de toegelaten instelling degenen die
      een belang hebben bij de juridische scheiding daarbij betrekt en de gronden waarop Onze Minister die scheiding kan
      goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50b
  - number: 50c.1
    text: |-
      De toegelaten instelling is terstond na de bewerkstelliging van een juridische scheiding de enige aandeelhoudster
      van de woningvennootschappen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50c
  - number: 50c.2
    text: |-
      Onze Minister kan, overeenkomstig bij algemene maatregel van bestuur daaromtrent gegeven voorschriften, bepalen dat
      de toegelaten instelling haar aandelen in een woningvennootschap in het openbaar ter overname aanbiedt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel50c
  - number: '51'
    text: 'De toegelaten instelling besteedt aan:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel51
  - number: 51.a
    text: |-
      de werkzaamheden, genoemd in [artikel 45, tweede lid, onderdeel d][ref1], voor zover zij bestaan uit doen bouwen,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 51.b
    text: |-
      de werkzaamheden, genoemd in[ artikel 45, tweede lid, onderdeel e][ref1], voor zover zij bestaan uit treffen van
      voorzieningen aan haar gebouwen en hun onroerende en infrastructurele aanhorigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '53.1'
    text: |-
      Een toegelaten instelling gaat slechts een fusie als bedoeld in
      [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1] aan,  indien zij daarbij het vermogen van een of meer
      andere rechtspersonen onder algemene titel verkrijgt, of een andere toegelaten instelling daarbij haar vermogen
      onder algemene titel verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
  - number: '53.2'
    text: |-
      Een voorgenomen fusie waarbij een toegelaten instelling betrokken is behoeft goedkeuring van Onze Minister. Een
      verzoek om goedkeuring omvat in elk geval de door haar voorziene gevolgen van die fusie voor de volkshuisvesting
      in de gemeenten waar de toegelaten instelling die uit die fusie voortkomt voornemens is feitelijk werkzaam te zijn.
      Die toegelaten instelling voert overleg over dat verzoek met de colleges van burgemeester en wethouders van die
      gemeenten, alsmede met de in het belang van de huurders van haar woongelegenheden werkzame huurdersorganisaties.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: '53.3'
    text: 'Een verzoek als bedoeld in het tweede lid gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.3.a
    text: de zienswijzen daarop van de colleges en de huurdersorganisaties, bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.3.b
    text: |-
      indien [hoofdstuk 5 van de Mededingingswet][ref1] op de fusie van toepassing
      is, het oordeel daarover van de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008691
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '53.4'
    text: 'Onze Minister onthoudt in elk geval zijn goedkeuring aan de voorgenomen fusie, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.4.a
    text: |-
      de verzoekende toegelaten instelling naar zijn oordeel niet aannemelijk heeft gemaakt dat het belang van de
      volkshuisvesting met die fusie beter is gediend dan met andere vormen van samenwerking tussen die toegelaten
      instelling en andere rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.4.b
    text: 'de verzoekende toegelaten instelling:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.4.b.1°
    text: |-
      voornemens is te fuseren met een toegelaten instelling die na toepassing van [artikel 41b][ref1] of [41d][ref2], op
      grond daarvan niet in dezelfde gemeenten, die zijn gelegen in het gebied, bedoeld in artikel 41b, tweede lid, als
      zij feitelijk werkzaam mag zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41d
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 53.4.b.2°
    text: |-
      naar zijn oordeel niet aannemelijk heeft gemaakt dat het belang van de volkshuisvesting met die fusie beter gediend
      is dan met een fusie met een toegelaten instelling die na toepassing van [artikel 41b][ref1] of [41d][ref2], op
      grond daarvan in dezelfde gemeenten, die zijn gelegen in het gebied, bedoeld in artikel 41b, tweede lid, als zij
      feitelijk werkzaam mag zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41d
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 53.4.c
    text: |-
      naar zijn oordeel de financiële continuïteit van de toegelaten instelling die uit die fusie zou voortkomen niet
      voldoende is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.4.d
    text: |-
      naar zijn oordeel de toegelaten instelling die uit die fusie zou voortkomen zou beschikken over een zodanig
      bedrag aan financiële middelen dat is aangetrokken van instellingen die behoren tot een categorie als bedoeld in
      [artikel 21c, eerste lid][ref1], dat dat bedrag zou liggen boven een bij algemene maatregel van bestuur te bepalen
      percentage van de overeenkomstig [artikel 35, tweede lid][ref2], bepaalde actuele waarde van de onroerende zaken en
      hun onroerende en infrastructurele aanhorigheden van de toegelaten instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel35
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 53.4.e
    text: het oordeel, bedoeld in het derde lid, onderdeel b, negatief is; of
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.4.f
    text: |-
      de huurdersorganisaties, bedoeld in het tweede lid, niet met de voorgenomen fusie instemmen, tenzij naar zijn
      oordeel door de fusie:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.4.f.1°
    text: |-
      wordt voorkomen dat ten aanzien van de betrokken toegelaten instelling een situatie ontstaat als bedoeld in
      [artikel 29, eerste lid][ref1], of [57, eerste lid, onderdeel a][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: 53.4.f.2°
    text: |-
      wordt voorkomen dat een toegelaten instelling niet in staat is toepassing te geven aan
      [artikel 42, eerste lid, eerste volzin][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 53.4.f.3°
    text: |-
      het voldoen aan een aanwijzing als bedoeld in [artikel 61d][ref1], gegeven in verband met verplichtingen gesteld
      bij of krachtens [hoofdstuk IV, afdeling 2][ref2], wordt bevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
        afdeling: '2'
  - number: '53.5'
    text: |-
      Het derde lid, onder a, en het vierde lid, onder f, zijn niet van toepassing indien sprake is van een fusie met een
      of meer dochtermaatschappijen of met een of meer verbonden ondernemingen, niet zijnde woningvennootschappen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: '53.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het tweede lid, te verstrekken gegevens, de wijze waarop de toegelaten instelling degenen
      die een belang hebben bij de voorgenomen fusie daarbij betrekt en de gronden waarop Onze Minister die fusie kan
      goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: '53.7'
    text: |-
      Voor zover [artikel 317, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] ertoe leidt dat Onze Minister de
      voorgenomen fusie dient goed te keuren, heeft dat artikel niet dat rechtsgevolg indien sprake is van een fusie:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel317
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '317'
  - number: 53.7.a
    text: tussen dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.7.b
    text: tussen verbonden ondernemingen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53.7.c
    text: van een of meer dochtermaatschappijen met een of meer verbonden ondernemingen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: '53.8'
    text: |-
      Het tweede lid, derde lid, aanhef en onderdeel a, vierde lid, aanhef en onderdelen b en
      f, vijfde en zesde lid zijn van overeenkomstige toepassing op een splitsing als bedoeld in
      [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] die geen juridische scheiding is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '53.9'
    text: |-
      Het tweede tot en met zevende lid zijn van overeenkomstige toepassing indien een toegelaten instelling het gehele
      vermogen van een of meerdere andere toegelaten instellingen onder bijzondere titel verkrijgt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53
  - number: 53a.1
    text: |-
      Een door Onze Minister aan te wijzen onafhankelijke instantie draagt er, door daartoe deskundige instanties aan te
      wijzen, zorg voor dat bij elke toegelaten instelling mede ter plaatse een onderzoek kan worden verricht naar:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
  - number: 53a.1.a
    text: |-
      de resultaten van haar werkzaamheden, zowel uit het oogpunt van het belang van de volkshuisvesting als van het
      maatschappelijke belang van die werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
  - number: 53a.1.b
    text: de wijze waarop de belanghebbenden in de gelegenheid zijn gesteld invloed uit te oefenen op het beleid, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
  - number: 53a.1.c
    text: de kwaliteit van de governance.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
  - number: 53a.2
    text: |-
      De toegelaten instelling draagt er zorg voor dat het onderzoek, bedoeld in het eerste lid, ten minste een maal
      per vier jaar door de daartoe door haar te benaderen deskundige instantie, bedoeld in dat lid, wordt afgerond.
      De kosten van dat onderzoek komen voor haar rekening. Het bestuur van de toegelaten instelling kan, indien naar
      zijn oordeel bijzondere omstandigheden daartoe aanleiding geven, besluiten de termijn van vier jaar, genoemd in
      de eerste volzin, eens per dezelfde vier jaar met een jaar te verlengen of op te schorten, in welk geval het dit
      verantwoordt in het jaarverslag, bedoeld in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 53a.3
    text: |-
      De deskundige instantie, bedoeld in het eerste lid, stelt telkens binnen zes weken na afloop van een onderzoek een
      rapport met haar bevindingen vast. Zij zendt het rapport onverwijld na de vaststelling daarvan aan de toegelaten
      instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
  - number: 53a.4
    text: |-
      De toegelaten instelling zendt een rapport als bedoeld in het derde lid, vergezeld van de zienswijze van de raad
      van commissarissen en het bestuur daarop, binnen zes weken aan alle belanghebbenden en degenen die in het kader van
      het onderzoek hun zienswijze hebben gegeven. Zij stelt voorts het rapport binnen die termijn langs elektronische
      weg algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
  - number: 53a.5
    text: |-
      Een rapport als bedoeld in het derde lid is mede onderwerp van het overleg, bedoeld in
      [artikel 44, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '54.1'
    text: |-
      De gemiddelde huurprijs van de woningen van de toegelaten instelling op 1 januari van het jaar volgend op 1 januari
      van enig jaar is niet hoger dan de gemiddelde huurprijs van die woningen op 1 januari van enig jaar, vermeerderd
      met een bij ministeriële regeling bepaald percentage. In de afspraken, bedoeld in [artikel 44, tweede lid][ref1],
      kan voor de in de betrokken gemeente gelegen woningen ten hoogste een bij ministeriële regeling bepaald hoger
      percentage worden overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '54.2'
    text: |-
      Bij de berekening van de gemiddelde huurprijs, bedoeld in het eerste lid, wordt geen rekening gehouden met
      woningen:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
  - number: 54.2.a
    text: |-
      waarvoor op laatstgenoemde 1 januari-datum een huurovereenkomst als bedoeld in
      [artikel 247 van Boek 7 van het Burgerlijk Wetboek][ref1] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
  - number: 54.2.b
    text: |-
      die in het betrokken jaar voor het eerst of laatstelijk door de toegelaten instelling of aan een opvolgende huurder
      zijn verhuurd;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
  - number: 54.2.c
    text: |-
      waarvan de huurprijs in het betrokken jaar is verhoogd als gevolg van een woningverbetering als bedoeld in
      [artikel 255 lid 1 onderdelen a en b van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
  - number: 54.2.d
    text: |-
      waarvan de huurprijs in het betrokken jaar is verhoogd als gevolg van een voorstel daartoe als bedoeld
      in [artikel 252a lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1], mits in afspraken als bedoeld
      in [artikel 44, eerste lid][ref2], is opgenomen dat de daarmee gepaard gaande extra huurinkomsten
      worden ingezet voor investeringen en voor zover deze inkomsten, de in die afspraken overeengekomen
      investeringsbedragen niet overschrijden, of is verlaagd naar aanleiding van een voorstel daartoe als bedoeld in
      [artikel 252b lid 1 van Boek 7 van het Burgerlijk Wetboek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 252b
  - number: 54.2.e
    text: |-
      waarvan de huurprijs in het betrokken jaar op verzoek van de huurder niet is verhoogd
      respectievelijk is verlaagd anders dan overeenkomstig [artikel 252][ref1], [252b][ref2] of
      [257 van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel is verhoogd als gevolg van een voorstel daartoe als
      bedoeld in [artikel 252c onderdeel b van Boek 7 van het Burgerlijk Wetboek][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel252c
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 252b
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '257'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 252c
  - number: 54.2.f
    text: die een onzelfstandige woonruimte vormen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
  - number: '54.3'
    text: |-
      Voor de toepassing van het eerste lid wordt onder woningen van de toegelaten instelling mede verstaan woningen die
      de toegelaten instelling verhuurt op grond van [artikel 45, zevende lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 54a.1
    text: |-
      In afwijking van [artikel 246 van Boek 7 van het Burgerlijk Wetboek][ref1] doet de toegelaten instelling
      voor 1 juni 2023 aan de huurder van een zelfstandige woning als bedoeld in [artikel 234 van dat boek][ref2]
      die op 1 maart 2023 huurder van de woning was en dat nog steeds is met een inkomen dat blijkens de
      inkomenscategorieverklaring, bedoeld in het derde lid, niet hoger is dan 120% van het op grond van
      [artikel 17, eerste lid, van de Wet op de huurtoeslag][ref3] toepasselijke bedrag, een voorstel tot
      verlaging van de huurprijs tot ten hoogste € 577,91 per maand, tenzij op de woning een huurovereenkomst
      als bedoeld in [artikel 247 van Boek 7 van het Burgerlijk Wetboek][ref4] van toepassing is.
      [Artikel 252, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref5] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel234
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel247
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel252
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '246'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '234'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '247'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '252'
  - number: 54a.2
    text: |-
      De toegelaten instelling verzoekt de inspecteur, bedoeld in
      [artikel 252a, tweede lid, onderdeel e, van Boek 7 van het Burgerlijk Wetboek][ref1], om een
      inkomenscategorieverklaring ten aanzien van de huurders van haar woningen als bedoeld in het eerste lid met een
      geldende huurprijs die hoger is dan € 577,91 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 54a.3
    text: |-
      De inspecteur, bedoeld in [artikel 252a, tweede lid, onderdeel e, van Boek 7 van het Burgerlijk Wetboek][ref1],
      verstrekt desgevraagd aan de toegelaten instelling een inkomenscategorieverklaring ten aanzien van de
      huurders, bedoeld in het tweede lid. In de verklaring wordt vermeld of op de door de toegelaten instelling
      aangeduide plaats van de woonruimte op basis van gegevens uit de basisregistratie inkomen, bedoeld in
      [hoofdstuk IVA van de Algemene wet inzake rijksbelastingen][ref2], het inkomen over 2021 lager is dan of gelijk
      is aan 120% van het op grond van [artikel 17, eerste lid, van de Wet op de huurtoeslag][ref3] toepasselijke
      bedrag, dan wel hoger is dan dat bedrag. Indien geen inkomensgegeven in de basisregistratie inkomen beschikbaar
      is, vermeldt de verklaring dat dat het geval is. Het bepaalde in de ministeriële regeling, bedoeld in
      [artikel 252a, vierde lid, vierde zin, van Boek 7 van het Burgerlijk Wetboek][ref4], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIVA
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: IVA
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 54a.4
    text: |-
      In afwijking van het eerste lid doet de toegelaten instelling aan de huurder van een zelfstandige woning
      als bedoeld in [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref1] of van een woonwagen als bedoeld
      in [artikel 235 van dat boek][ref2] een voorstel als bedoeld in dat lid, indien de huurder, die op
      1 maart 2023 huurder van die woning of die woonwagen was en dat nog steeds is, daarom voor 31 december
      2024 verzoekt en aantoont dat het bruto-inkomen van de bewoners, bedoeld in [artikel 54b][ref3], in
      de zes maanden voorafgaand aan het verzoek lager is dan of gelijk is aan 60% van het op grond van
      [artikel 17, eerste lid, van de Wet op de huurtoeslag][ref4] toepasselijke bedrag. De huurder voegt bij het
      verzoek, bedoeld in de eerste zin, een door hem opgestelde en ondertekende verklaring over de samenstelling van
      zijn huishouden op de datum van het verzoek. De toegelaten instelling doet het voorstel, bedoeld in het eerste lid,
      binnen drie weken na ontvangst van de in de eerste en tweede zin bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel235
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel54b
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '235'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 54b
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '17'
  - number: 54a.5
    text: |-
      De ingangsdatum van de verlaging is in afwijking van
      [artikel 252, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet later dan de eerste dag van de
      tweede maand na de dagtekening van het voorstel. In het kalenderjaar dat de huurprijs is verlaagd overeenkomstig
      het eerste lid wordt in afwijking van [artikel 248 van Boek 7 van het Burgerlijk Wetboek][ref2] de huur na die
      verlaging niet meer verhoogd. [Artikel 252c van Boek 7 van het Burgerlijk Wetboek][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel248
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel252c
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '248'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 252c
  - number: 54a.6
    text: |-
      Indien de toegelaten instelling geen voorstel als bedoeld in het eerste lid doet of de huurder niet instemt met
      het voorstel van de toegelaten instelling kan de huurder de huurcommissie verzoeken daar uitspraak over te doen.
      Het verzoek wordt indien de toegelaten instelling geen voorstel doet, gedaan binnen zes weken na 1 juni 2023
      respectievelijk na het tijdstip, bedoeld in het vierde lid, derde zin, dan wel indien de huurder niet instemt
      met het voorstel binnen zes weken na het tijdstip waarop de verlaging blijkens het voorstel had moeten ingaan. De
      huurder voegt bij het verzoek gegevens over zijn inkomen in 2021 respectievelijk over het bruto-inkomen, bedoeld in
      het vierde lid, eerste zin, en de in het vierde lid, tweede zin, bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
  - number: 54a.7
    text: |-
      Bij de berekening, bedoeld in [artikel 54, eerste lid][ref1], wordt geen rekening gehouden met de woningen waarvan
      de huurprijs in het betrokken jaar is verlaagd op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel54
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
  - number: 54a.8
    text: |-
      De toegelaten instelling informeert de huurder niet later dan 30 april 2023 over de mogelijkheden op grond van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
  - number: 54a.9
    text: |-
      De toegelaten instelling verstrekt de Dienst Toeslagen binnen drie weken na de datum
      waarop de huurverlaging is ingegaan de gewijzigde huurprijs en duidt daarbij de
      woonruimte aan op de wijze als voorgeschreven in de ministeriële regeling, bedoeld in
      [artikel 252a, vierde lid, vierde zin, van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 54b
    text: |-
      Voor de toepassing van [artikel 54a, eerste, tweede, derde en zesde lid][ref1],
      wordt onder inkomen verstaan: de gezamenlijke inkomensgegevens, bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref2] van degenen die
      op het adres van de woning staan ingeschreven, met uitzondering van kinderen in de zin van
      [artikel 4 van de Algemene wet inkomensafhankelijke regelingen][ref3] jonger dan 27 jaar, met dien verstande dat
      in het eerste lid van dat artikel voor «de belanghebbende» telkens wordt gelezen «een bewoner».


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel4
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 54a
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '4'
  - number: 54c.1
    text: |-
      Indien na overlijden van de huurder van de woning van een toegelaten instelling geen persoon de huur krachtens
      [artikel 268 van Boek 7 van het Burgerlijk Wetboek][ref1] voortzet, informeert de toegelaten instelling de andere
      bewoner die zijn hoofdverblijf heeft bij de overleden huurder op het moment van diens overlijden, ten minste over
      zijn contractuele rechten en plichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel268
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '268'
  - number: 54c.2
    text: |-
      De toegelaten instelling zendt de informatie, bedoeld in het eerste lid, bij aangetekende brief en niet eerder
      dan twee weken maar uiterlijk binnen een maand nadat het overlijden van de huurder ter kennis is gekomen van de
      toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54c
  - number: 54d.1
    text: |-
      Indien er geen personen zijn die de huur krachtens [artikel 268, eerste of tweede lid][ref1],
      voortzetten, zet bij overlijden van de huurder van de woning van een toegelaten instelling, onverminderd
      [artikel 234 van Boek 1 van het Burgerlijk Wetboek][ref2] en in afwijking van artikel 268, zesde
      lid, van Boek 7 van het Burgerlijk Wetboek, de bewoner, bedoeld in het tweede lid, de huur voort
      tot hij de leeftijd van achtentwintig jaren bereikt. De artikelen 268, eerste lid, tweede zin, en
      [270a van Boek 7 van het Burgerlijk Wetboek][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel234
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel270a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '268'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '234'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 270a
  - number: 54d.2
    text: 'De bewoner, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
  - number: 54d.2.a
    text: heeft de leeftijd van zestien jaren bereikt, doch niet de leeftijd van achtentwintig jaren;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
  - number: 54d.2.b
    text: heeft zijn hoofdverblijf bij de overleden huurder; en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
  - number: 54d.2.c
    text: is door het overlijden van de huurder ouderloos geworden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
  - number: 54d.3
    text: |-
      Voor de toepassing van dit artikel wordt mede als ouderloos aangemerkt de bewoner, bedoeld in het tweede lid,
      die beweert dat de overlevende ouder gedurende ten minste een aaneengesloten periode van drie jaren onmiddellijk
      voorafgaand aan de dag van overlijden van de huurder niet de gezamenlijke zorg met de overleden ouder voor de
      bewoner heeft gehad dan wel, indien de bewoner meerderjarig is, niet in nauwe persoonlijke betrekking tot hem heeft
      gestaan. Op verzoek van de toegelaten instelling verstrekt de bewoner ondersteunende bescheiden voor deze bewering.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
  - number: 54d.4
    text: |-
      Indien de bewoner, bedoeld in het tweede lid, een inkomen heeft dat niet hoger is dan de inkomensgrens, bedoeld
      in [artikel 48, eerste lid][ref1], in aanmerking komt voor verkrijging van huurtoeslag, wordt, in afwijking
      van[ artikel 246 van Boek 7 van het Burgerlijk Wetboek][ref2], de huurprijs verlaagd:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel246
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '246'
  - number: 54d.4.a
    text: |-
      tot ten hoogste het bedrag, bedoeld in [artikel 13, eerste lid, onder b, van de Wet op de huurtoeslag][ref1],
      indien de bewoner nog niet de leeftijd van drieëntwintig jaren heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 54d.4.b
    text: |-
      tot ten hoogste het bedrag, bedoeld in [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref1],
      indien de bewoner nog niet de leeftijd van achtentwintig jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 54d.5
    text: |-
      De toegelaten instelling stelt voor de toepassing van het vierde lid het inkomen vast overeenkomstig het bepaalde
      bij of krachtens [artikel 46, tweede lid, tweede en derde volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 54d.6
    text: |-
      Indien de huurprijs is verlaagd op grond van het vierde lid, onder a, kan, in afwijking van de
      [artikelen 246][ref1] en [248, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2], de huurprijs worden
      verhoogd:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel248
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '246'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '248'
  - number: 54d.6.a
    text: |-
      indien de bewoner nog niet de leeftijd van drieëntwintig jaren heeft bereikt, met een huurverhoging die is
      toegelaten bij of krachtens [artikel 10, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref1] tot ten
      hoogste het bedrag, genoemd in [artikel 13, eerste lid, onder b, van de Wet op de huurtoeslag][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 54d.6.b
    text: |-
      indien de bewoner de leeftijd van drieëntwintig jaren heeft bereikt, tot het bedrag van de huurprijs direct
      voorafgaand aan de datum waarop de huurprijs overeenkomstig het vierde lid is verlaagd, vermeerderd met de som van
      ten hoogste de krachtens [artikel 10, tweede lid][ref1], toegelaten verhogingen over de jaren sinds die datum, met
      dien verstande dat de verhoging niet leidt tot een hogere huurprijs dan het op de ingangsdatum van de voorgestelde
      huurverhoging in [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref2] genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 54d.7
    text: |-
      Indien de huurprijs is verlaagd op grond van het vierde lid, onder b, kan in afwijking van
      de [artikelen 246][ref1] en [248, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2],
      de huurprijs worden verhoogd met een huurverhoging die is toegelaten bij of krachtens
      [artikel 10, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref3] tot ten hoogste het bedrag, genoemd in
      [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel248
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '246'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '248'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 54d.8
    text: |-
      Indien meerdere bewoners op grond van het eerste lid de huur kunnen voortzetten, wordt de oudste bewoner huurder
      en worden, in afwijking van [artikel 266, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1], de jongere
      bewoners, die de leeftijd van ten minste zestien jaren hebben bereikt, medehuurder. Bij vertrek of overlijden
      van de huurder, bedoeld in de eerste volzin, kunnen de medehuurders, in afwijking van het eerste lid, de huur
      voortzetten gedurende de periode dat de huurder, bedoeld in de eerste volzin, de huur kon voortzetten op grond van
      het eerste lid. Het zesde en zevende lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
  - number: 54d.9
    text: |-
      Als minderjarige van wie beide ouders zijn overleden als bedoeld in
      [artikel 10, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] wordt mede aangemerkt de
      minderjarige bewoner die als ouderloos wordt aangemerkt op grond van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019237#Artikel10
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0019237
        artikel: '10'
  - number: '55.1'
    text: De toegelaten instelling draagt zorg voor een sobere en doelmatige bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55
  - number: '55.2'
    text: |-
      De toegelaten instelling draagt zorg voor een administratie die een juist en volledig inzicht geeft in haar
      werkzaamheden en haar financiële aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55
  - number: '55.3'
    text: |-
      De administratie is zodanig, dat een juiste, volledige en tijdige vastlegging daarin is gewaarborgd van de
      gegevens met betrekking tot het huishoudinkomen. Die gegevens worden voor een kalenderjaar niet langer daarin
      bewaard dan tot het tijdstip dat de compensatie over dat kalenderjaar voor werkzaamheden van de toegelaten
      instelling die behoren tot de diensten van algemeen economisch belang onherroepelijk is komen vast te staan.
      [Artikel 47a, tweede lid, tweede volzin][ref1] en [48, tweede lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 47a
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '55.4'
    text: |-
      De toegelaten instelling is verplicht tot geheimhouding van de gegevens met betrekking tot het huishoudinkomen,
      behoudens voor zover enig wettelijk voorschrift haar tot mededeling verplicht of uit haar taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55
  - number: '55.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de kosten van de
      bedrijfsvoering, bedoeld in het eerste lid, en nadere voorschriften omtrent de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55
  - number: 55a.1
    text: |-
      De toegelaten instelling voert een zodanig financieel beleid en beheer, dat haar financiële continuïteit niet in
      gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55a
  - number: 55a.2
    text: |-
      Zij stelt daartoe een reglement op, waarin zij in elk geval opneemt binnen welke grenzen de aan haar financiële
      beleid en beheer verbonden risico’s aanvaardbaar zijn, en welk beleid zij beoogt te voeren ingeval haar financiële
      continuïteit in gevaar komt of dreigt te komen. In het reglement wordt mede ingegaan op de verbonden ondernemingen.
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de inhoud van het
      reglement.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55a
  - number: 55b.1
    text: 'De toegelaten instelling stelt reglementen op inzake:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55b
  - number: 55b.1.a
    text: |-
      het doen slopen en het treffen van ingrijpende voorzieningen aan haar woongelegenheden en de betrokkenheid van de
      bewoners van die woongelegenheden daarbij en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55b
  - number: 55b.1.b
    text: |-
      de bijdragen, bedoeld in de [artikelen 220 lid 5][ref1] en [275 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref2],
      waarin in elk geval de hoogte van die bijdragen wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel275
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '220'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '275'
  - number: 55b.2
    text: |-
      De toegelaten instelling voert overleg over het reglement, bedoeld in het eerste lid, onderdeel a, met de colleges
      van burgemeester en wethouders van de gemeenten waar zij feitelijk werkzaam is, alsmede de in het belang van
      de huurders van haar woongelegenheden werkzame huurdersorganisaties en bewonerscommissies, met overeenkomstige
      toepassing van het bepaalde in [artikel 2 van de Wet op het overleg huurders verhuurder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 55b.3
    text: |-
      Door Onze Minister wordt een reglement inzake de behandeling van klachten omtrent het handelen of nalaten van
      toegelaten instellingen aangewezen, dat op alle toegelaten instellingen van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel55b
  - number: '56'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de betrokkenheid van
      toegelaten instellingen bij volkshuisvesting buiten Nederland waarop [artikel 40][ref1] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '57.1'
    text: |-
      Onze Minister kan, overeenkomstig bij of krachtens algemene maatregel van bestuur te geven voorschriften, subsidies
      aan toegelaten instellingen verstrekken:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel57
  - number: 57.1.a
    text: |-
      ter bevordering van de financiële sanering van toegelaten instellingen, indien bij een toegelaten instelling
      de financiële middelen ontbreken om haar werkzaamheden te kunnen voortzetten, en andere maatregelen
      harerzijds om aan die situatie een einde te maken niet mogelijk zijn, ontoereikend zijn gebleken of leiden
      tot het niet kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij en krachtens
      [artikel 47, eerste lid, onderdelen a tot en met g][ref1], welke subsidies worden verstrekt op grond van plannen
      als bedoeld in [artikel 29, eerste lid, tweede volzin][ref2], die Onze Minister heeft goedgekeurd, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
  - number: 57.1.b
    text: ter tegemoetkoming in de kosten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel57
  - number: '57.2'
    text: Onze Minister verleent ter uitvoering van het eerste lid geen garanties.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel57
  - number: '58.1'
    text: |-
      De subsidie, bedoeld in [artikel 57, eerste lid][ref1], wordt bekostigd uit de bijdragen, bedoeld in het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: '58.2'
    text: |-
      Elke toegelaten instelling die op 1 januari van een kalenderjaar als zodanig bestaat, is over dat kalenderjaar
      een bijdrage aan Onze Minister verschuldigd. Onze Minister bepaalt de hoogte van de bijdrage overeenkomstig bij of
      krachtens algemene maatregel van bestuur daaromtrent te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel58
  - number: '58.3'
    text: |-
      Onze Minister kan, indien hij van oordeel is dat storting van een bijdrage als bedoeld in het tweede lid niet
      noodzakelijk is om uitvoering te geven aan het bepaalde bij en krachtens [artikel 57, eerste lid][ref1], voor
      1 oktober van het kalenderjaar waarover die bijdrage verschuldigd zou zijn bepalen dat een zodanige bijdrage niet
      verschuldigd is over dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: '59.1'
    text: 'De borgingsvoorziening adviseert Onze Minister op diens verzoek of eigener beweging omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.1.a
    text: |-
      de goedkeuring van plannen als bedoeld in[ artikel 29, eerste lid, tweede volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
  - number: 59.1.b
    text: |-
      de gevallen waarin naar haar oordeel een sanering als bedoeld in [artikel 57, eerste lid, onderdeel a][ref1],
      noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: 59.1.c
    text: de kosten die in een kalenderjaar met zodanige saneringen gemoeid zijn en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.1.d
    text: |-
      de hoogte van het in een kalenderjaar voor die saneringen benodigde, door toepassing van [artikel 58][ref1] op te
      brengen, bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: '59.2'
    text: 'Door Onze Minister kan aan de borgingsvoorziening worden gemandateerd:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.2.a
    text: |-
      het nemen van de besluiten uit hoofde van de bevoegdheid, genoemd in
      [artikel 57, eerste lid, aanhef en onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: 59.2.b
    text: |-
      het nemen van de besluiten uit hoofde van de bevoegdheid, genoemd in [artikel 58, tweede lid, tweede volzin][ref1],
      voor zover die betrekking heeft op het deel van de bijdrage, bedoeld in dat lid, waaruit subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a][ref2], worden bekostigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: 59.2.c
    text: |-
      de bevoegdheid tot het heffen van de bijdrage, bedoeld in [artikel 58, tweede lid][ref1], al dan niet
      uitsluitend voor zover die heffing betrekking heeft op het deel van die bijdrage waaruit subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a][ref2], worden bekostigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: 59.2.d
    text: |-
      de bevoegdheid tot het geven van een aanwijzing als bedoeld in [artikel 61d][ref1], voor zover die aanwijzing
      betrekking heeft op de financiële sanering van de toegelaten instelling, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 59.2.e
    text: |-
      de bevoegdheid tot het op grond van [artikel 105, eerste lid, aanhef en onderdeel c][ref1], opleggen van een last
      onder dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel105
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
  - number: '59.3'
    text: 'In geval van een mandaat als bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.3.a
    text: |-
      oefent de borgingsvoorziening de aan haar gemandateerde bevoegdheden onafhankelijk uit van haar werkzaamheden met
      het oog op het door toegelaten instellingen kunnen aantrekken van leningen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.3.b
    text: |-
      draagt de borgingsvoorziening er zorg voor dat de uitvoering van de in onderdeel a bedoelde categorieën van
      werkzaamheden in algemene zin op elkaar is afgestemd;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.3.c
    text: |-
      behoeft de borgingsvoorziening voor wijzigingen van haar statuten, die betrekking hebben op de aan haar
      gemandateerde bevoegdheden de goedkeuring van Onze Minister en legt zij daartoe elke voorgenomen zodanige wijziging
      daarvan aan hem voor;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.3.d
    text: |-
      past de raad van commissarissen[ artikel 31, vierde lid][ref1], mede toe ten aanzien van de borgingsvoorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel31
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: 59.3.e
    text: |-
      past de toegelaten instelling [artikel 38, eerste lid][ref1], mede toe ten aanzien van de borgingsvoorziening en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 59.3.f
    text: |-
      zijn de [artikelen 6.1, aanhef en onderdeel c][ref1], en
      [7.24, aanhef en onderdeel b, van de Comptabiliteitswet 2016][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
  - number: '59.4'
    text: 'Voor zover een mandaat als bedoeld in het tweede lid de betrokken bevoegdheid betreft:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.4.a
    text: is het eerste lid niet van toepassing;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59.4.b
    text: |-
      is [artikel 57, tweede lid][ref1], van overeenkomstige toepassing op de borgingsvoorziening of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: 59.4.c
    text: |-
      is, in afwijking van [artikel 58, tweede lid, eerste volzin][ref1], de bijdrage, bedoeld in dat lid, verschuldigd
      aan de borgingsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: '59.5'
    text: |-
      De borgingsvoorziening wordt, voor zover het haar werkzaamheden, bedoeld in het eerste lid, en de bevoegdheden,
      door haar uitgeoefend krachtens een mandaat als bedoeld in het tweede lid, betreft, bekostigd uit de bijdragen,
      bedoeld in artikel 58, tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59
  - number: 59a.1
    text: |-
      Op verzoek van Onze Minister verstrekt het bestuur van de borgingsvoorziening hem inlichtingen over haar
      werkzaamheden ten aanzien van het door toegelaten instellingen aantrekken van leningen, voor zover dat naar zijn
      oordeel in verband met het faciliteren van de borgingsvoorziening noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59a
  - number: 59a.2
    text: |-
      Het bestuur van de borgingsvoorziening doet onverwijld aan Onze Minister mededeling van alle feiten en
      omstandigheden waarvan het voor het bestuur redelijkerwijs duidelijk zou moeten zijn dat zij van belang zijn in
      verband met het faciliteren van de borgingsvoorziening.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59a
  - number: 59b.1
    text: |-
      De bestuurders en de commissarissen van de borgingsvoorziening zijn geschikt en betrouwbaar voor de uitoefening van
      hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59b
  - number: 59b.2
    text: |-
      Alvorens de raad van commissarissen een commissaris of bestuurder benoemt of herbenoemt, verzoekt deze Onze
      Minister om zijn zienswijze op de geschiktheid van de betrokken persoon voor het lidmaatschap van de raad van
      commissarissen respectievelijk voor het lidmaatschap van het bestuur en de betrouwbaarheid van die persoon aan
      haar kenbaar te maken. Een commissaris of bestuurder wordt niet benoemd of herbenoemd zonder dat Onze Minister
      daarover een positieve zienswijze heeft uitgebracht. Bij of krachtens algemene maatregel van bestuur worden nadere
      voorschriften gegeven omtrent de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59b
  - number: 59c.1
    text: |-
      Het bestuur van de borgingsvoorziening stelt beleidsregels op met betrekking tot het voorzien in compensatie als
      bedoeld in [artikel 1, eerste lid][ref1], begripsomschrijving van compensatie, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
        hoofdstuk: I
  - number: 59c.2
    text: |-
      De beleidsregels hebben in ieder geval betrekking op de kaders voor de borging van geldleningen van deelnemers en
      voor de financiële soliditeit van de borgingsvoorziening, waaronder:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.2.a
    text: |-
      de gehanteerde financiële ratio’s en andere risico-indicatoren, en de relatie daarvan met de beoordeling van de
      financiële positie en de borgingsmogelijkheden van deelnemers;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.2.b
    text: de verstrekking van borging en de uitvoering van maatregelen richting deelnemers met een hoog financieel risico;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.2.c
    text: de maximale omvang per individuele toegelaten instelling van het totaal aan geborgde leningen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.2.d
    text: de omvang van het risicokapitaal dat toereikend wordt geacht om verliezen van de borgingsvoorziening te dekken;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.2.e
    text: de wijze van informatieverstrekking en data-uitwisseling in het kader van de borging.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de onderwerpen, genoemd in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.4
    text: De beleidsregels van de borgingsvoorziening behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.5
    text: 'Onze Minister kan aan de beleidsregels zijn goedkeuring onthouden indien de beleidsregels:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.5.a
    text: in strijd zijn met de wettelijke voorschriften voor toegelaten instellingen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.5.b
    text: |-
      in onvoldoende mate ondersteunend zijn aan de ontwikkeling van consistente financiële kaders en normen voor
      toegelaten instellingen; of
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59c.5.c
    text: in onvoldoende mate bijdragen aan een prudente risicobeheersing.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59c
  - number: 59d.1
    text: |-
      De wijze waarop de borgingsvoorziening in compensatie als bedoeld in [artikel 1, eerste lid][ref1],
      begripsomschrijving van compensatie, onderdeel a, voorziet is beheerst en integer.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
        hoofdstuk: I
  - number: 59d.2
    text: |-
      Bij de beoordeling door Onze Minister van een beheerste bedrijfsvoering wordt in ieder geval rekening gehouden met
      de inrichting en kwaliteit van:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59d.2.a
    text: de uitvoerende processen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59d.2.b
    text: de administratieve en interne organisatie;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59d.2.c
    text: de informatievoorziening en communicatie.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59d.3
    text: 'Bij de beoordeling door Onze Minister van een integere bedrijfsvoering wordt in ieder geval rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59d.3.a
    text: belangenverstrengeling;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59d.3.b
    text: |-
      het begaan van strafbare feiten en andere wetsovertredingen door de borgingsvoorziening, haar bestuurders of haar
      werknemers, die het vertrouwen in de borgingsvoorziening kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59d.3.c
    text: |-
      andere handelingen door de borgingsvoorziening, haar bestuurders of haar werknemers die op een dusdanige wijze
      ingaan tegen hetgeen volgens het ongeschreven recht in het maatschappelijk verkeer betamelijk is, en die het
      vertrouwen in de borgingsvoorziening kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59d
  - number: 59e.1
    text: |-
      Onze Minister kan in het belang van het voorzien in compensatie als bedoeld in [artikel 1, eerste lid][ref1],
      begripsomschrijving van compensatie, onderdeel a, indien door het nalaten of handelen van de borgingsvoorziening
      het vertrouwen in de borgingsvoorziening dreigt geschaad te worden of indien de borgingsvoorziening handelt in
      strijd met het bepaalde in deze paragraaf, de borgingsvoorziening een aanwijzing geven om een of meer handelingen
      te verrichten of na te laten. De aanwijzing heeft geen betrekking op individuele borgingsbeslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
        hoofdstuk: I
  - number: 59e.2
    text: Een aanwijzing omvat de gevolgen die Onze Minister verbindt aan het niet voldoen aan die aanwijzing.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59e
  - number: 59e.3
    text: |-
      In een aanwijzing als bedoeld in het eerste lid, wordt een termijn gesteld binnen welke de borgingsvoorziening
      daaraan dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59e
  - number: 59f
    text: |-
      Indien de borgingsvoorziening niet of niet volledig binnen de gestelde termijn voldoet aan een aanwijzing als
      bedoeld in [artikel 59e, eerste lid][ref1], kan Onze Minister bepalen dat de borgingsvoorziening voor een door hem
      te bepalen tijdvak door hem aangegeven handelingen slechts mag verrichten na goedkeuring van een of meer door hem
      aangewezen personen of instanties, dan wel na zijn goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel59e
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 59e
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '4'
  - number: 59g.1
    text: |-
      Onze Minister kan de voltallige raad van commissarissen van de borgingsvoorziening ontslaan indien door een doen of
      nalaten van de raad de borgingsvoorziening in strijd handelt met de bij of krachtens deze wet gegeven voorschriften
      voor zover deze betrekking hebben op de borgingsvoorziening.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59g
  - number: 59g.2
    text: Indien Onze Minister de voltallige raad van commissarissen heeft ontslagen, benoemt hij nieuwe commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel59g
  - number: '60.1'
    text: Er is een Autoriteit woningcorporaties, die onder Onze Minister ressorteert.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel60
  - number: '60.2'
    text: |-
      Onze Minister geeft met betrekking tot de uitoefening van de ingevolge het bij of krachtens deze wet bepaalde aan
      de autoriteit toekomende bevoegdheden uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan
      aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel60
  - number: '60.3'
    text: |-
      Het tweede lid is niet van toepassing op aanwijzingen die betrekking hebben op beheersmatige aspecten van de
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel60
  - number: '61.1'
    text: Het toezicht op de toegelaten instellingen en de dochtermaatschappijen is opgedragen aan de autoriteit.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: '61.2'
    text: 'Het toezicht richt zich op de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.2.a
    text: de rechtmatigheid van het handelen en nalaten van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.2.b
    text: de governance en de integriteit van beleid en beheer van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.2.c
    text: het behoud van de financiële continuïteit van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.2.d
    text: het beschermen van het maatschappelijk bestemd vermogen van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.2.e
    text: de solvabiliteit en de liquiditeit van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.2.f
    text: |-
      de kwaliteit van het financieel risicomanagement, het financieel beheer, de financiële aansturing en de financiële
      verantwoording van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.2.g
    text: |-
      de compensatie, waaronder mede is begrepen de naleving van [artikel 48][ref1], alsmede
      [artikel 49, eerste en tweede lid][ref2], dan wel van de [artikelen 49, eerste lid][ref3],
      [25b, eerste lid, van de Mededingingswet][ref4], en de andere situaties waarin toegelaten instellingen of
      samenwerkingsvennootschappen meer compensatie zouden kunnen ontvangen dan hen toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '49'
