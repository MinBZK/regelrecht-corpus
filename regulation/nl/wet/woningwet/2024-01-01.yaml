        artikel: 25b
  - number: '61.3'
    text: 'Het toezicht omvat de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.3.a
    text: |-
      het risicogericht beoordelen van het beleid en beheer van de toegelaten instellingen en de dochtermaatschappijen,
      en het aan hen doen toekomen van dat oordeel;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.3.b
    text: |-
      het risicogericht beoordelen van het functioneren van de toegelaten instellingen en de dochtermaatschappijen in het
      algemeen en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61.3.c
    text: |-
      het desgevraagd en uit eigen beweging informeren van Onze Minister over ontwikkelingen omtrent de toegelaten
      instellingen en de dochtermaatschappijen die in het belang van het toezicht zijn, en het op grond daarvan doen
      van voorstellen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: '61.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen aan de autoriteit andere onderwerpen en taken worden
      opgedragen in het kader van het toezicht op toegelaten instellingen en de dochtermaatschappijen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: '61.5'
    text: |-
      Onze Minister verleent de autoriteit mandaat om de aanwijzingen te geven en de maatregelen te nemen, bedoeld in
      de [artikel 48, achtste lid][ref1], [61d tot en met 61g][ref2], [104a, eerste lid][ref3], [105, eerste lid][ref4],
      en [120b][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 104a
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 120b
        hoofdstuk: IX
  - number: '61.6'
    text: |-
      Indien een college van burgemeester en wethouders Onze Minister of de autoriteit verzoekt maatregelen te nemen of
      te bevorderen waartoe hij of zij ingevolge deze afdeling bevoegd is, is hij of zij gehouden naar aanleiding van dat
      verzoek een besluit te nemen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61
  - number: 61a.1
    text: De autoriteit stelt jaarlijks een jaarwerkplan vast. Het jaarwerkplan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61a
  - number: 61a.2
    text: Onze Minister zendt het jaarwerkplan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61a
  - number: 61b.1
    text: |-
      De autoriteit oefent het toezicht onafhankelijk van de ontwikkeling en de uitvoering van het rijksbeleid op het
      terrein van de toegelaten instellingen en de dochtermaatschappijen uit.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61b
  - number: 61b.2
    text: |-
      De autoriteit bepaalt zelfstandig de gegevens en inlichtingen van toegelaten instellingen en de
      dochtermaatschappijen die voor de uitoefening van haar taken noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61b
  - number: 61b.3
    text: |-
      Onze Minister geeft geen aanwijzingen met betrekking tot de oordelen, bedoeld in [artikel 61, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '5'
  - number: 61b.4
    text: |-
      De autoriteit maakt de oordelen, bedoeld in [artikel 61, derde lid, onderdeel a][ref1], openbaar. De oordelen,
      bedoeld in artikel 61, derde lid, onderdeel b, worden aan Onze Minister aangeboden en door hem onverwijld en in
      ongewijzigde vorm, in voorkomend geval voorzien van zijn bevindingen, aan de Tweede Kamer der Staten-Generaal
      gezonden of door de autoriteit zelf openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '5'
  - number: 61c
    text: |-
      De kosten die gemoeid zijn met de uitoefening van het toezicht en met de ingevolge de
      [artikel 48, achtste lid][ref1],[ 61d tot en met 61h][ref2], [104a, eerste lid][ref3], [105, eerste lid][ref4], en
      [120b][ref5] gegeven aanwijzingen en genomen maatregelen, komen, overeenkomstig bij algemene maatregel van bestuur
      daaromtrent te geven voorschriften, voor rekening van de toegelaten instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 104a
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 120b
        hoofdstuk: IX
  - number: 61d.1
    text: |-
      Onze Minister kan in het belang van de volkshuisvesting een toegelaten instelling of een dochtermaatschappij
      een aanwijzing geven om een of meer handelingen te verrichten of na te laten. Een aanwijzing aan een toegelaten
      instelling kan betrekking hebben op werkzaamheden van een dochtermaatschappij of van een samenwerkingsvennootschap
      waarin zij volledig aansprakelijke vennote is, in welk geval zij er voor zorgdraagt dat de dochtermaatschappij of
      die vennootschap die aanwijzing naleeft. Een aanwijzing heeft geen betrekking op het plaatsen van opdrachten door
      de toegelaten instelling of haar dochtermaatschappij.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61d
  - number: 61d.2
    text: |-
      Een aanwijzing als bedoeld in het eerste lid omvat de gevolgen die Onze Minister verbindt aan het niet voldoen aan
      die aanwijzing.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61d
  - number: 61d.3
    text: |-
      Bij een besluit om een aanwijzing te geven, betrekt Onze Minister de situatie van de volkshuisvesting in de
      gemeenten waar de betrokken toegelaten instelling of dochtermaatschappij feitelijk werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61d
  - number: 61d.4
    text: |-
      Alvorens een aanwijzing te geven kan Onze Minister, indien dit naar zijn oordeel wegens de aard van de voorgenomen
      aanwijzing noodzakelijk is, de colleges van burgemeester en wethouders van een of meer gemeenten in de gelegenheid
      stellen binnen een door hem te bepalen termijn hun zienswijze over die aanwijzing aan hem kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61d
  - number: 61e.1
    text: |-
      In een aanwijzing als bedoeld in [artikel 61d][ref1] wordt een termijn gesteld binnen welke de toegelaten
      instelling of de dochtermaatschappij daaraan dient te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 61e.2
    text: Van een aanwijzing wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61e
  - number: 61f
    text: |-
      Een verzoek van Onze Minister aan een toegelaten instelling of een dochtermaatschappij om een bepaalde gedragslijn
      te volgen waarin niet is aangegeven welke gevolgen hij verbindt aan het niet voldoen aan dat verzoek, is geen
      aanwijzing in de zin van [artikel 61d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 61g.1
    text: |-
      Onze Minister kan in het belang van de volkshuisvesting bepalen dat een toegelaten instelling of
      een dochtermaatschappij voor een door hem te bepalen tijdvak door hem aangegeven handelingen slechts
      verricht na goedkeuring van een of meer door hem aangewezen personen of instanties, dan wel na
      zijn goedkeuring. Een gemeente wordt niet als instantie als bedoeld in de eerste volzin aangewezen.
      [Artikel 61d, eerste lid, tweede volzin][ref1], is ten aanzien van een samenwerkingsvennootschap als bedoeld in die
      volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61g
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 61g.2
    text: |-
      Onze Minister kan, indien een toegelaten instelling of een dochtermaatschappij niet binnen de in
      [artikel 61e, eerste lid][ref1], bedoelde termijn voldoet aan een aanwijzing als bedoeld in [artikel 61d][ref2],
      die de verplichting inhoudt tot handelingen die redelijkerwijs niet kunnen worden verricht zonder dat voorafgaand
      daaraan een schriftelijk plan daarvoor is opgesteld, bepalen dat een of meer door hem aangewezen personen of
      instanties dat plan opstellen. Die toegelaten instelling of dochtermaatschappij verleent die personen of instanties
      alle medewerking daarbij. Een gemeente wordt niet als instantie als bedoeld in dit lid aangewezen. Artikel
      61d, eerste lid, tweede volzin, is ten aanzien van een samenwerkingsvennootschap als bedoeld in die volzin van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61e
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61g
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61e
        hoofdstuk: IV
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 61g.3
    text: |-
      Onze Minister kan, indien een toegelaten instelling of een dochtermaatschappij niet binnen de in
      [artikel 61e, eerste lid][ref1], bedoelde termijn voldoet aan een aanwijzing als bedoeld in [artikel 61d][ref2],
      die de verplichting inhoudt een reglement als bedoeld in [artikel 55a, tweede lid][ref3], op te stellen of
      te wijzigen, bepalen dat een of meer door hem aangewezen personen of instanties dat reglement overeenkomstig
      het bepaalde bij en krachtens artikel 55a opstellen of wijzigen. Het tweede lid, tweede en derde volzin,
      zijn van overeenkomstige toepassing. Artikel 61d, eerste lid, tweede volzin, is ten aanzien van een
      samenwerkingsvennootschap als bedoeld in die volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61e
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61g
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61e
        hoofdstuk: IV
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 55a
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
  - number: 61g.4
    text: |-
      Onze Minister geeft geen toepassing aan het tweede of derde lid dan nadat hij de betrokken toegelaten instelling of
      dochtermaatschappij in de gelegenheid heeft gesteld binnen een door hem te bepalen termijn aannemelijk te maken dat
      zij binnen een redelijke termijn zal voldoen aan de betrokken aanwijzing.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61g
  - number: 61h.1
    text: |-
      Indien een toegelaten instelling of een dochtermaatschappij het belang van de volkshuisvesting ernstige schade
      berokkent, redelijkerwijs in die situatie geen verbetering te voorzien is en een andere daartegen gerichte
      maatregel dan het onder bewind stellen van die toegelaten instelling of dochtermaatschappij niet doeltreffender
      zou zijn, kan de rechtbank in het arrondissement waarin zij haar woonplaats heeft haar onder bewind stellen op
      een daartoe strekkend verzoek van Onze Minister. Onze Minister kan bij zijn verzoek personen voor benoeming tot
      bewindvoerder voordragen en voorstellen doen omtrent hun beloning. [Artikel 61d, eerste lid, tweede volzin][ref1],
      is ten aanzien van een samenwerkingsvennootschap als bedoeld in die volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61h
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 61h.2
    text: |-
      De rechtbank behandelt het verzoek binnen twee weken nadat hij het heeft ontvangen. Hij kan inzage nemen of,
      door daartoe door hem aangewezen deskundigen, doen nemen van zakelijke gegevens en bescheiden van de betrokken
      toegelaten instelling of dochtermaatschappij.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61h
  - number: 61h.3
    text: |-
      Een toegelaten instelling of een dochtermaatschappij die surseance van betaling heeft aangevraagd, aan welke
      surseance van betaling is verleend, van welke het faillissement is aangevraagd of die failliet is verklaard wordt
      niet onder bewind gesteld in de zin van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61h
  - number: 61i.1
    text: |-
      Bij een beslissing waarbij een toegelaten instelling of een dochtermaatschappij onder bewind wordt gesteld,
      benoemt de rechtbank een of meer bewindvoerders en regelt hij hun beloning. De beloning komt voor rekening van die
      toegelaten instelling of dochtermaatschappij.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61i
  - number: 61i.2
    text: |-
      De bewindvoerders maken onverwijld een uittreksel van de uitspraak bekend in de *Staatscourant* en in een of meer
      bij de uitspraak aangewezen dag-, nieuws- of huis-aan-huisbladen. Het uittreksel vermeldt naam en woonplaats van
      de betrokken toegelaten instelling of dochtermaatschappij en de woonplaats of het kantoor van de bewindvoerders,
      alsmede de datum van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61i
  - number: 61i.3
    text: |-
      De uitspraak is uitvoerbaar bij voorraad, onverminderd enige daartegen gerichte voorziening. Gedurende acht dagen
      na de uitspraak kan daartegen hoger beroep worden ingesteld bij het gerechtshof in het ressort waarin de betrokken
      toegelaten instelling of dochtermaatschappij haar woonplaats heeft. Het gerechtshof behandelt het beroep binnen
      twee weken nadat het het beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61i
  - number: 61i.4
    text: |-
      Gedurende acht dagen na de uitspraak van het gerechtshof in hoger beroep kan daartegen beroep in cassatie worden
      ingesteld. De Hoge Raad behandelt het beroep binnen twee weken nadat hij het beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61i
  - number: 61j.1
    text: |-
      De bewindvoerders oefenen bij uitsluiting alle bevoegdheden uit van de organen van de toegelaten instelling of de
      dochtermaatschappij, tenzij de rechtbank heeft bepaald dat een orgaan zijn bevoegdheden kan blijven uitoefenen. Zij
      doen voorts onverwijld aan de Kamer van Koophandel opgave van de uitspraak van de rechtbank en van de gegevens over
      zichzelf die over een bestuurder worden verlangd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61j
  - number: 61j.2
    text: |-
      Een rechtshandeling die door een orgaan van de betrokken toegelaten instelling of dochtermaatschappij wordt
      verricht na de uitspraak van de rechtbank en voor het tijdstip waarop degenen die bij die rechtshandeling een
      belang hebben voor het eerst van die uitspraak kennis kunnen nemen, is geldig. Het tijdstip, bedoeld in de eerste
      volzin, is de datum van uitgifte van de *Staatscourant* waarin een uittreksel van die uitspraak is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61j
  - number: 61k.1
    text: |-
      De leden van de organen van de toegelaten instelling of de dochtermaatschappij en de personen die voor haar
      werkzaamheden verrichten, verlenen alle door de bewindvoerders gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61k
  - number: 61k.2
    text: |-
      Indien meer dan een bewindvoerder is benoemd, is voor de geldigheid van hun handelingen toestemming van de
      meerderheid van de bewindvoerders of, bij staking van stemmen, een beslissing van de president van de rechtbank
      vereist.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61k
  - number: 61k.3
    text: |-
      De rechtbank kan te allen tijde een bewindvoerder ontslaan en hem door een andere bewindvoerder vervangen, dan
      wel aan hem een of meer bewindvoerders toevoegen, een en ander ambtshalve dan wel op verzoek van die bewindvoerder
      zelf, van een of meer andere bewindvoerders of van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61k
  - number: 61k.4
    text: |-
      De bewindvoerders brengen tijdens de uitoefening van hun bevoegdheden telkens na verloop van drie maanden, alsmede
      na beëindiging daarvan, zo spoedig mogelijk verslag over hun werkzaamheden uit aan de rechtbank en aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61k
  - number: 61l.1
    text: |-
      Het bewind eindigt twee jaar na de uitspraak van de rechtbank waarbij de toegelaten instelling of de
      dochtermaatschappij onder bewind is gesteld. Het bewind eindigt voorts met onmiddellijke ingang na het
      onherroepelijk worden van een benoeming van een of meer bewindvoerders in een aan die toegelaten instelling of
      dochtermaatschappij verleende surseance van betaling of van een of meer curatoren in haar faillissement.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61l
  - number: 61l.2
    text: |-
      Indien naar het oordeel van Onze Minister voor het tijdstip, genoemd in de eerste volzin van het eerste lid, de
      voorwaarden zijn geschapen waaronder de betrokken toegelaten instelling of dochtermaatschappij niet langer het
      belang van de volkshuisvesting ernstige schade berokkent en niet op korte termijn dat belang ernstige schade zal
      berokkenen, verzoekt hij de rechtbank het bewind op te heffen. Bij zijn besluit waarbij het bewind wordt opgeheven,
      ontslaat de rechtbank de bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61l
  - number: 61la
    text: |-
      De Algemene Rekenkamer is bevoegd, voor zover zij dit nodig acht voor het uitoefenen van haar taak, bij
      alle toegelaten instellingen en dochtermaatschappijen alle goederen, administraties, documenten, en andere
      informatiedragers op een door haar aan te geven wijze te onderzoeken. Het onderzoek bij een toegelaten instelling
      kan mede betrekking hebben op een samenwerkingsvennootschap waarin zij volledig aansprakelijke vennote is.
      [Artikel 7.18, vijfde lid, van de Comptabiliteitswet 2016][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61la
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
  - number: 61lb
    text: |-
      In bij of krachtens algemene maatregel van bestuur te bepalen gevallen stelt Onze Minister de raden van toezicht
      van de toegelaten instellingen en de besturen van de dochtermaatschappijen op de hoogte van zijn werkzaamheden ter
      uitoefening van zijn taken en bevoegdheden, bedoeld in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61lb
  - number: 61lc
    text: |-
      Onze Minister betrekt bij het nemen van een besluit waartoe hij bij of krachtens deze wet bevoegd is, behalve
      de op grond van de bij of krachtens deze wet daarop betrekking hebbende voorschriften, de daarover uitgebrachte
      zienswijzen en adviezen en de uitkomsten van daarover gevoerd overleg. Onverminderd de in de eerste zin bedoelde
      voorschriften, kan hij bij die besluiten tevens het belang van de volkshuisvesting betrekken, indien dat naar zijn
      oordeel in het geding is.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61lc
  - number: 61m.1
    text: |-
      Onze Minister kan, indien dat naar zijn oordeel in het belang van de volkshuisvesting is, op een met redenen
      omklede aanvraag een overeenkomst tussen toegelaten instellingen, onderling of met een of meer andere partijen,
      algemeen verbindend verklaren voor alle toegelaten instellingen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61m
  - number: 61m.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat Onze Minister bij een besluit tot toepassing van het
      eerste lid artikelen van dit hoofdstuk of het bepaalde krachtens zodanige artikelen buiten werking kan stellen. In
      dat geval wordt tevens bepaald dat hij uitsluitend dat bepaalde buiten werking stelt in het onderwerp waarvan naar
      zijn oordeel, uit het oogpunt van het belang van de volkshuisvesting en de uitoefening van het toezicht, toereikend
      door de overeenkomst, bedoeld in het eerste lid, wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61m
  - number: 61m.3
    text: |-
      Toepassing van het eerste lid leidt niet tot enige beperking voor Onze Minister om uitvoering en toepassing
      te geven aan zijn taken en bevoegdheden, bedoeld in dit hoofdstuk en de [artikelen 93][ref1], [104a][ref2],
      [105][ref3] en [120b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61m
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '93'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 104a
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 120b
        hoofdstuk: IX
  - number: 61n.1
    text: |-
      Een aanvraag om toepassing van [artikel 61m, eerste lid][ref1], kan slechts worden ingediend door ten minste
      tweederde van de toegelaten instellingen, die gezamenlijk de eigendom hebben van ten minste tweederde van
      het aantal woongelegenheden dat in eigendom van toegelaten instellingen is. Bij ministeriële regeling kunnen
      voorschriften worden gegeven omtrent de bij de aanvraag over te leggen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61n
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61n.2
    text: |-
      Op de voorbereiding van een besluit op de aanvraag is [afdeling 3.4 van de Algemene wet bestuursrech][ref1]t van
      toepassing. In afwijking van [artikel 3:15, eerste en tweede lid, van die wet][ref2] kan eenieder zienswijzen naar
      voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61n
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 61n.3
    text: |-
      Onze Minister kan aan een besluit tot toepassing van [artikel 61m, eerste lid][ref1], voorschriften of beperkingen
      verbinden. Hij gaat daartoe in elk geval over, voor zover de in dat artikel bedoelde overeenkomst ten doel heeft
      beroep op de rechter omtrent het in die overeenkomst bepaalde uit te sluiten, of enig onderscheid te maken tussen
      toegelaten instellingen die partij zijn bij die overeenkomst en de overige toegelaten instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61n
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61n.4
    text: |-
      Een besluit tot toepassing van [artikel 61m, eerste lid][ref1], heeft geen terugwerkende kracht. Het geldt voor een
      daarbij aangegeven termijn van ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61n
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61o
    text: |-
      Onze Minister neemt slechts een besluit tot toepassing van [artikel 61m, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61o
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61o.a
    text: uit de in dat artikel bedoelde overeenkomst blijkt voor welke periode deze geldt, en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61o
  - number: 61o.b
    text: |-
      voor elke toegelaten instelling door die toepassing komt vast te staan welke financiële of andere gevolgen voor
      haar daaruit voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61o
  - number: 61p.1
    text: |-
      Onze Minister kan een besluit tot toepassing van [artikel 61m, eerste lid][ref1], intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61p
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61p.1.a
    text: |-
      naar zijn oordeel het van kracht blijven van dat besluit het belang van de volkshuisvesting ernstige schade zou
      berokkenen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61p
  - number: 61p.1.b
    text: |-
      de bij de aanvraag om toepassing van [artikel 61m, eerste lid][ref1], verstrekte gegevens zodanig onjuist zijn of
      onvolledig blijken, dat daarop een andere beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste
      of volledige gegevens bekend waren geweest, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61p
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61p.1.c
    text: |-
      voor Nederland verbindende internationale verplichtingen, of voorschriften met het oog op de nakoming daarvan,
      daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61p
  - number: 61p.2
    text: |-
      Alvorens een besluit tot toepassing van [artikel 61m, eerste lid][ref1], in te trekken op de grond, genoemd in
      het eerste lid, onderdeel a, stelt Onze Minister degenen die de aanvraag om die toepassing hebben gedaan, in de
      gelegenheid binnen een door hem te bepalen termijn hun zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61p
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61p.3
    text: |-
      Op de voorbereiding van een besluit als bedoeld in het eerste lid op een van de gronden, genoemd in onderdeel b of
      c van dat lid, is [artikel 61n, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61n
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61p
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61n
        hoofdstuk: IV
        afdeling: '6'
  - number: 61p.4
    text: |-
      Een besluit tot intrekking van een besluit tot toepassing van [artikel 61m, eerste lid][ref1], heeft geen
      terugwerkende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61m
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61p
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61m
        hoofdstuk: IV
        afdeling: '6'
  - number: 61q
    text: |-
      Elke toegelaten instelling is tot nakoming van een voor haar geldende algemeen verbindend verklaarde overeenkomst
      gehouden tegenover ieder ander die bij die nakoming een redelijk belang heeft.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61q
  - number: 61s
    text: |-
      De voordracht voor een krachtens [hoofdstuk IIIA][ref1] of dit hoofdstuk vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61s
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: IIIa
  - number: 61t.1
    text: |-
      Indien een spoedeisend belang vordert dat voorschriften worden gegeven met het oog op de nakoming van voor
      Nederland verbindende besluiten van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk
      of van de Europese Commissie inzake staatssteun of compensatie in de zin van het Verdrag betreffende de werking van
      de Europese Unie aan toegelaten instellingen, en voor een juiste uitvoering van die voorschriften regeling bij wet
      of bij algemene maatregel van bestuur noodzakelijk is, kunnen die voorschriften tijdelijk bij ministeriële regeling
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61t
  - number: 61t.2
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid vervalt met ingang van de dag die een jaar ligt na de
      datum waarop zij in werking is getreden. Zij blijft na die dag van kracht, indien op die dag een voorstel van wet
      bij de Staten-Generaal is ingediend dat, of een algemene maatregel van bestuur in het Staatsblad is geplaatst die
      in regeling van het betrokken onderwerp voorziet. Na de indiening van een zodanig wetsvoorstel of de plaatsing in
      het Staatsblad van een zodanige algemene maatregel van bestuur vervalt zij op het tijdstip waarop dat wetsvoorstel
      wordt verworpen of, na tot wet te zijn verheven, in werking treedt, respectievelijk die algemene maatregel van
      bestuur wordt ingetrokken of in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61t
  - number: 61t.3
    text: |-
      De werkingsduur van een ministeriële regeling als bedoeld in het eerste lid kan eenmalig met ten hoogste een jaar
      worden verlengd. De tweede en derde volzin van het tweede lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61t
  - number: 61u.1
    text: |-
      Bij wijze van experiment kan, met inachtneming van internationaalrechtelijke verplichtingen, bij algemene maatregel
      van bestuur worden afgeweken van het bepaalde bij [hoofdstukken IIIa][ref1] en [IV][ref2] en bij ministeriële
      regeling van het bepaalde krachtens die hoofdstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: 61u.2
    text: |-
      Aan het eerste lid kan uitsluitend toepassing worden gegeven indien het experiment tot doel heeft bij te dragen aan
      het belang van de volkshuisvesting dan wel, zonder afbreuk te doen aan het belang van de volkshuisvesting, aan het
      doelmatiger uitvoeren van deze wet.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.3
    text: |-
      Bij een algemene maatregel van bestuur of ministeriële regeling als bedoeld in het eerste lid worden regels gesteld
      over het experiment, waarbij in elk geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.3.a
    text: het doel van het experiment;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.3.b
    text: op welke wijze van welke in het eerste lid bedoelde voorschriften wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.3.c
    text: voor wie de afwijking geldt;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.3.d
    text: de duur van het experiment; en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.3.e
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een in die regeling aangeduid
      experiment.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.5
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste vijf jaar. Voordat een experiment is afgelopen kan
      Onze Minister besluiten tot verlenging van ten hoogste twee jaar:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.5.a
    text: |-
      van een algemene maatregel van bestuur als bedoeld in het eerste lid, indien een voorstel van wet is ingediend bij
      de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling, tot het tijdstip waarop
      het wetsvoorstel tot wet is verheven en in werking treedt;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.5.b
    text: |-
      van een ministeriële regeling als bedoeld in het eerste lid, tot het tijdstip waarop een gewenste omzetting van het
      experiment in een structurele algemene maatregel van bestuur in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: 61u.6
    text: |-
      Onze Minister zendt uiterlijk negen maanden voor het einde van de werkingsduur van een algemene maatregel van
      bestuur als bedoeld in het eerste lid, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk, evenals een standpunt over de voortzetting van die maatregel, anders dan als
      experiment.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel61u
  - number: '62.1'
    text: |-
      Bij algemene maatregel van bestuur kan, ten einde gegevens te verkrijgen omtrent omvang en samenstelling van de
      woningvoorraad en omtrent gebruik en bezetting van woningen, worden bepaald dat een algemene woningtelling wordt
      gehouden. In die maatregel worden tijdstip, doel en inhoud van de woningtelling omschreven.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel62
  - number: '62.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen nadere voorschriften omtrent
      de woningtelling worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel62
  - number: '62.3'
    text: |-
      De colleges van burgemeester en wethouders verlenen hun medewerking aan de uitvoering van de in het eerste lid
      bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel62
  - number: '62.4'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur worden voorschriften gegeven omtrent de aan
      gemeenten uit ’s Rijks kas toe te kennen vergoeding van ter zake gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel62
  - number: '63.1'
    text: |-
      Bij koninklijk besluit kunnen colleges van burgemeester en wethouders worden verplicht, overeenkomstig bij dat
      besluit te geven voorschriften, een bijzonder onderzoek naar de staat van de volkshuisvesting in te stellen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel63
  - number: '63.2'
    text: |-
      Aan gemeenten kunnen financiële middelen uit ’s Rijks kas worden verstrekt ter bestrijding van de kosten, verbonden
      aan een onderzoek als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel63
  - number: '64'
    text: |-
      Onze Minister verstrekt eenmaal per jaar aan de Staten-Generaal een verslag van de aard en het aantal van de
      woningen die in het jaar, voorafgaand aan het jaar waarin het verslag wordt aangeboden, zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel64
  - number: '65.1'
    text: |-
      Het college van burgemeester en wethouders alsmede gedeputeerde staten verstrekken overeenkomstig bij of krachtens
      algemene maatregel van bestuur gegeven voorschriften informatie ten behoeve van de door Onze Minister ingevolge
      [artikel 64][ref1] aan de Staten-Generaal te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel64
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '64'
        hoofdstuk: V
        afdeling: '2'
  - number: '65.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden in elk geval voorschriften
      gegeven omtrent de aard en omvang van de te verstrekken informatie, de instanties die, alvorens de informatie
      wordt verstrekt, moeten worden gehoord, alsmede de wijze waarop, het tijdstip waarop en de instantie waaraan de
      informatie moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel65
  - number: '69'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 65][ref1], treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel65
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '65'
        hoofdstuk: V
        afdeling: '2'
  - number: '75.1'
    text: |-
      Het college van burgemeester en wethouders kan, ingeval dit noodzakelijk is voor het naar behoren uitvoeren van
      deze wet, besluiten rechtstreeks van gemeentewege voorzieningen in het belang van de volkshuisvesting te treffen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel75
  - number: '75.2'
    text: |-
      Indien ter uitvoering van het eerste lid van gemeentewege woongelegenheden worden gebouwd, geschiedt dit slechts,
      indien aannemelijk is, dat door het bouwen van woongelegenheden door toegelaten instellingen niet voldoende in de
      woningbehoefte zal worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel75
  - number: 80a.1
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor stedelijke vernieuwing en treft maatregelen in het
      belang daarvan.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel80a
  - number: 80a.2
    text: |-
      Gedeputeerde staten dragen uitsluitend zorg voor de bevordering en ondersteuning van stedelijke vernieuwing, in het
      bijzonder indien zij in het kader daarvan financiële middelen verstrekken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel80a
  - number: 80a.3
    text: Onze Minister draagt zorg voor de bevordering en ondersteuning van stedelijke vernieuwing.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel80a
  - number: '81.1'
    text: |-
      Uit 's Rijks kas kunnen aan gemeenten of provincies financiële middelen worden verstrekt voor activiteiten die
      passen in het rijksbeleid met betrekking tot het bouwen, het wonen en de woonomgeving.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: '81.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent het verstrekken van financiële
      middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: '81.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen voorschriften worden gegeven omtrent het
      door provincies overdragen van krachtens het tweede lid aan hen toegekende bevoegdheden en verplichtingen aan een
      gemeente. De voorschriften betreffen in elk geval:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: 81.3.a
    text: het geval waarin een provincie bevoegdheden en verplichtingen al dan niet dient over te dragen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: 81.3.b
    text: de wijze waarop in geval van overdracht verantwoording aan Onze Minister wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: '81.4'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kan worden bepaald dat de
      gemeenteraad of provinciale staten voorschriften geeft of geven omtrent het door het college van burgemeester en
      wethouders, of gedeputeerde staten verstrekken van subsidie ten laste van de uit ’s Rijks kas aan hen verstrekte
      financiële middelen voor de activiteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: '81.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bevordering van eenheid in de voorschriften, bedoeld in het vierde
      lid, regelen worden gegeven omtrent de inhoud van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: '81.6'
    text: |-
      De gemeenteraad of provinciale staten brengen de door hen gegeven voorschriften, bedoeld in het vierde lid,
      binnen zes maanden na het van kracht worden van de algemene maatregel van bestuur, bedoeld in het vijfde lid, in
      overeenstemming met de bij die algemene maatregel van bestuur gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel81
  - number: '83'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 81][ref1], treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel81
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '81'
        hoofdstuk: V
        afdeling: '5'
  - number: '84'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het door het college
      van burgemeester en wethouders, gedeputeerde staten en het dagelijks bestuur van een samenwerkingsverband van
      gemeenten verstrekken van voor het verstrekken van financiële middelen van belang zijnde gegevens. De financiële
      gevolgen van het verstrekken van die gegevens worden niet gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel84
  - number: '86'
    text: |-
      Gegevens betreffende de door het Rijk verstrekte financiële middelen en subsidie worden jaarlijks op een door Onze
      Minister te bepalen wijze bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel86
  - number: '87'
    text: |-
      Onze Minister kan volgens bij ministeriële regeling gegeven voorschriften geldelijke steun verlenen
      voor doeleinden, de volkshuisvesting betreffende, voor zover het geldelijke steun betreft welke
      onmiddellijk voorafgaand aan 22 december 2000 in een ministeriële regeling was geregeld, die met
      ingang van die datum is komen te berusten op de algemene maatregel van bestuur, vastgesteld krachtens
      [artikel 9, eerste lid, van de Invoeringswet Wet stedelijke vernieuwing][ref1] zoals [die wet][ref2] onmiddellijk
      voorafgaand aan haar intrekking luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0011789#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011789
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011789
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011789
  - number: '92.1'
    text: |-
      Onze Minister draagt zorg voor de bestuursrechtelijke handhaving van het bepaalde bij of krachtens
      [hoofdstuk II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: II
  - number: '92.2'
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van het bepaalde bij of
      krachtens [hoofdstuk II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: II
  - number: '92.3'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor de bestuursrechtelijke handhaving van het bepaalde bij
      of krachtens [hoofdstuk III][ref1]. Hierbij is [artikel 18.4a van de Omgevingswet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '18'
  - number: '92.4'
    text: |-
      De toelatingsorganisatie kwaliteitsborging bouw, bedoeld in [artikel 7ak, eerste lid][ref1], is bevoegd tot het
      opleggen van een last onder bestuursdwang ter handhaving van de [artikelen 7ac tot en met 7ah][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7ac
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ak
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 7ac
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
  - number: '93.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens [hoofdstuk III][ref1] bepaalde zijn belast de bij besluit
      van het college van burgemeester en wethouders aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: III
  - number: '93.2'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [hoofdstukken IIIA][ref1] en [IV][ref2] bepaalde zijn
      belast de bij besluit van Onze Minister aangewezen bij de autoriteit werkzame ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: '93.3'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [hoofdstukken II][ref1] en [V tot en met IX][ref2]
      bepaalde zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: V
  - number: '93.4'
    text: |-
      In afwijking van het derde lid zijn met het toezicht op de naleving van het bepaalde bij of krachtens de
      [artikelen 7ac][ref1] en [7ah][ref2] belast de bij besluit van de toelatingsorganisatie kwaliteitsborging bouw,
      bedoeld in [artikel 7ak, eerste lid][ref3], aangewezen ambtenaren die deel uitmaken van het personeel, bedoeld
      in [artikel 7am][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ac
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7ah
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel7am
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 7ac
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 7ah
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1a
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 7ak
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1a
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 7am
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1a
  - number: '93.5'
    text: |-
      Van een besluit als bedoeld in het tweede tot en met vierde lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93
  - number: '93.6'
    text: |-
      De ambtenaren die zijn belast met het toezicht op de naleving ter zake van het bepaalde bij of krachtens de
      [hoofdstukken II][ref1] en [III][ref2], met uitzondering van de ambtenaren, bedoeld in het vierde lid, zijn
      bevoegd, met medeneming van de benodigde apparatuur, een woning te betreden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: III
  - number: 93a.1
    text: |-
      De toezichthoudende ambtenaren, bedoeld in [artikel 93, derde lid][ref1], zijn in afwijking van
      [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref2], bevoegd met medeneming van de benodigde
      apparatuur een woning te betreden zonder toestemming van de bewoner ten behoeve van de uitoefening van de
      bevoegdheden, bedoeld in artikel 14, vierde lid, onderdelen a, d en e, van [verordening (EU) 2019/1020](32920R2019)
      met betrekking tot bouwproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '93'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 93a.2
    text: |-
      Voor het uitoefenen van de bevoegdheid, bedoeld in het eerste lid, is een voorafgaande machtiging vereist van de
      rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 93a.3
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het tweede lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93a
  - number: 93a.4
    text: |-
      De [artikelen 2][ref1] en [3 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
  - number: 93b.1
    text: |-
      De toezichthoudende ambtenaren, bedoeld in [artikel 93, derde lid][ref1], zijn bevoegd om, ter
      uitvoering van [verordening (EU) 2019/1020](32920R2019), onder verstrekking van onjuiste of onvolledige
      gegevens met betrekking tot hun identiteit en hoedanigheid, bouwproducten te verkrijgen en de hieraan
      gerelateerde handelingen te verrichten voor zover dat voor de vervulling van hun taak noodzakelijk is.
      [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '93'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 93b.2
    text: |-
      De ambtenaar die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan een
      schriftelijk verslag op waarin hij vermeldt:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93b.2.a
    text: zijn naam of nummer en hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93b.2.b
    text: de motivering van de noodzaak tot uitoefening van de bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93b.2.c
    text: de voorschriften op de naleving waarvan wordt toegezien;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93b.2.d
    text: |-
      het adres, waaronder indien van toepassing, het elektronische adres, waar het bouwproduct is verkregen en, voor
      zover bekend, de omschrijving van de betrokken marktdeelnemer;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93b.2.e
    text: |-
      de onjuiste of onvolledige gegevens die bij de handelingen ten behoeve van het verkrijgen van het bouwproduct zijn
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93b.2.f
    text: de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93b.2.g
    text: hetgeen tijdens het onderzoek van het bouwproduct is verricht, gebleken en overigens is voorgevallen.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93b
  - number: 93c.1
    text: |-
      Ter uitvoering van [verordening (EU) 2019/1020](32920R2019) kan Onze Minister, indien er geen andere doeltreffende
      middelen voorhanden zijn om een ernstig risico als bedoeld in artikel 3, onderdeel 20, van [verordening (EU)
      2019/1020](32920R2019), gevormd door een bouwproduct, weg te nemen, een zelfstandige last opleggen aan degene die
      daartoe in staat is, om inhoud te verwijderen van of de toegang te beperken tot een online interface of opdracht te
      geven tot de duidelijke weergave van een waarschuwing voor eindgebruikers wanneer zij zich toegang verschaffen tot
      een online interface.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
  - number: 93c.2
    text: |-
      Indien niet binnen de daarvoor gestelde termijn aan een last als bedoeld in het eerste lid is voldaan, kan Onze
      Minister een zelfstandige last opleggen aan een aanbieder van diensten van de informatiemaatschappij om alle
      maatregelen te treffen die redelijkerwijs van hem kunnen worden gevergd om de toegang tot een online interface
      te beperken, onder meer door een daarvoor in aanmerking komende derde te verzoeken dergelijke maatregelen uit te
      voeren.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
  - number: 93c.3
    text: |-
      Degene tot wie een zelfstandige last als bedoeld in het eerste of tweede lid is gericht, handelt overeenkomstig
      die last.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
  - number: 93c.4
    text: |-
      Op grond van het eerste of tweede lid kan geen zelfstandige last worden opgelegd die leidt tot het blokkeren of
      filteren van internetverkeer.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
  - number: 93c.5
    text: |-
      Voor een zelfstandige last als bedoeld in het eerste of tweede lid is voorafgaande machtiging vereist van de
      rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 93c.6
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het vijfde lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
  - number: 93c.7
    text: |-
      Onze Minister maakt de machtiging van de rechter-commissaris gelijktijdig met de zelfstandige last, bedoeld in het
      eerste of tweede lid, bekend.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
  - number: 93c.8
    text: Onze Minister kan een last onder dwangsom opleggen aan degene die handelt in strijd met het derde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93c
  - number: 93d
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing voor zover
      een toezichthoudende ambtenaar, bedoeld in [artikel 93, derde lid][ref2], bijstand verleent aan een
      markttoezichtautoriteit als bedoeld in artikel 3, onderdeel 4, van [verordening (EU) 2019/1020](32920R2019) uit een
      andere lidstaat van de Europese Unie op grond van artikel 22 of artikel 23 van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel93
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel93d
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '93'
        hoofdstuk: VI
  - number: '95.1'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking zendt het college van burgemeester en wethouders
      aan de inspecteur een afschrift van elke verordening, elk besluit of elk aan de raad overlegd verslag, de
      volkshuisvesting betreffende. De financiële gevolgen van het zenden van die afschriften worden niet gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel95
  - number: '95.2'
    text: |-
      Het college van burgemeester en wethouders geeft aan de inspecteur alle door deze verlangde inlichtingen omtrent de
      naleving van de wetten en de krachtens die wetten gegeven voorschriften op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel95
  - number: 104a.1
    text: |-
      Onze Minister kan een toegelaten instelling aan welke compensatie niet volledig toekomt, verplichten tot betaling
      van een geldsom ten laste van die compensatie. [Artikel 61d, eerste lid, tweede volzin][ref1], is ten aanzien van
      een samenwerkingsvennootschap als bedoeld in die volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel104a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 104a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de toepassing
      van het eerste lid, waarbij gevallen kunnen worden aangewezen waarin Onze Minister een toegelaten instelling aan
      welke compensatie niet volledig toekomt, verplicht tot betaling van een geldsom ten laste van die compensatie.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel104a
  - number: '105.1'
    text: |-
      Onze Minister kan een last onder dwangsom of een bestuurlijke boete opleggen aan een toegelaten instelling of een
      dochtermaatschappij:
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel105
  - number: 105.1.a
    text: |-
      ter handhaving van het bepaalde bij of krachtens [hoofdstuk IIIA][ref1] of [IV][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: 105.1.b
    text: |-
      ter handhaving van een aanwijzing als bedoeld in [artikel 61d][ref1] of van een maatregel als bedoeld in
      [artikel 48, achtste lid][ref2], [61g, eerste, tweede of derde lid][ref3], of [104a, eerste lid][ref4], of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel61g
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 61g
        hoofdstuk: IV
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 104a
        hoofdstuk: VIII
  - number: 105.1.c
    text: |-
      naar aanleiding van een plan als bedoeld in [artikel 29, eerste lid, tweede volzin][ref1], of
      [57, eerste lid, onderdeel a][ref2], dan wel indien de toegelaten instelling een zodanig plan niet verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '4'
  - number: '105.2'
    text: |-
      [Artikel 61d, eerste lid, tweede volzin][ref1], is ten aanzien van een samenwerkingsvennootschap als bedoeld in die
      volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: '105.3'
    text: |-
      De bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '118'
    text: |-
      Indien de bekendmaking van beschikkingen op grond van deze wet niet kan geschieden op de wijze als voorzien in
      [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1], geschiedt zij door openbare bekendmaking op
      het perceel waarop de beschikking betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 118a.1
    text: |-
      Onze Minister kan in een bepaald geval van het bij of krachtens [hoofdstuk IIIa][ref1] en [IV][ref2] bepaalde
      afwijken of afwijking daarvan toestaan als strikte toepassing ervan naar zijn oordeel zou leiden tot een
      onbillijkheid van overwegende aard of naar zijn oordeel het belang van de volkshuisvesting minder is gediend met
      die strikte toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: 118a.2
    text: |-
      Onze Minister zendt jaarlijks een verslag aan de beide kamers der Staten-Generaal inzake het gebruik van de
      bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel118a
  - number: '119.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven ter uitvoering van de
      Verordening (EU) nr. 305/2011 van het Europees Parlement en de Raad van 9 maart 2011 tot vaststelling van
      geharmoniseerde voorwaarden voor het verhandelen van bouwproducten en tot intrekking van [Richtlijn 89/106/EEG]
      (31989L0106) van de Raad (PbEU 2011, L 88).
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel119
  - number: '119.2'
    text: Gedragingen in strijd met voorschriften als bedoeld in het eerste lid zijn verboden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel119
  - number: 119a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven ter uitvoering van verordening
      (EU) 2019/1020.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel119a
  - number: 119a.2
    text: Gedragingen in strijd met voorschriften als bedoeld in het eerste lid zijn verboden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel119a
  - number: '120.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met het oog op de nakoming van
      voor Nederland verbindende internationale verplichtingen die betrekking hebben op of samenhangen met onderwerpen
      waarin bij of krachtens deze wet is voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120
  - number: '120.2'
    text: Gedragingen in strijd met voorschriften als bedoeld in het eerste lid zijn verboden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120
  - number: 120bis
    text: |-
      Onze Minister draagt er zorg voor dat een bij of krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 120, eerste lid][ref1], aan te vragen energieprestatiecertificaat als bedoeld in artikel 2 van
      de [Richtlijn 2010/31](32010L0031)/EU van het Europees Parlement en de Raad van 19 mei 2010 betreffende
      de energieprestatie van gebouwen (PbEU 2010, L 153), ook digitaal, al dan niet met ondersteuning door een
      energieadviseur op afstand, kan worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120bis
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 120a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat Onze Minister bij wege van experiment
      tijdelijk van bij of krachtens algemene maatregel van bestuur gegeven voorschriften, niet gebaseerd op
      [hoofdstukken IIIa][ref1] en [IV][ref2], kan afwijken of een zodanige afwijking kan toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: 120a.2
    text: 'Indien toepassing wordt gegeven aan het eerste lid, wordt in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120a
  - number: 120a.2.a
    text: de wijze waarop tot een keuze voor experimenten als bedoeld in het eerste lid wordt gekomen;
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120a
  - number: 120a.2.b
    text: de ten hoogste toegestane tijdsduur van een afwijking als bedoeld in het eerste lid en
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120a
  - number: 120a.2.c
    text: |-
      de wijze waarop tot de vaststelling wordt gekomen of een experiment als bedoeld in het eerste lid zodanig geslaagd
      is, dat het wettelijk voorschrift waarvan bij wege van dat experiment is afgeweken zou moeten worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120a
  - number: 120b.1
    text: |-
      Onze Minister kan een last onder bestuursdwang of een bestuurlijke boete opleggen ter zake van een
      overtreding van het verbod, bedoeld in [artikel 119, tweede lid][ref1], [artikel 119a, tweede lid][ref2], en
      [artikel 120, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel119a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '119'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 119a
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: 120b.2
    text: |-
      Voor een overtreding, begaan door een natuurlijke persoon, bedraagt de bestuurlijke
      boete ten hoogste het bedrag dat is vastgesteld voor de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1]. Ten aanzien van een overtreding, begaan door een
      rechtspersoon, is [artikel 105, derde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel105
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel120b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
  - number: '121'
    text: |-
      De bevoegdheid, de gemeenteraad toekomende overeenkomstig [artikel 149 van de Gemeentewet][ref1], wordt niet
      uitgeoefend ten aanzien van de onderwerpen waarin is voorzien bij of krachtens de algemene maatregelen van bestuur,
      bedoeld in [hoofdstuk IV][ref2], voor zover die algemene maatregelen van bestuur betrekking hebben op toegelaten
      instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '149'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: '125'
    text: |-
      De intrekking van de [Woningwet van 12 juli 1962][ref1] heeft geen gevolgen voor de geldigheid van de krachtens
      die wet bij koninklijk besluit dan wel door Onze Minister gegeven voorschriften, tenzij krachtens deze wet anders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '127.1'
    text: |-
      Aanschrijvingen die op grond van de [Woningwet van 12 juli 1962][ref1] zijn uitgevaardigd en waartegen geen beroep
      meer kan worden ingesteld, gelden als aanschrijvingen als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '127.2'
    text: |-
      Aanschrijvingen die op grond van de [Woningwet van 12 juli 1962][ref1] zijn uitgevaardigd en waartegen nog beroep
      kan worden ingesteld dan wel beroep is ingesteld, worden afgedaan overeenkomstig genoemde wet en gelden als
      aanschrijvingen als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '128.1'
    text: |-
      Besluiten tot onbewoonbaarverklaring die op grond van de [Woningwet van 12 juli 1962][ref1] zijn genomen en
      waartegen geen beroep meer kan worden ingesteld, gelden als beslissingen tot onbewoonbaarverklaring als bedoeld in
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '128.2'
    text: |-
      Besluiten tot onbewoonbaarverklaring die op grond van de [Woningwet van 12 juli 1962][ref1] zijn genomen en
      waartegen nog beroep kan worden ingesteld dan wel beroep is ingesteld, worden afgedaan overeenkomstig genoemde wet
      en gelden als beslissingen tot onbewoonbaarverklaring als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: 130a
    text: |-
      Een toestemming verleend door Onze Minister op basis van [artikel 45a][ref1] van deze wet, zoals dat luidde voor
      de inwerkingtreding van artikel I, onderdeel E, van de Wijziging van de Woningwet in verband met het tijdelijk
      uitbreiden van het werkgebied van toegelaten instellingen met het oog op het huisvesten van vergunninghouders,
      blijft onder de voorwaarden waaronder deze destijds is verleend gelden tot het moment dat de duur waarvoor deze
      is verleend is verlopen. Het bepaalde bij en krachtens artikel 45a blijft op de toestemming van Onze Minister van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 45a
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '132'
    text: |-
      Overtredingen van bij of krachtens de [Woningwet van 12 juli 1962][ref1] gegeven voorschriften worden afgedaan
      overeenkomstig genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: 134_bis
    text: |-
      De toegelaten instellingen brengen hun statuten uiterlijk voor 1 januari 2019 in overeenstemming met de Woningwet,
      zoals gewijzigd door de [Veegwet Wonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039169
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0039169
  - number: '134.1'
    text: |-
      In dit artikel wordt verstaan onder toegelaten instelling: toegelaten instelling als bedoeld in [artikel 19][ref1]
      van de Woningwet, die op 1 juli 2015 als zodanig bestond.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '134.2'
    text: |-
      Het bepaalde bij en krachtens deze wet omtrent verbonden ondernemingen heeft, onverminderd [artikel 21a][ref1],
      geen gevolgen voor een verbonden onderneming die geen dochtermaatschappij is en die is voortgekomen uit een
      afsplitsing als bedoeld in [artikel 334a lid 3 van Boek 2 van het Burgerlijk Wetboek][ref2], waarbij een toegelaten
      instelling is betrokken en die heeft plaatsgevonden voor 1 juli 2015, indien die afsplitsing:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 334a
  - number: 134.2.a
    text: |-
      ten doel had om een situatie die strijdig was met [artikel 70, eerste lid][ref1], van deze wet zoals die luidde op
      30 juni 2015, en die tot die afsplitsing was toegestaan, op te heffen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
  - number: 134.2.b
    text: is goedgekeurd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
  - number: '134.3'
    text: |-
      Het bepaalde bij en krachtens [artikel 21c, eerste lid][ref1], heeft geen gevolgen voor de transacties die door
      toegelaten instellingen voor 1 juli 2015 zijn aangegaan met financiële instellingen die niet behoren tot een
      categorie als bedoeld in artikel 21c, eerste lid, voor het doen bouwen of verwerven van onroerende zaken en
      onroerende en infrastructurele aanhorigheden. Voor de toepassing van artikel 21c, tweede lid, tweede volzin, worden
      de in de eerste volzin bedoelde transacties mede in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
        hoofdstuk: IV
        afdeling: '1'
  - number: '134.4'
    text: |-
      Het bepaalde bij en krachtens de [artikelen 25][ref1] en [30][ref2] heeft geen gevolgen voor de benoeming of
      aanwijzing van personen tot bestuurder van een toegelaten instelling of tot lid van een orgaan van een toegelaten
      instelling waaraan het toezicht op het bestuur is opgedragen, die voor 1 juli 2015 heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: '134.5'
    text: |-
      Het bepaalde bij en krachtens [artikel 45][ref1] heeft geen gevolgen voor het toegestaan zijn van werkzaamheden van
      toegelaten instellingen en van met hen in de zin van artikel 1, tweede lid, van die wet verbonden ondernemingen,
      waarmee voor 1 juli 2015 een aanvang is gemaakt, of met betrekking tot welke uit schriftelijke, uitsluitend
      op die werkzaamheden betrekking hebbende, stukken blijkt dat die aanvang werd beoogd, en die voor 1 juli 2015
      waren toegestaan of zijn goedgekeurd ingevolge het bepaalde bij en krachtens deze wet zoals die voor 1 juli
      2015 luidde of blijkens enig daaromtrent door of vanwege Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, Onze Minister voor Wonen, Wijken en Integratie, Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties dan wel Onze Minister genomen besluit of enige daaromtrent door of vanwege een van die
      ministers gedane mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '134.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van het
      tweede en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel134
  - number: '135'
    text: |-
      In wettelijke procedures en rechtsgedingen waarbij het Centraal Fonds voor de Volkshuisvesting, bedoeld in
      [artikel 71][ref1] van deze wet zoals die laatstelijk luidde voor 1 juli 2015, is betrokken, treedt met ingang van
      1 juli 2015 Onze Minister in de plaats van dit fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '71'
        hoofdstuk: V
        afdeling: 3A
  - number: '140'
    text: |-
      De Wet van 11 maart 1978, houdende wijziging van de Woningwet inzake aanschrijving tot verbetering van woningen
      (*Stb.* 143) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel140
  - number: '147'
    text: De Wet geldelijke steun woonwagens (*Stb.* 1986, 264) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel147
  - number: '152'
    text: |-
      Waar in voorschriften, gegeven bij of krachtens een andere wet dan de in de [artikelen 149 tot en met 151][ref1]
      genoemde, wordt verwezen naar een artikel in de [Woningwet van 12 juli 1962][ref2], wordt deze verwijzing geacht te
      zijn geschied naar de overeenkomstige bepalingen in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '149'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002379
  - number: 152b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen drie jaar na de inwerkingtreding van de
      wet van 25 juni 2019 tot wijziging van de Woningwet in verband met de introductie van een stelsel van certificering
      voor werkzaamheden aan gasverbrandingsinstallaties aan de Staten-Generaal een verslag over de doeltreffendheid en
      de effecten van de krachtens [artikel 3, tweede en derde lid][ref1], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel152b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '153.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel153
  - number: '153.2'
    text: |-
      Bij het in het eerste lid bedoelde besluit kan, voor zover dat besluit voorziet in gedeeltelijke inwerkingtreding
      van deze wet, in afwijking in zoverre van [artikel 124][ref1] worden bepaald dat verschillende artikelen of
      onderdelen van artikelen van de [Woningwet van 12 juli 1962][ref2] van kracht blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '124'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002379
  - number: '153.3'
    text: |-
      Indien toepassing wordt gegeven aan het eerste of tweede lid, kan in hetgeen met het oog op het in werking treden
      dan wel in stand blijven van de desbetreffende artikelen of onderdelen daarvan regeling behoeft, worden voorzien
      bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel153
  - number: '153.4'
    text: |-
      De [Woningwet van 12 juli 1962][ref1] wordt vanaf het tijdstip van gehele of gedeeltelijke inwerkingtreding van
      deze wet aangehaald als [Woningwet 1962][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379
      [ref2]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0002379
      - id: ref2
        bwb_id: BWBR0002379
  - number: '153.5'
    text: Deze wet kan worden aangehaald als Woningwet.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel153
