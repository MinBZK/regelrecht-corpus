  - number: '1.4'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt, waar daarin in enigerlei bewoordingen sprake
      is van woongelegenheden, woningen, gebouwen of aanhorigheden die in eigendom zijn van toegelaten instellingen of
      met hen verbonden ondernemingen, onder die eigendom mede begrepen elke andere bevoegdheid tot het met betrekking
      tot woongelegenheden, woningen, gebouwen of aanhorigheden verrichten van de handelingen die volgens het burgerlijk
      recht tot de verantwoordelijkheid van een eigenaar behoren.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde zijn, waar daarin sprake is van het vereiste van
      of voorschriften omtrent financiële continuïteit van een toegelaten instelling, dat vereiste en die voorschriften
      tevens van toepassing op de afzonderlijke onderdelen van een toegelaten instelling, aan welke baten, lasten, activa
      en passiva beschikbaar zijn gesteld voor de uitvoering van de diensten van algemeen economisch belang welke aan
      haar zijn opgedragen, respectievelijk van haar overige werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel1
  - number: '1.6'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde vallen het boekjaar en het verslagjaar in de zin van
      deze wet samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel1
  - number: '1.7'
    text: |-
      Voor de toepassing van [verordening (EU) 2019/1020](32920R2019) van het Europees Parlement en de Raad van
      20 juni 2019 betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn 2004/42/
      EG](32004L0042) en de [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305) (PbEU
      2019, L169) wordt voor het bij of krachtens deze wet bepaalde verstaan onder: - *aanbieder van diensten van
      de informatiemaatschappij:* aanbieder van een dienst zoals gedefinieerd in artikel 1, eerste lid, onder b, van
      [Richtlijn (EU) 2015/1535](32015L1535) van het Europees Parlement en de Raad van 9 september 2015 betreffende
      een informatieprocedure op het gebied van technische voorschriften en regels betreffende de diensten van de
      informatiemaatschappij (PbEU 2015, L 241);
        - *fulfilmentdienstverlener:* fulfilmentdienstverlener als bedoeld in artikel 3, onderdeel 11, van [verordening
      (EU) 2019/1020](32920R2019);
        - *marktdeelnemer:* marktdeelnemer als bedoeld in artikel 3, onderdeel 13, van [verordening (EU) 2019/1020]
      (32920R2019);
        - *online interface:* online interface als bedoeld in artikel 3, onderdeel 15, van [verordening (EU) 2019/1020]
      (32920R2019);
        - *verordening (EU) 2019/1020:* [verordening (EU) 2019/1020](32920R2019) van het Europees Parlement en de Raad van
      20 juni 2019 betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn 2004/42/EG]
      (32004L0042) en de [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305) (PbEU 2019,
      L169).
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel1
  - number: '3.1'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de gevallen
      waarin Onze Minister conformiteitsbeoordelingsinstanties en conformiteitsbeoordelingsdocumenten kan aanwijzen
      ten behoeve van het afgeven van conformiteitsverklaringen, waarmee kenbaar wordt gemaakt dat gedurende
      een bepaalde periode een gerechtvaardigd vertrouwen bestaat dat de hierin genoemde natuurlijke personen of
      rechtspersonen werkzaamheden uitvoeren volgens kwaliteitseisen die opgenomen zijn in door Onze Minister aangewezen
      conformiteitsbeoordelingsdocumenten.
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is niet van toepassing op conformiteitsbeoordelingsinstanties als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0005181/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 7aa
    text: |-
      Voor de toepassing van het bij of krachtens deze paragraaf bepaalde wordt verstaan onder: - *instrument
      voor kwaliteitsborging:* beoordelingsmethodiek die tot doel heeft vast te stellen of er een gerechtvaardigd
      vertrouwen bestaat dat het bouwen van een bouwwerk voldoet aan de voorschriften die zijn gesteld op grond van
      [artikel 4.3, eerste lid, aanhef en onder a, of vierde lid, van de Omgevingswet][ref1], of [artikel 120][ref2];
        - *toelatingsorganisatie:* toelatingsorganisatie kwaliteitsborging bouw als bedoeld in [artikel 7ak][ref3];
        - *instrumentaanbieder:* natuurlijk persoon of rechtspersoon die een aanvraag tot toelating van een instrument voor
      kwaliteitsborging tot het stelsel van kwaliteitsborging voor het bouwen indient bij de toelatingsorganisatie;
        - *kwaliteitsborger:* natuurlijk persoon of rechtspersoon die met toestemming van de instrumentaanbieder een
      toegelaten instrument voor kwaliteitsborging toepast;
        - *bouwwerk:* bouwwerk als bedoeld in de [Omgevingswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
      [ref4]: https://wetten.overheid.nl/BWBR0037885
