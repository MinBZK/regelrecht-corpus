  - number: '1.4'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt, waar daarin in enigerlei bewoordingen sprake
      is van woongelegenheden, woningen, gebouwen of aanhorigheden die in eigendom zijn van toegelaten instellingen of
      met hen verbonden ondernemingen, onder die eigendom mede begrepen elke andere bevoegdheid tot het met betrekking
      tot woongelegenheden, woningen, gebouwen of aanhorigheden verrichten van de handelingen die volgens het burgerlijk
      recht tot de verantwoordelijkheid van een eigenaar behoren.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde zijn, waar daarin sprake is van het vereiste van
      of voorschriften omtrent financiële continuïteit van een toegelaten instelling, dat vereiste en die voorschriften
      tevens van toepassing op de afzonderlijke onderdelen van een toegelaten instelling, aan welke baten, lasten, activa
      en passiva beschikbaar zijn gesteld voor de uitvoering van de diensten van algemeen economisch belang welke aan
      haar zijn opgedragen, respectievelijk van haar overige werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1
  - number: '1.6'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde vallen het boekjaar en het verslagjaar in de zin van
      deze wet samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1
  - number: '1.7'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde is een schip dat wordt gebruikt voor verblijf en dat
      is bestemd en wordt gebruikt voor de vaart geen bouwwerk.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1
  - number: 1a.1
    text: |-
      De eigenaar van een bouwwerk, open erf of terrein of degene die uit anderen hoofde bevoegd is tot het daaraan
      treffen van voorzieningen draagt er zorg voor dat als gevolg van de staat van dat bouwwerk, open erf of terrein
      geen gevaar voor de gezondheid of veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1a
  - number: 1a.2
    text: |-
      Een ieder die een bouwwerk bouwt, gebruikt, laat gebruiken of sloopt, dan wel een open erf of terrein gebruikt of
      laat gebruiken, draagt er, voor zover dat in diens vermogen ligt, zorg voor dat als gevolg van dat bouwen, gebruik
      of slopen geen gevaar voor de gezondheid of veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1a
  - number: 1a.3
    text: |-
      De eigenaar van een bouwwerk of degene die uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen
      onderzoekt, of laat onderzoek uitvoeren naar, de staat van dat bouwwerk, voor zover dat bouwwerk behoort tot bij
      ministeriële regeling vast te stellen categorieën bouwwerken waarvan is vast komen te staan dat die een gevaar voor
      de gezondheid of de veiligheid kunnen opleveren. Bij ministeriële regeling worden voorschriften gegeven omtrent
      het onderzoek.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1a
  - number: 1b.1
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk
      toestaat, is het verboden een bouwwerk te bouwen, voor zover daarbij niet wordt
      voldaan aan de op dat bouwen van toepassing zijnde voorschriften, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel a, tweede lid, aanhef en onderdeel d, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.2
    text: |-
      Het is verboden een bestaand bouwwerk, open erf of terrein in een staat te brengen, te laten komen of te houden die
      niet voldoet aan de op de staat van dat bouwwerk, open erf of terrein van toepassing zijnde voorschriften, bedoeld
      in [artikel 2, eerste lid, aanhef en onderdeel b, tweede lid, aanhef en onderdeel a, en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.3
    text: |-
      Het is verboden een bouwwerk, open erf of terrein in gebruik te nemen, te gebruiken of te laten gebruiken, anders
      dan in overeenstemming met de op die ingebruikneming of dat gebruik van toepassing zijnde voorschriften, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel c, tweede lid, aanhef en onderdeel b, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 1b.4
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk toestaat, is het verboden een
      bouwwerk, dan wel deel daarvan, in stand te laten voor zover bij het bouwen daarvan niet is voldaan aan de op dat
      bouwen van toepassing zijnde voorschriften, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1b
  - number: 1b.5
    text: |-
      Het is verboden te slopen voor zover daarbij niet wordt voldaan aan de op dat slopen van toepassing zijnde
      voorschriften, bedoeld in [artikel 2, tweede lid, aanhef en onderdelen c en d, en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
