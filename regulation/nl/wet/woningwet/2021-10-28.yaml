    text: het slopen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel2
  - number: 2.2.d
    text: het uitvoeren van bouw- of sloopwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden omtrent de onderwerpen, bedoeld in het eerste lid, onderdeel
      c, en het tweede lid, onderdelen c en d, andere dan technische voorschriften gegeven. Tot de voorschriften
      omtrent het onderwerp, bedoeld in het eerste lid, onderdeel c, behoren in ieder geval: a. voorschriften
      inhoudende een verbod tot ingebruikneming of gebruik zonder het doen van een gebruiksmelding aan het bevoegd
      gezag; b. voorschriften inhoudende de bevoegdheid om bij de bouwverordening, bedoeld in [artikel 8][ref1],
      af te wijken van het aantal personen vanaf waar bij het bieden van nachtverblijf aan die personen krachtens
      [artikel 2.1, eerste lid, onder d, van de Wet algemene bepalingen omgevingsrecht][ref2] een vergunning voor het
      in gebruik nemen of gebruiken van een bouwwerk is vereist. Tot de voorschriften omtrent de onderwerpen, bedoeld
      in het tweede lid, onderdelen c en d, behoren in ieder geval: a. voorschriften inhoudende de verplichting om
      het voornemen te slopen aan het bevoegd gezag te melden; b. voorschriften inhoudende de verplichting te voldoen
      aan aanvullende voorschriften die door het bevoegd gezag bij beschikking kunnen worden gegeven met het oog op
      de lokale situatie. Tot de voorschriften omtrent de onderwerpen, bedoeld in het eerste lid, onderdeel c, en het
      tweede lid, onderdeel d, kunnen behoren voorschriften omtrent de beschikbaarheid van gegevens en bescheiden. Tot de
      voorschriften omtrent het onderwerp, bedoeld in het tweede lid, onderdeel d, kunnen daarnaast behoren voorschriften
      inhoudende de verplichting om de feitelijke aanvang van het uitvoeren van bouwwerkzaamheden, voor zover daarvoor
      een omgevingsvergunning is verleend, of sloopwerkzaamheden aan het bevoegd gezag te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '2.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen omtrent de onderwerpen, bedoeld in het eerste lid,
      onderdelen a en c, en het tweede lid, onderdelen a en b, andere dan technische voorschriften worden gegeven. Tot
      de voorschriften omtrent de onderwerpen, bedoeld in het eerste lid, onderdelen a en c, behoren in ieder geval
      voorschriften inhoudende een verbod bij of krachtens die algemene maatregel van bestuur aangewezen werkzaamheden
      uit te voeren of te laten uitvoeren zonder dat voor het uitvoeren van die werkzaamheden wordt beschikt over een
      conformiteitsverklaring als bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '2.5'
    text: |-
      Bij algemene maatregel van bestuur kan omtrent de onderwerpen, bedoeld in het tweede lid, onderdelen c en d, in
      afwijking van [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1], worden bepaald dat, indien bij
      het slopen asbest of een asbesthoudend product wordt verwijderd, een melding van het voornemen te slopen langs
      elektronische weg wordt gedaan dan wel gegevens en bescheiden die verband houden met de verwijdering van asbest
      of een asbesthoudend product, langs elektronische weg worden verstrekt. Bij of krachtens de maatregel kunnen
      hieromtrent nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '2.6'
    text: |-
      De voorschriften, bedoeld in het eerste, tweede, derde en vierde lid, kunnen uitsluitend worden gegeven vanuit het
      oogpunt van veiligheid, gezondheid, bruikbaarheid, energiezuinigheid of milieu.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel2
  - number: '2.7'
    text: |-
      De voordracht voor een krachtens het eerste, tweede, derde, vierde of vijfde lid vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2, eerste of tweede lid][ref1], kan
      worden verwezen naar:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 3.1.a
    text: normen of delen van normen en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel3
  - number: 3.1.b
    text: kwaliteitsverklaringen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel3
  - number: '3.2'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2, vierde lid][ref1], kunnen regels
      worden gesteld met betrekking tot de gevallen waarin Onze Minister conformiteitsbeoordelingsinstanties en
      conformiteitsbeoordelingsdocumenten kan aanwijzen ten behoeve van het afgeven van conformiteitsverklaringen waarmee
      kenbaar wordt gemaakt dat gedurende een bepaalde periode een gerechtvaardigd vertrouwen bestaat dat de hierin
      genoemde natuurlijk personen of rechtspersonen werkzaamheden uitvoeren volgens kwaliteitseisen die opgenomen zijn
      in door Onze Minister aangewezen conformiteitsbeoordelingsdocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '3.3'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is niet van toepassing op conformiteitsbeoordelingsinstanties als
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '4'
    text: |-
      Indien een bouwwerk gedeeltelijk wordt vernieuwd, veranderd of vergroot, zijn de voorschriften, bedoeld in
      [artikel 2][ref1], voor zover zij betrekking hebben op dat bouwen, slechts van toepassing op die vernieuwing,
      verandering of vergroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '5'
    text: |-
      Op de voordracht van Onze Minister wordt een algemene maatregel van bestuur als bedoeld in
      [artikel 2, eerste lid][ref1], in overeenstemming gebracht met technische voorschriften omtrent het bouwen van een
      bouwwerk, die zijn of worden gegeven bij of krachtens een andere algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '6.1'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2, eerste lid][ref1],
      kan worden bepaald dat van een daarbij gegeven voorschrift omtrent het bouwen van een bouwwerk
      bij een omgevingsvergunning voor het bouwen van een bouwwerk kan worden afgeweken tot een bij dat
      voorschrift aangegeven niveau of, indien sprake is van het geheel of gedeeltelijk vernieuwen of
      veranderen of het vergroten van een bouwwerk dat tevens kan worden aangemerkt als een activiteit
      met betrekking tot een monument als bedoeld in [artikel 2.1, eerste lid, onder f][ref2], dan wel
      [artikel 2.2, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref3], in het belang van de
      monumentenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '6.2'
    text: |-
      Het bevoegd gezag kan van een bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 2, tweede of derde lid][ref1], gegeven voorschrift omtrent het slopen of het uitvoeren van bouw- of
      sloopwerkzaamheden ontheffing verlenen, voor zover dat bij of krachtens die algemene maatregel van bestuur is
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.1'
    text: |-
      Onze Minister kan op verzoek van een aanvrager om een omgevingsvergunning voor het bouwen van een bouwwerk in
      bijzondere gevallen ontheffing verlenen van de bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 2, eerste lid][ref1], gegeven voorschriften omtrent bouwen, met dien verstande dat, indien het verzoek
      betrekking heeft op voorschriften als bedoeld in [artikel 5][ref2], hij de ontheffing slechts kan verlenen in
      overeenstemming met het bij of krachtens de desbetreffende wet daartoe bevoegd verklaarde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, gaat vergezeld van een verklaring van het bevoegd gezag, dat het de
      desbetreffende omgevingsvergunning zal verlenen indien ontheffing als bedoeld in dat lid, is verkregen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
  - number: '7.3'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid, mogen slechts voorwaarden worden verbonden ter bescherming van de
      belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
  - number: '7.4'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking van de beslissing op een verzoek als bedoeld in het
      eerste lid, doet Onze Minister daarvan mededeling aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
  - number: '7.5'
    text: |-
      De verlening van de verklaring, bedoeld in het tweede lid, en de verlening van ontheffing, bedoeld in het eerste
      lid, worden geacht voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1]
      deel uit te maken van de beschikking waarop zij betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '7.6'
    text: |-
      In een geval als bedoeld in het eerste lid, dat betrekking heeft op een tunnel in het trans-Europese wegennet die
      langer is dan 500 meter kan Onze Minister de in het eerste lid bedoelde ontheffing slechts verlenen indien dat
      noodzakelijk is voor het toepassen van innovatieve veiligheidsvoorzieningen of innovatieve veiligheidsprocedures,
      en de in artikel 14 van [richtlijn nr. 2004/54/EG](32004L0054) van het Europees parlement en de Raad van de
      Europese Unie van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in het trans-Europese wegennet (PbEU
      L 167, gerectificeerd in PbEU L 201) voorgeschreven procedure is doorlopen en op grond daarvan van rechtswege
      toestemming is verkregen of door de Europese Commissie toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
  - number: '7.7'
    text: |-
      In een geval als bedoeld in het zesde lid verzoekt de tunnelbeheerder, bedoeld in de
      [Wet aanvullende regels veiligheid wegtunnels][ref1], aan Onze Minister om de ontheffing als bedoeld in het eerste
      lid niet te verlenen dan nadat het voornemen daartoe aan de Europese Commissie is voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019516
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019516
  - number: '7.8'
    text: |-
      Het eerste, derde, vierde, zesde en zevende lid zijn van overeenkomstige toepassing indien voor het bouwen op
      grond van [artikel 2.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] geen omgevingsvergunning
      is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7a.1
    text: |-
      Onze Minister kan met het oog op duurzaam bouwen in een bijzonder geval het bevoegd gezag toestaan door hem
      voorgestelde nadere voorschriften op te leggen ter voldoening aan de technische voorschriften omtrent bouwen,
      gegeven bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2, eerste lid][ref1].
      Dit toestaan kan ook betrekking hebben op door het bevoegd gezag voorgestelde, uit het oogpunt van milieu op
      te leggen technische voorschriften omtrent bouwen, waarin een algemene maatregel van bestuur als bedoeld in
      [artikel 2, eerste lid][ref2], niet voorziet. Een verzoek van het bevoegd gezag geschiedt mede aan de hand van een
      door Onze Minister ter beschikking gesteld formulier. Het verzoek, alsmede de daarbij voorgestelde op te leggen
      voorschriften zijn gemotiveerd en van een toelichting voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 7a.2
    text: |-
      Onze Minister beslist binnen acht weken na ontvangst van een verzoek om toestemming. Hij kan die beslissing eenmaal
      voor ten hoogste vier weken verdagen. Indien toestemming wordt verleend, geldt die toestemming alleen voor het
      geval waarop het verzoek betrekking heeft. Aan een toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7a
  - number: 7a.3
    text: 'De toestemming op een verzoek van het bevoegd gezag is van rechtswege verleend indien Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7a
  - number: 7a.3.a
    text: niet binnen acht weken na ontvangst van het verzoek een beslissing op dat verzoek heeft genomen,
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7a
  - number: 7a.3.b
    text: niet binnen acht weken na ontvangst van het verzoek heeft besloten de beslissing op dat verzoek te verdagen, of
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7a
  - number: 7a.3.c
    text: |-
      niet binnen de termijn waarmee de beslissing op het verzoek is verdaagd, een beslissing op dat verzoek heeft
      genomen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7a
  - number: 7b.1
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk toestaat, is het verboden een
      bouwwerk te bouwen, voor zover daarbij niet wordt voldaan aan de op dat bouwen van toepassing zijnde voorschriften,
      bedoeld in [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.2
    text: |-
      Het verbod, bedoeld in het eerste lid, heeft mede betrekking op het niet voldoen aan de voorschriften met
      betrekking tot het bouwen, van een bouwwerk, bedoeld in:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7b
  - number: 7b.2.a
    text: |-
      [artikel 8, zesde lid][ref1], voor zover deze voorschriften in de bouwverordening zijn opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.2.b
    text: |-
      [artikel 8, zevende lid][ref1], indien en voor zover deze voorschriften op grond van het achtste lid van dat
      artikel rechtstreeks gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 7b.3
    text: |-
      Tenzij een omgevingsvergunning voor het bouwen van een bouwwerk het uitdrukkelijk toestaat, is het verboden een
      bouwwerk dan wel deel daarvan in stand te laten voor zover bij het bouwen daarvan niet is voldaan aan de op dat
      bouwen van toepassing zijnde voorschriften, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel7b
  - number: '8.1'
    text: |-
      De gemeenteraad stelt een bouwverordening vast, die uitsluitend de voorschriften, bedoeld in het tweede tot en met
      zesde lid, bevat.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: '8.2'
    text: |-
      De bouwverordening bevat voorschriften omtrent het tegengaan van het bouwen van een bouwwerk op verontreinigde
      bodem.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: '8.3'
    text: 'De voorschriften, bedoeld in het tweede lid, hebben uitsluitend betrekking op bouwwerken:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: 8.3.a
    text: waarin voortdurend of nagenoeg voortdurend mensen zullen verblijven,
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: 8.3.b
    text: |-
      voor het bouwen waarvan een omgevingsvergunning is vereist, met uitzondering van
      bouwwerken die naar aard en omvang gelijk zijn aan een bouwwerk waarvoor op grond van
      [artikel 2.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] een dergelijke vergunning niet is
      vereist, en


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 8.3.c.1°
    text: die de grond raken, of
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: 8.3.c.2°
    text: ten aanzien waarvan het bestaande, niet-wederrechtelijke gebruik niet wordt gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: '8.4'
    text: 'De voorschriften, bedoeld in het tweede lid, hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: 8.4.a
    text: het verrichten van onderzoek naar aard en mate van verontreiniging van de bodem;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: 8.4.b
    text: aard en omvang van het onderzoek, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: 8.4.c
    text: inrichting van het op te stellen onderzoeksrapport.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: '8.5'
    text: |-
      De bouwverordening bevat tevens voorschriften omtrent de samenstelling, inrichting en werkwijze van de
      welstandscommissie. Zij kan bepalen dat er in plaats van een welstandscommissie een stadsbouwmeester
      wordt aangesteld, in welk geval de bouwverordening voorschriften bevat over de rol en de functie van de
      stadsbouwmeester. Voorts kan de bouwverordening nadere voorschriften bevatten omtrent de verslagen, bedoeld in
      [artikel 12b, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12b
        hoofdstuk: II
        afdeling: '3'
  - number: '8.6'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in de bouwverordening voorschriften worden gegeven
      omtrent andere onderwerpen dan die, genoemd in het tweede en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: '8.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bevordering van eenheid in de bouwverordeningen regelen worden
      gegeven omtrent de inhoud van de voorschriften, bedoeld in het tweede tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
  - number: '8.8'
    text: |-
      De gemeenteraad brengt binnen een jaar na het in werking treden van de krachtens het zevende lid en de krachtens
      [artikel 120][ref1] gegeven voorschriften de bouwverordening met die voorschriften in overeenstemming. Zolang de
      bouwverordening niet met die voorschriften in overeenstemming is gebracht, gelden die voorschriften rechtstreeks.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: '11.1'
    text: |-
      Bij een in de bouwverordening gegeven voorschrift kan worden bepaald, dat daarvan kan worden afgeweken bij een
      omgevingsvergunning voor het bouwen van een bouwwerk.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel11
  - number: '11.2'
    text: |-
      Van een voorschrift dat overeenkomstig [artikel 8, achtste lid][ref1], in de bouwverordening is opgenomen kan
      slechts worden afgeweken voor zover dat is toegestaan op grond van een algemene maatregel van bestuur krachtens
      artikel 8, zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '12.1'
    text: 'Het uiterlijk van:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12
  - number: 12.1.a
    text: |-
      een bestaand bouwwerk, met uitzondering van een bouwwerk, niet zijnde een seizoensgebonden bouwwerk, waarvoor in de
      omgevingsvergunning voor het bouwen van dat bouwwerk is bepaald dat dit slechts voor een bepaalde periode in stand
      mag worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12
  - number: 12.1.b
    text: |-
      een te bouwen bouwwerk voor het bouwen waarvan op grond van
      [artikel 2.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] geen omgevingsvergunning is vereist,


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '12.2'
    text: |-
      De gemeenteraad kan besluiten dat, in afwijking van het eerste lid en
      [artikel 2.10, eerste lid, onder d, van de Wet algemene bepalingen omgevingsrecht][ref1], voor een daarbij aan
      te wijzen gebied of voor een of meer daarbij aan te wijzen categorieën van bestaande en te bouwen bouwwerken geen
      redelijke eisen van welstand van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '12.3'
    text: |-
      Voor zover de toepassing van de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], leidt tot strijd
      met het bestemmingsplan, blijven die criteria buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '12.4'
    text: |-
      De gemeenteraad betrekt de ingezetenen van de gemeente en belanghebbenden bij de voorbereiding van besluiten
      krachtens het tweede lid op de wijze voorzien in de krachtens [artikel 150 van de Gemeentewet][ref1] vastgestelde
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: 12a.1
    text: |-
      De gemeenteraad stelt een welstandsnota vast, inhoudende beleidsregels waarin in ieder geval de criteria zijn
      opgenomen die het bevoegd gezag toepast bij de beoordeling:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.1.a
    text: |-
      of het uiterlijk en de plaatsing van een bouwwerk waarop de aanvraag om een omgevingsvergunning voor het bouwen
      van een bouwwerk betrekking heeft, zowel op zichzelf beschouwd, als in verband met de omgeving of de te verwachten
      ontwikkeling daarvan, in strijd zijn met redelijke eisen van welstand;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.1.b
    text: of het uiterlijk van een bestaand bouwwerk in ernstige mate in strijd is met redelijke eisen van welstand.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.2
    text: |-
      [Artikel 12, vierde lid][ref1], is van overeenkomstige toepassing op de vaststelling of wijziging van de
      welstandsnota.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12a.3
    text: 'De criteria, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.3.a
    text: |-
      hebben geen betrekking op bouwwerken, waarvoor in de omgevingsvergunning voor het bouwen van die bouwwerken
      wordt bepaald dat deze slechts voor een bepaalde periode in stand mogen worden gehouden, met uitzondering van
      seizoensgebonden bouwwerken;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.3.b
    text: zijn zoveel mogelijk toegesneden op de onderscheiden categorieën bouwwerken;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.3.c
    text: kunnen verschillen naargelang de plaats waar een bouwwerk is gelegen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.4
    text: |-
      Ter bevordering van de eenheid in welstandsnota's kunnen bij algemene maatregel van bestuur voorschriften worden
      gegeven omtrent categorieën van bouwwerken als bedoeld in het derde lid en de daarop toe te passen criteria.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12a.5
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het vierde lid treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12a
  - number: 12b.1
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester baseert haar onderscheidenlijk zijn advies slechts op de
      criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], doch betrekt daarbij, indien van toepassing, het
      bepaalde in [artikel 12, derde lid][ref2]. De adviezen van de welstandscommissie dan wel de stadsbouwmeester zijn
      openbaar. Een advies van de welstandscommissie dan wel de stadsbouwmeester inhoudende dat een bouwplan in strijd is
      met redelijke eisen van welstand, wordt schriftelijk uitgebracht en deugdelijk gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.2
    text: |-
      De door de welstandscommissie of stadsbouwmeester gehouden vergaderingen zijn openbaar.
      Een vergadering of gedeelte daarvan is niet openbaar in gevallen als bedoeld in
      [artikel 10, eerste lid, van de Wet openbaarheid van bestuur][ref1] en in gevallen waarin het belang van
      openbaarheid niet opweegt tegen de in [artikel 10, tweede lid, van die wet][ref2] genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 12b.3
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester legt de gemeenteraad eenmaal per jaar een verslag
      voor van de door haar onderscheidenlijk hem verrichte werkzaamheden. In het verslag wordt ten minste
      uiteengezet op welke wijze zij onderscheidenlijk hij toepassing heeft gegeven aan de criteria, bedoeld in
      [artikel 12a, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.4
    text: |-
      Een voorzitter of ander lid van een welstandscommissie kan voor een termijn van ten hoogste drie jaar worden
      benoemd in een welstandscommissie die in de betreffende gemeente werkzaam is. Zij kunnen eenmaal voor een
      termijn van ten hoogste drie jaar worden herbenoemd in dezelfde commissie. De eerste en tweede volzin zijn van
      overeenkomstige toepassing op de stadsbouwmeester.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12b
  - number: 12c
    text: |-
      Burgemeester en wethouders leggen de gemeenteraad eenmaal per jaar een verslag voor waarin zij ten minste
      uiteenzetten:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12c
  - number: 12c.a
    text: op welke wijze zij zijn omgegaan met de adviezen van de welstandscommissie dan wel de stadsbouwmeester;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12c
  - number: 12c.b
    text: |-
      in welke gevallen waarin niet is of wordt voldaan aan [artikel 12, eerste lid][ref1], zij zijn overgegaan tot
      oplegging van een last onder bestuursdwang of oplegging van een last onder dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12d.1
    text: |-
      Het bevoegd gezag kan, indien een vereniging van eigenaars ten behoeve van een bij haar in beheer zijnd gebouw niet
      beschikt over een onderhoudsplan en dat gebouw is gelegen in een gebied waarin de leefbaarheid naar het oordeel van
      het bevoegd gezag onder druk staat, die vereniging van eigenaars verplichten tot het binnen een door het bevoegd
      gezag te bepalen termijn laten opstellen van een onderhoudsplan door een deskundig persoon of een deskundige
      instantie en tot het van kracht laten blijven van dat plan gedurende zijn looptijd. Voor zover die looptijd langer
      is dan vijf jaar, omvat de in de vorige volzin bedoelde verplichting mede de verplichting het onderhoudsplan elke
      vijf jaar door een deskundig persoon of een deskundige instantie te laten herzien.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
  - number: 12d.2
    text: |-
      Het bevoegd gezag legt een verplichting als bedoeld in het eerste lid niet op dan nadat met toepassing van
      [artikel 127a van Boek 5 van het Burgerlijk Wetboek][ref1] een vergadering van eigenaars is bijeengeroepen
      en de vereniging van eigenaars niet binnen drie maanden nadat die vergadering heeft plaatsgevonden over een
      onderhoudsplan beschikt. De eerste volzin is niet van toepassing, indien redelijkerwijs voorzienbaar is dat het
      bijeenroepen van de vergadering van eigenaars, bedoeld in die zin, dan wel het in acht nemen van de termijn van
      drie maanden, bedoeld in die zin, er niet toe zal leiden dat de vereniging van eigenaars uit eigen beweging een
      onderhoudsplan opstelt of laat opstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel127a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: 127a
  - number: 12d.3
    text: 'Het onderhoudsplan, bedoeld in het eerste lid, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
  - number: 12d.3.a
    text: |-
      de onderhouds- en herstelwerkzaamheden aan en de vernieuwingen van die gedeelten van het gebouw waarover de
      vereniging van eigenaars het beheer voert over een periode van vijf jaar;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
  - number: 12d.3.b
    text: |-
      een schatting van de aan de werkzaamheden en de vernieuwingen, bedoeld in onderdeel a, verbonden kosten en een
      gelijkmatige toerekening van die kosten aan de onderscheiden jaren;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
  - number: 12d.3.c
    text: |-
      een schatting van de benodigde jaarlijkse reservering voor andere dan de gewone jaarlijkse kosten na de periode
      waarop het onderhoudsplan betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
  - number: 12d.4
    text: |-
      De vereniging van eigenaars zendt binnen vier weken na het opstellen van het onderhoudsplan, bedoeld in het eerste
      lid, een afschrift van het plan aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
  - number: 12d.5
    text: |-
      Indien een machtiging tot het bijeenroepen van een vergadering van eigenaars als bedoeld in
      [artikel 127a, eerste lid, aanhef, van Boek 5 van het Burgerlijk Wetboek][ref1] wordt afgegeven binnen vijf jaar
      nadat een eerdere machtiging is afgegeven, kan het bevoegd gezag de betrokken vereniging van eigenaars verplichten
      tot het uitbesteden van het beheer aan een professionele beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel127a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: 127a
  - number: '13'
    text: |-
      Het bevoegd gezag kan degene die als eigenaar van een gebouw of een bouwwerk, niet zijnde een gebouw, dan
      wel uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen, verplichten tot het binnen een
      door het bevoegd gezag te bepalen termijn treffen van voorzieningen waardoor de staat van dat gebouw of dat
      bouwwerk komt te liggen op een niveau dat hoger is dan het niveau dat overeenkomt met de voorschriften, bedoeld
      in [artikel 1b, tweede lid][ref1], zonder dat dit hoger komt te liggen dan het niveau dat overeenkomt met de
      voorschriften, bedoeld in artikel 1b, eerste lid, mits die voorzieningen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
  - number: 13.a
    text: |-
      onderdeel zijn van een onderhoudsplan voor een gebouw als bedoeld in [artikel 12d, eerste lid][ref1], en niet
      binnen de daarvoor in het onderhoudsplan gestelde termijn zijn uitgevoerd, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
  - number: 13.b
    text: naar het oordeel van het bevoegd gezag anderszins noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13
  - number: 13a
    text: |-
      Indien niet wordt voldaan aan [artikel 12, eerste lid][ref1], kan het bevoegd gezag, tenzij toepassing is gegeven
      aan het tweede lid van dat artikel, degene die als eigenaar van een bouwwerk dan wel uit anderen hoofde bevoegd is
      tot het treffen van voorzieningen daaraan, verplichten tot het binnen een door hem te bepalen termijn treffen van
      zodanige door hem daarbij aan te geven voorzieningen, dat nadien wordt voldaan aan [artikel 12, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 13b.1
    text: |-
      Onder beheer wordt in dit artikel verstaan het aan derden in gebruik geven van een gebouw, open erf of terrein, het
      innen van de huurpenningen namens de eigenaar of degene die tot ingebruikgeving bevoegd was alsmede het verrichten
      van alle handelingen met betrekking tot dat gebouw, open erf of terrein die volgens het burgerlijk recht tot de
      rechten en plichten van een eigenaar behoren met uitzondering van vervreemden en bezwaren.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.2
    text: |-
      Het bevoegd gezag kan degene die als eigenaar of uit anderen hoofde bevoegd is tot het in gebruik geven van een
      gebouw, open erf of terrein, verplichten om het gebouw, open erf of terrein in beheer te geven aan het bevoegd
      gezag, aan een persoon die uit hoofde van beroep of bedrijf op het terrein van de huisvesting werkzaam is, of
      aan een op dat terrein werkzame instelling, dan wel in gebruik te geven aan een andere persoon dan degene die als
      gevolg van een sluiting als bedoeld in onderdeel b het gebruik van het gebouw, open erf of terrein heeft moeten
      staken, indien:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.2.a
    text: |-
      ter zake van een overtreding van [artikel 1a][ref1] of [artikel 1b][ref2] die naar het oordeel van het bevoegd
      gezag gepaard gaat met een bedreiging van de leefbaarheid of een gevaar voor de gezondheid of de veiligheid, een
      opgelegde last onder dwangsom niet heeft geleid tot het ongedaan maken of beëindigen van die overtreding, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
  - number: 13b.2.b
    text: |-
      het gebouw, open erf of terrein op grond van [artikel 17][ref1], dan wel het gebouw op grond van
      [artikel 174a van de Gemeentewet][ref2], een verordening als bedoeld in [artikel 174 van die wet][ref3] of
      [artikel 13b van de Opiumwet][ref4] is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 174a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '174'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: 13b
  - number: 13b.3
    text: |-
      Het bevoegd gezag kan voorwaarden stellen aan de uitvoering van de verplichting een gebouw, open erf of terrein in
      beheer of gebruik te geven, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.4
    text: |-
      Indien het gebouw, open erf of terrein noodzakelijke voorzieningen of aanpassingen behoeft om weer op redelijke
      wijze tot bewoning of gebruik te kunnen dienen, kan het bevoegd gezag besluiten, al dan niet gelijktijdig met
      het besluit, bedoeld in het tweede lid, dat degene aan wie het beheer is gegeven binnen een bepaalde termijn die
      voorzieningen of aanpassingen uitvoert. De uitvoering van deze voorzieningen of aanpassingen geschiedt op kosten
      van degene tot wie het in het tweede lid bedoelde besluit is gericht.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.5
    text: |-
      Het is degene tot wie een besluit als bedoeld in het tweede lid is gericht, verboden gedurende de termijn waarvoor
      een gebouw, open erf of terrein in beheer is gegeven beheershandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.6
    text: |-
      Degene aan wie het beheer is gegeven, stelt na overleg met degene tot wie het in het tweede lid bedoelde besluit
      is gericht, de huurprijs vast op een bedrag dat redelijk is in het economische verkeer en voldoet aan de voor de
      betreffende huurprijs geldende wettelijke regels.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.7
    text: |-
      Indien degene ten aanzien van wie een beheermaatregel als bedoeld in het tweede lid van kracht is,
      [artikel 1a][ref1] of [1b][ref2] overtreedt ten aanzien van een ander gebouw, open erf of terrein dan waarvoor de
      maatregel is opgelegd, en die overtreding gaat naar het oordeel van het bevoegd gezag gepaard met een bedreiging
      van de leefbaarheid of een gevaar voor de gezondheid of de veiligheid, kan het bevoegd gezag diegene ten aanzien
      van dat andere gebouw, open erf of terrein een beheermaatregel als bedoeld in het tweede lid opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
  - number: 13b.8
    text: Het bevoegd gezag beëindigt het beheer
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.8.a
    text: |-
      zodra de overtreding van [artikel 1a][ref1] of [artikel 1b][ref2] en de bedreiging van de leefbaarheid of het
      gevaar voor de gezondheid of veiligheid naar zijn oordeel zijn beëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
  - number: 13b.8.b
    text: |-
      indien van toepassing, de noodzakelijke voorzieningen of aanpassingen, bedoeld in het vierde lid, zijn getroffen,
      en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
  - number: 13b.8.c
    text: |-
      de beheervergoeding, bedoeld in [artikel 14, tweede lid][ref1], en de verschuldigde kosten voor het treffen van de
      voorzieningen of aanpassingen, bedoeld in het vierde lid, zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Indien een gebouw, open erf of terrein in beheer is gegeven als bedoeld in [artikel 13b, tweede lid][ref1], stelt
      het bevoegd gezag een beheervergoeding vast die degene tot wie het in artikel 13b, tweede lid bedoelde besluit is
      gericht, is verschuldigd aan het bevoegd gezag ten behoeve van het beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.2'
    text: De beheervergoeding bestaat uit een kostendekkende vergoeding voor de uitvoering van het beheer.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel14
  - number: '14.3'
    text: |-
      Degene tot wie het in [artikel 13b, tweede lid][ref1] bedoelde besluit is gericht, betaalt de beheervergoeding en
      de verschuldigde kosten voor het treffen van de voorzieningen of aanpassingen, bedoeld in artikel 13b, vierde lid,
      aan de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.4'
    text: |-
      Het bevoegd gezag kan de beheervergoeding en de verschuldigde kosten van de voorzieningen of aanpassingen, bedoeld
      in [artikel 13b, vierde lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.5'
    text: |-
      Het bevoegd gezag kan de door de beheerder geïnde huurpenningen verrekenen met de beheervergoeding en de
      verschuldigde kosten van de voorzieningen of aanpassingen, bedoeld in [artikel 13b, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '14.6'
    text: |-
      De beheerder draagt de door hem geïnde huurpenningen slechts af aan degene tot wie het in
      [artikel 13b, tweede lid][ref1] bedoelde besluit is gericht, voor zover geen geldschulden, bedoeld in het derde
      lid, open staan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: 14a
    text: |-
      Degene, tot wie een besluit als bedoeld in [artikel 12d][ref1], [13][ref2], [13a][ref3] of [13b, tweede lid][ref4],
      is gericht, of zijn rechtsopvolger en iedere verdere rechtsopvolger, is verplicht daaraan te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Het bevoegd gezag kan gelijktijdig met een besluit als bedoeld in [artikel 12d][ref1], [13][ref2], [13a][ref3] of
      [13b, tweede lid][ref4], besluiten tot oplegging van een last onder bestuursdwang of oplegging van een last onder
      dwangsom, gericht op naleving van het eerstgenoemde besluit. In dat geval worden beide besluiten gelijktijdig
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '15.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid maakt het besluit tot oplegging van een last onder bestuursdwang
      of oplegging van een last onder dwangsom, wat betreft de mogelijkheid van bezwaar en beroep, deel uit van het in
      [artikel 12d][ref1], [13][ref2], [13a][ref3] of [13b, tweede lid][ref4], bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12d
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
  - number: '17.1'
    text: |-
      Indien herhaaldelijke overtreding van [artikel 1a][ref1] of [artikel 1b][ref2] naar het oordeel van het bevoegd
      gezag gepaard gaat met een bedreiging van de leefbaarheid of een gevaar voor de gezondheid of de veiligheid, kan
      het bevoegd gezag besluiten dat gebouw, open erf of terrein te sluiten. Het bevoegd gezag kan van de overtreder de
      ingevolge [artikel 5:25 van de Algemene wet bestuursrecht][ref3] verschuldigde kosten invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 1b
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '17.2'
    text: Het bevoegd gezag bepaalt in het besluit, bedoeld in het eerste lid, de duur van de sluiting.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel17
  - number: '18'
    text: |-
      Indien het bevoegd gezag een besluit als bedoeld in [artikel 13][ref1], [13a][ref2],
      [13b, tweede lid][ref3], of [17][ref4] heeft genomen en, nadat dat besluit is genomen, een ander
      bestuursorgaan ten aanzien van het betrokken bouwwerk, open erf of terrein het bevoegd gezag wordt, is
      [artikel 5.2, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref5] op een zodanig besluit van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 13a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 13b
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '17'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '5'
  - number: 18a.1
    text: |-
      Een wooncoöperatie is een vereniging met volledige rechtsbevoegdheid die zich ten doel stelt om haar leden in
      staat te stellen zelfstandig te voorzien in het beheer en onderhoud van de door hen bewoonde woongelegenheden en
      de direct daaraan grenzende omgeving. Indien die woongelegenheden zijn gesplitst in appartementsrechten in de zin
      van [artikel 106 van Boek 5 van het Burgerlijk Wetboek][ref1], betreft dat beheer en onderhoud uitsluitend die
      gedeelten van die woongelegenheden, welke zijn bestemd om door de leden van de wooncoöperatie als afzonderlijk
      geheel te worden gebruikt, onverminderd een regeling als bedoeld in [artikel 112 lid 4 van dat boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel112
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '106'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '112'
  - number: 18a.2
    text: |-
      Eigenaren of huurders van ten minste vijf in elkaars nabijheid gelegen woongelegenheden die financieel,
      administratief, bouwtechnisch, stedenbouwkundig of anderszins een eenheid vormen, kunnen een wooncoöperatie
      oprichten.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel18a
  - number: 18a.3
    text: Een wooncoöperatie treft een regeling voor de behandeling van klachten en geschillen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel18a
  - number: 18a.4
    text: Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent wooncoöperaties.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel18a
  - number: '19.1'
    text: |-
      Onze Minister kan verenigingen met volledige rechtsbevoegdheid en stichtingen die zich ten doel stellen uitsluitend
      op het gebied van de volkshuisvesting werkzaam te zijn en beogen hun financiële middelen uitsluitend in het belang
      van de volkshuisvesting in te zetten, toelaten als instellingen, uitsluitend in het belang van de volkshuisvesting
      werkzaam. In het daartoe strekkende verzoek vermeldt de vereniging of de stichting in elk geval de gronden voor dat
      verzoek, de gemeente waar zij voornemens is woonplaats te houden en de gemeenten waar zij voornemens is feitelijk
      werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: '19.2'
    text: |-
      Voordat Onze Minister op het verzoek, bedoeld in het eerste lid, beslist, stelt hij de colleges van burgemeester
      en wethouders van de in dat lid bedoelde gemeenten, en de in het belang van de huurders van de woongelegenheden
      van de betrokken vereniging of stichting werkzame huurdersorganisaties en bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1] in de
      gelegenheid hun zienswijzen daarop aan hem kenbaar te maken. Die colleges, organisaties en commissies kunnen binnen
      vier weken nadien hun zienswijzen aan hem doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: '19.3'
    text: 'Onze Minister kan de toelating weigeren, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: 19.3.a
    text: de vereniging of de stichting niet voldoet aan het bepaalde bij of krachtens het eerste lid;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: 19.3.b
    text: |-
      de vereniging of de stichting naar zijn oordeel niet voldoende financieel draagkrachtig is of haar financiële
      continuïteit niet voldoende is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: 19.3.c
    text: sprake is van gebreken in de akte van oprichting van de vereniging of de stichting;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: 19.3.d
    text: |-
      personen die ingevolge het bepaalde bij of krachtens
      [artikel 25, tweede lid, vierde volzin, of zesde of zevende lid][ref1], of
      [30, derde lid, vierde volzin, of zesde of zevende lid][ref2], geen lid zouden moeten respectievelijk kunnen zijn
      van het bestuur respectievelijk de raad van commissarissen van een toegelaten instelling aan de statuten van de
      vereniging of de stichting het recht kunnen ontlenen om personen in dat bestuur of die raad te benoemen of personen
      voor een zodanige benoeming voor te dragen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: 19.3.e
    text: |-
      aan de statuten van de vereniging of de stichting het recht kan worden ontleend tot het verkrijgen van de eigendom
      van de onroerende zaken of hun onroerende en infrastructurele aanhorigheden van de vereniging of de stichting op
      een wijze die met het bepaalde bij en krachtens deze wet in strijd is of
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: 19.3.f
    text: die toelating naar zijn oordeel anderszins niet in het belang van de volkshuisvesting is te achten.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: '19.4'
    text: 'Onze Minister kan de toelating intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: 19.4.a
    text: |-
      de toegelaten instelling niet langer uitsluitend op het gebied van de volkshuisvesting werkzaam is of haar
      financiële middelen niet uitsluitend in het belang van de volkshuisvesting inzet, of
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: 19.4.b
    text: |-
      de toegelaten instelling naar zijn oordeel het belang van de volkshuisvesting zodanige schade berokkent of bij
      handhaving van de toelating op korte termijn zal berokkenen, dat haar toelating niet langer in dat belang is te
      achten.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: '19.5'
    text: Van een besluit tot toelating of tot intrekking van de toelating wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: '19.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het verzoek, bedoeld
      in het eerste lid, te verstrekken gegevens en de behandeling van dat verzoek.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel19
  - number: '20.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State geeft bij de behandeling van een beroep
      tegen een besluit tot intrekking van de toelating aanvankelijk overeenkomstige toepassing aan
      [artikel 8:52 van de Algemene wet bestuursrecht][ref1] en kan nadien overeenkomstige toepassing geven aan
      [artikel 8:53 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '20.2'
    text: |-
      Nadat een besluit tot intrekking van de toelating onherroepelijk is geworden, wordt de toegelaten instelling op
      verzoek van Onze Minister ontbonden door de rechtbank in het arrondissement waarin zij gevestigd is.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
  - number: '20.3'
    text: |-
      De werking van een besluit tot intrekking van de toelating wordt opgeschort totdat de uitspraak tot ontbinding in
      kracht van gewijsde gaat.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
  - number: '20.4'
    text: 'De toelating eindigt:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
  - number: 20.4.a
    text: door inwerkingtreding van een besluit tot intrekking daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
  - number: 20.4.b
    text: |-
      door het in kracht van gewijsde gaan van een uitspraak tot ontbinding van de toegelaten instelling in andere
      bij de wet bepaalde gevallen dan dat, bedoeld in het tweede lid, of van een beschikking als bedoeld in
      [artikel 19a lid 2 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel19a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 19a
  - number: 20.4.c
    text: |-
      door de ontbinding van de toegelaten instelling in andere bij de wet bepaalde gevallen dan die, bedoeld in de
      onderdelen a en b, of
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
  - number: 20.4.d
    text: |-
      op het tijdstip waarop de toegelaten instelling ophoudt te bestaan als gevolg van een zuivere splitsing als bedoeld
      in [artikel 334a lid 2 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '20.5'
    text: |-
      Na ontbinding van een toegelaten instelling treedt Onze Minister of een door hem daartoe aangewezen persoon of
      instantie op als vereffenaar van haar vermogen. De vereffening leidt ertoe dat dat vermogen uitsluitend bestemd
      blijft voor het behartigen van het belang van de volkshuisvesting. Bij algemene maatregel van bestuur worden nadere
      voorschriften omtrent de vereffening gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel20
  - number: '21.1'
    text: 'De toegelaten instelling verbindt zich:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: 21.1.a
    text: |-
      uitsluitend met een naamloze vennootschap als bedoeld in [artikel 64 van Boek 2 van het Burgerlijk Wetboek][ref1],
      indien de statuten van die naamloze vennootschap uitsluitend aandelen op naam kennen, een blokkeringsregeling
      bevatten en niet toelaten dat met medewerking van de vennootschap certificaten aan toonder worden uitgegeven, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel64
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '64'
  - number: 21.1.b
    text: |-
      uitsluitend met een besloten vennootschap met beperkte aansprakelijkheid als bedoeld in
      [artikel 175 van Boek 2 van het Burgerlijk Wetboek][ref1], indien de statuten van die besloten vennootschap een
      blokkeringsregeling bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel175
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '175'
  - number: '21.2'
    text: |-
      De toegelaten instelling verbindt zich niet met een rechtspersoon of vennootschap dan nadat Onze Minister dat op
      een daartoe strekkend verzoek van de toegelaten instelling heeft goedgekeurd. Onze Minister onthoudt in elk geval
      zijn goedkeuring, indien:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: 21.2.a
    text: |-
      naar zijn oordeel de toegelaten instelling of rechtspersoon of vennootschap niet voldoet of zal voldoen aan het
      bepaalde bij en krachtens dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: 21.2.b
    text: |-
      indien het verzoek niet inhoudt dat toepassing wordt gegeven aan [artikel 50a, eerste lid][ref1]:
      de in het belang van de huurders van haar woongelegenheden werkzame huurdersorganisaties, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet op het overleg huurders verhuurder][ref2], de toegelaten instelling
      niet hebben medegedeeld of zij met de verbinding instemmen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 21.2.c
    text: |-
      de statuten van de rechtspersoon of de akte van de vennootschap met welke de toegelaten instelling voornemens is
      zich te verbinden niet voldoen aan [artikel 23][ref1] of aan de bij algemene maatregel van bestuur daaromtrent
      gegeven voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel23
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '2'
  - number: 21.2.d
    text: |-
      overeenkomstig bij of krachtens algemene maatregel van bestuur daaromtrent te geven voorschriften de financiële
      continuïteit van de toegelaten instelling of die rechtspersoon of vennootschap niet voldoende is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: 21.2.e
    text: |-
      de toegelaten instelling voornemens is die rechtspersoon of vennootschap anderszins vermogen te verschaffen dan
      door middel van het storten van aandelenkapitaal of het verstrekken van een lening overeenkomstig bij of krachtens
      algemene maatregel van bestuur daaromtrent te geven voorschriften of
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: 21.2.f
    text: |-
      de toegelaten instelling voornemens is zich in enigerlei opzicht garant te stellen voor die rechtspersoon of
      vennootschap.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: '21.3'
    text: |-
      De goedkeuring, bedoeld in het tweede lid, is niet vereist voor een verbinding van een toegelaten instelling met
      een samenwerkingsvennootschap.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: '21.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het tweede lid, te verstrekken gegevens, de wijze waarop de toegelaten instelling degenen
      die een belang hebben bij de verbinding daarbij betrekt en de gronden waarop Onze Minister die verbinding kan
      goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: '21.5'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om toe te staan dat een samenwerkingsvennootschap in een
      andere gemeente feitelijk werkzaam is dan de gemeenten waarin die toegelaten instelling feitelijk werkzaam is,
      op welk verzoek Onze Minister beslist overeenkomstig bij algemene maatregel van bestuur daaromtrent te geven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21
  - number: 21a.1
    text: |-
      De toegelaten instelling verschaft een met haar verbonden onderneming niet anderszins vermogen dan door middel van
      het bij haar oprichting storten van aandelenkapitaal of het aan die onderneming bij haar oprichting verstrekken
      van een lening als bedoeld in [artikel 21, tweede lid, onderdeel e][ref1]. Zij stelt zich na die oprichting niet in
      enigerlei opzicht garant voor die onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
  - number: 21a.2
    text: |-
      De toegelaten instelling verschaft een op het tijdstip van inwerkingtreding van
      [artikel I van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1] met haar verbonden onderneming
      geen ander vermogen dan het vermogen dat zij tot dat tijdstip aan die onderneming heeft verschaft, en stelt zich
      niet anderszins voor die onderneming garant dan zoals zij dat tot dat tijdstip heeft gedaan. De door haar aan een
      zodanige onderneming tot dat tijdstip gedane garantstellingen hebben uitsluitend betrekking op werkzaamheden van
      die onderneming waarmee voor dat tijdstip een aanvang is gemaakt, of met betrekking tot welke uit schriftelijke,
      uitsluitend op die werkzaamheden betrekking hebbende, stukken blijkt dat het maken van die aanvang wordt beoogd.
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van de
      tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
  - number: 21a.3
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om een ontheffing van een verbod als bedoeld in het eerste of
      tweede lid, op welk verzoek Onze Minister beslist overeenkomstig bij algemene maatregel van bestuur daaromtrent te
      geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21a
  - number: 21a.4
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op het verschaffen van vermogen aan en garantstellingen
      voor samenwerkingsvennootschappen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21a
  - number: 21b
    text: |-
      De winst van een met een toegelaten instelling verbonden besloten vennootschap met beperkte aansprakelijkheid als
      bedoeld in [artikel 175 van Boek 2 van het Burgerlijk Wetboek][ref1] komt de aandeelhouders ten goede. Van het
      bepaalde in de [artikelen 201][ref2] en [216 van dat boek][ref3] wordt niet afgeweken ten nadele van toegelaten
      instellingen die aandelen in die besloten vennootschap houden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel201
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel216
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '175'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '201'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '216'
  - number: 21c.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de categorieën van financiële instellingen aangewezen, met
      uitsluitend welke de toegelaten instelling transacties aangaat voor het verrichten van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21c
  - number: 21c.2
    text: |-
      Het door een toegelaten instelling aangaan van transacties met een instelling die behoort tot een categorie als
      bedoeld in het eerste lid voor het doen bouwen of verwerven van onroerende zaken of onroerende of infrastructurele
      aanhorigheden is niet toegestaan, voor zover daardoor het totaal van van zodanige instellingen aangetrokken
      financiële middelen komt te liggen boven een bij algemene maatregel van bestuur te bepalen percentage van de
      overeenkomstig de [artikelen 17][ref1] en [18 van de Wet waardering onroerende zaken][ref2] aan de onroerende zaken
      en hun onroerende en infrastructurele aanhorigheden van de toegelaten instelling toegekende waarde, vastgesteld
      overeenkomstig [artikel 22, eerste lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 21d.1
    text: |-
      De vestiging van een recht van pand of hypotheek op zaken en daarmee verbonden rechten van een toegelaten
      instelling of een met haar verbonden onderneming die samenhangen met werkzaamheden op het gebied van de
      volkshuisvesting die niet behoren tot de diensten van algemeen economisch belang, welke vestiging geschiedt ten
      behoeve van het met een instelling die behoort tot een categorie als bedoeld in [artikel 21c, eerste lid][ref1],
      kunnen aangaan van transacties voor het verrichten van zodanige werkzaamheden, wordt niet door enig beding van
      derden of een vestiging van zodanige rechten ten behoeve van derden beperkt. Een zodanig beding of zodanige
      vestiging is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
        hoofdstuk: IV
        afdeling: '1'
  - number: 21d.2
    text: |-
      De vestiging van een recht van pand of hypotheek op zaken en daarmee verbonden rechten van een toegelaten
      instelling die samenhangen met werkzaamheden op het gebied van de volkshuisvesting die behoren tot de diensten
      van algemeen economisch belang, welke vestiging geschiedt ten behoeve van het door de borgingsvoorziening
      kunnen garanderen van de door toegelaten instellingen aan te trekken leningen voor het verrichten van
      zodanige werkzaamheden, wordt niet beperkt door enig beding van of een vestiging van zodanige rechten ten
      behoeve van anderen dan de borgingsvoorziening of instellingen die behoren tot een categorie als bedoeld in
      [artikel 21c, eerste lid][ref1]. Een zodanig beding of zodanige vestiging is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
        hoofdstuk: IV
        afdeling: '1'
  - number: 21d.3
    text: |-
      Bedingen of vestigingen van rechten als bedoeld in het eerste of tweede lid, die tot stand zijn gekomen voor het
      tijdstip van inwerkingtreding van [artikel I van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1]
      blijven van kracht, behoudens hun nietigheid of vernietigbaarheid ingevolge enig ander wettelijk voorschrift dan
      die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
  - number: 21d.4
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
  - number: 21d.4.a
    text: 'de in dat lid bedoelde vestigingen van rechten ten behoeve van de borgingsvoorziening, indien en zolang:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
  - number: 21d.4.a.1°
    text: |-
      de situatie, bedoeld in [artikel 29, eerste lid, eerste volzin][ref1], zich voordoet en die situatie betrekking
      heeft op of gevolgen heeft voor het kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij
      en krachtens [artikel 47, eerste lid, onderdelen a tot en met i][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 21d.4.a.2°
    text: |-
      bij een toegelaten instelling of een met haar verbonden onderneming de financiële middelen ontbreken
      om haar werkzaamheden te kunnen voortzetten, die situatie betrekking heeft op of gevolgen heeft voor
      het kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij en krachtens
      [artikel 47, eerste lid, onderdelen a tot en met i][ref1], het bestuur heeft nagelaten die situatie onverwijld aan
      Onze Minister en de borgingsvoorziening te melden, en de borgingsvoorziening dit schriftelijk aan het bestuur heeft
      medegedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 21d.4.b
    text: bedingen die strekken tot het bepaalde in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21d
  - number: 21e
    text: |-
      Toegelaten instellingen, huurdersorganisaties en bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1],
      gemeenteraden en colleges van burgemeester en wethouders kunnen, indien zij dit raadzaam achten, besluiten ter
      raadpleging voorleggen aan de huurder, bedoeld in artikel 1, eerste lid, onderdeel e, van de Wet op het overleg
      huurders verhuurder.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21e
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 21f
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven
      omtrent de wijze waarop de borgingsvoorziening in compensatie als bedoeld in
      [artikel 1, eerste lid, begripsomschrijving van compensatie, onderdeel a][ref1], voorziet en de governance van de
      borgingsvoorziening, alsmede omtrent toezicht door Onze Minister op de naleving van die voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
        hoofdstuk: I
  - number: 21g
    text: |-
      De rijksbelastingdienst verstrekt Onze Minister op zijn verzoek de gegevens die naar zijn oordeel noodzakelijk zijn
      om de geschiktheid en de betrouwbaarheid, bedoeld in de [artikelen 25, tweede lid][ref1] en [30, derde lid][ref2],
      te beoordelen, alsmede de gegevens die naar zijn oordeel noodzakelijk zijn ten behoeve van het toezicht op de
      governance en de integriteit, bedoeld in [artikel 61, tweede lid, onderdeel b][ref3]. Bij of krachtens algemene
      maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel21g
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '5'
  - number: '22.1'
    text: |-
      Tenzij daarvan in het bepaalde bij of krachtens dit hoofdstuk wordt afgeweken, zijn de [titels 1][ref1],
      [7][ref2], [8, afdeling 2][ref3], en [9 van Boek 2 van het Burgerlijk Wetboek][ref4] van toepassing op de
      toegelaten instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003045
  - number: '22.2'
    text: 'Tenzij daarvan in deze afdeling wordt afgeweken:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel22
  - number: 22.2.a
    text: |-
      zijn de bepalingen van [titel 2 van Boek 2 van het Burgerlijk Wetboek][ref1] van toepassing op de toegelaten
      instellingen die verenigingen zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 22.2.b
    text: |-
      zijn de bepalingen van [titel 6 van dat boek][ref1] van toepassing op de toegelaten instellingen die stichtingen
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '22.3'
    text: |-
      Toegelaten instellingen zetten zich niet in de zin van [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1] om
      in een andere rechtsvorm dan die, genoemd in [artikel 19, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '23.1'
    text: |-
      In de statuten van een toegelaten instelling of van een met haar verbonden onderneming wordt bepaald dat zij
      uitsluitend respectievelijk mede werkzaam is op het gebied van de volkshuisvesting, en wordt dat gebied omschreven
      overeenkomstig het bepaalde bij en krachtens [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '23.2'
    text: |-
      De statuten van een naamloze vennootschap als bedoeld in [artikel 64 van Boek 2 van het Burgerlijk Wetboek][ref1]
      of een besloten vennootschap met beperkte aansprakelijkheid als bedoeld in [artikel 175 van dat boek][ref2], met
      welke een toegelaten instelling zich verbindt in de zin van [artikel 21][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel175
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '175'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
  - number: 23.2.a
    text: |-
      bevatten geen bepalingen die afwijken van [artikel 89 lid 1 tweede volzin][ref1], [92 lid 1][ref2],
      [105 lid 1][ref3], [135 lid 4][ref4], [198 lid 1][ref5], [201 lid 1][ref6] of [245 lid 1 van dat boek][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel135
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel198
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel201
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Artikel245
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '92'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '105'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '135'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '198'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '201'
      - id: ref7
        bwb_id: BWBR0003045
        artikel: '245'
  - number: 23.2.b
    text: |-
      bevatten geen bepalingen als bedoeld in de [artikelen 192 lid 1 aanhef en onder a][ref1] en
      [242 lid 1 eerste volzin van dat boek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel192
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel242
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '192'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '242'
  - number: 23.2.c
    text: |-
      bepalen dat de voorafgaande goedkeuring van de algemene vergadering van die naamloze of besloten vennootschap is
      vereist voor besluiten van haar bestuur over:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
  - number: 23.2.c.1°
    text: |-
      dienovereenkomstige aangelegenheden als die, bedoeld in [artikel 26, eerste lid, onderdelen c en i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
  - number: 23.2.c.2°
    text: |-
      het oprichten van een dochtermaatschappij of het deelnemen in een rechtspersoon of vennootschap in de zin van
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 23.2.c.3°
    text: |-
      het verstrekken van een lening aan of het zich in enigerlei opzicht garant stellen voor een dochtermaatschappij of
      een rechtspersoon of vennootschap als bedoeld onder 2° en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
  - number: 23.2.d
    text: |-
      bepalen, indien en zolang die naamloze of besloten vennootschap een dochtermaatschappij van de toegelaten
      instelling is, dat haar bestuur zich gedraagt naar de aanwijzingen van de algemene vergadering, welke bepaling in
      de statuten van die naamloze vennootschap kan worden beperkt tot aanwijzingen van die vergadering die de algemene
      lijnen van het te voeren beleid op nader in die statuten aangegeven terreinen betreffen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
  - number: '23.3'
    text: |-
      De toegelaten instelling en een met haar verbonden onderneming behoeft voor de wijziging van haar statuten,
      respectievelijk wijzigingen van haar statuten of akte, die betrekking hebben op haar werkzaamheden op het
      gebied van de volkshuisvesting, de goedkeuring van Onze Minister, en legt daartoe elke voorgenomen wijziging
      respectievelijk zodanige wijziging aan hem voor.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel23
  - number: '24.1'
    text: |-
      Het bestuur van een toegelaten instelling die een stichting is, is bevoegd de statuten te wijzigen, tenzij de
      statuten een ander daartoe bevoegd orgaan aanwijzen. Bij een toegelaten instelling die een vereniging is, is de
      algemene vergadering bevoegd de statuten te wijzigen, op voorstel van het bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel24
  - number: '24.2'
    text: Een bepaling in de statuten die wijziging van een statutaire bepaling uitsluit, is nietig.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel24
  - number: '24.3'
    text: |-
      Een bepaling in de statuten die de bevoegdheid tot wijziging van een of meer andere bepalingen van de statuten
      beperkt, kan slechts worden gewijzigd met inachtneming van gelijke beperking.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel24
  - number: '24.4'
    text: Een wijziging in de statuten komt, op straffe van nietigheid, tot stand bij notariële akte.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel24
  - number: '24.5'
    text: |-
      De bestuurders leggen een authentiek afschrift van de wijziging en de gewijzigde statuten neer ten kantore van
      het handelsregister.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel24
  - number: '24.6'
    text: |-
      De [artikelen 43 leden 2 tot en met 6][ref1], [44 lid 2][ref2], [291 lid 2][ref3], [293][ref4] en
      [294 van Boek 2 van het Burgerlijk Wetboek][ref5] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel291
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel293
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel294
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '291'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '293'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '294'
  - number: '25.1'
    text: |-
      Bestuurders zijn natuurlijke personen. De benoeming van bestuurders geschiedt voor de eerste maal
      bij de akte van oprichting. Opvolgende bestuurders worden door de raad van commissarissen benoemd.
      [Artikel 37 leden 1 tot en met 6 van Boek 2 van het Burgerlijk Wetboek][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel37
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '37'
  - number: '25.2'
    text: |-
      Alvorens de raad van commissarissen bestuurders benoemt, verzoekt de toegelaten instelling Onze Minister om zijn
      zienswijze op de geschiktheid van die personen voor het lidmaatschap van het bestuur en de betrouwbaarheid van die
      personen aan haar kenbaar te maken. Onze Minister kan binnen vier weken zijn zienswijze aan haar doen toekomen,
      welke termijn hij, onder schriftelijke kennisgeving daarvan aan de toegelaten instelling voor het verstrijken
      van die termijn, eenmalig met een door hem daarbij te bepalen termijn van ten hoogste vier weken kan verlengen.
      Een benoeming als bedoeld in de eerste volzin zonder dat Onze Minister daarover een positieve zienswijze heeft
      uitgebracht is, indien dat niet het gevolg is van zijn handelen of nalaten, strijdig met het belang van de
      volkshuisvesting. Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de geschiktheid van
      natuurlijke personen voor het lidmaatschap van het bestuur en de betrouwbaarheid van die personen. Bij of krachtens
      algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '25.3'
    text: |-
      Een bestuurder wordt benoemd voor een periode van ten hoogste vier jaar, en kan steeds voor een periode van ten
      hoogste vier jaar worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '25.4'
    text: |-
      Bij de toegelaten instelling die een vereniging is, benoemt de raad van commissarissen geen bestuurders, dan nadat
      hij de algemene vergadering in de gelegenheid heeft gesteld om binnen een door hem aan te geven redelijke termijn,
      daarover een schriftelijk advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '25.5'
    text: |-
      Indien de raad van commissarissen het advies, bedoeld in het vierde lid, geheel of gedeeltelijk niet volgt, dan
      deelt hij de redenen daarvoor schriftelijk mee aan de algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '25.6'
    text: 'Het lidmaatschap van het bestuur is onverenigbaar met:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.a
    text: het lidmaatschap van het bestuur van een andere toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.b
    text: het lidmaatschap van een ander orgaan van, en een andere functie bij, een toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.c
    text: |-
      het lidmaatschap van het bestuur van een andere rechtspersoon of vennootschap die een onderneming drijft met welke
      de toegelaten instelling of een met haar verbonden onderneming enigerlei banden heeft, tenzij die rechtspersoon
      of vennootschap:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.c.1°
    text: een dochtermaatschappij is, of
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.c.2°
    text: |-
      zich blijkens haar statuten uitsluitend ten doel stelt diensten te leveren of werkzaamheden te verrichten die zijn
      gericht op het maatschappelijke belang, de raad van commissarissen met dat lidmaatschap heeft ingestemd en, indien
      van toepassing, is voldaan aan de door de raad van commissarissen daarbij gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.d
    text: |-
      het eerdere lidmaatschap van het bestuur of de raad van commissarissen van een toegelaten instelling of haar
      directe rechtsvoorganger, indien ten tijde van dat lidmaatschap in verband met een ondeugdelijke bedrijfsvoering
      aan die toegelaten instelling een aanwijzing als bedoeld in [artikel 61d][ref1] is gegeven of een maatregel als
      bedoeld in [artikel 48, zevende lid][ref2], [61g, eerste, tweede of derde lid][ref3], [61h, eerste lid][ref4],
      [104a, eerste lid][ref5], [105, eerste lid][ref6], of [120b][ref7] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel61g
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel61h
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 61g
        hoofdstuk: IV
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 61h
        hoofdstuk: IV
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 104a
        hoofdstuk: VIII
      - id: ref6
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
      - id: ref7
        bwb_id: BWBR0005181
        artikel: 120b
        hoofdstuk: IX
  - number: 25.6.e
    text: |-
      het lidmaatschap van een college van burgemeester en wethouders of van een orgaan van een organisatie die zich ten
      doel stelt de belangen van gemeenten te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.f
    text: |-
      het lidmaatschap van een college van gedeputeerde staten of van een orgaan van een organisatie die zich ten doel
      stelt de belangen van provincies te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.g
    text: |-
      het lidmaatschap van een dagelijks bestuur van een waterschap of van een orgaan van een organisatie die zich ten
      doel stelt de belangen van waterschappen te behartigen en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: 25.6.h
    text: |-
      een functie als ambtenaar bij het Rijk, een provincie, een gemeente of een waterschap en enige andere functie,
      indien de aan die functie verbonden werkzaamheden meebrengen dat een betrokkenheid ontstaat of kan ontstaan bij de
      werkzaamheden van de toegelaten instelling of bij de ontwikkeling of de uitvoering van het overheidsbeleid op het
      terrein van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '25.7'
    text: |-
      Degene die voor benoeming in het bestuur, of in het bestuur van een dochtermaatschappij of een
      samenwerkingsvennootschap, in aanmerking wenst te komen, wordt niet daarin benoemd dan nadat hij aan de instantie
      die tot die benoeming bevoegd is een verklaring heeft overgelegd, die inhoudt dat hij niet eerder een bestuurlijke
      of toezichthoudende functie heeft bekleed bij enige rechtspersoon of vennootschap die op het maatschappelijke
      belang gerichte werkzaamheden verricht ten aanzien waarvan, als gevolg van zijn handelen of nalaten, een aanwijzing
      of maatregel is opgelegd en dat hij nooit voor een financieel-economisch delict is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '25.8'
    text: Iedere bestuurder kan te allen tijde worden geschorst en ontslagen door de raad van commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '25.9'
    text: |-
      De statuten bevatten voorschriften omtrent de wijze waarop, in geval van ontstentenis of belet van de bestuurders,
      voorlopig in het bestuur wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel25
  - number: '26.1'
    text: |-
      Aan de goedkeuring van de raad van commissarissen zijn, behoudens in bij algemene maatregel van bestuur bepaalde
      gevallen, onderworpen de besluiten van het bestuur omtrent:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.a
    text: |-
      overdracht of overgang van de door de toegelaten instelling in stand gehouden onderneming dan wel een overwegend
      deel van die onderneming aan een derde;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.b
    text: |-
      het aangaan of verbreken van duurzame samenwerking van de toegelaten instelling met een andere rechtspersoon of
      vennootschap dan wel als volledig aansprakelijke vennote in een commanditaire vennootschap of vennootschap onder
      firma, indien deze samenwerking of verbreking van ingrijpende betekenis is voor de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.c
    text: |-
      het doen van een investering ten behoeve van de volkshuisvesting, indien daarmee ten minste € 3 000 000,– gemoeid
      is;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.d
    text: wijziging van de statuten of, bij een toegelaten instelling die een vereniging is, een voorstel daartoe;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.e
    text: |-
      ontbinding van de toegelaten instelling of, bij een toegelaten instelling die een vereniging is, een voorstel
      daartoe;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.f
    text: aangifte van faillissement en aanvraag van surseance van betaling van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.g
    text: |-
      gelijktijdige beëindiging of beëindiging binnen een kort tijdsbestek van de arbeidsovereenkomst van een
      aanmerkelijk aantal werknemers van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.h
    text: |-
      ingrijpende wijziging in de arbeidsomstandigheden van een aanmerkelijk aantal werknemers van de toegelaten
      instelling of van personen die als zelfstandigen of in een rechtspersoon of vennootschap daarin werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.i
    text: |-
      het vervreemden van onroerende zaken en hun onroerende en infrastructurele aanhorigheden van de toegelaten
      instelling, het daarop vestigen van een recht van erfpacht, opstal of vruchtgebruik, en het overdragen van de
      economische eigendom daarvan, telkens indien daarmee ten minste een bij algemene maatregel van bestuur bepaald
      bedrag gemoeid is, welk bedrag verschillend kan worden bepaald ten aanzien van verschillende categorieën beoogde
      verkrijgers van die zaken en aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: 26.1.j
    text: |-
      het vaststellen van het overzicht, bedoeld in [artikel 43, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 26.1.k
    text: andere, in de statuten bepaalde, onderwerpen dan die, bedoeld in de onderdelen a tot en met j.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: '26.2'
    text: |-
      Bij de toegelaten instelling die een vereniging is, neemt de raad van commissarissen geen beslissing omtrent de
      goedkeuring, bedoeld in het eerste lid, dan nadat hij de algemene vergadering in de gelegenheid heeft gesteld om
      binnen een door hem aan te geven redelijke termijn, daarover een schriftelijk advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: '26.3'
    text: |-
      Indien de raad van commissarissen het advies, bedoeld in het tweede lid, geheel of gedeeltelijk niet volgt, dan
      deelt hij de redenen daarvoor schriftelijk mee aan de algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: '26.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de goedkeuring, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: '26.5'
    text: |-
      Het ontbreken van de goedkeuring van de raad van commissarissen van een besluit als bedoeld in het eerste lid tast
      de vertegenwoordigingsbevoegdheid van bestuur of bestuurders niet aan.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel26
  - number: '27.1'
    text: |-
      Aan de goedkeuring van Onze Minister, op een daartoe strekkend verzoek van de toegelaten instelling, zijn,
      behoudens in bij of krachtens algemene maatregel van bestuur bepaalde gevallen, onderworpen de besluiten van het
      bestuur omtrent:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
  - number: 27.1.a
    text: |-
      het vervreemden van onroerende zaken en hun onroerende en infrastructurele aanhorigheden van de toegelaten
      instelling, het daarop vestigen van een recht van erfpacht, opstal of vruchtgebruik, en het overdragen van de
      economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
  - number: 27.1.b
    text: het vervreemden door de toegelaten instelling van aandelen in een dochtermaatschappij en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
  - number: 27.1.c
    text: |-
      overdracht of overgang van de door de toegelaten instelling in stand gehouden onderneming dan wel een overwegend
      deel van die onderneming aan een derde.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
  - number: '27.2'
    text: |-
      Onze Minister kan besluiten om een besluit als bedoeld in het eerste lid, aanhef en
      onderdeel a of c, niet goed te keuren in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], met dien verstande
      dat onder betrokkene als bedoeld in [artikel 1, eerste lid, van die wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '1'
  - number: 27.2.a
    text: |-
      voor de toepassing van de [artikelen 3][ref1], [4][ref2], [12][ref3], [26][ref4], [30][ref5] en
      [32 van die wet][ref6] wordt verstaan de wederpartij van de toegelaten instelling en


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0013798#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0013798#Artikel32
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0013798
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0013798
        artikel: '30'
      - id: ref6
        bwb_id: BWBR0013798
        artikel: '32'
  - number: 27.2.b
    text: |-
      voor de toepassing van de [artikelen 28, derde lid][ref1], en [33 van die wet][ref2] die wederpartij mede wordt
      verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel33
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '33'
  - number: '27.3'
    text: |-
      Voordat Onze Minister toepassing geeft aan het tweede lid, kan hij het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies vragen
      als bedoeld in [artikel 9 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '27.4'
    text: |-
      Een besluit als bedoeld in het eerste lid, aanhef en onderdeel a of b, dat wordt genomen of uitgevoerd zonder dat
      Onze Minister het heeft goedgekeurd, is nietig.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
  - number: '27.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het eerste lid, te verstrekken gegevens, de wijze waarop Onze Minister degenen die een
      belang hebben bij de goedkeuring, bedoeld in dat lid, daarbij betrekt en de gronden waarop Onze Minister zodanige
      besluiten kan goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel27
  - number: '28'
    text: |-
      Besluiten van het bestuur kunnen bij of krachtens de statuten worden onderworpen aan de goedkeuring van de raad van
      commissarissen en de algemene vergadering, voor zover uit de wet niet anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel28
  - number: '29.1'
    text: |-
      Indien naar het oordeel van het bestuur bij een toegelaten instelling of een met haar verbonden onderneming
      de financiële middelen ontbreken om haar werkzaamheden te kunnen voortzetten, meldt het dat onverwijld aan
      Onze Minister en de borgingsvoorziening. Het bestuur stelt voorts een plan voor financiële sanering van de
      toegelaten instelling op, indien de situatie, bedoeld in de eerste volzin, betrekking heeft op of gevolgen
      heeft voor het kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij en krachtens
      [artikel 47, eerste lid, onderdelen a tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '29.2'
    text: |-
      Indien naar het oordeel van het bestuur een toegelaten instelling in enig kalenderjaar niet zal voldoen aan
      [artikel 48, eerste lid, eerste volzin][ref1], meldt het dat onverwijld aan Onze Minister en aan degenen voor wie
      toepassing van artikel 48, zevende lid, tweede volzin, overigens directe gevolgen kan hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 29a.1
    text: |-
      Het bestuur van de toegelaten instelling of een dochtermaatschappij doet onverwijld, op diens verzoek of eigener
      beweging, aan de raad van commissarissen of Onze Minister mededeling van alle feiten en omstandigheden met
      betrekking tot welke het voor dat bestuur duidelijk is of redelijkerwijs duidelijk zou moeten zijn dat zij van
      invloed kunnen zijn op enig door hem te nemen besluit omtrent de goedkeuring van enig door dat bestuur daartoe aan
      hem ingevolge dit hoofdstuk voorgelegd plan of voornemen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel29a
  - number: 29a.2
    text: Het opzettelijk niet voldoen aan het eerste lid is een overtreding.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel29a
  - number: 29b
    text: |-
      Het bestuur voorziet in het behouden en ontwikkelen van de kennis en de vaardigheden die met inachtneming van het
      bij en krachtens deze wet bepaalde noodzakelijk zijn voor het geschikt blijven van natuurlijke personen voor het
      lidmaatschap van het bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel29b
  - number: '30.1'
    text: |-
      De toegelaten instelling heeft een raad van commissarissen. De raad bestaat uit drie of meer commissarissen die
      natuurlijke personen zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.2'
    text: |-
      De benoeming van commissarissen geschiedt voor de eerste maal bij de akte van oprichting. Opvolgende commissarissen
      worden benoemd door de raad van commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.3'
    text: |-
      Alvorens de raad van commissarissen commissarissen benoemt, verzoekt de toegelaten instelling Onze Minister om
      zijn zienswijze op de geschiktheid van de betrokken personen voor het lidmaatschap van de raad van commissarissen
      en de betrouwbaarheid van die personen aan haar kenbaar te maken. Onze Minister kan binnen vier weken zijn
      zienswijze aan haar doen toekomen, welke termijn hij, onder schriftelijke kennisgeving daarvan aan de toegelaten
      instelling voor het verstrijken van die termijn, eenmalig met een door hem daarbij te bepalen termijn van ten
      hoogste vier weken kan verlengen. Een benoeming als bedoeld in de eerste volzin zonder dat Onze Minister daarover
      een positieve zienswijze heeft uitgebracht is, indien dat niet het gevolg is van zijn handelen of nalaten, strijdig
      met het belang van de volkshuisvesting. Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent
      de geschiktheid van personen voor het lidmaatschap van de raad van commissarissen en de betrouwbaarheid van die
      personen. Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de
      toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.4'
    text: |-
      Een commissaris wordt benoemd voor een periode van ten hoogste vier jaar, en kan een maal voor een periode van ten
      hoogste vier jaar worden herbenoemd. De al dan niet aaneengesloten totale periode waarin een commissaris lid is van
      de raad van commissarissen van dezelfde toegelaten instelling is ten hoogste acht jaar. Indien een lid van de raad
      van commissarissen van een fuserende toegelaten instelling, na toepassing van het bepaalde in artikel 53, toetreedt
      tot de raad van commissarissen van de verkrijgende toegelaten instelling, dan wordt dat voor de toepassing van dit
      lid niet aangemerkt als een benoeming of herbenoeming.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.5'
    text: |-
      De raad van commissarissen is zodanig samengesteld dat de commissarissen ten opzichte van elkaar, het bestuur
      en welk deelbelang dan ook onafhankelijk en kritisch kunnen opereren. Een commissaris is deskundig en heeft
      geen persoonlijk belang in de toegelaten instelling of de met haar verbonden ondernemingen. Er is geen
      arbeidsovereenkomst als bedoeld in [artikel 610 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1] tussen een
      commissaris en de toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '30.6'
    text: 'Het lidmaatschap van de raad van commissarissen is onverenigbaar met:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.a
    text: het lidmaatschap van een bestuur van een toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.b
    text: het eerdere lidmaatschap van het bestuur van de toegelaten instelling of haar directe rechtsvoorganger;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.c
    text: |-
      het eerdere lidmaatschap van de raad van commissarissen van een toegelaten instelling of haar directe
      rechtsvoorganger, indien ten tijde van dat lidmaatschap in verband met een ondeugdelijke bedrijfsvoering aan
      die toegelaten instelling een aanwijzing als bedoeld in[ artikel 61d][ref1] is gegeven of een maatregel als
      bedoeld in [artikel 48, zevende lid][ref2],[ 61g, eerste, tweede of derde lid][ref3],[ 61h, eerste lid][ref4],
      [104a, eerste lid][ref5], [105, eerste lid][ref6], of [120b][ref7] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel61g
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel61h
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 61g
        hoofdstuk: IV
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 61h
        hoofdstuk: IV
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 104a
        hoofdstuk: VIII
      - id: ref6
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
      - id: ref7
        bwb_id: BWBR0005181
        artikel: 120b
        hoofdstuk: IX
  - number: 30.6.d
    text: |-
      het lidmaatschap van enige raad van commissarissen of dienovereenkomstige andere toezichthoudende instantie, indien
      een ander lid van de raad van commissarissen van de betrokken toegelaten instelling zitting heeft in die zodanige
      raad of instantie;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.e
    text: |-
      het lidmaatschap van een orgaan van, en een functie bij, een andere rechtspersoon of vennootschap die op het
      maatschappelijke belang gerichte werkzaamheden verricht, indien een bestuurder van de toegelaten instelling
      bestuurder is van die rechtspersoon of vennootschap;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.f
    text: |-
      het lidmaatschap van een college van burgemeester en wethouders van een gemeente waar de toegelaten instelling
      haar woonplaats heeft of feitelijk werkzaam is, of van een orgaan van een organisatie die zich ten doel stelt de
      belangen van gemeenten te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.g
    text: |-
      het lidmaatschap van een college van gedeputeerde staten van een provincie waar de toegelaten instelling haar
      woonplaats heeft of feitelijk werkzaam is, of van een orgaan van een organisatie die zich ten doel stelt de
      belangen van provincies te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.h
    text: |-
      het lidmaatschap van een dagelijks bestuur van een waterschap waar de toegelaten instelling haar woonplaats
      heeft of feitelijk werkzaam is, of van een orgaan van een organisatie die zich ten doel stelt de belangen van
      waterschappen te behartigen, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.6.i
    text: |-
      een functie als ambtenaar bij het Rijk, een provincie, een gemeente of een waterschap en enige andere functie,
      indien de aan die functie verbonden werkzaamheden meebrengen dat een betrokkenheid ontstaat of kan ontstaan bij de
      werkzaamheden van de toegelaten instelling of bij de ontwikkeling of de uitvoering van het overheidsbeleid op het
      terrein van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.7'
    text: |-
      Degene die voor benoeming in de raad van commissarissen, of in de raad van commissarissen van een
      dochtermaatschappij, in aanmerking wenst te komen, wordt niet daarin benoemd dan nadat hij aan de instantie die
      tot die benoeming bevoegd is een verklaring heeft overgelegd, die inhoudt dat hij niet eerder een bestuurlijke of
      toezichthoudende functie heeft bekleed bij enige rechtspersoon of vennootschap die op het maatschappelijke belang
      gerichte werkzaamheden verricht ten aanzien waarvan, als gevolg van zijn handelen of nalaten, een aanwijzing of
      maatregel is opgelegd en dat hij nooit voor een financieel-economisch delict is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.8'
    text: Commissarissen kunnen huurders van woongelegenheden van toegelaten instellingen zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.9'
    text: 'De statuten bepalen in elk geval, dat:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.9.a
    text: |-
      de in het belang van de huurders van woongelegenheden van de toegelaten instelling werkzame huurdersorganisaties
      als bedoeld in [artikel 1, eerste lid, onderdeel f, van de Wet op het overleg huurders verhuurder][ref1]
      gezamenlijk het recht hebben een bindende voordracht te doen voor twee of meer commissarissen, indien de raad
      van commissarissen uit vier of meer commissarissen bestaat, dan wel een bindende voordracht te doen voor één
      commissaris, indien die raad uit drie commissarissen bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 30.9.b
    text: |-
      indien er geen zodanige huurdersorganisatie is, het in onderdeel a
      bedoelde voordrachtsrecht berust bij de bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op het overleg huurders verhuurder][ref1] gezamenlijk;


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 30.9.c
    text: |-
      indien geen voordracht als bedoeld in onderdeel a is gedaan op grond van onderdeel a of b, de raad van toezicht
      er zorg voor draagt dat de huurders van de woongelegenheden van de toegelaten instelling in de gelegenheid worden
      gesteld om een zodanige voordracht te doen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.9.d
    text: |-
      de raad van commissarissen bij de benoeming van commissarissen niet aan een voordracht als bedoeld in onderdeel a
      voorbijgaat, tenzij door die benoeming in strijd met het bepaalde bij of krachtens dit artikel zou worden gekomen,
      of tenzij de algemene vergadering van een toegelaten instelling die een vereniging is het bindende karakter aan
      die voordracht heeft ontnomen, in welke gevallen de raad van commissarissen hetzelfde aantal commissarissen uit de
      kring van huurders van woongelegenheden van toegelaten instellingen of uit de kring van huurdersorganisaties als
      bedoeld in onderdeel a benoemt als het aantal waarop die voordracht betrekking had;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.9.e
    text: |-
      die algemene vergadering slechts besluit om het bindende karakter aan een voordracht als bedoeld in onderdeel a te
      ontnemen, indien op die vergadering een aantal stemmen kan worden uitgebracht dat ten minste de helft bedraagt van
      het aantal stemmen dat door de stemgerechtigden gezamenlijk kan worden uitgebracht, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.9.f
    text: |-
      indien geen voordracht als bedoeld in onderdeel a is gedaan op grond van onderdeel a, b of c, de raad van
      commissarissen er zorg voor draagt dat hetzelfde aantal commissarissen uit de huurders van de woongelegenheden
      van de toegelaten instelling wordt benoemd als waarop een zodanige voordracht betrekking zou kunnen hebben gehad,
      met dien verstande dat door die benoeming niet in strijd met het bepaalde bij of krachtens dit artikel mag worden
      gekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.10'
    text: |-
      Het aantal op grond van het negende lid, onderdeel a, b of c, voorgedragen commissarissen of het aantal op grond
      van het negende lid, onderdeel f, benoemde commissarissen, is zodanig, dat zij tezamen ten minste een derde deel en
      niet de meerderheid van de raad van commissarissen kunnen uitmaken.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '30.11'
    text: 'De statuten bevatten voorschriften omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.11.a
    text: |-
      de wijze waarop, in geval van ontstentenis of belet van de commissarissen, voorlopig in de raad van commissarissen
      wordt voorzien,
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.11.b
    text: |-
      het, door de raad van commissarissen onder begeleiding van personen of instanties buiten de toegelaten instelling,
      met een frequentie van ten minste een maal per twee jaar beoordelen van het functioneren van die raad,
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: 30.11.c
    text: |-
      de wijze waarop binnen de raad van commissarissen beslissingen worden genomen, met dien verstande dat het bepaalde
      in het vorige lid van overeenkomstige toepassing is op de onderlinge stemverhoudingen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel30
  - number: '31.1'
    text: |-
      Bij de vervulling van hun taak richten de commissarissen zich naar het belang van de toegelaten instelling en de
      door haar in stand gehouden onderneming, naar het te behartigen maatschappelijke belang en naar het belang van de
      betrokken belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel31
  - number: '31.2'
    text: |-
      De raad van commissarissen voorziet in het behouden en ontwikkelen van de kennis en de vaardigheden die met
      inachtneming van het bij en krachtens deze wet bepaalde noodzakelijk zijn voor het geschikt blijven van personen
      voor het lidmaatschap van de raad van commissarissen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel31
  - number: '31.3'
    text: |-
      In bij of krachtens algemene maatregel van bestuur te bepalen gevallen stelt de raad van commissarissen Onze
      Minister op de hoogte van zijn werkzaamheden ter uitoefening van zijn taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel31
  - number: '33.1'
    text: |-
      De ondernemingskamer van het gerechtshof Amsterdam is exclusief bevoegd een commissaris of de raad van
      commissarissen te ontslaan. Zij gaat daartoe uitsluitend over op verzoek, wegens verwaarlozing van zijn taak,
      wegens andere gewichtige redenen of wegens ingrijpende wijziging van de omstandigheden op grond waarvan het
      aanblijven als commissaris of als raad van toezicht redelijkerwijs niet van de toegelaten instelling kan worden
      verlangd. Het verzoek kan worden ingediend door de toegelaten instelling, te dezen vertegenwoordigd door het
      bestuur of de raad van commissarissen, of door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel33
  - number: '33.2'
    text: |-
      De raad van commissarissen of Onze Minister kan een commissaris schorsen. De schorsing vervalt van rechtswege,
      indien de toegelaten instelling of Onze Minister niet binnen een maand na de aanvang van de schorsing een verzoek
      tot ontslag bij de ondernemingskamer heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel33
  - number: '34'
    text: '*[vervallen]*'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel34
  - number: '35.1'
    text: |-
      Het bestuur stelt jaarlijks een jaarrekening op, waarop van [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1]
      uitsluitend de [afdelingen 2 tot en met 6][ref2], [8][ref3], [10][ref4], [11][ref5], [13][ref6] en [16][ref7] van
      overeenkomstige toepassing zijn, met uitzondering van de bepalingen van die afdelingen die gezien hun inhoud niet
      op verenigingen of stichtingen van toepassing kunnen zijn en van bij algemene maatregel van bestuur aangewezen
      bepalingen of delen van bepalingen van die afdelingen. Bij die maatregel kan, uitsluitend indien het aanwijzen van
      een bepaling of deel daarvan als bedoeld in de eerste volzin dat noodzakelijk maakt, worden bepaald dat bepalingen
      of delen van bepalingen anders worden gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling8
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling10
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Afdeling13
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Afdeling16
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '8'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '10'
      - id: ref5
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref6
        bwb_id: BWBR0003045
        afdeling: '13'
      - id: ref7
        bwb_id: BWBR0003045
        afdeling: '16'
  - number: '35.2'
    text: |-
      In de jaarrekening waardeert het bestuur, overeenkomstig bij of krachtens algemene maatregel van bestuur
      daaromtrent te geven nadere voorschriften, de onroerende zaken en hun onroerende en infrastructurele aanhorigheden
      tegen de actuele waarde.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel35
  - number: '35.3'
    text: |-
      De jaarrekening wordt vastgesteld binnen zes maanden na afloop van het betrokken boekjaar van de toegelaten
      instelling. De vaststelling geschiedt in geval van een toegelaten instelling die een stichting is door de raad van
      commissarissen en in geval van een toegelaten instelling die een vereniging is door de algemene vergadering, tenzij
      de statuten hiertoe de raad van commissarissen aanwijzen. Vaststelling van de jaarrekening strekt niet tot kwijting
      aan een bestuurder onderscheidenlijk commissaris.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel35
  - number: '35.4'
    text: |-
      [Artikel 150 van Boek 2 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel150
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '150'
  - number: '35.5'
    text: |-
      De [artikelen 48 lid 3][ref1] en [299a van Boek 2 van het Burgerlijk Wetboek][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel299a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 299a
  - number: '35.6'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de inrichting van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel35
  - number: '36.1'
    text: |-
      Het bestuur stelt, onverminderd het vierde lid, jaarlijks een jaarverslag op, waarop van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] uitsluitend de [afdelingen 7][ref2], [8][ref3] en [16][ref4]
      van overeenkomstige toepassing zijn, met uitzondering van de bepalingen van die afdelingen die gezien hun
      inhoud niet op verenigingen of stichtingen van toepassing kunnen zijn, en van bij algemene maatregel van bestuur
      aangewezen bepalingen of delen van bepalingen van die afdelingen. [Artikel 35, eerste lid, tweede volzin][ref5], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling7
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling8
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling16
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel35
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '8'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '16'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '36.2'
    text: |-
      In het jaarverslag wordt een opgave opgenomen van de nevenfuncties van een bestuurder als bedoeld in
      [artikel 25, eerste lid][ref1], en van een commissaris als bedoeld in [artikel 30, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: '36.3'
    text: |-
      In het jaarverslag doet de raad van commissarissen afzonderlijk verslag van de wijze waarop hij in
      het verslagjaar toepassing heeft gegeven aan het bepaalde bij en krachtens de [artikelen 26][ref1],
      [31, eerste en tweede lid][ref2], en [35, derde lid][ref3], en van de naleving in dat jaar van het bepaalde bij en
      krachtens [artikel 30][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: '36.4'
    text: |-
      Bij de toepassing van het eerste, tweede en derde lid wordt mede, afzonderlijk, verslag gedaan ten
      aanzien van de met de betrokken toegelaten instelling verbonden ondernemingen, met uitzondering van de
      samenwerkingsvennootschappen waarin zij vennote bij wijze van geldschieting is.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36
  - number: 36a.1
    text: |-
      Het bestuur stelt jaarlijks een volkshuisvestingsverslag op, waaruit elke gemeente of openbaar lichaam waar de
      toegelaten instelling feitelijk werkzaam is kan afleiden welke gegevens met name op die gemeente of dat openbaar
      lichaam betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36a
  - number: 36a.2
    text: |-
      In het volkshuisvestingsverslag wordt verslag gedaan van de wijze waarop in het verslagjaar het belang van de
      volkshuisvesting is gediend en van het beleid dat in het verslagjaar ten aanzien van de belanghebbenden is gevoerd,
      en wordt mededeling gedaan over de verwachte gang van zaken omtrent het beleid van de toegelaten instelling met het
      oog op dat belang.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36a
  - number: 36a.3
    text: |-
      Bij de bepaling van het aantal woongelegenheden dat de toegelaten instelling in het verslagjaar in eigendom had,
      begrijpt zij steeds mede de woongelegenheden die zij in het verslagjaar heeft verkregen als gevolg van een fusie
      als bedoeld in [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
  - number: 36a.4
    text: |-
      De toegelaten instelling stelt een overzicht op met verantwoordingsgegevens over het verslagjaar,
      welk overzicht mede betrekking heeft op de met haar verbonden ondernemingen. Het overzicht wordt
      ingericht overeenkomstig bij ministeriële regeling te geven voorschriften, mede ter uitvoering van
      [artikel 49, zevende lid, eerste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
  - number: 36a.5
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de inhoud van het volkshuisvestingsverslag,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel36a
  - number: '37.1'
    text: |-
      De toegelaten instelling verleent opdracht tot onderzoek van de jaarrekening, bedoeld in [artikel 35][ref1], het
      jaarverslag, bedoeld in [artikel 36][ref2], en het overzicht, bedoeld in [artikel 36a, vierde lid][ref3], aan
      een registeraccountant of aan een Accountant-Administratieconsulent ten aanzien van wie bij de inschrijving in
      het in [artikel 36, eerste lid, van de Wet op het accountantsberoep][ref4] bedoelde register een aantekening is
      geplaatst als bedoeld in artikel 36, tweede lid, onderdeel i, van die wet. De opdracht kan worden verleend aan
      een organisatie waarin accountants die mogen worden aangewezen, samenwerken. Iedere belanghebbende kan van de
      toegelaten instelling nakoming van deze verplichting vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0032573
        artikel: '36'
  - number: '37.2'
    text: |-
      De bevoegdheid tot het verlenen van de opdracht berust bij de raad van commissarissen. De opdracht kan te allen
      tijde door hem worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
  - number: '37.3'
    text: 'De opdracht, bedoeld in het eerste lid, omvat het opstellen van:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
  - number: 37.3.a
    text: |-
      een verklaring omtrent de getrouwheid van de jaarrekening, bedoeld in [artikel 35][ref1], welke verklaring de
      gebleken tekortkomingen naar aanleiding van het onderzoek van het jaarverslag, bedoeld in [artikel 36][ref2],
      vermeldt, alsmede een oordeel bevat over de verenigbaarheid van dat jaarverslag met die jaarrekening;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 37.3.b
    text: |-
      een assurance-rapport inzake het volkshuisvestingsverslag en het overzicht, bedoeld in
      [artikel 36a, vierde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 37.3.c
    text: |-
      een verslag omtrent het onderzoek, bedoeld in het eerste lid, uit te brengen aan het bestuur en de raad van
      commissarissen, waarbij de accountant ten minste melding maakt van zijn bevindingen met betrekking tot de
      betrouwbaarheid en continuïteit van de geautomatiseerde gegevensverstrekking.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
  - number: '37.4'
    text: |-
      De jaarrekening wordt niet vastgesteld, indien het daartoe bevoegde orgaan geen kennis heeft kunnen nemen van de
      verklaring, bedoeld in het derde lid, onderdeel a, die aan de jaarrekening moest zijn toegevoegd, tenzij onder de
      overige gegevens een wettige grond wordt medegedeeld waarom die verklaring ontbreekt.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
  - number: '37.5'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven omtrent het onderzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel37
  - number: '38.1'
    text: |-
      De toegelaten instelling doet jaarlijks voor 1 juli aan het college van burgemeester en wethouders
      van de gemeente waar zij haar woonplaats heeft, aan de colleges van burgemeester en wethouders
      van de gemeenten waar zij feitelijk werkzaam is,  aan Onze Minister en aan de in het belang van de
      huurders van haar woongelegenheden werkzame huurdersorganisaties en bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1], met
      overeenkomstige toepassing van het bepaalde in [artikel 2 van die wet][ref2], toekomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 38.1.a
    text: |-
      de ingevolge de [artikelen 35 tot en met 36a][ref1] opgestelde stukken over het aan die datum voorafgaande
      kalenderjaar en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 38.1.b
    text: |-
      de verklaring, bedoeld in [artikel 37, derde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel37
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '38.2'
    text: 'De toegelaten instelling doet jaarlijks voor 1 juli aan Onze Minister toekomen:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
  - number: 38.2.a
    text: |-
      het assurance-rapport, bedoeld in [artikel 37, derde lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel37
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 38.2.b
    text: |-
      het accountantsverslag, bedoeld in [artikel 37, derde lid, onderdeel c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel37
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 38.2.c
    text: |-
      een bestuursverklaring bij de gegevens die zijn opgenomen in het overzicht, bedoeld in
      [artikel 36a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '38.3'
    text: |-
      De toegelaten instelling doet, indien zij van gemeenten als bedoeld in het eerste lid zienswijzen ontvangt op
      stukken als bedoeld in onderdeel a van dat lid, die zienswijzen onverwijld aan Onze Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
  - number: '38.4'
    text: |-
      Onze Minister beoordeelt de stukken, bedoeld in het eerste, tweede en derde lid, en doet zijn oordeel aan de
      toegelaten instelling en de betrokken in de aanhef van het eerste lid bedoelde colleges toekomen. Bij of krachtens
      algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent die beoordeling.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel38
  - number: '39'
    text: |-
      Onze Minister en de huurdersorganisaties en bewonerscommissies, bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1], zijn
      naast degenen, genoemd in [artikel 346 van Boek 2 van het Burgerlijk Wetboek][ref2], bevoegd tot het indienen van
      een verzoek als bedoeld in [artikel 345 van dat boek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel346
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel345
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '346'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '345'
  - number: '40'
    text: |-
      De toegelaten instellingen, de samenwerkingsvennootschappen en, voor zover zij werkzaam zijn op het gebied van de
      volkshuisvesting, de andere met toegelaten instellingen verbonden ondernemingen zijn uitsluitend feitelijk werkzaam
      in gemeenten in Nederland, in gemeenten in de directe nabijheid van Nederland of in de openbare lichamen Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel40
  - number: '41.1'
    text: |-
      Indien de toegelaten instelling voornemens is feitelijk werkzaam te zijn in een gemeente in Nederland, vraagt
      zij een verklaring van geen bezwaar aan bij het college van burgemeester en wethouders van die gemeente en van de
      gemeente waar zij haar woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41
  - number: '41.2'
    text: |-
      De toegelaten instelling is niet feitelijk werkzaam in een gemeente als eerstbedoeld in het eerste lid, indien een
      college van burgemeester en wethouders als bedoeld in dat lid bezwaar daartegen heeft gemaakt, of zolang zij niet
      van elk van die colleges van burgemeester en wethouders een verklaring van geen bezwaar heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41
  - number: '41.3'
    text: |-
      De toegelaten instelling doet de verklaringen van geen bezwaar toekomen aan Onze Minister met de stukken, bedoeld
      in [artikel 38, eerste lid][ref1], voor de in dat lid bedoelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: '41.4'
    text: |-
      Indien een toegelaten instelling niet binnen twee maanden nadat zij een aanvraag als bedoeld in het eerste lid
      heeft ingediend van elk van de colleges van burgemeester en wethouders, bedoeld in dat lid, een verklaring van geen
      bezwaar heeft ontvangen, kan zij Onze Minister verzoeken om in het belang van de volkshuisvesting het feitelijk
      werkzaam zijn in de gemeente, eerstbedoeld in dat lid, goed te keuren.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41
  - number: '41.5'
    text: |-
      Voordat Onze Minister op het verzoek, bedoeld in het vierde lid, beslist, stelt hij de colleges van burgemeester
      en wethouders van de gemeenten, bedoeld in het eerste lid, die bezwaar hebben gemaakt tegen het feitelijk aldaar
      werkzaam zijn door de toegelaten instelling, in de gelegenheid hun zienswijzen daarop aan hem kenbaar te maken. Die
      colleges kunnen binnen vier weken nadien hun zienswijzen aan hem doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41
  - number: '41.6'
    text: |-
      Het eerste tot en met vijfde lid zijn, met betrekking tot de openbare lichamen Bonaire, Sint Eustatius en Saba, van
      overeenkomstige toepassing op het orgaan dat in die openbare lichamen met het dagelijkse bestuur is belast.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41
  - number: 41a.1
    text: |-
      Indien de toegelaten instelling voornemens is feitelijk werkzaam te zijn in een gemeente in de directe nabijheid
      van Nederland, legt zij dat voornemen ter goedkeuring aan Onze Minister voor.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41a
  - number: 41a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de goedkeuring, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41a
  - number: 41b.1
    text: |-
      Onze Minister kan, op verzoek van de colleges van burgemeester en wethouders van twee of meer aan elkaar grenzende
      gemeenten in Nederland, goedkeuren dat, in afwijking van [artikel 41][ref1], de in een of meer van die gemeenten
      feitelijk werkzame toegelaten instellingen en samenwerkingsvennootschappen in al die gemeenten feitelijk werkzaam
      mogen zijn. Van het besluit van Onze Minister wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 41b.2
    text: |-
      Onze Minister geeft uitsluitend toepassing aan het eerste lid, indien de colleges, bedoeld in dat lid, in hun
      verzoek aannemelijk hebben gemaakt dat zij alle gelegen zijn in hetzelfde vanuit het oogpunt van het functioneren
      van de woningmarkt als een geheel te beschouwen gebied.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41b
  - number: 41b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de toepassing
      van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41b
  - number: 41c.1
    text: |-
      Na toepassing van [artikel 41b, eerste lid][ref1], maken de toegelaten instellingen en de
      samenwerkingsvennootschappen, bedoeld in dat lid, in andere gemeenten dan die, bedoeld in dat lid,
      geen aanvang met het doen bouwen of verwerven van woongelegenheden of aanhorigheden als bedoeld in
      [artikel 45, tweede lid, onderdeel a][ref2], of van gebouwen of aanhorigheden als bedoeld in artikel 45, tweede
      lid, onderdelen d en g, en verrichten geen handelingen met het oog op het maken van die aanvang. De eerste volzin
      is niet van toepassing op het bouwen van haar zodanige woongelegenheden of aanhorigheden ter plaatse van haar
      voordien daartoe gesloopte woongelegenheden of hun onroerende of infrastructurele aanhorigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 41c.2
    text: |-
      Het eerste lid is niet van toepassing, indien en zolang de toegelaten instellingen of samenwerkingsvennootschappen,
      bedoeld in [artikel 41b, eerste lid][ref1], zich bij hun werkzaamheden in het bijzonder richten op de huisvesting
      van bij algemene maatregel van bestuur aangewezen categorieën van personen. Andere toegelaten instellingen als
      bedoeld in dat lid kunnen Onze Minister verzoeken om een ontheffing van het verbod, bedoeld in dat lid, op welk
      verzoek Onze Minister mede ten aanzien van de betrokken samenwerkingsvennootschappen beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 41c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het toepassingsbereik
      van het eerste lid en omtrent de bij het verzoek, bedoeld in het tweede lid, tweede volzin, te verstrekken
      gegevens, de wijze waarop de toegelaten instelling degenen die een belang hebben bij de in die volzin bedoelde
      ontheffing daarbij betrekt en de gronden waarop Onze Minister die ontheffing kan verlenen of weigeren.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41c
  - number: 41d
    text: |-
      Bij algemene maatregel van bestuur kunnen gebieden als bedoeld in [artikel 41b, tweede lid][ref1], worden
      aangewezen, bij welke aanwijzing [artikel 41c][ref2] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41c
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '42.1'
    text: |-
      De toegelaten instelling draagt met haar werkzaamheden naar redelijkheid bij aan de uitvoering van het
      volkshuisvestingsbeleid dat geldt in de gemeenten waar zij feitelijk werkzaam is. De eerste volzin is niet van
      toepassing, zolang de colleges van burgemeester en wethouders van die gemeenten geen bescheiden aan de toegelaten
      instelling hebben verstrekt, waarin zij op hoofdlijnen een toegelicht inzicht verschaffen in hun voorgenomen
      volkshuisvestingsbeleid, waarover zij met betrekking tot onderwerpen waarbij andere gemeenten een rechtstreeks
      belang hebben overleg hebben gevoerd met de colleges van burgemeester en wethouders van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel42
  - number: '42.2'
    text: |-
      De toegelaten instelling zet haar middelen bij voorrang in om te voldoen aan het eerste lid, eerste volzin, en
      overigens ten behoeve van de volkshuisvesting. Daartoe behoort tevens het inzetten van middelen ten behoeve van het
      door andere toegelaten instellingen toepassing geven aan het eerste lid, eerste volzin. Bij algemene maatregel van
      bestuur kunnen gevallen worden bepaald waarin de toegelaten instelling toepassing geeft aan de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel42
  - number: '42.3'
    text: |-
      De toegelaten instelling bestemt batige saldi en andere middelen, voor zover aanhouding daarvan niet
      noodzakelijk is voor haar voortbestaan in financieel opzicht, uitsluitend voor werkzaamheden op het gebied van
      de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel42
  - number: '42.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van het
      tweede lid, eerste volzin, en het derde lid, en omtrent de indicatie van de middelen welke de toegelaten instelling
      ter beschikking staan ter uitvoering van het tweede lid, eerste volzin.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel42
  - number: '43.1'
    text: |-
      De toegelaten instelling stelt een overzicht op van voorgenomen werkzaamheden, waaruit de colleges van burgemeester
      en wethouders van de gemeenten waar zij feitelijk werkzaam is kunnen afleiden welke werkzaamheden op hun
      grondgebied zijn voorzien, en welke bijdrage daarmee is beoogd aan de uitvoering van het volkshuisvestingsbeleid
      dat in die gemeenten geldt. Het overzicht heeft betrekking op de eerstvolgende vijf kalenderjaren en heeft mede
      betrekking op de met de toegelaten instelling verbonden ondernemingen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel43
  - number: '43.2'
    text: |-
      De toegelaten instelling voert overleg over het overzicht met de in het belang van de huurders
      van haar woongelegenheden werkzame huurdersorganisaties en bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1], met
      overeenkomstige toepassing van het bepaalde in [artikel 2 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '2'
  - number: '43.3'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de inhoud van het overzicht, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel43
  - number: '44.1'
    text: |-
      De toegelaten instelling draagt er zorg voor dat de colleges van burgemeester en wethouders
      van de gemeenten waar zij feitelijk werkzaam is, en de in het belang van de huurders van
      haar woongelegenheden werkzame huurdersorganisaties en bewonerscommissies, bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1], met
      overeenkomstige toepassing van het bepaalde in [artikel 2 van die wet][ref2], jaarlijks op 1 juli beschikken over
      het overzicht, bedoeld in[ artikel 43, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '44.2'
    text: |-
      De toegelaten instelling verzoekt jaarlijks, tegelijk met de toezending van het overzicht, bedoeld in
      [artikel 43, eerste lid][ref1], om een overleg met de betrokken colleges van burgemeester en wethouders en de
      organisaties en commissies, bedoeld in het eerste lid, met het oog op te maken afspraken over de uitvoering van het
      in de betrokken gemeenten geldende volkshuisvestingsbeleid in ten minste het kalenderjaar dat direct volgt op de in
      het eerste lid bedoelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '44.3'
    text: |-
      Het tweede lid is niet van toepassing indien een toegelaten instelling op de in het eerste lid bedoelde datum
      niet beschikt over bescheiden waarin het college van burgemeester en wethouders van de gemeente op hoofdlijnen een
      toegelicht inzicht verschaft in het door de gemeente voorgenomen volkshuisvestingsbeleid voor het kalenderjaar,
      bedoeld in het tweede lid, waarover het college met betrekking tot onderwerpen waarbij andere gemeenten een
      rechtstreeks belang hebben overleg heeft gevoerd met de colleges van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44
  - number: '44.4'
    text: |-
      Indien het overleg, bedoeld in het tweede lid, niet binnen zes maanden na aanvang daarvan tot afspraken als bedoeld
      in dat lid leidt, leggen het college van burgemeester en wethouders, de toegelaten instelling of de organisaties
      en commissies, bedoeld in het tweede lid, het geschil dat aan het tot stand komen van die afspraken in de weg
      staat binnen vier weken na het ontstaan van het geschil schriftelijk en onderbouwd ter behandeling voor aan Onze
      Minister, die vervolgens een bindende uitspraak doet.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44
  - number: '44.5'
    text: |-
      Onze Minister betrekt bij de behandeling, bedoeld in het vierde lid, het in de betrokken gemeente geldende
      volkshuisvestingsbeleid, de financiële mogelijkheden van de toegelaten instelling en de bij of krachtens deze
      wet gegeven voorschriften, en stelt het betrokken college van burgemeester en wethouders, de betrokken toegelaten
      instelling en de betrokken organisaties en commissies binnen zes weken in kennis van zijn bindende uitspraak over
      het geschil, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44
  - number: '44.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van het
      vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44
  - number: 44a.1
    text: |-
      De toegelaten instelling doet jaarlijks voor 15 december volgend op de in [artikel 44, eerste lid][ref1],
      bedoelde datum aan Onze Minister, aan de colleges van burgemeester en wethouders van de
      gemeenten waar zij feitelijk werkzaam is, en aan de in het belang van de huurders van
      haar woongelegenheden werkzame huurdersorganisaties en bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref2], met
      overeenkomstige toepassing van het bepaalde in [artikel 2 van die wet][ref3], toekomen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 44a.1.a
    text: |-
      een overeenkomstig bij ministeriële regeling te geven voorschriften ingericht overzicht omtrent de onderwerpen,
      bedoeld in [artikel 43, eerste lid][ref1], welk overzicht mede betrekking heeft op de met haar verbonden
      ondernemingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 44a.1.b
    text: |-
      indien van toepassing: de op grond van [artikel 44, tweede lid][ref1], gemaakte afspraken en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 44a.1.c
    text: een bestuursverklaring bij de gegevens die zijn opgenomen in het overzicht, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44a
  - number: 44a.2
    text: |-
      Onze Minister beoordeelt het overzicht en doet zijn oordeel aan de toegelaten instelling toekomen. Bij of krachtens
      algemene maatregel van bestuur worden voorschriften gegeven omtrent die beoordeling.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44a
  - number: 44b.1
    text: |-
      De toegelaten instelling verstrekt aan de colleges van burgemeester en wethouders van
      de gemeenten waar zij feitelijk werkzaam is, en aan de in het belang van de huurders van
      haar woongelegenheden werkzame huurdersorganisaties en bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1], met
      overeenkomstige toepassing van het bepaalde in [artikel 2 van die wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 44b.1.a
    text: |-
      gegevens over haar werkzaamheden met betrekking tot de financiering waarvan een zodanige gemeente zich borg heeft
      gesteld en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44b
  - number: 44b.1.b
    text: |-
      andere gegevens, waarvan kennisneming naar het oordeel van die colleges, organisaties of commissies wenselijk is
      uit het oogpunt van een goede beoordeling van de wijze waarop die toegelaten instelling bijdraagt aan of voornemens
      is bij te dragen aan de uitvoering van het volkshuisvestingsbeleid dat in de betrokken gemeenten geldt.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44b
  - number: 44b.2
    text: |-
      Het eerste lid is niet van toepassing indien en zolang het college van burgemeester en wethouders van een gemeente
      geen bescheiden aan de toegelaten instelling heeft verstrekt, waarin zij op hoofdlijnen een toegelicht inzicht
      verschaft in het door die gemeente voorgenomen volkshuisvestingsbeleid, waarover zij met betrekking tot onderwerpen
      waarbij andere gemeenten een rechtstreeks belang hebben overleg heeft gevoerd met de colleges van burgemeester en
      wethouders van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel44b
  - number: '45.1'
    text: |-
      De toegelaten instellingen, de met hen verbonden ondernemingen van welke zij de enige aandeelhoudster zijn en
      de samenwerkingsvennootschappen zijn uitsluitend werkzaam op het gebied van de volkshuisvesting. Indien een
      toegelaten instelling een deel van de aandelen van een met haar verbonden onderneming houdt, is die onderneming,
      overeenkomstig bij of krachtens algemene maatregel van bestuur daaromtrent te geven voorschriften, ten minste naar
      rato van dat deel werkzaam op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: '45.2'
    text: |-
      Het gebied van de volkshuisvesting omvat uitsluitend het door de toegelaten instelling of door een met haar
      verbonden onderneming:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.a
    text: |-
      doen bouwen en verwerven van voor permanent verblijf bedoelde woongelegenheden en hun onroerende en
      infrastructurele aanhorigheden, alsmede bezwaren, toewijzen, verhuren, vervreemden en doen slopen van haar zodanige
      woongelegenheden en aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, daarop
      vestigen van een recht van erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.b
    text: |-
      in stand houden van en treffen van voorzieningen aan haar voor permanent verblijf bedoelde woongelegenheden en hun
      onroerende en infrastructurele aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen,
      en aan de direct daaraan grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.c
    text: |-
      aan bewoners van voor permanent verblijf bedoelde woongelegenheden en aan leden van wooncoöperaties aan welke zij
      zodanige woongelegenheden heeft vervreemd, verlenen van diensten die rechtstreeks verband houden met de bewoning,
      en, aan personen die haar te kennen geven een zodanige woongelegenheid te willen betrekken, verlenen van diensten
      die rechtstreeks verband houden met hun huisvesting;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.d
    text: |-
      doen bouwen en verwerven van gebouwen die een maatschappelijke gebruiksbestemming hebben en hun onroerende en
      infrastructurele aanhorigheden, alsmede bezwaren, verhuren, vervreemden en doen slopen van haar zodanige gebouwen
      en aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, daarop vestigen van een
      recht van erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.e
    text: |-
      in stand houden van en treffen van voorzieningen aan haar gebouwen als bedoeld in onderdeel d en hun onroerende
      en infrastructurele aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, en aan de
      direct daaraan grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.f
    text: |-
      bijdragen aan de leefbaarheid in de directe nabijheid van woongelegenheden of andere onroerende zaken van de
      toegelaten instelling of van woongelegenheden als bedoeld in het zevende lid, of ten behoeve van de huurders van
      die woongelegenheden, voor zover:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.f.1°
    text: |-
      dat bijdragen als zodanig onderdeel uitmaakt van afspraken als bedoeld in [artikel 44, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 45.2.f.2°
    text: |-
      met dat bijdragen per woongelegenheid als bedoeld in het zevende lid, onderdeel a, en
      [artikel 47, eerste lid, onderdeel b][ref1], ten hoogste een bij algemene maatregel van bestuur te bepalen bedrag
      is gemoeid;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 45.2.g
    text: |-
      doen bouwen en verwerven van gebouwen die een bedrijfsmatige gebruiksbestemming hebben en hun onroerende en
      infrastructurele aanhorigheden, alsmede bezwaren, verhuren, vervreemden en doen slopen van haar zodanige gebouwen
      en aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, daarop vestigen van een
      recht van erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.h
    text: |-
      in stand houden van en treffen van voorzieningen aan haar gebouwen als bedoeld in onderdeel g en hun onroerende
      en infrastructurele aanhorigheden en die van toegelaten instellingen of met hen verbonden ondernemingen, en aan de
      direct daaraan grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.i
    text: |-
      verrichten van de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden,
      genoemd in de onderdelen a tot en met h, waartoe behoren het verwerven of slopen van onroerende zaken, indien dat
      geschiedt met het oog op het op de grond waar die zaken gelegen zijn verrichten van werkzaamheden overeenkomstig
      het bepaalde bij en krachtens de onderdelen a, d en g, het derde of vierde lid en het zesde lid;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.j
    text: |-
      verlenen van diensten ten behoeve van de bedrijfsvoering of administratie, waaronder mede begrepen het toewijzen
      van woongelegenheden en aanhorigheden, van haar verbonden ondernemingen of van toegelaten instellingen en met hen
      verbonden ondernemingen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.2.k
    text: |-
      verlenen van diensten ten behoeve van de administratie van huurdersorganisaties of bewonerscommissies, bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: '45.3'
    text: |-
      Het gebied van de volkshuisvesting omvat de werkzaamheden, genoemd in het tweede lid, onderdelen d tot en
      met h, die behoren tot de diensten van algemeen economisch belang, en, voor zover daarmee verband houdende,
      de werkzaamheden, bedoeld in het tweede lid, onderdeel i, voor zover deze worden verricht in gebieden waar
      woongelegenheden in eigendom van toegelaten instellingen gelegen zijn, en voor zover de gebouwen, bedoeld in de
      onderdelen d en g van dat lid, een op een wijk, buurt of buurtschap in een zodanig gebied gerichte functie hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: '45.4'
    text: |-
      Het gebied van de volkshuisvesting omvat de werkzaamheden, genoemd in het tweede lid, onderdelen a tot en met
      h, die niet behoren tot de diensten van algemeen economisch belang, en, voor zover daarmee verband houdende, de
      werkzaamheden, bedoeld in het tweede lid, onderdeel i, voor zover:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.4.a
    text: |-
      zij worden verricht in gebieden waar woongelegenheden in eigendom van toegelaten instellingen gelegen zijn, en voor
      zover de gebouwen, bedoeld in de onderdelen d en g van dat lid, een op een wijk, buurt of buurtschap in een zodanig
      gebied gerichte functie hebben;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.4.b
    text: zij worden verricht op bebouwde grond;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.4.c
    text: |-
      indien zij door toegelaten instellingen of samenwerkingsvennootschappen worden verricht op niet bebouwde
      grond: die werkzaamheden bijdragen aan de diensten van algemeen economisch belang welke aan hen ingevolge
      [artikel 47, eerste lid][ref1], zijn opgedragen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 45.4.d
    text: |-
      indien werkzaamheden als genoemd in het tweede lid, onderdeel g, en, voor zover daarmee verband houdende,
      werkzaamheden als bedoeld in het tweede lid, onderdeel i, door andere met toegelaten instellingen verbonden
      ondernemingen worden verricht op niet bebouwde grond: die werkzaamheden bijdragen aan het verrichten van hun andere
      werkzaamheden op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: '45.5'
    text: |-
      Het derde lid, het vierde lid, aanhef en onderdelen a en b, en het ten aanzien daarvan bepaalde krachtens het
      zesde lid, is niet van toepassing op met toegelaten instellingen verbonden ondernemingen, met uitzondering van
      samenwerkingsvennootschappen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: '45.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent het toepassingsbereik van het tweede
      lid, onderdelen a, b, c, d, f, g, i, j en k, en derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: '45.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen gevallen worden bepaald waarin en voorwaarden worden gesteld
      waaronder het de toegelaten instellingen, de met hen verbonden ondernemingen en de samenwerkingsvennootschappen, is
      toegestaan om de volgende werkzaamheden te verrichten, die alsdan tot het gebied van de volkshuisvesting behoren:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.7.a
    text: het toewijzen en verhuren van woongelegenheden en aanhorigheden van derden;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.7.b
    text: |-
      het in stand houden van en het treffen van kleinschalige voorzieningen aan gebouwen en woongelegenheden en
      aanhorigheden van derden;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.7.c
    text: |-
      het huren van gebouwen en woongelegenheden en aanhorigheden van derden, ten behoeve van het verrichten van de
      werkzaamheden, bedoeld in de onderdelen a en b, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: 45.7.d
    text: |-
      het verlenen van diensten ten behoeve van de bedrijfsvoering of administratie van derden, voor zover die
      werkzaamheden betrekking hebben op verhuur van woongelegenheden en aanhorigheden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel45
  - number: '46.1'
    text: |-
      De toegelaten instelling geeft, behoudens het bepaalde bij en krachtens de [artikelen 50][ref1] en [50a][ref2] en
      __REF002___________________________________________________________________________________________________________
      __, voorrang aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: II
  - number: 46.1.a
    text: |-
      het huisvesten of doen huisvesten van personen die door hun inkomen of door andere omstandigheden moeilijkheden
      ondervinden bij het vinden van hun passende huisvesting, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel46
  - number: 46.1.b
    text: |-
      de werkzaamheden, genoemd in [artikel 45, tweede lid, onderdelen a, b en c][ref1], en, voor
      zover daarmee verband houdende, de werkzaamheden, bedoeld in artikel 45, tweede lid, onderdeel
      i, voor zover die te verhuren woongelegenheden betreffen met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: '46.2'
    text: |-
      De toegelaten instelling gaat slechts overeenkomsten van huur en verhuur aan, voor zover aan ten minste een
      bij algemene maatregel van bestuur te bepalen percentage van huishoudens als eerstbedoeld of laatstbedoeld in
      [artikel 20, tweede lid, van de Wet op de huurtoeslag][ref1], die in aanmerking komen voor een huurtoeslag in
      de zin van [die wet][ref2] en een bij die algemene maatregel van bestuur te bepalen huishoudinkomen hebben,
      woongelegenheden worden verhuurd met een huurprijs van ten hoogste het in dat lid eerstgenoemde respectievelijk
      laatstgenoemde bedrag. Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de
      toepassing van de eerste volzin. Bij ministeriële regeling kunnen eisen worden gesteld aan de wijze waarop de
      inkomensvaststelling door de toegelaten instelling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008659
  - number: '46.3'
    text: |-
      Indien een toegelaten instelling met een jongere als bedoeld in
      [artikel 274c lid 2 van Boek 7 van het Burgerlijk Wetboek][ref1] een overeenkomst van huur en verhuur op grond van
      dat artikel is aangegaan, vervalt de inschrijving van die jongere om in aanmerking te komen voor een woning niet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274c
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 274c
  - number: '47.1'
    text: |-
      Als diensten van algemeen economisch belang zijn, behoudens het
      bepaalde bij en krachtens de [artikelen 50][ref1] en [50a][ref2] en
      __REF002___________________________________________________________________________________________________________
      _, aan de toegelaten instellingen en aan de samenwerkingsvennootschappen opgedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: II
  - number: 47.1.a
    text: |-
      het huisvesten of doen huisvesten van personen die door hun inkomen of door andere omstandigheden moeilijkheden
      ondervinden bij het vinden van hun passende huisvesting;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
  - number: 47.1.b
    text: |-
      het doen bouwen en verwerven van voor permanent verblijf bedoelde te verhuren woongelegenheden met een huurprijs
      van ten hoogste het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag
      en hun onroerende en infrastructurele aanhorigheden, alsmede bezwaren, toewijzen, verhuren, vervreemden en doen
      slopen van zodanige woongelegenheden en aanhorigheden, daarop vestigen van een recht van erfpacht, opstal of
      vruchtgebruik, en overdragen van de economische eigendom daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 47.1.c
    text: |-
      het bezwaren, verhuren, vervreemden en doen slopen van voor permanent verblijf bedoelde te verhuren woongelegenheden
      die geen zelfstandige woning zijn als bedoeld in [artikel 247 van Boek 7 van het Burgerlijk Wetboek][ref1] met
      een huurprijs die hoger is dan het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2]
      genoemde bedrag en hun onroerende en infrastructurele aanhorigheden, daarop vestigen van een recht van erfpacht,
      opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 47.1.d
    text: |-
      het doen bouwen en verwerven van voor permanent verblijf bedoelde, anders dan in verband met verhuren toe te
      wijzen, woongelegenheden en hun onroerende en infrastructurele aanhorigheden, alsmede het bezwaren, toewijzen,
      vervreemden en doen slopen van haar zodanige woongelegenheden en aanhorigheden, daarop vestigen van een recht van
      erfpacht, opstal of vruchtgebruik, en overdragen van de economische eigendom daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
  - number: 47.1.e
    text: |-
      de werkzaamheden, genoemd in het bepaalde bij en krachtens
      [artikel 45, tweede lid, onderdelen b en c, en zesde lid][ref1], voor zover zij woongelegenheden als bedoeld in
      onderdeel b, c of d van dit artikel of hun onroerende of infrastructurele aanhorigheden betreffen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 47.1.f
    text: |-
      de bij algemene maatregel van bestuur te bepalen werkzaamheden als genoemd in het bepaalde bij en krachtens
      [artikel 45, tweede lid, onderdelen d, e en f, en derde en zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 47.1.g
    text: |-
      de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd en bedoeld
      in de onderdelen a tot en met f, waartoe behoren het verwerven of slopen van onroerende zaken, indien dat geschiedt
      met het oog op het op de grond waar die zaken gelegen zijn verrichten van werkzaamheden overeenkomstig het bepaalde
      bij en krachtens de onderdelen b, d en f en het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
  - number: 47.1.h
    text: |-
      de werkzaamheden, genoemd in het bepaalde bij en krachtens
      [artikel 45, tweede lid, onderdeel j, en zesde lid][ref1], voor zover zij worden verricht ten behoeve van andere
      toegelaten instellingen en noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd en
      bedoeld in de onderdelen a tot en met f, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 47.1.i
    text: |-
      de werkzaamheden, genoemd in het bepaalde bij en krachtens
      [artikel 45, tweede lid, onderdeel k, en zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '47.2'
    text: |-
      De toegelaten instellingen en de samenwerkingsvennootschappen komt uitsluitend compensatie toe voor de
      werkzaamheden, genoemd en bedoeld in het eerste lid. Bij algemene maatregel van bestuur worden nadere voorschriften
      gegeven omtrent de compensatie.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
  - number: '47.3'
    text: |-
      De opdracht, bedoeld in het eerste lid, heeft een werkingsduur van 25 jaar. Onze Minister begint uiterlijk vijf
      jaar voor het einde van die werkingsduur een onderzoek naar de noodzaak, de doeltreffendheid en de effecten in de
      praktijk van die opdracht. Hij rondt dat onderzoek uiterlijk twee jaar nadien af.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
  - number: '47.4'
    text: |-
      Indien, na het verstrijken van de werkingsduur van een opdracht als bedoeld in het eerste lid, werkzaamheden op
      het gebied van de volkshuisvesting niet opnieuw als diensten van algemeen economisch belang worden opgedragen,
      blijft het recht op compensatie voor die werkzaamheden bestaan, indien daarmee voor dat verstrijken een aanvang
      is gemaakt, of met betrekking tot welke uit schriftelijke, uitsluitend op die werkzaamheden betrekking hebbende,
      stukken blijkt dat het maken van die aanvang wordt beoogd, en zolang zij als zodanig voortduren. Bij of krachtens
      algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de toepassing van de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
  - number: '47.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent het toepassingsbereik van het
      eerste lid, onderdeel g.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel47
  - number: '48.1'
    text: |-
      De toegelaten instelling gaat, behoudens het bepaalde bij en krachtens de [artikelen 50][ref1] en [50a][ref2] en
      __REF002___________________________________________________________________________________________________________
      ___, met betrekking tot haar woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen b en c][ref4],
      ten aanzien van een woonruimte voor zover deze als zelfstandige woning is verhuurd, en behoudens met personen
      die deel uitmaken van een bij regeling van Onze Minister te bepalen groep, geen overeenkomsten van huur en
      verhuur voor bepaalde tijd aan voor de duur van twee jaar of korter. Met die personen gaat de toegelaten
      instelling geen overeenkomst van huur en verhuur aan welke een gebruik van woonruimte betreft als bedoeld in
      [artikel 232 lid 2 van Boek 7 van het Burgerlijk Wetboek][ref5]. Met betrekking tot ten minste 90% van de
      woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen b en c][ref6], gaat zij gedurende 25 jaar slechts
      overeenkomsten van huur en verhuur aan, indien het huishoudinkomen niet hoger is dan de inkomensgrens, of indien in
      die woongelegenheden bij algemene maatregel van bestuur te bepalen categorieën van personen worden gehuisvest. Bij
      ministeriële regeling worden voorschriften gegeven omtrent de in verband met de toepassing van de derde volzin aan
      de toegelaten instelling te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel232
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: II
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '232'
      - id: ref6
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '48.2'
    text: |-
      Indien de toegelaten instelling woongelegenheden als bedoeld in het eerste lid verhuurt aan of heeft ondergebracht
      in een rechtspersoon of vennootschap welke overeenkomsten als bedoeld in dat lid aangaat met natuurlijke
      personen, of een rechtspersoon of vennootschap welke zodanige woongelegenheden verhuurt aan een rechtspersoon
      of vennootschap welke zodanige overeenkomsten aangaat, draagt zij er, overeenkomstig bij algemene maatregel van
      bestuur daaromtrent te geven nadere voorschriften, zorg voor dat die rechtspersoon of vennootschap met betrekking
      tot die woongelegenheden het bepaalde bij en krachtens dat lid naleeft, en is de ministeriële regeling, bedoeld in
      de tweede volzin van dat lid, van toepassing op de aan die rechtspersoon of vennootschap te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48
  - number: '48.3'
    text: |-
      De toegelaten instelling gaat met betrekking tot haar woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c][ref1], die niet behoren tot het in het eerste lid bedoelde deel
      daarvan, overeenkomsten van huur en verhuur aan overeenkomstig bij algemene maatregel van bestuur daaromtrent te
      geven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '48.4'
    text: |-
      De toegelaten instelling gebruikt gegevens met betrekking tot het huishoudinkomen uitsluitend voor de uitvoering
      van het eerste en derde lid, en van krachtens deze wet gegeven voorschriften, indien die zodanig zijn dat de hoogte
      van dat inkomen voor een goede uitvoering daarvan bepalend of medebepalend is. Zij draagt er zorg voor dat de in
      het tweede lid bedoelde rechtspersoon of vennootschap dienovereenkomstig handelt.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48
  - number: '48.5'
    text: |-
      Een of meer toegelaten instellingen kunnen Onze Minister verzoeken voor hen een lager percentage te bepalen
      dan het percentage, genoemd in het eerste lid. Bij het verzoek maken de verzoekende toegelaten instelling of
      instellingen aannemelijk dat de verhouding tussen de vraag naar en het aanbod van woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdelen b en c][ref1], zodanig is dat zij het eerste lid van dit artikel redelijkerwijs
      niet kunnen naleven. Bij het verzoek voegen zij voorts een voorstel voor de bepaling voor een of meer andere
      toegelaten instellingen van een zodanig hoger percentage dan het percentage, genoemd in het eerste lid, dat de
      betrokken toegelaten instellingen gezamenlijk voldoen aan dat lid. Bij inwilliging van het verzoek bepaalt Onze
      Minister dat lagere en dat hogere percentage op een zodanige wijze, dat de toegelaten instellingen op welke zijn
      besluit daartoe betrekking heeft gezamenlijk voldoen aan het eerste lid. Bij algemene maatregel van bestuur worden
      nadere voorschriften gegeven omtrent de toepassing van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '48.6'
    text: |-
      De toegelaten instelling gaat gedurende 25 jaar met betrekking tot gebouwen als bedoeld in
      [artikel 45, tweede lid, onderdeel d][ref1], op welke de algemene maatregel van bestuur, bedoeld in
      [artikel 47, eerste lid, onderdeel f][ref2], van toepassing is behoudens in bij algemene maatregel van bestuur
      bepaalde gevallen slechts overeenkomsten van huur en verhuur aan met verenigingen of stichtingen die zich blijkens
      hun statuten uitsluitend ten doel stellen diensten te leveren of werkzaamheden te verrichten die zijn gericht op
      het maatschappelijke belang, of met overheidsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '48.7'
    text: |-
      Onze Minister beoordeelt jaarlijks voor 1 december of de toegelaten instelling in het aan die datum voorafgaande
      jaar het bepaalde bij en krachtens het eerste tot en met vierde en zesde lid heeft nageleefd of doen naleven,
      waarbij hij, indien van toepassing, het betrokken in het vijfde lid bedoelde percentage in aanmerking neemt, en
      verstrekt dat oordeel aan de toegelaten instelling. Hij kan overeenkomstig bij algemene maatregel van bestuur
      daaromtrent te geven voorschriften besluiten, dat de toegelaten instelling geen compensatie toekomt voor
      werkzaamheden die behoren tot de diensten van algemeen economisch belang. Dat besluit is een besluit in de zin van
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 48a
    text: |-
      Het bepaalde bij en krachtens deze paragraaf is slechts van toepassing, indien en zolang de toegelaten instelling
      geen toepassing geeft aan [artikel 50a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
  - number: '49.1'
    text: |-
      De toegelaten instellingen houden een zodanige administratie bij dat de registratie van de activa en passiva die
      zijn verbonden met de diensten van algemeen economisch belang welke aan hen en aan de samenwerkingsvennootschappen
      zijn opgedragen, respectievelijk met hun overige werkzaamheden, gescheiden is. De eerste volzin is niet van
      toepassing, indien en zolang:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: 49.1.a
    text: |-
      de totale nettojaaromzet, verminderd met de opbrengsten uit levering van onroerende zaken, van een toegelaten
      instelling minder dan € 34.249.250,90 heeft bedragen gedurende de twee laatst afgesloten boekjaren, en het aandeel
      in die omzet van haar werkzaamheden die niet behoren tot de diensten van algemeen economisch belang in die jaren
      minder was dan 5%, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: 49.1.b
    text: |-
      in enig boekjaar het aandeel van haar investeringen in werkzaamheden die niet behoren tot de diensten van algemeen
      economisch belang in het totaal van haar investeringen minder is dan 10%.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: '49.2'
    text: |-
      Toegelaten instellingen die werkzaamheden verrichten welke de handel tussen lidstaten van de Europese Unie niet
      op merkbare wijze ongunstig kunnen beïnvloeden, van welke de totale nettojaaromzet minder dan € 40 miljoen heeft
      bedragen gedurende twee boekjaren, of ten aanzien van welke de door hen in enigerlei vorm ontvangen overheidssteun
      is vastgesteld ingevolge een open, doorzichtige en niet-discriminerende procedure houden een zodanige administratie
      bij dat:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: 49.2.a
    text: de registratie van de lasten en baten van hun verschillende werkzaamheden gescheiden zijn;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: 49.2.b
    text: |-
      alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: 49.2.c
    text: |-
      de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: '49.3'
    text: |-
      De toegelaten instellingen, bedoeld in de aanhef van het tweede lid, bewaren de in de onderdelen a, b en c van dat
      lid bedoelde gegevens gedurende vijf jaar, gerekend vanaf het einde van het boekjaar waarop de gegevens betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: '49.4'
    text: |-
      Indien de Europese Commissie verzoekt om terbeschikkingstelling van gegevens als bedoeld in het bepaalde bij
      en krachtens dit artikel, verstrekken de toegelaten instellingen, bedoeld in de aanhef van het tweede lid, Onze
      Minister op diens verzoek binnen de door hem gestelde termijn de desbetreffende gegevens. Onze Minister doet de
      gegevens toekomen aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: '49.5'
    text: |-
      Het in het tweede lid, aanhef, genoemde bedrag kan bij ministeriële regeling worden gewijzigd, indien de wijziging
      voortvloeit uit een bindend besluit van een instelling van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: '49.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de toepassing van het eerste
      lid, de wijze van scheiding door de toegelaten instellingen van baten, lasten, activa en passiva, en omtrent het
      beschikbaar komen van financiële middelen voor de uitvoering van de diensten van algemeen economisch belang welke
      aan hen en aan de samenwerkingsvennootschappen zijn opgedragen, respectievelijk van hun overige werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
  - number: '49.7'
    text: |-
      De administratie en het in [artikel 36a, vierde lid][ref1], bedoelde overzicht
      van de toegelaten instellingen worden met inachtneming van het eerste tot en met
      zesde lid ingericht, behoudens het bepaalde bij en krachtens [artikel 50][ref2] en
      __REF002___________________________________________________________________________________________________________
      __. Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de inrichting van
      de administratie, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: II
  - number: '50.1'
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling bepalen dat werkzaamheden als genoemd en bedoeld in het
      bepaalde bij en krachtens [artikel 47, eerste lid, onderdelen b tot en met f][ref1], ten aanzien van een toegelaten
      instelling of samenwerkingsvennootschap niet behoren tot de diensten van algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '50.2'
    text: 'Bij toepassing van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
  - number: 50.2.a
    text: |-
      is [artikel 21d][ref1] mede van toepassing ten aanzien van die werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21d
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21d
        hoofdstuk: IV
        afdeling: '1'
  - number: 50.2.b
    text: |-
      behoren de betrokken werkzaamheden niet tot de werkzaamheden waaraan de betrokken toegelaten instelling ingevolge
      [artikel 46, aanhef en eerste lid, onderdeel b][ref1], voorrang geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 50.2.c
    text: |-
      komt de betrokken toegelaten instelling of samenwerkingsvennootschap geen compensatie toe voor de betrokken
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
  - number: 50.2.d
    text: |-
      is [artikel 48][ref1] niet van toepassing op die werkzaamheden en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: 50.2.e
    text: |-
      worden de baten, lasten, activa en passiva die zijn verbonden met die werkzaamheden administratief samengevoegd met
      die, verbonden met de overige werkzaamheden van de betrokken toegelaten instelling of samenwerkingsvennootschap die
      niet behoren tot de diensten van algemeen economisch belang.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
  - number: '50.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het eerste lid, te verstrekken gegevens, de wijze waarop Onze Minister degenen die een belang
      hebben bij toepassing van dat lid daarbij betrekt en de gronden waarop Onze Minister dat lid kan toepassen dan wel
      van die toepassing kan afzien.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50
  - number: 50a.1
    text: |-
      Om een juridische scheiding te bewerkstelligen brengt de toegelaten instelling haar werkzaamheden die niet
      behoren tot de diensten van algemeen economisch belang, en alle daarmee samenhangende baten, lasten, activa
      en passiva, overeenkomstig bij of krachtens algemene maatregel van bestuur te geven voorschriften onder
      in een of meer woningvennootschappen. Woningvennootschappen zijn naamloze vennootschappen als bedoeld in
      [artikel 64 van Boek 2 van het Burgerlijk Wetboek][ref1] of besloten vennootschappen met beperkte aansprakelijkheid
      als bedoeld in [artikel 175 van dat boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel175
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '175'
  - number: 50a.2
    text: |-
      De toegelaten instelling stelt een voorstel tot bewerkstelliging van de juridische scheiding op. Zij kan,
      overeenkomstig bij algemene maatregel van bestuur daaromtrent te geven voorschriften, daarin opnemen dat andere
      werkzaamheden en daarmee samenhangende baten, lasten, activa en passiva dan die, bedoeld in het eerste lid,
      eerste volzin, in een woningvennootschap worden ondergebracht. Bij toepassing van de tweede volzin van dit lid is
      [artikel 50, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
  - number: 50b.1
    text: |-
      De toegelaten instelling bewerkstelligt geen juridische scheiding dan nadat Onze Minister dat heeft goedgekeurd.
      Zij doet daartoe het voorstel, bedoeld in [artikel 50a, tweede lid][ref1], aan hem toekomen. Onze Minister neemt
      binnen twaalf weken na ontvangst van het voorstel een besluit omtrent de goedkeuring, welke termijn hij, onder
      schriftelijke kennisgeving daarvan aan de toegelaten instelling, telkens kan verlengen met een door hem daarbij
      te bepalen termijn van ten hoogste zes weken, van welke verlenging hij kennis geeft voor het verstrijken van de
      eerstgenoemde dan wel voor de laatste maal verlengde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: '3'
  - number: 50b.2
    text: |-
      Op een verzoek om goedkeuring van een voorgenomen juridische scheiding
      zijn de [artikelen 21, eerste lid en tweede lid, tweede volzin][ref1], en
      [53, tweede lid en derde lid, aanhef en onderdeel a][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '53'
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
  - number: 50b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      voorstel, bedoeld in het eerste lid, te verstrekken gegevens, de wijze waarop de toegelaten instelling degenen die
      een belang hebben bij de juridische scheiding daarbij betrekt en de gronden waarop Onze Minister die scheiding kan
      goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50b
  - number: 50c.1
    text: |-
      De toegelaten instelling is terstond na de bewerkstelliging van een juridische scheiding de enige aandeelhoudster
      van de woningvennootschappen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50c
  - number: 50c.2
    text: |-
      Onze Minister kan, overeenkomstig bij algemene maatregel van bestuur daaromtrent gegeven voorschriften, bepalen dat
      de toegelaten instelling haar aandelen in een woningvennootschap in het openbaar ter overname aanbiedt.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel50c
  - number: '51'
    text: 'De toegelaten instelling besteedt aan:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel51
  - number: 51.a
    text: |-
      de werkzaamheden, genoemd in [artikel 45, tweede lid, onderdeel d][ref1], voor zover zij bestaan uit doen bouwen,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 51.b
    text: |-
      de werkzaamheden, genoemd in[ artikel 45, tweede lid, onderdeel e][ref1], voor zover zij bestaan uit treffen van
      voorzieningen aan haar gebouwen en hun onroerende en infrastructurele aanhorigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '53.1'
    text: |-
      Een toegelaten instelling gaat slechts een fusie als bedoeld in
      [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1] aan,  indien zij daarbij het vermogen van een of meer
      andere rechtspersonen onder algemene titel verkrijgt, of een andere toegelaten instelling daarbij haar vermogen
      onder algemene titel verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
  - number: '53.2'
    text: |-
      Een verzoek van een toegelaten instelling om goedkeuring van een voorgenomen fusie waarbij zij betrokken is,
      omvat in elk geval de door haar voorziene gevolgen van die fusie voor de volkshuisvesting in de gemeenten waar
      de toegelaten instelling die uit die fusie voortkomt voornemens is feitelijk werkzaam te zijn. Die toegelaten
      instelling voert overleg over dat verzoek met de colleges van burgemeester en wethouders van die gemeenten,
      alsmede met de in het belang van de huurders van haar woongelegenheden werkzame huurdersorganisaties als bedoeld
      in [artikel 1, eerste lid, onderdeel f, van de Wet op het overleg huurders verhuurder][ref1]. Zij dient een zodanig
      verzoek niet in dan nadat de in het belang van de huurders van haar woongelegenheden werkzame huurdersorganisaties
      als bedoeld in artikel 1, eerste lid, onderdeel f, van de Wet op het overleg huurders verhuurder, aan haar hebben
      medegedeeld of zij met de voorgenomen fusie instemmen. Indien die organisaties niet met de voorgenomen fusie
      instemmen, kan Onze Minister die fusie slechts goedkeuren, indien daardoor naar zijn oordeel wordt voorkomen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 53.2.a
    text: |-
      ten aanzien van de betrokken toegelaten instelling een situatie ontstaat als bedoeld in
      [artikel 29, eerste lid][ref1], of [57, eerste lid, onderdeel a][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: 53.2.b
    text: |-
      een toegelaten instelling niet in staat is toepassing te geven aan [artikel 42, eerste lid, eerste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: '53.3'
    text: 'Een verzoek als bedoeld in het tweede lid gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: 53.3.a
    text: de zienswijzen daarop van de colleges, bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: 53.3.b
    text: |-
      indien [hoofdstuk 5 van de Mededingingswet][ref1] op de fusie van toepassing
      is, het oordeel daarover van de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008691
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '53.4'
    text: 'Onze Minister onthoudt in elk geval zijn goedkeuring aan de voorgenomen fusie, indien:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: 53.4.a
    text: |-
      de verzoekende toegelaten instelling naar zijn oordeel niet aannemelijk heeft gemaakt dat het belang van de
      volkshuisvesting met die fusie beter is gediend dan met andere vormen van samenwerking tussen die toegelaten
      instelling en andere rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: 53.4.b
    text: 'de verzoekende toegelaten instelling:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: 53.4.b.1°
    text: |-
      voornemens is te fuseren met een toegelaten instelling die na toepassing van [artikel 41b][ref1] of [41d][ref2], op
      grond daarvan niet in dezelfde gemeenten, die zijn gelegen in het gebied, bedoeld in artikel 41b, tweede lid, als
      zij feitelijk werkzaam mag zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41d
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41d
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 53.4.b.2°
    text: |-
      naar zijn oordeel niet aannemelijk heeft gemaakt dat het belang van de volkshuisvesting met die fusie beter gediend
      is dan met een fusie met een toegelaten instelling die na toepassing van [artikel 41b][ref1] of [41d][ref2], op
      grond daarvan in dezelfde gemeenten, die zijn gelegen in het gebied, bedoeld in artikel 41b, tweede lid, als zij
      feitelijk werkzaam mag zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41d
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41d
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: 53.4.c
    text: |-
      naar zijn oordeel de financiële continuïteit van de toegelaten instelling die uit die fusie zou voortkomen niet
      voldoende is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: 53.4.d
    text: |-
      naar zijn oordeel de toegelaten instelling die uit die fusie zou voortkomen zou beschikken over een zodanig
      bedrag aan financiële middelen dat is aangetrokken van instellingen die behoren tot een categorie als bedoeld in
      [artikel 21c, eerste lid][ref1], dat dat bedrag zou liggen boven een bij algemene maatregel van bestuur te bepalen
      percentage van de overeenkomstig de [artikelen 17][ref2] en [18 van de Wet waardering onroerende zaken][ref3] aan
      de onroerende zaken en hun onroerende en infrastructurele aanhorigheden van die toegelaten instelling toegekende
      waarde, vastgesteld overeenkomstig [artikel 22, eerste lid, van die wet][ref4], of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 53.4.e
    text: het oordeel, bedoeld in het derde lid, onderdeel b, negatief is.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: '53.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de bij het
      verzoek, bedoeld in het tweede lid, te verstrekken gegevens, de wijze waarop de toegelaten instelling degenen
      die een belang hebben bij de voorgenomen fusie daarbij betrekt en de gronden waarop Onze Minister die fusie kan
      goedkeuren dan wel zijn goedkeuring daaraan kan onthouden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: '53.6'
    text: |-
      Het tweede lid, derde lid, aanhef en onderdeel a, vierde lid, onderdeel b, en vijfde lid zijn van overeenkomstige
      toepassing op een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] die geen
      juridische scheiding is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '53.7'
    text: |-
      Het tweede tot en met vijfde lid zijn van overeenkomstige toepassing indien een toegelaten instelling het gehele
      vermogen van een of meerdere andere toegelaten instellingen onder bijzondere titel verkrijgt.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53
  - number: 53a.1
    text: |-
      Een door Onze Minister aan te wijzen onafhankelijke instantie draagt er, door daartoe deskundige instanties aan te
      wijzen, zorg voor dat bij elke toegelaten instelling mede ter plaatse een onderzoek kan worden verricht naar:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
  - number: 53a.1.a
    text: |-
      de resultaten van haar werkzaamheden, zowel uit het oogpunt van het belang van de volkshuisvesting als van het
      maatschappelijke belang van die werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
  - number: 53a.1.b
    text: de wijze waarop de belanghebbenden in de gelegenheid zijn gesteld invloed uit te oefenen op het beleid, en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
  - number: 53a.1.c
    text: de kwaliteit van de governance.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
  - number: 53a.2
    text: |-
      De toegelaten instelling draagt er zorg voor dat het onderzoek, bedoeld in het eerste lid, ten minste een maal
      per vier jaar door de daartoe door haar te benaderen deskundige instantie, bedoeld in dat lid, wordt afgerond. De
      kosten van dat onderzoek komen voor haar rekening. Onze Minister kan de termijn van vier jaar, genoemd in de eerste
      volzin, verlengen of opschorten, indien naar zijn oordeel bijzondere omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
  - number: 53a.3
    text: |-
      De deskundige instantie, bedoeld in het eerste lid, stelt telkens binnen zes weken na afloop van een onderzoek een
      rapport met haar bevindingen vast. Zij zendt het rapport onverwijld na de vaststelling daarvan aan de toegelaten
      instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
  - number: 53a.4
    text: |-
      De toegelaten instelling zendt een rapport als bedoeld in het derde lid, vergezeld van de zienswijze van de raad
      van commissarissen en het bestuur daarop, binnen zes weken aan Onze Minister, alle belanghebbenden en degenen die
      in het kader van het onderzoek hun zienswijze hebben gegeven. Zij stelt voorts het rapport binnen die termijn langs
      elektronische weg algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
  - number: 53a.5
    text: |-
      Een rapport als bedoeld in het derde lid is mede onderwerp van het overleg, bedoeld in
      [artikel 43, tweede lid][ref1], en dat, bedoeld in [artikel 44, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '54.1'
    text: |-
      De gemiddelde huurprijs van de woningen van de toegelaten instelling op 1 januari van het jaar volgend op 1 januari
      van enig jaar is niet hoger dan de gemiddelde huurprijs van die woningen op 1 januari van enig jaar, vermeerderd
      met een bij ministeriële regeling bepaald percentage. In de afspraken, bedoeld in [artikel 44, tweede lid][ref1],
      kan voor de in de betrokken gemeente gelegen woningen ten hoogste een bij ministeriële regeling bepaald hoger
      percentage worden overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '54.2'
    text: |-
      Bij de berekening van de gemiddelde huurprijs, bedoeld in het eerste lid, wordt geen rekening gehouden met
      woningen:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
  - number: 54.2.a
    text: |-
      waarvoor op laatstgenoemde 1 januari-datum een huurovereenkomst als bedoeld in
      [artikel 247 van Boek 7 van het Burgerlijk Wetboek][ref1] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
  - number: 54.2.b
    text: |-
      die in het betrokken jaar voor het eerst of laatstelijk door de toegelaten instelling of aan een opvolgende huurder
      zijn verhuurd;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
  - number: 54.2.c
    text: |-
      waarvan de huurprijs in het betrokken jaar is verhoogd als gevolg van een woningverbetering als bedoeld in
      [artikel 255 lid 1 onderdelen a en b van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
  - number: 54.2.d
    text: |-
      waarvan de huurprijs in het betrokken jaar is verhoogd als gevolg van een voorstel daartoe als bedoeld
      in [artikel 252a lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1], mits in afspraken als bedoeld
      in [artikel 44, tweede lid][ref2], is opgenomen dat de daarmee gepaard gaande extra huurinkomsten
      worden ingezet voor investeringen en voor zover deze inkomsten, de in die afspraken overeengekomen
      investeringsbedragen niet overschrijden, of is verlaagd naar aanleiding van een voorstel daartoe als bedoeld in
      [artikel 252b lid 1 van Boek 7 van het Burgerlijk Wetboek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 252b
  - number: 54.2.e
    text: |-
      waarvan de huurprijs in het betrokken jaar op verzoek van de huurder niet is verhoogd respectievelijk is verlaagd
      anders dan overeenkomstig [artikel 252][ref1], [252b][ref2] of [257 van Boek 7 van het Burgerlijk Wetboek][ref3]
      dan wel is verhoogd als gevolg van een voorstel daartoe als bedoeld in [artikel 252c onderdeel b van Boek 7 van het
      Burgerlijk Wetboek](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 252b
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '257'
  - number: 54.2.f
    text: die een onzelfstandige woonruimte vormen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
  - number: '54.3'
    text: |-
      Voor de toepassing van het eerste lid wordt onder woningen van de toegelaten instelling mede verstaan woningen die
      de toegelaten instelling verhuurt op grond van [artikel 45, zevende lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: 54a.1
    text: |-
      In afwijking van [artikel 246 van Boek 7 van het Burgerlijk Wetboek][ref1] doet de toegelaten instelling
      voor 1 april 2021 aan de huurder van een zelfstandige woning als bedoeld in [artikel 234 van dat boek][ref2]
      met een inkomen dat blijkens de inkomenscategorieverklaring, bedoeld in het derde lid, niet hoger is dan
      het op grond van [artikel 14, eerste en tweede lid, van de Wet op de huurtoeslag][ref3] toepasselijke
      bedrag, een voorstel tot verlaging van de huurprijs tot ten hoogste het toepasselijke bedrag, genoemd in
      [artikel 20, tweede lid, van de Wet op de huurtoeslag][ref4], tenzij op de woning een huurovereenkomst
      als bedoeld in [artikel 247 van Boek 7 van het Burgerlijk Wetboek][ref5] van toepassing is.
      [Artikel 252, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref6] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel234
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel247
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel252
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '246'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '234'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '247'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '252'
  - number: 54a.2
    text: |-
      De toegelaten instelling verzoekt de inspecteur, bedoeld in
      [artikel 252a, tweede lid, onderdeel e, van Boek 7 van het Burgerlijk Wetboek][ref1],
      om een inkomenscategorieverklaring ten aanzien van de huurders van haar woningen
      als bedoeld in het eerste lid met een geldende huurprijs die hoger is dan het in
      [artikel 20, tweede lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel20
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '20'
  - number: 54a.3
    text: |-
      De inspecteur, bedoeld in [artikel 252a, tweede lid, onderdeel e, van Boek 7 van het Burgerlijk Wetboek][ref1],
      verstrekt desgevraagd aan de toegelaten instelling een inkomenscategorieverklaring ten aanzien van de
      huurders, bedoeld in het tweede lid. In de verklaring wordt vermeld of op de door de toegelaten instelling
      aangeduide plaats van de woonruimte op basis van gegevens uit de basisregistratie inkomen, bedoeld in
      [hoofdstuk IVA van de Algemene wet inzake rijksbelastingen][ref2], het inkomen over 2019 lager is dan of gelijk is
      aan het op grond van [artikel 14, eerste en tweede lid, van de Wet op de huurtoeslag][ref3] toepasselijke bedrag,
      dan wel hoger is dan dat bedrag en het aantal personen waaruit het huishouden volgens de registratie bestaat.
      Indien geen inkomensgegeven in de basisregistratie inkomen beschikbaar is, vermeldt de verklaring dat dat het geval
      is. Het bepaalde in de ministeriële regeling, bedoeld in artikel 252a, vierde lid, zevende zin, van Boek 7 van het
      Burgerlijk Wetboek, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIVA
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: IVA
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '14'
  - number: 54a.4
    text: |-
      In afwijking van het eerste lid doet de toegelaten instelling een voorstel als bedoeld in dat lid indien de huurder
      daarom voor 31 december 2021 verzoekt en aantoont dat het bruto-inkomen van de bewoners, bedoeld in artikel 54c,
      in de zes maanden voorafgaand aan dat verzoek lager is dan of gelijk is aan de helft van het op grond van
      [artikel 14, eerste en tweede lid, van de Wet op de huurtoeslag][ref1] toepasselijke bedrag. De huurder voegt bij
      het verzoek, bedoeld in de eerste zin, een door hem opgestelde en ondertekende verklaring over de samenstelling van
      zijn huishouden op de datum van het verzoek. De toegelaten instelling doet het voorstel, bedoeld in het eerste lid,
      binnen drie weken na ontvangst van de in de eerste en tweede zin bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '14'
  - number: 54a.5
    text: |-
      De ingangsdatum van de verlaging is in afwijking van
      [artikel 252, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet later dan de eerste dag van de
      tweede maand na de dagtekening van het voorstel. In het kalenderjaar dat de huurprijs is verlaagd overeenkomstig
      het eerste lid wordt in afwijking van [artikel 248 van Boek 7 van het Burgerlijk Wetboek][ref2] de huur na
      die verlaging niet meer verhoogd. [Artikel 252c van Boek 7 van het Burgerlijk Wetboek](onbekend) is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel248
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '248'
  - number: 54a.6
    text: |-
      Indien de toegelaten instelling geen voorstel als bedoeld in het eerste lid doet of de huurder niet instemt met
      het voorstel van de toegelaten instelling kan de huurder de huurcommissie verzoeken daar uitspraak over te doen.
      Het verzoek wordt indien de toegelaten instelling geen voorstel doet, gedaan binnen zes weken na 1 april 2021
      respectievelijk na het tijdstip, bedoeld in het vierde lid, derde zin, dan wel indien de huurder niet instemt
      met het voorstel binnen zes weken na het tijdstip waarop de verlaging blijkens het voorstel had moeten ingaan. De
      huurder voegt bij het verzoek gegevens over zijn inkomen in 2019 respectievelijk over het bruto-inkomen, bedoeld
      in het vierde lid, eerste zin, en de in het vierde lid, tweede zin, bedoelde verklaring indien de toegelaten
      instelling geen voorstel heeft gedaan dan wel de in het vierde lid, tweede zin, bedoelde verklaring indien de
      huurder niet instemt met het voorstel.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
  - number: 54a.7
    text: |-
      Bij de berekening, bedoeld in [artikel 54, eerste lid][ref1], wordt geen rekening gehouden met de woningen waarvan
      de huurprijs in het betrokken jaar is verlaagd op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel54
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
  - number: 54a.8
    text: |-
      De toegelaten instelling informeert de huurder in 2021 niet later dan tegelijk met het jaarlijkse voorstel tot
      verhoging van de huurprijs over de mogelijkheden op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
  - number: 54a.9
    text: |-
      De toegelaten instelling verstrekt de Belastingdienst/Toeslagen binnen drie weken na de
      datum waarop de huurverlaging is ingegaan de gewijzigde huurprijs en duidt daarbij de
      woonruimte aan op de wijze als voorgeschreven in de ministeriële regeling, bedoeld in
      [artikel 252a, vierde lid, zevende zin, van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 54b
    text: |-
      Voor de toepassing van [artikel 54a, eerste, tweede, derde en zesde lid][ref1],
      wordt onder inkomen verstaan: de gezamenlijke inkomensgegevens, bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref2] van degenen die
      op het adres van de woning staan ingeschreven, met uitzondering van kinderen in de zin van
      [artikel 4 van de Algemene wet inkomensafhankelijke regelingen][ref3] jonger dan 27 jaar, met dien verstande dat
      in het eerste lid van dat artikel voor «de belanghebbende» telkens wordt gelezen «een bewoner».


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel4
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel54b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 54a
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '4'
  - number: '55.1'
    text: De toegelaten instelling draagt zorg voor een sobere en doelmatige bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55
  - number: '55.2'
    text: |-
      De toegelaten instelling draagt zorg voor een administratie die een juist en volledig inzicht geeft in haar
      werkzaamheden en haar financiële aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55
  - number: '55.3'
    text: |-
      De administratie is zodanig, dat een juiste, volledige en tijdige vastlegging daarin is gewaarborgd van de
      gegevens met betrekking tot het huishoudinkomen. Die gegevens worden voor een kalenderjaar niet langer daarin
      bewaard dan tot het tijdstip dat de compensatie over dat kalenderjaar voor werkzaamheden van de toegelaten
      instelling die behoren tot de diensten van algemeen economisch belang onherroepelijk is komen vast te staan.
      [Artikel 48, eerste lid, tweede volzin, en tweede lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
  - number: '55.4'
    text: |-
      De toegelaten instelling is verplicht tot geheimhouding van de gegevens met betrekking tot het huishoudinkomen,
      behoudens voor zover enig wettelijk voorschrift haar tot mededeling verplicht of uit haar taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55
  - number: '55.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de kosten van de
      bedrijfsvoering, bedoeld in het eerste lid, en nadere voorschriften omtrent de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55
  - number: 55a.1
    text: |-
      De toegelaten instelling voert een zodanig financieel beleid en beheer, dat haar financiële continuïteit niet in
      gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55a
  - number: 55a.2
    text: |-
      Zij stelt daartoe een reglement op, waarin zij in elk geval opneemt binnen welke grenzen de aan haar financiële
      beleid en beheer verbonden risico’s aanvaardbaar zijn, en welk beleid zij beoogt te voeren ingeval haar financiële
      continuïteit in gevaar komt of dreigt te komen. In het reglement wordt mede ingegaan op de verbonden ondernemingen.
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de inhoud van het
      reglement.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55a
  - number: 55b.1
    text: 'De toegelaten instelling stelt reglementen op inzake:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55b
  - number: 55b.1.a
    text: |-
      slopen en het treffen van ingrijpende voorzieningen aan haar woongelegenheden en de betrokkenheid van de bewoners
      van die woongelegenheden daarbij en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55b
  - number: 55b.1.b
    text: |-
      de bijdragen, bedoeld in de [artikelen 220 lid 5][ref1] en [275 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref2],
      waarin in elk geval de hoogte van die bijdragen wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel275
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '220'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '275'
  - number: 55b.2
    text: |-
      De toegelaten instelling voert overleg over het reglement, bedoeld in het eerste lid, onderdeel a, met de
      colleges van burgemeester en wethouders van de gemeenten waar zij feitelijk werkzaam is, alsmede de in het belang
      van de huurders van haar woongelegenheden werkzame huurdersorganisaties en bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel f respectievelijk g, van de Wet op het overleg huurders verhuurder][ref1], met
      overeenkomstige toepassing van het bepaalde in [artikel 2 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '2'
  - number: 55b.3
    text: |-
      Bij algemene maatregel van bestuur wordt een reglement inzake de behandeling van klachten omtrent het handelen of
      nalaten van toegelaten instellingen aangewezen, dat op alle toegelaten instellingen van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel55b
  - number: '56'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de betrokkenheid van
      toegelaten instellingen bij volkshuisvesting buiten Nederland waarop [artikel 40][ref1] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
  - number: '57.1'
    text: |-
      Onze Minister kan, overeenkomstig bij of krachtens algemene maatregel van bestuur te geven voorschriften, subsidies
      aan toegelaten instellingen verstrekken:
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel57
  - number: 57.1.a
    text: |-
      ter bevordering van de financiële sanering van toegelaten instellingen, indien bij een toegelaten instelling
      de financiële middelen ontbreken om haar werkzaamheden te kunnen voortzetten, en andere maatregelen
      harerzijds om aan die situatie een einde te maken niet mogelijk zijn, ontoereikend zijn gebleken of leiden
      tot het niet kunnen voortzetten van werkzaamheden als genoemd en bedoeld in het bepaalde bij en krachtens
      [artikel 47, eerste lid, onderdelen a tot en met g][ref1], welke subsidies worden verstrekt op grond van plannen
      als bedoeld in [artikel 29, eerste lid, tweede volzin][ref2], die Onze Minister heeft goedgekeurd, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
  - number: 57.1.b
    text: ter tegemoetkoming in de kosten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel57
  - number: '57.2'
    text: Onze Minister verleent ter uitvoering van het eerste lid geen garanties.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel57
  - number: '58.1'
    text: |-
      De subsidie, bedoeld in [artikel 57, eerste lid][ref1], wordt bekostigd uit de bijdragen, bedoeld in het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: '58.2'
    text: |-
      Elke toegelaten instelling die op 1 januari van een kalenderjaar als zodanig bestaat, is over dat kalenderjaar
      een bijdrage aan Onze Minister verschuldigd. Onze Minister bepaalt de hoogte van de bijdrage overeenkomstig bij of
      krachtens algemene maatregel van bestuur daaromtrent te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel58
  - number: '58.3'
    text: |-
      Onze Minister kan, indien hij van oordeel is dat storting van een bijdrage als bedoeld in het tweede lid niet
      noodzakelijk is om uitvoering te geven aan het bepaalde bij en krachtens [artikel 57, eerste lid][ref1], voor
      1 oktober van het kalenderjaar waarover die bijdrage verschuldigd zou zijn bepalen dat een zodanige bijdrage niet
      verschuldigd is over dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: '59.1'
    text: 'De borgingsvoorziening adviseert Onze Minister op diens verzoek of eigener beweging omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.1.a
    text: |-
      de goedkeuring van plannen als bedoeld in[ artikel 29, eerste lid, tweede volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '2'
  - number: 59.1.b
    text: |-
      de gevallen waarin naar haar oordeel een sanering als bedoeld in [artikel 57, eerste lid, onderdeel a][ref1],
      noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: 59.1.c
    text: de kosten die in een kalenderjaar met zodanige saneringen gemoeid zijn en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.1.d
    text: |-
      de hoogte van het in een kalenderjaar voor die saneringen benodigde, door toepassing van [artikel 58][ref1] op te
      brengen, bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        afdeling: '4'
  - number: '59.2'
    text: 'Door Onze Minister kan aan de borgingsvoorziening worden gemandateerd:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.2.a
    text: |-
      het nemen van de besluiten uit hoofde van de bevoegdheid, genoemd in
      [artikel 57, eerste lid, aanhef en onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: 59.2.b
    text: |-
      het nemen van de besluiten uit hoofde van de bevoegdheid, genoemd in [artikel 58, tweede lid, tweede volzin][ref1],
      voor zover die betrekking heeft op het deel van de bijdrage, bedoeld in dat lid, waaruit subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a][ref2], worden bekostigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: 59.2.c
    text: |-
      de bevoegdheid tot het heffen van de bijdrage, bedoeld in [artikel 58, tweede lid][ref1], al dan niet
      uitsluitend voor zover die heffing betrekking heeft op het deel van die bijdrage waaruit subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a][ref2], worden bekostigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: 59.2.d
    text: |-
      de bevoegdheid tot het geven van een aanwijzing als bedoeld in [artikel 61d][ref1], voor zover die aanwijzing
      betrekking heeft op de financiële sanering van de toegelaten instelling, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
  - number: 59.2.e
    text: |-
      de bevoegdheid tot het op grond van [artikel 105, eerste lid, aanhef en onderdeel c][ref1], opleggen van een last
      onder dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel105
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
  - number: '59.3'
    text: 'In geval van een mandaat als bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.3.a
    text: |-
      oefent de borgingsvoorziening de aan haar gemandateerde bevoegdheden onafhankelijk uit van haar werkzaamheden met
      het oog op het door toegelaten instellingen kunnen aantrekken van leningen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.3.b
    text: |-
      draagt de borgingsvoorziening er zorg voor dat de uitvoering van de in onderdeel a bedoelde categorieën van
      werkzaamheden in algemene zin op elkaar is afgestemd;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.3.c
    text: |-
      behoeft de borgingsvoorziening voor wijzigingen van haar statuten, die betrekking hebben op de aan haar
      gemandateerde bevoegdheden de goedkeuring van Onze Minister en legt zij daartoe elke voorgenomen zodanige wijziging
      daarvan aan hem voor;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.3.d
    text: |-
      past de raad van commissarissen[ artikel 31, vierde lid][ref1], mede toe ten aanzien van de borgingsvoorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel31
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '2'
  - number: 59.3.e
    text: |-
      past de toegelaten instelling [artikel 38, eerste lid][ref1], mede toe ten aanzien van de borgingsvoorziening en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '2'
  - number: 59.3.f
    text: |-
      zijn de [artikelen 6.1, aanhef en onderdeel c][ref1], en
      [7.24, aanhef en onderdeel b, van de Comptabiliteitswet 2016][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
  - number: '59.4'
    text: 'Voor zover een mandaat als bedoeld in het tweede lid de betrokken bevoegdheid betreft:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.4.a
    text: is het eerste lid niet van toepassing;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: 59.4.b
    text: |-
      is [artikel 57, tweede lid][ref1], van overeenkomstige toepassing op de borgingsvoorziening of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
        hoofdstuk: IV
        afdeling: '4'
  - number: 59.4.c
    text: |-
      is, in afwijking van [artikel 58, tweede lid, eerste volzin][ref1], de bijdrage, bedoeld in dat lid, verschuldigd
      aan de borgingsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
        hoofdstuk: IV
        afdeling: '4'
  - number: '59.5'
    text: |-
      De borgingsvoorziening wordt, voor zover het haar werkzaamheden, bedoeld in het eerste lid, en de bevoegdheden,
      door haar uitgeoefend krachtens een mandaat als bedoeld in het tweede lid, betreft, bekostigd uit de bijdragen,
      bedoeld in artikel 58, tweede lid.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel59
  - number: '60.1'
    text: Er is een Autoriteit woningcorporaties, die onder Onze Minister ressorteert.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel60
  - number: '60.2'
    text: |-
      Onze Minister geeft met betrekking tot de uitoefening van de ingevolge het bij of krachtens deze wet bepaalde aan
      de autoriteit toekomende bevoegdheden uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan
      aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel60
  - number: '60.3'
    text: |-
      Het tweede lid is niet van toepassing op aanwijzingen die betrekking hebben op beheersmatige aspecten van de
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel60
  - number: '61.1'
    text: Het toezicht op de toegelaten instellingen en de dochtermaatschappijen is opgedragen aan de autoriteit.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: '61.2'
    text: 'Het toezicht richt zich op de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.2.a
    text: de rechtmatigheid van het handelen en nalaten van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.2.b
    text: de governance en de integriteit van beleid en beheer van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.2.c
    text: het behoud van de financiële continuïteit van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.2.d
    text: het beschermen van het maatschappelijk bestemd vermogen van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.2.e
    text: de solvabiliteit en de liquiditeit van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.2.f
    text: |-
      de kwaliteit van het financieel risicomanagement, het financieel beheer, de financiële aansturing en de financiële
      verantwoording van de toegelaten instellingen en de dochtermaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.2.g
    text: |-
      de compensatie, waaronder mede is begrepen de naleving van [artikel 48][ref1], alsmede
      [artikel 49, eerste en tweede lid][ref2], dan wel van de [artikelen 49, eerste lid][ref3],
      [25b, eerste lid, van de Mededingingswet][ref4], en de andere situaties waarin toegelaten instellingen of
      samenwerkingsvennootschappen meer compensatie zouden kunnen ontvangen dan hen toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '49'
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '49'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: 25b
  - number: '61.3'
    text: 'Het toezicht omvat de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.3.a
    text: |-
      het risicogericht beoordelen van het beleid en beheer van de toegelaten instellingen en de dochtermaatschappijen,
      en het aan hen doen toekomen van dat oordeel;
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.3.b
    text: |-
      het risicogericht beoordelen van het functioneren van de toegelaten instellingen en de dochtermaatschappijen in het
      algemeen en
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61.3.c
    text: |-
      het desgevraagd en uit eigen beweging informeren van Onze Minister over ontwikkelingen omtrent de toegelaten
      instellingen en de dochtermaatschappijen die in het belang van het toezicht zijn, en het op grond daarvan doen
      van voorstellen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: '61.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen aan de autoriteit andere onderwerpen en taken worden
      opgedragen in het kader van het toezicht op toegelaten instellingen en de dochtermaatschappijen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: '61.5'
    text: |-
      Onze Minister verleent de autoriteit mandaat om de aanwijzingen te geven en de maatregelen te nemen, bedoeld in de
      [artikelen 48, zevende lid][ref1], [53a, tweede lid][ref2], [61d tot en met 61g][ref3], [104a, eerste lid][ref4],
      [105, eerste lid][ref5], en [120b][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 53a
        hoofdstuk: IV
        paragraaf: '6'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 104a
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
      - id: ref6
        bwb_id: BWBR0005181
        artikel: 120b
        hoofdstuk: IX
  - number: '61.6'
    text: |-
      Indien een college van burgemeester en wethouders Onze Minister of de autoriteit verzoekt maatregelen te nemen of
      te bevorderen waartoe hij of zij ingevolge deze afdeling bevoegd is, is hij of zij gehouden naar aanleiding van dat
      verzoek een besluit te nemen.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61
  - number: 61a.1
    text: De autoriteit stelt jaarlijks een jaarwerkplan vast. Het jaarwerkplan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61a
  - number: 61a.2
    text: Onze Minister zendt het jaarwerkplan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61a
  - number: 61b.1
    text: |-
      De autoriteit oefent het toezicht onafhankelijk van de ontwikkeling en de uitvoering van het rijksbeleid op het
      terrein van de toegelaten instellingen en de dochtermaatschappijen uit.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61b
  - number: 61b.2
    text: |-
      De autoriteit bepaalt zelfstandig de gegevens en inlichtingen van toegelaten instellingen en de
      dochtermaatschappijen die voor de uitoefening van haar taken noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61b
  - number: 61b.3
    text: |-
      Onze Minister geeft geen aanwijzingen met betrekking tot de oordelen, bedoeld in [artikel 61, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '5'
  - number: 61b.4
    text: |-
      De autoriteit maakt de oordelen, bedoeld in [artikel 61, derde lid, onderdeel a][ref1], openbaar. De oordelen,
      bedoeld in artikel 61, derde lid, onderdeel b, worden aan Onze Minister aangeboden en door hem onverwijld en in
      ongewijzigde vorm, in voorkomend geval voorzien van zijn bevindingen, aan de Tweede Kamer der Staten-Generaal
      gezonden of door de autoriteit zelf openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '5'
  - number: 61c
    text: |-
      De kosten die gemoeid zijn met de uitoefening van het toezicht en met de ingevolge de
      [artikelen 48, zevende lid][ref1],[ 61d tot en met 61h][ref2], [104a, eerste lid][ref3], [105, eerste lid][ref4],
      en [120b][ref5] gegeven aanwijzingen en genomen maatregelen, komen, overeenkomstig bij algemene maatregel van
      bestuur daaromtrent te geven voorschriften, voor rekening van de toegelaten instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel104a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel61c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 61d
        hoofdstuk: IV
        afdeling: '5'
