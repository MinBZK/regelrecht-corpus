  - number: 134_bis
    text: |-
      De toegelaten instellingen brengen hun statuten uiterlijk voor 1 januari 2019 in overeenstemming met de Woningwet,
      zoals gewijzigd door de [Veegwet Wonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039169
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0039169
  - number: '136'
    text: De Wederopbouwwet (*Stb.* 1950, 236) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel136
  - number: '140'
    text: |-
      De Wet van 11 maart 1978, houdende wijziging van de Woningwet inzake aanschrijving tot verbetering van woningen
      (*Stb.* 143) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel140
  - number: '147'
    text: De Wet geldelijke steun woonwagens (*Stb.* 1986, 264) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel147
  - number: '152'
    text: |-
      Waar in voorschriften, gegeven bij of krachtens een andere wet dan de in de [artikelen 149 tot en met 151][ref1]
      genoemde, wordt verwezen naar een artikel in de [Woningwet van 12 juli 1962][ref2], wordt deze verwijzing geacht te
      zijn geschied naar de overeenkomstige bepalingen in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '149'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002379
  - number: 152b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen drie jaar na de inwerkingtreding van de
      wet van 25 juni 2019 tot wijziging van de Woningwet in verband met de introductie van een stelsel van certificering
      voor werkzaamheden aan gasverbrandingsinstallaties aan de Staten-Generaal een verslag over de doeltreffendheid en
      de effecten van de krachtens [artikel 3, tweede en derde lid][ref1], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel152b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '153.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel153
  - number: '153.2'
    text: |-
      Bij het in het eerste lid bedoelde besluit kan, voor zover dat besluit voorziet in gedeeltelijke inwerkingtreding
      van deze wet, in afwijking in zoverre van [artikel 124][ref1] worden bepaald dat verschillende artikelen of
      onderdelen van artikelen van de [Woningwet van 12 juli 1962][ref2] van kracht blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '124'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002379
  - number: '153.3'
    text: |-
      Indien toepassing wordt gegeven aan het eerste of tweede lid, kan in hetgeen met het oog op het in werking treden
      dan wel in stand blijven van de desbetreffende artikelen of onderdelen daarvan regeling behoeft, worden voorzien
      bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel153
  - number: '153.4'
    text: |-
      De [Woningwet van 12 juli 1962][ref1] wordt vanaf het tijdstip van gehele of gedeeltelijke inwerkingtreding van
      deze wet aangehaald als [Woningwet 1962][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379
      [ref2]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0002379
      - id: ref2
        bwb_id: BWBR0002379
  - number: '153.5'
    text: Deze wet kan worden aangehaald als Woningwet.
    url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#Artikel153
