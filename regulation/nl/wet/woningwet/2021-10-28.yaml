        artikel: 45a
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: '3'
  - number: '131.1'
    text: |-
      Op een op het tijdstip van inwerkingtreding van de [Wet verduidelijking voorschriften woonboten][ref1]
      bestaande woonboot of bestaand ander drijvend object dat hoofdzakelijk wordt gebruikt voor verblijf zijn de
      [artikelen 1b][ref2] voor zover het de voorschriften, bedoeld in [artikel 2, eerste lid][ref3], betreft, [7b][ref4]
      en [13][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039181
