  - number: '133.1'
    text: |-
      Voor gebieden waar op het tijdstip van inwerkingtreding van de [Reparatiewet BZK 2014][ref1] een
      bestemmingsplan als bedoeld in de [Wet ruimtelijke ordening][ref2] van toepassing is, blijven de
      [artikelen 1, eerste lid, onderdeel g][ref3], [7b, eerste lid][ref4], [8, vijfde en zevende lid][ref5], [9][ref6],
      [10][ref7] en [12, derde lid][ref8], zoals die laatstelijk luidden voor het tijdstip van inwerkingtreding van de
      Reparatiewet BZK 2014, van toepassing tot het tijdstip van wijziging van het bestemmingsplan voor het gebied, doch
      uiterlijk tot 1 juli 2018.


