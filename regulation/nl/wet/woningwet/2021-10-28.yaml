  - number: '131.2'
    text: |-
      Indien op het tijdstip van inwerkingtreding van de [Wet verduidelijking voorschriften woonboten][ref1] bij of
      krachtens een gemeentelijke verordening voorschriften zijn gegeven over het uiterlijk van woonboten of andere
      drijvende objecten die hoofdzakelijk worden gebruikt voor verblijf, worden die voorschriften aangemerkt als
      onderdeel van een welstandsnota als bedoeld in [artikel 12a, eerste lid][ref2], tot het tijdstip waarop een nieuwe
      welstandsnota als bedoeld in artikel 12a, eerste lid, wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0039181
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
