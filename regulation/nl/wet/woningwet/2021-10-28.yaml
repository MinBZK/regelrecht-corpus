  - number: '133.3'
    text: |-
      Op een aanvraag om een omgevingsvergunning voor het bouwen van een bouwwerk, als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1], ingediend voor het
      tijdstip van inwerkingtreding van de [Reparatiewet BZK 2014][ref2], alsmede op enig bezwaar of beroep, ingesteld
