preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is mede uit het oogpunt van vereenvoudiging en
    vermindering van regelgeving, alsmede uit het oogpunt van decentralisatie nieuwe voorschriften te geven omtrent het
    bouwen en de volkshuisvesting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005181/2021-10-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: - *autoriteit:* Autoriteit
      woningcorporaties, bedoeld in [artikel 60, eerste lid][ref1];
        - *bestemmingsplan:* bestemmingsplan als bedoeld in [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref2],
      alsmede inpassingsplan als bedoeld in [artikel 3.26][ref3] of [3.28 van die wet][ref4] of beheersverordening als
      bedoeld in a[rtikel 3.38 van die wet][ref5];
        - *bevoegd gezag:* bestuursorgaan, bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref6], dan wel, bij het ontbreken van een
      bestuursorgaan als bedoeld in dat artikellid, college van burgemeester en wethouders;
        - *bewoner:* huurder en degene die met instemming van de huurder zijn hoofdverblijf in de woongelegenheid heeft;
        - *borgingsvoorziening:* door de Staat der Nederlanden gefaciliteerde voorziening, in het leven geroepen met het
      oog op het door toegelaten instellingen kunnen aantrekken van leningen;
        - *bouwen:* plaatsen, geheel of gedeeltelijk oprichten, vernieuwen, veranderen of vergroten;
        - *compensatie:* a. door toegelaten instellingen kunnen aantrekken van leningen met gebruikmaking
      van de borgingsvoorziening, of van borgstelling daarvan door overheden; b. subsidie als bedoeld in
      [artikel 57, eerste lid][ref7], en c. verlaging van grondprijzen door gemeenten ten behoeve van de uitvoering door
      toegelaten instellingen of samenwerkingsvennootschappen van diensten van algemeen economisch belang;
        - *diensten van algemeen economisch belang:* diensten van algemeen economisch belang als bedoeld in: a. artikel
      106, tweede lid, van het Verdrag betreffende de werking van de Europese Unie en b. het besluit van de Europese
      Commissie van 20 december 2011 (PbEU 2012, L 7) betreffende de toepassing van dat lid op staatssteun in de vorm
      van compensatie voor de openbare dienst, verleend aan bepaalde met het beheer van diensten van algemeen economisch
      belang belaste ondernemingen;
        - *gebied van de volkshuisvesting:* gebied van de volkshuisvesting, bedoeld in het bepaalde bij en krachtens
      [artikel 45][ref8];
        - *gebouw:* bouwwerk dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt;
        - *huishoudinkomen:* gezamenlijke verzamelinkomens als bedoeld in
      [artikel 2.3 van de Wet inkomstenbelasting 2001][ref9] van de bewoners van een woongelegenheid, met uitzondering
      van kinderen in de zin van [artikel 4 van de Algemene wet inkomensafhankelijke regelingen][ref10], met dien
      verstande dat in het eerste lid van dat artikel voor «belanghebbende» telkens wordt gelezen «huurder»;
        - *huurprijs:* prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woongelegenheid,
      uitgedrukt in een bedrag per maand;
        - *inkomensgrens:* bij algemene maatregel van bestuur voor de toepassing van [artikel 48, eerste lid][ref11], te
      bepalen bedrag;
        - *inspecteur:* als zodanig bij besluit van Onze Minister aangewezen ambtenaar;
        - *juridische scheiding:* organisatievorm van een toegelaten instelling, waarin zij uitsluitend werkzaamheden
      verricht die behoren tot de diensten van algemeen economisch belang, en daarnaast uitsluitend een of meer
      woningvennootschappen in stand houdt;
        - *kwaliteitsverklaring:* schriftelijk bewijs, voorzien van een merkteken, aangewezen door Onze Minister, afgegeven
      door een deskundig, onafhankelijk instituut, aangewezen door Onze Minister, op grond waarvan een bouwmateriaal,
      bouwdeel of samenstel van bouwmaterialen of bouwdelen dan wel een bouwwijze, indien dat bouwmateriaal, bouwdeel of
      samenstel van bouwmaterialen of bouwdelen dan wel die bouwwijze bij het bouwen van een bouwwerk wordt toegepast,
      wordt geacht te voldoen aan krachtens deze wet aan dat bouwmateriaal, bouwdeel of samenstel van bouwmaterialen of
      bouwdelen dan wel die bouwwijze gestelde eisen;
        - *norm:* document, uitgegeven door een deskundig, onafhankelijk instituut, waarin wordt omschreven aan welke eisen
      een bouwmateriaal, bouwdeel of bouwconstructie moet voldoen dan wel waarin een omschrijving wordt gegeven van een
      keurings-, meet- of berekeningsmethode;
        - *omgevingsvergunning:* omgevingsvergunning als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref12];
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *overdragen van de economische eigendom:* overdragen van de economische eigendom als bedoeld in
      [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref13];
        - *raad van commissarissen:* raad van commissarissen als bedoeld in [artikel 30][ref14];
        - *slopen:* afbreken van een bouwwerk of van een gedeelte daarvan;
        - *stadsbouwmeester:* door de gemeenteraad benoemde onafhankelijke deskundige die aan het college van burgemeester
      en wethouders advies uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk, waarvoor
      een aanvraag om een omgevingsvergunning voor het bouwen van dat bouwwerk is ingediend, in strijd is met redelijke
      eisen van welstand;
        - *stedelijke vernieuwing:* op stedelijk gebied gerichte inspanningen die strekken tot verbetering van
      de leefbaarheid en veiligheid, bevordering van een duurzame ontwikkeling en verbetering van de woon- en
      milieukwaliteit, versterking van het economisch draagvlak, versterking van culturele kwaliteiten, bevordering
      van de sociale samenhang, verbetering van de bereikbaarheid, verhoging van de kwaliteit van de openbare ruimte of
      anderszins tot structurele kwaliteitsverhoging van dat stedelijk gebied;
        - *toegelaten instelling:* toegelaten instelling als bedoeld in [artikel 19][ref15];
        - *voorziening:* bouwkundige of bouwtechnische maatregel aan een gebouw die strekt tot verbetering van de indeling,
      het woongerief of het gebruiksgemak, waaronder begrepen de daarbij noodzakelijke opheffing van technische gebreken,
      of tot bouwkundige splitsing of samenvoeging;
        - *welstandscommissie:* door de gemeenteraad benoemde onafhankelijke commissie die aan het college van burgemeester
      en wethouders advies uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk, waarvoor
      een aanvraag om een omgevingsvergunning voor het bouwen van dat bouwwerk is ingediend, in strijd is met redelijke
      eisen van welstand;
        - *wooncoöperatie:* wooncoöperatie als bedoeld in [artikel 18a][ref16];
        - *woongelegenheid:* a. woning met de daarbij behorende grond of het daarbij behorende deel van de grond; b.
      woonwagen, zijnde een voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel
      of in delen kan worden verplaatst, en c. standplaats, zijnde een kavel die is bestemd voor het plaatsen van een
      woonwagen, waarop voorzieningen aanwezig zijn die op het leidingnet van de openbare nutsbedrijven, van andere
      instellingen of van gemeenten kunnen worden aangesloten.


