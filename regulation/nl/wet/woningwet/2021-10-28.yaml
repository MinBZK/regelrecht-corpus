  - number: '133.2'
    text: |-
      Voor gebieden waar op het tijdstip van inwerkingtreding van de [Reparatiewet BZK 2014][ref1] geen
      bestemmingsplan als bedoeld in de [Wet ruimtelijke ordening][ref2] van toepassing is, blijven de
      [artikelen 1, eerste lid, onderdeel g][ref3], [7b, eerste lid][ref4], [8, vijfde en zevende lid][ref5], [10][ref6]
      en [12, derde lid][ref7], zoals die laatstelijk luidden voor het tijdstip van inwerkingtreding van de Reparatiewet
