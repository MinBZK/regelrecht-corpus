  - number: '133.4'
    text: |-
      Op een aanvraag om een omgevingsvergunning voor het bouwen van een bouwwerk, als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1], ingediend op of na
      het tijdstip van inwerkingtreding van de [Reparatiewet BZK 2014][ref2] tot 1 juli 2018, waarbij het bouwen
      plaatsvindt in een gebied waar op het tijdstip van indienen van de aanvraag geen bestemmingsplan als bedoeld in de
      [Wet ruimtelijke ordening][ref3] van toepassing is, alsmede op enig bezwaar of beroep, ingesteld tegen een besluit
      over een dergelijke aanvraag, blijven de [artikelen 1, eerste lid, onderdeel g][ref4], [7b, eerste lid][ref5],
      [8, vijfde en zevende lid][ref6], [10][ref7] en [12, derde lid][ref8], zoals deze laatstelijk luidden voor het
      tijdstip van inwerkingtreding van de Reparatiewet BZK 2014, van toepassing.


