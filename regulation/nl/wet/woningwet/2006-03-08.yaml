  - number: '130.2'
    text: |-
      Bouwvergunningen als bedoeld in [artikel 47, eerste lid, van de Woningwet van 12 juli 1962][ref1], waartegen geen
      beroep meer kan worden ingesteld, gelden als bouwvergunningen als bedoeld in [artikel 40, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel40
