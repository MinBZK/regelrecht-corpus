        bwb_id: BWBR0005181
        artikel: '59'
        hoofdstuk: IV
        afdeling: '1'
  - number: 61a.1
    text: |-
      Het is een toegelaten instelling als bedoeld in [artikel 70, eerste lid][ref1], in bij of krachtens algemene
      maatregel van bestuur aangegeven gevallen, verboden zonder vergunning van Onze Minister haar onroerende zaken
      te vervreemden aan of daarop een recht van erfpacht, van opstal of van vruchtgebruik te vestigen ten behoeve van
      een wederpartij die geen zodanige toegelaten instelling en geen huurder van een onroerende zaak van een zodanige
      toegelaten instelling is. Onze Minister stelt voor het aanvragen van een zodanige vergunning en het in verband
      daarmee door de betrokken toegelaten instelling verstrekken van gegevens een formulier vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
  - number: 61a.2
    text: |-
      Onze Minister kan de in het eerste lid bedoelde vergunning weigeren, indien de toegelaten instelling bij een
      voorgenomen vervreemding aan of vestiging van een recht als bedoeld in dat lid naar zijn oordeel:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
  - number: 61a.2.a
    text: onvoldoende rekening houdt met de gevolgen daarvan voor de huurders van de betrokken onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
  - number: 61a.2.b
    text: |-
      onvoldoende motiveert waarom zij afziet van vervreemding aan of vestiging van een zodanig recht ten behoeve van een
      andere wederpartij, of
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
  - number: 61a.2.c
    text: |-
      de bij of krachtens algemene maatregel van bestuur gegeven, op een handeling als bedoeld in het eerste lid van
      toepassing zijnde voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
  - number: 61a.3
    text: |-
      Onze Minister kan de in het eerste lid bedoelde vergunning intrekken, indien hem blijkt dat hij de vergunning ten
      gevolge van een onjuiste of onvolledige opgave heeft verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
  - number: 61a.4
    text: |-
      Onze Minister kan de in het eerste lid bedoelde vergunning tevens weigeren of intrekken in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 61a.5
    text: |-
      Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '62.1'
    text: |-
      Bij algemene maatregel van bestuur kan, ten einde gegevens te verkrijgen omtrent omvang en samenstelling van de
      woningvoorraad en omtrent gebruik en bezetting van woningen, worden bepaald dat een algemene woningtelling wordt
      gehouden. In die maatregel worden tijdstip, doel en inhoud van de woningtelling omschreven.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel62
  - number: '62.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen nadere voorschriften omtrent
      de woningtelling worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel62
  - number: '62.3'
    text: |-
      De colleges van burgemeester en wethouders verlenen hun medewerking aan de uitvoering van de in het eerste lid
      bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel62
  - number: '62.4'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur worden voorschriften gegeven omtrent de aan
      gemeenten uit ’s Rijks kas toe te kennen vergoeding van ter zake gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel62
  - number: '63.1'
    text: |-
      Bij koninklijk besluit kunnen burgemeester en wethouders worden verplicht, overeenkomstig bij dat besluit te geven
      voorschriften, een bijzonder onderzoek naar de staat van de volkshuisvesting in te stellen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel63
  - number: '63.2'
    text: |-
      Aan gemeenten kunnen financiële middelen uit ’s Rijks kas worden verstrekt ter bestrijding van de kosten, verbonden
      aan een onderzoek als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel63
  - number: '64'
    text: |-
      Onze Minister verstrekt eenmaal per jaar aan de Staten-Generaal een verslag van de aard en het aantal van de
      woningen die in het jaar, voorafgaand aan het jaar waarin het verslag wordt aangeboden, zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel64
  - number: '65.1'
    text: |-
      Burgemeester en wethouders alsmede gedeputeerde staten verstrekken overeenkomstig bij of krachtens algemene
      maatregel van bestuur gegeven voorschriften informatie ten behoeve van de door Onze Minister ingevolge
      [artikel 64][ref1] aan de Staten-Generaal te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel64
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '64'
        hoofdstuk: V
        afdeling: '2'
  - number: '65.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden in elk geval voorschriften
      gegeven omtrent de aard en omvang van de te verstrekken informatie, de instanties die, alvorens de informatie
      wordt verstrekt, moeten worden gehoord, alsmede de wijze waarop, het tijdstip waarop en de instantie waaraan de
      informatie moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel65
  - number: '69'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 65][ref1], treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel65
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '65'
        hoofdstuk: V
        afdeling: '2'
  - number: '70.1'
    text: |-
      Verenigingen met volledige rechtsbevoegdheid en stichtingen, die zich ten doel stellen uitsluitend op het gebied
      van de volkshuisvesting werkzaam te zijn en niet beogen uitkeringen te doen anders dan in het belang van de
      volkshuisvesting, kunnen bij koninklijk besluit worden toegelaten als instellingen, uitsluitend in het belang van
      de volkshuisvesting werkzaam.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70
  - number: '70.2'
    text: |-
      De toelating, bedoeld in het eerste lid, kan bij koninklijk besluit worden geweigerd of ingetrokken. De toelating
      wordt in elk geval geweigerd, indien de vereniging of de stichting niet voldoet aan het eerste lid of de toelating
      niet in het belang van de volkshuisvesting is te achten. De toelating wordt ingetrokken, indien de toegelaten
      instelling niet langer uitsluitend op het gebied van de volkshuisvesting werkzaam is of uitkeringen doet anders dan
      in het belang van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70
  - number: '70.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere dan de in het tweede lid bedoelde gevallen worden aangegeven,
      waarin de toelating wordt of kan worden geweigerd dan wel wordt of kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70
  - number: '70.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de toelating, alsmede omtrent
      weigering en intrekking van de toelating. Daarbij kan worden bepaald, dat de statuten van de vereniging of de
      stichting voorschrijven dat bij ontbinding van de vereniging of de stichting de vereffening geschiedt door een of
      meer door burgemeester en wethouders van de gemeente, waar de vereniging of de stichting haar woonplaats heeft,
      aangewezen vereffenaars.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70
  - number: 70a.1
    text: |-
      Bij koninklijk besluit kan worden bepaald dat de toegelaten instellingen binnen een bij dat besluit gestelde
      termijn hun statuten moeten aanpassen aan de voorschriften omtrent de toelating, zoals deze luiden op de dag waarop
      dat besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70a
  - number: 70a.2
    text: |-
      Indien een toegelaten instelling geen uitvoering geeft aan een besluit als bedoeld in het eerste lid, kan de
      toelating worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70a
  - number: 70b.1
    text: |-
      Tegen een koninklijk besluit dat strekt tot intrekking van de toelating staat beroep open bij de Afdeling
      bestuursrechtspraak van de Raad van State. De Afdeling oordeelt in hoogste ressort over het beroep. Zij geeft
      daarbij aanvankelijk overeenkomstige toepassing aan [artikel 8:52 van de Algemene wet bestuursrecht][ref1] en kan
      nadien overeenkomstige toepassing geven aan [artikel 8:53 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 70b.2
    text: |-
      Nadat een koninklijk besluit dat strekt tot intrekking van de toelating onherroepelijk is geworden, wordt de
      vereniging of de stichting op vordering van Onze Minister ontbonden door de rechtbank binnen welker rechtsgebied
      zij gevestigd is.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70b
  - number: 70c.1
    text: |-
      De toegelaten instellingen huisvesten bij voorrang personen die door hun inkomen of door andere omstandigheden
      moeilijkheden ondervinden bij het vinden van hun passende huisvesting. Bij het in gebruik geven van door hen
      beheerde woningen met een verhoudingsgewijs lage huurprijs geven zij zo veel mogelijk voorrang aan woningzoekenden
      die, gelet op hun inkomen, in het bijzonder op die woningen zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2
    text: |-
      De toegelaten instellingen nemen bij hun werkzaamheden voorts de daaromtrent bij of krachtens algemene maatregel
      van bestuur gegeven voorschriften in acht. Deze voorschriften betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.a
    text: het verwerven, bouwen, bezwaren en vervreemden van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.b
    text: het treffen van voorzieningen aan woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.c
    text: het verhuren van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.d
    text: de wijze van beheer van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.e
    text: de exploitatie van woningen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.f
    text: de bestemming van batige saldi;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.g
    text: het financiële beleid en beheer;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.h
    text: de verslaglegging;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.i
    text: de inrichting van de administratie en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.2.j
    text: overleg met en verplichtingen ten opzichte van huurders.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur kan worden bepaald dat het eerste lid, alsmede
      voorschriften als bedoeld in het tweede lid, van toepassing zijn op gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70c.4
    text: |-
      Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kunnen de in dat lid genoemde
      voorschriften voorts worden gegeven voor standplaatsen en woonwagens, instellingen waarin aan ten minste vijf
      personen van 65 jaar of ouder duurzaam verblijf en verzorging wordt verschaft, onroerende aanhorigheden van
      woningen, standplaatsen, woonwagens en zodanige verzorgingshuizen, alsmede de woonomgeving.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70c
  - number: 70d.1
    text: |-
      De toegelaten instellingen staan onder toezicht van Onze Minister, behoudens
      [artikel 71a, eerste lid, aanhef en onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
  - number: 70d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden omtrent het toezicht nadere voorschriften gegeven. Daarbij
      kan worden bepaald dat in de bij die maatregel aangegeven gevallen:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70d
  - number: 70d.2.a
    text: |-
      Onze Minister een toegelaten instelling een aanwijzing kan geven om een of meer handelingen te verrichten of na
      te laten;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70d
  - number: 70d.2.b
    text: een toegelaten instelling bepaalde handelingen slechts kan verrichten na voorafgaande goedkeuring of
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70d
  - number: 70d.2.c
    text: |-
      ten behoeve van door een toegelaten instelling te verrichten handelingen een plan wordt opgesteld door een door
      Onze Minister aan te wijzen persoon of instantie.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70d
  - number: 70e.1
    text: |-
      Indien een toegelaten instelling ernstige schade aan het belang van de volkshuisvesting berokkent, redelijkerwijs
      in die situatie geen verbetering te voorzien is en een andere daartegen gerichte maatregel dan het onder bewind
      stellen van die toegelaten instelling niet doeltreffender zou zijn, kan de rechtbank binnen welker rechtsgebied die
      toegelaten instelling gevestigd is haar onder bewind stellen op een daartoe strekkend verzoek van Onze Minister.
      Onze Minister kan bij zijn verzoek personen voor benoeming tot bewindvoerder voordragen en voorstellen doen omtrent
      hun beloning.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70e
  - number: 70e.2
    text: |-
      De rechtbank behandelt het verzoek binnen twee weken nadat hij het heeft ontvangen. Hij kan inzage nemen of,
      door daartoe door hem aangewezen deskundigen, doen nemen van zakelijke gegevens en bescheiden van de betrokken
      toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70e
  - number: 70e.3
    text: |-
      Een toegelaten instelling die surseance van betaling heeft aangevraagd, aan welke surseance van betaling is
      verleend, van welke het faillissement is aangevraagd of die failliet is verklaard kan niet onder bewind worden
      gesteld in de zin van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70e
  - number: 70f.1
    text: |-
      Bij een beslissing waarbij een toegelaten instelling onder bewind wordt gesteld, benoemt de rechtbank een of meer
      bewindvoerders en regelt hij hun beloning. De beloning komt voor rekening van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70f
  - number: 70f.2
    text: |-
      De bewindvoerders maken onverwijld een uittreksel van de uitspraak bekend in de Staatscourant en in een of meer bij
      de uitspraak aangewezen nieuwsbladen. Het uittreksel vermeldt naam en woonplaats van de toegelaten instelling en de
      woonplaats of het kantoor van de bewindvoerders, alsmede de datum van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70f
  - number: 70f.3
    text: |-
      De uitspraak is uitvoerbaar bij voorraad, onverminderd enige daartegen gerichte voorziening. Gedurende acht dagen
      na de uitspraak kan daartegen hoger beroep worden ingesteld bij het gerechtshof binnen welks rechtsgebied de
      betrokken toegelaten instelling gevestigd is. Het gerechtshof behandelt het beroep binnen twee weken nadat het het
      beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70f
  - number: 70f.4
    text: |-
      Gedurende acht dagen na de uitspraak van het gerechtshof in hoger beroep kan daartegen beroep in cassatie worden
      ingesteld. De Hoge Raad behandelt het beroep binnen twee weken nadat hij het beroepschrift heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70f
  - number: 70g.1
    text: |-
      De bewindvoerders oefenen bij uitsluiting alle bevoegdheden uit van de organen van de toegelaten instelling, tenzij
      de rechtbank heeft bepaald dat een orgaan zijn bevoegdheden kan blijven uitoefenen. Zij doen voorts onverwijld
      aan de Kamer van Koophandel en Fabrieken binnen welker gebied de toegelaten instelling gevestigd is opgaaf van de
      uitspraak van de rechtbank en van de gegevens omtrent zichzelf die omtrent een bestuurder worden verlangd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70g
  - number: 70g.2
    text: |-
      Een rechtshandeling die door een orgaan van de toegelaten instelling wordt verricht na de uitspraak van de
      rechtbank en voor het tijdstip waarop degenen die bij die rechtshandeling een belang hebben voor het eerst van
      die uitspraak kennis kunnen nemen, is geldig. Het tijdstip, bedoeld in de eerste volzin, is de tweede dag na de
      dagtekening van de Staatscourant waarin een uittreksel van die uitspraak is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70g
  - number: 70h.1
    text: |-
      De leden van de organen van de toegelaten instelling en de personen die voor haar werkzaamheden verrichten,
      verlenen alle door de bewindvoerders gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70h
  - number: 70h.2
    text: |-
      Indien meer dan een bewindvoerder is benoemd, is voor de geldigheid van hun handelingen toestemming van de
      meerderheid of, bij staking van stemmen, een beslissing van de president van de rechtbank vereist.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70h
  - number: 70h.3
    text: |-
      De rechtbank kan te allen tijde een bewindvoerder ontslaan en hem door een andere bewindvoerder vervangen, dan
      wel aan hem een of meer bewindvoerders toevoegen, een en ander ambtshalve dan wel op verzoek van die bewindvoerder
      zelf, van een of meer andere bewindvoerders of van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70h
  - number: 70h.4
    text: |-
      De bewindvoerders brengen tijdens de uitoefening van hun bevoegdheden telkens na verloop van drie maanden, alsmede
      na beëindiging daarvan, zo spoedig mogelijk verslag over hun werkzaamheden uit aan de rechtbank en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70h
  - number: 70i.1
    text: |-
      Het bewind eindigt twee jaar na de uitspraak van de rechtbank waarbij de betrokken toegelaten instelling onder
      bewind is gesteld. Het bewind eindigt voorts met onmiddellijke ingang na het onherroepelijk worden van een
      benoeming van een of meer bewindvoerders in een aan de betrokken toegelaten instelling verleende surseance van
      betaling of van een of meer curatoren in haar faillissement.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70i
  - number: 70i.2
    text: |-
      Indien naar het oordeel van Onze Minister voor het tijdstip, genoemd in de eerste volzin van het eerste
      lid, de voorwaarden zijn geschapen waaronder de toelating niet langer ernstige schade aan het belang van de
      volkshuisvesting berokkent en niet op korte termijn ernstige schade aan dat belang zal berokkenen, verzoekt hij
      de rechtbank het bewind op te heffen. Bij zijn besluit waarbij het bewind wordt opgeheven, ontslaat de rechtbank
      de bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70i
  - number: 70j.1
    text: |-
      Verenigingen met volledige rechtsbevoegdheid en stichtingen, die mede in het belang van de volkshuisvesting
      werkzaam zijn, kunnen bij koninklijk besluit als toegelaten instelling worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70j
  - number: 70j.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de toelating, weigering en
      intrekking van de toelating, alsmede omtrent de werkzaamheden van en het toezicht op instellingen als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70j
  - number: 70j.3
    text: |-
      De [artikelen 70, tweede, derde en vierde lid][ref1], [70a][ref2], [70b][ref3], [70d tot en met 70i][ref4] en
      [105][ref5] zijn voorzover mogelijk van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70b
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel105
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70j
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70a
        hoofdstuk: V
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 70b
        hoofdstuk: V
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 70d
        hoofdstuk: V
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '105'
        hoofdstuk: VIII
  - number: 70k
    text: |-
      Een algemene maatregel van bestuur als bedoeld in de [artikelen 70][ref1], [70c][ref2], [70d][ref3] en [70j][ref4]
      treedt niet eerder in werking dan twee maanden na de datum van uitgifte van het Staatsblad waarin hij is geplaatst.
      Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70j
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel70k
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70c
        hoofdstuk: V
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 70d
        hoofdstuk: V
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 70j
        hoofdstuk: V
        afdeling: '3'
  - number: '71'
    text: |-
      Er is een Centraal Fonds voor de Volkshuisvesting. Het Centraal Fonds voor de Volkshuisvesting bezit
      rechtspersoonlijkheid. Het is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71
  - number: 71a.1
    text: 'Het fonds:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71a
  - number: 71a.1.a
    text: |-
      verstrekt subsidie aan toegelaten instellingen ter bevordering van de sanering van toegelaten instellingen die
      niet beschikken over de noodzakelijk te achten financiële middelen, of, volgens bij algemene maatregel van bestuur
      gegeven voorschriften, ter tegemoetkoming in de kosten van werkzaamheden van toegelaten instellingen, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71a
  - number: 71a.1.b
    text: |-
      verricht taken in het kader van het toezicht op toegelaten instellingen, voorzover die taken bij algemene maatregel
      van bestuur zijn aangegeven, welke taken de financiële aspecten van de werkzaamheden van die instellingen betreffen
      en tot welke taken kan behoren het aan Onze Minister verschaffen van inzicht in de financiële situatie van die
      instellingen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71a
  - number: 71a.2
    text: Uit het fonds worden geen garanties verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71a
  - number: 71a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent maatregelen die het fonds jegens
      toegelaten instellingen kan nemen bij het door hen niet nakomen van een jegens het fonds bestaande verplichting.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71a
  - number: 71a.4
    text: |-
      Onze Minister informeert beide kamers der Staten-Generaal over het hem verschafte inzicht in de financiële
      situatie, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71a
  - number: 71b.1
    text: |-
      Het fonds stelt jaarlijks voor 1 december beleidsregels vast, waarin wordt bepaald op welke wijze het fonds
      uitvoering geeft aan [artikel 71a][ref1] en de daarop berustende algemene maatregelen van bestuur. De beleidsregels
      zijn van toepassing op het eerstvolgende kalenderjaar. Het fonds doet een afschrift van de beleidsregels aan Onze
      Minister toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
  - number: 71b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de inhoud en de
      bekendmaking van de in het eerste lid bedoelde beleidsregels.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71b
  - number: 71c.1
    text: |-
      Het bestuur van het fonds bestaat met inbegrip van de voorzitter uit ten minste drie en ten hoogste vijf leden.
      Onze Minister benoemt de voorzitter en de andere bestuursleden.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71c.2
    text: De bestuursleden worden, behoudens tussentijds ontslag, benoemd voor de tijd van ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71c.3
    text: |-
      De bestuursleden kunnen te allen tijde ontslag nemen door een schriftelijke kennisgeving aan Onze Minister. Degene
      die in het bestuur is benoemd ter vervulling van een tussentijds opengevallen plaats treedt af op het tijdstip
      waarop degene in wiens plaats de benoeming is geschied had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71c.4
    text: 'Onverenigbaar met het bestuurslidmaatschap van het fonds zijn:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71c.4.a
    text: |-
      het lidmaatschap van een orgaan van, en een functie bij, een toegelaten instelling of een organisatie die zich ten
      doel heeft gesteld de belangen van toegelaten instellingen te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71c.4.b
    text: |-
      het lidmaatschap van een college van burgemeester en wethouders of van een orgaan van een organisatie die zich ten
      doel heeft gesteld de belangen van gemeenten te behartigen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71c.4.c
    text: een functie als ambtenaar bij een ministerie en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71c.4.d
    text: |-
      een functie als ambtenaar bij een gemeente, een functie bij een organisatie als bedoeld in onderdeel b, een functie
      bij een financiële instelling en enige andere functie, indien de aan de betrokken functie verbonden werkzaamheden
      meebrengen dat een betrokkenheid ontstaat of kan ontstaan bij de werkzaamheden van het fonds of bij de ontwikkeling
      of de uitvoering van het rijksbeleid op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71c
  - number: 71d.1
    text: Het fonds stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71d
  - number: 71d.2
    text: |-
      Het bestuursreglement en elke wijziging daarvan behoeft de goedkeuring van Onze Minister. Onze Minister kan het
      bestuursreglement gedeeltelijk goedkeuren of aan de goedkeuring voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71d
  - number: 71d.3
    text: |-
      Indien Onze Minister het voornemen heeft aan het bestuursreglement geheel of gedeeltelijk goedkeuring te onthouden,
      dan wel voorwaarden aan de goedkeuring te verbinden, stelt hij het fonds daarvan in kennis en stelt hij het in de
      gelegenheid binnen ten hoogste vier weken na die kennisgeving wijzigingen in het bestuursreglement aan te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71d
  - number: 71e.1
    text: De middelen van het fonds worden gevormd door de bijdragen, bedoeld in het tweede lid, en andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71e
  - number: 71e.2
    text: |-
      Elke toegelaten instelling die op 1 januari van een kalenderjaar als zodanig bestaat, is over dat kalenderjaar een
      bijdrage aan het fonds verschuldigd. Het fonds bepaalt de hoogte van de bijdrage volgens bij of krachtens algemene
      maatregel van bestuur te geven voorschriften. Het besluit tot bepaling van de hoogte van de bijdrage behoeft de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71e
  - number: 71e.3
    text: |-
      Onze Minister kan, indien hij van oordeel is dat het fonds op de in het tweede lid bedoelde datum over voldoende
      financiële middelen zal beschikken om zonder storting van een bijdrage als bedoeld in dat lid ten minste een jaar
      uitvoering te geven aan [artikel 71a, eerste lid][ref1], voor die datum bepalen dat een zodanige bijdrage niet
      verschuldigd is over het jaar waarin die datum valt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
  - number: 71f.1
    text: |-
      Het fonds stelt jaarlijks voor 1 november een begroting vast voor het volgende kalenderjaar.
      De begroting wordt niet vastgesteld dan nadat Onze Minister daarmee heeft ingestemd. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 71f.2
    text: Bij ministeriële regeling kunnen voorschriften omtrent de inrichting van de begroting worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71f
  - number: 71g.1
    text: |-
      Het fonds brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over het afgelopen kalenderjaar
      uit, dat vergezeld gaat van een verklaring omtrent de getrouwheid van de jaarrekening en de rechtmatigheid van
      de gedane uitgaven, afgegeven door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het
      Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71g
  - number: 71g.2
    text: Het fonds stelt de in het eerste lid genoemde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71g
  - number: 71g.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent het financiële verslag en de
      accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71g
  - number: 71h
    text: |-
      Het fonds stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71h
  - number: 71i
    text: |-
      Het fonds verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71i
  - number: 71j.1
    text: |-
      De rechtspositie van het personeel van het fonds is in overeenstemming met de regels die gelden voor ambtenaren die
      zijn aangesteld bij ministeries, met dien verstande dat waar in deze regels een bevoegdheid is toegekend aan een
      andere minister dan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, deze bevoegdheid wordt uitgeoefend
      door het bestuur van het fonds.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71j
  - number: 71j.2
    text: Bij algemene maatregel van bestuur kan worden afgeweken van de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71j
  - number: 71k.1
    text: |-
      Indien naar het oordeel van Onze Minister het fonds ernstig in gebreke blijft of op korte termijn ernstig in
      gebreke zal blijven bij het verrichten van zijn taken, kan hij het bestuur van het fonds schorsen of ontslaan,
      in welke gevallen hij in vervanging van het geschorste of ontslagen bestuur voorziet, met dien verstande dat een
      schorsing niet langer duurt dan noodzakelijk is om de voorwaarden te scheppen waaronder het fonds naar het oordeel
      van Onze Minister zijn taken weer naar behoren kan verrichten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71k
  - number: 71k.2
    text: |-
      Indien en zolang een geschorst of ontslagen bestuur niet kan worden vervangen, verricht Onze Minister de taken van
      het fonds, in welk geval:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71k
  - number: 71k.2.a
    text: dit geschiedt op kosten van het fonds en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71k
  - number: 71k.2.b
    text: Onze Minister dit onverwijld meedeelt aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71k
  - number: 71l
    text: |-
      Onze Minister zendt zo spoedig mogelijk na 1 januari 2002 en vervolgens telkens na vier jaar aan de Staten-Generaal
      een verslag over de doeltreffendheid en doelmatigheid van het functioneren van het fonds.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel71l
  - number: '73'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in de [artikelen 71a][ref1], [71b][ref2] en [71e][ref3], treedt niet
      eerder in werking dan twee maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de
      plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel71b
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel71e
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
        hoofdstuk: V
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 71b
        hoofdstuk: V
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 71e
        hoofdstuk: V
        afdeling: 3A
  - number: '75.1'
    text: |-
      Burgemeester en wethouders kunnen, ingeval dit noodzakelijk is voor het naar behoren uitvoeren van deze wet,
      besluiten rechtstreeks van gemeentewege voorzieningen in het belang van de volkshuisvesting te treffen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel75
  - number: '75.2'
    text: |-
      Indien ter uitvoering van het eerste lid van gemeentewege woningen, woonwagens of standplaatsen worden gebouwd,
      geschiedt dit slechts, indien aannemelijk is, dat door het bouwen van woningen, woonwagens of standplaatsen door
      toegelaten instellingen niet voldoende in de woningbehoefte zal worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel75
  - number: '80.1'
    text: |-
      Indien blijkt, dat in een gemeente onvoldoende wordt voorzien in de volkshuisvesting, kan bij koninklijk besluit,
      gedeputeerde staten gehoord, de gemeenteraad onderscheidenlijk burgemeester en wethouders of het bevoegde gezag van
      een samenwerkingsverband van gemeenten worden verplicht de in dat besluit aangegeven voorzieningen in het belang
      van de volkshuisvesting te treffen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel80
  - number: '80.2'
    text: |-
      Indien blijkt, dat in een provincie onvoldoende wordt voorzien in de volkshuisvesting, kunnen bij koninklijk
      besluit, de inspecteur gehoord, provinciale staten of gedeputeerde staten worden verplicht de in dat besluit
      aangegeven voorzieningen in het belang van de volkshuisvesting te treffen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel80
  - number: '80.3'
    text: |-
      Bij het in het eerste en tweede lid bedoelde besluit kan worden bepaald op welke wijze en binnen welke termijn aan
      dat besluit moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel80
  - number: '80.4'
    text: |-
      Indien de gemeenteraad onderscheidenlijk burgemeester en wethouders of het bevoegde gezag van het
      samenwerkingsverband van gemeenten niet binnen de in het derde lid bedoelde termijn heeft voldaan aan het in het
      eerste lid bedoelde besluit, geven gedeputeerde staten uitvoering aan dat besluit op kosten van de gemeente of het
      samenwerkingsverband van gemeenten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel80
  - number: '80.5'
    text: |-
      Indien provinciale staten of gedeputeerde staten niet binnen de in het derde lid bedoelde termijn hebben voldaan
      aan het in het tweede lid bedoelde besluit, geeft Onze Minister uitvoering aan dat besluit op kosten van de
      provincie.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel80
  - number: '80.6'
    text: |-
      Indien hetgeen ingevolge het derde lid is bepaald, niet strookt met de voorschriften van enige plaatselijke,
      regionale of provinciale verordening, blijven die voorschriften buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel80
  - number: '81.1'
    text: |-
      Uit 's Rijks kas kunnen aan gemeenten, plusregio’s als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] of provincies financiële middelen worden verstrekt
      voor andere activiteiten dan die waarvoor ingevolge de [Wet stedelijke vernieuwing][ref2] subsidie kan worden
      verleend, voorzover deze activiteiten passen in het rijksbeleid met betrekking tot het bouwen, het wonen en de
      woonomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0011788
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0011788
  - number: '81.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent het verstrekken van financiële
      middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: '81.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen voorschriften worden gegeven omtrent het
      door provincies overdragen van krachtens het tweede lid aan hen toegekende bevoegdheden en verplichtingen aan een
      gemeente of aan een plusregio. De voorschriften betreffen in elk geval:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: 81.3.a
    text: het geval waarin een provincie bevoegdheden en verplichtingen al dan niet dient over te dragen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: 81.3.b
    text: |-
      de gehoudenheid van een provincie uitvoering te geven aan een door Onze Minister gegeven aanwijzing ter zake van
      een overdracht als bedoeld in onderdeel a, binnen een in die aanwijzing bepaalde termijn, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: 81.3.c
    text: de wijze waarop in geval van overdracht verantwoording aan Onze Minister wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: '81.4'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kan worden bepaald dat de
      gemeenteraad, het algemeen bestuur van een plusregio of provinciale staten voorschriften geeft of geven omtrent
      het door burgemeester en wethouders, het dagelijks bestuur van een plusregio of gedeputeerde staten verstrekken van
      subsidie ten laste van de uit ’s Rijks kas aan hen verstrekte financiële middelen voor de activiteiten, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: '81.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bevordering van eenheid in de voorschriften, bedoeld in het vierde
      lid, regelen worden gegeven omtrent de inhoud van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: '81.6'
    text: |-
      De gemeenteraad, het algemeen bestuur van een plusregio of provinciale staten brengen de door hen gegeven
      voorschriften, bedoeld in het vierde lid, binnen zes maanden na het van kracht worden van de algemene maatregel
      van bestuur, bedoeld in het vijfde lid, in overeenstemming met de bij die algemene maatregel van bestuur gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel81
  - number: '82.1'
    text: |-
      Uit 's Rijks kas kan aan anderen dan gemeenten, plusregio's als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] of provincies subsidie worden verstrekt voor andere
      activiteiten dan die waarvoor ingevolge de [artikelen 19][ref2] en [20 van de Wet stedelijke vernieuwing][ref3]
      subsidie kan worden verleend, voorzover deze activiteiten passen in het rijksbeleid met betrekking tot het bouwen,
      het wonen en de woonomgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0011788#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0011788#Artikel20
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0011788
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0011788
        artikel: '20'
  - number: '82.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent het verstrekken van subsidie,
      bedoeld in het eerste lid. De voorschriften betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.a
    text: de doeleinden waarvoor de subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.b
    text: degenen aan wie de subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.c
    text: de wijze van aanvragen van de subsidie;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.d
    text: de bij de subsidie-aanvraag over te leggen gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.e
    text: de termijnen voor de beslissing op de subsidie-aanvraag;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.f
    text: de gronden om geen subsidie te verstrekken;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.g
    text: de voorwaarden waaronder de subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.h
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.i
    text: de totstandkoming van het subsidiebedrag;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.j
    text: de termijnen voor de beslissing omtrent de subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.k
    text: de vaststelling van het subsidieplafond en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: 82.2.l
    text: de wijze van verdeling van het beschikbare bedrag.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel82
  - number: '83'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in de [artikelen 81][ref1] en [82][ref2], treedt niet eerder in
      werking dan twee maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing
      wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel82
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '81'
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '82'
        hoofdstuk: V
        afdeling: '5'
  - number: '84'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het door burgemeester
      en wethouders, gedeputeerde staten en het dagelijks bestuur van een samenwerkingsverband van gemeenten verstrekken
      van voor het verstrekken van financiële middelen van belang zijnde gegevens. De financiële gevolgen van het
      verstrekken van die gegevens worden niet gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel84
  - number: '86'
    text: |-
      Gegevens betreffende de door het Rijk verstrekte financiële middelen en subsidie worden jaarlijks op een door Onze
      Minister te bepalen wijze bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel86
  - number: '88.1'
    text: |-
      Alle stukken, opgemaakt ter uitvoering van de afdelingen 4 en 5 van dit hoofdstuk, voor zover die stukken
      betrekking hebben op bij of krachtens algemene maatregel van bestuur gegeven categorieën van woningen,
      standplaatsen of woonwagens, zijn vrij van legesheffing, van de kosten van legalisatie en van griffiekosten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel88
  - number: '88.2'
    text: |-
      De in het eerste lid bedoelde vrijdom van legesheffing geldt niet ten aanzien van bij de in dat lid bedoelde
      algemene maatregel van bestuur aangewezen vormen van legesheffing. Bij die algemene maatregel van bestuur kunnen
      ter zake nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel88
  - number: '93.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel93
  - number: '93.2'
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel93
  - number: '94.1'
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel94
  - number: '94.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '94.3'
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel94
  - number: '95.1'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking zenden burgemeester en wethouders aan de inspecteur
      een afschrift van elke verordening, elk besluit of elk aan de raad overlegd verslag, de volkshuisvesting
      betreffende. De financiële gevolgen van het zenden van die afschriften worden niet gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel95
  - number: '95.2'
    text: |-
      Burgemeester en wethouders geven aan de inspecteur alle door deze verlangde inlichtingen omtrent de naleving van de
      wetten en de krachtens die wetten gegeven voorschriften op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel95
  - number: '96.1'
    text: |-
      Met het toezicht op de uitvoering van het bij of krachtens deze wet bepaalde zijn tevens belast de bij besluit van
      de commissaris van de Koning aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel96
  - number: '96.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '97.1'
    text: |-
      Indien overtreding van de bij of krachtens [hoofdstuk I][ref1], [II][ref2], [III][ref3], of [IV][ref4]
      gegeven voorschriften met betrekking tot de staat of het gebruik van een gebouw, open erf of terrein
      gepaard gaat met een bedreiging van de leefbaarheid of een gevaar voor de veiligheid of de gezondheid,
      en er een klaarblijkelijk gevaar is op herhaling van de overtreding, kunnen burgemeester en wethouders
      besluiten dat gebouw, dat open erf of dat terrein te sluiten. De [artikelen 5:24, vierde lid][ref5], en
      [5:25 tot en met 5:28 van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005181
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005181
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '97.2'
    text: |-
      Burgemeester en wethouders bepalen in het besluit, bedoeld in het eerste lid, de duur van de
      sluiting en doen dat besluit zo spoedig mogelijk inschrijven in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1]. [Artikel 24 van dat boek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '100.1'
    text: 'Burgemeester en wethouders voorzien in het bouw- en woningtoezicht, dat in elk geval tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
  - number: 100.1.a
    text: |-
      het onderzoeken van de staat van de volkshuisvesting in de gemeente, waaronder begrepen het wonen in woonwagens op
      standplaatsen, en het aangeven van middelen tot verbetering daarvan;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
  - number: 100.1.b
    text: |-
      het binnen de gemeente uitoefenen van toezicht op de naleving van de bij of krachtens deze wet gegeven
      voorschriften en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
  - number: 100.1.c
    text: het verrichten van andere werkzaamheden in verband met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
  - number: '100.2'
    text: |-
      Met de in het eerste lid, onderdeel b, bedoelde taak zijn belast de bij besluit van burgemeester en wethouders
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
  - number: '100.3'
    text: |-
      Toepassing van bestuursdwang bestaande uit het stilleggen van bouw- of sloopwerkzaamheden indien wordt gebouwd
      of gesloopt in strijd met de bij of krachtens deze wet gegeven voorschriften, vindt slechts plaats in bij de
      bouwverordening aangewezen gevallen en overeenkomstig daarbij gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
  - number: '100.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het uitoefenen van
      toezicht op de naleving van de bij of krachtens de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur
      gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '100.5'
    text: |-
      De krachtens het tweede lid aangewezen ambtenaren zijn bevoegd met medeneming van de benodigde apparatuur een
      woning binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel100
  - number: '101.1'
    text: |-
      Onverminderd de artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden kunnen,
      ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de artikelen 101a, 102, en 103 gezamenlijk in werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel101
  - number: '101.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel101
  - number: '101.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel101
  - number: '101.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel101
  - number: '101.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel101
  - number: '101.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel101
  - number: '104'
    text: |-
      Indien toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gegeven voorschriften leidt
      tot het slopen van een bouwwerk, worden de overblijvende materialen door burgemeester en wethouders in het openbaar
      verkocht, tenzij, naar redelijkerwijs is te verwachten, bij onderhandse verkoop een hogere opbrengst kan worden
      verkregen. De opbrengst wordt, na aftrek van de kosten van het slopen en van de verkoop, aan de rechthebbende
      uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel104
  - number: '105.1'
    text: |-
      Onze Minister kan aan een toegelaten instelling die in strijd handelt met het bepaalde bij of
      krachtens [artikel 70][ref1], [70a][ref2] of [70c][ref3], of met een maatregel als bedoeld in
      [artikel 70d, tweede lid, tweede volzin, onderdeel a, b of c][ref4], een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70a
        hoofdstuk: V
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 70c
        hoofdstuk: V
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 70d
        hoofdstuk: V
        afdeling: '3'
  - number: '105.2'
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '105.3'
    text: |-
      Dwangsommen die zijn verbeurd door toepassing van het eerste lid worden gestort in het Centraal Fonds voor de
      Volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel105
  - number: 105a
    text: |-
      Overtreding van [artikel 16a, vijfde lid, eerste volzin][ref1], wordt gestraft met geldboete van de eerste
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 16a
        hoofdstuk: III
        afdeling: '2'
  - number: '106'
    text: |-
      Degene, die wederrechtelijk het kenteken, bedoeld in [artikel 31][ref1], wegneemt, vernielt of beschadigt, wordt
      gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel31
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '31'
        hoofdstuk: III
        afdeling: '3'
  - number: '107'
    text: |-
      Overtreding van de [ artikelen 21, eerste lid][ref1], [32][ref2], [36, derde lid][ref3], [43][ref4] of
      [45, zesde lid][ref5], wordt gestraft met hechtenis van ten hoogste vier maanden of geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '32'
        hoofdstuk: III
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '36'
        hoofdstuk: III
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
  - number: '108'
    text: |-
      Overtreding van [artikel 40][ref1] wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
  - number: '109'
    text: |-
      Overtreding van de [artikelen 60][ref1] of [61][ref2] wordt gestraft met hechtenis van ten hoogste vier maanden of
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '60'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '3'
  - number: '110.1'
    text: |-
      Behoudens het tweede lid, wordt overtreding van voorschriften, die ter uitvoering van deze wet zijn gegeven, voor
      zover de overtreding van die voorschriften uitdrukkelijk als strafbaar feit is aangeduid, gestraft met hechtenis
      van ten hoogste vier maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel110
  - number: '110.2'
    text: |-
      Overtreding van een krachtens [artikel 120][ref1] gegeven voorschrift, voor zover de overtreding van
      dat voorschrift uitdrukkelijk als strafbaar feit is aangeduid, is een economisch delict in de zin van de
      [Wet op de economische delicten][ref2] en wordt opgespoord, vervolgd en berecht overeenkomstig die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002063
  - number: '111'
    text: |-
      De in de [artikelen 105a tot en met 110][ref1] bedoelde strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel106
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '106'
        hoofdstuk: VIII
  - number: '112'
    text: |-
      Overtreding van artikel 103 is een economisch delict in de zin van de [Wet op de economische delicten][ref1] en
      wordt opgespoord, vervolgd en berecht overeenkomstig die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0002063
  - number: '113.1'
    text: |-
      Met de opsporing van de bij de [artikelen 105a tot en met 110, eerste lid][ref1], strafbaar gestelde feiten zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref2], belast:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '106'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 113.1.a
    text: de bij besluit van Onze Minister aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel113
  - number: 113.1.b
    text: |-
      de door de burgemeester aangewezen ambtenaren, belast met de in [artikel 100, eerste lid][ref1], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel100
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '100'
        hoofdstuk: VI
        afdeling: '2'
  - number: '113.2'
    text: |-
      Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref1] en [184 van het Wetboek van Strafrecht][ref2], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '113.3'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel a, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel113
  - number: '114'
    text: |-
      Bij het opsporen van een strafbaar feit als bedoeld in de [artikelen 105a tot en met 110, eerste lid][ref1], hebben
      de in [artikel 113][ref2] bedoelde ambtenaren en personen toegang tot elke plaats, voor zover dat redelijkerwijs
      voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel113
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '106'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '113'
        hoofdstuk: VIII
  - number: '115'
    text: |-
      Ambtenaren, belast met de opsporing van delicten als bedoeld in [artikel 112][ref1], kunnen, indien een bouwwerk
      als bedoeld in artikel 103, eerste lid, wordt uitgevoerd zonder of in afwijking van de in dat lid bedoelde
      toestemming, vorderen dat het werk wordt stilgelegd. Zo nodig leggen zij deze vordering met behulp van de sterke
      arm ten uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel112
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '112'
        hoofdstuk: VIII
  - number: '116'
    text: |-
      Op de gezamenlijke voordracht van Onze Minister en van Onze Minister die het mede aangaat, kan bij koninklijk
      besluit worden bepaald, dat deze wet niet van toepassing is op een in dat besluit aan te wijzen werk ten behoeve
      van de landsverdediging.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel116
  - number: '118'
    text: |-
      Indien de bekendmaking van beschikkingen op grond van deze wet niet kan geschieden op de wijze als voorzien in
      [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1], geschiedt zij door openbare bekendmaking op
      het perceel waarop de beschikking betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '120'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met het oog op de nakoming van
      voor Nederland verbindende internationale verplichtingen die betrekking hebben op of samenhangen met onderwerpen
      waarin bij of krachtens deze wet is voorzien.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel120
  - number: 120a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat Onze Minister bij wege van experiment
      tijdelijk van bij of krachtens algemene maatregel van bestuur gegeven voorschriften kan afwijken of een zodanige
      afwijking kan toestaan.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel120a
  - number: 120a.2
    text: 'Indien toepassing wordt gegeven aan het eerste lid, wordt in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel120a
  - number: 120a.2.a
    text: de wijze waarop tot een keuze voor experimenten als bedoeld in het eerste lid wordt gekomen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel120a
  - number: 120a.2.b
    text: de ten hoogste toegestane tijdsduur van een afwijking als bedoeld in het eerste lid en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel120a
  - number: 120a.2.c
    text: |-
      de wijze waarop tot de vaststelling wordt gekomen of een experiment als bedoeld in het eerste lid zodanig geslaagd
      is, dat het wettelijk voorschrift waarvan bij wege van dat experiment is afgeweken zou moeten worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel120a
  - number: '121'
    text: |-
      De bevoegdheid, de gemeenteraad toekomende overeenkomstig [artikel 149 van de Gemeentewet][ref1], mag niet worden
      uitgeoefend ten aanzien van de onderwerpen waarin is voorzien bij of krachtens de algemene maatregelen van bestuur,
      bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel149
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '149'
  - number: 121.a
    text: |-
      [artikel 12a, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 121.b
    text: |-
      [artikel 40a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 40a
        hoofdstuk: IV
        afdeling: '1'
  - number: 121.c
    text: |-
      [artikel 43, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
  - number: 121.d
    text: |-
      [artikel 44, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 121.e
    text: |-
      [artikel 70c, tweede lid, eerste volzin][ref1], voorzover die algemene maatregel van bestuur betrekking heeft op
      toegelaten instellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 70c
        hoofdstuk: V
        afdeling: '3'
  - number: 121.f
    text: |-
      [artikel 100, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel100
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '100'
        hoofdstuk: VI
        afdeling: '2'
  - number: '122'
    text: |-
      De gemeente kan geen rechtshandelingen naar burgerlijk recht verrichten ten aanzien van de onderwerpen waarin bij
      of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 2][ref1], en in [hoofdstuk IV][ref2] van deze
      wet is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: '123'
    text: |-
      Ten aanzien van het onderwerp waarin de aansluitvoorwaarden voorzien, voor zover daarnaar met toepassing van
      [artikel 3, tweede lid][ref1], is verwezen, kunnen geen andere voorschriften van bouwtechnische aard worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel3
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '125'
    text: |-
      De intrekking van de [Woningwet van 12 juli 1962][ref1] heeft geen gevolgen voor de geldigheid van de krachtens
      die wet bij koninklijk besluit dan wel door Onze Minister gegeven voorschriften, tenzij krachtens deze wet anders
      is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '126.1'
    text: |-
      Gedurende ten hoogste een jaar na het tijdstip van inwerkingtreding van [hoofdstuk II, afdeling 2][ref1], blijft de
      op grond van de [Woningwet van 12 juli 1962][ref2] geldende gemeentelijke bouwverordening, voor zover deze niet in
      strijd is met de bij of krachtens deze wet gegeven voorschriften, van kracht en geldt deze als de bouwverordening,
      genoemd in [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002379
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002379
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '126.2'
    text: |-
      De bouwverordening, genoemd in [artikel 8][ref1], wordt vastgesteld binnen zes maanden na het tijdstip van
      inwerkingtreding van [hoofdstuk II, afdeling 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
        afdeling: '2'
  - number: '127.1'
    text: |-
      Aanschrijvingen die op grond van de [Woningwet van 12 juli 1962][ref1] zijn uitgevaardigd en waartegen geen beroep
      meer kan worden ingesteld, gelden als aanschrijvingen als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '127.2'
    text: |-
      Aanschrijvingen die op grond van de [Woningwet van 12 juli 1962][ref1] zijn uitgevaardigd en waartegen nog beroep
      kan worden ingesteld dan wel beroep is ingesteld, worden afgedaan overeenkomstig genoemde wet en gelden als
      aanschrijvingen als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '128.1'
    text: |-
      Besluiten tot onbewoonbaarverklaring die op grond van de [Woningwet van 12 juli 1962][ref1] zijn genomen en
      waartegen geen beroep meer kan worden ingesteld, gelden als beslissingen tot onbewoonbaarverklaring als bedoeld in
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '128.2'
    text: |-
      Besluiten tot onbewoonbaarverklaring die op grond van de [Woningwet van 12 juli 1962][ref1] zijn genomen en
      waartegen nog beroep kan worden ingesteld dan wel beroep is ingesteld, worden afgedaan overeenkomstig genoemde wet
      en gelden als beslissingen tot onbewoonbaarverklaring als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002379
  - number: '129.1'
    text: |-
      Verzoeken om toestemming als bedoeld in [artikel 46 van de Woningwet van 12 juli 1962][ref1], alsmede enig
      beroep, ingesteld tegen een beslissing omtrent een dergelijk verzoek, worden afgedaan overeenkomstig genoemde wet.
      Verzoeken als bedoeld in dit lid, gelden als aanvragen om vergunning als bedoeld in [artikel 61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '3'
  - number: '129.2'
    text: |-
      Toestemmingen als bedoeld in [artikel 46 van de Woningwet van 12 juli 1962][ref1], waartegen geen beroep meer kan
      worden ingesteld, gelden als vergunningen als bedoeld in [artikel 61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '3'
  - number: '130.1'
    text: |-
      Aanvragen om bouwvergunning als bedoeld in [artikel 47, eerste lid, van de Woningwet van 12 juli 1962][ref1],
      alsmede enig beroep, ingesteld tegen een beslissing omtrent een dergelijke aanvraag, worden afgedaan overeenkomstig
      genoemde wet. Aanvragen als bedoeld in dit lid, gelden als aanvragen om bouwvergunning als bedoeld in
      [artikel 40, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel40
