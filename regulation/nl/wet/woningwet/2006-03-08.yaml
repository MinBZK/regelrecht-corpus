---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: woningwet
regulatory_layer: WET
publication_date: '2022-11-09'
valid_from: '2006-03-08'
bwb_id: BWBR0005181
url: https://wetten.overheid.nl/BWBR0005181/2006-03-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is mede uit het oogpunt van vereenvoudiging en
    vermindering van regelgeving, alsmede uit het oogpunt van decentralisatie nieuwe voorschriften te geven omtrent het
    bouwen en de volkshuisvesting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.a
    text: |-
      bouwen: het plaatsen, het geheel of gedeeltelijk oprichten, vernieuwen of veranderen en het vergroten van
      een bouwwerk, alsmede het geheel of gedeeltelijk oprichten, vernieuwen of veranderen en het vergroten van een
      standplaats;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.b
    text: 'slopen: het afbreken van een bouwwerk of een gedeelte daarvan;'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.c
    text: |-
      gebouw: elk bouwwerk, dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.d
    text: |-
      woonkeet: een loods, keet of ander soortgelijk bouwwerk, bestemd om te voorzien in een tijdelijke behoefte aan
      woongelegenheid;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.e
    text: |-
      woonwagen: voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen kan
      worden verplaatst;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.f
    text: |-
      bestemmingsplan: een bestemmingsplan als bedoeld in de Wet op de Ruimtelijke Ordening dan wel een
      stadsvernieuwingsplan als bedoeld in de Wet op de stads- en dorpsvernieuwing;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.g
    text: |-
      rooilijn: de lijn die, behoudens toegelaten afwijkingen, bij het bouwen aan de wegzijde of aan de van de weg
      afgekeerde zijde niet mag worden overschreden;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.h
    text: |-
      standplaats: een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.i
    text: |-
      norm: een document, uitgegeven door een deskundig, onafhankelijk instituut, waarin wordt omschreven aan welke eisen
      een bouwmateriaal, bouwdeel of bouwconstructie moet voldoen dan wel waarin een omschrijving wordt gegeven van een
      keurings-, meet- of berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.j
    text: |-
      kwaliteitsverklaring: een schriftelijk bewijs, voorzien van een merkteken, aangewezen door Onze Minister, afgegeven
      door een deskundig, onafhankelijk instituut, aangewezen door Onze Minister, op grond waarvan een bouwmateriaal,
      bouwdeel of samenstel van bouwmaterialen of bouwdelen dan wel een bouwwijze, indien dat bouwmateriaal, bouwdeel
      of samenstel van bouwmaterialen of bouwdelen dan wel die bouwwijze bij het bouwen wordt toegepast, wordt geacht te
      voldoen aan krachtens deze wet aan dat bouwmateriaal, bouwdeel of samenstel van bouwmaterialen of bouwdelen dan wel
      die bouwwijze gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.k
    text: |-
      aansluitvoorwaarden: door representatieve organisaties van openbare nutsbedrijven, van andere instellingen of van
      gemeenten opgestelde voorschriften waaraan moet worden voldaan, opdat een woning of gebouw kan worden aangesloten
      op het leidingnet van die bedrijven, instellingen of gemeenten;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.l
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.m
    text: 'inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.n
    text: |-
      toegelaten instelling: instelling als bedoeld in [artikel 70][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
        hoofdstuk: V
        afdeling: '3'
  - number: 1.1.o
    text: |-
      fonds: Centraal Fonds voor de Volkshuisvesting, bedoeld in [artikel 71][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '71'
        hoofdstuk: V
        afdeling: 3A
  - number: 1.1.p
    text: |-
      reguliere bouwvergunning: bouwvergunning als bedoeld in [artikel 44, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1.1.q
    text: |-
      lichte bouwvergunning: bouwvergunning als bedoeld in [artikel 44][ref1], derde juncto eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1.1.r
    text: |-
      welstandscommissie: door de gemeenteraad benoemde onafhankelijke commissie die aan burgemeester en wethouders
      advies uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk of standplaats,
      waarvoor een aanvraag om bouwvergunning is ingediend, in strijd is met redelijke eisen van welstand;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: 1.1.s
    text: |-
      stadsbouwmeester: door de gemeenteraad benoemde onafhankelijke deskundige die aan burgemeester en wethouders advies
      uitbrengt ten aanzien van de vraag of het uiterlijk of de plaatsing van een bouwwerk of standplaats, waarvoor een
      aanvraag om bouwvergunning is ingediend, in strijd is met redelijke eisen van welstand.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder woning mede verstaan een afzonderlijk
      gedeelte van een gebouw, welk gedeelte tot bewoning is bestemd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel1
  - number: '2.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden uit het oogpunt van veiligheid, gezondheid, bruikbaarheid,
      energiezuinigheid en milieu technische voorschriften gegeven omtrent het bouwen van woningen, woonketen, woonwagens
      en andere gebouwen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '2.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt van
      veiligheid, gezondheid en bruikbaarheid voorschriften gegeven omtrent de staat van bestaande woningen, woonketen en
      woonwagens en van bestaande andere gebouwen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt van
      veiligheid, gezondheid en milieu technische voorschriften gegeven omtrent het bouwen van bouwwerken, geen gebouw
      zijnde.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '2.4'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt van
      veiligheid en gezondheid technische voorschriften gegeven omtrent de staat van bestaande bouwwerken, geen gebouw
      zijnde.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '2.5'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt
      van veiligheid, gezondheid, bruikbaarheid en milieu technische voorschriften gegeven omtrent het bouwen van
      standplaatsen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '2.6'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorts uit het oogpunt
      van veiligheid, gezondheid en bruikbaarheid technische voorschriften gegeven omtrent de staat van bestaande
      standplaatsen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '2.7'
    text: Aan een voorschrift omtrent het bouwen van een bouwwerk of standplaats kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '2.8'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid, treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur kan worden verwezen naar:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 3.1.a
    text: normen of delen van normen en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel3
  - number: 3.1.b
    text: kwaliteitsverklaringen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel3
  - number: '3.2'
    text: |-
      Bij de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur kan worden verwezen naar de voorschriften in de
      aansluitvoorwaarden, die van bouwtechnische aard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '4'
    text: |-
      De voorschriften die zijn gegeven bij of krachtens de in [artikel 2][ref1] genoemde algemene maatregel van bestuur,
      zijn van toepassing op elk bouwen, en op de staat van elk bestaand bouwwerk en van elke bestaande standplaats.
      Indien een bouwwerk of standplaats gedeeltelijk wordt vernieuwd, veranderd of vergroot, zijn die voorschriften,
      voor zover zij betrekking hebben op het bouwen, slechts van toepassing op die vernieuwing, verandering of
      vergroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '5'
    text: |-
      Op de voordracht van Onze Minister wordt de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur in
      overeenstemming gebracht met technische voorschriften omtrent het bouwen, die zijn of worden gegeven bij of
      krachtens een andere algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '6.1'
    text: |-
      Bij een voorschrift, gegeven bij of krachtens de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur,
      kan worden bepaald dat burgemeester en wethouders van dat voorschrift ontheffing kunnen verlenen tot een bij dat
      voorschrift aangegeven niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '6.2'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid, mogen slechts voorwaarden worden verbonden ter bescherming van de
      belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister kan op verzoek van een aanvrager om bouwvergunning, bedoeld in [artikel 40, eerste lid][ref1], in
      bijzondere gevallen ontheffing verlenen van de bij of krachtens de in [artikel 2][ref2] bedoelde algemene maatregel
      van bestuur gegeven voorschriften, met dien verstande dat, indien het verzoek betrekking heeft op voorschriften als
      bedoeld in [artikel 5][ref3], hij de ontheffing slechts kan verlenen in overeenstemming met het bij of krachtens de
      desbetreffende wet daartoe bevoegd verklaarde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, gaat vergezeld van een verklaring van burgemeester en wethouders, dat
      zij de desbetreffende bouwvergunning zullen verlenen indien ontheffing als bedoeld in dat lid, is verkregen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7
  - number: '7.3'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid, mogen slechts voorwaarden worden verbonden ter bescherming van de
      belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7
  - number: '7.4'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking van de beslissing op een verzoek als bedoeld in het
      eerste lid, doet Onze Minister daarvan mededeling aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7
  - number: '7.5'
    text: |-
      De verlening van de verklaring, bedoeld in het tweede lid, en de verlening van ontheffing, bedoeld in het eerste
      lid, worden geacht voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1]
      deel uit te maken van de beschikking waarop zij betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '7.6'
    text: |-
      Het eerste, derde en vierde lid zijn van overeenkomstige toepassing indien voor het bouwen geen bouwvergunning
      is vereist.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7
  - number: 7a.1
    text: |-
      Onze Minister kan met het oog op duurzaam bouwen in een bijzonder geval burgemeester en wethouders toestaan door
      hun voorgestelde nadere voorschriften op te leggen ter voldoening aan de technische voorschriften, gegeven bij of
      krachtens de algemene maatregel van bestuur, bedoeld in [artikel 2][ref1]. Dit toestaan kan ook betrekking hebben
      op door burgemeester en wethouders voorgestelde, uit het oogpunt van milieu op te leggen technische voorschriften,
      waarin de algemene maatregel van bestuur, bedoeld in [artikel 2][ref2], niet voorziet. Een verzoek van burgemeester
      en wethouders geschiedt mede aan de hand van een door Onze Minister ter beschikking gesteld formulier. Het verzoek,
      alsmede de daarbij voorgestelde op te leggen voorschriften zijn gemotiveerd en van een toelichting voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 7a.2
    text: |-
      Onze Minister beslist binnen acht weken na ontvangst van een verzoek om toestemming. Hij kan die beslissing eenmaal
      voor ten hoogste vier weken verdagen. Indien toestemming wordt verleend, geldt die toestemming alleen voor het
      geval waarop het verzoek betrekking heeft. Aan een toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7a
  - number: 7a.3
    text: 'De toestemming op een verzoek van burgemeester en wethouders is van rechtswege verleend indien Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7a
  - number: 7a.3.a
    text: niet binnen acht weken na ontvangst van het verzoek een beslissing op dat verzoek heeft genomen,
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7a
  - number: 7a.3.b
    text: |-
      niet binnen acht weken na ontvangst van het verzoek van burgemeester en wethouders heeft besloten de beslissing op
      dat verzoek te verdagen, of
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7a
  - number: 7a.3.c
    text: |-
      niet binnen de termijn waarmee de beslissing op het verzoek van burgemeester en wethouders is verdaagd, een
      beslissing op dat verzoek heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel7a
  - number: '8.1'
    text: |-
      De gemeenteraad stelt een bouwverordening vast, die uitsluitend de voorschriften, bedoeld in het tweede tot en met
      zesde lid, bevat.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: '8.2'
    text: 'De bouwverordening bevat voorschriften omtrent:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.a
    text: |-
      het gebruik van woningen, woonketen, woonwagens, andere gebouwen, bouwwerken, geen gebouwen zijnde, en
      standplaatsen, waaronder in elk geval zijn begrepen voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.a.1°
    text: de beschikbaarheid van drinkwater en energie;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.a.2°
    text: de reinheid;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.a.3°
    text: het bestrijden van schadelijk of hinderlijk gedierte;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.a.4°
    text: de brandveiligheid en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.a.5°
    text: |-
      voor zover het woningen, woonketen of woonwagens betreft, het aantal personen dat in een dergelijk gebouw mag
      wonen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.b
    text: het gebruik van open erven en terreinen en de staat, waarin deze zich moeten bevinden;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.c
    text: het tegengaan van bouwen op verontreinigde bodem;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.d
    text: het slopen, waaronder begrepen voorschriften omtrent selectief slopen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.e
    text: |-
      de vorm en de plaatsing van het kenteken van onbewoonbaarverklaring, bedoeld in [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel31
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '31'
        hoofdstuk: III
        afdeling: '3'
  - number: 8.2.f
    text: |-
      de wijze van inrichting en indiening van een aanvraag om woonvergunning als bedoeld in [artikel 60][ref1] en van
      een aanvraag om vergunning als bedoeld in [artikel 61][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '60'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '3'
  - number: 8.2.g
    text: |-
      de overdraagbaarheid van een bouwvergunning als bedoeld in [artikel 40, eerste lid][ref1], een woonvergunning als
      bedoeld in [artikel 60][ref2] en een vergunning als bedoeld in [artikel 61][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel61
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '60'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '61'
        hoofdstuk: IV
        afdeling: '3'
  - number: 8.2.h
    text: |-
      het uitvoeren van bouw- of sloopwerkzaamheden, waaronder in elk geval zijn begrepen voorschriften met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.h.1°
    text: de veiligheid op de bouw- of sloopplaats;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.h.2°
    text: de tijdstippen waarop met het bouwen of het slopen mag worden en wordt begonnen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.h.3°
    text: |-
      de tijdstippen waarop met het bouwen of het slopen moet zijn begonnen en het bouwen of het slopen moet zijn
      beëindigd, alsmede de wijze van gereedmelding van het bouwen of het slopen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.h.4°
    text: de termijn gedurende welke het bouwen of het slopen ten hoogste mag stilliggen;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.h.5°
    text: bescheiden die op de bouw- of sloopplaats aanwezig moeten zijn;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.h.6°
    text: |-
      opmetingen, ontgravingen, opbrekingen en onderzoekingen, die met betrekking tot het bouwen of het slopen
      noodzakelijk zijn en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.h.7°
    text: |-
      het tijdstip en de wijze van overleggen van kwaliteitsverklaringen en van nadere gegevens met betrekking tot de
      installaties voor drinkwater en energie, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.2.i
    text: |-
      het stilleggen van bouwwerkzaamheden, bedoeld in [artikel 100, derde lid][ref1], waaronder in elk geval is
      begrepen het voorschrift dat de bouwwerkzaamheden kunnen worden stilgelegd, indien blijkt dat niet is voldaan aan
      het voorschrift, bedoeld in het derde lid, onderdeel *e*, in verbinding met het vierde lid, of aan een ingevolge
      [artikel 56][ref2] aan de verlening van de bouwvergunning verbonden voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '100'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '56'
        hoofdstuk: IV
        afdeling: '1'
  - number: '8.3'
    text: 'De voorschriften, bedoeld in het tweede lid, onderdeel c, hebben uitsluitend betrekking op bouwwerken:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.3.a
    text: waarin voortdurend of nagenoeg voortdurend mensen zullen verblijven,
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.3.b
    text: voor het bouwen waarvan een reguliere bouwvergunning vereist is, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.3.c.1°
    text: die de grond raken, of
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.3.c.2°
    text: ten aanzien waarvan het bestaande, niet-wederrechtelijke gebruik niet wordt gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: '8.4'
    text: 'De voorschriften, bedoeld in het tweede lid, onderdeel c, hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.4.a
    text: het verrichten van onderzoek naar aard en mate van verontreiniging van de bodem;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.4.b
    text: aard en omvang van het onderzoek, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.4.c
    text: inrichting van het op te stellen onderzoeksrapport.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: '8.5'
    text: |-
      De bouwverordening kan voorschriften bevatten van stedenbouwkundige aard. Tot die voorschriften kunnen behoren
      voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.5.a
    text: de wegen waaraan mag worden gebouwd;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.5.b
    text: de rooilijnen, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: 8.5.c
    text: de plaatsing van bouwwerken ten opzichte van elkaar, mede uit het oogpunt van bereikbaarheid van die bouwwerken.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: '8.6'
    text: |-
      De bouwverordening bevat tevens voorschriften omtrent de samenstelling, inrichting en werkwijze van de
      welstandscommissie. Zij kan bepalen dat er in plaats van een welstandscommissie een stadsbouwmeester
      wordt aangesteld, in welk geval de bouwverordening voorschriften bevat over de rol en de functie van de
      stadsbouwmeester. Voorts kan de bouwverordening nadere voorschriften bevatten omtrent de verslagen, bedoeld in de
      [artikelen 12b, derde lid][ref1], en [46, achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12b
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
        hoofdstuk: IV
        afdeling: '1'
  - number: '8.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in de bouwverordening voorschriften worden gegeven
      omtrent andere onderwerpen dan die, genoemd in het tweede, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: '8.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bevordering van eenheid in de bouwverordeningen regelen worden
      gegeven omtrent de inhoud van de voorschriften, bedoeld in het tweede tot en met vierde, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
  - number: '8.9'
    text: |-
      De gemeenteraad brengt binnen een jaar na het in werking treden van de krachtens het achtste lid en de krachtens
      [artikel 120][ref1] gegeven voorschriften de bouwverordening met die voorschriften in overeenstemming. Zolang de
      bouwverordening niet met die voorschriften in overeenstemming is gebracht, gelden die voorschriften rechtstreeks.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
        hoofdstuk: IX
  - number: '9.1'
    text: |-
      Voor zover de voorschriften van de bouwverordening niet overeenstemmen met de voorschriften van het desbetreffende
      bestemmingsplan blijven eerstbedoelde voorschriften buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel9
  - number: '9.2'
    text: |-
      De voorschriften van de bouwverordening blijven van toepassing indien het desbetreffende bestemmingsplan geen
      voorschriften bevat, die hetzelfde onderwerp regelen, tenzij het desbetreffende bestemmingsplan anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel9
  - number: '10'
    text: |-
      De in de bouwverordening vervatte voorschriften omtrent de rooilijnen en de plaatsing van bouwwerken ten opzichte
      van elkaar zijn niet van toepassing op het gedeeltelijk vernieuwen of veranderen van een bouwwerk, voor zover het
      te vernieuwen of veranderen gedeelte van dat bouwwerk overeenkomstig het destijds geldende recht in afwijking van
      die voorschriften tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel10
  - number: '11.1'
    text: |-
      Bij een in de bouwverordening gegeven voorschrift kan worden bepaald, dat burgemeester en wethouders bevoegd zijn
      van dat voorschrift ontheffing te verlenen, tenzij het een voorschrift betreft waarmee de bouwverordening krachtens
      [artikel 8, negende lid][ref1], in overeenstemming is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '11.2'
    text: |-
      Bij een in de algemene maatregel van bestuur, bedoeld in [artikel 8, achtste lid][ref1], gegeven voorschrift kan
      worden bepaald, dat burgemeester en wethouders bevoegd zijn ontheffing te verlenen van dat voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '11.3'
    text: |-
      Aan een ontheffing als bedoeld in het eerste of tweede lid, mogen slechts voorwaarden worden verbonden ter
      bescherming van de belangen, waarop de voorschriften, waarvan ontheffing wordt verleend, het oog hebben.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel11
  - number: '12.1'
    text: |-
      Het uiterlijk en de plaatsing van een bouwwerk of standplaats, zowel op zichzelf als in verband met de omgeving of
      de te verwachten ontwikkeling daarvan, mogen niet in strijd zijn met redelijke eisen van welstand, beoordeeld naar
      de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '12.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
  - number: 12.2.a
    text: |-
      indien bij besluit van de gemeenteraad is bepaald dat voor het gebied waarin het bouwwerk of de standplaats is of
      wordt gebouwd geen redelijke eisen van welstand gelden;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
  - number: 12.2.b
    text: |-
      indien bij besluit van de gemeenteraad is bepaald dat voor de categorie bouwwerken of standplaatsen waartoe het
      bouwwerk of de standplaats behoort geen redelijke eisen van welstand gelden;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
  - number: 12.2.c
    text: |-
      op bouwwerken en standplaatsen waarop [artikel 43, eerste lid][ref1], van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
        hoofdstuk: IV
        afdeling: '1'
  - number: 12.2.d
    text: |-
      op bouwwerken als bedoeld in [artikel 45, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
  - number: '12.3'
    text: |-
      Voor zover de toepassing van de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], leidt tot strijd
      met het bestemmingsplan of met in de bouwverordening opgenomen voorschriften van stedenbouwkundige aard, blijven
      die criteria buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '12.4'
    text: |-
      De gemeenteraad betrekt de ingezetenen van de gemeente en belanghebbenden bij de voorbereiding van
      besluiten als bedoeld in het tweede lid, onderdelen a en b, op de wijze voorzien in de krachtens
      [artikel 150 van de Gemeentewet][ref1] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: 12a.1
    text: |-
      De gemeenteraad stelt een welstandsnota vast, inhoudende beleidsregels waarin in ieder geval de criteria zijn
      opgenomen die burgemeester en wethouders toepassen bij hun beoordeling:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12a
  - number: 12a.1.a
    text: |-
      of het uiterlijk en de plaatsing van een bouwwerk of standplaats, waarop de aanvraag om bouwvergunning betrekking
      heeft, in strijd zijn met redelijke eisen van welstand;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12a
  - number: 12a.1.b
    text: |-
      of het uiterlijk van een bouwwerk of standplaats, zowel op zichzelf als in verband met de omgeving of de te
      verwachten ontwikkeling daarvan, in ernstige mate in strijd is met redelijke eisen van welstand.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12a
  - number: 12a.2
    text: |-
      [Artikel 12, vierde lid][ref1], is van overeenkomstige toepassing op de vaststelling of wijziging van de
      welstandsnota.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12a.3
    text: |-
      De criteria, bedoeld in het eerste lid, zijn zoveel mogelijk toegesneden op de onderscheidene categorieën
      bouwwerken en standplaatsen. De criteria kunnen verschillen naargelang de plaats waar een bouwwerk of standplaats
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12a
  - number: 12a.4
    text: |-
      Ter bevordering van de eenheid in welstandsnota's kunnen bij algemene maatregel van bestuur voorschriften worden
      gegeven omtrent categorieën van bouwwerken en standplaatsen als bedoeld in het derde lid en de daarop toe te passen
      criteria.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12a
  - number: 12a.5
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het vierde lid treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12a
  - number: 12b.1
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester baseert haar onderscheidenlijk zijn advies slechts op de
      criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1], doch betrekt daarbij, indien van toepassing, het
      bepaalde in [artikel 12, derde lid][ref2]. De adviezen van de welstandscommissie dan wel de stadsbouwmeester zijn
      openbaar. Een advies van de welstandscommissie dan wel de stadsbouwmeester inhoudende dat een bouwplan in strijd is
      met redelijke eisen van welstand, wordt schriftelijk uitgebracht en deugdelijk gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.2
    text: |-
      Vergaderingen van de welstandscommissie zijn openbaar. Een vergadering of gedeelte daarvan is niet openbaar in
      gevallen als bedoeld in [artikel 10, eerste lid, van de Wet openbaarheid van bestuur][ref1] en in gevallen waarin
      het belang van openbaarheid niet opweegt tegen de in [artikel 10, tweede lid, van die wet][ref2] genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 12b.3
    text: |-
      De welstandscommissie dan wel de stadsbouwmeester legt de gemeenteraad eenmaal per jaar een verslag
      voor van de door haar onderscheidenlijk hem verrichte werkzaamheden. In het verslag wordt ten minste
      uiteengezet op welke wijze zij onderscheidenlijk hij toepassing heeft gegeven aan de criteria, bedoeld in
      [artikel 12a, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 12b.4
    text: |-
      Een voorzitter of ander lid van een welstandscommissie kan voor een termijn van ten hoogste drie jaar worden
      benoemd in een welstandscommissie die in de betreffende gemeente werkzaam is. Zij kunnen eenmaal voor een
      termijn van ten hoogste drie jaar worden herbenoemd in dezelfde commissie. De eerste en tweede volzin zijn van
      overeenkomstige toepassing op de stadsbouwmeester.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12b
  - number: 12c
    text: |-
      Burgemeester en wethouders leggen de gemeenteraad eenmaal per jaar een verslag voor waarin zij ten minste
      uiteenzetten:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12c
  - number: 12c.a
    text: op welke wijze zij zijn omgegaan met de adviezen van de welstandscommissie dan wel de stadsbouwmeester;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12c
  - number: 12c.b
    text: |-
      in welke categorieën van gevallen zij de aanvraag voor een lichte bouwvergunning niet aan de welstandscommissie dan
      wel de stadsbouwmeester hebben voorgelegd en op welke wijze zij in die gevallen zelf toepassing hebben gegeven aan
      de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: 12c.c
    text: 'in welke categorieën van gevallen:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12c
  - number: 12c.c.1°
    text: |-
      zij tot aanschrijving op grond van [artikel 19][ref1] zijn overgegaan en daarbij de keuze hebben gelaten tussen
      ofwel het uitvoeren van de aanschrijving, ofwel het slopen van het bouwwerk of de standplaats binnen de door hen te
      bepalen termijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
  - number: 12c.c.2°
    text: |-
      zij bij of na een aanschrijving op grond van [artikel 19][ref1] zijn overgegaan tot toepassing van bestuursdwang op
      grond van [artikel 26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel26
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '26'
        hoofdstuk: III
        afdeling: '2'
  - number: '13'
    text: 'Burgemeester en wethouders gaan na:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel13
  - number: 13.a
    text: welke woningen, woonketen en woonwagens ongeschikt zijn voor bewoning;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel13
  - number: 13.b
    text: |-
      welke woningen, woonketen en woonwagens, ofschoon niet ongeschikt voor bewoning, voorzieningen als bedoeld in
      [artikel 14, eerste lid][ref1], behoeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: 13.c
    text: |-
      welke woningen, woonketen en woonwagens worden gebruikt op een wijze, die niet in overeenstemming is met de
      desbetreffende voorschriften van de bouwverordening;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel13
  - number: 13.d
    text: |-
      welke gebouwen, geen woningen, woonketen of woonwagens zijnde, voorzieningen als bedoeld in
      [artikel 17, eerste lid][ref1], behoeven dan wel worden gebruikt op een wijze, die niet in overeenstemming is met
      de desbetreffende voorschriften van de bouwverordening;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel17
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
  - number: 13.e
    text: |-
      welke bouwwerken, geen gebouwen zijnde, of standplaatsen voorzieningen als bedoeld in
      [artikel 18, eerste lid][ref1], behoeven dan wel worden gebruikt op een wijze, die niet in overeenstemming is met
      de desbetreffende voorschriften van de bouwverordening, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel18
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
  - number: 13.f
    text: |-
      welke open erven en terreinen in een staat verkeren, die niet voldoet aan de desbetreffende voorschriften van
      de bouwverordening dan wel worden gebruikt op een wijze, die niet in overeenstemming is met de desbetreffende
      voorschriften van de bouwverordening.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel13
  - number: '14.1'
    text: |-
      Indien een woning, woonkeet of woonwagen wegens strijd met de in [artikel 2, eerste lid][ref1], bedoelde
      voorschriften of uit anderen hoofde noodzakelijk voorzieningen behoeft dan wel wegens strijd met de in
      [artikel 2, tweede lid][ref2], bedoelde voorschriften voorzieningen behoeft, schrijven burgemeester en wethouders
      degene, die als eigenaar of uit anderen hoofde tot het treffen van die voorzieningen bevoegd is, aan binnen een
      door hen te bepalen termijn de door hen aan te geven voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '14.2'
    text: |-
      Burgemeester en wethouders kunnen in de aanschrijving, bedoeld in het eerste lid, bepalen dat aan de aanschrijving
      in fasen binnen door hen te bepalen afzonderlijke termijnen mag worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel14
  - number: '14.3'
    text: |-
      Indien een woning, woonkeet of woonwagen wordt bewoond op een wijze, die niet in overeenstemming is met de
      desbetreffende voorschriften van de bouwverordening, schrijven burgemeester en wethouders de hoofdbewoner of
      elke afzonderlijke bewoner aan binnen een door hen te bepalen termijn de bewoning in overeenstemming met die
      voorschriften te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel14
  - number: '15.1'
    text: |-
      Indien een woning of woongebouw uit het oogpunt van woongerief niet aan de eisen des tijds voldoet, doch door het
      aanbrengen van verbeteringen alsnog geheel of ten dele aan die eisen kan worden aangepast, kunnen burgemeester
      en wethouders degene, die als eigenaar of uit anderen hoofde tot het aanbrengen van die verbeteringen bevoegd is,
      aanschrijven binnen een door hen te bepalen termijn de door hen aan te geven verbeteringen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: '15.2'
    text: 'De verbeteringen waartoe kan worden aangeschreven, zijn:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: 15.2.a
    text: het maken van een binnen de woning gelegen toiletruimte;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: 15.2.b
    text: het maken van een binnen de woning gelegen badruimte;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: 15.2.c
    text: |-
      het maken van een binnen de woning gelegen ruimte, waarin een opstelplaats voor een aanrecht en voor een
      kooktoestel zijn gesitueerd;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: 15.2.d
    text: het thermisch isoleren van de uitwendige scheidingsconstructies;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: 15.2.e
    text: het thermisch isoleren van de constructie die de scheiding vormt met de kruipruimte, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: 15.2.f
    text: |-
      het ten behoeve van de verwarmingsinstallatie plaatsen van een verwarmingsketel met een opwekkingsrendement van ten
      minste 80%, indien de bestaande verwarmingsketel ten minste tien jaren oud is.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: '15.3'
    text: |-
      De aanschrijving omvat, indien nodig, mede van rechtswege de als gevolg van het aanbrengen van de in het tweede
      lid, onder a tot en met c, genoemde verbeteringen noodzakelijke wijziging van de indeling of van de inwendige
      constructie van de woning.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: '15.4'
    text: In de aanschrijving kan worden bepaald dat daaraan in fasen mag worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15
  - number: 15a.1
    text: |-
      Indien een gehandicapte in de zin van [artikel 1, eerste lid, van de Wet voorzieningen gehandicapten][ref1] bij
      het normale gebruik van de door hem bewoonde woning ergonomische beperkingen ondervindt, die door het verrichten
      van bouwkundige of woontechnische ingrepen in of aan de woning kunnen worden opgeheven of verminderd, kunnen
      burgemeester en wethouders degene, die als eigenaar of uit anderen hoofde tot het verrichten van die ingrepen
      bevoegd is, aanschrijven binnen een door hen te bepalen termijn de door hen aan te geven ingrepen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel1
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0006169
        artikel: '1'
  - number: 15a.2
    text: |-
      Burgemeester en wethouders vaardigen een aanschrijving als bedoeld in het eerste lid slechts uit voor zover voor
      het verrichten van die ingrepen geldelijke steun kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15a
  - number: 15a.3
    text: |-
      Met betrekking tot de in dit artikel bedoelde aanschrijving is [artikel 15, derde en vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel15
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '16.1'
    text: |-
      Behoudens in geval van gevaar of ernstige hinder schrijven burgemeester en wethouders, indien zij voornemens zijn
      een aanschrijving als bedoeld in [artikel 14, eerste lid][ref1], uit te vaardigen en de woning naar hun oordeel
      tevens verbeteringen behoeft, als bedoeld in [artikel 15][ref2], waartoe kan worden aangeschreven, of ingrepen
      behoeft, als bedoeld in [artikel 15][ref3], degene, die als eigenaar of uit anderen hoofde tot het treffen van
      die voorzieningen of het aanbrengen van de verbeteringen of het verrichten van de ingrepen bevoegd is, aan binnen
      een door hen te bepalen termijn de door hen aangegeven voorzieningen te treffen en de door hen aan te geven
      verbeteringen aan te brengen of de door hen aan te geven ingrepen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 15a
        hoofdstuk: III
        afdeling: '2'
  - number: '16.2'
    text: |-
      Indien burgemeester en wethouders voornemens zijn een aanschrijving als bedoeld in [artikel 15][ref1] uit te
      vaardigen en de woning naar hun oordeel tevens voorzieningen als bedoeld in [artikel 14, eerste lid][ref2], of
      ingrepen als bedoeld in [artikel 15][ref3] behoeft, schrijven zij degene, die als eigenaar of uit anderen hoofde
      tot het aanbrengen van de verbeteringen en het treffen van de voorzieningen of het verrichten van de ingrepen
      bevoegd is, aan binnen een door hen te bepalen termijn de door hen aan te geven verbeteringen aan te brengen en de
      door hen aan te geven voorzieningen te treffen of door hen aan te geven ingrepen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 15a
        hoofdstuk: III
        afdeling: '2'
  - number: '16.3'
    text: |-
      Burgemeester en wethouders kunnen in de aanschrijving, bedoeld in het eerste of tweede lid, bepalen dat aan de
      aanschrijving in fasen binnen door hen te bepalen afzonderlijke termijnen mag worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16
  - number: 16a.1
    text: |-
      Indien een gebouw, een open erf of een terrein op grond van [artikel 97][ref1], dan wel een gebouw op grond
      van [artikel 174a van de Gemeentewet][ref2], een verordening als bedoeld in [artikel 174 van die wet][ref3] of
      [artikel 13b van de Opiumwet][ref4] is gesloten, kunnen burgemeester en wethouders degene die als eigenaar of uit
      anderen hoofde bevoegd is tot het in gebruik geven van het gebouw, aanschrijven om naar keuze van burgemeester
      en wethouders:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '97'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 174a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '174'
      - id: ref4
        bwb_id: BWBR0001941
        artikel: 13b
  - number: 16a.1.a
    text: |-
      het gebouw binnen een door hen te bepalen termijn in gebruik te geven aan een persoon, niet zijnde degene die door
      de sluiting werd gedwongen het gebruik van het gebouw te staken, of
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.1.b
    text: |-
      het gebouw binnen een door hen te bepalen termijn in beheer te geven aan een persoon die uit hoofde van beroep of
      bedrijf op het terrein van de huisvesting werkzaam is, of aan een instelling die op dat terrein werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.2
    text: 'Burgemeester en wethouders kunnen in de aanschrijving:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.2.a
    text: |-
      personen of instellingen als bedoeld in het eerste lid, onderdelen a en b, noemen uit wie, onderscheidenlijk
      waaruit degene die wordt aangeschreven, een keuze moet maken, of, indien dit naar het oordeel van burgemeester en
      wethouders niet mogelijk is, een persoon of instelling als hier bedoeld noemen aan wie het gebouw in gebruik dan
      wel in beheer moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.2.b
    text: |-
      indien het gebouw, al dan niet met het daarbij behorende erf, noodzakelijke voorzieningen behoeft om weer op
      redelijke wijze tot bewoning of gebruik te kunnen dienen, degene die als eigenaar of uit anderen hoofde tot het
      treffen van die voorzieningen bevoegd is, ertoe verplichten om binnen een door hen te bepalen termijn de door hen
      aan te geven voorzieningen te treffen, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.2.c
    text: zo nodig, andere voorwaarden aan de uitvoering van de aanschrijving stellen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.3
    text: |-
      De uitvoering van de aanschrijving geschiedt in overeenstemming met burgemeester en wethouders.
      Burgemeester en wethouders kunnen optreden tegen hetgeen in strijd met de aanschrijving is gedaan of
      nagelaten door zelf de aanschrijving uit te voeren of in plaats daarvan degene die is aangeschreven, een
      last onder dwangsom op te leggen. Op het besluit tot optreden is [afdeling 5.3][ref1], onderscheidenlijk
      [afdeling 5.4, van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.4
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '5.4'
  - number: 16a.4
    text: |-
      Indien het gebouw in beheer wordt gegeven aan een persoon of instelling als bedoeld in het eerste lid, onderdeel
      b, stellen burgemeester en wethouders een vergoeding voor het beheer vast. De desbetreffende persoon of instelling
      stelt, na overleg met degene die is aangeschreven, de huurprijs van het gebouw vast, int de vastgestelde huurprijs
      en stelt deze, verminderd met de vergoeding voor het beheer, ter beschikking van degene die is aangeschreven. De
      huurprijs wordt vastgesteld op een bedrag dat in het economisch verkeer redelijk is.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.5
    text: |-
      Indien de persoon, bedoeld in het eerste lid, onderdeel a, dan wel de persoon of instelling, bedoeld in het eerste
      lid, onderdeel b, het gebruik, onderscheidenlijk het beheer van het gebouw heeft gestaakt, deelt de persoon dan wel
      de instelling dit binnen veertien dagen na het staken daarvan mee aan burgemeester en wethouders. Na ontvangst van
      de mededeling vindt, zo nodig, wederom toepassing van het eerste lid plaats.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: 16a.6
    text: |-
      Onder beheer wordt in dit artikel verstaan het in gebruik geven van het gebouw en het verrichten van al die
      handelingen met betrekking tot het in gebruik gegeven gebouw die volgens gemeen recht tot de verantwoordelijkheid
      van een eigenaar behoren.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel16a
  - number: '17.1'
    text: |-
      Indien een gebouw, niet zijnde een woning, woonkeet of woonwagen, wegens strijd met de in
      [artikel 2, eerste lid][ref1], bedoelde voorschriften of uit anderen hoofde noodzakelijk voorzieningen behoeft dan
      wel wegens strijd met de in [artikel 2, tweede lid][ref2], bedoelde voorschriften voorzieningen behoeft, kunnen
      burgemeester en wethouders degene, die als eigenaar of uit anderen hoofde tot het treffen van die voorzieningen
      bevoegd is, aanschrijven binnen een door hen te bepalen termijn de door hen aan te geven voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '17.2'
    text: |-
      Burgemeester en wethouders kunnen in de aanschrijving, bedoeld in het eerste lid, bepalen dat aan de aanschrijving
      in fasen binnen door hen te bepalen afzonderlijke termijnen mag worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17
  - number: '17.3'
    text: |-
      Indien een gebouw als bedoeld in het eerste lid, wordt gebruikt op een wijze, die niet in overeenstemming is met
      de desbetreffende voorschriften van de bouwverordening, kunnen burgemeester en wethouders de hoofdgebruiker of elke
      afzonderlijke gebruiker aanschrijven binnen een door hen te bepalen termijn het gebruik in overeenstemming met die
      voorschriften te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17
  - number: '17.4'
    text: |-
      Indien de aanschrijving, bedoeld in het derde lid, geschiedt met het oog op gevaar of ernstige hinder, kunnen
      burgemeester en wethouders in de aanschrijving tevens bepalen dat gedurende de in dat lid bedoelde termijn het
      gebruik van het gebouw moet worden gestaakt.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17
  - number: 17a.1
    text: |-
      Indien een gebouw, niet zijnde een woning, woongebouw, woonwagen of woonkeet, uit het oogpunt van energiezuinigheid
      niet aan de eisen des tijds voldoet, doch door het aanbrengen van verbeteringen alsnog geheel of ten dele aan die
      eisen kan worden aangepast, kunnen burgemeester en wethouders degene, die als eigenaar of uit anderen hoofde tot
      het aanbrengen van die verbeteringen bevoegd is, aanschrijven binnen een door hen te bepalen termijn de door hen
      aan te geven verbeteringen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17a
  - number: 17a.2
    text: 'De verbeteringen waartoe kan worden aangeschreven, zijn:'
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17a
  - number: 17a.2.a
    text: het thermisch isoleren van de uitwendige scheidingsconstructies;
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17a
  - number: 17a.2.b
    text: het thermisch isoleren van de constructie die de scheiding vormt met de kruipruimte, en
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17a
  - number: 17a.2.c
    text: |-
      het ten behoeve van de verwarmingsinstallatie plaatsen van een verwarmingsketel met een opwekkingsrendement van ten
      minste 80%, indien de bestaande verwarmingsketel ten minste tien jaren oud is.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17a
  - number: 17a.3
    text: In de aanschrijving kan worden bepaald dat daaraan in fasen mag worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17a
  - number: 17b
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing op een gebouw, niet zijnde een woning, woongebouw, woonwagen
      of woonkeet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel16
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '18.1'
    text: |-
      Indien een bouwwerk, niet zijnde een gebouw, of een standplaats wegens strijd met de in
      [artikel 2, derde lid, onderdeel ][ref1], respectievelijk [artikel 2, vierde lid, onderdeel ][ref2], bedoelde
      voorschriften of uit anderen hoofde noodzakelijk voorzieningen behoeft dan wel wegens strijd met de in
      [artikel 2, derde lid, onderdeel ][ref3], respectievelijk [artikel 2, vierde lid, onderdeel ][ref4], bedoelde
      voorschriften voorzieningen behoeft, kunnen burgemeester en wethouders degene, die als eigenaar of uit anderen
      hoofde tot het treffen van die voorzieningen bevoegd is, aanschrijven binnen een door hen te bepalen termijn de
      door hen aan te geven voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '18.2'
    text: |-
      Indien een bouwwerk of standplaats als bedoeld in het eerste lid, wordt gebruikt op een wijze, die niet in
      overeenstemming is met de desbetreffende voorschriften van de bouwverordening, kunnen burgemeester en wethouders de
      hoofdgebruiker of elke afzonderlijke gebruiker aanschrijven binnen een door hen te bepalen termijn het gebruik in
      overeenstemming met die voorschriften te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel18
  - number: '19'
    text: |-
      Indien het uiterlijk van een bouwwerk of standplaats, niet zijnde een bouwwerk als bedoeld in
      [artikel 45, eerste lid][ref1], in ernstige mate in strijd is met redelijke eisen van welstand, beoordeeld naar de
      criteria, bedoeld in [artikel 12a, eerste lid, onderdeel b][ref2], kunnen burgemeester en wethouders degene, die
      als eigenaar of uit anderen hoofde tot het opheffen van die strijdigheid bevoegd is, aanschrijven binnen een door
      hen te bepalen termijn de door hen aan te geven daartoe strekkende voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '20.1'
    text: |-
      Indien de staat van een open erf of terrein niet voldoet aan de desbetreffende voorschriften van de
      bouwverordening, kunnen burgemeester en wethouders degene, die als eigenaar of uit anderen hoofde tot het treffen
      van voorzieningen bevoegd is, aanschrijven binnen een door hen te bepalen termijn de staat in overeenstemming met
      die voorschriften te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel20
  - number: '20.2'
    text: |-
      Indien een open erf of terrein als bedoeld in het eerste lid, wordt gebruikt op een wijze, die niet in
      overeenstemming is met de desbetreffende voorschriften van de bouwverordening, kunnen burgemeester en wethouders de
      hoofdgebruiker of elke afzonderlijke gebruiker aanschrijven binnen een door hen te bepalen termijn het gebruik in
      overeenstemming met die voorschriften te brengen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel20
  - number: '21.1'
    text: Degene, tot wie een aanschrijving is gericht, of zijn rechtsopvolger, is verplicht daaraan te voldoen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel21
  - number: '21.2'
    text: |-
      Indien burgemeester en wethouders in de aanschrijving vermelden, dat deze verband houdt met gevaar of ernstige
      hinder dan wel met een sluiting als bedoeld in [artikel 16a][ref1], moet degene, tot wie de aanschrijving is
      gericht, of zijn rechtsopvolger, ook al is die aanschrijving nog niet onherroepelijk, bij voorraad aan die
      aanschrijving voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 16a
        hoofdstuk: III
        afdeling: '2'
  - number: '21.3'
    text: |-
      Indien tegen een aanschrijving als bedoeld in het tweede lid, een bezwaarschrift is ingediend of beroep is
      ingesteld en het bezwaarschrift gegrond is verklaard of de beslissing op het beroep inhoudt dat ten onrechte is
      aangeschreven, vergoedt de gemeente de schade die het gevolg is van het bij voorraad voldoen aan de aanschrijving.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel21
  - number: '22.1'
    text: |-
      In afwijking van [artikel 203 van Boek 7 van het Burgerlijk Wetboek][ref1], is elke bewoner van een woning of
      een gebruiker van een gebouw verplicht het aanbrengen of verrichten van de in een aanschrijving als bedoeld
      in [artikel 15, eerste lid][ref2], [15a, eerste lid][ref3], [16][ref4], [17a][ref5] of [17b][ref6] genoemde
      verbeteringen of ingrepen door of vanwege degene, tot wie de aanschrijving is gericht of diens rechtsopvolger te
      gedogen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel17a
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel17b
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 15a
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 17a
        hoofdstuk: III
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005181
        artikel: 17b
        hoofdstuk: III
        afdeling: '2'
  - number: '22.2'
    text: |-
      Ingeval enige bewoner van een woning niet voldoet aan de in het eerste lid bedoelde gedoogplicht, zijn de door de
      burgemeester en wethouders aan te wijzen personen bevoegd zonder toestemming van die bewoner de woning binnen te
      treden ten einde de in de aanschrijving aangegeven verbeteringen aan te brengen, voor zover dat redelijkerwijs voor
      de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel22
  - number: '22.3'
    text: |-
      Burgemeester en wethouders geven slechts toepassing aan het bepaalde in het tweede lid op verzoek van en na overleg
      met degene tot wie de in het eerste lid bedoelde aanschrijving is gericht of diens rechtsopvolger.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel22
  - number: '22.4'
    text: |-
      Een machtiging tot binnentreden wordt niet gegeven dan nadat burgemeester en wethouders de in het tweede lid
      bedoelde bewoner schriftelijk hebben gewaarschuwd.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel22
  - number: '22.5'
    text: |-
      Indien ten behoeve van een woning waarop een aanschrijving als bedoeld in het eerste lid, rust, wijzigingen moeten
      worden aangebracht in een andere woning of ander gebouw, is de eigenaar van die andere woning of dat andere gebouw
      of diens rechtsopvolger alsmede iedere bewoner van die andere woning of iedere gebruiker van dat andere gebouw,
      na schriftelijke aanzegging door burgemeester en wethouders, verplicht het aanbrengen van die wijzigingen door
      of vanwege degene, tot wie de aanschrijving is gericht, of zijn rechtsopvolger te gedogen. Het tweede tot en met
      vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel22
  - number: '23.1'
    text: |-
      Indien burgemeester en wethouders van oordeel zijn dat de kosten, verbonden aan de uitvoering van een
      aanschrijving, niet in redelijke verhouding staan tot de daarvan te verwachten opbrengsten en de aanschrijving
      betrekking heeft op een woning, woonkeet of woonwagen, laten zij bij die aanschrijving de keuze tussen enerzijds
      het uitvoeren van de aanschrijving en anderzijds het binnen een door hen in de aanschrijving te bepalen termijn
      staken of doen staken van de bewoning.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel23
  - number: '23.2'
    text: |-
      Burgemeester en wethouders zijn niet verplicht de in het eerste lid genoemde keuze te laten ingeval de woning of
      woonwagen behoort tot een in het belang van een evenwichtige en rechtvaardige verdeling van schaarse woonruimte bij
      verordening aangewezen categorie van woningen of woonwagens.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel23
  - number: '23.3'
    text: |-
      Indien burgemeester en wethouders van oordeel zijn dat de kosten, verbonden aan de uitvoering van een
      aanschrijving, niet in redelijke verhouding staan tot de daarvan te verwachten opbrengsten en de aanschrijving
      betrekking heeft op een niet tot bewoning bestemd gebouw, een bouwwerk, niet zijnde een gebouw, dan wel op
      een standplaats, laten zij bij die aanschrijving de keuze tussen enerzijds het treffen van de voorzieningen en
      anderzijds het binnen een door hen in de aanschrijving te bepalen termijn staken of doen staken van het gebruik, in
      verband waarmede de voorzieningen worden gelast.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel23
  - number: '23.4'
    text: |-
      In afwijking van het eerste en derde lid kunnen burgemeester en wethouders, indien zij van oordeel zijn dat de
      kosten, verbonden aan de uitvoering van een aanschrijving, niet in redelijke verhouding staan tot de daarvan te
      verwachten opbrengsten en de aanschrijving geschiedt met het oog op ernstige strijdigheid met redelijke eisen
      van welstand, beoordeeld naar de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel b][ref1], bij die
      aanschrijving de keuze laten tussen enerzijds het uitvoeren van de aanschrijving en anderzijds het binnen een
      door hen in de aanschrijving te bepalen termijn slopen van het bouwwerk of de standplaats, met dien verstande dat
      indien het slopen krachtens enig wettelijk voorschrift verboden is, zij slechts aanschrijven tot het treffen van
      de voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '24'
    text: |-
      Indien burgemeester en wethouders van oordeel zijn dat de kosten, verbonden aan de uitvoering van een aanschrijving
      als bedoeld in [artikel 23, eerste of derde lid][ref1], niet in redelijke verhouding staan tot de daarvan te
      verwachten opbrengsten en de aanschrijving geschiedt met het oog op gevaar of ernstige hinder dan wel het een
      aanschrijving als bedoeld in [artikel 16a][ref2] betreft, kunnen zij, in plaats van de in die leden bedoelde
      keuze, de keuze laten tussen het treffen van de voorzieningen en het binnen een door hen in de aanschrijving te
      bepalen termijn slopen van het bouwwerk of de standplaats, met dien verstande dat indien het slopen ingevolge enig
      wettelijk voorschrift verboden is, zij de keuze, bedoeld in die leden, laten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '23'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 16a
        hoofdstuk: III
        afdeling: '2'
  - number: '25'
    text: |-
      Behoudens in geval van gevaar of ernstige hinder dan wel het een aanschrijving als bedoeld in [artikel 16a][ref1]
      betreft vaardigen burgemeester en wethouders gedurende drie jaren na de bekendmaking van een aanschrijving tot het
      treffen van voorzieningen of het aanbrengen van verbeteringen met betrekking tot hetzelfde bouwwerk of dezelfde
      standplaats niet wederom een dergelijke aanschrijving uit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 16a
        hoofdstuk: III
        afdeling: '2'
  - number: '26.1'
    text: |-
      Spoedeisende gevallen uitgezonderd gaan burgemeester en wethouders niet over tot toepassing van bestuursdwang in
      geval van strijd met:
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel26
  - number: 26.1.a
    text: |-
      een bij of krachtens de in [artikel 2][ref1] bedoelde algemene maatregel van bestuur gegeven voorschrift omtrent
      bouwwerken of standplaatsen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: 26.1.b
    text: |-
      een in de bouwverordening gegeven voorschrift omtrent bestaande bouwwerken, standplaatsen of open erven en
      terreinen, of
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel26
  - number: 26.1.c
    text: |-
      redelijke eisen van welstand, beoordeeld naar de criteria, bedoeld in [artikel 12a, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
        hoofdstuk: II
        afdeling: '3'
  - number: '26.2'
    text: |-
      Burgemeester en wethouders kunnen de beschikking tot toepassing van bestuursdwang gelijktijdig met de
      desbetreffende aanschrijving bekendmaken. Deze beschikking tot toepassing van bestuursdwang wordt geacht voor de
      mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] deel uit te maken van de
      beschikking waarop zij betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '26.3'
    text: |-
      Ingeval burgemeester en wethouders een aanschrijving met toepassing van [artikel 23, eerste of derde lid][ref1], of
      [artikel 24][ref2] hebben uitgevaardigd, is het eerste lid van toepassing, met dien verstande dat zij, indien niet
      is voldaan aan enig in de aanschrijving genoemd alternatief, tot één van die alternatieven kunnen dwingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel24
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '23'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '24'
        hoofdstuk: III
        afdeling: '2'
  - number: '26.4'
    text: |-
      Voor de toepassing van de [artikelen 5:25][ref1] en [5:26 van de Algemene wet bestuursrecht][ref2] wordt onder
      «overtreder» mede begrepen de rechtsopvolger van degene, tot wie een aanschrijving is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '27.1'
    text: |-
      De inspecteur kan bij met redenen omkleed voorstel burgemeester en wethouders verzoeken een aanschrijving met
      betrekking tot een woning, woonkeet, woonwagen of standplaats uit te vaardigen.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel27
  - number: '27.2'
    text: |-
      Burgemeester en wethouders nemen naar aanleiding van een voorstel als bedoeld in het eerste lid, binnen vier weken
      na de dag, waarop zij dat voorstel hebben ontvangen, een beslissing.
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel27
  - number: '28.1'
    text: |-
      Burgemeester en wethouders doen mededeling van een aanschrijving als bedoeld in de
      [artikelen 14, eerste lid][ref1], [15][ref2], [15][ref3], [16][ref4], [16a][ref5][17, eerste lid][ref6],
      [17a, eerste lid][ref7], [17b][ref8], [18, eerste lid][ref9], voor zover deze betrekking heeft op een standplaats,
      of [19][ref10], door toezending van een afschrift aan de hoofdbewoner of iedere afzonderlijke bewoner van de
      woning, woonkeet of woonwagen dan wel hoofdgebruiker of iedere afzonderlijke gebruiker van het gebouw, niet
      zijnde een woning, woonkeet of woonwagen, of van de standplaats, alsmede aan een ieder die als beslaglegger of
      hypotheekhouder is ingeschreven in de openbare registers, bedoeld in afdeling 3.1.2 van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel16a
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel17a
      [ref8]: https://wetten.overheid.nl/BWBR0005181#Artikel17b
      [ref9]: https://wetten.overheid.nl/BWBR0005181#Artikel18
      [ref10]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0005181/2006-03-08#Artikel28
    references:
