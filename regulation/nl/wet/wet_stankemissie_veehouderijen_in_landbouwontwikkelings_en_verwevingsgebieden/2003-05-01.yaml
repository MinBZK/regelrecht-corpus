preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot beslissingen
    inzake vergunningen krachtens de Wet milieubeheer voor veehouderijen, voorzover het betreft de stankemissies van
    veehouderijen in landbouwontwikkelingsgebieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013693/2003-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      *agrarisch bedrijf*: veehouderij of andere inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen categorie behoort en uitsluitend of in hoofdzaak
      is bestemd voor het verbouwen van akkerbouw- of tuinbouwproducten;

      *bijlage*: bij deze wet behorende bijlage;

      *dierenverblijf*: al dan niet overdekte ruimte waarbinnen dieren worden gehouden;

      *extensiveringsgebied*: extensiveringsgebied als bedoeld in
      [artikel 1 van de Reconstructiewet concentratiegebieden][ref2];

      *kleinschalige nevenactiviteit*: bij gemeentelijke verordening als zodanig aangewezen activiteit, die een
      organisatorische binding heeft met een agrarisch bedrijf en binnen de inrichting, of in de onmiddellijke nabijheid
      daarvan plaatsvindt;

      *landbouwontwikkelingsgebied*: landbouwontwikkelingsgebied, als bedoeld in
      [artikel 1 van de Reconstructiewet concentratiegebieden][ref3];

      *mestvarkeneenheid*: eenheid die aangeeft met hoeveel mestvarkens een dier, behorende tot een bij ministeriële
      regeling aangewezen categorie, gelijkgesteld wordt wat betreft stankemissie;

      *mestverwerkinginstallatie*: een of meer tot een veehouderij behorende installaties waarin mest verwerkt wordt met
      een gezamenlijke verwerkingscapaciteit van ten hoogste 25 000 m3 mest per jaar;

      *omrekeningsfactor*: bij ministeriële regeling aan te wijzen factor die aangeeft hoeveel dieren, behorende tot de
      in die regeling genoemde diercategorie, die zijn gehuisvest in het daarbij vermelde huisvestingssysteem, gelijk
      worden gesteld met één mestvarkeneenheid;

      *Onze Minister*: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      *reconstructieplan*: plan, als bedoeld in [artikel 11 van de Reconstructiewet concentratiegebieden][ref4];

      *stankhinder*: gevolgen voor het milieu, die een veehouderij kan veroorzaken door de emissie van stank uit de tot
      de veehouderij behorende dierenverblijven en mestverwerkingsinstallatie;

      *veehouderij*: inrichting, die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref5] aangewezen
      categorie behoort en is bestemd voor het kweken, fokken, mesten, houden, verhandelen, verladen of wegen van dieren;

      *vergunning*: vergunning krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref6];

      *verwevingsgebied*: verwevingsgebied als bedoeld in [artikel 1 van de Reconstructiewet concentratiegebieden][ref7].

      2 In deze wet en de daarop berustende bepalingen wordt verstaan onder voor stank gevoelig object:

      a. voor stank gevoelig object categorie I:

      1°. bebouwde kom met stedelijk karakter;

      2°. ziekenhuis, sanatorium en internaat;

      3°. objecten voor verblijfsrecreatie;

      b. voor stank gevoelig object categorie II:

      1°. bebouwde kom of aaneengesloten woonbebouwing van beperkte omvang in een overigens agrarische omgeving;

      2°. objecten voor dagrecreatie;

      c. voor stank gevoelig object categorie III:

      verspreid liggende niet-agrarische bebouwing die aan het betreffende buitengebied een overwegende woon- of
      recreatiefunctie verleent;

      d. voor stank gevoelig object categorie IV:

      1°. woning, behorend bij een agrarisch bedrijf, niet zijnde een veehouderij waar 50 of meer mestvarkeneenheden op
      grond van een vergunning aanwezig mogen zijn;

      2°. verspreid liggende niet-agrarische bebouwing;

      e. voor stank gevoelig object categorie V:

      woning, behorend bij een veehouderij waar 50 of meer mestvarkeneenheden op grond van een vergunning aanwezig mogen
      zijn.

      3 In afwijking van het tweede lid worden niet als voor stank gevoelig object
      aangemerkt een kampeerterrein als bedoeld in [artikel 8, tweede lid, onder a][ref8], of
      [artikel 8, derde lid, van de Wet op de openluchtrecreatie][ref9], een gebouw of een als kamphuis of blokhut aan te
      merken bouwwerk, dat deel uitmaakt van een agrarisch bedrijf en ter beschikking wordt gesteld voor het houden van
      recreatief nachtverblijf.

      4 Bij ministeriële regeling wordt aangegeven op welke wijze bij de toepassing van deze wet en de daarop berustende
      bepalingen:

      a. de afstand tussen een veehouderij en een voor stank gevoelig object wordt bepaald;

      b. stankemissie, veroorzaakt door de dierenverblijven en de mestverwerkingsinstallatie, wordt omgerekend in
      mestvarkeneenheden.


