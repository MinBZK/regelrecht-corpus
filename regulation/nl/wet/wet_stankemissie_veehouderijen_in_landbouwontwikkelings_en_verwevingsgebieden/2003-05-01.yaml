  - number: '4'
    text: |-
      1 Onverminderd [artikel 3, eerste lid][ref1], bedraagt de afstand tussen een veehouderij waar dieren worden
      gehouden van een diercategorie, waarvoor in de ministeriële regeling bedoeld in [artikel 1][ref2] geen
      omrekeningsfactor is opgenomen, en een voor stank gevoelig object, ten minste de afstand die voor de betrokken
      diercategorie bij ministeriële regeling is aangegeven.

      2 De afstand tussen een veehouderij en een voor stank gevoelig object categorie V bedraagt ten minste 50 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0013693#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013693#Artikel1
    url: https://wetten.overheid.nl/BWBR0013693/2003-05-01#Artikel4
