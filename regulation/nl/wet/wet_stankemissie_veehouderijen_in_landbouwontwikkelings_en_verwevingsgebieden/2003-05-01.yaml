  - number: '2'
    text: |-
      1 Bij beslissingen inzake de vergunning voor het oprichten of veranderen van een veehouderij die geheel of
      gedeeltelijk is gelegen in een landbouwontwikkelingsgebied, verwevingsgebied of een extensiveringsgebied met
      het primaat natuur waarvoor een reconstructieplan is bekendgemaakt, betrekt het bevoegd gezag de stankhinder
      uitsluitend op de wijze die is aangegeven bij of krachtens de [artikelen 3 tot en met 6][ref1].

      2 Het eerste lid geldt niet voor voorschriften die worden gesteld met toepassing van de [artikelen 8.11][ref2],
      [8.44][ref3], [8.45][ref4] of [8.46 van de Wet milieubeheer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013693#Artikel3
