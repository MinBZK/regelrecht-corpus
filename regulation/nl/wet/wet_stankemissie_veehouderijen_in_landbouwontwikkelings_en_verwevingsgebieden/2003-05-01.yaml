        artikel: '1'
  - number: '5'
    text: |-
      Met inachtneming van de [artikelen 3, eerste lid,][ref1] en [4][ref2], bedraagt de afstand van de buitenzijde van
      een dierenverblijf of een mestverwerkingsinstallatie tot de buitenzijde van een voor stank gevoelig object:

      a. categorie I of II: ten minste 50 meter;

      b. categorie III of IV: ten minste 25 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0013693#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013693#Artikel4
    url: https://wetten.overheid.nl/BWBR0013693/2003-05-01#Artikel5
