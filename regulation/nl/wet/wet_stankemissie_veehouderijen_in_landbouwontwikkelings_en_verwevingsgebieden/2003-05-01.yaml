  - number: '3'
    text: |-
      1 Een vergunning voor een veehouderij wordt geweigerd, indien de afstand van de veehouderij tot een voor stank
      gevoelig object, behorend tot een van de categorieën I tot en met IV, dat niet tot de veehouderij behoort, minder
      bedraagt dan het aantal meters dat volgt uit de in de bijlage opgenomen berekeningsmethode.

      2 In afwijking van het eerste lid wordt een vergunning niet geweigerd, indien:

      a. het aantal dieren, dat overeenkomstig de voor de veehouderij geldende vergunning aanwezig mag zijn, van geen
      enkele van de diercategorieën toeneemt,

      b. het aantal in de veehouderij overeenkomstig de voor de veehouderij geldende vergunning toegestane
      mestvarkeneenheden niet toeneemt en

      c. de afstand tot een voor stank gevoelig object als bedoeld in het eerste lid niet afneemt.

      3 Indien:

      a. voor een veehouderij een vergunning wordt aangevraagd als bedoeld in
      [artikel 8.1, eerste lid, onder b, van de Wet milieubeheer][ref1] met het oog op uitbreiding van het aantal in de
      veehouderij te houden dieren van één of meer diercategorieën,

      b. de afstand tussen de veehouderij en een voor stank gevoelig object, voorafgaand aan de uitbreiding, kleiner is
      dan overeenkomstig [artikel 3, eerste lid][ref2], zou zijn toegestaan en

      c. het aantal in de veehouderij overeenkomstig de voor de veehouderij geldende vergunningen toegestane
      mestvarkeneenheden zal afnemen door toepassing van bij de aanvraag aangegeven maatregelen die stankemissie
      reduceren en de afstand tussen de veehouderij en een voor stank gevoelig object na de uitbreiding niet kleiner
      wordt, wordt de vergunning slechts verleend indien de uitbreiding van het aantal dieren als gevolg van de
      verandering van de inrichting niet meer bedraagt dan de helft van het aantal dieren dat overeenkomt met de reductie
      van de stankemissie, uitgedrukt in mestvarkeneenheden, die door het toepassen van de bij de aanvraag aangegeven
      maatregelen bereikt wordt.

      4 In afwijking van het derde lid wordt de vergunning geweigerd, indien in een geval als bedoeld in dat lid, de
      afstand tussen de veehouderij en een voor stank gevoelig object kleiner is dan 50 meter, dan wel, indien deze meer
      bedraagt dan 50 meter, kleiner is dan de helft van de overeenkomstig het eerste lid toegestane afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0013693#Artikel3
