        bwb_id: BWBR0013693
        artikel: '4'
  - number: '6'
    text: |-
      Voor de toepassing van de [artikelen 3 tot en met 5][ref1] wordt:

      a. een woning die op of na 19 maart 2000 tot een veehouderij behoorde en daartoe niet meer behoort, gelijkgesteld
      met een gevoelig object, behorende tot dezelfde categorie als een bij die veehouderij behorende woning;

      b. een woning, die op of na 19 maart 2000, in samenhang met het geheel of gedeeltelijk buiten werking stellen na
      die datum van een veehouderij en de sloop van bij die veehouderij behorende bedrijfsgebouwen, is gebouwd op een
      kavel die op die datum behoorde tot die veehouderij, gelijkgesteld met een gevoelig object, behorende tot dezelfde
      categorie als een bij die veehouderij behorende woning;

      c. een kleinschalige nevenactiviteit en een zodanige activiteit die na het geheel of gedeeltelijk buiten werking
      stellen van het agrarisch bedrijf op of na 19 maart 2000 is voortgezet of opgestart, gelijkgesteld met een gevoelig
      object, behorende tot dezelfde categorie als een bij een veehouderij behorende woning.


      [ref1]: https://wetten.overheid.nl/BWBR0013693#Artikel3
