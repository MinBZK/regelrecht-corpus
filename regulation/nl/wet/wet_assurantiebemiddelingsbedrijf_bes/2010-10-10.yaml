  - number: '22'
    text: |-
      Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op de curator in het faillissement van
      een assurantiebemiddelaar. De curator doet mededeling aan de Autoriteit Financiële Markten van het tijdstip van de
      aanvaarding en van de beëindiging van zijn functie.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel4
