        hoofdstuk: IV
  - number: '14'
    text: |-
      Een verzekeraar die door een assurantiebemiddelaar wordt benaderd met voorstellen tot bemiddeling bij het sluiten
      van verzekeringen, dient zich te vergewissen van de inschrijving van de betrokken assurantiebemiddelaar in het
      register.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel14
  - number: '15'
    text: |-
      1 De assurantiebemiddelaar heeft jegens de verzekeraar aanspraak op provisie over alle tot zijn portefeuille
      behorende verzekeringen met dien verstande dat een verzekering die door bemiddeling van eerstgenoemde tot stand
      is gekomen of naar zijn portefeuille is overgeboekt tot zijn portefeuille behoort zolang deze daaruit niet is
      overgeboekt.

      2 Doorhaling van de inschrijving van een assurantiebemiddelaar in het register laat onverlet zijn aanspraken op
      provisie ter zake van verzekeringen die op het tijdstip van de doorhaling tot zijn portefeuille behoren of waarop
      op dat tijdstip [artikel 16, tweede lid][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel16
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028566
        artikel: '16'
        hoofdstuk: IV
  - number: '16'
    text: |-
      1 De verzekeraar kan slechts met toestemming van de assurantiebemiddelaar of diens rechtverkrijgenden een deel of
      het geheel van diens portefeuille naar de portefeuille van een andere assurantiebemiddelaar overboeken.

      2 In afwijking van het in het eerste lid bepaalde boekt de verzekeraar op schriftelijk verzoek van een
      verzekeringnemer diens verzekering uit de portefeuille van een assurantiebemiddelaar over naar die van een andere
      assurantiebemiddelaar, tenzij de verzekeraar gegronde bezwaren heeft tegen laatstbedoelde assurantiebemiddelaar.

      3 Na de in het eerste lid bedoelde overboeking blijft, in afwijking van [artikel 15, eerste lid][ref1], de
      aanspraak op provisies bestaan tot het einde van het lopende verzekeringsjaar indien het een levensverzekering
      betreft. Indien het een schadeverzekering betreft, blijft de aanspraak bestaan tot de eerstvolgende vervaldatum
      van de verzekeringsovereenkomst of tot een eerder tijdstip waarop de verzekering door opzegging door de
      verzekeringnemer kan worden beëindigd, tenzij anders wordt overeengekomen.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing op het door een verzekeraar in eigen beheer nemen
      van een verzekering.

      5 In geval van een verzoek van een assurantiebemiddelaar tot overboeking, verleent de verzekeraar zijn medewerking
      aan de gehele of gedeeltelijke overdracht van de portefeuille van de oorspronkelijke assurantiebemiddelaar
      naar een andere assurantiebemiddelaar, tenzij de verzekeraar gegronde bezwaren heeft tegen laatstbedoelde
      assurantiebemiddelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel15
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel16
