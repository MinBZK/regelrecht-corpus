        artikel: '12'
        hoofdstuk: III
  - number: '12'
    text: |-
      1 Het is een assurantiebemiddelaar verboden aan een verzekeringnemer dan wel aan hen te wier behoeve een
      verzekering is gesloten in geval van schade een afmakingscourtage in rekening te brengen.

      2 Van dit verbod kan de Autoriteit Financiële Markten voor bepaalde, bij algemene maatregel van bestuur te
      bepalen vormen van verzekering ontheffing verlenen aan de assurantiebemiddelaar die ten genoegen van de Autoriteit
      Financiële Markten aantoont dat hij over het daartoe geschikte bedrijfsapparaat en expertise beschikt en de
      redelijkerwijs van hem te eisen inspanningen bij de schadeafwikkeling kan verrichten.

      3 De Autoriteit Financiële Markten kan de beoordeling van de kwaliteit van het bedrijfsapparaat, de expertise en de
      procedures voor de afwikkeling van schaden ten laste van de betreffende assurantiebemiddelaar door een deskundige
      derde laten doen.

      4 De afmakingscourtage die in rekening mag worden gebracht, bedraagt ten hoogste één procent van het aan de
      verzekerde uit te keren schadebedrag.

      5 De in het tweede lid bedoelde ontheffing geldt voor een periode van drie jaren en kan telkenmale met drie jaren
      worden verlengd. Zij kan evenwel tussentijds worden ingetrokken indien de betrokken assurantiebemiddelaar niet meer
      voldoet aan de eisen, gesteld voor het verkrijgen van de ontheffing.

      6 De ontheffing bedoeld in het tweede lid wordt in het register opgenomen en gepubliceerd overeenkomstig de
      bepalingen van [artikel 4 derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel4
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel12
