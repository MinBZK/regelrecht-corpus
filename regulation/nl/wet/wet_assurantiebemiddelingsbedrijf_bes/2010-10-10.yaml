    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Assurantiebemiddelaar:* ieder die, anders dan uit hoofde van een arbeidsovereenkomst, bemiddeling verleent bij
      het sluiten van een verzekering;

      b. *sub - agent:* ieder die namens en voor rekening van een assurantiebemiddelaar zijn bemiddeling verleent bij het
      sluiten van een verzekering;

      c. *verzekeraar:* ieder die op grond van de [Wet toezicht verzekeringsbedrijf BES][ref1] voor eigen rekening het
      verzekeringsbedrijf uitoefent;

      d. *gevolmachtigd agent:* ieder die als gevolmachtigde vertegenwoordiger van een verzekeraar voor diens rekening
      het verzekeringsbedrijf uitoefent;

      e. *Autoriteit Financiële Markten:* Stichting Autoriteit Financiële Markten;

      f. *Onze Minister:* Onze Minister van Financiën;

      g. *openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      h. *buitenland:* een deel van het Koninkrijk, niet zijnde een openbaar lichaam, dan wel een andere Staat.

      2 De bij of krachtens deze wet uitgevaardigde voorschriften, die van toepassing zijn op een verzekeraar, zijn
      eveneens van toepassing op de gevolmachtigde agent.


      [ref1]: https://wetten.overheid.nl/BWBR0028495
