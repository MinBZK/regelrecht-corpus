  - number: '8'
    text: |-
      1 Op een daartoe strekkend schriftelijk verzoek van een assurantiebemiddelaar kan de Autoriteit Financiële Markten
      ontheffing verlenen van de in [artikel 6, eerste lid, onderdeel a][ref1], bedoelde vakbekwaamheideis. De ontheffing
      kan onder voorwaarden geschieden. Een afwijzende beschikking op het verzoek is met redenen omkleed.

      2 De in het eerste lid bedoelde ontheffing kan met terugwerkende kracht worden verleend. De ontheffing geldt voor
      ten hoogste één jaar en kan ten hoogste tweemaal met een jaar worden verlengd.

      3 Bij de inschrijving in het register van degene aan wie een ontheffing als bedoeld in het eerste lid is verleend,
      wordt aangetekend:

      a. de grond van de ontheffing;

      b. de termijn waarvoor de ontheffing is verleend;

      c. de naam van de in het eerste lid bedoelde assurantiebemiddelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel6
