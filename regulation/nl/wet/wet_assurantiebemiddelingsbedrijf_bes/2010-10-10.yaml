        artikel: '4'
        hoofdstuk: II
  - number: '23'
    text: |-
      1 De Autoriteit Financiële Markten kan degene die niet of niet tijdig voldoet aan zijn uit deze wet voortvloeiende
      verplichtingen, een boete opleggen.

      2 De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste USD 25.000 bedraagt.

      3 Alvorens over te gaan tot oplegging van een boete stelt de Autoriteit Financiële Markten betrokkene schriftelijk
      op de hoogte van het voornemen hem een boete op te leggen, onder vermelding van de gronden waarop dat voornemen
      berust.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel23
  - number: '24'
    text: |-
      1 Handelen in strijd met de [artikelen 4, eerste lid][ref1]; [9, eerste lid][ref2];
      [12, eerste en vierde lid][ref3]; [13 eerste lid][ref4]; [14][ref5]; en [20, tweede lid][ref6], wordt gestraft
      hetzij met hechtenis van ten hoogste zes maanden en geldboete van de vierde categorie, hetzij met een van deze
      straffen. De hierbij strafbaar gestelde feiten zijn overtredingen.

      2 Indien evenwel het handelen in strijd met de [artikelen 4, eerste lid][ref7]; [13, eerste lid][ref8]; [14][ref9];
      en [20, tweede lid][ref10], opzettelijk heeft plaatsgevonden, is het strafbaar gestelde feit een misdrijf dat wordt
      gestraft met hetzij gevangenisstraf van ten hoogste vier jaar en een geldboete van de vijfde categorie, hetzij met
      een van deze straffen.


