  - number: '17'
    text: |-
      1 Tenzij anders wordt overeengekomen verzorgt de assurantiebemiddelaar voor de verzekeraar het incasso der premies.

      2 De assurantiebemiddelaar is te allen tijde rekening en verantwoording schuldig aan de verzekeraar ter zake van
      het incasso der premies. Betaling van de verschuldigde premie en kosten aan de assurantiebemiddelaar bevrijdt de
      verzekeringnemer van zijn betalingsverplichting jegens de verzekeraar door de gelijktijdige overneming van genoemde
      betalingsverplichting jegens de verzekeraar door de assurantiebemiddelaar.

      3 Indien de inschrijving van de assurantiebemiddelaar in het register is doorgehaald, beëindigt de verzekeraar het
      incasso der premies door de assurantiebemiddelaar.

      4 Tenzij tussen een verzekeraar en een assurantiebemiddelaar anders is overeengekomen, kan de verzekeraar de
      assurantiebemiddelaar van het incasso der premies ontheffen indien:

      a) de assurantiebemiddelaar het incasso der premies in ernstige mate verwaarloost;

      b) de assurantiebemiddelaar in gebreke blijft namens de verzekeraar door hem geïnde premies tijdig aan de
      verzekeraar af te dragen danwel zich schuldig maakt aan handelingen die de vrees wettigen dat hij niet zal voldoen
      aan zijn uit het incasso der premies voortvloeiende verplichtingen.

      5 In de gevallen waarin ingevolge het bepaalde in het derde en vierde lid het door een assurantiebemiddelaar
      gevoerde incasso der premies eindigt, wordt dit door de verzekeraar overgenomen.

      6 Hoewel het overnemen van het incasso der premies de aanspraak op provisie van de assurantiebemiddelaar onverlet
      laat, is de verzekeraar dan bevoegd hetzij aan de assurantiebemiddelaar premie-incassokosten in rekening te
      brengen, hetzij de aanspraak van de assurantiebemiddelaar op provisie af te kopen. Zo nodig kunnen bij algemene
      maatregel van bestuur nadere regelen worden vastgesteld ter zake van de door de assurantiebemiddelaar verschuldigde
      kosten of de aan de assurantiebemiddelaar verschuldigde afkoopsom.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel17
  - number: '18'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      de Autoriteit Financiële Markten aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel519
