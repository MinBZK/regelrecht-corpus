        artikel: '4'
        hoofdstuk: II
  - number: '13'
    text: |-
      1 Het is verboden ter zake van een verzekering direct of indirect provisie, retourprovisie of enig ander op geld
      waardeerbaar voordeel toe te kennen, af te staan of te beloven aan anderen dan de assurantiebemiddelaar tot wiens
      portefeuille de verzekering behoort, onverminderd [artikel 16, derde lid][ref1].

      2 Bij ministeriële regeling kan vrijstelling worden verleend van het verbod, bedoeld in het eerste lid, indien het
      verbod strijdig is met algemeen erkende gebruiken of het algemeen belang van het verzekeringsbedrijf.

      3 Aan een vrijstelling kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel16
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel13
