      1 De Autoriteit Financiële Markten stelt jaarlijks een begroting, een jaarrekening en een jaarverslag op
      terzake van de haar op grond van deze wet opgedragen taken en de daaruit voortvloeiende werkzaamheden. De
      [artikelen 1:30 tot en met 1:33][ref1], [1:35][ref2] en [1:36 van de Wet op het financieel toezicht][ref3] zijn van
      overeenkomstige toepassing.

      2 Tegen besluiten van Onze Minister inzake instemming met de begroting of de jaarrekening staat geen beroep open.


