        artikel: '5'
        hoofdstuk: II
  - number: '10'
    text: |-
      1 Alvorens een inschrijving op grond van [artikel 7, eerste lid, sub g][ref1] door te halen, stelt de Autoriteit
      Financiële Markten de betrokken assurantiebemiddelaar of diens gemachtigde in de gelegenheid binnen een maand na
      een aanschrijving daartoe van de Autoriteit Financiële Markten, aan te tonen, dat hij recht heeft op handhaving van
      zijn inschrijving.

      2 De Autoriteit Financiële Markten gaat niet tot doorhaling als bedoeld in het eerste lid over dan nadat de
      beschikking tot doorhaling onherroepelijk is geworden.

      3 De Autoriteit Financiële Markten doet de belanghebbende onverwijld schriftelijk mededeling van haar beschikking
      tot doorhaling van een inschrijving.

      4 Een doorhaling als bedoeld in [artikel 7, eerste en tweede lid][ref2], wordt door de Autoriteit Financiële
      Markten bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel7
