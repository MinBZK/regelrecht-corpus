  - number: '11'
    text: |-
      De beloning van de assurantiebemiddelaar bestaat, onverminderd [artikel 12, tweede lid][ref1], uitsluitend uit
      provisie ter zake van het bemiddelen bij het afsluiten van verzekeringen, het bemiddelen bij het verlengen van
      verzekeringen of het incasseren van premies.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel12
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel11
