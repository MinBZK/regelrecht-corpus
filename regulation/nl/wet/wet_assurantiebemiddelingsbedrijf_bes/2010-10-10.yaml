  - number: '2'
    text: |-
      1 Het bij of krachtens deze wet bepaalde is, tenzij daaruit anders voortvloeit, van toepassing op alle
      assurantiebemiddelingsactiviteiten in de openbare lichamen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat, en zonodig onder welke voorwaarden, deze wet geheel of
      gedeeltelijk niet van toepassing is op de bemiddeling van bij die maatregel aan te wijzen vormen van verzekering.

      3 Bij algemene maatregel van bestuur kunnen categorieën van assurantiebemiddelaars worden aangewezen, waarop deze
      wet geheel of gedeeltelijk niet van toepassing is. Deze aanwijzing kan onder voorwaarden geschieden.

      4 Onze Minister kan assurantiebemiddelaars die kantoor houden in het buitenland, vrijstelling verlenen van de bij
      of krachtens deze wet gestelde regels, indien de belangen die deze wet beoogt te beschermen, in voldoende mate
      gewaarborgd worden door het toezicht dat aldaar op assurantiebemiddelaars wordt uitgeoefend. Aan de vrijstelling
      kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Het bij of krachtens deze wet bepaalde is, in zoverre voldaan wordt aan de in het tweede lid genoemde
      voorwaarden, niet van toepassing op de assurantiebemiddelaar die tijdelijk in een openbaar lichaam verblijft om
      aldaar te bemiddelen ter zake van een verzekering die:

      a. een verzekeraar vanuit een vestiging buiten de openbare lichamen sluit met een verzekeringnemer die
      rechtspersoon is of handelt in de uitoefening van een bedrijf of beroep;

      b. een verzekeraar vanuit een vestiging in de openbare lichamen sluit met een verzekeringnemer die in het
      buitenland woonachtig of gevestigd is.

      2 De in het eerste lid bedoelde voorwaarden houden in dat:

      a. de assurantiebemiddelaar in het buitenland is geregistreerd op een wijze die vergelijkbaar is met de in deze wet
      geregelde registratie;

      b. ingeval het bepaalde in het eerste lid onderdeel a, het naar de aard en de waarde van het te verzekeren belang,
      niet binnen de openbare lichamen verzekerbare risico’s betreft. Bij algemene maatregel van bestuur kunnen nadere
      regels worden gesteld ten aanzien van de aard en de waarde van het te verzekeren belang;

      c. de betrokken assurantiebemiddelaar jaarlijks binnen drie maanden na afloop van het kalenderjaar aan de
      Autoriteit Financiële Markten een bewijs overlegt van de registratie in zijn land van domicilie alsmede van de door
      zijn bemiddeling in het afgelopen kalenderjaar tot stand gekomen overeenkomsten van verzekering middels een door de
      Autoriteit Financiële Markten vast te stellen modelformulier.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden als assurantiebemiddelaar op te treden zonder te zijn ingeschreven in het register van
      assurantiebemiddelaars dat door de Autoriteit Financiële Markten wordt gehouden.

      2 Ten aanzien van het register gelden de volgende bepalingen:

      a. Het register wordt onderverdeeld in de Afdeling «Leven» en de Afdeling «Schade». Een assurantiebemiddelaar kan
      in beide afdelingen worden ingeschreven.

      b. In het register wordt aangetekend of het een afhankelijke dan wel een onafhankelijke assurantiebemiddelaar
      betreft.

      3 Binnen 60 dagen na afloop van elk kalenderjaar maakt de Autoriteit Financiële Markten de namen bekend van de
      assurantiebemiddelaars die op 31 december van dat kalenderjaar in het register waren ingeschreven alsmede hun
      status ingevolge [artikel 4, tweede lid, onderdeel b][ref1]. Tussentijds kan de Autoriteit Financiële Markten
      wijzigingen bekend maken.

      4 Bij algemene maatregel van bestuur kan worden bepaald welke aanvullende gegevens tevens dienen te worden bekend
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel4
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel4
