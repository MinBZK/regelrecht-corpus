        artikel: 5:19
  - number: '19'
    text: |-
      1 De aanvrager van een besluit op grond van deze wet is voor het in behandeling nemen van de aanvraag een
      vergoeding verschuldigd van de met de behandeling van de aanvraag verband houdende kosten.

      2 Bij ministeriële regeling worden de tarieven vastgesteld ter vergoeding van de in het eerste lid bedoelde kosten.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de doorberekening van
      kosten, verband houdend met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel19
  - number: '20'
    text: |-
      1 Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke
      assurantiebemiddelaars zijn verkregen, zijn geheim, niettegenstaande enige andere wettelijke regeling hieromtrent.

      2 Het is aan een ieder die uit hoofde van de toepassing van de bij of krachtens deze wet genomen besluiten enige
      taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verkregen, verder of anders gebruik te
      maken of daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt
      geëist.

      3 In afwijking van het bepaalde in het eerste en tweede lid is de Autoriteit Financiële Markten bevoegd ter
      handhaving van een gezonde bedrijfstak van assurantiebemiddeling aangifte te doen van een vermoeden van een
      strafbaar feit. In de gevallen waarin door de Autoriteit Financiële Markten aangifte is gedaan, dan wel in de
      gevallen waarin de Autoriteit Financiële Markten wordt opgeroepen om als getuige of deskundige op te treden,
      is de Autoriteit Financiële Markten bevoegd in het kader van de opsporing, het gerechtelijk vooronderzoek of de
      behandeling ter terechtzitting, inlichtingen te verschaffen met dien verstande dat het een strafzaak betreft.

      4 In afwijking van het eerste en tweede lid is de Autoriteit Financiële Markten bevoegd met gebruikmaking van
      gegevens of inlichtingen, verkregen bij de vervulling van haar ingevolge deze wet opgedragen taak, mededelingen te
      doen mits deze niet kunnen worden herleid tot afzonderlijke assurantiebemiddelingsbedrijven.

      5 In afwijking van het eerste lid is de Autoriteit Financiële Markten voorts bevoegd aan De Nederlandsche Bank N.V.
      gegevens te verstrekken of op grondslag van wederkerigheid aan het administratieve orgaan dat in het buitenland
      met het toezicht op het verzekeringsbedrijf is belast, desgevraagd de gegevens te verstrekken, die dat orgaan voor
      vervulling van de ingevolge zijn nationale wetgeving op hem rustende taak nodig heeft, mits bedoeld orgaan zich
      tegenover de Autoriteit Financiële Markten heeft verplicht tot geheimhouding van de door de Autoriteit Financiële
      Markten verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel20
  - number: '21'
    text: |-
      De Autoriteit Financiële Markten kan voor de uitvoering van verdragen tot uitwisseling van gegevens of
      inlichtingen, dan wel voor de uitvoering van met toezichthoudende instanties gesloten overeenkomsten tot
      uitwisseling van gegevens of inlichtingen, van een ieder inlichtingen vorderen. De [artikelen 5:13][ref1] en
      [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
