  - number: '9'
    text: |-
      1 Een in het register ingeschreven assurantiebemiddelaar deelt wijzigingen in de gegevens, vermeld in het in
      [artikel 5, eerste lid][ref1] bedoelde aanvraagformulier, onverwijld schriftelijk aan de Autoriteit Financiële
      Markten mee.

      2 Voor zover deze wijzigingen betrekking hebben op gegevens opgenomen in het register, brengt de Autoriteit
      Financiële Markten de wijzigingen in het register aan.

      3 De Autoriteit Financiële Markten verstrekt tegen een bij ministeriële regeling vast te stellen vergoeding een
      nieuw bewijs van inschrijving aan de assurantiebemiddelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028566#Artikel5
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel9
