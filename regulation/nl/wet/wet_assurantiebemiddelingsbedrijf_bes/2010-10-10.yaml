  - number: '5'
    text: |-
      1 Een verzoek om inschrijving in het register geschiedt door indiening van een aanvraagformulier bij de Autoriteit
      Financiële Markten. De Autoriteit Financiële Markten stelt het model van het aanvraagformulier vast.

      2 De Autoriteit Financiële Markten deelt haar beschikking op een verzoek tot inschrijving in het register
      schriftelijk mede aan de aanvrager binnen 13 weken na ontvangst van het verzoek, vergezeld van een bewijs van
      inschrijving in geval van een gunstige beslissing. Een afwijzende beschikking op het verzoek is met redenen
      omkleed.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 De Autoriteit Financiële Markten besluit tot inschrijving van een aanvrager in het register indien:

      a. de aanvrager beschikt over de vakbekwaamheid die is vereist voor een behoorlijke uitoefening van het
      assurantiebemiddelingsbedrijf;

      b. naar het oordeel van de Autoriteit Financiële Markten geen reden is te veronderstellen dat de aanvrager als
      assurantiebemiddelaar het aanzien van het assurantiebemiddelingsbedrijf zal schaden;

      c. de financiële gegoedheid van aanvrager voldoende waarborg biedt voor de continuïteit van het betreffende
      assurantiebemiddelingsbedrijf.

      d. de aanvrager kantoor houdt in een openbaar lichaam.

      e. de aanvrager, ter dekking van de aansprakelijkheid voortvloeiende uit de uitoefening van zijn werkzaamheden
      als assurantiebemiddelaar, een verzekeringsovereenkomst heeft afgesloten met een te goeder naam en faam bekend
      staande verzekeraar die, ingevolge de wetgeving van zijn land van domicilie, bevoegd is het verzekeringsbedrijf uit
      te oefenen;

      f. de aanvrager voldoet aan de in het belang van een integere uitoefening van het bedrijf bij ministeriële regeling
      te stellen eisen, daaronder begrepen eisen met betrekking tot de betrouwbaarheid van personen die het beleid van de
      onderneming of instelling bepalen of medebepalen.

      2 Aan de in het eerste lid, sub a, gestelde eis kan slechts worden voldaan door het bezit van een bij ministeriële
      regeling erkend diploma.

      3 Indien de aanvrager een natuurlijk persoon is, dient deze meerderjarig te zijn of handlichting te hebben
      verkregen en niet onder curatele te zijn gesteld.

      4 Indien de aanvrager niet zelf de feitelijke leiding over een vestiging van zijn assurantiebemiddelingsbedrijf
      heeft, gelden voor hem de inschrijvingsvoorwaarden, gesteld in het eerste lid sub b, c en d en derde lid. In
      zulk een geval dienen degenen die volgens opgave van aanvrager de feitelijke leiding hebben, te voldoen aan de
      voorwaarden als gesteld in het eerste lid sub a en b, en in een openbaar lichaam woonachtig te zijn.

      5 De Autoriteit Financiële Markten vermeldt in het register bij de inschrijving van de assurantiebemiddelaar de
      namen van degenen die door de assurantiebemiddelaar zijn belast met de feitelijke leiding.

      6 De assurantiebemiddelaar is verantwoordelijk en aansprakelijk voor de handelingen van sub-agenten die zijn
      bedrijf betreffen en van ieder die blijkens het register feitelijk leiding geeft.
    url: https://wetten.overheid.nl/BWBR0028566/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 In het register worden doorgehaald de inschrijvingen van de assurantiebemiddelaars die:

      a. daarom verzoeken;

      b. zijn overleden;

      c. in staat van faillissement worden verklaard;

      d. in liquidatie zijn getreden;

      e. niet meer in een openbaar lichaam kantoor houden;

      f. onder curatele zijn gesteld of wier handlichting is ingetrokken;

      g. niet meer in het bezit zijn van de ontheffing ex [artikel 8, eerste lid][ref1];

      h. het bedrag, verschuldigd ingevolge [artikel 19][ref2], niet hebben voldaan na door de Autoriteit Financiële
      Markten in

      i. gebreke te zijn gesteld;

      j. gedurende een periode van 1 jaar het assurantiebemiddelingsbedrijf niet hebben uitgeoefend;

      k. geen verzekeringsovereenkomst meer hebben als bedoeld in [artikel 6, eerste lid, onderdeel e][ref3].

      2 In de registers worden voorts doorgehaald de inschrijvingen van de assurantiebemiddelaars die:

      a. naar het oordeel van de Autoriteit Financiële Markten in ernstige mate in strijd handelen met het belang
      van één of meer verzekeraars, verzekeringnemers, verzekerden of gerechtigden op uitkeringen danwel een gezonde
      ontwikkeling van het assurantiebemiddelingsbedrijf in het algemeen of anderszins niet meer voldoen aan de in
      [artikel 6, eerste lid][ref4], gestelde eisen;

      b. de feitelijke leiding over één of meer vestigingen van hun assurantiebemiddelingsbedrijf laten uitoefenen door
      natuurlijke personen die niet voldoen aan de vereisten neergelegd in [artikel 6, vierde lid, tweede volzin][ref5];

      c. naar het oordeel van de Autoriteit Financiële Markten ernstig in gebreke blijven aan de in [artikel 18][ref6]
      bedoelde verplichtingen te voldoen.

      3 De Autoriteit Financiële Markten is bevoegd op grond van bijzondere omstandigheden een doorhaling, als bedoeld
      in het tweede lid, op door haar te stellen voorwaarden gedurende een door haar te bepalen tijd op te schorten. De
      Autoriteit Financiële Markten kan de termijn van opschorting verlengen indien zij gegronde redenen daartoe aanwezig
      acht.


