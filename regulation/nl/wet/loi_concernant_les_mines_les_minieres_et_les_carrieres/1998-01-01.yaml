---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: loi_concernant_les_mines_les_minieres_et_les_carrieres
regulatory_layer: WET
publication_date: '2002-11-14'
valid_from: '1998-01-01'
bwb_id: BWBR0001821
url: https://wetten.overheid.nl/BWBR0001821/1998-01-01
preamble:
  text: |-
    NAPOLÉON, par la grâce de Dieu et les constitutions, Empereur des Français, Roi d'Italie, Protecteur de la
    Confédération du Rhin, &c.; &c.; &c.; à tous présens et à venir, salut.

    Le Corps législatif a rendu, le 21 avril 1810, le décret suivant, conformément à la proposition faite au nom
    de l'Empereur et Roi, et après avoir entendu les orateurs du Conseil d'état et le président de la commission
    d'administration intérieure.

    DÉCRET.
  url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#ArtikelAanhef
articles:
  - number: I.er
    text: |-
      Les masses de substances minérales ou fossiles renfermées dans le sein de la terre ou existantes à la surface, sont
      classées, relativement aux règles de l'exploitation de chacune d'elles, sous les trois qualifications de mines,
      minières et carrières.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#ArtikelI.er
  - number: '2'
    text: |-
      Seront considérées comme mines celles connues pour contenir en filons, en couches ou en amas, de l'or, de l'argent,
      du platine, du mercure, du plomb, du fer en filons ou couches, du cuivre, de l'étain, du zinc, de la calamine, du
      bismuth, du cobalt, de l'arsenic, du manganèse, de l'antimoine, du molybdène, de la plombagine ou autres matières
      métalliques, du soufre, du charbon de terre ou de pierre, du bois fossile, des bitumes, de l'alun et des sulfates à
      base métallique.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel2
  - number: '3'
    text: |-
      Les minières comprennent les minerais de fer dits d'alluvion, les terres pyriteuses propres à être converties en
      sulfate de fer, les terres alumineuses et les tourbes.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel3
  - number: '4'
    text: |-
      Les carrières renferment les ardoises, les grès, pierres à bâtir et autres, les marbres, granits, pierres à chaux,
      pierres à plâtre, les pozzolanes, le trass, les basaltes, les laves, les marnes, craies, sables, pierres à fusil,
      argiles, kaolin, terres à foulon, terres à poterie, les substances terreuses et les cailloux de toute nature, les
      terres pyriteuses regardées comme engrais, le tout exploité à ciel ouvert ou avec des galeries souterraines.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel4
  - number: '5'
    text: Les mines ne peuvent être exploitées qu'en vertu d'un acte de concession.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel5
  - number: '6'
    text: Cet acte règle les droits des propriétaires de la surface sur le produit des mines concédées.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel6
  - number: '8'
    text: |-
      Les mines sont immeubles.

      Sont aussi immeubles, les bâtimens, machines, puits, galeries et autres travaux établis à demeure, conformément à
      l'article 524 du Code Napoléon.

      Sont aussi immeubles par destination, les chevaux, agrès, outils et ustensiles servant à l'exploitation.

      Ne sont considérés comme chevaux attachés à l'exploitation, que ceux qui sont exclusivement attachés aux travaux
      intérieurs des mines.

      Néanmoins les actions ou intérêts dans une société ou entreprise pour l'exploitation des mines, seront réputés
      meubles, conformément à l'article 529 du Code Napoléon.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel8
  - number: '9'
    text: Sont meubles, les matières extraites, les approvisionnemens et autres objets mobiliers.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel9
  - number: '10'
    text: |-
      Nul ne peut faire des recherches pour découvrir des mines, enfoncer des sondes ou tarières sur un terrain qui ne
      lui appartient pas, que du consentement du propriétaire de la surface, ou avec l'autorisation du Gouvernement,
      donnée après avoir consulté l'administration des mines, à la charge d'une préalable indemnité envers le
      propriétaire et après qu'il aura été entendu.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel10
  - number: '11'
    text: |-
      Nulle permission de recherches ni concession de mines ne pourra, sans le consentement formel du propriétaire de
      la surface, donner le droit de faire des sondes et d'ouvrir des puits ou galeries, ni celui d'établir des machines
      ou maga sins dans les enclos murés, cours ou jardins, ni dans les terrains attenant aux habitations ou clôtures
      murées, dans la distance de cent mètres desdites clôtures ou des habitations.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel11
  - number: '12'
    text: |-
      Le propriétaire pourra faire des recherches, sans formalité préalable, dans les lieux réservés par le précédent
      article, comme dans les autres parties de sa propriété; mais il sera obligé d'obtenir une concession avant d'y
      établir une exploitation. Dans aucun cas, les recherches ne pourront être autorisées dans un terrain déjà concédé.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel12
  - number: '13'
    text: |-
      Tout Français, ou tout étranger naturalisé ou non en France, agissant isolément ou en société, al le droit de
      demander et peut obtenir, s'il y a lieu, une concession de mines.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel13
  - number: '17'
    text: |-
      L'acte de concession fait après l'accomplissement des formalités prescrites, purge, en faveur du concessionaire,
      tous les droits des propriétaires de la surface et des inventeurs, ou de leurs ayant-droit, chacun dans leur ordre,
      après qu'ils ont été entendus ou appelés légalement, ainsi qu'il sera ci-après réglé.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel17
  - number: '18'
    text: |-
      La valeur des droits résultant en faveur du propriétaire de la surface, en vertu de l'article 6 de la présente loi,
      demeurera réunie à la valeur de ladite surface et sera affectée avec elle aux hypothèques prises par les créanciers
      du propriétaire.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel18
  - number: '19'
    text: |-
      Du moment où une mine sera concédée, même au propriétaire de la surface, cette propriété sera distinguée de celle
      de la surface, et désormais considérée comme propriété nouvelle, sur laquelle de nouvelles hypothèques pourront
      être assises, sans préjudice de celles qui auraient été ou seraient prises sur la surface et la redevance, comme il
      est dit à l'article précédent.

      Si la concession est faite au propriétaire de la surface, ladite redevance sera évaluée pour l'exécution dudit
      article.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel19
  - number: '20'
    text: |-
      Une mine concédée pourra être affectée, par privilége, en faveur de ceux qui, par acte public et sans fraude,
      justifieraient avoir fourni des fonds pour les recherches de la mine, ainsi que pour les travaux de construction ou
      confection de machines nécessaires à son exploitation, à la charge de se conformer aux articles 2103 et autres du
      Code Napoléon, relatifs aux priviléges.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel20
  - number: '21'
    text: |-
      Les autres droits de privilége et d'hypothèque pourront être acquis sur la propriété de la mine, aux termes et en
      conformité du Code Napoléon, comme sur les autres propriétés immobilières.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel21
  - number: '32'
    text: L'exploitation des mines n'est pas considérée comme un commerce, et n'est pas sujette à patente.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel32
  - number: '40'
    text: |-
      Les anciennes redevances dues à l'État, soit en vertu de lois, ordonnances ou réglemens, soit d'après les
      conditions énoncées en l'acte de concession, soit d'après des baux et adjudications au profit de la régie du
      domaine, cesseront d'avoir cours à compter du jour où les redevances nouvelles seront établies.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel40
  - number: '41'
    text: |-
      Ne sont point comprises dans l'abrogation des anciennes redevances, celles dues à titre de rentes, droits et
      prestations quelconques, pour cession de fonds ou autres causes semblables, sans déroger toutefois à l'application
      des lois qui ont supprimé les droits féodaux.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel41
  - number: '42'
    text: |-
      Le droit attribué par l'article 6 de la présente loi aux propriétaires de la surface, sera réglé à une somme
      déterminée par l'acte de concession.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel42
  - number: '43'
    text: |-
      Les propriétaires de mines sont tenus de payer les indemnités dues au propriétaire de la surface sur le terrain
      duquel ils établiront leurs travaux.

      Si les travaux entrepris par les explorateurs ou par les propriétaires de mines ne sont que passagers, et si le sol
      où ils ont été faits peut être mis en culture au bout d'un an comme il l'était auparavant, l'indemnité sera réglée
      au double de ce qu'aurait produit net le terrain endommagé.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel43
  - number: '44'
    text: |-
      Lorsque l'occupation des terrains pour la recherche ou les travaux des mines, prive les propriétaires du sol de la
      jouissance du revenu au-delà du temps d'une année, ou lorsqu'après les travaux, les terrains ne sont plus propres
      à la culture, on peut exiger des propriétaires des mines l'acquisition des terrains à l'usage de l'exploitation.
      Si le propriétaire de la surface le requiert, les pièces de terre trop endommagées ou dégradées sur une trop grande
      partie de leur surface, devront être achetées en totalité par le propriétaire de la mine.

      L'évaluation du prix sera faite, quant au mode, suivant les règles établies par la loi du 16 septembre 1807, sur
      le desséchement des marais, &c.; titre XI; mais le terrain à acquérir sera toujours estimé au double de la valeur
      qu'il avait avant l'exploitation de la mine.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel44
  - number: '45'
    text: |-
      Lorsque, par l'effet du voisinage ou pour toute autre cause, les travaux d'exploitation d'une mine occasionnent
      des dommages à l'exploitation d'une autre mine, à raison des eaux qui pénètrent dans cette dernière en plus grande
      quantité; lorsque, d'un autre côté, ces mêmes travaux produisent un effet contraire et tendent à évacuer tout ou
      partie des eaux d'une autre mine, il y aura lieu à indemnité d'une mine en faveur de l'autre: le réglement s'en
      fera par experts.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel45
  - number: '46'
    text: |-
      Toutes les questions d'indemnités à payer par les propriétaires de mines, à raison des recherches ou travaux
      antérieurs à l'acte de concession, seront décidées conformément à l'article 4 de la loi du 28 pluviôse an VIII.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel46
  - number: '51'
    text: |-
      Les concessionnaires antérieurs à la présente loi deviendront, du jour de sa publication, propriétaires
      incommutables, sans aucune formalité préalable d'affiches, vérifications de terrain ou autres préliminaires, à la
      charge seulement d'exécuter, s'il y en a, les conventions faites avec les propriétaires de la surface, et sans que
      ceux-ci puissent se prévaloir des articles 6 et 42.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel51
  - number: '52'
    text: |-
      Les anciens concessionnaires seront, en conséquence, soumis au paiement des contributions, comme il est dit à la
      section II du titre IV, art. 33 et 34, à compter de l'année 1811.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel52
  - number: '53'
    text: |-
      Quant aux exploitans de mines qui n'ont pas exécuté la loi de 1791, et qui n'ont pas fait fixer conformément
      à cette loi les limites de leurs concessions, ils obtiendront les concessions de leurs exploitations actuelles
      conformément à la présente loi ; à l'effet de quoi les limites de leurs concessions seront fixées sur leurs
      demandes ou à la diligence des préfets, à la charge seulement d'exécuter les conventions faites avec les
      propriétaires de la surface, et sans que ceux-ci puissent se prévaloir des articles 6 et 42 de la présente loi.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel53
  - number: '54'
    text: Ils paieront en conséquence les redevances, comme il est dit à l'article 52.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel54
  - number: '55'
    text: |-
      En cas d'usages locaux ou d'anciennes lois qui donneraient lieu à la décision de cas extraordinaires, les cas qui
      se présenteront seront décidés par les actes de concession ou par les jugemens de nos cours et tribunaux, selon les
      droits résultant pour les parties, des usages établis, des prescriptions légalement acquises, ou des conventions
      réciproques.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel55
  - number: '56'
    text: |-
      Les difficultés qui s'éleveraient entre l'administration et les exploitans, relativement à la limitation des mines,
      seront décidées par l'acte de concession.

      A l'égard des contestations qui auraient lieu entre des exploitans voisins, elles seront jugées par les tribunaux
      et cours.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel56
  - number: '57'
    text: L'exploitation des minières est assujettie à des règles spéciales. Elle ne peut avoir lieu sans permission.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel57
  - number: '58'
    text: |-
      La permission détermine les limites de l'exploitation et les régles sous les rapports de sÛreté et de salubrité
      publiques.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel58
  - number: '59'
    text: |-
      Le propriétaire du fonds sur lequel il y a du minerai de fer d'alluvion, est tenu d'exploiter en quantité
      suffisante pour fournir, autant que faire se pourra, aux besoins des usines établies dans le voisinage avec
      autorisation légale: en ce cas, il ne sera assujetti qu'à en faire la déclaration au préfet du département; elle
      contiendra la désignation des lieux: le préfet donnera acte de cette déclaration, ce qui vaudra permission pour le
      propriétaire, et l'exploitation aura lieu par lui sans autre formalité.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel59
  - number: '60'
    text: |-
      Si le propriétaire n'exploite pas, les maîtres de forges auront la faculté d'exploiter à sa place; à la charge,
      1.° d'en prévenir le propriétaire, qui, dans un mois, à compter de la notification, pourra déclarer qu'il entend
      exploiter lui-même, 2.° d'obtenir du préfet la permission, sur l'avis de l'ingénieur des mines, après avoir entendu
      le propriétaire.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel60
  - number: '61'
    text: |-
      Si, après l'expiration du délai d'un mois, le propriétaire ne déclare pas qu'il entend exploiter, il sera
      censé renoncer à l'exploitation; le maître de forges pourra, après la permission obtenue, faire les fouilles
      immédiatement dans les terres incultes et en jachères, et, après la récolte, dans toutes les autres terres.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel61
  - number: '62'
    text: |-
      Lorsque le propriétaire n'exploitera pas en quantité suffisante, ou suspendra ses travaux d'extraction pendant plus
      d'un mois sans cause légitime, les maîtres de forges se pourvoiront auprès du préfet pour obtenir la permission
      d'exploiter à sa place.

      Si le maître de forges laisse écouler un mois sans faire usage de cette permission, elle sera regardée comme non
      avenue, et le propriétaire de terrain rentrera dans tous ses droits.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel62
  - number: '63'
    text: |-
      Quand un maître de forges cessera d'exploiter un terrain, il sera tenu de le rendre propre à la culture, ou
      d'indemniser le propriétaire.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel63
  - number: '64'
    text: |-
      En cas de concurrence entre plusieurs maîtres de forges pour l'exploitation dans un même fonds, le préfet
      déterminera, sur l'avis de l'ingénieur des mines, les proportions dans lesquelles chacun d'eux pourra exploiter ;
      sauf le recours au Conseil d'état.

      Le préfet réglera de même les proportions dans lesquelles chaque maître de forges aura droit à l'achat du minerai,
      s'il est exploité par le propriétaire.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel64
  - number: '65'
    text: |-
      Lorsque les propriétaires feront l'extraction du minerai pour le vendre aux maîtres de forges, le prix en sera
      réglé entre eux de gré à gré, ou par des experts choisis ou nommés d'office, qui auront égard à la situation des
      lieux, aux frais d'extraction et aux dégâts qu'elle aura occasionnés.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel65
  - number: '66'
    text: |-
      Lorsque les maîtres de forges auront fait extraire le minerai, il sera dÛ au propriétaire du fonds, et avant
      l'enlèvement du minerai, une indemnité qui sera aussi réglée par experts, lesquels auront égard à la situation des
      lieux, aux dommages causés, à la valeur du minerai, distraction faite des frais d'exploitation.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel66
  - number: '67'
    text: |-
      Si les minerais se trouvent dans les forêts impériales, dans celles des établissemens publics, ou des communes, la
      permission de les exploiter ne pourra être accordée qu'après avoir entendu l'administration forestière. L'acte de
      permission déterminera l'étendue des terrains dans lesquels les fouilles pourront être faites: ils seront tenus;
      en outre, de payer les dégâts occasionnés par l'exploitation, et de repiquer en glands ou plants les places qu'elle
      aurait endommagées, ou une autre étendue proportionnelle déterminée par la permission.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel67
  - number: '68'
    text: |-
      Les propriétaires ou maîtres de forges ou d'usines exploitant les minerais de fer d'alluvion, ne pourront, dans
      cette exploitation, pousser des travaux réguliers par des galeries souterraines, sans avoir obtenu une concession,
      avec les formalités et sous les conditions exigées par les articles de la section I.re du titre III et les
      dispositions du titre IV.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel68
  - number: '69'
    text: |-
      Il ne pourra être accordé aucune concession pour minerai d'alluvion ou pour des mines en filons ou couches, que
      dans les cas suivans:

      1.°. Si l'exploitation à ciel ouvert cesse d'être possible, et si l'établissement de puits, galeries et travaux
      d'art est nécessaire;

      2.°. Si l'exploitation, quoique possible encore, doit durer peu d'années, et rendre ensuite impossible
      l'exploitation avec puits et galeries.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel69
  - number: '70'
    text: |-
      En cas de concession, le concessionnaire sera tenu toujours, 1.° de fournir aux usines qui s'approvisionnaient de
      minerai sur les lieux compris en la concession, la quantité nécessaire à leur exploitation, au prix qui sera porté
      au cahier des charges ou qui sera fixé par l'administration, 2.° d'indemniser les propriétaires au profit desquels
      l'exploitation avait lieu, dans la proportion du revenu qu'ils en tiraient.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel70
  - number: '71'
    text: |-
      L'exploitation des terres pyriteuses et alumineuses sera assujettie aux formalités prescrites par les articles 57
      et 58, soit qu'elle ait lieu par les propriétaires des fonds, soit par d'autres individus qui, à défaut par ceux-ci
      d'exploiter, en auraient obtenu la permission.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel71
  - number: '72'
    text: |-
      Si l'exploitation a lieu par des non-propriétaires, ils seront assujettis, en faveur des propriétaires, à une
      indemnité qui sera réglée de gré à gré ou par experts.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel72
  - number: '73'
    text: |-
      Les fourneaux à fondre les minerais de fer et autres substances métalliques, les forges et martinets pour ouvrer le
      fer et le cuivre, les usines servant de patouillets et bocards, celles pour le traitement des substances salines et
      pyriteuses, dans lesquelles on consomme des combustibles, ne pourront être établis que sur une permission accordée
      par un réglement d'administration publique.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel73
  - number: '74'
    text: |-
      La demande en permission sera adressée au préfet, enregistrée le jour de la remise sur un registre spécial à ce
      destiné, et affichée pendant quatre mois dans le chef-lieu du département, dans celui de l'arrondissement, dans la
      commune où sera situé l'établissement projeté, et dans le lieu du domicile du demandeur.

      Le préfet, dans le délai d'un mois, donnera son avis tant sur la demande que sur les oppositions et les demandes en
      préférence qui seraient survenues ; l'administration des mines donnera le sien sur la quotité du minerai à traiter;
      l'administration des forêts, sur l'établissement des bouches à feu en ce qui concerne les bois, et l'administration
      des ponts-et-chaussées, sur ce qui concerne les cours d'eau navigables ou flottables.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel74
  - number: '75'
    text: |-
      Les impétrans des permissions pour les usines, supporteront une taxe une fois payée, laquelle ne pourra être au-
      dessous de cinquante francs, ni excéder trois cents francs.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel75
  - number: '76'
    text: |-
      Les permissions seront données à la charge d'en faire usage dans un délai déterminé; elles auront une durée
      indéfinie, à moins qu'elles n'en contiennent la limitation.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel76
  - number: '77'
    text: |-
      En cas de contraventions, le procès-verbal dressé par les autorités compétentes sera remis au procureur impérial,
      lequel poursuivra la révocation de la permission, s'il y a lieu, et l'application des lois pénales qui y sont
      relatives.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel77
  - number: '78'
    text: |-
      Les établissemens actuellement existans sont maintenus dans leur jouissance, à la charge par ceux qui n'ont jamais
      eu de permission, ou qui ne pourraient représenter la permission obtenue précédemment, d'en obtenir une avant le
      I.er janvier 1813, sous peine de payer un triple droit de permission pour chaque année pendant laquelle ils auront
      négligé de s'en pourvoir et continué de s'en servir.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel78
  - number: '79'
    text: |-
      L'acte de permission d'établir des usines à traiter le fer, autorise les impétrans à faire des fouilles même hors
      de leurs propriétés, et à exploiter les minerais par eux découverts, ou ceux antérieurement connus, à la charge de
      se conformer aux dispositions de la section II.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel79
  - number: '80'
    text: |-
      Les impétrans sont aussi autorisés à établir des patouillets, lavoirs et chemins de charroi, sur les terrains qui
      ne leur appartiennent pas, mais sous les restrictions portées en l'article 11; le tout à charge d'indemnité envers
      les propriétaires du sol, et en les prévenant un mois d'avance.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel80
  - number: '87'
    text: |-
      Dans tous les cas prévus par la présente loi et autres naissant des circonstances, où il y aura lieu à expertise,
      les dispositions du titre XIV du Code de procédure civile, articles 303 à 323, seront exécutées.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel87
  - number: '88'
    text: |-
      Les experts seront pris parmi les ingénieurs des mines, ou parmi les hommes notables et expérimentés dans le fait
      des mines et de leurs travaux.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel88
  - number: '89'
    text: Le procureur impérial sera toujours entendu, et donnera ses conclusions sur le rapport des experts.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel89
  - number: '90'
    text: |-
      Nul plan ne sera admis comme pièce probante dans une contestation, s'il n'a été levé ou vérifié par un ingénieur
      des mines. La vérification des plans sera toujours gratuite.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel90
  - number: '91'
    text: |-
      Les frais et vacations des experts seront réglés et arrêtés, selon les cas, par les tribunaux : il en sera de même
      des honoraires qui pourront appartenir aux ingénieurs des mines : le tout suivant le tarif qui sera fait par un
      réglement d'administration publique.

      Toutefois il n'y aura pas lieu à honoraires pour les ingénieurs des mines, lorsque leurs opérations auront été
      faites soit dans l'intérêt de l'administration, soit à raison de la surveillance et de la police publiques.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel91
  - number: '92'
    text: |-
      La consignation des sommes jugées nécessaires pour subvenir aux frais d'expertise, pourra être ordonnée par le
      tribunal contre celui qui poursuivra l'expertise.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel92
  - number: '93'
    text: |-
      Les contraventions des propriétaires de mines exploitans non encore concessionnaires ou autres personnes, aux lois
      et réglemens, seront dénoncées et constatées, comme les contraventions en matière de voirie et de police.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel93
  - number: '94'
    text: Les procès-verbaux contre les contrevenans seront affirmés dans les formes et délais prescrits par les lois.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel94
  - number: '95'
    text: |-
      Ils seront adressés en originaux à nos procureurs impériaux, qui seront tenus de poursuivre d'office les
      contrevenans devant les tribunaux de police correctionnelle, ainsi qu'il est réglé et usité pour les délits
      forestiers, et sans préjudice des dommages-intérêts des parties.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel95
  - number: '96'
    text: |-
      Les peines seront d'une amende de cinq cents fr. au plus et de cent francs au moins, double en cas de récidive, et
      d'une détention qui ne pourra excéder la durée fixée par le Code de police correctionnelle.
    url: https://wetten.overheid.nl/BWBR0001821/1998-01-01#Artikel96
