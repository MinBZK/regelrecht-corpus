    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13c
  - number: 13d.1
    text: |-
      Indien het in een tunnel langer dan 500 meter mogelijk is om de verkeersrichting in een tunnelbuis om te
      keren beschikt elke betreffende tunnelbuis in aanvulling op de gestandaardiseerde uitrusting genoemd in
      [artikel 13][ref1] over de volgende uitrusting:


      [ref1]: https://wetten.overheid.nl/BWBR0019806#Artikel13
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0019806
        artikel: '13'
  - number: 13d.1.a
    text: |-
      aan beide zijden van de verkeersbuis wordt boven elke rijstrook en ruimtereserveringstrook hoogtedetectie toegepast
      indien het profiel van de vrije ruimte in de verkeersbuis lager is dan 4,70 meter;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
  - number: 13d.1.b
    text: |-
      de verlichtingszones bedoeld in paragraaf 4 van [bijlage 4][ref1] worden vanuit beide richtingen bezien;


      [ref1]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0019806
  - number: 13d.1.c
    text: |-
      [bijlage 4][ref1], paragraaf 11, geldt voor beide rijrichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
    references:
      - id: ref1
