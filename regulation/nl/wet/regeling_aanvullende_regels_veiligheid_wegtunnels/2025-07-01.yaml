preamble:
  text: |-
    Gelet op de artikelen 3, tweede lid, 5, tweede en vierde lid, 6, eerste en tweede lid, 7, 8, tweede lid, 9, 10
    en 12 van de Wet aanvullende regels veiligheid wegtunnels, de artikelen 2, zesde lid, van het Besluit aanvullende
    regels veiligheid wegtunnels, de artikelen 120 en 120a van de Woningwet en artikel 14 van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder tunnelveiligheidsdossier: het dossier, bedoeld in
      [artikel 10 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel10
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '10'
  - number: '1.2'
    text: Het begrip voorval omvat mede ongeluk of incident.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel1
  - number: '4'
    text: |-
      De risicoanalyse, bedoeld in [artikel 6, derde lid, van de wet][ref1], wordt uitgevoerd overeenkomstig het in
      bijlage 1 bij deze regeling opgenomen model QRA-tunnels.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
  - number: '5.1'
    text: |-
      Het tunnelveiligheidsplan, bedoeld in [artikel 6c van de wet][ref1], wordt opgesteld en uitgevoerd overeenkomstig
      [bijlage 2][ref2], onderdeel B1, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6c
      [ref2]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6c
      - id: ref2
        bwb_id: BWBR0019806
  - number: '5.2'
    text: 'Het tunnelveiligheidsplan bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel5
  - number: 5.2.a
    text: |-
      een globale beschrijving van het ontwerp van de tunnel, alsmede van de relevante locatieaspecten, de ruimtelijke
      inpassing en de technische haalbaarheid van de tunnel;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel5
  - number: 5.2.b
    text: een beschrijving van het voorziene gebruik van de tunnel;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel5
  - number: 5.2.c
    text: |-
      indien er een gestandaardiseerde uitrusting wordt toegepast, de keuze van de toe te passen gestandaardiseerde
      uitrusting als bedoeld in [artikel 6b van de wet][ref1], dan wel de keuze om van de gestandaardiseerde uitrusting
      af te wijken op grond van artikel 6b, derde lid, van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6b
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6b
  - number: 5.2.d
    text: |-
      een beschrijving van de uitkomsten van de risicoanalyse bedoeld in artikel 6, derde lid van de wet, waarmee wordt
      toegelicht dat met de gekozen uitrusting aan de norm, bedoeld in [artikel 6, eerste lid, van de wet][ref1] wordt
      voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
  - number: 5.2.e
    text: een globale beschrijving van de organisatie van het beheer van de tunnel en de calamiteitenbestrijding.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel5
  - number: '6.1'
    text: |-
      Het veiligheidsbeheerplan, bedoeld in [artikel 7 van de wet][ref1], wordt opgesteld en uitgevoerd overeenkomstig
      [bijlage 2][ref2], onderdeel B3, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0019806
  - number: '6.2'
    text: 'Het veiligheidsbeheerplan bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.2.a
    text: een beschrijving van het gebruik van de tunnel;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.2.b
    text: een beschrijving van het tunnelsysteem;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.2.c
    text: |-
      een beschrijving van de organisatie, processen, procedures, werkinstructies en planningen ten behoeve van het
      gebruik, de inspectie en het onderhoud van de tunnel;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.2.d
    text: |-
      een beschrijving van de wijze waarop registratie en evaluatie van significante voorvallen plaats vindt en een
      beschrijving van de wijze waarop verbeteringen worden doorgevoerd;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.2.e
    text: |-
      een analyse van scenario’s van ongevallen of indien die analyse op grond van
      [artikel 7, eerste lid, van de wet][ref1], achterwege is gebleven, de redenen daarvoor, en


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel7
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '7'
  - number: 6.2.f
    text: |-
      een calamiteitenbestrijdingsplan waarin ook rekening gehouden is met mensen met een beperkte mobiliteit en met
      gehandicapten en chronisch zieken en dat voorts bevat:
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.2.f.i
    text: |-
      een beschrijving van de operationele afspraken tussen de tunnelbeheerder en de hulpverleningsdiensten over de inzet
      tijdens calamiteiten, en
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.2.f.ii
    text: instructies voor de uit te voeren bedienprocessen tijdens incidenten en calamiteiten.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: '6.3'
    text: 'De incidenten, bedoeld in het tweede lid, onderdeel f, onder ii, zijn in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.3.a
    text: stilstaande voertuigen;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.3.b
    text: aanrijdingen;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.3.c
    text: verloren lading, en
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.3.d
    text: voorvallen met verdwaalde personen.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: '6.4'
    text: 'De calamiteiten, bedoeld in het tweede lid, onderdeel f, onder ii, zijn in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.4.a
    text: een ernstige aanrijding;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.4.b
    text: een brand of het vermoeden daarvan;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.4.c
    text: het vrijkomen van gevaarlijke stoffen of een vermoeden daarvan;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.4.d
    text: een brand in de verkeerscentrale;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6.4.e
    text: een bommelding.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6
  - number: 6a.1
    text: |-
      De instructies, bedoeld in [artikel 6, tweede lid, onderdeel f, onder ii][ref1], bevatten een beschrijving van de
      handelswijze bij incidenten en calamiteiten overeenkomstig de volgende processtappen:


      [ref1]: https://wetten.overheid.nl/BWBR0019806#Artikel6
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0019806
        artikel: '6'
  - number: 6a.1.a
    text: vaststellen van de aard van het voorval;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
  - number: 6a.1.b
    text: bepalen van de afhandelingstrategie;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
  - number: 6a.1.c
    text: instellen van initiële maatregelen;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
  - number: 6a.1.d
    text: informeren en oproepen van hulpverleningsdiensten;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
  - number: 6a.1.e
    text: instellen van additionele maatregelen;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
  - number: 6a.1.f
    text: herstellen en normaliseren van de verkeerssituatie;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
  - number: 6a.1.g
    text: loggen en registreren van het voorval en de afhandeling ervan.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
  - number: 6a.2
    text: |-
      Voor tunnels langer dan 500 meter die zijn uitgerust met een gestandaardiseerde uitrusting overeenkomstig
      [artikel 13][ref1] bevatten de instructies een nadere uitwerking van de in [bijlage 3][ref2] opgenomen
      uitgangspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0019806#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0019806
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0019806
  - number: 6b
    text: |-
      De analyse van scenario’s van ongevallen als bedoeld in [artikel 7, eerste lid, van de wet][ref1] en
      in [artikel 6, tweede lid, onderdeel e][ref2], van deze regeling, wordt uitgevoerd overeenkomstig de in
      [bijlage 2a][ref3] bij deze regeling opgenomen Scenarioanalyse Ongevallen in Tunnels.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019806#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0019806
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0019806
  - number: '7'
    text: |-
      De veiligheidsbeambte werkt mee aan de afstemming tussen het calamiteitenbestrijdingsplan, bedoeld in
      [artikel 6, tweede lid, onder f][ref1], en de aanvalsplannen van de binnen een veiligheidsregio, als bedoeld
      in de [Wet veiligheidsregio’s][ref2], samenwerkende hulpverleningsdiensten. Hij neemt kennis van de
      rampenbestrijdingsplannen van de desbetreffende veiligheidsregio’s, voor zover de tunnel betreffende.


      [ref1]: https://wetten.overheid.nl/BWBR0019806#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027466
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019806
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027466
  - number: '8.1'
    text: |-
      In of bij de aanvraag voor de in [artikel 8 van de wet][ref1] bedoelde vergunning worden de volgende gegevens
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel8
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '8'
  - number: 8.1.a
    text: naam, post- en e-mailadres en telefoonnummer van de tunnelbeheerder;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
  - number: 8.1.b
    text: de kadastrale aanduiding en de ligging van de tunnel;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
  - number: 8.1.c
    text: de naam en de aard van de tunnel.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
  - number: '8.2'
    text: 'Bij de aanvraag worden de volgende bescheiden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
  - number: 8.2.a
    text: |-
      het tunnelveiligheidsplan, bedoeld in [artikel 6c, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6c
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6c
  - number: 8.2.b
    text: |-
      het advies van de veiligheidsbeambte over het tunnelveiligheidsplan en dat over het samenstel van documenten
      bedoeld in artikel 7.15, eerste lid, onder b, van de Omgevingsregeling waarmee een omgevingsvergunning voor een
      bouwactiviteit als bedoeld in [artikel 5.1, tweede lid, aanhef en onder a, van de Omgevingswet][ref1] aangevraagd
      zal worden;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 8.2.c
    text: |-
      het veiligheidsbeheerplan, bedoeld in [artikel 7 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel7
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '7'
  - number: 8.2.d
    text: het advies van de veiligheidsbeambte over het openstellen voor het verkeer van de tunnel.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
  - number: '8.3'
    text: |-
      Op verzoek van het bevoegde college van burgemeester en wethouders verstrekt de aanvrager tevens nadere gegevens en
      bescheiden voor zover die voor de beslissing op de aanvraag nodig zijn.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel8
  - number: '9'
    text: |-
      De veiligheidsbeambte controleert regelmatig of de tunnelconstructies en -voorzieningen worden onderhouden en waar
      nodig hersteld.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel9
  - number: '10.1'
    text: |-
      Van elk significant voorval in een tunnel stelt de tunnelbeheerder een toelichtend verslag op en zendt
      dat binnen vier weken aan de veiligheidsbeambte, het bevoegd college van burgemeester en wethouders en de
      hulpverleningsdiensten.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel10
  - number: '10.2'
    text: |-
      De tunnelbeheerder evalueert elk significant voorval. Uiterlijk tien weken na het significante voorval stelt de
      tunnelbeheerder een rapportage op en zendt die aan de veiligheidsbeambte, het bevoegd college van burgemeester en
      wethouders en de hulpverleningsdiensten.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel10
  - number: '10.3'
    text: De rapportage, bedoeld in het tweede lid, bevat een procesevaluatie en een systeemevaluatie.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel10
  - number: '10.4'
    text: |-
      Indien de tunnelbeheerder een door een ander opgesteld onderzoeksverslag ontvangt met een analyse van de
      omstandigheden van een voorval in een tunnel of de conclusies die daaruit kunnen worden getrokken, zendt hij
      dat verslag binnen vier weken na ontvangst aan de veiligheidsbeambte, het bevoegd college van burgemeester en
      wethouders en de hulpverleningsdiensten.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel10
  - number: '10.5'
    text: De veiligheidsbeambte werkt mee aan de evaluatie van significante voorvallen bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel10
  - number: '10.6'
    text: |-
      De tunnelbeheerder draagt er zorg voor dat, in overleg met de veiligheidsbeambte, acties in noodsituaties
      uitgevoerd en geëvalueerd worden.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel10
  - number: '10.7'
    text: |-
      De veiligheidsbeambte rapporteert jaarlijks aan de tunnelbeheerder en het bevoegd college van burgemeester en
      wethouders op hoofdlijnen over het incidentregistratie- en evaluatieproces en hoe wordt omgegaan met het realiseren
      van geactiveerde verbetermaatregelen uit de evaluaties.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel10
  - number: '11.1'
    text: |-
      De veiligheidsbeambte gaat na of het bedieningspersoneel en de hulpverleningsdiensten geoefend zijn en werkt mee
      aan de organisatie van de regelmatig te houden oefeningen.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel11
  - number: '11.2'
    text: |-
      De tunnelbeheerder draagt ervoor zorg dat met betrekking tot een tunnel ten minste eenmaal in de vier jaar een
      realistische oefening en in elk tussenliggend jaar een gedeeltelijke of simulatieoefening wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel11
  - number: '11.3'
    text: |-
      In afwijking van het tweede lid kan, indien binnen een veiligheidsregio, als bedoeld in de
      [Wet veiligheidsregio’s][ref1], twee of meer tunnels van één tunnelbeheerder liggen en voor zover het een
      realistische oefening betreft, volstaan worden met het houden van één oefening in ten minste één van die tunnels.


      [ref1]: https://wetten.overheid.nl/BWBR0027466
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027466
  - number: '11.4'
    text: De veiligheidsbeambte, de hulpverleningsdiensten en de tunnelbeheerder evalueren gezamenlijk de oefeningen.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel11
  - number: '12.1'
    text: |-
      Het tunnelveiligheidsdossier bevat alle voor de veiligheid betreffende de tunnel van belang zijnde gegevens
      en oorspronkelijke bescheiden, alsmede de desbetreffende digitale documenten, waartoe in elk geval behoren
      de documenten, bedoeld in de [artikelen 4 tot en met 8][ref1], en de documenten betreffende het bepaalde in
      [artikel 11][ref2], met inbegrip van latere wijzigingen daarvan, alsmede:


      [ref1]: https://wetten.overheid.nl/BWBR0019806#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019806#Artikel11
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019806
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0019806
        artikel: '11'
  - number: 12.1.a
    text: de planologische besluiten ten aanzien van de tunnel;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel12
  - number: 12.1.b
    text: |-
      de omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder a, van de Omgevingswet][ref1] en de bij die vergunning behorende
      aanvraag;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 12.1.c
    text: een lijst van de uitgevoerde oefeningen en een analyse van de lering die hieruit getrokken is.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel12
  - number: '12.2'
    text: |-
      Een ieder die gegevens en oorspronkelijke bescheiden, bedoeld in het eerste lid, ontvangen heeft of onder zich
      heeft, verstrekt deze met bekwame spoed aan de tunnelbeheerder, die deze opneemt in het tunnelveiligheidsdossier.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel12
  - number: '12.3'
    text: |-
      Van elk in het tunnelveiligheidsdossier opgenomen document verstrekt de tunnelbeheerder een kopie aan de
      veiligheidsbeambte.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel12
  - number: '12.4'
    text: |-
      De betrokken overheidsinstanties kunnen het tunnelveiligheidsdossier te allen tijde inzien. Op hun verzoek
      verstrekt de tunnelbeheerder hen kopieën van de bescheiden.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel12
