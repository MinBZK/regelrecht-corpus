        bwb_id: BWBR0019806
        artikel: '13'
  - number: 13c.a
    text: |-
      Hoogtedetectie zoals weergegeven in [bijlage 5][ref1] bij deze regeling, en


      [ref1]: https://wetten.overheid.nl/BWBR0019806
