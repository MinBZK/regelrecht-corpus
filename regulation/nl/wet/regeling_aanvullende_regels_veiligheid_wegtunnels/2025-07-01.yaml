    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
  - number: 13d.2
    text: |-
      Indien de tunnelbeheerder dit verkeerskundig noodzakelijk acht, beschikt de tunnel bedoeld in het eerste lid tevens
      over een:
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
