    text: afsluitbomen aan beide zijden van de verkeersbuis;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
  - number: 13d.1.f
    text: detectie van stilstaande voertuigen en spookrijders die in twee richtingen werkzaam is;
