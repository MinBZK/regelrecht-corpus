    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0019806
  - number: 13d.2.b
    text: |-
      beweegbare barrier overeenkomstig [bijlage 6][ref1], paragraaf 2, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0019806
  - number: 13e
    text: |-
      Met de onderdelen van de gestandaardiseerde uitrusting als bedoeld in de [artikelen 13][ref1], [13a][ref2],
      [13b][ref3], [13c][ref4], [13d][ref5] en in de [bijlagen 4][ref6], [5][ref7] en [6][ref8] bij deze regeling
      worden gelijkgesteld die goederen die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere
      lidstaat van de Europese Unie of in een staat, niet zijnde een lidstaat van de Europese Unie die partij is bij
      een tot een douane-uniestrekkende verdrag, dan wel rechtmatig zijn vervaardigd in een staat die partij is bij een
      tot de vrijhandelszone strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau
      bieden dat ten minste gelijkwaardig is aan het niveau dat met de onderdelen van de gestandaardiseerde uitrusting
      wordt nagestreefd.


