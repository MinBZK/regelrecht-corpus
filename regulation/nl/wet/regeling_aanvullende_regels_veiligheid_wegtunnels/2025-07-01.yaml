  - number: '13.2'
    text: |-
      Indien de veilige vluchtroute als bedoeld in het eerste lid onder bb, onder i, bestaat uit een middentunnelkanaal
      bevat de tunnel in aanvulling op het eerste lid de volgende uitrusting:
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.2.a
    text: verlichting veilige vluchtroute;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.2.b
    text: omroepinstallatie veilige vluchtroute;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.2.c
    text: |-
      rij van vluchtdeuren of in geval van een middentunnelkanaal zonder kopdeuren als vluchtuitgang: een rij van
      vergrendelbare vluchtdeuren;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.2.d
    text: overdrukvoorziening veilige vluchtroute;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.2.e
    text: |-
      kopdeur middentunnelkanaal, tenzij dit ontwerptechnisch niet mogelijk is; dan wordt de laatste deur van de rij van
      vergrendelbare vluchtdeuren tot vluchtuitgang bestemd, en
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.2.f
    text: dynamische vluchtroute-indicatie.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de veilige vluchtroute als bedoeld in het eerste lid onder bb, onder ii, bestaat uit dwarsverbindingen met
      een verkeersvrij te maken verkeersbuis bevat de tunnel in aanvulling op het eerste lid de volgende uitrusting:
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.3.a
    text: verlichting veilige vluchtroute;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.3.b
    text: omroepinstallatie veilige vluchtroute;
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.3.c
    text: rij van vergrendelbare vluchtdeuren,
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.3.d
    text: overdrukvoorziening veilige vluchtroute, en
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: 13.3.e
    text: dynamische vluchtroute-indicatie.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: '13.4'
    text: |-
      Indien de veilige vluchtroute, bedoeld in het eerste lid onder bb, onder iii, bestaat uit een verkeersvrij te maken
      verkeersbuis bevat de tunnel in aanvulling op het eerste lid een rij van vergrendelbare vluchtdeuren.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13
  - number: '13.5'
    text: |-
      Een tunnel langer dan 500 meter wordt uitgerust met de in het eerste lid en in het tweede, derde of vierde lid
      bedoelde onderdelen overeenkomstig [bijlage 4][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019806
