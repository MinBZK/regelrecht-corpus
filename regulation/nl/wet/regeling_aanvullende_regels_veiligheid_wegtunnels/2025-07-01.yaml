  - number: 13a.1.l.v
    text: kopdeur middentunnelkanaal,
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13a
  - number: 13a.2
    text: |-
      Indien de beheerder dit verkeerskundig noodzakelijk acht, beschikt de tunnel tevens over handmatig bedienbare
      afsluitbomen.
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13a
  - number: 13a.3
    text: |-
      Een tunnel langer dan 250 meter en ten hoogste 500 meter wordt uitgerust met de in het eerste lid bedoelde
      onderdelen overeenkomstig de voorschriften van [bijlage 4][ref1], paragrafen 1 tot en met 4, 16, 17, 19 tot en met
      24, 29, 30, 32, 34 en 35 bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0019806
  - number: 13b
    text: |-
      Indien het een tunnel onder een waterweg betreft, beschikt de tunnel in aanvulling op de gestandaardiseerde
      uitrusting genoemd in [artikel 13][ref1] of [artikel 13a][ref2] over hittewerende bekleding die de constructie twee
      uur bescherming biedt tegen brand conform de RWS-brandkromme als bedoeld in NEN-EN 1991-1-2.


      [ref1]: https://wetten.overheid.nl/BWBR0019806#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0019806#Artikel13a
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0019806
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0019806
        artikel: 13a
  - number: 13c
    text: |-
      Indien de doorrijhoogte van een tunnel langer dan 500 meter lager is dan 4,7 meter beschikt de tunnel in aanvulling
      op de gestandaardiseerde uitrusting genoemd in [artikel 13][ref1] over de volgende uitrusting:


      [ref1]: https://wetten.overheid.nl/BWBR0019806#Artikel13
    url: https://wetten.overheid.nl/BWBR0019806/2025-07-01#Artikel13c
    references:
