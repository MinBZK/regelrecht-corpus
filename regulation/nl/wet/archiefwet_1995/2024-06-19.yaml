  - number: 15a
    text: |-
      1 [Artikel 15, eerste lid, aanhef en onder c][ref1], is niet van toepassing voorzover in de archiefbescheiden
      milieu-informatie als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref2] is neergelegd.

      2 Voorzover in de in de archiefbewaarplaats berustende archiefbescheiden milieu-informatie als bedoeld
      in [artikel 19.1a van de Wet milieubeheer][ref3] is neergelegd, laat de zorgdrager, in afwijking van
      [artikel 15, derde lid][ref4], de ingevolge [artikel 15, eerste lid, aanhef en onder c, of tweede lid][ref5], aan
      de openbaarheid gestelde beperkingen ten aanzien van een verzoeker buiten toepassing.

      3 In afwijking van [artikel 15, eerste lid, onder a, en tweede lid in verbinding met het eerste lid, onder a][ref6],
      worden geen beperkingen aan de openbaarheid gesteld voorzover in de archiefbescheiden neergelegde milieu-informatie
      als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref7] betrekking heeft op emissies in het milieu.

      4 Voorzover in de in de archiefbewaarplaats berustende archiefbescheiden milieu-informatie die
      betrekking heeft op emissies in het milieu is neergelegd, laat de zorgdrager in afwijking van
      [artikel 15, derde lid][ref8], ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden, de
      ingevolge [artikel 15, eerste lid, onder a, of tweede lid in verbinding met het eerste lid, onder a][ref9], aan de
      openbaarheid gestelde beperkingen ten aanzien van een verzoeker buiten toepassing.


