  - number: '3'
    text: |-
      De overheidsorganen zijn verplicht de onder hen berustende archiefbescheiden in goede, geordende en toegankelijke
      staat te brengen en te bewaren, alsmede zorg te dragen voor de vernietiging van de daarvoor in aanmerking komende
      archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel3
  - number: '4'
    text: |-
      1 Een regeling, waarbij overheidsorganen worden opgeheven, samengevoegd of gesplitst, dan wel waarbij een of meer
      taken van een overheidsorgaan worden overgedragen aan een ander overheidsorgaan, houdt een voorziening in omtrent
      hun archiefbescheiden.

      2 Een regeling, waarbij een tijdelijk overheidsorgaan wordt ingesteld, houdt een voorziening in omtrent de bewaring
      van de archiefbescheiden na zijn opheffing.

      3 Een regeling, waarbij taken van een overheidsorgaan geheel of gedeeltelijk worden overgedragen aan een
      rechtspersoon houdt een voorziening in omtrent de terbeschikkingstelling aan die rechtspersoon van de op die taken
      betrekking hebbende archiefbescheiden, voor zover deze niet zijn overgebracht naar een archiefbewaarplaats, voor
      een tijdvak van ten hoogste twintig jaar. Deze voorziening houdt tenminste in een nadere bepaling van het in de
      eerste volzin bedoelde tijdvak, alsmede een bepaling omtrent het toezicht op het beheer van de desbetreffende
      archiefbescheiden, overeenkomstig het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel4
  - number: '5'
    text: |-
      1 De zorgdrager is verplicht tot het ontwerpen van selectielijsten waarin tenminste wordt aangegeven welke
      archiefbescheiden voor vernietiging in aanmerking komen.

      2 De lijsten worden vastgesteld, voor zover het betreft:

      a. archiefbescheiden van de Eerste en de Tweede Kamer der Staten-Generaal, de andere Hoge Colleges van Staat en
      het Kabinet van de Koning: bij koninklijk besluit, op voordracht van Onze minister, in overeenstemming met het
      betrokken overheidsorgaan;

      b. archiefbescheiden van de ministeries: door Onze minister en Onze minister wie het mede aangaat;

      c. archiefbescheiden van andere overheidsorganen: door Onze minister.

      3 Een besluit tot vaststelling van een selectielijst wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel5
  - number: '6'
    text: |-
      Tot vernietiging van in een rijksarchiefbewaarplaats berustende archiefbescheiden mag Onze minister slechts
      overgaan na machtiging van degene, op wiens last deze archiefbescheiden zijn overgebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel6
  - number: '7'
    text: |-
      De zorgdrager is bevoegd archiefbescheiden te vervangen door reprodukties, teneinde de aldus vervangen bescheiden
      te vernietigen.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel7
  - number: '8'
    text: |-
      1 De zorgdrager is bevoegd tot vervreemding van niet in een rijksarchiefbewaarplaats berustende archiefbescheiden,
      voor zover het betreft:

      a. archiefbescheiden van de Eerste en de Tweede Kamer der Staten-Generaal, de andere Hoge Colleges van Staat en het
      Kabinet van de Koning: na een bij koninklijk besluit, op voordracht van Onze minister, verleende machtiging;

      b. archiefbescheiden van andere overheidsorganen: na machtiging van Onze minister.

      2 Voor de vervreemding van archiefbescheiden als bedoeld in het eerste lid is geen machtiging vereist indien de
      vervreemding geschiedt ter uitvoering van een in enige wet neergelegd voorschrift.

      3 Tot vervreemding van in een rijksarchiefbewaarplaats berustende archiefbescheiden mag Onze minister slechts
      overgaan ter uitvoering van een in enige wet neergelegd voorschrift of na machtiging van degene, op wiens last deze
      archiefbescheiden zijn overgebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel8
  - number: '9'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het ontwerpen van lijsten
      als bedoeld in [artikel 5][ref1] alsmede omtrent de vervanging en vervreemding van archiefbescheiden.

      2 Onze Minister-President kan regels stellen op grond waarvan in geval van buitengewone omstandigheden kan worden
      afgeweken van hetgeen in deze wet is bepaald met betrekking tot de vernietiging van archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '5'
        hoofdstuk: II
  - number: '10'
    text: |-
      Indien archiefbescheiden ten onrechte berusten onder een ander overheidsorgaan dan dat waaronder zij behoren te
      berusten, zien de betrokken zorgdragers erop toe, dat die bescheiden te bestemder plaatse geraken.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel10
  - number: '11'
    text: |-
      1 Ieder die archiefbescheiden onder zich heeft, is verplicht deze binnen vier weken, nadat hij een daartoe
      strekkende kennisgeving heeft ontvangen, aan het overheidsorgaan, waaronder zij volgens de bepalingen van deze
      wet zouden behoren te berusten, voor rekening en risico van dit overheidsorgaan af te staan, teneinde het in de
      gelegenheid te stellen hiervan een reproduktie te vervaardigen.

      2 Het overheidsorgaan geeft de archiefbescheiden binnen vier weken na ontvangst terug aan degene, die deze heeft
      afgestaan, ook al kan de overheid op die bescheiden uit anderen hoofde rechten doen gelden.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel11
  - number: '12'
    text: |-
      1 De zorgdrager brengt de archiefbescheiden die niet voor vernietiging in aanmerking komen en ouder zijn dan
      twintig jaar over naar een archiefbewaarplaats.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld, die bij de overbrenging van
      archiefbescheiden in acht dienen te worden genomen.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel12
  - number: '13'
    text: |-
      1 De zorgdrager kan archiefbescheiden die niet voor vernietiging in aanmerking komen en jonger zijn dan twintig
      jaar naar een archiefbewaarplaats overbrengen, wanneer naar het oordeel van de beheerder van de archiefbewaarplaats
      voldoende aanleiding bestaat hiervoor ruimte beschikbaar te stellen.

      2 Een afwijzende beslissing krachtens het eerste lid kan door degene aan wie de beheerder onmiddellijk
      ondergeschikt is worden herzien.

      3 Indien archiefbescheiden ouder dan twintig jaar door het overheidsorgaan nog veelvuldig worden gebruikt
      of geraadpleegd kan op verzoek van de zorgdrager machtiging tot opschorting van de overbrenging van die
      archiefbescheiden worden verleend door Onze minister dan wel, indien het archiefbescheiden betreft voor de bewaring
      waarvan een andere dan een rijksarchiefbewaarplaats of een provinciale archiefbewaarplaats is aangewezen, door
      gedeputeerde staten.

      4 De in het derde lid bedoelde machtiging, waaraan voorwaarden kunnen worden verbonden, wordt verleend voor een
      periode van ten hoogste tien jaar, na afloop waarvan verlenging kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel13
  - number: '14'
    text: |-
      De archiefbescheiden die in een archiefbewaarplaats berusten zijn, behoudens het bepaalde in de
      [artikelen 15][ref1], [16][ref2] en [17][ref3], openbaar. Ieder is, behoudens de beperkingen die voortvloeien
      uit het in die artikelen bepaalde, bevoegd die archiefbescheiden kosteloos te raadplegen en daarvan of daaruit
      afbeeldingen, afschriften, uittreksels en bewerkingen te maken of op zijn kosten te doen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel17
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel14
