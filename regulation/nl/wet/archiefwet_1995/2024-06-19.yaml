        artikel: '1'
        hoofdstuk: I
  - number: '18'
    text: |-
      1 De beheerder van een archiefbewaarplaats is verplicht archiefbescheiden voor een bepaalde tijd uit te lenen aan
      het overheidsorgaan, waaronder de bescheiden, indien zij niet naar een archiefbewaarplaats waren overgebracht,
      zouden berusten, tenzij naar zijn oordeel de toestand van de archiefbescheiden zich daartegen verzet.

      2 De beheerder van een archiefbewaarplaats is, met inachtneming van de aan de openbaarheid gestelde beperkingen,
      bevoegd archiefbescheiden voor een bepaalde tijd uit te lenen aan een instelling, mits een deskundig beheer en een
      veilige bewaring zijn gewaarborgd. Aan een zodanige uitlening kunnen voorwaarden worden verbonden.

      3 De beheerder is bevoegd een verzoek tot uitlening als bedoeld in het tweede lid af te wijzen, indien naar zijn
      oordeel de toestand van de archiefbescheiden zich daartegen verzet of deze aan de verzoeker niet veilig kunnen
      worden toevertrouwd.

      4 Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek tot uitlening als bedoeld in het tweede lid
      vindt schriftelijk plaats. In geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de
      verzoeker daarom vraagt. De verzoeker wordt op deze mogelijkheid gewezen.

      5 Indien de aard of de mate van raadpleging of gebruik van de archiefbescheiden bij de in het tweede lid bedoelde
      uitlening een ernstige bedreiging vormt voor hun toestand, is de beheerder bevoegd te bepalen dat in de plaats van
      die archiefbescheiden reprodukties worden uitgeleend.

      6 De aan de uitlening verbonden kosten kunnen de verzoeker in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel18
  - number: '19'
    text: |-
      1 De zorgdrager stelt, indien de kosten, bedoeld in [artikel 14][ref1] en in [artikel 18, zesde lid][ref2], in
      rekening worden gebracht, regels omtrent die kosten.

      2 De zorgdrager brengt ten hoogste de marginale kosten in rekening voor vermenigvuldiging, verstrekking en
      verspreiding van documenten.

      3 De zorgdrager maakt actief algemeen kenbaar welke kosten in rekening worden gebracht en met welke factoren
      rekening wordt gehouden bij de berekening daarvan. Op verzoek geeft de zorgdrager inzicht in de berekening met
      betrekking tot een concreet verzoek om gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel18
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel19
    references:
