  - number: '16'
    text: |-
      1 De openbaarheid van de in [artikel 1, onder ][ref1], bedoelde archiefbescheiden kan worden beperkt bij de
      desbetreffende overeenkomsten en beschikkingen.

      2 Indien deze archiefbescheiden uit anderen hoofde in een archiefbewaarplaats zijn opgenomen om daar te berusten,
      kan de zorgdrager beperkingen aan de openbaarheid stellen. Het in artikel 15 bepaalde is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
        hoofdstuk: I
  - number: '17'
    text: |-
      1 De beheerder van een archiefbewaarplaats stelt de daar berustende archiefbescheiden aan de verzoeker
      ter raadpleging of gebruik beschikbaar met inachtneming van de aan de openbaarheid gestelde beperkingen en
      overeenkomstig de [artikelen 5][ref1] en [6 van de Wet hergebruik van overheidsinformatie][ref2].

      2 De beheerder is bevoegd een verzoek tot raadpleging of gebruik van archiefbescheiden af te wijzen, indien naar
      zijn oordeel de toestand van de archiefbescheiden zich daartegen verzet of deze aan de verzoeker niet veilig kunnen
      worden toevertrouwd.

      3 Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek tot raadpleging of gebruik vindt schriftelijk
      plaats. In geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom
      vraagt. De verzoeker wordt op deze mogelijkheid gewezen.

      4 Indien de aard of de mate van raadpleging of gebruik van archiefbescheiden een ernstige bedreiging vormt voor hun
      toestand, is de beheerder bevoegd te bepalen dat in de plaats van die archiefbescheiden reprodukties, niet zijnde
      archiefbescheiden als bedoeld in [artikel 1, onder ][ref3], ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036795#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel17
    references:
      - id: ref1
