  - number: '36'
    text: |-
      Voor de bewaring van de op grond van [artikel 12, eerste lid][ref1], en [artikel 13, eerste lid][ref2], over te
      brengen archiefbescheiden van de organen van het waterschap wijst het bestuur een archiefbewaarplaats aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: '37'
    text: |-
      1 De archiefbewaarplaats wordt beheerd door een waterschapsarchivaris, die in het bezit dient te zijn van een
      diploma archivistiek of, zo geen zodanige archivaris mocht zijn aangewezen, door de secretaris.

      2 Ten aanzien van het beheer van de archiefbescheiden van de organen van het waterschap, voorzover deze
      archiefbescheiden niet zijn overgebracht naar een archiefbewaarplaats, is, onder de bevelen van het
      dagelijks bestuur, met het toezicht op de naleving van het bepaalde bij of krachtens deze wet belast de
      waterschapsarchivaris. Met betrekking tot dit toezicht stelt het bestuur een verordening vast, welke aan
      gedeputeerde staten wordt medegedeeld.

      3 Het bestuur wijst de waterschapsarchivaris aan. De aanwijzing eindigt van rechtswege met ingang van de datum dat
      de uitoefening van de functie van waterschapsarchivaris geen onderdeel meer uitmaakt van de werkzaamheden van de
      betreffende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel37
  - number: '38'
    text: |-
      Met betrekking tot de uitvoering van deze wet door het dagelijks bestuur zijn de [artikelen 124][ref1],
      [124a][ref2], [124c tot en met 124h][ref3] alsmede [hoofdstuk XVII van de Gemeentewet][ref4] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel124a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel124c
      [ref4]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXVII
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 124a
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 124c
      - id: ref4
        bwb_id: BWBR0005416
        hoofdstuk: XVII
  - number: '40'
    text: |-
      1 Een regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] (*Stb*. 1989, 571) houdt tevens een
      voorziening in omtrent de zorg voor de archiefbescheiden van bij die regeling ingestelde openbare lichamen of
      gemeenschappelijke organen.

      2 Deze voorziening wordt getroffen zoveel mogelijk overeenkomstig de bepalingen van deze wet.

      3 Zolang bij een gemeenschappelijke regeling niet is voldaan aan de verplichting tot het treffen van een
      voorziening als bedoeld in het eerste lid, zijn van overeenkomstige toepassing de bepalingen die terzake gelden
      voor de gemeente dan wel, indien een provincie aan de regeling deelneemt, voor de provincie, waar het ingestelde
      lichaam of orgaan is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '41'
    text: |-
      1 Met de zorg voor de archiefbescheiden van andere dan in de voorafgaande artikelen bedoelde overheidsorganen, voor
      zover de archiefbescheiden niet zijn overgebracht naar een archiefbewaarplaats, is belast:

      a. het dagelijks bestuur of in de gevallen, dat er geen dagelijks bestuur is, het bestuur:

      b. in andere gevallen: de persoon met enig openbaar gezag bekleed.

      2 Bij algemene maatregel van bestuur worden regels gesteld omtrent de wijze waarop de in de in het eerste lid
      bedoelde zorg wordt uitgeoefend.

      3 De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van het
      desbetreffende overheidsorgaan.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel41
  - number: '42'
    text: |-
      1 Hij die aan de bij [artikel 11, eerste lid][ref1], gestelde verplichting niet voldoet, wordt gestraft met
      geldboete van de tweede categorie.

      2 Het feit is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel11
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '11'
        hoofdstuk: II
  - number: '43'
    text: De [Archiefwet 1962](onbekend) (*Stb.* 313) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel43
  - number: '44'
    text: |-
      De voor de inwerkingtreding van deze wet op grond van de [artikelen 7](onbekend) en [7](onbekend) aan de
      openbaarheid gestelde beperkingen blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel44
  - number: '45'
    text: |-
      De onder de overheidsorganen berustende archiefbescheiden die op het moment van de inwerkingtreding van deze wet
      ouder zijn dan twintig jaar, worden op last van de zorgdrager binnen een tijdvak van tien jaar na inwerkingtreding
      van deze wet naar een archiefbewaarplaats overgebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel45
  - number: '46'
    text: |-
      1 De op grond van het koninklijk besluit van 28 augustus 1919 (*Stb.* 547) tussen het Rijk en gemeenten getroffen
      regelingen met betrekking tot de inbewaringgeving van archiefbescheiden van de rechtbanken in eerste aanleg en
      van de vredegerechten blijven gehandhaafd, totdat deze regelingen na overleg met burgemeester en wethouders van de
      desbetreffende gemeente worden beëindigd.

      2 De op grond van de koninklijke besluiten van 19 april 1929 (*Stb.* 171), 31 mei 1929 (*Stb.* 269), 6 juli 1929
      ( *Stb.* 381) en 24 november 1932 (*Stb.* 560) tussen het Rijk en de gemeenten getroffen regelingen met betrekking
      tot de inbewaringgeving van de in die besluiten bedoelde archiefbescheiden blijven gehandhaafd, totdat deze
      regelingen zijn vervangen door een regeling tot de vervreemding van die archiefbescheiden.

      3 De ingevolge de in het tweede lid genoemde koninklijke besluiten naar een rijksarchiefbewaarplaats
      overgebrachte archiefbescheiden worden, op verzoek van de desbetreffende gemeente tot vervreemding van die
      archiefbescheiden, aan die gemeente overgedragen, indien zij dientengevolge komen te berusten in een ingevolge
      [artikel 33, tweede lid][ref1], goedgekeurde archiefbewaarplaats, beheerd door een gemeentearchivaris die is
      aangewezen overeenkomstig het in [artikel 32, derde lid][ref2], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel32
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '33'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '32'
        hoofdstuk: V
  - number: '47'
    text: |-
      Andere dan de in [artikel 46][ref1] bedoelde inbewaringgevingen blijven in stand tot het moment dat zij na overleg
      tussen de betrokken overheidslichamen zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel46
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '46'
        hoofdstuk: IX
  - number: '48'
    text: |-
      De ingevolge [artikel 3 van het Archiefbesluit][ref1] (*Stb.* 1968, 200), zoals dit luidde voor de
      inwerkingtreding van deze wet, vastgestelde lijsten van voor vernietiging in aanmerking komende archiefbescheiden
      blijven gehandhaafd totdat zij zijn vervangen door op grond van [artikel 5][ref2] van deze wet vastgestelde
      selectielijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '5'
        hoofdstuk: II
  - number: '49'
    text: |-
      De machtigingen, verleend op grond van [artikel 20 van het Archiefbesluit][ref1], zoals dit luidde voor
      de inwerkingtreding van deze wet, blijven gelden totdat zij zijn vervangen door een machtiging afgegeven
      overeenkomstig het in [artikel 13, derde lid][ref2], van deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: '85'
    text: |-
      Bij plaatsing in het *Staatsblad* wordt de in deze wet voorkomende aanduiding "19.." vervangen door het jaartal van
      het *Staatsblad* waarin deze wet wordt geplaatst en worden de drie puntjes in de in deze wet voorkomende aanduiding
      (*Stb.* ...) vervangen door het nummer van het *Staatsblad* waarin deze wet wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel85
  - number: '86'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel86
  - number: '87'
    text: |-
      Deze wet kan worden aangehaald als Archiefwet met vermelding van het jaartal van het *Staatsblad* waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel87
