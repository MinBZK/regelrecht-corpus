  - number: '32'
    text: |-
      1 De gemeentelijke archiefbewaarplaats wordt beheerd door een gemeentearchivaris, die in het bezit dient te zijn
      van een diploma archivistiek of, zo geen zodanige archivaris mocht zijn aangewezen, door de secretaris.

      2 Ten aanzien van het beheer van de archiefbescheiden van de gemeentelijke organen, voorzover deze
      archiefbescheiden niet zijn overgebracht naar een archiefbewaarplaats, is, onder de bevelen van burgemeester
      en wethouders, met het toezicht op de naleving van het bepaalde bij of krachtens deze wet belast de
      gemeentearchivaris. Met betrekking tot dit toezicht stelt de gemeenteraad een verordening vast, welke aan
      gedeputeerde staten wordt medegedeeld.

      3 Burgemeester en wethouders wijzen de gemeentearchivaris aan. De aanwijzing eindigt van rechtswege met ingang van
      de datum dat de uitoefening van de functie van gemeentearchivaris geen onderdeel meer uitmaakt van de werkzaamheden
      van de betreffende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel32
  - number: '35'
    text: |-
      1 Overeenkomstig een door het bestuur vast te stellen verordening, welke aan gedeputeerde staten wordt medegedeeld,
      draagt het dagelijks bestuur zorg voor de archiefbescheiden van de organen van het waterschap.

      2 De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van het
      waterschap.

      3 Onze minister kan in bijzondere gevallen een subsidie verstrekken voor de kosten van het beheer van de in de
      waterschapsarchiefbewaarplaats berustende archiefbescheiden, indien de aard of de omvang van de archiefbescheiden
      naar zijn oordeel daartoe aanleiding geeft.

      4 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] op de subsidie, bedoeld in het derde lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
