  - number: '15'
    text: |-
      1 Bij de overbrenging van de in [artikel 1, onder ][ref1], bedoelde archiefbescheiden kan de zorgdrager, na advies
      van de beheerder van de archiefbewaarplaats, slechts beperkingen aan de openbaarheid stellen voor een bepaalde
      termijn en met het oog op:

      a. de eerbiediging van de persoonlijke levenssfeer;

      b. het belang van de Staat of zijn bondgenoten;

      c. de onevenredige benadeling van een ander belang dan genoemd in onderdeel a of onderdeel b.

      Voor zover de beheerder van een archiefbewaarplaats een rijksarchivaris is als bedoeld in
      [artikel 26, tweede lid][ref2], wordt het advies, bedoeld in de eerste volzin, gevraagd aan de algemene
      rijksarchivaris, bedoeld in [artikel 25, eerste lid][ref3].

      2 De zorgdrager ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden kan, na de in het eerste
      lid bedoelde overbrenging, niet alsnog beperkingen als bedoeld in het eerste lid stellen, tenzij zich na het
      tijdstip van overbrenging omstandigheden hebben voorgedaan die, waren zij op dat tijdstip bekend geweest, tot het
      stellen van beperkingen aan de openbaarheid ingevolge het eerste lid zouden hebben geleid.

      3 De zorgdrager ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden, kan, gehoord degene op
      wiens last de archiefbescheiden zijn overgebracht, de ingevolge het eerste of het tweede lid aan de openbaarheid
      gestelde beperkingen opheffen, dan wel ten aanzien van een verzoeker buiten toepassing laten, indien het belang van
      de gestelde beperking niet opweegt tegen diens belang tot raadpleging of gebruik van de archiefbescheiden.

      4 Ingevolge het eerste of het tweede lid aan de openbaarheid gestelde beperkingen hebben geen betrekking
      op archiefbescheiden die ouder zijn dan vijfenzeventig jaar, tenzij door Onze minister dan wel, indien het
      archiefbescheiden betreft voor de bewaring waarvan een andere dan een rijksarchiefbewaarplaats of een provinciale
      archiefbewaarplaats is aangewezen, door gedeputeerde staten anders wordt beslist.

      5 Het derde lid is niet van toepassing op archiefbescheiden aan de openbaarheid waarvan beperkingen zijn gesteld
      met het oog op het belang van de Staat of zijn bondgenoten.

      6 In geval van archiefbescheiden die het belang van de Staat of zijn bondgenoten betreffen vindt het vierde lid
      slechts toepassing voor zover de ministerraad niet anders beslist.

      7 Met betrekking tot de in het vijfde lid bedoelde archiefbescheiden zijn van toepassing de regelingen inzake
      het recht op informatie die zouden gelden indien de archiefbescheiden niet naar een archiefbewaarplaats waren
      overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel25
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel15
