  - number: '2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden onder overheidsorganen tevens begrepen
      overheidsorganen, welke voor of na de inwerkingtreding van deze wet zijn of zullen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel2
  - number: 2a
    text: |-
      Bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] kunnen worden verwerkt, indien
      die verwerking verband houdt met:

      a. de vervanging van archiefbescheiden, bedoeld in [artikel 7][ref3];

      b. de overbrenging van archiefbescheiden naar een archiefbewaarplaats, bedoeld in de [artikelen 12][ref4] en
      [13][ref5];

      c. de opneming van archiefbescheiden als bedoeld in [artikel 1, onderdeel c, onder 3°][ref6], in een
      archiefbewaarplaats, of;

      d. het beheer van archiefbescheiden die in een archiefbewaarplaats berusten, met uitzondering van het ter
      raadpleging of gebruik beschikbaar stellen van zodanige archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
