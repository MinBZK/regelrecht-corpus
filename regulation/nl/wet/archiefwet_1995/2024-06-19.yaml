preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de ontwikkelingen op het gebied van het archiefwezen het wenselijk maken
    de Archiefwet 1962 te vervangen en in verband daarmede enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. overheidsorgaan:

      1°. een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of

      2°. een ander persoon of college met enig openbaar gezag bekleed;

      c. archiefbescheiden:

      1°. bescheiden, ongeacht hun vorm, door de overheidsorganen ontvangen of opgemaakt en naar hun aard bestemd
      daaronder te berusten;

      2°. bescheiden, ongeacht hun vorm, met overeenkomstige bestemming, ontvangen of opgemaakt door instellingen of
      personen, wier rechten of functies op enig overheidsorgaan zijn overgegaan;

      3°. bescheiden, ongeacht hun vorm, welke ingevolge overeenkomsten met of beschikkingen van instellingen of personen
      dan wel uit anderen hoofde in een archiefbewaarplaats zijn opgenomen om daar te berusten;

      4°. reprodukties, ongeacht hun vorm, welke bij of krachtens de wet in de plaats zijn gesteld van de onder 1°, 2° of
      3° bedoelde archiefbescheiden of welke op grond van het bepaalde in [artikel 7][ref1] zijn vervaardigd;

      d. zorgdrager: degene die bij of krachtens de wet belast is met de zorg voor de archiefbescheiden;

      e. archiefruimte: een ruimte, bestemd of aangewezen voor de bewaring van archiefbescheiden in afwachting van hun
      overbrenging ingevolge [artikel 12, eerste lid][ref2] of [13, eerste lid][ref3];

      f. archiefbewaarplaats: een bij of krachtens deze wet voor de blijvende bewaring van archiefbescheiden aangewezen
      bewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel13
