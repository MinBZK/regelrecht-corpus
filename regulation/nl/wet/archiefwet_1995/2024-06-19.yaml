  - number: '20'
    text: |-
      De beheerder van een archiefbewaarplaats is bevoegd afschriften af te geven van een authentieke akte die volgens
      deze wet door hem bewaard moet worden.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel20
  - number: '21'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de duurzaamheid van
      door overheidsorganen op te maken archiefbescheiden, omtrent de bouw, verbouwing, inrichting en verandering
      van inrichting van archiefruimten en archiefbewaarplaatsen, alsmede omtrent de ingebruikneming van gebouwen of
      gedeelten van gebouwen als archiefruimte of archiefbewaarplaats.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het in geordende
      en toegankelijke staat brengen en bewaren van archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de opleiding tot en het verkrijgen
      van diploma's in de archivistiek.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel22
  - number: '23'
    text: |-
      1 De Eerste en de Tweede Kamer der Staten-Generaal, de andere Hoge Colleges van Staat, de directeur van het Kabinet
      van de Koning en Onze ministers dragen zorg voor hun archiefbescheiden, voor zover deze niet zijn overgebracht naar
      een rijksarchiefbewaarplaats.

      2 Onze commissarissen in de provincie dragen zorg voor de archiefbescheiden die verband houden met de taken,
      bedoeld in [artikel 182, eerste en tweede lid, van de Provinciewet][ref1], voor zover deze archiefbescheiden niet
      zijn overgebracht naar een rijksarchiefbewaarplaats.

      3 Onze minister draagt tevens zorg voor de archiefbescheiden, die in de rijksarchiefbewaarplaatsen berusten.

      4 Bij algemene maatregel van bestuur worden regels gesteld omtrent de wijze waarop de in het eerste lid bedoelde
      zorg wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel182
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '182'
  - number: '24'
    text: |-
      1 Onze minister is bevoegd overheidsorganen als bedoeld in de [artikelen 23, eerste lid en tweede lid][ref1], en
      [41, eerste lid][ref2], er op te wijzen dat zij dienen te voldoen aan het bepaalde bij of krachtens deze wet.

      2 Onze minister is bevoegd tot oplegging van een last onder bestuursdwang in geval een overheidsorgaan een
      aanwijzing als bedoeld in het eerste lid niet opvolgt.

      3 Onze minister maakt van zijn bevoegdheid, genoemd in het tweede lid, geen gebruik dan na overleg met het
      betrokken overheidsorgaan.

      4 De bevoegdheid, genoemd in het tweede lid, geldt niet ten aanzien van de Eerste en Tweede Kamer der Staten-
      Generaal, de andere Hoge Colleges van Staat en het Kabinet van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel24
    references:
