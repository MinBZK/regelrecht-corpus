  - number: 2b
    text: |-
      1 Onder gebruik in de zin van de [artikelen 14][ref1] en [17][ref2] van deze wet wordt ook het hergebruik verstaan
      in de zin van [Richtlijn 2019/1024/EU](32019L1024) van het Europees parlement en de Raad van 20 juni 2019 inzake
      het hergebruik van overheidsinformatie (PbEU 2019, L 172).

      2 De [Wet hergebruik van overheidsinformatie][ref3] is niet van toepassing op het ter beschikking stellen van naar
      een archiefbewaarplaats overgebrachte archiefbescheiden voor gebruik, tenzij bij deze wet anders is bepaald.

      3 Voor zover de naar een archiefbewaarplaats overgebrachte archiefbescheiden specifieke hoogwaardige
      gegevenssets zijn als bedoeld in [artikel 1 van de Wet hergebruik van overheidsinformatie][ref4],
      is [artikel 5a van die wet][ref5] van toepassing op deze archiefbescheiden. De [artikelen 2][ref6],
      [5,][ref7][6][ref8], [7][ref9] en [8 van de Wet hergebruik van overheidsinformatie][ref10] zijn van toepassing op
      de beschikbaarstelling van die archiefbescheiden voor gebruik.


