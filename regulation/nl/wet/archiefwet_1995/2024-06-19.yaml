        bwb_id: BWBR0007376
        artikel: '41'
        hoofdstuk: VII
  - number: '25'
    text: |-
      1 Er is onder de bevelen van Onze minister een rijksarchiefdienst, aan het hoofd waarvan staat de algemene
      rijksarchivaris, die in het bezit dient te zijn van een diploma archivistiek.

      2 De rijksarchiefdienst heeft tot taak:

      a. het beheer van de in de rijksarchiefbewaarplaatsen berustende archiefbescheiden;

      b. het verrichten van bij of krachtens algemene maatregel van bestuur of door Onze minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel25
  - number: 25a
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens de wet bepaalde ten aanzien van het beheer van de
      archiefbescheiden, bedoeld in de [artikelen 23, eerste en tweede lid][ref1], en [41, eerste lid][ref2], zijn belast
      de bij besluit van Onze minister als hoofdinspecteur en inspecteurs aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan in de *Staatscourant*.

      3 De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:19 van de Algemene wet bestuursrecht][ref3].

      4 Indien een toezichthouder met toepassing van [artikel 5:15 van de Algemene wet bestuursrecht][ref4]
      een ruimte betreedt waarin de in de [artikelen 23, eerste of tweede lid][ref5], dan wel
      [artikel 41, eerste lid][ref6], bedoelde archiefbescheiden worden bewaard, dan wel met toepassing van
      [artikel 5:18 van de Algemene wet bestuursrecht][ref7] inzage vordert van die archiefbescheiden, neemt hij de
      voorschriften ten aanzien van de beveiliging van geheimen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
