  - number: '26'
    text: |-
      1 Te 's-Gravenhage is gevestigd de algemene rijksarchiefbewaarplaats, welke is bestemd voor de bewaring van
      de archiefbescheiden der overheidsorganen, waarvan de functies zich over het gehele rijk uitstrekken of hebben
      uitgestrekt. De algemene rijksarchivaris is daarvan de beheerder.

      2 In de hoofdplaats van elke provincie is gevestigd een rijksarchiefbewaarplaats, welke is bestemd voor de bewaring
      van de archiefbescheiden van de in die provincie gevestigde organen van het rijk, van de voormalige provinciale en
      departementale besturen en van de in [artikel 41, eerste lid][ref1], bedoelde overheidsorganen, waarvan de functies
      zich niet over het gehele rijk uitstrekken of hebben uitgestrekt. Een rijksarchivaris, die in het bezit dient te
      zijn van een diploma archivistiek, is daarvan de beheerder.

      3 Bij koninklijk besluit kunnen andere rijksarchiefbewaarplaatsen worden aangewezen of gevestigd dan de in het
      eerste en tweede lid bedoelde.

      4 Bij koninklijk besluit kan worden bepaald, dat archiefbescheiden van overheidsorganen, waarvan de functies
      zich over het gehele rijk uitstrekken of hebben uitgestrekt, worden bewaard in de rijksarchiefbewaarplaats in de
      hoofdplaats van de provincie, waarin deze overheidsorganen gevestigd zijn of zijn geweest.

      5 Bij koninklijk besluit kan worden bepaald, dat archiefbescheiden van overheidsorganen, waarvan de functies zich
      over meer dan een provincie doch niet over het gehele rijk uitstrekken of hebben uitgestrekt, worden bewaard in de
      algemene rijksarchiefbewaarplaats.

      6 Omtrent de bewaring in rijksarchiefbewaarplaatsen van andere dan in het eerste en tweede lid bedoelde
      archiefbescheiden beslist Onze minister.

      7 Onze minister stelt de verdere inrichting van de rijksarchiefdienst vast.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '41'
        hoofdstuk: VII
  - number: '27'
    text: |-
      1 Overeenkomstig een door provinciale staten vast te stellen verordening dragen gedeputeerde staten zorg voor de
      archiefbescheiden van de provinciale organen.

      2 De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van de provincie.

      3 Onze minister kan in bijzondere gevallen een subsidie verstrekken voor de kosten van het beheer van de in de
      provinciale archiefbewaarplaats berustende archiefbescheiden, indien de aard of de omvang van de archiefbescheiden
      naar zijn oordeel daartoe aanleiding geeft.

      4 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing op de subsidie, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:21
      - id: ref2
        bwb_id: BWBR0005537
  - number: '28'
    text: |-
      Voor de bewaring van de op grond van [artikel 12, eerste lid][ref1], en [artikel 13, eerste lid][ref2], over te
      brengen archiefbescheiden van de provinciale organen wijzen gedeputeerde staten een provinciale archiefbewaarplaats
      aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: '29'
    text: |-
      1 De provinciale archiefbewaarplaats wordt beheerd door een provinciearchivaris, die in het bezit dient te zijn van
      een diploma archivistiek of, zo geen zodanige archivaris mocht zijn aangewezen, door de secretaris.

      2 Ten aanzien van het beheer van de archiefbescheiden van de provinciale organen, voor zover deze archiefbescheiden
      niet zijn overgebracht naar een archiefbewaarplaats, is, onder de bevelen van gedeputeerde staten, met het toezicht
      op de naleving van het bepaalde bij of krachtens deze wet belast de provinciearchivaris. Met betrekking tot dit
      toezicht stellen provinciale staten een verordening vast.

      3 Gedeputeerde staten wijzen de provinciearchivaris aan. De aanwijzing eindigt van rechtswege met ingang van de
      datum dat de uitoefening van de functie van provinciearchivaris geen onderdeel meer uitmaakt van de werkzaamheden
      van de betreffende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel29
  - number: '30'
    text: |-
      1 Overeenkomstig een door de gemeenteraad vast te stellen verordening, welke aan gedeputeerde staten wordt
      medegedeeld, dragen burgemeester en wethouders zorg voor de archiefbescheiden van de gemeentelijke organen.

      2 De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van de gemeente.

      3 Onze minister kan in bijzondere gevallen een subsidie verstrekken voor de kosten van het beheer van de
      in de gemeentelijke archiefbewaarplaats berustende archiefbescheiden, indien de aard of de omvang van de
      archiefbescheiden naar zijn oordeel daartoe aanleiding geeft.

      4 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] op de subsidie, bedoeld in het derde lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007376/2024-06-19#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:21
      - id: ref2
        bwb_id: BWBR0005537
  - number: '31'
    text: |-
      Voor de bewaring van de op grond van [artikel 12, eerste lid][ref1], en [artikel 13, eerste lid][ref2], over
      te brengen archiefbescheiden van de gemeentelijke organen wijzen burgemeester en wethouders een gemeentelijke
      archiefbewaarplaats aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
