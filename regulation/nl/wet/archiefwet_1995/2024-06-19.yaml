  - number: 25b
    text: |-
      1 De hoofdinspecteur, bedoeld in [artikel 25a, eerste lid][ref1], doet aan het overheidsorgaan mededeling van de
      bevindingen van het toezicht en van de voorzieningen die naar zijn oordeel dienen te worden getroffen.

      2 Hij brengt jaarlijks voor 1 juli aan Onze minister schriftelijk verslag uit van de bevindingen van het toezicht
      gedurende het afgelopen kalenderjaar. Onze minister legt dit verslag, vergezeld van zijn standpunt, over aan de
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel25a
