---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: archiefwet_1995
regulatory_layer: WET
publication_date: '2024-06-18'
valid_from: '2005-07-08'
bwb_id: BWBR0007376
url: https://wetten.overheid.nl/BWBR0007376/2005-07-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de ontwikkelingen op het gebied van het archiefwezen het wenselijk maken
    de Archiefwet 1962 te vervangen en in verband daarmede enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.b
    text: 'overheidsorgaan:'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.b.1°
    text: een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.b.2°
    text: een ander persoon of college met enig openbaar gezag bekleed;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.c
    text: 'archiefbescheiden:'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.c.1°
    text: |-
      bescheiden, ongeacht hun vorm, door de overheidsorganen ontvangen of opgemaakt en naar hun aard bestemd daaronder
      te berusten;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.c.2°
    text: |-
      bescheiden, ongeacht hun vorm, met overeenkomstige bestemming, ontvangen of opgemaakt door instellingen of
      personen, wier rechten of functies op enig overheidsorgaan zijn overgegaan;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.c.3°
    text: |-
      bescheiden, ongeacht hun vorm, welke ingevolge overeenkomsten met of beschikkingen van instellingen of personen dan
      wel uit anderen hoofde in een archiefbewaarplaats zijn opgenomen om daar te berusten;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.c.4°
    text: |-
      reprodukties, ongeacht hun vorm, welke bij of krachtens de wet in de plaats zijn gesteld van de onder 1°, 2° of 3°
      bedoelde archiefbescheiden of welke op grond van het bepaalde in [artikel 7][ref1] zijn vervaardigd;


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel7
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '7'
        hoofdstuk: II
  - number: 1.d
    text: 'zorgdrager: degene die bij of krachtens de wet belast is met de zorg voor de archiefbescheiden;'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: 1.e
    text: |-
      archiefruimte: een ruimte, bestemd of aangewezen voor de bewaring van archiefbescheiden in afwachting van hun
      overbrenging ingevolge [artikel 12, eerste lid][ref1] of [13, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: 1.f
    text: |-
      archiefbewaarplaats: een bij of krachtens deze wet voor de blijvende bewaring van archiefbescheiden aangewezen
      bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden onder overheidsorganen tevens begrepen
      overheidsorganen, welke voor of na de inwerkingtreding van deze wet zijn of zullen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel2
  - number: 2a
    text: |-
      Het verbod persoonsgegevens te verwerken, bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1],
      geldt niet voor verwerkingen die verband houden met:


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 2a.a
    text: |-
      de vervanging van archiefbescheiden, bedoeld in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel7
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '7'
        hoofdstuk: II
  - number: 2a.b
    text: |-
      de overbrenging van archiefbescheiden naar een archiefbewaarplaats, bedoeld in de [artikelen 12][ref1] en
      [13][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: 2a.c
    text: |-
      de opneming van archiefbescheiden als bedoeld in [artikel 1, onderdeel c, onder 3°][ref1], in een
      archiefbewaarplaats, of;


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
        hoofdstuk: I
  - number: 2a.d
    text: |-
      het beheer van archiefbescheiden die in een archiefbewaarplaats berusten, met uitzondering van het ter raadpleging
      of gebruik beschikbaar stellen van zodanige archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel2a
  - number: '3'
    text: |-
      De overheidsorganen zijn verplicht de onder hen berustende archiefbescheiden in goede, geordende en toegankelijke
      staat te brengen en te bewaren, alsmede zorg te dragen voor de vernietiging van de daarvoor in aanmerking komende
      archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel3
  - number: '4.1'
    text: |-
      Een regeling, waarbij overheidsorganen worden opgeheven, samengevoegd of gesplitst, dan wel waarbij een of meer
      taken van een overheidsorgaan worden overgedragen aan een ander overheidsorgaan, houdt een voorziening in omtrent
      hun archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel4
  - number: '4.2'
    text: |-
      Een regeling, waarbij een tijdelijk overheidsorgaan wordt ingesteld, houdt een voorziening in omtrent de bewaring
      van de archiefbescheiden na zijn opheffing.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel4
  - number: '4.3'
    text: |-
      Een regeling, waarbij taken van een overheidsorgaan geheel of gedeeltelijk worden overgedragen aan een
      rechtspersoon houdt een voorziening in omtrent de terbeschikkingstelling aan die rechtspersoon van de op die taken
      betrekking hebbende archiefbescheiden, voor zover deze niet zijn overgebracht naar een archiefbewaarplaats, voor
      een tijdvak van ten hoogste twintig jaar. Deze voorziening houdt tenminste in een nadere bepaling van het in de
      eerste volzin bedoelde tijdvak, alsmede een bepaling omtrent het toezicht op het beheer van de desbetreffende
      archiefbescheiden, overeenkomstig het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel4
  - number: '5.1'
    text: |-
      De zorgdrager is verplicht tot het ontwerpen van selectielijsten waarin tenminste wordt aangegeven welke
      archiefbescheiden voor vernietiging in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel5
  - number: '5.2'
    text: |-
      De lijsten worden, nadat Onze minister de Raad voor cultuur, bedoeld in [artikel 2][ref1], heeft gehoord,
      vastgesteld, voor zover het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel2a
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 2a
  - number: 5.2.a
    text: |-
      archiefbescheiden van de Eerste en de Tweede Kamer der Staten-Generaal, de andere Hoge Colleges van Staat en het
      Kabinet der Koningin: bij koninklijk besluit, op voordracht van Onze minister, in overeenstemming met het betrokken
      overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel5
  - number: 5.2.b
    text: 'archiefbescheiden van de ministeries: door Onze minister en Onze minister wie het mede aangaat;'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel5
  - number: 5.2.c
    text: 'archiefbescheiden van andere overheidsorganen: door Onze minister.'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel5
  - number: '5.3'
    text: De vastgestelde lijsten worden gepubliceerd in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel5
  - number: '6'
    text: |-
      Tot vernietiging van in een rijksarchiefbewaarplaats berustende archiefbescheiden mag Onze minister slechts
      overgaan na machtiging van degene, op wiens last deze archiefbescheiden zijn overgebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel6
  - number: '7'
    text: |-
      De zorgdrager is bevoegd archiefbescheiden te vervangen door reprodukties, teneinde de aldus vervangen bescheiden
      te vernietigen. Voor de vervanging van archiefbescheiden die niet als te vernietigen worden aangemerkt in
      de in [artikel 5][ref1] bedoelde lijsten, is een machtiging vereist van Onze minister dan wel, indien het
      archiefbescheiden betreft voor de bewaring waarvan een andere dan een rijksarchiefbewaarplaats is aangewezen, van
      gedeputeerde staten. Deze machtiging houdt tevens een machtiging tot vernietiging in.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '5'
        hoofdstuk: II
  - number: '8.1'
    text: |-
      De zorgdrager is bevoegd tot vervreemding van niet in een rijksarchiefbewaarplaats berustende archiefbescheiden,
      voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel8
  - number: 8.1.a
    text: |-
      archiefbescheiden van de Eerste en de Tweede Kamer der Staten-Generaal, de andere Hoge Colleges van Staat en het
      Kabinet der Koningin: na een bij koninklijk besluit, op voordracht van Onze minister, verleende machtiging;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel8
  - number: 8.1.b
    text: 'archiefbescheiden van andere overheidsorganen: na machtiging van Onze minister.'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel8
  - number: '8.2'
    text: |-
      Voor de vervreemding van archiefbescheiden als bedoeld in het eerste lid is geen machtiging vereist indien de
      vervreemding geschiedt ter uitvoering van een in enige wet neergelegd voorschrift.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel8
  - number: '8.3'
    text: |-
      Tot vervreemding van in een rijksarchiefbewaarplaats berustende archiefbescheiden mag Onze minister slechts
      overgaan ter uitvoering van een in enige wet neergelegd voorschrift of na machtiging van degene, op wiens last deze
      archiefbescheiden zijn overgebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel8
  - number: '9.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het ontwerpen van lijsten als
      bedoeld in [artikel 5][ref1] alsmede omtrent de vervanging en vervreemding van archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '5'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Onze Minister-President kan regels stellen op grond waarvan in geval van buitengewone omstandigheden kan worden
      afgeweken van hetgeen in deze wet is bepaald met betrekking tot de vernietiging van archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel9
  - number: '10'
    text: |-
      Indien archiefbescheiden ten onrechte berusten onder een ander overheidsorgaan dan dat waaronder zij behoren te
      berusten, zien de betrokken zorgdragers erop toe, dat die bescheiden te bestemder plaatse geraken.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel10
  - number: '11.1'
    text: |-
      Ieder die archiefbescheiden onder zich heeft, is verplicht deze binnen vier weken, nadat hij een daartoe strekkende
      kennisgeving heeft ontvangen, aan het overheidsorgaan, waaronder zij volgens de bepalingen van deze wet zouden
      behoren te berusten, voor rekening en risico van dit overheidsorgaan af te staan, teneinde het in de gelegenheid te
      stellen hiervan een reproduktie te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel11
  - number: '11.2'
    text: |-
      Het overheidsorgaan geeft de archiefbescheiden binnen vier weken na ontvangst terug aan degene, die deze heeft
      afgestaan, ook al kan de overheid op die bescheiden uit anderen hoofde rechten doen gelden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel11
  - number: '12.1'
    text: |-
      De zorgdrager brengt de archiefbescheiden die niet voor vernietiging in aanmerking komen en ouder zijn dan twintig
      jaar over naar een archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel12
  - number: '12.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld, die bij de overbrenging van
      archiefbescheiden in acht dienen te worden genomen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel12
  - number: '13.1'
    text: |-
      De zorgdrager kan archiefbescheiden die niet voor vernietiging in aanmerking komen en jonger zijn dan twintig jaar
      naar een archiefbewaarplaats overbrengen, wanneer naar het oordeel van de beheerder van de archiefbewaarplaats
      voldoende aanleiding bestaat hiervoor ruimte beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel13
  - number: '13.2'
    text: |-
      Een afwijzende beslissing krachtens het eerste lid kan door degene aan wie de beheerder onmiddellijk ondergeschikt
      is worden herzien.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel13
  - number: '13.3'
    text: |-
      Indien archiefbescheiden ouder dan twintig jaar door het overheidsorgaan nog veelvuldig worden gebruikt
      of geraadpleegd kan op verzoek van de zorgdrager machtiging tot opschorting van de overbrenging van die
      archiefbescheiden worden verleend door Onze minister dan wel, indien het archiefbescheiden betreft voor de bewaring
      waarvan een andere dan een rijksarchiefbewaarplaats is aangewezen, door gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel13
  - number: '13.4'
    text: |-
      De in het derde lid bedoelde machtiging, waaraan voorwaarden kunnen worden verbonden, wordt verleend voor een
      periode van ten hoogste tien jaar, na afloop waarvan verlenging kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel13
  - number: '14'
    text: |-
      De archiefbescheiden die in een archiefbewaarplaats berusten zijn, behoudens het bepaalde in de
      [artikelen 15][ref1], [16][ref2] en [17][ref3], openbaar. Ieder is, behoudens de beperkingen die voortvloeien
      uit het in die artikelen bepaalde, bevoegd die archiefbescheiden kosteloos te raadplegen en daarvan of daaruit
      afbeeldingen, afschriften, uittreksels en bewerkingen te maken of op zijn kosten te doen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel17
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '16'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007376
        artikel: '17'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      Bij de overbrenging van de in [artikel 1, onder ][ref1], bedoelde archiefbescheiden kan de zorgdrager, na advies
      van de beheerder van de archiefbewaarplaats, slechts beperkingen aan de openbaarheid stellen voor een bepaalde
      termijn en met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
        hoofdstuk: I
  - number: 15.1.a
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: 15.1.b
    text: het belang van de Staat of zijn bondgenoten;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: 15.1.c
    text: |-
      het anderszins voorkomen van onevenredige bevoordeling of benadeling van betrokken natuurlijke personen of
      rechtspersonen danwel van derden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: '15.2'
    text: |-
      De zorgdrager ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden kan, na de in het eerste
      lid bedoelde overbrenging, niet alsnog beperkingen als bedoeld in het eerste lid stellen, tenzij zich na het
      tijdstip van overbrenging omstandigheden hebben voorgedaan die, waren zij op dat tijdstip bekend geweest, tot het
      stellen van beperkingen aan de openbaarheid ingevolge het eerste lid zouden hebben geleid.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: '15.3'
    text: |-
      De zorgdrager ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden, kan, gehoord degene op
      wiens last de archiefbescheiden zijn overgebracht, de ingevolge het eerste of het tweede lid aan de openbaarheid
      gestelde beperkingen opheffen, dan wel ten aanzien van een verzoeker buiten toepassing laten, indien het belang van
      de gestelde beperking niet opweegt tegen diens belang tot raadpleging of gebruik van de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: '15.4'
    text: |-
      Ingevolge het eerste of het tweede lid aan de openbaarheid gestelde beperkingen hebben geen betrekking op
      archiefbescheiden die ouder zijn dan vijfenzeventig jaar, tenzij door Onze minister dan wel, indien het
      archiefbescheiden betreft voor de bewaring waarvan een andere dan een rijksarchiefbewaarplaats is aangewezen, door
      gedeputeerde staten anders wordt beslist.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: '15.5'
    text: |-
      Het derde lid is niet van toepassing op archiefbescheiden aan de openbaarheid waarvan beperkingen zijn gesteld met
      het oog op het belang van de Staat of zijn bondgenoten.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: '15.6'
    text: |-
      In geval van archiefbescheiden die het belang van de Staat of zijn bondgenoten betreffen vindt het vierde lid
      slechts toepassing voor zover de ministerraad niet anders beslist.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: '15.7'
    text: |-
      Met betrekking tot de in het vijfde lid bedoelde archiefbescheiden zijn van toepassing de regelingen inzake
      het recht op informatie die zouden gelden indien de archiefbescheiden niet naar een archiefbewaarplaats waren
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15
  - number: 15a.1
    text: |-
      [Artikel 15, eerste lid, aanhef en onder c][ref1], is niet van toepassing voorzover in de archiefbescheiden milieu-
      informatie als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref2] is neergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '19'
  - number: 15a.2
    text: |-
      Voorzover in de in de archiefbewaarplaats berustende archiefbescheiden milieu-informatie als bedoeld
      in [artikel 19.1a van de Wet milieubeheer][ref1] is neergelegd, laat de zorgdrager, in afwijking van
      [artikel 15, derde lid][ref2], de ingevolge [artikel 15, eerste lid, aanhef en onder c, of tweede lid][ref3], aan
      de openbaarheid gestelde beperkingen ten aanzien van een verzoeker buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel15
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '15'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007376
        artikel: '15'
        hoofdstuk: II
  - number: 15a.3
    text: |-
      In afwijking van [artikel 15, eerste lid, onder a, en tweede lid in verbinding met het eerste lid, onder a][ref1],
      worden geen beperkingen aan de openbaarheid gesteld voorzover in de archiefbescheiden neergelegde milieu-informatie
      als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref2] betrekking heeft op emissies in het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '19'
  - number: 15a.4
    text: |-
      Voorzover in de in de archiefbewaarplaats berustende archiefbescheiden milieu-informatie die betrekking heeft
      op emissies in het milieu is neergelegd, laat de zorgdrager in afwijking van [artikel 15, derde lid][ref1],
      ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden, de ingevolge
      [artikel 15, eerste lid, onder a, of tweede lid in verbinding met het eerste lid, onder a][ref2], aan de
      openbaarheid gestelde beperkingen ten aanzien van een verzoeker buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel15
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '15'
        hoofdstuk: II
  - number: '16.1'
    text: |-
      De openbaarheid van de in [artikel 1, onder ][ref1], bedoelde archiefbescheiden kan worden beperkt bij de
      desbetreffende overeenkomsten en beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
        hoofdstuk: I
  - number: '16.2'
    text: |-
      Indien deze archiefbescheiden uit anderen hoofde in een archiefbewaarplaats zijn opgenomen om daar te berusten,
      kan de zorgdrager beperkingen aan de openbaarheid stellen. Het in artikel 15 bepaalde is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel16
  - number: '17.1'
    text: |-
      De beheerder van een archiefbewaarplaats stelt de daar berustende archiefbescheiden aan de verzoeker ter
      raadpleging of gebruik beschikbaar met inachtneming van de aan de openbaarheid gestelde beperkingen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel17
  - number: '17.2'
    text: |-
      De beheerder is bevoegd een verzoek tot raadpleging of gebruik van archiefbescheiden af te wijzen, indien naar
      zijn oordeel de toestand van de archiefbescheiden zich daartegen verzet of deze aan de verzoeker niet veilig kunnen
      worden toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel17
  - number: '17.3'
    text: |-
      Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek tot raadpleging of gebruik vindt schriftelijk
      plaats. In geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom
      vraagt. De verzoeker wordt op deze mogelijkheid gewezen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel17
  - number: '17.4'
    text: |-
      Indien de aard of de mate van raadpleging of gebruik van archiefbescheiden een ernstige bedreiging vormt voor hun
      toestand, is de beheerder bevoegd te bepalen dat in de plaats van die archiefbescheiden reprodukties, niet zijnde
      archiefbescheiden als bedoeld in [artikel 1, onder ][ref1], ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
        hoofdstuk: I
  - number: '18.1'
    text: |-
      De beheerder van een archiefbewaarplaats is verplicht archiefbescheiden voor een bepaalde tijd uit te lenen aan het
      overheidsorgaan, waaronder de bescheiden, indien zij niet naar een archiefbewaarplaats waren overgebracht, zouden
      berusten, tenzij naar zijn oordeel de toestand van de archiefbescheiden zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel18
  - number: '18.2'
    text: |-
      De beheerder van een archiefbewaarplaats is, met inachtneming van de aan de openbaarheid gestelde beperkingen,
      bevoegd archiefbescheiden voor een bepaalde tijd uit te lenen aan een instelling, mits een deskundig beheer en een
      veilige bewaring zijn gewaarborgd. Aan een zodanige uitlening kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel18
  - number: '18.3'
    text: |-
      De beheerder is bevoegd een verzoek tot uitlening als bedoeld in het tweede lid af te wijzen, indien naar zijn
      oordeel de toestand van de archiefbescheiden zich daartegen verzet of deze aan de verzoeker niet veilig kunnen
      worden toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel18
  - number: '18.4'
    text: |-
      Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek tot raadpleging of gebruik vindt schriftelijk
      plaats. In geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom
      vraagt. De verzoeker wordt op deze mogelijkheid gewezen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel18
  - number: '18.5'
    text: |-
      Indien de aard of de mate van raadpleging of gebruik van de archiefbescheiden bij de in het tweede lid bedoelde
      uitlening een ernstige bedreiging vormt voor hun toestand, is de beheerder bevoegd te bepalen dat in de plaats van
      die archiefbescheiden reprodukties worden uitgeleend.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel18
  - number: '18.6'
    text: De aan de uitlening verbonden kosten kunnen de verzoeker in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel18
  - number: '19'
    text: |-
      De zorgdrager stelt, indien de kosten, bedoeld in de [artikelen 14][ref1] en [18, zesde lid][ref2], in rekening
      worden gebracht, regels omtrent die kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel18
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '14'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '18'
        hoofdstuk: II
  - number: '20'
    text: |-
      De beheerder van een archiefbewaarplaats is bevoegd afschriften af te geven van een authentieke akte die volgens
      deze wet door hem bewaard moet worden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel20
  - number: '21.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de duurzaamheid van
      door overheidsorganen op te maken archiefbescheiden, omtrent de bouw, verbouwing, inrichting en verandering
      van inrichting van archiefruimten en archiefbewaarplaatsen, alsmede omtrent de ingebruikneming van gebouwen of
      gedeelten van gebouwen als archiefruimte of archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel21
  - number: '21.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het in geordende en
      toegankelijke staat brengen en bewaren van archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de opleiding tot en het verkrijgen
      van diploma's in de archivistiek.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel22
  - number: '23.1'
    text: |-
      De Eerste en de Tweede Kamer der Staten-Generaal, de andere Hoge Colleges van Staat, de directeur van het Kabinet
      der Koningin en Onze ministers dragen zorg voor hun archiefbescheiden, voor zover deze niet zijn overgebracht naar
      een rijksarchiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel23
  - number: '23.2'
    text: |-
      Onze commissarissen in de provincie dragen zorg voor de archiefbescheiden die verband houden met de taken, bedoeld
      in [artikel 182, eerste en tweede lid, van de Provinciewet][ref1], voor zover deze archiefbescheiden niet zijn
      overgebracht naar een rijksarchiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel182
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '182'
  - number: '23.3'
    text: Onze minister draagt tevens zorg voor de archiefbescheiden, die in de rijksarchiefbewaarplaatsen berusten.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel23
  - number: '23.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de wijze waarop de in het eerste lid bedoelde zorg
      wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel23
  - number: '24.1'
    text: |-
      Onze minister is bevoegd overheidsorganen als bedoeld in de [artikelen 23, eerste lid en tweede lid][ref1], en
      [41, eerste lid][ref2], er op te wijzen dat zij dienen te voldoen aan het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '41'
        hoofdstuk: VII
  - number: '24.2'
    text: |-
      Onze minister is bevoegd tot toepassing van bestuursdwang in geval een overheidsorgaan een aanwijzing als bedoeld
      in het eerste lid niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel24
  - number: '24.3'
    text: |-
      Onze minister maakt van zijn bevoegdheid, genoemd in het tweede lid, geen gebruik dan na overleg met het betrokken
      overheidsorgaan.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel24
  - number: '24.4'
    text: |-
      De bevoegdheid, genoemd in het tweede lid, geldt niet ten aanzien van de Eerste en Tweede Kamer der Staten-
      Generaal, de andere Hoge Colleges van Staat en het Kabinet der Koningin.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel24
  - number: '25.1'
    text: |-
      Er is onder de bevelen van Onze minister een rijksarchiefdienst, aan het hoofd waarvan staat de algemene
      rijksarchivaris, die in het bezit dient te zijn van een diploma archivistiek.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25
  - number: '25.2'
    text: 'De rijksarchiefdienst heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25
  - number: 25.2.a
    text: het beheer van de in de rijksarchiefbewaarplaatsen berustende archiefbescheiden;
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25
  - number: 25.2.b
    text: het verrichten van bij of krachtens algemene maatregel van bestuur of door Onze minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25
  - number: 25a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de wet bepaalde ten aanzien van het beheer van de
      archiefbescheiden, bedoeld in de [artikelen 23, eerste en tweede lid][ref1], en [41, eerste lid][ref2], zijn belast
      de bij besluit van Onze minister als hoofdinspecteur en inspecteurs aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '41'
        hoofdstuk: VII
  - number: 25a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25a
  - number: 25a.3
    text: |-
      De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:19 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 25a.4
    text: |-
      Indien een toezichthouder met toepassing van [artikel 5:15 van de Algemene wet bestuursrecht][ref1]
      een ruimte betreedt waarin de in de [artikelen 23, eerste of tweede lid][ref2], dan wel
      [artikel 41, eerste lid][ref3], bedoelde archiefbescheiden worden bewaard, dan wel met toepassing van
      [artikel 5:18 van de Algemene wet bestuursrecht][ref4] inzage vordert van die archiefbescheiden, neemt hij de
      voorschriften ten aanzien van de beveiliging van geheimen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '23'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007376
        artikel: '41'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 25b.1
    text: |-
      De hoofdinspecteur, bedoeld in [artikel 25a, eerste lid][ref1], doet aan het overheidsorgaan mededeling van de
      bevindingen van het toezicht en van de voorzieningen die naar zijn oordeel dienen te worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: 25a
        hoofdstuk: III
  - number: 25b.2
    text: |-
      Hij brengt jaarlijks voor 1 juli aan Onze minister schriftelijk verslag uit van de bevindingen van het toezicht
      gedurende het afgelopen kalenderjaar. Onze minister legt dit verslag, vergezeld van zijn standpunt, over aan de
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel25b
  - number: '26.1'
    text: |-
      Te 's-Gravenhage is gevestigd de algemene rijksarchiefbewaarplaats, welke is bestemd voor de bewaring van de
      archiefbescheiden der overheidsorganen, waarvan de functies zich over het gehele rijk uitstrekken of hebben
      uitgestrekt. De algemene rijksarchivaris is daarvan de beheerder.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel26
  - number: '26.2'
    text: |-
      In de hoofdplaats van elke provincie is gevestigd een rijksarchiefbewaarplaats, welke is bestemd voor de bewaring
      van de archiefbescheiden van de provinciale organen. Voorts is de rijksarchiefbewaarplaats in de hoofdplaats van
      een provincie bestemd voor de bewaring van de archiefbescheiden van de in die provincie gevestigde organen van
      het rijk, van de voormalige provinciale en departementale besturen en van de in [artikel 41, eerste lid][ref1],
      bedoelde overheidsorganen, waarvan de functies zich niet over het gehele rijk uitstrekken of hebben uitgestrekt.
      Een rijksarchivaris, die in het bezit dient te zijn van een diploma archivistiek, is daarvan de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '41'
        hoofdstuk: VII
  - number: '26.3'
    text: |-
      Bij koninklijk besluit kunnen andere rijksarchiefbewaarplaatsen worden aangewezen of gevestigd dan de in het eerste
      en tweede lid bedoelde.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel26
  - number: '26.4'
    text: |-
      Bij koninklijk besluit kan worden bepaald, dat archiefbescheiden van overheidsorganen, waarvan de functies zich
      over het gehele rijk uitstrekken of hebben uitgestrekt, worden bewaard in de rijksarchiefbewaarplaats in de
      hoofdplaats van de provincie, waarin deze overheidsorganen gevestigd zijn of zijn geweest.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel26
  - number: '26.5'
    text: |-
      Bij koninklijk besluit kan worden bepaald, dat archiefbescheiden van overheidsorganen, waarvan de functies zich
      over meer dan een provincie doch niet over het gehele rijk uitstrekken of hebben uitgestrekt, worden bewaard in de
      algemene rijksarchiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel26
  - number: '26.6'
    text: |-
      Omtrent de bewaring in rijksarchiefbewaarplaatsen van andere dan in het eerste en tweede lid bedoelde
      archiefbescheiden beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel26
  - number: '26.7'
    text: Onze minister stelt de verdere inrichting van de rijksarchiefdienst vast.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel26
  - number: '27.1'
    text: |-
      Overeenkomstig een door provinciale staten vast te stellen verordening dragen gedeputeerde staten zorg voor de
      archiefbescheiden van de provinciale organen, voor zover deze archiefbescheiden niet zijn overgebracht naar een
      archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel27
  - number: '27.2'
    text: De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel27
  - number: '28.1'
    text: |-
      Ten aanzien van het beheer van de archiefbescheiden, bedoeld in [artikel 27][ref1], is, onder de bevelen van
      gedeputeerde staten, met het toezicht op de naleving van het bepaalde bij of krachtens deze wet belast de
      provinciale inspecteur. Met betrekking tot dit toezicht op de naleving stellen provinciale staten een verordening
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel27
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '27'
        hoofdstuk: IV
  - number: '28.2'
    text: |-
      De provinciale inspecteur, die in het bezit dient te zijn van een diploma archivistiek, wordt door provinciale
      staten benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel28
  - number: '29.1'
    text: |-
      Gedeputeerde staten kunnen Onze minister voorstellen doen omtrent het beheer van de in een rijksarchiefbewaarplaats
      berustende archiefbescheiden van de provinciale organen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel29
  - number: '29.2'
    text: Onze minister wijkt van dat voorstel niet af dan na overleg met gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel29
  - number: '30.1'
    text: |-
      Overeenkomstig een door de gemeenteraad vast te stellen verordening, welke aan gedeputeerde staten wordt
      medegedeeld, dragen burgemeester en wethouders zorg voor de archiefbescheiden van de gemeentelijke organen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel30
  - number: '30.2'
    text: De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel30
  - number: '30.3'
    text: |-
      Onze minister kan in bijzondere gevallen een subsidie verstrekken voor de kosten van het beheer van de
      in de gemeentelijke archiefbewaarplaats berustende archiefbescheiden, indien de aard of de omvang van de
      archiefbescheiden naar zijn oordeel daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel30
  - number: '30.4'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] op de subsidie, bedoeld in het derde lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '31'
    text: |-
      Voor de bewaring van de op grond van [artikel 12, eerste lid][ref1], en [artikel 13, eerste lid][ref2], over te
      brengen archiefbescheiden van de gemeentelijke organen wijst de gemeenteraad een gemeentelijke archiefbewaarplaats
      aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: '32.1'
    text: |-
      De gemeentelijke archiefbewaarplaats wordt beheerd door een gemeentearchivaris, die in het bezit dient te zijn van
      een diploma archivistiek of, zo geen zodanige archivaris mocht zijn benoemd, door de secretaris.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel32
  - number: '32.2'
    text: |-
      Ten aanzien van het beheer van de archiefbescheiden van de gemeentelijke organen, voorzover deze archiefbescheiden
      niet zijn overgebracht naar een archiefbewaarplaats, is, onder de bevelen van burgemeester en wethouders, met het
      toezicht op de naleving van het bepaalde bij of krachtens deze wet belast de gemeentearchivaris. Met betrekking tot
      dit toezicht stelt de gemeenteraad een verordening vast, welke aan gedeputeerde staten wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel32
  - number: '32.3'
    text: De gemeentearchivaris wordt door de gemeenteraad benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel32
  - number: '33.1'
    text: |-
      Overeenkomstig een door provinciale staten vast te stellen verordening oefenen gedeputeerde staten toezicht uit op
      de aan burgemeester en wethouders in [artikel 30, eerste lid][ref1], opgedragen zorg voor de archiefbescheiden. Zij
      bedienen zich daartoe van de in [artikel 28][ref2] genoemde provinciale inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel28
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '30'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '28'
        hoofdstuk: IV
  - number: '33.2'
    text: |-
      Burgemeester en wethouders onderwerpen de plannen betreffende bouw, verbouwing, inrichting of verandering
      van inrichting van een archiefbewaarplaats of tot ingebruikneming van gebouwen of gedeelten van gebouwen als
      archiefbewaarplaats, aan de goedkeuring van gedeputeerde staten. Goedkeuring kan worden onthouden wegens strijd met
      het recht of het algemeen belang. Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een besluit
      tot verdaging van de beslissing omtrent goedkeuring heeft niet tot gevolg dat een besluit tot goedkeuring geacht
      wordt te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel33
  - number: '33.3'
    text: |-
      De kosten, verbonden aan de uitoefening van het in het eerste lid bedoelde toezicht, komen ten laste van de
      provincie.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel33
  - number: '34.1'
    text: |-
      Gedeputeerde staten zijn bevoegd tot toepassing van bestuursdwang ingeval burgemeester en wethouders niet aan de in
      [artikel 30, eerste lid][ref1], genoemde verplichting voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel30
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '30'
        hoofdstuk: V
  - number: '34.2'
    text: |-
      Gedeputeerde staten maken van hun bevoegdheid, genoemd in het eerste lid, geen gebruik dan na overleg met de
      betrokken overheidsorganen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel34
  - number: '35.1'
    text: |-
      Overeenkomstig een door het bestuur vast te stellen verordening, welke aan gedeputeerde staten wordt medegedeeld,
      draagt het dagelijks bestuur zorg voor de archiefbescheiden van de organen van het waterschap.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel35
  - number: '35.2'
    text: De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van het waterschap.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel35
  - number: '35.3'
    text: |-
      Onze minister kan in bijzondere gevallen een subsidie verstrekken voor de kosten van het beheer van de in de
      waterschapsarchiefbewaarplaats berustende archiefbescheiden, indien de aard of de omvang van de archiefbescheiden
      naar zijn oordeel daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel35
  - number: '35.4'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] op de subsidie, bedoeld in het derde lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '36'
    text: |-
      Voor de bewaring van de op grond van [artikel 12, eerste lid][ref1], en [artikel 13, eerste lid][ref2], over te
      brengen archiefbescheiden van de organen van het waterschap wijst het bestuur een archiefbewaarplaats aan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: '37.1'
    text: |-
      De archiefbewaarplaats wordt beheerd door een waterschapsarchivaris, die in het bezit dient te zijn van een diploma
      archivistiek of, zo geen zodanige archivaris mocht zijn benoemd, door de secretaris.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel37
  - number: '37.2'
    text: |-
      Ten aanzien van het beheer van de archiefbescheiden van de organen van het waterschap, voorzover deze
      archiefbescheiden niet zijn overgebracht naar een archiefbewaarplaats, is, onder de bevelen van het
      dagelijks bestuur, met het toezicht op de naleving van het bepaalde bij of krachtens deze wet belast de
      waterschapsarchivaris. Met betrekking tot dit toezicht stelt het bestuur een verordening vast, welke aan
      gedeputeerde staten wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel37
  - number: '37.3'
    text: De waterschapsarchivaris wordt door het bestuur benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel37
  - number: '38.1'
    text: |-
      Overeenkomstig een door provinciale staten vast te stellen verordening oefenen gedeputeerde staten toezicht uit
      op de aan het dagelijks bestuur in [artikel 35, eerste lid][ref1], opgedragen zorg voor de archiefbescheiden. Zij
      bedienen zich daartoe van de in [artikel 28][ref2] genoemde provinciale inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel28
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '35'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '28'
        hoofdstuk: IV
  - number: '38.2'
    text: |-
      Het dagelijks bestuur onderwerpt de plannen betreffende bouw, verbouwing, inrichting of verandering van inrichting
      van een archiefbewaarplaats of tot ingebruikneming van gebouwen of gedeelten van gebouwen als archiefbewaarplaats,
      aan de goedkeuring van gedeputeerde staten. Goedkeuring kan worden onthouden wegens strijd met het recht of het
      algemeen belang. Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een besluit tot verdaging
      van de beslissing omtrent goedkeuring heeft niet tot gevolg dat een besluit tot goedkeuring geacht wordt te zijn
      genomen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel38
  - number: '38.3'
    text: |-
      De kosten, verbonden aan de uitoefening van het in het eerste lid bedoelde toezicht, komen ten laste van de
      provincie.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel38
  - number: '39.1'
    text: |-
      Gedeputeerde staten zijn bevoegd tot toepassing van bestuursdwang in geval het dagelijks bestuur niet aan de in
      [artikel 35, eerste lid][ref1], genoemde verplichting voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel35
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '35'
        hoofdstuk: VI
  - number: '39.2'
    text: |-
      Gedeputeerde staten maken van hun bevoegdheid, genoemd in het eerste lid, geen gebruik dan na overleg met de
      betrokken overheidsorganen.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel39
  - number: '40.1'
    text: |-
      Een regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] (*Stb*. 1989, 571) houdt tevens een
      voorziening in omtrent de zorg voor de archiefbescheiden van bij die regeling ingestelde openbare lichamen of
      gemeenschappelijke organen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '40.2'
    text: Deze voorziening wordt getroffen zoveel mogelijk overeenkomstig de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel40
  - number: '40.3'
    text: |-
      Zolang bij een gemeenschappelijke regeling niet is voldaan aan de verplichting tot het treffen van een voorziening
      als bedoeld in het eerste lid, zijn van overeenkomstige toepassing de bepalingen die terzake gelden voor de
      gemeente dan wel, indien een provincie aan de regeling deelneemt, voor de provincie, waar het ingestelde lichaam of
      orgaan is gevestigd.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel40
  - number: '41.1'
    text: |-
      Met de zorg voor de archiefbescheiden van andere dan in de voorafgaande artikelen bedoelde overheidsorganen, voor
      zover de archiefbescheiden niet zijn overgebracht naar een archiefbewaarplaats, is belast:
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel41
  - number: 41.1.a
    text: 'het dagelijks bestuur of in de gevallen, dat er geen dagelijks bestuur is, het bestuur:'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel41
  - number: 41.1.b
    text: 'in andere gevallen: de persoon met enig openbaar gezag bekleed.'
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel41
  - number: '41.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de wijze waarop de in de in het eerste lid
      bedoelde zorg wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel41
  - number: '41.3'
    text: |-
      De kosten, verbonden aan de uitoefening van de in het eerste lid bedoelde zorg, komen ten laste van het
      desbetreffende overheidsorgaan.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel41
  - number: '42.1'
    text: |-
      Hij die aan de bij [artikel 11, eerste lid][ref1], gestelde verplichting niet voldoet, wordt gestraft met geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel11
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '11'
        hoofdstuk: II
  - number: '42.2'
    text: Het feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel42
  - number: '43'
    text: De [Archiefwet 1962](onbekend) (*Stb.* 313) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel43
  - number: '44'
    text: |-
      De voor de inwerkingtreding van deze wet op grond van de [artikelen 7](onbekend) en [7](onbekend) aan de
      openbaarheid gestelde beperkingen blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel44
  - number: '45'
    text: |-
      De onder de overheidsorganen berustende archiefbescheiden die op het moment van de inwerkingtreding van deze wet
      ouder zijn dan twintig jaar, worden op last van de zorgdrager binnen een tijdvak van tien jaar na inwerkingtreding
      van deze wet naar een archiefbewaarplaats overgebracht.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel45
  - number: '46.1'
    text: |-
      De op grond van het koninklijk besluit van 28 augustus 1919 (*Stb.* 547) tussen het Rijk en gemeenten getroffen
      regelingen met betrekking tot de inbewaringgeving van archiefbescheiden van de rechtbanken in eerste aanleg en
      van de vredegerechten blijven gehandhaafd, totdat deze regelingen na overleg met burgemeester en wethouders van de
      desbetreffende gemeente worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel46
  - number: '46.2'
    text: |-
      De op grond van de koninklijke besluiten van 19 april 1929 (*Stb.* 171), 31 mei 1929 (*Stb.* 269), 6 juli 1929
      ( *Stb.* 381) en 24 november 1932 (*Stb.* 560) tussen het Rijk en de gemeenten getroffen regelingen met betrekking
      tot de inbewaringgeving van de in die besluiten bedoelde archiefbescheiden blijven gehandhaafd, totdat deze
      regelingen zijn vervangen door een regeling tot de vervreemding van die archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel46
  - number: '46.3'
    text: |-
      De ingevolge de in het tweede lid genoemde koninklijke besluiten naar een rijksarchiefbewaarplaats
      overgebrachte archiefbescheiden worden, op verzoek van de desbetreffende gemeente tot vervreemding van die
      archiefbescheiden, aan die gemeente overgedragen, indien zij dientengevolge komen te berusten in een ingevolge
      [artikel 33, tweede lid][ref1], goedgekeurde archiefbewaarplaats, beheerd door een gemeentearchivaris die is
      benoemd overeenkomstig het in [artikel 32, derde lid][ref2], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel32
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '33'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '32'
        hoofdstuk: V
  - number: '47'
    text: |-
      Andere dan de in [artikel 46][ref1] bedoelde inbewaringgevingen blijven in stand tot het moment dat zij na overleg
      tussen de betrokken overheidslichamen zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel46
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '46'
        hoofdstuk: IX
  - number: '48'
    text: |-
      De ingevolge [artikel 3 van het Archiefbesluit][ref1] (*Stb.* 1968, 200), zoals dit luidde voor de
      inwerkingtreding van deze wet, vastgestelde lijsten van voor vernietiging in aanmerking komende archiefbescheiden
      blijven gehandhaafd totdat zij zijn vervangen door op grond van [artikel 5][ref2] van deze wet vastgestelde
      selectielijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '5'
        hoofdstuk: II
  - number: '49'
    text: |-
      De machtigingen, verleend op grond van [artikel 20 van het Archiefbesluit][ref1], zoals dit luidde voor
      de inwerkingtreding van deze wet, blijven gelden totdat zij zijn vervangen door een machtiging afgegeven
      overeenkomstig het in [artikel 13, derde lid][ref2], van deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
        hoofdstuk: II
  - number: '85'
    text: |-
      Bij plaatsing in het *Staatsblad* wordt de in deze wet voorkomende aanduiding "19.." vervangen door het jaartal van
      het *Staatsblad* waarin deze wet wordt geplaatst en worden de drie puntjes in de in deze wet voorkomende aanduiding
      (*Stb.* ...) vervangen door het nummer van het *Staatsblad* waarin deze wet wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel85
  - number: '86'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel86
  - number: '87'
    text: |-
      Deze wet kan worden aangehaald als Archiefwet met vermelding van het jaartal van het *Staatsblad* waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007376/2005-07-08#Artikel87
