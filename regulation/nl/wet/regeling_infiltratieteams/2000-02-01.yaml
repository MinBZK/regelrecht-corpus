        artikel: '77'
  - number: '9'
    text: |-
      1 Indien geen van de infiltranten beschikt over de voor de uitvoering van het bevel tot infiltratie vereiste kennis
      en vaardigheden, kan op advies van de eenheid, bedoeld in [artikel 4, eerste lid][ref1], een ambtenaar van politie
      die in de functie van infiltrant lid is geweest van een infiltratieteam en wel beschikt over de voor de uitvoering
      van het bevel vereiste kennis en vaardigheden, worden belast met de uitvoering van dat bevel.

      2 Indien geen van de infiltranten of ambtenaren van politie als bedoeld in het eerste lid, beschikt over de
      voor de uitvoering van het bevel vereiste kennis en vaardigheden, kan op advies van de eenheid, bedoeld in
      [artikel 4][ref2], een andere ambtenaar van politie worden belast met de uitvoering van het bevel, indien deze
      ambtenaar van politie beschikt over de voor de uitvoering van het bevel vereiste kennis en vaardigheden.

      3 Bij toepassing van het eerste of het tweede lid wordt de ambtenaar van politie, belast met de uitvoering van een
      bevel, gedurende de periode die nodig is voor de uitvoering van het bevel, begeleid door een begeleider.


      [ref1]: https://wetten.overheid.nl/BWBR0011086#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011086#Artikel4
