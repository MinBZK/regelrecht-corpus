  - number: '2'
    text: |-
      1 Er zijn ten minste vijf regionale infiltratieteams als bedoeld in
      [artikel 5 van het Besluit beheer regionale politiekorpsen][ref1].

      2 Er is een landelijk infiltratieteam, ondergebracht bij het Korps landelijke politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel5
    url: https://wetten.overheid.nl/BWBR0011086/2000-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006560
        artikel: '5'
  - number: '3'
    text: |-
      1 Onverminderd de taakuitvoering van de regionale infiltratieteams, zijn de leden van het landelijk
      infiltratieteam, bedoeld in [artikel 2, tweede lid][ref1], belast met de uitvoering van een bevel tot infiltratie
      of de begeleiding van een burgerinfiltrant, voorzover:

      a. deze werkzaamheden worden verricht ter uitvoering van een internationaal rechtshulpverzoek;

      b. deze werkzaamheden worden verricht in het kader van een opsporingsonderzoek dat wordt uitgevoerd door een
      rechercheonderdeel van het Korps landelijke politiediensten;

      c. de inzet van het landelijk infiltratieteam, gezien de taakuitvoering van de regionale infiltratieteams, gewenst
      is.

      2 De leden van het landelijk infiltratieteam kunnen worden belast met de uitvoering van een bevel tot pseudo-koop
      of -dienstverlening of stelselmatige inwinning van informatie of met de begeleiding van een burgerpseudo-koper
      of -dienstverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0011086#Artikel2
    url: https://wetten.overheid.nl/BWBR0011086/2000-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011086
        artikel: '2'
  - number: '4'
    text: |-
      1 Er is een eenheid bij het Korps landelijke politiediensten die, mede ten behoeve van de regionale politiekorpsen,
      is belast met:

      a. de selectie en opleiding van kandidaat-leden van een infiltratieteam;

      b. algemene en bijzondere ondersteuning in het kader van de taakuitvoering van infiltratieteams, waaronder het
      verzorgen van tijdelijke identiteiten en fictieve rechtspersonen;

      c. de coördinatie van internationale rechtshulpverzoeken tot infiltratie, pseudo-koop of -dienstverlening of
      stelselmatige inwinning van informatie;

      d. de registratie van leden van een infiltratieteam alsmede de registratie van bevelen tot infiltratie.

      2 Ten behoeve van de taakuitvoering van de eenheid, bedoeld in het eerste lid, kunnen ambtenaren van politie
      werkzaam bij de regionale politiekorpsen voor bepaalde tijd worden geplaatst bij deze eenheid.
    url: https://wetten.overheid.nl/BWBR0011086/2000-02-01#Artikel4
  - number: '5'
    text: |-
      1 Een infiltratieteam is samengesteld uit:

      a. een leider van het infiltratieteam;

      b. ten minste vier infiltranten;

      c. ten minste vier begeleiders.

      2 De werving van kandidaat-leden van een infiltratieteam geschiedt onder verantwoordelijkheid van de korpsbeheerder
      van het beheerskorps.

      3 De selectie van de kandidaat-leden van een infiltratieteam voor de in [artikel 7][ref1] bedoelde
      vervolgopleidingen, geschiedt door de eenheid, bedoeld in [artikel 4, eerste lid][ref2].

      4 De opleiding van de kandidaat-leden van een infiltratieteam geschiedt door het Landelijk selectie- en
      opleidingsinstituut politie, bedoeld in [artikel 2, van de LSOP-wet][ref3], in samenwerking met de eenheid, bedoeld
      in [artikel 4, eerste lid][ref4].

      5 De aanstelling van de leden van een infiltratieteam geschiedt door de korpsbeheerder van het beheerskorps.


      [ref1]: https://wetten.overheid.nl/BWBR0011086#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011086#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006942#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011086#Artikel4
    url: https://wetten.overheid.nl/BWBR0011086/2000-02-01#Artikel5
