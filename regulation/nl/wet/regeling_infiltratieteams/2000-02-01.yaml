preamble:
  text: |-
    Gelet op artikel 48, eerste lid, van de Politiewet 1993 en artikel 5, vijfde lid, en artikel 12 van het Besluit
    beheer regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0011086/2000-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            infiltratieteam:

              een eenheid als bedoeld in [artikel 5 van het Besluit beheer regionale politiekorpsen][ref1] dan wel het
      landelijk infiltratieteam, bedoeld in [artikel 2, tweede lid][ref2];



            b
            bevel tot infiltratie:

              een bevel als bedoeld in [artikel 126h, eerste lid][ref3], of
      [artikel 126p, eerste lid, Wetboek van Strafvordering][ref4];



            c
            bevel tot pseudo-koop of -dienstverlening:

              een bevel als bedoeld in [artikel 126i, eerste lid][ref5], of
      [artikel 126q, eerste lid, van het Wetboek van Strafvordering][ref6];



            d
            bevel tot stelselmatige inwinning van informatie:

              een bevel als bedoeld in [artikel 126j, eerste lid][ref7], of
      [artikel 126qa, eerste lid, van het Wetboek van Strafvordering][ref8];



            e
            burgerinfiltrant:

              ** een persoon als bedoeld in [artikel 126w, eerste lid][ref9], of
      [artikel 126x, eerste lid, van het Wetboek van Strafvordering][ref10];



            f
            burgerpseudo-koper of -dienstverlener:

              een persoon als bedoeld in [artikel 126ij, eerste lid][ref11], of
      [artikel 126z, eerste lid, van het Wetboek van Strafvordering][ref12];



            g
            infiltrant:

              een ambtenaar van politie, belast met de uitvoering van een bevel tot infiltratie, die lid is van een
      infiltratieteam;



            h
            begeleider:

              een ambtenaar van politie, belast met de begeleiding van een infiltrant, dan wel de begeleiding van een
      burgerinfiltrant, die lid van een infiltratieteam;



            i
            leider van het infiltratieteam:

              de opsporingsambtenaar, belast met het geven van leiding aan de infiltranten en de begeleiders van een
      infiltratieteam;



            j
            beheerskorps:

              het regionale politiekorps respectievelijk het Korps landelijke politiediensten waarbij het personeel, het
      materieel en de middelen van het infiltratieteam zijn ondergebracht.


