        artikel: '4'
  - number: '6'
    text: |-
      1 De leider van het infiltratieteam draagt zorg voor het doen uitvoeren van de bevelen en geeft daartoe de nodige
      aanwijzingen aan de overige leden van het infiltratieteam. Hij neemt daarbij het bevel en de door de officier van
      justitie bepaalde kaders in acht.

      2 De begeleider geeft de infiltrant, met inachtneming van het bevel en de door de officier van justitie bepaalde
      kaders, aanwijzingen omtrent de werkzaamheden en de wijze waarop deze worden uitgevoerd. De infiltrant volgt de
      aanwijzingen van de begeleider op.

      3 De begeleider informeert de leider van het infiltratieteam omtrent de werkzaamheden van de infiltranten en de
      wijze waarop deze worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0011086/2000-02-01#Artikel6
  - number: '7'
    text: |-
      1 De leden van het infiltratieteam hebben voldaan aan de eindtermen van de in de bijlage bij deze regeling
      aangewezen vervolgopleidingen.

      2 De korpsbeheerder van het beheerskorps draagt er zorg voor dat de kennis en vaardigheden van leden van een
      infiltratieteam worden onderhouden op het niveau dat ten minste voldoet aan de eindtermen, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011086/2000-02-01#Artikel7
  - number: '8'
    text: |-
      1 De ambtenaar die in vaste dienst bij een regionaal politiekorps is aangesteld, kan ten behoeve van een
      infiltratieteam in tijdelijke dienst voor bepaalde tijd worden aangesteld bij het beheerskorps, onder de voorwaarde
      dat na afloop van de aanstelling in tijdelijke dienst de ambtenaar hernieuwd wordt aangesteld in vaste dienst bij
      het regionale politiekorps waar hij was aangesteld direct voorafgaand aan de aanstelling in tijdelijke dienst. De
      [artikelen 7][ref1], [8][ref2] en [8a, tweede lid, van het Besluit algemene rechtspositie politie][ref3] zijn niet
      van toepassing op de in de eerste volzin genoemde hernieuwde aanstelling in vaste dienst.

      2 De duur van de aanstelling in tijdelijke dienst bedraagt:

      a. ten minste vier jaar en ten hoogste zes jaar voor een aanstelling in de functie van infiltrant,

      b. ten minste vier jaar en ten hoogste acht jaar voor een aanstelling in de functie van begeleider, of

      c. ten minste vier jaar en ten hoogste tien jaar voor een aanstelling in de functie van leider van het
      infiltratieteam.

      3 Het bevoegd gezag bij wie de ambtenaar in vaste dienst is aangesteld, het bevoegd gezag van het infiltratieteam
      bij wie de ambtenaar in tijdelijke dienst wordt aangesteld, en de ambtenaar maken, voorafgaand aan de in het eerste
      lid bedoelde aanstelling in tijdelijke dienst, schriftelijke afspraken over de aanstelling in tijdelijke dienst en
      de terugkeer in vaste dienst.

      4 De in het derde lid bedoelde afspraken omvatten in ieder geval de duur van de aanstelling in tijdelijke dienst
      van de desbetreffende ambtenaar, de voorwaarden waaronder de duur van de aanstelling in tijdelijke dienst kan
      worden verkort, en de voorwaarden waaronder de in het eerste lid bedoelde hernieuwde aanstelling in vaste dienst
      plaatsvindt.

      5 Bij een hernieuwde aanstelling in vaste dienst, bedoeld in het eerste lid, wordt er van uitgegaan dat het
      dienstverband niet onderbroken is geweest.

      6 Alleen indien de ambtenaar gedurende de aanstelling in tijdelijke dienst wordt ontslagen op grond van
      [artikel 77, eerste lid, onderdeel j, van het Besluit algemene rechtspositie politie][ref4], kan de hernieuwde
      aanstelling in vaste dienst, bedoeld in het eerste lid, komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel8a
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel77
