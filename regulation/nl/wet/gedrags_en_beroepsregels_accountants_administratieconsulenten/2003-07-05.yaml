        artikel: '25'
        hoofdstuk: IV
  - number: '13'
    text: |-
      1 De accountantsverklaring kan slechts zijn:

        - een goedkeurende accountantsverklaring;
        - een accountantsverklaring met beperking;
        - een accountantsverklaring van oordeelonthouding;
        - een afkeurende accountantsverklaring.

      Uit de tekst van de accountantsverklaring moet ondubbelzinnig blijken om welke soort accountantsverklaring het
      gaat.

      2 De goedkeurende accountantsverklaring houdt in dat de Accountant-Administratieconsulent tot het oordeel is
      gekomen dat de verantwoording voldoet aan de eraan te stellen eisen.

      3 De accountantsverklaring met beperking houdt in dat bij de Accountant-Administratieconsulent bedenkingen tegen
      de verantwoording en/of onzekerheden met betrekking tot de controle zijn blijven bestaan die van materieel belang
      zijn, zodat zij in de accountantsverklaring tot uitdrukking dienen te worden gebracht.

      4 De accountantsverklaring van oordeelonthouding houdt in dat bij de Accountant-Administratieconsulent
      onzekerheden met betrekking tot de controle zijn blijven bestaan van zodanige aard en omvang dat hij geen
      goedkeurende accountantsverklaring noch een accountantsverklaring met beperking kan geven. Het is de Accountant-
      Administratieconsulent verboden zodanige accountantsverklaring te geven:

        - indien hij andere beperkingen bij zijn controle heeft aanvaard of aangebracht dan die voortvloeiende uit
      objectieve verhinderingen, of
        - indien zijn controle heeft uitgewezen dat de verantwoording niet voldoet aan de eraan te stellen eisen.

      5 De afkeurende accountantsverklaring houdt in dat de Accountant-Administratieconsulent tot het oordeel is gekomen
      dat de verantwoording niet voldoet aan de eraan te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel13
  - number: '14'
    text: |-
      1 In de accountantsverklaring met beperking moeten in geval van bedenkingen tegen de verantwoording de woorden
      ‘met uitzondering’ en in geval van onzekerheden met betrekking tot de controle de woorden ‘onder voorbehoud’ worden
      gebruikt. De bedenkingen en/of onzekerheden moeten zodanig worden omschreven dat de aard en da draagwijdte ervan
      duidelijk zijn.

      2 In de accountantsverklaring van oordeelonthouding moeten de woorden ‘geen oordeel omtrent de getrouwheid van ….
      (aanduiding van de verantwoording) als geheel’ worden gebruikt en moet worden vermeld omtrent welke aangelegenheden
      onzekerheid bestaat en welke oorzaken en/of omstandigheden tot deze onzekerheid hebben geleid.

      3 In de afkeurende accountantsverklaring moeten de woorden ‘niet getrouw’ of ‘niet juist’ worden gebruikt en moeten
      de aard en de draagwijdte van de bedenkingen worden aangegeven.

      4 Een stuk dat is afgegeven door of namens een Accountant-Administratieconsulent en dat een niet door of mede
      door hom afgelegde verantwoording bevat, wordt geacht een goedkeurende accountantsverklaring in te houden,
      tenzij het tegendeel blijkt door gebruik van een der in het eerste tot en met derde lid van dit artikel en
      in [artikel 6][ref1] voorgeschreven bewoordingen, dan wel het equivalent daarvan in de taal waarin het stuk,
      respectievelijk de verklaring, is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel6
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007117
        artikel: '6'
        hoofdstuk: II
  - number: '15'
    text: |-
      1 Het is de Accountant-Administratieconsulent slechts toegestaan voor zijn verklaring gebruik te maken van de
      verklaring van een andere accountant, indien bij de keuze van die accountant de nodige zorgvuldigheid is betracht.

      2 Indien de verklaring door een andere accountant dan een openbaar accountant is gegeven, dient de Accountant-
      Administratieconsulent door eigen aanvullend onderzoek een deugdelijke grondslag voor zijn verklaring te leggen.
      Dit geldt niet indien de betrokken accountants deel uitmaken van dezelfde economische eenheid.

      3 Het bestuur geeft nadere voorschriften voor het gebruikmaken door de Accountant-Administratieconsulent van de
      verklaring van een andere, openbaar accountant met betrekking tot een deelverantwoording en voor het melding maken
      door de Accountant-Administratieconsulent in zijn verklaring van de verklaring van een andere, openbaar accountant.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel15
  - number: '16'
    text: |-
      Het is de Accountant-Administratieconsulent verboden in zijn accountantsverklaring melding te maken van
      mededelingen van anderen dan openbare accountants, tenzij de vermelding noodzakelijk is voor de motivering van de
      accountantsverklaring. In dit geval dienen de bewoordingen van de accountantsverklaring met beperking of van de
      accountantsverklaring van oordeelonthouding te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel16
  - number: '17'
    text: |-
      1 De Accountant-Administatieconsulent is gehouden aangaande een door hem gecontroleerde, beoordeelde of
      samengestelde jaarrekening respectievelijk een accountantsverklaring, een beoordelingsverklaring of een
      samenstellingsverklaring te geven, behalve in die gevallen dat het geven van een verklaring op grond van deze
      verordening is verboden.

      2 In de verklaring moet een toelichtende paragraaf worden opgenomen, indien sprake is van ernstige onzekerheid
      omtrent de continuïteit van de huishouding.

      3 De door een Accountant-Administratieconsulent gegeven verklaring aangaande een jaarrekening heeft betrekking op
      het samenstel van bescheiden bestaande uit balans, winst- en verliesrekening en toelichting, of de bescheiden die
      bij andere huishoudingen dan ondernemingen daarvoor in de plaats treden.

      4 De goedkeurende accountantsverklaring aangaande een jaar rekening houdt het oordeel in dat deze een zodanig
      inzicht geeft in de grootte en samenstelling van het vermogen en het resultaat van de huishouding als in de gegeven
      omstandigheden vereist is.

      5 Het is verboden een opdracht te aanvaarden tot controle van een deel van een jaarrekening. Dit verbod geldt
      niet voor een eenmalige controle van de balans met de toelichting, dan wel van de bescheiden die bij andere
      huishoudingen dan ondernemingen daarvoor in de plaats treden.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel17
  - number: '18'
    text: Het bestuur kan nadere voorschriften geven met betrekking tot verklaringen.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel18
  - number: '19'
    text: |-
      De Accountant-Administratieconsulent is gehouden zorg te dragen voor een zodanige registratie der verrichte
      werkzaamheden dat op aanvaardbare wijze een goed beeld van de uitvoering kan worden gevormd. Hij is gehouden deze
      registratie gedurende zeven jaar te bewaren.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel19
  - number: '20'
    text: |-
      Het optreden in dienstbetrekking tast de eigen vaktechnische verantwoordelijkheid van de Accountant-
      Administratieconsulent niet aan.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel20
  - number: '21'
    text: |-
      1 Het bepaalde in het [tweede, derde en vijfde lid van artikel 12][ref1] geldt niet voor de in het
      [vierde lid van artikel 2][ref2] bedoelde Accountant-Administratieconsulent die een verklaring geeft aan een
      Minister, het bestuur van een provincie of gemeente, of het bestuur van enig ander openbaar lichaam.

      2 Het bepaalde in de [artikelen 12 tot en met 14][ref3] geldt niet voor de in het [vierde lid van artikel 2][ref4]
      bedoelde Accountant-Administratieconsulent in de omstandigheden bedoeld onder b van dat lid.

      3 Voor de in het eerste lid en het tweede lid bedoelde Accountant-Administratieconsulent geldt het bepaalde
      in de [artikelen 27 tot en met 33][ref5] op overeenkomstige wijze, met dien verstande dat hij dient te doen
      wat redelijkerwijze van hem kan worden verlangd, om te voorkomen dat bij openbaarmaking van zijn verklaring,
      hetzij door de inhoud van de gezamenlijk openbaar gemaakte stukken een onjuiste indruk omtrent de betekenis van
      de verantwoording wordt gewekt, hetzij door hetgeen bekend is geworden in de periode tussen het geven van de
      verklaring en het openbaar maken ervan, aan de getrouwheid van de verantwoording afbreuk wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007117#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007117#Artikel12
