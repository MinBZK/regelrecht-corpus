  - number: '37'
    text: |-
      Deze verordening kan worden aangehaald als Gedrags- en Beroepsregels Accountants-Administratieconsulenten, bij
      afkorting GBAA.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel37
  - number: '38'
    text: Deze verordening treedt in werking de tweede dag na publikatie in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel38
