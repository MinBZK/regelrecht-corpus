  - number: '2'
    text: |-
      1 Voor de toepassing ven deze verordening wordt de Accountant-Administratieconsulent geacht op te treden als
      accountant indien hij:

      a. zich als zodanig bekendmaakt of doet bekendmaken, of

      b. beroepshalve een verklaring geeft, of

      c. optreedt onder gemeenschappelijke naam met een accountant.

      2 Voor de toepassing van deze verordening wordt de als accountant optredende Accountant-Administratieconsulent
      geacht op te treden als openbaar accountant indien hij:

      I. al dan niet in de vervulling van een dienstbetrekking:

      a. zich als zodanig bekendmaakt of doet bekendmaken, of

      b. gedoogt dat een door hem gegeven verklaring openbaar wordt gemaakt, of

      c. in enige functie optreedt onder dezelfde naam als die waaronder hij als openbaar accountant optreedt, of

      d. optreedt onder gemeenschappelijke naam met een openbaar accountant; dan wel

      II. in de vervulling van een dienstbetrekking:

      e. een opdracht aanvaardt buiten het kader van zijn dienstbetrekking, of

      f. een verklaring geeft aan een ander dan een besturend of toezichthoudend orgaan binnen de economische eenheid,
      waarin hij zijn dienstbetrekking uitoefent.

      3 Voor de toepassing van deze verordening wordt, in afwijking van het bepaalde in lid 2 onder II f, de als
      accountant optredende Accountant-Administratieconsulent niet geacht op te treden als openbaar accountant, indien
      hij in de vervulling van een dienstbetrekking een verklaring aangaande een verantwoording van de economische
      eenheid waarin hij zijn dienstbetrekking uitoefent, of van een deel van die eenheid, geeft aan:

      a. een accountant, of

      b. een ander, mits:

        - het geen accountantsverklaring aangaande een jaarrekening betreft, en
        - die ander uitdrukkelijk kenbaar heeft gemaakt dat een verklaring van een niet als openbaar accountant optredende
      Accountant-Administratieconsulent voor hem toereikend is en uitsluitend strekt ter voorziening in een eigen
      behoefte, en
        - die ander redelijkerwijs In staat geacht moet worden de betekenis te onderkennen van een verklaring van een niet
      als openbaar accountant optredende Accountant-Administratieconsulent.

      4 Voor de toepassing van deze verordening wordt de in overheids- of daarmede gelijk te stellen dienst werkzame
      Accountant-Administratieconsulent niet geacht op te treden als openbaar accountant, indien en voor zover hij, al
      dan niet bestemd voor openbaarmaking:

      a. een verklaring aangaande een verantwoording betreffende een overheidsdienst of -instelling afgeeft, of

      b. in bijzondere gevallen een mededeling omtrent de uitkomst van zijn arbeid doet, niet inhoudende de uitkomst van
      een controle van een verantwoording van een overheidsdienst of -instelling, ten aanzien waarvan dit van belang te
      achten is voor een doelmatige uitoefening van de taak van de overheid.

      5 Voor de toepassing van deze verordening wordt de Accountant-Administratieconsulent voorts geacht op te treden als
      openbaar accountant, indien hij optreedt zonder dat duidelijk is dat hij niet-beroepshalve of in een andere functie
      handelt.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel2
  - number: '3'
    text: |-
      Met de naam waaronder een Accountant-Administratieconsulent optreedt wordt gelijkgesteld elke zodanig daarop
      gelijkende naam dat verwarring te duchten valt.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel3
  - number: '4'
    text: |-
      De bepalingen van dit hoofdstuk gelden voor alle Accountants-Administratieconsulenten, ongeacht de functie waarin
      zij optreden.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel4
  - number: '5'
    text: |-
      De Accountant-Administratieconsulent onthoudt zich van al hetgeen schadelijk is voor de eer van de stand van de
      Accountants-Administratieconsulenten.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel5
  - number: '6'
    text: |-
      De Accountant-Administratieconsulent die een stuk. inhoudende een niet door of mede door hem afgelegde
      verantwoording afgeeft of doet afgeven, zodanig dat de indruk wordt gewekt dat het van hem afkomstig is, wordt
      geacht beroepshalve de controle van die verantwoording te hebben uitgevoerd, tenzij het tegendeel blijkt. Dit
      tegendeel kan slechts blijken door:

        - het vermelden in het stuk van een andere functie dan die van accountant, of
        - het opnemen in het stuk van een beoordelings;
        - of samenstellingsverklaring, en het vermelden op elk zelfstandig bruikbaar deel van het stuk, afhankelijk van de
      aard van de verrichte werkzaamheden, van de woorden ‘beoordelingsverklaring afgegeven’ of ‘samenstellingsverklaring
      afgegeven’, of
        - het stellen van de woorden ‘geen accountantscontrole toegepast’ op elk zelfstandig bruikbaar deel van het stuk.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel6
  - number: '7'
    text: |-
      De Accountant-Administratieconsulent die is opgehouden op te treden als openbaar accountant, respectievelijk als
      accountant, is gehouden ervoor zorg te dragen dat belanghebbenden daaromtrent voldoende zijn ingelicht. Indien
      en voor zover hieraan niet is voldaan, blijven de bepalingen van de [hoofdstukken III][ref1] en [IV][ref2],
      respectievelijk [III][ref3] voor hem gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0007117#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0007117#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel7
