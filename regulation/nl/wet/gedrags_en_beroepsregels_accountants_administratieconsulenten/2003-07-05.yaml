  - number: '8'
    text: |-
      De bepalingen van dit hoofdstuk gelden uitsluitend voor Accountants-Administratieconsulenten voor zover zij
      optreden als accountant.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel8
  - number: '9'
    text: |-
      1 De Accountant-Administratieconsulent is onpartijdig in zijn oordeel.

      2 Indien de Accountant-Administratieconsulent een bijzonder belang vertegenwoordigt, is hij gehouden ervoor zorg te
      dragen dat zulks aan de betrokkenen kenbaar is.

      3 Het is de Accountant-Administratieconsulent verboden een verklaring te geven aangaande een verantwoording die
      door of mede door hemzelf, zijn echtgenoot, zijn geregistreerde partner, een persoon tot wie hij anderszins in een
      nauwe persoonlijke relatie staat of een persoon met wie hij onder gemeenschappelijke naam optreedt, wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel9
  - number: '10'
    text: |-
      1 De Accountant-Administratieconsulent houdt geheim al hetgeen hem in de uitoefening van zijn beroep als geheim is
      toevertrouwd of wat daarbij als een vertrouwelijke aangelegenheid te zijner kennis is gekomen, voor zover bij of
      krachtens [de wet][ref1] niet anders wordt vereist.

      2 De Accountant-Administratieconsulent maakt van vertrouwelijke gegevens die In de uitoefening van zijn beroep
      te zijner kennis zijn gekomen, niet verder of anders gebruik, en aan die gegevens geeft hij niet verder of anders
      bekendheid, dan voor de vervulling van zijn taak of bij of krachtens [de wet][ref2] wordt vereist.

      3 Indien degene wiens aangelegenheid het betreft de Accountant-Administratieconsulent heeft ontslagen van zijn
      plicht tot geheimhouding, is deze gehouden de belangen van alle betrokkenen en van de stand der Accountants-
      Administratieconsulenten zorgvuldig af te wegen alvorens tot bekendmaking over te gaan.

      4 De Accountant-Administratieconsulent handelt niet in strijd met de plicht tot geheimhouding
      als geregeld in het eerste en tweede lid, wanneer hij bij het centraal meldpunt als bedoeld in de
      [Verordening op de fraudemelding][ref3] de opzegging van een controle-opdracht wegens een reden als bedoeld in
      [artikel 2. derde lid][ref4], of [artikel 3, tweede lid, van genoemde verordening][ref5] meldt in het geval dat
      voornoemde verordening niet de plicht daartoe oplegt.

      5 Indien een voor de vervulling van de taak vereiste mededeling slechts kan worden gedaan door openbaarmaking
      ervan, en degene wiens aangelegenheden het betreft daaraan niet meewerkt is de Accountant-Administratieconsulent
      gehouden ten aanzien van de wijze van openbaarmaking de belangen van alle betrokkenen en van de stand der
      Accountants-Administratieconsulenten in het oog te houden.

      6 De bepalingen van dit artikel blijven voor de Accountant-Administratieconsulent gelden nadat hij is opgehouden op
      te treden als accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0002856
      [ref2]: https://wetten.overheid.nl/BWBR0002856
      [ref3]: https://wetten.overheid.nl/BWBR0006754
      [ref4]: https://wetten.overheid.nl/BWBR0006754#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0006754#Artikel3
