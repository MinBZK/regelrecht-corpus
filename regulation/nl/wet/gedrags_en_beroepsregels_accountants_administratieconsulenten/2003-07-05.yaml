  - number: '22'
    text: |-
      De bepalingen van dit hoofdstuk gelden uitsluitend voor Accountants-Administratieconsulenten voor zover zij
      optreden als openbaar accountant.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel22
  - number: '23'
    text: |-
      De Accountant-Administratieconsulent draagt er zorg voor dat voor ieder die van een van hem uitgaand stuk kennis
      neemt, zijn persoonsnaam en wettelijke titel op eenvoudige wijze kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel23
  - number: '24'
    text: |-
      1 De Accountant-Administratieconsulent is onafhankelijk van zijn opdrachtgever en van degene omtrent wiens
      aangelegenheden hij verklaringen geeft, alsmede van degene die belangen heeft bij of afhankelijk is van een van hen
      of van beiden.

      2 De Accountant-Administratieconsulent draagt er zorg voor dat de onafhankelijkheid van zijn optreden niet door
      financiële of andere belangen van derden kan worden aangetast.

      3 Het is de Accountant-Administratieconsulent verboden een verklaring te geven aan of aangaande een verantwoording
      van degene van wie hij duurzaam in overwegende mate afhankelijk is voor zijn inkomensvorming.

      4 Het is de Accountant-Administratieconsulent verboden een verklaring te geven indien de verantwoording wordt
      afgelegd door of mede door een natuurlijke of rechtspersoon waartoe hijzelf, zijn echtgenoot, zijn geregistreerde
      partner, een persoon tot wie hij anderszins in een nauwe persoonlijke relatie staat, degene met wie hij onder
      gemeenschappelijke naam optreedt, of enige persoon tot wie hij in een gezagsverhouding staat, in een betrekking
      staat die een aanmerkelijk financieel belang meebrengt.

      5 Het is de Accountant-Administratieconsulent verboden provisie dan wel vergoedingen die afhankelijk zijn van de
      uitkomst van de arbeid te bedingen of te aanvaarden.

      6 Het bestuur kan nadere voorschriften geven aangaande de onafhankelijkheid van de Accountant-
      Administratieconsulent met betrekking tot bepaalde soorten opdrachten.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel24
  - number: '25'
    text: |-
      1 De toegelaten vormen van beroepsuitoefening zijn:

      a. zelfstandig;

      b. in dienstbetrekking tot een openbaar accountant;

      c. in dienstbetrekking tot een rechtspersoon, indien an zolang wordt voldaan aan het gestelde in het tweede lid en
      aan door het bestuur te geven nadere voorschriften;

      d. in dienstbetrekking tot een rechtspersoon die niet voldoet aan het onder c gestelde, mits die rechtspersoon lid
      is van de Vereniging van Accountants- en Belastingadviesbureaus ‘VLB’ en die rechtspersoon of de rechtsvoorganger
      daarvan vóór 10 september 1993 als lid tot die vereniging is toegetreden en mits die vereniging en die
      rechtspersoon verder voldoen aan door het bestuur te geven voorschriften.

      2 De in het eerste lid onder c genoemde rechtspersoon dient in meerderheid te worden beheerst door één of meer
      Accountants-Administratieconsulenten of registeraccountants.

      3 Het bestuur kan nadere voorschriften geven ter waarborging van de continuïteit van de beroepsuitoefening door de
      Accountant-Administratieconsulent.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel25
  - number: '26'
    text: |-
      1 Het is de Accountant-Administratieconsulent slechts toegestaan op te treden onder gemeenschappelijke naam niet:

      a. een andere openbaar accountant,

      b. een beoefenaar van een vrij beroep, niet zijnde een openbaar accountant, die lid is van een door het bestuur
      erkende beroepsorganisatie, en die verder voldoet aan door het bestuur nader te geven voorschriften. Het bestuur
      is bevoegd in individuele gevallen op verzoek van de betrokken Accountant-Administratieconsulent, al dan niet
      onder het stellen van aanvullende voorwaarden, ontheffing te verlenen van de eis van lidmaatschap ven een erkende
      beroepsorganisatie en van de nadere voorschriften.

      2 De zelfstandigheid van de oordeelsvorming in vaktechnische aangelegenheden van de Accountant-
      Administratieconsulent die optreedt onder gemeenschappelijke naam, dient te allen tijde te zijn gewaarborgd.

      3 De Accountant-Administratieconsulent draagt medeverantwoordelijkheid voor de grondslagen van de arbeid van degene
      met wie hij onder gemeenschappelijke naam optreedt.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel26
  - number: '27'
    text: |-
      1 De Accountant-Administratieconsulent die pleegt op te treden als openbaar accountant vervult generlei functie
      die geacht kan worden de onpartijdigheid van zijn oordeel of van het oordeel van degene met wie hij onder
      gemeenschappelijke naam optreedt, dan wel zijn onafhankelijkheid of de onafhankelijkheid van degene met wie hij
      onder gemeenschappelijke naam optreedt, in gevaar te brengen.

      2 De Accountant-Administratieconsulent die tevens in een andere functie dan die van openbaar accountant optreedt,
      is gehouden zijn uitingen in die andere functie zodanig in te richten dat voor een ieder duidelijk is dat deze niet
      in de openbare accountantsfunctie zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel27
  - number: '28'
    text: |-
      1 Het is de Accountant-Administratieconsulent verboden toestemming te geven tot openbaarmaking van zijn verklaring,
      anders dan te zamen met de verantwoording waarop die verklaring betrekking heeft.

      2 De verklaring heeft mede betrekking op hetgeen omtrent de verantwoording in gezamenlijk daarmede openbaar
      gemaakte stukken wordt medegedeeld.

      3 Het is de Accountant-Administratieconsulent verboden toestemming tot openbaarmaking van zijn verklaring te
      verlenen indien, hetzij door de inhoud van de gezamenlijk openbaar gemaakte stukken een onjuiste indruk omtrent de
      betekenis van de verantwoording wordt gewekt, hetzij door hetgeen bekend is geworden in de periode tussen het geven
      van de verklaring en het openbaar maken ervan, aan de getrouwheid van de verantwoording afbreuk wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel28
  - number: '29'
    text: |-
      1 Indien een deel van een jaarrekening dan wel een verkorte jaarrekening openbaar wordt gemaakt, is het verboden
      toe te staan dat daarbij enigerlei door de Accountant-Administratieconsulent gegeven mededeling wordt openbaar
      gemaakt, tenzij:

      a. hij tot het oordeel is gekomen dat in de gegeven omstandigheden het desbetreffende stuk toereikend is, of

      b. op grond van wettelijke voorschriften met openbaarmaking van het desbetreffende stuk kan worden volstaan.

      2 Voor de toepassing van de [artikelen 12 tot en met 14][ref1] wordt het desbetreffende openbaar gemaakte stuk
      geacht een zelfstandige verantwoording in te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel12
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007117
        artikel: '12'
        hoofdstuk: III
  - number: '30'
    text: |-
      1 De Accountant-Administratie-consulent maakt geen promotionele activiteiten die in strijd is met [de wet][ref1],
      de waarheid of de goede smaak.

      2 De Accountant-Administratie-consulent geeft geen vergoeding voor het hem bezorgen van opdrachten. Het geven van
      een vergoeding voor het overnemen van een accountantspraktijk of een deel daarvan wordt niet beschouwd als het
      geven van een zodanige vergoeding


      [ref1]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002856
  - number: '31'
    text: |-
      1 Het is de Accountant-Administratieconsulent verboden in te gaan op een verzoek tot het aanvaarden van een
      opdracht alvorens hij van de openbaar accountant respectievelijk van de accountant in overheids- of daarmee
      gelijk te stellen dienst, die reeds voor dezelfde opdrachtgever bij dezelfde huishouding optreedt of laatstelijk
      is opgetreden, inlichtingen heeft gevraagd. Dit verbod geldt slechts dan niet indien uit door de Accountant-
      Administratieconsulent vastgestelde feiten is gebleken dat het verzoek om inlichtingen schade voor de opdrachtgever
      of de huishouding kan opleveren.

      2 De Accountant-Administratieconsulent aan wie inlichtingen zijn gevraagd, is gehouden binnen redelijke tijd aan
      de accountant die hierom heeft gevraagd mede te delen wat deze voor zijn oordeelvorming omtrent de aanvaardbaarheid
      van de opdracht nodig heeft.

      3 Het is verboden de opdracht te aanvaarden alvorens hetzij de gevraagde inlichtingen zijn verkregen, hetzij is
      komen vast te staan dat zij niet binnen redelijke tijd worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel31
  - number: '32'
    text: |-
      De Accountant-Administratieconsulent is gehouden aan de accountant die gelijktijdig voor dezelfde opdrachtgever
      bij dezelfde huishouding optreedt en een andersluidende opdracht heeft aanvaard, desgevraagd de inlichtingen
      te verstrekken die voor de uitvoering van diens opdracht nuttig zijn, binnen de grenzen gesteld door het
      [tweede en derde lid van artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel10
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007117
        artikel: '10'
        hoofdstuk: III
  - number: '33'
    text: |-
      Het is de Accountant-Administratieconsulent verboden een oordeel te geven omtrent de arbeid van een andere
      accountant alvorens hem in gelegenheid te hebben gesteld inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel33
  - number: '34'
    text: |-
      De Accountant-Administratieconsulent dient in de uitoefening van zijn beroep zijn honorarium vast te stellen met
      inachtneming van aard en omvang van de verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel34
  - number: '35'
    text: |-
      De nadere voorschriften zoals omschreven in deze verordening worden door het bestuur slechts gegeven - de leden
      gehoord - na overleg met het bestuur van het Nederlands Instituut van Registeraccountants. Het bestuur geeft aan
      alle leden kennis van deze nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel35
  - number: '36'
    text: |-
      1 In afwijking van [artikel 25, eerste lid][ref1], is het de Accountant-Administratieconsulent tot 1 januari 2000
      toegestaan zijn beroep uit te oefenen in een tijdens de inwerkingtreding van deze verordening reeds bestaande
      dienstbetrekking tot een (rechts-)persoon die niet valt onder [artikel 25, eerste lid, onder b of c.][ref2] waarbij
      de Accountant-Administratieconsulent optreedt als openbaar accountant.

      2 De Accountant-Administratieconsulent die een dienstbetrekking is aangegaan zoals bedoeld in het eerste lid, dient
      zich binnen drie maanden na de inwerkingtreding van deze verordening bekend te doen maken bij het bestuur onder
      vermelding van door het bestuur nader vast te stellen gegevens.

      3 Op verzoek van de Accountant-Administratieconsulent kan het bestuur in individuele gevallen, al dan niet onder
      het stellen van aanvullende voorwaarden, voor een dienstbetrekking zoals bedoeld in het eerste lid die zich
      uitstrekt tot na 1 januari 2000, tijdelijk ontheffing verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0007117#Artikel25
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007117
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007117
        artikel: '25'
