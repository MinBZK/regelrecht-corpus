  - number: '11'
    text: |-
      1 De Accountant-Administratieconsulent doet slechts mededelingen omtrent de uitkomst van zijn arbeid voor zover
      zijn deskundigheid en de door hem verrichte werkzaamheden daarvoor een deugdelijke grondslag vormen. Hij draagt er
      zorg voor dat zodanige mededelingen een duidelijk beeld geven van de uitkomst van zijn arbeid.

      2 Het bestuur geeft nadere voorschriften aangaande het op peil houden van de deskundigheid van de Accountant-
      Administratieconsulent, ten behoeve van een verantwoorde beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel11
  - number: '12'
    text: |-
      1 De door een Accountant-Administratieconsulent gegeven verklaring heeft betrekking op de verantwoording als
      geheel, alsmede op hetgeen omtrent de verantwoording in met zijn Instemming gezamenlijk daarmede overgelegde
      stukken wordt medegedeeld. De verklaring is gedateerd.

      2 De Accountant-Administratieconsulent is gehouden aan ieder aan wie hij een verklaring verstrekt, mede te delen
      dat openbaarmaking ervan slechts is toegestaan met zijn voorafgaande uitdrukkelijke toestemming.

      3 Indien openbaarmaking van de verklaring is geschied zonder zijn voorafgaande uitdrukkelijke toestemming, is de
      Accountant-Administratieconsulent gehouden maatregelen te treffen om herhaling te voorkomen en zo nodig herstel te
      verzekeren. [Artikel 10, vijfde lid][ref1], is hierbij van toepassing.

      4 De Accountant-Administratieconsulent is gehouden te doen wat in zijn vermogen ligt om te voorkomen dat zijn
      verklaring wordt vervangen door een mededeling van een ander.

      5 De Accountant-Administratieconsulent die niet optreedt als openbaar accountant, is gehouden aan ieder aan wie
      hij een verklaring verstrekt, mede te delen dat verstrekking van die verklaring ten gebruike door een ander dan
      degene aan wie zij is gegeven, niet is toegestaan. Indien een zodanige verstrekking van een verklaring niettemin is
      geschied, is de Accountant-Administratieconsulent gehouden maatregelen te treffen om herhaling te voorkomen en zo
      nodig herstel te verzekeren. [Artikel 10. vijfde lid][ref2], is hierbij van toepassing.

      6 Indien de verklaring is gegeven in de vervulling van een andere dienstbetrekking dan bedoeld in
      [artikel 25][ref3] moet in de verklaring het bestaan van het dienstverband worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007117#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0007117#Artikel25
    url: https://wetten.overheid.nl/BWBR0007117/2003-07-05#Artikel12
