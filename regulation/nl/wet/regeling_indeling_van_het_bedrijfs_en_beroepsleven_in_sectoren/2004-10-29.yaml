  - number: '2'
    text: |-
      Tot elke sector van het bedrijfs- en beroepsleven worden gerekend de werkzaamheden, verricht in de takken van
      bedrijf of beroep of gedeelten daarvan, welke in de bij deze regeling behorende bijlage zijn vermeld. Werkzaamheden
      die een overheidswerkgever als bedoeld in [artikel 1, onderdeel k van de Werkloosheidswet][ref1] als werkgever doet
      verrichten, worden gerekend tot een van de sectoren 61 tot en met 66.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
  - number: '3'
    text: |-
      Werkzaamheden, verricht in takken van bedrijf en beroep, welke niet in de bijlage bij deze regeling zijn vermeld,
      worden geacht te behoren tot een sector van het bedrijfs- en beroepsleven, waartoe takken van bedrijf en beroep
      behoren, waarin werkzaamheden worden verricht, welke naar de aard het meest met de eerstbedoelde werkzaamheden
      overeenkomen.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel3
  - number: '4.1'
    text: |-
      Ondernemingen waarvan de bedrijfsuitoefening uitsluitend of in overwegende mate behoort tot de in de bijlage van
      deze regeling bij de sectoren metaalindustrie, elektrotechnische industrie en metaal- en technische bedrijfstakken
      genoemde takken van bedrijf of beroep waarop het tot 1 januari 1985 geldende criterium van het aantal werknemers
      van toepassing is en die als werkgever zijn ingedeeld bij de sector metaal- en technische bedrijfstakken, doch
      waarbij op genoemde datum gedurende een ononderbroken periode van 4, 3, 2 of 1 jaar, respectievelijk ten minste 30,
      50, 100 of 150 werknemers ten behoeve van bedoelde bedrijfsuitoefening in dienst waren, blijven aangesloten bij de
      sector metaal- en technische bedrijfstakken.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel4
  - number: '4.2'
    text: |-
      Ondernemingen waarvan de bedrijfsuitoefening uitsluitend of in overwegende mate behoort tot de in de bijlage van
      deze regeling bij de sector metaalindustrie en de sector metaal- en technische bedrijfstakken genoemde takken van
      bedrijf of beroep waarop het tot 1 januari 1985 geldende criterium van het aantal werknemers van toepassing is
      en die als werkgever zijn ingedeeld bij de sector metaalindustrie doch waarbij op genoemde datum gedurende een
      ononderbroken periode van 4, 3, 2 of 1 jaar respectievelijk minder dan 30, 15, 10 of 5 werknemers ten behoeve van
      bedoelde bedrijfsuitoefening in dienst waren, blijven aangesloten bij de sector metaalindustrie.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel4
  - number: '4.3'
    text: |-
      Ondernemingen waarvan de bedrijfsuitoefening uitsluitend of in overwegende mate behoort tot de in de bijlage
      van deze regeling bij de sector elektrotechnische industrie en de sector metaal- en technische bedrijfstakken
      genoemde takken van bedrijf of beroep waarop het tot 1 januari 1985 geldende criterium van het aantal werknemers
      van toepassing is en die als werkgever zijn ingedeeld bij de sector elektrotechnische industrie, doch waarbij op
      genoemde datum gedurende een ononderbroken periode van 4, 3, 2 of 1 jaar respectievelijk minder dan 30, 15, 10
      of 5 werknemers ten behoeve van bedoelde bedrijfsuitoefening in dienst waren, blijven aangesloten bij de sector
      elektrotechnische industrie.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel4
  - number: '4.4'
    text: |-
      In geval van rechtsopvolging van een werkgever als bedoeld in het eerste, tweede of derde lid wordt voor de
      toepassing van het eerste, tweede, of derde lid aangenomen dat sprake is van eenzelfde aansluiting.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel4
  - number: '5.1'
    text: |-
      Een werkgever als bedoeld in [artikel 4][ref1], of de ondernemingsraad die aan de onderneming van die werkgever
      is verbonden kan aan het Uitvoeringsinstituut werknemersverzekeringen verzoeken te beslissen dat die werkgever is
      aangesloten bij die sector waarbij hij zonder het bepaalde in [artikel 4, eerste, tweede en derde lid][ref2] zou
      moeten zijn aangesloten geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0008570#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008570#Artikel4
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008570
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008570
        artikel: '4'
  - number: '5.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, wordt ingewilligd indien tussen de werkgever en de aan zijn onderneming
      verbonden ondernemingsraad daarover overeenstemming bestaat en indien de werkgever voldoet aan alle voorwaarden
      welke zijn opgenomen in de door het Uitvoeringsinstituut werknemersverzekeringen gegeven nadere regelen tot
      vaststelling van het tijdstip van aansluiting van werkgevers uit de metaalsector bij een der betrokken sectoren.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel5
  - number: '5.3'
    text: |-
      Indien geen ondernemingsraad is verbonden aan de onderneming van de in het eerste lid bedoelde werkgever, treden
      de gezamenlijke werknemers in alle rechten van een ondernemingsraad wat betreft het in het eerste en tweede lid
      gestelde, met dien verstande dat als oordeel van de gezamenlijke werknemers geldt de met meerderheid van stemmen
      door hen ter zake uitgesproken mening.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel5
  - number: '6'
    text: |-
      Indien het bij koninklijke boodschap van 9 september 1996 ingediende voorstel van wet (Organisatiewet sociale
      verzekeringen 1997, Kamerstukken II 1996/97, 24877) tot wet wordt verheven en in werking treedt, treedt deze
      regeling op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling indeling van het bedrijfs- en beroepsleven in sectoren.'
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel7
