  - number: '6'
    text: |-
      Indien het bij koninklijke boodschap van 9 september 1996 ingediende voorstel van wet (Organisatiewet sociale
      verzekeringen 1997, Kamerstukken II 1996/97, 24877) tot wet wordt verheven en in werking treedt, treedt deze
      regeling op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0008570/2004-10-29#Artikel6
