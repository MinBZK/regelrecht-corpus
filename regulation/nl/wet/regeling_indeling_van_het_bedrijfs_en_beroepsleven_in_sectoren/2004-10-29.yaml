articles:
  - number: '1'
    text: |-
      Het bedrijfs- en beroepsleven wordt verdeeld in de volgende sectoren, elk omvattende één of meer takken van bedrijf
      of beroep of gedeelten daarvan, zoals aangegeven in de bij deze regeling behorende bijlage:

      1. Agrarisch bedrijf

      2. Tabakverwerkende industrie

      3. Bouwbedrijf

      4. Baggerbedrijf

      5. Houten emballage-industrie, houtwaren- en borstelindustrie

      6. Timmerindustrie

      7. Meubel- en orgelbouwindustrie

      8. Groothandel in hout, zagerijen, schaverijen en houtbereidingsindustrie

      9. Grafische industrie

      10. Metaalindustrie

      11. Elektrotechnische industrie

      12. Metaal-en technische bedrijfstakken

      13. Bakkerijen

      14. Suikerverwerkende industrie

      15. Slagersbedrijven

