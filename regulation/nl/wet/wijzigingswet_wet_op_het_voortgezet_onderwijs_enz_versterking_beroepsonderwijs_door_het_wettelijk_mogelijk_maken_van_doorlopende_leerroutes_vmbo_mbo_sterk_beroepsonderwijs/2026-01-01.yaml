preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de aansluiting van het voorbereidend middelbaar
    beroepsonderwijs op het middelbaar beroepsonderwijs te verbeteren en daartoe meer samenwerking tussen scholen voor
    voortgezet onderwijs en instellingen voor beroepsonderwijs mogelijk te maken in de vorm van doorlopende leerroutes
    vmbo-mbo waarbij voortgezet onderwijs en middelbaar beroepsonderwijs in een geïntegreerd onderwijsprogramma worden
    verzorgd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043608/2026-01-01#ArtikelAanhef
articles:
  - number: XIa
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk, waarbij in
      het bijzonder aandacht wordt besteed aan de effecten van deze wet op de voorkoming en bestrijding van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0043608/2026-01-01#ArtikelXIa
  - number: XII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043608/2026-01-01#ArtikelXII
