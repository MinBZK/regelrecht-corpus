  - number: 2:41.2
    text: |-
      Indien ter uitvoering van de richtlijn in een andere lidstaat dan Nederland door Nederlandse werknemers het
      recht, bedoeld in [artikel 2:34, derde lid][ref1], kan worden uitgeoefend, is op de uitoefening van dat recht
      [2:11, tweede tot en met achtste lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel241
