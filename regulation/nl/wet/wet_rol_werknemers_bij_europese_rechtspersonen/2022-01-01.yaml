        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1:5.2.b
    text: |-
      degene die informatie heeft geweigerd krachtens [artikel 1:12, tweede lid][ref1], of [1:26, derde lid][ref2], te
      verplichten tot het verstrekken van informatie op de grond dat deze bij afweging van de betrokken belangen niet in
      redelijkheid tot het weigeren van informatie had kunnen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel15
