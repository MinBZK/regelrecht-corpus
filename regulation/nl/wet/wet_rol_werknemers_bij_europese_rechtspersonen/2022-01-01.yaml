  - number: 2:6.3
    text: 'Dit hoofdstuk doet geen afbreuk aan het bij of krachtens de wet bepaalde over het recht op:'
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel26
  - number: 2:6.3.a
    text: |-
      informatie, raadpleging en medezeggenschap dat de werknemers van de SCE en van haar dochterondernemingen en
      vestigingen genieten, anders dan medezeggenschap bij de benoeming van commissarissen of bestuurders in het
      toezichthoudend of het bestuursorgaan van de SCE;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel26
  - number: 2:6.3.b
    text: |-
      medezeggenschap bij de benoeming van commissarissen of bestuurders in dochterondernemingen van de SCE of SCE's als
      bedoeld in [afdeling 4][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '4'
  - number: 2:7.1
    text: |-
      Deze afdeling is van toepassing in het geval van oprichting van een SCE door ten minste twee juridische lichamen of
      door omzetting.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel27
  - number: 2:7.2
    text: |-
      Indien aan de oprichting, bedoeld in het eerste lid, mede wordt deelgenomen door een of meer natuurlijke personen,
      wordt voor de toepassing van deze afdeling onder deelnemende juridische lichamen mede verstaan: natuurlijke
      personen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel27
  - number: 2:7.3
    text: |-
      In het geval van oprichting van een SCE door uitsluitend natuurlijke personen of door slechts één juridisch lichaam
      en natuurlijke personen, is deze afdeling van overeenkomstige toepassing, indien het totale aantal werknemers van
      de SCE en haar dochterondernemingen en vestigingen in ten minste twee lidstaten ten minste 50 zal bedragen. Het
      tweede lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel27
  - number: 2:8
    text: |-
      Indien de SCE haar statutaire zetel in Nederland zal hebben is Nederlands recht van toepassing op de in deze
      afdeling geregelde onderhandelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel28
  - number: 2:9.1
    text: |-
      De deelnemende juridische lichamen die voornemens zijn een SCE op te richten stellen een bijzondere
      onderhandelingsgroep in die representatief is voor de werknemers van de deelnemende juridische lichamen, betrokken
      dochterondernemingen en vestigingen, om met de vertegenwoordigers van de werknemers van de juridische lichamen in
      onderhandeling te treden over regelingen inzake de rol van de werknemers in de SCE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
  - number: 2:9.2
    text: |-
      De deelnemende juridische lichamen geven aan de vertegenwoordigers van de werknemers van de juridische lichamen,
      dan wel, bij het ontbreken daarvan, aan de werknemers, een overzicht van de deelnemende juridische lichamen, de
      betrokken dochterondernemingen en vestigingen en de daarin werkzame werknemers, alsmede de verdeling van deze
      werknemers over de lidstaten. Indien na de instelling van de bijzondere onderhandelingsgroep, bedoeld in het derde
      lid, wijzigingen optreden in de gegevens die zijn vermeld in het overzicht, verstrekken de deelnemende juridische
      lichamen zo spoedig mogelijk na deze wijziging een gewijzigd overzicht aan de bijzondere onderhandelingsgroep
      en, indien die situatie zich voordoet, aan de werknemers of hun vertegenwoordigers van de deelnemende juridische
      lichamen, de betrokken dochterondernemingen en vestigingen uit een lidstaat die nog niet in de bijzondere
      onderhandelingsgroep is vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
  - number: 2:9.3
    text: |-
      De instelling van de bijzondere onderhandelingsgroep en de verstrekking van het in het tweede lid bedoelde
      overzicht vindt plaats zo spoedig mogelijk nadat de leidinggevende of de bestuursorganen overeenstemming hebben
      bereikt over een voorstel tot oprichting van een SCE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
  - number: 2:9.4
    text: |-
      De deelnemende juridische lichamen dragen er zorg voor dat binnen die juridische lichamen de samenstelling
      van de bijzondere onderhandelingsgroep alsmede het tijdstip waarop de vergadering, bedoeld in
      [artikel 2:12, eerste lid, tweede zin][ref1], zal worden gehouden, wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:9.5
    text: |-
      Zo spoedig mogelijk na haar instelling of na de ontvangst van een gewijzigd overzicht als bedoeld in het
      tweede lid, tweede zin, stelt de bijzondere onderhandelingsgroep ten behoeve van de toepassing van de
      [artikelen 2:10][ref1] en [2:15][ref2] een overzicht vast van haar samenstelling en van de door haar leden
      vertegenwoordigde werknemers. Het overzicht geeft ten minste informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:9.5.a
    text: het aantal leden van de bijzondere onderhandelingsgroep en de lidstaat waaruit zij zijn afgevaardigd;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
  - number: 2:9.5.b
    text: |-
      de deelnemende juridische lichamen, betrokken dochterondernemingen of vestigingen welker werknemers door elk lid
      worden vertegenwoordigd, alsmede het aantal van die werknemers, dat tevens wordt uitgedrukt als percentage van alle
      werknemers die door de leden gezamenlijk worden vertegenwoordigd;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
  - number: 2:9.5.c
    text: |-
      het deelnemend juridisch lichaam, betrokken dochteronderneming of vestiging waarin een lid als werknemer werkzaam
      is, dan wel over de omstandigheid dat het lid geen werknemer is.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel29
  - number: 2:10.1
    text: |-
      De bijzondere onderhandelingsgroep bestaat uit een zodanig aantal vertegenwoordigers van de werknemers van de
      deelnemende juridische lichamen en de betrokken dochterondernemingen en vestigingen, dat is gewaarborgd dat per
      lidstaat een lid wordt gekozen of aangewezen voor elke 10%, of een deel daarvan, van de werknemers die in de
      betrokken lidstaat werkzaam zijn, berekend over het totale aantal werknemers dat bij de deelnemende juridische
      lichamen en de betrokken dochterondernemingen en vestigingen in alle lidstaten tezamen werkzaam is.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
  - number: 2:10.2
    text: |-
      Indien een SCE door fusie wordt opgericht zijn er van elke lidstaat zoveel extra leden als nodig is om ervoor te
      zorgen, dat de bijzondere onderhandelingsgroep ten minste één extra lid telt ter vertegenwoordiging van elke in die
      lidstaat ingeschreven deelnemende coöperatie met daar werkzame werknemers, die ingevolge de inschrijving van de SCE
      zal ophouden te bestaan als afzonderlijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
  - number: 2:10.3
    text: |-
      Het aantal van de in het tweede lid bedoelde extra leden bedraagt ten hoogste 20% van het totale aantal leden op
      grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
  - number: 2:10.4
    text: |-
      Het tweede lid geldt niet voor zover de toepassing ervan dubbele vertegenwoordiging in de bijzondere
      onderhandelingsgroep tot gevolg zou hebben van de werknemers die werkzaam zijn bij een deelnemende coöperatie in
      een lidstaat. Van dubbele vertegenwoordiging is slechts sprake, indien de deelnemende coöperatie die op grond van
      het tweede lid in aanmerking komt voor een extra lid, reeds vertegenwoordigd wordt door een werknemer die werkzaam
      is in die deelnemende coöperatie.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
  - number: 2:10.5
    text: |-
      Indien het aantal deelnemende coöperaties groter is dan het aantal extra leden dat krachtens het tweede en derde
      lid in de bijzondere onderhandelingsgroep zitting kan nemen, worden de extra zetels door vertegenwoordigers van de
      werknemers in verschillende lidstaten ingenomen in dalende volgorde van het aantal werknemers in die coöperaties.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
  - number: 2:10.6
    text: |-
      Elk deelnemend juridisch lichaam met in Nederland werkzame werknemers wordt door ten minste één lid
      vertegenwoordigd in de bijzondere onderhandelingsgroep, tenzij het totale aantal leden daardoor zou toenemen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
  - number: 2:10.7
    text: |-
      Het aantal leden van de bijzondere onderhandelingsgroep en de zetelverdeling wordt in overeenstemming
      gehouden met dit artikel. Indien het aantal leden uit een lidstaat wijzigt zonder dat met betrekking tot
      die zetels een nieuwe verkiezing of aanwijzing heeft plaatsgevonden, hebben de voor die lidstaat zitting
      hebbende leden, voor de toepassing van [artikel 2:15, eerste, tweede, derde en vierde lid][ref1], en
      [artikel 2:16, eerste en derde lid][ref2], samen zoveel stemmen als overeenkomt met het aantal leden dat voor
      die lidstaat krachtens het eerste lid is vastgesteld en vertegenwoordigen zij samen de in die lidstaat werkzame
      werknemers van de deelnemende juridische lichamen en de betrokken dochterondernemingen en vestigingen in een door
      hen te bepalen verhouding, dan wel, indien daarover geen overeenstemming wordt bereikt, naar verhouding van het
      aantal werknemers dat zij vertegenwoordigden voor de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:10.8
    text: |-
      Indien uit de eerste zin van het zevende lid voortvloeit dat vanuit een lidstaat niet langer een lid van de
      bijzondere onderhandelingsgroep kan worden afgevaardigd, dan wel daaruit voortvloeit dat vanuit een nog niet
      vertegenwoordigde lidstaat alsnog een lid kan worden afgevaardigd, neemt de bijzondere onderhandelingsgroep geen
      besluiten totdat haar samenstelling en het overzicht, bedoeld in [artikel 2:9, vijfde lid][ref1], zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2:11.1
    text: |-
      Elk lid van de bijzondere onderhandelingsgroep wordt gekozen of aangewezen overeenkomstig het recht van of de
      praktijk in de lidstaat waaruit hij wordt afgevaardigd. Bij de aanwijzing wordt bepaald welk deel van de in
      die lidstaat werkzame werknemers van de deelnemende juridische lichamen en de betrokken dochterondernemingen en
      vestigingen door het aangewezen lid wordt vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:11.2
    text: |-
      Met betrekking tot de Nederlandse deelnemende juridische lichamen, betrokken dochterondernemingen en vestigingen
      worden de leden van de bijzondere onderhandelingsgroep aangewezen, dan wel wordt hun aanwijzing ingetrokken,
      door de bij die deelnemende juridische lichamen, betrokken dochterondernemingen en vestigingen ingestelde
      ondernemingsraden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:11.3
    text: |-
      Indien uitsluitend met betrekking tot ondernemingsraden als bedoeld in het tweede lid een of meer centrale
      ondernemingsraden zijn ingesteld, geschiedt de aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:11.4
    text: |-
      Indien geen centrale ondernemingsraad is ingesteld, maar wel een of meer groepsondernemingsraden, geschiedt de
      aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:11.5
    text: |-
      Indien niet alle ondernemingsraden of groepsondernemingsraden zijn vertegenwoordigd in een centrale
      ondernemingsraad of groepsondernemingsraad, geschiedt de aanwijzing of intrekking door de centrale
      onderscheidenlijk groepsondernemingsraad of raden en de niet-vertegenwoordigde ondernemingsraden gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:11.6
    text: |-
      Indien er geen enkele ondernemingsraad is ingesteld, worden de leden van de bijzondere onderhandelingsgroep
      gekozen door de gezamenlijke in Nederland werkzame werknemers van de deelnemende juridische lichamen, betrokken
      dochterondernemingen en vestigingen. De verkiezing geschiedt bij geheime schriftelijke stemming, waarbij elke
      werknemer één stem heeft. Ten behoeve van de verkiezing is een vereniging van werknemers, die bedoelde werknemers
      onder haar leden telt, krachtens haar statuten ten doel heeft de belangen van haar leden als werknemers te
      behartigen en als zodanig binnen de deelnemende juridische lichamen, betrokken dochterondernemingen en vestigingen
      werkzaam is en voorts in het bezit is van volledige rechtsbevoegdheid, bevoegd een kandidatenlijst in te dienen,
      mits zij over de samenstelling van de kandidatenlijst overleg heeft gepleegd met haar leden binnen de deelnemende
      juridische lichamen, betrokken dochterondernemingen en vestigingen. De bevoegdheid tot indiening van een
      kandidatenlijst berust tevens bij een of meer van de werknemers van de deelnemende juridische lichamen, betrokken
      dochterondernemingen en vestigingen, die geen lid zijn van een vereniging als bedoeld in de voorgaande zin welke
      een kandidatenlijst heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:11.7
    text: |-
      Bij de toepassing van het tweede tot en met vijfde lid worden werknemers van Nederlandse deelnemende juridische
      lichamen, betrokken dochterondernemingen en vestigingen die niet in een ondernemingsraad, groepsondernemingsraad of
      centrale ondernemingsraad vertegenwoordigd zijn, in de gelegenheid gesteld zich over de als lid van de bijzondere
      onderhandelingsgroep aan te wijzen personen uit te spreken.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:11.8
    text: |-
      Bij de verkiezing of aanwijzing op grond van dit artikel wordt gestreefd naar een evenwichtige verhouding tussen
      het aantal mannelijke en vrouwelijke leden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel211
  - number: 2:12.1
    text: |-
      De deelnemende juridische lichamen en de bijzondere onderhandelingsgroep stellen in een schriftelijke overeenkomst
      regelingen vast over de rol van de werknemers in de SCE. Daartoe beleggen de deelnemende juridische lichamen na de
      oprichting van de bijzondere onderhandelingsgroep met deze een vergadering om te onderhandelen over een dergelijke
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel212
  - number: 2:12.2
    text: |-
      De deelnemende juridische lichamen stellen de bijzondere onderhandelingsgroep in de gelegenheid voorafgaand aan de
      onderhandelingen bijeen te komen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel212
  - number: 2:13.1
    text: |-
      De deelnemende juridische lichamen voorzien de bijzondere onderhandelingsgroep van de gegevens die noodzakelijk
      zijn bij de onderhandelingen. Tot die gegevens behoren ten minste het voorstel tot oprichting van de SCE en het
      verloop van de oprichting tot het tijdstip van de inschrijving van de SCE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel213
  - number: 2:13.2
    text: |-
      De deelnemende juridische lichamen zijn niet verplicht tot het verstrekken van informatie, voor zover dat in
      redelijkheid het functioneren van de deelnemende juridische lichamen of haar dochterondernemingen en vestigingen
      ernstig zou belemmeren dan wel schaden. Zij kunnen terzake van de informatieverstrekking geheimhouding opleggen,
      indien daarvoor een redelijke grond bestaat. Zoveel mogelijk vóór de behandeling van de betrokken aangelegenheid
      wordt meegedeeld, welke grond bestaat voor het opleggen van de geheimhouding, welke schriftelijk of mondeling
      verstrekte gegevens onder de geheimhouding vallen, hoelang deze dient te duren, alsmede of er personen zijn ten
      aanzien van wie de geheimhouding niet in acht behoeft te worden genomen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel213
  - number: 2:14.1
    text: 'De bijzondere onderhandelingsgroep kan besluiten:'
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel214
  - number: 2:14.1.a
    text: |-
      tot goedkeuring van een overeenkomst als bedoeld in [artikel 2:12, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:14.1.b
    text: af te zien van het openen van onderhandelingen of tot het beëindigen van reeds geopende onderhandelingen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel214
  - number: 2:14.2
    text: |-
      Het besluit, bedoeld in het eerste lid, onderdeel b, beëindigt de procedure tot sluiting van een overeenkomst en
      heeft tot gevolg dat de regels op het gebied van informatie en raadpleging van werknemers van toepassing zijn, die
      gelden in de lidstaten waar de SCE werknemers heeft. Na dit besluit is [afdeling 3][ref1] van dit hoofdstuk niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:15.1
    text: Ieder lid van de bijzondere onderhandelingsgroep heeft één stem.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
  - number: 2:15.2
    text: |-
      De bijzondere onderhandelingsgroep besluit, tenzij anders is bepaald, bij volstrekte meerderheid van haar aantal
      leden, tevens vertegenwoordigende de volstrekte meerderheid van de werknemers.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
  - number: 2:15.3
    text: |-
      Een besluit van de bijzondere onderhandelingsgroep tot goedkeuring van een overeenkomst waarin het recht op
      medezeggenschap van de werknemers wordt ingeperkt behoeft een meerderheid van tweederde van haar aantal leden,
      tevens vertegenwoordigende tweederde van de werknemers en afkomstig uit ten minste twee lidstaten, indien:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
  - number: 2:15.3.a
    text: |-
      de SCE wordt opgericht door fusie en de medezeggenschap ten minste 25% van het totale aantal werknemers van de
      deelnemende coöperaties bestrijkt, of
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
  - number: 2:15.3.b
    text: |-
      de SCE wordt opgericht op enige andere wijze en de medezeggenschap ten minste 50% van het totale aantal werknemers
      van de deelnemende juridische lichamen bestrijkt.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
  - number: 2:15.4
    text: |-
      Van een inperking van het recht op medezeggenschap van de werknemers als bedoeld in het derde lid is
      sprake, wanneer het aantal leden van het toezichthoudend of het bestuursorgaan van de SCE dat door
      werknemersvertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij aanbevelingen kunnen doen of
      bezwaar kunnen maken, op grond van de overeenkomst lager is dan het hoogste aantal leden ten aanzien waarvan de
      werknemersvertegenwoordigers dat recht konden uitoefenen in de deelnemende juridische lichamen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
  - number: 2:15.5
    text: |-
      Een besluit van de bijzondere onderhandelingsgroep als bedoeld in [artikel 2:14, eerste lid, onderdeel b][ref1],
      behoeft een meerderheid van tweederde van haar aantal leden, tevens vertegenwoordigende tweederde van de werknemers
      en afkomstig uit ten minste twee lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:15.6
    text: |-
      Een besluit als bedoeld in [artikel 2:14, eerste lid, onderdeel b][ref1], kan door de bijzondere
      onderhandelingsgroep niet worden genomen indien de onderhandelingen een SCE betreffen die wordt opgericht door
      omzetting en er in de om te zetten coöperatie medezeggenschap bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:16.1
    text: |-
      Indien de bijzondere onderhandelingsgroep het besluit heeft genomen, bedoeld in
      [artikel 2:14, eerste lid, onderdeel b][ref1], roept de SCE de bijzondere onderhandelingsgroep op schriftelijk
      verzoek van ten minste 10% van de werknemers van de SCE en haar dochterondernemingen en vestigingen, of van hun
      vertegenwoordigers, opnieuw bijeen om in onderhandeling te treden over regelingen op het gebied van de rol van de
      werknemers in de SCE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:16.2
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet gedurende twee jaren na de datum van het besluit, bedoeld in
      [artikel 2:14, eerste lid, onderdeel b][ref1], tenzij met de bijzondere onderhandelingsgroep is overeengekomen de
      onderhandelingen vroeger te heropenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:16.3
    text: |-
      Indien de bijzondere onderhandelingsgroep opnieuw bijeen wordt geroepen zijn de
      [artikelen 2:9, tweede, vierde en vijfde lid][ref1], [2:10, eerste, zevende en achtste lid][ref2], [2:11][ref3],
      [2:12][ref4], [2:13, eerste lid, eerste zin][ref5], [2:14][ref6], [2:15, eerste, tweede en vijfde lid][ref7],
      [2:17][ref8] en [2:19][ref9] van overeenkomstige toepassing, met dien verstande dat verplichtingen die krachtens
      die artikelen rusten op de deelnemende juridische lichamen, betrekking hebben op de SCE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref9]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel216
    references:
      - id: ref1
