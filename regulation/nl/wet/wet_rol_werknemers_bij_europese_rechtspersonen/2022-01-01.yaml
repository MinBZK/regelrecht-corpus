        paragraaf: '2'
        afdeling: '2'
  - number: 2:1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: *betrokken dochteronderneming of vestiging*: een dochteronderneming
      of vestiging van een deelnemend juridisch lichaam, die volgens het voorstel tot oprichting van een SCE bij
      die oprichting een dochteronderneming of vestiging van de SCE wordt; *bijzondere onderhandelingsgroep*:
      de overeenkomstig [artikel 2:9, eerste lid][ref1], ingestelde groep die tot doel heeft met de deelnemende
      juridische lichamen te onderhandelen over de vaststelling van regelingen met betrekking tot de rol van de
      werknemers in de SCE; *deelnemende juridische lichamen*: juridische lichamen die rechtstreeks deelnemen aan
      de oprichting van een SCE; *dochteronderneming van een deelnemend juridisch lichaam of van een SCE*: een
      onderneming waarop door de moederonderneming een overheersende invloed kan worden uitgeoefend zoals omschreven in
      [artikel 2:2][ref2]; *informatie*: inlichtingen die door de SCE worden verstrekt aan de SCE-ondernemingsraad of
      aan de werknemersvertegenwoordigers, over aangelegenheden die 1°. betrekking hebben op de SCE of op een of meer
      van haar dochterondernemingen of vestigingen in een lidstaat, of 2°. de bevoegdheid van de besluitvormingsorganen
      in één lidstaat te buiten gaan; *inschrijving van de SCE*: de inschrijving van de SCE, bedoeld in artikel 12,
      eerste lid, van de verordening; *juridische lichamen*: vennootschappen in de zin van artikel 48, tweede alinea,
      van het Verdrag betreffende de Europese Unie, met inbegrip van coöperaties, alsmede andere overeenkomstig het
      recht van een lidstaat opgerichte en daaronder ressorterende juridische lichamen; *lidstaat*: een lidstaat van de
      Europese Unie of een andere staat die partij is bij de overeenkomst betreffende de Europese Economische Ruimte;
      *medezeggenschap*: de invloed van de ondernemingsraad of van de werknemersvertegenwoordigers op de gang van zaken
      bij een juridisch lichaam door 1°. het recht om een aantal leden van het toezichthoudend of het bestuursorgaan
      van het juridisch lichaam te kiezen of te benoemen, of 2°. het recht om met betrekking tot de benoeming van
      een aantal of alle leden van het toezichthoudend of het bestuursorgaan van het juridisch lichaam aanbevelingen
      te doen of bezwaar te maken; met dien verstande, dat indien het bestuursorgaan overeenkomstig een onderlinge
      taakverdeling leden heeft die belast zijn met het uitvoerend bestuur en leden die daarmee niet zijn belast,
      onder medezeggenschap wordt verstaan het recht ten aanzien van de leden die niet zijn belast met het uitvoerend
      bestuur; *Nederlands deelnemend juridisch lichaam*: het deelnemend juridisch lichaam met statutaire zetel in
      Nederland; *raadpleging*: dialoog en uitwisseling van standpunten tussen de SCE en de SCE-ondernemingsraad of de
      werknemersvertegenwoordigers; *richtlijn*: de [richtlijn nr. 2003/72/EG](32003L0072) van de Raad van de Europese
      Unie van 22 juli 2003 tot aanvulling van het statuut van een Europese coöperatieve vennootschap met betrekking
      tot de rol van de werknemers (PbEG L 207); *rol van de werknemers*: elke procedure, met inbegrip van informatie,
      raadpleging en medezeggenschap, die de werknemersvertegenwoordigers in staat stelt invloed uit te oefenen op binnen
      het juridisch lichaam te nemen besluiten; *SCE*: een Europese coöperatieve vennootschap, opgericht overeenkomstig
      de verordening; *toezichthoudend orgaan, leidinggevend orgaan of bestuursorgaan van de SCE*: wat daaronder wordt
      verstaan in de verordening; *verordening*: de [verordening (EG) nr. 1435/2003](32003R1435) van de Raad van de
      Europese Unie van 22 juli 2003 betreffende het statuut voor een Europese Coöperatieve Vennootschap (SCE) (PbEG
      L 207).


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel21
    references:
      - id: ref1
