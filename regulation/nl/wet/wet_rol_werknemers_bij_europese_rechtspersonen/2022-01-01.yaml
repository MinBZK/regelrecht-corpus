        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 1:5.2
    text: |-
      De bijzondere onderhandelingsgroep of de leden daarvan en een SE-ondernemingsraad kunnen aan de ondernemingskamer
      van het gerechtshof Amsterdam verzoeken om:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel15
  - number: 1:5.2.a
    text: |-
      krachtens [artikel 1:4, vierde en vijfde lid][ref1], [1:12, tweede lid][ref2], of [1:26, derde lid][ref3],
      opgelegde geheimhouding op te heffen op de grond dat degene die de geheimhouding heeft opgelegd bij afweging van de
      betrokken belangen niet in redelijkheid tot het opleggen van geheimhouding had kunnen besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
