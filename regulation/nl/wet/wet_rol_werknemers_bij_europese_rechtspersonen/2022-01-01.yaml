        afdeling: '1'
  - number: 2:1.2
    text: |-
      Handelen of nalaten door het bestuur van de SCE of van de deelnemende juridische lichamen, wordt toegerekend aan de
      natuurlijke persoon of rechtspersoon, die de onderneming in stand houdt.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel21
  - number: 2:2.1
    text: |-
      In dit hoofdstuk wordt verstaan onder moederonderneming: het juridisch lichaam dat direct of indirect een
      overheersende zeggenschap kan uitoefenen op een andere onderneming en dat zelf geen juridisch lichaam is waarover
      door een andere onderneming direct of indirect een overheersende zeggenschap wordt uitgeoefend. Een juridisch
      lichaam wordt, tenzij het tegendeel blijkt, vermoed moederonderneming te zijn, indien zij:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.1.a
    text: |-
      meer dan de helft van de leden van het bestuursorgaan of van het leidinggevend dan wel toezichthoudend orgaan van
      de andere onderneming kan benoemen, of
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.1.b
    text: meer dan de helft van de stemrechten in de algemene vergadering van de andere onderneming kan uitoefenen, of
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.1.c
    text: de meerderheid van het geplaatste kapitaal van de andere onderneming verschaft.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.2
    text: |-
      Voor de toepassing van het eerste lid worden onder de rechten van de moederonderneming ten aanzien van het
      kapitaal, het stemrecht en de benoeming mede begrepen:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.2.a
    text: de overeenkomstige rechten van andere ondernemingen waarop zij overheersende zeggenschap uitoefent;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.2.b
    text: |-
      de overeenkomstige rechten van personen of organen die handelen onder eigen naam doch voor rekening van de
      moederonderneming of van een of meer van haar dochterondernemingen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.3
    text: |-
      Voor de toepassing van het eerste lid worden de rechten ten aanzien van het kapitaal en het stemrecht niet
      toegerekend aan een onderneming, indien zij deze voor rekening van anderen houdt.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.4
    text: |-
      Voor de toepassing van het eerste lid worden stemrechten, verbonden aan verpande aandelen, toegerekend aan de
      pandhouder, indien hij mag bepalen hoe de rechten worden uitgeoefend. Zijn de aandelen evenwel verpand voor een
      lening die de pandhouder heeft verstrekt in de gewone uitoefening van zijn bedrijf, dan worden de stemrechten hem
      slechts toegerekend, indien hij deze in eigen belang heeft uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.5
    text: |-
      Geen moederonderneming is een onderneming als bedoeld in artikel 3, vijfde lid, onder a of c, van [verordening
      (EEG) 4064/89](31989R4064) van de Raad van 21 december 1989 (PbEG L 395) betreffende de controle op concentraties
      van ondernemingen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.6
    text: |-
      Het recht van een lidstaat dat op een juridisch lichaam van toepassing is, bepaalt of dat juridisch lichaam een
      moederonderneming is als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.7
    text: Indien meer juridische lichamen aan een of meer criteria van het eerste lid voldoen,
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.7.a
    text: |-
      wordt het juridisch lichaam dat voldoet aan het criterium onder a aangemerkt als moederonderneming, waarbij het
      benoemingsrecht met betrekking tot het leidinggevend orgaan voorrang heeft;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:2.7.b
    text: |-
      heeft, indien toepassing van onderdeel a niet leidt tot aanmerking van één juridisch lichaam als moederonderneming,
      het criterium onder b voorrang boven dat onder c; een en ander onverminderd het bewijs dat een ander juridisch
      lichaam een overheersende invloed kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel22
  - number: 2:3.1
    text: 'In dit hoofdstuk wordt onder werknemer verstaan:'
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel23
  - number: 2:3.1.a
    text: |-
      voor zover het in Nederland werkzame personen betreft: degene die krachtens een arbeidsovereenkomst werkzaam is in
      de SCE, het deelnemend juridisch lichaam of een betrokken dochteronderneming of vestiging;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel23
  - number: 2:3.1.b
    text: |-
      voor zover het in de overige lidstaten werkzame personen betreft: hetgeen het recht van die lidstaat daaronder
      verstaat.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel23
  - number: 2:3.2
    text: |-
      Voor de toepassing van de [artikelen 2:9, tweede lid][ref1], [2:15, vijfde lid][ref2], ten aanzien van
      de vertegenwoordigers van werknemers in de deelnemende juridische lichamen, [2:16, eerste lid][ref3],
      [2:20, eerste lid][ref4], [2:31, derde lid][ref5], en [2:40][ref6], wordt onder vertegenwoordigers van werknemers
      verstaan: hetgeen daaronder wordt verstaan krachtens het recht van de lidstaat waarin die werknemers werkzaam zijn;
      voor Nederland zijn dat ondernemingsraden.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018115#Artikel2
