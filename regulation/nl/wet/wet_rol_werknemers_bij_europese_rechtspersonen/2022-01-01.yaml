        hoofdstuk: '2'
        afdeling: '5'
  - number: 2:3.3
    text: |-
      In dit hoofdstuk wordt onder de SCE-ondernemingsraad verstaan: het orgaan dat de werknemers vertegenwoordigt,
      ingesteld bij de in [artikel 2:19][ref1] bedoelde overeenkomst of overeenkomstig de voorschriften van
      [afdeling 3][ref2] van dit hoofdstuk ten behoeve van de informatie en raadpleging van de werknemers van de SCE en
      haar dochterondernemingen en vestigingen in de lidstaten of de uitoefening van medezeggenschapsrechten in verband
      met de SCE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:3.4
    text: |-
      Voor de toepassing van [artikel 2:4][ref1] wordt tevens onder de SCE-ondernemingsraad verstaan: het orgaan dat de
      werknemers vertegenwoordigt in een SCE die haar statutaire zetel heeft in een andere lidstaat, en dat is ingesteld
      krachtens de bepalingen in het nationale recht van die lidstaat ter omzetting van artikel 4 van de richtlijn of
      overeenkomstig de voorschriften van de bijlage van de richtlijn, ten behoeve van de informatie en raadpleging
      van de werknemers van de SCE en haar dochterondernemingen en vestigingen in de lidstaten of de uitoefening van
      medezeggenschapsrechten in verband met de SCE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2:4.1
    text: |-
      Ten aanzien van de in Nederland werkzame werknemers die lid zijn van een bijzondere onderhandelingsgroep, de SCE-
      ondernemingsraad, of als werknemersvertegenwoordigers lid zijn van het toezichthoudend of bestuursorgaan van de
      SCE, dan wel optreden als vertegenwoordigers bij een andere wijze van informatieverstrekking en raadpleging van
      werknemers, gelden het tweede tot en met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:4.2
    text: |-
      Deze werknemers behouden hun aanspraak op loon voor de tijd gedurende welke zij niet de bedongen arbeid hebben
      verricht ten gevolge van het bijwonen van een vergadering van de bijzondere onderhandelingsgroep, van de SCE-
      ondernemingsraad, of van het toezichthoudend of bestuursorgaan van de SCE, dan wel van een vergadering in het kader
      van de andere wijze van informatieverstrekking en raadpleging.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:4.3
    text: |-
      Voor zover dat redelijkerwijs noodzakelijk is voor de vervulling van hun taak, wordt hun in werktijd en met behoud
      van loon de gelegenheid geboden tot onderling beraad en overleg met andere personen over aangelegenheden waarbij
      zij in de uitoefening van hun functie zijn betrokken en om scholing en vorming te ontvangen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:4.4
    text: |-
      Zij zijn verplicht tot geheimhouding van alle zaken- en bedrijfsgeheimen die zij in hun hoedanigheid vernemen,
      alsmede van alle aangelegenheden ten aanzien waarvan hun geheimhouding is opgelegd of waarvan zij, in verband met
      opgelegde geheimhouding, het vertrouwelijke karakter moeten begrijpen. Deze verplichting geldt ook voor personen
      die een functie als bedoeld in het eerste lid vervullen zonder werknemer te zijn.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:4.5
    text: |-
      De verplichting tot geheimhouding geldt niet tegenover hem die wordt benaderd als deskundige als bedoeld in
      de [artikelen 2:17, tweede lid][ref1], en [2:32, eerste lid][ref2], mits de deelnemende juridische lichamen
      dan wel de SCE of degene die de geheimhouding heeft opgelegd, vooraf daarvoor toestemming hebben gegeven en de
      betrokken persoon vooraf schriftelijk heeft verklaard dat hij zich ten aanzien van de betrokken aangelegenheid
      tot geheimhouding verplicht. In dat geval is ten aanzien van de bedoelde persoon de geheimhoudingsplicht van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '3'
  - number: 2:4.6
    text: |-
      De plicht tot geheimhouding vervalt niet door beëindiging van de in het eerste lid bedoelde functie, noch door
      beëindiging van de werkzaamheden van de betrokkene in de onderneming.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:4.7
    text: |-
      De werkgever draagt er zorg voor, dat degenen die kandidaat staan of gestaan hebben voor een functie als bedoeld
      in het eerste lid, alsmede degenen die deze functie vervullen of hebben vervuld, niet uit hoofde hiervan worden
      benadeeld in hun positie in de onderneming.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:4.8
    text: |-
      Iedere in Nederland werkzame werknemer of werknemersvertegenwoordiger kan van de werkgever verlangen dat deze
      hem een overzicht geeft van het aantal werknemers dat bij de SCE, de deelnemende juridische lichamen, betrokken
      dochterondernemingen of vestigingen werkzaam is, alsmede van de verdeling van deze werknemers over de lidstaten.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:4.9
    text: |-
      De werkgever van een in Nederland werkzame werknemer die is aangewezen of gekozen als lid van een bijzondere
      onderhandelingsgroep of van de SCE-ondernemingsraad doet daarvan mededeling aan de deelnemende juridische lichamen
      of de SCE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel24
  - number: 2:5.1
    text: |-
      Iedere belanghebbende kan de ondernemingskamer van het gerechtshof Amsterdam verzoeken te bepalen dat gevolg dient
      te worden gegeven aan hetgeen is bepaald bij dit hoofdstuk, met uitzondering van [artikel 2:4][ref1] voor zover
      het tweede lid niet anders bepaalt, of bij een overeenkomst als bedoeld in [artikel 2:19][ref2]. Een bijzondere
      onderhandelingsgroep of de leden daarvan en een SCE-ondernemingsraad, ingesteld krachtens dit hoofdstuk, kunnen
      niet in de proceskosten van deze procedure worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:5.2
    text: |-
      De bijzondere onderhandelingsgroep of de leden daarvan en een SCE-ondernemingsraad kunnen aan de ondernemingskamer
      van het gerechtshof Amsterdam verzoeken om:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel25
  - number: 2:5.2.a
    text: |-
      krachtens [artikel 2:4, vierde en vijfde lid][ref1], [2:13, tweede lid][ref2] of [2:28, derde lid][ref3], opgelegde
      geheimhouding op te heffen op de grond dat degene die de geheimhouding heeft opgelegd bij afweging van de betrokken
      belangen niet in redelijkheid tot het opleggen van geheimhouding had kunnen besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '3'
  - number: 2:5.2.b
    text: |-
      degene die informatie heeft geweigerd krachtens [artikel 2:13, tweede lid][ref1], of [2:28, derde lid][ref2], te
      verplichten tot het verstrekken van informatie op de grond dat deze bij afweging van de betrokken belangen niet in
      redelijkheid tot het weigeren van informatie had kunnen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '3'
  - number: 2:6.1
    text: |-
      Wanneer een SCE een communautaire onderneming is of een moederonderneming in een communautaire groep in
      de zin van de [Wet op de Europese ondernemingsraden][ref1], is [die wet][ref2] niet van toepassing op die
      onderneming en haar dochterondernemingen, tenzij de bijzondere onderhandelingsgroep het besluit, bedoeld in
      [artikel 2:14, eerste lid, onderdeel b][ref3], heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508
      [ref2]: https://wetten.overheid.nl/BWBR0008508
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008508
      - id: ref2
        bwb_id: BWBR0008508
      - id: ref3
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:6.2
    text: |-
      Bij de benoeming van leden van het toezichthoudend orgaan of het bestuursorgaan van een SCE als bedoeld in
      [artikel 2:7][ref1], heeft de ondernemingsraad niet de rechten en bevoegdheden die hem zijn toegekend in de
      [artikelen 63f][ref2], [63g][ref3] en [63i][ref4], de [artikelen 158][ref5], [159][ref6] en [161][ref7] of de
      [artikelen 268][ref8], [269][ref9] en [271 van Boek 2 van het Burgerlijk Wetboek][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel63f
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel63g
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel63i
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel159
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Artikel161
      [ref8]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref9]: https://wetten.overheid.nl/BWBR0003045#Artikel269
      [ref10]: https://wetten.overheid.nl/BWBR0003045#Artikel271
