  - number: 1:20
    text: 'Deze afdeling is van toepassing vanaf de datum van inschrijving van de SE in Nederland indien:'
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel120
  - number: 1:20.a
    text: de deelnemende vennootschappen en de bijzondere onderhandelingsgroep dat overeenkomen, dan wel
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel120
  - number: 1:20.b
    text: |-
      er binnen de in [artikel 1:17][ref1] gestelde termijn geen overeenkomst is gesloten en


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 1:20.b.1°
    text: |-
      elk van de deelnemende vennootschappen besluit ermee in te stemmen dat [afdeling 3][ref1] van dit hoofdstuk met
      betrekking tot de SE wordt toegepast teneinde de SE te kunnen inschrijven en


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '1'
        afdeling: '3'
  - number: 1:20.b.2°
    text: |-
      de bijzondere onderhandelingsgroep niet het in [artikel 1:13, eerste lid, onderdeel b][ref1], bedoelde besluit
      heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 1:21.1
    text: |-
      Onverminderd [artikel 1:20][ref1] is in het geval van oprichting van een SE door omzetting [paragraaf 4][ref2] van
      deze afdeling slechts van toepassing indien op de in een SE omgezette vennootschap wettelijke regels of praktijken
      van toepassing waren betreffende de medezeggenschap van de werknemers in het toezichthoudend of het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1:21.2
    text: |-
      Onverminderd [artikel 1:20][ref1] is in het geval van oprichting van een SE door fusie [paragraaf 4][ref2] van
      deze afdeling slechts van toepassing, indien voor de inschrijving van de SE in een of meer van de deelnemende
      vennootschappen een of meer vormen van medezeggenschap van toepassing waren die


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1:21.2.a
    text: ten minste 25% van het totale aantal werknemers van die vennootschappen bestreken, of
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
  - number: 1:21.2.b
    text: |-
      minder dan 25% van het totale aantal werknemers van die vennootschappen bestreken en de bijzondere
      onderhandelingsgroep daartoe besluit.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
  - number: 1:21.3
    text: |-
      In het geval van oprichting van een SE door oprichting van een moederonderneming of een dochteronderneming is het
      tweede lid van overeenkomstige toepassing, met dien verstande dat het in de onderdelen a en b genoemde percentage
      in dat geval 50 bedraagt.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
  - number: 1:21.4
    text: |-
      Indien in de deelnemende vennootschappen meer dan een vorm van medezeggenschap bestond, besluit de bijzondere
      onderhandelingsgroep welke van die vormen in de SE wordt ingevoerd. Een besluit tot invoering van een vorm van
      medezeggenschap waaruit zou voortvloeien dat het recht op medezeggenschap van de werknemers wordt ingeperkt behoeft
      een meerderheid van tweederde van haar aantal leden, tevens vertegenwoordigende tweederde van de werknemers en
      afkomstig uit ten minste twee lidstaten. Van een inperking van het recht op medezeggenschap van de werknemers
      als bedoeld in de vorige zin is sprake, wanneer het aantal leden van het toezichthoudend of het bestuursorgaan
      van de SE dat door de werknemers of hun vertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij
      aanbevelingen kunnen doen of bezwaar kunnen maken, lager zou zijn dan het hoogste van het aantal leden ten aanzien
      waarvan dat recht vóór de inschrijving van de SE kon worden uitgeoefend in een van de deelnemende vennootschappen.
      Het besluit bevat een beschrijving van de inhoud die het recht van verkiezing of benoeming dan wel het recht van
      aanbeveling of bezwaar heeft in de deelnemende vennootschap van welke het medezeggenschapsregime in de SE wordt
      ingevoerd en van de procedure die ten aanzien van die vennootschap geldt voor de uitoefening van dat recht. De
      bijzondere onderhandelingsgroep deelt het besluit mede aan de deelnemende vennootschappen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
  - number: 1:21.5
    text: |-
      Onverminderd artikel 38 van de verordening wordt bij gebreke van een besluit als bedoeld in het vierde lid, in
      een in Nederland ingeschreven SE als vorm van medezeggenschap ingevoerd het recht van aanbeveling overeenkomstig
      de [artikelen 158][ref1], [159][ref2] en [161 van Boek 2 van het Burgerlijk Wetboek][ref3], indien die artikelen
      of de [artikelen 268][ref4], [269][ref5] en [271 van Boek 2 van het Burgerlijk Wetboek][ref6], op een of meer van
      de deelnemende juridische lichamen van toepassing zijn. In andere gevallen wordt bij gebreke van een besluit als
      bedoeld in het vierde lid in een in Nederland ingeschreven SE als vorm van medezeggenschap ingevoerd het recht van
      verkiezing of benoeming dan wel het recht van aanbeveling of bezwaar dat vóór de inschrijving van de SE kon worden
      uitgeoefend in de deelnemende vennootschap met het hoogste van het aantal leden van het toezichthoudend of het
      bestuursorgaan dat door de werknemers of hun vertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij
      aanbevelingen kunnen doen of bezwaar kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel161
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel269
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel271
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '159'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '161'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '268'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '269'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '271'
  - number: 1:21.6
    text: |-
      Indien met toepassing van de laatste zin van het vijfde lid is vastgesteld welke vorm van medezeggenschap
      wordt ingevoerd, is het recht van verkiezing of benoeming dan wel het recht van aanbeveling of bezwaar
      alsmede de procedure voor de uitoefening van dat recht in overeenstemming met de inhoud van en de procedure
      voor de uitoefening van het betreffende recht ten aanzien van de deelnemende vennootschap van welke het
      medezeggenschapsregime in de SE wordt ingevoerd.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel121
  - number: 1:22.1
    text: De SE stelt een SE-ondernemingsraad in.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel122
  - number: 1:22.2
    text: |-
      De SE-ondernemingsraad bestaat uit werknemers van de SE en van haar dochterondernemingen en vestigingen. Het
      lidmaatschap eindigt van rechtswege wanneer het lid ophoudt werknemer te zijn.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel122
  - number: 1:22.3
    text: |-
      Op de verkiezing of aanwijzing van de leden van de SE-ondernemingsraad is [artikel 1:10, eerste lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1:22.4
    text: |-
      Met betrekking tot de Nederlandse deelnemende vennootschappen, betrokken dochterondernemingen en vestigingen worden
      de leden van de SE-ondernemingsraad aangewezen of verkozen, dan wel wordt hun aanwijzing ingetrokken overeenkomstig
      [artikel 1:10, tweede tot en met het zevende lid][ref1], met dien verstande dat die leden zitting hebben voor de
      duur van vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1:23.1
    text: |-
      Op de samenstelling van de SE-ondernemingsraad is [artikel 1:9, eerste lid][ref1], van overeenkomstige toepassing,
      met dien verstande dat de SE-ondernemingsraad hierbij in de plaats treedt van de bijzondere onderhandelingsgroep.
      Wanneer zich in de SE en haar dochterondernemingen en vestigingen zodanige en blijvende veranderingen voordoen
      dat de samenstelling van de SE-ondernemingsraad niet langer voldoet aan het bepaalde in de eerste zin, stelt de
      SE de SE-ondernemingsraad daarvan zo spoedig mogelijk in kennis. De SE-ondernemingsraad wijzigt zijn samenstelling
      uiterlijk binnen een jaar na de kennisgeving. Zolang de samenstelling van de SE-ondernemingsraad nog niet is
      gewijzigd, hebben de voor een lidstaat zitting hebbende leden, voor de toepassing van de relevante bepalingen
      betreffende de stemverhoudingen binnen de raad, samen zoveel stemmen als overeenkomt met het aantal leden dat na de
      wijziging voor die lidstaat zitting zal hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1:23.2
    text: De SE-ondernemingsraad stelt de SE in kennis van zijn samenstelling.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel123
  - number: 1:23.3
    text: Ieder lid van de SE-ondernemingsraad heeft één stem, zolang door de raad niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel123
  - number: 1:23.4
    text: |-
      Onverminderd [artikel 1:25, tweede lid][ref1], besluit de SE-ondernemingsraad bij volstrekte meerderheid van het
      aantal uitgebrachte stemmen, zolang door de raad niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1:24.1
    text: |-
      De SE-ondernemingsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering de plaatsvervangende voorzitter, vertegenwoordigt de SE-ondernemingsraad
      in rechte.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel124
  - number: 1:24.2
    text: De SE-ondernemingsraad kan uit zijn midden een beperkt comité bestaande uit ten hoogste drie leden kiezen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel124
  - number: 1:24.3
    text: |-
      De SE-ondernemingsraad stelt een reglement van orde vast. Alvorens het reglement wordt vastgesteld wordt het
      bestuursorgaan van de SE in de gelegenheid gesteld zijn standpunt kenbaar te maken. Indien een beperkt comité is
      gekozen regelt het reglement de bevoegdheden daarvan.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel124
  - number: 1:25.1
    text: |-
      Uiterlijk vier jaren na zijn instelling besluit de SE-ondernemingsraad, al dan niet op voorstel van de SE, of
      het wenselijk is met de SE in onderhandeling te treden over het sluiten van een overeenkomst als bedoeld in
      [artikel 1:11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 1:25.2
    text: |-
      De [artikelen 1:14, eerste en tweede lid][ref1], [1:16][ref2], [1:17][ref3], [1:18][ref4] en [1:19][ref5], zijn van
      overeenkomstige toepassing wanneer is besloten om over een overeenkomst te onderhandelen, met dien verstande dat de
      SE-ondernemingsraad hierbij in de plaats treedt van de bijzondere onderhandelingsgroep.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 1:25.3
    text: |-
      Een besluit van de SE-ondernemingsraad tot goedkeuring van een overeenkomst waarin [afdeling 3][ref1] van dit
      hoofdstuk niet langer van toepassing wordt verklaard, of waarin het recht op medezeggenschap van de werknemers
      wordt ingeperkt behoeft een meerderheid van tweederde van zijn aantal leden, tevens vertegenwoordigende tweederde
      van de werknemers en afkomstig uit ten minste twee lidstaten. Van een inperking van het recht op medezeggenschap
      als bedoeld in de eerste zin is sprake, wanneer het aantal leden van het toezichthoudend of het bestuursorgaan
      van de SE dat door werknemersvertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij aanbevelingen
      kunnen doen of bezwaar kunnen maken, op grond van de overeenkomst lager is dan het aantal leden ten aanzien waarvan
      de werknemersvertegenwoordigers dat recht in de SE reeds kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '1'
        afdeling: '3'
  - number: 1:25.4
    text: |-
      Voor de toepassing van dit artikel begint de termijn bedoeld in [artikel 1:17][ref1] op het tijdstip waarop
      krachtens het eerste lid is besloten met de SE in onderhandeling te treden. Wanneer bij het verstrijken van deze
      termijn geen overeenkomst is gesloten blijft deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 1:26.1
    text: |-
      De verstrekking van informatie door de SE geschiedt op een zodanig tijdstip, op een zodanige wijze en met een
      zodanige inhoud dat de SE-ondernemingsraad of de vertegenwoordigers van de werknemers het mogelijke effect ervan
      grondig kunnen beoordelen en desgewenst raadplegingen met de SE kunnen voorbereiden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel126
  - number: 1:26.2
    text: |-
      De raadpleging door de SE van de SE-ondernemingsraad of van de vertegenwoordigers van de werknemers geschiedt
      op een zodanig tijdstip, op een zodanige wijze en met een zodanige inhoud dat de SE-ondernemingsraad of de
      vertegenwoordigers van de werknemers op basis van de verstrekte informatie een mening over de door de SE beoogde
      maatregelen kenbaar kunnen maken waarmee rekening kan worden gehouden in het besluitvormingsproces binnen de SE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel126
  - number: 1:26.3
    text: |-
      De SE is niet verplicht tot het verstrekken van informatie, voor zover dat in redelijkheid het functioneren van
      de SE of haar dochterondernemingen en vestigingen ernstig zou belemmeren dan wel schaden. De SE kan terzake van
      de informatieverstrekking geheimhouding opleggen, indien daarvoor een redelijke grond bestaat. Zoveel mogelijk
      vóór de behandeling van de betrokken aangelegenheid wordt meegedeeld, welke grond bestaat voor het opleggen van
      de geheimhouding, welke schriftelijk of mondeling verstrekte gegevens onder de geheimhouding vallen, hoelang deze
      dient te duren, alsmede of er personen zijn ten aanzien van wie de geheimhouding niet in acht behoeft te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel126
  - number: 1:26.4
    text: |-
      De bevoegdheid van de SE-ondernemingsraad is beperkt tot aangelegenheden die betrekking hebben op de SE zelf,
      op een of meer van haar dochterondernemingen of vestigingen in een andere lidstaat, of die de bevoegdheid van de
      besluitvormingsorganen in een enkele lidstaat te buiten gaan. De SE-ondernemingsraad treedt niet in de rechten en
      bevoegdheden van de werknemers, bedoeld in [artikel 1:6, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1'
  - number: 1:27.1
    text: |-
      Onverminderd [artikel 1:28][ref1] komen de SE en de SE-ondernemingsraad ten minste één maal per kalenderjaar
      in vergadering bijeen. De SE stelt de leiding van plaatselijke ondernemingen of vestigingen in kennis van de
      vergadering. In de vergadering wordt de SE-ondernemingsraad aan de hand van een door de SE opgesteld schriftelijk
      rapport geïnformeerd en geraadpleegd over de gang van zaken bij en de vooruitzichten van de SE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1:27.2
    text: |-
      De informatie en raadpleging betreft in het bijzonder de structuur van de SE, de financieel-economische positie,
      de waarschijnlijke ontwikkeling van het bedrijf en van de productie en omzet, de investeringen, ingrijpende
      veranderingen in de organisatie, de invoering van een nieuwe arbeids- of productiewijze, fusie, verplaatsing,
      inkrimping of sluiting van ondernemingen, vestigingen of belangrijke onderdelen daarvan, de stand en de
      ontwikkeling van de werkgelegenheid en collectief ontslag.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel127
  - number: 1:27.3
    text: |-
      De SE verstrekt de SE-ondernemingsraad de agenda van de vergaderingen van het bestuursorgaan, of van het
      leidinggevend en het toezichthoudend orgaan, alsmede afschriften van alle documenten welke aan de algemene
      vergadering worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel127
  - number: 1:28.1
    text: |-
      De SE licht zo spoedig mogelijk de SE-ondernemingsraad in over alle buitengewone omstandigheden en voorgenomen
      besluiten die aanzienlijke gevolgen hebben voor de belangen van de werknemers, in het bijzonder betreffende
      verplaatsing of sluiting van vestigingen of ondernemingen of collectief ontslag.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel128
  - number: 1:28.2
    text: |-
      Indien de SE-ondernemingsraad of, indien hij daartoe om spoedeisende redenen besluit het beperkt comité,
      dat verzoekt, komt deze met de SE of een ander geschikter bestuursniveau binnen de SE met een eigen
      beslissingsbevoegdheid op het gebied van de te behandelen onderwerpen in vergadering bijeen, om over de in het
      eerste lid genoemde omstandigheden nader te worden geïnformeerd en geraadpleegd. Na afloop van de vergadering of
      binnen een redelijke termijn na de vergadering kan een advies door de SE-ondernemingsraad of het beperkt comité
      worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel128
  - number: 1:28.3
    text: |-
      Indien de SE besluit om het advies van de SE-ondernemingsraad niet te volgen, wordt de raad of het beperkt
      comité in de gelegenheid gesteld om nogmaals met het de SE in vergadering bijeen te komen om te trachten tot
      overeenstemming te komen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel128
  - number: 1:28.4
    text: |-
      De in het tweede en derde lid bedoelde vergadering vindt plaats op een zodanig tijdstip dat die informatie en
      raadpleging nog zinvol is. Deze vergadering doet geen afbreuk aan de bevoegdheden van de SE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel128
  - number: 1:28.5
    text: |-
      Voor een vergadering met het beperkt comité worden mede uitgenodigd de leden van de SE-ondernemingsraad die mede
      gekozen zijn door de werknemers van de vestigingen of ondernemingen die door de maatregelen rechtstreeks worden
      geraakt.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel128
  - number: 1:29.1
    text: |-
      De SE-ondernemingsraad of het beperkt comité is gerechtigd om voor elke vergadering met de SE te vergaderen
      zonder dat laatstbedoelde daarbij vertegenwoordigd is. [Artikel 1:28, vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1:29.2
    text: |-
      Het voorzitterschap van een bijeenkomst als bedoeld in [artikel 1:27][ref1] en [1:28][ref2] wordt, tenzij anders
      wordt afgesproken, afwisselend bekleed door de SE en de SE-ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1:29.3
    text: |-
      Onverminderd enige op hen rustende verplichting tot geheimhouding informeren de leden van de SE-ondernemingsraad
      de werknemersvertegenwoordigers binnen de SE, of, bij afwezigheid van werknemersvertegenwoordigers, alle werknemers
      van de SE en van haar dochterondernemingen en vestigingen over de inhoud en de resultaten van de informatie- en
      raadplegingsprocedure die overeenkomstig deze afdeling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel129
  - number: 1:30.1
    text: |-
      De SE-ondernemingsraad en het beperkt comité kunnen zich doen bijstaan door deskundigen van hun keuze voor zover
      dit voor het verrichten van hun taken noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel130
  - number: 1:30.2
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de SE-ondernemingsraad en
      het beperkt comité komen ten laste van de SE. De verplichting tot het dragen van de kosten van door de SE-
      ondernemingsraad ingeschakelde deskundigen beperkt zich tot één deskundige per agendaonderwerp, tenzij anders wordt
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel130
  - number: 1:30.3
    text: |-
      De eerste volzin van het tweede lid is eveneens van toepassing op het voeren van rechtsgedingen, echter onder de
      voorwaarde dat de SE vooraf van de te maken kosten in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel130
  - number: 1:31.1
    text: |-
      In het geval bedoeld in [artikel 1:21, eerste lid][ref1], behouden de werknemers van de in een SE omgezette
      vennootschap en van haar dochterondernemingen en vestigingen of hun vertegenwoordigingsorgaan alle elementen van
      medezeggenschap die vóór de inschrijving van de SE bestonden in de omgezette vennootschap. Het in deze paragraaf
      voor de andere wijzen van oprichting van de SE bepaalde is daartoe van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1:31.2
    text: |-
      In het geval van oprichting van een SE door fusie, of door oprichting van een moederonderneming of een
      dochteronderneming, hebben de werknemers van de SE en van haar dochterondernemingen en vestigingen of hun
      vertegenwoordigingsorgaan het recht om leden van het toezichthoudend of het bestuursorgaan van de SE te kiezen of
      te benoemen, of om met betrekking tot die benoeming aanbevelingen te doen of bezwaar te maken, voor een aantal dat
      gelijk is aan het hoogste van het aantal leden ten aanzien waarvan dat recht vóór de inschrijving van de SE kon
      worden uitgeoefend in een van de deelnemende vennootschappen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel131
  - number: 1:31.3
    text: |-
      Indien vóór de inschrijving van de SE op geen van de deelnemende vennootschappen regels betreffende de
      medezeggenschap van werknemers van toepassing waren, hoeft de SE geen voorschriften voor medezeggenschap van de
      werknemers in te voeren.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel131
  - number: 1:32.1
    text: |-
      De SE-ondernemingsraad verdeelt de zetels in het toezichthoudend of het bestuursorgaan van de SE waarop een
      medezeggenschapsprocedure van toepassing is, zodanig dat de werknemers worden vertegenwoordigd naar verhouding van
      het aantal werknemers van de SE en van haar dochterondernemingen en vestigingen dat in elke lidstaat werkzaam is.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel132
  - number: 1:32.2
    text: |-
      Indien toepassing van het eerste lid ertoe zou leiden dat na toewijzing van de eerste zetel aan de werknemers van
      de lidstaat met het grootste aantal werknemers, de Nederlandse werknemers of die van een of meer andere lidstaten
      niet vertegenwoordigd worden, wijst de SE-ondernemingsraad de tweede zetel toe aan de werknemers van de SE die in
      Nederland werkzaam zijn. Een derde en volgende zetel wordt toegewezen aan de werknemers uit een van de andere nog
      niet vertegenwoordigde lidstaten.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel132
  - number: 1:32.3
    text: |-
      Het recht om te bepalen welke persoon wordt verkozen of benoemd tot lid van het toezichthoudend of het
      bestuursorgaan van de SE, dan wel ten aanzien van welke personen ten behoeve van de benoeming of verkiezing
      aanbevelingen worden gedaan of bezwaar wordt gemaakt, wordt uitgeoefend door of namens de werknemers in de lidstaat
      aan welke dat recht is toegewezen en geschiedt volgens de in die lidstaat geldende regels of praktijken.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel132
  - number: 1:32.4
    text: |-
      Ten behoeve van de uitoefening van de in het derde lid bedoelde rechten wordt voorafgaand aan de vervulling van
      een vacature in het toezichthoudend of het bestuursorgaan van de SE aan de werknemers tijdig alle noodzakelijke
      informatie verstrekt met betrekking tot die vacature. Aan de werknemers wordt een redelijke termijn gegund voor de
      uitoefening van hun rechten.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel132
  - number: 1:32.5
    text: |-
      Op de uitoefening van het ingevolge het derde lid aan de in Nederland werkzame werknemers toegewezen recht is
      [artikel 1:10, tweede tot en met zevende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1:33
    text: |-
      Elk lid van het toezichthoudend of het bestuursorgaan van de SE ten aanzien van wie door de SE-ondernemingsraad het
      recht op medezeggenschap is uitgeoefend, is van rechtswege lid met dezelfde rechten en plichten als de leden die de
      aandeelhouders vertegenwoordigen, met inbegrip van het stemrecht.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel133
  - number: 1:34.1
    text: |-
      Indien ter uitvoering van de richtlijn in een andere lidstaat dan Nederland een bijzondere onderhandelingsgroep
      dan wel een SE-ondernemingsraad of een andere informatie- en raadplegingsprocedure wordt ingesteld, zijn op de
      verkiezing of aanwijzing van de Nederlandse leden de [artikelen 1:10, tweede tot en met het zevende lid][ref1], en
      [1:22, vierde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1:34.2
    text: |-
      Indien ter uitvoering van de richtlijn in een andere lidstaat dan Nederland door Nederlandse werknemers het
      recht bedoeld in [artikel 1:32, derde lid][ref1], kan worden uitgeoefend, is op de uitoefening van dat recht
      [artikel 1:10, tweede tot en met zevende lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel134
