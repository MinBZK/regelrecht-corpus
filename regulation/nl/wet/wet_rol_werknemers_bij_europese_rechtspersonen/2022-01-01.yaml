        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref8
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref9
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:16.4
    text: |-
      Indien de bijzondere onderhandelingsgroep besluit tot heropening van de onderhandelingen, maar die onderhandelingen
      niet tot een overeenkomst leiden, is [afdeling 3][ref1] van dit hoofdstuk niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:17.1
    text: |-
      De bijzondere onderhandelingsgroep kan de vertegenwoordigers van externe organisaties, waaronder een of meer
      verenigingen van werknemers, in kennis stellen van het openen van onderhandelingen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel217
  - number: 2:17.2
    text: |-
      De bijzondere onderhandelingsgroep kan zich in de onderhandelingen doen bijstaan door een of meer
      deskundigen van haar keuze. De deskundigen kunnen op verzoek van de bijzondere onderhandelingsgroep bij
      onderhandelingsvergaderingen met de deelnemende juridische lichamen aanwezig zijn als adviseur.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel217
  - number: 2:17.3
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de bijzondere
      onderhandelingsgroep komen ten laste van de deelnemende juridische lichamen. Voor de kosten van bijstand door
      deskundigen of van het voeren van rechtsgedingen geldt dit slechts, indien de deelnemende juridische lichamen
      vooraf van de te maken kosten in kennis zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel217
  - number: 2:18.1
    text: |-
      De onderhandelingen beginnen op het tijdstip waarop de eerste vergadering, bedoeld in
      [artikel 2:12, eerste lid][ref1], wordt gehouden en kunnen worden voortgezet gedurende een periode van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:18.2
    text: |-
      De deelnemende juridische lichamen en de bijzondere onderhandelingsgroep kunnen in gezamenlijk overleg besluiten de
      onderhandelingsperiode te verlengen tot een jaar, te rekenen vanaf het in het eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel218
  - number: 2:19.1
    text: |-
      Indien de deelnemende juridische lichamen en de bijzondere onderhandelingsgroep overeenkomen een SCE-
      ondernemingsraad in te stellen, dan regelt de overeenkomst ten minste de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.a
    text: de werkingssfeer van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.b
    text: |-
      de instelling van een SCE-ondernemingsraad die als gesprekspartner van de SCE fungeert in het kader van informatie
      en raadpleging van de werknemers van de SCE en haar dochterondernemingen en vestigingen;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.c
    text: |-
      de omvang en samenstelling van en de zetelverdeling in de SCE-ondernemingsraad, alsmede de zittingsduur van de
      leden;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.d
    text: het werkterrein en de bevoegdheden van de SCE-ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.e
    text: de wijze van informatie en raadpleging van de SCE-ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.f
    text: de frequentie en plaats van de vergaderingen van de SCE-ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.g
    text: de financiële en materiële middelen waarover de SCE-ondernemingsraad kan beschikken;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.h
    text: de datum van inwerkingtreding en de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.i
    text: de gevallen waarin opnieuw over de overeenkomst moet worden onderhandeld;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.j
    text: |-
      de procedure voor onderhandelingen over een nieuwe overeenkomst en de wijze waarop de overeenkomst wordt aangepast
      aan wijzigingen die zich na de oprichting van de SCE hebben voorgedaan in de structuur of grootte van de SCE en
      haar dochterondernemingen en vestigingen en in de aantallen werknemers die in de lidstaten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.1.k
    text: de gevolgen van het niet afsluiten van een nieuwe overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.2
    text: |-
      In de overeenkomst kunnen de regelingen worden opgenomen betreffende het recht van werknemers om deel te nemen aan
      de algemene vergadering of aan de sector- of afdelingsvergadering, vastgesteld overeenkomstig [artikel 2:40][ref1]
      juncto artikel 59, vierde lid, van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '5'
  - number: 2:19.3
    text: |-
      De deelnemende juridische lichamen en de bijzondere onderhandelingsgroep kunnen overeenkomen dat in plaats van de
      SCE-ondernemingsraad een of meer informatie- en raadplegingsprocedures worden ingesteld. Op die overeenkomst is het
      eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.4
    text: |-
      Indien de deelnemende juridische lichamen en de bijzondere onderhandelingsgroep besluiten een
      medezeggenschapsregeling vast te stellen regelt de overeenkomst ten minste de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.4.a
    text: de inhoud van de medezeggenschapsregeling;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.4.b
    text: |-
      het aantal van de leden in het toezichthoudend of het bestuursorgaan van de SCE dat de werknemers gerechtigd zijn
      te kiezen of te benoemen, of met betrekking tot wier benoeming zij aanbevelingen kunnen doen of bezwaar kunnen
      maken;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.4.c
    text: |-
      de procedures voor het kiezen of benoemen van de in onderdeel b bedoelde leden door of het met betrekking tot hun
      benoeming doen van aanbevelingen of maken van bezwaar;
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.4.d
    text: de rechten van de in onderdeel b bedoelde leden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.5
    text: |-
      Indien de SCE is opgericht door omzetting voorziet de overeenkomst ten minste in dezelfde mate in elk aspect van de
      rol van de werknemers als bij de in een SCE om te zetten coöperatie het geval is.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.6
    text: De SCE staat in voor de naleving van rechten en verplichtingen, opgenomen in de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
  - number: 2:19.7
    text: |-
      De referentievoorschriften in [afdeling 3][ref1] van dit hoofdstuk zijn niet van toepassing op de overeenkomst,
      tenzij de overeenkomst anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:19.8
    text: |-
      De toepasselijkheid van [artikel 2:20][ref1] kan in de overeenkomst geheel of gedeeltelijk worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:20.1
    text: |-
      Indien de overeenkomst geen regels bevat als bedoeld in [artikel 2:19, eerste lid, onderdelen i en j][ref1],
      of de daarin opgenomen regels niet inhouden, dat werknemers of hun vertegenwoordigers van ondernemingen of
      vestigingen, die na het sluiten van de overeenkomst tot de SCE zijn gaan behoren, binnen twee jaar worden
      betrokken bij de vernieuwing of aanpassing daarvan dan wel niet binnen twee jaar worden vertegenwoordigd in de SCE-
      ondernemingsraad of bij de andere procedure van informatieverstrekking en raadpleging, is de SCE verplicht om met
      de SCE-ondernemingsraad, of bij ontbreken daarvan met een nieuw samengestelde bijzondere onderhandelingsgroep, te
      onderhandelen over een nieuwe overeenkomst indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:20.1.a
    text: |-
      daarom verzocht wordt door ten minste 100 zodanige werknemers van de SCE en haar dochterondernemingen of hun
      vertegenwoordigers, en
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel220
  - number: 2:20.1.b
    text: |-
      het aantal van die werknemers meer bedraagt dan 20% van het totale aantal werknemers van de SCE en haar
      dochterondernemingen in alle lidstaten tezamen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel220
  - number: 2:20.2
    text: |-
      Indien de overeenkomst geen regels bevat als bedoeld in [artikel 2:19, eerste lid, onderdeel k][ref1], en
      niet binnen een jaar na het tijdstip waarop de eerste vergadering met de SCE-ondernemingsraad of de bijzondere
      onderhandelingsgroep wordt gehouden, een nieuwe overeenkomst is gesloten, is [afdeling 3][ref2] van dit hoofdstuk
      van toepassing tenzij de SCE-ondernemingsraad of de bijzondere onderhandelingsgroep de voorkeur geeft aan
      voortgezette toepassing van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:20.3
    text: |-
      De [artikelen 2:9, tweede, vierde en vijfde lid][ref1], [2:10, eerste, zevende en achtste lid][ref2], [2:11][ref3],
      [2:12][ref4], [2:13, eerste lid, eerste zin][ref5], [2:14][ref6], [2:15, eerste, tweede en vijfde lid][ref7],
      [2:17][ref8] en [2:19][ref9] zijn van overeenkomstige toepassing wanneer overeenkomstig het eerste lid over een
      overeenkomst wordt onderhandeld, met dien verstande dat verplichtingen die krachtens die artikelen rusten op de
      deelnemende juridische lichamen, betrekking hebben op de SCE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018115#Artikel2
