preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de richtlijn nr. 2001/86/EG van de Raad van de Europese Unie van
    8 oktober 2001 tot aanvulling van het statuut van de Europese vennootschap met betrekking tot de rol van de
    werknemers (PbEG L 294) moet worden uitgevoerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#ArtikelAanhef
articles:
  - number: 1:1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: *betrokken dochteronderneming of vestiging*: een dochteronderneming of
      vestiging van een deelnemende vennootschap, die volgens het voorstel tot oprichting van een SE bij die oprichting
      een dochteronderneming of vestiging van de SE wordt; *bijzondere onderhandelingsgroep*: de overeenkomstig
      [artikel 1:8, eerste lid][ref1], ingestelde groep die tot doel heeft met de deelnemende vennootschappen
      te onderhandelen over de vaststelling van regelingen met betrekking tot de rol van de werknemers in de SE;
      *deelnemende vennootschappen*: de vennootschappen die rechtstreeks deelnemen aan de oprichting van een SE;
      *dochteronderneming van een vennootschap*: een onderneming waarop door de moederonderneming een overheersende
      invloed kan worden uitgeoefend zoals omschreven in [artikel 1:2][ref2]; *informatie*: inlichtingen die door de
      SE worden verstrekt aan de SE-ondernemingsraad of aan de werknemersvertegenwoordigers, over aangelegenheden die
      1°. betrekking hebben op de SE of op een of meer van haar dochterondernemingen of vestigingen in een lidstaat,
      of 2°. de bevoegdheid van de besluitvormingsorganen in één lidstaat te buiten gaan; *inschrijving van de SE*: de
      inschrijving van de SE, bedoeld in artikel 12, eerste lid, van de verordening; *lidstaat*: een lidstaat van de
      Europese Unie of een andere staat die partij is bij de overeenkomst betreffende de Europese Economische Ruimte;
      *medezeggenschap*: de invloed van de ondernemingsraad of van de werknemersvertegenwoordigers op de gang van zaken
      bij een vennootschap door 1°. het recht om een aantal leden van het toezichthoudend of het bestuursorgaan van
      de vennootschap te kiezen of te benoemen, of 2°. het recht om met betrekking tot de benoeming van een aantal of
      alle leden van het toezichthoudend of het bestuursorgaan van de vennootschap aanbevelingen te doen of bezwaar
      te maken; met dien verstande, dat indien het bestuursorgaan overeenkomstig een onderlinge taakverdeling leden
      heeft die belast zijn met het uitvoerend bestuur en leden die daarmee niet zijn belast, onder medezeggenschap
      wordt verstaan het recht ten aanzien van de leden die niet zijn belast met het uitvoerend bestuur; *Nederlandse
      deelnemende vennootschap*: de deelnemende vennootschap met statutaire zetel in Nederland; *raadpleging*: dialoog
      en uitwisseling van standpunten tussen de SE en de SE-ondernemingsraad of de werknemersvertegenwoordigers;
      *richtlijn*: de [richtlijn nr. 2001/86/EG](32001L0086) van de Raad van de Europese Unie van 8 oktober 2001 tot
      aanvulling van het statuut van de Europese vennootschap met betrekking tot de rol van de werknemers (PbEG L 294);
      *rol van de werknemers*: elke procedure, met inbegrip van informatie, raadpleging en medezeggenschap, die de
      werknemersvertegenwoordigers in staat stelt invloed uit te oefenen op de binnen de vennootschap te nemen besluiten;
      *SE*: een Europese naamloze vennootschap, opgericht overeenkomstig de verordening; *toezichthoudend orgaan,
      leidinggevend orgaan of bestuursorgaan van de SE*: wat daaronder wordt verstaan in de verordening; *verordening*:
      de [verordening (EG) nr. 2157/2001](32001R2157) van de Raad van de Europese Unie van 8 oktober 2001 betreffende het
      statuut van de Europese vennootschap (SE) (PbEG L 294).


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel11
