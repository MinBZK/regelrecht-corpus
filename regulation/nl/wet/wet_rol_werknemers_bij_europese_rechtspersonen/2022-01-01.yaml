        afdeling: '2'
  - number: 2:40.c.4°
    text: |-
      [paragraaf 4 van afdeling 3][ref1] van dit hoofdstuk van toepassing is, alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '3'
  - number: 2:40.c.5°
    text: |-
      in de onder c bedoelde deelnemende coöperatie waarop de deelnemingsregeling, bedoeld in de aanhef, van toepassing
      was, het hoogste niveau van medezeggenschap bestond zoals dat gold in de betrokken deelnemende juridische lichamen
      vóór de inschrijving van de SCE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
  - number: 2:41.1
    text: |-
      Indien ter uitvoering van de richtlijn in een andere lidstaat dan Nederland een bijzondere onderhandelingsgroep
      dan wel een SCE-ondernemingsraad of een andere informatie- en raadplegingsprocedure wordt ingesteld, zijn op de
      verkiezing of aanwijzing van de Nederlandse leden de [artikelen 2:11, tweede tot en met achtste lid][ref1], en
      [2:24, vierde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel241
    references:
