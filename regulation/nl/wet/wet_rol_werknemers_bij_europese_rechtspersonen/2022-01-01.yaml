  - number: 2:21.1
    text: |-
      Deze afdeling is van toepassing in het geval van oprichting van een SCE door ten minste twee juridische lichamen of
      door omzetting.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel221
  - number: 2:21.2
    text: |-
      In het geval van oprichting van een SCE door uitsluitend natuurlijke personen of door slechts één juridisch lichaam
      en natuurlijke personen, is deze afdeling van overeenkomstige toepassing, indien het totale aantal werknemers van
      de SCE en haar dochterondernemingen en vestigingen in ten minste twee lidstaten ten minste 50 zal bedragen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel221
  - number: 2:21.3
    text: |-
      [Artikel 2:7, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2:22
    text: 'Deze afdeling is van toepassing vanaf de datum van inschrijving van de SCE in Nederland indien:'
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel222
  - number: 2:22.a
    text: de deelnemende juridische lichamen en de bijzondere onderhandelingsgroep dat overeenkomen, dan wel
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel222
  - number: 2:22.b
    text: |-
      er binnen de in [artikel 2:18][ref1] gestelde termijn geen overeenkomst is gesloten, en


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:22.b.1°
    text: |-
      elk van de deelnemende juridische lichamen besluit ermee in te stemmen dat [afdeling 3][ref1] van dit hoofdstuk met
      betrekking tot de SCE wordt toegepast teneinde de SCE te kunnen inschrijven, en


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:22.b.2°
    text: |-
      de bijzondere onderhandelingsgroep niet het in [artikel 2:14, eerste lid, onderdeel b][ref1], bedoelde besluit
      heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:23.1
    text: |-
      Onverminderd [artikel 2:22][ref1] is in het geval van oprichting van een SCE door omzetting [paragraaf 4][ref2] van
      deze afdeling slechts van toepassing, indien op de in een SCE omgezette coöperatie wettelijke regels of praktijken
      van toepassing waren betreffende de medezeggenschap van de werknemers in het toezichthoudend of het bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '3'
  - number: 2:23.2
    text: |-
      Onverminderd [artikel 2:22][ref1] is in het geval van oprichting van een SCE door fusie [paragraaf 4][ref2] van
      deze afdeling slechts van toepassing, indien voor de inschrijving van de SCE in een of meer van de deelnemende
      coöperaties een of meer vormen van medezeggenschap van toepassing waren die


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '3'
  - number: 2:23.2.a
    text: ten minste 25% van het totale aantal werknemers van die coöperaties bestreken, of
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
  - number: 2:23.2.b
    text: |-
      minder dan 25% van het totale aantal werknemers van die coöperaties bestreken en de bijzondere onderhandelingsgroep
      daartoe besluit.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
  - number: 2:23.3
    text: |-
      In het geval van oprichting van een SCE op enige andere wijze is het tweede lid van overeenkomstige toepassing, met
      dien verstande dat het in de onderdelen a en b van dat lid genoemde percentage in dat geval 50 bedraagt.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
  - number: 2:23.4
    text: |-
      Indien in de deelnemende juridische lichamen meer dan één vorm van medezeggenschap bestond, besluit de bijzondere
      onderhandelingsgroep welke van die vormen in de SCE wordt ingevoerd. Een besluit tot invoering van een vorm van
      medezeggenschap waaruit zou voortvloeien dat het recht op medezeggenschap van de werknemers wordt ingeperkt behoeft
      een meerderheid van tweederde van haar aantal leden, tevens vertegenwoordigende tweederde van de werknemers en
      afkomstig uit ten minste twee lidstaten. Van een inperking van het recht op medezeggenschap van de werknemers
      als bedoeld in de vorige zin is sprake, wanneer het aantal leden van het toezichthoudend of het bestuursorgaan
      van de SCE dat door de werknemers of hun vertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij
      aanbevelingen kunnen doen of bezwaar kunnen maken, lager zou zijn dan het hoogste van het aantal leden ten aanzien
      waarvan dat recht vóór de inschrijving van de SCE kon worden uitgeoefend in een van de deelnemende juridische
      lichamen. Het besluit bevat een beschrijving van de inhoud die het recht van verkiezing of benoeming dan wel het
      recht van aanbeveling of bezwaar heeft in het deelnemend juridisch lichaam van welke het medezeggenschapsregime in
      de SCE wordt ingevoerd en van de procedure die ten aanzien van dat juridisch lichaam geldt voor de uitoefening van
      dat recht. De bijzondere onderhandelingsgroep deelt het besluit mede aan de deelnemende juridische lichamen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
  - number: 2:23.5
    text: |-
      Onverminderd artikel 36 van de verordening wordt bij gebreke van een besluit als bedoeld in het vierde lid, in
      een in Nederland ingeschreven SCE als vorm van medezeggenschap ingevoerd het recht van aanbeveling overeenkomstig
      de [artikelen 158][ref1] en [159 van Boek 2 van het Burgerlijk Wetboek][ref2], indien die artikelen of de
      [artikelen 268][ref3] en [269 van Boek 2 van het Burgerlijk Wetboek][ref4], op een of meer van de deelnemende
      juridische lichamen van toepassing zijn. In andere gevallen wordt bij gebreke van een besluit als bedoeld in het
      vierde lid, in een in Nederland ingeschreven SCE als vorm van medezeggenschap ingevoerd het recht van verkiezing
      of benoeming dan wel het recht van aanbeveling of bezwaar dat vóór de inschrijving van de SCE kon worden
      uitgeoefend in het deelnemend juridisch lichaam met het hoogste van het aantal leden van het toezichthoudend of het
      bestuursorgaan dat door de werknemers of hun vertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij
      aanbevelingen kunnen doen of bezwaar kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel269
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '159'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '268'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '269'
  - number: 2:23.6
    text: |-
      Indien met toepassing van de laatste zin van het vijfde lid is vastgesteld welke vorm van medezeggenschap
      wordt ingevoerd, is het recht van verkiezing of benoeming dan wel het recht van aanbeveling of bezwaar
      alsmede de procedure voor de uitoefening van dat recht in overeenstemming met de inhoud van en de procedure
      voor de uitoefening van het betreffende recht ten aanzien van het deelnemend juridisch lichaam van welk het
      medezeggenschapsregime in de SCE wordt ingevoerd.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel223
  - number: 2:24.1
    text: De SCE stelt een SCE-ondernemingsraad in.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel224
  - number: 2:24.2
    text: |-
      De SCE-ondernemingsraad bestaat uit werknemers van de SCE en van haar dochterondernemingen en vestigingen. Het
      lidmaatschap eindigt van rechtswege wanneer het lid ophoudt werknemer te zijn.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel224
  - number: 2:24.3
    text: |-
      Op de verkiezing of aanwijzing van de leden van de SCE-ondernemingsraad is
      [artikel 2:11, eerste en achtste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2:24.4
    text: |-
      Met betrekking tot de Nederlandse deelnemende juridische lichamen, betrokken dochterondernemingen en vestigingen
      worden de leden van de SCE-ondernemingsraad aangewezen of verkozen, dan wel wordt hun aanwijzing ingetrokken
      overeenkomstig [artikel 2:11, tweede tot en met het achtste lid][ref1], met dien verstande dat die leden zitting
      hebben voor de duur van vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2:25.1
    text: |-
      Op de samenstelling van de SCE-ondernemingsraad is [artikel 2:10, eerste lid][ref1], van overeenkomstige
      toepassing, met dien verstande dat de SCE-ondernemingsraad hierbij in de plaats treedt van de bijzondere
      onderhandelingsgroep. Wanneer zich in de SCE en haar dochterondernemingen en vestigingen zodanige en blijvende
      veranderingen voordoen dat de samenstelling van de SCE-ondernemingsraad niet langer voldoet aan het bepaalde in
      de eerste zin, stelt de SCE de SCE-ondernemingsraad daarvan zo spoedig mogelijk in kennis. De SCE-ondernemingsraad
      wijzigt zijn samenstelling uiterlijk binnen een jaar na de kennisgeving. Zolang de samenstelling van de SCE-
      ondernemingsraad nog niet is gewijzigd, hebben de voor een lidstaat zitting hebbende leden, voor de toepassing van
      de relevante bepalingen betreffende de stemverhoudingen binnen de raad, samen zoveel stemmen als overeenkomt met
      het aantal leden dat na de wijziging voor die lidstaat zitting zal hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2:25.2
    text: De SCE-ondernemingsraad stelt de SCE in kennis van zijn samenstelling.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel225
  - number: 2:25.3
    text: Ieder lid van de SCE-ondernemingsraad heeft één stem, zolang door de raad niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel225
  - number: 2:25.4
    text: |-
      Onverminderd [artikel 2:27, tweede lid][ref1], besluit de SCE-ondernemingsraad bij volstrekte meerderheid van het
      aantal uitgebrachte stemmen, zolang door de raad niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2:26.1
    text: |-
      De SCE-ondernemingsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering de plaatsvervangende voorzitter, vertegenwoordigt de SCE-ondernemingsraad
      in rechte.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel226
  - number: 2:26.2
    text: De SCE-ondernemingsraad kan uit zijn midden een beperkt comité bestaande uit ten hoogste drie leden kiezen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel226
  - number: 2:26.3
    text: |-
      De SCE-ondernemingsraad stelt een reglement van orde vast. Alvorens het reglement wordt vastgesteld wordt het
      bestuursorgaan van de SCE in de gelegenheid gesteld zijn standpunt kenbaar te maken. Indien een beperkt comité is
      gekozen regelt het reglement de bevoegdheden daarvan.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel226
  - number: 2:27.1
    text: |-
      Uiterlijk vier jaren na zijn instelling besluit de SCE-ondernemingsraad, al dan niet op voorstel van de SCE,
      of het wenselijk is met de SCE in onderhandeling te treden over het sluiten van een overeenkomst als bedoeld in
      [artikel 2:12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:27.2
    text: |-
      De [artikelen 2:15, eerste en tweede lid][ref1], [2:17][ref2], [2:18][ref3], [2:19][ref4] en [2:20][ref5], zijn van
      overeenkomstige toepassing wanneer is besloten om over een overeenkomst te onderhandelen, met dien verstande dat de
      SCE-ondernemingsraad hierbij in de plaats treedt van de bijzondere onderhandelingsgroep.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:27.3
    text: |-
      Een besluit van de SCE-ondernemingsraad tot goedkeuring van een overeenkomst waarin [afdeling 3][ref1] van dit
      hoofdstuk niet langer van toepassing wordt verklaard, of waarin het recht op medezeggenschap van de werknemers
      wordt ingeperkt behoeft een meerderheid van tweederde van zijn aantal leden, tevens vertegenwoordigende tweederde
      van de werknemers en afkomstig uit ten minste twee lidstaten. Van een inperking van het recht op medezeggenschap
      als bedoeld in de eerste zin is sprake, wanneer het aantal leden van het toezichthoudend of het bestuursorgaan
      van de SCE dat door werknemersvertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij aanbevelingen
      kunnen doen of bezwaar kunnen maken, op grond van de overeenkomst lager is dan het aantal leden ten aanzien waarvan
      de werknemersvertegenwoordigers dat recht in de SCE reeds kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:27.4
    text: |-
      Voor de toepassing van dit artikel begint de termijn, bedoeld in [artikel 2:18][ref1], op het tijdstip waarop
      krachtens het eerste lid is besloten met de SCE in onderhandeling te treden. Wanneer bij het verstrijken van deze
      termijn geen overeenkomst is gesloten blijft deze afdeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:28.1
    text: |-
      De verstrekking van informatie door de SCE geschiedt op een zodanig tijdstip, op een zodanige wijze en met een
      zodanige inhoud dat de SCE-ondernemingsraad of de vertegenwoordigers van de werknemers het mogelijke effect ervan
      grondig kunnen beoordelen en desgewenst raadplegingen met de SCE kunnen voorbereiden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel228
  - number: 2:28.2
    text: |-
      De raadpleging door de SCE van de SCE-ondernemingsraad of van de vertegenwoordigers van de werknemers geschiedt
      op een zodanig tijdstip, op een zodanige wijze en met een zodanige inhoud dat de SCE-ondernemingsraad of de
      vertegenwoordigers van de werknemers op basis van de verstrekte informatie een mening over de door de SCE beoogde
      maatregelen kenbaar kunnen maken waarmee rekening kan worden gehouden in het besluitvormingsproces binnen de SCE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel228
  - number: 2:28.3
    text: |-
      De SCE is niet verplicht tot het verstrekken van informatie, voor zover dat in redelijkheid het functioneren van
      de SCE of haar dochterondernemingen en vestigingen ernstig zou belemmeren dan wel schaden. De SCE kan terzake van
      de informatieverstrekking geheimhouding opleggen, indien daarvoor een redelijke grond bestaat. Zoveel mogelijk
      vóór de behandeling van de betrokken aangelegenheid wordt meegedeeld, welke grond bestaat voor het opleggen van
      de geheimhouding, welke schriftelijk of mondeling verstrekte gegevens onder de geheimhouding vallen, hoelang deze
      dient te duren, alsmede of er personen zijn ten aanzien van wie de geheimhouding niet in acht behoeft te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel228
  - number: 2:28.4
    text: |-
      De bevoegdheid van de SCE-ondernemingsraad is beperkt tot aangelegenheden die betrekking hebben op de SCE zelf,
      op een of meer van haar dochterondernemingen of vestigingen in een andere lidstaat, of die de bevoegdheid van de
      besluitvormingsorganen in een enkele lidstaat te buiten gaan. De SCE-ondernemingsraad treedt niet in de rechten en
      bevoegdheden van de werknemers, bedoeld in [artikel 2:6, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 2:29.1
    text: |-
      Onverminderd [artikel 2:30][ref1] komen de SCE en de SCE-ondernemingsraad ten minste één maal per kalenderjaar
      in vergadering bijeen. De SCE stelt de leiding van plaatselijke ondernemingen of vestigingen in kennis van de
      vergadering. In de vergadering wordt de SCE-ondernemingsraad aan de hand van een door de SCE opgesteld schriftelijk
      rapport geïnformeerd en geraadpleegd over de gang van zaken bij en de vooruitzichten van de SCE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '3'
  - number: 2:29.2
    text: |-
      De informatie en raadpleging betreft in het bijzonder de structuur van de SCE, de financieel-economische positie,
      de waarschijnlijke ontwikkeling van het bedrijf en van de productie en omzet, initiatieven met betrekking
      tot maatschappelijk verantwoord ondernemen, de investeringen, ingrijpende veranderingen in de organisatie, de
      invoering van een nieuwe arbeids- of productiewijze, fusie, verplaatsing, inkrimping of sluiting van ondernemingen,
      vestigingen of belangrijke onderdelen daarvan, de stand en de ontwikkeling van de werkgelegenheid en collectief
      ontslag.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel229
  - number: 2:29.3
    text: |-
      De SCE verstrekt de SCE-ondernemingsraad de agenda van de vergaderingen van het bestuursorgaan, of van het
      leidinggevend en het toezichthoudend orgaan, alsmede afschriften van alle documenten welke aan de algemene
      vergadering worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel229
  - number: 2:30.1
    text: |-
      De SCE licht zo spoedig mogelijk de SCE-ondernemingsraad in over alle buitengewone omstandigheden en voorgenomen
      besluiten die aanzienlijke gevolgen hebben voor de belangen van de werknemers, in het bijzonder betreffende
      verplaatsing of sluiting van vestigingen of ondernemingen of collectief ontslag.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel230
  - number: 2:30.2
    text: |-
      Indien de SCE-ondernemingsraad of, indien hij daartoe om spoedeisende redenen besluit het beperkt comité,
      dat verzoekt, komt deze met de SCE of een ander geschikter bestuursniveau binnen de SCE met een eigen
      beslissingsbevoegdheid op het gebied van de te behandelen onderwerpen in vergadering bijeen, om over de in het
      eerste lid genoemde omstandigheden nader te worden geïnformeerd en geraadpleegd. Na afloop van de vergadering of
      binnen een redelijke termijn na de vergadering kan een advies door de SCE-ondernemingsraad of het beperkt comité
      worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel230
  - number: 2:30.3
    text: |-
      Indien de SCE besluit om het advies van de SCE-ondernemingsraad niet te volgen, wordt de raad of het beperkt comité
      in de gelegenheid gesteld om nogmaals met de SCE in vergadering bijeen te komen om te trachten tot overeenstemming
      te komen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel230
  - number: 2:30.4
    text: |-
      De in het tweede en derde lid bedoelde vergadering vindt plaats op een zodanig tijdstip dat die informatie en
      raadpleging nog zinvol is. Deze vergadering doet geen afbreuk aan de bevoegdheden van de SCE.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel230
  - number: 2:30.5
    text: |-
      Voor een vergadering met het beperkt comité worden mede uitgenodigd de leden van de SCE-ondernemingsraad die mede
      gekozen zijn door de werknemers van de vestigingen of ondernemingen die door de maatregelen rechtstreeks worden
      geraakt.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel230
  - number: 2:31.1
    text: |-
      De SCE-ondernemingsraad of het beperkt comité is gerechtigd om voor elke vergadering met de SCE te vergaderen
      zonder dat laatstbedoelde daarbij vertegenwoordigd is. [Artikel 2:30, vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '3'
  - number: 2:31.2
    text: |-
      Het voorzitterschap van een bijeenkomst als bedoeld in de [artikelen 2:29][ref1] en [2:30][ref2] wordt, tenzij
      anders wordt afgesproken, afwisselend bekleed door de SCE en de SCE-ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '3'
  - number: 2:31.3
    text: |-
      Onverminderd enige op hen rustende verplichting tot geheimhouding informeren de leden van de SCE-ondernemingsraad
      de werknemersvertegenwoordigers binnen de SCE, of, bij afwezigheid van werknemersvertegenwoordigers, alle
      werknemers van de SCE en van haar dochterondernemingen en vestigingen over de inhoud en de resultaten van de
      informatie- en raadplegingsprocedure die overeenkomstig deze afdeling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel231
  - number: 2:32.1
    text: |-
      De SCE-ondernemingsraad en het beperkt comité kunnen zich doen bijstaan door deskundigen van hun keuze voor zover
      dit voor het verrichten van hun taken noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel232
  - number: 2:32.2
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de SCE-ondernemingsraad en
      het beperkt comité komen ten laste van de SCE. De verplichting tot het dragen van de kosten van door de SCE-
      ondernemingsraad ingeschakelde deskundigen beperkt zich tot één deskundige per agendaonderwerp, tenzij anders wordt
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel232
  - number: 2:32.3
    text: |-
      De eerste volzin van het tweede lid is eveneens van toepassing op het voeren van rechtsgedingen, echter onder de
      voorwaarde dat de SCE vooraf van de te maken kosten in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel232
  - number: 2:33.1
    text: |-
      In het geval, bedoeld in [artikel 2:23, eerste lid][ref1], behouden de werknemers van de in een SCE omgezette
      coöperatie en van haar dochterondernemingen en vestigingen of hun vertegenwoordigingsorgaan alle elementen van
      medezeggenschap die vóór de inschrijving van de SCE bestonden in de omgezette coöperatie. Het in deze paragraaf
      voor de andere wijzen van oprichting van de SCE bepaalde is daartoe van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2:33.2
    text: |-
      In de andere gevallen van oprichting van een SCE, hebben de werknemers van de SCE en van haar dochterondernemingen
      en vestigingen of hun vertegenwoordigingsorgaan het recht om leden van het toezichthoudend of het bestuursorgaan
      van de SCE te kiezen of te benoemen, of om met betrekking tot die benoeming aanbevelingen te doen of bezwaar te
      maken, voor een aantal dat gelijk is aan het hoogste van het aantal leden ten aanzien waarvan dat recht vóór de
      inschrijving van de SCE kon worden uitgeoefend in een van de deelnemende juridische lichamen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel233
  - number: 2:33.3
    text: |-
      Indien vóór de inschrijving van de SCE op geen van de deelnemende juridische lichamen regels betreffende de
      medezeggenschap van werknemers van toepassing waren, hoeft de SCE geen voorschriften voor medezeggenschap van de
      werknemers in te voeren.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel233
  - number: 2:34.1
    text: |-
      De SCE-ondernemingsraad verdeelt de zetels in het toezichthoudend of het bestuursorgaan van de SCE waarop een
      medezeggenschapsprocedure van toepassing is, zodanig dat de werknemers worden vertegenwoordigd naar verhouding van
      het aantal werknemers van de SCE en van haar dochterondernemingen en vestigingen dat in elke lidstaat werkzaam is.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel234
  - number: 2:34.2
    text: |-
      Indien toepassing van het eerste lid ertoe zou leiden dat na toewijzing van de eerste zetel aan de werknemers van
      de lidstaat met het grootste aantal werknemers, de Nederlandse werknemers of die van een of meer andere lidstaten
      niet vertegenwoordigd worden, wijst de SCE-ondernemingsraad de tweede zetel toe aan de werknemers van de SCE die in
      Nederland werkzaam zijn. Een derde en volgende zetel wordt toegewezen aan de werknemers uit een van de andere nog
      niet vertegenwoordigde lidstaten.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel234
  - number: 2:34.3
    text: |-
      Het recht om te bepalen welke persoon wordt verkozen of benoemd tot lid van het toezichthoudend of het
      bestuursorgaan van de SCE, dan wel ten aanzien van welke personen ten behoeve van de benoeming of verkiezing
      aanbevelingen worden gedaan of bezwaar wordt gemaakt, wordt uitgeoefend door of namens de werknemers in de lidstaat
      aan welke dat recht is toegewezen en geschiedt volgens de in die lidstaat geldende regels of praktijken.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel234
  - number: 2:34.4
    text: |-
      Ten behoeve van de uitoefening van de in het derde lid bedoelde rechten wordt voorafgaand aan de vervulling van
      een vacature in het toezichthoudend of het bestuursorgaan van de SCE aan de werknemers tijdig alle noodzakelijke
      informatie verstrekt met betrekking tot die vacature. Aan de werknemers wordt een redelijke termijn gegund voor de
      uitoefening van hun rechten.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel234
  - number: 2:34.5
    text: |-
      Op de uitoefening van het ingevolge het derde lid aan de in Nederland werkzame werknemers toegewezen recht is
      [artikel 2:11, tweede tot en met achtste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2:35
    text: |-
      Elk lid van het toezichthoudend of het bestuursorgaan van de SCE ten aanzien van wie door de SCE-ondernemingsraad
      het recht op medezeggenschap is uitgeoefend, is van rechtswege lid met dezelfde rechten en plichten als de leden
      die de leden van de SCE vertegenwoordigen, met inbegrip van het stemrecht.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel235
  - number: 2:36
    text: |-
      Deze afdeling is slechts van toepassing in het geval van oprichting van een SCE door uitsluitend natuurlijke
      personen of door slechts één juridisch lichaam en natuurlijke personen, indien het totale aantal werknemers van de
      SCE en haar dochterondernemingen en vestigingen minder dan 50 bedraagt of 50 of meer in slechts één lidstaat.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel236
  - number: 2:37.1
    text: |-
      In het geval van oprichting van een SCE als bedoeld in [artikel 2:36][ref1], geldt met betrekking tot de rol
      van de werknemers in de SCE zelf, het recht dat in de lidstaat waarin de SCE haar statutaire zetel heeft,
      van toepassing is op gelijksoortige lichamen. Ten aanzien van een SCE met statutaire zetel in Nederland
      is dat het recht op grond van de [Wet op de ondernemingsraden][ref2] en de [artikelen 158][ref3] en
      [159 van Boek 2 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel159
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '158'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '159'
  - number: 2:37.2
    text: |-
      Ten aanzien van de dochterondernemingen en vestigingen van de SCE geldt met betrekking tot de rol van de werknemers
      het recht, dat in de lidstaat waarin deze dochterondernemingen en vestigingen zijn gevestigd, van toepassing is
      op gelijksoortige lichamen. Ten aanzien van in Nederland gevestigde dochterondernemingen en vestigingen is dat het
      recht op grond van de [Wet op de ondernemingsraden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 2:37.3
    text: |-
      Indien de statutaire zetel van een SCE, waarop regels betreffende de medezeggenschap van werknemers van toepassing
      zijn, verplaatst wordt naar een andere lidstaat, blijft ten minste hetzelfde niveau van medezeggenschap in die SCE
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel237
  - number: 2:38
    text: |-
      Indien na de inschrijving van een SCE als bedoeld in [artikel 2:36][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 2:38.a
    text: |-
      ten minste eenderde van het totale aantal werknemers van de SCE en van haar dochterondernemingen en vestigingen in
      ten minste twee verschillende lidstaten hierom verzoekt, of
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel238
  - number: 2:38.b
    text: |-
      het totale aantal werknemers van de SCE en van haar dochterondernemingen en vestigingen in ten minste twee
      lidstaten 50 of meer bedraagt, zijn de [afdelingen 2][ref1] en [3][ref2] van dit hoofdstuk van overeenkomstige
      toepassing, met dien verstande dat verplichtingen die krachtens die afdelingen rusten op de deelnemende
      juridische lichamen en betrokken dochterondernemingen en vestigingen, betrekking hebben op de SCE respectievelijk
      dochterondernemingen en vestigingen van de SCE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:39.1
    text: |-
      Deze afdeling is van toepassing in het geval van oprichting van een SCE door ten minste twee juridische lichamen of
      door omzetting.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel239
  - number: 2:39.2
    text: |-
      In het geval van oprichting van een SCE door uitsluitend natuurlijke personen of door slechts één juridisch lichaam
      en natuurlijke personen, is deze afdeling van overeenkomstige toepassing, indien het totale aantal werknemers van
      de SCE en haar dochterondernemingen en vestigingen in ten minste twee lidstaten ten minste 50 zal bedragen.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel239
  - number: 2:39.3
    text: |-
      [Artikel 2:7, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2:40
    text: |-
      Onverminderd artikel 59, vierde lid, van de verordening kunnen de werknemers van de SCE of de
      werknemersvertegenwoordigers deelnemen aan de algemene vergadering of aan de sector- of afdelingsvergadering en
      stemrecht uitoefenen, indien:
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
  - number: 2:40.a
    text: |-
      de deelnemende juridische lichamen en de bijzondere onderhandelingsgroep daartoe hebben besloten bij de
      overeenkomst, bedoeld in [artikel 2:12, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:40.b
    text: een coöperatie, waarop een regeling als bedoeld in de aanhef van toepassing is, wordt omgezet in een SCE, of
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
  - number: 2:40.c
    text: |-
      in het geval van een SCE die is opgericht anders dan door omzetting, een regeling als bedoeld in de aanhef, op een
      van de deelnemende juridische lichamen van toepassing was, en
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
  - number: 2:40.c.1°
    text: |-
      de deelnemende juridische lichamen en de bijzondere onderhandelingsgroep niet binnen de in [artikel 2:18][ref1]
      bedoelde termijn tot goedkeuring van een overeenkomst als bedoeld in [artikel 2:12, eerste lid][ref2], konden
      besluiten,


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2:40.c.2°
    text: |-
      elk van de deelnemende juridische lichamen heeft besloten ermee in te stemmen dat [afdeling 3][ref1] van dit
      hoofdstuk met betrekking tot de SCE wordt toegepast teneinde de SCE te kunnen inschrijven,


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
        afdeling: '3'
  - number: 2:40.c.3°
    text: |-
      de bijzondere onderhandelingsgroep niet het in [artikel 2:14, eerste lid, onderdeel b][ref1], bedoelde besluit
      heeft genomen,


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel240
    references:
      - id: ref1
