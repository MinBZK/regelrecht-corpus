    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel32
  - number: 3:3
    text: 'Deze wet wordt aangehaald als: Wet rol werknemers bij Europese rechtspersonen.'
    url: https://wetten.overheid.nl/BWBR0018115/2022-01-01#Artikel33
