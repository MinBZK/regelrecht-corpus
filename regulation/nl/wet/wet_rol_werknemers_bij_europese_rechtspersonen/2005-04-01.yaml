      - id: ref9
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:9.4
    text: |-
      Indien de bijzondere onderhandelingsgroep besluit tot heropening van de onderhandelingen, maar die onderhandelingen
      niet tot een overeenkomst leiden, is [hoofdstuk 3][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '3'
  - number: 2:10.1
    text: |-
      De bijzondere onderhandelingsgroep kan de vertegenwoordigers van externe organisaties, waaronder een of meer
      verenigingen van werknemers, in kennis stellen van het openen van onderhandelingen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel210
  - number: 2:10.2
    text: |-
      De bijzondere onderhandelingsgroep kan zich in de onderhandelingen doen bijstaan door een of meer
      deskundigen van haar keuze. De deskundigen kunnen op verzoek van de bijzondere onderhandelingsgroep bij
      onderhandelingsvergaderingen met de deelnemende vennootschappen aanwezig zijn als adviseur.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel210
  - number: 2:10.3
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de bijzondere
      onderhandelingsgroep komen ten laste van de deelnemende vennootschappen. Voor de kosten van bijstand door
      deskundigen of van het voeren van rechtsgedingen geldt dit slechts, indien de deelnemende vennootschappen vooraf
      van de te maken kosten in kennis zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel210
  - number: 2:11.1
    text: |-
      De onderhandelingen beginnen op het tijdstip waarop de eerste vergadering bedoeld in
      [artikel 2:5, eerste lid][ref1], wordt gehouden en kunnen worden voortgezet gedurende een periode van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:11.2
    text: |-
      De deelnemende vennootschappen en de bijzondere onderhandelingsgroep kunnen in gezamenlijk overleg besluiten de
      onderhandelingsperiode te verlengen tot een jaar, te rekenen vanaf het in het eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel211
  - number: 2:12.1
    text: |-
      Indien de deelnemende vennootschappen en de bijzondere onderhandelingsgroep overeenkomen een SE-ondernemingsraad in
      te stellen, dan regelt de overeenkomst ten minste de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.a
    text: de werkingssfeer van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.b
    text: |-
      de instelling van een SE-ondernemingsraad die als gesprekspartner van de SE fungeert in het kader van informatie en
      raadpleging van de werknemers van de SE en haar dochterondernemingen en vestigingen;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.c
    text: |-
      de omvang en samenstelling van en de zetelverdeling in de SE-ondernemingsraad, alsmede de zittingsduur van de
      leden;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.d
    text: het werkterrein en de bevoegdheden van de SE-ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.e
    text: de wijze van informatie en raadpleging van de SE-ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.f
    text: de frequentie en plaats van de vergaderingen van de SE-ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.g
    text: de financiële en materiële middelen waarover de SE-ondernemingsraad kan beschikken;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.h
    text: de datum van inwerkingtreding en de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.i
    text: de gevallen waarin opnieuw over de overeenkomst moet worden onderhandeld;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.j
    text: |-
      de procedure voor onderhandelingen over een nieuwe overeenkomst, de wijze waarop de overeenkomst wordt aangepast
      aan wijzigingen in de structuur en grootte van de SE en in de aantallen werknemers die in de lidstaten werkzaam
      zijn;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.1.k
    text: de gevolgen van het niet afsluiten van een nieuwe overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.2
    text: |-
      De deelnemende vennootschappen en de bijzondere onderhandelingsgroep kunnen overeenkomen dat in plaats van de SE-
      ondernemingsraad een of meer informatie- en raadplegingsprocedures worden ingesteld. Op die overeenkomst is het
      eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.3
    text: |-
      Indien de deelnemende vennootschappen en de bijzondere onderhandelingsgroep besluiten een medezeggenschapsregeling
      vast te stellen regelt de overeenkomst ten minste de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.3.a
    text: de inhoud van de medezeggenschapsregeling;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.3.b
    text: |-
      het aantal van de leden in het toezichthoudend of het bestuursorgaan van de SE die de werknemers gerechtigd zijn te
      kiezen of te benoemen, of met betrekking tot wier benoeming zij aanbevelingen kunnen doen of bezwaar kunnen maken;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.3.c
    text: |-
      de procedures voor het kiezen of benoemen van de in onderdeel b bedoelde leden door of het met betrekking tot hun
      benoeming doen van aanbevelingen of maken van bezwaar;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.3.d
    text: de rechten van de in onderdeel b bedoelde leden.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.4
    text: |-
      Indien de SE is opgericht door omzetting voorziet de overeenkomst ten minste in dezelfde mate in elk aspect van de
      rol van de werknemers als bij de in een SE om te zetten vennootschap het geval is.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.5
    text: De SE staat in voor de naleving van rechten en verplichtingen, opgenomen in de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
  - number: 2:12.6
    text: |-
      De referentievoorschriften in [hoofdstuk 3][ref1] zijn niet van toepassing op de overeenkomst, tenzij de
      overeenkomst anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '3'
  - number: 2:12.7
    text: |-
      De toepasselijkheid van [artikel 2:13][ref1] kan in de overeenkomst geheel of gedeeltelijk worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:13.1
    text: |-
      Indien de overeenkomst geen regels bevat als bedoeld in [artikel 2:12, eerste lid, onderdelen i en j][ref1],
      of de daarin opgenomen regels niet inhouden, dat werknemers of hun vertegenwoordigers van ondernemingen of
      vestigingen, die na het sluiten van de overeenkomst tot de SE zijn gaan behoren, binnen twee jaar worden
      betrokken bij de vernieuwing of aanpassing daarvan dan wel niet binnen twee jaar worden vertegenwoordigd in de SE-
      ondernemingsraad of bij de andere procedure van informatieverstrekking en raadpleging, is de SE verplicht om met
      de SE-ondernemingsraad, of bij ontbreken daarvan met een nieuw samengestelde bijzondere onderhandelingsgroep, te
      onderhandelen over een nieuwe overeenkomst indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:13.1.a
    text: |-
      daarom verzocht wordt door ten minste 100 zodanige werknemers van de SE en haar dochterondernemingen, of hun
      vertegenwoordigers, en
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel213
  - number: 2:13.1.b
    text: |-
      het aantal van die werknemers meer bedraagt dan 20% van het totale aantal werknemers van de SE en haar
      dochterondernemingen in alle lidstaten tezamen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel213
  - number: 2:13.2
    text: |-
      Indien de overeenkomst geen regels bevat als bedoeld in [artikel 2:12, eerste lid, onderdeel k][ref1] en
      niet binnen een jaar na het tijdstip waarop de eerste vergadering met de SE-ondernemingsraad of de bijzondere
      onderhandelingsgroep wordt gehouden, een nieuwe overeenkomst is gesloten, is [hoofdstuk 3][ref2] van toepassing
      tenzij de SE-ondernemingsraad of de bijzondere onderhandelingsgroep de voorkeur geeft aan voortgezette toepassing
      van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '3'
  - number: 2:13.3
    text: |-
      De [artikelen 2:2, tweede, vierde en vijfde lid][ref1], [2:3, eerste, zevende en achtste lid][ref2], [2:4][ref3],
      [2:5][ref4], [2:6, eerste lid, eerste zin][ref5], [2:7][ref6], [2:8, eerste, tweede en vijfde lid][ref7],
      [2:10][ref8] en [2:12][ref9] zijn van overeenkomstige toepassing wanneer overeenkomstig het eerste lid over een
      overeenkomst wordt onderhandeld, met dien verstande dat verplichtingen die krachtens die artikelen rusten op de
      deelnemende vennootschappen, betrekking hebben op de SE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
