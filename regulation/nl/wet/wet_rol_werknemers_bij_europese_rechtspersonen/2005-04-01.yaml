$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_rol_werknemers_bij_europese_rechtspersonen
regulatory_layer: WET
publication_date: '2021-12-20'
valid_from: '2005-04-01'
bwb_id: BWBR0018115
url: https://wetten.overheid.nl/BWBR0018115/2005-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de richtlijn nr. 2001/86/EG van de Raad van de Europese Unie van
    8 oktober 2001 tot aanvulling van het statuut van de Europese vennootschap met betrekking tot de rol van de
    werknemers (PbEG L 294) moet worden uitgevoerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#ArtikelAanhef
articles:
  - number: 1:1.1
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.a
    text: |-
      lidstaat: een lidstaat van de Europese Unie of een andere staat die partij is bij de overeenkomst betreffende de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.b
    text: |-
      richtlijn: de [richtlijn nr. 2001/86/EG](32001L0086) van de Raad van de Europese Unie van 8 oktober 2001 tot
      aanvulling van het statuut van de Europese vennootschap met betrekking tot de rol van de werknemers (PbEG L 294);
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.c
    text: |-
      verordening: de [verordening (EG) nr. 2157/2001](32001R2157) van de Raad van de Europese Unie van 8 oktober 2001
      betreffende het statuut van de Europese vennootschap (PbEG L 294);
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.d
    text: 'SE: een Europese naamloze vennootschap, opgericht overeenkomstig de verordening;'
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.e
    text: 'deelnemende vennootschappen: de vennootschappen die rechtstreeks deelnemen aan de oprichting van een SE;'
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.f
    text: 'Nederlandse deelnemende vennootschap: de deelnemende vennootschap met statutaire zetel in Nederland;'
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.g
    text: |-
      dochteronderneming van een vennootschap: een onderneming waarop door de moederonderneming een overheersende invloed
      kan worden uitgeoefend zoals omschreven in [artikel 1:2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:1.1.h
    text: |-
      betrokken dochteronderneming of vestiging: een dochteronderneming of vestiging van een deelnemende vennootschap
      die volgens het voorstel tot oprichting van een SE bij die oprichting een dochteronderneming of vestiging van de
      SE wordt;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.i
    text: |-
      bijzondere onderhandelingsgroep: de overeenkomstig [artikel 2:2, eerste lid][ref1], ingestelde groep die tot doel
      heeft met de deelnemende vennootschappen te onderhandelen over de vaststelling van regelingen met betrekking tot de
      rol van de werknemers in de SE;


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 1:1.1.j
    text: |-
      rol van de werknemers: elke procedure, met inbegrip van informatie, raadpleging en medezeggenschap, die de
      werknemersvertegenwoordigers in staat stelt invloed uit te oefenen op de binnen de vennootschap te nemen besluiten;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.k
    text: |-
      informatie: inlichtingen die door de SE worden verstrekt aan de SE-ondernemingsraad of aan de
      werknemersvertegenwoordigers, over aangelegenheden die
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.k.1°
    text: betrekking hebben op de SE of op een of meer van haar dochterondernemingen of vestigingen in een lidstaat, of
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.k.2°
    text: de bevoegdheid van de besluitvormingsorganen in één lidstaat te buiten gaat;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.l
    text: |-
      raadpleging: dialoog en uitwisseling van standpunten tussen de SE en de SE-ondernemingsraad of de
      werknemersvertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.m
    text: |-
      het toezichthoudend orgaan, het leidinggevend orgaan of het bestuursorgaan van de SE: wat daaronder wordt verstaan
      in de verordening;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.n
    text: |-
      medezeggenschap: de invloed van de ondernemingsraad of van de werknemersvertegenwoordigers op de gang van zaken bij
      een vennootschap door
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.n.1°
    text: |-
      het recht om een aantal leden van het toezichthoudend of het bestuursorgaan van de vennootschap te kiezen of te
      benoemen, of
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.n.2°
    text: |-
      het recht om met betrekking tot de benoeming van een aantal of alle leden van het toezichthoudend of het
      bestuursorgaan van de vennootschap aanbevelingen te doen of bezwaar te maken; met dien verstande dat indien het
      bestuursorgaan overeenkomstig een onderlinge taakverdeling leden heeft die belast zijn met het uitvoerend bestuur
      en leden die daarmee niet zijn belast, onder medezeggenschap wordt verstaan het recht ten aanzien van de leden die
      niet zijn belast met het uitvoerend bestuur.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.1.o
    text: 'inschrijving van de SE: de inschrijving van de SE bedoeld in artikel 12, eerste lid, van de verordening.'
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:1.2
    text: |-
      Handelen of nalaten door het bestuur van de SE of van de deelnemende vennootschappen wordt toegerekend aan de
      natuurlijke persoon of rechtspersoon, die die onderneming in stand houdt.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel11
  - number: 1:2.1
    text: |-
      In deze wet wordt verstaan onder moederonderneming: de vennootschap die direct of indirect een overheersende
      zeggenschap kan uitoefenen op een andere onderneming en die zelf geen vennootschap is waarover door een andere
      onderneming direct of indirect een overheersende zeggenschap wordt uitgeoefend. Een vennootschap wordt, tenzij het
      tegendeel blijkt, vermoed moederonderneming te zijn, indien zij:
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.1.a
    text: |-
      meer dan de helft van de leden van het bestuursorgaan of van het leidinggevend dan wel toezichthoudend orgaan van
      de andere onderneming kan benoemen, of
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.1.b
    text: meer dan de helft van de stemrechten in de algemene vergadering van de andere onderneming kan uitoefenen of
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.1.c
    text: de meerderheid van het geplaatste kapitaal van de andere onderneming verschaft.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.2
    text: |-
      Voor de toepassing van het eerste lid worden onder de rechten van de moederonderneming ten aanzien van het
      kapitaal, het stemrecht en de benoeming mede begrepen:
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.2.a
    text: de overeenkomstige rechten van andere ondernemingen waarop zij overheersende zeggenschap uitoefent;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.2.b
    text: |-
      de overeenkomstige rechten van personen of organen die handelen onder eigen naam doch voor rekening van de
      moederonderneming of van een of meer van haar dochterondernemingen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.3
    text: |-
      Voor de toepassing van het eerste lid worden de rechten ten aanzien van het kapitaal en het stemrecht niet
      toegerekend aan een onderneming, indien zij deze voor rekening van anderen houdt.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.4
    text: |-
      Voor de toepassing van het eerste lid worden stemrechten, verbonden aan verpande aandelen, toegerekend aan de
      pandhouder, indien hij mag bepalen hoe de rechten worden uitgeoefend. Zijn de aandelen evenwel verpand voor een
      lening die de pandhouder heeft verstrekt in de gewone uitoefening van zijn bedrijf, dan worden de stemrechten hem
      slechts toegerekend, indien hij deze in eigen belang heeft uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.5
    text: |-
      Geen moederonderneming is een onderneming als bedoeld in artikel 3, vijfde lid, onder a of c van [verordening
      (EEG) 4064/89](31989R4064) van de Raad van 21 december 1989 (PbEG L 395) betreffende de controle op concentraties
      van ondernemingen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.6
    text: |-
      Het recht van een lidstaat dat op een vennootschap van toepassing is, bepaalt of die vennootschap een
      moederonderneming is als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.7
    text: Indien meer vennootschappen aan een of meer criteria van het eerste lid voldoen,
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.7.a
    text: |-
      wordt de vennootschap die voldoet aan het criterium onder a aangemerkt als moederonderneming, waarbij het
      benoemingsrecht met betrekking tot het leidinggevend orgaan voorrang heeft;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:2.7.b
    text: |-
      heeft, indien toepassing van onderdeel a niet leidt tot aanmerking van één vennootschap als moederonderneming, het
      criterium onder b voorrang boven dat onder c; een en ander onverminderd het bewijs dat een andere vennootschap een
      overheersende invloed kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel12
  - number: 1:3.1
    text: In deze wet wordt onder werknemer verstaan
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel13
  - number: 1:3.1.a
    text: |-
      voor zover het in Nederland werkzame personen betreft: degene die krachtens een arbeidsovereenkomst werkzaam is in
      de SE, de deelnemende vennootschap of een betrokken dochteronderneming of vestiging;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel13
  - number: 1:3.1.b
    text: |-
      voor zover het in de overige lidstaten werkzame personen betreft: hetgeen het recht van die lidstaat daaronder
      verstaat.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel13
  - number: 1:3.2
    text: |-
      Voor de toepassing van de [artikelen 2:2, tweede lid][ref1], [2:8, vijfde lid][ref2] ten aanzien
      van de vertegenwoordigers van werknemers in de deelnemende vennootschappen, [2:9, eerste lid][ref3],
      [2:13, eerste lid][ref4], en [3:10, derde lid][ref5], wordt onder vertegenwoordigers van werknemers verstaan:
      hetgeen daaronder wordt verstaan krachtens het recht van de lidstaat waarin die werknemers werkzaam zijn; voor
      Nederland zijn dat ondernemingsraden.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0018115#Artikel3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0018115
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1:3.3
    text: |-
      In deze wet wordt onder de SE-ondernemingsraad verstaan: het orgaan dat de werknemers vertegenwoordigt, ingesteld
      bij de in [artikel 2:12][ref1] bedoelde overeenkomst of overeenkomstig de voorschriften van [hoofdstuk 3][ref2],
      ten behoeve van de informatie en raadpleging van de werknemers van de SE en haar dochterondernemingen en
      vestigingen in de lidstaten of de uitoefening van medezeggenschapsrechten in verband met de SE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '3'
  - number: 1:3.4
    text: |-
      Voor de toepassing van [artikel 1:4 van deze wet][ref1] wordt tevens onder de SE-ondernemingsraad verstaan: het
      orgaan dat de werknemers vertegenwoordigt in een SE die haar statutaire zetel heeft in een andere lidstaat, en
      dat is ingesteld krachtens de bepalingen in het nationale recht van die lidstaat ter omzetting van artikel 4 van
      de richtlijn of overeenkomstig de voorschriften van de bijlage van de richtlijn, ten behoeve van de informatie
      en raadpleging van de werknemers van de SE en haar dochterondernemingen en vestigingen in de lidstaten of de
      uitoefening van medezeggenschapsrechten in verband met de SE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:4.1
    text: |-
      Ten aanzien van de in Nederland werkzame werknemers die lid zijn van een bijzondere onderhandelingsgroep, de SE-
      ondernemingsraad, of als werknemersvertegenwoordigers lid zijn van het toezichthoudend of bestuursorgaan van de
      SE, dan wel optreden als vertegenwoordigers bij een andere wijze van informatieverstrekking en raadpleging van
      werknemers, gelden het tweede tot en met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:4.2
    text: |-
      Deze werknemers behouden hun aanspraak op loon voor de tijd gedurende welke zij niet de bedongen arbeid hebben
      verricht ten gevolge van het bijwonen van een vergadering van de bijzondere onderhandelingsgroep, van de SE-
      ondernemingsraad, of van het toezichthoudend of bestuursorgaan van de SE, dan wel van een vergadering in het kader
      van de andere wijze van informatieverstrekking en raadpleging.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:4.3
    text: |-
      Voor zover dat redelijkerwijs noodzakelijk is voor de vervulling van hun taak, wordt hun in werktijd en met behoud
      van loon de gelegenheid geboden tot onderling beraad en overleg met andere personen over aangelegenheden waarbij
      zij in de uitoefening van hun functie zijn betrokken en om scholing en vorming te ontvangen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:4.4
    text: |-
      Zij zijn verplicht tot geheimhouding van alle zaken- en bedrijfsgeheimen die zij in hun hoedanigheid vernemen,
      alsmede van alle aangelegenheden ten aanzien waarvan hun geheimhouding is opgelegd of waarvan zij, in verband met
      opgelegde geheimhouding, het vertrouwelijke karakter moeten begrijpen. Deze verplichting geldt ook voor personen
      die een functie als bedoeld in het eerste lid vervullen zonder werknemer te zijn.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:4.5
    text: |-
      De verplichting tot geheimhouding geldt niet tegenover hem die wordt benaderd als deskundige als bedoeld in de
      [artikelen 2:10, tweede lid][ref1], en [3:11, eerste lid][ref2], mits de deelnemende vennootschappen dan wel de SE
      of degene die de geheimhouding heeft opgelegd, vooraf daarvoor toestemming hebben gegeven en de betrokken persoon
      vooraf schriftelijk heeft verklaard dat hij zich ten aanzien van de betrokken aangelegenheid tot geheimhouding
      verplicht. In dat geval is ten aanzien van de bedoelde persoon de geheimhoudingsplicht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1:4.6
    text: |-
      De plicht tot geheimhouding vervalt niet door beëindiging van de in het eerste lid bedoelde functie, noch door
      beëindiging van de werkzaamheden van de betrokkene in de onderneming.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:4.7
    text: |-
      De werkgever draagt er zorg voor, dat degenen die kandidaat staan of gestaan hebben voor een functie als bedoeld
      in het eerste lid, alsmede degenen die deze functie vervullen of hebben vervuld, niet uit hoofde hiervan worden
      benadeeld in hun positie in de onderneming.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:4.8
    text: |-
      Iedere in Nederland werkzame werknemer of werknemersvertegenwoordiger kan van de werkgever verlangen dat deze
      hem een overzicht geeft van het aantal werknemers dat bij de SE, de deelnemende vennootschappen, betrokken
      dochterondernemingen of vestigingen werkzaam is, alsmede van de verdeling van deze werknemers over de lidstaten.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:4.9
    text: |-
      De werkgever van een in Nederland werkzame werknemer die is aangewezen of gekozen als lid van een bijzondere
      onderhandelingsgroep of van de SE-ondernemingsraad doet daarvan mededeling aan de deelnemende vennootschappen of
      de SE.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel14
  - number: 1:5.1
    text: |-
      Iedere belanghebbende kan de ondernemingskamer van het gerechtshof te Amsterdam verzoeken te bepalen dat gevolg
      dient te worden gegeven aan hetgeen is bepaald bij deze wet, met uitzondering van [artikel 1:4][ref1] voor zo ver
      het tweede lid niet anders bepaalt, of bij een overeenkomst als bedoeld in [artikel 2:12][ref2]. Een bijzondere
      onderhandelingsgroep of de leden daarvan en een SE-ondernemingsraad, ingesteld krachtens deze wet, kunnen niet in
      de proceskosten van deze procedure worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 1:5.2
    text: |-
      De bijzondere onderhandelingsgroep of de leden daarvan en een SE-ondernemingsraad kunnen aan de ondernemingskamer
      van het gerechtshof te Amsterdam verzoeken om:
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel15
  - number: 1:5.2.a
    text: |-
      krachtens [artikel 1:4, vierde en vijfde lid][ref1], [2:6, tweede lid][ref2] of [3:7, derde lid][ref3], opgelegde
      geheimhouding op te heffen op de grond dat degene die de geheimhouding heeft opgelegd bij afweging van de betrokken
      belangen niet in redelijkheid tot het opleggen van geheimhouding had kunnen besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018115
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1:5.2.b
    text: |-
      degene die informatie heeft geweigerd krachtens [artikel 2:6, tweede lid][ref1], of [3:7, derde lid][ref2], te
      verplichten tot het verstrekken van informatie op de grond dat deze bij afweging van de betrokken belangen niet in
      redelijkheid tot het weigeren van informatie had kunnen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 1:6.1
    text: |-
      Wanneer een SE een communautaire onderneming is of een moederonderneming in een communautaire groep
      in de zin van de [Wet op de Europese ondernemingsraden][ref1], is die wet niet van toepassing op die
      onderneming en haar dochterondernemingen, tenzij de bijzondere onderhandelingsgroep het besluit bedoeld in
      [artikel 2:7, eerste lid, onderdeel b][ref2] heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008508
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 1:6.2
    text: |-
      Bij de benoeming van leden van het toezichthoudend orgaan of het bestuursorgaan van de
      SE heeft de ondernemingsraad niet de rechten en bevoegdheden die hem zijn toegekend in
      [artikel 158, derde, vierde, vijfde, zesde, zevende, achtste en twaalfde lid][ref1],
      [artikel 159, tweede lid][ref2], [artikel 161, tweede lid][ref3],
      [artikel 268, derde, vierde, vijfde, zesde, zevende, achtste en twaalfde lid][ref4],
      [artikel 269, tweede lid][ref5] en a[rtikel 271, tweede lid van Boek 2 van het Burgerlijk Wetboek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel161
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel269
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel271
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '159'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '161'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '268'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '269'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '271'
  - number: 1:6.3
    text: 'Deze wet doet geen afbreuk aan het bij of krachtens de wet bepaalde over het recht op:'
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel16
  - number: 1:6.3.a
    text: |-
      informatie, raadpleging en medezeggenschap dat de werknemers van de SE en van haar dochterondernemingen en
      vestigingen genieten, anders dan medezeggenschap bij de benoeming van commissarissen of bestuurders in het
      toezichthoudend of het bestuursorgaan van de SE;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel16
  - number: 1:6.3.b
    text: medezeggenschap bij de benoeming van commissarissen of bestuurders in dochterondernemingen van de SE.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel16
  - number: 2:1
    text: |-
      Indien de SE haar statutaire zetel in Nederland zal hebben is Nederlands recht van toepassing op de in dit
      hoofdstuk geregelde onderhandelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel21
  - number: 2:2.1
    text: |-
      De deelnemende vennootschappen die voornemens zijn een SE op te richten stellen een bijzondere onderhandelingsgroep
      in die representatief is voor de werknemers van de deelnemende vennootschappen, betrokken dochterondernemingen en
      vestigingen, om met de vertegenwoordigers van de werknemers van de vennootschappen in onderhandeling te treden over
      regelingen inzake de rol van de werknemers in de SE.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
  - number: 2:2.2
    text: |-
      De deelnemende vennootschappen geven aan de vertegenwoordigers van de werknemers van de vennootschappen, dan
      wel, bij het ontbreken daarvan, aan de werknemers, een overzicht van de deelnemende vennootschappen, de betrokken
      dochterondernemingen en vestigingen en de daarin werkzame werknemers, alsmede de verdeling van deze werknemers
      over de lidstaten. Indien na de instelling van de bijzondere onderhandelingsgroep, bedoeld in het derde lid,
      wijzigingen optreden in de gegevens die zijn vermeld in het overzicht, verstrekken de deelnemende vennootschappen
      zo spoedig mogelijk na deze wijziging een gewijzigd overzicht aan de bijzondere onderhandelingsgroep en, indien
      die situatie zich voordoet, aan de werknemers of hun vertegenwoordigers van de deelnemende vennootschappen, de
      betrokken dochterondernemingen en vestigingen uit een lidstaat die nog niet in de bijzondere onderhandelingsgroep
      is vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
  - number: 2:2.3
    text: |-
      De instelling van de bijzondere onderhandelingsgroep en de verstrekking van het in het tweede lid bedoelde
      overzicht vindt plaats zo spoedig mogelijk na de openbaarmaking van het fusievoorstel of het voorstel tot
      oprichting van een moederonderneming, dan wel nadat de leidinggevende of de bestuursorganen overeenstemming hebben
      bereikt over een voorstel tot oprichting van een dochteronderneming of tot omzetting in een SE.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
  - number: 2:2.4
    text: |-
      De deelnemende vennootschappen dragen er zorg voor dat binnen die vennootschappen de samenstelling
      van de bijzondere onderhandelingsgroep alsmede het tijdstip waarop de vergadering bedoeld in
      [artikel 2:5, eerste lid, tweede zin][ref1], zal worden gehouden, wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:2.5
    text: |-
      Zo spoedig mogelijk na haar instelling of na de ontvangst van een gewijzigd overzicht als bedoeld in
      het tweede lid, tweede zin, stelt de bijzondere onderhandelingsgroep ten behoeve van de toepassing van
      de [artikelen 2:3][ref1] en [2:8][ref2] een overzicht vast van haar samenstelling en de door haar leden
      vertegenwoordigde werknemers. Het overzicht geeft ten minste informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:2.5.a
    text: het aantal leden van de bijzondere onderhandelingsgroep en de lidstaat waaruit zij zijn afgevaardigd;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
  - number: 2:2.5.b
    text: |-
      de deelnemende vennootschappen, betrokken dochterondernemingen of vestigingen welker werknemers door elk lid
      worden vertegenwoordigd, alsmede het aantal van die werknemers, dat tevens wordt uitgedrukt als percentage van alle
      werknemers die door de leden gezamenlijk worden vertegenwoordigd;
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
  - number: 2:2.5.c
    text: |-
      de deelnemende vennootschap, betrokken dochteronderneming of vestiging waarin een lid als werknemer werkzaam is,
      dan wel over de omstandigheid dat het lid geen werknemer is.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel22
  - number: 2:3.1
    text: |-
      De bijzondere onderhandelingsgroep bestaat uit een zodanig aantal vertegenwoordigers van de werknemers van de
      deelnemende vennootschappen en de betrokken dochterondernemingen en vestigingen, dat is gewaarborgd dat per
      lidstaat een lid wordt gekozen of aangewezen voor elke 10%, of een deel daarvan, van de werknemers die in de
      betrokken lidstaat werkzaam zijn, berekend over het totale aantal werknemers dat bij de deelnemende vennootschappen
      en de betrokken dochterondernemingen en vestigingen in alle lidstaten tezamen werkzaam is.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
  - number: 2:3.2
    text: |-
      Indien een SE door fusie wordt opgericht zijn er van elke lidstaat zoveel extra leden als nodig is om ervoor te
      zorgen, dat de bijzondere onderhandelingsgroep ten minste één extra lid telt ter vertegenwoordiging van elke in die
      lidstaat ingeschreven deelnemende vennootschap met daar werkzame werknemers, die ingevolge de inschrijving van de
      SE zal ophouden te bestaan als afzonderlijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
  - number: 2:3.3
    text: |-
      Het aantal van de in het tweede lid bedoelde extra leden bedraagt ten hoogste 20% van het totale aantal leden op
      grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
  - number: 2:3.4
    text: |-
      Het tweede lid geldt niet voor zover de toepassing ervan dubbele vertegenwoordiging in de bijzondere
      onderhandelingsgroep tot gevolg zou hebben van de werknemers die werkzaam zijn bij een deelnemende vennootschap in
      een lidstaat. Van dubbele vertegenwoordiging is slechts sprake, indien de deelnemende vennootschap die op grond van
      het tweede lid in aanmerking komt voor een extra lid, reeds vertegenwoordigd wordt door een werknemer die werkzaam
      is in die deelnemende vennootschap.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
  - number: 2:3.5
    text: |-
      Indien het aantal deelnemende vennootschappen groter is dan het aantal extra leden dat krachtens het tweede en
      derde lid in de bijzondere onderhandelingsgroep zitting kan nemen, worden de extra zetels door vertegenwoordigers
      van de werknemers in verschillende lidstaten ingenomen in dalende volgorde van het aantal werknemers in die
      vennootschappen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
  - number: 2:3.6
    text: |-
      Elke deelnemende vennootschap met in Nederland werkzame werknemers wordt door ten minste één lid vertegenwoordigd
      in de bijzondere onderhandelingsgroep, tenzij het totale aantal leden daardoor zou toenemen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
  - number: 2:3.7
    text: |-
      Het aantal leden van de bijzondere onderhandelingsgroep en de zetelverdeling wordt in overeenstemming
      gehouden met dit artikel. Indien het aantal leden uit een lidstaat wijzigt zonder dat met betrekking
      tot die zetels een nieuwe verkiezing of aanwijzing heeft plaatsgevonden, hebben de voor die lidstaat
      zitting hebbende leden, voor de toepassing van [artikel 2:8, eerste, tweede, derde en vierde lid][ref1] en
      [artikel 2:9, eerste en derde lid][ref2], samen zoveel stemmen als overeenkomt met het aantal leden dat voor
      die lidstaat krachtens het eerste lid is vastgesteld en vertegenwoordigen zij samen de in die lidstaat werkzame
      werknemers van de deelnemende vennootschappen en de betrokken dochterondernemingen en vestigingen in een door hen
      te bepalen verhouding, dan wel, indien daarover geen overeenstemming wordt bereikt, naar verhouding van het aantal
      werknemers dat zij vertegenwoordigden voor de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:3.8
    text: |-
      Indien uit het bepaalde in de eerste zin van het zevende lid voortvloeit dat vanuit een lidstaat niet langer een
      lid van de bijzondere onderhandelingsgroep kan worden afgevaardigd, dan wel daaruit voortvloeit dat vanuit een nog
      niet vertegenwoordigde lidstaat alsnog een lid kan worden afgevaardigd, neemt de bijzondere onderhandelingsgroep
      geen besluiten totdat haar samenstelling en het overzicht, bedoeld in [artikel 2:2, vijfde lid][ref1], zijn
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:4.1
    text: |-
      Elk lid van de bijzondere onderhandelingsgroep wordt gekozen of aangewezen overeenkomstig het recht van of de
      praktijk in de lidstaat waaruit hij wordt afgevaardigd. Bij de aanwijzing wordt bepaald welk deel van de in die
      lidstaat werkzame werknemers van de deelnemende vennootschappen en de betrokken dochterondernemingen en vestigingen
      door het aangewezen lid wordt vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel24
  - number: 2:4.2
    text: |-
      Met betrekking tot de Nederlandse deelnemende vennootschappen, betrokken dochterondernemingen en vestigingen worden
      de leden van de bijzondere onderhandelingsgroep aangewezen, dan wel wordt hun aanwijzing ingetrokken, door de bij
      die deelnemende vennootschappen, betrokken dochterondernemingen en vestigingen ingestelde ondernemingsraden.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel24
  - number: 2:4.3
    text: |-
      Indien uitsluitend met betrekking tot ondernemingsraden als bedoeld in het tweede lid een of meer centrale
      ondernemingsraden zijn ingesteld, geschiedt de aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel24
  - number: 2:4.4
    text: |-
      Indien geen centrale ondernemingsraad is ingesteld, maar wel een of meer groepsondernemingsraden, geschiedt de
      aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel24
  - number: 2:4.5
    text: |-
      Indien niet alle ondernemingsraden of groepsondernemingsraden zijn vertegenwoordigd in een centrale
      ondernemingsraad of groepsondernemingsraad, geschiedt de aanwijzing of intrekking door de centrale
      onderscheidenlijk groepsondernemingsraad of raden en de niet-vertegenwoordigde ondernemingsraden gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel24
  - number: 2:4.6
    text: |-
      Indien er geen enkele ondernemingsraad is ingesteld, worden de leden van de bijzondere onderhandelingsgroep
      gekozen door de gezamenlijke in Nederland werkzame werknemers van de deelnemende vennootschappen, betrokken
      dochterondernemingen en vestigingen. De verkiezing geschiedt bij geheime schriftelijke stemming, waarbij elke
      werknemer één stem heeft. Ten behoeve van de verkiezing is een vereniging van werknemers, die bedoelde werknemers
      onder haar leden telt, krachtens haar statuten ten doel heeft de belangen van haar leden als werknemers te
      behartigen en als zodanig binnen de deelnemende vennootschappen, betrokken dochterondernemingen en vestigingen
      werkzaam is en voorts in het bezit is van volledige rechtsbevoegdheid, bevoegd een kandidatenlijst in te
      dienen, mits zij over de samenstelling van de kandidatenlijst overleg heeft gepleegd met haar leden binnen de
      deelnemende vennootschappen, betrokken dochterondernemingen en vestigingen. De bevoegdheid tot indiening van een
      kandidatenlijst berust tevens bij een of meer van de werknemers van de deelnemende vennootschappen, betrokken
      dochterondernemingen en vestigingen, die geen lid zijn van een vereniging als bedoeld in de voorgaande zin welke
      een kandidatenlijst heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel24
  - number: 2:4.7
    text: |-
      Bij de toepassing van het tweede tot en met vijfde lid worden werknemers van Nederlandse deelnemende
      vennootschappen, betrokken dochterondernemingen en vestigingen die niet in een ondernemingsraad,
      groepsondernemingsraad of centrale ondernemingsraad vertegenwoordigd zijn in de gelegenheid gesteld zich over de
      als lid van de bijzondere onderhandelingsgroep aan te wijzen personen uit te spreken.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel24
  - number: 2:5.1
    text: |-
      De deelnemende vennootschappen en de bijzondere onderhandelingsgroep stellen in een schriftelijke overeenkomst
      regelingen vast over de rol van de werknemers in de SE. Daartoe beleggen de deelnemende vennootschappen na de
      oprichting van de bijzondere onderhandelingsgroep met deze een vergadering om te onderhandelen over een dergelijke
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel25
  - number: 2:5.2
    text: |-
      De deelnemende vennootschappen stellen de bijzondere onderhandelingsgroep in de gelegenheid voorafgaand aan de
      onderhandelingen bijeen te komen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel25
  - number: 2:6.1
    text: |-
      De deelnemende vennootschappen voorzien de bijzondere onderhandelingsgroep van de gegevens die noodzakelijk zijn
      bij de onderhandelingen. Tot die gegevens behoren ten minste het voorstel tot oprichting van de SE en het verloop
      van de oprichting tot het tijdstip van de inschrijving van de SE.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel26
  - number: 2:6.2
    text: |-
      De deelnemende vennootschappen zijn niet verplicht tot het verstrekken van informatie, voor zover dat in
      redelijkheid het functioneren van de deelnemende vennootschappen of haar dochterondernemingen en vestigingen
      ernstig zou belemmeren dan wel schaden. Zij kunnen terzake van de informatieverstrekking geheimhouding opleggen,
      indien daarvoor een redelijke grond bestaat. Zoveel mogelijk vóór de behandeling van de betrokken aangelegenheid
      wordt meegedeeld, welke grond bestaat voor het opleggen van de geheimhouding, welke schriftelijk of mondeling
      verstrekte gegevens onder de geheimhouding vallen, hoelang deze dient te duren, alsmede of er personen zijn ten
      aanzien van wie de geheimhouding niet in acht behoeft te worden genomen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel26
  - number: 2:7.1
    text: 'De bijzondere onderhandelingsgroep kan besluiten:'
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel27
  - number: 2:7.1.a
    text: |-
      tot goedkeuring van een overeenkomst als bedoeld in [artikel 2:5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:7.1.b
    text: af te zien van het openen van onderhandelingen of tot het beëindigen van reeds geopende onderhandelingen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel27
  - number: 2:7.2
    text: |-
      Het besluit bedoeld in het eerste lid, onderdeel b, beëindigt de procedure tot sluiting van een overeenkomst en
      heeft tot gevolg dat de regels op het gebied van informatie en raadpleging van werknemers van toepassing zijn, die
      gelden in de lidstaten waar de SE werknemers heeft. Na dit besluit is [hoofdstuk 3][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '3'
  - number: 2:8.1
    text: Ieder lid van de bijzondere onderhandelingsgroep heeft één stem.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
  - number: 2:8.2
    text: |-
      De bijzondere onderhandelingsgroep besluit tenzij anders is bepaald, bij volstrekte meerderheid van haar aantal
      leden, tevens vertegenwoordigende de volstrekte meerderheid van de werknemers.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
  - number: 2:8.3
    text: |-
      Een besluit van de bijzondere onderhandelingsgroep tot goedkeuring van een overeenkomst waarin het recht op
      medezeggenschap van de werknemers wordt ingeperkt behoeft een meerderheid van tweederde van haar aantal leden,
      tevens vertegenwoordigende tweederde van de werknemers en afkomstig uit ten minste twee lidstaten, indien:
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
  - number: 2:8.3.a
    text: |-
      de SE wordt opgericht door fusie en de medezeggenschap ten minste 25% van het totale aantal werknemers van de
      deelnemende vennootschappen bestrijkt, of
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
  - number: 2:8.3.b
    text: |-
      de SE wordt opgericht door oprichting van een moederonderneming of een dochteronderneming en de medezeggenschap ten
      minste 50% van het totale aantal werknemers van de deelnemende vennootschappen bestrijkt.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
  - number: 2:8.4
    text: |-
      Van een inperking van het recht op medezeggenschap van de werknemers als bedoeld in het derde lid
      is sprake, wanneer het aantal leden van het toezichthoudend of het bestuursorgaan van de SE dat door
      werknemersvertegenwoordigers kan worden gekozen of benoemd, dan wel waarvoor zij aanbevelingen kunnen doen of
      bezwaar kunnen maken, op grond van de overeenkomst lager is dan het hoogste aantal leden ten aanzien waarvan de
      werknemersvertegenwoordigers dat recht konden uitoefenen in de deelnemende vennootschappen.
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
  - number: 2:8.5
    text: |-
      Een besluit van de bijzondere onderhandelingsgroep als bedoeld in [artikel 2:7, eerste lid, onderdeel b][ref1],
      behoeft een meerderheid van tweederde van haar aantal leden, tevens vertegenwoordigende tweederde van de werknemers
      en afkomstig uit ten minste twee lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:8.6
    text: |-
      Een besluit als bedoeld in [artikel 2:7, eerste lid, onderdeel b][ref1], kan door de bijzondere
      onderhandelingsgroep niet worden genomen indien de onderhandelingen een SE betreffen die wordt opgericht door
      omzetting en er in de om te zetten vennootschap medezeggenschap bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:9.1
    text: |-
      Indien de bijzondere onderhandelingsgroep het besluit heeft genomen, bedoeld in
      [artikel 2:7, eerste lid, onderdeel b][ref1], roept de SE de bijzondere onderhandelingsgroep op schriftelijk
      verzoek van ten minste 10% van de werknemers van de SE en haar dochterondernemingen en vestigingen, of van hun
      vertegenwoordigers, opnieuw bijeen om in onderhandeling te treden over regelingen op het gebied van de rol van de
      werknemers in de SE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:9.2
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet gedurende twee jaren na de datum van het besluit,
      bedoeld in [artikel 2:7, onderdeel b][ref1], tenzij met de bijzondere onderhandelingsgroep is overeengekomen de
      onderhandelingen vroeger te heropenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:9.3
    text: |-
      Indien de bijzondere onderhandelingsgroep opnieuw bijeen wordt geroepen zijn de
      [artikelen 2:2, tweede, vierde en vijfde lid][ref1], [2:3, eerste, zevende en achtste lid][ref2], [2:4][ref3],
      [2:5][ref4], [2:6, eerste lid, eerste zin][ref5], [2:7][ref6], [2:8, eerste, tweede en vijfde lid][ref7],
      [2:10][ref8] en [2:12][ref9] van overeenkomstige toepassing, met dien verstande dat verplichtingen die krachtens
      die artikelen rusten op de deelnemende vennootschappen, betrekking hebben op de SE.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0018115#Artikel2
      [ref9]: https://wetten.overheid.nl/BWBR0018115#Artikel2
    url: https://wetten.overheid.nl/BWBR0018115/2005-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018115
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
