$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: organisatieregeling_aanhoudings_en_ondersteuningseenheid
regulatory_layer: WET
publication_date: '2007-01-03'
valid_from: '1994-11-13'
bwb_id: BWBR0006551
url: https://wetten.overheid.nl/BWBR0006551/1994-11-13
preamble:
  text: |-
    Gelet op artikel 8, tweede lid, en artikel 12, eerste lid, van het Besluit beheer regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder aanhoudings- en ondersteuningseenheid: de eenheid, bedoeld in
      [artikel 8, eerste lid, van het Besluit beheer regionale politiekorpsen][ref1];

      2 In deze regeling wordt, in geval meer regio's gezamenlijk beschikken over een eenheid, onder korpsbeheerder
      verstaan: de korpsbeheerders gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006560#Artikel8
    url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006560
        artikel: '8'
  - number: '2'
    text: |-
      1 Een eenheid bestaat minimaal uit twee secties en een eenheidscommandant.

      2 Een sectie bestaat minimaal uit acht leden en een sectiecommandant.
    url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#Artikel2
  - number: '3'
    text: De korpsbeheerder wijst de eenheidscommandant, de sectiecommantanten alsmede hun plaatsvervangers aan.
    url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#Artikel3
  - number: '4'
    text: |-
      De korpsbeheerder bepaalt de termijn gedurende welke een ambtenaar van politie ononderbroken deel uit maakt van een
      eenheid, tot een maximum van 6 jaar.
    url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#Artikel4
  - number: '5'
    text: |-
      1 De ambtenaar van politie die deel uit maakt van een eenheid, heeft voldaan aan de eindtermen van de door de
      Ministers van Justitie en van Binnenlandse Zaken aan te wijzen vervolgopleiding.

      2 De korpsbeheerder draagt er zorg voor dat de kennis en vaardigheden van leden van een eenheid worden onderhouden
      op minimaal het niveau van de aan de in het eerste lid bedoelde eindtermen.
    url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#Artikel5
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#Artikel6
  - number: '7'
    text: |-
      Deze regeling wordt aangehaald als:

      Organisatieregeling aanhoudings- en ondersteuningseenheid.

      Deze regeling zal met de toelichting in de Staatscourant en het Algemeen Politieblad worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006551/1994-11-13#Artikel7
