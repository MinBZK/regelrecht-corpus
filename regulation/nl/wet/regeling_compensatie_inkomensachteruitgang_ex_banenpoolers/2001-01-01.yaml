---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_compensatie_inkomensachteruitgang_ex_banenpoolers
regulatory_layer: WET
publication_date: '2004-09-20'
valid_from: '2001-01-01'
bwb_id: BWBR0010784
url: https://wetten.overheid.nl/BWBR0010784/2001-01-01
preamble:
  text: |-
    Handelend in overeenstemming met de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 3, eerste lid, van de Kaderwet SZW-subsidies,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            de minister:

              de Minister van Sociale Zaken en Werkgelegenheid;



            b
            huursubsidie, huurder, rekeninkomen en rekenhuur:

              hetgeen daaronder wordt verstaan in de [Huursubsidiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
  - number: '2.1'
    text: |-
      De minister verstrekt over de periode van 1 juli 1999 tot en met 30 juni 2000, de periode van 1 juli 2000 tot
      en met 30 juni 2001 en de periode van 1 juli 2001 tot en met 30 juni 2002 op aanvraag aan de persoon, bedoeld in
      [artikel 24, derde lid, van de Wet inschakeling werkzoekenden][ref1], een compensatie in de vorm van een subsidie,
      indien die persoon uitsluitend ten gevolge van het vervallen van het recht op premievrijstelling, bedoeld in
      genoemde bepaling, met ingang van 1 juli 1999 minder aanspraak kan maken op huursubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel24
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '24'
  - number: '2.2'
    text: |-
      De subsidie voor de perioden, bedoeld in het eerste lid, wordt uitsluitend verstrekt, indien de persoon, bedoeld
      in het eerste lid, desgewenst op verzoek van de minister, aantoont dat hij telkens op 1 januari van de jaren 1999,
      2000 en 2001:
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel2
  - number: 2.2.a
    text: |-
      een dienstbetrekking heeft als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet inschakeling werkzoekenden][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel1
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '1'
  - number: 2.2.b
    text: huurder is.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel2
  - number: '3.1'
    text: |-
      De persoon, bedoeld in [artikel 2, eerste lid][ref1], ontvangt van de minister ambtshalve een aanvraagformulier
      voor de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0010784#Artikel2
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010784
        artikel: '2'
  - number: '3.2'
    text: |-
      De persoon, bedoeld in [artikel 2, eerste lid][ref1], die op 1 januari 2000 geen aanvraagformulier heeft ontvangen
      kan tot 1 maart 2000 een aanvraagformulier aanvragen bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010784#Artikel2
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010784
        artikel: '2'
  - number: '3.3'
    text: Aanvraagformulieren die na 1 april 2000 door de minister zijn ontvangen worden niet meer in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel3
  - number: '3.4'
    text: Het aanvraagformulier is ingericht overeenkomstig de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel3
  - number: '4.1'
    text: |-
      Over de periode van 1 juli 1999 tot en met 30 juni 2000 wordt door de minister zo mogelijk vóór 1 januari 2000,
      aan de persoon, bedoeld in [artikel 2, eerste lid][ref1], bij wijze van voorschot een voorlopige subsidie verstrekt
      en betaalbaar gesteld, indien een volledig ingevuld aanvraagformulier vóór 15 november 1999 door de minister is
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0010784#Artikel2
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010784
        artikel: '2'
  - number: '4.2'
    text: |-
      De subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000 wordt door de minister ambtshalve definitief
      vastgesteld vóór 1 september 2000.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel4
  - number: '4.3'
    text: |-
      De subsidie over de periode van 1 juli 2000 tot en met 30 juni 2001 wordt door de minister ambtshalve vastgesteld
      vóór 1 september 2000. De definitieve subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000 en de
      subsidie over de periode van 1 juli 2000 tot en met 30 juni 2001 wordt betaalbaar gesteld vóór 1 september 2000.
      Met de betaalbaarstelling van de definitieve subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000 en de
      subsidie over de periode van 1 juli 2000 tot en met 30 juni 2001 wordt een verstrekt voorschot over de periode van
      1 juli 1999 tot en met 30 juni 2000 verrekend.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel4
  - number: '4.4'
    text: |-
      De subsidie over de periode van 1 juli 2001 tot en met 30 juni 2002 wordt door de minister ambtshalve vastgesteld
      en betaalbaar gesteld vóór 1 september 2001.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel4
  - number: '5.1'
    text: 'De voorlopige subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000 wordt als volgt berekend:'
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.1.a
    text: het rekeninkomen over 1997 wordt vermenigvuldigd met 0,95, daardoor ontstaat een fictief rekeninkomen over 1998;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.1.b
    text: de rekenhuur over 1998 wordt vermenigvuldigd met 1,029, daardoor ontstaat een fictieve rekenhuur over 1999;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.1.c
    text: |-
      met behulp van het fictief rekeninkomen over 1998 en de fictieve rekenhuur over 1999 wordt de huursubsidie
      berekend, daardoor ontstaat de huursubsidie A;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.1.d
    text: |-
      door het tabelloon, bedoeld in [artikel 1, tweede lid, onderdeel e][ref1], van het Uitvoeringsbesluit loonbelasting
      1995, over 1997 te vermenigvuldigen met 0,223 en van de uitkomst daarvan f 1.947,86 af te trekken ontstaat een
      vrijlatingsbedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0010784#Artikel1
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010784
        artikel: '1'
  - number: 5.1.e
    text: |-
      het vrijlatingsbedrag wordt opgeteld bij het fictief rekeninkomen 1998, daardoor ontstaat een nieuw fictief
      rekeninkomen over 1998;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.1.f
    text: |-
      met behulp van het nieuwe fictief rekeninkomen over 1998 en de fictieve rekenhuur over 1999 wordt de huursubsidie
      opnieuw berekend, daardoor ontstaat de huursubsidie B;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.1.g
    text: |-
      van de huursubsidie A wordt vervolgens afgetrokken de huursubsidie B, de uitkomst daarvan wordt vermenigvuldigd met
      12, daardoor ontstaat de voorlopige subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: '5.2'
    text: 'De definitieve subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000 wordt als volgt berekend:'
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.2.a
    text: |-
      met behulp van het rekeninkomen over 1998 en de rekenhuur over 1999 wordt de huursubsidie berekend, daardoor
      ontstaat de huursubsidie C;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.2.b
    text: |-
      het vrijlatingsbedrag, bedoeld in het eerste lid, onderdeel d, wordt afgetrokken van het rekeninkomen over 1998,
      hierdoor ontstaat een nieuw rekeninkomen over 1998;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.2.c
    text: |-
      met behulp van het nieuwe rekeninkomen over 1998 en de rekenhuur over 1999 wordt de huursubsidie opnieuw berekend,
      daardoor ontstaat de huursubsidie D;
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: 5.2.d
    text: |-
      van de huursubsidie D wordt vervolgens afgetrokken de huursubsidie C, de uitkomst daarvan wordt vermenigvuldigd met
      12, daardoor ontstaat de definitieve subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien bij de berekening van de voorlopige subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000 het
      tabelloon, bedoeld in het eerste lid, onderdeel d, nog niet bekend is, wordt bij de berekening van de voorlopige
      subsidie uitgegaan van een fictief tabelloon van f 27.000,-.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: '5.4'
    text: |-
      Bij de toepassing van het derde lid, wordt bij de berekening van de definitieve subsidie het vrijlatingsbedrag,
      bedoeld in het eerste lid, onderdeel d, alsnog berekend met het in dat lid bedoelde tabelloon. De uitkomst van die
      berekening is vervolgens het vrijlatingsbedrag, bedoeld in het tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: '5.5'
    text: |-
      De subsidie over de periode van 1 juli 2000 tot en met 30 juni 2001 bedraagt 2/3 deel van de definitieve subsidie
      over de periode van 1 juli 1999 tot en met 30 juni 2000.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: '5.6'
    text: |-
      De subsidie over de periode van 1 juli 2001 tot en met 30 juni 2002 bedraagt 1/3 deel van de definitieve subsidie
      over de periode van 1 juli 1999 tot en met 30 juni 2000.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: '5.7'
    text: De subsidie wordt naar boven afgerond op hele guldens.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel5
  - number: '6.1'
    text: |-
      De over de subsidie verschuldigde belasting op grond van de [Wet inkomstenbelasting 2001][ref1] en
      de [Wet op de loonbelasting 1964][ref2] alsmede de premie voor de volksverzekeringen op grond van de
      [Wet financiering volksverzekeringen][ref3], komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0004538
  - number: '6.2'
    text: |-
      De subsidie blijft buiten beschouwing bij de verlening van op het inkomen afgestemde publiekrechtelijke uitkeringen
      of verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel6
  - number: '7.1'
    text: |-
      De subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000 komt niet tot uitbetaling, indien deze
      voorlopig wordt berekend op een bedrag van minder dan f 120,- en definitief wordt vastgesteld op een bedrag van
      minder dan f 120,-.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel7
  - number: '7.2'
    text: |-
      De subsidie over de periode van 1 juli 2000 tot en met 30 juni 2001 en de periode van 1 juli 2001 tot en met 30
      juni 2002 komt niet tot uitbetaling, indien de subsidie over de periode van 1 juli 1999 tot en met 30 juni 2000
      definitief is vastgesteld op een bedrag van minder dan f 120,-.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel7
  - number: '8.1'
    text: |-
      De minister kan de subsidie geheel of gedeeltelijk terugvorderen dan wel verrekenen met de subsidie over enige
      periode, indien:
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel8
  - number: 8.1.a
    text: |-
      de subsidie wordt verstrekt aan een persoon die niet tot de doelgroep, bedoeld in [artikel 2, eerste lid][ref1],
      behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0010784#Artikel2
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010784
        artikel: '2'
  - number: 8.1.b
    text: |-
      door de persoon, bedoeld in [artikel 2, eerste lid][ref1], onjuiste gegevens zijn verstrekt ten gevolge waarvan die
      persoon ten onrechte een subsidie heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0010784#Artikel2
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010784
        artikel: '2'
  - number: 8.1.c
    text: anderszins in strijd met deze regeling subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd het eerste lid, wordt, indien de voorlopige subsidie f 120,- of meer bedraagt en de definitieve
      subsidie wordt vastgesteld op minder dan f 120,-, de voorlopige subsidie niet teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel8
  - number: '9'
    text: |-
      De [Algemene Regeling SZW-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009211
  - number: '10.1'
    text: |-
      De minister mandateert het hoofd van de Cluster Overige Regelingen van de Afdeling Uitvoering Volkshuisves-
      tingsregelingen van de Directie Reken- en Administratiecentrum van het ministerie van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer tot het nemen van besluiten krachtens deze regeling, met uitzondering van besluiten
      genoemd in het derde lid van dit artikel, en tot het afdoen van alle op deze besluiten betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel10
  - number: '10.2'
    text: |-
      De ondertekening van de in het eerste lid genoemde besluiten luidt als volgt: De Minister van Sociale Zaken
      en Werkgelegenheid, namens deze: Het hoofd van de Cluster Overige Regelingen van de Afdeling Uitvoering
      Volkshuisvestingsregelingen van de Directie Reken- en Administratiecen-trum van het ministerie van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer gevolgd door de handtekening en de naam van de betrokken
      functionaris.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel10
  - number: '10.3'
    text: |-
      De minister mandateert het hoofd van de Afdeling Uitvoering Volkshuis-vestingsregelingen van de Directie Reken-
      en Administratiecentrum van het ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer tot het
      beslissen op bezwaarschriften tegen besluiten als bedoeld in het eerste lid en tot het afdoen van alle op deze
      beslissingen betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel10
  - number: '10.4'
    text: |-
      De ondertekening van de in het derde lid genoemde beslissingen luidt als volgt: De Minister van Sociale Zaken en
      Werkgelegenheid, namens deze: Het hoofd van de Afdeling Uitvoering Volkshuisvestingsregelingen van de Directie
      Reken- en Administratiecen-trum van het ministerie van Volkshuis-vesting, Ruimtelijke Ordening en Milieubeheer
      gevolgd door de handtekening en de naam van de betrokken functionaris.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling compensatie inkomensachteruitgang ex-banenpoolers][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010784
    url: https://wetten.overheid.nl/BWBR0010784/2001-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010784
