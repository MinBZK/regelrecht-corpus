preamble:
  text: |-
    Overwegende, dat per 1 januari 1997 de Wet van 14 november 1996, houdende vaststelling van bepalingen betreffende
    waterstaatswerken in beheer bij het Rijk (Wet beheer rijkswaterstaatswerken, Stb. 1996, 645) in werking is
    getreden. Gelijktijdig met de inwerkingtreding van de Wet beheer rijkswaterstaatwerken is de wet van 20 juni 1996
    tot wijziging van de Ontgrondingenwet (Stb. 1996, 411) in werking getreden.

    Dat op grond van deze twee wetten aangewezen ambtenaren van de Rijkswaterstaat, worden belast met het toezicht op
    de naleving van het bepaalde bij of krachtens deze wetten;

    Gelet op artikel 5, eerste lid, van de Wet beheer rijkswaterstaatswerken en gelet op artikel 22 van de
    Ontgrondingenwet jo artikel 18.4 van de Wet milieubeheer (Stb. 1992, 551);

    Besluit:
