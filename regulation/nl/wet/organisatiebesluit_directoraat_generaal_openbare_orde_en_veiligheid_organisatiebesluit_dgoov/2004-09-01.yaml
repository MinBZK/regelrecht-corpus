---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatiebesluit_directoraat_generaal_openbare_orde_en_veiligheid_organisatiebesluit_dgoov
regulatory_layer: WET
publication_date: '2005-02-25'
valid_from: '2004-09-01'
bwb_id: BWBR0015588
url: https://wetten.overheid.nl/BWBR0015588/2004-09-01
preamble:
  text: |-
    Gelet op artikel 4:2 van het Organisatiebesluit BZK 2003;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Minister voor Bestuurlijke Vernieuwing
      en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Openbare Orde en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Openbare Orde en Veiligheid, genoemd in het
      [Organisatiebesluit BZK 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015590
  - number: 3:1
    text: |-
      Het stafbureau Openbare Orde en Veiligheid bestaat uit de volgende onderdelen: - Bureau Coördinatie
      informatievoorziening (I);
        - Bureau DG-control (DG-C);
        - Bureau Ondersteuning DG (ODG);
        - Bureau P-management (PM).
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel31
  - number: 3:2.1
    text: Het Bureau Coördinatie informatievoorziening staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel32
  - number: 3:2.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel32
  - number: 3:2.2.a)
    text: coördineren en aansturen van de DI-secties van het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel32
  - number: 3:2.2.b)
    text: |-
      leveren van een bijdrage aan de beleidsontwikkeling op het gebied van (documentaire) informatievoorziening binnen
      het directoraat-generaal en het ministerie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel32
  - number: 3:2.2.c)
    text: |-
      zorgdragen voor het goed en toegankelijk presenteren van informatie van het directoraat-generaal op de intra- en
      internetsite van het ministerie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel32
  - number: 3:2.2.d)
    text: bevorderen van de informatiebeveiliging ten behoeve van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel32
  - number: 3:3.1
    text: Het Bureau DG-control staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2
    text: 'Het bureau heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2.a)
    text: verantwoordelijkheid voor de coördinatie van het begrotingsproces op directoraat-generaal-niveau;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2.b)
    text: aangeven van kaders waarbinnen de directies hun begrotingsvoorstellen dienen op te stellen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2.c)
    text: toetsen van directievoorstellen en adviseren van de directeur-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2.d)
    text: DGOOV-brede coördinatie van de financiële planning en control;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2.e)
    text: |-
      verantwoordelijkheid voor de DGOOV-brede vormgeving en regulering van de administratieve organisatie en
      bestuurlijke informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2.f)
    text: verantwoordelijkheid voor de financiële administratie van het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:3.2.g)
    text: leveren second opinion ten behoeve van het management.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel33
  - number: 3:4.1
    text: Het Bureau Ondersteuning DG staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.a)
    text: toetsen beheersvoorstellen en adviseren van de directeur-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.b)
    text: |-
      coördinatie beleidsinhoudelijke cycli binnen het directoraat-generaal, voor zover deze afstemming tussen de
      dienstonderdelen behoeft;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.c)
    text: procesbewaking binnen het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.d)
    text: secretariswerkzaamheden overleggremia op directeur-generaalniveau;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.e)
    text: leveren secretariële ondersteuning;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.f)
    text: aanschaffingsbeleid en huisvestingszaken op directoraat-generaal-niveau;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.g)
    text: voeren ambtelijk secretariaat van de ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.h)
    text: coördineren ARBO-aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.i)
    text: het organiseren van congressen, evenementen e.d. voor het gehele directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:4.2.j)
    text: voorbereiden wekelijks overleg Managementteam Openbare Orde en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel34
  - number: 3:5.1
    text: Het Bureau P-management staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel35
  - number: 3:5.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel35
  - number: 3:5.2.a)
    text: ontwikkelen- en uitvoeren van het personeelsbeleid binnen het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel35
  - number: 3:5.2.b)
    text: geven van eerstelijns ondersteuning;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel35
  - number: 3:5.2.c)
    text: verschaffen van managementinformatie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel35
  - number: 4:1
    text: |-
      De directie Politie bestaat uit de volgende onderdelen: - de afdeling Bestuurlijke en Juridische Zaken (BJZ);
        - de afdeling Politieel Veiligheidsbeleid (PVB);
        - de afdeling Arbeidsvoorwaardenbeleid (AB);
        - de afdeling Onderwijs en Loopbaanbeleid (O&L);
        - de afdeling Bedrijfsvoering en Toezicht (B&T);
        - de afdeling Financiën (F);
        - de afdeling Internationale Politiesamenwerking (IPS);
        - de Stafafdeling (S).
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel41
  - number: 4:2.1
    text: |-
      De afdeling Bestuurlijke en Juridische Zaken staat onder leiding van een hoofd en bij afwezigheid diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel42
  - number: 4:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel42
  - number: 4:2.2.a)
    text: |-
      instandhouden en beheren van de [Politiewet 1993][ref1], de daarop gebaseerde regelgeving, alsmede ontwikkelen van
      beleidskaders terzake en de zorg voor de implementatie daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: 4:2.2.b)
    text: |-
      verlenen van juridische ondersteuning bij totstandkoming van beleid, opstellen van wet- en regelgeving en het
      behandelen van juridische vraagstukken van algemene aard;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel42
  - number: 4:2.2.c)
    text: |-
      ontwikkelen van beleid ten aanzien van openbare ordehandhaving en geweldsbeheersing alsmede het instandhouden en
      beheren van het desbetreffende juridische instrumentarium;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel42
  - number: 4:2.2.d)
    text: optreden als wetgevingscoördinator binnen het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel42
  - number: 4:2.2.e)
    text: zorg voor de instandhouding van specifieke materiële voorzieningen voor de Nederlandse politie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel42
  - number: 4:3.1
    text: De afdeling Politieel Veiligheidsbeleid staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel43
  - number: 4:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel43
  - number: 4:3.2.a)
    text: |-
      bevordering van de veiligheid door vanuit een landelijk perspectief bij te dragen aan de kwaliteit en organisatie
      van politietaken;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel43
  - number: 4:3.2.b)
    text: |-
      probleemverkenning, instrumentontwikkeling, monitoring en evaluatie van lopende beleidstrajecten, zoals het
      Beleidsplan Nederlandse Politie, en stimulering van nieuwe initiatieven op het vlak van onderzoek en innovatie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel43
  - number: 4:3.2.c)
    text: ondersteuning van de korpsen bij de ontwikkeling en uitvoering van hun beleid;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel43
  - number: 4:3.2.d)
    text: |-
      ontwikkeling van kaders voor bovenregionale samenwerking en voorzieningen binnen het politieconcern, onder meer op
      het terrein van de recherche.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel43
  - number: 4:4.1
    text: De afdeling Arbeidsvoorwaardenbeleid staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel44
  - number: 4:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel44
  - number: 4:4.2.a)
    text: |-
      voorbereiden en tot stand brengen van een arbeidsvoorwaardenbeleid (CAO) voor de politieorganisatie inclusief het
      georganiseerd overleg met de politievakorganisaties;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel44
  - number: 4:4.2.b)
    text: zorgen voor vastlegging van het arbeidsvoorwaardenbeleid in (rechtspositionele) wet- en regelgeving;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel44
  - number: 4:4.2.c)
    text: |-
      voor de politiekorpsen fungeren als aanspreek- en informatiepunt met betrekking tot vraagstukken op het gebied van
      de rechtspositie en arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel44
  - number: 4:4.2.d)
    text: |-
      ten behoeve van een aantal overlegvormen verzorgen van het secretariaat, en regisseren van de voorbereiding,
      inbreng, voortgang, resultaten en onderlinge afstemming.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel44
  - number: 4:5.1
    text: De afdeling Onderwijs en Loopbaanbeleid staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.a)
    text: |-
      ontwikkelen, vaststellen en evalueren van beleid betreffende het politieonderwijs en de inrichting ervan, waaronder
      de examinering;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.b)
    text: ontwerpen van eisen aan toekomstig onderwijs;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.c)
    text: vaststellen eindtermen en duur van basisopleidingen en overige aangewezen opleidingen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.d)
    text: |-
      ontwikkelen, vaststellen en evalueren van beleid betreffende de verdere ontwikkeling van medewerkers waar dit
      noodzakelijk is voor het op peil houden van de eenheid en de kwaliteit van de politie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.e)
    text: |-
      het houden van toezicht op de uitvoering van het onderwijsbeleid door het Landelijk Selectie- en Opleidingscentrum
      Politie (LSOP) en de regionale korpsen, alsmede het houden van toezicht op de bedrijfsvoering van het LSOP;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.f)
    text: ontwikkelen en beheer van systeem van functiewaardering;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.g)
    text: vaststellen topformatie regiokorpsen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:5.2.h)
    text: |-
      het ontwikkelen en evalueren van beleid inzake de personeelsontwikkeling, waaronder het diversiteitsbeleid en het
      personeelsvoorzieningbeleid.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel45
  - number: 4:6.1
    text: De afdeling Bedrijfsvoering en Toezicht staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:6.2.a)
    text: |-
      zorgen voor een toereikend budget voor politiezorg en het (verder) ontwikkelen, onderhouden en toepassen van het
      budgetverdeelsysteem, gericht op een evenwichtige en evenredige verdeling van budget over de korpsen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:6.2.b)
    text: het beheer en bedrijfsmatig toezicht op de bovenregionale voorzieningen en het LSOP;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:6.2.c)
    text: ontwikkelen en onderhouden van instrumenten ten behoeve van de beleids- en beheerscyclus van de korpsen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:6.2.d)
    text: |-
      de directiebrede coördinatie van en het inhoudelijk toetsen van beleidsplannen, begrotingen en jaarverslagen en het
      beoordelen van het financieel beheer binnen de korpsen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:6.2.e)
    text: onderhouden en ontwikkelen van de bestuurlijke informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:6.2.f)
    text: zorgen voor een toereikend budget voor het LSOP.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel46
  - number: 4:7.1
    text: De afdeling Financiën staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel47
  - number: 4:7.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel47
  - number: 4:7.2.a)
    text: |-
      beleidsadvisering met betrekking tot de financieel-economische aspecten van het politiebeleid en optreden als
      controller van directieleiding;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel47
  - number: 4:7.2.b)
    text: |-
      coördineren en uitvoeren van de centrale beleids- en begrotingscyclus, waaronder het opstellen van de
      ontwerpbegroting en meerjarenramingen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel47
  - number: 4:7.2.c)
    text: |-
      coördinatie en ordening van de uitvoering van de begroting en het verstrekken van financiële managementinformatie
      aan afdelingshoofden en directieleiding;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel47
  - number: 4:7.2.d)
    text: |-
      tot stand brengen en instandhouden van een doelmatige administratieve organisatie van de financiële functie van de
      directie politie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel47
  - number: 4:7.2.e)
    text: beoordeling rechtmatigheid en doelmatigheid van de besteding van rijksbijdragen.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel47
  - number: 4:8.1
    text: |-
      De afdeling Internationale Politiesamenwerking staat onder leiding van een hoofd en bij afwezigheid diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2.a)
    text: voorbereiding en uitvoering van besluitvorming in de Europese Unie op het gebied van de politiële samenwerking;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2.b)
    text: coördinatie van de Nederlandse politiële inzet in bilaterale betrekkingen met landen in Midden- en Oost-Europa;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2.c)
    text: ordenen en stimuleren van internationale samenwerking van en door de korpsen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2.d)
    text: coördinatie van de inzet van politiefunctionarissen ten behoeve van supranationale organisaties;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2.e)
    text: beheer van internationale samenwerkingsprojecten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2.f)
    text: bevorderen van grensoverschrijdende politiesamenwerking, met name met Duitsland en België;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:8.2.g)
    text: ontwikkelen van een internationaal politieloopbaanbeleid.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel48
  - number: 4:9.1
    text: De Stafafdeling staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 4:9.2
    text: 'De Stafafdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 4:9.2.a)
    text: |-
      coördinatie van alle afdelingsoverstijgende beleids- en bestuursaangelegenheden van de directie Politie en in
      voorkomende gevallen advisering hierover alsmede beleidsinhoudelijke ondersteuning van de directieleiding in de
      beantwoording van burgerbrieven;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 4:9.2.b)
    text: ambtelijk secretariaat van diverse interne en externe overleggen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 4:9.2.c)
    text: coördinatie van parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 4:9.2.d)
    text: verzorgen van interne en externe informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 4:9.2.e)
    text: facility-management van de directie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 4:9.2.f)
    text: coördinatie van het secretaresseteam van de directie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel49
  - number: 5:1
    text: |-
      De directie Rampenbeheersing en Brandweer bestaat uit de volgende onderdelen: - het cluster Directiemanagement
      bestaande uit de volgende afdelingen: - de Stafafdeling (Staf); - de afdeling Financiën en Control (F&C); - de
      afdeling Projecten en Beleidsondersteuning (P&B);
        - het cluster Risicobeleid (RB);
        - het cluster Voorbereiding Rampenbestrijding (VR);
        - het cluster Brandweer (B);
        - het cluster Bestuurlijke en Juridische Zaken (BJZ);
        - het cluster Internationale Zaken (IZ);
        - het cluster Kennis- en Informatiemanagement (KIM);
        - het cluster Uitvoering en Beheer (UB).
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel51
  - number: 5:2.1
    text: Het cluster Directiemanagement staat onder leiding van de plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel52
  - number: 5:2.2
    text: 'Het cluster Directiemanagement heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel52
  - number: 5:2.2.a)
    text: inzicht verkrijgen in de samenhang tussen de verschillende projecten en de relatie daarvan met de beleidstrajecten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel52
  - number: 5:2.2.b)
    text: financiële planning- en controlcyclus;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel52
  - number: 5:2.2.c)
    text: bewaking van de personele inzet binnen de directie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel52
  - number: 5:2.2.d)
    text: adviseren en ondersteunen van de directie op het gebied van bedrijfsvoering en secretariaat.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel52
  - number: 5:3.1
    text: De Stafafdeling staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2
    text: 'De Stafafdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2.a)
    text: de coördinatie van beheersaangelegenheden binnen de directie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2.b)
    text: de bewaking van de voortgang van de beleidsprocessen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2.c)
    text: de coördinatie van de interne besluitvormingsprocedures en verantwoordingscycli;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2.d)
    text: de bewaking van de voortgang en kwaliteit van de stukkenstroom naar de departementsleiding en de bewindspersonen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2.e)
    text: de coördinatie van de secretariaatswerkzaamheden binnen de directie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2.f)
    text: de organisatie van de overlegverbanden binnen de directie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:3.2.g)
    text: de voorbereiding en verslaglegging van het managementteam van de directie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel53
  - number: 5:4.1
    text: De afdeling Financiën en Control staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2.a)
    text: het fungeren als financieel adviseur van de directie (controlfunctie);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2.b)
    text: de sturing en beheersing van het begrotingsproces van de directie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2.c)
    text: de beheersing van de realisatie van de geraamde verplichtingen, uitgaven en middelen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2.d)
    text: |-
      de vormgeving en regulering van de administratieve organisatie en bestuurlijke informatievoorziening, binnen de
      daartoe binnen het ministerie en het directoraat-generaal gestelde kaders;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2.e)
    text: de bewaking van de kwaliteit van de financiële bedrijfsvoeringprocessen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2.f)
    text: |-
      de controle van de rechtmatigheid en doelmatigheid (onder meer door het nemen van initiatief tot beleidsevaluatie)
      van de uitgaven en ontvangsten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:4.2.g)
    text: het onderhouden van de externe relaties op financieel gebied.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel54
  - number: 5:5.1
    text: |-
      De afdeling Projecten en Beleidsondersteuning staat onder leiding van een hoofd en bij afwezigheid diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.a)
    text: werving en selectie van projectleiders en -medewerkers (zowel intern als extern);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.b)
    text: (modulaire) opleiding en bijscholing (ook voor projectdeelnemers uit de stafonderdelen of uit de beleidsclusters);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.c)
    text: planning van beschikbare projectcapaciteit op basis van aanvragen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.d)
    text: werkverdeling van de beschikbare capaciteit op basis van door het management gestelde prioriteiten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.e)
    text: leveren van professionele projectleiders en projectmedewerkers aan opdrachtgevers;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.f)
    text: monitoren van het verloop van de projecten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.g)
    text: zorg voor loopbaanontwikkeling van projectleiders en –medewerkers;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:5.2.h)
    text: |-
      bemiddeling tussen projectleider en lijnmanagers over capaciteitsvraagstukken, prioriteitsstelling tussen projecten
      en voorbereiding van de besluitvorming door het management van de directie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel55
  - number: 5:6.1
    text: Het beleidscluster Risicobeleid staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel56
  - number: 5:6.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel56
  - number: 5:6.2.a)
    text: |-
      de beleidsontwikkeling op landelijk niveau, waaronder: - de pro-actieve en preventieve aspecten van
      brandveiligheid;
        - het voorkomen en beperken van de gevolgen van (zware) ongevallen en rampen;
        - het actief volgen en tijdig signaleren van trends en ontwikkelingen op dit beleidsveld;
        - de ontwikkeling van een visie om te komen tot een hoger veiligheidsniveau door gedragsbeïnvloeding van bestuur
      en samenleving;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel56
  - number: 5:6.2.b)
    text: |-
      de formulering van juiste en geactualiseerde (wettelijke) voorschriften en normen waaronder de ontwikkeling van
      normen en scenario’s specifiek voor pro-actieve en preventieve toepassing;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel56
  - number: 5:6.2.c)
    text: |-
      het scheppen van voorwaarden waaronder de verantwoordelijke medeoverheden en organisaties hun werk kunnen doen
      zoals: '- zorgdragen dat landelijke kennis op het gebied van pro-actie en preventie wordt opgebouwd en in stand'
      blijft;
        - zorgdragen voor het beleid gericht op het versterken van de schakels pro-actie en preventie bij de regionale
      brandweren;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel56
  - number: 5:6.2.d)
    text: |-
      de afstemming en wisselwerking op het niveau van de ministeries, de andere overheden en de verantwoordelijke
      instanties en organisaties, waaronder het onderhouden van contacten met relevante partners;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel56
  - number: 5:6.2.e)
    text: het (doen) monitoren van de uitvoering van het beleid en de evaluatie van het risicobeleid.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel56
  - number: 5:7.1
    text: |-
      Het beleidscluster Voorbereiding Rampenbestrijding staat onder leiding van een hoofd en bij afwezigheid diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel57
  - number: 5:7.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel57
  - number: 5:7.2.a)
    text: |-
      de beleidsontwikkeling op landelijk niveau waaronder het uitvoeren van alle activiteiten van de beleidscyclus
      met betrekking tot de voorbereiding en organisatie van de rampenbestrijding en crisisbeheersing (zoals
      risicobeheersing, planvorming van de rampenbestrijding, grensoverschrijdende samenwerking, materieel, logistiek
      en telecom);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel57
  - number: 5:7.2.b)
    text: |-
      de formulering van juiste en geactualiseerde (wettelijke) voorschriften en normen waaronder: - voorschriften voor
      (de voorbereiding op) grootschalig brandweeroptreden;
        - voorschriften voor (de voorbereiding op) geneeskundige hulpverlening bij rampen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel57
  - number: 5:7.2.c)
    text: |-
      het scheppen van voorwaarden waaronder de verantwoordelijke medeoverheden en organisaties hun werk kunnen doen
      waaronder: '- de ontwikkeling van instrumenten voor risico-analyse;'
        - multidisciplinair en bestuurlijk oefenen en opleiden,
        - operationele informatievoorziening;
        - informatievoorziening aan de bevolking;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel57
  - number: 5:7.2.d)
    text: |-
      de afstemming en wisselwerking op het niveau van de ministeries, de andere overheden en de verantwoordelijke
      instanties en organisaties waaronder: - deelname aan – en initiëren van – (inter)nationale projecten op het gebied
      van de rampenbestrijding;
        - het onderhouden van contacten met alle relevante partners in de rampenbestrijding (zowel koepels als
      afzonderlijke leden, operationele diensten, andere directies binnen het directoraat-generaal en andere
      ministeries);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel57
  - number: 5:7.2.e)
    text: het (doen) monitoren van beleid, onder andere door gebruik te maken van ‘lessons learned’.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel57
  - number: 5:8.1
    text: Het beleidscluster Brandweer staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel58
  - number: 5:8.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel58
  - number: 5:8.2.a)
    text: |-
      de beleidsontwikkeling op landelijk niveau waaronder het uitvoeren van alle activiteiten van de beleidscyclus met
      betrekking tot de effectiviteit van de organisatie en werkwijze van de brandweer en met betrekking tot kwaliteit en
      de beschikbaarheid van het brandweerpersoneel;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel58
  - number: 5:8.2.b)
    text: |-
      de formulering van juiste en geactualiseerde (wettelijke) voorschriften en normen, waaronder: - de ontwikkeling,
      invoering en evaluatie van criteria waaraan de taakvervulling van de brandweer moet voldoen. Hierbij worden taken
      in de gehele veiligheidsketen beschouwd en wordt ook de relatie tussen de schakels bezien;
        - de ontwikkeling, invoering en evaluatie van criteria waaraan brandweerpersoneel moet voldoen om haar functies te
      kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel58
  - number: 5:8.2.c)
    text: |-
      het scheppen van voorwaarden waaronder de verantwoordelijke mede-overheden en organisaties hun werk kunnen doen,
      zoals: '- de zorg voor de beschikbaarheid van brandweerpersoneel door de monitoring van voldoende gekwalificeerd'
      brandweerpersoneel en het initiëren van acties als de beschikbaarheid van (groepen) personeel in gevaar dreigt te
      komen c.q. als de vertegenwoordiging van groepen personeel maatschappelijk gezien onder de norm is;
        - de organisatie en kwaliteit van het brandweeronderwijs waaronder het toezicht op de zelfstandige bestuursorganen
      het Nederlands Instituut voor de Brandweerzorg en Rampenbestrijding (NIBRA) en het Nederlands Bureau
      Brandweerexamens (NBBe);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel58
  - number: 5:8.2.d)
    text: |-
      de afstemming en wisselwerking op het niveau van de ministeries, de andere overheden en de verantwoordelijke
      instanties en organisaties waaronder: - deelname aan en initiëren van (inter)nationale projecten op het gebied van
      de brandweer;
        - het onderhouden van contacten met alle relevante partners (zowel koepels als afzonderlijke leden, operationele
      diensten, andere directies binnen het directoraat-generaal en andere ministeries);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel58
  - number: 5:8.2.e)
    text: |-
      het (doen) monitoren van het beleid met betrekking tot de effectiviteit van organisatie en werkwijze van de
      brandweer en met betrekking tot de kwaliteit van het brandweerpersoneel.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel58
  - number: 5:9.1
    text: |-
      Het directiebrede cluster Bestuurlijke en Juridische Zaken staat onder leiding van een hoofd en bij afwezigheid
      diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel59
  - number: 5:9.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel59
  - number: 5:9.2.a)
    text: |-
      het fungeren als oog en oor voor de directie met betrekking tot de ontwikkelingen op het vakgebied bestuurlijke
      en juridische aangelegenheden, waaronder het fungeren als bestuurlijke en juridische adviseur van de directie
      (juridische control);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel59
  - number: 5:9.2.b)
    text: |-
      de coördinatie en ondersteuning van de onderwerpen van het aandachtsgebied binnen de directie, de afstemming
      hierover met de beleidsclusters, waaronder: - het adviseren over juridische aspecten van de werkzaamheden die door
      de diverse clusters van de directie worden uitgevoerd (dit zowel op privaatrechtelijk als op publiekrechtelijk
      terrein);
        - het doen van voorstellen en geven van advies over de politiek-bestuurlijke aspecten van de rampenbestrijding, de
      brandweerzorg en het risicobeleid;
        - de coördinatie van de ontwikkeling van een directie -brede politiek-bestuurlijke antenne;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel59
  - number: 5:9.2.c)
    text: |-
      de vervulling van taken op het aandachtsgebied die niet (exclusief) zijn ondergebracht binnen de beleidsclusters,
      waaronder: '- de verzorging van wetgeving (zowel in formele als in materiële zin) op het terrein van de directie;'
        - het doen van voorstellen en geven van advies over de bestuurlijke structuur en bestuurlijk juridische kaders
      waarbinnen de provinciale, regionale en plaatselijke overheid functioneren inzake fysieke veiligheid.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel59
  - number: 5:10.1
    text: |-
      Het directiebrede cluster Internationale Zaken staat onder leiding van een hoofd en bij afwezigheid diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel510
  - number: 5:10.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel510
  - number: 5:10.2.a)
    text: |-
      het fungeren als oog en oor voor de directie met betrekking tot de internationale ontwikkelingen die van belang
      zijn voor het werk van de directie en de facilitering en ondersteuning van de beleidsclusters op dit gebied;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel510
  - number: 5:10.2.b)
    text: |-
      de coördinatie van de internationale onderwerpen binnen de directie en de afstemming hierover met de
      beleidsclusters, waaronder: - onderwerpen waarbij de beleidsclusters wel zijn betrokken en die meerdere clusters
      betreffen;
        - de zorg voor het overzicht van de internationale aspecten van de directie, waarbij het voortouw bij één van de
      andere clusters ligt;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel510
  - number: 5:10.2.c)
    text: |-
      de vervulling van taken op het aandachtsgebied Internationale Zaken die niet (exclusief) zijn ondergebracht binnen
      de beleidsclusters, waaronder: - de samenwerking met de prioriteitslanden in Europa, de NAVO, de EU en de VN;
        - de zorg voor (internationale) beleidsonderwerpen die een duidelijke clusteroverschrijdend karakter hebben zoals
      de grensoverschrijdende samenwerking.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel510
  - number: 5:11.1
    text: |-
      Het directiebrede cluster Kennis- en Informatie Management staat onder leiding van een hoofd en bij afwezigheid
      diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel511
  - number: 5:11.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel511
  - number: 5:11.2.a)
    text: |-
      kennismanagement, relatiebeheer en informatievoorziening (inventarisatie van alle relaties en spelers in het veld
      van brandweer en rampenbestrijding, de inhoud van de contacten daarmee en het actief en actueel ter beschikking
      stellen daarvan, het samenstellen, opbouwen en vullen van een kennisatlas, waaronder relatiebeheer en het bijdragen
      aan het directiebrede human resource, onder meer door inbreng van kennismanagement in opleidingen);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel511
  - number: 5:11.2.b)
    text: |-
      onderzoekscoördinatie (planning van onderzoek en de directiebrede view om aldus afstemming en synergie te
      bewerkstelligen en kennis ter beschikking te stellen, bijdragen aan de jaarlijkse onderzoeksrapportage van
      het directoraat‑generaal en aan de OOV onderzoeks-website, bijdragen aan de initiatieven die op het gebied van
      Strategische Kennis Ontwikkeling worden genomen);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel511
  - number: 5:11.2.c)
    text: |-
      communicatie en voorlichting (ontwikkeling van een eenduidig directiebeleid voor communicatie ten aanzien van de
      beleidsthema’s en ten aanzien van de in te zetten instrumenten, directiebrede coördinatie van de communicatie- en
      voorlichtingsfunctie en het fungeren als eerste aanspreekpunt voor de directie Voorlichting en Communicatie);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel511
  - number: 5:11.2.d)
    text: |-
      monitoring (organisatie en uitvoering van monitoring in het kader van het proces versterking rampenbestrijding,
      leveren van een bijdrage aan de ontwikkeling van de bestuurlijke rapportage en, na totstandkoming, beoordeling
      hiervan en voorbereiding rapportages minister aan Tweede Kamer);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel511
  - number: 5:11.2.e)
    text: |-
      accountmanagement (fungeren als directiebreed aanspreekpunt en het verzorgen van informatievoorziening en
      -uitwisseling tussen het ministerie en regio’s, ondersteuning regio’s bij het structureren en uitvoeren van het
      proces van versterking rampenbestrijding en het verkrijgen van inzicht in effecten van het beleid in de regio’s,
      voortgang van regionale invoeringstrajecten en rapportages en advisering beleidsclusters).
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel511
  - number: 5:12.1
    text: Het cluster Uitvoering en Beheer staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel512
  - number: 5:12.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel512
  - number: 5:12.2.a)
    text: |-
      de vertaling van het directiebeleid op het gebied van rampenbeheersing en brandweerzorg in benodigd materieel,
      telecommunicatie, geneeskundige hulpverlening, logistiek en in beleid betreffende het waarschuwen van bevolking;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel512
  - number: 5:12.2.b)
    text: |-
      het verstrekken van extra materieel voor grootschalige brandbestrijding en technische hulpverlening aan de
      regionale brandweren;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel512
  - number: 5:12.2.c)
    text: |-
      het verstrekken van extra materieel voor de geneeskundige hulpverlening bij ongevallen en rampen alsmede de
      bijzonder politiemiddelen voor de directie Politie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel512
  - number: 5:12.2.d)
    text: |-
      het voor evengenoemde taken op centraal niveau ontwikkelen van beleid, overgaan tot aanbesteding en ontwikkelen van
      logistieke beleidskaders voor de instandhouding ervan;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel512
  - number: 5:12.2.e)
    text: |-
      het beheer van bijzondere (politie)middelen, de uitrustingen voor de rampenbestrijdingen en de distributie en
      inname van uitrustingen wordt uitgevoerd door het Logistiek Centrum Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel512
  - number: 6:1
    text: |-
      De directie Veiligheid, Informatiebeleid en Projecten bestaat uit de volgende onderdelen: - de afdeling Integraal
      Veiligheidsbeleid (IVB);
        - de afdeling Informatiebeleid (IB);
        - de afdeling Projecten (P);
        - de afdeling Financiën (F);
        - de Stafafdeling (S).
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel61
  - number: 6:2.1
    text: |-
      De afdeling Integraal Veiligheidsbeleid staat onder leiding van een hoofd (tevens plaatsvervangend directeur) en
      bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2
    text: 'De afdeling Integraal Veiligheidsbeleid heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.a)
    text: |-
      het gecoördineerd voorbereiden, tot stand brengen en implementeren van de uitvoering van het integraal
      veiligheidsbeleid dat is vastgelegd in het Integraal Veiligheidsprogramma;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.b)
    text: |-
      het creëren en onderhouden van een interdepartementaal netwerk met mede-overheden, bedrijfsleven en
      maatschappelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.c)
    text: |-
      het stimuleren en (doen) verrichten van strategisch onderzoek ten behoeve van de voorbereiding en evaluatie van de
      beleidsontwikkeling op het terrein van de openbare orde en veiligheid inclusief integraal veiligheidsbeleid;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.d)
    text: |-
      het namens het ministerie voeren van de regie over de inbreng in de ambtelijke voorportalen voor de Raad
      voor Justitie, Bestuur en Veiligheid (RJBV), het verzorgen van de ambtelijke ondersteuning van de RJBV en het
      coördineren van de inbreng van het ministerie in andere voor het ministerie relevante ministeriële onderraden;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.e)
    text: |-
      het initiëren van visies en strategieën op het gebied van integraal veiligheidsbeleid en de bestuurlijke inbedding
      daarvan; het stimuleren van de daarmee samenhangende strategische beleidsontwikkeling en wet- en regelgeving; het
      initiëren en faciliteren van het overleg met alle betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.f)
    text: |-
      het (daartoe) ontwikkelen en instandhouden van een kenniscentrum, mede in relatie tot onderzoeken ten behoeve van
      de Integrale Veiligheidsrapportages;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.g)
    text: |-
      het inhoudelijk toetsen van stukken op het gebied van veiligheid (ook van andere ministeries) aan het
      overeengekomen strategische beleid;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.h)
    text: het adviseren van de ambtelijke en politieke leiding over het integraal veiligheidsbeleid;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:2.2.i)
    text: het behartigen van de internationale aspecten van het integraal veiligheidsbeleid.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel62
  - number: 6:3.1
    text: De afdeling Informatiebeleid staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2.a)
    text: |-
      het ontwikkelen van een strategische visie op het gebied van informatisering voor het veld van de openbare orde en
      veiligheid; het uitwerken daarvan naar beleidsplannen en wet- en regelgeving; het initiëren en faciliteren van het
      overleg met alle betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2.b)
    text: |-
      het vanuit het directoraat-generaal leveren van een bijdrage aan projecten op het gebied van de informatisering van
      het veld van de openbare orde en veiligheid;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2.c)
    text: |-
      het adviseren van de ambtelijke en politieke leiding over het informatiebeleid voor het veld van de openbare orde
      en veiligheid;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2.d)
    text: |-
      het ontwikkelen van een meerjarige visie op het beheer van de landelijke systemen en de infrastructuur (strategisch
      beheer);
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2.e)
    text: |-
      het aansturen van het agentschap Informatie en Communicatie Technologie Organisatie en andere opdrachtnemers bij
      het uitvoeren van het tactisch en operationeel beheer;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2.f)
    text: |-
      het aansturen van het agentschap ITO en van informatiseringsprojecten voor het veld van de openbare orde en
      veiligheid door het ontwikkelen van strategische en beleidsmatige kaders;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:3.2.g)
    text: |-
      het mede voeren van het inhoudelijk secretariaat van de tijdelijke Regieraad Informatie en Communicatie Technologie
      Politie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel63
  - number: 6:4.1
    text: De afdeling Projecten staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2.a)
    text: |-
      het volgen van en bijdragen aan de ontwikkelingen op het beleidsterrein openbare orde en veiligheid ten behoeve van
      een tijdige inschatting en signalering van mogelijke projecten die door de afdeling zouden moeten of kunnen worden
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2.b)
    text: |-
      het formuleren van projectideeën, waarbij wordt ingespeeld op het te ontwikkelen beleid op de diverse onderdelen
      van het veiligheidsbeleid;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2.c)
    text: |-
      het zorgdragen voor het realiseren van de doelstellingen van beleidsmatige, politieke of strategische projecten die
      het gehele beleidsterrein openbare orde en veiligheid betreffen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2.d)
    text: |-
      het actief volgen en analyseren van (inter)nationale ontwikkelingen op de (middel)lange termijn op de
      aandachtsgebieden van de projecten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2.e)
    text: |-
      het zorgen voor de aanbesteding van opdrachten uit te voeren door externe partijen; het aansturen en toetsen van de
      aanbestede werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2.f)
    text: |-
      het onderhouden van de contacten en het voeren van overleg (op bestuurlijk en managementniveau) met alle bij de
      projecten betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:4.2.g)
    text: het adviseren van de ambtelijke en politieke leiding over voortgang van en risico’s bij de projecten.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel64
  - number: 6:5.1
    text: De afdeling Financiën staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.a)
    text: de beheersing van de (meerjarige) begrotingscyclus;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.b)
    text: de realisatie van de geraamde verplichtingen, uitgaven en middelen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.c)
    text: de vormgeving en regulering van de administratieve organisatie en bestuurlijke informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.d)
    text: de bewaking van de kwaliteit van de bedrijfsvoeringsprocessen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.e)
    text: |-
      controle van de rechtmatigheid en doelmatigheid (o.a. door initiëren beleidsevaluatie) van de uitgaven en
      ontvangsten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.f)
    text: de controle van de rechtmatigheid en doelmatigheid van de uitgaven en ontvangsten;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.g)
    text: het beleidsinhoudelijk ondersteunen van de ambtelijke en politieke leiding met een second-opinion;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:5.2.h)
    text: |-
      participeren en het leveren van beleidsinhoudelijke bijdragen aan de ontwikkeling van bestaand en nieuw beleid op
      het terrein van de directie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel65
  - number: 6:6.1
    text: De Stafafdeling staat onder leiding van een hoofd en bij afwezigheid diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2
    text: 'De Stafafdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2.a)
    text: het beleidsinhoudelijk adviseren en ondersteunen van de directieleiding;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2.b)
    text: ambtelijk secretariaat van diverse in- en externe overleggen;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2.c)
    text: coördinatie van parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2.d)
    text: integrale planning en control;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2.e)
    text: het verzorgen van in- en externe informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2.f)
    text: facility-management van de directie;
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
  - number: 6:6.2.g)
    text: de coördinatie van de secretariële ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0015588/2004-09-01#Artikel66
