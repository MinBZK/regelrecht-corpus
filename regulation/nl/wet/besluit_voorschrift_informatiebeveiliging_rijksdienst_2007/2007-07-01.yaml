preamble:
  text: |-
    Handelend in overeenstemming met het gevoelen van de Ministerraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel1
  - number: 1.a
    text: |-
      Informatiebeveiliging: het proces van vaststellen van de vereiste betrouwbaarheid van informatiesystemen in termen
      van vertrouwelijkheid, beschikbaarheid en integriteit alsmede het treffen, onderhouden en controleren van een
      samenhangend pakket van bijbehorende maatregelen;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel1
  - number: 1.b
    text: |-
      Informatiesysteem: een samenhangend geheel van gegevensverzamelingen, en de daarbij behorende personen, procedures,
      processen en programmatuur alsmede de voor het informatiesysteem getroffen voorzieningen voor opslag, verwerking
      en communicatie.
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel1
  - number: '2.1'
    text: |-
      Dit voorschrift geldt voor de Rijksdienst waartoe gerekend worden de Ministeries met de daaronder ressorterende
      diensten, bedrijven en instellingen.
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel2
  - number: '2.2'
    text: |-
      Dit voorschrift geldt voor het gehele proces van informatievoorziening en de gehele levenscyclus van
      informatiesystemen, ongeacht de toegepaste technologie en ongeacht het karakter van de informatie.
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel2
  - number: '2.3'
    text: |-
      Informatiebeveiliging is een lijnverantwoordelijkheid en vormt een onderdeel van de kwaliteitszorg voor bedrijfs-
      en bestuursprocessen en de ondersteunende informatiesystemen.
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel2
  - number: '3'
    text: |-
      De secretaris-generaal van een Ministerie stelt het informatiebeveiligingsbeleid vast, draagt dit uit en legt
      verantwoording hierover af. Het beleid omvat ten minste:
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel3
  - number: 3.a
    text: |-
      De strategische uitgangspunten en randvoorwaarden die het Ministerie hanteert voor informatiebeveiliging en in het
      bijzonder de inbedding in, en afstemming op het algemene beveiligingsbeleid en het informatievoorzieningsbeleid;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel3
  - number: 3.b
    text: De organisatie van de informatiebeveiligingsfunctie, waaronder verantwoordelijkheden, taken en bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel3
  - number: 3.c
    text: De toewijzing van de verantwoordelijkheden voor ketens van informatiesystemen aan lijnmanagers;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel3
  - number: 3.d
    text: De gemeenschappelijke betrouwbaarheidseisen en normen die op het Ministerie van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel3
  - number: 3.e
    text: De frequentie waarmee het informatiebeveiligingsbeleid wordt geëvalueerd;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel3
  - number: 3.f
    text: De bevordering van het beveiligingsbewustzijn;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel3
  - number: '4'
    text: 'Het lijnmanagement is verantwoordelijk voor de beveiliging van zijn informatiesystemen. Het lijnmanagement:'
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel4
  - number: 4.a
    text: Stelt op basis van een expliciete risico afweging de betrouwbaarheidseisen voor zijn informatiesystemen vast;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel4
  - number: 4.b
    text: |-
      Is verantwoordelijk voor de keuze, de implementatie en het uitdragen van de maatregelen die voortvloeien uit de
      betrouwbaarheidseisen;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel4
  - number: 4.c
    text: |-
      Stelt vast dat de getroffen maatregelen aantoonbaar overeenstemmen met de betrouwbaarheidseisen en dat deze
      maatregelen worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel4
  - number: 4.d
    text: Evalueert periodiek het geheel van betrouwbaarheidseisen en beveiligingsmaatregelen en stelt deze waar nodig bij.
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het [Besluit voorschrift informatiebeveiliging rijksdienst 1994][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006836
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006836
  - number: '5.2'
    text: Dit besluit treedt in werking met ingang van 1 juli 2007.
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel5
  - number: '5.3'
    text: Dit besluit wordt aangehaald als het Besluit voorschrift informatiebeveiliging rijksdienst 2007.
    url: https://wetten.overheid.nl/BWBR0022141/2007-07-01#Artikel5
