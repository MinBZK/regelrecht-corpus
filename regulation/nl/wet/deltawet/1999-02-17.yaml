  - number: '5'
    text: |-
      1 De kosten van de werken, bedoeld in de [artikelen 1 onder I][ref1] en [3, eerste lid][ref2], worden door het
      Rijk gedragen.

      2 Aan degene die verplicht is tot uitvoering van werken als bedoeld in [artikel 1, onder II][ref3], wordt op
      aanvraag een bijdrage ten laste van het Rijk toegekend van 100 pct. in de directe kosten van uitvoering.

      3 Aan degene, die verplicht is tot uitvoering van werken of voorzieningen als bedoeld in
      [artikel 3, tweede lid][ref4], wordt op aanvraag een bijdrage ten laste van het Rijk van 100 pct. in de kosten van
      uitvoering toegekend.

      4 Onder directe kosten van uitvoering worden voor de toepassing van dit artikel verstaan:

      a. de kosten van met instemming van Onze Minister van Verkeer en Waterstaat aan derden opgedragen onderzoekingen
      ten behoeve van de uitvoering der werken;

      b. de kosten voortvloeiende uit de verwerving van de voor de uitvoering der werken benodigde gronden;

      c. alle kosten voortvloeiende uit de voor de uitvoering van de werken gesloten overeenkomsten van aanneming en
      overeenkomsten tot levering van benodigde materialen;

      d. de kosten tot vergoeding van door de uitvoering der werken ontstane schade, indien degene, die ingevolge het
      tweede en derde lid, aanspraak heeft op een bijdrage hiertoe rechtens is gehouden of indien Onze Minister van
      Verkeer en Waterstaat met de verlening van de vergoeding op billijkheidsgronden heeft ingestemd.

      5 Indien het doel van de versterking van een hoogwaterkering als bedoeld in [artikel 1, onder II][ref5], naar het
      oordeel van Onze Minister van Verkeer en Waterstaat wordt bereikt door de uitvoering van werken door een ander dan
      degene die ingevolge deze wet tot versterking van die hoogwaterkering verplicht is, wordt op aanvraag een bijdrage
      ten laste van het Rijk aan die ander toegekend tot een bedrag dat ten hoogste gelijk is aan de directe kosten van
      uitvoering van de werken, die de ingevolge deze wet verplichte anders ter versterking van de hoogwaterkering zou
      hebben moeten maken.

      6 De aanvraag tot verlening van een bijdrage, als bedoeld in het vijfde lid, wordt ingediend door tussenkomst van
      degene die anders tot versterking van de betreffende waterkering zou zijn gehouden.

      7 Aanvragen om toekenning van een in dit artikel bedoelde bijdrage worden gericht tot Onze Minister van Verkeer en
      Waterstaat, welke beslist op de aanvraag, Gedeputeerde Staten gehoord.

      8 Van de beschikking wordt mededeling gedaan aan gedeputeerde staten door toezending van een afschrift.


