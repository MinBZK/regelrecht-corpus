  - number: '7'
    text: |-
      1 Indien tengevolge of mede tengevolge van de uitvoering van werken als bedoeld in [artikel 1][ref1]
      buitendijkse gronden in waarde veranderen vindt deswege tussen het Rijk en de rechthebbende een verrekening
      plaats. Bij waardevermeerdering van deze gronden is de rechthebbende gehouden deze aan het Rijk te vergoeden.
      Bij waardevermindering wordt deze door het Rijk aan de rechthebbende vergoed. Bij de vaststelling van de
      waardeverandering wordt mede in aanmerking genomen de waardeverandering die voortvloeit uit de uitvoering van een
      doelmatige verkaveling en van inrichtingswerken, voorzover deze waardeverandering niet uit anderen hoofde met de
      rechthebbende wordt verrekend.

      2 Onder buitendijkse gronden worden verstaan al dan niet onder water gelegen gronden gelegen buiten
      hoogwaterkeringen en hoge gronden welker functie tot beveiliging tegen hoge stormvloeden geheel of ten dele is of
      wordt overgenomen door werken als bedoeld in [artikel 1][ref2]. Onder hoogwaterkeringen als bedoeld in de vorige
      volzin worden uitsluitend verstaan die, welke in beheer zijn bij een openbaar lichaam.

      3 Tenzij over de in het eerste lid bedoelde verrekening tussen het Rijk en de rechthebbende overeenstemming
      bestaat, stelt Onze Minister van Financiën bij beschikking het bedrag van de verrekening vast.

      4 De rechthebbende die zich met een in het derde lid bedoelde beschikking niet kan verenigen, kan daartegen binnen
      drie maanden na de verzending beroep instellen bij de arrondissementsrechtbank binnen welker ressort de gronden
      geheel of voor het grootste deel zijn gelegen.

      5 Op een ingevolge het vierde lid ingesteld beroep is het bepaalde in de artikelen 30-33 van de
      [Deltaschadewet][ref3] van overeenkomstige toepassing.

      6 Over het ingevolge het eerste lid te verrekenen bedrag van de waardeverandering wordt de wettelijke rente
      betaald. Deze wordt in geval van opgetreden waardevermindering berekend van de eerste dag van de maand waarin
      het werk waaruit de waardevermindering voortvloeit, is tot stand gekomen, tot de eerste dag van de maand waarin
      betaling van het te verrekenen bedrag plaatsvindt. In geval van opgetreden waardevermeerdering wordt de wettelijke
      rente berekend van de eerste dag van de maand volgende op die waarin door Onze Minister van Financiën aan de
      rechthebbende bij aangetekende brief het bedrag van de getaxeerde waardevermeerdering is medegedeeld tot de eerste
      dag van de maand waarin de betaling van het te verrekenen bedrag plaatsvindt.

      Verstrekte voorschotten worden op het bedrag, waarover de wettelijke rente wordt betaald in mindering gebracht.
      Voorschotten verstrekt na de datum waarop de wettelijke rente is ingegaan, worden in mindering gebracht vanaf de
      eerste dag van de maand waarin de betaling van de voorschotten heeft plaatsgevonden.

      7 Ten aanzien van de uitbetaling van een door het Rijk verschuldigde vergoeding als bedoeld in het eerste lid is
      het bepaalde in [artikel 28 van de Deltaschadewet][ref4] van overeenkomstige toepassing. Een hypotheekhouder die
      zich met een te zijnen aanzien door Onze Minister van Financiën vastgestelde regeling niet kan verenigen, kan
      daartegen binnen drie maanden na de verzending van de beschikking beroep instellen bij de arrondissementsrechtbank
      binnen welker ressort de gronden, waarop de regeling betrekking heeft, geheel of voor het grootste deel zijn
      gelegen.

      8 Zolang een door een rechthebbende verschuldigde vergoeding als bedoeld in het eerste lid niet is
      betaald, rust zij mede op de betreffende onroerende zaken als een schuldplichtigheid ten behoeve
      van het Rijk. Onze Minister van Financiën neemt vóór de totstandkoming van een werk, als bedoeld in
      [artikel 1][ref5], een beschikking houdende iedere daarvoor in aanmerking komende buitendijkse onroerende
      zaak, aangeduid met haar kadastrale aanduiding, waarop [artikel 7][ref6] van deze wet van toepassing
      is en doet deze uiterlijk ten dage van de totstandkoming van dat werk inschrijven in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref7]. Nadat voor
      een onroerende zaak de in het eerste lid bedoelde verrekening heeft plaatsgevonden, geeft Onze Minister
      daarvan een verklaring en doet deze onverwijld inschrijven in de hierboven genoemde openbare registers.
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref8] is op deze beschikkingen en verklaringen niet
      van toepassing.

      9 Indien met een rechthebbende van buitendijkse gronden geen overeenstemming bestaat omtrent de uitvoering van een
      doelmatige verkaveling en inrichtingswerken kan, zonder voorafgaande verklaring bij de wet dat het algemeen nut
      onteigening vordert, onteigening plaatsvinden van deze gronden.

      10 De onteigening geschiedt ten name van het Rijk of van een door Ons aan te wijzen rechtspersoonlijkheid bezittend
      lichaam.


