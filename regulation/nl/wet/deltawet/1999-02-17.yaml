  - number: '6'
    text: |-
      Indien ingevolge de [artikelen 1][ref1] of [3][ref2] werken worden uitgevoerd of voorzieningen worden getroffen
      door anderen dan het Rijk, kunnen aan dezen daartoe voorschotten uit ’s Rijks kas ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
