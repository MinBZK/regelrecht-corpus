  - number: '8'
    text: |-
      Bij of krachtens afzonderlijke wet worden regelen gesteld omtrent tegemoetkoming hetzij door het treffen van
      voorzieningen, hetzij in geld, in schade, welke door de in [artikel 1 onder I][ref1] bedoelde werken voor de
      visserij en aanverwante bedrijven en voor andere daarvoor in aanmerking komenden ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
