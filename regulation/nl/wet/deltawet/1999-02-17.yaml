preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de afsluiting van de zeearmen tussen de Westerschelde en de
    Rotterdamsche Waterweg en de versterking van de hoogwaterkering noodzakelijk is ter beveiliging van het land tegen
    hoge stormvloeden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Ter beveiliging van het land tegen hoge stormvloeden worden werken uitgevoerd:

      I. a. tot afsluiting van de zeearmen tussen de Westerschelde en de Rotterdamsche Waterweg door waterkeringen,
      lopende van Walcheren naar Noord-Beveland, van Noord-Beveland naar Schouwen, van Schouwen naar Goeree-Overflakkee,
      van Goeree-Overflakkee naar Voorne;

      b. tot afsluiting van met bedoelde zeearmen in open verbinding staande wateren, voorzover noodzakelijk of wenselijk
      in verband met de werken, bedoeld onder *a*;

      c. tot afsluiting van de Nieuwe Waterweg, met op Delfland en Voorne aansluitende hoogwaterkeringen;

      II. tot versterking van de hoogwaterkering langs:

      a. de zee tussen de Belgische grens bij het Zwin en de Westerschelde;

      b. de Westerschelde van de zee tot de Belgische grens;

      c. de kust tussen de Westerschelde en de Rotterdamsche Waterweg, zeewaarts van de werken, bedoeld onder I *a*;

      d. de Rotterdamsche Waterweg en daarmede in open verbinding staande wateren;

      e. het overige deel van de kust met inbegrip van die van de Waddeneilanden.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: '2'
    text: |-
      1 De werken, bedoeld in [artikel 1 onder I][ref1], worden uitgevoerd door het Rijk.

      2 De werken, bedoeld in [artikel 1 onder II][ref2], worden uitgevoerd door de beheerders dan wel door degenen die
      daartoe uit anderen hoofde verplicht zijn.

      3 De plannen ter uitvoering van de werken bedoeld in [artikel 1 onder I en onder II][ref3] worden door Ons op
      voordracht van Onze Minister van Verkeer en Waterstaat, na overleg met Gedeputeerde Staten, vastgesteld.

      4 De ontwerpen met toelichtingen voor de werken bedoeld in [artikel 1 onder II][ref4] worden vastgesteld door Onze
      voornoemde Minister, na overleg met degenen, die tot de uitvoering zijn gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
