  - number: '4'
    text: |-
      1 Indien het naar Ons oordeel gewenst is de uitvoering van een werk, als bedoeld in [artikel 1 onder II][ref1],
      te doen samengaan met die van een werk, als bedoeld in dat artikel onder I, kan de betrokken hoogwaterkering,
      in beheer of onderhoud bij anderen dan het Rijk, door Ons, Provinciale Staten gehoord, bij het Rijk in beheer of
      onderhoud worden genomen.

      2 Het bepaalde in het eerste lid is eveneens van toepassing, indien het naar Ons oordeel gewenst is de uitvoering
      te doen samengaan van werken, als bedoeld in [artikel 1 onder II][ref2].

      3 Na de uitvoering wordt de hoogwaterkering door Ons weder in beheer of onderhoud teruggegeven, met dien verstande
      dat de teruggave, indien de staten der provincie intussen onder Onze goedkeuring wijziging in het beheer of
      onderhoud hebben gebracht, aan de instelling geschiedt die daarmede alsdan is belast.

      4 Wij behouden Ons voor in afwijking van het bepaalde in het derde lid, Provinciale Staten gehoord, de
      hoogwaterkering in beheer of onderhoud bij het Rijk te houden, indien zulks in het algemeen belang noodzakelijk of
      wenselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel4
