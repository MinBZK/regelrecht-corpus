---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: deltawet
regulatory_layer: WET
publication_date: '2006-01-31'
valid_from: '1999-02-17'
bwb_id: BWBR0002283
url: https://wetten.overheid.nl/BWBR0002283/1999-02-17
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de afsluiting van de zeearmen tussen de Westerschelde en de
    Rotterdamsche Waterweg en de versterking van de hoogwaterkering noodzakelijk is ter beveiliging van het land tegen
    hoge stormvloeden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'Ter beveiliging van het land tegen hoge stormvloeden worden werken uitgevoerd:'
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.I.a
    text: |-
      tot afsluiting van de zeearmen tussen de Westerschelde en de Rotterdamsche Waterweg door waterkeringen, lopende van
      Walcheren naar Noord-Beveland, van Noord-Beveland naar Schouwen, van Schouwen naar Goeree-Overflakkee, van Goeree-
      Overflakkee naar Voorne;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.I.b
    text: |-
      tot afsluiting van met bedoelde zeearmen in open verbinding staande wateren, voorzover noodzakelijk of wenselijk in
      verband met de werken, bedoeld onder *a*;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.I.c
    text: tot afsluiting van de Nieuwe Waterweg, met op Delfland en Voorne aansluitende hoogwaterkeringen;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.II
    text: 'tot versterking van de hoogwaterkering langs:'
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.II.a
    text: de zee tussen de Belgische grens bij het Zwin en de Westerschelde;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.II.b
    text: de Westerschelde van de zee tot de Belgische grens;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.II.c
    text: de kust tussen de Westerschelde en de Rotterdamsche Waterweg, zeewaarts van de werken, bedoeld onder I *a*;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.II.d
    text: de Rotterdamsche Waterweg en daarmede in open verbinding staande wateren;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: 1.II.e
    text: het overige deel van de kust met inbegrip van die van de Waddeneilanden.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel1
  - number: '2.1'
    text: |-
      De werken, bedoeld in [artikel 1 onder I][ref1], worden uitgevoerd door het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '2.2'
    text: |-
      De werken, bedoeld in [artikel 1 onder II][ref1], worden uitgevoerd door de beheerders dan wel door degenen die
      daartoe uit anderen hoofde verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '2.3'
    text: |-
      De plannen ter uitvoering van de werken bedoeld in [artikel 1 onder I en onder II][ref1] worden door Ons op
      voordracht van Onze Minister van Verkeer en Waterstaat, na overleg met Gedeputeerde Staten, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '2.4'
    text: |-
      De ontwerpen met toelichtingen voor de werken bedoeld in [artikel 1 onder II][ref1] worden vastgesteld door Onze
      voornoemde Minister, na overleg met degenen, die tot de uitvoering zijn gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '3.1'
    text: |-
      Voorzieningen betreffende waterstaatswerken, welke naar het oordeel van Onze voornoemde Minister in het algemeen
      belang noodzakelijk of wenselijk zijn als gevolg van de uitvoering van de in [artikel 1][ref1] bedoelde werken,
      worden door het Rijk getroffen, tenzij het volgende lid van dit artikel daarop van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '3.2'
    text: |-
      Indien als gevolg van de uitvoering van de in [artikel 1][ref1] bedoelde werken voorzieningen moeten worden
      getroffen ter aanpassing van bestaande waterstaatswerken of nieuwe vervangende werken tot stand moeten worden
      gebracht, geschiedt dit door de beheerders dan wel door degenen, die daartoe uit anderen hoofde verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '4.1'
    text: |-
      Indien het naar Ons oordeel gewenst is de uitvoering van een werk, als bedoeld in [artikel 1 onder II][ref1],
      te doen samengaan met die van een werk, als bedoeld in dat artikel onder I, kan de betrokken hoogwaterkering,
      in beheer of onderhoud bij anderen dan het Rijk, door Ons, Provinciale Staten gehoord, bij het Rijk in beheer of
      onderhoud worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '4.2'
    text: |-
      Het bepaalde in het eerste lid is eveneens van toepassing, indien het naar Ons oordeel gewenst is de uitvoering te
      doen samengaan van werken, als bedoeld in [artikel 1 onder II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '4.3'
    text: |-
      Na de uitvoering wordt de hoogwaterkering door Ons weder in beheer of onderhoud teruggegeven, met dien verstande
      dat de teruggave, indien de staten der provincie intussen onder Onze goedkeuring wijziging in het beheer of
      onderhoud hebben gebracht, aan de instelling geschiedt die daarmede alsdan is belast.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel4
  - number: '4.4'
    text: |-
      Wij behouden Ons voor in afwijking van het bepaalde in het derde lid, Provinciale Staten gehoord, de
      hoogwaterkering in beheer of onderhoud bij het Rijk te houden, indien zulks in het algemeen belang noodzakelijk of
      wenselijk is.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel4
  - number: '5.1'
    text: |-
      De kosten van de werken, bedoeld in de [artikelen 1 onder I][ref1] en [3, eerste lid][ref2], worden door het Rijk
      gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002283#Artikel3
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002283
        artikel: '3'
  - number: '5.2'
    text: |-
      Aan degene die verplicht is tot uitvoering van werken als bedoeld in [artikel 1, onder II][ref1], wordt op aanvraag
      een bijdrage ten laste van het Rijk toegekend van 100 pct. in de directe kosten van uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '5.3'
    text: |-
      Aan degene, die verplicht is tot uitvoering van werken of voorzieningen als bedoeld in
      [artikel 3, tweede lid][ref1], wordt op aanvraag een bijdrage ten laste van het Rijk van 100 pct. in de kosten van
      uitvoering toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel3
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '3'
  - number: '5.4'
    text: 'Onder directe kosten van uitvoering worden voor de toepassing van dit artikel verstaan:'
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: 5.4.a
    text: |-
      de kosten van met instemming van Onze Minister van Verkeer en Waterstaat aan derden opgedragen onderzoekingen ten
      behoeve van de uitvoering der werken;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: 5.4.b
    text: de kosten voortvloeiende uit de verwerving van de voor de uitvoering der werken benodigde gronden;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: 5.4.c
    text: |-
      alle kosten voortvloeiende uit de voor de uitvoering van de werken gesloten overeenkomsten van aanneming en
      overeenkomsten tot levering van benodigde materialen;
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: 5.4.d
    text: |-
      de kosten tot vergoeding van door de uitvoering der werken ontstane schade, indien degene, die ingevolge het tweede
      en derde lid, aanspraak heeft op een bijdrage hiertoe rechtens is gehouden of indien Onze Minister van Verkeer en
      Waterstaat met de verlening van de vergoeding op billijkheidsgronden heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: '5.5'
    text: |-
      Indien het doel van de versterking van een hoogwaterkering als bedoeld in [artikel 1, onder II][ref1], naar het
      oordeel van Onze Minister van Verkeer en Waterstaat wordt bereikt door de uitvoering van werken door een ander dan
      degene die ingevolge deze wet tot versterking van die hoogwaterkering verplicht is, wordt op aanvraag een bijdrage
      ten laste van het Rijk aan die ander toegekend tot een bedrag dat ten hoogste gelijk is aan de directe kosten van
      uitvoering van de werken, die de ingevolge deze wet verplichte anders ter versterking van de hoogwaterkering zou
      hebben moeten maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '5.6'
    text: |-
      De aanvraag tot verlening van een bijdrage, als bedoeld in het vijfde lid, wordt ingediend door tussenkomst van
      degene die anders tot versterking van de betreffende waterkering zou zijn gehouden.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: '5.7'
    text: |-
      Aanvragen om toekenning van een in dit artikel bedoelde bijdrage worden gericht tot Onze Minister van Verkeer en
      Waterstaat, welke beslist op de aanvraag, Gedeputeerde Staten gehoord.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: '5.8'
    text: Van de beschikking wordt mededeling gedaan aan gedeputeerde staten door toezending van een afschrift.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel5
  - number: '6'
    text: |-
      Indien ingevolge de [artikelen 1][ref1] of [3][ref2] werken worden uitgevoerd of voorzieningen worden getroffen
      door anderen dan het Rijk, kunnen aan dezen daartoe voorschotten uit ’s Rijks kas ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002283#Artikel3
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002283
        artikel: '3'
  - number: '7.1'
    text: |-
      Indien tengevolge of mede tengevolge van de uitvoering van werken als bedoeld in [artikel 1][ref1] buitendijkse
      gronden in waarde veranderen vindt deswege tussen het Rijk en de rechthebbende een verrekening plaats.
      Bij waardevermeerdering van deze gronden is de rechthebbende gehouden deze aan het Rijk te vergoeden.
      Bij waardevermindering wordt deze door het Rijk aan de rechthebbende vergoed. Bij de vaststelling van de
      waardeverandering wordt mede in aanmerking genomen de waardeverandering die voortvloeit uit de uitvoering van een
      doelmatige verkaveling en van inrichtingswerken, voorzover deze waardeverandering niet uit anderen hoofde met de
      rechthebbende wordt verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '7.2'
    text: |-
      Onder buitendijkse gronden worden verstaan al dan niet onder water gelegen gronden gelegen buiten hoogwaterkeringen
      en hoge gronden welker functie tot beveiliging tegen hoge stormvloeden geheel of ten dele is of wordt overgenomen
      door werken als bedoeld in [artikel 1][ref1]. Onder hoogwaterkeringen als bedoeld in de vorige volzin worden
      uitsluitend verstaan die, welke in beheer zijn bij een openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '7.3'
    text: |-
      Tenzij over de in het eerste lid bedoelde verrekening tussen het Rijk en de rechthebbende overeenstemming bestaat,
      stelt Onze Minister van Financiën bij beschikking het bedrag van de verrekening vast.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
  - number: '7.4'
    text: |-
      De rechthebbende die zich met een in het derde lid bedoelde beschikking niet kan verenigen, kan daartegen binnen
      drie maanden na de verzending beroep instellen bij de arrondissementsrechtbank binnen welker ressort de gronden
      geheel of voor het grootste deel zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
  - number: '7.5'
    text: |-
      Op een ingevolge het vierde lid ingesteld beroep is het bepaalde in de artikelen 30-33 van de
      [Deltaschadewet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002748
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002748
  - number: '7.6'
    text: |-
      Over het ingevolge het eerste lid te verrekenen bedrag van de waardeverandering wordt de wettelijke rente
      betaald. Deze wordt in geval van opgetreden waardevermindering berekend van de eerste dag van de maand waarin
      het werk waaruit de waardevermindering voortvloeit, is tot stand gekomen, tot de eerste dag van de maand waarin
      betaling van het te verrekenen bedrag plaatsvindt. In geval van opgetreden waardevermeerdering wordt de wettelijke
      rente berekend van de eerste dag van de maand volgende op die waarin door Onze Minister van Financiën aan de
      rechthebbende bij aangetekende brief het bedrag van de getaxeerde waardevermeerdering is medegedeeld tot de eerste
      dag van de maand waarin de betaling van het te verrekenen bedrag plaatsvindt. Verstrekte voorschotten worden op het
      bedrag, waarover de wettelijke rente wordt betaald in mindering gebracht. Voorschotten verstrekt na de datum waarop
      de wettelijke rente is ingegaan, worden in mindering gebracht vanaf de eerste dag van de maand waarin de betaling
      van de voorschotten heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
  - number: '7.7'
    text: |-
      Ten aanzien van de uitbetaling van een door het Rijk verschuldigde vergoeding als bedoeld in het eerste lid is het
      bepaalde in [artikel 28 van de Deltaschadewet][ref1] van overeenkomstige toepassing. Een hypotheekhouder die zich
      met een te zijnen aanzien door Onze Minister van Financiën vastgestelde regeling niet kan verenigen, kan daartegen
      binnen drie maanden na de verzending van de beschikking beroep instellen bij de arrondissementsrechtbank binnen
      welker ressort de gronden, waarop de regeling betrekking heeft, geheel of voor het grootste deel zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel28
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '28'
  - number: '7.8'
    text: |-
      Zolang een door een rechthebbende verschuldigde vergoeding als bedoeld in het eerste lid niet is betaald,
      rust zij mede op de betreffende onroerende zaken als een schuldplichtigheid ten behoeve van het Rijk.
      Onze Minister van Financiën neemt vóór de totstandkoming van een werk, als bedoeld in [artikel 1][ref1],
      een beschikking houdende iedere daarvoor in aanmerking komende buitendijkse onroerende zaak, aangeduid
      met haar kadastrale aanduiding, waarop [artikel 7][ref2] van deze wet van toepassing is en doet deze
      uiterlijk ten dage van de totstandkoming van dat werk inschrijven in de openbare registers, bedoeld
      in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3]. Nadat voor een onroerende
      zaak de in het eerste lid bedoelde verrekening heeft plaatsgevonden, geeft Onze Minister daarvan
      een verklaring en doet deze onverwijld inschrijven in de hierboven genoemde openbare registers.
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref4] is op deze beschikkingen en verklaringen niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002283#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002283
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '7.9'
    text: |-
      Indien met een rechthebbende van buitendijkse gronden geen overeenstemming bestaat omtrent de uitvoering van een
      doelmatige verkaveling en inrichtingswerken kan, zonder voorafgaande verklaring bij de wet dat het algemeen nut
      onteigening vordert, onteigening plaatsvinden van deze gronden.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
  - number: '7.10'
    text: |-
      De onteigening geschiedt ten name van het Rijk of van een door Ons aan te wijzen rechtspersoonlijkheid bezittend
      lichaam.
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens afzonderlijke wet worden regelen gesteld omtrent tegemoetkoming hetzij door het treffen van
      voorzieningen, hetzij in geld, in schade, welke door de in [artikel 1 onder I][ref1] bedoelde werken voor de
      visserij en aanverwante bedrijven en voor andere daarvoor in aanmerking komenden ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '9.1'
    text: |-
      [Artikel 7, eerste lid, van de Wet op de waterkering][ref1] is niet van toepassing op de werken bedoeld in
      [artikel 1 onder I en onder II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002283/1999-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007801
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '9.2'
    text: |-
      Op de werken, bedoeld in [artikel 1 onder I][ref1] is de wet van 14 Juli 1904, *Stb.* 147, houdende bepalingen
      omtrent het ondernemen van droogmakerijen en indijkingen niet van toepassing.


