  - number: '3'
    text: |-
      1 Voorzieningen betreffende waterstaatswerken, welke naar het oordeel van Onze voornoemde Minister in het algemeen
      belang noodzakelijk of wenselijk zijn als gevolg van de uitvoering van de in [artikel 1][ref1] bedoelde werken,
      worden door het Rijk getroffen, tenzij het volgende lid van dit artikel daarop van toepassing is.

      2 Indien als gevolg van de uitvoering van de in [artikel 1][ref2] bedoelde werken voorzieningen moeten worden
      getroffen ter aanpassing van bestaande waterstaatswerken of nieuwe vervangende werken tot stand moeten worden
      gebracht, geschiedt dit door de beheerders dan wel door degenen, die daartoe uit anderen hoofde verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002283#Artikel1
