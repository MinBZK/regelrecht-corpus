  - number: '9'
    text: |-
      1 [Artikel 7, eerste lid, van de Wet op de waterkering][ref1] is niet van toepassing op de werken bedoeld in
      [artikel 1 onder I en onder II][ref2].

      2 Op de werken, bedoeld in [artikel 1 onder I][ref3] is de wet van 14 Juli 1904, *Stb.* 147, houdende bepalingen
      omtrent het ondernemen van droogmakerijen en indijkingen niet van toepassing.


