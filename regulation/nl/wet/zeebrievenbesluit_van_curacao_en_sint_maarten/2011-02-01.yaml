  - number: '44'
    text: |-
      Degene die rechtstreeks in zijn belang is getroffen door een op grond van dit besluit genomen ministeriële
      beschikking, kan hiertegen beroep instellen bij het Gerecht in eerste aanleg van Curaçao, onderscheidenlijk het
      Gerecht in eerste aanleg van Sint Maarten. Bij landsverordening worden de procedureregels met betrekking tot deze
      rechtsingang gegeven.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel44
  - number: '45'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen hiervan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel45
  - number: '46'
    text: Dit besluit wordt aangehaald als Zeebrievenbesluit van Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel46
