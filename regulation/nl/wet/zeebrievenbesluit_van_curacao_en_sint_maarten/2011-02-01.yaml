---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: zeebrievenbesluit_van_curacao_en_sint_maarten
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2011-02-01'
bwb_id: BWBR0005943
url: https://wetten.overheid.nl/BWBR0005943/2011-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 1 februari 1991, nr S/J 30.150/91, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Overwegende, dat het wenselijk is met het oog op een bestendige ontwikkeling van de Nederlands-Antilliaanse
    scheepvaart het Curaçaosch Zeebrievenbesluit 1933 (Stb. 1933, 110; P.B. 1933, no. 41) voor wat betreft de
    Nederlandse Antillen te vervangen door een nieuwe regeling met betrekking tot de nationaliteit van zeeschepen,
    waarin tevens een regeling ten aanzien van zeeschepen in rompbevrachting is opgenomen;

    De Raad van State van het Koninkrijk gehoord (advies van 13 augustus 1991, no. WO9.91.0065/K);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 31 maart 1993, nr. S/J 30.590/93,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.a
    text: 'het Koninkrijk: het Koninkrijk der Nederlanden;'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.b
    text: 'Onze Minister: Onze Minister in Curaçao, onderscheidenlijk Sint Maarten, verantwoordelijk voor scheepvaart;'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.c
    text: |-
      zeeschepen: alle schepen, daaronder begrepen kustvaarders, welke worden gebruikt tot de vaart ter zee of daartoe
      bestemd zijn, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.c.1°
    text: oorlogsvaartuigen;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.c.2°
    text: |-
      vaartuigen van zeilverenigingen of jachtclubs, als zodanig erkend door de bevoegde autoriteiten van Curaçao,
      onderscheidenlijk Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.c.3°
    text: vaartuigen, aan Curaçao, onderscheidenlijk Sint Maarten, welke tot de openbare dienst zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.c.4°
    text: reddingsvaartuigen;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.d
    text: |-
      rompbevrachting: de overeenkomst, waarbij de ene partij, de rompvervrachter, zich verbindt een zeeschip zonder
      bemanning voor een bepaalde tijd ter beschikking te stellen van haar wederpartij, de rompbevrachter, zonder
      daarover nog enige zeggenschap te houden, en de rompbevrachter het schip exploiteert;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.e
    text: |-
      buiten Curaçao teboekstaan: buiten Curaçao, daaronder begrepen een ander deel van het Koninkrijk, teboekstaan
      in een eigenaarsregister van zeeschepen, dat vergelijkbaar is met het openbaar register van teboekstelling van
      zeeschepen, bedoeld in artikel 193 van Boek 8 van het Burgerlijk Wetboek van Curaçao;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.f
    text: |-
      buiten Sint Maarten teboekstaan: buiten Sint Maarten, daaronder begrepen een ander deel van het Koninkrijk,
      teboekstaan in een eigenaarsregister van zeeschepen, dat vergelijkbaar is met het openbaar register van
      teboekstelling van zeeschepen, bedoeld in artikel 193 van Boek 8 van het Burgerlijk Wetboek van Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.g
    text: 'kapitein: de kapitein, degene die de kapitein vervangt of de schipper;'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.h
    text: 'Wetboek van Koophandel: het Wetboek van Koophandel van Curaçao, onderscheidenlijk Sint Maarten;'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.i
    text: 'de Nederlandse vlag: de vlag van het Koninkrijk;'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.j
    text: |-
      het openbaar register: het openbaar register, bedoeld in artikel 378 van het Wetboek van Koophandel van Curaçao,
      onderscheidenlijk Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: 1.1.k
    text: |-
      het openbaar rompbevrachtingsregister: het openbaar rompbevrachtingsregister, bedoeld in
      [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel5
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '5'
        paragraaf: '4'
  - number: 1.1.l
    text: |-
      vennootschap: maatschap naar burgerlijk recht of handelsrecht, de coöperatieve vereniging of vennootschap daaronder
      begrepen, of een andere rechtspersoon naar publiek- of privaatrecht, met uitzondering van een vennootschap welke
      geen winst beoogt.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: '1.2'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen voor de categorie zeeschepen waarvan de bruto-inhoud minder
      dan twintig kubieke meter of de bruto tonnage minder dan 6 bedraagt nadere regels worden gegeven dan wel kan worden
      bepaald dat dit besluit geheel of gedeeltelijk niet van toepassing is op deze categorie zeeschepen.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel1
  - number: '2.1'
    text: |-
      Curaçaose, onderscheidenlijk Sint Maartense zeeschepen zijn zeeschepen die in het openbaar register van Curaçao,
      onderscheidenlijk Sint Maarten teboekstaan.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel2
  - number: '2.2'
    text: |-
      Een zeeschip wordt in het openbaar register te boek gesteld indien het in eigendom toebehoort aan een of meer
      natuurlijke personen, dan wel aan een of meer vennootschappen die voldoen aan de vereisten van het derde,
      onderscheidenlijk het vierde lid, mits de eigenaar in Curaçao, onderscheidenlijk Sint Maarten bij voortduring
      vertegenwoordigd is door een persoon die bevoegd is hem inzake alle aangelegenheden betreffende het schip, de
      opvarenden en de lading te vertegenwoordigen en voor hem te handelen met derden. Deze vertegenwoordiger dient,
      met instemming van de eigenaar, te voorzien in zijn vervanging ingeval van tijdelijk verblijf buiten Curaçao,
      onderscheidenlijk Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel2
  - number: '2.3'
    text: |-
      De natuurlijke persoon, bedoeld in het tweede lid, bezit de nationaliteit van een lidstaat van de Europese Unie,
      van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, van Zwitserland
      of van de Verenigde Staten van Amerika.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel2
  - number: '2.4'
    text: |-
      De vennootschap, bedoeld in het tweede lid, is een vennootschap waarop het recht van een lidstaat van de Europese
      Unie, van een van de landen, eilanden of gebieden, bedoeld in artikel 355, eerste lid, tweede lid, eerste volzin,
      derde en vierde lid, alsmede het vijfde lid, onder c, van het Verdrag betreffende de werking van de Europese Unie,
      van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, van Zwitserland
      of van de Verenigde Staten van Amerika toepasselijk is.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel2
  - number: '2.5'
    text: |-
      Voor de toepassing van dit artikel wordt een vennootschap die geen winst beoogt, gelijkgesteld met een vennootschap
      als bedoeld in [artikel 1, eerste lid, onderdeel l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel1
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '1'
        paragraaf: '1'
  - number: '2.6'
    text: |-
      Zowel de permanente vertegenwoordiger, bedoeld in het tweede lid, als zijn plaatsvervanger moeten in Curaçao,
      onderscheidenlijk Sint Maarten hun vaste woonplaats onderscheidenlijk aldaar hun hoofdvestiging hebben. Zij zijn
      naast de eigenaar aansprakelijk voor het handelen onderscheidenlijk het nalaten te handelen ten aanzien van het
      zeeschip, de opvarenden en de lading, behoudens voor zover op grond van enige wettelijke regeling in Curaçao,
      onderscheidenlijk Sint Maarten zodanige aansprakelijkheid wordt uitgesloten dan wel beperkt.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel2
  - number: '3'
    text: |-
      Een zeeschip, dat in Curaçao, onderscheidenlijk Sint Maarten is of wordt gebouwd, wordt als een Curaçaos,
      onderscheidenlijk Sint Maartens zeeschip aangemerkt, totdat de bouwer het oplevert aan hem, voor wiens rekening het
      is gebouwd, ofwel het voor eigen rekening in de vaart brengt.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel3
  - number: '4.1'
    text: |-
      Door inschrijving in het openbaar rompbevrachtingsregister verkrijgt een zeeschip, dat buiten Curaçao,
      onderscheidenlijk Sint Maarten teboekstaat, de hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens zeeschip.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel4
  - number: '4.2'
    text: |-
      Het in het eerste lid bedoelde zeeschip verliest de hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens
      zeeschip met ingang van de dagtekening van de doorhaling van de inschrijving van het zeeschip in het openbaar
      rompbevrachtingsregister.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel4
  - number: '5.1'
    text: |-
      In Curaçao, onderscheidenlijk Sint Maarten is er een openbaar rompbevrachtingsregister dat gehouden wordt door Onze
      Minister. Onze Minister kan een instantie aanwijzen die het openbaar rompbevrachtingsregister, onder door hem te
      stellen voorwaarden, namens hem houdt. Hij kan deze instantie machtigen tot het uitoefenen van de bevoegdheden die
      hem bij of krachtens de [artikelen 5 tot en met 12][ref1] en [33][ref2] van dit besluit toekomen, met uitzondering
      van die bevoegdheden, bedoeld in de [artikelen 5, eerste lid][ref3], [8, vijfde lid][ref4], [9, onderdeel g][ref5],
      en [10][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005943#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005943#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0005943#Artikel10
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '33'
        paragraaf: '13'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '5'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005943
        artikel: '8'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0005943
        artikel: '9'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0005943
        artikel: '10'
        paragraaf: '4'
  - number: '5.2'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, worden de inrichting van het rompbevrachtingsregister en de
      gegevens die daarin worden opgenomen ten aanzien van elk daarin ingeschreven zeeschip, geregeld.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel5
  - number: '5.3'
    text: |-
      Desgevraagd verleent Onze Minister inzage in het rompbevrachtingsregister en geeft tegen kostprijs voor eensluidend
      gewaarmerkte uittreksels daaruit af. De hoogte van de vergoeding en de wijze van betaling voor de verlening van de
      inzage worden bij landsbesluit, houdende algemene maatregelen, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel5
  - number: '6.1'
    text: |-
      Een zeeschip, dat buiten Curaçao, onderscheidenlijk Sint Maarten teboekstaat, kan in het openbaar
      rompbevrachtingsregister worden ingeschreven, indien het zeeschip in rompbevrachting is afgestaan aan een of
      meer natuurlijke personen, dan wel aan een of meer vennootschappen die voldoen aan de vereisten van het tweede,
      onderscheidenlijk het derde lid, mits de eigenaar in Curaçao, onderscheidenlijk Sint Maarten bij voortduring
      vertegenwoordigd is door een persoon die bevoegd is hem inzake alle aangelegenheden betreffende het schip, de
      opvarenden en de lading te vertegenwoordigen en voor hem te handelen met derden. Deze vertegenwoordiger dient,
      met instemming van de eigenaar, te voorzien in zijn vervanging ingeval van tijdelijk verblijf buiten Curaçao,
      onderscheidenlijk Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel6
  - number: '6.2'
    text: |-
      De natuurlijke persoon, bedoeld in het eerste lid, bezit de nationaliteit van een lidstaat van de Europese Unie,
      van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, van Zwitserland
      of van de Verenigde Staten van Amerika.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel6
  - number: '6.3'
    text: |-
      De vennootschap, bedoeld in het eerste lid, is een vennootschap waarop het recht van een lidstaat van de Europese
      Unie, van een van de landen, eilanden of gebieden, bedoeld in artikel 355, eerste lid, tweede lid, eerste volzin,
      derde en vierde lid, alsmede het vijfde lid, onder c, van het Verdrag betreffende de werking van de Europese Unie,
      van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, van Zwitserland
      of van de Verenigde Staten van Amerika toepasselijk is.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel6
  - number: '6.4'
    text: |-
      Voor de toepassing van dit artikel wordt een vennootschap die geen winst beoogt, gelijkgesteld met een vennootschap
      als bedoeld in [artikel 1, eerste lid, onderdeel l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel1
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '1'
        paragraaf: '1'
  - number: '6.5'
    text: |-
      Zowel de permanente vertegenwoordiger, bedoeld in het eerste lid, als zijn plaatsvervanger moeten in Curaçao,
      onderscheidenlijk Sint Maarten hun vaste woonplaats onderscheidenlijk aldaar hun hoofdvestiging hebben. Zij zijn
      naast de rompbevrachter aansprakelijk voor het handelen onderscheidenlijk het nalaten te handelen ten aanzien van
      het zeeschip in rompbevrachting, de opvarenden en de lading, behoudens voor zover op grond van enige wettelijke
      regeling in Curaçao, onderscheidenlijk Sint Maarten zodanige aansprakelijkheid wordt uitgesloten dan wel beperkt.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel6
  - number: '6.6'
    text: |-
      Onverminderd het bepaalde in het eerste lid en het bepaalde in [artikel 4, eerste lid][ref1], kan een zeeschip
      dat in het openbaar register teboekstaat tevens in het openbaar rompbevrachtingsregister worden ingeschreven.
      In dat geval is het bepaalde in de [artikelen 6][ref2], [7, eerste lid, onderdeel b, en tweede lid][ref3],
      [8, eerste, tweede, vierde tot en met zevende lid][ref4], [9][ref5] en [10][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005943#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005943#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0005943#Artikel10
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '7'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005943
        artikel: '8'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0005943
        artikel: '9'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0005943
        artikel: '10'
        paragraaf: '4'
  - number: '6.7'
    text: |-
      De rompbevrachter is niet bevoegd over de eigendom van het aan hem in rompbevrachting afgestane zeeschip te
      beschikken, dit zeeschip te bezwaren of daarop zakelijke rechten te vestigen.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel6
  - number: '7.1'
    text: 'De rompbevrachter draagt er voor zorg dat:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel7
  - number: 7.1.a
    text: |-
      ingevolge de wetgeving van de staat waar het schip teboekstaat er geen beletselen zijn voor het verkrijgen
      van de hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens zeeschip in verband met het aangaan van een
      rompbevrachtingsovereenkomst met een in Curaçao, onderscheidenlijk Sint Maarten gevestigde rompbevrachter;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel7
  - number: 7.1.b
    text: |-
      de eigenaar schriftelijk instemt met het verkrijgen van de hoedanigheid van Curaçaos, onderscheidenlijk Sint
      Maartens zeeschip;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel7
  - number: '7.2'
    text: |-
      Voorafgaand aan de inschrijving dient de rompbevrachter te verklaren dat hij de zeggenschap en de
      verantwoordelijkheid aanvaardt voor het schip en zijn opvarenden die voortvloeien uit de hoedanigheid van Curaçaos,
      onderscheidenlijk Sint Maartens zeeschip.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel7
  - number: '8.1'
    text: |-
      De aanvraag tot inschrijving van een zeeschip in het openbaar rompbevrachtingsregister wordt door de rompbevrachter
      schriftelijk ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '8.2'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, wordt bepaald welke gegevens en bescheiden de rompbevrachter aan
      Onze Minister bij de aanvraag dient over te leggen.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '8.3'
    text: |-
      De rompbevrachter toont ten genoegen van Onze Minister aan dat het schip niet gerechtigd is de vlag te voeren van
      de staat waar het schip buiten Curaçao, onderscheidenlijk Sint Maarten teboekstaat zolang het schip in Curaçao,
      onderscheidenlijk Sint Maarten in het openbaar rompbevrachtingsregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '8.4'
    text: |-
      Onze Minister kan de rompbevrachter verzoeken nadere gegevens over te leggen alvorens op het verzoek om
      inschrijving te beslissen.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '8.5'
    text: |-
      Onze Minister weigert de inschrijving of staat deze onder voorwaarden toe, indien de verkrijging van de
      hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens zeeschip niet verenigbaar is met volkenrechtelijke
      verplichtingen van het Koninkrijk onderscheidenlijk zonder het stellen van voorwaarden niet verenigbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '8.6'
    text: |-
      Onze Minister kan aan de inschrijving voorwaarden verbinden teneinde de voldoening van de vorderingen uit de
      arbeidsovereenkomsten van de kapitein en de overige leden van de bemanning steeds gedurende ten minste één jaar
      te verzekeren.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '8.7'
    text: |-
      Voor de behandeling van de aanvraag tot inschrijving alsmede voor het ingeschreven houden van het zeeschip in het
      openbaar rompbevrachtingsregister, is een vergoeding verschuldigd. De hoogte van de vergoedingen en de wijze van
      betaling daarvan worden bij landsbesluit, houdende algemene maatregelen, vastgesteld, Een aanvraag wordt niet in
      behandeling genomen zolang de vastgestelde vergoeding niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '8.8'
    text: |-
      Het bepaalde in het derde lid is niet van toepassing op zeeschepen die teboekstaan in het openbaar register,
      bedoeld in Boek 8 van het Burgerlijk Wetboek van het Europese deel van Nederland of in Boek 8 van het Burgerlijk
      Wetboek van Aruba.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel8
  - number: '9'
    text: 'Onze Minister haalt de inschrijving van een zeeschip in het openbaar rompbevrachtingsregister door:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
  - number: 9.a
    text: bij het einde van de rompbevrachting;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
  - number: 9.b
    text: op aanvraag van de rompbevrachter;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
  - number: 9.c
    text: |-
      indien uit gegevens overgelegd door de rompbevrachter overeenkomstig het bepaalde in [artikel 13][ref1] blijkt dat
      niet langer wordt voldaan aan de vereisten, bedoeld in [artikel 6, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel6
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '13'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
  - number: 9.d
    text: |-
      indien is gebleken dat een of meer van de overgelegde gegevens krachtens [artikel 8, tweede lid][ref1], zodanig
      onvolledig of onjuist waren dat, ware dit ten tijde van de beoordeling van het verzoek om inschrijving bekend
      geweest, het verzoek zou zijn afgewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel8
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '8'
        paragraaf: '4'
  - number: 9.e
    text: |-
      indien is gebleken van feiten of omstandigheden, voorgevallen onderscheidenlijk opgetreden na het tijdstip van
      indiening van de aanvraag, welke van zodanige aard zijn dat niet langer wordt voldaan aan de vereisten, bedoeld in
      [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel6
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
  - number: 9.f
    text: |-
      indien is gebleken dat de rompbevrachter overeenkomsten heeft aangegaan die tot gevolg hebben dat de zeggenschap
      onderscheidenlijk de verantwoordelijkheid van de rompbevrachter wezenlijk wordt aangetast;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
  - number: 9.g
    text: |-
      indien de hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens zeeschip niet langer verenigbaar is met
      volkenrechtelijke verplichtingen van het Koninkrijk en de onverenigbaarheid niet kan worden opgeheven door het
      stellen van voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel9
  - number: '10'
    text: 'Onze Minister kan de inschrijving van een zeeschip in het openbaar rompbevrachtingsregister doorhalen:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
  - number: 10.a
    text: |-
      indien de kapitein zich niet houdt aan de verplichting genoemd in [artikel 28, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel28
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '28'
        paragraaf: '11'
  - number: 10.b
    text: 'indien een van de volgende feiten zich voordoet:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
  - number: 10.b.1°
    text: |-
      indien het schip opzettelijk zodanig wordt gebruikt, dat het gevaar ontstaat, dat het Koninkrijk in een oorlog
      wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
  - number: 10.b.2°
    text: |-
      indien met het schip enig van regeringswege gegeven en bekend gemaakt bijzonder voorschrift tot handhaving van het
      niet deelnemen aan een oorlog opzettelijk wordt overtreden;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
  - number: 10.c
    text: |-
      indien het schip wordt gebruikt voor het vervoer van verdovende middelen in de zin van de Opiumlandsverordening
      1960;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
  - number: 10.d
    text: |-
      indien het schip op een zodanige wijze is gebruikt dat dientengevolge de betrekkingen van het Koninkrijk met een of
      meer andere staten ernstig worden benadeeld;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
  - number: 10.e
    text: |-
      indien door de minister op grond van [artikel 8, vijfde of zesde lid][ref1], gestelde voorwaarden niet worden
      nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel8
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '8'
        paragraaf: '4'
  - number: '11.1'
    text: Partijen zijn vrij in het kiezen van de vorm van de rompbevrachtingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel11
  - number: '11.2'
    text: 'De rompbevrachtingsovereenkomst dient ten minste de volgende elementen te bevatten:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel11
  - number: 11.2.a
    text: |-
      de rompvervrachter verbindt zich voor de duur van de rompbevrachting een zeeschip zonder bemanning ter beschikking
      te stellen van de rompbevrachter, zonder daarover nog enige zeggenschap te houden;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel11
  - number: 11.2.b
    text: |-
      de rompbevrachter aanvaardt voor de duur van de rompbevrachting de exploitatie voor eigen rekening van het
      zeeschip, met inbegrip van de bevoegdheid de kapitein en de overige bemanningsleden aan te stellen;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel11
  - number: 11.2.c
    text: |-
      de rompbevrachter aanvaardt de zeggenschap en verantwoordelijkheid voor het zeeschip en zijn opvarenden die
      voortvloeien uit de hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens zeeschip, en
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel11
  - number: 11.2.d
    text: de duur van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel11
  - number: '11.3'
    text: |-
      Bedingen die in strijd zijn met het bepaalde in het tweede lid of daarin enige beperking aanbrengen, zijn van
      rechtswege nietig.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister stelt de eigenaar van het zeeschip, de rompbevrachter en de bevoegde autoriteit van het land, waar
      het schip buiten Curaçao, onderscheidenlijk Sint Maarten teboekstaat, onverwijld in kennis van elke inschrijving
      van een zeeschip in het openbaar rompbevrachtingsregister, van elke wijziging of aanvulling van ingeschreven
      gegevens, alsmede van een beslissing tot doorhaling van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister stelt de Hoofdbewaarder der Scheepsbewijzen in het Europese deel van Nederland, de Bewaarder der
      Scheepsbewijzen in Aruba of de Bewaarder van het openbaar register onverwijld in kennis van een inschrijving in
      het openbaar rompbevrachtingsregister, van elke wijziging of aanvulling van ingeschreven gegevens, alsmede van een
      beslissing tot doorhaling van de inschrijving van een zeeschip dat teboekstaat in het Europese deel van Nederland,
      in Aruba, Curaçao, onderscheidenlijk Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel12
  - number: '12.3'
    text: |-
      De kennisgeving van een beslissing tot doorhaling als bedoeld in het eerste en tweede lid geschiedt ten minste
      veertien dagen vóór de dagtekening van de doorhaling.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel12
  - number: '13'
    text: |-
      De rompbevrachter stelt Onze Minister onverwijld schriftelijk in kennis van wijzigingen in gegevens betreffende
      de rompbevrachtingsovereenkomst, van het aangaan van enige nadere overeenkomst, alsmede van alle wijzigingen in de
      omstandigheden, voor zover deze van belang kunnen zijn in verband met de inschrijving dan wel de doorhaling van een
      inschrijving van een zeeschip in het openbaar rompbevrachtingsregister.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel13
  - number: '14.1'
    text: |-
      Curaçaose, onderscheidenlijk Sint Maartense zeeschepen als bedoeld in [artikel 2, eerste lid][ref1], zeeschepen
      die als Curaçaose, onderscheidenlijk Sint Maartense zeeschepen worden aangemerkt als bedoeld in [artikel 3][ref2],
      en zeeschepen die de hoedanigheid van Curaçaose, onderscheidenlijk Sint Maartense zeeschepen bezitten, bedoeld in
      [artikel 4, eerste lid][ref3], dienen, willen zij gerechtigd zijn de Nederlandse vlag te voeren, voorzien te zijn
      van een geldige zeebrief, afgegeven overeenkomstig de voorschriften van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel4
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '4'
        paragraaf: '3'
  - number: '14.2'
    text: |-
      De voorwaarde, dat het zeeschip voorzien is van een geldige zeebrief geldt niet, wanneer het wordt gebruikt voor de
      openbare dienst of, voor zover het betreft een in Curaçao, onderscheidenlijk Sint Maarten nieuw gebouwd zeeschip,
      wanneer het een proefvaart doet.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel14
  - number: '15.1'
    text: |-
      Een zeebrief wordt in naam van de Koning uitgereikt door of namens Onze Minister na overlegging van een
      afschrift van de teboekstelling van het zeeschip in het openbaar register of van de inschrijving in het openbaar
      rompbevrachtingsregister alsmede van de volgens de bestaande wettelijke voorschriften afgegeven meetbrief of een
      uittreksel hiervan.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel15
  - number: '15.2'
    text: |-
      Indien het afschrift van de teboekstelling of inschrijving meer dan twee dagen voor die van de overlegging is
      uitgereikt, moet daarop voorkomen een binnen die termijn gestelde verklaring van de Bewaarder van het openbare
      register onderscheidenlijk van het openbaar rompbevrachtingsregister dat sedert de uitreiking van het afschrift, de
      teboekstelling of de inschrijving niet gewijzigd is.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel15
  - number: '16.1'
    text: |-
      Voor Curaçaose, onderscheidenlijk Sint Maartense zeeschepen, bedoeld in [artikel 2, eerste lid][ref1], alsmede
      schepen die worden aangemerkt als Curaçaose, onderscheidenlijk Sint Maartense zeeschepen als bedoeld in
      [artikel 3][ref2] worden zeebrieven, met uitzondering van de voorlopige zeebrieven en de buitengewone zeebrieven,
      slechts afgegeven, indien de schepen overeenkomstig de daaromtrent bestaande voorschriften zijn teboekgesteld in
      het openbaar register.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel3
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '3'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      De aanvraag tot verkrijging van een zeebrief voor zeeschepen die in het openbaar rompbevrachtingsregister
      zijn ingeschreven wordt ingediend door of namens degene op wiens naam het zeeschip in voornoemd register is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel16
  - number: '16.3'
    text: |-
      Zeebrieven worden niet afgegeven voor zeeschepen op voet van oorlog uitgerust, noch voor zeeschepen van welke
      Onze Minister vermoedt dat zij in strijd met de onzijdigheid van het Koninkrijk op voet van oorlog zullen worden
      uitgerust.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel16
  - number: '17.1'
    text: |-
      De aanvraag tot verkrijging van een zeebrief voor zeeschepen die in het openbaar register teboekstaan wordt
      ingediend door of namens degene op wiens naam het zeeschip in voornoemd register is teboekgesteld.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel17
  - number: '17.2'
    text: |-
      De aanvraag tot verkrijging van een zeebrief voor zeeschepen die in het openbaar rompbevrachtingsregister
      zijn ingeschreven wordt ingediend door of namens degene op wiens naam het zeeschip in voornoemd register is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel17
  - number: '18'
    text: 'Een zeebrief afgegeven ten behoeve van een zeeschip dat in het openbaar register is teboekgesteld vermeldt:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel18
  - number: 18.a
    text: de naam van het zeeschip en die van het kantoor, alwaar het in het openbaar register is teboekgesteld;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel18
  - number: 18.b
    text: de bruto en netto tonnage volgens de meetbrief;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel18
  - number: 18.c
    text: de beschrijving van het zeeschip volgens de teboekstelling in het openbaar register;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel18
  - number: 18.d
    text: |-
      de naam van de eigenaar van het zeeschip en van diens vertegenwoordiger, bedoeld in [artikel 2, tweede lid][ref1],
      en zijn adres in Curaçao, onderscheidenlijk Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
  - number: 18.e
    text: de datum van afgifte alsmede de vervaldatum.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel18
  - number: '19'
    text: |-
      Een zeebrief afgegeven ten behoeve van een zeeschip dat in het openbaar rompbevrachtingsregister is ingeschreven,
      vermeldt:
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
  - number: 19.a
    text: |-
      de naam van het zeeschip die gevoerd wordt tijdens de duur van de rompbevrachting en het kantoor van het openbaar
      rompbevrachtingsregister alwaar het schip is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
  - number: 19.b
    text: |-
      de naam en het adres van het desbetreffende register waar de eigenaar van het zeeschip buiten Curaçao,
      onderscheidenlijk Sint Maarten teboekstaat, de naam en het adres van het betreffende register van die staat; indien
      de naam van het zeeschip zoals het in het register buiten Curaçao, onderscheidenlijk Sint Maarten teboekstaat een
      andere is dan die zoals opgenomen in het openbaar rompbevrachtingsregister, wordt tevens die andere naam van het
      zeeschip vermeld;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
  - number: 19.c
    text: |-
      de naam van de rompbevrachter en van diens vertegenwoordiger, bedoeld in [artikel 6, eerste lid][ref1], en zijn
      adres in Curaçao, onderscheidenlijk Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel6
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
  - number: 19.d
    text: de bruto en netto tonnage, volgens de meetbrief;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
  - number: 19.e
    text: de verdere beschrijving van het schip volgens de inschrijving in het openbaar rompbevrachtingsregister;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
  - number: 19.f
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
  - number: 19.g
    text: de termijn waarvoor de zeebrief is verstrekt, die niet langer kan zijn dan de duur van de rompbevrachting.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel19
  - number: '20.1'
    text: |-
      Bij aankoop of aanbouw van een zeeschip buiten Curaçao, onderscheidenlijk Sint Maarten kan door of namens Onze
      Minister in naam van de Koning voor dat zeeschip een voorlopige zeebrief worden uitgereikt, indien is voldaan aan
      de vereisten genoemd in [artikel 2, tweede lid][ref1], nadat de eigendom naar het oordeel van Onze Minister op
      voldoende wijze is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
  - number: '20.2'
    text: |-
      De voorlopige zeebrief vermeldt de naam van het zeeschip, de inhoud van het zeeschip naar de meting van het land,
      waar het is aangekocht of gebouwd, de soort en andere kenmerken van het zeeschip en de naam van de natuurlijke
      persoon of de rechtspersoon, de rederij of de vennootschap aan wie of aan welke het schip toebehoort. De zeebrief
      is geldig voor de daarin vermelde termijn, met dien verstande dat deze termijn niet langer kan zijn dan zes maanden
      na de dagtekening van de voorlopige zeebrief.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel20
  - number: '20.3'
    text: |-
      Een voorlopige zeebrief, bedoeld in het eerste lid, kan ook worden afgegeven voor zeeschepen die in het openbaar
      rompbevrachtingsregister zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel20
  - number: '20.4'
    text: |-
      Bij aankomst in Curaçao, onderscheidenlijk Sint Maarten wordt de voorlopige zeebrief bij de inklaring door de
      daarmede belaste ambtenaren ingehouden.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister kan, zo nodig, in naam van de Koning een buitengewone zeebrief verlenen voor een zeeschip, dat in
      Curaçao, onderscheidenlijk Sint Maarten is gebouwd, gekocht of uitgerust, voor rekening van personen die niet aan
      de nationaliteitsvereisten, genoemd in [artikel 2, tweede lid][ref1], voldoen, opdat dit schip onder Nederlandse
      vlag rechtstreeks binnen een bij die zeebrief bepaalde termijn naar het land van zijn bestemming kan worden
      gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Bij aankomst op de plaats van bestemming zendt de eigenaar van het zeeschip of de kapitein, indien de buitengewone
      zeebrief onder hem berust, dit stuk met de eerste gelegenheid aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel21
  - number: '21.3'
    text: |-
      Indien naar het oordeel van Onze Minister van de op de voet van dit artikel verleende buitengewone zeebrief
      misbruik wordt gemaakt, of bij hem gegrond vermoeden bestaat, dat zodanig misbruik zal worden gemaakt, stelt hij
      die zeebrief buiten werking.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel21
  - number: '22.1'
    text: 'Zeebrieven vervallen:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
  - number: 22.1.a
    text: door verloop van de termijn waarvoor zij zijn afgegeven, maar uiterlijk vier jaren na de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
  - number: 22.1.b
    text: |-
      wanneer het zeeschip geen Curaçaos, onderscheidenlijk Sint Maartens zeeschip meer is of de hoedanigheid van
      Curaçaos, onderscheidenlijk Sint Maartens zeeschip verliest;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
  - number: 22.1.c
    text: wanneer de naam dan wel de bruto of netto tonnage van het zeeschip is veranderd of dit is verbouwd;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
  - number: 22.1.d
    text: |-
      wanneer het zeeschip is vergaan, is gesloopt, blijvend ongeschikt is geworden om te drijven of door rovers of
      vijanden is genomen;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
  - number: 22.1.e
    text: |-
      wanneer van het schip gedurende zes maanden na het laatste uitvaren of de dag waartoe zich de laatst ontvangen
      berichten uitstrekken, in het geheel geen tijding is aangekomen, zonder dat dit aan een algemene storing in de
      berichtgeving kan worden geweten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
  - number: '22.2'
    text: |-
      Wanneer de termijn bepaald in het eerste lid, onderdeel *a*, verstrijkt of het geval, bedoeld in het eerste lid,
      onderdeel *c*, zich voordoet, terwijl het schip in het buitenland is, blijft, behoudens het bepaalde bij het derde
      lid, de zeebrief van kracht tot de terugkomst van het schip in Curaçao, onderscheidenlijk Sint Maarten, doch niet
      langer dan zes maanden na de vervaldatum van de zeebrief. Hetzelfde geldt, wanneer de inhoud van het schip in
      het buitenland is veranderd of het schip daar is verbouwd, mits deze verandering of verbouwing op de zeebrief is
      aangetekend door de dichtstbijzijnde Nederlandse diplomatieke of consulaire ambtenaar of, indien het schip in een
      ander land van het Koninkrijk verbleef, de daartoe in dat land bevoegde ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
  - number: '22.3'
    text: |-
      De zeebrief, bedoeld in [artikel 18][ref1], en de voorlopige zeebrief, bedoeld in [artikel 20, eerste lid][ref2],
      vervallen terstond door algehele overgang van het schip in eigendom van een persoon die niet voldoet aan de
      nationaliteitsvereisten, genoemd in [artikel 2, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel2
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '20'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
  - number: '23'
    text: |-
      Een zeebrief als bedoeld in [artikel 18][ref1] kan worden ingetrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: 23.a
    text: indien het schip wordt gebruikt tot kaapvaart, zeeroof of slavenhandel;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel23
  - number: 23.b
    text: |-
      indien het schip opzettelijk zodanig wordt gebruikt dat het gevaar ontstaat, dat het Koninkrijk in een oorlog wordt
      betrokken;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel23
  - number: 23.c
    text: |-
      indien met het schip enig van regeringswege gegeven en bekend gemaakt bijzonder voorschrift tot handhaving van het
      niet deelnemen aan een oorlog opzettelijk wordt overtreden;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel23
  - number: 23.d
    text: |-
      indien het schip wordt gebruikt voor het vervoer van verdovende middelen in de zin van de Opiumlandsverordening
      1960;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel23
  - number: 23.e
    text: |-
      indien het schip op een zodanige wijze is gebruikt dat dientengevolge de betrekkingen van het Koninkrijk met een of
      meer andere staten ernstig worden benadeeld.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel23
  - number: '24.1'
    text: |-
      De vervallen of ingetrokken zeebrief wordt door de eigenaar of de rompbevrachter van het zeeschip, of, indien dit
      document onder de kapitein berust, door deze met de eerste gelegenheid ingezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel24
  - number: '24.2'
    text: |-
      Wanneer het schip buiten Curaçao, onderscheidenlijk Sint Maarten is vergaan, is gesloopt, blijvend ongeschikt
      is geworden om te drijven dan wel door rovers of door vijanden is genomen, geen Curaçaos, onderscheidenlijk Sint
      Maartens zeeschip meer is dan wel de hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens zeeschip verliest,
      terwijl het schip buiten Curaçao, onderscheidenlijk Sint Maarten is, geschiedt de inzending van de vervallen of
      ingetrokken zeebrief door tussenkomst van de dichtstbijzijnde Nederlandse diplomatieke of consulaire ambtenaar
      of, indien het schip in een ander land van het Koninkrijk verbleef, de daartoe in dat land bevoegde ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel24
  - number: '24.3'
    text: De oorzaak van het vervallen van de zeebrief wordt bij de inzending opgegeven.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel24
  - number: '24.4'
    text: |-
      Voor de ingezonden zeebrief wordt de eigenaar, de rompbevrachter of de kapitein desgevraagd een bewijs van
      ontvangst uitgereikt.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel24
  - number: '25'
    text: |-
      Degene aan wie een Curaçaos, onderscheidenlijk Sint Maartens zeeschip in eigendom toebehoort of de rompbevrachter
      van een zeeschip dat de hoedanigheid van Curaçaos, onderscheidenlijk Sint Maartens zeeschip bezit dan wel
      degene die hem vertegenwoordigt, bedoeld in [artikel 2, tweede lid][ref1], of [artikel 6, eerste lid][ref2],
      of diens vervanger, bedoeld in [artikel 2, tweede lid][ref3], onderscheidenlijk [artikel 6, eerste lid][ref4],
      is verplicht bij het kantoor waar het zeeschip in het openbaar register is teboekgesteld of in het openbaar
      rompbevrachtingsregister is ingeschreven, aangifte te doen van het vervallen of de intrekking van een zeebrief op
      grond van het bepaalde in de [artikelen 22][ref5] of [23][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005943#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0005943#Artikel23
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0005943
        artikel: '22'
        paragraaf: '8'
      - id: ref6
        bwb_id: BWBR0005943
        artikel: '23'
        paragraaf: '8'
  - number: '26.1'
    text: |-
      In de gevallen, bedoeld in artikel 22, onderdelen *a* en *c* van het eerste lid, wordt op aanvraag van de
      rechthebbende een nieuwe zeebrief als bedoeld in [artikel 18][ref1], onderscheidenlijk [artikel 19][ref2]
      uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel19
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '19'
        paragraaf: '5'
  - number: '26.2'
    text: |-
      Deze aanvraag, met de vervallen zeebrief in te zenden, gaat vergezeld van de stukken, bedoeld in
      [artikel 15, eerste lid onderscheidenlijk tweede lid][ref1]. Indien het schip echter buiten Curaçao,
      onderscheidenlijk Sint Maarten verblijft, wordt de vervallen zeebrief verzonden onmiddellijk na ontvangst van de
      nieuwe zeebrief aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel15
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '15'
        paragraaf: '5'
  - number: '26.3'
    text: |-
      Een nieuwe zeebrief kan op bovenstaande voet mede worden uitgereikt, wanneer voldoende blijkt, dat de vroegere
      buiten schuld van de belanghebbende is verloren gegaan of niet kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel26
  - number: '26.4'
    text: |-
      Op aanvraag wordt, na eigendomsovergang van het zeeschip, aan de nieuwe eigenaar een zeebrief als bedoeld in
      [artikel 18][ref1] op zijn naam uitgereikt, mits het schip een Curaçaos, onderscheidenlijk Sint Maartens schip is
      gebleven. De uitreiking geschiedt na overlegging van een afschrift van de teboekstelling van het schip ten name van
      de aanvrager in het openbaar register en tegen inlevering van de aan de vorige eigenaar uitgereikte zeebrief.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: '27.1'
    text: 'Onze Minister is bevoegd bij gemotiveerde beschikking op grond van bijzondere omstandigheden:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel27
  - number: 27.1.a
    text: |-
      afwijking toe te staan van de verplichting tot overlegging van de meetbrief, bedoeld in
      [artikel 15, eerste lid][ref1] en van het bepaalde in [artikel 15, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel15
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '15'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '15'
        paragraaf: '5'
  - number: 27.1.b
    text: |-
      de geldigheid van een zeebrief te doen voortduren ook na het tijdstip, bedoeld in [artikel 22, tweede lid][ref1],
      en wel gedurende een bepaalde tijd of tot het maken van een bepaalde reis;


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel22
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '22'
        paragraaf: '8'
  - number: 27.1.c
    text: de geldigheidsduur van een voorlopige of van een buitengewone zeebrief te verlengen.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel27
  - number: '27.2'
    text: |-
      Verlenging als bedoeld in onderdeel *b* van het eerste lid, alsmede verlenging als bedoeld in onderdeel *c* van het
      eerste lid, van een buitengewone zeebrief kan slechts éénmaal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel27
  - number: '28.1'
    text: |-
      Curaçaose, onderscheidenlijk Sint Maartense zeeschepen of zeeschepen die de hoedanigheid van Curaçaos,
      onderscheidenlijk Sint Maartens zeeschip bezitten zijn gerechtigd de Nederlandse vlag te voeren, indien zij
      voorzien zijn van een geldige zeebrief, afgegeven overeenkomstig de voorschriften van dit besluit.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel28
  - number: '28.2'
    text: |-
      De kapitein is verplicht er voor zorg te dragen dat op het zeeschip geen andere vlag naast of in plaats van de
      Nederlandse vlag wordt gevoerd. Indien het bepaalde in artikel 33, eerste lid, op het zeeschip van toepassing is,
      wordt de kapitein van deze verplichting ontheven zolang het recht de Nederlandse vlag te voeren is opgeschort.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel28
  - number: '29'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen nadere voorschriften worden gegeven voor schepen, bij
      welke overwegend Curaçaose, onderscheidenlijk Sint Maartense belangen betrokken zijn en welke alleen voor rivier-
      of kustvaart buiten Curaçao, onderscheidenlijk Sint Maarten worden gebruikt, omtrent de verlening van tijdelijke
      vergunning de Nederlandse vlag te voeren voor een in die vergunning aangegeven gebied.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel29
  - number: '30.1'
    text: |-
      Van elk zeeschip, waarvoor bij of krachtens dit besluit een zeebrief of een vergunning tot het voeren van de
      Nederlandse vlag is verleend, moet door de zorg van de eigenaar of de rompbevrachter de naam van het zeeschip en de
      naam van de thuishaven van het zeeschip in Curaçao, onderscheidenlijk Sint Maarten met duidelijke, goed zichtbare
      letters op het achterschip zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel30
  - number: '30.2'
    text: |-
      Het in het eerste lid bepaalde voor wat betreft de naam van de thuishaven is niet van toepassing in de
      periode waarin ingevolge [artikel 33, eerste lid][ref1], het recht de Nederlandse vlag te voeren tijdelijk is
      opgeschort. Indien zulks het geval is draagt de eigenaar er zorg voor dat de naam van de thuishaven in Curaçao,
      onderscheidenlijk Sint Maarten degelijk wordt verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel33
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '33'
        paragraaf: '13'
  - number: '31.1'
    text: |-
      Alle kapiteins van zeeschepen - of zij nu onder Nederlandse vlag of vreemde vlag varen - zijn gehouden bij het in-
      of uitvaren van Curaçaose, onderscheidenlijk Sint Maartense zeehavens of zeegaten een geldige zeebrief of een ander
      geldig bewijs van de nationaliteit van hun schip te vertonen aan de ambtenaren, belast met de in- of uitklaring
      en desgevorderd aan de havenmeester. Bij gebreke daarvan verlenen die ambtenaren geen expeditie en mogen zij het
      zeeschip desnoods aanhouden, totdat het vereiste document wordt overgelegd. Bij het binnenkomen mag echter onder de
      nodige voorwaarden vergunning worden verleend, om een zodanig schip naar de bestemmingsplaats over te brengen en om
      daar of elders de lading op te slaan.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel31
  - number: '31.2'
    text: |-
      Ongeldige zeebrieven of vergunningen worden door de diplomatieke of de consulaire ambtenaren of de ambtenaren bij
      de in- of uitklaring ingehouden.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel31
  - number: '32.1'
    text: |-
      De kapitein van een zeeschip, waarvoor krachtens dit besluit een zeebrief of een vergunning tot het voeren van de
      Nederlandse vlag is afgegeven, is verplicht, wanneer het schip een vreemde haven binnenvaart, aan de Nederlandse
      diplomatieke of consulaire vertegenwoordiger, onder wiens ressort de desbetreffende haven valt, desgevraagd de
      zeebrief of de vergunning te tonen. Deze vertegenwoordiger tekent daarna de zeebrief of de vergunning af.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel32
  - number: '32.2'
    text: |-
      Ongeldige zeebrieven worden door de diplomatieke of de consulaire ambtenaar ingehouden, tenzij kan worden
      aangetoond dat een nieuwe zeebrief of vergunning is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel32
  - number: '33.1'
    text: |-
      Op verzoek van de eigenaar van een zeeschip dat in het openbaar register is teboekgesteld, kan door of namens Onze
      Minister het recht om de Nederlandse vlag te voeren, genoemd in [artikel 28, eerste lid][ref1], en de plicht van de
      kapitein er voor zorg te dragen dat op het schip geen andere vlag naast of in plaats van de Nederlandse vlag wordt
      gevoerd, genoemd in [artikel 28, tweede lid][ref2], tijdelijk worden opgeschort, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel28
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '28'
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '28'
        paragraaf: '11'
  - number: 33.1.a
    text: |-
      met betrekking tot het zeeschip een rompbevrachtingsovereenkomst is gesloten met een buiten het Koninkrijk
      woonachtige of gevestigde rompbevrachter;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.1.b
    text: |-
      de rompbevrachter, bedoeld in [onderdeel ][ref1], ingevolge de wetgeving van de staat waar het zeeschip buiten het
      Koninkrijk in een register van rompbevrachtingen is ingeschreven, toestemming heeft gekregen dat het zeeschip de
      vlag van die vreemde staat mag voeren op grond van zijn band met die staat; en


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel33
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '33'
        paragraaf: '13'
  - number: 33.1.c
    text: aan het bepaalde in de onderdelen *a* tot en met *c* van het derde lid, is voldaan.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: '33.2'
    text: |-
      De opschorting vindt plaats door de aantekening daarvan op de zeebrief, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: '33.3'
    text: |-
      De in het tweede lid bedoelde aantekening op de zeebrief wordt op verzoek van de eigenaar van het zeeschip
      geplaatst, indien:
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.3.a
    text: |-
      ten genoegen van Onze Minister is aangetoond dat het zeeschip overeenkomstig de wetgeving van de betrokken vreemde
      staat het recht verkrijgt of zal verkrijgen de vlag van die staat te voeren;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.3.b
    text: |-
      naar het oordeel van Onze Minister de wettelijke vereisten van de betrokken vreemde staat betreffende de veiligheid
      en navigatie ter zee, en het voorkomen van vervuiling van de zee en haar kusten, alsmede de toepassing daarvan, ten
      minste gelijkwaardig zijn aan die van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.3.c
    text: |-
      ten genoegen van Onze Minister is aangetoond dat een of meer onderdanen van die vreemde staat overeenkomstig de
      wetgeving van die staat verantwoordelijk zijn voor de voldoening aan de vereisten, bedoeld in [onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel33
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '33'
        paragraaf: '13'
  - number: 33.3.d
    text: |-
      aan Onze Minister zijn overgelegd een afschrift van de teboekstelling in het openbaar register alsmede de
      schriftelijke toestemming ter zake van de rompbevrachting, bedoeld in het eerste lid, onderdeel *a*, van de
      eigenaar, van de houders van hypotheken en van andere zakelijk gerechtigden, die staan ingeschreven in het openbaar
      register. Ten aanzien van het afschrift van de teboekstelling is het bepaalde in [artikel 15, tweede lid][ref1],
      van toepassing, en


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel15
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '15'
        paragraaf: '5'
  - number: 33.3.e
    text: |-
      ten genoegen van Onze Minister is aangetoond dat naar het recht van die vreemde staat aan de persoon of personen
      bedoeld in het derde lid, onderdeel *c*, niet het recht wordt toegekend over de eigendom van het zeeschip te
      beschikken, het zeeschip te bezwaren of daarop zakelijke rechten te vestigen.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: '33.4'
    text: 'De aantekening, bedoeld in het tweede lid, vermeldt:'
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.4.a
    text: de naam van de staat wiens vlag het schip zal gaan voeren;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.4.b
    text: indien het schip in enig register van die staat wordt geregistreerd, de naam van dat register;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.4.c
    text: |-
      de naam of namen van de persoon of personen, bedoeld in het derde lid, onderdeel *c*, die voor het schip
      verantwoordelijk zijn; en
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: 33.4.d
    text: de periode waarvoor de tijdelijke opschorting van het recht de Nederlandse vlag te voeren, is verleend.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: '33.5'
    text: |-
      Indien voor Curaçaose, onderscheidenlijk Sint Maartense zeeschepen op voet van het bepaalde in dit artikel voor de
      periode, bedoeld in het vierde lid, onderdeel d, het recht de Nederlandse vlag te voeren, tijdelijk is opgeschort,
      worden deze schepen voor zover hoofdstuk II van Boek 8 van het Burgerlijk Wetboek van Curaçao, onderscheidenlijk
      Sint Maarten niet van toepassing is, in bedoelde periode aangemerkt als vreemde schepen varende onder vreemde vlag.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: '33.6'
    text: |-
      Onze Minister geeft kennis van de aantekening op de zeebrief, bedoeld in het tweede lid, aan de Bewaarder van
      het openbaar register waar het schip in Curaçao, onderscheidenlijk Sint Maarten is teboekgesteld, die daarvan
      aantekening maakt in het openbaar register bij de teboekstelling van het zeeschip.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: '33.7'
    text: |-
      De eigenaar daagt er zorg voor dat de aldus aangetekende zeebrief gedurende de periode dat het recht de Nederlandse
      vlag te voeren is opgeschort, zich aan boord van het schip bevindt.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel33
  - number: '34.1'
    text: |-
      Gedurende de periode dat voor een Curaçaos, onderscheidenlijk Sint Maartens zeeschip een zeebrief als bedoeld
      in [artikel 18][ref1] is afgegeven en tegelijkertijd hetzelfde zeeschip is ingeschreven in het openbaar
      rompbevrachtingsregister in Curaçao, onderscheidenlijk Sint Maarten of in een openbaar rompbevrachtingsregister
      in een ander deel van het Koninkrijk en tevens aan dit zeeschip een zeebrief, bedoeld in [artikel 19][ref2], is
      afgegeven dan wel een zeebrief is afgegeven door de bevoegde autoriteiten van vorenbedoeld deel van het Koninkrijk,
      wordt de geldigheid van de zeebrief, bedoeld in [artikel 18][ref3] opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '19'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: '34.2'
    text: |-
      De opschorting vindt plaats door aantekening daarvan op de zeebrief, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: '34.3'
    text: |-
      Ingeval het eerste lid van toepassing is op Curaçaose, onderscheidenlijk Sint Maartense zeeschepen, die in een
      ander deel van het Koninkrijk in een rompbevrachtingsregister zijn ingeschreven, behoren deze gedurende de daar
      bedoelde periode thuis in dat deel van het Koninkrijk alwaar de nieuwe zeebrief is afgegeven.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel34
  - number: '35.1'
    text: |-
      Voor zover het bepaalde in artikel 33, eerste lid, op een Curaçaos, onderscheidenlijk Sint Maartens zeeschip van
      toepassing is, verzoekt degene op wiens naam het zeeschip in een ander deel van het Koninkrijk in een register van
      rompbevrachtingen is ingeschreven, aan de bevoegde autoriteiten van dat deel van het Koninkrijk om op de zeebrief,
      bedoeld in [artikel 18][ref1], op te tekenen:


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: 35.1.a
    text: |-
      dat de geldigheid van de zeebrief, bedoeld in [artikel 18][ref1] is opgeschort;


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: 35.1.b
    text: de naam van het deel van het Koninkrijk alwaar het zeeschip in het rompbevrachtingsregister is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel35
  - number: 35.1.c
    text: de naam van degene op wiens naam de nieuwe zeebrief is gesteld; en
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel35
  - number: 35.1.d
    text: |-
      de periode waarin de geldigheid van de zeebrief, bedoeld in [artikel 18][ref1], is opgeschort, welke overeen moet
      komen met de periode waarvoor de nieuwe zeebrief is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: '35.2'
    text: |-
      Degene op wiens naam de nieuwe zeebrief is gesteld, draagt er zorg voor dat de zeebrief, bedoeld in
      [artikel 18][ref1], waarop de in het eerste lid genoemde aantekeningen voorkomen, zich aan boord van het zeeschip
      bevindt, gedurende de periode dat de geldigheid daarvan is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: '35.3'
    text: |-
      De rompbevrachter die de aantekening op de zeebrief, bedoeld in [artikel 18][ref1], doet stellen, geeft daarvan
      onverwijld kennis aan de Bewaarder van het openbaar register van Curaçao, onderscheidenlijk Sint Maarten waar
      het zeeschip is teboekgesteld. De bewaarder tekent de aantekeningen genoemd in het eerste lid, op in het openbaar
      register bij de teboekstelling van het zeeschip. Indien de bewaarder deze kennisgeving ontvangt zendt hij hiervan
      een kopie aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel18
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '18'
        paragraaf: '5'
  - number: '36.1'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, worden ambtenaren aangewezen die belast zijn met het voortdurend
      toezicht op de naleving van het bij of krachtens dit besluit bepaalde, alsmede met de opsporing van de bij of
      krachtens dit besluit strafbaar gestelde feiten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel36
  - number: '36.2'
    text: |-
      Een door de ambtenaren, bedoeld in het eerste lid, opgemaakt proces-verbaal geldt als wettig bewijsmiddel voor de
      daarin geconstateerde overtredingen, mits het voldoet aan de voorschriften van het Wetboek van Strafvordering van
      Curaçao, onderscheidenlijk Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel36
  - number: '37.1'
    text: |-
      De eigenaar, bedoeld in [artikel 2, tweede lid][ref1], onderscheidenlijk de rompbevrachter bedoeld
      in artikel 6, eerste lid, van een zeeschip, dan wel degene die hem vertegenwoordigt, bedoeld in
      de [artikelen 2, tweede lid][ref2], of [6, eerste lid][ref3], of diens vervanger, bedoeld in de
      [artikelen 2, tweede lid][ref4], of [6, eerste lid][ref5], verschaft desgevraagd onverwijld aan de ambtenaren,
      bedoeld in [artikel 36, eerste lid][ref6], alle gegevens die zij redelijkerwijs behoeven voor de uitoefening van de
      taken die hun zijn opgedragen bij of krachtens dit besluit of bij andere in Curaçao, onderscheidenlijk Sint Maarten
      geldende wettelijke regelingen, met inbegrip van de uitvoering van verdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005943#Artikel36
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0005943
        artikel: '36'
        paragraaf: '15'
  - number: '37.2'
    text: |-
      De eigenaar, bedoeld in [artikel 2, tweede lid][ref1], onderscheidenlijk de rompbevrachter, bedoeld
      in [artikel 6, eerste lid][ref2], draagt er zorg voor dat zijn vertegenwoordiger, bedoeld in
      [artikel 2, tweede lid][ref3], of 6, eerste lid, dan wel bij toepassing van de [artikelen 2, tweede lid][ref4], of
      [6, eerste lid][ref5], diens vervanger, beschikt over gegevens, voor zover deze worden verzocht door de ambtenaren,
      bedoeld in [artikel 36, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005943#Artikel36
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0005943
        artikel: '36'
        paragraaf: '15'
  - number: '38.1'
    text: |-
      Indien een bij of krachtens dit besluit strafbaar gesteld feit wordt begaan door of vanwege een rechtspersoon,
      een maat- of vennootschap, een rederij of enige andere vereniging van personen of een doelvermogen, wordt
      de strafvervolging ingesteld en worden de straffen uitgesproken hetzij tegen die rechtspersoon, die maat- of
      vennootschap, die rederij, die vereniging of dat doelvermogen, hetzij tegen hen, die tot het feit opdracht hebben
      gegeven of die feitelijk leiding hebben gehad bij het verboden handelen of nalaten, hetzij tegen beiden.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel38
  - number: '38.2'
    text: |-
      Een bij of krachtens dit besluit strafbaar gesteld feit wordt onder meer begaan door of vanwege een rechtspersoon,
      een maat- of vennootschap, een rederij, een vereniging van personen of een doelvermogen, indien het begaan wordt
      door personen, die, hetzij uit hoofde van een dienstbetrekking, hetzij uit andere hoofde handelen in de sfeer
      van de rechtspersoon, de maat- of vennootschap, de rederij, de vereniging of het doelvermogen, ongeacht of deze
      personen ieder afzonderlijk het strafbare feit hebben begaan, dan wel bij hen gezamenlijk de elementen van dat feit
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel38
  - number: '38.3'
    text: |-
      Indien een strafvervolging wordt ingesteld tegen een rechtspersoon, een maat- of vennootschap, een rederij, een
      vereniging van personen of een doelvermogen, wordt deze tijdens de vervolging vertegenwoordigd door de bestuurder,
      de boekhouder, of de vertegenwoordiger, bedoeld in de [artikelen 2, tweede lid][ref1], of [6, eerste lid][ref2]
      en, indien er meer bestuurders of boekhouders of vertegenwoordigers zijn, door één dezer. De vertegenwoordiger,
      bedoeld in dit lid, kan bij gemachtigde verschijnen. De rechter kan de persoonlijke verschijning van een
      bepaalde bestuurder, boekhouder of vertegenwoordiger, bedoeld in de[ artikelen 2, tweede lid][ref3], of
      [6, eerste lid][ref4], bevelen; hij kan alsdan zijn medebrenging gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005943#Artikel6
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
  - number: '38.4'
    text: |-
      Voor wat betreft de bij of krachtens dit besluit strafbaar gestelde feiten worden rechtspersonen voor de toepassing
      van artikel 20 van het Wetboek van Strafvordering van Curaçao, onderscheidenlijk Sint Maarten geacht te wonen, waar
      zij gevestigd zijn.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel38
  - number: '38.5'
    text: |-
      Indien een strafvervolging wordt ingesteld tegen een rechtspersoon, een maat- of vennootschap, een rederij,
      een vereniging van personen of een doelvermogen, geschieden de in het Wetboek van Strafvordering van Curaçao,
      onderscheidenlijk Sint Maarten voorgeschreven betekeningen, dagvaardingen, oproepingen, kennisgevingen of andere
      mededelingen, aan de persoon of de woonplaats van de bestuurder, boekhouder of de vertegenwoordiger, bedoeld
      in de [artikelen 2, tweede lid][ref1], of [6, eerste lid][ref2], en indien er meer bestuurders, boekhouders
      of vertegenwoordigers zijn, aan één dezer of op de plaats waar voornoemde personen zitting of kantoor houden
      behoudens, indien het een dagvaarding betreft, overeenkomstige toepassing van artikel 130, tweede lid en derde lid,
      van het Wetboek van Strafvordering van Curaçao, onderscheidenlijk Sint Maarten.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005943#Artikel6
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005943
        artikel: '6'
        paragraaf: '4'
  - number: '39'
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit besluit en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van dit besluit de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel39
  - number: '40.1'
    text: |-
      Bij landsverordening worden de op te leggen straffen geregeld wegens niet naleving van het bij of krachtens dit
      besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel40
  - number: '40.2'
    text: |-
      De strafbepalingen zijn toepasselijk op een ieder, die zich hetzij binnen hetzij buiten Curaçao, onderscheidenlijk
      Sint Maarten schuldig maakt aan een bij of krachtens dit besluit strafbaar gesteld feit.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel40
  - number: '41'
    text: |-
      Het Curaçaosch Zeebrievenbesluit 1933 (*Stb.* 1933, 110; P.B. 1933, no. 41) wordt voor wat betreft de Nederlandse
      Antillen ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel41
  - number: '42'
    text: |-
      Zeebrieven, die op het tijdstip van inwerkingtreding van dit besluit gelden, blijven van kracht tot het tijdstip
      waarop zij ingevolge de desbetreffende voorschriften van dit besluit vervallen.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel42
  - number: '43'
    text: |-
      Waar in wettelijke regelingen in Curaçao of Sint Maarten wordt verwezen naar het Curaçaosch Zeebrievenbesluit
      1933 of het Nederlands-Antilliaans Zeebrievenbesluit, gelden deze verwijzingen als verwijzingen naar het
      Zeebrievenbesluit van Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel43
  - number: 43a.1
    text: |-
      Zeeschepen die op het tijdstip onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van de
      Rijkswet aanpassing rijkswetten aan de oprichting van de nieuwe landen stonden ingeschreven in het
      openbaar rompbevrachtingsregister, bedoeld in [artikel 4, eerste lid][ref1], van het Nederlands-Antilliaans
      Zeebrievenbesluit zoals dat op dat tijdstip luidde, verkrijgen de hoedanigheid van Curaçaos zeeschip als bedoeld in
      artikel 4, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel4
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '4'
        paragraaf: '3'
  - number: 43a.2
    text: |-
      Het openbaar rompbevrachtingsregister van de Nederlandse Antillen wordt op het tijdstip van inwerkingtreding van
      de Rijkswet aanpassing rijkswetten aan de oprichting van de nieuwe landen het openbaar rompbevrachtingsregister van
      Curaçao, bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel5
    url: https://wetten.overheid.nl/BWBR0005943/2011-02-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0005943
        artikel: '5'
        paragraaf: '4'
  - number: 43a.3
    text: |-
      Zeebrieven, voorlopige zeebrieven en buitengewone zeebrieven, afgegeven op grond van
      [artikel 14, eerste lid][ref1], [15, eerste lid][ref2], of [16, eerste lid][ref3], [artikel 20, eerste lid][ref4],
      of [artikel 21, eerste lid][ref5], van het Nederlands-Antilliaans Zeebrievenbesluit, zoals dat op het tijdstip
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van de Rijkswet aanpassing rijkswetten aan de
      oprichting van de nieuwe landen luidde, gelden als Curaçaose zeebrieven, afgegeven op grond van voornoemde
      artikelen, zoals die luiden na inwerkingtreding van voornoemde rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel14
