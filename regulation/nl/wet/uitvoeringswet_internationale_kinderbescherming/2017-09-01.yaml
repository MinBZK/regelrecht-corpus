preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om wettelijke voorzieningen te treffen ter uitvoering
    van het op 19 oktober 1996 te ’s-Gravenhage tot stand gekomen verdrag inzake de bevoegdheid, het toepasselijke
    recht, de erkenning, de tenuitvoerlegging en de samenwerking op het gebied van ouderlijke verantwoordelijkheid
    en maatregelen ter bescherming van kinderen (Trb. 1997, 299) alsmede van de verordening (EG) nr. 2201/2003 van
    de Raad van de Europese Unie van 27 november 2003 betreffende de bevoegdheid en de erkenning en tenuitvoerlegging
    van beslissingen in huwelijkszaken en inzake de ouderlijke verantwoordelijkheid, en tot intrekking van Verordening
    (EG) nr. 1347/2000 (PbEU L 338) en mede tot wijziging van het Burgerlijk Wetboek, het Wetboek van Burgerlijke
    Rechtsvordering en de Uitvoeringswet EG-executieverordening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - het verdrag: het op 19 oktober 1996 te ’s-Gravenhage tot stand gekomen verdrag
      inzake de bevoegdheid, het toepasselijke recht, de erkenning, de tenuitvoerlegging en de samenwerking op het gebied
      van ouderlijke verantwoordelijkheid en maatregelen ter bescherming van kinderen (Trb. 1997, 299);
        - de verordening: de [Verordening (EG) nr. 2201/2003](32003R2201) van de Raad van de Europese Unie van 27 november
      2003 betreffende de bevoegdheid en de erkenning en tenuitvoerlegging van beslissingen in huwelijkszaken en inzake
      de ouderlijke verantwoordelijkheid, en tot intrekking van [Verordening (EG) nr. 1347/2000](32000R1347) (PbEU
      L 338).
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel1
  - number: '2'
    text: |-
      De [hoofdstukken 1][ref1], [2][ref2], [4][ref3], [7][ref4] en [8][ref5] zijn mede van toepassing op
      internationale kwesties van ouderlijke verantwoordelijkheid en maatregelen ter bescherming van kinderen die niet
      door het verdrag of de verordening worden beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0019574#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0019574#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0019574#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0019574#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019574
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0019574
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0019574
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0019574
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0019574
        hoofdstuk: '8'
  - number: '3.1'
    text: |-
      Onverminderd het bepaalde in artikel 1, onder a, van het op 20 mei 1980 te Luxemburg tot stand gekomen Europese
      verdrag betreffende de erkenning en de tenuitvoerlegging van beslissingen inzake het gezag over kinderen en
      betreffende het herstel van het gezag over kinderen (Trb. 1981, 10), artikel 4 van het op 25 oktober 1980 te ’s-
      Gravenhage tot stand gekomen verdrag inzake de burgerrechtelijke aspecten van internationale ontvoering van
      kinderen (Trb. 1987, 139) en [artikel 2 van de Wet van 2 mei 1990 tot uitvoering van die verdragen][ref1] (Stb.
      202), is [deze wet][ref2] van toepassing op kinderen die de leeftijd van achttien jaren nog niet hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004746
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004746
  - number: '3.2'
    text: |-
      Bereikt een kind ten aanzien waarvan een verzoek op grond van het verdrag, van de verordening of van deze wet
      in behandeling is, de leeftijd van achttien jaren, dan wordt de behandeling van dat verzoek ambtshalve gestaakt.
      Hetzelfde geldt voor maatregelen ter uitvoering van een beslissing op een verzoek.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister van Justitie wordt voor Nederland aangewezen als centrale autoriteit, bedoeld in artikel 29 van het
      verdrag en in artikel 53 van de verordening.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel4
  - number: '4.2'
    text: |-
      De centrale autoriteit is belast met de in hoofdstuk V van het verdrag, onderscheidenlijk hoofdstuk IV van de
      verordening omschreven taken van de centrale autoriteit. Deze centrale autoriteit is als zodanig tevens belast met
      de behandeling van verzoeken om tussenkomst in internationale kwesties betreffende ouderlijke verantwoordelijkheid
      en maatregelen ter bescherming van kinderen, wanneer deze niet door het verdrag of de verordening worden beheerst.
      Bij de behandeling van deze verzoeken worden de bepalingen van hoofdstuk V van het verdrag zoveel mogelijk in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel4
  - number: '4.3'
    text: |-
      In het bijzonder neemt de centrale autoriteit alle passende maatregelen teneinde te bevorderen dat in de
      omstandigheden waarin het verdrag, de verordening of deze wet van toepassing is, minnelijke schikkingen tot stand
      komen met betrekking tot de bescherming van de persoon of het vermogen van het kind.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel4
  - number: '4.4'
    text: |-
      De aanwijzing van de centrale autoriteit staat er niet aan in de weg dat een persoon zich rechtstreeks tot de
      rechter of andere autoriteiten wendt teneinde de erkenning van de ouderlijke verantwoordelijkheid over een kind,
      het herstel van die verantwoordelijkheid over een kind te bereiken, of de vaststelling of wijziging van een
      beslissing inzake ouderlijke verantwoordelijkheid dan wel een maatregel ter bescherming van een kind te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel4
  - number: '5.1'
    text: |-
      De centrale autoriteit is bevoegd, zonodig ook zonder uitdrukkelijke volmacht van degene die zich met een verzoek
      tot haar heeft gewend, namens hem, anders dan in rechte, op te treden.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd het bepaalde in artikel 5, derde lid, van het op 20 mei 1980 te Luxemburg tot stand gekomen Europese
      verdrag betreffende de erkenning en de tenuitvoerlegging van beslissingen inzake het gezag over kinderen en
      betreffende het herstel van het gezag over kinderen (Trb. 1981, 10) en artikel 26 van het op 25 oktober 1980 te
      ’s-Gravenhage tot stand gekomen verdrag inzake de burgerrechtelijke aspecten van internationale ontvoering van
      kinderen (Trb. 1987, 139), draagt de centrale autoriteit zelf alle kosten die aan de uitvoering van haar taak zijn
      verbonden.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel5
  - number: '6'
    text: |-
      De centrale autoriteit kan de uitvoering van bepaalde handelingen, overeenkomstig door haar te geven aanwijzingen
      opdragen aan de raad voor de kinderbescherming. De bepalingen van dit hoofdstuk zijn mede van toepassing ten
      aanzien van de raad.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel6
  - number: '7'
    text: |-
      De gemeentebesturen en de ambtenaren van de burgerlijke stand verschaffen de centrale autoriteit kosteloos alle
      inlichtingen en verstrekken haar kosteloos en vrij van zegel alle afschriften en uittreksels uit hun registers die
      deze autoriteit van hen vraagt in verband met de uitvoering van haar taak.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de centrale autoriteit voor het vinden van de verblijfplaats van een kind in Nederland medewerking behoeft
      van dienaren van de openbare macht, kan zij zich voor het verkrijgen daarvan wenden tot de officier van justitie in
      het arrondissement waar het kind vermoedelijk verblijft, of anders in het arrondissement ’s-Gravenhage. De officier
      van justitie kan de zaak overeenkomstig door hem te geven aanwijzingen overdragen aan een officier van justitie in
      een ander arrondissement, indien de opsporing vermoedelijk in dat arrondissement moet geschieden.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel8
  - number: '8.2'
    text: |-
      De in het eerste lid bedoelde officier van justitie behandelt een verzoek om medewerking van de centrale autoriteit
      met voorrang.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel8
  - number: '8.3'
    text: |-
      De ambtenaar van politie, aangesteld voor de uitvoering van de politietaak, die is aangewezen om zijn medewerking
      te verlenen aan de opsporing van de verblijfplaats van een kind, mag daartoe elke plaats betreden, voor zover dat
      redelijkerwijs voor de vervulling van die taak nodig is.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel8
  - number: '9.1'
    text: |-
      De beslissing tot plaatsing van, of tot verstrekking van zorg aan een uit Nederland afkomstig kind in een
      pleeggezin of in een instelling in een andere staat ingevolge artikel 33 van het verdrag dan wel artikel 56 van de
      verordening, wordt in Nederland genomen door de centrale autoriteit, bedoeld in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel4
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '4'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      De centrale autoriteit zendt een gemotiveerd verzoek, vergezeld van een rapport betreffende het kind, toe aan de
      centrale autoriteit dan wel de andere bevoegde autoriteit van de staat waar de plaatsing of de verstrekking van
      zorg dient plaats te vinden. Zij treedt met deze autoriteit in overleg.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde beslissing wordt eerst genomen nadat de centrale autoriteit, bedoeld in
      [artikel 4, eerste lid][ref1], de volgende bescheiden heeft ontvangen:


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel4
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '4'
        hoofdstuk: '2'
  - number: 9.3.a
    text: |-
      een schriftelijke verklaring van de personen of de instelling bij welke de plaatsing of de verstrekking van zorg
      dient plaats te vinden, waaruit hun instemming blijkt;
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel9
  - number: 9.3.b
    text: |-
      indien gewenst, een door de centrale autoriteit of de andere bevoegde autoriteit in het land van plaatsing
      opgesteld rapport waaruit de geschiktheid van de pleegouder tot het verstrekken van pleegzorg aan het kind blijkt;
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel9
  - number: 9.3.c
    text: |-
      de instemming, bedoeld in artikel 33, tweede lid, van het verdrag, dan wel artikel 56, tweede lid, van de
      verordening;
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel9
  - number: 9.3.d
    text: |-
      indien toepasselijk, bescheiden waaruit blijkt dat het kind vergunning heeft of zal verkrijgen om de staat waar
      de plaatsing of de verstrekking van zorg zal plaatsvinden, binnen te komen en met het oog op de plaatsing of de
      verstrekking van zorg een verblijfsrecht in die staat heeft of zal verkrijgen.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel9
  - number: '10.1'
    text: |-
      In geval van plaatsing van een kind vanuit een andere staat in Nederland of verstrekking van zorg aan een zodanig
      kind in een pleeggezin of in een instelling in Nederland ingevolge artikel 33 van het verdrag dan wel artikel
      56 van de verordening, dient de instemming, bedoeld in de genoemde artikelen, te worden gegeven door de centrale
      autoriteit, bedoeld in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel4
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '4'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      De instemming, bedoeld in het eerste lid, wordt eerst gegeven nadat de centrale autoriteit, bedoeld in
      [artikel 4, eerste lid][ref1], van de bevoegde autoriteit van de staat van herkomst van het kind een gemotiveerd
      verzoek heeft ontvangen, vergezeld van een rapport betreffende het kind, en nadat zij de volgende bescheiden heeft
      ontvangen, welke bescheiden zij toezendt aan de bevoegde autoriteit van het land van herkomst van het kind:


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel4
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '4'
        hoofdstuk: '2'
  - number: 10.2.a
    text: |-
      een schriftelijke verklaring van de personen of de instelling bij welke de plaatsing of de verstrekking van zorg
      dient plaats te vinden, waaruit hun instemming blijkt;
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel10
  - number: 10.2.b
    text: |-
      indien gewenst, een rapport waaruit de geschiktheid van de pleegouder tot het verstrekken van pleegzorg aan het
      kind blijkt;
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel10
  - number: 10.2.c
    text: |-
      indien van toepassing, bescheiden waaruit blijkt dat het kind vergunning heeft of zal verkrijgen om Nederland
      binnen te komen en met het oog op de plaatsing of de verstrekking van zorg een verblijfsrecht in Nederland heeft of
      zal verkrijgen.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel10
  - number: '10.3'
    text: |-
      Kennisgevingen van buitenlandse autoriteiten, als bedoeld in artikel 56, vierde lid, van de verordening, worden
      aan de centrale autoriteit, bedoeld in [artikel 4, eerste lid][ref1], gericht. Deze zendt afschriften van deze
      kennisgevingen toe aan de raad voor de kinderbescherming en aan de Immigratie- en Naturalisatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel4
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '4'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Indien de voorschriften van [artikel 10][ref1] niet in acht zijn genomen, kan de officier van justitie
      of de centrale autoriteit de kinderrechter verzoeken een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref2] te belasten met de voorlopige voogdij over het kind. Dit verzoek kan
      ook worden gedaan door de raad voor de kinderbescherming. Tenzij de kinderrechter een langere termijn van
      verval van de voorlopige voogdij heeft bepaald, wendt de raad zich binnen zes weken na de beslissing over de
      voorlopige voogdij tot de rechter ten einde een voorziening in het gezag over de minderjarige te verkrijgen.
      [Artikel 241, vierde en vijfde lid][ref3], alsmede [artikel 306a van Boek 1 van het Burgerlijk Wetboek][ref4] zijn
      van overeenkomstige toepassing. [Artikel 813, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref5] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel241
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel306a
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel813
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '241'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: 306a
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '813'
  - number: '11.2'
    text: |-
      De voorlopige voogdij eindigt, behoudens eerdere opheffing, op het tijdstip waarop hetzij de voogdij over het kind,
      dan wel diens plaatsing bij andere personen of een andere instelling, een aanvang neemt, of zijn terugkeer naar het
      land van herkomst is geregeld.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel11
  - number: '11.3'
    text: |-
      De kosten die de voogdij-instelling ten behoeve van het kind moet maken, komen ten laste van degene bij wie het
      kind in strijd met [artikel 10][ref1] is geplaatst. De [artikelen 8.2.1 tot en met 8.2.7 van de Jeugdwet][ref2]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '8'
  - number: '12.1'
    text: |-
      Onverminderd de bevoegdheid van de voorzieningenrechter in kort geding, is de rechtbank bevoegd tot kennisneming
      van alle zaken met betrekking tot de regeling en de uitoefening van ouderlijke verantwoordelijkheid en maatregelen
      ter bescherming van kinderen in internationale gevallen, behoudens voor zover het betreft de erkenning, de niet-
      erkenning en de tenuitvoerlegging van buitenlandse beslissingen.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel12
  - number: '12.2'
    text: |-
      De rechtbank is bevoegd tot kennisneming van een zaak als bedoeld in het eerste lid indien het kind binnen haar
      rechtsgebied gewone verblijfplaats heeft. In gevallen waarin het verdrag of de verordening een bevoegdheid toekent
      aan de autoriteiten van de verdragsstaat waar het kind niet zijn gewone verblijfplaats heeft, maar zich bevindt,
      is tot kennisneming daarvan bevoegd de rechtbank binnen wier rechtsgebied het kind zich bevindt. In gevallen waarin
      het verdrag of de verordening een bevoegdheid toekent aan de autoriteiten van een staat waar het kind noch zijn
      gewone verblijfplaats heeft noch zich bevindt, is tot kennisneming daarvan bevoegd de rechtbank Den Haag.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel12
  - number: '13'
    text: |-
      De zaken tot kennisneming waarvan de rechtbank op grond van [artikel 12, eerste lid][ref1], bevoegd is, worden
      ingeleid met een verzoekschrift. Het verzoekschrift wordt ingediend door een advocaat. Het verzoekschrift houdt
      tevens in de keuze van een woonplaats binnen het arrondissement van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel12
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '12'
        hoofdstuk: '4'
  - number: '14'
    text: |-
      [Artikel 14 van de Uitvoeringswet internationale kinderontvoering][ref1] (Stb. 1990, 202) is van overeenkomstige
      toepassing in gevallen die door het verdrag, de verordening of deze wet worden bestreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel14
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '14'
  - number: '15.1'
    text: |-
      De voorzieningenrechter van de rechtbank is bevoegd tot kennisneming van alle verzoeken die betrekking hebben op
      de erkenning, de niet-erkenning en de tenuitvoerlegging van beslissingen inzake ouderlijke verantwoordelijkheid
      en maatregelen ter bescherming van kinderen die op grond van het verdrag zijn gegeven, voor zover de erkenning, de
      niet-erkenning en de tenuitvoerlegging daarvan niet door de verordening worden beheerst. Ten aanzien van het verlof
      tot tenuitvoerlegging zijn de [artikelen 985 tot en met 990 van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '985'
  - number: '15.2'
    text: |-
      In de zaken, bedoeld in het eerste lid, is bevoegd de voorzieningenrechter van de rechtbank binnen wier
      rechtsgebied de persoon tegen wie de tenuitvoerlegging wordt gevraagd, dan wel een kind waarop het verzoek
      betrekking heeft, gewone verblijfplaats heeft. Indien geen van deze personen gewone verblijfplaats in Nederland
      heeft, is bevoegd de voorzieningenrechter van de rechtbank binnen wier rechtsgebied de tenuitvoerlegging dient
      plaats te vinden. Kan de bevoegdheid niet worden gebaseerd op de in dit artikellid genoemde gronden, dan is bevoegd
      de voorzieningenrechter van de rechtbank Den Haag.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel15
  - number: '15.3'
    text: |-
      Een beslissing op een verzoek als bedoeld in het eerste lid, wordt gevraagd bij verzoekschrift. Het wordt ingediend
      door een advocaat. Het verzoekschrift houdt tevens in de keuze van een woonplaats binnen het arrondissement van
      de rechtbank.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel15
  - number: '16.1'
    text: |-
      De voorzieningenrechter bij wie een verzoek als bedoeld in [artikel 15, eerste lid][ref1], is ingediend, doet
      daarover onverwijld uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel15
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '15'
        hoofdstuk: '5'
  - number: '16.2'
    text: Het verlof tot tenuitvoerlegging is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel16
  - number: '17.1'
    text: |-
      De rechtbank waarvan de voorzieningenrechter op een verzoek als bedoeld in [artikel 15, eerste lid][ref1], heeft
      beschikt, neemt kennis van het hoger beroep van die beschikking. Alleen de partijen kunnen hoger beroep tegen de
      beschikking instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel15
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '15'
        hoofdstuk: '5'
  - number: '17.2'
    text: |-
      Het hoger beroep tegen een beschikking waarbij een verzoek als bedoeld in [artikel 15, eerste lid][ref1], is
      ingewilligd, moet worden ingesteld binnen een maand na de betekening van de beschikking. Indien de partij tegen wie
      tenuitvoerlegging wordt gevraagd, haar gewone verblijfplaats heeft in het buitenland, bedraagt de termijn voor het
      instellen van hoger beroep twee maanden, te rekenen vanaf de datum van de betekening aan deze partij in persoon of
      aan zijn adres. De termijn kan niet op grond van de afstand worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel15
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '15'
        hoofdstuk: '5'
  - number: '17.3'
    text: |-
      Indien hoger beroep wordt ingesteld door de verzoeker en is gericht tegen de weigering om een verzoek als bedoeld
      in [artikel 15, eerste lid][ref1], in te willigen, wordt het ingesteld binnen een maand na de dagtekening van de
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel15
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '15'
        hoofdstuk: '5'
  - number: '17.4'
    text: De rechtbank bij welke hoger beroep is ingesteld, doet daarover onverwijld uitspraak.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
  - number: '17.5'
    text: Tegen de in hoger beroep gegeven beschikking kan slechts beroep in cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
  - number: '17.6'
    text: |-
      De rechtbank bij welke hoger beroep is ingesteld, onderscheidenlijk de Hoge Raad bij welke beroep in cassatie is
      ingesteld, kan op verzoek van de partij tegen wie tenuitvoerlegging wordt gevraagd, zijn uitspraak aanhouden indien
      in de staat van herkomst van de beslissing een gewoon rechtsmiddel is ingesteld of de termijn daartoe nog niet is
      verstreken. In dit laatste geval kan de rechtbank, onderscheidenlijk de Hoge Raad, een termijn vaststellen binnen
      welke het rechtsmiddel moet worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
  - number: '17.7'
    text: |-
      Indien in de beslissing uitspraak is gedaan over meer dan een onderdeel van het verzoek en de tenuitvoerlegging
      niet voor het geheel kan worden toegestaan, wordt de tenuitvoerlegging voor één of meer van die onderdelen
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
  - number: '17.8'
    text: De verzoeker kan om gedeeltelijke tenuitvoerlegging vragen.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel17
  - number: '18.1'
    text: |-
      De voorzieningenrechter van de rechtbank is bevoegd tot kennisneming van de verzoeken, bedoeld in de artikelen
      21, derde lid, 28 en 48, eerste lid, van de verordening. Ten aanzien van het verlof tot tenuitvoerlegging zijn de
      [artikelen 985 tot en met 990 van het Wetboek van Burgerlijke Rechtsvordering][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '985'
  - number: '18.2'
    text: |-
      Artikel 29, tweede lid, van de verordening is van overeenkomstige toepassing op de relatieve bevoegdheid van de
      voorzieningenrechter in de zaken, bedoeld in artikel 21, derde lid, van de verordening. Kan de bevoegdheid van deze
      rechter niet worden gebaseerd op de daar genoemde gronden, dan is bevoegd de voorzieningenrechter van de rechtbank
      Den Haag.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel18
  - number: '18.3'
    text: |-
      Een beslissing op een verzoek als bedoeld in het eerste lid, wordt gevraagd bij verzoekschrift. Het wordt ingediend
      door een advocaat. Het verzoekschrift houdt tevens in de keuze van een woonplaats binnen het arrondissement van
      de rechtbank.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel18
  - number: '18.4'
    text: |-
      Onverminderd het bepaalde bij artikel 38, eerste lid, van de verordening, wordt bij ongenoegzaamheid van de bij het
      verzoekschrift overgelegde stukken aan de verzoeker de gelegenheid tot aanvulling gegeven met het stuk, bedoeld in
      artikel 37, eerste lid, onder a, van de verordening.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel18
  - number: '19.1'
    text: |-
      De persoon tegen wie tenuitvoerlegging wordt gevraagd en andere belanghebbenden worden in de procedure over een
      verzoek als bedoeld in [artikel 18, eerste lid][ref1], niet opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel18
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '18'
        hoofdstuk: '6'
  - number: '19.2'
    text: |-
      Inwilliging van het verzoek, bedoeld in artikel 28 van de verordening, door de voorzieningenrechter geschiedt in
      de vorm van een eenvoudig verlof, dat op de overgelegde expeditie van de ten uitvoer te leggen beslissing wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel19
  - number: '19.3'
    text: Het verlof tot tenuitvoerlegging is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel19
  - number: '20.1'
    text: |-
      De rechtbank waarvan de voorzieningenrechter op een verzoek als bedoeld in [artikel 18, eerste lid][ref1], heeft
      beschikt, neemt kennis van het rechtsmiddel, bedoeld in artikel 33 van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel18
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '18'
        hoofdstuk: '6'
  - number: '20.2'
    text: |-
      Het rechtsmiddel, bedoeld in artikel 33 van de verordening, wordt, indien het wordt ingesteld door de verzoeker
      en is gericht tegen een weigering om een verzoek als bedoeld in [artikel 18, eerste lid][ref1], in te willigen,
      ingesteld binnen een maand na de dagtekening van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel18
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '18'
        hoofdstuk: '6'
  - number: '20.3'
    text: De rechtbank bij welke hoger beroep is ingesteld, doet daarover onverwijld uitspraak.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel20
  - number: '21.1'
    text: |-
      De procedure van [artikel 26 van Boek 1 van het Burgerlijk Wetboek][ref1] is niet van toepassing ten aanzien van
      het op artikel 21, derde lid, van de verordening gegronde verzoek om een beslissing houdende erkenning of niet-
      erkenning van een in een andere lidstaat gegeven beslissing ter zake van echtscheiding, scheiding van tafel en bed
      of nietigverklaring van het huwelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel26
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '26'
  - number: '21.2'
    text: |-
      [Artikel 26e van Boek 1 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing op een beslissing als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel26e
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 26e
  - number: '22'
    text: |-
      In het in artikel 41, derde lid, laatste zin, van de verordening bedoelde geval wordt het verzoek om een
      certificaat betreffende een beslissing inzake het omgangsrecht door tussenkomst van een advocaat ingediend
      bij de voorzieningenrechter van de rechtbank van welke de kinderrechter de beslissing heeft gegeven. De
      voorzieningenrechter beslist onverwijld op het verzoek. [Artikel 19, eerste lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel19
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '19'
        hoofdstuk: '6'
  - number: '23'
    text: |-
      [Artikel 31 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing op de
      procedure, bedoeld in artikel 43 van de verordening, indien het certificaat door een Nederlandse rechter is
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel31
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '31'
  - number: '24.1'
    text: |-
      De Raad voor de Rechtspraak wijst een of meer kinderrechters aan, die in het bijzonder belast zijn met het
      faciliteren van contacten van rechters in Nederland bij wie op grond van het verdrag, de verordening of deze wet
      procedures aanhangig zijn met rechters in het buitenland die terzake bevoegd zijn, alsmede contacten van rechters
      in het buitenland bij wie zodanige procedures aanhangig zijn, met rechters in Nederland die terzake bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel24
  - number: '24.2'
    text: |-
      Indien een rechter in Nederland in verband met een procedure in het eerste lid een rechter in het buitenland wenst
      te consulteren, kan hij gebruik maken van de tussenkomst van de in het eerste lid bedoelde rechter.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel24
  - number: '24.3'
    text: |-
      De in het tweede lid bedoelde tussenkomst wordt ook verleend aan een rechter in het buitenland die in verband met
      een bij hem aanhangige procedure als bedoeld in het eerste lid een rechter in Nederland wenst te consulteren.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel24
  - number: '24.4'
    text: |-
      Indien in verband met een consultatie als bedoeld in het tweede of het derde lid stukken dienen te worden vertaald
      of indien daarvoor de bijstand van een tolk nodig is, draagt de in het eerste lid bedoelde rechter hiervoor zorg.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel24
  - number: '24.5'
    text: |-
      Voordat een consultatie als bedoeld in het tweede lid plaatsvindt, stelt de rechter bij wie de procedure aanhangig
      is, de partijen hiervan in kennis. Nadat de consultatie heeft plaatsgevonden, doet hij partijen verslag van de
      consultatie.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel24
  - number: '24.6'
    text: |-
      De overdracht van verzoeken als bedoeld in de artikelen 8 en 9 van het verdrag en artikel 15 van de verordening,
      geschiedt door tussenkomst van de in het eerste lid bedoelde rechter. De rechter die een verzoek heeft
      overgedragen, stelt partijen hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel24
  - number: '25.1'
    text: Tot de afgifte van een verklaring als bedoeld in artikel 40, van het verdrag, is bevoegd de notaris.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel25
  - number: '25.2'
    text: De verklaring wordt afgegeven op een bij besluit van Onze Minister van Justitie vast te stellen formulier.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel25
  - number: '26'
    text: |-
      In de betrekkingen tussen Nederland en andere staten die partij zijn zowel bij het in [artikel 1][ref1] bedoelde
      verdrag als bij het op 20 mei 1980 te Luxemburg tot stand gekomen Europese verdrag betreffende de erkenning en de
      tenuitvoerlegging van beslissingen inzake het gezag over kinderen en betreffende het herstel van het gezag over
      kinderen (Trb. 1981, 10) gaat het in [artikel 1][ref2] bedoelde verdrag voor.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019574#Artikel1
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0019574
        artikel: '1'
        hoofdstuk: '1'
  - number: '30.1'
    text: |-
      [Artikel 28, onderdeel B][ref1], van deze wet is van toepassing op procedures inzake echtscheiding, scheiding van
      tafel en bed en ontbinding van het huwelijk na scheiding van tafel en bed, nietigverklaring alsmede nietigheid en
      geldigheid van het huwelijk die worden ingesteld op of na 1 maart 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel28
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '28'
        hoofdstuk: '10'
  - number: '30.2'
    text: |-
      Het in [artikel 1][ref1] bedoelde verdrag is niet van toepassing in procedures inzake ouderlijke
      verantwoordelijkheid of maatregelen ter bescherming van kinderen, die vóór zijn inwerkingtreding in Nederland zijn
      ingesteld en waarin na zijn inwerkingtreding een beslissing wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel1
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '1'
        hoofdstuk: '1'
  - number: '30.3'
    text: |-
      De inwerkingtreding in Nederland van het in [artikel 1][ref1] bedoelde verdrag laat ouderlijke verantwoordelijkheid
      die voordien van rechtswege aan een persoon is toegekomen, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel1
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '1'
        hoofdstuk: '1'
  - number: '30.4'
    text: |-
      Vanaf het tijdstip van de inwerkingtreding in Nederland van het in [artikel 1][ref1] bedoelde verdrag wordt het van
      rechtswege ontstaan van ouderlijke verantwoordelijkheid van een persoon die deze niet reeds heeft, door dat verdrag
      beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0019574#Artikel1
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019574
        artikel: '1'
        hoofdstuk: '1'
  - number: '31'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel31
  - number: '32'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet internationale kinderbescherming'
    url: https://wetten.overheid.nl/BWBR0019574/2017-09-01#Artikel32
