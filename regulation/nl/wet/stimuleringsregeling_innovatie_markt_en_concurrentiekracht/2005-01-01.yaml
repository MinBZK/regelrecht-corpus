        artikel: 4:57
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '25'
    text: |-
      1 De Stimuleringsregeling milieuvriendelijke agrificatie wordt ingetrokken.

      2 Aanvragen die vóór de inwerkingtreding van deze regeling zijn ingediend op grond van de Stimuleringsregeling
      milieuvriendelijke agrificatie zullen overeenkomstig laatstgenoemde regeling worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel25
  - number: '26'
    text: |-
      Eén jaar na inwerkingtreding en voorts iedere drie jaar wordt een verslag gepubliceerd over de doeltreffendheid en
      de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel26
  - number: '27'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel27
  - number: 27a
    text: |-
      Deze regeling berust op [artikel 2 van de Kaderwet LNV-subsidies][ref1].


