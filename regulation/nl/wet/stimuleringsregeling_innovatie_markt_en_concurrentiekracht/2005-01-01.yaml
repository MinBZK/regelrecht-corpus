articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *minister:*


                Minister van Landbouw, Natuur en Voedselkwaliteit;



              b

                *innovatieproject:*


                samenhangend geheel van activiteiten gericht op:
                het creëren van nieuwe, gewijzigde of verbeterde producten, technieken, systemen, processen, diensten of
      organisatievormen tot aan – maar niet met inbegrip van – de commerciële toepassing op praktijkschaal, en
      het verwerven van kennis ten behoeve van de onder het eerste streepje bedoelde activiteiten;



              c

                *groep:*


                groep als bedoeld in artikel 2:24b van het Burgerlijk Wetboek;



              d

                *Dienst Regelingen:*


                Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.




      2 In deze regeling wordt mede verstaan onder visserij: aquicultuur.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 De minister kan ter stimulering van het innovatieve vermogen in de landbouw-, de visserij- of de bosbouwsector op
      aanvraag subsidie verlenen voor innovatieprojecten die:

      a. zijn gericht op de productie, de be- of verwerking van of de handel in producten uit de landbouw, de visserij of
      de bosbouw in Nederland en

      b. een duur van ten hoogste drie jaar hebben.

      2 De subsidieverlening wordt geweigerd voor innovatieprojecten:

      a. met de uitvoering waarvan een aanvang is gemaakt alvorens de ontvangst van de aanvraag schriftelijk aan de
      aanvrager is bevestigd, of

      b. waarvan de subsidiabele kosten minder dan € 9.075,60 bedragen.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister stelt ieder begrotingsjaar of per aanvraagperiode een subsidieplafond vast voor op grond van deze
      regeling te verlenen subsidies. Hij geeft hiervan kennis in de Staatscourant.

      2 De minister voorziet, gezien het advies van de beoordelingscommissie, bedoeld in [artikel 10, derde lid][ref1],
      in een gelijktijdige beslissing op aanvragen met betrekking tot soortgelijke projecten op basis van een
      vergelijking van hen geschiktheid om bij te dragen aan de doelstellingen van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel10
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008493
        artikel: '10'
        paragraaf: '3'
  - number: '4'
    text: |-
      1 De minister kan voor een innovatieproject als bedoeld in [artikel 2][ref1] een subsidie verlenen aan:

      a. een ondernemer die voor eigen rekening en risico een onderneming drijft of

      b. een geen rechtspersoonlijkheid bezittend samenwerkingsverband van ondernemers als bedoeld in onderdeel a die
      voor gezamenlijke rekening en risico een innovatieproject uitvoeren.

      2 De subsidieverlening wordt geweigerd aan ondernemingen die zijn gericht op onderzoek, scholing, opleiding,
      voorlichting, advies of begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel2
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008493
        artikel: '2'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Als subsidiabele kosten worden uitsluitend in aanmerking genomen:

      a. de volgende, door de aanvrager aantoonbaar gemaakte en betaalde kosten, voorzover zij noodzakelijk zijn en
      rechtstreeks zijn toe te rekenen aan de onderdelen van het project waarop de beschikking tot subsidieverlening,
      bedoeld in [artikel 11][ref1] betrekking heeft:

        - loonkosten van het direct bij de uitvoering van het project betrokken personeel, berekend op basis van het
      brutojaarloon volgens de verzamelloonlijst van de betrokken medewerkers, exclusief volledige winstafhankelijke
      uitkeringen, verhoogd met de wettelijke dan wel op grond van een collectieve arbeidsovereenkomst verschuldigde
      opslagen voor sociale lasten, te delen door 1600,
        - de loonkosten van het leidinggevend en toezichthoudend personeel, berekend op de wijze van het eerste streepje,
      indien de aanvrager minder dan 10 werknemers heeft,
        - de kosten van aangeschafte machines en apparatuur, gebaseerd op de historische aanschafprijzen, of de aan het
      project toe te rekenen leasetermijnen, exclusief financieringskosten en winstopslagen bij transacties binnen een
      groep, tot een maximum 50% van de historische aanschafprijzen of van de in totaal verschuldigde leasetermijnen,
        - kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen, exclusief
      winstopslagen bij transacties binnen een groep,
        - aan derden verschuldigde kosten ter zake van studies en onderzoeksactiviteiten en ter zake van de verwerving
      van kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die rechten, exclusief
      winstopslagen bij transacties binnen een groep en
        - reis- en verblijfkosten en kosten van deelname aan symposia tot een maximum van 15% van de in het eerste streepje
      bedoelde loonkosten,

      b. een forfaitaire opslag voor de algemene kosten van 20% van de onder a, aanhef en eerste streepje bedoelde
      loonkosten, indien de aanvrager 10 of meer werknemers in dienst heeft.

      2 Indien de aanvrager op het tijdstip van de aanvraag geen of minder dan 10 werknemers in dienst heeft, komen de
      kosten voor de door de aanvrager ten behoeve van het project verrichte arbeid in aanmerking voor een vergoeding van
      € 18,15 per uur.

      3 Eveneens als subsidiabele kosten worden, tot een maximum van € 11.344,51 in aanmerking genomen de kosten, bedoeld
      in het eerste lid, onderdeel a, vijfde streepje, ter voorbereiding van een aanvraag tot subsidieverlening indien:

      a. de aanvrager op het tijdstip van de aanvraag tot subsidieverlening minder dan 25 werknemers in dienst heeft en

      b. de aanvraag tot subsidieverlening is gevolgd door een beschikking tot subsidieverlening als bedoeld in
      [artikel 11][ref2].

      4 De kosten worden in aanmerking genomen met inbegrip van de verschuldigde omzetbelasting, indien de aanvrager
      omzetbelasting niet kan verrekenen met door hem af te dragen omzetbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008493#Artikel11
