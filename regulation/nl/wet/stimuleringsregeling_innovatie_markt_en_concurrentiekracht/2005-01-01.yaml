        artikel: '9'
        paragraaf: '3'
  - number: '8'
    text: |-
      1 De aanvraag tot subsidieverlening wordt ingediend bij Dienst Regelingen, op een daartoe vastgesteld formulier.

      2 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. in voorkomend geval, het aan het samenwerkingsverband ten grondslag liggende samenwerkingscontract, met daarin
      in elk geval een overzicht van de aan het samenwerkingsverband deelnemende ondernemingen alsmede van de verdeling
      van de verantwoordelijkheden, bevoegdheden en financiële verplichtingen tussen de verschillende ondernemingen;

      b. een projectplan, inhoudende een beschrijving van de doelstellingen en achtergronden van het project, de
      activiteiten, een tijdsplanning van de activiteiten en de wijze van uitvoering,

      c. een begroting van de kosten en een opgave van de financieringswijze van het project en

      d. bewijsstukken dat de aanvrager of, in voorkomend geval, de deelnemers aan het samenwerkingsverband ondernemers
      zijn als bedoeld in [artikel 4, eerste lid, onderdeel a][ref1].

      3 De aanvrager maakt in de aanvraag tot subsidieverlening een keuze tussen onderdeel a en onderdeel b van
      [artikel 6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008493#Artikel6
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel8
