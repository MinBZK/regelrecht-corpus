  - number: '6'
    text: |-
      1 De subsidie bedraagt:

      a. 50% van de subsidiabele kosten voor het gedeelte tot en met € 907.560,43 en 25% voor het gedeelte boven €
      907.560,43; of

      b. 25% van de subsidiabele kosten.

      2 De subsidie bedraagt ten hoogste € 1.134.450,54.

      3 Indien voor de subsidiabele kosten of een gedeelte daarvan reeds uit anderen hoofde een subsidie is of zal worden
      verstrekt, wordt slechts een zodanig bedrag aan subsidie verleend dat het totale subsidiebedrag niet meer bedraagt
      dan 75% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen.

      2 De minister kan per kalenderjaar of per aanvraagperiode bepalen dat slechts voor bepaalde categorieën innovatie-
      projecten een aanvraag tot subsidieverlening kan worden ingediend.

      3 De minister kan nader bepalen dat bij de beoordeling, bedoeld in [artikel 9, eerste lid][ref1], prioriteit wordt
      gegeven aan bepaalde categorieën innovatieprojecten.

      4 De minister maakt de besluiten, bedoeld in het eerste tot en met het derde lid, bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel9
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel7
    references:
