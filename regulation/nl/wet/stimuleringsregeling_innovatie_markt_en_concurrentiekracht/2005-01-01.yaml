  - number: '9'
    text: |-
      1 Er is onderscheidenlijk zijn een of meer Beoordelingscommissies innovatieprojecten, die tot taak heeft
      onderscheidenlijk hebben de haar daartoe voorgelegde aanvragen tot subsidieverlening overeenkomstig
      [artikel 10][ref1] te beoordelen en hierover advies uit te brengen aan de minister.

      2 De beoordelingscommissie bestaat uit een voorzitter, tevens lid, en ten minste drie doch ten hoogste twaalf
      leden.

      3 De minister benoemt op basis van hun specifieke kennis en deskundigheid de voorzitter en de leden van de
      beoordelingscommissie voor een termijn van drie jaar. Ze zijn te allen tijde opnieuw benoembaar.

      4 De beoordelingscommissie stelt haar werkwijze vast.

      5 Het secretariaat wordt gevoerd door door de minister aan te wijzen ambtenaren van het Ministerie van Landbouw,
      Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel10
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008493
        artikel: '10'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 De beoordelingscommissie beoordeelt in welke mate het innovatieproject:

      a. een innovatief karakter heeft,

      b. economisch of technisch perspectief heeft op toepassing op praktijkschaal, en

      c. een uitstralingseffect kan hebben voor toepassing door andere ondernemingen.

      2 De beoordelingscommissie kan de minister adviseren een aanvraag tot subsidieverlening geheel of gedeeltelijk af
      te wijzen.

      3 De beoordelingscommissie brengt na de beoordeling van de innovatieprojecten, advies uit aan de minister in de
      vorm van een rangschikking van de aanvragen tot subsidieverlening waarover de commissie ingevolge het tweede lid
      niet afwijzend adviseert, waarbij aanvragen tot subsidieverlening:

      a. hoger worden gerangschikt naarmate ze naar het oordeel van de beoordelingscommissie meer voldoen aan de in het
      eerste lid bedoelde criteria en

      b. die in gelijke mate aan de in het eerste lid bedoelde criteria voldoen, hoger worden gerangschikt indien ze
      voldoen aan de door de minister ingevolge [artikel 7, derde lid][ref1], vastgestelde prioriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel7
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008493
        artikel: '7'
        paragraaf: '3'
  - number: '11'
    text: |-
      De minister geeft de beschikking tot subsidieverlening binnen vier maanden na afloop van de aanvraagperiode waarin
      de aanvraag tot subsidieverlening is ingediend. Indien deze termijn niet kan worden gehaald, stelt de minister de
      aanvrager daarvan in kennis en noemt hij daarbij een redelijke termijn waarop de beschikking tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel11
  - number: '13'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van
      het project niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0008493/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 De subsidieontvanger voert het project uit:

      a. overeenkomstig het projectplan waarop de beschikking tot subsidieverlening betrekking heeft, behoudens
      goedgekeurde wijzigingen van het project als bedoeld in het tweede lid,

      b. in Nederland, behoudens toestemming van de minister tot gedeeltelijke uitvoering buiten Nederland en

      c. binnen de in [artikel 2, eerste lid, onderdeel b][ref1], bedoelde periode.

      2 Wijzigingen in het innovatieprojectplan gedurende de looptijd van het innovatieproject zijn verboden. De minister
      kan echter aan Dienst Regelingen gemelde wijzigingen van het innovatieprojectplan goedkeuren. Deze goedkeuring
      wordt niet verleend voorzover het wijzigingen ten aanzien van de doelstelling betreft. De minister deelt de
      subsidieontvanger mede of en in welke mate de wijziging van het innovatieprojectplan gevolgen heeft voor de
      verleende subsidie of voor de bij de verlening van de subsidie vastgestelde verplichtingen. De wijziging kan geen
      verhoging tot gevolg hebben voor het bedrag van de subsidie of het bedrag waarop de subsidie overeenkomstig de
      beschikking tot subsidieverlening ten hoogste kan worden vastgesteld.

      3 Indien de projectduur langer dan één jaar is, rapporteert de subsidieontvanger halverwege de projectduur in
      de vorm van een tussenverslag omtrent de voortgang van het project op een door de minister te bepalen wijze. Dit
      verslag bestaat ten minste uit een beschrijving van:

      a. de activiteiten die tot dan toe in het kader van het project zijn verricht en

      b. de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen.

      4 De subsidieontvanger is verplicht de kennis en informatie die met het project worden opgedaan, onmiddellijk
      na afloop van het project openbaar te maken, tenzij hij in de aanvraag tot subsidieverlening heeft gekozen voor
      [artikel 6, eerste lid, onderdeel b][ref2].

      5 De subsidieontvanger is verplicht een administratie te voeren die zodanig is ingericht dat daaruit te allen
      tijde op eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig
      de in [artikel 5, eerste en tweede lid][ref3], onderscheiden kostensoorten, met dien verstande dat ter zake
      van de loonkosten en de kosten voor eigen arbeid een door middel van een sluitende tijdschrijving vastgestelde
      urenverantwoording aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0008493#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008493#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008493#Artikel5
