  text: >-
    Gelet op artikel 1 van het Besluit gedeeltelijke opheffing (omgekeerde) contracteerplicht medisch-specialistische
    zorg;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0017938/2005-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De vormen van medisch-specialistische zorg waarvoor de [artikelen 47, eerste lid][ref1], en
      [48, eerste lid, van de Ziekenfondswet][ref2] niet gelden, zijn de prestaties waarvoor op grond van
      [artikel 11, vierde lid, onderdeel c, van de Wet tarieven gezondheidszorg][ref3] is bepaald dat de
      [artikelen 2, eerste lid, onderdelen c en d][ref4], en [3 tot en met 10 van de Wet tarieven gezondheidszorg][ref5]
      niet van toepassing zijn.


