---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_internationale_misdrijven
regulatory_layer: WET
publication_date: '2017-03-09'
valid_from: '2019-12-13'
bwb_id: BWBR0015252
url: https://wetten.overheid.nl/BWBR0015252/2019-12-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het nodig is om, mede gelet op het Statuut van het Internationaal
    Strafhof, regels te stellen met betrekking tot ernstige schendingen van het internationaal humanitair recht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.a
    text: 'Verdragen van Genève:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.a.1°
    text: |-
      het op 12 augustus 1949 te Genève tot stand gekomen Verdrag (I) voor de verbetering van het lot der gewonden en
      zieken, zich bevindende bij de strijdkrachten te velde (Trb. 1951, 72);
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.a.2°
    text: |-
      het op 12 augustus 1949 te Genève tot stand gekomen Verdrag (II) voor de verbetering van het lot der gewonden,
      zieken en schipbreukelingen van de strijdkrachten ter zee (Trb. 1951, 73);
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.a.3°
    text: |-
      het op 12 augustus 1949 te Genève tot stand gekomen Verdrag (III) betreffende de behandeling van krijgsgevangenen
      (Trb. 1951, 74); en
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.a.4°
    text: |-
      het op 12 augustus 1949 te Genève tot stand gekomen Verdrag (IV) betreffende de bescherming van burgers in
      oorlogstijd (Trb. 1951, 75);
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.b
    text: 'meerdere:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.b.1°
    text: |-
      de militaire commandant, of degene die feitelijk als zodanig optreedt, die daadwerkelijk het bevel of gezag
      uitoefent over of daadwerkelijk leiding geeft aan een of meer ondergeschikten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.b.2°
    text: |-
      degene die in een burgerlijke hoedanigheid daadwerkelijk gezag uitoefent over of daadwerkelijk leiding geeft aan
      een of meer ondergeschikten.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.c
    text: |-
      deportatie of onder dwang overbrengen van bevolking: het onder dwang verplaatsen van personen door verdrijving of
      andere dwangmaatregelen uit het gebied waarin zij zich rechtmatig bevinden zonder dat daarvoor gronden bestaan die
      naar internationaal recht zijn toegelaten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.d
    text: |-
      marteling: het opzettelijk veroorzaken van ernstige pijn of ernstig lijden, hetzij lichamelijk, hetzij geestelijk,
      bij een persoon die zich in gevangenschap of in de macht bevindt van degene die beschuldigd wordt, met dien
      verstande dat onder marteling niet wordt verstaan pijn of lijden dat louter het gevolg is van, inherent is aan of
      samenhangt met rechtmatige sancties;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.e
    text: |-
      foltering: marteling van een persoon met het oogmerk om van hem of van een derde inlichtingen of een bekentenis
      te verkrijgen, hem te bestraffen voor een handeling die hij of een derde heeft begaan of waarvan hij of een
      derde wordt verdacht, of hem of een derde vrees aan te jagen of te dwingen iets te doen of te dulden, dan wel om
      enigerlei reden gebaseerd op discriminatie uit welke grond dan ook, van overheidswege gepleegd;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.f
    text: |-
      gedwongen zwangerschap: de onrechtmatige gevangenschap van een vrouw die onder dwang zwanger is gemaakt, met de
      opzet de etnische samenstelling van een bevolking te beïnvloeden of andere ernstige schendingen van internationaal
      recht te plegen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
  - number: 1.1.g
    text: |-
      apartheid: onmenselijke handelingen van een vergelijkbare aard als de in [artikel 4, eerste lid][ref1], bedoelde
      handelingen, gepleegd in het kader van een geïnstitutionaliseerd regime van systematische onderdrukking en
      overheersing door een groep van een bepaald ras van een of meer groepen van een ander ras en begaan met de opzet
      dat regime in stand te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel4
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '4'
        paragraaf: '2'
  - number: '1.2'
    text: |-
      De uitdrukking ambtenaar heeft in deze wet dezelfde betekenis als in het [Wetboek van Strafrecht][ref1], met dien
      verstande dat voor de toepassing van de Nederlandse strafwet onder ambtenaar mede wordt begrepen degene die ten
      dienste van een vreemde staat een openbaar ambt bekleedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '1.3'
    text: |-
      De uitdrukkingen samenspanning en zwaar lichamelijk letsel hebben in deze wet dezelfde betekenis als in het
      [Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '1.4'
    text: |-
      Met een in deze wet omschreven misdrijf wordt gelijkgesteld een van de misdrijven omschreven in de
      [artikelen 131 tot en met 134][ref1], [140][ref2], [189][ref3], [416 tot en met 417bis][ref4] en
      [420bis tot en met 420quater van het Wetboek van Strafrecht][ref5], indien het strafbare feit waarvan in die
      artikelen gesproken wordt, betrekking heeft op een misdrijf omschreven in de [artikelen 3 tot en met 8b][ref6] van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel189
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel416
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel420bis
      [ref6]: https://wetten.overheid.nl/BWBR0015252#Artikel3
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '189'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '416'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 420bis
      - id: ref6
        bwb_id: BWBR0015252
        artikel: '3'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      Onverminderd het te dien aanzien in het [Wetboek van Strafrecht][ref1] en het
      [Wetboek van Militair Strafrecht][ref2] bepaalde is de Nederlandse strafwet toepasselijk:


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001869
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001869
  - number: 2.1.a
    text: |-
      op ieder die zich buiten Nederland schuldig maakt aan een van de in deze wet omschreven misdrijven, wanneer de
      verdachte zich in Nederland of in de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel2
  - number: 2.1.b
    text: |-
      op ieder die zich buiten Nederland schuldig maakt aan een van de in deze wet omschreven misdrijven, wanneer het
      feit is begaan tegen een Nederlander, een Nederlandse ambtenaar, dan wel een Nederlands voertuig, vaartuig of
      luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel2
  - number: 2.1.c
    text: op de Nederlander die zich buiten Nederland schuldig maakt aan een van de in deze wet omschreven misdrijven.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel2
  - number: '2.2'
    text: |-
      Met een Nederlander wordt voor de toepassing van het eerste lid gelijkgesteld de vreemdeling die in Nederland een
      vaste woon- of verblijfplaats heeft, alsmede, voor zover het de toepassing van het eerste lid, onder c, betreft, de
      vreemdeling die na het plegen van het feit Nederlander wordt. [Artikel 86b van het Wetboek van Strafrecht][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel86b
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 86b
  - number: '3.1'
    text: |-
      Hij die met het oogmerk om een nationale, etnische of godsdienstige groep, dan wel een groep behorend tot een
      bepaald ras, geheel of gedeeltelijk, als zodanig te vernietigen:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel3
  - number: 3.1.a
    text: leden van de groep doodt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel3
  - number: 3.1.b
    text: leden van de groep zwaar lichamelijk of geestelijk letsel toebrengt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel3
  - number: 3.1.c
    text: |-
      opzettelijk aan de groep levensomstandigheden oplegt die op haar gehele of gedeeltelijke lichamelijke vernietiging
      zijn gericht;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel3
  - number: 3.1.d
    text: maatregelen neemt, welke tot doel hebben geboorten binnen de groep te voorkomen; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel3
  - number: 3.1.e
    text: kinderen van de groep onder dwang overbrengt naar een andere groep,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel3
  - number: '3.2'
    text: |-
      De samenspanning en de opruiing tot genocide die in het openbaar, mondeling of bij geschrift of afbeelding,
      plaatsvindt, worden gestraft gelijk de poging.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel3
  - number: '4.1'
    text: |-
      Als schuldig aan een misdrijf tegen de menselijkheid wordt gestraft met levenslange gevangenisstraf of tijdelijke
      van ten hoogste dertig jaren of geldboete van de zesde categorie, hij die een van de volgende handelingen begaat,
      indien gepleegd als onderdeel van een wijdverbreide of stelselmatige aanval gericht tegen een burgerbevolking, met
      kennis van de aanval:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.a
    text: opzettelijk doden;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.b
    text: uitroeiing;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.c
    text: slavernij;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.d
    text: deportatie of onder dwang overbrengen van bevolking;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.e
    text: |-
      gevangenneming of andere ernstige beroving van de lichamelijke vrijheid in strijd met fundamentele regels van
      internationaal recht;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.f
    text: marteling;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.g
    text: |-
      verkrachting, seksuele slavernij, gedwongen prostitutie, gedwongen zwangerschap, gedwongen sterilisatie, of enige
      andere vorm van seksueel geweld van vergelijkbare ernst;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.h
    text: |-
      vervolging van een identificeerbare groep of collectiviteit op politieke gronden, omdat deze tot een bepaald ras
      of een bepaalde nationaliteit behoort, op etnische, culturele of godsdienstige gronden, op grond van geslacht of op
      andere gronden die universeel zijn erkend als ontoelaatbaar krachtens internationaal recht, in verband met een in
      dit lid bedoelde handeling of enig ander misdrijf omschreven in deze wet;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.i
    text: gedwongen verdwijning van een persoon;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.j
    text: apartheid;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.1.k
    text: |-
      andere onmenselijke handelingen van vergelijkbare aard waardoor opzettelijk ernstig lijden of ernstig lichamelijk
      letsel of schade aan de geestelijke of lichamelijke gezondheid wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: '4.2'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.2.a
    text: |-
      aanval gericht tegen een burgerbevolking: een wijze van optreden die met zich brengt het meermalen plegen van in
      het eerste lid bedoelde handelingen tegen een burgerbevolking ter uitvoering of voortzetting van het beleid van een
      staat of organisatie, dat het plegen van een dergelijke aanval tot doel heeft;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.2.b
    text: |-
      slavernij: de uitoefening op een persoon van een of alle bevoegdheden verbonden aan het recht van eigendom, met
      inbegrip van de uitoefening van dergelijke bevoegdheid bij mensenhandel, in het bijzonder handel in vrouwen en
      kinderen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.2.c
    text: |-
      vervolging: het opzettelijk en in ernstige mate ontnemen van fundamentele rechten in strijd met het internationaal
      recht op grond van de identiteit van de groep of collectiviteit;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: 4.2.d
    text: |-
      gedwongen verdwijning van een persoon: het arresteren, gevangen houden, afvoeren of elke andere vorm van
      vrijheidsontneming van een persoon door of met de machtiging, ondersteuning of bewilliging van een staat of
      politieke organisatie, gevolgd door een weigering een dergelijke vrijheidsontneming te erkennen of informatie te
      verstrekken over het lot of de verblijfplaats van die persoon of door verhulling van dat lot of die verblijfplaats,
      waardoor deze buiten de bescherming van de wet wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: '4.3'
    text: |-
      Onder «uitroeiing» wordt in dit artikel mede verstaan: het opzettelijk opleggen van levensomstandigheden, onder
      andere de onthouding van toegang tot voedsel en geneesmiddelen, gericht op de vernietiging van een deel van een
      bevolking.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel4
  - number: '5.1'
    text: |-
      Hij die zich in geval van een internationaal gewapend conflict schuldig maakt aan een van de ernstige inbreuken
      op de Verdragen van Genève, te weten de volgende feiten indien begaan tegen door genoemde verdragen beschermde
      personen:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.a
    text: opzettelijk doden;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.b
    text: marteling of onmenselijke behandeling, met inbegrip van biologische experimenten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.c
    text: opzettelijk veroorzaken van ernstig lijden, zwaar lichamelijk letsel of ernstige schade aan de gezondheid;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.d
    text: grootschalige opzettelijke en wederrechtelijke vernietiging en toe-eigening van goederen zonder militaire noodzaak;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.e
    text: |-
      een krijgsgevangene of andere beschermde persoon dwingen dienst te nemen bij de strijdkrachten van een vijandige
      mogendheid;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.f
    text: |-
      een krijgsgevangene of andere beschermde persoon opzettelijk het recht op een eerlijke en rechtmatige berechting
      onthouden;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.g
    text: wederrechtelijke deportatie of verplaatsing of wederrechtelijke opsluiting; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.1.h
    text: het nemen van gijzelaars,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: '5.2'
    text: |-
      Hij die zich in geval van een internationaal gewapend conflict schuldig maakt aan een van de ernstige inbreuken
      op het op 12 december 1977 te Bern tot stand gekomen Aanvullende Protocol (I) bij de Verdragen van Genève van 12
      augustus 1949, betreffende de bescherming van slachtoffers van internationale gewapende conflicten, (Trb. 1980,
      87), te weten:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.a
    text: de in het eerste lid bedoelde feiten, indien begaan tegen een door het Aanvullende Protocol (I) beschermde persoon;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.b
    text: |-
      ieder opzettelijk handelen of nalaten dat de gezondheid in gevaar brengt van enige persoon die zich in de macht
      bevindt van een andere partij dan de partij waartoe hij behoort, en dat:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.b.1°
    text: |-
      een medische behandeling inhoudt die niet noodzakelijk is als gevolg van de gezondheidstoestand van de betrokken
      persoon en die niet in overeenstemming is met de algemeen aanvaarde medische normen welke onder gelijke medische
      omstandigheden zouden worden toegepast ten aanzien van personen die onderdaan zijn van de voor de handelingen
      verantwoordelijke partij en op geen enkele wijze van hun vrijheid zijn beroofd;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.b.2°
    text: het uitvoeren op de betrokken persoon inhoudt, zelfs met diens toestemming, van lichamelijke verminkingen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.b.3°
    text: |-
      het uitvoeren op de betrokken persoon inhoudt, zelfs met diens toestemming, van medische of wetenschappelijke
      experimenten; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.b.4°
    text: |-
      het uitvoeren op de betrokken persoon inhoudt, zelfs met diens toestemming, van verwijdering van weefsel of organen
      voor transplantatie;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.c
    text: |-
      de volgende feiten, wanneer zij opzettelijk en in strijd met de desbetreffende bepalingen van het Aanvullende
      Protocol (I) worden begaan en de dood of ernstig lichamelijk letsel met zich brengen dan wel de gezondheid in
      ernstige mate benadelen:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.c.1°
    text: het doen van aanvallen op de burgerbevolking of individuele burgers;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.c.2°
    text: |-
      het uitvoeren van een niet-onderscheidende aanval waardoor de burgerbevolking of burgerobjecten worden getroffen,
      in de wetenschap dat een zodanige aanval buitensporig verlies van mensenlevens, verwondingen van burgers of schade
      aan burgerobjecten zal veroorzaken;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.c.3°
    text: |-
      het uitvoeren van een aanval tegen werken of installaties die gevaarlijke krachten bevatten, in de wetenschap dat
      een zodanige aanval buitensporig verlies van mensenlevens, verwondingen van burgers of schade aan burgerobjecten
      zal veroorzaken;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.c.4°
    text: het doen van aanvallen op onverdedigde plaatsen of gedemilitariseerde zones;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.c.5°
    text: het doen van aanvallen op een persoon in de wetenschap dat hij buiten gevecht verkeert; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.c.6°
    text: |-
      het perfide gebruik, in strijd met artikel 37 van het Aanvullende Protocol (I), van het embleem van het rode kruis,
      de rode halve maan of van andere door de Verdragen van Genève of het Aanvullende Protocol (I) erkende beschermende
      tekens; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.d
    text: |-
      de volgende feiten, wanneer zij opzettelijk en in strijd met de Verdragen van Genève en het Aanvullende Protocol
      (I) worden begaan:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.d.1°
    text: |-
      het overbrengen door de bezettende mogendheid van gedeelten van haar eigen burgerbevolking naar het door haar
      bezette gebied of de overbrenging van de gehele bevolking van het bezette gebied of van een deel daarvan binnen of
      buiten dat gebied in strijd met artikel 49 van het Vierde Verdrag van Genève;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.d.2°
    text: ongerechtvaardigde vertraging bij de repatriëring van krijgsgevangenen of burgers;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.d.3°
    text: |-
      praktijken van apartheid of andere onmenselijke en onterende praktijken die een aanslag op de menselijke
      waardigheid vormen en zijn gebaseerd op rassendiscriminatie;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.d.4°
    text: |-
      het doen van aanvallen op duidelijk als zodanig herkenbare historische monumenten, kunstwerken of plaatsen van
      godsdienstige verering die het culturele of geestelijke erfdeel van de volkeren vormen en waaraan bijzondere
      bescherming is verleend door een speciale regeling, bijvoorbeeld in het kader van een bevoegde internationale
      organisatie, wanneer daarvan verwoesting op grote schaal het gevolg is, er geen bewijs bestaat van schending
      door de tegenpartij van artikel 53, letter b, van het Aanvullende Protocol (I) en wanneer zodanige historische
      monumenten, kunstwerken of plaatsen waar godsdienstoefeningen worden gehouden niet in de onmiddellijke nabijheid
      van militaire doelen zijn gelegen; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.2.d.5°
    text: |-
      het ontnemen van het recht van een persoon die door de Verdragen van Genève of artikel 85, tweede lid, van het
      Aanvullende Protocol (I) wordt beschermd om eerlijk en volgens de toepasselijke regels te worden berecht,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: '5.3'
    text: 'Hij die zich in geval van een internationaal gewapend conflict schuldig maakt aan een van de volgende feiten:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.3.a
    text: |-
      verkrachting, seksuele slavernij, gedwongen prostitutie, gedwongen sterilisatie of elke andere vorm van seksueel
      geweld die even ernstig kan worden geacht als een ernstige inbreuk op de Verdragen van Genève;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.3.b
    text: gedwongen zwangerschap;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.3.c
    text: |-
      personen die zich in de macht van een tegenpartij bevinden onderwerpen aan lichamelijke verminking of medische
      of wetenschappelijke experimenten, van welke aard ook, die niet worden gerechtvaardigd door de geneeskundige of
      tandheelkundige behandeling van de betrokken persoon of door diens behandeling in het ziekenhuis, noch in zijn
      belang worden uitgevoerd, en die de dood ten gevolge hebben of de gezondheid van die persoon of personen ernstig in
      gevaar kan brengen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.3.d
    text: op verraderlijke wijze doden of verwonden van personen die behoren tot de vijandige natie of het vijandige leger;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.3.e
    text: |-
      een combattant doden of verwonden die in de macht van de tegenpartij is, duidelijk aangeeft zich te willen
      overgeven, of buiten bewustzijn is of op andere wijze door verwondingen of ziekte is uitgeschakeld en daarom niet
      in staat is zich te verdedigen, mits hij zich in alle genoemde gevallen onthoudt van iedere vijandelijke handeling
      en niet tracht te ontvluchten; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.3.f
    text: |-
      op zodanig ongepaste wijze gebruik maken van een witte vlag, van de vlag of militaire onderscheidingstekens en
      uniform van de vijand of van de Verenigde Naties, of van emblemen van de Verdragen van Genève, dat dit de dood of
      ernstig lichamelijk letsel ten gevolge heeft,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: '5.4'
    text: |-
      Met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie wordt gestraft hij die
      zich in geval van een internationaal gewapend conflict opzettelijk en wederrechtelijk schuldig maakt aan een van de
      volgende feiten:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.4.a
    text: |-
      een cultureel goed onder versterkte bescherming als bedoeld in de artikelen 10 en 11 van het op 26 maart 1999 te
      Den Haag tot stand gekomen Tweede Protocol bij het Haagse Verdrag van 1954 inzake de bescherming van culturele
      goederen in het geval van een gewapend conflict (Trb. 1999, 107) het voorwerp van een aanval maken;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.4.b
    text: |-
      een cultureel goed onder versterkte bescherming als bedoeld in onderdeel a of de onmiddellijke omgeving daarvan
      gebruiken ter ondersteuning van militair optreden;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.4.c
    text: |-
      culturele goederen onder bescherming van het op 14 mei 1954 te Den Haag tot stand gekomen Verdrag inzake de
      bescherming van culturele goederen in het geval van een gewapend conflict (Trb. 1955, 47) of het bij dat Verdrag
      behorende Tweede Protocol op grote schaal vernietigen of zich toe-eigenen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.4.d
    text: een cultureel goed onder bescherming als bedoeld in onderdeel c het voorwerp van een aanval maken; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.4.e
    text: |-
      diefstal, plundering of ontvreemding van, of daden van vandalisme gericht tegen culturele goederen onder
      bescherming van het in onderdeel c genoemde verdrag.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: '5.5'
    text: 'Hij die zich in geval van een internationaal gewapend conflict schuldig maakt aan een van de volgende feiten:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.a
    text: opzettelijk aanvallen richten op burgerobjecten, dat wil zeggen objecten die geen militair doel zijn;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.b
    text: |-
      opzettelijk een aanval inzetten in de wetenschap dat een dergelijke aanval bijkomstige verliezen aan levens of
      letsel onder burgers zal veroorzaken of schade aan burgerobjecten of omvangrijke, langdurige en ernstige schade
      aan het milieu zal aanrichten, die duidelijk buitensporig zou zijn in verhouding tot het te verwachten concrete en
      directe algehele militaire voordeel;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.c
    text: |-
      aanvallen of bombarderen, met wat voor middelen ook, van steden, dorpen, woningen of gebouwen die niet worden
      verdedigd en geen militair doelwit zijn;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.d
    text: |-
      rechtstreekse of indirecte verplaatsingen door de bezettende mogendheid van delen van haar eigen burgerbevolking
      naar het bezette grondgebied of de deportatie of het verplaatsen van de gehele of een deel van de bevolking van het
      bezette grondgebied binnen dat grondgebied of daarbuiten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.e
    text: |-
      verklaren dat de rechten en handelingen van onderdanen van de vijandelijke partij vervallen, geschorst of in rechte
      niet-ontvankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.f
    text: |-
      onderdanen van de vijandige partij dwingen deel te nemen aan oorlogshandelingen gericht tegen hun eigen land, ook
      als zij voor de aanvang van de oorlog in dienst van de oorlogvoerende partij waren;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.g
    text: gebruik van gif of giftige wapens;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.h
    text: gebruik van verstikkende, giftige of andere gassen en overige soortgelijke vloeistoffen, materialen of apparaten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.i
    text: |-
      gebruik van kogels die in het menselijk lichaam gemakkelijk in omvang toenemen of platter en breder worden, zoals
      kogels met een harde mantel die de kern gedeeltelijk onbedekt laat of voorzien is van inkepingen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.j
    text: wandaden begaan tegen de persoonlijke waardigheid, in het bijzonder vernederende en onterende behandeling;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.k
    text: |-
      gebruikmaken van de aanwezigheid van een burger of een andere beschermde persoon teneinde bepaalde punten, gebieden
      of strijdkrachten te vrijwaren van militaire operaties;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.l
    text: |-
      opzettelijk gebruikmaken van uithongering van burgers als methode van oorlogvoering door hun voorwerpen te
      onthouden die onontbeerlijk zijn voor hun overleving, waaronder het opzettelijk belemmeren van de aanvoer van
      hulpgoederen zoals voorzien in de Verdragen van Genève;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.m
    text: |-
      opzettelijk aanvallen richten op de burgerbevolking als zodanig of op individuele burgers die niet rechtstreeks aan
      vijandelijkheden deelnemen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.n
    text: |-
      opzettelijk aanvallen richten op gebouwen, materieel, medische eenheden en transport, alsmede personeel dat
      overeenkomstig internationaal recht gebruik maakt van de emblemen van de Verdragen van Genève;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.o
    text: |-
      opzettelijk aanvallen richten op personeel, installaties, materieel, eenheden of voertuigen, betrokken bij
      humanitaire hulpverlening of vredesmissies overeenkomstig het [Handvest van de Verenigde Naties](onbekend), zolang
      deze recht hebben op de bescherming die aan burgers of burgerobjecten wordt verleend krachtens het internationale
      recht inzake gewapende conflicten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.p
    text: |-
      opzettelijk aanvallen richten op gebouwen, bestemd voor godsdienst, onderwijs, kunst, wetenschap of charitatieve
      doeleinden, historische monumenten, ziekenhuizen en plaatsen waar zieken en gewonden worden samengebracht, mits
      deze geen militair doelwit zijn;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.q
    text: een stad of plaats plunderen, ook wanneer deze bij een aanval wordt ingenomen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.r
    text: |-
      kinderen beneden de leeftijd van vijftien jaar bij de nationale strijdkrachten of groepen onder de wapenen roepen
      of in militaire dienst nemen dan wel hen gebruiken voor actieve deelname aan vijandelijkheden;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.s
    text: verklaren dat geen kwartier zal worden verleend;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.t
    text: |-
      vernietiging of inbeslagneming van goederen van de tegenpartij tenzij deze vernietiging of inbeslagneming dringend
      vereist is als gevolg van dwingende omstandigheden van het conflict;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.u
    text: |-
      gebruik van wapens die gebruik maken van microbiologische of andere biologische middelen, of gifstoffen, ongeacht
      hun herkomst of de wijze van productie;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.v
    text: |-
      gebruik van wapens met als voornaamste gevolg het veroorzaken van verwondingen door fragmenten die in het menselijk
      lichaam niet met röntgenstralen kunnen worden ontdekt; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.5.w
    text: |-
      gebruik van laserwapens die speciaal zodanig zijn ontworpen dat hun enige gevechtsfunctie of een van hun
      gevechtsfuncties is het veroorzaken van blijvende blindheid bij onversterkt gezichtsvermogen, dat wil zeggen aan
      het blote oog of het oog met een corrigerende bril of lens,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: '5.6'
    text: 'Indien een feit als bedoeld in het vierde of vijfde lid:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.6.a
    text: de dood of zwaar lichamelijk letsel van een ander ten gevolge heeft dan wel verkrachting inhoudt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.6.b
    text: |-
      geweldpleging in vereniging tegen een of meer personen dan wel geweldpleging tegen een dode, zieke of gewonde
      inhoudt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.6.c
    text: |-
      het in vereniging vernielen, beschadigen, onbruikbaar maken of wegmaken van enig goed dat geheel of ten dele aan
      een ander toebehoort inhoudt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.6.d
    text: het in vereniging een ander dwingen iets te doen, niet te doen of te dulden inhoudt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.6.e
    text: het in vereniging een stad of plaats plunderen inhoudt, ook wanneer deze bij een aanval wordt ingenomen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.6.f
    text: |-
      een schending van een gegeven belofte of een schending van een met de tegenpartij als zodanig gesloten overeenkomst
      inhoudt; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.6.g
    text: |-
      misbruik van een door de wetten en gebruiken beschermde vlag of teken dan wel van de militaire
      onderscheidingstekenen of het uniform van de tegenpartij inhoudt,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: '5.7'
    text: 'Het tweede lid, onderdeel b, onder 4°, is niet van toepassing indien de daarin beschreven handeling:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.7.a
    text: |-
      in overeenstemming is met de algemeen aanvaarde medische normen welke onder gelijke medische omstandigheden zouden
      worden toegepast ten aanzien van personen die onderdaan zijn van de voor de handelingen verantwoordelijke partij en
      op geen enkele wijze van hun vrijheid zijn beroofd; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: 5.7.b
    text: |-
      betreft het geval dat bloed wordt afgestaan voor transfusie of huid voor transplantatie, mits dit vrijwillig en
      zonder enige dwang of aandrang geschiedt, en dan nog slechts voor therapeutische doeleinden, onder omstandigheden
      die beantwoorden aan de algemeen aanvaarde medische normen en maatregelen van toezicht, die zowel het belang van de
      donor als van de ontvanger beogen.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel5
  - number: '6.1'
    text: |-
      Hij die zich in geval van een niet-internationaal gewapend conflict schuldig maakt aan schending van het
      gemeenschappelijk artikel 3 van de Verdragen van Genève, te weten het begaan jegens personen die niet rechtstreeks
      aan de vijandelijkheden deelnemen, met inbegrip van personeel van strijdkrachten dat de wapens heeft neergelegd, of
      jegens personen die buiten gevecht zijn gesteld door ziekte, verwonding, gevangenschap of enig andere oorzaak, van
      een van de volgende feiten:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.1.a
    text: |-
      aanslagen op het leven of lichamelijke geweldpleging, in het bijzonder het doden op welke wijze ook, verminking,
      wrede behandeling of marteling;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.1.b
    text: het nemen van gijzelaars;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.1.c
    text: aanranding van de persoonlijke waardigheid, in het bijzonder vernederende en onterende behandeling; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.1.d
    text: |-
      het uitspreken of ten uitvoer leggen van vonnissen zonder voorafgaande berechting door een op regelmatige wijze
      samengesteld gerecht dat alle gerechtelijke waarborgen biedt, naar algemeen aanvaarde normen als onmisbaar erkend,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: '6.2'
    text: 'Hij die zich in geval van een niet-internationaal gewapend conflict schuldig maakt aan een van de volgende feiten:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.2.a
    text: |-
      verkrachting, seksuele slavernij, gedwongen prostitutie, gedwongen sterilisatie of elke andere vorm van seksueel
      geweld die even ernstig kan worden geacht als een ernstige inbreuk op de Verdragen van Genève;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.2.b
    text: gedwongen zwangerschap;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.2.c
    text: |-
      personen die zich in de macht van een tegenpartij bevinden onderwerpen aan lichamelijke verminking of medische
      of wetenschappelijke experimenten, van welke aard ook, die niet worden gerechtvaardigd door de geneeskundige of
      tandheelkundige behandeling van de betrokken persoon of door diens behandeling in het ziekenhuis, noch in zijn
      belang worden uitgevoerd, en die de dood ten gevolge hebben of de gezondheid van die persoon of personen ernstig in
      gevaar kan brengen; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.2.d
    text: op verraderlijke wijze doden of verwonden van personen die behoren tot de vijandige natie of het vijandige leger,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: '6.3'
    text: 'Hij die zich in geval van een niet-internationaal gewapend conflict schuldig maakt aan een van de volgende feiten:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.a
    text: |-
      opzettelijk aanvallen richten op de burgerbevolking als zodanig of op individuele burgers die niet rechtstreeks aan
      vijandelijkheden deelnemen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.b
    text: |-
      opzettelijk aanvallen richten op gebouwen, materieel, medische eenheden en transport, alsmede personeel dat
      overeenkomstig internationaal recht gebruik maakt van de emblemen van de Verdragen van Genève;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.c
    text: |-
      opzettelijk aanvallen richten op personeel, installaties, materieel, eenheden of voertuigen, betrokken bij
      humanitaire hulpverlening of vredesmissies overeenkomstig het Handvest van de Verenigde Naties, zolang deze recht
      hebben op de bescherming die aan burgers of burgerobjecten wordt verleend krachtens het internationale recht inzake
      gewapende conflicten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.d
    text: |-
      opzettelijk aanvallen richten op gebouwen, bestemd voor godsdienst, onderwijs, kunst, wetenschap of charitatieve
      doeleinden, historische monumenten, ziekenhuizen en plaatsen waar zieken en gewonden worden samengebracht, mits
      deze geen militair doelwit zijn;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.e
    text: een stad of plaats plunderen, ook wanneer deze bij een aanval wordt ingenomen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.f
    text: |-
      kinderen beneden de leeftijd van vijftien jaar bij de nationale strijdkrachten of groepen onder de wapenen roepen
      of in militaire dienst nemen dan wel hen gebruiken voor actieve deelname aan vijandelijkheden;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.g
    text: verklaren dat geen kwartier zal worden verleend;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.h
    text: |-
      vernietiging of inbeslagneming van goederen van de tegenpartij tenzij deze vernietiging of inbeslagneming dringend
      vereist is als gevolg van dwingende omstandigheden van het conflict;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.i
    text: |-
      opdracht geven tot de verplaatsing van de burgerbevolking om redenen verband houdende met het conflict, anders
      dan verband houdende met de veiligheid van de burgers of indien dringend vereist om redenen van dwingende
      omstandigheden van het conflict;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.j
    text: gebruik van gif of giftige wapens;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.k
    text: gebruik van verstikkende, giftige of andere gassen en overige soortgelijke vloeistoffen, materialen of apparaten;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.l
    text: |-
      gebruik van kogels die in het menselijk lichaam gemakkelijk in omvang toenemen of platter en breder worden, zoals
      kogels met een harde mantel die de kern gedeeltelijk onbedekt laat of voorzien is van inkepingen;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.m
    text: |-
      opzettelijk gebruikmaken van uithongering van burgers als methode van oorlogvoering door hun voorwerpen te
      onthouden die onontbeerlijk zijn voor hun overleving, waaronder het opzettelijk belemmeren van de aanvoer van
      hulpgoederen zoals voorzien in de Verdragen van Genève;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.n
    text: |-
      gebruik van wapens die gebruik maken van microbiologische of andere biologische middelen, of gifstoffen, ongeacht
      hun herkomst of de wijze van productie;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.o
    text: |-
      gebruik van wapens met als voornaamste gevolg het veroorzaken van verwondingen door fragmenten die in het menselijk
      lichaam niet met röntgenstralen kunnen worden ontdekt; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: 6.3.p
    text: |-
      gebruik van laserwapens die speciaal zodanig zijn ontworpen dat hun enige gevechtsfunctie of een van hun
      gevechtsfuncties is het veroorzaken van blijvende blindheid bij onversterkt gezichtsvermogen, dat wil zeggen aan
      het blote oog of het oog met een corrigerende bril of lens,
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
  - number: '6.4'
    text: |-
      [Artikel 5, zesde lid][ref1], is van overeenkomstige toepassing op een feit als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel5
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '5'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Hij die zich in het geval van een internationaal of niet-internationaal gewapend conflict schuldig maakt aan een
      schending van de wetten en gebruiken van de oorlog anders dan bedoeld in de [artikelen 5][ref1] of [6][ref2] wordt
      gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015252#Artikel6
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015252
        artikel: '6'
        paragraaf: '2'
  - number: '7.2'
    text: 'Gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel7
  - number: 7.2.a
    text: indien van een feit als bedoeld in het eerste lid de dood of zwaar lichamelijk letsel van een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel7
  - number: 7.2.b
    text: |-
      indien een feit als bedoeld in het eerste lid inhoudt een of meer wandaden begaan tegen de persoonlijke
      waardigheid, in het bijzonder vernederende en onterende behandeling;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel7
  - number: 7.2.c
    text: |-
      indien een feit als bedoeld in het eerste lid inhoudt het een ander dwingen iets te doen, niet te doen of te
      dulden; of
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel7
  - number: 7.2.d
    text: |-
      indien een feit als bedoeld in het eerste lid inhoudt een stad of plaats plunderen, ook wanneer deze bij een aanval
      wordt ingenomen.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel7
  - number: '7.3'
    text: |-
      [Artikel 5, zesde lid][ref1], is van overeenkomstige toepassing op een feit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel5
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '5'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Foltering door een ambtenaar of anderszins ten dienste van de overheid werkzame persoon in de uitoefening van zijn
      functie wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8
  - number: '8.2'
    text: 'Met gelijke straffen wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8
  - number: 8.2.a
    text: |-
      de ambtenaar of anderszins ten dienste van de overheid werkzame persoon die in de uitoefening van zijn functie
      door een der in [artikel 47, eerste lid, onder 2°, van het Wetboek van Strafrecht][ref1] vermelde middelen tot de
      foltering uitlokt of die opzettelijk toelaat dat een ander die foltering pleegt;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
  - number: 8.2.b
    text: |-
      hij die foltering pleegt, indien een ambtenaar of een anderszins ten dienste van de
      overheid werkzame persoon in de uitoefening van zijn functie zulks door een der in
      [artikel 47, eerste lid, onder 2°, van het Wetboek van Strafrecht][ref1] vermelde middelen heeft uitgelokt of
      zulks opzettelijk heeft toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
  - number: 8a.1
    text: |-
      Hij die zich schuldig maakt aan gedwongen verdwijning van een persoon, bedoeld in
      [artikel 4, tweede lid, onderdeel d][ref1], wordt gestraft met een gevangenisstraf van ten hoogste vijftien jaren
      of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel4
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '4'
        paragraaf: '2'
  - number: 8a.2
    text: 'Indien een feit als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8a
  - number: 8a.2.a
    text: de dood of zwaar lichamelijk letsel van de persoon ten gevolge heeft dan wel verkrachting inhoudt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8a
  - number: 8a.2.b
    text: geweldpleging in vereniging tegen een persoon dan wel geweldpleging tegen een zieke of gewonde inhoudt;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8a
  - number: 8a.2.c
    text: |-
      een zwangere vrouw, een minderjarige, een persoon met een handicap of een ander bijzonder kwetsbaar persoon
      betreft;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8a
  - number: 8a.2.d
    text: |-
      een groep van personen betreft, wordt de schuldige gestraft met levenslange gevangenisstraf of tijdelijke
      gevangenisstraf van ten hoogste dertig jaren of geldboete van de zesde categorie.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8a
  - number: 8b.1
    text: |-
      Hij die, in de positie verkerende daadwerkelijk controle uit te oefenen over of leiding te geven aan het politieke
      of militaire optreden van een staat, een daad van agressie die door zijn aard, ernst en schaal een onmiskenbare
      schending vormt van het Handvest van de Verenigde Naties, plant, voorbereidt, in gang zet of uitvoert, wordt als
      schuldig aan het misdrijf agressie gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig
      jaren of geldboete van de zesde categorie.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2
    text: |-
      Voor de toepassing van het eerste lid wordt verstaan onder «daad van agressie»: het gebruik van wapengeweld door
      een staat tegen de soevereiniteit, territoriale integriteit of politieke onafhankelijkheid van een andere staat,
      of het gebruik van wapengeweld door een staat dat op enige andere wijze onverenigbaar is met het Handvest van de
      Verenigde Naties. Elk van de volgende handelingen wordt, ongeacht of er een oorlogsverklaring is, in ieder geval
      als een daad van agressie aangemerkt:
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2.a
    text: |-
      de invasie of aanval door de strijdkrachten van een staat van respectievelijk op het grondgebied van een andere
      staat, of een militaire bezetting, ook als deze van tijdelijke aard is, die het gevolg is van een dergelijke
      invasie of aanval, of de annexatie door middel van geweld van het grondgebied van een andere staat of deel daarvan;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2.b
    text: |-
      het bombarderen door de strijdkrachten van een staat van het grondgebied van een andere staat of het gebruik van
      enig wapen door een staat tegen het grondgebied van een andere staat;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2.c
    text: de blokkade van de havens of kusten van een staat door de strijdkrachten van een andere staat;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2.d
    text: |-
      een aanval door de strijdkrachten van een staat op de land-, zee- of luchtstrijdkrachten of de zee- en luchtvloot
      van een andere staat;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2.e
    text: |-
      de inzet van strijdkrachten van een staat die met instemming van een andere staat aanwezig zijn op het grondgebied
      van die staat, in strijd met de voorwaarden vervat in de daarop betrekking hebbende overeenkomst of een verlenging
      van hun aanwezigheid op dit grondgebied na het verstrijken van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2.f
    text: |-
      het feit dat een staat toestaat dat zijn grondgebied, dat hij aan een andere staat ter beschikking heeft gesteld,
      door die andere staat wordt gebruikt om een daad van agressie te plegen tegen een derde staat;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: 8b.2.g
    text: |-
      het sturen door of namens een staat van gewapende bendes, groepen, ongeordende troepen of huurlingen, die met
      wapengeweld gepaard gaande handelingen plegen tegen een andere staat die zo ernstig zijn dat zij gelijkstaan met de
      hierboven genoemde handelingen, of die daar in aanzienlijke mate bij betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel8b
  - number: '9.1'
    text: |-
      Met gelijke straf als gesteld op de in [§ 2][ref1] en in [artikel 1, vierde lid][ref2], bedoelde feiten wordt
      gestraft de meerdere die:


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0015252#Artikel1
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015252
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015252
        artikel: '1'
        paragraaf: '1'
  - number: 9.1.a
    text: opzettelijk toelaat dat een aan hem ondergeschikte een zodanig feit begaat;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel9
  - number: 9.1.b
    text: |-
      opzettelijk nalaat maatregelen te nemen, voor zover die nodig zijn en van hem kunnen worden gevergd, indien een aan
      hem ondergeschikte een zodanig feit heeft gepleegd of voornemens is te plegen.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel9
  - number: '9.2'
    text: |-
      Met een straf van ten hoogste twee derde van het maximum van de hoofdstraffen, gesteld op de in [§ 2][ref1] en
      in [artikel 1, vierde lid][ref2], bedoelde feiten, wordt gestraft hij die door zijn schuld verzuimt maatregelen
      te nemen, voor zover die nodig zijn en van hem kunnen worden gevergd, indien een aan hem ondergeschikte, naar hij
      redelijkerwijs moet vermoeden, een zodanig feit heeft gepleegd of voornemens is te plegen.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0015252#Artikel1
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015252
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015252
        artikel: '1'
        paragraaf: '1'
  - number: '9.3'
    text: |-
      Indien in het geval bedoeld in het tweede lid op het feit levenslange gevangenisstraf is gesteld, wordt
      gevangenisstraf opgelegd van ten hoogste vijftien jaren.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel9
  - number: '10'
    text: De in deze wet strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel10
  - number: '11.1'
    text: |-
      Dat een in deze wet omschreven misdrijf is begaan ter uitvoering van een voorschrift, gegeven door de wetgevende
      macht van een staat, of ter uitvoering van een bevel van een meerdere, heft de strafbaarheid van het betrokken feit
      niet op.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel11
  - number: '11.2'
    text: |-
      De ondergeschikte die een in deze wet omschreven misdrijf begaat ter uitvoering van een bevel van een meerdere is
      niet strafbaar, indien het bevel door de ondergeschikte te goeder trouw als bevoegd gegeven werd beschouwd en de
      nakoming daarvan binnen de kring van zijn ondergeschiktheid was gelegen.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel11
  - number: '11.3'
    text: |-
      Voor de toepassing van het tweede lid wordt een bevel tot het plegen van genocide, een misdrijf tegen de
      menselijkheid of gedwongen verdwijning van een persoon geacht kennelijk onbevoegd gegeven te zijn.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel11
  - number: '12'
    text: |-
      De misdrijven, omschreven in deze wet, worden voor de toepassing van de [Uitleveringswet][ref1] of de
      [Wet overlevering inzake oorlogsmisdrijven][ref2] niet beschouwd als strafbare feiten van politieke aard.


      [ref1]: https://wetten.overheid.nl/BWBR0002559
      [ref2]: https://wetten.overheid.nl/BWBR0002134
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002559
      - id: ref2
        bwb_id: BWBR0002134
  - number: '13'
    text: |-
      Ten aanzien van de in deze wet omschreven misdrijven – met uitzondering van de feiten, bedoeld in
      [artikel 7, eerste lid][ref1], en, voor zover met die feiten verband houdend, de feiten, bedoeld
      in [artikel 9][ref2] – verjaart het recht tot strafvordering niet. De [artikelen 76][ref3] en
      [77d, derde lid, van het Wetboek van Strafrecht][ref4] zijn op die misdrijven niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015252#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel77d
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015252
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '76'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 77d
  - number: '14'
    text: |-
      Bij veroordeling tot een gevangenisstraf van ten minste een jaar wegens een der in deze wet omschreven misdrijven
      kan ontzetting van het in [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref1] vermelde recht
      worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '15'
    text: |-
      Van de misdrijven omschreven in deze wet neemt de rechtbank Den Haag kennis, behoudens de bevoegdheid van de
      rechter, aangewezen bij de [Wet militaire strafrechtspraak][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004789
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004789
  - number: '16'
    text: 'Strafvervolging voor een der in deze wet omschreven misdrijven is uitgesloten ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16
  - number: 16.a
    text: |-
      buitenlandse staatshoofden, regeringsleiders en ministers van buitenlandse zaken, zolang zij als zodanig in functie
      zijn, alsmede andere personen voor zover hun immuniteit door het volkenrechtelijk gewoonterecht wordt erkend;
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16
  - number: 16.b
    text: personen die over immuniteit beschikken op grond van enig verdrag dat binnen het Koninkrijk voor Nederland geldt.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16
  - number: 16a
    text: |-
      Onverminderd de overige artikelen van deze paragraaf is deze wet mede van toepassing in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16a
  - number: 16b
    text: |-
      In afwijking van [artikel 1, tweede lid][ref1], heeft de uitdrukking ambtenaar in deze wet dezelfde betekenis als
      in het Wetboek van Strafrecht BES, met dien verstande dat voor de toepassing van het Wetboek van Strafrecht BES
      onder ambtenaar mede wordt begrepen degene die ten dienste van een vreemde staat een openbaar ambt bekleedt.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel1
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '1'
        paragraaf: '1'
  - number: 16c
    text: |-
      In afwijking van [artikel 1, derde lid][ref1], hebben de uitdrukkingen samenspanning en zwaar lichamelijk letsel in
      deze wet dezelfde betekenis als in het Wetboek van Strafrecht BES.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel1
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '1'
        paragraaf: '1'
  - number: 16d
    text: |-
      Voor de toepassing van [artikel 8][ref1] wordt onder de middelen waarvan in het tweede lid, onder a en b, wordt
      gesproken, verstaan de middelen, bedoeld in artikel 49, eerste lid, onder 2°, van het Wetboek van Strafrecht BES.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel8
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '8'
        paragraaf: '2'
  - number: 16e
    text: |-
      In [artikel 13][ref1] wordt in plaats van de tweede volzin gelezen: Artikel 78 van het Wetboek van Strafrecht BES
      is op die misdrijven niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel13
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '13'
        paragraaf: '4'
  - number: 16f
    text: |-
      Voor de toepassing van [artikel 14][ref1] wordt in plaats van «het in
      [artikel 28 vermelde recht, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref2] vermelde recht» gelezen:
      het recht, bedoeld in artikel 32, van het Wetboek van Strafrecht BES.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 16g
    text: |-
      In afwijking van [artikel 15][ref1] neemt het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba
      kennis van de misdrijven omschreven in deze wet, voor zover het feit is begaan binnen het rechtsgebied
      van Bonaire, Sint Eustatius en Saba, en behoudens de bevoegdheid van de rechter, aangewezen bij de
      [Wet militaire strafrechtspraak][ref2]. De behandeling vindt plaats door een meervoudige kamer, bestaande uit een
      lid van het Gemeenschappelijk Hof en twee rechters in de rechtbank Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004789
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004789
  - number: '19'
    text: |-
      De [Uitvoeringswet genocideverdrag][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002453
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002453
  - number: '20'
    text: |-
      De [Uitvoeringswet folteringverdrag][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004409
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004409
  - number: '21.1'
    text: |-
      Wanneer op het tijdstip van inwerkingtreding van deze wet ter zake van genocide, foltering of een misdrijf dat
      overeenkomt met een misdrijf als omschreven in de [artikelen 5][ref1], [6][ref2][of 7 van deze wet][ref3],
      overeenkomstig het oude recht reeds vervolging is ingesteld bij een andere rechter dan bedoeld in
      [artikel 15 van deze wet][ref4], wordt de zaak bij dezelfde rechter voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015252#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0015252#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0015252#Artikel15
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015252
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015252
        artikel: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0015252
        artikel: '15'
        paragraaf: '4'
  - number: '21.2'
    text: |-
      [Artikel 13][ref1] is mede van toepassing op feiten, strafbaar gesteld in de [Uitvoeringswet folteringverdrag][ref2]
      en gepleegd voor het tijdstip van inwerkingtreding van deze wet, tenzij het feit op dat tijdstip reeds is verjaard.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004409
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '13'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004409
  - number: '21.3'
    text: |-
      [Artikel 16g][ref1] is mede van toepassing op feiten, ter uitvoering van het Verdrag tegen foltering en
      andere wrede, onmenselijke of onterende behandeling of bestraffing ( *Trb.* 1985, 69) strafbaar gesteld
      op grond van de Nederlands-Antilliaanse strafwet en gepleegd voor het tijdstip van transitie bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2], tenzij het feit
      op dat tijdstip reeds is verjaard.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel16g
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel1
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: 16g
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '1'
  - number: '21.4'
    text: |-
      [Artikel 2][ref1] is van toepassing op het misdrijf genocide dat is begaan op of na 24 oktober 1970.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel2
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015252
        artikel: '2'
        paragraaf: '1'
  - number: 21a
    text: |-
      In geval van strafvervolging voor een van de in deze wet, de [Uitvoeringswet folteringverdrag][ref1], de
      [Uitvoeringswet genocideverdrag][ref2], dan wel de [Wet oorlogsstrafrecht][ref3] omschreven misdrijven begaan
      voor 1 april 1995, zijn de bepalingen van het [Wetboek van Strafvordering][ref4] betreffende het slachtoffer en de
      benadeelde partij van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004409
      [ref2]: https://wetten.overheid.nl/BWBR0002453
      [ref3]: https://wetten.overheid.nl/BWBR0002099
      [ref4]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0004409
      - id: ref2
        bwb_id: BWBR0002453
      - id: ref3
        bwb_id: BWBR0002099
      - id: ref4
        bwb_id: BWBR0001903
  - number: '22'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Wet internationale misdrijven.'
    url: https://wetten.overheid.nl/BWBR0015252/2019-12-13#Artikel23
