        artikel: '4'
  - number: '3'
    text: |-
      1 De voorzitter kan de erkenning van het fokprogramma als bedoeld in [artikel 4, eerste lid, onder c][ref1],
      verlenen en intrekken.

      2 De bevoegdheden, bedoeld in het eerste lid, worden niet uitgeoefend dan nadat de voorzitter daarover advies heeft
      ingewonnen.

      3 De advisering van de voorzitter wordt opgedragen aan de commissie.

      4 De commissie, bedoeld in het derde lid, wordt door het bestuur bij besluit ingesteld. Dit besluit regelt
      de samenstelling en werkwijze van de commissie. Het besluit wordt gepubliceerd in het Verordeningenblad
      Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017472#Artikel4
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017472
        artikel: '4'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 De aanvraag van de erkenning van het fokprogramma wordt ingediend bij de voorzitter en dient vergezeld te gaan
      van ten minste de volgende gegevens:

      a. naam ras of stamboek;

      b. ras (niet zijnde een erkend stamboek) van de schapen of naam van het stamboek;

      c. datum verlening erkenning van het stamboek (indien van toepassing);

      d. aantal ingeschreven schapen;

      e. aantal ingeschreven rammen;

      f. aantal ingeschreven ooien;

      g. de frequentie ARR-allelen in de totale populatie;

      h. de frequentie van ARR/ARR rammen;

      i. de frequentie van ARR/x rammen;

      j. het gewenste selectieregime voor het komende dekseizoen;

      k. individuele identificatienummers en de bijhorende genotypen/resultaten van de genotyperingstesten;

      l. de afstamming van de vijf voorafgaande generaties van de totale populatie.

      2 De frequentie, bedoeld in het eerste lid, aanhef en onder sub g tot en met i, kan bepaald worden aan de hand van
      een representatieve steekproef binnen de populatie.

      3 Een steekproef is representatief indien de steekproef over minimaal 10% van de rammen met een minimum van 100
      rammen wordt getrokken.

      4 Een of meerdere gegevens kunnen door middel van een geautomatiseerd gegevensbestand worden aangeleverd.

      5 Het bestuur kan ten behoeve van de aanvraag een formulier vaststellen.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: '5'
    text: |-
      1 Aanvragen dienen zo vroeg mogelijk, maar uiterlijk op 1 juni van het jaar voorafgaande aan de termijn waarop de
      aanvraag betrekking heeft, te zijn ontvangen door de voorzitter.

      2 De voorzitter stelt de aanvraag terstond ter hand aan de commissie.

      3 De commissie informeert het ras of stamboek schriftelijk omtrent de datum van binnenkomst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel5
  - number: '6'
    text: |-
      1 Indien aan de commissie bij de aanvraag onvoldoende gegevens ter beschikking worden gesteld, wordt door de
      commissie hiervan onverwijld schriftelijk mededeling gedaan aan het ras of stamboek.

      2 Het ras of stamboek wordt binnen een door de commissie te stellen termijn van maximaal 4 weken in de gelegenheid
      gesteld om de ontbrekende gegevens beschikbaar te stellen.

      3 De commissie informeert het stamboek schriftelijk omtrent de datum van binnenkomst van de op grond van het eerste
      lid verlangde gegevens.

      4 Indien niet dan wel niet volledig binnen de door de commissie gestelde termijn, als bedoeld in het tweede
      lid, wordt voldaan, wordt het ras of stamboek binnen maximaal 4 weken na het verstrijken van de termijn niet-
      ontvankelijk in zijn aanvraag verklaard.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel6
  - number: '7'
    text: |-
      De commissie brengt binnen maximaal 16 weken na ontvangst van de aanvraag, haar advies uit aan de voorzitter,
      waarna binnen maximaal 1 maand een besluit wordt genomen door de voorzitter inzake de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel7
  - number: '8'
    text: |-
      De in de aanvraag opgenomen gegevens worden opgeslagen in een daartoe bestemde databank, welke databank door de
      voorzitter daartoe wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel8
  - number: '9'
    text: |-
