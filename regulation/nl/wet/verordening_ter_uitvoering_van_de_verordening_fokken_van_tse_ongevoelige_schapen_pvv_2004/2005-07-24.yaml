$id: verordening_ter_uitvoering_van_de_verordening_fokken_van_tse_ongevoelige_schapen_pvv_2004
regulatory_layer: WET
publication_date: '2007-09-14'
valid_from: '2005-07-24'
bwb_id: BWBR0017472
url: https://wetten.overheid.nl/BWBR0017472/2005-07-24
preamble:
  text: |-
    Gelet op artikel 8 van de Regeling aanvullende voorschriften besmettelijke dierziekten, de artikelen 96, 97, 98 van
    de Wet op de bedrijfsorganisatie en artikel 4, tweede lid, van de Verordening fokken van TSE-ongevoelige schapen
    (PVV) 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening neemt over de begripsbepalingen van de
      [Verordening fokken van TSE-ongevoelige schapen (PVV) 2004][ref1] en verstaat voorts onder:








                  1.


                  de verordening


                  :


                  de [Verordening fokken van TSE-ongevoelige schapen (PVV) 2004][ref2];




                  2.


                  commissie


                  :


                  de Adviescommissie fokprogramma ter verkrijging van resistentie tegen TSE's bij schapen.


      [ref1]: https://wetten.overheid.nl/BWBR0017171
      [ref2]: https://wetten.overheid.nl/BWBR0017171
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017171
      - id: ref2
        bwb_id: BWBR0017171
  - number: '2.1'
    text: |-
      Een fokprogramma als bedoeld in [artikel 4, eerste lid, onder c, van de verordening][ref1] wordt erkend
      indien voldoende bekend is over de populatie en het inteeltpercentage zodat voldaan kan worden aan de volgende
      voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel4
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '4'
  - number: 2.1.a
    text: |-
      Bij een populatiegrootte van 4000 of meer ooien dient het fokprogramma een mild selectieregime te hanteren indien
      er minder dan 1% ARR/ARR rammen zijn, onderscheidenlijk een matig selectieregime indien er 1 tot en met 10% ARR/ARR
      rammen zijn dan wel een streng selectieregime indien er meer dan 10% ARR/ARR rammen zijn, of
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
  - number: 2.1.b
    text: |-
      Bij een populatiegrootte van 750 tot 4000 ooien dient het fokprogramma een mild selectieregime te hanteren indien
      er minder dan 5% ARR/ARR rammen zijn, onderscheidenlijk een matig selectieregime indien er 5 tot en met 50% ARR/ARR
      rammen zijn dan wel en een streng selectieregime indien er meer dan 50% ARR/ARR rammen zijn, of
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
  - number: 2.1.c
    text: |-
      Bij een populatiegrootte van minder dan 750 ooien dient het fokprogramma een mild selectieregime te hanteren indien
      er minder dan 10% ARR/ARR rammen zijn, onderscheidenlijk een matig selectieregime indien er 10 tot en met 80% ARR/
      ARR rammen zijn dan wel een streng selectieregime indien er meer dan 80% ARR/ARR rammen zijn.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
  - number: 2.2.a
    text: |-
      Onder een streng selectieregime als bedoeld in het eerste lid wordt bedoeld: het inzetten van uitsluitend ARR/
      ARR rammen.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
  - number: 2.2.b
    text: |-
      Onder een matig selectieregime als bedoeld in het eerste lid wordt bedoeld: het inzetten van vooral ARR/ARR rammen,
      maar als het aantal ooien per ram te hoog wordt, mogen ook ARR/-rammen worden ingezet. Met rammen met een of meer
      VRQ-allelen mag niet gedekt worden
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
  - number: 2.2.c
    text: |-
      Onder een mild selectieregime als bedoeld in het eerste lid wordt bedoeld: het inzetten van zowel ARR/ARR rammen,
      ARR/-rammen, alsmede het inzetten van rammen zonder ARR-allelen. Met rammen met een of meer VRQ-allelen mag niet
      worden gedekt.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
  - number: '2.3'
    text: De erkenning wordt ingetrokken indien blijkt dat niet langer aan de voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
  - number: '3.1'
    text: |-
      De voorzitter kan de erkenning van het fokprogramma als bedoeld in [artikel 4, eerste lid, onder c][ref1], verlenen
      en intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017472#Artikel4
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017472
        artikel: '4'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De bevoegdheden, bedoeld in het eerste lid, worden niet uitgeoefend dan nadat de voorzitter daarover advies heeft
      ingewonnen.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel3
  - number: '3.3'
    text: De advisering van de voorzitter wordt opgedragen aan de commissie.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel3
  - number: '3.4'
    text: |-
      De commissie, bedoeld in het derde lid, wordt door het bestuur bij besluit ingesteld. Dit besluit regelt
      de samenstelling en werkwijze van de commissie. Het besluit wordt gepubliceerd in het Verordeningenblad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel3
  - number: '4.1'
    text: |-
      De aanvraag van de erkenning van het fokprogramma wordt ingediend bij de voorzitter en dient vergezeld te gaan van
      ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.a
    text: naam ras of stamboek;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.b
    text: ras (niet zijnde een erkend stamboek) van de schapen of naam van het stamboek;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.c
    text: datum verlening erkenning van het stamboek (indien van toepassing);
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.d
    text: aantal ingeschreven schapen;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.e
    text: aantal ingeschreven rammen;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.f
    text: aantal ingeschreven ooien;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.g
    text: de frequentie ARR-allelen in de totale populatie;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.h
    text: de frequentie van ARR/ARR rammen;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.i
    text: de frequentie van ARR/x rammen;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.j
    text: het gewenste selectieregime voor het komende dekseizoen;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.k
    text: individuele identificatienummers en de bijhorende genotypen/resultaten van de genotyperingstesten;
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: 4.1.l
    text: de afstamming van de vijf voorafgaande generaties van de totale populatie.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: '4.2'
    text: |-
      De frequentie, bedoeld in het eerste lid, aanhef en onder sub g tot en met i, kan bepaald worden aan de hand van
      een representatieve steekproef binnen de populatie.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: '4.3'
    text: |-
      Een steekproef is representatief indien de steekproef over minimaal 10% van de rammen met een minimum van 100
      rammen wordt getrokken.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: '4.4'
    text: Een of meerdere gegevens kunnen door middel van een geautomatiseerd gegevensbestand worden aangeleverd.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: '4.5'
    text: Het bestuur kan ten behoeve van de aanvraag een formulier vaststellen.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel4
  - number: '5.1'
    text: |-
      Aanvragen dienen zo vroeg mogelijk, maar uiterlijk op 1 juni van het jaar voorafgaande aan de termijn waarop de
      aanvraag betrekking heeft, te zijn ontvangen door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel5
  - number: '5.2'
    text: De voorzitter stelt de aanvraag terstond ter hand aan de commissie.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel5
  - number: '5.3'
    text: De commissie informeert het ras of stamboek schriftelijk omtrent de datum van binnenkomst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel5
  - number: '6.1'
    text: |-
      Indien aan de commissie bij de aanvraag onvoldoende gegevens ter beschikking worden gesteld, wordt door de
      commissie hiervan onverwijld schriftelijk mededeling gedaan aan het ras of stamboek.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel6
  - number: '6.2'
    text: |-
      Het ras of stamboek wordt binnen een door de commissie te stellen termijn van maximaal 4 weken in de gelegenheid
      gesteld om de ontbrekende gegevens beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel6
  - number: '6.3'
    text: |-
      De commissie informeert het stamboek schriftelijk omtrent de datum van binnenkomst van de op grond van het eerste
      lid verlangde gegevens.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel6
  - number: '6.4'
    text: |-
      Indien niet dan wel niet volledig binnen de door de commissie gestelde termijn, als bedoeld in het tweede
      lid, wordt voldaan, wordt het ras of stamboek binnen maximaal 4 weken na het verstrijken van de termijn niet-
      ontvankelijk in zijn aanvraag verklaard.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel6
  - number: '7'
    text: |-
      De commissie brengt binnen maximaal 16 weken na ontvangst van de aanvraag, haar advies uit aan de voorzitter,
      waarna binnen maximaal 1 maand een besluit wordt genomen door de voorzitter inzake de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel7
  - number: '8'
    text: |-
      De in de aanvraag opgenomen gegevens worden opgeslagen in een daartoe bestemde databank, welke databank door de
      voorzitter daartoe wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel8
  - number: '9.1'
    text: |-
      Deze verordening wordt aangehaald als: Verordening ter uitvoering van de Verordening fokken van TSE-ongevoelige
      schapen (PVV) 2004.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel9
  - number: '9.2'
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na de dagtekening van het Verordeningenblad
      Bedrijfsorganisatie waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel9
