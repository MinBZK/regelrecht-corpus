articles:
  - number: '1'
    text: |-
      Deze verordening neemt over de begripsbepalingen van de
      [Verordening fokken van TSE-ongevoelige schapen (PVV) 2004][ref1] en verstaat voorts onder:










                  1.


                  de verordening


                  :


                  de [Verordening fokken van TSE-ongevoelige schapen (PVV) 2004][ref2];




                  2.


                  commissie


                  :


                  de Adviescommissie fokprogramma ter verkrijging van resistentie tegen TSE's bij schapen.


      [ref1]: https://wetten.overheid.nl/BWBR0017171
      [ref2]: https://wetten.overheid.nl/BWBR0017171
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017171
      - id: ref2
        bwb_id: BWBR0017171
  - number: '2'
    text: |-
      1 Een fokprogramma als bedoeld in [artikel 4, eerste lid, onder c, van de verordening][ref1] wordt erkend
      indien voldoende bekend is over de populatie en het inteeltpercentage zodat voldaan kan worden aan de volgende
      voorwaarden:

      a. Bij een populatiegrootte van 4000 of meer ooien dient het fokprogramma een mild selectieregime te hanteren
      indien er minder dan 1% ARR/ARR rammen zijn, onderscheidenlijk een matig selectieregime indien er 1 tot en met 10%
      ARR/ARR rammen zijn dan wel een streng selectieregime indien er meer dan 10% ARR/ARR rammen zijn, of

      b. Bij een populatiegrootte van 750 tot 4000 ooien dient het fokprogramma een mild selectieregime te hanteren
      indien er minder dan 5% ARR/ARR rammen zijn, onderscheidenlijk een matig selectieregime indien er 5 tot en met 50%
      ARR/ARR rammen zijn dan wel en een streng selectieregime indien er meer dan 50% ARR/ARR rammen zijn, of

      c. Bij een populatiegrootte van minder dan 750 ooien dient het fokprogramma een mild selectieregime te hanteren
      indien er minder dan 10% ARR/ARR rammen zijn, onderscheidenlijk een matig selectieregime indien er 10 tot en met
      80% ARR/ARR rammen zijn dan wel een streng selectieregime indien er meer dan 80% ARR/ARR rammen zijn.

      2 a. Onder een streng selectieregime als bedoeld in het eerste lid wordt bedoeld: het inzetten van uitsluitend ARR/
      ARR rammen.

      b. Onder een matig selectieregime als bedoeld in het eerste lid wordt bedoeld: het inzetten van vooral ARR/ARR
      rammen, maar als het aantal ooien per ram te hoog wordt, mogen ook ARR/-rammen worden ingezet. Met rammen met een
      of meer VRQ-allelen mag niet gedekt worden

      c. Onder een mild selectieregime als bedoeld in het eerste lid wordt bedoeld: het inzetten van zowel ARR/ARR
      rammen, ARR/-rammen, alsmede het inzetten van rammen zonder ARR-allelen. Met rammen met een of meer VRQ-allelen mag
      niet worden gedekt.

      3 De erkenning wordt ingetrokken indien blijkt dat niet langer aan de voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel4
    url: https://wetten.overheid.nl/BWBR0017472/2005-07-24#Artikel2
