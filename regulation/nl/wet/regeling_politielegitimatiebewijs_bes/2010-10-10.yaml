articles:
  - number: '1'
    text: |-
      Tijdens de uitoefening van de dienst dragen de volgende ambtenaren van politie een politielegitimatiebewijs volgens
      het door onze Minister vastgesteld model bij zich:

      a. de ambtenaar van politie, bedoeld in [artikel 3, onder a en c, van de Rijkswet][ref1], die werkzaam is bij het
      politiekorps, met uitzondering van de aspirant voor de duur dat hij geen praktijkstage volgt;

      b. de door de korpsbeheerder politie aangewezen ambtenaren als bedoeld in
      [artikel 3, onder b, van de Rijkswet][ref2], die over opsporingsbevoegdheid beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '3'
  - number: '2'
    text: De Staat is eigenaar van het politielegitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel2
  - number: '3'
    text: |-
      De korpsbeheerder politie draagt zorg voor een behoorlijk toezicht op de bewaring van het te verstrekken
      politielegitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 De korpsbeheerder politie draagt er zorg voor dat het politielegitimatiebewijs voor de uitreiking wordt
      geprepareerd op de wijze zoals door onze minister vastgesteld.

      2 De korpsbeheerder politie reikt het politielegitimatiebewijs na ondertekening uit aan de ambtenaar, bedoeld in
      [artikel 1][ref1].

      3 De korpsbeheerder politie registreert de uitgifte van het politielegitimatiebewijs waarbij de naam van de
      ambtenaar, bedoeld in [artikel 1][ref2], en het uitgiftenummer worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028800#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028800#Artikel1
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028800
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028800
        artikel: '1'
        paragraaf: '1'
  - number: '5'
    text: |-
      De ambtenaar, bedoeld in [artikel 1][ref1], meldt vermissing, ontvreemding en geheel of gedeeltelijk tenietgaan van
      zijn politielegitimatiebewijs terstond aan de korpsbeheerder politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028800#Artikel1
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028800
        artikel: '1'
        paragraaf: '1'
  - number: '6'
    text: |-
      1 Bij overlijden of beëindiging van het dienstverband van de ambtenaar, bedoeld in [artikel 1][ref1], of bij
      vervanging van het politielegitimatiebewijs neemt de korpsbeheerder politie het politielegitimatiebewijs in.

      2 De korpsbeheerder politie draagt zorg voor vernietiging van het ingenomen politielegitimatiebewijs.

      3 De korpsbeheerder politie haalt de registratie van de uitgifte, bedoeld in [artikel 4, derde lid][ref2], door.


      [ref1]: https://wetten.overheid.nl/BWBR0028800#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028800#Artikel4
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel6
    references:
      - id: ref1
