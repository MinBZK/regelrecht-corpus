        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028800
        artikel: '4'
        paragraaf: '1'
  - number: '7'
    text: |-
      Het legitimatiebewijs Korps politie, verstrekt op basis van de in de voormalige Nederlandse Antillen geldende
      Landsverordening van de 25ste september 1961 nopens de beëdiging en legitimatie van opsporingsambtenaren wordt
      uiterlijk 4 maanden na inwerkingtreding van deze regeling ingeleverd bij en vernietigd door de korpsbeheerder
      politie en behoudt tot het moment dat het is ingeleverd, maar uiterlijk 4 maanden na inwerkingtreding van deze
      regeling, zijn geldigheid.
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van het tijdstip waarop het [Besluit beheer politiekorps BES][ref1]
      in werking treedt. Indien de Staatscourant waarin deze regeling wordt geplaatst, wordt uitgeven na dat tijdstip,
      treedt deze regeling in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt zij terug tot het in de eerste volzin bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028780
    url: https://wetten.overheid.nl/BWBR0028800/2010-10-10#Artikel8
    references:
