    text: |-
      1 Na de inwerkingtreding van deze wet berust het
      [Besluit aanwijzing registraties gezamenlijke huishouding 1998][ref1] mede op
      [artikel 2, vijfde lid, van deze wet][ref2].

      2 Na de inwerkingtreding van deze wet berust het [Besluit extramurale vrijheidsbeneming en sociale zekerheid][ref3]
      mede op [artikel 10, derde lid, van deze wet][ref4].

      3 Na de inwerkingtreding van deze wet berust het
      [Besluit gelijkstelling vreemdelingen WWB, Ioaw, Ioaz, Wvg en WIK][ref5] mede op
      [artikel 10, tweede lid, van deze wet][ref6].


