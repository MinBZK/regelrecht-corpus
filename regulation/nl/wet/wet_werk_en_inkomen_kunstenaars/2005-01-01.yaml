  - number: '76'
    text: |-
      Op een aanvraag tot het verlenen van uitkering wordt beslist met toepassing van:

      a. de [Wet inkomensvoorziening kunstenaars][ref1], indien het recht op bijstand ingaat vóór of op de dag
      voorafgaand aan de inwerkingtreding van deze wet;

      b. deze wet, indien het recht op uitkering ingaat na de dag voorafgaand aan de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel13
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel76
