  - number: '12'
    text: De uitkering wordt per kalendermaand om niet verleend en betaald en per kalenderjaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel12
  - number: '13'
    text: |-
      1 Indien voor de kunstenaar, bedoeld in [artikel 9][ref1], recht op uitkering bestaat, heeft die uitkering,
      in afwijking van [artikel 12][ref2], de vorm van een geldlening onder verband van hypotheek of verpanding
      voorzover het vermogen gebonden in de woning met bijbehorend erf hoger is dan het vermogen, bedoeld in
      [artikel 7, tweede lid, onderdeel e][ref3].

      2 De uitkering in de vorm van een geldlening onder verband van hypotheek of verpanding, bedoeld in het eerste lid,
      wordt verleend tot een bedrag gelijk aan het vermogen, bedoeld in [artikel 7, tweede lid, onderdeel e][ref4].

      3 Indien de uitkering wordt verleend in de vorm van een geldlening onder verband van hypotheek of verpanding
      komen de kosten verbonden aan de taxatie van de waarde van de woning, de hypotheekakte en de inschrijving van
      de hypotheek of verpanding, alsmede de bijkomende kosten, ten laste van de kunstenaar. Voor deze kosten kan het
      college een uitkering verlenen die begrepen wordt onder de geldlening onder verband van hypotheek of verpanding.

      4 Indien na beëindiging van uitkering onder verband van hypotheek of verpanding opnieuw recht op uitkering bestaat,
      wordt deze verleend met toepassing van de laatst gevestigde hypotheek of verpanding.

      5 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de vaststelling van de waarde van de
      woning met bijbehorend erf en de voorwaarden waaronder uitkering in de vorm van een geldlening onder verband van
      hypotheek of verpanding wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel9
