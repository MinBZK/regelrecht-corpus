preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, ter vereenvoudiging en verduidelijking van de regelgeving alsmede
    ter bevordering van de zelfstandige bestaansvoorziening van de kunstenaar gewenst is te komen tot een nieuwe Wet
    werk en inkomen kunstenaars;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. college: het college van burgemeester en wethouders van een gemeente als bedoeld in [artikel 23][ref1];

      c. adviserende instelling: de instelling, bedoeld in [artikel 35][ref2];

      d. Inlichtingenbureau: het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      e. kunstenaar: degene die hier te lande werkzaam is in een beroep of bedrijf in een al dan niet gemengde
      beroepspraktijk ter uitoefening van de scheppende, uitvoerende of toegepaste kunst;

      f. gemengde beroepspraktijk: een beroepspraktijk waarin het inkomen wordt verworven uit werkzaamheden die zijn
      gerelateerd aan een beroep of bedrijf ter uitoefening van de scheppende, uitvoerende of toegepaste kunst en uit
      werkzaamheden die niet zijn gerelateerd aan een dergelijk beroep of bedrijf;

      g. beroepskosten: de noodzakelijke kosten ter verwerving van het inkomen als kunstenaar;

      h. kinderbijslag: kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel23
