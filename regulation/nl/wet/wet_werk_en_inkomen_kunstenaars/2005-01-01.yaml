  - number: '77'
    text: |-
      Als het vermogen dat vanaf de uitkeringsverlening niet in aanmerking is genomen, bedoeld in
      [artikel 7, vierde lid, van deze wet][ref1], van de kunstenaar of zijn gezin aan wie op de dag voorafgaand aan de
      inwerkingtreding van deze wet uitkering werd verleend, geldt het bedrag zoals dat laatstelijk vóór of op de dag
      voorafgaand aan de inwerkingtreding van deze wet door het college is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel7
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel77
