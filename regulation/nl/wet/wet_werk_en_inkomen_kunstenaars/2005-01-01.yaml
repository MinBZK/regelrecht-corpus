      1 Onder inkomen wordt verstaan de op grond van [artikel 4][ref1] in aanmerking genomen middelen voorzover deze:

      a. betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, inkomsten uit verhuur, onderverhuur of
      het hebben van een of meer kostgangers, socialezekerheidsuitkeringen, uitkeringen tot levensonderhoud op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref2], dan wel naar hun aard met deze inkomsten en uitkeringen overeenkomen, en

      b. betrekking hebben op het kalenderjaar waarover beroep op uitkering wordt gedaan.

      2 Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar het kalenderjaar waarin
      deze zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in
      aanmerking genomen naar het kalenderjaar waarin deze te gelde kunnen worden gemaakt.

      3 Indien de echtgenoot van de kunstenaar verkeert in een situatie als bedoeld in [artikel 10][ref3], wordt
      zijn inkomen slechts in aanmerking genomen voorzover het inkomen van de gehuwden tezamen, met inbegrip van de
      uitkering die zou worden verleend indien zijn inkomen niet in aanmerking wordt genomen, meer zou bedragen dan het
      overeenkomstige bedrag, bedoeld in [artikel 8][ref4]. Op de vaststelling van het inkomen van de niet-rechthebbende
      echtgenoot is deze paragraaf van overeenkomstige toepassing.

      4 In afwijking van het derde lid wordt, indien de gehuwden gescheiden leven, doch niet duurzaam gescheiden, het
      inkomen van de niet-rechthebbende echtgenoot slechts in aanmerking genomen voorzover deze het overeenkomstige
      bedrag, bedoeld in [artikel 8][ref5], te boven gaat.


