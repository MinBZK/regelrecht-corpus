      1 Indien inkomen in natura in aanmerking wordt genomen wordt de waarde daarvan vastgesteld op het daarvoor door de
      kunstenaar of zijn gezin opgeofferde bedrag.

      2 Het inkomen uit studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt in aanmerking
      genomen naar het normbedrag voor levensonderhoud waarnaar deze is berekend, met dien verstande dat het normbedrag
      voor levensonderhoud, bedoeld in [artikel 3.2 van die wet][ref2], wordt gesteld op:

      a. voor een thuisinwonende studerende: € 271,06  per kalendermaand;

      b. voor een uitwonende studerende: € 486,94  per kalendermaand.

      3 De tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3] wordt in aanmerking genomen naar
      het normbedrag voor de basistoelage, bedoeld in [artikel 4.3 van die wet][ref4].


