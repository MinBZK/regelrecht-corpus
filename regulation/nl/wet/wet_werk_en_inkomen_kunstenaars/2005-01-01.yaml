      De [Wet inkomensvoorziening kunstenaars][ref1] en de [artikelen III][ref2] en [IV van de Wet van 5 juli 2000][ref3]
      (Stb. 299) tot wijziging van de Wet inkomensvoorziening kunstenaars teneinde kunstenaars met een eigen woning niet
      langer van een beroep op de Wet inkomensvoorziening kunstenaars uit te sluiten worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009344
