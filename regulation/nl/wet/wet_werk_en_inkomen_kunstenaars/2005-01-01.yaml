  - number: '42'
    text: |-
      Het college is verplicht, indien het bij de uitvoering van deze wet het gegronde vermoeden krijgt van een misdrijf
      dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale verzekeringswetten of
      van een Nederlands of buitenlands overheidsorgaan, voorzover dit is belast met het verrichten van uitkeringen, het
      doen van verstrekkingen dan wel het heffen van bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel42
  - number: '43'
    text: |-
      1 Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet aan
      de hieronder vermelde instanties kosteloos de gegevens te verstrekken:

      a. de Centrale organisatie voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen
      en de Sociale verzekeringsbank, genoemd in respectievelijk de [hoofdstukken 4][ref2], [5][ref3], en
      [6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      b. de belastingdienst voor de heffing of invordering van enige rijksbelasting of premies volksverzekeringen;

      c. het college van andere gemeenten voor de uitvoering van deze wet, de [Wet werk en bijstand][ref5],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7];

      d. het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref8], het
      College van toezicht op de zorgverzekeringen, genoemd in [artikel 1u van de Ziekenfondswet][ref9],
      en de ziekenfondsen, de ziektekostenverzekeraars en de uitvoeringsorganen, bedoeld in
      [artikel 4 van de Algemene Wet Bijzondere Ziektekosten][ref10], voor de uitvoering van de [Ziekenfondswet][ref11]
      en de [Algemene Wet Bijzondere Ziektekosten][ref12];

      e. derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;

      f. buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;

      g. bestuursorganen van de Nederlandse Antillen en Aruba voor de vervulling van een taak van zwaarwegend algemeen
      belang;

      h. de adviserende instelling die in het kader van de uitvoering van deze wet het college van advies dient.

      2 De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      kunstenaar of zijn gezin daardoor onevenredig wordt geschaad.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de
      wijze waarop in ieder geval gegevens dienen te worden verstrekt.

      4 Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het eerste lid worden aangewezen ten
      behoeve waarvan de verplichtingen, bedoeld in het eerste lid, eveneens gelden.


