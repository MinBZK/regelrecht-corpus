  - number: '11'
    text: |-
      1 Onverminderd de [artikelen 8][ref1], [10][ref2], [19][ref3], [25][ref4] en [26][ref5], wordt het recht op
      uitkering beëindigd, indien de kunstenaar:

      a. of zijn gezin over in aanmerking te nemen vermogen is komen te beschikken of over een in aanmerking te nemen
      inkomen gelijk aan of hoger dan het voor hem geldende bedrag, bedoeld in [artikel 8, onderdeel a][ref6];

      b. niet kan aantonen alleen of samen met zijn echtgenoot met werkzaamheden volgens bij algemene
      maatregel van bestuur nader te bepalen voorwaarden in ieder geval gedurende de periode, bedoeld in
      [artikel 19, eerste en tweede lid][ref7], over de periode van twaalf kalendermaanden onmiddellijk voorafgaand
      aan respectievelijk de dertiende uitkeringsmaand € 2.800,00, de vijfentwintigste uitkeringsmaand € 4.400,00 en de
      zevenendertigste uitkeringsmaand € 6.000,00 te hebben verworven;

      c. niet kan aantonen in enig jaar als kunstenaar werkzaam te zijn geweest op grond van bij algemene maatregel van
      bestuur te bepalen voorwaarden;

      d. of zijn echtgenoot daarom verzoekt.

      2 Het college onderzoekt regelmatig of de omstandigheden, bedoeld in het eerste lid, onderdelen a, b of c, zich
      voordoen.

      3 Onze Minister kan, na overleg met Onze Minister van Onderwijs, Cultuur en Wetenschap, bij ministeriële regeling
      regels stellen omtrent de regelmaat waarmee onderzoeken als bedoeld in het tweede lid plaatsvinden en het tijdstip
      van beëindiging van de uitkering indien een omstandigheid als bedoeld in het eerste lid, onderdelen b en c, zich
      voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel8
