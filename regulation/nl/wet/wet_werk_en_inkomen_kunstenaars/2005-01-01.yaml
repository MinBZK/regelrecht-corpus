  - number: '25'
    text: |-
      1 Indien de kunstenaar of zijn echtgenoot de voor de verlening van de uitkering van belang zijnde gegevens of de
      gevorderde bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel
      indien de kunstenaar of zijn echtgenoot anderszins onvoldoende medewerking verleent aan het onderzoek, schort het
      college het recht op uitkering voor de duur van ten hoogste acht weken op:

      a. vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of

      b. vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.

      2 Indien bij de beoordeling van het recht op een uitkering blijkt dat het door de kunstenaar verstrekte adres van
      hemzelf of van zijn echtgenoot afwijkt van het adres waaronder de betrokkene in de gemeentelijke basisadministratie
      persoonsgegevens staat ingeschreven, schort het college het recht op een uitkering op.

      3 Geen opschorting vindt plaats indien:

      a. de afwijking van de adresgegevens redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van
      de uitkering;

      b. de kunstenaar of zijn echtgenoot van de afwijking redelijkerwijs geen verwijt kan worden gemaakt, of

      c. daarvoor naar het oordeel van het college dringende redenen aanwezig zijn.

      4 Het college doet schriftelijk mededeling van de opschorting, bedoeld in het eerste en tweede lid, aan de
      kunstenaar en stelt hem daarbij in de gelegenheid binnen een door hem te stellen termijn het verzuim of de
      afwijking te herstellen.

      5 De opschorting wordt beëindigd zodra het college gebleken is dat de afwijking niet meer bestaat. Indien de
      afwijking ook na de krachtens het vierde lid gestelde termijn nog bestaat, herziet het college het besluit tot
      toekenning van de uitkering of trekt zij dit in met ingang van de eerste dag waarover het recht op een uitkering
      is opgeschort.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel25
  - number: '26'
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herziet het college een dergelijk besluit of trekt hij dat
      in:

      a. indien een gedraging als bedoeld in [artikel 22, eerste lid][ref1], of het niet of niet behoorlijk nakomen van
      een daar bedoelde verplichting heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;

      b. indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend.

      2 Als de kunstenaar of zijn echtgenoot in het geval, bedoeld in [artikel 25, eerste lid][ref2], het verzuim niet
      herstelt binnen de daarvoor gestelde termijn, trekt het college na het verstrijken van deze termijn het besluit tot
      toekenning van uitkering in met ingang van de eerste dag waarover het recht op uitkering is opgeschort.

      3 Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten geheel of gedeeltelijk van herziening
      of intrekking af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel25
