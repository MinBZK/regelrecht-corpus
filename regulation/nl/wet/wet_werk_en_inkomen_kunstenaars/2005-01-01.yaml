    text: |-
      1 Door het college op grond van de [Wet inkomensvoorziening kunstenaars][ref1] genomen besluiten gelden als door
      hem genomen besluiten op grond van deze wet.

      2 Onverminderd [artikel 77][ref2] brengt het college de in het eerste lid bedoelde besluiten binnen 12 maanden na
      inwerkingtreding van deze wet in overeenstemming met deze wet, voorzover deze besluiten afwijken van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel13
