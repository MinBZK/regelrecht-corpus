  - number: '16'
    text: |-
      1 Uiterlijk in het kalenderjaar volgend op het kalenderjaar waarin uitkering is verleend en binnen acht weken nadat
      de kunstenaar de benodigde gegevens heeft verstrekt, wordt de uitkering, bedoeld in [artikel 15][ref1], definitief
      vastgesteld.

      2 Bij de definitieve vaststelling van de hoogte van de uitkering wordt van het volgende uitgegaan:

      a. over de periode in het kalenderjaar waarin geen uitkering is ontvangen wordt niet in aanmerking genomen
      het bruto-inkomen tot een maximum per maand van het in [artikel 8, onderdeel a][ref2], genoemde van toepassing
      zijnde bedrag, vermeerderd met de voor die periode verschuldigde premies voor een ziektekostenverzekering voor de
      kunstenaar of zijn gezin;

      b. het na toepassing van onderdeel a overblijvende meerinkomen wordt in aanmerking genomen over de periode waarin
      in het betreffende kalenderjaar uitkering is verleend, voorzover dat tezamen met het van toepassing zijnde bedrag,
      genoemd in [artikel 15, eerste lid][ref3], over deze periode per maand meer bedraagt dan:

      1°. € 1.355,98  voor een alleenstaande;

      2°. € 1.673,05  voor een alleenstaande ouder;

      3°. € 1.871,42  voor gehuwden.

      3 In afwijking van het eerste en tweede lid en [artikel 5, eerste lid, onderdeel b][ref4], wordt bij een
      kunstenaar wiens uitkering is beëindigd in verband met het bereiken van de maximale uitkeringsduur op grond van
      [artikel 19][ref5], het inkomen van de kunstenaar of zijn gezin slechts in aanmerking genomen over de periode van
      het kalenderjaar voorafgaand aan het tijdstip met ingang waarop de uitkering is beëindigd, voorzover dat inkomen
      tezamen met het van toepassing zijnde bedrag, genoemd in [artikel 15, eerste lid][ref6], over deze periode per
      kalendermaand meer bedraagt dan het van toepassing zijnde bedrag, genoemd in het tweede lid, onderdeel b.

      4 Indien het bedrag van de voorlopig verleende uitkering, bedoeld in [artikel 15][ref7]:

      a. lager is dan de definitief vastgestelde hoogte van de uitkering, wordt voor het verschil ambtshalve uitkering
      verleend;

      b. hoger is dan de definitief vastgestelde hoogte van de uitkering, wordt het bedrag dat hoger is dan de definitief
      vastgestelde uitkering teruggevorderd met toepassing van [artikel 28][ref8].


