  - number: '46'
    text: |-
      1 Het college dient jaarlijks bij Onze Minister een verslag in over de uitvoering van deze wet. Het verslag omvat
      mede een opgave van de door het college gemaakte kosten, bedoeld in [artikel 48][ref1], en is voorzien van een
      verklaring van de accountant belast met de in [artikel 213 van de Gemeentewet][ref2] voorgeschreven controle
      omtrent de getrouwheid van de verstrekte gegevens en de rechtmatigheid van de uitvoering van de wet, alsmede van
      een oordeel van de gemeenteraad over de uitvoering van de wet.

      2 Bij ministeriële regeling worden regels gesteld inzake het verslag en over de verklaring en het onderzoek dat
      resulteert in deze verklaring.

      3 Het verslag en de opgave, bedoeld in het eerste lid, worden door het college kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel44
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel46
