  - number: '79'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap, binnen vijf jaar na
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel79
  - number: '80'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld. In het koninklijk besluit wordt zo nodig toepassing gegeven
      aan [artikel 16 van de Tijdelijke referendumwet][ref1].


