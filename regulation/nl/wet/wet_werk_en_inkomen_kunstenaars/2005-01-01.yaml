  - number: '24'
    text: |-
      1 Indien door het college is vastgesteld dat recht op uitkering bestaat, wordt de uitkering toegekend vanaf de dag
      waarop dit recht is ontstaan, voorzover deze dag niet ligt voor de dag waarop de kunstenaar zich heeft gemeld om
      een uitkering aan te vragen.

      2 Indien de kunstenaar de aanvraag niet zo spoedig mogelijk indient nadat hij zich heeft gemeld en hem dit te
      verwijten valt, kan het college, in afwijking van het eerste lid, besluiten dat de uitkering wordt toegekend vanaf
      de dag dat de aanvraag is ingediend.

      3 Het college stelt het recht op uitkering niet eerder vast dan nadat het college uit het onderzoek,
      bedoeld in [artikel 19, derde lid][ref1], is gebleken dat recht op uitkering bestaat als bedoeld in
      [artikel 19, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel19
