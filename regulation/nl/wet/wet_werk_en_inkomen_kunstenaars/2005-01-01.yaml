  - number: '74'
    text: |-
      1 De [Wet inkomensvoorziening kunstenaars][ref1] blijft van toepassing op de definitieve vaststelling van de
      uitkering, bedoeld in [artikel 10 van die wet][ref2], over het jaar voorafgaand aan de inwerkingtreding van deze
      wet.

      2 De termijnen, bedoeld in [artikel 13 van de Wet inkomensvoorziening kunstenaars][ref3] blijven van toepassing op
      de uitkering, bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009344
