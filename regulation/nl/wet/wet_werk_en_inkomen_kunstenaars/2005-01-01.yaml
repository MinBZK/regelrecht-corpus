  - number: '8'
    text: |-
      De kunstenaar heeft recht op uitkering indien hij, of voorzover van toepassing zijn gezin:

      a. niet over in aanmerking te nemen vermogen beschikt en het in aanmerking te nemen inkomen per maand:

      1°. van een alleenstaande lager is dan € 1.024,10 ;

      2°. van een alleenstaande ouder lager is dan € 1.207,43 ;

      3°. van gehuwden lager is dan € 1.349,13 , en

      b. gedurende een bij algemene maatregel van bestuur te bepalen periode als kunstenaar werkzaam is geweest volgens
      bij die algemene maatregel van bestuur te bepalen voorwaarden en in die periode met die werkzaamheden een bij die
      algemene maatregel van bestuur te bepalen bruto-inkomen heeft verworven, of

      c. de aanvraag op grond van deze wet heeft ingediend binnen 12 maanden nadat hij met goed gevolg een opleiding
      op het gebied van de kunst, een voortgezette opleiding op het gebied van de kunst, of een voortgezette opleiding
      bouwkunst als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] heeft voltooid,
      voorzover deze opleiding gericht is op de uitoefening van het kunstenaarschap, dan wel een daarmee vergelijkbare,
      door Onze Minister van Onderwijs, Cultuur en Wetenschap bij ministeriële regeling aan te wijzen, opleiding heeft
      voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0008573
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel8
    references:
      - id: ref1
