  - number: '23'
    text: |-
      1 Het recht op uitkering bestaat jegens het college van een daartoe bij algemene maatregel van bestuur aan te
      wijzen gemeente waartoe de kunstenaar, gelet op zijn woonplaats als bedoeld in de [artikelen 10, eerste lid][ref1],
      en [11 van het Boek 1 van het Burgerlijk Wetboek][ref2], behoort.

      2 De aanvraag wordt ingediend bij het college.

      3 Indien de kunstenaar gehuwd is, wordt de aanvraag door de echtgenoten gezamenlijk ingediend, dan wel door een van
      hen met schriftelijke toestemming van de ander.

      4 Het college stelt het recht op uitkering op aanvraag vast.

      5 Het college besluit, gehoord de adviserende instelling, of:

      a. de aanvraag is ingediend door een kunstenaar, en of aan de eisen, bedoeld in
      [artikel 8, onderdelen b en c][ref3], voldaan wordt, of

      b. de uitkering moet worden beëindigd om de reden, bedoeld in [artikel 11, eerste lid, aanhef en onderdeel c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0017837#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0017837#Artikel11
