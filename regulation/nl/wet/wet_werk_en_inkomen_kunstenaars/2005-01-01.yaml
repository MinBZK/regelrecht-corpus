        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '29'
    text: |-
      1 Het college vordert de kosten van de uitkering terug, voorzover de uitkering:

      a. ten onrechte of tot een te hoog bedrag is verleend;

      b. ingevolge [artikel 14][ref1] bij wijze van een voorschot is verleend en na onderzoek is vastgesteld dat over de
      betrokken periode geen recht op een uitkering bestaat;

      c. anderzijds onverschuldigd is betaald voorzover de kunstenaar dit redelijkerwijs had kunnen begrijpen, of

      d. anderszins onverschuldigd is betaald, waaronder begrepen dat de kunstenaar of zijn gezin naderhand met
      betrekking tot het kalenderjaar waarover uitkering is verleend, over in aanmerking te nemen middelen als bedoeld
      in [paragraaf 1.2][ref2] beschikt of kan beschikken, voorzover deze middelen bij de definitieve vaststelling op
      grond van [artikel 16][ref3] zouden hebben geleid tot terugvordering van uitkering, indien op het moment van deze
      definitieve vaststelling al over deze middelen zou zijn beschikt.

      2 Terugvordering als bedoeld in het eerste lid, onderdeel c, vindt niet plaats, indien de betreffende kosten zijn
      gemaakt meer dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.

      3 Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de wettelijke rente en de op de
      terugvordering betrekking hebbende kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0017837#Artikel16
