      1 Met ingang van de dag waarop de som wijzigt van de budgetten voor levensonderhoud, genoemd in
      [artikel 3.2, eerste lid, onderdeel a, van de Wet studiefinanciering 2000][ref1] en het bedrag dat op grond
      van [artikel 3.29, eerste lid, van die wet][ref2] wordt verstrekt aan een studerende die ten onrechte over een
