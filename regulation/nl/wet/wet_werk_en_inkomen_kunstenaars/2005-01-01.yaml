  - number: '50'
    text: |-
      1 Onze Minister stelt de vergoeding van de kosten, bedoeld in [artikel 48][ref1], vast binnen een jaar na ontvangst
      van de kostenopgave, bedoeld in [artikel 46, eerste lid][ref2].

      2 Indien de kostenopgave niet is ontvangen binnen 18 maanden na het kalenderjaar waarop deze betrekking heeft dan
      wel niet is voorzien van de verklaring, bedoeld in [artikel 46, eerste lid][ref3], wordt de vergoeding, bedoeld in
      het eerste lid, over dat jaar ambtshalve vastgesteld.

      3 De vergoeding voor de kosten, bedoeld in [artikel 48, eerste lid, onderdeel a][ref4], wordt verlaagd indien:

      a. het een uitkering betreft die is verleend in strijd met het bij en krachtens deze wet bepaalde;

      b. het een uitkering betreft die niet of niet volledig overeenkomstig [hoofdstuk 4][ref5], is of wordt
      teruggevorderd;

      c. niet is voldaan aan de bij [artikel 22][ref6] gestelde regels, voor een bedrag gelijk aan het bedrag waarmee
      de kosten zouden zijn verlaagd indien het college op een juiste wijze toepassing zouden hebben gegeven aan deze
      artikelen.

      4 Indien als gevolg van het niet hebben voldaan door het college aan de bij de [artikelen 11, tweede lid][ref7],
      of [19, derde lid][ref8], gestelde regels, niet kan worden vastgesteld of en voor welk bedrag de vergoeding
      voor de kosten, bedoeld in [artikel 48, eerste lid, onderdeel a][ref9], moet worden verlaagd, wordt volgens bij
      ministeriële regeling te stellen regels hiervoor een bedrag vastgesteld.

      5 Het derde en vierde lid zijn niet van toepassing voor zover naar het oordeel van Onze Minister:

      a. de tekortkomingen van bijzondere aard of geringe betekenis zijn;

      b. het college zich voldoende heeft ingespannen om de tekortkomingen op te heffen.

      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing van het derde
      lid.


