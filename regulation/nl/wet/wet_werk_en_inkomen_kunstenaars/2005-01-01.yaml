  - number: '35'
    text: |-
      1 Onze Minister wijst één adviserende instelling aan die tot taak heeft het college van advies te dienen of:

      a. de aanvraag is ingediend door een kunstenaar en of aan de eisen, bedoeld in de
      [artikel 8, onderdelen b en c][ref1], is voldaan;

      b. de uitkering moet worden beëindigd om de reden, bedoeld in [artikel 11, eerste lid, aanhef en onderdeel c][ref2];

      c. het aanbieden van een voorziening als bedoeld in [artikel 21][ref3] noodzakelijk is;

      d. verblijf in het buitenland als bedoeld in [artikel 10, vierde lid][ref4], noodzakelijk is in verband met de
      beroepsuitoefening als kunstenaar.

      2 De adviserende instelling is een rechtspersoon met volledige rechtsbevoegdheid, die

      blijkens haar statuten tot doel heeft of mede tot doel heeft taken als bedoeld in het eerste lid te vervullen.

      3 Aan een aanwijzing kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel8
