  - number: '30'
    text: |-
      Het college vordert de kosten van de uitkering over het voorgaande kalenderjaar terug,
      voorzover de kunstenaar of zijn echtgenoot niet voldoet aan de verplichting, bedoeld in
      [artikel 20, derde of vierde lid, laatste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel20
