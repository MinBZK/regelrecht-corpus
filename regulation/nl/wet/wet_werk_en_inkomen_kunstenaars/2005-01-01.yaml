  - number: '34'
    text: |-
      1 Een besluit tot terugvordering van kosten van uitkering vermeldt hetgeen teruggevorderd wordt, de termijn of
      termijnen waarbinnen moet worden betaald, alsmede de wijze waarop het besluit, bij gebreke van tijdige betaling,
      ten uitvoer wordt gelegd.

      2 De kunstenaar van wie kosten van uitkering worden teruggevorderd is verplicht desgevraagd aan het college de
      inlichtingen te verstrekken die voor terugvordering ingevolge dit hoofdstuk van belang zijn.

      3 Een besluit tot terugvordering van kosten van uitkering als bedoeld in dit hoofdstuk levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].

      4 Op het executoriaal beslag ingevolge het derde lid op loon, sociale uitkeringen of andere
      periodieke betalingen, welke derden verschuldigd zijn of worden aan degene van wie kosten van
      uitkering worden teruggevorderd, zijn de [artikelen 479b tot en met 479g][ref2], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] van overeenkomstige toepassing.
      De in [artikel 479g][ref4] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      het college.

      5 Terugvordering van kosten van uitkering als bedoeld in dit hoofdstuk is bevoorrecht en volgt onmiddellijk na de
      vorderingen in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref5] omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
