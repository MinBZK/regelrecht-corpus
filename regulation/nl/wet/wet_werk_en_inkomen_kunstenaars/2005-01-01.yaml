  - number: '18'
    text: |-
      1 Met ingang van de dag waarop het netto minimumloon wijzigt, worden de brutonormen en bedragen, genoemd in de
      [artikelen 8, onderdeel a][ref1], [15][ref2] en [16][ref3] herzien.

      2 Onder netto minimumloon wordt verstaan het minimumloon per maand, genoemd in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref4], verhoogd met de
      aanspraak op vakantiebijslag waarop een werknemer op grond van [artikel 15 van die wet][ref5] over dat minimumloon
      ten minste aanspraak kan maken, na aftrek van de daarvan in te houden loonbelasting, premies volksverzekeringen,
      premies werknemersverzekeringen en het werknemersaandeel in de ziekenfondspremie.

      3 De in het tweede lid bedoelde loonbelasting en premies volksverzekeringen worden berekend voor een werknemer,
      jonger dan 65 jaar, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref6], over het minimumloon en de aanspraak op vakantiebijslag
      daarover, vermeerderd met het werkgeversaandeel in de ziekenfondspremie en verminderd met de premies
      werknemersverzekeringen. De loonbelasting en de premies volksverzekeringen in te houden van de aanspraak op
      vakantiebijslag over het minimumloon, worden berekend met toepassing van de tabel voor bijzondere beloningen waarin
      de arbeidskorting, bedoeld in [artikel 22a van de Wet op de loonbelasting 1964][ref7], niet is verwerkt.

      4 Indien ingevolge een van de socialeverzekeringswetten een premie wordt ingehouden waarvan het percentage
      per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij
      ministeriële regeling voor de toepassing van het tweede lid een gemiddeld percentage vastgesteld.

      5 Bij de vaststelling van de brutonormen en bedragen, bedoeld in het eerste lid, is ten aanzien van
      de verschuldigde loonheffing rekening gehouden met de algemene heffingskorting, alsmede met de door de
      uitkeringsgerechtigde verschuldigde premie op grond van de [Ziekenfondswet][ref8] en de vereveningsbijdrage.
      Met betrekking tot de brutonormen en bedragen, genoemd in [artikel 8, onderdeel a, onder 2°, derde lid][ref9],
      [15, eerste lid, onderdeel a][ref10], en [16, tweede lid, onderdeel b, onder 2°][ref11], is tevens rekening
      gehouden met de alleenstaande ouderkorting.

      6 De vereveningsbijdrage, bedoeld in het vijfde lid, is gelijk aan het bedrag van de premie die een werkgever op
      grond van de [Werkloosheidswet][ref12] op het overeengekomen loon van een werknemer, die is verzekerd op grond van
      deze wet, inhoudt.

      7 Van de herziene normen en van de dag waarop de herziening plaatsvindt, wordt door Onze Minister mededeling gedaan
      in de Staatscourant.


