  - number: '31'
    text: |-
      1 In afwijking van de [artikelen 16, vierde lid, onderdeel b][ref1], [29][ref2] en [30][ref3] kan het college,
      ambtshalve of op verzoek van de kunstenaar, besluiten gedeeltelijk van terugvordering af te zien of gedeeltelijk
      van verdere terugvordering af te zien, indien:

      a. redelijkerwijs te voorzien is dat de kunstenaar of zijn gezin niet zal kunnen voortgaan met het betalen van zijn
      schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen,
      en

      c. de terugvordering door het college ten minste zal worden voldaan naar evenredigheid met de vorderingen van de
      schuldeisers van gelijke rang.

      2 Het eerste lid is niet van toepassing ten aanzien van:

      a. terugvordering als gevolg van verwijtbaar gedrag van de kunstenaar;

      b. vorderingen welke door hypotheek of verpanding op een zaak of zaken zijn gedekt, behoudens voorzover zij niet op
      die zaken verhaald kunnen worden.

      3 Het besluit tot gedeeltelijk afzien van terugvordering of tot gedeeltelijk afzien van verdere terugvordering
      treedt niet in werking voordat een schuldregeling overeenkomstig het eerste lid tot stand is gekomen.

      4 Het besluit tot gedeeltelijk afzien van terugvordering of gedeeltelijk afzien van verdere terugvordering wordt
      ingetrokken of ten nadele van de kunstenaar gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling is tot stand gekomen die
      voldoet aan de eisen, bedoeld in het eerste lid;

      b. de kunstenaar of zijn echtgenoot de schuld aan het college niet overeenkomstig de schuldregeling voldoet, of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      5 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0017837#Artikel30
