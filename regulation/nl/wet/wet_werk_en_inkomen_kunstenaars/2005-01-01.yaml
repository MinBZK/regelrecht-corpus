  - number: '27'
    text: |-
      1 De uitkering is niet vatbaar voor vervreemding of verpanding.

      2 Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.

      3 Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel27
  - number: '28'
    text: |-
      Kosten van de uitkering worden door het college teruggevorderd in de gevallen en naar de regels, bedoeld in dit
      hoofdstuk, en in de gevallen, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel16
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel28
