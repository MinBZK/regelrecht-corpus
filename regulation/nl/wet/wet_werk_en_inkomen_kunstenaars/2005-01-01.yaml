  - number: '41'
    text: |-
      1 Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet
      over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering
      van deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.

      2 Het in het eerste lid vervatte verbod is niet van toepassing indien:

      a. enig wettelijk voorschrift tot bekendmaking verplicht;

      b. degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;

      c. de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.

      3 Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voorzover de persoonlijke levenssfeer van de kunstenaar of zijn gezin daardoor niet onevenredig wordt geschaad.

      4 Degene die op grond van de [artikelen 39 tot en met 44][ref1] gegevens verstrekt dient na te gaan of degene aan
      wie de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel39
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel41
