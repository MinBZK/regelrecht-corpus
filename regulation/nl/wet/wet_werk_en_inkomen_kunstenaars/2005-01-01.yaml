  - number: '39'
    text: |-
      1 Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en
      inlichtingen te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze
      wet ten opzichte van de kunstenaar of zijn echtgenoot te wiens behoeve uitkering is gevraagd of wordt verleend en
      die in zijn dienst dan wel te zijnen behoeve werkt of heeft gewerkt. De verplichting strekt zich mede uit tot de
      inkomsten van de kunstenaar of zijn echtgenoot van wie kosten van uitkering ingevolge hoofdstuk 4 worden of kunnen
      worden teruggevorderd.

      2 De opgaven en inlichtingen worden desgevraagd schriftelijk of in een andere vorm die redelijkerwijs kan worden
      verlangd binnen een door het college schriftelijk te stellen termijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel39
  - number: '40'
    text: |-
      1 De hieronder vermelde instanties zijn verplicht desgevraagd aan het college, kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet:

      a. het college van andere gemeenten;

      b. de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en
      de Sociale Verzekeringsbank, genoemd in respectievelijk de [hoofdstukken 4][ref1], [5][ref2], en
      [6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      c. de belastingdienst;

      d. het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref4], het
      College van toezicht op de zorgverzekeringen, genoemd in [artikel 1u van de Ziekenfondswet][ref5],
      de ziekenfondsen, de ziektekostenverzekeraars en de uitvoeringsorganen, bedoeld in
      [artikel 4 van de Algemene Wet Bijzondere Ziektekosten][ref6];

      e. de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen, stichtingen tot uitvoering van een
      regeling inzake vervroegd uittreden en andere organen belast met het doen van uitkeringen of verstrekkingen die in
      het kader van deze wet als inkomen worden aangemerkt;

      f. de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 1996][ref7] vastgestelde vergoeding;

      g. de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref8];

      h. de Informatie Beheer Groep betreffende de toepassing van de [Wet studiefinanciering 2000][ref9],
      de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref10], en de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11];

      i. Onze Minister van Justitie voorzover het betreft de kunstenaar of een lid van zijn gezin die rechtens zijn
      vrijheid is ontnomen;

      j. de adviserende instelling die in het kader van de uitvoering van deze wet het college van advies dient;

      k. de instanties en personen die woonruimte verhuren;

      l. de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;

      m. derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen.

      2 Het vragen door het college en het verstrekken door de in het eerste lid bedoelde instanties van de in het
      eerste lid bedoelde opgaven en inlichtingen geschiedt in bij of krachtens algemene maatregel van bestuur te bepalen
      gevallen door tussenkomst van het Inlichtingenbureau. Het Inlichtingenbureau voert ten behoeve van de verwerking
      van deze opgaven en inlichtingen een administratie.

      3 Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college,
      kosteloos alle gegevens en uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken
      die noodzakelijk zijn voor de uitvoering van deze wet.

      4 De in het eerste en het derde lid bedoelde verplichtingen strekken zich mede uit tot degene:

      a. van wie kosten van uitkering worden of kunnen worden teruggevorderd ingevolge [hoofdstuk 4][ref12];

      b. die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:

      1°. te wiens behoeve een uitkering is gevraagd of wordt verleend;

      2°. van wie kosten van een uitkering worden of kunnen worden teruggevorderd ingevolge [hoofdstuk 4][ref13].

      5 De in het eerste lid en het derde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.

      6 De in het eerste lid, onderdelen a tot en met j, genoemde instanties treffen desgevraagd met het college en met
      het Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      opgaven en inlichtingen.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het tweede lid en de inhoud
      en vormgeving van de in het zesde lid bedoelde regelingen.

      8 Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het tweede lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.

      9 Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het derde
      lid worden aangewezen voor wie de verplichtingen, bedoeld in het eerste lid tot en met zevende lid, eveneens
      gelden, voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen
      inlichtingen en opgaven.

      10 Bij de algemene maatregel van bestuur, bedoeld in het negende lid, kan tevens worden bepaald dat de daar
      bedoelde verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.

      11 Onze Minister van Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is ontnomen,
      onverwijld en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen, die van invloed kunnen
      zijn op het recht op uitkering, aan het college, door tussenkomst van het Inlichtingenbureau, waarbij hij gebruik
      kan maken van het sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
