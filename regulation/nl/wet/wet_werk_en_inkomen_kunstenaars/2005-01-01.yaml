  - number: '44'
    text: |-
      1 In de administratie van de gemeente, de adviserende instelling en het Inlichtingenbureau terzake van
      de uitvoering van deze wet wordt het sociaal-fiscaalnummer opgenomen waaronder een natuurlijke persoon is
      geregistreerd bij de belastingdienst.

      2 Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in de [artikelen 40][ref1] en
      [43][ref2] bedoelde instanties wordt, indien daartoe bevoegd, gebruik gemaakt van dit sociaal-fiscaalnummer. Derden
      die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen gebruiken
      het sociaal-fiscaalnummer slechts voorzover dat noodzakelijk is voor het verrichten van werkzaamheden die in het
      kader van de voorzieningen, bedoeld in [artikel 21, eerste lid][ref3], worden uitgevoerd.

      3 Ten behoeve van het gebruik van het sociaal-fiscaalnummer in de in het eerste lid bedoelde administratie kent
      Onze Minister van Financiën, in overeenstemming met Onze Minister, aan de kunstenaar die een uitkering ontvangt
      en die niet reeds ten behoeve van de belastingheffing bij de belastingdienst is geregistreerd, een sociaal-
      fiscaalnummer toe.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0017837#Artikel21
