  - number: '22'
    text: |-
      1 Het college weigert de uitkering tijdelijk geheel of gedeeltelijk, indien de kunstenaar:

      a. blijk heeft gegeven van een tekortschietend besef van verantwoordelijkheid voor de voorziening in het bestaan,
      waaronder begrepen het zich jegens het college zeer ernstig misdragen;

      b. een verplichting als bedoeld in [artikel 20, eerste lid, tweede lid, onderdelen a, b, c en d, of derde lid][ref1],
      niet of niet behoorlijk is nagekomen, of

      c. een verplichting als bedoeld in [artikel 20, tweede lid, onderdelen c en e, of derde lid][ref2], niet binnen de
      daarvoor door het college vastgestelde termijn is nagekomen;

      d. of zijn echtgenoot de verplichting, bedoeld in [artikel 20, vierde lid][ref3], niet of niet behoorlijk is
      nagekomen;

      e. of zijn echtgenoot de verplichting, bedoeld in [artikel 20, vierde lid][ref4], met uitzondering van de
      verplichting, bedoeld in [artikel 20, tweede lid, onderdeel d][ref5], niet binnen de daarvoor door het college
      vastgestelde termijn is nagekomen.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging, de mate waarin
      de kunstenaar of zijn echtgenoot de gedraging verweten kan worden en de omstandigheden waarin de kunstenaar
      of zijn gezin verkeert. Van het opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van
      verwijtbaarheid ontbreekt.

      3 Indien het niet tijdig nakomen van de verplichting, bedoeld in
      [artikel 20, tweede lid, onderdeel c, en derde lid][ref6], niet heeft geleid tot het ten onrechte of tot een te
      hoog bedrag verlenen van uitkering, kan het college afzien van het opleggen van een maatregel als bedoeld in het
      eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van
      de verplichting, tenzij het niet tijdig nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te
      rekenen vanaf de datum waarop eerder een zodanige waarschuwing is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten af te zien van het opleggen van een
      maatregel als bedoeld in het eerste lid.

      5 Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en tweede lid nadere regels worden
      gesteld.


