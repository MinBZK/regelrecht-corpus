  - number: '7'
    text: |-
      1 Onder vermogen wordt verstaan:

      a. de waarde van de bezittingen waarover de kunstenaar of zijn gezin beschikt of redelijkerwijs kan beschikken bij
      aanvang van de uitkering, verminderd met de aanwezige schulden. De waarde van de bezittingen wordt vastgesteld op
      de waarde in het economische verkeer bij vrije oplevering;

      b. middelen die worden ontvangen in de periode waarover uitkering is toegekend, voorzover deze geen inkomen
      betreffen als bedoeld in de [artikelen 5][ref1] of [6][ref2].

      2 Niet als vermogen wordt in aanmerking genomen:

      a. vermogen noodzakelijk voor de uitoefening van het beroep van kunstenaar;

      b. bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van de kunstenaar of zijn gezin, noodzakelijk zijn;

      c. het bij de aanvang van de uitkering aanwezige vermogen, voorzover dit minder bedraagt dan de van toepassing
      zijnde vermogensgrens, bedoeld in het derde lid;

      d. spaargelden opgebouwd tijdens de periode waarin uitkering wordt ontvangen;

      e. het vermogen gebonden in de woning met bijbehorend erf, bedoeld in [artikel 9, eerste lid][ref3], voorzover dit
      minder bedraagt dan € 42.000,00 ;

      f. vergoedingen voor immateriële schade als bedoeld in [artikel 4, tweede lid, onderdelen i en j][ref4].

      3 De in het tweede lid, onderdeel c, bedoelde vermogensgrens is:

      a. voor een alleenstaande: € 4.975,00 ;

      b. voor een alleenstaande ouder: € 9.950,00 ;

      c. voor de gehuwden tezamen: € 9.950,00 .

      4 Het tweede lid is van overeenkomstige toepassing op bezittingen die worden verworven in de periode waarover
      uitkering is toegekend en op middelen als bedoeld in het eerste lid, onderdeel b, met dien verstande dat de van
      toepassing zijnde vermogensgrens, bedoeld in het derde lid, daarbij wordt verminderd met het vermogen dat:

      a. bij aanvang van de uitkering niet in aanmerking is genomen op grond van het tweede lid, onderdeel c;

      b. tijdens de uitkering niet in aanmerking is genomen op grond van dit lid.

      5 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het tweede lid, onderdeel a.


