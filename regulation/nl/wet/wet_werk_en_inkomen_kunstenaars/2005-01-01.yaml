  - number: '49'
    text: |-
      1 Onze Minister verleent voorschotten op de vergoeding, bedoeld in [artikel 48, eerste lid][ref1].

      2 Voorzover de uitvoering van deze wet door het college ernstige tekortkomingen vertoont, kan Onze Minister
      besluiten de voorschotten lager vast te stellen dan uit de krachtens het derde lid gestelde regels zou
      voortvloeien.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het verlenen van voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel48
