  - number: '14'
    text: |-
      1 Het college is bevoegd om, indien de noodzaak daartoe aannemelijk is, zonder voorafgaand onderzoek naar de
      voorwaarden voor het recht op uitkering als bedoeld in [artikel 8][ref1], bij wijze van voorschot uitkering te
      verlenen. De uitkering die bij wijze van voorschot wordt verleend, heeft de vorm van een renteloze geldlening.

      2 Een in het eerste lid bedoeld voorschot kan worden verleend zolang het college nog geen besluit inzake de
      verlening van uitkering heeft bekendgemaakt.

      3 Indien een uitkering wordt verleend over een periode waarover met toepassing van het eerste lid een of meer
      voorschotten is verleend, kan deze uitkering zonder machtiging van de kunstenaar worden verrekend met het voorschot
      of de voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel8
