  - number: '47'
    text: |-
      1 Het college, de gemeenteraad en de adviserende instelling verstrekken desgevraagd aan Onze Minister de
      inlichtingen die hij voor het toezicht, de statistiek, de informatievoorziening en de beleidsvorming met betrekking
      tot deze wet nodig heeft.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het college, de
      gemeenteraad en de adviserende instelling de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken.

      3 De inlichtingen, bedoeld in het eerste lid, worden door het college kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel47
  - number: '48'
    text: |-
      1 Onze Minister vergoedt ten laste van ’s Rijks kas:

      a. de kosten van uitkeringen, alsmede de ziekenfondspremie die daarover verschuldigd is, voorzover de uitkering
      niet bij wijze van voorschot op grond van [artikel 14][ref1] is verleend;

      b. de door het college gemaakte uitvoeringskosten.

      2 Het college declareert de in een kalenderjaar gemaakte kosten door middel van een kostenopgave over dat jaar.

      3 Bij ministeriële regeling worden regels gesteld inzake:

      a. de vergoeding van gemaakte uitvoeringskosten;

      b. de wijze en het tijdstip van declareren, alsmede de daarbij door het college nader te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel14
