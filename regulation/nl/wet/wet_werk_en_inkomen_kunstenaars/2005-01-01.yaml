  - number: '45'
    text: |-
      1 Onze Minister houdt toezicht op:

      a. de rechtmatigheid van de uitvoering van deze wet door het college;

      b. de doeltreffendheid van deze wet.

      2 Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.

      3 Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan het college, nadat het gedurende acht weken in de gelegenheid is gesteld zijn zienswijze naar
      voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele gevallen.
      In een aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft
      gebracht met deze aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
