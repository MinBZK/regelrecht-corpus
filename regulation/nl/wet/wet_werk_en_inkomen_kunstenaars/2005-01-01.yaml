  - number: '3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. alleenstaande: de ongehuwde kunstenaar die geen tot zijn last komende kinderen heeft en geen gezamenlijke
      huishouding voert met een ander, tenzij het betreft een bloedverwant in de eerste graad of een bloedverwant in de
      tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is van zorgbehoefte;

      b. alleenstaande ouder: de ongehuwde kunstenaar die de volledige zorg heeft voor een of meer tot zijn last komende
      kinderen en geen gezamenlijke huishouding voert met een ander, tenzij het betreft een bloedverwant in de eerste
      graad of een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is
      van zorgbehoefte;

      c. gezin:

      1°. de kunstenaar en zijn echtgenoot tezamen;

      2°. de kunstenaar, zijn echtgenoot en de tot hun last komende minderjarige kinderen tezamen;

      3°. de alleenstaande ouder met de tot zijn last komende kinderen;

      d. kind: het in Nederland woonachtige eigen kind of stiefkind;

      e. ten laste komend kind: het kind jonger dan 18 jaar voor wie de alleenstaande ouder of de gehuwde aanspraak op
      kinderbijslag kan maken.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de kunstenaar of zijn gezin
      beschikt of redelijkerwijs kan beschikken. Tot de middelen worden mede gerekend de middelen die ten behoeve van het
      levensonderhoud van de kunstenaar of zijn gezin door een niet in de uitkering begrepen persoon worden ontvangen.

      2 Niet tot de middelen van de kunstenaar of zijn gezin worden gerekend:

      a. de middelen die deze ontvangt ten behoeve van het levensonderhoud van een niet in de uitkering begrepen persoon;

      b. kinderbijslag ontvangen ten behoeve van zijn in of buiten Nederland woonachtige kinderen;

      c. huursubsidie ontvangen op grond van de [Huursubsidiewet][ref1], of een bijzondere bijdrage in de huurlasten
      ontvangen op grond van [artikel 26b van die wet][ref2];

      d. een eigenwoningbijdrage of een bijzondere bijdrage ontvangen op grond van de
      [Wet bevordering eigenwoningbezit][ref3];

      e. elke vermindering of teruggave van loonbelasting of inkomstenbelasting en van premies volksverzekeringen;

      f. vrije vergoedingen en vrije verstrekkingen als bedoeld in
      [Hoofdstuk IIA van de Wet op de loonbelasting 1964][ref4], voorzover deze meer bedragen dan de beroepskosten,
      bedoeld in [artikel 17][ref5];

      g. inkomsten uit arbeid van de tot zijn last komende kinderen, alsmede door hen ontvangen werkloosheids- en
      arbeidsongeschiktheidsuitkeringen;

      h. rente ontvangen over op grond van [artikel 7, tweede lid, onderdelen c en d][ref6], niet in aanmerking genomen
      vermogen en spaargelden;

      i. bij ministeriële regeling aan te wijzen uitkeringen en vergoedingen voor materiële en immateriële schade;

      j. giften en andere dan de in onderdeel i bedoelde vergoedingen voor materiële en immateriële schade, voorzover
      deze naar het oordeel van het college uit een oogpunt van de verlening van de uitkering verantwoord zijn.


