      1 Onze Minister regelt in een besluit tot intrekking van de aanwijzing, bedoeld in [artikel 36][ref1], zo nodig de
      gevolgen van die intrekking.

      2 Een besluit tot aanwijzing of tot intrekking van de aanwijzing bepaalt de dag waarop de aanwijzing,
      onderscheidenlijk de intrekking ingaat. Het besluit wordt in de Staatscourant geplaatst.


