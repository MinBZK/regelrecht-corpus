  - number: '15'
    text: |-
      1 De uitkering bedraagt per kalendermaand voor:

      a. een alleenstaande: € 648,04 ;

      b. een alleenstaande ouder: € 828,31 ;

      c. gehuwden: € 954,73 .

      2 Indien de echtgenoot van de kunstenaar in een omstandigheid verkeert als bedoeld in
      [artikel 10, eerste lid, onderdelen a, b of c][ref1], wordt de hoogte van de uitkering vastgesteld op het bedrag
      voor een alleenstaande of alleenstaande ouder.

      3 Vooruitlopend op de definitieve vaststelling van de hoogte van de uitkering, bedoeld in [artikel 16][ref2], kan
      op de uitkering het inkomen van de kunstenaar of zijn gezin in mindering worden gebracht, voorzover de som van
      het bedrag, genoemd in het eerste lid, en het inkomen in een kalendermaand waarin recht op uitkering bestaat, meer
      bedraagt dan het bedrag genoemd in [artikel 16, tweede lid, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel16
