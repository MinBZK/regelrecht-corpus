      1 Onze Minister trekt de aanwijzing van de adviserende instelling in, indien de instelling:

      a. daarom verzoekt;

      b. tot ontbinding besluit;

      c. in staat van faillissement wordt verklaard.

      2 Onze Minister kan de aanwijzing van de adviserende instelling intrekken, indien de instelling:

      a. haar taak niet naar behoren heeft vervuld;

      b. haar statuten heeft gewijzigd zonder voorafgaande goedkeuring van Onze Minister;

      c. heeft gehandeld in strijd met haar statuten of de voorschriften, bedoeld in [artikel 35, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel35
