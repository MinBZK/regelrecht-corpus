  - number: '78'
    text: |-
      Op een bezwaar- en beroepschrift dat:

      a. vóór of op de dag voorafgaand aan de inwerkingtreding van deze wet is ingediend tegen een door het college
      op grond van de [Wet inkomensvoorziening kunstenaars][ref1] genomen besluit en waarop op die datum nog niet
      onherroepelijk is beslist;

      b. na de dag voorafgaand aan de inwerkingtreding van deze wet is ingediend en betrekking heeft op
      uitkeringsverlening waarop ingevolge [artikel 72][ref2] de [Wet inkomensvoorziening kunstenaars][ref3] van
      toepassing is;

      wordt beslist met toepassing van de [Wet inkomensvoorziening kunstenaars][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel13
