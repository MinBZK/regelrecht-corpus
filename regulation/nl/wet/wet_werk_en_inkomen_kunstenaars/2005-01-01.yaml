    text: |-
      [Artikel 8 van de Wet inkomensvoorziening kunstenaars][ref1] blijft van toepassing op de uitkering die op de dag
      voorafgaand aan de inwerkingtreding van deze wet werd verleend met toepassing van genoemd artikel.


