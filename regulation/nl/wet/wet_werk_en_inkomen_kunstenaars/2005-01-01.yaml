  - number: '9'
    text: |-
      1 De kunstenaar die eigenaar is van een door hemzelf of zijn gezin bewoonde woning met bijbehorend erf, of die
      woonachtig is in een woning met bijbehorend erf waarvan zijn echtgenoot eigenaar is, heeft recht op uitkering
      voorzover tegeldemaking, bezwaring of verdere bezwaring van het in de woning met bijbehorend erf gebonden vermogen
      in redelijkheid niet kan worden verlangd.

      2 In deze wet en de daarop berustende bepalingen wordt onder een woning mede verstaan een woonwagen of een
      woonschip.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel9
  - number: '10'
    text: |-
      1 Geen recht op uitkering heeft de kunstenaar die:

      a. buiten Nederland zijn woonplaats heeft of die in Nederland zijn woonplaats heeft doch die per kalenderjaar
      langer dan vier weken verblijf houdt buiten Nederland, dan wel een aaneengesloten periode van langer dan vier weken
      verblijf houdt buiten Nederland;

      b. niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1];

      c. rechtens zijn vrijheid ontnomen is;

      d. de eerste dag van de maand waarin hij de leeftijd van 65 jaar heeft bereikt;

      e. onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref2] of die gehuwd
      is met een zodanig persoon, voorzover diens gebrek aan middelen daarvan het gevolg is, tenzij de kunstenaar
      alleenstaande ouder is en hij verlof geniet als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref3].

      2 Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan
      die bedoeld in [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref4], recht op uitkering
      hebben, onverminderd de overige vereisten voor dat recht:

      a. ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of

      b. indien zij, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref5], rechtmatig in Nederland verblijf
      hebben als bedoeld in [artikel 8, onderdeel g of h, van de Vreemdelingenwet 2000][ref6].

      3 Het eerste lid, onderdeel c, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt
      buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden, of een
      inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref7].

      4 Het eerste lid, onderdeel a, is niet van toepassing indien het verblijf buiten Nederland noodzakelijk is in
      verband met de beroepsuitoefening, zo nodig gehoord de adviserende instelling.

      5 De kunstenaar die op grond van [artikel 8, onderdeel b][ref8], geen recht heeft op uitkering, of wiens uitkering
      op grond van [artikel 11, eerste lid, onderdelen b of c][ref9], is beëindigd, heeft niet eerder recht op uitkering
      dan nadat een periode van zes kalendermaanden na het tijdstip van het besluit tot afwijzing, danwel het tijdstip
      van de beëindiging van uitkering is verstreken.


