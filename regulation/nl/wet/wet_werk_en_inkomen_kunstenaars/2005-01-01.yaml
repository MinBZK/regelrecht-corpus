  - number: '33'
    text: |-
      1 Onverminderd de [artikelen 16, vierde lid, onderdeel b][ref1], [29][ref2] en [30][ref3] kunnen kosten van
      uitkering, indien de uitkering aan een gezin wordt verleend, van alle gezinsleden worden teruggevorderd.

      2 Indien de uitkering als gezinsuitkering aan gehuwden had moeten worden verleend, maar zulks achterwege is
      gebleven, omdat de kunstenaar of zijn echtgenoot de verplichtingen, bedoeld in [artikel 20][ref4], niet of niet
      behoorlijk is nagekomen, kunnen de kosten van de uitkering mede worden teruggevorderd van de persoon met wiens
      middelen als bedoeld in [paragraaf 1.2][ref5] bij de verlening van uitkering rekening had moeten worden gehouden.

      3 De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van kosten
      van uitkering die worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel16
