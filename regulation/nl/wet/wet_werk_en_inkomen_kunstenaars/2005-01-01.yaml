  - number: '20'
    text: |-
      1 Het college kan aan de uitkering verplichtingen verbinden die verband houden met de aard en het doel van deze
      wet, die strekken tot vermindering of beëindiging van het beroep op deze wet of verplichtingen die zij nodig achten
      voor een doelmatige bedrijfs- en beroepsuitoefening.

      2 De kunstenaar is verplicht:

      a. naar behoren een administratie te voeren;

      b. zich naar vermogen in te spannen om met zijn kunst zelfstandig in het bestaan te voorzien al dan niet in een
      gemengde beroepspraktijk;

      c. aan het college op verzoek of onverwijld uit eigen beweging mededeling te doen van alle feiten en omstandigheden
      waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, het
      geldend maken van het recht op uitkering, de hoogte of de duur van de uitkering, of op het bedrag dat aan hem als
      uitkering wordt betaald;

      d. aan het college desgevraagd een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 4°, van de Wet op de identificatieplicht][ref1] terstond ter inzage
      te verstrekken, voorzover dit redelijkerwijs nodig is voor de uitvoering van deze wet;

      e. aan de adviserende instelling op verzoek of onverwijld uit eigen beweging mededeling te doen van alle feiten en
      omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op de uitoefening van
      de taken van de adviserende instelling;

      f. zich naar vermogen in te spannen om gebruik te maken van de, op verzoek van de kunstenaar, aangeboden
      voorzieningen, bedoeld in [artikel 21][ref2].

      3 De kunstenaar legt de administratie, bedoeld in het tweede lid, onderdeel a, uiterlijk binnen zes maanden na
      afloop van het kalenderjaar over aan het college:

      1°. uit eigener beweging over ieder kalenderjaar waarover uitkering is verleend als bedoeld in [artikel 16][ref3],
      of

      2°. op verzoek van het college.

      4 De verplichtingen, bedoeld in het tweede lid, onderdelen c en d, gelden ook voor de echtgenoot van de kunstenaar.
      Voorzover het betreft de echtgenoot die arbeid in een eigen bedrijf of zelfstandig beroep verricht, geldt de
      verplichting, bedoeld in het derde lid, ook voor de echtgenoot.

      5 Het college stelt bij de uitvoering van deze wet ten aanzien van de kunstenaar en zijn echtgenoot op wie de
      verplichting, bedoeld in het tweede lid, onderdeel d, rust, de identiteit vast aan de hand van een document als
      bedoeld in [artikel 1, eerste lid, onder 1° tot en met 4°, van de Wet op de identificatieplicht][ref4] en neemt
      de aard en het nummer daarvan op in de administratie.

      6 De kunstenaar die een voorziening als bedoeld in [artikel 21][ref5] aanvraagt is verplicht
      zich als werkzoekende in te schrijven bij de Centrale organisatie werk en inkomen, bedoeld in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6] en daarbij ingeschreven te blijven
      gedurende de periode dat hij deze voorziening ontvangt.

      7 Het zesde lid is van overeenkomstige toepassing op de echtgenoot van de kunstenaar indien de voorziening, bedoeld
      in [artikel 21][ref7], de echtgenoot van de kunstenaar betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
