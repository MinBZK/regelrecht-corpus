  - number: '51'
    text: |-
      1 Onze Minister vergoedt ten laste van ’s Rijks kas de door de adviserende instelling gemaakte uitvoeringskosten
      overeenkomstig de krachtens het derde lid, onderdeel a, gestelde regels.

      2 De adviserende instelling declareert de in een kalenderjaar gemaakte kosten door middel van een kostenopgave
      over dat jaar. Deze opgave is voorzien van een verklaring van een registeraccountant of een Accountant-
      Administratieconsulent ten aanzien van wie bij de inschrijving in het in artikel 36, eerste lid, van de Wet op
      de Accountants-Administratieconsulenten bedoelde register een aantekening is geplaatst als bedoeld in artikel 36,
      derde lid, van die wet.

      3 Bij ministeriële regeling worden regels gesteld inzake:

      a. de vergoeding van gemaakte uitvoeringskosten;

      b. de wijze en het tijdstip van declareren, alsmede de daarbij door de adviserende instelling nader te verstrekken
      gegevens;

      c. de in het tweede lid bedoelde verklaring en het onderzoek dat resulteert in deze verklaring.
    url: https://wetten.overheid.nl/BWBR0017837/2005-01-01#Artikel51
