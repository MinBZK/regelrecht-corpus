preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke grondslagen van de kerndoelen voor het
    funderend onderwijs te wijzigen in verband met de herijking van het curriculum en de daarmee samenhangende noodzaak
    tot het aanbrengen van focus op de vaardigheden lezen, schrijven en rekenen gezamenlijk met de toevoeging van
    nieuwe grondslagen voor kerndoelen burgerschap en kerndoelen digitale geletterdheid;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0052698/2026-08-01#ArtikelAanhef
articles:
  - number: VII
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0052698/2026-08-01#ArtikelVII
  - number: VIII
    text: 'Deze wet wordt aangehaald als: Wet herziening wettelijke grondslagen kerndoelen.'
    url: https://wetten.overheid.nl/BWBR0052698/2026-08-01#ArtikelVIII
