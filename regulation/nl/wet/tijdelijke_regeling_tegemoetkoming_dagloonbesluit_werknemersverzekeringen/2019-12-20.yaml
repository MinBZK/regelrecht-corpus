      1 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel d][ref1], wordt berekend volgens de formule, bedoeld in
      [artikel 3, eerste lid][ref2], met dien verstande dat:

      a. onder ard wordt verstaan het aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan op
      een WW- of ZW-uitkering in de periode tussen 1 juli 2015 en 1 januari 2018 vanaf de dag dat het eerdere recht op
      een WW-uitkering is geëindigd op grond van [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref3],
      waarbij het aantal rechtdagen 21,75 bedraagt indien over de volledige kalendermaand recht op een WW- of ZW-
      uitkering bestaat;

      b. het uitkeringspercentage, in afwijking van de begripsbepaling in [artikel 1, eerste lid][ref4], tevens voor de
      eerste 43,5 rechtdagen 70% bedraagt.

      2 Voor de berekening, bedoeld in het eerste lid, is het herziene dagloon de uitkomst van de formule, bedoeld in
      [artikel 3, tweede lid][ref5], met dien verstande dat:

      a. 1,004 vervangen wordt door 1,0097; en

      b. onder de referteperiode wordt verstaan de periode, bedoeld in [artikel 3, derde lid][ref6], tenzij in die
      periode een eerder recht op een WW-uitkering is ontstaan. De referteperiode begint dan op de eerste dag van
      werkloosheid van dat eerdere recht en eindigt op de laatste dag van de tweede kalendermaand voorafgaande aan de
      kalendermaand waarin de eerste dag van werkloosheid van het latere recht is gelegen. Indien de eerste dag van
      werkloosheid van dat eerdere recht is gelegen na de eerste dag van een kalendermaand, begint de referteperiode,
      in afwijking van de vorige zin, op de eerste dag van de kalendermaand na de kalendermaand waarin de eerste dag van
      werkloosheid van het eerdere recht ligt.

      3 Indien het herziene dagloon van het latere recht op WW-uitkering hoger is dan het dagloon van het eerdere recht
      op WW-uitkering, wordt de eenmalige tegemoetkoming verhoogd met de uitkomst:

      (DLH’ – DL’)* ard^* 70%

      Hierbij staat:

      DLH’ voor het herziene dagloon van het latere recht op WW-uitkering;

      DL’ voor het dagloon van het eerdere recht op WW-uitkering; en

      ard^ voor het aantal rechtdagen dat beide uitkeringen in de periode tussen 1 juli 2015 en 1 januari 2018
      gelijktijdig tot uitkering zijn gekomen.


