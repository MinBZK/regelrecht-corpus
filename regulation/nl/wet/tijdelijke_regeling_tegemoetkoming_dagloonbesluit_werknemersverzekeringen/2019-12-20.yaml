  - number: 5b
    text: |-
      1 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel e][ref1], wordt berekend volgens de formule, bedoeld in
      [artikel 4, eerste lid][ref2], met dien verstande dat onder ard’ wordt verstaan de maximumduur, bedoeld in
      [artikel 42 van de Werkloosheidswet][ref3], van de betreffende WW-uitkering, uitgedrukt in maanden, vermenigvuldigd
      met 21,75, verminderd met het aantal dagen waarop, vanaf de dag dat het recht op deze WW-uitkering zou zijn
      ontstaan, recht op een eerdere WW-uitkering bestaat, en vermenigvuldigd met 0,5.

      2 Voor de berekening, bedoeld in het eerste lid, is het herziene dagloon de uitkomst van de formule, bedoeld in
      [artikel 3, tweede lid][ref4], met dien verstande dat:

      a. 1,004 vervangen wordt door 1,0097; en

      b. onder de referteperiode wordt verstaan de periode, bedoeld in [artikel 3, derde lid][ref5], tenzij in die
      periode een eerder recht op een WW-uitkering is ontstaan. De referteperiode begint dan op de eerste dag van
      werkloosheid van dat eerdere recht en eindigt op de laatste dag van de tweede kalendermaand voorafgaande aan de
      kalendermaand waarin de eerste dag van werkloosheid van het latere recht is gelegen. Indien de eerste dag van
      werkloosheid van dat eerdere recht is gelegen na de eerste dag van een kalendermaand, begint de referteperiode,
      in afwijking van de vorige zin, op de eerste dag van de kalendermaand na de kalendermaand waarin de eerste dag van
      werkloosheid van het eerdere recht ligt.

      3 Indien het herziene dagloon van het latere, niet ontstane, recht op WW-uitkering hoger is dan het dagloon van het
      eerdere recht op WW-uitkering, wordt de eenmalige tegemoetkoming verhoogd met de uitkomst:

      (DLH’ – DL’)* ard~* 70%* 0,5

      Hierbij staat:

      DLH’ voor het herziene dagloon van het latere, niet ontstane, recht op WW-uitkering;

      DL’ voor het dagloon van het eerdere recht op WW-uitkering; en

      ard~ voor het aantal dagen in de periode tussen 1 juli 2015 en 1 januari 2018 dat het latere recht op WW-uitkering
      tot uitkering zou zijn gekomen, waarin het eerdere recht op WW-uitkering heeft bestaan.


