  - number: '2'
    text: |-
      1 Recht op een eenmalige tegemoetkoming heeft de werknemer:

      a. die recht heeft of heeft gehad op een WW-uitkering:

      1°. dat is ontstaan op of na 1 juli 2015 en voor 1 december 2016; en

      2°. die in de periode van een jaar die eindigt op de laatste dag van de tweede kalendermaand voorafgaande
      aan de kalendermaand waarin de eerste dag van werkloosheid is gelegen, geen loon heeft genoten in één of meer
      kalendermaanden;

      b. wiens recht op een WW-uitkering:

      1°. zou zijn ontstaan op of na 1 juli 2015 en voor 1 december 2016 indien
      [artikel 16, achtste lid, van de Werkloosheidswet][ref1], niet van toepassing zou zijn geweest; en

      2°. die in de periode van een jaar die eindigt op de laatste dag van de tweede kalendermaand voorafgaande
      aan de kalendermaand waarin de eerste dag van werkloosheid is gelegen, geen loon heeft genoten in één of meer
      kalendermaanden;

      c. die recht heeft of heeft gehad op een WW-uitkering:

      1°. dat is ontstaan op of na 1 juli 2015 en voor 1 december 2016;

      2°. die de wachttijd, bedoeld in [artikel 23, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2],
      heeft doorlopen, en die geen recht heeft gekregen op een WGA-uitkering omdat hij minder dan 35% arbeidsongeschikt
      was; en

      3°. het ongemaximeerde herziene dagloon ten minste 2,5% hoger is dan het ongemaximeerde dagloon;

      d. die recht heeft of heeft gehad op een WW-uitkering:

      1°. dat is ontstaan op of na 1 juli 2015 en voor 1 december 2016;

      2°. waarbij op een dag in de kalendermaand waarin het recht op een WW-uitkering is ontstaan een eerder recht op een
      WW-uitkering bestaat; en

      3°. die in de referteperiode, bedoeld in [artikel 5a, tweede lid, onderdeel b][ref3], geen loon heeft genoten in
      één of meer kalendermaanden;

      e. wiens recht op een WW-uitkering:

      1°. zou zijn ontstaan op of na 1 juli 2015 en voor 1 december 2016 indien
      [artikel 16, achtste lid, van de Werkloosheidswet][ref4] niet van toepassing zou zijn geweest;

      2°. waarbij op een dag in de kalendermaand waarin het recht op een WW-uitkering zou zijn ontstaan een eerder recht
      op een WW-uitkering bestaat; en

      3°. die in de referteperiode, bedoeld in [artikel 5b, tweede lid, onderdeel b][ref5], geen loon heeft genoten in
      één of meer kalendermaanden;

      f. die recht heeft of heeft gehad op een WW-uitkering:

      1°. dat is ontstaan op of na 1 juli 2015 en voor 1 december 2016;

      2°. die de wachttijd, bedoeld in [artikel 23, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref6],
      heeft doorlopen, en die geen recht heeft gekregen op een WGA-uitkering omdat hij minder dan 35% arbeidsongeschikt
      was;

      3°. het ongemaximeerde herziene dagloon ten minste 2,5% hoger is dan het ongemaximeerde dagloon; en

      4°. waarbij op een dag in de kalendermaand waarin het recht op een WW-uitkering is ontstaan een eerder recht op een
      WW-uitkering bestaat;

      g. die recht heeft of heeft gehad op een WW-uitkering:

      1°. die is ontstaan op of na 1 juli 2015 en voor 1 december 2017; en

      2°. die in de referteperiode, bedoeld in [artikel 2 van het Dagloonbesluit werknemersverzekeringen][ref7], meer dan
      twaalf weken minder loon heeft genoten wegens ziekte; of

      h. wiens recht op een WW-uitkering:

      1°. zou zijn ontstaan op of na 1 juli 2015 en voor 1 december 2017 indien
      [artikel 16, achtste lid, van de Werkloosheidswet][ref8] niet van toepassing zou zijn geweest; en

      2°. die in de referteperiode, bedoeld in [artikel 2 van het Dagloonbesluit werknemersverzekeringen][ref9], meer dan
      twaalf weken minder loon heeft genoten wegens ziekte.

      2 In afwijking van het eerste lid heeft de werknemer, bedoeld in het eerste lid, onderdelen a, b en c, geen recht
      op een eenmalige tegemoetkoming, indien op een dag in de kalendermaand waarin het recht op een WW-uitkering is of
      zou zijn ontstaan een eerder recht op een WW-uitkering bestaat.

      3 In afwijking van het eerste lid, onderdelen a, b, d, e, g en h, heeft de werknemer geen recht op een eenmalige
      tegemoetkoming als het ongemaximeerde herziene dagloon niet meer dan 7% hoger is dan het ongemaximeerde dagloon.

      4 In afwijking van het eerste lid, onderdeel a, c, d, f of g, heeft de werknemer geen recht op
      een eenmalige tegemoetkoming, indien de WW-uitkering blijvend geheel is geweigerd op grond van
      [artikel 27 van de Werkloosheidswet][ref10].

      5 In afwijking van het eerste lid, onderdeel b, heeft de werknemer geen recht op een eenmalige tegemoetkoming,
      indien:

      a. er in een kalendermaand na de kalendermaand waarin het recht op een WW-uitkering zou zijn
      ontstaan, een recht op een WW-uitkering is ontstaan dat voor 1 december 2016 is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref11]; of

      b. het loon in de kalendermaand waarin geen recht op een WW-uitkering is ontstaan, meer dan 87,5% bedraagt van de
      uitkomst van het herziene dagloon, bedoeld in [artikel 4, eerste lid][ref12], vermenigvuldigd met 21,75.

      6 In afwijking van het eerste lid, onderdeel e, heeft de werknemer geen recht op een eenmalige tegemoetkoming,
      indien:

      a. er in een kalendermaand na de kalendermaand waarin het recht op een WW-uitkering zou zijn
      ontstaan, een recht op een WW-uitkering is ontstaan dat voor 1 januari 2018 is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref13]; of

      b. het loon in de kalendermaand waarin geen recht op een WW-uitkering is ontstaan, meer dan 87,5% bedraagt van de
      uitkomst van het herziene dagloon, bedoeld in [artikel 4, eerste lid][ref14], vermenigvuldigd met 21,75.

      7 In afwijking van het eerste lid, onderdeel h, heeft de werknemer geen recht op een eenmalige tegemoetkoming,
      indien:

      a. er in een kalendermaand na de kalendermaand waarin het recht op een WW-uitkering zou zijn
      ontstaan, een recht op een WW-uitkering is ontstaan dat voor 1 juli 2018 is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref15]; of

      b. het loon in de kalendermaand waarin geen recht op een WW-uitkering is ontstaan, meer dan 87,5% bedraagt van de
      uitkomst van het herziene dagloon, bedoeld in [artikel 4, eerste lid][ref16], vermenigvuldigd met 21,75.

      8 Indien een werknemer op grond van hetzelfde uitkeringsrecht recht heeft op zowel een eenmalige tegemoetkoming op
      grond van het eerste lid:

      a. onderdeel a alsook op grond van het eerste lid, onderdeel c, komt enkel het recht op een eenmalige
      tegemoetkoming op grond van het eerste lid, onderdeel c, tot uitbetaling; en

      b. onderdeel d alsook op grond van het eerste lid, onderdeel f, komt enkel het recht op een eenmalige
      tegemoetkoming op grond van het eerste lid, onderdeel f, tot uitbetaling.


