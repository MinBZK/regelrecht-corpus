  - number: '8'
    text: |-
      1 Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling.

      2 Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel8
  - number: '9'
    text: |-
      1 Het UWV verstrekt aan de Minister een opgave van het totaalbedrag van de geraamde lasten alsmede de ontvangen
      voorschotten met betrekking tot deze regeling, uitgesplitst naar de tegemoetkomingen en de uitvoeringskosten.

      2 De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref1], het
      bedrag van de opgegeven lasten alsmede de ontvangen voorschotten.

      3 De Minister kan, na overleg met het UWV, van het in het eerste lid bedoelde bedrag afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel9
