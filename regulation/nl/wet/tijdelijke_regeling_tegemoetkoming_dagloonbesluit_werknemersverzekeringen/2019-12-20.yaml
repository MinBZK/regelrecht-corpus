  - number: 5e
    text: |-
      1 De eenmalige tegemoetkoming, berekend op grond van [artikel 5a][ref1], [5b][ref2], [5c][ref3] of [5d][ref4] kan
      worden gematigd. Matiging vindt enkel plaats indien;

      a. er aan de werknemer meerdere keren een eenmalige tegemoetkoming op grond van [artikel 3][ref5], [4][ref6],
      [5][ref7], [5a][ref8], [5b][ref9], [5c][ref10] of [5d][ref11] is of wordt uitgekeerd; en

      b. er door het verstrekken van de verschillende eenmalige tegemoetkomingen een bedrag aan de werknemer zou worden
      verstrekt dat er toe leidt dat het totaalbedrag aan verkregen WW-uitkering en eenmalige tegemoetkomingen niet in
      redelijke verhouding staat tot het totaalbedrag aan WW-uitkering dat de werknemer zou hebben gekregen indien het
      Dagloonbesluit werknemersverzekeringen, zoals dat luidt op 1 januari 2018, reeds op 1 juli 2015 van toepassing zou
      zijn geweest.

      2 De eenmalige tegemoetkoming, berekend op grond van [artikel 5ca][ref12] of [5cb][ref13], kan worden gematigd.
      Matiging vindt enkel plaats indien:

      a. er aan de werknemer meerdere keren een eenmalige tegemoetkoming op grond van [artikel 3][ref14], [4][ref15],
      [5][ref16], [5a][ref17], [5b][ref18], [5c][ref19], [5ca][ref20], [5cb][ref21] of [5d][ref22] is of wordt
      uitgekeerd; en

      b. er door het verstrekken van de verschillende eenmalige tegemoetkomingen een bedrag aan de werknemer zou worden
      verstrekt dat er toe leidt dat het totaalbedrag aan verkregen WW-uitkering en eenmalige tegemoetkomingen niet
      in redelijke verhouding staat tot het totaalbedrag aan WW-uitkering dat de werknemer zou hebben gekregen indien
      het [Dagloonbesluit werknemersverzekeringen][ref23], zoals dat luidt op 1 juli 2018, reeds op 1 juli 2015 van
      toepassing zou zijn geweest.

      3 Bij de matiging wordt de verhouding, genoemd in het eerste lid, onderdeel b, en tweede lid, onderdeel b, in acht
      genomen.


