  - number: 5ca.5
    text: |-
      Indien op een dag in de kalendermaand waarin het recht op een WW-uitkering van een werknemer,
      bedoeld in [artikel 2, eerste lid, onderdeel g][ref1], is ontstaan een eerder recht op WW-uitkering
      bestaat, wordt de hoogte van de eenmalige tegemoetkoming in zoverre in afwijking van het eerste
      en derde lid berekend vanaf de dag dat het eerdere recht op WW-uitkering is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref2]. [Artikel 5a, eerste lid, onderdeel b][ref3],
      is van toepassing. Indien het dagloon van het latere recht op WW-uitkering hoger is dan het dagloon van het eerdere
      recht op WW-uitkering, wordt in afwijking van de eerste zin, de eenmalige tegemoetkoming verhoogd met de uitkomst:
      (DLH’ – DL’)* ard`* 70% Hierbij staat: DLH’ voor het herziene dagloon van het latere recht op WW-uitkering; DL’
      voor het dagloon van het eerdere recht op WW-uitkering; en ard` voor het aantal rechtdagen dat beide uitkeringen
      in de periode tussen 1 juli 2015 en de dag waarop een eventuele herziening van het dagloon van het latere recht
      op WW-uitkering in verband met ziekte in de referteperiode, heeft plaatsgevonden, gelijktijdig tot uitkering zijn
      gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0038659#Artikel5a
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel5ca
    references:
      - id: ref1
        bwb_id: BWBR0038659
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0038659
        artikel: 5a
  - number: 5ca.6
    text: |-
      Indien de werknemer, bedoeld in [artikel 2, eerste lid, onderdeel g][ref1], een ZW-uitkering heeft ontvangen
      en daarnaast ook in verband met ziekte de bedongen arbeid niet heeft kunnen verrichten, wordt het herziene
      dagloon berekend met inachtneming van het tweede en vierde lid, waarna de hoogte van de eenmalige tegemoetkoming
      berekend wordt volgens de formule, bedoeld in [artikel 3, eerste lid][ref2]. Hierbij wordt onder ard verstaan
      het aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan op een WW- of ZW-uitkering
      in de periode tussen 1 juli 2015 en de dag waarop een eventuele herziening van het dagloon in verband met ziekte
      in de referteperiode heeft plaatsgevonden, waarbij het aantal rechtdagen 21,75 bedraagt indien over de volledige
      kalendermaand recht op een WW- of ZW-uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038659#Artikel3
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel5ca
    references:
