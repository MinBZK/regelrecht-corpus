  - number: '6'
    text: Met de uitvoering van deze regeling is het UWV belast.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel6
  - number: '7.1'
    text: |-
      Het UWV kan ambtshalve vaststellen of er recht bestaat op een eenmalige tegemoetkoming en wat de hoogte daarvan is
      binnen 26 weken:
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
  - number: 7.1.a
    text: |-
      vanaf 1 april 2017, betreffende de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen a tot en met c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038659
        artikel: '2'
  - number: 7.1.b
    text: |-
      vanaf 1 april 2018, betreffende de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen d tot en met f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038659
        artikel: '2'
  - number: 7.1.c
    text: |-
      vanaf 1 juli 2018, betreffende de werknemer, bedoeld in [artikel 2, eerste lid, aanhef en onderdelen g en h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038659
        artikel: '2'
  - number: '7.2'
    text: |-
      Het UWV kan op aanvraag vaststellen of er recht op een eenmalige tegemoetkoming bestaat en wat de hoogte daarvan
      is. Het UWV stelt binnen dertien weken na ontvangst van die aanvraag het recht op de eenmalige tegemoetkoming en
      de hoogte daarvan vast. Indien het UWV niet in staat is tijdig een besluit te nemen, stelt het UWV de aanvrager
      daarvan in kennis en kan de termijn eenmalig met ten hoogste dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het derde lid kan het UWV niet op aanvraag vaststellen of er recht op een eenmalige tegemoetkoming
      bestaat, indien de aanvraag ontvangen is na:
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
  - number: 7.3.a
    text: |-
      1 juli 2018, indien het de werknemer, bedoeld in [artikel 2, eerste lid, aanhef en onderdelen a tot en met c][ref1],
      betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038659
        artikel: '2'
  - number: 7.3.b
    text: |-
      1 april 2019, indien het de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen d tot en met f][ref1], betreft; en


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel7
    references:
