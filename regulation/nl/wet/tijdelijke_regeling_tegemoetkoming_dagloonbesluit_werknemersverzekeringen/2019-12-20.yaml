  - number: 5cb.5
    text: |-
      Indien op een dag in de kalendermaand waarin het recht op een WW-uitkering van een werknemer, bedoeld
      in [artikel 2, eerste lid, onderdeel h][ref1], zou zijn ontstaan een eerder recht op WW-uitkering
      bestaat, wordt de hoogte van de eenmalige tegemoetkoming in zoverre in afwijking van het eerste
      en derde lid berekend vanaf de dag dat het eerdere recht op WW-uitkering is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref2]. [Artikel 5a, eerste lid, onderdeel b][ref3],
      is van toepassing. Indien het dagloon van het latere, niet ontstane, recht op WW-uitkering hoger is dan het dagloon
      van het eerdere recht op WW-uitkering, wordt in afwijking van de eerste zin, de eenmalige tegemoetkoming verhoogd
      met de uitkomst: (DLH- – DL’)* ard-* 70% x 0,5 Hierbij staat: DLH- voor het herziene dagloon van het latere, niet
      ontstane recht op WW-uitkering; DL’ voor het dagloon van het eerdere recht op WW-uitkering; en ard- voor het aantal
      dagen in de periode tussen 1 juli 2015 en 1 juli 2018 dat het latere recht op WW-uitkering tot uitkering zou zijn
      gekomen, waarin het eerdere recht op uitkering heeft bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
