  - number: 5d
    text: |-
      1 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel d][ref1], wiens dagloon als gevolg van een herzieningsverzoek in verband met de
      uitspraak van de Centrale Raad van Beroep van 26 april 2017, ECLI:NL:CRVB:2017:1476, is herzien, is de uitkomst van
      de formule in [artikel 5a, eerste en derde lid][ref2], met dien verstande dat:

      onder ard wordt verstaan het aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan
      op een WW- of ZW-uitkering in de periode tussen 1 juli 2015 en de dag waarop het dagloon is herzien in verband
      met de genoemde uitspraak, vanaf de dag dat het eerdere recht op een WW-uitkering is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref3], waarbij het aantal rechtdagen 21,75 bedraagt
      indien over de volledige kalendermaand recht op een WW- of ZW-uitkering bestaat.

      2 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel e][ref4], wiens dagloon als gevolg van een herzieningsverzoek in verband met de
      uitspraak van de Centrale Raad van Beroep van 26 april 2017, ECLI:NL:CRVB:2017:1476, is herzien, is de uitkomst van
      de formule in [artikel 5b, eerste lid][ref5], met dien verstande dat onder ard’ wordt verstaan de duur tussen het
      niet ontstaan van de WW-uitkering op grond van [artikel 20, eerste lid, onderdeel c, van de Werkloosheidswet][ref6]
      en de herziening in verband met genoemde uitspraak, uitgedrukt in dagen, en vermenigvuldigd met 0,5.

      3 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel f][ref7], wiens dagloon als gevolg van een herzieningsverzoek in verband
      met de uitspraak van de Centrale Raad van Beroep van 19 juli 2017, ECLI:NL:CRVB:2017:2406, is herzien, is
      de uitkomst van de formule in [artikel 5c, eerste en derde lid][ref8], met dien verstande dat onder ard
      wordt verstaan het aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan op een
      WW- of ZW-uitkering in de periode tussen 1 juli 2015 en de dag waarop het dagloon is herzien in verband
      met de genoemde uitspraak, vanaf de dag dat het eerdere recht op een WW-uitkering is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref9], waarbij het aantal rechtdagen 21,75 bedraagt
      indien over de volledige kalendermaand recht op een WW-uitkering bestaat.

      4 Indien voor de werknemer, bedoeld in dit artikel, het herziene dagloon van het latere recht op WW-uitkering
      hoger is dan het dagloon van het eerdere recht op WW-uitkering, wordt de eenmalige tegemoetkoming verhoogd met
      de uitkomst van de berekening, bedoeld in [artikel 5a, derde lid][ref10], indien het eerste of derde lid van
      toepassing is.

      5 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel h][ref11], wiens uitkering als gevolg van een herzieningsverzoek
      in verband met de uitspraak van de Centrale Raad van Beroep van 19 juli 2017, ECLI:NL:CRVB:2017:2406,
      ontstaat, is de uitkomst van de formule in [artikel 5cb, eerste of derde lid][ref12], met dien verstande
      dat onder ard’ wordt verstaan de duur tussen het niet ontstaan van de WW-uitkering op grond van
      [artikel 20, eerste lid, onderdeel c, van de Werkloosheidswet][ref13] en de herziening in verband met genoemde
      uitspraak, uitgedrukt in dagen, en vermenigvuldigd met 0,5.


