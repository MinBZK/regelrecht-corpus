      De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1],
      bedraagt de uitkomst van de volgende formule: (DLH- DL)* ard* uk% hierbij staat: DLH voor het herziene dagloon;
      DL voor het dagloon; ard is het aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan
      op een WW- of ZW-uitkering in de periode tussen 1 juli 2015 en 1 januari 2017, waarbij het aantal rechtdagen
      21,75 bedraagt indien over de volledige kalendermaand recht op een WW- of ZW-uitkering bestaat; en uk% voor het
      uitkeringspercentage.


