  - number: '2.2'
    text: |-
      In afwijking van het eerste lid heeft de werknemer, bedoeld in het eerste lid, onderdelen a, b en c, geen recht op
      een eenmalige tegemoetkoming, indien op een dag in de kalendermaand waarin het recht op een WW-uitkering is of zou
      zijn ontstaan een eerder recht op een WW-uitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid, onderdelen a, b, d, e, g en h, heeft de werknemer geen recht op een eenmalige
      tegemoetkoming als het ongemaximeerde herziene dagloon niet meer dan 7% hoger is dan het ongemaximeerde dagloon.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het eerste lid, onderdeel a, c, d, f of g, heeft de werknemer geen recht op
      een eenmalige tegemoetkoming, indien de WW-uitkering blijvend geheel is geweigerd op grond van
      [artikel 27 van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
  - number: '2.5'
    text: |-
      In afwijking van het eerste lid, onderdeel b, heeft de werknemer geen recht op een eenmalige tegemoetkoming,
      indien:
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel2
  - number: 2.5.a
    text: |-
      er in een kalendermaand na de kalendermaand waarin het recht op een WW-uitkering zou zijn ontstaan,
      een recht op een WW-uitkering is ontstaan dat voor 1 december 2016 is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
  - number: 2.5.b
    text: |-
      het loon in de kalendermaand waarin geen recht op een WW-uitkering is ontstaan, meer dan 87,5% bedraagt van de
      uitkomst van het herziene dagloon, bedoeld in [artikel 4, eerste lid][ref1], vermenigvuldigd met 21,75.


