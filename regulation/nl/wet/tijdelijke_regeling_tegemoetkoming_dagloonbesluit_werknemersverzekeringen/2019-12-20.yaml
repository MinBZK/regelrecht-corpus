  - number: 5cb.1
    text: |-
      Indien de werknemer, bedoeld in [artikel 2, eerste lid, onderdeel h][ref1], een ZW-uitkering heeft
      ontvangen, wordt de hoogte van de eenmalige tegemoetkoming berekend volgens de formule, bedoeld in
      [artikel 4, eerste lid][ref2], met dien verstande dat onder ard’ wordt verstaan de maximumduur, bedoeld in
      [artikel 42 van de Werkloosheidswet][ref3], van de betreffende WW-uitkering, uitgedrukt in maanden, vermenigvuldigd
      met 21,75 en vermenigvuldigd met 0,5.


