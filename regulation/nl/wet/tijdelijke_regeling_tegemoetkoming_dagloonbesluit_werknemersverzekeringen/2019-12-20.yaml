    text: |-
      Het in een aangiftetijdvak genoten loon wordt toegerekend aan de kalendermaand waarin de laatste
      dag van het aangiftetijdvak ligt. Dit lid is niet van toepassing op de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdelen g en h][ref1].


