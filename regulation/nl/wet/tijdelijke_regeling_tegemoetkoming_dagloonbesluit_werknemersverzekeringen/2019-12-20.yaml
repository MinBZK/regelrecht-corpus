        artikel: '2'
  - number: '3.2'
    text: |-
      Het herziene dagloon, bedoeld in het eerste lid, is de uitkomst van de volgende formule: 1,004* [(A-B)* 108/100
      + C] / D hierbij staat: A voor het loon dat de werknemer in de referteperiode heeft genoten bij alle werkgevers
      die vakantiebijslag reserveren; B voor de bedragen aan vakantiebijslag die de werknemer in de referteperiode
      heeft genoten; C voor het loon dat de werknemer in de referteperiode heeft genoten bij alle werkgevers die geen
      vakantiebijslag reserveren; en D voor het aantal dagloondagen in de kalendermaanden binnen de referteperiode waarin
      loon is genoten.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel3
  - number: '3.3'
    text: |-
      Onder de referteperiode, bedoeld in het tweede lid, wordt verstaan de periode van een jaar die eindigt op de
      laatste dag van de tweede kalendermaand voorafgaande aan de kalendermaand waarin de eerste dag van werkloosheid
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel3
