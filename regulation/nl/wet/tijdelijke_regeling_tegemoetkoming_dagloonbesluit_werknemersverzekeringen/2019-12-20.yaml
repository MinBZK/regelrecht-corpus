  - number: '1.5'
    text: |-
      Voor de toepassing van wetgeving en de daarop berustende bepalingen wordt, tenzij anders bepaald, de eenmalige
      tegemoetkoming aangemerkt als een WW-uitkering. In afwijking van de eerste zin wordt de eenmalige tegemoetkoming
      niet aangemerkt als een loondervingsuitkering als bedoeld in de [Toeslagenwet][ref1] en wordt de eenmalige
      tegemoetkoming bij de toepassing van [artikel 14 van het Dagloonbesluit werknemersverzekeringen][ref2] slechts
      aangemerkt als een WW-uitkering voor zover die eenmalige tegemoetkoming betrekking heeft op een periode die ligt
      binnen de referteperiode van het dagloon. De geheel of gedeeltelijk als WW-uitkering aangemerkte tegemoetkoming
      wordt geacht te zijn genoten in eerstgenoemde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0033471#Artikel14
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0033471
        artikel: '14'
  - number: '1.6'
    text: |-
      Voor de toepassing van [artikel 4:1, vierde lid, van het Algemeen inkomensbesluit socialezekerheidswetten][ref1],
      wordt de betaling van de eenmalige tegemoetkoming aangemerkt als het moment waarop het recht bestaat.


