  - number: '8.1'
    text: Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel8
  - number: '8.2'
    text: Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel8
  - number: '8.3'
    text: |-
      In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel8
  - number: '9.1'
    text: |-
      Het UWV verstrekt aan de Minister een opgave van het totaalbedrag van de geraamde lasten alsmede de ontvangen
      voorschotten met betrekking tot deze regeling, uitgesplitst naar de tegemoetkomingen en de uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel9
  - number: '9.2'
    text: |-
      De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref1], het
      bedrag van de opgegeven lasten alsmede de ontvangen voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
  - number: '9.3'
    text: De Minister kan, na overleg met het UWV, van het in het eerste lid bedoelde bedrag afwijken.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel9
  - number: '10.1'
    text: |-
      In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      worden de lasten alsmede de ontvangen voorschotten, uitgesplitst naar de tegemoetkomingen en de uitvoeringkosten,
      met betrekking tot deze regeling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '10.2'
    text: |-
      Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], rekent de Minister de lasten alsmede
      de ontvangen voorschotten met betrekking tot deze regeling af, met als valutadatum 1 juni van het hierop volgende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '11'
    text: |-
      Het UWV brengt aan de Minister inhoudelijk en financieel verslag uit over de uitvoering van deze regeling
      overeenkomstig [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: 11a.1
    text: |-
      De Tijdelijke regeling tegemoetkoming Dagloonbesluit werknemersverzekeringen, zoals die luidde op de dag
      voor de inwerkingtreding van artikel I, onderdelen A en B, van de Regeling van de Minister van Sociale Zaken
      en Werkgelegenheid van 11 juni 2019 tot wijziging van de Tijdelijke regeling tegemoetkoming Dagloonbesluit
      werknemersverzekeringen in verband met het in aanmerking nemen van de eenmalige tegemoetkoming als loon voor
      het WIA- en WAO-dagloon (Stcrt. 2019, 33524), blijft van toepassing op uitkeringen waarvan de eerste rechtdag is
      gelegen voor die dag.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel11a
  - number: 11a.2
    text: |-
      Onder de eerste rechtdag, bedoeld in het eerste lid, wordt voor de [Wet werk en inkomen naar arbeidsvermogen][ref1]
      verstaan de dag waarop op grond van die wet recht op uitkering is ontstaan en voor
      de [Wet op de arbeidsongeschiktheidsverzekering][ref2] de dag waarop op grond van
      [artikel 40, eerste lid, van die wet][ref3] het dagloon opnieuw wordt vastgesteld of de dag waarop op grond van
      [artikel 48, derde lid, van die wet][ref4] de uitkering wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel48
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '48'
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling tegemoetkoming Dagloonbesluit werknemersverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel12
  - number: '13.1'
    text: Deze regeling treedt in werking met ingang van 1 april 2017.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel13
  - number: '13.2'
    text: |-
      Deze regeling vervalt met ingang van 1 januari 2021, met dien verstande dat voor de reeds verstrekte eenmalige
      tegemoetkoming deze regeling van toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel13
