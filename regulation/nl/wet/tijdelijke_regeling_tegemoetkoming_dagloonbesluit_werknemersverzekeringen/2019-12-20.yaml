preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, juncto 9 van de Kaderwet SZW-subsidies, en 32d, tweede lid, van de Wet
    structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *aangiftetijdvak:* hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, onderdeel a, van het Dagloonbesluit werknemersverzekeringen][ref1];
        - *de Minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *loon:* hetgeen daaronder wordt verstaan in
      [artikel 3, eerste lid, van het Dagloonbesluit werknemersverzekeringen][ref2], met dien verstande dat indien in een
      aangiftetijdvak geen of minder loon is genoten vanwege verlof als loon in dat aangiftetijdvak wordt aangemerkt het
      loon dat in dezelfde dienstbetrekking is genoten in het laatste aan dat verlof voorafgaande aangiftetijdvak waarin
      geen sprake was van verlof;
        - *dagloon:* het dagloon, bedoeld in [artikel 1b, eerste lid, van de Werkloosheidswet][ref3];
        - *ongemaximeerde dagloon:* het dagloon indien dat niet zou zijn gemaximeerd op het in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref4] bedoelde bedrag;
        - *ongemaximeerde herziene dagloon:* het herziene dagloon indien dat niet zou zijn gemaximeerd op het in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref5] bedoelde bedrag;
        - *uitkeringspercentage:* het uitkeringspercentage, waarbij geldt dat het uitkeringspercentage over de eerste 43,5
      rechtdagen 75% bedraagt, en over de daaropvolgende rechtdagen 70%;
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6];
        - *verlof:* een tussen de werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      tijdvak, waarin de werknemer geen arbeid jegens de werkgever verricht, met uitzondering van verlof als bedoeld in
      de [artikelen 3:1][ref7] en [3:2 van de Wet arbeid en zorg][ref8];
        - *werknemer:* de werknemer, bedoeld in de [Werkloosheidswet][ref9];
        - *WGA-uitkering:* de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref10];
        - *WW-uitkering:* een uitkering op grond van [hoofdstuk II van de Werkloosheidswet][ref11], met
      uitzondering van de uitkering op grond van [artikel 18 van die wet][ref12] en de uitkering die
      uitsluitend het gevolg is verkorting van de werktijd, waarvoor ontheffing is verleend op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref13];
        - *ZW-uitkering:* de uitkering van het ziekengeld, bedoeld in [artikel 19 van de Ziektewet][ref14].

      2 Het in een aangiftetijdvak genoten loon wordt toegerekend aan de kalendermaand waarin de laatste
      dag van het aangiftetijdvak ligt. Dit lid is niet van toepassing op de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdelen g en h][ref15].

      3 Op het herziene dagloon, bedoeld in de [artikelen 3, tweede lid][ref16], en [4, tweede lid][ref17], is
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref18], van overeenkomstige toepassing.

      4 Op deze regeling zijn de [artikelen 22a][ref19], [31, tweede lid][ref20], [32][ref21], [36 tot en met 36d][ref22],
      [38][ref23], [40][ref24] en [129 van de Werkloosheidswet][ref25], alsmede de [artikelen 4, eerste lid][ref26],
      [5, zevende lid][ref27], en [25 van het Dagloonbesluit werknemersverzekeringen][ref28], van overeenkomstige
      toepassing.

      5 Voor de toepassing van wetgeving en de daarop berustende bepalingen wordt, tenzij anders bepaald, de eenmalige
      tegemoetkoming aangemerkt als een WW-uitkering. In afwijking van de eerste zin wordt de eenmalige tegemoetkoming
      niet aangemerkt als een loondervingsuitkering als bedoeld in de [Toeslagenwet][ref29] en wordt de eenmalige
      tegemoetkoming bij de toepassing van [artikel 14 van het Dagloonbesluit werknemersverzekeringen][ref30] slechts
      aangemerkt als een WW-uitkering voor zover die eenmalige tegemoetkoming betrekking heeft op een periode die ligt
      binnen de referteperiode van het dagloon. De geheel of gedeeltelijk als WW-uitkering aangemerkte tegemoetkoming
      wordt geacht te zijn genoten in eerstgenoemde periode.

      6 Voor de toepassing van [artikel 4:1, vierde lid, van het Algemeen inkomensbesluit socialezekerheidswetten][ref31],
      wordt de betaling van de eenmalige tegemoetkoming aangemerkt als het moment waarop het recht bestaat.


