        artikel: '5.16'
  - number: '10'
    text: |-
      1 In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      worden de lasten alsmede de ontvangen voorschotten, uitgesplitst naar de tegemoetkomingen en de uitvoeringkosten,
      met betrekking tot deze regeling opgenomen.

      2 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref2], rekent de Minister de lasten alsmede
      de ontvangen voorschotten met betrekking tot deze regeling af, met als valutadatum 1 juni van het hierop volgende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
