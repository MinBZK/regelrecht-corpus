  - number: '6'
    text: Met de uitvoering van deze regeling is het UWV belast.
    url: https://wetten.overheid.nl/BWBR0038659/2019-12-20#Artikel6
  - number: '7'
    text: |-
      1 Het UWV kan ambtshalve vaststellen of er recht bestaat op een eenmalige tegemoetkoming en wat de hoogte daarvan
      is binnen 26 weken:

      a. vanaf 1 april 2017, betreffende de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen a tot en met c][ref1];

      b. vanaf 1 april 2018, betreffende de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen d tot en met f][ref2];

      c. vanaf 1 juli 2018, betreffende de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen g en h][ref3].

      2 Het UWV kan op aanvraag vaststellen of er recht op een eenmalige tegemoetkoming bestaat en wat de hoogte daarvan
      is. Het UWV stelt binnen dertien weken na ontvangst van die aanvraag het recht op de eenmalige tegemoetkoming en
      de hoogte daarvan vast. Indien het UWV niet in staat is tijdig een besluit te nemen, stelt het UWV de aanvrager
      daarvan in kennis en kan de termijn eenmalig met ten hoogste dertien weken worden verlengd.

      3 In afwijking van het derde lid kan het UWV niet op aanvraag vaststellen of er recht op een eenmalige
      tegemoetkoming bestaat, indien de aanvraag ontvangen is na:

      a. 1 juli 2018, indien het de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen a tot en met c][ref4], betreft;

      b. 1 april 2019, indien het de werknemer, bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen d tot en met f][ref5], betreft; en

      c. 1 januari 2019, indien het de werknemer, bedoeld in [artikel 2, eerste lid, aanhef en onderdelen g en h][ref6],
      betreft.


