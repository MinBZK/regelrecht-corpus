  - number: 5ca
    text: |-
      1 Indien de werknemer, bedoeld in [artikel 2, eerste lid, onderdeel g][ref1], een ZW-uitkering heeft
      ontvangen, wordt de hoogte van de eenmalige tegemoetkoming berekend volgens de formule, bedoeld in
      [artikel 3, eerste lid][ref2], met dien verstande dat onder ard wordt verstaan het aantal rechtdagen, dat wil
      zeggen het aantal dagen waarover recht heeft bestaan op een WW- of ZW-uitkering in de periode tussen 1 juli 2015
      en de dag waarop een eventuele herziening van het dagloon, in verband met ziekte in de referteperiode, heeft
      plaatsgevonden, waarbij het aantal rechtdagen 21,75 bedraagt indien over de volledige kalendermaand recht op een
      WW- of ZW-uitkering bestaat.

      2 Voor de berekening, bedoeld in het eerste lid, is het herziene dagloon de uitkomst van de formule, bedoeld in
      [artikel 3, tweede lid][ref3], met dien verstande dat:

      a. 1,004 vervangen wordt door 1,011; en

      b. voor de vaststelling van het loon dat de werknemer heeft genoten, de genoten ZW-uitkering vermenigvuldigd wordt
      met de uitkomst van de volgende berekening:

      (100 x G) / H

      Hierbij staat:

      G staat voor het ziekengeld;

      H staat voor:

      a. 70; of

      b. indien het uitkeringspercentage hoger is dan 70%, het uitkeringspercentage waarnaar het ziekengeld is berekend.

      3 Indien de werknemer, bedoeld in [artikel 2, eerste lid, onderdeel g][ref4], in verband met ziekte de bedongen
      arbeid niet heeft kunnen verrichten, wordt de hoogte van de eenmalige tegemoetkoming berekend volgens de formule,
      bedoeld in [artikel 3, eerste lid][ref5], met dien verstande dat onder ard wordt verstaan het aantal rechtdagen,
      dat wil zeggen het aantal dagen waarover recht heeft bestaan op een WW- of ZW-uitkering in de periode tussen 1 juli
      2015 en de dag waarop een eventuele herziening van het dagloon, in verband met ziekte in de referteperiode, heeft
      plaatsgevonden, waarbij het aantal rechtdagen 21,75 bedraagt indien over de volledige kalendermaand recht op een
      WW- of ZW-uitkering bestaat.

      4 Voor de berekening, bedoeld in het derde lid, is het herziene dagloon de uitkomst van de formule, bedoeld in
      [artikel 3, tweede lid][ref6], met dien verstande dat:

      a. 1,004 vervangen wordt door 1,011; en

      b. [artikel 6 van het Dagloonbesluit werknemersverzekeringen][ref7], in zoverre in afwijking van [artikel 1][ref8]
      van deze regeling, van toepassing is.

      5 Indien op een dag in de kalendermaand waarin het recht op een WW-uitkering van een werknemer,
      bedoeld in [artikel 2, eerste lid, onderdeel g][ref9], is ontstaan een eerder recht op WW-
      uitkering bestaat, wordt de hoogte van de eenmalige tegemoetkoming in zoverre in afwijking
      van het eerste en derde lid berekend vanaf de dag dat het eerdere recht op WW-uitkering is
      geëindigd op grond van [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref10].
      [Artikel 5a, eerste lid, onderdeel b][ref11], is van toepassing. Indien het dagloon van het latere recht op WW-
      uitkering hoger is dan het dagloon van het eerdere recht op WW-uitkering, wordt in afwijking van de eerste zin, de
      eenmalige tegemoetkoming verhoogd met de uitkomst:

      (DLH’ – DL’)* ard`* 70%

      Hierbij staat:

      DLH’ voor het herziene dagloon van het latere recht op WW-uitkering;

      DL’ voor het dagloon van het eerdere recht op WW-uitkering; en

      ard` voor het aantal rechtdagen dat beide uitkeringen in de periode tussen 1 juli 2015 en de dag waarop
      een eventuele herziening van het dagloon van het latere recht op WW-uitkering in verband met ziekte in de
      referteperiode, heeft plaatsgevonden, gelijktijdig tot uitkering zijn gekomen.

      6 Indien de werknemer, bedoeld in [artikel 2, eerste lid, onderdeel g][ref12], een ZW-uitkering heeft ontvangen
      en daarnaast ook in verband met ziekte de bedongen arbeid niet heeft kunnen verrichten, wordt het herziene
      dagloon berekend met inachtneming van het tweede en vierde lid, waarna de hoogte van de eenmalige tegemoetkoming
      berekend wordt volgens de formule, bedoeld in [artikel 3, eerste lid][ref13]. Hierbij wordt onder ard verstaan
      het aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan op een WW- of ZW-uitkering
      in de periode tussen 1 juli 2015 en de dag waarop een eventuele herziening van het dagloon in verband met ziekte
      in de referteperiode heeft plaatsgevonden, waarbij het aantal rechtdagen 21,75 bedraagt indien over de volledige
      kalendermaand recht op een WW- of ZW-uitkering bestaat.


