  - number: 5d.1
    text: |-
      De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in [artikel 2, eerste lid, onderdeel d][ref1],
      wiens dagloon als gevolg van een herzieningsverzoek in verband met de uitspraak van de Centrale
      Raad van Beroep van 26 april 2017, ECLI:NL:CRVB:2017:1476, is herzien, is de uitkomst van de formule
      in [artikel 5a, eerste en derde lid][ref2], met dien verstande dat: onder ard wordt verstaan het
      aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan op een WW- of ZW-
      uitkering in de periode tussen 1 juli 2015 en de dag waarop het dagloon is herzien in verband met de
      genoemde uitspraak, vanaf de dag dat het eerdere recht op een WW-uitkering is geëindigd op grond van
      [artikel 20, eerste lid, onderdeel b, van de Werkloosheidswet][ref3], waarbij het aantal rechtdagen 21,75 bedraagt
      indien over de volledige kalendermaand recht op een WW- of ZW-uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0038659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038659#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel20
