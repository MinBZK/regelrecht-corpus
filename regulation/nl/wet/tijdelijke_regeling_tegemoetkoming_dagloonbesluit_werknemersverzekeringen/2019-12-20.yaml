    text: |-
      1 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel b][ref1], bedraagt de uitkomst van de volgende formule:

      (DLH – DL)* ard’* uk%

      hierbij staat:

      DLH voor het herziene dagloon;

      DL voor het dagloon zoals dit is vastgesteld voor de dag waarop het recht op WW-uitkering zou zijn ontstaan indien
      [artikel 16, achtste lid, van de Werkloosheidswet][ref2] niet van toepassing is geweest;

      uk% voor het uitkeringspercentage; en

      ard’ voor de uitkomst, uitgedrukt in maanden, van de maximumduur, bedoeld in
      [artikel 42 van de Werkloosheidswet][ref3], van de desbetreffende WW-uitkering, vermenigvuldigd met 21,75* 0,5.

      2 Op de berekening van het herziene dagloon, bedoeld in het eerste lid, is [artikel 3, tweede lid][ref4], van
      toepassing.


