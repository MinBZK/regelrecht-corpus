    text: |-
      1 De hoogte van de eenmalige tegemoetkoming voor de werknemer, bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], bedraagt de uitkomst van de volgende formule:

      (DLH- DL)* ard* uk%

      hierbij staat:

      DLH voor het herziene dagloon;

      DL voor het dagloon;

      ard is het aantal rechtdagen, dat wil zeggen het aantal dagen waarover recht heeft bestaan op een WW- of ZW-
      uitkering in de periode tussen 1 juli 2015 en 1 januari 2017, waarbij het aantal rechtdagen 21,75 bedraagt indien
      over de volledige kalendermaand recht op een WW- of ZW-uitkering bestaat; en

      uk% voor het uitkeringspercentage.

      2 Het herziene dagloon, bedoeld in het eerste lid, is de uitkomst van de volgende formule:

      1,004* [(A-B)* 108/100 + C] / D

      hierbij staat:

      A voor het loon dat de werknemer in de referteperiode heeft genoten bij alle werkgevers die vakantiebijslag
      reserveren;

      B voor de bedragen aan vakantiebijslag die de werknemer in de referteperiode heeft genoten;

      C voor het loon dat de werknemer in de referteperiode heeft genoten bij alle werkgevers die geen vakantiebijslag
      reserveren; en

      D voor het aantal dagloondagen in de kalendermaanden binnen de referteperiode waarin loon is genoten.

      3 Onder de referteperiode, bedoeld in het tweede lid, wordt verstaan de periode van een jaar die eindigt op de
      laatste dag van de tweede kalendermaand voorafgaande aan de kalendermaand waarin de eerste dag van werkloosheid
      is gelegen.


