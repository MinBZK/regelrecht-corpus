  - number: '13'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 april 2017.

      2 Deze regeling vervalt met ingang van 1 januari 2021, met dien verstande dat voor de reeds verstrekte eenmalige
      tegemoetkoming deze regeling van toepassing blijft.
