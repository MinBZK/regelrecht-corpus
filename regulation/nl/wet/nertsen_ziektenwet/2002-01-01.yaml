preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de algemene maatregel van bestuur van 21 november 1959, Stb. 427, tot
    wering van besmettelijke ziekten bij nertsen, ingevolge artikel 49 van de Veewet behoort te worden vervangen door
    een regeling bij de wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002338/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder "Minister": Onze Minister van Landbouw en Visserij.'
    url: https://wetten.overheid.nl/BWBR0002338/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 Tot wering van besmettelijke ziekten bij nertsen kan Onze Minister de in- en doorvoer van levende nertsen alsmede
      dode nertsen en delen daarvan, andere dan de pels, uit alle of uit bepaald aangewezen landen verbieden of slechts
      voorwaardelijk toestaan.

      2 Indien de in- of doorvoer is toegestaan onder voorwaarde van voorafgaand onderzoek, wordt voor dat onderzoek
      vergoeding van kosten geheven naar een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0002338/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Ten aanzien van de bestrijding van door Onze Minister aangewezen besmettelijke ziekten van nertsen zijn de
      artikelen 15-32 en 36-38 van de [Veewet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001900
    url: https://wetten.overheid.nl/BWBR0002338/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001900
  - number: '4'
    text: |-
      1 Overtreding van het bepaalde krachtens deze wet wordt gestraft met hechtenis van ten hoogste 6 maanden of
      geldboete van de eerste categorie.

      2 De in het vorige lid strafbaar gestelde feiten worden beschouwd als overtredingen.

      3 [Artikel 76 van de Veewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel76
    url: https://wetten.overheid.nl/BWBR0002338/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '76'
  - number: '5'
    text: 'Deze wet kan worden aangehaald als: Nertsen-Ziektenwet.'
    url: https://wetten.overheid.nl/BWBR0002338/2002-01-01#Artikel5
