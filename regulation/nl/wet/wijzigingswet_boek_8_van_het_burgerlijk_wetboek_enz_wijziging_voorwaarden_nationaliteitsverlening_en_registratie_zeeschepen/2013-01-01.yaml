preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Burgerlijk Wetboek, het Wetboek van Burgerlijke
    Rechtsvordering, het Wetboek van Koophandel en de Wet nationaliteit zeeschepen in rompbevrachting te wijzigen
    met betrekking tot de voorwaarden voor nationaliteitsverlening en registratie van zeeschepen in verband met de
    uitspraak van het Hof van Justitie van de Europese Gemeenschappen van 25 juli 1991, C-221/89;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006762/2013-01-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 In afwijking van [artikel 195, eerste lid, onderdeel b, onder 5°, van Boek 8 van het Burgerlijk Wetboek][ref1],
      zoals dit komt te luiden na inwerkingtreding van deze wet, geschiedt ambtshalve doorhaling van de teboekstelling
      van zeeschepen die op het tijdstip van inwerkingtreding van deze wet te boek staan in het register, bedoeld in
      [artikel 193 van Boek 8 van het Burgerlijk Wetboek][ref2], wegens het verlies van de hoedanigheid van Nederlands
      schip, uitsluitend na ontvangst van een daartoe strekkende verklaring van Onze Minister van Verkeer en Waterstaat.
      Deze uitzondering is niet meer van toepassing met ingang van het tijdstip waarop het schip na het tijdstip van
      inwerkingtreding van deze wet opnieuw wordt teboekgesteld.

      2 De in het eerste lid bedoelde verklaring wordt afgegeven aan de reder van het desbetreffende schip indien niet
      meer wordt voldaan aan de vereisten van [artikel 311 van het Wetboek van Koophandel][ref3].

      3 Met het toezicht op de naleving van het in het tweede lid bepaalde, zijn belast de ambtenaren, bedoeld in
      [artikel 311b, eerste lid, van het Wetboek van Koophandel][ref4]. Artikel 311 *b*, derde lid, van het Wetboek van
      Koophandel is van overeenkomstige toepassing.

      4 Van de afgifte van een verklaring als bedoeld in het eerste lid wordt, nadat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist, onverwijld mededeling gedaan aan de in
      [artikel 6 van de Kadasterwet][ref5] bedoelde bewaarder van het kadaster en de openbare registers van het kantoor
      waar het schip te boek staat.


