  - number: '45'
    text: |-
      Bij opheffing van een in een brugrecht omgezet veerrecht zijn de kosten, die moeten worden gemaakt ten einde in de
      toekomst in het geregeld verkeer te voorzien, ten laste van het Rijk, wanneer de brug is gelegen in een weg, die
      door het Rijk, en ten laste van de provincie, wanneer de brug is gelegen in een weg, die door de provincie wordt
      onderhouden.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel45
  - number: '46'
    text: |-
      1 Opheffing van een in een brugrecht omgezet veerrecht doet den onderhoudsplicht van de brug, voor zooveel die
      verplichting met het veerrecht samenhing, te niet gaan.

      2 Is het Rijk of de provincie, naar gelang de opheffing ingevolge een door Ons of een door de Staten genomen
      besluit geschiedde, van oordeel, dat de brug met toebehooren moet worden opgeruimd, dan wordt aan den eigenaar een
      bekwame termijn gelaten om die opruiming te bewerkstelligen.

      3 Heeft de opruiming binnen dien termijn niet plaats gehad, dan kan het Rijk of de provincie daartoe overgaan,
      onder gehoudenheid om de afbraak op eene plaats te hunner keuze gedurende ten minste eene maand ter beschikking van
      den eigenaar te stellen.

      4 Heeft de eigenaar binnen dien termijn over de afbraak niet beschikt, dan wordt deze door het Rijk of de provincie
      in het openbaar verkocht en wordt de opbrengst, na aftrek der kosten van verkoop, den eigenaar ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel46
  - number: '47'
    text: |-
      1 Alle wetten en verordeningen van Franschen oorsprong worden, voor zooveel zij de overzetveren en de veerrechten
      betreffen, ingetrokken.

      2 Tarieven, welke voor veerrechten zijn vastgesteld krachtens Keizerlijk Decreet van 21 October 1811, worden
      gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel47
  - number: '48'
    text: |-
      1 Deze wet is niet van toepassing op overzetveren en veerrechten, welke vallen onder de bepalingen van verdragen
      met vreemde Mogendheden gesloten.

      2 Het is verboden in strijd met zoodanige bepalingen een veer aan te leggen of daar te stellen.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel48
  - number: '49'
    text: |-
      1 Overtreding van [art. 9, eerste lid][ref1], en [art. 48, tweede lid][ref2], wordt gestraft met geldboete van de
      eerste categorie.

      2 De aldus strafbaar gestelde feiten worden beschouwd als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel9
