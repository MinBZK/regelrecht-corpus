  - number: '37'
    text: |-
      Bij de vaststelling der schadeloosstelling wordt ook gelet op het verlies, dat mocht worden geleden in de zaken,
      waarmede het veer wordt bediend.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel37
  - number: '38'
    text: |-
      1 De vruchtgebruiker heeft aanspraak op het vruchtgebruik van het aan de gerechtigden tot het veerrecht toegewezen
      bedrag, behalve voor zooverre dat bestaat uit eene vergoeding voor het verlies geleden in de zaken, waarmede het
      veer wordt bediend, en die zaken niet aan het vruchtgebruik waren onderworpen.

      2 Behooren die zaken aan den vruchtgebruiker, dan heeft deze aanspraak op vergoeding voor het verlies, dat hij
      daarin lijdt.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel38
  - number: '39'
    text: |-
      1 Van het als schadeloosstelling toegewezen bedrag is rente als in burgerlijke zaken verschuldigd van de dag dat
      het veerrecht is opgeheven.

      2 De kosten, veroorzaakt door het geschil over de schadeloosstelling, komen ten laste van de eiser, tenzij de
      rechtbank in de omstandigheden van het geding termen vindt om de kosten geheel of voor een deel te compenseren,
      behoudens dat de kosten geheel door de verweerder worden gedragen, indien hem niet meer wordt toegewezen dan bij
      dagvaarding werd aangeboden.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel39
  - number: '40'
    text: |-
      Is, nadat het vonnis in gewijsde is gegaan, de toegewezen schadeloosstelling, vermeerderd met de bij het vonnis
      begroote kosten, waarin de eischer, en verminderd met die, waarin de verweerder is veroordeeld, betaald of
      geconsigneerd, dan wordt het veerrecht opgeheven, indien dat niet reeds heeft plaats gehad, vervalt de krachtens
      [art. 22][ref1] gestelde zekerheid, en verkrijgt de eischer weder de beschikking over het krachtens dat artikel
      geconsigneerde.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel22
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '22'
        hoofdstuk: II
        paragraaf: '2'
  - number: '41'
    text: |-
      1 De pachter van het veer heeft recht op schadeloosstelling, indien op het tijdstip, waarop het veerrecht
      wordt opgeheven, de pacht nog loopende is krachtens eene overeenkomst te goeder trouw gesloten voordat de in
      [art. 19][ref1] omschreven bekendmaking plaats had, of wel ten gevolge van gebruikmaking van eene hem vóór die
      bekendmaking schriftelijk te goeder trouw verleende bevoegdheid, om de pacht na het einde van den loopenden
      huurtijd te doen voortduren.

      2 Bij de vaststelling dezer schadeloosstelling wordt ook gelet op de schade, die de pachter lijdt in de zaken,
      waarmede hij het veer bedient, op den tijd, dien de pacht te goeder trouw mocht verwacht worden na het tijdstip
      van opheffing van het veerrecht nog te zullen loopen, en mede op de, vóór genoemde bekendmaking aan den pachter
      schriftelijk te goeder trouw verleende bevoegdheid, om de pacht na het einde van den loopenden huurtijd te doen
      voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel19
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: '42'
    text: |-
      1 Binnen een maand, nadat het besluit tot opheffing van het veerrecht is genomen, wordt door Onze Minister
      of door gedeputeerde staten in [artikel 19][ref1] bedoeld, aan de pachter mededeling gedaan in hoeverre hem
      schadeloosstelling wordt aangeboden.

      2 Is die mededeling achterwege gebleven of neemt de pachter daarmede geen genoegen, dan kan hij hetzij vóór de dag
      bedoeld in de aanhef van [artikel 34][ref2] tussenkomen in het geding bedoeld in [artikel 23][ref3], indien dit
      gevoerd wordt, ten einde ook zijn schadeloosstelling te doen vaststellen, hetzij zijn eis zelfstandig aanbrengen
      bij de rechtbank, waarvoor gemeld geding gevoerd is of wordt, of gevoerd had kunnen worden.

      3 In dit laatste geval moet de dagvaarding op straffe van nietigheid de som vermelden, die als schadeloosstelling
      wordt gevraagd, terwijl de conclusie van de verweerder de aangeboden som moet noemen.

      4 De rechtbank zal alsdan kunnen bevelen dat geprocedeerd wordt overeenkomstig de [artikelen 34][ref4] en
      [35][ref5].

      5 Het eerste lid van [artikel 39][ref6] is op de schadeloosstelling van de pachter van toepassing.

      6 De kosten, veroorzaakt door het geschil over deze schadeloosstelling, komen ten laste van de verweerder, tenzij
      de rechtbank in de omstandigheden van het geding termen vindt om de kosten geheel of voor een deel te compenseren,
      behoudens dat de kosten geheel door de eiser worden gedragen, indien hem niet meer wordt toegewezen dan bij
      conclusie werd aangeboden.


