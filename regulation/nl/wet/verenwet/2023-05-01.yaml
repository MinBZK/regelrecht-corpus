  - number: '43'
    text: |-
      De bekendmaking van het besluit waarbij het veerrecht wordt opgeheven, geschiedt door plaatsing in de Staatscourant
      onderscheidenlijk het provinciaal blad.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel43
  - number: '44'
    text: |-
      1 Heeft de opheffing van het veerrecht ingevolge [art. 20][ref1] of [21][ref2] plaats gehad, dan blijven het Rijk,
      de provincie of de provinciën, naar gelang de opheffing plaats had krachten een besluit van Ons of van gedeputeerde
      staten van één of meer provinciën, verplicht tot schadeloosstelling van hen, die tot het veerrecht of het
      vruchtgebruik daarvan ten tijde der opheffing gerechtigd waren, en zulks bij opheffing ingevolge [art. 21][ref3],
      behoudens verhaal op degenen, die ten onrechte eene schadeloosstelling wegens de opheffing van het veerrecht
      hebben ontvangen, ten hoogste tot het bedrag, zonder bijberekening van renten, dat als schadeloosstelling aan deze
      is uitbetaald.

      2 Is geen der partijen in het krachtens [art. 23][ref4] gevoerde geding tot het veerrecht of het vruchtgebruik
      daarvan gerechtigd verklaard, dan blijft gelijke verplichting bestaan met betrekking tot die gerechtigden, welke
      geen partij waren in het gevoerde geding.

      3 In alle overige gevallen hebben zij, die ten tijde der opheffing gerechtigd waren tot het veerrecht of het
      vruchtgebruik daarvan, en geen schadeloosstelling hebben genoten, verhaal op degenen, die ten onrechte eene
      schadeloosstelling wegens de opheffing van het veerrecht hebben ontvangen, ten hoogste tot het bedrag, zonder
      bijberekening van renten, dat verhaal op degenen, die ten onrechte eene schadeloosstelling stelling, welke hun
      toekomt, meer bedraagt, kunnen zij vorderen van het Rijk, de provincie of de provinciën, naar gelang de opheffing
      plaats had krachtens een besluit van Ons of van de Staten van een of meer provinciën.

      4 De rechtsvorderingen tot voldoening van het volgens dit artikel verschuldigde worden aangebracht bij de rechtbank
      of een der rechtbanken, binnen wier rechtsgebied het veer geheel of ten deele is gelegen. Zij vervallen één jaar
      na de dagteekening van de Staatscourant onderscheidenlijk het provinciaal blad waarin het besluit tot opheffing van
      het veerrecht is bekendgemaakt.


