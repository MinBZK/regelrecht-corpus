  - number: '15'
    text: |-
      1 De bekendmaking van een besluit tot vervallenverklaring geschiedt door plaatsing in het provinciaal blad.

      2 Van het besluit wordt mededeling gedaan aan de gerechtigden tot het veerrecht en aan degenen die het veer
      bedienen.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel15
  - number: '16'
    text: |-
      De uitspraak in een tegen een besluit als bedoeld in [artikel 13][ref1] ingesteld beroep wordt bekendgemaakt
      overeenkomstig [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001905#Artikel15
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel16
