        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: '31'
    text: |-
      Buiten het geval, in het vorig artikel genoemd, beslist de rechtbank over het bestaan van het veerrecht, zoo
      dit door den eischer mocht zijn betwist, alsmede over de rechten van partijen, die door den eischer of door die
      partijen onderling mochten zijn bestreden, benoemt één of meer deskundigen in oneffen getale en wijst een harer
      leden aan om, vergezeld van den griffier, als commissaris bij het onderzoek dier deskundigen tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel31
  - number: '32'
    text: |-
      Is bij gewijsde beslist, dat geen der partijen gerechtigd is tot het veerrecht of tot vruchtgebruik daarvan, dan
      wordt het veerrecht opgeheven, indien opheffing nog niet heeft plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel32
  - number: '33'
    text: |-
      Is met hen, die krachtens gewijsde gerechtigden zijn tot het veerrecht of het vruchtgebruik daarvan, eene
      overeenkomst over de schadeloosstelling tot stand gekomen, dan vervalt de procedure tot begrooting der
      schadeloosstelling en wordt, nadat de overeengekomen schadeloosstellingen zijn uitbetaald of geconsigneerd, het
      veerrecht opgeheven, indien opheffing nog niet heeft plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel33
  - number: '34'
    text: |-
      1 De rechter-commissaris bepaalt ten verzoeke van de meest gereede partij in overleg met de deskundigen den dag,
      het uur en de plaats, waarop het onderzoek der deskundigen zal aanvangen, en doet die beslissing door den griffier
      schriftelijk ter kennis brengen van de partijen en de deskundigen.

      2 Hij benoemt andere deskundigen in de plaats van degenen, die niet zijn opgekomen of die weigeren aan hunne
      verplichtingen te voldoen.

      3 Hij stelt de verschenen partijen in de gelegenheid de stukken mede te deelen en de gronden aan te voeren, welke
      tot bepaling der schadeloosstelling kunnen leiden.

      4 Hij hoort de getuigen, waarvan het verhoor door een of meer der partijen wordt verlangd, en die te dien einde
      zijn medegebracht of ten minste drie dagen van te voren bij exploot zijn opgeroepen.

      5 Wraking van getuigen wordt niet toegelaten.

      6 De voorschriften van het [Wetboek van Burgerlijke Rechtsvordering][ref1] omtrent het getuigenverhoor en het
      bericht van deskundigen zijn ten deze niet van toepassing.

      7 De namen en woonplaatsen der getuigen, die een partij wenscht te doen hooren, worden ten minste drie dagen vóór
      het verhoor aan de wederpartij medegedeeld.

      8 De getuigen worden onder eede gehoord.

      9 Indien een getuige, hoewel behoorlijk opgeroepen, niet verschijnt, weigert den eed af te leggen, of weigert op de
      hem gestelde vragen te antwoorden, wordt hij door den rechter-commissaris veroordeeld tot vergoeding der tevergeefs
      gemaakte kosten, onverminderd zijne gehoudenheid jegens partijen tot vergoeding van kosten, schaden en interessen.
      De getuige, die niet is verschenen, kan door indiening van een verzoek bij den rechter-commissaris in verzet
      komen, en wordt van de tegen hem uitgesproken veroordeeling ontheven, indien hij aantoont door te billijken redenen
      verhinderd te zijn geweest om te verschijnen.

      10 Nadat de getuigen zijn gehoord, worden partijen andermaal in de gelegenheid gesteld om hare bewering toe te
      lichten.

      11 Indien het onderzoek moet worden uitgesteld of verdaagd, hetgeen staat ter beslissing van den rechter-
      commissaris, worden dag, uur en plaats der verdere behandeling door dezen bepaald en aan de verschenen partijen,
      deskundigen en getuigen medegedeeld.

      12 De rechter-commissaris bepaalt den dag, waarop het rapport der deskundigen vergezeld van de door partijen
      overgelegde stukken, ter griffie van de rechtbank moet worden neergelegd.

      13 De griffier maakt van het bij het onderzoek gebeurde een proces-verbaal op, dat door den rechter-commissaris en
      door hem wordt onderteekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '35'
    text: |-
      1 Het rapport van de deskundigen ligt gedurende dertig dagen ter inzage van partijen.

      2 Gedurende de tervisieligging kunnen partijen hare bezwaren tegen het rapport der deskundigen, na die aan de
      wederpartij te hebben beteekend, aan den rechter-commissaris schriftelijk mededeelen.

      3 Na verloop van de tervisieligging bepaalt de rechter-commissaris den dag, waarop door hem ter zitting rapport zal
      worden uitgebracht, en doet hij die dagbepaling door den griffier schriftelijk ter kennis van partijen brengen.

      4 Nadat de rechter-commissaris zijn rapport ter zitting heeft uitgebracht, worden partijen toegelaten hun
      stellingen nader mondeling toe te lichten.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel35
  - number: '36'
    text: |-
      Wordt een hernieuwd onderzoek van deskundigen bevolen, dan kan de rechtbank daarop de [artt. 34][ref1] en
      [35][ref2] van toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001905#Artikel35
