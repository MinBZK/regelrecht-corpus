  - number: '18'
    text: |-
      Opheffing van een veerrecht kan tegen schadeloosstelling en volgens de voorschriften van deze paragraaf geschieden:

      door Onzen met de zaken van waterstaat belasten Minister ter uitvoering van een door Ons genomen besluit;

      door Gedeputeerde Staten van de provincie waarin het veer gelegen is.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel18
  - number: '19'
    text: |-
      1 Door Onzen Minister voornoemd met de uitvoering van Ons besluit of door Gedeputeerde Staten wordt mededeling
      gedaan op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze:

      a. dat tot opheffing van het door aanwijzing der eindpunten van het veer te omschrijven veerrecht tegen
      schadeloosstelling zal worden overgegaan;

      b. dat zij, die aanspraak maken op het veerrecht of het vruchtgebruik daarvan, vóór eenen bij de mededeling te
      bepalen dag schriftelijk van een en ander aangifte moeten doen aan Onzen Commissaris in de provincie, waarin het
      veer is gelegen.

      2 Mededeling wordt tevens gedaan aan de gerechtigden tot het veerrecht en aan degenen die het veer bedienen.

      3 Tusschen de mededeling en den dag vóór welken de aangifte moet geschieden, moet een tijdruimte van ten minste
      drie maanden worden gelaten.

      4 Is het veer in meer dan een provincie gelegen, dan wordt Onze Commissaris in één dier provinciën bij Ons besluit
      of bij het besluit van de Gedeputeerde Staten van betrokken provincies aangewezen om de aangifte in ontvangst te
      nemen, en wordt die aanwijzing in de mededeling vermeld.

      5 Onze Commissaris teekent den dag van ontvangst op de aangifte aan en geeft een gedagteekend bewijs van ontvangst
      af.


      [ref1]: https://wetten.overheid.nl/BWBR0004287
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004287
  - number: '20'
    text: |-
      Heeft vóór den bij de bekendmaking bepaalden dag niemand aangifte gedaan, dat hij op het veerrecht of het
      vruchtgebruik daarvan aanspraak maakt, dan wordt het veerrecht opgeheven.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel20
  - number: '21'
    text: |-
      Is met hen, die aangifte hebben gedaan, eene overeenkomst over de schadeloosstellingen tot stand gekomen, dan wordt
      het veerrecht opgeheven, nadat de overeengekomen schadeloosstellingen zijn uitbetaald of geconsigneerd.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel21
  - number: '22'
    text: |-
      1 Bij gebreke van een overeenkomst als in het voorgaande artikel bedoeld, kan het veerrecht worden opgeheven,
      indien voor de voldoening der schadeloosstellingen zekerheid is gesteld of zij, die aangifte hebben gedaan, van het
      recht om zekerheidstelling te vorderen afstand hebben gedaan.

      2 Het bedrag en de aard der te stellen zekerheid worden bij overeenkomst met hen, die aangifte hebben gedaan,
      geregeld of op de wijze van [art. 27][ref1] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel27
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23'
    text: |-
      Buiten de gevallen in de [artt. 20][ref1] en [21][ref2] voorzien, wordt, naar gelang de opheffing ingevolge een
      door Ons of een door Gedeputeerde Staten genomen besluit geschiedt, door het Rijk of Gedeputeerde Staten van
      de provincie of provinciën tegen hen, die aangifte hebben gedaan, eene rechtsvordering ingesteld strekkende tot
      bepaling van het bedrag, dat als schadeloosstelling voor het veerrecht moet worden betaald, en tot beslissing aan
      wie der verweerders of eventueel tusschengekomen partijen dat bedrag of een aan te wijzen deel daarvan moet worden
      uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001905#Artikel21
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001905
        artikel: '21'
        hoofdstuk: II
        paragraaf: '2'
  - number: '24'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] zijn op de gedingen, welke ingevolge deze wet
      worden gevoerd, toepasselijk, voor zoover daarvan bij de volgende bepalingen niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '25'
    text: |-
      1 De rechtsvordering wordt aangebracht bij de rechtbank of een van de rechtbanken binnen het rechtsgebied waarvan
      het veer geheel of ten dele is gelegen.

      2 Indien een van de te dagvaarden personen buiten het Koninkrijk woont, geen bekende woonplaats heeft, of vóór
      of na de dagvaarding overlijdt, wordt het geding gevoerd of voortgezet tegen een bijzondere bewindvoerder die op
      verzoek van de eiser wordt benoemd door de rechtbank waarbij de vordering wordt aangebracht.

      3 De bewindvoerder moet wonen binnen het rechtsgebied van deze rechtbank en geniet het loon van een bewindvoerder
      van een afwezige.

      4 Hij die door de bewindvoerder vertegenwoordigd wordt, is steeds bevoegd het geding van de bewindvoerder over te
      nemen en deze buiten het geding te doen stellen.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel25
  - number: '26'
    text: |-
      1 De dagvaarding moet op straffe van nietigheid de som vermelden, welke als schadeloosstelling voor de opheffing
      van het veerrecht wordt aangeboden.

      2 Maakt de eiser gebruik van de bevoegdheid hem bij [artikel 28][ref1] verleend, dan geldt dit aanbod slechts voor
      het geval, dat het bestaan van het veerrecht door de rechter wordt erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel28
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '28'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27'
    text: |-
      1 De eischer kan bij voorraad vorderen, dat de rechtbank voor alles de bedragen vaststelle, welke tot waarborg voor
      de voldoening der schadeloosstellingen zullen behooren te worden geconsigneerd, om tot opheffing van het veerrecht
      krachtens [art. 22][ref1] te kunnen overgaan. Bij de vaststelling van die bedragen zal de rechtbank zich houden aan
      het aangeboden bedrag, bijaldien dit niet met hooger vraag bestreden wordt, en anders aan het hoogste bedrag dat
      voor schadeloosstelling wordt gevorderd, behoudens hare bevoegdheid tot vermindering, indien het gevorderde haar
      bovenmatig voorkomt.

      2 Tegen de beslissing der rechtbank staat geenerlei voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel22
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '22'
        hoofdstuk: II
        paragraaf: '2'
  - number: '28'
    text: De eischer is bevoegd het bestaan van het veerrecht te betwisten.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel28
  - number: '29'
    text: Het verweerschrift moet het bedrag van de gevraagde schadeloosstelling vermelden.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel29
  - number: '30'
    text: |-
      De eis van [artikel 23][ref1] en de vordering van [artikel 27][ref2] worden afgewezen, wanneer niet ten minste drie
      dagen voor de dienende dag ter griffie van de rechtbank zijn neergelegd:

      1°. het besluit tot opheffing bedoeld in [artikel 18][ref3];

      2°. de mededeling, bedoeld in [artikel 19][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001905#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001905#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0001905#Artikel19
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '23'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
