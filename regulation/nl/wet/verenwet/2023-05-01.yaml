preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is voorschriften vast te stellen betreffende
    overzetveren en veerrechten;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: Tot het ondernemen van een overzetveer wordt geene voorafgaande vergunning of bekrachtiging van tarieven gevorderd.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel1
  - number: '2'
    text: |-
      1 De Provinciale Staten zijn bevoegd met betrekking tot door hen bepaald aan te duiden wateren of gedeelten daarvan
      bij verordening voor overzetveren voorschriften vast te stellen ter verzekering van de veiligheid van reizigers
      en goederen, ter oplegging van de verplichting tot bekendmaking van dienstregeling en tarief, tot het tegengaan
      van heffingen zonder of in strijd met een bekend gemaakt tarief, ter bepaling van de gevallen, waarin van de
      dienstregeling en van het tarief kan worden afgeweken, en tot het treffen van verdere in het provinciaal belang
      noodig geoordeelde voorzieningen.

      2 Een verordening als bedoeld in het eerste lid, wordt ten minste een maand voor de datum van inwerkingtreding aan
      Onze Minister van Verkeer en Waterstaat meegedeeld.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel2
  - number: '3'
    text: |-
      Overtreding van verordeningen, krachtens het voorgaande artikel vastgesteld, wordt, voor zover uitdrukkelijk
      als strafbaar feit aangemerkt, gestraft met hechtenis van ten hoogste twaalf dagen of geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel3
  - number: '4'
    text: |-
      Met betrekking tot overzetveren, gelegen in andere dan de ingevolge [artikel 2][ref1] aangeduide wateren, komt de
      bevoegdheid tot regeling, omschreven in dat artikel, toe aan den raad der gemeente, binnen welke het veer wordt
      uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel2
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001905
        artikel: '2'
        hoofdstuk: I
  - number: '6'
    text: |-
      De bij het in werking treden dezer wet bestaande provinciale verordeningen en reglementen op de overzetveren
      vervallen van rechtswege twee jaren na dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel6
  - number: '7'
    text: |-
      Onder veerrecht wordt in deze wet verstaan het recht, om met uitsluiting van ieder ander personen en goederen over
      te zetten, alsmede het brugrecht of het tolrecht, waarin een veerrecht is omgezet.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel7
  - number: '8'
    text: |-
      Het veerrecht kan niet worden afgescheiden van de eigendom van de grond onder het water, waarop het betrekking
      zoude hebben.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel8
  - number: '9'
    text: |-
      1 Het is den gerechtigde tot het veerrecht verboden hooger veergeld te heffen dan geoorloofd is krachtens het voor
      zijn veer geldende tarief.

      2 Bij gebreke, onvolledigheid of onduidelijkheid van een zoodanig tarief, wordt dat naar billijkheid vastgesteld,
      aangevuld of verduidelijkt door de Gedeputeerde Staten van de provincie of de provinciën, waarin het veer is
      gelegen.

      3 De Gedeputeerde Staten van de provincie of de provinciën, waarin het veer is gelegen, kunnen den gerechtigde tot
      het veerrecht onder daarbij te stellen voorwaarden machtigen om voortdurend of voor een bepaalden tijd naar een
      daarbij vast te stellen hooger tarief te heffen.

      4 Voor zover het veerrecht betrekking heeft op een verbinding waar de op de veerverbinding aansluitende openbare
      wegen in de zin van de [Wegenwet][ref1] in beheer bij een of meer gemeenten of waterschappen zijn, treedt voor
      de toepassing van het tweede en het derde lid het college van burgemeester en wethouders van de gemeente of de
      gemeenten, waarin het veer is gelegen, in de plaats van gedeputeerde staten.

      5 Zolang het college van burgemeester en wethouders geen uitvoering heeft gegeven aan het bepaalde in het vierde
      lid, blijft een voor de inwerkingtreding van de [Wet herverdeling wegenbeheer][ref2] (*Stb.* 1992, 563.) krachtens
      het tweede of derde lid genomen beslissing van provinciale staten die betrekking heeft op een veerrecht als bedoeld
      in het vierde lid, van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001948
      [ref2]: https://wetten.overheid.nl/BWBR0005697
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001948
      - id: ref2
        bwb_id: BWBR0005697
  - number: '10'
    text: |-
      Is het veerrecht in tweeën gesplitst, dan is de gerechtigde aan de eene zijde bij aankomst aan de andere zijde
      verplicht de reizigers, die wegens afwezigheid van den gerechtigde aan die zijde niet onmiddellijk overgezet kunnen
      worden, over te zetten tegen het tarief, dat van die zijde wordt geheven, onder gehoudenheid om aan den gerechtigde
      aan die zijde de helft uit te keeren van hetgeen hij heeft ontvangen, of zoodanig gedeelte daarvan als bij eene
      vóór het in werking treden dezer wet partijen bindende regeling is bepaald of daarna bij overeenkomst van partijen
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel10
  - number: '11'
    text: |-
      1 Met het in werking treden dezer wet zijn die veerrechten vervallen, welke aan het Rijk als eenig gerechtigde
      toebehooren, alsmede die, welke betrekking hebben op veren, welke gedurende de laatste vijf jaren door den
      gerechtigde feitelijk waren verlaten.

      2 Betreft het veerrecht, dat aan het Rijk als eenig gerechtigde toebehoort, een veer, dat bij het in werking treden
      dezer wet is verpacht, dan vervalt, met afwijking van het voorgaande, dat veerrecht op het tijdstip, waarop die
      pacht eindigt.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel11
  - number: '12'
    text: |-
      Het veerrecht gaat te niet door feitelijke verlating van het veer door den gerechtigde gedurende één jaar, geheel
      na het in werking treden dezer wet verloopen.
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel12
  - number: '13'
    text: |-
      Gedeputeerde Staten van de provincie of de provinciën, waarin het veer is gelegen, kunnen het veerrecht vervallen
      verklaren:

      1°. indien binnen een jaar, nadat Gedeputeerde Staten, naar aanleiding van bij hen ingekomen klachten, hebben
      aangedrongen op getrouwe naleving van de [artt. 9][ref1] en [10][ref2], meer dan eens in strijd is gehandeld met
      die artikelen;

      2°. indien het veer niet dagelijks of niet voldoende wordt bediend;

      3°. indien de toegangen tot het veer in minder bruikbaren staat verkeeren dan zij van ouds door de gerechtigden
      plachten te worden onderhouden;

      4°. indien bij een in een brugrecht omgezet veerrecht de brug niet behoorlijk wordt onderhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001905#Artikel10
    url: https://wetten.overheid.nl/BWBR0001905/2023-05-01#Artikel13
