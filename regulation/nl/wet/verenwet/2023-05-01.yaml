        paragraaf: '1'
  - number: '14'
    text: |-
      1 Vervallenverklaring op de in [art. 13 onder 1 en 2][ref1] omschreven gronden kan niet worden uitgesproken, indien
      de gerechtigde tot het veerrecht aantoont, dat hij aan de verboden handelingen of aan het niet dagelijks of niet
      voldoende bedienen van het veer naar redelijkheid geen schuld heeft.

      2 Vervallenverklaring op de in a[rt. 13 onder 2, 3 en 4][ref2] omschreven gronden kan slechts worden uitgesproken,
      indien de gerechtigde tot het veerrecht aan een bevel tot betere bediening van het veer, verbetering der toegangen
      of beter onderhoud van de brug geen gevolg heeft gegeven binnen een daarbij gestelden bekwamen termijn.

      3 Op dezelfde wijze moet op getrouwe naleving van de [artt. 9][ref3] en [10][ref4] zijn aangedrongen, om tot
      toepassing van [art. 13 onder 1][ref5], te kunnen overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001905#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001905#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0001905#Artikel9
