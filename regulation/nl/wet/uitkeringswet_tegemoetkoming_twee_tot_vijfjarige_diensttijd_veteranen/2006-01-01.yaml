---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: uitkeringswet_tegemoetkoming_twee_tot_vijfjarige_diensttijd_veteranen
regulatory_layer: WET
publication_date: '2005-02-03'
valid_from: '2006-01-01'
bwb_id: BWBR0009197
url: https://wetten.overheid.nl/BWBR0009197/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van het veteranenbeleid wenselijk is regels te stellen
    inzake een tegemoetkoming in de vorm van een eenmalige uitkering door het Rijk aan militairen die meer dan twee
    doch minder dan vijf jaar als dienst- of reserveplichtige, als oorlogsvrijwilliger dan wel als schutterplichtige
    bij de krijgsmacht van het Koninkrijk hetzij tijdens de Tweede Wereldoorlog, dan wel in het voormalig Nederlands-
    Indië, in Korea of in het voormalig Nederlands Nieuw-Guinea in werkelijke dienst zijn geweest en daarvoor
    in de overheidspensioenwetgeving, dan wel krachtens een pensioenvervangende of in een pensioengerelateerde
    uitkeringsregeling, geen financiële compensatie hebben ontvangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goed gevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.a
    text: 'militair:'
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.a.1°
    text: degene die krachtens de Dienstplichtwet werkelijke dienst heeft verricht;
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.a.2°
    text: degene die krachtens het Oorlogsvrijwilligersbesluit werkelijke dienst heeft verricht;
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.a.3°
    text: |-
      degene die krachtens de Surinaamse Schutterijverordening 1941, dan wel krachtens de Antilliaanse Schutterij-
      landsverordening 1940 werkelijke dienst heeft verricht; of
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.a.4°
    text: |-
      degene die onder de vlag van het Koninkrijk der Nederlanden als dienst- of reserveplichtige bij het Koninklijk
      Nederlands-Indisch Leger/Koninklijk Nederlands-Indonesisch Leger (KNIL), dan wel krachtens het Dienstplichtbesluit
      voor Nederlands-Indië werkelijke dienst heeft verricht, tijdens die vervulling Nederlander was of in die periode
      geen Nederlander was maar thans op grond van de [Wet betreffende de positie van Molukkers][ref1] bij de toepassing
      van de Nederlandse wetgeving als Nederlander wordt behandeld, en die na afloop van zijn werkelijke dienst naar
      Nederland is vertrokken of teruggekeerd dan wel door de zorg van de Nederlandse regering is overgebracht naar
      Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003052
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003052
  - number: 1.b
    text: 'werkelijke dienst:'
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.b.1°
    text: |-
      de door de militair bij de Nederlandse krijgsmacht in de periode van 1 januari 1938 tot en met 31 december 1962
      verrichte militaire dienst krachtens de Dienstplichtwet;
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.b.2°
    text: |-
      de door de militair bij de Nederlandse krijgsmacht in de periode van 1 januari 1938 tot en met 31 december 1962
      verrichte militaire dienst krachtens het Oorlogsvrijwilligersbesluit;
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.b.3°
    text: |-
      de door de militair in de periode van 1 januari 1938 tot en met 31 december 1962 krachtens de Surinaamse
      Schutterijverordening 1941 dan wel krachtens de Antilliaanse Schutterij-landsverordening 1940 verrichte militaire
      dienst; of
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.b.4°
    text: |-
      de door de militair vóór 26 juli 1950 bij het KNIL verrichte militaire dienst krachtens het Dienstplichtbesluit
      voor Nederlandsch-Indië en de daarop berustende uitvoeringsregelingen;
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.b.5°
    text: |-
      de tijd doorgebracht in hechtenis en tijd van ongeoorloofde afwezigheid wordt niet meegeteld bij de berekening van
      de werkelijke dienst;
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.c
    text: 'weduwe: degene die'
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.c.1°
    text: |-
      met de militair was gehuwd en die in Nederland, Suriname of de Nederlandse Antillen woonde, dan wel naar Nederland
      is vertrokken of teruggekeerd dan wel door de zorg van de Nederlandse regering is overgebracht naar Nederland,
      dan wel
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: 1.c.2°
    text: |-
      gehuwd was met een militair die is overleden in het tijdvak ingaande 1 januari 1996 en eindigend op de dag na
      plaatsing van deze wet in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel1
  - number: '2.1'
    text: |-
      De militair, bedoeld in [artikel 1, onderdeel a, onder 1°, 2° of 3°][ref1], die een werkelijke dienst van meer
      dan twee doch minder dan vijf jaar, hetzij tijdens de Tweede Wereldoorlog, dan wel in het voormalig Nederlands-
      Indië, in Korea of in het voormalig Nederlands Nieuw-Guinea doorgebracht, kan aanwijzen, alsmede de militair,
      bedoeld in [artikel 1, onderdeel a, onder 4°][ref2], die daarenboven in de periode voor de inwerkingtreding
      van deze wet tenminste één jaar onafgebroken in Nederland gevestigd is geweest, heeft aanspraak op een eenmalige
      uitkering ten bedrage van € 453,78.


      [ref1]: https://wetten.overheid.nl/BWBR0009197#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009197#Artikel1
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009197
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009197
        artikel: '1'
  - number: '2.2'
    text: |-
      Eveneens aanspraak op een eenmalige uitkering ten bedrage van € 453,78 heeft degene die als militair ten minste
      vijf jaar werkelijke dienst kan aanwijzen, hetzij tijdens de Tweede Wereldoorlog, dan wel in het voormalig
      Nederlands-Indië, in Korea of in het voormalig Nederlands Nieuw-Guinea doorgebracht en niet of minder dan vijf
      jaar als militair in de zin van de [Uitkeringswet financiële compensatie langdurige militaire dienst][ref1]
      onderscheidenlijk de [Uitkeringswet KNIL-dienstplichttijd][ref2] in werkelijke dienst is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005569
      [ref2]: https://wetten.overheid.nl/BWBR0006349
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005569
      - id: ref2
        bwb_id: BWBR0006349
  - number: '2.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de militair die zich schuldig heeft gemaakt aan desertie of
      dienstweigering.
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel2
  - number: '3'
    text: |-
      Indien de in [artikel 2][ref1] genoemde aanspraak, in verband met het overlijden van de militair niet kan worden
      geëffectueerd, heeft de weduwe recht op een eenmalige uitkering, gelijk aan het in dat artikel genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009197#Artikel2
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009197
        artikel: '2'
  - number: '4'
    text: 'De aanvraag om een uitkering krachtens deze wet wordt schriftelijk ingediend bij:'
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel4
  - number: 4.a
    text: |-
      de Stichting Administratie Indonesische Pensioenen voorzover het betreft de militair, genoemd in
      [artikel 1, onderdeel a, onder 4°][ref1], die bij het Koninklijk Nederlands Indisch /Indonesisch Leger werkelijke
      dienst heeft verricht, onderscheidenlijk diens weduwe;


      [ref1]: https://wetten.overheid.nl/BWBR0009197#Artikel1
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009197
        artikel: '1'
  - number: 4.b
    text: |-
      bij Onze Minister van Defensie, voorzover het betreft de overige militairen genoemd in
      [artikel 1, onderdeel a][ref1], onderscheidenlijk hun weduwen.


      [ref1]: https://wetten.overheid.nl/BWBR0009197#Artikel1
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009197
        artikel: '1'
  - number: '5'
    text: |-
      De gemeentebesturen en ambtenaren van de burgerlijke stand zijn verplicht op een door Onze Minister van Defensie
      onderscheidenlijk de Stichting Administratie Indonesische Pensioenen aan te geven wijze desgevraagd kosteloos
      inlichtingen te verschaffen en overigens ook alle medewerking te verlenen, benodigd voor de uitvoering van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel5
  - number: '6'
    text: |-
      De over de uitkering verschuldigde belasting ingevolge de [Wet inkomstenbelasting 2001][ref1],
      de [Wet op de loonbelasting 1964][ref2] en premie voor de volksverzekeringen ingevolge de
      [Wet financiering sociale verzekeringen][ref3] komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0017745
  - number: '7'
    text: |-
      De uitkering blijft buiten beschouwing bij de verlening van op het inkomen afgestemde publiekrechtelijke
      uitkeringen of verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel7
  - number: '9'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel9
  - number: '10'
    text: 'Deze wet wordt aangehaald als: Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen.'
    url: https://wetten.overheid.nl/BWBR0009197/2006-01-01#Artikel10
