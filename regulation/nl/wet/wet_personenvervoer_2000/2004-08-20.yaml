---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_personenvervoer_2000
regulatory_layer: WET
publication_date: '2026-01-08'
valid_from: '2004-08-20'
bwb_id: BWBR0011470
url: https://wetten.overheid.nl/BWBR0011470/2004-08-20
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op het bevorderen van een betere afstemming van het
    aanbod van personenvervoer op de vraag, alsmede het bevorderen van periodieke betwistbaarheid in het regionaal
    openbaar vervoer wenselijk is om nieuwe regels te stellen omtrent het openbaar vervoer, het besloten busvervoer en
    het taxivervoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.b
    text: |-
      regionaal openbaar lichaam: een regionaal openbaar lichaam als bedoeld in de
      [Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: 1.c
    text: |-
      Nederlandse mededingingsautoriteit: de Nederlandse mededingingsautoriteit, bedoeld in
      [artikel 2, eerste lid, van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
  - number: 1.d
    text: 'directeur-generaal: de directeur-generaal van de Nederlandse mededingingsautoriteit;'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.e
    text: |-
      bus: motorrijtuig, al dan niet voorzien van een aanhangwagen, ingericht voor het vervoer van meer dan acht
      personen, de bestuurder daaronder niet begrepen;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.f
    text: 'auto: motorrijtuig ingericht voor het vervoer van ten hoogste acht personen, de bestuurder daaronder niet begrepen;'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.g
    text: |-
      dienstregeling: voor een ieder kenbaar schema van reismogelijkheden waarin zijn aangeduid de halteplaatsen
      waartussen en de tijdstippen waarop openbaar vervoer wordt verricht, zo nodig onder de vermelding of de
      halteplaatsen of de tijdstippen door de reiziger kunnen worden beïnvloed;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.h
    text: |-
      openbaar vervoer: voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus, trein,
      metro, tram of een via een geleidesysteem voortbewogen voertuig;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.i
    text: 'besloten busvervoer: personenvervoer per bus, anders dan bedoeld in onderdeel h;'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.j
    text: 'taxivervoer: personenvervoer per auto, anders dan bedoeld in onderdeel h, tegen betaling;'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.k
    text: |-
      vervoerder: degene die openbaar vervoer, besloten busvervoer of taxivervoer verricht, niet in de hoedanigheid van
      bestuurder van een auto, bus, trein, metro, tram of een via een geleidesysteem voortbewogen voertuig;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.l
    text: |-
      concessie: recht om met uitsluiting van anderen openbaar vervoer te verrichten in een bepaald gebied gedurende een
      bepaald tijdvak;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: 1.m
    text: |-
      concessieverlener: het tot verlening van een concessie bevoegde gezag, bedoeld in [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 1.n
    text: 'concessiehouder: vergunninghoudende vervoerder aan wie een concessie is verleend.'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel1
  - number: '2.1'
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel2
  - number: 2.1.a
    text: |-
      openbaar vervoer, besloten busvervoer of taxivervoer over voor het openbaar verkeer openstaande wegen, daaronder
      begrepen uitsluitend voor openbaar vervoer openstaande wegen;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel2
  - number: 2.1.b
    text: openbaar vervoer over railwegen;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel2
  - number: 2.1.c
    text: openbaar vervoer langs geleidesystemen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat deze wet of de daarop berustende bepalingen geheel of
      gedeeltelijk mede van toepassing zijn op vervoer dat overeenkomst vertoont met het in het eerste lid bedoelde
      vervoer of dat deze wet of de daarop berustende bepalingen geheel of gedeeltelijk niet van toepassing zijn op
      bepaalde soorten van het in het eerste lid bedoelde vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel2
  - number: '2.3'
    text: |-
      De wet is niet van toepassing op vervoer van personen per auto, anders dan openbaar vervoer, indien de som van de
      betalingen voor dat vervoer de kosten van de auto en eventuele bijkomende kosten voor dat vervoer niet te boven
      gaat, tenzij vorenstaande wordt verricht in de uitoefening van een beroep of bedrijf. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld over de kosten van de auto en eventuele bijkomende kosten.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel2
  - number: '2.4'
    text: |-
      De [hoofdstukken II][ref1], [III][ref2] en [V][ref3] zijn niet van toepassing op openbaar vervoer per trein.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0011470#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011470
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0011470
        hoofdstuk: V
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten behoeve van experimenten
      met openbaar vervoer voor een periode van ten hoogste zes jaar. Daarbij kan worden afgeweken van de
      [artikelen 19][ref1], [20][ref2], [24][ref3], [30][ref4], [51][ref5], [52][ref6], [61 tot en met 67][ref7] en
      [77][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0011470#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0011470#Artikel52
      [ref7]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref8]: https://wetten.overheid.nl/BWBR0011470#Artikel77
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '30'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0011470
        artikel: '51'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0011470
        artikel: '52'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref8
        bwb_id: BWBR0011470
        artikel: '77'
        hoofdstuk: V
  - number: '3.2'
    text: |-
      De voordracht voor een algemene maatregel van bestuur waarbij wordt afgeweken van deze wet wordt niet eerder gedaan
      dan vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel3
  - number: '4.1'
    text: |-
      Het is verboden openbaar vervoer anders dan per trein of besloten busvervoer te verrichten zonder een daartoe
      verleende vergunning voor collectief personenvervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel4
  - number: '4.2'
    text: Het is verboden taxivervoer te verrichten zonder een daartoe verleende vergunning.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel4
  - number: '4.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt met het verrichten van besloten busvervoer, respectievelijk
      taxivervoer, gelijkgesteld het aanbieden van dat vervoer, tenzij dit aanbieden geschiedt door tussenpersonen die
      bemiddelen in dat vervoer bij wijze van dienstverlening of in de uitoefening van hun beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel4
  - number: '4.4'
    text: Het is verboden openbaar vervoer per trein te verrichten zonder een daartoe verleende vergunning.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel4
  - number: '5'
    text: |-
      Onze Minister beslist op een aanvraag voor een vergunning als bedoeld in
      [artikel 4, eerste, tweede en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
  - number: '6.1'
    text: Een vergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel6
  - number: '6.2'
    text: |-
      Een vergunning kan worden geweigerd, gewijzigd, geschorst of ingetrokken. Een vergunning wordt geschorst voor
      bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel6
  - number: '6.3'
    text: |-
      Een vergunning wordt steeds geweigerd, indien binnen een periode van twee jaar direct voorafgaande aan de datum van
      indiening van een aanvraag voor een vergunning een eerder aan de aanvrager verleende vergunning is ingetrokken op
      grond van [artikel 99, onderdeel a, of onderdeel b][ref1], voor zover het betreft de eis van betrouwbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel99
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '99'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '6.4'
    text: |-
      De vergunning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '6.5'
    text: |-
      Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '6.6'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel6
  - number: '6.7'
    text: |-
      De beperkingen waaronder een vergunning wordt verleend en de aan een vergunning verbonden voorschriften kunnen
      ambtshalve of op aanvraag worden gewijzigd, geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel6
  - number: '7.1'
    text: 'Een vergunning vervalt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: 7.1.a
    text: |-
      zes maanden na het overlijden of het intreden van wettelijke onbekwaamheid van degene aan wie de vergunning is
      verleend;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: 7.1.b
    text: zodra de rechtspersoon waaraan de vergunning is verleend, heeft opgehouden te bestaan;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: 7.1.c
    text: |-
      zodra de overeenkomst van de vennootschap zonder rechtspersoonlijkheid of de maatschap waaraan de vergunning is
      verleend, is ontbonden;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: 7.1.d
    text: zodra degene aan wie de vergunning is verleend, zijn activiteiten als vervoerder heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: '7.2'
    text: |-
      Belanghebbenden kunnen binnen zes maanden na het overlijden of na het intreden van de wettelijke onbekwaamheid,
      bij Onze Minister een aanvraag indienen om de vergunning te stellen op naam van de erfgenaam of, indien er meer
      erfgenamen zijn, op naam van de gezamenlijke erven, dan wel op naam van één of meer door de belanghebbenden
      aangewezen vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: '7.3'
    text: |-
      Het bestuursorgaan beslist binnen drie maanden op de aanvraag, bedoeld in het tweede lid. Indien Onze Minister de
      aanvraag inwilligt, geschiedt dat voor een periode van ten hoogste één jaar na het verstrijken van de in het eerste
      lid, onderdeel a, bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: '7.4'
    text: |-
      De in het derde lid bedoelde periode van één jaar kan door Onze Minister eenmaal met ten hoogste een half jaar
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: '7.5'
    text: |-
      Het eerste lid vindt geen toepassing zolang Onze Minister nog niet onherroepelijk op de in het tweede lid bedoelde
      aanvraag heeft beslist.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verlening, weigering,
      wijziging, schorsing of intrekking van een vergunning en de aan een vergunning verbonden voorschriften en
      beperkingen. Deze regels bevatten in ieder geval bepalingen over:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel8
  - number: 8.a
    text: de wijze waarop een aanvraag om verlening, wijziging of intrekking van een vergunning wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel8
  - number: 8.b
    text: de termijn waarbinnen op een aanvraag wordt beslist;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel8
  - number: 8.c
    text: de afgifte, geldigheid en het gebruik van vergunningbewijzen voor bussen en auto's;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel8
  - number: 8.d
    text: |-
      de vergoeding die de aanvrager is verschuldigd voor de behandeling van een aanvraag als bedoeld in onderdeel a en
      voor de afgifte van vergunningbewijzen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel8
  - number: '9.1'
    text: |-
      Een vergunning wordt, behoudens in bij algemene maatregel van bestuur aan te geven gevallen, slechts verleend aan
      een vervoerder die voldoet aan eisen van betrouwbaarheid, kredietwaardigheid en vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: '9.2'
    text: Onze Minister kan ontheffing verlenen van de in het eerste lid bedoelde eis van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: '9.3'
    text: |-
      Een ontheffing als bedoeld in het tweede lid kan onder beperkingen worden verleend en aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: '9.4'
    text: |-
      Onze Minister kan een ontheffing, de beperkingen waaronder een ontheffing is verleend en de aan een ontheffing
      verbonden voorschriften ambtshalve of op aanvraag wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: '9.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: 9.5.a
    text: de eisen van betrouwbaarheid, kredietwaardigheid en vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: 9.5.b
    text: de gevallen waarin Onze Minister ontheffing kan verlenen;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: 9.5.c
    text: de beperkingen waaronder een ontheffing kan worden verleend;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: 9.5.d
    text: de voorschriften die aan een ontheffing kunnen worden verbonden en
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: 9.5.e
    text: |-
      de vergoeding die is verschuldigd voor de behandeling van de aanvraag om verlening van een ontheffing alsmede
      voor afgifte van verklaringen van Onze Minister betreffende het voldoen aan eisen van kredietwaardigheid of
      vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: '9.6'
    text: |-
      Voor zover dit noodzakelijk is om vast te stellen of wordt voldaan aan de eisen bedoeld in het eerste lid, kan Onze
      Minister gegevens omtrent gedrag en strafrechtelijke gegevens verwerken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel9
  - number: '10'
    text: |-
      Onze Minister neemt een beslissing tot verlening, weigering, wijziging of intrekking van een vergunning voor het
      verrichten van openbaar vervoer per trein op grond van de wenselijkheid van het openbaar vervoer per trein en het
      financieel belang van het Rijk.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel10
  - number: '11'
    text: 'Het is de houder van een vergunning verboden te handelen in strijd met:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel11
  - number: 11.a
    text: |-
      een vergunning, de beperkingen waaronder een vergunning is verleend en de aan een vergunning verbonden
      voorschriften;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel11
  - number: 11.b
    text: de beperkingen waaronder een ontheffing is verleend en de aan een ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel11
  - number: '12.1'
    text: |-
      De vervoerder voorziet, al dan niet in samenwerking met andere vervoerders, in het op verzoek behandelen
      van geschillen over de totstandkoming of de uitvoering van een vervoersovereenkomst als bedoeld in de
      [artikelen 80, eerste lid][ref1], en [100, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2], door
      instelling van een geschillencommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel100
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '100'
  - number: '12.2'
    text: |-
      De geschillencommissie bestaat uit een oneven aantal leden, waarvan ten minste één
      voldoet aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar, bedoeld in
      [artikel 1d van de Wet rechtspositie rechterlijke ambtenaren][ref1] en waarvan de voorzitter onafhankelijk is van
      de overige leden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008365
  - number: '12.3'
    text: |-
      Bij de samenstelling van de geschillencommissie wordt aan geen van de bij het geschil betrokken partijen een
      bevoorrechte positie toegekend.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel12
  - number: '12.4'
    text: |-
      De geschillencommissie beslecht een aan haar voorgelegd geschil door het uitbrengen van een bindend advies of door
      het bewerkstelligen van een minnelijke schikking tussen partijen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel12
  - number: '12.5'
    text: De geschillencommissie stelt een reglement vast over de wijze waarop een geschil wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel12
  - number: '13.1'
    text: |-
      De vervoerder maakt op een naar de aard van het vervoer geëigende wijze kenbaar op welke wijze klachten over het
      verrichten van personenvervoer worden behandeld.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel13
  - number: '13.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel13
  - number: '14.1'
    text: |-
      De vervoerder verstrekt onder redelijke en objectief gerechtvaardigde voorwaarden gegevens omtrent het door
      hem te verrichten vervoer aan degene die hierom verzoekt ten behoeve van het voeden en actualiseren van een
      reisinformatiesysteem.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel14
  - number: '14.2'
    text: |-
      Vervoerders die openbaar vervoer verrichten dragen op zodanige wijze financieel bij aan een door Onze Minister aan
      te wijzen exploitant van een reisinformatiesysteem met een landelijk bereik, dat daardoor de instandhouding van dat
      systeem is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel14
  - number: '14.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de aard van gegevens als bedoeld
      in het eerste lid, de gevallen waarin Onze Minister een exploitant aanwijst, en over de wijze waarop aan het tweede
      lid toepassing wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel14
  - number: '15.1'
    text: |-
      De Nederlandse mededingingsautoriteit heeft tot taak het verrichten van werkzaamheden ten behoeve van de uitvoering
      van de in deze wet aan de directeur-generaal toegekende bevoegdheden en opgelegde taken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel15
  - number: '15.2'
    text: |-
      De directeur-generaal oefent de hem in deze wet toegekende bevoegdheden en opgelegde taken uit onder
      verantwoordelijkheid van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister legt algemene aanwijzingen aan de directeur-generaal met betrekking tot de uitoefening van hem bij
      deze wet toegekende bevoegdheden vast in beleidsregels.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel16
  - number: '16.2'
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel16
  - number: '16.3'
    text: |-
      Onze Minister geeft aanwijzingen aan de directeur-generaal met betrekking tot de uitoefening in individuele
      gevallen van de hem bij of krachtens deze wet toegekende bevoegdheden en opgelegde taken uitsluitend in
      schriftelijke vorm. De desbetreffende aanwijzing wordt gevoegd bij de op de zaak betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel16
  - number: '16.4'
    text: |-
      Indien aanwijzingen als bedoeld in het eerste of derde lid betrekking hebben op de interpretatie van
      mededingingsbegrippen, geeft Onze Minister die aanwijzingen in overeenstemming met Onze Minister van Economische
      Zaken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel16
  - number: '17.1'
    text: |-
      De directeur-generaal brengt jaarlijks voor 1 mei aan Onze Minister verslag uit over de werkzaamheden, bedoeld in
      [artikel 15][ref1], in het voorgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel15
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '15'
        hoofdstuk: I
        paragraaf: '5'
  - number: '17.2'
    text: |-
      Onze Minister brengt het verslag, vergezeld van zijn bevindingen daaromtrent alsmede van een toelichting omtrent
      zijn bemoeienissen met beslissingen van de directeur-generaal in individuele gevallen, voor 1 juli daaropvolgend
      ter kennis van de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel17
  - number: '18'
    text: |-
      Gegevens of inlichtingen omtrent een onderneming, die in verband met enige werkzaamheid ten behoeve van de
      uitvoering van deze wet zijn verkregen door de Nederlandse mededingingsautoriteit, mogen uitsluitend worden
      gebruikt voor de toepassing van deze wet en de [Mededingingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '19.1'
    text: Het is verboden openbaar vervoer te verrichten zonder daartoe verleende concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel19
  - number: '19.2'
    text: |-
      Indien op grond van [artikel 42][ref1] of [43][ref2] een concessie is opgehouden te bestaan, kan maximaal één jaar
      openbaar vervoer worden verricht zonder concessie volgens bij ministeriële regeling nader te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel43
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '43'
        hoofdstuk: II
        paragraaf: '4'
  - number: '20.1'
    text: |-
      Bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer zijn gedeputeerde staten,
      met uitzondering van concessies die worden verleend voor openbaar vervoer in een samenwerkingsgebied als bedoeld
      in [artikel 1 van de Kaderwet bestuur in verandering][ref1]. De concessies in een samenwerkingsgebied worden
      verleend, gewijzigd of ingetrokken door het dagelijks bestuur van het regionaal openbaar lichaam voor dat
      samenwerkingsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '1'
  - number: '20.2'
    text: |-
      In afwijking van het eerste lid is het college van burgemeester en wethouders van een gemeente als bedoeld in
      [artikel 120][ref1] bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer ten
      behoeve van die gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel120
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '120'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '21'
    text: |-
      Gedeputeerde staten dragen zorg voor de coördinatie en afstemming van het openbaar vervoer in de provincie, met
      uitzondering van de samenwerkingsgebieden, bedoeld in [artikel 1 van de Kaderwet bestuur in verandering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '1'
  - number: '22'
    text: |-
      De concessieverleners, bedoeld in [artikel 20][ref1], zijn bevoegd subsidies te verstrekken voor het in een
      concessie omschreven openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23.1'
    text: 'Geen concessie wordt verleend aan een vervoerder:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel23
  - number: 23.1.a
    text: |-
      van wie een geheel of gedeeltelijke eigenaar, dan wel een bestuurder of commissaris tevens het lidmaatschap
      bekleedt van een algemeen vertegenwoordigend orgaan van een openbaar lichaam waarvan een bestuursorgaan bevoegd is
      tot het verlenen van die concessie;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel23
  - number: 23.1.b
    text: |-
      voor wie een vertegenwoordiger of adviseur werkzaam is die betrokken is bij het meedingen naar of het verwerven van
      die concessie, en die tevens het lidmaatschap bekleedt van een algemeen vertegenwoordigend orgaan van een openbaar
      lichaam waarvan een bestuursorgaan bevoegd is tot het verlenen van die concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel23
  - number: '23.2'
    text: Het eerste lid, onderdeel b, is van overeenkomstige toepassing op de burgemeester en de commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel23
  - number: '23.3'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing ten aanzien van een bestuurder of commissaris bij een
      vervoerbedrijf als bedoeld in [artikel 64][ref1] bij verlening van concessies waaraan geen procedure van
      aanbesteding vooraf is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: '24.1'
    text: De concessieverlener verleent een concessie voor een in de concessie vastgesteld tijdvak van ten hoogste zes jaar.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister kan op aanvraag van een concessieverlener ontheffing verlenen van de maximale termijn van zes jaar,
      bedoeld in het eerste lid, indien:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel24
  - number: 24.2.a
    text: |-
      de concessie gepaard gaat met noodzakelijke en aanzienlijke investeringen door de concessiehouder in onlosmakelijk
      met de concessie samenhangende infrastructuur;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel24
  - number: 24.2.b
    text: |-
      een concessie voor openbaar vervoer per metro, tram of een via een geleidesysteem voortbewogen voertuig gepaard
      gaat met aanzienlijke investeringen door de concessiehouder in voor de uitvoering van de concessie noodzakelijk
      materieel.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel24
  - number: '24.3'
    text: |-
      Een ontheffing als bedoeld in het tweede lid kan onder beperkingen worden verleend en aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel24
  - number: '25.1'
    text: Een concessie bevat een omschrijving van het openbaar vervoer en van het gebied waarvoor de concessie is verleend.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel25
  - number: '25.2'
    text: |-
      Een concessie kan tevens betrekking hebben op het verrichten van openbaar vervoer van en naar het gebied, bedoeld
      in het eerste lid, indien dit is overeengekomen met de concessieverleners die het betreft.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel25
  - number: '26.1'
    text: |-
      Voordat een concessie wordt verleend of gewijzigd, pleegt de concessieverlener overleg met de concessieverleners
      die bevoegd zijn tot het verlenen van concessies in aangrenzende gebieden. Het overleg voorziet in ieder geval in
      afspraken inzake de afstemming van het openbaar vervoer tussen aangrenzende concessiegebieden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een concessie als bedoeld in [artikel 24, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel24
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
  - number: '26.3'
    text: |-
      Onze Minister kan, indien de in het eerste lid bedoelde afstemming onvoldoende gestalte krijgt, aan de betrokken
      concessieverleners een aanwijzing geven ter waarborging van die afstemming.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel26
  - number: '26.4'
    text: |-
      Een aanwijzing als bedoeld in het derde lid wordt niet gegeven dan nadat overleg is gepleegd tussen Onze Minister
      en de betrokken concessieverleners.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel26
  - number: '27.1'
    text: |-
      Voordat een concessie wordt verleend of gewijzigd, vraagt de concessieverlener advies aan consumentenorganisaties
      die voldoen aan bij algemene maatregel van bestuur gestelde voorwaarden, over de aan de concessie te verbinden
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel27
  - number: '27.2'
    text: |-
      De concessieverlener stelt de consumentenorganisaties in de gelegenheid volgens bij algemene maatregel van bestuur
      te bepalen regels met hem overleg te voeren voordat advies wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel27
  - number: '28'
    text: |-
      De concessieverlener informeert ten minste eenmaal per jaar de consumentenorganisaties, bedoeld in
      [artikel 27][ref1], over de resultaten van bij algemene maatregel van bestuur te omschrijven maatregelen die door
      hem zijn genomen en die de belangen van de reiziger raken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '29.1'
    text: |-
      De concessieverlener kan een ontheffing verlenen van het verbod, bedoeld in [artikel 19][ref1], aan een vervoerder
      die openbaar vervoer wil verrichten in een gebied waarvoor hem geen concessie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '29.2'
    text: De concessieverlener kan de ontheffing wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel29
  - number: '29.3'
    text: Een ontheffing wordt verleend voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel29
  - number: '29.4'
    text: |-
      Een ontheffing kan slechts worden geweigerd, indien naar het oordeel van de concessieverlener de
      vervoersvoorziening waarvoor een ontheffing is aangevraagd, een zodanige gelijkenis vertoont met openbaar vervoer
      waarvoor een concessie is verleend voor het gebied, bedoeld in het eerste lid, dat daarmee een onevenredige afbreuk
      wordt gedaan aan de exploitatie van die concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel29
  - number: '29.5'
    text: De concessieverlener kan de ontheffing onder beperkingen verlenen of aan de ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel29
  - number: '29.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de vergoeding die de vervoerder, bedoeld
      in het eerste lid, is verschuldigd voor de behandeling van de aanvraag om verlening van een ontheffing.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel29
  - number: '30.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de modellen van nationale
      vervoerbewijzen, de daaraan te stellen eisen, de daarbij behorende tarieven en vervoersvoorwaarden, alsmede het
      gebied waarbinnen deze geldig zijn.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel30
  - number: '30.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de invoering van electronische
      vervoerbewijzen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel30
  - number: '30.3'
    text: |-
      De concessiehouder is verplicht reizigers te vervoeren die daartoe beschikken over een voor het concessiegebied
      geldig nationaal vervoerbewijs tegen het daarbij behorende tarief.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel30
  - number: '31.1'
    text: |-
      De concessiehouder vraagt ten minste eenmaal per jaar advies aan consumentenorganisaties die voldoen aan bij
      algemene maatregel van bestuur gestelde voorwaarden, over de door de concessiehouder voorgenomen wijziging van een
      dienstregeling, het tarief en overige in de concessie geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel31
  - number: '31.2'
    text: |-
      De concessiehouder stelt de consumentenorganisaties in de gelegenheid met hem overleg te voeren voordat advies
      wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel31
  - number: '31.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de aard van onderwerpen als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel31
  - number: '32.1'
    text: De concessieverlener kan aan een concessie voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: '32.2'
    text: 'Aan een concessie worden in ieder geval voorschriften verbonden ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: 32.2.a
    text: |-
      de onderwerpen waarover, de wijze waarop en de consumentenorganisaties waaraan de concessiehouder advies vraagt als
      bedoeld in [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel31
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '31'
        hoofdstuk: II
        paragraaf: '3'
  - number: 32.2.b
    text: |-
      de onderwerpen waarover en de wijze waarop de concessiehouder de consumentenorganisaties, bedoeld in onderdeel
      a, informeert;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: 32.2.c
    text: |-
      het verstrekken van informatie aan de concessieverlener ten behoeve van de controle op de uitvoering van de
      concessie;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: 32.2.d
    text: |-
      de tarieven, de modellen van vervoerbewijzen en de vervoersvoorwaarden waartegen het openbaar vervoer moet worden
      verricht, alsmede de wijziging en openbaarmaking daarvan;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: 32.2.e
    text: |-
      het opstellen van een financiële verantwoording van het uitvoeren van de concessie, welke verantwoording gescheiden
      is van die voor andere activiteiten;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: 32.2.f
    text: de wijziging, de openbaarmaking, de datum van ingang en de geldigheidsduur van de dienstregeling;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: 32.2.g
    text: de eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een handicap;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: 32.2.h
    text: |-
      het waarborgen van een verantwoorde mate van veiligheid ten behoeve van zowel de reizigers als het personeel binnen
      het openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: '32.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het minimale niveau van toegankelijkheid van het
      openbaar vervoer dat concessieverleners middels voorschriften dienen veilig te stellen bij concessieverlening. Deze
      regels bevatten in ieder geval eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met
      een handicap en eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een fiets.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: '32.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de aan een concessie te verbinden
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel32
  - number: '33'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een maximum gemiddeld tarief
      voor het openbaar vervoer, zonodig per concessiegebied.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel33
  - number: '34.1'
    text: De concessiehouder is verplicht openbaar vervoer te verrichten volgens hetgeen in de concessie is bepaald.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel34
  - number: '34.2'
    text: |-
      Voor zolang reizigers ernstig in hun belang worden geschaad als gevolg van de afwijking van de dienstregeling
      door werkzaamheden op de in de dienstregeling voorziene trajecten of door bijzondere omstandigheden, draagt de
      concessiehouder zorg voor vervangend vervoer voor zover dat redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel34
  - number: '35'
    text: |-
      Een ieder die enig recht kan doen gelden op bij algemene maatregel van bestuur te bepalen infrastructuur, is
      verplicht het gebruik daarvan door de concessiehouder redelijkerwijs te gedogen voorzover dit voor de goede
      uitvoering van de concessie nodig is.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel35
  - number: '36.1'
    text: |-
      Voor de toepassing van de [artikelen 37 tot en met 40][ref1] wordt onder overgang van een concessie verstaan:
      het geheel of gedeeltelijk eindigen van een concessie gevolgd door het ingaan van geheel of gedeeltelijk dezelfde
      concessie als gevolg van verlening van deze concessie aan een andere vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel37
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
  - number: '36.2'
    text: |-
      De [artikelen 37][ref1] en [38][ref2] zijn van toepassing op de overgang van een concessie,
      tenzij iets anders voortvloeit uit een overeenkomst tussen de voormalige concessiehouder,
      de nieuwe concessiehouder en de belanghebbende verenigingen van werknemers als bedoeld in
      [artikel 3, vierde lid, van de Wet melding collectief ontslag][ref3], welke overeenkomst is tot stand gekomen
      binnen een maand na het besluit tot verlening van een concessie als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003026
        artikel: '3'
  - number: '37.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 662][ref1] en [663 van Boek 7 van het Burgerlijk Wetboek][ref2] gaan
      door de overgang van een concessie van rechtswege over op de nieuwe concessiehouder de rechten en verplichtingen,
      omschreven in [artikel 38][ref3], die op dat tijdstip voor de voormalige concessiehouder voortvloeien uit de
      privaatrechtelijke of publiekrechtelijke arbeidsverhouding tussen hem en:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel38
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '663'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
  - number: 37.1.a
    text: |-
      een direct ten behoeve van de verrichting van het openbaar vervoer waarvoor de concessie werd verleend, werkzame
      persoon, en
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel37
  - number: 37.1.b
    text: |-
      een indirect ten behoeve van de verrichting van het openbaar vervoer waarvoor de concessie werd verleend, werkzame
      persoon, met inachtneming van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel37
  - number: '37.2'
    text: |-
      Tenzij bij de in [artikel 36, eerste lid][ref1], bedoelde concessieverlening aan de andere vervoerder anders is
      bepaald, geschiedt de vaststelling van het aantal personen als bedoeld in het eerste lid, onderdeel b, op basis
      van de verhouding tussen de verminderde omzet ten gevolge van de overgang van de concessie en de totale omzet van
      de voormalige concessiehouder ten aanzien van het openbaar vervoer, berekend over het boekjaar voorafgaand aan
      het jaar waarin de concessieovergang plaatsvindt. [Artikel 10a van Boek 2 van het Burgerlijk Wetboek][ref2] is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '36'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 10a
  - number: '37.3'
    text: |-
      De concessieverlener oefent zijn in het tweede lid neergelegde afwijkingsbevoegdheid slechts uit, indien
      hij voorafgaand aan de toepassing van [artikel 27][ref1] dan wel [artikel 44, derde lid][ref2], ter zake een
      beleidsregel heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel44
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '44'
        hoofdstuk: III
        paragraaf: '1'
  - number: '37.4'
    text: |-
      Indien toepassing van het eerste lid leidt tot overgang van een arbeidsplaats die niet herleidbaar is tot een
      individu, gaan naar de nieuwe concessiehouder over de rechten en verplichtingen, omschreven in [artikel 38][ref1],
      die op dat tijdstip voor de voormalige concessiehouder voortvloeien uit de privaatrechtelijke of publiekrechtelijke
      arbeidsverhouding tussen hem en de persoon die, ware er sprake van een beëindiging van de arbeidsverhouding waarop
      het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] van toepassing is wegens bedrijfseconomische redenen,
      waarbij die arbeidsplaatsen zouden komen te vervallen, voor ontslag in aanmerking zou komen met inachtneming van de
      daarvoor geldende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002014
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002014
  - number: '37.5'
    text: |-
      De voormalige concessiehouder is gedurende een jaar na de overgang naast de nieuwe concessiehouder hoofdelijk
      verbonden voor de nakoming van de verplichtingen uit de arbeidsverhouding die zijn ontstaan voor dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel37
  - number: '38.1'
    text: |-
      Indien de voormalige concessiehouder geen vervoerbedrijf is als bedoeld in
      [artikel 64, tweede lid, onderdeel a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: 38.1.a
    text: |-
      zijn op de overgang van een concessie de
      [artikelen 14a, eerste, tweede en vierde lid, van de Wet op de collectieve arbeidsovereenkomst][ref1] en
      __REF001___________________________________________________________________________________________________________
      ________________ van overeenkomstige toepassing en


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0001987
        artikel: 2a
  - number: 38.1.b
    text: |-
      gaan door de overgang van de concessie de rechten en verplichtingen welke op het tijdstip van
      overgang van concessie voor de voormalige concessiehouder ten aanzien van een persoon als bedoeld in
      [artikel 37, eerste lid][ref1], voortvloeien uit bedrijfsregelingen, van rechtswege over op de nieuwe
      concessiehouder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel37
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
  - number: '38.2'
    text: |-
      Indien de voormalige concessiehouder een vervoerbedrijf is als bedoeld in
      [artikel 64, tweede lid, onderdeel a][ref1], handhaaft de nieuwe concessiehouder na de overgang van een
      concessie ten aanzien van een persoon als bedoeld in [artikel 37, eerste lid][ref2], een samenstel van rechten en
      verplichtingen gelijkwaardig aan die welke voor het tijdstip van de overgang voor de voormalige concessiehouder
      uit de privaatrechtelijke of publiekrechtelijke arbeidsverhouding tussen de voormalige concessiehouder en die
      persoon voortvloeiden, voor zover deze rechten en verplichtingen voortvloeiden uit collectieve regelingen inzake
      arbeidsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel37
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
  - number: '38.3'
    text: |-
      Op het eindigen van de rechten en verplichtingen, bedoeld in het tweede lid, zijn de
      [artikelen 14a, tweede en vierde lid, van de Wet op de collectieve arbeidsovereenkomst][ref1] en
      __REF001___________________________________________________________________________________________________________
      ______________________________________ van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0001987
        artikel: 2a
  - number: '38.4'
    text: |-
      De [artikelen 662][ref1] en [663 van Boek 7 van het Burgerlijk Wetboek][ref2] zijn van
      overeenkomstige toepassing, indien de voormalige concessiehouder een vervoerbedrijf is als bedoeld in
      [artikel 64, tweede lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '663'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: '39.1'
    text: |-
      Op verzoek van de concessieverlener verstrekt de concessiehouder aan de concessieverlener ten behoeve van
      het programma van eisen een openbare schriftelijke opgave van de rechten en verplichtingen, bedoeld in
      [artikel 38][ref1], met betrekking tot de ten behoeve van het verrichte openbaar vervoer werkzame personen, met
      inbegrip van een gemotiveerde toelichting van de wijze waarop de loonkosten zijn samengesteld, alsmede van de
      samenstelling en het aantal van het met toepassing van [artikel 37, eerste lid, onderdelen a en b][ref2], voor
      overgang in aanmerking komend personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel37
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
  - number: '39.2'
    text: |-
      De in het eerste lid bedoelde opgave geschiedt naar de toestand op het tijdstip van de opgave en naar de te
      verwachten toestand op het tijdstip van het eindigen van de concessie. De opgave gaat vergezeld van een verklaring
      van één of meer onafhankelijke deskundigen, dat de opgave is opgesteld overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel39
  - number: '39.3'
    text: |-
      De in het tweede lid bedoelde deskundigen worden aangewezen door de concessieverlener en hun kosten komen voor
      rekening van de concessieverlener. De concessiehouder is verplicht aan de deskundigen alle door dezen gewenste
      inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel39
  - number: '40'
    text: |-
      Binnen een maand na het besluit tot verlening van een concessie treden de voormalige en de nieuwe
      concessiehouder met elkaar en met de belanghebbende verenigingen van werknemers als bedoeld in
      [artikel 3, vierde lid, van de Wet melding collectief ontslag][ref1], in overleg teneinde een goede uitvoering
      van de [artikelen 37][ref2] en [38][ref3] dan wel van de overeenkomst, bedoeld in [artikel 36, tweede lid][ref4],
      te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel36
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '36'
        hoofdstuk: II
        paragraaf: '4'
  - number: '41.1'
    text: |-
      Een concessiehouder kan een concessie geheel of gedeeltelijk overdragen aan een andere vervoerder, indien deze
      voldoet aan de eisen, die bij of krachtens deze wet aan de concessiehouder zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel41
  - number: '41.2'
    text: |-
      De andere vervoerder, bedoeld in het eerste lid, is jegens de concessieverlener verplicht tot naleving van de
      ingevolge deze wet op de concessiehouder rustende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel41
  - number: '41.3'
    text: De concessiehouder kan de concessie niet overdragen dan na schriftelijke toestemming van de concessieverlener.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel41
  - number: '41.4'
    text: |-
      Toestemming voor overdracht van een concessie die is verleend na aanbesteding wordt onthouden, indien de
      andere vervoerder niet beschikt over een verklaring van geen bezwaar inzake de desbetreffende concessie. De
      [artikelen 52 tot en met 56, eerste lid][ref1], en[ 57 tot en met 60][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel57
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '52'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '57'
        hoofdstuk: III
        paragraaf: '3'
  - number: '41.5'
    text: |-
      Toestemming als bedoeld in het derde lid kan voorts slechts worden onthouden, indien redelijkerwijs te verwachten
      is dat de vervoerder de bij of krachtens deze wet gestelde verplichtingen niet of onvoldoende in acht zal nemen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel41
  - number: '41.6'
    text: |-
      De concessiehouder is naast de andere vervoerder hoofdelijk verbonden voor de nakoming van de uit de concessie
      voortvloeiende verplichtingen door de andere vervoerder die zijn ontstaan voor het tijdstip van overdracht.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel41
  - number: '42'
    text: |-
      Onverminderd de [artikelen 62][ref1] en [66][ref2] vervalt een concessie van rechtswege:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel66
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '62'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '66'
        hoofdstuk: III
        paragraaf: '5'
  - number: 42.a
    text: op het moment dat de vergunning van de concessiehouder van rechtswege is vervallen;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel42
  - number: 42.b
    text: zodra een besluit tot intrekking van de vergunning van de concessiehouder onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel42
  - number: 42.c
    text: |-
      zodra een besluit tot intrekking van de verklaring van geen bezwaar inzake de desbetreffende concessie
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel42
  - number: '43.1'
    text: |-
      Een concessie kan worden ingetrokken, indien is gebleken dat de concessiehouder de concessie niet naar behoren
      uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel43
  - number: '43.2'
    text: |-
      Een beschikking tot intrekking van een concessie treedt niet eerder in werking dan dertien weken na de datum van
      haar bekendmaking. Zij werkt niet terug.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel43
  - number: '44.1'
    text: De concessieverlener stelt ten behoeve van aanbesteding van een concessie een programma van eisen vast.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: '44.2'
    text: 'Het programma van eisen heeft in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: 44.2.a
    text: |-
      de bereikbaarheid in het gebied waarvoor een concessie wordt verleend en op de functie van het openbaar vervoer
      voor degenen die daarvan afhankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: 44.2.b
    text: de algemene eisen die aan het te verrichten openbaar vervoer worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: 44.2.c
    text: de afstemming met het openbaar vervoer in aangrenzende gebieden, alsmede met andere vormen van personenvervoer;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: 44.2.d
    text: de afstemming met milieudoelstellingen van de concessieverlener;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: 44.2.e
    text: de te benutten infrastructurele voorzieningen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: '44.3'
    text: |-
      Voordat het programma van eisen wordt vastgesteld, vraagt de concessieverlener ter zake advies aan
      consumentenorganisaties die voldoen aan bij algemene maatregel van bestuur gestelde voorwaarden, voor zover de
      voorgestelde eisen de belangen van de reiziger raken. [Artikel 27][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '44.4'
    text: |-
      De concessieverlener stelt de consumentenorganisaties in de gelegenheid volgens bij algemene maatregel van bestuur
      te bepalen regels met hem overleg te voeren voordat advies wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel44
  - number: '45'
    text: |-
      Overleg als bedoeld in [artikel 26][ref1] over het verlenen van een concessie vindt in geval van aanbesteding
      plaats voordat een concessieverlener het programma van eisen vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel26
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
  - number: '46.1'
    text: |-
      Een concessiehouder verstrekt desgevraagd binnen een door de concessieverlener te bepalen termijn aan de
      concessieverlener gegevens voor zover deze noodzakelijk zijn voor de voorbereiding van aanbesteding van een
      concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel46
  - number: '46.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de gegevens die worden verstrekt en de wijze
      waarop controle op die gegevens wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel46
  - number: '46.3'
    text: |-
      De gegevens kunnen openbaar worden gemaakt in het programma van eisen, voor zover het belang van openbaarmaking
      opweegt tegen het belang van het voorkomen van een onevenredige benadeling van de concessiehouder.
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '46.4'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een vervoerder die openbaar vervoer verricht zonder daartoe
      verleende concessie, indien de gegevens noodzakelijk zijn voor de voorbereiding van aanbesteding van een concessie
      voor dat openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel46
  - number: '47'
    text: |-
      Onverminderd [artikel 24, eerste lid][ref1], kan het tijdvak waarvoor een concessie is verleend eenmaal door de
      concessieverlener voor een periode van ten hoogste twaalf maanden worden verlengd, indien aanbesteding van een
      concessie voor een aansluitend tijdvak niet heeft geleid tot een concessieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel24
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
  - number: '48'
    text: |-
      Van deelname aan een aanbesteding van een concessie is uitgesloten een instelling, dienst of bedrijf, waarover het
      openbaar lichaam waarvan een bestuursorgaan bevoegd is tot verlening van de concessie, op grond van feitelijke of
      juridische omstandigheden een beslissende invloed uit kan oefenen op de activiteiten van die vervoerder.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel48
  - number: '49'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop aanbesteding van
      concessies plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel49
  - number: '50'
    text: De concessieverlener stelt een aanbestedingsreglement vast voor de procedure van aanbesteding van concessies.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel50
  - number: '61.1'
    text: |-
      Onze Minister kan bepalen dat concessieverleners voor ten minste 35% van de omzet van het openbaar vervoer in hun
      concessiegebieden slechts concessies verlenen nadat daartoe een aanbesteding is gehouden, indien:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: 61.1.a
    text: |-
      op 1 januari 2003 gerekend naar de totale omzet van het openbaar vervoer in Nederland, minder dan 35% van het
      openbaar vervoer in Nederland wordt verricht of naar het oordeel van Onze Minister zal worden verricht, op grond
      van een concessie die is verleend na een procedure van aanbesteding;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: 61.1.b
    text: aanbesteding van concessies niet voldoende gespreid over Nederland plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister kan op aanvraag van een concessieverlener een ontheffing verlenen van de in het eerste lid bedoelde
      verplichting, indien gebiedsspecifieke omstandigheden naar het oordeel van Onze Minister een aanbesteding
      vooralsnog belemmeren.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: '61.3'
    text: |-
      Onze Minister en provinciale staten kunnen aan gedeputeerde staten respectievelijk aan het dagelijks bestuur van
      een regionaal openbaar lichaam of burgemeester en wethouders ontheffing verlenen van de in het eerste lid bedoelde
      verplichting, indien:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: 61.3.a
    text: de concessieverlener heeft aangetoond dat het belang van de reiziger daarmee is gediend of
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: 61.3.b
    text: |-
      de concessieverlener naar het oordeel van de directeur-generaal heeft aangetoond dat aanbesteding leidt tot een
      economische machtspositie als bedoeld in [artikel 1, onderdeel i, van de Mededingingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel1
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '1'
  - number: '61.4'
    text: De ontheffing kan onder beperkingen worden verleend en aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: '61.5'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de toepassing van het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel61
  - number: '62'
    text: |-
      Een concessie die is verleend zonder dat daartoe een aanbesteding is gehouden, vervalt een jaar nadat door Onze
      Minister toepassing is gegeven aan [artikel 61, eerste lid][ref1], tenzij binnen dat jaar door de concessieverlener
      is voldaan aan [artikel 61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel61
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
  - number: '64.1'
    text: |-
      [Paragraaf 4][ref1] van dit hoofdstuk is niet van toepassing op concessies die zijn verleend aan gemeentelijke
      vervoerbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011470
        hoofdstuk: III
        paragraaf: '4'
  - number: '64.2'
    text: |-
      Onder een gemeentelijk vervoerbedrijf wordt verstaan de vervoerder, voorzover die openbaar vervoer of daarmee
      rechtstreeks samenhangende activiteiten verricht,:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
  - number: 64.2.a
    text: die een dienst of een bedrijf is van een gemeente,
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
  - number: 64.2.b
    text: |-
      waarvan een gemeente meer dan de helft van de aandelen in het geplaatst kapitaal van het bedrijf bezit,
      onderscheidenlijk bezat op of na 1 januari 1996,
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
  - number: 64.2.c
    text: |-
      waarvan een gemeente over meer dan de helft van het aantal stemmen verbonden aan de aandelen in het geplaatst
      kapitaal van het bedrijf beschikt, onderscheidenlijk beschikte op of na 1 januari 1996,
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
  - number: 64.2.d
    text: |-
      waarvan een gemeente meer dan de helft van de leden van de raad van commissarissen of van de raad van bestuur van
      het bedrijf kan aanstellen, onderscheidenlijk kon aanstellen op of na 1 januari 1996, of
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
  - number: 64.2.e
    text: |-
      ten aanzien waarvan een of meer vervoerders als bedoeld in de onderdelen a, b, c, of d, al dan niet gezamenlijk
      beschikken over de rechten, bedoeld in de onderdelen b, c of d.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
  - number: '64.3'
    text: |-
      Onder gemeentelijk vervoerbedrijf wordt tevens verstaan de rechtsopvolger van de in het tweede lid bedoelde
      vervoerder voorzover het betreft een concessie verleend aan deze rechtsopvolger voor het verrichten van openbaar
      vervoer dat op 1 januari 1999 door die vervoerder werd verricht.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel64
  - number: '69.1'
    text: |-
      Een gemeentelijk vervoerbedrijf als bedoeld in [artikel 64, tweede lid, onderdelen a tot en met d][ref1], verricht
      geen andere werkzaamheden dan openbaar vervoer, vervoer waarop bij algemene maatregel van bestuur als bedoeld in
      [artikel 2, tweede lid][ref2], dit artikel van toepassing is verklaard, alsmede de werkzaamheden die rechtstreeks
      samenhangen met het verrichten van dat vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel2
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '69.2'
    text: |-
      Een gemeentelijk vervoerbedrijf mag vervoerders als bedoeld in [artikel 64, tweede lid, onderdeel e][ref1],
      of andere vervoerders waarin een rechtspersoon die ten aanzien van het vervoerbedrijf beschikt
      over rechten als bedoeld in [artikel 64, tweede lid, onderdelen b, c of d][ref2], over in de in
      [artikel 64, tweede lid, onderdelen b, c, of d][ref3], bedoelde rechten beschikt en die openbaar vervoer, besloten
      busvervoer of taxivervoer verrichten dan wel werkzaamheden verrichten die daarmee rechtstreeks samenhangen, niet
      bevoordelen boven anderen waarmee die vervoerders in concurrentie treden of anderszins voordelen toekennen die
      verder gaan dan in het normaal handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: '69.3'
    text: |-
      Als toekenning van voordelen die verder gaan dan in het normaal handelsverkeer gebruikelijk is als bedoeld in het
      tweede lid wordt in ieder geval aangemerkt:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
  - number: 69.3.a
    text: |-
      het leveren van goederen of diensten tegen een vergoeding die lager is dan de redelijkerwijs daaraan toe te rekenen
      kosten;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
  - number: 69.3.b
    text: |-
      het ter beschikking stellen van financiële middelen anders dan ten laste van het eigen vermogen dan wel ten laste
      van het eigen vermogen anders dan tegen een in het handelsverkeer gebruikelijke vergoeding;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
  - number: 69.3.c
    text: |-
      het verstrekken van gegevens over individuele gebruikers van openbaar vervoer, tenzij deze onder gelijke
      voorwaarden ook ter beschikking worden gesteld aan derden die met de betrokken onderneming in concurrentie treden;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
  - number: 69.3.d
    text: |-
      het toestaan van het gebruik van de naam en het beeldmerk van het openbaar vervoerbedrijf op een wijze waardoor
      verwarring bij het publiek is te duchten over de herkomst van goederen en diensten.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
  - number: '69.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere vormen van toekenning van voordelen dan die, bedoeld in het derde
      lid, worden aangemerkt als vormen die verder gaan dan in het normaal handelsverkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
  - number: '69.5'
    text: |-
      Het gemeentelijk vervoerbedrijf doet jaarlijks over het voorafgaande boekjaar een verklaring van een onafhankelijke
      deskundige opmaken, waaruit blijkt of de financiële verhouding tussen het gemeentelijk vervoerbedrijf en de in het
      tweede lid bedoelde vervoerders voldoet aan de in dat lid gestelde eisen. Deze verklaring ligt voor een ieder ter
      inzage op alle kantoren van het gemeentelijk vervoerbedrijf.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
  - number: '69.6'
    text: |-
      Dit artikel is niet van toepassing ten aanzien van een gemeentelijk vervoerbedrijf zodra het openbaar vervoer,
      bedoeld in [artikel 53, tweede lid, onderdeel a][ref1], voor ten minste een gedeelte dat naar omzet berekend
      ten minste twee derde beloopt, wordt verricht krachtens een concessie welke is verleend na een procedure van
      aanbesteding.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '53'
        hoofdstuk: III
        paragraaf: '2'
  - number: '70.1'
    text: |-
      Het is verboden zonder hiervoor geldig vervoerbewijs gebruik te maken van het openbaar vervoer, alsmede, voor zover
      de vervoerder zulks duidelijk kenbaar heeft gemaakt, van de daartoe behorende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel70
  - number: '70.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing in de bij algemene maatregel van bestuur bepaalde
      gevallen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel70
  - number: '71'
    text: |-
      Het is verboden een onbevoegd gewijzigd of anderszins bewerkt vervoerbewijs te gebruiken, een vervoerbewijs te
      misbruiken of de controle van vervoerbewijzen te belemmeren of te verhinderen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel71
  - number: '72'
    text: |-
      Het is verboden gebruik te maken van het openbaar vervoer en de daartoe behorende voorzieningen op zodanige wijze
      dat orde, rust, veiligheid of een goede bedrijfsgang wordt of kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel72
  - number: '73'
    text: |-
      Een ieder die kennelijk gebruik wenst te maken van het openbaar vervoer of de daartoe behorende voorzieningen, is
      verplicht de aanwijzingen betreffende de orde, rust, veiligheid of een goede bedrijfsgang op te volgen, die door of
      vanwege de vervoerder die openbaar vervoer verricht, duidelijk kenbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel73
  - number: '74.1'
    text: 'Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel74
  - number: 74.1.a
    text: hetgeen onder verstoring van orde, rust, veiligheid of een goede bedrijfsgang wordt verstaan;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel74
  - number: 74.1.b
    text: |-
      de wijze waarop de in [artikel 73][ref1] bedoelde aanwijzingen onder meer kunnen worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel73
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '73'
        hoofdstuk: IV
  - number: '74.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld over onder meer:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel74
  - number: 74.2.a
    text: het gebruik van vervoerbewijzen;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel74
  - number: 74.2.b
    text: de verplichting tot betaling en het recht op terugbetaling.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel74
  - number: '75'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1]
      is[ titel 4.2 van die wet][ref2] van toepassing op de bijdrage voor exploitatie van openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '76'
    text: Onze Minister verleent aan de concessieverlener een bijdrage voor de exploitatie van openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel76
  - number: '77'
    text: |-
      Bij de berekening van de bijdrage voor exploitatie van openbaar vervoer wordt uitgegaan van het gebruik van het
      openbaar vervoer, voor zover dit niet wordt verricht krachtens een ontheffing als bedoeld in [artikel 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel29
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '29'
        hoofdstuk: II
        paragraaf: '2'
  - number: '78'
    text: |-
      Onze Minister kan bij de verlening van een bijdrage aan de concessieverlener het in [artikel 77][ref1] bedoelde
      gebruik van openbaar vervoer geheel of gedeeltelijk buiten beschouwing laten, indien de concessieverlener:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel77
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '77'
        hoofdstuk: V
  - number: 78.a
    text: |-
      niet of niet tijdig heeft voldaan aan een verplichting als bedoeld in de [artikelen 61, eerste lid][ref1], en
      [65, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel65
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '65'
        hoofdstuk: III
        paragraaf: '5'
  - number: 78.b
    text: |-
      in strijd heeft gehandeld met de beperkingen waaronder een ontheffing als bedoeld in de
      [artikelen 61, tweede lid][ref1], en [67, eerste lid][ref2], is verleend of met de voorschriften die daaraan zijn
      verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel67
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '67'
        hoofdstuk: III
        paragraaf: '5'
  - number: 78.c
    text: |-
      een concessie heeft verleend in strijd met de [artikelen 23][ref1] en [52][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel52
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '23'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '52'
        hoofdstuk: III
        paragraaf: '2'
  - number: '79.1'
    text: |-
      In afwijking van [artikel 4:29 van de Algemene wet bestuursrecht][ref1] wordt de bijdrage jaarlijks verleend voor
      de aanvang van het jaar waarop de bijdrage betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '79.2'
    text: |-
      In afwijking van het eerste lid kunnen incidentele aanvullingen op de verleende bijdrage worden verleend in de loop
      van het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel79
  - number: '80'
    text: |-
      Onverminderd [artikel 4:48 van de Algemene wet bestuursrecht][ref1] kan, zolang de bijdrage niet is vastgesteld,
      de verlening worden ingetrokken of ten nadele van de concessieverlener worden gewijzigd, indien sprake is van een
      omstandigheid als bedoeld in [artikel 78, onderdelen a, b of c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel78
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '78'
        hoofdstuk: V
  - number: '81'
    text: |-
      De bijdrage wordt vastgesteld in het jaar na het jaar waarop de bijdrage betrekking heeft. Onverminderd
      [artikel 4:46, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de bijdrage gewijzigd worden vastgesteld,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 81.a
    text: het gebruik van openbaar vervoer in het jaar waarop de bijdrage betrekking heeft, is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel81
  - number: 81.b
    text: |-
      sprake is van een omstandigheid als bedoeld in [artikel 78, onderdelen a, b of c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel78
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '78'
        hoofdstuk: V
  - number: 81.c
    text: de hoogte van lonen of prijzen in het jaar waarop de bijdrage betrekking heeft, is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel81
  - number: '82'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de te verstrekken bijdrage en kunnen
      regels worden gesteld over de daaraan te verbinden verplichtingen. Deze regels bevatten in ieder geval bepalingen
      over:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel82
  - number: 82.a
    text: de berekening van de bijdrage;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel82
  - number: 82.b
    text: de berekening van de vervoeropbrengsten;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel82
  - number: 82.c
    text: |-
      de wijze waarop toepassing wordt gegeven aan de [artikelen 78][ref1] en [81, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel81
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '78'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '81'
        hoofdstuk: V
  - number: 82.d
    text: de betaling, intrekking, wijziging en terugvordering van de bijdrage en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel82
  - number: 82.e
    text: |-
      de gegevens die de concessieverlener of concessiehouder ten behoeve van de verlening en vaststelling van de
      bijdrage dient te verstrekken;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel82
  - number: 82.f
    text: de controle op, alsmede de verantwoording en administratie van de besteding van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel82
  - number: '83.1'
    text: |-
      Ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties dan wel om redenen van internationaal
      vervoerbeleid kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel83
  - number: 83.1.a
    text: openbaar vervoer, besloten busvervoer en taxivervoer dat de Nederlandse grens overschrijdt;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel83
  - number: 83.1.b
    text: |-
      openbaar vervoer, besloten busvervoer en taxivervoer dat door een in Nederland gevestigde vervoerder geheel buiten
      Nederland wordt verricht;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel83
  - number: 83.1.c
    text: |-
      het rijden met een lege bus of auto over voor het openbaar verkeer openstaande wegen in Nederland of het rijden met
      een lege bus of auto door een in Nederland gevestigde vervoerder geheel of ten dele buiten Nederland, voor zover
      dat verband houdt met het verrichten van openbaar vervoer, besloten busvervoer of taxivervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel83
  - number: '83.2'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen mede betrekking hebben op de vergoeding die de aanvrager is
      verschuldigd voor de behandeling van de aanvraag om verlening of wijziging van de voor dat vervoer benodigde
      documenten.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel83
  - number: '84.1'
    text: Onze Minister kan een maximumtarief voor taxivervoer vaststellen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel84
  - number: '84.2'
    text: |-
      Het maximumtarief geldt niet indien schriftelijk een tarief wordt overeengekomen voor het gedurende een bepaalde
      periode meermalen verrichten van taxivervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel84
  - number: '85'
    text: |-
      Het is verboden taxivervoer te verrichten tegen een hoger tarief dan het tarief, bedoeld in
      [artikel 84, eerste lid][ref1], tenzij een overeenkomst als bedoeld in [artikel 84, tweede lid][ref2], is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel84
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '86'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel86
  - number: 86.a
    text: de minimale beschikbaarheid van het taxivervoer;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel86
  - number: 86.b
    text: het kenbaar maken van de tarieven aan de reiziger;
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel86
  - number: 86.c
    text: |-
      de administratie die de vervoerder dient te voeren ten behoeve van een doelmatig toezicht op de naleving van het
      bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel86
  - number: '87.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel87
  - number: '87.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn voorts belast de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren en de met betrekking tot deze wet
      krachtens [artikel 17, eerste lid, onder 2°, van de Wet op de economische delicten][ref2] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '17'
  - number: '87.3'
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid zijn met het toezicht op de naleving van het bij of krachtens
      de [artikelen 70 tot en met 74][ref1] bepaalde mede belast personen die daartoe door de vervoerder zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '70'
        hoofdstuk: IV
  - number: '87.4'
    text: |-
      Met het toezicht op de naleving van het bepaalde in [artikel 69, eerste en vijfde lid][ref1], zijn belast de bij
      besluit van de directeur-generaal aangewezen ambtenaren van de Nederlandse mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '5'
  - number: '87.5'
    text: |-
      Van een besluit als bedoeld in het eerste lid of vierde lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel87
  - number: '88.1'
    text: Onze Minister kan met betrekking tot het toezicht op de naleving beleidsregels vaststellen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel88
  - number: '88.2'
    text: |-
      Beleidsregels die betrekking hebben op het toezicht door ambtenaren als bedoeld in [artikel 87, vierde lid][ref1],
      worden vastgesteld in overeenstemming met Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '89.1'
    text: |-
      Met het opsporen van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de met betrekking tot deze wet
      krachtens [artikel 17, eerste lid, onder 2°, van de Wet op de economische delicten][ref2] aangewezen
      ambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '89.2'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn voorts belast de bij besluit van
      Onze Minister en Onze Minister van Justitie gezamenlijk aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel89
  - number: '89.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel89
  - number: '90'
    text: |-
      De in [artikel 87][ref1] bedoelde ambtenaren en personen beschikken niet over de bevoegdheden, bedoeld in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '91'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15 tot en met 5:17][ref3], [5:19][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing ten aanzien van de in
      [artikel 89][ref6] bedoelde ambtenaren en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0011470#Artikel89
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0011470
        artikel: '89'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '92'
    text: |-
      De reiziger is op eerste vordering van de in de [artikelen 87][ref1] en [89][ref2] bedoelde ambtenaren en
      personen, indien deze hebben vastgesteld dat de reiziger in strijd heeft gehandeld met de [artikelen 70][ref3]
      of [71][ref4], verplicht tot het terstond ter inzage verstrekken van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref5] of een geldig rijbewijs dat is afgegeven op basis van de
      Wegenverkeerswet dan wel een geldig rijbewijs als bedoeld in [artikel 107 van de Wegenverkeerswet 1994][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel71
      [ref5]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '70'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '71'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '107'
  - number: '93'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel93
  - number: '94.1'
    text: |-
      Ingeval van overtreding van [artikel 69, eerste of vijfde lid][ref1], kan de directeur-generaal de rechtspersoon
      aan wie het gemeentelijk vervoerbedrijf toebehoort, een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '5'
  - number: '94.2'
    text: |-
      De in het eerste lid bedoelde last strekt ertoe de overtreding ongedaan te maken dan wel herhaling van de
      overtreding te voorkomen. Aan een last kunnen voorschriften worden verbonden inzake het verstrekken van gegevens
      aan de directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel94
  - number: '94.3'
    text: Een last geldt voor een door de directeur-generaal te bepalen termijn van ten hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel94
  - number: '94.4'
    text: |-
      De [artikelen 5:32, vierde en vijfde lid][ref1], [5:33][ref2], [5:34, eerste lid][ref3], en
      [5:35 van de Algemene wet bestuursrecht][ref4] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011470/2004-08-20#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
