  - number: '3.2'
    text: |-
      De voordracht voor een algemene maatregel van bestuur waarbij wordt afgeweken van deze wet wordt niet eerder gedaan
      dan vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel3
  - number: 3a
    text: Deze paragraaf is van toepassing op openbaar vervoer, anders dan per trein, en besloten busvervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel3a
  - number: '4.1'
    text: |-
      Het is verboden openbaar vervoer anders dan per trein of besloten busvervoer te verrichten zonder een daartoe
      verleende vergunning voor collectief personenvervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel4
  - number: '4.2'
    text: Het is verboden taxivervoer te verrichten zonder een daartoe verleende vergunning.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel4
  - number: '4.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt met het verrichten van besloten busvervoer, respectievelijk
      taxivervoer, gelijkgesteld het aanbieden van dat vervoer, tenzij dit aanbieden geschiedt door tussenpersonen die
      bemiddelen in dat vervoer bij wijze van dienstverlening of in de uitoefening van hun beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel4
  - number: '5'
    text: Onze Minister beslist op een aanvraag voor een vergunning.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel5
  - number: 5a.1
    text: |-
      De vervoerder die openbaar vervoer, besloten busvervoer of taxivervoer verricht, alsmede de bestuurder van een bus
      of auto waarmee openbaar vervoer, besloten busvervoer of taxivervoer wordt verricht, draagt er zorg voor dat in de
      bus of auto waarmee dat vervoer wordt verricht een geldig vergunningbewijs aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel5a
  - number: 5a.2
    text: |-
      De vervoerder die taxivervoer verricht, alsmede de bestuurder van een auto waarmee taxivervoer wordt verricht,
      draagt er zorg voor dat in de auto waarmee dat vervoer wordt verricht het vergunningbewijs zichtbaar voor de
      reiziger aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel5a
  - number: 5a.3
    text: Vergunningbewijzen kunnen op aanvraag door Onze Minister worden verstrekt aan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel5a
  - number: '6.1'
    text: Een vergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel6
  - number: '6.2'
    text: |-
      Een vergunning kan worden geweigerd, gewijzigd, geschorst of ingetrokken. Een vergunning wordt geschorst voor
      bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel6
  - number: '6.3'
    text: |-
      Een vergunning wordt steeds geweigerd, indien binnen een periode van twee jaar direct voorafgaande aan de datum van
      indiening van een aanvraag voor een vergunning een eerder aan de aanvrager verleende vergunning is ingetrokken op
      grond van [artikel 99, onderdeel a, of onderdeel b][ref1], voor zover het betreft de eis van betrouwbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel99
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '99'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '6.4'
    text: |-
      De vergunning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '6.5'
    text: |-
      Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '6.6'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel6
  - number: '6.7'
    text: |-
      De beperkingen waaronder een vergunning wordt verleend en de aan een vergunning verbonden voorschriften kunnen
      ambtshalve of op aanvraag worden gewijzigd, geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel6
  - number: '7.1'
    text: 'Een vergunning vervalt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: 7.1.a
    text: |-
      zes maanden na het overlijden of het intreden van wettelijke onbekwaamheid van degene aan wie de vergunning is
      verleend;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: 7.1.b
    text: zodra de rechtspersoon waaraan de vergunning is verleend, heeft opgehouden te bestaan;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: 7.1.c
    text: |-
      zodra de overeenkomst van de vennootschap zonder rechtspersoonlijkheid of de maatschap waaraan de vergunning is
      verleend, is ontbonden;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: 7.1.d
    text: zodra degene aan wie de vergunning is verleend, zijn activiteiten als vervoerder heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: '7.2'
    text: |-
      Belanghebbenden kunnen binnen zes maanden na het overlijden of na het intreden van de wettelijke onbekwaamheid,
      bij Onze Minister een aanvraag indienen om de vergunning te stellen op naam van de erfgenaam of, indien er meer
      erfgenamen zijn, op naam van de gezamenlijke erven, dan wel op naam van één of meer door de belanghebbenden
      aangewezen vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister beslist binnen drie maanden op de aanvraag, bedoeld in het tweede lid. Indien Onze Minister de
      aanvraag inwilligt, geschiedt dat voor een periode van ten hoogste één jaar na het verstrijken van de in het eerste
      lid, onderdeel a, bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: '7.4'
    text: |-
      De in het derde lid bedoelde periode van één jaar kan door Onze Minister eenmaal met ten hoogste een half jaar
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: '7.5'
    text: |-
      Het eerste lid vindt geen toepassing zolang Onze Minister nog niet onherroepelijk op de in het tweede lid bedoelde
      aanvraag heeft beslist.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verlening, weigering,
      wijziging, schorsing of intrekking van een vergunning en de aan een vergunning verbonden voorschriften en
      beperkingen. Deze regels bevatten in ieder geval bepalingen over:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel8
  - number: 8.a
    text: de wijze waarop een aanvraag om verlening, wijziging of intrekking van een vergunning wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel8
  - number: 8.b
    text: de termijn waarbinnen op een aanvraag wordt beslist;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel8
  - number: 8.c
    text: de afgifte, geldigheid en het gebruik van vergunningbewijzen voor bussen en auto's;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel8
  - number: 8.d
    text: |-
      de vergoeding die de aanvrager is verschuldigd voor de behandeling van een aanvraag als bedoeld in onderdeel a en
      voor de afgifte van vergunningbewijzen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel8
  - number: '9.1'
    text: |-
      Een vergunning wordt, behoudens in bij algemene maatregel van bestuur aan te geven gevallen, slechts verleend aan
      een vervoerder die voldoet aan eisen van betrouwbaarheid, kredietwaardigheid en vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: '9.2'
    text: Onze Minister kan ontheffing verlenen van de in het eerste lid bedoelde eis van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: '9.3'
    text: |-
      Een ontheffing als bedoeld in het tweede lid kan onder beperkingen worden verleend en aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: '9.4'
    text: |-
      Onze Minister kan een ontheffing, de beperkingen waaronder een ontheffing is verleend en de aan een ontheffing
      verbonden voorschriften ambtshalve of op aanvraag wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: '9.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: 9.5.a
    text: de eisen van betrouwbaarheid, kredietwaardigheid en vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: 9.5.b
    text: de gevallen waarin Onze Minister ontheffing kan verlenen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: 9.5.c
    text: de beperkingen waaronder een ontheffing kan worden verleend;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: 9.5.d
    text: de voorschriften die aan een ontheffing kunnen worden verbonden;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: 9.5.e
    text: |-
      de vergoeding die is verschuldigd voor de behandeling van de aanvraag om verlening van een ontheffing alsmede
      voor afgifte van verklaringen van Onze Minister betreffende het voldoen aan eisen van kredietwaardigheid of
      vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: '9.6'
    text: |-
      Voor zover dit noodzakelijk is om vast te stellen of wordt voldaan aan de eisen bedoeld in het eerste lid, kan Onze
      Minister gegevens omtrent gedrag en strafrechtelijke gegevens verwerken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel9
  - number: '11.1'
    text: 'Het is de houder van een vergunning verboden te handelen in strijd met:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel11
  - number: 11.1.a
    text: |-
      een vergunning, de beperkingen waaronder een vergunning is verleend en de aan een vergunning verbonden
      voorschriften;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel11
  - number: 11.1.b
    text: de beperkingen waaronder een ontheffing is verleend en de aan een ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel11
  - number: '11.2'
    text: |-
      Het is de houder van een vergunning verboden een vergunningbewijs al dan niet tegen betaling ter beschikking te
      stellen van een derde ten behoeve van het verrichten van vervoer, als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
  - number: '11.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op degene aan wie door de houder van een vergunning een
      vergunningbewijs ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel11
  - number: '12.1'
    text: |-
      De vervoerder voorziet, al dan niet in samenwerking met andere vervoerders, in het op verzoek behandelen
      van geschillen over de totstandkoming of de uitvoering van een vervoersovereenkomst als bedoeld in de
      [artikelen 80, eerste lid][ref1], en [100, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2], door
      instelling van een geschillencommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel100
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '100'
  - number: '12.2'
    text: |-
      De geschillencommissie bestaat uit een oneven aantal leden, waarvan ten minste één
      voldoet aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar, bedoeld in
      [artikel 1d van de Wet rechtspositie rechterlijke ambtenaren][ref1] en waarvan de voorzitter onafhankelijk is van
      de overige leden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008365
  - number: '12.3'
    text: |-
      Bij de samenstelling van de geschillencommissie wordt aan geen van de bij het geschil betrokken partijen een
      bevoorrechte positie toegekend.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel12
  - number: '12.4'
    text: |-
      De geschillencommissie beslecht een aan haar voorgelegd geschil door het uitbrengen van een bindend advies of door
      het bewerkstelligen van een minnelijke schikking tussen partijen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel12
  - number: '12.5'
    text: De geschillencommissie stelt een reglement vast over de wijze waarop een geschil wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel12
  - number: '13.1'
    text: |-
      De vervoerder maakt op een naar de aard van het vervoer geëigende wijze kenbaar op welke wijze klachten over het
      verrichten van personenvervoer worden behandeld.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel13
  - number: '13.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel13
  - number: '14.1'
    text: |-
      De vervoerder verstrekt onder redelijke en objectief gerechtvaardigde voorwaarden gegevens omtrent het door
      hem te verrichten vervoer aan degene die hierom verzoekt ten behoeve van het voeden en actualiseren van een
      reisinformatiesysteem.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel14
  - number: '14.2'
    text: |-
      Vervoerders die openbaar vervoer verrichten dragen op zodanige wijze financieel bij aan een door Onze Minister aan
      te wijzen exploitant van een reisinformatiesysteem met een landelijk bereik, dat daardoor de instandhouding van dat
      systeem is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel14
  - number: '14.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de aard van gegevens als bedoeld
      in het eerste lid, de gevallen waarin Onze Minister een exploitant aanwijst, en over de wijze waarop aan het tweede
      lid toepassing wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel14
  - number: '15'
    text: De raad van bestuur van de mededingingsautoriteit verricht taken ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel15
  - number: '16.1'
    text: |-
      In afwijking van [artikel 5d, eerste lid, van de Mededingingswet][ref1] kan Onze Minister beleidsregels vaststellen
      met betrekking tot de uitoefening van de in deze wet aan de raad van bestuur van de mededingingsautoriteit
      toegekende bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5d
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 5d
  - number: '16.2'
    text: |-
      Indien beleidsregels als bedoeld in het eerste lid betrekking hebben op de interpretatie van mededingingsbegrippen,
      stelt Onze Minister die regels vast in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel16
  - number: '16.3'
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel16
  - number: '17.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt jaarlijks vóór 1 juli een verslag op van zijn werkzaamheden
      op grond van deze wet in het afgelopen kalenderjaar. Het verslag beschrijft de taakuitoefening en het gevoerde
      beleid. Het verslag wordt aan Onze Minister en aan Onze Minister van Economische Zaken gezonden en algemeen
      verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister brengt het verslag, vergezeld van zijn bevindingen daaromtrent, voor 1 september daarop volgend ter
      kennis van de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel17
  - number: '18'
    text: |-
      Gegevens of inlichtingen omtrent een onderneming, die in verband met enige werkzaamheid ten behoeve van de
      uitvoering van deze wet zijn verkregen door de Nederlandse Mededingingsautoriteit, mogen uitsluitend worden
      gebruikt voor de toepassing van deze wet en de [Mededingingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '19.1'
    text: Het is verboden openbaar vervoer te verrichten zonder daartoe verleende concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel19
  - number: '19.2'
    text: |-
      Indien op grond van [artikel 42][ref1] of [43][ref2] een concessie is opgehouden te bestaan, kan maximaal één jaar
      openbaar vervoer worden verricht zonder concessie volgens bij ministeriële regeling nader te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel43
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '43'
        hoofdstuk: II
        paragraaf: '4'
  - number: '19.3'
    text: |-
      Het eerste lid geldt niet ten aanzien van vervoer per trein verricht door internationale samenwerkingsverbanden
      als bedoeld in [richtlijn 91/440/EEG](31991L0440) van de Raad van de Europese Gemeenschappen van 29 juli 1991
      betreffende de ontwikkeling van de spoorwegen in de Gemeenschap (PbEG L 237) voor zover de in artikel 10 van die
      richtlijn bedoelde diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel19
  - number: '20.1'
    text: Bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer per trein is Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel20
  - number: '20.2'
    text: |-
      Bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer, anders dan openbaar vervoer
      per trein, zijn gedeputeerde staten, met uitzondering van concessies voor openbaar vervoer in een plusregio als
      bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente of gemeenten Amsterdam,
      Arnhem en Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, 's-Gravenhage, Rotterdam of Utrecht omvat.
      De concessies in die plusregio’s worden verleend, gewijzigd of ingetrokken door het dagelijks bestuur van de
      desbetreffende plusregio.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: '20.3'
    text: |-
      In afwijking van het eerste lid is het bestuur, bedoeld in het tweede lid, bevoegd tot het verlenen, wijzigen of
      intrekken van concessies voor regionaal openbaar vervoer per trein voor de bij algemene maatregel van bestuur dan
      wel in overeenstemming met het betrokken bestuur bij besluit van Onze Minister aangewezen vervoersdiensten die de
      daarbij aangeven stations verbinden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel20
  - number: '20.4'
    text: |-
      In afwijking van het tweede lid zijn burgemeester en wethouders van een gemeente als bedoeld in [artikel 120][ref1]
      bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer, anders dan openbaar vervoer
      per trein, ten behoeve van die gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel120
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '120'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '21'
    text: |-
      Gedeputeerde staten dragen zorg voor de coördinatie en afstemming van het openbaar vervoer in de provincie, met
      uitzondering van de plusregio’s, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '22'
    text: |-
      De concessieverleners, bedoeld in [artikel 20][ref1], zijn bevoegd subsidies te verstrekken voor het in een
      concessie omschreven openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23.1'
    text: 'Geen concessie wordt verleend aan een vervoerder:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel23
  - number: 23.1.a
    text: |-
      van wie een geheel of gedeeltelijke eigenaar, dan wel een bestuurder of commissaris tevens het lidmaatschap
      bekleedt van een algemeen vertegenwoordigend orgaan van een openbaar lichaam waarvan een bestuursorgaan bevoegd is
      tot het verlenen van die concessie;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel23
  - number: 23.1.b
    text: |-
      voor wie een vertegenwoordiger of adviseur werkzaam is die betrokken is bij het meedingen naar of het verwerven van
      die concessie, en die tevens het lidmaatschap bekleedt van een algemeen vertegenwoordigend orgaan van een openbaar
      lichaam waarvan een bestuursorgaan bevoegd is tot het verlenen van die concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel23
  - number: '23.2'
    text: Het eerste lid, onderdeel b, is van overeenkomstige toepassing op de burgemeester en de commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel23
  - number: '23.3'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing ten aanzien van een bestuurder of commissaris bij een
      vervoerbedrijf als bedoeld in [artikel 64][ref1] bij verlening van concessies waaraan geen procedure van
      aanbesteding vooraf is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: '23.4'
    text: |-
      Het eerste lid geldt niet ten aanzien van het verlenen van concessies voor openbaar vervoer per trein op grond van
      [artikel 20, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '24.1'
    text: De concessieverlener verleent een concessie voor een in de concessie vastgesteld tijdvak van ten hoogste acht jaar.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister kan op aanvraag van een concessieverlener ontheffing verlenen van de maximale termijn van acht jaar,
      bedoeld in het eerste lid, indien:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: 24.2.a
    text: |-
      de concessie gepaard gaat met noodzakelijke en aanzienlijke investeringen door de concessiehouder in onlosmakelijk
      met de concessie samenhangende infrastructuur;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: 24.2.b
    text: |-
      een concessie voor openbaar vervoer per metro, tram of een via een geleidesysteem voortbewogen voertuig gepaard
      gaat met aanzienlijke investeringen door de concessiehouder in voor de uitvoering van de concessie noodzakelijk
      materieel;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: 24.2.c
    text: |-
      de concessie zowel openbaar vervoer per trein als ander openbaar vervoer omvat en ten aanzien van het openbaar
      vervoer per trein met inachtneming van het vierde tot en met zesde lid een langere concessieduur kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: '24.3'
    text: |-
      Een ontheffing als bedoeld in het tweede lid kan onder beperkingen worden verleend en aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: '24.4'
    text: |-
      Het eerste tot en met derde lid geldt niet ten aanzien van concessies voor openbaar vervoer per trein. Een
      concessie voor openbaar vervoer per trein vervalt op een in de concessie te bepalen tijdstip. Dit tijdstip
      wordt zodanig vastgesteld dat daarmee naar het oordeel van de concessieverlener evenwicht bestaat tussen de op
      het stimuleren van de kwaliteit van het openbaar vervoer gerichte duur van de concessie en de stabiliteit en
      continuïteit van het openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: '24.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de duur van concessies voor
      openbaar vervoer per trein.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: '24.6'
    text: |-
      Een concessie vervalt in elk geval vijftien jaar na de eerste dag waarop de concessiehouder ingevolge de concessie
      verplicht is openbaar vervoer te verrichten.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel24
  - number: '25.1'
    text: |-
      Een concessie bevat een omschrijving van het openbaar vervoer en van het gebied waarvoor de concessie is verleend
      alsmede de prijs die de concessiehouder betaalt voor de concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel25
  - number: '25.2'
    text: |-
      Een concessie kan tevens betrekking hebben op het verrichten van openbaar vervoer van en naar het gebied, bedoeld
      in het eerste lid, indien dit is overeengekomen met de concessieverleners die het betreft.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel25
  - number: '25.3'
    text: |-
      In afwijking van het eerste lid bevat een concessie voor openbaar vervoer per trein, in plaats van een omschrijving
      van het gebied waarvoor de concessie is verleend, een omschrijving van de stations waartussen het openbaar vervoer
      wordt afgewikkeld.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel25
  - number: '25.4'
    text: |-
      Bij de concessieovereenkomst en de daarbij behorende financiële afspraken wordt rekening gehouden met de voor de
      concessiehouder geldende gebruiksvergoeding, bedoeld in [artikel 62 van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel62
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '62'
  - number: '26.1'
    text: |-
      Voordat een concessie wordt verleend of gewijzigd, pleegt de concessieverlener, bedoeld in
      [artikel 20, tweede, derde en vierde lid][ref1], overleg met de concessieverleners die bevoegd zijn tot het
      verlenen van concessies in aangrenzende gebieden. Het overleg voorziet in ieder geval in afspraken inzake de
      afstemming van het openbaar vervoer tussen aangrenzende concessiegebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een concessie als bedoeld in [artikel 25, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel25
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
  - number: '26.3'
    text: |-
      Onze Minister kan, indien de in het eerste lid bedoelde afstemming onvoldoende gestalte krijgt, aan de betrokken
      concessieverleners een aanwijzing geven ter waarborging van die afstemming.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel26
  - number: '26.4'
    text: |-
      Een aanwijzing als bedoeld in het derde lid wordt niet gegeven dan nadat overleg is gepleegd tussen Onze Minister
      en de betrokken concessieverleners.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel26
  - number: '27.1'
    text: |-
      Voordat een concessie wordt verleend of gewijzigd, vraagt de concessieverlener advies aan consumentenorganisaties
      die voldoen aan bij algemene maatregel van bestuur gestelde voorwaarden, over de aan de concessie te verbinden
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel27
  - number: '27.2'
    text: |-
      De concessieverlener stelt de consumentenorganisaties in de gelegenheid met hem overleg te voeren voordat advies
      wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel27
  - number: '27.3'
    text: |-
      Het advies, bedoeld in het tweede lid, wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke invloed
      kan zijn op het voornemen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel27
  - number: '27.4'
    text: |-
      De consumentenorganisaties worden door de concessieverlener zo spoedig mogelijk in kennis gesteld van de wijze
      waarop aan het uitgebrachte advies gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel27
  - number: 27a.1
    text: |-
      Voordat een concessie voor spoorvervoer per trein over de hoofdspoorweginfrastructuur wordt verleend, vraagt Onze
      Minister advies aan de betrokken beheerder, bedoeld in [artikel 1 van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
  - number: 27a.2
    text: |-
      [Artikel 27, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '28'
    text: |-
      De concessieverlener informeert ten minste eenmaal per jaar de consumentenorganisaties, bedoeld in
      [artikel 27][ref1], over de resultaten van bij algemene maatregel van bestuur te omschrijven maatregelen die door
      hem zijn genomen en die de belangen van de reiziger raken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '29.1'
    text: |-
      De concessieverlener kan een ontheffing verlenen van het verbod, bedoeld in [artikel 19][ref1], aan een vervoerder
      die openbaar vervoer anders dan openbaar vervoer per trein, wil verrichten in een gebied waarvoor hem geen
      concessie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '29.2'
    text: De concessieverlener kan de ontheffing wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel29
  - number: '29.3'
    text: Een ontheffing wordt verleend voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel29
  - number: '29.4'
    text: |-
      Een ontheffing kan slechts worden geweigerd, indien naar het oordeel van de concessieverlener de
      vervoersvoorziening waarvoor een ontheffing is aangevraagd, een zodanige gelijkenis vertoont met openbaar vervoer
      waarvoor een concessie is verleend voor het gebied, bedoeld in het eerste lid, dat daarmee een onevenredige afbreuk
      wordt gedaan aan de exploitatie van die concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel29
  - number: '29.5'
    text: De concessieverlener kan de ontheffing onder beperkingen verlenen of aan de ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel29
  - number: 29a
    text: |-
      Een besluit tot verlening of wijziging van een concessie zonder dat daartoe een aanbesteding is gehouden, kan
      worden genomen indien de vervoerder niet binnen vier dagen na de dag waarop het voorgenomen besluit aan hem is
      bekendgemaakt aan de concessieverlener heeft doen blijken dat hij de concessie niet zonder voorbehoud aanvaardt.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel29a
  - number: '30.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over nationale vervoerbewijzen, de
      daaraan te stellen eisen, de daarbij behorende tarieven en vervoersvoorwaarden, alsmede het gebied waarbinnen deze
      geldig zijn.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel30
  - number: '30.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de invoering, de acceptatie, de
      uitgifte, de exploitatie of het beheer van elektronische nationale vervoerbewijzen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel30
  - number: '30.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de erkenning van een of meer
      instellingen die elektronische nationale vervoerbewijzen uitgeven, exploiteren of beheren, alsmede over de
      voorschriften waaraan dergelijke instellingen moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel30
  - number: '30.4'
    text: |-
      De houder van een concessie, verleend door een concessieverlener als bedoeld in
      [artikel 20, tweede of vierde lid][ref1], is verplicht reizigers te vervoeren die daartoe beschikken over een voor
      het concessiegebied geldig nationaal vervoerbewijs tegen het daarbij behorende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '31.1'
    text: |-
      De concessiehouder vraagt ten minste eenmaal per jaar advies aan consumentenorganisaties die voldoen aan bij
      algemene maatregel van bestuur gestelde voorwaarden, over de door de concessiehouder voorgenomen wijziging van een
      dienstregeling, het tarief en overige in de concessie geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel31
  - number: '31.2'
    text: |-
      De concessiehouder stelt de consumentenorganisaties in de gelegenheid met hem overleg te voeren voordat advies
      wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel31
  - number: '31.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de aard van onderwerpen als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel31
  - number: '31.4'
    text: |-
      Het advies, bedoeld in het eerste lid, wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan
      zijn op de door de concessiehouder te nemen beslissing.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel31
  - number: '31.5'
    text: |-
      Indien na het advies van de consumentenorganisaties een beslissing wordt genomen ten aanzien van de onderwerpen,
      bedoeld in het eerste lid, worden de consumentenorganisaties door de concessiehouder zo spoedig mogelijk, doch
      uiterlijk zes weken voor deze gevolg geeft aan de beslissing, schriftelijk hiervan in kennis gesteld. Indien het
      advies van de consumentenorganisaties niet of niet geheel is gevolgd, wordt aan de consumentenorganisaties tevens
      meegedeeld, waarom van dat advies is afgeweken en wordt hen de gelegenheid geboden nader te overleggen met de
      concessiehouder alvorens deze gevolg geeft aan de beslissing.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel31
  - number: '31.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de termijnen die bij de
      adviesprocedure en de overlegprocedure, bedoeld in dit artikel, in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel31
  - number: '32.1'
    text: De concessieverlener kan aan een concessie voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: '32.2'
    text: 'Aan een concessie worden in ieder geval voorschriften verbonden ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.a
    text: |-
      de onderwerpen waarover en de consumentenorganisaties waaraan de concessiehouder advies vraagt als bedoeld in
      [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel31
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '31'
        hoofdstuk: II
        paragraaf: '3'
  - number: 32.2.b
    text: |-
      de onderwerpen waarover en de wijze waarop de concessiehouder de consumentenorganisaties, bedoeld in onderdeel
      a, informeert;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.c
    text: |-
      het verstrekken van informatie aan de concessieverlener ten behoeve van de controle op de uitvoering van de
      concessie;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.d
    text: |-
      de tarieven, de modellen van vervoerbewijzen en de vervoersvoorwaarden waartegen het openbaar vervoer moet worden
      verricht, alsmede de wijziging en openbaarmaking daarvan;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.e
    text: |-
      het opstellen van een financiële verantwoording van het uitvoeren van de concessie, welke verantwoording gescheiden
      is van die voor andere activiteiten;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.f
    text: de wijziging, de openbaarmaking, de datum van ingang en de geldigheidsduur van de dienstregeling;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.g
    text: de eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een handicap;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.h
    text: |-
      het waarborgen van een verantwoorde mate van veiligheid ten behoeve van zowel de reizigers als het personeel binnen
      het openbaar vervoer;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.i
    text: punctualiteit;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.j
    text: een procentuele beschikbaarheidsgarantie van zitplaatsen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: 32.2.k
    text: het zowel op stations als in de trein aan reizigers geboden serviceniveau.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: '32.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het minimale niveau van toegankelijkheid van het
      openbaar vervoer dat concessieverleners middels voorschriften dienen veilig te stellen bij concessieverlening. Deze
      regels bevatten in ieder geval eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met
      een handicap en eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een fiets.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: '32.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de aan een concessie te verbinden
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: '32.5'
    text: |-
      Aan een concessie kan het voorschrift worden verbonden dat de concessiehouder, indien hij tekortschiet in het
      verrichten van bepaalde prestaties, gehouden is een geldsom te voldoen aan de concessieverlener.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
  - number: '32.6'
    text: |-
      Indien toepassing is gegeven aan het vijfde lid is de concessieverlener niet bevoegd ten aanzien van het
      verrichten van de desbetreffende prestaties aan de concessiehouder een last onder dwangsom op te leggen.
      [Artikel 5:32, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 32a
    text: |-
      Onverminderd [artikel 32][ref1] bevat een concessie voor openbaar vervoer voorschriften tot regeling van de
      integratie van vervoerbewijzen in het openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel32
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '32'
        hoofdstuk: II
        paragraaf: '3'
  - number: 32b
    text: |-
      Een concessie voor openbaar vervoer per trein kan het voorschrift bevatten dat de in de concessie aan te duiden
      natuurlijke personen die de feitelijke leiding zullen uitoefenen over de uitvoering van de concessie, niet als
      zodanig krachtens een arbeidsovereenkomst met de concessiehouder werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel32b
  - number: '33'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een maximum gemiddeld tarief
      voor het openbaar vervoer, zonodig per concessiegebied.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel33
  - number: '34.1'
    text: |-
      De concessiehouder is verplicht openbaar vervoer te verrichten volgens hetgeen in de concessie is bepaald en is
      verplicht de daaraan verbonden voorschriften na te leven.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel34
  - number: '34.2'
    text: |-
      Voor zolang reizigers ernstig in hun belang worden geschaad als gevolg van de afwijking van de dienstregeling
      door werkzaamheden op de in de dienstregeling voorziene trajecten of door bijzondere omstandigheden, draagt de
      concessiehouder zorg voor vervangend vervoer voor zover dat redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel34
  - number: '35'
    text: |-
      Een ieder die enig recht kan doen gelden op bij algemene maatregel van bestuur te bepalen infrastructuur met
      uitzondering van hoofdspoorweginfrastructuur als bedoeld in de [Spoorwegwet][ref1], waarover openbaar vervoer per
      trein plaatsvindt, is verplicht het gebruik daarvan door de concessiehouder redelijkerwijs te gedogen voorzover dit
      voor de goede uitvoering van de concessie nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015007
  - number: '36.1'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder overgang van een concessie verstaan: het geheel of gedeeltelijk
      eindigen van een concessie gevolgd door het ingaan van geheel of gedeeltelijk dezelfde concessie als gevolg van
      verlening van deze concessie aan een andere vervoerder.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel36
  - number: '36.2'
    text: |-
      De [artikelen 37][ref1] en [38][ref2] zijn van toepassing op de overgang van een concessie,
      tenzij iets anders voortvloeit uit een overeenkomst tussen de voormalige concessiehouder,
      de nieuwe concessiehouder en de belanghebbende verenigingen van werknemers als bedoeld in
      [artikel 3, vierde lid, van de Wet melding collectief ontslag][ref3], welke overeenkomst is tot stand gekomen
      binnen een maand na het besluit tot verlening van een concessie als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003026
        artikel: '3'
  - number: '37.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 662][ref1] en [663 van Boek 7 van het Burgerlijk Wetboek][ref2] gaan
      door de overgang van een concessie van rechtswege over op de nieuwe concessiehouder de rechten en verplichtingen,
      omschreven in [artikel 38][ref3], die op dat tijdstip voor de voormalige concessiehouder voortvloeien uit de
      privaatrechtelijke of publiekrechtelijke arbeidsverhouding tussen hem en:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel38
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '663'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
  - number: 37.1.a
    text: |-
      een direct ten behoeve van de verrichting van het openbaar vervoer waarvoor de concessie werd verleend, werkzame
      persoon, en
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel37
  - number: 37.1.b
    text: |-
      een indirect ten behoeve van de verrichting van het openbaar vervoer waarvoor de concessie werd verleend, werkzame
      persoon, met inachtneming van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel37
  - number: '37.2'
    text: |-
      Tenzij bij de in [artikel 36, eerste lid][ref1], bedoelde concessieverlening aan de andere vervoerder anders
      is bepaald, geschiedt de vaststelling van het aantal personen als bedoeld in het eerste lid, onderdeel
      b, op basis van de verhouding tussen de verminderde omzet ten gevolge van de overgang van de concessie
      en de totale omzet van de voormalige concessiehouder ten aanzien van het openbaar vervoer, berekend
      over het laatst afgesloten boekjaar voorafgaand aan het jaar waarin de concessieovergang plaatsvindt.
      [Artikel 10a van Boek 2 van het Burgerlijk Wetboek][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '36'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 10a
  - number: '37.3'
    text: |-
      De concessieverlener oefent zijn in het tweede lid neergelegde afwijkingsbevoegdheid slechts uit, indien
      hij voorafgaand aan de toepassing van [artikel 27][ref1] dan wel [artikel 44, derde lid][ref2], ter zake een
      beleidsregel heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel44
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '44'
        hoofdstuk: III
        paragraaf: '1'
  - number: '37.4'
    text: |-
      Indien toepassing van het eerste lid leidt tot overgang van een arbeidsplaats die niet herleidbaar is tot een
      individu, gaan naar de nieuwe concessiehouder over de rechten en verplichtingen, omschreven in [artikel 38][ref1],
      die op dat tijdstip voor de voormalige concessiehouder voortvloeien uit de privaatrechtelijke of publiekrechtelijke
      arbeidsverhouding tussen hem en de persoon die, ware er sprake van een beëindiging van de arbeidsverhouding waarop
      het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] van toepassing is wegens bedrijfseconomische redenen,
      waarbij die arbeidsplaatsen zouden komen te vervallen, voor ontslag in aanmerking zou komen met inachtneming van de
      daarvoor geldende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002014
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002014
  - number: '37.5'
    text: |-
      De voormalige concessiehouder is gedurende een jaar na de overgang naast de nieuwe concessiehouder hoofdelijk
      verbonden voor de nakoming van de verplichtingen uit de arbeidsverhouding die zijn ontstaan voor dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel37
  - number: '38.1'
    text: |-
      Indien de voormalige concessiehouder geen vervoerbedrijf is als bedoeld in
      [artikel 64, tweede lid, onderdeel a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: 38.1.a
    text: |-
      zijn op de overgang van een concessie de
      [artikelen 14a, eerste, tweede en vierde lid, van de Wet op de collectieve arbeidsovereenkomst][ref1] en
      __REF001___________________________________________________________________________________________________________
      ________________ van overeenkomstige toepassing en


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0001987
        artikel: 2a
  - number: 38.1.b
    text: |-
      gaan door de overgang van de concessie de rechten en verplichtingen welke op het tijdstip van
      overgang van concessie voor de voormalige concessiehouder ten aanzien van een persoon als bedoeld in
      [artikel 37, eerste lid][ref1], voortvloeien uit bedrijfsregelingen, van rechtswege over op de nieuwe
      concessiehouder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel37
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
  - number: '38.2'
    text: |-
      Indien de voormalige concessiehouder een vervoerbedrijf is als bedoeld in
      [artikel 64, tweede lid, onderdeel a][ref1], handhaaft de nieuwe concessiehouder na de overgang van een
      concessie ten aanzien van een persoon als bedoeld in [artikel 37, eerste lid][ref2], een samenstel van rechten en
      verplichtingen gelijkwaardig aan die welke voor het tijdstip van de overgang voor de voormalige concessiehouder
      uit de privaatrechtelijke of publiekrechtelijke arbeidsverhouding tussen de voormalige concessiehouder en die
      persoon voortvloeiden, voor zover deze rechten en verplichtingen voortvloeiden uit collectieve regelingen inzake
      arbeidsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel37
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
  - number: '38.3'
    text: |-
      Op het eindigen van de rechten en verplichtingen, bedoeld in het tweede lid, zijn de
      [artikelen 14a, tweede en vierde lid, van de Wet op de collectieve arbeidsovereenkomst][ref1] en
      __REF001___________________________________________________________________________________________________________
      ______________________________________ van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0001987
        artikel: 2a
  - number: '38.4'
    text: |-
      De [artikelen 662][ref1] en [663 van Boek 7 van het Burgerlijk Wetboek][ref2] zijn van
      overeenkomstige toepassing, indien de voormalige concessiehouder een vervoerbedrijf is als bedoeld in
      [artikel 64, tweede lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '663'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: '39.1'
    text: |-
      Op verzoek van de concessieverlener verstrekt de concessiehouder binnen de bij verzoek te bepalen termijn
      aan de concessieverlener ten behoeve van het programma van eisen een openbare schriftelijke opgave van
      de rechten en verplichtingen, bedoeld in [artikel 38][ref1], met betrekking tot de ten behoeve van het
      verrichte openbaar vervoer werkzame personen, met inbegrip van een gemotiveerde toelichting van de wijze
      waarop de loonkosten zijn samengesteld, alsmede van de samenstelling en het aantal van het met toepassing van
      [artikel 37, eerste lid, onderdelen a en b][ref2], voor overgang in aanmerking komend personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel37
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
  - number: '39.2'
    text: |-
      De in het eerste lid bedoelde opgave geschiedt naar de toestand op het tijdstip van de opgave en naar de te
      verwachten toestand op het tijdstip van het eindigen van de concessie. De opgave gaat vergezeld van een verklaring
      van één of meer onafhankelijke deskundigen, dat de opgave is opgesteld overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel39
  - number: '39.3'
    text: |-
      De in het tweede lid bedoelde deskundigen worden aangewezen door de concessieverlener en hun kosten komen voor
      rekening van de concessieverlener. De concessiehouder is verplicht aan de deskundigen alle door dezen gewenste
      inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel39
  - number: '40'
    text: |-
      Binnen een maand na het besluit tot verlening van een concessie treden de voormalige en de nieuwe
      concessiehouder met elkaar en met de belanghebbende verenigingen van werknemers als bedoeld in
      [artikel 3, vierde lid, van de Wet melding collectief ontslag][ref1], in overleg teneinde een goede uitvoering
      van de [artikelen 37][ref2] en [38][ref3] dan wel van de overeenkomst, bedoeld in [artikel 36, tweede lid][ref4],
      te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel36
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '37'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '36'
        hoofdstuk: II
        paragraaf: '4'
  - number: '41.1'
    text: |-
      Een concessiehouder kan een concessie, die is verleend door een concessieverlener als bedoeld in
      [artikel 20, tweede en vierde lid][ref1], geheel of gedeeltelijk overdragen aan een andere vervoerder, indien deze
      voldoet aan de eisen, die bij of krachtens deze wet aan de concessiehouder zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '41.2'
    text: |-
      De andere vervoerder, bedoeld in het eerste lid, is jegens de concessieverlener verplicht tot naleving van de
      ingevolge deze wet op de concessiehouder rustende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel41
  - number: '41.3'
    text: De concessiehouder kan de concessie niet overdragen dan na schriftelijke toestemming van de concessieverlener.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel41
  - number: '41.4'
    text: |-
      Toestemming voor overdracht van een concessie die is verleend na aanbesteding wordt onthouden, indien de
      andere vervoerder niet beschikt over een verklaring van geen bezwaar inzake de desbetreffende concessie. De
      [artikelen 52 tot en met 56, eerste lid][ref1], en[ 57 tot en met 60][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel57
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '52'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '57'
        hoofdstuk: III
        paragraaf: '3'
  - number: '41.5'
    text: |-
      Toestemming als bedoeld in het derde lid kan voorts slechts worden onthouden, indien redelijkerwijs te verwachten
      is dat de vervoerder de bij of krachtens deze wet gestelde verplichtingen niet of onvoldoende in acht zal nemen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel41
  - number: '41.6'
    text: |-
      De concessiehouder is naast de andere vervoerder hoofdelijk verbonden voor de nakoming van de uit de concessie
      voortvloeiende verplichtingen door de andere vervoerder die zijn ontstaan voor het tijdstip van overdracht.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel41
  - number: '42'
    text: |-
      Onverminderd de [artikelen 61, vijfde lid][ref1], en [66][ref2] vervalt een concessie van rechtswege:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel66
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '66'
        hoofdstuk: III
        paragraaf: '5'
  - number: 42.a
    text: op het moment dat de vergunning van de concessiehouder van rechtswege is vervallen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel42
  - number: 42.b
    text: zodra een besluit tot intrekking van de vergunning van de concessiehouder onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel42
  - number: 42.c
    text: |-
      zodra een besluit tot intrekking van de verklaring van geen bezwaar inzake de desbetreffende concessie
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel42
  - number: '43.1'
    text: |-
      Een concessie kan geheel of gedeeltelijk worden ingetrokken, indien is gebleken dat de concessiehouder de concessie
      niet naar behoren uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43
  - number: '43.2'
    text: |-
      Een beschikking tot gehele of gedeeltelijke intrekking van een concessie treedt niet eerder in werking dan dertien
      weken na de datum van haar bekendmaking. Zij werkt niet terug.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43
  - number: 43a.1
    text: |-
      Tenzij de voormalige concessiehouder en de nieuwe concessiehouder anders overeenkomen, is de voormalige
      concessiehouder gehouden bij overgang van een concessie voor openbaar vervoer per trein de in de concessie
      omschreven rechten en verplichtingen ten aanzien van productiemiddelen alsmede de daarbij behorende
      bedrijfsinformatie over te dragen aan die concessiehouder of ten behoeve van die concessiehouder te vestigen.
      Indien de overgang van de concessie het gedeeltelijk eindigen gevolgd door het gedeeltelijk ingaan van dezelfde
      concessie betreft, vormen de overgedragen of gevestigde rechten en verplichtingen een dienovereenkomstig deel van
      de concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
  - number: 43a.2
    text: 'In een concessie voor openbaar vervoer per trein is opgenomen:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
  - number: 43a.2.a
    text: een omschrijving van de rechten en verplichtingen, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
  - number: 43a.2.b
    text: |-
      een methode waarmee de waarde op het moment van overgang van de concessie wordt bepaald van de rechten en
      verplichtingen, bedoeld in het eerste lid, zodanig dat op evenwichtige wijze wordt recht gedaan aan de belangen van
      zowel de voormalige als de nieuwe concessiehouder.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
  - number: 43a.3
    text: |-
      Op verzoek van de concessieverlener verstrekt de concessiehouder met het oog op de verlening van een concessie
      binnen de bij het verzoek te bepalen termijn een gemotiveerde schatting van de waarde van de rechten en
      verplichtingen die worden overgedragen of gevestigd, volgens de methode, bedoeld in het tweede lid, onderdeel b.
      [Artikel 39, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel39
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '39'
        hoofdstuk: II
        paragraaf: '4'
  - number: 43a.4
    text: |-
      De concessieverlener stelt ten behoeve van de voormalige concessiehouder de betaling van de waarde van de rechten
      en verplichtingen, bedoeld in [artikel 43b, tweede lid][ref1], zeker.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43b
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 43b
        hoofdstuk: II
        paragraaf: '4'
  - number: 43a.5
    text: |-
      De concessieverlener stelt ten behoeve van de nieuwe concessiehouder de ongestoorde uitoefening van gebruiksrechten
      van productiemiddelen zeker, voor zover de voormalige concessiehouder rechten of verplichtingen ten aanzien van die
      productiemiddelen heeft behouden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
  - number: 43a.6
    text: |-
      Het verlenen van een concessie voor openbaar vervoer per trein aan de nieuwe concessiehouder kan door de
      concessieverlener afhankelijk worden gesteld van een bankgarantie of een andere zekerheid:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
  - number: 43a.6.a
    text: |-
      ten behoeve van de voormalige concessiehouder voor de betaling van de waarde van de rechten en verplichtingen,
      bedoeld in [artikel 43b, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43b
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 43b
        hoofdstuk: II
        paragraaf: '4'
  - number: 43a.6.b
    text: |-
      ten behoeve van de opvolgende concessiehouder voor de ongestoorde uitoefening van gebruiksrechten van
      productiemiddelen, voor zover de nieuwe concessiehouder rechten of verplichtingen ten aanzien van die
      productiemiddelen zal behouden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43a
  - number: 43b.1
    text: |-
      De overdracht en vestiging van rechten en verplichtingen ten aanzien van de productiemiddelen ingevolge
      [artikel 43a][ref1] vindt plaats op het tijdstip van overgang van de concessie.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43a
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 43a
        hoofdstuk: II
        paragraaf: '4'
  - number: 43b.2
    text: |-
      De nieuwe concessiehouder is de voormalige concessiehouder de waarde verschuldigd van de overgedragen en gevestigde
      rechten verminderd met de waarde van de overgedragen en gevestigde verplichtingen overeenkomstig hetgeen ter zake
      in de voormalige concessie is bepaald.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43b
  - number: 43b.3
    text: |-
      Onverminderd [artikel 43a][ref1] verschaft de voormalige concessiehouder voor zover hij daartoe rechtens bevoegd
      is, de nieuwe concessiehouder op het tijdstip van overgang van de concessie de feitelijke macht over de over te
      dragen en te vestigen rechten en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43a
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 43a
        hoofdstuk: II
        paragraaf: '4'
  - number: 43b.4
    text: De nieuwe concessiehouder is gehouden aan de overdracht en vestiging mee te werken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43b
  - number: 43b.5
    text: De kosten van de overdracht en vestiging zijn voor rekening van de nieuwe concessiehouder.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43b
  - number: 43b.6
    text: |-
      Indien als gevolg van de overdracht van rechten en verplichtingen sprake is van overgang van een onderneming waarop
      [titel 10, afdeling 8, van Boek 7 van het Burgerlijk Wetboek][ref1] van toepassing is en dientengevolge rechten en
      verplichtingen ten aanzien van personen als bedoeld in [artikel 32b][ref2] overgaan op de nieuwe concessiehouder,
      is de voormalige concessiehouder jegens de nieuwe concessiehouder ter zake gehouden hem de kosten te vergoeden die
      gemaakt zijn om de desbetreffende arbeidsovereenkomst te beëindigen. Daarenboven is de voormalige concessiehouder
      jegens de nieuwe concessiehouder per geval een direct opeisbare geldsom verschuldigd van € 100 000.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel32b
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: 32b
        hoofdstuk: II
        paragraaf: '3'
  - number: 43b.7
    text: |-
      In afwijking van het vierde lid is de nieuwe concessiehouder niet gehouden aan de overdracht van materieel
      mee te werken, indien het de eerste aanbesteding van een concessie voor regionaal openbaar vervoer op een
      gedecentraliseerde lijn betreft na de inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43b
  - number: 43c.1
    text: |-
      Aan een concessie kunnen nadere voorschriften worden verbonden ten aanzien van de toepassing van de
      [artikelen 43a][ref1] en [43b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel43b
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 43a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: 43b
        hoofdstuk: II
        paragraaf: '4'
  - number: 43c.2
    text: |-
      In een concessie voor openbaar vervoer per trein kan de toepasselijkheid van [artikel 43a][ref1] worden
      uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43a
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 43a
        hoofdstuk: II
        paragraaf: '4'
  - number: '44.1'
    text: De concessieverlener stelt ten behoeve van aanbesteding van een concessie een programma van eisen vast.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
  - number: '44.2'
    text: 'Het programma van eisen heeft in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
  - number: 44.2.a
    text: |-
      de bereikbaarheid in het gebied waarvoor een concessie wordt verleend en op de functie van het openbaar vervoer
      voor degenen die daarvan afhankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
  - number: 44.2.b
    text: de algemene eisen die aan het te verrichten openbaar vervoer worden gesteld;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
  - number: 44.2.c
    text: de afstemming met het openbaar vervoer in aangrenzende gebieden, alsmede met andere vormen van personenvervoer;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
  - number: 44.2.d
    text: de afstemming met milieudoelstellingen van de concessieverlener;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
  - number: 44.2.e
    text: de te benutten infrastructurele voorzieningen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
  - number: '44.3'
    text: |-
      Voordat het programma van eisen wordt vastgesteld, vraagt de concessieverlener overeenkomstig
      [artikel 27, tweede tot en met vierde lid][ref1], ter zake advies aan consumentenorganisaties die voldoen aan
      bij algemene maatregel van bestuur gestelde voorwaarden. Bij de verlening van de desbetreffende concessie is
      [artikel 27][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '45'
    text: |-
      Overleg als bedoeld in [artikel 26][ref1] over het verlenen van een concessie vindt in geval van aanbesteding
      plaats voordat een concessieverlener het programma van eisen vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel26
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
  - number: '46.1'
    text: |-
      Een concessiehouder verstrekt desgevraagd binnen een door de concessieverlener te bepalen termijn aan de
      concessieverlener gegevens voor zover deze noodzakelijk zijn voor de voorbereiding van aanbesteding van een
      concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel46
  - number: '46.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de gegevens die worden verstrekt en de wijze
      waarop controle op die gegevens wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel46
  - number: '46.3'
    text: |-
      De gegevens kunnen openbaar worden gemaakt in het programma van eisen, voor zover het belang van openbaarmaking
      opweegt tegen het belang van het voorkomen van een onevenredige benadeling van de concessiehouder.
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '46.4'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een vervoerder die openbaar vervoer verricht zonder daartoe
      verleende concessie, indien de gegevens noodzakelijk zijn voor de voorbereiding van aanbesteding van een concessie
      voor dat openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel46
  - number: '47'
    text: |-
      Het tijdvak waarvoor een concessie is verleend kan eenmaal door de concessieverlener voor een periode van ten
      hoogste twaalf maanden worden verlengd, indien aanbesteding van een concessie voor een aansluitend tijdvak niet
      heeft geleid tot een concessieverlening.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel47
  - number: '48'
    text: |-
      Van deelname aan een aanbesteding van een concessie is uitgesloten een instelling, dienst of bedrijf, waarover
      het openbaar lichaam waarvan een bestuursorgaan als bedoeld in [artikel 20, tweede tot en met vierde lid][ref1],
      bevoegd is tot verlening van de concessie, op grond van feitelijke of juridische omstandigheden een beslissende
      invloed uit kan oefenen op de activiteiten van die vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '49'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop aanbesteding van
      concessies plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel49
  - number: '50'
    text: De concessieverlener stelt een aanbestedingsreglement vast voor de procedure van aanbesteding van concessies.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel50
  - number: '54'
    text: |-
      Onverminderd [artikel 53][ref1] wordt een verklaring van geen bezwaar geweigerd aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '53'
        hoofdstuk: III
        paragraaf: '2'
  - number: 54.a
    text: |-
      een vervoerder die gevestigd is in een andere lidstaat van de Europese Unie of een andere staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte, voor zover de wederkerigheid van de toegang tot de
      desbetreffende markt voor personenvervoer voor vervoerders die in Nederland zijn gevestigd niet gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel54
  - number: 54.b
    text: |-
      een vervoerder die gevestigd is in een andere staat, niet zijnde een lidstaat van de Europese Unie of een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, voor zover dit voortvloeit
      uit een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke
      organisatie dan wel uit een door of vanwege de regering gemaakte internationale afspraak.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel54
  - number: '56.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit geeft op aanvraag een verklaring van geen bezwaar af, indien de
      aanvrager voldoet aan de in [artikel 53][ref1] gestelde eisen en er geen omstandigheden aanwezig zijn als bedoeld
      in [artikel 54][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel54
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '53'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '54'
        hoofdstuk: III
        paragraaf: '2'
  - number: '56.2'
    text: |-
      Een aanvraag om een verklaring van geen bezwaar kan niet eerder worden ingediend dan nadat de kennisgeving van de
      aanbesteding van de desbetreffende concessie is gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel56
  - number: '61.1'
    text: |-
      Met ingang van een bij algemene maatregel van bestuur bepaald tijdstip verleent een concessieverlener voor
      het openbaar vervoer, anders dan per trein, in zijn concessiegebied slechts een concessie nadat daartoe een
      aanbesteding is gehouden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister kan op aanvraag van een concessieverlener een ontheffing verlenen van de in het eerste lid bedoelde
      verplichting indien:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: 61.2.a
    text: 'de concessie een overbrugging vormt voor:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: 61.2.a.1°
    text: een wijziging van de indeling van concessiegebieden;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: 61.2.a.2°
    text: een samenvoeging van meerdere vervoersvormen in één concessie;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: 61.2.b
    text: |-
      onverminderd [artikel 3, eerste lid][ref1], de concessie betrekking heeft op openbaar vervoer dat een vernieuwende
      technologie of vervoersconcept bevat dat niet tot stand komt indien de concessie zou worden aanbesteed.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: '61.3'
    text: Een ontheffing kan onder beperkingen worden verleend en aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: '61.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het eerste, tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: '61.5'
    text: |-
      Een concessie voor openbaar vervoer, anders dan per trein, die is verleend zonder dat daartoe een aanbesteding is
      gehouden, vervalt op het met toepassing van het eerste lid bepaalde tijdstip.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel61
  - number: '62'
    text: |-
      Een concessie, anders dan een concessie voor openbaar vervoer per trein, die is verleend zonder dat
      daartoe een aanbesteding is gehouden, vervalt een jaar nadat door Onze Minister toepassing is gegeven aan
      [artikel 61, eerste lid][ref1], tenzij binnen dat jaar door de concessieverlener is voldaan aan [artikel 61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel61
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
  - number: 62_bis.1
    text: |-
      Concessies als bedoeld in [artikel 20, derde lid][ref1], worden slechts verleend nadat daartoe een aanbesteding
      is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 62_bis.2
    text: |-
      In bij of krachtens algemene maatregel van bestuur omschreven gevallen kan het eerste lid buiten toepassing worden
      gelaten.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel62
  - number: '64.1'
    text: |-
      [Paragraaf 4][ref1] van dit hoofdstuk is niet van toepassing op concessies die zijn verleend aan gemeentelijke
      vervoerbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011470
        hoofdstuk: III
        paragraaf: '4'
  - number: '64.2'
    text: |-
      Onder een gemeentelijk vervoerbedrijf wordt verstaan de vervoerder, voorzover die openbaar vervoer of daarmee
      rechtstreeks samenhangende activiteiten verricht,:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
  - number: 64.2.a
    text: die een dienst of een bedrijf is van een gemeente,
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
  - number: 64.2.b
    text: |-
      waarvan een gemeente meer dan de helft van de aandelen in het geplaatst kapitaal van het bedrijf bezit,
      onderscheidenlijk bezat op of na 1 januari 1996,
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
  - number: 64.2.c
    text: |-
      waarvan een gemeente over meer dan de helft van het aantal stemmen verbonden aan de aandelen in het geplaatst
      kapitaal van het bedrijf beschikt, onderscheidenlijk beschikte op of na 1 januari 1996,
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
  - number: 64.2.d
    text: |-
      waarvan een gemeente meer dan de helft van de leden van de raad van commissarissen of van de raad van bestuur van
      het bedrijf kan aanstellen, onderscheidenlijk kon aanstellen op of na 1 januari 1996, of
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
  - number: 64.2.e
    text: |-
      ten aanzien waarvan een of meer vervoerders als bedoeld in de onderdelen a, b, c, of d, al dan niet gezamenlijk
      beschikken over de rechten, bedoeld in de onderdelen b, c of d.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
  - number: '64.3'
    text: |-
      Onder gemeentelijk vervoerbedrijf wordt tevens verstaan de rechtsopvolger van de in het tweede lid bedoelde
      vervoerder voorzover het betreft een concessie verleend aan deze rechtsopvolger voor het verrichten van openbaar
      vervoer dat op 1 januari 1999 door die vervoerder werd verricht.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel64
  - number: '67.1'
    text: |-
      Onze Minister kan op aanvraag een ontheffing verlenen van de verplichting tot aanbesteding van concessies als
      bedoeld in [artikel 65, eerste lid][ref1], en [artikel 66, tweede lid][ref2], voor zover het gaat om openbaar
      vervoer per tram of metro.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel66
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '65'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '66'
        hoofdstuk: III
        paragraaf: '5'
  - number: '67.2'
    text: Een ontheffing wordt verleend voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel67
  - number: '67.3'
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel67
  - number: '67.4'
    text: |-
      De aanvraag gaat vergezeld van in ieder geval een ondernemingsplan en een plan tot aanbesteding van het openbaar
      vervoer dat wordt verricht door het gemeentelijk vervoerbedrijf.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel67
  - number: '67.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de aan de plannen, bedoeld in het vijfde
      lid, te stellen eisen en over de procedure betreffende de indiening en behandeling van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel67
  - number: '67.6'
    text: |-
      In afwijking van [artikel 65, derde lid][ref1], of [artikel 66, eerste lid][ref2], vervalt een concessie waarvoor
      een ontheffing is verleend na afloop van het tijdvak waarvoor die ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel66
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '65'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '66'
        hoofdstuk: III
        paragraaf: '5'
  - number: '69.1'
    text: |-
      Een gemeentelijk vervoerbedrijf als bedoeld in [artikel 64, tweede lid][ref1], verricht geen andere
      werkzaamheden dan openbaar vervoer, vervoer waarop bij algemene maatregel van bestuur als bedoeld in
      [artikel 2, tweede lid][ref2], dit artikel van toepassing is verklaard, alsmede de werkzaamheden die rechtstreeks
      samenhangen met het verrichten van dat vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel2
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '69.2'
    text: |-
      Een gemeentelijk vervoerbedrijf mag vervoerders als bedoeld in [artikel 64, tweede lid, onderdeel e][ref1],
      of andere vervoerders waarin een rechtspersoon die ten aanzien van het vervoerbedrijf beschikt
      over rechten als bedoeld in [artikel 64, tweede lid, onderdelen b, c of d][ref2], over in de in
      [artikel 64, tweede lid, onderdelen b, c, of d][ref3], bedoelde rechten beschikt en die openbaar vervoer, besloten
      busvervoer of taxivervoer verrichten dan wel werkzaamheden verrichten die daarmee rechtstreeks samenhangen, niet
      bevoordelen boven anderen waarmee die vervoerders in concurrentie treden of anderszins voordelen toekennen die
      verder gaan dan in het normaal handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: '69.3'
    text: |-
      Als toekenning van voordelen die verder gaan dan in het normaal handelsverkeer gebruikelijk is als bedoeld in het
      tweede lid wordt in ieder geval aangemerkt:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
  - number: 69.3.a
    text: |-
      het leveren van goederen of diensten tegen een vergoeding die lager is dan de redelijkerwijs daaraan toe te rekenen
      kosten;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
  - number: 69.3.b
    text: |-
      het ter beschikking stellen van financiële middelen anders dan ten laste van het eigen vermogen dan wel ten laste
      van het eigen vermogen anders dan tegen een in het handelsverkeer gebruikelijke vergoeding;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
  - number: 69.3.c
    text: |-
      het verstrekken van gegevens over individuele gebruikers van openbaar vervoer, tenzij deze onder gelijke
      voorwaarden ook ter beschikking worden gesteld aan derden die met de betrokken onderneming in concurrentie treden;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
  - number: 69.3.d
    text: |-
      het toestaan van het gebruik van de naam en het beeldmerk van het openbaar vervoerbedrijf op een wijze waardoor
      verwarring bij het publiek is te duchten over de herkomst van goederen en diensten.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
  - number: '69.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere vormen van toekenning van voordelen dan die, bedoeld in het derde
      lid, worden aangemerkt als vormen die verder gaan dan in het normaal handelsverkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
  - number: '69.5'
    text: |-
      Het gemeentelijk vervoerbedrijf doet jaarlijks over het voorafgaande boekjaar een verklaring van een onafhankelijke
      deskundige opmaken, waaruit blijkt of de financiële verhouding tussen het gemeentelijk vervoerbedrijf en de in het
      tweede lid bedoelde vervoerders voldoet aan de in dat lid gestelde eisen. Deze verklaring ligt voor een ieder ter
      inzage op alle kantoren van het gemeentelijk vervoerbedrijf.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
  - number: '69.6'
    text: |-
      Dit artikel is niet van toepassing ten aanzien van een gemeentelijk vervoerbedrijf zodra het openbaar vervoer,
      bedoeld in [artikel 53, tweede lid, onderdeel a][ref1], voor ten minste een gedeelte dat naar omzet berekend
      ten minste twee derde beloopt, wordt verricht krachtens een concessie welke is verleend na een procedure van
      aanbesteding.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '53'
        hoofdstuk: III
        paragraaf: '2'
  - number: 69a.1
    text: |-
      Onze Minister is bevoegd een concessie als bedoeld in [artikel 20, eerste lid][ref1], te verlenen zonder dat
      daartoe de procedure van de [paragrafen 1 tot en met 3 van dit hoofdstuk][ref2] wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        hoofdstuk: III
        paragraaf: '1'
  - number: 69a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze
      waarop een concessie door Onze Minister wordt verleend, indien daartoe niet de procedure van de
      [paragrafen 1 tot en met 3 van dit hoofdstuk][ref1] wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        hoofdstuk: III
        paragraaf: '1'
  - number: 69a.3
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen onder meer regels worden
      gesteld over:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69a
  - number: 69a.3.a
    text: de keuze van de voor het verlenen van een concessie te volgen procedures;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69a
  - number: 69a.3.b
    text: |-
      de criteria voor toelating van ondernemingen tot de procedure voor het verlenen van een concessie, waaronder de
      uitsluiting van ondernemingen die door hun marktmacht of concurrentiepositie een eerlijke competitie belemmeren;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69a
  - number: 69a.3.c
    text: de criteria voor het verlenen van een concessie.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69a
  - number: 69a.4
    text: |-
      Een concessie voor het hoofdrailnet wordt door Onze Minister niet eerder verleend, dan vier weken nadat het ontwerp
      aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69a
  - number: 69b.1
    text: |-
      In deze paragraaf wordt verstaan onder het hoofdrailnet: de spoorvervoerdiensten die als zodanig bij koninklijk
      besluit zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69b
  - number: 69b.2
    text: |-
      Onze Minister kan bepalen dat een door hem verleende concessie voor het hoofdrailnet geheel of voor een door Onze
      Minister daarbij te bepalen aanmerkelijk gedeelte door de concessiehouder zal worden uitgevoerd met gebruikmaking
      van een of meer door Onze Minister aan te wijzen rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69b
  - number: 69b.3
    text: |-
      Een in het eerste lid bedoeld koninklijk besluit wordt niet eerder vastgesteld dan vier weken nadat het ontwerp aan
      de Tweede Kamer der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69b
  - number: 69c.1
    text: Dit artikel is van toepassing, indien Onze Minister voornemens is een concessie te verlenen voor het hoofdrailnet.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.2
    text: 'Onze Minister stelt een beleidsvoornemen tot concessieverlening vast, waarin is opgenomen of vermeld:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.2.a
    text: een beschrijving van de betrokken markt;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.2.b
    text: |-
      een beschrijving van de maatregelen die ertoe strekken dat de continuïteit van het betrokken personenvervoer wordt
      gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.2.c
    text: een schatting van de kosten die met de concessieverlening zijn gemoeid en van de waarde van de concessie;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.2.d
    text: een beschrijving van de te volgen procedure van concessieverlening; en
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.2.e
    text: of Onze Minister voornemens is artikel 69b, tweede lid, toe te passen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.3
    text: |-
      Voordat Onze Minister het beleidsvoornemen vaststelt, legt hij dit voornemen ter advisering voor aan de in artikel
      27 bedoelde consumentenorganisaties. Artikel 27 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.4
    text: |-
      Onze Minister legt het vastgestelde beleidsvoornemen voor aan de Tweede Kamer der Staten-Generaal. Indien binnen
      30 dagen na deze voorlegging ten minste 30 leden te kennen geven nadere inlichtingen te willen ontvangen over de
      voorgenomen concessieverlening, zal de aanvang van procedure tot concessieverlening niet eerder plaatsvinden dan
      dat veertien dagen zijn verstreken na het verstrekken van die inlichtingen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69c.5
    text: |-
      Indien binnen 30 dagen na de voorlegging of binnen 14 dagen na de verstrekking van de inlichtingen, bedoeld in het
      vierde lid, de Kamer als haar oordeel uitspreekt dat de concessieverlening machtiging bij wet behoeft, wordt de
      concessie eerst verleend nadat die machtiging is verleend.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69c
  - number: 69d.1
    text: |-
      Dit artikel is van toepassing op de verlening van de eerste concessie voor het hoofdrailnet na de inwerkingtreding
      van de [Concessiewet personenvervoer per trein][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015008
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0015008
  - number: 69d.2
    text: |-
      Onze Minister verleent de in het eerste lid bedoelde concessie aan de N.V. Nederlandse Spoorwegen of aan een bij
      koninklijk besluit te bepalen onderdeel van de N.V. Nederlandse Spoorwegen zonder dat daartoe de procedure van de
      [paragrafen 1 tot en met 3 van dit hoofdstuk][ref1] of [artikel 69c][ref2] wordt toegepast. Deze concessie vangt
      aan op een bij koninklijk besluit te bepalen datum en eindigt op 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel69c
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0011470
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: 69c
        hoofdstuk: III
        paragraaf: '7'
  - number: 69d.3
    text: |-
      Onze Minister kan van het tweede lid afwijken; alsdan wordt [artikel 69c][ref1] toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69c
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel69d
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 69c
        hoofdstuk: III
        paragraaf: '7'
  - number: '70.1'
    text: |-
      Het is verboden zonder hiervoor geldig vervoerbewijs gebruik te maken van het openbaar vervoer, alsmede, voor zover
      de vervoerder zulks duidelijk kenbaar heeft gemaakt, van de daartoe behorende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel70
  - number: '70.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing in de bij algemene maatregel van bestuur bepaalde
      gevallen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel70
  - number: '71'
    text: |-
      Het is verboden een onbevoegd gewijzigd of anderszins bewerkt vervoerbewijs te gebruiken, een vervoerbewijs te
      misbruiken of de controle van vervoerbewijzen te belemmeren of te verhinderen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel71
  - number: '72'
    text: |-
      Het is een ieder verboden zich in een auto, bus, trein, metro, tram of een via een geleidesysteem voortbewogen
      voertuig dan wel in of in de onmiddellijke nabijheid van een station, halteplaats, of een andere bij het openbaar
      vervoer behorende voorziening en de daarbij behorende perrons, trappen, tunnels en liften zodanig te gedragen dat
      orde, rust, veiligheid of een goede bedrijfsgang wordt of kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel72
  - number: '73'
    text: |-
      Een ieder is verplicht de aanwijzingen betreffende de orde, rust, veiligheid of een goede bedrijfsgang op te volgen
      die door of vanwege de vervoerder duidelijk kenbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel73
  - number: '74.1'
    text: 'Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel74
  - number: 74.1.a
    text: hetgeen onder verstoring van orde, rust, veiligheid of een goede bedrijfsgang wordt verstaan;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel74
  - number: 74.1.b
    text: |-
      de wijze waarop de in [artikel 73][ref1] bedoelde aanwijzingen onder meer kunnen worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel73
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '73'
        hoofdstuk: IV
  - number: '74.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld over onder meer:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel74
  - number: 74.2.a
    text: het gebruik van vervoerbewijzen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel74
  - number: 74.2.b
    text: de verplichting tot betaling en het recht op terugbetaling.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel74
  - number: '83.1'
    text: |-
      Ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties dan wel om redenen van internationaal
      vervoerbeleid kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel83
  - number: 83.1.a
    text: openbaar vervoer, besloten busvervoer en taxivervoer dat de Nederlandse grens overschrijdt;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel83
  - number: 83.1.b
    text: |-
      openbaar vervoer, besloten busvervoer en taxivervoer dat door een in Nederland gevestigde vervoerder geheel buiten
      Nederland of door een buiten Nederland gevestigde vervoerder geheel in Nederland wordt verricht;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel83
  - number: 83.1.c
    text: |-
      het rijden met een lege bus of auto over voor het openbaar verkeer openstaande wegen in Nederland of het rijden
      met een lege bus of auto door een in Nederland gevestigde vervoerder geheel of ten dele buiten Nederland of door
      een buiten Nederland gevestigde vervoerder geheel of ten dele in Nederland, voor zover dat verband houdt met het
      verrichten van openbaar vervoer, besloten busvervoer of taxivervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel83
  - number: '83.2'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen mede betrekking hebben op de vergoeding die de aanvrager is
      verschuldigd voor de behandeling van de aanvraag om verlening of wijziging van de voor dat vervoer benodigde
      documenten.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel83
  - number: '84.1'
    text: |-
      Met het oog op de inzichtelijkheid voor de consument worden bij ministeriële regeling regels gesteld over tarieven
      voor taxivervoer. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel84
  - number: 84.1.a
    text: de wijze waarop het tarief is opgebouwd;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel84
  - number: 84.1.b
    text: de verplichting de tariefopbouw toe te passen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel84
  - number: '84.2'
    text: De regeling kan voorschriften bevatten omtrent een toe te passen maximumtarief.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel84
  - number: '84.3'
    text: |-
      De regeling heeft geen betrekking op tarieven voor taxivervoer dat wordt verricht ter uitvoering van een
      schriftelijke overeenkomst waarbij gedurende een bij die overeenkomst vastgestelde periode meermalen taxivervoer
      wordt verricht tegen een in die overeenkomst vastgelegd tarief.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel84
  - number: '85'
    text: |-
      Het is verboden taxivervoer te verrichten in strijd met de krachtens [artikel 84][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel84
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '86'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel86
  - number: 86.a
    text: de minimale beschikbaarheid van het taxivervoer;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel86
  - number: 86.b
    text: het kenbaar maken van de tarieven aan de consument;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel86
  - number: 86.c
    text: |-
      de administratie die de vervoerder dient te voeren ten behoeve van een doelmatig toezicht op de naleving van het
      bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel86
  - number: '87.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen personen en, voor zover het betreft het toezicht op de naleving van het bepaalde bij of
      krachtens de [artikelen 19][ref1] en [30 tot en met 40][ref2], de bij besluit van de bestuursorganen, bedoeld in
      [artikel 20, tweede tot en met vierde lid][ref3], aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '30'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '87.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn voorts belast de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren en de met betrekking tot deze wet
      krachtens [artikel 17, eerste lid, onder 2°, van de Wet op de economische delicten][ref2] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '17'
  - number: '87.3'
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid zijn met het toezicht op de naleving van het bij of krachtens
      de [artikelen 70 tot en met 74][ref1] bepaalde mede belast personen die daartoe door de vervoerder zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '70'
        hoofdstuk: IV
  - number: '87.4'
    text: |-
      Met het toezicht op de naleving van het bepaalde in [artikel 69, eerste en vijfde lid][ref1], zijn belast de
      bij besluit van de raad van bestuur van de mededingingsautoriteit aangewezen ambtenaren van de Nederlandse
      Mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '6'
  - number: '87.5'
    text: |-
      Van een besluit als bedoeld in het eerste lid of vierde lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel87
  - number: '88.1'
    text: Onze Minister kan met betrekking tot het toezicht op de naleving beleidsregels vaststellen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel88
  - number: '88.2'
    text: |-
      Beleidsregels die betrekking hebben op het toezicht door ambtenaren als bedoeld in [artikel 87, vierde lid][ref1],
      worden vastgesteld in overeenstemming met Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '89.1'
    text: |-
      Met het opsporen van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de met betrekking tot deze wet
      krachtens [artikel 17, eerste lid, onder 2°, van de Wet op de economische delicten][ref2] aangewezen
      ambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '89.2'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn voorts belast de bij besluit van
      Onze Minister en Onze Minister van Justitie gezamenlijk aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel89
  - number: '89.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel89
  - number: '90'
    text: |-
      De in [artikel 87][ref1] bedoelde ambtenaren en personen beschikken niet over de bevoegdheden, bedoeld in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '91'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15 tot en met 5:17][ref3], [5:19][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing ten aanzien van de in
      [artikel 89][ref6] bedoelde ambtenaren en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
