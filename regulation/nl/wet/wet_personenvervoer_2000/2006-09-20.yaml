  - number: '93'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel93
  - number: '94.1'
    text: |-
      Ingeval van overtreding van [artikel 69, eerste of vijfde lid][ref1], kan de raad van bestuur van de
      mededingingsautoriteit de rechtspersoon aan wie het gemeentelijk vervoerbedrijf toebehoort dan wel de
      desbetreffende concessiehouder, een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '6'
  - number: '94.2'
    text: |-
      De in het eerste lid bedoelde last strekt ertoe de overtreding ongedaan te maken dan wel herhaling van de
      overtreding te voorkomen. Aan een last kunnen voorschriften worden verbonden inzake het verstrekken van gegevens
      aan de raad van bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel94
  - number: '94.3'
    text: |-
      Een last geldt voor een door de raad van bestuur van de mededingingsautoriteit te bepalen termijn van ten hoogste
      twee jaar.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel94
  - number: '94.4'
    text: |-
      De [artikelen 5:32, vierde en vijfde lid][ref1], [5:33][ref2], [5:34, eerste lid][ref3], en
      [5:35 van de Algemene wet bestuursrecht][ref4] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '95.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit deelt zijn voornemen een beschikking te geven als bedoeld in
      [artikel 94, eerste lid][ref1], schriftelijk en met redenen omkleed mee aan belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel94
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '94'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '95.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de raad van bestuur van
      de mededingingsautoriteit, alvorens te besluiten omtrent toepassing van [artikel 94, eerste lid][ref2],
      belanghebbenden in de gelegenheid schriftelijk of mondeling hun zienswijze kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel94
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '94'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '96.1'
    text: De raad van bestuur van de mededingingsautoriteit kan een last onder dwangsom wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel96
  - number: '96.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de raad van bestuur van de
      mededingingsautoriteit, alvorens toepassing te geven aan het eerste lid, belanghebbenden in de gelegenheid
      mondeling of schriftelijk hun zienswijze kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '97'
    text: |-
      Indien naar het oordeel van de in de [artikelen 87][ref1] of [89][ref2] bedoelde ambtenaren en personen in
      onvoldoende mate medewerking wordt verleend bij de uitvoering van de hun opgedragen taak, treffen zij zo nodig met
      behulp van de sterke arm de nodige maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '98.1'
    text: |-
      Indien de reiziger handelt in strijd met de [artikelen 70 tot en met 74][ref1] zijn de in de
      [artikelen 87 en 89][ref2] bedoelde ambtenaren en personen bevoegd zijn vervoerbewijs in te trekken en hem zo nodig
      met behulp van de sterke arm het gebruik van het openbaar vervoer te ontzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel87
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '70'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '98.2'
    text: |-
      De in de [artikelen 87][ref1] en [89][ref2] bedoelde ambtenaren en personen zijn bevoegd bij vermoeden van een ten
      aanzien van handbagage gepleegde overtreding van het in [artikel 72][ref3] bepaalde, zich in tegenwoordigheid van
      de reiziger van aard en inhoud daarvan te overtuigen en onbevoegd meegenomen handbagage uit de vervoermiddelen te
      weren of verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel72
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '72'
        hoofdstuk: IV
  - number: '99.1'
    text: |-
      Onze Minister kan een vergunning volgens bij algemene maatregel van bestuur vast te stellen regels, wijzigen,
      schorsen of intrekken:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel99
  - number: 99.1.a
    text: indien is gehandeld in strijd met het bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel99
  - number: 99.1.b
    text: |-
      indien niet langer wordt voldaan aan een van de in [artikel 9, eerste lid][ref1], bedoelde eisen, tenzij een
      ontheffing als bedoeld in het tweede lid van dat artikel is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel9
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
  - number: 99.1.c
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '99.2'
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '100.1'
    text: |-
      Onverminderd [artikel 43, eerste lid][ref1], kan een concessie worden ingetrokken, indien aan de
      concessiehouder ter zake van overtreding van het bepaalde bij of krachtens deze wet een sanctie is opgelegd.
      [Artikel 43, tweede lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel43
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '43'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '43'
        hoofdstuk: II
        paragraaf: '4'
  - number: '100.3'
    text: |-
      De concessieverlener kan een ontheffing als bedoeld in [artikel 29][ref1] intrekken, indien de vervoerder in strijd
      handelt met het bij of krachtens deze wet ten aanzien van de vervoerder bepaalde dan wel met de ontheffing of de
      aan de ontheffing verbonden beperkingen of voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel29
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '29'
        hoofdstuk: II
        paragraaf: '2'
  - number: '101.1'
    text: |-
      Niet naleving van de [artikelen 70 tot en met 73][ref1], alsmede – voor zover aangeduid als strafbare feiten
      – het bepaalde krachtens de [artikelen 74, tweede lid][ref2], en [104, aanhef en onderdelen a en b][ref3], is
      een overtreding en wordt gestraft met een hechtenis van ten hoogste twee maanden of een geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel104
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '70'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '74'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '104'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '101.2'
    text: |-
      Indien de reiziger ten aanzien van wie door een ambtenaar of persoon, bedoeld in de [artikelen 87][ref1] en
      [89][ref2], is vastgesteld dat hij in strijd handelt met de [artikelen 70][ref3] of [71][ref4], niet voldoet aan
      de verplichting, bedoeld in [artikel 92][ref5], worden de in het eerste lid bedoelde straffen verhoogd tot een
      hechtenis van ten hoogste vier maanden, onderscheidenlijk een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel71
      [ref5]: https://wetten.overheid.nl/BWBR0011470#Artikel92
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '70'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '71'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0011470
        artikel: '92'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '102'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het recht tot strafvordering wegens overtreding van
      de [artikelen 70][ref1] of [71][ref2] vervalt door voldoening op een daarbij aan te geven wijze van een bij of
      krachtens die maatregel vast te stellen geldsom aan de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel71
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '70'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '71'
        hoofdstuk: IV
  - number: '103'
    text: |-
      Overtreding van de [artikelen 4][ref1] en [11, tweede en derde lid][ref2], zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel11
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '11'
        hoofdstuk: I
        paragraaf: '3'
  - number: '104.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op het verrichten van openbaar vervoer anders
      dan openbaar vervoer per trein, besloten busvervoer en taxivervoer regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel104
  - number: 104.1.a
    text: inrichting en uitrusting van een auto, bus, metro, tram of een via een geleidesysteem voortbewogen voertuig;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel104
  - number: 104.1.b
    text: keuring van bussen en auto's;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel104
  - number: 104.1.c
    text: eisen te stellen aan bestuurders van auto, bus, metro, tram of een via een geleidesysteem voortbewogen voertuig;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel104
  - number: 104.1.d
    text: de wijze waarop wordt aangetoond dat aan de ingevolge de onderdelen a, b en c, gestelde regels wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel104
  - number: 104.1.e
    text: |-
      de vergoedingen die zijn verschuldigd voor de met de ingevolge de onderdelen a tot en met d gestelde regels
      samenhangende werkzaamheden en af te geven documenten.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel104
  - number: '104.2'
    text: |-
      Voor zover dit noodzakelijk is ter toetsing van de geschiktheid van bestuurders, kunnen in het kader van de in het
      eerste lid, onder c, bedoelde eisen, onder meer gegevens betreffende de gezondheid en het gedrag van bestuurders
      worden verwerkt. Het bestuursorgaan dat bevoegd is tot toetsing aan deze eisen, is verantwoordelijke voor de
      verwerking van de gegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '105.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel105
  - number: '105.2'
    text: |-
      In afwijking van het eerste lid is voor beroepen tegen besluiten op grond van de [artikelen 56, eerste lid][ref1],
      [59, eerste lid][ref2], [94, eerste lid][ref3], en [96, eerste lid][ref4], de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel94
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel96
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '56'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '59'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '94'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '96'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '106'
    text: |-
      Onze Minister voert overleg over voorgenomen voorstellen van wet, ontwerpen van algemene maatregel van bestuur
      en ontwerpen van ministeriële regelingen op het terrein van het openbaar vervoer, het besloten busvervoer en het
      taxivervoer met ten minste vertegenwoordigers van:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel106
  - number: 106.a
    text: |-
      representatieve organisaties van werkgevers en werknemers in het openbaar vervoer, het besloten busvervoer en het
      taxivervoer;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel106
  - number: 106.b
    text: provincies, regionaal openbare lichamen en gemeenten;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel106
  - number: 106.c
    text: |-
      representatieve organisaties die de belangen van gebruikers van het openbaar vervoer, het besloten busvervoer en
      het taxivervoer behartigen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel106
  - number: '107'
    text: |-
      De voordracht voor een eerste vaststelling van een algemene maatregel van bestuur op grond van deze wet wordt niet
      eerder gedaan dan vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel107
  - number: '108.1'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken binnen vijf jaar na inwerkingtreding
      van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet, voorzover het
      betreft het openbaar vervoer en het besloten busvervoer, in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel108
  - number: '108.2'
    text: |-
      Onverminderd het eerste lid zendt Onze Minister voor 1 december 2004 aan de Staten-Generaal een verslag over de
      effecten in de praktijk van aanbesteding van concessies als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel108
  - number: '108.3'
    text: |-
      Met het oog op de besluitvorming inzake de invoering van een plicht tot aanbesteding van concessies met ingang van
      1 januari 2006 zendt Onze Minister voor 1 december 2004 aan de Staten-Generaal een verslag over de doeltreffendheid
      en effecten in de praktijk van aanbesteding van concessies.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel108
  - number: '108.4'
    text: |-
      Onze Minister kan onderzoek doen naar de ontwikkeling van de concurrentieverhoudingen op de Nederlandse markt voor
      openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel108
  - number: '108.5'
    text: |-
      De concessieverleners en de concessiehouders verstrekken ten behoeve van de verslagen, bedoeld in het eerste,
      tweede en derde lid, of het onderzoek, bedoeld in het vierde lid, desgevraagd de informatie die Onze Minister nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel108
  - number: '109.1'
    text: |-
      Tot het moment van inwerkingtreding van de [artikelen 15 tot en met 18][ref1] en [51 tot en met 60][ref2] wordt van
      deelname aan aanbesteding van een concessie uitgesloten:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel51
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '15'
        hoofdstuk: I
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '51'
        hoofdstuk: III
        paragraaf: '2'
  - number: 109.1.a
    text: |-
      een gemeentelijk vervoerbedrijf als bedoeld in [artikel 64][ref1], alsmede een vervoerder waarvan een gemeentelijk
      vervoerbedrijf één of meer aandelen in het geplaatst kapitaal bezit, voor zolang het openbaar vervoer dat op de
      dag voor de inwerkingtreding van deze wet door het vervoerbedrijf werd verricht, niet of niet in voldoende mate
      is aanbesteed;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '64'
        hoofdstuk: III
        paragraaf: '5'
  - number: 109.1.b
    text: |-
      een vervoerder die is gevestigd in een andere lidstaat van de Europese Unie of een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, voorzover de wederkerigheid van de toegang tot de
      desbetreffende markt voor personenvervoer voor vervoerders die in Nederland zijn gevestigd niet gewaarborgd is;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel109
  - number: 109.1.c
    text: |-
      een vervoerder die is gevestigd in een andere staat, niet zijnde een lidstaat van de Europese Unie of een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, voor zover dit voortvloeit
      uit een voor Nederland verbindend besluit van een volkenrechtelijke organisatie dan wel uit een door of vanwege de
      regering gemaakte internationale afspraak.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel109
  - number: '109.2'
    text: |-
      Het openbaar vervoer, bedoeld in het eerste lid, onderdeel a, is in voldoende mate aanbesteed indien de omvang van
      dat aanbestede gedeelte tenminste tweederde van de omvang bedraagt van de concessie als bedoeld in de aanhef van
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel109
  - number: '109.3'
    text: |-
      Met aanbesteding als bedoeld in het eerste lid, onderdeel a, en het tweede lid, wordt gelijkgesteld een
      kennisgeving tot de opdracht van aanbesteding van een concessie is gepubliceerd mits de in de kennisgeving vermelde
      ingangsdatum van de concessie is gelegen binnen een redelijke termijn na de datum van die kennisgeving.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel109
  - number: '110'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat [artikel 53, tweede lid][ref1], buiten toepassing blijft. Na
      het tot stand komen van die regeling wordt zo spoedig mogelijk maar uiterlijk binnen acht weken een voorstel van
      wet tot goedkeuring van de ministeriële regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het
      voorstel wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te
      nemen, wordt de ministeriële regeling onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan wordt de
      ministeriële regeling ingetrokken op het tijdstip van inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '53'
        hoofdstuk: III
        paragraaf: '2'
  - number: '111.1'
    text: |-
      Een jaar na inwerkingtreding van [artikel 127][ref1] vervallen de overeenkomsten ter uitvoering van de artikelen
      12 en 17 van de Wet personenvervoer, zoals die artikelen luidden voor de inwerkingtreding van [artikel 127][ref2],
      die bestaan tussen een overheid die op grond van de Wet personenvervoer bevoegd was tot het vaststellen van
      dienstregelingen en een vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '111.2'
    text: |-
      De overheid, bedoeld in het eerste lid, kan de overeenkomst op een eerder tijdstip beëindigen ten behoeve van het
      verlenen van een concessie aan de vervoerder, bedoeld in het eerste lid, dan wel een andere vervoerder.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel111
  - number: '112.1'
    text: |-
      Onverminderd wijziging, intrekking of het van rechtswege vervallen, blijven de vergunningen die zijn verleend voor
      het verrichten van openbaar vervoer en besloten busvervoer op grond van de Wet personenvervoer gelden tot vijf jaar
      na inwerkingtreding van [artikel 127][ref1], met dien verstande dat buiten toepassing blijft:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 112.1.a
    text: |-
      de vermelding van het aantal bussen, bedoeld in artikel 50, derde lid, van de Wet personenvervoer, zoals die
      bepaling luidde voor de inwerkingtreding van [artikel 127][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 112.1.b
    text: |-
      de vermelding van een periode van twee jaren, bedoeld in artikel 53, eerste lid, van de Wet personenvervoer zoals
      die bepaling luidde voor de inwerkingtreding van [artikel 127][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '112.2'
    text: |-
      De onderdelen a en b van het eerste lid zijn niet van toepassing op vergunningen die zijn verleend op grond
      van de artikelen 9 of 51 van de Wet personenvervoer zoals die bepalingen luidden voor de inwerkingtreding van
      [artikel 127][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '112.3'
    text: |-
      Onverminderd het eerste lid vervalt een vergunning als bedoeld in het eerste lid op het tijdstip waarop aan de
      houder van die vergunning op zijn aanvraag een vergunning voor collectief personenvervoer wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel112
  - number: '112.4'
    text: |-
      In afwijking van het eerste lid geldt een vergunning voor het verrichten van openbaar vervoer per trein met ingang
      van de dag van inwerkingtreding van [artikel 127][ref1] als een vergunning verleend op grond van [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
  - number: '113'
    text: |-
      Een vergunning voor het verrichten van taxivervoer die voor de datum van inwerkingtreding van [artikel 127][ref1]
      is verleend ingevolge artikel 57 van de Wet personenvervoer, zoals dit artikel luidde voor de datum van
      inwerkingtreding van [artikel 127][ref2], geldt, onverminderd mogelijke wijziging, schorsing, intrekking of het
      van rechtswege vervallen, met ingang van de datum van inwerkingtreding van [artikel 127][ref3], als een vergunning
      verleend ingevolge [artikel 4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
  - number: '114.1'
    text: |-
      Een aanvraag voor een vergunning voor het verrichten van openbaar vervoer of besloten busvervoer die voor
      de inwerkingtreding van [artikel 127][ref1] is ingediend op grond van de artikelen 11, 16 of 50 van de Wet
      personenvervoer en waarop nog geen beslissing is genomen op de dag van inwerkingtreding van [artikel 127][ref2],
      geldt met ingang van die dag als een aanvraag voor een vergunning voor collectief personenvervoer die is ingediend
      bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '114.2'
    text: |-
      Een aanvraag voor een vergunning voor het verrichten van openbaar vervoer per trein die voor de inwerkingtreding
      van [artikel 127][ref1] is ingediend op grond van artikel 16a van de Wet personenvervoer en waarop nog geen
      beslissing is genomen op de dag van inwerkingtreding van [artikel 127][ref2], geldt met ingang van die dag als een
      aanvraag voor een vergunning voor het verrichten van openbaar vervoer per trein op grond van [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '4'
        hoofdstuk: I
        paragraaf: '3'
  - number: '115'
    text: |-
      Een aanvraag voor een vergunning voor het verrichten van taxivervoer die voor de datum van inwerkingtreding
      van [artikel 127][ref1] is ingediend ingevolge artikel 57 van de Wet personenvervoer, zoals dit artikel luidde
      voor de datum van inwerkingtreding van [artikel 127][ref2], en waarop op de datum van de inwerkingtreding van
      [artikel 127][ref3] nog geen beslissing is genomen, geldt met ingang van die datum als een aanvraag voor een
      vergunning voor het verrichten van taxivervoer ingevolge [artikel 5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel5
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
  - number: '116.1'
    text: |-
      Een ontheffing van de eis van vakbekwaamheid die voor 1 januari 1988 is verleend op grond van artikel 56a, eerste
      lid, van de Wet Autovervoer Personen, en die met ingang van die dag is aangemerkt als een ontheffing als bedoeld
      in artikel 9, tweede lid, van de Wet personenvervoer, geldt met ingang van de dag van inwerkingtreding van
      [artikel 127][ref1] als een ontheffing als bedoeld in [artikel 9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel9
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
  - number: '116.2'
    text: |-
      Degene die op grond van artikel 68 van de Wet Autovervoer Personen werd geacht te voldoen aan de eis van
      vakbekwaamheid, bedoeld in artikel 56a, eerste lid, van die wet, en op grond van artikel 105 van de Wet
      personenvervoer werd geacht te voldoen aan de eis van vakbekwaamheid, bedoeld in artikel 9, eerste lid, van die
      wet, voldoet aan de eis van vakbekwaamheid, bedoeld in [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel9
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
  - number: '116.3'
    text: |-
      Een ontheffing van de eis van vakbekwaamheid die is verleend op grond van artikel 9, tweede lid, van de Wet
      personenvervoer, geldt met ingang van de dag van inwerkingtreding van [artikel 113][ref1] als een ontheffing als
      bedoeld in [artikel 9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel9
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
  - number: '118.1'
    text: |-
      Een dienstregeling voor het lokaal of interlokaal openbaar vervoer zoals deze gold op de dag voor de
      inwerkingtreding van [artikel 127][ref1], blijft geldig tot uiterlijk een jaar na die dag. Het recht inzake de
      vaststelling, wijziging en uitvoering van de dienstregeling zoals dat gold op de dag voor de inwerkingtreding van
      [artikel 127][ref2] blijft van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '118.2'
    text: |-
      Een dienstregeling waarvoor op grond van de Wet personenvervoer door de vervoerder een voorstel is ingediend,
      en waarop door het ingevolge die wet tot vaststellen bevoegde bestuursorgaan op de dag van inwerkingtreding van
      [artikel 127][ref1] nog niet is beslist, wordt voor een tijdvak van ten hoogste zes maanden vastgesteld volgens het
      recht zoals dat gold voor die dag. Het recht inzake de vaststelling, wijziging en uitvoering van de dienstregeling
      zoals dat gold op de dag voor de inwerkingtreding van [artikel 127][ref2] blijft van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '118.3'
    text: |-
      [Artikel 19][ref1] is niet van toepassing op het verrichten van openbaar vervoer op grond van een dienstregeling
      die is vastgesteld overeenkomstig het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '118.4'
    text: |-
      De [artikelen 30, derde lid][ref1], [46][ref2] en [78][ref3] zijn van overeenkomstige toepassing op het verrichten
      van openbaar vervoer op grond van een dienstregeling die is vastgesteld overeenkomstig het eerste of tweede lid.
      Artikel 19 is niet van toepassing op het verrichten van openbaar vervoer op grond van een dienstregeling die is
      vastgesteld overeenkomstig het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel78
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '30'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '46'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '78'
        hoofdstuk: V
  - number: '118.5'
    text: |-
      De [artikelen 36 tot en met 40][ref1] zijn van overeenkomstige toepassing op het eindigen van het verrichten
      van openbaar vervoer op grond van een dienstregeling als bedoeld in het eerste of tweede lid, voor zover deze
      beëindiging wordt gevolgd door het ingaan van een concessie, verleend aan een andere vervoerder, voor het
      verrichten van een geheel of gedeeltelijk dezelfde voorziening van openbaar vervoer als dat werd verricht op grond
      van die dienstregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel36
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '36'
        hoofdstuk: II
        paragraaf: '4'
  - number: '119'
    text: |-
      Indien een gemeentelijk vervoerbedrijf op de dag van inwerkingtreding van [artikel 69][ref1] werkzaamheden verricht
      die op grond van [artikel 69, eerste lid][ref2], niet zijn toegestaan, worden die werkzaamheden binnen twaalf
      maanden na dat tijdstip overgedragen aan een privaatrechtelijke rechtspersoon. Artikel 69, eerste lid, geldt in die
      periode niet ten aanzien van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel69
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '6'
  - number: '120.1'
    text: |-
      Een besluit tot aanwijzing van een gemeente als bedoeld in artikel 39 van de Wet personenvervoer zoals dit luidde
      voor de inwerkingtreding van [artikel 127][ref1] behoudt zijn geldigheid tot het moment waarop Onze Minister het
      besluit intrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '120.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop Onze Minister toepassing geeft aan de
      bevoegdheid tot intrekken van een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel120
  - number: '121.1'
    text: |-
      Indien een plusregio als bedoeld in [artikel 20][ref1] wordt opgeheven, zijn de colleges van burgemeester
      en wethouders van de gemeenten die de plusregio vormden, bevoegd tot het verlenen, wijzigen of intrekken van
      concessies voor openbaar vervoer ten behoeve van die gemeenten, voor zover zij daartoe door Onze Minister zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '121.2'
    text: Een aanwijzing als bedoeld in het eerste lid wordt gedaan indien Onze Minister dit doelmatig acht.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel121
  - number: '121.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop Onze Minister toepassing geeft aan het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel121
  - number: '121.4'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de bevoegdheid tot het verlenen van concessies voor openbaar
      vervoer per trein.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel121
  - number: 121a
    text: |-
      [Artikel 51][ref1] is niet van toepassing op openbaar vervoer dat wordt verricht op grond van een concessie
      die is verleend na aanbesteding, indien de aanbesteding heeft plaatsgevonden voor de inwerkingtreding van
      [artikel 51][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel51
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '51'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '51'
        hoofdstuk: III
        paragraaf: '2'
  - number: '122'
    text: |-
      Keuringsbewijzen, duplicaten van keuringsbewijzen en andere bewijzen die zijn afgegeven op basis van artikel 69
      van de Wet personenvervoer zoals dit artikel luidde voor de inwerkingtreding van [artikel 127][ref1] behouden hun
      geldigheid voor de duur van de termijn waarvoor zij zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '123.1'
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat voor de dag
      van inwerkingtreding van [artikel 127][ref1] is bekendgemaakt, blijft het recht zoals het gold voor die dag van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '123.2'
    text: |-
      Ten aanzien van een bezwaar- of beroepschrift dat voor de dag van inwerkingtreding van [artikel 127][ref1] is
      ingediend en voor zover daarop bij de inwerkingtreding van deze wet nog niet is beslist, blijft het recht zoals het
      gold voor die dag van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '123.3'
    text: |-
      Ten aanzien van een bezwaar- of beroepschrift dat op of na de dag van inwerkingtreding van deze wet is ingediend en
      dat is gericht tegen een besluit waartegen voor die dag eveneens bezwaar is gemaakt of beroep is ingesteld, blijft
      het recht zoals het gold voor de dag van inwerkingtreding van [artikel 127][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '124'
    text: |-
      In afwijking van [artikel 123][ref1] wordt een bezwaar- of beroepschrift, gericht tegen een besluit omtrent het
      verrichten van taxivervoer, dat op of na 1 januari 2000 op grond van de Wet personenvervoer is ingediend en voor
      zover daarop bij de inwerkingtreding van [artikel 127][ref2] nog niet is beslist, afgehandeld volgens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '123'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '127'
    text: De Wet personenvervoer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel127
  - number: '129'
    text: De wet van 13 november 1997 tot wijziging van de Wet personenvervoer (Stb. 1997, 559) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel129
  - number: '139'
    text: ':'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel139
  - number: '141'
    text: |-
      [Artikel 16, tweede lid, van de Wet op de omzetbelasting 1968][ref1] vindt geen toepassing met betrekking tot het
      na de totstandkoming van deze wet krachtens het eerste lid van dat artikel te nemen koninklijk besluit, dat ertoe
      strekt de in [artikel 1, derde lid, onderdeel b, van het Besluit uitsluiting aftrek omzetbelasting 1968][ref2]
      vermelde verwijzing inzake besloten busvervoer naar de Wet personenvervoer, aan te passen in verband met de
      wijzigingen in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002636#Artikel1
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002636
        artikel: '1'
  - number: '142'
    text: |-
      Na de inwerkingtreding van [artikel 127][ref1] berust de Regeling maximumtarief en bekendmaking tarieven
      taxivervoer, op [artikel 84][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel84
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '127'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '143.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met dien verstande dat de
      [artikelen 65][ref1], [66][ref2] en [67][ref3] niet eerder in werking treden dan 1 januari 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel67
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '65'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '66'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '67'
        hoofdstuk: III
        paragraaf: '5'
  - number: '143.2'
    text: |-
      Indien naar het oordeel van Onze Minister redenen aanwezig zijn voor de inwerkingtreding van de
      [artikelen 65][ref1], [66][ref2] en [67][ref3], mede gelet op de naar zijn oordeel uit het in
      [artikel 108, tweede lid][ref4], bedoelde verslag gebleken doeltreffendheid en de effecten in de praktijk van
      aanbesteding van concessies als bedoeld in deze wet en het met een of beide kamers der Staten-Generaal ter zake
      gevoerde overleg, wordt een ontwerp van een koninklijk besluit tot inwerkingtreding van die artikelen zo spoedig
      mogelijk aan beide kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel108
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '65'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '66'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '67'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '143.3'
    text: |-
      Redenen als bedoeld in het tweede lid zijn in ieder geval aanwezig, indien naar het oordeel van Onze Minister
      aanbesteding van concessies als bedoeld in deze wet, heeft geleid tot:
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: 143.3.a
    text: toename van het aantal reizigerskilometers;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: 143.3.b
    text: betere dienstverlening;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: 143.3.c
    text: gelijkblijvende of lagere tarieven;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: 143.3.d
    text: gelijkblijvende of lagere kosten voor de overheid;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: 143.3.e
    text: |-
      verbetering van de veiligheid van het openbaar vervoer of van de arbeidsomstandigheden van de ten behoeve van het
      openbaar vervoer werkzame personen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: 143.3.f
    text: behoud van werkgelegenheid in het openbaar vervoer;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: 143.3.g
    text: garanties voor bereikbaarheid en toegankelijkheid.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
  - number: '143.4'
    text: |-
      De [artikelen 15 tot en met 18][ref1] en [51 tot en met 60][ref2] treden niet eerder in werking dan met ingang van
      1 januari 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel51
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '15'
        hoofdstuk: I
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '51'
        hoofdstuk: III
        paragraaf: '2'
  - number: '143.5'
    text: |-
      Indien naar het oordeel van Onze Minister redenen aanwezig zijn voor de inwerkingtreding van de
      [artikelen 15 tot en met 18][ref1] en [51 tot en met 60][ref2], mede gelet op de naar zijn oordeel
      uit het in [artikel 108, vierde lid][ref3], bedoelde onderzoek gebleken ontwikkelingen ter zake van de
      concurrentieverhoudingen op de Nederlandse markt voor openbaar vervoer en het met een of beide kamers der Staten-
      Generaal ter zake gevoerd overleg, wordt een ontwerp van een koninklijk besluit tot inwerkingtreding van die
      artikelen zo spoedig mogelijk aan beide kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel108
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '15'
        hoofdstuk: I
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '51'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '143.6'
    text: |-
      De [artikelen 36, tweede lid, tot en met 40][ref1] vervallen met ingang van 1 januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel36
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '36'
        hoofdstuk: II
        paragraaf: '4'
  - number: '144'
    text: 'Deze wet wordt aangehaald als: Wet personenvervoer 2000.'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel144
