preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op het bevorderen van een betere afstemming van het
    aanbod van personenvervoer op de vraag, alsmede het bevorderen van periodieke betwistbaarheid in het regionaal
    openbaar vervoer wenselijk is om nieuwe regels te stellen omtrent het openbaar vervoer, het besloten busvervoer en
    het taxivervoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.b
    text: |-
      regionaal openbaar lichaam: een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente of gemeenten Amsterdam, Arnhem en
      Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of Utrecht omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: 1.c
    text: |-
      Nederlandse Mededingingsautoriteit: de Nederlandse Mededingingsautoriteit, bedoeld in
      [artikel 2, eerste lid, van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
  - number: 1.d
    text: |-
      raad van bestuur van de mededingingsautoriteit: de raad van bestuur van de mededingingsautoriteit, genoemd in
      [artikel 2 van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
  - number: 1.e
    text: |-
      bus: motorrijtuig, al dan niet voorzien van een aanhangwagen, ingericht voor het vervoer van meer dan acht
      personen, de bestuurder daaronder niet begrepen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.f
    text: 'auto: motorrijtuig ingericht voor het vervoer van ten hoogste acht personen, de bestuurder daaronder niet begrepen;'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.g
    text: |-
      dienstregeling: voor een ieder kenbaar schema van reismogelijkheden waarin zijn aangeduid de halteplaatsen
      waartussen en de tijdstippen waarop openbaar vervoer wordt verricht, zo nodig onder de vermelding of de
      halteplaatsen of de tijdstippen door de reiziger kunnen worden beïnvloed;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.h
    text: |-
      openbaar vervoer: voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus, trein,
      metro, tram of een via een geleidesysteem voortbewogen voertuig;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.i
    text: 'besloten busvervoer: personenvervoer per bus, anders dan bedoeld in onderdeel h;'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.j
    text: 'taxivervoer: personenvervoer per auto, anders dan bedoeld in onderdeel h, tegen betaling;'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.k
    text: |-
      vervoerder: degene die openbaar vervoer, besloten busvervoer of taxivervoer verricht, niet in de hoedanigheid van
      bestuurder van een auto, bus, trein, metro, tram of een via een geleidesysteem voortbewogen voertuig;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.l
    text: |-
      concessie: recht om met uitsluiting van anderen openbaar vervoer te verrichten in een bepaald gebied gedurende een
      bepaald tijdvak;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: 1.m
    text: |-
      concessieverlener: het tot verlening van een concessie bevoegde gezag, bedoeld in [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: 1.n
    text: 'concessiehouder: vergunninghoudende vervoerder aan wie een concessie is verleend.'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel1
  - number: '2.1'
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel2
  - number: 2.1.a
    text: |-
      openbaar vervoer, besloten busvervoer of taxivervoer over voor het openbaar verkeer openstaande wegen, daaronder
      begrepen uitsluitend voor openbaar vervoer openstaande wegen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel2
  - number: 2.1.b
    text: openbaar vervoer over railwegen;
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel2
  - number: 2.1.c
    text: openbaar vervoer langs geleidesystemen.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat deze wet of de daarop berustende bepalingen geheel of
      gedeeltelijk mede van toepassing zijn op vervoer dat overeenkomst vertoont met het in het eerste lid bedoelde
      vervoer of dat deze wet of de daarop berustende bepalingen geheel of gedeeltelijk niet van toepassing zijn op
      bepaalde soorten van het in het eerste lid bedoelde vervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel2
  - number: '2.3'
    text: |-
      De wet is niet van toepassing op vervoer van personen per auto, anders dan openbaar vervoer, indien de som van de
      betalingen voor dat vervoer de kosten van de auto en eventuele bijkomende kosten voor dat vervoer niet te boven
      gaat, tenzij vorenstaande wordt verricht in de uitoefening van een beroep of bedrijf. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld over de kosten van de auto en eventuele bijkomende kosten.
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten behoeve van experimenten
      met openbaar vervoer voor een periode van ten hoogste zes jaar. Daarbij kan worden afgeweken van de
      [artikelen 19][ref1], [20][ref2], [24][ref3], [30][ref4], [51][ref5], [52][ref6], en [61][ref7], en
      [64 tot en met 67][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0011470#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0011470#Artikel52
      [ref7]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref8]: https://wetten.overheid.nl/BWBR0011470#Artikel64
    url: https://wetten.overheid.nl/BWBR0011470/2006-09-20#Artikel3
    references:
