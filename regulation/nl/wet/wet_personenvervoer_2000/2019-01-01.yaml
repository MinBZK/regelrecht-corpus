      - id: ref3
        bwb_id: BWBR0011470
        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
  - number: 124b
    text: |-
      Een concessie die voor de inwerkingtreding van de [Wet aanbestedingsvrijheid OV grote steden][ref1] aan een
      gemeentelijk vervoerbedrijf is verleend, blijft na de inwerkingtreding van die wet van kracht tot uiterlijk 31
      december 2019, tenzij er reeds sprake is van een vervoerder aan wie op grond van [artikel 63a][ref2] een concessie
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032225
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel63a
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel124b
    references:
      - id: ref1
        bwb_id: BWBR0032225
      - id: ref2
        bwb_id: BWBR0011470
        artikel: 63a
        hoofdstuk: III
        paragraaf: 4a
  - number: 124c
    text: |-
      Nadat een concessieverlener als bedoeld in [artikel 63a][ref1] besluit dat een aan het desbetreffende gemeentelijk
      vervoerbedrijf verleende concessie voor het openbaar vervoer per bus wordt verleend nadat daarvoor een aanbesteding
      is gehouden, mag dat vervoerbedrijf meedingen naar een concessie voor openbaar vervoer die wordt verleend door
      middel van een aanbesteding en wordt dat vervoerbedrijf om reden van dat besluit niet uitgesloten van deelname
      aan aanbestedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel63a
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel124c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 63a
        hoofdstuk: III
        paragraaf: 4a
  - number: 124d
    text: |-
      1 Op een gemeentelijk vervoerbedrijf is [artikel 69, eerste, tweede, derde, en vijfde lid][ref1], zoals dat luidde
      voor de inwerkingtreding van de [Wet aanbestedingsvrijheid OV grote steden][ref2] van toepassing.

      2 De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het eerste lid.

      3 De [artikelen 94 tot en met 96a][ref3] zijn van overeenkomstige toepassing in geval van niet naleving van de in
      het eerste lid bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0032225
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel94
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel124d
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0032225
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '94'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 124e
    text: |-
      [Artikel 38, tweede en derde lid][ref1], is van overeenkomstige toepassing indien een concessie is verleend aan
      een gemeentelijk vervoerbedrijf en deze concessie geheel of gedeeltelijk eindigt als gevolg van verlening van die
      concessie aan een andere vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel38
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel124e
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
  - number: 124f
    text: |-
      De [artikelen 124a tot en met 124f][ref1] vervallen met ingang van 31 december 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel124a
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel124f
