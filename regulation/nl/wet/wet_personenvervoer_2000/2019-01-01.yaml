  - number: 63b
    text: |-
      1 Een vervoerder aan wie op grond van [artikel 63a][ref1] een concessie is verleend, doet niet mee aan de
      aanbesteding van:

      a. concessies voor openbaar vervoer buiten de gebieden, bedoeld in [artikel 63a, eerste en tweede lid][ref2], waar
      de concessie, bedoeld in de aanhef, verleend is;

      b. concessies voor openbaar vervoer binnen de gebieden, bedoeld in [artikel 63a, eerste en tweede lid][ref3], waar
      de concessie, bedoeld in de aanhef, verleend is indien de concessieverlener dit heeft uitgesloten als bedoeld in
      [artikel 62, derde lid][ref4].

      c. vervoer buiten het gebied, bedoeld in [artikel 63a, eerste en tweede lid][ref5], waar de concessie verleend is
      waarop bij algemene maatregel van bestuur als bedoeld in [artikel 2, tweede of vierde lid][ref6], dit artikel van
      toepassing is verklaard.

      2 In afwijking van het eerste lid mag een vervoerder aan wie op grond van [artikel 63a][ref7] een concessie is
      verleend, meedoen aan een aanbesteding indien wordt voldaan aan de voorwaarden, genoemd in artikel 5, tweede lid,
      onderdeel c, van verordening (EG) 1370/2007.


