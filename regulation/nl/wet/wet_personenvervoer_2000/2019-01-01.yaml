  - number: 19c
    text: |-
      Bij een internationale passagiersvervoerdienst hebben de desbetreffende spoorwegondernemingen het recht om op
      het internationale traject passagiers te laten instappen op elk station en hen te laten uitstappen op een ander
      station, ook wanneer die in Nederland zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel19c
  - number: '20'
    text: |-
      1 Bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer per trein is Onze Minister.

      2 Bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer, anders dan openbaar vervoer
      per trein, zijn gedeputeerde staten.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat in bij die maatregel aan te wijzen gebieden in
      afwijking van het tweede lid het dagelijks bestuur van een bij gemeenschappelijke regeling ingesteld openbaar
      lichaam bevoegd is tot het verlenen, wijzigen of intrekken van de in het tweede lid bedoelde concessies in dat
      gebied.

      4 In afwijking van het eerste lid is het bestuur, bedoeld in het tweede of derde lid, bevoegd tot het verlenen,
      wijzigen of intrekken van concessies voor regionaal openbaar vervoer per trein voor de bij algemene maatregel
      van bestuur dan wel in overeenstemming met het betrokken bestuur bij besluit van Onze Minister aangewezen
      vervoersdiensten die de daarbij aangegeven stations verbinden.

      5 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel20
  - number: '21'
    text: |-
      Gedeputeerde staten dragen zorg voor de coördinatie en afstemming van het openbaar vervoer in de provincie, met
      uitzondering van het krachtens [artikel 20, derde lid][ref1], aangewezen gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
