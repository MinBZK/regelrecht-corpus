  - number: 96a
    text: |-
      1 In geval van overtreding van
      [artikel 63c, eerste, tweede, vierde, zesde tot en met tiende en elfde lid, onderdeel b][ref1],
      voor zover [artikel 96a][ref2] op dat vervoer bij algemene maatregel van bestuur als bedoeld in
      [artikel 2, tweede of vierde lid][ref3], van toepassing is verklaard, en met uitzondering van openbaar vervoer
      per trein waarvoor op grond van deze wet Onze Minister het bevoegde bestuursorgaan is, kan de Autoriteit Consument
      en Markt een bestuurlijke boete opleggen van ten hoogste € 900.000 of indien dat meer is, 1% van de omzet van de
      overtreder.

      2 In geval van overtreding van de regels gesteld krachtens [artikel 30a, eerste en derde lid][ref4], kan de
      Autoriteit Consument en Markt een bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, van
      1% van de omzet van de overtreder.

      3 De bestuurlijke boete die ingevolge het eerste of tweede lid ten hoogste kan worden opgelegd wordt verhoogd met
      100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref5], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel63c
