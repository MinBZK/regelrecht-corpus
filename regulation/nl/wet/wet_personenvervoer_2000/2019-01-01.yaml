      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de Autoriteit Consument en Markt,
      alvorens toepassing te geven aan het eerste lid, belanghebbenden in de gelegenheid mondeling of schriftelijk hun
      zienswijze kenbaar te maken.


