      1 Onze Minister is de handhavende instantie, bedoeld in de artikelen 30 van verordening 1371/2007/EG en 28, eerste
      lid, van verordening (EU) nr. 181/2011.

      2 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van verordening 1371/2007/
      EG, verordening 1071/2009/EG, verordening 1073/2009/EG, verordening (EU) nr. 181/2011 en van de bij of krachtens
      deze wet gestelde verplichtingen.

      3 De Autoriteit Consument en Markt is bevoegd tot het opleggen van een last onder dwangsom ter handhaving van bij
      ministeriële regeling aangewezen bindende EU-rechtshandelingen van algemene strekking van de Europese Commissie op
      het gebied van internationale passagiersvervoerdiensten.
