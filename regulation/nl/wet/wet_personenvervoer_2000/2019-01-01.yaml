  - number: '65'
    text: |-
      1 In deze paragraaf wordt verstaan onder het hoofdrailnet: de spoorvervoerdiensten die als zodanig bij koninklijk
      besluit zijn aangewezen.

      2 De krachtens het eerste lid aangewezen spoorvervoerdiensten kunnen met ingang van 1 januari 2015 mede de diensten
      met stations buiten Nederland betreffen, indien de eventueel daarvoor vereiste toestemming door de daartoe bevoegde
      autoriteit of autoriteiten in de desbetreffende andere lidstaat of lidstaten van de Europese Unie, is gegeven.

      3 Onze Minister kan bepalen dat een door hem verleende concessie voor het hoofdrailnet geheel of voor een door Onze
      Minister daarbij te bepalen aanmerkelijk gedeelte door de concessiehouder zal worden uitgevoerd met gebruikmaking
      van een of meer door Onze Minister aan te wijzen rechtspersonen.

      4 Een in het eerste lid bedoeld koninklijk besluit wordt niet eerder vastgesteld dan vier weken nadat het ontwerp
      aan de Tweede Kamer der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel65
  - number: '66'
    text: |-
      1 Dit artikel is van toepassing, indien Onze Minister voornemens is een concessie te verlenen voor het
      hoofdrailnet.

      2 Onze Minister stelt een beleidsvoornemen tot concessieverlening vast, waarin is opgenomen of vermeld:

      a. een beschrijving van de betrokken markt;

      b. een beschrijving van de maatregelen die ertoe strekken dat de continuïteit van het betrokken personenvervoer
      wordt gewaarborgd;

      c. een schatting van de kosten die met de concessieverlening zijn gemoeid en van de waarde van de concessie;

      d. een beschrijving van de te volgen procedure van concessieverlening; en

      e. of Onze Minister voornemens is [artikel 65, derde lid][ref1], toe te passen.

      3 Voordat Onze Minister het beleidsvoornemen vaststelt, legt hij dit voornemen ter advisering voor aan de in
      [artikel 27][ref2] bedoelde consumentenorganisaties. Artikel 27 is van overeenkomstige toepassing.

      4 Onze Minister legt het vastgestelde beleidsvoornemen voor aan de Tweede Kamer der Staten-Generaal. Indien binnen
      30 dagen na deze voorlegging ten minste 30 leden te kennen geven nadere inlichtingen te willen ontvangen over de
      voorgenomen concessieverlening, zal de aanvang van procedure tot concessieverlening niet eerder plaatsvinden dan
      dat veertien dagen zijn verstreken na het verstrekken van die inlichtingen.

      5 Indien binnen 30 dagen na de voorlegging of binnen 14 dagen na de verstrekking van de inlichtingen, bedoeld in
      het vierde lid, de Kamer als haar oordeel uitspreekt dat de concessieverlening machtiging bij wet behoeft, wordt de
      concessie eerst verleend nadat die machtiging is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel27
