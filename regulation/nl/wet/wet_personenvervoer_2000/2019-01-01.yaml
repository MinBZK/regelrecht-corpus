  - number: '81'
    text: |-
      1 Met het oog op de inzichtelijkheid voor de consument worden bij ministeriële regeling regels gesteld over
      tarieven voor taxivervoer. Deze regels kunnen betrekking hebben op:

      a. de wijze waarop het tarief is opgebouwd;

      b. de verplichting om de tariefopbouw toe te passen;

      c. een toe te passen maximumtarief.

      2 Het eerste lid heeft geen betrekking op tarieven voor taxivervoer dat wordt verricht ter uitvoering van een
      schriftelijke overeenkomst, waarbij gedurende een bij die overeenkomst vastgestelde periode meermalen taxivervoer
      wordt verricht tegen een in die overeenkomst vastgelegd tarief.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel81
  - number: 81a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over elektronische vervoerbewijzen, en daaraan te stellen
      eisen, voor taxivervoer. Deze regels kunnen in elk geval betrekking hebben op:

      a. de invoering, de vaststelling, de uitgifte, de exploitatie of het beheer van deze vervoerbewijzen;

      b. het gebruik, de geldigheid of de acceptatie;

      c. de erkenning van een of meer instellingen die deze vervoerbewijzen uitgeven, exploiteren of beheren, alsmede de
      voorschriften waaraan dergelijke instellingen moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel81a
  - number: '82'
    text: |-
      1 Bij of krachtens gemeentelijke verordening kunnen regels worden gesteld die in het belang zijn van de kwaliteit
      van op de gemeentelijke openbare weg aangeboden taxivervoer.

      2 De in het eerste lid bedoelde regels strekken tot aanvulling van de bij of krachtens deze wet vastgestelde
      bepalingen en hebben geen betrekking op andere onderwerpen dan die van de [artikelen 82a][ref1] en [82b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel82b
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 82a
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: 82b
        hoofdstuk: V
        paragraaf: '5'
  - number: 82a
    text: |-
      1 Bij of krachtens gemeentelijke verordening kunnen regels worden gesteld over:

      a. de herkenbaarheid van een auto waarmee taxivervoer op de gemeentelijke openbare weg wordt aangeboden;

      b. de eisen en verplichtingen te stellen aan bestuurders van een in onderdeel a bedoelde auto;

      c. de indiening en behandeling van klachten van consumenten over taxivervoer;

      d. de wijze waarop wordt aangetoond dat aan de ingevolge de onderdelen a tot en met c gestelde regels wordt
      voldaan;

      e. de vergoedingen die zijn verschuldigd voor de uitvoeringskosten die samenhangen met de krachtens deze
      paragraaf gestelde regels af te geven documenten en vergunningen en de uitvoeringskosten die samenhangen met de
      instandhouding van die documenten en vergunningen.

      2 De in het eerste lid bedoelde regels kunnen verschillen al naar gelang de locatie waar taxivervoer wordt
      verricht.

      3 De in het eerste lid bedoelde regels kunnen betrekking hebben op een verplichting voor de in dat lid bedoelde
      bestuurders om vanaf een of meer daartoe bij gemeentelijke verordening aangewezen locaties, consumenten op hun
      verzoek te vervoeren.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over het eerste lid.

      5 De in het vierde lid bedoelde regels kunnen in elk geval betrekking hebben op:

      a. de voorwaarden en beperkingen van de toepassing van de in het eerste lid bedoelde bevoegdheden;

      b. de aansluiting op bij of krachtens [artikel 79][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel79
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel82a
