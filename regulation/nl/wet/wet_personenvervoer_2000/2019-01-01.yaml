    text: |-
      De concessieverleners, bedoeld in [artikel 20, tweede, derde en vierde lid][ref1], verstrekken desgevraagd aan
      Onze Minister gegevens voor zover hij die nodig heeft om te kunnen voldoen aan een verzoek van de Commissie van de
      Europese Gemeenschappen als bedoeld in artikel 6, tweede lid, van verordening (EG) 1370/2007.


