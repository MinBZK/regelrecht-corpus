  - number: '22'
    text: |-
      1 De concessieverleners, bedoeld in [artikel 20][ref1], zijn bevoegd subsidies te verstrekken voor het in een
      concessie omschreven openbaar vervoer.

      2 Een concessiehouder verstrekt desgevraagd binnen een door de concessieverlener te bepalen termijn aan hem
      de gegevens voor zover die noodzakelijk zijn voor de uitvoering van de artikelen 6 en 7 van verordening (EG)
      1370/2007.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
