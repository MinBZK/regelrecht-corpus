  - number: '24'
    text: |-
      De concessieverlener verleent overeenkomstig de artikelen 4, derde en vierde lid, en 5, zesde lid, van verordening
      (EG) 1370/2007, een concessie voor beperkte duur.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel24
  - number: '25'
    text: |-
      1 Een concessie bevat, onverminderd artikel 4 van verordening (EG) 1370/2007, een omschrijving van het openbaar
      vervoer, van het gebied en de duur waarvoor de concessie is verleend, en, indien van toepassing, de prijs die de
      concessiehouder betaalt voor de concessie.

      2 Een concessie kan tevens betrekking hebben op het verrichten van openbaar vervoer van en naar het gebied, bedoeld
      in het eerste lid, indien dit is overeengekomen met de concessieverleners die het betreft.

      3 In afwijking van het eerste lid bevat een concessie voor openbaar vervoer per trein, in plaats van een
      omschrijving van het gebied waarvoor de concessie is verleend, een omschrijving van de stations waartussen het
      openbaar vervoer wordt afgewikkeld.

      4 De omschrijving, bedoeld in het derde lid, kan ook stations buiten Nederland betreffen, indien de eventueel
      daarvoor vereiste toestemming door de daartoe bevoegde autoriteit of autoriteiten in de desbetreffende andere
      lidstaat of lidstaten van de Europese Unie is gegeven.

      5 Bij de concessie en de daarbij behorende financiële afspraken wordt rekening gehouden met de voor de
      concessiehouder geldende vergoeding, bedoeld in [artikel 62 van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel62
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '62'
  - number: '26'
    text: |-
      1 Voordat een concessie wordt verleend of gewijzigd, pleegt de concessieverlener, bedoeld in
      [artikel 20, tweede, derde en vierde lid][ref1], overleg met de concessieverleners die bevoegd zijn tot het
      verlenen van concessies in aangrenzende gebieden. Het overleg voorziet in ieder geval in afspraken inzake de
      afstemming van het openbaar vervoer tussen aangrenzende concessiegebieden.

      2 Het eerste lid is van overeenkomstige toepassing op een concessie als bedoeld in [artikel 25, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel25
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel26
    references:
      - id: ref1
