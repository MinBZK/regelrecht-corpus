      Overleg als bedoeld in [artikel 26][ref1] over het verlenen van een concessie vindt plaats voordat een
      concessieverlener het programma van eisen vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel26
