  - number: 5a
    text: |-
      1 Onze Minister verklaart in afwijking van [artikel 5, eerste lid][ref1], een vervoerder die niet voldoet
      aan onderdelen b of c van dat artikellid, toch als betrouwbaar, indien het verlies van de betrouwbaarheid een
      onevenredig strenge sanctie is.

      2 Onze Minister verklaart, in afwijking van [artikel 5, tweede lid][ref2], een vervoersmanager, die niet voldoet
      aan onderdelen b, c of e van dat artikellid, toch als betrouwbaar, indien het verlies van de betrouwbaarheid een
      onevenredig strenge sanctie is.

      3 De bekendmaking van een beschikking inhoudende het verlies van de betrouwbaarheid van een vervoerder geschiedt
      in één geschrift met de bekendmaking van het daarmee samenhangende besluit tot schorsing of intrekking van de
      communautaire vergunning.

      4 De bekendmaking van een beschikking inhoudende het verlies van de betrouwbaarheid van een vervoersmanager
      geschiedt in één geschrift met de bekendmaking van het daarmee samenhangende besluit tot ongeschiktverklaring van
      de vervoersmanager.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de toepassing van het eerste en tweede
      lid waarbij wordt aangegeven wanneer het verlies van betrouwbaarheid in ieder geval een onevenredig strenge sanctie
      is.

      6 De voordracht voor een algemene maatregel van bestuur als bedoeld in het vijfde lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel5
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel5a
