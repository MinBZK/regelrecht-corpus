        artikel: '38'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003026
        artikel: '3'
  - number: 36a
    text: |-
      1 Bij een overgang van openbaar vervoer met een concessie naar een situatie als bedoeld in
      [artikel 19, tweede lid][ref1], in samenhang met artikel 5, vijfde lid, van verordening(EG) 1370/2007, is geen
      sprake van een overgang van een concessie.

      2 Bij een overgang van openbaar vervoer zonder concessie als bedoeld in [artikel 19, tweede lid][ref2], naar de
      situatie dat openbaar vervoer wordt verricht met een daartoe verleende concessie, zijn de [artikelen 36][ref3] en
      [37 tot en met 40][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel19
