        artikel: '73'
        hoofdstuk: IV
  - number: '75'
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt met het verrichten van taxivervoer
      gelijkgesteld het aanbieden van dat vervoer, tenzij dit aanbieden geschiedt door tussenpersonen die bemiddelen in
      dat vervoer bij wijze van dienstverlening of in de uitoefening van hun beroep of bedrijf.

      2 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder «de vervoerder die
      taxivervoer verricht» verstaan: degene die taxivervoer verricht, niet in de hoedanigheid van bestuurder van een
      auto.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel75
  - number: '76'
    text: |-
      1 Het is verboden taxivervoer te verrichten zonder een daartoe door Onze Minister verleende vergunning.

      2 Een vergunning als bedoeld in het eerste lid wordt verleend voor onbepaalde tijd.

      3 De vervoerder die taxivervoer verricht, alsmede de bestuurder van een auto waarmee taxivervoer wordt verricht,
      draagt er zorg voor dat in de auto waarmee dat vervoer wordt verricht het vergunningbewijs zichtbaar voor de
      reiziger aanwezig is.

      4 Een in het eerste lid bedoelde vergunning wordt, behoudens in bij algemene maatregel van bestuur bepaalde
      gevallen, slechts verleend aan een vervoerder die voldoet aan eisen van betrouwbaarheid en vakbekwaamheid.

      5 Onze Minister kan vrijstelling of ontheffing verlenen van het derde lid en van de in het vierde lid bedoelde eis
      van vakbekwaamheid.

      6 Een vrijstelling of ontheffing als bedoeld in het vijfde lid kan onder beperkingen worden verleend en er kunnen
      voorschriften aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel76
  - number: 76a
    text: |-
      1 Een vergunning kan worden geweigerd, gewijzigd, geschorst of ingetrokken. Een vergunning wordt geschorst voor
      bepaalde tijd.

      2 Een vergunning wordt steeds geweigerd indien binnen een periode van twee jaar direct voorafgaande aan de datum
      van indiening van een aanvraag voor een vergunning een eerder aan de aanvrager verleende vergunning is ingetrokken
      op grond van [artikel 99, eerste lid, onderdeel a of onderdeel b][ref1], voor zover het betreft de eis van
      betrouwbaarheid.

      3 De vergunning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2].

      4 Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3], om een advies als
      bedoeld in [artikel 9 van die wet][ref4] worden gevraagd.

      5 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.

      6 De beperkingen waaronder een vergunning wordt verleend en de aan een vergunning verbonden voorschriften kunnen
      ambtshalve of op aanvraag worden gewijzigd, geschorst of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel9
