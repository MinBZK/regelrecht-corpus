  - number: 63c
    text: |-
      1 Een vervoerder aan wie op grond van [artikel 63a][ref1] een concessie is verleend, waarbij voor die
      concessie een subsidie als bedoeld in [artikel 22][ref2] is verstrekt, en die in een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref3] verbonden is met aanbieders van andere activiteiten dan
      dat openbaar vervoer, voert een gescheiden boekhouding voor het verrichten van het openbaar vervoer waarvoor die
      concessie is verleend ten opzichte van andere activiteiten die binnen die groep worden verricht.

      2 Een vervoerder aan wie op grond van [artikel 63a][ref4] een concessie is verleend, waarbij voor die concessie
      een subsidie als bedoeld in [artikel 22][ref5] is verstrekt, en die niet in een groep als bedoeld in het eerste
      lid is verbonden, en wel tevens andere activiteiten verricht binnen een organisatie, voert voor het verrichten van
      openbaar vervoer waarvoor die concessie is verleend, een gescheiden administratie binnen de boekhouding, waarbinnen
      de kosten en opbrengsten van het verrichten van dat openbaar vervoer afzonderlijk worden geadministreerd.

      3 Een vervoerder aan wie anders dan op grond van [artikel 63a][ref6] een concessie voor openbaar vervoer is
      verleend zonder dat daartoe een aanbesteding is gehouden en waarbij voor die concessie een subsidie als bedoeld in
      [artikel 22][ref7] is verstrekt, voert voor het verrichten van openbaar vervoer waarvoor die concessie is verleend,
      een gescheiden administratie binnen de boekhouding, waarbinnen de kosten en opbrengsten van het verrichten van het
      openbaar vervoer waarvoor subsidie is verstrekt afzonderlijk worden geadministreerd.

      4 De boekhouding en de administratie, bedoeld in het eerste tot en met het derde lid, zijn zodanig vorm gegeven
      dat:

      a. de registratie van de lasten en baten van de verschillende activiteiten gescheiden zijn;

      b. alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend;

      c. de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de boekhouding, de
      gescheiden administratie en de kostprijsadministratie, bedoeld in het eerste tot en met vierde lid.

      6 Een vervoerder als bedoeld in het eerste, tweede en derde lid, bewaart de in het vierde lid bedoelde gegevens
      gedurende vijf jaar, te rekenen vanaf het einde van het boekjaar waarop de gegevens betrekking hebben.

      7 Indien een vervoerder als bedoeld in het eerste of tweede lid, niet uit hoofde van een andere wettelijke
      verplichting een jaarrekening opstelt, stelt hij een daarmee overeenkomend financieel overzicht op en legt hij dat
      overzicht voor eenieder ter inzage op al zijn kantoren op een bij regeling van Onze Minister te bepalen tijdstip.

      8 Indien een vervoerder als bedoeld in het eerste of tweede lid, niet reeds uit hoofde van een andere wettelijke
      verplichting zijn jaarrekening openbaar maakt, legt hij zijn jaarrekening voor eenieder ter inzage op al zijn
      kantoren op een bij regeling van Onze Minister te bepalen tijdstip.

      9 Een vervoerder als bedoeld in het eerste en tweede lid laat jaarlijks over het voorgaande boekjaar een verklaring
      van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref8] opstellen
      waaruit blijkt dat de financiële verhouding:

      a. voldoet aan de in het eerste, tweede, vierde en vijfde lid gestelde eisen, en

      b. tussen hem en de aanbieders van andere activiteiten voldoet aan in de in onderdeel 5 van de bijlage bij
      verordening (EG) 1370/2007 gestelde voorwaarden.

      Deze verklaring ligt tegelijkertijd met de jaarrekening of het financieel overzicht voor eenieder ter inzage op
      alle kantoren van de vervoerder.

      10 Een vervoerder als bedoeld in het derde lid laat jaarlijks over het voorgaande boekjaar een verklaring van een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref9] opstellen waaruit
      blijkt dat de financiële verhouding ten opzichte van een concessie als bedoeld in dat lid:

      a. voldoet aan de in het derde, vierde en vijfde lid gestelde eisen, en

      b. voldoet aan de in onderdeel 5 van de bijlage bij verordening (EG) 1370/2007 gestelde voorwaarden.

      Deze verklaring ligt voor eenieder ter inzage op alle kantoren van de vervoerder.

      11 Dit artikel is van overeenkomstige toepassing op een vervoerder

      a. die op grond van de [artikelen 3][ref10] of [19, tweede lid][ref11], openbaar vervoer verricht op een andere
      grondslag dan op grond van een concessie;

      b. die vervoer verricht waarop bij algemene maatregel van bestuur als bedoeld in
      [artikel 2, tweede of vierde lid][ref12], dit artikel of leden daarvan, van toepassing is verklaard, zonder dat
      voor het in onderdeel a bedoelde vervoer een aanbesteding is gehouden en waarbij voor dat vervoer een subsidie als
      bedoeld in [artikel 22, eerste lid][ref13], is verstrekt.


