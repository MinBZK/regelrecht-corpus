    text: |-
      Onverminderd [artikel 12b, tweede lid, van de Instellingswet Autoriteit Consument en Markt](onbekend), treffen de
      in [artikel 87][ref1] of [89][ref2] of de in [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument
      en Markt](onbekend) bedoelde ambtenaren en personen zo nodig met behulp van de sterke arm de nodige maatregelen,
      indien naar hun oordeel in onvoldoende mate medewerking wordt verleend bij de uitvoering van de hun opgedragen
      taak.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
