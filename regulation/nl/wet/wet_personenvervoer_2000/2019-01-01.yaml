        artikel: '61'
        hoofdstuk: III
        paragraaf: '4'
  - number: 63a
    text: |-
      1 In afwijking van [artikel 61, eerste lid][ref1], kan een concessieverlener voor openbaar vervoer, anders dan per
      trein, in een krachtens [artikel 20, derde lid][ref2], aangewezen gebied, dat de gemeenten Amsterdam, ’s-Gravenhage
      of Rotterdam omvat, een concessie verlenen zonder dat daartoe een aanbesteding is gehouden, indien deze concessie
      wordt verleend aan een vervoerder waarop het openbaar lichaam als bedoeld artikel 20, derde lid, net als over haar
      eigen diensten zeggenschap uitoefent. Artikel 5, tweede lid, van verordening (EG) 1370/2007 is van toepassing.

      2 In afwijking van [artikel 61, eerste lid][ref3], kan een concessieverlener voor openbaar vervoer, anders dan per
      trein, voor het gebied van de plusregio, bedoeld in [hoofdstuk XI van de Wet gemeenschappelijke regelingen][ref4],
      zoals dat luidde op de dag voorafgaand aan de datum van inwerkingtreding van de Wet afschaffing plusregio’s,
      dat de gemeente Utrecht omvatte, een concessie verlenen zonder dat daartoe een aanbesteding is gehouden, indien
      deze concessie wordt verleend aan een vervoerder waarop de concessieverlener net als over haar eigen diensten
      zeggenschap uitoefent. Artikel 5, tweede lid, van verordening (EG) 1370 /2007 is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel61
