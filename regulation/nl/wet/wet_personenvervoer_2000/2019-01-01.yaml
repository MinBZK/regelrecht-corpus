  - number: 82c
    text: |-
      In afwijking van [artikel 93][ref1] is het college van burgemeester en wethouders van de desbetreffende gemeente
      bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de krachtens deze paragraaf gestelde
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel93
