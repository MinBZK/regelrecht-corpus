      - id: ref2
        bwb_id: BWBR0011470
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27'
    text: |-
      1 Voordat een concessie wordt verleend of gewijzigd, vraagt de concessieverlener advies aan consumentenorganisaties
      die voldoen aan bij algemene maatregel van bestuur gestelde voorwaarden, over de aan de concessie te verbinden
      voorschriften.

      2 De concessieverlener stelt de consumentenorganisaties in de gelegenheid met hem overleg te voeren voordat advies
      wordt uitgebracht.

      3 Het advies, bedoeld in het tweede lid, wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke
      invloed kan zijn op het voornemen.

      4 De consumentenorganisaties worden door de concessieverlener zo spoedig mogelijk in kennis gesteld van de wijze
      waarop aan het uitgebrachte advies gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel27
  - number: 27a
    text: |-
      1 Voordat een concessie voor openbaar vervoer per trein over de hoofdspoorweginfrastructuur wordt verleend, vraagt
      de concessieverlener advies aan de betrokken beheerder, bedoeld in [artikel 1 van de Spoorwegwet][ref1].

      2 [Artikel 27, tweede tot en met vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '28'
    text: |-
      De concessieverlener informeert ten minste eenmaal per jaar de consumentenorganisaties, bedoeld in
      [artikel 27][ref1], over de resultaten van bij algemene maatregel van bestuur te omschrijven maatregelen die door
      hem zijn genomen en die de belangen van de reiziger raken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '29'
    text: |-
      1 De concessieverlener kan een ontheffing verlenen van het verbod, bedoeld in [artikel 19, eerste lid][ref1],
      aan een ieder, die openbaar vervoer anders dan per trein wil verrichten of die verzoekt om door een ander dan de
      desbetreffende concessiehouder openbaar vervoer anders dan per trein te laten verrichten in een gebied waarvoor aan
      de verzoeker geen concessie is verleend. De ontheffing, bedoeld in de vorige zin, kan niet worden verleend aan de
      concessiehouder van het gebied waarvoor openbaar vervoer anders dan per trein wordt verzocht.

      2 De concessieverlener kan de ontheffing wijzigen of intrekken.

      3 Een ontheffing wordt verleend voor een bepaalde tijd.

      4 Een ontheffing wordt onverminderd het eerste lid, slechts geweigerd, indien naar het oordeel van de
      concessieverlener de vervoersvoorziening waarvoor een ontheffing is aangevraagd, een zodanige gelijkenis vertoont
      met openbaar vervoer waarvoor een concessie is verleend voor het gebied, bedoeld in het eerste lid, dat daarmee een
      onevenredige afbreuk wordt gedaan aan de exploitatie van die concessie.

      5 De concessieverlener kan de ontheffing onder beperkingen verlenen of aan de ontheffing voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 29a
    text: |-
      Een besluit tot verlening of wijziging van een concessie zonder dat daartoe een aanbesteding is gehouden, kan
      worden genomen indien de vervoerder niet binnen vier dagen na de dag waarop het voorgenomen besluit aan hem is
      bekendgemaakt aan de concessieverlener heeft doen blijken dat hij de concessie niet zonder voorbehoud aanvaardt.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel29a
  - number: '30'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over nationale vervoerbewijzen, de
      daaraan te stellen eisen, de daarbij behorende tarieven en vervoersvoorwaarden, alsmede het gebied waarbinnen deze
      geldig zijn.

      2 Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de toegankelijkheid,
      gebruiksvriendelijkheid en interoperabiliteit van het openbaar vervoer regels worden gesteld over
      concessieoverstijgende onderwerpen. Deze regels kunnen betrekking hebben op:

      a. de uitgifte, de kwaliteit en de functionaliteit van vervoerbewijzen;

      b. de tarieven, waaronder de vaststelling van maximumtarieven, en vervoervoorwaarden;

      c. de informatievoorziening en klachtprocedures met betrekking tot de onderdelen a en b.

      3 De concessiehouder is verplicht reizigers te vervoeren die beschikken over een voor het concessiegebied geldig
      vervoerbewijs tegen het daarbij behorende tarief.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel30
  - number: 30a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen in het belang van een goed functionerende markt voor
      betaaldienstverlening in het openbaar vervoer regels worden gesteld met betrekking tot in elk geval:

      a. de instellingen die elektronische vervoerbewijzen uitgeven, beheren of exploiteren;

      b. toegang van concessiehouders en aanbieders van elektronische vervoerbewijzen of andere betaalwijzen tot de
      markt voor betaaldienstverlening in het openbaar vervoer alsmede tot de diensten van de in onderdeel a bedoelde
      instellingen;

      c. op een kostengeoriënteerde basis vast te stellen vergoeding voor de door de in onderdeel a bedoelde instellingen
      te verlenen diensten;

      d. maatstaven en procedures voor de verdeling van opbrengsten uit het gebruik van elektronische vervoerbewijzen.

      2 Indien uitvoering wordt gegeven aan het eerste lid, onderdelen c of d, wordt bepaald dat:

      a. de berekeningswijzen van de vergoeding en de maatstaven en procedures, bedoeld in het eerste lid,
      onderscheidenlijk onderdelen c en d, de goedkeuring behoeven van de Autoriteit Consument en Markt;

      b. op de voorbereiding van besluiten met betrekking tot de goedkeuring van maatstaven en
      procedures voor de verdeling van opbrengsten als bedoeld in het eerste lid, onderdeel d, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toelating
      van betaalwijzen tot de markt voor betaaldienstverlening in het openbaar vervoer alsmede met betrekking tot de
      acceptatie van betaalwijzen door concessiehouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 30b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan de concessiehouders worden opgedragen gezamenlijk een systeem
      van betaaldienstverlening in het openbaar vervoer in stand te houden, waarbij functionele eisen met betrekking tot
      het betaalsysteem kunnen worden gesteld, indien de situatie ontstaat of dreigt te ontstaan dat er een niet alle
      vervoersconcessies omvattend minimaal aanbod van betaaldiensten is.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel30b
  - number: 30c
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het
      beschikbaar stellen, door concessiehouders, aanbieders van elektronische vervoerbewijzen en de in
      [artikel 30a, eerste lid, onderdeel a][ref1], bedoelde instellingen, van geanonimiseerde en niet tot personen
      herleidbare gegevens over de, uit het gebruik van vervoerbewijzen af te leiden, reizigersstromen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel30a
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: 30a
        hoofdstuk: II
        paragraaf: '3'
  - number: 30d
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de samenwerking en werkwijze tussen concessieverleners en concessiehouders met betrekking tot
      concessieoverstijgende onderwerpen als bedoeld in [artikel 30, tweede lid][ref1];

      b. de samenwerking tussen concessiehouders en de in artikel 30a, eerste lid, onderdeel a, bedoelde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel30
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '30'
        hoofdstuk: II
        paragraaf: '3'
  - number: '31'
    text: |-
      1 De concessiehouder vraagt ten minste eenmaal per jaar advies aan consumentenorganisaties die voldoen aan bij
      algemene maatregel van bestuur gestelde voorwaarden, over de door de concessiehouder voorgenomen wijziging van een
      dienstregeling, het tarief en overige in de concessie geregelde onderwerpen.

      2 De concessiehouder stelt de consumentenorganisaties in de gelegenheid met hem overleg te voeren voordat advies
      wordt uitgebracht.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de aard van onderwerpen als bedoeld in het eerste
      lid.

      4 Het advies, bedoeld in het eerste lid, wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan
      zijn op de door de concessiehouder te nemen beslissing.

      5 Indien na het advies van de consumentenorganisaties een beslissing wordt genomen ten aanzien van de onderwerpen,
      bedoeld in het eerste lid, worden de consumentenorganisaties door de concessiehouder zo spoedig mogelijk, doch
      uiterlijk zes weken voor deze gevolg geeft aan de beslissing, schriftelijk hiervan in kennis gesteld. Indien het
      advies van de consumentenorganisaties niet of niet geheel is gevolgd, wordt aan de consumentenorganisaties tevens
      meegedeeld, waarom van dat advies is afgeweken en wordt hen de gelegenheid geboden nader te overleggen met de
      concessiehouder alvorens deze gevolg geeft aan de beslissing.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de termijnen die bij de
      adviesprocedure en de overlegprocedure, bedoeld in dit artikel, in acht worden genomen.

      7 Indien een voorgenomen wijziging van een dienstregeling, het tarief en overige in de concessie geregelde
      onderwerpen door de concessieverlener is geïnitieerd, vraagt in afwijking van het eerste lid die concessieverlener
      advies aan de in dat lid bedoelde consumentenorganisaties. Het tweede tot en met het zesde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel31
  - number: '32'
    text: |-
      1 De concessieverlener kan aan een concessie voorschriften verbinden.

      2 Aan een concessie worden in ieder geval voorschriften verbonden ten aanzien van:

      a. de onderwerpen waarover en de consumentenorganisaties waaraan de concessiehouder advies vraagt als bedoeld in
      [artikel 31][ref1];

      b. de onderwerpen waarover en de wijze waarop de concessiehouder de consumentenorganisaties, bedoeld in onderdeel
      a, informeert;

      c. het verstrekken van informatie aan de concessieverlener ten behoeve van de controle op de uitvoering van de
      concessie;

      d. de tarieven, de modellen van vervoerbewijzen en de vervoersvoorwaarden waartegen het openbaar vervoer moet
      worden verricht, alsmede de wijziging en openbaarmaking daarvan;

      e. het opstellen van een financiële verantwoording van het uitvoeren van de concessie, welke verantwoording
      gescheiden is van die voor andere activiteiten;

      f. de wijziging, de openbaarmaking, de datum van ingang en de geldigheidsduur van de dienstregeling;

      g. de eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een handicap;

      h. het waarborgen van een verantwoorde mate van veiligheid ten behoeve van zowel de reizigers als het personeel
      binnen het openbaar vervoer;

      i. punctualiteit;

      j. een procentuele beschikbaarheidsgarantie van zitplaatsen;

      k. het zowel op stations als in de trein aan reizigers geboden serviceniveau.

      3 Bij algemene maatregel van bestuur worden regels gesteld over het minimale niveau van toegankelijkheid van het
      openbaar vervoer dat concessieverleners middels voorschriften dienen veilig te stellen bij concessieverlening. Deze
      regels bevatten in ieder geval eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met
      een handicap en eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een fiets.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de aan een concessie te verbinden
      voorschriften.

      5 Aan een concessie kan het voorschrift worden verbonden dat de concessiehouder, indien hij tekortschiet in het
      verrichten van bepaalde prestaties, gehouden is een geldsom te voldoen aan de concessieverlener.

      6 Indien toepassing is gegeven aan het vijfde lid is de concessieverlener niet bevoegd ten aanzien van het
      verrichten van de desbetreffende prestaties aan de concessiehouder een last onder dwangsom op te leggen.
      [Artikel 5:32, eerste lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel532
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel32
