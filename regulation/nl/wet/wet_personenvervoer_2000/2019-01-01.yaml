        artikel: 124a
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '127'
    text: De Wet personenvervoer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel127
  - number: '129'
    text: De wet van 13 november 1997 tot wijziging van de Wet personenvervoer (Stb. 1997, 559) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel129
  - number: '139'
    text: ':'
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel139
  - number: '141'
    text: |-
      [Artikel 16, tweede lid, van de Wet op de omzetbelasting 1968][ref1] vindt geen toepassing met betrekking tot het
      na de totstandkoming van deze wet krachtens het eerste lid van dat artikel te nemen koninklijk besluit, dat ertoe
      strekt de in [artikel 1, derde lid, onderdeel b, van het Besluit uitsluiting aftrek omzetbelasting 1968][ref2]
      vermelde verwijzing inzake besloten busvervoer naar de Wet personenvervoer, aan te passen in verband met de
      wijzigingen in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002636#Artikel1
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002636
        artikel: '1'
  - number: '142'
    text: |-
      1 Na de inwerkingtreding van [artikel 127][ref1] berust de
      [Regeling maximumtarief en bekendmaking tarieven taxivervoer][ref2], op [artikel 84][ref3] van deze wet.

      2 Indien Artikel I, onderdeel E, van het bij koninklijke boodschap van 21 juni 2010
      ingediende voorstel van wet, inhoudende regels ter bevordering van de kwaliteit in het
      taxivervoer () in werking treedt, berust het [Besluit personenvervoer 2000][ref4] mede op de
      [artikelen 76, zesde lid][ref5], [77, derde lid][ref6], [78, tweede lid][ref7], en [79][ref8], en berust de
      [Regeling maximumtarief en bekendmaking tarieven taxivervoer][ref9] mede op [artikel 81][ref10].

      3 Indien Artikel I, onderdeel E, van het bij koninklijke boodschap van 21 juni 2010 ingediende voorstel van wet,
      inhoudende regels ter bevordering van de kwaliteit in het taxivervoer () in werking treedt:

      a. worden in [artikel 6, eerste lid, van het Besluit personenvervoer 2000][ref11] de verwijzingen naar de
      [artikelen 4, derde lid][ref12], [5 tot en met 9][ref13] en [11][ref14] gelezen als een verwijzing naar
      [artikel 76][ref15], wordt de verwijzing naar de [artikelen 12][ref16] en [13][ref17] gelezen als een verwijzing
      naar de [artikelen 77][ref18] en [78][ref19], en wordt de verwijzing naar [artikel 104][ref20] gelezen als een
      verwijzing naar [artikel 79, eerste lid, onderdelen a, b, e, f en g, tweede en vierde lid][ref21], van deze wet;

      b. wordt in [artikel 72a van het in onderdeel a bedoelde besluit][ref22] de verwijzing naar
      [artikel 13, eerste lid][ref23], gelezen als een verwijzing naar [artikel 78, eerste lid][ref24], van deze wet;

      c. wordt in [artikel 115 van het in onderdeel a bedoelde besluit][ref25] de verwijzing naar [artikel 4][ref26]
      gelezen als een verwijzing naar [artikel 76][ref27] van deze wet.


