  - number: 43b
    text: |-
      1 De overdracht en vestiging van rechten en verplichtingen ten aanzien van de productiemiddelen ingevolge
      [artikel 43a][ref1] vindt plaats op het tijdstip van overgang van de concessie.

      2 De nieuwe concessiehouder is de voormalige concessiehouder de waarde verschuldigd van de overgedragen en
      gevestigde rechten verminderd met de waarde van de overgedragen en gevestigde verplichtingen overeenkomstig hetgeen
      ter zake in de voormalige concessie is bepaald.

      3 Onverminderd [artikel 43a][ref2] verschaft de voormalige concessiehouder voor zover hij daartoe rechtens bevoegd
      is, de nieuwe concessiehouder op het tijdstip van overgang van de concessie de feitelijke macht over de over te
      dragen en te vestigen rechten en verplichtingen.

      4 De nieuwe concessiehouder is gehouden aan de overdracht en vestiging mee te werken.

      5 De kosten van de overdracht en vestiging zijn voor rekening van de nieuwe concessiehouder.

      6 Indien als gevolg van de overdracht van rechten en verplichtingen sprake is van overgang van een onderneming
      waarop [titel 10, afdeling 8, van Boek 7 van het Burgerlijk Wetboek][ref3] van toepassing is en dientengevolge
      rechten en verplichtingen ten aanzien van personen als bedoeld in [artikel 32b][ref4] overgaan op de nieuwe
      concessiehouder, is de voormalige concessiehouder jegens de nieuwe concessiehouder ter zake gehouden hem de kosten
      te vergoeden die gemaakt zijn om de desbetreffende arbeidsovereenkomst te beëindigen. Daarenboven is de voormalige
      concessiehouder jegens de nieuwe concessiehouder per geval een direct opeisbare geldsom verschuldigd van € 100 000.

      7 In afwijking van het vierde lid is de nieuwe concessiehouder niet gehouden aan de overdracht van materieel
      mee te werken, indien het de eerste aanbesteding van een concessie voor regionaal openbaar vervoer op een
      gedecentraliseerde lijn betreft na de inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel32b
