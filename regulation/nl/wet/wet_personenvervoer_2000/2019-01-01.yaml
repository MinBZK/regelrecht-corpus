  - number: '39'
    text: |-
      1 Op verzoek van de concessieverlener verstrekt de concessiehouder binnen de bij verzoek te bepalen termijn
      aan de concessieverlener ten behoeve van het programma van eisen een openbare schriftelijke opgave van
      de rechten en verplichtingen, bedoeld in [artikel 38][ref1], met betrekking tot de ten behoeve van het
      verrichte openbaar vervoer werkzame personen, met inbegrip van een gemotiveerde toelichting van de wijze
      waarop de loonkosten zijn samengesteld, alsmede van de samenstelling en het aantal van het met toepassing van
      [artikel 37, eerste lid, onderdelen a en b][ref2], voor overgang in aanmerking komend personeel.

      2 De in het eerste lid bedoelde opgave geschiedt naar de toestand op het tijdstip van de opgave en naar de te
      verwachten toestand op het tijdstip van het eindigen van de concessie. De opgave gaat vergezeld van een verklaring
      van één of meer onafhankelijke deskundigen, dat de opgave is opgesteld overeenkomstig het eerste lid.

      3 De in het tweede lid bedoelde deskundigen worden aangewezen door de concessieverlener en hun kosten komen voor
      rekening van de concessieverlener. De concessiehouder is verplicht aan de deskundigen alle door dezen gewenste
      inlichtingen te verstrekken.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de gegevens die de in het eerste lid
      bedoelde opgave ten minste moet bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel37
