  - number: '41'
    text: |-
      1 Een concessiehouder kan een concessie, die is verleend door een concessieverlener als bedoeld in
      [artikel 20, tweede of derde lid][ref1], geheel of gedeeltelijk overdragen aan een andere vervoerder, indien deze
      voldoet aan de eisen, die bij of krachtens deze wet aan de concessiehouder zijn gesteld.

      2 De andere vervoerder, bedoeld in het eerste lid, is jegens de concessieverlener verplicht tot naleving van de
      ingevolge deze wet op de concessiehouder rustende verplichtingen.

      3 De concessiehouder kan de concessie niet overdragen dan na schriftelijke toestemming van de concessieverlener.

      4 Toestemming voor overdracht van een concessie die is verleend na aanbesteding wordt onthouden, indien de
      andere vervoerder niet beschikt over een verklaring van geen bezwaar inzake de desbetreffende concessie. De
      [artikelen 52 tot en met 56, eerste lid][ref2], en[ 57 tot en met 60][ref3] zijn van overeenkomstige toepassing.

      5 Toestemming als bedoeld in het derde lid kan voorts slechts worden onthouden, indien redelijkerwijs te verwachten
      is dat de vervoerder de bij of krachtens deze wet gestelde verplichtingen niet of onvoldoende in acht zal nemen.

      6 De concessiehouder is naast de andere vervoerder hoofdelijk verbonden voor de nakoming van de uit de concessie
      voortvloeiende verplichtingen door de andere vervoerder die zijn ontstaan voor het tijdstip van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel57
