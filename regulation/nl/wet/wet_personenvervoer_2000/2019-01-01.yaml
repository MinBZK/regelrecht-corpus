  - number: '98'
    text: |-
      1 Indien de reiziger handelt in strijd met de [artikelen 70 tot en met 73][ref1] en de krachtens [artikel 74][ref2]
      gestelde regels zijn de in de [artikelen 87 en 89][ref3] bedoelde ambtenaren en personen bevoegd zijn vervoerbewijs
      in te trekken en hem zo nodig met behulp van de sterke arm het gebruik van het gehele openbaar vervoer te
      ontzeggen.

      2 Indien degene die zich bevindt in of in de onmiddellijke nabijheid van een station, halteplaats of een andere
      bij het openbaar vervoer behorende voorziening of daarbij behorende locatie als bedoeld in [artikel 72][ref4],
      in strijd handelt met de artikelen 72, [73][ref5] of de krachtens [artikel 74][ref6] gestelde regels, zijn de in
      [artikel 89][ref7] bedoelde ambtenaren en personen bevoegd deze persoon zo nodig met behulp van de sterke arm de
      toegang tot een station, halteplaats of een andere bij het openbaar vervoer behorende voorziening of de daarbij
      behorende locatie als bedoeld in artikel 72, te ontzeggen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de duur van een ontzegging als
      bedoeld in het eerste lid of het tweede lid.

      4 Het is verboden in strijd te handelen met een op grond van het eerste lid of het tweede lid opgelegde ontzegging.

      5 De in de [artikelen 87][ref8] en [89][ref9] bedoelde ambtenaren en personen zijn bevoegd bij vermoeden van een
      ten aanzien van handbagage gepleegde overtreding van het in [artikel 72][ref10] bepaalde, zich in tegenwoordigheid
      van de reiziger van aard en inhoud daarvan te overtuigen en onbevoegd meegenomen handbagage uit de vervoermiddelen
      te weren of verwijderen.


