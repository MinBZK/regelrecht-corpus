  - number: '44'
    text: |-
      1 De concessieverlener stelt ten behoeve van de verlening van een concessie, met uitzondering van een concessie als
      bedoeld in [artikel 64, eerste lid][ref1], een programma van eisen vast.

      2 Het programma van eisen heeft in elk geval betrekking op:

      a. de bereikbaarheid in het gebied waarvoor een concessie wordt verleend en op de functie van het openbaar vervoer
      voor degenen die daarvan afhankelijk zijn;

      b. de algemene eisen die aan het te verrichten openbaar vervoer worden gesteld;

      c. de afstemming met het openbaar vervoer in aangrenzende gebieden, alsmede met andere vormen van personenvervoer;

      d. de afstemming met milieudoelstellingen van de concessieverlener;

      e. de te benutten infrastructurele voorzieningen.

      3 Voordat het programma van eisen wordt vastgesteld, vraagt de concessieverlener overeenkomstig
      [artikel 27, tweede tot en met vierde lid][ref2], ter zake advies aan consumentenorganisaties die voldoen aan
      bij algemene maatregel van bestuur gestelde voorwaarden. Bij de verlening van de desbetreffende concessie is
      [artikel 27][ref3] niet van toepassing.

      4 Een concessieverlener publiceert het programma van eisen dat is opgesteld voor een concessie voor openbaar
      vervoer die wordt verleend zonder dat daarvoor een aanbesteding wordt gehouden voorafgaand aan de verlening van
      die concessie.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel44
