      1 Niet naleving van de [artikelen 70 tot en met 73][ref1] en [artikel 98, vierde lid][ref2], alsmede – voor zover
      aangeduid als strafbare feiten – het bepaalde krachtens [artikel 74, tweede lid][ref3], is een overtreding en wordt
      gestraft met een hechtenis van ten hoogste twee maanden of een geldboete van de tweede categorie.

      2 Indien de reiziger ten aanzien van wie door een ambtenaar of persoon, bedoeld in de [artikelen 87][ref4] en
      [89][ref5], is vastgesteld dat hij in strijd handelt met de [artikelen 70][ref6] of [71][ref7], niet voldoet aan
      de verplichting, bedoeld in [artikel 92][ref8], worden de in het eerste lid bedoelde straffen verhoogd tot een
      hechtenis van ten hoogste vier maanden, onderscheidenlijk een geldboete van de derde categorie.


