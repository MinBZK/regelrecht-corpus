  - number: 93a
    text: |-
      Het dagelijks bestuur van een openbaar lichaam als bedoeld in [artikel 20, derde en vierde lid][ref1], is bevoegd
      tot oplegging van een last onder bestuursdwang ter handhaving van de verplichtingen gesteld bij of krachtens
      de [artikelen 19, eerste en tweede lid][ref2], [29][ref3], [32][ref4], [34][ref5], [39][ref6], [46][ref7] en
      [63c, eerste, tweede en derde lid][ref8], met uitzondering van openbaar vervoer per trein waarvoor op grond van
      deze wet Onze Minister het bevoegde bestuursorgaan is, en elfde lid, voor zover de bevoegdheid tot handhaving niet
      op grond van [artikel 94][ref9] aan de Autoriteit Consument en Markt is toegekend.


