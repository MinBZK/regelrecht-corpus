  - number: '60'
    text: |-
      Concessieverleners en vervoerders verstrekken de raad van bestuur van de mededingingsautoriteit de inlichtingen die
      hij nodig heeft voor de uitoefening van de hem in deze paragraaf toegekende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel60
  - number: '61'
    text: |-
      1 Concessies voor openbaar vervoer worden slechts verleend nadat daartoe een aanbesteding is gehouden, tenzij
      [artikel 63a][ref1] of [artikel 64, eerste lid][ref2], van toepassing is.

      2 In bij of krachtens algemene maatregel van bestuur bepaalde gevallen kan het eerste lid buiten toepassing
      worden gelaten voor de verlening van een concessie voor regionaal openbaar vervoer per trein als bedoeld in
      [artikel 20, vierde lid][ref3].

      3 Indien het openbaar vervoer uitvalt of dreigt uit te vallen kan, in afwijking van het eerste lid, een
      aanbesteding van dat openbaar vervoer achterwege blijven. Artikel 5, vijfde lid, van verordening (EG) 1370/2007 is
      van toepassing.

      4 In afwijking van het eerste lid kan een concessie voor openbaar vervoer, anders dan per trein, worden verleend
      zonder dat daartoe een aanbesteding is gehouden, indien die concessie voldoet aan een van de kenmerken, bedoeld in
      artikel 5, vierde lid, van verordening (EG) 1370/2007.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel20
