  - number: '78'
    text: |-
      1 De vervoerder die taxivervoer verricht, maakt op een naar de aard van het vervoer geëigende wijze kenbaar op
      welke wijze klachten over het verrichten van taxivervoer worden behandeld.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel78
  - number: '79'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de inrichting, uitrusting en herkenbaarheid van een auto waarmee taxivervoer wordt verricht;

      b. de keuring van een auto waarmee taxivervoer wordt verricht;

      c. het kenbaar maken van tarieven aan de consument;

      d. de minimale beschikbaarheid van taxivervoer;

      e. de eisen en verplichtingen te stellen aan vervoerders die taxivervoer verrichten en aan bestuurders van een auto
      waarmee taxivervoer wordt verricht;

      f. de wijze waarop wordt aangetoond dat aan de ingevolge de onderdelen a tot en met e gestelde regels wordt
      voldaan;

      g. de vergoedingen die zijn verschuldigd voor de met de krachtens de [paragrafen 1 tot en met 4][ref1] van dit
      hoofdstuk gestelde regels samenhangende werkzaamheden af te geven documenten;

      h. de administratie die de vervoerder voert ten behoeve van een doelmatig toezicht op de naleving van het bij of
      krachtens deze wet bepaalde.

      2 De in het eerste lid, aanhef en onderdeel a, bedoelde regels over de inrichting en uitrusting kunnen mede
      betrekking hebben op:

      a. de aanwezigheid van apparatuur en voorzieningen ter registratie van ritten, tarieven, prijzen en arbeids- en
      rusttijden;

      b. het gebruik van zodanige apparatuur en voorzieningen met inbegrip van de afzonderlijke onderdelen daarvan;

      c. de keuring van zodanige apparatuur en voorzieningen dan wel de installatie daarvan.

      3 De in het eerste lid bedoelde regels kunnen verschillen al naar gelang de aard van het taxivervoer of de locatie
      waar taxivervoer wordt verricht.

      4 Voor zover dit noodzakelijk is ter toetsing van de geschiktheid van bestuurders, kunnen in het kader van de
      in het eerste lid, onder e, bedoelde eisen en verplichtingen, onder meer gegevens over gezondheid als bedoeld
      in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming en het gedrag van bestuurders worden
      verwerkt. Het bestuursorgaan dat bevoegd is tot toetsing aan deze eisen, is verwerkingsverantwoordelijke voor de
      verwerking van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel79
