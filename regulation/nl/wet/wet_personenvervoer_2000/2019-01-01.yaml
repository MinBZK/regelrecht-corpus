  - number: '104'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen met het oog op het verrichten van openbaar vervoer anders
      dan openbaar vervoer per trein en besloten busvervoer regels worden gesteld over:

      a. inrichting en uitrusting van een auto, bus, metro, tram of een via een geleidesysteem voortbewogen voertuig;

      b. keuring van bussen en auto's;

      c. eisen te stellen aan bestuurders van auto, bus, metro, tram of een via een geleidesysteem voortbewogen voertuig;

      d. de wijze waarop wordt aangetoond dat aan de ingevolge de onderdelen a, b en c, gestelde regels wordt voldaan;

      e. de vergoedingen die zijn verschuldigd voor de met de ingevolge de onderdelen a tot en met d gestelde regels
      samenhangende werkzaamheden en af te geven documenten.

      2 Voor zover dit noodzakelijk is ter toetsing van de geschiktheid van bestuurders, kunnen in het kader van
      de in het eerste lid, onder c, bedoelde eisen, onder meer gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15, van de Algemene verordening gegevensbescherming en het gedrag van bestuurders worden verwerkt. Het
      bestuursorgaan dat bevoegd is tot toetsing aan deze eisen, is verwerkingsverantwoordelijke voor de verwerking van
      de gegevens.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel104
  - number: '106'
    text: |-
      Onze Minister voert overleg over voorgenomen voorstellen van wet, ontwerpen van algemene maatregel van bestuur
      en ontwerpen van ministeriële regelingen op het terrein van het openbaar vervoer, het besloten busvervoer en het
      taxivervoer met ten minste vertegenwoordigers van:

      a. representatieve organisaties van werkgevers en werknemers in het openbaar vervoer, het besloten busvervoer en
      het taxivervoer;

      b. provincies, regionaal openbare lichamen en gemeenten;

      c. representatieve organisaties die de belangen van gebruikers van het openbaar vervoer, het besloten busvervoer en
      het taxivervoer behartigen.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel106
  - number: '107'
    text: |-
      De voordracht voor een eerste vaststelling van een algemene maatregel van bestuur op grond van deze wet wordt niet
      eerder gedaan dan vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel107
  - number: '108'
    text: |-
      1 Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken binnen vijf jaar na
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet, voorzover het betreft het openbaar vervoer en het besloten busvervoer, in de praktijk.

      2 Onverminderd het eerste lid zendt Onze Minister voor 1 december 2004 aan de Staten-Generaal een verslag over de
      effecten in de praktijk van aanbesteding van concessies als bedoeld in deze wet.

      3 Met het oog op de besluitvorming inzake de invoering van een plicht tot aanbesteding van concessies met
      ingang van 1 januari 2006 zendt Onze Minister voor 1 december 2004 aan de Staten-Generaal een verslag over de
      doeltreffendheid en effecten in de praktijk van aanbesteding van concessies.

      4 Onze Minister kan onderzoek doen naar de ontwikkeling van de concurrentieverhoudingen op de Nederlandse markt
      voor openbaar vervoer.

      5 De concessieverleners en de concessiehouders verstrekken ten behoeve van de verslagen, bedoeld in het eerste,
      tweede en derde lid, of het onderzoek, bedoeld in het vierde lid, desgevraagd de informatie die Onze Minister nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel108
  - number: '110'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat [artikel 53, tweede lid][ref1], buiten toepassing blijft. Na
      het tot stand komen van die regeling wordt zo spoedig mogelijk maar uiterlijk binnen acht weken een voorstel van
      wet tot goedkeuring van de ministeriële regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het
      voorstel wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te
      nemen, wordt de ministeriële regeling onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan wordt de
      ministeriële regeling ingetrokken op het tijdstip van inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel110
