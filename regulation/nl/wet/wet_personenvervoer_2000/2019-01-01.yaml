      1 De Autoriteit Consument en Markt deelt haar voornemen een beschikking te geven als bedoeld in [artikel 94][ref1]
      schriftelijk en met redenen omkleed mee aan belanghebbenden.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref2] stelt de Autoriteit Consument en Markt,
      alvorens te besluiten omtrent toepassing van [artikel 94][ref3] belanghebbenden in de gelegenheid schriftelijk of
      mondeling hun zienswijze kenbaar te maken.


