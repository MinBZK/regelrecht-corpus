  - number: '83'
    text: |-
      1 Ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties dan wel om redenen van
      internationaal vervoerbeleid kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:

      a. openbaar vervoer, besloten busvervoer en taxivervoer dat de Nederlandse grens overschrijdt;

      b. openbaar vervoer, besloten busvervoer en taxivervoer dat door een in Nederland gevestigde vervoerder geheel
      buiten Nederland of door een buiten Nederland gevestigde vervoerder geheel in Nederland wordt verricht;

      c. het rijden met een lege bus of auto over voor het openbaar verkeer openstaande wegen in Nederland of het rijden
      met een lege bus of auto door een in Nederland gevestigde vervoerder geheel of ten dele buiten Nederland of door
      een buiten Nederland gevestigde vervoerder geheel of ten dele in Nederland, voor zover dat verband houdt met het
      verrichten van openbaar vervoer, besloten busvervoer of taxivervoer.

      2 De regels, bedoeld in het eerste lid, kunnen mede betrekking hebben op de vergoeding die de aanvrager is
      verschuldigd voor de behandeling van de aanvraag om verlening of wijziging van de voor dat vervoer benodigde
      documenten.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel83
  - number: '87'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, van verordening 1071/2009/EG en van
      verordening 1073/2009/EG zijn belast:

      a. de bij besluit van Onze Minister aangewezen personen;

      b. de bij besluit van de bestuursorganen, bedoeld in [artikel 20, tweede, derde en vierde lid][ref1], aangewezen
      personen, voor zover het de door hen verleende concessies betreft, voor het bepaalde bij of krachtens de
      [artikelen 19][ref2], [29][ref3], [30 tot en met 40][ref4], [46][ref5] en [63c, eerste, tweede en derde lid][ref6],
      met uitzondering van openbaar vervoer per trein waarvoor op grond van deze wet Onze Minister het bevoegde
      bestuursorgaan is, en elfde lid voor zover niet de Autoriteit Consument en Markt is belast met dat toezicht en

      c. de bij besluit van het college van burgemeester en wethouders van de desbetreffende gemeenten
      aangewezen personen, voor zover het betreft het toezicht op naleving van het bepaalde bij of krachtens de
      [artikelen 82a][ref7] en [82b][ref8].

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, van
      verordening 1071/2009/EG en van verordening 1073/2009/EG zijn voorts belast de in
      [artikel 141 van het Wetboek van Strafvordering][ref9] bedoelde ambtenaren en de met betrekking tot deze wet
      krachtens [artikel 17, eerste lid, onder 2°, van de Wet op de economische delicten][ref10] aangewezen ambtenaren.

      3 Onverminderd het bepaalde in het eerste en tweede lid zijn met het toezicht op de naleving van het bij of
      krachtens de [artikelen 70 tot en met 74][ref11] bepaalde mede belast personen die daartoe door de vervoerder zijn
      aangewezen.

      4 Met het toezicht op de naleving van het bepaalde bij verordening 1371/2007/EG zijn de bij besluit van Onze
      Minister aangewezen personen belast.

      5 In afwijking van het eerste en tweede lid is de Autoriteit Consument en Markt belast met het toezicht op de
      naleving van:

      a. het bepaalde krachtens [artikel 30a, eerste en derde lid][ref12];

      b. [artikel 63c, vierde, zesde tot en met tiende lid en elfde lid, onderdeel b][ref13], voor zover
      op dat vervoer [artikel 87, vierde lid][ref14], bij algemene maatregel van bestuur als bedoeld in
      [artikel 2, tweede of vierde lid][ref15], van toepassing is verklaard;

      c. uitvoeringsverordening (EU) nr. 869/2014 van de Commissie van 11 augustus 2014 inzake nieuwe
      spoorvervoersdiensten voor passagiers (PbEU 2014, L 239);

      d. de bij ministeriële regeling aangewezen bindende EU-rechtshandelingen van algemene strekking van de Europese
      Commissie op het gebied van internationale passagiersvervoerdiensten.

      6 Met het toezicht op de naleving van verordening (EU) nr. 181/2011 zijn belast de bij besluit van Onze Minister
      aangewezen personen.

      7 Van een besluit als bedoeld in het eerste, vierde of zesde lid, wordt mededeling gedaan in de Staatscourant.


