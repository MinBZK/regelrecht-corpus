  - number: '62'
    text: |-
      1 Een concessieverlener sluit een vervoerder aan wie op grond van [artikel 63a][ref1] een concessie is verleend, of
      een vervoerder waarop die vervoerder invloed heeft uit van de aanbesteding van een concessie voor openbaar vervoer
      buiten het krachtens [artikel 20, derde lid][ref2], aangewezen gebied waar de concessie op grond van artikel 63a
      verleend is, ook indien die invloed slechts minimaal is.

      2 Een bestuursorgaan als bedoeld in [artikel 20][ref3], sluit een vervoerder aan wie op grond van
      [artikel 63a][ref4] een concessie is verleend, of een vervoerder waarop die vervoerder invloed heeft uit van de
      aanbesteding van vervoer buiten het krachtens artikel 20, derde lid, aangewezen gebied waar de concessie op grond
      van artikel 63a verleend is, waarop [artikel 2, tweede of vierde lid][ref5], bij algemene maatregel van bestuur van
      toepassing is verklaard, ook indien die invloed slechts minimaal is.

      3 Een concessieverlener of een bestuursorgaan kan een vervoerder aan wie op grond van [artikel 63a][ref6] een
      concessie is verleend, of een vervoerder waarop die vervoerder invloed heeft, uitsluiten van de aanbesteding
      van vervoer binnen het krachtens [artikel 20, derde lid][ref7], aangewezen gebied waar de concessie op grond van
      artikel 63a verleend is, ook indien die invloed slechts minimaal is.

      4 Een concessieverlener als bedoeld in [artikel 20, tweede of derde lid][ref8], sluit een vervoerder uit van een
      aanbesteding als bedoeld in het eerste of tweede lid, indien die vervoerder is gevestigd in een andere staat,
      niet zijnde een lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, voor zover de wederkerigheid van de toegang tot de desbetreffende markt voor
      personenvervoer voor vervoerders die in Nederland zijn gevestigd niet gewaarborgd is.

      5 Het eerste, tweede en derde lid zijn niet van toepassing indien wordt voldaan aan de voorwaarden, genoemd in
      artikel 5, tweede lid, onderdeel c, van verordening (EG) 1370/2007.

      6 Het vijfde lid is van overeenkomstige toepassing op een gemeentelijk vervoerbedrijf in de zin
      van [artikel 69, eerste of zevende lid][ref9], zoals dat luidde voor de inwerkingtreding van de
      [Wet aanbestedingsvrijheid OV grote steden][ref10].


