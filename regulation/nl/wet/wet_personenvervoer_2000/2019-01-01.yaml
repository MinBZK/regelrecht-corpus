  - number: 5c
    text: |-
      1 Onze Minister verwerkt persoonsgegevens ten behoeve van uitvoering van verordening 1071/2009/EG en verordening
      1073/2009/EG en het bij of krachtens deze wet gestelde, in het bijzonder in het belang van de handhaving van de
      vereisten voor de toegang tot het beroep van vervoerder en de betrouwbaarheid van de vervoersmanager.

      2 Onze Minister is verwerkingsverantwoordelijke, voor de in het eerste lid bedoelde gegevens.

      3 Bij regeling van Onze Minister kunnen regels worden gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel5c
  - number: '6'
    text: |-
      1 Onze Minister wijst een exameninstituut aan dat verantwoordelijk is voor de organisatie en de certificering van
      de examens, bedoeld in artikel 8, eerste lid, van verordening 1071/2009/EG.

      2 Onze Minister kan de aanwijzing, bedoeld in het eerste lid, intrekken indien het exameninstituut zijn taak
      ernstig verwaarloost of niet voldoet aan artikel 8 en de bijlagen I tot en met III van verordening 1071/2009/EG.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het is verboden openbaar vervoer anders dan per trein of besloten busvervoer te verrichten zonder geldige
      communautaire vergunning.

      2 Het is verboden openbaar vervoer anders dan per trein of besloten busvervoer te verrichten zonder de aanwezigheid
      in het voertuig van een eensluidend gewaarmerkt afschrift van de communautaire vergunning, bedoeld in het eerste
      lid.

      3 Het is verboden een gewaarmerkt afschrift van een communautaire vergunning al dan niet tegen betaling ter
      beschikking te stellen van een derde ten behoeve van het verrichten van vervoer als bedoeld in het eerste lid.

      4 Het derde lid is van overeenkomstige toepassing op degene aan wie door de houder van een communautaire vergunning
      een gewaarmerkt afschrift van de communautaire vergunning ter beschikking is gesteld.

      5 Ter uitvoering van besluiten van volkenrechtelijke organisaties kan bij algemene maatregel van bestuur
      vrijstelling worden verleend van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister is de bevoegde instantie voor verordening 1073/2009/EG.

      2 Het is een in een lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte gevestigde vervoerder, verboden om:

      a. geregeld vervoer als bedoeld in artikel 2 van verordening 1073/2009/EG te verrichten in strijd met het bij of
      krachtens die verordening bepaalde;

      b. een bijzondere vorm van geregeld vervoer als bedoeld in artikel 2 van verordening 1073/2009/EG te verrichten in
      strijd met het bij of krachtens die verordening bepaalde;

      c. ongeregeld vervoer als bedoeld in artikel 2 van verordening 1073/2009/EG te verrichten in strijd met het bij of
      krachtens die verordening bepaalde, en

      d. vervoer voor eigen rekening als bedoeld in artikel 2 van verordening 1073/2009/EG te verrichten in strijd met
      het bij of krachtens die verordening bepaalde.

      3 Op cabotagevervoer door een in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte gevestigde vervoerder, dat in Nederland op grond van
      verordening 1073/2009/EG is toegestaan, is [hoofdstuk III][ref1] van deze wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
