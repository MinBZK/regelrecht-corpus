  - number: 19b
    text: |-
      1 Een concessieverlener als bedoeld in [artikel 20, eerste en vierde lid][ref1], kan aan spoorwegondernemingen een
      heffing opleggen voor de exploitatie van een passagiersvervoerdienst op onder zijn concessiebevoegdheid vallende
      trajecten tussen twee stations in Nederland.

      2 De heffing, bedoeld in het eerste lid, voldoet aan de voorwaarden van artikel 12 van richtlijn 2012/34/EU.

      3 De in het eerste lid bedoelde concessieverleners houden de informatie, bedoeld in artikel 12, vierde lid, van
      richtlijn 2012/34/EU bij. Een concessieverlener als bedoeld in [artikel 20, eerste en vierde lid][ref2], verstrekt
      die gegevens desgevraagd aan Onze Minister voor zover Onze Minister die nodig heeft om te kunnen voldoen aan een
      verzoek van de Europese Commissie.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de heffing, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
