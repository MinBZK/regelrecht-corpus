    text: De Autoriteit Consument en Markt verricht taken ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel15
  - number: '16'
    text: |-
      Indien door Onze Minister vast te stellen beleidsregels betrekking hebben op de interpretatie van
      mededingingsbegrippen stelt Onze Minister die beleidsregels vast in overeenstemming met Onze Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel16
  - number: '19'
    text: |-
      1 Het is verboden openbaar vervoer te verrichten zonder daartoe verleende concessie.

      2 In afwijking van het eerste lid kan, indien het openbaar vervoer uitvalt of dreigt uit te vallen, voor die
      situatie openbaar vervoer worden verricht zonder concessie overeenkomstig het bepaalde in artikel 5, vijfde lid,
      van verordening (EG) 1370/2007.

      3 Het verbod, bedoeld in het eerste lid, geldt niet voor een internationale passagiersvervoerdienst waarbij slechts
      een station in Nederland wordt aangedaan.

      4 Het verbod, bedoeld in het eerste lid, geldt niet voor een internationale passagiersvervoerdienst indien daarvan
      overeenkomstig [artikel 57, vierde lid, van de Spoorwegwet][ref1] melding is gemaakt en daarvoor geen aanvraag als
      bedoeld in [artikel 19a, tweede lid][ref2], is gedaan.

      5 Het verbod, bedoeld in het eerste lid, geldt niet voor een internationale passagiersvervoerdienst indien daarvoor
      een of meer aanvragen als bedoeld in [artikel 19a, tweede lid][ref3], zijn gedaan en de Autoriteit Consument en
      Markt heeft vastgesteld dat:

      a. het hoofddoel van het vervoer is passagiers vervoeren tussen stations in verschillende lidstaten of dat geen
      aanvraag het hoofddoel betreft, en

      b. het vervoer van passagiers tussen stations in Nederland het economisch evenwicht van een of meer concessies van
      een spoorwegonderneming niet in gedrang brengt of dat geen aanvraag het economisch evenwicht betreft.

      6 Het verbod, bedoeld in het eerste lid, geldt niet voor een internationale passagiersvervoerdienst indien daarvoor
      een of meer aanvragen als bedoeld in [artikel 19a, tweede lid][ref4], zijn gedaan, en de Autoriteit Consument en
      Markt heeft vastgesteld dat:

      a. het hoofddoel van het vervoer is passagiers vervoeren tussen stations in verschillende lidstaten of dat geen
      aanvraag het hoofddoel betreft, en

      b. het vervoer van passagiers tussen stations in Nederland het economisch evenwicht van een of meer concessies van
      een spoorwegonderneming in gedrang brengt.

      7 Het vierde tot en met zesde lid is van overeenkomstige toepassing op wijzigingen van het grensoverschrijdend
      personenvervoer per trein.

      8 Bij ministeriële regeling kunnen regels worden gesteld over onder meer de toepassing van dit artikel en de
      procedure en criteria, bedoeld in de artikelen 10, vierde lid, en 11, vierde lid, van richtlijn 2012/34/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel19a
