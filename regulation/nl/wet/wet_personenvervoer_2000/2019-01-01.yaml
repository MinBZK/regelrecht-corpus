  - number: '9'
    text: |-
      1 Bij regeling van Onze Minister worden regels gesteld over de vergoeding die de aanvrager is verschuldigd voor
      de behandeling van een aanvraag tot verlening of wijziging van een communautaire vergunning of tot afgifte van een
      gewaarmerkt afschrift van een communautaire vergunning.

      2 Bij regeling van Onze Minister worden regels gesteld over de vergoeding en de betaling daarvan die de aanvrager
      is verschuldigd voor:

      a. het in behandeling nemen van een aanvraag tot verlening, wijziging of verlenging van een op grond van
      verordening 1073/2009/EG te verlenen respectievelijk verleende vergunning voor geregeld vervoer;

      b. het in behandeling nemen van een aanvraag tot verlening van een afschrift van de vergunning, bedoeld in
      onderdeel a;

      c. het in behandeling nemen van een op grond van verordening 1073/2009/EG af te geven attest voor het vervoer voor
      eigenrekening, en

      d. het in behandeling nemen van een aanvraag voor een op grond van verordening 1073/2009/EG af te geven
      reisbladenboekje.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel9
  - number: '12'
    text: |-
      1 De vervoerder voorziet, al dan niet in samenwerking met andere vervoerders, in het op verzoek behandelen
      van geschillen over de totstandkoming of de uitvoering van een vervoersovereenkomst als bedoeld in de
      [artikelen 80, eerste lid][ref1], en [100, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2], door
      instelling van een geschillencommissie.

      2 Voor zover geschillen als bedoeld in het eerste lid voortvloeien uit de uitvoering van verordening (EU) nr.
      181/2011 worden deze in eerste instantie voorgelegd aan de in dat lid bedoelde geschillencommissie.

      3 De geschillencommissie bestaat uit een oneven aantal leden, waarvan ten minste één
      voldoet aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar, bedoeld in
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref3] en waarvan de voorzitter onafhankelijk is van de
      overige leden.

      4 Bij de samenstelling van de geschillencommissie wordt aan geen van de bij het geschil betrokken partijen een
      bevoorrechte positie toegekend.

      5 De geschillencommissie beslecht een aan haar voorgelegd geschil door het uitbrengen van een bindend advies of
      door het bewerkstelligen van een minnelijke schikking tussen partijen.

      6 De geschillencommissie stelt een reglement vast over de wijze waarop een geschil wordt behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel5
