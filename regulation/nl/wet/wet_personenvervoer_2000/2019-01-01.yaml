  - number: 63ab
    text: |-
      1 De Autoriteit Consument en Markt voert een prestatievergelijking uit van vervoerders aan wie op grond van
      [artikel 63a][ref1] een concessie is verleend, die betrekking heeft op de klantenservice, kostenefficiëntie en
      doelmatigheid van de vervoerders.

      2 Bij ministeriele regeling kunnen nadere regels worden gesteld ten behoeve van de onderlinge vergelijkbaarheid van
      de verschillende vervoerders en de frequentie van de prestatievergelijking.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel63a
