  - number: 5b
    text: |-
      1 Een vervoerder waarvan de communautaire vergunning wegens het niet voldoen aan de betrouwbaarheidseis door Onze
      Minister is geschorst, is na het verstrijken van de termijn van die schorsing voor de toepassing van verordening
      1071/2009/EG, verordening 1073/2009/EG en van deze wet gerehabiliteerd.

      2 Een vervoersmanager die vanwege het niet voldoen aan de betrouwbaarheidseis door Onze Minister ongeschikt
      is verklaard om de leiding te hebben over de vervoeractiviteiten van een vervoerder, is na het verstrijken
      van de termijn van die ongeschiktverklaring voor de toepassing van verordening 1071/2009/EG en van deze wet
      gerehabiliteerd.

      3 Een vervoerder waarvan de communautaire vergunning vanwege het niet voldoen aan de betrouwbaarheidseis door Onze
      Minister is ingetrokken, is na het verstrijken van de termijn, bedoeld in [artikel 4b, vierde lid][ref1], voor de
      toepassing van verordening 1071/2009/EG, verordening 1073/2009/EG en van deze wet gerehabiliteerd.

      4 Bij of krachtens algemene maatregel van bestuur kunnen andere maatregelen voor rehabilitatie of maatregelen van
      gelijke werking en nadere regels voor de betrouwbaarheid worden vastgesteld.

      5 De voordracht voor een algemene maatregel van bestuur als bedoeld in het vierde lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4b
