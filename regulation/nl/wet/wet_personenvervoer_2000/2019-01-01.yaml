        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '36'
    text: |-
      1 Voor de toepassing van deze paragraaf wordt onder overgang van een concessie verstaan: het geheel of gedeeltelijk
      eindigen van een concessie gevolgd door het ingaan van geheel of gedeeltelijk dezelfde concessie als gevolg van
      verlening van deze concessie aan een andere vervoerder.

      2 De [artikelen 37][ref1] en [38][ref2] zijn van toepassing op de overgang van een concessie,
      tenzij iets anders voortvloeit uit een overeenkomst tussen de voormalige concessiehouder,
      de nieuwe concessiehouder en de belanghebbende verenigingen van werknemers als bedoeld in
      [artikel 3, vierde lid, van de Wet melding collectief ontslag][ref3], welke overeenkomst is tot stand gekomen
      binnen een maand na het besluit tot verlening van een concessie als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel36
    references:
