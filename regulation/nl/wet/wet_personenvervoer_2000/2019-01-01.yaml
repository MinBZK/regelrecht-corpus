    text: |-
      1 Aan een concessie kunnen nadere voorschriften worden verbonden ten aanzien van de toepassing van de
      [artikelen 43a][ref1] en [43b][ref2].

      2 In een concessie voor openbaar vervoer per trein kan de toepasselijkheid van [artikel 43a][ref3] worden
      uitgesloten.


