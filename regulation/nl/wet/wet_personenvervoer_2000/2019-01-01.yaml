  - number: '94'
    text: |-
      De Autoriteit Consument en Markt kan een last onder dwangsom opleggen aan de overtreder van:

      a. regels gesteld krachtens [artikel 30a, eerste en derde lid][ref1];

      b. [artikel 63c, vierde, zesde tot en met tiende en elfde lid, onderdeel b][ref2], voor zover op dat vervoer dit
      artikel, bij algemene maatregel van bestuur als bedoeld in [artikel 2, tweede of vierde lid][ref3], van toepassing
      is verklaard, en met uitzondering van openbaar vervoer per trein waarvoor op grond van deze wet Onze Minister het
      bevoegde bestuursorgaan is.


