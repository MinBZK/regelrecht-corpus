  - number: '42'
    text: |-
      Een concessie vervalt van rechtswege:

      a. op het moment dat de vergunning van de concessiehouder van rechtswege is vervallen;

      b. zodra een besluit tot intrekking van de vergunning van de concessiehouder onherroepelijk is geworden;

      c. zodra een besluit tot intrekking van de verklaring van geen bezwaar inzake de desbetreffende concessie
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel42
  - number: '43'
    text: |-
      1 Een concessie kan geheel of gedeeltelijk worden ingetrokken, indien is gebleken dat de concessiehouder de
      concessie niet naar behoren uitvoert of heeft uitgevoerd.

      2 Een beschikking tot gehele of gedeeltelijke intrekking van een concessie treedt niet eerder in werking dan
      dertien weken na de datum van haar bekendmaking. Zij werkt niet terug.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel43
  - number: 43a
    text: |-
      1 Tenzij de voormalige concessiehouder en de nieuwe concessiehouder anders overeenkomen, is de voormalige
      concessiehouder gehouden bij overgang van een concessie voor openbaar vervoer per trein de in de concessie
      omschreven rechten en verplichtingen ten aanzien van productiemiddelen alsmede de daarbij behorende
      bedrijfsinformatie over te dragen aan die concessiehouder of ten behoeve van die concessiehouder te vestigen.
      Indien de overgang van de concessie het gedeeltelijk eindigen gevolgd door het gedeeltelijk ingaan van dezelfde
      concessie betreft, vormen de overgedragen of gevestigde rechten en verplichtingen een dienovereenkomstig deel van
      de concessie.

      2 In een concessie voor openbaar vervoer per trein is opgenomen:

      a. een omschrijving van de rechten en verplichtingen, bedoeld in het eerste lid, en

      b. een methode waarmee de waarde op het moment van overgang van de concessie wordt bepaald van de rechten en
      verplichtingen, bedoeld in het eerste lid, zodanig dat op evenwichtige wijze wordt recht gedaan aan de belangen van
      zowel de voormalige als de nieuwe concessiehouder.

      3 Op verzoek van de concessieverlener verstrekt de concessiehouder met het oog op de verlening van een concessie
      binnen de bij het verzoek te bepalen termijn een gemotiveerde schatting van de waarde van de rechten en
      verplichtingen die worden overgedragen of gevestigd, volgens de methode, bedoeld in het tweede lid, onderdeel b.
      [Artikel 39, tweede en derde lid][ref1], is van overeenkomstige toepassing.

      4 De concessieverlener stelt ten behoeve van de voormalige concessiehouder de betaling van de waarde van de rechten
      en verplichtingen, bedoeld in [artikel 43b, tweede lid][ref2], zeker.

      5 De concessieverlener stelt ten behoeve van de nieuwe concessiehouder de ongestoorde uitoefening van
      gebruiksrechten van productiemiddelen zeker, voor zover de voormalige concessiehouder rechten of verplichtingen ten
      aanzien van die productiemiddelen heeft behouden.

      6 Het verlenen van een concessie voor openbaar vervoer per trein aan de nieuwe concessiehouder kan door de
      concessieverlener afhankelijk worden gesteld van een bankgarantie of een andere zekerheid:

      a. ten behoeve van de voormalige concessiehouder voor de betaling van de waarde van de rechten en verplichtingen,
      bedoeld in [artikel 43b, tweede lid][ref3], of

      b. ten behoeve van de opvolgende concessiehouder voor de ongestoorde uitoefening van gebruiksrechten van
      productiemiddelen, voor zover de nieuwe concessiehouder rechten of verplichtingen ten aanzien van die
      productiemiddelen zal behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel43b
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel43b
