  - number: '77'
    text: |-
      1 De vervoerder die taxivervoer verricht voorziet, al dan niet in samenwerking met andere vervoerders, in het op
      verzoek behandelen van geschillen over de totstandkoming of de uitvoering van een vervoersovereenkomst als bedoeld
      in de [artikelen 80, eerste lid][ref1], en [100, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2], door
      instelling van een geschillencommissie.

      2 [Artikel 12, tweede tot en met vijfde lid][ref3], is van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel12
