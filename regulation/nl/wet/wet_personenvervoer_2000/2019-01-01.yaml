preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op het bevorderen van een betere afstemming van het
    aanbod van personenvervoer op de vraag, alsmede het bevorderen van periodieke betwistbaarheid in het regionaal
    openbaar vervoer wenselijk is om nieuwe regels te stellen omtrent het openbaar vervoer, het besloten busvervoer en
    het taxivervoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *auto:* personenauto op ten minste vier wielen, zoals nader omschreven bij ministeriële regeling, ingericht voor
      het vervoer van ten hoogste acht personen, de bestuurder daaronder niet begrepen;
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *besloten busvervoer:* personenvervoer per bus, niet zijnde openbaar vervoer;
        - *betaaldienst:* betaaldienst in de zin van de [Wet op het financieel toezicht][ref2];
        - *betaaldienstverlening in het openbaar vervoer:* samenstel van betaaldiensten en andere diensten dat de
      betaalwijzen ondersteunt;
        - *betaalwijze:* elke manier om te kunnen voldoen aan de betalingsverplichting voor het openbaar vervoer;
        - *bus:* motorrijtuig, al dan niet voorzien van een aanhangwagen, ingericht voor het vervoer van meer dan acht
      personen, de bestuurder daaronder niet begrepen;
        - *communautaire vergunning:* vergunning als bedoeld in artikel 4 van verordening 1073/2009/EG;
        - *concessie:* recht om met uitsluiting van anderen openbaar vervoer te verrichten in een bepaald gebied gedurende
      een bepaald tijdvak;
        - *concessiehouder:* vergunninghoudende vervoerder aan wie een concessie is verleend;
        - *concessieverlener:* het tot verlening van een concessie bevoegde gezag, bedoeld in [artikel 20][ref3];
        - *dienstregeling:* voor een ieder kenbaar schema van reismogelijkheden waarin zijn aangeduid de halteplaatsen
      waartussen en de tijdstippen waarop openbaar vervoer wordt verricht, zo nodig onder de vermelding of de
      halteplaatsen of de tijdstippen door de reiziger kunnen worden beïnvloed;
        - *elektronisch vervoerbewijs:* bewijs dat toegang geeft tot en voorziet in betaling voor het gebruik van openbaar
      vervoer door elektronische registratie van de reis of een deel daarvan;
        - *internationale passagiersvervoerdienst:* een passagiervervoerdienst als bedoeld in artikel 3, onderdeel 5, van
      richtlijn 2012/34/EU;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *openbaar vervoer:* voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus,
      trein, metro, tram of een via een geleidesysteem voortbewogen voertuig;
        - *richtlijn 2012/34/EU:* richtlijn 2012/34/EU van het Europees Parlement en de Raad van 21 november 2012 tot
      instelling van één Europese spoorwegruimte (PbEU 2012, L 343/32);
        - *taxivervoer:* personenvervoer per auto tegen betaling, niet zijnde openbaar vervoer;
        - *verordening (EU) nr. 181/2011:* verordening (EU) nr. 181/2011 van het Europees Parlement en de Raad van 16
      februari 2011 betreffende de rechten van autobus- en touringcarpassagiers en tot wijziging van Verordening (EG) nr.
      2006/2004 (PbEU 2011, L 55);
        - *verordening 1071/2009/EG:* verordening (EG) nr. 1071/2009 van het Europees parlement en de Raad van de Europese
      Unie van 21 oktober 2009 tot vaststelling van gemeenschappelijke voorwaarden waaraan moet zijn voldaan om het
      beroep van wegvervoerondernemer uit te oefenen en tot intrekking van Richtlijn 96/26/EG van de Raad (PbEU L 300);
        - *verordening 1073/2009/EG:* verordening (EG) nr. 1073/2009 van het Europees parlement en de Raad van de Europese
      Unie van 21 oktober 2009 tot vaststelling van gemeenschappelijke regels voor toegang tot de internationale markt
      voor touringcar- en autobusdiensten en tot wijziging van Verordening (EG) nr. 561/2009 (PbEU L 300);
        - *verordening (EG) 1370/2007:* verordening nr. 1370/2007 van het Europees Parlement en de Raad van de Europese
      Unie van 23 oktober 2007 betreffende het openbaar personenvervoer per spoor en over de weg en tot intrekking van
      Verordening (EEG) nr. 1191/69 van de Raad en Verordening (EEG) nr. 1107/70 van de Raad (PbEU 2007, L 315);
        - *verordening 1371/2007/EG:* verordening nr. 1371/2007 van het Europees Parlement en de Raad van de Europese Unie
      van 23 oktober 2007 betreffende de rechten en verplichtingen van reizigers in het treinverkeer (PbEU L 315);
        - *vervoerder:* degene die openbaar vervoer of besloten busvervoer verricht, niet in de hoedanigheid van bestuurder
      van een auto, bus, trein, metro, tram of een via een geleidesysteem voortbewogen voertuig;
        - *vervoersmanager:* vervoersmanager als bedoeld in artikel 2 van verordening 1071/2009/EG.


