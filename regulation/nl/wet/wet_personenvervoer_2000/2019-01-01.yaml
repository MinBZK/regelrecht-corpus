  - number: '143'
    text: |-
      Indien naar het oordeel van Onze Minister redenen aanwezig zijn voor de inwerkingtreding van de
      [artikelen 15 tot en met 18][ref1] en [51 tot en met 60][ref2], mede gelet op de naar zijn oordeel
      uit het in [artikel 108, vierde lid][ref3], bedoelde onderzoek gebleken ontwikkelingen ter zake van de
      concurrentieverhoudingen op de Nederlandse markt voor openbaar vervoer en het met een of beide kamers der Staten-
      Generaal ter zake gevoerd overleg, wordt een ontwerp van een koninklijk besluit tot inwerkingtreding van die
      artikelen zo spoedig mogelijk aan beide kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel108
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel143
