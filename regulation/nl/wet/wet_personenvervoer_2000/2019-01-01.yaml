      1 Onverminderd [artikel 43, eerste lid][ref1], kan een concessie worden ingetrokken, indien aan de
      concessiehouder ter zake van overtreding van het bepaalde bij of krachtens deze wet een sanctie is opgelegd.
      [Artikel 43, tweede lid][ref2], is van toepassing.

      2 De concessieverlener kan een ontheffing als bedoeld in [artikel 29][ref3] intrekken, indien de vervoerder in
      strijd handelt met het bij of krachtens deze wet ten aanzien van de vervoerder bepaalde dan wel met de ontheffing
      of de aan de ontheffing verbonden beperkingen of voorschriften.


