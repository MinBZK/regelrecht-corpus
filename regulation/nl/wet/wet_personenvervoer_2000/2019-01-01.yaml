  - number: '80'
    text: |-
      Het is verboden taxivervoer te verrichten in strijd met de bij of krachtens de [artikelen 79][ref1], [81][ref2],
      [81a][ref3], [82a][ref4] en [82b][ref5] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel81a
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel82a
      [ref5]: https://wetten.overheid.nl/BWBR0011470#Artikel82b
