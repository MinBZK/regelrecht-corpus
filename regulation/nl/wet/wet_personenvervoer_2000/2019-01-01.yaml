  - number: 3a
    text: Deze paragraaf is van toepassing op openbaar vervoer, anders dan per trein, en besloten busvervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel3a
  - number: '4'
    text: |-
      1 De communautaire vergunning is de Nederlandse vergunning voor de uitoefening van het beroep van ondernemer van
      personenvervoer over de weg, bedoeld in verordening 1071/2009/EG, voor het openbaar vervoer per bus en het besloten
      busvervoer, heeft een geldigheidsduur van maximaal vijf jaar en kan telkens voor maximaal vijf jaren worden
      verlengd.

      2 Voor de toepassing van het eerste lid wordt met het verrichten van besloten busvervoer gelijkgesteld het
      aanbieden van dat vervoer, tenzij dit aanbieden geschiedt door tussenpersonen die bemiddelen in dat vervoer bij
      wijze van dienstverlening of in de uitoefening van hun beroep of bedrijf.

      3 Onze Minister is de bevoegde instantie voor verordening 1071/2009/EG.

      4 Bij algemene maatregel van bestuur kan met inachtneming van artikel 1, vijfde lid, van verordening 1071/2009/EG
      vrijstelling van die verordening worden verleend.

      5 Bij algemene maatregel van bestuur kunnen regels worden gegeven voor de eisen met betrekking tot betrouwbaarheid,
      vakbekwaamheid en financiële draagkracht voor het openbaar vervoer anders dan per bus of per trein.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel4
  - number: 4a
    text: |-
      1 Een vervoerder heeft geen toegang tot het beroep van wegvervoerondernemer indien op basis van het tweede lid,
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1] jegens de vervoerder
      toepassing vindt.

      2 Onze Minister weigert de verlening of verlenging van een communautaire vergunning of gaat
      over tot intrekking of schorsing van die vergunning in het geval en onder de voorwaarden van
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel4a
