  - number: 19a
    text: |-
      1 De Autoriteit Consument en Markt doet zo spoedig mogelijk na ontvangst van een melding als bedoeld in
      [artikel 57, vierde of vijfde lid, van de Spoorwegwet][ref1] mededeling van die melding in de Staatscourant en aan
      de betrokken concessieverleners, de betrokken concessiehouders en Onze Minister en vermeldt daarbij de mogelijkheid
      van een aanvraag als bedoeld in het tweede lid, en de termijn voor indiening van die aanvraag.

      2 De Autoriteit Consument en Markt stelt op daartoe strekkende aanvraag van een of meer
      betrokken concessieverleners, een of meer betrokken concessiehouders, Onze Minister of
      een beheerder als bedoeld in [artikel 1 van de Spoorwegwet][ref2] vast of het ingevolge
      [artikel 57, vierde of vijfde lid, van de Spoorwegwet][ref3], gemelde voorgenomen vervoer:

      a. het vervoeren van passagiers tussen stations in verschillende lidstaten als hoofddoel heeft, of

      b. het daarvan deel uitmakende vervoer van passagiers tussen stations in Nederland het economisch evenwicht van een
      of meer concessies van een spoorwegonderneming in gedrang brengt.

      3 De Autoriteit Consument en Markt neemt de in artikel 11, tweede lid, van richtlijn 2012/34/EU voorgeschreven
      procedurele eisen in acht.

      4 De Autoriteit Consument en Markt geeft de beschikking op de aanvraag binnen zes weken na ontvangst van de
      overeenkomstig [artikel 6b van de Instellingswet Autoriteit Consument en Markt][ref4] gevorderde gegevens en
      bescheiden.

      5 De Autoriteit Consument en Markt doet mededeling van de aanvraag en van de beschikking, bedoeld in het zesde lid,
      aan een beheerder als bedoeld in [artikel 1 van de Spoorwegwet][ref5] en doet mededeling van die beschikking in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0033043#Artikel6b
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel1
