      Binnen een maand na het besluit tot verlening van een concessie treden de voormalige en de nieuwe
      concessiehouder met elkaar en met de belanghebbende verenigingen van werknemers als bedoeld in
      [artikel 3, vierde lid, van de Wet melding collectief ontslag][ref1], in overleg teneinde een goede uitvoering
      van de [artikelen 37][ref2] en [38][ref3] dan wel van de overeenkomst, bedoeld in [artikel 36, tweede lid][ref4],
      te bevorderen.


