        artikel: '3'
  - number: 4b
    text: |-
      1 Onze Minister weigert de verlening of verlenging van de communautaire vergunning indien de vervoerder niet of
      niet meer voldoet aan de vereisten voor de uitoefening van het beroep van wegvervoerondernemer, bedoeld in artikel
      3 van verordening 1071/2009/EG.

      2 Onze Minister verklaart een vervoersmanager ongeschikt om leiding te hebben over de vervoersactiviteiten van een
      vervoerder indien hij niet langer voldoet aan de eis van betrouwbaarheid van verordening 1071/2009/EG.

      3 Onze Minister gaat over tot intrekking of schorsing van de communautaire vergunning volgens de daarvoor geldende
      procedure van verordening 1071/2009/EG indien de vervoerder definitief niet meer voldoet aan de vereisten voor de
      uitoefening van het beroep van wegvervoerondernemer van die verordening.

      4 Onze Minister stelt bij een besluit tot intrekking van de communautaire vergunning een termijn voor rehabilitatie
      vast.
    url: https://wetten.overheid.nl/BWBR0011470/2019-01-01#Artikel4b
  - number: '5'
    text: |-
      1 De voorwaarden betreffende de betrouwbaarheidseis voor een vervoerder zijn:

      a. de overlegging van een niet ouder dan twee maanden zijnde met het oog op de uitoefening
      van de functie van wegvervoerder verleende verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1];

      b. het ontbreken van een niet ouder dan twee jaar zijnde onherroepelijke rechterlijke uitspraak waarbij is
      vastgesteld dat de vervoerder de geldende voorschriften inzake de financiële loon- en arbeidsvoorwaarden niet is
      nagekomen;

      c. het ontbreken van een minder dan twee jaar oud zijnde onherroepelijke veroordeling en onherroepelijke sanctie
      jegens de vervoerder, wegens een zeer ernstige inbreuk op de communautaire wetgeving, die bij verordening
      1071/2009/EG als zodanig is aangewezen;

      d. het aantal minder dan twee jaar oud zijnde onherroepelijke veroordelingen en onherroepelijke sancties jegens de
      vervoerder wegens een bij regeling van Onze Minister, met inachtneming van het daaromtrent krachtens verordening
      1071/2009/EG bepaalde, aangewezen ernstige inbreuken op de communautaire wetgeving, overschrijdt niet de daarvoor
      bij die regeling vastgestelde grenzen, en

      e. de één of meer door de vervoerder aangewezen vervoersmanagers zijn niet ingevolge verordening 1071/2009/
      EG, door een bevoegde instantie voor die verordening, ongeschikt verklaard om de leiding te hebben over de
      vervoeractiviteiten van een vervoerder of zijn na een dergelijke ongeschiktverklaring gerehabiliteerd.

      2 De voorwaarden betreffende de betrouwbaarheidseis voor een vervoersmanager zijn:

      a. de overlegging van een niet ouder dan twee maanden zijnde met het oog op de uitoefening
      van de functie van vervoermanager verleende verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2];

      b. het ontbreken van een rechterlijke uitspraak als bedoeld in het eerste lid, onderdeel b, waarbij hij de leiding
      had over vervoeractiviteiten van de betrokken vervoerder;

      c. het ontbreken van een minder dan twee jaar oud zijnde onherroepelijke veroordeling en onherroepelijke sanctie
      jegens hem, wegens een zeer ernstige inbreuk op de communautaire wetgeving, die bij verordening 1071/2009/EG als
      zodanig is aangewezen;

      d. het aantal minder dan twee jaar oud zijnde onherroepelijke veroordelingen en onherroepelijke sancties jegens
      hem, wegens bij regeling van Onze Minister, met inachtneming van het daaromtrent krachtens verordening 1071/2009/
      EG bepaalde, aangewezen ernstige inbreuken op de communautaire wetgeving, overschrijdt niet de daarvoor bij die
      regeling aangewezen grenzen, en

      e. het ontbreken van een veroordeling en sanctie als bedoeld in het eerste lid, onderdeel c, waarbij hij de leiding
      had over de vervoeractiviteiten van de betrokken vervoerder.

      3 De griffier van een gerecht als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref3] verstrekt
      aan Onze Minister van Veiligheid en Justitie:

      a. een afschrift van een uitspraak waarbij is vastgesteld dat de vervoerder de geldende voorschriften inzake de
      financiële arbeidsvoorwaarden niet is nagekomen, en

      b. een uitspraak waarbij een in onderdeel a bedoelde uitspraak is vernietigd.

      4 Voor de toepassing van het eerste lid, onderdelen c en d, en het tweede lid, onderdelen c, d en e, worden
      veroordelingen en sancties die vóór 4 december 2011 onherroepelijk zijn geworden, niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel2
