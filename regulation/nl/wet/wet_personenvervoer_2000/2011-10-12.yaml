  - number: '93'
    text: |-
      1 Onze Minister is de handhavende instantie, bedoeld in artikel 30 van verordening 1371/2007/EG.

      2 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens
      deze wet gestelde verplichtingen en van verordening 1371/2007/EG.

      3 De raad van bestuur van de mededingingsautoriteit is bevoegd tot het opleggen van een last onder dwangsom ter
      handhaving van [artikel 19a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel93
    references:
