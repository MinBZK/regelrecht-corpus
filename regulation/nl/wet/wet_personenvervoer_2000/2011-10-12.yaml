  - number: '99'
    text: |-
      1 Onze Minister kan een vergunning volgens bij algemene maatregel van bestuur vast te stellen regels, wijzigen,
      schorsen of intrekken:

      a. indien is gehandeld in strijd met het bij of krachtens deze wet bepaalde;

      b. indien niet langer wordt voldaan aan een van de in [artikel 9, eerste lid][ref1], en
      [artikel 76, vierde lid][ref2] bedoelde eisen, tenzij een ontheffing als bedoeld in het tweede lid van dat artikel
      is verleend;

      c. in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3].

      2 Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], om een advies als
      bedoeld in [artikel 9 van die wet][ref5] worden gevraagd.


