  - number: '96'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit kan een last onder dwangsom wijzigen of intrekken.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de raad van bestuur van de
      mededingingsautoriteit, alvorens toepassing te geven aan het eerste lid, belanghebbenden in de gelegenheid
      mondeling of schriftelijk hun zienswijze kenbaar te maken.


