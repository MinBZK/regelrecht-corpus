  - number: '42'
    text: |-
      Onverminderd [artikel 61, vijfde lid][ref1] vervalt een concessie van rechtswege:

      a. op het moment dat de vergunning van de concessiehouder van rechtswege is vervallen;

      b. zodra een besluit tot intrekking van de vergunning van de concessiehouder onherroepelijk is geworden;

      c. zodra een besluit tot intrekking van de verklaring van geen bezwaar inzake de desbetreffende concessie
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
