  - number: '64'
    text: |-
      1 Onze Minister is bevoegd een concessie als bedoeld in [artikel 20, eerste lid][ref1], te verlenen zonder dat
      daartoe de procedure van de [paragrafen 1 tot en met 3][ref2] van dit hoofdstuk wordt toegepast.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop een concessie
      door Onze Minister wordt verleend, indien daartoe niet de procedure van de [paragrafen 1 tot en met 3][ref3] van
      dit hoofdstuk wordt toegepast.

      3 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen onder meer regels worden
      gesteld over:

      a. de keuze van de voor het verlenen van een concessie te volgen procedures;

      b. de criteria voor toelating van ondernemingen tot de procedure voor het verlenen van een concessie, waaronder de
      uitsluiting van ondernemingen die door hun marktmacht of concurrentiepositie een eerlijke competitie belemmeren;

      c. de criteria voor het verlenen van een concessie.

      4 Een concessie voor het hoofdrailnet wordt door Onze Minister niet eerder verleend, dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0011470#HoofdstukIII
