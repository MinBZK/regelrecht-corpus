    text: |-
      1 Niet naleving van de [artikelen 70 tot en met 73][ref1], alsmede – voor zover aangeduid als strafbare feiten –
      het bepaalde krachtens [artikel 74, tweede lid][ref2], is een overtreding en wordt gestraft met een hechtenis van
      ten hoogste twee maanden of een geldboete van de tweede categorie.

      2 Indien de reiziger ten aanzien van wie door een ambtenaar of persoon, bedoeld in de [artikelen 87][ref3] en
      [89][ref4], is vastgesteld dat hij in strijd handelt met de [artikelen 70][ref5] of [71][ref6], niet voldoet aan
      de verplichting, bedoeld in [artikel 92][ref7], worden de in het eerste lid bedoelde straffen verhoogd tot een
      hechtenis van ten hoogste vier maanden, onderscheidenlijk een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
