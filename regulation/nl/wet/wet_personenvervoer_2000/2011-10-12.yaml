    text: |-
      1 Een jaar na inwerkingtreding van [artikel 127][ref1] vervallen de overeenkomsten ter uitvoering van de artikelen
      12 en 17 van de Wet personenvervoer, zoals die artikelen luidden voor de inwerkingtreding van [artikel 127][ref2],
      die bestaan tussen een overheid die op grond van de Wet personenvervoer bevoegd was tot het vaststellen van
      dienstregelingen en een vervoerder.

      2 De overheid, bedoeld in het eerste lid, kan de overeenkomst op een eerder tijdstip beëindigen ten behoeve van het
      verlenen van een concessie aan de vervoerder, bedoeld in het eerste lid, dan wel een andere vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
