  - number: '2'
    text: |-
      1 Deze wet is van toepassing op:

      a. openbaar vervoer, besloten busvervoer of taxivervoer over voor het openbaar verkeer openstaande wegen, daaronder
      begrepen uitsluitend voor openbaar vervoer openstaande wegen;

      b. openbaar vervoer over railwegen;

      c. openbaar vervoer langs geleidesystemen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat deze wet of de daarop berustende bepalingen geheel
      of gedeeltelijk mede van toepassing zijn op vervoer dat overeenkomst vertoont met het in het eerste lid bedoelde
      vervoer of dat deze wet of de daarop berustende bepalingen geheel of gedeeltelijk niet van toepassing zijn op
      bepaalde soorten van het in het eerste lid bedoelde vervoer.

      3 Deze wet is in afwijking van het eerste lid voor wat betreft de onderdelen betreffende de uitvoering van
      verordening 1371/2007/EG ook van toepassing op ander vervoer van personen langs railwegen dan openbaar vervoer.

      4 De wet is niet van toepassing op vervoer van personen per auto, anders dan openbaar vervoer, indien de som van
      de betalingen voor dat vervoer de kosten van de auto en eventuele bijkomende kosten voor dat vervoer niet te boven
      gaat, tenzij vorenstaande wordt verricht in de uitoefening van een beroep of bedrijf. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld over de kosten van de auto en eventuele bijkomende kosten.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel2
  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten behoeve van experimenten
      met openbaar vervoer voor een periode van ten hoogste zes jaar. Daarbij kan worden afgeweken van de
      [artikelen 19][ref1], [20][ref2], [24][ref3], [30][ref4], [51][ref5], [52][ref6], en [61][ref7].

      2 De voordracht voor een algemene maatregel van bestuur waarbij wordt afgeweken van deze wet wordt niet eerder
      gedaan dan vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.


