  - number: '98'
    text: |-
      1 Indien de reiziger handelt in strijd met de [artikelen 70 tot en met 74][ref1] zijn de in de
      [artikelen 87 en 89][ref2] bedoelde ambtenaren en personen bevoegd zijn vervoerbewijs in te trekken en hem zo nodig
      met behulp van de sterke arm het gebruik van het openbaar vervoer te ontzeggen.

      2 De in de [artikelen 87][ref3] en [89][ref4] bedoelde ambtenaren en personen zijn bevoegd bij vermoeden van een
      ten aanzien van handbagage gepleegde overtreding van het in [artikel 72][ref5] bepaalde, zich in tegenwoordigheid
      van de reiziger van aard en inhoud daarvan te overtuigen en onbevoegd meegenomen handbagage uit de vervoermiddelen
      te weren of verwijderen.


