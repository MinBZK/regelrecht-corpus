  - number: '104'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen met het oog op het verrichten van openbaar vervoer anders
      dan openbaar vervoer per trein en besloten busvervoer regels worden gesteld over:

      a. inrichting en uitrusting van een auto, bus, metro, tram of een via een geleidesysteem voortbewogen voertuig;

      b. keuring van bussen en auto's;

      c. eisen te stellen aan bestuurders van auto, bus, metro, tram of een via een geleidesysteem voortbewogen voertuig;

      d. de wijze waarop wordt aangetoond dat aan de ingevolge de onderdelen a, b en c, gestelde regels wordt voldaan;

      e. de vergoedingen die zijn verschuldigd voor de met de ingevolge de onderdelen a tot en met d gestelde regels
      samenhangende werkzaamheden en af te geven documenten.

      2 Voor zover dit noodzakelijk is ter toetsing van de geschiktheid van bestuurders, kunnen in het kader van de
      in het eerste lid, onder c, bedoelde eisen, onder meer gegevens betreffende de gezondheid en het gedrag van
      bestuurders worden verwerkt. Het bestuursorgaan dat bevoegd is tot toetsing aan deze eisen, is verantwoordelijke
      voor de verwerking van de gegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '105'
    text: |-
      1 Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van
      Beroep voor het bedrijfsleven.

      2 In afwijking van het eerste lid is voor beroepen tegen besluiten op grond van de
      [artikelen 56, eerste lid][ref1], [59, eerste lid][ref2], [94, eerste lid][ref3], en [96, eerste lid][ref4], de
      rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel56
