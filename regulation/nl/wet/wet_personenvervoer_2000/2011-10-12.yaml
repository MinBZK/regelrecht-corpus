      - id: ref1
        bwb_id: BWBR0011470
        artikel: '73'
        hoofdstuk: IV
  - number: '75'
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt met het verrichten van taxivervoer
      gelijkgesteld het aanbieden van dat vervoer, tenzij dit aanbieden geschiedt door tussenpersonen die bemiddelen in
      dat vervoer bij wijze van dienstverlening of in de uitoefening van hun beroep of bedrijf.

      2 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder «de vervoerder die
      taxivervoer verricht» verstaan: degene die taxivervoer verricht, niet in de hoedanigheid van bestuurder van een
      auto.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel75
  - number: '76'
    text: |-
      1 Het is verboden taxivervoer te verrichten zonder een daartoe verleende vergunning.

      2 Een vergunning als bedoeld in het eerste lid wordt verleend voor onbepaalde tijd.

      3 De vervoerder die taxivervoer verricht, alsmede de bestuurder van een auto waarmee taxivervoer wordt verricht,
      draagt er zorg voor dat in de auto waarmee dat vervoer wordt verricht het vergunningbewijs zichtbaar voor de
      reiziger aanwezig is.

      4 Een in het eerste lid bedoelde vergunning wordt, behoudens in bij algemene maatregel van bestuur bepaalde
      gevallen, slechts verleend aan een vervoerder die voldoet aan eisen van betrouwbaarheid en vakbekwaamheid.

      5 Onze Minister kan vrijstelling verlenen van het derde lid en van de in het vierde lid bedoelde eis van
      vakbekwaamheid.

      6 De [artikelen 5 tot en met 9][ref1] en [11][ref2] zijn van overeenkomstige toepassing, met dien verstande dat
      de in artikel 9, vijfde lid, bedoelde regels over de eisen van kredietwaardigheid niet van toepassing zijn op de
      vervoerder die taxivervoer verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel11
