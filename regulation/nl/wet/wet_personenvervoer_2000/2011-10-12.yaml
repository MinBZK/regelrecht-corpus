  - number: 3a
    text: Deze paragraaf is van toepassing op openbaar vervoer, anders dan per trein, en besloten busvervoer.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel3a
  - number: '4'
    text: |-
      1 Het is verboden openbaar vervoer anders dan per trein of besloten busvervoer te verrichten zonder een daartoe
      verleende communautaire vergunning.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing in de bij algemene maatregel van bestuur bepaalde
      gevallen.

      3 Voor de toepassing van het eerste wordt met het verrichten van besloten busvervoer gelijkgesteld het aanbieden
      van dat vervoer, tenzij dit aanbieden geschiedt door tussenpersonen die bemiddelen in dat vervoer bij wijze van
      dienstverlening of in de uitoefening van hun beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel4
  - number: '5'
    text: Onze Minister beslist op een aanvraag voor een vergunning.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel5
  - number: 5a
    text: |-
      1 De vervoerder die openbaar vervoer of besloten busvervoer verricht, alsmede de bestuurder van een bus of auto
      waarmee openbaar vervoer of besloten busvervoer wordt verricht, draagt er zorg voor dat in de bus of auto waarmee
      dat vervoer wordt verricht een geldig vergunningbewijs aanwezig is.

      2 Vergunningbewijzen kunnen op aanvraag door Onze Minister worden verstrekt aan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel5a
  - number: '6'
    text: |-
      1 Een vergunning als bedoeld in [artikel 4, eerste lid][ref1], wordt verleend voor een periode van vijf jaar.

      2 Een vergunning kan worden geweigerd, gewijzigd, geschorst of ingetrokken. Een vergunning wordt geschorst voor
      bepaalde tijd.

      3 Een vergunning wordt steeds geweigerd, indien binnen een periode van twee jaar direct voorafgaande aan de datum
      van indiening van een aanvraag voor een vergunning een eerder aan de aanvrager verleende vergunning is ingetrokken
      op grond van [artikel 99, onderdeel a, of onderdeel b][ref2], voor zover het betreft de eis van betrouwbaarheid.

      4 De vergunning kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3].

      5 Voordat toepassing wordt gegeven aan het vierde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], om een advies als
      bedoeld in [artikel 9 van die wet][ref5] worden gevraagd.

      6 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.

      7 De beperkingen waaronder een vergunning wordt verleend en de aan een vergunning verbonden voorschriften kunnen
      ambtshalve of op aanvraag worden gewijzigd, geschorst of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0013798#Artikel9
