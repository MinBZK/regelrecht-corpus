      1 Een ontheffing van de eis van vakbekwaamheid die voor 1 januari 1988 is verleend op grond van artikel 56a,
      eerste lid, van de Wet Autovervoer Personen, en die met ingang van die dag is aangemerkt als een ontheffing als
      bedoeld in artikel 9, tweede lid, van de Wet personenvervoer, geldt met ingang van de dag van inwerkingtreding van
      [artikel 127][ref1] als een ontheffing als bedoeld in [artikel 9, tweede lid][ref2].

      2 Degene die op grond van artikel 68 van de Wet Autovervoer Personen werd geacht te voldoen aan de eis van
      vakbekwaamheid, bedoeld in artikel 56a, eerste lid, van die wet, en op grond van artikel 105 van de Wet
      personenvervoer werd geacht te voldoen aan de eis van vakbekwaamheid, bedoeld in artikel 9, eerste lid, van die
      wet, voldoet aan de eis van vakbekwaamheid, bedoeld in [artikel 9, eerste lid][ref3].

      3 Een ontheffing van de eis van vakbekwaamheid die is verleend op grond van artikel 9, tweede lid, van de Wet
      personenvervoer, geldt met ingang van de dag van inwerkingtreding van [artikel 113][ref4] als een ontheffing als
      bedoeld in [artikel 9, tweede lid][ref5].


