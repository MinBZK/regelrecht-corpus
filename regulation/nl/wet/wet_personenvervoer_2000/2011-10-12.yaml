  - number: '110'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat [artikel 53, tweede lid][ref1], buiten toepassing blijft. Na
      het tot stand komen van die regeling wordt zo spoedig mogelijk maar uiterlijk binnen acht weken een voorstel van
      wet tot goedkeuring van de ministeriële regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het
      voorstel wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te
      nemen, wordt de ministeriële regeling onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan wordt de
      ministeriële regeling ingetrokken op het tijdstip van inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel110
