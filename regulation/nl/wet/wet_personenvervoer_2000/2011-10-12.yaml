  - number: '13'
    text: |-
      1 De vervoerder maakt op een naar de aard van het vervoer geëigende wijze kenbaar op welke wijze klachten over het
      verrichten van personenvervoer worden behandeld.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel13
  - number: '14'
    text: |-
      1 De vervoerder verstrekt onder redelijke en objectief gerechtvaardigde voorwaarden gegevens omtrent het door
      hem te verrichten vervoer aan degene die hierom verzoekt ten behoeve van het voeden en actualiseren van een
      reisinformatiesysteem.

      2 Vervoerders die openbaar vervoer verrichten dragen op zodanige wijze financieel bij aan een door Onze Minister
      aan te wijzen exploitant van een reisinformatiesysteem met een landelijk bereik, dat daardoor de instandhouding van
      dat systeem is gewaarborgd.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de aard van gegevens als
      bedoeld in het eerste lid, de gevallen waarin Onze Minister een exploitant aanwijst, en over de wijze waarop aan
      het tweede lid toepassing wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel14
  - number: '15'
    text: De raad van bestuur van de mededingingsautoriteit verricht taken ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel15
  - number: '16'
    text: |-
      Indien door Onze Minister vast te stellen beleidsregels betrekking hebben op de interpretatie van
      mededingingsbegrippen stelt Onze Minister die beleidsregels vast in overeenstemming met Onze Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel16
  - number: '18'
    text: |-
      Gegevens of inlichtingen omtrent een onderneming, die in verband met enige werkzaamheid ten behoeve van de
      uitvoering van deze wet zijn verkregen door de Nederlandse Mededingingsautoriteit, mogen uitsluitend worden
      gebruikt voor de toepassing van deze wet en de [Mededingingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '19'
    text: |-
      1 Het is verboden openbaar vervoer te verrichten zonder daartoe verleende concessie.

      2 Indien op grond van [artikel 42][ref1] of [43][ref2] een concessie is opgehouden te bestaan, kan maximaal één
      jaar openbaar vervoer worden verricht zonder concessie volgens bij ministeriële regeling nader te stellen regels.

      3 Het eerste lid geldt niet ten aanzien van vervoer per trein verricht door internationale samenwerkingsverbanden
      als bedoeld in [richtlijn 91/440/EEG](31991L0440) van de Raad van de Europese Gemeenschappen van 29 juli 1991
      betreffende de ontwikkeling van de spoorwegen in de Gemeenschap (PbEG L 237) voor zover de in artikel 10 van die
      richtlijn bedoelde diensten worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel43
