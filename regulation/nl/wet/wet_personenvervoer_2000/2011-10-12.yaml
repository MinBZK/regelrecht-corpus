      Overtreding van de [artikelen 4][ref1], [11, tweede en derde lid][ref2], [76, eerste en zesde lid][ref3], voor
      zover in laatstbedoeld lid wordt verwezen naar artikel 11, tweede en derde lid zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
