      1 Indien de voormalige concessiehouder geen vervoerder is als bedoeld in [artikel 69, eerste of zevende lid][ref1]:

      a. zijn op de overgang van een concessie de
      [artikelen 14a, eerste, tweede en vierde lid, van de Wet op de collectieve arbeidsovereenkomst][ref2] en
      __REF001___________________________________________________________________________________________________________
      ________________ van overeenkomstige toepassing en

      b. gaan door de overgang van de concessie de rechten en verplichtingen welke op het tijdstip van
      overgang van concessie voor de voormalige concessiehouder ten aanzien van een persoon als bedoeld in
      [artikel 37, eerste lid][ref4], voortvloeien uit bedrijfsregelingen, van rechtswege over op de nieuwe
      concessiehouder.

      2 Indien de voormalige concessiehouder een vervoerder is als bedoeld in [artikel 69, eerste of zevende lid][ref5],
      handhaaft de nieuwe concessiehouder na de overgang van een concessie ten aanzien van een persoon als bedoeld
      in [artikel 37, eerste lid][ref6], een samenstel van rechten en verplichtingen gelijkwaardig aan die welke voor
      het tijdstip van de overgang voor de voormalige concessiehouder uit de privaatrechtelijke of publiekrechtelijke
      arbeidsverhouding tussen de voormalige concessiehouder en die persoon voortvloeiden, voor zover deze rechten en
      verplichtingen voortvloeiden uit collectieve regelingen inzake arbeidsvoorwaarden.

      3 Op het eindigen van de rechten en verplichtingen, bedoeld in het tweede lid, zijn de
      [artikelen 14a, tweede en vierde lid, van de Wet op de collectieve arbeidsovereenkomst][ref7] en
      __REF001___________________________________________________________________________________________________________
      ______________________________________ van overeenkomstige toepassing.

      4 De [artikelen 662][ref9] en [663 van Boek 7 van het Burgerlijk Wetboek][ref10] zijn van
      overeenkomstige toepassing, indien de voormalige concessiehouder een vervoerbedrijf is als bedoeld in
      [artikel 64, tweede lid, onderdeel a][ref11].


