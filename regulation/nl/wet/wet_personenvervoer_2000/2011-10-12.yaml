  - number: '61'
    text: |-
      1 Met ingang van een bij algemene maatregel van bestuur bepaald tijdstip verleent een concessieverlener voor
      het openbaar vervoer, anders dan per trein, in zijn concessiegebied slechts een concessie nadat daartoe een
      aanbesteding is gehouden.

      2 Onze Minister kan op aanvraag van een concessieverlener een ontheffing verlenen van de in het eerste lid bedoelde
      verplichting indien:

      a. de concessie een overbrugging vormt voor:

      1°. een wijziging van de indeling van concessiegebieden;

      2°. een samenvoeging van meerdere vervoersvormen in één concessie;

      b. onverminderd [artikel 3, eerste lid][ref1], de concessie betrekking heeft op openbaar vervoer dat een
      vernieuwende technologie of vervoersconcept bevat dat niet tot stand komt indien de concessie zou worden
      aanbesteed.

      3 Een ontheffing kan onder beperkingen worden verleend en aan de ontheffing kunnen voorschriften worden verbonden.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het eerste, tweede
      en derde lid.

      5 Een concessie voor openbaar vervoer, anders dan per trein, die is verleend zonder dat daartoe een aanbesteding is
      gehouden, vervalt op het met toepassing van het eerste lid bepaalde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel3
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel61
