preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op het bevorderen van een betere afstemming van het
    aanbod van personenvervoer op de vraag, alsmede het bevorderen van periodieke betwistbaarheid in het regionaal
    openbaar vervoer wenselijk is om nieuwe regels te stellen omtrent het openbaar vervoer, het besloten busvervoer en
    het taxivervoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. regionaal openbaar lichaam: een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente of gemeenten Amsterdam, Arnhem en
      Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of Utrecht omvat;

      c. Nederlandse Mededingingsautoriteit: de Nederlandse Mededingingsautoriteit, bedoeld in
      [artikel 2, eerste lid, van de Mededingingswet][ref2];

      d. raad van bestuur van de mededingingsautoriteit: de raad van bestuur van de mededingingsautoriteit, genoemd in
      [artikel 2 van de Mededingingswet][ref3];

      e. bus: motorrijtuig, al dan niet voorzien van een aanhangwagen, ingericht voor het vervoer van meer dan acht
      personen, de bestuurder daaronder niet begrepen;

      f. auto: personenauto op ten minste vier wielen, zoals nader omschreven bij ministeriële regeling, ingericht voor
      het vervoer van ten hoogste acht personen, de bestuurder daaronder niet begrepen;

      g. dienstregeling: voor een ieder kenbaar schema van reismogelijkheden waarin zijn aangeduid de halteplaatsen
      waartussen en de tijdstippen waarop openbaar vervoer wordt verricht, zo nodig onder de vermelding of de
      halteplaatsen of de tijdstippen door de reiziger kunnen worden beïnvloed;

      h. openbaar vervoer: voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus, trein,
      metro, tram of een via een geleidesysteem voortbewogen voertuig;

      i. besloten busvervoer: personenvervoer per bus, anders dan bedoeld in onderdeel h;

      j. taxivervoer: personenvervoer per auto, anders dan bedoeld in onderdeel h, tegen betaling;

      k. vervoerder: degene die openbaar vervoer of besloten busvervoer verricht, niet in de hoedanigheid van bestuurder
      van een auto, bus, trein, metro, tram of een via een geleidesysteem voortbewogen voertuig;

      l. concessie: recht om met uitsluiting van anderen openbaar vervoer te verrichten in een bepaald gebied gedurende
      een bepaald tijdvak;

      m. concessieverlener: het tot verlening van een concessie bevoegde gezag, bedoeld in [artikel 20][ref4];

      n. concessiehouder: vergunninghoudende vervoerder aan wie een concessie is verleend;

      o. Communautaire vergunning: vergunning als bedoeld in artikel 3bis van verordening (EEG) nr. 684/92 van de Raad
      van de Europese Gemeenschappen van 16 maart 1992 houdende gemeenschappelijke regels voor het internationaal vervoer
      van personen met touringcars en met autobussen (PbEG 1992 L74);

      p. verordening 1371/2007/EG: verordening nr. 1371/2007 van het Europees Parlement en de Raad van de Europese Unie
      van 23 oktober 2007 betreffende de rechten en verplichtingen van reizigers in het treinverkeer (PbEU L 315).


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
