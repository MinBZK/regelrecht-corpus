  - number: '69'
    text: |-
      1 Een vervoerder waarop de gemeente Amsterdam, Den Haag, Rotterdam of Utrecht op basis van feitelijke of juridische
      omstandigheden beslissende invloed uitoefent, verricht geen andere werkzaamheden dan:

      a. openbaar vervoer;

      b. vervoer waarop bij algemene maatregel van bestuur als bedoeld in [artikel 2, tweede lid][ref1], dit artikel van
      toepassing is verklaard; of,

      c. werkzaamheden die rechtstreeks samenhangen met het verrichten van het in onderdeel a en b bedoelde vervoer.

      2 Een gemeentelijk vervoerbedrijf als bedoeld in het eerste lid mag:

      a. vervoerders

      1°. waarop het op basis van feitelijke of juridische omstandigheden invloed kan uitoefenen, of,

      2°. waarop een rechtspersoon op basis van feitelijke of juridische omstandigheden invloed kan uitoefenen die tevens
      op basis van feitelijke of juridische omstandigheden invloed kan uitoefenen op dit gemeentelijk vervoerbedrijf,
      die openbaar vervoer, besloten busvervoer of taxivervoer verrichten dan wel werkzaamheden die daarmee rechtstreeks
      samenhangen, niet bevoordelen boven anderen waarmee die vervoerders in concurrentie treden of anderszins voordelen
      toekennen die verder gaan dan in het normale handelsverkeer gebruikelijk is;

      b. middelen die het aanwendt of verkrijgt voor het verrichten van metro- of tramvervoer, zo lang dit vervoer niet
      is aanbesteed, niet benutten voor het verrichten van busvervoer of de in de onderdelen b of c van het eerste lid
      bedoelde werkzaamheden voor zover het gemeentelijk vervoerbedrijf daarmee voordelen verkrijgt die verder gaan dan
      in het normale handelsverkeer gebruikelijk is.

      3 Als toekenning van voordelen die verder gaan dan in het normaal handelsverkeer gebruikelijk is als bedoeld in het
      tweede lid wordt in ieder geval aangemerkt:

      a. het leveren van goederen of diensten tegen een vergoeding die lager is dan de redelijkerwijs daaraan toe te
      rekenen kosten;

      b. het ter beschikking stellen van financiële middelen anders dan ten laste van het eigen vermogen dan wel ten
      laste van het eigen vermogen anders dan tegen een in het handelsverkeer gebruikelijke vergoeding;

      c. het verstrekken van gegevens over individuele gebruikers van openbaar vervoer, tenzij deze onder gelijke
      voorwaarden ook ter beschikking worden gesteld aan derden die met de betrokken onderneming in concurrentie treden;

      d. het toestaan van het gebruik van de naam en het beeldmerk van het openbaar vervoerbedrijf op een wijze waardoor
      verwarring bij het publiek is te duchten over de herkomst van goederen en diensten.

      4 Bij algemene maatregel van bestuur kunnen andere vormen van toekenning van voordelen dan die, bedoeld in het
      derde lid, worden aangemerkt als vormen die verder gaan dan in het normaal handelsverkeer gebruikelijk is.

      5 Een gemeentelijk vervoerbedrijf als bedoeld in het eerste lid:

      a. doet jaarlijks over het voorgaande boekjaar een verklaring van een onafhankelijke deskundige opmaken waaruit
      blijkt of de financiële verhouding tussen het vervoerbedrijf en de in het tweede lid, onderdeel a, bedoelde
      vervoerders, voldoet aan de in dat onderdeel gestelde eisen en of het voldoet aan het tweede lid, onderdeel
      b, gestelde eisen. Deze verklaring ligt voor een ieder ter inzage op alle kantoren van het gemeentelijk
      vervoerbedrijf;

      b. houdt voorzover aan hem zowel een concessie voor het verrichten van busvervoer als een concessie voor het
      verrichten van metro- of tramvervoer is verleend en zolang één van deze concessies nog niet is aanbesteed, een
      zodanige administratie bij dat:

      1°. de registratie van de lasten en baten van het busvervoer en het tram- of metrovervoer gescheiden zijn;

      2°. alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend;

      3°. de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.

      Een gemeentelijk vervoerbedrijf bewaart de in onderdeel b bedoelde gegevens gedurende vijf jaar, te rekenen vanaf
      het einde van het boekjaar waarop de gegevens betrekking hebben.

      6 Dit artikel is niet van toepassing ten aanzien van een gemeentelijk vervoerbedrijf als bedoeld in het eerste lid
      zodra het openbaar vervoer, bedoeld in [artikel 53, tweede lid, onderdeel a][ref2], voor ten minste een gedeelte
      dat naar omzet berekend ten minste twee derde beloopt, wordt verricht krachtens een concessie welke is verleend na
      een procedure van aanbesteding.

      7 Dit artikel is van overeenkomstige toepassing op:

      a. een vervoerder die in de in het eerste lid genoemde gemeenten op grond van een aan hem verleende concessie
      openbaar vervoer verricht zonder dat daartoe een aanbesteding is gehouden;

      b. een vervoerder waarop een gemeente voor 1 januari 2007 beslissende invloed heeft uitgeoefend en die openbaar
      vervoer verricht op grond van een concessie zonder dat daartoe een aanbesteding is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel53
