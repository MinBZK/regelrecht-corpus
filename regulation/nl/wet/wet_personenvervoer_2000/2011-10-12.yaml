    text: |-
      1 Een concessie kan geheel of gedeeltelijk worden ingetrokken, indien is gebleken dat de concessiehouder de
      concessie niet naar behoren uitvoert of heeft uitgevoerd.

      2 Een beschikking tot gehele of gedeeltelijke intrekking van een concessie treedt niet eerder in werking dan
      dertien weken na de datum van haar bekendmaking. Zij werkt niet terug.
