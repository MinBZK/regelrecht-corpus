  - number: '121'
    text: |-
      1 Indien een plusregio als bedoeld in [artikel 20][ref1] wordt opgeheven, zijn de colleges van burgemeester
      en wethouders van de gemeenten die de plusregio vormden, bevoegd tot het verlenen, wijzigen of intrekken van
      concessies voor openbaar vervoer ten behoeve van die gemeenten, voor zover zij daartoe door Onze Minister zijn
      aangewezen.

      2 Een aanwijzing als bedoeld in het eerste lid wordt gedaan indien Onze Minister dit doelmatig acht.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop Onze Minister toepassing geeft aan
      het eerste en tweede lid.

      4 Het eerste en tweede lid zijn niet van toepassing op de bevoegdheid tot het verlenen van concessies voor openbaar
      vervoer per trein.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel121
