  - number: '106'
    text: |-
      Onze Minister voert overleg over voorgenomen voorstellen van wet, ontwerpen van algemene maatregel van bestuur
      en ontwerpen van ministeriële regelingen op het terrein van het openbaar vervoer, het besloten busvervoer en het
      taxivervoer met ten minste vertegenwoordigers van:

      a. representatieve organisaties van werkgevers en werknemers in het openbaar vervoer, het besloten busvervoer en
      het taxivervoer;

      b. provincies, regionaal openbare lichamen en gemeenten;

      c. representatieve organisaties die de belangen van gebruikers van het openbaar vervoer, het besloten busvervoer en
      het taxivervoer behartigen.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel106
  - number: '107'
    text: |-
      De voordracht voor een eerste vaststelling van een algemene maatregel van bestuur op grond van deze wet wordt niet
      eerder gedaan dan vier weken nadat het ontwerp daarvoor aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel107
  - number: '108'
    text: |-
      1 Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken binnen vijf jaar na
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet, voorzover het betreft het openbaar vervoer en het besloten busvervoer, in de praktijk.

      2 Onverminderd het eerste lid zendt Onze Minister voor 1 december 2004 aan de Staten-Generaal een verslag over de
      effecten in de praktijk van aanbesteding van concessies als bedoeld in deze wet.

      3 Met het oog op de besluitvorming inzake de invoering van een plicht tot aanbesteding van concessies met
      ingang van 1 januari 2006 zendt Onze Minister voor 1 december 2004 aan de Staten-Generaal een verslag over de
      doeltreffendheid en effecten in de praktijk van aanbesteding van concessies.

      4 Onze Minister kan onderzoek doen naar de ontwikkeling van de concurrentieverhoudingen op de Nederlandse markt
      voor openbaar vervoer.

      5 De concessieverleners en de concessiehouders verstrekken ten behoeve van de verslagen, bedoeld in het eerste,
      tweede en derde lid, of het onderzoek, bedoeld in het vierde lid, desgevraagd de informatie die Onze Minister nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel108
  - number: '109'
    text: |-
      1 Tot het moment van inwerkingtreding van de [artikelen 15 tot en met 18][ref1] en [51 tot en met 60][ref2] wordt
      van deelname aan aanbesteding van een concessie voor openbaar vervoer per bus respectievelijk per metro of tram
      uitgesloten:

      a. een vervoerder als bedoeld in [artikel 69, eerste of zevende lid][ref3], alsmede een vervoerder waarvan een
      gemeentelijk vervoerbedrijf als bedoeld in [artikel 69, eerste lid][ref4], een of meer aandelen in het geplaatst
      kapitaal bezit, voor zolang het openbaar vervoer per bus respectievelijk per metro of tram, dat op de dag van
      inwerkingtreding van deze wet door het vervoerbedrijf werd verricht, niet of niet in voldoende mate is aanbesteed;

      b. een vervoerder die is gevestigd in een andere lidstaat van de Europese Unie of een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, voorzover de wederkerigheid van de toegang tot de
      desbetreffende markt voor personenvervoer voor vervoerders die in Nederland zijn gevestigd niet gewaarborgd is;

      c. een vervoerder die is gevestigd in een andere staat, niet zijnde een lidstaat van de Europese Unie of een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, voor zover dit voortvloeit
      uit een voor Nederland verbindend besluit van een volkenrechtelijke organisatie dan wel uit een door of vanwege de
      regering gemaakte internationale afspraak.

      2 Het openbaar vervoer, bedoeld in het eerste lid, onderdeel a, is in voldoende mate aanbesteed indien de omvang
      van dat aanbestede gedeelte tenminste tweederde van de omvang bedraagt van de concessie als bedoeld in de aanhef
      van het eerste lid.

      3 Met aanbesteding als bedoeld in het eerste lid, onderdeel a, en het tweede lid, wordt gelijkgesteld een
      kennisgeving tot de opdracht van aanbesteding van een concessie is gepubliceerd mits de in de kennisgeving vermelde
      ingangsdatum van de concessie is gelegen binnen een redelijke termijn na de datum van die kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel69
