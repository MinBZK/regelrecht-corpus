        artikel: 19a
        hoofdstuk: II
        paragraaf: '1'
  - number: '94'
    text: |-
      1 Ingeval van overtreding van [artikel 69, eerste, vijfde en zevende lid][ref1], kan de raad van bestuur
      van de mededingingsautoriteit de rechtspersoon aan wie het gemeentelijk vervoerbedrijf toebehoort dan wel de
      desbetreffende concessiehouder, een last onder dwangsom opleggen.

      2 Aan een last kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de raad van bestuur
      van de mededingingsautoriteit.

      3 Een last geldt voor een door de raad van bestuur van de mededingingsautoriteit te bepalen termijn van ten hoogste
      twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel94
    references:
