        paragraaf: '5'
  - number: 82a
    text: |-
      1 Bij of krachtens gemeentelijke verordening kunnen regels worden gesteld over:

      a. de herkenbaarheid van een auto waarmee taxivervoer op de gemeentelijke openbare weg wordt aangeboden;

      b. de eisen en verplichtingen te stellen aan bestuurders van een in onderdeel a bedoelde auto;

      c. de indiening en behandeling van klachten van consumenten over taxivervoer;

      d. de wijze waarop wordt aangetoond dat aan de ingevolge de onderdelen a tot en met c gestelde regels wordt
      voldaan;

      e. de vergoedingen die zijn verschuldigd voor de uitvoeringskosten die samenhangen met de krachtens deze
      paragraaf gestelde regels af te geven documenten en vergunningen en de uitvoeringskosten die samenhangen met de
      instandhouding van die documenten en vergunningen.

      2 De in het eerste lid bedoelde regels kunnen verschillen al naar gelang de locatie waar taxivervoer wordt
      verricht.

      3 De in het eerste lid bedoelde regels kunnen betrekking hebben op een verplichting voor de in dat lid bedoelde
      bestuurders om vanaf een of meer daartoe bij gemeentelijke verordening aangewezen locaties, consumenten op hun
      verzoek te vervoeren.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over het eerste lid.

      5 De in het vierde lid bedoelde regels kunnen in elk geval betrekking hebben op:

      a. de voorwaarden en beperkingen van de toepassing van de in het eerste lid bedoelde bevoegdheden;

      b. de aansluiting op bij of krachtens [artikel 79][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel79
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel82a
