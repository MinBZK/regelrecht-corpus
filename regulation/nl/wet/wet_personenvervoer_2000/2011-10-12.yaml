  - number: '7'
    text: |-
      1 Een vergunning vervalt van rechtswege:

      a. zes maanden na het overlijden of het intreden van wettelijke onbekwaamheid van degene aan wie de vergunning
      is verleend;

      b. zodra de rechtspersoon waaraan de vergunning is verleend, heeft opgehouden te bestaan;

      c. zodra de overeenkomst van de vennootschap zonder rechtspersoonlijkheid of de maatschap waaraan de vergunning is
      verleend, is ontbonden;

      d. zodra degene aan wie de vergunning is verleend, zijn activiteiten als vervoerder heeft beëindigd.

      2 Belanghebbenden kunnen binnen zes maanden na het overlijden of na het intreden van de wettelijke onbekwaamheid,
      bij Onze Minister een aanvraag indienen om de vergunning te stellen op naam van de erfgenaam of, indien er meer
      erfgenamen zijn, op naam van de gezamenlijke erven, dan wel op naam van één of meer door de belanghebbenden
      aangewezen vertegenwoordigers.

      3 Onze Minister beslist binnen drie maanden op de aanvraag, bedoeld in het tweede lid. Indien Onze Minister de
      aanvraag inwilligt, geschiedt dat voor een periode van ten hoogste één jaar na het verstrijken van de in het eerste
      lid, onderdeel a, bedoelde periode.

      4 De in het derde lid bedoelde periode van één jaar kan door Onze Minister eenmaal met ten hoogste een half jaar
      worden verlengd.

      5 Het eerste lid vindt geen toepassing zolang Onze Minister nog niet onherroepelijk op de in het tweede lid
      bedoelde aanvraag heeft beslist.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verlening, weigering,
      wijziging, schorsing of intrekking van een vergunning en de aan een vergunning verbonden voorschriften en
      beperkingen. Deze regels bevatten in ieder geval bepalingen over:

      a. de wijze waarop een aanvraag om verlening, wijziging of intrekking van een vergunning wordt ingediend;

      b. de termijn waarbinnen op een aanvraag wordt beslist;

      c. de afgifte, geldigheid en het gebruik van vergunningbewijzen voor bussen en auto's;

      d. de vergoeding die de aanvrager is verschuldigd voor de behandeling van een aanvraag als bedoeld in onderdeel a
      en voor de afgifte van vergunningbewijzen.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel8
  - number: '9'
    text: |-
      1 Een vergunning wordt, behoudens in bij algemene maatregel van bestuur aan te geven gevallen, slechts verleend aan
      een vervoerder die voldoet aan eisen van betrouwbaarheid, kredietwaardigheid en vakbekwaamheid.

      2 Onze Minister kan ontheffing verlenen van de in het eerste lid bedoelde eis van vakbekwaamheid.

      3 Een ontheffing als bedoeld in het tweede lid kan onder beperkingen worden verleend en aan een ontheffing kunnen
      voorschriften worden verbonden.

      4 Onze Minister kan een ontheffing, de beperkingen waaronder een ontheffing is verleend en de aan een ontheffing
      verbonden voorschriften ambtshalve of op aanvraag wijzigen of intrekken.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de eisen van betrouwbaarheid, kredietwaardigheid en vakbekwaamheid;

      b. de gevallen waarin Onze Minister ontheffing kan verlenen;

      c. de beperkingen waaronder een ontheffing kan worden verleend;

      d. de voorschriften die aan een ontheffing kunnen worden verbonden;

      e. de vergoeding die is verschuldigd voor de behandeling van de aanvraag om verlening van een ontheffing alsmede
      voor afgifte van verklaringen van Onze Minister betreffende het voldoen aan eisen van kredietwaardigheid of
      vakbekwaamheid.

      6 Voor zover dit noodzakelijk is om vast te stellen of wordt voldaan aan de eisen bedoeld in het eerste lid, kan
      Onze Minister gegevens omtrent gedrag en strafrechtelijke gegevens verwerken.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel9
  - number: '11'
    text: |-
      1 Het is de houder van een vergunning verboden te handelen in strijd met:

      a. een vergunning, de beperkingen waaronder een vergunning is verleend en de aan een vergunning verbonden
      voorschriften;

      b. de beperkingen waaronder een ontheffing is verleend en de aan een ontheffing verbonden voorschriften.

      2 Het is de houder van een vergunning verboden een vergunningbewijs al dan niet tegen betaling ter beschikking te
      stellen van een derde ten behoeve van het verrichten van vervoer, als bedoeld in [artikel 4][ref1].

      3 Het tweede lid is van overeenkomstige toepassing op degene aan wie door de houder van een vergunning een
      vergunningbewijs ter beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel11
