  - number: '62'
    text: |-
      1 Concessies als bedoeld in [artikel 20, derde lid][ref1], worden slechts verleend nadat daartoe een aanbesteding
      is gehouden.

      2 In bij of krachtens algemene maatregel van bestuur omschreven gevallen kan het eerste lid buiten toepassing
      worden gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
