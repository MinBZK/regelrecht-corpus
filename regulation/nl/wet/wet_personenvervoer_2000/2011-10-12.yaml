        hoofdstuk: V
        paragraaf: '3'
  - number: 82b
    text: |-
      1 Onverminderd [artikel 82a][ref1] kan bij of krachtens gemeentelijke verordening worden bepaald dat het gebruik
      van de bij die verordening te bepalen gemeentelijke openbare weg of delen daarvan, voor wat betreft het aldaar
      aanbieden van taxivervoer, uitsluitend is voorbehouden aan vervoerders en bestuurders van auto’s die taxivervoer
      verrichten die overeenkomstig de bij en krachtens dit artikel gestelde regels deel uitmaken van een organisatorisch
      verband.

      2 Het in het eerste lid bedoelde organisatorische verband heeft een verbetering van de kwaliteit van taxivervoer
      ten doel.

      3 Bij of krachtens een in het eerste lid bedoelde gemeentelijke verordening worden regels gesteld over de eisen
      aan en verplichtingen van het organisatorisch verband en de eisen aan en de verplichtingen van de vervoerders en
      de bestuurders van de in het eerste lid bedoelde auto’s die daar deel van uitmaken alsmede de regels die nodig zijn
      voor een goede uitvoering van de in het eerste lid bedoelde bevoegdheid.

      4 De in het eerste lid bedoelde gemeentelijke verordening stelt regels over het minimum aantal binnen de gemeente
      betrokken organisatorische verbanden.

      5 De in het derde lid bedoelde regels kunnen mede betrekking hebben op verlening van vergunningen aan de
      in dit artikel bedoelde organisatorische verbanden en degenen die daarvan deel uitmaken, alsmede op de
      intrekking, wijziging en schorsing van die vergunningen. De [artikelen 6, vierde en vijfde lid][ref2], en
      [99, eerste lid, onderdeel c, en tweede lid][ref3], zijn van overeenkomstige toepassing.

      6 De in het derde lid bedoelde eisen en verplichtingen hebben in elk geval betrekking op de volgende onderwerpen:

      a. het bestuur en de organisatie van het verband;

      b. de juridische verhouding tussen het bestuur van het verband en de vervoerders en bestuurders van auto’s die daar
      deel van uitmaken;

      c. het gedrag van bestuurders van auto’s die taxivervoer verrichten;

      d. de herkenbaarheid van de auto’s waarmee taxivervoer wordt verricht;

      e. de wijze waarop de in het tweede lid bedoelde doelstelling met inachtneming van in het derde lid bedoelde eisen
      en verplichtingen, door het verband wordt uitgewerkt in een reglement;

      f. de instelling van privaatrechtelijke controles betreffende de nakoming van de in het reglement vastgelegde
      verplichtingen, door een of meer onafhankelijke en deskundige instanties en het optreden van het verband naar
      aanleiding van tijdens die controles geconstateerde onregelmatigheden;

      g. de registratie en behandeling van klachten van consumenten;

      h. de rapportage over de uitkomsten van de in onderdeel f bedoelde controles en het in dat onderdeel bedoelde
      optreden van het verband alsmede van de afhandeling van de in onderdeel g bedoelde klachten;

      i. opvolging van in het zevende lid bedoelde aanwijzingen;

      j. de wijze van vastlegging van en verantwoording over de in de onderdelen a tot en met i bedoelde eisen en
      verplichtingen door het organisatorisch verband.

      7 Het college van burgemeester en wethouders van de desbetreffende gemeente kan op de in het eerste lid bedoelde
      delen van de gemeentelijke openbare weg aanwijzingen geven aan de in het eerste lid bedoelde bestuurders van
      auto’s, voor zover dat ter plaatse noodzakelijk is voor een goede uitvoering van de in het derde lid bedoelde eisen
      en verplichtingen.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld over het eerste en derde lid.

      9 De in het achtste lid bedoelde regels kunnen in elk geval betrekking hebben op:

      a. de voorwaarden en beperkingen van de toepassing van de in het eerste, derde en zevende lid, bedoelde
      bevoegdheden;

      b. de aansluiting op bij of krachtens [artikel 79][ref4] gestelde regels.

      10 Dit artikel is uitsluitend van toepassing op bij ministeriële regeling aangewezen gemeenten.


