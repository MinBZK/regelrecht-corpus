  - number: '70'
    text: |-
      1 Het is verboden zonder hiervoor geldig vervoerbewijs gebruik te maken van het openbaar vervoer, alsmede, voor
      zover de vervoerder zulks duidelijk kenbaar heeft gemaakt, van de daartoe behorende voorzieningen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing in de bij algemene maatregel van bestuur bepaalde
      gevallen.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel70
  - number: '71'
    text: |-
      Het is verboden een onbevoegd gewijzigd of anderszins bewerkt vervoerbewijs te gebruiken, een vervoerbewijs te
      misbruiken of de controle van vervoerbewijzen te belemmeren of te verhinderen.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel71
  - number: '72'
    text: |-
      Het is een ieder verboden zich in een auto, bus, trein, metro, tram of een via een geleidesysteem voortbewogen
      voertuig dan wel in of in de onmiddellijke nabijheid van een station, halteplaats, of een andere bij het openbaar
      vervoer behorende voorziening en de daarbij behorende perrons, trappen, tunnels en liften zodanig te gedragen dat
      orde, rust, veiligheid of een goede bedrijfsgang wordt of kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel72
  - number: '73'
    text: |-
      Een ieder is verplicht de aanwijzingen betreffende de orde, rust, veiligheid of een goede bedrijfsgang op te volgen
      die door of vanwege de vervoerder duidelijk kenbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel73
  - number: '74'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over:

      a. hetgeen onder verstoring van orde, rust, veiligheid of een goede bedrijfsgang wordt verstaan;

      b. de wijze waarop de in [artikel 73][ref1] bedoelde aanwijzingen onder meer kunnen worden gegeven.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld over onder meer:

      a. het gebruik van vervoerbewijzen;

      b. de verplichting tot betaling en het recht op terugbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel73
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel74
