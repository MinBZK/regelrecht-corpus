  - number: '83'
    text: |-
      1 Ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties dan wel om redenen van
      internationaal vervoerbeleid kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:

      a. openbaar vervoer, besloten busvervoer en taxivervoer dat de Nederlandse grens overschrijdt;

      b. openbaar vervoer, besloten busvervoer en taxivervoer dat door een in Nederland gevestigde vervoerder geheel
      buiten Nederland of door een buiten Nederland gevestigde vervoerder geheel in Nederland wordt verricht;

      c. het rijden met een lege bus of auto over voor het openbaar verkeer openstaande wegen in Nederland of het rijden
      met een lege bus of auto door een in Nederland gevestigde vervoerder geheel of ten dele buiten Nederland of door
      een buiten Nederland gevestigde vervoerder geheel of ten dele in Nederland, voor zover dat verband houdt met het
      verrichten van openbaar vervoer, besloten busvervoer of taxivervoer.

      2 De regels, bedoeld in het eerste lid, kunnen mede betrekking hebben op de vergoeding die de aanvrager is
      verschuldigd voor de behandeling van de aanvraag om verlening of wijziging van de voor dat vervoer benodigde
      documenten.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel83
  - number: '87'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:

      a. de bij besluit van Onze Minister aangewezen personen;

      b. de bij besluit van de bestuursorganen, bedoeld in [artikel 20, tweede en derde lid][ref1], aangewezen personen,
      voor zover het de door hen verleende concessies betreft, voor het bepaalde bij of krachtens de [artikelen 19][ref2]
      en [30 tot en met 40][ref3], en

      c. de bij besluit van het college van burgemeester en wethouders van de desbetreffende gemeenten
      aangewezen personen, voor zover het betreft het toezicht op naleving van het bepaalde bij of krachtens de
      [artikelen 82a][ref4] en [82b][ref5].

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn voorts belast de in
      [artikel 141 van het Wetboek van Strafvordering][ref6] bedoelde ambtenaren en de met betrekking tot deze wet
      krachtens [artikel 17, eerste lid, onder 2°, van de Wet op de economische delicten][ref7] aangewezen ambtenaren.

      3 Onverminderd het bepaalde in het eerste en tweede lid zijn met het toezicht op de naleving van het bij of
      krachtens de [artikelen 70 tot en met 74][ref8] bepaalde mede belast personen die daartoe door de vervoerder zijn
      aangewezen.

      4 Met het toezicht op de naleving van het bepaalde bij verordening 1371/2007/EG zijn de bij besluit van Onze
      Minister aangewezen personen belast.

      5 Met het toezicht op de naleving van het bepaalde in [artikel 69, eerste, vijfde en zevende lid][ref9],
      zijn belast de bij besluit van de raad van bestuur van de mededingingsautoriteit aangewezen ambtenaren van de
      Nederlandse Mededingingsautoriteit.

      6 Van een besluit als bedoeld in het eerste, vierde of vijfde lid, wordt mededeling gedaan in de Staatscourant.


