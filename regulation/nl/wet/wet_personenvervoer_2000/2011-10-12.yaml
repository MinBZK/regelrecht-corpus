    text: |-
      De reiziger die de leeftijd van veertien jaar nog niet heeft bereikt, is verplicht op de eerste vordering van
      de [artikelen 87][ref1] en [89][ref2] bedoelde ambtenaren en personen die hebben vastgesteld dat de reiziger
      heeft gehandeld in strijd met de [artikelen 70][ref3] of [71][ref4], een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref5] ter inzage aan te bieden.


