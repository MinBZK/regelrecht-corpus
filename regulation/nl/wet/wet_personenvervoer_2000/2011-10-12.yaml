        artikel: '69'
        hoofdstuk: III
        paragraaf: '6'
  - number: '95'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit deelt zijn voornemen een beschikking te geven als bedoeld in
      [artikel 94, eerste lid][ref1], schriftelijk en met redenen omkleed mee aan belanghebbenden.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref2] stelt de raad van bestuur van
      de mededingingsautoriteit, alvorens te besluiten omtrent toepassing van [artikel 94, eerste lid][ref3],
      belanghebbenden in de gelegenheid schriftelijk of mondeling hun zienswijze kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel94
