      1 Een besluit tot aanwijzing van een gemeente als bedoeld in artikel 39 van de Wet personenvervoer zoals dit luidde
      voor de inwerkingtreding van [artikel 127][ref1] behoudt zijn geldigheid tot het moment waarop Onze Minister het
      besluit intrekt.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop Onze Minister toepassing geeft aan de
      bevoegdheid tot intrekken van een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
