  - number: '63'
    text: |-
      1 Onze Minister kan de raad van bestuur van de mededingingsautoriteit verzoeken een rapportage uit te brengen
      inzake de effecten voor de mededinging op de Nederlandse markt voor openbaar vervoer of een deel daarvan, van een
      op een aanvraag als bedoeld in [artikel 61, tweede lid][ref1] te nemen besluit.

      2 De rapportage is niet eerder openbaar dan nadat Onze Minister een besluit over de aanvraag heeft genomen.

      3 De rapportage wordt meegezonden met de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel61
