      1 Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat voor de dag
      van inwerkingtreding van [artikel 127][ref1] is bekendgemaakt, blijft het recht zoals het gold voor die dag van
      toepassing.

      2 Ten aanzien van een bezwaar- of beroepschrift dat voor de dag van inwerkingtreding van [artikel 127][ref2] is
      ingediend en voor zover daarop bij de inwerkingtreding van deze wet nog niet is beslist, blijft het recht zoals het
      gold voor die dag van toepassing.

      3 Ten aanzien van een bezwaar- of beroepschrift dat op of na de dag van inwerkingtreding van deze wet is ingediend
      en dat is gericht tegen een besluit waartegen voor die dag eveneens bezwaar is gemaakt of beroep is ingesteld,
      blijft het recht zoals het gold voor de dag van inwerkingtreding van [artikel 127][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel127
