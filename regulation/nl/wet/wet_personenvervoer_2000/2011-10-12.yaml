  - number: '20'
    text: |-
      1 Bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer per trein is Onze Minister.

      2 Bevoegd tot het verlenen, wijzigen of intrekken van concessies voor openbaar vervoer, anders dan openbaar vervoer
      per trein, zijn gedeputeerde staten, met uitzondering van concessies voor openbaar vervoer in een plusregio als
      bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente of gemeenten Amsterdam,
      Arnhem en Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, 's-Gravenhage, Rotterdam of Utrecht omvat.
      De concessies in die plusregio’s worden verleend, gewijzigd of ingetrokken door het dagelijks bestuur van de
      desbetreffende plusregio.

      3 In afwijking van het eerste lid is het bestuur, bedoeld in het tweede lid, bevoegd tot het verlenen, wijzigen of
      intrekken van concessies voor regionaal openbaar vervoer per trein voor de bij algemene maatregel van bestuur dan
      wel in overeenstemming met het betrokken bestuur bij besluit van Onze Minister aangewezen vervoersdiensten die de
      daarbij aangeven stations verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: '21'
    text: |-
      Gedeputeerde staten dragen zorg voor de coördinatie en afstemming van het openbaar vervoer in de provincie, met
      uitzondering van de plusregio’s, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '22'
    text: |-
      De concessieverleners, bedoeld in [artikel 20][ref1], zijn bevoegd subsidies te verstrekken voor het in een
      concessie omschreven openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23'
    text: |-
      1 Geen concessie wordt verleend aan een vervoerder:

      a. van wie een geheel of gedeeltelijke eigenaar, dan wel een bestuurder of commissaris tevens het lidmaatschap
      bekleedt van een algemeen vertegenwoordigend orgaan van een openbaar lichaam waarvan een bestuursorgaan bevoegd is
      tot het verlenen van die concessie;

      b. voor wie een vertegenwoordiger of adviseur werkzaam is die betrokken is bij het meedingen naar of het verwerven
      van die concessie, en die tevens het lidmaatschap bekleedt van een algemeen vertegenwoordigend orgaan van een
      openbaar lichaam waarvan een bestuursorgaan bevoegd is tot het verlenen van die concessie.

      2 Het eerste lid, onderdeel b, is van overeenkomstige toepassing op de burgemeester en de commissaris van de
      Koning.

      3 Het eerste lid, onderdeel a, is niet van toepassing ten aanzien van een bestuurder of commissaris bij een
      vervoerder als bedoeld in [artikel 69, eerste of zevende lid][ref1] bij verlening van concessies waaraan geen
      procedure van aanbesteding vooraf is gegaan.

      4 Het eerste lid geldt niet ten aanzien van het verlenen van concessies voor openbaar vervoer per trein op grond
      van [artikel 20, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
        hoofdstuk: III
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '24'
    text: |-
      1 De concessieverlener verleent een concessie voor een in de concessie vastgestelde duur van ten hoogste acht jaar.

      2 Onze Minister kan op aanvraag van een concessieverlener ontheffing verlenen van de maximale duur van acht jaar,
      bedoeld in het eerste lid, indien:

      a. de concessie gepaard gaat met noodzakelijke en aanzienlijke investeringen door de concessiehouder in
      onlosmakelijk met de concessie samenhangende infrastructuur;

      b. een concessie voor openbaar vervoer per metro, tram of een via een geleidesysteem voortbewogen voertuig gepaard
      gaat met aanzienlijke investeringen door de concessiehouder in voor de uitvoering van de concessie noodzakelijk
      materieel;

      c. de concessie zowel openbaar vervoer per trein als ander openbaar vervoer omvat en ten aanzien van het openbaar
      vervoer per trein met inachtneming van het vierde tot en met zesde lid een langere concessieduur kan worden
      vastgesteld.

      3 Een ontheffing als bedoeld in het tweede lid kan onder beperkingen worden verleend en aan een ontheffing kunnen
      voorschriften worden verbonden.

      4 In afwijking van het eerste tot en met derde lid vervalt een concessie voor openbaar vervoer per trein op een
      in de concessie te bepalen tijdstip. Dit tijdstip wordt zodanig vastgesteld dat daarmee naar het oordeel van de
      concessieverlener evenwicht bestaat tussen de op het stimuleren van de kwaliteit van het openbaar vervoer gerichte
      duur van de concessie en de stabiliteit en continuïteit van het openbaar vervoer.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de duur van concessies voor
      openbaar vervoer per trein.

      6 Een concessie vervalt in elk geval vijftien jaar na de eerste dag waarop de concessiehouder ingevolge de
      concessie verplicht is openbaar vervoer te verrichten.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel24
  - number: '25'
    text: |-
      1 Een concessie bevat een omschrijving van het openbaar vervoer en van het gebied waarvoor de concessie is verleend
      alsmede de prijs die de concessiehouder betaalt voor de concessie.

      2 Een concessie kan tevens betrekking hebben op het verrichten van openbaar vervoer van en naar het gebied, bedoeld
      in het eerste lid, indien dit is overeengekomen met de concessieverleners die het betreft.

      3 In afwijking van het eerste lid bevat een concessie voor openbaar vervoer per trein, in plaats van een
      omschrijving van het gebied waarvoor de concessie is verleend, een omschrijving van de stations waartussen het
      openbaar vervoer wordt afgewikkeld.

      4 Bij de concessie en de daarbij behorende financiële afspraken wordt rekening gehouden met de voor de
      concessiehouder geldende gebruiksvergoeding, bedoeld in [artikel 62 van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel62
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '62'
  - number: '26'
    text: |-
      1 Voordat een concessie wordt verleend of gewijzigd, pleegt de concessieverlener, bedoeld in
      [artikel 20, tweede en derde lid][ref1], overleg met de concessieverleners die bevoegd zijn tot het verlenen van
      concessies in aangrenzende gebieden. Het overleg voorziet in ieder geval in afspraken inzake de afstemming van het
      openbaar vervoer tussen aangrenzende concessiegebieden.

      2 Het eerste lid is van overeenkomstige toepassing op een concessie als bedoeld in [artikel 25, tweede lid][ref2].

      3 Onze Minister kan, indien de in het eerste lid bedoelde afstemming onvoldoende gestalte krijgt, aan de betrokken
      concessieverleners een aanwijzing geven ter waarborging van die afstemming.

      4 Een aanwijzing als bedoeld in het derde lid wordt niet gegeven dan nadat overleg is gepleegd tussen Onze Minister
      en de betrokken concessieverleners.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel25
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27'
    text: |-
      1 Voordat een concessie wordt verleend of gewijzigd, vraagt de concessieverlener advies aan consumentenorganisaties
      die voldoen aan bij algemene maatregel van bestuur gestelde voorwaarden, over de aan de concessie te verbinden
      voorschriften.

      2 De concessieverlener stelt de consumentenorganisaties in de gelegenheid met hem overleg te voeren voordat advies
      wordt uitgebracht.

      3 Het advies, bedoeld in het tweede lid, wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke
      invloed kan zijn op het voornemen.

      4 De consumentenorganisaties worden door de concessieverlener zo spoedig mogelijk in kennis gesteld van de wijze
      waarop aan het uitgebrachte advies gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel27
  - number: 27a
    text: |-
      1 Voordat een concessie voor openbaar vervoer per trein over de hoofdspoorweginfrastructuur wordt verleend, vraagt
      Onze Minister advies aan de betrokken beheerder, bedoeld in [artikel 1 van de Spoorwegwet][ref1].

      2 [Artikel 27, tweede tot en met vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '28'
    text: |-
      De concessieverlener informeert ten minste eenmaal per jaar de consumentenorganisaties, bedoeld in
      [artikel 27][ref1], over de resultaten van bij algemene maatregel van bestuur te omschrijven maatregelen die door
      hem zijn genomen en die de belangen van de reiziger raken.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '29'
    text: |-
      1 De concessieverlener kan een ontheffing verlenen van het verbod, bedoeld in [artikel 19][ref1], aan een
      vervoerder die openbaar vervoer anders dan openbaar vervoer per trein, wil verrichten in een gebied waarvoor hem
      geen concessie is verleend.

      2 De concessieverlener kan de ontheffing wijzigen of intrekken.

      3 Een ontheffing wordt verleend voor een bepaalde tijd.

      4 Een ontheffing kan slechts worden geweigerd, indien naar het oordeel van de concessieverlener de
      vervoersvoorziening waarvoor een ontheffing is aangevraagd, een zodanige gelijkenis vertoont met openbaar vervoer
      waarvoor een concessie is verleend voor het gebied, bedoeld in het eerste lid, dat daarmee een onevenredige afbreuk
      wordt gedaan aan de exploitatie van die concessie.

      5 De concessieverlener kan de ontheffing onder beperkingen verlenen of aan de ontheffing voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 29a
    text: |-
      Een besluit tot verlening of wijziging van een concessie zonder dat daartoe een aanbesteding is gehouden, kan
      worden genomen indien de vervoerder niet binnen vier dagen na de dag waarop het voorgenomen besluit aan hem is
      bekendgemaakt aan de concessieverlener heeft doen blijken dat hij de concessie niet zonder voorbehoud aanvaardt.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel29a
  - number: '30'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over nationale vervoerbewijzen, de
      daaraan te stellen eisen, de daarbij behorende tarieven en vervoersvoorwaarden, alsmede het gebied waarbinnen deze
      geldig zijn.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de invoering, de acceptatie, de
      uitgifte, de exploitatie of het beheer van elektronische nationale vervoerbewijzen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de erkenning van een of
      meer instellingen die elektronische nationale vervoerbewijzen uitgeven, exploiteren of beheren, alsmede over de
      voorschriften waaraan dergelijke instellingen moeten voldoen.

      4 De houder van een concessie, verleend door een concessieverlener als bedoeld in [artikel 20, tweede lid][ref1],
      is verplicht reizigers te vervoeren die daartoe beschikken over een voor het concessiegebied geldig nationaal
      vervoerbewijs tegen het daarbij behorende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '31'
    text: |-
      1 De concessiehouder vraagt ten minste eenmaal per jaar advies aan consumentenorganisaties die voldoen aan bij
      algemene maatregel van bestuur gestelde voorwaarden, over de door de concessiehouder voorgenomen wijziging van een
      dienstregeling, het tarief en overige in de concessie geregelde onderwerpen.

      2 De concessiehouder stelt de consumentenorganisaties in de gelegenheid met hem overleg te voeren voordat advies
      wordt uitgebracht.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de aard van onderwerpen als bedoeld in het eerste
      lid.

      4 Het advies, bedoeld in het eerste lid, wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan
      zijn op de door de concessiehouder te nemen beslissing.

      5 Indien na het advies van de consumentenorganisaties een beslissing wordt genomen ten aanzien van de onderwerpen,
      bedoeld in het eerste lid, worden de consumentenorganisaties door de concessiehouder zo spoedig mogelijk, doch
      uiterlijk zes weken voor deze gevolg geeft aan de beslissing, schriftelijk hiervan in kennis gesteld. Indien het
      advies van de consumentenorganisaties niet of niet geheel is gevolgd, wordt aan de consumentenorganisaties tevens
      meegedeeld, waarom van dat advies is afgeweken en wordt hen de gelegenheid geboden nader te overleggen met de
      concessiehouder alvorens deze gevolg geeft aan de beslissing.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de termijnen die bij de
      adviesprocedure en de overlegprocedure, bedoeld in dit artikel, in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel31
  - number: '32'
    text: |-
      1 De concessieverlener kan aan een concessie voorschriften verbinden.

      2 Aan een concessie worden in ieder geval voorschriften verbonden ten aanzien van:

      a. de onderwerpen waarover en de consumentenorganisaties waaraan de concessiehouder advies vraagt als bedoeld in
      [artikel 31][ref1];

      b. de onderwerpen waarover en de wijze waarop de concessiehouder de consumentenorganisaties, bedoeld in onderdeel
      a, informeert;

      c. het verstrekken van informatie aan de concessieverlener ten behoeve van de controle op de uitvoering van de
      concessie;

      d. de tarieven, de modellen van vervoerbewijzen en de vervoersvoorwaarden waartegen het openbaar vervoer moet
      worden verricht, alsmede de wijziging en openbaarmaking daarvan;

      e. het opstellen van een financiële verantwoording van het uitvoeren van de concessie, welke verantwoording
      gescheiden is van die voor andere activiteiten;

      f. de wijziging, de openbaarmaking, de datum van ingang en de geldigheidsduur van de dienstregeling;

      g. de eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een handicap;

      h. het waarborgen van een verantwoorde mate van veiligheid ten behoeve van zowel de reizigers als het personeel
      binnen het openbaar vervoer;

      i. punctualiteit;

      j. een procentuele beschikbaarheidsgarantie van zitplaatsen;

      k. het zowel op stations als in de trein aan reizigers geboden serviceniveau.

      3 Bij algemene maatregel van bestuur worden regels gesteld over het minimale niveau van toegankelijkheid van het
      openbaar vervoer dat concessieverleners middels voorschriften dienen veilig te stellen bij concessieverlening. Deze
      regels bevatten in ieder geval eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met
      een handicap en eisen aan de toegankelijkheid van het openbaar vervoer ten behoeve van reizigers met een fiets.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de aan een concessie te verbinden
      voorschriften.

      5 Aan een concessie kan het voorschrift worden verbonden dat de concessiehouder, indien hij tekortschiet in het
      verrichten van bepaalde prestaties, gehouden is een geldsom te voldoen aan de concessieverlener.

      6 Indien toepassing is gegeven aan het vijfde lid is de concessieverlener niet bevoegd ten aanzien van het
      verrichten van de desbetreffende prestaties aan de concessiehouder een last onder dwangsom op te leggen.
      [Artikel 5:32, eerste lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel532
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '31'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
