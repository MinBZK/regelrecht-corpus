  - number: '45'
    text: |-
      Overleg als bedoeld in [artikel 26][ref1] over het verlenen van een concessie vindt in geval van aanbesteding
      plaats voordat een concessieverlener het programma van eisen vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel26
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
  - number: '46'
    text: |-
      1 Een concessiehouder verstrekt desgevraagd binnen een door de concessieverlener te bepalen termijn aan de
      concessieverlener gegevens voor zover deze noodzakelijk zijn voor de voorbereiding van aanbesteding van een
      concessie.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de gegevens die worden verstrekt en de wijze
      waarop controle op die gegevens wordt uitgeoefend.

      3 De gegevens kunnen openbaar worden gemaakt in het programma van eisen, voor zover het belang van
      openbaarmaking opweegt tegen het belang van het voorkomen van een onevenredige benadeling van de concessiehouder.
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is niet van toepassing.

      4 Dit artikel is van overeenkomstige toepassing op een vervoerder die openbaar vervoer verricht zonder daartoe
      verleende concessie, indien de gegevens noodzakelijk zijn voor de voorbereiding van aanbesteding van een concessie
      voor dat openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '47'
    text: |-
      Het tijdvak waarvoor een concessie is verleend kan eenmaal door de concessieverlener voor een periode van ten
      hoogste twaalf maanden worden verlengd, indien aanbesteding van een concessie voor een aansluitend tijdvak niet
      heeft geleid tot een concessieverlening.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel47
  - number: '48'
    text: |-
      Van deelname aan een aanbesteding van een concessie is uitgesloten een instelling, dienst of bedrijf, waarover het
      openbaar lichaam waarvan een bestuursorgaan als bedoeld in [artikel 20, tweede en derde lid][ref1], bevoegd is tot
      verlening van de concessie, op grond van feitelijke of juridische omstandigheden een beslissende invloed uit kan
      oefenen op de activiteiten van die vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
  - number: '49'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop aanbesteding van
      concessies plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel49
  - number: '50'
    text: De concessieverlener stelt een aanbestedingsreglement vast voor de procedure van aanbesteding van concessies.
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel50
  - number: '54'
    text: |-
      Onverminderd [artikel 53][ref1] wordt een verklaring van geen bezwaar geweigerd aan:

      a. een vervoerder die gevestigd is in een andere lidstaat van de Europese Unie of een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, voor zover de wederkerigheid van de toegang tot de
      desbetreffende markt voor personenvervoer voor vervoerders die in Nederland zijn gevestigd niet gewaarborgd is;

      b. een vervoerder die gevestigd is in een andere staat, niet zijnde een lidstaat van de Europese Unie of een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, voor zover dit voortvloeit
      uit een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke
      organisatie dan wel uit een door of vanwege de regering gemaakte internationale afspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '53'
        hoofdstuk: III
        paragraaf: '2'
  - number: '56'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit geeft op aanvraag een verklaring van geen bezwaar af, indien de
      aanvrager voldoet aan de in [artikel 53][ref1] gestelde eisen en er geen omstandigheden aanwezig zijn als bedoeld
      in [artikel 54][ref2].

      2 Een aanvraag om een verklaring van geen bezwaar kan niet eerder worden ingediend dan nadat de kennisgeving van de
      aanbesteding van de desbetreffende concessie is gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel54
    url: https://wetten.overheid.nl/BWBR0011470/2011-10-12#Artikel56
