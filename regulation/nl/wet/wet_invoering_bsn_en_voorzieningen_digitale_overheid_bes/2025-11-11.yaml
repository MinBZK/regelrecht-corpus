preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om het burgerservicenummer en de voorzieningen van de
    digitale overheid in de openbare lichamen in te voeren, teneinde burgers en bedrijven beter van dienst te zijn;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051725/2025-11-11#ArtikelAanhef
articles:
  - number: VI
    text: |-
      Deze wet treedt in werking op een bij Koninklijk Besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0051725/2025-11-11#ArtikelVI
  - number: VII
    text: 'Deze wet wordt aangehaald als: Wet invoering BSN en voorzieningen digitale overheid BES.'
    url: https://wetten.overheid.nl/BWBR0051725/2025-11-11#ArtikelVII
