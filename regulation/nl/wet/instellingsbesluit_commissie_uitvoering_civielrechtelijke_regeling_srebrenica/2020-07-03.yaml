$id: instellingsbesluit_commissie_uitvoering_civielrechtelijke_regeling_srebrenica
regulatory_layer: WET
publication_date: '2020-07-02'
valid_from: '2020-07-03'
bwb_id: BWBR0043776
url: https://wetten.overheid.nl/BWBR0043776/2020-07-03
preamble:
  text: |-
    Gelet op artikel 2, eerste lid, van de Wet vergoedingen adviescolleges en commissies;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel1
  - number: '1.1'
    text: '*ministers:* de Minister van Defensie en de Minister van Buitenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel1
  - number: '1.2'
    text: |-
      *commissie:* de Commissie Uitvoering civielrechtelijke regeling Srebrenica, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043776#Artikel2
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0043776
        artikel: '2'
  - number: '2.1'
    text: |-
      Ingesteld wordt de Commissie Uitvoering civielrechtelijke regeling Srebrenica. Deze commissie heeft tot doel om op
      een onafhankelijke wijze uitvoering te geven aan een tot stand te brengen regeling ter uitvoering van het arrest
      van de Hoge Raad der Nederlanden van 19 juli 2019 inzake Staat/Stichting Mothers of Srebrenica.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: '2.2'
    text: |-
      De commissie heeft tot taak het gehele ontvangst, beoordelings- en besluitvormingsproces van de uitvoering van de
      regeling ter hand te nemen. Hieronder vallen de volgende taken:
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: 2.2.a
    text: het ontvangen en registreren van de ingediende verzoeken;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: 2.2.b
    text: het uitvoeren van beoordelingen van de ingediende verzoeken en het daartoe benodigde onderzoek verrichten;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: 2.2.c
    text: |-
      het nemen van gemotiveerde beslissingen per verzoek die de grondslag vormen voor een vaststellingsovereenkomst,
      het sluiten van een vaststellingsovereenkomst dan wel het afwijzen van een verzoek met een gemotiveerde
      afwijzingsbrief;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: 2.2.d
    text: het voeren van een toegankelijke en empathische communicatie ten opzichte van de doelgroep;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: 2.2.e
    text: het laten uitbetalen van de vergoeding aan de betreffende verzoeker.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: '2.3'
    text: |-
      De ministers verlenen volmacht en machtiging aan de commissie voor het uitvoeren van de in het tweede lid genoemde
      taken.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel2
  - number: '3.1'
    text: De commissie bestaat uit drie leden waaronder een voorzitter.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel3
  - number: '3.2'
    text: De leden hebben zitting op persoonlijke titel en oefenen hun functie onafhankelijk en onpartijdig uit.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel3
  - number: '3.3'
    text: |-
      De leden kunnen (op eigen verzoek of wegens ongeschiktheid, onbekwaamheid of op andere zwaarwegende gronden) worden
      geschorst en ontslagen door de ministers.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel3
  - number: '3.4'
    text: 'Tot lid van de commissie worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel3
  - number: 3.4.a
    text: Mw. Mr. S.F.M. Wortmann (te Den Haag), tevens voorzitter;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel3
  - number: 3.4.b
    text: Mr. A. Hammerstein (te Arnhem);
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel3
  - number: 3.4.c
    text: Mr. E. Kronenburg (te Langbroek).
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel3
  - number: '4.1'
    text: |-
      Vanuit het Ministerie van Defensie functioneert de Directeur-generaal Beleid als liaison voor de Commissie. Vanuit
      het Ministerie van Buitenlandse Zaken heeft de Directeur-generaal Politieke Zaken deze rol.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel4
  - number: '4.2'
    text: Het Ministerie van Defensie is verantwoordelijk voor de uitbetaling van toegekende verzoeken.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel4
  - number: '5'
    text: |-
      De commissie wordt ingesteld voor de duur van twee jaar en zes maanden. Indien naar het oordeel van de commissie de
      werkzaamheden daartoe aanleiding geven, verlengen de ministers tijdig de instellingsduur met een daarbij te bepalen
      duur.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel5
  - number: '6.1'
    text: De commissie wordt ondersteund door een secretariaat.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel6
  - number: '6.2'
    text: |-
      Het secretariaat is onafhankelijk en is voor de uitvoering van zijn taak uitsluitend verantwoording verschuldigd
      aan de voorzitter van de commissie.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel6
  - number: '7.1'
    text: De commissie stelt haar eigen werkwijze vast en stelt een uitvoeringsprotocol vast.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel7
  - number: '7.2'
    text: De commissie draagt zorg voor naleving van de AVG.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel7
  - number: '7.3'
    text: De commissie kan zich door andere personen doen bijstaan voor zover dat voor de vervulling van haar taak nodig is.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel7
  - number: '8.1'
    text: |-
      De commissie is bevoegd zich voor het inwinnen van inlichtingen rechtstreeks te wenden tot personen en
      instellingen met het verzoek die medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van de in
      [artikel 2 tweede lid][ref1] genoemde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0043776#Artikel2
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0043776
        artikel: '2'
  - number: '8.2'
    text: |-
      De ministers verlenen de commissie de verlangde medewerking en toegang tot alle informatie die zij nodig heeft voor
      de vervulling van de in [artikel 2 tweede lid][ref1] genoemde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0043776#Artikel2
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0043776
        artikel: '2'
  - number: '9.1'
    text: |-
      Aan de voorzitter wordt een vaste vergoeding per maand toegekend, waarbij de salarisschaal wordt vastgesteld
      op schaal 18, trede 10 van bijlage I-B van de Arbeidsvoorwaardenovereenkomst sector Rijk 2018–2020 en de
      arbeidsduurfactor op 6/36.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel9
  - number: '9.2'
    text: |-
      Aan de andere leden wordt een vaste vergoeding per maand toegekend, waarbij de salarisschaal wordt vastgesteld
      op schaal 18, trede 10 van bijlage I-B van de Arbeidsvoorwaardenovereenkomst sector Rijk 2018–2020 en de
      arbeidsduurfactor op 4/36.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel9
  - number: '9.3'
    text: |-
      Na het verstrijken van de geldigheidsduur van de Arbeidsvoorwaardenovereenkomst sector Rijk 2018–2020 wordt de in
      dit artikel bedoelde vergoeding voortgezet alsof de geldigheidsduur niet verstreken is, met dien verstande dat bij
      het tot stand komen van een nieuwe Arbeidsvoorwaardenovereenkomst sector Rijk gedurende de werkingssfeer van dit
      besluit de in dit artikel bedoelde vergoeding overeenkomstig wordt aangepast
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel9
  - number: '10.1'
    text: |-
      De kosten van de commissie komen, op basis van een begroting, voor rekening van de ministers. Onder kosten worden
      in ieder geval verstaan:
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel10
  - number: 10.1.a
    text: de kosten voor huisvesting, de faciliteiten van vergaderingen en voor secretariële ondersteuning;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel10
  - number: 10.1.b
    text: |-
      de kosten voor het inschakelen van externe deskundigheid. Dit kan onder andere de volgende taken bevatten:
      ondersteuning voor het beoordelen, het laten verrichten van onderzoek, vertaaldiensten en archivering;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel10
  - number: 10.1.c
    text: |-
      de reiskosten voor binnenlandse reizen die worden vergoed op grond van/op basis van voor werknemers in de sector
      Rijk geldende vergoedingsregelingen. Er wordt in beginsel per openbaar vervoer gereisd, waarbij treinreizen
      (1e klas) kunnen worden gedeclareerd op basis van de betreffende bewijsvoering. Wanneer dit niet mogelijk is of
      wanneer het doelmatiger is om met eigen vervoer te reizen, bestaat aanspraak op een vergoeding van € 0,37 per
      autokilometer;
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel10
  - number: 10.1.d
    text: |-
      de internationale reis- en verblijfkosten indien dit voor het onderzoek noodzakelijk is, conform de voor werknemers
      in de sector Rijk geldende vergoedingsregelingen.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel10
  - number: '10.2'
    text: |-
      De commissie biedt zo spoedig mogelijk na haar instelling een begroting aan de ministers aan. Deze bevat de kosten
      van de commissie. Bij de beëindiging van haar werkzaamheden legt de commissie over de financiën verantwoording af.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel10
  - number: '11'
    text: De commissie verricht haar werkzaamheden op een locatie in Nederland buiten de kantoren van de beide ministeries.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel11
  - number: '12.1'
    text: |-
      Bij de beëindiging van haar werkzaamheden maakt de commissie een eindverslag, inclusief financiële rapportage van
      de gemaakte kosten door de commissie.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel12
  - number: '12.2'
    text: De commissie verstrekt aan de ministers desgevraagd tussentijds de door hen gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel12
  - number: '13'
    text: |-
      Het archief van de commissie wordt na afloop van de werkzaamheden van de commissie overgedragen aan de Minister
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant, waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Commissie Uitvoering civielrechtelijke regeling Srebrenica.'
    url: https://wetten.overheid.nl/BWBR0043776/2020-07-03#Artikel15
