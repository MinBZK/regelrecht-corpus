$id: wet_op_de_inlichtingen_en_veiligheidsdiensten
regulatory_layer: WET
publication_date: '2002-11-19'
valid_from: '2001-09-01'
bwb_id: BWBR0004244
url: https://wetten.overheid.nl/BWBR0004244/2001-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regels te stellen betreffende de
    diensten die belast zijn met het verzamelen van gegevens en het bevorderen van maatregelen in het belang van de
    staatsveiligheid en andere gewichtige belangen van de Staat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      *dienst:* een inlichtingen- of veiligheidsdienst;

      *inlichtingen- en veiligheidsdiensten:* de Binnenlandse Veiligheidsdienst; de Militaire Inlichtingendienst;

      *de coördinator:* de coördinator van de inlichtingen- en veiligheidsdiensten;

      *Onze betrokken Minister:*

      ten aanzien van de Binnenlandse Veiligheidsdienst:

      Onze Minister van Binnenlandse Zaken;

      ten aanzien van de Militaire Inlichtingendienst:

      Onze Minister van Defensie;

      ten aanzien van de coördinator:

      Onze Minister-President, Minister van Algemene Zaken.

      2 In deze wet wordt mede verstaan onder:

      *ambtenaar:* arbeidscontractant naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel1
  - number: '2'
    text: |-
      De coördinator en de diensten verrichten hun taak in gebondenheid aan de wet en in ondergeschiktheid aan Onze
      betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel2
  - number: '3'
    text: |-
      Onze betrokken Ministers plegen regelmatig overleg over hun beleid betreffende de diensten en de coördinatie van
      dat beleid.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel3
  - number: '4'
    text: |-
      Er is een coördinator van de inlichtingen- en veiligheidsdiensten die tot taak heeft overeenkomstig de aanwijzingen
      van Onze Minister-President, Minister van Algemene Zaken, in overeenstemming met Onze overige betrokken Ministers:

      a. het in artikel 3 bedoelde overleg voor te bereiden;

      b. de uitvoering van de taken van de diensten te coördineren;

      c. Onze betrokken Ministers voorstellen te doen betreffende de uitvoering van de taken van de diensten.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel4
  - number: '5'
    text: |-
      De coördinator wordt op gemeenschappelijke voordracht van Onze betrokken Ministers bij koninklijk besluit
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel5
  - number: '6'
    text: |-
      De hoofden van de diensten verlenen de coördinator medewerking voor de uitoefening van zijn taak. Zij zijn gehouden
      hem daartoe alle nodige gegevens te verschaffen.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel6
  - number: '7'
    text: De coördinator stelt Onze betrokken Ministers bij voortduring in kennis van al hetgeen van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel7
  - number: '8'
    text: |-
      1 Er is een Binnenlandse Veiligheidsdienst.

      2 Deze heeft tot taak:

      a. het verzamelen van gegevens omtrent organisaties en personen welke door de doelen die zij nastreven, dan wel
      door hun activiteiten aanleiding geven tot het ernstige vermoeden dat zij een gevaar vormen voor het voortbestaan
      van de democratische rechtsorde, dan wel voor de veiligheid of voor andere gewichtige belangen van de Staat;

      b. het verrichten van veiligheidsonderzoeken als bedoeld in de [Wet veiligheidsonderzoeken][ref1];

      c. het bevorderen van maatregelen ter beveiliging van gegevens waarvan de geheimhouding door het belang van de
      Staat wordt geboden en van die onderdelen van de overheidsdienst en van het bedrijfsleven, welke naar het oordeel
      van Onze terzake verantwoordelijke Ministers van vitaal belang zijn voor de instandhouding van het maatschappelijk
      leven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '9'
    text: |-
      1 Er is een Militaire Inlichtingendienst.

      2 Deze heeft tot taak:

      a. het verzamelen van gegevens omtrent het potentieel en de strijdkrachten van andere mogendheden, welke nodig zijn
      voor een juiste opbouw en een doeltreffend gebruik van de krijgsmacht;

      b. het verrichten van veiligheidsonderzoeken als bedoeld in de [Wet veiligheidsonderzoeken][ref1];

      c. het verzamelen van gegevens welke nodig zijn voor het treffen van maatregelen:

      1°. ter voorkoming van activiteiten die ten doel hebben de veiligheid of paraatheid van de krijgsmacht te schaden;

      2°. ter beveiliging van gegevens betreffende de krijgsmacht waarvan de geheimhouding is geboden;

      3°. ter bevordering van een juist verloop van mobilisatie en concentratie der strijdkrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '11'
    text: |-
      1 Het hoofd van een dienst stelt Onze betrokken Minister bij voortduring in kennis van al hetgeen van belang kan
      zijn.

      2 Door de zorg van Onze betrokken Minister worden daarvoor in aanmerking komende gegevens onverwijld doorgegeven
      aan Onze Ministers wie deze aangaan.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel11
  - number: '12'
    text: |-
      Het hoofd van een dienst kan door Onze betrokken Minister voor zover nodig in overeenstemming met Onze Minister
      wie het aangaat, worden gemachtigd deze Minister en andere overheidsorganen en -diensten gegevens rechtstreeks ter
      kennis te brengen.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel12
  - number: '13'
    text: |-
      1 De diensten verlenen elkaar, mede door het verschaffen van gegevens, zoveel mogelijk medewerking.

      2 De hoofden van de diensten dragen zorg voor het onderhouden van verbindingen met daarvoor in aanmerking komende
      veiligheids- en inlichtingendiensten van andere mogendheden.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel13
  - number: '14'
    text: |-
      De coördinator en de hoofden van de diensten dragen zorg voor:

      a. de geheimhouding van daarvoor in aanmerking komende gegevens en van de bronnen waaruit die afkomstig zijn;

      b. de veiligheid van personen met wier medewerking die gegevens worden verzameld.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel14
  - number: '15'
    text: |-
      De coördinator en de hoofden van de diensten zijn bevoegd zich voor het verkrijgen van gegevens te wenden tot
      andere overheidsorganen, overheidsdiensten of ambtenaren, en voorts tot een ieder die geacht wordt deze gegevens te
      kunnen verstrekken. Het hoofd van de Militaire Inlichtingendienst handelt hierbij, voorzover het de uitvoering van
      de in artikel 9, tweede lid, onder *b* en *c*, genoemde taken betreft, in nauw en voortdurend overleg met het hoofd
      van de Binnenlandse Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel15
  - number: '16'
    text: |-
      1 Door een dienst worden slechts persoonsgegevens verzameld, geregistreerd en aan derden verstrekt, voor zover dat
      noodzakelijk is voor de uitvoering van zijn in deze wet omschreven taak.

      2 Met betrekking tot de verstrekking van persoonsgegevens aan derden gedraagt het hoofd van de dienst zich naar
      de aanwijzingen van Onze betrokken Minister. Verstrekking van persoonsgegevens aan anderen dan overheidsorganen
      geschiedt niet dan na machtiging daartoe van Onze betrokken Minister in de in die machtiging omschreven gevallen of
      soorten van gevallen.

      3 Onze betrokken Minister stelt in overeenstemming met Onze Minister van Justitie regels vast omtrent het beheer
      van de verzamelingen van persoonsgegevens die door de betrokken dienst worden gehouden.

      4 De in het vorige lid bedoelde regels houden tenminste voorschriften in betreffende:

      a. de doeleinden van de verzamelingen;

      b. de geheimhouding van de daarin vastgelegde gegevens;

      c. de controle op de juistheid van die gegevens;

      d. de termijnen gedurende welke gegevens vastgelegd mogen blijven;

      e. de overige gronden tot verwijdering van gegevens uit de verzamelingen;

      f. de vernietiging van verwijderde gegevens.

      5 De voorgaande leden zijn van overeenkomstige toepassing op de verzamelingen van persoonsgegevens die door de
      in artikel 18 bedoelde ambtenaren worden gehouden in het kader van werkzaamheden ten behoeve van de Binnenlandse
      Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel16
  - number: '17'
    text: |-
      1 De coördinator en de hoofden van de diensten zijn bevoegd zich voor het verkrijgen van persoonsgegevens te wenden
      tot de verantwoordelijke voor een gegevensverwerking:

      a. ten behoeve van een veiligheidsonderzoek ter zake van de vervulling van een vertrouwensfunctie;

      b. in bij machtiging van Onze betrokken Minister en Onze Minister van Justitie gezamenlijk omschreven gevallen of
      soorten van gevallen.

      2 Een machtiging, als bedoeld in het eerste lid, houdt de termijn in, waarvoor zij geldt. Deze termijn beloopt ten
      hoogste een jaar, gerekend vanaf het tijdstip, waarop de machtiging wordt verleend.

      3 De bij of krachtens de wet geldende voorschriften voor de verantwoordelijke voor een gegevensverwerking
      betreffende de verstrekking van zodanige gegevens zijn niet van toepassing op verstrekkingen gedaan ingevolge een
      in het eerste lid bedoeld verzoek.

      4 Dit artikel is niet van toepassing op justitiële gegevens die krachtens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1] (*Stb.* 1955, 395) zijn
      geregistreerd of ten aanzien waarvan ingevolge artikel 36 van die wet een geheimhoudingsplicht geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: '18'
    text: |-
      1 De korpschef van een politiekorps en de commandant van de Koninklijke marechaussee en bij algemene maatregel
      van bestuur aan te wijzen ambtenaren, belast met de grensbewaking, verrichten werkzaamheden ten behoeve van de
      Binnenlandse Veiligheidsdienst.

      2 Onze Ministers, onder wie de bij of krachtens het eerste lid aangewezen ambtenaren ressorteren, onderscheidenlijk
      de korpsbeheerders van een regionaal politiekorps wijzen in overeenstemming met Onze Minister van Binnenlandse
      Zaken ondergeschikten van deze ambtenaren aan tot de feitelijke uitvoering van de aldaar bedoelde werkzaamheden.

      3 De in dit artikel bedoelde werkzaamheden worden verricht onder verantwoordelijkheid van Onze Minister van
      Binnenlandse Zaken en overeenkomstig de aanwijzingen van het hoofd van de Binnenlandse Veiligheidsdienst.

      4 Met betrekking tot het optreden van ambtenaren van politie ter uitvoering van de in dit artikel bedoelde
      werkzaamheden blijft [hoofdstuk X van de Politiewet 1993][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#HoofdstukX
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006299
        hoofdstuk: X
  - number: '19'
    text: |-
      Omtrent de organisatie, de werkwijze en het beheer van een dienst kunnen nadere regels worden gesteld door Onze
      betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel19
  - number: '20'
    text: |-
      1 De ambtenaren van de diensten bezitten geen bevoegdheid tot het opsporen van strafbare feiten.

      2 De in artikel 18 bedoelde ambtenaren oefenen bij het verrichten van de daar bedoelde werkzaamheden geen
      bevoegdheden tot het opsporen van strafbare feiten uit.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel20
  - number: '21'
    text: |-
      1 Het is de ambtenaar van een dienst verboden, anders dan in de uitoefening van zijn functie, te reizen naar dan
      wel te verblijven in:

      a. een land waar feitelijk een gewapend conflict bestaat;

      b. bij koninklijk besluit aangewezen landen, waarin het verblijf door een ambtenaar van een dienst een bijzonder
      risico voor de veiligheid of andere gewichtige belangen van de Staat kan opleveren.

      2 Onze betrokken Minister kan ontheffing van het in het eerste lid bedoelde verbod verlenen, indien dringende
      persoonlijke belangen van de betrokken ambtenaar dat vereisen en de veiligheid of andere gewichtige belangen van de
      Staat zich daartegen niet verzetten.

      3 Dit artikel is van overeenkomstige toepassing ten aanzien van de coördinator, de aan hem ondergeschikte
      ambtenaren en de in artikel 18, tweede lid, bedoelde ambtenaren van politie en van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel21
  - number: '22'
    text: |-
      1 De leden van het openbaar ministerie doen, door tussenkomst van het College van procureurs-generaal, mededeling
      van de te hunner kennis gekomen gegevens, die zij voor een dienst van belang achten, aan die dienst.

      2 De ambtenaren van politie, van de grensbewaking en van de Koninklijke marechaussee doen mededeling van de te
      hunner kennis gekomen gegevens, die zij voor een dienst van belang achten, aan hun korpschef, onderscheidenlijk
      aan de in artikel 18, eerste lid, bedoelde ambtenaar. Deze zendt de gegevens, indien hij dat van belang acht, aan
      die dienst.

      3 Steeds wanneer de vervulling van de taak van het openbaar ministerie en van een dienst daartoe aanleiding geeft,
      plegen een lid van het College van procureurs-generaal en het hoofd van de betrokken dienst overleg.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel22
  - number: '23'
    text: |-
      1 Onverminderd het bepaalde bij de artikelen 98-98*c* van het [Wetboek van Strafrecht][ref1], is een ieder
      die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan hij het
      vertrouwelijke karakter kent of redelijkerwijs moet vermoeden verplicht tot geheimhouding daarvan behoudens voor
      zover enig wettelijk voorschrift hem tot bekendmaking verplicht. Deze verplichting duurt voort, nadat het betrokken
      zijn bij de uitvoering van deze wet is geëindigd.

      2 [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref2] is niet van toepassing in geval van handelen of
      nalaten in strijd met de in het eerste lid omschreven verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '272'
  - number: '24'
    text: |-
      1 De verplichting tot geheimhouding van een ambtenaar, die betrokken is bij de uitvoering van deze wet, geldt niet
      tegenover hem aan wie de ambtenaar middellijk of onmiddellijk ondergeschikt is, noch in zover hij door een boven
      hem gestelde van die verplichting is ontslagen.

      2 De ambtenaar, bedoeld in het eerste lid, die krachtens een wettelijke bepaling verplicht wordt als getuige of
      deskundige op te treden, legt slechts een verklaring af omtrent datgene waartoe zijn verplichting tot geheimhouding
      zich uitstrekt, voorzover Onze betrokken Minister en Onze Minister van Justitie gezamenlijk hem daartoe
      schriftelijk van die verplichting hebben ontheven. Daarbij wordt voor ambtenaren die in hun functie kennis hebben
      gekregen van gegevens welke krachtens de artikelen 11 en 12 door een dienst zijn verstrekt als: "Onze betrokken
      Minister" aangemerkt: Onze Minister onder wie de dienst ressorteert, die de gegevens heeft verstrekt.

      3 Dit artikel is van overeenkomstige toepassing in het geval, dat het betrokken zijn bij de uitvoering van deze wet
      is geëindigd.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel24
  - number: '25'
    text: |-
      Het koninklijk besluit van 5 augustus 1972, houdende regeling van de taak, de organisatie, de werkwijze en de
      samenwerking van de inlichtingen- en veiligheidsdiensten (*Stb.* 1972, 437) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel25
  - number: '26'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 Zij kan worden aangehaald als: Wet op de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0004244/2001-09-01#Artikel26
