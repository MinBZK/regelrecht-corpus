  - number: '8'
    text: |-
      Voor het op of in de bodem gebruiken van metselmortel in de burger- en utiliteitsbouw voor het metselen met
      vormgegeven bouwstoffen, wordt vrijstelling verleend van [artikel 9 van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
  - number: '9'
    text: |-
      1 Voor de volgende situaties wordt vrijstelling verleend van [artikel 9 van het Besluit][ref1]:

      a) het zonder bewerking en onder dezelfde condities opnieuw op of in de bodem gebruiken van vormgegeven bouwstoffen
      van beton, keramiek, natuursteen en bakstenen;

      b) het opnieuw warm in situ op of in de bodem gebruiken van asfalt of asfaltbeton in wegverhardingen, indien
      conform het CROW-rapport 04-08 voorpublicatie 210 ‘Richtlijn omgaan met vrijkomend asfalt’’ wordt aangetoond dat
      het materiaal niet teerhoudend is.

      2 Voor het binnen een project op of in de bodem zonder bewerking en onder dezelfde condities opnieuw gebruiken
      van grond die behoort tot de categorie 1-bouwstoffen wordt vrijstelling verleend van [artikel 9][ref2] en
      [artikel 11, zevende lid][ref3], juncto [bijlage 3, onder 4, van het Besluit][ref4], mits wordt aangetoond dat de
      bouwstof voldoet aan de samenstellings- en immissiewaarden, zoals aangegeven in [bijlage 2, van het Besluit][ref5]:

      a) op grond van algemene informatie; of

      b) aan de hand van gegevens omtrent samenstelling en immissie die zijn bepaald in het kader van het eerdere
      gebruiken in een werk onder de vigeur van het [Besluit][ref6] of het IPO-interimbeleid ‘Werken met secundaire
      grondstoffen’.

      3 Voor het binnen een project op of in de bodem zonder bewerking en onder dezelfde condities opnieuw gebruiken
      van categorie 1-bouwstoffen niet zijnde grond wordt vrijstelling verleend van [artikel 9 van het Besluit][ref7],
      mits wordt aangetoond dat de bouwstof voldoet aan de samenstellings- en immissiewaarden, zoals aangegeven in
      [bijlage 2, van het Besluit][ref8]:

      a) op grond van algemene informatie; of

      b) aan de hand van gegevens omtrent samenstelling en immissie die zijn bepaald in het kader van het eerdere
      gebruiken in een werk onder de vigeur van het [Besluit][ref9] of het IPO-interimbeleid ‘Werken met secundaire
      grondstoffen’.

      4 De gegevens als bedoeld in het tweede lid worden bij de melding als bedoeld in
      [artikel 11, eerste lid, van het Besluit][ref10] verstrekt.

      5 De gegevens als bedoeld in het derde lid worden tot vijf jaar na het tijdstip waarop een categorie 1-bouwstof
      niet zijnde grond in een werk is aangebracht op verzoek van het bevoegd gezag verstrekt.


