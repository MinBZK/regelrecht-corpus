    Besluit:
  url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Op deze regeling zijn de begripsbepalingen van
      [artikel 1 van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel1
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '1'
  - number: '1.2'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel1
  - number: 1.2.a)
    text: |-
      Besluit: [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: 1.2.b)
    text: |-
      bijlage 2: de bij het [Besluit behorende bijlage 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: 1.2.c)
    text: |-
      Uitvoeringsregeling: de bij het [Besluit behorende Uitvoeringsregeling][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009345
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009345
  - number: 1.2.d)
    text: 'project: een combinatie van werken die worden uitgevoerd als samenhangend en in tijd en plaats afgebakend geheel.'
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel1
  - number: '2.1'
    text: |-
      Deze regeling is van toepassing op het gebruiken van bouwstoffen op of in de bodem overeenkomstig
      [hoofdstuk 2 van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        hoofdstuk: '2'
  - number: '2.2'
    text: |-
      De vrijstelling voor sulfaat als bedoeld in [artikel 3, tweede lid, onder g][ref1] is, met uitzondering van het
      gebruiken van kleischelpen in duingebieden, niet van toepassing op het op of in de bodem gebruiken van bouwstoffen
      in:


      [ref1]: https://wetten.overheid.nl/BWBR0017326#Artikel3
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017326
        artikel: '3'
  - number: 2.2.a)
    text: |-
      gebieden die krachtens de [artikelen 7][ref1] of [21 van de Natuurbeschermingswet][ref2] zijn aangewezen als
      beschermd natuurmonument, onderscheidenlijk zijn aangewezen als staatsnatuurmonument;


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel21
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '21'
  - number: 2.2.b)
    text: |-
      gebieden die krachtens [richtlijn nr. 79/409/EEG](31979L0409) van de Raad van de Europese Gemeenschappen van 2
      april 1979 inzake het behoud van de vogelstand (PbEG L 103) zijn aangewezen als speciale beschermingszone;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel2
  - number: 2.2.c)
    text: |-
      gebieden die krachtens [richtlijn nr. 92/43/EEG](31992L0043) van de Raad van de Europese Gemeenschappen van 21 mei
      1992 inzake de instandhouding van natuurlijke habitats en de wilde flora en fauna (PbEG L 206) zijn aangewezen als
      speciale beschermingszone, en
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel2
  - number: 2.2.d)
    text: |-
      gebieden die bij de provinciale milieuverordening als bedoeld in [artikel 1.2 van de Wet milieubeheer][ref1] zijn
      aangewezen voor de waterwinning.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '3.1'
    text: |-
      In dit artikel wordt verstaan onder toegestane samenstellings- of immissiewaarde van een stof: de samenstellings-
      of immissiewaarde van een stof, zoals aangegeven in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: '3.2'
    text: |-
      Voor het op of in de bodem gebruiken van bouwstoffen, niet zijnde grond, wordt voor de volgende stoffen
      vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref1], indien de immissie van de stof niet meer
      bedraagt dan driemaal de daarvoor toegestane immissiewaarde:


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: 3.2.a)
    text: antimoon;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.2.b)
    text: barium;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.2.c)
    text: molybdeen;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.2.d)
    text: seleen;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.2.e)
    text: vanadium;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.2.f)
    text: fluoride;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.2.g)
    text: sulfaat.
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor het op of in de bodem gebruiken van keramische dakpannen, metselbakstenen, straatbakstenen, mijnsteen
      en gieterijreststoffen wordt vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref1] voor de
      immissiewaarde voor arseen, indien de immissie van arseen niet meer bedraagt dan tweemaal de daarvoor toegestane
      immissiewaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.4'
    text: |-
      Voor het op of in de bodem gebruiken van recycling brekerzand, sorteerzeefzand en brekerzeefzand wordt vrijstelling
      verleend van [artikel 7, eerste lid, van het Besluit][ref1] voor de immissiewaarde voor koper, indien de immissie
      van koper niet meer bedraagt dan tweemaal de daarvoor toegestane immissiewaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.5'
    text: |-
      Voor het op of in de bodem gebruiken van betongranulaat, menggranulaat, hydraulisch menggranulaat,
      metselwerkgranulaat, vormzand, gieterijreststoffen, brekerzeefzand en recycling brekerzand wordt vrijstelling
      verleend van [artikel 7, eerste lid, van het Besluit][ref1] voor de samenstellingswaarde voor minerale olie, indien
      de samenstelling van minerale olie niet meer bedraagt dan tweemaal de daarvoor toegestane samenstellingswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.6'
    text: |-
      Voor het op of in de bodem gebruiken van bouwstoffen, niet zijnde grond, waarvan de toegestane
      samenstellingswaarde voor EOCl (totaal) wordt overschreden, wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de samenstellingswaarde voor EOCI (totaal), indien de in EOCl
      (totaal) aanwezige halogeenverbindingen de toegestane samenstellingswaarden voor elk van die verbindingen niet
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.7'
    text: |-
      Voor het op of in de bodem gebruiken van asfalt of asfaltbeton en gevelpleisters wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de samenstellingswaarden voor EOCl (totaal).


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.8'
    text: |-
      Voor het op of in de bodem gebruiken van asfalt of asfaltbeton wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de samenstellingswaarden voor individuele PAK’s.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.9'
    text: |-
      Voor het op of in de bodem gebruiken van avi-bodemas wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de immissiewaarde voor molybdeen.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.10'
    text: |-
      Voor het op of in de bodem gebruiken van drinkwaterreststoffen wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de immissiewaarde voor bromide, indien de immissie van bromide
      niet meer bedraagt dan driemaal de daarvoor toegestane immissiewaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.11'
    text: |-
      Voor het op of in de bodem gebruiken van gieterijreststoffen, vormzand, asfalt of asfaltbeton, bitumen
      dakbedekkings- en afdichtingsmaterialen en secundair bitumengranulaat in vormgegeven toepassingen wordt
      vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref1] voor de samenstellingswaarde voor fenol,
      indien de samenstelling van fenol niet meer bedraagt dan driemaal de daarvoor toegestane samenstellingswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.12'
    text: |-
      Voor het op of in de bodem gebruiken van mijnsteen wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de immissiewaarde voor antimoon, indien de concentratie van die
      stof de waarde van 3 milligram per kilogram droge stof niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.13'
    text: |-
      Voor het op of in de bodem gebruiken van thermisch gereinigd teerhoudend asfaltgranulaat wordt vrijstelling
      verleend van [artikel 7, eerste lid, van het Besluit][ref1] voor de immissiewaarde voor antimoon, mits de
      concentratie van die stof de waarde van 3 milligram per kilogram droge stof niet overschrijdt en de immissiewaarde
      voor fluoride, mits de concentratie van die stof de waarde van 500 milligram per kilogram droge stof niet
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.14'
    text: |-
      Voor het op of in de bodem gebruiken van thermisch gereinigde grond met een gemeten lutumgehalte van minder dan 10%
      geldt, in afwijking van [bijlage 2][ref1], voor de omrekening van de samenstellingswaarden van de standaardgrond
      naar de samenstellingswaarden van de te beoordelen grond, voor barium een lutumgehalte van 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: '3.15'
    text: |-
      Voor het op of in de bodem gebruiken van E-vliegas wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de immissiewaarden voor molybdeen en seleen, indien de
      isolatiemaatregelen en de daarbij behorende beheers- en controlemaatregelen worden getroffen die ingevolge
      [artikel 10.1.1 van de Uitvoeringsregeling][ref2] gelden voor de bijzondere categorie avi-bodemas, de E-
      vliegas tijdens aanleg tijdig, in ieder geval binnen twee dagen, wordt afgedekt en het vochtgehalte bij het
      aanbrengen zo laag mogelijk wordt gehouden. Voor het gebruik van E-vliegas in niet-standaard-toepassingen is
      [artikel 10.3.1 van de Uitvoeringsregeling][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009345#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009345#Artikel10
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009345
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009345
        artikel: '10'
  - number: '3.16'
    text: |-
      Voor het op of in de bodem gebruiken van kleischelpen in duingebieden wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor de immissiewaarde voor bromide en chloride.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '3.17'
    text: |-
      De bepaling van de concentratie van antimoon en van fluoride, als bedoeld in het twaalfde en dertiende lid, vindt
      plaats overeenkomstig de volgende methoden:
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.17.a)
    text: |-
      de monstervoorbehandeling en de ontsluiting van het monster overeenkomstig het Accreditatie-programma
      Bouwstoffenbesluit (AP 04);
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
  - number: 3.17.b)
    text: |-
      de analyse van het destruaat van het monster overeenkomstig de normvoorschriften, zoals aangegeven in
      [bijlage A][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017326
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017326
  - number: '3.18'
    text: |-
      De bepaling, bedoeld in het zeventiende lid, vindt plaats door een laboratorium dat is geaccrediteerd door de Raad
      voor Accreditatie op grond van NEN-EN-ISO/IEC 17025, uitgave 2000 voor een van de in [bijlage A][ref1] bij deze
      regeling opgenomen NEN-normen.


      [ref1]: https://wetten.overheid.nl/BWBR0017326
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017326
  - number: '4'
    text: |-
      Voor het op of in de bodem gebruiken van bitumen dakbedekkings- en afdichtingsmaterialen
      en secundair bitumengranulaat in vormgegeven toepassingen wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor individuele PAK’s, benzeen, ethylbenzeen, tolueen, xylenen,
      minerale olie en EOCl (totaal).


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '5'
    text: |-
      Voor het op of in de bodem gebruiken van vormgegeven bouwstoffen met een bitumencoating in de
      burger- en utiliteitsbouw wordt voor de bitumencoating van de bouwstof vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref1] voor individuele PAK’s en minerale olie.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '6'
    text: |-
      Voor het op of in de bodem gebruiken van vormgegeven bouwstoffen bestaande uit of voorzien van een organische
      coating met steenachtige toeslagstoffen in de burger- en utiliteitsbouw wordt voor de organische coating
      vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref1] voor minerale olie.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '7.1'
    text: |-
      Voor het op of in de bodem gebruiken van grond wordt vrijstelling verleend van het bepalen van de
      immissie ingevolge [artikel 9, vierde lid, van het Besluit][ref1] en het bij een melding ingevolge
      [artikel 11, zevende lid][ref2], juncto [bijlage 3, onder 4, van het Besluit][ref3] verstrekken van gegevens met
      betrekking tot de immissie uit de bouwstof in de bodem, indien een door Onze Ministers aangewezen instantie het
      uitlooggedrag conform NEN 7373 heeft trachten te bepalen gedurende een periode van ten hoogste 28 dagen en daarbij
      een hoeveelheid percolaat is verkregen die kleiner is dan overeenkomt met een L/S-waarde van 2.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0007667
  - number: '7.2'
    text: |-
      Voor het op of in de bodem gebruiken van niet-vormgegeven bouwstoffen, niet zijnde grond, wordt vrijstelling
      verleend van het bepalen van de immissie ingevolge [artikel 9, vierde lid, van het Besluit][ref1], indien een door
      Onze Ministers aangewezen instantie het uitlooggedrag conform NEN 7373 heeft trachten te bepalen gedurende een
      periode van ten hoogste 28 dagen en daarbij een hoeveelheid percolaat is verkregen die kleiner is dan overeenkomt
      met een L/S-waarde van 2.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
  - number: '7.3'
    text: |-
      De gegevens waaruit blijkt dat aan het eerste lid wordt voldaan, worden bij de melding als bedoeld in
      [artikel 11, eerste lid, van het Besluit][ref1] verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel11
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '11'
  - number: '7.4'
    text: |-
      De gegevens waaruit blijkt dat aan het tweede lid wordt voldaan, worden tot vijf jaar na het tijdstip waarop
      de niet-vormgegeven bouwstof, niet zijnde grond, in een werk is aangebracht op verzoek van het bevoegd gezag
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel7
  - number: '8'
    text: |-
      Voor het op of in de bodem gebruiken van metselmortel in de burger- en utiliteitsbouw voor het metselen met
      vormgegeven bouwstoffen, wordt vrijstelling verleend van [artikel 9 van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
  - number: '9.1'
    text: |-
      Voor de volgende situaties wordt vrijstelling verleend van [artikel 9 van het Besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
  - number: 9.1.a)
    text: |-
      het zonder bewerking en onder dezelfde condities opnieuw op of in de bodem gebruiken van vormgegeven bouwstoffen
      van beton, keramiek, natuursteen en bakstenen;
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
  - number: 9.1.b)
    text: |-
      het opnieuw warm in situ op of in de bodem gebruiken van asfalt of asfaltbeton in wegverhardingen, indien conform
      het CROW-rapport 04-08 voorpublicatie 210 ‘Richtlijn omgaan met vrijkomend asfalt’’ wordt aangetoond dat het
      materiaal niet teerhoudend is.
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
  - number: '9.2'
    text: |-
      Voor het binnen een project op of in de bodem zonder bewerking en onder dezelfde condities opnieuw gebruiken
      van grond die behoort tot de categorie 1-bouwstoffen wordt vrijstelling verleend van [artikel 9][ref1] en
      [artikel 11, zevende lid][ref2], juncto [bijlage 3, onder 4, van het Besluit][ref3], mits wordt aangetoond dat de
      bouwstof voldoet aan de samenstellings- en immissiewaarden, zoals aangegeven in [bijlage 2, van het Besluit][ref4]:


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007667
      [ref4]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007667
      - id: ref4
        bwb_id: BWBR0007667
  - number: 9.2.a)
    text: op grond van algemene informatie; of
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
  - number: 9.2.b)
    text: |-
      aan de hand van gegevens omtrent samenstelling en immissie die zijn bepaald in het kader van het eerdere gebruiken
      in een werk onder de vigeur van het [Besluit][ref1] of het IPO-interimbeleid ‘Werken met secundaire grondstoffen’.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: '9.3'
    text: |-
      Voor het binnen een project op of in de bodem zonder bewerking en onder dezelfde condities opnieuw gebruiken
      van categorie 1-bouwstoffen niet zijnde grond wordt vrijstelling verleend van [artikel 9 van het Besluit][ref1],
      mits wordt aangetoond dat de bouwstof voldoet aan de samenstellings- en immissiewaarden, zoals aangegeven in
      [bijlage 2, van het Besluit][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007667
  - number: 9.3.a)
    text: op grond van algemene informatie; of
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
  - number: 9.3.b)
    text: |-
      aan de hand van gegevens omtrent samenstelling en immissie die zijn bepaald in het kader van het eerdere gebruiken
      in een werk onder de vigeur van het [Besluit][ref1] of het IPO-interimbeleid ‘Werken met secundaire grondstoffen’.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007667
  - number: '9.4'
    text: |-
      De gegevens als bedoeld in het tweede lid worden bij de melding als bedoeld in
      [artikel 11, eerste lid, van het Besluit][ref1] verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel11
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '11'
  - number: '9.5'
    text: |-
      De gegevens als bedoeld in het derde lid worden tot vijf jaar na het tijdstip waarop een categorie 1-bouwstof niet
      zijnde grond in een werk is aangebracht op verzoek van het bevoegd gezag verstrekt.
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel9
  - number: '10'
    text: |-
      De [artikelen 7 tot en met 9][ref1] zijn niet van toepassing op bouwstoffen waarvan op grond van organoleptische
      waarneming of kennis niet kan of redelijkerwijs niet zou kunnen worden aangenomen dat die bouwstoffen voldoen aan
      de samenstellings- en immissiewaarden, zoals aangegeven in [bijlage 2, van het Besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017326#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017326
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007667
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke vrijstellingsregeling Bouwstoffenbesluit 2004.'
    url: https://wetten.overheid.nl/BWBR0017326/2006-01-01#Artikel12
