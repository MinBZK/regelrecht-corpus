  - number: '3'
    text: |-
      1 In dit artikel wordt verstaan onder toegestane samenstellings- of immissiewaarde van een stof: de samenstellings-
      of immissiewaarde van een stof, zoals aangegeven in [bijlage 2][ref1].

      2 Voor het op of in de bodem gebruiken van bouwstoffen, niet zijnde grond, wordt voor de volgende stoffen
      vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref2], indien de immissie van de stof niet meer
      bedraagt dan driemaal de daarvoor toegestane immissiewaarde:

      a) antimoon;

      b) barium;

      c) molybdeen;

      d) seleen;

      e) vanadium;

      f) fluoride;

      g) sulfaat.

      3 Voor het op of in de bodem gebruiken van keramische dakpannen, metselbakstenen, straatbakstenen, mijnsteen
      en gieterijreststoffen wordt vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref3] voor de
      immissiewaarde voor arseen, indien de immissie van arseen niet meer bedraagt dan tweemaal de daarvoor toegestane
      immissiewaarde.

      4 Voor het op of in de bodem gebruiken van recycling brekerzand, sorteerzeefzand en brekerzeefzand wordt
      vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref4] voor de immissiewaarde voor koper, indien
      de immissie van koper niet meer bedraagt dan tweemaal de daarvoor toegestane immissiewaarde.

      5 Voor het op of in de bodem gebruiken van betongranulaat, menggranulaat, hydraulisch menggranulaat,
      metselwerkgranulaat, vormzand, gieterijreststoffen, brekerzeefzand en recycling brekerzand wordt vrijstelling
      verleend van [artikel 7, eerste lid, van het Besluit][ref5] voor de samenstellingswaarde voor minerale olie, indien
      de samenstelling van minerale olie niet meer bedraagt dan tweemaal de daarvoor toegestane samenstellingswaarde.

      6 Voor het op of in de bodem gebruiken van bouwstoffen, niet zijnde grond, waarvan de toegestane
      samenstellingswaarde voor EOCl (totaal) wordt overschreden, wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref6] voor de samenstellingswaarde voor EOCI (totaal), indien de in EOCl
      (totaal) aanwezige halogeenverbindingen de toegestane samenstellingswaarden voor elk van die verbindingen niet
      overschrijden.

      7 Voor het op of in de bodem gebruiken van asfalt of asfaltbeton en gevelpleisters wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref7] voor de samenstellingswaarden voor EOCl (totaal).

      8 Voor het op of in de bodem gebruiken van asfalt of asfaltbeton wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref8] voor de samenstellingswaarden voor individuele PAK’s.

      9 Voor het op of in de bodem gebruiken van avi-bodemas wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref9] voor de immissiewaarde voor molybdeen.

      10 Voor het op of in de bodem gebruiken van drinkwaterreststoffen wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref10] voor de immissiewaarde voor bromide, indien de immissie van bromide
      niet meer bedraagt dan driemaal de daarvoor toegestane immissiewaarde.

      11 Voor het op of in de bodem gebruiken van gieterijreststoffen, vormzand, asfalt of asfaltbeton, bitumen
      dakbedekkings- en afdichtingsmaterialen en secundair bitumengranulaat in vormgegeven toepassingen wordt
      vrijstelling verleend van [artikel 7, eerste lid, van het Besluit][ref11] voor de samenstellingswaarde voor fenol,
      indien de samenstelling van fenol niet meer bedraagt dan driemaal de daarvoor toegestane samenstellingswaarde.

      12 Voor het op of in de bodem gebruiken van mijnsteen wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref12] voor de immissiewaarde voor antimoon, indien de concentratie van
      die stof de waarde van 3 milligram per kilogram droge stof niet overschrijdt.

      13 Voor het op of in de bodem gebruiken van thermisch gereinigd teerhoudend asfaltgranulaat wordt vrijstelling
      verleend van [artikel 7, eerste lid, van het Besluit][ref13] voor de immissiewaarde voor antimoon, mits de
      concentratie van die stof de waarde van 3 milligram per kilogram droge stof niet overschrijdt en de immissiewaarde
      voor fluoride, mits de concentratie van die stof de waarde van 500 milligram per kilogram droge stof niet
      overschrijdt.

      14 Voor het op of in de bodem gebruiken van thermisch gereinigde grond met een gemeten lutumgehalte van minder
      dan 10% geldt, in afwijking van [bijlage 2][ref14], voor de omrekening van de samenstellingswaarden van de
      standaardgrond naar de samenstellingswaarden van de te beoordelen grond, voor barium een lutumgehalte van 10%.

      15 Voor het op of in de bodem gebruiken van E-vliegas wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref15] voor de immissiewaarden voor molybdeen en seleen, indien de
      isolatiemaatregelen en de daarbij behorende beheers- en controlemaatregelen worden getroffen die ingevolge
      [artikel 10.1.1 van de Uitvoeringsregeling][ref16] gelden voor de bijzondere categorie avi-bodemas, de E-
      vliegas tijdens aanleg tijdig, in ieder geval binnen twee dagen, wordt afgedekt en het vochtgehalte bij het
      aanbrengen zo laag mogelijk wordt gehouden. Voor het gebruik van E-vliegas in niet-standaard-toepassingen is
      [artikel 10.3.1 van de Uitvoeringsregeling][ref17] van overeenkomstige toepassing.

      16 Voor het op of in de bodem gebruiken van kleischelpen in duingebieden wordt vrijstelling verleend van
      [artikel 7, eerste lid, van het Besluit][ref18] voor de immissiewaarde voor bromide en chloride.

      17 De bepaling van de concentratie van antimoon en van fluoride, als bedoeld in het twaalfde en dertiende lid,
      vindt plaats overeenkomstig de volgende methoden:

      a) de monstervoorbehandeling en de ontsluiting van het monster overeenkomstig het Accreditatie-programma
      Bouwstoffenbesluit (AP 04);

      b) de analyse van het destruaat van het monster overeenkomstig de normvoorschriften, zoals aangegeven in
      [bijlage A][ref19] bij deze regeling.

      18 De bepaling, bedoeld in het zeventiende lid, vindt plaats door een laboratorium dat is geaccrediteerd door de
      Raad voor Accreditatie op grond van NEN-EN-ISO/IEC 17025, uitgave 2000 voor een van de in [bijlage A][ref20] bij
      deze regeling opgenomen NEN-normen.


