        artikel: '2'
  - number: '4'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen regels dan wel nadere
      regels worden gesteld met betrekking tot:

      a. de aanvraag van de subsidie, de daarbij over te leggen gegevens en bescheiden, en de besluitvorming daarover;

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      c. de voorwaarden waaronder de subsidie wordt verleend;

      d. de verplichtingen van de subsidie-ontvanger;

      e. de vaststelling van de subsidie;

      f. de betaling van de subsidie en het verlenen van voorschotten;

      g. intrekking of wijziging van de subsidieverlening of -vaststelling;

      h. de wijze van verdeling van beschikbare bedragen;

      i. de vergoeding die verschuldigd is bij vermogensvorming, bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1];

      j. de termijn van publicatie en de inrichting van het verslag over de doeltreffendheid en de effecten van de
      subsidie in de praktijk;

      k. de openbaarmaking van de resultaten van de gesubsidieerde activiteiten;

      l. het geven van informatie aan derden over de gesubsidieerde activiteiten door de subsidie-ontvanger;

      m. de maatregelen om misbruik en oneigenlijk gebruik van subsidie te voorkomen.

      2 Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen de aanvraag van
      de subsidie uitsluitend langs elektronische weg kan geschieden. Daarbij kan worden afgeweken van de
      [artikelen 2:7, tweede lid][ref2], en [2:8 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel28
    url: https://wetten.overheid.nl/BWBR0019756/2026-01-01#Artikel4
