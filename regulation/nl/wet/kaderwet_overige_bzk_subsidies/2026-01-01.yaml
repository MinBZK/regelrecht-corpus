        artikel: 4:57
  - number: '6'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidie-ontvanger opgelegde
      verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen.

      2 De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      3 Aan subsidies die op grond van deze wet zijn verstrekt, is de verplichting verbonden dat de subsidie-ontvanger
      aan een toezichthouder alle medewerking verleent die deze redelijkerwijze kan vorderen bij de uitoefening van zijn
      bevoegdheden.

      4 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
