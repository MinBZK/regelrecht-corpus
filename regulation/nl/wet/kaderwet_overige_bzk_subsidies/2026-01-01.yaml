preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet overige BiZa-subsidies te vervangen door een
    nieuwe regeling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019756/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties of Onze Minister voor Wonen en Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0019756/2026-01-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan subsidies verstrekken voor activiteiten die passen in het beleid inzake:

      a. het bevorderen van de democratische rechtsstaat;

      b. het decentraal bestuur;

      c. het management en personeelsbeleid van de openbare dienst;

      d. de Koninkrijksrelaties en de openbare lichamen Bonaire, Sint Eustatius en Saba;

      e. het bouwen, het wonen en de woonomgeving.

      2 Onze Minister kan voorts subsidies verstrekken voor activiteiten op het gebied van de onderwerpen, die zijn
      genoemd in de begrotingsstaat, onderdeel uitgaven en verplichtingen, behorend bij de wet, houdende vaststelling
      van de begrotingsstaten van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties of de begrotingsstaten van
      Wonen en Rijksdienst voor het desbetreffende jaar, of voor een voorafgaand jaar, voor zover daarin een beschikking
      tot subsidieverstrekking is gegeven. Indien bij de aanvang van enig jaar bedoelde wet nog niet in werking is
      getreden, wordt tot die inwerkingtreding het voorstel daartoe in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0019756/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen de in [artikel 2][ref1]
      bedoelde activiteiten waarvoor subsidie kan worden verstrekt nader worden bepaald en kunnen criteria voor die
      verstrekking worden vastgesteld.

      2 Bij of krachtens algemene maatregel van bestuur of bij een ministeriële regeling als bedoeld in het eerste lid
      wordt voorzien in de vaststelling van een subsidieplafond en de regeling van de wijze van verdeling ervan, tenzij
      Onze Minister van Financiën heeft ingestemd met het achterwege laten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0019756#Artikel2
    url: https://wetten.overheid.nl/BWBR0019756/2026-01-01#Artikel3
    references:
      - id: ref1
