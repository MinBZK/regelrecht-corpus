preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot een regeling voor erkenning voor het
    bijzonder onderwijs, dat niet uit ’s Rijks kas wordt bekostigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. "Onze Minister": Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. "instelling": een instelling voor onderwijs die uitgaat van een natuurlijke persoon dan wel van een
      privaatrechtelijke rechtspersoon;

      c. "bevoegd gezag": de natuurlijke persoon van wie de instelling uitgaat dan wel het orgaan van de rechtspersoon
      dat bevoegd is terzake van de instelling rechtshandelingen te verrichten;

      d. "de inspectie": de inspectie bedoeld in de [Wet op het onderwijstoezicht][ref1], voor zover belast met taken op
      het gebied van het onderwijs waarop deze wet van toepassing is;

      e. "schriftelijk onderwijs": onderwijs waarbij de communicatie tussen cursist en instelling zich geheel of in
      hoofdzaak voltrekt door geregelde uitwisseling van het gedrukte en geschreven woord al dan niet in combinatie met
      visuele, auditieve, audiovisuele of andere hulpmiddelen;

      f. "auteur": hij die ten behoeve van het schriftelijk onderwijs door het bevoegd gezag is belast met het
      samenstellen en bijhouden van de schriftelijke lessen dan wel de daarbij behorende hulpmiddelen, dan wel beide;

      g. "docent": hij die door het bevoegd gezag is belast met het geven van mondelinge lessen dan wel het corrigeren en
      van aanwijzingen voorzien van het door cursisten ingezonden werk dan wel beide;

      h. "cursus": een educatieve activiteit, waarbij door interactie tussen docent en cursist met een vooropgezet
      leerdoel een afgeronde hoeveelheid kennis, vaardigheid of attitudes wordt overgedragen. Indien een instelling ten
      behoeve van een wederpartij slechts een deel van de cursus verzorgt, wordt dit deel als cursus aangemerkt;

      i. "deelexamen": een voor de cursist op zich staand examen in een examenvak.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel1
