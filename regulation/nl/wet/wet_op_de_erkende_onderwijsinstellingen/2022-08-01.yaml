  - number: '2'
    text: |-
      1 Deze wet is van toepassing op het onderwijs dat niet volledig en rechtstreeks uit ’s Rijks kas wordt bekostigd,
      gericht op het afleggen van een van de volgende examens:

      a. een staatsexamen als bedoeld in [artikel 2.72 van de Wet voortgezet onderwijs 2020][ref1], en

      b. een eindexamen als bedoeld in [artikel 2.51, tweede lid, van de Wet voortgezet onderwijs 2020][ref2].

      2 Deze wet is niet van toepassing op het onderwijs, aangewezen op grond van [artikel 2.66][ref3] of
      [artikel 2.71 van de Wet voortgezet onderwijs 2020][ref4], op onderwijs verricht in het kader van
      contractactiviteiten als bedoeld in [artikel 2.9, tweede lid, van de Wet voortgezet onderwijs 2020][ref5], en op
      het onderwijs in de openbare lichamen Bonaire, Sint Eustatius en Saba.


