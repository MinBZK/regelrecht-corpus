  - number: '5'
    text: |-
      Na ontvangst van de aanvraag tot erkenning en de in [artikel 4, tweede lid][ref1], bedoelde bijlagen wordt binnen 1
      jaar na ontvangst hiervan, daarop een beslissing genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003821#Artikel4
