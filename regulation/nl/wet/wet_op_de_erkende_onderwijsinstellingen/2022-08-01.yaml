  - number: '8'
    text: |-
      De leden van de directie van de instellingen zijn in het bezit van een verklaring omtrent het gedrag, afgegeven
      volgens de [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
