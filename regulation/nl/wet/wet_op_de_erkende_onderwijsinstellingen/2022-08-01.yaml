  - number: '6'
    text: |-
      1 Het bevoegd gezag van de instelling vermeldt de erkenning in de met betrekking tot de instelling uitgaande
      correspondentie, publikaties en reclame met de woorden "erkend door de Minister van Onderwijs, Cultuur en
      Wetenschap op grond van de Wet op de erkende onderwijsinstellingen".

      2 Indien de instelling andere activiteiten verricht dan het onderwijs waarop deze wet van toepassing is, moet het
      bevoegd gezag in de met betrekking tot de instelling uitgaande correspondentie, publikaties en reclame, duidelijk
      doen uitkomen op welk onderwijs de erkenning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel6
  - number: '7'
    text: |-
      1 De auteurs en docenten zijn in het bezit van een bewijs dan wel verklaring van bekwaamheid, zoals die voor het
      desbetreffende vak voor het op grond van een onderwijswet uit ’s Rijks kas bekostigd onderwijs vereist zijn en
      indien er geen overeenkomstig op grond van een onderwijswet uit ’s Rijks kas bekostigd onderwijs is, een door Onze
      Minister aanvaard bewijs of aanvaarde verklaring van bekwaamheid.

      2 Onder onderwijswet bedoeld in het eerste lid wordt verstaan: de [Wet op het primair onderwijs][ref1],
      de [Wet op de expertisecentra][ref2], de [Wet voortgezet onderwijs 2020][ref3] en de
      [Experimentenwet onderwijs][ref4].

      3 Onze Minister kan goedkeuren dat wordt afgeweken van de in het eerste lid gestelde eis.


