        bwb_id: BWBR0014194
  - number: '9'
    text: |-
      1 De cursus is zodanig afgestemd op de kennis en ervaring van de cursist, dat het gestelde doel redelijkerwijs kan
      worden bereikt.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gesteld omtrent de kwaliteit van de
      cursus en de betrekkingen tussen de instelling en de cursist.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel9
  - number: '10'
    text: |-
      1 De werving van cursisten geschiedt op behoorlijke wijze.

      2 Het bevoegd gezag verstrekt bij de werving van cursisten voor de instelling geen cadeaus van welke aard ook en
      doet geen toezegging daaromtrent.

      3 Het bevoegd gezag draagt er zorg voor dat bij de werving van cursisten voor de instelling geen gebruik wordt
      gemaakt van personen die in de uitoefening van een beroep of bedrijf door persoonlijk bezoek dan wel door of in
      samenhang met de aanprijzing van een cursus in een groep van ter plaatse van de aanprijzing aanwezige personen een
      particulier trachten te bewegen in te schrijven op een cursus.

      4 Voor de toepassing van het derde lid wordt als persoonlijk bezoek niet aangemerkt het persoonlijk bezoek, dat in
      overwegende mate voortvloeit uit een initiatief van degene, die wordt bezocht, en als groep van personen wordt niet
      aangemerkt een groep, welke kennelijk niet met of mede met het oog op de aanprijzing van een cursus in die groep
      is bijeengebracht.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel10
  - number: '11'
    text: |-
      1 De overeenkomst tussen de natuurlijke persoon dan wel de rechtspersoon waarvan de instelling uitgaat en de
      cursist wordt schriftelijk aangegaan en vermeldt in elk geval:

      a. de benaming, doelstelling en omschrijving van de cursus, met verwijzing naar de studiegids die betrekking heeft
      op de cursus;

      b. de mogelijkheid al dan niet examen af te leggen aan het einde van de cursus;

      c. de vooropleiding van de cursist die voor het volgen van de cursus nodig of wenselijk is;

      d. de wijze waarop de cursus wordt gegeven en voor zover van toepassing de plaats waar de lessen worden gegeven, de
      frequentie van de lessen, het aantal klokuren en de vakantie;

      e. de cursusduur bij een normaal studietempo, gebaseerd op een aangegeven aantal uren studie per week;

      f. de aan de cursus en aan het examen verbonden kosten, onder te verdelen in:

      1°. de kosten van boeken en leermiddelen door de instelling te verstrekken, en te betalen aan de instelling;

      2°. de kosten van boeken en leermiddelen die buiten de instelling moeten worden aangeschaft;

      3°. de kosten waartegen de cursist het cursusmateriaal waarvan de instelling zich het eigendomsrecht heeft
      voorbehouden, na de afsluiting van de overeenkomst zal kunnen overnemen, indien de instelling alsnog tot aanbieding
      van dat cursusmateriaal aan de cursist zou besluiten;

      4°. de onderwijsbijdrage, waaronder begrepen een eventueel verschuldigd inschrijfgeld;

      5°. het examengeld;

      g. de voorwaarden, waaronder de overeenkomst voortijdig kan worden ontbonden. Tot deze voorwaarden worden in elk
      geval gerekend:

      1°. het overlijden van de cursist;

      2°. schriftelijke opzegging van een cursus met een kortere cursusduur dan 6 maanden door de cursist is buiten
      onderling goedvinden niet mogelijk;

      3°. schriftelijke opzegging van een schriftelijke cursus met cursusduur van 6 maanden of langer. Bij die
      schriftelijke opzegging wordt geen opzegtermijn van meer dan 3 maanden bedongen. Bij die schriftelijke opzegging is
      de cursist geen opgaaf van redenen verschuldigd tenzij hij een overeengekomen opzegtermijn niet in acht neemt;

      4°. schriftelijke opzegging van een niet-schriftelijke cursus met een cursusduur van 6 maanden of langer. Bij die
      schriftelijke opzegging wordt geen opzegtermijn van meer dan 5 maanden bedongen. Bij die schriftelijke opzegging is
      de cursist geen opgaaf van redenen verschuldigd tenzij hij een overeengekomen opzegtermijn niet in acht neemt.

      De wederzijdse rechten en verplichtingen, voortvloeiende uit de overeenkomst, eindigen zodra de overeenkomst is
      ontbonden. Reeds tevoren betaalde onderwijsbijdragen worden terugbetaald voor zover deze betrekking hebben op de
      periode na het beëindigen van de overeenkomst. Bij algemene maatregel van bestuur kan worden bepaald, dat de plicht
      tot terugbetaling niet bestaat indien het teveel betaalde bedrag een bepaalde som niet te boven gaat;

      h. de eigendoms- en gebruiksrechten van het verstrekte cursusmateriaal;

      i. de mogelijkheid om ingeval van klachten met betrekking tot de cursus de bemiddeling in te roepen van de
      inspectie, waarvan het adres wordt aangegeven.

      2 De in het eerste lid onder *a* bedoelde studiegids maakt deel uit van de overeenkomst.

      3 De cursist ontvangt een bewijs, waarbij de instelling verklaart hem als cursist te aanvaarden onder de bepalingen
      genoemd in het eerste en tweede lid van dit artikel.

      4 Het eerste tot en met derde lid, met uitzondering van het eerste lid onder *g* onder 1°, is van overeenkomstige
      toepassing op overeenkomsten tussen de natuurlijke persoon dan wel de rechtspersoon waarvan de instelling
      uitgaat en de werkgever, die voor één of meer van zijn werknemers de overeenkomst aangaat. Bij overlijden van een
      werknemer, wiens werkgever de overeenkomst is aangegaan, kan de overeenkomst voortijdig worden ontbonden, indien
      zij uitsluitend betrekking heeft op die werknemer.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel11
  - number: '12'
    text: |-
      1 De examens van een instelling worden geregeld in een of meer examenreglementen, die de goedkeuring van Onze
      Minister behoeven. De examenreglementen bevatten in elk geval bepalingen omtrent:

      a. de wijze van aanmelden;

      b. de toelatingseisen;

      c. de legitimatie van de cursist;

      d. de samenstelling van de examencommissies, voor wat betreft de deskundigheid en het benoemen van buitenstaanders;

      e. de duur en de wijze van examineren;

      f. de maatregelen in geval bedrog wordt geconstateerd;

      g. de geheimhouding van de examenopgaven;

      h. de beoordelingsnormen en de normen voor slagen en afwijzen.

      2 De examenopgaven hebben voor zover het examens betreft zoveel mogelijk betrekking op de gehele tijdens de cursus
      behandelde leerstof. Voor zover het deelexamens betreft, hebben de opgaven zoveel mogelijk betrekking op de tijdens
      de cursus tot het afleggen van die deelexamens behandelde leerstof.

      3 De examendata worden ten minste 6 weken voor de aanvang van het examen schriftelijk aan de cursist medegedeeld.

      4 Het bevoegd gezag van de instelling zendt onmiddellijk na afloop van elk examen een examenverslag aan Onze
      Minister. Onze Minister stelt het model van dit verslag vast.

      5 De examenopgaven dienen na afloop van een examen op verzoek en desgewenst tegen betaling bij de instelling
      verkrijgbaar te worden gesteld, behalve in gevallen waarin Onze Minister toestaat dat examenopgaven niet op deze
      wijze verkrijgbaar worden gesteld.

      6 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel12
  - number: '13'
    text: |-
      1 Voor het toezicht op de examens van de instellingen kan Onze Minister gecommitteerden aanwijzen. De aanwijzing
      geldt totdat voor alle cursisten die het examen afleggen de einduitslag is vastgesteld. Indien dit door Onze
      Minister wordt verzocht, stelt het bevoegd gezag gecommitteerden ter aanwijzing voor.

      2 De gecommitteerden ontvangen uit ’s Rijks kas vacatiegeld en een vergoeding van reis- en verblijfkosten, volgens
      door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel13
  - number: '14'
    text: |-
      1 Een diploma en een beoordelingslijst worden uitgereikt aan de cursist, die voor het examen van de instelling
      is geslaagd.

      2 Een certificaat met vermelding van de beoordelingen wordt uitgereikt aan de cursist, die voor het deelexamen van
      de instelling is geslaagd.

      3 Het bevoegd gezag is verplicht een verklaring uit te reiken aan de cursist, die de cursus heeft voltooid en aan
      wie geen diploma of certificaat kan worden verstrekt, wanneer hij daar binnen een jaar na voltooiing van de cursus
      om vraagt. Onze Minister kan nadere voorschriften geven omtrent de inhoud van de verklaringen.

      4 De modellen van de diploma's, de certificaten, de beoordelingslijsten en van de verklaringen behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel14
  - number: '16'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat door zijn handelen of nalaten het belang van het onderwijs waarop deze
      wet van toepassing is niet kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel16
  - number: '17'
    text: |-
      1 Jaarlijks vóór 1 december zendt het bevoegd gezag van de instelling een opgave van het aantal cursisten per 1
      november aan Onze Minister.

      2 Wijzigingen in het aantal en de aard der cursussen deelt het bevoegd gezag van de instelling onverwijld aan Onze
      Minister mede.

      3 Het bevoegd gezag van de instelling is desgevraagd verplicht Onze Minister nadere inlichtingen te verstrekken.

      4 Het bevoegd gezag van de instelling zendt van alle aan Onze Minister gerichte stukken afschrift aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel17
  - number: '18'
    text: Onze Minister kan zich omtrent de kwaliteit van de cursussen van de instelling door deskundigen doen voorlichten.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel18
  - number: '19'
    text: |-
      1 Indien een instelling niet meer voldoet aan de voorschriften gegeven bij of krachtens deze wet kan Onze Minister:

      a. volgens regels te stellen bij algemene maatregel van bestuur de instelling op straffe van intrekking van de
      erkenning de inschrijving op een of meer cursussen verbieden totdat deze weer voldoet aan de voorschriften gegeven
      bij of krachtens deze wet;

      b. de erkenning intrekken.

      2 Onze Minister beslist over de intrekking, het bevoegd gezag van de instelling gehoord.

      3 Onze Minister trekt op aanvraag van het bevoegd gezag van de instelling de erkenning in.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel19
  - number: '20'
    text: |-
      1 De erkenning van een instelling vervalt van rechtswege, wanneer de instelling niet binnen 1 jaar nadat zij is
      opgehouden met het geven van onderwijs, opnieuw is aangevangen met het geven van onderwijs.

      2 De erkenning van een instelling vervalt eveneens van rechtswege, wanneer de instelling opgaat in een andere
      instelling, die niet erkend is op grond van deze wet terwijl zij wel activiteiten verricht waarop deze wet van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel20
  - number: '26'
    text: |-
      1 Onze Minister draagt zorg, dat de krachtens deze wet tot stand gebrachte ministeriële regelingen bekend worden
      gemaakt in de *Nederlandse Staatscourant*.

      2 Onze Minister draagt eveneens zorg, dat van de beschikking tot verlening van een erkenning, alsmede van die tot
      intrekking daarvan of tot afwijzing van een aanvraag tot erkenning, en van het vervallen van rechtswege van een
      erkenning, mededeling wordt gedaan in de *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel26
  - number: '27'
    text: |-
      In afwijking van het bepaalde in [artikel 5][ref1] geldt voor verzoeken die zijn ingediend binnen 1 jaar na de
      inwerkingtreding van de wet, dat binnen 2 jaar na inwerkingtreding van de wet een beslissing wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003821#Artikel5
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003821
        artikel: '5'
  - number: '28'
    text: |-
      1 De Wet erkenning instellingen schriftelijk onderwijs wordt ingetrokken en de erkenningen gegeven op grond van de
      Wet erkenning instellingen schriftelijk onderwijs worden erkenningen in de zin van deze wet.

      2 Indien een instelling die ook onderwijs, waarop deze wet van toepassing is, niet zijnde schriftelijk onderwijs
      verzorgt, niet binnen 1 jaar na de inwerkingtreding van deze wet voor het gehele pakket van het schriftelijk en dat
      ander onderwijs een hernieuwde erkenning heeft aangevraagd, vervalt de erkenning van rechtswege.

      3 Indien een instelling de in het tweede lid bedoelde hernieuwde erkenning binnen 1 jaar na de inwerkingtreding
      van de wet aanvraagt, blijft de erkenning in het eerste lid gehandhaafd, doch met een werking beperkt tot het
      schriftelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel28
