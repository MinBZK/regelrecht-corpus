  - number: '3'
    text: |-
      Onze Minister erkent een instelling, indien zij voldoet aan de voorschriften van deze wet en van de algemene
      maatregel van bestuur, bedoeld in [artikel 9, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003821#Artikel9
    url: https://wetten.overheid.nl/BWBR0003821/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003821
        artikel: '9'
  - number: '4'
    text: |-
      1 Een aanvraag tot erkenning wordt ingediend door het bevoegd gezag van de instelling.

      2 De aanvraag gaat vergezeld van gegevens omtrent het aantal en de aard der cursussen en het aantal cursisten,
      alsmede van een opgave van auteurs en/of docenten onder vermelding van hun onderwijsbevoegdheid bedoeld in
      [artikel 7][ref1], en een in [artikel 8][ref2] bedoelde verklaring omtrent het gedrag van de leden van de directie
      van de instelling, en voor zover de instelling eigen examens verzorgt en [artikel 12][ref3] van toepassing is, de
      examenreglementen bedoeld in [artikel 12, eerste lid][ref4].

      3 Het bevoegd gezag van de te erkennen instelling is desgevraagd verplicht Onze Minister nadere inlichtingen te
      verstrekken.

      4 Onze Minister kan zich omtrent de kwaliteit van de cursussen van de te erkennen instelling door deskundigen doen
      voorlichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003821#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003821#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003821#Artikel12
