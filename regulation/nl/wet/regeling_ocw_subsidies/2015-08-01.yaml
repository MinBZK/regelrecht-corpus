    van de Wet op de expertisecentra, de artikelen 74, 85a, eerste en tweede lid, de artikelen 89, eerste en tweede
    lid, van de Wet op het voortgezet onderwijs, en de artikelen 2.2.3, eerste en tweede lid, 2.4.3 en 2.7 van de Wet
