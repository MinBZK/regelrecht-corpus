    text: |-
      1 In afwijking van [artikel 33d][ref1] wordt de subsidie voor het subsidietijdvak van 1 augustus 2015 tot en met
      31 december 2015 aangevraagd voor 15 augustus 2015.

      2 In afwijking van [artikel 33c][ref2] geschiedt de verantwoording over de periode van 1 augustus 2015 tot en met
      31 december 2015 overeenkomstig bij beschikking te stellen regels.

      3 De minister vermindert de subsidie voor het jaar 2016 naar evenredigheid, indien hij aan de hand van de financiële
      verslagen over het verkorte boekjaar 2015 van de kenniscentra beroepsonderwijs bedrijfsleven, het jaarverslag
      over 2015 van SBB of andere door SBB overgelegde gegevens vaststelt dat het totaal van de middelen dat door
      kenniscentra beroepsonderwijs bedrijfsleven aan SBB wordt overgedragen op grond van de overeenkomsten, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________, groter is dan:

      a. de middelen noodzakelijk voor de voorziening bedoeld in [artikel 33e][ref4],

      b. de egalisatiereserve bedoeld in het derde lid, en

      c. een bij beschikking door de minister vastgesteld bedrag, dat ten behoeve van investeringen die op korte termijn
      nodig zijn, bij wijze van bestemmingsreserve wordt aangehouden.


