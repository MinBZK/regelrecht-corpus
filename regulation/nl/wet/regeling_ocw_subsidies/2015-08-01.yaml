articles:
  - number: '1'
    text: |-
        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1],
        - *instellingssubsidie:* subsidie voor dezelfde of in hoofdzaak dezelfde voortdurende, structurele activiteiten van
      een instelling,
        - *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref2],
        - *jaarverslaggeving:* geheel van verslaggevingsdocumenten bestaande uit de jaarrekening, het jaarverslag en de
      overige gegevens, bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref3],
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap,
        - *niet-onderwijsinstelling:* natuurlijk persoon of rechtspersoon, niet zijnde een onderwijsinstelling,
        - *onderwijsinstelling:* bekostigde onderwijsinstelling waarop de [Regeling jaarverslaggeving onderwijs][ref4] van
      toepassing is,
        - *projectsubsidie:* subsidie voor tijdelijke activiteiten, die anders dan als instellingssubsidie wordt verstrekt,
        - *richtlijnen:* Richtlijnen voor de Jaarverslaggeving, zoals vastgesteld door de Raad voor de Jaarverslaggeving,
        - *SBB:* Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, bedoeld in [artikel 1.5.1 van de Web][ref5],
        - *subsidie:* instellingssubsidie of projectsubsidie,
        - *Web:* [Wet educatie en beroepsonderwijs][ref6],
        - *Wet SLOA 2013:* [Wet subsidiëring landelijke onderwijsondersteunende activiteiten 2013][ref7].


