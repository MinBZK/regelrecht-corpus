  - number: '30'
    text: |-
      1 De instellingen dienen hun subsidieaanvraag in voor 1 oktober voorafgaand aan het jaar waarop de subsidieaanvraag
      betrekking heeft.

      2 De subsidieaanvraag, bedoeld in het eerste lid, betreft de taken, genoemd
      in [artikel 2, eerste lid, onderdelen a tot en met c][ref1], onderscheidenlijk
      [artikel 3, eerste lid, onderdelen a tot en met e, van de Wet SLOA 2013][ref2].

      3 Subsidieaanvragen voor de taak, genoemd in [artikel 2, eerste lid, onderdeel d][ref3], en
      [artikel 3, eerste lid, onderdeel f, van de Wet SLOA 2013][ref4] worden voor 1 oktober voorafgaand aan het jaar
      waarop de subsidieaanvraag betrekking heeft, of voor 1 maart of voor 1 september van het lopende jaar ingediend.

      4 De minister beslist binnen 13 weken na 1 oktober onderscheidenlijk 1 maart of 1 september.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0034162#Artikel3
