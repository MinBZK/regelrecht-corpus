    text: |-
      1 Deze regeling is van toepassing op subsidieverstrekking door de minister op grond van de volgende artikelen of de
      daarop gebaseerde regelingen:

      a. de [artikelen 2][ref1] en [4 van de Wet overige OCW-subsidies][ref2],

      b. de [artikelen 2][ref3] en [3, tweede lid, van de Wet overige OCW-subsidies][ref4],

      c. [artikel 70, van de Wet op het primair onderwijs][ref5],

      d. [artikel 116, eerste lid, van de Wet op het primair onderwijs][ref6],

      e. [artikel 116, tweede lid, van de Wet op het primair onderwijs][ref7],

      f. [artikel 123, eerste lid, van de Wet op het primair onderwijs][ref8],

      g. [artikel 123, tweede lid, van de Wet op het primair onderwijs][ref9],

      h. [artikel 135, eerste lid, van de Wet op het primair onderwijs][ref10],

      i. [artikel 71 van de Wet op de expertisecentra][ref11],

      j. [artikel 113, eerste lid, van de Wet op de expertisecentra][ref12],

      k. [artikel 113, tweede lid, van de Wet op de expertisecentra][ref13],

      l. [artikel 120, eerste lid, van de Wet op de expertisecentra][ref14],

      m. [artikel 120, tweede lid, van de Wet op de expertisecentra][ref15],

      n. [artikel 129, eerste lid, van de Wet op de expertisecentra][ref16],

      o. [artikel 74 van de Wet op het voortgezet onderwijs][ref17],

      p. [artikel 85a, eerste lid, van de Wet op het voortgezet onderwijs][ref18],

      q. [artikel 85a, tweede lid, van de Wet op het voortgezet onderwijs][ref19],

      r. [artikel 89, eerste lid, van de Wet op het voortgezet onderwijs][ref20],

      s. [artikel 89, tweede lid, van de Wet op het voortgezet onderwijs][ref21],

      t. [artikel 1.5.1, derde en vierde lid, van de Wet educatie en beroepsonderwijs][ref22],

      u. [artikel 2.2.3, eerste lid, van de Wet educatie en beroepsonderwijs][ref23],

      v. [artikel 2.2.3, tweede lid, van de Wet educatie en beroepsonderwijs][ref24],

      w. [artikel 2.4.3 van de Wet educatie en beroepsonderwijs][ref25],

      x. [artikel 2.7 van de Wet educatie en beroepsonderwijs][ref26], en

      y. [artikel 2, tweede lid][ref27], en [artikel 3, tweede lid, van de Wet SLOA 2013][ref28].

      2 Deze regeling houdt tevens beleidsregels in met betrekking tot de wijze waarop de minister
      gebruik maakt van zijn bevoegdheid als bedoeld in de [artikelen 123, tweede lid][ref29], en
      [135, eerste lid, van de Wet op het primair onderwijs][ref30], de [artikelen 120, tweede lid][ref31],
      en [129, eerste lid, van de Wet op de expertisecentra][ref32] en [85a, tweede lid][ref33], en de
      [artikelen 89, tweede lid, van de Wet op het voortgezet onderwijs][ref34].

      3 Indien subsidie wordt verstrekt op grond van
      [artikel 4, eerste lid, aanhef en onder a, van de Wet overige OCW-subsidies][ref35] juncto
      [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref36] dan wel [artikel 2, tweede lid][ref37], of
      [artikel 3, tweede lid, van de Wet SLOA 2013][ref38], kan bij beschikking worden afgeweken van deze regeling.


