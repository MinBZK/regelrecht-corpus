  text: |-
    Gelet op artikel 4:81, eerste lid, van de Algemene wet bestuursrecht, de artikelen 2 en 4 van de Wet overige OCW-
    subsidies, de artikelen 70, 116, eerste en tweede lid, 123, eerste en tweede lid, en 135, eerste lid, van de Wet op
