  - number: 33f
    text: |-
      1 SBB vormt een egalisatiereserve als bedoeld in [artikel 4:72 van de Algemene wet bestuursrecht][ref1].

      2 De egalisatiereserve bedraagt ten minste € 0 en ten hoogste € 5 mln. dan wel ten hoogste een lager percentage dat
      door de minister bij de beschikking tot verlening is bepaald.

      3 De egalisatiereserve wordt uitsluitend besteed aan de taken, bedoeld in [artikel 1.5.1 van de Web][ref2].

      4 De egalisatiereserve wordt gevormd door een toevoeging bij een positief exploitatieresultaat en een onttrekking
      bij een negatief exploitatieresultaat.

      5 Voor zover het voor de toevoeging beschikbare bedrag hoger is dan de maximale toevoeging, wordt het meerdere bij
      de vaststelling in mindering gebracht op de subsidie.

      6 De regeling beleggen en belenen door instellingen voor onderwijs en onderzoek 2010 is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel472
