  - number: '3'
    text: Dit hoofdstuk is van toepassing op zowel onderwijsinstellingen als niet-onderwijsinstellingen.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel3
  - number: '4'
    text: |-
      1 Indien een aanvraag om subsidie op grond van enig wettelijk voorschrift is voorgeschreven, omvat die
      subsidieaanvraag in ieder geval een activiteitenplan en een begroting.

      2 Indien de subsidieaanvraag betrekking heeft op meer dan een jaar, omvat de aanvraag een meerjarenactiviteitenplan
      en een meerjarenbegroting.

      3 [Artikel 4:62 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel462
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:62
  - number: '5'
    text: |-
      1 Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].

      2 In geval van het niet vervullen van de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2], worden de verleende subsidiebedragen verlaagd
      tot het bedrag van de subsidie dat na de vaststelling of goedkeuring van de begroting van het Ministerie van
      Onderwijs, Cultuur en Wetenschap ter beschikking staat, een en ander naar rato van het aantal subsidieaanvragers
      aan wie subsidie is verleend en van de hoogte van de verleende subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '6'
    text: |-
      Bij terugvordering van ten onrechte betaalde subsidiebedragen of voorschotten kan de minister de subsidieontvanger
      verplichten de met de terugvordering verband houdende kosten te voldoen. Tevens kan de minister in dat geval de
      verschuldigde wettelijke rente vorderen.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel6
  - number: 6a
    text: |-
      1 In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], waarin
      het verstrekken van subsidie heeft geleid tot vermogensvorming, legt de minister een door hem te bepalen
      vergoedingsplicht op.

      2 Bij de vaststelling van de hoogte van de vergoeding worden activa gewaardeerd op hun actuele waarde. De
      waardebepaling van een onroerende zaak geschiedt door drie deskundigen. De minister en de subsidieontvanger wijzen
      elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.

      3 Het eerste lid is niet van toepassing, indien de activiteiten van de subsidieontvanger door een derde worden
      voortgezet en de activa en passiva met toestemming van de minister tegen boekwaarde aan die derde worden
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '7'
    text: |-
      [Afdeling 4.2.8 van de Algemene Wet bestuursrecht][ref1] is van toepassing op per boekjaar verstrekte subsidies die
      € 125.000 of meer bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '8'
    text: |-
      1 Indien de subsidie € 125.000 of meer bedraagt, voert de subsidieontvanger een
      administratie van aan de activiteiten verbonden uitgaven en inkomsten als bedoeld in
      [artikel 4:37, eerste lid, onderdeel b, van de Algemene wet bestuursrecht][ref1].

      2 De subsidieontvanger bewaart de administratie en de daartoe behorende bescheiden gedurende zeven jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel437
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:37
  - number: '9'
    text: |-
      1 De subsidieontvanger doet onverwijld een melding bij de minister van feiten en omstandigheden die van belang
      kunnen zijn voor de subsidieverstrekking. Bij de melding worden de stukken overgelegd die betrekking hebben op de
      gemelde feiten en omstandigheden en wordt de oorzaak van de gemelde feiten en omstandigheden toegelicht.

      2 Aan het eerste lid wordt in ieder geval toepassing gegeven indien het voor de subsidieontvanger aannemelijk is of
      had moeten zijn dat:

      a. de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zijn verricht of zullen worden
      verricht, of

      b. niet, niet tijdig of niet geheel aan de subsidieverplichtingen wordt voldaan of zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel9
  - number: '10'
    text: |-
      De subsidieontvanger werkt mee aan het tot stand komen van een overeenkomst indien dit naar het oordeel van
      de minister noodzakelijk is om te komen tot het overdragen aan de minister van rechten met betrekking tot
      intellectuele eigendom, ter zake van de gesubsidieerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel10
  - number: '11'
    text: |-
      Indien de subsidie minder dan € 25.000 bedraagt en direct wordt vastgesteld, vindt de betaling van het
      subsidiebedrag in één keer plaats.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel11
  - number: '12'
    text: Dit hoofdstuk is uitsluitend van toepassing op onderwijsinstellingen.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel12
  - number: '13'
    text: |-
      1 De verantwoording van subsidie door onderwijsinstellingen geschiedt in de jaarverslaggeving overeenkomstig de
      voorschriften, bedoeld in de [Regeling jaarverslaggeving onderwijs][ref1].

      2 Bij de verantwoording wordt onderscheid gemaakt tussen:

      a. subsidie waarbij het eventueel niet aangewende deel van de subsidie, mits de activiteiten volledig zijn
      uitgevoerd, kan worden besteed aan andere activiteiten waarvoor bekostiging wordt verstrekt,

      b. subsidie die uitsluitend mag worden aangewend voor het doel waarvoor de subsidie is verstrekt, en

      c. subsidie die ook kan worden besteed aan andere activiteiten waarvoor bekostiging wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: '14'
    text: Dit hoofdstuk is uitsluitend van toepassing op niet-onderwijsinstellingen.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel14
  - number: '15'
    text: |-
      1 Een beschikking tot subsidieverlening wordt gegeven binnen 13 weken na ontvangst van de aanvraag of, indien
      sprake is van een subsidieplafond en de verlening plaatsvindt in volgorde van rangschikking of evenredige
      verdeling, binnen 13 weken na afloop van de periode waarin aanvragen kunnen worden ingediend.

      2 De termijn, genoemd in het eerste lid, bedraagt 22 weken indien:

      a. over de aanvraag advies wordt ingewonnen,

      b. een nader onderzoek naar de aanvraag wordt ingesteld, of

      c. sprake is van cofinanciering van een door de Raad van de Europese Unie, het Europees Parlement en die Raad
      gezamenlijk of de Europese Commissie goedgekeurd programma.

      3 Indien over de aanvraag een niet bij wettelijk voorschrift voorgeschreven advies wordt ingewonnen of een nader
      onderzoek naar de aanvraag wordt ingesteld, deelt de minister dit aan de aanvrager mee.

      4 Indien de verlening mede afhankelijk is van het oordeel van een internationale beoordelingscommissie of van
      internationale peer reviews, bedraagt de termijn, genoemd in het eerste lid, 40 weken.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel15
  - number: '16'
    text: |-
      Indien de subsidie € 25.000 of meer bedraagt, vindt een aanvraag tot subsidievaststelling plaats binnen 13 weken
      na het verricht zijn van de activiteiten waarvoor de subsidie is verleend dan wel na afloop van het boekjaar, of
      binnen een bij ministeriële regeling of bij beschikking op te nemen termijn.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel16
  - number: '17'
    text: |-
      Een beschikking tot subsidievaststelling wordt gegeven:

      a. indien de subsidie minder dan € 25.000 bedraagt en direct wordt vastgesteld: binnen 13 weken na ontvangst van de
      aanvraag van de subsidie,

      b. indien de subsidie minder dan € 25.000 bedraagt en niet direct wordt vastgesteld: binnen 22 weken na de in
      de ministeriële regeling of de beschikking opgenomen datum waarop de activiteiten waarvoor de subsidie wordt
      verstrekt, moeten zijn verricht, en

      c. indien de subsidie € 25.000 of meer bedraagt: binnen 22 weken na ontvangst van de aanvraag tot vaststelling.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel17
  - number: '18'
    text: |-
      Indien de subsidie minder dan € 25.000 bedraagt, toont de subsidieontvanger op verzoek van de minister aan dat de
      activiteiten waarvoor de subsidie is verstrekt, zijn verricht en dat is voldaan aan de verplichtingen die aan de
      subsidie zijn verbonden. Bij ministeriële regeling of bij beschikking wordt aangegeven op welke wijze dit wordt
      aangetoond.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel18
  - number: '19'
    text: |-
      1 Indien de subsidie € 25.000 of meer bedraagt, toont de subsidieontvanger aan de hand van een activiteitenverslag
      aan dat de activiteiten waarvoor de subsidie is verstrekt, zijn verricht en dat is voldaan aan de aan de subsidie
      verbonden verplichtingen.

      2 Het activiteitenverslag bevat een overzicht van de werkzaamheden waarvoor subsidie is verstrekt en van de daarmee
      bereikte resultaten.

      3 De inrichting van het verslag komt overeen met de inrichting van het activiteitenplan.

      4 Het verslag bevat, voor zover van toepassing, een analyse van verschillen tussen de voorgenomen activiteiten en
      beoogde resultaten, vermeld in het activiteitenplan, en de feitelijke realisatie.

      5 Bij ministeriële regeling of bij beschikking kan worden bepaald dat de subsidieontvanger op een andere wijze
      aantoont dat de activiteiten waarvoor de subsidie is verstrekt, zijn verricht en dat is voldaan aan de aan de
      subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel19
  - number: '20'
    text: |-
      1 Indien de subsidie € 25.000 of meer bedraagt, kan bij ministeriële regeling of bij beschikking worden bepaald
      dat de subsidieontvanger op basis van een verklaring inzake werkelijke kosten en opbrengsten aantoont dat de
      activiteiten zijn verricht. In dat geval is [artikel 19][ref1] niet van toepassing en, indien de subsidie minder
      dan € 125.000 bedraagt, is [artikel 8][ref2] van overeenkomstige toepassing.

      2 In de verklaring geeft de subsidieontvanger aan:

      a. dat de activiteiten waarvoor de subsidie is verstrekt zijn verricht, voorzien van een korte toelichting,

      b. dat aan de aan de subsidie verbonden verplichtingen is voldaan,

      c. wat het totale bedrag van de gerealiseerde subsidiabele kosten is,

      d. wat, in voorkomend geval, de stand van de egalisatiereserve is,

      e. wat het totale bedrag van de gerealiseerde opbrengsten, inclusief bijdragen van derden, is, en

      f. wat het totale bedrag van de gerealiseerde eigen bijdrage is.


      [ref1]: https://wetten.overheid.nl/BWBR0028820#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028820#Artikel8
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel20
