  - number: '27'
    text: |-
      1 De minister doet de instellingen jaarlijks voor 1 maart een startbrief toekomen.

      2 De startbrief heeft betrekking op het kalenderjaar dat volgt op het jaar waarin de startbrief aan de instellingen
      wordt bekendgemaakt.

      3 De startbrief bevat in ieder geval:

      a. een nadere invulling en uitsplitsing van de taken, naar activiteiten, zoals omschreven in de [artikelen 2][ref1]
      en [3 van de Wet SLOA 2013][ref2],

      b. een financieel kader met daarin opgenomen het subsidieplafond voor de instellingen, bedoeld in
      [artikel 8, eerste lid, van de Wet SLOA 2013][ref3] en wanneer van toepassing een subsidieplafond voor de
      instellingen, bedoeld in artikel 8, tweede lid, van de Wet SLOA 2013,

      c. een planning van de subsidiecyclus.

      4 In aanvulling op [artikel 6 van de Wet SLOA 2013][ref4] kan subsidieverlening worden geweigerd indien de minister
      van oordeel is dat de aanvraag niet past binnen de startbrief.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033860#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0034162#Artikel6
