        artikel: 4:76
  - number: '22'
    text: |-
      1 Het financieel verslag, bedoeld in [artikel 21][ref1], gaat vergezeld van een verklaring omtrent de getrouwheid
      en de rechtmatigheid, afgegeven door een accountant.

      2 De subsidieontvanger bedingt bij de accountant dat deze zijn onderzoek inricht overeenkomstig het
      Controleprotocol subsidies aan niet-onderwijsinstellingen, bedoeld in [bijlage 1][ref2] bij deze regeling, tenzij
      bij de verlening anders is bepaald.

      3 In de verklaring, bedoeld in het eerste lid, geeft de accountant tevens een oordeel over de naleving door de
      subsidieontvanger van de in het controleprotocol genoemde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0028820#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028820
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel22
    references:
