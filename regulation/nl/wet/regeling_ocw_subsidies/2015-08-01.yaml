  - number: 33e
    text: |-
      1 SBB treft een voorziening voor de verplichtingen met betrekking tot gewezen personeel alsmede het beheer daarvan
      en al hetgeen daaruit voortvloeit.

      2 De hoogte van de voorziening op het moment van de aanvraag, bedoeld in [artikel 33d][ref1], staat in een
      redelijke relatie tot het specifieke doel waarvoor deze is ingesteld en heeft een directe relatie met het risico of
      met de toekomstige verplichting.

      3 Indien in enig jaar uit de subsidieaanvraag blijkt dat de stand van de voorziening hoger is dan redelijkerwijs
      noodzakelijk is voor het doel, wordt bij het verlenen van de subsidie waarop die subsidieaanvraag betrekking heeft,
      het meerdere in mindering gebracht.

      4 De minister kan aanvullende gegevens opvragen die nodig zijn om zich over het vorenstaande een juist oordeel te
      kunnen vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0028820#Artikel33d
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel33e
