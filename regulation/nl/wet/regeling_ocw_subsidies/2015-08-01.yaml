      [artikel 1.5.1, eerste lid, onderdelen a tot en met f, van de Web][ref1] in voor 1 oktober voorafgaand aan het jaar
      waarop de subsidieaanvraag betrekking heeft.

      2 De subsidieaanvraag omvat mede de stand van de voorziening, bedoeld in [artikel 33e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.5.1
