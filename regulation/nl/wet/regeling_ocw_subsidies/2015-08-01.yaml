        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028820
  - number: '23'
    text: |-
      1 Indien de subsidie minder dan € 25.000 bedraagt en niet direct wordt vastgesteld, verleent de minister de
      subsidieontvanger een voorschot van 100 procent van het subsidiebedrag.

      2 Indien de subsidie € 25.000 of meer bedraagt, geschiedt de verlening van het voorschot gelijktijdig met de
      beschikking tot subsidieverlening en bedraagt het voorschot 100 procent van het subsidiebedrag, tenzij bij
      ministeriële regeling of bij beschikking is bepaald dat het voorschot 80 procent van het subsidiebedrag bedraagt.

      3 De minister betaalt als voorschot per kwartaal een gelijk deel van het subsidiebedrag dat aan de
      subsidieontvanger is verleend.

      4 In afwijking van het tweede en derde lid kan de hoogte en de spreiding van de voorschotten bij ministeriële
      regeling of bij beschikking per tijdvak worden bepaald aan de hand van de liquiditeitsbehoefte van de
      subsidieontvanger. De liquiditeitsbehoefte volgt uit gegevens van de aanvrager of wordt ambtshalve vastgesteld door
      de minister.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel23
  - number: '24'
    text: |-
      1 Indien dat bij de subsidieverlening, in afwijking van [artikel 21][ref1], is bepaald, geschiedt de financiële
      verantwoording in de jaarverslaggeving, overeenkomstig de Voorschriften voor de jaarverslaggeving niet-
      onderwijsinstellingen, bedoeld in [bijlage 2][ref2] bij deze regeling. In dat geval geschiedt de verantwoording van
      projectsubsidies van € 125.000 of meer tevens overeenkomstig het model Verantwoording van projectsubsidies, zoals
      opgenomen in die bijlage.

      2 De subsidieontvanger bedingt bij de accountant dat deze zijn onderzoek inricht overeenkomstig het
      Controleprotocol subsidies aan niet-onderwijsinstellingen, bedoeld in [bijlage 1][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028820#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028820
