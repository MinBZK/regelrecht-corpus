  - number: '21'
    text: |-
      Indien de subsidie € 125.000 of meer bedraagt, legt de subsidieontvanger, onverminderd [artikel 19][ref1], rekening
      en verantwoording af aan de hand van een financieel verslag. [Artikel 4:76 van de Algemene wet bestuursrecht][ref2]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028820#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel476
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel21
