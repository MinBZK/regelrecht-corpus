    text: |-
      Op subsidies die voor 1 januari 2014 zijn verleend, is [artikel 22, tweede lid][ref1], niet van toepassing, tenzij
      vaststelling van die subsidie betrekking heeft op een periode die is aangevangen na 1 januari 2014.


