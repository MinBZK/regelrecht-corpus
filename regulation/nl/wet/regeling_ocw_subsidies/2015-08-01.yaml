  - number: '31'
    text: |-
      1 De instellingen leveren jaarlijks voor 15 september een voortgangsrapportage.

      2 De voortgangsrapportage heeft betrekking op het lopende jaar. Het bevat een verslag van de periode van 1 januari
      tot en met 31 augustus en een vooruitblik naar de periode van 1 september tot en met 31 december.

      3 De voortgangsrapportage bevat per activiteit zoals omschreven in de beschikking tot subsidieverlening, de
      voortgang van de activiteiten, de besteding tot dan toe, alsmede een vooruitblik ten aanzien van de activiteiten en
      besteding in de resterende periode in het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028820/2015-08-01#Artikel31
  - number: '32'
    text: |-
      1 De instellingen vormen een egalisatiereserve als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1].

      2 De egalisatiereserve bedraagt ten hoogste 10 procent van het totaal van de over het laatste kalenderjaar
      verleende subsidie dan wel ten hoogste een lager percentage dat door de minister bij de beschikking tot verlening
      is bepaald.

      3 De egalisatiereserve bedraagt ten laagste € 0.

      4 De egalisatiereserve wordt uitsluitend besteed aan de taken, bedoeld in [artikel 2][ref2] onderscheidenlijk
      [3, van de Wet SLOA 2013][ref3].

      5 De egalisatiereserve wordt gevormd door een toevoeging bij een positief eindresultaat en een onttrekking bij een
      negatief eindresultaat. Het eindresultaat is de verleende subsidie verminderd met de werkelijke kosten.

      6 Voor zover het voor de toevoeging beschikbare bedrag hoger is dan de maximale toevoeging, wordt dat bedrag bij de
      vaststelling in mindering gebracht op de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel472
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0034162#Artikel3
