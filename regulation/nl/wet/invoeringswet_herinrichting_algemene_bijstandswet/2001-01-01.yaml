---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: invoeringswet_herinrichting_algemene_bijstandswet
regulatory_layer: WET
publication_date: '2003-10-10'
valid_from: '2001-01-01'
bwb_id: BWBR0007334
url: https://wetten.overheid.nl/BWBR0007334/2001-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot de intrekking van
    de Algemene Bijstandswet en de invoering van de nieuwe Algemene bijstandswet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel1
  - number: 1.b
    text: |-
      [Algemene Bijstandswet](onbekend): de [Algemene Bijstandswet](onbekend) en de daarop berustende besluiten zoals
      deze luidden op de peildag;
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel1
  - number: 1.c
    text: |-
      [nieuwe Algemene bijstandswet][ref1]: de [Algemene bijstandswet](onbekend) en de daarop berustende besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: 1.d
    text: |-
      peilmaand: de kalendermaand voorafgaand aan de inwerkingtreding van de [nieuwe Algemene bijstandswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: 1.e
    text: |-
      peildag: de dag voorafgaand aan de inwerkingtreding van de [nieuwe Algemene bijstandswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: '2'
    text: |-
      Het toezicht op de uitvoering van [hoofdstuk II][ref1] van deze wet berust bij Onze Minister.
      [Artikel 130 van de nieuwe Algemene bijstandswet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007334#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel130
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007334
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '130'
  - number: '3'
    text: De [Algemene Bijstandswet](onbekend) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel3
  - number: '4.1'
    text: |-
      De [Algemene Bijstandswet](onbekend) blijft gedurende ten hoogste 12 maanden na de inwerkingtreding van de
      [nieuwe Algemene bijstandswet][ref1] van toepassing ten aanzien van degene die in de peilmaand recht had op
      algemene bijstand en wiens recht op de peildag niet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: '4.2'
    text: 'De in het eerste lid bedoelde toepassing van de [Algemene Bijstandswet](onbekend) eindigt:'
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
  - number: 4.2.a
    text: |-
      zodra burgemeester en wethouders in het betreffende geval naar aanleiding van het onderzoek als bedoeld in
      [artikel 5, eerste lid][ref1], een nieuw besluit hebben getroffen;


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel5
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 4.2.b
    text: |-
      zodra een wijziging van omstandigheden van de persoon of het gezin optreedt of is opgetreden die op grond van
      [hoofdstuk IV, afdeling 1, paragraaf 2 en 3, van de nieuwe Algemene bijstandswet](onbekend) tot toepassing van
      een andere bijstandsnorm dient te leiden en burgemeester en wethouders in het betreffende geval een nieuw besluit
      inzake de verlening van algemene bijstand hebben getroffen; dan wel
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
  - number: 4.2.c
    text: |-
      zodra in het betreffende geval gedurende ten minste een kalendermaand geen recht op algemene bijstand heeft
      bestaan.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
  - number: '4.3'
    text: |-
      Zolang het eerste lid van toepassing is blijven de besluiten inzake de verlening van bijstand die burgemeester
      en wethouders op grond van de [Algemene Bijstandswet](onbekend) ten aanzien van de betrokkenen hebben genomen van
      kracht.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
  - number: '4.4'
    text: |-
      Besluiten van burgemeester en wethouders op grond van de [Algemene Bijstandswet](onbekend) inzake terugvordering
      of anderszins terugbetaling van reeds verleende bijstand, inzake verhaal van reeds verleende of nog te verlenen
      bijstand en inzake borgstelling, die op de peildag van kracht zijn, blijven van kracht tot het moment waarop
      zich in het betrokken geval een zodanige wijziging van de omstandigheden voordoet of heeft voorgedaan dat een
      herziening van het besluit dient plaats te vinden. Indien bijstand is verleend met toepassing van het bepaalde
      bij of krachtens [artikel 7](onbekend) blijven bij herziening van het besluit de aan de reeds gevestigde hypotheek
      verbonden verplichtingen en bedingen van kracht.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
  - number: '4.5'
    text: |-
      Indien in een geval als bedoeld in het eerste lid bijstand is verleend met toepassing van het bepaalde bij of
      krachtens [artikel 7](onbekend) en op de peildag de hypotheek nog niet is gevestigd, wordt deze gevestigd met
      inachtneming van de krachtens artikel 20, zevende lid, van de [nieuwe Algemene bijstandswet][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: '5.1'
    text: |-
      Burgemeester en wethouders stellen tijdig ten aanzien van de in [artikel 4, eerste lid][ref1], bedoelde persoon een
      onderzoek in naar de rechtsgevolgen waartoe de toepassing van de [nieuwe Algemene bijstandswet][ref2] zal leiden
      inzake het recht op bijstand en de daaraan verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007333
  - number: '5.2'
    text: |-
      Op het onderzoek is het bepaalde bij of krachtens de [artikelen 65][ref1], [66, eerste, tweede en derde lid][ref2],
      [69][ref3], [71][ref4], [121][ref5] en [122 van de nieuwe Algemene bijstandswet][ref6] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0007333#Artikel71
      [ref5]: https://wetten.overheid.nl/BWBR0007333#Artikel121
      [ref6]: https://wetten.overheid.nl/BWBR0007333#Artikel122
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0007333
        artikel: '69'
      - id: ref4
        bwb_id: BWBR0007333
        artikel: '71'
      - id: ref5
        bwb_id: BWBR0007333
        artikel: '121'
      - id: ref6
        bwb_id: BWBR0007333
        artikel: '122'
  - number: '5.3'
    text: |-
      Uiterlijk 12 maanden na de peildag nemen burgemeester en wethouders naar aanleiding van het onderzoek een besluit
      inzake de verlening van bijstand en de daaraan verbonden verplichtingen, onder vermelding in het besluit van de
      rechtsgevolgen waartoe de toepassing van de [nieuwe Algemene bijstandswet][ref1] in het betreffende geval leidt. Op
      dit besluit is [artikel 70 van de nieuwe Algemene bijstandswet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel70
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '70'
  - number: '5.4'
    text: |-
      Indien de in het derde lid bedoelde toepassing leidt tot wijziging van de hoogte van de algemene bijstand,
      wordt in het besluit vermeld dat genoemde wijziging ingaat op het tijdstip gelegen 12 maanden na de
      peildag. Tot dat tijdstip blijft, onverminderd de algemene periodieke aanpassing van de uitkeringshoogte en
      [artikel 4, tweede lid, onderdelen ][ref1], de hoogte van de algemene bijstand gehandhaafd op het niveau waarop de
      belanghebbende onmiddellijk voorafgaande aan het onderzoek recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel4
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.5'
    text: |-
      Indien uit het onderzoek, of bij een eerdere gelegenheid na de peildag, blijkt dat omtrent de verlening
      van bijstand, gelet op [artikel 63 van de nieuwe Algemene bijstandswet][ref1], dient te worden beslist door
      burgemeester en wethouders van een andere gemeente, dragen burgemeester en wethouders zorg voor onverwijlde
      overdracht van het betreffende geval en van de daarop betrekking hebbende stukken aan burgemeester en wethouders
      van die gemeente, onder gelijktijdige melding hiervan aan de belanghebbende. Burgemeester en wethouders van de
      ontvangende gemeente nemen de verlening van bijstand onverwijld over en geven daarbij toepassing aan het eerste tot
      en met het vierde lid. [Artikel 64 van de nieuwe Algemene bijstandswet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel64
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '64'
  - number: '6.1'
    text: |-
      Ten aanzien van degene, die in de peilmaand recht had op algemene bijstand en wiens recht op de peildag
      niet is geëindigd, en voor wie voor het eerst verplichtingen, gericht op inschakeling in de arbeid in
      dienstbetrekking, aan de uitkering worden verbonden, wordt uiterlijk 3 jaar na inwerkingtreding van de nieuwe
      [Algemene bijstandswet][ref1] een onderzoek verricht als bedoeld in [artikel 66, vijfde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel66
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '66'
  - number: '6.2'
    text: |-
      Ten aanzien van degene, aan wiens uitkering op de peildag reeds voorwaarden tot inschakeling in de arbeid op
      grond van de [Algemene Bijstandswet](onbekend) zijn verbonden, kan het onderzoek, gericht op de inschakeling in de
      arbeid, achterwege blijven, tenzij burgemeester en wethouders van oordeel zijn dat een dergelijk onderzoek alsnog
      dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister kan op verzoek van burgemeester en wethouders van een gemeente de termijn, bedoeld in
      [artikel 4, eerste lid][ref1], met ten hoogste 3 maanden verlengen, indien zij aannemelijk kunnen maken dat zij
      door bijzondere omstandigheden in redelijkheid niet in staat zijn binnen deze termijn uitvoering te geven aan
      deze paragraaf. Het verzoek dient binnen zes maanden na de peildag te zijn ingediend, vergezeld van een plan
      waarin wordt aangegeven op welke wijze burgemeester en wethouders uitvoering zullen geven aan het bepaalde in
      [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel5
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Ingeval van toepassing van het eerste lid wordt in het betreffende geval bij toepassing van
      [artikel 4, eerste lid][ref1], en [artikel 5, derde en vierde lid][ref2], in plaats van "12 maanden" telkens
      gelezen: 12 maanden vermeerderd met de verlenging op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel5
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.1'
    text: |-
      Onze Minister kan de verlening van bijstand aan een Nederlander die zich in het buitenland bevindt voortzetten ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel8
  - number: 8.1.a
    text: |-
      degene die in de peilmaand bijstand ontving op grond van [artikel 82](onbekend) of [artikel 95 van de Algemene
      Bijstandswet](onbekend), welke bijstand niet is geëindigd;
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel8
  - number: 8.1.b
    text: |-
      degene die op enig moment in de periode van 26 weken onmiddellijk voorafgaand aan de peildag bijstand ontving op
      grond van [artikel 82 van de Algemene Bijstandswet](onbekend), welke bijstand in die periode is geëindigd, indien
      belanghebbende binnen 26 weken na de peildag opnieuw bijstand aanvraagt.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel8
  - number: '8.2'
    text: |-
      De in het eerste lid bedoelde bijstand wordt afgestemd op de omstandigheden, mogelijkheden en middelen van de
      belanghebbende, rekening houdend met het niveau van de noodzakelijke kosten van het bestaan ter plaatse.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel8
  - number: '8.3'
    text: |-
      De [hoofdstukken II][ref1], [III][ref2], [VII][ref3] en [VIII][ref4], alsmede [paragraaf 2 van hoofdstuk VI][ref5]
      en het bepaalde bij of krachtens de [artikelen 65][ref6], [66, eerste, tweede en derde lid][ref7], [69][ref8],
      [70, eerste en tweede lid][ref9], en [71 van de nieuwe Algemene bijstandswet][ref10] zijn, voor zover de
      omstandigheden het toelaten, van overeenkomstige toepassing, met dien verstande dat Onze Minister in de plaats
      treedt van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0007333#HoofdstukVII
      [ref4]: https://wetten.overheid.nl/BWBR0007333#HoofdstukVIII
      [ref5]: https://wetten.overheid.nl/BWBR0007333#Paragraaf2
      [ref6]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref7]: https://wetten.overheid.nl/BWBR0007333#Artikel66
      [ref8]: https://wetten.overheid.nl/BWBR0007333#Artikel69
      [ref9]: https://wetten.overheid.nl/BWBR0007333#Artikel70
      [ref10]: https://wetten.overheid.nl/BWBR0007333#Artikel71
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007333
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007333
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007333
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0007333
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0007333
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0007333
        artikel: '65'
      - id: ref7
        bwb_id: BWBR0007333
        artikel: '66'
      - id: ref8
        bwb_id: BWBR0007333
        artikel: '69'
      - id: ref9
        bwb_id: BWBR0007333
        artikel: '70'
      - id: ref10
        bwb_id: BWBR0007333
        artikel: '71'
  - number: '8.4'
    text: |-
      Zodra ten minste 26 weken zijn verstreken nadat de bijstand die werd verleend op grond van het eerste lid werd
      beëindigd, is dat lid ten aanzien van het betreffende geval niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel8
  - number: '9'
    text: |-
      Ten aanzien van degenen voor wie in de peilmaand de verlening van bijstand ter voorziening in de algemeen
      noodzakelijke kosten van het bestaan geschiedde met toepassing van artikel V, tweede of derde lid, van het Besluit
      houdende wijziging van het Bijstandsbesluit landelijke normering met betrekking tot de hoogte van de uitkering voor
      schoolverlaters van 21 tot 27 jaar en het stellen van nadere voorwaarden voor de hoogte van de uitkering op grond
      van dat besluit voor personen van 18 tot 21 jaar (*Stb.* 1992, 240) blijven genoemde artikelleden van toepassing.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel9
  - number: '10.1'
    text: |-
      [Artikel 47, eerste lid, onderdeel ][ref1] is niet van toepassing op de belanghebbende die in de peilmaand algemene
      bijstand ontving en voor wie voor de vaststelling van het recht op en de hoogte van de algemene bijstand het
      inkomen in beschouwing wordt genomen dat werd ontvangen in de periode voorafgaand aan de periode waarover het recht
      op bijstand wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel47
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '47'
  - number: '10.2'
    text: |-
      Zodra in een geval als bedoeld in het eerste lid gedurende ten minste een kalendermaand geen recht op algemene
      bijstand heeft bestaan is het eerste lid ten aanzien van dat geval niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel10
  - number: '11.1'
    text: |-
      In afwijking van [artikel 52 van de nieuwe Algemene bijstandswet][ref1] wordt voor de belanghebbende die in de
      peilmaand algemene bijstand ontving en voor wie in die maand toepassing werd gegeven aan [artikel 7, eerste lid,
      onderdeel ](onbekend), eveneens niet tot het vermogen gerekend het voor opleiding bestemde vermogen, mits voldoende
      waarborgen bestaan dat het vermogen voor deze bestemming zal worden aangewend en de bestemming zelf, gelet op alle
      omstandigheden, verantwoord moet worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel52
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '52'
  - number: '11.2'
    text: |-
      Zodra in een geval als bedoeld in het eerste lid gedurende ten minste een kalendermaand geen recht op algemene
      bijstand heeft bestaan is het eerste lid ten aanzien van dat geval niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel11
  - number: '12.1'
    text: |-
      Op een aanvraag tot het verlenen van bijstand die is ingediend voor of op de peildag en ten aanzien waarvan op die
      dag nog geen besluit is genomen, wordt beslist met toepassing van:
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel12
  - number: 12.1.a
    text: |-
      de [Algemene Bijstandswet](onbekend), behoudens [artikel 7](onbekend), indien het recht op bijstand ingaat voor of
      op de peildag;
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel12
  - number: 12.1.b
    text: |-
      de [nieuwe Algemene bijstandswet][ref1], indien het recht op bijstand ingaat na de peildag.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: '12.2'
    text: |-
      Ten aanzien van een geval als bedoeld in het eerste lid, onderdeel *a*, zijn de [artikelen 4][ref1] en [5][ref2]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel5
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.3'
    text: |-
      Ten aanzien van een geval als bedoeld in het eerste lid, onderdeel *a*, waarin sprake is van
      bijstandverlening in de vorm van geldlening onder verband van hypotheek, is het bepaalde bij en krachtens
      [artikel 20 van de nieuwe Algemene bijstandswet][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel20
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '20'
  - number: '13.1'
    text: |-
      Burgemeester en wethouders zijn bevoegd om, in afwijking van
      [artikel 73, eerste lid, van de nieuwe Algemene bijstandswet][ref1], ten aanzien van de belanghebbende die in
      de peilmaand algemene bijstand ontving en aan wie deze bijstand werd uitbetaald over een kortere periode dan een
      kalendermaand of op een eerder tijdstip dan aan het einde van de kalendermaand de genoemde wijze van betalen voort
      te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel73
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '73'
  - number: '13.2'
    text: |-
      Zodra in een geval als bedoeld in het eerste lid gedurende ten minste een kalendermaand geen recht op algemene
      bijstand heeft bestaan is het eerste lid ten aanzien van dat geval niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel13
  - number: '14.1'
    text: |-
      Op een bezwaar- of beroepschrift dat voor of op de peildag is ingediend en waarop op die datum nog niet is
      beslist, alsmede op een bezwaar- of beroepschrift dat na de peildag is ingediend en dat betrekking heeft op
      bijstandverlening waarop ingevolge [artikel 4 de Algemene Bijstandswet](onbekend) van toepassing is, wordt beslist
      met toepassing van de [Algemene Bijstandswet](onbekend).
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op verzoeken als bedoeld in [artikel 45 van
      de Algemene Bijstandswet](onbekend) en verzoeken om een voorlopige voorziening als bedoeld
      in [artikel 8:81 van de Algemene wet bestuursrecht][ref1]. Over de periode waarin ingevolge
      [artikel 4][ref2] op de bijstandverlening de [Algemene Bijstandswet](onbekend) van toepassing is, blijft
      [artikel 74 van de nieuwe Algemene bijstandswet][ref3] ten aanzien van de belanghebbende buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel74
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007333
        artikel: '74'
  - number: '15.1'
    text: |-
      Ten aanzien van de vergoeding van kosten van algemene bijstand door het Rijk, alsmede het niet aanvaardbaar
      verklaren van kosten van algemene bijstand, over tijdvakken voor of op de peildag, blijft het bepaalde bij en
      krachtens [hoofdstuk IV, paragraaf 1](onbekend) en [2](onbekend), en [artikel 81 c van de Algemene Bijstandswet]
      (onbekend) van toepassing.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel15
  - number: '15.2'
    text: |-
      [Hoofdstuk X van de nieuwe Algemene bijstandswet][ref1], zoals deze wet luidde voor de inwerkingtreding van de
      [Wet financiering Abw, IOAW en IOAZ](onbekend) is van overeenkomstige toepassing op de kosten van algemene bijstand
      verleend op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukX
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007333
        hoofdstuk: X
  - number: '18'
    text: |-
      Ten aanzien van degene die in de peilmaand recht had op uitkering op grond van de Wet inkomensvoorziening oudere
      en gedeeltelijke arbeidsongeschikte werkloze werknemers en wiens recht op de peildag niet is geëindigd zijn de
      [artikelen 4][ref1] en [5][ref2] van deze wet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel5
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20'
    text: |-
      Ten aanzien van degene die in de peilmaand recht had op uitkering op grond van de Wet inkomensvoorziening oudere
      en gedeeltelijke arbeidsongeschikte gewezen zelfstandigen en wiens recht op de peildag niet is geëindigd zijn de
      [artikelen 4][ref1] en [5][ref2] van deze wet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel5
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007334
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '56.1'
    text: |-
      Onze Minister herziet met ingang van de datum van inwerkingtreding van de [nieuwe Algemene bijstandswet][ref1]
      de in [Hoofdstuk IV van die wet][ref2] genoemde bedragen en percentages op de in [afdeling 4][ref3] van dat
      hoofdstuk voorgeschreven wijze voor zover de ontwikkeling van het netto minimumloon, de netto aanspraak op
      minimumvakantiebijslag, het prijsindexcijfer voor de gezinsconsumptie, het prijsindexcijfer voor het onderdeel
      energie daarvan, gerekend vanaf 1 januari 1992, daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Afdeling4
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0007333
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007333
        afdeling: '4'
  - number: '56.2'
    text: |-
      Onze Minister herziet met ingang van de datum van inwerkingtreding van de [nieuwe Algemene bijstandswet][ref1] de
      in [artikel 4 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2]
      en de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] genoemde
      bedragen op de in die wetten voorgeschreven wijze, voor zover de ontwikkeling van het netto minimumloon en het
      netto minimumjeugdloon gerekend vanaf 1 januari 1992 daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004163
  - number: '57'
    text: |-
      De tekst van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] en de
      tekst van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] worden
      in het *Staatsblad* geplaatst. Voor de plaatsing van deze wetten stelt Onze Minister de nummering van de artikelen
      opnieuw vast en brengt hij de in deze wetten voorkomende aanhalingen van de artikelen met de nieuwe nummering in
      overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: '58'
    text: In het belang van een goede uitvoering van het in deze wet bepaalde kan Onze Minister regels stellen.
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel58
  - number: '61'
    text: |-
      Deze wet treedt gelijktijdig met de [nieuwe Algemene bijstandswet][ref1] in werking op een bij koninklijk besluit
      te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: '62'
    text: 'Deze wet kan worden aangehaald als: "Invoeringswet herinrichting Algemene Bijstandswet"'
    url: https://wetten.overheid.nl/BWBR0007334/2001-01-01#Artikel62
