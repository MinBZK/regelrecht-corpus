  - number: '11'
    text: |-
      1 Aan een keuring van een combinatie van een geleider en een politiesurveillancehond kunnen deelnemen ambtenaren
      van politie, aangesteld voor de uitvoering van de politietaak, vanaf de rang van surveillant van politie die zijn
      aangewezen als geleider.

      2 De keuring van een combinatie van een geleider en een politiesurveillancehond geschiedt door de keuringscommissie
      voor de politiesurveillancehond op basis van het keuringsreglement voor de politiesurveillancehond, met dien
      verstande dat de leden die keuren afkomstig zijn uit een andere eenheid dan die waarin de geleider feitelijk is
      tewerkgesteld.

      3 Het keuringsreglement voor de politiesurveillancehond bevat tenminste de volgende eisen:

      a. gehoorzaamheid van de politiesurveillancehond aan de geleider;

      b. een goede samenwerking van de politiesurveillancehond met de geleider;

      c. de vaardigheid van de politiesurveillancehond in het kunnen nemen van alle hindernissen die voor een goed
      functioneren in de praktijk noodzakelijk zijn; en

      d. het vermogen van de surveillancehond om op commando van de geleider geweld tegen derden toe te passen
      respectievelijk te beëindigen.

      4 De politiesurveillancehond wordt gedurende de keuring geleid door zijn geleider.

      5 Indien de keuring niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.
    url: https://wetten.overheid.nl/BWBR0019728/2020-05-15#Artikel11
  - number: '12'
    text: |-
      1 Aan een keuring van een combinatie van een geleider en een AOT-hond kunnen deelnemen ambtenaren van politie die
      sedert tenminste twee jaar behoren tot een aanhoudings- en ondersteuningsteam en die zijn aangewezen als geleider.

      2 De keuring van een combinatie van geleider en AOT-hond geschiedt door de keuringscommissie voor de AOT-hond op
      basis van het keuringsreglement voor de AOT-hond.

      3 Het keuringsreglement voor de AOT-hond bevat ten minste de volgende eisen:

      a. volgzaamheid en gehoorzaamheid van de AOT-hond aan de geleider;

      b. het kunnen participeren in procedures temidden van de leden van het aanhoudings- en ondersteuningsteam;

      c. het onder bepaalde omstandigheden, op een bepaalde afstand, niet hoorbaar zijn;

      d. de vaardigheid van de AOT-hond in het kunnen nemen van alle hindernissen die voor een goed functioneren in de
      praktijk noodzakelijk zijn; en

      e. het vermogen van de AOT-hond om op commando van de geleider geweld tegen derden toe te passen respectievelijk
      te beëindigen.

      4 De AOT-hond wordt gedurende de keuring geleid door zijn geleider.

      5 Indien de keuring niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.
    url: https://wetten.overheid.nl/BWBR0019728/2020-05-15#Artikel12
  - number: '13'
    text: |-
      1 De desbetreffende keuringscommissie verstrekt aan de geleider politiespeurhond van de combinatie die de keuring
      met goed gevolg heeft afgelegd, respectievelijk aan de geleider politiesurveillancehond van de combinatie die de
      keuring met goed gevolg heeft afgelegd, respectievelijk aan de geleider AOT-hond van de combinatie die de keuring
      met goed gevolg heeft afgelegd een certificaat op naam van de combinatie van de geleider en de hond.

      2 Het certificaat, bedoeld in het eerste lid, heeft een geldigheidsduur van twee jaar en drie maanden te rekenen
      vanaf de datum van afgifte van het certificaat.

      3 Het certificaat, bedoeld in het eerste lid, geldt uitsluitend voor de combinatie van geleider en hond op naam
      waarvan het is afgegeven.

      4 De geleider van een politiespeurhond menselijke geur krijgt een certificaat waarop staat aangegeven voor welke
      taak de politiespeurhond is gecertificeerd:

      a. de speurtaak van de politiespeurhonden menselijke geur; of

      b. de geuridentificatietaak van de politiespeurhond menselijk geur.

      5 In buitengewone omstandigheden kan de Minister van Justitie en Veiligheid besluiten de geldigheidsduur van het
      certificaat bedoeld in het tweede lid, tijdelijk te verlengen.

      6 Ingeval de Minister van Justitie en Veiligheid gebruik maakt van zijn bevoegdheid, als bedoeld in het
      vijfde lid, draagt de voorziening voor de organisatie en administratie van keuringen, als bedoeld in
      [artikel 6, tweede lid][ref1], er zorg voor dat de verlenging van de geldigheidsduur van de certificaten
      administratief wordt verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0019728#Artikel6
