  - number: '7'
    text: |-
      1 De minister wijst rijksgecommitteerden aan voor de politiespeurhond, de politiesurveillancehond en de AOT-hond.

      2 [Artikel 6, vierde en vijfde lid][ref1], zijn van overeenkomstige toepassing op de rijksgecommitteerden voor de
      politiespeurhond, respectievelijk voor de politiesurveillancehond en voor de AOT-hond.

      3 De rijksgecommitteerden voor de politiespeurhond, respectievelijk de rijksgecommitteerden voor de
      politiesurveillancehond, respectievelijk de rijksgecommitteerden voor de AOT-hond houden toezicht op de kwaliteit
      en de objectiviteit van de keuringen en herkeuringen door de keuringscommissie voor de politiespeurhond,
      respectievelijk de keuringscommissie voor de politiesurveillancehond, respectievelijk de keuringscommissie voor de
      AOT-hond en de juiste naleving van de regels terzake.

      4 De rijksgecommitteerden rapporteren jaarlijks over hun activiteiten aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019728#Artikel6
