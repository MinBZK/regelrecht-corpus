    text: |-
      In deze regeling wordt verstaan onder:

      a. *aanhoudings- en ondersteuningsteam:* een team als bedoeld in
      [artikel 11, onder a, van het Besluit beheer politie][ref1];

      b. ambtenaar van politie: ambtenaar als bedoeld in
      [artikel 24, eerste en tweede lid, van het Besluit bewapening en uitrusting politie][ref2];

      c. AOT-hond: hond als bedoeld in [artikel 23, onder b, van het Besluit bewapening en uitrusting politie][ref3];

      d. explosieven: door de minister aangewezen springstoffen;

      e. geleider: ambtenaar van politie die toestemming heeft van de korpschef om dienst te doen met een
      politiespeurhond, politiesurveillancehond of AOT-hond;

      f. keuringsreglement: als [bijlage][ref4] opgenomen reglement op grond waarvan keuringen plaatsvinden;

      g. minister: Minister van Veiligheid en Justitie;

      h. politiespeurhond: hond als bedoeld in
      [artikel 23, onder c, van het Besluit bewapening en uitrusting politie][ref5];

      i. politiesurveillancehond: hond als bedoeld in
      [artikel 23, onder a, van het Besluit bewapening en uitrusting politie][ref6];

      j. verdovende middelen: producten vermeld op de bij de [Opiumwet][ref7] behorende [lijsten I][ref8] en [II][ref9].


