      1 Uitrusting met een politiespeurhond menselijke geur geschiedt uitsluitend voor de speurtaak of
      geuridentificatietaak, voor zover de desbetreffende politiespeurhond voor die taak is gecertificeerd.

      2 Uitrusting met een politiespeurhond verdovende middelen geschiedt uitsluitend voor het opsporen van verdovende
      middelen.

      3 Uitrusting met een politiespeurhond explosieven geschiedt uitsluitend voor het opsporen van explosieven,
      vuurwapens en munitie.

      4 Uitrusting met een politiespeurhond stoffelijke resten geschiedt uitsluitend voor het opsporen van stoffelijke
      resten van mensen.

      5 Uitrusting met een politiespeurhond brandversnellende middelen geschiedt uitsluitend voor het opsporen van
      brandversnellende middelen.
    url: https://wetten.overheid.nl/BWBR0019728/2020-05-15#Artikel3
  - number: '4'
    text: |-
      Bewapening met een politiesurveillancehond geschiedt uitsluitend bij het optreden van de surveillancedienst of de
      mobiele eenheid, bedoeld in [artikel 26 van het Besluit beheer politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel26
