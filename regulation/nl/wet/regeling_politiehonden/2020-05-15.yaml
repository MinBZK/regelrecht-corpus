      Zaken en Koninkrijksrelaties en de Minister van Justitie van 29 oktober 2003 tot aanwijzing van
      rijksgecommitteerden politiespeurhond en politiesurveillancehond en samenstelling keuringscommissies op de
      [artikelen 6, eerste lid][ref1], en [7, eerste lid][ref2], van deze regeling.


