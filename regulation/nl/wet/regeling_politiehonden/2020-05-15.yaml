  - number: '10'
    text: |-
      1 De geleider speurhond menselijke geur wordt door de keuringscommissie voor de politiespeurhond geëxamineerd met
      betrekking tot:

      a. zijn kennis met betrekking tot de veiligstelling van goederen en het afnemen van geurmonsters ten behoeve van
      een geuridentificatieproef;

      b. de factoren die van invloed zijn op het functioneren van de politiespeurhond menselijke geur; en

      c. de toepasselijke bepalingen van het [Wetboek van Strafvordering][ref1].

      2 De geleider politiespeurhond verdovende middelen wordt door de keuringscommissie voor de politiespeurhond
      geëxamineerd met betrekking tot:

      a. de bekende methoden van verbergen en verpakken van verdovende middelen;

      b. de factoren die van invloed zijn op het functioneren van de politiespeurhond verdovende middelen;

      c. de inhoud van de [Opiumwet][ref2]; en

      d. de toepasselijke bepalingen van het [Wetboek van Strafvordering][ref3].

      3 De geleider politiespeurhond explosieven wordt door de keuringscommissie voor de politiespeurhond geëxamineerd
      met betrekking tot:

      a. de bekende methoden van plaatsen, verbergen en verpakken van explosieven, wapens en munitie;

      b. de opslag en het vervoer van explosieven;

      c. de factoren die van invloed zijn op het functioneren van de politiespeurhond explosieven;

      d. de inhoud van de Wet wapens en munitie en de [Wet gevaarlijke stoffen][ref4]; en

      e. de toepasselijke bepalingen van het [Wetboek van Strafvordering][ref5].

      4 De geleider politiespeurhond stoffelijke resten wordt door de keuringscommissie voor de politiespeurhond
      geëxamineerd met betrekking tot:

      a. de theorie inzake het werken met een speurhond stoffelijke resten;

      b. factoren die van invloed zijn op het functioneren van de politiespeurhond stoffelijke resten; en

      c. toepasselijke bepalingen van het [Wetboek van strafvordering][ref6] en van de [Wet op de lijkbezorging][ref7].

      5 De geleider van de politiespeurhond geld wordt door de keuringscommissie voor de politiespeurhond geëxamineerd
      over kennis van:

      a. bankbiljetten;

      b. de zoekmogelijkheden van de politiespeurhond geld;

      c. het africhten van de politiespeurhond geld;

      d. de inzetbaarheid van de politiespeurhond geld bij opsporingsonderzoeken;

      e. de toepasselijke bepalingen van het [Wetboek van Strafvordering][ref8].

      6 De examenvragen en de examenstof worden door de keuringscommissie voor de politiespeurhond in overeenstemming met
      de rijksgecommitteerden voor de politiespeurhond vastgesteld.

      7 Indien het examen niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.


