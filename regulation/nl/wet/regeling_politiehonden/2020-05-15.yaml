  - number: '8'
    text: |-
      Voor een keuring komen in aanmerking honden die:

      a. door een gediplomeerd dierenarts gezond zijn verklaard; en

      b. ingeënt zijn tegen de in het keuringsreglement aangewezen ziekten.
    url: https://wetten.overheid.nl/BWBR0019728/2020-05-15#Artikel8
  - number: '9'
    text: |-
      1 Aan een keuring van een combinatie van een geleider en een politiespeurhond kunnen deelnemen ambtenaren van
      politie die zijn aangewezen als geleider.

      2 De keuring vindt niet plaats dan nadat de geleider politiespeurhond het examen, bedoeld in [artikel 10][ref1],
      met goed gevolg heeft afgelegd.

      3 De keuring van een combinatie van een geleider en een politiespeurhond geschiedt door de keuringscommissie voor
      de politiespeurhond op basis van het keuringsreglement voor de politiespeurhond.

      4 Het keuringsreglement voor de politiespeurhond bevat ten minste de volgende eisen:

      a. voor alle politiespeurhonden met uitzondering van de politiespeurhonden menselijke geur:

      1°. gehoorzaamheid van de politiespeurhond aan de geleider;

      2°. een goede samenwerking van de politiespeurhond met de geleider;

      3°. het niet agressief zijn ten opzichte van mensen en dieren; en

      4°. de vaardigheid van het kunnen nemen van alle hindernissen die voor een goed functioneren in de praktijk geen
      belemmering mogen zijn;

      b. voor de speurtaak van de politiespeurhonden menselijke geur:

      1°. het zelfstandig willen en kunnen zoeken van kleine en grote voorwerpen met menselijke geur;

      2°. het opsporen en lokaliseren van een persoon; en

      3°. het speuren over gecombineerde terreinen;

      c. voor de geuridentificatietaak van de politiespeurhond menselijke geur: het uitvoeren van een tweetal
      geuridentificatieproeven, zoals in het keuringsreglement omschreven;

      d. voor de politiespeurhond verdovende middelen:

      1°. het zelfstandig willen en kunnen zoeken van verdovende middelen; en

      2°. het vermogen om binnen een redelijke tijd alleen die soorten verdovende middelen, die in het keuringsreglement
      zijn aangewezen, op te sporen;

      e. voor de politiespeurhond explosieven:

      1°. het zelfstandig willen en kunnen zoeken naar explosieven, wapens en munitie; en

      2°. het vermogen om binnen redelijke tijd explosieven, wapens en munitie op te sporen en te lokaliseren;

      f. voor de politiespeurhond stoffelijke resten: het zelfstandig willen en kunnen zoeken naar stoffelijke resten
      van mensen;

      g. voor de politiespeurhond brandversnellende middelen:

      1°. het zelfstandig willen en kunnen zoeken naar brandversnellende middelen; en

      2°. het vermogen om binnen een redelijke tijd alleen die brandversnellende middelen, die in het keuringsreglement
      zijn aangewezen, op te sporen;

      h. voor de politiespeurhond geld: het zelfstandig willen en kunnen zoeken van een aantal bankbiljetten van
      verschillende soorten, verborgen bij personen, in handbagage, in kluisjes, in kasten en andere plaatsen.

      5 De politiespeurhond menselijke geur voert geuridentificatieproeven uit op de wijze waarop deze hond
      gecertificeerd zal worden.

      6 De verdovende middelen, bedoeld in het vierde lid, onderdeel d, onder 2°, worden geplaatst en verborgen in kleine
      hoeveelheden, op locaties en in verpakkingen overeenkomstig de praktijk.

      7 De politiespeurhond wordt gedurende de keuring geleid door zijn geleider.

      8 Indien de keuring niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.
      Voor een combinatie van een geleider en een politiespeurhond menselijke geur die wordt gekeurd voor de
      geuridentificatietaak bestaat de mogelijkheid van meer herkansingen.

      9 De rijksgecommitteerden voor de politiespeurhond stellen de voor de keuring en opleiding van geleiders en
      politiespeurhonden benodigde hoeveelheden verdovende middelen en explosieven vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019728#Artikel10
