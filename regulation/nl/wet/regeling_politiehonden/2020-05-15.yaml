  - number: '14'
    text: |-
      1 Een combinatie van een geleider en een politiespeurhond, respectievelijk een combinatie van een geleider en een
      politiesurveillancehond, respectievelijk een combinatie van een geleider en een AOT-hond, wordt binnen twee jaar
      na het behalen van het certificaat, bedoeld in [artikel 13][ref1], opnieuw gekeurd door de keuringscommissie voor
      de politiespeurhond, respectievelijk de keuringscommissie voor de politiesurveillancehond, respectievelijk de
      keuringscommissie voor de AOT-hond.

      2 De herkeuring van een combinatie van een geleider en een politiespeurhond vindt alleen plaats als de geleider
      aantoont dat hij sinds de laatste keuring of herkeuring jaarlijks een door de rijksgecommitteerden voor de
      politiespeurhond aangewezen bijscholingscursus heeft gevolgd.

      3 Indien de herkeuring met goed gevolg wordt afgelegd, wordt het certificaat verlengd met de duur van twee jaar en
      drie maanden.

      4 Indien de herkeuring niet met goed gevolg wordt afgelegd, kan binnen de geldigheidsduur van het certificaat een
      tweede of derde herkeuring plaatsvinden.

      5 Indien een eerste, tweede of derde herkeuring niet met goed gevolg wordt afgelegd kan het certificaat voor het
      verstrijken van de geldigheidsduur worden ingetrokken, indien het naar het oordeel van de keuringscommissie voor
      de politiespeurhond, respectievelijk de keuringscommissie voor de politiesurveillancehond, respectievelijk de
      keuringscommissie voor de AOT-hond noodzakelijk is de inzet in politiedienst van de desbetreffende combinatie van
      geleider en hond met onmiddellijke ingang te beëindigen.

      6 In buitengewone omstandigheden kan de Minister van Justitie en Veiligheid besluiten de geldigheidsduur van het
      certificaat bedoeld in het derde lid, tijdelijk te verlengen.

      7 Ingeval de Minister van Justitie en Veiligheid gebruik maakt van zijn bevoegdheid, als bedoeld in
      het zesde lid, draagt de voorziening voor de organisatie en administratie van keuringen, als bedoeld in
      [artikel 6, tweede lid][ref2], er zorg voor dat de verlenging van de geldigheidsduur van de certificaten
      administratief wordt verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0019728#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0019728#Artikel6
