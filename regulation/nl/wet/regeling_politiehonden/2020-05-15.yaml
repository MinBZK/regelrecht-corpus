  - number: '5'
    text: Bewapening met een AOT-hond geschiedt uitsluitend bij het optreden van een aanhoudings- en ondersteuningsteam.
    url: https://wetten.overheid.nl/BWBR0019728/2020-05-15#Artikel5
  - number: '6'
    text: |-
      1 Er is een keuringscommissie voor de politiespeurhond, waarvan de leden worden aangewezen door de
      rijksgecommitteerden voor de politiespeurhond. De rijksgecommitteerden bepalen voor welke keuring van geleider en
      politiespeurhond de verschillende leden van de keuringscommissie worden ingezet.

      2 Er is een keuringscommissie voor de politiesurveillancehond waarvan de leden worden aangewezen door de
      rijksgecommitteerden voor de politiesurveillancehond, bedoeld in [artikel 7][ref1]. De aanwijzing vindt plaats
      nadat het aan te wijzen lid is aangemeld bij een door de korpschef getroffen voorziening voor de organisatie en
      administratie van keuringen. Aanwijzing vindt niet plaats dan nadat het aan te wijzen lid het examen, bedoeld in
      het keuringsreglement voor de politiesurveillancehond, met goed gevolg heeft afgelegd.

      3 Er is een keuringscommissie voor de AOT-hond waarvan de leden, uit de kring van leden van de keuringscommissie
      voor de politiesurveillancehond, worden aangewezen door de rijksgecommitteerden voor de AOT-hond, bedoeld in
      [artikel 7][ref2].

      4 De leden van de keuringscommissie voor de politiespeurhond, van de keuringscommissie voor de
      politiesurveillancehond en van de keuringscommissie voor de AOT-hond zijn ambtenaar van politie. Van de
      keuringscommissie voor de politiespeurhond kunnen tevens lid zijn buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142 van het Wetboek van Strafvordering][ref3].

      5 De leden van de keuringscommissie voor de politiespeurhonden, respectievelijk de keuringscommissie voor
      de politiesurveillancehond, respectievelijk de keuringscommissie voor de AOT-hond beschikken over een ruime
      dressuur-technische ervaring en praktische politie-ervaring op het gebied van de inzet en het gebruik van de
      politiespeurhond, respectievelijk de politiesurveillancehond, respectievelijk de AOT-hond. De leden van de
      keuringscommissie voor de politiespeurhond beschikken tevens over kennis van de toepasselijke bepalingen van het
      [Wetboek van Strafvordering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019728#Artikel7
