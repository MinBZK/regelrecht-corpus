  - number: '2'
    text: |-
      1 Voor de vaststelling of een project of een andere handeling als bedoeld in
      [artikel 19d, eerste lid, van de wet][ref1], of een bestemmingsplan als bedoeld in
      [artikel 19db, eerste lid, van de wet][ref2], door het veroorzaken van stikstofdepositie op een voor stikstof
      gevoelig habitat in een Natura 2000-gebied een verslechterend of significant verstorend effect kan hebben, wordt de
      stikstofdepositie berekend met gebruikmaking van AERIUS Calculator.

      2 AERIUS Calculator wordt beheerd onder verantwoordelijkheid van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19db
