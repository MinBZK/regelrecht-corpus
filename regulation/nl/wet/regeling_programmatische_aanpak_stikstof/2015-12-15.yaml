  - number: '8'
    text: |-
      1 Degene die voornemens is een project te realiseren of een andere handeling te verrichten waarop
      [artikel 19kh, zevende lid, onderdeel a, onder 1°, van de wet][ref1] van toepassing is doet ten minste vier
      weken maar ten hoogste twee jaar voor de aanvang daarvan een melding, indien is voldaan aan elk van de volgende
      voorwaarden:

      a. 1°. het project of de andere handeling heeft betrekking op de oprichting, verandering of uitbreiding van een
      inrichting als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref2] bestemd voor landbouw, industrie
      of het gebruik van gemotoriseerde voertuigen voor wedstrijden, of

      2°. de andere handeling heeft betrekking op het plaatsen van extra landbouwhuisdieren in een inrichting als bedoeld
      in [artikel 1.1, derde lid, van de Wet milieubeheer][ref3] bestemd voor landbouw, of

      3°. het project heeft betrekking op de aanleg of wijziging van infrastructuur die uitsluitend of in hoofdzaak
      bestemd is voor gemotoriseerd weg-, spoorweg-, vaarweg- of luchtvaartverkeer, en

      b. het project of de andere handeling veroorzaakt stikstofdepositie op een voor stikstof gevoelig habitat in een
      Natura 2000-gebied die hoger is dan 0,05 mol per hectare per jaar.

      2 In afwijking van het eerste lid, aanhef, doet degene die een andere handeling als bedoeld in het eerste lid,
      onderdeel a, onder 2°, ten minste vier weken maar ten hoogste drie maanden daaraan voorafgaand een melding.

      3 De melding, bedoeld in het eerste lid, wordt gedaan bij gedeputeerde staten van de provincie waarin het project
      of de andere handeling in hoofdzaak wordt gerealiseerd, of, indien het een project of andere handeling of een
      gebied als bedoeld in [artikel 19d, vijfde lid, van de wet][ref4] betreft, bij de minister.

      4 De melding, bedoeld in het eerste lid, kan worden gedaan met gebruikmaking van AERIUS Calculator.

      5 Bij de melding, bedoeld in het eerste lid, worden de volgende gegevens verstrekt:

      a. de naam en het adres van de persoon of de rechtspersoon die de melding doet, alsmede het elektronisch adres van
      die persoon of rechtspersoon, indien de melding met behulp van AERIUS Calculator wordt gedaan;

      b. indien de melding wordt gedaan door een gemachtigde: zijn naam en adres, de machtiging, alsmede het elektronisch
      adres van die persoon of rechtspersoon, indien de melding met behulp van AERIUS Calculator wordt gedaan;

      c. indien het project of de andere handeling wordt uitgevoerd door een ander dan de aanvrager: zijn naam en adres;

      d. het adres, de kadastrale aanduiding dan wel de ligging van het project of de andere handeling;

      e. een omschrijving van de aard en de omvang van het project of de andere handeling;

      f. de omvang van de stikstofdepositie die het project of de andere handeling per hectare per kalenderjaar
      veroorzaakt op een voor stikstof gevoelig habitat in een Natura 2000-gebied en de berekening waaruit die omvang
      blijkt, en, ingeval toepassing is gegeven aan [artikel 5, vijfde lid][ref5], de gegevens ter onderbouwing van de
      bestaande activiteit;

      g. het verwachte tijdstip waarop het project of de andere handeling wordt aangevangen.

      6 Op het bepalen van de omvang van de stikstofdepositie, bedoeld in het vijfde lid, onderdeel f, is
      [artikel 5, tweede, vijfde, zesde, zevende en achtste lid][ref6], van overeenkomstige toepassing.

      7 Een aanvraag voor een toestemmingsbesluit waarin gedurende het tijdvak waarvoor het programma is
      vastgesteld ontwikkelingsruimte is toegedeeld aan een project of een andere handeling, geldt tevens als
      een melding als bedoeld in het eerste lid ten aanzien van Natura 2000-gebieden waarop het project of de
      andere handeling stikstofdepositie veroorzaakt die lager is dan of gelijk is aan de waarde, bedoeld in
      [artikel 2, eerste lid, van het Besluit grenswaarden programmatische aanpak stikstof][ref7].

      8 Het bestuursorgaan waarbij een melding is gedaan registreert de melding terstond na de ontvangst daarvan in
      AERIUS Register.


