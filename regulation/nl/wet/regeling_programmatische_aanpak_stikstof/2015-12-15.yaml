preamble:
  text: |-
    Handelende na overleg met de Minister van Defensie en gedeputeerde staten van de provincies en ten aanzien van
    artikel 6 in overeenstemming met de Minister van Defensie en gedeputeerde staten van de provincies;

    Gelet op de artikelen 19kb, 19kh, vijfde lid, 19kn, eerste lid, 19ko, vijfde lid, en 19koa, eerste en tweede lid,
    van de Natuurbeschermingswet 1998 en artikel 4.4, eerste lid, van het Besluit omgevingsrecht;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0036688/2015-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AERIUS Calculator:* rekeninstrument als bedoeld in [artikel 2][ref1], bestaande uit een softwareprogramma,
      beschikbaar op www.aerius.nl, versie 2015, en een handboek, beschikbaar op www.aerius.nl, versie 2015;
        - *AERIUS Register:* registratie-instrument als bedoeld in [artikel 7, eerste lid][ref2], beschikbaar op
      www.aerius.nl, versie 2015;
        - *minister:* Minister van Economische Zaken;
        - *programma:* programma aanpak stikstof als bedoeld in [artikel 19kg, eerste lid, van de wet][ref3];
        - *toestemmingsbesluit:* besluit als bedoeld in [artikel 19km, eerste lid, van de wet][ref4];
        - *voor stikstof gevoelig habitat in een Natura 2000-gebied:* voor stikstof gevoelig natuurlijke habitat of habitat
      van voor stikstof gevoelige soorten in een Natura 2000-gebied dat in het programma is opgenomen en waarvoor een
      instandhoudingsdoelstelling geldt;
        - *wet:* [Natuurbeschermingswet 1998][ref5].


