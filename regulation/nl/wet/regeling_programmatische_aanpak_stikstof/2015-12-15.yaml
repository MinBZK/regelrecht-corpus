  - number: '6'
    text: |-
      Als projecten of andere handelingen dan wel als categorieën van projecten of andere handelingen als bedoeld
      in [artikel 19kn, eerste lid, van de wet][ref1] zijn aangewezen de in de bijlage bij deze regeling genoemde of
      beschreven projecten of andere handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19kn
    url: https://wetten.overheid.nl/BWBR0036688/2015-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19kn
  - number: '7'
    text: |-
      1 Er is een registratie-instrument waarin gegevens worden opgenomen die betrekking hebben op de afschrijving,
      bijschrijving en reservering van ontwikkelingsruimte en op meldingen als bedoeld in [artikel 8][ref1].

      2 Bij aanvang van het programma draagt de minister er zorg voor dat de beschikbare ontwikkelingsruimte in AERIUS
      Register wordt opgenomen. Dat gebeurt ook bij wijzigingen van het programma.

      3 De registraties, bedoeld in [artikel 19ko, eerste, tweede, derde en vierde lid, van de wet][ref2], geschieden
      in AERIUS Register, terstond nadat een toestemmingsbesluit is genomen, ingetrokken of vervallen of terstond nadat
      ontwikkelingsruimte in deze regeling is gereserveerd of een reservering van ontwikkelingsruimte in deze regeling is
      gewijzigd of vervallen.

      4 AERIUS Register wordt beheerd onder verantwoordelijkheid van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0036688#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19ko
