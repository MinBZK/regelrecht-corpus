  - number: '3'
    text: |-
      De berekening van de stikstofdepositie, bedoeld in [artikel 2][ref1], ten behoeve van een project dat betrekking
      heeft op de aanleg of wijziging van een hoofdweg als bedoeld in [artikel 1 van de Tracéwet][ref2], dan wel een
      andere handeling met betrekking tot een hoofdweg, wordt beperkt tot de Natura 2000-gebieden die zijn gelegen in
      de nabijheid van het gebied dat zich uitstrekt van de voorafgaande tot en met de eerstvolgende aansluiting op het
      wegvak waar het project of de andere handeling betrekking op heeft, aangevuld met de Natura 2000-gebieden in de
      nabijheid van de wegvakken waar de toename van de weekdaggemiddelde verkeersintensiteit als gevolg van het project
      of de andere handeling ten minste 1.000 motorvoertuigen per rijrichting bedraagt. Daarbij wordt uitgegaan van het
      jaar waarin de toename van de depositie als gevolg van het project of de andere handeling het hoogst is.


      [ref1]: https://wetten.overheid.nl/BWBR0036688#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel1
