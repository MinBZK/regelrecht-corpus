    text: |-
      1 [Artikel 2][ref1] is niet van toepassing op een besluit op een aanvraag als bedoeld in
      [artikel 19km, vierde lid, van de wet][ref2] en op een verklaring of beschikking als bedoeld in
      [artikel 47b, derde lid, van de wet][ref3] waarop artikel 19km, vierde lid, van de wet van overeenkomstige
      toepassing is.

      2 [Artikel 2][ref4] is niet van toepassing op een besluit op projecten, plannen en andere handelingen als bedoeld
      in [artikel 67a van de wet][ref5].

      3 Voor de toepassing van [artikel 5, achtste lid, onderdeel b][ref6], wordt onder ‘luchthaven’ mede begrepen een
      luchtvaartterrein als bedoeld in de [Luchtvaartwet][ref7].


