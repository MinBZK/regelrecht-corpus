  - number: '4'
    text: |-
      De omvang van de ontwikkelingsruimte voor een hectare van een voor stikstof gevoelig habitat in een Natura
      2000-gebied op enig moment is de ontwikkelingsruimte die op 15 december 2015 in AERIUS Register was opgenomen,
      verminderd met de ontwikkelingsruimte die sindsdien overeenkomstig [artikel 19ko, eerste lid, van de wet][ref1]
      voor die hectare is afgeschreven en vermeerderd met de ontwikkelingsruimte die sindsdien overeenkomstig artikel
      19ko, tweede lid, van de wet voor die hectare is bijgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19ko
    url: https://wetten.overheid.nl/BWBR0036688/2015-12-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19ko
  - number: '5'
    text: |-
      1 Het bevoegd gezag stelt de omvang van de in een toestemmingsbesluit toe te delen ontwikkelingsruimte vast met
      gebruikmaking van AERIUS Calculator.

      2 De ontwikkelingsruimte die het bevoegd gezag toedeelt in een toestemmingsbesluit is gelijk aan de toename van de
      stikstofdepositie op een hectare van een voor stikstof gevoelig habitat in een Natura 2000-gebied die een project
      of andere handeling per kalenderjaar kan veroorzaken, uitgaande van het jaar waarin de depositie als gevolg van dat
      project of die andere handeling het hoogst is.

      3 In een toestemmingsbesluit dat geldig is voor onbepaalde tijd kent het bevoegd gezag ontwikkelingsruimte eenmalig
      toe voor onbepaalde tijd.

      4 Ingeval sprake is van een project of een andere handeling waarvoor toestemming wordt verleend voor een duur van
      ten hoogste vijf jaar is, in afwijking van het tweede lid, de ontwikkelingsruimte die het bevoegd gezag in het
      toestemmingsbesluit voor dat project of die handeling toedeelt gelijk aan de som van de stikstofdeposities die
      het project of de andere handeling in de onderscheiden jaren op de desbetreffende hectare kan veroorzaken, gedeeld
      door zes.

      5 Ingeval een voorgenomen project of een andere handeling bestaat uit de wijziging of uitbreiding van een bestaande
      activiteit, wordt de in het tweede lid bedoelde toename bepaald ten opzichte van:

      a. het project dat of de andere handeling die is toegestaan op grond van een vergunning als bedoeld in
      [artikel 19d, eerste lid, van de wet][ref1], een beheerplan als bedoeld in [artikel 19a van de wet][ref2] of een
      omgevingsvergunning die is verleend met toepassing van [hoofdstuk IX van de wet][ref3], indien voor dat project of
      die handeling reeds toestemming is verleend door middel van een zodanig besluit, onderscheidenlijk het project of
      de andere handeling waarvoor een melding als bedoeld in [artikel 8][ref4] is gedaan, of

      b. bij gebreke van een eerder besluit als bedoeld in onderdeel a, de bestaande activiteit en de daarbij behorende
      stikstofdepositie die ten hoogste feitelijk door die bestaande activiteit werd veroorzaakt voor 1 januari 2015, of

      c. de feitelijk veroorzaakte stikstofdepositie, bedoeld in onderdeel b, ingeval die hoger is dan de
      stikstofdepositie die is toegestaan op grond van een eerder besluit als bedoeld in onderdeel a, voor zover dat
      besluit vóór de inwerkingtreding van deze regeling is genomen.

      6 Ingeval na een besluit als bedoeld in het vijfde lid, onderdeel a, of na een melding als bedoeld in
      [artikel 8][ref5] een of meer meldingen zijn gedaan die betrekking hebben op wijzigingen van het project of de
      andere handeling waarop dat toestemmingsbesluit of de eerstgenoemde melding betrekking had, wordt de in het tweede
      lid bedoelde toename bepaald ten opzichte van het project of de andere handeling zoals dat, onderscheidenlijk die
      is gewijzigd overeenkomstig de laatste melding.

      7 De stikstofdepositie, bedoeld in het vijfde lid, onderdelen b en c, betreft de stikstofdepositie die in de periode
      van 1 januari 2012 tot en met 31 december 2014 ten hoogste werd veroorzaakt als gevolg van hetgeen daadwerkelijk
      plaatsvond binnen de kaders van een op 1 januari 2015 geldende omgevingsvergunning voor een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onderdeel e of i, van de Wet algemene bepalingen omgevingsrecht][ref6], of een op
      1 januari 2015 geldende vergunning of melding krachtens de [Wet milieubeheer][ref7] of Hinderwet.

      8 In gevallen als bedoeld in het vijfde lid, onderdelen b en c, waarin een voorgenomen project of andere handeling
      betrekking heeft op een wijziging of uitbreiding van een bestaande activiteit in opdracht van de Minister van
      Defensie, wordt de toename, bedoeld in het tweede lid, bepaald ten opzichte van de stikstofdepositie van het
      volledig operationeel gebruik:

      a. van een inrichting binnen de kaders van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel e of i, van de Wet algemene bepalingen omgevingsrecht][ref8], of een vergunning
      of melding krachtens de [Wet milieubeheer][ref9] of Hinderwet;

      b. van een militaire luchthaven, met inbegrip van burgermedegebruik, dat ingevolge de [Wet luchtvaart][ref10] is
      toegestaan;

      c. van een oefenterrein dat is toegestaan ingevolge het beheerplan, bedoeld in [artikel 19a van de wet][ref11],
      voor het Natura 2000-gebied waarin dat oefenterrein ligt.

      9 In afwijking van het vijfde lid wordt in geval een voorgenomen project of andere handeling betrekking heeft op
      de wijziging of uitbreiding van een weg, vaarweg of spoorweg, de toename, bedoeld in het tweede lid, bepaald ten
      opzichte van de stikstofdepositie als gevolg van het verkeer op het wegennet, het vaarwegennet onderscheidenlijk
      het spoorwegennet, uitgaande van de autonome ontwikkeling van dat verkeer.

      10 Toedeling van ontwikkelingsruimte in een toestemmingsbesluit kan er niet toe leiden dat de resterende
      ontwikkelingsruimte voor een hectare van een voor stikstof gevoelig habitat in een Natura 2000-gebied minder
      bedraagt dan nul.


