        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030164
        artikel: 4Aa
        paragraaf: '2'
  - number: 4b
    text: |-
      1 Een vergunninghouder kan de levering van elektriciteit of gas aan een kleinverbruiker die een natuurlijk persoon
      is niet beëindigen wegens wanbetaling indien:

      a. de kleinverbruiker binnen een redelijke termijn, in ieder geval vier weken, na een herinnering als bedoeld in
      [artikel 3, eerste lid][ref1], een bewijs overlegt dat hij heeft verzocht om schuldhulpverlening, totdat op dat
      verzoek negatief is beslist;

      b. de vordering binnen een redelijke termijn, in ieder geval vier weken, na een herinnering als bedoeld
      in [artikel 3, eerste lid][ref2], betrokken wordt bij een lopend traject van schuldhulpverlening aan de
      kleinverbruiker; of

      c. na de verstrekking van gegevens aan een instantie ten behoeve van de schuldhulpverlening, bedoeld in
      [artikel 4a, eerste lid, onderdelen a en b][ref3], nog geen vier weken zijn verstreken.

      2 Een vergunninghouder kan de levering van elektriciteit of gas aan een kleinverbruiker die een natuurlijk persoon
      is niet beëindigen wegens wanbetaling, tenzij de schuldhulpverlening aan de kleinverbruiker eindigt of indien de
      kleinverbruiker de verplichtingen ten aanzien van de schuldhulpverlening niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030164#Artikel4a
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030164
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030164
        artikel: 4a
        paragraaf: '2'
  - number: 4c
    text: |-
      1 Een vergunninghouder draagt er zorg voor dat de levering van elektriciteit of gas aan een kleinverbruiker die
      wegens wanbetaling is beëindigd, wordt hervat indien de kleinverbruiker een bewijs overlegt:

      a. dat hij heeft verzocht om schuldhulpverlening, totdat op dat verzoek negatief is beslist of totdat de
      schuldhulpverlening eindigt;

      b. dat de vordering wordt betrokken bij een lopend traject van schuldhulpverlening aan de kleinverbruiker.

      2 Een netbeheerder draagt er zorg voor dat het transport van elektriciteit of gas naar een kleinverbruikers dat is
      beëindigd, wordt hervat indien een vergunninghouder op de aansluiting bekend is.
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel4c
  - number: 4d
    text: |-
      1 Indien de netbeheerder het transport van elektriciteit of gas aan de kleinverbruiker beëindigt, of hervat
      overeenkomstig [artikel 4c, tweede lid][ref1], spant de netbeheerder zich in om in persoonlijk contact te treden
      met de kleinverbruiker teneinde deze voor het voldoen van vorderingen met een eenmalig karakter als bedoeld in
      [artikel 95cb, eerste lid, van de Elektriciteitswet 1998][ref2] of [artikel 44b, eerste lid, van de Gaswet][ref3]
      een redelijke en passende betalingsregeling aan te bieden.

      2 De betalingsregeling omvat in ieder geval afspraken over de betaling en de afwikkeling van de openstaande
      vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95cb
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel44b
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: 4c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95cb
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 44b
  - number: '5'
    text: |-
      Onverminderd de [artikelen 1a][ref1] en [2][ref2], beëindigt een netbeheerder of vergunninghouder het transport
      van elektriciteit of gas naar respectievelijk de levering van elektriciteit of gas aan een kwetsbare consument niet
      wegens wanbetaling indien de kwetsbare consument binnen een redelijke termijn een verklaring van een arts, die geen
      behandelend arts van de betrokkene is, kan overleggen om de zeer ernstige gezondheidsrisico’s aan te tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel2
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030164
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      Een netbeheerder of een vergunninghouder draagt er zorg voor dat het transport van elektriciteit of gas naar of
      de levering van elektriciteit of gas aan een kwetsbare consument die wegens wanbetaling is beëindigd, wordt hervat
      indien de kwetsbare consument een verklaring van een arts die geen behandelend arts van de betrokkene is overlegt
      om de zeer ernstige gezondheidsrisico’s aan te tonen.
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel6
  - number: '11'
    text: |-
      De doorlaatwaarde van het transport van elektriciteit naar of de levering van elektriciteit aan een kleinverbruiker
      wordt niet op afstand beperkt door middel van de meetinrichting, tenzij de kleinverbruiker in het kader van een
      testsituatie hier schriftelijk toestemming voor heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel11
  - number: '12'
    text: |-
      Indien een op afstand uitleesbare meetinrichting op verzoek van de kleinverbruiker niet op afstand wordt
      uitgelezen, wordt het transport van elektriciteit of gas naar of de levering van elektriciteit of gas aan de
      kleinverbruiker niet op afstand beëindigd door middel van de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel12
  - number: '13'
    text: |-
      De [Regeling afsluiten elektriciteit en gas van kleinverbruikers][ref1] wordt ingetrokken, met dien verstande dat
      die regeling van toepassing blijft voor alle overeenkomsten, vorderingen en geschillen die betrekking hebben op
      de beëindiging van het transport van elektriciteit of gas naar of de levering van elektriciteit of gas aan een
      kleinverbruiker in de periode vanaf inwerkingtreding van die regeling tot 1 juli 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0020577
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020577
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van 1 oktober 2011, met uitzondering van artikel 11 dat op 1 juli 2011
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling afsluitbeleid voor kleinverbruikers van elektriciteit en gas.'
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel15
