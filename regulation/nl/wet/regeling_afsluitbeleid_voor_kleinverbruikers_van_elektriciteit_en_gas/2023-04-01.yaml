        artikel: '48'
  - number: 1a
    text: |-
      Een netbeheerder of vergunninghouder beëindigt het transport van elektriciteit of gas naar respectievelijk de
      levering van elektriciteit of gas aan een kleinverbruiker niet, tenzij:

      a. de kleinverbruiker hierom verzoekt;

      b. er sprake is van fraude of misbruik door de kleinverbruiker;

      c. de onveiligheid van de installatie beëindiging van het transport noodzakelijk maakt;

      d. op de aansluiting van de kleinverbruiker bij de netbeheerder geen vergunninghouder bekend is;

      e. door de vergunninghouder op grond van de [artikelen 2][ref1], [4b][ref2] of [5][ref3] de levering van
      elektriciteit of gas wegens wanbetaling kan worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel4b
      [ref3]: https://wetten.overheid.nl/BWBR0030164#Artikel5
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030164
        artikel: 4b
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030164
        artikel: '5'
        paragraaf: '3'
  - number: '2'
    text: |-
      1 Een vergunninghouder beëindigt de levering van elektriciteit of gas aan een kleinverbruiker niet wegens
      wanbetaling, tenzij aan de procedurele vereisten van de [artikelen 3][ref1], [4Aa][ref2] en [4a][ref3] wordt
      voldaan.

      2 Voor de toepassing van deze paragraaf wordt onder vordering tevens begrepen: de vordering van de netbeheerder
      inzake de kosten voor het transport van elektriciteit of gas.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel4Aa
      [ref3]: https://wetten.overheid.nl/BWBR0030164#Artikel4a
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030164
        artikel: 4Aa
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030164
        artikel: 4a
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Indien een kleinverbruiker niet binnen de gestelde termijn een vordering tot betaling van een vergunninghouder
      voldoet, verstrekt de desbetreffende vergunninghouder de kleinverbruiker ten minste driemaal een schriftelijke
      herinnering met een nakomingstermijn van ten minste veertien dagen.

      2 De vergunninghouder:

      a. wijst de kleinverbruiker bij die herinnering op de mogelijkheid om een betalingsregeling te treffen en daarover
      in contact te treden;

      b. wijst de kleinverbruiker bij die herinnering op de mogelijkheden voor schuldhulpverlening;

      c. biedt bij de herinnering aan met schriftelijke toestemming van de kleinverbruiker de contactgegevens van de
      kleinverbruiker, diens klantnummer, en informatie over de hoogte van diens schuld aan een instantie ten behoeve van
      schuldhulpverlening te verstrekken, tenzij de kleinverbruiker geen natuurlijk persoon is;

      d. vermeldt bij de herinnering dat de levering aan de kleinverbruiker niet wordt beëindigd indien de
      [artikelen 2][ref1], [4b][ref2] of [5][ref3] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel4b
      [ref3]: https://wetten.overheid.nl/BWBR0030164#Artikel5
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030164
        artikel: 4b
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030164
        artikel: '5'
        paragraaf: '3'
  - number: '4'
    text: |-
      De vergunninghouder spant zich tot het uiterste in om, zo nodig herhaaldelijk en via diverse communicatiekanalen,
      in persoonlijk contact te treden met de kleinverbruiker teneinde deze te wijzen op mogelijkheden om
      betalingsachterstanden te voorkomen en te beëindigen.
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel4
  - number: 4Aa
    text: |-
      1 Onverminderd [artikel 4][ref1], biedt de vergunninghouder de kleinverbruiker een redelijke en passende
      betalingsregeling aan. De betalingsregeling omvat in ieder geval afspraken over de betaling en de afwikkeling van
      de openstaande vorderingen.

      2 De vergunninghouder beëindigt de levering van elektriciteit of gas aan een kleinverbruiker niet wegens
      wanbetaling indien een betalingsregeling wordt overeengekomen en nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel4
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel4Aa
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '4'
        paragraaf: '2'
  - number: 4a
    text: |-
      1 In geval van wanbetaling door een kleinverbruiker die een natuurlijk persoon is, verstrekt de
      vergunninghouder aan een instantie ten behoeve van schuldhulpverlening de informatie bedoeld in
      het tweede lid, indien de kleinverbruiker heeft ingestemd met, of niet heeft gereageerd op, het in
      [artikel 3, tweede lid, onderdeel c][ref1], bedoelde aanbod tot gegevensverstrekking aan een instantie ten behoeve
      van schuldhulpverlening, indien:

      a. er ten minste twee termijnbedragen niet zijn voldaan, de vergunninghouder ten minste twee schriftelijke
      herinneringen aan de kleinverbruiker heeft verstuurd en er geen betalingsregeling als bedoeld in
      [artikel 4Aa, eerste lid][ref2], is overeengekomen;

      b. de betalingsachterstand aanmerkelijk hoger is geworden;

      c. de vergunninghouder voornemens is om de levering te beëindigen, tenminste twintig werkdagen voorafgaand aan het
      indienen van de eindeleveringsmelding bij de regionale netbeheerder en niet eerder dan nadat de nakomingstermijn
      van de derde herinnering is verstreken.

      2 De vergunninghouder verstrekt aan de instantie, bedoeld in het eerste lid:

      a. de contactgegevens van de kleinverbruiker, diens klantnummer en informatie over de hoogte van diens schuld;

      b. informatie over de ontwikkeling van de betalingsachterstand;

      c. voor zover van toepassing het voornemen om de levering te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel4Aa
    url: https://wetten.overheid.nl/BWBR0030164/2023-04-01#Artikel4a
    references:
