        artikel: '48'
  - number: '2'
    text: |-
      1 Een netbeheerder beëindigt het transport van elektriciteit of gas naar een kleinverbruiker niet wegens
      wanbetaling voordat de in de [artikelen 3, eerste lid][ref1], en [4][ref2] beschreven procedure is gevolgd.

      2 Een vergunninghouder beëindigt de levering van elektriciteit of gas aan een kleinverbruiker niet wegens
      wanbetaling voordat de in de [artikelen 3][ref3] en [4][ref4] beschreven procedure is gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0030164#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0030164#Artikel4
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel2
    references:
      - id: ref1
