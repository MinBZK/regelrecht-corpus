      - id: ref2
        bwb_id: BWBR0030164
        artikel: '8'
        paragraaf: '4'
  - number: '4'
    text: |-
      De netbeheerder of de vergunninghouder spant zich in om in persoonlijk contact te treden met de kleinverbruiker
      teneinde deze te wijzen op mogelijkheden om betalingsachterstanden te voorkomen en te beëindigen.
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel4
  - number: 4a
    text: |-
      Indien een kleinverbruiker niet heeft gereageerd op het in [artikel 3, tweede lid, onderdeel b][ref1], bedoelde
      aanbod verstrekt de vergunninghouder de contactgegevens van de kleinverbruiker, diens klantnummer en informatie
      over de hoogte van diens schuld aan een instantie ten behoeve van schuldhulpverlening, tenzij de kleinverbruiker
      geen natuurlijk persoon is.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel3
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      Een netbeheerder of vergunninghouder beëindigt het transport van elektriciteit of gas naar of de levering van
      elektriciteit of gas aan een kwetsbare consument niet, tenzij:

      a. de kwetsbare consument hierom verzoekt;

      b. er sprake is van fraude of misbruik door de kwetsbare consument;

      c. de onveiligheid van de installatie beëindiging van het transport noodzakelijk maakt;

      d. de overeenkomst voor de levering van elektriciteit of gas van de kwetsbare consument met de leverancier afloopt;

      e. op de aansluiting van de kwetsbare consument bij de netbeheerder geen vergunninghouder bekend is;

      f. er sprake is van wanbetaling en de kwetsbare consument niet binnen een redelijke termijn een verklaring van
      een arts die geen behandelend arts van de betrokkene is kan overleggen om de zeer ernstige gezondheidsrisico’s aan
      te tonen.
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel5
  - number: '6'
    text: |-
      Een netbeheerder of een vergunninghouder draagt er zorg voor dat het transport van elektriciteit of gas naar of
      de levering van elektriciteit of gas aan een kwetsbare consument die wegens wanbetaling is beëindigd, wordt hervat
      indien de kwetsbare consument een verklaring van een arts die geen behandelend arts van de betrokkene is overlegt
      om de zeer ernstige gezondheidsrisico’s aan te tonen.
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd de [artikelen 2 tot en met 6][ref1], is deze paragraaf van toepassing in de periode van 1 oktober tot
      1 april van enig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel2
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '2'
        paragraaf: '2'
  - number: '8'
    text: |-
      1 Een netbeheerder of vergunninghouder beëindigt het transport van elektriciteit of gas naar of de levering van
      elektriciteit of gas aan een kleinverbruiker niet, tenzij:

      a. de kleinverbruiker hierom verzoekt;

      b. er sprake is van fraude of misbruik door de kleinverbruiker;

      c. de onveiligheid van de installatie beëindiging van het transport noodzakelijk maakt;

      d. op de aansluiting van de kleinverbruiker bij de netbeheerder geen vergunninghouder bekend is;

      e. de overeenkomst voor de levering van elektriciteit of gas van de kleinverbruiker met de leverancier afloopt;

      f. op grond van het tweede lid de levering of op grond van het derde lid het transport van elektriciteit of gas
      wegens wanbetaling kan worden beëindigd.

      2 Een vergunninghouder kan de levering van elektriciteit of gas aan een kleinverbruiker beëindigen wegens
      wanbetaling, tenzij:

      a. de kleinverbruiker binnen een door de vergunninghouder vast te stellen redelijke termijn na de herinnering,
      bedoeld in [artikel 3, eerste lid][ref1], een bewijs overlegt dat hij heeft verzocht om schuldhulpverlening, totdat
      op dat verzoek negatief is beslist;

      b. de vordering van de vergunninghouder binnen een redelijke termijn betrokken wordt bij een lopend traject van
      schuldhulpverlening aan de kleinverbruiker;

      c. toepassing dient te worden gegeven aan [artikel 4a][ref2] en binnen een redelijke termijn nadat toepassing is
      gegeven aan artikel 4a de vordering van de vergunninghouder is betrokken bij een traject van schuldhulpverlening.

      3 Een netbeheerder kan het transport van elektriciteit of gas beëindigen wegens wanbetaling tenzij de vordering
      van de netbeheerder binnen een redelijke termijn betrokken wordt bij een lopend traject van schuldhulpverlening aan
      de kleinverbruiker.

      4 De uitzonderingsgronden, bedoeld in het tweede lid, onderdelen a en b, en het derde lid, zijn niet van toepassing
      indien de schuldhulpverlening aan de kleinverbruiker eindigt of indien de kleinverbruiker de verplichtingen ten
      aanzien van de schuldhulpverlening niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel4a
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030164
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030164
        artikel: 4a
        paragraaf: '2'
  - number: '10'
    text: |-
      1 Een vergunninghouder draagt er zorg voor dat de levering van elektriciteit of gas aan een kleinverbruiker die
      wegens wanbetaling is beëindigd, wordt hervat indien de kleinverbruiker een bewijs overlegt:

      a. dat hij heeft verzocht om schuldhulpverlening, totdat op dat verzoek negatief is beslist of totdat de
      schuldhulpverlening eindigt;

      b. dat de vordering van de vergunninghouder wordt betrokken bij een lopend traject van schuldhulpverlening aan
      de kleinverbruiker.

      2 Een netbeheerder draagt er zorg voor dat het transport van elektriciteit of gas naar een kleinverbruikers dat
      wegens wanbetaling is beëindigd, wordt hervat indien de kleinverbruiker een bewijs overlegt dat de vordering van de
      netbeheerder wordt betrokken bij een lopend traject van schuldhulpverlening aan de kleinverbruiker.
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel10
  - number: '11'
    text: |-
      De doorlaatwaarde van het transport van elektriciteit naar of de levering van elektriciteit aan een kleinverbruiker
      wordt niet op afstand beperkt door middel van de meetinrichting, tenzij de kleinverbruiker in het kader van een
      testsituatie hier schriftelijk toestemming voor heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel11
  - number: '12'
    text: |-
      Indien een op afstand uitleesbare meetinrichting op verzoek van de kleinverbruiker niet op afstand wordt
      uitgelezen, wordt het transport van elektriciteit of gas naar of de levering van elektriciteit of gas aan de
      kleinverbruiker niet op afstand beëindigd door middel van de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel12
  - number: '13'
    text: |-
      De [Regeling afsluiten elektriciteit en gas van kleinverbruikers][ref1] wordt ingetrokken, met dien verstande dat
      die regeling van toepassing blijft voor alle overeenkomsten, vorderingen en geschillen die betrekking hebben op
      de beëindiging van het transport van elektriciteit of gas naar of de levering van elektriciteit of gas aan een
      kleinverbruiker in de periode vanaf inwerkingtreding van die regeling tot 1 juli 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0020577
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020577
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van 1 oktober 2011, met uitzondering van artikel 11 dat op 1 juli 2011
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling afsluitbeleid voor kleinverbruikers van elektriciteit en gas.'
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel15
