preamble:
  text: |-
    Gelet op artikel 95b, achtste en elfde lid, van de Elektriciteitswet 1998 en artikel 44, achtste lid, van de
    Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *kleinverbruiker:* een afnemer als bedoeld in [artikel 95a, eerste lid, van de Elektriciteitswet 1998][ref1] of
      [artikel 43, eerste lid, van de Gaswet][ref2];
        - *kwetsbare consument:* een kleinverbruiker voor wie de beëindiging van het transport of de levering van
      elektriciteit of gas zeer ernstige gezondheidsrisico’s tot gevolg zou hebben voor de kleinverbruiker of huisgenoten
      van de kleinverbruiker;
        - *schuldhulpverlening:* de toepassing van de schuldsaneringsregeling natuurlijke personen, bedoeld in
      [titel III van de Faillissementswet][ref3] of ondersteuning van natuurlijke personen door een instantie als bedoeld
      in [artikel 48, eerste lid, van de Wet op het consumentenkrediet][ref4] bij het vinden van een adequate oplossing
      voor schuldsituaties gericht op de aflossing van schulden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0001860
      [ref4]: https://wetten.overheid.nl/BWBR0004815#Artikel48
