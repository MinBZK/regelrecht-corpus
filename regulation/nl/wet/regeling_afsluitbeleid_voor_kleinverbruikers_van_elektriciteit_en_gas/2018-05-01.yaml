      - id: ref4
        bwb_id: BWBR0030164
        artikel: '4'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Indien een kleinverbruiker niet binnen de gestelde termijn een vordering tot betaling van een netbeheerder of
      een vergunninghouder voldoet, doet de desbetreffende netbeheerder of vergunninghouder de kleinverbruiker ten minste
      eenmaal een schriftelijke herinnering daaromtrent toekomen.

      2 De vergunninghouder:

      a. wijst de kleinverbruiker bij die herinnering op de mogelijkheden voor schuldhulpverlening;

      b. biedt bij de herinnering aan met schriftelijke toestemming van de kleinverbruiker de contactgegevens van de
      kleinverbruiker, diens klantnummer, en informatie over de hoogte van diens schuld aan een instantie ten behoeve van
      schuldhulpverlening te verstrekken, tenzij de kleinverbruiker geen natuurlijk persoon is;

      c. vermeldt bij de herinnering dat de levering aan de kleinverbruiker niet wordt beëindigd indien de
      [artikelen 5][ref1] of [8][ref2] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030164#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030164#Artikel8
    url: https://wetten.overheid.nl/BWBR0030164/2018-05-01#Artikel3
    references:
      - id: ref1
