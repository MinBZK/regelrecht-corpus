  - number: '2'
    text: |-
      1 Een erkenning kan worden verleend aan een natuurlijk persoon of rechtspersoon die exploitant is van een
      productieplaats en die is gevestigd in de Europese Unie of in een staat die partij is bij het Verdrag inzake de
      Europese economische ruimte.

      2 Per productieplaats wordt slechts één erkenning afgegeven.

      3 Een erkenning kan slechts worden verleend voor een productieplaats die zich bevindt in de Europese Unie of
      in een staat die partij is bij het Verdrag inzake de Europese economische ruimte en die voldoet aan de in de
      [artikel 3][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel3
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011082
        artikel: '3'
        hoofdstuk: '2'
  - number: '3'
    text: |-
      1 Het productieproces geschiedt in een overdekte, behoorlijk af te sluiten en goed verlichte ruimte die voorzien is
      van passende verwarming. In deze ruimte bevindt zich een afsluitbare kast dan wel een gelijkwaardige voorziening,
      waarin halffabrikaten en kentekenplaten, met inbegrip van afgekeurde blanco-kentekenplaten en afgekeurde
      kentekenplaten, afgesloten en gescheiden kunnen worden bewaard.

      2 Er is een ruimte aanwezig dan wel een gelijkwaardige voorziening waarin de administratie ter zake van de
      productie en de afgifte van kentekenplaten behoorlijk kan worden uitgevoerd. Onder een gelijkwaardige voorziening
      kan ook de mogelijkheid van het elektronisch opslaan van gegevens worden verstaan.

      3 In de productieplaats zijn een matrijzenset, een pers, een apparaat waarmee een keurmerk kan worden aangebracht
      en een hotprintmachine of verfwals als hulpmiddel aanwezig. Deze hulpmiddelen zijn deugdelijk en in goede staat
      van onderhoud.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel3
  - number: '4'
    text: Voor de aanvraag van een erkenning wordt gebruik gemaakt van een door de Dienst Wegverkeer vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel4
  - number: '5'
    text: |-
      De aanvrager van een erkenning legt bij de aanvraag de volgende bescheiden over:

      a. een uittreksel uit het handelsregister, als bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1], dan
      wel, bij vestiging buiten Nederland, een gelijkwaardig document afgegeven in het land van vestiging, waaruit blijkt
      dat de aanvrager kentekenplaten fabriceert, welk bewijs niet ouder mag zijn dan een maand, en

      b. een testrapport van een door de Dienst Wegverkeer aangewezen onderzoeksinstelling, waaruit
      blijkt, dat de aanvrager kentekenplaten kan produceren, die voldoen aan de eisen, gesteld in de
      [Regeling kentekens en kentekenplaten][ref2] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009071
      [ref3]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009071
      - id: ref3
        bwb_id: BWBR0012172
  - number: '6'
    text: |-
      1 Bij de aanvraag van de erkenning wordt een organogram overgelegd, waarin ten minste zijn vermeld:

      a. de functies waarbinnen verantwoordelijkheid wordt gedragen voor de naleving van de voorschriften in de
      [artikelen 14 tot en met 23b][ref1] en van de algemene voorwaarden voor procesbeheersing;

      b. de personen die verantwoordelijk zijn voor de naleving van de voorschriften in de
      [artikelen 14 tot en met 23b][ref2] en van de algemene voorwaarden voor procesbeheersing; en

      c. de plaatsvervangers van de onder b bedoelde personen, tenzij is vastgelegd dat bij afwezigheid van één of meer
      van deze personen de desbetreffende werkzaamheden niet worden uitgevoerd.

      2 Er wordt voorts een beschrijving overgelegd van de procedures met betrekking tot: de naleving van de
      voorschriften in de [artikelen 14 tot en met 23b][ref3] en van de algemene voorwaarden voor procesbeheersing.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011082#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011082#Artikel14
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011082
        artikel: '14'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011082
        artikel: '14'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0011082
        artikel: '14'
        hoofdstuk: '4'
  - number: 6a
    text: |-
      De aanvrager van de erkenning beschikt over voor de erkenning door de Dienst Wegverkeer goedgekeurde
      datacommunicatieapparatuur, geschikt voor communicatie in een door de Dienst Wegverkeer geaccepteerd netwerk.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel6a
  - number: '7'
    text: |-
      Indien aan de aanvrager van een erkenning eerder een erkenning is verleend, die op grond van artikel 70f, tweede
      lid, van de wet is ingetrokken, kan, onverminderd het bepaalde in artikel 70d, derde lid, van de wet, door de
      Dienst Wegverkeer worden bepaald dat van onderdelen van [hoofdstuk 3][ref1] kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011082
        hoofdstuk: '3'
  - number: '8'
    text: |-
      Wijzigingen ten aanzien van de in [artikel 6][ref1] beschreven organisatiestructuur, verantwoordelijkheden en
      procedures worden vooraf bij de Dienst Wegverkeer aangemeld, evenals overige wijzigingen die voor de erkenning van
      belang kunnen zijn. De door de Dienst Wegverkeer hieromtrent gegeven aanwijzingen worden in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel6
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011082
        artikel: '6'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      1 De erkenninghouder draagt zorg voor een zodanige behandeling van blanco-kentekenplaten en kentekenplaten
      dat beschadiging of achteruitgang wordt voorkomen. Deze zorg strekt zich uit tot en met de aflevering van de
      kentekenplaten op de plaats van bestemming.

      2 In afwachting van gebruik of aflevering maakt de erkenninghouder gebruik van aangewezen afsluitbare opslag-
      of voorraadruimten om beschadiging, diefstal of achteruitgang van blanco-kentekenplaten en kentekenplaten te
      voorkomen.

      3 De erkenninghouder voorkomt onbedoeld gebruik van blanco-kentekenplaten en kentekenplaten.

      4 In geval van diefstal van blanco-kentekenplaten stelt de erkenninghouder de Dienst Wegverkeer hiervan terstond op
      de hoogte.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel9
  - number: 10a
    text: |-
      Vanaf de buitenkant van het bedrijf is op een door de Dienst Wegverkeer vastgestelde en in de Staatscourant
      bekendgemaakte wijze zichtbaar dat de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel10a
  - number: '11'
    text: |-
      Een productieplaats waarvoor de erkenning geldt moet voortdurend blijven voldoen aan de in de [artikelen 2][ref1]
      en [3][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011082#Artikel3
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011082
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011082
        artikel: '3'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      De erkenninghouder is ervoor verantwoordelijk, dat het bij de productie en aflevering betrokken personeel op de
      hoogte is van de op de productie en aflevering toepasselijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel12
  - number: '13'
    text: |-
      De erkenninghouder dient te allen tijde te kunnen aangeven waar de in ontvangst genomen blanco-kentekenplaten en de
      kentekenplaten, die nog niet zijn afgeleverd, zich bevinden.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel13
  - number: '14'
    text: |-
      1 De erkenninghouder verricht de productie met inachtneming van de [Regeling kentekens en kentekenplaten][ref1] en
      de [Regeling eisen goedkeuring kentekenplaten 2000][ref2].

      2 De fabricage van kentekenplaten vindt slechts plaats in de productieplaats waarvoor de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
  - number: '15'
    text: |-
      1 De erkenninghouder neemt uitsluitend blanco-kentekenplaten in ontvangst van een erkende lamineerder,
      die zijn voorzien van het door de lamineerder aangebrachte waarmerk, indien dat is voorgeschreven. De
      erkenninghouder meldt binnen één week na de ontvangst van blanco-kentekenplaten, die op grond van de
      [Regeling kentekens en kentekenplaten][ref1] voorzien zijn van een lamineercode, bij de Dienst Wegverkeer op een
      door deze dienst te bepalen wijze, de volgende gegevens:

      a. de lamineercodes;

      b de hoeveelheid blanco-kentekenplaten;

      c. de soort, de kleur en het model van de blanco-kentekenplaten;

      d. de lamineerder die de blanco-kentekenplaten heeft geleverd.

      2 Onverminderd [artikel 23a][ref2], mag een erkenninghouder geen blanco-kentekenplaten doorleveren aan een andere
      erkenninghouder.


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0011082#Artikel23a
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0011082
        artikel: 23a
        hoofdstuk: '4'
  - number: '17'
    text: |-
      1 De erkenninghouder maakt de blanco-kentekenplaten die beschadigd zijn, dan wel niet aan de eisen van de
      [Regeling kentekens en kentekenplaten][ref1] of de [Regeling eisen goedkeuring kentekenplaten 2000][ref2] voldoen
      binnen één week na constatering onbruikbaar door deze op zodanige wijze doormidden te knippen dat de lamineercode
      goed leesbaar blijft.

      2 Indien de erkenninghouder blanco-kentekenplaten, die op grond van de [Regeling kentekens en kentekenplaten][ref3]
      voorzien zijn van een lamineercode, retourneert, meldt deze bij de Dienst Wegverkeer, op de door deze dienst te
      bepalen wijze, de volgende gegevens:

      a. de lamineercodes;

      b. de hoeveelheid blanco-kentekenplaten;

      c. de soort, de kleur en het model van de blanco-kentekenplaten;

      d. de lamineerder die de blanco-kentekenplaten heeft geleverd.

      3 Indien de erkenninghouder blanco-kentekenplaten, die voorzien behoren te zijn van een lamineercode, onbruikbaar
      maakt, meldt deze bij de Dienst Wegverkeer, op een door deze dienst te bepalen wijze, de volgende gegevens:

      a. de lamineercodes;

      b. de hoeveelheid blanco-kentekenplaten;

      c. de soort, de kleur en het model van de blanco-kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
      [ref3]: https://wetten.overheid.nl/BWBR0009071
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
      - id: ref3
        bwb_id: BWBR0009071
  - number: '18'
    text: |-
      1 Alvorens de erkenninghouder overgaat tot aflevering van kentekenplaten controleert hij of deze voldoen aan de
      in de [Regeling kentekens en kentekenplaten][ref1] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref2]
      gestelde eisen.

      2 De erkenninghouder maakt de kentekenplaten die niet aan de eisen voldoen binnen één week na de controle
      onbruikbaar door deze op zodanige wijze doormidden te knippen dat de lamineercode goed leesbaar blijft. De
      erkenninghouder meldt met betrekking tot deze kentekenplaten, die voorzien behoren te zijn van een lamineercode,
      bij de Dienst Wegverkeer, op een door deze dienst te bepalen wijze, de volgende gegevens:

      a. de lamineercodes;

      b. de hoeveelheid blanco-kentekenplaten;

      c. de soort, de kleur en het model van de blanco-kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
  - number: '19'
    text: |-
      De erkenninghouder bewaart de twee helften van de afgekeurde blanco-kentekenplaten of kentekenplaten waarop de
      laatste tien meldingen, bedoeld in de [artikelen 17, derde lid][ref1], of [18, tweede lid, tweede volzin][ref2],
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011082#Artikel18
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011082
        artikel: '17'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011082
        artikel: '18'
        hoofdstuk: '4'
  - number: '20'
    text: |-
      1 De erkenninghouder geeft donkerblauwe kentekenplaten en kentekenplaten volgens de modellen 18.2A tot en met
      18.2E, 27.1A tot en met 27.2H, 27.10A tot en met 27.26E en 27.30A tot en met 27.31E en 30.1A tot en met 30.16 van
      de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend) slechts af aan degene die de in de Regeling
      legitimatievoorschriften tenaamstelling en kentekenplaten voorgeschreven documenten overlegt.

      De af te geven kentekenplaten zijn voorzien van het kenteken dat voor het voertuig is vermeld in het
      kentekenregister.

      2 Onverminderd het eerste lid, geeft de erkenninghouder kentekenplaten volgens het model 18.2A tot en met 18.2E
      slechts af indien blijkens het kentekenregister toestemming is verleend voor het voeren van platen volgens dat
      model.

      3 Onverminderd het eerste lid, geeft de erkenninghouder donkerblauwe kentekenplaten slechts af indien uit
      het desbetreffende kentekenbewijs blijkt dat het betrokken voertuig vóór 1978 tot de weg is toegelaten en het
      desbetreffende kenteken niet bestaat uit twee groepen van twee letters en een groep van twee cijfers, dan wel uit
      één groep van twee letters, één groep van drie cijfers en één letter of één groep van twee cijfers, één groep van
      drie letters en één cijfer. De laatste voorwaarde met betrekking tot het kenteken geldt niet voor aanhangwagens,
      landbouw- en bosbouwtrekkers, motorrijtuigen met beperkte snelheid en mobiele machines.

      4 Indien de Dienst Wegverkeer, op een door die dienst te bepalen wijze, meldt dat er geen kentekenplaten mogen
      worden afgegeven, geeft de erkenninghouder geen kentekenplaten van de modellen 18.2A tot en met 18.2E met een
      retroreflecterende gele achtergrond dan wel een retroreflecterende lichtblauwe achtergrond, 27.1A tot en met 27.2H,
      27.10A tot en met 27.14, 27.30A tot en met 27.31E en 30.1A tot en met 30.6 voor het desbetreffende kenteken af.

      5 Bij een eerste afgifte worden de kentekenplaten niet voorzien van een duplicaatcode.

      6 Bij de afgifte van kentekenplaten volgens de modellen 27.15A tot en met 27.17E, 30.7 en 30.8 voorziet de
      erkenninghouder de kentekenplaten van een maandaanduiding. Aangeduid wordt het nummer van de lopende maand. Indien
      de afgifte plaatsvindt na de zevende dag van de lopende maand, wordt aangeduid het nummer van de lopende of de
      volgende maand.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel20
  - number: '21'
    text: |-
      1 De erkenninghouder geeft bij de afgifte van kentekenplaten volgens de modellen 18.2A tot en met 18.2E, 27.1A tot
      en met 27.2H, 27.10A tot en met 27.14, 27.30A tot en met 27.31E en 30.1A tot en met 30.6 van de [bijlage bij de
      Regeling kentekens en kentekenplaten](onbekend) per kenteken:

      a. één kentekenplaat af voor een motorrijtuig op twee of drie wielen met of zonder zijspanwagen, niet zijnde een
      bromfiets, een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een mobiele machine;

      b. twee kentekenplaten af voor een motorrijtuig op meer dan drie wielen, niet zijnde een bromfiets, een landbouw-
      of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een mobiele machine;

      c. één kentekenplaat af voor een bromfiets, een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid
      of een mobiele machine, en

      d. één kentekenplaat af voor een aanhangwagen.

      2 Indien een handelaarskentekenbewijs voor een motorrijtuig op twee of drie wielen met of zonder zijspanwagen,
      niet zijnde een bromfiets, een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een
      mobiele machine, of voor een motorrijtuig op meer dan drie wielen, niet zijnde een bromfiets, een landbouw- of
      bosbouwtrekker, een motorrijtuig met beperkte snelheid of een mobiele machine wordt overgelegd, worden in afwijking
      van het eerste lid, ten minste één en ten hoogste vijf kentekenplaten afgegeven, met dien verstande dat van de
      modellen 27.11, 27.12 en 27.14 per model ten hoogste twee kentekenplaten worden afgegeven, en van model 27.13, ten
      hoogste één kentekenplaat wordt afgegeven.

      3 Indien een handelaarskentekenbewijs voor een bromfiets of een aanhangwagen wordt overgelegd, worden
      in afwijking van het eerste lid ten hoogste twee kentekenplaten afgegeven, met dien verstande dat voor
      een handelaarskentekenbewijs voor een aanhangwagen van de modellen 27.11, 27.12 en 27.13 en voor een
      handelaarskentekenbewijs voor een bromfiets van de modellen 30.5 en 30.6 per model ten hoogste één kentekenplaat
      wordt afgegeven.

      4 Indien een handelaarskentekenbewijs voor een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid
      of een mobiele machine wordt overgelegd, worden in afwijking van het eerste lid ten hoogste drie kentekenplaten
      afgegeven, met dien verstande dat van de modellen 27.11, 27.12 en 27.13 ten hoogste één kentekenplaat wordt
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel21
  - number: '22'
    text: |-
      1 In geval van vervanging van beschadigde kentekenplaten mogen kentekenplaten worden afgegeven met hetzelfde
      kenteken en, indien aanwezig, dezelfde duplicaatcode.

      2 De erkenninghouder geeft de nieuwe kentekenplaten slechts af nadat hij de te vervangen kentekenplaten in
      ontvangst heeft genomen en heeft geregistreerd overeenkomstig [artikel 23, eerste lid][ref1].

      3 In afwijking van [artikel 21, eerste lid][ref2], mag voor een kenteken ingeval van vervanging ten hoogste het
      aantal kentekenplaten worden afgegeven dat aan te vervangen platen in ontvangst is genomen.

      4 De erkenninghouder maakt de te vervangen kentekenplaten binnen één dag onbruikbaar door deze op zodanige wijze
      doormidden te knippen dat de lamineercode goed leesbaar blijft, meldt de lamineercodes aan de Dienst Wegverkeer en
      bewaart de twee helften van de kentekenplaten waarop de laatste tien meldingen betrekking hebben.

      5 In geval van vervanging van kentekenplaten volgens de modellen 27.11 tot en met 27.14, 30.5 en 30.6 dienen de af
      te geven kentekenplaten van hetzelfde model te zijn als de ingenomen kentekenplaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011082#Artikel21
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel22
