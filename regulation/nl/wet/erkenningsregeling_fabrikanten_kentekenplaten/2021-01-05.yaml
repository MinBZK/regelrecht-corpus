  - number: '24'
    text: |-
      1 Nadat een erkenning is verleend wordt door de daartoe aangewezen ambtenaren van de Dienst Wegverkeer periodiek
      dan wel steekproefsgewijs onaangekondigd onderzocht of de erkenninghouder alsmede de productieplaats nog voldoen
      aan de in deze regeling gestelde eisen en of de voorschriften in deze regeling en de overige bij of krachtens de
      wet gestelde voorschriften worden nageleefd.

      2 Aan een controle wordt door de erkenninghouder alle medewerking verleend. Onder alle medewerking wordt in ieder
      geval verstaan dat:

      a. de verantwoordelijke functionarissen van de erkenninghouder of hun vervangers bij de controle aanwezig zijn, en

      b. feitelijke assistentie wordt verleend bij het uitvoeren van de controle.

      De ter zake door de Dienst Wegverkeer gegeven aanwijzingen worden in acht genomen.

      3 Het toezicht kan tevens inhouden, dat de Dienst Wegverkeer de erkenninghouder vraagt met betrekking tot een
      of meer door de Dienst Wegverkeer aan te wijzen kentekenplaten een testrapport van een door de Dienst Wegverkeer
      aangewezen onderzoeksinstelling over te leggen waaruit blijkt dat de kentekenplaten voldoen aan de eisen, gesteld
      in de [Regeling kentekens en kentekenplaten][ref1] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
