        artikel: '22'
        hoofdstuk: '4'
  - number: 22b
    text: |-
      Bij vervanging van een kentekenplaat in verband met een wijziging van de maximum constructiesnelheid van een
      bromfiets is [artikel 22][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel22
