        artikel: '41'
  - number: 23a
    text: |-
      1 In afwijking van [artikel 15][ref1] mag de erkenninghouder kentekenplaten volgens de modellen
      1.1 tot en met 18.2E, 27.11, 27.12, 27.14, 27.30A tot en met 27.31E en kentekenplaten met de
      lettermodellen C1, indien uitgevoerd in kunststof, C2 en C3 van de [bijlage bij de Regeling kentekens
      en kentekenplaten](onbekend), leveren aan een andere erkenninghouder. Deze kentekenplaten zijn, indien
      van toepassing, voorzien van een duplicaatcode. Zij zijn niet voorzien van een merk als bedoeld in
      [artikel 5, eerste lid, van de Regeling kentekens en kentekenplaten][ref2].

      2 Bij levering als bedoeld in het eerste lid zijn de [artikelen 20, tweede, derde en vijfde lid][ref3], [21][ref4],
      [22, eerste lid][ref5], [22a][ref6] en [22b][ref7] van overeenkomstige toepassing.

      3 De erkenninghouder meldt voorafgaand aan de doorlevering van kentekenplaten, die voorzien behoren te zijn van een
      lamineercode, aan de Dienst Wegverkeer, op een door deze dienst te bepalen wijze, de volgende gegevens:

      a. de betrokken kentekens, de meldcodes, indien van toepassing, en, indien aanwezig, de duplicaatcodes en voor
      zover deze is afgeven het documentnummer van de kentekencard;

      b. de lamineercodes;

      c. de hoeveelheid kentekenplaten;

      d. de soort, de kleur en het model van de kentekenplaten;

      e. de reden voor doorlevering:

      1°. eerste afgifte;

      2°. vervanging, of

      3°. vermissing.

      f. de kentekenplaatfabrikant aan wie de kentekenplaten worden doorgeleverd.

      4 De erkenninghouder levert geen kentekenplaten aan een andere erkenninghouder, indien de Dienst Wegverkeer, op een
      door deze dienst te bepalen wijze, meldt dat er geen kentekenplaten mogen worden geleverd


