  - number: 22a
    text: |-
      Bij vervanging van kentekenplaten in verband met het voorgenomen gebruik van het voertuig als taxi dan wel in
      verband met de beëindiging van zodanig gebruik, is [artikel 22][ref1] van overeenkomstige toepassing, met dien
      verstande dat de vervanging slechts kan plaatsvinden per twee kentekenplaten en dat de vervangen kentekenplaten
      terstond onbruikbaar gemaakt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel22
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel22a
    references:
