  - number: 23c
    text: |-
      1 Kentekenplaten mogen afgegeven worden door een koerier die in dienst is bij de erkenninghouder.

      2 Bij levering als bedoeld in het eerste lid zijn de [artikelen 20 tot en met 22b][ref1] van overeenkomstige
      toepassing.

      3 Voorafgaand aan de afgifte van kentekenplaten, die voorzien behoren te zijn van een lamineercode en die worden
      afgegeven door een koerier, meldt de erkenninghouder bij de Dienst Wegverkeer, op een door deze dienst te bepalen
      wijze, de volgende gegevens:

      a. de betrokken kentekens, de meldcodes, indien van toepassing, en, indien aanwezig, de duplicaatcodes en voor
      zover deze is afgeven het documentnummer van de kentekencard;

      b. de lamineercodes;

      c. de hoeveelheid kentekenplaten;

      d. de soort, de kleur en het model van de kentekenplaten;

      e. de reden van afgifte:

      1°. eerste afgifte;

      2°. vervanging, of

      3°. vermissing.

      4 De erkenninghouder levert geen kentekenplaten door middel van een koerier indien de Dienst Wegverkeer, op een
      door deze dienst te bepalen wijze, meldt dat er geen kentekenplaten mogen worden geleverd.

      5 Op de dag van de afgifte van kentekenplaten door een koerier doet de erkenninghouder de melding bedoeld in
      [artikel 23, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011082#Artikel23
