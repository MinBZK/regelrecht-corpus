    Besluit:
  url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *erkenning:*


                erkenning als bedoeld in [artikel 70a, eerste lid, van de Wegenverkeerswet 1994][ref1] voor de productie
      en afgifte van kentekenplaten;



              b

                *erkenninghouder:*


                houder van een erkenning als bedoeld in [artikel 70a, eerste lid, van de Wegenverkeerswet 1994][ref2]
      voor de productie en afgifte van kentekenplaten;



              c

                *kentekenplaat:*


                eindproduct van de erkenninghouder;



              d

                *fabrikantenkeurmerk:*


                het door de erkenninghouder op de kentekenplaat aan te brengen keurmerk volgens model M 3 in de bijlage
      bij de Regeling kentekens en kentekenplaten;



              e

                *productie:*


                het verwerken van blanco-kentekenplaten tot kentekenplaten, waaronder mede wordt begrepen het aanbrengen
      van het fabrikantenkeurmerk, het desbetreffende kenteken en, indien van toepassing, de duplicaatcode;



              f

                *productieplaats:*


                inrichting waarin productie plaats vindt;



              g

                *lamineerder:*


                houder van een erkenning als bedoeld in [artikel 70 a van de wet][ref3] voor de productie en afgifte van
      blanco-kentekenplaten;



              h

                *blanco-kentekenplaat:*


                blanco-kentekenplaat, geschikt voor het produceren van een kentekenplaat;



              i

                *lamineercode:*


                het door de lamineerder op een blanco-kentekenplaat aan te brengen nummer volgens model E in de bijlage
      bij de Regeling kentekens en kentekenplaten, aan de hand waarvan iedere kentekenplaat kan worden geïdentificeerd.




      2 Voor de toepassing van deze regeling maken besloten ruimten die zijn gelegen in één gebouw, dan wel in
      verscheidene belendende of nagenoeg belendende gebouwen, waarin dezelfde erkenninghouder kentekenplaten fabriceert,
      deel uit van één productieplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
