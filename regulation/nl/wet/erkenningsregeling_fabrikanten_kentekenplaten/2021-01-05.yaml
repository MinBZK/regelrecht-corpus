  - number: 23b
    text: |-
      1 De erkenninghouder aan wie de kentekenplaten zijn geleverd, mag deze niet met toepassing van [artikel 23a][ref1]
      doorleveren aan een andere erkenninghouder.

      2 De erkenninghouder aan wie de kentekenplaten zijn geleverd, dient de geleverde kentekenplaten bij afgifte te
      voorzien van een merk als bedoeld in [artikel 5, eerste lid, van de Regeling kentekens en kentekenplaten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011082#Artikel23a
