  - number: 22c
    text: |-
      Bij vermissing van kentekenplaten van de modellen 27.1A tot en met 27.2H, 27.10A tot en met 27.10E, 27.30A tot en
      met 27.31E en 30.1A tot en met 30.4D, voorziet de erkenninghouder de nieuw af te geven kentekenplaten van een door
      de Dienst Wegverkeer op de door die dienst vastgestelde wijze aan de erkenninghouder gemelde duplicaatcode.
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel22c
  - number: '23'
    text: |-
      1 De erkenninghouder meldt bij de afgifte van kentekenplaten, die voorzien behoren te zijn van een lamineercode,
      bij de Dienst Wegverkeer, op door deze dienst te bepalen wijze, de volgende gegevens:

      a. het betrokken kenteken en, indien van toepassing, de meldcode van het voertuig en voor zover deze is afgeven het
      documentnummer van de kentekencard;

      b. indien dat bewijs moet worden overgelegd: de aard, het nummer en het land van afgifte van het legitimatiebewijs
      van degene die de kentekenplaten in ontvangst neemt;

      c. het aantal, het model en de kleur van de afgegeven kentekenplaten;

      d. de lamineercodes van de afgegeven platen, indien deze moeten zijn voorzien van een lamineercode;

      e. indien een bedrijfsvoorraadpas moet worden overgelegd: het bedrijfsnummer van het erkende bedrijf, dat is
      vermeld op de bedrijfsvoorraadpas;

      f. de lamineercodes modellen en kleuren van de te vervangen platen, indien deze moeten zijn voorzien van een
      lamineercode;

      g. indien de kentekenplaten zijn voorzien van een duplicaatcode: de duplicaatcode, en

      h. de reden voor afgifte:

      1°. eerste afgifte;

      2°. vervanging, of

      3°. vermissing.

      2 Uit de registratie worden uitsluitend en desgevraagd aan de ambtenaren van de Dienst Wegverkeer, belast met het
      toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen en aan de ambtenaren van politie
      belast met de handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in
      [artikel 41 van de wet][ref1], gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0011082/2021-01-05#Artikel23
    references:
