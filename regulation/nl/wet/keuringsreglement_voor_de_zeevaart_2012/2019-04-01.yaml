---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: keuringsreglement_voor_de_zeevaart_2012
regulatory_layer: WET
publication_date: '2025-05-28'
valid_from: '2019-04-01'
bwb_id: BWBR0017832
url: https://wetten.overheid.nl/BWBR0017832/2019-04-01
preamble:
  text: |-
    Gelet op artikel 48, tweede lid, van de Zeevaartbemanningswet, alsmede de artikelen 104, derde lid, en 106, eerste,
    tweede en derde lid, van het Besluit zeevaartbemanning handelsvaart en zeilvaart en de artikelen 60, derde lid, en
    62, eerste, tweede en derde lid, van het Besluit zeevisvaartbemanning;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Wet zeevarenden][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
  - number: 1.b
    text: |-
      keuring: medisch onderzoek als bedoeld in [artikel 105, eerste lid, van het Besluit zeevarenden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel105
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '105'
  - number: 1.c
    text: 'keurling: natuurlijke persoon die zich aan een keuring onderwerpt;'
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel1
  - number: 1.d
    text: |-
      risicogebied: gebied buiten Nederland, waar het risico van besmetting met tuberculose groter is dan het
      besmettingsrisico voor de Nederlandse bevolking, blijkend uit een jaarlijks voorkomen van tuberculose in het
      desbetreffende land dat hoger is dan 50 gevallen per 100.000 inwoners en dat als zodanig is geregistreerd door de
      Wereldgezondheidsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel1
  - number: 1a.1
    text: |-
      Een door de minister als keuringsarts aangewezen geneeskundige voldoet aan de voorwaarden opgenomen in
      [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017832
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0017832
  - number: 1a.2
    text: |-
      Een door de minister als keuringsarts erkend geneeskundige voldoet aan de voorwaarden opgenomen in
      [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017832
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0017832
  - number: '2.1'
    text: 'Voorafgaand aan de keuring controleert de keuringsarts:'
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
  - number: 2.1.a
    text: |-
      het monsterboekje of het in [artikel 38, eerste lid, van de wet][ref1] bedoelde document van de keurling, of


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel38
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '38'
  - number: 2.1.b
    text: |-
      ingeval de keurling nog niet in het bezit is van een monsterboekje of een document als bedoeld in onderdeel a,
      de verklaring door of namens de scheepsbeheerder dat de keurling in dienst is of komt, vergezeld van een geldig
      identiteitsbewijs, of
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
  - number: 2.1.c
    text: |-
      het bewijs van aanmelding van de keurling bij een erkende opleiding voor zeevarenden, vergezeld van een geldig
      identiteitsbewijs.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
  - number: '2.2'
    text: 'De keuringsarts controleert verder:'
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
  - number: 2.2.a
    text: |-
      de keuringsstatus van de keurling, teneinde na te gaan of de keurling reeds door een andere keuringsarts is
      afgekeurd;
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
  - number: 2.2.b
    text: |-
      in geval de keurling afkomstig is uit of woont in een door de Wereldgezondheidsorganisatie aangewezen risicogebied,
      de uitslag van een onderzoek op tuberculose dat niet langer dan één maand voorafgaand aan de keuring heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
  - number: 2.2.c
    text: |-
      indien van toepassing, een geldige ontheffing, afgegeven door de Medisch Adviseur Scheepvaart als bedoeld in
      [Hoofdstuk 6 van het Besluit zeevarenden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012778
        hoofdstuk: '6'
  - number: '3.1'
    text: |-
      De keuring vindt plaats met inachtneming van de keuringsaanwijzingen en overeenkomstig de medische maatstaven,
      opgenomen in [bijlage 1][ref1], [bijlage 2][ref2] of appendix A tot en met E van Guidelines on the medical
      examinations of seafarers/ International Labour Office, Sectoral Activities Programme, International Migration
      Organization 2013 (ILO/IMO/JMS/2011/12). Instructies van de Medisch Adviseur Scheepvaart worden opgevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0017832
      [ref2]: https://wetten.overheid.nl/BWBR0017832
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017832
      - id: ref2
        bwb_id: BWBR0017832
  - number: '3.2'
    text: |-
      Bij de keuring maakt de keuringsarts gebruik van het keuringsformulier. De keuringsarts bewaart het
      Keuringsformulier en eventuele andere stukken, betrekking hebbende op het onderzoek, gedurende de termijn en op de
      wijze, bepaald bij of krachtens de Wet op de geneeskundige behandelingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel3
  - number: '3.3'
    text: |-
      De keuring van de algemene lichamelijke geschiktheid omvat een onderzoek naar de voorheen doorgemaakte ziekten en
      overkomen ongevallen (anamnese), de in de familie voorkomende erfelijke en chronische ziekten (familie-anamnese),
      een algemene beoordeling van de geestelijke gesteldheid van de keurling, chemisch onderzoek van urine, alsmede
      een algemeen onderzoek van het lichaam, van het gezichtsorgaan en het gehoororgaan op een dusdanige wijze dat kan
      worden vastgesteld of de kandidaat voldoet aan de maatstaven, bedoeld in het eerste lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel3
  - number: '4.1'
    text: |-
      Indien op grond van [artikel 3, eerste lid][ref1], een specialistisch rapport is voorgeschreven of bij twijfel
      omtrent het voldoen aan de maatstaven, vraagt de keuringsarts informatie op bij de behandelend arts. Bij het
      ontbreken van voldoende informatie verwijst de keuringsarts de keurling voor een deelonderzoek naar een specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0017832#Artikel3
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017832
        artikel: '3'
  - number: '4.2'
    text: |-
      De keuring wordt door de keuringsarts afgerond na ontvangst van de informatie van de behandelend arts of de uitslag
      van het specialistisch deelonderzoek.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel4
  - number: '5.1'
    text: |-
      De keuringsarts die een keuring heeft verricht waarvan de uitslag gunstig is, overhandigt aan de keurling
      een geneeskundige verklaring voor de zeevaart ter ondertekening door de keurling. Op de verklaring worden
      functiecategorie, geldigheidsduur en -gebied vermeld.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel5
  - number: '5.2'
    text: |-
      De keuringsarts bekrachtigt de door de keurling ondertekende geneeskundige verklaring met zijn handtekening en
      naamstempel.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de afgifte van een geneeskundige verklaring moet worden geweigerd, deelt de keuringsarts dit aan de keurling
      mede onder vermelding van de reden of redenen tot afkeuring.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel6
  - number: '6.2'
    text: |-
      De weigering kan slechts geschieden indien de volledige keuring is uitgevoerd overeenkomstig de [artikelen 3][ref1]
      en [4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017832#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017832#Artikel4
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017832
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0017832
        artikel: '4'
  - number: '6.3'
    text: De keuringsarts deelt tevens mede dat de keurling recht heeft op een herkeuring.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel6
  - number: '6.4'
    text: |-
      Van iedere afkeuring voor de zeevaart doet de keuringsarts onverwijld mededeling aan de Medisch Adviseur
      Scheepvaart door middel van een verklaring van medische ongeschiktheid, waarin de reden of redenen tot afkeuring
      zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel6
  - number: '6.5'
    text: |-
      De keuringsarts overhandigt aan de keurling een exemplaar van het de verklaring van medische ongeschiktheid en
      vermeldt daarop de reden of redenen tot afkeuring.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel6
  - number: '6.6'
    text: |-
      Indien de keuringsarts bij een tussentijds onderzoek op grond van [artikel 23 van de wet][ref1] bemerkt dat de
      keurling tijdelijk dan wel blijvend ongeschikt is voor de zeevaart, handelt hij als beschreven in het eerste tot en
      met vijfde lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel23
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '23'
  - number: '6.7'
    text: |-
      De keurling die een herkeuring wenst, richt zich daartoe tot een scheidsrechter onder overlegging van diens
      exemplaar van het de verklaring van medische ongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel6
  - number: '7.1'
    text: |-
      Na afgifte van een verklaring van tijdelijke ongeschiktheid kan herkeuring uitsluitend plaatsvinden door dezelfde
      keuringsarts die de keurling ongeschikt heeft bevonden, tenzij hij gebruik wenst te maken van het recht tot
      herkeuring door een aangewezen scheidsrechter.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel7
  - number: '7.2'
    text: |-
      Na afgifte van een verklaring van blijvende ongeschiktheid kan herkeuring uitsluitend plaatsvinden door een
      aangewezen scheidsrechter.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel7
  - number: '8.1'
    text: |-
      Bij het uitvoeren van de herkeuring zijn de [artikelen 3][ref1] en [4][ref2] van overeenkomstige toepassing met
      dien verstande dat reeds door de keuringsarts in orde bevonden onderdelen van de keuring niet behoeven te worden
      herhaald, tenzij over de uitslag twijfel bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017832#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017832#Artikel4
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017832
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0017832
        artikel: '4'
  - number: '8.2'
    text: |-
      In voorkomende gevallen kan de herkeuring bestaan uit het uitsluitend beoordelen van de ter beschikking staande
      medische gegevens.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel8
  - number: '8.3'
    text: |-
      Bij goedkeuring is [artikel 5][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017832#Artikel5
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017832
        artikel: '5'
  - number: '8.4'
    text: |-
      Bij afkeuring zijn het [eerste en vijfde lid van artikel 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017832#Artikel6
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017832
        artikel: '6'
  - number: '8.5'
    text: Voor de afgifte van een ontheffing brengt de scheidsrechter advies uit aan de Medisch Adviseur Scheepvaart.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel8
  - number: '10'
    text: |-
      De resultaten van de keuringen van zeevarenden die een functie uitoefenen als bedoeld in
      [artikel 18, tweede lid, van de wet][ref1], en van zeevarenden met veiligheids- of beveiligingstaken, worden door
      de keuringsarts onverwijld aangetekend in het daarvoor bestemde register. Instructies van de Medisch Adviseur
      Scheepvaart worden opgevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel18
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '18'
  - number: '11.1'
    text: |-
      Het model voor de geneeskundige verklaring zeevaart is het model zoals opgenomen in [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017832
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017832
  - number: '11.2'
    text: |-
      Het model voor de verklaring van medische ongeschiktheid is het model, opgenomen in
      [bijlage 6.3 van de Binnenvaartregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025958
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025958
  - number: '11.3'
    text: |-
      De keuringsarts maakt uitsluitend gebruik van de formulieren voor de geneeskundige verklaring, de verklaring van
      medische ongeschiktheid en het keuringsformulier die hem door de Medisch Adviseur Scheepvaart worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling berust op de [artikelen 104][ref1], [106, eerste, tweede en derde lid][ref2], en
      [110, zevende lid, van het Besluit zeevarenden][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012778#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0012778#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0012778#Artikel110
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012778
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0012778
        artikel: '106'
      - id: ref3
        bwb_id: BWBR0012778
        artikel: '110'
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Keuringsreglement voor de zeevaart 2012.'
    url: https://wetten.overheid.nl/BWBR0017832/2019-04-01#Artikel13
