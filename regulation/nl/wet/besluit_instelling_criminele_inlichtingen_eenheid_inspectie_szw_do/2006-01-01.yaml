  - number: '4'
    text: |-
      De criminele inlichtingen eenheid SIOD streeft naar een zo doelmatig mogelijke

      samenwerking met de overige criminele inlichtingen eenheden.
    url: https://wetten.overheid.nl/BWBR0015445/2006-01-01#Artikel4
  - number: '5'
    text: |-
      1 De criminele inlichtingen eenheid SIOD verstrekt criminele inlichtingen indien dit van belang
      kan zijn voor de opsporing van misdrijven, voor zover het betreft misdrijven als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet politieregisters][ref1]. Daartoe wordt gebruik gemaakt van het
      modelformulier dat is opgenomen in bijlage I van deze regeling.

      2 Van de overeenkomstig [artikel 13c, vijfde lid, van de Wet politieregisters][ref2] aangewezen ambtenaren van de
      criminele inlichtingen eenheid SIOD worden door het hoofd van de afdeling Recherche van de SIOD twee ambtenaren
      voorgedragen met het oog op de autorisatie, bedoeld in [artikel 17 van het Besluit politieregisters][ref3], ten
      aanzien van de registers zware criminaliteit bij de overige criminele inlichtingen eenheden.

      3 Het hoofd van de afdeling Recherche van de SIOD draagt ervoor zorg dat aan de op grond van
      [artikel 6, tweede lid][ref4], van de CIE-regeling bekendgemaakte ambtenaren van elke criminele inlichtingen
      eenheid alsmede de twee geautoriseerde ambtenaren van de criminele inlichtingen eenheden bij de bijzondere
      opsporingsdiensten overeenkomstig het bij of krachtens de [Wet politieregisters][ref5] bepaalde autorisatie wordt
      verleend.


