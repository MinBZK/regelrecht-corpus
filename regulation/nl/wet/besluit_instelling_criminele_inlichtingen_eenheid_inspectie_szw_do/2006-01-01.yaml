  - number: '3'
    text: |-
      1 De criminele inlichtingen eenheid SIOD verricht in ieder geval de volgende werkzaamheden:

      a. het verzamelen en verifiëren van criminele inlichtingen;

      b. het registreren van gegevens in een register zware criminaliteit en in een voorlopig register overeenkomstig de
      daarop betrekking hebbende modelreglementen;

      c. het bevorderen van het gericht inwinnen en aanvullen van criminele inlichtingen en andere gegevens die in het
      kader van de strafrechtelijke handhaving van de rechtsorde in aanmerking komen voor registratie op grond van de
      [Wet politieregisters][ref1];

      d. het analyseren van criminele inlichtingen en het aan de hand daarvan:

      1°. signaleren van criminaliteitsontwikkelingen, voor zover het betreft misdrijven als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet politieregisters][ref2];

      2°. periodiek verslag doen ten behoeve van criminaliteitsbeelden;

      e. het verstrekken van criminele inlichtingen overeenkomstig de daarop betrekking hebbende modelreglementen.

      2 Ten behoeve van de werkzaamheden, bedoeld in het eerste lid, maakt de criminele inlichtingen eenheid SIOD gebruik
      van de door de Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties aangewezen geautomatiseerde
      verwijsindex.

      3 De uitvoering van de werkzaamheden, bedoeld in het eerste lid, onder c, met medewerking van personen als
      omschreven in [artikel 1, onder c][ref3], wordt binnen de SIOD uitsluitend verricht door de criminele inlichtingen
      eenheid SIOD.


