        artikel: '3'
  - number: '8'
    text: |-
      1 De bij de criminele inlichtingen eenheid SIOD in gebruik zijnde vertrekken zijn afsluitbaar en beveiligd. Tot
      deze vertrekken hebben slechts toegang ambtenaren die deel uitmaken van de criminele inlichtingen eenheid SIOD,
      personen die door deze ambtenaren worden begeleid en de CIE-officier van justitie.

      2 In afwijking van het eerste lid, tweede volzin, kan het hoofd van de afdeling Recherche van de SIOD aan
      anderen toegang zonder begeleiding toestaan, indien het betreden van de vertrekken alleen kan plaatsvinden nadat
      identiteitsgegevens elektronisch zijn vastgelegd en de toegang noodzakelijk is vanuit zijn verantwoordelijkheid
      voor de ambtenaren en vertrekken van de criminele inlichtingen eenheid SIOD.

      3 Bij afwezigheid van ambtenaren van de criminele inlichtingen eenheid SIOD zijn de vertrekken deugdelijk
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0015445/2006-01-01#Artikel8
  - number: '9'
    text: |-
      Het hoofd van de afdeling Recherche van de SIOD draagt ervoor zorg dat de nodige voorzieningen van technische
      en organisatorische aard ter beveiliging van het bij de criminele inlichtingen eenheid SIOD gehouden voorlopig
      register en het register zware criminaliteit tegen verlies of aantasting van persoonsgegevens en tegen
      onbevoegde kennisneming, wijziging of verstrekking daarvan kunnen worden getroffen opdat het bij of krachtens de
      [Wet politieregisters][ref1] bepaalde kan worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
