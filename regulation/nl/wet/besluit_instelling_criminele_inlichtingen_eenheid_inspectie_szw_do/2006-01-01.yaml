        artikel: 13a
  - number: '7'
    text: |-
      1 Het hoofd van de afdeling Recherche van de SIOD draagt er zorg voor dat de kennis en vaardigheden van de
      ambtenaren, die deel uitmaken van de criminele inlichtingen eenheid SIOD, worden onderhouden op minimaal het niveau
      van de eindtermen, bedoeld in [artikel 18a, tweede lid, van het Besluit politieregisters][ref1].

      2 Het hoofd van de afdeling Recherche van de SIOD bepaalt de termijn gedurende welke de ambtenaar die belast is met
      de werkzaamheden, bedoeld in [artikel 3, eerste lid, onder c][ref2], ononderbroken deel uitmaakt van een criminele
      inlichtingen eenheid SIOD.

      3 De termijn, bedoeld in het tweede lid, is ten hoogste vier jaar en kan tweemaal met twee jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0004996#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0015445#Artikel3
    url: https://wetten.overheid.nl/BWBR0015445/2006-01-01#Artikel7
