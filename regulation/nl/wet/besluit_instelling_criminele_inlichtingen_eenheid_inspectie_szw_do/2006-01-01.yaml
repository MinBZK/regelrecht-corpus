articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *CIE-regeling*: de Regeling criminele inlichtingen eenheden;

      b. *nationale criminele inlichtingen eenheid*: eenheid, genoemd in artikel 1, onderdeel b, van de CIE-regeling;

      c. *informantgegevens*: gegevens omtrent een persoon die, anders dan als getuige of verdachte, aan een
      opsporingsambtenaar informatie verstrekt omtrent door anderen gepleegde of te plegen strafbare feiten, met inbegrip
      van de door deze persoon verstrekte gegevens, waarvan de verstrekking gevaar voor de geregistreerde of voor derden
      oplevert;

      d. *criminele inlichtingen*: gegevens die in aanmerking komen voor registratie in het register zware criminaliteit
      of het voorlopig register;

      e. *register zware criminaliteit*: het register, genoemd in artikel 1, eerste lid, onderdeel k, van de Wet
      politieregisters;

      f. *voorlopig register*: het register, genoemd in artikel 1, eerste lid, onderdeel l, van de Wet politieregisters;

      g. *CIE-officier van justitie*: de als zodanig aangewezen officier van justitie, verantwoordelijk voor de
      taakuitoefening van de criminele inlichtingen eenheid SIOD;

      h. *SIOD*: de Sociale Inlichtingen- en Opsporingsdienst van het Ministerie van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0015445/2006-01-01#Artikel1
  - number: '2'
    text: |-
      1 Bij de SIOD is een criminele inlichtingen eenheid SIOD.

      2 De criminele inlichtingen eenheid SIOD is belast met de informatievoorziening in het
      kader van de opsporing van misdrijven, voor zover het betreft misdrijven als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet politieregisters][ref1].

      3 Met het oog op de uitvoering van de taak, bedoeld in het tweede lid, worden overeenkomstig het bij of krachtens
      de [Wet politieregisters][ref2] bepaalde een voorlopig register en een register zware criminaliteit gevoerd.

      4 Onverminderd [artikel 13c, derde lid, van de Wet politieregisters][ref3] is het hoofd van de afdeling Recherche
      van de SIOD belast met de leiding over de criminele inlichtingen eenheid SIOD.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004798
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel13c
