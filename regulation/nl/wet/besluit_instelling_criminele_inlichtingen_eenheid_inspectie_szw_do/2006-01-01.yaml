  - number: '6'
    text: |-
      1 De criminele inlichtingen eenheid SIOD stelt de nationale criminele inlichtingen eenheid in kennis van:

      a. gegevens uit het register zware criminaliteit en uit het voorlopig register die van nationale of internationale
      betekenis zijn;

      b. personalia of bedrijfsgegevens van de overeenkomstig
      [artikel 13a, eerste lid, onder a en b, van de Wet politieregisters][ref1] geregistreerde personen;

      c. de informantgegevens door middel van het Informanten Codering Systeem;

      d. overige informatie die van belang kan zijn voor de landelijke en internationale coördinatie en ondersteuning
      door de nationale criminele inlichtingen eenheid.

      2 Ter uitvoering van het eerste lid, aanhef en onder b, en met het oog op de verstrekking van de gegevens als
      opgenomen in bijlage II van deze regeling maakt de criminele inlichtingen eenheid SIOD gebruik van de door de
      Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties aangewezen geautomatiseerde verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel13a
    url: https://wetten.overheid.nl/BWBR0015445/2006-01-01#Artikel6
    references:
