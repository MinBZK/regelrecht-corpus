  - number: '3'
    text: |-
      1 De criminele inlichtingen eenheid Inspectie SZW-DO verricht in ieder geval de volgende werkzaamheden:

      a. het verzamelen en verifiëren van criminele inlichtingen;

      b. het verwerken van criminele inlichtingen in een bestand, als bedoeld in
      [artikel 2, eerste lid, van de Wet politiegegevens][ref1];

      c. het bevorderen van het gericht inwinnen en aanvullen van criminele inlichtingen en andere gegevens die in het
      kader van de strafrechtelijke handhaving van de rechtsorde in aanmerking komen voor verwerking op grond van de
      [Wet politiegegevens][ref2];

      d. het analyseren van criminele inlichtingen en het aan de hand daarvan:

      1°. signaleren van criminaliteitsontwikkelingen, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref3];

      2°. periodiek verslag doen ten behoeve van criminaliteitsbeelden;

      e. het ter beschikking stellen van criminele inlichtingen overeenkomstig
      [artikel 10, vijfde lid, van de Wet politiegegevens][ref4];

      f. het verwerken van gegevens over informanten, overeenkomstig [artikel 12 van de Wet politiegegevens][ref5], onder
      gelijktijdige codetoekenning.

      2 Ten behoeve van de werkzaamheden, bedoeld in het eerste lid, maakt de criminele inlichtingen eenheid Inspectie
      SZW-DO gebruik van de door de Minister van Veiligheid en Justitie aangewezen geautomatiseerde verwijsindex.

      3 De uitvoering van de werkzaamheden, bedoeld in het eerste lid, onder c, met medewerking van personen als
      omschreven in [artikel 1, onder c][ref6], wordt binnen de Inspectie SZW-DO uitsluitend verricht door de criminele
      inlichtingen eenheid Inspectie SZW-DO.


