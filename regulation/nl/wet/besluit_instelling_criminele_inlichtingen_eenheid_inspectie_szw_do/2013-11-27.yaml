---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_instelling_criminele_inlichtingen_eenheid_inspectie_szw_do
regulatory_layer: WET
publication_date: '2015-06-26'
valid_from: '2013-11-27'
bwb_id: BWBR0015445
url: https://wetten.overheid.nl/BWBR0015445/2013-11-27
preamble:
  text: |-
    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit inrichting organisatie en formatie rijksdienst en de
    artikelen 1, onder d, en 18a van het Besluit politieregisters;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
  - number: 1.1.a
    text: |-
      *nationale criminele inlichtingen eenheid:* eenheid, genoemd in
      [artikel 1, onderdeel d, van het Besluit verplichte politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032083#Artikel1
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032083
        artikel: '1'
  - number: 1.1.b
    text: |-
      *informantgegevens:* gegevens omtrent een persoon, bedoeld in
      [artikel 12, zevende lid, van de Wet politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '12'
  - number: 1.1.c
    text: |-
      *criminele inlichtingen:* gegevens, die in aanmerking komen voor verwerking op grond van
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 1.1.d
    text: |-
      *Inspectie SZW-DO:* de Directie Opsporing van de Inspectie SZW van het Ministerie van Sociale Zaken en
      Werkgelegenheid;
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
  - number: 1.1.e
    text: |-
      *CIE-officier van justitie:* de als zodanig aangewezen officier van justitie, verantwoordelijk voor de
      taakuitoefening van de criminele inlichtingeneenheid SIOD;
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
  - number: 1.1.f
    text: '*verantwoordelijke:* de Minister van Sociale Zaken en Werkgelegenheid.'
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
  - number: '1.2'
    text: |-
      Namens de verantwoordelijke kunnen de in deze regeling voorgeschreven handelingen worden verricht door de
      functionaris van de Inspectie SZW-DO die leiding geeft aan de criminele inlichtingen eenheid, bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015445#Artikel2
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015445
        artikel: '2'
  - number: '2.1'
    text: Bij de Inspectie SZW-DO is een criminele inlichtingen eenheid Inspectie SZW-DO.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel2
  - number: '2.2'
    text: |-
      De criminele inlichtingen eenheid Inspectie SZW-DO is belast met de informatievoorziening in
      het kader van de opsporing van misdrijven, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: '2.3'
    text: |-
      Met het oog op de uitvoering van de taak, bedoeld in het tweede lid, worden criminele inlichtingen verwerkt
      overeenkomstig het bij of krachtens de [Wet politiegegevens][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: '3.1'
    text: 'De criminele inlichtingen eenheid Inspectie SZW-DO verricht in ieder geval de volgende werkzaamheden:'
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
  - number: 3.1.a
    text: het verzamelen en verifiëren van criminele inlichtingen;
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
  - number: 3.1.b
    text: |-
      het verwerken van criminele inlichtingen in een bestand, als bedoeld in
      [artikel 2, eerste lid, van de Wet politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel2
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '2'
  - number: 3.1.c
    text: |-
      het bevorderen van het gericht inwinnen en aanvullen van criminele inlichtingen en andere gegevens die in het
      kader van de strafrechtelijke handhaving van de rechtsorde in aanmerking komen voor verwerking op grond van de
      [Wet politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 3.1.d
    text: 'het analyseren van criminele inlichtingen en het aan de hand daarvan:'
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
  - number: 3.1.d.1°
    text: |-
      signaleren van criminaliteitsontwikkelingen, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 3.1.d.2°
    text: periodiek verslag doen ten behoeve van criminaliteitsbeelden;
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
  - number: 3.1.e
    text: |-
      het ter beschikking stellen van criminele inlichtingen overeenkomstig
      [artikel 10, vijfde lid, van de Wet politiegegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 3.1.f
    text: |-
      het verwerken van gegevens over informanten, overeenkomstig [artikel 12 van de Wet politiegegevens][ref1], onder
      gelijktijdige codetoekenning.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '12'
  - number: '3.2'
    text: |-
      Ten behoeve van de werkzaamheden, bedoeld in het eerste lid, maakt de criminele inlichtingen eenheid Inspectie SZW-
      DO gebruik van de door de Minister van Veiligheid en Justitie aangewezen geautomatiseerde verwijsindex.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
  - number: '3.3'
    text: |-
      De uitvoering van de werkzaamheden, bedoeld in het eerste lid, onder c, met medewerking van personen als omschreven
      in [artikel 1, onder c][ref1], wordt binnen de Inspectie SZW-DO uitsluitend verricht door de criminele inlichtingen
      eenheid Inspectie SZW-DO.


      [ref1]: https://wetten.overheid.nl/BWBR0015445#Artikel1
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015445
        artikel: '1'
  - number: '4'
    text: |-
      De criminele inlichtingen eenheid Inspectie SZW-DO streeft naar een zo doelmatig mogelijke samenwerking met de
      overige criminele inlichtingen eenheden.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel4
  - number: '5.1'
    text: |-
      De criminele inlichtingen eenheid Inspectie SZW-DO verstrekt criminele inlichtingen indien dit van
      belang kan zijn voor de opsporing van misdrijven, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1]. Daartoe wordt gebruik gemaakt van het
      modelformulier dat is opgenomen in bijlage I van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: '5.2'
    text: |-
      Van de overeenkomstig [artikel 46, tweede lid, van de Wet politiegegevens][ref1] aangewezen ambtenaren van de
      criminele inlichtingen eenheid Inspectie SZW-DO worden door de verantwoordelijke twee ambtenaren voorgedragen met
      het oog op de autorisatie, bedoeld in [artikel 2:5, eerste lid, van het Besluit politiegegevens][ref2], ten aanzien
      van het bestand met criminele inlichtingen bij de overige criminele inlichtingen eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0023086
        artikel: '2'
  - number: '5.3'
    text: |-
      De verantwoordelijke draagt ervoor zorg dat aan de op grond van
      [artikel 7, tweede lid, van het Besluit verplichte politiegegevens][ref1] bekendgemaakte ambtenaren van elke
      criminele inlichtingen eenheid alsmede de twee geautoriseerde ambtenaren van de criminele inlichtingen eenheden
      bij de bijzondere opsporingsdiensten overeenkomstig het bij of krachtens de [Wet politiegegevens][ref2] bepaalde
      autorisatie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032083#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032083
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0022463
  - number: '6.1'
    text: 'De criminele inlichtingen eenheid Inspectie SZW-DO stelt de nationale criminele inlichtingen eenheid in kennis van:'
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel6
  - number: 6.1.a
    text: criminele inlichtingen die van nationale of internationale betekenis zijn;
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel6
  - number: 6.1.b
    text: |-
      personalia of bedrijfsgegevens van overeenkomstig
      [artikel 10, tweede lid, onderdelen a en b, van de Wet politiegegevens][ref1] geregistreerde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: 6.1.c
    text: de informantgegevens door middel van het Informanten Codering Systeem;
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel6
  - number: 6.1.d
    text: |-
      overige informatie die van belang kan zijn voor de landelijke en internationale coördinatie en ondersteuning door
      de nationale criminele inlichtingen eenheid.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel6
  - number: '6.2'
    text: |-
      Ter uitvoering van het eerste lid, aanhef en onder b, en met het oog op de verstrekking van de gegevens als
      opgenomen in [bijlage II][ref1] van deze regeling maakt de criminele inlichtingen eenheid Inspectie SZW-DO gebruik
      van de door de Minister van Veiligheid en Justitie aangewezen geautomatiseerde verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0015445
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015445
  - number: '7.1'
    text: |-
      De verantwoordelijke van de Inspectie SZW-DO draagt er zorg voor dat de kennis en vaardigheden van de ambtenaren,
      die deel uitmaken van de criminele inlichtingen eenheid Inspectie SZW-DO, worden onderhouden op minimaal het niveau
      van de eindtermen, bedoeld in [artikel 2:9 van het Besluit politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
  - number: '7.2'
    text: |-
      De verantwoordelijke bepaalt de termijn gedurende welke de ambtenaar die belast is met de werkzaamheden, bedoeld
      in [artikel 3, eerste lid, onder c][ref1], ononderbroken deel uitmaakt van een criminele inlichtingen eenheid
      Inspectie SZW-DO.


      [ref1]: https://wetten.overheid.nl/BWBR0015445#Artikel3
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015445
        artikel: '3'
  - number: '7.3'
    text: De termijn, bedoeld in het tweede lid, is ten hoogste vier jaar en kan tweemaal met twee jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel7
  - number: '8.1'
    text: |-
      De bij de criminele inlichtingen eenheid Inspectie SZW-DO in gebruik zijnde vertrekken zijn afsluitbaar en
      beveiligd. Tot deze vertrekken hebben slechts toegang ambtenaren die deel uitmaken van de criminele inlichtingen
      eenheid Inspectie SZW-DO, personen die door deze ambtenaren worden begeleid en de CIE-officier van justitie.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid, tweede volzin, kan de verantwoordelijke van de Inspectie SZW-DO aan anderen
      toegang zonder begeleiding toestaan, indien het betreden van de vertrekken alleen kan plaatsvinden nadat
      identiteitsgegevens elektronisch zijn vastgelegd en de toegang noodzakelijk is vanuit zijn verantwoordelijkheid
      voor de ambtenaren en vertrekken van de criminele inlichtingen eenheid Inspectie SZW-DO.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel8
  - number: '8.3'
    text: |-
      Bij afwezigheid van ambtenaren van de criminele inlichtingen eenheid Inspectie SZW-DO zijn de vertrekken deugdelijk
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel8
  - number: '9'
    text: |-
      De verantwoordelijke draagt ervoor zorg dat de nodige voorzieningen van technische en organisatorische aard ter
      beveiliging van de bij de criminele inlichtingen eenheid Inspectie SZW-DO gehouden criminele inlichtingen tegen
      verlies of aantasting van persoonsgegevens en tegen onbevoegde kennisneming, wijziging of verstrekking daarvan
      kunnen worden getroffen opdat het bij of krachtens de [Wet politiegegevens][ref1] bepaalde kan worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit instelling criminele inlichtingen eenheid Inspectie SZW-DO.'
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel11
