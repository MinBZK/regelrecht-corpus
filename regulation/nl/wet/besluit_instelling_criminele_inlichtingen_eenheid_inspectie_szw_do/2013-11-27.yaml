  - number: '7'
    text: |-
      1 De verantwoordelijke van de Inspectie SZW-DO draagt er zorg voor dat de kennis en vaardigheden van de ambtenaren,
      die deel uitmaken van de criminele inlichtingen eenheid Inspectie SZW-DO, worden onderhouden op minimaal het niveau
      van de eindtermen, bedoeld in [artikel 2:9 van het Besluit politiegegevens][ref1].

      2 De verantwoordelijke bepaalt de termijn gedurende welke de ambtenaar die belast is met de werkzaamheden, bedoeld
      in [artikel 3, eerste lid, onder c][ref2], ononderbroken deel uitmaakt van een criminele inlichtingen eenheid
      Inspectie SZW-DO.

      3 De termijn, bedoeld in het tweede lid, is ten hoogste vier jaar en kan tweemaal met twee jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0015445#Artikel3
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel7
    references:
