  - number: '4'
    text: |-
      De criminele inlichtingen eenheid Inspectie SZW-DO streeft naar een zo doelmatig mogelijke

      samenwerking met de overige criminele inlichtingen eenheden.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel4
  - number: '5'
    text: |-
      1 De criminele inlichtingen eenheid Inspectie SZW-DO verstrekt criminele inlichtingen indien dit van
      belang kan zijn voor de opsporing van misdrijven, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1]. Daartoe wordt gebruik gemaakt van het
      modelformulier dat is opgenomen in bijlage I van deze regeling.

      2 Van de overeenkomstig [artikel 46, tweede lid, van de Wet politiegegevens][ref2] aangewezen ambtenaren van de
      criminele inlichtingen eenheid Inspectie SZW-DO worden door de verantwoordelijke twee ambtenaren voorgedragen met
      het oog op de autorisatie, bedoeld in [artikel 2:5, eerste lid, van het Besluit politiegegevens][ref3], ten aanzien
      van het bestand met criminele inlichtingen bij de overige criminele inlichtingen eenheden.

      3 De verantwoordelijke draagt ervoor zorg dat aan de op grond van
      [artikel 7, tweede lid, van het Besluit verplichte politiegegevens][ref4] bekendgemaakte ambtenaren van elke
      criminele inlichtingen eenheid alsmede de twee geautoriseerde ambtenaren van de criminele inlichtingen eenheden
      bij de bijzondere opsporingsdiensten overeenkomstig het bij of krachtens de [Wet politiegegevens][ref5] bepaalde
      autorisatie wordt verleend.


