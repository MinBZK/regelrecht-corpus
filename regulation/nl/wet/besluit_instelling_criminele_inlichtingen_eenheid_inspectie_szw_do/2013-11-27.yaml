articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *nationale criminele inlichtingen eenheid:* eenheid, genoemd in
      [artikel 1, onderdeel d, van het Besluit verplichte politiegegevens][ref1];

      b. *informantgegevens:* gegevens omtrent een persoon, bedoeld in
      [artikel 12, zevende lid, van de Wet politiegegevens][ref2];

      c. *criminele inlichtingen:* gegevens, die in aanmerking komen voor verwerking op grond van
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref3];

      d. *Inspectie SZW-DO:* de Directie Opsporing van de Inspectie SZW van het Ministerie van Sociale Zaken en
      Werkgelegenheid;

      e. *CIE-officier van justitie:* de als zodanig aangewezen officier van justitie, verantwoordelijk voor de
      taakuitoefening van de criminele inlichtingeneenheid SIOD;

      f. *verantwoordelijke:* de Minister van Sociale Zaken en Werkgelegenheid.

      2 Namens de verantwoordelijke kunnen de in deze regeling voorgeschreven handelingen worden verricht door
      de functionaris van de Inspectie SZW-DO die leiding geeft aan de criminele inlichtingen eenheid, bedoeld in
      [artikel 2, eerste lid][ref4].


