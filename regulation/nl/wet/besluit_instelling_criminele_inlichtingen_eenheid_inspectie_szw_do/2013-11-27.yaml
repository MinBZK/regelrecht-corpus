  - number: '2'
    text: |-
      1 Bij de Inspectie SZW-DO is een criminele inlichtingen eenheid Inspectie SZW-DO.

      2 De criminele inlichtingen eenheid Inspectie SZW-DO is belast met de informatievoorziening
      in het kader van de opsporing van misdrijven, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1].

      3 Met het oog op de uitvoering van de taak, bedoeld in het tweede lid, worden criminele inlichtingen verwerkt
      overeenkomstig het bij of krachtens de [Wet politiegegevens][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel2
    references:
