        artikel: 2:9
      - id: ref2
        bwb_id: BWBR0015445
        artikel: '3'
  - number: '8'
    text: |-
      1 De bij de criminele inlichtingen eenheid Inspectie SZW-DO in gebruik zijnde vertrekken zijn afsluitbaar en
      beveiligd. Tot deze vertrekken hebben slechts toegang ambtenaren die deel uitmaken van de criminele inlichtingen
      eenheid Inspectie SZW-DO, personen die door deze ambtenaren worden begeleid en de CIE-officier van justitie.

      2 In afwijking van het eerste lid, tweede volzin, kan de verantwoordelijke van de Inspectie SZW-DO aan anderen
      toegang zonder begeleiding toestaan, indien het betreden van de vertrekken alleen kan plaatsvinden nadat
      identiteitsgegevens elektronisch zijn vastgelegd en de toegang noodzakelijk is vanuit zijn verantwoordelijkheid
      voor de ambtenaren en vertrekken van de criminele inlichtingen eenheid Inspectie SZW-DO.

      3 Bij afwezigheid van ambtenaren van de criminele inlichtingen eenheid Inspectie SZW-DO zijn de vertrekken
      deugdelijk afgesloten.
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel8
  - number: '9'
    text: |-
      De verantwoordelijke draagt ervoor zorg dat de nodige voorzieningen van technische en organisatorische aard ter
      beveiliging van de bij de criminele inlichtingen eenheid Inspectie SZW-DO gehouden criminele inlichtingen tegen
      verlies of aantasting van persoonsgegevens en tegen onbevoegde kennisneming, wijziging of verstrekking daarvan
      kunnen worden getroffen opdat het bij of krachtens de [Wet politiegegevens][ref1] bepaalde kan worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
