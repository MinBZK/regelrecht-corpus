  - number: '6'
    text: |-
      1 De criminele inlichtingen eenheid Inspectie SZW-DO stelt de nationale criminele inlichtingen eenheid in kennis
      van:

      a. criminele inlichtingen die van nationale of internationale betekenis zijn;

      b. personalia of bedrijfsgegevens van overeenkomstig
      [artikel 10, tweede lid, onderdelen a en b, van de Wet politiegegevens][ref1] geregistreerde personen;

      c. de informantgegevens door middel van het Informanten Codering Systeem;

      d. overige informatie die van belang kan zijn voor de landelijke en internationale coördinatie en ondersteuning
      door de nationale criminele inlichtingen eenheid.

      2 Ter uitvoering van het eerste lid, aanhef en onder b, en met het oog op de verstrekking van de gegevens als
      opgenomen in [bijlage II][ref2] van deze regeling maakt de criminele inlichtingen eenheid Inspectie SZW-DO gebruik
      van de door de Minister van Veiligheid en Justitie aangewezen geautomatiseerde verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0015445
    url: https://wetten.overheid.nl/BWBR0015445/2013-11-27#Artikel6
