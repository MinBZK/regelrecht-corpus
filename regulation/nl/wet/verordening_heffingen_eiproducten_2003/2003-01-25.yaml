preamble:
  text: |-
    gelet op artikel 126 van de Wet op de Bedrijfsorganisatie, en de artikelen 5 en 9 van de Instellingsverordening
    Productschap Pluimvee en Eieren 1998-I,

    op 14 november 2002 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0014283/2003-01-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening neemt over de terminologie van de [Verordening registratie verzamelaars en houders van een
      pakstation](onbekend) èn [heffingen consumptie-eieren 2003](onbekend) en verstaat verder onder:








                  eiproductenfabrikant:


                  de ondernemer die uit meer dan 200.000 kippen- en/of eendeneieren per jaar eiproducten vervaardigt;




                  legpluimveebedrijf:


                  inrichting die wordt gebruikt voor het houden van kippen voor de productie van consumptie-eieren;




                  eiproductenhandelaar:


                  de ondernemer die eiproducten koopt, ten einde deze in al dan niet bewerkte vorm af te leveren aan
      anderen dan consumenten.
    url: https://wetten.overheid.nl/BWBR0014283/2003-01-25#Artikel1
  - number: '2'
    text: |-
      1 Eiproductenfabrikanten zijn aan het productschap over de door hen in het kalenderjaar 2003 direct van
      legpluimveebedrijven ontvangen eieren een heffing verschuldigd ten bedrage van € 0,00003 per ei.

      2 Eiproductenfabrikanten zijn daarnaast over de door hen ontvangen en tot eiproduct verwerkte eieren een heffing
      verschuldigd ten bedrage van € 0,00097 per kilogram tot eiproduct verwerkte eieren, waarvan

      € 0,0009 voor de dekking van huishoudelijke uitgaven,

      € 0,00003 voor het o. en o. fonds en

      € 0,00004 voor het kwaliteitsfonds bestemd is.

      3 De heffingen genoemd in het tweede lid zijn, in zoverre zij daarin bestemd zijn voor de daarin genoemde fondsen,
      niet verschuldigd voor die eieren ten aanzien waarvan naar genoegen van het productschap wordt aangetoond dat zij
      niet in Nederland zijn geproduceerd.

      4 a. Eiproductenhandelaren zijn aan het productschap over het kalenderjaar 2003 een vaste heffing verschuldigd van
      € 68,06.

      b. in afwijking van het bepaalde onder a is de eiproductenhandelaar, indien zijn bedrijf in het kalenderjaar 2003
      is beëindigd, een vaste heffing verschuldigd van € 5,67 per maand of gedeelte daarvan, dat de betrokken ondernemer
      bij het productschap staat geregistreerd als eiproductenhandelaar met een maximum van € 68,06 per jaar.
    url: https://wetten.overheid.nl/BWBR0014283/2003-01-25#Artikel2
  - number: '3'
    text: |-
      1 De in [artikel 2][ref1] bedoelde ondernemer is verplicht om uiterlijk binnen 10 dagen na het verstrijken
      van elke kalendermaand, door middel van invulling en ondertekening van een hem door het productschap verstrekt
      opgaveformulier, naar waarheid opgave te doen van die bedrijfsgegevens over de verstreken kalendermaand waarvan de
      opgave in dat formulier wordt verlangd.

      2 De in het opgaveformulier te verstrekken gegevens hebben betrekking op de door de ondernemer in de desbetreffende
      kalendermaand ontvangen eieren en geïmporteerde eiproducten.

      3 De heffing die aan de ondernemer wordt opgelegd kan worden aangemerkt als voorschotbetaling. Na afloop van
      het kalenderjaar vindt dan een definitieve heffingsoplegging plaats en zo nodig verrekening tussen feitelijk
      verschuldigd bedrag en betaalde voorschotten.

      4 Iedere ondernemer is verplicht van dag tot dag een zodanige administratie te voeren, dat de gegevens, benodigd
      voor de vaststelling van de heffing, te alle tijde op een eenvoudige wijze kunnen worden gekend.

      5 Het bestuur van het productschap is bevoegd bij uitvoeringsbesluit minimumeisen te stellen waaraan de door de
      ondernemer met betrekking tot de ontvangst van eieren en ontvangst onderscheidenlijk aflevering van eiproducten te
      voeren administratie dient te voldoen.

      6 Voor het geval een ondernemer niet heeft voldaan aan een ingevolge het eerste lid op hem rustende verplichting,
      waaronder begrepen het verstrekken van onvolledige en/of onjuiste gegevens, kan te zijnen aanzien de in
      [artikel 2][ref2] omschreven heffing ambtshalve door het productschap worden vastgesteld aan de hand van aan het
      productschap ten dienste staande gegevens zo nodig door middel van een schatting.


      [ref1]: https://wetten.overheid.nl/BWBR0014283#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014283#Artikel2
    url: https://wetten.overheid.nl/BWBR0014283/2003-01-25#Artikel3
    references:
