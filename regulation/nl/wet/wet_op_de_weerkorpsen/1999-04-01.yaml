preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is enkele voorzieningen te treffen omtrent weerkorpsen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001980/1999-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het is verboden weerkorpsen tot stand te brengen, daarvan deel uit te maken of deze te steunen.

      2 Weerkorps is iedere organisatie van particulieren, welke gericht is op of voorbereidt tot het in onderling
      verband verrichten van of deelnemen aan hetgeen tot de taak behoort van weermacht of politie in de handhaving van
      de uit- en inwendige veiligheid en van de openbare orde en rust.

      3 Het verbod van het eerste lid geldt niet voor organisaties, toegelaten bij of krachtens algemeenen maatregel van
      bestuur. Aan eene toelating kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0001980/1999-04-01#Artikel1
  - number: '2'
    text: |-
      1 Hij die in strijd handelt met [artikel 1][ref1], wordt gestraft met hechtenis van ten hoogste zes maanden of
      geldboete van de derde categorie.

      2 Het feit wordt beschouwd als eene overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001980#Artikel1
    url: https://wetten.overheid.nl/BWBR0001980/1999-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001980
        artikel: '1'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      1 Hij die opzettelijk in strijd handelt met [artikel 1][ref1], wordt gestraft met gevangenisstraf van ten hoogste
      een jaar of geldboete van de vierde categorie.

      2 Het feit wordt beschouwd als een misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0001980#Artikel1
    url: https://wetten.overheid.nl/BWBR0001980/1999-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001980
        artikel: '1'
        hoofdstuk: '1'
  - number: '4'
    text: Deze wet kan worden aangehaald als 'Wet op de weerkorpsen'.
    url: https://wetten.overheid.nl/BWBR0001980/1999-04-01#Artikel4
  - number: '5'
    text: Zij treedt op een door Ons te bepalen tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0001980/1999-04-01#Artikel5
