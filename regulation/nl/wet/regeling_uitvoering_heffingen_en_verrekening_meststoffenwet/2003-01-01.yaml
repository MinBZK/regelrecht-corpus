preamble:
  text: >-
    Gelet op de artikelen 13aa, eerste en derde lid, 13ab, eerste lid, vierde en zesde lid, 13ac, zesde lid, en 13al,
    onderdeel h, van de Meststoffenwet, de artikelen 3, 6, eerste en derde lid, 8, eerste lid, 19, tweede lid, en 62
    van de Algemene wet inzake rijksbelastingen en de artikelen 5, 26 en 31 van de Invorderingswet 1990;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze regeling heeft betrekking op de in [hoofdstuk IV van de Meststoffenwet][ref1] onderscheiden heffingen.

      2 Deze regeling berust op de artikelen 41, eerste en derde lid, 42, eerste, vierde en zesde lid, 43, zesde
      lid en 53, onderdeel h, van de Meststoffenwet, de [artikelen 3][ref2], [6, eerste en derde lid][ref3],
      [8, eerste lid][ref4], [19, tweede lid][ref5], en [62 van de Algemene wet inzake rijksbelastingen][ref6] en de
      [artikelen 5][ref7], [26][ref8] en [31 van de Invorderingswet 1990][ref9].


