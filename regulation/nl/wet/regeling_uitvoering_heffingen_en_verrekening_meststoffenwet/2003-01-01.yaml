  - number: '6'
    text: |-
      1 Het uitnodigen tot het doen van aangifte wordt gedaan door:

      a. het uitreiken of toezenden van een aangiftebiljet;

      b. het uitreiken of toezenden van een aangiftediskette.

      2 Het eerste lid, onderdeel b, vindt slechts toepassing ten aanzien van de heffingplichtige aan wie een vergunning
      als bedoeld in [artikel 8, vierde lid][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008480#Artikel8
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008480
        artikel: '8'
  - number: '7'
    text: |-
      1 De heffingplichtige die niet reeds is uitgenodigd tot het doen van aangifte verzoekt vóór het tijdstip waarop
      de heffing moet worden voldaan de inspecteur van het bureau om uitnodiging tot het doen van aangifte. Deze
      verplichting geldt ook indien de belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof nihil of minder dan
      nihil is.

      2 De verplichting, bedoeld in het eerste lid, geldt mede voor de in de [artikelen 43][ref1] en
      [44, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel44
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '44'
  - number: '8'
    text: >-
      1 Aangifte wordt gedaan door:


      a. het inleveren of toezenden van het uitgereikte of toegezonden aangiftebiljet, dat is ingevuld en ondertekend op
      de daarbij aangegeven wijze, met de daarbij gevraagde bescheiden;


      b. het overeenkomstig de voorwaarden, bedoeld in het vierde lid, toezenden of inleveren van de uitgereikte
      aangiftediskette of het overeenkomstig die voorwaarden op elektronische wijze toezenden van de in de
      aangiftediskette gevraagde gegevens.


      2 Indien het eerste lid, onderdeel b, toepassing vindt, worden de gevraagde bescheiden afzonderlijk ingeleverd
      of toegezonden.


      3 Het doen van aangifte op de wijze bedoeld in het eerste lid, onderdeel b, is slechts toegestaan met een daaraan
      voorafgaande vergunning van de inspecteur van het bureau.


      4 De in het derde lid bedoelde vergunning wordt op verzoek verleend, onder door de inspecteur nader te stellen
      voorwaarden, bij voor bezwaar vatbare beschikking. De vergunning kan bij voor bezwaar vatbare beschikking worden
      ingetrokken indien de voorwaarden niet worden nageleefd.


      5 Degenen die betrokken zijn bij de aangifte, bedoeld in het eerste lid, onderdeel b, dragen zorg voor de nodige
      voorzieningen van technische en organisatorische aard tegen verlies of aantasting van de gegevens en tegen
      onbevoegde kennisneming, wijziging of verstrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel8
  - number: '9'
    text: |-
      Van de verplichting de in de uitnodiging tot het doen van aangifte van de heffing, bedoeld in [titel 2][ref1] van
      [hoofdstuk IV van de Meststoffenwet][ref2], gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud
      daarvan in te leveren of toe te zenden is vrijgesteld de heffingplichtige die vóór het tijdstip waarop de heffing
      moet worden betaald de inspecteur van het bureau heeft verzocht om uitnodiging tot het doen van aangifte van de
      heffing, bedoeld in [titel 1][ref3] van [hoofdstuk IV van de Meststoffenwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054
      [ref4]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
      - id: ref4
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '10'
    text: Het tijdvak waarover heffing moet worden betaald is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel10
  - number: '11'
    text: >-
      1 In bijzondere gevallen kan de inspecteur van het bureau het kalenderjaar onderverdelen in twee of meer
      tijdvakken, met dien verstande dat afwijkende tijdvakken altijd binnen hetzelfde kalenderjaar aanvangen en
      eindigen.


      2 Ten aanzien van de persoon of rechtspersoon die, of het samenwerkingverband van personen of rechtspersonen dat
      op enig tijdstip, anders dan tijdelijk, ophoudt heffingplichtige te zijn, geldt als tijdvak het op dat tijdstip
      verstreken gedeelte van het kalenderjaar.


      3 Ten aanzien van de persoon of rechtspersoon die, of het samenwerkingverband van personen of rechtspersonen
      dat eerst op enig tijdstip in de loop van het kalenderjaar heffingplichtige wordt, geldt als tijdvak het na dat
      tijdstip resterende gedeelte van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel11
  - number: '12'
    text: |-
      Ingeval een ander tijdvak dan een kalenderjaar geldt, worden de bepalingen van
      [hoofdstuk IV van de Meststoffenwet][ref1] die betrekking hebben op een kalenderjaar, naar tijdsevenredigheid
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '13'
    text: >-
      1 De inspecteur van het bureau kan één of meer voorlopige betalingen vorderen, met dien verstande dat niet meer dan
      één voorlopige betaling per kwartaal kan worden gevorderd.


      2 De inspecteur van het bureau stuurt de heffingplichtige een kennisgeving tot voorlopige betaling.


      3 Een voorlopige betaling bedraagt niet meer dan de naar verwachting over het op de dagtekening van de kennisgeving
      verstreken deel van het tijdvak verschuldigde heffing.


      4 De heffingplichtige voldoet het in de kennisgeving tot voorlopige betaling vermelde bedrag binnen een maand na
      dagtekening van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel13
  - number: '14'
    text: |-
      De berekening van het bedrag van de invorderingsrente, bedoeld in [artikel 28 van de Invorderingswet 1990][ref1],
      geschiedt overeenkomstig [hoofdstuk III van de Uitvoeringsregeling Invorderingswet 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004766#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0004766
        hoofdstuk: III
  - number: 14a
    text: |-
      Verrekening met de belastbare hoeveelheden van de voorgaande drie jaren als bedoeld in
      [artikel 43, eerste lid, van de Meststoffenwet][ref1] en verrekening met de belastbare hoeveelheden van de volgende
      kalenderjaren als bedoeld in het tweede lid van dat artikel geschieden uitsluitend indien de bij de verrekening
      betrokken kalenderjaren deel uitmaken van dezelfde, aaneengesloten reeks van jaren waarover steeds aangifte van de
      verschuldigde verfijnde mineralenheffingen, bedoeld in artikel 22 van die wet, is gedaan, en waarvoor steeds aan de
      in het laatstgenoemde artikel bedoelde regels is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
  - number: '15'
    text: |-
      De beschikking, bedoeld in [artikel 43, vijfde lid, van de Meststoffenwet][ref1] wordt niet afgegeven zolang:

      a. tegen de heffing, die op aangifte is voldaan, bezwaar of beroep kan worden ingesteld, dan wel op het bezwaar of
      beroep nog niet is beslist;

      b. de over het desbetreffende tijdvak of een eerder tijdvak verschuldigde heffing nog niet is voldaan en daarvoor
      evenmin door de inspecteur van het bureau uitstel van betaling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
  - number: 15a
    text: |-
      In afwijking van [artikel 15][ref1] kan voor het jaar 1998 of 1999 een beschikking tot voorlopige verrekening,
      tot voorlopige verlening van een uit verrekening voortvloeiende teruggaaf, of tot voorlopige vaststelling van een
      resterende belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof van minder dan nihil worden afgegeven, indien
      de over het jaar 1998 of 1999 verschuldigde heffing is voldaan, dan wel daarvoor door de inspecteur van het bureau
      uitstel van betaling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008480#Artikel15
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0008480
        artikel: '15'
  - number: '16'
    text: |-
      1 De inspecteur van het bureau verleent aan de heffingplichtige uitstel van betaling van de over het tijdvak
      verschuldigde verfijnde mineralenheffingen, indien met betrekking tot voorgaande kalenderjaren een vaststelling
      heeft plaatsgevonden van een belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof van minder dan nihil
      waarmee overeenkomstig [artikel 43 van de Meststoffenwet][ref1] kan worden verrekend.

      2 Uitstel wordt slechts verleend tot het beloop van het bedrag waarmee de over het tijdvak verschuldigde verfijnde
      mineralenheffingen door toepassing van verrekening zullen worden verminderd, na aftrek van de verschuldigde
      bestemmingsheffing.

      3 Uitstel wordt niet verleend indien:

      a. tegen de vaststelling, bedoeld in het eerste lid, bezwaar of beroep kan worden ingesteld, dan wel op het bezwaar
      of beroep nog niet is beslist;

      b. de aangifte waarvan uitstel wordt verzocht niet tijdig is gedaan;

      c. over een eerder tijdvak verschuldigde heffing nog niet is voldaan.

      4 In zoverre in afwijking van de voorgaande leden kan de inspecteur van het bureau op verzoek van de
      heffingplichtige voor het jaar 1999 uitstel van betaling verlenen op grond van een voorlopige vaststelling van de
      belastbare hoeveelheid met betrekking tot het jaar 1998, ook indien tegen deze voorlopige vaststelling nog bezwaar
      en beroep mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
  - number: '17'
    text: >-
      Houdt een persoon, rechtspersoon of samenwerkingsverband van personen of rechtspersonen op enig tijdstip, anders
      dan tijdelijk, op heffingplichtige te zijn, dan kan met diens schriftelijke toestemming de belastbare hoeveelheid
      fosfaat, onderscheidenlijk stikstof die na verrekening over de aan dat tijdstip voorafgegane tijdvakken resteert
      worden gebruikt door de heffingplichtige die het bedrijf als zodanig voortzet.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel17
  - number: '18'
    text: >-
      Voor verrekening komt niet in aanmerking een in een tijdvak vastgestelde belastbare hoeveelheid fosfaat van minder
      dan nihil, indien de veebezetting op het bedrijf van de heffingplichtige in dat tijdvak kleiner of gelijk is aan
      2,5 grootvee-eenheden per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel18
  - number: '19'
    text: |-
      De Uitvoeringsregeling overschotheffing wordt ingetrokken, met dien verstande dat zij van toepassing blijft op
      de heffing en invordering van de overschotheffing, bedoeld in [artikel 13 van de Meststoffenwet][ref1], zoals
      dit artikel luidde voor inwerkingtreding van artikel I van de wet van 2 mei 1997, houdende wijziging van de
      [Meststoffenwet][ref2] (Stb. 360).


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0004054
  - number: '20'
    text: Deze regeling treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling uitvoering heffingen en verrekening Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel21
