  - number: '2'
    text: >-
      In deze regeling wordt onder bureau verstaan: Bureau Heffingen van het Ministerie van Landbouw, Natuurbeheer en
      Visserij, te Assen.
    url: https://wetten.overheid.nl/BWBR0008480/2003-01-01#Artikel2
  - number: '3'
    text: |-
      1 De bevoegdheden van de hierna vermelde functionarissen, genoemd in de
      [Algemene wet inzake rijksbelastingen][ref1] en de [Invorderingswet 1990][ref2], gelden met betrekking tot de
      heffingen, bedoeld in [artikel 1][ref3], voor de daarachter genoemde functionarissen:



              a
              het bestuur van ‘s-Rijks belastingen en de directeur:

                de directeur Financieel-Economische Zaken van het Ministerie van Landbouw, Natuurbeheer en Visserij;



              b
               de inspecteur:

                de inspecteur van het bureau;



              c
              de ontvanger:

                de ontvanger van het bureau;



              d
              de ambtenaren van de rijksbelastingdienst:

                de ambtenaren van het bureau en de ambtenaren van de Algemene Inspectiedienst van het Ministerie van
      Landbouw, Natuurbeheer en Visserij.




      2 De door Onze Minister aangewezen functionaris, bedoeld in
      [artikel 42, eerste, vierde en zesde lid van de Meststoffenwet][ref4], is de ontvanger van het bureau.

      3 Als inspecteur van het bureau en als ontvanger van het bureau wordt aangewezen de Directeur Bureau Heffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
