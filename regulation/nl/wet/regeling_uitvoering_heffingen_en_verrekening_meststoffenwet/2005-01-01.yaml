  - number: '10'
    text: Het tijdvak waarover heffing moet worden betaald is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel10
  - number: '11'
    text: |-
      1 In bijzondere gevallen kan de inspecteur van de Dienst Regelingen het kalenderjaar onderverdelen in twee of
      meer tijdvakken, met dien verstande dat afwijkende tijdvakken altijd binnen hetzelfde kalenderjaar aanvangen en
      eindigen.

      2 Ten aanzien van de persoon of rechtspersoon die, of het samenwerkingverband van personen of rechtspersonen dat
      op enig tijdstip, anders dan tijdelijk, ophoudt heffingplichtige te zijn, geldt als tijdvak het op dat tijdstip
      verstreken gedeelte van het kalenderjaar.

      3 Ten aanzien van de persoon of rechtspersoon die, of het samenwerkingverband van personen of rechtspersonen
      dat eerst op enig tijdstip in de loop van het kalenderjaar heffingplichtige wordt, geldt als tijdvak het na dat
      tijdstip resterende gedeelte van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel11
  - number: '12'
    text: |-
      Ingeval een ander tijdvak dan een kalenderjaar geldt, worden de bepalingen van
      [hoofdstuk IV van de Meststoffenwet][ref1] die betrekking hebben op een kalenderjaar, naar tijdsevenredigheid
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '13'
    text: |-
      1 De inspecteur van de Dienst Regelingen kan één of meer voorlopige betalingen vorderen, met dien verstande dat
      niet meer dan één voorlopige betaling per kwartaal kan worden gevorderd.

      2 De inspecteur van de Dienst Regelingen stuurt de heffingplichtige een kennisgeving tot voorlopige betaling.

      3 Een voorlopige betaling bedraagt niet meer dan de naar verwachting over het op de dagtekening van de kennisgeving
      verstreken deel van het tijdvak verschuldigde heffing.

      4 De heffingplichtige voldoet het in de kennisgeving tot voorlopige betaling vermelde bedrag binnen een maand na
      dagtekening van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel13
  - number: '14'
    text: |-
      De berekening van het bedrag van de invorderingsrente, bedoeld in [artikel 28 van de Invorderingswet 1990][ref1],
      geschiedt overeenkomstig [hoofdstuk III van de Uitvoeringsregeling Invorderingswet 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004766#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0004766
        hoofdstuk: III
  - number: 14a
    text: |-
      Verrekening met de belastbare hoeveelheden van de voorgaande zes jaren als bedoeld in
      [artikel 43, eerste lid, van de Meststoffenwet][ref1] en verrekening met de belastbare hoeveelheden van de volgende
      kalenderjaren als bedoeld in het tweede lid van dat artikel geschieden uitsluitend indien de bij de verrekening
      betrokken kalenderjaren deel uitmaken van dezelfde, aaneengesloten reeks van jaren waarover steeds aangifte van
      de verschuldigde verfijnde mineralenheffingen, bedoeld in [artikel 22 van die wet][ref2], is gedaan, en waarvoor
      steeds aan de in het laatstgenoemde artikel bedoelde regels is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel22
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '22'
  - number: '15'
    text: |-
      De beschikking, bedoeld in [artikel 43, vijfde lid, van de Meststoffenwet][ref1] wordt niet afgegeven zolang:

      a. tegen de heffing, die op aangifte is voldaan, bezwaar kan worden ingesteld, dan wel op het bezwaar nog niet
      is beslist;

      b. de over het desbetreffende tijdvak of een eerder tijdvak verschuldigde heffing nog niet is voldaan en daarvoor
      evenmin door de inspecteur van de Dienst Regelingen uitstel van betaling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
  - number: '16'
    text: |-
      1 De inspecteur van de Dienst Regelingen verleent aan de heffingplichtige uitstel van betaling van de over
      het tijdvak verschuldigde verfijnde mineralenheffingen, indien met betrekking tot voorgaande kalenderjaren een
      vaststelling heeft plaatsgevonden van een belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof van minder dan
      nihil waarmee overeenkomstig [artikel 43 van de Meststoffenwet][ref1] kan worden verrekend.

      2 Uitstel wordt slechts verleend tot het beloop van het bedrag waarmee de over het tijdvak verschuldigde verfijnde
      mineralenheffingen door toepassing van verrekening zullen worden verminderd, na aftrek van de verschuldigde
      bestemmingsheffing.

      3 Uitstel wordt niet verleend indien:

      a. tegen de vaststelling, bedoeld in het eerste lid, bezwaar of beroep kan worden ingesteld, dan wel op het bezwaar
      of beroep nog niet is beslist;

      b. de aangifte waarvan uitstel wordt verzocht niet tijdig is gedaan;

      c. over een eerder tijdvak verschuldigde heffing nog niet is voldaan.

      4 In zoverre in afwijking van de voorgaande leden kan de inspecteur van de Dienst Regelingen op verzoek van de
      heffingplichtige voor het jaar 1999 uitstel van betaling verlenen op grond van een voorlopige vaststelling van de
      belastbare hoeveelheid met betrekking tot het jaar 1998, ook indien tegen deze voorlopige vaststelling nog bezwaar
      en beroep mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
  - number: '17'
    text: |-
      Houdt een persoon, rechtspersoon of samenwerkingsverband van personen of rechtspersonen op enig tijdstip, anders
      dan tijdelijk, op heffingplichtige te zijn, dan kan met diens schriftelijke toestemming de belastbare hoeveelheid
      fosfaat, onderscheidenlijk stikstof die na verrekening over de aan dat tijdstip voorafgegane tijdvakken resteert
      worden gebruikt door de heffingplichtige die het bedrijf als zodanig voortzet.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel17
  - number: 17a
    text: |-
      1 Ingeval bedrijven, anders dan tijdelijk, worden samengevoegd, wordt een belastbare hoeveelheid fosfaat,
      onderscheidenlijk stikstof, van minder dan nihil van elk van de oorspronkelijke bedrijven gebruikt ten behoeve
      van verrekening met de belastbare hoeveelheden van de andere bij de samenvoeging betrokken bedrijven of met de
      belastbare hoeveelheden van het door samenvoeging ontstane bedrijf.

      2 Een belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof, van minder dan nihil van het door samenvoeging
      ontstane bedrijf wordt gebruikt ten behoeve van verrekening met de belastbare hoeveelheden van de oorspronkelijke
      bedrijven.

      3 De voorwaarden en beperkingen gesteld bij [artikel 43 van de Meststoffenwet](onbekend) en de onderhavige titel
      zijn van overeenkomstige toepassing.

      4 Voor de toepassing van het eerste lid worden de aangiften van de heffingen ten aanzien van de oorspronkelijke
      bedrijven over het tijdvak voorafgaand aan de samenvoeging aangemerkt als een verzoek als bedoeld in [artikel 43,
      vijfde lid, van de Meststoffenwet](onbekend).
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel17a
  - number: '18'
    text: |-
      Voor verrekening komt niet in aanmerking een in een tijdvak vastgestelde belastbare hoeveelheid fosfaat van minder
      dan nihil, indien de veebezetting op het bedrijf van de heffingplichtige in dat tijdvak kleiner of gelijk is aan
      2,5 grootvee-eenheden per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel18
  - number: 18a
    text: |-
      1 Indien de toepassing van de forfaits, bedoeld in [artikel D6 van bijlage D van de Meststoffenwet][ref1],
      voor de diercategorieën 400, 401, 402, 403, 404, 405, 406, 407, 410 en 411, als gewijzigd bij
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _ (Stb. 542), met betrekking tot de jaren 1998 tot en met 2002 leidt tot een verlaging van de belastbare
      hoeveelheid fosfaat, onderscheidenlijk stikstof, kan de belastbare hoeveelheid door de inspecteur worden herzien
      bij voor bezwaar vatbare beschikking.

      2 De in het eerste lid bedoelde herziene belastbare hoeveelheid wordt vastgesteld op basis van het gemiddelde
      aantal in het desbetreffende kalenderjaar op het bedrijf gehouden varkens van de onderscheiden diercategorieën,
      genoemd in [bijlage A van de Meststoffenwet][ref3], en de correctiefactoren, uitgedrukt in kilogrammen fosfaat,
      onderscheidenlijk stikstof, als opgenomen in de bijlage bij deze regeling.


