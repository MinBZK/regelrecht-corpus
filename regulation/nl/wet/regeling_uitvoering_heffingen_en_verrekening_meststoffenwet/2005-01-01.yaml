  - number: '6'
    text: |-
      1 Het uitnodigen tot het doen van aangifte wordt gedaan door:

      a. het uitreiken of toezenden van een aangiftebiljet;

      b. het uitreiken of toezenden van een aangiftediskette.

      2 Het eerste lid, onderdeel b, vindt slechts toepassing ten aanzien van de heffingplichtige aan wie een vergunning
      als bedoeld in [artikel 8, vierde lid][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008480#Artikel8
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008480
        artikel: '8'
  - number: '7'
    text: |-
      1 De heffingplichtige die niet reeds is uitgenodigd tot het doen van aangifte verzoekt vóór het tijdstip waarop de
      heffing moet worden voldaan de inspecteur van de Dienst Regelingen om uitnodiging tot het doen van aangifte. Deze
      verplichting geldt ook indien de belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof nihil of minder dan
      nihil is.

      2 De verplichting, bedoeld in het eerste lid, geldt mede voor de in de [artikelen 43][ref1] en
      [44, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel44
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '44'
  - number: '8'
    text: |-
      1 Aangifte wordt gedaan door:

      a. het inleveren of toezenden van het uitgereikte of toegezonden aangiftebiljet, dat is ingevuld en ondertekend op
      de daarbij aangegeven wijze, met de daarbij gevraagde bescheiden;

      b. het overeenkomstig de voorwaarden, bedoeld in het vierde lid, toezenden of inleveren van de uitgereikte
      aangiftediskette of het overeenkomstig die voorwaarden op elektronische wijze toezenden van de in de
      aangiftediskette gevraagde gegevens.

      2 Indien het eerste lid, onderdeel b, toepassing vindt, worden de gevraagde bescheiden afzonderlijk ingeleverd
      of toegezonden.

      3 Het doen van aangifte op de wijze bedoeld in het eerste lid, onderdeel b, is slechts toegestaan met een daaraan
      voorafgaande vergunning van de inspecteur van de Dienst Regelingen.

      4 De in het derde lid bedoelde vergunning wordt op verzoek verleend, onder door de inspecteur nader te stellen
      voorwaarden, bij voor bezwaar vatbare beschikking. De vergunning kan bij voor bezwaar vatbare beschikking worden
      ingetrokken indien de voorwaarden niet worden nageleefd.

      5 Degenen die betrokken zijn bij de aangifte, bedoeld in het eerste lid, onderdeel b, dragen zorg voor de nodige
      voorzieningen van technische en organisatorische aard tegen verlies of aantasting van de gegevens en tegen
      onbevoegde kennisneming, wijziging of verstrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel8
  - number: '9'
    text: |-
      Van de verplichting de in de uitnodiging tot het doen van aangifte van de heffing, bedoeld in [titel 2][ref1] van
      [hoofdstuk IV van de Meststoffenwet][ref2], gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud
      daarvan in te leveren of toe te zenden is vrijgesteld de heffingplichtige die vóór het tijdstip waarop de heffing
      moet worden betaald de inspecteur van de Dienst Regelingen heeft verzocht om uitnodiging tot het doen van aangifte
      van de heffing, bedoeld in [titel 1][ref3] van [hoofdstuk IV van de Meststoffenwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054
      [ref4]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
      - id: ref4
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: 9a
    text: |-
      1 Van de verplichting tot het doen van aangifte van de heffing, bedoeld in de [artikelen 21][ref1]
      en [28 van de Meststoffenwet][ref2] in samenhang met [artikel 41 van de Meststoffenwet][ref3] en
      [artikel 8 van de Algemene wet inzake rijksbelastingen][ref4], is vrijgesteld de heffingplichtige die met
      betrekking tot het desbetreffende tijdvak voldoet aan elk van de volgende voorwaarden:

      a. de belastbare hoeveelheid fosfaat en de belastbare hoeveelheid stikstof zijn nihil of minder dan nihil, en

      b. de stikstofproductie op het bedrijf is ten hoogste 170 kilogram per hectare van de tot het bedrijf behorende
      oppervlakte landbouwgrond.

      2 De stikstofproductie, bedoeld in het eerste lid, onderdeel b, wordt vastgesteld op basis van het gemiddelde
      aantal in het desbetreffende kalenderjaar gehouden, uitgeschaarde of tijdelijk elders ter weiding ondergebrachte
      dieren van de onderscheiden diercategorieën en op basis van de forfaitaire productienormen, uitgedrukt in
      kilogrammen stikstof per dier per jaar, die zijn opgenomen in [bijlage F bij de Meststoffenwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel9a
