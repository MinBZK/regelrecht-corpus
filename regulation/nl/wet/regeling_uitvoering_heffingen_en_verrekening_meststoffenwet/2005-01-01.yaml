  - number: '19'
    text: |-
      De Uitvoeringsregeling overschotheffing wordt ingetrokken, met dien verstande dat zij van toepassing blijft op
      de heffing en invordering van de overschotheffing, bedoeld in [artikel 13 van de Meststoffenwet][ref1], zoals
      dit artikel luidde voor inwerkingtreding van artikel I van de wet van 2 mei 1997, houdende wijziging van de
      [Meststoffenwet][ref2] (Stb. 360).


