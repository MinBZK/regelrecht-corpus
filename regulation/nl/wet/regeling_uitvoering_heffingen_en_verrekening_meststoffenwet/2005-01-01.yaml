  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur
      en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 De bevoegdheden van de hierna vermelde functionarissen, genoemd in de
      [Algemene wet inzake rijksbelastingen][ref1] en de [Invorderingswet 1990][ref2], gelden met betrekking tot de
      heffingen, bedoeld in [artikel 1][ref3], voor de daarachter genoemde functionarissen:



              a
              het bestuur van ‘s-Rijks belastingen en de directeur:

                de directeur Financieel-Economische Zaken van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



              b
               de inspecteur:

                de inspecteur van de Dienst Regelingen;



              c
              de ontvanger:

                de ontvanger van de Dienst Regelingen;



              d
              de ambtenaren van de rijksbelastingdienst:

                de ambtenaren van de Dienst Regelingen en de ambtenaren van de Algemene Inspectiedienst van het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit.




      2 De door Onze Minister aangewezen functionaris, bedoeld in
      [artikel 42, eerste, vierde en zesde lid van de Meststoffenwet][ref4], is de ontvanger van de Dienst Regelingen.

      3 Als inspecteur van de Dienst Regelingen en als ontvanger van de Dienst Regelingen wordt aangewezen de Directeur
      Dienst Regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
