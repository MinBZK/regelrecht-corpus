  - number: '4'
    text: De standplaats van de inspecteur van de Dienst Regelingen is Assen.
    url: https://wetten.overheid.nl/BWBR0008480/2005-01-01#Artikel4
  - number: '5'
    text: |-
      De verplichtingen die ingevolge de [artikelen 47][ref1], [47b][ref2], [48][ref3], [49][ref4], [50][ref5],
      [53][ref6] en [55 van de Algemene wet inzake rijksbelastingen][ref7] bestaan jegens de inspecteur van de Dienst
      Regelingen, gelden mede jegens de door de inspecteur van de Dienst Regelingen aangewezen ambtenaren van de Dienst
      Regelingen en jegens de ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit.


