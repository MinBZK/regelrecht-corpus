---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verordening_algemene_bepalingen_productschap_vis_2000
regulatory_layer: WET
publication_date: '2007-04-13'
valid_from: '2007-01-01'
bwb_id: BWBR0011125
url: https://wetten.overheid.nl/BWBR0011125/2007-01-01
preamble:
  text: |-
    gelet op de artikelen 93 en 95 van de Wet op de Bedrijfsorganisatie en de artikelen 5, 6 en 7 van de
    Instellingsverordening Productschap Vis op 27 januari 2000 de navolgende verordening vastgesteld.
  url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze verordening wordt verstaan onder:







                    Productschap


                    :


                    het Productschap Vis;




                    Bestuur


                    :


                    het bestuur van het productschap;




                    Voorzitter


                    :


                    de voorzitter van het productschap;




                    Verwerking van gegevens


                    :


                    elke handeling of elk geheel van handelingen met betrekking tot gegevens, waaronder in ieder geval
      het verzamelen, vastleggen, ordenen, bewaren, bij werken, wijzigen, opvragen, raadplegen, gebruiken, verstrekken
      door middel van doorzending, verspreiding of enige andere vorm van terbeschikkingstelling, samenbrengen, met elkaar
      in verband brengen, alsmede het afschermen, uitwissen of vernietigen van gegevens.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel1
  - number: '2.1'
    text: 'Degene, die een onderneming drijft, waarvoor het productschap is ingesteld, is verplicht:'
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: 2.1.1
    text: |-
      de door of vanwege het productschap met betrekking tot het voeren ener administratie gegeven voorschriften na te
      komen en een zodanige administratie volledig en naar waarheid bij te houden en te bewaren;
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: 2.1.2
    text: |-
      prompt, volledig en naar waarheid de vragen te beantwoorden, welke hem door of vanwege het productschap betreffende
      de administratie van en de werkzaamheden in zijn onderneming worden gesteld, zo mede op eerste aanvrage door het
      productschap verlangde boeken en/of bescheiden over te leggen en/of tegen ontvangst bewijs in te leveren of in
      te zenden;
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: 2.1.3
    text: |-
      de schriftelijke kennisgevingen, hem door of vanwege het productschap verstrekt, krachtens welke hem enige
      bevoegdheid wordt toegekend, ter plaatse, waar het bedrijf wordt uitgeoefend, te bewaren en deze stukken op een
      daartoe strekkend verzoek van of vanwege het productschap te vertonen en/of tegen ontvangstbewijs in te leveren;
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: 2.1.4
    text: |-
      indien en voor zover het bestuur zulks bij uitvoeringsbesluit met betrekking tot een of meer groepen van
      ondernemingen bepaalt:
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: 2.1.4.a
    text: |-
      in geval van vestiging van een onderneming binnen veertien dagen na het tijdstip van vestiging, dan wel indien op
      het tijdstip van in werking treden van een desbetreffend uitvoeringsbesluit een onderneming reeds is gevestigd,
      binnen veertien dagen na laatstgenoemd tijdstip, aan het productschap schriftelijk opgave te verstrekken van
      de naam (en voornamen) van degene(n), die de onderneming drijft of drijven, de handelsnaam en rechtsvorm van
      de onderneming, de plaats en het tijdstip van de vestiging van de onderneming en haar filialen, alsmede het
      kantooradres van de onderneming, onderscheidenlijk:
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: 2.1.4.b
    text: |-
      telkenmale, wanneer zich in de sub a bedoelde gegevens wijzigen voordoen, van elke desbetreffende wijziging binnen
      veertien dagen na het intreden daarvan schriftelijke opgave te doen aan het productschap;
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: 2.1.4.c
    text: |-
      toe te staan, dat personen, die daartoe door de voorzitter, namens het bestuur, zijn aangewezen en zich desverlangd
      als zodanig kunnen legitimeren, de onderneming inspecteren en de daarin aanwezige bedrijfsmiddelen en voorraden
      bezichtigen en opnemen, hun daartoe de vrije gelegenheid te geven en hen desverlangd daarbij behulpzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      De in lid 1, met uitzondering van het bepaalde onder 4, gestelde regelen binden naast de ondernemers mede de
      bij die ondernemingen, waarvoor het productschap is ingesteld, werkzame personen, alsmede andere natuurlijke
      en rechtspersonen, voor zover deze andere personen handelingen verrichten, welke bedrijfsmatig plegen te worden
      verricht in de ondernemingen waarvoor het productschap is ingesteld.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: '3.1'
    text: |-
      De krachtens het bepaalde in [artikel 2][ref1] door het productschap verwerkte gegevens mogen, voor zover bij of
      krachtens de wet niet anders is bepaald, zonder toestemming van de betrokken belanghebbende:


      [ref1]: https://wetten.overheid.nl/BWBR0011125#Artikel2
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011125
        artikel: '2'
  - number: 3.1.a
    text: niet verder worden verwerkt op een wijze die onverenigbaar is met de doeleinden waarvoor zij zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel3
  - number: 3.1.b
    text: |-
      slechts worden verwerkt ter vervulling van een taak van het productschap dan wel het bestuursorgaan waaraan de
      gegevens worden verstrekt of ter verdere verwerking voor historische, statistische of wetenschappelijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel3
  - number: 3.1.c
    text: |-
      niet onder vermelding of aanduiding van de persoon en/of de onderneming, waarop zij betrekking hebben, worden
      verwerkt ten behoeve van en/of aan anderen dan de voorzitter, de secretaris van het productschap, het personeel van
      het secretariaat van het productschap, zo mede de door het bestuur met de controle op het financiële beheer van het
      productschap belaste accountant en zijn personeel, voor zover het kennis nemen van de gegevens voor die controle
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      Verwerking van gegevens, als bedoeld in het eerste lid, blijft ook achterwege in gevallen, waarin uit de aard
      der gegevens of uit één of meer andere omstandigheden zou kunnen blijken, op welke persoon en/of onderneming de
      gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het geven van voorschriften, als bedoeld in [artikel 2, lid 1, onder 1][ref1], en het geven van toepassing aan het
      bepaalde in [artikel 2, lid 1, onder 2][ref2], geschiedt slechts met betrekking tot een doel, hetwelk verband houdt
      met de vervulling van de taak van het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011125#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011125#Artikel2
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011125
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011125
        artikel: '2'
  - number: '4'
    text: |-
      Op overtreding van het bij of krachtens [artikel 2][ref1] van deze verordening bepaalde kunnen tuchtrechtelijke
      maatregelen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011125#Artikel2
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011125
        artikel: '2'
  - number: '5.1'
    text: |-
      De voorzitter is, namens het bestuur, belast met de uitvoering van het of bij krachtens deze verordening bepaalde
      en in verband daarmede bevoegd:
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel5
  - number: 5.1.a
    text: |-
      nadere regels vast te stellen ter uitoefening van het bepaalde ten aanzien van de verwerking van gegevens als
      bedoeld in [artikel 3][ref1] van deze verordening;


      [ref1]: https://wetten.overheid.nl/BWBR0011125#Artikel3
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011125
        artikel: '3'
  - number: 5.1.b
    text: |-
      voor bepaalde gevallen of groepen van gevallen, van het bij of krachtens deze verordening bepaalde geheel of
      gedeeltelijke ontheffing te verlenen en aan zodanige ontheffing(en) een of meer voorwaarden te verbinden, bij
      welker niet-, niet tijdige of niet behoorlijke nakoming de desbetreffende ontheffing geacht wordt niet te zijn
      verleend.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel5
  - number: '6'
    text: |-
      Krachtens de [Verordening Algemene Bepalingen Productschap Vis 1958](onbekend) vastgestelde regels en andere
      besluiten blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel6
  - number: '7.1'
    text: Deze verordening treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel7
  - number: '7.2'
    text: De Verordening Algemene Bepalingen Productschap Vis 1958 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel7
  - number: '7.3'
    text: Deze verordening kan worden aangehaald als Verordening Algemene Bepalingen Productschap Vis 2000.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel7
