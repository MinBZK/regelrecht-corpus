preamble:
  text: |-
    gelet op de artikelen 93 en 95 van de Wet op de Bedrijfsorganisatie en de artikelen 5, 6 en 7 van de
    Instellingsverordening Productschap Vis op 27 januari 2000 de navolgende verordening vastgesteld.
  url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze verordening wordt verstaan onder:









                    Productschap


                    :


                    het Productschap Vis;




                    Bestuur


                    :


                    het bestuur van het productschap;




                    Voorzitter


                    :


                    de voorzitter van het productschap;




                    Verwerking van gegevens


                    :


                    elke handeling of elk geheel van handelingen met betrekking tot gegevens, waaronder in ieder geval
      het verzamelen, vastleggen, ordenen, bewaren, bij werken, wijzigen, opvragen, raadplegen, gebruiken, verstrekken
      door middel van doorzending, verspreiding of enige andere vorm van terbeschikkingstelling, samenbrengen, met elkaar
      in verband brengen, alsmede het afschermen, uitwissen of vernietigen van gegevens.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel1
  - number: '2'
    text: |-
      1 Degene, die een onderneming drijft, waarvoor het productschap is ingesteld, is verplicht:

      1. de door of vanwege het productschap met betrekking tot het voeren ener administratie gegeven voorschriften na te
      komen en een zodanige administratie volledig en naar waarheid bij te houden en te bewaren;

      2. prompt, volledig en naar waarheid de vragen te beantwoorden, welke hem door of vanwege het productschap
      betreffende de administratie van en de werkzaamheden in zijn onderneming worden gesteld, zo mede op eerste aanvrage
      door het productschap verlangde boeken en/of bescheiden over te leggen en/of tegen ontvangst bewijs in te leveren
      of in te zenden;

      3. de schriftelijke kennisgevingen, hem door of vanwege het productschap verstrekt, krachtens welke hem enige
      bevoegdheid wordt toegekend, ter plaatse, waar het bedrijf wordt uitgeoefend, te bewaren en deze stukken op een
      daartoe strekkend verzoek van of vanwege het productschap te vertonen en/of tegen ontvangstbewijs in te leveren;

      4. indien en voor zover het bestuur zulks bij uitvoeringsbesluit met betrekking tot een of meer groepen van
      ondernemingen bepaalt:

      a. in geval van vestiging van een onderneming binnen veertien dagen na het tijdstip van vestiging, dan wel indien
      op het tijdstip van in werking treden van een desbetreffend uitvoeringsbesluit een onderneming reeds is gevestigd,
      binnen veertien dagen na laatstgenoemd tijdstip, aan het productschap schriftelijk opgave te verstrekken van
      de naam (en voornamen) van degene(n), die de onderneming drijft of drijven, de handelsnaam en rechtsvorm van
      de onderneming, de plaats en het tijdstip van de vestiging van de onderneming en haar filialen, alsmede het
      kantooradres van de onderneming, onderscheidenlijk:

      b. telkenmale, wanneer zich in de sub a bedoelde gegevens wijzigen voordoen, van elke desbetreffende wijziging
      binnen veertien dagen na het intreden daarvan schriftelijke opgave te doen aan het productschap;

      c. toe te staan, dat personen, die daartoe door de voorzitter, namens het bestuur, zijn aangewezen en zich
      desverlangd als zodanig kunnen legitimeren, de onderneming inspecteren en de daarin aanwezige bedrijfsmiddelen en
      voorraden bezichtigen en opnemen, hun daartoe de vrije gelegenheid te geven en hen desverlangd daarbij behulpzaam
      te zijn.

      2 De in lid 1, met uitzondering van het bepaalde onder 4, gestelde regelen binden naast de ondernemers mede de
      bij die ondernemingen, waarvoor het productschap is ingesteld, werkzame personen, alsmede andere natuurlijke
      en rechtspersonen, voor zover deze andere personen handelingen verrichten, welke bedrijfsmatig plegen te worden
      verricht in de ondernemingen waarvoor het productschap is ingesteld.
    url: https://wetten.overheid.nl/BWBR0011125/2007-01-01#Artikel2
  - number: '3'
    text: |-
      1 De krachtens het bepaalde in [artikel 2][ref1] door het productschap verwerkte gegevens mogen, voor zover bij of
      krachtens de wet niet anders is bepaald, zonder toestemming van de betrokken belanghebbende:

      a. niet verder worden verwerkt op een wijze die onverenigbaar is met de doeleinden waarvoor zij zijn verkregen;

      b. slechts worden verwerkt ter vervulling van een taak van het productschap dan wel het bestuursorgaan waaraan de
      gegevens worden verstrekt of ter verdere verwerking voor historische, statistische of wetenschappelijke doeleinden;

      c. niet onder vermelding of aanduiding van de persoon en/of de onderneming, waarop zij betrekking hebben, worden
      verwerkt ten behoeve van en/of aan anderen dan de voorzitter, de secretaris van het productschap, het personeel van
      het secretariaat van het productschap, zo mede de door het bestuur met de controle op het financiële beheer van het
      productschap belaste accountant en zijn personeel, voor zover het kennis nemen van de gegevens voor die controle
      noodzakelijk is.

      2 Verwerking van gegevens, als bedoeld in het eerste lid, blijft ook achterwege in gevallen, waarin uit de aard
      der gegevens of uit één of meer andere omstandigheden zou kunnen blijken, op welke persoon en/of onderneming de
      gegevens betrekking hebben.

      3 Het geven van voorschriften, als bedoeld in [artikel 2, lid 1, onder 1][ref2], en het geven van toepassing aan
      het bepaalde in [artikel 2, lid 1, onder 2][ref3], geschiedt slechts met betrekking tot een doel, hetwelk verband
      houdt met de vervulling van de taak van het productschap.


