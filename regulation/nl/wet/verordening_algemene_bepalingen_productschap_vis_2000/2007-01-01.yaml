  - number: '5'
    text: |-
      1 De voorzitter is, namens het bestuur, belast met de uitvoering van het of bij krachtens deze verordening bepaalde
      en in verband daarmede bevoegd:

      a. nadere regels vast te stellen ter uitoefening van het bepaalde ten aanzien van de verwerking van gegevens als
      bedoeld in [artikel 3][ref1] van deze verordening;

      b. voor bepaalde gevallen of groepen van gevallen, van het bij of krachtens deze verordening bepaalde geheel of
      gedeeltelijke ontheffing te verlenen en aan zodanige ontheffing(en) een of meer voorwaarden te verbinden, bij
      welker niet-, niet tijdige of niet behoorlijke nakoming de desbetreffende ontheffing geacht wordt niet te zijn
      verleend.


