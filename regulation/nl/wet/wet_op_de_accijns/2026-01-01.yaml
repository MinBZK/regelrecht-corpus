  - number: '85'
    text: |-
      1 Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, worden bepaald dat
      accijnsgoederen voorhanden mogen zijn in een douane-entrepot.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel85
  - number: '86'
    text: |-
      1 De inspecteur kan vereenvoudigde procedures vaststellen voor veelvuldige en regelmatige overbrengingen van
      accijnsgoederen die op de grondgebieden van twee of meer lidstaten plaatsvinden.

      2 De vereenvoudigde procedures, bedoeld in het eerste lid, worden vastgesteld in overleg met de desbetreffende
      lidstaten en vastgelegd in een of meer overeenkomsten.

      3 Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld ten aanzien van de toepassing
      van de vereenvoudigde procedures en overeenkomsten, bedoeld in het tweede lid.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel86
  - number: '89'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels
      worden gesteld ter aanvulling van de in deze wet geregelde onderwerpen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel89
  - number: '90'
    text: |-
      1 Het is niet toegestaan een distilleertoestel te produceren of voorhanden te hebben zonder een daartoe strekkende
      vergunning van de inspecteur.

      2 Onder een distilleertoestel wordt verstaan elk toestel - ook indien dit niet gereed is voor dadelijk gebruik -
      dat geschikt is voor het afscheiden van ethanol uit ethanolhoudende stoffen.

      3 De vergunning wordt op verzoek verleend.

      4 Het verlenen, het aanpassen en het intrekken van een vergunning alsmede het afwijzen van een verzoek daartoe
      geschieden bij voor bezwaar vatbare beschikking.

      5 Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het zesde lid bedoelde kennisgeving.

      6 Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het vijfde lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.

      7 De vergunning voor het produceren of voorhanden hebben van een distilleertoestel kan door de inspecteur worden
      ingetrokken ingeval:

      a. niet wordt voldaan aan de in de vergunning opgenomen voorwaarden;

      b. misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;

      c. de vergunninghouder onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake
      de accijns;

      d. de vergunninghouder in staat van faillissement verkeert of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is;

      e. de vergunninghouder daarom verzoekt;

      f. de vergunning gedurende een aaneengesloten periode van twaalf maanden niet is gebruikt; of

      g. het distilleertoestel niet meer voorhanden is.

      8 Bij ministeriële regeling kunnen:

      a. regels worden gesteld met betrekking tot de in de vergunning op te nemen voorwaarden;

      b. distilleertoestellen worden aangewezen waarvoor geen vergunning is vereist.

      9 [Artikel 83][ref1] is van overeenkomstige toepassing op plaatsen waar distilleertoestellen worden geproduceerd of
      voorhanden zijn.

      10 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is van toepassing op de vergunning als bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
