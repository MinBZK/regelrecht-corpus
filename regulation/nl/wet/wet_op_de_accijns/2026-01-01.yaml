  - number: '5'
    text: |-
      1 Het is niet toegestaan:

      a. een accijnsgoed te produceren of verwerken buiten een accijnsgoederenplaats die voor dat soort accijnsgoed als
      zodanig is aangewezen;

      b. een accijnsgoed voorhanden of in opslag te hebben dat niet overeenkomstig de bepalingen van deze wet in de
      heffing is betrokken.

      2 Het verbod als bedoeld in het eerste lid, onderdeel a, is niet van toepassing indien
      het produceren of verwerken geschiedt overeenkomstig de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1].

      3 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt ontheffing verleend van de
      in het eerste lid bedoelde verboden voor:

      a. het produceren of verwerken van accijnsgoederen uit andere accijnsgoederen, waarbij het accijnsbedrag dat
      de eerstbedoelde accijnsgoederen vertegenwoordigen niet hoger is dan het accijnsbedrag dat de accijnsgoederen
      vertegenwoordigen waaruit zij zijn geproduceerd of verwerkt;

      b. het produceren of verwerken van accijnsgoederen waarvoor een vrijstelling van accijns geldt op de voet van
      [artikel 65][ref2];

      c. het thuis produceren van bier en wijn door particulieren, voor zover die goederen worden aangewend voor eigen
      gebruik;

      d. het produceren of verwerken en het voorhanden of in opslag hebben van andere minerale oliën dan bedoeld in het
      vierde lid, mits deze minerale oliën niet op grond van [artikel 28][ref3] worden gelijkgesteld met minerale oliën
      waarvoor in [artikel 27][ref4] een tarief is vastgesteld;

      e. het handmatig produceren van een sigaret in de persoonlijke sfeer, voor zover die sigaret wordt aangewend voor
      eigen gebruik, daaronder begrepen het door middel van een eenvoudige, niet-industriële handeling in een huls van
      sigarettenpapier schuiven of met sigarettenpapier omhullen van rooktabak.

      4 De in het derde lid, onderdeel d, bedoelde minerale oliën zijn de producten van de GN-codes:

      a. 1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;

      b. 2707 10, 2707 20, 2707 30 en 2707 50;

      c. 2710 12 tot en met 2710 19 68 en 2710 20 tot en met 2710 20 39 en 2710 20 90 – alleen voor producten waarvan
      minder dan 90% van het volume (distillatieverliezen inbegrepen) overdistilleert bij 210°C en 65% of meer van
      het volume (distillatieverliezen inbegrepen) overdistilleert bij 250°C (methode EN ISO 3405 of methode ASTM
      D86) –; GN-codes 2710 12 21, 2710 12 25, 2710 19 29 en 2710 20 90 – alleen voor producten waarvan minder dan
      90% van het volume (distillatieverliezen inbegrepen) overdistilleert bij 210°C en 65% of meer van het volume
      (distillatieverliezen inbegrepen) overdistilleert bij 250°C (methode EN ISO 3405 of methode ASTM D86) – alleen
      indien deze in bulk worden vervoerd;

      d. 2711, met uitzondering van de producten van de GN-codes 2711 11, 2711 21 en 2711 29;

      e. 2901 10;

      f. 2902 20, 2902 30, 2902 41, 2902 42, 2902 43 en 2902 44;

      g. 2905 11 00, die niet langs synthetische weg zijn verkregen en die zijn bestemd om te worden gebruikt als
      motorbrandstof of als brandstof voor verwarming;

      h. 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00;

      i. 3824 99 86, 3824 99 92 – met uitzondering van roestwerende preparaten die aminen als werkzame bestanddelen
      bevatten en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van dergelijke
      producten –, 3824 99 93, 3824 99 96 – met uitzondering van roestwerende preparaten die aminen als werkzame
      bestanddelen bevatten en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van
      dergelijke producten –, 3826 00 10 en 3826 00 90, indien deze zijn bestemd om te worden gebruikt als motorbrandstof
      of als brandstof voor verwarming.


