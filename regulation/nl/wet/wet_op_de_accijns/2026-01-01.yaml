  - number: '60'
    text: |-
      1 De aan het stellen, het wijzigen en het opheffen van de zekerheid verbonden kosten komen ten laste van degene die
      zekerheid moet stellen.

      2 Ingeval de zekerheid wordt gesteld in geld wordt daarover een rente vergoed die gelijk is aan de
      herfinancieringsrente, te weten de minimale biedrente die de Europese Centrale Bank hanteert voor
      basisherfinancieringstransacties.

      3 Voor de toepassing van het tweede lid wordt het over een kalendermaand te vergoeden rentebedrag berekend naar de
      rente die geldt bij de aanvang van die maand.
