  - number: '70'
    text: |-
      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      accijns verleend:

      a. voor accijnsgoederen in gevallen waarin deze accijnsgoederen op de voet van [artikel 65][ref1] zouden kunnen
      worden betrokken met vrijstelling;

      b. ter zake van de levering van minerale oliën waarvoor op de voet van [artikel 66][ref2] aanspraak op een
      vrijstelling zou bestaan;

      c. ter zake van accijnsgoederen waarvoor op de voet van [artikel 66a][ref3] aanspraak op vrijstelling zou bestaan.

      2 De teruggaaf als bedoeld in het eerste lid, onderdeel a, wordt verleend aan degene die een vergunning heeft
      ingevolge [artikel 65, derde lid][ref4].

      3 De teruggaaf als bedoeld in het eerste lid, onderdelen b en c, wordt verleend aan degene die de levering heeft
      verricht.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel65
