  - number: 2c
    text: |-
      1 Indien tijdens een overbrenging van accijnsgoederen onder een accijnsschorsingsregeling in Nederland een
      onregelmatigheid heeft plaatsgevonden die resulteerde in uitslag tot verbruik van deze goederen als bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], vindt de uitslag tot verbruik plaats in Nederland.

      2 Indien in Nederland wordt geconstateerd dat zich tijdens een overbrenging van accijnsgoederen als bedoeld in
      het eerste lid een onregelmatigheid heeft voorgedaan die resulteerde in uitslag tot verbruik van deze goederen als
      bedoeld in [artikel 2, eerste lid, onderdeel a][ref2], en er niet kan worden vastgesteld waar de onregelmatigheid
      plaatsvond, wordt deze geacht te hebben plaatsgevonden in Nederland op het tijdstip waarop de onregelmatigheid
      werd geconstateerd.

      3 Indien vanuit Nederland onder een accijnsschorsingsregeling overgebrachte accijnsgoederen niet op de plaats van
      bestemming zijn aangekomen en er tijdens de overbrenging geen onregelmatigheid is geconstateerd die resulteerde
      in uitslag tot verbruik van de accijnsgoederen als bedoeld in [artikel 2, eerste lid, onderdeel a][ref3],
      wordt de onregelmatigheid geacht te hebben plaatsgevonden in Nederland op het tijdstip van aanvang van de
      overbrenging, tenzij binnen een termijn van vier maanden na de aanvang van de overbrenging als bedoeld in
      [artikel 2b, eerste lid][ref4], ten genoegen van de inspecteur wordt aangetoond dat de overbrenging is geëindigd
      overeenkomstig artikel 2b, tweede lid, of dat is vastgesteld waar de onregelmatigheid plaatsvond.

      4 Indien de persoon die de in [artikel 56][ref5] bedoelde zekerheid heeft gesteld, niet op de hoogte was of
      mogelijk niet op de hoogte was van het feit dat de goederen niet ter bestemming zijn aangekomen, wordt hem een
      termijn van een maand, te rekenen vanaf het tijdstip van de verstrekking van die informatie door de inspecteur,
      gegund om het eindigen van de overbrenging overeenkomstig [artikel 2b, tweede lid][ref6], of de plaats waar de
      onregelmatigheid heeft plaatsgevonden, aan te tonen.

      5 Indien in de in het tweede en derde lid bedoelde situaties binnen een termijn van drie jaar vanaf de datum
      waarop de overbrenging overeenkomstig [artikel 2b, eerste lid][ref7], is aangevangen, wordt vastgesteld dat
      de onregelmatigheid daadwerkelijk heeft plaatsgevonden in een andere lidstaat, is de accijns in die lidstaat
      verschuldigd.

      6 Indien de accijns in een andere lidstaat verschuldigd is geworden op grond van het feit dat de onregelmatigheid
      werd geacht te hebben plaatsgevonden in die lidstaat en binnen een termijn van drie jaar vanaf de datum
      waarop de overbrenging overeenkomstig [artikel 2b, eerste lid][ref8], is aangevangen, wordt vastgesteld dat de
      onregelmatigheid daadwerkelijk heeft plaatsgevonden in Nederland, is het eerste lid van toepassing.

      7 Voor de toepassing van dit artikel wordt onder onregelmatigheid verstaan, een andere dan de in
      [artikel 2, vijfde lid][ref9], bedoelde situatie die zich tijdens een overbrenging van accijnsgoederen onder een
      accijnsschorsingsregeling voordoet en als gevolg waarvan een overbrenging of een onderdeel van een overbrenging van
      accijnsgoederen niet overeenkomstig [artikel 2b, tweede lid][ref10], is geëindigd.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


