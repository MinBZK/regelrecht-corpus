  - number: '50'
    text: |-
      1 Het verlenen, het aanpassen en het intrekken van een vergunning voor een accijnsgoederenplaats alsmede het
      afwijzen van een verzoek daartoe geschieden bij voor bezwaar vatbare beschikking.

      2 Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het derde lid bedoelde kennisgeving.

      3 Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het tweede lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50
  - number: 50a
    text: |-
      1 Een onderneming wordt alleen als geregistreerde geadresseerde aangemerkt indien daartoe een vergunning is
      verstrekt door de inspecteur.

      2 Een vergunning als geregistreerde geadresseerde wordt met betrekking tot tabaksproducten uitsluitend verleend,
      indien deze producten in een andere lidstaat van Nederlandse accijnszegels zijn voorzien.

      3 Voor een geregistreerde geadresseerde die slechts incidenteel accijnsgoederen ontvangt, wordt de vergunning,
      bedoeld in het eerste lid, verleend voor een welomschreven hoeveelheid accijnsgoederen, één welomschreven afzender
      en een welomschreven tijdvak. De inspecteur kan de vergunning beperken tot één overbrenging.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50a
  - number: 50b
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan een
      geregistreerde geadresseerde moet voldoen ten aanzien van:

      a. de administratie; en

      b. het stelsel van toezicht.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50b
  - number: 50c
    text: |-
      1 Degene die een vergunning als geregistreerde geadresseerde wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.

      2 In het verzoek worden gegevens verstrekt met betrekking tot:

      a. de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;

      b. de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de geregistreerde
      geadresseerde per jaar uit een andere lidstaat zal worden ontvangen;

      c. de persoon op wiens naam de vergunning dient te worden gesteld;

      d. de administratie van de desbetreffende accijnsgoederen; en

      e. de locatie van het bedrijf.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50c
  - number: 50d
    text: |-
      1 Een onderneming wordt alleen als geregistreerde afzender aangemerkt indien daartoe een vergunning is verstrekt
      door de inspecteur.

      2 Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan een
      geregistreerde afzender moet voldoen ten aanzien van:

      a. de administratie; en

      b. het stelsel van toezicht.

      3 Degene die een vergunning voor een geregistreerde afzender wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.

      4 In het verzoek worden gegevens verstrekt met betrekking tot:

      a. de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;

      b. de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de geregistreerde afzender
      per jaar zal worden verzonden;

      c. de persoon op wiens naam de vergunning moet worden gesteld; en

      d. de administratie van de desbetreffende accijnsgoederen.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50d
  - number: 50e
    text: |-
