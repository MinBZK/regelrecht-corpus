  - number: 2b
    text: |-
      1 De overbrenging van accijnsgoederen onder een accijnsschorsingsregeling vangt aan, in de in
      [artikel 2a, eerste en tweede lid][ref1], bedoelde gevallen, wanneer de accijnsgoederen de accijnsgoederenplaats
      onderscheidenlijk het belastingentrepot van verzending verlaten en, in de in artikel 2a, derde lid, bedoelde
      gevallen, wanneer zij overeenkomstig artikel 201 van het Douanewetboek van de Unie in het vrije verkeer worden
      gebracht.

      2 De overbrenging van accijnsgoederen onder een accijnsschorsingsregeling eindigt:

      a. in de gevallen, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____________, op het tijdstip waarop de geadresseerde de accijnsgoederen in ontvangst heeft genomen;

      b. in de gevallen, bedoeld in
      [artikel 2a, eerste lid, onderdeel d, tweede lid, onderdeel d, en derde lid, onderdeel d][ref3], op het tijdstip
      waarop de goederen het grondgebied van de Unie hebben verlaten;

      c. in de gevallen, bedoeld in
      [artikel 2a, eerste lid, onderdeel f, tweede lid, onderdeel e, en derde lid, onderdeel f][ref4], op het tijdstip
      waarop de goederen onder de regeling extern douanevervoer worden geplaatst.


