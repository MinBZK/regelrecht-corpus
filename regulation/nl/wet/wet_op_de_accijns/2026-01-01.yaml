      1 Onder bij ministeriële regeling te stellen voorwaarden en beperkingen, wordt vrijstelling van accijns verleend
      ter zake van de uitslag tot verbruik van accijnsgoederen, die bestemd zijn om te worden gebruikt:

      a. in het kader van diplomatieke of consulaire betrekkingen;

      b. door internationale instellingen die door Nederland zijn erkend, alsmede door de leden van deze instellingen,
      zulks binnen de beperkingen en onder de voorwaarden die zijn vastgesteld bij de internationale verdragen tot
      oprichting van deze instellingen of bij de vestigingsovereenkomsten;

      c. door de strijdkrachten van alle staten die partij zijn bij het Noord-Atlantisch Verdrag, met uitzondering van
      Nederland, ten behoeve van deze strijdkrachten of het hen begeleidende burgerpersoneel of voor de bevoorrading van
      hun messes of kantines;

      d. voor verbruik in het kader van een met derde landen of internationale instellingen gesloten overeenkomst voor
      zover een dergelijke overeenkomst wordt aanvaard of toegestaan op het gebied van vrijstelling van omzetbelasting;

      e. door de strijdkrachten van lidstaten, met uitzondering van Nederland, ten behoeve van deze strijdkrachten of het
      hen begeleidende burgerpersoneel of voor de bevoorrading van hun messes of kantines, voor zover de strijdkrachten
      deelnemen aan een defensie-inspanning ter uitvoering van het gemeenschappelijk veiligheids- en defensiebeleid,
      bedoeld in titel V, hoofdstuk 2, afdeling 2, van het Verdrag betreffende de Europese Unie.

      2 In andere gevallen dan bedoeld in het eerste lid wordt bij ministeriële regeling, onder daarbij te stellen
      voorwaarden en beperkingen, vrijstelling van accijns verleend ter zake van de uitslag tot verbruik van
      accijnsgoederen, indien aanspraak op vrijstelling bestaat ingevolge het Koninkrijk verbindende verdragen en in al
      hun onderdelen verbindende besluiten van bij zodanige verdragen opgerichte volkenrechtelijke organisaties, alsmede
      in daarmee overeenkomende gevallen.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel69
