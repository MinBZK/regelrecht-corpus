    text: |-
      1 De accijns wordt berekend naar het tarief dat geldt op het tijdstip van de uitslag tot verbruik.

      2 In de situatie, bedoeld in [artikel 2, vierde lid][ref1], wordt de accijns berekend als het verschil tussen het
      bedrag aan accijns dat is geheven en het bedrag dat zou zijn geheven indien geen herkenningsmiddelen zouden zijn
      toegevoegd.

      3 Voor de berekening van de accijns, bedoeld in het tweede lid, wordt de hoeveelheid vastgesteld op de
      maximuminhoud van de tank of het reservoir waarin de brandstof voorhanden is of is geweest.


