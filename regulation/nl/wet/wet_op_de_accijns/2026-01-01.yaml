        bwb_id: BWBR0005251
        artikel: '13'
        hoofdstuk: II
        afdeling: '3'
  - number: '25'
    text: |-
      1 Onder minerale oliën worden verstaan de producten van de GN-codes:

      a. 1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;

      b. 2706 tot en met 2710;

      c. 2711, met uitzondering van aardgas;

      d. 2712 tot en met 2715;

      e. 2901 en 2902;

      f. 2905 11 00, die niet langs synthetische weg zijn verkregen en zijn bestemd om te worden gebruikt als
      motorbrandstof of als brandstof voor verwarming;

      g. 3403;

      h. 3811;

      i. 3817;

      j. 3824 99 86, 3824 99 92 – met uitzondering van roestwerende preparaten die aminen als werkzame bestanddelen
      bevatten en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van dergelijke
      producten –, 3824 99 93, 3824 99 96 – met uitzondering van roestwerende preparaten die aminen als werkzame
      bestanddelen bevatten en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van
      dergelijke producten –, 3826 00 10 en 3826 00 90, indien deze zijn bestemd om te worden gebruikt als motorbrandstof
      of als brandstof voor verwarming.

      2 Als minerale oliën worden mede aangemerkt:

      a. andere producten dan minerale oliën als bedoeld in het eerste lid, die zijn bestemd voor gebruik, worden
      aangeboden voor verkoop of worden gebruikt als motorbrandstof, als additief of als vulstof in motorbrandstoffen;

      b. andere koolwaterstoffen dan bedoeld in het eerste lid of in onderdeel *a*, die zijn bestemd voor gebruik, worden
      aangeboden voor verkoop of worden gebruikt voor verwarmingsdoeleinden, met uitzondering van steenkool, bruinkool,
      turf, andere soortgelijke vaste koolwaterstoffen en aardgas.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel25
  - number: '26'
    text: |-
      1 Voor de toepassing van het tarief worden minerale oliën onderscheiden in lichte olie, halfzware olie, gasolie,
      zware stookolie, vloeibaar gemaakt petroleumgas en methaan.

      2 Lichte olie wordt onderscheiden in gelode lichte olie en ongelode lichte olie.

      Onder gelode lichte olie worden verstaan de producten van GN-codes 2710 12 31, 2710 12 51 en 2710 12 59. Onder
      ongelode lichte olie worden verstaan de producten van GN-codes 2710 12 41, 2710 12 45 en 2710 12 49.

      3 Onder halfzware olie worden verstaan de producten van GN-codes 2710 19 21 en 2710 19 25.

      4 Onder gasolie worden verstaan de producten van GN-codes 2710 19 43 tot en met 2710 19 48 en 2710 20 11 tot en met
      2710 20 19.

      5 Onder zware stookolie worden verstaan de producten van GN-codes 2710 19 62 tot en met 2710 19 68 en 2710 20 31
      tot en met 2710 20 39.

      6 Onder vloeibaar gemaakt petroleumgas worden verstaan de producten van GN-codes 2711 12 11 tot en met 2711 19 00.

      7 Onder methaan worden verstaan de producten van GN-code 2711 29 00.

      8 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het bepalen van het loodgehalte van
      lichte olie.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel26
  - number: '27'
    text: |-
      1 De accijns bedraagt voor:

      a. lichte olie, per 1000 L bij een temperatuur van 15°C € 1.115,94 indien het gelode lichte olie betreft en
      € 844,69 indien het ongelode lichte olie betreft;

      b. halfzware olie, per 1000 L bij een temperatuur van 15°C, € 654,33 en gasolie, per 1000 L bij een temperatuur van
      15°C, € 552,29;

      c. zware stookolie, per 1 000 kg € 681,59;

      d. vloeibaar gemaakt petroleumgas, per 1000 kg € 369,02;

      e. methaan nihil.

      2 Voor de toepassing van het tarief als bedoeld in het eerste lid, onderdelen a en b, worden bij ministeriële
      regeling regels gesteld met betrekking tot de herleiding van de actuele hoeveelheden minerale oliën naar
      hoeveelheden bij een temperatuur van 15°C.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel27
