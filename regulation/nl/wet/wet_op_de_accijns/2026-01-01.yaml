    text: |-
      1 De in een tijdvak verschuldigd geworden accijns moet op aangifte worden voldaan.

      2 Aangifte dient te worden gedaan voor elke accijnsgoederenplaats afzonderlijk.

      3 In afwijking van het tweede lid kan bij ministeriële regeling, onder daarbij te stellen voorwaarden,
      worden toegestaan dat voor accijnsgoederenplaatsen waarvan de vergunningen op naam zijn gesteld van dezelfde
      vergunninghouder één aangifte voor die plaatsen tezamen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel53
  - number: 53a
    text: |-
      1 In afwijking van [artikel 53, eerste lid][ref1], en van [artikel 10, tweede lid][ref2], en
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref3] wordt de accijns op aangifte voldaan:

      a. bij toepassing van [artikel 52, tweede lid, onderdelen a tot en met d][ref4], en, voor zover het een
      geregistreerde geadresseerde betreft, onderdeel e: uiterlijk op de dag na het in artikel 52, tweede lid, onderdelen
      a tot en met e, bedoelde tijdstip;

      b. bij toepassing van [artikel 52, derde lid, onderdelen a, c, d, e en f][ref5], voor zover geen sprake is van een
      fiscaal vertegenwoordiger: uiterlijk op de dag na het tijdstip, bedoeld in artikel 52, derde lid, onderdelen a, c,
      d, e of f;

      c. bij toepassing van [artikel 52, derde lid, onderdeel b][ref6], voor zover het een ander dan de vergunninghouder
      van een accijnsgoederenplaats betreft: binnen één maand na het in artikel 52, derde lid, onderdeel b, bedoelde
      tijdstip;

      d. bij toepassing van [artikel 52, derde lid, onderdeel g][ref7]: binnen één maand na het in artikel 52, derde lid,
      onderdeel g, bedoelde tijdstip.

      2 In afwijking in zoverre van het eerste lid doet de geregistreerde geadresseerde aangifte van de in een week op de
      voet van [artikel 52, tweede lid, onderdelen c en e][ref8], verschuldigd geworden accijns uiterlijk op de vrijdag
      van de week daaropvolgend. De verschuldigd geworden accijns wordt op aangifte voldaan.


