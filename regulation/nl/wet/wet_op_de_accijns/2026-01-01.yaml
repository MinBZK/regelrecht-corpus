  - number: '2'
    text: |-
      1 In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder uitslag tot verbruik:

      a. het aan een accijnsschorsingsregeling onttrekken, daaronder begrepen het onregelmatig onttrekken, van
      accijnsgoederen;

      b. het voorhanden hebben of opslaan van een accijnsgoed, ook in gevallen van onregelmatigheid, buiten een
      accijnsschorsingsregeling wanneer over dat goed geen accijns is geheven overeenkomstig de toepasselijke bepalingen
      van het Unierecht en de nationale wetgeving;

      c. de productie, met inbegrip van de verwerking, van accijnsgoederen en de onregelmatige productie of verwerking
      daarvan, buiten een accijnsschorsingsregeling;

      d. de invoer, met inbegrip van onregelmatige invoer, van accijnsgoederen die niet onmiddellijk bij invoer onder een
      accijnsschorsingsregeling worden geplaatst, behalve wanneer de douaneschuld teniet is gegaan overeenkomstig artikel
      124, eerste lid, onderdelen e, f, g of k, van het Douanewetboek van de Unie.

      2 Als uitslag tot verbruik wordt mede aangemerkt het verbruik, anders dan als grondstof, van een accijnsgoed binnen
      een plaats die voor dat soort accijnsgoed als accijnsgoederenplaats is aangewezen.

      3 Als uitslag tot verbruik wordt mede aangemerkt het verbruik, anders dan als grondstof, in Nederland van een
      accijnsgoed dat het douanegebied van de Unie binnenkomt, zich in tijdelijke opslag bevindt, als bedoeld in artikel
      5, zeventiende lid, van het Douanewetboek van de Unie, of onder een douaneregeling extern douanevervoer, douane-
      entrepot, actieve veredeling, of tijdelijke invoer, als bedoeld in artikel 210 van het Douanewetboek van de Unie
      is geplaatst.

      4 Als uitslag tot verbruik wordt mede aangemerkt het in strijd met wettelijke bepalingen voorhanden hebben, opslaan
      of gebruiken van minerale oliën waaraan herkenningsmiddelen als bedoeld in [artikel 1a, derde lid][ref1], zijn
      toegevoegd.

      5 De algehele vernietiging of het onherstelbare algehele of gedeeltelijke verlies van onder een
      accijnsschorsingsregeling geplaatste accijnsgoederen door niet te voorziene omstandigheden of overmacht, of
      ingevolge instructies van de inspecteur dan wel van de bevoegde autoriteiten van een andere lidstaat om de goederen
      te vernietigen, wordt niet aangemerkt als uitslag tot verbruik. Voor de toepassing van deze bepaling worden
      goederen geacht totaal vernietigd of onherstelbaar verloren te zijn wanneer zij als accijnsgoed onbruikbaar zijn
      geworden.

      6 De algehele vernietiging of het onherstelbare algehele of gedeeltelijke verlies van de accijnsgoederen in kwestie
      wordt aangetoond ten genoegen van de inspecteur dan wel, indien van toepassing, de bevoegde autoriteiten van de
      lidstaat waar de algehele vernietiging of het onherstelbare algehele of gedeeltelijke verlies zich heeft voorgedaan
      of, indien niet is vast te stellen waar het verlies zich heeft voorgedaan, van de lidstaat waar het verlies is
      geconstateerd.

      7 Het vijfde en zesde lid zijn van overeenkomstige toepassing met betrekking tot accijnsgoederen die nog niet zijn
      ingevoerd.

      8 Een gedeeltelijk verlies als gevolg van de aard van de goederen, dat zich voordoet wanneer de goederen onder een
      accijnsschorsingsregeling worden overgebracht tussen de lidstaten, wordt niet aangemerkt als uitslag tot verbruik
      voor zover het verlies onder de vastgestelde drempel voor gedeeltelijk verlies voor die accijnsgoederen valt,
      tenzij er een gegronde reden is om te vermoeden dat er sprake is van fraude of een onregelmatigheid. Dat deel
      van een gedeeltelijk verlies dat boven de vastgestelde drempel voor gedeeltelijk verlies voor die accijnsgoederen
      uitkomt, wordt behandeld als uitslag tot verbruik.

      9 Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden en beperkingen, verbruik van minerale oliën als brandstof voor het produceren of verwerken van
      minerale oliën in een accijnsgoederenplaats.

      10 Als uitslag tot verbruik wordt niet aangemerkt het produceren, verwerken en het voorhanden hebben van een
      accijnsgoed, bedoeld in [artikel 5, tweede en derde lid][ref2].

      11 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel5
