preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de accijnswetgeving te moderniseren, te vereenvoudigen
    en op een aantal punten technisch te herzien en dat het voorts wenselijk is de heffing van de accijnzen onder
    te brengen in één heffingswet en het stelsel zodanig te uniformeren dat een einde wordt gemaakt aan de grote
    verscheidenheid in regelgeving welke kenmerkend is voor de huidige accijnswetgeving;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder de naam accijns wordt een belasting geheven van:

      a. bier;

      b. wijn;

      c. tussenproducten;

      d. overige alcoholhoudende producten;

      e. minerale oliën; en

      f. tabaksproducten.

      2 De accijns wordt verschuldigd ter zake van de uitslag tot verbruik van de in het eerste lid bedoelde goederen.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel1
  - number: 1a
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *accijnsgoed:* een goed als bedoeld in [artikel 1][ref1];
        - *accijnsgoederenplaats:* iedere plaats in Nederland waar op grond van de bepalingen van deze wet accijnsgoederen
      onder schorsing van accijns mogen worden geproduceerd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden
      opgeslagen, mogen worden ontvangen of mogen worden verzonden;
        - *accijnsschorsingsregeling:* belastingregeling die geldt voor het produceren, verwerken, voorhanden hebben,
      opslaan en overbrengen van accijnsgoederen waarbij de accijns is geschorst;
        - *belastingentrepot:* iedere plaats op het grondgebied van de Unie buiten Nederland waar op grond van de
      wettelijke bepalingen van de lidstaat waar de plaats zich bevindt, accijnsgoederen onder schorsing van accijns
      mogen worden geproduceerd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden opgeslagen, mogen worden
      ontvangen of mogen worden verzonden;
        - *derdeland:* elke staat of elk grondgebied waarop het Verdragen betreffende de Europese Unie en het Verdrag
      betreffende de werking van de Europese Unie niet van toepassing zijn;
        - *derdelandsgebieden:* de gebieden, genoemd in artikel 4, tweede en derde lid, van [Richtlijn 2020/262]
      (32020L0262) van de Raad van 19 december 2020 houdende een algemene regeling inzake accijns (PbEU 2020, L 58);
        - *gecertificeerde afzender:* een natuurlijke- of rechtspersoon, die op grond van een ingevolge deze wet afgegeven
      vergunning dan wel ingevolge de wettelijke bepalingen van de lidstaat van verzending staat geregistreerd om bij
      de bedrijfsuitoefening van die persoon accijnsgoederen te verzenden die op het grondgebied van de ene lidstaat tot
      verbruik zijn uitgeslagen en vervolgens naar het grondgebied van een andere lidstaat zijn overgebracht;
        - *gecertificeerde geadresseerde:* een natuurlijk of rechtspersoon, die op grond van een ingevolge deze wet
      afgegeven vergunning dan wel ingevolge de wettelijke bepalingen van de lidstaat van bestemming staat geregistreerd
      om bij de bedrijfsuitoefening van die persoon accijnsgoederen te ontvangen die op het grondgebied van de
      ene lidstaat tot verbruik zijn uitgeslagen en vervolgens naar het grondgebied van een andere lidstaat zijn
      overgebracht;
        - *geregistreerde afzender:* een natuurlijke - of rechtspersoon, die op grond van een ingevolge deze wet afgegeven
      vergunning dan wel ingevolge de wettelijke bepalingen van een andere lidstaat van invoer gemachtigd is om bij de
      bedrijfsuitoefening van die persoon en onder de door de inspecteur onderscheidenlijk de bevoegde autoriteiten van
      een andere lidstaat vastgestelde voorwaarden, accijnsgoederen onder een accijnsschorsingsregeling te verzenden
      wanneer zij overeenkomstig artikel 201 van het Douanewetboek van de Unie in het vrije verkeer worden gebracht;
        - *geregistreerde geadresseerde:* een natuurlijke - of rechtspersoon, die op grond van een ingevolge deze wet
      afgegeven vergunning dan wel ingevolge de wettelijke bepalingen van een andere lidstaat gemachtigd is om bij de
      bedrijfsuitoefening van die persoon accijnsgoederen in ontvangst te nemen die vanuit het grondgebied van een andere
      lidstaat onder een accijnsschorsingsregeling worden overgebracht;
        - *GN-code:* de code, bedoeld in [Verordening (EEG) nr. 2658/87](31987R2658) van de Raad van 23 juli 1987 met
      betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG 1987, L 256), zoals
      deze luidt op 1 januari 2018 indien het minerale oliën betreft, en zoals deze luidt op 1 januari 2019 indien het
      alcohol en alcoholhoudende dranken betreft;
        - *grondgebied van de Unie:* het geheel van de grondgebieden van de lidstaten;
        - *grondgebied van een lidstaat:* het grondgebied van een lidstaat waarop de Verdragen overeenkomstig de artikelen
      349 en 355 van het Verdrag betreffende de werking van de Europese Unie van toepassing zijn, met uitzondering van
      derdelandsgebieden;
        - *invoer:* het in het vrije verkeer brengen van goederen, bedoeld in artikel 201 van het Douanewetboek van de
      Unie;
        - *kwijtschelding:* ontheffing van de verplichting tot betaling van een niet voldane accijns;
        - *lidstaat van bestemming:* de lidstaat waar de accijnsgoederen moeten worden geleverd of gebruikt overeenkomstig
      de bepalingen van [Richtlijn 2020/262](32020L0262) van de Raad van 19 december 2019 houdende een algemene regeling
      inzake accijns (PbEU 2020, L 58);
        - *motorrijtuig:* een voertuig dat is bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend of
      mede door een mechanische kracht, op of aan het voertuig aanwezig;
        - *ondernemer:* een ondernemer in de zin van de [Wet op de omzetbelasting 1968][ref2];
        - *onregelmatige binnenkomst:* een binnenkomst van goederen op het grondgebied van de Unie die niet overeenkomstig
      artikel 201 van het Douanewetboek van de Unie onder de regeling «in het vrije verkeer brengen» zijn geplaatst en
      waarvoor een douaneschuld is ontstaan als bedoeld in artikel 79, eerste lid, van dat wetboek, of zou zijn ontstaan
      als die goederen onderworpen waren aan douanerechten;
        - *plaats van invoer:* de plaats waar de goederen zich bevinden wanneer zij overeenkomstig artikel 201 van het
      Douanewetboek van de Unie in het vrije verkeer worden gebracht;
        - *plaats van rechtstreekse aflevering:* een plaats die op grond van een ingevolge deze wet afgegeven vergunning
      door de vergunninghouder van een accijnsgoederenplaats of door de geregistreerde geadresseerde is aangewezen als
      plaats waarnaar accijnsgoederen onder een accijnsschorsingsregeling mogen worden overgebracht;
        - *plaats waar de accijnsgoederen het grondgebied van de Unie verlaten:* het douanekantoor van uitgang, bedoeld
      in artikel 329 van de Uitvoeringsverordening Douanewetboek van de Unie of het kantoor waar de douaneformaliteiten
      worden vervuld die van toepassing zijn op de uitgang van accijnsgoederen uit de Unie naar een gebied, genoemd in
      artikel 4, tweede lid, van [Richtlijn 2020/262](32020L0262) van de Raad van 19 december 2019 houdende een algemene
      regeling inzake accijns (PbEU 2020, L 58);
        - *produceren:* elk handelen waarbij of waardoor een accijnsgoed ontstaat;
        - *reiziger die zich naar een derdelandsgebied of derde land begeeft:* iedere passagier die in het bezit is van
      een bewijs van vervoer door de lucht of over zee, waarop als definitieve bestemming een in een derdelandsgebied of
      derde land gelegen luchthaven of haven is vermeld.
        - *Richtlijn hernieuwbare energie:* [Richtlijn 2009/28/EG](32009L0028) van het Europees Parlement en de Raad
      van 23 april 2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en
      intrekking van [Richtlijn 2001/77/EG](32001L0077) en [Richtlijn 2003/30/EG](32003L0030) (PbEU 2009, L 140);
        - *teruggaaf:* teruggave van een accijns die is betaald;
        - *verwerken:* elk handelen waarbij de samenstelling van een accijnsgoed wordt gewijzigd.

      2 Bij ministeriële regeling kunnen de data, genoemd in het eerste lid, bij de GN-code, worden vervangen door de
      datum van de versie van de in dat onderdeel bedoelde verordening die aan de wijziging van de GN-codes ten grondslag
      heeft gelegen, alsmede de GN-codes, genoemd in deze wet en de daarop berustende bepalingen.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat aan minerale oliën bij ministeriële regeling, onder
      daarbij te stellen voorwaarden, voorgeschreven herkenningsmiddelen worden toegevoegd.

      4 Als verwerken van een accijnsgoed wordt mede aangemerkt:

      a. het toevoegen van herkenningsmiddelen als bedoeld in het derde lid aan minerale oliën;

      b. het afscheiden van herkenningsmiddelen als bedoeld in het derde lid, of van bestanddelen van die
      herkenningsmiddelen, van minerale oliën waaraan deze herkenningsmiddelen zijn toegevoegd, waaronder begrepen het
      opheffen of veranderen van de werking van deze herkenningsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel1a
