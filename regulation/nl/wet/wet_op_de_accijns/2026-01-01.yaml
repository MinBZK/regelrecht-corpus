    text: |-
      1 Degene die een in [artikel 95a][ref1] opgenomen verbod overtreedt, pleegt een verzuim ter zake waarvan de
      inspecteur hem een boete van € 6.709 kan opleggen of, indien dit bedrag hoger is, ten hoogste tweemaal het bedrag
      van de accijns dat geheven zou zijn indien de verpakking voorzien was geweest van het per ingangsdatum van de
      nieuwe accijnstarieven, bedoeld in artikel 95a, bij de uitslag tot verbruik voor het desbetreffende tabaksproduct
      voorgeschreven accijnszegel.

      2 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref2] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het eerste lid.


