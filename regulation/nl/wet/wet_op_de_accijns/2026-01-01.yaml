  - number: 2f
    text: |-
      1 Als uitslag tot verbruik wordt mede aangemerkt het kopen van op het grondgebied van een andere lidstaat reeds tot
      verbruik uitgeslagen accijnsgoederen:

        - door een in Nederland gevestigde persoon, niet zijnde een vergunninghouder van een accijnsgoederenplaats, een
      geregistreerde geadresseerde, een gecertificeerde geadresseerde of een zelfstandig bedrijf, en
        - die door een afzender in een andere lidstaat die een zelfstandige economische activiteit verricht of voor diens
      rekening direct of indirect naar Nederland worden verzonden of vervoerd.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel2f
  - number: '3'
    text: |-
      1 Indien in de situaties als bedoeld in de [artikelen 2e][ref1] en [2f][ref2], de accijnsgoederen tijdens
      het vervoer in Nederland of in een andere lidstaat dan de lidstaat waar de accijnsgoederen tot verbruik zijn
      uitgeslagen, algeheel vernietigd of algeheel of gedeeltelijk onherstelbaar verloren gegaan zijn door niet te
      voorziene omstandigheden of overmacht, of ingevolge instructies van de inspecteur dan wel, indien van toepassing,
      de bevoegde autoriteiten van de andere lidstaat, is voor dat deel dat vernietigd of verloren is gegaan geen sprake
      van uitslag tot verbruik als bedoeld in de artikelen 2e en 2f.

      2 Voor de toepassing van dit artikel worden goederen geacht totaal vernietigd of algeheel of gedeeltelijk
      onherstelbaar verloren te zijn wanneer zij als accijnsgoed onbruikbaar zijn geworden.

      3 De algehele vernietiging of het onherstelbare algehele of gedeeltelijke verlies van de accijnsgoederen, bedoeld
      in het eerste lid, wordt aangetoond ten genoegen van de inspecteur dan wel, indien van toepassing, de bevoegde
      autoriteiten van de lidstaat waar de algehele vernietiging of het onherstelbare algehele of gedeeltelijke verlies
      zich heeft voorgedaan of, indien niet is vast te stellen waar het verlies zich heeft voorgedaan, van de lidstaat
      waar het verlies is geconstateerd.

      4 In de situaties, bedoeld in de [artikelen 2e][ref3] en [2f][ref4], wordt een gedeeltelijk verlies als gevolg van
      de aard van de goederen, dat zich voordoet tijdens het vervoer van de goederen op het grondgebied van een andere
      lidstaat dan de lidstaat waar de goederen tot verbruik zijn uitgeslagen, niet aangemerkt als uitslag tot verbruik
      wanneer het verlies onder de vastgestelde drempel voor gedeeltelijk verlies van die accijnsgoederen valt, bedoeld
      in [artikel 2, achtste lid][ref5], tenzij er een gegronde reden is om te vermoeden dat er sprake is van fraude of
      een onregelmatigheid.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


