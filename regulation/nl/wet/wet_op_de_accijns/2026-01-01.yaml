  - number: 2d
    text: |-
      1 Ter zake van door particulieren voor eigen behoeften verkregen en door henzelf vanuit een andere lidstaat naar
      Nederland vervoerde accijnsgoederen wordt geen accijns verschuldigd.

      2 Indien de hoeveelheid accijnsgoederen een bij ministeriële regeling vastgestelde hoeveelheid overschrijdt,
      worden de goederen geacht anders dan voor eigen behoeften voorhanden te worden gehouden, tenzij het tegendeel wordt
      aangetoond.

      3 Als uitslag tot verbruik wordt mede aangemerkt het door de particulier, bedoeld in het eerste lid, voorhanden
      hebben van voor eigen behoeften verkregen accijnsgoederen, die hij heeft laten vervoeren vanuit een andere lidstaat
      naar Nederland.

      4 Als uitslag tot verbruik wordt mede aangemerkt de verkrijging door particulieren van minerale oliën die in een
      andere lidstaat reeds tot verbruik zijn uitgeslagen, indien deze producten op een atypische wijze worden vervoerd
      door particulieren of voor hun rekening.

      5 Voor de toepassing van het vierde lid wordt onder atypisch vervoer verstaan het vervoer van brandstof anders dan
      in de tank van voertuigen of in een passend reserveblik, alsmede het vervoer van vloeibare verwarmingsproducten
      anders dan in tankwagens die voor rekening van bedrijven worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel2d
  - number: 2e
    text: |-
      1 Als uitslag tot verbruik wordt mede aangemerkt het overbrengen van accijnsgoederen die in een andere lidstaat
      reeds tot verbruik zijn uitgeslagen, naar Nederland om in Nederland voor commerciële doeleinden te worden geleverd
      of gebruikt. Deze accijnsgoederen worden uitsluitend overgebracht van een gecertificeerde afzender naar een
      gecertificeerde geadresseerde.

      2 Voor de toepassing van dit artikel worden accijnsgoederen als «geleverd voor commerciële doeleinden» beschouwd
      wanneer zij op het grondgebied van een andere lidstaat tot verbruik zijn uitgeslagen en vanuit die lidstaat zijn
      overgebracht naar Nederland en hetzij geleverd zijn aan anderen dan particulieren, hetzij aan particulieren in het
      geval het geen overbrenging als bedoeld in [artikel 2d][ref1] of [artikel 2f][ref2] betreft.

      3 Bij algemene maatregel van bestuur worden, ter verzekering van de heffing, regels gesteld met betrekking tot
      de verplichtingen waaraan moet worden voldaan met betrekking tot accijnsgoederen die voor commerciële doeleinden
      worden geleverd of gebruikt.

      4 Accijnsgoederen die aan boord van een schip of een vliegtuig dat een verbinding tussen een andere lidstaat en
      Nederland verzorgt, voorhanden worden gehouden maar die niet beschikbaar zijn voor de verkoop wanneer dit schip of
      vliegtuig zich op het grondgebied van Nederland bevindt, worden niet in Nederland aan accijns onderworpen.

      5 In afwijking van het eerste lid wordt niet als uitslag tot verbruik aangemerkt het overbrengen van minerale
      oliën die in een andere lidstaat zijn uitgeslagen tot verbruik, en zich bevinden in de normale reservoirs van
      bedrijfsmotorrijtuigen en die bestemd zijn als brandstof voor deze motorrijtuigen of zich bevinden in de normale
      reservoirs van containers voor speciale doeleinden en die bestemd zijn voor de werking tijdens het vervoer van
      specifieke systemen die tot de uitrusting van deze containers behoren.

      6 De overbrenging van accijnsgoederen, bedoeld in het eerste lid, vangt aan op het tijdstip waarop de
      accijnsgoederen hetzij de bedrijfsruimten van de gecertificeerde afzender verlaten, hetzij een locatie in de
      lidstaat van verzending waarvan aan de bevoegde autoriteiten van de lidstaat van verzending kennis wordt gegeven
      voor aanvang van de overbrenging.

      7 De overbrenging van accijnsgoederen, bedoeld in het eerste lid, eindigt op het tijdstip waarop de gecertificeerde
      geadresseerde de accijnsgoederen in ontvangst heeft genomen, hetzij in zijn bedrijfsruimten hetzij op een locatie
      in de lidstaat van bestemming waarvan aan de bevoegde autoriteiten van de lidstaat van bestemming kennis wordt
      gegeven voor aanvang van de overbrenging.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
