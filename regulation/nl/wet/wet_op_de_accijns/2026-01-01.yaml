  - number: '52'
    text: |-
      1 De accijns wordt verschuldigd op het tijdstip van de uitslag tot verbruik.

      2 Onder het tijdstip van de uitslag tot verbruik wordt verstaan:

      a. in de in [artikel 2, eerste lid, onderdeel b][ref1], bedoelde situatie: het tijdstip van de aanvang van het
      voorhanden of in opslag hebben;

      b. bij toepassing van [artikel 2, eerste lid, onderdeel c][ref2]: het tijdstip van de productie of verwerking;

      c. in de in [artikel 2a, tweede lid, onderdeel b][ref3], bedoelde situatie: het tijdstip van ontvangst van de
      accijnsgoederen door de geregistreerde geadresseerde;

      d. in de in [artikel 2a, tweede lid, onderdeel c][ref4], bedoelde situatie: het tijdstip van ontvangst van de
      accijnsgoederen door de geadresseerde;

      e. in de in [artikel 2a, vijfde lid][ref5], bedoelde situaties: het tijdstip van ontvangst van de accijnsgoederen
      op de plaats van rechtstreekse aflevering.

      3 In afwijking van het eerste lid wordt de accijns verschuldigd:

      a. bij toepassing van [artikel 2, vierde lid][ref6]: op het tijdstip van de aanvang van het voorhanden of in opslag
      hebben of het gebruik van de minerale oliën;

      b. bij toepassing van [artikel 2c][ref7]: op het tijdstip van de vaststelling van de in artikel 2c bedoelde
      onregelmatigheid;

      c. bij toepassing van [artikel 2d, derde lid][ref8]: op het tijdstip van de aanvang van het voorhanden hebben van
      de accijnsgoederen in Nederland;

      d. bij toepassing van [artikel 2d, vierde lid][ref9]: op het tijdstip van de verkrijging van de minerale oliën
      in Nederland;

      e. bij toepassing van [artikel 2e, eerste lid][ref10]: op het tijdstip dat de accijnsgoederen in ontvangst zijn
      genomen door de gecertificeerde geadresseerde in Nederland;

      f. bij toepassing van [artikel 2f, eerste lid][ref11]: op het tijdstip van de levering van de accijnsgoederen;

      g. bij toepassing van [artikel 4][ref12]: op het tijdstip van de vaststelling van de in artikel 4 bedoelde
      onregelmatigheid.


