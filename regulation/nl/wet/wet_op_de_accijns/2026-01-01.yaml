  - number: '54'
    text: |-
      1 Bij intrekking van een vergunning voor een accijnsgoederenplaats worden de accijnsgoederen waarvoor die
      accijnsgoederenplaats als zodanig is aangewezen, die binnen die plaats voorhanden zijn op de dag met ingang waarvan
      de vergunning wordt ingetrokken, aangemerkt als te zijn uitgeslagen tot verbruik en wordt het tijdvak waarover de
      accijns verschuldigd is, aangemerkt als te zijn geëindigd op die dag.

      2 De inspecteur kan bepalen dat de termijn waarbinnen de accijns dient te worden voldaan over het tijdvak waartoe
      de in het eerste lid bedoelde dag behoort alsmede over het daaraan onmiddellijk voorafgaande tijdvak in afwijking
      van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] minder bedraagt dan één maand.


