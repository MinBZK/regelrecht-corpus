  - number: '56'
    text: |-
      1 De vergunninghouder van een accijnsgoederenplaats, geregistreerde afzender en de gecertificeerde geadresseerde
      stellen zekerheid voor de accijns die zij verschuldigd zijn of kunnen worden in Nederland dan wel in een andere
      lidstaat.

      2 De geregistreerde geadresseerde, de afzender in een andere lidstaat die een zelfstandige economische activiteit
      verricht en de fiscaal vertegenwoordiger, bedoeld in [artikel 50f][ref1], stellen zekerheid voor de accijns die zij
      verschuldigd zijn of kunnen worden.

      3 In afwijking van het eerste lid kan de inspecteur, onder bij algemene maatregel van bestuur te stellen
      voorwaarden en beperkingen, toestaan dat de vervoerder, de eigenaar van de accijnsgoederen, of de gecertificeerde
      afzender, zekerheid stelt in plaats van de vergunninghouder, de geregistreerde afzender en de gecertificeerde
      geadresseerde, bedoeld in het eerste lid. De zekerheid wordt gesteld voor het bedrag aan accijns dat wordt
      vertegenwoordigd door de hoeveelheid accijnsgoederen die door of namens de vervoerder of de eigenaar wordt vervoerd
      naar de bestemmingen, bedoeld in [artikel 2a, eerste of derde lid][ref2], of naar de gecertificeerde geadresseerde.

      4 Het stellen van zekerheid als bedoeld in het eerste lid kan op verzoek achterwege blijven voor minerale oliën
      die vanuit een accijnsgoederenplaats over zee worden overgebracht. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking.

      5 Het stellen van zekerheid als bedoeld in het eerste lid blijft achterwege voor minerale oliën die door middel
      van een vaste pijpleiding worden overgebracht, tenzij de inspecteur bij een voor bezwaar vatbare beschikking naar
      behoren motiveert waarom toch zekerheid dient te worden gesteld.

      6 Het bedrag van de zekerheid wordt vastgesteld door de inspecteur. De vaststelling geschiedt tot een zodanig
      bedrag dat de te verhalen accijns voldoende verzekerd kan worden geacht.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld voor het bepalen van de hoogte van het bedrag van
      de zekerheid.

      8 In de vergunning bepaalt de inspecteur zo nodig nader op welke wijze aan de bij of krachtens deze wet gestelde
      voorwaarden moet worden voldaan.

      9 De inspecteur kan in de vergunning nadere voorwaarden opnemen ter verzekering van een juiste toepassing van het
      bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
