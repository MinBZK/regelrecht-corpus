  - number: 2a
    text: |-
      1 Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden, brengen van een accijnsgoed vanuit een accijnsgoederenplaats naar:

      a. een andere accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;

      b. een belastingentrepot;

      c. een in een andere lidstaat gevestigde geregistreerde geadresseerde;

      d. een plaats waar de accijnsgoederen het grondgebied van de Unie verlaten;

      e. een in een andere lidstaat gevestigde geadresseerde als bedoeld in [artikel 69][ref1];

      f. het douanekantoor van uitgang dat tevens het douanekantoor van vertrek is voor de regeling extern douanevervoer,
      wanneer dat accijnsgoed na vrijgave voor uitvoer onder de regeling extern douanevervoer wordt geplaatst met
      toepassing van artikel 329, vijfde lid, van de Uitvoeringsverordening Douanewetboek van de Unie en artikel 189,
      vierde lid, van de Gedelegeerde verordening Douanewetboek van de Unie.

      2 Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden, brengen van een accijnsgoed vanuit een belastingentrepot of door een in een andere lidstaat
      gevestigde geregistreerde afzender naar:

      a. een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;

      b. een in Nederland gevestigde geregistreerde geadresseerde;

      c. een in Nederland gevestigde geadresseerde als bedoeld in [artikel 69][ref2];

      d. een plaats waar de accijnsgoederen het grondgebied van de Unie verlaten;

      e. het douanekantoor van uitgang dat tevens het douanekantoor van vertrek is voor de regeling extern douanevervoer,
      wanneer dat accijnsgoed na vrijgave voor uitvoer onder de regeling extern douanevervoer wordt geplaatst met
      toepassing van artikel 329, vijfde lid, van de Uitvoeringsverordening Douanewetboek van de Unie en artikel 189,
      vierde lid, van de Gedelegeerde verordening Douanewetboek van de Unie.

      3 Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden, door een in Nederland gevestigde geregistreerde afzender brengen van een accijnsgoed van de
      plaats van invoer naar:

      a. een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;

      b. een belastingentrepot;

      c. een in een andere lidstaat gevestigde geregistreerde geadresseerde;

      d. een plaats waar de accijnsgoederen het grondgebied van de Unie verlaten;

      e. een in een andere lidstaat gevestigde geadresseerde als bedoeld in [artikel 69][ref3];

      f. het douanekantoor van uitgang dat tevens het douanekantoor van vertrek is voor de regeling extern douanevervoer,
      wanneer dat accijnsgoed na vrijgave voor uitvoer onder de regeling extern douanevervoer wordt geplaatst met
      toepassing van artikel 329, vijfde lid, van de Uitvoeringsverordening Douanewetboek van de Unie en artikel 189,
      vierde lid, van de Gedelegeerde verordening Douanewetboek van de Unie.

      4 De voorwaarden, bedoeld in het eerste tot en met derde lid, hebben betrekking op formaliteiten waaraan bij de
      overbrenging van accijnsgoederen moet worden voldaan.

      5 In de gevallen, bedoeld in het eerste lid, onderdeel a, tweede lid, onderdelen a en b, en derde lid, onderdeel
      a, kan, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, worden toegestaan dat
      de accijnsgoederen onder een accijnsschorsingsregeling worden overgebracht naar een plaats van rechtstreekse
      aflevering in Nederland.

      6 Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, voor minerale oliën waarvoor in
      [artikel 27][ref4] geen tarief is vermeld, ontheffing worden verleend van de formaliteiten, bedoeld in het vierde
      lid.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


