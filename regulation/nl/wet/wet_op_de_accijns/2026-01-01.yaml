  - number: '4'
    text: |-
      1 Indien tijdens de overbrenging van in een andere lidstaat reeds tot verbruik uitgeslagen accijnsgoederen die
      worden verzonden of vervoerd

      a. door een gecertificeerde afzender naar een gecertificeerde geadresseerde; of

      b. door een afzender in een andere lidstaat die een zelfstandige economische activiteit verricht of de overbrenging
      geschiedt voor diens rekening;

      in Nederland een onregelmatigheid heeft plaatsgevonden, is [artikel 2e, eerste lid][ref1], onderscheidenlijk
      [artikel 2f, eerste lid][ref2], van toepassing.

      2 Indien tijdens een overbrenging van accijnsgoederen overeenkomstig [artikel 2e][ref3] of [2f][ref4], in Nederland
      een onregelmatigheid is geconstateerd, en er niet kan worden vastgesteld waar de onregelmatigheid plaatsvond, wordt
      deze geacht te hebben plaatsgevonden in Nederland.

      3 Indien in de in het tweede lid bedoelde situatie binnen een termijn van drie jaar vanaf de datum waarop de
      accijnsgoederen zijn verkregen, wordt vastgesteld dat de onregelmatigheid daadwerkelijk heeft plaatsgevonden in een
      andere lidstaat, is de accijns in die lidstaat verschuldigd.

      4 Indien de accijns in een andere lidstaat verschuldigd is geworden op grond van het feit dat de onregelmatigheid
      werd geacht te hebben plaatsgevonden in die lidstaat en binnen een termijn van drie jaar vanaf de datum waarop de
      accijnsgoederen zijn verkregen, wordt vastgesteld dat de onregelmatigheid daadwerkelijk heeft plaatsgevonden in
      Nederland, is het eerste lid van toepassing.

      5 Voor de toepassing van dit artikel wordt onder onregelmatigheid verstaan een niet onder [artikel 3][ref5]
      vallende situatie die zich tijdens een overbrenging van accijnsgoederen als bedoeld in het eerste lid voordoet en
      als gevolg waarvan een overbrenging of een onderdeel van een overbrenging van accijnsgoederen niet op regelmatige
      wijze is geëindigd.

      6 Het niet voldoen aan de voorschriften van een of alle bij de overbrenging betrokken personen in strijd
      met [artikel 2e, eerste lid][ref6], of [artikel 50f, eerste lid][ref7], of de gebrekkige naleving van de
      voorschriften vastgesteld krachtens artikel 2e, derde lid, of [artikel 2f, tweede lid][ref8], wordt aangemerkt als
      onregelmatigheid. Deze onregelmatigheid wordt geacht in Nederland te hebben plaatsgevonden. Het eerste en vijfde
      lid zijn van overeenkomstige toepassing.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


