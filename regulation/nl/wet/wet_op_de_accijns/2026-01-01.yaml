      1 Andere minerale oliën dan die waarvoor in [artikel 27, eerste lid][ref1], een accijnstarief is vermeld,
      worden, indien zij zijn bestemd voor gebruik, worden aangeboden voor verkoop of worden gebruikt als brandstof voor
      verwarming of als motorbrandstof, aan de accijns onderworpen naar het ingevolge artikel 27, eerste lid, voor de
      gelijkwaardige brandstof of motorbrandstof geldende tarief.

      2 Onverminderd het eerste lid worden minerale oliën van GN-codes 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00
      voor de toepassing van het tarief gelijkgesteld met de motorbrandstof waaraan zij bestemd zijn te worden
      toegevoegd.

      3 Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel a][ref2], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste lid][ref3], voor de gelijkwaardige motorbrandstof geldende tarief.

      4 Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel b][ref4], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste lid][ref5], voor de gelijkwaardige brandstof geldende tarief.

      5 Minerale oliën die kunnen worden gelijkgesteld met meer dan één soort minerale olie worden voor de toepassing
      van het tarief gelijkgesteld met de soort minerale olie die van de desbetreffende soorten het eerst is vermeld in
      [artikel 26, eerste lid][ref6].

      6 Het vijfde lid is van overeenkomstige toepassing op minerale oliën van GN-codes 3811 11 10, 3811 11 90,
      3811 19 00 en 3811 90 00 die aan meer dan een soort motorbrandstof kunnen worden toegevoegd.


