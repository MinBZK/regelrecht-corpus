  - number: '95'
    text: |-
      1 Het is niet toegestaan tabaksproducten te verkopen, te koop aan te bieden of af te leveren indien de verpakking
      niet voldoet aan de bij of krachtens [artikel 78][ref1] gestelde voorwaarden of de accijnszegels niet ongeschonden
      op de voorgeschreven wijze zijn aangebracht.

      2 Het is niet toegestaan tabaksproducten aan anderen dan wederverkopers te verkopen, te koop aan te bieden of af te
      leveren voor:

      a. een lagere prijs dan die is vermeld op de accijnszegels;

      b. een hogere prijs dan die is vermeld op de accijnszegels.

      3 Onder het bepaalde in het tweede lid, onderdeel a, wordt mede begrepen het bij de verkoop aan anderen dan
      wederverkopers in enigerlei vorm verstrekken van geschenken, toegiften en bonnen alsmede het verlenen van
      medewerking aan handelingen die zijn gericht op de bevoordeling van derden.

      4 Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, afwijking van het eerste lid worden
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel78
