  - number: '75'
    text: |-
      1 Accijnszegels kunnen worden aangevraagd bij de zegelproducent door:

      a. de vergunninghouder van een accijnsgoederenplaats voor tabaksproducten;

      b. de in Nederland gevestigde geregistreerde geadresseerde;

      c. de fiscaal vertegenwoordiger van een niet in Nederland gevestigd bedrijf dat buiten Nederland tabaksproducten
      van accijnszegels voorziet;

      d. een in Nederland gevestigd bedrijf dat buiten Nederland tabaksproducten van accijnszegels voorziet.

      De inspecteur beslist bij afwijzing van de aanvraag van accijnszegels bij voor bezwaar vatbare beschikking.

      2 Degene die accijnszegels wil aanvragen verzoekt bij de inspecteur om toestemming voor het aanvragen van
      accijnszegels. De inspecteur beslist op de aanvraag alsmede het intrekken van een toestemming bij voor bezwaar
      vatbare beschikking.

      3 Indien de fiscaal vertegenwoordiger, bedoeld in het eerste lid, onderdeel c, toestemming als bedoeld in het
      tweede lid wil verkrijgen ten behoeve van meerdere bedrijven, moet voor elk bedrijf afzonderlijk toestemming worden
      verkregen.

      4 Bij ministeriële regeling worden voorwaarden en beperkingen gesteld waaronder de toestemming, bedoeld in het
      tweede lid, wordt verleend.

      5 De toestemming voor de aanvraag van accijnszegels kan door de inspecteur worden ingetrokken ingeval:

      a. niet wordt voldaan aan de bij ministeriële regeling bepaalde voorwaarden of de in de toestemming opgenomen
      voorwaarden;

      b. geen of niet voldoende zekerheid is gesteld;

      c. misbruik van de toestemming is gemaakt of een poging daartoe is gedaan;

      d. degene aan wie de toestemming is verleend onherroepelijk is veroordeeld wegens het niet nakomen van een
      wettelijke bepaling inzake de accijns;

      e. degene aan wie de toestemming is verleend in staat van faillissement verkeert of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is;

      f. degene aan wie de toestemming is verleend daarom verzoekt.

      6 Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden worden gesteld waaraan door degene die de
      accijnszegels aanvraagt moet worden voldaan.

      7 Van accijnszegels voorziene tabaksproducten worden uitgeslagen tot verbruik door degene die de accijnszegels
      heeft aangevraagd.

      8 In afwijking van het zevende lid kan onder bij algemene maatregel van bestuur te stellen voorwaarden en
      beperkingen worden bepaald dat de tabaksproducten door een ander tot verbruik worden uitgeslagen.

      9 Bij ministeriële regeling worden regels gesteld omtrent het aanvragen, het verkrijgbaar stellen, het verstrekken
      en het gebruik van accijnszegels.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel75
  - number: '76'
    text: |-
      1 Om de in [artikel 75, tweede lid][ref1], bedoelde toestemming te kunnen verkrijgen stelt degene die de
      accijnszegels aanvraagt zekerheid voor het bedrag aan accijns dat de accijnszegels vertegenwoordigen.

      2 Het bedrag van de zekerheid wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking. De
      vaststelling geschiedt tot een zodanig bedrag dat het bedrag aan accijns dat de zegels vertegenwoordigen voldoende
      verzekerd kan worden geacht.

      3 Indien de vergunninghouder van een accijnsgoederenplaats en de geregistreerde geadresseerde zekerheid hebben
      gesteld op de voet van [artikel 56][ref2] kan die zekerheid mede dienen als zekerheid als bedoeld in het eerste
      lid.

      4 Met betrekking tot de zekerheid, bedoeld in het eerste lid, zijn de [artikelen 57 tot en met 60][ref3] van
      overeenkomstige toepassing.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel57
