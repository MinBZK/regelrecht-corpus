  - number: '29'
    text: Onder tabaksproducten wordt verstaan tot verbruik bereide tabak in de vorm van sigaren, sigaretten en rooktabak.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel29
  - number: '30'
    text: |-
      1 Onder sigaren worden verstaan de volgende producten, indien zij geschikt zijn om en, gelet op hun kenmerken en de
      normale verwachtingen van de consument, uitsluitend bestemd zijn om als zodanig te worden gerookt:

      a. tabaksrolletjes met een dekblad van natuurlijke tabak;

      b. tabaksrolletjes bestaande uit een gebroken melange, met een dekblad van gereconstitueerde tabak dat de normale
      kleur heeft van een sigaar en het product volledig omhult, in voorkomend geval met inbegrip van het filter, doch
      met uitzondering van het mondstuk, en waarvan het gewicht per stuk, zonder filter of mondstuk, ten minste 2,3 gram
      en niet meer dan 10 gram bedraagt en de omtrek over ten minste een derde van de lengte 34 mm of meer bedraagt.

      2 Als sigaren worden mede aangemerkt producten die gedeeltelijk uit andere stoffen dan tabak bestaan, doch
      overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel30
  - number: '31'
    text: |-
      1 Onder sigaretten worden verstaan niet als sigaren aan te merken tabaksrolletjes die geschikt zijn om als zodanig
      te worden gerookt, alsmede tabaksrolletjes die door middel van een eenvoudige niet-industriële handeling in een
      huls van sigarettenpapier worden geschoven of met sigarettenpapier worden omhuld.

      2 Als sigaretten worden mede aangemerkt producten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel31
  - number: '32'
    text: |-
      1 Onder rooktabak wordt verstaan niet als sigaren of als sigaretten aan te merken voor roken geschikte tabak.

      2 Als rooktabak worden mede aangemerkt producten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel32
  - number: '35'
    text: |-
      1 De accijns bedraagt voor:

      a. sigaren: een ad-valoremaccijns van 11% van de kleinhandelsprijs;

      b. sigaretten: een ad-valoremaccijns van 5% van de kleinhandelsprijs alsmede een specifieke accijns van € 362,12
      per 1000 stuks, met dien verstande dat het minimumbedrag aan accijns in totaal ten minste € 390,42 bedraagt;

      c. rooktabak: een specifieke accijns van € 346,98 per kilogram.

      2 Onder de kleinhandelsprijs wordt verstaan de prijs, met inbegrip van alle belastingen en de kosten van de
      verpakking, waarvoor het desbetreffende product wordt verkocht aan anderen dan wederverkopers.

      3 Voor de berekening van de accijns voor tabaksproducten die worden verbruikt binnen een accijnsgoederenplaats
      voor tabaksproducten wordt de kleinhandelsprijs gesteld op die van gelijke of soortgelijke producten die worden
      verbruikt buiten de accijnsgoederenplaats.

      4 Voor de berekening van de accijns wordt een tabaksrolletje als bedoeld in [artikel 31][ref1] aangemerkt als twee
      sigaretten wanneer het, zonder filter of mondstuk, meer dan 8 cm doch niet meer dan 11 cm lang is, en als drie
      sigaretten wanneer het, zonder filter of mondstuk, meer dan 11 cm doch niet meer dan 14 cm lang is, enzovoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel31
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '31'
        hoofdstuk: II
        afdeling: '7'
  - number: '36'
    text: |-
      1 Uiterlijk op 1 maart van elk jaar wordt voor sigaretten en rooktabak de gewogen gemiddelde kleinhandelsprijs
      bepaald op basis van alle tot verbruik uitgeslagen sigaretten respectievelijk rooktabak in het voorgaande
      kalenderjaar. De gewogen gemiddelde kleinhandelsprijs wordt gepubliceerd op de website van de rijksoverheid.

      2 De gewogen gemiddelde kleinhandelsprijs is gelijk aan de op basis van de kleinhandelsprijs berekende totale
      waarde van alle tot verbruik uitgeslagen sigaretten respectievelijk rooktabak, gedeeld door de totale hoeveelheid
      tot verbruik uitgeslagen sigaretten respectievelijk rooktabak.

      3 De specifieke accijns voor sigaretten mag niet hoger zijn dan 76,5% van de totale belastingdruk die resulteert
      uit de samenstelling van de specifieke accijns, de ad-valoremaccijns en de omzetbelasting die worden geheven over
      de gewogen gemiddelde kleinhandelsprijs.

      4 Wanneer na een verhoging van de accijns van sigaretten de gewogen gemiddelde kleinhandelsprijs van sigaretten
      wijzigt en hierdoor de specifieke accijns, uitgedrukt als een percentage van de totale belastingdruk, meer dan
      76,5% van de totale belastingdruk bedraagt, wordt de specifieke accijns aangepast uiterlijk op 1 januari van het
      tweede jaar volgende op dat waarin de wijziging zich heeft voorgedaan.

      5 Aanpassing van de accijns van sigaretten als gevolg van de wijzigingen van de gewogen gemiddelde
      kleinhandelsprijs en de totale belastingdruk, bedoeld in het vierde lid, kan geschieden bij ministeriële regeling.

      6 Een wijziging van de accijns van tabaksproducten treedt niet eerder in werking dan met ingang van de eerste dag
      van de vierde kalendermaand na afloop van de kalendermaand van publicatie.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel36
  - number: '37'
    text: |-
      1 Voor de toepassing van deze wet en de daarop gebaseerde regelingen wordt verstaan onder:

      a. alcoholgehalte van een accijnsgoed: het aantal volumeprocenten alcohol daarin bij een temperatuur van 20 °C;

      b. alcohol: ethanol en de alcoholen die bij het produceren of verwerken van ethanol zijn ontstaan voor zover zij
      niet zijn afgescheiden van de ethanol.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het alcoholgehalte.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel37
  - number: '38'
    text: |-
      Bij ministeriële regeling kan met betrekking tot bier, wijn, tussenproducten, overige alcoholhoudende producten
      en tabaksproducten in kleinhandelsverpakking worden bepaald dat voor de berekening van de accijns het volume of de
      massa van die goederen dat is vermeld op die verpakking in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel38
  - number: '39'
    text: |-
      Een plaats kan alleen als accijnsgoederenplaats worden gebruikt indien daartoe een vergunning is verstrekt door
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel39
  - number: '40'
    text: |-
      1 Als accijnsgoederenplaats kan in aanmerking komen een plaats waar:

      a. accijnsgoederen worden geproduceerd of verwerkt;

      b. geen accijnsgoederen worden geproduceerd of verwerkt maar die dient voor het voorhanden hebben en de opslag van
      accijnsgoederen, indien de hoeveelheid accijnsgoederen die gemiddeld over een jaar voorhanden is of is opgeslagen
      meer bedraagt dan een bij ministeriële regeling per soort accijnsgoed vast te stellen hoeveelheid.

      2 Een plaats van waaruit accijnsgoederen worden geleverd aan een verbruiker kan niet in aanmerking komen als
      accijnsgoederenplaats.

      3 In bij ministeriële regeling aan te wijzen gevallen kunnen plaatsen in afwijking van het bepaalde in het eerste
      en in het tweede lid in aanmerking komen als accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel40
  - number: '41'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan met
      betrekking tot een accijnsgoederenplaats moet worden voldaan ten aanzien van:

      a. de administratie en de administratieve organisatie;

      b. de locatie en de inrichting; en

      c. het stelsel van toezicht.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel41
  - number: '42'
    text: |-
      1 In het verzoek om een vergunning voor een accijnsgoederenplaats worden gegevens verstrekt met betrekking tot:

      a. de soort of de soorten accijnsgoederen waarvoor de accijnsgoederenplaats is bestemd;

      b. de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting in de accijnsgoederenplaats
      per jaar zal worden geproduceerd, verwerkt, dan wel gemiddeld over een jaar zonder verschuldigdheid van accijns
      voorhanden of opgeslagen zal zijn;

      c. de persoon op wiens naam de vergunning dient te worden gesteld;

      d. de administratie en de administratieve organisatie met betrekking tot de als accijnsgoederenplaats aan te merken
      plaats; en

      e. de locatie en de inrichting van de als accijnsgoederenplaats aan te wijzen plaats.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die het verzoek moet
      bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel42
  - number: 42a
    text: |-
      1 In afwijking van [artikel 40, eerste lid][ref1], kan, indien degene die een vergunning voor een
      accijnsgoederenplaats wil verkrijgen niet beschikt over een plaats waar accijnsgoederen worden geproduceerd
      of verwerkt dan wel voorhanden worden gehouden of worden opgeslagen, een verzoek om een vergunning voor een
      accijnsgoederenplaats door de inspecteur worden toegewezen, indien deze persoon in Nederland is gevestigd en in de
      uitoefening van zijn bedrijf optreedt als:

      a. handelaar in minerale oliën, maar de door hem gekochte minerale oliën niet zelf voorhanden houdt of in opslag
      neemt;

      b. tussenpersoon ten behoeve van vergunninghouders van een accijnsgoederenplaats voor minerale oliën waar minerale
      oliën worden geproduceerd of verwerkt dan wel opgeslagen;

      c. bunkerhandelaar in minerale oliën, die de door hem gekochte minerale oliën uitsluitend aflevert aan boord van
      schepen in het kader van de bevoorrading van schepen, bedoeld in [artikel 66, eerste lid, onderdeel a][ref2].

      2 Bij algemene maatregel van bestuur worden voorwaarden en beperkingen gesteld waaronder de vergunning, bedoeld in
      het eerste lid, wordt verleend.

      3 In het verzoek om een vergunning, bedoeld in het eerste lid, worden gegevens verstrekt met betrekking tot:

      a. de soort of de soorten minerale oliën waarvoor de accijnsgoederenplaats zal worden gebruikt;

      b. de hoeveelheid minerale oliën, onderscheiden naar soort, die naar verwachting via de accijnsgoederenplaats per
      jaar zal worden verhandeld of waarvoor als tussenpersoon zal worden opgetreden;

      c. de persoon op wiens naam de vergunning moet worden gesteld;

      d. de administratie en administratieve organisatie van de persoon, bedoeld in onderdeel c.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel66
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
  - number: '43'
    text: |-
      1 Een verzoek om een vergunning voor een accijnsgoederenplaats wordt door de inspecteur toegewezen tenzij hij
      gegronde redenen heeft om aan te nemen dat niet zal worden voldaan aan het bepaalde bij of krachtens deze wet.

      2 Een verzoek om een vergunning voor een accijnsgoederenplaats kan worden geweigerd aan degene die in de vijf aan
      het verzoek voorafgaande jaren onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling
      inzake de accijns.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel43
  - number: '44'
    text: |-
      1 De vergunning vermeldt voor welke soort of voor welke soorten accijnsgoederen de accijnsgoederenplaats als
      zodanig is aangewezen.

      2 In de vergunning bepaalt de inspecteur zo nodig nader op welke wijze aan de bij of krachtens deze wet gestelde
      voorwaarden moet worden voldaan.

      3 De inspecteur kan in de vergunning nadere voorwaarden opnemen ter verzekering van een juiste toepassing van het
      bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel44
  - number: '45'
    text: |-
      1 De inspecteur kan de in de vergunning opgenomen voorwaarden aanpassen ter verzekering van de heffing.

      2 Alvorens over te gaan tot aanpassing van de voorwaarden deelt de inspecteur de vergunninghouder mee welke
      omstandigheden naar zijn oordeel de door hem aan te geven aanpassing van de voorwaarden rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel45
  - number: '46'
    text: |-
      De vergunninghouder die een aanpassing van de in de vergunning opgenomen voorwaarden wenst, dient daartoe een
      verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel46
  - number: '47'
    text: |-
      Degene die een accijnsgoederenplaats wil overnemen, dient gezamenlijk met de vergunninghouder een verzoek in bij
      de inspecteur tot een zodanige aanpassing van de vergunning voor die accijnsgoederenplaats dat hij voor alle uit de
      vergunning voortvloeiende rechten en verplichtingen in de plaats treedt van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel47
  - number: '48'
    text: |-
      De vergunning voor een accijnsgoederenplaats kan door de inspecteur worden ingetrokken ingeval:

      a. niet wordt voldaan aan de in de vergunning opgenomen voorwaarden;

      b. geen of niet voldoende zekerheid is gesteld;

      c. misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;

      d. de vergunninghouder onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake
      de accijns;

      e. de vergunninghouder in staat van faillissement verkeert of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is;

      f. de vergunninghouder daarom verzoekt;

      g. de vergunning gedurende een aaneengesloten periode van 12 maanden niet is gebruikt.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel48
  - number: '49'
    text: |-
      1 Het intrekken van een vergunning ingevolge [artikel 48, onderdeel a, b of g][ref1], kan niet eerder geschieden
      dan één maand nadat de inspecteur de vergunninghouder schriftelijk in kennis heeft gesteld van de omstandigheden
      die naar zijn oordeel het intrekken rechtvaardigen.

      2 Het intrekken van een vergunning ingevolge [artikel 48, onderdeel c, d, e of f][ref2], kan onmiddellijk
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel48
