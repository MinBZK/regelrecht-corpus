  - number: 50h
    text: |-
      1 Een onderneming wordt alleen als gecertificeerde geadresseerde aangemerkt indien daartoe een vergunning is
      verstrekt door de inspecteur.

      2 Voor een gecertificeerde geadresseerde die slechts incidenteel accijnsgoederen ontvangt, wordt de vergunning
      verleend voor een welomschreven hoeveelheid accijnsgoederen, één welomschreven afzender en een welomschreven
      tijdvak. De inspecteur kan de vergunning beperken tot één overbrenging.

      3 Bij of krachtens algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld
      waaraan een gecertificeerde geadresseerde moet voldoen ten aanzien van:

      a. de administratie; en

      b. het stelsel van toezicht.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50h
  - number: 50i
    text: |-
      1 In het verzoek om een vergunning voor het zijn van een gecertificeerde geadresseerde worden gegevens verstrekt
      met betrekking tot:

      a. de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;

      b. de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de gecertificeerde
      geadresseerde per jaar uit een andere lidstaat zal worden ontvangen;

      c. de naam en het adres van de persoon op wiens naam de vergunning dient te worden gesteld;

      d. de administratie van de desbetreffende accijnsgoederen; en

      e. het adres waar de accijnsgoederen zullen worden ontvangen.

      2 Een vergunninghouder van een accijnsgoederenplaats of een geregistreerde geadresseerde kan, met inachtneming
      van bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, als een gecertificeerde geadresseerde
      optreden na kennisgeving aan de inspecteur. Na kennisgeving wordt daartoe een vergunning als bedoeld in het eerste
      lid verstrekt door de inspecteur.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50i
  - number: 50j
    text: |-
      1 Een onderneming wordt alleen als gecertificeerde afzender aangemerkt indien daartoe een vergunning is verstrekt
      door de inspecteur.

      2 Voor een gecertificeerde afzender die slechts incidenteel accijnsgoederen verzendt, wordt de vergunning verleend
      voor een welomschreven hoeveelheid accijnsgoederen, één welomschreven geadresseerde en een welomschreven tijdvak.
      De inspecteur kan de vergunning beperken tot één overbrenging.

      3 Bij of krachtens algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld
      waaraan een gecertificeerde afzender moet voldoen ten aanzien van:

      a. de administratie; en

      b. het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel50j
  - number: 50k
    text: |-
      1 In het verzoek om een vergunning voor het zijn van een gecertificeerde afzender worden gegevens verstrekt met
      betrekking tot:

      a. de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;

      b. Indien het [tweede lid van artikel 50j][ref1] van toepassing is:

      1°. de welomschreven hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de
      gecertificeerde afzender incidenteel zullen worden verzonden;

      2°. de welomschreven geadresseerde;

      3°. het welomschreven tijdvak;

      c. de persoon op wiens naam de vergunning moet worden gesteld.

      2 Een vergunninghouder van een accijnsgoederenplaats of een geregistreerde afzender kan, met inachtneming van bij
      algemene maatregel van bestuur te stellen voorwaarden, als een gecertificeerde afzender optreden na kennisgeving
      aan de inspecteur. Na kennisgeving wordt daartoe een vergunning als bedoeld in het eerste lid verstrekt door de
      inspecteur.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50j
