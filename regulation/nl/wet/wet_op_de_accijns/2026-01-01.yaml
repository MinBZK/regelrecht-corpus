  - number: 95a
    text: |-
      1 Ingeval van verhoging van de accijns van sigaretten of rooktabak is het met ingang van de eerste dag van de
      tweede kalendermaand volgend op de kalendermaand van inwerkingtreding van die verhoging niet toegestaan sigaretten
      of rooktabak aan wederverkopers te verkopen, te koop aan te bieden of af te leveren indien de verpakking is
      voorzien van de vóór de ingangsdatum van de verhoging bij de uitslag tot verbruik voor het desbetreffende
      tabaksproduct geldende accijnszegel.

      2 Het eerste lid is niet van toepassing op pijptabak, zijnde rooktabak als bedoeld in [artikel 32][ref1], bestemd
      om te worden gerookt met een pijp.

      3 Onder een wederverkoper als bedoeld in het eerste lid wordt mede verstaan een verkoopautomaat bestemd voor
      de verkoop van tabaksproducten. Onder afleveren als bedoeld in het eerste lid aan een verkoopautomaat bestemd
      voor de verkoop van tabaksproducten wordt niet verstaan het afleveren van tabaksproducten die uit een andere
      verkoopautomaat van dezelfde eigenaar afkomstig zijn.

      4 Onder afleveren als bedoeld in het eerste lid wordt voor een bedrijf, waarvan het distributiecentrum en de
      detailhandel tot dezelfde rechtspersoon behoren, mede verstaan het afleveren door het distributiecentrum aan de
      detailhandel.

      5 Onder afleveren als bedoeld in het eerste lid wordt niet verstaan het retourneren van sigaretten of rooktabak
      door wederverkopers aan diegenen die daaraan voorafgaand deze tabaksproducten aan deze wederverkopers hebben
      verkocht of afgeleverd.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel32
