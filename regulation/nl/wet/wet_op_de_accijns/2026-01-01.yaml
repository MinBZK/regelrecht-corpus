  - number: 50f
    text: |-
      1 Voorafgaand aan de verzending van de accijnsgoederen moet de afzender in een andere lidstaat die een zelfstandige
      economische activiteit verricht, bedoeld in [artikel 2f, eerste lid][ref1], zich melden bij de inspecteur of een
      fiscaal vertegenwoordiger in Nederland aanstellen, die niet de geadresseerde van de accijnsgoederen is.

      2 De fiscaal vertegenwoordiger moet in het bezit zijn van een vergunning van de inspecteur.

      3 Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.

      4 In het verzoek worden gegevens verstrekt met betrekking tot:

      a. de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;

      b. de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de afzender in een andere
      lidstaat die een zelfstandige economische activiteit verricht die hij vertegenwoordigt per jaar naar Nederland zal
      worden verzonden;

      c. de persoon op wiens naam de vergunning dient te worden gesteld;

      d. de naam en het adres van de afzender in een andere lidstaat die een zelfstandige economische activiteit verricht
      die hij vertegenwoordigt; en

      e. de administratie van de in onderdeel b bedoelde accijnsgoederen.

      5 Bij het verzoek dient een verklaring van de afzender in een andere lidstaat die een zelfstandige economische
      activiteit verricht te worden overgelegd waaruit blijkt dat degene die het verzoek indient door de afzender in
      een andere lidstaat die een zelfstandige economische activiteit verricht is gemachtigd namens hem op te treden als
      fiscaal vertegenwoordiger.

      6 Bij of krachtens algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld met
      betrekking tot:

      a. de verplichtingen waaraan de fiscaal vertegenwoordiger moet voldoen ten aanzien van de administratie;

      b. de wijze waarop de afzender in een andere lidstaat zich kan melden bij de inspecteur en de voorwaarden waaraan
      moet worden voldaan.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
