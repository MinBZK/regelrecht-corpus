  - number: '64'
    text: |-
      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van:

      a. minerale oliën die kennelijk niet zijn bestemd om te worden gebruikt als brandstof voor verwarming, als
      motorbrandstof of als additief in motorbrandstoffen;

      b. minerale oliën die in hoogovens met het oog op chemische reductie worden ingespoten als toevoeging aan de
      steenkool, die wordt gebruikt als voornaamste brandstof;

      c. sigaretten en rooktabak die geheel uit andere stoffen dan tabak bestaan en die uitsluitend zijn bestemd om te
      worden gebruikt voor medicinale doeleinden.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:

      a. de aard van en de aanduiding op de verpakking van in het eerste lid bedoelde accijnsgoederen;

      b. de stoffen waarmee in het eerste lid bedoelde accijnsgoederen moeten zijn vermengd;

      c. de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel64
  - number: 64a
    text: |-
      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van alcohol en alcoholhoudende dranken, wanneer zij:

      a. zijn gedistribueerd in de vorm van alcohol die volledig gedenatureerd is;

      b. worden gebruikt als onderdeel van het productieproces van een product dat niet voor menselijke consumptie is
      bestemd, indien het is verwerkt in een product dat niet voor menselijke consumptie is bestemd, of wordt gebruikt
      voor het onderhoud en de reiniging van de productieapparatuur die voor dat specifieke productieproces wordt
      gebruikt;

      c. worden gebruikt voor de vervaardiging van azijn van GN-code 2209;

      d. worden gebruikt voor de vervaardiging van geneesmiddelen als bedoeld in [Richtlijn 2001/82/EG](32001L0082) van
      het Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een communautair wetboek betreffende
      geneesmiddelen voor diergeneeskundig gebruik (PbEG 2001, L 311) of [Richtlijn 2001/83/EG](32001L0083) van het
      Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een communautair wetboek betreffende
      geneesmiddelen voor menselijk gebruik (PbEG 2001, L 311);

      e. worden gebruikt voor de productie van aroma’s voor de bereiding van levensmiddelen en niet-alcoholhoudende
      dranken met een alcoholvolumegehalte van niet meer dan 1,2%vol;

      f. rechtstreeks of als bestanddeel van een halffabricaat worden aangewend voor de productie van levensmiddelen,
      gevuld of anderszins, waarvan het alcoholgehalte niet meer bedraagt dan 8,5 liter absolute alcohol per 100 kilogram
      product voor chocola, of 5 liter absolute alcohol per 100 kilogram product voor andere producten;

      g. in ziekenhuizen of apotheken worden gebruikt voor medische doeleinden.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:

      a. de aard van of de aanduiding op de verpakking van accijnsgoederen, bedoeld in het eerste lid;

      b. de stoffen waarmee deze accijnsgoederen moeten zijn vermengd;

      c. de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel64a
  - number: '65'
    text: |-
      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van accijnsgoederen:

      a. waarvan de in de [artikelen 64][ref1] of [64a][ref2] voor de desbetreffende accijnsgoederen aangegeven
      bestemming niet of niet voldoende blijkt uit de goederen als zodanig, indien degene die de goederen betrekt deze
      gebruikt voor het produceren of verwerken van accijnsgoederen als bedoeld in de artikelen 64 of 64a dan wel deze
      gebruikt overeenkomstig de in dat artikel voor het desbetreffende accijnsgoed bedoelde bestemming;

      b. die door degene die de goederen betrekt, worden gebruikt als grondstof voor het produceren van niet-
      accijnsgoederen.

      2 Voor de toepassing van dit artikel worden onder niet-accijnsgoederen mede verstaan minerale oliën als bedoeld in
      [artikel 5, derde lid, onderdeel d ][ref3].

      3 Behoudens in bij algemene maatregel van bestuur aan te wijzen gevallen is degene die accijnsgoederen met
      vrijstelling van accijns betrekt in het bezit van een daartoe strekkende vergunning.

      4 De vergunning wordt op verzoek verleend door de inspecteur.

      5 Het verlenen, het aanpassen en het intrekken van een vergunning alsmede het afwijzen van een verzoek daartoe
      geschieden bij voor bezwaar vatbare beschikking.

      6 Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het zevende lid bedoelde kennisgeving.

      7 Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het zesde lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel64a
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel5
