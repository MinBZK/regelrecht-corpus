  - number: '91'
    text: |-
      1 Het is niet toegestaan minerale oliën die zijn voorzien van bij ministeriële regeling voorgeschreven
      herkenningsmiddelen buiten een accijnsgoederenplaats voorhanden te hebben samen met middelen die de afscheiding,
      opheffing of verandering van die herkenningsmiddelen in deze oliën kunnen bewerkstelligen of bevorderen.

      2 Het is niet toegestaan minerale oliën die zijn voorzien van bij ministeriële regeling voorgeschreven
      herkenningsmiddelen dan wel bestanddelen daarvan bevatten buiten een accijnsschorsingsregeling of de douaneregeling
      extern douanevervoer, douane-entrepot, actieve veredeling, of tijdelijke invoer, als bedoeld in artikel 210 van het
      Douanewetboek van de Unie is geplaatst voorhanden te hebben anders dan in:

      a. tanks van waaruit minerale oliën worden afgeleverd in de brandstoftanks van andere schepen dan
      pleziervaartuigen, mits deze schepen in bezit zijn van en gebruikt worden door degene die de beschikking heeft over
      de eerstgenoemde tanks;

      b. brandstoftanks van schepen, andere dan pleziervaartuigen, mits de minerale olie wordt gebruikt voor de
      aandrijving van deze schepen of als scheepsbehoeften aan boord van deze schepen;

      c. opslagtanks voor minerale oliën die zijn bestemd om van daaruit te worden afgeleverd in de brandstoftanks van
      andere schepen dan pleziervaartuigen;

      d. ladingtanks van vaartuigen, voertuigen en treinwagons.

      3 Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden en beperkingen, in bijzondere gevallen
      ontheffing worden verleend ten aanzien van de in het eerste en tweede lid bedoelde verboden.

      4 Bij ministeriële regeling kunnen voorwaarden en beperkingen worden gesteld ten aanzien van plaatsen waar minerale
      oliën voorzien van herkenningsmiddelen voorhanden mogen zijn.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel91
  - number: '92'
    text: |-
      1 Het is niet toegestaan bij ministeriële regeling voorgeschreven herkenningsmiddelen toe te voegen aan lichte
      olie.

      2 Het is niet toegestaan lichte olie voorhanden te hebben die is voorzien van bij ministeriële regeling
      voorgeschreven herkenningsmiddelen of bestanddelen van die herkenningsmiddelen bevat.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel92
  - number: '93'
    text: |-
      1 Het is niet toegestaan tabaksproducten die zijn voorzien van accijnszegels te brengen vanuit een
      accijnsgoederenplaats voor tabaksproducten naar een andere accijnsgoederenplaats voor tabaksproducten of te
      plaatsen onder de douaneregeling extern douanevervoer, douane-entrepot, actieve veredeling, of tijdelijke invoer,
      als bedoeld in artikel 210 van het Douanewetboek van de Unie.

      2 Het eerste lid is niet van toepassing indien:

      a. voor de in dat lid bedoelde accijnsgoederenplaats ingevolge [artikel 53, derde lid][ref1], aangifte wordt gedaan
      door dezelfde vergunninghouder;

      b. de accijnszegels zijn aangevraagd door de vergunninghouder van de accijnsgoederenplaats waarin de
      tabaksproducten worden ingeslagen.

      3 De inspecteur kan in aanvulling op het bepaalde in het tweede lid, onderdeel b, nadere voorwaarden stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
