  - number: '51'
    text: |-
      1 De accijns wordt geheven van:

      a. bij toepassing van [artikel 2, eerste lid, onderdeel a][ref1]:

      1°. de vergunninghouder van de accijnsgoederenplaats, de geregistreerde geadresseerde of enig andere persoon
      die de accijnsgoederen aan de accijnsschorsingsregeling onttrekt of voor wiens rekening de accijnsgoederen
      aan de accijnsschorsingsregeling worden onttrokken en, in geval van onregelmatige onttrekking aan de
      accijnsgoederenplaats, enig andere persoon die bij die onttrekking betrokken is geweest;

      2°. in geval van een onregelmatigheid tijdens een overbrenging van accijnsgoederen onder een
      accijnsschorsingsregeling in de zin van [artikel 2c, eerste, tweede en derde lid][ref2]: de vergunninghouder van de
      accijnsgoederenplaats, de vergunninghouder van het belastingentrepot, de geregistreerde afzender, de vervoerder of
      de eigenaar van de accijnsgoederen, bedoeld in [artikel 56, derde lid][ref3], of enig andere persoon die ingevolge
      de wettelijke bepalingen van een andere lidstaat zekerheid heeft gesteld en alle personen die bij de onregelmatige
      onttrekking betrokken zijn geweest terwijl zij wisten of redelijkerwijze hadden moeten weten dat het onttrekken op
      onregelmatige wijze geschiedde;

      b. bij toepassing van [artikel 2, eerste lid, onderdeel b][ref4]: de persoon die de accijnsgoederen voorhanden
      heeft of opslaat, en enig andere persoon die bij het voorhanden hebben of opslaan ervan betrokken is;

      c. bij toepassing van [artikel 2, eerste lid, onderdeel c][ref5]: de persoon die de accijnsgoederen produceert
      of verwerkt en, in geval van onregelmatige productie of verwerking, enig andere persoon die bij de productie of
      verwerking ervan betrokken is geweest;

      d. bij toepassing van [artikel 2, eerste lid, onderdeel d][ref6]: de aangever, bedoeld in artikel 5, vijftiende
      lid, van het Douanewetboek van de Unie, of enig andere persoon als bedoeld in artikel 77, derde lid, van het
      Douanewetboek van de Unie en, in geval van onregelmatige binnenkomst, enig andere persoon die bij die onregelmatige
      binnenkomst betrokken is geweest;

      e. bij toepassing van [artikel 2, vierde lid][ref7]: de persoon die de minerale oliën voorhanden heeft, opslaat
      of gebruikt;

      f. bij toepassing van [artikel 2d, derde lid][ref8]: de particulier, bedoeld in artikel 2d, derde lid;

      g. bij toepassing van [artikel 2d, vierde lid][ref9]: de particulieren, bedoeld in artikel 2d, vierde lid;

      h. bij toepassing van [artikel 2e, eerste lid][ref10]: de gecertificeerde geadresseerde, bedoeld in artikel 2e,
      eerste lid;

      i. Bij het niet voldoen aan de voorwaarden genoemd in [artikel 2e, eerste lid][ref11], bij de overbrenging van de
      accijnsgoederen: alle bij de overbrenging betrokken personen;

      j. bij toepassing van [artikel 2f, eerste lid][ref12]: de afzender in een andere lidstaat die een zelfstandige
      economische activiteit verricht, bedoeld in artikel 2f, eerste lid, of de aangewezen fiscaal vertegenwoordiger;

      k. bij toepassing van [artikel 4, eerste en tweede lid][ref13]: de personen, bedoeld in onderdelen h, i of j, en
      eenieder die bij de onregelmatigheid betrokken is geweest.

      2 In afwijking van het eerste lid, onderdeel a, wordt, in bij algemene maatregel van bestuur aan te wijzen
      gevallen en onder daarbij te stellen voorwaarden, de accijns van accijnsgoederen die zijn uitgeslagen uit een
      accijnsgoederenplaats in opdracht van een vergunninghouder van een andere accijnsgoederenplaats voor dezelfde soort
      accijnsgoederen, geheven van de vergunninghouder van die andere accijnsgoederenplaats.

      3 Indien er voor eenzelfde accijnsschuld verscheidene schuldenaren zijn, zijn zij hoofdelijk tot betaling van deze
      schuld gehouden.


