  - number: '71'
    text: |-
      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      accijns verleend voor accijnsgoederen die:

      a. zijn verloren gegaan;

      b. zijn vernietigd onder ambtelijk toezicht;

      c. zijn gebracht naar een derdelandsgebied of een derde land;

      d. zijn gebracht binnen een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;

      e. door een gecertificeerde afzender zijn overgebracht naar een gecertificeerde geadresseerde in een andere
      lidstaat;

      f. zijn geleverd aan een in een andere lidstaat gevestigde persoon, niet zijnde een vergunninghouder van een
      belastingentrepot, een geregistreerde geadresseerde, een gecertificeerde geadresseerde of een zelfstandig bedrijf,
      en die door een in Nederland gevestigde afzender die een zelfstandige economische activiteit verricht of voor diens
      rekening direct of indirect worden verzonden of vervoerd.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel71
  - number: 71a
    text: |-
      1 Op verzoek wordt teruggaaf van accijns verleend, indien bij toepassing van [artikel 2c, vijfde lid][ref1], of van
      [artikel 4, derde lid][ref2], is aangetoond dat de accijns door de andere lidstaat is geheven.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2c
