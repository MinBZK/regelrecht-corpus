  - number: 71d
    text: |-
      1 Op verzoek wordt teruggaaf van accijns verleend voor andere minerale oliën dan halfzware olie als bedoeld in GN-
      code 2710 19 21, indien die olie is afgeleverd in de brandstoftanks van en is gebruikt voor de voortstuwing van
      luchtvaartuigen, andere dan plezierluchtvaartuigen.

      2 De teruggaaf wordt verleend aan degene op wiens naam het luchtvaartuig is geregistreerd in het register voor
      burgerluchtvaartuigen, bedoeld in [artikel 3.3, eerste lid, van de Wet luchtvaart][ref1]. Ingeval teruggaaf wordt
      verzocht voor een in het buitenland geregistreerd luchtvaartuig, wordt deze verleend aan de eigenaar van dit
      luchtvaartuig dan wel aan degene die daartoe door deze is gemachtigd.

      3 Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de
      teruggaaf en kan in bij die regeling aangewezen gevallen een ander dan de in het tweede lid bedoelde persoon worden
      aangewezen als degene aan wie de teruggaaf wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.3
