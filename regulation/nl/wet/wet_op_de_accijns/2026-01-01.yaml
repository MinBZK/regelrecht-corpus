  - number: '77'
    text: |-
      1 Accijnszegels die zijn ontvangen door degene die de zegels heeft aangevraagd en waarvan niet is aangetoond dat
      zij zijn aangebracht op tabaksproducten die zijn uitgeslagen tot verbruik, worden geacht te zijn vermist.

      2 Als vermiste accijnszegels worden niet aangemerkt accijnszegels die:

      a. deel uitmaken van de zegelvoorraad;

      b. retour zijn gezonden aan de inspecteur;

      c. onder ambtelijk toezicht zijn vernietigd;

      d. verloren zijn gegaan door overmacht of ongeval;

      e. op tabaksproducten zijn aangebracht en waarvoor de accijns in een andere lidstaat verschuldigd is geworden, en
      de verwijdering of vernietiging van de accijnszegels ten genoegen van de inspecteur wordt aangetoond.

      3 Vanaf het moment dat de accijnszegels door of namens degene die de accijnszegels heeft aangevraagd in ontvangst
      zijn genomen op het distributiepunt, is degene die de accijnszegels heeft aangevraagd aansprakelijk voor het bedrag
      aan accijns dat de accijnszegels vertegenwoordigen.

      4 Degene die de accijnszegels heeft aangevraagd moet het bedrag aan accijns dat de vermiste accijnszegels
      vertegenwoordigen betalen.

      5 Het bedrag aan accijns dat de vermiste accijnszegels vertegenwoordigen wordt door de inspecteur vastgesteld
      bij voor bezwaar vatbare beschikking. Bij vaststelling van het bedrag aan accijns dat de vermiste accijnszegels
      vertegenwoordigen maakt de inspecteur het volgende onderscheid:

      a. onbedrukte blanco accijnszegels: een bedrag aan accijns behorend bij een gewogen gemiddelde prijs en hoeveelheid
      per zegelaanvrager op het moment waarop het vermis wordt vastgesteld naar het op dat moment geldende tarief;

      b. bedrukte accijnszegels: het bedrag wordt afgeleid uit in de administratie opgenomen prijs en hoeveelheid die is
      vermeld op de vermiste zegels naar het op dat moment geldende tarief.

      6 Voor de toepassing van dit artikel en de daarop gebaseerde bepalingen wordt verstaan onder:

        - *onbedrukte blanco accijnszegels:* accijnszegels die niet als bedrukte accijnszegels kunnen worden aangemerkt;
        - *bedrukte accijnszegels:* accijnszegels voor sigaretten of rooktabak die zijn voorzien van de gegevens met
      betrekking tot de soort tabaksproduct, de kleinhandelsprijs, de hoeveelheid en de tariefcode of accijnszegels voor
      sigaren die zijn voorzien van de gegevens met betrekking tot de soort tabaksproduct en de kleinhandelsprijs.

      7 Op de betaling als bedoeld in het vierde lid zijn de [Algemene wet inzake rijksbelastingen][ref1] en de
      [Invorderingswet 1990][ref2] van toepassing.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '78'
    text: |-
      1 De accijnszegels worden aangebracht op de kleinhandelsverpakking van tabaksproducten.

      2 De accijnszegels voor sigaretten en rooktabak vermelden de kleinhandelsprijs, de tariefcode, de soort en het
      aantal stuks of de massa van het tabaksproduct waarop de zegels worden aangebracht. De accijnszegels voor sigaren
      vermelden de kleinhandelsprijs en de soort van het tabaksproduct waarop de zegels worden aangebracht.

      3 In afwijking van het eerste lid mogen sigaren stuksgewijs van een accijnszegel worden voorzien.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:

      a. de vorm en de kleur van de accijnszegels alsmede de daarop te vermelden gegevens;

      b. de wijze waarop de accijnszegels worden aangebracht en voor herhaald gebruik ongeschikt moeten worden gemaakt;

      c. de wijze van verpakking, de grootte van de inhoud van de verpakking en de op de verpakking te vermelden
      gegevens.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel78
  - number: '79'
    text: |-
      1 Op verzoek van degene die de zegels heeft aangevraagd kunnen accijnszegels onder ambtelijk toezicht worden
      vernietigd.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het retour zenden van
      accijnszegels en de vernietiging van accijnszegels onder ambtelijk toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel79
  - number: '80'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing van accijns, regels worden gesteld met
      betrekking tot:

      a. het vervoer van accijnsgoederen;

      b. het leveren van accijnsgoederen;

      c. het voorhanden hebben van accijnsgoederen buiten een accijnsgoederenplaats.

      2 Het eerste lid is niet van toepassing op accijnsgoederen die de douanestatus hebben of hebben gekregen van niet-
      Uniegoederen als bedoeld in artikel 5, vierentwintigste lid, van het Douanewetboek van de Unie.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel80
  - number: '81'
    text: |-
      In de vergunning voor een accijnsgoederenplaats voor tabaksproducten kan worden toegestaan dat de vergunninghouder
      onder daarbij te stellen voorwaarden gedeeltelijk tot verbruik bereide tabak en tabaksproducten, al
      dan niet voorzien van accijnszegels, tijdelijk buiten de accijnsgoederenplaats bepaalde bewerkingen of
      verpakkingshandelingen kan laten ondergaan zonder dat het tijdelijk buiten de accijnsgoederenplaats brengen van die
      producten, in afwijking van [artikel 2, eerste lid, onderdeel a][ref1], wordt aangemerkt als uitslag tot verbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
