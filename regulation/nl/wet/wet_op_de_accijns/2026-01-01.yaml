    text: |-
      1 Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing van de accijns van tabaksproducten,
      regels worden gesteld met betrekking tot de handel in en het vervoer van ruwe tabak en van gedeeltelijk tot
      verbruik bereide tabak.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel82
  - number: '83'
    text: |-
      1 De inspecteur is bevoegd alle gedeelten van een gebouw, niet zijnde woningen, en alle grond aan onderzoek te
      onderwerpen.

      2 Aan onderzoek zijn mede onderworpen vervoermiddelen.
      [Artikel 50 van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing.

      3 In afwijking van [artikel 50, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2] kan de toegang tot
      een ingevolge het eerste en het tweede lid aan onderzoek onderworpen plaats of vervoermiddel op elk tijdstip worden
      gevorderd.

      4 Ten behoeve van het onderzoek, bedoeld in het tweede lid, is, overeenkomstig bij ministeriële regeling te stellen
      regels, op vordering van de inspecteur of een door hem aangewezen ambtenaar:

      a. de gezagvoerder van een schip gehouden het schip terstond vaart te doen minderen, te doen bijdraaien of te doen
      stilhouden en aanleggen;

      b. de bestuurder van een ander vervoermiddel dan een schip gehouden dit terstond te doen stilhouden en, indien het
      vervoermiddel door mechanische kracht wordt voortbewogen, de motor buiten werking te stellen.

      5 De in het vierde lid bedoelde ambtenaren zijn bevoegd een vervoermiddel, als bedoeld in het vierde lid, te
      brengen of te doen brengen naar een nabij gelegen plaats. De gezagvoerder of bestuurder is verplicht desgevorderd
      zijn voor het onderzoek en het vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het vervoermiddel
      te vervoeren.

      6 De inspecteur kan bij het onderzoek, bedoeld in het eerste en tweede lid, gebruikmaken van de benodigde
      apparatuur of dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel50
