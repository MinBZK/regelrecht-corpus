  - number: 72a
    text: |-
      1 Indien een vergunninghouder van een accijnsgoederenplaats gebruik wil maken van een verlaagd tarief voor kleine
      producenten van alcoholhoudende dranken in een lidstaat van bestemming, dient hij in zijn administratie een
      verklaring op te nemen waarin ten minste is opgenomen:

      a. de hoeveelheid alcoholhoudende dranken dat jaarlijks wordt vervaardigd in de accijnsgoederenplaats; en

      b. de bevestiging dat de vergunninghouder voldoet aan de voor zover van toepassing zijnde criteria, bedoeld
      in artikel 4, tweede lid, artikel 9bis, tweede lid, artikel 13bis, vierde lid, artikel 18bis, derde lid, en
      artikel 22, tweede lid, van de [Richtlijn 92/83/EEG](31992L0083) van de Raad van 19 oktober 1992 betreffende de
      harmonisatie van de structuur van de accijns op alcohol en alcoholhoudende dranken (PbEG 1992, L 316).

      2 Bij ministeriële regeling kunnen voorwaarden en beperkingen worden gesteld met betrekking tot de toepassing van
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel72a
  - number: '73'
    text: |-
      1 Tabaksproducten moeten bij de uitslag tot verbruik zijn voorzien van het voor het desbetreffende tabaksproduct
      voorgeschreven accijnszegel. De accijnszegels zijn staatseigendom.

      2 Tabaksproducten die zijn bestemd voor het verbruik, bedoeld in [artikel 2, tweede lid][ref1], mogen niet zijn
      voorzien van een accijnszegel.

      3 Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden, gevallen worden aangewezen waarin het
      eerste lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel73
