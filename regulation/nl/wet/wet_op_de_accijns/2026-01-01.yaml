    text: |-
      Onder bier wordt verstaan:

      a. elk product van GN-code 2203; en

      b. elk product van GN-code 2206 dat een mengsel van bier als bedoeld in onderdeel *a* en niet-alcoholhoudende
      dranken bevat;

      voor zover deze producten een alcoholgehalte hebben van meer dan 0,5%vol.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel6
  - number: '7'
    text: |-
      1 De accijns bedraagt voor bier per hectoliter bij een temperatuur van 20°C per volumeprocent alcohol € 8,12, met
      dien verstande dat het minimumbedrag aan accijns in totaal ten minste € 26,13 bedraagt, waarbij een gedeelte van
      een hectoliter rekenkundig wordt afgerond op twee decimalen en van een volumeprocent alcohol naar beneden wordt
      afgerond op één decimaal.

      2 In afwijking van het eerste lid bedraagt de accijns voor bier dat is geproduceerd in een accijnsgoederenplaats
      waar in het voorafgaande kalenderjaar niet meer dan 200.000 hectoliter bier is geproduceerd, per hectoliter bij
      een temperatuur van 20°C per volumeprocent alcohol € 7,51, met dien verstande dat het minimumbedrag aan accijns in
      totaal ten minste € 26,13 per hectoliter bedraagt.

      3 Het tweede lid vindt slechts toepassing met betrekking tot een accijnsgoederenplaats die:

      a. juridisch en economisch onafhankelijk is van een andere accijnsgoederenplaats waar bier wordt geproduceerd;

      b. gebruik maakt van installaties die in fysiek opzicht losstaan van die van een andere accijnsgoederenplaats waar
      bier wordt geproduceerd; en

      c. geen bier produceert onder licentie, tenzij het onder licentie geproduceerde bier slechts een klein gedeelte
      van de totale productie betreft, met dien verstande dat het tweede lid geen toepassing vindt met betrekking tot het
      onder licentie geproduceerde bier.

      4 Voor de toepassing van het tweede en derde lid wordt een samenwerkingsverband van twee of meer
      accijnsgoederenplaatsen waar gezamenlijk in het voorafgaande kalenderjaar niet meer dan 200.000 hectoliter bier is
      geproduceerd, aangemerkt als één accijnsgoederenplaats.

      5 Het tweede, derde en vierde lid zijn van overeenkomstige toepassing op bier geproduceerd in een
      belastingentrepot.

      6 Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het alcoholgehalte en de
      toepassing van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel7
  - number: '8'
    text: Wijn wordt onderscheiden in niet-mousserende wijn en mousserende wijn.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel8
  - number: 8a
    text: |-
      1 Onder niet-mousserende wijn worden verstaan alle producten van GN-codes 2204 en 2205, met uitzondering van
      mousserende wijn als bedoeld in [artikel 9, eerste lid][ref1], met:

      a. een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 15%vol, voor zover de alcohol in het eindproduct
      volledig door gisting is verkregen; of

      b. een alcoholgehalte van meer dan 15%vol maar niet meer dan 18%vol, voor zover zij zonder enige verrijking zijn
      geproduceerd en de alcohol in het eindproduct volledig door gisting is verkregen.

      2 Onder niet-mousserende wijn worden mede verstaan alle niet in het eerste lid bedoelde producten van GN-codes
      2204 en 2205, alsmede producten van GN-code 2206, die ingevolge [artikel 6][ref2] niet als bier en ingevolge
      [artikel 9, tweede lid][ref3], niet als mousserende wijn worden aangemerkt, met:

      a. een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 10%vol; of

      b. een alcoholgehalte van meer dan 10%vol maar niet meer dan 15%vol, voor zover de alcohol in het product volledig
      door gisting is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel9
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: '9'
    text: |-
      1 Onder mousserende wijn worden verstaan alle producten van GN-codes 2204 10, 2204 21 06, 2204 21 07, 2204 21 08,
      2204 21 09, 2204 29 10 en 2205, die:

      a. zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en

      b. een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 15%vol voor zover de alcohol in het
      eindproduct volledig door gisting is verkregen.

      2 Onder mousserende wijn worden mede verstaan alle producten van GN-code 2206 00 31 en 2206 00 39, alsmede de niet
      in het eerste lid genoemde producten van GN-codes 2204 10, 2204 21 06, 2204 21 07, 2204 21 08, 2204 21 09, 2204 29
      10 en 2205, die:

      a. zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en

      b. een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 13%vol, dan wel een alcoholgehalte hebben
      van meer dan 13%vol maar niet meer dan 15%vol voor zover de alcohol in het eindproduct volledig door gisting is
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel9
  - number: '10'
    text: |-
      De accijns bedraagt per hectoliter, waarbij een gedeelte van een hectoliter rekenkundig wordt afgerond op twee
      decimalen, voor zowel niet-mousserende wijn als mousserende wijn met een alcoholgehalte van:

      a. niet meer dan 8,5% vol € 47,95;

      b. meer dan 8,5% vol € 95,69.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel10
  - number: 11a
    text: Tussenproducten worden onderscheiden in niet-mousserende tussenproducten en mousserende tussenproducten.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel11a
  - number: 11b
    text: |-
      Onder niet-mousserende tussenproducten worden verstaan alle niet als bier of wijn aan te merken producten van GN-
      codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die ingevolge
      [artikel 11][ref1] niet als mousserende tussenproducten worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel11c
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 11c
        hoofdstuk: II
        afdeling: 2a
  - number: 11c
    text: |-
      Onder mousserende tussenproducten worden verstaan alle niet als bier of wijn aan te merken producten van GN-codes
      2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die zijn verpakt in
      flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel een overdruk van 3
      bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel11c
  - number: 11d
    text: |-
      De accijns bedraagt per hectoliter, waarbij een gedeelte van een hectoliter rekenkundig wordt afgerond op twee
      decimalen, voor zowel niet-mousserende tussenproducten als mousserende tussenproducten met een alcoholgehalte van:

      a. niet meer dan 15% vol € 114,85;

      b. meer dan 15% vol € 161,80.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel11d
  - number: '12'
    text: |-
      1 Onder overige alcoholhoudende producten worden verstaan:

      a. alle producten van GN-codes 2207 en 2208 met een alcoholgehalte van meer dan 1,2%vol, ook wanneer deze producten
      bestanddeel zijn van een product van een GN-code uit een ander hoofdstuk van de gecombineerde nomenclatuur;

      b. producten van GN-codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 22%vol.

      2 Onder overige alcoholhoudende producten worden mede verstaan gedistilleerde dranken als bedoeld in het eerste
      lid, wanneer deze dranken andere producten, al dan niet in oplossing, bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel12
  - number: '13'
    text: |-
      De accijns bedraagt voor overige alcoholhoudende producten per hectoliter bij een temperatuur van 20°C per
      volumeprocent alcohol € 18,27, waarbij een gedeelte van een hectoliter rekenkundig wordt afgerond op drie decimalen
      en van een volumeprocent alcohol naar beneden wordt afgerond op één decimaal.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel13
  - number: '14'
    text: |-
      Voor de toepassing van [artikel 13][ref1] wordt het volume van overige alcoholhoudende producten die bestaan uit
      een vloeistof waarin zich bestanddelen in vaste vorm bevinden, gesteld op het volume van het gehele product.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel13
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel14
    references:
