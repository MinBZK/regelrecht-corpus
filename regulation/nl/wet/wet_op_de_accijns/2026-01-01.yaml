      1 Het is degene die op grond van [artikel 75][ref1] accijnszegels kan aanvragen niet toegestaan een zelfde
      tabaksproduct onder meer dan één kleinhandelsprijs in de handel te brengen of te doen brengen, tenzij in het merk
      of door een merk waaronder het is verpakt op duidelijke wijze een onderscheid is gemaakt.

      2 Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, afwijking van het eerste lid worden
      toegestaan.


