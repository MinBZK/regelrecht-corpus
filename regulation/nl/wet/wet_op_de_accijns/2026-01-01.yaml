        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '74'
    text: |-
      Een vergunning voor een accijnsgoederenplaats voor tabaksproducten kan, onverminderd het bepaalde in
      de[ artikelen 40, eerste en tweede lid][ref1], en [41][ref2], uitsluitend worden verkregen door degene die:

      a. tabaksproducten produceert of verwerkt;

      b. buiten Nederland geproduceerde of verwerkte tabaksproducten in Nederland van accijnszegels voorziet;

      c. buiten Nederland geproduceerde of verwerkte tabaksproducten opslaat die buiten Nederland zijn voorzien van door
      hem aangevraagde Nederlandse accijnszegels;

      d. tabaksproducten opslaat die zijn bestemd voor de in [artikel 66a ][ref3] bedoelde bevoorrading van schepen en
      luchtvaartuigen of die vanuit die plaats worden overgebracht naar een belastingentrepot, naar een in een andere
      lidstaat gevestigde geregistreerde geadresseerde of naar een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel41
