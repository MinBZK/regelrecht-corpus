      1 Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van minerale oliën die worden gebruikt:

      a. voor de aandrijving van schepen of als scheepsbehoeften aan boord van schepen;

      b. voor de voortstuwing van luchtvaartuigen voor zover het betreft halfzware olie als bedoeld in GN-code
      2710 19 21.

      2 De vrijstelling als bedoeld in het eerste lid, onderdelen a en b, is niet van toepassing met betrekking tot
      minerale oliën die worden gebruikt voor pleziervaartuigen of plezierluchtvaartuigen dan wel worden gebruikt aan
      boord van schepen die kennelijk niet worden gebruikt om te varen.

      3 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder een pleziervaartuig
      of een plezierluchtvaartuig: een vaartuig respectievelijk een luchtvaartuig dat wordt gebruikt door de eigenaar
      daarvan of door de natuurlijke of rechtspersoon die het gebruik daarvan geniet door huur of anderszins, voor andere
      dan commerciële doeleinden en met name voor andere doeleinden dan voor het vervoer van personen of goederen of voor
      het verrichten van diensten onder bezwarende titel, dan wel ten behoeve van overheidsinstanties.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2026-01-01#Artikel66
