      1 De inspecteur of een door hem aangewezen ambtenaar die het onderzoek verricht, kan vorderen dat van goederen één
      of meer monsters worden verstrekt.

      2 Bij ministeriële regeling worden regels gesteld omtrent het nemen van monsters.
