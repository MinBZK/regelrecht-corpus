      1 Het bedrag van de zekerheid kan door de inspecteur worden gewijzigd.

      2 Degene die op grond van [artikel 56][ref1] zekerheid heeft gesteld kan een verzoek tot verlaging van het bedrag
      van de zekerheid indienen.

      3 Bij verhoging van het bedrag van de zekerheid draagt degene die zekerheid heeft gesteld zorg dat binnen een maand
      na de bekendmaking ervan de zekerheid is aangevuld.


