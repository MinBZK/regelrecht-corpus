  - number: 71h
    text: |-
      1 Op verzoek wordt teruggaaf van accijns verleend voor motorbrandstof die geheel of gedeeltelijk bestaat uit:

      a. biobrandstof als bedoeld in artikel 2, onderdeel i, van de Richtlijn hernieuwbare energie indien die
      biobrandstof voldoet aan duurzaamheidscriteria als bedoeld in artikel 17 van die richtlijn, blijkend uit een audit
      uitgevoerd door een onafhankelijk deskundige of uit een andere wijze als bedoeld in artikel 18 van die richtlijn;

      b. hernieuwbare brandstof als bedoeld in [artikel 9.7.1.1 van de Wet milieubeheer][ref1] waarvoor een verklaring
      van de verificateur hernieuwbare brandstof als bedoeld in [artikel 9.7.4.4, tweede lid, van die wet][ref2] is
      afgegeven.

      2 Teruggaaf van accijns wordt slechts verleend:

      a. over de hoeveelheid biobrandstof of hernieuwbare brandstof in motorbrandstof als bedoeld in het eerste lid, mits
      die biobrandstof of hernieuwbare brandstof een lagere energie-inhoud heeft dan de gelijkwaardige motorbrandstof
      waarvan het accijnstarief van toepassing is; en

      b. indien 10 percent of meer van de in de motorbrandstof aanwezige energie afkomstig is van de biobrandstof of
      hernieuwbare brandstof, bedoeld in het eerste lid.

      3 De teruggaaf van accijns bedraagt een percentage van het accijnstarief van de gelijkwaardige motorbrandstof,
      bedoeld in het tweede lid, onderdeel a. Dit percentage is gelijk aan het verschil in energie-inhoud van de
      biobrandstof of hernieuwbare brandstof en die van de gelijkwaardige motorbrandstof, uitgedrukt als percentage van
      de energie-inhoud van de gelijkwaardige motorbrandstof.

      4 Voor de vaststelling van de energie-inhoud per volume van de biobrandstof of hernieuwbare brandstof en die van de
      gelijkwaardige motorbrandstof wordt voor zover mogelijk uitgegaan van hetgeen hiertoe is opgenomen in bijlage III
      van de Richtlijn hernieuwbare energie.

      5 De teruggaaf wordt verleend aan degene die de accijns ter zake van de uitslag tot verbruik verschuldigd is
      geworden.

      6 Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld waaronder de teruggaaf,
      bedoeld in het eerste lid, wordt verleend.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9.7.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9.7.4.4
