  - number: 90a
    text: |-
      1 Het is niet toegestaan een tabaksproductieapparaat zonder een daartoe strekkende vergunning van de inspecteur:

      a. in het vrije verkeer te brengen;

      b. te vervaardigen;

      c. voorhanden te hebben;

      d. te brengen naar een andere lidstaat; of

      e. uit te voeren naar een derde land.

      2 Onder tabaksproductieapparaat wordt verstaan elke machine of toestel van GN-code 8478, als bedoeld in Verordening
      (EEG) nr. 2658/87 van de Raad van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het
      gemeenschappelijk douanetarief (PbEG 1987, L 256), zoals deze luidt op 1 januari 2019.

      3 [Artikel 90, derde tot en met zevende, negende en tiende lid][ref1], zijn van overeenkomstige toepassing.

      4 Bij ministeriële regeling worden:

      a. regels gesteld met betrekking tot de in de vergunning op te nemen voorwaarden;

      b. gevallen aangewezen waarin in afwijking van het bepaalde in het eerste lid een vrijstelling van de
      vergunningplicht geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90
