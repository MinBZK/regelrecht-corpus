      1 [Artikel 69 van de Wet belastingen op milieugrondslag][ref1] is van overeenkomstige toepassing met betrekking tot
      vloeibaar gemaakt petroleumgas, indien geen aansluiting aanwezig is voor aardgas.

      2 In afwijking van [artikel 69, vijfde en zesde lid, van de Wet belastingen op milieugrondslag][ref2] bedraagt de
      teruggaaf € 108,16 per 1 000 kilogram vloeibaar gemaakt petroleumgas.


