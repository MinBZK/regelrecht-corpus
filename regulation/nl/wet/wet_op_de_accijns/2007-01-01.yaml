  - number: 50f.1
    text: |-
      Voorafgaand aan een levering als bedoeld in [artikel 2][ref1] dient degene die de levering verricht, de verkoper,
      een fiscaal vertegenwoordiger in Nederland te hebben aangesteld, die niet de geadresseerde van de accijnsgoederen
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
        hoofdstuk: I
        afdeling: '1'
  - number: 50f.2
    text: De fiscaal vertegenwoordiger dient in het bezit te zijn van een daartoe strekkende vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.3
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.4
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld met betrekking
      tot de verplichtingen waaraan de in het eerste lid bedoelde fiscaal vertegenwoordiger moet voldoen ten aanzien van
      de administratie.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.5
    text: 'In het verzoek worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.5.a
    text: de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.5.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de verkoper die hij
      vertegenwoordigt per jaar naar Nederland zal worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.5.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.5.d
    text: de naam en het adres van de verkoper die hij vertegenwoordigt; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.5.e
    text: de administratie van de in onderdeel *b* bedoelde accijnsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.6
    text: |-
      Bij het verzoek dient een verklaring van de verkoper te worden overgelegd waaruit blijkt dat degene die het verzoek
      indient door de verkoper is gemachtigd namens hem op te treden als fiscaal vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50f.7
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die het verzoek moet
      bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50f
  - number: 50g
    text: |-
      De[ artikelen 43][ref1], [44, tweede en derde lid][ref2], [45][ref3], [46][ref4], [48][ref5], [49][ref6] en
      [50][ref7] zijn van overeenkomstige toepassing met betrekking tot de in [artikel 50][ref8], bedoelde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0005251#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0005251#Artikel50
      [ref8]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50g
