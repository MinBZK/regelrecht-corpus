---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_accijns
regulatory_layer: WET
publication_date: '2022-07-07'
valid_from: '2007-01-01'
bwb_id: BWBR0005251
url: https://wetten.overheid.nl/BWBR0005251/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de accijnswetgeving te moderniseren, te vereenvoudigen
    en op een aantal punten technisch te herzien en dat het voorts wenselijk is de heffing van de accijnzen onder
    te brengen in één heffingswet en het stelsel zodanig te uniformeren dat een einde wordt gemaakt aan de grote
    verscheidenheid in regelgeving welke kenmerkend is voor de huidige accijnswetgeving;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Onder de naam accijns wordt een belasting geheven van:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: 1.1.a
    text: bier;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: 1.1.b
    text: wijn;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: 1.1.c
    text: tussenprodukten;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: 1.1.d
    text: overige alcoholhoudende produkten;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: 1.1.e
    text: minerale oliën; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: 1.1.f
    text: tabaksprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: '1.2'
    text: De accijns wordt verschuldigd ter zake van de uitslag en van de invoer van de in het eerste lid bedoelde goederen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1
  - number: 1a.1
    text: 'In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.a
    text: |-
      accijnsgoed: een goed als bedoeld in [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 1a.1.b
    text: |-
      vervaardigen van een accijnsgoed: elk handelen waarbij of waardoor een accijnsgoed ontstaat of de samenstelling van
      een accijnsgoed wordt gewijzigd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.c
    text: |-
      belastingentrepot: iedere plaats op het grondgebied van de Gemeenschap buiten Nederland waar op grond van de
      wettelijke bepalingen van de lid-staat waar de plaats zich bevindt, accijnsgoederen onder schorsing van accijns
      mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden ontvangen en mogen worden
      verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.d
    text: |-
      accijnsgoederenplaats: iedere plaats in Nederland waar op grond van de bepalingen van deze wet accijnsgoederen
      onder schorsing van accijns mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden
      ontvangen en mogen worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.e
    text: |-
      entrepot: zowel de douanebestemming vrij entrepot als de douaneregeling douane-entrepot, bedoeld in artikel 4,
      onderdelen 15 en 16, van het Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.f
    text: |-
      plaats voor tijdelijke opslag: een plaats die als zodanig is goedgekeurd krachtens artikel 51, eerste lid, van het
      Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.g
    text: 'lid-staat: een lid-staat van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.h
    text: |-
      grondgebied van de Gemeenschap: het grondgebied van de lid-staten van de Europese Gemeenschappen zoals dat is
      omschreven in artikel 2 van de Richtlijn betreffende de algemene regeling voor accijnsprodukten, het voorhanden
      hebben en het verkeer daarvan en de controles daarop (92/12/EEG van 25 februari 1992; *PbEG* L 76);
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.i
    text: 'derde land: elk ander grondgebied dan het grondgebied van de Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.j
    text: |-
      vergunninghouder van een geregistreerd bedrijf: de natuurlijke persoon of rechtspersoon die niet de hoedanigheid
      van vergunninghouder van een accijnsgoederenplaats of van een belastingentrepot bezit en die op grond van een
      ingevolge deze wet dan wel een ingevolge de wettelijke bepalingen van een andere lid-staat afgegeven vergunning
      gemachtigd is om bij de bedrijfsuitoefening accijnsgoederen onder schorsing van accijns uit een andere lid-staat
      te ontvangen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.k
    text: |-
      vergunninghouder van een niet-geregistreerd bedrijf: de natuurlijke persoon of rechtspersoon die niet de
      hoedanigheid van vergunninghouder van een accijnsgoederenplaats of van een belastingentrepot bezit en die op
      grond van een ingevolge deze wet dan wel een ingevolge de wettelijke bepalingen van een andere lid-staat afgegeven
      vergunning gemachtigd is om bij de bedrijfsuitoefening incidenteel accijnsgoederen onder schorsing van accijns uit
      een andere lid-staat te ontvangen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.l
    text: |-
      communautaire douaneregeling: de communautaire regelingen met betrekking tot douanevervoer, vrije zones, entrepots,
      actieve veredeling, behandeling onder douanetoezicht, tijdelijke invoer, passieve veredeling en uitvoer naar een
      derde land (wederuitvoer daaronder begrepen);
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.m
    text: |-
      intracommunautair vervoer: het vervoer van accijnsgoederen vanuit het grondgebied van een lid-staat naar het
      grondgebied van een andere lid-staat;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.n
    text: |-
      schorsing van accijns: een stelsel waarin van accijnsgoederen die worden vervaardigd, worden verwerkt, voorhanden
      zijn of worden vervoerd, op grond van de bepalingen van deze wet dan wel op grond van de wettelijke bepalingen van
      een andere lid-staat de accijns nog niet is geheven;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.o
    text: |-
      ondernemer: een ondernemer in de zin van de [Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 1a.1.p
    text: |-
      geleidedocument: een document dat op grond van de bepalingen van deze wet dan wel op grond van de wettelijke
      bepalingen van een andere lid-staat bij het vervoer van de accijnsgoederen aanwezig dient te zijn;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.1.q
    text: |-
      GN-code: de code als bedoeld in [verordening (EEG) nr. 2658/87](31987R2658) van de Raad van de Europese
      Gemeenschappen van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk
      douanetarief (*PbEG* L 256), zoals deze luidt op 19 oktober 1992 onderscheidenlijk, indien het minerale oliën
      betreft, op 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Bij ministeriële regeling kunnen de GN-codes, genoemd in de [artikelen 5, vierde lid][ref1],
      [25, eerste lid][ref2], [26, tweede tot en met zevende lid][ref3], [66, eerste lid, onderdeel b][ref4], en
      [71, eerste lid][ref5], worden aangepast indien de overeenkomstige GN-codes zoals opgenomen in de [richtlijn
      nr. 2003/96/EG](32003L0096) van de Raad van de Europese Unie van 27 oktober 2003 tot herstructurering van de
      communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEG L 283), in overeenstemming
      met artikel 2, lid vijf, van die richtlijn zijn aangepast. In dat geval kan bij ministeriële regeling eveneens de
      laatstgenoemde datum in het eerste lid, onderdeel q, worden vervangen door de datum van de versie van de in dat
      onderdeel bedoelde verordening die aan de wijziging van de GN-codes ten grondslag heeft gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel66
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '5'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '26'
        hoofdstuk: II
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: '71'
        hoofdstuk: V
        afdeling: '2'
  - number: '2.1'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder uitslag het brengen van een accijnsgoed
      buiten een plaats die voor dat soort accijnsgoed als accijnsgoederenplaats is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      Als uitslag wordt mede aangemerkt het verbruik, anders dan als grondstof, van een accijnsgoed binnen een plaats die
      voor dat soort accijnsgoed als accijnsgoederenplaats is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: '2.3'
    text: |-
      Als uitslag wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te stellen
      voorwaarden, brengen van een accijnsgoed vanuit een accijnsgoederenplaats naar:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: 2.3.a
    text: een andere accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: 2.3.b
    text: een belastingentrepot;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: 2.3.c
    text: een in een andere lid-staat gevestigd geregistreerd bedrijf;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: 2.3.d
    text: een in een andere lid-staat gevestigd niet-geregistreerd bedrijf;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: 2.3.e
    text: een derde land.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: '2.4'
    text: |-
      Als uitslag wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te stellen
      voorwaarden, verbruik van minerale oliën als brandstof voor het vervaardigen van minerale oliën in een
      accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: '2.5'
    text: |-
      De voorwaarden als bedoeld in het derde lid hebben betrekking op formaliteiten waaraan bij de overbrenging van
      accijnsgoederen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: '2.6'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, voor minerale oliën waarvoor in
      [artikel 27][ref1] geen tarief is vermeld, ontheffing worden verleend van de formaliteiten, bedoeld in het vijfde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '2.7'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2
  - number: 2a.1
    text: |-
      Als uitslag wordt mede aangemerkt de ontvangst door een geregistreerd bedrijf of door een niet-geregistreerd
      bedrijf van een accijnsgoed dat wordt overgebracht vanuit een belastingentrepot.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Het overbrengen van een accijnsgoed vanuit een belastingentrepot naar een in Nederland gevestigd geregistreerd
      bedrijf of naar een niet-geregistreerd bedrijf dient te geschieden met inachtneming van bij algemene maatregel van
      bestuur te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2a
  - number: 2a.3
    text: |-
      De voorwaarden als bedoeld in het tweede lid hebben betrekking op formaliteiten waaraan bij de overbrenging van
      accijnsgoederen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2a
  - number: 2a.4
    text: |-
      [Artikel 2, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 2a.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2a
  - number: 2b.1
    text: |-
      Als uitslag wordt mede aangemerkt het door een ondernemer of een publiekrechtelijk lichaam voor commerciële
      doeleinden voorhanden hebben van een accijnsgoed dat in een andere lid-staat is uitgeslagen dan wel ingevoerd en
      waarvan in Nederland de accijns niet is geheven.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2b.2
    text: |-
      Voor de toepassing van het eerste lid worden onder het voor commerciële doeleinden voorhanden hebben van een
      accijnsgoed mede verstaan de levering van een accijnsgoed en het aanwenden van een accijnsgoed voor eigen verbruik
      in het kader van de onderneming of het publiekrechtelijke lichaam.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, worden bepaald dat het
      eerste lid geen toepassing vindt indien sprake is van het op incidentele basis aanwenden van beperkte hoeveelheden
      accijnsgoederen voor eigen verbruik als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2b.4
    text: 'Bij algemene maatregel van bestuur worden, ter verzekering van de heffing, regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2b.4.a
    text: het vervoer van de in het eerste lid bedoelde accijnsgoederen vanuit een andere lid-staat naar Nederland;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2b.4.b
    text: de verplichtingen waaraan de ondernemer of het lichaam als bedoeld in het eerste lid moet voldoen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2b.5
    text: |-
      In afwijking van het eerste en tweede lid wordt niet als uitslag aangemerkt het voorhanden hebben van
      minerale oliën die in een andere lid-staat zijn uitgeslagen dan wel ingevoerd, in de normale reservoirs van
      bedrijfsmotorrijtuigen en die bestemd zijn als brandstof voor deze motorrijtuigen of in de normale reservoirs van
      containers voor speciale doeleinden en die bestemd zijn voor de werking tijdens het vervoer van specifieke systemen
      die tot de uitrusting van deze containers behoren.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2b.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2b
  - number: 2c.1
    text: |-
      Geen accijns wordt verschuldigd ter zake van het door een natuurlijke persoon, anders dan als ondernemer, voor
      eigen verbruik brengen van een accijnsgoed vanuit een andere lid-staat naar Nederland.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2c
  - number: 2c.2
    text: |-
      Onverminderd het bepaalde in het eerste lid wordt mede als uitslag aangemerkt het door een natuurlijke persoon voor
      andere doeleinden dan voor persoonlijk verbruik voorhanden hebben van een accijnsgoed dat in een andere lid-staat
      is uitgeslagen dan wel ingevoerd en waarvan in Nederland de accijns niet is geheven.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2c
  - number: 2c.3
    text: |-
      Indien de hoeveelheid goederen een bij ministeriële regeling vastgestelde hoeveelheid overschrijdt, worden de
      goederen geacht voor andere doeleinden dan persoonlijk verbruik voorhanden te worden gehouden, tenzij het tegendeel
      wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2c
  - number: 2d.1
    text: |-
      Als uitslag wordt mede aangemerkt de verkrijging door een natuurlijke persoon van minerale oliën die in een andere
      lid-staat zijn uitgeslagen dan wel ingevoerd en waarvan in Nederland de accijns niet is geheven, indien deze
      goederen op een atypische wijze worden vervoerd door een natuurlijke persoon, anders dan als ondernemer, of voor
      diens rekening.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2d
  - number: 2d.2
    text: |-
      Als atypische wijze van vervoer worden aangemerkt het vervoer van motorbrandstof anders dan in de brandstoftank
      van voertuigen of in een draagbaar reservoir, alsmede het vervoer van vloeibare verwarmingsprodukten anders dan in
      tankwagens die voor rekening van een onderneming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2d
  - number: 2d.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2d
  - number: 2e.1
    text: |-
      Onverminderd het bepaalde in de voorgaande artikelen wordt mede als uitslag aangemerkt de levering van een
      accijnsgoed dat direct of indirect door of voor rekening van de verkoper vanuit een andere lid-staat naar Nederland
      wordt verzonden of vervoerd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2e
  - number: 2e.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2e
  - number: 2f
    text: |-
      Als uitslag wordt mede aangemerkt het in strijd met [artikel 5][ref1] vervaardigen van een accijnsgoed alsmede
      het voorhanden hebben van een accijnsgoed dat niet overeenkomstig de bepalingen van deze wet in de heffing is
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2f
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '5'
        hoofdstuk: I
        afdeling: '2'
  - number: 2g.1
    text: |-
      Ter zake van het brengen van een accijnsgoed vanuit een belastingentrepot naar een accijnsgoederenplaats wordt geen
      accijns verschuldigd, mits bij de overbrenging van de goederen wordt voldaan aan bij algemene maatregel van bestuur
      te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2g
  - number: 2g.2
    text: |-
      De voorwaarden als bedoeld in het eerste lid hebben betrekking op formaliteiten waaraan bij de overbrenging van
      accijnsgoederen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2g
  - number: 2g.3
    text: |-
      [Artikel 2, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2g
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 2g.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2g
  - number: 2h
    text: |-
      Als uitslag wordt mede aangemerkt het onttrekken van accijnsgoederen aan schorsing van accijns in de situaties,
      bedoeld in [artikel 86a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel86a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel2h
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 86a
        hoofdstuk: VI
        afdeling: '3'
  - number: '3.1'
    text: |-
      In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder invoer het vanuit een derde land brengen van
      een accijnsgoed in Nederland.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: '3.2'
    text: 'Als invoer wordt mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.2.a
    text: |-
      het in Nederland beëindigen van een communautaire douaneregeling waaronder een accijnsgoed is geplaatst, anders dan
      door plaatsing onder een andere communautaire douaneregeling;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.2.b
    text: het in Nederland onttrekken van een accijnsgoed aan een communautaire douaneregeling;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.2.c
    text: |-
      het eigen verbruik, anders dan als grondstof, in Nederland van een accijnsgoed dat onder een communautaire
      douaneregeling is geplaatst of binnen een plaats voor tijdelijke opslag.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      Als invoer wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te stellen
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.3.a
    text: |-
      brengen van een accijnsgoed vanuit een derde land naar een accijnsgoederenplaats die voor dat soort accijnsgoed als
      zodanig is aangewezen of naar een plaats voor tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.3.b
    text: |-
      in Nederland plaatsen onder een communautaire douaneregeling van een vanuit een derde land binnengebracht
      accijnsgoed;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.3.c
    text: |-
      brengen van een accijnsgoed dat is geplaatst onder een communautaire douaneregeling naar een accijnsgoederenplaats
      die voor dat soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.3.d
    text: |-
      brengen van een accijnsgoed vanuit een plaats voor tijdelijke opslag naar een accijnsgoederenplaats die voor dat
      soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: 3.3.e
    text: |-
      het onder ambtelijk toezicht vernietigen van een accijnsgoed dat onder een communautaire douaneregeling is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: '3.4'
    text: |-
      De voorwaarden als bedoeld in het derde lid hebben betrekking op formaliteiten waaraan bij de overbrenging van
      accijnsgoederen moet worden voldaan alsmede op de daarbij te stellen zekerheid.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: '3.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel3
  - number: '5.1'
    text: 'Het is niet toegestaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.1.a
    text: |-
      een accijnsgoed te vervaardigen buiten een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.1.b
    text: een accijnsgoed voorhanden te hebben dat niet overeenkomstig de bepalingen van deze wet in de heffing is betrokken.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het verbod als bedoeld in het eerste lid, onderdeel *a*, is niet van toepassing indien het vervaardigen geschiedt
      overeenkomstig de wettelijke bepalingen, bedoeld in [artikel 2, tweede lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '2'
  - number: '5.3'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt ontheffing verleend van de in
      het eerste lid bedoelde verboden voor:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.3.a
    text: |-
      het vervaardigen van accijnsgoederen uit andere accijnsgoederen, waarbij het accijnsbedrag dat de eerstbedoelde
      accijnsgoederen vertegenwoordigen niet hoger is dan het accijnsbedrag dat de accijnsgoederen vertegenwoordigen
      waaruit zij zijn vervaardigd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.3.b
    text: |-
      het vervaardigen van accijnsgoederen waarvoor een vrijstelling van accijns geldt op de voet van [artikel 65][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
        hoofdstuk: V
        afdeling: '1'
  - number: 5.3.c
    text: |-
      het thuis vervaardigen van bier en wijn door particulieren, voor zover die goederen worden aangewend voor eigen
      gebruik;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.3.d
    text: |-
      het vervaardigen en het voorhanden hebben van andere minerale oliën dan bedoeld in het vierde lid, mits
      deze minerale oliën niet op grond van [artikel 28][ref1] worden gelijkgesteld met minerale oliën waarvoor in
      [artikel 27][ref2] een tarief is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '28'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '5.4'
    text: 'De in het derde lid, onderdeel *d*, bedoelde minerale oliën zijn de produkten van de GN-codes:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.a
    text: |-
      1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.b
    text: 2707 10, 2707 20, 2707 30 en 2707 50;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.c
    text: 2710 11 tot en met 2710 19 69; codes 2710 11 21, 2710 11 25 en 2710 19 29, indien deze in bulk worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.d
    text: 2711, met uitzondering van de producten van de GN-codes 2711 11, 2711 21 en 2711 29;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.e
    text: 2901 10;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.f
    text: 2902 20, 2902 30, 2902 41, 2902 42, 2902 43 en 2902 44;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.g
    text: |-
      2905 11 00, die niet langs synthetische weg zijn verkregen en die zijn bestemd om te worden gebruikt als
      motorbrandstof of als brandstof voor verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: 5.4.h
    text: 3824 90 99, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor verwarming.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel5
  - number: '6'
    text: 'Onder bier wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel6
  - number: 6.a
    text: elk produkt van GN-code 2203; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel6
  - number: 6.b
    text: |-
      elk produkt van GN-code 2206 dat een mengsel van bier als bedoeld in onderdeel *a* en niet-alcoholhoudende dranken
      bevat;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel6
  - number: '7.1'
    text: 'De accijns bedraagt per hectoliter voor bier met een extractgehalte, uitgedrukt in percenten Plato, van:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: 7.1.a
    text: minder dan 7 € 5,50;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: 7.1.b
    text: 7 tot 11 € 18,84;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: 7.1.c
    text: 11 tot 15 € 25,11;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: 7.1.d
    text: 15 en meer € 31,40.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      Met betrekking tot bier als bedoeld in [artikel 6, onderdeel ][ref1], met een alcoholgehalte van niet meer dan
      1,2%vol wordt het tarief van het eerste lid, onderdeel *a*, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel6
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.3'
    text: |-
      In afwijking in zoverre van het eerste lid bedraagt de accijns voor bier dat is vervaardigd in een
      accijnsgoederenplaats waar in het voorafgaande kalenderjaar niet meer dan 200 000 hl bier is vervaardigd 92,5/100
      deel van de in de onderdelen *b, c* en *d* vermelde bedragen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.4'
    text: 'Het derde lid vindt slechts toepassing met betrekking tot een accijnsgoederenplaats die:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: 7.4.a
    text: juridisch en economisch onafhankelijk is van een andere accijnsgoederenplaats waar bier wordt vervaardigd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: 7.4.b
    text: |-
      gebruik maakt van installaties die in fysiek opzicht losstaan van die van een andere accijnsgoederenplaats waar
      bier wordt vervaardigd; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: 7.4.c
    text: |-
      geen bier vervaardigt onder licentie, tenzij het onder licentie vervaardigde bier slechts een klein gedeelte van de
      totale produktie betreft, met dien verstande dat het derde lid geen toepassing vindt met betrekking tot het onder
      licentie vervaardigde bier.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor de toepassing van het derde en vierde lid wordt een samenwerkingsverband van twee of meer
      accijnsgoederenplaatsen waar gezamenlijk in het voorafgaande kalenderjaar niet meer dan 200 000 hl bier is
      vervaardigd, aangemerkt als één accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.6'
    text: |-
      Onder extractgehalte wordt verstaan het gehalte van de in de stamwort opgeloste niet-vluchtige stoffen, vermeerderd
      met het gehalte van de na de gisting aan het bier toegevoegde stoffen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.7'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de toepassing van het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.8'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het extractgehalte.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.9'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt, met inachtneming van bij ministeriële regeling te
      stellen regels, het volume van bier in geconcentreerde vorm herleid tot het volume van voor gebruik gereed bier.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '7.10'
    text: |-
      Dit artikel is van overeenkomstige toepassing met betrekking tot bier dat afkomstig is uit een belastingentrepot
      waar bier wordt vervaardigd of uit een in een derde land gelegen brouwerij.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel7
  - number: '8'
    text: Wijn wordt onderscheiden in niet-mousserende wijn en mousserende wijn.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel8
  - number: 8a.1
    text: |-
      Onder niet-mousserende wijn worden verstaan alle produkten van GN-codes 2204 en 2205, met uitzondering van
      mousserende wijn als bedoeld in [artikel 9, eerste lid][ref1], met:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel9
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 8a.1.a
    text: |-
      een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 15%vol, voor zover de alcohol in het eindprodukt
      volledig door gisting is verkregen; of
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel8a
  - number: 8a.1.b
    text: |-
      een alcoholgehalte van meer dan 15%vol maar niet meer dan 18%vol, voor zover zij zonder enige verrijking zijn
      geproduceerd en de alcohol in het eindprodukt volledig door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Onder niet-mousserende wijn worden mede verstaan alle niet in het eerste lid bedoelde produkten van GN-codes
      2204 en 2205, alsmede produkten van GN-code 2206, die ingevolge [artikel 6][ref1] niet als bier en ingevolge
      [artikel 9, tweede lid][ref2], niet als mousserende wijn worden aangemerkt, met:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel9
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 8a.2.a
    text: een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 10%vol; of
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel8a
  - number: 8a.2.b
    text: |-
      een alcoholgehalte van meer dan 10%vol maar niet meer dan 15%vol, voor zover de alcohol in het produkt volledig
      door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel8a
  - number: '9.1'
    text: 'Onder mousserende wijn worden verstaan alle produkten van GN-codes 2204 10, 2204 21 10, 2204 29 10 en 2205, die:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel9
  - number: 9.1.a
    text: |-
      zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel9
  - number: 9.1.b
    text: |-
      een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 15%vol voor zover de alcohol in het eindprodukt
      volledig door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel9
  - number: '9.2'
    text: |-
      Onder mousserende wijn worden mede verstaan alle produkten van GN-code 2206 00 91, alsmede de niet in het eerste
      lid genoemde produkten van GN-codes 2204 10, 2204 21 10, 2204 29 10 en 2205, die:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel9
  - number: 9.2.a
    text: |-
      zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel9
  - number: 9.2.b
    text: |-
      een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 13%vol, dan wel een alcoholgehalte hebben
      van meer dan 13%vol maar niet meer dan 15%vol voor zover de alcohol in het eindprodukt volledig door gisting is
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel9
  - number: '10.1'
    text: 'De accijns bedraagt per hectoliter voor niet-mousserende wijn met een alcoholgehalte van:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel10
  - number: 10.1.a
    text: niet meer dan 8,5% vol € 29,51;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel10
  - number: 10.1.b
    text: meer dan 8,5%vol, maar niet meer dan 15%vol € 59,02;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel10
  - number: 10.1.c
    text: meer dan 15%vol € 102,68.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel10
  - number: '10.2'
    text: 'De accijns bedraagt per hectoliter voor mousserende wijn met een alcoholgehalte van:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel10
  - number: 10.2.a
    text: niet meer dan 8,5%vol € 38,16;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel10
  - number: 10.2.b
    text: meer dan 8,5%vol € 201,24.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel10
  - number: 11a
    text: Tussenprodukten worden onderscheiden in niet-mousserende tussenprodukten en mousserende tussenprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel11a
  - number: 11b
    text: |-
      Onder niet-mousserende tussenprodukten worden verstaan alle niet als bier of wijn aan te merken produkten van GN-
      codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die ingevolge
      [artikel 11][ref1] niet als mousserende tussenprodukten worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel11c
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 11c
        hoofdstuk: II
        afdeling: 2a
  - number: 11c
    text: |-
      Onder mousserende tussenprodukten worden verstaan alle niet als bier of wijn aan te merken produkten van GN-codes
      2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die zijn verpakt in
      flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel een overdruk van 3
      bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel11c
  - number: 11d.1
    text: 'De accijns bedraagt per hectoliter voor niet-mousserende tussenprodukten met een alcoholgehalte van:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel11d
  - number: 11d.1.a
    text: niet meer dan 15%vol € 72,89;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel11d
  - number: 11d.1.b
    text: meer dan 15%vol € 102,68.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel11d
  - number: 11d.2
    text: De accijns bedraagt per hectoliter voor mousserende tussenprodukten € 201,24.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel11d
  - number: '12.1'
    text: 'Onder overige alcoholhoudende produkten worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel12
  - number: 12.1.a
    text: |-
      alle produkten van GN-codes 2207 en 2208 met een alcoholgehalte van meer dan 1,2%vol, ook wanneer deze produkten
      bestanddeel zijn van een produkt van een GN-code uit een ander hoofdstuk van de gecombineerde nomenclatuur;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel12
  - number: 12.1.b
    text: produkten van GN-codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 22%vol.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel12
  - number: '12.2'
    text: |-
      Onder overige alcoholhoudende produkten worden mede verstaan gedistilleerde dranken als bedoeld in het eerste lid,
      wanneer deze dranken andere produkten, al dan niet in oplossing, bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel12
  - number: '13'
    text: |-
      De accijns bedraagt voor overige alcoholhoudende produkten per hectoliter bij een temperatuur van 20°C per volume-
      percent alcohol € 15,04.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel13
  - number: '14'
    text: |-
      Voor de toepassing van [artikel 13][ref1] wordt het volume van overige alcoholhoudende produkten die bestaan uit
      een vloeistof waarin zich bestanddelen in vaste vorm bevinden, gesteld op het volume van het gehele produkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel13
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '13'
        hoofdstuk: II
        afdeling: '3'
  - number: '25.1'
    text: 'Onder minerale oliën worden verstaan de producten van de GN-codes:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.a
    text: |-
      1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.b
    text: 2706 tot en met 2710;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.c
    text: 2711, met uitzondering van aardgas;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.d
    text: 2712 tot en met 2715;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.e
    text: 2901 en 2902;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.f
    text: |-
      2905 11 00, die niet langs synthetische weg zijn verkregen en zijn bestemd om te worden gebruikt als motorbrandstof
      of als brandstof voor verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.g
    text: 3403;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.h
    text: 3811;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.i
    text: 3817;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.1.j
    text: 3824 90 99, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor verwarming.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: '25.2'
    text: 'Als minerale oliën worden mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.2.a
    text: |-
      andere produkten dan minerale oliën als bedoeld in het eerste lid, die zijn bestemd voor gebruik, worden aangeboden
      voor verkoop of worden gebruikt als motorbrandstof, als additief of als vulstof in motorbrandstoffen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: 25.2.b
    text: |-
      andere koolwaterstoffen dan bedoeld in het eerste lid of in onderdeel *a*, die zijn bestemd voor gebruik, worden
      aangeboden voor verkoop of worden gebruikt voor verwarmingsdoeleinden, met uitzondering van steenkool, bruinkool,
      turf, andere soortgelijke vaste koolwaterstoffen en aardgas.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel25
  - number: '26.1'
    text: |-
      Voor de toepassing van het tarief worden minerale oliën onderscheiden in lichte olie, halfzware olie, gasolie,
      zware stookolie, vloeibaar gemaakt petroleumgas en methaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '26.2'
    text: |-
      Lichte olie wordt onderscheiden in gelode lichte olie en ongelode lichte olie. Onder gelode lichte olie worden
      verstaan de producten van GN-codes 2710 11 31, 2710 11 51 en 2710 11 59. Onder ongelode lichte olie worden verstaan
      de producten van GN-codes 2710 11 41, 2710 11 45 en 2710 11 49.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '26.3'
    text: Onder halfzware olie worden verstaan de producten van GN-codes 2710 19 21 en 2710 19 25.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '26.4'
    text: Onder gasolie worden verstaan de producten van GN-codes 2710 19 41, 2710 19 45 en 2710 19 49.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '26.5'
    text: Onder zware stookolie worden verstaan de producten van GN-codes 2710 19 61 tot en met 2710 19 69.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '26.6'
    text: Onder vloeibaar gemaakt petroleumgas worden verstaan de produkten van GN-codes 2711 12 11 tot en met 2711 19 00.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '26.7'
    text: Onder methaan worden verstaan de produkten van GN-code 2711 29 00.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '26.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het bepalen van het loodgehalte van
      lichte olie.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel26
  - number: '27.1'
    text: 'De accijns bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.1.a
    text: |-
      lichte olie, per 1000 L bij een temperatuur van 15°C € 755,90 indien het gelode lichte olie betreft en € 678,79
      indien het ongelode lichte olie betreft;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.1.b
    text: |-
      halfzware olie en gasolie, per 1000 L bij een temperatuur van 15 °C € 370,75 indien het zwavelvrije halfzware olie
      en gasolie betreft en € 380,91 indien het andere halfzware olie en gasolie betreft;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.1.c
    text: zware stookolie, per 1 000 kg € 32,51;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.1.d
    text: vloeibaar gemaakt petroleumgas, per 1000 kg € 96,21;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.1.e
    text: methaan nihil.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: '27.2'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel b, bedraagt de accijns voor halfzware olie en gasolie die
      zijn bestemd voor de voortstuwing van luchtvaartuigen, per 1000 L bij een temperatuur van 15 °C € 209,58.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: '27.3'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel *b*, bedraagt de accijns voor halfzware olie en gasolie die
      zijn bestemd voor ander gebruik dan voor het aandrijven van motorrijtuigen op de weg of van pleziervaartuigen of
      voor de voortstuwing van luchtvaartuigen en die daartoe zijn voorzien van bij ministeriële regeling, onder daarbij
      te stellen voorwaarden, voorgeschreven herkenningsmiddelen, per 1 000 L bij een temperatuur van 15 °C € 46,56.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: '27.4'
    text: |-
      In afwijking van het eerste lid, onderdeel *d*, bedraagt de accijns voor vloeibaar gemaakt petroleumgas dat is
      bestemd voor ander gebruik dan voor het aandrijven van motorrijtuigen op de weg of van pleziervaartuigen of voor de
      voortstuwing van luchtvaartuigen nihil.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: '27.5'
    text: 'Voor de toepassing van deze wet en de daarop gebaseerde regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.5.a
    text: |-
      weg: elke voor het openbaar rijverkeer of ander verkeer openstaande weg en elk zodanig pad, de in de weg of het pad
      liggende bruggen en duikers alsmede de tot de weg behorende paden en bermen of zijkanten;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.5.b
    text: |-
      motorrijtuig: een voertuig dat is bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend of
      mede door een mechanische kracht, op of aan het voertuig aanwezig;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27.5.c
    text: |-
      pleziervaartuig: een vaartuig dat wordt gebruikt door de eigenaar daarvan of door de natuurlijke of rechtspersoon
      die het gebruik daarvan geniet door huur of anderszins, voor andere dan commerciële doeleinden en met name voor
      andere doeleinden dan voor het vervoer van personen of goederen of voor het verrichten van diensten tegen betaling,
      dan wel ten behoeve van overheidsinstanties.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: '27.6'
    text: |-
      Voor de toepassing van deze wet en de daarop gebaseerde regelingen wordt het toevoegen van herkenningsmiddelen als
      bedoeld in het derde lid aan minerale oliën, alsmede het afscheiden van die herkenningsmiddelen of bestanddelen
      daarvan van de minerale oliën waaraan zij zijn toegevoegd, het opheffen of veranderen van de werking daarvan
      daaronder begrepen, aangemerkt als het vervaardigen van een accijnsgoed.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: '27.7'
    text: |-
      Voor de toepassing van het tarief als bedoeld in het eerste lid, onderdelen *a* en *b*, en het derde lid, worden
      bij ministeriële regeling regels gesteld met betrekking tot de herleiding van de actuele hoeveelheden minerale
      oliën naar hoeveelheden bij een temperatuur van 15°C.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: '27.8'
    text: |-
      Onder zwavelvrije halfzware olie en gasolie wordt verstaan halfzware olie en gasolie met een zwavelgehalte van
      maximaal 10 mg/kg.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27
  - number: 27a
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige toepassing op
      de in [artikel 27, eerste lid, onderdelen a en b, en tweede lid][ref3], vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.1'
    text: |-
      Andere minerale oliën dan die waarvoor in [artikel 27, eerste dan wel derde lid][ref1], een accijnstarief
      is vermeld, worden, indien zij zijn bestemd voor gebruik, worden aangeboden voor verkoop of worden
      gebruikt als brandstof voor verwarming of als motorbrandstof, aan de accijns onderworpen naar het ingevolge
      [artikel 27, eerste dan wel derde lid][ref2], voor de gelijkwaardige brandstof of motorbrandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.2'
    text: |-
      Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel ][ref1], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste dan wel derde lid][ref2], voor de gelijkwaardige motorbrandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.3'
    text: |-
      Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel ][ref1], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste dan wel derde lid][ref2], voor de gelijkwaardige brandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.4'
    text: |-
      Minerale oliën die kunnen worden gelijkgesteld met meer dan één soort minerale olie worden voor de toepassing
      van het tarief gelijkgesteld met de soort minerale olie die van de desbetreffende soorten het eerst is vermeld in
      [artikel 26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
        hoofdstuk: II
        afdeling: '6'
  - number: '29'
    text: Onder tabaksprodukten wordt verstaan tot verbruik bereide tabak in de vorm van sigaren, sigaretten en rooktabak.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel29
  - number: '30.1'
    text: 'Onder sigaren worden verstaan voor roken geschikte tabaksrolletjes:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel30
  - number: 30.1.a
    text: met een dekblad van natuurlijke tabak;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel30
  - number: 30.1.b
    text: |-
      bestaande uit een gebroken melange, met een dekblad met normale sigaarkleur van gereconstitueerde tabak dat het
      product volledig omhult, in voorkomend geval met inbegrip van het filter maar met uitzondering van het mondstuk,
      alsmede een omblad van gereconstitueerde tabak, en waarvan de massa, zonder filter of mondstuk, ten minste 1,2 gram
      bedraagt en het dekblad schuin is gewikkeld volgens een lijn die met de lengteas van het rolletje een scherpe hoek
      van ten minste 30° maakt; of
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel30
  - number: 30.1.c
    text: |-
      bestaande uit een gebroken melange, met een dekblad met normale sigaarkleur van gereconstitueerde tabak dat het
      product volledig omhult, in voorkomend geval met inbegrip van het filter maar met uitzondering van het mondstuk,
      alsmede een omblad van gereconstitueerde tabak, en waarvan de massa, zonder filter of mondstuk, ten minste 2,3 gram
      bedraagt en de omtrek over ten minste een derde van de lengte 34 mm of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel30
  - number: '30.2'
    text: |-
      Als sigaren worden mede aangemerkt producten die gedeeltelijk uit andere stoffen dan tabak bestaan, doch overigens
      voldoen aan het bepaalde in het eerste lid, mits deze producten zijn voorzien van een dekblad van natuurlijke tabak
      of van gereconstitueerde tabak.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel30
  - number: '31.1'
    text: |-
      Onder sigaretten worden verstaan niet als sigaren aan te merken tabaksrolletjes die geschikt zijn om als zodanig te
      worden gerookt, alsmede tabaksrolletjes die door middel van een eenvoudige niet-industriële handeling in een huls
      van sigarettenpapier worden geschoven of met sigarettenpapier worden omhuld.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel31
  - number: '31.2'
    text: |-
      Als sigaretten worden mede aangemerkt produkten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel31
  - number: '32.1'
    text: Onder rooktabak wordt verstaan niet als sigaren of als sigaretten aan te merken voor roken geschikte tabak.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel32
  - number: '32.2'
    text: |-
      Als rooktabak worden mede aangemerkt produkten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel32
  - number: '35.1'
    text: 'De accijns bedraagt in percenten van de kleinhandelsprijs voor:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35
  - number: 35.1.a
    text: sigaren 5;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35
  - number: 35.1.b
    text: |-
      sigaretten 20,56 benevens per 1000 stuks € 67,21 , met dien verstande dat het totale bedrag van de accijns per 1000
      stuks ten minste € 101,89  bedraagt;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35
  - number: 35.1.c
    text: |-
      rooktabak 14,60  benevens per kilogram € 28,13 , met dien verstande dat het totale bedrag van de accijns per
      kilogram ten minste € 40,31  bedraagt.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35
  - number: '35.2'
    text: |-
      Onder de kleinhandelsprijs van een tabaksprodukt wordt verstaan de prijs waarvoor dat produkt aan anderen dan
      wederverkopers wordt verkocht, met inbegrip van alle belastingen en de kosten van de verpakking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35
  - number: '35.3'
    text: |-
      Voor de berekening van de accijns wordt voor tabaksprodukten die worden verbruikt binnen een accijnsgoederenplaats
      voor tabaksprodukten de kleinhandelsprijs gesteld op die van gelijke dan wel soortgelijke produkten die worden
      verbruikt buiten de accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35
  - number: '35.4'
    text: |-
      Voor de berekening van de accijns wordt een sigaret aangemerkt als zoveel sigaretten als het aantal malen dat het
      tabaksrolletje zonder filter en mondstuk een lengte heeft van 9 cm. Dit aantal wordt naar boven afgerond op een
      geheel getal.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35
  - number: 35a.1
    text: |-
      Bij ministeriële regeling worden de in [artikel 35, eerste lid, onderdelen b en c][ref1], vermelde tarieven
      aangepast bij wijziging van de meest gevraagde prijsklasse van sigaretten onderscheidenlijk rooktabak.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
  - number: 35a.2
    text: |-
      Onder de meest gevraagde prijsklasse wordt verstaan de combinatie van de verpakkingseenheid waarin en de
      kleinhandelsprijs waartegen in een kalenderjaar de meeste sigaretten of grammen rooktabak worden verkocht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
  - number: 35a.3
    text: |-
      De meest gevraagde prijsklasse wordt jaarlijks bepaald aan de hand van de in een kalenderjaar aangevraagde
      accijnszegels. Hierbij wordt een verpakkingseenheid waarvan in het kalenderjaar de kleinhandelsprijs een of
      meer keren is gewijzigd, met die verschillende prijzen tezamen als één combinatie in de zin van het tweede lid
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
  - number: 35a.4
    text: |-
      Indien de meest gevraagde prijsklasse is gewijzigd treedt de in het eerste lid bedoelde ministeriële regeling
      tot aanpassing van de tarieven in werking met ingang van 1 april van het jaar volgend op het jaar waarop de
      vaststelling van de meest gevraagde prijsklasse is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
  - number: 35a.5
    text: |-
      De aanpassing van de tarieven geschiedt zodanig dat het tarief van het specifieke gedeelte van de accijns
      voor de gewijzigde meest gevraagde prijsklasse wordt gebracht op 50 percent van de som van het bedrag van
      de accijns en het bedrag van de omzetbelasting van die prijsklasse. De aanpassing van de bedragen die in
      [artikel 35, eerste lid, onderdelen b en c][ref1], zijn opgenomen als de ten minste te betalen accijns voor 1000
      stuks sigaretten respectievelijk 1 kilogram rooktabak, geschiedt zodanig dat deze accijns na de aanpassing van
      de tarieven 97 percent bedraagt van het totale bedrag van de accijns voor 1000 stuks sigaretten respectievelijk 1
      kilogram rooktabak van de meest gevraagde prijsklasse.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
  - number: 35a.6
    text: |-
      Bij de aanpassing van de tarieven voor rooktabak dient het totale bedrag van de accijns voor de gewijzigde meest
      gevraagde prijsklasse na de aanpassing gelijk te blijven aan het totale bedrag van de accijns dat zonder aanpassing
      verschuldigd zou zijn voor die prijsklasse.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
  - number: 35a.7
    text: |-
      Bij de aanpassing van de tarieven voor sigaretten dient het totale bedrag van de accijns van sigaretten van de
      meest gevraagde prijsklasse na de aanpassing ten minste 57 percent van de kleinhandelsprijs van die prijsklasse
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
  - number: 35a.8
    text: |-
      Bij de aanpassing wordt het tarief van het percentuele gedeelte van de accijns op honderdsten van een percent
      afgerond.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
  - number: 35a.9
    text: |-
      Indien krachtens dit artikel de accijns op sigaretten wordt verhoogd, wordt bij ministeriële regeling tevens
      de accijns op rooktabak verhoogd. De verhoging van de accijns op rooktabak is per pakje van de meest gevraagde
      prijsklasse gelijk aan de verhoging van de accijns voor sigaretten van de meest gevraagde prijsklasse zoals die van
      toepassing was op 31 december van het jaar voorafgaande aan de wijziging van de meest gevraagde prijsklasse.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel35a
  - number: '36.1'
    text: |-
      Bij ministeriële regeling worden de in [artikel 35, eerste lid, onderdelen ][ref1], vermelde tarieven aangepast bij
      wijziging van de kleinhandelsprijs van sigaretten onderscheidenlijk rooktabak van de meest gevraagde prijsklasse.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
  - number: '36.2'
    text: |-
      De aanpassing van de tarieven geschiedt zodanig dat het tarief van het specifieke gedeelte van de accijns wordt
      gebracht op 50 percent van de som van het bedrag van de accijns en het bedrag van de omzetbelasting van de meest
      gevraagde prijsklasse. De aanpassing van de bedragen die in [artikel 35, eerste lid, onderdelen b en c][ref1], zijn
      opgenomen als de ten minste te betalen accijns voor 1000 stuks sigaretten respectievelijk 1 kilogram rooktabak,
      geschiedt zodanig dat deze accijns na de aanpassing van de tarieven 97 percent bedraagt van het totale bedrag van
      de accijns voor 1000 stuks sigaretten respectievelijk 1 kilogram rooktabak van de meest gevraagde prijsklasse.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
  - number: '36.3'
    text: |-
      Bij de aanpassing van de tarieven voor rooktabak dient het totale bedrag van de accijns voor rooktabak van de meest
      gevraagde prijsklasse na de aanpassing gelijk te blijven aan het totale bedrag van de accijns dat zonder aanpassing
      verschuldigd zou zijn na de wijziging van de kleinhandelsprijs.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel36
  - number: '36.4'
    text: |-
      Bij de aanpassing van de tarieven voor sigaretten dient het totale bedrag van de accijns van sigaretten van de
      meest gevraagde prijsklasse na de aanpassing ten minste 57 percent van de gewijzigde kleinhandelsprijs van die
      prijsklasse te bedragen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel36
  - number: '36.5'
    text: |-
      Bij de aanpassing wordt het tarief van het percentuele gedeelte van de accijns op honderdsten van een percent
      afgerond.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel36
  - number: '37.1'
    text: 'Voor de toepassing van deze wet en de daarop gebaseerde regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel37
  - number: 37.1.a
    text: 'alcoholgehalte van een accijnsgoed: het aantal volumepercenten alcohol daarin bij een temperatuur van 20 °C;'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel37
  - number: 37.1.b
    text: |-
      alcohol: ethanol en de alcoholen die bij het vervaardigen van ethanol zijn ontstaan voor zover zij niet zijn
      afgescheiden van de ethanol.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel37
  - number: '37.2'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het alcoholgehalte.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel37
  - number: '38'
    text: |-
      Bij ministeriële regeling kan met betrekking tot bier, wijn, tussenprodukten, overige alcoholhoudende produkten
      en tabaksprodukten in kleinhandelsverpakking worden bepaald dat voor de berekening van de accijns het volume of de
      massa van die goederen dat is vermeld op die verpakking in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel38
  - number: '39'
    text: |-
      Een plaats kan alleen als accijnsgoederenplaats worden gebruikt indien daartoe een vergunning is verstrekt door
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel39
  - number: '40.1'
    text: 'Als accijnsgoederenplaats kan in aanmerking komen een plaats waar:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel40
  - number: 40.1.a
    text: accijnsgoederen worden vervaardigd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel40
  - number: 40.1.b
    text: |-
      geen accijnsgoederen worden vervaardigd maar die dient voor de opslag van accijnsgoederen, indien de hoeveelheid
      accijnsgoederen die gemiddeld over een jaar voorhanden is meer bedraagt dan een bij ministeriële regeling per soort
      accijnsgoed vast te stellen hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel40
  - number: '40.2'
    text: |-
      Een plaats van waaruit accijnsgoederen worden geleverd aan een verbruiker kan niet in aanmerking komen als
      accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel40
  - number: '40.3'
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen kunnen plaatsen in afwijking van het bepaalde in het eerste en
      in het tweede lid in aanmerking komen als accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel40
  - number: '41.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan met
      betrekking tot een accijnsgoederenplaats moet worden voldaan ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel41
  - number: 41.1.a
    text: de administratie en de administratieve organisatie;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel41
  - number: 41.1.b
    text: de locatie en de inrichting; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel41
  - number: 41.1.c
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel41
  - number: '41.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel41
  - number: '42.1'
    text: 'In het verzoek om een vergunning voor een accijnsgoederenplaats worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42
  - number: 42.1.a
    text: de soort of de soorten accijnsgoederen waarvoor de accijnsgoederenplaats is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42
  - number: 42.1.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting in de accijnsgoederenplaats per
      jaar zal worden vervaardigd dan wel gemiddeld over een jaar zonder verschuldigdheid van accijns voorhanden zal
      zijn;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42
  - number: 42.1.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42
  - number: 42.1.d
    text: |-
      de administratie en de administratieve organisatie met betrekking tot de als accijnsgoederenplaats aan te merken
      plaats; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42
  - number: 42.1.e
    text: de locatie en de inrichting van de als accijnsgoederenplaats aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42
  - number: '42.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die het verzoek moet
      bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42
  - number: 42a
    text: |-
      In afwijking van [artikel 40, eerste lid][ref1], kan, indien degene die een vergunning voor een
      accijnsgoederenplaats wil verkrijgen niet beschikt over een plaats waar accijnsgoederen worden vervaardigd dan
      wel opgeslagen, een verzoek om een vergunning voor een accijnsgoederenplaats door de inspecteur worden toegewezen,
      indien deze persoon in Nederland is gevestigd en in de uitoefening van zijn bedrijf optreedt als:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
        hoofdstuk: III
        afdeling: '1'
  - number: 42a.a
    text: handelaar in minerale oliën, maar de door hem gekochte minerale oliën niet zelf in opslag neemt;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42a
  - number: 42a.b
    text: |-
      tussenpersoon ten behoeve van vergunninghouders van een accijnsgoederenplaats voor minerale oliën waar minerale
      oliën worden vervaardigd dan wel opgeslagen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel42a
  - number: '43.1'
    text: |-
      Een verzoek om een vergunning voor een accijnsgoederenplaats wordt door de inspecteur toegewezen tenzij hij
      gegronde redenen heeft om aan te nemen dat niet zal worden voldaan aan het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel43
  - number: '43.2'
    text: |-
      Een verzoek om een vergunning voor een accijnsgoederenplaats kan worden geweigerd aan degene die in de vijf aan het
      verzoek voorafgaande jaren onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake
      de accijns.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel43
  - number: '44.1'
    text: |-
      De vergunning vermeldt voor welke soort of voor welke soorten accijnsgoederen de accijnsgoederenplaats als zodanig
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel44
  - number: '44.2'
    text: |-
      In de vergunning bepaalt de inspecteur zo nodig nader op welke wijze aan de bij of krachtens deze wet gestelde
      voorwaarden moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel44
  - number: '44.3'
    text: |-
      De inspecteur kan in de vergunning nadere voorwaarden opnemen ter verzekering van een juiste toepassing van het
      bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel44
  - number: '45.1'
    text: De inspecteur kan de in de vergunning opgenomen voorwaarden aanpassen ter verzekering van de heffing.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel45
  - number: '45.2'
    text: |-
      Alvorens over te gaan tot aanpassing van de voorwaarden deelt de inspecteur de vergunninghouder mee welke
      omstandigheden naar zijn oordeel de door hem aan te geven aanpassing van de voorwaarden rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel45
  - number: '46'
    text: |-
      De vergunninghouder die een aanpassing van de in de vergunning opgenomen voorwaarden wenst, dient daartoe een
      verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel46
  - number: '47'
    text: |-
      Degene die een accijnsgoederenplaats wil overnemen, dient gezamenlijk met de vergunninghouder een verzoek in bij
      de inspecteur tot een zodanige aanpassing van de vergunning voor die accijnsgoederenplaats dat hij voor alle uit de
      vergunning voortvloeiende rechten en verplichtingen in de plaats treedt van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel47
  - number: '48'
    text: 'De vergunning voor een accijnsgoederenplaats kan door de inspecteur worden ingetrokken ingeval:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel48
  - number: 48.a
    text: niet wordt voldaan aan de in de vergunning opgenomen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel48
  - number: 48.b
    text: geen of niet voldoende zekerheid is gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel48
  - number: 48.c
    text: misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel48
  - number: 48.d
    text: |-
      de vergunninghouder onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake de
      accijns;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel48
  - number: 48.e
    text: |-
      de vergunninghouder in staat van faillissement verkeert of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel48
  - number: 48.f
    text: de vergunninghouder daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel48
  - number: '49.1'
    text: |-
      Het intrekken van een vergunning ingevolge [artikel 48, onderdeel ][ref1], kan niet eerder geschieden dan één maand
      nadat de inspecteur de vergunninghouder schriftelijk in kennis heeft gesteld van de omstandigheden die naar zijn
      oordeel het intrekken rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel48
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
  - number: '49.2'
    text: |-
      Het intrekken van een vergunning ingevolge [artikel 48, onderdeel ][ref1], kan onmiddellijk geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel48
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
  - number: '50.1'
    text: |-
      Het verlenen, het aanpassen en het intrekken van een vergunning voor een accijnsgoederenplaats alsmede het afwijzen
      van een verzoek daartoe geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50
  - number: '50.2'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het derde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het tweede lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50
  - number: 50a.1
    text: |-
      Een onderneming wordt alleen als geregistreerd bedrijf of als niet-geregistreerd bedrijf aangemerkt indien daartoe
      een vergunning is verstrekt door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50a
  - number: 50a.2
    text: |-
      Een vergunning als geregistreerd bedrijf of als niet-geregistreerd bedrijf wordt met betrekking tot tabaksprodukten
      uitsluitend verleend, indien deze produkten in een andere lid-staat van Nederlandse accijnszegels zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50a
  - number: 50a.3
    text: Een vergunning als niet-geregistreerd bedrijf wordt verleend voor één nauwkeurig omschreven partij accijnsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50a
  - number: 50b.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan een
      geregistreerd bedrijf of een niet-geregistreerd bedrijf moet voldoen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50b
  - number: 50b.1.a
    text: de administratie; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50b
  - number: 50b.1.b
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50b
  - number: 50b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50b
  - number: 50c.1
    text: |-
      Degene die een vergunning voor een geregistreerd bedrijf of voor een niet-geregistreerd bedrijf wil verkrijgen,
      dient daartoe een verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50c.2
    text: 'In het verzoek worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50c.2.a
    text: de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50c.2.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door het geregistreerde bedrijf of
      door het niet-geregistreerde bedrijf per jaar uit een andere lid-staat zal worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50c.2.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50c.2.d
    text: de administratie van de desbetreffende accijnsgoederen; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50c.2.e
    text: de locatie van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50c.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die het verzoek moet
      bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50c
  - number: 50d.1
    text: |-
      Indien de vergunninghouder van een belastingentrepot een fiscaal vertegenwoordiger in Nederland aanwijst die met
      betrekking tot het overbrengen van accijnsgoederen naar een geregistreerd bedrijf of een niet-geregistreerd bedrijf
      zekerheid zal stellen, de accijns zal voldoen en de administratie voert van die overbrengingen, dient deze fiscaal
      vertegenwoordiger in het bezit te zijn van een daartoe strekkende vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50d
  - number: 50d.2
    text: |-
      De[ artikelen 50][ref1] en [50][ref2] zijn van overeenkomstige toepassing met betrekking tot de fiscaal
      vertegenwoordiger van de vergunninghouder van een belastingentrepot, met dien verstande dat bij het verzoek
      om een vergunning een verklaring van de vergunninghouder van het belastingentrepot dient te worden overgelegd
      waaruit blijkt dat degene die het verzoek indient door hem is gemachtigd namens hem op te treden als fiscaal
      vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50b
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel50c
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel50d
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50b
        hoofdstuk: III
        afdeling: 2a
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 50c
        hoofdstuk: III
        afdeling: 2a
  - number: 50e
    text: |-
      De[ artikelen 43][ref1], [44][ref2], [45][ref3], [46][ref4], [48][ref5], [49][ref6] en [50][ref7] zijn van
      overeenkomstige toepassing met betrekking tot de in de[ artikelen 50][ref8] en [50][ref9] bedoelde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0005251#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0005251#Artikel50
      [ref8]: https://wetten.overheid.nl/BWBR0005251#Artikel50a
      [ref9]: https://wetten.overheid.nl/BWBR0005251#Artikel50d
