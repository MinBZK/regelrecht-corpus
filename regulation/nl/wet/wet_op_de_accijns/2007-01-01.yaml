        hoofdstuk: VII
        afdeling: '1'
  - number: '99.2'
    text: |-
      Degene die het in [artikel 90, eerste lid][ref1], opgenomen verbod overtreedt terwijl hij weet of redelijkerwijs
      kan weten dat het distilleertoestel bestemd is of zal worden bestemd om te worden gebruikt tot ontduiking van de
      accijns, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90
