  - number: '51.1'
    text: De accijns wordt geheven van de vergunninghouder van de accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51
  - number: '51.2'
    text: |-
      In afwijking in zoverre van het eerste lid wordt, in bij algemene maatregel van bestuur aan te wijzen
      gevallen en onder daarbij te stellen voorwaarden, de accijns van accijnsgoederen die zijn uitgeslagen uit een
      accijnsgoederenplaats in opdracht van een vergunninghouder van een andere accijnsgoederenplaats voor dezelfde soort
      accijnsgoederen, geheven van de vergunninghouder van die andere accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51
  - number: 51a
    text: |-
      In afwijking van [artikel 51][ref1] wordt de accijns geheven van:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel51
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '51'
        hoofdstuk: III
        afdeling: '3'
  - number: 51a.a
    text: |-
      bij toepassing van [artikel 2a][ref1]: de vergunninghouder van het geregistreerde bedrijf of van het niet-
      geregistreerde bedrijf dat een accijnsgoed ontvangt dan wel de fiscaal vertegenwoordiger van de vergunninghouder
      van een belastingentrepot van waaruit het accijnsgoed is overgebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: 51a.b
    text: |-
      bij toepassing van [artikel 2b][ref1]: de ondernemer die dan wel het publiekrechtelijke lichaam dat het accijnsgoed
      voorhanden heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2b
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2b
        hoofdstuk: I
        afdeling: '1'
  - number: 51a.c
    text: |-
      bij toepassing van [artikel 2c, tweede lid][ref1]: de natuurlijke persoon die het accijnsgoed voorhanden heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2c
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2c
        hoofdstuk: I
        afdeling: '1'
  - number: 51a.d
    text: |-
      bij toepassing van [artikel 2d][ref1]: degene voor wiens rekening de minerale oliën worden vervoerd dan wel degene
      die de minerale oliën verkrijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
        hoofdstuk: I
        afdeling: '1'
  - number: 51a.e
    text: |-
      bij toepassing van [artikel 2e][ref1]: de door de verkoper aangewezen fiscaal vertegenwoordiger;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
        hoofdstuk: I
        afdeling: '1'
  - number: 51a.f
    text: |-
      bij toepassing van [artikel 2f][ref1]: degene die het accijnsgoed vervaardigt dan wel degene die het accijnsgoed
      voorhanden heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2f
        hoofdstuk: I
        afdeling: '1'
  - number: 51a.g
    text: |-
      bij toepassing van [artikel 2h][ref1]: de natuurlijke persoon of de rechtspersoon, bedoeld in
      [artikel 86a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2h
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel86a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2h
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 86a
        hoofdstuk: VI
        afdeling: '3'
  - number: '52'
    text: De accijns wordt verschuldigd op het tijdstip van de uitslag.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel52
  - number: 52a
    text: |-
      In afwijking van [artikel 52][ref1] wordt de accijns verschuldigd op het tijdstip van:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '52'
        hoofdstuk: III
        afdeling: '3'
  - number: 52a.a
    text: |-
      bij toepassing van [artikel 2a][ref1]: de ontvangst van de accijnsgoederen;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: 52a.b
    text: |-
      bij toepassing van [artikel 2b][ref1] of [2][ref2]: de aanvang van het voorhanden hebben van het accijnsgoed in
      Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2c
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2b
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2c
        hoofdstuk: I
        afdeling: '1'
  - number: 52a.c
    text: |-
      bij toepassing van [artikel 2d][ref1]: de aanvang van het voorhanden hebben van het accijnsgoed in Nederland dan
      wel van de verkrijging van die goederen;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
        hoofdstuk: I
        afdeling: '1'
  - number: 52a.d
    text: |-
      bij toepassing van [artikel 2f][ref1]: de vervaardiging dan wel de aanvang van het voorhanden hebben van het
      accijnsgoed in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2f
        hoofdstuk: I
        afdeling: '1'
  - number: 52a.e
    text: |-
      bij toepassing van [artikel 2h][ref1]: de vaststelling van de in artikel [86a, eerste lid][ref2], bedoelde
      onregelmatigheid of overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2h
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel86a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2h
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 86a
        hoofdstuk: VI
        afdeling: '3'
  - number: '53.1'
    text: De in een tijdvak verschuldigd geworden accijns moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel53
  - number: '53.2'
    text: Aangifte dient te worden gedaan voor elke accijnsgoederenplaats afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel53
  - number: '53.3'
    text: |-
      In afwijking van het tweede lid kan bij ministeriële regeling, onder daarbij te stellen voorwaarden, worden
      toegestaan dat voor accijnsgoederenplaatsen waarvan de vergunningen op naam zijn gesteld van dezelfde
      vergunninghouder één aangifte voor die plaatsen te zamen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel53
  - number: 53a.1
    text: |-
      Bij toepassing van [artikel 52a][ref1] dient in afwijking van [artikel 53, eerste lid][ref2], en van
      [artikel 10, tweede lid][ref3], en [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref4]
      uiterlijk op de dag na het in [artikel 52a][ref5] bedoelde tijdstip aangifte te worden gedaan en de accijns op
      aangifte te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel52a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 52a
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '53'
        hoofdstuk: III
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: 52a
        hoofdstuk: III
        afdeling: '3'
  - number: 53a.2
    text: |-
      In afwijking in zoverre van het eerste lid doet de vergunninghouder van een geregistreerd bedrijf aangifte van de
      in een week op de voet van [artikel 52a, onderdeel a][ref1], verschuldigd geworden accijns uiterlijk op de vrijdag
      van de week daaropvolgend. De verschuldigd geworden accijns wordt op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 52a
        hoofdstuk: III
        afdeling: '3'
  - number: 53a.3
    text: |-
      In afwijking in zoverre van het eerste lid dient bij toepassing van [artikel 52a, onderdeel e][ref1], binnen één
      maand na het in [artikel 52a, onderdeel e][ref2], bedoelde tijdstip, aangifte te worden gedaan en de accijns op
      aangifte te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel52a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 52a
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 52a
        hoofdstuk: III
        afdeling: '3'
  - number: '54.1'
    text: |-
      Bij intrekking van een vergunning voor een accijnsgoederenplaats worden de accijnsgoederen waarvoor die
      accijnsgoederenplaats als zodanig is aangewezen, die binnen die plaats voorhanden zijn op de dag met ingang waarvan
      de vergunning wordt ingetrokken, aangemerkt als te zijn uitgeslagen en wordt het tijdvak waarover de accijns
      verschuldigd is, aangemerkt als te zijn geëindigd op die dag.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel54
  - number: '54.2'
    text: |-
      De inspecteur kan bepalen dat de termijn waarbinnen de accijns dient te worden voldaan over het tijdvak waartoe de
      in het eerste lid bedoelde dag behoort alsmede over het daaraan onmiddellijk voorafgaande tijdvak in afwijking van
      [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] minder bedraagt dan één maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '55'
    text: De accijns wordt berekend naar het tarief dat geldt op het tijdstip van de uitslag.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel55
  - number: '56.1'
    text: |-
      De vergunninghouder van een accijnsgoederenplaats stelt zekerheid voor de accijns die hij verschuldigd is of kan
      worden in Nederland dan wel in een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
  - number: '56.2'
    text: |-
      De vergunninghouder van een geregistreerd bedrijf, van een niet-geregistreerd bedrijf, de fiscaal vertegenwoordiger
      als bedoeld in [artikel 50][ref1] alsmede de fiscaal vertegenwoordiger als bedoeld in [artikel 50][ref2] stellen
      zekerheid voor de accijns die door hen verschuldigd is of kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50d
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50d
        hoofdstuk: III
        afdeling: 2a
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 50f
        hoofdstuk: III
        afdeling: 2b
  - number: '56.3'
    text: |-
      In afwijking van het eerste lid kan de inspecteur, onder bij algemene maatregel van bestuur te stellen voorwaarden
      en beperkingen, toestaan dat de vervoerder of de eigenaar van de accijnsgoederen zekerheid stelt in plaats van
      de in het eerste lid bedoelde vergunninghouder voor het bedrag aan accijns dat wordt vertegenwoordigd door de
      hoeveelheid accijnsgoederen die door hem of namens hem wordt vervoerd vanuit een accijnsgoederenplaats naar
      een andere accijnsgoederenplaats, naar een belastingentrepot, naar een geregistreerd bedrijf of naar een niet-
      geregistreerd bedrijf in een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
  - number: '56.4'
    text: |-
      Het stellen van zekerheid als bedoeld in het eerste lid kan op verzoek achterwege blijven voor minerale oliën die
      vanuit een accijnsgoederenplaats over zee of door middel van een pijpleiding worden overgebracht naar een andere
      lid-staat. De inspecteur besluit op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
  - number: '56.5'
    text: |-
      Het bedrag van de zekerheid wordt vastgesteld door de inspecteur. De vaststelling geschiedt tot een zodanig bedrag
      dat de te verhalen accijns voldoende verzekerd kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
  - number: '56.6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor het bepalen van de hoogte van het bedrag van
      de zekerheid.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
  - number: '56.7'
    text: |-
      In de vergunning bepaalt de inspecteur zo nodig nader op welke wijze aan de bij of krachtens deze wet gestelde
      voorwaarden moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
  - number: '56.8'
    text: |-
      De inspecteur kan in de vergunning nadere voorwaarden opnemen ter verzekering van een juiste toepassing van het
      bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel56
  - number: '57.1'
    text: Het bedrag van de zekerheid kan door de inspecteur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel57
  - number: '57.2'
    text: De vergunninghouder kan een verzoek tot verlaging van het bedrag van de zekerheid indienen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel57
  - number: '57.3'
    text: |-
      Bij verhoging van het bedrag van de zekerheid draagt de vergunninghouder zorg dat binnen een maand na de
      bekendmaking ervan de zekerheid is aangevuld.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel57
  - number: '58.1'
    text: |-
      Het vaststellen en het wijzigen van het bedrag van de zekerheid alsmede het afwijzen van een verzoek als bedoeld in
      [artikel 57, tweede lid][ref1], geschieden bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel57
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '57'
        hoofdstuk: III
        afdeling: '4'
  - number: '58.2'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het derde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel58
  - number: '58.3'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het tweede lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel58
  - number: '59.1'
    text: De zekerheid wordt gesteld bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel59
  - number: '59.2'
    text: De ontvanger beslist of de vorm van de zekerheid die de vergunninghouder aanbiedt, wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel59
  - number: '60.1'
    text: |-
      De aan het stellen, het wijzigen en het opheffen van de zekerheid verbonden kosten komen ten laste van de
      vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel60
  - number: '60.2'
    text: |-
      Ingeval de zekerheid wordt gesteld in geld wordt daarover een rente vergoed die gelijk is aan de
      herfinancieringsrente, te weten de minimale biedrente die de Europese Centrale Bank hanteert voor
      basisherfinancieringstransacties.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel60
  - number: '60.3'
    text: |-
      Voor de toepassing van het tweede lid wordt het over een kalendermaand te vergoeden rentebedrag berekend naar de
      rente die geldt bij de aanvang van die maand.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel60
  - number: '61.1'
    text: |-
      De vergunninghouder van een accijnsgoederenplaats heeft voor de accijns die is begrepen in de verkoopprijs van de
      door hem geleverde accijnsgoederen, zolang hij ter zake geen betaling heeft ontvangen doch niet langer dan een half
      jaar nadat hij die accijns verschuldigd is geworden, voorrecht op alle goederen van de koper.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel61
  - number: '61.2'
    text: |-
      Het voorrecht als bedoeld in het eerste lid heeft gelijke rangorde als het voorrecht dat ’s Rijks schatkist heeft
      op de voet van [artikel 21 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: 61a.1
    text: |-
      De vervoerder van accijnsgoederen is hoofdelijk aansprakelijk voor het bedrag aan accijns dat wordt
      vertegenwoordigd door de hoeveelheid accijnsgoederen die door hem wordt vervoerd vanuit een accijnsgoederenplaats
      naar een andere accijnsgoederenplaats, naar een belastingentrepot, naar een geregistreerd bedrijf of naar een
      niet-geregistreerd bedrijf in een andere lid-staat indien tijdens dat vervoer door hem of door zijn toedoen een
      onregelmatigheid of een overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel61a
  - number: 61a.2
    text: |-
      De vervoerder of eigenaar van accijnsgoederen die op grond van [artikel 56, derde lid][ref1], zekerheid heeft
      gesteld in plaats van de vergunninghouder van een accijnsgoederenplaats is hoofdelijk aansprakelijk voor het in
      [artikel 56, derde lid][ref2], bedoelde bedrag aan accijns.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
  - number: '62'
    text: |-
      Ter zake van de accijns bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de Douanewet][ref1], met uitzondering van artikel 868 van de
      toepassingsverordening Communautair douanewetboek, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '2'
  - number: '63.1'
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden, regels worden gesteld ingevolge welke de
      heffing van accijns van accijnsgoederen die in kleine zendingen dan wel door reizigers als bagage worden ingevoerd,
      geschiedt volgens daarbij vast te stellen forfaitaire tarieven.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel63
  - number: '63.2'
    text: De forfaitaire tarieven zijn niet van toepassing met betrekking tot handelsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel63
  - number: '64.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag en de invoer van:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.1.a
    text: |-
      bier, wijn, tussenprodukten en overige alcoholhoudende produkten die rechtstreeks of als bestanddeel van een
      halffabrikaat worden aangewend voor de vervaardiging van levensmiddelen, gevuld of anderszins, waarvan het
      alcoholgehalte niet meer bedraagt dan 8,5 L absolute alcohol per 100 kg produkt voor chocola, en 5 L absolute
      alcohol per 100 kg produkt voor andere produkten;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.1.b
    text: overige alcoholhoudende produkten die kennelijk niet zijn bestemd voor inwendig gebruik door de mens;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.1.c
    text: |-
      overige alcoholhoudende producten die worden gebruikt voor de vervaardiging van geneesmiddelen als omschreven in
      de [Richtlijn 2001/82/EG](32001L0082) van het Europees Parlement en de Raad van 6 november 2001 tot vaststelling
      van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311) en de [Richtlijn
      2001/83/EG](32001L0083) van het Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een
      communautair wetboek betreffende geneesmiddelen voor menselijk gebruik (PbEG L 311);
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.1.d
    text: |-
      minerale oliën die kennelijk niet zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.1.e
    text: |-
      minerale oliën die in hoogovens met het oog op chemische reductie worden ingespoten als toevoeging aan de
      steenkool, die wordt gebruikt als voornaamste brandstof;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.1.f
    text: |-
      sigaretten en rooktabak die geheel uit andere stoffen dan tabak bestaan en die kennelijk zijn bestemd om te worden
      gebruikt voor medicinale doeleinden.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: '64.2'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.2.a
    text: de aard van en de aanduiding op de verpakking van in het eerste lid bedoelde accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.2.b
    text: de stoffen waarmee in het eerste lid bedoelde accijnsgoederen moeten zijn vermengd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: 64.2.c
    text: de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel64
  - number: '65.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag en de invoer van accijnsgoederen:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: 65.1.a
    text: |-
      waarvan de in [artikel 64][ref1] voor de desbetreffende accijnsgoederen aangegeven bestemming niet of niet
      voldoende blijkt uit de goederen als zodanig, indien degene die de goederen betrekt deze gebruikt voor het
      vervaardigen van accijnsgoederen als bedoeld in [artikel 64][ref2] dan wel deze gebruikt overeenkomstig de in dat
      artikel voor het desbetreffende accijnsgoed bedoelde bestemming;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel64
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '64'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '64'
        hoofdstuk: V
        afdeling: '1'
  - number: 65.1.b
    text: |-
      die door degene die de goederen betrekt, worden gebruikt als grondstof voor het vervaardigen van niet-
      accijnsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: '65.2'
    text: |-
      Voor de toepassing van dit artikel worden onder niet-accijnsgoederen mede verstaan minerale oliën als bedoeld in
      [artikel 5, derde lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '5'
        hoofdstuk: I
        afdeling: '2'
  - number: '65.3'
    text: |-
      Om de accijnsgoederen met vrijstelling te kunnen betrekken dient degene die deze goederen betrekt in het bezit te
      zijn van een daartoe strekkende vergunning.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: '65.4'
    text: De vergunning wordt op verzoek verleend door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: '65.5'
    text: |-
      Het verlenen, het aanpassen en het intrekken van een vergunning alsmede het afwijzen van een verzoek daartoe
      geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: '65.6'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het zevende lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: '65.7'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het zesde lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: '65.8'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel65
  - number: '66.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag en de invoer van minerale oliën die worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66
  - number: 66.1.a
    text: voor de aandrijving van schepen of als scheepsbehoeften aan boord van schepen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66
  - number: 66.1.b
    text: voor de voortstuwing van luchtvaartuigen voor zover het betreft halfzware olie als bedoeld in GN-code 2710 19 21.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66
  - number: '66.2'
    text: |-
      De vrijstelling als bedoeld in het eerste lid, onderdelen *a* en *b*, is niet van toepassing met betrekking tot
      minerale oliën die worden gebruikt voor pleziervaartuigen of plezierluchtvaartuigen dan wel worden gebruikt aan
      boord van schepen die kennelijk niet worden gebruikt om te varen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66
  - number: '66.3'
    text: |-
      De vrijstelling als bedoeld in het eerste lid, onderdeel b, is niet van toepassing met betrekking tot minerale olie
      die in Nederland in de brandstoftanks van het luchtvaartuig, niet zijnde een militair luchtvaartuig, is afgeleverd
      en die wordt gebruikt voor de voortstuwing van dat luchtvaartuig gedurende een binnenlandse vlucht. Onder
      binnenlandse vlucht wordt verstaan een vlucht die begint en eindigt binnen Nederland zonder dat een luchthaven
      buiten Nederland wordt aangedaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66
  - number: '66.4'
    text: |-
      Voor de toepassing van deze wet en de daarop gebaseerde regelingen wordt verstaan onder een plezierluchtvaartuig:
      een luchtvaartuig dat wordt gebruikt door de eigenaar daarvan of door de natuurlijke of rechtspersoon die het
      gebruik daarvan geniet door huur of anderszins, voor andere dan commerciële doeleinden en met name voor andere
      doeleinden dan voor het vervoer van personen of goederen of voor het verrichten van diensten onder bezwarende
      titel, dan wel ten behoeve van overheidsinstanties.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66
  - number: '66.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66
  - number: 66a.1
    text: |-
      Onverminderd het bepaalde in [artikel 66, eerste en tweede lid][ref1], wordt onder bij algemene maatregel van
      bestuur te stellen voorwaarden en beperkingen vrijstelling van accijns verleend ter zake van de uitslag en de
      invoer van accijnsgoederen die worden gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
  - number: 66a.1.a
    text: aan boord van schepen in het verkeer van Nederland naar een andere lid-staat, anders dan over de binnenwateren;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66a
  - number: 66a.1.b
    text: aan boord van luchtvaartuigen in het verkeer van Nederland naar een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66a
  - number: 66a.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel66a
  - number: '68.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van
      accijns verleend ter zake van de uitslag en de invoer van accijnsgoederen die worden gebruikt voor onderzoek,
      kwaliteitscontroles en smaaktesten buiten een accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel68
  - number: '68.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel68
  - number: '69'
    text: |-
      Bij ministeriële regeling wordt, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van accijns
      verleend ter zake van de uitslag en de invoer van accijnsgoederen in gevallen waarin aanspraak op vrijstelling
      bestaat ingevolge het Koninkrijk verbindende verdragen en in al hun onderdelen verbindende besluiten van bij
      zodanige verdragen opgerichte volkenrechtelijke organisaties, alsmede in daarmee overeenkomende gevallen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel69
  - number: 69a.1
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt teruggaaf van accijns
      verleend voor minerale oliën die worden gebruikt voor de opwekking van elektriciteit in een installatie met een
      vermogen van minimaal 1 MW, voorzover de opgewekte elektriciteit wordt ingevoed op een Nederlands net dan wel,
      indien geen invoeding op een Nederlands net plaatsvindt, voorzover de opgewekte elektriciteit overeenkomstig
      [artikel 36c, vierde lid, van de Wet belastingen op milieugrondslag][ref1] in de heffing van energiebelasting wordt
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel36c
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 36c
  - number: 69a.2
    text: |-
      Voor de toepassing van dit artikel wordt onder net verstaan een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 69a.3
    text: Bij ministeriële regeling worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel69a
  - number: '70.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      accijns verleend:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
  - number: 70.1.a
    text: |-
      voor accijnsgoederen in gevallen waarin deze accijnsgoederen op de voet van [artikel 65][ref1] zouden kunnen worden
      betrokken met vrijstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
        hoofdstuk: V
        afdeling: '1'
  - number: 70.1.b
    text: |-
      ter zake van de levering van minerale oliën waarvoor op de voet van [artikel 66][ref1] aanspraak op een
      vrijstelling zou bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
  - number: 70.1.c
    text: |-
      ter zake van accijnsgoederen waarvoor op de voet van [artikel 66a][ref1] aanspraak op vrijstelling zou bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 66a
        hoofdstuk: V
        afdeling: '1'
  - number: 70.1.d
    text: |-
      voor halfzware olie en gasolie die is belast naar het tarief als bedoeld in
      [artikel 27, eerste lid, onderdeel b][ref1], indien de olie voor andere doeleinden is gebruikt dan voor het
      aandrijven van motorrijtuigen op de weg of van pleziervaartuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 70.1.e
    text: |-
      ter zake van de levering van vloeibaar gemaakt petroleumgas dat is belast naar het tarief bedoeld in
      [artikel 27, eerste lid, onderdeel d][ref1], en dat wordt bestemd om te worden gebruikt voor andere doeleinden dan
      het aandrijven van motorrijtuigen op de weg of van pleziervaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '70.2'
    text: |-
      De teruggaaf als bedoeld in het eerste lid, onderdeel a, wordt verleend aan degene die een vergunning heeft
      ingevolge [artikel 65, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
        hoofdstuk: V
        afdeling: '1'
  - number: '70.3'
    text: |-
      De teruggaaf als bedoeld in het eerste lid, onderdelen b en c, wordt verleend aan degene die de levering heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
  - number: '70.4'
    text: |-
      De teruggaaf als bedoeld in het eerste lid, onderdeel d, wordt verleend aan degene die de halfzware olie of gasolie
      heeft gebruikt. De teruggaaf bedraagt per 1 000 L bij een temperatuur van 15 °C het verschil tussen het bedrag,
      vermeld in [artikel 27, eerste lid, onderdeel b][ref1], en het bedrag, vermeld in [artikel 27, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '70.5'
    text: |-
      De teruggaaf bedoeld in het eerste lid, onderdeel e, wordt verleend aan degene die de levering heeft verricht aan
      de gebruiker. De teruggaaf bedraagt per 1000 kg het bedrag vermeld in [artikel 27, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '70.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel70
  - number: '71.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      accijns verleend voor accijnsgoederen die:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: 71.1.a
    text: zijn verloren gegaan;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: 71.1.b
    text: zijn vernietigd onder ambtelijk toezicht;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: 71.1.c
    text: |-
      zijn gebracht naar een derde land of zijn geplaatst onder een communautaire douaneregeling met als bestemming een
      derde land;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: 71.1.d
    text: zijn gebracht binnen een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: 71.1.e
    text: |-
      door een ondernemer zijn overgebracht naar een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als
      ondernemer, in een andere lid-staat en waarvoor de in die lid-staat verschuldigde accijns is voldaan overeenkomstig
      de wettelijke bepalingen van die lid-staat;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: 71.1.f
    text: |-
      zijn geleverd aan natuurlijke personen of rechtspersonen in een andere lid-staat die niet de hoedanigheid hebben
      van vergunninghouder van een belastingentrepot, van een geregistreerd bedrijf of van een niet-geregistreerd bedrijf
      en direct of indirect voor rekening van een in Nederland gevestigde verkoper worden verzonden of vervoerd, en
      waarvoor de in de lid-staat van bestemming verschuldigde accijns is voldaan overeenkomstig de wettelijke bepalingen
      van die lid-staat.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: '71.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71
  - number: 71b.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor vloeibaar gemaakt petroleumgas dat is belast naar het
      tarief, bedoeld in [artikel 27, eerste lid, onderdeel d][ref1], indien dat petroleumgas is afgeleverd in
      de brandstoftanks van en is gebruikt voor het aandrijven op de weg van een autobus die hoofdzakelijk wordt
      gebruikt voor het openbaar vervoer, bedoeld in [artikel 1, onderdeel h, van de Wet personenvervoer 2000][ref2].
      Onder een autobus wordt in dit artikel en de daarop berustende bepalingen verstaan een autobus als bedoeld in
      [artikel 2, onderdeel e, van de Wet op de motorrijtuigenbelasting 1994][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '2'
  - number: 71b.2
    text: De teruggaaf bedraagt € 46,78 per 1000 kg.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71b
  - number: 71b.3
    text: |-
      De teruggaaf wordt verleend aan de vervoerder, bedoeld in
      [artikel 1, onderdeel k, van de Wet personenvervoer 2000][ref1] aan wie vergunning als bedoeld in
      [artikel 4, eerste lid][ref2], of [112 van de Wet personenvervoer 2000][ref3] is verleend en op
      wiens naam het voor de autobus opgegeven kenteken is gesteld in het kentekenregister, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref4], op het tijdstip waarop het vloeibaar
      gemaakt petroleumgas is afgeleverd in de brandstoftank van de autobus.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel112
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '112'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 71b.4
    text: Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71b
  - number: 71c.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor vloeibaar gemaakt petroleumgas dat is belast naar het tarief,
      bedoeld in [artikel 27, eerste lid, onderdeel d][ref1], indien dat petroleumgas is afgeleverd in de brandstoftanks
      van en is gebruikt voor het aandrijven op de weg van motorrijtuigen die zijn ingericht en uitsluitend worden
      gebruikt als vuilniswagen, kolkenzuiger of straatveegwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 71c.2
    text: De teruggaaf bedraagt € 46,78 per 1 000 kg.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71c
  - number: 71c.3
    text: |-
      De teruggaaf wordt verleend aan degene op wiens naam het voor de vuilniswagen, kolkenzuiger
      of straatveegwagen opgegeven kenteken is gesteld in het kentekenregister, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1], op het tijdstip waarop het vloeibaar
      gemaakt petroleumgas is afgeleverd in de brandstoftank van de in het eerste lid bedoelde motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 71c.4
    text: Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71c
  - number: 71d.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor andere minerale oliën dan halfzware olie als bedoeld in GN-
      code 2710 19 21, indien die olie is afgeleverd in de brandstoftanks van en is gebruikt voor de voortstuwing van
      luchtvaartuigen, andere dan plezierluchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71d
  - number: 71d.2
    text: |-
      In afwijking van het eerste lid wordt geen teruggaaf verleend voor minerale oliën die in Nederland in de
      brandstoftanks van luchtvaartuigen, niet zijnde militaire luchtvaartuigen, zijn afgeleverd en die worden gebruikt
      voor de voortstuwing van die luchtvaartuigen gedurende een binnenlandse vlucht. Onder binnenlandse vlucht wordt
      verstaan een vlucht die begint en eindigt binnen Nederland zonder dat een luchthaven buiten Nederland wordt
      aangedaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71d
  - number: 71d.3
    text: |-
      De teruggaaf wordt verleend aan degene op wiens naam het luchtvaartuig is geregistreerd in het register voor
      burgerluchtvaartuigen, bedoeld in [artikel 3.3, eerste lid, van de Wet luchtvaart][ref1]. Ingeval teruggaaf wordt
      verzocht voor een in het buitenland geregistreerd luchtvaartuig, wordt deze verleend aan de eigenaar van dit
      luchtvaartuig dan wel aan degene die daartoe door deze is gemachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 71d.4
    text: |-
      Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf
      en kan in bij die regeling aangewezen gevallen een ander dan de in het tweede lid bedoelde persoon worden
      aangewezen als degene aan wie de teruggaaf wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel71d
  - number: '72'
    text: De inspecteur beslist op een verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel72
  - number: '73.1'
    text: |-
      Tabaksprodukten moeten bij de uitslag en de invoer zijn voorzien van het voor het desbetreffende tabaksprodukt
      voorgeschreven accijnszegel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel73
  - number: '73.2'
    text: |-
      Tabaksprodukten die zijn bestemd voor het verbruik als bedoeld in [artikel 2, tweede lid][ref1], mogen niet zijn
      voorzien van een accijnszegel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '73.3'
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden, gevallen worden aangewezen waarin het
      eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel73
  - number: '74'
    text: |-
      Een vergunning voor een accijnsgoederenplaats voor tabaksprodukten kan, onverminderd het bepaalde in
      de[ artikelen 40, eerste en tweede lid][ref1], en [41][ref2], uitsluitend worden verkregen door degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel41
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '41'
        hoofdstuk: III
        afdeling: '1'
  - number: 74.a
    text: tabaksprodukten vervaardigt;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel74
  - number: 74.b
    text: buiten Nederland vervaardigde tabaksprodukten in Nederland van accijnszegels voorziet;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel74
  - number: 74.c
    text: |-
      buiten Nederland vervaardigde tabaksprodukten opslaat die buiten Nederland zijn voorzien van door hem aangevraagde
      Nederlandse accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel74
  - number: 74.d
    text: |-
      tabaksprodukten opslaat die zijn bestemd voor de in [artikel 66][ref1] bedoelde bevoorrading van schepen en
      luchtvaartuigen of die vanuit die plaats worden overgebracht naar een belastingentrepot, naar een in een andere
      lid-staat gevestigd geregistreerd bedrijf, naar een in een andere lid-staat gevestigd niet-geregistreerd bedrijf of
      naar een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 66a
        hoofdstuk: V
        afdeling: '1'
  - number: '75.1'
    text: 'Accijnszegels kunnen worden aangevraagd bij de inspecteur door:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel75
  - number: 75.1.a
    text: de vergunninghouder van een accijnsgoederenplaats voor tabaksprodukten;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel75
  - number: 75.1.b
    text: degene die buiten Nederland tabaksprodukten van accijnszegels voorziet.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel75
  - number: '75.2'
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen kan, onder daarbij te stellen voorwaarden, worden bepaald dat
      door anderen dan degenen die zijn bedoeld in het eerste lid, accijnszegels kunnen worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel75
  - number: '75.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het aanvragen, het verkrijgbaar stellen en het verstrekken
      van accijnszegels.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel75
  - number: '75.4'
    text: De inspecteur beslist op de aanvraag om accijnszegels bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel75
  - number: '76.1'
    text: |-
      Het bedrag aan accijns dat de accijnszegels blijkens de op de zegels aangebrachte gegevens vertegenwoordigen moet
      worden betaald bij de aanvraag om de accijnszegels.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76
  - number: '76.2'
    text: |-
      In afwijking van het eerste lid kan, indien daarvoor zekerheid is gesteld, de betaling uiterlijk worden gedaan
      op de laatste dag van de tweede maand volgende op die waarin de accijnszegels zijn aangevraagd, indien de
      accijnszegels zijn bestemd om te worden aangebracht op verpakkingen voor sigaretten of rooktabak, dan wel op de
      laatste dag van de derde maand volgende op die waarin de accijnszegels zijn aangevraagd, indien de accijnszegels
      zijn bestemd om te worden aangebracht op verpakkingen voor sigaren dan wel zijn bestemd voor het stuksgewijs
      zegelen van sigaren.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76
  - number: '76.3'
    text: |-
      Het bedrag van de zekerheid wordt vastgesteld door de inspecteur. De vaststelling geschiedt tot een zodanig bedrag
      dat het bedrag aan accijns dat de zegels vertegenwoordigen voldoende verzekerd kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76
  - number: '76.4'
    text: |-
      Met betrekking tot de zekerheid als bedoeld in het tweede lid zijn de[ artikelen 57 tot en met 60][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel57
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '57'
        hoofdstuk: III
        afdeling: '4'
  - number: '76.5'
    text: |-
      Indien de vergunninghouder van een accijnsgoederenplaats zekerheid heeft gesteld op de voet van [artikel 56][ref1]
      kan die zekerheid mede dienen als zekerheid als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
  - number: '76.6'
    text: |-
      Op de verschuldigd geworden betaling is de [Invorderingswet 1990][ref1] van toepassing als ware de betaling
      accijns.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004770
  - number: 76a.1
    text: |-
      Ingeval accijnszegels buiten Nederland op tabaksproducten zijn aangebracht en met betrekking tot deze
      tabaksproducten tijdens het intracommunautaire vervoer een onregelmatigheid of een overtreding is begaan en
      deze onregelmatigheid of overtreding overeenkomstig artikel 20 van de [Richtlijn 92/12/EEG](31992L0012) van de
      Raad van de Europese Gemeenschappen van 25 februari 1992 betreffende de algemene regeling voor accijnsproducten,
      het voorhanden hebben en het verkeer daarvan en de controles daarop (PbEG L 76), aanleiding heeft gegeven tot
      betaling van accijns in een andere lidstaat dan Nederland, wordt op verzoek teruggaaf verleend van het bedrag dat
      overeenkomstig [artikel 76][ref1] is betaald ter zake van de aanvraag van de accijnszegels.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel76
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '76'
        hoofdstuk: VI
        afdeling: '1'
  - number: 76a.2
    text: |-
      De teruggaaf wordt verleend aan diegene die overeenkomstig het bepaalde in [artikel 75][ref1] de accijnszegels
      heeft aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
        hoofdstuk: VI
        afdeling: '1'
  - number: 76a.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel76a
  - number: '77.1'
    text: |-
      Op het bedrag aan accijns dat over een tijdvak op aangifte moet worden voldaan wordt in mindering gebracht het
      bedrag dat is betaald dan wel verschuldigd is ter zake van de aanvraag om de accijnszegels die zijn aangebracht
      op de tabaksprodukten waarvoor over dat tijdvak aangifte wordt gedaan wegens het buiten de accijnsgoederenplaats
      brengen van die produkten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel77
  - number: '77.2'
    text: |-
      Op het bedrag aan accijns dat op aangifte, anders dan over een tijdvak, moet worden voldaan ter zake van de uitslag
      van tabaksprodukten wordt in mindering gebracht het bedrag dat is betaald dan wel verschuldigd is ter zake van de
      aanvraag om de accijnszegels die zijn aangebracht op de binnen Nederland gebrachte tabaksprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel77
  - number: '77.3'
    text: |-
      Op het bedrag aan accijns dat moet worden voldaan ter zake van de invoer van tabaksprodukten wordt in mindering
      gebracht het bedrag dat is betaald dan wel verschuldigd is ter zake van de aanvraag om de accijnszegels die zijn
      aangebracht op de ingevoerde tabaksprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel77
  - number: '78.1'
    text: De accijnszegels worden aangebracht op de kleinhandelsverpakking van tabaksprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel78
  - number: '78.2'
    text: |-
      De accijnszegels vermelden de kleinhandelsprijs, de soort en het aantal stuks of de massa van het tabaksprodukt
      waarop de zegels worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel78
  - number: '78.3'
    text: In afwijking van het eerste lid mogen sigaren stuksgewijs van een accijnszegel worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel78
  - number: '78.4'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel78
  - number: 78.4.a
    text: de vorm en de kleur van de accijnszegels alsmede de daarop te vermelden gegevens;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel78
  - number: 78.4.b
    text: de wijze waarop de accijnszegels worden aangebracht en voor herhaald gebruik ongeschikt moeten worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel78
  - number: 78.4.c
    text: de wijze van verpakking, de grootte van de inhoud van de verpakking en de op de verpakking te vermelden gegevens.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel78
  - number: '79.1'
    text: |-
      Accijnszegels die niet of die verkeerd zijn aangebracht doch niet zijn beschadigd mogen door degene die de zegels
      heeft aangevraagd, onder bij ministeriële regeling te stellen voorwaarden, worden teruggezonden aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel79
  - number: '79.2'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden en beperkingen, worden toegestaan dat
      accijnszegels worden vernietigd onder ambtelijk toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel79
  - number: '79.3'
    text: |-
      Bij ministeriële regeling worden, onder daarbij te stellen voorwaarden en beperkingen, regels gesteld met
      betrekking tot het verrekenen of teruggeven van het bedrag dat is betaald of nog verschuldigd is ter zake van de
      aanvraag om accijnszegels die:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel79
  - number: 79.3.a
    text: zijn teruggezonden door degene die de zegels heeft aangevraagd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel79
  - number: 79.3.b
    text: |-
      zonder aangebracht te zijn geweest op tabaksprodukten die zijn uitgeslagen dan wel zijn ingevoerd, zijn verloren
      gegaan ten gevolge van overmacht of ongeval;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel79
  - number: 79.3.c
    text: zijn vernietigd onder ambtelijk toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel79
  - number: '80.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing van accijns, regels worden gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel80
  - number: 80.1.a
    text: het vervoer van accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel80
  - number: 80.1.b
    text: het leveren van accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel80
  - number: 80.1.c
    text: het voorhanden hebben van accijnsgoederen buiten een accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel80
  - number: '80.2'
    text: Het eerste lid is niet van toepassing op accijnsgoederen die zijn geplaatst onder een communautaire douaneregeling.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel80
  - number: '80.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel80
  - number: '81'
    text: |-
      In de vergunning voor een accijnsgoederenplaats voor tabaksprodukten kan worden toegestaan dat de vergunninghouder
      onder daarbij te stellen voorwaarden gedeeltelijk tot verbruik bereide tabak en tabaksprodukten, al
      dan niet voorzien van accijnszegels, tijdelijk buiten de accijnsgoederenplaats bepaalde bewerkingen of
      verpakkingshandelingen kan laten ondergaan zonder dat het tijdelijk buiten de accijnsgoederenplaats brengen van die
      produkten, in afwijking van [artikel 2, eerste lid][ref1], wordt aangemerkt als uitslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '82.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing van de accijns van tabaksprodukten,
      regels worden gesteld met betrekking tot de handel in en het vervoer van ruwe tabak en van gedeeltelijk tot
      verbruik bereide tabak.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel82
  - number: '82.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel82
  - number: '83.1'
    text: |-
      Accijnsgoederenplaatsen en plaatsen ten aanzien waarvan het aldaar vervaardigen of voorhanden hebben van
      accijnsgoederen is onderworpen aan beperkende bepalingen zijn onderworpen aan onderzoek.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel83
  - number: '83.2'
    text: |-
      Aan onderzoek zijn mede onderworpen vervoermiddelen. [Artikel 50 van de Algemene wet inzake rijksbelastingen][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel50
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '50'
  - number: '83.3'
    text: |-
      In afwijking van [artikel 50, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] kan de toegang tot
      een ingevolge het eerste en het tweede lid aan onderzoek onderworpen plaats of vervoermiddel op elk tijdstip worden
      gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel50
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '50'
  - number: '83.4'
    text: |-
      Ten behoeve van het onderzoek, bedoeld in het tweede lid, is, overeenkomstig bij ministeriële regeling te stellen
      regels, op vordering van de inspecteur of een door hem aangewezen ambtenaar:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel83
  - number: 83.4.a
    text: |-
      de gezagvoerder van een schip gehouden het schip terstond vaart te doen minderen, te doen bijdraaien of te doen
      stilhouden en aanleggen;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel83
  - number: 83.4.b
    text: |-
      de bestuurder van een ander vervoermiddel dan een schip gehouden dit terstond te doen stilhouden en, indien het
      vervoermiddel door mechanische kracht wordt voortbewogen, de motor buiten werking te stellen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel83
  - number: '83.5'
    text: |-
      De in het vierde lid bedoelde ambtenaren zijn bevoegd een vervoermiddel, als bedoeld in het vierde lid, te brengen
      of te doen brengen naar een nabij gelegen plaats. De gezagvoerder of bestuurder is verplicht desgevorderd zijn
      voor het onderzoek en het vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het vervoermiddel
      te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel83
  - number: '84.1'
    text: |-
      De inspecteur of een door hem aangewezen ambtenaar die het onderzoek verricht, kan vorderen dat van goederen één of
      meer monsters worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84
  - number: '84.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent het nemen van monsters.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84
  - number: 84a.1
    text: |-
      In geval van verhoging van de accijns, bedoeld in [artikel 27, eerste, derde, of vierde lid][ref1], wordt ter
      zake van het bij het ingaan van die verhoging voorhanden hebben in een opslagplaats van de desbetreffende minerale
      oliën, accijns geheven, die per 1000 L bij een temperatuur van 15°C onderscheidenlijk per 1000 kg gelijk is aan
      de verhoging van het daarvoor in [artikel 27, eerste, derde, of vierde lid][ref2], vermelde bedrag. Onder het
      voorhanden hebben wordt mede begrepen het vervoer naar een opslagplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 84a.2
    text: 'Aan de accijns, bedoeld in het eerste lid, zijn niet onderworpen minerale oliën:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
  - number: 84a.2.a
    text: |-
      waarvoor het tijdstip waarop de accijns, bedoeld in [artikel 27, eerste, derde, of vierde lid][ref1], verschuldigd
      wordt, is gelegen op of na het tijdstip van de in het eerste lid bedoelde verhoging;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 84a.2.b
    text: waarvoor een vrijstelling van accijns geldt.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
  - number: 84a.3
    text: |-
      Onder opslagplaats wordt verstaan elk gebouw of terrein waar minerale oliën als bedoeld in het eerste lid voor
      commerciële doeleinden voorhanden zijn. Opslagplaatsen in gebruik bij een zelfde persoon worden te zamen als één
      opslagplaats beschouwd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
  - number: 84a.4
    text: |-
      De accijns, bedoeld in het eerste lid, wordt geheven van de eigenaar van de in een opslagplaats voorhanden minerale
      oliën en moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
  - number: 84a.5
    text: |-
      In afwijking van [artikel 10, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1], wordt uiterlijk de
      vijfde werkdag na het ingaan van de verhoging aangifte gedaan van de hoeveelheden van de aan de accijns, bedoeld in
      het eerste lid, onderworpen onderscheiden minerale oliën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
  - number: 84a.6
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aangifte.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
  - number: 84a.7
    text: |-
      De heffing van accijns als bedoeld in het eerste lid blijft achterwege indien de te heffen accijns niet meer
      bedraagt dan € 91.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84a
  - number: 84b.1
    text: |-
      In geval van verlaging van de accijns, bedoeld in [artikel 27, eerste, derde, of vierde lid][ref1], wordt voor de
      desbetreffende minerale oliën die bij het ingaan van de verlaging voorhanden zijn in een opslagplaats, op verzoek
      teruggaaf van accijns verleend, die per 1000 L bij een temperatuur van 15° C onderscheidenlijk per 1000 kg gelijk
      is aan de verlaging van het daarvoor in [artikel 27, eerste, derde, of vierde lid][ref2], vermelde bedrag. Onder
      voorhanden zijn wordt mede begrepen vervoer naar een opslagplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 84b.2
    text: |-
      [Artikel 84][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel84a
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 84a
        hoofdstuk: VI
        afdeling: 2A
  - number: 84b.3
    text: |-
      De eigenaar van de in de opslagplaats voorhanden minerale oliën dient uiterlijk de vijfde werkdag na het ingaan van
      de verlaging het verzoek om teruggaaf te doen bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84b
  - number: 84b.4
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84b
  - number: 84b.5
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het verzoek om teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84b
  - number: 84c
    text: |-
      Bij wijziging van de accijns op grond van [artikel 27][ref1] kan bij de daartoe strekkende ministeriële regeling
      worden bepaald dat [artikel 84][ref2] of [artikel 84][ref3] geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel84a
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel84b
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 27a
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 84a
        hoofdstuk: VI
        afdeling: 2A
      - id: ref3
        bwb_id: BWBR0005251
        artikel: 84b
        hoofdstuk: VI
        afdeling: 2A
  - number: '85.1'
    text: |-
      Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, worden bepaald dat
      accijnsgoederen voorhanden mogen zijn in een entrepot.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel85
  - number: '85.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel85
  - number: 86a.1
    text: |-
      Wanneer met betrekking tot accijnsgoederen tijdens het intracommunautaire vervoer onder schorsing van de accijns
      via Nederland of met bestemming Nederland een onregelmatigheid of een overtreding in Nederland wordt begaan, is de
      accijns verschuldigd door de natuurlijke persoon of de rechtspersoon die zekerheid heeft gesteld op grond van de
      wettelijke bepalingen van de lid-staat van waaruit de accijnsgoederen worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86a
  - number: 86a.2
    text: |-
      Wanneer in Nederland wordt vastgesteld dat tijdens het in het eerste lid bedoelde vervoer een onregelmatigheid of
      een overtreding is begaan, zonder dat kan worden vastgesteld waar deze is begaan, wordt deze geacht te zijn begaan
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86a
  - number: 86a.3
    text: |-
      Wanneer met betrekking tot accijnsgoederen die vanuit Nederland zijn verzonden tijdens het intracommunautaire
      vervoer onder schorsing van de accijns een onregelmatigheid of een overtreding in Nederland wordt begaan,
      worden deze goederen geacht te zijn uitgeslagen uit de accijnsgoederenplaats van waaruit de accijnsgoederen zijn
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86a
  - number: 86a.4
    text: |-
      Wanneer tijdens het in het derde lid bedoelde vervoer van accijnsgoederen blijkt dat deze goederen niet op de
      plaats van bestemming zijn aangekomen en niet kan worden vastgesteld waar de onregelmatigheid of de overtreding
      is begaan, wordt deze geacht te zijn begaan in Nederland en worden deze goederen geacht te zijn uitgeslagen uit
      de accijnsgoederenplaats van waaruit de accijnsgoederen zijn overgebracht, tenzij binnen een termijn van vier
      maanden vanaf de datum van verzending van de goederen wordt aangetoond dat de handeling regelmatig was of dat de
      onregelmatigheid of de overtreding daadwerkelijk werd begaan in een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86a
  - number: 86a.5
    text: |-
      Wanneer de accijns in een andere lid-staat verschuldigd is geworden op grond van het feit dat de onregelmatigheid
      of de overtreding werd geacht in die lid-staat te zijn begaan en binnen een termijn van drie jaar te rekenen
      vanaf de datum van opstelling van het geleidedocument wordt vastgesteld dat de onregelmatigheid of overtreding
      daadwerkelijk werd begaan in Nederland, is de accijns in Nederland verschuldigd ter zake van de uitslag tegen het
      op de datum van verzending geldende tarief.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86a
  - number: 86a.6
    text: |-
      Indien in de gevallen bedoeld in het tweede of vierde lid binnen een termijn van drie jaar te rekenen vanaf de
      datum van opstelling van het geleidedocument wordt vastgesteld dat de onregelmatigheid of overtreding daadwerkelijk
      werd begaan in een andere lid-staat is de accijns in die lid-staat verschuldigd tegen het op de datum van
      verzending geldende tarief en wordt de aanvankelijk in Nederland geheven accijns teruggegeven zodra is aangetoond
      dat de accijns in de andere lid-staat is voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86a
  - number: 86a.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86a
  - number: 86b.1
    text: |-
      De levering van accijnsgoederen aan natuurlijke personen of rechtspersonen die direct of indirect door of voor
      rekening van een in Nederland gevestigde verkoper worden verzonden of vervoerd vanuit Nederland naar een andere
      lid-staat, is slechts toegestaan indien de verkoper in het bezit is van een daartoe strekkende vergunning van de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.2
    text: |-
      Degene die een in het eerste lid bedoelde vergunning wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de verplichtingen waaraan de in
      het eerste lid bedoelde personen moeten voldoen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.3.a
    text: de administratie; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.3.b
    text: het stellen van zekerheid voor de accijns die in de andere lid-staten moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.4
    text: 'In het verzoek worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.4.a
    text: de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.4.b
    text: de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting per jaar zal worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.4.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld; en
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.4.d
    text: de administratie met betrekking tot de door de verkoper naar andere lid-staten verzonden accijnsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: 86b.5
    text: |-
      De[ artikelen 43][ref1], [44, tweede en derde lid][ref2], [45][ref3], [46][ref4], [48][ref5], [49][ref6],
      [50][ref7] en [56 tot en met 60][ref8] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0005251#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0005251#Artikel50
      [ref8]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '44'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '45'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '46'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005251
        artikel: '49'
        hoofdstuk: III
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0005251
        artikel: '50'
        hoofdstuk: III
        afdeling: '2'
      - id: ref8
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
  - number: 86b.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel86b
  - number: '87.1'
    text: |-
      Degene die minerale oliën waaraan herkenningsmiddelen zijn toegevoegd in strijd met wettelijke bepalingen
      voorhanden heeft of gebruikt, is gehouden tot betaling van het verschil tussen het bedrag aan accijns dat is
      geheven en het bedrag dat zou zijn geheven indien geen herkenningsmiddelen zouden zijn toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel87
  - number: '87.2'
    text: |-
      Op de verschuldigd geworden betaling zijn de [Algemene wet inzake rijksbelastingen][ref1] en de
      [Invorderingswet 1990][ref2] van toepassing als ware de betaling een naheffing van accijns onderscheidenlijk als
      ware de betaling accijns.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '88.1'
    text: |-
      Verliezen bij de vervaardiging, tijdens het vervoer of tijdens de opslag van accijnsgoederen die door de
      vergunninghouder van de accijnsgoederenplaats, dan wel in voorkomend geval door de vergunninghouder van het
      belastingentrepot, niet kunnen worden aangetoond, worden aangemerkt als te zijn uitgeslagen. Accijnsgoederen die
      worden vermist, worden eveneens aangemerkt als te zijn uitgeslagen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel88
  - number: '88.2'
    text: |-
      Verliezen tijdens het vervoer van accijnsgoederen die door de vergunninghouder van een geregistreerd bedrijf of
      van een niet-geregistreerd bedrijf, dan wel in voorkomend geval door de vergunninghouder van het belastingentrepot,
      niet kunnen worden aangetoond worden aangemerkt als te zijn uitgeslagen. Accijnsgoederen die worden vermist, worden
      eveneens aangemerkt als te zijn uitgeslagen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel88
  - number: '88.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot accijnsgoederen die zijn verloren gegaan
      door bijzondere omstandigheden of worden vernietigd onder ambtelijk toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel88
  - number: '88.4'
    text: |-
      Het eerste en derde lid zijn van overeenkomstige toepassing met betrekking tot verliezen van accijnsgoederen die
      onder een communautaire douaneregeling zijn geplaatst dan wel zijn opgeslagen in een plaats voor tijdelijke opslag,
      met dien verstande dat de goederen worden aangemerkt als te zijn ingevoerd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel88
  - number: '89.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel89
  - number: '89.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel89
  - number: '90.1'
    text: |-
      Het is niet toegestaan een distilleertoestel te vervaardigen of voorhanden te hebben zonder een daartoe strekkende
      vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: '90.2'
    text: |-
      Onder een distilleertoestel wordt verstaan elk toestel - ook indien dit niet gereed is voor dadelijk gebruik - dat
      geschikt is voor het afscheiden van ethanol uit ethanolhoudende stoffen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: '90.3'
    text: De vergunning wordt op verzoek verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: '90.4'
    text: |-
      Het verlenen, het aanpassen en het intrekken van een vergunning alsmede het afwijzen van een verzoek daartoe
      geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: '90.5'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het zesde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: '90.6'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het vijfde lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: '90.7'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: 90.7.a
    text: regels worden gesteld met betrekking tot de in de vergunning op te nemen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: 90.7.b
    text: distilleertoestellen worden aangewezen waarvoor geen vergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
  - number: '90.8'
    text: |-
      [Artikel 83][ref1] is van overeenkomstige toepassing op plaatsen waar distilleertoestellen worden vervaardigd of
      voorhanden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel83
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '83'
        hoofdstuk: VI
        afdeling: '2'
  - number: '91.1'
    text: |-
      Het is niet toegestaan halfzware olie en gasolie die zijn voorzien van herkenningsmiddelen als bedoeld in
      [artikel 27, derde lid][ref1], buiten een accijnsgoederenplaats voorhanden te hebben te zamen met middelen
      die de afscheiding, opheffing of verandering van de werking van die herkenningsmiddelen in deze oliën kunnen
      bewerkstelligen of bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '91.2'
    text: |-
      Het is niet toegestaan halfzware olie en gasolie die zijn voorzien van herkenningsmiddelen als bedoeld in
      [artikel 27, derde lid][ref1], dan wel bestanddelen bevatten van die herkenningsmiddelen, voorhanden te hebben in:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 91.2.a
    text: de brandstoftank van een motorrijtuig of van een pleziervaartuig;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
  - number: 91.2.b
    text: |-
      tanks behorende bij afleveringspompen waar minerale oliën in de brandstoftanks van motorrijtuigen of van schepen
      worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
  - number: '91.3'
    text: 'Het bepaalde in het tweede lid, onderdeel *a*, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
  - number: 91.3.a
    text: motorrijtuigen die geen gebruik maken van de weg;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
  - number: 91.3.b
    text: |-
      bij algemene maatregel van bestuur, onder daarbij te stellen voorwaarden, aan te wijzen motorrijtuigen die
      gewoonlijk niet worden gebruikt op de weg.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
  - number: '91.4'
    text: |-
      Het bepaalde in het tweede lid, onderdeel b, is niet van toepassing indien een tank minerale oliën bevat die
      uitsluitend worden afgeleverd in de brandstoftanks van motorrijtuigen, als bedoeld in het derde lid, en van andere
      schepen dan pleziervaartuigen die in het bezit zijn van en gebruikt worden door degene die de beschikking heeft
      over de tank.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
  - number: '91.5'
    text: |-
      Bij ministeriële regeling kan in bijzondere gevallen ontheffing worden verleend ten aanzien van een of meer van de
      in het eerste en het tweede lid bedoelde verboden.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel91
  - number: '92.1'
    text: |-
      Het is niet toegestaan herkenningsmiddelen als bedoeld in [artikel 27, derde lid][ref1], toe te voegen aan lichte
      olie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '92.2'
    text: |-
      Het is niet toegestaan lichte olie die is voorzien van die herkenningsmiddelen dan wel bestanddelen bevat van die
      herkenningsmiddelen, voorhanden te hebben.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel92
  - number: '93.1'
    text: |-
      Het is niet toegestaan tabaksprodukten die zijn voorzien van accijnszegels te brengen vanuit een
      accijnsgoederenplaats voor tabaksprodukten naar een andere accijnsgoederenplaats voor tabaksprodukten of te
      plaatsen onder een communautaire douaneregeling.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel93
  - number: '93.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel93
  - number: 93.2.a
    text: |-
      voor de in dat lid bedoelde accijnsgoederenplaats ingevolge [artikel 53, derde lid][ref1], aangifte wordt gedaan
      door dezelfde vergunninghouder;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
        hoofdstuk: III
        afdeling: '3'
  - number: 93.2.b
    text: |-
      de accijnszegels zijn aangevraagd door de vergunninghouder van de accijnsgoederenplaats waarin de tabaksprodukten
      worden ingeslagen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel93
  - number: '93.3'
    text: De inspecteur kan in aanvulling op het bepaalde in het tweede lid, onderdeel *b*, nadere voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel93
  - number: '94.1'
    text: |-
      Het is degene die op grond van [artikel 75][ref1] accijnszegels kan aanvragen niet toegestaan een zelfde
      tabaksprodukt onder meer dan één kleinhandelsprijs in de handel te brengen of te doen brengen, tenzij in het merk
      of door een merk waaronder het is verpakt op duidelijke wijze een onderscheid is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
        hoofdstuk: VI
        afdeling: '1'
  - number: '94.2'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, afwijking van het eerste lid worden
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel94
  - number: '95.1'
    text: |-
      Het is niet toegestaan tabaksprodukten te verkopen, te koop aan te bieden of af te leveren indien de verpakking
      niet voldoet aan de bij of krachtens [artikel 78][ref1] gestelde voorwaarden of de accijnszegels niet ongeschonden
      op de voorgeschreven wijze zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel78
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '78'
        hoofdstuk: VI
        afdeling: '1'
  - number: '95.2'
    text: |-
      Het is niet toegestaan tabaksprodukten aan anderen dan wederverkopers te verkopen, te koop aan te bieden of af te
      leveren voor:
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel95
  - number: 95.2.a
    text: een lagere prijs dan die is vermeld op de accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel95
  - number: 95.2.b
    text: |-
      een hogere prijs dan die is vermeld op de accijnszegels, tenzij tevoren het verschil in accijns is voldaan
      overeenkomstig bij algemene maatregel van bestuur te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel95
  - number: '95.3'
    text: |-
      Onder het bepaalde in het tweede lid, onderdeel *a*, wordt mede begrepen het bij de verkoop aan anderen dan
      wederverkopers in enigerlei vorm verstrekken van geschenken, toegiften en bonnen alsmede het verlenen van
      medewerking aan handelingen die zijn gericht op de bevoordeling van derden.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel95
  - number: '95.4'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, afwijking van het eerste lid worden
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel95
  - number: '96'
    text: 'Het is een vergunninghouder van een accijnsgoederenplaats voor tabaksprodukten niet toegestaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel96
  - number: 96.a
    text: gebruikte accijnszegels voorhanden te hebben;
    url: https://wetten.overheid.nl/BWBR0005251/2007-01-01#Artikel96
  - number: 96.b
    text: ongebruikte accijnszegels over te dragen aan anderen dan de inspecteur;
