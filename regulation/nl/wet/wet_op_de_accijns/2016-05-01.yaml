    text: |-
      bij toepassing van [artikel 2d, vierde lid][ref1]: op het tijdstip van de verkrijging van de minerale oliën in
      Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
        hoofdstuk: I
        afdeling: '1'
  - number: 52.3.e
    text: |-
      bij toepassing van [artikel 2e, eerste lid][ref1]: op het tijdstip van de aanvang van het voorhanden hebben van de
      accijnsgoederen in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
