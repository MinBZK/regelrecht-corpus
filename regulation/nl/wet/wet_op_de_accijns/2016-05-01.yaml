      in de in [artikel 2a, vijfde lid][ref1], bedoelde situaties: het tijdstip van ontvangst van de accijnsgoederen op
      de plaats van rechtstreekse aflevering.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: '52.3'
    text: 'In afwijking van het eerste lid wordt de accijns verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
  - number: 52.3.a
    text: |-
      bij toepassing van [artikel 2, vierde lid][ref1]: op het tijdstip van de aanvang van het voorhanden hebben of het
      gebruik van de minerale oliën;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 52.3.b
    text: |-
      bij toepassing van [artikel 2c][ref1]: op het tijdstip van de vaststelling van de in artikel 2c bedoelde
      onregelmatigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2c
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2c
        hoofdstuk: I
        afdeling: '1'
  - number: 52.3.c
    text: |-
      bij toepassing van [artikel 2d, derde lid][ref1]: op het tijdstip van de aanvang van het voorhanden hebben van de
      accijnsgoederen in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
        hoofdstuk: I
        afdeling: '1'
