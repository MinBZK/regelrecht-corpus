---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_accijns
regulatory_layer: WET
publication_date: '2022-07-07'
valid_from: '2016-05-01'
bwb_id: BWBR0005251
url: https://wetten.overheid.nl/BWBR0005251/2016-05-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de accijnswetgeving te moderniseren, te vereenvoudigen
    en op een aantal punten technisch te herzien en dat het voorts wenselijk is de heffing van de accijnzen onder
    te brengen in één heffingswet en het stelsel zodanig te uniformeren dat een einde wordt gemaakt aan de grote
    verscheidenheid in regelgeving welke kenmerkend is voor de huidige accijnswetgeving;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Onder de naam accijns wordt een belasting geheven van:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: 1.1.a
    text: bier;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: 1.1.b
    text: wijn;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: 1.1.c
    text: tussenprodukten;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: 1.1.d
    text: overige alcoholhoudende produkten;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: 1.1.e
    text: minerale oliën; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: 1.1.f
    text: tabaksprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: '1.2'
    text: De accijns wordt verschuldigd ter zake van de uitslag tot verbruik van de in het eerste lid bedoelde goederen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1
  - number: 1a.1
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.a
    text: |-
      *accijnsgoed:* een goed als bedoeld in [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 1a.1.b
    text: |-
      *accijnsgoederenplaats:* iedere plaats in Nederland waar op grond van de bepalingen van deze wet accijnsgoederen
      onder schorsing van accijns mogen worden vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden
      ontvangen en mogen worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.c
    text: |-
      *accijnsschorsingsregeling:* belastingregeling die geldt voor het onder schorsing van accijns produceren,
      verwerken, voorhanden hebben en overbrengen van niet onder een douaneschorsingsregeling geplaatste accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.d
    text: |-
      *belastingentrepot:* iedere plaats op het grondgebied van de Unie buiten Nederland waar op grond van de wettelijke
      bepalingen van de lidstaat waar de plaats zich bevindt, accijnsgoederen onder schorsing van accijns mogen worden
      vervaardigd, mogen worden verwerkt, voorhanden mogen zijn, mogen worden ontvangen en mogen worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.f
    text: |-
      *derde land:* elke staat of elk grondgebied waarop het Verdrag betreffende de werking van de Europese Unie niet van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.g
    text: |-
      *derdelandsgebieden:* de gebieden, genoemd in artikel 5, tweede en derde lid, van Richtlijn 2008/118/EG van de Raad
      van 16 december 2008 houdende een algemene regeling inzake accijns en houdende intrekking van Richtlijn 92/12/EEG
      (PbEU 2009, L 9);
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.h
    text: |-
      *douaneschorsingsregeling:* iedere in het Douanewetboek van de Unie vastgestelde bijzondere procedure inzake
      douanetoezicht ter zake van niet-Unie-goederen die in het douanegebied van de Unie worden binnengebracht,
      tijdelijke opslag en de bijzondere regelingen extern douanevervoer, douane-entrepot, actieve veredeling en
      tijdelijke invoer, bedoeld in artikel 210 van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.i
    text: |-
      *elektronisch administratief document:* een document dat op grond van de bepalingen van deze wet dan wel op
      grond van de wettelijke bepalingen van een andere lidstaat moet worden opgesteld ten behoeve van het onder een
      accijnsschorsingsregeling overbrengen van accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.j
    text: '*Unie en grondgebied van de Unie:* het geheel van de grondgebieden van de lidstaten in de zin van onderdeel o;'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.k
    text: |-
      *geregistreerde afzender:* een natuurlijke of rechtspersoon die op grond van een ingevolge deze wet afgegeven
      vergunning dan wel ingevolge de wettelijke bepalingen van een andere lidstaat van invoer alleen toestemming
      heeft gekregen om, onder de door de inspecteur onderscheidenlijk de bevoegde autoriteiten van een andere lidstaat
      vastgestelde voorwaarden, bij de bedrijfsuitoefening accijnsgoederen onder een accijnsschorsingsregeling te
      verzenden wanneer zij overeenkomstig artikel 201 van het Douanewetboek van de Unie in het vrije verkeer worden
      gebracht;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.l
    text: |-
      *geregistreerde geadresseerde:* een natuurlijke of rechtspersoon die op grond van een ingevolge deze wet
      dan wel een ingevolge de wettelijke bepalingen van een andere lidstaat afgegeven vergunning gemachtigd is
      om bij de bedrijfsuitoefening accijnsgoederen in ontvangst te nemen die vanuit een andere lidstaat onder een
      accijnsschorsingsregeling worden overgebracht;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.m
    text: |-
      *GN-code:* de code, bedoeld in Verordening (EEG) nr. 2658/87 van de Raad van 23 juli 1987 met betrekking tot de
      tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG 1987, L 256), zoals deze luidt op 19
      oktober 1992 onderscheidenlijk, indien het minerale oliën betreft, op 1 januari 2002;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.n
    text: |-
      *invoer van accijnsgoederen:* het in Nederland binnenbrengen van accijnsgoederen die bij hun binnenkomst in
      Nederland niet onder een douaneschorsingsregeling worden geplaatst, alsmede het in Nederland vrijgeven van onder
      een douaneschorsingsregeling geplaatste accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.o
    text: |-
      *lidstaat en grondgebied van een lidstaat:* het grondgebied van iedere lidstaat van de Unie waarop het Verdrag
      betreffende de Europese Unie en het Verdrag betreffende de werking van de Europese Unie overeenkomstig artikel 52
      van het Verdrag betreffende de Europese Unie en de artikelen 349 en 355 van het Verdrag betreffende de werking van
      de Europese Unie van toepassing zijn, met uitzondering van derdelandsgebieden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.p
    text: |-
      *motorrijtuig:* een voertuig dat is bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend of
      mede door een mechanische kracht, op of aan het voertuig aanwezig;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.q
    text: |-
      *ondernemer:* een ondernemer in de zin van de [Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 1a.1.r
    text: |-
      *plaats van invoer:* de plaats waar de goederen zich bevinden wanneer zij overeenkomstig artikel 201 van het
      Douanewetboek van de Unie in het vrije verkeer worden gebracht;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.s
    text: |-
      *plaats van rechtstreekse aflevering:* een plaats die op grond van een ingevolge deze wet afgegeven vergunning door
      de vergunninghouder van een accijnsgoederenplaats of door de geregistreerde geadresseerde is aangewezen als plaats
      waarnaar accijnsgoederen onder een accijnsschorsingsregeling mogen worden overgebracht;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.t
    text: |-
      *plaats waar de accijnsgoederen het grondgebied van de Unie verlaten:* het douanekantoor van uitgang, bedoeld
      in artikel 329, eerste lid, van de Uitvoeringsverordening Douanewetboek van de Unie of het kantoor waar de
      douaneformaliteiten worden vervuld die van toepassing zijn op de uitgang van accijnsgoederen uit de Unie naar een
      gebied, genoemd in artikel 5, tweede lid, van Richtlijn 2008/118/EG van de Raad van 16 december 2008 houdende een
      algemene regeling inzake accijns en houdende intrekking van Richtlijn 92/12/EEG (PbEU 2009, L 9);
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.u
    text: |-
      *Richtlijn hernieuwbare energie:* Richtlijn 2009/28/EG van het Europees Parlement en de Raad van 23 april 2009 ter
      bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking van Richtlijn
      2001/77/EG en Richtlijn 2003/30/EG (PbEU 2009, L 140);
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.w
    text: |-
      *vervaardigen van een accijnsgoed:* elk handelen waarbij of waardoor een accijnsgoed ontstaat of de samenstelling
      van een accijnsgoed wordt gewijzigd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.1.x
    text: |-
      *weg:* elke voor het openbaar rijverkeer of ander verkeer openstaande weg en elk zodanig pad, de in de weg of het
      pad liggende bruggen en duikers alsmede de tot de weg behorende paden en bermen of zijkanten.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.2
    text: |-
      Bij ministeriële regeling kunnen de GN-codes, genoemd in deze wet en de daarop berustende bepalingen worden
      aangepast indien de overeenkomstige GN-codes zoals opgenomen in Richtlijn 2003/96/EG van de Raad van 27 oktober
      2003 tot herstructurering van de communautaire regeling voor de belasting van energieproducten en elektriciteit
      (PbEU 2003, L 283), in overeenstemming met artikel 2, vijfde lid, van die richtlijn zijn aangepast. In dat geval
      kan bij ministeriële regeling eveneens de laatstgenoemde datum in het eerste lid, onderdeel m, worden vervangen
      door de datum van de versie van de in dat onderdeel bedoelde verordening die aan de wijziging van de GN-codes ten
      grondslag heeft gelegen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat aan minerale oliën bij ministeriële regeling, onder
      daarbij te stellen voorwaarden, voorgeschreven herkenningsmiddelen worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.4
    text: 'Als vervaardigen van een accijnsgoed wordt mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.4.a
    text: het toevoegen van herkenningsmiddelen als bedoeld in het derde lid aan minerale oliën;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: 1a.4.b
    text: |-
      het afscheiden van herkenningsmiddelen als bedoeld in het derde lid, of van bestanddelen van die
      herkenningsmiddelen, van minerale oliën waaraan deze herkenningsmiddelen zijn toegevoegd, waaronder begrepen het
      opheffen of veranderen van de werking van deze herkenningsmiddelen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel1a
  - number: '2.1'
    text: 'In deze wet en in de daarop gebaseerde regelingen wordt verstaan onder uitslag tot verbruik:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: 2.1.a
    text: |-
      het aan een accijnsschorsingsregeling onttrekken, daaronder begrepen het onregelmatig onttrekken, van
      accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: 2.1.b
    text: |-
      het voorhanden hebben van een accijnsgoed buiten een accijnsschorsingsregeling wanneer over dat goed geen accijns
      is geheven overeenkomstig de toepasselijke bepalingen van het Unierecht en de nationale wetgeving;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: 2.1.c
    text: de productie, met inbegrip van onregelmatige productie, van accijnsgoederen buiten een accijnsschorsingsregeling;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: 2.1.d
    text: |-
      de invoer, met inbegrip van onregelmatige invoer, van accijnsgoederen die niet onmiddellijk bij invoer onder een
      accijnsschorsingsregeling worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: '2.2'
    text: |-
      Als uitslag tot verbruik wordt mede aangemerkt het verbruik, anders dan als grondstof, van een accijnsgoed binnen
      een plaats die voor dat soort accijnsgoed als accijnsgoederenplaats is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: '2.3'
    text: |-
      Als uitslag tot verbruik wordt mede aangemerkt het verbruik, anders dan als grondstof, in Nederland van een
      accijnsgoed dat onder een douaneschorsingsregeling is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: '2.4'
    text: |-
      Als uitslag tot verbruik wordt mede aangemerkt het in strijd met wettelijke bepalingen voorhanden hebben of
      gebruiken van minerale oliën waaraan herkenningsmiddelen als bedoeld in [artikel 1a, derde lid][ref1], zijn
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
        hoofdstuk: I
        afdeling: '1'
  - number: '2.5'
    text: |-
      De algehele vernietiging of het onherstelbare verlies van onder een accijnsschorsingsregeling geplaatste
      accijnsgoederen door een oorzaak die met de aard van de goederen verband houdt, dan wel door niet te voorziene
      omstandigheden of overmacht, of ingevolge instructies van de inspecteur dan wel van de bevoegde autoriteiten van
      een andere lidstaat, wordt niet aangemerkt als uitslag tot verbruik. Voor de toepassing van deze bepaling worden
      goederen geacht totaal vernietigd of onherstelbaar verloren te zijn wanneer zij als accijnsgoed onbruikbaar zijn
      geworden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: '2.6'
    text: |-
      De algehele vernietiging of het onherstelbare verlies van de accijnsgoederen in kwestie wordt aangetoond ten
      genoegen van de inspecteur dan wel, indien van toepassing, de bevoegde autoriteiten van de lidstaat waar de
      algehele vernietiging of het onherstelbare verlies zich heeft voorgedaan of, indien niet is vast te stellen waar
      het verlies zich heeft voorgedaan, van de lidstaat waar het verlies is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: '2.7'
    text: |-
      Het vijfde en zesde lid zijn van overeenkomstige toepassing met betrekking tot accijnsgoederen die onder een
      douaneschorsingsregeling zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: '2.8'
    text: |-
      Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden en beperkingen, verbruik van minerale oliën als brandstof voor het vervaardigen van minerale
      oliën in een accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: '2.9'
    text: |-
      Als uitslag tot verbruik wordt niet aangemerkt het vervaardigen en het voorhanden hebben van een accijnsgoed,
      bedoeld in [artikel 5, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '5'
        hoofdstuk: I
        afdeling: '2'
  - number: '2.10'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2
  - number: 2a.1
    text: |-
      Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden, brengen van een accijnsgoed vanuit een accijnsgoederenplaats naar:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.1.a
    text: een andere accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.1.b
    text: een belastingentrepot;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.1.c
    text: een in een andere lidstaat gevestigde geregistreerde geadresseerde;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.1.d
    text: een plaats waar de accijnsgoederen het grondgebied van de Unie verlaten;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.1.e
    text: |-
      een in een andere lidstaat gevestigde geadresseerde als bedoeld in [artikel 69][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '69'
        hoofdstuk: V
        afdeling: '1'
  - number: 2a.2
    text: |-
      Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden, brengen van een accijnsgoed vanuit een belastingentrepot of door een in een andere lidstaat
      gevestigde geregistreerde afzender naar:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.2.a
    text: een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.2.b
    text: een in Nederland gevestigde geregistreerde geadresseerde;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.2.c
    text: |-
      een in Nederland gevestigde geadresseerde als bedoeld in [artikel 69][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '69'
        hoofdstuk: V
        afdeling: '1'
  - number: 2a.3
    text: |-
      Als uitslag tot verbruik wordt niet aangemerkt het, met inachtneming van bij algemene maatregel van bestuur te
      stellen voorwaarden, door een in Nederland gevestigde geregistreerde afzender brengen van een accijnsgoed van de
      plaats van invoer naar:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.3.a
    text: een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.3.b
    text: een belastingentrepot;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.3.c
    text: een in een andere lidstaat gevestigde geregistreerde geadresseerde;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.3.d
    text: een plaats waar de accijnsgoederen het grondgebied van de Unie verlaten;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.3.e
    text: |-
      een in een andere lidstaat gevestigde geadresseerde als bedoeld in [artikel 69][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel69
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '69'
        hoofdstuk: V
        afdeling: '1'
  - number: 2a.4
    text: |-
      De voorwaarden, bedoeld in het eerste tot en met derde lid, hebben betrekking op formaliteiten waaraan bij de
      overbrenging van accijnsgoederen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.5
    text: |-
      In de gevallen, bedoeld in het eerste lid, onderdeel a, tweede lid, onderdelen a en b, en derde lid, onderdeel
      a, kan, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen, worden toegestaan dat
      de accijnsgoederen onder een accijnsschorsingsregeling worden overgebracht naar een plaats van rechtstreekse
      aflevering in Nederland.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2a.6
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, voor minerale oliën waarvoor in
      [artikel 27][ref1] geen tarief is vermeld, ontheffing worden verleend van de formaliteiten, bedoeld in het vierde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 2a.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2a
  - number: 2b.1
    text: |-
      De overbrenging van accijnsgoederen onder een accijnsschorsingsregeling vangt aan, in de in
      [artikel 2a, eerste en tweede lid][ref1], bedoelde gevallen, wanneer de accijnsgoederen de accijnsgoederenplaats
      onderscheidenlijk het belastingentrepot van verzending verlaten en, in de in artikel 2a, derde lid, bedoelde
      gevallen, wanneer zij overeenkomstig artikel 201 van het Douanewetboek van de Unie in het vrije verkeer worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: 2b.2
    text: |-
      De overbrenging van accijnsgoederen onder een accijnsschorsingsregeling eindigt, in de in
      [artikel 2a, eerste lid, onderdelen a, b, c en e, tweede lid, en derde lid, onderdelen a, b, c en e][ref1],
      bedoelde gevallen, op het tijdstip waarop de geadresseerde de accijnsgoederen in ontvangst heeft genomen, en, in
      de in artikel 2a, eerste lid, onderdeel d, en derde lid, onderdeel d, bedoelde gevallen, op het tijdstip waarop de
      goederen het grondgebied van de Unie hebben verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.1
    text: |-
      Indien tijdens een overbrenging van accijnsgoederen onder een accijnsschorsingsregeling in Nederland een
      onregelmatigheid heeft plaatsgevonden die resulteerde in uitslag tot verbruik van deze goederen als bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], vindt de uitslag tot verbruik plaats in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.2
    text: |-
      Indien in Nederland wordt geconstateerd dat zich tijdens een overbrenging van accijnsgoederen als bedoeld in het
      eerste lid een onregelmatigheid heeft voorgedaan die resulteerde in uitslag tot verbruik van deze goederen als
      bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], en er niet kan worden vastgesteld waar de onregelmatigheid
      plaatsvond, wordt deze geacht te hebben plaatsgevonden in Nederland op het tijdstip waarop de onregelmatigheid
      werd geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.3
    text: |-
      Indien vanuit Nederland onder een accijnsschorsingsregeling overgebrachte accijnsgoederen niet op de plaats van
      bestemming zijn aangekomen en er tijdens de overbrenging geen onregelmatigheid is geconstateerd die resulteerde
      in uitslag tot verbruik van de accijnsgoederen als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1],
      wordt de onregelmatigheid geacht te hebben plaatsgevonden in Nederland op het tijdstip van aanvang van de
      overbrenging, tenzij binnen een termijn van vier maanden na de aanvang van de overbrenging als bedoeld in
      [artikel 2b, eerste lid][ref2], ten genoegen van de inspecteur wordt aangetoond dat de overbrenging is geëindigd
      overeenkomstig artikel 2b, tweede lid, of dat is vastgesteld waar de onregelmatigheid plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2b
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2b
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.4
    text: |-
      Indien de persoon die de in [artikel 56][ref1] bedoelde zekerheid heeft gesteld, niet op de hoogte was of mogelijk
      niet op de hoogte was van het feit dat de goederen niet ter bestemming zijn aangekomen, wordt hem een termijn van
      een maand, te rekenen vanaf het tijdstip van de verstrekking van die informatie door de inspecteur, gegund om het
      eindigen van de overbrenging overeenkomstig [artikel 2b, tweede lid][ref2], of de plaats waar de onregelmatigheid
      heeft plaatsgevonden, aan te tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2b
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2b
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.5
    text: |-
      Indien in de in het tweede en derde lid bedoelde situaties binnen een termijn van drie jaar vanaf de datum
      waarop de overbrenging overeenkomstig [artikel 2b, eerste lid][ref1], is aangevangen, wordt vastgesteld dat
      de onregelmatigheid daadwerkelijk heeft plaatsgevonden in een andere lidstaat, is de accijns in die lidstaat
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2b
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2b
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.6
    text: |-
      Indien de accijns in een andere lidstaat verschuldigd is geworden op grond van het feit dat de onregelmatigheid
      werd geacht te hebben plaatsgevonden in die lidstaat en binnen een termijn van drie jaar vanaf de datum
      waarop de overbrenging overeenkomstig [artikel 2b, eerste lid][ref1], is aangevangen, wordt vastgesteld dat de
      onregelmatigheid daadwerkelijk heeft plaatsgevonden in Nederland, is het eerste lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2b
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2b
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.7
    text: |-
      Voor de toepassing van dit artikel wordt onder onregelmatigheid verstaan, een andere dan de in
      [artikel 2, vijfde lid][ref1], bedoelde situatie die zich tijdens een overbrenging van accijnsgoederen onder een
      accijnsschorsingsregeling voordoet en als gevolg waarvan een overbrenging of een onderdeel van een overbrenging van
      accijnsgoederen niet overeenkomstig [artikel 2b, tweede lid][ref2], is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2b
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2b
        hoofdstuk: I
        afdeling: '1'
  - number: 2c.8
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2c
  - number: 2d.1
    text: |-
      Ter zake van door particulieren voor eigen behoeften verkregen en door henzelf vanuit een andere lidstaat naar
      Nederland vervoerde accijnsgoederen wordt geen accijns verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2d
  - number: 2d.2
    text: |-
      Indien de hoeveelheid accijnsgoederen een bij ministeriële regeling vastgestelde hoeveelheid overschrijdt, worden
      de goederen geacht anders dan voor eigen behoeften voorhanden te worden gehouden, tenzij het tegendeel wordt
      aangetoond.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2d
  - number: 2d.3
    text: |-
      Als uitslag tot verbruik wordt mede aangemerkt het door de particulier, bedoeld in het eerste lid, voorhanden
      hebben van voor eigen behoeften verkregen accijnsgoederen, die hij heeft laten vervoeren vanuit een andere lidstaat
      naar Nederland.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2d
  - number: 2d.4
    text: |-
      Als uitslag tot verbruik wordt mede aangemerkt de verkrijging door particulieren van minerale oliën die in een
      andere lidstaat reeds tot verbruik zijn uitgeslagen, indien deze producten op een atypische wijze worden vervoerd
      door particulieren of voor hun rekening.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2d
  - number: 2d.5
    text: |-
      Voor de toepassing van het vierde lid wordt onder atypisch vervoer verstaan het vervoer van brandstof anders dan in
      de tank van voertuigen of in een passend reserveblik, alsmede het vervoer van vloeibare verwarmingsproducten anders
      dan in tankwagens die voor rekening van bedrijven worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2d
  - number: 2e.1
    text: |-
      Onverminderd [artikel 2f][ref1] wordt als uitslag tot verbruik mede aangemerkt het in Nederland, om aldaar te
      worden geleverd of gebruikt, voor commerciële doeleinden voorhanden hebben van accijnsgoederen die in een andere
      lidstaat reeds tot verbruik zijn uitgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2f
        hoofdstuk: I
        afdeling: '1'
  - number: 2e.2
    text: |-
      Voor de toepassing van dit artikel wordt onder voor commerciële doeleinden voorhanden hebben verstaan
      het voorhanden hebben van accijnsgoederen door anderen dan particulieren of het voorhanden hebben door
      een particulier anders dan voor eigen behoeften van door hem vervoerde accijnsgoederen als bedoeld in
      [artikel 2d, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
        hoofdstuk: I
        afdeling: '1'
  - number: 2e.3
    text: |-
      Het eerste lid vindt geen toepassing tijdens de overbrenging van de accijnsgoederen, bedoeld in het eerste lid,
      van een andere lidstaat naar Nederland, indien die overbrenging geschiedt overeenkomstig bij algemene maatregel van
      bestuur gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2e
  - number: 2e.4
    text: |-
      Bij algemene maatregel van bestuur worden, ter verzekering van de heffing, regels gesteld met betrekking tot de
      verplichtingen waaraan degene die de accijnsgoederen voor commerciële doeleinden voorhanden heeft, moet voldoen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2e
  - number: 2e.5
    text: |-
      Accijnsgoederen die aan boord van een schip of een vliegtuig dat een verbinding tussen een andere lidstaat en
      Nederland verzorgt, voorhanden worden gehouden maar die niet beschikbaar zijn voor de verkoop wanneer dit schip
      of vliegtuig zich op het grondgebied van Nederland bevindt, worden niet geacht in Nederland voor commerciële
      doeleinden voorhanden te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2e
  - number: 2e.6
    text: |-
      In afwijking van het eerste lid wordt niet als uitslag tot verbruik aangemerkt het voorhanden hebben van minerale
      oliën die in een andere lidstaat zijn uitgeslagen tot verbruik, in de normale reservoirs van bedrijfsmotorrijtuigen
      en die bestemd zijn als brandstof voor deze motorrijtuigen of in de normale reservoirs van containers voor speciale
      doeleinden en die bestemd zijn voor de werking tijdens het vervoer van specifieke systemen die tot de uitrusting
      van deze containers behoren.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2e
  - number: 2e.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2e
  - number: 2f.1
    text: |-
      Als uitslag tot verbruik wordt mede aangemerkt het kopen door een in Nederland gevestigde persoon, niet zijnde een
      vergunninghouder van een accijnsgoederenplaats, een geregistreerde geadresseerde of een zelfstandig bedrijf, van in
      een andere lidstaat reeds tot verbruik uitgeslagen accijnsgoederen, die door de in een andere lidstaat gevestigde
      verkoper of voor diens rekening direct of indirect naar Nederland worden verzonden of vervoerd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2f
  - number: 2f.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel2f
  - number: '3.1'
    text: |-
      Indien in de situaties als bedoeld in de [artikelen 2e][ref1] en [2f][ref2], de accijnsgoederen tijdens het vervoer
      in Nederland of in een andere lidstaat dan de lidstaat waar de accijnsgoederen tot verbruik zijn uitgeslagen,
      algeheel vernietigd of onherstelbaar verloren gegaan zijn door een oorzaak die met de aard van de goederen verband
      houdt, dan wel door niet te voorziene omstandigheden of overmacht, of ingevolge instructies van de inspecteur
      dan wel, indien van toepassing, de bevoegde autoriteiten van de andere lidstaat, is geen sprake van uitslag tot
      verbruik als bedoeld in de artikelen 2e en 2f.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2f
        hoofdstuk: I
        afdeling: '1'
  - number: '3.2'
    text: |-
      Voor de toepassing van dit artikel worden goederen geacht totaal vernietigd of onherstelbaar verloren te zijn
      wanneer zij als accijnsgoed onbruikbaar zijn geworden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel3
  - number: '3.3'
    text: |-
      De algehele vernietiging of het onherstelbare verlies van de accijnsgoederen, bedoeld in het eerste lid, wordt
      aangetoond ten genoegen van de inspecteur dan wel, indien van toepassing, de bevoegde autoriteiten van de lidstaat
      waar de algehele vernietiging of het onherstelbare verlies zich heeft voorgedaan of, indien niet is vast te stellen
      waar het verlies zich heeft voorgedaan, van de lidstaat waar het verlies is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel3
  - number: '3.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel3
  - number: '4.1'
    text: |-
      Indien tijdens een overbrenging van accijnsgoederen overeenkomstig [artikel 2e][ref1] of [2f][ref2], in Nederland
      een onregelmatigheid heeft plaatsgevonden, is artikel 2e, eerste lid, onderscheidenlijk artikel 2f, eerste lid,
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2f
        hoofdstuk: I
        afdeling: '1'
  - number: '4.2'
    text: |-
      Indien tijdens een overbrenging van accijnsgoederen overeenkomstig [artikel 2e][ref1] of [2f][ref2], in Nederland
      een onregelmatigheid is geconstateerd, en er niet kan worden vastgesteld waar de onregelmatigheid plaatsvond, wordt
      deze geacht te hebben plaatsgevonden in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 2f
        hoofdstuk: I
        afdeling: '1'
  - number: '4.3'
    text: |-
      Indien in de in het tweede lid bedoelde situatie binnen een termijn van drie jaar vanaf de datum waarop de
      accijnsgoederen zijn verkregen, wordt vastgesteld dat de onregelmatigheid daadwerkelijk heeft plaatsgevonden in een
      andere lidstaat, is de accijns in die lidstaat verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel4
  - number: '4.4'
    text: |-
      Indien de accijns in een andere lidstaat verschuldigd is geworden op grond van het feit dat de onregelmatigheid
      werd geacht te hebben plaatsgevonden in die lidstaat en binnen een termijn van drie jaar vanaf de datum waarop de
      accijnsgoederen zijn verkregen, wordt vastgesteld dat de onregelmatigheid daadwerkelijk heeft plaatsgevonden in
      Nederland, is het eerste lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel4
  - number: '4.5'
    text: |-
      Voor de toepassing van dit artikel wordt onder onregelmatigheid verstaan een niet onder [artikel 3][ref1] vallende
      situatie die zich tijdens een overbrenging van accijnsgoederen als bedoeld in het eerste lid voordoet en als gevolg
      waarvan een overbrenging of een onderdeel van een overbrenging van accijnsgoederen niet op regelmatige wijze is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel3
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '3'
        hoofdstuk: I
        afdeling: '1'
  - number: '4.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel4
  - number: '5.1'
    text: 'Het is niet toegestaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.1.a
    text: |-
      een accijnsgoed te vervaardigen buiten een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.1.b
    text: een accijnsgoed voorhanden te hebben dat niet overeenkomstig de bepalingen van deze wet in de heffing is betrokken.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: '5.2'
    text: |-
      Het verbod als bedoeld in het eerste lid, onderdeel a, is niet van toepassing indien
      het vervaardigen geschiedt overeenkomstig de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '5.3'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt ontheffing verleend van de in
      het eerste lid bedoelde verboden voor:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.3.a
    text: |-
      het vervaardigen van accijnsgoederen uit andere accijnsgoederen, waarbij het accijnsbedrag dat de eerstbedoelde
      accijnsgoederen vertegenwoordigen niet hoger is dan het accijnsbedrag dat de accijnsgoederen vertegenwoordigen
      waaruit zij zijn vervaardigd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.3.b
    text: |-
      het vervaardigen van accijnsgoederen waarvoor een vrijstelling van accijns geldt op de voet van [artikel 65][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
        hoofdstuk: V
        afdeling: '1'
  - number: 5.3.c
    text: |-
      het thuis vervaardigen van bier en wijn door particulieren, voor zover die goederen worden aangewend voor eigen
      gebruik;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.3.d
    text: |-
      het vervaardigen en het voorhanden hebben van andere minerale oliën dan bedoeld in het vierde lid, mits
      deze minerale oliën niet op grond van [artikel 28][ref1] worden gelijkgesteld met minerale oliën waarvoor in
      [artikel 27][ref2] een tarief is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '28'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '5.4'
    text: 'De in het derde lid, onderdeel d, bedoelde minerale oliën zijn de produkten van de GN-codes:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.a
    text: |-
      1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.b
    text: 2707 10, 2707 20, 2707 30 en 2707 50;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.c
    text: 2710 11 tot en met 2710 19 69; codes 2710 11 21, 2710 11 25 en 2710 19 29, indien deze in bulk worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.d
    text: 2711, met uitzondering van de producten van de GN-codes 2711 11, 2711 21 en 2711 29;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.e
    text: 2901 10;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.f
    text: 2902 20, 2902 30, 2902 41, 2902 42, 2902 43 en 2902 44;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.g
    text: |-
      2905 11 00, die niet langs synthetische weg zijn verkregen en die zijn bestemd om te worden gebruikt als
      motorbrandstof of als brandstof voor verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.h
    text: 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: 5.4.i
    text: 3824 90 99, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor verwarming.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel5
  - number: '6'
    text: 'Onder bier wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel6
  - number: 6.a
    text: elk produkt van GN-code 2203; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel6
  - number: 6.b
    text: |-
      elk produkt van GN-code 2206 dat een mengsel van bier als bedoeld in onderdeel *a* en niet-alcoholhoudende dranken
      bevat;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel6
  - number: '7.1'
    text: 'De accijns bedraagt per hectoliter voor bier met een extractgehalte, uitgedrukt in percenten Plato, van:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: 7.1.a
    text: minder dan 7 € 8,83;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: 7.1.b
    text: 7 tot 11 € 28,49;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: 7.1.c
    text: 11 tot 15 € 37,96;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: 7.1.d
    text: 15 en meer € 47,48.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.2'
    text: |-
      Met betrekking tot bier als bedoeld in [artikel 6, onderdeel b][ref1], met een alcoholgehalte van niet meer dan
      1,2%vol wordt het tarief van het eerste lid, onderdeel *a*, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel6
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.3'
    text: |-
      In afwijking in zoverre van het eerste lid bedraagt de accijns voor bier dat is vervaardigd in een
      accijnsgoederenplaats waar in het voorafgaande kalenderjaar niet meer dan 200 000 hl bier is vervaardigd 92,5/100
      deel van de in de onderdelen b, c en d vermelde bedragen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.4'
    text: 'Het derde lid vindt slechts toepassing met betrekking tot een accijnsgoederenplaats die:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: 7.4.a
    text: juridisch en economisch onafhankelijk is van een andere accijnsgoederenplaats waar bier wordt vervaardigd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: 7.4.b
    text: |-
      gebruik maakt van installaties die in fysiek opzicht losstaan van die van een andere accijnsgoederenplaats waar
      bier wordt vervaardigd; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: 7.4.c
    text: |-
      geen bier vervaardigt onder licentie, tenzij het onder licentie vervaardigde bier slechts een klein gedeelte van de
      totale produktie betreft, met dien verstande dat het derde lid geen toepassing vindt met betrekking tot het onder
      licentie vervaardigde bier.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.5'
    text: |-
      Voor de toepassing van het derde en vierde lid wordt een samenwerkingsverband van twee of meer
      accijnsgoederenplaatsen waar gezamenlijk in het voorafgaande kalenderjaar niet meer dan 200 000 hl bier is
      vervaardigd, aangemerkt als één accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.6'
    text: |-
      Onder extractgehalte wordt verstaan het gehalte van de in de stamwort opgeloste niet-vluchtige stoffen, vermeerderd
      met het gehalte van de na de gisting aan het bier toegevoegde stoffen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.7'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de toepassing van het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.8'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het extractgehalte.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.9'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt, met inachtneming van bij ministeriële regeling te
      stellen regels, het volume van bier in geconcentreerde vorm herleid tot het volume van voor gebruik gereed bier.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '7.10'
    text: Dit artikel is van overeenkomstige toepassing op bier dat afkomstig is uit een brouwerij buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel7
  - number: '8'
    text: Wijn wordt onderscheiden in niet-mousserende wijn en mousserende wijn.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel8
  - number: 8a.1
    text: |-
      Onder niet-mousserende wijn worden verstaan alle produkten van GN-codes 2204 en 2205, met uitzondering van
      mousserende wijn als bedoeld in [artikel 9, eerste lid][ref1], met:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel9
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 8a.1.a
    text: |-
      een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 15%vol, voor zover de alcohol in het eindprodukt
      volledig door gisting is verkregen; of
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel8a
  - number: 8a.1.b
    text: |-
      een alcoholgehalte van meer dan 15%vol maar niet meer dan 18%vol, voor zover zij zonder enige verrijking zijn
      geproduceerd en de alcohol in het eindprodukt volledig door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel8a
  - number: 8a.2
    text: |-
      Onder niet-mousserende wijn worden mede verstaan alle niet in het eerste lid bedoelde produkten van GN-codes
      2204 en 2205, alsmede produkten van GN-code 2206, die ingevolge [artikel 6][ref1] niet als bier en ingevolge
      [artikel 9, tweede lid][ref2], niet als mousserende wijn worden aangemerkt, met:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel9
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 8a.2.a
    text: een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 10%vol; of
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel8a
  - number: 8a.2.b
    text: |-
      een alcoholgehalte van meer dan 10%vol maar niet meer dan 15%vol, voor zover de alcohol in het produkt volledig
      door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel8a
  - number: '9.1'
    text: 'Onder mousserende wijn worden verstaan alle produkten van GN-codes 2204 10, 2204 21 10, 2204 29 10 en 2205, die:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel9
  - number: 9.1.a
    text: |-
      zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel9
  - number: 9.1.b
    text: |-
      een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 15%vol voor zover de alcohol in het eindprodukt
      volledig door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel9
  - number: '9.2'
    text: |-
      Onder mousserende wijn worden mede verstaan alle produkten van GN-code 2206 00 91, alsmede de niet in het eerste
      lid genoemde produkten van GN-codes 2204 10, 2204 21 10, 2204 29 10 en 2205, die:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel9
  - number: 9.2.a
    text: |-
      zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel9
  - number: 9.2.b
    text: |-
      een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 13%vol, dan wel een alcoholgehalte hebben
      van meer dan 13%vol maar niet meer dan 15%vol voor zover de alcohol in het eindprodukt volledig door gisting is
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel9
  - number: '10.1'
    text: 'De accijns bedraagt per hectoliter voor niet-mousserende wijn met een alcoholgehalte van:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel10
  - number: 10.1.a
    text: niet meer dan 8,5% vol € 44,18;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel10
  - number: 10.1.b
    text: meer dan 8,5% vol, maar niet meer dan 15% vol € 88,36;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel10
  - number: 10.1.c
    text: meer dan 15% vol € 129,81.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel10
  - number: '10.2'
    text: 'De accijns bedraagt per hectoliter voor mousserende wijn met een alcoholgehalte van:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel10
  - number: 10.2.a
    text: niet meer dan 8,5% vol € 48,25;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel10
  - number: 10.2.b
    text: meer dan 8,5% vol € 254,41.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel10
  - number: 11a
    text: Tussenprodukten worden onderscheiden in niet-mousserende tussenprodukten en mousserende tussenprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel11a
  - number: 11b
    text: |-
      Onder niet-mousserende tussenprodukten worden verstaan alle niet als bier of wijn aan te merken produkten van GN-
      codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die ingevolge
      [artikel 11][ref1] niet als mousserende tussenprodukten worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel11c
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 11c
        hoofdstuk: II
        afdeling: 2a
  - number: 11c
    text: |-
      Onder mousserende tussenprodukten worden verstaan alle niet als bier of wijn aan te merken produkten van GN-codes
      2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die zijn verpakt in
      flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel een overdruk van 3
      bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel11c
  - number: 11d.1
    text: 'De accijns bedraagt per hectoliter voor niet-mousserende tussenproducten met een alcoholgehalte van:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel11d
  - number: 11d.1.a
    text: niet meer dan 15% vol € 105,98;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel11d
  - number: 11d.1.b
    text: meer dan 15% vol € 149,29.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel11d
  - number: 11d.2
    text: De accijns bedraagt per hectoliter voor mousserende tussenproducten € 254,41.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel11d
  - number: '12.1'
    text: 'Onder overige alcoholhoudende produkten worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel12
  - number: 12.1.a
    text: |-
      alle produkten van GN-codes 2207 en 2208 met een alcoholgehalte van meer dan 1,2%vol, ook wanneer deze produkten
      bestanddeel zijn van een produkt van een GN-code uit een ander hoofdstuk van de gecombineerde nomenclatuur;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel12
  - number: 12.1.b
    text: produkten van GN-codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 22%vol.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel12
  - number: '12.2'
    text: |-
      Onder overige alcoholhoudende produkten worden mede verstaan gedistilleerde dranken als bedoeld in het eerste lid,
      wanneer deze dranken andere produkten, al dan niet in oplossing, bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel12
  - number: '13'
    text: |-
      De accijns bedraagt voor overige alcoholhoudende produkten per hectoliter bij een temperatuur van 20°C per volume-
      percent alcohol € 16,86.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel13
  - number: '14'
    text: |-
      Voor de toepassing van [artikel 13][ref1] wordt het volume van overige alcoholhoudende produkten die bestaan uit
      een vloeistof waarin zich bestanddelen in vaste vorm bevinden, gesteld op het volume van het gehele produkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel13
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '13'
        hoofdstuk: II
        afdeling: '3'
  - number: '25.1'
    text: 'Onder minerale oliën worden verstaan de producten van de GN-codes:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.a
    text: |-
      1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.b
    text: 2706 tot en met 2710;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.c
    text: 2711, met uitzondering van aardgas;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.d
    text: 2712 tot en met 2715;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.e
    text: 2901 en 2902;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.f
    text: |-
      2905 11 00, die niet langs synthetische weg zijn verkregen en zijn bestemd om te worden gebruikt als motorbrandstof
      of als brandstof voor verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.g
    text: 3403;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.h
    text: 3811;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.i
    text: 3817;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.1.j
    text: 3824 90 99, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor verwarming.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: '25.2'
    text: 'Als minerale oliën worden mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.2.a
    text: |-
      andere produkten dan minerale oliën als bedoeld in het eerste lid, die zijn bestemd voor gebruik, worden aangeboden
      voor verkoop of worden gebruikt als motorbrandstof, als additief of als vulstof in motorbrandstoffen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: 25.2.b
    text: |-
      andere koolwaterstoffen dan bedoeld in het eerste lid of in onderdeel *a*, die zijn bestemd voor gebruik, worden
      aangeboden voor verkoop of worden gebruikt voor verwarmingsdoeleinden, met uitzondering van steenkool, bruinkool,
      turf, andere soortgelijke vaste koolwaterstoffen en aardgas.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel25
  - number: '26.1'
    text: |-
      Voor de toepassing van het tarief worden minerale oliën onderscheiden in lichte olie, halfzware olie, gasolie,
      zware stookolie, vloeibaar gemaakt petroleumgas en methaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '26.2'
    text: |-
      Lichte olie wordt onderscheiden in gelode lichte olie en ongelode lichte olie. Onder gelode lichte olie worden
      verstaan de producten van GN-codes 2710 11 31, 2710 11 51 en 2710 11 59. Onder ongelode lichte olie worden verstaan
      de producten van GN-codes 2710 11 41, 2710 11 45 en 2710 11 49.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '26.3'
    text: Onder halfzware olie worden verstaan de producten van GN-codes 2710 19 21 en 2710 19 25.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '26.4'
    text: Onder gasolie worden verstaan de producten van GN-codes 2710 19 41, 2710 19 45 en 2710 19 49.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '26.5'
    text: Onder zware stookolie worden verstaan de producten van GN-codes 2710 19 61 tot en met 2710 19 69.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '26.6'
    text: Onder vloeibaar gemaakt petroleumgas worden verstaan de produkten van GN-codes 2711 12 11 tot en met 2711 19 00.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '26.7'
    text: Onder methaan worden verstaan de produkten van GN-code 2711 29 00.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '26.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het bepalen van het loodgehalte van
      lichte olie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel26
  - number: '27.1'
    text: 'De accijns bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27
  - number: 27.1.a
    text: |-
      lichte olie, per 1000 L bij een temperatuur van 15°C € 857,39 indien het gelode lichte olie betreft en € 769,90
      indien het ongelode lichte olie betreft;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27
  - number: 27.1.b
    text: halfzware olie en gasolie, per 1000 L bij een temperatuur van 15°C € 484,47;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27
  - number: 27.1.c
    text: zware stookolie, per 1 000 kg € 36,33;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27
  - number: 27.1.d
    text: vloeibaar gemaakt petroleumgas, per 1000 kg € 336,34;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27
  - number: 27.1.e
    text: methaan nihil.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27
  - number: '27.2'
    text: |-
      Voor de toepassing van het tarief als bedoeld in het eerste lid, onderdelen a en b, worden bij ministeriële
      regeling regels gesteld met betrekking tot de herleiding van de actuele hoeveelheden minerale oliën naar
      hoeveelheden bij een temperatuur van 15°C.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27
  - number: 27a
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige
      toepassing op de in de [artikelen 27, eerste lid][ref3], [71b, tweede lid][ref4], [71c, tweede lid][ref5],
      [71e, tweede lid][ref6], en [71g, tweede lid][ref7], vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel71b
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel71c
      [ref6]: https://wetten.overheid.nl/BWBR0005251#Artikel71e
      [ref7]: https://wetten.overheid.nl/BWBR0005251#Artikel71g
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: 71b
        hoofdstuk: V
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: 71c
        hoofdstuk: V
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005251
        artikel: 71e
        hoofdstuk: V
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0005251
        artikel: 71g
        hoofdstuk: V
        afdeling: '2'
  - number: '28.1'
    text: |-
      Andere minerale oliën dan die waarvoor in [artikel 27, eerste lid][ref1], een accijnstarief is vermeld, worden,
      indien zij zijn bestemd voor gebruik, worden aangeboden voor verkoop of worden gebruikt als brandstof voor
      verwarming of als motorbrandstof, aan de accijns onderworpen naar het ingevolge artikel 27, eerste lid, voor de
      gelijkwaardige brandstof of motorbrandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.2'
    text: |-
      Onverminderd het eerste lid worden minerale oliën van GN-codes 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90
      00 voor de toepassing van het tarief gelijkgesteld met de motorbrandstof waaraan zij bestemd zijn te worden
      toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel28
  - number: '28.3'
    text: |-
      Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel a][ref1], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste lid][ref2], voor de gelijkwaardige motorbrandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.4'
    text: |-
      Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel b][ref1], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste lid][ref2], voor de gelijkwaardige brandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.5'
    text: |-
      Minerale oliën die kunnen worden gelijkgesteld met meer dan één soort minerale olie worden voor de toepassing
      van het tarief gelijkgesteld met de soort minerale olie die van de desbetreffende soorten het eerst is vermeld in
      [artikel 26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.6'
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op minerale oliën van GN-codes 3811 11 10, 3811 11 90, 3811 19 00
      en 3811 90 00 die aan meer dan een soort motorbrandstof kunnen worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel28
  - number: '29'
    text: Onder tabaksprodukten wordt verstaan tot verbruik bereide tabak in de vorm van sigaren, sigaretten en rooktabak.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel29
  - number: '30.1'
    text: |-
      Onder sigaren worden verstaan de volgende producten, indien zij geschikt zijn om en, gelet op hun kenmerken en de
      normale verwachtingen van de consument, uitsluitend bestemd zijn om als zodanig te worden gerookt:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel30
  - number: 30.1.a
    text: tabaksrolletjes met een dekblad van natuurlijke tabak;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel30
  - number: 30.1.b
    text: |-
      tabaksrolletjes bestaande uit een gebroken melange, met een dekblad van gereconstitueerde tabak dat de normale
      kleur heeft van een sigaar en het product volledig omhult, in voorkomend geval met inbegrip van het filter, doch
      met uitzondering van het mondstuk, en waarvan het gewicht per stuk, zonder filter of mondstuk, ten minste 2,3 gram
      en niet meer dan 10 gram bedraagt en de omtrek over ten minste een derde van de lengte 34 mm of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel30
  - number: '30.2'
    text: |-
      Als sigaren worden mede aangemerkt producten die gedeeltelijk uit andere stoffen dan tabak bestaan, doch overigens
      voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel30
  - number: '31.1'
    text: |-
      Onder sigaretten worden verstaan niet als sigaren aan te merken tabaksrolletjes die geschikt zijn om als zodanig te
      worden gerookt, alsmede tabaksrolletjes die door middel van een eenvoudige niet-industriële handeling in een huls
      van sigarettenpapier worden geschoven of met sigarettenpapier worden omhuld.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel31
  - number: '31.2'
    text: |-
      Als sigaretten worden mede aangemerkt produkten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel31
  - number: '32.1'
    text: Onder rooktabak wordt verstaan niet als sigaren of als sigaretten aan te merken voor roken geschikte tabak.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel32
  - number: '32.2'
    text: |-
      Als rooktabak worden mede aangemerkt produkten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel32
  - number: '35.1'
    text: 'De accijns bedraagt in percenten van de kleinhandelsprijs voor:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel35
  - number: 35.1.a
    text: sigaren 5;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel35
  - number: 35.1.b
    text: |-
      sigaretten 0,83 benevens per 1000 stuks € 179,07, met dien verstande dat het totale bedrag van de accijns per 1000
      stuks ten minste € 181,58 bedraagt;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel35
  - number: 35.1.c
    text: |-
      rooktabak 4,60 benevens per kilogram € 78,68, met dien verstande dat het totale bedrag van de accijns per kilogram
      ten minste € 99,25 bedraagt.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel35
  - number: '35.2'
    text: |-
      Onder de kleinhandelsprijs van een tabaksprodukt wordt verstaan de prijs waarvoor dat produkt aan anderen dan
      wederverkopers wordt verkocht, met inbegrip van alle belastingen en de kosten van de verpakking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel35
  - number: '35.3'
    text: |-
      Voor de berekening van de accijns wordt voor tabaksprodukten die worden verbruikt binnen een accijnsgoederenplaats
      voor tabaksprodukten de kleinhandelsprijs gesteld op die van gelijke dan wel soortgelijke produkten die worden
      verbruikt buiten de accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel35
  - number: '35.4'
    text: |-
      Voor de berekening van de accijns wordt een tabaksrolletje als bedoeld in [artikel 31][ref1] aangemerkt als twee
      sigaretten wanneer het, zonder filter of mondstuk, meer dan 8 cm doch niet meer dan 11 cm lang is, en als drie
      sigaretten wanneer het, zonder filter of mondstuk, meer dan 11 cm doch niet meer dan 14 cm lang is, enzovoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel31
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '31'
        hoofdstuk: II
        afdeling: '7'
  - number: '36.1'
    text: |-
      Bij ministeriële regeling worden de in [artikel 35, eerste lid, onderdelen b en c][ref1], vermelde tarieven
      gewijzigd bij wijziging van de gewogen gemiddelde kleinhandelsprijs van sigaretten onderscheidenlijk rooktabak.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
  - number: '36.2'
    text: |-
      Indien bij wijziging van de tarieven bedoeld in het eerste lid de in
      [artikel 35, eerste lid, onderdelen b en c][ref1] opgenomen tarieven lager of gelijk zijn aan de voor de wijziging
      geldende tarieven blijft het eerste lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
  - number: '36.3'
    text: |-
      De gewogen gemiddelde kleinhandelsprijs is gelijk aan de op basis van de kleinhandelsprijs berekende totale waarde
      van alle tot verbruik uitgeslagen sigaretten respectievelijk rooktabak, gedeeld door de totale hoeveelheid tot
      verbruik uitgeslagen sigaretten respectievelijk rooktabak.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
  - number: '36.4'
    text: |-
      De gewogen gemiddelde kleinhandelsprijs wordt uiterlijk op 15 januari van elk jaar gepubliceerd op basis van alle
      tot verbruik uitgeslagen sigaretten respectievelijk rooktabak in de periode van 1 oktober tot en met 30 september
      voorafgaand aan de datum van publicatie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
  - number: '36.5'
    text: |-
      Een wijziging overeenkomstig het eerste lid treedt in werking met ingang van 1 april van het jaar volgend op het
      jaar waarop de nieuwe vaststelling van de gewogen gemiddelde kleinhandelsprijs is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
  - number: '36.6'
    text: |-
      De wijziging van de tarieven voor sigaretten respectievelijk rooktabak geschiedt zodanig dat het tarief van het
      specifieke gedeelte van de accijns voor de gewijzigde gewogen gemiddelde kleinhandelsprijs wordt gebracht op 76,5
      percent respectievelijk 70 percent van de som van het bedrag van de accijns en het bedrag van de omzetbelasting van
      die gewogen gemiddelde kleinhandelsprijs.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
  - number: '36.7'
    text: |-
      Bij de wijziging van de tarieven voor sigaretten respectievelijk rooktabak bedraagt het totale bedrag van de
      accijns van sigaretten respectievelijk rooktabak van de gewogen gemiddelde kleinhandelsprijs na de wijziging ten
      minste 60 percent respectievelijk 52 percent van die gewogen gemiddelde kleinhandelsprijs.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
  - number: '36.8'
    text: |-
      De wijziging van de bedragen die in [artikel 35, eerste lid, onderdelen b en c][ref1], zijn opgenomen als de ten
      minste te betalen accijns voor 1 000 stuks sigaretten respectievelijk 1 000 gram rooktabak, geschiedt zodanig
      dat deze accijns na de wijziging van de tarieven gelijk is aan het totale bedrag van de accijns voor 1 000 stuks
      sigaretten respectievelijk 1 000 gram rooktabak van de gewogen gemiddelde kleinhandelsprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
  - number: '36.9'
    text: |-
      Bij de wijziging wordt het tarief van het percentuele gedeelte van de accijns op honderdsten van een percent
      afgerond.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel36
  - number: '37.1'
    text: 'Voor de toepassing van deze wet en de daarop gebaseerde regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel37
  - number: 37.1.a
    text: 'alcoholgehalte van een accijnsgoed: het aantal volumepercenten alcohol daarin bij een temperatuur van 20 °C;'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel37
  - number: 37.1.b
    text: |-
      alcohol: ethanol en de alcoholen die bij het vervaardigen van ethanol zijn ontstaan voor zover zij niet zijn
      afgescheiden van de ethanol.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel37
  - number: '37.2'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het alcoholgehalte.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel37
  - number: '38'
    text: |-
      Bij ministeriële regeling kan met betrekking tot bier, wijn, tussenprodukten, overige alcoholhoudende produkten
      en tabaksprodukten in kleinhandelsverpakking worden bepaald dat voor de berekening van de accijns het volume of de
      massa van die goederen dat is vermeld op die verpakking in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel38
  - number: '39'
    text: |-
      Een plaats kan alleen als accijnsgoederenplaats worden gebruikt indien daartoe een vergunning is verstrekt door
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel39
  - number: '40.1'
    text: 'Als accijnsgoederenplaats kan in aanmerking komen een plaats waar:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel40
  - number: 40.1.a
    text: accijnsgoederen worden vervaardigd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel40
  - number: 40.1.b
    text: |-
      geen accijnsgoederen worden vervaardigd maar die dient voor de opslag van accijnsgoederen, indien de hoeveelheid
      accijnsgoederen die gemiddeld over een jaar voorhanden is meer bedraagt dan een bij ministeriële regeling per soort
      accijnsgoed vast te stellen hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel40
  - number: '40.2'
    text: |-
      Een plaats van waaruit accijnsgoederen worden geleverd aan een verbruiker kan niet in aanmerking komen als
      accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel40
  - number: '40.3'
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen kunnen plaatsen in afwijking van het bepaalde in het eerste en
      in het tweede lid in aanmerking komen als accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel40
  - number: '41.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan met
      betrekking tot een accijnsgoederenplaats moet worden voldaan ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel41
  - number: 41.1.a
    text: de administratie en de administratieve organisatie;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel41
  - number: 41.1.b
    text: de locatie en de inrichting; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel41
  - number: 41.1.c
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel41
  - number: '41.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel41
  - number: '42.1'
    text: 'In het verzoek om een vergunning voor een accijnsgoederenplaats worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42
  - number: 42.1.a
    text: de soort of de soorten accijnsgoederen waarvoor de accijnsgoederenplaats is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42
  - number: 42.1.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting in de accijnsgoederenplaats per
      jaar zal worden vervaardigd dan wel gemiddeld over een jaar zonder verschuldigdheid van accijns voorhanden zal
      zijn;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42
  - number: 42.1.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42
  - number: 42.1.d
    text: |-
      de administratie en de administratieve organisatie met betrekking tot de als accijnsgoederenplaats aan te merken
      plaats; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42
  - number: 42.1.e
    text: de locatie en de inrichting van de als accijnsgoederenplaats aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42
  - number: '42.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die het verzoek moet
      bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42
  - number: 42a.1
    text: |-
      In afwijking van [artikel 40, eerste lid][ref1], kan, indien degene die een vergunning voor een
      accijnsgoederenplaats wil verkrijgen niet beschikt over een plaats waar accijnsgoederen worden vervaardigd dan
      wel opgeslagen, een verzoek om een vergunning voor een accijnsgoederenplaats door de inspecteur worden toegewezen,
      indien deze persoon in Nederland is gevestigd en in de uitoefening van zijn bedrijf optreedt als:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
        hoofdstuk: III
        afdeling: '1'
  - number: 42a.1.a
    text: handelaar in minerale oliën, maar de door hem gekochte minerale oliën niet zelf in opslag neemt;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.1.b
    text: |-
      tussenpersoon ten behoeve van vergunninghouders van een accijnsgoederenplaats voor minerale oliën waar minerale
      oliën worden vervaardigd dan wel opgeslagen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.1.c
    text: |-
      bunkerhandelaar in minerale oliën, die de door hem gekochte minerale oliën uitsluitend aflevert aan boord van
      schepen in het kader van de bevoorrading van schepen, bedoeld in [artikel 66, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
  - number: 42a.2
    text: |-
      Bij algemene maatregel van bestuur worden voorwaarden en beperkingen gesteld waaronder de vergunning, bedoeld in
      het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.3
    text: 'In het verzoek om een vergunning, bedoeld in het eerste lid, worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.3.a
    text: de soort of de soorten minerale oliën waarvoor de accijnsgoederenplaats zal worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.3.b
    text: |-
      de hoeveelheid minerale oliën, onderscheiden naar soort, die naar verwachting via de accijnsgoederenplaats per jaar
      zal worden verhandeld of waarvoor als tussenpersoon zal worden opgetreden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.3.c
    text: de persoon op wiens naam de vergunning moet worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.3.d
    text: de administratie en administratieve organisatie van de persoon, bedoeld in onderdeel c.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: 42a.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel42a
  - number: '43.1'
    text: |-
      Een verzoek om een vergunning voor een accijnsgoederenplaats wordt door de inspecteur toegewezen tenzij hij
      gegronde redenen heeft om aan te nemen dat niet zal worden voldaan aan het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel43
  - number: '43.2'
    text: |-
      Een verzoek om een vergunning voor een accijnsgoederenplaats kan worden geweigerd aan degene die in de vijf aan het
      verzoek voorafgaande jaren onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake
      de accijns.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel43
  - number: '44.1'
    text: |-
      De vergunning vermeldt voor welke soort of voor welke soorten accijnsgoederen de accijnsgoederenplaats als zodanig
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel44
  - number: '44.2'
    text: |-
      In de vergunning bepaalt de inspecteur zo nodig nader op welke wijze aan de bij of krachtens deze wet gestelde
      voorwaarden moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel44
  - number: '44.3'
    text: |-
      De inspecteur kan in de vergunning nadere voorwaarden opnemen ter verzekering van een juiste toepassing van het
      bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel44
  - number: '45.1'
    text: De inspecteur kan de in de vergunning opgenomen voorwaarden aanpassen ter verzekering van de heffing.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel45
  - number: '45.2'
    text: |-
      Alvorens over te gaan tot aanpassing van de voorwaarden deelt de inspecteur de vergunninghouder mee welke
      omstandigheden naar zijn oordeel de door hem aan te geven aanpassing van de voorwaarden rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel45
  - number: '46'
    text: |-
      De vergunninghouder die een aanpassing van de in de vergunning opgenomen voorwaarden wenst, dient daartoe een
      verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel46
  - number: '47'
    text: |-
      Degene die een accijnsgoederenplaats wil overnemen, dient gezamenlijk met de vergunninghouder een verzoek in bij
      de inspecteur tot een zodanige aanpassing van de vergunning voor die accijnsgoederenplaats dat hij voor alle uit de
      vergunning voortvloeiende rechten en verplichtingen in de plaats treedt van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel47
  - number: '48'
    text: 'De vergunning voor een accijnsgoederenplaats kan door de inspecteur worden ingetrokken ingeval:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: 48.a
    text: niet wordt voldaan aan de in de vergunning opgenomen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: 48.b
    text: geen of niet voldoende zekerheid is gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: 48.c
    text: misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: 48.d
    text: |-
      de vergunninghouder onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake de
      accijns;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: 48.e
    text: |-
      de vergunninghouder in staat van faillissement verkeert of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: 48.f
    text: de vergunninghouder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: 48.g
    text: de vergunning gedurende een aaneengesloten periode van 12 maanden niet is gebruikt.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel48
  - number: '49.1'
    text: |-
      Het intrekken van een vergunning ingevolge [artikel 48, onderdeel a, b of g][ref1], kan niet eerder geschieden dan
      één maand nadat de inspecteur de vergunninghouder schriftelijk in kennis heeft gesteld van de omstandigheden die
      naar zijn oordeel het intrekken rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel48
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
  - number: '49.2'
    text: |-
      Het intrekken van een vergunning ingevolge [artikel 48, onderdeel c, d, e of f][ref1], kan onmiddellijk geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel48
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
  - number: '50.1'
    text: |-
      Het verlenen, het aanpassen en het intrekken van een vergunning voor een accijnsgoederenplaats alsmede het afwijzen
      van een verzoek daartoe geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50
  - number: '50.2'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het derde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het tweede lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50
  - number: 50a.1
    text: |-
      Een onderneming wordt alleen als geregistreerde geadresseerde aangemerkt indien daartoe een vergunning is verstrekt
      door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50a
  - number: 50a.2
    text: |-
      Een vergunning als geregistreerde geadresseerde wordt met betrekking tot tabaksproducten uitsluitend verleend,
      indien deze producten in een andere lidstaat van Nederlandse accijnszegels zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50a
  - number: 50a.3
    text: |-
      Voor een geregistreerde geadresseerde die slechts incidenteel accijnsgoederen ontvangt, wordt de vergunning,
      bedoeld in het eerste lid, verleend voor een welomschreven hoeveelheid accijnsgoederen, één afzender en een
      welomschreven tijdvak. De inspecteur kan de vergunning beperken tot één overbrenging.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50a
  - number: 50a.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50a
  - number: 50b.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan een
      geregistreerde geadresseerde moet voldoen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50b
  - number: 50b.1.a
    text: de administratie; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50b
  - number: 50b.1.b
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50b
  - number: 50b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50b
  - number: 50c.1
    text: |-
      Degene die een vergunning als geregistreerde geadresseerde wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50c.2
    text: 'In het verzoek worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50c.2.a
    text: de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50c.2.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de geregistreerde geadresseerde
      per jaar uit een andere lidstaat zal worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50c.2.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50c.2.d
    text: de administratie van de desbetreffende accijnsgoederen; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50c.2.e
    text: de locatie van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50c
  - number: 50d.1
    text: |-
      Een onderneming wordt alleen als geregistreerde afzender aangemerkt indien daartoe een vergunning is verstrekt door
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.2
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan een
      geregistreerde afzender moet voldoen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.2.a
    text: de administratie; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.2.b
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.3
    text: |-
      Degene die een vergunning voor een geregistreerde afzender wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.4
    text: 'In het verzoek worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.4.a
    text: de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.4.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de geregistreerde afzender per
      jaar zal worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.4.c
    text: de persoon op wiens naam de vergunning moet worden gesteld; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.4.d
    text: de administratie van de desbetreffende accijnsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50d.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50d
  - number: 50e
    text: |-
      De[ artikelen 43][ref1], [44][ref2], [45][ref3], [46][ref4], [48][ref5], [49][ref6] en [50][ref7] zijn van
      overeenkomstige toepassing met betrekking tot de in de[ artikelen 50][ref8] en [50][ref9] bedoelde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0005251#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0005251#Artikel50
      [ref8]: https://wetten.overheid.nl/BWBR0005251#Artikel50a
      [ref9]: https://wetten.overheid.nl/BWBR0005251#Artikel50d
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel50e
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '44'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '45'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '46'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005251
        artikel: '49'
        hoofdstuk: III
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0005251
        artikel: '50'
