  - number: '51.1'
    text: 'De accijns wordt geheven van:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
  - number: 51.1.a
    text: |-
      bij toepassing van [artikel 2, eerste lid, onderdeel a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.a.1°
    text: |-
      de vergunninghouder van de accijnsgoederenplaats, de geregistreerde geadresseerde of enig andere persoon
      die de accijnsgoederen aan de accijnsschorsingsregeling onttrekt of voor wiens rekening de accijnsgoederen
      aan de accijnsschorsingsregeling worden onttrokken en, in geval van onregelmatige onttrekking aan de
      accijnsgoederenplaats, enig andere persoon die bij die onttrekking betrokken is geweest;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
  - number: 51.1.a.2°
    text: |-
      in geval van een onregelmatigheid tijdens een overbrenging van accijnsgoederen onder een accijnsschorsingsregeling
      in de zin van [artikel 2c, eerste, tweede en derde lid][ref1]: de vergunninghouder van de accijnsgoederenplaats,
      de vergunninghouder van het belastingentrepot, de geregistreerde afzender, de vervoerder of de eigenaar van de
      accijnsgoederen, bedoeld in [artikel 56, derde lid][ref2], of enig andere persoon die ingevolge de wettelijke
      bepalingen van een andere lidstaat zekerheid heeft gesteld en alle personen die bij de onregelmatige onttrekking
      betrokken zijn geweest terwijl zij wisten of redelijkerwijze hadden moeten weten dat het onttrekken op
      onregelmatige wijze geschiedde;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2c
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
  - number: 51.1.b
    text: |-
      bij toepassing van [artikel 2, eerste lid, onderdeel b][ref1]: de persoon die de accijnsgoederen voorhanden heeft
      en enig andere persoon die bij het voorhanden hebben ervan betrokken is;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.c
    text: |-
      bij toepassing van [artikel 2, eerste lid, onderdeel c][ref1]: de persoon die de accijnsgoederen produceert en, in
      geval van onregelmatige productie, enig andere persoon die bij de productie ervan betrokken is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.d
    text: |-
      bij toepassing van [artikel 2, eerste lid, onderdeel d][ref1]: de persoon die de accijnsgoederen bij invoer
      aangeeft of voor wiens rekening de goederen bij invoer worden aangegeven en, in geval van onregelmatige invoer,
      enig andere persoon die bij de invoer betrokken is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.e
    text: |-
      bij toepassing van [artikel 2, vierde lid][ref1]: de persoon die de minerale oliën voorhanden heeft of gebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.f
    text: |-
      bij toepassing van [artikel 2d, derde lid][ref1]: de particulier, bedoeld in artikel 2d, derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.g
    text: |-
      bij toepassing van [artikel 2d, vierde lid][ref1]: de particulieren, bedoeld in artikel 2d, vierde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2d
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2d
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.h
    text: |-
      bij toepassing van [artikel 2e, eerste lid][ref1]: de persoon die de levering verricht, die de voor levering
      bestemde goederen voorhanden heeft of aan wie de goederen worden geleverd in Nederland, of de particulier, bedoeld
      in artikel 2e, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2e
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2e
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.i
    text: |-
      bij toepassing van [artikel 2f, eerste lid][ref1]: de door de verkoper, bedoeld in artikel 2f, eerste lid,
      aangewezen fiscaal vertegenwoordiger;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2f
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2f
        hoofdstuk: I
        afdeling: '1'
  - number: 51.1.j
    text: |-
      bij toepassing van [artikel 4, eerste en tweede lid][ref1]: de personen, bedoeld in onderdeel h en i, en eenieder
      die bij de onregelmatigheid betrokken is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel4
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '4'
        hoofdstuk: I
        afdeling: '1'
  - number: '51.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, wordt, in bij algemene maatregel van bestuur aan te wijzen
      gevallen en onder daarbij te stellen voorwaarden, de accijns van accijnsgoederen die zijn uitgeslagen uit een
      accijnsgoederenplaats in opdracht van een vergunninghouder van een andere accijnsgoederenplaats voor dezelfde soort
      accijnsgoederen, geheven van de vergunninghouder van die andere accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
  - number: '51.3'
    text: |-
      Indien er voor eenzelfde accijnsschuld verscheidene schuldenaren zijn, zijn zij hoofdelijk tot betaling van deze
      schuld gehouden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel51
  - number: '52.1'
    text: De accijns wordt verschuldigd op het tijdstip van de uitslag tot verbruik.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
  - number: '52.2'
    text: 'Onder het tijdstip van de uitslag tot verbruik wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
  - number: 52.2.a
    text: |-
      in de in [artikel 2, eerste lid, onderdeel b][ref1], bedoelde situatie: het tijdstip van de aanvang van het
      voorhanden hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 52.2.b
    text: |-
      bij toepassing van [artikel 2, eerste lid, onderdeel c][ref1]: het tijdstip van de productie;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: 52.2.c
    text: |-
      in de in [artikel 2a, tweede lid, onderdeel b][ref1], bedoelde situatie: het tijdstip van ontvangst van de
      accijnsgoederen door de geregistreerde geadresseerde;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: 52.2.d
    text: |-
      in de in [artikel 2a, tweede lid, onderdeel c][ref1], bedoelde situatie: het tijdstip van ontvangst van de
      accijnsgoederen door de geadresseerde;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
