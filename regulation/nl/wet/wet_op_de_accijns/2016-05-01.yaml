        afdeling: '1'
  - number: 52.3.g
    text: |-
      bij toepassing van [artikel 4][ref1]: op het tijdstip van de vaststelling van de in artikel 4 bedoelde
      onregelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel4
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '4'
        hoofdstuk: I
        afdeling: '1'
  - number: '53.1'
    text: De in een tijdvak verschuldigd geworden accijns moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53
  - number: '53.2'
    text: Aangifte dient te worden gedaan voor elke accijnsgoederenplaats afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53
  - number: '53.3'
    text: |-
      In afwijking van het tweede lid kan bij ministeriële regeling, onder daarbij te stellen voorwaarden, worden
      toegestaan dat voor accijnsgoederenplaatsen waarvan de vergunningen op naam zijn gesteld van dezelfde
      vergunninghouder één aangifte voor die plaatsen te zamen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53
  - number: 53a.1
    text: |-
      In afwijking van [artikel 53, eerste lid][ref1], en van [artikel 10, tweede lid][ref2], en
      [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref3] wordt de accijns op aangifte voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 53a.1.a
    text: |-
      bij toepassing van [artikel 52, tweede lid, onderdelen a tot en met d][ref1], en, voor zover het een geregistreerde
      geadresseerde betreft, onderdeel e: uiterlijk op de dag na het in artikel 52, tweede lid, onderdelen a tot en met
      e, bedoelde tijdstip;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '52'
        hoofdstuk: III
        afdeling: '3'
  - number: 53a.1.b
    text: |-
      bij toepassing van [artikel 52, derde lid, onderdelen a, c, d en e][ref1]: uiterlijk op de dag na het in artikel
      52, derde lid, onderdelen a, c, d en e, bedoelde tijdstip;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '52'
        hoofdstuk: III
        afdeling: '3'
  - number: 53a.1.c
    text: |-
      bij toepassing van [artikel 52, derde lid, onderdeel b][ref1], voor zover het een ander dan de vergunninghouder
      van een accijnsgoederenplaats betreft: binnen één maand na het in artikel 52, derde lid, onderdeel b, bedoelde
      tijdstip;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '52'
        hoofdstuk: III
        afdeling: '3'
  - number: 53a.1.d
    text: |-
      bij toepassing van [artikel 52, derde lid, onderdeel g][ref1]: binnen één maand na het in artikel 52, derde lid,
      onderdeel g, bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '52'
        hoofdstuk: III
        afdeling: '3'
  - number: 53a.2
    text: |-
      In afwijking in zoverre van het eerste lid doet de geregistreerde geadresseerde aangifte van de in een week op de
      voet van [artikel 52, tweede lid, onderdelen c en e][ref1], verschuldigd geworden accijns uiterlijk op de vrijdag
      van de week daaropvolgend. De verschuldigd geworden accijns wordt op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel52
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '52'
        hoofdstuk: III
        afdeling: '3'
  - number: '54.1'
    text: |-
      Bij intrekking van een vergunning voor een accijnsgoederenplaats worden de accijnsgoederen waarvoor die
      accijnsgoederenplaats als zodanig is aangewezen, die binnen die plaats voorhanden zijn op de dag met ingang waarvan
      de vergunning wordt ingetrokken, aangemerkt als te zijn uitgeslagen tot verbruik en wordt het tijdvak waarover de
      accijns verschuldigd is, aangemerkt als te zijn geëindigd op die dag.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel54
  - number: '54.2'
    text: |-
      De inspecteur kan bepalen dat de termijn waarbinnen de accijns dient te worden voldaan over het tijdvak waartoe de
      in het eerste lid bedoelde dag behoort alsmede over het daaraan onmiddellijk voorafgaande tijdvak in afwijking van
      [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] minder bedraagt dan één maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '55.1'
    text: De accijns wordt berekend naar het tarief dat geldt op het tijdstip van de uitslag tot verbruik.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel55
  - number: '55.2'
    text: |-
      In de situatie, bedoeld in [artikel 2, vierde lid][ref1], wordt de accijns berekend als het verschil tussen het
      bedrag aan accijns dat is geheven en het bedrag dat zou zijn geheven indien geen herkenningsmiddelen zouden zijn
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '55.3'
    text: |-
      Voor de berekening van de accijns, bedoeld in het tweede lid, wordt de hoeveelheid vastgesteld op de maximuminhoud
      van de tank of het reservoir waarin de brandstof voorhanden is of is geweest.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel55
  - number: '56.1'
    text: |-
      De vergunninghouder van een accijnsgoederenplaats en de geregistreerde afzender stellen zekerheid voor de accijns
      die zij verschuldigd zijn of kunnen worden in Nederland dan wel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
  - number: '56.2'
    text: |-
      De geregistreerde geadresseerde en de fiscaal vertegenwoordiger, bedoeld in [artikel 50f][ref1], stellen zekerheid
      voor de accijns die zij verschuldigd zijn of kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel50f
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 50f
        hoofdstuk: III
        afdeling: 2b
  - number: '56.3'
    text: |-
      In afwijking van het eerste lid kan de inspecteur, onder bij algemene maatregel van bestuur te stellen voorwaarden
      en beperkingen, toestaan dat de vervoerder of de eigenaar van de accijnsgoederen zekerheid stelt in plaats van
      de vergunninghouder en de geregistreerde afzender, bedoeld in het eerste lid. De zekerheid wordt gesteld voor het
      bedrag aan accijns dat wordt vertegenwoordigd door de hoeveelheid accijnsgoederen die door of namens de vervoerder
      of de eigenaar wordt vervoerd naar de in [artikel 2a, eerste en derde lid][ref1], bedoelde bestemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: '56.4'
    text: |-
      Het stellen van zekerheid als bedoeld in het eerste lid kan op verzoek achterwege blijven voor minerale oliën die
      vanuit een accijnsgoederenplaats over zee of door middel van een pijpleiding worden overgebracht. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
  - number: '56.5'
    text: |-
      Het bedrag van de zekerheid wordt vastgesteld door de inspecteur. De vaststelling geschiedt tot een zodanig bedrag
      dat de te verhalen accijns voldoende verzekerd kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
  - number: '56.6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor het bepalen van de hoogte van het bedrag van
      de zekerheid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
  - number: '56.7'
    text: |-
      In de vergunning bepaalt de inspecteur zo nodig nader op welke wijze aan de bij of krachtens deze wet gestelde
      voorwaarden moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
  - number: '56.8'
    text: |-
      De inspecteur kan in de vergunning nadere voorwaarden opnemen ter verzekering van een juiste toepassing van het
      bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel56
  - number: '57.1'
    text: Het bedrag van de zekerheid kan door de inspecteur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel57
  - number: '57.2'
    text: |-
      Degene die op grond van [artikel 56][ref1] zekerheid heeft gesteld kan een verzoek tot verlaging van het bedrag van
      de zekerheid indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
  - number: '57.3'
    text: |-
      Bij verhoging van het bedrag van de zekerheid draagt degene die zekerheid heeft gesteld zorg dat binnen een maand
      na de bekendmaking ervan de zekerheid is aangevuld.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel57
  - number: '58.1'
    text: |-
      Het vaststellen en het wijzigen van het bedrag van de zekerheid alsmede het afwijzen van een verzoek als bedoeld in
      [artikel 57, tweede lid][ref1], geschieden bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel57
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '57'
        hoofdstuk: III
        afdeling: '4'
  - number: '58.2'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het derde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel58
  - number: '58.3'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het tweede lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel58
  - number: '59.1'
    text: De zekerheid wordt gesteld bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel59
  - number: '59.2'
    text: De ontvanger beslist of de vorm van de zekerheid die degene die zekerheid moet stellen, aanbiedt, wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel59
  - number: '60.1'
    text: |-
      De aan het stellen, het wijzigen en het opheffen van de zekerheid verbonden kosten komen ten laste van degene die
      zekerheid moet stellen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel60
  - number: '60.2'
    text: |-
      Ingeval de zekerheid wordt gesteld in geld wordt daarover een rente vergoed die gelijk is aan de
      herfinancieringsrente, te weten de minimale biedrente die de Europese Centrale Bank hanteert voor
      basisherfinancieringstransacties.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel60
  - number: '60.3'
    text: |-
      Voor de toepassing van het tweede lid wordt het over een kalendermaand te vergoeden rentebedrag berekend naar de
      rente die geldt bij de aanvang van die maand.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel60
  - number: '61.1'
    text: |-
      De vergunninghouder van een accijnsgoederenplaats heeft voor de accijns die is begrepen in de verkoopprijs van de
      door hem geleverde accijnsgoederen, zolang hij ter zake geen betaling heeft ontvangen doch niet langer dan een half
      jaar nadat hij die accijns verschuldigd is geworden, voorrecht op alle goederen van de koper.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel61
  - number: '61.2'
    text: |-
      Het voorrecht als bedoeld in het eerste lid heeft gelijke rangorde als het voorrecht dat ’s Rijks schatkist heeft
      op de voet van [artikel 21 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: 61a
    text: |-
      De vervoerder van accijnsgoederen is hoofdelijk aansprakelijk voor het bedrag aan accijns dat wordt
      vertegenwoordigd door de hoeveelheid accijnsgoederen die door hem wordt vervoerd vanuit een accijnsgoederenplaats
      of van de plaats van invoer, bedoeld in [artikel 2a, derde lid][ref1], naar een andere accijnsgoederenplaats, naar
      een belastingentrepot, naar een geregistreerde geadresseerde in een andere lidstaat of naar een plaats waar de
      accijnsgoederen het grondgebied van de Unie verlaten, indien tijdens dat vervoer door hem of door zijn toedoen een
      onregelmatigheid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2a
        hoofdstuk: I
        afdeling: '1'
  - number: '62'
    text: |-
      Onverminderd [artikel 51, eerste lid, onderdeel d][ref1], zijn ter zake van de uitslag tot
      verbruik, bedoeld in [artikel 2, eerste lid, onderdeel d][ref2] de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref3], met uitzondering van artikel 88 van de
      Gedelegeerde Verordening Douanewetboek van de Unie, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '51'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '63.1'
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden, regels worden gesteld ingevolge welke de
      heffing van accijns van accijnsgoederen die in kleine zendingen dan wel door reizigers als bagage worden ingevoerd,
      geschiedt volgens daarbij vast te stellen forfaitaire tarieven.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel63
  - number: '63.2'
    text: De forfaitaire tarieven zijn niet van toepassing met betrekking tot handelsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel63
  - number: '64.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.1.a
    text: |-
      bier, wijn, tussenprodukten en overige alcoholhoudende produkten die rechtstreeks of als bestanddeel van een
      halffabrikaat worden aangewend voor de vervaardiging van levensmiddelen, gevuld of anderszins, waarvan het
      alcoholgehalte niet meer bedraagt dan 8,5 L absolute alcohol per 100 kg produkt voor chocola, en 5 L absolute
      alcohol per 100 kg produkt voor andere produkten;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.1.b
    text: overige alcoholhoudende produkten die kennelijk niet zijn bestemd voor inwendig gebruik door de mens;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.1.c
    text: |-
      overige alcoholhoudende producten die worden gebruikt voor de vervaardiging van geneesmiddelen als omschreven
      in Richtlijn 2001/82/EG van het Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een
      communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG 2001, L 311) en Richtlijn
      2001/83/EG van het Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een communautair wetboek
      betreffende geneesmiddelen voor menselijk gebruik (PbEG 2001, L 311);
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.1.d
    text: |-
      minerale oliën die kennelijk niet zijn bestemd om te worden gebruikt als brandstof voor verwarming, als
      motorbrandstof of als additief in motorbrandstoffen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.1.e
    text: |-
      minerale oliën die in hoogovens met het oog op chemische reductie worden ingespoten als toevoeging aan de
      steenkool, die wordt gebruikt als voornaamste brandstof;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.1.f
    text: |-
      sigaretten en rooktabak die geheel uit andere stoffen dan tabak bestaan en die uitsluitend zijn bestemd om te
      worden gebruikt voor medicinale doeleinden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: '64.2'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.2.a
    text: de aard van en de aanduiding op de verpakking van in het eerste lid bedoelde accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.2.b
    text: de stoffen waarmee in het eerste lid bedoelde accijnsgoederen moeten zijn vermengd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: 64.2.c
    text: de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel64
  - number: '65.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van accijnsgoederen:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: 65.1.a
    text: |-
      waarvan de in [artikel 64][ref1] voor de desbetreffende accijnsgoederen aangegeven bestemming niet of niet
      voldoende blijkt uit de goederen als zodanig, indien degene die de goederen betrekt deze gebruikt voor het
      vervaardigen van accijnsgoederen als bedoeld in [artikel 64][ref2] dan wel deze gebruikt overeenkomstig de in dat
      artikel voor het desbetreffende accijnsgoed bedoelde bestemming;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel64
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '64'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '64'
        hoofdstuk: V
        afdeling: '1'
  - number: 65.1.b
    text: |-
      die door degene die de goederen betrekt, worden gebruikt als grondstof voor het vervaardigen van niet-
      accijnsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: '65.2'
    text: |-
      Voor de toepassing van dit artikel worden onder niet-accijnsgoederen mede verstaan minerale oliën als bedoeld in
      [artikel 5, derde lid, onderdeel d ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '5'
        hoofdstuk: I
        afdeling: '2'
  - number: '65.3'
    text: |-
      Behoudens in bij algemene maatregel van bestuur aan te wijzen gevallen is degene die accijnsgoederen met
      vrijstelling van accijns betrekt in het bezit van een daartoe strekkende vergunning.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: '65.4'
    text: De vergunning wordt op verzoek verleend door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: '65.5'
    text: |-
      Het verlenen, het aanpassen en het intrekken van een vergunning alsmede het afwijzen van een verzoek daartoe
      geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: '65.6'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het zevende lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: '65.7'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het zesde lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: '65.8'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel65
  - number: '66.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van minerale oliën die worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66
  - number: 66.1.a
    text: voor de aandrijving van schepen of als scheepsbehoeften aan boord van schepen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66
  - number: 66.1.b
    text: voor de voortstuwing van luchtvaartuigen voor zover het betreft halfzware olie als bedoeld in GN-code 2710 19 21.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66
  - number: '66.2'
    text: |-
      De vrijstelling als bedoeld in het eerste lid, onderdelen a en b, is niet van toepassing met betrekking tot
      minerale oliën die worden gebruikt voor pleziervaartuigen of plezierluchtvaartuigen dan wel worden gebruikt aan
      boord van schepen die kennelijk niet worden gebruikt om te varen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66
  - number: '66.3'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder een pleziervaartuig of een
      plezierluchtvaartuig: een vaartuig respectievelijk een luchtvaartuig dat wordt gebruikt door de eigenaar daarvan
      of door de natuurlijke of rechtspersoon die het gebruik daarvan geniet door huur of anderszins, voor andere dan
      commerciële doeleinden en met name voor andere doeleinden dan voor het vervoer van personen of goederen of voor het
      verrichten van diensten onder bezwarende titel, dan wel ten behoeve van overheidsinstanties.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66
  - number: '66.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66
  - number: 66a.1
    text: |-
      Onverminderd het bepaalde in [artikel 66, eerste en tweede lid][ref1], wordt onder bij algemene maatregel van
      bestuur te stellen voorwaarden en beperkingen vrijstelling van accijns verleend ter zake van de uitslag tot
      verbruik van accijnsgoederen die worden gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
  - number: 66a.1.a
    text: aan boord van schepen in het verkeer van Nederland naar een andere lidstaat, anders dan over de binnenwateren;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66a
  - number: 66a.1.b
    text: aan boord van luchtvaartuigen in het verkeer van Nederland naar een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66a
  - number: 66a.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66a
  - number: 66b.1
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van accijnsgoederen uit een accijnsgoederenplaats, gelegen op een
      luchthaven of op een haventerrein, die worden meegevoerd in de persoonlijke bagage van reizigers die zich door de
      lucht of over zee naar een derdelandsgebied of een derde land begeven.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66b
  - number: 66b.2
    text: |-
      De vrijstelling, bedoeld in het eerste lid, is mede van toepassing met betrekking tot de accijnsgoederen die aan
      boord van een luchtvaartuig of schip worden geleverd tijdens een vlucht of overtocht naar een derdelandsgebied of
      een derde land.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66b
  - number: 66b.3
    text: |-
      Voor de toepassing van dit artikel wordt onder reiziger die zich naar een derdelandsgebied of derde land begeeft,
      verstaan: iedere passagier die in het bezit is van een bewijs van vervoer door de lucht of over zee, waarop als
      definitieve bestemming een in een derdelandsgebied of derde land gelegen luchthaven of haven is vermeld.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66b
  - number: 66b.4
    text: |-
      In afwijking van [artikel 74][ref1] kunnen tabaksproducten worden opgeslagen in een accijnsgoederenplaats van
      waaruit de in het eerste lid bedoelde uitslag tot verbruik plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel74
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '74'
        hoofdstuk: VI
        afdeling: '1'
  - number: 66b.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel66b
  - number: '67.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van accijns
      verleend ter zake van de uitslag tot verbruik van minerale oliën van de GN-codes 1507 tot en met 1518 alsmede van
      minerale oliën van GN-code 3824 90 99, wat hun van biomassa afkomstige bestanddelen betreft, die zijn bestemd voor
      gebruik, worden aangeboden voor verkoop of worden gebruikt voor verwarmingsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel67
  - number: '67.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel67
  - number: '68.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt vrijstelling van
      accijns verleend ter zake van de uitslag tot verbruik van accijnsgoederen die worden gebruikt voor onderzoek,
      kwaliteitscontroles en smaaktesten buiten een accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel68
  - number: '68.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel68
  - number: 68a
    text: |-
      De [artikelen 21a][ref1] en [21b van de Wet op de omzetbelasting 1968][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel21b
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 21b
  - number: '69.1'
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden en beperkingen, wordt vrijstelling van accijns verleend ter
      zake van de uitslag tot verbruik van accijnsgoederen, die bestemd zijn om te worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69
  - number: 69.1.a
    text: in het kader van diplomatieke of consulaire betrekkingen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69
  - number: 69.1.b
    text: |-
      door internationale instellingen die door Nederland zijn erkend, alsmede door de leden van deze instellingen, zulks
      binnen de beperkingen en onder de voorwaarden die zijn vastgesteld bij de internationale verdragen tot oprichting
      van deze instellingen of bij de vestigingsovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69
  - number: 69.1.c
    text: |-
      door de strijdkrachten van alle staten die partij zijn bij het Noord-Atlantisch Verdrag, met uitzondering van
      Nederland, ten behoeve van deze strijdkrachten of het hen begeleidende burgerpersoneel of voor de bevoorrading van
      hun messes of kantines;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69
  - number: 69.1.d
    text: |-
      voor verbruik in het kader van een met derde landen of internationale instellingen gesloten overeenkomst voor zover
      een dergelijke overeenkomst wordt aanvaard of toegestaan op het gebied van vrijstelling van omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69
  - number: '69.2'
    text: |-
      In andere gevallen dan bedoeld in het eerste lid wordt bij ministeriële regeling, onder daarbij te stellen
      voorwaarden en beperkingen, vrijstelling van accijns verleend ter zake van de uitslag tot verbruik van
      accijnsgoederen, indien aanspraak op vrijstelling bestaat ingevolge het Koninkrijk verbindende verdragen en in al
      hun onderdelen verbindende besluiten van bij zodanige verdragen opgerichte volkenrechtelijke organisaties, alsmede
      in daarmee overeenkomende gevallen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69
  - number: 69a.1
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt teruggaaf van accijns verleend
      voor minerale oliën die worden gebruikt voor de opwekking van elektriciteit in een installatie met een elektrisch
      vermogen van minimaal 60 kilowatt, voorzover de opgewekte elektriciteit wordt ingevoed op een Nederlands net dan
      wel, indien geen invoeding op een Nederlands net plaatsvindt, voorzover de opgewekte elektriciteit overeenkomstig
      [artikel 50, derde lid, van de Wet belastingen op milieugrondslag][ref1] in de heffing van energiebelasting wordt
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
  - number: 69a.2
    text: |-
      Voor de toepassing van dit artikel wordt onder net verstaan een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 69a.3
    text: Bij ministeriële regeling worden nadere regels gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel69a
  - number: '70.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      accijns verleend:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
  - number: 70.1.a
    text: |-
      voor accijnsgoederen in gevallen waarin deze accijnsgoederen op de voet van [artikel 65][ref1] zouden kunnen worden
      betrokken met vrijstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
        hoofdstuk: V
        afdeling: '1'
  - number: 70.1.b
    text: |-
      ter zake van de levering van minerale oliën waarvoor op de voet van [artikel 66][ref1] aanspraak op een
      vrijstelling zou bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
  - number: 70.1.c
    text: |-
      ter zake van accijnsgoederen waarvoor op de voet van [artikel 66a][ref1] aanspraak op vrijstelling zou bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 66a
        hoofdstuk: V
        afdeling: '1'
  - number: 70.1.d
    text: |-
      voor minerale oliën waarvoor op de voet van [artikel 67][ref1] aanspraak op een vrijstelling zou bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel67
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '67'
        hoofdstuk: V
        afdeling: '1'
  - number: '70.2'
    text: |-
      De teruggaaf als bedoeld in het eerste lid, onderdeel a, wordt verleend aan degene die een vergunning heeft
      ingevolge [artikel 65, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel65
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '65'
        hoofdstuk: V
        afdeling: '1'
  - number: '70.3'
    text: |-
      De teruggaaf als bedoeld in het eerste lid, onderdelen b en c, wordt verleend aan degene die de levering heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
  - number: '70.4'
    text: |-
      De teruggaaf, bedoeld in het eerste lid, onderdeel d, wordt verleend aan degene die de minerale oliën gebruikt
      voor verwarmingsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
  - number: '70.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel70
  - number: '71.1'
    text: |-
      Onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen wordt op verzoek teruggaaf van
      accijns verleend voor accijnsgoederen die:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: 71.1.a
    text: zijn verloren gegaan;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: 71.1.b
    text: zijn vernietigd onder ambtelijk toezicht;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: 71.1.c
    text: zijn gebracht naar een derde land;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: 71.1.d
    text: zijn gebracht binnen een accijnsgoederenplaats die voor dat soort accijnsgoed als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: 71.1.e
    text: |-
      door een ondernemer zijn overgebracht naar een andere lidstaat, en die aldaar voor commerciële doeleinden
      voorhanden worden gehouden om er te worden geleverd of gebruikt, en waarvoor de in die lidstaat verschuldigde
      accijns is voldaan overeenkomstig de wettelijke bepalingen van die lidstaat;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: 71.1.f
    text: |-
      zijn geleverd aan een in een andere lidstaat gevestigde persoon, niet zijnde een vergunninghouder van een
      belastingentrepot, een geregistreerde geadresseerde of een zelfstandig bedrijf, en die door een in Nederland
      gevestigde verkoper of voor diens rekening direct of indirect worden verzonden of vervoerd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: '71.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71
  - number: 71a.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend, indien bij toepassing van [artikel 2c, vijfde lid][ref1], of van
      [artikel 4, derde lid][ref2], is aangetoond dat de accijns door de andere lidstaat is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel4
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 2c
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '4'
        hoofdstuk: I
        afdeling: '1'
  - number: 71a.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71a
  - number: 71b.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor vloeibaar gemaakt petroleumgas dat is belast naar het
      tarief, bedoeld in [artikel 27, eerste lid, onderdeel d][ref1], indien dat petroleumgas is afgeleverd in
      de brandstoftanks van en is gebruikt voor het aandrijven op de weg van een autobus die hoofdzakelijk wordt
      gebruikt voor het openbaar vervoer, bedoeld in [artikel 1, onderdeel h, van de Wet personenvervoer 2000][ref2].
      Onder een autobus wordt in dit artikel en de daarop berustende bepalingen verstaan een autobus als bedoeld in
      [artikel 2, onderdeel e, van de Wet op de motorrijtuigenbelasting 1994][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '2'
  - number: 71b.2
    text: De teruggaaf bedraagt € 51,42 per 1000 kg.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71b
  - number: 71b.3
    text: |-
      De teruggaaf wordt verleend aan de vervoerder, bedoeld in
      [artikel 1, onderdeel k, van de Wet personenvervoer 2000][ref1] aan wie vergunning als
      bedoeld in [artikel 4, eerste lid, van de Wet personenvervoer 2000][ref2] is verleend
      en op wiens naam de autobus is ingeschreven in het kentekenregister, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref3], op het tijdstip waarop het vloeibaar
      gemaakt petroleumgas is afgeleverd in de brandstoftank van de autobus.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 71b.4
    text: Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71b
  - number: 71c.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor vloeibaar gemaakt petroleumgas dat is belast naar het tarief,
      bedoeld in [artikel 27, eerste lid, onderdeel d][ref1], indien dat petroleumgas is afgeleverd in de brandstoftanks
      van en is gebruikt voor het aandrijven op de weg van motorrijtuigen die zijn ingericht en uitsluitend worden
      gebruikt als vuilniswagen, kolkenzuiger of straatveegwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 71c.2
    text: De teruggaaf bedraagt € 51,42 per 1 000 kg.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71c
  - number: 71c.3
    text: |-
      De teruggaaf wordt verleend aan degene op wiens naam de vuilniswagen, kolkenzuiger
      of straatveegwagen is ingeschreven in het kentekenregister, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1], op het tijdstip waarop het vloeibaar
      gemaakt petroleumgas is afgeleverd in de brandstoftank van de in het eerste lid bedoelde motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 71c.4
    text: Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71c
  - number: 71d.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor andere minerale oliën dan halfzware olie als bedoeld in GN-
      code 2710 19 21, indien die olie is afgeleverd in de brandstoftanks van en is gebruikt voor de voortstuwing van
      luchtvaartuigen, andere dan plezierluchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71d
  - number: 71d.2
    text: |-
      De teruggaaf wordt verleend aan degene op wiens naam het luchtvaartuig is geregistreerd in het register voor
      burgerluchtvaartuigen, bedoeld in [artikel 3.3, eerste lid, van de Wet luchtvaart][ref1]. Ingeval teruggaaf wordt
      verzocht voor een in het buitenland geregistreerd luchtvaartuig, wordt deze verleend aan de eigenaar van dit
      luchtvaartuig dan wel aan degene die daartoe door deze is gemachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 71d.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf
      en kan in bij die regeling aangewezen gevallen een ander dan de in het tweede lid bedoelde persoon worden
      aangewezen als degene aan wie de teruggaaf wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71d
  - number: 71e.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor vloeibaar gemaakt petroleumgas gebruikt voor
      verwarming ter bevordering van het groeiproces van tuinbouwproducten als bedoeld in post a 32 van de bij de
      [Wet op de omzetbelasting 1968 behorende Tabel 1][ref1], indien geen aansluiting aanwezig is voor aardgas.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71e
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 71e.2
    text: De teruggaaf, bedoeld in het eerste lid, bedraagt € 142,23 per 1 000 kilogram vloeibaar gemaakt petroleumgas.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71e
  - number: 71e.3
    text: |-
      De teruggaaf wordt verleend aan de tuinbouwer die het vloeibaar gemaakt petroleumgas gebruikt voor het in het
      eerste lid bedoelde gebruik.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71e
  - number: 71e.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71e
  - number: 71g.1
    text: |-
      [Artikel 69 van de Wet belastingen op milieugrondslag][ref1] is van overeenkomstige toepassing met betrekking tot
      vloeibaar gemaakt petroleumgas, indien geen aansluiting aanwezig is voor aardgas.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel69
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71g
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '69'
  - number: 71g.2
    text: |-
      In afwijking van [artikel 69, vijfde en zesde lid, van de Wet belastingen op milieugrondslag][ref1] bedraagt de
      teruggaaf € 83,09 per 1 000 kilogram vloeibaar gemaakt petroleumgas.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel69
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71g
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '69'
  - number: 71h.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor motorbrandstof die geheel of gedeeltelijk bestaat uit
      biobrandstof als bedoeld in artikel 2, onderdeel i, van de Richtlijn hernieuwbare energie indien die biobrandstof
      voldoet aan duurzaamheidscriteria als bedoeld in artikel 17 van deze richtlijn.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.2
    text: |-
      Dat een biobrandstof voldoet aan de duurzaamheidscriteria, bedoeld in het eerste lid, blijkt uit een audit
      uitgevoerd door een onafhankelijk deskundige of uit een andere wijze als bedoeld in artikel 18 van de Richtlijn
      hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.3
    text: 'Teruggaaf van accijns wordt slechts verleend:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.3.a
    text: |-
      over de hoeveelheid biobrandstof in motorbrandstof als bedoeld in het eerste lid, mits die biobrandstof een lagere
      energie-inhoud heeft dan de gelijkwaardige motorbrandstof waarvan het accijnstarief van toepassing is; en
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.3.b
    text: |-
      indien 10 procent of meer van de in de motorbrandstof aanwezige energie afkomstig is van de in het eerste lid
      bedoelde biobrandstof.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.4
    text: |-
      De teruggaaf van accijns bedraagt een percentage van het accijnstarief van de gelijkwaardige motorbrandstof,
      bedoeld in het derde lid, onderdeel a. Dit percentage is gelijk aan het verschil in energie-inhoud van de
      biobrandstof en die van de gelijkwaardige motorbrandstof, uitgedrukt als percentage van de energie-inhoud van de
      gelijkwaardige motorbrandstof.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.5
    text: |-
      Voor de vaststelling van de energie-inhoud per volume van de biobrandstof en die van de gelijkwaardige
      motorbrandstof wordt voor zover mogelijk uitgegaan van hetgeen hiertoe is opgenomen in bijlage III van de Richtlijn
      hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.6
    text: |-
      De teruggaaf wordt verleend aan degene die de accijns ter zake van de uitslag tot verbruik verschuldigd is
      geworden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.7
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld waaronder de teruggaaf, bedoeld
      in het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71h.8
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71h
  - number: 71i.1
    text: |-
      Op verzoek wordt teruggaaf van accijns verleend voor vloeibaar gemaakt aardgas, vloeibaar gemaakt methaan en
      vloeibaar gemaakt biogas dat is onderworpen aan het tarief, genoemd in [artikel 27, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71i
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 71i.2
    text: De teruggaaf, bedoeld in het eerste lid, bedraagt € 125 per 1.000 kg.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71i
  - number: 71i.3
    text: |-
      De teruggaaf wordt verleend aan degene die het vloeibaar gemaakt aardgas, vloeibaar gemaakt methaan of vloeibaar
      gemaakt biogas in de periode van 1 januari 2014 tot en met 31 december 2018 heeft uitgeslagen tot verbruik.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71i
  - number: 71i.4
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan het verzoek om teruggaaf,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71i
  - number: 71i.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel71i
  - number: '72.1'
    text: Teruggaaf van accijns wordt verleend tot ten hoogste het bedrag dat aan accijns is voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel72
  - number: '72.2'
    text: Op een verzoek om teruggaaf van accijns beslist de inspecteur bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel72
  - number: '73.1'
    text: |-
      Tabaksproducten moeten bij de uitslag tot verbruik zijn voorzien van het voor het desbetreffende tabaksproduct
      voorgeschreven accijnszegel. De accijnszegels zijn staatseigendom.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel73
  - number: '73.2'
    text: |-
      Tabaksproducten die zijn bestemd voor het verbruik, bedoeld in [artikel 2, tweede lid][ref1], mogen niet zijn
      voorzien van een accijnszegel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '73.3'
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden, gevallen worden aangewezen waarin het
      eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel73
  - number: '74'
    text: |-
      Een vergunning voor een accijnsgoederenplaats voor tabaksproducten kan, onverminderd het bepaalde in
      de[ artikelen 40, eerste en tweede lid][ref1], en [41][ref2], uitsluitend worden verkregen door degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel41
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '41'
        hoofdstuk: III
        afdeling: '1'
  - number: 74.a
    text: tabaksproducten vervaardigt;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel74
  - number: 74.b
    text: buiten Nederland vervaardigde tabaksproducten in Nederland van accijnszegels voorziet;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel74
  - number: 74.c
    text: |-
      buiten Nederland vervaardigde tabaksproducten opslaat die buiten Nederland zijn voorzien van door hem aangevraagde
      Nederlandse accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel74
  - number: 74.d
    text: |-
      tabaksproducten opslaat die zijn bestemd voor de in [artikel 66a ][ref1] bedoelde bevoorrading van schepen en
      luchtvaartuigen of die vanuit die plaats worden overgebracht naar een belastingentrepot, naar een in een andere
      lidstaat gevestigde geregistreerde geadresseerde of naar een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 66a
        hoofdstuk: V
        afdeling: '1'
  - number: '75.1'
    text: 'Accijnszegels kunnen worden aangevraagd bij de zegelproducent door:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.1.a
    text: de vergunninghouder van een accijnsgoederenplaats voor tabaksproducten;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.1.b
    text: de in Nederland gevestigde geregistreerde geadresseerde;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.1.c
    text: |-
      de fiscaal vertegenwoordiger van een niet in Nederland gevestigd bedrijf dat buiten Nederland tabaksproducten van
      accijnszegels voorziet;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.1.d
    text: een in Nederland gevestigd bedrijf dat buiten Nederland tabaksproducten van accijnszegels voorziet.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.2'
    text: |-
      Degene die accijnszegels wil aanvragen verzoekt bij de inspecteur om toestemming voor het aanvragen van
      accijnszegels. De inspecteur beslist op de aanvraag alsmede het intrekken van een toestemming bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.3'
    text: |-
      Indien de fiscaal vertegenwoordiger, bedoeld in het eerste lid, onderdeel c, toestemming als bedoeld in het tweede
      lid wil verkrijgen ten behoeve van meerdere bedrijven, moet voor elk bedrijf afzonderlijk toestemming worden
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.4'
    text: |-
      Bij ministeriële regeling worden voorwaarden en beperkingen gesteld waaronder de toestemming, bedoeld in het tweede
      lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.5'
    text: 'De toestemming voor de aanvraag van accijnszegels kan door de inspecteur worden ingetrokken ingeval:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.5.a
    text: |-
      niet wordt voldaan aan de bij ministeriële regeling bepaalde voorwaarden of de in de toestemming opgenomen
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.5.b
    text: geen of niet voldoende zekerheid is gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.5.c
    text: misbruik van de toestemming is gemaakt of een poging daartoe is gedaan;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.5.d
    text: |-
      degene aan wie de toestemming is verleend onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke
      bepaling inzake de accijns;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.5.e
    text: |-
      degene aan wie de toestemming is verleend in staat van faillissement verkeert of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: 75.5.f
    text: degene aan wie de toestemming is verleend daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden worden gesteld waaraan door degene die de
      accijnszegels aanvraagt moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.7'
    text: |-
      Van accijnszegels voorziene tabaksproducten worden uitgeslagen tot verbruik door degene die de accijnszegels heeft
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.8'
    text: |-
      In afwijking van het zevende lid kan onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen
      worden bepaald dat de tabaksproducten door een ander tot verbruik worden uitgeslagen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '75.9'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het aanvragen, het verkrijgbaar stellen, het verstrekken en
      het gebruik van accijnszegels.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel75
  - number: '76.1'
    text: |-
      Om de in [artikel 75, tweede lid][ref1], bedoelde toestemming te kunnen verkrijgen stelt degene die de
      accijnszegels aanvraagt zekerheid voor het bedrag aan accijns dat de accijnszegels vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
        hoofdstuk: VI
        afdeling: '1'
  - number: '76.2'
    text: |-
      Het bedrag van de zekerheid wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking. De
      vaststelling geschiedt tot een zodanig bedrag dat het bedrag aan accijns dat de zegels vertegenwoordigen voldoende
      verzekerd kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel76
  - number: '76.3'
    text: |-
      Indien de vergunninghouder van een accijnsgoederenplaats en de geregistreerde geadresseerde zekerheid hebben
      gesteld op de voet van [artikel 56][ref1] kan die zekerheid mede dienen als zekerheid als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel56
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '56'
        hoofdstuk: III
        afdeling: '4'
  - number: '76.4'
    text: |-
      Met betrekking tot de zekerheid, bedoeld in het eerste lid, zijn de [artikelen 57 tot en met 60][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel57
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '57'
        hoofdstuk: III
        afdeling: '4'
  - number: '76.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel76
  - number: '77.1'
    text: |-
      Accijnszegels die zijn ontvangen door degene die de zegels heeft aangevraagd en waarvan niet is aangetoond dat zij
      zijn aangebracht op tabaksproducten die zijn uitgeslagen tot verbruik, worden geacht te zijn vermist.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: '77.2'
    text: 'Als vermiste accijnszegels worden niet aangemerkt accijnszegels die:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: 77.2.a
    text: deel uitmaken van de zegelvoorraad;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: 77.2.b
    text: retour zijn gezonden aan de inspecteur;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: 77.2.c
    text: onder ambtelijk toezicht zijn vernietigd;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: 77.2.d
    text: verloren zijn gegaan door overmacht of ongeval;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: 77.2.e
    text: |-
      op tabaksproducten zijn aangebracht en waarvoor de accijns in een andere lidstaat verschuldigd is geworden, en de
      verwijdering of vernietiging van de accijnszegels ten genoegen van de inspecteur wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: '77.3'
    text: |-
      Vanaf het moment dat de accijnszegels door of namens degene die de accijnszegels heeft aangevraagd in ontvangst
      zijn genomen op het distributiepunt, is degene die de accijnszegels heeft aangevraagd aansprakelijk voor het bedrag
      aan accijns dat de accijnszegels vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: '77.4'
    text: |-
      Degene die de accijnszegels heeft aangevraagd moet het bedrag aan accijns dat de vermiste accijnszegels
      vertegenwoordigen betalen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: '77.5'
    text: |-
      Het bedrag aan accijns dat de vermiste accijnszegels vertegenwoordigen wordt door de inspecteur vastgesteld
      bij voor bezwaar vatbare beschikking. Bij vaststelling van het bedrag aan accijns dat de vermiste accijnszegels
      vertegenwoordigen maakt de inspecteur het volgende onderscheid:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: 77.5.a
    text: |-
      onbedrukte blanco accijnszegels: een bedrag aan accijns behorend bij een gewogen gemiddelde prijs en hoeveelheid
      per zegelaanvrager op het moment waarop het vermis wordt vastgesteld naar het op dat moment geldende tarief;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: 77.5.b
    text: |-
      bedrukte accijnszegels: het bedrag wordt afgeleid uit in de administratie opgenomen prijs en hoeveelheid die is
      vermeld op de vermiste zegels naar het op dat moment geldende tarief.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: '77.6'
    text: |-
      Voor de toepassing van dit artikel en de daarop gebaseerde bepalingen wordt verstaan onder: - *onbedrukte blanco
      accijnszegels:* accijnszegels die niet als bedrukte accijnszegels kunnen worden aangemerkt;
        - *bedrukte accijnszegels:* accijnszegels voor sigaretten of rooktabak die zijn voorzien van de gegevens met
      betrekking tot de soort tabaksproduct, de kleinhandelsprijs, de hoeveelheid en de tariefcode of accijnszegels voor
      sigaren die zijn voorzien van de gegevens met betrekking tot de soort tabaksproduct en de kleinhandelsprijs.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: '77.7'
    text: |-
      Op de betaling als bedoeld in het vierde lid zijn de [Algemene wet inzake rijksbelastingen][ref1] en de
      [Invorderingswet 1990][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '77.8'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel77
  - number: '78.1'
    text: De accijnszegels worden aangebracht op de kleinhandelsverpakking van tabaksprodukten.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel78
  - number: '78.2'
    text: |-
      De accijnszegels voor sigaretten en rooktabak vermelden de kleinhandelsprijs, de tariefcode, de soort en het
      aantal stuks of de massa van het tabaksproduct waarop de zegels worden aangebracht. De accijnszegels voor sigaren
      vermelden de kleinhandelsprijs en de soort van het tabaksproduct waarop de zegels worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel78
  - number: '78.3'
    text: In afwijking van het eerste lid mogen sigaren stuksgewijs van een accijnszegel worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel78
  - number: '78.4'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel78
  - number: 78.4.a
    text: de vorm en de kleur van de accijnszegels alsmede de daarop te vermelden gegevens;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel78
  - number: 78.4.b
    text: de wijze waarop de accijnszegels worden aangebracht en voor herhaald gebruik ongeschikt moeten worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel78
  - number: 78.4.c
    text: de wijze van verpakking, de grootte van de inhoud van de verpakking en de op de verpakking te vermelden gegevens.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel78
  - number: '79.1'
    text: |-
      Op verzoek van degene die de zegels heeft aangevraagd kunnen accijnszegels onder ambtelijk toezicht worden
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel79
  - number: '79.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het retour zenden van
      accijnszegels en de vernietiging van accijnszegels onder ambtelijk toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel79
  - number: '80.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing van accijns, regels worden gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel80
  - number: 80.1.a
    text: het vervoer van accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel80
  - number: 80.1.b
    text: het leveren van accijnsgoederen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel80
  - number: 80.1.c
    text: het voorhanden hebben van accijnsgoederen buiten een accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel80
  - number: '80.2'
    text: Het eerste lid is niet van toepassing op accijnsgoederen die zijn geplaatst onder een douaneschorsingsregeling.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel80
  - number: '80.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel80
  - number: '81'
    text: |-
      In de vergunning voor een accijnsgoederenplaats voor tabaksproducten kan worden toegestaan dat de vergunninghouder
      onder daarbij te stellen voorwaarden gedeeltelijk tot verbruik bereide tabak en tabaksproducten, al
      dan niet voorzien van accijnszegels, tijdelijk buiten de accijnsgoederenplaats bepaalde bewerkingen of
      verpakkingshandelingen kan laten ondergaan zonder dat het tijdelijk buiten de accijnsgoederenplaats brengen van die
      producten, in afwijking van [artikel 2, eerste lid, onderdeel a][ref1], wordt aangemerkt als uitslag tot verbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '82.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing van de accijns van tabaksprodukten,
      regels worden gesteld met betrekking tot de handel in en het vervoer van ruwe tabak en van gedeeltelijk tot
      verbruik bereide tabak.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel82
  - number: '82.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel82
  - number: '83.1'
    text: |-
      Accijnsgoederenplaatsen en plaatsen ten aanzien waarvan het aldaar vervaardigen of voorhanden hebben van
      accijnsgoederen is onderworpen aan beperkende bepalingen zijn onderworpen aan onderzoek.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel83
  - number: '83.2'
    text: |-
      Aan onderzoek zijn mede onderworpen vervoermiddelen. [Artikel 50 van de Algemene wet inzake rijksbelastingen][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel50
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '50'
  - number: '83.3'
    text: |-
      In afwijking van [artikel 50, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] kan de toegang tot
      een ingevolge het eerste en het tweede lid aan onderzoek onderworpen plaats of vervoermiddel op elk tijdstip worden
      gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel50
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '50'
  - number: '83.4'
    text: |-
      Ten behoeve van het onderzoek, bedoeld in het tweede lid, is, overeenkomstig bij ministeriële regeling te stellen
      regels, op vordering van de inspecteur of een door hem aangewezen ambtenaar:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel83
  - number: 83.4.a
    text: |-
      de gezagvoerder van een schip gehouden het schip terstond vaart te doen minderen, te doen bijdraaien of te doen
      stilhouden en aanleggen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel83
  - number: 83.4.b
    text: |-
      de bestuurder van een ander vervoermiddel dan een schip gehouden dit terstond te doen stilhouden en, indien het
      vervoermiddel door mechanische kracht wordt voortbewogen, de motor buiten werking te stellen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel83
  - number: '83.5'
    text: |-
      De in het vierde lid bedoelde ambtenaren zijn bevoegd een vervoermiddel, als bedoeld in het vierde lid, te brengen
      of te doen brengen naar een nabij gelegen plaats. De gezagvoerder of bestuurder is verplicht desgevorderd zijn
      voor het onderzoek en het vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het vervoermiddel
      te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel83
  - number: '84.1'
    text: |-
      De inspecteur of een door hem aangewezen ambtenaar die het onderzoek verricht, kan vorderen dat van goederen één of
      meer monsters worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84
  - number: '84.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent het nemen van monsters.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84
  - number: 84a.1
    text: |-
      In geval van verhoging van de accijns, bedoeld in [artikel 27, eerste lid][ref1], wordt ter zake van het bij
      het ingaan van die verhoging voorhanden hebben in een opslagplaats van de desbetreffende minerale oliën, accijns
      geheven, die per 1000 L bij een temperatuur van 15°C onderscheidenlijk per 1000 kg gelijk is aan de verhoging
      van het daarvoor in artikel 27, eerste lid, vermelde bedrag. Onder het voorhanden hebben wordt mede begrepen het
      vervoer naar een opslagplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 84a.2
    text: 'Aan de accijns, bedoeld in het eerste lid, zijn niet onderworpen minerale oliën:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
  - number: 84a.2.a
    text: |-
      waarvoor het tijdstip waarop de accijns, bedoeld in [artikel 27, eerste lid][ref1], verschuldigd wordt, is gelegen
      op of na het tijdstip van de in het eerste lid bedoelde verhoging;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 84a.2.b
    text: waarvoor een vrijstelling van accijns geldt.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
  - number: 84a.3
    text: |-
      Onder opslagplaats wordt verstaan elk gebouw of terrein waar minerale oliën als bedoeld in het eerste lid voor
      commerciële doeleinden voorhanden zijn. Opslagplaatsen in gebruik bij een zelfde persoon worden te zamen als één
      opslagplaats beschouwd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
  - number: 84a.4
    text: |-
      De accijns, bedoeld in het eerste lid, wordt geheven van de eigenaar van de in een opslagplaats voorhanden minerale
      oliën en moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
  - number: 84a.5
    text: |-
      In afwijking van [artikel 10, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1], wordt uiterlijk de
      vijfde werkdag na het ingaan van de verhoging aangifte gedaan van de hoeveelheden van de aan de accijns, bedoeld in
      het eerste lid, onderworpen onderscheiden minerale oliën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
  - number: 84a.6
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aangifte.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
  - number: 84a.7
    text: |-
      De heffing van accijns als bedoeld in het eerste lid blijft achterwege indien de te heffen accijns niet meer
      bedraagt dan € 250.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84a
  - number: 84b.1
    text: |-
      In geval van verlaging van de accijns, bedoeld in [artikel 27, eerste lid][ref1], wordt voor de desbetreffende
      minerale oliën die bij het ingaan van de verlaging voorhanden zijn in een opslagplaats, op verzoek teruggaaf van
      accijns verleend, die per 1000 L bij een temperatuur van 15° C onderscheidenlijk per 1000 kg gelijk is aan de
      verlaging van het daarvoor in artikel 27, eerste lid, vermelde bedrag. Onder voorhanden zijn wordt mede begrepen
      vervoer naar een opslagplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 84b.2
    text: |-
      [Artikel 84a, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel84a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 84a
        hoofdstuk: VI
        afdeling: 2A
  - number: 84b.3
    text: |-
      De eigenaar van de in de opslagplaats voorhanden minerale oliën dient uiterlijk de vijfde werkdag na het ingaan van
      de verlaging het verzoek om teruggaaf te doen bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84b
  - number: 84b.4
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84b
  - number: 84b.5
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het verzoek om teruggaaf.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84b
  - number: 84c
    text: |-
      Bij wijziging van de accijns op grond van [artikel 27][ref1] kan bij de daartoe strekkende ministeriële regeling
      worden bepaald dat [artikel 84][ref2] of [artikel 84][ref3] geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel84a
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel84b
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 27a
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 84a
        hoofdstuk: VI
        afdeling: 2A
      - id: ref3
        bwb_id: BWBR0005251
        artikel: 84b
        hoofdstuk: VI
        afdeling: 2A
  - number: '85.1'
    text: |-
      Bij algemene maatregel van bestuur kan, onder daarbij te stellen voorwaarden en beperkingen, worden bepaald dat
      accijnsgoederen voorhanden mogen zijn in een douane-entrepot.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel85
  - number: '85.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel85
  - number: '86.1'
    text: |-
      De inspecteur kan vereenvoudigde procedures vaststellen voor veelvuldige en regelmatige overbrengingen
      van accijnsgoederen onder een accijnsschorsingsregeling die op de grondgebieden van twee of meer lidstaten
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel86
  - number: '86.2'
    text: |-
      De vereenvoudigde procedures, bedoeld in het eerste lid, worden vastgesteld in overleg met de desbetreffende
      lidstaten en vastgelegd in een of meer overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel86
  - number: '86.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld ten aanzien van de toepassing
      van de vereenvoudigde procedures en overeenkomsten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel86
  - number: '86.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel86
  - number: '89.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel89
  - number: '89.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel89
  - number: '90.1'
    text: |-
      Het is niet toegestaan een distilleertoestel te vervaardigen of voorhanden te hebben zonder een daartoe strekkende
      vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: '90.2'
    text: |-
      Onder een distilleertoestel wordt verstaan elk toestel - ook indien dit niet gereed is voor dadelijk gebruik - dat
      geschikt is voor het afscheiden van ethanol uit ethanolhoudende stoffen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: '90.3'
    text: De vergunning wordt op verzoek verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: '90.4'
    text: |-
      Het verlenen, het aanpassen en het intrekken van een vergunning alsmede het afwijzen van een verzoek daartoe
      geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: '90.5'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het zesde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: '90.6'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het vijfde lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: '90.7'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: 90.7.a
    text: regels worden gesteld met betrekking tot de in de vergunning op te nemen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: 90.7.b
    text: distilleertoestellen worden aangewezen waarvoor geen vergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
  - number: '90.8'
    text: |-
      [Artikel 83][ref1] is van overeenkomstige toepassing op plaatsen waar distilleertoestellen worden vervaardigd of
      voorhanden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel83
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '83'
        hoofdstuk: VI
        afdeling: '2'
  - number: '90.9'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de vergunning als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '91.1'
    text: |-
      Het is niet toegestaan minerale oliën die zijn voorzien van bij ministeriële regeling voorgeschreven
      herkenningsmiddelen buiten een accijnsgoederenplaats voorhanden te hebben samen met middelen die de afscheiding,
      opheffing of verandering van die herkenningsmiddelen in deze oliën kunnen bewerkstelligen of bevorderen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: '91.2'
    text: |-
      Het is niet toegestaan minerale oliën die zijn voorzien van bij ministeriële regeling voorgeschreven
      herkenningsmiddelen dan wel bestanddelen daarvan bevatten buiten een accijnsschorsingsregeling of een
      douaneschorsingsregeling voorhanden te hebben anders dan in:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: 91.2.a
    text: |-
      tanks van waaruit minerale oliën worden afgeleverd in de brandstoftanks van andere schepen dan pleziervaartuigen,
      mits deze schepen in bezit zijn van en gebruikt worden door degene die de beschikking heeft over de eerstgenoemde
      tanks;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: 91.2.b
    text: |-
      brandstoftanks van schepen, andere dan pleziervaartuigen, mits de minerale olie wordt gebruikt voor de aandrijving
      van deze schepen of als scheepsbehoeften aan boord van deze schepen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: 91.2.c
    text: |-
      opslagtanks voor minerale oliën die zijn bestemd om van daaruit te worden afgeleverd in de brandstoftanks van
      andere schepen dan pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: 91.2.d
    text: ladingtanks van vaartuigen, voertuigen en treinwagons.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: '91.3'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden en beperkingen, in bijzondere gevallen
      ontheffing worden verleend ten aanzien van de in het eerste en tweede lid bedoelde verboden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: '91.4'
    text: |-
      Bij ministeriële regeling kunnen voorwaarden en beperkingen worden gesteld ten aanzien van plaatsen waar minerale
      oliën voorzien van herkenningsmiddelen voorhanden mogen zijn.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel91
  - number: '92.1'
    text: Het is niet toegestaan bij ministeriële regeling voorgeschreven herkenningsmiddelen toe te voegen aan lichte olie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel92
  - number: '92.2'
    text: |-
      Het is niet toegestaan lichte olie voorhanden te hebben die is voorzien van bij ministeriële regeling
      voorgeschreven herkenningsmiddelen of bestanddelen van die herkenningsmiddelen bevat.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel92
  - number: '93.1'
    text: |-
      Het is niet toegestaan tabaksproducten die zijn voorzien van accijnszegels te brengen vanuit een
      accijnsgoederenplaats voor tabaksproducten naar een andere accijnsgoederenplaats voor tabaksproducten of te
      plaatsen onder een douaneschorsingsregeling.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel93
  - number: '93.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel93
  - number: 93.2.a
    text: |-
      voor de in dat lid bedoelde accijnsgoederenplaats ingevolge [artikel 53, derde lid][ref1], aangifte wordt gedaan
      door dezelfde vergunninghouder;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
        hoofdstuk: III
        afdeling: '3'
  - number: 93.2.b
    text: |-
      de accijnszegels zijn aangevraagd door de vergunninghouder van de accijnsgoederenplaats waarin de tabaksproducten
      worden ingeslagen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel93
  - number: '93.3'
    text: De inspecteur kan in aanvulling op het bepaalde in het tweede lid, onderdeel b, nadere voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel93
  - number: '94.1'
    text: |-
      Het is degene die op grond van [artikel 75][ref1] accijnszegels kan aanvragen niet toegestaan een zelfde
      tabaksprodukt onder meer dan één kleinhandelsprijs in de handel te brengen of te doen brengen, tenzij in het merk
      of door een merk waaronder het is verpakt op duidelijke wijze een onderscheid is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '75'
        hoofdstuk: VI
        afdeling: '1'
  - number: '94.2'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, afwijking van het eerste lid worden
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel94
  - number: '95.1'
    text: |-
      Het is niet toegestaan tabaksprodukten te verkopen, te koop aan te bieden of af te leveren indien de verpakking
      niet voldoet aan de bij of krachtens [artikel 78][ref1] gestelde voorwaarden of de accijnszegels niet ongeschonden
      op de voorgeschreven wijze zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel78
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '78'
        hoofdstuk: VI
        afdeling: '1'
  - number: '95.2'
    text: |-
      Het is niet toegestaan tabaksprodukten aan anderen dan wederverkopers te verkopen, te koop aan te bieden of af te
      leveren voor:
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95
  - number: 95.2.a
    text: een lagere prijs dan die is vermeld op de accijnszegels;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95
  - number: 95.2.b
    text: een hogere prijs dan die is vermeld op de accijnszegels.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95
  - number: '95.3'
    text: |-
      Onder het bepaalde in het tweede lid, onderdeel a, wordt mede begrepen het bij de verkoop aan anderen dan
      wederverkopers in enigerlei vorm verstrekken van geschenken, toegiften en bonnen alsmede het verlenen van
      medewerking aan handelingen die zijn gericht op de bevoordeling van derden.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95
  - number: '95.4'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden, afwijking van het eerste lid worden
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95
  - number: 95a.1
    text: |-
      Ingeval er een autonome accijnsverhoging van de totale accijns van sigaretten of rooktabak plaatsvindt en er
      tussen de publicatiedatum van de als gevolg hiervan ontstane nieuwe accijnstarieven voor deze tabaksproducten
      en de ingangsdatum van deze nieuwe accijnstarieven ten minste twee maanden zijn gelegen, is het vanaf de eerste
      dag van de tweede kalendermaand volgend op de maand waarin de accijnswijziging plaatsvindt niet toegestaan dat
      tabaksproduct aan wederverkopers te verkopen, te koop aan te bieden of af te leveren indien de verpakking voorzien
      is van de vóór de ingangsdatum van de nieuwe accijnstarieven bij de uitslag tot verbruik voor het desbetreffende
      tabaksproduct voorgeschreven accijnszegel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
  - number: 95a.2
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
  - number: 95a.2.a
    text: |-
      autonome accijnsverhoging: wijziging van de accijnstarieven, genoemd in [artikel 35][ref1], die wat betreft de
      totale accijns tot een verhoging leidt, en die niet voortvloeit uit [artikel 36][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel36
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '35'
        hoofdstuk: II
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '36'
        hoofdstuk: II
        afdeling: '7'
  - number: 95a.2.b
    text: |-
      rooktabak: rooktabak als bedoeld in [artikel 32][ref1], pijptabak niet daaronder begrepen;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel32
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '32'
        hoofdstuk: II
        afdeling: '7'
  - number: 95a.2.c
    text: |-
      pijptabak: rooktabak als bedoeld in [artikel 32][ref1], bestemd om te worden gerookt met een pijp.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel32
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '32'
        hoofdstuk: II
        afdeling: '7'
  - number: 95a.3
    text: |-
      Onder een wederverkoper als bedoeld in het eerste lid wordt mede verstaan een verkoopautomaat bestemd voor
      de verkoop van tabaksproducten. Onder afleveren als bedoeld in het eerste lid aan een verkoopautomaat bestemd
      voor de verkoop van tabaksproducten wordt niet verstaan het afleveren van tabaksproducten die uit een andere
      verkoopautomaat van dezelfde eigenaar afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
  - number: 95a.4
    text: |-
      Onder afleveren als bedoeld in het eerste lid wordt voor een bedrijf, waarvan het distributiecentrum en de
      detailhandel tot dezelfde rechtspersoon behoren, mede verstaan het afleveren door het distributiecentrum aan de
      detailhandel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
  - number: 95a.5
    text: |-
      Onder afleveren als bedoeld in het eerste lid wordt niet verstaan het retourneren van sigaretten of rooktabak door
      wederverkopers aan diegenen die daaraan voorafgaand deze tabaksproducten aan deze wederverkopers hebben verkocht
      of afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
  - number: 95a.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel95a
  - number: '96'
    text: 'Het is een ieder die toestemming heeft om accijnszegels aan te vragen niet toegestaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel96
  - number: 96.a
    text: gebruikte accijnszegels voorhanden te hebben;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel96
  - number: 96.b
    text: ongebruikte accijnszegels over te dragen aan anderen dan de inspecteur;
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel96
  - number: 96.c
    text: ongebruikte accijnszegels te betrekken van anderen dan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel96
  - number: '97'
    text: |-
      Degene die opzettelijk een in [artikel 5][ref1] opgenomen verbod overtreedt, wordt gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven accijns.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel5
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '5'
        hoofdstuk: I
        afdeling: '2'
  - number: '98'
    text: |-
      Degene die opzettelijk een accijnsgoed waarvoor vrijstelling of teruggaaf van accijns is verleend een bestemming
      geeft waarvoor geen vrijstelling of teruggaaf van accijns zou zijn verleend, wordt gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven accijns.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel98
  - number: '99.1'
    text: |-
      Degene die het in [artikel 90, eerste lid][ref1], opgenomen verbod overtreedt, wordt gestraft met geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '90'
        hoofdstuk: VII
        afdeling: '1'
  - number: '99.2'
    text: |-
      Degene die het in [artikel 90, eerste lid][ref1], opgenomen verbod overtreedt terwijl hij weet of redelijkerwijs
      kan weten dat het distilleertoestel bestemd is of zal worden bestemd om te worden gebruikt tot ontduiking van de
      accijns, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel90
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '90'
        hoofdstuk: VII
        afdeling: '1'
  - number: '100.1'
    text: |-
      Degene die een in de artikelen 91, eerste en tweede lid, of 92 opgenomen verbod overtreedt, wordt gestraft met
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel100
  - number: '100.2'
    text: |-
      Degene die een van de in het eerste lid bedoelde verboden opzettelijk overtreedt, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel100
  - number: '101.1'
    text: |-
      Degene die een in de[ artikelen 93, eerste lid][ref1], [94, eerste lid][ref2], [95, eerste en tweede lid][ref3], of
      [96][ref4] opgenomen verbod overtreedt, wordt gestraft met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel95
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel96
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '93'
        hoofdstuk: VII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '94'
        hoofdstuk: VII
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '95'
        hoofdstuk: VII
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '96'
        hoofdstuk: VII
        afdeling: '1'
  - number: '101.2'
    text: |-
      Degene die een van de in het eerste lid bedoelde verboden opzettelijk overtreedt, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel101
  - number: '102.1'
    text: |-
      Degene die tabaksprodukten die in strijd met de wettelijke bepalingen niet zijn voorzien van de voorgeschreven
      accijnszegels uitslaat tot verbruik, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel102
  - number: '102.2'
    text: |-
      Degene die het in het eerste lid bedoelde verbod opzettelijk overtreedt, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel102
  - number: 102a.1
    text: |-
      Degene die een in [artikel 95a][ref1] opgenomen verbod overtreedt, pleegt een verzuim ter zake waarvan de
      inspecteur hem een boete van € 5.278 kan opleggen of, indien dit bedrag hoger is, ten hoogste tweemaal het bedrag
      van de accijns dat geheven zou zijn indien de verpakking voorzien was geweest van het per ingangsdatum van de
      nieuwe accijnstarieven, bedoeld in artikel 95a, bij de uitslag tot verbruik voor het desbetreffende tabaksproduct
      voorgeschreven accijnszegel.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel95a
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 95a
        hoofdstuk: VII
        afdeling: '1'
  - number: 102a.2
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: '103'
    text: De inwerkingtreding van deze wet wordt bij wet geregeld.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel103
  - number: '104'
    text: Deze wet kan worden aangehaald als Wet op de accijns.
    url: https://wetten.overheid.nl/BWBR0005251/2016-05-01#Artikel104
