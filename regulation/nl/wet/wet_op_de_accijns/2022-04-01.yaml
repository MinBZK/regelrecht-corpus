        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: 5.3.e
    text: |-
      het handmatig produceren van een sigaret in de persoonlijke sfeer, voor zover die sigaret wordt aangewend voor
      eigen gebruik, daaronder begrepen het door middel van een eenvoudige, niet-industriële handeling in een huls van
      sigarettenpapier schuiven of met sigarettenpapier omhullen van rooktabak.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: '5.4'
    text: 'De in het derde lid, onderdeel d, bedoelde minerale oliën zijn de producten van de GN-codes:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.a
    text: |-
      1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.b
    text: 2707 10, 2707 20, 2707 30 en 2707 50;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.c
    text: |-
      2710 12 tot en met 2710 19 68 en 2710 20 tot en met 2710 20 39 en 2710 20 90 – alleen voor producten waarvan minder
      dan 90% van het volume (distillatieverliezen inbegrepen) overdistilleert bij 210°C en 65% of meer van het volume
      (distillatieverliezen inbegrepen) overdistilleert bij 250°C (methode EN ISO 3405 of methode ASTM D86) –; GN-codes
      2710 12 21, 2710 12 25, 2710 19 29 en 2710 20 90 – alleen voor producten waarvan minder dan 90% van het volume
      (distillatieverliezen inbegrepen) overdistilleert bij 210°C en 65% of meer van het volume (distillatieverliezen
      inbegrepen) overdistilleert bij 250°C (methode EN ISO 3405 of methode ASTM D86) – alleen indien deze in bulk worden
      vervoerd;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.d
    text: 2711, met uitzondering van de producten van de GN-codes 2711 11, 2711 21 en 2711 29;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.e
    text: 2901 10;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.f
    text: 2902 20, 2902 30, 2902 41, 2902 42, 2902 43 en 2902 44;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.g
    text: |-
      2905 11 00, die niet langs synthetische weg zijn verkregen en die zijn bestemd om te worden gebruikt als
      motorbrandstof of als brandstof voor verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.h
    text: 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: 5.4.i
    text: |-
      3824 99 86, 3824 99 92 – met uitzondering van roestwerende preparaten die aminen als werkzame bestanddelen bevatten
      en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van dergelijke producten –,
      3824 99 93, 3824 99 96 – met uitzondering van roestwerende preparaten die aminen als werkzame bestanddelen bevatten
      en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van dergelijke producten –,
      3826 00 10 en 3826 00 90, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel5
  - number: '6'
    text: 'Onder bier wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel6
  - number: 6.a
    text: elk product van GN-code 2203; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel6
  - number: 6.b
    text: |-
      elk product van GN-code 2206 dat een mengsel van bier als bedoeld in onderdeel *a* en niet-alcoholhoudende dranken
      bevat;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel6
  - number: '7.1'
    text: 'De accijns bedraagt per hectoliter voor bier met een extractgehalte, uitgedrukt in percenten Plato, van:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: 7.1.a
    text: minder dan 7 € 8,83;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: 7.1.b
    text: 7 tot 11 € 28,49;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: 7.1.c
    text: 11 tot 15 € 37,96;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: 7.1.d
    text: 15 en meer € 47,48.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.2'
    text: |-
      Met betrekking tot bier als bedoeld in [artikel 6, onderdeel b][ref1], met een alcoholgehalte van niet meer dan
      1,2%vol wordt het tarief van het eerste lid, onderdeel *a*, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel6
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.3'
    text: |-
      In afwijking in zoverre van het eerste lid bedraagt de accijns voor bier dat is vervaardigd in een
      accijnsgoederenplaats waar in het voorafgaande kalenderjaar niet meer dan 200 000 hl bier is vervaardigd 92,5/100
      deel van de in de onderdelen b, c en d vermelde bedragen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.4'
    text: 'Het derde lid vindt slechts toepassing met betrekking tot een accijnsgoederenplaats die:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: 7.4.a
    text: juridisch en economisch onafhankelijk is van een andere accijnsgoederenplaats waar bier wordt vervaardigd;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: 7.4.b
    text: |-
      gebruik maakt van installaties die in fysiek opzicht losstaan van die van een andere accijnsgoederenplaats waar
      bier wordt vervaardigd; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: 7.4.c
    text: |-
      geen bier vervaardigt onder licentie, tenzij het onder licentie vervaardigde bier slechts een klein gedeelte van de
      totale produktie betreft, met dien verstande dat het derde lid geen toepassing vindt met betrekking tot het onder
      licentie vervaardigde bier.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.5'
    text: |-
      Voor de toepassing van het derde en vierde lid wordt een samenwerkingsverband van twee of meer
      accijnsgoederenplaatsen waar gezamenlijk in het voorafgaande kalenderjaar niet meer dan 200 000 hl bier is
      vervaardigd, aangemerkt als één accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.6'
    text: |-
      Onder extractgehalte wordt verstaan het gehalte van de in de stamwort opgeloste niet-vluchtige stoffen, vermeerderd
      met het gehalte van de na de gisting aan het bier toegevoegde stoffen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.7'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de toepassing van het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.8'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het extractgehalte.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.9'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt, met inachtneming van bij ministeriële regeling te
      stellen regels, het volume van bier in geconcentreerde vorm herleid tot het volume van voor gebruik gereed bier.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '7.10'
    text: Dit artikel is van overeenkomstige toepassing op bier dat afkomstig is uit een brouwerij buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel7
  - number: '8'
    text: Wijn wordt onderscheiden in niet-mousserende wijn en mousserende wijn.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel8
  - number: 8a.1
    text: |-
      Onder niet-mousserende wijn worden verstaan alle producten van GN-codes 2204 en 2205, met uitzondering van
      mousserende wijn als bedoeld in [artikel 9, eerste lid][ref1], met:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel9
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 8a.1.a
    text: |-
      een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 15%vol, voor zover de alcohol in het eindproduct
      volledig door gisting is verkregen; of
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel8a
  - number: 8a.1.b
    text: |-
      een alcoholgehalte van meer dan 15%vol maar niet meer dan 18%vol, voor zover zij zonder enige verrijking zijn
      geproduceerd en de alcohol in het eindproduct volledig door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel8a
  - number: 8a.2
    text: |-
      Onder niet-mousserende wijn worden mede verstaan alle niet in het eerste lid bedoelde producten van GN-codes
      2204 en 2205, alsmede producten van GN-code 2206, die ingevolge [artikel 6][ref1] niet als bier en ingevolge
      [artikel 9, tweede lid][ref2], niet als mousserende wijn worden aangemerkt, met:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel9
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 8a.2.a
    text: een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 10%vol; of
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel8a
  - number: 8a.2.b
    text: |-
      een alcoholgehalte van meer dan 10%vol maar niet meer dan 15%vol, voor zover de alcohol in het product volledig
      door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel8a
  - number: '9.1'
    text: |-
      Onder mousserende wijn worden verstaan alle producten van GN-codes 2204 10, 2204 21 06, 2204 21 07, 2204 21 08,
      2204 21 09, 2204 29 10 en 2205, die:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel9
  - number: 9.1.a
    text: |-
      zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel9
  - number: 9.1.b
    text: |-
      een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 15%vol voor zover de alcohol in het eindproduct
      volledig door gisting is verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel9
  - number: '9.2'
    text: |-
      Onder mousserende wijn worden mede verstaan alle producten van GN-code 2206 00 31 en 2206 00 39, alsmede de niet in
      het eerste lid genoemde producten van GN-codes 2204 10, 2204 21 06, 2204 21 07, 2204 21 08, 2204 21 09, 2204 29 10
      en 2205, die:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel9
  - number: 9.2.a
    text: |-
      zijn verpakt in flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel
      een overdruk van 3 bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel9
  - number: 9.2.b
    text: |-
      een alcoholgehalte hebben van meer dan 1,2%vol maar niet meer dan 13%vol, dan wel een alcoholgehalte hebben
      van meer dan 13%vol maar niet meer dan 15%vol voor zover de alcohol in het eindproduct volledig door gisting is
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel9
  - number: '10'
    text: |-
      De accijns bedraagt per hectoliter, waarbij een gedeelte van een hectoliter rekenkundig wordt afgerond op twee
      decimalen, voor zowel niet-mousserende wijn als mousserende wijn met een alcoholgehalte van:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel10
  - number: 10.a
    text: niet meer dan 8,5% vol € 44,24;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel10
  - number: 10.b
    text: meer dan 8,5% vol € 88,30.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel10
  - number: 11a
    text: Tussenproducten worden onderscheiden in niet-mousserende tussenproducten en mousserende tussenproducten.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel11a
  - number: 11b
    text: |-
      Onder niet-mousserende tussenproducten worden verstaan alle niet als bier of wijn aan te merken producten van GN-
      codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die ingevolge
      [artikel 11][ref1] niet als mousserende tussenproducten worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel11c
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 11c
        hoofdstuk: II
        afdeling: 2a
  - number: 11c
    text: |-
      Onder mousserende tussenproducten worden verstaan alle niet als bier of wijn aan te merken producten van GN-codes
      2204, 2205 en 2206 met een alcoholgehalte van meer dan 1,2%vol maar niet meer dan 22%vol, die zijn verpakt in
      flessen met een champignonvormige stop die door draden of banden of anderszins is geborgd, ofwel een overdruk van 3
      bar of meer hebben die is teweeggebracht door koolzuurgas in oplossing.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel11c
  - number: 11d
    text: |-
      De accijns bedraagt per hectoliter, waarbij een gedeelte van een hectoliter rekenkundig wordt afgerond op twee
      decimalen, voor zowel niet-mousserende tussenproducten als mousserende tussenproducten met een alcoholgehalte van:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel11d
  - number: 11d.a
    text: niet meer dan 15% vol € 105,98;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel11d
  - number: 11d.b
    text: meer dan 15% vol € 149,30.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel11d
  - number: '12.1'
    text: 'Onder overige alcoholhoudende producten worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel12
  - number: 12.1.a
    text: |-
      alle producten van GN-codes 2207 en 2208 met een alcoholgehalte van meer dan 1,2%vol, ook wanneer deze producten
      bestanddeel zijn van een product van een GN-code uit een ander hoofdstuk van de gecombineerde nomenclatuur;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel12
  - number: 12.1.b
    text: producten van GN-codes 2204, 2205 en 2206 met een alcoholgehalte van meer dan 22%vol.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel12
  - number: '12.2'
    text: |-
      Onder overige alcoholhoudende producten worden mede verstaan gedistilleerde dranken als bedoeld in het eerste lid,
      wanneer deze dranken andere producten, al dan niet in oplossing, bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel12
  - number: '13'
    text: |-
      De accijns bedraagt voor overige alcoholhoudende producten per hectoliter bij een temperatuur van 20°C per
      volumeprocent alcohol € 16,86, waarbij een gedeelte van een hectoliter rekenkundig wordt afgerond op drie decimalen
      en van een volumeprocent alcohol naar beneden wordt afgerond op één decimaal.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel13
  - number: '14'
    text: |-
      Voor de toepassing van [artikel 13][ref1] wordt het volume van overige alcoholhoudende producten die bestaan uit
      een vloeistof waarin zich bestanddelen in vaste vorm bevinden, gesteld op het volume van het gehele product.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel13
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '13'
        hoofdstuk: II
        afdeling: '3'
  - number: '25.1'
    text: 'Onder minerale oliën worden verstaan de producten van de GN-codes:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.a
    text: |-
      1507 tot en met 1518, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.b
    text: 2706 tot en met 2710;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.c
    text: 2711, met uitzondering van aardgas;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.d
    text: 2712 tot en met 2715;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.e
    text: 2901 en 2902;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.f
    text: |-
      2905 11 00, die niet langs synthetische weg zijn verkregen en zijn bestemd om te worden gebruikt als motorbrandstof
      of als brandstof voor verwarming;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.g
    text: 3403;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.h
    text: 3811;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.i
    text: 3817;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.1.j
    text: |-
      3824 99 86, 3824 99 92 – met uitzondering van roestwerende preparaten die aminen als werkzame bestanddelen bevatten
      en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van dergelijke producten –,
      3824 99 93, 3824 99 96 – met uitzondering van roestwerende preparaten die aminen als werkzame bestanddelen bevatten
      en anorganische preparaten voor het oplossen of voor het verdunnen van vernissen of van dergelijke producten –,
      3826 00 10 en 3826 00 90, indien deze zijn bestemd om te worden gebruikt als motorbrandstof of als brandstof voor
      verwarming.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: '25.2'
    text: 'Als minerale oliën worden mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.2.a
    text: |-
      andere producten dan minerale oliën als bedoeld in het eerste lid, die zijn bestemd voor gebruik, worden aangeboden
      voor verkoop of worden gebruikt als motorbrandstof, als additief of als vulstof in motorbrandstoffen;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: 25.2.b
    text: |-
      andere koolwaterstoffen dan bedoeld in het eerste lid of in onderdeel *a*, die zijn bestemd voor gebruik, worden
      aangeboden voor verkoop of worden gebruikt voor verwarmingsdoeleinden, met uitzondering van steenkool, bruinkool,
      turf, andere soortgelijke vaste koolwaterstoffen en aardgas.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel25
  - number: '26.1'
    text: |-
      Voor de toepassing van het tarief worden minerale oliën onderscheiden in lichte olie, halfzware olie, gasolie,
      zware stookolie, vloeibaar gemaakt petroleumgas en methaan.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '26.2'
    text: |-
      Lichte olie wordt onderscheiden in gelode lichte olie en ongelode lichte olie. Onder gelode lichte olie worden
      verstaan de producten van GN-codes 2710 12 31, 2710 12 51 en 2710 12 59. Onder ongelode lichte olie worden verstaan
      de producten van GN-codes 2710 12 41, 2710 12 45 en 2710 12 49.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '26.3'
    text: Onder halfzware olie worden verstaan de producten van GN-codes 2710 19 21 en 2710 19 25.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '26.4'
    text: |-
      Onder gasolie worden verstaan de producten van GN-codes 2710 19 43 tot en met 2710 19 48 en 2710 20 11 tot en met
      2710 20 19.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '26.5'
    text: |-
      Onder zware stookolie worden verstaan de producten van GN-codes 2710 19 62 tot en met 2710 19 68 en 2710 20 31 tot
      en met 2710 20 39.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '26.6'
    text: Onder vloeibaar gemaakt petroleumgas worden verstaan de producten van GN-codes 2711 12 11 tot en met 2711 19 00.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '26.7'
    text: Onder methaan worden verstaan de producten van GN-code 2711 29 00.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '26.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het bepalen van het loodgehalte van
      lichte olie.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel26
  - number: '27.1'
    text: 'De accijns bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27
  - number: 27.1.a
    text: |-
      lichte olie, per 1000 L bij een temperatuur van 15°C € 917,31 indien het gelode lichte olie betreft en € 823,71
      indien het ongelode lichte olie betreft;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27
  - number: 27.1.b
    text: halfzware olie en gasolie, per 1000 L bij een temperatuur van 15°C € 528,46;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27
  - number: 27.1.c
    text: zware stookolie, per 1 000 kg € 38,86;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27
  - number: 27.1.d
    text: vloeibaar gemaakt petroleumgas, per 1000 kg € 359,85;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27
  - number: 27.1.e
    text: methaan nihil.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27
  - number: '27.2'
    text: |-
      Voor de toepassing van het tarief als bedoeld in het eerste lid, onderdelen a en b, worden bij ministeriële
      regeling regels gesteld met betrekking tot de herleiding van de actuele hoeveelheden minerale oliën naar
      hoeveelheden bij een temperatuur van 15°C.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27
  - number: 27a
    text: |-
      De [artikelen 10.1][ref1] en [10.2 van de Wet inkomstenbelasting 2001][ref2] zijn van overeenkomstige toepassing op
      de in de [artikelen 27, eerste lid][ref3], [71e, tweede lid][ref4], en [71g, tweede lid][ref5], vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel71e
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel71g
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: 71e
        hoofdstuk: V
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: 71g
        hoofdstuk: V
        afdeling: '2'
  - number: '28.1'
    text: |-
      Andere minerale oliën dan die waarvoor in [artikel 27, eerste lid][ref1], een accijnstarief is vermeld, worden,
      indien zij zijn bestemd voor gebruik, worden aangeboden voor verkoop of worden gebruikt als brandstof voor
      verwarming of als motorbrandstof, aan de accijns onderworpen naar het ingevolge artikel 27, eerste lid, voor de
      gelijkwaardige brandstof of motorbrandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.2'
    text: |-
      Onverminderd het eerste lid worden minerale oliën van GN-codes 3811 11 10, 3811 11 90, 3811 19 00 en 3811 90 00
      voor de toepassing van het tarief gelijkgesteld met de motorbrandstof waaraan zij bestemd zijn te worden
      toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel28
  - number: '28.3'
    text: |-
      Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel a][ref1], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste lid][ref2], voor de gelijkwaardige motorbrandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.4'
    text: |-
      Minerale oliën als bedoeld in [artikel 25, tweede lid, onderdeel b][ref1], worden aan de accijns onderworpen naar
      het ingevolge [artikel 27, eerste lid][ref2], voor de gelijkwaardige brandstof geldende tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '25'
        hoofdstuk: II
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '27'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.5'
    text: |-
      Minerale oliën die kunnen worden gelijkgesteld met meer dan één soort minerale olie worden voor de toepassing
      van het tarief gelijkgesteld met de soort minerale olie die van de desbetreffende soorten het eerst is vermeld in
      [artikel 26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
        hoofdstuk: II
        afdeling: '6'
  - number: '28.6'
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op minerale oliën van GN-codes 3811 11 10, 3811 11 90, 3811 19 00
      en 3811 90 00 die aan meer dan een soort motorbrandstof kunnen worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel28
  - number: '29'
    text: Onder tabaksproducten wordt verstaan tot verbruik bereide tabak in de vorm van sigaren, sigaretten en rooktabak.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel29
  - number: '30.1'
    text: |-
      Onder sigaren worden verstaan de volgende producten, indien zij geschikt zijn om en, gelet op hun kenmerken en de
      normale verwachtingen van de consument, uitsluitend bestemd zijn om als zodanig te worden gerookt:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel30
  - number: 30.1.a
    text: tabaksrolletjes met een dekblad van natuurlijke tabak;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel30
  - number: 30.1.b
    text: |-
      tabaksrolletjes bestaande uit een gebroken melange, met een dekblad van gereconstitueerde tabak dat de normale
      kleur heeft van een sigaar en het product volledig omhult, in voorkomend geval met inbegrip van het filter, doch
      met uitzondering van het mondstuk, en waarvan het gewicht per stuk, zonder filter of mondstuk, ten minste 2,3 gram
      en niet meer dan 10 gram bedraagt en de omtrek over ten minste een derde van de lengte 34 mm of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel30
  - number: '30.2'
    text: |-
      Als sigaren worden mede aangemerkt producten die gedeeltelijk uit andere stoffen dan tabak bestaan, doch overigens
      voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel30
  - number: '31.1'
    text: |-
      Onder sigaretten worden verstaan niet als sigaren aan te merken tabaksrolletjes die geschikt zijn om als zodanig te
      worden gerookt, alsmede tabaksrolletjes die door middel van een eenvoudige niet-industriële handeling in een huls
      van sigarettenpapier worden geschoven of met sigarettenpapier worden omhuld.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel31
  - number: '31.2'
    text: |-
      Als sigaretten worden mede aangemerkt producten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel31
  - number: '32.1'
    text: Onder rooktabak wordt verstaan niet als sigaren of als sigaretten aan te merken voor roken geschikte tabak.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel32
  - number: '32.2'
    text: |-
      Als rooktabak worden mede aangemerkt producten die geheel of gedeeltelijk uit andere stoffen dan tabak bestaan,
      doch overigens voldoen aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel32
  - number: '35.1'
    text: 'De accijns bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel35
  - number: 35.1.a
    text: 'sigaren: een ad-valoremaccijns van 9% van de kleinhandelsprijs;'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel35
  - number: 35.1.b
    text: |-
      sigaretten: een ad-valoremaccijns van 5% van de kleinhandelsprijs alsmede een specifieke accijns van € 223,82 per
      1000 stuks, met dien verstande dat het minimumbedrag aan accijns in totaal ten minste € 243,25 bedraagt;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel35
  - number: 35.1.c
    text: 'rooktabak: een specifieke accijns van € 160,91 per kilogram.'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel35
  - number: '35.2'
    text: |-
      Onder de kleinhandelsprijs wordt verstaan de prijs, met inbegrip van alle belastingen en de kosten van de
      verpakking, waarvoor het desbetreffende product wordt verkocht aan anderen dan wederverkopers.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel35
  - number: '35.3'
    text: |-
      Voor de berekening van de accijns voor tabaksproducten die worden verbruikt binnen een accijnsgoederenplaats
      voor tabaksproducten wordt de kleinhandelsprijs gesteld op die van gelijke of soortgelijke producten die worden
      verbruikt buiten de accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel35
  - number: '35.4'
    text: |-
      Voor de berekening van de accijns wordt een tabaksrolletje als bedoeld in [artikel 31][ref1] aangemerkt als twee
      sigaretten wanneer het, zonder filter of mondstuk, meer dan 8 cm doch niet meer dan 11 cm lang is, en als drie
      sigaretten wanneer het, zonder filter of mondstuk, meer dan 11 cm doch niet meer dan 14 cm lang is, enzovoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel31
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '31'
        hoofdstuk: II
        afdeling: '7'
  - number: '36.1'
    text: |-
      Uiterlijk op 1 maart van elk jaar wordt voor sigaretten en rooktabak de gewogen gemiddelde kleinhandelsprijs
      bepaald op basis van alle tot verbruik uitgeslagen sigaretten respectievelijk rooktabak in het voorgaande
      kalenderjaar. De gewogen gemiddelde kleinhandelsprijs wordt gepubliceerd op de website van de rijksoverheid.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel36
  - number: '36.2'
    text: |-
      De gewogen gemiddelde kleinhandelsprijs is gelijk aan de op basis van de kleinhandelsprijs berekende totale waarde
      van alle tot verbruik uitgeslagen sigaretten respectievelijk rooktabak, gedeeld door de totale hoeveelheid tot
      verbruik uitgeslagen sigaretten respectievelijk rooktabak.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel36
  - number: '36.3'
    text: |-
      De specifieke accijns voor sigaretten mag niet hoger zijn dan 76,5% van de totale belastingdruk die resulteert uit
      de samenstelling van de specifieke accijns, de ad-valoremaccijns en de omzetbelasting die worden geheven over de
      gewogen gemiddelde kleinhandelsprijs.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel36
  - number: '36.4'
    text: |-
      Wanneer na een verhoging van de accijns van sigaretten de gewogen gemiddelde kleinhandelsprijs van sigaretten
      wijzigt en hierdoor de specifieke accijns, uitgedrukt als een percentage van de totale belastingdruk, meer dan
      76,5% van de totale belastingdruk bedraagt, wordt de specifieke accijns aangepast uiterlijk op 1 januari van het
      tweede jaar volgende op dat waarin de wijziging zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel36
  - number: '36.5'
    text: |-
      Aanpassing van de accijns van sigaretten als gevolg van de wijzigingen van de gewogen gemiddelde kleinhandelsprijs
      en de totale belastingdruk, bedoeld in het vierde lid, kan geschieden bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel36
  - number: '36.6'
    text: |-
      Een wijziging van de accijns van tabaksproducten treedt niet eerder in werking dan met ingang van de eerste dag van
      de vierde kalendermaand na afloop van de kalendermaand van publicatie.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel36
  - number: '37.1'
    text: 'Voor de toepassing van deze wet en de daarop gebaseerde regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel37
  - number: 37.1.a
    text: 'alcoholgehalte van een accijnsgoed: het aantal volumeprocenten alcohol daarin bij een temperatuur van 20 °C;'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel37
  - number: 37.1.b
    text: |-
      alcohol: ethanol en de alcoholen die bij het produceren of verwerken van ethanol zijn ontstaan voor zover zij niet
      zijn afgescheiden van de ethanol.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel37
  - number: '37.2'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het bepalen van het alcoholgehalte.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel37
  - number: '38'
    text: |-
      Bij ministeriële regeling kan met betrekking tot bier, wijn, tussenproducten, overige alcoholhoudende producten
      en tabaksproducten in kleinhandelsverpakking worden bepaald dat voor de berekening van de accijns het volume of de
      massa van die goederen dat is vermeld op die verpakking in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel38
  - number: '39'
    text: |-
      Een plaats kan alleen als accijnsgoederenplaats worden gebruikt indien daartoe een vergunning is verstrekt door
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel39
  - number: '40.1'
    text: 'Als accijnsgoederenplaats kan in aanmerking komen een plaats waar:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel40
  - number: 40.1.a
    text: accijnsgoederen worden geproduceerd of verwerkt;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel40
  - number: 40.1.b
    text: |-
      geen accijnsgoederen worden geproduceerd of verwerkt maar die dient voor het voorhanden hebben en de opslag van
      accijnsgoederen, indien de hoeveelheid accijnsgoederen die gemiddeld over een jaar voorhanden is of is opgeslagen
      meer bedraagt dan een bij ministeriële regeling per soort accijnsgoed vast te stellen hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel40
  - number: '40.2'
    text: |-
      Een plaats van waaruit accijnsgoederen worden geleverd aan een verbruiker kan niet in aanmerking komen als
      accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel40
  - number: '40.3'
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen kunnen plaatsen in afwijking van het bepaalde in het eerste en
      in het tweede lid in aanmerking komen als accijnsgoederenplaats.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel40
  - number: '41.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan met
      betrekking tot een accijnsgoederenplaats moet worden voldaan ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel41
  - number: 41.1.a
    text: de administratie en de administratieve organisatie;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel41
  - number: 41.1.b
    text: de locatie en de inrichting; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel41
  - number: 41.1.c
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel41
  - number: '41.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel41
  - number: '42.1'
    text: 'In het verzoek om een vergunning voor een accijnsgoederenplaats worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42
  - number: 42.1.a
    text: de soort of de soorten accijnsgoederen waarvoor de accijnsgoederenplaats is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42
  - number: 42.1.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar de soort, die naar verwachting in de accijnsgoederenplaats
      per jaar zal worden geproduceerd, verwerkt, dan wel gemiddeld over een jaar zonder verschuldigdheid van accijns
      voorhanden of opgeslagen zal zijn;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42
  - number: 42.1.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42
  - number: 42.1.d
    text: |-
      de administratie en de administratieve organisatie met betrekking tot de als accijnsgoederenplaats aan te merken
      plaats; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42
  - number: 42.1.e
    text: de locatie en de inrichting van de als accijnsgoederenplaats aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42
  - number: '42.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die het verzoek moet
      bevatten.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42
  - number: 42a.1
    text: |-
      In afwijking van [artikel 40, eerste lid][ref1], kan, indien degene die een vergunning voor een
      accijnsgoederenplaats wil verkrijgen niet beschikt over een plaats waar accijnsgoederen worden geproduceerd
      of verwerkt dan wel voorhanden worden gehouden of worden opgeslagen, een verzoek om een vergunning voor een
      accijnsgoederenplaats door de inspecteur worden toegewezen, indien deze persoon in Nederland is gevestigd en in de
      uitoefening van zijn bedrijf optreedt als:


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel40
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '40'
        hoofdstuk: III
        afdeling: '1'
  - number: 42a.1.a
    text: |-
      handelaar in minerale oliën, maar de door hem gekochte minerale oliën niet zelf voorhanden houdt of in opslag
      neemt;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.1.b
    text: |-
      tussenpersoon ten behoeve van vergunninghouders van een accijnsgoederenplaats voor minerale oliën waar minerale
      oliën worden geproduceerd of verwerkt dan wel opgeslagen;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.1.c
    text: |-
      bunkerhandelaar in minerale oliën, die de door hem gekochte minerale oliën uitsluitend aflevert aan boord van
      schepen in het kader van de bevoorrading van schepen, bedoeld in [artikel 66, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '66'
        hoofdstuk: V
        afdeling: '1'
  - number: 42a.2
    text: |-
      Bij algemene maatregel van bestuur worden voorwaarden en beperkingen gesteld waaronder de vergunning, bedoeld in
      het eerste lid, wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.3
    text: 'In het verzoek om een vergunning, bedoeld in het eerste lid, worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.3.a
    text: de soort of de soorten minerale oliën waarvoor de accijnsgoederenplaats zal worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.3.b
    text: |-
      de hoeveelheid minerale oliën, onderscheiden naar soort, die naar verwachting via de accijnsgoederenplaats per jaar
      zal worden verhandeld of waarvoor als tussenpersoon zal worden opgetreden;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.3.c
    text: de persoon op wiens naam de vergunning moet worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.3.d
    text: de administratie en administratieve organisatie van de persoon, bedoeld in onderdeel c.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: 42a.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel42a
  - number: '43.1'
    text: |-
      Een verzoek om een vergunning voor een accijnsgoederenplaats wordt door de inspecteur toegewezen tenzij hij
      gegronde redenen heeft om aan te nemen dat niet zal worden voldaan aan het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel43
  - number: '43.2'
    text: |-
      Een verzoek om een vergunning voor een accijnsgoederenplaats kan worden geweigerd aan degene die in de vijf aan het
      verzoek voorafgaande jaren onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake
      de accijns.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel43
  - number: '44.1'
    text: |-
      De vergunning vermeldt voor welke soort of voor welke soorten accijnsgoederen de accijnsgoederenplaats als zodanig
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel44
  - number: '44.2'
    text: |-
      In de vergunning bepaalt de inspecteur zo nodig nader op welke wijze aan de bij of krachtens deze wet gestelde
      voorwaarden moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel44
  - number: '44.3'
    text: |-
      De inspecteur kan in de vergunning nadere voorwaarden opnemen ter verzekering van een juiste toepassing van het
      bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel44
  - number: '45.1'
    text: De inspecteur kan de in de vergunning opgenomen voorwaarden aanpassen ter verzekering van de heffing.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel45
  - number: '45.2'
    text: |-
      Alvorens over te gaan tot aanpassing van de voorwaarden deelt de inspecteur de vergunninghouder mee welke
      omstandigheden naar zijn oordeel de door hem aan te geven aanpassing van de voorwaarden rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel45
  - number: '46'
    text: |-
      De vergunninghouder die een aanpassing van de in de vergunning opgenomen voorwaarden wenst, dient daartoe een
      verzoek in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel46
  - number: '47'
    text: |-
      Degene die een accijnsgoederenplaats wil overnemen, dient gezamenlijk met de vergunninghouder een verzoek in bij
      de inspecteur tot een zodanige aanpassing van de vergunning voor die accijnsgoederenplaats dat hij voor alle uit de
      vergunning voortvloeiende rechten en verplichtingen in de plaats treedt van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel47
  - number: '48'
    text: 'De vergunning voor een accijnsgoederenplaats kan door de inspecteur worden ingetrokken ingeval:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: 48.a
    text: niet wordt voldaan aan de in de vergunning opgenomen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: 48.b
    text: geen of niet voldoende zekerheid is gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: 48.c
    text: misbruik van de vergunning is gemaakt of een poging daartoe is gedaan;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: 48.d
    text: |-
      de vergunninghouder onherroepelijk is veroordeeld wegens het niet nakomen van een wettelijke bepaling inzake de
      accijns;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: 48.e
    text: |-
      de vergunninghouder in staat van faillissement verkeert of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: 48.f
    text: de vergunninghouder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: 48.g
    text: de vergunning gedurende een aaneengesloten periode van 12 maanden niet is gebruikt.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel48
  - number: '49.1'
    text: |-
      Het intrekken van een vergunning ingevolge [artikel 48, onderdeel a, b of g][ref1], kan niet eerder geschieden dan
      één maand nadat de inspecteur de vergunninghouder schriftelijk in kennis heeft gesteld van de omstandigheden die
      naar zijn oordeel het intrekken rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel48
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
  - number: '49.2'
    text: |-
      Het intrekken van een vergunning ingevolge [artikel 48, onderdeel c, d, e of f][ref1], kan onmiddellijk geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel48
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
  - number: '50.1'
    text: |-
      Het verlenen, het aanpassen en het intrekken van een vergunning voor een accijnsgoederenplaats alsmede het afwijzen
      van een verzoek daartoe geschieden bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50
  - number: '50.2'
    text: |-
      Binnen acht weken na ontvangst van het verzoek geeft de inspecteur een voor bezwaar vatbare beschikking op dat
      verzoek, dan wel zendt hij de in het derde lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de inspecteur de voor bezwaar vatbare beschikking niet binnen de in het tweede lid genoemde termijn kan
      geven, stelt hij belanghebbende daarvan onder opgaaf van redenen in kennis en noemt hij de termijn waarop de voor
      bezwaar vatbare beschikking wel zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50
  - number: 50a.1
    text: |-
      Een onderneming wordt alleen als geregistreerde geadresseerde aangemerkt indien daartoe een vergunning is verstrekt
      door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50a
  - number: 50a.2
    text: |-
      Een vergunning als geregistreerde geadresseerde wordt met betrekking tot tabaksproducten uitsluitend verleend,
      indien deze producten in een andere lidstaat van Nederlandse accijnszegels zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50a
  - number: 50a.3
    text: |-
      Voor een geregistreerde geadresseerde die slechts incidenteel accijnsgoederen ontvangt, wordt de vergunning,
      bedoeld in het eerste lid, verleend voor een welomschreven hoeveelheid accijnsgoederen, één welomschreven afzender
      en een welomschreven tijdvak. De inspecteur kan de vergunning beperken tot één overbrenging.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50a
  - number: 50a.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50a
  - number: 50b.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan een
      geregistreerde geadresseerde moet voldoen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50b
  - number: 50b.1.a
    text: de administratie; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50b
  - number: 50b.1.b
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50b
  - number: 50b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50b
  - number: 50c.1
    text: |-
      Degene die een vergunning als geregistreerde geadresseerde wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50c.2
    text: 'In het verzoek worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50c.2.a
    text: de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50c.2.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de geregistreerde geadresseerde
      per jaar uit een andere lidstaat zal worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50c.2.c
    text: de persoon op wiens naam de vergunning dient te worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50c.2.d
    text: de administratie van de desbetreffende accijnsgoederen; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50c.2.e
    text: de locatie van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50c
  - number: 50d.1
    text: |-
      Een onderneming wordt alleen als geregistreerde afzender aangemerkt indien daartoe een vergunning is verstrekt door
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.2
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing, regels worden gesteld waaraan een
      geregistreerde afzender moet voldoen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.2.a
    text: de administratie; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.2.b
    text: het stelsel van toezicht.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.3
    text: |-
      Degene die een vergunning voor een geregistreerde afzender wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.4
    text: 'In het verzoek worden gegevens verstrekt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.4.a
    text: de soort of de soorten accijnsgoederen waarvoor de vergunning is bestemd;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.4.b
    text: |-
      de hoeveelheid accijnsgoederen, onderscheiden naar soort, die naar verwachting door de geregistreerde afzender per
      jaar zal worden verzonden;
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.4.c
    text: de persoon op wiens naam de vergunning moet worden gesteld; en
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.4.d
    text: de administratie van de desbetreffende accijnsgoederen.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50d.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50d
  - number: 50e
    text: |-
      De[ artikelen 43][ref1], [44][ref2], [45][ref3], [46][ref4], [48][ref5], [49][ref6] en [50][ref7] zijn van
      overeenkomstige toepassing met betrekking tot de vergunning, bedoeld in [artikel 50a][ref8] of [50d][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0005251#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0005251#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0005251#Artikel50
      [ref8]: https://wetten.overheid.nl/BWBR0005251#Artikel50a
      [ref9]: https://wetten.overheid.nl/BWBR0005251#Artikel50d
    url: https://wetten.overheid.nl/BWBR0005251/2022-04-01#Artikel50e
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '43'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '44'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '45'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005251
        artikel: '46'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005251
        artikel: '48'
        hoofdstuk: III
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005251
        artikel: '49'
        hoofdstuk: III
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0005251
        artikel: '50'
        hoofdstuk: III
        afdeling: '2'
      - id: ref8
