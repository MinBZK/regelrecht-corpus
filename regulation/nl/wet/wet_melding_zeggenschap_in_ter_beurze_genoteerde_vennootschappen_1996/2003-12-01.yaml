---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_melding_zeggenschap_in_ter_beurze_genoteerde_vennootschappen_1996
regulatory_layer: WET
publication_date: '2006-08-01'
valid_from: '2003-12-01'
bwb_id: BWBR0008369
url: https://wetten.overheid.nl/BWBR0008369/2003-12-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet melding zeggenschap in ter beurze genoteerde
    vennootschappen opnieuw vast te stellen in verband met het verbeteren van de werking van deze wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.1.a
    text: |-
      vennootschap: een naamloze vennootschap naar Nederlands recht waarvan aandelen zijn toegelaten tot de officiële
      notering aan een in een lid-staat van de Europese Unie gelegen en werkzame effectenbeurs;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.1.b
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.1.c
    text: |-
      bandbreedtes: 0 tot 5, 5 tot 10, 10 tot 25, 25 tot 50, 50 tot 66⅔ en 66⅔ procent of meer, met dien verstande dat
      ten aanzien van een vennootschap als bedoeld in artikel 76*a* van boek 2 van het Burgerlijk Wetboek 0 tot 25, 25
      tot 50, 50 tot 66⅔ en 66⅔ procent of meer als bandbreedtes worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.1.d
    text: |-
      dochtermaatschappij: een dochtermaatschappij als bedoeld in artikel 24*a* van boek 2 van het Burgerlijk Wetboek of
      een rechtspersoon of vennootschap waarin de rechten en bevoegdheden als bedoeld in artikel 24*a* van boek 2 van het
      Burgerlijk Wetboek kunnen worden uitgeoefend door een natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.1.e
    text: 'een met een vennootschap gelieerde vennootschap: iedere vennootschap als bedoeld in onderdeel a'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.1.e.1°
    text: |-
      waarmee de vennootschap in een groep is verbonden of waarin de vennootschap een deelneming heeft als bedoeld in
      [artikel 24c van boek 2 van het Burgerlijk Wetboek][ref1], indien de meest recente vastgestelde omzet van die
      vennootschap tenminste 10% van de geconsolideerde omzet van de vennootschap bedraagt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 1.1.e.2°
    text: die meer dan 25% van het kapitaal van de vennootschap rechtstreeks of middellijk verschaft.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met een lid-staat van de Europese
      Unie gelijkgesteld een staat, niet zijnde een lid-staat van de Europese Unie, die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.3.a
    text: |-
      aandelen: certificaten van aandelen en rechten ingevolge een overeenkomst tot verkrijging van aandelen of
      certificaten van aandelen;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: 1.3.b
    text: 'stemmen: rechten ingevolge een overeenkomst op verkrijging van stemmen.'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: '1.4'
    text: |-
      Het derde lid is niet van toepassing bij het bepalen van het aantal aandelen in het geplaatste kapitaal van een
      vennootschap en het aantal stemmen dat op het geplaatste kapitaal van een vennootschap kan worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel1
  - number: '2.1'
    text: |-
      Een ieder die de beschikking krijgt of verliest over aandelen in het kapitaal van een vennootschap waardoor, naar
      hij weet of behoort te weten, het percentage van de aandelen waarover hij beschikt in een andere bandbreedte valt
      dan het percentage waarover hij onmiddellijk voordien beschikte, meldt dat onverwijld aan de vennootschap en aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2
  - number: '2.2'
    text: |-
      Een ieder die de beschikking krijgt of verliest over stemmen die op het geplaatste kapitaal van een vennootschap
      kunnen worden uitgebracht waardoor, naar hij weet of behoort te weten, het percentage van de stemmen waarover hij
      beschikt in een andere bandbreedte valt dan het percentage waarover hij onmiddellijk voordien beschikte, meldt dat
      onverwijld aan de vennootschap en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2
  - number: 2a.1
    text: |-
      Iedere bestuurder en commissaris van een vennootschap meldt aan de vennootschap en aan Onze Minister het
      aantal aandelen in het kapitaal van de vennootschap en in het kapitaal van de met de vennootschap gelieerde
      vennootschappen waarover hij beschikt, alsmede het aantal stemmen dat hij op het geplaatste kapitaal van de
      vennootschap en op het geplaatste kapitaal van de met de vennootschap gelieerde vennootschappen kan uitbrengen.
      Deze meldingen worden gedaan binnen twee weken na de aanwijzing of benoeming als bestuurder of commissaris.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.2
    text: |-
      Iedere bestuurder en commissaris van een naamloze vennootschap naar Nederlands recht meldt, indien deze
      vennootschap een vennootschap wordt in de zin van artikel 1, onderdeel a, onverwijld aan de vennootschap en aan
      Onze Minister:
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.2.a
    text: |-
      het aantal aandelen in het kapitaal van de vennootschap waarover hij beschikt en het aantal stemmen dat hij op het
      geplaatste kapitaal van de vennootschap kan uitbrengen; en
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.2.b
    text: |-
      het aantal aandelen in het kapitaal van de met de vennootschap gelieerde vennootschappen waarover hij beschikt
      alsmede het aantal stemmen dat hij op het geplaatste kapitaal van die vennootschappen kan uitbrengen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.3
    text: |-
      Iedere bestuurder en commissaris van een vennootschap meldt, indien een andere naamloze vennootschap naar
      Nederlands recht een met de vennootschap gelieerde vennootschap wordt in de zin van artikel 1, onderdeel e,
      onverwijld aan de vennootschap en aan Onze Minister het aantal aandelen in het kapitaal van de met de vennootschap
      gelieerde vennootschap waarover hij beschikt alsmede het aantal stemmen dat hij op het geplaatste kapitaal van die
      vennootschap kan uitbrengen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.4
    text: |-
      Iedere bestuurder en commissaris van een vennootschap meldt onverwijld aan de vennootschap en aan Onze Minister
      iedere wijziging in het aantal aandelen in het kapitaal van de vennootschap en in het kapitaal van de met de
      vennootschap gelieerde vennootschappen waarover hij beschikt.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.5
    text: |-
      Iedere bestuurder en commissaris van een vennootschap meldt onverwijld aan de vennootschap en aan Onze Minister
      iedere wijziging in het aantal stemmen waarover hij beschikt dat op het geplaatste kapitaal van de vennootschap en
      op het geplaatste kapitaal van de met de vennootschap gelieerde vennootschappen kan worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.6
    text: |-
      Een vennootschap meldt het feit dat een bestuurder of commissaris niet langer in functie is onverwijld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: 2a.7
    text: |-
      Indien een bestuurder van een vennootschap rechtspersoon is, zijn de bepalingen van dit artikel van overeenkomstige
      toepassing op de natuurlijke personen die het dagelijks beleid van deze rechtspersoon bepalen, alsmede op de
      natuurlijke personen die toezicht houden op het beleid van het bestuur en de algemene gang van zaken in deze
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel2a
  - number: '3.1'
    text: |-
      Een ieder die op het tijdstip waarop de aandelen van een naamloze vennootschap naar Nederlands recht worden
      toegelaten tot de officiële notering aan een in een lid-staat van de Europese Unie gelegen en werkzame
      effectenbeurs, beschikt over aandelen in het kapitaal van die vennootschap of over stemmen die op het geplaatste
      kapitaal van die vennootschap kunnen worden uitgebracht, meldt dat binnen vier weken na de toelating tot de
      officiële notering terzelfder tijd aan de vennootschap en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing indien degene die beschikt over aandelen of stemmen, beschikt over minder
      dan 5 procent van het geplaatste kapitaal of van de stemmen die op dat kapitaal kunnen worden uitgebracht, dan wel
      meende en mocht menen dat dit het geval was.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel3
  - number: '4.1'
    text: |-
      Iemand beschikt over de aandelen in het kapitaal van een vennootschap die hij zelf houdt. Hij beschikt over de
      stemmen die hij kan uitoefenen als houder van aandelen of als pandhouder of vruchtgebruiker daarvan.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel4
  - number: '4.2'
    text: Iemand wordt geacht te beschikken over de aandelen en de stemmen waarover een dochtermaatschappij beschikt.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel4
  - number: '4.3'
    text: |-
      Iemand wordt geacht te beschikken over de aandelen die worden gehouden en de stemmen die als aandeelhouder,
      pandhouder of vruchtgebruiker kunnen worden uitgeoefend door een derde die de aandelen of stemmen voor zijn
      rekening houdt of door een derde met wie hij een overeenkomst heeft gesloten die voorziet in een duurzaam
      gemeenschappelijk beleid inzake de uitoefening van het stemrecht.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel4
  - number: '4.4'
    text: |-
      Aandelen en stemmen in een gemeenschap worden in evenredigheid van hun gerechtigdheid toegerekend aan de
      deelgenoten.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel4
  - number: '5.1'
    text: |-
      Voor de toepassing van de [artikelen 2][ref1], [3][ref2] en [4][ref3] blijven gedurende drie maanden na de
      verkrijging buiten beschouwing aandelen en stemmen die in de regelmatige uitoefening van een beroep of bedrijf
      worden gehouden door:


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008369#Artikel4
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0008369
        artikel: '4'
        hoofdstuk: II
  - number: 5.1.a
    text: |-
      instellingen waarop ingevolge een vergunning of een vrijstelling als bedoeld in
      [artikel 7, tweede lid, onderdeel ][ref1] het verbod, bedoeld in artikel 7, eerste lid, van die wet, niet van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '7'
  - number: 5.1.b
    text: |-
      instellingen die in een andere lid-staat zijn gevestigd en van de toezichthoudende autoriteit van die andere lid-
      staat een vergunning hebben verkregen als bedoeld in [artikel 3, eerste lid, eerste volzin][ref1], van [richtlijn
      nr. 93/22/EEG](31993L0022) van de Raad van de Europese Gemeenschappen van 10 mei 1993 betreffende het verrichten
      van diensten op het gebied van beleggingen in effecten (*PbEG* L 141);


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel3
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '3'
        hoofdstuk: II
  - number: 5.1.c
    text: |-
      kredietinstellingen die in een andere lid-staat zijn gevestigd en van de toezichthoudende autoriteit van die
      andere lid-staat een vergunning hebben verkregen als bedoeld in [artikel 1, onder 2][ref1], van [Richtlijn nr.
      2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000 betreffende
      de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 126), voor zover het
      aan die instellingen ingevolge die vergunning is toegestaan een of meer van de beleggingsdiensten, genoemd in
      [deel A van de bijlage bij de onder b][ref2] genoemde richtlijn, uit te oefenen; en


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel5
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '5'
        hoofdstuk: II
  - number: 5.1.d
    text: |-
      in een andere lid-staat gevestigde financiële instellingen als bedoeld in [artikel 1, onder 5][ref1], van
      [Richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20
      maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG
      L 126), voor zover het aan die instellingen is toegestaan een of meer van de beleggingsdiensten, genoemd in
      [deel A van de bijlage bij de onder b][ref2] genoemde richtlijn, uit te oefenen,.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel5
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '5'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Voor de toepassing van de [artikelen 2][ref1], [3][ref2] en [4][ref3] blijven voorts buiten beschouwing aandelen
      en stemmen die in de regelmatige uitoefening van het effectenbewaarbedrijf worden gehouden, mits die aandelen of
      stemmen door de betrokken bewaarder niet kunnen worden aangewend om zeggenschap uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008369#Artikel4
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0008369
        artikel: '4'
        hoofdstuk: II
  - number: '5.3'
    text: |-
      Indien de betrokkene de aandelen of stemmen nog houdt op het tijdstip waarop het eerste of tweede lid ophoudt van
      toepassing te zijn, wordt hij geacht hierover op dat tijdstip de beschikking te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel5
  - number: '6.1'
    text: |-
      Een melding als bedoeld in de [artikelen 2][ref1] en [3][ref2] geschiedt op door Onze Minister te bepalen wijze en
      bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel3
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '3'
        hoofdstuk: II
  - number: 6.1.a
    text: naam van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
  - number: 6.1.b
    text: adres en woonplaats van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
  - number: 6.1.c
    text: naam van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
  - number: 6.1.d
    text: |-
      percentage aandelen in het kapitaal en percentage stemmen dat op het geplaatste kapitaal kan worden uitgebracht,
      waarover de meldingsplichtige beschikt;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
  - number: 6.1.e
    text: |-
      overeenkomstig door Onze Minister te stellen regels, de samenstelling van [de onder ][ref1] bedoelde percentages;


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel6
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '6'
        hoofdstuk: II
  - number: 6.1.f
    text: datum waarop de meldingsplicht is ontstaan.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
  - number: '6.2'
    text: |-
      Een dochtermaatschappij van een natuurlijk persoon of van een rechtspersoon doet geen melding, indien de melding
      voor haar door de natuurlijke persoon onderscheidenlijk de rechtspersoon is gedaan.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6
  - number: 6a
    text: |-
      Een melding als bedoeld in artikel 2a, eerste tot en met derde lid, geschiedt op door Onze Minister te bepalen
      wijze en bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6a
  - number: 6a.a
    text: naam van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6a
  - number: 6a.b
    text: adres en woonplaats van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6a
  - number: 6a.c
    text: de datum waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6a
  - number: 6a.d
    text: |-
      het aantal aandelen in het kapitaal van de vennootschap of in het kapitaal van de met de vennootschap gelieerde
      vennootschappen en het aantal stemmen dat op het geplaatste kapitaal van de vennootschap of op het geplaatste
      kapitaal van de met de vennootschap gelieerde vennootschappen kan worden uitgebracht, waarover de meldingsplichtige
      beschikt op de datum waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6a
  - number: 6a.e
    text: de naam van de vennootschap of van de met de vennootschap gelieerde vennootschappen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6a
  - number: 6b
    text: |-
      Een melding als bedoeld in artikel 2a, vierde of vijfde lid, geschiedt op door Onze Minister te bepalen wijze en
      bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.a
    text: naam van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.b
    text: adres en woonplaats van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.c
    text: de datum waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.d
    text: |-
      het aantal aandelen, de verkoop- dan wel de verkrijgingsprijs van de aandelen, de soort aandelen en het aantal
      stemmen waarop de wijziging betrekking had;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.e
    text: |-
      het aantal aandelen in het kapitaal van de vennootschap of in het kapitaal van de met de vennootschap gelieerde
      vennootschappen, alsmede het aantal stemmen dat op het geplaatste kapitaal van de vennootschap of op het geplaatste
      kapitaal van de met de vennootschap gelieerde vennootschappen kan worden uitgebracht waarover de meldingsplichtige
      voorafgaande aan de wijziging de beschikking had;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.f
    text: |-
      het aantal aandelen in het kapitaal van de vennootschap of in het kapitaal van de met de vennootschap gelieerde
      vennootschappen, alsmede het aantal stemmen dat op het geplaatste kapitaal van de vennootschap of op het geplaatste
      kapitaal van de met de vennootschap gelieerde vennootschappen kan worden uitgebracht waarover de meldingsplichtige
      na de wijziging beschikt;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.g
    text: de naam van de vennootschap of van de met de vennootschap gelieerde vennootschappen;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: 6b.h
    text: |-
      indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      effectenportefeuille door de meldingsplichtige is overgedragen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel6b
  - number: '7.1'
    text: |-
      Onverwijld nadat Onze Minister een melding als bedoeld in de artikelen 2 en 3 heeft ontvangen, doet hij daarvan
      mededeling aan de betrokken vennootschap.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel7
  - number: '7.2'
    text: |-
      Na tenminste vijf kalenderdagen doch uiterlijk binnen negen kalenderdagen nadat Onze Minister een melding als
      bedoeld in de artikelen 2 en 3 heeft ontvangen, maakt hij de in [artikel 6, eerste lid][ref1], genoemde gegevens,
      met uitzondering van de gegevens genoemd onder b voor zover deze betrekking hebben op natuurlijke personen,
      openbaar in elke lid-staat van de Europese Unie waar aandelen van de vennootschap zijn toegelaten tot de officiële
      notering aan een in die lid-staat gelegen en werkzame effectenbeurs. De openbaarmaking geschiedt door een
      publicatie in een in de betrokken lid-staat landelijk verspreid dagblad. Indien de vennootschap vóór de vijfde
      kalenderdag, bedoeld in de eerste volzin, schriftelijk aan Onze Minister heeft meegedeeld dat zij geen verzoek als
      bedoeld in het derde lid zal doen, maakt Onze Minister de in [artikel 6, eerste lid][ref2], genoemde gegevens, met
      uitzondering van de gegevens genoemd onder b voor zover deze betrekking hebben op natuurlijke personen, openbaar
      binnen vier kalenderdagen na ontvangst van de mededeling van de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel6
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '6'
        hoofdstuk: II
  - number: '7.3'
    text: |-
      Onze Minister kan de openbaarmaking op schriftelijk verzoek van de vennootschap achterwege laten, indien
      naar zijn oordeel de openbaarmaking in strijd zou zijn met het algemeen belang dan wel indien de vennootschap
      daardoor ernstig nadeel zou kunnen ondervinden en het achterwege blijven van de openbaarmaking niet kan
      leiden tot misleiding van het publiek met betrekking tot feiten en omstandigheden die voor de beoordeling
      van de door de vennootschap uitgegeven aandelen van wezenlijk belang zijn. Indien toepassing is gegeven aan
      [artikel 11, eerste lid][ref1], hoort Onze Minister, voordat hij op het verzoek beslist, de in dat artikel bedoelde
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel11
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '11'
        hoofdstuk: III
  - number: '7.4'
    text: |-
      Het verzoek, bedoeld in het derde lid, wordt door de vennootschap gedaan binnen drie kalenderdagen na de
      ontvangst van de mededeling, bedoeld in het eerste lid. Onze Minister schort naar aanleiding van het verzoek de
      openbaarmaking op totdat hij op het verzoek heeft beslist. Indien Onze Minister het verzoek heeft afgewezen, maakt
      hij de in [artikel 6, eerste lid][ref1], genoemde gegevens, met uitzondering van de gegevens genoemd onder b voor
      zover deze betrekking hebben op natuurlijke personen, niet eerder openbaar dan na tenminste vijf kalenderdagen
      nadat hij zijn beslissing aan de vennootschap heeft bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel6
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '6'
        hoofdstuk: II
  - number: 7a
    text: |-
      De gegevens die zijn verstrekt op grond van [artikel 2a][ref1] worden, met uitzondering van de gegevens bedoeld in
      [artikel 6a, onder b][ref2], en [6b, onder b][ref3], opgenomen in een register. Onze Minister houdt het register
      voor een ieder ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0008369#Artikel6b
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: 2a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: 6a
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0008369
        artikel: 6b
        hoofdstuk: II
  - number: '8.1'
    text: |-
      Indien Onze Minister vermoedt dat een melding is gedaan die onjuist is, kan hij terzake een onderzoek instellen
      of doen instellen. Indien dit vermoeden bestaat bij de vennootschap waaraan een melding is gedaan, deelt zij dit
      onverwijld aan Onze Minister mee, met het verzoek terzake een onderzoek in te stellen of te doen instellen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister kan de openbaarmaking van de melding voor de duur van het onderzoek opschorten. Hij stelt de
      vennootschap van een opschorting in kennis.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel8
  - number: '8.3'
    text: |-
      Degene die de melding heeft gedaan, verstrekt desgevraagd aan Onze Minister, binnen een door de Minister te stellen
      termijn, de gegevens op grond waarvan de melding is gedaan.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel8
  - number: '8.4'
    text: Onze Minister kan een ieder die een melding heeft gedaan in de gelegenheid stellen de melding te herstellen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel8
  - number: '8.5'
    text: |-
      Indien een melding naar het oordeel van Onze Minister onjuist is en de melding niet is hersteld, kan hij in
      plaats van de gemelde gegevens de juiste gegevens openbaar maken, nadat hij daarvan aan de betrokken vennootschap
      mededeling heeft gedaan. Artikel 7, derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel8
  - number: '9.1'
    text: |-
      Indien een melding waartoe deze wet verplicht niet overeenkomstig deze wet is gedaan, kan de rechtbank van de
      plaats waar de betrokken vennootschap is gevestigd, op vordering van degene die krachtens het tweede lid daartoe
      bevoegd is, de in het vierde lid genoemde maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.2'
    text: 'Tot het instellen van een vordering zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: 9.2.a
    text: |-
      een of meer houders van aandelen in het kapitaal van de vennootschap die alleen of gezamenlijk ten minste een
      twintigste gedeelte van het geplaatste kapitaal vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: 9.2.b
    text: de vennootschap.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.3'
    text: |-
      De bevoegdheid om de vordering in te stellen vervalt door verloop van drie maanden vanaf de dag waarop degene die
      bevoegd is de vordering in te stellen van de overtreding kennis heeft genomen of heeft kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.4'
    text: 'De maatregelen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: 9.4.a
    text: veroordeling van de meldingsplichtige tot melding overeenkomstig deze wet;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: 9.4.b
    text: |-
      schorsing van de uitoefening van de stemmen waarover de meldingsplichtige beschikt gedurende een door de rechtbank
      te bepalen periode van ten hoogste drie jaren;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: 9.4.c
    text: |-
      schorsing van een besluit van de algemene vergadering van aandeelhouders van de vennootschap totdat over een
      maatregel als bedoeld in [onderdeel ][ref1] onherroepelijk is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel9
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '9'
        hoofdstuk: II
  - number: 9.4.d
    text: |-
      vernietiging van een besluit van de algemene vergadering van aandeelhouders van de vennootschap voor zover
      aannemelijk is dat dit besluit niet zou zijn genomen indien de stemmen waarover de meldingsplichtige beschikt niet
      zouden zijn uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: 9.4.e
    text: |-
      een bevel aan de meldingsplichtige om zich gedurende een door de rechtbank te bepalen periode van ten hoogste vijf
      jaren te onthouden van het verkrijgen van de beschikking over aandelen in het kapitaal van de vennootschap of van
      stemmen die op het geplaatste kapitaal van die vennootschap kunnen worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.5'
    text: |-
      Een maatregel als bedoeld in het vierde lid, onderdelen *b* en *e*, geldt niet voor aandelen die ten titel van
      beheer worden gehouden door een ander dan de meldingsplichtige, tenzij de meldingsplichtige bevoegd is om zich deze
      aandelen te verschaffen of te bepalen hoe de daaraan verbonden stemmen worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.6'
    text: De rechtbank regelt zo nodig de gevolgen van de door haar getroffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.7'
    text: |-
      De rechtbank kan op vordering van degene die de oorspronkelijke vordering heeft ingesteld of van degene tegen wie
      de maatregel is gericht de periode, bedoeld in het vierde lid, onderdelen *b* en *e*, verkorten.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.8'
    text: Een maatregel als bedoeld in het vierde lid, onderdeel *d*, kan niet uitvoerbaar bij voorraad worden verklaard.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.9'
    text: |-
      Indien de vordering, bedoeld in het eerste lid, betrekking heeft op aandelen die niet door de meldingsplichtige
      zelf worden gehouden of op stemmen die hij niet zelf als aandeelhouder, pandhouder of vruchtgebruiker kan
      uitoefenen, roept de eiser de desbetreffende houder, pandhouder of vruchtgebruiker in het geding op, zo die aan de
      eiser bekend is.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '9.10'
    text: |-
      Een onmiddellijke voorziening bij voorraad kan slechts worden gevorderd bij de voorzieningenrechter van de
      rechtbank die op grond van het eerste lid bevoegd is. De vordering kan slechts betrekking hebben op de maatregelen,
      bedoeld in het vierde lid, onderdelen *a*, *b*, *c* en *e*. Het vijfde en negende lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister is bevoegd gegevens en inlichtingen die hij ingevolge de toepassing van deze wet heeft verkregen,
      uit te wisselen met buitenlandse bevoegde autoriteiten, mits deze gehouden zijn tot geheimhouding van de ontvangen
      gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel10
  - number: '10.2'
    text: |-
      Indien Onze Minister gegevens of inlichtingen heeft verkregen van een buitenlandse bevoegde autoriteit mag hij deze
      uitsluitend gebruiken voor de toepassing van deze wet.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel10
  - number: '11.1'
    text: |-
      Met uitzondering van de bevoegdheid, bedoeld in [artikel 7, derde lid][ref1], om de openbaarmaking van een
      melding achterwege te laten om redenen van algemeen belang, van de bevoegdheid, bedoeld in [artikel 12][ref2],
      om regels te stellen voor het verhaal van kosten, van de bevoegdheid, bedoeld in [artikel 13a, derde lid][ref3],
      om regels te stellen ter zake van het opleggen van een last onder dwangsom, van de bevoegdheid, bedoeld in
      [artikel 13b, derde lid][ref4], om regels te stellen ter zake van het opleggen van een bestuurlijke boete, en van
      de bevoegdheid, bedoeld in [artikel 13l, tweede lid][ref5], om regels te stellen ter zake van het ter openbare
      kennis brengen van bepaalde gegevens, kunnen taken en bevoegdheden die Onze Minister op grond van deze wet heeft
      bij algemene maatregel van bestuur worden overgedragen aan een rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0008369#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0008369#Artikel13b
      [ref5]: https://wetten.overheid.nl/BWBR0008369#Artikel13l
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '12'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0008369
        artikel: 13a
        hoofdstuk: IV_A
      - id: ref4
        bwb_id: BWBR0008369
        artikel: 13b
        hoofdstuk: IV_A
      - id: ref5
        bwb_id: BWBR0008369
        artikel: 13l
        hoofdstuk: IV_A
  - number: '11.2'
    text: 'Een overdracht vindt slechts plaats indien de betrokken rechtspersoon aan de volgende eisen voldoet:'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel11
  - number: 11.2.a
    text: hij dient in staat te zijn de overgedragen taken en bevoegdheden naar behoren uit te oefenen; en
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel11
  - number: 11.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de betrokken rechtspersoon dat een
      onafhankelijke uitoefening van de overgedragen taken en bevoegdheden zoveel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel11
  - number: '11.3'
    text: Aan de overdracht kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel11
  - number: '11.4'
    text: |-
      De rechtspersoon brengt eenmaal per jaar, uiterlijk op 1 mei, verslag uit aan Onze Minister over de uitoefening
      van de overgedragen taken en bevoegdheden in het voorgaande kalenderjaar. Dit verslag wordt door de zorg van Onze
      Minister openbaar gemaakt, met dien verstande dat gegevens met betrekking tot afzonderlijke vennootschappen en
      degenen op wie een meldingsplicht rust niet openbaar worden gemaakt, tenzij het gaat om gegevens die ingevolge
      [artikel 7, tweede of vierde lid][ref1], of [artikel 8, vijfde lid][ref2], reeds openbaar zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel8
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: '8'
        hoofdstuk: II
  - number: '12'
    text: |-
      Onze Minister is bevoegd de kosten die voor de uitvoering van deze wet worden gemaakt op de vennootschappen en op
      degenen op wie een meldingsplicht rust volgens door hem te stellen regels te verhalen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel12
  - number: '13'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 13a.1
    text: |-
      Onze Minister kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften gesteld, bij of
      krachtens [artikel 8, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel8
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '8'
        hoofdstuk: II
  - number: 13a.2
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 13a.3
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13a
  - number: 13b.1
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften, gesteld bij of
      krachtens de [artikelen 2, eerste en tweede lid][ref1], [2a][ref2], [3, eerste lid][ref3], [6, eerste lid][ref4],
      [6a][ref5], [6b][ref6], [8, eerste lid, tweede volzin, derde en vierde lid][ref7], en [14, tweede lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0008369#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0008369#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0008369#Artikel6a
      [ref6]: https://wetten.overheid.nl/BWBR0008369#Artikel6b
      [ref7]: https://wetten.overheid.nl/BWBR0008369#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0008369#Artikel14
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008369
        artikel: 2a
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0008369
        artikel: '3'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0008369
        artikel: '6'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0008369
        artikel: 6a
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0008369
        artikel: 6b
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0008369
        artikel: '8'
        hoofdstuk: II
      - id: ref8
        bwb_id: BWBR0008369
        artikel: '14'
        hoofdstuk: V
  - number: 13b.2
    text: |-
      De bestuurlijke boete komt toe aan de staat. Voor zover Onze Minister met toepassing van
      [artikel 11, eerste lid][ref1], de bevoegdheid tot het opleggen van een bestuurlijke boete overdraagt aan een
      rechtspersoon, komt de boete toe aan die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel11
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: '11'
        hoofdstuk: III
  - number: 13b.3
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13b
  - number: 13c.1
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete voor
      een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13c
  - number: 13c.2
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13c
  - number: 13c.3
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13c
  - number: 13c.4
    text: |-
      Onze Minister kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13c
  - number: 13d
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige
      verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13d
  - number: 13e.1
    text: |-
      Indien Onze Minister voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder vermelding
      van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13e
  - number: 13e.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister de betrokkene in de
      gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage, bedoeld in [artikel 13c][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0008369#Artikel13c
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0008369
        artikel: 13c
        hoofdstuk: IV_A
  - number: 13f.1
    text: Onze Minister legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13f
  - number: 13f.2
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13f
  - number: 13f.2.a
    text: het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13f
  - number: 13f.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13f
  - number: 13f.2.c
    text: |-
      de termijn, bedoeld in [artikel 13h, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel13h
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: 13h
        hoofdstuk: IV_A
  - number: 13g.1
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13g
  - number: 13g.2
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 13e, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel13e
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13g
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: 13e
        hoofdstuk: IV_A
  - number: 13h.1
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
  - number: 13h.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 13e, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel13e
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: 13e
        hoofdstuk: IV_A
  - number: 13h.3
    text: |-
      Indien de boete niet tijdig is betaald, stuurt Onze Minister schriftelijk een aanmaning om binnen twee weken
      de boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de
      boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde lid zal worden
      ingevorderd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
  - number: 13h.4
    text: |-
      Bij gebreke van tijdige betaling kan Onze Minister de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
  - number: 13h.5
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 13h.6
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon die de boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
  - number: 13h.7
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
  - number: 13h.8
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13h
  - number: 13i.1
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 13i.2
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in artikel 48c vervalt, indien Onze
      Minister ter zake van die overtreding reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13i
  - number: 13j.1
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13j
  - number: 13j.2
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete wordt
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13j
  - number: 13k
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13k
  - number: 13l.1
    text: |-
      Met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten,
      kan Onze Minister, het feit ter zake waarvan de last onder dwangsom of de bestuurlijke boete is opgelegd, het
      overtreden voorschrift, alsmede de naam, het adres en de woonplaats van degene aan wie de last onder dwangsom of de
      bestuurlijke boete is opgelegd, ter openbare kennis brengen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13l
  - number: 13l.2
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel13l
  - number: '14.1'
    text: |-
      Voor de toepassing van dit artikel wordt als vennootschap beschouwd een naamloze vennootschap naar Nederlands
      recht waarvan de toelating van aandelen tot de officiële notering aan een in een van de lid-staten van de Europese
      Unie gelegen en werkzame effectenbeurs heeft plaatsgevonden in de periode die ligt tussen 31 januari 1992 en het
      tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel14
  - number: '14.2'
    text: |-
      Een ieder die op het tijdstip van inwerkingtreding van deze wet beschikt over aandelen in het kapitaal van een
      vennootschap of over stemmen die op het geplaatste kapitaal van die vennootschap kunnen worden uitgebracht, is
      verplicht binnen vier weken na dat tijdstip aan de vennootschap en terzelfder tijd aan Onze Minister een melding
      te doen, tenzij hij ter zake van deze zeggenschap eerder een melding heeft gedaan overeenkomstig de Wet melding
      zeggenschap in ter beurze genoteerde vennootschappen.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel14
  - number: '14.3'
    text: |-
      Het tweede lid is niet van toepassing indien degene die beschikt over aandelen of stemmen, beschikt over minder
      dan 5 procent van het geplaatste kapitaal of van de stemmen die op dat kapitaal kunnen worden uitgebracht, dan wel
      meende en mocht menen dat dit het geval was.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel14
  - number: '16'
    text: De Wet melding zeggenschap in ter beurze genoteerde vennootschappen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel16
  - number: '17'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel17
  - number: '18'
    text: 'Deze wet wordt aangehaald als: Wet melding zeggenschap in ter beurze genoteerde vennootschappen 1996.'
    url: https://wetten.overheid.nl/BWBR0008369/2003-12-01#Artikel18
