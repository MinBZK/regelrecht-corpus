        bwb_id: BWBR0003385
        artikel: '1'
  - number: 7a.e.1°
    text: |-
      met controle op de naleving van het bij of krachtens deze wet bepaalde zijn belast: - de bij besluit van Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit en Onze Minister van Volksgezondheid, Welzijn en Sport, ieder
      voor zoveel het hem aangaat, aangewezen ambtenaren;
        - de bij of krachtens artikel 184 van het Wetboek van Strafvordering BES aangewezen ambtenaren, en
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
  - number: 7a.e.2°
    text: |-
      de onder 1° bedoelde ambtenaren – voor zover dat redelijkerwijs voor de vervulling van voornoemde controlerende
      taak nodig is – bevoegd zijn: - inzage te vorderen van gegevens en bescheiden alsmede daarvan kopieën te maken;
        - elke plaats te betreden;
        - zaken te onderzoeken, aan opneming te onderwerpen en daarvan monsters te nemen en daartoe verpakkingen te openen;
        - vervoermiddelen en daarmee vervoerde lading te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
  - number: '9.1'
    text: Deze wet kan worden aangehaald als "Uitvoeringswet verdrag biologische wapens".
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel9
  - number: '9.2'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de plaatsing in de *Nederlandse Staatscourant* van een
      mededeling omtrent de nederlegging van de akte van bekrachtiging van het Verdrag tot verbod van de ontwikkeling, de
      produktie en de aanleg van voorraden van bacteriologische (biologische) en toxinewapens en inzake de vernietiging
      van deze wapens.
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel9
