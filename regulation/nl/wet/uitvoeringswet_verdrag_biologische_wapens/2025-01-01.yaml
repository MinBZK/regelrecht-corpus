        bwb_id: BWBR0003385
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003385
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003385
        artikel: '4'
  - number: 7a.c
    text: |-
      hij die een voorschrift overtreedt, gesteld bij of krachtens de [artikelen 2, eerste en derde lid][ref1],
      [3][ref2] en [4][ref3], als schuldig aan een misdrijf wordt gestraft met gevangenisstraf van ten hoogste acht
      jaren of geldboete van de vijfde categorie, indien het feit opzettelijk is begaan met een terroristisch oogmerk als
      bedoeld in artikel 84b van het Wetboek van Strafrecht BES, dan wel met het oogmerk om een terroristisch misdrijf
      als bedoeld in artikel 84a van dat wetboek voor te bereiden of gemakkelijk te maken;


      [ref1]: https://wetten.overheid.nl/BWBR0003385#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003385#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003385#Artikel4
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
    references:
