  - number: 7a.d
    text: |-
      in afwijking van [artikel 5][ref1] in plaats van de in
      [artikel 7, onder e, van de Wet op de economische delicten][ref2] bedoelde voorwerpen worden bedoeld de voorwerpen
      die behoren tot de onderneming van degene die overeenkomstig deze wet is veroordeeld en voor zover deze voorwerpen
      soortgelijk zijn aan en met betrekking tot het delict verband houden met die, genoemd in artikel 35 van het Wetboek
      van Strafrecht BES.


      [ref1]: https://wetten.overheid.nl/BWBR0003385#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
