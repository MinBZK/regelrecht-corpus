  - number: 7a.e
    text: |-
      in afwijking van [artikel 1, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003385#Artikel1
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
    references:
