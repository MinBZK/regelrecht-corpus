  - number: '7'
    text: |-
      Een ieder die bij de uitvoering van deze wet de beschikking krijgt over gegevens waarvan hij het vertrouwelijke
      karakter kent of redelijkerwijs moet vermoeden is verplicht tot geheimhouding daarvan tenzij uit hoofde van het
      ambt dat hij bekleedt enig ander voorschrift van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7
  - number: 7a
    text: 'Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
  - number: 7a.a
    text: |-
      hij die een voorschrift overtreedt, gesteld bij of krachtens de [artikelen 2, eerste en derde lid][ref1],
      [3][ref2] en [4][ref3], als schuldig aan een overtreding wordt gestraft met hechtenis van ten hoogste een jaar of
      geldboete van de vierde categorie;


      [ref1]: https://wetten.overheid.nl/BWBR0003385#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003385#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003385#Artikel4
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003385
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003385
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003385
        artikel: '4'
  - number: 7a.b
    text: |-
      hij die een voorschrift overtreedt, gesteld bij of krachtens de [artikelen 2, eerste en derde lid][ref1],
      [3][ref2] en [4][ref3], als schuldig aan een misdrijf wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie, indien het feit opzettelijk is begaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003385#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003385#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003385#Artikel4
    url: https://wetten.overheid.nl/BWBR0003385/2025-01-01#Artikel7a
    references:
