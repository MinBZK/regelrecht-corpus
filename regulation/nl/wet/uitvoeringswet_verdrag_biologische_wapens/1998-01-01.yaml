$id: uitvoeringswet_verdrag_biologische_wapens
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '1998-01-01'
bwb_id: BWBR0003385
url: https://wetten.overheid.nl/BWBR0003385/1998-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van artikel IV
    van het Verdrag tot verbod van de ontwikkeling, de produktie en de aanleg van voorraden van bacteriologische
    (biologische) en toxinewapens en inzake de vernietiging van deze wapens (Trb. 1972, 142);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze wet worden onder biologische agentia verstaan:'
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel1
  - number: 1.1.a
    text: levende organismen die zich in mens, dier of plant kunnen vermenigvuldigen;
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel1
  - number: 1.1.b
    text: uit die organismen verkregen infectueuze bestanddelen, die zich in mens, dier of plant kunnen vermenigvuldigen;
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel1
  - number: 1.1.c
    text: |-
      stoffen, die door levende micro-organismen worden geproduceerd, met inbegrip van stoffen met identieke of analoge
      structuur en werking, welke langs chemische weg vervaardigd zijn;
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel1
  - number: '1.2'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister van Landbouw, Natuurbeheer en Visserij en Onze Minister van Volksgezondheid, Welzijn en Sport, ieder voor
      zoveel het hem aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister van Landbouw en Visserij dan wel Onze Minister van Volksgezondheid en Milieuhygiëne kan, na overleg
      met zijn genoemde ambtgenoot en in overeenstemming met Onze Minister van Defensie, de ontwikkeling, de produktie,
      het in voorraad hebben, de verwerving of het bezit van biologische agentia verbieden, indien hij reden heeft om aan
      te nemen dat deze geëigend zijn om als strijdmiddel te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel2
  - number: '2.2'
    text: |-
      Er is reden om aan te nemen dat biologische agentia geëigend zijn om als strijdmiddel te worden gebruikt indien
      daarvan de soort of de aanwezige hoeveelheid onder de omstandigheden van het moment niet kan worden gerechtvaardigd
      uit hoofde van profylactische, beschermende of andere vreedzame doeleinden.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister, die een verbod ingevolge dit artikel uitvaardigt, kan daarbij voorschriften geven omtrent de wijze
      waarop en de termijn waarbinnen de desbetreffende biologische agentia dienen te worden vernietigd, alsmede het
      toezicht waaronder de vernietiging dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het in het vorige lid bedoelde verbod wordt de betrokkene bij aangetekende brief medegedeeld of bevestigd. Alvorens
      een verbod uit te vaardigen wordt de betrokkene in de gelegenheid gesteld te worden gehoord, tenzij naar het
      oordeel van Onze betrokken Minister geen uitstel kan worden gedoogd.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel2
  - number: '3'
    text: |-
      Onverminderd het bepaalde in [artikel 2][ref1] is het een ieder verboden biologische agentia te ontwikkelen, te
      produceren, in voorraad te hebben of op enigerlei andere wijze te verwerven of te bezitten, indien hij weet of
      redelijkerwijs moet vermoeden dat deze zijn of zullen worden bestemd om als strijdmiddel te worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003385#Artikel2
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003385
        artikel: '2'
  - number: '4'
    text: |-
      Het is een ieder verboden wapens, uitrusting of verspreidingsmiddelen te ontwikkelen, te produceren, in voorraad te
      hebben of op enigerlei andere wijze te verwerven of te bezitten, indien hij weet of redelijkerwijs moet vermoeden
      dat deze zijn of zullen worden bestemd om te dienen voor het gebruik van biologische agentia als strijdmiddel.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel4
  - number: '5'
    text: |-
      De in de [artikelen 2][ref1] en [3][ref2] bedoelde agentia, de in [artikel 4][ref3] bedoelde voorwerpen, alsmede
      de in [artikel 7, onder ][ref4] bedoelde voorwerpen worden steeds verbeurd of aan het verkeer onttrokken verklaard.
      Voor het overige zijn de artikelen 33-35 en 36*a*-36*c* van het [Wetboek van Strafrecht][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003385#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003385#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003385#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003385
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003385
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003385
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0002063
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0001854
  - number: '7'
    text: |-
      Een ieder die bij de uitvoering van deze wet de beschikking krijgt over gegevens waarvan hij het vertrouwelijke
      karakter kent of redelijkerwijs moet vermoeden is verplicht tot geheimhouding daarvan tenzij uit hoofde van het
      ambt dat hij bekleedt enig ander voorschrift van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel7
  - number: '9.1'
    text: Deze wet kan worden aangehaald als "Uitvoeringswet verdrag biologische wapens".
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel9
  - number: '9.2'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de plaatsing in de *Nederlandse Staatscourant* van een
      mededeling omtrent de nederlegging van de akte van bekrachtiging van het Verdrag tot verbod van de ontwikkeling, de
      produktie en de aanleg van voorraden van bacteriologische (biologische) en toxinewapens en inzake de vernietiging
      van deze wapens.
    url: https://wetten.overheid.nl/BWBR0003385/1998-01-01#Artikel9
