preamble:
  text: |-
    Gelet op de artikelen 52 en 64 van de Algemene wet inzake rijksbelastingen;

    Mede gelet op de artikelen 19 en 21 van het Uitvoeringsbesluit verontreiniging rijkswateren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0002791/1971-12-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De verplichtingen, welke volgens de [artikelen 47][ref1], [50][ref2] en
      [51 van de Algemene wet inzake rijksbelastingen][ref3] bestaan jegens het hoofd van het bureau
      verontreinigingsheffing rijkswateren, gelden mede jegens de ambtenaren van het bureau verontreinigingsheffing
      rijkswateren, schriftelijk aangewezen door het hoofd van genoemd bureau.


