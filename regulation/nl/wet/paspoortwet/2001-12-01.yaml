  - number: '16'
    text: |-
      1 Aan degene die ingevolge deze wet recht heeft op een nationaal paspoort, een reisdocument voor vluchtelingen of
      een reisdocument voor vreemdelingen en op het moment van vertrek niet in het bezit blijkt van een geldig of voor de
      reis bruikbaar reisdocument, wordt indien hij aantoont zwaarwegende belangen te hebben bij de reis, na een daartoe
      strekkende aanvraag binnen de grenzen bij deze wet bepaald een nooddocument verstrekt met een zodanige tijdelijke
      en territoriale geldigheid als daarvoor vereist is.

      2 Ten aanzien van elke categorie van reisdocumenten als bedoeld in [artikel 2, eerste lid, onder g][ref1], stelt
      Onze Minister vast aan wie en onder welke voorwaarden deze documenten, onder overeenkomstige toepassing van deze
      wet, kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
        hoofdstuk: I
  - number: 16a
    text: |-
      Iedere Nederlander die als ingezetene in de basisadministratie persoonsgegevens van een gemeente is ingeschreven,
      of die woonachtig is in een land waarvoor de Nederlandse identiteitskaart geldig is, heeft binnen de grenzen van
      deze wet bepaald, recht op verstrekking van een Nederlandse identiteitskaart, geldig voor vijf jaren.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel16a
  - number: '17'
    text: |-
      1 Op verzoek van de houder kan het kind over wie hij het gezag uitoefent in zijn reisdocument worden bijgeschreven,
      voor zover het kind nog niet de leeftijd van zestien jaren heeft bereikt, niet reeds over een Nederlands
      reisdocument als bedoeld in [artikel 2, eerste lid][ref1], beschikt en evenals de houder Nederlander is dan wel
      evenals de houder vreemdeling is met dezelfde status of verblijfstitel als de houder.

      2 Bijschrijving vindt bij gezamenlijke uitoefening van het gezag niet plaats dan nadat de andere persoon die het
      gezag uitoefent, daarvoor schriftelijk toestemming heeft gegeven.

      3 Bijschrijving kan slechts plaatsvinden in reisdocumenten als bedoeld in
      [artikel 2, eerste lid, onder a, d, e en g][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel17
