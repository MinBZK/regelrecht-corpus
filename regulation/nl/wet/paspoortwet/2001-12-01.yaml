  - number: 46a
    text: Een Nederlandse identiteitskaart kan niet worden geweigerd of vervallen verklaard.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel46a
  - number: '47'
    text: |-
      1 Een reisdocument vervalt van rechtswege, indien:

      a. de houder van het reisdocument, waarin staat vermeld dat deze de Nederlandse nationaliteit bezit, het
      Nederlanderschap heeft verloren;

      b. de houder van het reisdocument voor vluchtelingen of van het reisdocument voor vreemdelingen niet meer beschikt
      over de status of verblijfstitel op grond waarvan hem het reisdocument is verstrekt, het Nederlanderschap dan
      wel de nationaliteit van een ander land heeft verkregen of, houder zijnde van een reisdocument als bedoeld in
      [artikel 12][ref1],[ 14][ref2] of [15][ref3], door een ander land van een reisdocument is voorzien;

      c. de redenen die tot de verstrekking van het diplomatiek paspoort, het dienstpaspoort of het reisdocument als
      bedoeld in [artikel 2, eerste lid, onder f en g][ref4], hebben geleid, zijn vervallen;

      d. de geldigheidsduur daarvan is verstreken;

      e. de geslachtsnaam, de voornamen, de geboortedatum of het geslacht van de houder zijn gewijzigd;

      f. de houder is overleden;

      g. ingevolge [artikel 31][ref5] schriftelijk is verklaard dat het is vermist of door een daartoe bevoegde
      autoriteit is ingenomen;

      h. door een met de uitvoering van deze wet belaste autoriteit is vastgesteld dat bij de aanvraag gebruik is gemaakt
      van onjuiste gegevens, die hebben geleid tot het verstrekken van het reisdocument.

      2 De bijschrijving in een reisdocument vervalt van rechtswege, indien:

      a. de minderjarige de leeftijd van zestien jaren heeft bereikt of is overleden;

      b. aan de bijgeschreven persoon een reisdocument als bedoeld in [artikel 2, eerste lid][ref6], is verstrekt;

      c. in het bezit van de Nederlandse nationaliteit dan wel de status of verblijfstitel als bedoeld in artikel 17, van
      de minderjarige verandering is opgetreden;

      d. de geslachtsnaam, de voornamen, de geboortedatum of het geslacht van de minderjarige zijn gewijzigd;

      e. de houder van het reisdocument niet meer het gezag uitoefent;

      f. de andere persoon die het gezag uitoefent bedoeld in [artikel 17][ref7] zijn toestemming heeft ingetrokken. De
      intrekking geschiedt op de wijze bedoeld in [artikel 48, eerste lid][ref8];

      g. door een met de uitvoering van deze wet belaste autoriteit is vastgesteld dat bij de aanvraag gebruik is gemaakt
      van onjuiste gegevens, die hebben geleid tot de bijschrijving in het reisdocument.

      3 De houder van een reisdocument dat van rechtswege is vervallen ingevolge het bepaalde in het eerste lid, onder
      a, b, c, e of h, dan wel de houder van een reisdocument waarin een bijschrijving is opgenomen welke van rechtswege
      is vervallen, wordt hiervan op het moment van de inhouding in kennis gesteld door de tot inhouding van het
      reisdocument bevoegde autoriteit.

      4 Onze Minister onderscheidenlijk de Gouverneur kan, al dan niet op verzoek van een met de uitvoering van
      deze wet belaste autoriteit die het aangaat, besluiten dat de houder van een reisdocument dat op grond van het
      bepaalde in het eerste lid, onder a, b, c, e, g of h, van rechtswege is vervallen of van een reisdocument waarin
      een bijschrijving is opgenomen welke van rechtswege is vervallen, wordt vermeld in het register, bedoeld in
      [artikel 25, derde lid][ref9]. Deze vermelding kan geen andere gegevens van de betrokken persoon omvatten dan die,
      bedoeld in [artikel 3][ref10]. [Artikel 25, vierde lid][ref11], is van overeenkomstige toepassing. De Gouverneur
      geeft van zijn besluit dat tot vermelding moet worden overgegaan onverwijld kennis aan Onze Minister.

      5 Onze Minister draagt zorg voor de vermelding, bedoeld in het vierde lid, alsmede voor de verwijdering daarvan,
      zodra het desbetreffende reisdocument door hem, de Gouverneur dan wel de met de uitvoering van deze wet belaste
      autoriteit die het verzoek tot de vermelding, bedoeld in het vierde lid, heeft gedaan, is ontvangen of ingehouden.
      De Gouverneur dan wel de autoriteit die het verzoek tot vermelding, bedoeld in het vierde lid, heeft gedaan, geeft
      van de ontvangst of de inhouding van het reisdocument onverwijld kennis aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
