  - number: '18'
    text: |-
      Weigering of vervallenverklaring kan geschieden op verzoek van het openbaar ministerie, indien het gegronde
      vermoeden bestaat dat een persoon,

      a. die wordt verdacht van het plegen van een strafbaar feit waarvoor een bevel tot voorlopige hechtenis is
      toegelaten, of

      b. die onherroepelijk veroordeeld is tot een vrijheidsstraf of vrijheidsbenemende maatregel van zes maanden of
      meer, of een geldboete in Nederland van de derde categorie of hoger, dan wel een daarmee overeenkomende geldboete
      in de Nederlandse Antillen of Aruba, of

      c. die de bijzondere voorwaarden verbonden aan een voorwaardelijke veroordeling, een voorwaardelijke
      terbeschikkingstelling of een voorwaardelijke gratieverlening niet naleeft,

      zich door verblijf buiten de grenzen van een der landen van het Koninkrijk aan vervolging dan wel tenuitvoerlegging
      van de straf zal onttrekken.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel18
  - number: '19'
    text: |-
      Weigering of vervallenverklaring kan geschieden op verzoek van de rechter-commissaris, indien de betrokken persoon
      in staat van faillissement verkeert dan wel op hem het bepaalde in [artikel 106 van de Faillissementswet][ref1]
      (*Stb.* 1893, 140) of een overeenkomstige regeling in de Nederlandse Antillen of Aruba van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel106
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '106'
  - number: '20'
    text: |-
      Weigering of vervallenverklaring kan geschieden op verzoek van Onze Minister die het aangaat, indien het gegronde
      vermoeden bestaat dat de betrokken persoon zich door verblijf buiten het Koninkrijk zal onttrekken aan zijn
      militaire verplichtingen, dan wel zijn vervangende dienstplicht.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel20
  - number: '21'
    text: |-
      Weigering of vervallenverklaring kan geschieden op verzoek van Onze Minister die het aangaat, indien het
      gegronde vermoeden bestaat dat een persoon ten aanzien van wie in buitengewone omstandigheden krachtens de wet of
      landsverordening een verbod geldt het land te verlaten, dit verbod zal overtreden.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel21
  - number: '22'
    text: |-
      Weigering of vervallenverklaring kan geschieden op verzoek van Onze Minister die het aangaat, onderscheidenlijk het
      gemeentebestuur, het provinciaal bestuur, het eilandbestuur dan wel een ander tot invordering bevoegd orgaan van
      een rechtspersoon die krachtens publiekrecht is ingesteld, dat het aangaat, indien het gegronde vermoeden bestaat
      dat een persoon,

      a. die nalatig is in het nakomen van zijn verplichting tot betaling van in een der landen van het Koninkrijk
      verschuldigde belastingen of premies inzake sociale verzekeringen, of

      b. die nalatig is in het nakomen van zijn verplichting tot terugbetaling van door de overheid aan hem verstrekte
      geldleningen, subsidies of renteloze voorschotten, of

      c. die nalatig is in het nakomen van een wettelijk op hem rustende dan wel bij uitspraak van een rechter in het
      Koninkrijk vastgestelde verplichting tot betaling van op hem verhaalbare uitkeringen, door de overheid gemaakte, op
      hem verhaalbare kosten, dan wel voorgefinancierde of anderszins verstrekte gelden, of

      d. die nalatig is in het nakomen van een wettelijk op hem rustende onderhoudsverplichting dan wel een bij uitspraak
      van een rechter in het Koninkrijk vastgestelde onderhoudsverplichting,

      zich door verblijf buiten de grenzen van een der landen van het Koninkrijk aan de wettelijke mogelijkheden tot
      invordering van de verschuldigde gelden zal onttrekken.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel22
  - number: '23'
    text: |-
      Weigering of vervallenverklaring kan geschieden op verzoek van Onze Minister die het aangaat, indien het gegronde
      vermoeden bestaat dat de betrokken persoon buiten het Koninkrijk handelingen zal verrichten, die een bedreiging
      vormen voor de veiligheid en andere gewichtige belangen van het Koninkrijk of een of meerdere landen van het
      Koninkrijk dan wel de veiligheid van met het Koninkrijk bevriende mogendheden.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel23
  - number: '24'
    text: |-
      Weigering of vervallenverklaring kan geschieden op verzoek van Onze Minister die het aangaat, onderscheidenlijk een
      met de uitvoering van deze wet belaste autoriteit die het aangaat, indien:

      a. het gegronde vermoeden bestaat dat de betrokken persoon zich schuldig zal maken aan gedragingen welke
      naar Nederlands, Nederlands-Antilliaans onderscheidenlijk Arubaans recht misdrijven opleveren en tot de
      strafbaarstelling waarvan een het Koninkrijk bindend verdrag verplicht en hij binnen of buiten het Koninkrijk in de
      voorafgaande tien jaar wegens zodanige gedragingen of medeplichtigheid daaraan onherroepelijk is veroordeeld;

      b. het gegronde vermoeden bestaat dat de betrokken persoon handelingen heeft verricht of zal verrichten met of
      met betrekking tot reisdocumenten die het vertrouwen in reisdocumenten hebben geschaad of zullen schaden dan wel
      opzettelijk een ander in de gelegenheid heeft gesteld of zal stellen om zulke handelingen te verrichten met of met
      betrekking tot een aan de betrokken persoon verstrekt reisdocument.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel24
  - number: '25'
    text: |-
      1 De autoriteiten, bedoeld in de [artikelen 18 tot en met 24][ref1], richten het verzoek tot weigering
      onderscheidenlijk vervallenverklaring onder vermelding van de bezwaren die tegen een persoon bestaan en de gronden
      die hebben geleid tot het vermoeden, bedoeld in [artikel 18][ref2] en de [artikelen 20 tot en met 24][ref3], aan
      Onze Minister, onderscheidenlijk de Gouverneur.

      2 Indien deze gronden zijn vervallen, geeft de autoriteit die een verzoek als bedoeld in het eerste lid heeft
      gedaan Onze Minister, onderscheidenlijk de Gouverneur, daarvan onverwijld kennis. De Gouverneur draagt zorg, dat de
      aan hem gedane mededeling dat de gronden zijn vervallen, onverwijld ter kennis komt van Onze Minister.

      3 Onze Minister onderscheidenlijk de Gouverneur vermeldt, indien een verzoek als bedoeld in het eerste lid voldoet
      aan de voorwaarden van een van de [artikelen 18 tot en met 24][ref4], de persoon op wie het verzoek betrekking
      heeft dan wel de persoon ten aanzien van wie bij hem, onderscheidenlijk de Gouverneur, gronden tot weigering of
      vervallenverklaring bestaan, in een door Onze Minister bij te houden register. In dat geval vermeldt dit register
      geen andere gegevens van de betrokken persoon dan die, bedoeld in [artikel 3][ref5], vanwege welke autoriteit,
      krachtens welke bepaling van [paragraaf 1 van dit hoofdstuk][ref6] en om welke reden de betrokken persoon in het
      register is vermeld, alsmede de datum van vermelding in het register.

      4 Onze Minister, onderscheidenlijk de Gouverneur, deelt de autoriteiten die bevoegd zijn een reisdocument te
      verstrekken dan wel in te houden, mede, aan welke personen die ingevolge het bepaalde in het derde lid in het
      register zijn vermeld, een reisdocument kan worden geweigerd, dan wel van wie het reisdocument moet worden
      ingehouden. De autoriteiten die bevoegd zijn een reisdocument te verstrekken dan wel in te houden, houden een
      administratie bij van de mededelingen die zij op grond van de vorige volzin ontvangen.

      5 Onze Minister verwijdert onverwijld een vermelding als bedoeld in het derde lid uit het register, indien hij een
      kennisgeving als bedoeld in het tweede lid heeft ontvangen of indien twee jaar nadat een verzoek als bedoeld in
      het eerste lid is gedaan een zodanige kennisgeving niet is ontvangen, dan wel zodra de gronden ten aanzien van de
      betrokken personen bij Onze Minister onderscheidenlijk de Gouverneur niet meer bestaan. Hij geeft daarvan terstond
      kennis aan de autoriteiten aan wie hij de mededeling als bedoeld in het vierde lid heeft gedaan. Deze autoriteiten
      verwijderen terstond nadat zij een kennisgeving als bedoeld in de vorige volzin hebben ontvangen de vermelding uit
      de administratie, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel20
