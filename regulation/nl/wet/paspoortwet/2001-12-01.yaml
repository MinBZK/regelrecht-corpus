  - number: '51'
    text: |-
      1 Een reisdocument kan worden ingehouden door het hoofd van een Nederlandse consulaire post onderscheidenlijk van
      het kabinet van de Gouverneur, die aan de houder een geldlening heeft verstrekt of ten behoeve van de houder kosten
      heeft gemaakt. Het ingehouden reisdocument wordt onverwijld toegezonden aan Onze Minister van Buitenlandse Zaken.
      De houder wordt hiervan terstond in kennis gesteld. Het reisdocument wordt teruggegeven wanneer de betrokken houder
      in zijn woonplaats is teruggekeerd.

      2 Aan de houder wordt een reisdocument als bedoeld in [artikel 2, eerste lid, onder f][ref1], verstrekt met een
      zodanige tijdelijke en territoriale geldigheid als vereist is voor een rechtstreekse reis naar zijn woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
        hoofdstuk: I
  - number: '52'
    text: |-
      Een reisdocument kan worden ingehouden door de autoriteiten, bedoeld in de [artikelen 18][ref1] en [19][ref2] op
      het moment dat zij het verzoek doen ingevolge [artikel 25, eerste lid][ref3]. Het ingehouden reisdocument wordt
      uiterlijk binnen twee weken toegezonden aan de tot vervallenverklaring bevoegde autoriteit, dan wel aan de houder
      teruggegeven. Van de doorzending wordt de houder terstond in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel52
