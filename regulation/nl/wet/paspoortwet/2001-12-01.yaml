  - number: '26'
    text: |-
      1 Bevoegd tot het in ontvangst nemen van aanvragen voor nationale paspoorten, reisdocumenten voor vluchtelingen en
      reisdocumenten voor vreemdelingen, zijn:

      a. in Nederland: de burgemeester, voor zover het personen betreft die als ingezetene in de basisadministratie
      persoonsgegevens van zijn gemeente zijn ingeschreven;

      b. in de Nederlandse Antillen en Aruba: de Gouverneur en, voor zover het personen betreft die in de
      basisadministratie persoonsgegevens van de eilandgebieden van de Nederlandse Antillen dan wel van Aruba zijn
      opgenomen, de door de Gouverneur na overleg met Onze Minister daartoe aangewezen autoriteiten;

      c. in het buitenland: het hoofd van de daartoe aangewezen consulaire post, voor zover het personen betreft die zich
      in zijn ressort of in het ressort van een onder zijn verantwoordelijkheid staande consulaire post bevinden;

      d. Onze Minister en de door hem onderscheidenlijk de door de Gouverneur na overleg met Onze Minister daartoe
      aangewezen autoriteiten, in bijzondere door Onze Minister te bepalen gevallen.

      2 Bevoegd tot het in ontvangst nemen van aanvragen voor diplomatieke paspoorten en voor dienstpaspoorten is Onze
      Minister van Buitenlandse Zaken.

      3 Bevoegd tot het in ontvangst nemen van aanvragen voor reisdocumenten als bedoeld in
      [artikel 2, eerste lid, onder f en g][ref1], zijn Onze Minister en de door hem daartoe aangewezen autoriteiten, de
      Gouverneur van de Nederlandse Antillen onderscheidenlijk Aruba en de door hem na overleg met Onze Minister daartoe
      aangewezen autoriteiten en in het buitenland het hoofd van de daartoe aangewezen consulaire post.

      4 Bevoegd tot het in ontvangst nemen van aanvragen voor Nederlandse identiteitskaarten zijn de in het eerste lid,
      onder a en d bedoelde autoriteiten en, voor zover het personen betreft die in hun ressort of in het ressort van
      een onder hun verantwoordelijkheid staande consulaire post woonachtig zijn, de onder c bedoelde autoriteiten, die
      daartoe in overeenstemming met Onze Minister zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel26
    references:
      - id: ref1
