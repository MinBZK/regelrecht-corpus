preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat in verband met het recht het land te verlaten, zoals neergelegd in
    voor het Koninkrijk geldende verdragen, in verband met artikel 2, vierde lid, van de Grondwet en gelet op artikel
    3, eerste lid, onder b, van het Statuut voor het Koninkrijk der Nederlanden, bij rijkswet regelen dienen te
    worden gesteld met betrekking tot de aanspraken op paspoorten en andere reisdocumenten en de beperkingen van deze
    aanspraken;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. aanvraag: het verzoek tot verstrekking van een reisdocument, tot bijschrijving van kinderen als bedoeld in
      [artikel 17][ref1] of tot wijziging van gegevens vermeld in een eerder verstrekt reisdocument;

      b. weigering: de afwijzende beslissing op de aanvraag, die in behandeling is genomen;

      c. verstrekking: de beslissing tot uitreiking van een nieuw reisdocument;

      d. uitreiking: het feitelijk ter beschikking van de houder stellen van het op zijn naam gesteld reisdocument;

      e. houder: degene op wiens naam het reisdocument is gesteld en ten behoeve van wie het is uitgereikt;

      f. wijziging: het in overeenstemming met het bij of krachtens deze wet bepaalde aanbrengen van een of meer
      aantekeningen in een reisdocument, strekkende tot verandering dan wel aanvulling van daarin vermelde gegevens;

      g. inhouding: het feitelijk aan de beschikking van de houder onttrekken van een op zijn naam gesteld reisdocument;

      h. vervallen of vervallenverklaring: het ongeldig worden of de beslissing tot het ongeldig verklaren van een
      reisdocument;

      i. vermissing: ieder geval waarin de houder niet meer de feitelijke beschikking heeft over een op zijn naam gesteld
      reisdocument, anders dan door of ten behoeve van handelingen van een daartoe bevoegde autoriteit;

      j. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in zijn hoedanigheid van Minister van
      het Koninkrijk;

      k. Onze Minister die het aangaat: Onze Minister in Nederland, respectievelijk Onze Minister in de Nederlandse
      Antillen onderscheidenlijk in Aruba die het aangaat;

      l. de Gouverneur: de Gouverneur van de Nederlandse Antillen onderscheidenlijk van Aruba.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel17
