  - number: '48'
    text: |-
      1 Degene, die de verklaring van toestemming als bedoeld in de [artikelen 34, eerste lid][ref1] en
      [37, eerste lid][ref2], intrekt, geeft hiervan onverwijld schriftelijk kennis aan de ten aanzien van de
      houder tot verstrekking bevoegde autoriteit dan wel, indien deze autoriteit niet bekend is, aan Onze Minister,
      onderscheidenlijk de Gouverneur.

      2 De in het eerste lid bedoelde autoriteit deelt de houder of diens wettelijke vertegenwoordiger schriftelijk mede
      dat het reisdocument wegens intrekking van de verklaring van toestemming van rechtswege vervalt, indien:

      a. de houder of diens wettelijke vertegenwoordiger niet binnen vier weken na deze mededeling gebruik heeft
      gemaakt van de bevoegdheid tot het verzoeken van een vervangende verklaring van toestemming ingevolge
      [artikel 34, tweede of derde lid][ref3], dan wel [artikel 37, derde lid][ref4] en hem daarvan schriftelijke
      mededeling heeft gedaan;

      b. de houder of diens wettelijke vertegenwoordiger het verzoek tot het verkrijgen van een vervangende verklaring
      van toestemming als bedoeld onder *a*, intrekt dan wel de afwijzende beschikking van de rechter op dit verzoek in
      kracht van gewijsde is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel37
