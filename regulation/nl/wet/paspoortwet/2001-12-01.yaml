  - number: '53'
    text: |-
      1 Een reisdocument dat vervallen kan worden verklaard, wordt door de tot inhouding bevoegde
      autoriteiten ingehouden, indien zij van Onze Minister een mededeling hebben ontvangen als bedoeld in
      [artikel 25, vierde lid][ref1]. Indien de autoriteit die het reisdocument heeft ingehouden niet tevens de tot
      vervallenverklaring bevoegde autoriteit is, zendt hij het ingehouden reisdocument onverwijld aan laatstgenoemde
      autoriteit toe. De houder wordt hiervan terstond in kennis gesteld.

      2 Het bepaalde in [artikel 46, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel46
