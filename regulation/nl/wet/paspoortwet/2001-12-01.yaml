  - number: '42'
    text: |-
      1 Bevoegd tot uitreiking van reisdocumenten zijn de autoriteiten, die ingevolge [artikel 26][ref1] bevoegd zijn de
      aanvragen daarvoor in ontvangst te nemen.

      2 De uitreiking volgt in het Koninkrijk uiterlijk binnen twee weken, buiten het Koninkrijk uiterlijk binnen vier
      weken na de verstrekking.

      3 Uitreiking van het reisdocument vindt niet plaats, indien:

      a. de aanvrager niet, ingevolge het bepaalde in [artikel 32, tweede lid][ref2], alle Nederlandse reisdocumenten die
      op zijn naam zijn gesteld inlevert bij de uitreiking;

      b. de tot uitreiking bevoegde autoriteit een mededeling heeft ontvangen tot inhouding als bedoeld in
      [artikel 25, vierde lid][ref3];

      c. ten aanzien van de houder van het uit te reiken reisdocument zich een omstandigheid als bedoeld in
      [artikel 47, eerste lid, onder a, b, c, e, f of h][ref4], blijkt voor te doen.

      4 Het reisdocument dat niet binnen drie maanden nadat het voor uitreiking beschikbaar is gesteld, door de aanvrager
      in ontvangst is genomen, wordt door de daartoe bevoegde autoriteit definitief aan het verkeer onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
