  - number: '46'
    text: |-
      1 De beschikking tot weigering of vervallenverklaring wordt zo spoedig mogelijk doch uiterlijk binnen vier weken na
      het verstrijken van de termijn, bedoeld in [artikel 45, tweede lid][ref1], gegeven. In de Nederlandse Antillen en
      in Aruba wordt de beschikking schriftelijk aan de aanvrager, onderscheidenlijk de houder bekendgemaakt.

      2 Aan de Nederlander buiten het Koninkrijk die voornemens is zich naar het Koninkrijk te begeven en aan wie de
      verstrekking van een reisdocument moet worden geweigerd respectievelijk wiens ingehouden reisdocument moet worden
      vervallen verklaard op grond van de voorgaande bepalingen, kan een reisdocument worden verstrekt als bedoeld in
      [artikel 2, eerste lid, onder f][ref2], met een zodanige tijdelijke en territoriale geldigheid als vereist is voor
      een rechtstreekse reis naar zijn land in het Koninkrijk.

      3 Het bepaalde in het tweede lid is van overeenkomstige toepassing op de vreemdelingen aan wie op grond van de
      [artikelen 11 tot en met 15][ref3] een Nederlands reisdocument is verstrekt, voor zover zij nog beschikken over een
      geldige titel tot verblijf in een der landen van het Koninkrijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel45
