  - number: '41'
    text: |-
      1 De krachtens [artikel 40][ref1] bevoegde autoriteiten verstrekken het aangevraagde reisdocument zo spoedig
      mogelijk, doch uiterlijk binnen vier weken na de dag van de aanvraag, tenzij de aanvraag een persoon betreft op wie
      een mededeling als bedoeld in [artikel 25, vierde lid][ref2], van toepassing is.

      2 De termijn genoemd in het eerste lid, kan in bijzondere gevallen met hoogstens vier weken worden verlengd. De
      aanvrager wordt daarvan zo spoedig mogelijk doch in ieder geval voor de afloop van de eerste termijn, schriftelijk
      in kennis gesteld.

      3 Indien de aanvraag een persoon betreft op wie een mededeling als bedoeld in [artikel 25, vierde lid][ref3],
      van toepassing is en de autoriteit van de Nederlandse Antillen en van Aruba die de aanvraag in ontvangst heeft
      genomen niet tevens de ingevolge [artikel 40][ref4] tot verstrekking bevoegde autoriteit is, legt hij de aanvraag
      onverwijld voor aan de tot verstrekking van dat reisdocument bevoegde autoriteit. Van de voorlegging wordt de
      aanvrager terstond in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel40
