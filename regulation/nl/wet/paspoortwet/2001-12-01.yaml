  - number: '54'
    text: |-
      1 Een reisdocument wordt ingehouden, indien:

      a. het van rechtswege is vervallen ingevolge [artikel 47][ref1] of [48][ref2];

      b. het zodanig is beschadigd dat daarin opgenomen beveiligingskenmerken zijn aangetast, gegevens niet meer leesbaar
      zijn of een deel ervan ontbreekt;

      c. in of aan het document wijzigingen zijn aangebracht of aantekeningen zijn gesteld door een onbevoegde;

      d. de foto van de houder niet langer voldoende gelijkenis vertoont;

      e. blijkt dat daarin abusievelijk verkeerde gegevens zijn vermeld dan wel anderszins fouten zijn gemaakt bij de
      vervaardiging van het reisdocument.

      2 Indien de autoriteit die het reisdocument heeft ingehouden, niet bevoegd is tot definitieve onttrekking van
      reisdocumenten aan het verkeer, zendt hij het ingehouden reisdocument onverwijld aan een daartoe wel bevoegde
      autoriteit. De houder wordt hiervan terstond in kennis gesteld.

      3 De daartoe bevoegde autoriteit onttrekt het ingehouden reisdocument definitief aan het verkeer, tenzij nog een
      beroepstermijn openstaat, een beroepsprocedure aanhangig is of het reisdocument anderszins in een gerechtelijke
      procedure nodig is.

      4 Een reisdocument waarin een bijschrijving is opgenomen die van rechtswege is vervallen ingevolge
      [artikel 47, tweede lid][ref3], wordt ingehouden door de autoriteit die bevoegd is tot het verwijderen van die
      bijschrijving. Deze autoriteit maakt de bijschrijving ongedaan en geeft het reisdocument terstond terug aan de
      houder.

      5 Indien het van rechtswege vervallen reisdocument is ingehouden naar aanleiding van een mededeling van Onze
      Minister als bedoeld in [artikel 25, vierde lid][ref4], wordt Onze Minister van de inhouding onverwijld in kennis
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel54
