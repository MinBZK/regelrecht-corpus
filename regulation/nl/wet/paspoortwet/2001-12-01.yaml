  - number: '33'
    text: |-
      De rechten die in verband met de aanvraag, verstrekking, uitreiking, wijziging of vermissing van een reisdocument
      zijn verschuldigd, worden bij de indiening van de aanvraag voldaan.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel33
  - number: '34'
    text: |-
      1 Bij een aanvraag door of ten behoeve van een minderjarige wordt een verklaring van toestemming overgelegd van
      iedere persoon die het gezag uitoefent. Indien de minderjarige onder voorlopige voogdij van een voogdij-instelling
      in Nederland is geplaatst onderscheidenlijk voorlopig is toevertrouwd aan een Voogdijraad in de Nederlandse
      Antillen of Aruba, wordt evenwel een verklaring van toestemming van de desbetreffende voogdij-instelling dan wel
      van de desbetreffende Voogdijraad overgelegd.

      2 Indien bij gezamenlijke gezagsuitoefening een van de personen die het gezag uitoefenen, weigert een verklaring
      van toestemming als bedoeld in het eerste lid, af te geven, kan deze op verzoek van de andere persoon die het gezag
      uitoefent, worden vervangen door een verklaring van de bevoegde rechter, die alvorens te beslissen een vergelijk
      tussen de beide personen beproeft.

      3 Indien een persoon die het gezag uitoefent, de desbetreffende voogdij-instelling of de desbetreffende Voogdijraad
      een verklaring van toestemming als bedoeld in het eerste lid weigert, kan deze op verzoek van de minderjarige van
      zestien jaren of ouder worden vervangen door een verklaring van de bevoegde rechter.

      4 Indien bij gezamenlijke gezagsuitoefening het als gevolg van oorlog, oproer, natuurrampen of daaraan verwante dan
      wel daarmee samenhangende omstandigheden feitelijk onmogelijk is een verklaring van toestemming als bedoeld in het
      eerste lid, te verkrijgen van de andere persoon die het gezag uitoefent, kan deze in afwijking van het eerste lid
      worden vervangen door een verklaring van de bevoegde rechter.

      5 De rechter geeft in de in het tweede, derde en vierde lid bedoelde gevallen een zodanige beslissing als hem in
      het belang van het kind wenselijk voorkomt. Daarbij kan als voorwaarde worden gesteld dat de geldigheidsduur of de
      territoriale geldigheid van het aangevraagde reisdocument wordt beperkt.

      6 Een verklaring van toestemming als bedoeld in het eerste lid, behoeft niet te worden overgelegd bij de aanvraag
      van een Nederlandse identiteitskaart door of ten behoeve van een minderjarige die de leeftijd van twaalf jaren
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel34
  - number: '35'
    text: |-
      Aan de minderjarige die in werkelijke militaire dienst is, wordt een reisdocument verstrekt indien en voor zolang
      de daartoe aangewezen militaire autoriteit verklaart, dat zulks in het belang van de dienst is. Dit reisdocument
      geldt uiterlijk tot het tijdstip waarop de dienst wordt verlaten.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel35
  - number: '37'
    text: |-
      1 Bij een aanvraag door of ten behoeve van een onder curatele gestelde, wordt een verklaring van toestemming van de
      curator overgelegd.

      2 Een verklaring van toestemming als bedoeld in het eerste lid behoeft niet te worden overgelegd bij de aanvraag
      van een Nederlandse identiteitskaart.

      3 Indien de curator weigert een verklaring van toestemming als bedoeld in het eerste lid af te geven, kan deze op
      verzoek van de onder curatele gestelde worden vervangen door een verklaring van de bevoegde rechter. Deze neemt een
      zodanige beslissing als hem in het belang van de onder curatele gestelde wenselijk voorkomt.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel37
  - number: '38'
    text: |-
      1 Op de procedure ingevolge de [artikelen 34][ref1] en [37][ref2] is in Nederland de
      [twaalfde titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref3], met uitzondering van
      [artikel 429d, derde lid][ref4], van toepassing.

      2 De bevoegde rechter, genoemd in [artikel 34, tweede, derde en vierde lid][ref5], is in Nederland de
      kinderrechter, in de Nederlandse Antillen onderscheidenlijk Aruba de rechter in eerste aanleg.

      3

      4 De bevoegde rechter, genoemd in [artikel 37, derde lid][ref6], is in Nederland de kantonrechter, in de
      Nederlandse Antillen onderscheidenlijk Aruba de rechter in eerste aanleg.

      5 De rechter beslist met de meeste spoed.

      6 Bij een aanvraag ten behoeve van een handelingsonbekwame wordt deze als aanvrager beschouwd.

      7 De minderjarige, bedoeld in [artikel 34, derde lid, en de onder][ref7] curatele gestelde zijn bekwaam in rechte
      op te treden en tegen een uitspraak beroep in te stellen.


