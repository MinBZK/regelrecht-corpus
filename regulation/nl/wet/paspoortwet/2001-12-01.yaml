  - number: '67'
    text: |-
      Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kunnen
      verschillende tijdstippen worden vastgesteld, waarop [artikel 3, eerste lid][ref1], voor zover het betreft de
      vermelding van het geslacht als persoonsgegeven van de houder, respectievelijk [artikel 56][ref2], voor zover het
      betreft de inlevering van reisdocumenten die ingevolge [artikel 47, eerste lid, onder ][ref3] van rechtswege zijn
      vervallen, in werking treden.


