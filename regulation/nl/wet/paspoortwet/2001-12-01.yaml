  - number: '2'
    text: |-
      1 Reisdocumenten van het Koninkrijk der Nederlanden zijn:

      a. nationaal paspoort;

      b. diplomatiek paspoort;

      c. dienstpaspoort;

      d. reisdocument voor vluchtelingen;

      e. reisdocument voor vreemdelingen;

      f. nooddocument;

      g. andere reisdocumenten, door Onze Minister vast te stellen.

      2 Reisdocument van Nederland is de Nederlandse identiteitskaart, geldig voor de landen die partij zijn bij de op
      13 december 1957 te Parijs tot stand gekomen Europese Overeenkomst nopens het verkeer van personen tussen de Lid-
      Staten van de Raad van Europa (*Trb.* 1960, 103). Onze Minister kan de territoriale geldigheid van de Nederlandse
      identiteitskaart uitbreiden.

      3 Onze Minister stelt met inachtneming van het bij of krachtens deze wet bepaalde de geldigheidsduur, de
      territoriale geldigheid en het model van de in het eerste en tweede lid bedoelde reisdocumenten vast en draagt zorg
      voor de vervaardiging van die documenten.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel2
  - number: '3'
    text: |-
      1 Elk reisdocument vermeldt de volgende persoonsgegevens van de houder: geslachtsnaam, voornamen, geboortedatum,
      geboorteplaats, geslacht, woonplaats, adres en lengte. Onze Minister kan bepalen in welke gevallen kan worden
      afgezien van vermelding van respectievelijk geboorteplaats, woonplaats, adres en lengte.

      2 Indien in een reisdocument een minderjarige jonger dan zestien jaren wordt bijgeschreven worden van deze vermeld:
      geslachtsnaam, voornamen, geboortedatum, geboorteplaats en geslacht. Elke bijschrijving is voorzien van de foto van
      de bijgeschreven persoon.

      3 Elk reisdocument is voorzien van de foto en de handtekening van de houder en van een documentnummer, volgens door
      Onze Minister te stellen regelen, waarbij in bijzondere gevallen van de eis van het stellen van een handtekening
      kan worden afgeweken. Indien in bijzondere gevallen het overleggen van een foto niet mogelijk is, kan daarvan
      volgens door Onze Minister te stellen regelen worden afgeweken.

      4 Op nader door Onze Minister aan te wijzen reisdocumenten die worden verstrekt aan Nederlanders die als ingezetene
      in de basisadministratie persoonsgegevens van een gemeente zijn ingeschreven, wordt van de houder het sociaal-
      fiscaal nummer, bedoeld in [artikel 47][ref1], vermeld.

      5 Elk reisdocument vermeldt de autoriteit die het document heeft verstrekt, de datum van verstrekking en het einde
      van de geldigheidsduur, alsmede de territoriale geldigheid.

      6 In reisdocumenten die aan Nederlanders worden verstrekt, wordt de Nederlandse nationaliteit vermeld. In
      reisdocumenten voor vluchtelingen en in reisdocumenten die aan staatlozen worden verstrekt, wordt de status van de
      houder vermeld.

      7 Op verzoek van de houder kan in diens reisdocument tevens de geslachtsnaam worden vermeld van de echtgenoot,
      echtgenote of geregistreerde partner, dan wel, indien de houder geen echtgenoot, echtgenote of geregistreerde
      partner meer heeft, de geslachtsnaam van de gewezen echtgenoot, echtgenote of geregistreerde partner met wie het
      huwelijk of het geregistreerd partnerschap laatstelijk is geëindigd, voor zover het model van het reisdocument
      daartoe voldoende ruimte bevat. Onze Minister stelt nadere regels met betrekking tot de wijze waarop de
      naamsvermelding plaatsvindt.

      8 De tot uitreiking bevoegde autoriteiten houden een administratie bij met betrekking tot uitgereikte
      reisdocumenten en daarin bijgeschreven personen. Deze administratie bevat de gegevens bedoeld in het eerste,
      tweede, vierde, vijfde en zesde lid van dit artikel, alsmede de documentnummers. In deze administratie kunnen
      voorts ten hoogste de gegevens die bij de aanvraag zijn overgelegd, worden opgenomen. De foto en de handtekening
      worden bewaard door de autoriteit die het reisdocument heeft verstrekt, in een administratie die zowel op naam als
      op documentnummer toegankelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
