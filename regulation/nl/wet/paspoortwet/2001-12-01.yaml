  - number: '5'
    text: |-
      Een ieder die, anders dan voor ambtelijke doeleinden of ter voldoening aan een wettelijk voorschrift, in het bezit
      is van een reisdocument waarvan hij niet de houder is, draagt zorg dat het onverwijld ter beschikking komt van een
      ingevolge deze wet tot inhouding bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel5
  - number: '6'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet in de Nederlandse Antillen en in Aruba en daarbij de
      beschikking krijgt over gegevens waarvan hij het vertrouwelijk karakter kent of redelijkerwijs moet vermoeden,
      en voor wie niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een
      geheimhoudingsplicht geldt, is verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift
      hem tot bekendmaking verplicht of uit zijn taak bij de uitvoering van deze wet de noodzaak tot bekendmaking
      voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel6
  - number: '7'
    text: |-
      1 Bij algemene maatregel van rijksbestuur worden regels vastgesteld omtrent:

      a. de door een gemeente dan wel een eilandgebied van de Nederlandse Antillen onderscheidenlijk Aruba aan het Rijk
      verschuldigde kosten, de afdracht daarvan en de wijze waarop deze dient te geschieden, terzake van reisdocumenten
      indien de aanvraag bij de burgemeester dan wel de daartoe door de Gouverneur aangewezen autoriteit is ingediend;

      b. de door de aanvrager aan het Rijk verschuldigde rechten en de wijze waarop deze moeten worden voldaan, wegens
      handelingen ten behoeve van de uitreiking van reisdocumenten indien de aanvraag bij een andere daartoe bevoegde
      autoriteit dan die, bedoeld onder *a* is ingediend;

      c. de gevallen waarin van de plicht tot betaling van de kosten, bedoeld in onderdeel *a*, onderscheidenlijk van de
      rechten bedoeld in onderdeel *b*, geheel of gedeeltelijk ontheffing kan worden verleend.

      2 Het tarief van de gemeentelijke rechten kan verschillen al naar gelang de leeftijd van de persoon op wiens naam
      het reisdocument wordt gesteld, het soort reisdocument en de geldigheidsduur van het reisdocument.

      3 Bij algemene maatregel van rijksbestuur kan met betrekking tot een in Nederland aangevraagd reisdocument worden
      bepaald dat de door de burger bij de aanvraag aan het rijk dan wel aan de gemeente verschuldigde rechten of leges
      een in die algemene maatregel van rijksbestuur te bepalen bedrag niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister van Buitenlandse Zaken wijst de consulaire posten aan die belast zijn met de uitoefening van
      bevoegdheden ingevolge deze wet.

      2 Onze Minister kan in overeenstemming met Onze Minister van Buitenlandse Zaken in bijzondere omstandigheden
      voor de uitoefening van bevoegdheden ingevolge deze wet, mandaat verlenen aan autoriteiten van met het Koninkrijk
      bevriende mogendheden. Het desbetreffende besluit vermeldt de redenen van deze bevoegdheidsverlening en de termijn
      waarvoor zij geldt. Onze Minister stelt nadere regels omtrent de uitoefening van de bevoegdheden, waarbij het
      bepaalde in deze wet zoveel mogelijk van overeenkomstige toepassing is.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel8
  - number: '9'
    text: |-
      Iedere Nederlander heeft binnen de grenzen bij deze wet bepaald, recht op een nationaal paspoort, geldig voor vijf
      jaren en voor alle landen.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel9
  - number: '10'
    text: |-
      Aan Nederlanders die zich ten behoeve van het Koninkrijk of een der landen van het Koninkrijk naar het buitenland
      begeven wordt, binnen de grenzen bij deze wet bepaald, een diplomatiek paspoort dan wel een dienstpaspoort
      verstrekt indien en voor zolang Onze Minister van Buitenlandse Zaken zulks noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel10
  - number: '11'
    text: |-
      1 Iedere vreemdeling die ingevolge [artikel 33 van de Vreemdelingenwet 2000][ref1] tot Nederland dan wel iedere
      vluchteling die als zodanig tot de Nederlandse Antillen of Aruba is toegelaten, heeft binnen de grenzen bij deze
      wet bepaald, recht op een reisdocument voor vluchtelingen, geldig voor vijf jaren.

      2 Iedere vreemdeling die ingevolge [artikel 28 van de Vreemdelingenwet 2000][ref2] tot Nederland is toegelaten,
      heeft binnen de grenzen bij deze wet bepaald, recht op een reisdocument voor vluchtelingen, geldig voor ten minste
      een jaar en ten hoogste drie jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '12'
    text: |-
      Aan de erkende vluchteling die niet als zodanig tot de Nederlandse Antillen of Aruba is toegelaten, kan binnen de
      grenzen bij deze wet bepaald, een reisdocument voor vluchtelingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel12
  - number: '13'
    text: |-
      Iedere vreemdeling die als staatloze tot een der landen van het Koninkrijk is toegelaten, heeft binnen de grenzen
      bij deze wet bepaald, recht op een reisdocument voor vreemdelingen, geldig voor ten minste drie maanden en voor
      alle landen.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel13
  - number: '14'
    text: |-
      Aan andere in een der landen van het Koninkrijk toegelaten vreemdelingen dan bedoeld in de [artikelen 11][ref1],
      [12][ref2] en [13][ref3], die geen reisdocument van een ander land kunnen verkrijgen dan wel die kunnen aantonen
      dat van hen redelijkerwijs niet kan worden gevergd dat zij van een ander land een reisdocument aanvragen, kan
      binnen de grenzen bij deze wet bepaald, een reisdocument voor vreemdelingen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel13
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel14
