  - number: '45'
    text: |-
      1 Indien binnen de periode van acht weken, bedoeld in [artikel 44, vierde lid][ref1], door de autoriteit bij
      wie de gronden tot weigering of vervallenverklaring bestaan aan de tot weigering of vervallenverklaring bevoegde
      autoriteit wordt medegedeeld, dat overeenstemming is bereikt met de aanvrager respectievelijk de houder, dan wel
      indien de gronden bij de tot weigering of vervallenverklaring bevoegde autoriteit zelf bestaan, door deze een
      dergelijke overeenstemming is bereikt, wordt zo spoedig mogelijk doch uiterlijk binnen vier weken overeenkomstig
      de bereikte overeenstemming het aangevraagde reisdocument verstrekt of het ingehouden reisdocument teruggegeven dan
      wel het reisdocument, waarvan de geldigheidsduur onderscheidenlijk de territoriale geldigheid beperkter is dan de
      bij of krachtens de wet vastgestelde, verstrekt.

      2 Indien binnen de periode van acht weken, bedoeld in [artikel 44, vierde lid][ref2], geen mededeling wordt gedaan
      als bedoeld in het eerste lid, dan wel de aanvrager respectievelijk de houder geen verzoek doet als bedoeld in
      [artikel 44, vierde lid][ref3], gaat de tot weigering of vervallenverklaring bevoegde autoriteit tot weigering of
      vervallenverklaring over, tenzij hij van oordeel is dat de aanvrager respectievelijk de houder door deze beslissing
      onevenredig zou worden benadeeld. In dat geval verstrekt de tot weigering of vervallenverklaring bevoegde
      autoriteit na overleg met de autoriteit bij wie de gronden tot weigering of vervallenverklaring bestaan het
      aangevraagde reisdocument of geeft hij het ingehouden reisdocument terug dan wel verstrekt hij een reisdocument,
      waarvan de geldigheidsduur onderscheidenlijk de territoriale geldigheid beperkter is dan de bij of krachtens de
      wet vastgestelde.

      3 De tot weigering of vervallenverklaring bevoegde autoriteit doet van zijn beslissing, bedoeld in het tweede
      lid, onverwijld mededeling aan Onze Minister onderscheidenlijk de Gouverneur. Bij deze mededeling vermeldt hij het
      oordeel van de autoriteit bij wie de gronden tot weigering of vervallenverklaring bestaan. De Gouverneur draagt
      zorg dat de aan hem gedane mededeling ter kennis komt van Onze Minister. Onze Minister neemt deze mededeling op in
      het register, bedoeld in [artikel 25, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel44
