  - number: '43'
    text: |-
      De autoriteiten, bedoeld in [artikel 42, eerste lid][ref1], alsmede andere door Onze Minister daartoe aangewezen
      autoriteiten zijn, volgens nadere door hem te stellen regelen, bevoegd tot:

      a. bijschrijving van kinderen als bedoeld in [artikel 17][ref2], alsmede tot wijziging of verwijdering daarvan;

      b. wijziging als bedoeld in [artikel 1, onder f][ref3].


