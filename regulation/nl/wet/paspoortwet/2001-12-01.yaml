  - number: '57'
    text: |-
      Bevoegd tot het definitief aan het verkeer onttrekken van reisdocumenten volgens door Onze Minister te
      stellen regelen zijn de autoriteiten die bevoegd zijn tot verstrekking, weigering of vervallenverklaring van
      reisdocumenten.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel57
  - number: '58'
    text: |-
      Het toezicht op de uitvoering van deze wet berust bij Onze Minister. Aan hem en aan door hem aangewezen ambtenaren
      worden door de autoriteiten belast met de uitvoering van deze wet alle inlichtingen verstrekt welke zij in verband
      met de uitoefening van hun taak nodig hebben en wordt inzage verleend in alle bescheiden die verband houden met de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel58
  - number: '59'
    text: |-
      Onze Minister stelt regelen met betrekking tot de administratie en de beveiliging van reisdocumenten aan de
      autoriteiten belast met de uitvoering van deze wet. Hij stelt deze regelen in overeenstemming met Onze Minister die
      het aangaat, indien dit uit de aard van de te regelen zaak voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel59
  - number: '60'
    text: |-
      1 Het is een ieder verboden een reisdocument valselijk op te maken of te vervalsen, of een zodanig stuk op grond
      van valse gegevens te doen verstrekken dan wel een aan hem of een ander verstrekt reisdocument ter beschikking te
      stellen van derden, met het oogmerk het door dezen te doen gebruiken als ware het aan hen verstrekt.

      2 Het is een ieder verboden in het bezit te zijn van een reisdocument waarvan hij weet of redelijkerwijs moet
      vermoeden, dat het vals of vervalst is, dan wel opzettelijk gebruik te maken van een niet op zijn naam gesteld
      reisdocument.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel60
  - number: '61'
    text: |-
      Het is een ieder verboden drukwerken of andere voorwerpen in een vorm die ze op reisdocumenten doet gelijken, te
      vervaardigen, te verspreiden of ter verspreiding in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel61
  - number: '62'
    text: |-
      Ieder is verplicht een reisdocument dat in zijn bezit is, maar waarvan hij niet de houder is, of dat ingevolge het
      bepaalde in [artikel 56][ref1] moet worden ingeleverd, terstond wanneer hem dit mondeling door een tot inhouding
      bevoegde ambtenaar is bevolen, dan wel binnen veertien dagen, nadat hem dit bij aangetekend schrijven in persoon is
      medegedeeld, in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel56
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '56'
        hoofdstuk: VIII
  - number: '63'
    text: |-
      Bij wet onderscheidenlijk bij landsverordening wordt overtreding van het in de [artikelen 60][ref1], [61][ref2] en
      [62][ref3] bepaalde strafbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel62
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '60'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '61'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '62'
        hoofdstuk: X
  - number: '64'
    text: |-
      Bij landsverordening wordt geregeld de mogelijkheid voorziening te vragen tegen de op grond van deze wet genomen
      beschikkingen.
    url: https://wetten.overheid.nl/BWBR0005212/2001-12-01#Artikel64
  - number: '65'
    text: |-
      1 Op aanvragen ter verkrijging van een reisdocument die op het tijdstip van inwerkingtreding van deze wet reeds
      waren ingediend, zijn de bepalingen van deze wet van toepassing.

