  - number: '40'
    text: |-
      1 Bevoegd tot het verstrekken van nationale paspoorten, reisdocumenten voor vluchtelingen en reisdocumenten voor
      vreemdelingen, zijn:

      a. in Nederland: de burgemeester, voor zover het personen betreft die als ingezetene in de basisadministratie
      persoonsgegevens van zijn gemeente zijn ingeschreven;

      b. in de Nederlandse Antillen en Aruba: de Gouverneur en, voor zover het om verstrekking van nationale paspoorten
      gaat aan personen die in de basisadministratie persoonsgegevens van de eilandgebieden van de Nederlandse
      Antillen dan wel van Aruba zijn opgenomen, de door de Gouverneur na overleg met Onze Minister daartoe aangewezen
      autoriteiten;

      c. in het buitenland: het hoofd van de daartoe aangewezen consulaire post, voor zover het personen betreft die zich
      in zijn ressort of in het ressort van een onder zijn verantwoordelijkheid staande consulaire post bevinden;

      d. Onze Minister en de door hem daartoe aangewezen autoriteiten, in bijzondere door hem te bepalen gevallen.

      2 Onze Minister, de burgemeester en het hoofd van de daartoe aangewezen consulaire post gaat niet over tot
      verstrekking van een reisdocument op grond van de [artikelen 14][ref1] en [15][ref2] aan een in Nederland
      toegelaten vreemdeling, dan nadat Onze Minister van Justitie in overeenstemming met Onze Minister van Buitenlandse
      Zaken heeft vastgesteld dat aan de voorwaarden voor een aanspraak in de genoemde artikelen is voldaan.

      3 Het hoofd van de daartoe aangewezen consulaire post gaat niet over tot verstrekking van een reisdocument voor
      vluchtelingen of een reisdocument voor vreemdelingen aan personen die in de Nederlandse Antillen of Aruba zijn
      toegelaten dan nadat de Gouverneur heeft medegedeeld dat aan de voorwaarden voor een aanspraak op grond van de
      [artikelen 11 tot en met 15][ref3] is voldaan.

      4 Reisdocumenten voor vluchtelingen of reisdocumenten voor vreemdelingen worden door de Gouverneur verstrekt met
      inachtneming van de regels die Onze Minister in overeenstemming met Onze Minister van Justitie in zijn hoedanigheid
      van Minister van het Koninkrijk en met Onze Minister van Buitenlandse Zaken kan stellen alsmede nadat in de
      Nederlandse Antillen onderscheidenlijk Aruba is vastgesteld dat aan de daar geldende voorwaarden ingevolge de
      [artikelen 12][ref4], [14][ref5] en [15][ref6] is voldaan.

      5 Bevoegd tot het verstrekken van diplomatieke paspoorten en dienstpaspoorten is Onze Minister van Buitenlandse
      Zaken.

      6 Bevoegd tot het verstrekken van reisdocumenten als bedoeld in [artikel 2, eerste lid, onder f en g][ref7],
      zijn Onze Minister en de door hem daartoe aangewezen autoriteiten, de Gouverneur van de Nederlandse Antillen
      onderscheidenlijk Aruba en de door hem na overleg met Onze Minister daartoe aangewezen autoriteiten en in het
      buitenland het hoofd van de daartoe aangewezen consulaire post.

      7 Bevoegd tot het verstrekken van Nederlandse identiteitskaarten zijn de in het eerste lid, onder a en d
      bedoelde autoriteiten en, voor zover het personen betreft die in hun ressort of in het ressort van een onder hun
      verantwoordelijkheid staande consulaire post woonachtig zijn, de onder c bedoelde autoriteiten, die daartoe in
      overeenstemming met Onze Minister zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel14
