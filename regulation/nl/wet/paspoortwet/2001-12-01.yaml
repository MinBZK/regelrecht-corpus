        paragraaf: '2'
  - number: '15'
    text: |-
      1 In bijzondere gevallen kan een reisdocument als bedoeld in de [artikelen 11 tot en met 14][ref1] worden verstrekt
      aan een tot een der landen van het Koninkrijk toegelaten vreemdeling, die tijdelijk buiten een der landen van het
      Koninkrijk verblijft.

      2 In bijzondere gevallen kan aan een vreemdeling die zich tijdelijk op het grondgebied van een der landen van
      het Koninkrijk mag bevinden en niet in aanmerking komt voor verstrekking van een reisdocument op grond van
      [artikel 14][ref2], een nooddocument dan wel een reisdocument voor vreemdelingen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel14
