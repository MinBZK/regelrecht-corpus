  - number: '26'
    text: |-
      1 Bevoegd tot het in ontvangst nemen van aanvragen voor nationale paspoorten, reisdocumenten voor vluchtelingen en
      reisdocumenten voor vreemdelingen, zijn:

      a. in het Europese deel van Nederland: de burgemeester, voor zover het personen betreft die als ingezetene in de
      basisregistratie personen zijn ingeschreven met een adres in zijn gemeente;

      b. in Aruba, Curaçao en Sint Maarten: de Gouverneur en, voor zover het personen betreft die in de
      bevolkingsadministratie van Aruba, Curaçao of Sint Maarten zijn opgenomen, de door de Gouverneur na overleg met
      Onze Minister daartoe aangewezen autoriteiten;

      c. in een openbaar lichaam: de gezaghebber, voor zover het personen betreft die in de bevolkingsadministratie
      van het openbaar lichaam zijn opgenomen, en in bij of krachtens algemene maatregel van rijksbestuur te bepalen
      gevallen;

      d. in het buitenland: Onze Minister van Buitenlandse Zaken, voor zover het personen betreft die zich buiten het
      Koninkrijk bevinden;

      e. in bijzondere door Onze Minister te bepalen gevallen: Onze Minister en de door hem onderscheidenlijk de door de
      Gouverneur na overleg met Onze Minister daartoe aangewezen autoriteiten.

      2 Bevoegd tot het in ontvangst nemen van aanvragen voor diplomatieke paspoorten en voor dienstpaspoorten is Onze
      Minister van Buitenlandse Zaken.

      3 Bevoegd tot het in ontvangst nemen van aanvragen voor reisdocumenten als bedoeld in
      [artikel 2, eerste lid, onder f en g][ref1], zijn Onze Minister en de door hem daartoe aangewezen autoriteiten, de
      Gouverneur en de door hem na overleg met Onze Minister daartoe aangewezen autoriteiten en in het buitenland Onze
      Minister van Buitenlandse Zaken voor zover het personen betreft die zich buiten het Koninkrijk bevinden.

      4 Bevoegd tot het in ontvangst nemen van aanvragen voor Nederlandse identiteitskaarten zijn de in het eerste lid
      onder a, d en e bedoelde autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
        hoofdstuk: I
  - number: '27'
    text: |-
      1 Een reisdocument wordt slechts verstrekt, nadat een aanvraag is ingediend bij de krachtens [artikel 26][ref1]
      bevoegde autoriteit. Deze draagt zorg dat een aanvraag volgens door Onze Minister te stellen regelen op schrift
      wordt gesteld.

      2 Een aanvraag ingediend bij een krachtens [artikel 26][ref2] bevoegde autoriteit in een openbaar lichaam, Aruba,
      Curaçao of Sint Maarten wordt slechts in behandeling genomen als is voldaan aan het bepaalde in dit hoofdstuk. De
      aanvrager wordt van het niet in behandeling nemen van de aanvraag terstond verwittigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel26
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel27
