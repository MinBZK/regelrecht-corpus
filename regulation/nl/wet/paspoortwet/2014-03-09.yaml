  - number: '49'
    text: |-
      1 Bij de mededeling, bedoeld in [artikel 48, tweede lid][ref1], wijst de in [artikel 48, eerste lid][ref2],
      bedoelde autoriteit de houder of diens wettelijke vertegenwoordiger erop, dat deze verplicht is het reisdocument
      bij hem in te leveren.

      2 Indien de houder een minderjarige is van zestien jaren of ouder, dan wel een onder curatele gestelde, kan de
      in [artikel 48, eerste lid][ref3], bedoelde autoriteit in bijzondere gevallen bepalen, dat het reisdocument in
      afwachting van de rechterlijke uitspraak of beschikking terzake, niet ingeleverd behoeft te worden.

      3 De in [artikel 48, eerste lid][ref4], bedoelde autoriteit draagt zorg dat de houder wiens reisdocument ingevolge
      het eerste lid moet worden ingeleverd onverwijld in het register, bedoeld in [artikel 25, derde lid][ref5],
      wordt vermeld. Deze vermelding kan geen andere gegevens van de betrokken persoon omvatten dan die, bedoeld in
      [artikel 3][ref6]. [Artikel 25, vierde lid][ref7], is van overeenkomstige toepassing.

      4 Onze Minister, onderscheidenlijk de Gouverneur, draagt zorg dat het ingevolge [artikel 53][ref8] ingehouden
      reisdocument onverwijld wordt toegezonden aan de in [artikel 48, eerste lid][ref9], bedoelde autoriteit.


