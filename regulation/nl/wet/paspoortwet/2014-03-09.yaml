  - number: '55'
    text: |-
      Bevoegd tot het inhouden van reisdocumenten, voor zover niet reeds in deze wet voorzien, zijn:

      a. de autoriteiten, die bevoegd zijn tot het in ontvangst nemen van een aanvraag voor reisdocumenten;

      b. de autoriteiten belast met de grensbewaking, de politie en de ambtenaren belast met het toezicht op
      vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel55
  - number: '56'
    text: |-
      De houder van een reisdocument levert dit zo spoedig mogelijk in bij een tot inhouding bevoegde autoriteit, indien
      het reisdocument van rechtswege is vervallen dan wel deze autoriteit om inlevering daarvan ter inhouding als
      bedoeld in de [artikelen 49][ref1], [51][ref2], [52][ref3], [53][ref4] en [54][ref5] verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel49
