  - number: '37'
    text: |-
      1 Bij een aanvraag door of ten behoeve van een onder curatele gestelde, wordt een verklaring van toestemming van de
      curator overgelegd.

      2 Een verklaring van toestemming als bedoeld in het eerste lid behoeft niet te worden overgelegd bij de aanvraag
      van een Nederlandse identiteitskaart.

      3 Indien de curator weigert een verklaring van toestemming als bedoeld in het eerste lid, af te geven, kan deze
      op verzoek van de onder curatele gestelde worden vervangen door een verklaring van de bevoegde rechter. Deze neemt
      een zodanige beslissing als hem in het belang van de onder curatele gestelde wenselijk voorkomt. Daarbij kan als
      voorwaarde worden gesteld dat de geldigheidsduur of de territoriale geldigheid van het aangevraagde reisdocument
      wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel37
  - number: '38'
    text: |-
      1 Op de procedure ingevolge de [artikelen 34][ref1], [36][ref2] en [37][ref3] is in het Europese deel van Nederland
      de [derde titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref4], met uitzondering van
      [artikel 278, derde lid][ref5], van toepassing.

      2 De bevoegde rechter, genoemd in [artikel 34, tweede, derde en vierde lid][ref6], en in [artikel 36][ref7], is
      in het Europese deel van Nederland de kinderrechter, in een openbaar lichaam, Aruba, Curaçao en Sint Maarten de
      rechter in eerste aanleg.

      3

      4 De bevoegde rechter, genoemd in [artikel 37, derde lid][ref8], is in het Europese deel van Nederland de
      kantonrechter, in een openbaar lichaam, Aruba, Curaçao en Sint Maarten de rechter in eerste aanleg.

      5 De rechter beslist met de meeste spoed.

      6 Bij een aanvraag ten behoeve van een handelingsonbekwame wordt deze als aanvrager beschouwd.

      7 De minderjarige, bedoeld in [artikel 34, derde lid, en de onder][ref9] curatele gestelde zijn bekwaam in rechte
      op te treden en tegen een uitspraak beroep in te stellen.


