  - number: '15'
    text: |-
      1 In bijzondere gevallen kan een reisdocument als bedoeld in de [artikelen 11 tot en met 14][ref1] worden verstrekt
      aan een tot het Europese of Caribische deel van Nederland, dan wel Aruba, Curaçao of Sint Maarten toegelaten
      vreemdeling, die tijdelijk buiten het Europese of Caribische deel van Nederland, dan wel Aruba, Curaçao of Sint
      Maarten verblijft.

      2 In bijzondere gevallen kan aan een vreemdeling die zich tijdelijk op het grondgebied van het Europese of
      Caribische deel van Nederland, dan wel Aruba, Curaçao of Sint Maarten mag bevinden en niet in aanmerking komt voor
      verstrekking van een reisdocument op grond van [artikel 14][ref2], een nooddocument dan wel een reisdocument voor
      vreemdelingen worden verstrekt.


