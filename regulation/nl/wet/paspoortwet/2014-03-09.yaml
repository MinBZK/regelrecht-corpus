        artikel: '2'
        hoofdstuk: I
  - number: '2'
    text: |-
      1 Reisdocumenten van het Koninkrijk der Nederlanden zijn:

      a. nationaal paspoort;

      b. diplomatiek paspoort;

      c. dienstpaspoort;

      d. reisdocument voor vluchtelingen;

      e. reisdocument voor vreemdelingen;

      f. nooddocument;

      g. andere reisdocumenten, door Onze Minister vast te stellen.

      2 Identiteitskaart van het Europese deel van Nederland is de Nederlandse identiteitskaart. Hetgeen bij of
      krachtens deze wet is bepaald ten aanzien van reisdocumenten is van overeenkomstige toepassing op de Nederlandse
      identiteitskaart, tenzij anders is bepaald.

      3 Onze Minister stelt met inachtneming van het bij of krachtens deze wet bepaalde de geldigheidsduur en het model
      van de in het eerste en tweede lid bedoelde documenten vast, draagt zorg voor de vervaardiging van die documenten
      en stelt van de in het eerste lid bedoelde reisdocumenten tevens de territoriale geldigheid vast.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel2
  - number: '3'
    text: |-
      1 Elk reisdocument vermeldt de volgende persoonsgegevens van de houder: geslachtsnaam, voornamen, geboortedatum,
      geboorteplaats, geslacht, woonplaats, adres en lengte. Onze Minister kan bepalen in welke gevallen kan worden
      afgezien van vermelding van respectievelijk geboorteplaats, woonplaats, adres en lengte.

      2 Een reisdocument is voorzien van de gezichtsopname, twee vingerafdrukken en de handtekening van de houder
      volgens nader bij regeling van Onze Minister te stellen regels. De Nederlandse identiteitskaart is niet voorzien
      van vingerafdrukken.

      3 Bij algemene maatregel van rijksbestuur kunnen reisdocumenten worden aangewezen die niet worden voorzien van
      een of meer van de in het tweede lid genoemde gegevens en kunnen regels worden gesteld over de gevallen waarin
      kan worden afgezien van het opnemen van de gezichtsopname, vingerafdrukken of de handtekening in het aangevraagde
      reisdocument indien deze gegevens niet van de houder kunnen worden verkregen.

      4 In bij ministeriële regeling te bepalen gevallen wordt in een reisdocument het burgerservicenummer van de houder,
      bedoeld in [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1], vermeld.

      5 Elk reisdocument vermeldt het documentnummer, de autoriteit die het document heeft verstrekt, de datum van
      verstrekking en het einde van de geldigheidsduur, alsmede de territoriale geldigheid. De territoriale geldigheid
      wordt niet vermeld in een Nederlandse identiteitskaart.

      6 In reisdocumenten die aan Nederlanders worden verstrekt, wordt de Nederlandse nationaliteit vermeld. In
      reisdocumenten voor vluchtelingen en in reisdocumenten die aan staatlozen worden verstrekt, wordt de status van de
      houder vermeld.

      7 Op verzoek van de houder kan in diens reisdocument tevens de geslachtsnaam worden vermeld van de echtgenoot,
      echtgenote of geregistreerde partner, dan wel, indien de houder geen echtgenoot, echtgenote of geregistreerde
      partner meer heeft, de geslachtsnaam van de gewezen echtgenoot, echtgenote of geregistreerde partner met wie het
      huwelijk of het geregistreerd partnerschap laatstelijk is geëindigd, voor zover het model van het reisdocument
      daartoe voldoende ruimte bevat. Onze Minister stelt nadere regels met betrekking tot de wijze waarop de
      naamsvermelding plaatsvindt.

      8 De tot uitreiking bevoegde autoriteiten houden een administratie bij met betrekking tot uitgereikte
      reisdocumenten. Deze administratie bevat de gegevens bedoeld in het eerste, vierde, vijfde en zesde lid van
      dit artikel, alsmede de documentnummers. In deze administratie kunnen voorts ten hoogste de gegevens die bij de
      aanvraag zijn overgelegd, worden opgenomen. De foto en de handtekening worden bewaard door de autoriteit die het
      reisdocument heeft verstrekt, in een administratie die zowel op naam als op documentnummer toegankelijk is.

      9 De bij de aanvraag van een reisdocument opgenomen vingerafdrukken worden bewaard totdat de uitreiking van het
      aangevraagde reisdocument, dan wel de reden voor het niet uitreiken daarvan, in de administratie, bedoeld in het
      achtste lid, is geregistreerd en gedurende die periode uitsluitend verwerkt ten behoeve van de verstrekking en de
      uitreiking van het reisdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
