  - number: '39'
    text: |-
      Aan de handelingsonbekwame die zich buiten het Koninkrijk bevindt en bij wiens aanvraag geen verklaring
      van toestemming kan worden overgelegd als bedoeld in [artikel 34, eerste lid][ref1], onderscheidenlijk
      [artikel 37, eerste lid][ref2], kan vooruitlopend op een rechterlijke uitspraak of beschikking ter zake
      van een vervangende verklaring van toestemming, in bijzondere gevallen een reisdocument als bedoeld in
      [artikel 2, eerste lid, onder ][ref3] worden verstrekt.


