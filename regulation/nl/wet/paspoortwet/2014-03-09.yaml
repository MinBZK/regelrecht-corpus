  - number: '5'
    text: |-
      Een ieder die, anders dan voor ambtelijke doeleinden of ter voldoening aan een wettelijk voorschrift, in het bezit
      is van een reisdocument waarvan hij niet de houder is, draagt zorg dat het onverwijld ter beschikking komt van een
      ingevolge deze wet tot inhouding bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel5
  - number: '6'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet in een openbaar lichaam en in Aruba, Curaçao en
      Sint Maarten en daarbij de beschikking krijgt over gegevens waarvan hij het vertrouwelijk karakter kent of
      redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake
      van die gegevens een geheimhoudingsplicht geldt, is verplicht tot geheimhouding daarvan, behoudens voor zover enig
      wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn taak bij de uitvoering van deze wet de noodzaak
      tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel6
  - number: '7'
    text: |-
      1 Bij algemene maatregel van rijksbestuur worden regels vastgesteld omtrent:

      a. de door een gemeente, een openbaar lichaam, Aruba, Curaçao of Sint Maarten ter zake van reisdocumenten aan het
      Rijk verschuldigde kosten, de afdracht daarvan en de wijze waarop deze dient te geschieden, indien de aanvraag is
      ingediend bij de burgemeester, de gezaghebber dan wel de daartoe door de Gouverneur aangewezen autoriteit;

      b. de door de aanvrager aan het Rijk verschuldigde rechten en de wijze waarop deze moeten worden voldaan, wegens
      handelingen ten behoeve van de aanvraag van reisdocumenten indien de aanvraag bij een andere daartoe bevoegde
      autoriteit dan die, bedoeld onder a is ingediend;

      c. de gevallen waarin van de plicht tot betaling van de kosten, bedoeld in onderdeel a, onderscheidenlijk van de
      rechten bedoeld in onderdeel b, geheel of gedeeltelijk ontheffing kan worden verleend.

      2 Voor het verrichten van handelingen door de burgemeester van een gemeente of de gezaghebber van een openbaar
      lichaam ten behoeve van de aanvraag van een reisdocument kunnen rechten worden geheven. Voor die handelingen kunnen
      geen andere dan deze rechten worden geheven. Het tarief van de rechten kan verschillen al naar gelang de leeftijd
      van de aanvrager, het feit of deze in de gemeentelijke basisadministratie persoonsgegevens als ingezetene is
      ingeschreven, de soort en de geldigheidsduur van het reisdocument en de snelheid van de uitreiking.

      3 Bij algemene maatregel van rijksbestuur kan met betrekking tot een in Nederland aangevraagd reisdocument worden
      bepaald dat de door de burger bij de aanvraag aan het Rijk, een gemeente of een openbaar lichaam verschuldigde
      rechten of leges een in die algemene maatregel van rijksbestuur te bepalen bedrag niet te boven gaan.

      4 Indien de aanvraag wordt gedaan bij de burgemeester van een gemeente worden de in het tweede lid bedoelde rechten
      aangemerkt als gemeentelijke belastingen. [Hoofdstuk XV, paragraaf 1][ref1] en [4, van de Gemeentewet][ref2] is van
      toepassing. De [artikelen 229b][ref3] en [229c van de Gemeentewet][ref4] zijn van overeenkomstige toepassing.

      5 Indien de aanvraag wordt gedaan bij de gezaghebber van een openbaar lichaam worden de in het
      tweede lid bedoelde rechten aangemerkt als eilandbelastingen. [Hoofdstuk IV, paragraaf 1][ref5] en
      [4, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref6] is van toepassing. De
      [artikelen 64][ref7] en [65 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref8] zijn van
      overeenkomstige toepassing.


