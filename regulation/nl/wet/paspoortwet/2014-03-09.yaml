  - number: '8'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Buitenlandse Zaken in bijzondere omstandigheden voor de
      uitoefening van bevoegdheden ingevolge deze wet, mandaat verlenen aan autoriteiten van met het Koninkrijk bevriende
      mogendheden. Het desbetreffende besluit vermeldt de redenen van deze bevoegdheidsverlening en de termijn waarvoor
      zij geldt. Onze Minister stelt nadere regels omtrent de uitoefening van de bevoegdheden, waarbij het bepaalde in
      deze wet zoveel mogelijk van overeenkomstige toepassing is.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel8
  - number: '9'
    text: |-
      1 Iedere Nederlander heeft binnen de grenzen bij deze wet bepaald, recht op een nationaal paspoort, geldig voor
      tien jaren en voor alle landen.

      2 In afwijking van het eerste lid heeft een Nederlander die de leeftijd van achttien jaar nog niet heeft bereikt,
      recht op een nationaal paspoort geldig voor vijf jaren en voor alle landen.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel9
  - number: '10'
    text: |-
      Aan Nederlanders die zich ten behoeve van het Koninkrijk of een der landen van het Koninkrijk naar het buitenland
      begeven wordt, binnen de grenzen bij deze wet bepaald, een diplomatiek paspoort dan wel een dienstpaspoort
      verstrekt indien en voor zolang Onze Minister van Buitenlandse Zaken zulks noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel10
  - number: '11'
    text: |-
      1 Iedere vreemdeling die ingevolge [artikel 33 van de Vreemdelingenwet 2000][ref1] tot het Europese deel van
      Nederland dan wel iedere vluchteling die als zodanig tot een openbaar lichaam, Aruba, Curaçao of Sint Maarten is
      toegelaten, heeft binnen de grenzen bij deze wet bepaald, recht op een reisdocument voor vluchtelingen, geldig voor
      vijf jaren.

      2 Iedere vreemdeling die ingevolge [artikel 28 van de Vreemdelingenwet 2000][ref2] tot het Europese deel
      van Nederland is toegelaten, heeft binnen de grenzen bij deze wet bepaald, recht op een reisdocument voor
      vluchtelingen, geldig voor ten minste een jaar en ten hoogste drie jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel11
