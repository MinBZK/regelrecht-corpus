  - number: '50'
    text: |-
      1 Zodra de vervangende verklaring van toestemming op de wijze, bedoeld in [artikel 48, tweede lid, onder a][ref1],
      wordt overgelegd, wordt het reisdocument indien dit ingevolge [artikel 49, eerste lid][ref2], is ingeleverd, dan
      wel ingevolge [artikel 53][ref3] is ingehouden, aan de houder teruggegeven.

      2 Indien het eerder uitgereikte reisdocument buiten schuld van de houder niet is ingeleverd of ingehouden, wordt
      hem met inachtneming van het bepaalde in het eerste lid op zijn aanvraag een nieuw reisdocument verstrekt. Het
      eerder uitgereikte reisdocument vervalt in dat geval van rechtswege.

      3 De in [artikel 48, eerste lid][ref4], bedoelde autoriteit draagt zorg voor de verwijdering van de vermelding
      van de houder uit het daarbedoelde register, zodra ingevolge het eerste lid het reisdocument aan de houder
      is teruggegeven, dan wel ingevolge het tweede lid aan de houder een nieuw reisdocument is verstrekt en het
      eerder uitgereikt reisdocument door hem is ontvangen. [Artikel 25, vijfde lid, tweede volzin][ref5], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel48
