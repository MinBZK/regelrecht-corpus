  - number: '44'
    text: |-
      1 Bevoegd tot weigering of vervallenverklaring van reisdocumenten op de gronden genoemd in [hoofdstuk III][ref1]
      zijn de autoriteiten die ingevolge [artikel 40][ref2] bevoegd zijn tot verstrekking daarvan.

      2 Zodra een tot weigering of vervallenverklaring bevoegde autoriteit een aanvraag in behandeling neemt betreffende
      een persoon ten aanzien van wie een mededeling als bedoeld in [artikel 25, vierde lid][ref3], is gedaan, dan wel
      een ingevolge [artikel 52][ref4] of [53][ref5] ingehouden reisdocument heeft ontvangen, overtuigt hij zich ervan of
      de gronden tot weigering of vervallenverklaring ten aanzien van betrokkene nog bestaan.

      3 Op verzoek van de tot weigering of vervallenverklaring bevoegde autoriteit zendt Onze Minister onderscheidenlijk
      de Gouverneur aan deze de in het register opgenomen gegevens van de betrokkene toe.

      4 Indien de gronden tot weigering of vervallenverklaring nog blijken te bestaan, deelt de tot weigering of
      vervallenverklaring bevoegde autoriteit de aanvrager respectievelijk de houder terstond doch in ieder geval
      binnen vier weken na de aanvraag onderscheidenlijk de inhouding mede dat hij voornemens is de verstrekking van
      het aangevraagde reisdocument te weigeren dan wel het ingehouden reisdocument vervallen te verklaren, tenzij
      de aanvrager respectievelijk de houder hem binnen twee weken verzoekt de beslissing gedurende acht weken aan te
      houden, ten einde met de autoriteit bij wie de gronden bestaan een zodanige overeenstemming te bereiken dat tot
      verstrekking van het aangevraagde reisdocument of teruggave van het ingehouden reisdocument dan wel verstrekking
      van een reisdocument, waarvan de geldigheidsduur onderscheidenlijk de territoriale geldigheid beperkter is dan de
      bij of krachtens de wet vastgestelde, kan worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel40
