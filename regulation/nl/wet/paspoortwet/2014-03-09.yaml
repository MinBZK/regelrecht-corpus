  - number: 65a
    text: |-
      1 Bijschrijvingen op grond van [artikel 17][ref1], zoals dit artikel luidde op 25 juni 2012, vervallen met ingang
      van 26 juni 2012.

      2 Een reisdocument waarin een bijschrijving is opgenomen die is vervallen op grond van het eerste lid, behoudt zijn
      geldigheid ten aanzien van de houder.


