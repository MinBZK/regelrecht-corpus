  - number: '40'
    text: |-
      1 Bevoegd tot het verstrekken van nationale paspoorten, reisdocumenten voor vluchtelingen en reisdocumenten voor
      vreemdelingen, zijn:

      a. in het Europese deel van Nederland: de burgemeester, voor zover het personen betreft die als ingezetene in de
      basisregistratie personen zijn ingeschreven met een adres in zijn gemeente;

      b. in Aruba, Curaçao en Sint Maarten: de Gouverneur en, voor zover het om verstrekking van nationale paspoorten
      gaat aan personen die in de bevolkingsadministratie van Aruba, Curaçao of Sint Maarten zijn opgenomen, de door de
      Gouverneur na overleg met Onze Minister daartoe aangewezen autoriteiten;

      c. in een openbaar lichaam: de gezaghebber, voor zover het personen betreft die in de bevolkingsadministratie
      van het openbaar lichaam zijn opgenomen, en in bij of krachtens algemene maatregel van rijksbestuur te bepalen
      gevallen;

      d. in het buitenland: Onze Minister van Buitenlandse Zaken, voor zover het personen betreft die zich buiten het
      Koninkrijk bevinden.

      e. in bijzondere door Onze Minister te bepalen gevallen: Onze Minister en de door hem daartoe aangewezen
      autoriteiten.

      2 Bevoegd tot het verstrekken van diplomatieke paspoorten en dienstpaspoorten is Onze Minister van Buitenlandse
      Zaken.

      3 Bevoegd tot het verstrekken van reisdocumenten als bedoeld in [artikel 2, eerste lid, onderdelen f en g][ref1],
      zijn:

      a. Onze Minister en de door hem daartoe aangewezen autoriteiten;

      b. de Gouverneur en de door hem na overleg met Onze Minister daartoe aangewezen autoriteiten;

      c. In het buitenland: Onze Minister van Buitenlandse Zaken voor zover het personen betreft die zich buiten het
      Koninkrijk bevinden.

      4 Bevoegd tot het verstrekken van Nederlandse identiteitskaarten zijn de in het eerste lid onder a, d en e bedoelde
      autoriteiten.

      5 Verstrekking van een reisdocument op grond van [artikel 14][ref2] of [15][ref3] aan een persoon die in het
      Europese deel van Nederland is toegelaten, vindt slechts plaats nadat Onze Minister van Justitie in overeenstemming
      met Onze Minister van Buitenlandse Zaken heeft vastgesteld dat aan de voorwaarden voor een aanspraak in de genoemde
      artikelen is voldaan.

      6 Verstrekking van een reisdocument op grond van [artikel 12][ref4], [14][ref5] of [15][ref6] aan een persoon die
      in een openbaar lichaam is toegelaten, vindt slechts plaats nadat Onze Minister van Justitie in overeenstemming
      met Onze Minister van Buitenlandse Zaken heeft vastgesteld dat aan de voorwaarden voor een aanspraak in de genoemde
      artikelen is voldaan.

      7 Verstrekking van een reisdocument op grond van de [artikelen 11 tot en met 15][ref7] aan een persoon die in
      Aruba, Curaçao of Sint Maarten is toegelaten, vindt slechts plaats nadat door de Gouverneur is vastgesteld dat aan
      de daar geldende voorwaarden voor een aanspraak op grond van de artikelen 11 tot en met 15 is voldaan.

      8 Bij regeling van Onze Minister in overeenstemming met Onze Minister van Justitie en met Onze Minister
      van Buitenlandse Zaken kunnen regels worden gesteld over de verstrekking van reisdocumenten op grond van de
      [artikelen 12][ref8], [14][ref9] of [15][ref10] aan personen die in Aruba, Curaçao of Sint Maarten zijn toegelaten.


