  - number: '43'
    text: |-
      De autoriteiten, bedoeld in [artikel 42, eerste lid][ref1], alsmede andere door Onze Minister daartoe aangewezen
      autoriteiten zijn, volgens bij regeling van Onze Minister te stellen regels, bevoegd tot wijziging als bedoeld
      in [artikel 1, onder g][ref2].


