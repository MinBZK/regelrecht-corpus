  - number: '51'
    text: |-
      1 Een reisdocument kan worden ingehouden door Onze Minister van Buitenlandse Zaken onderscheidenlijk de Gouverneur,
      die aan de houder een geldlening heeft verstrekt of ten behoeve van de houder kosten heeft gemaakt. De houder
      wordt hiervan terstond in kennis gesteld. Het reisdocument wordt teruggegeven wanneer de betrokken houder in zijn
      woonplaats is teruggekeerd.

      2 Aan de houder wordt een reisdocument als bedoeld in [artikel 2, eerste lid, onder f][ref1], verstrekt met een
      zodanige tijdelijke en territoriale geldigheid als vereist is voor een rechtstreekse reis naar zijn woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel51
    references:
