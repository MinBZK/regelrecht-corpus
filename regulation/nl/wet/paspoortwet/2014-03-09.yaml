        artikel: '33'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '12'
    text: |-
      Aan de erkende vluchteling die niet als zodanig tot een openbaar lichaam, Aruba, Curaçao of Sint Maarten is
      toegelaten, kan binnen de grenzen bij deze wet bepaald, een reisdocument voor vluchtelingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel12
  - number: '13'
    text: |-
      Iedere vreemdeling die als staatloze tot het Europese of Caribische deel van Nederland, dan wel Aruba, Curaçao
      of Sint Maarten is toegelaten, heeft binnen de grenzen bij deze wet bepaald, recht op een reisdocument voor
      vreemdelingen, geldig voor ten minste drie maanden en voor alle landen.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel13
  - number: '14'
    text: |-
      Aan andere in het Europese of Caribische deel van Nederland, dan wel Aruba, Curaçao of Sint Maarten toegelaten
      vreemdelingen dan bedoeld in de [artikelen 11][ref1], [12][ref2] en [13][ref3], die geen reisdocument van een
      ander land kunnen verkrijgen dan wel die kunnen aantonen dat van hen redelijkerwijs niet kan worden gevergd dat zij
      van een ander land een reisdocument aanvragen, kan binnen de grenzen bij deze wet bepaald, een reisdocument voor
      vreemdelingen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel13
