  - number: '4'
    text: Elk reisdocument blijft na uitreiking rijkseigendom. Onze Minister oefent het eigendomsrecht uit.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel4
  - number: 4a
    text: |-
      1 Er is een basisregister reisdocumenten. Onze Minister is verantwoordelijk voor de verwerking van gegevens in
      dit register.

      2 Het register heeft tot doel het voorkomen en bestrijden van fraude met en misbruik van reisdocumenten door het
      vastleggen van gegevens met betrekking tot de in het derde lid bedoelde documenten en de verstrekking van die
      gegevens aan daartoe ingevolge deze wet bevoegde autoriteiten en derden.

      3 In het register worden gegevens opgenomen met betrekking tot reisdocumenten, bedoeld in [artikel 2][ref1], die:

      zijn ontvreemd of anderszins als vermist zijn opgegeven;

      ingevolge [artikel 47, eerste lid, onder a, b, c, e, f of h][ref2], van rechtswege zijn vervallen.

      4 De in het register op te nemen gegevens, bedoeld in het derde lid, worden verstrekt door de autoriteiten, belast
      met de uitvoering van deze wet.

      5 In het register kunnen in verband met een reisdocument de volgende gegevens worden vermeld:

      a. de persoonsgegevens, bedoeld in [artikel 3, eerste, vierde en zesde lid][ref3];

      b. het administratienummer waarmee de houder van een reisdocument is vermeld in de basisregistratie personen in
      het Europese deel van Nederland of in de bevolkingsadministratie van een openbaar lichaam, Aruba, Curaçao of Sint
      Maarten;

      c. het soort reisdocument, het documentnummer en de andere documentgegevens, bedoeld in
      [artikel 3, vijfde lid][ref4];

      d. de reden van de opneming van gegevens met betrekking tot het reisdocument in het register, de datum waarop het
      reisdocument is ontvreemd, anderszins is vermist of van rechtswege is vervallen, de autoriteit die de gegevens
      heeft verstrekt en de datum waarop de gegevens zijn verstrekt;

      e. andere bij regeling van Onze Minister te bepalen administratieve gegevens die noodzakelijk zijn voor de
      gegevensverwerking in het register.

      6 De in het register opgenomen gegevens worden verstrekt aan instellingen en personen, belast met een
      publiekrechtelijke taak, voor zover de gegevens noodzakelijk zijn voor de vervulling van hun taak.

      7 Onze Minister kan andere instellingen en personen aanwijzen die een gerechtvaardigd belang hebben bij
      verstrekking van gegevens uit het register. De gegevensverstrekking beperkt zich in dat geval uitsluitend tot de
      mededeling of in het register gegevens zijn opgenomen met betrekking tot een reisdocument, waarvan de instelling of
      persoon het documentnummer heeft opgegeven.

      8 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de in het register op te nemen
      gegevens, de vastlegging van gegevens in het register, de verwijdering van gegevens uit het register en de
      verstrekking van gegevens.

      9 Onze Minister treft maatregelen met betrekking tot het beheer en de beveiliging van het register.


