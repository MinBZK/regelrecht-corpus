        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '28'
    text: |-
      1 De in [artikel 26][ref1] bedoelde autoriteit verschaft zich de nodige zekerheid over de identiteit en de
      nationaliteit van de aanvrager, en indien deze geen Nederlander is, tevens met betrekking tot diens verblijfstitel.

      2 De aanvrager kan worden verzocht in verband met het in het eerste lid bedoelde onderzoek de nodige bewijsstukken
      over te leggen.

      3 De aanvrager dient persoonlijk voor de bovenbedoelde autoriteit te verschijnen, tenzij zulks om zwaarwegende
      redenen niet van hem kan worden gevergd en de betreffende autoriteit van oordeel is dat op andere wijze voldoende
      zekerheid kan worden verkregen over de identiteit, de nationaliteit en de verblijfstitel van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel26
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '29'
    text: |-
      1 De aanvrager dient bij zijn aanvraag alle Nederlandse of buitenlandse reisdocumenten die op zijn naam zijn
      gesteld ter inzage over te leggen, ongeacht of hun geldigheidsduur is verstreken.

      2 De aanvrager die in een buitenlands reisdocument staat vermeld, doet hiervan bij zijn aanvraag mededeling.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel29
  - number: '30'
    text: |-
      1 De aanvrager die houder wenst te blijven van een geldig Nederlands reisdocument naast het aangevraagde
      reisdocument, kan daartoe een verzoek doen aan de autoriteit die bevoegd is de aanvraag in ontvangst te nemen.
      Deze autoriteit beslist op het verzoek volgens nader door Onze Minister in overeenstemming met Onze Minister van
      Buitenlandse Zaken te stellen regelen.

      2 Een verzoek als bedoeld in het eerste lid behoeft niet te worden gedaan, indien hetzij het aangevraagde
      document hetzij het geldig Nederlands document waarvan de aanvrager houder wenst te blijven, een Nederlandse
      identiteitskaart is.

      3 Een verzoek als bedoeld in het eerste lid kan niet worden gedaan, indien zowel het aangevraagde document als het
      geldig Nederlands document waarvan de aanvrager houder wenst te blijven, een Nederlandse identiteitskaart is.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel30
  - number: '31'
    text: |-
      1 De aanvrager wiens eerder uitgereikt reisdocument is vermist, legt bij het indienen van zijn aanvraag een
      schriftelijke verklaring af omtrent de vermissing.

      2 Indien de aanvraag in Nederland, Aruba, Curaçao of Sint Maarten wordt ingediend, legt de aanvrager tevens een
      gewaarmerkte kopie over van het proces-verbaal dat terzake van de vermissing op ambtseed is opgemaakt door een
      opsporingsambtenaar van de politie in Nederland, Aruba, Curaçao, onderscheidenlijk Sint Maarten.

      3 Onze Minister stelt nadere regels met betrekking tot de af te leggen verklaring omtrent de vermissing. Hij stelt
      deze regels in overeenstemming met Onze Minister van Buitenlandse Zaken, voor zover zij betrekking hebben op de
      verklaring omtrent de vermissing die bij een aanvraag in het buitenland moet worden afgelegd.

      4 De aanvrager wiens eerder uitgereikt reisdocument is ingenomen door een daartoe bevoegde autoriteit, legt bij het
      indienen van zijn aanvraag een door de desbetreffende autoriteit afgegeven schriftelijke verklaring over omtrent
      de inname.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel31
  - number: '32'
    text: |-
      1 De aanvrager dient alle Nederlandse reisdocumenten die op zijn naam zijn gesteld in te leveren, tenzij
      [artikel 30][ref1] of [31][ref2] van toepassing is.

      2 De inlevering als bedoeld in het eerste lid dient te geschieden bij de uitreiking.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel30
