  - number: '33'
    text: |-
      De rechten die verschuldigd zijn of worden geheven in verband met handelingen ten behoeve van de aanvraag van een
      reisdocument, worden bij de indiening van de aanvraag voldaan.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel33
  - number: '34'
    text: |-
      1 Bij een aanvraag door of ten behoeve van een minderjarige wordt een verklaring van toestemming overgelegd
      van iedere persoon die het gezag uitoefent. Indien de minderjarige onder voorlopige voogdij is geplaatst van
      een stichting als bedoeld in [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref1] in het Europese deel van
      Nederland onderscheidenlijk voorlopig is toevertrouwd aan een Voogdijraad in een openbaar lichaam, Aruba, Curaçao
      of Sint Maarten, wordt evenwel een verklaring van toestemming van de desbetreffende stichting dan wel van de
      desbetreffende Voogdijraad overgelegd.

      2 Indien bij gezamenlijke gezagsuitoefening een van de personen die het gezag uitoefenen, weigert een verklaring
      van toestemming als bedoeld in het eerste lid, af te geven, kan deze op verzoek van de andere persoon die het gezag
      uitoefent, worden vervangen door een verklaring van de bevoegde rechter, die alvorens te beslissen een vergelijk
      tussen de beide personen beproeft.

      3 Indien een persoon die het gezag uitoefent, de desbetreffende stichting of de desbetreffende Voogdijraad een
      verklaring van toestemming als bedoeld in het eerste lid weigert, kan deze op verzoek van de minderjarige van
      zestien jaren of ouder worden vervangen door een verklaring van de bevoegde rechter.

      4 Indien bij gezamenlijke gezagsuitoefening het als gevolg van oorlog, oproer, natuurrampen of daaraan verwante dan
      wel daarmee samenhangende omstandigheden feitelijk onmogelijk is een verklaring van toestemming als bedoeld in het
      eerste lid, te verkrijgen van de andere persoon die het gezag uitoefent, kan deze in afwijking van het eerste lid
      worden vervangen door een verklaring van de bevoegde rechter.

      5 De rechter geeft in de in het tweede, derde en vierde lid bedoelde gevallen een zodanige beslissing als hem in
      het belang van het kind wenselijk voorkomt. Daarbij kan als voorwaarde worden gesteld dat de geldigheidsduur of de
      territoriale geldigheid van het aangevraagde reisdocument wordt beperkt.

      6 Een verklaring van toestemming als bedoeld in het eerste lid, behoeft niet te worden overgelegd bij de aanvraag
      van een Nederlandse identiteitskaart door of ten behoeve van een minderjarige die de leeftijd van twaalf jaren
      heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: '35'
    text: |-
      Aan de minderjarige die in werkelijke militaire dienst is, wordt een reisdocument verstrekt indien en voor zolang
      de daartoe aangewezen militaire autoriteit verklaart, dat zulks in het belang van de dienst is. Dit reisdocument
      geldt uiterlijk tot het tijdstip waarop de dienst wordt verlaten.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel35
  - number: '36'
    text: |-
      1 Bij een aanvraag ten behoeve van een minderjarige die onder toezicht is gesteld en jonger is dan zestien jaar,
      kan, indien één of beide personen die het gezag over de minderjarige uitoefenen, weigeren een verklaring van
      toestemming als bedoeld in [artikel 34, eerste lid][ref1], af te geven, in plaats van die verklaring een verklaring
      van toestemming van de bevoegde rechter worden overgelegd.

      2 De rechter kan een verklaring van toestemming afgeven op verzoek van een stichting als bedoeld
      in [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref2], of een rechtspersoon als bedoeld in
      [artikel 254, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] in het Europese deel van Nederland of een
      gezinsvoogdij-instelling in een openbaar lichaam, Aruba, Curaçao of Sint Maarten. De rechter geeft een zodanige
      beslissing als hem in het belang van het kind wenselijk voorkomt. Daarbij kan als voorwaarde worden gesteld dat de
      geldigheidsduur of de territoriale geldigheid van het aangevraagde reisdocument wordt beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel36
