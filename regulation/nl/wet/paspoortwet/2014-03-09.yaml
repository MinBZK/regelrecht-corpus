  - number: '64'
    text: |-
      Bij landsverordening wordt geregeld de mogelijkheid voorziening te vragen tegen de op grond van deze wet genomen
      beschikkingen.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel64
  - number: '65'
    text: |-
      1 De in [artikel 3, achtste lid][ref1], bedoelde gegevens, worden, bij de inwerkingtreding van artikel I,
      onderdelen D en E, van het bij koninklijke boodschap van 21 januari 2008 ingediende voorstel van rijkswet
      tot wijziging van de Paspoortwet in verband met het herinrichten van de reisdocumentenadministratie
      (Kamerstukken II 2007/08, 31 324 (R1844), nr. 2), nadat dit voorstel tot wet is verheven, overgebracht naar de
      reisdocumentenadministratie, bedoeld in [artikel 4a][ref2], zoals dit luidt na inwerkingtreding van artikel I,
      onderdeel D, van genoemd voorstel van rijkswet. De eerste zin is niet van toepassing op vingerafdrukken als bedoeld
      in [artikel 3, negende lid][ref3].

      2 Tot het moment waarop artikel I, onderdeel B, onder 2, van het in het eerste lid genoemde voorstel van rijkswet,
      nadat dit tot wet is verheven, in werking treedt, kan Onze Minister een afwijkende geldigheidsduur vaststellen
      voor reisdocumenten, waarin als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken kunnen
      worden opgenomen.

      3 Tot het moment waarop artikel I, onderdelen D en E, van het in het eerste lid genoemde voorstel van rijkswet,
      nadat dit tot wet is verheven, in werking treedt, wordt in de in [artikel 3, derde lid][ref4], bedoelde bij
      algemene maatregel van rijksbestuur te stellen regels en in de in [artikel 59][ref5] bedoelde bij of krachtens
      algemene maatregel van rijksbestuur te stellen regels voorzien bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005212#Artikel59
