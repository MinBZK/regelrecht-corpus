  - number: '66'
    text: |-
      Op aanvragen ter verkrijging van een reisdocument die op het tijdstip van inwerkingtreding van de Rijkswet
      aanpassing rijkswetten aan de oprichting van de nieuwe landen reeds waren ingediend, zijn de bepalingen van deze
      wet van toepassing zoals die zijn komen te luiden na de inwerkingtreding van de genoemde rijkswet.
    url: https://wetten.overheid.nl/BWBR0005212/2014-03-09#Artikel66
  - number: 66a
    text: |-
      1 Nationale paspoorten en Nederlandse identiteitskaarten, verstrekt vóór de datum van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      _______________________________________________________________, behouden de geldigheid die daarin is vermeld.

      2 Op Nederlandse identiteitskaarten, verstrekt vóór de datum van inwerkingtreding van artikel I, onderdeel B,
      van de Wijziging van de Paspoortwet in verband met onder meer de status van de Nederlandse identiteitskaart, zijn
      [artikel 2, tweede lid][ref2], [artikel 3, tweede en vijfde lid][ref3] en [artikel 65][ref4] van toepassing zoals
      deze luidden voor die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0034694#ArtikelI
