  - number: '2.3'
    text: |-
      De mededeling van een besluit tot verlening van een omgevingsvergunning waarbij sprake is van een geval als
      bedoeld in [artikel 2.12. eerste lid, onder a, onder 3; van de Wet algemene bepalingen omgevingsrecht][ref1], wordt
      beschikbaar gesteld conform de vereisten zoals die zijn vastgelegd voor 'projectbesluiten' in IMRO2008 en STRI2008.
      De waarde van het attribuut 'naam' van de klasse Besluitgebied_X begint met: omgevingsvergunning.



         [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024656/2011-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
    machine_readable:
      execution:
        input:
          - name: besluit_naam
            type: string
            description: De naam van het besluit (attribuut 'naam' van Besluitgebied_X).
        output:
          - name: naam_begint_met_omgevingsvergunning
            type: boolean
            description: Of de naam begint met "omgevingsvergunning".
          - name: moet_voldoen_aan_IMRO_STRI
            type: boolean
            description: Of het besluit moet voldoen aan IMRO2008 en STRI2008.
        actions:
          - output: naam_begint_met_omgevingsvergunning
            value:
              operation: EQUALS
              subject:
                operation: LEFT
                source: $besluit_naam
                length: "19"
              value: "omgevingsvergunning"
          - output: moet_voldoen_aan_IMRO_STRI
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $naam_begint_met_omgevingsvergunning
                    value: "true"
                  then: "true"
              default: "false"
  - number: '3'
    text: |-
      Voor zover in de [bijlagen I][ref1], [II][ref2] en [III][ref3] bij deze regeling ten aanzien van producten
      technische voorschriften zijn gesteld als bedoeld in de richtlijn nr. 98/34/EG van het Europees Parlement en
      de Raad van de Europese Unie van 22 juni 1998 betreffende een informatieprocedure op het gebied van normen en
      technische voorschriften en regels betreffende diensten van de informatiemaatschappij (PbEG L 204), zoals gewijzigd
      bij richtlijn nr. 98/48/EG van 20 juli 1998 (PbEG L 217), worden met die producten gelijkgesteld producten die
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een staat niet zijnde een lidstaat van de Europese
      Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen
      aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met die technische
      voorschriften wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0024656
      [ref2]: https://wetten.overheid.nl/BWBR0024656
      [ref3]: https://wetten.overheid.nl/BWBR0024656
    url: https://wetten.overheid.nl/BWBR0024656/2011-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024656
      - id: ref2
        bwb_id: BWBR0024656
      - id: ref3
        bwb_id: BWBR0024656
  - number: '4.1'
    text: Deze regeling treedt in werking met ingang van 1 juli 2009.
    url: https://wetten.overheid.nl/BWBR0024656/2011-03-08#Artikel4
