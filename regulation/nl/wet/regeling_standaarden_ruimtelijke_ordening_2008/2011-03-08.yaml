preamble:
  text: |-
    Gelet op paragraaf 1.2 van het Besluit ruimtelijke ordening;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024656/2011-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *Wro:* [Wet ruimtelijke ordening][ref1];
        - *Bro:* [Besluit ruimtelijke ordening][ref2];
        - *IMRO2008:* Informatiemodel Ruimtelijke Ordening 2008;
        - *SVBP2008:* Standaard Vergelijkbare Bestemmingsplannen 2008;
        - *STRI2008:* Standaard Toegankelijkheid Ruimtelijke Instrumenten 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
      [ref2]: https://wetten.overheid.nl/BWBR0023798
    url: https://wetten.overheid.nl/BWBR0024656/2011-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020449
      - id: ref2
        bwb_id: BWBR0023798
  - number: '2.1'
    text: |-
      De in onderstaande tabel genoemde visies, plannen, besluiten, verordeningen of algemene maatregelen van bestuur
       worden vormgegeven, ingericht en beschikbaar gesteld overeenkomstig de in de tabel genoemde standaarden, die als
       bijlagen bij deze regeling behoren, indien dit in de desbetreffende kolom is aangegeven.
    url: https://wetten.overheid.nl/BWBR0024656/2011-03-08#Artikel2
    machine_readable:
      execution:
        input:
          - name: instrument_type
            type: string
            description: Het type instrument (bv. structuurvisie, bestemmingsplan).
        output:
          - name: toepasselijke_standaarden
            type: array
            description: Lijst van standaarden waar het instrument aan moet voldoen.
        actions:
          - output: toepasselijke_standaarden
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "structuurvisie"
                  then: "['IMRO2008', 'SVBP2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "voorbereidingsbesluit"
                  then: "['IMRO2008', 'SVBP2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "bestemmingsplan"
                  then: "['IMRO2008', 'SVBP2008', 'STRI2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "inpassingsplan"
                  then: "['IMRO2008', 'SVBP2008', 'STRI2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "rijksbestemmingsplan"
                  then: "['IMRO2008', 'SVBP2008', 'STRI2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "beheersverordening"
                  then: "['IMRO2008', 'SVBP2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "provinciale_verordening"
                  then: "['IMRO2008', 'SVBP2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "aanwijzing"
                  then: "['IMRO2008', 'SVBP2008']"
                - when:
                    operation: EQUALS
                    subject: $instrument_type
                    value: "algemene_maatregel_van_bestuur"
                  then: "['IMRO2008', 'SVBP2008']"
              default: "[]"
  - number: '2.2'
