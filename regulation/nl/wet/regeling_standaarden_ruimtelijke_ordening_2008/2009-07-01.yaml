  - number: '3'
    text: |-
      Voor zover in de [bijlagen I][ref1], [II][ref2] en [III][ref3] bij deze regeling ten aanzien van producten
      technische voorschriften zijn gesteld als bedoeld in de richtlijn nr. 98/34/EG van het Europees Parlement en
      de Raad van de Europese Unie van 22 juni 1998 betreffende een informatieprocedure op het gebied van normen en
      technische voorschriften en regels betreffende diensten van de informatiemaatschappij (PbEG L 204), zoals gewijzigd
      bij richtlijn nr. 98/48/EG van 20 juli 1998 (PbEG L 217), worden met die producten gelijkgesteld producten die
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een staat niet zijnde een lidstaat van de Europese
      Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen
      aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met die technische
      voorschriften wordt nagestreefd.


