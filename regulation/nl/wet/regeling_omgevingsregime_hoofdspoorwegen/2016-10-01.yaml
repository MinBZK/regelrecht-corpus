preamble:
  text: |-
    Gelet op artikel 19, vijfde lid, van de Spoorwegwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *beperkingengebied:* gebied binnen de begrenzing van de hoofdspoorweg,
      bedoeld in [artikel 21 van het Besluit spoorweginfrastructuur][ref1];
        - *beschermingszone:* deel van het beperkingengebied bij een hoofdspoorweg op maaiveldniveau, een hoofdspoorweg in
      een ingraving, hoofdspoorweg op een ophoging, hoofdspoorweg in een tunnel, of bij een hoofdspoorweg op een brug of
      viaduct dat onderscheidenlijk is bepaald en weergegeven in [bijlage 1][ref2], [bijlage 2][ref3], [bijlage 3][ref4],
      [bijlage 4][ref5] en [bijlage 5][ref6];
        - *kernzone:* deel van het beperkingengebied, niet zijnde de beschermingszone;
        - *maatwerkvoorschrift:* voorschrift inhoudende: a. een beschikking waarbij de minister op het bepaalde in deze
      regeling aanvullende eisen of verplichtingen stelt die naar het oordeel van de minister nodig zijn ter bescherming
      van de fysieke integriteit van de hoofdspoorwegen en het veilig en ongestoord gebruik daarvan, of b. een
      beschikking waarbij de minister de daarbij aangewezen bepalingen van deze regeling buiten toepassing verklaart al
      dan niet onder het stellen van beperkingen of voorwaarden, voor zover de fysieke integriteit van de hoofdspoorwegen
      en het veilig en ongestoord gebruik daarvan zich daar niet tegen verzet;
        - *perron:* onderdeel van een station dat als platform dient voor het betreden en verlaten van een spoorvoertuig;
        - *station:* gebouw of werk dat blijkens zijn constructie en inrichting geheel of gedeeltelijk is bestemd voor
      aankomst en vertrek van spoorvoertuigen met het oog op het in-, uit- of overstappen van reizigers, daaronder
      inbegrepen de passarelles;
        - *wet:* [Spoorwegwet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0017626#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0038197
      [ref3]: https://wetten.overheid.nl/BWBR0038197
      [ref4]: https://wetten.overheid.nl/BWBR0038197
      [ref5]: https://wetten.overheid.nl/BWBR0038197
      [ref6]: https://wetten.overheid.nl/BWBR0038197
      [ref7]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017626
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0038197
      - id: ref3
        bwb_id: BWBR0038197
      - id: ref4
