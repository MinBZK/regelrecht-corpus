        bwb_id: BWBR0015007
  - number: '2.1'
    text: |-
      Er geldt een vrijstelling van het verbod, bedoeld in [artikel 19, eerste lid, van de wet][ref1], voor de
      activiteiten en de daarmee samenhangende werkzaamheden, bedoeld in [artikel 3][ref2], indien en voor zolang
      de activiteiten en de werkzaamheden worden verricht in overeenstemming met het bepaalde in deze regeling en de
      krachtens deze regeling gestelde maatwerkvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: '2.2'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op activiteiten die worden verricht binnen het
      beperkingengebied van het hogesnelheidsnet of de Betuweroute, met uitzondering van de aan het hogesnelheidsnet of
      aan de Betuweroute gelegen stations en perrons.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel2
  - number: '2.3'
    text: |-
      In dit artikel wordt verstaan onder: - *Betuweroute:* de in het
      __REF000___________________________________________________________________________________________________________
      ___________, alsmede de in dat besluit als hoofdspoorwegen aangewezen spoorwegen en de berijdbare delen van de
      spoorwegen in [bijlage 2, onderdeel b, onderdelen 1 tot en met 6][ref2], en
        - *hogesnelheidsnet:* net van speciaal aangelegde hogesnelheidslijnen, die zijn uitgerust voor snelheden van
      gewoonlijk ten minste 250 kilometer per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0017794
      [ref2]: https://wetten.overheid.nl/BWBR0017794
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017794
      - id: ref2
        bwb_id: BWBR0017794
  - number: '2.4'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, geldt niet voor activiteiten en werkzaamheden die in samenhang
      worden verricht met activiteiten waarvoor een vergunning op grond van [artikel 19, eerst lid, van de wet][ref1]
      noodzakelijk is. In dat geval wordt voor het geheel van de activiteiten en werkzaamheden een vergunning
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel19
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '19'
  - number: '3'
    text: |-
      De vrijstelling, bedoeld in [artikel 2][ref1], eerste lid, geldt voor de volgende activiteiten en de daarmee
      samenhangende werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel2
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '2'
        paragraaf: '1'
  - number: 3.a
    text: het in de beschermingszone leggen, in stand houden, wijzigen of verwijderen van kabels of leidingen;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.b
    text: het vanuit de beschermingszone opvullen van een beschermbuis met schuimbeton;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.c
    text: |-
      het vanuit de beschermingszone leggen, in stand houden, wijzigen of verwijderen van kabels of leidingen in een
      reeds aanwezige beschermbuis;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.d
    text: het in de beschermingszone aanleggen, in stand houden, wijzigen of verwijderen van beplanting;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.e
    text: het in de beschermingszone uitvoeren van graaf- en hijswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.f
    text: |-
      het in de beschermingszone oprichten, plaatsen, in stand houden, wijzigen of verwijderen van bouwwerken, gebouwen
      of objecten;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.g
    text: het in de beschermingszone uitvoeren van metingen en inspecties;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.h
    text: het in de kernzone uitvoeren van metingen en inspecties boven een spoorweg in een tunnel of onder een viaduct;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.i
    text: het verrichten van onderhoud op perrons of stations;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.j
    text: het vervangen van bestaande objecten op perrons of stations door gelijksoortige objecten;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.k
    text: |-
      het plaatsen van objecten van ondergeschikte aard op perrons of stations waarbij de opzet niet wezenlijk verandert,
      en
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: 3.l
    text: |-
      het verrichten van werkzaamheden van ondergeschikte aard op perrons of stations waarbij de opzet niet wezenlijk
      verandert.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel3
  - number: '4.1'
    text: |-
      Een ieder die weet of redelijkerwijs kan vermoeden dat het verrichten van een activiteit als bedoeld in
      [artikel 3][ref1] nadelige gevolgen kan hebben voor de fysieke integriteit van de hoofdspoorwegen en het veilig en
      ongestoord gebruik daarvan is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: 4.1.a
    text: alle maatregelen te nemen die redelijkerwijs van hem kunnen worden gevraagd om die gevolgen te voorkomen;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.1.b
    text: |-
      voor zover die gevolgen niet kunnen worden voorkomen: die gevolgen zoveel mogelijk te beperken of ongedaan te
      maken, en
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.1.c
    text: |-
      als die gevolgen onvoldoende kunnen worden beperkt: die activiteit achterwege te laten voor zover dat
      redelijkerwijs van hem kan worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: '4.2'
    text: 'Deze verplichting houdt in ieder geval in dat binnen het beperkingengebied:'
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.a
    text: |-
      de beheerder en partijen die in opdracht van de beheerder handelen, niet worden belemmerd in de zorg
      voor de kwaliteit, betrouwbaarheid en beschikbaarheid van de hoofdspoorweginfrastructuur, bedoeld in
      [artikel 16 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel16
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '16'
  - number: 4.2.b
    text: de hoofdspoorweg bereikbaar is voor hulpdiensten;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.c
    text: vluchtroutes worden vrijgehouden;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.d
    text: |-
      objecten zodanig en op voldoende afstand worden geplaatst dat de objecten of onderdelen daarvan niet op de
      hoofdspoorweg terecht kunnen komen of daaraan schade kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.e
    text: |-
      activiteiten dusdanig en op voldoende afstand worden uitgeoefend dat elementen van de hoofdspoorweginfrastructuur
      zonder belemmering kunnen worden gebruikt en niet worden beschadigd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.f
    text: de bestuurder van een spoorvoertuig niet wordt gehinderd ten aanzien van het waarnemen van seinen;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.g
    text: alleen gebruik wordt gemaakt van verlichting bestaande uit wit licht;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.h
    text: |-
      de beheerder zo spoedig mogelijk in kennis wordt gesteld van door de activiteiten veroorzaakte beschadiging of
      zetting van de hoofdspoorweg;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.i
    text: |-
      er zo spoedig mogelijk melding wordt gedaan aan de beheerder van door de activiteit ontstane calamiteiten,
      dreigende calamiteiten, onvoorziene omstandigheden of gebreken die gevolgen kunnen hebben voor een veilig en
      ongestoord gebruik van de hoofdspoorweg;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: 4.2.j
    text: |-
      materieel dat wordt gebruikt bij het verrichten van de activiteit zo spoedig mogelijk na beëindiging van deze
      activiteit wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel4
  - number: '5.1'
    text: |-
      Degene die de activiteiten, bedoeld in [artikel 3][ref1], zal verrichten, meldt dit ten minste vier weken voor
      aanvang van de activiteit schriftelijk aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: '5.2'
    text: |-
      Meldingen worden, onder vermelding van de regio waarbinnen de werkzaamheden plaatsvinden, gedaan aan het adres van
      de beheerder, zijnde: Postbus 2038, 3500 GA, Utrecht.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: '5.3'
    text: 'Bij de melding worden de volgende gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.a
    text: |-
      naam, adres, telefoonnummer en e-mailadres van degene die voornemens is de activiteiten te verrichten en van degene
      die zorg draagt voor het beheer en onderhoud van de activiteit;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.b
    text: de dag waarop met de activiteit wordt begonnen en de duur ervan;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.c
    text: het adres of de locatie waar de werkzaamheden worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.d
    text: de aard en omvang van de activiteit;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.e
    text: |-
      een basisbeheerkaart, op een schaal van 1:1000 met spoorkilometrering, die bij de beheerder te verkrijgen is,
      waarop de activiteit wordt aangeduid;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.f
    text: een dwarsprofieltekening van de werken in combinatie met de spoorweg;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.g
    text: een werkplan, zo nodig door de minister te specificeren;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.h
    text: 'indien de activiteit het leggen, verleggen of aanpassen van kabels of leidingen betreft: een kabellegplan;'
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: 5.3.i
    text: |-
      indien de activiteit het verwijderen van kabels of leidingen betreft: een kabelverwijderingsplan met daarbij een
      verklaring van juiste afdichting.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: '5.4'
    text: Wijzigingen in het moment van aanvang en de duur van de activiteit worden zo spoedig mogelijk gemeld.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: '5.5'
    text: |-
      De minister kan degene die een melding doet bij beschikking verzoeken nadere informatie te verstrekken over de te
      verrichten activiteit alvorens de vrijstelling geldt.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: '5.6'
    text: |-
      Indien de gemelde startdatum van de activiteit wordt overschreden met meer dan vier weken, wordt de melding als
      niet gedaan beschouwd.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
  - number: '5.7'
    text: |-
      In afwijking van het eerste lid is voor de activiteiten, bedoeld in [artikel 3, onderdelen g en h][ref1], geen
      melding vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: '5.8'
    text: |-
      De basisbeheerkaart, dwarsprofieltekening en werkplan, bedoeld in onderscheidenlijk de onderdelen
      e, f en g van het derde lid, zijn niet vereist bij de melding van de activiteiten, bedoeld in
      [artikel 3, onderdelen i tot en met l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Maatwerkvoorschriften kunnen worden gesteld om de fysieke integriteit van de hoofdspoorwegen en het veilig en
      ongestoord gebruik daarvan te borgen.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: '6.2'
    text: |-
      Maatwerkvoorschriften kunnen op verzoek worden gesteld met het oog op de belangen van degene die de activiteit
      verricht, voor zover het belang, bedoeld in het eerste lid, zich daartegen niet verzet. Op dit verzoek
      wordt beslist binnen vier weken na ontvangst van het verzoek, dat als onderdeel van de melding, bedoeld in
      [artikel 5, eerste lid][ref1], of overeenkomstig de procedure van die melding wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel5
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '5'
        paragraaf: '1'
  - number: '6.3'
    text: De maatwerkvoorschriften kunnen afwijken van de artikelen in deze regeling.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: '6.4'
    text: 'De maatwerkvoorschriften kunnen in ieder geval gesteld worden ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: 6.4.a
    text: de locatie;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: 6.4.b
    text: de diepte van het werk;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: 6.4.c
    text: de hoogte van het werk;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: 6.4.d
    text: de opslag van bouwstoffen en materieel;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: 6.4.e
    text: de periode van uitvoering;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: 6.4.f
    text: de te nemen veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: 6.4.g
    text: het te gebruiken materieel.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: '6.5'
    text: |-
      Bij maatwerkvoorschrift kan de tijdsduur waarin na het doen van de melding, bedoeld in
      [artikel 5, eerste lid][ref1], geen aanvang mag worden gemaakt met de activiteit, worden ingekort of verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel5
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '5'
        paragraaf: '1'
  - number: '6.6'
    text: Bij maatwerkvoorschrift kan worden bepaald dat kabels en leidingen verlegd of verwijderd moeten worden.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel6
  - number: '7'
    text: |-
      Degene die een activiteit als bedoeld in [artikel 3, onderdelen a tot en met c][ref1], verricht, houdt zich daarbij
      aan de volgende regels:


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: 7.a
    text: kabels of leidingen worden in een sleuf of in een goot gelegd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.b
    text: kabels of leidingen worden op een diepte van ten minste 0,60 meter gelegd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.c
    text: kabels en leidingen worden zoveel mogelijk geconcentreerd en gebundeld gelegd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.d
    text: de uitkomende grond wordt in de oorspronkelijke volgorde weer in de sleuf gelegd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.e
    text: graszoden worden boven de te graven sleuf gestoken en opzij gezet;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.f
    text: de sleuf wordt onmiddellijk na de werkzaamheden op deugdelijke wijze verdicht;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.g
    text: |-
      de aangevulde sleuven worden over de volle lengte en over de volle breedte, gedurende een jaar na het gereedkomen
      van de werkzaamheden op kosten van degene die de werkzaamheden uitvoert of laat uitvoeren, onderhouden;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.h
    text: |-
      de diepte van de kruising met het spoor en de ligging ten opzichte van het spoor van de kabels worden ingemeten en
      weergegeven op een revisietekening die binnen vier weken na afronding van de activiteit, of wanneer deze activiteit
      onderdeel is van meerdere activiteiten, na afronding van de laatste activiteit, wordt ingediend bij de beheerder;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.i
    text: |-
      kabels en leidingen worden ten opzichte van reeds aanwezige, parallel aan het spoor liggende kabels, leidingen
      of beschermbuizen op een afstand van ten minste 0,20 meter gelegd, gemeten vanaf de buitenzijde van de kabels,
      leidingen of beschermbuizen;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.j
    text: 'in het geval kabels en leidingen worden gekruist:'
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.j.1
    text: worden de nieuwe kabels en leidingen onder de bestaande kabels en leidingen aangelegd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.j.2
    text: |-
      worden de nieuwe kabels en leidingen op een afstand van ten minste 0,20 meter ten opzichte van bestaande kabels en
      leidingen gelegd, gemeten vanaf de buitenzijde van de kabel, leiding of beschermbuis;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: 7.j.3
    text: |-
      worden de nieuwe kabels en leidingen voorzien van een beschermbuis indien de afstand tot de bestaande kabels,
      leidingen of beschermbuizen minder dan 0,80 meter bedraagt, waarbij de buitenzijde van de aan te leggen
      beschermbuis reikt tot ten minste 0,80 meter voorbij de buitenzijde van de te kruisen kabels, leidingen of
      beschermbuizen.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel7
  - number: '8.1'
    text: |-
      Degene die een activiteit als bedoeld in [artikel 3, onderdelen a tot en met c][ref1], verricht, maakt gebruik van
      materieel dat voldoet aan de volgende regels:


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: 8.1.a
    text: de kabels zijn bestemd voor het laagspanningsnet, van de elektriciteitsvoorziening;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: 8.1.b
    text: |-
      de leidingen zijn niet bestemd voor gevaarlijke stoffen als bedoeld in
      [artikel 1, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel1
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '1'
  - number: 8.1.c
    text: de gasleidingen hebben een diameter van maximaal 15 millimeter;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: 8.1.d
    text: de waterleidingen hebben een diameter van maximaal 22 millimeter;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: 8.1.e
    text: de hemelwaterafvoeren en drukloze rioleringsbuizen hebben een diameter van maximaal 160 millimeter;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: 8.1.f
    text: de overige kabels en leidingen hebben een diameter van maximaal 110 millimeter;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: 8.1.g
    text: de leidingen hebben een druk van maximaal 10 bar;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: 8.1.h
    text: de leidingen zijn gemaakt van PE 100 SDR11;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: 8.1.i
    text: de kabels en leidingen voldoen aan de vigerende NEN-normen of gelijkwaardige alternatieven.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd het eerste lid wordt bij het vanuit de beschermingszone leggen, verleggen, aanpassen of verwijderen
      van kabels gebruik gemaakt van kabels tot 3 kiloVolt.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel8
  - number: '9.1'
    text: |-
      Degene die hijswerkzaamheden als bedoeld in [artikel 3, onderdeel e][ref1], in de beschermingszone van een spoorweg
      in een tunnel verricht, voert deze werkzaamheden ten hoogste uit tot een hoogte die gelijk is aan de kortste
      afstand tot de buitenwand van die tunnel.


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Degene die graafwerkzaamheden als bedoeld in [artikel 3, onderdeel e][ref1], in de beschermingszone van een
      spoorweg in een tunnel verricht, voert deze werkzaamheden ten hoogste uit tot een diepte die gelijk is aan de helft
      van de kortste afstand tot de buitenwand van die tunnel.


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: '10'
    text: |-
      De vrijstelling, bedoeld in [artikel 2, eerste lid][ref1], is niet van toepassing op het binnen de
      beschermingszone oprichten, plaatsen, in stand houden, wijzigen of verwijderen van bouwwerken en gebouwen,
      indien dat bij besluit van de minister is bepaald op een deel van de bij dat besluit aan te wijzen deel van de
      hoofdspoorweginfrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel2
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '2'
        paragraaf: '1'
  - number: '11'
    text: |-
      Degene die een activiteit verricht als bedoeld in [artikel 3, onderdeel f][ref1], houdt zich daarbij aan de
      volgende regels:


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: 11.a
    text: er worden geen graaf- of heiwerkzaamheden dieper dan 0,60 meter verricht;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel11
  - number: 11.b
    text: er worden geen grondwateronttrekkingen uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel11
  - number: 11.c
    text: de maaiveldbelasting is ten hoogste 500 kilogram per vierkante meter.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel11
  - number: '12'
    text: |-
      Degene die een activiteit als bedoeld in [artikel 3, onderdelen i tot en met l][ref1], verricht, houdt zich daarbij
      aan de volgende regels:


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel3
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '3'
        paragraaf: '1'
  - number: 12.a
    text: |-
      er worden geen heiwerkzaamheden, bronbemalingen of graafwerkzaamheden dieper dan 0,60 meter verricht, gemeten vanaf
      het oppervlak;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel12
  - number: 12.b
    text: |-
      er wordt ten minste een afstand van 5 meter gehouden vanaf de spanningvoerende delen en in het bijzonder van de
      bovenleiding, gemeten vanaf de buitenkant van het spanningvoerende deel;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel12
  - number: 12.c
    text: er wordt voldoende afstand gehouden van de perronrand;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel12
  - number: 12.d
    text: gebruik van kabelgoten of van de elektrische voeding van de beheerder wordt vooraf overeengekomen met de beheerder.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel12
  - number: '13.1'
    text: |-
      Het is verboden bij een actief beveiligde overweg objecten hoger dan één meter te plaatsen of in stand te houden in
      het in [bijlage 6][ref1] weergegeven gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0038197
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038197
  - number: '13.2'
    text: |-
      Het is verboden bij een niet actief beveiligde overweg objecten hoger dan één meter te plaatsen of in stand te
      houden in het in [bijlage 7][ref1] weergegeven gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0038197
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038197
  - number: '13.3'
    text: De minister kan ontheffing verlenen van het in het eerste of tweede lid vervatte verbod.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel13
  - number: '13.4'
    text: Overtreding van dit artikel is een beboetbaar feit.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel13
  - number: '13.5'
    text: Dit artikel is niet van toepassing op het uitvoeren van het beheer van de hoofdspoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel13
  - number: '14'
    text: |-
      De vrijstelling, bedoeld in [artikel 2, eerste lid][ref1], geldt niet voor activiteiten waarvoor op grond van
      [artikel 19 van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0038197#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel19
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0038197
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '19'
  - number: 14.a
    text: voorafgaand aan inwerkingtreding van deze regeling een vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel14
  - number: 14.b
    text: |-
      voorafgaand aan inwerkingtreding van deze regeling een vergunning is aangevraagd en na inwerkingtreding van deze
      regeling een vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0038197/2016-10-01#Artikel14
  - number: '15'
    text: |-
      Deze regeling treedt op hetzelfde tijdstip in werking als waarop
