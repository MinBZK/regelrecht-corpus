  - number: XIV
    text: |-
      1 Vanaf 1 januari na de datum van inwerkingtreding van [artikel 118 van de Wet op het primair onderwijs][ref1]
      wordt gedurende vijf jaren voor alle samenwerkingsverbanden, bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref2] de bekostiging, bedoeld in artikel 118, achtste lid, van
      de Wet op het primair onderwijs gecorrigeerd door het bedrag, berekend volgens het tweede lid, erbij op te tellen
      indien het een positief bedrag is dan wel af te trekken indien het een negatief bedrag is.

      2 De correctie, bedoeld in het eerste lid, wordt berekend als volgt: het bedrag, bedoeld in
      [artikel 118, tiende lid, eerste volzin, van de Wet op het primair onderwijs][ref3] op basis van de telgegevens
      van 1 oktober 2011 wordt verminderd met het bedrag dat gemoeid is met de leerlingen die op 31 juli 2011 14 jaar of
      ouder waren. Het resterende bedrag wordt vermeerderd met de som van de materiële bedragen van het leerlinggebonden
      budget, bedoeld in [artikel 70a van de Wet op het primair onderwijs][ref4], zoals die bepaling luidde op de dag
      direct voorafgaand aan het tijdstip waarop genoemd artikel is vervallen, voor de vestigingen van de scholen,
      behorend tot het samenwerkingsverband op basis van de telgegevens van 1 oktober 2011. De som van de in de eerste
      volzin bedoelde bedragen wordt verminderd met het bedrag, bedoeld in artikel 118, negende lid, van de Wet op het
      primair onderwijs, op basis van het aantal leerlingen op 1 oktober 2011. De uitkomst van deze berekening wordt
      in het tweede jaar vanaf de datum van inwerkingtreding bedoeld in het eerste lid, vermenigvuldigd met 100% en
      vervolgens in het derde, vierde, vijfde en zesde jaar vermenigvuldigd met een voor dat jaar bij algemene maatregel
      van bestuur vast te stellen percentage, dat verschillend kan worden vastgesteld voor correcties waarbij een bedrag
      wordt opgeteld en correcties waarbij een bedrag wordt afgetrokken.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


