  - number: XXIV
    text: |-
      1 Bij algemene maatregel van bestuur wordt bepaald welke scholen voor speciaal onderwijs, voortgezet
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 2, bedoeld in de
      [Wet op de expertisecentra][ref1], met ingang van 1 augustus 2015 in aanmerking kunnen worden gebracht voor
      bekostiging als instelling voor speciaal en voortgezet speciaal onderwijs aan auditief of communicatief
      gehandicapte kinderen of nevenvestiging daarvan, als bedoeld in de Wet op de expertisecentra, en onder welke
      voorwaarden dit geschiedt.

      2 [Titel III, Afdeling 1, van de Wet op de expertisecentra][ref2] is niet van toepassing op een bestuursoverdracht
      of samenvoeging die samenhangt met de omzetting, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Afdeling1
