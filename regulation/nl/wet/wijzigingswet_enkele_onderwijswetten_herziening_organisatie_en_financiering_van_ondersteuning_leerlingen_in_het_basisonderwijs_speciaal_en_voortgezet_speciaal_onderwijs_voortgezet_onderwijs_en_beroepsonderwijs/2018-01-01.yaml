preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de toegang tot scholen te verbeteren voor leerlingen
    die extra ondersteuning behoeven;

    dat het wenselijk is de samenwerking tussen scholen bij de onderwijskundige opvang van leerlingen die extra
    ondersteuning behoeven te versterken;

    dat het wenselijk is een andere wijze van financiering van de ondersteuning van leerlingen in te voeren;

    dat daartoe onder meer de Wet op het primair onderwijs, de Wet op de expertisecentra, de Wet op het
    voortgezet onderwijs, de Wet educatie en beroepsonderwijs, de Wet medezeggenschap op scholen en de Wet op het
    onderwijstoezicht dienen te worden gewijzigd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelAanhef
articles:
  - number: IX.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 18a, vierde lid, van de Wet op het primair onderwijs][ref1], wordt uiterlijk
      op 1 november volgend op de datum van inwerkingtreding van dat artikel opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
  - number: IX.2
    text: |-
      De rechtspersoon, bedoeld in [artikel in 17a, vierde lid, van de Wet op het voortgezet onderwijs][ref1], wordt
      uiterlijk op 1 november volgend op de datum van inwerkingtreding van dat artikel opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelIX
    references:
