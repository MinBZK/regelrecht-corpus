  - number: XXIVa
    text: |-
      Onze minister verstrekt aan het bevoegd gezag van de school voor speciaal en voortgezet speciaal onderwijs
      «De Waterlelie» te Cruquius en het bevoegd gezag van de school voor speciaal en voortgezet speciaal onderwijs
      «De Berkenschutse» te Heeze bekostiging ten behoeve van ambulante begeleiding aan leerlingen met epilepsie. De
      bekostiging wordt jaarlijks vastgesteld bij beschikking van Onze minister.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXXIVa
  - number: XXV
    text: |-
      Voor de datum van inwerkingtreding van [artikel XXIV][ref1] ingediende verzoeken om een voorziening als bedoeld
      in [Titel IV, afdeling 3, van de Wet op de expertisecentra][ref2] van een bevoegd gezag van een school waaruit
      een instelling als bedoeld in artikel XXIV is ontstaan, worden, indien daarop na de datum van inwerkingtreding
      van artikel XXIV van deze wet wordt beslist, geacht te zijn gedaan door het bevoegd gezag van de instelling en ten
      behoeve van de instelling.


