        artikel: 17a
  - number: IX.3
    text: |-
      Het eerste ondersteuningsplan van het samenwerkingsverband wordt voor 1 mei volgend op de datum van
      inwerkingtreding van de artikelen, bedoeld in het eerste en tweede lid, toegezonden aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelIX
  - number: IXa.1
    text: |-
      Het samenwerkingsverband legt een voorstel voor het eerste ondersteuningsplan uiterlijk op 1 februari
      volgend op de datum van inwerkingtreding van [artikel 18a van de Wet op het primair onderwijs][ref1]
      en [artikel 17a van de Wet op het voortgezet onderwijs][ref2] voor aan de ondersteuningsplanraad. De
      ondersteuningsplanraad spreekt zich binnen vier weken uit over dit voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelIXa
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: IXa.2
    text: |-
      Indien aan het te nemen besluit van het samenwerkingsverband over het eerste ondersteuningsplan de instemming is
      onthouden, wordt het voorstel door het samenwerkingsverband binnen twee weken voorgelegd aan de commissie voor
      geschillen, bedoeld in de [Wet medezeggenschap op scholen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelIXa
    references:
      - id: ref1
        bwb_id: BWBR0020685
  - number: IXa.3
    text: |-
      De commissie voor geschillen doet in geschillen over het eerste ondersteuningsplan uiterlijk op 15 april volgend op
      de datum van inwerkingtreding, bedoeld in het eerste lid, uitspraak.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelIXa
  - number: IXa.4
    text: |-
      Van een uitspraak van de commissie voor geschillen als bedoeld in het derde lid staat, in afwijking van
      [artikel 36 van de Wet medezeggenschap op scholen][ref1], geen beroep open bij de ondernemingskamer van het
      gerechtshof te Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelIXa
    references:
