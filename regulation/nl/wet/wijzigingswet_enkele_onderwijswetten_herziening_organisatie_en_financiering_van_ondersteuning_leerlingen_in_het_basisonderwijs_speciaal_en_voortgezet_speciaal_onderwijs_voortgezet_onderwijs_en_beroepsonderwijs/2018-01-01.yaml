      Een verzoek van het bevoegd gezag om goedkeuring door Onze Minister van de inrichting van een nevenvestiging die is
      opgenomen in een plan als bedoeld in [artikel 76a, derde lid, van de Wet op de expertisecentra][ref1] zoals luidend
      voor de inwerkingtreding van [artikel II, onderdeel CC][ref2], wordt aangemerkt als een verzoek van het bevoegd
      gezag als bedoeld in artikel 76a, eerste lid, van de Wet op de expertisecentra zoals luidend na de inwerkingtreding
      van artikel II, onderdeel CC, indien het plan tezamen met de gegevens waaruit de in artikel 76a, vierde lid,
      van de Wet op de expertisecentra zoals luidend voor de inwerkingtreding van artikel II, onderdeel CC, bedoelde
      overeenstemming blijkt door het regionaal expertisecentrum voor de inwerkingtreding van artikel II, onderdeel CC,
      ter goedkeuring aan Onze Minister is gezonden.


