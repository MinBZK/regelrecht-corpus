  - number: XXIII
    text: |-
      1 In afwijking van [artikel 8, eerste lid, derde volzin, van de Wet op de expertisecentra][ref1] wordt het
      onderwijs, bedoeld in die volzin, tot 1 augustus 2015 gegeven in scholen voor speciaal onderwijs, scholen voor
      voortgezet speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs, verdeeld als aangegeven in
      de in die volzin genoemde onderwijssoorten.

      2 Het bevoegd gezag van een instelling in oprichting meldt Onze Minister welke scholen als bedoeld in het eerste
      lid in dat schooljaar samenwerken in de instelling in oprichting.

      3 Voor de bekostiging van personeel wordt aan de scholen, bedoeld in het eerste lid, een bedrag per school en
      een bedrag per leerling toegekend, welke bedragen worden verhoogd met een bedrag dat wordt vermenigvuldigd met de
      gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar. De bedragen,
      bedoeld in de eerste volzin, worden bij ministeriële regeling vastgesteld. In aanvulling op de bekostiging, bedoeld
      in de eerste volzin, ontvangt de school van de instelling in oprichting waarmee wordt samengewerkt, een bedrag in
      verband met de auditieve en communicatieve handicap van de leerlingen.

      4 De instelling in oprichting ontvangt jaarlijks een bij ministeriële regeling vast te stellen bekostiging in
      verband met de auditieve en communicatieve handicap van de leerlingen van de scholen, bedoeld in het eerste lid,
      die is gebaseerd op het aantal leerlingen van de scholen waarmee de instelling in oprichting samenwerkt.

      5 Op de instellingen in oprichting zijn de artikelen in de [Wet op de expertisecentra][ref2] die betrekking
      hebben op instellingen van overeenkomstige toepassing, met uitzondering van [artikel 114][ref3] en
      [artikel 117, eerste en vijfde lid, van genoemde wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel117
