      De som van de in de eerste volzin bedoelde bedragen wordt verminderd met het bedrag, bedoeld in artikel 85b, tweede
      lid, van de Wet op het voortgezet onderwijs, op basis van het aantal leerlingen op 1 oktober 2011. De uitkomst
      van deze berekening wordt in het tweede schooljaar vanaf de datum van inwerkingtreding bedoeld in het eerste lid,
      vermenigvuldigd met 100% en vervolgens in het derde, vierde, vijfde en zesde schooljaar vermenigvuldigd met een
      voor dat schooljaar bij algemene maatregel van bestuur vast te stellen percentage, dat verschillend kan worden
      vastgesteld voor correcties waarbij een bedrag wordt opgeteld en correcties waarbij een bedrag wordt afgetrokken.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


