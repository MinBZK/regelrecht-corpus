      1 Het bevoegd gezag van de school die op grond van
      [artikel 7, eerste lid, van het Besluit RVC's en regionaal zorgbudget][ref1] is aangewezen
      door de bevoegde gezagsorganen van de scholen binnen een samenwerkingsverband als bedoeld in
      [artikel 10h van de Wet op het voortgezet onderwijs][ref2] zoals dat artikel luidde op de dag direct voorafgaand
      aan het tijdstip waarop dat artikel door deze wet is vervallen, draagt zorg voor de verdeling en de overdracht van
      de nog niet bestede bekostiging van dat samenwerkingsverband aan de bevoegde gezagsorganen van de scholen die op
      die dag deelnamen aan dat samenwerkingsverband.

      2 De overdracht dient uiterlijk één jaar na inwerkingtreding van [artikel III, onderdeel C][ref3], te zijn
      gerealiseerd.


