  - number: XVII
    text: |-
      1 Het eerste ondersteuningsplan dat wordt vastgesteld door een samenwerkingsverband als bedoeld
      in [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref1] omvat de procedure en het
      beleid met betrekking tot de terugplaatsing of overplaatsing naar het basisonderwijs, bedoeld in de
      [Wet op het primair onderwijs][ref2], dan wel voortgezet verblijf op de school voor speciaal onderwijs of speciaal
      en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref3],
      van leerlingen

      a. die op de datum van inwerkingtreding van [artikel II, onderdeel K][ref4], waren ingeschreven op een school voor
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde speciaal
      onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref5],

      b. die tot dat onderwijs toelaatbaar zijn verklaard door een commissie voor de indicatiestelling als
      bedoeld in [artikel 28c van de Wet op de expertisecentra][ref6] zoals luidend voor inwerkingtreding van
      [artikel II, onderdeel K][ref7],

      c. van wie de geldigheidsduur van de indicatie eindigt op een datum die is gelegen na de inwerkingtreding van
      laatstgenoemd artikelonderdeel en

      d. die in het gebied van het samenwerkingsverband woonachtig zijn,

      met dien verstande dat de beoordeling van deze leerlingen met het oog op terugplaatsing of overplaatsing naar het
      basisonderwijs of voortgezet verblijf in het speciaal onderwijs plaatsvindt binnen twee jaar na inwerkingtreding
      van [artikel II, onderdeel K][ref8]. De vorige volzin is van overeenkomstige toepassing op een landelijk
      samenwerkingsverband als bedoeld in [artikel 18a, vijftiende lid, van de Wet op het primair onderwijs][ref9], met
      dien verstande dat de herindicatie betrekking heeft op de leerlingen van de scholen voor speciaal onderwijs of
      speciaal en voortgezet speciaal onderwijs die zijn aangesloten bij het landelijk samenwerkingsverband.

      2 Het eerste ondersteuningsplan dat wordt vastgesteld door een samenwerkingsverband als bedoeld in
      [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref10] omvat de procedure en het
      beleid met betrekking tot de terugplaatsing of overplaatsing naar het voortgezet onderwijs, bedoeld in
      de [Wet op het voortgezet onderwijs][ref11], dan wel voortgezet verblijf op de school voor voortgezet
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref12] van leerlingen

      a. die op de datum van inwerkingtreding van [artikel II, onderdeel K][ref13] waren ingeschreven op een school voor
      voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde
      voortgezet speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref14],

      b. die tot dat onderwijs toelaatbaar zijn verklaard door een commissie voor de indicatiestelling als
      bedoeld in [artikel 28c van de Wet op de expertisecentra][ref15] zoals luidend voor inwerkingtreding van
      [artikel II, onderdeel K][ref16],

      c. van wie de geldigheidsduur van de indicatie eindigt op een datum die is gelegen na de inwerkingtreding van
      laatstgenoemd artikelonderdeel en

      d. die in het gebied van het samenwerkingsverband woonachtig zijn,

      met dien verstande dat de beoordeling van deze leerlingen met het oog op terugplaatsing of
      overplaatsing naar het voortgezet onderwijs of voortgezet verblijf in het voortgezet speciaal
      onderwijs plaatsvindt binnen twee jaar na inwerkingtreding van [artikel II, onderdeel K][ref17]. De
      vorige volzin is van overeenkomstige toepassing op een landelijk samenwerkingsverband als bedoeld in
      [artikel 17a, zestiende lid, van de Wet op het voortgezet onderwijs][ref18], met dien verstande dat de herindicatie
      betrekking heeft op de leerlingen van de scholen voor voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs die zijn aangesloten bij het landelijk samenwerkingsverband.


