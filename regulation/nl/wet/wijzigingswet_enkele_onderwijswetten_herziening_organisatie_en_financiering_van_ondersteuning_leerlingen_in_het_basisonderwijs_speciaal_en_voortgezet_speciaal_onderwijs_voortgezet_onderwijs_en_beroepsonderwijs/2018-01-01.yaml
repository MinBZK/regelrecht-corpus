  - number: XV.1
    text: |-
      Vanaf het tweede schooljaar vanaf de datum van inwerkingtreding van
      [artikel 85b van de Wet op het voortgezet onderwijs][ref1] wordt gedurende vijf schooljaren voor alle
      samenwerkingsverbanden, bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref2] de bekostiging, bedoeld
