  - number: XII
    text: |-
      1 De [artikelen 118, tiende lid][ref1], en [132, vierde lid, van de Wet op het primair onderwijs][ref2]
      en de [artikelen 85b, derde lid][ref3], en [89a, derde lid, van de Wet op het voortgezet onderwijs][ref4]
      zijn van overeenkomstige toepassing ten aanzien van de bekostiging van het samenwerkingsverband,
      bedoeld in [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref5] en
      [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref6] voor zover het leerlingen betreft die
      woonachtig zijn in het gebied van het samenwerkingsverband en die op 1 oktober van het jaar voorafgaand aan het
      jaar waarover de bekostiging plaatsvindt, waren ingeschreven op een school voor speciaal onderwijs respectievelijk
      voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in
      de [Wet op de expertisecentra][ref7], en die tot dat onderwijs toelaatbaar zijn verklaard door een commissie voor
      de indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref8] zoals dat artikel luidde
      voor de datum van inwerkingtreding van [artikel II, onderdeel K][ref9], van deze wet, van wie de geldigheidsduur
      van de indicatie eindigt op een datum die is gelegen na de inwerkingtreding van laatstgenoemd artikelonderdeel.

      2 De [artikelen 118, tiende lid][ref10], en [132, vierde lid, van de Wet op het primair onderwijs][ref11]
      en de [artikelen 85b, derde lid][ref12], en [89a, derde lid, van de Wet op het voortgezet onderwijs][ref13]
      zijn van overeenkomstige toepassing ten aanzien van de bekostiging van een landelijk samenwerkingsverband
      als bedoeld in [artikel 18a, vijftiende lid, van de Wet op het primair onderwijs][ref14] of
      [artikel 17a, zestiende lid, van de Wet op het voortgezet onderwijs][ref15], voor zover het leerlingen betreft die
      op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt, waren ingeschreven op een
      school voor speciaal onderwijs respectievelijk voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref16], die is aangesloten bij
      een landelijk samenwerkingsverband, en die tot dat onderwijs toelaatbaar zijn verklaard door een commissie voor
      de indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref17] zoals dat artikel luidde
      voor de datum van inwerkingtreding van [artikel II, onderdeel K][ref18], van deze wet, van wie de geldigheidsduur
      van de indicatie eindigt op een datum die is gelegen na de inwerkingtreding van laatstgenoemd artikelonderdeel.

      3 Voor de toepassing van het eerste en tweede lid wordt bij ministeriële regeling de indicatie van de leerling
      voor een bepaalde onderwijssoort omgezet naar één van de normbedragen die bij ministeriële regeling worden
      vastgesteld. Dit normbedrag blijft van toepassing totdat het samenwerkingsverband het normbedrag heeft bepaald
      dan wel de leerling niet langer is ingeschreven op een school voor speciaal onderwijs respectievelijk voortgezet
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref19].


