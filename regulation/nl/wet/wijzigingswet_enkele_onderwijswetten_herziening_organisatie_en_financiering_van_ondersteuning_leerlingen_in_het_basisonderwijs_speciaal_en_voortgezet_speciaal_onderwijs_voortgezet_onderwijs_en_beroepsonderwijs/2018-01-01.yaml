  - number: IXa
    text: |-
      1 Het samenwerkingsverband legt een voorstel voor het eerste ondersteuningsplan uiterlijk op 1 februari
      volgend op de datum van inwerkingtreding van [artikel 18a van de Wet op het primair onderwijs][ref1]
      en [artikel 17a van de Wet op het voortgezet onderwijs][ref2] voor aan de ondersteuningsplanraad. De
      ondersteuningsplanraad spreekt zich binnen vier weken uit over dit voorstel.

      2 Indien aan het te nemen besluit van het samenwerkingsverband over het eerste ondersteuningsplan de instemming
      is onthouden, wordt het voorstel door het samenwerkingsverband binnen twee weken voorgelegd aan de commissie voor
      geschillen, bedoeld in de [Wet medezeggenschap op scholen][ref3].

      3 De commissie voor geschillen doet in geschillen over het eerste ondersteuningsplan uiterlijk op 15 april volgend
      op de datum van inwerkingtreding, bedoeld in het eerste lid, uitspraak.

      4 Van een uitspraak van de commissie voor geschillen als bedoeld in het derde lid staat, in afwijking van
      [artikel 36 van de Wet medezeggenschap op scholen][ref4], geen beroep open bij de ondernemingskamer van het
      gerechtshof te Amsterdam.


