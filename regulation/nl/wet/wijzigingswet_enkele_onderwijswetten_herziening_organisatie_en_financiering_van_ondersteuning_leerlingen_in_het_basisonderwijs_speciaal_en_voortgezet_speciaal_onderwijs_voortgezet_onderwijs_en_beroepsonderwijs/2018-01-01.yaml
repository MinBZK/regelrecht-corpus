  - number: XIa
    text: |-
      1 Het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1], besteedt in het
      tweede schooljaar waarin [artikel 70a van de Wet op het primair onderwijs][ref2] door deze wet is vervallen, de
      personele bekostiging, bedoeld in het tweede lid, bij de scholen voor speciaal onderwijs of scholen voor speciaal
      en voortgezet speciaal onderwijs, voor zover daaraan speciaal onderwijs wordt verzorgd behorend tot cluster 3 en 4,
      bedoeld in de [Wet op de expertisecentra][ref3], die in het laatste schooljaar waarin artikel 70a van de Wet op het
      primair onderwijs van toepassing was, de ambulante begeleiding verzorgden ten behoeve van leerlingen op scholen in
      het samenwerkingsverband.

      2 De omvang van de personele bekostiging, bedoeld in het eerste lid, wordt berekend
      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 70a, tweede en vierde lid, van de Wet op het primair onderwijs][ref4], zoals die bepalingen luidden op de
      dag direct voorafgaand aan het tijdstip waarop artikel 70a van de Wet op het primair onderwijs is vervallen.

      3 De verplichting, bedoeld in het eerste lid, wordt verminderd of komt te vervallen, indien en naar mate de
      bevoegde gezagsorganen van de scholen die zijn aangesloten bij het samenwerkingsverband, bedoeld in het eerste
      lid, personeel dat in dienst was bij het bevoegd gezag van een school voor speciaal onderwijs of een school
      voor speciaal en voortgezet speciaal onderwijs en op die school was belast met ambulante begeleiding, hebben
      overgenomen. Bij ministeriële regeling worden regels gegeven met betrekking tot de berekening van de in de eerste
      volzin bedoelde vermindering.

      4 Het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref5], besteedt in het
      tweede schooljaar waarin [artikel 77a van de Wet op het voortgezet onderwijs][ref6] door deze wet is vervallen
      de personele bekostiging, bedoeld in het vijfde lid, bij de scholen voor voortgezet speciaal onderwijs of scholen
      voor speciaal en voortgezet speciaal onderwijs, voor zover daaraan voortgezet speciaal onderwijs wordt verzorgd,
      behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref7], die in het laatste schooljaar waarin
      artikel 77a van de Wet op het voortgezet onderwijs van toepassing was, de ambulante begeleiding verzorgden ten
      behoeve van leerlingen op scholen in het samenwerkingsverband.

      5 De omvang van de personele bekostiging, bedoeld in het vierde lid, wordt berekend
      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 77a, tweede en vierde lid, van de Wet op het voortgezet onderwijs][ref8], zoals die bepalingen luidden op
      de dag direct voorafgaand aan het tijdstip waarop artikel 77a van de Wet op het voortgezet onderwijs is vervallen.

      6 De verplichting, bedoeld in het vierde lid, wordt verminderd of komt te vervallen indien en naar mate de
      bevoegde gezagsorganen van de scholen die zijn aangesloten bij het samenwerkingsverband, bedoeld in het vierde
      lid, personeel dat in dienst was bij het bevoegd gezag van een school voor voortgezet speciaal onderwijs of een
      school voor speciaal en voortgezet speciaal onderwijs en op die school was belast met ambulante begeleiding, hebben
      overgenomen. Bij ministeriële regeling worden regels gegeven met betrekking tot de berekening van de in de eerste
      volzin bedoelde vermindering.


