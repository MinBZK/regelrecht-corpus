  - number: XII.2
    text: |-
      De [artikelen 118, tiende lid][ref1], en [132, vierde lid, van de Wet op het primair onderwijs][ref2] en
      de [artikelen 85b, derde lid][ref3], en [89a, derde lid, van de Wet op het voortgezet onderwijs][ref4]
      zijn van overeenkomstige toepassing ten aanzien van de bekostiging van een landelijk samenwerkingsverband
      als bedoeld in [artikel 18a, vijftiende lid, van de Wet op het primair onderwijs][ref5] of
      [artikel 17a, zestiende lid, van de Wet op het voortgezet onderwijs][ref6], voor zover het leerlingen betreft die
      op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt, waren ingeschreven op een
      school voor speciaal onderwijs respectievelijk voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref7], die is aangesloten bij
      een landelijk samenwerkingsverband, en die tot dat onderwijs toelaatbaar zijn verklaard door een commissie voor de
      indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref8] zoals dat artikel luidde voor
      de datum van inwerkingtreding van [artikel II, onderdeel K][ref9], van deze wet, van wie de geldigheidsduur van de
      indicatie eindigt op een datum die is gelegen na de inwerkingtreding van laatstgenoemd artikelonderdeel.


