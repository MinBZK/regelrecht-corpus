      2 De correctie, bedoeld in het eerste lid, wordt berekend als volgt: het bedrag, bedoeld in
      [artikel 85b, derde lid, eerste volzin, van de Wet op het voortgezet onderwijs][ref3] op basis van de telgegevens
      van 1 oktober 2011 wordt vermeerderd met het bedrag dat gemoeid is met de leerlingen die op 31 juli 2011 14 jaar
