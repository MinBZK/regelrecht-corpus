  - number: XIa.6
    text: |-
      De verplichting, bedoeld in het vierde lid, wordt verminderd of komt te vervallen indien en naar mate de bevoegde
      gezagsorganen van de scholen die zijn aangesloten bij het samenwerkingsverband, bedoeld in het vierde lid,
      personeel dat in dienst was bij het bevoegd gezag van een school voor voortgezet speciaal onderwijs of een school
      voor speciaal en voortgezet speciaal onderwijs en op die school was belast met ambulante begeleiding, hebben
      overgenomen. Bij ministeriële regeling worden regels gegeven met betrekking tot de berekening van de in de eerste
      volzin bedoelde vermindering.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXIa
  - number: XII.1
    text: |-
      De [artikelen 118, tiende lid][ref1], en [132, vierde lid, van de Wet op het primair onderwijs][ref2] en
      de [artikelen 85b, derde lid][ref3], en [89a, derde lid, van de Wet op het voortgezet onderwijs][ref4]
      zijn van overeenkomstige toepassing ten aanzien van de bekostiging van het samenwerkingsverband,
      bedoeld in [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref5] en
      [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref6] voor zover het leerlingen betreft die
      woonachtig zijn in het gebied van het samenwerkingsverband en die op 1 oktober van het jaar voorafgaand aan het
      jaar waarover de bekostiging plaatsvindt, waren ingeschreven op een school voor speciaal onderwijs respectievelijk
      voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in
      de [Wet op de expertisecentra][ref7], en die tot dat onderwijs toelaatbaar zijn verklaard door een commissie voor
      de indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref8] zoals dat artikel luidde
      voor de datum van inwerkingtreding van [artikel II, onderdeel K][ref9], van deze wet, van wie de geldigheidsduur
      van de indicatie eindigt op een datum die is gelegen na de inwerkingtreding van laatstgenoemd artikelonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
