      Tot het tijdstip waarop de periode van vijf jaar, bedoeld in [artikel 114 van de Wet op de expertisecentra][ref1],
      zoals dat artikel luidde voor de inwerkingtreding van [artikel II, onderdeel GG][ref2] van deze wet, is verstreken,
      blijft bedoeld artikel 114 van de Wet op de expertisecentra van toepassing op instellingen als bedoeld in
      [artikel 8, eerste lid, tweede volzin, van de Wet op de expertisecentra][ref3]. Tot het in de eerste volzin
      bedoelde tijdstip blijven de [artikelen 111][ref4] en [114 van de Wet op de expertisecentra][ref5], zoals die
      artikelen zijn gewijzigd door deze wet, ten aanzien van de in de eerste volzin bedoelde instellingen buiten
