  - number: XII.3
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt bij ministeriële regeling de indicatie van de leerling
      voor een bepaalde onderwijssoort omgezet naar één van de normbedragen die bij ministeriële regeling worden
      vastgesteld. Dit normbedrag blijft van toepassing totdat het samenwerkingsverband het normbedrag heeft bepaald
      dan wel de leerling niet langer is ingeschreven op een school voor speciaal onderwijs respectievelijk voortgezet
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: XIII.1
    text: |-
      Vanaf het tweede schooljaar vanaf de datum van inwerkingtreding van
      [artikel 132 van de Wet op het primair onderwijs][ref1] wordt gedurende vijf schooljaren voor alle
      samenwerkingsverbanden, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2] de bekostiging, bedoeld
      in artikel 132, tweede lid, van de Wet op het primair onderwijs gecorrigeerd door het bedrag, berekend volgens
      het tweede lid, erbij op te tellen indien het een positief bedrag is dan wel af te trekken indien het een negatief
      bedrag is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel1
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '1'
  - number: XIII.2
    text: |-
      De correctie, bedoeld in het eerste lid, wordt berekend als volgt: het bedrag, bedoeld in
      [artikel 132, vierde lid, eerste volzin, van de Wet op het primair onderwijs][ref1] op basis van de telgegevens
      van 1 oktober 2011 wordt verminderd met het bedrag dat gemoeid is met de leerlingen die op 31 juli 2011 14 jaar of
      ouder waren. Het resterende bedrag wordt vermeerderd met de som van de personele bedragen van het leerlinggebonden
      budget, bedoeld in [artikel 70a van de Wet op het primair onderwijs][ref2], zoals die bepaling luidde op de dag
      direct voorafgaand aan het tijdstip waarop genoemd artikel is vervallen, voor de vestigingen van de scholen,
      behorend tot het samenwerkingsverband op basis van de telgegevens van 1 oktober 2011. De som van de in de eerste
      volzin bedoelde bedragen wordt verminderd met het bedrag, bedoeld in artikel 132, derde lid, van de Wet op het
      primair onderwijs, op basis van het aantal leerlingen op 1 oktober 2011. De uitkomst van deze berekening wordt
      in het tweede schooljaar vanaf de datum van inwerkingtreding bedoeld in het eerste lid, vermenigvuldigd met 100%
      en vervolgens in het derde, vierde, vijfde en zesde schooljaar vermenigvuldigd met een voor dat schooljaar bij
      algemene maatregel van bestuur vast te stellen percentage, dat verschillend kan worden vastgesteld voor correcties
      waarbij een bedrag wordt opgeteld en correcties waarbij een bedrag wordt afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel70a
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 70a
  - number: XIII.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXIII
  - number: XIV.1
    text: |-
      Vanaf 1 januari na de datum van inwerkingtreding van [artikel 118 van de Wet op het primair onderwijs][ref1]
      wordt gedurende vijf jaren voor alle samenwerkingsverbanden, bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref2] de bekostiging, bedoeld in artikel 118, achtste lid, van
      de Wet op het primair onderwijs gecorrigeerd door het bedrag, berekend volgens het tweede lid, erbij op te tellen
      indien het een positief bedrag is dan wel af te trekken indien het een negatief bedrag is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel1
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXIV
