  - number: XIa.2
    text: |-
      De omvang van de personele bekostiging, bedoeld in het eerste lid, wordt berekend
      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 70a, tweede en vierde lid, van de Wet op het primair onderwijs][ref1], zoals die bepalingen luidden op de
      dag direct voorafgaand aan het tijdstip waarop artikel 70a van de Wet op het primair onderwijs is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel70a
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXIa
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 70a
  - number: XIa.3
    text: |-
      De verplichting, bedoeld in het eerste lid, wordt verminderd of komt te vervallen, indien en naar mate de
      bevoegde gezagsorganen van de scholen die zijn aangesloten bij het samenwerkingsverband, bedoeld in het eerste
      lid, personeel dat in dienst was bij het bevoegd gezag van een school voor speciaal onderwijs of een school
      voor speciaal en voortgezet speciaal onderwijs en op die school was belast met ambulante begeleiding, hebben
      overgenomen. Bij ministeriële regeling worden regels gegeven met betrekking tot de berekening van de in de eerste
      volzin bedoelde vermindering.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXIa
  - number: XIa.4
    text: |-
      Het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref1], besteedt in het
      tweede schooljaar waarin [artikel 77a van de Wet op het voortgezet onderwijs][ref2] door deze wet is vervallen
      de personele bekostiging, bedoeld in het vijfde lid, bij de scholen voor voortgezet speciaal onderwijs of scholen
      voor speciaal en voortgezet speciaal onderwijs, voor zover daaraan voortgezet speciaal onderwijs wordt verzorgd,
      behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref3], die in het laatste schooljaar waarin
      artikel 77a van de Wet op het voortgezet onderwijs van toepassing was, de ambulante begeleiding verzorgden ten
      behoeve van leerlingen op scholen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel77a
      [ref3]: https://wetten.overheid.nl/BWBR0003549
