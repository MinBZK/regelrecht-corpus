  - number: XI
    text: |-
      1 In het eerste schooljaar waarin [artikel 70a van de Wet op het primair onderwijs][ref1] door deze wet
      is vervallen, ontvangt het bevoegd gezag van een school voor speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], voor het
      aantal leerlingen waarvoor op 1 oktober van het daaraan voorafgaande schooljaar een leerlinggebonden budget
      beschikbaar was, de personele bekostiging van het gedeelte van dat budget, bedoeld in artikel 70a, vierde lid,
      van de Wet op het primair onderwijs, zoals die bepaling luidde op de dag direct voorafgaand aan het tijdstip
      waarop artikel 70a van de Wet op het primair onderwijs is vervallen. Het bevoegd gezag, bedoeld in de eerste
      volzin, maakt met het samenwerkingsverband of de samenwerkingsverbanden waartoe de scholen, bedoeld in de
      [Wet op het primair onderwijs][ref3] behoren waar de in de eerste volzin bedoelde leerlingen waren ingeschreven,
      afspraken over de besteding van de bekostiging, bedoeld in de eerste volzin. In afwijking van de eerste volzin,
      ontvangt het samenwerkingsverband waartoe de scholen als bedoeld in de Wet op het primair onderwijs behoren
      waar de in de eerste volzin bedoelde leerlingen waren ingeschreven, de bekostiging, bedoeld in de eerste volzin,
      indien de bevoegde gezagsorganen van alle betrokken scholen voor speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs daarmee instemmen. Bij ministeriële regeling worden nadere voorschriften vastgesteld omtrent de
      toepassing van de vorige volzin.

      2 In het eerste schooljaar waarin [artikel 70a van de Wet op het primair onderwijs][ref4] door deze wet is
      vervallen, ontvangt het bevoegd gezag van een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref5], voor het aantal leerlingen
      waarvoor op 1 oktober van het daaraan voorafgaande schooljaar een leerlinggebonden budget beschikbaar was, tot
      1 januari van het desbetreffende schooljaar de materiële bekostiging van het gedeelte van dat budget, bedoeld
      in artikel 70a, vierde lid, van de Wet op het primair onderwijs, zoals die bepaling luidde op de dag direct
      voorafgaand aan het tijdstip waarop artikel 70a van de Wet op het primair onderwijs is vervallen. Het bevoegd
      gezag, bedoeld in de eerste volzin, maakt met het samenwerkingsverband of de samenwerkingsverbanden waartoe
      de scholen als bedoeld in de [Wet op het primair onderwijs][ref6] behoren waar de in de eerste volzin bedoelde
      leerlingen waren ingeschreven, afspraken over de besteding van de bekostiging, bedoeld in de eerste volzin. In
      afwijking van de eerste volzin, ontvangt het samenwerkingsverband waartoe de scholen als bedoeld in de Wet op
      het primair onderwijs behoren waar de in de eerste volzin bedoelde leerlingen waren ingeschreven, de bekostiging,
      bedoeld in de eerste volzin, indien de bevoegde gezagsorganen van alle betrokken scholen voor speciaal onderwijs en
      speciaal en voortgezet speciaal onderwijs daarmee instemmen. Bij ministeriële regeling worden nadere voorschriften
      vastgesteld omtrent de toepassing van de vorige volzin.

      3 In het eerste schooljaar waarin [artikel 77a van de Wet op het voortgezet onderwijs][ref7] door deze wet is
      vervallen, ontvangt het bevoegd gezag van een school voor voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref8], voor het
      aantal leerlingen waarvoor op 1 oktober van het daaraan voorafgaande schooljaar een leerlinggebonden budget
      beschikbaar was, de personele bekostiging van het gedeelte van dat budget, bedoeld in artikel 77a, vierde lid,
      van de Wet op het voortgezet onderwijs, zoals die bepaling luidde op de dag direct voorafgaand aan het tijdstip
      waarop artikel 77a van de Wet op het voortgezet onderwijs is vervallen. Het bevoegd gezag, bedoeld in de eerste
      volzin, maakt met het samenwerkingsverband of de samenwerkingsverbanden waartoe de scholen als bedoeld in de
      [Wet op het voortgezet onderwijs][ref9] behoren waar de in de eerste volzin bedoelde leerlingen waren ingeschreven,
      afspraken over de besteding van de bekostiging, bedoeld in de eerste volzin. In afwijking van de eerste volzin,
      ontvangt het samenwerkingsverband waartoe de scholen als bedoeld in de Wet op het voortgezet onderwijs behoren waar
      de in de eerste volzin bedoelde leerlingen waren ingeschreven, de bekostiging, bedoeld in de eerste volzin, indien
      de bevoegde gezagsorganen van alle betrokken scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs daarmee instemmen. Bij ministeriële regeling worden nadere voorschriften vastgesteld omtrent de
      toepassing van de vorige volzin.

      4 In het eerste schooljaar waarin [artikel 77a van de Wet op het voortgezet onderwijs][ref10] door deze wet is
      vervallen, ontvangt het bevoegd gezag van een school voor voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref11], voor het aantal
      leerlingen waarvoor op 1 oktober van het daaraan voorafgaande schooljaar een leerlinggebonden budget beschikbaar
      was, tot 1 januari van het desbetreffende schooljaar de materiële bekostiging van het gedeelte van dat budget,
      bedoeld in artikel 77a, vierde lid, van de Wet op het voortgezet onderwijs, zoals die bepaling luidde op de dag
      direct voorafgaand aan het tijdstip waarop artikel 77a van de Wet op het voortgezet onderwijs is vervallen. Het
      bevoegd gezag, bedoeld in de eerste volzin, maakt met het samenwerkingsverband of de samenwerkingsverbanden waartoe
      de scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref12] behoren waar de in de eerste volzin bedoelde
      leerlingen waren ingeschreven, afspraken over de besteding van de bekostiging, bedoeld in de eerste volzin. In
      afwijking van de eerste volzin, ontvangt het samenwerkingsverband waartoe de scholen als bedoeld in de Wet op het
      voortgezet onderwijs behoren waar de in de eerste volzin bedoelde leerlingen waren ingeschreven, de bekostiging,
      bedoeld in de eerste volzin, indien de bevoegde gezagsorganen van alle betrokken scholen voor voortgezet speciaal
      onderwijs en speciaal en voortgezet speciaal onderwijs daarmee instemmen. Bij ministeriële regeling worden nadere
      voorschriften vastgesteld omtrent de toepassing van de vorige volzin.

      5 De omvang van de bekostiging, bedoeld in het eerste en tweede lid, wordt berekend
      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 70a, tweede en vierde lid, van de Wet op het primair onderwijs][ref13], zoals die bepalingen luidden op de
      dag direct voorafgaand aan het tijdstip waarop artikel 70a van de Wet op het primair onderwijs is vervallen.

      6 De omvang van de bekostiging, bedoeld in het derde en vierde lid, wordt berekend
      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 77a, tweede en vierde lid, van de Wet op het voortgezet onderwijs][ref14], zoals die bepalingen luidden op
      de dag direct voorafgaand aan het tijdstip waarop artikel 77a van de Wet op het voortgezet onderwijs is vervallen.


