  - number: XXIII.2
    text: |-
      Het bevoegd gezag van een instelling in oprichting meldt Onze Minister welke scholen als bedoeld in het eerste lid
      in dat schooljaar samenwerken in de instelling in oprichting.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXXIII
  - number: XXIII.3
    text: |-
      Voor de bekostiging van personeel wordt aan de scholen, bedoeld in het eerste lid, een bedrag per school en een
      bedrag per leerling toegekend, welke bedragen worden verhoogd met een bedrag dat wordt vermenigvuldigd met de
      gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar. De bedragen,
      bedoeld in de eerste volzin, worden bij ministeriële regeling vastgesteld. In aanvulling op de bekostiging, bedoeld
      in de eerste volzin, ontvangt de school van de instelling in oprichting waarmee wordt samengewerkt, een bedrag in
      verband met de auditieve en communicatieve handicap van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXXIII
  - number: XXIII.4
    text: |-
      De instelling in oprichting ontvangt jaarlijks een bij ministeriële regeling vast te stellen bekostiging in verband
      met de auditieve en communicatieve handicap van de leerlingen van de scholen, bedoeld in het eerste lid, die is
      gebaseerd op het aantal leerlingen van de scholen waarmee de instelling in oprichting samenwerkt.
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXXIII
  - number: XXIII.5
    text: |-
      Op de instellingen in oprichting zijn de artikelen in de [Wet op de expertisecentra][ref1] die betrekking
      hebben op instellingen van overeenkomstige toepassing, met uitzondering van [artikel 114][ref2] en
      [artikel 117, eerste en vijfde lid, van genoemde wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0032176/2018-01-01#ArtikelXXIII
