  - number: X
    text: |-
      1 In het eerste schooljaar waarin [artikel 70a van de Wet op het primair onderwijs][ref1] door deze wet is
      vervallen, ontvangt het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2],
      voor het aantal leerlingen van alle vestigingen van scholen in het samenwerkingsverband waarvoor op 1 oktober van
      het daaraan voorafgaande schooljaar een leerlinggebonden budget beschikbaar was, een overgangsbekostiging voor
      personele kosten. De overgangsbekostiging wordt berekend door voor elke leerling de personele bekostiging van het
      voor die leerling geldende leerlinggebonden budget te verminderen met de personele bekostiging van het gedeelte van
      dat budget, bedoeld in artikel 70a, vierde lid, van de Wet op het primair onderwijs, zoals die bepaling luidde op
      de dag direct voorafgaand aan het tijdstip waarop artikel 70a van de Wet op het primair onderwijs is vervallen.

      2 In het eerste schooljaar waarin [artikel 70a van de Wet op het primair onderwijs][ref3] door deze wet is
      vervallen, ontvangt het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref4]
      tot 1 januari van het desbetreffende schooljaar voor het aantal leerlingen van alle vestigingen van scholen in
      het samenwerkingsverband waarvoor op 1 oktober van het daaraan voorafgaande schooljaar een leerlinggebonden budget
      beschikbaar was, een overgangsbekostiging voor materiële instandhouding. De overgangsbekostiging wordt berekend
      door voor elke leerling de materiële bekostiging van het voor die leerling geldende leerlinggebonden budget te
      verminderen met de materiële bekostiging van het gedeelte van dat budget, bedoeld in artikel 70a, vierde lid, van
      de Wet op het primair onderwijs, zoals die bepaling luidden op de dag direct voorafgaand aan het tijdstip waarop
      artikel 70a van de Wet op het primair onderwijs is vervallen.

      3 In het eerste schooljaar waarin [artikel 77a van de Wet op het voortgezet onderwijs][ref5] door deze wet is
      vervallen, ontvangt het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref6],
      voor het aantal leerlingen van alle vestigingen van scholen in het samenwerkingsverband waarvoor op 1 oktober van
      het daaraan voorafgaande schooljaar een leerlinggebonden budget beschikbaar was, een overgangsbekostiging voor
      personele kosten. De overgangsbekostiging wordt berekend door voor elke leerling de personele bekostiging van het
      voor die leerling geldende leerlinggebonden budget te verminderen met de personele bekostiging van het gedeelte
      van dat budget, bedoeld in artikel 77a, vierde lid, van de Wet op het voortgezet onderwijs, zoals die bepaling
      luidde op de dag direct voorafgaand aan het tijdstip waarop artikel 77a van de Wet op het voortgezet onderwijs
      is vervallen.

      4 In het eerste schooljaar waarin [artikel 77a van de Wet op het voortgezet onderwijs][ref7] door deze wet is
      vervallen, ontvangt het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref8]
      tot 1 januari van het desbetreffende schooljaar voor het aantal leerlingen van alle vestigingen van scholen in
      het samenwerkingsverband waarvoor op 1 oktober van het daaraan voorafgaande schooljaar een leerlinggebonden budget
      beschikbaar was, een overgangsbekostiging voor materiële instandhouding. De overgangsbekostiging wordt berekend
      door voor elke leerling de materiële bekostiging van het voor die leerling geldende leerlinggebonden budget te
      verminderen met de materiële bekostiging van het gedeelte van dat budget, bedoeld in artikel 77a, vierde lid, van
      de Wet op het voortgezet onderwijs, zoals die bepaling luidden op de dag direct voorafgaand aan het tijdstip waarop
      artikel 77a van de Wet op het voortgezet onderwijs is vervallen.

      5 De omvang van de bekostiging, bedoeld in het eerste en tweede lid, wordt berekend
      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 70a, tweede en vierde lid, van de Wet op het primair onderwijs][ref9], zoals die bepalingen luidden op de
      dag direct voorafgaand aan het tijdstip waarop artikel 70a van de Wet op het primair onderwijs is vervallen.

      6 De omvang van de bekostiging, bedoeld in het derde en vierde lid, wordt berekend
      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 77a, tweede en vierde lid, van de Wet op het voortgezet onderwijs][ref10], zoals die bepalingen luidden op
      de dag direct voorafgaand aan het tijdstip waarop artikel 77a van de Wet op het voortgezet onderwijs is vervallen.


