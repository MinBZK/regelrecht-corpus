  - number: XI.1
    text: |-
      In het eerste schooljaar waarin [artikel 70a van de Wet op het primair onderwijs][ref1] door deze wet is
      vervallen, ontvangt het bevoegd gezag van een school voor speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], voor het
      aantal leerlingen waarvoor op 1 oktober van het daaraan voorafgaande schooljaar een leerlinggebonden budget
      beschikbaar was, de personele bekostiging van het gedeelte van dat budget, bedoeld in artikel 70a, vierde lid,
      van de Wet op het primair onderwijs, zoals die bepaling luidde op de dag direct voorafgaand aan het tijdstip
      waarop artikel 70a van de Wet op het primair onderwijs is vervallen. Het bevoegd gezag, bedoeld in de eerste
      volzin, maakt met het samenwerkingsverband of de samenwerkingsverbanden waartoe de scholen, bedoeld in de
      [Wet op het primair onderwijs][ref3] behoren waar de in de eerste volzin bedoelde leerlingen waren ingeschreven,
      afspraken over de besteding van de bekostiging, bedoeld in de eerste volzin. In afwijking van de eerste volzin,
      ontvangt het samenwerkingsverband waartoe de scholen als bedoeld in de Wet op het primair onderwijs behoren
      waar de in de eerste volzin bedoelde leerlingen waren ingeschreven, de bekostiging, bedoeld in de eerste volzin,
      indien de bevoegde gezagsorganen van alle betrokken scholen voor speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs daarmee instemmen. Bij ministeriële regeling worden nadere voorschriften vastgesteld omtrent de
      toepassing van de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420
