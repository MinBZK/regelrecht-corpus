  - number: XVIII
    text: |-
      1 Het regionaal expertisecentrum, bedoeld in [artikel 28b van de Wet op de expertisecentra][ref1], zoals dat
      artikel luidde op de dag direct voorafgaand aan het tijdstip waarop dat artikel door deze wet is vervallen, draagt
      zorg voor de verdeling en de overdracht van de nog niet bestede bekostiging aan de bevoegde gezagsorganen van de
      scholen die op die dag waren aangesloten bij het regionaal expertisecentrum.

      2 Het bestuur van een centrale dienst draagt zorg voor de verdeling en de overdracht van de nog niet bestede
      bekostiging van een samenwerkingsverband als bedoeld in [artikel 18 van de Wet op het primair onderwijs][ref2],
      zoals dat artikel luidde op de dag direct voorafgaand aan het tijdstip waarop dat artikel door deze wet is
      vervallen, aan de bevoegde gezagsorganen van de scholen die op die dag deelnamen aan dat samenwerkingsverband.

      3 De overdracht, bedoeld in het eerste respectievelijk tweede lid, dient uiterlijk één jaar na inwerkingtreding van
      [artikel II, onderdeel J][ref3], respectievelijk [artikel I, onderdeel J][ref4], te zijn gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
