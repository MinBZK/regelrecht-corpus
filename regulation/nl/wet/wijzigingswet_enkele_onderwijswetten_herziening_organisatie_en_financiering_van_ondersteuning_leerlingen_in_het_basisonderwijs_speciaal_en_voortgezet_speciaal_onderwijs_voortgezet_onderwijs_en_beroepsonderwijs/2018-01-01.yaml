      op een bij algemene maatregel van bestuur vast te stellen wijze overeenkomstig
      [artikel 77a, tweede en vierde lid, van de Wet op het voortgezet onderwijs][ref1], zoals die bepalingen luidden op
      de dag direct voorafgaand aan het tijdstip waarop artikel 77a van de Wet op het voortgezet onderwijs is vervallen.


