  - number: XVI.2
    text: |-
      De correctie, bedoeld in het eerste lid, wordt berekend als volgt: het bedrag, bedoeld in
      [artikel 89a, derde lid, eerste volzin, van de Wet op het voortgezet onderwijs][ref1] op basis van de telgegevens
      van 1 oktober 2011 wordt vermeerderd met het bedrag van dat gemoeid is met de leerlingen die op 31 juli 2011
      14 jaar of ouder waren en op 1 oktober 2011 stonden ingeschreven op het speciaal onderwijs, of een school voor
      speciaal of voortgezet onderwijs voor zover daaraan speciaal onderwijs wordt verzorgd en die woonachtig zijn in het
      gebied van het samenwerkingsverband. Dit bedrag wordt vervolgens vermeerderd met de som van de materiële bedragen
      van het leerlinggebonden budget, bedoeld in [artikel 77a van de Wet op het voortgezet onderwijs][ref2], zoals
      die bepaling luidde op de dag direct voorafgaand aan het tijdstip waarop genoemd artikel is vervallen, voor de
      vestigingen van de scholen, behorend tot het samenwerkingsverband op basis van de telgegevens van 1 oktober 2011.
      De som van de in de eerste volzin bedoelde bedragen wordt verminderd met het bedrag, bedoeld in artikel 89a, tweede
      lid, van de Wet op het voortgezet onderwijs, op basis van het aantal leerlingen op 1 oktober 2011. De uitkomst
      van deze berekening wordt in het tweede jaar vanaf de datum van inwerkingtreding bedoeld in het eerste lid,
      vermenigvuldigd met 100% en vervolgens in het derde, vierde, vijfde en zesde jaar vermenigvuldigd met een voor dat
      jaar bij algemene maatregel van bestuur vast te stellen percentage, dat verschillend kan worden vastgesteld voor
      correcties waarbij een bedrag wordt opgeteld en correcties waarbij een bedrag wordt afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel89a
