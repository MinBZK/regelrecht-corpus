      bedoeld in die volzin, tot 1 augustus 2015 gegeven in scholen voor speciaal onderwijs, scholen voor voortgezet
      speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs, verdeeld als aangegeven in de in die
      volzin genoemde onderwijssoorten.


