preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wijze van verrekening van inkomsten in de Ziektewet
    te herzien en in de Ziektewet en de Wet werk en inkomen naar arbeidsvermogen de mogelijkheid te introduceren van
    verlenging van de loondoorbetalingsperiode voor en van verhaal van ziekengeld op de werkgever van personen die
    aanspraak maken op ziekengeld op grond van de Ziektewet;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030113/2012-01-01#ArtikelAanhef
articles:
  - number: I
    text: '*[Vervallen]*'
    url: https://wetten.overheid.nl/BWBR0030113/2012-01-01#ArtikelI
  - number: IV
    text: |-
      Na de inwerkingtreding van [artikel III][ref1] van de Wet wijziging verrekening inkomsten met ziekengeld
      berust de [Regeling procesgang eerste en tweede ziektejaar voor vangnetters zonder werkgever][ref2] op
      [artikel 26, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030113#ArtikelIII
      [ref2]: https://wetten.overheid.nl/BWBR0022309
