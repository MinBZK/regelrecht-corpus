        artikel: '6'
  - number: '8'
    text: Het bestuur kan nadere regels stellen inzake onderwerpen waarop deze verordening van toepassing is.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel8
  - number: '9'
    text: |-
      Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld als
      voorzien in de [Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016341
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016341
  - number: '10'
    text: |-
      1 De voorzitter is bevoegd, op aanvraag, ontheffing te verlenen van het bepaalde bij of krachtens deze verordening
      en aan zodanige ontheffing voorschriften te verbinden, alsmede deze onder beperkingen te verlenen.

      2 Het bestuur kan vrijstelling verlenen aan ondernemers danwel aan een groep van te onderscheiden categorieën
      ondernemers en aan een zodanige vrijstelling beperkingen en/of voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel10
  - number: '11'
    text: |-
      1 Deze verordening kan worden aangehaald als "Verordening hygiënevoorschriften pluimveeverwerkende industrie 1999".

      2 Deze verordening treedt in werking met ingang van de dag na die van haar afkondiging in het Verordeningenblad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel11
