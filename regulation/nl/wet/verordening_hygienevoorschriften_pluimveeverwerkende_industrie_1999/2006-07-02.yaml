preamble:
  text: |-
    gelet op de Richtlijn nr. 92/117/EEG van de Raad van 17 december 1992 inzake maatregelen voor de bescherming tegen
    bepaalde zoönoses en bepaalde zoönoseverwekkers bij dieren en in produkten van dierlijke oorsprong ten einde door
    voedsel overgedragen infecties en vergiftigingen te voorkomen,

    gelet op de artikelen 93, eerste lid, 95, 102 en 105 van de Wet op de Bedrijfsorganisatie en de artikelen 5, 6, 7
    en 8 van de Instellingsverordening Productschap Pluimvee en Eieren,

    op 11 november 1999 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening worden de begripsbepalingen van de
      [Verordening hygiënevoorschriften pluimveehouderij 1999][ref1] overgenomen en verstaat daarnaast onder:









                  ondernemer


                  :


                  een natuurlijk persoon of rechtspersoon die een onderneming drijft waarin pluimvee wordt be- of
      verwerkt;




                  partij


                  :


                  een aaneengesloten geleverde hoeveelheid vleeskuikens, welke afkomstig is van één pluimveehouder;




                  onderneming


                  :


                  tot de onderneming worden gerekend alle inrichtingen waarin pluimvee wordt be- of verwerkt en welke
      voor tenminste 51% in eigendom zijn van dezelfde ondernemer;




                  slachterij


                  :


                  een inrichting waar pluimvee wordt geslacht en die voldoet aan de in de [Richtlijn 71/118/EEG]
      (31971L0118) gestelde eisen en als zodanig erkend zijn;




                  uitsnijderij


                  :


                  een inrichting waarin pluimveevlees wordt uitgesneden of uitgebeend, verpakt of opgeslagen en die
      voldoet aan de in [Richtlijn 71/118/EEG](31971L0118) gestelde eisen en als zodanig erkend is;




                  nuchter pluimvee


                  :


                  pluimvee waarvan de krop leeg is.


      [ref1]: https://wetten.overheid.nl/BWBR0010849
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010849
  - number: '2'
    text: |-
      Ondernemers zijn, onverminderd enig ander wettelijk voorschrift, verplicht

      a. een koppel dat besmet is met Salmonella zodanig apart te houden dat er zo min mogelijk contact kan ontstaan met
      koppels die niet besmet zijn met Salmonella;

      b. er voor zorg te dragen dat het pluimvee nuchter is op het moment van aanhangen;

      c. er voor zorg dragen dat geen vuile lucht wordt afgezogen naar schone ruimten;

      d. alle gebruikte attributen te reinigen en te ontsmetten.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel2
  - number: 2a
    text: |-
      1 De ondernemer is verplicht de vervoermiddelen waarmee het ter slachting aangevoerde pluimvee is aangevoerd direct
      na gebruik en in elk geval voordat de vervoermiddelen het bedrijfsterrein verlaten te reinigen en te ontsmetten.
      De ondernemer dient direct aansluitend aan de reiniging en ontsmetting te controleren of de vervoermiddelen
      visueel schoon zijn. Indien hij vaststelt dat dit niet het geval is, dient hij dit duidelijk kenbaar op en aan de
      vervoermiddelen aan te geven met daarbij de aantekening wanneer het reinigen en ontsmetten zal worden herhaald voor
      het verlaten van het bedrijfsterrein.

      2 De ondernemer is verplicht de kratten, containers e.d. waarin levend pluimvee ter slachting is aangevoerd direct
      na gebruik en in elk geval voordat deze het bedrijfsterrein verlaten zodanig te reinigen, dat deze visueel geheel
      schoon zijn en te ontsmetten. De ondernemer dient direct aansluitend aan de reiniging en ontsmetting te controleren
      of de kratten, containers e.d. visueel schoon zijn. Indien hij vaststelt dat dit niet het geval is, dient hij
      dit duidelijk kenbaar op en aan de kratten, containers e.d. aan te geven met daarbij de aantekening wanneer het
      reinigen en ontsmetten zal worden herhaald voor het verlaten van het bedrijfsterrein.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel2a
  - number: '3'
    text: |-
      1 Iedere ondernemer is verplicht elk koppel te slachten pluimvee na de aanlevering op de slachterij te onderzoeken
      of te laten onderzoeken op de aanwezigheid van de in de Bijlage bedoelde schadelijke micro-organismen. De monsters,
      waarvan de wijze van monstername en analyse bij bestuursbesluit nader zijn omschreven, moeten geanalyseerd worden
      op alle typen Salmonella. Bij een besmetting moet geanalyseerd worden om welk serotype het gaat.

      2 a. De ondernemer dient het geslachte pluimvee en het uitgesneden en uitgebeende pluimveevlees te onderzoeken of
      te laten onderzoeken op de aanwezigheid van de in de Bijlage bedoelde schadelijke micro-organismen.

      b. De monsters, waarvan de wijze van monstername en analyse bij besluit van het bestuur nader zijn omschreven,
      worden geanalyseerd op alle typen Salmonella.

      c. Bij een besmetting wordt geanalyseerd om welk serotype het gaat.

      3 Het in het eerste en tweede lid bedoelde onderzoek geschiedt door middel van het nemen van monsters.

      4 Het bestuur kan regels stellen omtrent de te onderzoeken producten alsmede omtrent de wijze van bemonstering en
      de te hanteren analysemethoden.

      5 De monsters dienen te worden onderzocht door een erkend laboratorium, dat wordt aangewezen door de voorzitter, op
      basis van door het bestuur vast te stellen erkenningsvoorwaarden.

      6 Dagelijks moet een monster worden genomen van de kratten en containers waarmee het pluimvee is aangevoerd.
      Wanneer bij één of meerdere koppels de in de Bijlage, onderdeel a., bedoelde schadelijke micro- organismen
      zijn aangetoond dient het betreffende monster te worden genomen van de kratten en containers van dit besmette
      koppel. Het bestuur kan regels stellen omtrent de wijze van monstername en analyse en de te nemen maatregelen bij
      besmettingen met de in de Bijlage, onderdeel a., bedoelde schadelijke micro-organismen.

      7 De uitslag van het in het eerste en tweede lid bedoelde onderzoek dient te voldoen aan de normen, die door het
      bestuur bij besluit zullen worden vastgesteld. Het bestuur bepaalt daarbij tevens, welke aanvullende maatregelen
      dienen te worden genomen, indien niet aan de norm is voldaan. De te nemen maatregelen worden afhankelijk gesteld
      van de matewaarin de norm is overschreden.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel3
  - number: '4'
    text: |-
      1 Het is een ondernemer alleen toegestaan pluimvee te slachten of te doen slachten indien het koppel waarvan het
      deel uitmaakt, bij aanlevering reeds is onderzocht op de aanwezigheid van de in de Bijlage genoemde schadelijke
      micro-organismen en indien het resultaat van de laboratoriumonderzoeken vóór het slachten van het betreffende
      pluimvee bij hem schriftelijk bekend is.

      2 Iedere ondernemer is verplicht eerst het pluimvee te slachten of te doen slachten dat afkomstig is van koppels
      die niet besmet zijn met in de Bijlage onderdeel a. bedoelde schadelijke micro-organismen. Nadat het pluimvee,
      bedoeld in de vorige zin, is geslacht is het toegestaan pluimvee te slachten dat afkomstig is van koppels die
      besmet zijn met in de Bijlage onderdeel a. bedoelde schadelijke micro-organismen.

      3 Het is een ondernemer alleen toegestaan pluimvee te slachten of te doen slachten indien het koppel, waarvan
      het desbetreffende pluimvee deel uitmaakt, bij aanlevering reeds is onderzocht middels onderzoeken, zoals bedoeld
      in het [Hygiënebesluit vleeskuikenbedrijven 1999][ref1] en het Hygiënebesluit kuikenbroederijen 1999, naar de
      aanwezigheid van de in de Bijlage onder a. genoemde schadelijke micro-organismen die op betreffend koppel zijn
      uitgevoerd op de broederij en het vleeskuikenbedrijf en indien het resultaat van de laboratoriumonderzoeken vóór
      het slachten van het betreffende pluimvee bij hem schriftelijk bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0010846
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010846
  - number: '5'
    text: |-
      Iedere ondernemer is verplicht de resultaten van de onderzoeken als bedoeld in
      [artikel 3, eerste en tweede lid][ref1] en [artikel 4, eerste lid][ref2] en alle overige onderzoeksresultaten
      verkregen van leveranciers van pluimvee gedurende 2 jaar te bewaren en is verplicht de resultaten van de
      onderzoeken op een daarvoor door het bestuur voorgeschreven wijze per maand te rapporteren aan het productschap.
      Deze rapportage dient te geschieden uiterlijk binnen 14 dagen volgend op die maand waarop de gegevens betrekking
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0010836#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010836#Artikel4
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010836
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010836
        artikel: '4'
  - number: '6'
    text: |-
      1 Het bestuur wijst een of meer instanties aan die worden belast met het toezicht op de naleving van het bepaalde
      bij of krachtens deze verordening. Bij het uitoefenen van het toezicht houdt de aangewezen instantie(s) zich aan de
      bepalingen van het protocol dat is vastgesteld door het bestuur van het productschap.

      2 Indien een ondernemer het bepaalde bij of krachtens deze verordening heeft overtreden zal de in het eerste lid
      bedoelde instantie de AID hiervan op de hoogte stellen.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel6
  - number: 6a
    text: |-
      1 De ondernemer laat zich jaarlijks ten minste één maal op eigen kosten door een door de voorzitter erkende
      controle-instantie controleren op de naleving van het bij of krachtens deze verordening bepaalde.

      2 De in het eerste lid bedoelde controle-instantie voldoet aan door het bestuur bij besluit vastgestelde
      erkenningscriteria, welke strekken tot waarborg van de onafhankelijkheid en deskundigheid van de controle-
      instantie.

      3 De in het eerste lid bedoelde controle-instantie kan op aanvraag worden erkend door de voorzitter. De erkenning
      kan tijdelijk en onder voorwaarden worden verleend en kan worden ingetrokken indien niet meer aan de voorwaarden
      wordt voldaan.

      4 Het besluit zoals bedoeld in het tweede lid wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel6a
  - number: '7'
    text: |-
      De ondernemer is verplicht aan controleurs van de in [artikel 6][ref1] bedoelde instanties:

      a. al die gegevens te verstrekken of te doen verstrekken, die naar hun oordeel nodig zijn voor de vervulling van
      hun taak;

      b. inzage te geven of te doen geven van die boeken en bescheiden, die naar hun oordeel nodig zijn voor de
      vervulling van hun taak;

      c. te allen tijde toegang te geven of te doen geven tot hun bedrijfsruimten en tot die plaatsen of vervoermiddelen,
      waar of waarin voorraden, die tot het bedrijf van de ondernemer behoren, zijn opgeslagen of worden vervoerd;

      d. te gedogen dat zij monsters nemen uit de voorraden van het bedrijf van de ondernemer, ongeacht de plaats waar
      of waarin zich die voorraden bevinden, en alsdan de gevorderde medewerking overeenkomstig de aanwijzingen en onder
      toezicht van die controleurs te verlenen;

      e. voor het overige alle medewerking te verlenen ter vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0010836#Artikel6
    url: https://wetten.overheid.nl/BWBR0010836/2006-07-02#Artikel7
