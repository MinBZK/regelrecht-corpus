  - number: '43'
    text: |-
      1 Een notariële verklaring als bedoeld in de [artikelen 32][ref1], [36][ref2], [40][ref3], [41][ref4] en [42][ref5]
      houdt, behalve hetgeen in die artikelen is voorgeschreven, tevens in een verklaring van de notaris dat:

      a. allen die als partij bij het in te schrijven feit betrokken zijn aan de notaris hebben medegedeeld met de
      inschrijving in te stemmen;

      b. bewijsstukken aan de notaris zijn overgelegd en aan de verklaring zijn gehecht, die genoegzaam aantonen
      dat het in te schrijven feit zich inderdaad heeft voorgedaan of, in geval van een verklaring als bedoeld in
      [artikel 42, tweede lid][ref6], dat het recht bestaat; of

      c. hij niet aan het onder a en b gestelde kan voldoen.

      2 In het in het eerste lid, onder c, bedoelde geval boekt de bewaarder de aanbieding van de notariële
      verklaring slechts in het register van voorlopige aantekeningen en kan inschrijving alleen plaatsvinden op
      bevel van de rechter. Het tweede en derde lid, het vierde lid, eerste zin, alsmede het vijfde en zesde lid
      van [artikel 20 van Boek 3 van het Burgerlijk Wetboek BES][ref7] zijn van overeenkomstige toepassing, met dien
      verstande dat het bevel slechts wordt gegeven als de eiser naast de bewaarder allen die als partij bij het in te
      schrijven feit zijn betrokken, tijdig in het geding heeft geroepen.

      3 De kosten van het geding blijven voor rekening van de eiser, tenzij de vordering ondanks verweer wordt
      toegewezen, in welk geval degene die het verweer heeft gevoerd in de kosten wordt veroordeeld.

      4 Wanneer het aangeboden stuk ook overigens niet aan de vereisten voor inschrijving voldoet,
      vermeldt de bewaarder bij de voorlopige aantekening tevens de gerezen bedenkingen en is
      [artikel 20 van Boek 3 van het Burgerlijk Wetboek BES][ref8] van toepassing, met dien verstande dat het daar
      bedoelde bevel slechts tezamen met dat uit hoofde van het tweede lid kan worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel32
