  - number: '47'
    text: |-
      1 Ter inschrijving van een feit dat is opgenomen in een stuk gesteld in een andere taal dan het Nederlands,
      het Engels of het Papiamento, wordt naast dat ter inschrijving aangeboden stuk een letterlijke vertaling in het
      Nederlands, het Engels of het Papiamento ter inschrijving aangeboden, vervaardigd en voor overeenstemmend verklaard
      door een voor die taal als bevoegd toegelaten beëdigd vertaler.

      2 Het bepaalde in het eerste lid lijdt uitzondering ingeval met betrekking tot luchtvaartuigen een proces-verbaal
      van inbeslagneming, opgemaakt in het buitenland door een deurwaarder of door een andere volgens de daar geldende
      wet daartoe bevoegde persoon en gesteld in een vreemde taal, aan de bewaarder wordt toegezonden of bij deze wordt
      ingeleverd. In dat geval wordt door de zorg van de aanbieder zo spoedig mogelijk een vertaling van een zodanig
      proces-verbaal vervaardigd door een in de openbare lichamen toegelaten beëdigd vertaler.

      3 De vertalingen worden ingeschreven in plaats van de in de vreemde taal gestelde stukken, die onder de bewaarder
      blijven berusten.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel47
  - number: '48'
    text: |-
      Op de inschrijving van stukken tot verbetering van onjuistheden en onvolledigheden in ingeschreven stukken zijn de
      bepalingen gegeven bij of krachtens dit hoofdstuk van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel48
  - number: '49'
    text: |-
      Indien het ter inschrijving aangeboden stuk waarin het in te schrijven feit is opgenomen, niet voldoet aan de
      vereisten, gesteld in de [artikelen 24 tot en met 48][ref1], kan het met ontbrekende gegevens worden aangevuld door
      een verklaring aan de voet van het stuk, ondertekend door degene die bevoegd is tot het opmaken en ondertekenen van
      een zodanig stuk, een en ander voor zover de aard van het stuk zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel24
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0043565
        artikel: '24'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '50'
    text: |-
      1 Stukken die voor bewijs bij de aanbieding van een stuk worden overgelegd, worden slechts mede ingeschreven als de
      wet dit eist of als de aanbieder dit verlangt, tenzij bij wet is bepaald dat de desbetreffende stukken niet worden
      ingeschreven.

      2 Door de bewaarder wordt, overeenkomstig door het bestuur van de Dienst te stellen regels, van de overlegging
      melding gemaakt op het ter inschrijving aangeboden stuk, alsmede ingeval [artikel 16, zesde lid][ref1], geen
      toepassing heeft gevonden, op het afschrift van dat stuk. De stukken die moeten worden overgelegd, maar waarvan de
      inschrijving niet wordt geëist of verlangd, worden onverwijld aan de aanbieder teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel16
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0043565
        artikel: '16'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '51'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vereisten waaraan stukken
      dienen te voldoen die worden aangeboden ter inschrijving van andere inschrijfbare feiten dan die waarop de
      [artikelen 30 tot en met 46][ref1] betrekking hebben, voor zover dit niet reeds bij deze wet of bij of krachtens
      een andere wet is geschied.

      2 Voor zover bij de in het eerste lid bedoelde maatregel niet anders is bepaald, wordt ter inschrijving van
      een beschikking of van een uitspraak waarbij een beschikking werd vernietigd, ingetrokken of gewijzigd, een
      afschrift van die beschikking onderscheidenlijk van die uitspraak aangeboden, afgegeven door het bestuursorgaan
      onderscheidenlijk het rechterlijk orgaan dat de beschikking of de uitspraak gaf.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel30
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0043565
        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '52'
    text: |-
      1 Naast feiten die voor de rechtstoestand van registergoederen van belang zijn, kunnen in de openbare registers
      tevens algemene voorwaarden, modelreglementen en andere stukken, die niet op een bepaald registergoed betrekking
      hebben, worden ingeschreven, met het uitsluitend doel dat daarnaar in later ter inschrijving aangeboden
      stukken kan worden verwezen. De [artikelen 18][ref1], [19][ref2], [20, eerste lid, eerste zin][ref3], en
      [22 van Boek 3 van het Burgerlijk Wetboek BES][ref4] zijn van overeenkomstige toepassing.

      2 Ter inschrijving van de in het eerste lid bedoelde stukken is naast het stuk zelf vereist een afschrift van dat
      stuk, gesteld op een door de bewaarder verstrekt formulier en voorzien van een verklaring van eensluidendheid.
      [Artikel 16, tweede tot en met zevende lid][ref5], is van overeenkomstige toepassing.

      3 De [artikelen 24 tot en met 29][ref6] zijn niet van toepassing. Bij algemene maatregel van bestuur kunnen eisen
      worden gesteld waaraan ter inschrijving aangeboden stukken als bedoeld in het eerste lid moeten voldoen. Het
      bestuur van de Dienst stelt regels vast omtrent de wijze waarop de verwijzing in de latere stukken geschiedt.

      4 In een ter inschrijving aangeboden stuk kan slechts worden verwezen naar een eerder ingeschreven stuk, indien
      de inschrijving van het later ter inschrijving aangeboden stuk plaatsvindt in het openbaar lichaam waar het stuk
      waarnaar wordt verwezen, reeds is ingeschreven.

      5 Een verwijzing naar een stuk als bedoeld in het eerste lid, eerste zin, heeft tot gevolg dat het stuk waarnaar
      in een ter inschrijving aangeboden stuk wordt verwezen, geacht wordt deel uit te maken van de inschrijving die op
      grond van het aangeboden stuk plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel19
