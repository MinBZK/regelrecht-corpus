  - number: '70'
    text: |-
      In bij algemene maatregel van bestuur te bepalen gevallen is de Dienst bevoegd te onderzoeken of de gegevens
      betreffende de rechtstoestand, de grootte en feitelijke gesteldheid van onroerende zaken, alsmede de gegevens
      betreffende de rechtstoestand van de rechten waaraan deze onroerende zaken onderworpen zijn, die zijn weergegeven
      in de kadastrale registratie en de aan de kadastrale kaart ten grondslag liggende bescheiden juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel70
  - number: '71'
    text: |-
      1 Vóór de aanvang van een onderzoek van vernieuwing als bedoeld in [artikel 70][ref1] maakt het bestuur van de
      Dienst het voornemen daartoe openbaar volgens bij ministeriële regeling gegeven regels. Bij algemene maatregel van
      bestuur kan voor daarin omschreven gevallen worden bepaald dat openbaarmaking achterwege kan blijven op de grond
      dat het bereiken van alle belanghebbenden door het bepaalde in het tweede lid voldoende gewaarborgd is.

      2 De Dienst doet in elk geval van een voornemen tot een onderzoek van vernieuwing schriftelijk mededeling aan de
      eigenaar en beperkt gerechtigde met betrekking tot de onroerende zaak, waarop de vernieuwing betrekking heeft,
      alsmede aan de personen die bij de Kadasters of de Dienst anderszins als belanghebbenden bij de vernieuwing bekend
      zijn. De mededeling houdt in elk geval in de dag en het uur waarop de aanwijzing die de grondslag vormt voor de
      meting, zal plaatsvinden.

      3 Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de mededeling, bedoeld in het tweede lid,
      wordt gedaan.

      4 Een voornemen tot een onderzoek van vernieuwing wordt bij het desbetreffende perceel in de kadastrale registratie
      vermeld volgens door het bestuur van de Dienst vast te stellen regels.

      5 In de mededeling, bedoeld in het tweede lid, wordt gewezen op de in I, genoemde gevolgen die de wet aan de
      vernieuwing verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel70
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel71
