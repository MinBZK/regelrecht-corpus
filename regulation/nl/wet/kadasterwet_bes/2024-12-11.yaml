  - number: '19'
    text: |-
      Na de inschrijving, bedoeld in [artikel 18, eerste lid][ref1], worden de ter inschrijving aangeboden stukken aan de
      aanbieder teruggegeven nadat zij door de bewaarder zijn voorzien van een aantekening, vermeldende het kantoor, dag,
      uur en minuut van aanbieding, alsmede het deel van het desbetreffende register waarin en het nummer waaronder in
      dat deel de opberging van het afschrift is geschied, of ingeval [artikel 16, zevende lid][ref2], toepassing heeft
      gevonden, de verwijzing naar de plaats waaronder de desbetreffende mechanische reproductie is opgeborgen.


