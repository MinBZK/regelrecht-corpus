  - number: '44'
    text: |-
      1 Ter inschrijving van het instellen van een rechtsvordering of de indiening van een verzoekschrift ter verkrijging
      van een rechterlijke uitspraak die de rechtstoestand van een registergoed betreft, wordt aangeboden een afschrift
      daarvan, getekend door de griffier van het gerecht waar de zaak aanhangig is.

      2 [Artikel 24, tweede tot en met zesde lid][ref1], is niet van toepassing, behoudens dat het aangeboden stuk in
      elk geval de naam en een ter zake van het geding gekozen woonplaats met adres van degene voor wie de aanbieding
      geschiedt, bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel24
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0043565
        artikel: '24'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '45'
    text: |-
      Ter inschrijving van de instelling van een rechtsmiddel tegen een rechterlijke uitspraak als bedoeld in
      [artikel 44][ref1] is dat artikel van overeenkomstige toepassing. Indien het ingestelde rechtsmiddel een beroep in
      cassatie is, wordt aangeboden een door de griffier van het Gemeenschappelijk Hof van Justitie van Curaçao, Aruba,
      Sint Maarten en van Bonaire, Sint Eustatius en Saba of door de griffier van de Hoge Raad der Nederlanden getekende
      verklaring dat beroep in cassatie is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel44
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0043565
        artikel: '44'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '46'
    text: |-
      Ter inschrijving van de waardeloosheid van een overeenkomstig [artikel 44][ref1] of [artikel 45][ref2] verkregen
      inschrijving, kan ook worden aangeboden:

      a. een daartoe strekkende verklaring, afgegeven door een deurwaarder of gemachtigde die optreedt voor de eiser, de
      verzoeker of degene die het rechtsmiddel heeft ingesteld;

      b. een rechterlijke uitspraak die ertoe strekt dat een zodanige inschrijving waardeloos is.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel45
