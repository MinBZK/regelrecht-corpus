        artikel: '43'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '41'
    text: |-
      1 Ter inschrijving van een of meer verklaringen van waardeloosheid als bedoeld in
      [artikel 28 van Boek 3 van het Burgerlijk Wetboek BES][ref1], wordt een door een notaris met inachtneming van
      [artikel 43][ref2] opgemaakte verklaring aangeboden, die inhoudt dat degenen voor wie de inschrijving zou hebben
      gestrekt, schriftelijk hebben verklaard dat zij waardeloos is, en waaraan deze schriftelijke verklaringen zijn
      gehecht, of een authentiek afschrift van de verklaring van de notaris en de daaraan gehechte verklaringen.

      2 Tenzij de inschrijving een hypotheek of een beslag betreft, vermelden de in het eerste lid bedoelde schriftelijke
      verklaringen voor wie de inschrijving zou hebben gestrekt, tevens de feiten waarop de waardeloosheid berust, en
      houdt de in dat lid bedoelde verklaring van de notaris tevens in dat de vermelde feiten een rechtsgrond voor de
      waardeloosheid van de inschrijving opleveren.

      3 Ter inschrijving van een verklaring als bedoeld in [artikel 273 van Boek 3 van het Burgerlijk Wetboek BES][ref3],
      wordt aangeboden die verklaring of een authentiek afschrift daarvan.

      4 Ter inschrijving van een verklaring als bedoeld in [artikel 274 van Boek 3 van het Burgerlijk Wetboek BES][ref4],
      wordt aangeboden de desbetreffende authentieke akte of een authentiek afschrift daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel43
