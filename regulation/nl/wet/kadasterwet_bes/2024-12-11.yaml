    text: |-
      1 De rechthebbende op de grond is verplicht de grenstekens in behoorlijke staat, ter beoordeling van de Kadasters,
      te onderhouden.

      2 Door de Kadasters wordt, indien na schriftelijke aanmaning op een termijn van een maand niet het nodig
      geoordeelde bijzonderlijk omschreven onderhoud is geschied, op kosten van de nalatige daarin voorzien.
