  - number: '10'
    text: |-
      1 De bewaarder is, onverminderd het bepaalde bij of krachtens deze of een andere wet, belast met:

      a. het verrichten van inschrijvingen in de openbare registers en het stellen van aantekeningen in die registers;

      b. het bijwerken van de kadastrale registratie; en

      c. het bijwerken van de registratie voor schepen en de registratie voor luchtvaartuigen.

      2 De bewaarder kan met betrekking tot een of meer van zijn bevoegdheden die hem zijn toegekend bij of krachtens
      deze of een andere wet, mandaat of machtiging verlenen aan een of meer ambtenaren of personen die op basis van een
      privaatrechtelijke overeenkomst werkzaamheden verrichten voor de Kadasters. Verlening van mandaat of machtiging
      behoeft de instemming van het bestuur van de Dienst.

      3 Het bestuur van de Dienst kan richtlijnen en instructies geven aan de bewaarder met betrekking tot:

      a. het verrichten van werkzaamheden en het uitoefenen van bevoegdheden die hem zijn opgedragen onderscheidenlijk
      toegekend bij of krachtens deze of een andere wet, en

      b. de toepassing van het tweede lid, eerste zin.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel10
  - number: '11'
    text: |-
      1 Het bestuur van de Dienst raadpleegt ten minste een maal per kalenderjaar de bestuurscolleges van de openbare
      lichamen over de kwaliteit en de doelmatigheid van de dienstverlening, over toekomstige ontwikkelingen met
      betrekking tot de Kadasters en over andere zaken van gemeenschappelijk belang.

      2 Indien het bestuur van de Dienst voornemens is in zijn beleid wijzigingen aan te brengen die betrekking hebben
      op de in het eerste lid genoemde aangelegenheden, geeft het bestuur aan de bestuurscolleges van de openbare
      lichamen de gelegenheid daarover binnen acht weken na verzending van een verzoek daartoe hun zienswijze naar voren
      te brengen.

      3 De bestuurscolleges van de openbare lichamen kunnen het bestuur van de Dienst daarnaast uit eigen beweging
      schriftelijk in kennis stellen van de binnen de bestuurscolleges levende standpunten over een onderwerp als bedoeld
      in het eerste lid.

      4 Bij ministeriële regeling worden regels gesteld over:

      a. de werkwijze met betrekking tot het raadplegen, bedoeld in het eerste lid,

      b. de wijze waarop een zienswijze als bedoeld in het tweede lid tot stand komt, waaronder in ieder geval het
      betrekken van zienswijzen van personen die gebruiker zijn van de door de Kadasters geleverde diensten, en

      c. het betrekken van de zienswijze bij beleidswijzigingen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel11
  - number: '12'
    text: |-
      1 De openbare registers waarin feiten die voor de rechtstoestand van registergoederen van belang zijn, worden
      ingeschreven, zijn:

      a. de registers van inschrijving van feiten die betrekking hebben op onroerende zaken en de rechten waaraan die
      onderworpen zijn:

      b. de registers van inschrijving van feiten die betrekking hebben op schepen en de rechten waaraan deze onderworpen
      zijn;

      c. de registers van inschrijving van feiten die betrekking hebben op luchtvaartuigen en de rechten waaraan deze
      onderworpen zijn;

      d. het register van voorlopige aantekeningen onderscheidenlijk voor onroerende zaken, schepen en luchtvaartuigen
      en de rechten waaraan deze onderworpen zijn, waarin de aanbieding van stukken waarvan de inschrijving door de
      bewaarder ingevolge [artikel 20 van Boek 3 van het Burgerlijk Wetboek BES][ref1] is geweigerd, wordt aangetekend
      onder vermelding van de gerezen bedenkingen.

      2 Indien naar het oordeel van de bewaarder in de stukken die ter inschrijving worden aangeboden niet genoegzaam
      wordt aangetoond dat het een privéschip betreft, tekent de bewaarder de aanbieding van de stukken aan in het
      register van voorlopige aantekeningen.

      3 Tot de openbare registers behoren ook de openbare registers, bedoeld in de [Wet openbare registers BES][ref2],
      zoals die luidde onmiddellijk voorafgaand aan het tijdstip van de inwerkingtreding van deze wet.

      4 Het bestuur van de Dienst stelt nadere regels vast ter zake van de vorm van de in het eerste lid bedoelde
      registers.

      5 Bij regeling van het bestuur van de Dienst worden, onverminderd het bepaalde in andere wettelijke voorschriften,
      de gevallen vastgesteld waarin in de in het eerste lid bedoelde registers door de bewaarder aantekeningen,
      daaronder begrepen doorhalingen van inschrijvingen in die registers, worden gesteld, de aard van die aantekeningen
      en de wijze waarop deze worden gesteld, zodanig dat:

      a. de doorhaling behoudens in het onder d voorziene geval, slechts geschiedt op grond van de in de desbetreffende
      registers ingeschreven stukken die de bewaarder tot doorhaling machtigen;

      b. na een inschrijving van een stuk dat tot doorhaling machtigt, deze terstond geschiedt;

      c. tenzij ingevolge [artikel 14, eerste lid][ref3], of [artikel 16, zesde lid][ref4], van dat stuk een afschrift in
      de vorm van een mechanische reproductie is vervaardigd, op het stuk door middel waarvan het door te halen feit is
      ingeschreven, wordt vermeld op grond van welk stuk de doorhaling is geschied; en

      d. als ingevolge een wettelijk voorschrift door een beschikking of door de inschrijving van enig stuk met
      betrekking tot een zaak bestaande lasten en rechten vervallen of tenietgaan, na de inschrijving van die beschikking
      of van dat stuk de inschrijvingen betreffende hypotheken en beslagen die door die beschikking, onderscheidenlijk de
      inschrijving van dat stuk, waardeloos zijn geworden, met bekwame spoed worden doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel20
