  - number: '75'
    text: |-
      1 Desgevraagd verleent de bewaarder inzage van de openbare registers, de kadastrale registratie, de registratie
      voor schepen en de registratie voor luchtvaartuigen en geeft hij af of zendt toe voor eensluidend gewaarmerkte
      afschriften of uittreksels van de in deze registers ingeschreven of geboekte stukken, alsmede getuigschriften
      omtrent het al dan niet bestaan van inschrijvingen of voorlopige aantekeningen betreffende een registergoed of
      een persoon.

      2 Het bestuur van de Dienst stelt de vorm van de afschriften, uittreksels en getuigschriften vast, alsmede regels
      omtrent de wijze van raadplegen van de in het eerste lid bedoelde registers.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel75
  - number: '76'
    text: |-
      1 Indien met betrekking tot een registergoed inschrijvingen ter zake van hypotheken en beslagen in de openbare
      registers, bedoeld in [artikel 12, eerste lid, onder a tot en met c][ref1], zijn doorgehaald, wordt op de
      getuigschriften inzake dat registergoed ten aanzien van hypotheken en beslagen melding gemaakt van het feit dat
      doorhaling heeft plaatsgevonden.

      2 Indien met betrekking tot een registergoed in het register van voorlopige aantekeningen, bedoeld in
      [artikel 12 eerste lid, onder d][ref2], voorlopige aantekeningen zijn gesteld die nog niet zijn doorgehaald,
      wordt op de getuigschriften inzake dat registergoed melding gemaakt van die nog niet doorgehaalde voorlopige
      aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel12
