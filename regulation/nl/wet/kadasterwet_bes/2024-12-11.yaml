  - number: '42'
    text: |-
      1 Ter inschrijving van het feit dat het nut van een mandelige zaak voor elk van de erven is geëindigd, wordt een
      door een notaris met inachtneming van [artikel 43][ref1] opgemaakte verklaring aangeboden, inhoudende dat naar de
      verklaring van hen die de inschrijving verlangen, het nut voor elk van de erven is geëindigd, of een authentiek
      afschrift van de verklaring van de notaris. Werken niet alle rechthebbenden op de mandelige zaak mee, dan vermeldt
      de notaris in zijn verklaring de reden daarvan.

      2 Ter inschrijving van het bestaan van een grondrente als bedoeld in
      [artikel 100 van de Overgangswet nieuw Burgerlijk Wetboek BES][ref2], wordt een door een notaris met inachtneming
      van [artikel 43][ref3] opgemaakte verklaring aangeboden, waarin het bestaan van het recht wordt geconstateerd, en
      die tevens inhoudt:

      a. de omschrijving van de inhoud van het recht; en

      b. wie de rechthebbende op dat recht is, met daaraan gehecht de stukken waaruit een en ander blijkt, of authentieke
      afschriften van die verklaring en die stukken.

      3 Ter inschrijving van het ontstaan van een erfdienstbaarheid door bestemming of herleving, bedoeld in
      [artikel 111, eerste zin, van de Overgangswet nieuw Burgerlijk Wetboek BES][ref4], wordt een door een notaris met
      inachtneming van [artikel 43][ref5] opgemaakte verklaring aangeboden, waarin het ontstaan van de erfdienstbaarheid
      wordt geconstateerd, en die tevens inhoudt:

      a. de omschrijving van de inhoud van de erfdienstbaarheid; en

      b. wie de rechthebbende op dat recht is, met daaraan gehecht de stukken waaruit een en ander blijkt, of authentieke
      afschriften van die verklaring en die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel43
