  - number: '92'
    text: |-
      De handelingen van het Kadaster, bedoeld in
      [artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref1], zoals die
      wet luidde onmiddellijk voorafgaand aan de inwerkingtreding van deze wet, met betrekking tot het verrichten
      van de taken, bedoeld in [artikel 2 van die wet][ref2], en de handelingen van de bewaarder, bedoeld in
      [artikel 1 van de Wet openbare registers BES][ref3], zoals die wet luidde onmiddellijk voorafgaand aan de
      inwerkingtreding van deze wet, met betrekking tot het inschrijven van stukken in de openbare registers op grond
      van [artikel 8 van die wet][ref4], die hebben plaatsgevonden tussen 10 oktober 2010 en het tijdstip van de
      inwerkingtreding van deze wet, worden geacht rechtsgeldig verricht te zijn indien het niet rechtsgeldig zijn van
      deze handelingen gelegen is in het enkele feit dat deze handelingen zijn verricht door personen die niet werkzaam
      waren voor het Kadaster, bedoeld in artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte
      rechten BES, zoals die wet luidde onmiddellijk voorafgaand aan de inwerkingtreding van deze wet, maar wel belast
      waren met de taken, bedoeld in artikel 2 van die wet of artikel 8 van de Wet openbare registers BES, zoals die wet
      luidde onmiddellijk voorafgaand aan de inwerkingtreding van deze wet.


