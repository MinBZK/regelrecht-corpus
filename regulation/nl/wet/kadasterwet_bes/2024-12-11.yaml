        bwb_id: BWBR0028215
  - number: '5'
    text: |-
      Het bestuur van de Dienst bepaalt:

      a. op welke plaatsen de Kadasters kantoor houden;

      b. op welke plaatsen en gedurende welke tijden in de openbare lichamen stukken ter inschrijving in de openbare
      registers kunnen worden aangeboden, en

      c. op welke plaatsen en gedurende welke tijden in de openbare lichamen loket wordt gehouden voor het publiek.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel5
  - number: '6'
    text: |-
      De Kadasters hebben, onverminderd het bepaalde in andere wettelijke voorschriften, als doeleinden:

      a. de bevordering van de rechtszekerheid ten aanzien van registergoederen in het:

      1°. rechtsverkeer;

      2°. economisch verkeer;

      3°. bestuurlijk verkeer tussen burgers en bestuursorganen;

      b. de bevordering van een doelmatige geo-informatie-infrastructuur;

      c. een doelmatige informatievoorziening van de overheid ten behoeve van de goede vervulling van publiekrechtelijke
      taken en de nakoming van wettelijke verplichtingen door bestuursorganen, en

      d. ondersteuning en bevordering van de economische activiteiten.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel6
  - number: '7'
    text: |-
      1 De Kadasters hebben, onverminderd het bepaalde in andere wettelijke voorschriften, tot taak:

      a. het houden van de openbare registers;

      b. het houden en bijwerken van de kadastrale registratie;

      c. het in stand houden van een net van coördinaatpunten;

      d.

      e.

      f.

      g. het verstrekken van inlichtingen omtrent gegevens, die de Kadasters hebben verkregen in het kader van de
      uitvoering van de taken, bedoeld onder a tot en met f;

      h. het bevorderen van de toegankelijkheid en de uitwisselbaarheid van gegevens als bedoeld onder a tot en met f;

      i. het vervaardigen en verstrekken van informatie door verwerking van gegevens als bedoeld onder a tot en met f,
      voor zover het vervaardigen en verstrekken van die informatie niet onverenigbaar is met de doeleinden, genoemd
      in [artikel 6][ref1];

      j. het in opdracht van een of meer van Onze Ministers verrichten van werkzaamheden of het aan een of meer van
      Onze Ministers verstrekken van informatie over gegevens als bedoeld onder a tot en met f, ter nakoming van op
      Nederland rustende internationale verplichtingen uit verdragen en overeenkomsten of daarop gebaseerde besluiten
      overeenkomstig die verdragen, overeenkomsten of besluiten, voor zover die de openbare lichamen Bonaire, Sint
      Eustatius of Saba betreffen;

      k. het voor de Dienst houden van loket voor de teboekstelling van andere schepen dan privéschepen in de openbare
      registers, bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref2].

      2 De werkzaamheden, bedoeld in het eerste lid, onder k, vinden plaats onder verantwoordelijkheid van een bewaarder
      van het kadaster en de openbare registers als bedoeld in [artikel 6 van de Kadasterwet][ref3].

      3 Bij algemene maatregel van bestuur kunnen aan de Kadasters andere taken dan genoemd in het eerste lid worden
      opgedragen of marktactiviteiten worden toegestaan, voor zover die taken en marktactiviteiten verband houden met de
      taken, genoemd in het eerste lid, en niet onverenigbaar zijn met de doeleinden, genoemd in [artikel 6][ref4]. Bij
      die algemene maatregel van bestuur kan worden bepaald dat bij ministeriële regeling nadere regels kunnen worden
      gesteld met betrekking tot de uitvoering van de bij die maatregel opgedragen taken of toegestane marktactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel6
