  - number: '36'
    text: |-
      1 Ter inschrijving van de vervulling van een voorwaarde, gesteld in een ingeschreven voorwaardelijke
      rechtshandeling, of van de verschijning van een onzeker tijdstip, aangeduid in de aan een ingeschreven
      rechtshandeling verbonden tijdsbepaling, wordt aangeboden een door een notaris met inachtneming van
      [artikel 43][ref1] opgemaakte verklaring, inhoudende dat naar de verklaring van degene die de inschrijving
      verlangt, de voorwaarde is vervuld, onderscheidenlijk het tijdstip is verschenen, met daaraan gehecht de stukken
      waaruit van deze vervulling of verschijning blijkt, of authentieke afschriften van de verklaring van de notaris en
      van die stukken.

      2 Het eerste lid is van overeenkomstige toepassing op de inschrijving van de dood van de vruchtgebruiker van een
      registergoed. De verklaring van de notaris houdt in dit geval tevens in:

      a. het tijdstip van overlijden van de vruchtgebruiker; en

      b. of het vruchtgebruik is vervallen of bij wie het vruchtgebruik na de dood van de vruchtgebruiker is verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel43
