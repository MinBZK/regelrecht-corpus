  - number: '80'
    text: |-
      [Artikel 27 van de Wet bescherming persoonsgegevens BES][ref1] is niet van toepassing ingeval de verstrekking van
      inlichtingen ingevolge dit hoofdstuk persoonsgegevens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel27
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel80
