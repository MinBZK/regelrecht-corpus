  - number: '13'
    text: |-
      1 Het bestuur van de Dienst draagt zorg dat de openbare registers zodanig duurzaam worden bewaard dat de inhoud
      ervan naar de eisen van openbaarheid binnen redelijke termijn voor raadpleging beschikbaar is.

      2 De inhoud van de openbare registers kan worden gehouden op papieren, elektronische of andere gegevensdragers.

      3 Het bestuur van de Dienst kan ten aanzien van door hem aan te wijzen openbare registers of gedeelten ervan,
      de inhoud overbrengen op andere gegevensdragers van dezelfde of een andere soort, mits de overbrenging geschiedt
      met juiste en volledige weergave van alle desbetreffende gegevens, ter waarborging waarvan het bestuur van de
      Dienst passende maatregelen ten uitvoer legt. Het bestuur van de Dienst kan bepalen dat meer dan een duplicaat
      van dezelfde of een andere soort als bedoeld in de eerste zin wordt vervaardigd. Het bestuur van de Dienst draagt
      in elk geval zorg dat van de openbare registers zo spoedig mogelijk ten minste een duplicaat in dubbel aanwezig
      is, waarbij het bestuur rekening houdt met de stand van de techniek, de kosten van tenuitvoerlegging en de
      desbetreffende risico’s.

      4 Het bestuur van de Dienst kan bepalen dat een ingevolge het derde lid vervaardigd duplicaat de inhoud vervangt
      van de openbare registers of gedeelten ervan waarvan dat duplicaat een afschrift is.

      5 De duplicaten, bedoeld in het derde en vierde lid, hebben dezelfde bewijskracht als de inhoud van de registers
      die is geplaatst op de oorspronkelijke gegevensdragers onderscheidenlijk als de oorspronkelijke inhoud van de
      registers.

      6 Van elke vervaardiging van een duplicaat en vervanging als bedoeld in het derde onderscheidenlijk vierde
      lid wordt een verklaring opgemaakt, die ten minste een specificatie bevat van de desbetreffende vervaardiging
      onderscheidenlijk vervanging, en aangeeft op grond waarvan zij is geschied. Het bestuur van de Dienst stelt de vorm
      van de verklaring vast, en wanneer en door wie zij wordt opgemaakt en ondertekend.

      7 Het bestuur van de Dienst stelt met inachtneming van het eerste tot en met zesde lid nadere regels omtrent
      de wijze waarop de openbare registers worden gehouden. Daarbij wordt in elk geval geregeld de wijze waarop voor
      gebruik niet langer geschikte of beschikbare duplicaten als bedoeld in het derde lid worden vervangen door nieuwe
      duplicaten.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel13
  - number: '14'
    text: |-
      1 Het bestuur van de Dienst kan bepalen dat de inhoud van de registers, bedoeld in [artikel 12, eerste lid][ref1],
      wordt vervangen door afschriften daarvan in tweevoud in de vorm van door de bewaarder vervaardigde mechanische
      reproducties.

      2 Het bestuur van de Dienst bepaalt de wijze waarop de vervanging, bedoeld in het eerste lid, geschiedt.

      3 De reproducties, bedoeld in het eerste lid, hebben dezelfde bewijskracht als de oorspronkelijke inhoud van de
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel12
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel14
