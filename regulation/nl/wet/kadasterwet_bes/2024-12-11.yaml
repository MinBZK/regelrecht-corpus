  - number: '74'
    text: |-
      1 Na de inschrijving, bedoeld in [artikel 73, vijfde lid][ref1], wordt de kadastrale registratie met bekwame spoed
      vernieuwd op de voet van de akte van vernieuwing.

      2 Zij die volgens de akte van vernieuwing rechthebbende zijn op een daarin opgenomen onroerende zaak
      of recht dat geen recht van hypotheek is, gelden voor de toepassing van de verjaring, bedoeld in
      [artikel 99 van Boek 3 van het Burgerlijk Wetboek BES][ref2], met ingang van de dag van de inschrijving als
      bezitter te goeder trouw van die zaak of dat recht zoals zij in de akte worden omschreven.

      3 De in [artikel 106 van Boek 3 van het Burgerlijk Wetboek BES][ref3] bedoelde rechtsvordering van een beperkt
      gerechtigde, wiens recht niet in de akte van vernieuwing is opgenomen, verjaart in elk geval door verloop van tien
      jaren na de dag van de inschrijving van deze akte.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel99
