  - number: '89'
    text: |-
      1 [Artikel 30 van Boek 3 van het Burgerlijk Wetboek BES][ref1], zoals het luidde vóór het tijdstip van
      inwerkingtreding van deze wet, blijft van toepassing met betrekking tot aansprakelijkheid en schadevergoeding ter
      zake van in dat artikel bedoelde feiten die zich hebben voorgedaan vóór dat tijdstip.

      2 Het desbetreffende openbare lichaam blijft aansprakelijk voor schade veroorzaakt door vergissingen,
      verzuimen of andere onregelmatigheden die zich hebben voorgedaan vóór de inwerkingtreding
      van deze wet met betrekking tot het verrichten van de taken door het Kadaster, bedoeld in
      [artikel 2 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref2], zoals die wet luidde
      onmiddellijk voorafgaand aan de inwerkingtreding van deze wet.


