  - number: '73'
    text: |-
      1 Voor zover tegen een voorstel van vernieuwing geen, of niet tijdig, bezwaren zijn ingediend, de beschikking
      in heroverweging onherroepelijk is geworden of het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en
      Saba uitspraak heeft gedaan, wordt door een daartoe door de Dienst aangewezen notaris een akte van vernieuwing
      opgemaakt. De akte wordt door de Dienst ondertekend.

      2 Een akte van vernieuwing kan op een of meer voorstellen van vernieuwing betrekking hebben. De akte bevat ten
      aanzien van elke onroerende zaak waarop de vernieuwing betrekking heeft, het relaas van bevindingen, de inhoud van
      het voorstel van vernieuwingen en, ingeval er onherroepelijk in heroverweging is beschikt of door het Gerecht in
      eerste aanleg van Bonaire, Sint Eustatius en Saba uitspraak is gedaan, die beslissing of uitspraak. Bescheiden die
      tijdens het onderzoek aan de met het onderzoek van vernieuwing belaste ambtenaar worden overgelegd, worden in de
      akte vermeld en daaraan in afschrift gehecht.

      3 Tevens worden overeenkomstig door het bestuur van de Dienst vast te stellen regels aan de voet van de akte van
      vernieuwing ten aanzien van elke onroerende zaak waarop de vernieuwing betrekking heeft, afzonderlijk vermeld de
      in [artikel 72, derde lid][ref1], bedoelde bijhoudingen alsmede die bijhoudingen, als die hebben plaatsgevonden,
      welke zich hebben voorgedaan tussen het tijdstip van de dagtekening van het voorstel van vernieuwing en dat van de
      dagtekening van de akte van vernieuwing.

      4 Een bezwaar of beroep ter zake van een bijhouding als bedoeld in het derde lid kan op verzoek van de
      belanghebbende gevoegd worden behandeld met bezwaren of beroepen ter zake van een voorstel van vernieuwing. De
      behandeling kan op verzoek van de belanghebbende ook worden aangehouden tot na het verlijden van de akte van
      vernieuwing.

      5 De akte van vernieuwing wordt ingeschreven in de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel72
