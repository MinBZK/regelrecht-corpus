preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat de kadasterfunctie die ondergebracht is bij de
    openbare lichamen Bonaire, Sint Eustatius en Saba onder de verantwoordelijkheid van de Dienst voor het kadaster en
    de openbare registers komt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#ArtikelAanhef
articles:
  - number: '1'
    text: Deze wet is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel1
  - number: '2'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *bewaarder:* bewaarder als bedoeld in [artikel 9][ref1];
        - *Dienst:* Dienst voor het kadaster en de openbare registers als bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref2];
        - *Kadasters:* onderdelen van de Dienst als bedoeld in [artikel 3][ref3];
        - *kadastrale registratie:* registratie als bedoeld in [artikel 55, eerste lid][ref4], en de kadastrale kaart van
      een openbaar lichaam, bedoeld in artikel 55, derde lid;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *openbare registers:* openbare registers als bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek BES][ref5];
        - *privéschip:* visserijvaartuig, plezierjacht of ander vaartuig bestemd voor privédoeleinden;
        - *registratie voor luchtvaartuigen:* registratie als bedoeld in [artikel 58, eerste lid][ref6];
        - *registratie voor schepen:* registratie als bedoeld in [artikel 56, eerste lid][ref7].

      2 De begripsomschrijvingen, opgenomen in de [artikelen 1][ref8], [2][ref9], [3, eerste lid][ref10],
      [8][ref11] en [10 van Boek 3][ref12], en de [artikelen 1][ref13], [2][ref14], [3a][ref15] en
      [190 van Boek 8 van het Burgerlijk Wetboek BES][ref16], gelden ook voor deze wet.


