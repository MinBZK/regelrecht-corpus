      1 Bijwerking vindt plaats als bijhouding.

      2 Bijwerking van de kadastrale registratie vindt tevens plaats als vernieuwing.

      3 Het bestuur van de Dienst kan regels stellen omtrent de bijhouding van de in de kadastrale registratie, de
      registratie voor schepen en de registratie voor luchtvaartuigen op te nemen gegevens.
