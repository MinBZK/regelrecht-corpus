      [ref4]: https://wetten.overheid.nl/BWBR0028745#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0043565#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0043565#Artikel24
