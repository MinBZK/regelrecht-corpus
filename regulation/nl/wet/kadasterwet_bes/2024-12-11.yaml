  - number: '40'
    text: |-
      Ter inschrijving van een verjaring, wordt een door een notaris met inachtneming van [artikel 43][ref1] opgemaakte
      verklaring of een authentiek afschrift daarvan aangeboden, inhoudende dat naar de verklaring van degene die de
      inschrijving verlangt, de verjaring is ingetreden, alsmede:

      a. welk registergoed door verjaring is verkregen, of welk beperkt recht op een registergoed is tenietgegaan;

      b. tegen wie de verjaring werkt, indien dit bekend is;

      c. welke feiten tot de verjaring hebben geleid; en

      d. dat de verjaring wordt betwist of niet wordt betwist door degene tegen wie zij werkt, als dit bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel43
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel40
