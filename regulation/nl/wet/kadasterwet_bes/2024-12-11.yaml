  - number: '3'
    text: |-
      In ieder van de openbare lichamen is een onderdeel van de Dienst aanwezig, belast met de uitvoering van de taken,
      bedoeld in [artikel 7][ref1]. Deze onderdelen ressorteren onder het bestuur van de Dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel7
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel3
