        bwb_id: BWBR0028067
        artikel: '27'
  - number: '81'
    text: |-
      Ter bescherming van de persoonlijke levenssfeer van personen die in de kadastrale registratie, de registratie voor
      schepen en in de registratie voor luchtvaartuigen vermeld staan, kunnen bij of krachtens algemene maatregel van
      bestuur voor een daarbij aangewezen soort of daarbij aangewezen soorten van persoonsgegevens beperkingen worden
      gesteld ten aanzien van de verstrekking van inlichtingen als bedoeld in de [artikelen 75 tot en met 79][ref1].
      Daarbij kunnen tevens regels worden gesteld voor de behandeling van verzoeken tot afscherming van persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel75
