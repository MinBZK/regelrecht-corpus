  - number: '39'
    text: |-
      1 Ter inschrijving van een verandering in de voornaam of de geslachtsnaam van tot registergoederen gerechtigde
      natuurlijke personen, wordt een door of namens deze persoon ondertekend stuk aangeboden, inhoudende de gegevens,
      bedoeld in [artikel 24, eerste lid, onder a][ref1], met vermelding van de oude en de nieuwe naam of voornaam,
      en de dag waarop de verandering is ingegaan. Indien de verandering blijkt uit de registers van de burgerlijke
      stand, wordt een uittreksel daaruit overgelegd, dat de verandering relateert. In andere gevallen wordt een ander
      bewijsstuk betreffende deze verandering overgelegd.

      2 Ter inschrijving van de naamsverandering van een rechtspersoon, wordt een opgave van een notaris aangeboden,
      inhoudende de gegevens, bedoeld in [artikel 24, eerste lid, onder b][ref2], met vermelding van de oude en de nieuwe
      naam en de dag waarop de verandering is ingegaan. Indien het een publiekrechtelijke rechtspersoon betreft, kan deze
      de opgave zelf doen.

      3 Ter inschrijving van een omzetting van een rechtspersoon als bedoeld in
      [artikel 300 van Boek 2 van het Burgerlijk Wetboek BES][ref3], wordt een opgave van een notaris aangeboden,
      inhoudende de in [artikel 24, eerste lid, onder b][ref4], bedoelde gegevens, met vermelding van de oude en nieuwe
      rechtsvorm, de oude en nieuwe naam alsmede van de dag waarop de omzetting van kracht is geworden.

      4 Ter inschrijving van een fusie van rechtspersonen als bedoeld in
      [artikel 309 van Boek 2 van het Burgerlijk Wetboek BES][ref5], wordt een opgave van een notaris aangeboden,
      inhoudende met betrekking tot elk van de fuserende rechtspersonen en, als de verkrijgende rechtspersoon een door
      hen samen bij de fusie opgerichte nieuwe rechtspersoon is, tevens met betrekking tot die rechtspersoon de in
      [artikel 24, eerste lid, onder b][ref6], bedoelde gegevens, met vermelding wie de verkrijgende rechtspersoon is
      alsmede van de dag waarop de fusie van kracht is geworden.

      5 Ter inschrijving van een splitsing van rechtspersonen als bedoeld in
      [artikel 335 van Boek 2 van het Burgerlijk Wetboek BES][ref7], wordt een opgave van een notaris aangeboden,
      inhoudende met betrekking tot elke partij bij de splitsing en, als bij de splitsing verkrijgende rechtspersonen
      worden opgericht, tevens met betrekking tot die rechtspersonen de in [artikel 24, eerste lid, onder b][ref8],
      bedoelde gegevens, met vermelding op welke verkrijgende rechtspersoon welke registergoederen zijn overgegaan
      alsmede van de dag waarop de splitsing van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel24
