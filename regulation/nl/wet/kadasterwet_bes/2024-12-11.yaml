    text: |-
      Op de inschrijving van reglementen en andere regelingen die tussen medegerechtigden in registergoederen zijn
      vastgesteld, zijn van overeenkomstige toepassing:

      a. voor zover het reglement of de regeling door de rechter is vastgesteld: [artikel 31][ref1];

      b. voor zover het reglement of de regeling bij rechtshandeling is vastgesteld:
      [artikel 33, eerste en derde lid][ref2].


