        artikel: '7'
        hoofdstuk: '1'
  - number: '78'
    text: |-
      Het bestuur van de Dienst stelt vast:

      a. de vorm van de afschriften, uittreksels en getuigschriften, bedoeld in de [artikelen 75 tot en met 77][ref1],
      alsmede de gevallen waarin de Kadasters getuigschriften opmaken;

      b. de wijze en plaats van raadpleging van de openbare registers, de kadastrale registratie en de aan de kadastrale
      kaart ten grondslag liggende bescheiden, de registratie voor schepen en andere documenten betreffende privéschepen,
      de registratie voor luchtvaartuigen en andere documenten betreffende luchtvaartuigen, de geografische gegevens en
      de aan die gegevens ten grondslag liggende bescheiden;

      c. de wijze waarop de waarmerking, bedoeld in [artikel 75, eerste lid][ref2], van in papieren vorm te verstrekken
      afschriften, uittreksels en getuigschriften als bedoeld in dat artikel plaatsvindt;

      d. de wijze waarop in elektronische vorm te verstrekken afschriften, uittreksels en getuigschriften als bedoeld in
      [artikel 75, eerste lid][ref3], worden gewaarmerkt, waartoe zij ten minste worden voorzien van een elektronische
      handtekening van de bewaarder en welke waarmerking wat betreft afschriften en uittreksels mede omvat de waarmerking
      voor eensluidendheid;

      e. de wijze waarop inlichtingen over het net van coördinaatpunten worden verstrekt, en

      f. de wijze waarop inlichtingen over geografische gegevens worden verstrekt en de wijze waarop inzage wordt
      verleend van de aan die geografische gegevens ten grondslag liggende bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0043565#Artikel75
