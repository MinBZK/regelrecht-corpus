  - number: '33'
    text: |-
      1 Ter inschrijving van erfopvolgingen die registergoederen betreffen, wordt een door een notaris opgemaakte
      verklaring van erfrecht, of een authentiek afschrift van de verklaring van de notaris aangeboden, waaruit van de
      erfopvolging blijkt.

      2 Ter inschrijving van een executele of een bij uiterste wilsbeschikking ingesteld bewind wordt een door een
      notaris opgemaakte verklaring van erfrecht of een authentiek afschrift van de verklaring van de notaris aangeboden,
      waaruit van deze executele, onderscheidenlijk van dit bewind blijkt.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel33
  - number: '34'
    text: |-
      Ter inschrijving van de aanvaarding van een nalatenschap onder voorrecht van boedelbeschrijving of
      van de verwerping van een nalatenschap, wordt een door de griffier getekende verklaring aangeboden,
      inhoudende de verklaring betreffende de aanvaarding of verwerping die krachtens [artikel 1055][ref1] of
      [artikel 1083 van Boek 4 van het Burgerlijk Wetboek BES][ref2] ter griffie is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1055
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1083
