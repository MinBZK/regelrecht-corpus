  - number: '77'
    text: |-
      1 Desgevraagd verstrekken de Kadasters inlichtingen over het net van coördinaatpunten.

      2 Desgevraagd verstrekken de Kadasters inlichtingen over de geografische gegevens, bedoeld in
      [artikel 7, eerste lid, onder d][ref1], en verlenen de Kadasters inzage van de daaraan ten grondslag liggende
      bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel7
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel77
