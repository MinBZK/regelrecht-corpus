    text: |-
      Ter inschrijving van de afstand van een huwelijksgemeenschap, wordt een door de griffier getekend uittreksel
      uit het huwelijksgoederenregister aangeboden, inhoudende de verklaring betreffende de afstand, die krachtens
      [artikel 104 van Boek 1 van het Burgerlijk Wetboek BES][ref1] in het huwelijksgoederenregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel104
