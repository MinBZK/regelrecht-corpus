  - number: '84'
    text: |-
      1 De Dienst is jegens belanghebbenden aansprakelijk voor de schade die zij lijden doordat in strijd met de wet een
      inschrijving is geweigerd of geschied.

      2 De Dienst is eveneens aansprakelijk voor alle verdere vergissingen, verzuimen, vertragingen of andere
      onregelmatigheden van zijn ambtenaren, gepleegd bij het houden van de openbare registers of bij het opmaken of
      afgeven van afschriften, uittreksels en getuigschriften.

      3 De Dienst is jegens belanghebbenden aansprakelijk voor vergissingen, verzuimen of andere onregelmatigheden door
      de Dienst begaan bij het bijwerken van en het verstrekken van inlichtingen uit de kadastrale registratie en de aan
      de kadastrale kaart ten grondslag liggende bescheiden, alsmede de registratie voor schepen en de registratie voor
      luchtvaartuigen.

      4 De Dienst is aansprakelijk voor schade die is veroorzaakt door een vergissing, verzuim of een andere
      onregelmatigheid door hem begaan bij:

      a. het in stand houden van geografische gegevens, bedoeld in [artikel 7, eerste lid, onder d][ref1]; en

      b. het in papieren vorm en in elektronische vorm verstrekken van inlichtingen omtrent de geografische gegevens,
      bedoeld in [artikel 7, eerste lid, onder d][ref2].

      5 Het bestuur van de Dienst kan regels stellen met betrekking tot de aansprakelijkheid voor de gevolgen van
      storingen in de middelen die de Dienst gebruikt bij elektronische gegevensuitwisseling als bedoeld in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel7
