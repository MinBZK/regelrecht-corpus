      1 Van aan de bewaarder uitgebrachte oproepingen, als bedoeld in
      [artikel 20, vierde lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1], en van uitspraken van de rechter in
      eerste aanleg, aangespannen ter verkrijging van het in artikel 20, tweede lid, van Boek 3 van dat wetboek bedoelde
      bevel, wordt aantekening gehouden in het desbetreffende register van voorlopige aantekeningen overeenkomstig door
      het bestuur van de Dienst daartoe vast te stellen regels.

      2 Het bestuur van de Dienst stelt voorts regels vast omtrent de wijze waarop in het register van voorlopige
      aantekeningen de in [artikel 21, eerste lid][ref2], bedoelde boeking geschiedt, alsmede omtrent de wijze van
      doorhaling van voorlopige aantekeningen.

      3 Het eerste lid is van overeenkomstige toepassing ten aanzien van oproepingen uitgebracht aan de bewaarder
      ter verkrijging van een bevel van de rechter tot inschrijving van een notariële verklaring, bedoeld in
      [artikel 43, eerste lid, onder c][ref3]. Het tweede lid is van overeenkomstige toepassing ten aanzien van de in
      artikel 43, tweede lid, eerste zin, bedoelde boeking en de doorhaling van een zodanige boeking in het register van
      voorlopige aantekeningen.


