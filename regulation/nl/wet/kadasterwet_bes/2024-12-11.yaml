      1 Een persoon als bedoeld in [artikel 63, eerste lid][ref1], draagt bij het verrichten van werkzaamheden als
      bedoeld in dat artikel een legitimatiebewijs bij zich, dat is uitgegeven door het bestuur van de Dienst, en toont
      zijn legitimatiebewijs desgevraagd terstond.

      2 Het legitimatiebewijs bevat een foto van de betrokken persoon en vermeldt in elk geval zijn naam en hoedanigheid.

      3 Het model van het legitimatiebewijs wordt vastgesteld bij regeling van het bestuur van de Dienst.


