    text: |-
      1 Op de inschrijving van een feit, waarvan de inschrijving alsnog is bevolen overeenkomstig
      [artikel 20, tweede lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1] of opnieuw is verzocht, als bedoeld in
      artikel 20, vierde lid, tweede zin, van Boek 3 van dat wetboek, zijn de [artikelen 16 tot en met 19][ref2] van
      toepassing, voor zover daarvan in dit artikel niet wordt afgeweken.

      2 Voor een inschrijving als bedoeld in het eerste lid wordt vereist het oorspronkelijk aangeboden stuk dat is
      voorzien van de in [artikel 21, tweede lid][ref3], bedoelde verklaring.

      3 De inschrijving geschiedt, tenzij [artikel 16, zevende lid][ref4], toepassing heeft gevonden, door doorhaling van
      de voorlopige aantekening en door vermelding daarbij van het deel en nummer, bedoeld in [artikel 19][ref5].

      4 [Artikel 19][ref6] is van overeenkomstige toepassing, met dien verstande dat de bewaarder op het ingeschreven
      stuk eveneens van doorhaling van de voorlopige aantekening melding maakt overeenkomstig door het bestuur van de
      Dienst daartoe vast te stellen regels.


