      De kadastrale registratie omvat mede het kadaster, bedoeld in
      [artikel 1a, eerste lid, van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref1], zoals
      die wet luidde onmiddellijk voorafgaand aan het tijdstip van de inwerkingtreding van deze wet, voor zover zij
      betrekking heeft op gebouwde en ongebouwde eigendommen in het betreffende openbaar lichaam.


