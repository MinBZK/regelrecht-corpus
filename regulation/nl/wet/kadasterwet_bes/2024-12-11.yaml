  - number: '24'
    text: |-
      1 Onverminderd de overige uit deze titel voortvloeiende eisen, moet een ter inschrijving aangeboden notariële akte,
      notariële verklaring of authentiek afschrift of uittreksel van een zodanige akte of verklaring vermelden:

      a. naam, voornamen, geboortedatum en -plaats, woonplaats met adres en burgerlijke staat van de natuurlijke personen
      die blijkens het aangeboden stuk daarbij als partij zijn opgetreden;

      b. aard, naam en woonplaats met adres van de rechtspersonen die blijkens het aangeboden stuk daarbij als partij
      zijn opgetreden;

      c. dezelfde gegevens, behoudens de burgerlijke staat, ten aanzien van natuurlijke personen en rechtspersonen die
      blijkens het aangeboden stuk de voormelde partijen hebben vertegenwoordigd, alsmede de grond van hun bevoegdheid.

      2 Als opgave van een of meer van de in het eerste lid genoemde gegevens niet mogelijk is, worden de redenen daarvan
      vermeld.

      3 Andere ter inschrijving aangeboden stukken vermelden, zo mogelijk, dezelfde gegevens als in het eerste lid
      omschreven, tenzij anders voortvloeit uit hetgeen de wet voor een stuk van de aard als waarom het gaat, ten aanzien
      van de vermelding van voornamen, namen en woonplaatsen voorschrijft.

      4 In elk geval worden de in het eerste lid omschreven gegevens opgegeven van de partij ten behoeve van wie de
      aanbieding ter inschrijving geschiedt. Als het ter inschrijving aangeboden stuk een of meer van deze gegevens niet
      vermeldt en naar zijn aard niet voor aanvulling vatbaar is, wordt vermelding van de ontbrekende gegevens en, als
      opgave van een of meer van deze gegevens niet mogelijk is, de vermelding van de redenen daarvan in een nadere door
      of namens die partij ondertekende verklaring alsnog op het stuk gesteld of daaraan gehecht.

      5 Als een partij geen woonplaats heeft in het openbaar lichaam, waarin de inschrijving of teboekstelling
      plaatsvindt, kiest de partij ter zake van de inschrijving in dat openbaar lichaam een woonplaats.

      6 Indien een partij in een ter inschrijving aangeboden stuk woonplaats heeft gekozen in het openbaar lichaam,
      waarin de inschrijving of teboekstelling plaatsvindt, wordt niettemin daarin ook de wettelijke woonplaats met adres
      vermeld.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel24
  - number: '25'
    text: |-
      Ingeval het ter inschrijving aangeboden stuk betrekking heeft op een bepaald reeds eerder ingeschreven stuk, bevat
      het een verwijzing naar dit eerdere stuk overeenkomstig bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel25
  - number: '26'
    text: |-
      1 Indien een stuk ter inschrijving wordt aangeboden en het daarin vermelde in te schrijven feit betrekking heeft
      op een onroerende zaak of op een recht waaraan een zodanige zaak is onderworpen, vermeldt dit stuk de aard, de
      plaatselijke aanduiding als deze er is, en de kadastrale aanduiding van die onroerende zaak onderscheidenlijk van
      de onroerende zaak die aan dat recht is onderworpen, dan wel indien die aanduiding ontbreekt een meetbrief, zijnde
      een verklaring van een daartoe bevoegde ambtenaar betreffende de grenzen en maatvoering van een nieuw gevormd
      perceel.

      2 Indien het in te schrijven feit betrekking heeft op een appartementsrecht, wordt in het ter inschrijving
      aangeboden stuk vermeld de plaatselijke aanduiding van het desbetreffende gedeelte van het gebouw dat is bestemd om
      als afzonderlijk geheel te worden gebruikt, alsmede de aard en de kadastrale aanduiding van dat appartementsrecht.

      3 Het bestuur van de Dienst kan regels vaststellen omtrent de wijze waarop de plaatselijke aanduiding, bedoeld in
      het eerste en tweede lid, in het ter inschrijving aangeboden stuk wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel26
  - number: '27'
    text: |-
      1 Indien het in te schrijven feit betrekking heeft op een in de registratie voor schepen te boek staand privéschip
      of op een recht waaraan een zodanige zaak is onderworpen, bevat het ter inschrijving aangeboden stuk:

      a. de naam van het privéschip met vermelding van het gebruik waartoe het is bestemd, en de bruto-inhoud of het
      bruto-tonnage van het privéschip;

      b. het type en de inrichting van het privéschip, het materiaal waarvan de romp is gemaakt, jaar en plaats van
      de bouw, en, voor zover het een privéschip met een mechanische voortstuwing betreft, ook al betreft het slechts
      een hulpmotor, het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer
      daarvan met aanduiding van de plaats waar dit nummer is aangebracht;

      c. het nummer waaronder de inschrijving van het verzoek tot teboekstelling van het privéschip in het desbetreffende
      register is geschied, de door de Kadasters vastgestelde afkorting van een privéschip ter onderscheiding van
      andere schepen dan privéschepen, de aanduiding van het kantoor waar de teboekstelling is geschied, en het jaar van
      teboekstelling, welke gegevens tezamen in genoemde volgorde het brandmerk van het privéschip vormen.

      2 Het eerste lid is niet van toepassing op ter inschrijving aangeboden rechterlijke uitspraken. Deze stukken
      kunnen, onverminderd andere vereisten gesteld bij of krachtens de wet, echter slechts worden ingeschreven, indien
      en voor zover de identiteit van het desbetreffende privéschip voldoende vaststaat.

      3 In afwijking van het eerste lid kan worden volstaan met het vermelden van de naam van het privéschip en de in het
      eerste lid, onder c, genoemde gegevens in het ter inschrijving aangeboden stuk, indien dat stuk betreft:

      a. de doorhaling van de teboekstelling van een schip, bedoeld in
      [artikel 195, eerste lid, van Boek 8 van het Burgerlijk Wetboek BES][ref1];

      b. de aangifte van de eigenaar inhoudende dat het privéschip een wijziging heeft ondergaan waardoor de beschrijving
      van het privéschip in de registratie voor privéschip niet meer aan de werkelijkheid beantwoordt;

      c. een afwijkend beding als bedoeld in [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek BES][ref2], of

      d. de verandering van een door de eigenaar van een privéschip in een ingeschreven stuk gekozen woonplaats.

      4 Het derde lid, aanhef, is van overeenkomstige toepassing op de inschrijving van stukken als bedoeld in de
      [artikelen 38, eerste lid][ref3], [44, eerste lid][ref4], en [45][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel195
