  - number: '94'
    text: |-
      1 Onze Minister bepaalt welke vermogensbestanddelen van de openbare lichamen of het Kadaster, bedoeld in
      [artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref1], zoals die wet luidde
      onmiddellijk voorafgaand aan de inwerkingtreding van deze wet, worden toebedeeld aan de Dienst.

      2 De in het eerste lid bedoelde vermogensbestanddelen gaan op het tijdstip van inwerkingtreding van deze wet onder
      algemene titel over op de Dienst tegen een door Onze Minister te bepalen waarde.

      3 Ingeval krachtens het eerste en het tweede lid registergoederen overgaan, doet Onze
      Minister de overgang van die registergoederen onverwijld inschrijven in de openbare
      registers, bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek BES][ref2].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek BES][ref3] is niet van toepassing.


