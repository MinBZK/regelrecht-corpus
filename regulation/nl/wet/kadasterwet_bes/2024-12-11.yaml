  - number: '38'
    text: |-
      1 Ter inschrijving van een proces-verbaal van inbeslagneming, wordt dit proces-verbaal of een door de deurwaarder
      of een advocaat getekend afschrift daarvan aangeboden. [Artikel 24, derde tot en met zesde lid][ref1], is niet
      van toepassing.

      2 Ingeval een proces-verbaal van inbeslagneming van een luchtvaartuig in het buitenland is opgemaakt door een
      deurwaarder of andere volgens de daar geldende wet hiertoe bevoegde persoon, kan ook een zodanig proces-verbaal ter
      inschrijving worden aangeboden.

      3 Ter inschrijving van een van de in [artikel 211 van Boek 8 van het Burgerlijk Wetboek BES][ref2] genoemde
      voorrechten, wordt aangeboden een door een deurwaarder ondertekend verzoek tot inschrijving van het voorrecht,
      inhoudende naar de verklaring van degene die de inschrijving verlangt:

      a. de aanduiding van de desbetreffende vordering;

      b. het beloop van de vordering ten tijde van het ondertekenen door de deurwaarder van het verzoek of van de feiten
      aan de hand waarvan die vordering zal kunnen worden bepaald;

      c. de omschrijving van het voorrecht door vermelding van het wettelijk voorschrift, op grond waarvan aan die
      vordering het voorrecht is toegekend; en

      d. het tijdstip waarop de vordering is ontstaan.

      4 Indien het verzoek van de deurwaarder ter inschrijving wordt aangeboden na het verloop van de termijn, genoemd
      in [artikel 219, eerste lid, van Boek 8 van het Burgerlijk Wetboek BES][ref3], wordt ter inschrijving tevens
      aangeboden een stuk waaruit blijkt dat de schuldeiser zijn vordering binnen die termijn in rechte heeft geldend
      gemaakt, op de inschrijving van welk bewijsstuk [artikel 44][ref4] van overeenkomstige toepassing is.

      5 Op de inschrijving van een voorrecht als bedoeld in
      [artikel 1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek BES][ref5] is het derde lid van overeenkomstige
      toepassing. Indien het verzoek van de deurwaarder ter inschrijving wordt aangeboden drie maanden of langer na het
      in dat lid, onder d, bedoelde tijdstip, wordt ter inschrijving tevens aangeboden een stuk waaruit blijkt dat binnen
      de in artikel 1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek BES genoemde termijn:

      a. het bedrag van de vordering in der minne is vastgesteld; of

      b. langs gerechtelijke weg erkenning van het voorrecht en de omvang ervan is gevorderd, op de inschrijving van welk
      bewijsstuk [artikel 44][ref6] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel24
