    text: |-
      Indien een ter inschrijving aangeboden stuk niet een of meer van de gegevens die in de
      [artikelen 25 tot en met 28][ref1] voor een zodanig stuk zijn voorgeschreven vermeldt en het naar zijn aard niet
      voor aanvulling vatbaar is, wordt de vermelding van de ontbrekende gegevens in een nadere, door degene die de
      inschrijving verlangt ondertekende, verklaring alsnog op het stuk gesteld of daaraan gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel25
