  - number: '17'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat de in [artikel 18][ref1] bedoelde stukken in elektronische vorm
      kunnen worden aangeboden, voorzien van een elektronische handtekening.

      2 Bij regeling van het bestuur van de Dienst wordt bepaald:

      a. aan welke vereisten de stukken in elektronische vorm moeten voldoen;

      b. onder welke voorwaarden elektronische aanlevering van deze stukken kan plaatsvinden;

      c. dat de aanbieder van het stuk een verklaring toevoegt dat het aangeboden stuk inhoudelijk een volledige en
      juiste weergave is van de inhoud van het stuk waarvan het een afschrift is onderscheidenlijk van de desbetreffende
      gedeelten van het stuk waarvan het een uittreksel is;

      d. wiens elektronische handtekening is vereist, en

      e. op welke wijze de inschrijving van stukken in elektronische vorm geschiedt en welke aantekeningen op de stukken
      in elektronische vorm worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel18
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0043565
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '18'
    text: |-
      1 De inschrijving geschiedt door het in bewaring nemen van het afschrift van het stuk, bedoeld in
      [artikel 16, eerste lid][ref1].

      2 De afschriften van de stukken worden zo veel mogelijk gerangschikt in de volgorde waarin zij ter inschrijving
      zijn aangeboden, met vermelding van het tijdstip waarop deze aanbieding is geschied.

      3 Het bestuur van de Dienst stelt nadere regels vast omtrent de rangschikking en de wijze van opberging van de
      afschriften.

      4 Indien [artikel 16, zesde lid][ref2], toepassing heeft gevonden, geschiedt de inschrijving in afwijking van het
      eerste lid door de vervaardiging van het afschrift in tweevoud, bedoeld in dat lid. Het tweede en derde lid zijn
      dan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel16
