  - number: '31'
    text: |-
      1 Ter inschrijving van een rechterlijke uitspraak die voor een akte van levering in de plaats treedt of die
      anderszins op grond van een wettelijke bepaling kan worden ingeschreven, wordt een expeditie van de rechterlijke
      uitspraak aangeboden, alsmede:

      a. indien de rechterlijke uitspraak slechts inschrijfbaar is, nadat die in kracht van gewijsde is gegaan: een
      verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan, inhoudende dat daartegen geen gewoon
      rechtsmiddel meer openstaat;

      b. indien de onder a bedoelde eis voor inschrijfbaarheid niet is gesteld en de rechterlijke uitspraak niet
      uitvoerbaar bij voorraad is: een verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan,
      inhoudende hetzij dat daartegen geen gewoon rechtsmiddel meer openstaat, hetzij dat hem zes weken na de uitspraak
      niet van het instellen van een gewoon rechtsmiddel is gebleken; betreft het een beroep in cassatie dan is een
      verklaring vereist van de griffier van de Hoge Raad der Nederlanden, inhoudende dat hem drie maanden na de
      uitspraak niet van een beroep in cassatie is gebleken;

      c. indien voor de inschrijving betekening aan de veroordeelde vereist is, een door de deurwaarder getekend
      afschrift van het exploot waarbij de betekening is geschied.

      2 Ter inschrijving van een beslissing van de rechter van een vreemde Staat, wordt een authentiek afschrift van deze
      beslissing aangeboden.

      3 Indien de rechterlijke uitspraak in een verlof tot tenuitvoerlegging van een beslissing van arbiters bestaat,
      wordt ook een afschrift van deze beslissing aangeboden, getekend door de griffier van het gerecht dat het verlof
      gaf.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel31
  - number: '32'
    text: |-
      1 Ter inschrijving van een rechtshandeling naar burgerlijk recht die op grond van een wettelijke bepaling kan
      worden ingeschreven, wordt, tenzij anders is bepaald, aangeboden een door een notaris met inachtneming van
      [artikel 43][ref1] opgemaakte verklaring, inhoudende dat de rechtshandeling naar de verklaring van degene die de
      inschrijving verlangt, is verricht en wat de rechtshandeling inhoudt, met daaraan gehecht de stukken waaruit van
      die rechtshandeling blijkt, of authentieke afschriften van die verklaring van de notaris en van die stukken.

      2 Ingeval voor de rechtshandeling of de inschrijving daarvan een notariële akte is vereist, wordt aangeboden hetzij
      die akte, hetzij een authentiek afschrift of een authentiek uittreksel daarvan.

      3 Ingeval van de rechtshandeling een notariële akte is opgemaakt, zonder dat dit vereist was, kan naar keuze van
      degene die de inschrijving verlangt het eerste of tweede lid worden toegepast.

      4 Ingeval het gaat om een eenzijdige tot een of meer bepaalde personen gerichte rechtshandeling, kan worden
      volstaan met aanbieding van een aan die persoon of personen uitgebracht exploot, waarbij die rechtshandeling is
      verricht of tijdig bevestigd, of een authentiek afschrift daarvan.

      5 Ter inschrijving van een afwijkend beding als bedoeld in
      [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek BES][ref2], wordt, in afwijking van het eerste
      lid, een door de eigenaar van het privéschip ondertekende verklaring aangeboden, waarin het scheepstoebehoren ten
      aanzien waarvan het afwijkend beding is gemaakt, eenduidig is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel1
