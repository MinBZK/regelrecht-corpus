  - number: '21'
    text: |-
      1 De boeking, bedoeld in [artikel 20, eerste lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1], geschiedt
      in het register van voorlopige aantekeningen voor goederen als waarop het aangeboden stuk betrekking heeft, met
      vermelding van de gerezen bedenkingen, alsmede voor zover bekend, van de naam en woonplaats met adres van de
      aanbieder.

      2 Na de boeking wordt dat stuk voorzien van een door de bewaarder ondertekende verklaring, vermeldende ten
      minste het kantoor, dag, uur en minuut van aanbieding, onder verwijzing naar de boeking in het desbetreffende
      register van voorlopige aantekeningen, alsmede de gerezen bedenkingen, en wordt het aan de aanbieder
      teruggegeven. Het voor inschrijving vereiste, aangeboden afschrift van het stuk wordt in bewaring genomen.
      [Artikel 19, tweede en derde lid][ref2], is van overeenkomstige toepassing.

      3 Ingeval het voor inschrijving vereiste afschrift niet is aangeboden, vervaardigt de bewaarder een afschrift van
      het in het eerste lid bedoelde stuk overeenkomstig door het bestuur van de Dienst daartoe vast te stellen regels,
      waarbij [artikel 16, zevende lid][ref3], van overeenkomstige toepassing is. De vorige zin is van overeenkomstige
      toepassing met betrekking tot in het eerste lid bedoelde stukken waarop ten aanzien van de inschrijving artikel 16,
      vierde lid, van toepassing is.

      4 Het bestuur van de Dienst stelt voorts regels vast in welke van de gevallen, waarin het in
      [artikel 16, eerste lid][ref4], bedoelde formulier niet met inachtneming van de in artikel 16, zesde lid, bedoelde
      vereisten is ingevuld of aangeboden, de bewaarder een afschrift vervaardigt van het stuk waarvan de inschrijving
      is geweigerd, en op welke wijze deze vervaardiging geschiedt. [Artikel 18, tweede en derde lid][ref5], is van
      overeenkomstige toepassing. Het aangeboden afschrift wordt opgeborgen in het desbetreffende register van voorlopige
      aantekeningen bij het desbetreffende door de bewaarder vervaardigde afschrift.

      5 Indien [artikel 16, zesde lid][ref6], toepassing heeft gevonden, vervaardigt de bewaarder voor zover mogelijk
      een afschrift van het stuk waarvan de inschrijving is geweigerd overeenkomstig door het bestuur van de Dienst
      daartoe vast te stellen regels, alvorens dat stuk aan de aanbieder terug te geven. Artikel 16, zevende lid, is van
      overeenkomstige toepassing.

      6 Het eerste en tweede lid zijn van overeenkomstige toepassing op de boeking van de aanbieding van een stuk, dat
      krachtens [artikel 43, tweede lid][ref7], slechts op bevel van de rechter kan worden ingeschreven.


