        hoofdstuk: '2'
        afdeling: '1'
  - number: '15'
    text: |-
      Stukken ter verkrijging van inschrijving van feiten die betrekking hebben op onroerende zaken of de rechten waaraan
      deze onderworpen zijn, worden aangeboden aan de Kadasters van het openbaar lichaam waarbinnen de onroerende zaken
      waarop de in te schrijven feiten betrekking hebben, zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel15
  - number: '16'
    text: |-
      1 Voor inschrijving van een feit in de openbare registers, bedoeld in
      [artikel 12, eerste lid, onder a tot en met c][ref1], is vereist:

      a. een stuk dat voldoet aan de eisen gesteld in [titel 2][ref2] van dit hoofdstuk; en

      b. een afschrift van dat stuk, gesteld op een door de Kadasters verstrekt formulier en voorzien van een verklaring
      van eensluidendheid.

      2 De bewaarder is niet gehouden de juistheid van de verklaring, bedoeld in het eerste lid, onder b, te onderzoeken.
      De Dienst is niet aansprakelijk voor schade voortvloeiend uit onjuistheden en onvolledigheden in het afschrift.

      3 Bij ministeriële regeling:

      a. wordt de vorm van de in het eerste lid bedoelde verklaring vastgesteld;

      b. wordt bepaald, onverminderd het bepaalde in andere wettelijke voorschriften, door wie die verklaring wordt
      ondertekend;

      c. kan voor bijzondere gevallen worden bepaald dat geen afschrift, als bedoeld in het eerste lid, behoeft te worden
      aangeboden;

      d. worden de vereisten vastgesteld waaraan tekeningen die deel uitmaken van ter inschrijving aangeboden stukken
      moeten voldoen. Daarbij kan worden afgeweken van het eerste tot en met het vierde lid.

      4 In de gevallen, bedoeld in het derde lid, onder c, doet de bewaarder het afschrift van het ter inschrijving
      aangeboden stuk vervaardigen. Het zevende lid is dan van overeenkomstige toepassing.

      5 Bij regeling van het bestuur van de Dienst worden de vorm van het in het eerste lid bedoelde formulier, alsmede
      de vereisten met inachtneming waarvan dit formulier dient te worden ingevuld en aangeboden, vastgesteld.

      6 Bij ministeriële regeling kan worden bepaald dat in afwijking van het eerste lid, onder b, de bewaarder
      een afschrift van het ter inschrijving aangeboden stuk in tweevoud vervaardigt in de vorm van een mechanische
      reproductie. In dat geval voldoet het ter inschrijving aan te bieden stuk aan bij die regeling gestelde eisen en
      zijn het derde lid, onder c, en het vijfde lid, van overeenkomstige toepassing.

      7 De Dienst is aansprakelijk voor schade voortvloeiend uit onjuistheden en onvolledigheden in het afschrift,
      ontstaan ten gevolge van de vervaardiging van de mechanische reproductie, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Hoofdstuk2
