    text: |-
      1 Een verandering van een in een ingeschreven stuk gekozen woonplaats, een alsnog ter zake van een inschrijving
      gedane keuze van woonplaats en de opheffing van een gekozen woonplaats kunnen worden ingeschreven. Ter inschrijving
      van de verandering, keuze of opheffing wordt een door of namens de belanghebbende ondertekende verklaring
      aangeboden die de nieuwe en de vorige gekozen of wettelijke woonplaats vermeldt, alsmede de datum van ingang.

      2 Een krachtens [artikel 24, vijfde lid][ref1], van deze wet of de [artikelen 260, eerste lid, van Boek 3][ref2] of
      [252, tweede lid, van Boek 6 van het Burgerlijk Wetboek BES][ref3] gekozen woonplaats, heeft, ongeacht of die met
      het oorspronkelijke stuk of krachtens het eerste lid is ingeschreven, geen ander gevolg dan dat:

      a. daar exploten kunnen worden uitgebracht die de inschrijving betreffen, ter zake waarvan woonplaats werd gekozen;

      b. daar de bij of krachtens de wet voorgeschreven mededelingen en kennisgevingen van de bewaarder en de Kadasters
      kunnen worden gedaan.

      3 Bij of krachtens deze wet voorgeschreven mededelingen en kennisgevingen worden in elk geval gedaan aan de laatste
      bij de Kadasters bekende woonplaats van de belanghebbende. In geval van overlijden van een persoon die tot een
      registergoed gerechtigd was, worden zodanige mededelingen en kennisgevingen aan zijn rechtsopvolgers gedaan aan het
      laatste bij de Kadasters bekende adres van de boedel of, als deze onbekend is, aan de laatst bekende woonplaats van
      de overleden persoon, alsmede aan de boedelnotaris, als deze bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel252
