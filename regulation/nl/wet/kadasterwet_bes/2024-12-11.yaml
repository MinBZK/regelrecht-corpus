  - number: '72'
    text: |-
      1 De met het onderzoek van vernieuwing belaste ambtenaar wint, zo nodig ter plaatse, inlichtingen in, verzoekt zo
      nodig om overlegging of openlegging van bescheiden en doet de nodige waarnemingen. De belanghebbenden, bedoeld in
      [artikel 71, tweede lid][ref1], dienen, indien naar het oordeel van de ambtenaar nodig door aanwijzing ter plaatse,
      de door de ambtenaar voor de vernieuwing benodigde inlichtingen te verschaffen en daartoe zo nodig bescheiden over
      te leggen of open te leggen.

      2 De ambtenaar maakt een relaas van zijn bevindingen. Indien ten behoeve van het onderzoek een meting plaatsvindt,
      worden de daardoor verkregen gegevens eveneens opgenomen in het relaas van bevindingen.

      3 Op de grondslag van het relaas van bevindingen worden voorstellen van vernieuwing gemaakt. Alvorens daartoe
      wordt overgegaan, wordt nagegaan of na het onderzoek van vernieuwing met betrekking tot de onroerende zaak waarop
      het voorstel betrekking heeft, nog bijhoudingen hebben plaatsgevonden. Is dat het geval, dan wordt in het voorstel
      afzonderlijk melding gemaakt van die bijhoudingen, overeenkomstig door het bestuur van de Dienst vast te stellen
      regels. Elk voorstel bevat in elk geval de gegevens omtrent de rechten, de rechthebbenden, de grootte en de
      kadastrale aanduiding van de onroerende zaak waarop het betrekking heeft, zoals deze luiden op de dag waarop het
      voorstel is opgemaakt.

      4 Bij het maken van een voorstel van vernieuwing wordt geen acht geslagen op niet-ingeschreven feiten waarvan het
      rechtsgevolg slechts kan intreden door inschrijving daarvan in de openbare registers.

      5 In het voorstel worden de gegevens omtrent rechten van hypotheek en inbeslagnemingen, zoals deze blijken uit de
      in de openbare registers ingeschreven stukken, ongewijzigd overgenomen. Indien tijdens het onderzoek is gebleken
      dat de omvang van de onroerende zaak waarop het recht van hypotheek is gevestigd of waarop beslag is gelegd,
      wijziging heeft ondergaan, wordt bij het opmaken van het voorstel op die wijziging acht geslagen.

      6 In het voorstel worden slechts gegevens omtrent die erfdienstbaarheden vermeld welke in de kadastrale
      registratie zijn vermeld, of, indien niet daarin vermeld, waarvan het bestaan aannemelijk is geworden op grond van
      inlichtingen, bescheiden of waarnemingen als bedoeld in het eerste lid.

      7 Het voorstel van vernieuwing wordt bekendgemaakt aan belanghebbenden door toezending of uitreiking. De verzending
      vindt plaats op dezelfde dag als de bekendmaking overeenkomstig het negende lid.

      8 Indien overeenkomstig [paragraaf 1][ref2] of [2][ref3] van
      [hoofdstuk 4 van de Wet administratieve rechtspraak BES][ref4] een heroverweging plaatsvindt van het voorstel
      van vernieuwing, bevat de beschikking in heroverweging alle gegevens uit het voorstel van vernieuwing omtrent de
      rechten, de rechthebbenden, de kadastrale aanduiding en de grootte van de onroerende zaak, waarop de vernieuwing
      betrekking heeft, ook die waarvan de juistheid door belanghebbenden niet is betwist.

      9 Het bestuur van de Dienst doet mededeling van het voorstel van vernieuwing in de Staatscourant. Van de indiening
      van bezwaarschriften en het instellen van beroep, alsmede van daarop gegeven beslissingen wordt bij het voorstel
      melding gemaakt overeenkomstig door het bestuur van de Dienst vast te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Paragraaf2
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Hoofdstuk4
