      1 De percelen grond, welke op aanvraag van belanghebbenden zijn opgemeten, worden op hun kosten, ten genoegen van
      de Kadasters, van duurzame officiële grenstekens voorzien.

      2 De percelen grond, welke ten behoeve van de inrichting van de kadastrale registratie zijn opgemeten, worden op
      kosten van de Kadasters van gelijke grenstekens voorzien.

      3 Verplaatsing van eenmaal aangebrachte grenstekens, zonder toestemming van de Kadasters, is verboden.

      4 Bij ministeriële regeling worden de eisen opgenomen waaraan de te plaatsen grenstekens moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel65
  - number: '66'
    text: |-
      1 Hij die handelt in strijd met het bepaalde bij [artikel 65, derde lid][ref1], wordt, gestraft met een geldboete
      van de tweede categorie.

      2 Met dezelfde straf wordt gestraft hij die opdracht heeft gegeven tot verplaatsing van eenmaal aangebrachte
      grenstekens zonder toestemming van de Kadasters, indien de verplaatsing ingevolge die opdracht is geschied.

      3 De in dit artikel strafbaar gestelde feiten, worden beschouwd als overtredingen.


