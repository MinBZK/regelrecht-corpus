  - number: '79'
    text: |-
      Het bestuur van de Dienst stelt regels vast omtrent de wijze waarop vergissingen, verzuimen of andere
      onregelmatigheden, begaan door de bewaarder bij de inschrijving van stukken in de openbare registers, bedoeld in
      [artikel 12, eerste lid, onder a tot en met c][ref1], bij het stellen daarin van aantekeningen, daaronder begrepen
      doorhalingen van inschrijvingen in die registers, bij de boeking van stukken in de registers van voorlopige
      aantekeningen, of bij de doorhaling van voorlopige aantekeningen, worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel12
