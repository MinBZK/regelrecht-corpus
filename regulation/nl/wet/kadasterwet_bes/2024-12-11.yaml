        artikel: '7'
        hoofdstuk: '1'
  - number: '4'
    text: |-
      1 In afwijking van [artikel 4 van de Ambtenarenwet BES][ref1] wordt onder «bevoegd gezag» in de zin van die wet
      voor wat betreft het personeel van de Kadasters verstaan: het bestuur van de Dienst.

      2 Voor zover in de regels die zijn gesteld bij of krachtens de [Ambtenarenwet BES][ref2] onderscheid wordt gemaakt
      tussen ambtenaren in dienst van de Staat en andere ambtenaren, gelden voor het personeel van de Kadasters de regels
      die van toepassing zijn op de ambtenaren in dienst van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel4
