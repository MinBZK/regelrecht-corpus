  - number: '8'
    text: |-
      1 De Kadasters verzamelen persoonsgegevens als bedoeld in []
      (onbekend)[artikel 1, tweede lid, onder a, van de Wet bescherming persoonsgegevens BES][ref1] voor de doeleinden,
      genoemd in [artikel 6][ref2], onverminderd het bepaalde in andere wettelijke voorschriften.

      2 De Kadasters verwerken geen persoonsgegevens in verband met de totstandbrenging of de instandhouding van een
      directe relatie tussen een Kadaster of een derde en de betrokkene met het oog op werving voor commerciële of
      charitatieve doelen.

      3 Ten aanzien van verwerkingen als bedoeld in dit artikel is het bestuur van de Dienst verantwoordelijke in de zin
      van [artikel 1, tweede lid, onder d, van de Wet bescherming persoonsgegevens BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel1
