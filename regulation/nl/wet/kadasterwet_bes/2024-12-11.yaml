      1 De gebouwde en ongebouwde eigendommen worden aangeduid door de opgave van de kadastrale afdeling, de sectie en
      het nummer, waaronder zij in de registers van de Kadasters bekend zijn en worden kadastrale percelen genaamd.

      2 In de kadastrale aanduiding wordt de afkorting van het openbaar lichaam vermeld, waar de onroerende zaak is
      gelegen. Het bestuur van de Dienst kan nadere regels stellen met betrekking tot de kadastrale aanduiding. Bij die
      regeling kan de kadastrale aanduiding per openbaar lichaam verschillend worden geregeld.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel54
  - number: '55'
    text: |-
      1 De kadastrale registratie, bestaande uit een verzameling administratieve gegeven met betrekking tot onroerende
      zaken, ontsluit de openbare registers door middel van:

      a. de kadastrale aanduiding van de onroerende zaak en van een appartementsrecht; en

      b. de naam van de eigenaar van, of beperkt gerechtigde met betrekking tot een onroerende zaak, met uitzondering van
      de rechthebbende op een erfdienstbaarheid.

      2 Het bestuur van de Dienst kan regels stellen omtrent de in de kadastrale registratie op te nemen gegevens. De
      kadastrale registratie kan geen andere gegevens bevatten dan:

      a. de kadastrale aanduiding van onroerende zaken en van appartementsrechten;

      b. naam, voornamen, adres, geboortedatum en burgerlijke staat van de eigenaar van, beperkt gerechtigde met
      betrekking tot, of beslaglegger op, een onroerende zaak of, ingeval die eigenaar, gerechtigde of beslaglegger een
      rechtspersoon is, de rechtsvorm;

      c. de wettelijke benaming van de beperkte rechten waaraan een onroerende zaak is onderworpen, en van de beslagen
      die op die zaak of dat beperkte recht zijn gelegd, als ook, of die zaak of dat beperkte recht onder bewind staat
      of ten aanzien daarvan een beding als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek BES][ref1]
      is ingeschreven;

      d. de kadastrale grootte, zijnde de indicatieve omvang van een perceel, berekend door de Kadasters;

      e. gegevens die krachtens een andere wet aan de Kadasters ter inschrijving in de openbare registers,
      respectievelijk ter opneming in de kadastrale registratie, worden aangeboden;

      f. ten aanzien van een eigenaar en beperkt gerechtigde als bedoeld onder b: een verwijzing naar alle in de openbare
      registers ingeschreven of geboekte stukken, voor zover die stukken betreffen onroerende zaken en rechten waaraan
      die zaken zijn onderworpen;

      g. ten aanzien van een onroerende zaak en een appartementsrecht: een verwijzing naar alle daarop betrekking
      hebbende, in de openbare registers ingeschreven of geboekte stukken;

      h. voor zover op een onroerende zaak een recht van hypotheek rust, het bedrag waarvoor de hypotheek is gevestigd,
      of indien dit bedrag nog niet vaststaat, het maximumbedrag dat uit hoofde van een hypotheek op het goed kan worden
      verhaald;

      i. feitelijke gegevens met betrekking tot een onroerende zaak, een beperkt recht met betrekking tot die zaak of een
      appartementsrecht, voor zover die een nadere omschrijving, een beperking, een begunstiging of een kenmerk bevatten,
      die voor het rechtsverkeer of de landelijke kadastrale kaart van belang zijn, of voor zover die betrekking hebben
      op het beheer, de domicilie of de beschikkingsbevoegdheid van de eigenaar van, beperkt gerechtigde met betrekking
      tot, of de beslaglegger op, een onroerende zaak, een beperkt recht of een appartementsrecht;

      j. het aandeel van een eigenaar of beperkt gerechtigde als bedoeld onder b in geval van een gemeenschap.

      3 De kadastrale registratie bevat een kadastrale kaart. Die kaart is toegankelijk door middel van een coördinaat in
      het net van coördinaatpunten of de kadastrale aanduiding van een perceel. De kadastrale kaart bevat:

      a. de afbeelding van de op basis van inlichtingen van belanghebbenden en met gebruikmaking van de aan de kadastrale
      kaart ten grondslag liggende bescheiden door de Kadasters vastgestelde grens tussen percelen, weergegeven in het
      net van coördinaatpunten;

      b. de kadastrale aanduiding van een perceel;

      c. een voorstelling van de omtrek van een hoofd- of bijgebouw op een perceel, met dien verstande dat de omtrek van
      een bijgebouw uitsluitend wordt weergegeven indien die weergave naar het oordeel van de Dienst nodig is voor een
      goede oriëntatie op de kadastrale kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel252
