    text: |-
      1 Indien het in te schrijven feit betrekking heeft op een in de registratie voor luchtvaartuigen te boek staand
      luchtvaartuig of op een recht waaraan een zodanige zaak is onderworpen, bevat het ter inschrijving aangeboden stuk:

      a. het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld in
      [artikel 3.2, eerste lid, van de Wet luchtvaart][ref1];

      b. de naam en woonplaats van de fabrikant en het type van het luchtvaartuig, jaar en plaats van de bouw, het
      fabrieksnummer als het luchtvaartuig dat heeft, met vermelding van de plaats waar dit nummer is aangebracht, en
      het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met
      aanduiding van de plaats waar dit nummer is aangebracht;

      c. de maximaal toegelaten massa van het luchtvaartuig en, indien het luchtvaartuig een naam voert, de naam ervan,
      en

      d. het nummer waaronder de inschrijving van het verzoek tot teboekstelling van dat luchtvaartuig in het
      desbetreffende register is geschied.

      2 [Artikel 27, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel27
