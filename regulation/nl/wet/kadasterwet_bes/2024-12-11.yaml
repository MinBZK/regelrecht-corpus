  - number: '30'
    text: |-
      1 Ter inschrijving van een akte van levering, vereist voor de overdracht van een registergoed, voor de vestiging,
      afstand of wijziging van een beperkt recht dat een registergoed is, of voor de overgang van een registergoed na
      toedeling uit hoofde van de verdeling van een gemeenschap, wordt aangeboden de notariële akte betreffende deze
      levering, of een authentiek afschrift of een authentiek uittreksel daarvan. In geval van vestiging van een recht
      van hypotheek op een privéschip in aanbouw wordt mede ter inschrijving aangeboden een verklaring van een ambtenaar
      of van een andere door de bewaarder daarmee belaste persoon, inhoudende dat de bouw van het privéschip nog niet
      is voltooid.

      2 Het ter inschrijving aangeboden stuk, bedoeld in het eerste lid, bevat in elk geval:

      a. de titel op grond waarvan de levering plaatsvindt en, in geval van vestiging van een recht van hypotheek,
      tevens:

      1°. een aanduiding van de vordering waarvoor het recht van hypotheek tot zekerheid strekt, of van de feiten aan de
      hand waarvan die vordering zal kunnen worden bepaald;

      2°. het bedrag waarvoor het recht van hypotheek wordt gevestigd of, wanneer dit bedrag nog niet vaststaat, het
      maximumbedrag dat uit hoofde van dat recht van hypotheek op het goed kan worden verhaald;

      3°. in geval van vestiging van een recht van hypotheek op een teboekstaand privéschip of op een recht waaraan een
      zodanige zaak is onderworpen, bovendien: een duidelijke vermelding van het aan de hypotheek onderworpen privéschip;

      4°. in geval van vestiging van een recht van hypotheek op een teboekstaand luchtvaartuig, bovendien: een duidelijke
      vermelding van het aan de hypotheek onderworpen luchtvaartuig;

      b. de wettelijke benaming van het recht, op levering waarvan het ter inschrijving aangeboden stuk betrekking heeft,
      of in geval dat recht geen wettelijke benaming heeft:

      1°. de gangbare benaming, of de vermelding dat het recht geen gangbare benaming heeft;

      2°. de wettelijk grondslag volgens welke het recht kan worden gevestigd of een registergoed is;

      3°. in geval van een recht van grondrente als bedoeld in
      [artikel 100 van de Overgangswet nieuw Burgerlijk Wetboek BES][ref1], de omschrijving van de inhoud van dat recht.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de inschrijving van
      het proces-verbaal van toewijzing, bedoeld in de [artikelen 525, eerste lid][ref2], en
      [584o, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref3], onverminderd hetgeen in ieder van de
      artikelen in het tweede lid is bepaald.

      4 Het aangeboden stuk mag op meer leveringen als bedoeld in het eerste lid betrekking hebben, voor zover voor ieder
      daarvan aan de in de vorige leden gestelde eisen is voldaan. Indien het stuk een overdracht onder voorbehoud van
      een beperkt recht of van een beding als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek BES][ref4]
      betreft, wordt de vestiging van dit recht of het op zich nemen van het beding afzonderlijk en duidelijk vermeld,
      bij gebreke waarvan de inschrijving van het stuk geacht wordt niet mede dit recht of dit beding te betreffen.

      5 Het eerste lid is van overeenkomstige toepassing op de inschrijving van een akte van grensvastlegging, opgemaakt
      krachtens [artikel 31 van Boek 5 van het Burgerlijk Wetboek BES][ref5], alsmede op de inschrijving van een akte van
      splitsing als bedoeld in [artikel 109, eerste lid, van Boek 5 van dat wetboek][ref6], en een akte tot wijziging of
      opheffing van een zodanige splitsing.


      [ref1]: https://wetten.overheid.nl/BWBR0028466#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0028496#Artikel525
      [ref3]: https://wetten.overheid.nl/BWBR0028496#Artikel584o
      [ref4]: https://wetten.overheid.nl/BWBR0028749#Artikel252
      [ref5]: https://wetten.overheid.nl/BWBR0028748#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0028748#Artikel109
