  - number: '82'
    text: |-
      1 Betrokkenen zijn aan de Kadasters wegens het krachtens deze wet verrichten van diensten door de bewaarder of de
      Kadasters vergoedingen verschuldigd overeenkomstig de door het bestuur van de Dienst vastgestelde regels.

      2 De vergoedingen worden tot geen hoger bedrag vastgesteld dan wordt vereist tot dekking van de ten laste van de
      Kadasters komende kosten van het verrichten van diensten, bedoeld in het eerste lid.

      3 Het bestuur van de Dienst stelt regels vast omtrent de wijze waarop een vergoeding wordt voldaan of verrekend.

      4 Het bestuur van de Dienst kan regels stellen met betrekking tot de gevallen waarin en de verrichtingen ten
      aanzien waarvan in die gevallen geen vergoeding is verschuldigd.

      5 Het bestuur van de Dienst is bevoegd om in bijzondere gevallen vrijstelling, vermindering of teruggaaf van de
      vergoeding te verlenen.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel82
  - number: '83'
    text: |-
      1 Het bestuur van de Dienst stelt de regels met betrekking tot de hoogte van de vergoedingen, bedoeld in
      [artikel 82, eerste lid][ref1], niet vast dan nadat de bestuurscolleges van de openbare lichamen de gelegenheid
      is geboden om binnen acht weken na toezending van een voorstel met betrekking tot de hoogte van de vergoedingen
      zienswijzen kenbaar te maken.

      2 Bij het aanbieden ter goedkeuring, als bedoeld in [artikel 17 van de Kaderwet zelfstandige bestuursorganen][ref2],
      vermeldt het bestuur van de Dienst over de voorgestelde vergoedingen de zienswijze van de raad van toezicht,
      bedoeld in [artikel 3 van de Organisatiewet Kadaster][ref3] en de zienswijzen, bedoeld in het eerste lid dan wel
      het feit dat niet binnen de termijn, bedoeld in dat lid, zienswijzen kenbaar zijn gemaakt, alsmede de wijze waarop
      het bestuur met de zienswijzen van de raad van toezicht respectievelijk de bestuurscolleges is omgegaan.

      3 Het bepaalde krachtens [artikel 11, vierde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043565#Artikel82
