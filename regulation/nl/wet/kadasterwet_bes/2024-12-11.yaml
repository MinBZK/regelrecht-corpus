  - number: '9'
    text: |-
      1 Onder de benaming van bewaarder van het kadaster en de openbare registers worden door het bestuur van de Dienst
      voor de Kadasters gezamenlijk, ten minste een en ten hoogste drie bewaarders benoemd.

      2 Tot bewaarder kan uitsluitend worden benoemd degene die:

      a. op grond van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] gerechtigd is de titel meester
      of Master of Laws te voeren;

      b. een door het bestuur van de Dienst voldoende verklaarde opleiding of ervaring van gelijkwaardige aard hebben, of

      c. in het bezit is van een ten aanzien van het beroep van bewaarder verleende erkenning van beroepskwalificaties
      als bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2].

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de beroepsvereisten,
      bedoeld in het tweede lid, onder a.

      4 Bij afwezigheid, belet, ontstentenis of schorsing van een bewaarder wordt hij vervangen door een of meer van de
      andere bewaarders, door het bestuur van de Dienst aan te wijzen op een daarbij door dat bestuur te bepalen wijze.

      5 Het bestuur van de Dienst kan een of meer personen die zijn aangesteld door de Dienst belasten met de waarneming
      van het ambt van bewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel9
