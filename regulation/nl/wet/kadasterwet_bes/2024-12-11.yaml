  - number: '61'
    text: |-
      Een belanghebbende kan bezwaar of beroep instellen tegen een beschikking inzake de bijhouding nadat die bijhouding
      is voltooid.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel61
  - number: '62'
    text: |-
      1 De metingen en andere werkzaamheden, nodig voor het inrichten en in stand houden van de kadastrale registraties,
      worden door of onder verantwoordelijkheid van de ambtenaren of de ambtenaren van de Dienst verricht.

      2 Het bestuur van de Dienst kan andere diensten, belast met het bijhouden van kadasters binnen het Koninkrijk,
      mandateren tot het verrichten van de metingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0043565/2024-12-11#Artikel62
  - number: '63'
    text: |-
      1 Personen die door de Kadasters of een daartoe op grond van een wettelijk voorschrift bevoegde functionaris
      zijn belast met aan de uitvoering van de aan de Kadasters opgedragen taken verbonden werkzaamheden, zijn bevoegd,
      met medeneming van de benodigde apparatuur en andere hulpmiddelen, elke plaats te betreden, onverminderd de
      [artikelen 155 tot en met 163 van het Wetboek van Strafvordering BES][ref1], en daar een waarneming, meting of
      graving te verrichten en daarop of daarin een teken te stellen, voor zover dat redelijkerwijs nodig is voor de
      vervulling van hun taak ter uitvoering van aan de Kadasters opgedragen taken.

      2 De eigenaar, de beperkt gerechtigde en de gebruiker van een registergoed zijn verplicht aan een persoon als
      bedoeld in het eerste lid binnen de door hem gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden, genoemd in het eerste lid, met dien verstande
      dat de toegang slechts wordt verleend tussen zeven uur ’s morgens en zes uur ’s avonds en dat die niet behoeft te
      worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen.

      3 De eigenaar, de beperkt gerechtigde en de gebruiker van een gebouw en grond zijn verplicht te gedogen dat
      daarop of daarin een teken wordt gesteld ter uitvoering van aan de Kadasters opgedragen taken. De eerste
      zin is van overeenkomstige toepassing op het aanbrengen van een brandmerk op een privéschip als bedoeld in
      [artikel 27, eerste lid, onder c][ref2].

      4 Indien de toegang wordt geweigerd, verschaffen de personen, bedoeld in het eerste lid, zich zo nodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan of de medewerking, bedoeld in het tweede lid, niet wordt verleend, zijn de personen, bedoeld in het
      eerste lid, bevoegd het verrichten van de handelingen, bedoeld in het eerste lid, zo nodig met behulp van de sterke
      arm mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0043565#Artikel27
