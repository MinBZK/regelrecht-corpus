        artikel: '8'
  - number: '93'
    text: |-
      1 Op het tijdstip van inwerkingtreding van deze wet zijn de personeelsleden
      van de Rijksdienst Caribisch Nederland of het Kadaster, bedoeld in
      [artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref1], zoals die wet luidde
      onmiddellijk voorafgaand aan de inwerkingtreding van deze wet, van wie naam en functie zijn vermeld op een door
      Onze Minister vastgestelde lijst, van rechtswege ontslagen en aangesteld in dienst van de Dienst als ambtenaar als
      bedoeld in [artikel 4][ref2].

      2 De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst naar
      burgerlijk recht behoren tot het personeel van de Rijksdienst Caribisch Nederland of het Kadaster, bedoeld in
      [artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref3], zoals die wet luidde
      onmiddellijk voorafgaand aan de inwerkingtreding van deze wet, en van wie naam en functie zijn vermeld op een door
      Onze Minister vastgestelde lijst, zijn op dat tijdstip van rechtswege ontslagen en aangesteld in dienst van de
      Dienst als ambtenaar als bedoeld in [artikel 4][ref4].

      3 De overgang van de in het eerste en tweede lid bedoelde personeelsleden vindt plaats
      met een rechtspositie die in totaliteit ten minste gelijkwaardig is aan die welke voor
      elk van hen gold bij de Rijksdienst Caribisch Nederland of het Kadaster, bedoeld in
      [artikel 1 van de Wet kadaster en registratie onroerende zaken en beperkte rechten BES][ref5], zoals die wet luidde
      onmiddellijk voorafgaand aan de inwerkingtreding van deze wet.


