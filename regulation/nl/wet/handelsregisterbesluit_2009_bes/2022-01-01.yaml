  - number: 32a
    text: |-
      1 Bij ministeriële regeling wordt het bedrag van de bijdrage bij de eerste inschrijving van
      een onderneming, rechtspersoon of nevenvestiging en van de jaarlijkse bijdrage als bedoeld in
      [artikel 14, eerste lid, van de Handelsregisterwet 2009 BES][ref1], vastgesteld.

      2 Het gewicht van de jaarlijkse bijdrage is:








                    *Rechtsvorm*


                    *Gewicht jaarlijkse bijdrage*






                    Ondernemingen toebehorende aan een natuurlijk persoon


                    1




                    Verenigingen, stichtingen en stichtingen particulier fonds


                    2




                    Vennootschappen onder firma en maatschappen


                    2




                    Commanditaire vennootschappen


                    3




                    Coöperaties en onderlinge waarborgmaatschappijen


                    3




                    Kleine naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid


                    3




                    Grote naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid


                    5




                    Vennootschappen en rechtspersonen opgericht naar het recht van een ander land


                    5






      3 Voor de toepassing van het tweede lid worden naamloze vennootschappen en besloten vennootschappen met beperkte
      aansprakelijkheid als grote vennootschappen gekwalificeerd, indien het minimum aantal functionarissen dat de
      vennootschap volgens de statuten heeft of het aantal geregistreerde functionarissen, groter is dan een.


      [ref1]: https://wetten.overheid.nl/BWBR0028503#Artikel14
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel32a
