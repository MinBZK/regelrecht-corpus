  - number: '12'
    text: |-
      1 Van iedere onderneming, hoofdvestiging en op het openbaar lichaam gelegen nevenvestiging wordt opgegeven:

      a. de handelsnaam of -namen;

      b. het adres en, voor zover van toepassing, het correspondentieadres;

      c. het telefoonnummer alsmede, voor zover van toepassing, het faxnummer, het e-mailadres en het internetadres;

      d. een korte omschrijving van de uitgeoefende activiteiten van de onderneming;

      e. het tijdstip van aanvang van de activiteiten van de onderneming.

      2 Indien de hoofdvestiging buiten het openbaar lichaam is gelegen, wordt tevens opgegeven welke nevenvestiging
      wordt aangemerkt als de hoofdnederzetting. Is de hoofdvestiging binnen het gebied van een andere Kamer binnen een
      openbaar lichaam gelegen, dan worden van de hoofdvestiging opgegeven de in het eerste lid van dit artikel onder a,
      b en d bedoelde gegevens.

      3 Indien de onderneming op het openbaar lichaam alleen door één of meer gevolmachtigde handelsagenten wordt
      vertegenwoordigd, wordt het adres van de daartoe aangewezen handelsagent aangemerkt als het adres van de
      hoofdnederzetting.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel12
  - number: '13'
    text: |-
      Van een rechtspersoon wordt opgegeven:

      a. het adres, alsmede, voor zover van toepassing, het correspondentieadres;

      b. het telefoonnummer alsmede, voor zover van toepassing, het faxnummer, het e-mailadres en het internetadres;

      c. een korte omschrijving van de uitgeoefende activiteiten.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel13
  - number: '14'
    text: Indien een onderneming toebehoort aan een natuurlijke persoon, worden diens persoonlijke gegevens opgegeven.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel14
  - number: '15'
    text: |-
      Van een vennootschap onder firma worden opgegeven:

      a. de naam van de vennootschap;

      b. het tijdstip van aanvang van de vennootschap en de duur waarvoor zij is aangegaan;

      c. de persoonlijke gegevens van de vennoten en ten aanzien van een na de aanvang van de vennootschap toegetreden
      vennoot tevens de dag van zijn toetreding;

      d. al hetgeen de overeenkomst, voor zover van toepassing, bevat ter bepaling van de rechten van derden.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel15
  - number: '16'
    text: |-
      Van een commanditaire vennootschap worden opgegeven:

      a. de naam van de vennootschap;

      b. het tijdstip van aanvang van de vennootschap en de duur waarvoor zij is aangegaan;

      c. de persoonlijke gegevens van de vennoot of vennoten onder firma en ten aanzien van een na de aanvang van de
      vennootschap toegetreden vennoot onder firma tevens de dag van zijn toetreding;

      d. voor zover het om twee of meer vennoten onder firma gaat, al hetgeen de overeenkomst bevat ter bepaling van de
      rechten van derden;

      e. het aantal van de commanditaire vennoten en hun respectievelijke land van inwoning;

      f. het bedrag van de gelden en de waarde van de goederen die zij gezamenlijk hebben ingebracht;

      g. ingeval van een commanditaire vennootschap op aandelen aan toonder, wordt in plaats van het onder f bepaalde
      opgegeven het bedrag van het commanditair kapitaal, het aantal en het bedrag van de aandelen, waarin het verdeeld
      is, en het bedrag van het geplaatste kapitaal, terwijl bij een commanditaire vennootschap op aandelen op naam
      tevens het bepaalde onder f toepasselijk blijft. Het bedrag van het geplaatste kapitaal wordt eenmaal per jaar
      opgegeven, totdat blijkens opgave het kapitaal geheel is geplaatst.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel16
  - number: '17'
    text: |-
      1 Van een naamloze vennootschap en een besloten vennootschap worden opgegeven:

      a. de naam van de vennootschap en haar zetel volgens de statuten;

      b. de persoonlijke gegevens van iedere bestuurder en commissaris en de dag waarop hij bij de vennootschap als
      zodanig in functie is getreden, alsmede of hij bevoegd is de vennootschap alleen of gezamenlijk handelend met een
      of meer anderen te vertegenwoordigen;

      c. ingeval de statuten bepalen dat er een algemeen bestuur zal zijn en een uitvoerend bestuur, van iedere
      bestuurder de plaats in het bestuur;

      d. de persoonlijke gegevens van anderen dan de bestuurders aan wie de statuten bevoegdheid tot vertegenwoordiging
      toekennen, alsmede de inhoud van de bevoegdheid;

      e. heeft de vennootschap bij de oprichting een nominaal kapitaal, het nominale kapitaal alsmede de nominale waarde
      en het aantal van de uitgegeven aandelen met vermelding van hun nominale waarden en muntsoorten waarin deze zijn
      uitgedrukt indien er verschillende nominale waarden en verschillende muntsoorten zijn;

      f. het bestaan van een bijstortingsverplichting als bedoeld in de [artikelen 107][ref1] en
      [207 van Boek 2 van het Burgerlijk Wetboek BES][ref2] en de hoegrootheid daarvan.

      2 Bij het handelsregister wordt gedeponeerd een authentiek afschrift van de oprichtingsakte van de vennootschap en
      van de statuten, indien deze in een afzonderlijke akte zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel207
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '207'
  - number: '18'
    text: |-
      1 Van een aandeelhouder-bestuurde vennootschap worden opgegeven:

      a. de naam van de vennootschap en haar zetel volgens de statuten;

      b. de persoonlijke gegevens van iedere aandeelhouder-bestuurder en commissaris en de dag waarop hij tot de
      vennootschap als zodanig is toegetreden alsmede of hij bevoegd is de rechtspersoon alleen of gezamenlijk handelend
      met een of meer anderen te vertegenwoordigen;

      c. de persoonlijke gegevens van anderen dan de aandeelhouder-bestuurders aan wie de statuten bevoegdheid tot
      vertegenwoordiging toekennen, alsmede de inhoud van de bevoegdheid;

      d. heeft de vennootschap bij de oprichting een nominaal kapitaal, het nominale kapitaal alsmede de nominale waarde
      en het aantal van de uitgegeven aandelen met vermelding van hun nominale waarden en muntsoorten waarin deze zijn
      uitgedrukt indien er verschillende nominale waarden en verschillende muntsoorten zijn;

      e. het bestaan van een bijstortingsverplichting als bedoeld in
      [artikel 207 van Boek 2 van het Burgerlijk Wetboek BES][ref1] en de hoegrootheid daarvan.

      2 Bij het handelsregister wordt gedeponeerd een authentiek afschrift van de oprichtingsakte van de vennootschap en
      van de statuten, indien deze in een afzonderlijke akte zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel207
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '207'
  - number: '19'
    text: |-
      1 Van een vereniging met volledige rechtsbevoegdheid, coöperatie of onderlinge waarborgmaatschappij worden
      opgegeven:

      a. de naam van de rechtspersoon en haar zetel volgens de statuten;

      b. de persoonlijke gegevens van iedere bestuurder en commissaris en de dag waarop hij bij de vereniging met
      volledige rechtsbevoegdheid, de coöperatie of de onderlinge waarborgmaatschappij als zodanig in functie is
      getreden, alsmede of hij bevoegd is de vereniging met volledige rechtsbevoegdheid, coöperatie of onderlinge
      waarborgmaatschappij alleen of gezamenlijk handelend met een of meer anderen te vertegenwoordigen;

      c. ingeval de statuten bepalen dat er een algemeen bestuur zal zijn en een uitvoerend bestuur, van iedere
      bestuurder de plaats in het bestuur;

      d. de persoonlijke gegevens van anderen dan de bestuurders aan wie de statuten bevoegdheid tot vertegenwoordiging
      toekennen, alsmede de inhoud van de bevoegdheid.

      2 Van een coöperatie of onderlinge waarborgmaatschappij, die in haar statuten heeft bepaald dat zij die bij de
      ontbinding leden waren, of gedurende een in de statuten bepaalde termijn voordien hebben opgehouden lid te zijn,
      tegenover de rechtspersoon naar de daarbij aangegeven maatstaf voor een tekort aansprakelijk zijn, wordt een
      door het bestuur gewaarmerkt afschrift van de ledenlijst bij het handelsregister gedeponeerd bij de inschrijving
      van de coöperatie of onderlinge waarborgmaatschappij. Binnen een maand na het einde van ieder boekjaar van de
      coöperatie of onderlinge waarborgmaatschappij wordt door het bestuur een schriftelijke opgave van de wijzigingen
      die de ledenlijst in de loop van het boekjaar heeft ondergaan, aan de bij het handelsregister gedeponeerde lijst
      toegevoegd of wordt, indien de Secretaris dit nodig oordeelt, een nieuwe lijst, tevens omvattende de als zodanig in
      de lijst op te nemen oud-leden, gedeponeerd.

      3 Bij het handelsregister worden gedeponeerd een authentiek afschrift van de oprichtingsakte van de vereniging met
      volledige rechtsbevoegdheid, coöperatie en onderlinge waarborgmaatschappij en van de statuten, indien deze in een
      afzonderlijke akte zijn opgenomen alsmede een afschrift van het reglement.

      4 Van een vereniging zonder volledige rechtsbevoegdheid kunnen worden opgegeven de in het eerste lid, onder a tot
      en met d, bedoelde gegevens en vindt daarbij het derde lid overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel19
  - number: '20'
    text: |-
      1 Van een stichting en een stichting particulier fonds worden opgegeven:

      a. de naam van de stichting of stichting particulier fonds en haar zetel volgens de statuten;

      b. de persoonlijke gegevens van de oprichters;

      c. de persoonlijke gegevens van iedere bestuurder en commissaris en de dag waarop hij als zodanig in functie
      is getreden, of hij bevoegd is de rechtspersoon alleen of gezamenlijk handelend met een of meer anderen te
      vertegenwoordigen, alsmede van iedere bestuurder de plaats in het bestuur;

      d. ingeval de statuten bepalen dat er een algemeen bestuur zal zijn en een uitvoerend bestuur, van iedere
      bestuurder de plaats in het bestuur;

      e. de persoonlijke gegevens van anderen dan de bestuurders of commissarissen aan wie de statuten bevoegdheid tot
      vertegenwoordiging toekennen, alsmede de inhoud van de bevoegdheid.

      2 Bij het handelsregister wordt gedeponeerd tezamen met de opgave tot inschrijving een authentiek afschrift
      van de oprichtingsakte van de stichting of stichting particulier fonds en van de statuten, indien deze in een
      afzonderlijke akte zijn opgenomen.

      3 Indien de stichting of stichting particulier fonds niet is opgericht naar het recht van het openbaar lichaam, dan
      worden opgegeven de in het eerste lid, onder a tot en met e, bedoelde gegevens, en vinden het tweede lid van dit
      artikel en [artikel 21, vierde lid][ref1], overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel21
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028479
        artikel: '21'
        paragraaf: '4'
  - number: '21'
    text: |-
      1 Indien een op het openbaar lichaam gevestigde onderneming of een op het openbaar lichaam gelegen nevenvestiging
      van een buiten het openbaar lichaam gevestigde onderneming toebehoort aan een buitenlandse rechtspersoon, niet
      zijnde een stichting of stichting particulier fonds, dan worden opgegeven:

      a. de naam en de rechtsvorm van de rechtspersoon waaraan de onderneming of de hoofdnederzetting toebehoort en het
      register waarin die rechtspersoon is ingeschreven;

      b. indien de hoofdvestiging van de onderneming buiten het openbaar lichaam is gelegen, het adres van de
      hoofdvestiging van de onderneming;

      c. de persoonlijke gegevens van iedere bestuurder en commissaris van de rechtspersoon en de dag waarop hij bij de
      rechtspersoon als zodanig in functie is getreden, alsmede of hij bevoegd is de rechtspersoon alleen of gezamenlijk
      handelend met een of meer anderen te vertegenwoordigen;

      d. de omvang van de bevoegdheid van iedere bestuurder en commissaris van de rechtspersoon;

      e. de persoonlijke gegevens van de bij de onderneming of de nevenvestiging of nederzetting werkzame beheerder of
      een andere dergelijke gevolmachtigde, zijn functie en de dag waarop hij bij de onderneming of de hoofdnederzetting
      als zodanig in functie is getreden, alsmede de inhoud van zijn volmacht;

      f. het land naar het recht waarvan de rechtspersoon is opgericht.

      2 Het bepaalde in [artikel 17, eerste lid, onder e en f][ref1], vindt overeenkomstige toepassing.

      3 Bij het handelsregister wordt tezamen met de opgave tot inschrijving gedeponeerd een authentiek afschrift of
      een door een opgaveplichtige gewaarmerkt afschrift van de oprichtingsakte van de vennootschap en van de statuten,
      indien deze in een afzonderlijke akte zijn opgenomen, vergezeld van een door een beëdigde vertaler ondertekende
      Nederlandse of Engelse vertaling daarvan.

      4 Bij het handelsregister wordt gedeponeerd al datgene wat ingevolge de wetgeving van het land onder welker recht
      de rechtspersoon valt met betrekking tot de rechtspersoon in een handelsregister wordt opgegeven of op andere wijze
      openlijk bekend wordt gemaakt, vergezeld van een door een beëdigde vertaler ondertekende Nederlandse of Engelse
      vertaling.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel17
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028479
        artikel: '17'
        paragraaf: '4'
  - number: '22'
    text: |-
      1 Heeft een onderneming, rechtspersoon of nevenvestiging één of meer procuratiehouders of andere gevolmachtigden,
      dan worden ook deze ter inschrijving opgegeven. Van deze procuratiehouders en gevolmachtigden worden opgegeven hun
      persoonlijke gegevens en of zij beperkte of onbeperkte volmacht hebben om de onderneming, de rechtspersoon of de
      nevenvestiging te vertegenwoordigen.

      2 Indien een in te schrijven persoon een rechtspersoon is, worden tevens opgegeven:

      a. de statutaire naam en het adres van de rechtspersoon;

      b. het nummer waaronder en het register waarin de rechtspersoon is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel22
  - number: '23'
    text: |-
      1 Bij het handelsregister wordt, indien het betreft een naamloze vennootschap die voldoet aan elk van de
      criteria gesteld in [artikel 119, tweede lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1], de mededeling
      gedeponeerd dat haar jaarrekening ter hare kantore ter inzage is gelegd. Indien daartoe de verplichting bestaat
      wordt daarbij tevens vermeld, dat de jaarrekening niet betreft een goedgekeurde jaarrekening, en voorts of
      een belanghebbende die inzage wil, zich moet laten vertegenwoordigen door een deskundige zoals bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref2].

      2 Heeft een vennootschap in haar statuten de
      [artikelen 120 tot en met 122 van Boek 2 van het Burgerlijk Wetboek BES][ref3], van toepassing verklaard, dan vindt
      het in het eerste lid bepaalde overeenkomstige toepassing.

      3 Bij het handelsregister wordt, indien het betreft een vennootschap die voldoet aan het in
      [artikel 123 van Boek 2 van het Burgerlijk Wetboek BES][ref4] bepaalde, de onder c van dat artikel bedoelde
      verklaring gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel120
      [ref4]: https://wetten.overheid.nl/BWBR0028744#Artikel123
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel23
