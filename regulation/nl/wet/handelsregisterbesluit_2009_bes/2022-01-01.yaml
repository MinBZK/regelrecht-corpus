articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *«openbaar lichaam»:* het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      b. *«persoonlijke gegevens»:* de naam en voornamen, de geslachtsaanduiding, het woonadres, de datum, de plaats
      en, indien deze plaats is gelegen buiten het openbaar lichaam, het land van geboorte, de nationaliteit, alsmede de
      handtekening en paraaf van een natuurlijk persoon.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel1
  - number: '2'
    text: |-
      1 Voor het doen van de voorgeschreven opgaven ter inschrijving in het handelsregister wordt gebruik gemaakt van
      door de Kamer vastgestelde formulieren die kosteloos verkrijgbaar zijn.

      2 De Secretaris kan bepalen dat een opgave op andere door hem te bepalen wijze geschiedt dan in het eerste lid
      bepaald.

      3 De Secretaris verstrekt de belanghebbende op verzoek een bevestiging van de opgave, met vermelding van de dag
      waarop deze is gedaan.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel2
  - number: '3'
    text: |-
      1 Indien de Secretaris er niet van overtuigd is dat de opgave afkomstig is van hem of haar die tot het doen van
      de opgave verplicht is, kan hij weigeren de opgave in behandeling te nemen. Hij kan om nadere bewijsstukken van de
      bevoegdheid vragen.

      2 Een machtiging tot het doen van de opgave moet authentiek zijn of gelegaliseerd door een functionaris ter plaatse
      bevoegd.

      3 Indien naar zijn oordeel de verstrekte bewijsstukken onvoldoende zijn voor de beoordeling van de verplichting
      tot het doen van opgave door hem of haar van wie de opgave afkomstig is, is de Secretaris bevoegd de opgave te
      weigeren.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel3
  - number: '4'
    text: |-
      1 Nadat de opgave in behandeling is genomen, onderzoekt de Secretaris summierlijk of deze juist is. De Secretaris
      kan daarbij om nadere bewijsstukken van de vermelde gegevens vragen.

      2 Indien de Secretaris van oordeel is dat de opgave niet juist is, geeft hij de belanghebbende in overweging
      de opgave te wijzigen of in te trekken. Daartoe stelt hij de opgave onverwijld weer ter beschikking van de
      belanghebbende en geeft hij de aanwijzingen die hij in het belang van het handelsregister dienstig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel4
  - number: '5'
    text: |-
      1 Indien de Secretaris van oordeel is dat de opgave juist is, gaat hij over tot inschrijving.

      2 De Secretaris gaat eveneens over tot inschrijving, indien naar zijn oordeel, nadat toepassing is gegeven aan
      [artikel 4 tweede lid][ref1], uit de nieuwe opgave blijkt dat de belanghebbende aan de gegeven aanwijzingen heeft
      voldaan.

      3 Indien de Kamer zich op grond van het eerste lid van [artikel 18 van de Handelsregisterwet 2009 BES][ref2]
      tot de rechter heeft gewend met het verzoek de doorhaling, aanvulling of wijziging van het ingeschrevene of de
      inschrijving van de onderneming, rechtspersoon of nevenvestiging te gelasten, doet de Secretaris, zolang niet
      een rechterlijke beschikking ten uitvoer is gelegd of een afwijzende beschikking onherroepelijk is geworden, aan
      degenen die inzage van het ingeschrevene aangaande de onderneming, rechtspersoon of nevenvestiging, dan wel een
      afschrift of een uittreksel daarvan verlangen, mededeling van het door hem gedane verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028503#Artikel18
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel5
    references:
