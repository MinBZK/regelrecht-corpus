  - number: '24'
    text: |-
      In het handelsregister wordt in geval van omzetting, fusie of splitsing gedeponeerd:

      a. indien het betreft de omzetting van een rechtspersoon, de mededeling van het voornemen daartoe overeenkomstig
      het bepaalde in het vijfde lid van [artikel 300 van Boek 2 van het Burgerlijk Wetboek BES][ref1];

      b. indien het betreft de fusie tussen rechtspersonen, de in
      [artikel 314 van Boek 2 van het Burgerlijk Wetboek BES][ref2] voorgeschreven bescheiden;

      c. indien het betreft de splitsing van een rechtspersoon, de in
      [artikel 342 van Boek 2 van het Burgerlijk Wetboek BES][ref3] voorgeschreven bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel300
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel314
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel342
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel24
