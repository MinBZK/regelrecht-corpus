  - number: '7'
    text: |-
      Nadat de opgave van de datumaanduiding is voorzien, wordt zij zo spoedig mogelijk ingeschreven op de wijze als in
      de [artikelen 8 tot en met 13][ref1] bepaald is.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel8
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028479
        artikel: '8'
        paragraaf: '3'
  - number: '8'
    text: |-
      De gegevens in het register worden elektronisch opgeslagen. Aan de onderneming, rechtspersoon of nevenvestiging die
      wordt ingeschreven, wordt een nummer toegekend.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel8
  - number: '9'
    text: |-
      1 Indien de Kamer een rechterlijke beschikking heeft ontvangen, waarbij de doorhaling, aanvulling of wijziging
      van het in het handelsregister ingeschrevene wordt gelast, zal de Secretaris zodra de voorlopige tenuitvoerlegging
      is bevolen of de beschikking kracht van gewijsde heeft, tot de doorhaling, aanvulling of wijziging overgaan, door
      een authentiek afschrift van de rechterlijke beschikking in het dossier te plaatsen bij de opgaven, waarop de
      beschikking betrekking heeft.

      2 Ieder, die een rechterlijke beschikking als bedoeld in het eerste lid heeft ontvangen, kan, onder overlegging
      van een authentiek afschrift, de Secretaris verzoeken tot de doorhaling, aanvulling of wijziging over te gaan.
      De Secretaris geeft aan dit verzoek gevolg op de wijze bij het eerste lid bepaald, indien hem blijkt, dat de
      beschikking kracht van gewijsde heeft, dan wel de voorlopige tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel9
  - number: '10'
    text: |-
      [Artikel 9][ref1] is van overeenkomstige toepassing bij rechterlijke uitspraken inhoudende:

      a. gehele of gedeeltelijke onrechtmatig verklaring van hetgeen in het handelsregister is ingeschreven;

      b. wijziging of tijdelijke afwijking van de statuten van de rechtspersoon;

      c. ontslag, schorsing of aanstelling, al dan niet tijdelijk, van een bestuurder of commissaris;

      d. nietigverklaring of vernietiging van een besluit tot ontbinding of wijziging van de statuten;

      e. ontbinding of een beschikking als bedoeld in
      [artikel 2, derde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref2];

      f. vernietiging van een uitspraak als bedoeld onder a tot en met e.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel2
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028479
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '2'
  - number: '11'
    text: |-
      Wanneer in het dossier een nieuwe opgave of een rechterlijke uitspraak wordt opgenomen, als bedoeld in de
      [artikelen 9][ref1] en [10][ref2], wordt in de oorspronkelijke opgave verwezen naar de nieuwe opgave, of de
      rechterlijke beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028479#Artikel10
