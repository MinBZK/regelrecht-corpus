  - number: '31'
    text: |-
      1 Ingeval van opheffing van een onderneming zijn zowel degenen die op grond van de
      [Handelsregisterwet 2009 BES][ref1] verplicht zijn om opgaaf te doen als de vereffenaar gehouden binnen een week
      daarvan opgave te doen.

      2 Heeft een onderneming langer dan een week opgehouden te bestaan, zonder dat de opheffing voor inschrijving is
      opgegeven, dan kan de Secretaris na ingesteld onderzoek handelen als ware opgave gedaan van de opheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0028503
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028503
  - number: '32'
    text: |-
      1 De Secretaris is ambtshalve bevoegd tot het inschrijven van een wijziging, na onderzoek of na op andere wijze
      kennis gekregen te hebben, in de volgende gegevens van een ingeschreven onderneming, hoofdvestiging, nevenvestiging
      of rechtspersoon:

      a. het adres;

      b. de omschrijving van het uitgeoefende bedrijf;

      c. de communicatiegegevens, zoals het telefoonnummer, en, voor zover van toepassing, het faxnummer, het e-mailadres
      en het internetadres.

      2 De Secretaris is bevoegd tot het inschrijven van een wijziging van de persoonlijke gegevens van een ingeschreven
      natuurlijk persoon indien die persoonlijke gegevens reeds in een andere inschrijving in het door de Kamer gehouden
      register zijn ingeschreven of indien de Secretaris op andere wijze kennis heeft gekregen van die wijziging.

      3 Ter uitvoering van het bepaalde in [artikel 13 van de Handelsregisterwet 2009 BES][ref1] is het inzien van het
      handelsregister en van de bescheiden die daarbij krachtens wettelijk voorschrift zijn gedeponeerd niet mogelijk op
      basis van persoonlijke gegevens en een adres.

      4 Ter uitvoering van het bepaalde in [artikel 13 van de Handelsregisterwet 2009 BES][ref2] is het verstrekken
      van gegevens over de samenstelling van ondernemingen of rechtspersonen uitsluitend gerangschikt naar natuurlijke
      personen aan een bestuursorgaan niet mogelijk, tenzij het verzoek daartoe wordt gedaan door:

      a. een officier van justitie, ten behoeve van de opsporing van strafbare feiten op grond van het
      [Wetboek van Strafrecht BES][ref3];

      b. de Belastingdienst voor Caribisch Nederland voor de uitvoering van zijn taken op grond van de
      [Belastingwet BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028503#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028503#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028570
      [ref4]: https://wetten.overheid.nl/BWBR0029244
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel32
