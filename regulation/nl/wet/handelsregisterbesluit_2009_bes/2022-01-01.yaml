  - number: '30'
    text: |-
      1 In geval van ontbinding van een rechtspersoon wordt opgegeven:

      a. een afschrift van een verzoek tot ontbinding van een rechtspersoon;

      b. de ontbinding van een rechtspersoon, krachtens de wet, statutaire bepalingen, rechterlijke uitspraak, een
      daartoe strekkend besluit van een statutair daartoe bevoegd orgaan of daartoe aangewezen derde, of als gevolg van
      hetzij opheffing van het faillissement wegens gebrek aan baten, hetzij door insolventie, met vermelding van het
      tijdstip en reden van ontbinding, de persoonlijke gegevens en de bevoegdheid en titel van ieder der functionarissen
      belast met de vereffening, het tijdstip waarop hij functionaris is geworden en opgehouden is te zijn, alsmede het
      einde van de vereffening;

      c. de rekening en verantwoording van de vereffening, met uitzondering van die uit hoofde van faillissement,
      waaruit blijkt in hoeverre elk van de schuldeisers is voldaan en, zo van een overschot sprake is, de omvang en
      samenstelling daarvan, alsmede een plan van uitkering dat de grondslagen van de uitkering van het overschot bevat,
      en de slotverantwoording.

      2 In geval van opening of heropening van een vereffening vindt het bepaalde in het eerste lid, onder b en c
      overeenkomstige toepassing.

      3 Indien de ontbinding betreft een stichting of stichting particulier fonds als bedoeld in
      [artikel 20, derde lid][ref1], of een vennootschap als bedoeld in [artikel 23][ref2], worden tevens opgegeven de
      bevoegdheden van de vereffenaars.

      4 Tot het doen van de opgave van de ontbinding als gevolg van een faillissement is mede de curator verplicht. In
      alle andere gevallen van ontbinding is tot het doen van de opgave van de ontbinding mede de vereffenaar verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028479#Artikel23
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel30
