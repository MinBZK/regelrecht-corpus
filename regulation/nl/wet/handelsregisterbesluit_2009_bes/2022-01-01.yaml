  - number: '29'
    text: |-
      1 In geval van faillissement of surseance van betaling wordt opgegeven:

      a. de rechterlijke uitspraak houdende faillietverklaring van of verlening van surseance van betaling aan
      natuurlijke personen die als eigenaar van een onderneming, als vennoot onder firma, of als beherend vennoot in een
      commanditaire vennootschap die in het handelsregister is ingeschreven of van een ingeschreven rechtspersoon;

      b. de vernietiging van een zodanige uitspraak;

      c. het einde van het faillissement of de surseance van betaling;

      d. de persoonlijke gegevens van de curator onderscheidenlijk de bewindvoerder.

      2 Indien het een uitspraak van een buitenlandse rechter betreft inzake een vennootschap of rechtspersoon als
      bedoeld in de [artikelen 20, derde lid][ref1], en [21][ref2], wordt de opgave gedaan door degene die op grond van
      de [Handelsregisterwet 2009 BES][ref3] verplicht is opgave te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0028479#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028479#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0028503
