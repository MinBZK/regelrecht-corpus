        artikel: '441'
  - number: '28'
    text: |-
      In geval van curatele van degene die als eigenaar van een onderneming, als vennoot onder firma, of als beherend
      vennoot in een commanditaire vennootschap, die in het handelsregister is ingeschreven, wordt opgegeven:

      a. de persoonlijke gegevens van de curator en de datum waarin hij in of uit functie is getreden;

      b. de rechterlijke beslissingen inzake de bevoegdheid als bedoeld in
      [artikel 380, tweede en derde lid, van Boek 1 van het Burgerlijk Wetboek BES][ref1];

      c. de aanvang en het einde van de curatele;

      d. alle aantekeningen die krachtens [artikel 391, Boek 1 van het Burgerlijk Wetboek BES][ref2], in de registers ter
      griffie van het Gerecht in eerste aanleg worden gehouden, door de curator of door hem die met het houden van die
      aantekeningen belast is.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel380
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel391
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel28
