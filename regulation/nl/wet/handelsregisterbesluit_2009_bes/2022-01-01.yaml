        bwb_id: BWBR0028744
        artikel: '342'
  - number: '25'
    text: |-
      In het handelsregister wordt opgegeven:

      a. het besluit van een naamloze en een besloten vennootschap en een stichting of stichting particulier fonds en een
      coöperatie tot omzetting van de rechtspersoon in een buitenlandse rechtspersoon;

      b. de opgave van de opheffing van de onderneming en tot uitschrijving van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel25
  - number: '26'
    text: |-
      Indien een minderjarige, aan wie een onderneming toebehoort of die vennoot onder firma is, handlichting heeft
      verkregen, worden het tijdstip waarop de handlichting is verleend en de bevoegdheden die de minderjarige daarbij
      zijn toegekend, opgegeven. Bij de opgave ter inschrijving wordt overgelegd het blad waarin van overheidswege de
      officiële berichten worden geplaatst en waarin de rechterlijke beschikking inzake de handlichting is openbaar
      gemaakt, of een authentiek afschrift van de beschikking met vermelding van de dagtekening van dat blad.
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel26
  - number: '27'
    text: |-
      In geval van onderbewindstelling, ook die als bedoeld in [titel 18][ref1] of
      [titel 19 van Boek 1 van het Burgerlijk Wetboek BES][ref2], van een onderneming of een aandeel in een vennootschap,
      worden door de bewindvoerder ter inschrijving in het handelsregister opgegeven:

      a. de persoonlijke gegevens van de bewindvoerder en de datum waarin hij in of uit functie is getreden;

      b. de rechterlijke beslissingen inzake zijn bevoegdheid als bedoeld in de [artikelen 437, tweede lid][ref3], en
      [441, tweede lid, onderdeel f, en derde lid, van Boek 1 van het Burgerlijk Wetboek BES][ref4];

      c. de aanvang en het einde van het bewind.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
      [ref2]: https://wetten.overheid.nl/BWBR0028743
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel437
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel441
    url: https://wetten.overheid.nl/BWBR0028479/2022-01-01#Artikel27
    references:
