  - number: '4.1'
    text: |-
      1 Van de vermogensgrondslag, bedoeld in [artikel 3.3.1.2, tweede en derde lid, van het Besluit][ref1], wordt het
      volgende vermogensbestanddeel afgetrokken:

      a. het bedrag van een uitkering die een schadevergoeding vormt voor letselschade waarvan de hoogte is vastgelegd in
      een overeenkomst of rechterlijke uitspraak;

      b. het bedrag van een uitkering als bedoeld in
      [artikel 9bis van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref2];

      c. het bedrag van een uitkering als bedoeld in
      [artikel 9ter van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref3];

      d. het bedrag van een uitkering als bedoeld in
      [artikel 9quater van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref4];

      e. het bedrag van een uitkering als bedoeld in
      [artikel 9quinquies van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref5];

      f. het bedrag van een uitkering als bedoeld in
      [artikel 9sexies van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref6];

      g. het bedrag van een uitkering als bedoeld in
      [artikel 9septies van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref7];

      h. het bedrag van een uitkering als bedoeld in
      [artikel 9octies van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref8];

      i. het bedrag van een uitkering als bedoeld in
      [artikel 9novies van de Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen][ref9];

      j. het bedrag van een uitkering als bedoeld in artikel 9decies van de Uitvoeringsregeling Algemene wet
      inkomensafhankelijke regelingen;

      k. het bedrag van een uitkering als bedoeld in artikel 9undecies van de Uitvoeringsregeling Algemene wet
      inkomensafhankelijke regelingen;

      l. een uitkering van kindgebonden budget met betrekking tot de berekeningsjaren 2013 tot en met 2017 door de Dienst
      Toeslagen in het kader van de herstelactie kindgebonden budget.

      2 De termijn gedurende welke het bedrag van de uitkering, genoemd in het eerste lid, onderdeel l, wordt afgetrokken
      van de vermogensgrondslag, bedoeld in [artikel 3.3.1.2, tweede en derde lid, van het Besluit][ref10], bedraagt een
      jaar, welke termijn aanvangt in het kalenderjaar dat volgt op het jaar waarin de uitkering is verkregen.

      3 De termijn gedurende welke het bedrag van de uitkering, genoemd in het eerste lid,
      onderdeel e tot en met g, wordt afgetrokken van de vermogensgrondslag, bedoeld in
      [artikel 3.3.1.2, tweede en derde lid, van het Besluit][ref11], bedraagt drie jaar, welke termijn aanvangt in het
      kalenderjaar dat volgt op het jaar waarin de uitkering is verkregen.

      4 De termijn gedurende welke het bedrag van de uitkering, genoemd in het eerste lid,
      onderdelen b, c, d, h, i, j en k, wordt afgetrokken van de vermogensgrondslag, bedoeld in
      [artikel 3.3.1.2, tweede en derde lid, van het Besluit][ref12], bedraagt tien jaar, welke termijn aanvangt in het
      kalenderjaar dat volgt op het jaar waarin de uitkering is verkregen.


