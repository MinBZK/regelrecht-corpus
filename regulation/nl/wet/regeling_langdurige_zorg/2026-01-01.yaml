  - number: '5.16'
    text: |-
      1 De verzekerde sluit een schriftelijke overeenkomst met iedere zorgaanbieder of mantelzorger die hij ten
      laste van zijn persoonsgebonden budget zorg laat verlenen, behalve voor zover reeds vervoer bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel f, van de wet][ref1] van die zorgaanbieder of mantelzorger is betrokken.

      2 Zorgovereenkomsten worden opgesteld volgens de meest recente door de Sociale verzekeringsbank vigerende
      vastgestelde toepasselijke modelovereenkomsten, die beschikbaar waren gesteld ten tijde van het afsluiten van de
      zorgovereenkomst, en bevatten bovendien ten minste:

      a. de wijze waarop de zorgaanbieder of mantelzorger voorziet in de behoefte aan zorg van de verzekerde;

      b. de verplichting dat een declaratie de vereiste gegevens, bedoeld in [artikel 5.23, tweede lid][ref2], bevat of,
      indien van toepassing, dat wordt gebruikgemaakt van periodiek maandbetalingen;

      c. een beding, inhoudende dat het zorgkantoor een vordering heeft op de persoon die ten laste van het
      persoonsgebonden budget zorg levert indien het persoonsgebonden budget naar aanleiding van toerekenbaar handelen
      van die persoon is ingetrokken of herzien, ter hoogte van het bedrag dat gelijk is aan het door die persoon vanwege
      dat toerekenbaar handelen ten laste van het persoonsgebonden budget ten onrechte ontvangen bedrag;

      d. indien de uitkering van vakantiebijslag als bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref3] van
      toepassing is, een beding, inhoudende dat in het te betalen bruto loon het vakantiegeld is verdisconteerd.

      3 De overeenkomst, bedoeld in het eerste lid, behoeft de goedkeuring van het zorgkantoor en de Sociale
      verzekeringsbank.

      4 Het zorgkantoor kan de goedkeuring slechts geven, indien:

      a. de zorgovereenkomst voldoet aan de eisen, bedoeld in het tweede lid;

      b. uit de omschrijving van de wijze waarop de zorgverlener voorziet in de behoefte aan zorg van de verzekerde,
      blijkt dat de overeenkomst:

      1° strekt tot de inkoop van persoonlijke verzorging, verpleging, begeleiding, huishoudelijke hulp en vervoer naar
      een plaats waar de verzekerde gedurende een dagdeel begeleiding of behandeling ontvangt;

      2° strekt tot inkoop van logeeropvang; of

      3° betrekking heeft op de kosten van zorginfrastructuur als bedoeld in
      [artikel 5.17, eerste lid, onderdeel b][ref4].

      5 De Sociale verzekeringsbank kan haar goedkeuring slechts onthouden wegens strijd met het recht, of in
      het belang van de uitvoerbaarheid van het persoonsgebonden budget of van het budgetbeheer, bedoeld in
      [artikel 3.3.3, zevende lid, van de wet][ref5].

      6 Een wijziging van een goedgekeurde zorgovereenkomst wordt onmiddellijk met een formulier aan de Sociale
      verzekeringsbank kenbaar gemaakt door middel van invulling van een daartoe door de Sociale verzekeringsbank
      beschikbaar gesteld modelformulier.

      7 Voor de toepassing van het derde, vijfde en zesde lid treedt een door de Minister van Volksgezondheid, Welzijn
      en Sport aangewezen zorgkantoor in de plaats van de Sociale verkeringsbank voor zover het de goedkeuring van de
      zorgovereenkomst van een verzekerde aan wie het zorgkantoor een persoonsgebonden budget verleent en het kenbaar
      maken van een wijziging van die zorgovereenkomst betreft. Het zorgkantoor bericht de Sociale verzekeringsbank
      onmiddellijk van een wijziging van de zorgovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
