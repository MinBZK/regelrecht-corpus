  - number: '5.17'
    text: |-
      1 Het persoonsgebonden budget mag uitsluitend worden gebruikt voor het door de Sociale verzekeringsbank, op verzoek
      van de verzekerde, doen van betalingen:

      a. voor zorg als bedoeld in [artikel 3.3.3 van de wet][ref1], of

      b. voor de kosten van zorginfrastructuur en infectieziektepreventie van een kleinschalig wooninitiatief met een
      maximum van € 5.961, of

      c. aan de verzekerde met een maximum van 1,5% van het voor dat jaar verleende persoonsgebonden budget met een
      minimum van € 250 en een maximum van € 1.250, of

      d. voor zorg die, in de periode van 1 maart 2020 tot en met 30 juni 2020, of, voor zover het zorg in een
      kleinschalig wooninitiatief, dagbesteding of vervoer ten behoeve van dagbesteding betreft, in de periode van
      1 maart 2020 tot en met 31 juli 2020, als gevolg van de maatregelen in verband met Covid-19, door de desbetreffende
      zorgaanbieder of mantelzorger die ten laste van het persoonsgebonden budget zorg verleent, niet is verleend, of

      e. voor zorg die, in de periode van 1 oktober 2020 tot en met 31 december 2021, door de desbetreffende
      zorgaanbieder of mantelzorger die ten laste van het persoonsgebonden budget zorg verleent, niet is verleend in
      verband met:

      1°. een besmetting van de budgethouder of diens zorgaanbieder of mantelzorger, werkzaam op basis van een
      overeenkomst van opdracht, met Covid-19;

      2°. een noodzakelijke quarantaine van de budgethouder of diens zorgaanbieder of mantelzorger in verband met Covid-
      19;

      3°. een besmetting met Covid-19 op de dagbesteding;

      4°. de door een dagbesteding overeenkomstig de bij of krachtens de [Tijdelijke wet maatregelen covid-19][ref2]
      genomen maatregelen; of

      5°. het niet kunnen verlenen overeenkomstig de maatregelen in verband
      met Covid-19 vanwege een beperking bij de budgethouder als bedoeld in
      [artikel 6.6, tweede lid, onderdelen d en e, van de Tijdelijke regeling maatregelen covid-19][ref3]; of

      f. voor kosten die een kleinschalig wooninitiatief, waarvan de zorginkomsten vanwege Covid-19 of daarmee
      samenhangende sterfte onder verzekerden en leegstand zodanig zijn teruggelopen dat het wooninitiatief in financiële
      nood is geraakt, in de periode van 1 maart 2020 tot en met 31 december 2021 heeft gehad om de zorgverlening aan
      verzekerden te continueren, of

      g. voor zorg die door desbetreffende zorgaanbieder of mantelzorger als gevolg van het ontvangen van een vaccinatie
      voor Covid-19, voor ten hoogste twee uur, niet is verleend, of

      h. voor bijkomende zorgkosten die onlosmakelijk verbonden zijn aan de zorgverlening aan de budgethouder, waaronder
      in elk geval:

      1°. de consumpties van de zorgverlener met een arbeidsovereenkomst, indien deze kosten zijn gemaakt als gevolg van
      overwerk bij desbetreffende budgethouder. De zorgverlener maakt hierbij geen onderdeel uit van het cliëntsysteem
      van de budgethouder;

      2°. een cursus van de zorgverlener van ten hoogste 12 maanden die direct verband houdt met de beperkingen van
      desbetreffende budgethouder;

      3°. entreegeld voor de zorgverlener, indien zorg wordt geleverd op een locatie waar men entreegeld moet betalen. De
      zorgverlener maakt hierbij geen onderdeel uit van het cliëntsysteem van de budgethouder.

      2 In afwijking van het eerste lid, onderdeel a, kan het persoonsgebonden budget worden besteed aan kosten van
      vervoer naar een plaats waar de verzekerde gedurende een dagdeel begeleiding in groepsverband of behandeling in
      groepsverband ontvangt, indien:

      a. de zorgaanbieder niet verantwoordelijk is voor dat vervoer op grond van een inkoopafspraak met de Wlz-
      uitvoerder; of

      b. het zorgkantoor vooraf toestemming heeft verleend.

      3 Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op
      een andere dag dan 31 december eindigt, worden de bedragen, genoemd in het eerste lid, onder b en c, voor dat
      kalenderjaar vermenigvuldigd met een breuk waarvan de teller bestaat uit het aantal dagen van de subsidieperiode in
      het desbetreffende kalenderjaar en de noemer uit het aantal dagen in dat kalenderjaar.


