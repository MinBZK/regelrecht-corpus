  - number: '5.8'
    text: |-
      1 De aanvraag gaat vergezeld van een budgetplan dat is ingericht volgens het door het zorgkantoor vastgestelde
      model.

      2 De verzekerde die aan het zorgkantoor een persoonlijk plan wil overhandigen wordt daartoe door het zorgkantoor in
      staat gesteld gedurende zeven dagen na ontvangst van een volledige aanvraag.

      3 Het zorgkantoor nodigt de verzekerde of diens vertegenwoordiger uit om de aanvraag met het zorgkantoor te
      bespreken.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.8
  - number: 5.8a
    text: |-
      Het zorgkantoor stelt aan de hand van het budgetplan, bedoeld in [artikel 5.8, eerste lid][ref1], en het gesprek,
      bedoeld in artikel 5.8, derde lid, de bij de zorgvraag passende zorginzet van de verzekerde vast en verleent
      met inachtneming van het basisbedrag, bedoeld in [artikel 5.1, tweede lid][ref2], een op die zorginzet afgestemd
      persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel5.8
      [ref2]: https://wetten.overheid.nl/BWBR0036014#Artikel5.1
