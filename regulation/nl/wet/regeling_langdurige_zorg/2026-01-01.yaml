  - number: '9.8'
    text: |-
      1 Het in het indicatiebesluit opgenomen zorgzwaartepakket van de verzekerde, bedoeld in
      [artikel 11.1.1, eerste lid, van de wet][ref1] wordt met ingang van de datum waarop de
      [Algemene Wet Bijzondere Ziektekosten][ref2] is ingetrokken, met toepassing van [bijlage A][ref3] bij
      deze regeling ambtshalve omgezet in een bij de verzekerde best passende zorgprofiel als bedoeld in
      [artikel 3.1.1, eerste lid, van het Besluit][ref4].

      2 Het in het indicatiebesluit opgenomen zorgzwaartepakket van de verzekerde, bedoeld in
      [artikel 11.1.1, tweede lid, van de wet][ref5] wordt met ingang van de datum waarop de
      [Algemene Wet Bijzondere Ziektekosten][ref6] is ingetrokken, met toepassing van [bijlage F][ref7] bij deze regeling
      ambtshalve omgezet in een bij de verzekerde best passend zorgprofiel.

      3 Het in het indicatiebesluit opgenomen zorgzwaartepakket van de verzekerde, bedoeld in
      [artikel 11.1.1, derde lid, van de wet][ref8] wordt eerst met ingang van de datum waarop hij in een instelling is
      gaan verblijven overeenkomstig het tweede lid ambtshalve omgezet in een bij de verzekerde best passend zorgprofiel.

      4 [Artikel 3.2.5 van het Besluit][ref9] en [artikel 3.2][ref10] zijn van overeenkomstige toepassing op de
      verzekerden, bedoeld in het eerste lid.

      5 [Artikel 3.2.5 van het Besluit][ref11] is van overeenkomstige toepassing op de verzekerden, bedoeld in het tweede
      en derde lid.

      6 Met betrekking de omzetting, bedoeld in het derde lid, is [artikel 9.1.2 van de wet][ref12] van overeenkomstige
      toepassing.


