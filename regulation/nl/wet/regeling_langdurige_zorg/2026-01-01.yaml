  - number: '9.4'
    text: |-
      Een verzekerde die onmiddellijk voorafgaande aan de intrekking van de [Algemene Wet Bijzondere Ziektekosten][ref1]
      voortgezet verblijf als bedoeld in [artikel 13 van het Besluit zorgaanspraken AWBZ][ref2] ontving zonder over
      een indicatie voor een zorgzwaartepakket B GGZ te beschikken, behoudt totdat de met het verblijf gepaard gaande
      geneeskundige zorg voor hem niet meer medisch noodzakelijk is zijn recht op dat voortgezet verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel13
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel9.4
