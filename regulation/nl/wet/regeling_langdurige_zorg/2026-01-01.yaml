    text: |-
      1 Indicatiebesluiten als bedoeld in [artikel 11.1.1, zesde lid][ref1], en
      [artikel 3.2.2, eerste lid, van de wet][ref2], worden genomen zonder het onderzoek van de verzekerde in persoon,
      bedoeld in [artikel 3.2.2 van het besluit][ref3].

      2 Indicatiebesluiten kunnen tevens zonder het onderzoek van de verzekerde in persoon, bedoeld in
      [artikel 3.2.2 van het besluit][ref4], worden genomen indien het gaat om een aanvraag voor:

      a. het zorgprofiel VV Beschermd wonen met intensieve dementiezorg ten aanzien van een verzekerde die reeds een
      indicatiebesluit heeft voor VV Beschut wonen met intensieve begeleiding en uitgebreide verzorging;

      b. het zorgprofiel VV Beschermd wonen met intensieve verzorging en verpleging ten aanzien van een verzekerde die
      reeds een indicatiebesluit heeft voor VV Beschut wonen met intensieve begeleiding en uitgebreide verzorging;

      c. het zorgprofiel VV Beschermd wonen met zeer intensieve zorg, vanwege specifieke aandoeningen, met de nadruk
      op begeleiding ten aanzien van een verzekerde die reeds een indicatiebesluit heeft voor VV Beschermd wonen met
      intensieve dementiezorg.

      3 Voorafgaande aan het onderzoek, bedoeld in [artikel 3.2.2 van het Besluit][ref5], of indien een dergelijk
      onderzoek niet nodig is, voorafgaand aan het nemen van een indicatiebesluit, vergewist het CIZ zich ervan dat
      degene voor wie het indicatiebesluit is aangevraagd, verzekerd is.


