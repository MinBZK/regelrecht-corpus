  - number: '5.4'
    text: |-
      Het zorgkantoor verleent slechts een persoonsgebonden budget voor verzekerden die woonachtig zijn in de regio van
      het zorgkantoor.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      Een persoonsgebonden budget wordt niet verleend aan een verzekerde die:

      a. krachtens zijn indicatiebesluit is aangewezen op zorgprofiel:

        - VV Herstelgerichte behandeling met verpleging en verzorging,
        - LVG Wonen met intensieve behandeling en begeleiding, kleine groep,
        - LVG Wonen met zeer intensieve behandeling en begeleiding,
        - LVG Besloten wonen met zeer intensieve behandeling en begeleiding, of
        - LVG Behandeling in een SGLVG behandelcentrum, of
        - GGZ Beveiligd wonen vanwege extreme gedragsproblematiek met zeer intensieve begeleiding, of

      b. op 31 december 2014 recht had op zorgzwaartepakket 9b VV, 3 LVG, 4 LVG, 5 LVG of 1 SGLVG; of

      c. krachtens zijn indicatiebesluit is aangewezen op zorgprofiel LVG wonen met enige behandeling en begeleiding of
      LVG wonen met behandeling en begeleiding, tenzij de verzekerde op 31 december 2019 krachtens zijn indicatiebesluit
      was aangewezen op een van die zorgprofielen en hiervoor een persoonsgebonden budget ontving.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.5
  - number: '5.7'
    text: |-
      1 Het zorgkantoor verleent een verzekerde een persoonsgebonden budget indien de subsidieperiode waarvoor het wordt
      aangevraagd:

      a. met een onderbreking van niet meer dan eenendertig kalenderdagen aansluit op een eerdere subsidieperiode waarin
      de verzekerde een persoonsgebonden budget ontving, of

      b. aansluit op een periode waarin de verzekerde verbleef in een instelling als bedoeld in de wet of de
      [Zorgverzekeringswet][ref1] en dit verblijf aansloot op een eerdere subsidieperiode voor een persoonsgebonden
      budget.

      2 De [artikelen 5.5][ref2], [5.8][ref3] en [5.9, onder a][ref4], zijn niet van toepassing op het verlenen van een
      persoonsgebonden budget met toepassing van het eerste lid.


