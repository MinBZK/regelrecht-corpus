  - number: '9.17'
    text: |-
      1 De verzekerde, bedoeld in [artikel 9.14, eerste lid][ref1], die er niet voor kiest met ingang van 1 januari
      2018 voor de toepassing van de wet gelijk te worden gesteld met een verzekerde ten aanzien van wie het CIZ
      heeft vastgesteld dat hij voldoet aan [artikel 3.2.1, eerste lid, van de wet][ref2] heeft in afwijking van
      [artikel 3.3.1, eerste lid, van de wet][ref3] vanaf 1 januari 2018 slechts recht op zorg met verblijf in een
      instelling.

      2 Het eerste lid geldt niet voor de verzekerde van wie het CIZ na inwerkingtreding van deze regeling op aanvraag
      heeft vastgesteld dat hij voldoet aan [artikel 3.2.1, eerste lid, van de wet][ref4].


