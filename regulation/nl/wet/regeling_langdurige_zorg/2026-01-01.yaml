    text: |-
      De zorgprofielen, bedoeld in [artikel 3.1.1, eerste lid, van het Besluit][ref1], zijn opgenomen in
      [bijlage A][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0036014
