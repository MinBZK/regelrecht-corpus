  - number: 10.1a
    text: |-
      1 Het Zorginstituut verstrekt aan het landelijk politiekorps, bedoeld in
      [artikel 25, eerste lid, van de Politiewet 2012][ref1], uitkeringen ter vergoeding van de kosten van zorg als
      bedoeld in [artikel 3.1.1, eerste lid, van de wet][ref2] verleend door zorgaanbieders aan personen die zijn
      opgenomen in het stelsel van Bewaken & Beveiligen van het Openbaar Ministerie en aan wie de maatregel anonimiteit
      is opgelegd.

      2 De in het eerste lid bedoelde uitkeringen worden uitsluitend verstrekt op verzoek van het landelijk politiekorps,
      bedoeld in het eerste lid.


