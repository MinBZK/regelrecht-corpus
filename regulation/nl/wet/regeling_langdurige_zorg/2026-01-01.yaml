        bwb_id: BWBR0036014
  - number: '5.1'
    text: |-
      1 Een modulair pakket thuis, persoonsgebonden budget of een combinatie hiervan kan slechts worden toegekend indien
      de zorg op een verantwoorde en doelmatige wijze ten huize van de verzekerde kan worden verleend.

      2 Voor het persoonsgebonden budget is het basisbedrag, genoemd in [bijlage H][ref1], beschikbaar, verminderd met de
      kosten van het modulair pakket thuis voor huishoudelijke hulp, persoonlijke verzorging, verpleging, logeeropvang,
      individuele begeleiding en begeleiding in groepsverband en vervoer.

      3 Indien de verzekerde kiest voor deeltijdverblijf, wordt het basisbedrag berekend naar rato van het aantal etmalen
      per week dat de verzekerde zorg thuis organiseert.

      4 De toepassing van het derde lid heeft geen betrekking op het basisbedrag dat volgens de bedragen in
      [Bijlage H][ref2] beschikbaar is voor begeleiding in groepsverband en vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0036014
      [ref2]: https://wetten.overheid.nl/BWBR0036014
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0036014
      - id: ref2
        bwb_id: BWBR0036014
  - number: 5.1a
    text: |-
      Alvorens de levering van een modulair pakket thuis of verlening van een persoonsgebonden budget te weigeren op
      de grond dat het niet op doelmatige wijze ten huize van de verzekerde kan worden geleverd, en nadat daarover
      overleg is gevoerd met de verzekerde, beoordeelt de Wlz-uitvoerder of het zorgkantoor of deze weigering wegens
      ondoelmatigheid kan worden vermeden door verhoging van het basisbedrag met ten hoogste 25%.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.1a
  - number: 5.1b
    text: |-
      1 De Wlz-uitvoerder gaat bij het beoordelen van de kosten van het modulair pakket thuis voor behandeling als
      bedoeld in [artikel 3.1.1, eerste lid, onderdeel c, van de wet][ref1] uit van een normatief kader gebaseerd op
      de per zorgprofiel beschikbare ruimte voor behandeling binnen de tarieven voor het volledig pakket thuis met
      behandeling.

      2 De Wlz-uitvoerder beoordeelt of weigering van de levering van een modulair pakket thuis wegens ondoelmatigheid
      kan worden vermeden door verhoging van het normatief kader, bedoeld in het eerste lid, met ten hoogste 25%.

      3 De Wlz-uitvoerder beoordeelt de aanvraag voor behandeling in groepsverband in samenhang met de aanvraag voor
      begeleiding in groepsverband.

      4 Indien naar het oordeel van de Wlz-uitvoerder meer behandeling nodig is om te voorzien in de behoefte van
      de verzekerde, kan de Wlz-uitvoerder het meerdere toekennen indien er ruimte resteert binnen het beschikbare
      basisbedrag, eventueel verhoogd door toepassing van [artikel 5.1a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0036014#Artikel5.1a
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.1b
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: 3.1.1
      - id: ref2
        bwb_id: BWBR0036014
        artikel: 5.1a
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.1c
    text: |-
      1 De Wlz-uitvoerder kan extra kosten toestaan in het geval dat een verzekerde is aangewezen op palliatief terminale
      zorg, voor zover die verhoging nodig is met het oog op de mogelijkheid van de verzekerde om palliatief terminale
      zorg thuis te ontvangen.

      2 Het zorgkantoor kan het persoonsgebonden budget verhogen in het geval dat een verzekerde is aangewezen op
      palliatief terminale zorg, voor zover die verhoging nodig is met het oog op de mogelijkheid van de verzekerde om
      palliatief terminale zorg thuis te ontvangen.

      3 De Wlz-uitvoerder kan extra kosten toestaan in het geval dat een verzekerde een tijdelijke behoefte heeft aan
      verpleging die noodzakelijk is vanwege een medisch specialistische behandeling, voor zover die verhoging nodig is
      met het oog op de mogelijkheid van de verzekerde om die verpleging te ontvangen.

      4 Het zorgkantoor kan het persoonsgebonden budget verhogen in het geval dat een verzekerde een tijdelijke behoefte
      heeft aan verpleging die noodzakelijk is vanwege een medisch specialistische behandeling, voor zover die verhoging
      nodig is met het oog op de mogelijkheid van de verzekerde om die verpleging te ontvangen.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.1c
  - number: 5.1d
    text: |-
      1 De Wlz-uitvoerder kan extra kosten toestaan indien de verzekerde jonger dan 18 jaar een behoefte heeft aan
      begeleiding in groepsverband, behandeling in groepsverband of individuele behandeling die naar het oordeel van de
      Wlz-uitvoerder noodzakelijk is voor de ontwikkeling van het kind.

      2 Het zorgkantoor kan het persoonsgebonden budget verhogen indien de verzekerde jonger dan 18 jaar een behoefte
      heeft aan begeleiding in groepsverband die naar het oordeel van het zorgkantoor noodzakelijk is voor de
      ontwikkeling van het kind.

      3 De Wlz-uitvoerder kan extra kosten toestaan indien de verzekerde een behoefte heeft aan logeeropvang waarbij,
      naar het oordeel van de Wlz-uitvoerder, extra kosten noodzakelijk zijn.

      4 Het zorgkantoor kan het persoonsgebonden budget verhogen indien de verzekerde een behoefte heeft aan logeeropvang
      waarbij, naar het oordeel van de Wlz-uitvoerder, extra kosten noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.1d
  - number: 5.1e
    text: |-
      1 De Wlz-uitvoerder kan op verzoek van de verzekerde een aanvraag voor meerzorg als bedoeld in [artikel 2.2][ref1]
      starten, indien de verzekerde een zorgbehoefte heeft waarvan de kosten het bedrag overstijgen dat beschikbaar is
      na toepassing van de [artikelen 5.1 tot en met 5.1d][ref2] en de verzekerde voldoet aan de voorwaarden genoemd in
      artikel 2.2, eerste of tweede lid.

      2 Het zorgkantoor kan op verzoek van de verzekerde een aanvraag voor meerzorg als bedoeld in [artikel 2.2][ref3]
      starten, indien de verzekerde een zorgbehoefte heeft waarvan de kosten het bedrag overstijgen dat beschikbaar is
      na toepassing van de [artikelen 5.1 tot en met 5.1d][ref4] en de verzekerde voldoet aan de voorwaarden genoemd in
      artikel 2.2, eerste of tweede lid.

      3 De Wlz-uitvoerder kan onder daarbij te stellen voorwaarden in het voordeel van de verzekerde afwijken van de
      bedragen genoemd in [bijlage H][ref5] indien de verzekerde naar het oordeel van de Wlz-uitvoerder aanspraak heeft
      op meer zorg als bedoeld in [artikel 2.2][ref6] van deze regeling.

      4 Het zorgkantoor kan onder daarbij te stellen voorwaarden in het voordeel van de verzekerde afwijken van de
      bedragen genoemd in [bijlage H][ref7] indien de verzekerde naar het oordeel van het zorgkantoor aanspraak heeft op
      meer zorg als bedoeld in [artikel 2.2][ref8] van deze regeling.


