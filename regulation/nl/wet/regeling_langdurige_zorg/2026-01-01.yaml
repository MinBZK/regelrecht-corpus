  - number: '5.12'
    text: |-
      Het persoonsgebonden budget wordt verleend voor een subsidieperiode die:

      a. niet eerder aanvangt dan de dag met ingang waarvan de verzekerde volgens zijn indicatiebesluit op de zorg is
      aangewezen waarvoor het persoonsgebonden budget wordt verleend, en

      b. eindigt met ingang van de dag waarop het indicatiebesluit zijn geldigheidsduur verliest, doch uiterlijk op
      31 december van het jaar waarin het persoonsgebonden budget werd verleend.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.12
  - number: '5.13'
    text: |-
      1 Het zorgkantoor verhoogt het persoonsgebonden budget met € 5.961 voor een verzekerde die woont in een
      kleinschalig wooninitiatief.

      2 Het zorgkantoor verhoogt het persoonsgebonden budget met € 5.345 voor een verzekerde die woont in een
      kleinschalig wooninitiatief en:

      a. krachtens zijn indicatiebesluit is aangewezen op zorgprofiel:

        - VV Beschut wonen met intensieve begeleiding en uitgebreide verzorging;
        - VV Beschermd wonen met intensieve dementiezorg;
        - VV Beschermd wonen met intensieve verzorging en verpleging;
        - VV Beschermd wonen met zeer intensieve zorg, vanwege specifieke aandoeningen, met de nadruk op begeleiding; of
        - VV Beschermd wonen met zeer intensieve zorg, vanwege specifieke aandoeningen, met de nadruk op verzorging/
      verpleging; of

      b. op 31 december 2014 recht had op zorgzwaartepakket 4 VV, 5 VV, 6 VV, 7 VV en 8 VV.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.13
  - number: '5.14'
    text: |-
      Indien een subsidieperiode met ingang van een andere dag dan 1 januari van een kalenderjaar aanvangt of op een
      andere dag dan 31 december eindigt, wordt het maximum persoonsgebonden budget vermenigvuldigd met een breuk waarvan
      de teller bestaat uit het aantal dagen van de subsidieperiode in het desbetreffende kalenderjaar en de noemer uit
      het aantal dagen in dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.14
  - number: '5.15'
    text: |-
      1 Het zorgkantoor hoogt het persoonsgebonden budget op tot een garantiebedrag ter hoogte van 105,17% van
      het persoonsgebonden budget dat was verleend voor de subsidieperiode die eindigde op 31 december 2025,
      indien de verzekerde volgens het indicatiebesluit was aangewezen op verblijf zoals dat gold onder de
      [Algemene Wet Bijzondere Ziektekosten][ref1], en

      a. het persoonsgebonden budget bij de eerste verlening op basis van een indicatiebesluit waaruit bleek dat de
      verzekerde was aangewezen op een zorgzwaartepakket, op grond van een beleidsregel van het College zorgverzekeringen
      of op grond van [artikel 2.6.15 van de Regeling subsidies AWBZ][ref2], zoals dat artikel luidde voor 1 januari
      2013, was opgehoogd tot een garantiebedrag of

      b. aan de verzekerde in 2012 een persoonsgebonden budget is verleend op basis van een indicatiebesluit krachtens
      de [Algemene Wet Bijzondere Ziektekosten][ref3] waaruit bleek dat de verzekerde aangewezen was op verblijf en de
      verzekerde vanaf 30 december 2012 ononderbroken woonachtig was in een kleinschalig wooninitiatief.

      2 Indien de aanvraag betrekking heeft op minder of andere vormen van zorg, dan het persoonsgebonden budget dat
      in 2025 is verleend, wordt een garantiebedrag als bedoeld in het eerste lid verminderd met het verschil tussen de
      budgetten waartoe die vormen van zorg leiden.

      3 Indien de aanvraag voor een persoonsgebonden budget is gebaseerd op een ander indicatiebesluit dan de verlening
      van het persoonsgebonden budget in 2025 en de verzekerde volgens het indicatiebesluit is aangewezen op een
      zorgprofiel dat leidt tot een lager persoonsgebonden budget dan in 2025 is verleend, wordt een garantiebedrag
      als bedoeld in het eerste lid verminderd met het verschil tussen de persoonsgebonden budgetten waartoe die
      zorgprofielen leiden.

      4 Het eerste lid, onder a, is alleen van toepassing indien aan de verzekerde, vanaf de eerste verlening van
      een persoonsgebonden budget op basis van een indicatiebesluit waaruit bleek dat hij was aangewezen op een
      zorgzwaartepakket, in ieder opvolgende subsidieperiode een persoonsgebonden budget is verleend, al dan niet na een
      onderbreking als bedoeld in het vijfde lid, onder a of b.

      5 Het eerste lid, onder b, is alleen van toepassing indien de subsidieperiode waarvoor een persoonsgebonden budget
      wordt aangevraagd:

      a. met een onderbreking van niet meer dan eenendertig kalenderdagen, aansluit op een eerdere subsidieperiode, of

      b. aansluit op een periode waarin de verzekerde verbleef in een instelling als bedoeld in de wet of de
      [Zorgverzekeringswet][ref4] en dit verblijf aansloot op een eerdere subsidieperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.15
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0018450
