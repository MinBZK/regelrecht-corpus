  - number: '7.1'
    text: |-
      Als persoonsgegevens, waaronder gegevens over gezondheid, die voor Wlz-uitvoerders noodzakelijk zijn voor de
      uitvoering van de wet, worden in ieder geval aangemerkt:

      a. naam, adres, postcode en woonplaats;

      b. inschrijving- of verzekerdennummer, burgerservicenummer, geslacht en geboortedatum;

      c. een afgegeven indicatiebesluit;

      d. het zorgprofiel, waarop iemand krachtens indicatiebesluit is aangewezen;

      e. de prestatiebeschrijving van de aan de verzekerde te leveren of geleverde prestatie;

      f. wanneer de prestatie is aangevangen, gewijzigd en is beëindigd;

      g. het voor de geleverde prestatie in rekening gebrachte tarief;

      h. de gegevens die op grond van een declaratieregeling, bedoeld in
      [artikel 38, derde lid, onder b, van de Wet marktordening gezondheidszorg][ref1], moeten worden verstrekt;

      i. de gegevens die noodzakelijk zijn om vast te stellen of de prestatie behoort tot het op grond van de wet
      verzekerde pakket;

      j. het bank- of gironummer, en

      k. overige gegevens die noodzakelijk zijn voor het verrichten van een materiële controle als bedoeld in
      [artikel 7.2][ref2], dan wel voor het verrichten van fraudeonderzoek als bedoeld in [artikel 7.10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0036014#Artikel7.2
      [ref3]: https://wetten.overheid.nl/BWBR0036014#Artikel7.10
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0036014
