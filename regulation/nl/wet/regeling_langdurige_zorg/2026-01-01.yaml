  - number: '6.2'
    text: |-
      1 Het financieel verslag van het CAK als bedoeld in [artikel 6.2.6, eerste lid, van de wet][ref1] bevat een
      financiële verantwoording over de uitvoering van de wet, volgens een door de zorgautoriteit aangegeven model.

      2 Het uitvoeringsverslag van het CAK als bedoeld in [artikel 6.2.6, tweede lid, van de wet][ref2] bevat een
      verantwoording over de uitvoering van de wet, volgens een door de zorgautoriteit aangegeven model.

      3 De inhoud en inrichting van de verklaring en van het accountantsverslag als bedoeld in
      [artikel 4.3.1, tweede lid][ref3], en van het accountantsverslag als bedoeld in [artikel 4.3.2, derde lid][ref4],
      van de wet geschiedt volgens een door de zorgautoriteit aangegeven model.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel6.2.6
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel4.3.1
      [ref4]: https://wetten.overheid.nl/BWBR0035917#Artikel4.3.2
