  - number: 5.7a
    text: |-
      1 Bij de toepassing van een persoonsgebonden budget als bedoeld in [artikel 3.3.6 van de wet][ref1] zijn de
      [artikelen 5.9, onderdeel a][ref2], [5.18, eerste lid, onderdeel c][ref3], en [5.22, tweede lid][ref4], niet van
