  - number: '3.2'
    text: |-
      1 De geldigheidsduur van een indicatiebesluit wordt vastgesteld op ten hoogste drie jaar indien het een van de
      volgende zorgprofielen betreft:

        - LVG wonen met enige behandeling en begeleiding,
        - LVG wonen met behandeling en begeleiding,
        - LVG wonen met intensieve behandeling en begeleiding,
        - LVG wonen met zeer intensieve behandeling en begeleiding, en
        - LVG besloten wonen met zeer intensieve behandeling en begeleiding,
        - LVG behandeling in een SGLVG behandelcentrum;

      2 De geldigheidsduur van een indicatiebesluit wordt vastgesteld op ten hoogste drie jaar indien het een van de
      volgende zorgprofielen betreft:

        - GGZ-B voortgezet verblijf met intensieve begeleiding,
        - GGZ-B voortgezet verblijf met intensieve begeleiding en verzorging,
        - GGZ-B voortgezet verblijf met intensieve begeleiding en gedragsregulering,
        - GGZ-B voortgezet verblijf met intensieve begeleiding en intensieve verpleging en verzorging,
        - GGZ-B beveiligd voortgezet verblijf vanwege extreme gedragsproblematiek met zeer intensieve begeleiding.

      3 De geldigheidsduur van een indicatiebesluit voor het zorgprofiel VV herstelgerichte behandeling met verpleging en
      verzorging wordt vastgesteld op ten hoogste zes maanden.

      4 De bepaling van de geldigheidsduur vindt plaats met inachtneming van de beperkingen van de verzekerde en
      veranderingen die zich daarin kunnen voordoen, behoudens het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 Een besluit van het CIZ als bedoeld in [artikel 5.2.1 van het besluit][ref1], op basis van de
      [Tijdelijke subsidieregeling extramurale behandeling][ref2], heeft een geldigheidsduur van ten hoogste vijf jaar.

      2 In afwijking van het eerste lid, heeft een besluit een geldigheidsduur van ten hoogste:

      a. twee jaar, indien het betreft behandeling gericht op herstel of het aanleren van vaardigheden of gedrag

      b. drie maanden, indien het betreft:

      1°. aanvullende functionele diagnostiek;

      2°. consultatie;

      c. een jaar, indien het medebehandeling betreft.

      3 De geldigheidsduur bedoeld in het eerste en tweede lid, wordt vastgesteld met inachtneming van:

      a. de beperkingen van de verzekerde en de veranderingen die zich daarin kunnen voordoen;

      b. het bereiken van een leeftijd van de verzekerde die van invloed kan zijn op de aanspraak.

      4 Verzekerden met een somatische aandoening, met een psychogeriatrische aandoening, met een lichamelijke
      beperking of, indien het meerderjarige verzekerden betreft, met een verstandelijke beperking, die
      op 31 december 2014 beschikken over een indicatiebesluit voor extramurale behandeling op grond van
      [artikel 8 van het Besluit zorgaanspraken AWBZ][ref3] en het medisch noodzakelijk vervoer op grond van
      [artikel 10 van het Besluit zorgaanspraken AWBZ][ref4] welke besluiten naar het recht van 31 december
      2014 op 1 januari 2015 nog geldig zouden zijn, worden aangemerkt als verzekerden met besluiten, bedoeld in
      [artikel 5.2.1. van het besluit][ref5].


