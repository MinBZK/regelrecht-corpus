  - number: '5.21'
    text: |-
      1 Na afloop van iedere subsidieperiode wordt de subsidie voor de desbetreffende subsidieperiode vastgesteld.

      2 Het zorgkantoor stelt het persoonsgebonden budget binnen een half jaar na afloop van de subsidieperiode vast.

      3 Het persoonsgebonden budget wordt vastgesteld op de som van de bedragen die de Sociale verzekeringsbank op grond
      van [artikel 5.17, eerste lid][ref1], heeft uitbetaald.

      4 Indien de verzekerde geen betalingen, als bedoeld in [artikel 5.17, eerste lid, onder a en b][ref2], heeft laten
      doen dan wordt de subsidie, in afwijking van het derde lid, vastgesteld op nihil.


