  - number: '2.3'
    text: |-
      1 Als mobiliteitshulpmiddelen voor individueel gebruik als bedoeld in
      [artikel 3.1.2, eerste lid, van het Besluit][ref1], worden aangewezen:

      a. een rolstoel;

      b. een scootmobiel;

      c. een niet algemeen gebruikelijke fiets;

      d. een niet algemeen gebruikelijke buggy en duwwandelwagen voor minderjarige verzekerden;

      e. een niet algemeen gebruikelijk autostoeltje voor minderjarige verzekerden.

      2 Het recht op het individueel gebruik van een mobiliteitshulpmiddel als bedoeld in het eerste lid, onder a, b, c
      en d bestaat indien dat gebruik is aangewezen in verband met het ontbreken van de loopfunctie dan wel in verband
      met blijvende of langdurige loopfunctiestoornissen. Indien de verzekerde daarop is aangewezen, kan een tweede
      exemplaar in een andere uitvoering worden verstrekt.

      3 Het recht op het individueel gebruik van een mobiliteitshulpmiddel als bedoeld in het eerste lid, onder e,
      bestaat voor zover de minderjarige verzekerde gelet op zithouding en veiligheid hierop is aangewezen.

      4 Het individueel gebruik van een mobiliteitshulpmiddel omvat tevens de voor de verzekerde noodzakelijke aanpassing
      en vervanging alsmede het noodzakelijke onderhoud en herstel van de hem in gebruik gegeven mobiliteitshulpmiddel.

      5 Voorafgaand aan het verstrekken van een mobiliteitshulpmiddel is toestemming van de Wlz-uitvoerder nodig. De Wlz-
      uitvoerder beoordeelt welk mobiliteitshulpmiddel het meest is aangewezen.

      6 Indien het recht op zorg krachtens de wet eindigt omdat hij krachtens een zorgverzekering of een andere
      wettelijke regeling recht heeft of kan doen gelden op die zorg, behoudt de verzekerde het recht op het individueel
      gebruik van een reeds in gebruik genomen mobiliteitshulpmiddel waarop hij is aangewezen, totdat aan hem een
      hulpmiddel kan worden verstrekt krachtens die zorgverzekering of andere wettelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.1.2
