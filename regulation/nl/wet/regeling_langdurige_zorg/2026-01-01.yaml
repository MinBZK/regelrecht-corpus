articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *algemene risicoanalyse:* analyse die erop is gericht te bepalen op welke gegevens de materiële controle en het
      fraudeonderzoek zich zal richten
        - *Basisbedrag:* het maximumbedrag dat voor het modulair pakket thuis en het persoonsgebonden budget tezamen
      beschikbaar is voor de kosten van huishoudelijke hulp, persoonlijke verzorging, individuele begeleiding,
      begeleiding in groepsverband, logeeropvang, vervoer en verpleging;
        - *Besluit:* [Besluit langdurige zorg][ref1];
        - *Covid-19:* de ziekte veroorzaakt door coronavirus-SARS-CoV-2;
        - *Deeltijdverblijf:* verblijf in een instelling zonder behandeling van 7, 8 of 9 etmalen gedurende een periode van
      veertien aaneengesloten etmalen overeenkomstig van tevoren vastgestelde tijdsperioden;
        - *dementie met zeer ernstig probleemgedrag:* dementie in combinatie met een gedragsstoornis die geen gevolg is van
      een andere aandoening en die zeer ernstig en frequent of langdurig tot uiting komt in gedrag dat een gevaar vormt
      voor de verzekerde of zijn omgeving;
        - *gegevens over gezondheid:* gegevens over gezondheid, als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming;
        - *kleinschalig wooninitiatief:* kleinschalig wooninitiatief als bedoeld in
      [artikel 3.1.4, tweede lid, van het Besluit][ref2];
        - *logeeropvang:* logeeropvang als bedoeld in [artikel 3.1.3 van het Besluit][ref3];
        - *multiple sclerose met ernstige motorische beperkingen:* multiple sclerose waarbij sprake is van daaruit
      voortvloeiende ernstige motorische beperkingen met volledige afhankelijkheid van een rolstoel of bedgebondenheid,
      cognitieve beperkingen en zorgafhankelijkheid voor de (instrumentele) algemene dagelijkse levensverrichtingen,
      in combinatie met: a. somatische kwetsbaarheid; b. communicatiestoornissen; c. problemen in het psychosociaal
      functioneren; of d. een uit de multiple sclerose voortvloeiende psychiatrische stoornis;
        - *niet-aangeboren hersenletsel met zeer ernstig probleemgedrag:* hersenletsel dat is ontstaan anders dan
      voor, rondom of vanwege de geboorte en dat niet progressief is, waarbij sprake is van uit het hersenletsel
      voortvloeiend zeer ernstig regieverlies, een ernstige stoornis in de zelfregulering van het sociaal-
      emotioneel functioneren en zeer ernstig probleemgedrag dat geen gevolg is van een aandoening als bedoeld in
      [artikel 2.2, eerste lid, onderdeel c, onder 8° tot en met 13°][ref4] in combinatie met: a. ernstige meervoudige
      cognitieve stoornissen; b. problemen met betrekking tot (instrumentele) algemene dagelijkse levensverrichtingen; c.
      onvoldoende inzicht in het eigen functioneren of zelfreflectie; of d. een stoornis in de prikkelverwerking;
        - *persoonlijk plan:* persoonlijk plan als bedoeld in [artikel 3.3.3, tweede lid, van de wet][ref5], waarin een
      aanvulling kan worden gegeven op het budgetplan;
        - *prestatie:* prestatie als bedoeld in [artikel 1 van de Wet marktordening gezondheidszorg][ref6];
        - *prestatiebeschrijving:* prestatiebeschrijving als bedoeld in de [Wet marktordening gezondheidszorg][ref7];
        - *specifieke risicoanalyse:* analyse die erop is gericht te bepalen op welke gegevens en op welke zorgaanbieders
      of categorieën van zorgaanbieders de detailcontrole zich zal richten;
        - *tarief:* tarief als bedoeld in [artikel 1 van de Wet marktordening gezondheidszorg][ref8];
        - *zeer ernstige gerontopsychiatrische aandoening:* chronische gerontopsychiatrische aandoening waarbij sprake
      is van daaruit voortvloeiende ernstige psychiatrisch gerelateerde gedragsproblemen en van chronische lichamelijke
      gezondheidsproblemen in combinatie met problemen met betrekking tot cognitie, (instrumentele) algemene dagelijkse
      levensverrichtingen of sociaal functioneren;
        - *zorgovereenkomst:* schriftelijke overeenkomst van de verzekerde met een persoon van wie hij zorg betrekt en die
      daarvoor betaling ontvangt uit het persoonsgebonden budget.


