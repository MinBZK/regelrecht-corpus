        artikel: '7.10'
        hoofdstuk: '7'
  - number: '7.3'
    text: |-
      1 De Wlz-uitvoerder verricht materiële controle op de wijze zoals bepaald in de
      [artikelen 7.4 tot en met 7.9][ref1].

      2 De zorgaanbieder is verplicht zijn medewerking te verlenen aan de overeenkomstig het eerste lid uitgevoerde
      materiële controle.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel7.4
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0036014
        artikel: '7.4'
        hoofdstuk: '7'
  - number: '7.4'
    text: |-
      1 De Wlz-uitvoerder stelt voorafgaand aan de uitvoering van materiële controle het doel ervan vast door te bepalen
      wanneer voldoende zekerheid is verkregen dat de door de zorgaanbieder in rekening gebrachte prestatie is geleverd
      of die geleverde prestatie het meest was aangewezen gezien de gezondheidstoestand van de verzekerde.

      2 Bij de vaststelling van het doel als bedoeld in het eerste lid, neemt de Wlz-uitvoerder voor het uitvoeren van
      controles mede de op grond van de [artikelen 31][ref1] en [36 van de Wet marktordening gezondheidszorg][ref2] door
      de zorgautoriteit gestelde regels in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel36
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '36'
  - number: '7.5'
    text: |-
      1 De Wlz-uitvoerder mag verzekerden met gebruikmaking van persoonsgegevens waarover hij in verband met de
      uitvoering van de wet reeds beschikt enquêteformulieren zenden om:

      1°. na te gaan of de in rekening gebrachte zorg daadwerkelijk is verleend, en

      2°. onderzoek te doen naar de door die verzekerden ervaren kwaliteit van de verzekerde zorg die een zorgaanbieder
      verleent of heeft verleend.

      2 Bij de verzending van enquêteformulieren als bedoeld in het eerste lid informeert de Wlz-uitvoerder de verzekerde
      erover dat hij niet verplicht is tot beantwoording van de gestelde vragen en dat onthouden van medewerking op geen
      enkele wijze tot zijn nadeel zal strekken.

      3 De Wlz-uitvoerder draagt er zorg voor dat terug ontvangen enquêteformulieren als bedoeld in het eerste lid,
      onderdeel 2°, niet herleidbaar zijn tot personen en dat niet herleidbaar is welke verzekerden geen formulier hebben
      teruggestuurd.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.5
  - number: '7.6'
    text: |-
      1 De Wlz-uitvoerder voert een algemene risicoanalyse uit op basis van gegevens waarover deze in verband met de
      uitvoering van de wet beschikt.

      2 De Wlz-uitvoerder stelt op basis van de in het eerste lid uitgevoerde algemene risicoanalyse een algemeen
      controleplan vast, waarin de objecten van materiële controle en de in te zetten controle-instrumenten zijn
      opgenomen.

      3 Het naar aanleiding van de algemene risicoanalyse opgestelde algemene controleplan voorziet niet in de inzet van
      het controle-instrument detailcontrole.

      4 Indien uit het uitgevoerde algemene controleplan blijkt dat het controledoel, bedoeld in
      [artikel 7.4, eerste lid][ref1], is bereikt, kan alleen detailcontrole worden uitgevoerd als er van een ander dan
      de Wlz-uitvoerder afkomstige of uit de uitgevoerde controle voortvloeiende aanwijzingen zijn waaruit blijkt dat er
      sprake is van onvoldoende zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel7.4
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0036014
        artikel: '7.4'
        hoofdstuk: '7'
  - number: '7.7'
    text: |-
      De Wlz-uitvoerder maakt informatie openbaar over het ingevolge [artikel 7.4][ref1] vastgestelde controledoel en
      het ingevolge [artikel 7.6][ref2] vastgestelde algemene controleplan op een zodanige wijze dat die informatie voor
      verzekerden en zorgaanbieders gemakkelijk verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel7.4
      [ref2]: https://wetten.overheid.nl/BWBR0036014#Artikel7.6
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0036014
        artikel: '7.4'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0036014
        artikel: '7.6'
        hoofdstuk: '7'
  - number: '7.8'
    text: |-
      1 De Wlz-uitvoerder voert geen detailcontrole uit, dan nadat is voldaan aan de volgende voorwaarden:

      a. de Wlz-uitvoerder heeft een specifieke risicoanalyse verricht op de bevindingen uit het uitgevoerde algemene
      controleplan bedoeld in [artikel 7.5, tweede lid][ref1];

      b. de Wlz-uitvoerder heeft naar aanleiding van de specifieke risicoanalyse een specifiek controleplan en specifiek
      controledoel opgesteld, waarin de objecten van materiële controle en de methoden van detailcontrole zijn opgenomen;

      c. het overeenkomstig onderdeel b vastgestelde specifieke doel van de materiële controle kan zonder detailcontrole
      niet worden bereikt;

      d. uit het specifieke controleplan blijkt dat de detailcontrole niet verder gaat dan gelet op het met het
      onderzoeksdoel en de omstandigheden van het te onderzoeken geval noodzakelijk is;

      e. de Wlz-uitvoerder heeft de zorgaanbieder voorafgaand aan de uitvoering van de detailcontrole toereikende,
      desgevraagd schriftelijke, informatie verstrekt waarin wordt gemotiveerd hoe is voldaan aan de in dit lid genoemde
      voorwaarden.

      2 Indien bij de uitvoering van detailcontrole persoonsgegevens van verzekerden worden verwerkt, geschiedt dit onder
      verantwoordelijkheid van een medisch adviseur in opdracht van de Wlz-uitvoerder en is deze op voorafgaand verzoek
      van de zorgaanbieder aanwezig bij dit deel van de controle.

      3 De Wlz-uitvoerder informeert de zorgaanbieder over de zakelijke inhoud van de voorgenomen uitkomsten van de
      detailcontrole en stelt de zorgaanbieder in de gelegenheid daarop binnen een redelijke termijn te reageren.

      4 De Wlz-uitvoerder betrekt de reactie van de zorgaanbieder bij de vaststelling van de definitieve uitkomsten van
      de detailcontrole en bericht deze uitkomsten aan de zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0036014
        artikel: '7.5'
        hoofdstuk: '7'
  - number: '7.9'
    text: |-
      De Wlz-uitvoerder legt de specifieke risicoanalyse en de uitvoering van detailcontroles in zijn administratie vast
      om toetsing door en verantwoording aan toezichthouders mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.9
  - number: '7.10'
    text: |-
      1 Het fraudeonderzoek, bedoeld in [artikel 9.1.2, eerste lid, onder j, van de wet][ref1] houdt een onderzoek in
      waarbij de Wlz-uitvoerder nagaat of de verzekerde of de zorgaanbieder valsheid in geschrifte, bedrog, benadeling
      van rechthebbenden of verduistering pleegt of tracht te plegen bij de uitvoering door betrokken personen en
      organisaties van de verzekering op grond van de wet, met het doel een prestatie, vergoeding, betaling of ander
      voordeel te krijgen waarop de verzekerde dan wel de zorgaanbieder geen recht heeft of recht kan hebben.

      2 Bij fraudeonderzoek zijn de voorwaarden bedoeld in [artikel 7.8, eerste lid, onderdelen b en d][ref2], van
      overeenkomstige toepassing, en is de in onderdeel e bedoelde voorwaarde van overeenkomstige toepassing voor zover
      het onderzoeksbelang of het belang van de bescherming van de persoonlijke levenssfeer van de betrokken verzekerde
      zich daar niet tegen verzet.

      3 In afwijking van het tweede lid kan de Wlz-uitvoerder met betrekking tot een individuele verzekerde
      detailcontrole uitvoeren zonder dat de in dat lid genoemde voorwaarden van toepassing zijn, indien deze verzekerde
      ten behoeve van het fraudeonderzoek schriftelijk toestemming heeft gegeven voor verstrekking van hem betreffende
      gegevens over gezondheid aan de Wlz-uitvoerder.

      4 De zorgaanbieder is verplicht zijn medewerking te verlenen aan overeenkomstig het tweede lid uitgevoerd
      fraudeonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel9.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0036014#Artikel7.8
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: 9.1.2
      - id: ref2
        bwb_id: BWBR0036014
        artikel: '7.8'
        hoofdstuk: '7'
  - number: '7.11'
    text: |-
      De Wlz-uitvoerder verwerkt de persoonsgegevens, bedoeld in [artikel 6.1.1 van de wet][ref1] slechts
      verder voor de uitvoering van de wet en voor zover dit noodzakelijk is voor de doelen als omschreven in
      [artikel 9.1.2, eerste en derde lid][ref2], en [9.1.3, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel9.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel9.1.3
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: 6.1.1
      - id: ref2
        bwb_id: BWBR0035917
        artikel: 9.1.2
      - id: ref3
        bwb_id: BWBR0035917
        artikel: 9.1.3
  - number: '7.12'
    text: |-
      De Wlz-uitvoerder dient zo spoedig mogelijk, doch uiterlijk binnen één maand na de dag
      waarop de zorg is aangevangen of herzien door wijziging van de leveringsvorm als bedoeld in
      [artikel 3.3.1, eerste lid, van de wet][ref1], of, indien de leveringsvorm een persoonsgebonden budget betreft,
      uiterlijk binnen vier maanden na de ingangsdatum van de verlening van dat budget door de Wlz-uitvoerder, de
      noodzakelijke persoonsgegevens voor de vaststelling en de inning van de eigen bijdrage bij het CAK in.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.3.1
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: 3.3.1
  - number: '7.13'
    text: |-
      1 Indien de persoonsgegevens door de Wlz-uitvoerder onjuist of onvolledig zijn ingediend bij het CAK, stuurt het
      CAK zo spoedig mogelijk, doch uiterlijk binnen tien werkdagen na indiening, een uitnodiging tot herstel aan de
      Wlz-uitvoerder.

      2 De Wlz-uitvoerder dient uiterlijk binnen tien werkdagen na ontvangst van de uitnodiging, bedoeld in het eerste
      lid, het herstelde bericht bij het CAK in.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.13
  - number: '7.14'
    text: |-
      1 Ten behoeve van de vaststelling en inning van de eigen bijdrage, bedoeld in
      [artikel 6.1.2, onderdeel a, van de wet][ref1], vergelijken de Wlz-uitvoerder en het CAK ten minste elke twee
      maanden hun administraties houdende de persoonsgegevens van de verzekerden die noodzakelijk zijn voor de juiste
      uitvoering van de taken.

      2 Indien naar aanleiding van de in het eerste lid genoemde vergelijking blijkt dat sprake is van onvolledige
      of onjuiste persoonsgegevens in de administraties, corrigeert het CAK of de Wlz-uitvoerder binnen een maand
      na die vergelijking de gegevens in hun administratie, voor zover noodzakelijk voor de juiste uitvoering van
      [artikel 3.2.5 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3.2.5
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.14
    references:
