  - number: '9.2'
    text: |-
      [Artikel 11.1.1, vierde lid, van de wet][ref1] geldt slechts voor verzekerden die op de dag voorafgaande aan de
      intrekking van de [Algemene Wet Bijzondere Ziektekosten][ref2] op grond van een indicatiebesluit waren aangewezen
      op een zorgzwaartepakket als bedoeld in het derde lid van dat artikel.


