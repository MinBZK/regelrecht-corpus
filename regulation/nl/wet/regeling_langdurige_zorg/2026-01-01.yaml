  - number: 5.15a
    text: |-
      1 In geval de verzekerde geïndiceerd is voor het zorgprofiel LG Wonen met begeleiding en intensieve verzorging,
      LG Wonen met intensieve begeleiding en intensieve verzorging, LG Wonen met zeer intensieve begeleiding en zeer
      intensieve verzorging, VV Beschermd wonen met zeer intensieve zorg, vanwege specifieke aandoeningen, met de nadruk
      op verzorging/verpleging, dan wel voor het zorgzwaartepakket 5 LG, 6 LG of 7 LG, of 8 VV, hoogt het zorgkantoor op
      aanvraag van de verzekerde zijn persoonsgebonden budget op tot ten hoogste € 403.275 indien de verzekerde:

      a. vanuit een medische noodzaak is aangewezen op permanent toezicht of 24 uur per dag zorg in de nabijheid om de
      veiligheid van verzekerde in levensbedreigende situaties te waarborgen,

      b. 18 jaar of ouder is,

      c. geen cognitieve beperkingen heeft, en

      d. op eigen kracht, zonder hulp van een vertegenwoordiger, de taken als omschreven in
      [artikel 3.3.3, vierde lid, onderdeel b en c, van de wet][ref1] kan uitvoeren.

      2 De aanvraag van verzekerde bij het zorgkantoor gaat vergezeld van een oordeel van een behandelend arts over de
      medische noodzaak als beschreven in het eerste lid, onderdeel a, en wordt slechts ingewilligd nadat het zorgkantoor
      de verzekerde in persoon heeft gezien en mede op grond daarvan tot de overtuiging is gekomen dat de verzekerde
      voldoet aan de voorwaarden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.3.3
