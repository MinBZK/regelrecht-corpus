    text: |-
      1 De verzekerde die met ingang van 1 januari 2015 recht krijgt op verblijf in een instelling waar de verzekerde met
      verblijf gepaard gaande behandeling als bedoeld in [artikel 3.1.1, eerste lid, onderdeel d, van de wet][ref1] had
      en die onmiddellijk voorafgaand aan de intrekking van de [Algemene Wet Bijzondere Ziektekosten][ref2] krachtens de
      [Wet maatschappelijke ondersteuning][ref3] het individueel gebruik van een mobiliteitshulpmiddel had, behoudt het
      gebruik van dat hulpmiddel totdat krachtens [artikel 2.3 van deze regeling][ref4] een mobiliteitshulpmiddel kan
      worden verstrekt.

      2 De verzekerde die met ingang van 1 januari 2016 recht krijgt op zorg krachtens de wet en onmiddellijk daaraan
      voorafgaand krachtens de [ Wet maatschappelijke ondersteuning 2015][ref5] het individueel gebruik van een
      mobiliteitshulpmiddel had, behoudt dit hulpmiddel totdat het op grond van de [Wet langdurige zorg][ref6] kan worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
