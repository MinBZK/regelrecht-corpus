  - number: '5.9'
    text: |-
      Het verlenen van een persoonsgebonden budget wordt geweigerd indien:

      a. de verzekerde of diens vertegenwoordiger een bespreking van het budgetplan weigert of, na daartoe te zijn
      opgeroepen, zonder geldige reden niet verschijnt;

      b. de verzekerde op de dag waarop de subsidieperiode zou aanvangen, anders dan voor logeeropvang, in een instelling
      als bedoeld in de wet of de [Zorgverzekeringswet][ref1] zal verblijven, tenzij het zorgkantoor een persoonsgebonden
      budget verleent voor begeleiding groep indien de verzekerde verblijft in een instelling waar de dagbesteding voor
      die verzekerde geen onderdeel vormt van het door het zorgkantoor gecontracteerde verblijf;

      c. het zorgkantoor, op advies van een instelling voor maatschappelijk werk of de Raad voor de kinderbescherming,
      van oordeel is dat een ten behoeve van een minderjarige verzekerde aangevraagd persoonsgebonden budget in zodanige
      mate niet voor de inkoop van zorg ten behoeve van de verzekerde zal worden gebruikt, dat dit mishandeling,
      verwaarlozing of ernstige schade voor de opvoeding of de ontwikkeling van de verzekerde tot gevolg zou hebben;

      d. de verzekerde, of, indien de verzekerde de leeftijd van 18 jaar nog niet heeft bereikt, één van diens ouders of
      voogden, failliet is verklaard;

      e. ten aanzien van de verzekerde of, indien de verzekerde de leeftijd van 18 jaar nog niet heeft bereikt, één van
      diens ouders of voogden, de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een
      verzoek daartoe bij de rechtbank is ingediend;

      f. de verzekerde of diens vertegenwoordiger het zorgkantoor geen toestemming geeft om de persoonsgegevens van de
      verzekerde door te geven aan het CAK ten behoeve van de vaststelling van de te betalen eigen bijdrage en aan de
      Sociale verzekeringsbank ten behoeve van de uitvoering van diens bij of krachtens de wet opgedragen taken omtrent
      het persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.9
