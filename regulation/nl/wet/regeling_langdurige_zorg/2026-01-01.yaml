  - number: '4.7'
    text: |-
      Bij de berekening van het in [artikel 3.3.2.2, vijfde lid, aanhef, van het besluit][ref1] genoemde aantal uren zorg
      via een modulair pakket thuis, geldt dat een dagdeel voor de modules begeleiding groep en behandeling groep geldt
      als een uur en dat een etmaal logeeropvang geldt als zes uren.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.2
