  - number: '2.5'
    text: |-
      1 De verzekerde, bedoeld in [artikel 3.2.1, derde lid, onderdeel a, van de wet][ref1], heeft slechts recht op
      zorg indien hij is aangewezen op behandeling van de gedragsproblematiek en in verband daarmee verblijft in een
      instelling en is aangewezen op een van de zorgprofielen genoemd in [artikel 3.2, eerste lid][ref2].

      2 In afwijking van het eerste lid heeft de verzekerde recht op zorg indien hij is aangewezen op behandeling van
      gedragsproblematiek en de Wlz-uitvoerder op grond van [artikel 5.3][ref3] een volledig pakket thuis of een modulair
      pakket thuis verleent, of verblijf in een intramurale instelling waar geen LVG- of SGLVG-behandeling geboden en
      gedeclareerd wordt.


