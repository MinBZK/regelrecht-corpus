  - number: 5.1f
    text: |-
      1 Indien de verzekerde een zorgbehoefte heeft waarvan de kosten het bedrag overstijgen dat
      beschikbaar is na toepassing van de [artikelen 5.1 tot en met 5.1d][ref1] en de voorwaarden genoemd in
      [artikel 2.2, eerste of tweede lid][ref2] niet van toepassing zijn, kan de Wlz-uitvoerder extra kosten toestaan,
      indien:

        - de kosten van begeleiding in groepsverband hoger zijn dan het bedrag wat voor dat zorgprofiel voor die zorgvorm
      is opgenomen in [Bijlage H][ref3]; of
        - de verzekerde een behoefte heeft aan behandeling in groepsverband of individuele behandeling waarvan de kosten in
      natura de voor die onderdelen beschikbare bedragen overstijgen naar het oordeel van de Wlz-uitvoerder.

      2 Indien de verzekerde een zorgbehoefte heeft waarvan de kosten het bedrag overstijgen dat
      beschikbaar is na toepassing van de [artikelen 5.1 tot en met 5.1d][ref4] en de voorwaarden genoemd in
      [artikel 2.2, eerste of tweede lid][ref5] niet van toepassing zijn, kan het zorgkantoor extra kosten toestaan,
      indien de kosten van begeleiding in groepsverband hoger zijn dan het bedrag wat voor dat zorgprofiel voor die
      zorgvorm is opgenomen in [Bijlage H][ref6].


