  - number: 5.23b
    text: |-
      De verzekerde doet aan de Sociale verzekeringsbank op verzoek of onverwijld uit eigen beweging mededeling van
      gegevens waarvan hem redelijkerwijs duidelijk moet zijn dat zij noodzakelijk zijn voor het uitvoeren van het
      budgetbeheer, bedoeld in [artikel 3.3.3, zevende lid, van de wet][ref1], of het uitvoeren van betalingen ten laste
      van het persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.3.3
