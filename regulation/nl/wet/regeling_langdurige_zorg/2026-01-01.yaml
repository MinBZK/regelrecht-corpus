        artikel: '7.10'
        hoofdstuk: '7'
  - number: '7.2'
    text: |-
      De controle, bedoeld in [artikel 9.1.2, eerste lid, onder i, van de wet][ref1] houdt in:

      a. materiële controle: een onderzoek waarbij de Wlz-uitvoerder nagaat of de door de zorgaanbieder in rekening
      gebrachte prestatie is geleverd en die geleverde prestatie het meest was aangewezen gezien de gezondheidstoestand
      van de verzekerde;

      b. formele controle: een onderzoek waarbij de Wlz-uitvoerder nagaat of het tarief dat door een zorgaanbieder voor
      een prestatie in rekening is gebracht:

      1°. een prestatie betreft, welke is geleverd aan een bij die Wlz-uitvoerder verzekerde persoon;

      2°. een prestatie betreft, welke behoort tot het verzekerde pakket van die persoon,

      3°. een prestatie betreft, tot levering waarvan de zorgaanbieder bevoegd is, en

      4°. het tarief betreft, dat voor die prestatie krachtens de [Wet marktordening gezondheidszorg][ref2] is
      vastgesteld of een tarief is dat, met inachtneming van het bepaalde bij of krachtens die wet, voor die prestatie
      met de zorgaanbieder is overeengekomen, en

      c. detailcontrole: onderzoek door de Wlz-uitvoerder naar bij de zorgaanbieder berustende persoonsgegevens
      met betrekking tot eigen verzekerden ten behoeve van materiële controle als bedoeld in [artikel 7.3][ref3] of
      fraudeonderzoek als bedoeld in [artikel 7.10][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel9.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0036014#Artikel7.3
      [ref4]: https://wetten.overheid.nl/BWBR0036014#Artikel7.10
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel7.2
    references:
      - id: ref1
