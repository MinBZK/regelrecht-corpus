  - number: '5.19'
    text: |-
      De verleningsbeschikking van het zorgkantoor aan de verzekerde bevat ten minste de volgende gegevens:

      a. de subsidieperiode;

      b. het verleende persoonsgebonden budget en de wijze waarop dit budget is berekend;

      c. de verplichtingen van de verzekerde;

      d. de hoogte van het bedrag waarover een budgethouder zich niet hoeft te verantwoorden, en de wijze waarop dat
      bedrag is berekend.
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel5.19
  - number: '5.20'
    text: |-
      1 Het zorgkantoor wijzigt de verleningsbeschikking of trekt deze in:

      a. met ingang van de dag gelegen na de dag waarop de verzekerde overlijdt;

      b. met ingang van de dag waarop de verzekerde langer dan twee maanden verblijft in een instelling als bedoeld in de
      wet of de [Zorgverzekeringswet][ref1];

      c. met ingang van de dag vanaf welke de verzekerde schriftelijk heeft aangegeven geen prijs meer te stellen op het
      persoonsgebonden budget;

      d. met ingang van de dag waarop het zorgkantoor, op advies van een instelling voor maatschappelijk werk of de
      Raad voor de kinderbescherming, van oordeel is dat een ten behoeve van een minderjarige verzekerde aangevraagd
      persoonsgebonden budget in zodanige mate niet voor de inkoop van zorg ten behoeve van die verzekerde zal worden
      gebruikt, dat dit mishandeling, verwaarlozing of ernstige schade voor de opvoeding of ontwikkeling van die
      verzekerde tot gevolg zal hebben;

      e. met ingang van de dag waarop het indicatiebesluit ten nadele van de verzekerde wordt herzien als gevolg van
      bezwaar en beroep.

      2 Het zorgkantoor kan de verleningsbeschikking intrekken of wijzigen:

      a. met ingang van de dag waarop de verzekerde niet beschikt over een woonadres als bedoeld in
      [artikel 1.1 van de Wet basisregistratie personen][ref2];

      b. met ingang van de dag waarop de verzekerde, of diens wettelijk vertegenwoordiger dan wel gevolmachtigde,
      de opgelegde verplichtingen niet nakomt of niet langer voldoet aan de voorwaarden of verleningsgrond van het
      persoonsgebonden budget dan wel verhoging van het budget als bedoeld in [artikel 5.1c, vijfde lid][ref3], of aan de
      eisen als bedoeld in [artikel 5.11, tweede lid][ref4]; of

      c. indien de verzekerde zich bij de eerdere verstrekking van een persoonsgebonden budget niet heeft gehouden aan de
      opgelegde verplichtingen.


