    text: |-
      Het bedrag van de extra vrijlating, bedoeld in [artikel 4.2, aanhef en onder d][ref1], bedraagt 25% van het
      verschil tussen het op grond van [artikel 3.3.2.3, eerste lid, onderdeel a, van het Besluit][ref2], na toepassing
      van de [artikelen 4.3 tot en met 4.5][ref3], berekende bedrag en:

      a. € 11.830, indien het gaat om een ongehuwde verzekerde die de pensioengerechtigde leeftijd heeft bereikt;

      b. € 13.894, indien het gaat om gehuwde verzekerden tezamen, waarvan ten minste één de pensioengerechtigde leeftijd
      heeft bereikt;

      c. € 9.406, indien het gaat om een ongehuwde verzekerde die de pensioengerechtigde leeftijd nog niet heeft bereikt,
      of

      d. € 18.950, indien het gaat om gehuwde verzekerden tezamen die de pensioengerechtigde leeftijd nog niet hebben
      bereikt.


