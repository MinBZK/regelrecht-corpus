  - number: '9.9'
    text: |-
      1 Indien een verzekerde als bedoeld in [artikel 11.1.1, eerste lid, van de wet][ref1] anders dan met de bedoeling
      om buiten een instelling te gaan verblijven een herindicatie aanvraagt en het CIZ constateert dat hij niet voldoet
      aan [artikel 3.2.1, eerste lid, van de wet][ref2] indiceert het CIZ voor hem één van de zorgprofielen, bedoeld
      in [bijlage F][ref3].

      2 De [artikelen 11.1.1, eerste lid][ref4], [11.1.2, derde lid][ref5], en [11.1.4 van de wet][ref6] zijn van
      overeenkomstige toepassing op een verzekerde voor wie na toepassing van het eerste lid een zorgprofiel als bedoeld
      in [bijlage F][ref7] is geïndiceerd.

      3 Het eerste lid is van overeenkomstige toepassing in geval van herziening van het indicatiebesluit op grond van
      [artikel 3.2.4, aanhef en onderdeel b, van de wet][ref8] en het CIZ constateert dat de verzekerde niet voldoet
      aan [artikel 3.2.1, eerste lid, van de wet][ref9] en hij zijn recht op zorg met verblijf in een instelling wil
      behouden.

      4 Met betrekking tot de herindicatie, bedoeld in het eerste lid, dan wel herziening van het indicatiebesluit,
      bedoeld in het derde lid, is [artikel 9.1.2 van de wet][ref10] van overeenkomstige toepassing.


