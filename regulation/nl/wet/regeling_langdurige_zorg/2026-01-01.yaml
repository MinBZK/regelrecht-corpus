  - number: '4.4'
    text: |-
      1 Het bedrag in verband met de premie zorgverzekering, bedoeld in [artikel 4.2, aanhef en onder b][ref1], bedraagt:

      a. voor de ongehuwde verzekerde die de pensioengerechtigde leeftijd heeft bereikt: € 1.987 vermeerderd met
      5,32% van het inkomen, met dien verstande dat ten minste € 3.029,45 en ten hoogste € 5.797,61 in mindering wordt
      gebracht;

      b. voor de ongehuwde verzekerde die de pensioengerechtigde leeftijd nog niet heeft bereikt: € 1.987, vermeerderd
      met 5,32% van het bijdrage-inkomen, bedoeld in [artikel 43 van de Zorgverzekeringswet][ref2], met dien verstande
      dat ten hoogste € 5.797,61 in mindering wordt gebracht;

      c. voor de gehuwde verzekerden die beiden de pensioengerechtigde leeftijd hebben bereikt: voor ieder van de gehuwde
      verzekerden € 1.987 vermeerderd met 5,32% van het inkomen van die gehuwde verzekerde, met dien verstande dat voor
      ieder van de gehuwde verzekerden ten minste € 2.697,37 en ten hoogste € 5.797,61 in mindering wordt gebracht;

      d. voor de gehuwde verzekerden die beiden de pensioengerechtigde leeftijd nog niet hebben bereikt wordt de aftrek
      voor ieder van de gehuwde verzekerden overeenkomstig onderdeel b berekend en geldt voor ieder van de gehuwde
      verzekerden het daarin genoemde maximumbedrag;

      e. voor de overige gehuwde verzekerden wordt de aftrek:

      1°. voor de gehuwde verzekerde die de pensioengerechtigde leeftijd nog niet heeft bereikt, berekend overeenkomstig
      de in onderdeel b geregelde berekeningswijze en geldt het daarbij genoemde maximumbedrag;

      2°. voor de gehuwde verzekerde die de pensioengerechtigde leeftijd heeft bereikt berekend overeenkomstig de in
      onderdeel c geregelde berekeningswijze en geldt het daarbij genoemde maximum- en minimumbedrag.

      2 Indien de verzekerde op 1 januari van het peiljaar aanspraak had op een zorgtoeslag wordt op de aftrek, bedoeld
      in het eerste lid, in mindering gebracht:

      a. voor de verzekerde die ongehuwd is: een bedrag van € 1.483, met dien verstande dat als zijn inkomen € 26.820 of
      meer bedraagt dit bedrag wordt verminderd met 13,67% van het verschil tussen zijn inkomen en € 26.820;

      b. voor de verzekerden die gehuwd zijn: een bedrag van € 2.833 met dien verstande dat indien hun gezamenlijke
      inkomen € 26.820 of meer bedraagt dit bedrag wordt verminderd met 13,67% van het verschil tussen hun gezamenlijke
      inkomen en € 26.820.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel4.2
