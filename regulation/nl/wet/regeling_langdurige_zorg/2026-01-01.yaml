    text: |-
      1 In het belang van een gecoördineerde uitvoering van het persoonsgebonden budget ondersteunt de Sociale
      verzekeringsbank het zorgkantoor bij de uitoefening van diens taken als de verstrekker van dat budget.

      2 De Sociale verzekeringsbank en het zorgkantoor werken samen aan de digitalisering en standaardisering van de
      uitvoering van het persoonsgebonden budget.
