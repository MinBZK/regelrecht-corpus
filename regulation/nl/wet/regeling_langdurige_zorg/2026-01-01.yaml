  - number: 5.23a
    text: |-
      1 In afwijking van [artikel 5.23, vierde lid, onderdeel c][ref1], kan de Sociale verzekeringsbank beslissen tot
      beëindiging of opschorting van de betalingen of een gehele of gedeeltelijke weigering of opschorting van een
      betaling uit het persoonsgebonden budget indien de Sociale verzekeringsbank een declaratie ter betaling van de
      vervoerskosten, bedoeld in [artikel 3.6.4, vijfde lid, van het Besluit][ref2], niet uiterlijk binnen tien weken, na
      de maand waarin de prestatie is verleend, ontvangt van de verzekerde.

      2 In afwijking van [artikel 5.23, derde en vierde lid][ref3], onderdelen d en e, ontvangt
      de Sociale verzekeringsbank een verzoek om het verantwoordingsvrij bedrag, bedoeld in
      [artikel 3.6.6, eerste lid, onderdeel d, van het besluit][ref4], voor het eindigen van de beschikking tot verlening
      van het persoonsgebonden budget.

      3 De Sociale verzekeringsbank verricht betalingen, indien de declaratie, bedoeld in het eerste lid, of het verzoek,
      bedoeld in het tweede lid, is opgesteld met gebruikmaking van de modellen die door de Sociale verzekeringsbank
      daartoe beschikbaar zijn gesteld.


