  - number: '2.4'
    text: |-
      1 De verzekerde heeft slechts aanspraak op tandheelkundige zorg als bedoeld in
      [artikel 2.7, eerste tot en met derde lid, van het Besluit zorgverzekering][ref1] indien de Wlz-uitvoerder vooraf
      toestemming heeft verleend.

      2 Indien het verblijf van de verzekerde in een instelling wordt beëindigd in verband met verblijf als bedoeld in
      [artikel 2.12 van het Besluit zorgverzekering][ref2], bestaat nog gedurende een periode van ten hoogste acht dagen
      aanspraak op tandheelkundige zorg.

      3 Tot negen weken na beëindiging van het verblijf in een instelling bestaat aanspraak op de levering en het
      aanbrengen van een nieuwe of overgezette tandheelkundige prothese, zijnde een plaat-, overkappings-, opbouw- of
      frameprothese, alsmede van kronen of bruggen, indien deze tandheelkundige hulp voor het beëindigen van het verblijf
      was aangevangen. De Wlz-uitvoerder kan, gehoord de adviserend tandarts, een langere termijn van ten hoogste
      tweeënvijftig weken vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.7
