      1 De Wlz-uitvoerder verleent een volledig pakket thuis of een modulair pakket thuis als bedoeld in
      [artikel 3.3.6 van de wet][ref1], ook indien de zorg waarop de verzekerde krachtens zijn indicatiebesluit is
      aangewezen niet op doelmatige wijze kan worden verleend indien:

      a. de zorg op verantwoorde wijze kan worden verleend;

      b. de zorg niet langer wordt verleend dan gedurende ten hoogste dertien weken.

      2 Bij het verlenen van een volledig pakket thuis of modulair pakket thuis als bedoeld in
      [artikel 3.3.6 van de wet][ref2] zijn de [artikelen 2.2][ref3], [5.1][ref4], [5.1a][ref5], [5.1b][ref6],
      [5.1c][ref7], [5.1d][ref8], [5.1f][ref9] en 2 niet van toepassing.

      3 Een volledig pakket thuis of een modulair pakket thuis als bedoeld in [artikel 3.3.6 van de wet][ref10] kan na de
      periode genoemd in het eerste lid worden verleend indien er zicht op is dat gezien de bijzondere omstandigheden van
      de verzekerde en zijn zorgbehoefte binnen afzienbare tijd na afloop van die periode zorg kan worden geboden in de
      instelling waar de verzekerde bij voorkeur in wil verblijven.


