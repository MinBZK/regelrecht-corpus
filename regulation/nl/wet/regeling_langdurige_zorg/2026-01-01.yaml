  - number: '5.10'
    text: |-
      Het zorgkantoor gaat bij de toepassing van [artikel 4:25 van de Algemene bestuursrecht][ref1], gelezen
      in samenhang met het subsidieplafond van de [artikelen 8.2][ref2], [8.4][ref3], [8.6][ref4], [8.8][ref5],
      [8.10][ref6], [8.12][ref7], [8.14][ref8] en [8.16][ref9] van deze regeling uit van de datum van ontvangst van
      het in [artikel 3.6.2, eerste lid, onderdeel c, van het Besluit][ref10] bedoelde aanvraagformulier of, indien
      dat aanvraagformulier is ontvangen voor de datum van vaststelling van het indicatiebesluit, de datum van het
      indicatiebesluit.


