        bwb_id: BWBR0014149
        artikel: '13'
  - number: '9.5'
    text: |-
      Een zorgovereenkomst die krachtens [artikel 2.6.15 van de Regeling subsidies AWBZ][ref1], zoals die gold
      onmiddellijk voorafgaande aan de intrekking van de [Algemene Wet Bijzondere Ziektekosten][ref2], door het
      zorgkantoor of door de Sociale verzekeringsbank is goedgekeurd, geldt als een goedgekeurde zorgovereenkomst op
      grond van [artikel 3.6.4, derde lid, van het Besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Artikel2.6.15
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0035948#Artikel3.6.4
