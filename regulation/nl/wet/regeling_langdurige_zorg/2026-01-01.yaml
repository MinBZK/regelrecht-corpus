  - number: '4.8'
    text: |-
      De bedragen, bedoeld in [artikel 3.3.1.7, derde lid, van het Besluit][ref1], voor zover vastgesteld voor het
      lopende kalenderjaar, zijn de in [bijlage G][ref2] van deze regeling opgenomen bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.1.7
