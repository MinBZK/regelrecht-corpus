  - number: '5.23'
    text: |-
      1 De Sociale verzekeringsbank verricht betalingen uit het persoonsgebonden budget voor overeengekomen zorg dan
      wel bijkomende zorgkosten, die voortvloeien uit een arbeidsovereenkomst, een overeenkomst van opdracht of een
      overeenkomst voor vervoer, uitsluitend aan de persoon met wie deze overeenkomst is aangegaan aan de hand van:

      a. een declaratie voor geleverde zorg;

      b. een zorgovereenkomst bij overeengekomen periodieke maandbetalingen;

      c. een declaratie of zorgovereenkomst, bedoeld in de onderdelen a en b, indien de overeengekomen zorg, in de
      periode van 1 maart 2020 tot en met 30 juni 2020, of, voor zover het zorg in een kleinschalig wooninitiatief,
      dagbesteding of vervoer ten behoeve van dagbesteding betreft, in de periode van 1 maart 2020 tot en met 31 juli
      2020, als gevolg van de maatregelen in verband met Covid-19, door de desbetreffende zorgaanbieder of mantelzorger,
      niet is verleend;

      d. een declaratie of zorgovereenkomst, bedoeld in de onderdelen a en b, indien de overeengekomen zorg
      in de periode van 1 oktober 2020 tot en met 31 december 2021 overeenkomstig de voorwaarden, bedoeld in
      [artikel 5.17, eerste lid, onderdeel e, subonderdeel 1° tot en met 4°][ref1] door de desbetreffende zorgaanbieder
      of mantelzorger, niet is verleend;

      e. een declaratie of zorgovereenkomst, bedoeld in de onderdelen a en b, indien de overeengekomen zorg
      in de periode van 1 oktober 2020 tot en met 31 december 2021, overeenkomstig de voorwaarden, bedoeld in
      [artikel 5.17, eerste lid, onderdeel e, subonderdeel 5°][ref2], door de betreffende zorgverlener of mantelzorger
      niet is verleend;

      f. een declaratie of zorgovereenkomst, bedoeld in de onderdelen a en b, indien de overeengekomen zorg
      in de periode van 2 maart 2021 tot en met 31 december 2021 overeenkomstig de voorwaarden, bedoeld in
      [artikel 5.17, eerste lid, onderdeel g][ref3], door de betreffende zorgverlener of mantelzorger niet is verleend;

      g. een declaratie voor bijkomende zorgkosten zoals bedoeld in [artikel 5.17, eerste lid, onderdeel h][ref4].

      2 Een declaratie als bedoeld in het eerste lid, onderdelen a, c, d, e, f en g, bevat:

      a. de naam van deze persoon en:

      1°. het nummer waarmee die staat ingeschreven bij de Kamer van Koophandel, of

      2°. indien deze persoon niet over dat nummer kan beschikken, geboortedatum of burgerservicenummer;

      b. de naam van de verzekerde en zijn adres of burgerservicenummer of klantnummer bij de Sociale verzekeringsbank;

      c. het tarief;

      d. een verantwoording van de overeengekomen resultaten dan wel een overzicht van het aantal te betalen uren en
      dagdelen of, indien de [Wet minimumloon en minimumvakantiebijslag][ref5] niet van toepassing is op de verbintenis
      waarvoor een vergoeding wordt uitbetaald, etmalen; en

      e. een handtekening van de verzekerde of, voor zover van toepassing, diens vertegenwoordiger, indien het een
      schriftelijke declaratie betreft.

      3 De Sociale verzekeringsbank verricht betalingen uit het persoonsgebonden budget voor kosten verbonden aan vervoer
      als bedoeld in [artikel 3.1.1, eerste lid, onderdeel f, van de wet][ref6], waarvoor geen zorgovereenkomst is
      gesloten, indien de declaratie is ingediend met gebruikmaking van een model dat door de Sociale verzekeringsbank
      daartoe beschikbaar is gesteld.

      4 De Sociale verzekeringsbank kan beslissen tot beëindiging of opschorting van de betalingen of een gehele of
      gedeeltelijke weigering of opschorting van een betaling uit het persoonsgebonden budget:

      a. bij het intrekken of herzien van een besluit tot verlenen van een persoonsgebonden budget;

      b. wegens strijd met het recht, waaronder het recht dat van toepassing is op de zorgovereenkomst,

      c. indien de Sociale verzekeringsbank de declaratie niet heeft ontvangen binnen vier weken nadat de verzekerde deze
      heeft ontvangen;

      d. indien een ingediende declaratie niet voldoet aan de voorwaarden van de zorgovereenkomst of de beschikking tot
      verlening van het persoonsgebonden budget;

      e. indien het zorgkantoor van de verzekerde bij de toepassing van
      [artikel 4:56 van de Algemene wet bestuursrecht][ref7] de Sociale verzekeringsbank daarom verzoekt voor een termijn
      van ten hoogste dertien weken;

      f. in het belang van de uitvoerbaarheid van het verrichten van de betalingen uit het persoonsgebonden budget door
      de Sociale verzekeringsbank.

      5 De Sociale verzekeringsbank verricht betalingen uit het persoonsgebonden budget zonder dat dit bij beschikking
      wordt vastgesteld, binnen dertig dagen na ontvangst van de declaratie, tenzij de declaratie onjuist of onvolledig
      is ingediend. Indien een declaratie niet overeenkomstig het tweede lid is ingediend, en betalingen niet zijn
      beëindigd, geweigerd of opgeschort, nodigt de Sociale verzekeringsbank de verzekerde uit tot herstel van de
      declaratie. Na herstel wordt de betaling binnen dertig dagen verricht. De Sociale verzekeringsbank weigert de
      betaling geheel of gedeeltelijk indien de declaratie niet binnen een door de Sociale verzekeringsbank gestelde
      termijn is hersteld. Indien de Sociale verzekeringsbank naar aanleiding van een declaratie werkzaamheden verricht
      als bedoeld in [artikel 3.6.6, eerste lid, onderdeel c, van het besluit][ref8] wordt de termijn, bedoeld in de
      eerste zin, verlengd met tien dagen.

      6 Sociale verzekeringsbank verricht periodieke maandbetalingen uit het persoonsgebonden budget zonder dat dit
      bij beschikking wordt vastgesteld, uiterlijk binnen dertig dagen na afloop van de maand waarin de zorg geleverd
      is. Indien de Sociale verzekeringsbank naar aanleiding van de periodieke maandbetaling werkzaamheden verricht als
      bedoeld in [artikel 3.6.6, eerste lid, onderdeel c, van het besluit][ref9] wordt de termijn, bedoeld in de eerste
      zin, verlengd met tien dagen.

      7 Indien de verzekerde in aanvulling op de bij de beschikking tot verlening van het persoonsgebonden budget
      aanvullende zorg heeft gecontracteerd, betaalt de Sociale verzekeringsbank deze indien daartoe voldoende geld
      is gestort. De Sociale verzekeringsbank stort na de betaling van de aanvullende zorg binnen redelijke termijn de
      onbestede gelden terug aan degene die hiervoor het geld heeft gestort.

      8 De Sociale verzekeringsbank ondersteunt de verzekerde bij zijn werkgeverstaken of opdrachtgeverschap, waaronder
      ten aanzien van arbeidsomstandighedenregelgeving, zaakschade en aansprakelijkheid.

      9 De verzekerde houdt een administratie bij van het totaal aan niet-geleverde zorg per zorgverlener aan wie
      betalingen zijn verricht op grond van het eerste lid, onderdeel, c, d, e of f. Deze administratie bevat in ieder
      geval de volgende onderdelen:

      a. de naam van de zorgverlener;

      b. het overeengekomen tarief;

      c. een overzicht van het aantal te betalen uren en dagdelen of, indien de
      [Wet minimumloon en minimumvakantiebijslag][ref10] niet van toepassing is op de verbintenis waarvoor een vergoeding
      wordt uitbetaald, etmalen;

      d. ingeval van besmetting met Covid-19 van de budgethouder: een bewijsstuk waaruit blijkt dat de zorg niet kon
      worden geleverd in verband met deze besmetting;

      e. ingeval van een noodzakelijke quarantaine van de budgethouder in verband met Covid-19: een bewijsstuk of de
      tussen de budgethouder en de zorgverlener overeengekomen afspraken waaruit blijkt dat de zorg niet kon worden
      geleverd in verband met deze quarantaine;

      f. ingeval van besmetting met Covid-19 of noodzakelijke quarantaine van de zorgverlener in verband met Covid-19:
      een bewijsstuk of de tussen de budgethouder en de zorgverlener overeengekomen afspraken waaruit blijkt dat de zorg
      niet kon worden geleverd in verband met deze besmetting of noodzakelijke quarantaine;

      g. ingeval van de in het tweede lid, onderdeel e of f, bedoelde situaties: een specificatie wanneer de zorg om deze
      redenen niet kon worden geleverd.

      10 De verzekerde bedoeld in het negende lid, verstrekt op verzoek van het zorgkantoor voor elke zorgverlener
      het op grond van het eerste lid, onderdelen c, d, e en f, totaal aantal betaalde uren inclusief het bijbehorende
      totaalbedrag door middel van een daartoe beschikbaar gesteld formulier aan de Sociale verzekeringsbank.


