  - number: '9.11'
    text: |-
      1 Een verzekerde die onmiddellijk voorafgaand aan de intrekking van de [Algemene Wet Bijzondere Ziektekosten][ref1]
      op grond van een indicatiebesluit is aangewezen op een zorgzwaartepakket als bedoeld in
      [artikel 11.1.1, eerste lid, van de wet][ref2] waarbij de datum van ingang van dat zorgzwaartepakket ligt
      na de datum van intrekking van de Algemene Wet Bijzondere Ziektekosten, wordt met ingang van de datum van
      ingang van dat zorgzwaartepakket voor de toepassing van deze wet gelijkgesteld met een verzekerde als bedoeld
      in artikel 11.1.1, eerste lid, van de wet ten aanzien van wie het CIZ heeft vastgesteld dat hij voldoet aan
      [artikel 3.2.1, eerste of derde lid, van de wet][ref3]. [Artikel 9.8, eerste en vierde lid][ref4], is van
      overeenkomstige toepassing.

      2 Een verzekerde die onmiddellijk voorafgaand aan de intrekking van de [Algemene Wet Bijzondere Ziektekosten][ref5]
      op grond van een indicatiebesluit is aangewezen op een zorgzwaartepakket als bedoeld in
      [artikel 11.1.1, tweede lid, van de wet][ref6] waarbij de datum van ingang van dat zorgzwaartepakket ligt
      na de datum van intrekking van de Algemene Wet Bijzondere Ziektekosten, wordt met ingang van de datum van
      ingang van dat zorgzwaartepakket voor de toepassing van deze wet gelijkgesteld met een verzekerde als bedoeld
      in artikel 11.1.1, tweede lid, van de wet ten aanzien van wie het CIZ heeft vastgesteld dat hij voldoet aan
      [artikel 3.2.1, eerste lid, van de wet][ref7]. [Artikel 9.8, tweede en vijfde lid][ref8], is van overeenkomstige
      toepassing.


