  - number: '2.2'
    text: |-
      1 Een verzekerde heeft recht op meer zorg dan waarop hij op grond van het hem geïndiceerde zorgprofiel of
      zorgzwaartepakket recht heeft, voor zover naar het oordeel van de Wlz-uitvoerder of het zorgkantoor meer zorg nodig
      is om te voorzien in zijn behoefte aan zorg en:

      a. de verzekerde krachtens zijn indicatiebesluit is aangewezen op zorgprofiel:

        - VV Beschermd wonen met zeer intensieve zorg vanwege specifieke aandoeningen, met de nadruk op begeleiding,
        - VV Beschermd wonen met zeer intensieve zorg vanwege specifieke aandoeningen, met de nadruk op verzorging/
      verpleging,
        - VG Wonen met intensieve begeleiding en intensieve verzorging,
        - VG (Besloten) wonen met zeer intensieve begeleiding, verzorging en gedragsregulering,
        - VG Wonen met begeleiding en volledige verzorging en verpleging,
        - LVG Wonen met zeer intensieve behandeling en begeleiding,
        - LVG Besloten wonen met zeer intensieve behandeling en begeleiding,
        - LVG Behandeling in een SGLVG behandelcentrum,
        - LG Wonen met begeleiding en intensieve verzorging,
        - LG Wonen met intensieve begeleiding en intensieve verzorging,
        - LG Wonen met zeer intensieve begeleiding en zeer intensieve verzorging,
        - ZGaud Wonen met intensieve begeleiding en intensieve verzorging,
        - ZGvis Wonen met zeer intensieve begeleiding en zeer intensieve verzorging,
        - GGZ-B Voortgezet verblijf met intensieve begeleiding en intensieve verpleging en verzorging,
        - GGZ-B Beveiligd voortgezet verblijf vanwege extreme gedragsproblematiek met zeer intensieve begeleiding,
        - GGZ wonen met intensieve begeleiding en intensieve verpleging en verzorging, of
        - GGZ Beveiligd wonen vanwege extreme gedragsproblematiek met zeer intensieve begeleiding.

      b. de verzekerde op 31 december 2014 recht had op zorgzwaartepakket 7 VV, 8 VV, 5 VG, 7 VG, 8 VG, 4 LVG, 5 LVG, 1
      SGLVG, 5 LG, 6 LG, 7 LG, 3 ZGaud, 5 ZGvis, 6b GGZ of 7b GGZ, of

      c. de behoefte aan zorg tevens bestaat uit:

      1°. gespecialiseerde epilepsiezorg;

      2°. chronische invasieve beademing;

      3°. non-invasieve beademing;

      4°. klinisch intensieve behandeling;

      5° niet-strafrechtelijke forensische psychiatrie;

      6°. observatie;

      7°. zorg in verband met een CVA;

      8°. zorg in verband met de ziekte van Huntington;

      9°. gespecialiseerde zorg in verband met de ziekte van Huntington waarbij sprake is van verblijf in een instelling;

      10°. gespecialiseerde zorg in verband met het syndroom van Korsakov waarbij sprake is van verblijf in een
      instelling;

      11°. gespecialiseerde zorg in verband met een langdurige bewustzijnsstoornis waarbij sprake is van verblijf in
      een instelling;

      12°. gespecialiseerde zorg in verband met dementie met zeer ernstig probleemgedrag die gericht is op verbetering
      van het probleemgedrag en waarbij sprake is van verblijf in een instelling;

      13°. gespecialiseerde zorg in verband met een zeer ernstige gerontopsychiatrische aandoening waarbij sprake is van
      verblijf in een instelling;

      14°. gespecialiseerde zorg in verband met multiple sclerose met ernstige motorische beperkingen waarbij sprake is
      van verblijf in een instelling;

      15°. gespecialiseerde zorg in verband met niet-aangeboren hersenletsel met zeer ernstig probleemgedrag waarbij
      sprake is van verblijf in een instelling; of

      16°. coördinerende activiteiten in het kader van de levensloopaanpak zoals omschreven in de Ketenveldnorm
      levensloopfunctie en beveiligde intensieve zorg.

      d. de verzekerde is aangewezen op palliatief terminale zorg en hij verblijft in een instelling en voor zover:

      1°. er een noodzaak is tot zeer intensieve 24-uurszorg, die op grond van het hem geïndiceerde zorgprofiel niet
      mogelijk is;

      2°. er een noodzaak is tot bestrijding van zware pijn, verwardheid, benauwdheid of onrust; en

      3°. er sprake is van complexe zorg en inzet van verschillende disciplines en noodzaak van continue nabijheid van
      zorg, of

      e. de verzekerde is aangewezen op palliatief terminale zorg en hij zijn recht op zorg tot gelding brengt met een
      volledig pakket thuis, of

      f. de verzekerde jonger is dan 23 jaar en verblijft in een instelling.

      2 Een verzekerde heeft recht op meer zorg dan waarop hij op grond van het hem geïndiceerde zorgprofiel of
      zorgzwaartepakket recht heeft indien:

      a. de verzekerde krachtens zijn indicatiebesluit is aangewezen op het zorgprofiel:

        - VG wonen met intensieve begeleiding en intensieve verzorging en er sprake is van een noodzaak tot permanent
      toezicht vanwege zwaar complexe somatische problematiek,
        - VG wonen met begeleiding en volledige verzorging en verpleging en er sprake is van een noodzaak tot permanent
      toezicht vanwege zwaar complexe somatische problematiek, of

      b. de behoefte aan zorg tevens bestaat uit chronische invasieve beademing of chronische non-invasieve beademing.

      3 Een verzekerde als bedoeld in het eerste lid, onder a of b, of tweede lid, onder a, kan slechts recht op de in
      die leden bedoelde zorg krijgen indien zijn behoefte aan zorg minimaal 25% hoger is dan de zorg die is opgenomen in
      het zorgzwaartepakket dat voor de bekostiging van het zorgprofiel wordt gebruikt dan wel van het zorgprofiel.
