  - number: '9.15'
    text: |-
      1 Een verzekerde als bedoeld in [artikel 11.1.3. van de wet][ref1] die op 31 december 2014 op grond van een
      indicatiebesluit is aangewezen op een zorgzwaartepakket B GGZ en die zorg behorende tot een zorgzwaartepakket LVG
      of SGLVG ontvangt en die niet op 1 januari 2018 op grond van een indicatiebesluit is aangewezen op zorg, wordt voor
      de toepassing van de wet gelijk gesteld met een verzekerde ten aanzien van wie het CIZ heeft vastgesteld dat hij
      voldoet aan [artikel 3.2.1, eerste lid, van de wet][ref2].

      2 Het CIZ indiceert de verzekerde, bedoeld in het eerste lid, met toepassing van bijlage A bij deze regeling
      in een bij hem best passend profiel waarbij de geldigheidsduur van het indicatiebesluit de totale, op grond van
      [artikel 3.2, eerste lid][ref3], geldende geldigheidsduur, niet overschrijdt.

      3 [Artikel 9.14, derde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel11.1.3
