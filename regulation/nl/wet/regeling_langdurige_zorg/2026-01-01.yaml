  - number: '9.16'
    text: |-
      1 Indien de verzekerde, bedoeld in [artikel 9.14, eerste lid][ref1], anders dan met de bedoeling om buiten een
      instelling te gaan verblijven een herindicatie aanvraagt dan wel in geval van herziening van het indicatiebesluit
      op grond van [artikel 3.2.4, aanhef en onderdeel b, van de wet][ref2], en het CIZ constateert dat hij niet voldoet
      aan [artikel 3.2.1, eerste lid, van de wet][ref3] indiceert het CIZ voor hem één van de zorgprofielen, bedoeld in
      [bijlage A][ref4] of [F][ref5] bij deze regeling.

      2 Indien de verzekerde, bedoeld in [artikel 9.15, eerste lid][ref6], anders dan met de bedoeling om buiten een
      instelling te gaan verblijven een herindicatie aanvraagt dan wel in geval van herziening van het indicatiebesluit
      op grond van [artikel 3.2.4, aanhef en onderdeel b, van de wet][ref7], en het CIZ constateert dat hij niet voldoet
      aan [artikel 3.2.1, eerste lid, van de wet][ref8] indiceert het CIZ voor hem één van de zorgprofielen, bedoeld in
      [bijlage A][ref9] bij deze regeling.


