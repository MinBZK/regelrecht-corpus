      1 Deeltijdverblijf is uitgesloten voor de verzekerde die krachtens zijn indicatiebesluit is aangewezen op
      zorg behorend bij een zorgprofiel behorend bij de sector GGZ-B, LVG of SGLVG, of een indicatie heeft voor VV-
      Herstelgerichte behandeling met verpleging en verzorging, danwel voor een zorgzwaartepakket behorend bij de sector
      GGZ-B, LVG of SGLVG.

      2 Deeltijdverblijf is uitgesloten voor de verzekerde die krachtens zijn indicatiebesluit is aangewezen op zorg
      behorend bij zorgzwaartepakket 1VV, 2VV, 3VV, 1VG, 2VG, 1LG, 3LG, 1ZG-aud of 1ZG-vis.

      3 De Wlz-uitvoerder wijst de aanvraag van een modulair pakket thuis af op grond van doelmatigheid indien naast
      deeltijdverblijf ontlasting van de mantelzorg noodzakelijk is door middel van logeeropvang als bedoeld in
      [artikel 3.1.1, eerste lid, onder g, van de wet][ref1].


