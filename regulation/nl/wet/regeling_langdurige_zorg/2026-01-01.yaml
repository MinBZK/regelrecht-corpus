  - number: '9.10'
    text: |-
      1 Indien een verzekerde als bedoeld in [artikel 11.1.1, tweede of derde lid, van de wet ][ref1]tijdens de periode
      van zijn overgangrecht, een herindicatie aanvraagt, dan wel in geval van herziening van het indicatiebesluit
      op grond van [artikel 3.2.4, aanhef en onderdeel b, van de wet][ref2], en het CIZ constateert dat hij geen
      behoefte heeft aan permanent toezicht of vierentwintig uur per dag zorg in de nabijheid als bedoeld in
      [artikel 3.2.1, eerste lid, van de wet][ref3], indiceert het CIZ hem met toepassing van [bijlage F][ref4] bij deze
      regeling in een bij de verzekerde best passend zorgprofiel.

      2 Het CIZ geeft een besluit tot herindicatie, dan wel herziening van het indicatiebesluit, van een verzekerde als
      bedoeld in [artikel 11.1.1, derde lid, van de wet][ref5] een geldigheidsduur die de duur van het voor de verzekerde
      geldende overgangsrecht niet overschrijdt.

      3 Met betrekking tot de herindicatie, dan wel herziening van het indicatiebesluit, bedoeld in het eerste lid, is
      [artikel 9.1.2 van de wet][ref6] van overeenkomstige toepassing.


