  - number: 5.17a
    text: |-
      1 Onder een verzekerde met een zeer complexe zorgbehoefte als bedoeld in
      [artikel 3.1.3, tweede lid, aanhef, van het Besluit][ref1] wordt verstaan een verzekerde die vanwege ernstige
      lichamelijke en verstandelijke beperkingen sterk afhankelijk is van begeleiding, verpleging en verzorging door
      bekende personen.

      2 Onder een passende zorglocatie als bedoeld in [artikel 3.1.3, tweede lid, onderdeel a, van het Besluit][ref2]
      wordt verstaan een zorglocatie die specifiek is ingericht voor het leveren van begeleiding, verpleging en
      verzorging aan verzekerden met een zeer complexe zorgbehoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3.1.3
