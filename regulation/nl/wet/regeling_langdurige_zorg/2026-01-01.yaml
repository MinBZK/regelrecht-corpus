  - number: '5.11'
    text: |-
      1 De verzekerde of diens wettelijk vertegenwoordiger of gevolmachtigde verstrekt het zorgkantoor, indien van
      toepassing, onverwijld:

      a. de naam en het adres van alsmede de beschikking tot benoeming van de wettelijk vertegenwoordiger; of

      b. de naam en het adres van de gevolmachtigde en een volledig ingevuld en ondertekend machtigingsformulier wat
      daartoe door het zorgkantoor beschikbaar is gesteld.

      2 De verlening van een persoonsgebonden budget kan worden geweigerd indien een gegronde reden bestaat om aan te
      nemen dat de in het eerste lid bedoelde wettelijk vertegenwoordiger of gevolmachtigde:

      1°. bij een eerdere verstrekking van persoonsgebonden budgetten waarbij deze derde als hulppersoon of
      vertegenwoordiger optrad niet heeft ingestaan voor nakoming van de daaraan verbonden verplichtingen,

      2°. blijkens de basisregistratie personen niet beschikt over een woonadres,

      3°. zijn vrijheid is ontnomen,

      4°. onder de schuldsaneringsregeling natuurlijke personen valt, dan wel een verzoek tot van toepassing verklaring
      van die regeling bij de rechtbank is ingediend of deze derde failliet is verklaard,

      5°. een persoon is zoals bedoeld in
      [artikel 383, vijfde lid, onderdeel d, e of f, van Boek 1 van het Burgerlijk Wetboek][ref1],

      6°. anderszins onvoldoende waarborg zal bieden voor het nakomen van de voor de verzekerde aan het persoonsgebonden
      budget verbonden verplichtingen.

      3 Op verzoek van de verzekerde die de leeftijd van 21 jaar nog niet heeft bereikt of van diens vertegenwoordiger,
      wordt een persoonsgebonden budget verleend aan de organisatie die belast is met de ondertoezichtstelling
      van de verzekerde of die een reclasseringsmaatregel uitoefent krachtens een uitspraak van de rechter
      of het Openbaar Ministerie op grond van [artikel 14d][ref2], [artikel 15b, tweede lid][ref3], of
      [Boek I, Titel VIII A Bijzondere bepalingen voor jeugdige personen van het Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel383
