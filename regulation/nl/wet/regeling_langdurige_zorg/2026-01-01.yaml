  - number: '9.14'
    text: |-
      1 Een verzekerde als bedoeld in [artikel 11.1.3 van de wet][ref1] die op 31 december 2014 op grond van een
      indicatiebesluit is aangewezen op een zorgzwaartepakket B GGZ en die zorg behorende tot een zorgzwaartepakket
      VV, VG, LG, ZGaud en ZGvis ontvangt en die niet op 1 januari 2018 op grond van een indicatiebesluit is
      aangewezen op zorg, kan er voor kiezen met ingang van 1 januari 2018 voor de toepassing van de wet gelijk
      te worden gesteld met een verzekerde ten aanzien van wie het CIZ heeft vastgesteld dat hij voldoet aan
      [artikel 3.2.1, eerste lid, van de wet][ref2].

      2 Het CIZ indiceert de verzekerde, bedoeld in het eerste lid, met toepassing van [bijlage A][ref3] of [F][ref4]
      bij deze regeling in een bij hem best passende zorgprofiel.

      3 In afwijking van [artikel 3.3.1, eerste lid, van de wet][ref5] heeft de verzekerde, bedoeld in het eerste lid,
      slechts recht op zorg met verblijf in een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel11.1.3
