  - number: '9.13'
    text: |-
      Voor de verzekerde die op 31 december 2016 een persoonsgebonden budget ontving op grond van de wet en waarvoor het
      op grond van [artikel 5.22][ref1] zoals dat luidde op 31 december 2016 uit het persoonsgebonden budget te betalen
      bruto loon of de te betalen vergoeding aan een zorgaanbieder ten hoogste het in het eerste lid van dat artikel
      genoemde bedrag of tarief bedroeg, blijft dat bedrag of tarief gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel5.22
    url: https://wetten.overheid.nl/BWBR0036014/2026-01-01#Artikel9.13
