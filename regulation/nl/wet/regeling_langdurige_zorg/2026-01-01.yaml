  - number: '5.22'
    text: |-
      1 Het uit het persoonsgebonden budget te betalen bruto loon of de te betalen vergoeding aan een zorgaanbieder
      bedraagt ten hoogste € 26,98 per uur, tenzij de verzekerde kan aantonen dat de zorg is verleend door:

      a. een onderneming als bedoeld in [artikel 5, onderdelen a, c, d of e, van de Handelsregisterwet 2007][ref1]
      waarvan de activiteiten blijkens de inschrijving in het handelsregister, bedoeld in [artikel 2 van die wet][ref2],
      geheel of gedeeltelijk bestaan uit het verlenen van zorg als bedoeld in [artikel 3.3.3 van de wet][ref3];

      b. een onderneming als bedoeld in [artikel 5, onderdeel b, van de Handelsregisterwet 2007][ref4] waarvan de
      activiteiten blijkens de inschrijving in het handelsregister, bedoeld in [artikel 2 van die wet,][ref5] geheel of
      gedeeltelijk bestaan uit het verlenen van zorg als bedoeld in [artikel 3.3.3 van de wet][ref6], en die toebehoort
      aan een zelfstandige zonder personeel;

      c. een persoon die is ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref7], voor het uitoefenen van een beroep
      voor het verlenen van zorg als bedoeld in [artikel 3.3.3 van de wet][ref8].

      2 In afwijking van het eerste lid wordt een bruto uurloon dan wel vergoeding van ten hoogste € 84,99 per uur of
      € 78,24 per dagdeel gehanteerd of een bruto loon dan wel vergoeding van ten hoogste het door de zorgautoriteit
      op grond van de [Wet marktordening gezondheidszorg][ref9] voor de desbetreffende zorg vastgestelde hoger tarief,
      indien:

      a. de verzekerde kan aantonen dat de zorg is verleend door een onderneming als bedoeld in het eerste lid,
      onderdelen a of b, of een persoon als bedoeld in het eerste lid, onderdeel c; of

      b. een verzekerde voor 1 januari 2014 een persoonsgebonden budget ontving als bedoeld in de
      [Algemene Wet Bijzondere Ziektekosten][ref10] en onafgebroken een persoonsgebonden budget als bedoeld in de
      Algemene Wet Bijzondere Ziektekosten of de [wet][ref11] heeft ontvangen.

      3 Het eerste lid, onder b en c, is niet van toepassing indien de zorgverlener een echtgenoot of een bloed- of
      aanverwante in de eerste of tweede graad is van de verzekerde.

      4 In het te betalen bruto loon of de vergoeding per uur of per dagdeel, bedoeld in het eerste en tweede lid,
      is, indien van toepassing krachtens de [Wet minimumloon en minimumvakantiebijslag][ref12], vakantiebijslag
      verdisconteerd als bedoeld in die wet.

      5 Het aantal door de zorgverlener voor de verzekerde gewerkte en betaalde uren mag niet afwijken van het
      [Arbeidstijdenbesluit][ref13] en mag indien het Arbeidstijdenbesluit niet van toepassing is, niet meer bedragen dan
      veertig uur per week.


