  - number: '5.18'
    text: |-
      1 Bij de verlening van het persoonsgebonden budget worden de verzekerde in ieder geval de volgende verplichtingen
      opgelegd:

      a. de verzekerde gebruikt het persoonsgebonden budget uitsluitend voor het doen betalen door de Sociale
      verzekeringsbank als bedoeld in [artikel 5.17, eerste lid][ref1];

      b. de zorg die de verzekerde inkoopt, is kwalitatief verantwoord;

      c. de verzekerde past een zorgovereenkomst en zorgbeschrijving onverwijld aan indien van enige verandering in de
      daarin opgenomen feiten sprake is;

      d. de verzekerde draagt er zorg voor dat een zorgverlener op wie het [Arbeidstijdenbesluit][ref2] niet van
      toepassing is niet meer dan veertig uur in één week voor hem werkzaamheden verricht;

      e. de verzekerde laat de betalingen aan de zorgverlener uitsluitend verrichten door de
      Sociale verzekeringsbank, tenzij het gaat om kosten verbonden aan vervoer als bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel f, van de wet][ref3], waarvoor geen zorgovereenkomst is gesloten;

      f. de verzekerde besteedt het persoonsgebonden budget niet aan logeeropvang buiten de Europese Unie;

      g. de verzekerde deelt het zorgkantoor op diens verzoek of onverwijld uit eigen beweging alle feiten en
      omstandigheden mee waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op de
      verstrekking van het persoonsgebonden budget.

      2 Bij de verlening van een persoonsgebonden budget kunnen aan de verzekerde verplichtingen worden opgelegd die
      betrekking hebben op de kwaliteit en doelmatigheid van de in te kopen zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0036014#Artikel5.17
      [ref2]: https://wetten.overheid.nl/BWBR0007687
