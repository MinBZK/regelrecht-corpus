$id: burgerlijk_wetboek_bes_boek_6
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028749
url: https://wetten.overheid.nl/BWBR0028749/2010-10-10
articles:
  - number: '1'
    text: Verbintenissen kunnen slechts ontstaan, indien dit uit de wet voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      Schuldeiser en schuldenaar zijn verplicht zich jegens elkaar te gedragen overeenkomstig de eisen van redelijkheid
      en billijkheid.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Een tussen hen krachtens wet, gewoonte of rechtshandeling geldende regel is niet van toepassing, voor zover dit in
      de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel2
  - number: '3.1'
    text: Een natuurlijke verbintenis is een rechtens niet-afdwingbare verbintenis.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel3
  - number: '3.2'
    text: 'Een natuurlijke verbintenis bestaat, wanneer:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel3
  - number: 3.2.a
    text: de wet of een rechtshandeling aan een verbintenis de afdwingbaarheid onthoudt;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel3
  - number: 3.2.b
    text: |-
      iemand jegens een ander een dringende morele verplichting heeft van zodanige aard dat naleving daarvan, ofschoon
      rechtens niet afdwingbaar, naar maatschappelijke opvattingen als voldoening van een aan die ander toekomende
      prestatie moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Op natuurlijke verbintenissen zijn de wettelijke bepalingen betreffende verbintenissen van overeenkomstige
      toepassing, tenzij de wet of haar strekking meebrengt dat een bepaling geen toepassing mag vinden op een niet-
      afdwingbare verbintenis.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Een natuurlijke verbintenis wordt omgezet in een rechtens afdwingbare door een overeenkomst van de schuldenaar met
      de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Een door de schuldenaar tot de schuldeiser gericht aanbod tot een zodanige overeenkomst om niet geldt als aanvaard,
      wanneer het aanbod ter kennis van de schuldeiser is gekomen en deze het niet onverwijld heeft afgewezen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel5
  - number: '5.3'
    text: Op de overeenkomst zijn de bepalingen betreffende schenkingen en giften niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Is een prestatie door twee of meer schuldenaren verschuldigd, dan zijn zij ieder voor een gelijk deel verbonden,
      tenzij uit wet, gewoonte of rechtshandeling voortvloeit dat zij voor ongelijke delen of hoofdelijk verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Is de prestatie ondeelbaar of vloeit uit wet, gewoonte of rechtshandeling voort dat de schuldenaren ten aanzien van
      een zelfde schuld ieder voor het geheel aansprakelijk zijn, dan zijn zij hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Uit een overeenkomst van een schuldenaar met zijn schuldeiser kan voortvloeien dat, wanneer de schuld op twee of
      meer rechtsopvolgers overgaat, dezen voor ongelijke delen of hoofdelijk verbonden zullen zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      Indien twee of meer schuldenaren hoofdelijk verbonden zijn, heeft de schuldeiser tegenover ieder van hen recht op
      nakoming voor het geheel.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Nakoming door een der schuldenaren bevrijdt ook zijn medeschuldenaren tegenover de schuldeiser. Hetzelfde geldt,
      wanneer de schuld wordt gedelgd door inbetalinggeving of verrekening, alsmede wanneer de rechter op vordering van
      een der schuldenaren [artikel 60][ref1] toepast, tenzij hij daarbij anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel60
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '60'
        afdeling: '8'
  - number: '8'
    text: |-
      Op de rechtsbetrekkingen tussen de hoofdelijke schuldenaren onderling is [artikel 2][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel2
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '2'
        afdeling: '1'
  - number: '9.1'
    text: |-
      Iedere hoofdelijke schuldenaar is bevoegd namens de overige schuldenaren een aanbod tot afstand om niet van het
      vorderingsrecht te aanvaarden, voor zover de afstand ook de andere schuldenaren betreft.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Uitstel van betaling, door de schuldeiser aan een der schuldenaren verleend, werkt ook ten aanzien van zijn
      medeschuldenaren, voor zover blijkt dat dit de bedoeling van de schuldeiser is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      Hoofdelijke schuldenaren zijn, ieder voor het gedeelte van de schuld dat hem in hun onderlinge verhouding aangaat,
      verplicht overeenkomstig het tweede en derde lid in de schuld en in de kosten bij te dragen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      De verplichting tot bijdragen in de schuld die ten laste van een der hoofdelijke schuldenaren wordt gedelgd voor
      meer dan het gedeelte dat hem aangaat, komt op iedere medeschuldenaar te rusten voor het bedrag van dit meerdere,
      telkens tot ten hoogste het gedeelte van de schuld dat de medeschuldenaar aangaat.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel10
  - number: '10.3'
    text: |-
      In door een hoofdelijke schuldenaar in redelijkheid gemaakte kosten moet iedere medeschuldenaar bijdragen naar
      evenredigheid van het gedeelte van de schuld dat hem aangaat, tenzij de kosten slechts de schuldenaar persoonlijk
      betreffen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Een uit hoofde van [artikel 10][ref1] tot bijdragen aangesproken medeschuldenaar kan de verweermiddelen die hij op
      het tijdstip van het ontstaan van de verplichting tot bijdragen jegens de schuldeiser had, ook inroepen tegen de
      hoofdelijke schuldenaar die de bijdrage van hem verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel10
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '10'
        afdeling: '2'
  - number: '11.2'
    text: |-
      Niettemin kan hij een zodanig verweermiddel niet tegen deze schuldenaar inroepen, indien het na hun beider
      verbintenis is ontstaan uit een rechtshandeling die de schuldeiser met of jegens de aangesprokene heeft verricht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Een beroep op verjaring van de rechtsvordering van de schuldeiser komt de tot bijdragen aangesprokene slechts toe,
      indien op het tijdstip van het ontstaan van de verplichting tot bijdragen zowel hijzelf als degene die de bijdrage
      verlangt, jegens de schuldeiser de voltooiing van de verjaring had kunnen inroepen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel11
  - number: '11.4'
    text: |-
      Het eerste tot en met derde lid is slechts van toepassing, voor zover uit de rechtsverhouding tussen de
      schuldenaren niet anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      Wordt de schuld ten laste van een hoofdelijke schuldenaar gedelgd voor meer dan het gedeelte dat hem aangaat,
      dan gaan de rechten van de schuldeiser jegens de medeschuldenaren en jegens derden krachtens subrogatie voor dit
      meerdere op die schuldenaar over, telkens tot ten hoogste het gedeelte dat de medeschuldenaar of de derde aangaat
      in zijn verhouding tot die schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Door de subrogatie wordt de vordering, indien zij een andere prestatie dan geld betrof, omgezet in een
      geldvordering van gelijke waarde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel12
  - number: '13.1'
    text: |-
      Blijkt verhaal op een hoofdelijke schuldenaar voor een vordering als bedoeld in de [artikelen 10][ref1]
      en [12][ref2], geheel of gedeeltelijk onmogelijk, dan wordt het onverhaalbaar gebleken deel over al zijn
      medeschuldenaren omgeslagen naar evenredigheid van de gedeelten waarvoor de schuld ieder van hen in hun onderlinge
      verhouding aanging.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel12
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '10'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '12'
        afdeling: '2'
  - number: '13.2'
    text: |-
      Werd de schuld geheel of gedeeltelijk gedelgd ten laste van een hoofdelijke schuldenaar wie de schuld zelf niet
      aanging, en blijkt op geen van de medeschuldenaren wie de schuld wel aanging, verhaal mogelijk, dan wordt het
      onverhaalbaar gebleken deel over alle medeschuldenaren wie de schuld niet aanging, omgeslagen naar evenredigheid
      van de bedragen waarvoor ieder op het tijdstip van de delging van de schuld jegens de schuldeiser aansprakelijk
      was.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel13
  - number: '13.3'
    text: |-
      Ieder der in een omslag betrokkenen blijft gerechtigd het bijgedragene alsnog van hem die geen verhaal bood, terug
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Afstand door de schuldeiser van zijn vorderingsrecht jegens een hoofdelijke schuldenaar bevrijdt deze niet van
      zijn verplichting tot bijdragen. De schuldeiser kan hem niettemin van zijn verplichting tot bijdragen jegens een
      medeschuldenaar bevrijden door zich jegens deze laatste te verbinden zijn vordering op hem te verminderen met het
      bedrag dat als bijdrage gevorderd had kunnen worden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Is een prestatie aan twee of meer schuldeisers verschuldigd, dan heeft ieder van hen een vorderingsrecht voor een
      gelijk deel, tenzij uit wet, gewoonte of rechtshandeling voortvloeit dat de prestatie hun voor ongelijke delen
      toekomt of dat zij gezamenlijk één vorderingsrecht hebben.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Is de prestatie ondeelbaar of valt het recht daarop in een gemeenschap, dan hebben zij gezamenlijk één
      vorderingsrecht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel15
  - number: '15.3'
    text: |-
      Aan de schuldenaar kan niet worden tegengeworpen dat het vorderingsrecht in een gemeenschap valt, wanneer dit recht
      voortspruit uit een overeenkomst die hij met de deelgenoten heeft gesloten, maar hij niet wist noch behoefde te
      weten dat dit recht van die gemeenschap ging deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Wanneer met de schuldenaar is overeengekomen dat twee of meer personen als schuldeiser de prestatie van hem voor
      het geheel kunnen vorderen, met dien verstande dat de voldoening aan de een hem ook jegens de anderen bevrijdt,
      doch in de onderlinge verhouding van die personen de prestatie niet aan hen allen gezamenlijk toekomt, zijn op hun
      rechtsverhouding jegens de schuldenaar de in geval van gemeenschap geldende regels van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Een verbintenis is alternatief, wanneer de schuldenaar verplicht is tot één van twee of meer verschillende
      prestaties ter keuze van hemzelf, van de schuldeiser of van een derde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel17
  - number: '17.2'
    text: De keuze komt toe aan de schuldenaar, tenzij uit wet, gewoonte of rechtshandeling anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel17
  - number: '18'
    text: Een alternatieve verbintenis wordt enkelvoudig door het uitbrengen van de keuze door de daartoe bevoegde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel18
  - number: '19.1'
    text: |-
      Wanneer de keuze aan een der partijen toekomt, gaat de bevoegdheid om te kiezen op de andere partij over, indien
      deze haar wederpartij een redelijke termijn heeft gesteld tot bepaling van haar keuze en deze daarbinnen haar keuze
      niet heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel19
  - number: '19.2'
    text: |-
      De bevoegdheid om te kiezen gaat echter niet over op de schuldeiser voordat deze het recht heeft om nakoming te
      vorderen, noch op de schuldenaar voordat deze het recht heeft om te voldoen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel19
  - number: '19.3'
    text: |-
      Indien op de vordering een pandrecht of een beslag rust en de aangevangen executie bij gebreke van een keuze niet
      kan worden voortgezet, kan de pandhouder of de beslaglegger aan beide partijen een redelijke termijn stellen om
      overeenkomstig hun onderlinge rechtsverhouding een keuze uit te brengen. Indien de keuze niet binnen deze termijn
      geschiedt, gaat de bevoegdheid tot kiezen op de pandhouder of beslaglegger over. Zij zijn gehouden niet nodeloos
      van deze bevoegdheid gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel19
  - number: '20.1'
    text: De onmogelijkheid om een of meer der prestaties te verrichten, doet geen afbreuk aan de bevoegdheid om te kiezen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel20
  - number: '20.2'
    text: |-
      Indien de keuze aan de schuldenaar toekomt, is deze echter niet bevoegd een onmogelijke prestatie te kiezen, tenzij
      de onmogelijkheid een gevolg is van een aan de schuldeiser toe te rekenen oorzaak of deze met de keuze instemt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel20
  - number: '21'
    text: |-
      Een verbintenis is voorwaardelijk, wanneer bij rechtshandeling haar werking van een toekomstige onzekere
      gebeurtenis afhankelijk is gesteld.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel21
  - number: '22'
    text: |-
      Een opschortende voorwaarde doet de werking der verbintenis eerst met het plaatsvinden der gebeurtenis aanvangen;
      een ontbindende voorwaarde doet de verbintenis met het plaatsvinden der gebeurtenis vervallen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      Wanneer de partij die bij de niet-vervulling belang had, de vervulling heeft belet, geldt de voorwaarde als
      vervuld, indien redelijkheid en billijkheid dit verlangen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      Wanneer de partij die bij de vervulling belang had, deze heeft teweeggebracht, geldt de voorwaarde als niet
      vervuld, indien redelijkheid en billijkheid dit verlangen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      Nadat een ontbindende voorwaarde is vervuld, is de schuldeiser verplicht de reeds verrichte prestaties ongedaan te
      maken, tenzij uit de inhoud of strekking van de rechtshandeling anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      Strekt de verplichting tot ongedaanmaking tot teruggave van een goed, dan komen de na de vervulling van de
      voorwaarde afgescheiden natuurlijke of opeisbaar geworden burgerlijke vruchten aan de schuldenaar toe en zijn de
      [artikelen 120 tot en met 124 van Boek 3][ref1] van overeenkomstige toepassing met betrekking tot hetgeen daarin
      is bepaald omtrent de vergoeding van kosten en van schade, voor zover die kosten en die schade na de vervulling
      zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel120
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '120'
  - number: '25'
    text: |-
      Is een krachtens een verbintenis onder opschortende voorwaarde verschuldigde prestatie vóór de vervulling van de
      voorwaarde verricht, dan kan overeenkomstig [titel 4, afdeling 2][ref1], ongedaanmaking van de prestatie worden
      gevorderd zolang de voorwaarde niet in vervulling is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '2'
  - number: '26'
    text: |-
      Op voorwaardelijke verbintenissen zijn de bepalingen betreffende onvoorwaardelijke verbintenissen van toepassing,
      voor zover het voorwaardelijk karakter van de betrokken verbintenis zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel26
  - number: '27'
    text: |-
      Hij die een individueel bepaalde zaak moet afleveren, is verplicht tot de aflevering voor deze zaak zorg te dragen
      op de wijze waarop een zorgvuldig schuldenaar dit in de gegeven omstandigheden zou doen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel27
  - number: '28'
    text: |-
      Indien de verschuldigde zaak of zaken slechts zijn bepaald naar de soort en binnen de aangeduide soort verschil in
      kwaliteit bestaat, mag hetgeen de schuldenaar aflevert, niet beneden goede gemiddelde kwaliteit liggen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel28
  - number: '29'
    text: De schuldenaar is zonder toestemming van de schuldeiser niet bevoegd het verschuldigde in gedeelten te voldoen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel29
  - number: '30.1'
    text: |-
      Een verbintenis kan door een ander dan de schuldenaar worden nagekomen, tenzij haar inhoud of strekking zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      De schuldeiser komt niet in verzuim, indien hij een door een derde aangeboden voldoening weigert met goedvinden van
      de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel30
  - number: '31'
    text: |-
      Betaling aan een onbekwame schuldeiser bevrijdt de schuldenaar, voor zover het betaalde de onbekwame tot werkelijk
      voordeel heeft gestrekt of in de macht is gekomen van diens wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel31
  - number: '32'
    text: |-
      Betaling aan een ander dan de schuldeiser of dan degene die met hem of in zijn plaats bevoegd is haar te ontvangen,
      bevrijdt de schuldenaar, voor zover degene aan wie betaald moest worden de betaling heeft bekrachtigd of erdoor
      is gebaat.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel32
  - number: '33'
    text: |-
      Is de betaling gedaan in weerwil van een beslag of terwijl de schuldeiser wegens een beperkt recht, een bewind of
      een soortgelijk beletsel onbevoegd was haar te ontvangen, en wordt de schuldenaar deswege genoodzaakt opnieuw te
      betalen, dan heeft hij verhaal op de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel33
  - number: '34.1'
    text: |-
      De schuldenaar die heeft betaald aan iemand die niet bevoegd was de betaling te ontvangen, kan aan degene aan
      wie betaald moest worden, tegenwerpen dat hij bevrijdend heeft betaald, indien hij op redelijke gronden heeft
      aangenomen dat de ontvanger der betaling als schuldeiser tot de prestatie gerechtigd was of dat uit anderen hoofde
      aan hem moest worden betaald.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel34
  - number: '34.2'
    text: |-
      Indien iemand zijn recht om betaling te vorderen verliest, in dier voege dat het met terugwerkende kracht aan
      een ander toekomt, kan de schuldenaar een inmiddels gedane betaling aan die ander tegenwerpen, tenzij hetgeen hij
      omtrent dit verlies kon voorzien, hem van de betaling had behoren te weerhouden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      Is in geval van betaling door een derde te zijnen aanzien aan de vereisten van
      [artikel 34, eerste of tweede lid][ref1], voldaan, dan kan hij te zijnen behoeve de bevrijdende werking van die
      betaling inroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel34
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '34'
        afdeling: '6'
  - number: '35.2'
    text: |-
      De schuldenaar kan de bevrijdende werking van die betaling te zijnen behoeve inroepen, indien, bij betaling door
      hemzelf, ook wat hem betreft aan die vereisten zou zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel35
  - number: '36'
    text: |-
      In de gevallen, bedoeld in de [artikelen 34][ref1] en [35][ref2], heeft de ware gerechtigde verhaal op degene die
      de betaling zonder recht heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel35
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '34'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '35'
        afdeling: '6'
  - number: '37'
    text: |-
      De schuldenaar is bevoegd de nakoming van zijn verbintenis op te schorten, indien hij op redelijke gronden twijfelt
      aan wie de betaling moet geschieden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel37
  - number: '38'
    text: |-
      Indien geen tijd voor de nakoming is bepaald, kan de verbintenis terstond worden nagekomen en kan terstond nakoming
      worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      Is wel een tijd voor de nakoming bepaald, dan wordt vermoed dat dit slechts belet dat eerdere nakoming wordt
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel39
  - number: '39.2'
    text: Betaling vóór de vervaldag geldt niet als onverschuldigd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel39
  - number: '40'
    text: 'De schuldenaar kan de tijdsbepaling niet meer inroepen, wanneer:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel40
  - number: 40.a
    text: hij in staat van faillissement is verklaard;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel40
  - number: 40.b
    text: hij in gebreke blijft de door hem toegezegde zekerheid te verschaffen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel40
  - number: 40.c
    text: |-
      door een aan hem toe te rekenen oorzaak de voor de vordering gestelde zekerheid verminderd is, tenzij het
      overgeblevene nog een voldoende waarborg voor de voldoening oplevert.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel40
  - number: '41'
    text: 'Indien geen plaats voor de nakoming is bepaald, moet de aflevering van een verschuldigde zaak geschieden:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel41
  - number: 41.a
    text: 'in geval van een individueel bepaalde zaak: ter plaatse waar zij zich bij het ontstaan van de verbintenis bevond;'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel41
  - number: 41.b
    text: |-
      in geval van een naar de soort bepaalde zaak: ter plaatse waar de schuldenaar zijn beroep of bedrijf uitoefent of,
      bij gebreke daarvan, zijn woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel41
  - number: '42'
    text: |-
      Hij die ter nakoming van een verbintenis een zaak heeft afgeleverd waarover hij niet bevoegd was te beschikken,
      kan vorderen dat deze wordt afgegeven aan degene aan wie zij toekomt, mits hij tegelijkertijd een andere, aan de
      verbintenis beantwoordende zaak aanbiedt en het belang van de schuldeiser zich niet tegen teruggave verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel42
  - number: '43.1'
    text: |-
      Verricht de schuldenaar een betaling die zou kunnen worden toegerekend op twee of meer verbintenissen jegens een
      zelfde schuldeiser, dan geschiedt de toerekening op de verbintenis die de schuldenaar bij de betaling aanwijst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel43
  - number: '43.2'
    text: |-
      Bij gebreke van zodanige aanwijzing geschiedt de toerekening in de eerste plaats op de opeisbare verbintenissen.
      Zijn er ook dan nog meer verbintenissen waarop de toerekening zou kunnen plaatsvinden, dan geschiedt deze in de
      eerste plaats op de meest bezwarende en zijn de verbintenissen even bezwarend, op de oudste. Zijn de verbintenissen
      bovendien even oud, dan geschiedt de toerekening naar evenredigheid.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel43
  - number: '44.1'
    text: |-
      Betaling van een op een bepaalde verbintenis toe te rekenen geldsom strekt in de eerste plaats in mindering van
      de kosten, vervolgens in mindering van de verschenen rente en tenslotte in mindering van de hoofdsom en de lopende
      rente.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel44
  - number: '44.2'
    text: |-
      De schuldeiser kan, zonder daardoor in verzuim te komen, een aanbod tot betaling weigeren, indien de schuldenaar
      een andere volgorde voor de toerekening aanwijst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel44
  - number: '44.3'
    text: |-
      De schuldeiser kan volledige aflossing van de hoofdsom weigeren, indien daarbij niet tevens de verschenen en
      lopende rente alsmede de kosten worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel44
  - number: '45'
    text: |-
      Slechts met toestemming van de schuldeiser kan een schuldenaar zich van zijn verbintenis bevrijden door een andere
      prestatie dan de verschuldigde, al mocht zij van gelijke of zelfs hogere waarde zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      Wanneer de schuldeiser een cheque, postcheque, overschrijvingsorder of een ander hem bij wijze van betaling
      aangeboden papier in ontvangst neemt, wordt vermoed dat dit geschiedt onder voorbehoud van goede afloop.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel46
  - number: '46.2'
    text: |-
      Is de schuldeiser bevoegd de nakoming van een op hem rustende verplichting tot het tijdstip van de betaling op te
      schorten, dan behoudt hij dit opschortingsrecht totdat zekerheid van goede afloop bestaat of door hem had kunnen
      worden verkregen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel46
  - number: '47.1'
    text: De kosten van betaling komen ten laste van degene die de verbintenis nakomt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel47
  - number: '47.2'
    text: De kosten van een kwitantie komen ten laste van degene ten behoeve van wie het stuk wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel47
  - number: '48.1'
    text: |-
      De schuldeiser is verplicht voor iedere voldoening een kwitantie af te geven, tenzij uit overeenkomst, gewoonte of
      billijkheid anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel48
  - number: '48.2'
    text: |-
      Indien de schuldeiser een ter zake van de schuld afgegeven bewijsstuk heeft, kan de schuldenaar bij voldoening
      bovendien de afgifte van dat bewijsstuk vorderen, tenzij de schuldeiser een redelijk belang heeft bij het behoud
      van het stuk en daarop de nodige aantekening tot bewijs van de bevrijding van de schuldenaar stelt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel48
  - number: '48.3'
    text: |-
      De schuldenaar kan de nakoming van zijn verbintenis opschorten, indien de schuldeiser niet voldoet aan het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel48
  - number: '49.1'
    text: |-
      Bij voldoening van een vordering aan toonder of order kan de schuldenaar eisen dat een kwijting op het papier wordt
      gesteld en dat hem het papier wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel49
  - number: '49.2'
    text: |-
      Indien de voldoening niet de gehele vordering betreft of de schuldeiser het papier nog voor de uitoefening van
      andere rechten nodig heeft, kan hij het papier behouden, mits hij naast de kwijting die op het papier is gesteld,
      tevens een afzonderlijke kwijting afgeeft.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel49
  - number: '49.3'
    text: |-
      Hij kan, ongeacht of geheel of gedeeltelijk voldaan wordt, volstaan met de enkele afgifte van een kwijting, mits
      hij op verlangen van de wederpartij aantoont dat het papier vernietigd of waardeloos geworden is, of zekerheid
      stelt voor 20 jaren of een zoveel kortere tijdsduur als verwacht mag worden dat de wederpartij nog aan een
      vordering uit hoofde van het papier bloot zal kunnen staan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel49
  - number: '49.4'
    text: |-
      De schuldenaar kan de nakoming van zijn verbintenis opschorten, indien de schuldeiser niet aan het eerste tot en
      met derde lid voldoet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel49
  - number: '50.1'
    text: |-
      Moeten op achtereenvolgende tijdstippen gelijksoortige prestaties worden verricht, dan leveren de kwitanties van
      twee achtereenvolgende termijnen het vermoeden op dat ook de vroegere termijnen zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel50
  - number: '50.2'
    text: |-
      Indien de schuldeiser een kwitantie afgeeft voor de hoofdsom, wordt vermoed dat ook de rente en de kosten zijn
      voldaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel50
  - number: '51.1'
    text: |-
      Wanneer uit de wet voortvloeit dat iemand verplicht is tot het stellen van zekerheid of dat het stellen van
      zekerheid voorwaarde is voor het intreden van enig rechtsgevolg, heeft hij die daartoe overgaat, de keuze tussen
      persoonlijke en zakelijke zekerheid.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel51
  - number: '51.2'
    text: |-
      De aangeboden zekerheid moet zodanig zijn dat de vordering en, zo daartoe gronden zijn, de daarop vallende rente en
      kosten behoorlijk gedekt zijn en dat de schuldeiser daarop zonder moeite verhaal zal kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel51
  - number: '51.3'
    text: |-
      Is de gestelde zekerheid door een niet aan de schuldeiser toe te rekenen oorzaak onvoldoende geworden, dan is de
      schuldenaar verplicht haar aan te vullen of te vervangen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel51
  - number: '52.1'
    text: |-
      Een schuldenaar die een opeisbare vordering heeft op zijn schuldeiser, is bevoegd de nakoming van zijn verbintenis
      op te schorten tot voldoening van zijn vordering plaatsvindt, indien tussen vordering en verbintenis voldoende
      samenhang bestaat om deze opschorting te rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel52
  - number: '52.2'
    text: |-
      Een zodanige samenhang kan onder meer worden aangenomen in geval de verbintenissen over en weer voortvloeien uit
      dezelfde rechtsverhouding of uit zaken die partijen regelmatig met elkaar hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel52
  - number: '53'
    text: Een opschortingsrecht kan ook worden ingeroepen tegen de schuldeisers van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel53
  - number: '54'
    text: 'Geen bevoegdheid tot opschorting bestaat, voor zover:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel54
  - number: 54.a
    text: de nakoming van de verbintenis van de wederpartij wordt verhinderd door schuldeisersverzuim;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel54
  - number: 54.b
    text: de nakoming van de verbintenis van de wederpartij blijvend onmogelijk is;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel54
  - number: 54.c
    text: op de vordering van de wederpartij geen beslag is toegelaten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel54
  - number: '55'
    text: |-
      Zodra zekerheid is gesteld voor de voldoening van de verbintenis van de wederpartij, vervalt de bevoegdheid tot
      opschorting, tenzij deze voldoening daardoor onredelijk zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel55
  - number: '56'
    text: Een bevoegdheid tot opschorting blijft ook na verjaring van de rechtsvordering op de wederpartij in stand.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel56
  - number: '57'
    text: |-
      Indien een bevoegdheid tot opschorting voldoet aan de omschrijving van het retentierecht
      in [artikel 290 van Boek 3][ref1], is deze afdeling van toepassing, voor zover daarvan in
      [titel 10, afdeling 4, van Boek 3][ref2] niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Afdeling4
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '290'
      - id: ref2
        bwb_id: BWBR0028745
        afdeling: '4'
  - number: '58'
    text: |-
      De schuldeiser komt in verzuim, wanneer nakoming van de verbintenis verhinderd wordt doordat hij de daartoe
      noodzakelijke medewerking niet verleent of doordat een ander beletsel van zijn zijde opkomt, tenzij de oorzaak van
      verhindering hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel58
  - number: '59'
    text: |-
      De schuldeiser komt eveneens in verzuim, wanneer hij ten gevolge van hem toe te rekenen omstandigheden niet voldoet
      aan een verplichting zijnerzijds jegens de schuldenaar en deze op die grond bevoegdelijk de nakoming van zijn
      verbintenis jegens de schuldeiser opschort.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel59
  - number: '60'
    text: |-
      Is de schuldeiser in verzuim, dan kan de rechter op vordering van de schuldenaar bepalen dat deze van zijn
      verbintenis bevrijd zal zijn, al dan niet onder door de rechter te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel60
  - number: '61.1'
    text: Verzuim van de schuldeiser maakt een einde aan verzuim van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel61
  - number: '61.2'
    text: Zolang de schuldeiser in verzuim is, kan de schuldenaar niet in verzuim geraken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel61
  - number: '62'
    text: Gedurende het verzuim van de schuldeiser is deze niet bevoegd maatregelen tot executie te nemen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel62
  - number: '63'
    text: |-
      De schuldenaar heeft, binnen de grenzen der redelijkheid, recht op vergoeding van de kosten, gevallen op een aanbod
      of een inbewaringstelling als bedoeld in de [artikelen 66 tot en met 70][ref1], of op andere wijze als gevolg van
      het verzuim gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel66
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '66'
        afdeling: '8'
  - number: '64'
    text: |-
      Komt tijdens het verzuim van de schuldeiser een omstandigheid op, die behoorlijke nakoming geheel of gedeeltelijk
      onmogelijk maakt, dan wordt dit niet aan de schuldenaar toegerekend, tenzij deze door zijn schuld of die van een
      ondergeschikte is tekortgeschoten in de zorg die in de gegeven omstandigheden van hem mocht worden gevergd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel64
  - number: '65'
    text: |-
      Wanneer bij een verbintenis tot aflevering van soortzaken de schuldenaar bepaalde, aan de verbintenis
      beantwoordende zaken voor de aflevering heeft aangewezen en de schuldeiser daarvan heeft verwittigd, dan is hij in
      geval van verzuim van de schuldeiser nog slechts tot aflevering van deze zaken verplicht. Hij blijft echter bevoegd
      tot aflevering van andere zaken die aan de verbintenis beantwoorden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel65
  - number: '66'
    text: |-
      Strekt de verbintenis tot betaling van een geldsom of tot aflevering van een zaak, dan is in geval van verzuim van
      de schuldeiser de schuldenaar bevoegd het verschuldigde ten behoeve van de schuldeiser in bewaring te stellen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel66
  - number: '67'
    text: |-
      De inbewaringstelling van een geldsom geschiedt door consignatie overeenkomstig de wet, die van een af te leveren
      zaak door deze in bewaring te geven aan iemand die zijn bedrijf maakt van het bewaren van zaken als de betrokkene
      ter plaatse waar de aflevering moet geschieden. Op deze bewaring zijn de regels betreffende gerechtelijke bewaring
      van toepassing, voor zover uit de [artikelen 68 tot en met 71][ref1] niet anders voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel68
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '68'
        afdeling: '8'
  - number: '68'
    text: Gedurende de bewaring loopt over een in bewaring gestelde geldsom geen rente ten laste van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel68
  - number: '69.1'
    text: Gedurende de bewaring kan de schuldeiser zijn verzuim slechts zuiveren door het in bewaring gestelde te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel69
  - number: '69.2'
    text: |-
      Zolang de schuldeiser het in bewaring gestelde niet heeft aanvaard, is de bewaargever bevoegd het uit de bewaring
      terug te nemen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel69
  - number: '70'
    text: |-
      De bewaarder mag de zaak slechts aan de schuldeiser afgeven, indien deze hem alle kosten van de bewaring voldoet.
      Hij is na de afgifte verplicht aan de bewaargever terug te betalen, wat deze reeds had voldaan. Is de zaak
      afgegeven vóórdat de schuldeiser alle kosten voldeed, dan gaan de rechten te dier zake door de betaling aan de
      bewaargever op de bewaarder over.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel70
  - number: '71'
    text: |-
      De rechtsvordering tegen de schuldenaar verjaart niet later dan de rechtsvordering tot uitlevering van het in
      bewaring gestelde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel71
  - number: '72'
    text: |-
      In geval van hoofdelijke verbondenheid gelden de rechtsgevolgen van het verzuim van de schuldeiser jegens ieder van
      de schuldenaren.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel72
  - number: '73'
    text: |-
      Weigert de schuldeiser een aanbod van een derde, dan zijn de [artikelen 60][ref1], [62][ref2], [63][ref3]
      en [66 tot en met 70][ref4] ten behoeve van de derde van overeenkomstige toepassing, mits het aanbod aan de
      verbintenis beantwoordt en de derde bij de voldoening een gerechtvaardigd belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0028749#Artikel66
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel73
