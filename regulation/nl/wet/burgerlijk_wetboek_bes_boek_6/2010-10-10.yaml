        artikel: '66'
        afdeling: '8'
  - number: '74.1'
    text: |-
      Iedere tekortkoming in de nakoming van een verbintenis verplicht de schuldenaar de schade die de schuldeiser
      daardoor lijdt, te vergoeden, tenzij de tekortkoming de schuldenaar niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel74
  - number: '74.2'
    text: |-
      Voor zover nakoming niet reeds blijvend onmogelijk is, vindt het eerste lid slechts toepassing met inachtneming van
      hetgeen is bepaald in [§ 2][ref1] betreffende het verzuim van de schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling9
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028749
        paragraaf: '2'
        afdeling: '9'
  - number: '75'
    text: |-
      Een tekortkoming kan de schuldenaar niet worden toegerekend, indien zij niet is te wijten aan zijn schuld, noch
      krachtens wet, rechtshandeling of in het verkeer geldende opvattingen voor zijn rekening komt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel75
  - number: '76'
    text: |-
      Maakt de schuldenaar bij de uitvoering van een verbintenis gebruik van de hulp van andere personen, dan is hij voor
      hun gedragingen op gelijke wijze als voor eigen gedragingen aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel76
  - number: '77'
    text: |-
      Wordt bij de uitvoering van een verbintenis gebruik gemaakt van een zaak die daartoe ongeschikt is, dan wordt
      de tekortkoming die daardoor ontstaat, de schuldenaar toegerekend, tenzij dit, gelet op inhoud en strekking
      van de rechtshandeling waaruit de verbintenis voortspruit, de in het verkeer geldende opvattingen en de overige
      omstandigheden van het geval, onredelijk zou zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel77
  - number: '78.1'
    text: |-
      Indien een tekortkoming de schuldenaar niet kan worden toegerekend, maar hij in verband met die tekortkoming een
      voordeel geniet dat hij bij behoorlijke nakoming niet zou hebben gehad, heeft de schuldeiser met toepassing van de
      regels betreffende ongerechtvaardigde verrijking recht op vergoeding van zijn schade tot ten hoogste het bedrag van
      dit voordeel.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel78
  - number: '78.2'
    text: |-
      Bestaat dit voordeel uit een vordering op een derde, dan kan de schuldenaar aan het eerste lid voldoen door
      overdracht van die vordering.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel78
  - number: '79'
    text: |-
      Is de schuldeiser wiens schuldenaar door een hem niet toe te rekenen oorzaak verhinderd is na te komen, desondanks
      in staat zelf zich door executie of verrekening het verschuldigde te verschaffen, dan is hij daartoe bevoegd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel79
  - number: '80.1'
    text: 'De gevolgen van niet-nakoming treden reeds in voordat de vordering opeisbaar is, indien:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel80
  - number: 80.1.a
    text: vaststaat dat nakoming zonder tekortkoming onmogelijk zal zijn;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel80
  - number: 80.1.b
    text: de schuldeiser uit een mededeling van de schuldenaar moet afleiden dat deze in de nakoming zal tekortschieten; of
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel80
  - number: 80.1.c
    text: |-
      de schuldeiser goede gronden heeft te vrezen dat de schuldenaar in de nakoming zal tekortschieten en deze niet
      voldoet aan een schriftelijke aanmaning met opgave van die gronden om zich binnen een bij die aanmaning gestelde
      redelijke termijn bereid te verklaren zijn verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel80
  - number: '80.2'
    text: |-
      Het oorspronkelijke tijdstip van opeisbaarheid blijft gelden voor de verschuldigdheid van schadevergoeding wegens
      vertraging en de toerekening aan de schuldenaar van het onmogelijk worden van nakoming tijdens zijn verzuim.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel80
  - number: '81'
    text: |-
      De schuldenaar is in verzuim gedurende de tijd dat de prestatie uitblijft nadat zij opeisbaar is geworden en aan
      de eisen van de [artikelen 82][ref1] en [83][ref2] is voldaan, behalve voor zover de vertraging hem niet kan worden
      toegerekend of nakoming reeds blijvend onmogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel83
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '82'
        paragraaf: '2'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '83'
        paragraaf: '2'
        afdeling: '9'
  - number: '82.1'
    text: |-
      Het verzuim treedt in, wanneer de schuldenaar in gebreke wordt gesteld bij een schriftelijke aanmaning waarbij hem
      een redelijke termijn voor de nakoming wordt gesteld, en nakoming binnen deze termijn uitblijft.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel82
  - number: '82.2'
    text: |-
      Indien de schuldenaar tijdelijk niet kan nakomen of uit zijn houding blijkt dat aanmaning nutteloos zou zijn, kan
      de ingebrekestelling plaatsvinden door een schriftelijke mededeling waaruit blijkt dat hij voor het uitblijven van
      de nakoming aansprakelijk wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel82
  - number: '83'
    text: 'Het verzuim treedt zonder ingebrekestelling in, wanneer:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel83
  - number: 83.a
    text: |-
      een voor de voldoening bepaalde termijn verstrijkt zonder dat de verbintenis is nagekomen, tenzij blijkt dat de
      termijn een andere strekking heeft;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel83
  - number: 83.b
    text: |-
      de verbintenis voortvloeit uit onrechtmatige daad of strekt tot schadevergoeding als bedoeld in
      [artikel 74, eerste lid][ref1], en de verbintenis niet terstond wordt nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel74
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '74'
        paragraaf: '1'
        afdeling: '9'
  - number: 83.c
    text: |-
      de schuldeiser uit een mededeling van de schuldenaar moet afleiden dat deze in de nakoming van de verbintenis zal
      tekortschieten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel83
  - number: '84'
    text: |-
      Elke onmogelijkheid van nakoming, ontstaan tijdens het verzuim van de schuldenaar en niet toe te rekenen aan de
      schuldeiser, wordt aan de schuldenaar toegerekend; deze moet de daardoor ontstane schade vergoeden, tenzij de
      schuldeiser de schade ook bij behoorlijke en tijdige nakoming zou hebben geleden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel84
  - number: '85'
    text: |-
      Tot vergoeding van schade wegens vertraging in de nakoming is de schuldenaar slechts verplicht over de tijd waarin
      hij in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel85
  - number: '86'
    text: |-
      De schuldeiser kan een na het intreden van het verzuim aangeboden nakoming weigeren, zolang niet tevens betaling
      wordt aangeboden van de inmiddels tevens verschuldigd geworden schadevergoeding en van de kosten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel86
  - number: '87.1'
    text: |-
      Voor zover nakoming niet reeds blijvend onmogelijk is, wordt de verbintenis omgezet in een tot vervangende
      schadevergoeding, wanneer de schuldenaar in verzuim is en de schuldeiser hem schriftelijk meedeelt dat hij
      schadevergoeding in plaats van nakoming vordert.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel87
  - number: '87.2'
    text: |-
      Geen omzetting vindt plaats, die door de tekortkoming, gezien haar ondergeschikte betekenis, niet wordt
      gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel87
  - number: '88.1'
    text: |-
      De schuldenaar die in de nakoming van zijn verbintenis is tekort geschoten, kan aan de schuldeiser een redelijke
      termijn stellen, waarbinnen deze moet meedelen welke van de hem bij de aanvang van de termijn ten dienste staande
      middelen hij wenst uit te oefenen, op straffe van slechts aanspraak te kunnen maken op:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel88
  - number: 88.1.a
    text: |-
      de schadevergoeding waarop de tekortkoming recht geeft en, zo de verbintenis strekt tot betaling van een geldsom,
      op die geldsom;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel88
  - number: 88.1.b
    text: |-
      ontbinding van de overeenkomst waaruit de verbintenis voortspruit, indien de schuldenaar zich erop beroept dat de
      tekortkoming hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel88
  - number: '88.2'
    text: |-
      Heeft de schuldeiser nakoming verlangd, doch wordt daaraan niet binnen een redelijke termijn voldaan, dan kan hij
      al zijn rechten wederom doen gelden; het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel88
  - number: '89'
    text: |-
      De schuldeiser kan op een gebrek in de prestatie geen beroep meer doen, indien hij niet binnen bekwame tijd
      nadat hij het gebrek heeft ontdekt of redelijkerwijs had moeten ontdekken, bij de schuldenaar ter zake heeft
      geprotesteerd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel89
  - number: '90.1'
    text: |-
      Bij een verhindering tot aflevering van een zaak die aan snel tenietgaan of achteruitgaan onderhevig is of
      waarvan om een andere reden de verdere bewaring zo bezwaarlijk is dat zij in de gegeven omstandigheden niet van de
      schuldenaar kan worden gevergd, is deze bevoegd de zaak op een geschikte wijze te doen verkopen. De schuldenaar is
      jegens de schuldeiser tot een zodanige verkoop gehouden, wanneer diens belangen deze verkoop onmiskenbaar eisen of
      de schuldeiser te kennen geeft de verkoop te verlangen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel90
  - number: '90.2'
    text: |-
      De netto-opbrengst treedt voor de zaak in de plaats, onverminderd de rechten van de schuldeiser wegens
      tekortkomingen in de nakoming van de verbintenis.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel90
  - number: '91'
    text: |-
      Als boetebeding wordt aangemerkt ieder beding waarbij is bepaald dat de schuldenaar, indien hij in de nakoming van
      zijn verbintenis tekortschiet, gehouden is een geldsom of een andere prestatie te voldoen, ongeacht of zulks strekt
      tot vergoeding van schade of enkel tot aansporing om tot nakoming over te gaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel91
  - number: '92.1'
    text: |-
      De schuldeiser kan geen nakoming vorderen zowel van het boetebeding als van de verbintenis waaraan het boetebeding
      verbonden is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel92
  - number: '92.2'
    text: Hetgeen ingevolge een boetebeding verschuldigd is, treedt in de plaats van de schadevergoeding op grond van de wet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel92
  - number: '92.3'
    text: |-
      De schuldeiser kan geen nakoming vorderen van het boetebeding, indien de tekortkoming niet aan de schuldenaar kan
      worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel92
  - number: '93'
    text: |-
      Voor het vorderen van nakoming van het boetebeding is een aanmaning of een andere voorafgaande verklaring nodig in
      dezelfde gevallen als deze is vereist voor het vorderen van schadevergoeding op grond van de wet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel93
  - number: '94.1'
    text: |-
      Op verlangen van de schuldenaar kan de rechter, indien de billijkheid dit klaarblijkelijk eist, de bedongen boete
      matigen, met dien verstande dat hij de schuldeiser ter zake van de tekortkoming niet minder kan toekennen dan de
      schadevergoeding op grond van de wet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel94
  - number: '94.2'
    text: |-
      Op verlangen van de schuldeiser kan de rechter, indien de billijkheid dit klaarblijkelijk eist, naast een
      bedongen boete die bestemd is in de plaats te treden van de schadevergoeding op grond van de wet, aanvullende
      schadevergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel94
  - number: '94.3'
    text: Van het eerste lid afwijkende bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel94
  - number: '95'
    text: |-
      De schade die op grond van een wettelijke verplichting tot schadevergoeding moet worden vergoed, bestaat in
      vermogensschade en ander nadeel, dit laatste voor zover de wet op vergoeding hiervan recht geeft.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel95
  - number: '96.1'
    text: Vermogensschade omvat zowel geleden verlies als gederfde winst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel96
  - number: '96.2'
    text: 'Als vermogensschade komen mede voor vergoeding in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel96
  - number: 96.2.a
    text: |-
      redelijke kosten ter voorkoming of beperking van schade die als gevolg van de gebeurtenis waarop de
      aansprakelijkheid berust, mocht worden verwacht;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel96
  - number: 96.2.b
    text: redelijke kosten ter vaststelling van schade en aansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel96
  - number: 96.2.c
    text: |-
      redelijke kosten ter verkrijging van voldoening buiten rechte, behoudens, wat de kosten,
      bedoeld in de onderdelen b en c, betreft, voor zover in het gegeven geval krachtens
      [artikel 63a van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] de regels betreffende proceskosten van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel63a
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 63a
  - number: '97'
    text: |-
      De rechter begroot de schade op de wijze die het meest met de aard ervan in overeenstemming is. Kan de omvang van
      de schade niet nauwkeurig worden vastgesteld, dan wordt zij geschat.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel97
  - number: '98'
    text: |-
      Voor vergoeding komt slechts in aanmerking schade die in zodanig verband staat met de gebeurtenis waarop de
      aansprakelijkheid van de schuldenaar berust, dat zij hem, mede gezien de aard van de aansprakelijkheid en van de
      schade, als een gevolg van deze gebeurtenis kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel98
  - number: '99'
    text: |-
      Kan de schade een gevolg zijn van twee of meer gebeurtenissen voor elk waarvan een andere persoon aansprakelijk is,
      en staat vast dat de schade door ten minste één van deze gebeurtenissen is ontstaan, dan rust de verplichting om de
      schade te vergoeden op ieder van deze personen, tenzij hij bewijst dat deze niet het gevolg is van een gebeurtenis
      waarvoor hijzelf aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel99
  - number: '100'
    text: |-
      Heeft een zelfde gebeurtenis voor de benadeelde naast schade tevens voordeel opgeleverd, dan moet, voor zover dit
      redelijk is, dit voordeel bij de vaststelling van de te vergoeden schade in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel100
  - number: '101.1'
    text: |-
      Wanneer de schade mede een gevolg is van een omstandigheid die aan de benadeelde kan worden toegerekend, wordt
      de vergoedingsplicht verminderd door de schade over de benadeelde en de vergoedingsplichtige te verdelen in
      evenredigheid met de mate waarin de aan ieder toe te rekenen omstandigheden tot de schade hebben bijgedragen, met
      dien verstande dat een andere verdeling plaatsvindt of de vergoedingsplicht geheel vervalt of in stand blijft,
      indien de billijkheid dit wegens de uiteenlopende ernst van de gemaakte fouten of andere omstandigheden van het
      geval eist.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel101
  - number: '101.2'
    text: |-
      Betreft de vergoedingsplicht schade, toegebracht aan een zaak die een derde voor de benadeelde in zijn macht had,
      dan worden bij toepassing van het eerste lid omstandigheden die aan de derde toegerekend kunnen worden, toegerekend
      aan de benadeelde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel101
  - number: '102.1'
    text: |-
      Rust op ieder van twee of meer personen een verplichting tot vergoeding van dezelfde schade, dan zijn
      zij hoofdelijk verbonden. Voor de bepaling van hetgeen zij krachtens [artikel 10][ref1] in hun onderlinge
      verhouding jegens elkaar moeten bijdragen, wordt de schade over hen verdeeld met overeenkomstige toepassing van
      [artikel 101][ref2], tenzij uit wet of rechtshandeling een andere verdeling voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel101
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '10'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '101'
        afdeling: '10'
  - number: '102.2'
    text: |-
      Wanneer de schade mede een gevolg is van een omstandigheid die aan de benadeelde kan worden toegerekend, vindt
      [artikel 101][ref1] toepassing op de vergoedingsplicht van ieder van de in het eerste lid bedoelde personen
      afzonderlijk, met dien verstande dat de benadeelde in totaal van hen niet meer kan vorderen dan hem zou
      zijn toegekomen, indien voor de omstandigheden waarop hun vergoedingsplichten berusten, slechts één persoon
      aansprakelijk zou zijn geweest. Indien verhaal op een der tot bijdragen verplichte personen niet ten volle mogelijk
      blijkt, kan de rechter op verlangen van een hunner bepalen dat bij toepassing van [artikel 13][ref2] het onvoldaan
      gebleven deel mede over de benadeelde omgeslagen wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel13
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '101'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '13'
        afdeling: '2'
  - number: '103'
    text: |-
      Schadevergoeding wordt voldaan in geld. Nochtans kan de rechter op vordering van de benadeelde schadevergoeding in
      andere vorm dan betaling van een geldsom toekennen. Wordt niet binnen redelijke termijn aan een zodanige uitspraak
      voldaan, dan herkrijgt de benadeelde zijn bevoegdheid om schadevergoeding in geld te verlangen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel103
  - number: '104'
    text: |-
      Indien iemand die op grond van onrechtmatige daad of een tekortkoming in de nakoming van een verbintenis jegens
      een ander aansprakelijk is, door die daad of tekortkoming winst heeft genoten, kan de rechter op vordering van die
      ander de schade begroten op het bedrag van die winst of op een gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel104
  - number: '105.1'
    text: |-
      De begroting van nog niet ingetreden schade kan door de rechter geheel of gedeeltelijk worden uitgesteld of na
      afweging van goede en kwade kansen bij voorbaat geschieden. In het laatste geval kan de rechter de schuldenaar
      veroordelen, hetzij tot betaling van een bedrag ineens, hetzij tot betaling van periodiek uit te keren bedragen, al
      of niet met verplichting tot zekerheidstelling; deze veroordeling kan geschieden onder door de rechter te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel105
  - number: '105.2'
    text: |-
      Voor zover de rechter de schuldenaar veroordeelt tot betaling van periodiek uit te keren bedragen, kan hij in zijn
      uitspraak bepalen dat deze op verzoek van elk van de partijen door de rechter die in eerste aanleg van de vordering
      tot schadevergoeding heeft kennis genomen, kan worden gewijzigd, indien zich na de uitspraak omstandigheden
      voordoen, die voor de omvang van de vergoedingsplicht van belang zijn en met de mogelijkheid van het intreden
      waarvan bij de vaststelling der bedragen geen rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel105
  - number: '106.1'
    text: |-
      Voor nadeel dat niet in vermogensschade bestaat, heeft de benadeelde recht op een naar billijkheid vast te stellen
      schadevergoeding, indien:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel106
  - number: 106.1.a
    text: de aansprakelijke persoon het oogmerk had zodanig nadeel toe te brengen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel106
  - number: 106.1.b
    text: |-
      de benadeelde lichamelijk letsel heeft opgelopen, in zijn eer of goede naam is geschaad of op andere wijze in zijn
      persoon is aangetast;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel106
  - number: 106.1.c
    text: |-
      het nadeel gelegen is in aantasting van de nagedachtenis van een overledene en toegebracht is aan de niet
      van tafel en bed gescheiden echtgenoot of een bloedverwant tot in de tweede graad van de overledene, mits de
      aantasting plaatsvond op een wijze die de overledene, ware hij nog in leven geweest, recht zou hebben gegeven op
      schadevergoeding wegens het schaden van zijn eer of goede naam.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel106
  - number: '106.2'
    text: |-
      Het recht op een vergoeding is niet vatbaar voor overgang en beslag, tenzij het bij overeenkomst is vastgelegd of
      ter zake een vordering in rechte is ingesteld. Voor overgang onder algemene titel is voldoende dat de gerechtigde
      aan de wederpartij heeft meegedeeld op de vergoeding aanspraak te maken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel106
  - number: '107.1'
    text: |-
      Indien iemand ten gevolge van een gebeurtenis waarvoor een ander aansprakelijk is, lichamelijk of geestelijk letsel
      oploopt, is die ander behalve tot vergoeding van de schade van de gekwetste zelf, ook verplicht tot vergoeding van
      de kosten die een derde anders dan krachtens een verzekering ten behoeve van de gekwetste heeft gemaakt, en die
      deze laatste, zo hij ze zelf zou hebben gemaakt, van die ander had kunnen vorderen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel107
  - number: '107.2'
    text: |-
      Hij die krachtens het eerste lid door de derde tot schadevergoeding wordt aangesproken, kan hetzelfde verweer
      voeren dat hem jegens de gekwetste ten dienste zou hebben gestaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel107
  - number: 107a.1
    text: |-
      Indien iemand ten gevolge van een gebeurtenis waarvoor een ander aansprakelijk is, lichamelijk of geestelijk letsel
      oploopt, houdt de rechter bij de vaststelling van de schadevergoeding waarop de gekwetste aanspraak kan maken,
      rekening met de aanspraak op loon (of salaris) waarop de gekwetste krachtens zijn dienstbetrekking aanspraak kan
      maken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel107a
  - number: 107a.2
    text: |-
      Indien degene in wiens dienst de gekwetste is, krachtens wet of overeenkomst tijdens ziekte of
      arbeidsongeschiktheid verplicht is aan deze loon (of salaris) door te betalen, heeft hij, indien de ongeschiktheid
      tot werken van de gekwetste het gevolg is van een gebeurtenis waarvoor een ander aansprakelijk is, jegens deze
      ander recht op schadevergoeding ten bedrage van het door hem betaalde loon, doch ten hoogste tot het bedrag,
      waarvoor de aansprakelijke persoon bij het ontbreken van de verplichting tot het doorbetalen van loon (of salaris)
      aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de
      aansprakelijke persoon jegens de gekwetste is gehouden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel107a
  - number: 107a.3
    text: |-
      Degene in wiens dienst de gekwetste is, heeft het in het tweede lid bedoelde recht op schadevergoeding tegen
      iemand die eveneens in zijn dienst is, slechts indien de ongeschiktheid tot werken het gevolg is van diens opzet of
      bewuste roekeloosheid.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel107a
  - number: '108.1'
    text: |-
      Indien iemand ten gevolge van een gebeurtenis waarvoor een ander jegens hem aansprakelijk is, overlijdt, is die
      ander verplicht tot vergoeding van schade door het derven van levensonderhoud aan:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel108
  - number: 108.1.a
    text: |-
      de niet van tafel en bed gescheiden echtgenoot en de minderjarige kinderen van de overledene, tot ten minste het
      bedrag van het hun krachtens de wet verschuldigde levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel108
  - number: 108.1.b
    text: |-
      andere bloed- of aanverwanten van de overledene, mits deze reeds ten tijde van het overlijden geheel of ten dele in
      hun levensonderhoud voorzag of daartoe krachtens rechterlijke uitspraak verplicht was;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel108
  - number: 108.1.c
    text: |-
      degenen die reeds vóór de gebeurtenis waarop de aansprakelijkheid berust, met de overledene in gezinsverband
      samenwoonden en in wier levensonderhoud hij geheel of voor een groot deel voorzag, voor zover aannemelijk is dat
      een en ander zonder het overlijden zou zijn voortgezet en zij redelijkerwijs niet voldoende in hun levensonderhoud
      kunnen voorzien;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel108
  - number: 108.1.d
    text: |-
      degene die met de overledene in gezinsverband samenwoonde en in wiens levensonderhoud de overledene bijdroeg door
      het doen van de gemeenschappelijke huishouding, voor zover hij schade lijdt doordat na het overlijden op andere
      wijze in de gang van deze huishouding moet worden voorzien.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel108
  - number: '108.2'
    text: |-
      Bovendien is de aansprakelijke verplicht aan degene te wiens laste de kosten van lijkbezorging zijn gekomen, deze
      kosten te vergoeden, voor zover zij in overeenstemming zijn met de omstandigheden van de overledene.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel108
  - number: '108.3'
    text: |-
      Hij die krachtens het eerste en het tweede lid tot schadevergoeding wordt aangesproken, kan hetzelfde verweer
      voeren dat hem tegenover de overledene zou hebben ten dienste gestaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel108
  - number: '109.1'
    text: |-
      Indien toekenning van volledige schadevergoeding in de gegeven omstandigheden, waaronder de aard van de
      aansprakelijkheid, de tussen partijen bestaande rechtsverhouding en hun beider draagkracht, tot kennelijk
      onaanvaardbare gevolgen zou leiden, kan de rechter een wettelijke verplichting tot schadevergoeding matigen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel109
  - number: '109.2'
    text: |-
      De matiging mag niet geschieden tot een lager bedrag dan waarvoor de schuldenaar zijn aansprakelijkheid door
      verzekering heeft gedekt of verplicht was te dekken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel109
  - number: '109.3'
    text: Ieder beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel109
  - number: '110'
    text: |-
      Opdat de aansprakelijkheid die ter zake van schade kan ontstaan, niet hetgeen redelijkerwijs door verzekering kan
      worden gedekt, te boven gaat, kunnen bij algemene maatregel van bestuur bedragen worden vastgesteld, waarboven de
      aansprakelijkheid zich niet uitstrekt. Afzonderlijke bedragen kunnen worden bepaald naar gelang van onder meer de
      aard van de gebeurtenis, de aard van de schade en de grond van de aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel110
  - number: '111'
    text: |-
      Een verbintenis tot betaling van een geldsom moet naar haar nominale bedrag worden voldaan, tenzij uit wet,
      gewoonte of rechtshandeling anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel111
  - number: '112'
    text: |-
      Het geld dat ter voldoening van de verbintenis wordt betaald, moet op het tijdstip van de betaling gangbaar zijn in
      het land in welks geld de betaling geschiedt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel112
  - number: '113'
    text: |-
      Bij betaling in wettig betaalmiddel van de openbare lichamen Bonaire, Sint Eustatius en Saba wordt de verschuldigde
      geldsom, indien deze niet vijf cent of een veelvoud daarvan beloopt, afgerond op het meest nabij gelegen bedrag dat
      deelbaar is door vijf en ten minste vijf cent bedraagt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel113
  - number: '114.1'
    text: |-
      Bestaat in een land waar de betaling moet of mag geschieden ten name van de schuldeiser een rekening, bestemd voor
      girale betaling, dan kan de schuldenaar de verbintenis voldoen door het verschuldigde bedrag op die rekening te
      doen bijschrijven, tenzij de schuldeiser betaling op die rekening geldig heeft uitgesloten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel114
  - number: '114.2'
    text: |-
      In het geval van het eerste lid geschiedt de betaling op het tijdstip waarop de rekening van de schuldeiser wordt
      gecrediteerd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel114
  - number: '115'
    text: |-
      De plaats waar de betaling moet geschieden wordt bepaald door de [artikelen 116 tot en met 118][ref1], tenzij uit
      wet, gewoonte of rechtshandeling voortvloeit dat op een andere plaats moet of mag worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel116
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '116'
        afdeling: '11'
  - number: '116.1'
    text: De betaling moet worden gedaan aan de woonplaats van de schuldeiser op het tijdstip van de betaling.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel116
  - number: '116.2'
    text: |-
      De schuldeiser is bevoegd een andere plaats voor de betaling aan te wijzen in het land van de woonplaats van de
      schuldeiser op het tijdstip van de betaling of op het tijdstip van het ontstaan van de verbintenis.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel116
  - number: '117'
    text: |-
      Indien de betaling overeenkomstig [artikel 116][ref1] moet geschieden op een andere plaats dan de woonplaats van
      de schuldeiser op het tijdstip van het ontstaan van de verbintenis en het voldoen aan de verbintenis daardoor
      voor de schuldenaar aanmerkelijk bezwaarlijker zou worden, is deze bevoegd de betaling op te schorten, totdat
      de schuldeiser in een der in artikel 116, tweede lid, bedoelde landen een andere plaats voor de betaling heeft
      aangewezen, waaraan een zodanig bezwaar niet is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel116
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '116'
        afdeling: '11'
  - number: '118'
    text: |-
      Indien de verbintenis is ontstaan bij de uitoefening van bedrijfs- of beroepsbezigheden van de schuldeiser, geldt
      in de [artikelen 116][ref1] en [117][ref2] de plaats van vestiging waar die bezigheden worden uitgeoefend, als
      woonplaats van de schuldeiser.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel117
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '116'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '117'
        afdeling: '11'
  - number: '119.1'
    text: |-
      De schadevergoeding, verschuldigd wegens vertraging in de voldoening van een geldsom, bestaat in de wettelijke
      rente van die som over de tijd dat de schuldenaar met de voldoening daarvan in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel119
  - number: '119.2'
    text: |-
      Telkens na afloop van een jaar wordt het bedrag waarover de wettelijke rente wordt berekend, vermeerderd met de
      over dat jaar verschuldigde rente.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel119
  - number: '119.3'
    text: |-
      Een bedongen rente die hoger is dan die welke krachtens het eerste en het tweede lid verschuldigd zou zijn, loopt
      in plaats daarvan door nadat de schuldenaar in verzuim is gekomen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel119
  - number: '120'
    text: |-
      De wettelijke rente wordt bij of krachtens algemene maatregel van bestuur vastgesteld. Wettelijke rente die loopt
      op het tijdstip van inwerkingtreding van een nieuwe bij of krachtens algemene maatregel van bestuur vastgestelde
      rentevoet, wordt met ingang van dat tijdstip volgens de nieuwe rentevoet berekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel120
  - number: '121.1'
    text: |-
      Strekt een verbintenis tot betaling van ander geld dan dat van het land waar de betaling moet geschieden, dan is de
      schuldenaar bevoegd de verbintenis in het geld van de plaats van betaling te voldoen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel121
  - number: '121.2'
    text: |-
      Het eerste lid geldt niet, indien uit wet, gewoonte of rechtshandeling voortvloeit dat de schuldenaar verplicht is
      tot betaling effectief in het geld tot betaling waarvan de verbintenis strekt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel121
  - number: '122.1'
    text: |-
      Strekt een verbintenis tot betaling van ander geld dan dat van het land waar de betaling moet geschieden en is
      de schuldenaar niet in staat of beweert hij niet in staat te zijn in dit geld te voldoen, dan kan de schuldeiser
      voldoening in het geld van de plaats van betaling vorderen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel122
  - number: '122.2'
    text: |-
      Het eerste lid geldt mede, indien de schuldenaar verplicht is tot betaling effectief in het geld tot betaling
      waarvan de verbintenis strekt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel122
  - number: '123.1'
    text: |-
      In geval in het openbaar lichaam Bonaire, Sint Eustatius of Saba een rechtsvordering wordt ingesteld ter
      verkrijging van een geldsom, uitgedrukt in buitenlands geld, kan de schuldeiser veroordeling vorderen tot betaling
      te zijner keuze in dat buitenlandse geld of in in de openbare lichamen Bonaire, Sint Eustatius en Saba gangbaar
      geld.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel123
  - number: '123.2'
    text: |-
      De schuldeiser die een in buitenlands geld luidende executoriale titel in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba kan executeren, kan het hem verschuldigde bij deze executie opeisen in in de openbare lichamen
      Bonaire, Sint Eustatius en Saba gangbaar geld.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel123
  - number: '123.3'
    text: |-
      Het eerste en het tweede lid gelden mede, indien de schuldenaar verplicht is tot betaling effectief in het geld tot
      betaling waarvan de verbintenis strekt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel123
  - number: '124'
    text: |-
      Wordt de verbintenis als gevolg van toepassing van de [artikelen 121 tot en met 123][ref1] of van omzetting in een
      vordering tot schadevergoeding overeenkomstig afdeling 9 voldaan in ander geld dan tot betaling waarvan zij strekt,
      dan geschiedt de omrekening naar de koers van de dag waarop de betaling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel121
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '121'
        afdeling: '11'
  - number: '125.1'
    text: |-
      [Artikel 119][ref1] laat onverlet het recht van de schuldeiser op vergoeding van de schade die hij heeft geleden,
      doordat na het intreden van het verzuim de koers van het geld tot betaling waarvan de verbintenis strekt, zich ten
      opzichte van die van het geld van een of meer andere landen heeft gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel119
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '119'
        afdeling: '11'
  - number: '125.2'
    text: |-
      Het eerste lid is niet van toepassing, indien de verbintenis strekt tot betaling van in het openbaar lichaam
      Bonaire, Sint Eustatius of Saba gangbaar geld, de betaling in het openbaar lichaam Bonaire, Sint Eustatius of
      Saba moet geschieden en de schuldeiser op het tijdstip van het ontstaan van de verbintenis in het openbaar lichaam
      Bonaire, Sint Eustatius of Saba zijn woonplaats had.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel125
  - number: '126'
    text: |-
      Voor de toepassing van deze afdeling geldt als koers de koers tegen welke de schuldeiser zich onverwijld het geld
      kan verschaffen, zulks met inachtneming van hetgeen uit wet, gewoonte en inhoud of strekking van de verbintenis
      mocht voortvloeien.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel126
  - number: '127.1'
    text: |-
      Wanneer een schuldenaar die de bevoegdheid tot verrekening heeft, aan zijn schuldeiser verklaart dat hij zijn
      schuld met een vordering verrekent, gaan beide verbintenissen tot hun gemeenschappelijk beloop teniet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel127
  - number: '127.2'
    text: |-
      Een schuldenaar heeft de bevoegdheid tot verrekening, wanneer hij een prestatie te vorderen heeft die beantwoordt
      aan zijn schuld jegens dezelfde wederpartij en hij bevoegd is zowel tot betaling van de schuld als tot het
      afdwingen van de betaling van de vordering.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel127
  - number: '127.3'
    text: |-
      De bevoegdheid tot verrekening bestaat niet ten aanzien van een vordering en een schuld die in van elkaar
      gescheiden vermogens vallen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel127
  - number: '128.1'
    text: |-
      De schuldeiser van een vordering aan toonder of order brengt deze in verrekening door zijn verrekeningsverklaring
      op het papier te stellen en dit aan de wederpartij af te geven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel128
  - number: '128.2'
    text: |-
      Indien de verrekening niet zijn gehele vordering betreft of hij het papier nog voor de uitoefening van andere
      rechten nodig heeft, kan hij het papier behouden, mits hij de verklaring niet alleen op het papier stelt, maar haar
      ook schriftelijk tot de wederpartij richt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel128
  - number: '128.3'
    text: |-
      Hij kan, ongeacht of de verrekening de gehele vordering betreft, bij enkele, niet op het papier gestelde
      schriftelijke verklaring verrekenen, mits hij op verlangen van de wederpartij aantoont dat het papier vernietigd
      of waardeloos geworden is, of zekerheid stelt voor 20 jaren of voor een zoveel kortere tijdsduur als verwacht mag
      worden dat de wederpartij nog aan een vordering uit hoofde van het papier bloot zal kunnen staan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel128
  - number: '129.1'
    text: De verrekening werkt terug tot het tijdstip waarop de bevoegdheid tot verrekening is ontstaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel129
  - number: '129.2'
    text: |-
      Is over een der vorderingen of over beide reeds opeisbare rente betaald, dan werkt de verrekening niet verder terug
      dan tot het einde van de laatste termijn waarover rente is voldaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel129
  - number: '129.3'
    text: |-
      Indien voor de bepaling van de werking van een verrekening bij geldschulden een koersberekening nodig is, geschiedt
      deze volgens dezelfde maatstaven als wan- neer op de dag der verrekening wederzijdse betaling had plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel129
  - number: '130.1'
    text: |-
      Is een vordering onder bijzondere titel overgegaan, dan is de schuldenaar bevoegd ondanks de overgang ook een
      tegenvordering op de oorspronkelijke schuldeiser in verrekening te brengen, mits deze tegenvordering uit dezelfde
      rechtsverhouding als de overgegane vordering voortvloeit of reeds vóór de overgang aan hem is opgekomen en
      opeisbaar geworden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel130
  - number: '130.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, wanneer op een vordering beslag is gelegd of een beperkt recht is
      gevestigd waarvan mededeling aan de schuldenaar is gedaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel130
  - number: '130.3'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing, indien de overgang of de vestiging van het beperkte recht
      een vordering aan toonder of order betrof en is geschied overeenkomstig artikel 93 van Boek 3.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel130
  - number: '131.1'
    text: De bevoegdheid tot verrekening eindigt niet door verjaring van de rechtsvordering.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel131
  - number: '131.2'
    text: |-
      Uitstel van betaling of van executie, bij wijze van gunst door de schuldeiser verleend, staat aan verrekening door
      de schuldeiser niet in de weg.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel131
  - number: '132'
    text: |-
      Wordt een verrekeningsverklaring uitgebracht door een daartoe bevoegde, dan kan niettemin de wederpartij die grond
      had om nakoming van haar verbintenis te weigeren, aan de verrekeningsverklaring haar werking ontnemen door op de
      weigeringsgrond een beroep te doen, onverwijld nadat die verklaring werd uitgebracht en zij tot dit beroep in staat
      was.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel132
  - number: '133'
    text: |-
      Nadat de ene partij een verrekeningsverklaring heeft uitgebracht, kan de andere partij, mits onverwijld, aan die
      verklaring haar werking ontnemen door alsnog gebruik te maken van een eigen bevoegdheid tot verrekening, doch
      alleen indien deze laatste verrekening verder terugwerkt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel133
  - number: '134'
    text: |-
      De schuldenaar uit een wederkerige overeenkomst, die tot verrekening bevoegd is, kan aan de verklaring van zijn
      wederpartij, strekkende tot ontbinding van de overeenkomst wegens niet-nakoming, haar werking ontnemen door
      onverwijld van zijn bevoegdheid tot verrekening gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel134
  - number: '135'
    text: 'Een schuldenaar is niet bevoegd tot verrekening:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel135
  - number: 135.a
    text: voor zover beslag op de vordering van de wederpartij niet geldig zou zijn;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel135
  - number: 135.b
    text: indien zijn verplichting strekt tot vergoeding van schade die hij opzettelijk heeft toegebracht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel135
  - number: '136'
    text: |-
      De rechter kan een vordering ondanks een beroep van de gedaagde op verrekening toewijzen, indien de gegrondheid van
      dit verweer niet op eenvoudige wijze is vast te stellen en de vordering overigens voor toewijzing vatbaar is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel136
  - number: '137.1'
    text: |-
      Voor zover een verrekeningsverklaring onvoldoende aangeeft welke verbintenissen in de verrekening zijn betrokken,
      geldt de volgorde van toerekening, aangegeven in de [artikelen 43, tweede lid][ref1], en [44, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel44
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '43'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '44'
        afdeling: '6'
  - number: '137.2'
    text: |-
      De wederpartij van degene die heeft verklaard te verrekenen, kan door een onverwijld protest aan die verklaring
      haar werking ontnemen, indien de toerekening op de haar verschuldigde hoofdsom, kosten en met inachtneming
      van [artikel 129][ref1] te berekenen rente in deze verklaring in een andere volgorde is geschied dan die van
      [artikel 44, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel44
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '129'
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '44'
        afdeling: '6'
  - number: '138.1'
    text: |-
      De omstandigheid dat de plaats van voldoening der verbintenissen niet dezelfde is, sluit verrekening niet uit.
      Hij die verrekent, is in dit geval verplicht zijn wederpartij de schade te vergoeden die deze lijdt doordat niet
      wederzijds te bestemder plaatse voldoening geschiedt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel138
  - number: '138.2'
    text: |-
      De wederpartij van degene die ondanks een verschil in de plaats van nakoming heeft verrekend, kan door een
      onverwijld protest aan de verklaring tot verrekening haar werking ontnemen, als zij er een gerechtvaardigd belang
      bij heeft dat geen verrekening, maar nakoming plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel138
  - number: '139.1'
    text: |-
      De borg en degene wiens goed voor de schuld van een ander verbonden is, kunnen de opschorting van hun
      aansprakelijkheid inroepen, voor zover de schuldeiser bevoegd is zijn vordering met een opeisbare schuld aan de
      schuldenaar te verrekenen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel139
  - number: '139.2'
    text: |-
      Zij kunnen de bevrijding van hun aansprakelijkheid inroepen, voor zover de schuldeiser een bevoegdheid tot
      verrekening met een schuld aan de schuldenaar heeft doen verloren gaan, tenzij hij daartoe een redelijke grond had
      of hem geen schuld treft.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel139
  - number: '140.1'
    text: |-
      Moeten tussen twee partijen krachtens wet, gewoonte of rechtshandeling geldvorderingen en geldschulden in één
      rekening worden opgenomen, dan worden zij, in de volgorde waarin partijen volgens de voorgaande artikelen van
      deze afdeling of krachtens hun onderlinge rechtsverhouding tot verrekening bevoegd worden, dadelijk van rechtswege
      verrekend en is op ieder tijdstip alleen het saldo verschuldigd. [Artikel 137][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel137
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '137'
        afdeling: '12'
  - number: '140.2'
    text: |-
      De partij die de rekening bijhoudt, sluit deze jaarlijks af en deelt het op dat tijdstip verschuldigde saldo mee
      aan de wederpartij, met opgave van de aan deze nog niet eerder meegedeelde posten waaruit het is samengesteld.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel140
  - number: '140.3'
    text: |-
      Indien de wederpartij niet binnen redelijke tijd tegen het ingevolge het tweede lid meegedeelde saldo protesteert,
      geldt dit als tussen partijen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel140
  - number: '140.4'
    text: |-
      Na vaststelling van het saldo kan ten aanzien van de afzonderlijke posten geen beroep meer worden gedaan op het
      intreden van verjaring of op het verstrijken van een vervaltermijn. De rechtsvordering tot betaling van het saldo
      verjaart door verloop van vijf jaren na de dag, volgende op die waarop de rekening is geëindigd en het saldo
      opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel140
  - number: '140.5'
    text: |-
      Uit de tussen partijen bestaande rechtsverhouding kan anders voortvloeien dan in het eerste tot en met vierde lid
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel140
  - number: '141'
    text: |-
      Indien een verbintenis geheel of gedeeltelijk door verrekening tenietgaat, is
      [artikel 48, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel48
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '48'
        afdeling: '6'
  - number: '142.1'
    text: |-
      Bij overgang van een vordering op een nieuwe schuldeiser verkrijgt deze de daarbij behorende nevenrechten, zoals
      rechten van pand en hypotheek en uit borgtocht, voorrechten en de bevoegdheid om de ter zake van de vordering en de
      nevenrechten bestaande executoriale titels ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel142
  - number: '142.2'
    text: |-
      Onder de nevenrechten zijn tevens begrepen het recht van de vorige schuldeiser op bedongen rente of boete of op
      een dwangsom, behalve voor zover de rente opeisbaar of de boete of dwangsom reeds verbeurd was op het tijdstip van
      de overgang.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel142
  - number: '143.1'
    text: |-
      In geval van overgang van een vordering is de vorige schuldeiser verplicht de op de vordering en op de nevenrechten
      betrekking hebbende bewijsstukken af te geven aan de nieuwe schuldeiser. Behoudt hij zelf belang bij een
      bewijsstuk, dan is hij slechts verplicht om aan de nieuwe schuldeiser op diens verlangen en op diens kosten een
      afschrift of uittreksel af te geven, waaruit met overeenkomstige bewijskracht als uit het oorspronkelijke stuk van
      de vordering blijkt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel143
  - number: '143.2'
    text: |-
      De vorige schuldeiser is tevens verplicht tot afgifte van de in [artikel 142][ref1] bedoelde executoriale titels
      of, indien hijzelf belang bij deze titels behoudt, om de nieuwe schuldeiser tot tenuitvoerlegging daarvan in de
      gelegenheid te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel142
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '142'
        afdeling: '1'
  - number: '143.3'
    text: |-
      In geval van overgang van de gehele vordering is de vorige schuldeiser verplicht de zich in zijn handen bevindende
      panden af te geven aan de nieuwe schuldeiser.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel143
  - number: '143.4'
    text: |-
      In geval van overgang van een vordering waaraan hypotheek is verbonden, is de vorige schuldeiser verplicht
      desverlangd ertoe mee te werken dat uit de openbare registers van deze overgang blijkt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel143
  - number: '144.1'
    text: |-
      Brengt de overdracht van een vordering mee dat verplichtingen die uit het schuldeiserschap of uit nevenrechten
      voortvloeien, overgaan op de nieuwe schuldeiser, dan staat de vorige schuldeiser in voor de nakoming van deze
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel144
  - number: '144.2'
    text: |-
      Het eerste lid is niet van toepassing in geval van overdracht van een vordering aan toonder of order overeenkomstig
      [artikel 93 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel93
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '93'
  - number: '145'
    text: Overgang van een vordering laat de verweermiddelen van de schuldenaar onverlet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel145
  - number: '146.1'
    text: |-
      Na een overdracht overeenkomstig [artikel 93 van Boek 3][ref1] van een vordering aan toonder of aan order kan
      de schuldenaar een verweermiddel, gegrond op zijn verhouding tot een vorige schuldeiser, niet tegenwerpen aan de
      verkrijger en diens rechtsopvolgers, tenzij op het tijdstip van de overdracht het verweermiddel bekend was aan de
      verkrijger of voor hem kenbaar was uit het papier.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel93
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '93'
  - number: '146.2'
    text: |-
      Een beroep op onbekwaamheid of onbevoegdheid kan ook jegens een daarmee niet bekende verkrijger worden gedaan,
      indien zij ten tijde van zijn verkrijging kenbaar was uit een in een openbaar register opgenomen inschrijving, bij
      of krachtens de wet voorgeschreven ten einde kennisneming mogelijk te maken van de feiten waarop de onbevoegdheid
      of onbekwaamheid berust.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel146
  - number: '147'
    text: |-
      In geval van overdracht van een papier aan toonder of aan order verliest degene die volgens dat papier schuldenaar
      is, en aan wie is toe te rekenen dat het papier tegen zijn wil in omloop is of dat zijn handtekening vals of
      het papier vervalst is, de bevoegdheid zich daarop te beroepen tegenover de verkrijger te goeder trouw en diens
      rechtsopvolgers.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel147
  - number: '148'
    text: |-
      De [artikelen 146][ref1] en [147][ref2] zijn van overeenkomstige toepassing in geval van vestiging van een beperkt
      recht op een vordering aan toonder of aan order.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel147
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '146'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '147'
        afdeling: '1'
  - number: '149.1'
    text: |-
      Oefent de schuldenaar na overgang van de vordering onder bijzondere titel jegens de oorspronkelijke schuldeiser
      een bevoegdheid uit tot vernietiging of ontbinding van de rechtshandeling waaruit de vordering voortspruit, dan is
      hij verplicht om de nieuwe schuldeiser zo spoedig mogelijk daarvan mededeling te doen, tenzij de vernietiging of
      ontbinding niet aan deze kan worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel149
  - number: '149.2'
    text: |-
      Na verjaring van de rechtsvordering tot vernietiging of ontbinding wordt een beroep op de vernietigings- of
      ontbindingsgrond ter afwering van een op de rechtshandeling steunende rechtsvordering of andere rechtsmaatregel
      gericht tot de nieuwe schuldeiser en is de schuldenaar verplicht zo spoedig mogelijk nadien mededeling daarvan aan
      de oorspronkelijke schuldeiser te doen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel149
  - number: '149.3'
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing ter zake van de uitoefening van een bevoegdheid
      van de schuldenaar tot vernietiging of ontbinding, nadat op de vordering met mededeling aan hem een beperkt recht
      is gevestigd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel149
  - number: '150'
    text: 'Een vordering gaat bij wijze van subrogatie over op een derde:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel150
  - number: 150.a
    text: indien een hem toebehorend goed voor de vordering wordt uitgewonnen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel150
  - number: 150.b
    text: indien hij de vordering voldoet omdat een hem toebehorend goed voor de vordering verbonden is;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel150
  - number: 150.c
    text: |-
      indien hij de vordering voldoet om uitwinning te voorkomen van een hem niet toebehorend goed, mits door de
      uitwinning een recht dat hij op het goed heeft, verloren zou gaan of de voldoening van een hem toekomend
      vorderingsrecht in gevaar zou worden gebracht;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel150
  - number: 150.d
    text: |-
      krachtens overeenkomst tussen de derde die de vordering voldoet en de schuldenaar, mits de schuldeiser op het
      tijdstip van de voldoening deze overeenkomst kende of hem daarvan kennis was gegeven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel150
  - number: '151.1'
    text: |-
      Subrogatie overeenkomstig [artikel 150][ref1] vindt niet plaats voor zover de schuld de derde aangaat in zijn
      verhouding tot de schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel150
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '150'
        afdeling: '2'
  - number: '151.2'
    text: |-
      De rechten van de schuldeiser jegens borgen en personen die geen schuldenaar zijn, gaan slechts op de derde over
      tot ten hoogste de bedragen waarvoor de schuld ieder van hen aangaat in hun verhouding tot de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel151
  - number: '152.1'
    text: |-
      Blijkt verhaal krachtens subrogatie overeenkomstig [artikel 150][ref1] geheel of gedeeltelijk onmogelijk, dan
      wordt het onvoldaan gebleven deel over de gesubrogeerde en andere in [artikel 151, tweede lid][ref2], genoemde
      derden omgeslagen naar evenredigheid van de bedragen waarvoor ieder op het tijdstip van de voldoening jegens de
      schuldeiser aansprakelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel150
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel151
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '150'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '151'
        afdeling: '2'
  - number: '152.2'
    text: |-
      De gesubrogeerde kan van geen der andere bij de omslag betrokken derden een groter bedrag vorderen dan de
      oorspronkelijke schuldeiser op het tijdstip van de voldoening op deze had kunnen verhalen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel152
  - number: '152.3'
    text: |-
      Ieder der in de omslag betrokkenen blijft gerechtigd het bijgedragene alsnog van hem die geen verhaal bood, terug
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel152
  - number: '153'
    text: |-
      In het geval van subrogatie in de hoofdvordering verkrijgt de gesubrogeerde het recht op bedongen rente slechts
      voor zover deze betrekking heeft op het tijdvak na de overgang.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel153
  - number: '154'
    text: |-
      De schuldeiser is jegens degene die, zo hij de vordering voldoet, zal worden gesubrogeerd, verplicht zich te
      onthouden van elke gedraging die ten koste van deze afbreuk doet aan de rechten waarin hij mag verwachten krachtens
      de subrogatie te zullen treden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel154
  - number: '155'
    text: |-
      Een schuld gaat van de schuldenaar over op een derde, indien deze haar van de schuldenaar overneemt. De
      schuldoverneming heeft pas werking jegens de schuldeiser, indien deze zijn toestemming geeft nadat partijen hem van
      de overneming kennis hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel155
  - number: '156.1'
    text: |-
      Heeft de schuldeiser bij voorbaat zijn toestemming tot een schuldoverneming gegeven, dan vindt de overgang plaats,
      zodra de schuldenaar tot overeenstemming is gekomen met de derde en partijen de schuldeiser schriftelijk van de
      overneming kennis hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel156
  - number: '156.2'
    text: |-
      De schuldeiser kan een bij voorbaat gegeven toestemming niet herroepen, tenzij hij zich de bevoegdheid daartoe bij
      de toestemming heeft voorbehouden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel156
  - number: '157.1'
    text: |-
      De bij de vordering behorende nevenrechten worden na het tijdstip van de overgang tegen de nieuwe in plaats van
      tegen de oude schuldenaar uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel157
  - number: '157.2'
    text: |-
      Tot zekerheid van de overgegane schuld strekkende rechten van pand en hypotheek op een aan een der partijen
      toebehorend goed blijven bestaan; die op een niet aan partijen toebehorend goed en rechten uit borgtocht gaan door
      de overgang teniet, tenzij de pand- of hypotheekgever of borg tevoren in handhaving heeft toegestemd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel157
  - number: '157.3'
    text: |-
      Voorrechten op bepaalde goederen waarop de schuldeiser niet tevens een verhaalsrecht jegens derden heeft, gaan door
      de overgang teniet, tenzij de schuldoverneming plaatsvindt ter uitvoering van de overdracht van een onderneming
      waartoe ook het goed waarop het voorrecht rust, behoort. Voorrechten op het vermogen van de schuldenaar gelden na
      de overgang als voorrechten op het vermogen van de nieuwe schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel157
  - number: '157.4'
    text: |-
      Bedongen rechten en boeten, alsmede dwangsommen die vóór de overgang aan de schuldenaar werden opgelegd, worden
      door de nieuwe in plaats van door de oude schuldenaar verschuldigd, voor zover zij na het tijdstip van de overgang
      zijn opeisbaar geworden of verbeurd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel157
  - number: '158'
    text: |-
      Indien de rechtsverhouding tussen de vorige en de nieuwe schuldenaar op grond waarvan de schuld is overgenomen,
      nietig, vernietigd of ontbonden is, kan de schuldeiser de schuld weer op de vorige schuldenaar doen overgaan door
      daartoe strekkende kennisgevingen aan de beide betrokken partijen; elk van hen kan de schuldeiser daartoe een
      redelijke termijn stellen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel158
  - number: '159.1'
    text: |-
      Een partij bij een overeenkomst kan haar rechtsverhouding tot de wederpartij met medewerking van deze laatste
      overdragen aan een derde bij een tussen haar en de derde opgemaakte akte.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel159
  - number: '159.2'
    text: |-
      Hierdoor gaan alle rechten en verplichtingen over op de derde, voor zover niet ten aanzien van bijkomstige of reeds
      opeisbaar geworden rechten of verplichtingen anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel159
  - number: '159.3'
    text: |-
      De [artikelen 156][ref1] en [157, eerste tot en met derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel157
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '156'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '157'
        afdeling: '3'
  - number: '160.1'
    text: |-
      Een verbintenis gaat teniet door een overeenkomst van de schuldeiser met de schuldenaar, waarbij hij van zijn
      vorderingsrecht afstand doet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel160
  - number: '160.2'
    text: |-
      Een door de schuldeiser tot de schuldenaar gericht aanbod tot afstand om niet geldt als aanvaard, wanneer de
      schuldenaar van het aanbod heeft kennisgenomen en het niet onverwijld heeft afgewezen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel160
  - number: '160.3'
    text: |-
      De [artikelen 48, eerste en tweede lid][ref1], en [49, eerste tot en met derde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel49
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '48'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '49'
        afdeling: '6'
  - number: '161.1'
    text: |-
      Een verbintenis gaat teniet door vermenging, wanneer door overgang van de vordering of de schuld de hoedanigheid
      van schuldeiser en die van schuldenaar zich in één persoon verenigen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel161
  - number: '161.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel161
  - number: 161.2.a
    text: zolang de vordering en de schuld in van elkaar gescheiden vermogens vallen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel161
  - number: 161.2.b
    text: |-
      in geval van overdracht overeenkomstig [artikel 93 van Boek 3][ref1] van een vordering aan toonder of order;


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel93
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '93'
  - number: 161.2.c
    text: |-
      indien de voormelde vereniging van hoedanigheden het gevolg is van een rechtshandeling onder ontbindende
      voorwaarde, zolang niet vaststaat dat de voorwaarde niet meer in vervulling kan gaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel161
  - number: '161.3'
    text: Tenietgaan van een verbintenis door vermenging laat de op de vordering rustende rechten van derden onverlet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel161
  - number: '162.1'
    text: |-
      Hij die jegens een ander een onrechtmatige daad pleegt, die hem kan worden toegerekend, is verplicht de schade die
      de ander dientengevolge lijdt, te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel162
  - number: '162.2'
    text: |-
      Als onrechtmatige daad worden aangemerkt een inbreuk op een recht en een doen of nalaten in strijd met een
      wettelijke plicht of met hetgeen volgens ongeschreven recht in het maatschappelijk verkeer betaamt, een en ander
      behoudens de aanwezigheid van een rechtvaardigingsgrond.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel162
  - number: '162.3'
    text: |-
      Een onrechtmatige daad kan aan de dader worden toegerekend, indien zij te wijten is aan zijn schuld of aan een
      oorzaak die krachtens de wet of de in het verkeer geldende opvattingen voor zijn rekening komt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel162
  - number: '163'
    text: |-
      Geen verplichting tot schadevergoeding bestaat, wanneer de geschonden norm niet strekt tot bescherming tegen de
      schade zoals de benadeelde die heeft geleden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel163
  - number: '164'
    text: |-
      Een gedraging van een kind dat de leeftijd van veertien jaren nog niet heeft bereikt, kan aan hem niet als een
      onrechtmatige daad worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel164
  - number: '165.1'
    text: |-
      De omstandigheid dat een als een doen te beschouwen gedraging van een persoon van veertien jaren of ouder verricht
      is onder invloed van een geestelijke of lichamelijke tekortkoming, is geen beletsel haar als een onrechtmatige daad
      aan de dader toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel165
  - number: '165.2'
    text: |-
      Is jegens de benadeelde tevens een derde wegens onvoldoende toezicht aansprakelijk, dan is deze derde jegens de
      dader verplicht tot bijdragen in de schadevergoeding voor het gehele bedrag van zijn aansprakelijkheid jegens de
      benadeelde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel165
  - number: '166.1'
    text: |-
      Indien één van tot een groep behorende personen onrechtmatig schade toebrengt en de kans op het aldus toebrengen
      van schade deze personen had behoren te weerhouden van hun gedragingen in groepsverband, zijn zij hoofdelijk
      aansprakelijk indien deze gedragingen hun kunnen worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel166
  - number: '166.2'
    text: |-
      Zij moeten onderling voor gelijke delen in de schadevergoeding bijdragen, tenzij in de omstandigheden van het geval
      de billijkheid een andere verdeling vordert.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel166
  - number: '167.1'
    text: |-
      Wanneer iemand krachtens deze titel jegens een ander aansprakelijk is ter zake van een onjuiste of door
      onvolledigheid misleidende publicatie van gegevens van feitelijke aard, kan de rechter hem op vordering van die
      ander veroordelen tot openbaarmaking van een rectificatie op een door de rechter aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel167
  - number: '167.2'
    text: |-
      Hetzelfde geldt, indien aansprakelijkheid ontbreekt, omdat de publicatie aan de dader wegens diens onbekendheid met
      de onjuistheid of onvolledigheid niet als een onrechtmatige daad is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel167
  - number: '167.3'
    text: |-
      In het geval van het tweede lid kan de rechter die de vordering toewijst, bepalen dat de kosten van het geding
      en van de openbaarmaking van de rectificatie geheel of gedeeltelijk moeten worden gedragen door degene die
      de vordering heeft ingesteld. Elk der partijen heeft voor het gedeelte van de kosten van het geding en van de
      openbaarmaking van de rectificatie dat ingevolge de uitspraak door hem moet worden gedragen, verhaal op ieder die
      voor de door de publicatie ontstane schade aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel167
  - number: '168.1'
    text: |-
      De rechter kan een vordering, strekkende tot verbod van een onrechtmatige gedraging, afwijzen op de grond dat deze
      gedraging op grond van zwaarwegende maatschappelijke belangen behoort te worden geduld. De benadeelde behoudt zijn
      recht op vergoeding van de schade overeenkomstig deze titel.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel168
  - number: '168.2'
    text: |-
      In het geval van [artikel 170][ref1] is de ondergeschikte voor deze schade niet aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel170
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '170'
        afdeling: '2'
  - number: '168.3'
    text: |-
      Wordt aan een veroordeling tot schadevergoeding of tot het stellen van zekerheid daarvoor niet voldaan, dan kan de
      rechter alsnog een verbod van de gedraging opleggen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel168
  - number: '169.1'
    text: |-
      Voor schade, aan een derde toegebracht door een als een doen te beschouwen gedraging van een kind dat nog niet de
      leeftijd van veertien jaren heeft bereikt, en aan wie deze gedraging als een onrechtmatige daad zou kunnen worden
      toegerekend als zijn leeftijd daaraan niet in de weg zou staan, is degene die het ouderlijk gezag of de voogdij
      over het kind uitoefent, aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel169
  - number: '169.2'
    text: |-
      Voor schade, aan een derde toegebracht door een fout van een kind dat de leeftijd van veertien jaren al wel
      maar die van zestien jaren nog niet heeft bereikt, is degene die het ouderlijk gezag of de voogdij over het kind
      uitoefent, aansprakelijk, tenzij hem niet kan worden verweten dat hij de gedraging van het kind niet heeft belet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel169
  - number: '170.1'
    text: |-
      Voor schade, aan een derde toegebracht door een fout van een ondergeschikte, is degene in wiens dienst de
      ondergeschikte zijn taak vervult, aansprakelijk indien de kans op de fout door de opdracht tot het verrichten
      van deze taak is vergroot en degene in wiens dienst hij stond, uit hoofde van hun desbetreffende rechtsbetrekking
      zeggenschap had over de gedragingen waarin de fout was gelegen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel170
  - number: '170.2'
    text: |-
      Stond de ondergeschikte in dienst van een natuurlijke persoon en was hij niet werkzaam voor een beroep of bedrijf
      van deze persoon, dan is deze slechts aansprakelijk, indien de ondergeschikte bij het begaan van de fout handelde
      ter vervulling van de hem opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel170
  - number: '170.3'
    text: |-
      Zijn de ondergeschikte en degene in wiens dienst hij stond, beiden voor de schade aansprakelijk, dan behoeft de
      ondergeschikte in hun onderlinge verhouding niet in de schadevergoeding bij te dragen, tenzij de schade een gevolg
      is van zijn opzet of bewuste roekeloosheid. Uit de omstandigheden van het geval, mede gelet op de aard van hun
      verhouding, kan anders voortvloeien dan in de vorige zin is bepaald.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel170
  - number: '171'
    text: |-
      Indien een niet ondergeschikte die in opdracht van een ander werkzaamheden ter uitoefening van diens bedrijf
      verricht, jegens een derde aansprakelijk is voor een bij die werkzaamheden begane fout, is ook die ander jegens de
      derde aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel171
  - number: '172'
    text: |-
      Indien een gedraging van een vertegenwoordiger ter uitoefening van de hem als zodanig toekomende bevoegdheden een
      fout jegens een derde inhoudt, is ook de vertegenwoordigde jegens de derde aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel172
  - number: '173.1'
    text: |-
      De bezitter van een roerende zaak waarvan bekend is dat zij, zo zij niet voldoet aan de eisen die men in de
      gegeven omstandigheden aan de zaak mag stellen, een bijzonder gevaar voor personen of zaken oplevert, is, wanneer
      dit gevaar zich verwezenlijkt, aansprakelijk, tenzij aansprakelijkheid op grond van [afdeling 1][ref1] zou hebben
      ontbroken indien hij dit gevaar op het tijdstip van ontstaan daarvan zou hebben gekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling1
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '1'
  - number: '173.2'
    text: |-
      Indien de zaak niet aan de in het eerste lid bedoelde eisen voldoet wegens een gebrek als bedoeld in
      [afdeling 3][ref1], bestaat geen aansprakelijkheid op grond van het eerste lid voor schade als in die afdeling
      bedoeld, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '3'
  - number: 173.2.a
    text: |-
      alle omstandigheden in aanmerking genomen, aannemelijk is dat het gebrek niet bestond op het tijdstip waarop het
      product in het verkeer is gebracht of dat het gebrek op een later tijdstip is ontstaan, of
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel173
  - number: 173.2.b
    text: |-
      het betreft zaakschade ter zake waarvan krachtens [afdeling 3][ref1] geen recht op vergoeding bestaat op grond van
      de in die afdeling geregelde franchise.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '3'
  - number: '173.3'
    text: Het eerste en het tweede lid zijn niet van toepassing op dieren, motorrijtuigen, schepen en luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel173
  - number: '174.1'
    text: |-
      De bezitter van een opstal die niet voldoet aan de eisen die men daaraan in de gegeven omstandigheden mag stellen,
      en daardoor gevaar voor personen of zaken oplevert, is, wanneer dit gevaar zich verwezenlijkt, aansprakelijk,
      tenzij aansprakelijkheid op grond van [afdeling 1][ref1] zou hebben ontbroken indien hij dit gevaar op het tijdstip
      van het ontstaan ervan zou hebben gekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling1
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '1'
  - number: '174.2'
    text: |-
      Bij erfpacht rust de aansprakelijkheid op de bezitter van het erfpachtsrecht. Bij openbare wegen rust zij op het
      overheidslichaam dat moet zorgen dat de weg in goede staat verkeert, bij leidingen op de leidingbeheerder, behalve
      voor zover de leiding zich bevindt in een gebouw of werk en strekt tot toevoer of afvoer ten behoeve van dat gebouw
      of werk.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel174
  - number: '174.3'
    text: |-
      Onder opstal wordt in dit artikel verstaan gebouwen en werken die duurzaam met de grond zijn verenigd, hetzij
      rechtstreeks, hetzij door vereniging met andere gebouwen of werken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel174
  - number: '174.4'
    text: |-
      Degene die in de openbare registers als eigenaar van de opstal of van de grond staat ingeschreven, wordt vermoed de
      bezitter van de opstal te zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel174
  - number: '174.5'
    text: Voor de toepassing van dit artikel wordt onder openbare weg mede begrepen het weglichaam, alsmede de weguitrusting.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel174
  - number: '179'
    text: |-
      De bezitter van een dier is aansprakelijk voor de door het dier aangerichte schade, tenzij aansprakelijkheid op
      grond van [afdeling 1][ref1] zou hebben ontbroken indien hij de gedraging van het dier waardoor de schade werd
      toegebracht, in zijn macht zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling1
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '1'
  - number: '180.1'
    text: |-
      In de gevallen van de [artikelen 173][ref1], [174][ref2] en [179][ref3] zijn medebezitters hoofdelijk
      aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel179
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '179'
        afdeling: '2'
  - number: '180.2'
    text: |-
      In geval van overdracht van een zaak onder opschortende voorwaarde van voldoening van een tegenprestatie rust
      de aansprakelijkheid die de [artikelen 173][ref1], [174][ref2] en [179][ref3] op de bezitter leggen, vanaf het
      tijdstip van deze overdracht op de verkrijger.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel179
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '179'
        afdeling: '2'
  - number: '181.1'
    text: |-
      Worden de in de [artikelen 173][ref1], [174][ref2] en [179][ref3] bedoelde zaken, opstallen of dieren gebruikt in
      de uitoefening van een bedrijf, dan rust de aansprakelijkheid uit de artikelen 173, eerste lid, 174, eerste lid en
      tweede lid, eerste zin, en 179 op degene die dit bedrijf uitoefent, tenzij het een opstal betreft en het ontstaan
      van de schade niet met de uitoefening van het bedrijf in verband staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel174
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel179
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '174'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '179'
        afdeling: '2'
  - number: '181.2'
    text: |-
      Wanneer de zaken, opstallen of dieren in de uitoefening van een bedrijf worden gebruikt door ze ter beschikking te
      stellen voor gebruik in de uitoefening van het bedrijf van een ander, dan wordt die ander als de uit hoofde van het
      eerste lid aansprakelijke persoon aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel181
  - number: '183.1'
    text: |-
      Ter zake van aansprakelijkheid op grond van deze afdeling kan de aangesprokene geen beroep doen op zijn jeugdige
      leeftijd of geestelijke of lichamelijke tekortkoming.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel183
  - number: '183.2'
    text: |-
      Degene die het ouderlijk gezag of de voogdij uitoefent over een kind dat nog niet de leeftijd van veertien jaren
      heeft bereikt, is in zijn plaats uit de [artikelen 173][ref1] en [179][ref2] voor de daar bedoelde zaken en dieren
      aansprakelijk, tenzij deze worden gebruikt in de uitoefening van een bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel179
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '173'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '179'
        afdeling: '2'
  - number: '184.1'
    text: |-
      Onder de schade waarvoor op grond van de [artikelen 173 tot en met 181][ref1] aansprakelijkheid bestaat, vallen
      ook:


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel173
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '173'
        afdeling: '2'
  - number: 184.1.a
    text: |-
      de kosten van iedere redelijke maatregel ter voorkoming of beperking van schade door wie dan ook genomen, nadat een
      ernstige en onmiddellijke dreiging is ontstaan dat schade zal worden veroorzaakt die krachtens die artikelen voor
      vergoeding in aanmerking komt;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel184
  - number: 184.1.b
    text: schade en verlies, veroorzaakt door zulke maatregelen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel184
  - number: '184.2'
    text: |-
      Indien de maatregelen, bedoeld in het eerste lid, door een ander worden genomen dan degene die de schade zou hebben
      geleden ter zake waarvan de ernstige en onmiddellijke dreiging is ontstaan, kan deze ander slechts vergoeding van
      de in het eerste lid bedoelde kosten, schaden en verliezen vorderen, voor zover zij gevorderd hadden kunnen worden
      door degene die de dreigende schade zou hebben geleden, en kan de aangesprokene jegens die ander hetzelfde verweer
      voeren als hem jegens deze ten dienste zou hebben gestaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel184
  - number: '185.1'
    text: 'De producent is aansprakelijk voor de schade veroorzaakt door een gebrek in zijn product, tenzij:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: 185.1.a
    text: hij het product niet in het verkeer heeft gebracht;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: 185.1.b
    text: |-
      het, gelet op de omstandigheden, aannemelijk is dat het gebrek dat de schade heeft veroorzaakt, niet bestond op het
      tijdstip waarop hij het product in het verkeer heeft gebracht, dan wel dat dit gebrek later is ontstaan;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: 185.1.c
    text: |-
      het product noch voor de verkoop of voor enige andere vorm van verspreiding met een economisch doel van de
      producent is vervaardigd, noch is vervaardigd of verspreid in het kader van de uitoefening van zijn beroep of
      bedrijf;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: 185.1.d
    text: het gebrek een gevolg is van het feit dat het product in overeenstemming is met dwingende overheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: 185.1.e
    text: |-
      het op grond van de stand van de wetenschappelijke en technische kennis op het tijdstip waarop hij het product in
      het verkeer bracht, onmogelijk was het bestaan van het gebrek te ontdekken;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: 185.1.f
    text: |-
      wat de producent van een grondstof of fabrikant van een onderdeel betreft, het gebrek is te wijten aan het ontwerp
      van het product waarvan de grondstof of het onderdeel een bestanddeel vormt, dan wel aan de instructies die door de
      fabrikant van het product zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: '185.2'
    text: |-
      De aansprakelijkheid van de producent wordt verminderd of opgeheven, rekening houdende met alle omstandigheden,
      indien de schade is veroorzaakt zowel door een gebrek in het product als door schuld van de benadeelde of een
      persoon voor wie de benadeelde aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: '185.3'
    text: |-
      De aansprakelijkheid van de producent wordt niet verminderd, indien de schade is veroorzaakt zowel door een gebrek
      in het product als door de gedraging van een derde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel185
  - number: '186.1'
    text: |-
      Een product is gebrekkig, indien het niet de veiligheid biedt die men daarvan mag verwachten, alle omstandigheden
      in aanmerking genomen en in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel186
  - number: 186.1.a
    text: de presentatie van het product;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel186
  - number: 186.1.b
    text: het redelijkerwijs te verwachten gebruik van het product;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel186
  - number: 186.1.c
    text: het tijdstip waarop het product in het verkeer werd gebracht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel186
  - number: '186.2'
    text: |-
      Een product mag niet als gebrekkig worden beschouwd uitsluitend omdat nadien een beter product in het verkeer is
      gebracht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel186
  - number: '187.1'
    text: |-
      Onder «product» wordt voor de toepassing van de [artikelen 185 tot en met 193][ref1] verstaan een roerende zaak,
      ook nadat deze een bestanddeel is gaan vormen van een andere roerende of onroerende zaak, alsmede elektriciteit,
      zulks met uitzondering van landbouwproducten en producten van de jacht. Onder «landbouwproducten» wordt verstaan
      producten van de bodem, van de veefokkerij en van de visserij, met uitzondering van producten die een eerste
      bewerking of verwerking hebben ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel185
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '185'
        afdeling: '3'
  - number: '187.2'
    text: |-
      Onder «producent» wordt voor de toepassing van de [artikelen 185 tot en met 193][ref1] verstaan de fabrikant van
      een eindproduct, de producent van een grondstof of de fabrikant van een onderdeel, alsmede een ieder die zich als
      producent presenteert door zijn naam, zijn merk of een ander onderscheidingsteken op het product aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel185
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '185'
        afdeling: '3'
  - number: '187.3'
    text: |-
      Onverminderd de aansprakelijkheid van de producent, wordt een ieder die een product in het openbaar lichaam
      Bonaire, Sint Eustatius of Saba invoert om dit te verkopen, te verhuren, te leasen of anderszins te verstrekken in
      het kader van zijn commerciële activiteiten, beschouwd als producent; zijn aansprakelijkheid is dezelfde als die
      van de producent.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel187
  - number: '187.4'
    text: |-
      Indien niet kan worden vastgesteld wie de producent van het product is, wordt elke leverancier als producent
      ervan beschouwd, tenzij hij de benadeelde binnen een redelijke termijn de identiteit meedeelt van de producent of
      van degene die hem het product heeft geleverd. Indien ten aanzien van een in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba geïmporteerd product niet kan worden vastgesteld wie de importeur van dat product is, wordt
      eveneens elke leverancier als producent ervan beschouwd, tenzij hij de benadeelde binnen een redelijke termijn
      de identiteit meedeelt van de importeur die het in het openbaar lichaam Bonaire, Sint Eustatius of Saba heeft
      ingevoerd of van een in het openbaar lichaam Bonaire, Sint Eustatius of Saba gevestigde leverancier die hem het
      product heeft geleverd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel187
  - number: '188'
    text: De benadeelde moet de schade, het gebrek en het oorzakelijk verband tussen het gebrek en de schade bewijzen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel188
  - number: '189'
    text: |-
      Indien verschillende personen op grond van [artikel 185, eerste lid][ref1], aansprakelijk zijn voor dezelfde
      schade, is elk hunner voor het geheel aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel185
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '185'
        afdeling: '3'
  - number: '190.1'
    text: |-
      De aansprakelijkheid, bedoeld in [artikel 185, eerste lid][ref1], bestaat voor:


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel185
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '185'
        afdeling: '3'
  - number: 190.1.a
    text: schade door dood of lichamelijk letsel;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel190
  - number: 190.1.b
    text: |-
      schade, door het product toegebracht aan een andere zaak die gewoonlijk voor gebruik of verbruik in de privé-sfeer
      is bestemd en door de benadeelde ook hoofdzakelijk in de privé-sfeer is gebruikt of verbruikt, met toepassing van
      een franchise ten belope van USD 700,–.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel190
  - number: '190.2'
    text: Het bedrag, genoemd in het eerste lid, kan bij algemene maatregel van bestuur worden aangepast.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel190
  - number: '191.1'
    text: |-
      De rechtsvordering tot schadevergoeding van de benadeelde tegen de producent ingevolge
      [artikel 185, eerste lid][ref1], verjaart door verloop van drie jaren na de aanvang van de dag, volgende op die
      waarop de benadeelde met de schade, het gebrek en de identiteit van de producent bekend is geworden of had moeten
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel185
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '185'
        afdeling: '3'
  - number: '191.2'
    text: |-
      Het recht op schadevergoeding van de benadeelde jegens de producent ingevolge [artikel 185, eerste lid][ref1],
      vervalt door verloop van tien jaren na de aanvang van de dag, volgende op die waarop de producent de zaak die de
      schade heeft veroorzaakt, in het verkeer heeft gebracht. Hetzelfde geldt voor het recht van een derde die mede voor
      de schade aansprakelijk is, ter zake van regres jegens de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel185
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '185'
        afdeling: '3'
  - number: '192.1'
    text: |-
      De aansprakelijkheid van de producent uit hoofde van deze afdeling kan jegens de benadeelde niet worden uitgesloten
      of beperkt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel192
  - number: '192.2'
    text: |-
      Is jegens de benadeelde tevens een derde aansprakelijk die het product niet gebruikt in de uitoefening van een
      beroep of bedrijf, dan kan niet ten nadele van die derde worden afgeweken van de regels inzake het regres.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel192
  - number: '193'
    text: |-
      Het recht op schadevergoeding jegens de producent uit hoofde van deze afdeling komt de benadeelde toe, onverminderd
      alle andere rechten of vorderingen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel193
  - number: '194'
    text: |-
      Hij die omtrent goederen of diensten die door hem of degene ten behoeve van wie hij handelt in de uitoefening
      van een beroep of bedrijf worden aangeboden, een mededeling openbaar maakt of laat openbaar maken, handelt
      onrechtmatig, indien deze mededeling in een of meer opzichten misleidend is, zoals ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.a
    text: de aard, samenstelling, hoeveelheid, hoedanigheid, eigenschappen of gebruiksmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.b
    text: de herkomst, de wijze of het tijdstip van vervaardigen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.c
    text: de omvang van de voorraad;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.d
    text: de prijs of de wijze van berekenen daarvan;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.e
    text: de aanleiding of het doel van de aanbieding;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.f
    text: |-
      de toegekende onderscheidingen, getuigschriften of andere door derden uitgebrachte beoordelingen of gedane
      verklaringen, of de gebezigde wetenschappelijke of vaktermen, technische bevindingen of statistische gegevens;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.g
    text: de voorwaarden waaronder goederen worden geleverd of diensten worden verricht of de betaling plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.h
    text: de omvang, inhoud of tijdsduur van de garantie;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.i
    text: |-
      de identiteit, hoedanigheden, bekwaamheid of bevoegdheid en degene door wie, onder wiens leiding of toezicht of met
      wiens medewerking de goederen zijn of worden vervaardigd of aangeboden of de diensten worden verricht;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: 194.j
    text: vergelijking met andere goederen of diensten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel194
  - number: '195.1'
    text: |-
      Indien een vordering ingevolge [artikel 194][ref1] wordt ingesteld tegen iemand die inhoud en inkleding van
      de mededeling geheel of ten dele zelf heeft bepaald of doen bepalen, rust op hem de bewijslast ter zake van
      de juistheid of volledigheid van de feiten die in de mededeling zijn vervat of daardoor worden gesuggereerd en
      waarop het beweerde misleidende karakter van de mededeling berust, behoudens voor zover deze bewijslastverdeling
      onredelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel194
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '194'
        afdeling: '4'
  - number: '195.2'
    text: |-
      Indien volgens [artikel 194][ref1] onrechtmatig is gehandeld door iemand die inhoud en inkleding van de mededeling
      geheel of ten dele zelf heeft bepaald of doen bepalen, is hij voor de dientengevolge ontstane schade aansprakelijk,
      tenzij hij bewijst dat zulks noch aan zijn schuld is te wijten noch op andere grond voor zijn rekening komt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel194
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '194'
        afdeling: '4'
  - number: '196.1'
    text: |-
      Indien iemand door het openbaar maken of laten openbaar maken van een in [artikel 194][ref1] omschreven mededeling
      aan een ander schade heeft toegebracht of dreigt toe te brengen, kan de rechter hem op vordering van die ander
      niet alleen het openbaar maken of laten openbaar maken van zodanige mededeling verbieden, maar ook hem veroordelen
      tot het op een door de rechter aangegeven wijze openbaar maken of laten openbaar maken van een rectificatie van
      die mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel194
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '194'
        afdeling: '4'
  - number: '196.2'
    text: |-
      Indien de vordering wordt toegewezen jegens iemand die niet tevens aansprakelijk is voor de in
      [artikel 195, tweede lid][ref1], bedoelde schade, is [artikel 167, derde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel167
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '195'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '167'
        afdeling: '1'
  - number: '198'
    text: |-
      Zaakwaarneming is het zich willens en wetens en op redelijke grond inlaten met de behartiging van eens anders
      belang, zonder de bevoegdheid daartoe aan een rechtshandeling of een elders in de wet geregelde rechtsverhouding
      te ontlenen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel198
  - number: '199.1'
    text: |-
      De zaakwaarnemer is verplicht bij de waarneming de nodige zorg te betrachten en, voor zover dit redelijkerwijs van
      hem kan worden verlangd, de begonnen waarneming voort te zetten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel199
  - number: '199.2'
    text: |-
      De zaakwaarnemer doet, zodra dit redelijkerwijs mogelijk is, aan de belanghebbende verantwoording van hetgeen hij
      heeft verricht. Heeft hij voor de belanghebbende gelden uitgegeven of ontvangen, dan doet hij daarvan rekening.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel199
  - number: '200.1'
    text: |-
      De belanghebbende is, voor zover zijn belang naar behoren is behartigd, gehouden de zaakwaarnemer de schade te
      vergoeden die deze als gevolg van de waarneming heeft geleden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel200
  - number: '200.2'
    text: |-
      Heeft de zaakwaarnemer in de uitoefening van een beroep of bedrijf gehandeld, dan heeft hij, voor zover dit
      redelijk is, bovendien recht op een vergoeding voor zijn verrichtingen, met inachtneming van de prijzen die
      daarvoor ten tijde van de zaakwaarneming gewoonlijk werden berekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel200
  - number: '201'
    text: |-
      Een zaakwaarnemer is bevoegd rechtshandelingen te verrichten in naam van de belanghebbende, voor zover diens belang
      daardoor naar behoren wordt behartigd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel201
  - number: '202'
    text: |-
      Heeft iemand die is opgetreden ter behartiging van eens anders belang, zich zonder redelijke grond daarmee
      ingelaten of dit belang niet naar behoren behartigd, dan kan de belanghebbende door goedkeuring van het optreden
      zijn bevoegdheid prijsgeven jegens hem het gebrek in te roepen. Aan de belanghebbende kan door hem een redelijke
      termijn voor de goedkeuring worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel202
  - number: '203.1'
    text: |-
      Degene die een ander zonder rechtsgrond een goed heeft gegeven, is gerechtigd dit van de ontvanger als
      onverschuldigd betaald terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel203
  - number: '203.2'
    text: Betreft de onverschuldigde betaling een geldsom, dan strekt de vordering tot teruggave van een gelijk bedrag.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel203
  - number: '203.3'
    text: |-
      Degene die zonder rechtsgrond een prestatie van andere aard heeft verricht, heeft eveneens jegens de ontvanger
      recht op ongedaanmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel203
  - number: '204.1'
    text: |-
      Heeft de ontvanger in een periode waarin hij redelijkerwijs met een verplichting tot teruggave van het goed geen
      rekening behoefde te houden, niet als een zorgvuldig schuldenaar voor het goed zorg gedragen, dan wordt hem dit
      niet toegerekend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel204
  - number: '204.2'
    text: |-
      Degene die namens een ander, maar onbevoegd een niet aan die ander verschuldigde geldsom heeft ontvangen, is van
      zijn verplichting tot teruggave bevrijd, voor zover hij die geldsom aan die ander heeft doorbetaald in een periode
      waarin hij redelijkerwijs met die verplichting geen rekening behoefde te houden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel204
  - number: '205'
    text: Heeft de ontvanger het goed te kwader trouw aangenomen, dan is hij zonder ingebrekestelling in verzuim.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel205
  - number: '206'
    text: |-
      De [artikelen 120][ref1], [121][ref2], [123][ref3] en [124 van Boek 3][ref4] zijn van overeenkomstige toepassing
      met betrekking tot hetgeen daarin is bepaald omtrent de afgifte van vruchten en de vergoeding van kosten en schade.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0028745#Artikel124
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '121'
      - id: ref3
        bwb_id: BWBR0028745
        artikel: '123'
      - id: ref4
        bwb_id: BWBR0028745
        artikel: '124'
  - number: '207'
    text: |-
      De ontvanger heeft, tenzij hij het goed te kwader trouw heeft aangenomen, binnen de grenzen van de redelijkheid
      ook recht op vergoeding van de kosten van het ontvangen en teruggeven van het goed, alsmede van uitgaven in de in
      [artikel 204][ref1] bedoelde periode die zouden zijn uitgebleven als hij het goed niet had ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel204
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '204'
        afdeling: '2'
  - number: '208'
    text: |-
      De ontvanger verliest zijn recht op de in de [artikelen 206][ref1] en [207][ref2] bedoelde vergoedingen, indien
      de wederpartij afstand doet van haar recht op terugvordering en, voor zover nodig, het onverschuldigd betaalde
      ter bevrijding van deze vergoedingen op haar kosten aan de ontvanger overdraagt. De ontvanger is verplicht aan een
      zodanige overdracht mee te werken.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel207
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '206'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '207'
        afdeling: '2'
  - number: '209'
    text: |-
      Op de onbekwame die een onverschuldigde betaling heeft ontvangen, rusten de in deze afdeling omschreven
      verplichtingen slechts voor zover het ontvangene hem tot werkelijk voordeel heeft gestrekt of in de macht van zijn
      wettelijke vertegenwoordiger is gekomen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel209
  - number: '210.1'
    text: |-
      Op de ongedaanmaking van prestaties die niet in het geven van een goed hebben bestaan, zijn de
      [artikelen 204 tot en met 209][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel204
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '204'
        afdeling: '2'
  - number: '210.2'
    text: |-
      Sluit de aard van de prestatie uit dat zij ongedaan wordt gemaakt, dan treedt, voor zover dit redelijk is,
      vergoeding van de waarde van de prestatie op het ogenblik van ontvangst daarvoor in de plaats, indien de ontvanger
      door de prestatie is verrijkt, indien het aan hem is toe te rekenen dat de prestatie is verricht, of indien hij
      erin had toegestemd een tegenprestatie te verrichten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel210
  - number: '211.1'
    text: |-
      Kan een prestatie die op grond van een nietige overeenkomst is verricht, naar haar aard niet ongedaan worden
      gemaakt en behoort zij ook niet in rechte op geld te worden gewaardeerd, dan is een tot ongedaanmaking van een
      tegenprestatie of tot vergoeding van de waarde daarvan strekkende vordering, voor zover deze deswege in strijd met
      redelijkheid en billijkheid zou zijn, eveneens uitgesloten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel211
  - number: '211.2'
    text: |-
      Is ingevolge het eerste lid terugvordering van een overgedragen goed uitgesloten, dan brengt de nietigheid van de
      overeenkomst niet de nietigheid van de overdracht mee.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel211
  - number: '212.1'
    text: |-
      Hij die ongerechtvaardigd is verrijkt ten koste van een ander, is verplicht, voor zover dit redelijk is, diens
      schade te vergoeden tot het bedrag van zijn verrijking.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel212
  - number: '212.2'
    text: |-
      Voor zover de verrijking is verminderd als gevolg van een omstandigheid die niet aan de verrijkte kan worden
      toegerekend, blijft zij buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel212
  - number: '212.3'
    text: |-
      Is de verrijking verminderd in de periode waarin de verrijkte redelijkerwijs met een verplichting tot vergoeding
      van de schade geen rekening behoefde te houden, dan wordt hem dit niet toegerekend. Bij de vaststelling van deze
      vermindering wordt mede rekening gehouden met uitgaven die zonder de verrijking zouden zijn uitgebleven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel212
  - number: '213.1'
    text: |-
      Een overeenkomst in de zin van deze titel is een meerzijdige rechtshandeling, waarbij een of meer partijen jegens
      een of meer andere een verbintenis aangaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel213
  - number: '213.2'
    text: |-
      Op overeenkomsten tussen meer dan twee partijen zijn de wettelijke bepalingen betreffende overeenkomsten niet
      toepasselijk, voor zover de strekking van de betrokken bepalingen in verband met de aard van de overeenkomst zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel213
  - number: '215'
    text: |-
      Voldoet een overeenkomst aan de omschrijving van twee of meer door de wet geregelde bijzondere soorten van
      overeenkomsten, dan zijn de voor elk van die soorten gegeven bepalingen naast elkaar op de overeenkomst van
      toepassing, behoudens voor zover deze bepalingen niet wel verenigbaar zijn of de strekking daarvan in verband met
      de aard van de overeenkomst zich tegen toepassing verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel215
  - number: '216'
    text: |-
      Deze afdeling en de [tweede][ref1], de [derde][ref2] en de [vierde afdeling][ref3] vinden overeenkomstige
      toepassing op andere meerzijdige vermogensrechtelijke rechtshandelingen, voor zover de strekking van de betrokken
      bepalingen in verband met de aard van de rechtshandeling zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Afdeling3
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Afdeling4
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0028749
        afdeling: '4'
  - number: '217.1'
    text: Een overeenkomst komt tot stand door een aanbod en de aanvaarding daarvan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel217
  - number: '217.2'
    text: |-
      De [artikelen 219 tot en met 225][ref1] zijn van toepassing, tenzij iets anders voortvloeit uit het aanbod, uit een
      andere rechtshandeling of uit een gewoonte.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel219
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '219'
        afdeling: '2'
  - number: '218'
    text: Een aanbod is geldig, nietig of vernietigbaar overeenkomstig de regels voor meerzijdige rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel218
  - number: '219.1'
    text: |-
      Een aanbod kan worden herroepen, tenzij het een termijn voor de aanvaarding inhoudt of de onherroepelijkheid ervan
      op andere wijze uit het aanbod volgt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel219
  - number: '219.2'
    text: |-
      De herroeping kan slechts geschieden, zolang het aanbod niet is aanvaard en evenmin een mededeling, houdende de
      aanvaarding, is verzonden. Bevat het aanbod de mededeling dat het vrijblijvend wordt gedaan, dan kan de herroeping
      nog onverwijld na de aanvaarding geschieden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel219
  - number: '219.3'
    text: |-
      Een beding waarbij een der partijen zich verbindt om, indien de wederpartij dit wenst, met haar een bepaalde
      overeenkomst te sluiten, geldt als een onherroepelijk aanbod.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel219
  - number: '220.1'
    text: |-
      Een bij wijze van uitloving voor een bepaalde tijd gedaan aanbod kan wegens gewichtige redenen worden herroepen
      of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel220
  - number: '220.2'
    text: |-
      In geval van herroeping of wijziging van een uitloving kan de rechter aan iemand die op grond van de uitloving met
      de voorbereiding van een gevraagde prestatie is begonnen, een billijke schadeloosstelling toekennen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel220
  - number: '221.1'
    text: |-
      Een mondeling aanbod vervalt, wanneer het niet onmiddellijk wordt aanvaard, een schriftelijk aanbod, wanneer het
      niet binnen een redelijke tijd wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel221
  - number: '221.2'
    text: Een aanbod vervalt, doordat het wordt verworpen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel221
  - number: '222'
    text: |-
      Een aanbod vervalt niet door de dood of het verlies van handelingsbekwaamheid van een der partijen, noch doordat
      een der partijen de bevoegdheid tot het sluiten van de overeenkomst verliest als gevolg van een bewind.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel222
  - number: '223.1'
    text: |-
      De aanbieder kan een te late aanvaarding toch als tijdig gedaan laten gelden, mits hij dit onverwijld aan de
      wederpartij meedeelt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel223
  - number: '223.2'
    text: |-
      Indien een aanvaarding te laat plaatsvindt, maar de aanbieder begrijpt of behoort te begrijpen dat dit voor de
      wederpartij niet duidelijk was, geldt de aanvaarding als tijdig gedaan, tenzij hij onverwijld aan de wederpartij
      meedeelt dat hij het aanbod als vervallen beschouwt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel223
  - number: '224'
    text: |-
      Indien een aanvaarding de aanbieder niet of niet tijdig bereikt door een omstandigheid op grond waarvan zij
      krachtens [artikel 37, derde lid, tweede zin, van Boek 3][ref1] niettemin haar werking heeft, wordt de overeenkomst
      geacht tot stand te zijn gekomen op het tijdstip waarop zonder de storende omstandigheid de verklaring zou zijn
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel37
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '37'
  - number: '225.1'
    text: |-
      Een aanvaarding die van het aanbod afwijkt, geldt als een nieuw aanbod en als een verwerping van het
      oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel225
  - number: '225.2'
    text: |-
      Wijkt een tot aanvaarding strekkend antwoord op een aanbod daarvan slechts op ondergeschikte punten af, dan geldt
      dit antwoord als aanvaarding en komt de overeenkomst overeenkomstig deze aanvaarding tot stand, tenzij de aanbieder
      onverwijld bezwaar maakt tegen de verschillen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel225
  - number: '225.3'
    text: |-
      Verwijzen aanbod en aanvaarding naar verschillende algemene voorwaarden, dan komt aan de tweede verwijzing geen
      werking toe, wanneer daarbij niet tevens de toepasselijkheid van de in de eerste verwijzing aangegeven algemene
      voorwaarden uitdrukkelijk van de hand wordt gewezen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel225
  - number: '226'
    text: |-
      Stelt de wet voor de totstandkoming van een overeenkomst een vormvereiste, dan is dit voorschrift van
      overeenkomstige toepassing op een overeenkomst waarbij een partij in wier belang het strekt, zich tot het aangaan
      van een zodanige overeenkomst verbindt, tenzij uit de strekking van het voorschrift anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel226
  - number: '227'
    text: De verbintenissen die partijen op zich nemen, moeten bepaalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel227
  - number: '228.1'
    text: |-
      Een overeenkomst die tot stand is gekomen onder invloed van dwaling en bij een juiste voorstelling van zaken niet
      zou zijn gesloten, is vernietigbaar, indien:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel228
  - number: 228.1.a
    text: |-
      de dwaling te wijten is aan een inlichting van de wederpartij, tenzij deze mocht aannemen dat de overeenkomst ook
      zonder deze inlichting zou worden gesloten;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel228
  - number: 228.1.b
    text: |-
      de wederpartij in verband met hetgeen zij omtrent de dwaling wist of behoorde te weten, de dwalende had behoren in
      te lichten;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel228
  - number: 228.1.c
    text: |-
      de wederpartij bij het sluiten van de overeenkomst van dezelfde onjuiste ver- onderstelling als de dwalende is
      uitgegaan, tenzij zij ook bij een juiste voorstelling van zaken niet had behoeven te begrijpen dat de dwalende
      daardoor van het sluiten van de overeenkomst zou worden afgehouden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel228
  - number: '228.2'
    text: |-
      De vernietiging kan niet worden gegrond op een dwaling die een uitsluitend toekomstige omstandigheid betreft, of
      die in verband met de aard van de overeenkomst, de in het verkeer geldende opvattingen of de omstandigheden van het
      geval voor rekening van de dwalende behoort te blijven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel228
  - number: '229'
    text: |-
      Een overeenkomst die de strekking heeft voort te bouwen op een reeds tussen partijen bestaande rechtsverhouding,
      is vernietigbaar, indien deze rechtsverhouding ontbreekt, tenzij dit in verband met de aard van de overeenkomst,
      de in het verkeer geldende opvattingen of de omstandigheden van het geval voor rekening van degene die zich op dit
      ontbreken beroept, behoort te blijven.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel229
  - number: '230.1'
    text: |-
      De bevoegdheid tot vernietiging op grond van de [artikelen 228][ref1] en [229][ref2] vervalt, wanneer de
      wederpartij tijdig een wijziging van de gevolgen van de overeenkomst voorstelt die het nadeel dat de tot
      vernietiging bevoegde bij instandhouding van de overeenkomst lijdt, op afdoende wijze opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel228
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel229
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '228'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '229'
        afdeling: '2'
  - number: '230.2'
    text: |-
      Bovendien kan de rechter op verlangen van een der partijen, in plaats van de vernietiging uit te spreken, de
      gevolgen van de overeenkomst ter opheffing van dit nadeel wijzigen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel230
  - number: '231'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel231
  - number: 231.a
    text: |-
      *algemene voorwaarden:* een of meer schriftelijke bedingen die zijn opgesteld ten einde in een aantal
      overeenkomsten te worden opgenomen, met uitzondering van bedingen die de kern van de prestaties aangeven;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel231
  - number: 231.b
    text: '*gebruiker:* degene die algemene voorwaarden in een overeenkomst gebruikt;'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel231
  - number: 231.c
    text: |-
      *wederpartij:* degene die door ondertekening van een geschrift of op andere wijze de gelding van algemene
      voorwaarden heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel231
  - number: '232'
    text: |-
      Een wederpartij is ook dan aan de algemene voorwaarden gebonden als bij het sluiten van de overeenkomst de
      gebruiker begreep of moest begrijpen dat zij de inhoud daarvan niet kende.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel232
  - number: '233'
    text: 'Een beding in algemene voorwaarden is vernietigbaar, indien:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel233
  - number: 233.a
    text: |-
      het, gelet op de aard en de overige inhoud van de overeenkomst, de wijze waarop de voorwaarden zijn tot stand
      gekomen, de wederzijds kenbare belangen van partijen en de overige omstandigheden van het geval, onredelijk
      bezwarend is voor de wederpartij, of
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel233
  - number: 233.b
    text: |-
      de gebruiker aan de wederpartij niet een redelijke mogelijkheid heeft geboden om van de algemene voorwaarden kennis
      te nemen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel233
  - number: '234.1'
    text: |-
      De gebruiker heeft aan de wederpartij de in [artikel 233, onderdeel b][ref1], bedoelde mogelijkheid geboden, indien
      hij:


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel233
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '233'
        afdeling: '3'
  - number: 234.1.a
    text: |-
      hetzij de algemene voorwaarden voor of bij het sluiten van de overeenkomst aan de wederpartij ter hand heeft
      gesteld,
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel234
  - number: 234.1.b
    text: |-
      hetzij, indien dit redelijkerwijs niet mogelijk is, vóór de totstandkoming van de overeenkomst aan de wederpartij
      heeft bekendgemaakt dat de voorwaarden bij hem ter inzage liggen of bij een door hem opgegeven kantoor van het
      handelsregister of griffie van het gerecht in eerste aanleg zijn gedeponeerd, alsmede dat zij op verzoek zullen
      worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel234
  - number: '234.2'
    text: |-
      Indien de voorwaarden niet voor of bij het sluiten van de overeenkomst aan de wederpartij zijn ter hand gesteld,
      zijn de bedingen tevens vernietigbaar indien de gebruiker de voorwaarden niet op verzoek van de wederpartij
      onverwijld op zijn kosten aan haar toezendt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel234
  - number: '234.3'
    text: |-
      Het in het eerste lid, onderdeel b, en tweede lid omtrent de verplichting tot toezending bepaalde is niet van
      toepassing, voor zover deze toezending redelijkerwijs niet van de gebruiker kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel234
  - number: '235.1'
    text: |-
      Op de vernietigingsgrond, bedoeld in [artikel 233, onderdeel a][ref1], kan mede een beroep worden gedaan door
      een partij voor wie de algemene voorwaarden door een gevolmachtigde zijn gebruikt, mits de wederpartij meermalen
      overeenkomsten sluit waarop dezelfde of nagenoeg dezelfde algemene voorwaarden van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel233
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '233'
        afdeling: '3'
  - number: '235.2'
    text: |-
      Op de vernietigingsgronden, bedoeld in de [artikelen 233][ref1] en [234][ref2], kan geen beroep worden gedaan door
      een partij die meermalen dezelfde of nagenoeg dezelfde algemene voorwaarden in haar overeenkomsten gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel233
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel234
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '233'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '234'
        afdeling: '3'
  - number: '235.3'
    text: |-
      De termijn, bedoeld in [artikel 52, eerste lid, onderdeel d, van Boek 3][ref1], begint met de aanvang van de dag,
      volgende op die waarop een beroep op het beding is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel52
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '52'
  - number: '236'
    text: |-
      Bij een overeenkomst tussen een gebruiker en een wederpartij, natuurlijk persoon, die niet handelt in de
      uitoefening van een beroep of bedrijf, wordt als onredelijk bezwarend aangemerkt een in de algemene voorwaarden
      voorkomend beding:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.a
    text: |-
      dat de wederpartij geheel en onvoorwaardelijk het recht ontneemt de door de gebruiker toegezegde prestatie op te
      eisen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.b
    text: |-
      dat de aan de wederpartij toekomende bevoegdheid tot ontbinding, zoals deze in [afdeling 5][ref1] is geregeld,
      uitsluit of beperkt;


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling5
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '5'
  - number: 236.c
    text: |-
      dat een de wederpartij volgens de wet toekomende bevoegdheid tot opschorting van de nakoming uitsluit of beperkt of
      de gebruiker een verdergaande bevoegdheid tot opschorting verleent dan hem volgens de wet toekomt;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.d
    text: |-
      dat de beoordeling van de vraag of de gebruiker in de nakoming van een of meer van zijn verbintenissen is
      tekortgeschoten aan hem zelf overlaat, of dat de uitoefening van de rechten die de wederpartij ter zake van een
      zodanige tekortkoming volgens de wet toekomen, afhankelijk stelt van de voorwaarde dat deze eerst een derde in
      rechte heeft aangesproken;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.e
    text: |-
      krachtens hetwelk de wederpartij aan de gebruiker bij voorbaat toestemming verleent zijn uit de overeenkomst
      voortvloeiende verplichtingen op een der in [titel 2, afdeling 3][ref1], bedoelde wijzen op een derde te doen
      overgaan, tenzij de wederpartij te allen tijde de bevoegdheid heeft de overeenkomst te ontbinden, of de gebruiker
      jegens de wederpartij aansprakelijk is voor de nakoming door de derde, of de overgang plaatsvindt in verband met de
      overdracht van een onderneming waartoe zowel die verplichtingen als de daartegenover bedongen rechten behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0028749
        afdeling: '3'
  - number: 236.f
    text: |-
      dat voor het geval uit de overeenkomst voor de gebruiker voortvloeiende rechten op een derde overgaan, ertoe strekt
      bevoegdheden of verweermiddelen die de wederpartij volgens de wet jegens die derde zou kunnen doen gelden, uit te
      sluiten of te beperken;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.g
    text: |-
      dat een wettelijke verjarings- of vervaltermijn waarbinnen de wederpartij enig recht moet geldend maken, tot een
      verjarings- onderscheidenlijk vervaltermijn van minder dan een jaar verkort;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.h
    text: |-
      dat voor het geval bij de uitvoering van de overeenkomst schade aan een derde wordt toegebracht door de gebruiker
      of door een persoon of zaak waarvoor deze aansprakelijk is, de wederpartij verplicht deze schade hetzij aan de
      derde te vergoeden, hetzij in haar verhouding tot de gebruiker voor een groter deel te dragen dan waartoe zij
      volgens de wet verplicht zou zijn;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.i
    text: |-
      dat de gebruiker de bevoegdheid geeft de door hem bedongen prijs binnen drie maanden na het sluiten van de
      overeenkomst te verhogen, tenzij de wederpartij bevoegd is in dat geval de overeenkomst te ontbinden;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.j
    text: |-
      dat in geval van een overeenkomst tot het geregeld afleveren van zaken, elektriciteit daaronder begrepen, of tot
      het geregeld doen van verrichtingen, leidt tot stilzwijgende verlenging of vernieuwing van meer dan een jaar;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.k
    text: |-
      dat de bevoegdheid van de wederpartij om bewijs te leveren uitsluit of beperkt, of dat de uit de wet voortvloeiende
      verdeling van de bewijslast ten nadele van de wederpartij wijzigt, hetzij doordat het een verklaring van haar bevat
      omtrent de deugdelijkheid van de haar verschuldigde prestatie, hetzij doordat het haar belast met het bewijs dat
      een tekortkoming van de gebruiker aan hem kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.l
    text: |-
      dat ten nadele van de wederpartij afwijkt van [artikel 37 van Boek 3][ref1], tenzij het betrekking heeft op de vorm
      van door de wederpartij af te leggen verklaringen of bepaalt dat de gebruiker het hem door de wederpartij opgegeven
      adres als zodanig mag blijven beschouwen totdat hem een nieuw adres is meegedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel37
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '37'
  - number: 236.m
    text: |-
      waarbij een wederpartij die bij het aangaan van de overeenkomst werkelijke woonplaats in het openbaar lichaam
      Bonaire, Sint Eustatius of Saba heeft, elders woonplaats kiest anders dan voor het geval zij te eniger tijd
      geen bekende werkelijke woonplaats in het openbaar lichaam Bonaire, Sint Eustatius of Saba zal hebben, tenzij de
      overeenkomst betrekking heeft op een registergoed en woonplaats ten kantore van een notaris wordt gekozen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: 236.n
    text: |-
      dat voorziet in de beslechting van een geschil door een ander dan hetzij de rechter die volgens de wet bevoegd zou
      zijn, hetzij een of meer arbiters, tenzij het de wederpartij een termijn gunt van ten minste een maand nadat de
      gebruiker zich schriftelijk jegens haar op het beding heeft beroepen, om voor beslechting van het geschil door de
      volgens de wet bevoegde rechter te kiezen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel236
  - number: '237'
    text: |-
      Bij een overeenkomst tussen een gebruiker en een wederpartij, natuurlijk persoon, die niet handelt in de
      uitoefening van een beroep of bedrijf, wordt vermoed onredelijk bezwarend te zijn een in de algemene voorwaarden
      voorkomend beding:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.a
    text: |-
      dat de gebruiker een, gelet op de omstandigheden van het geval, ongebruikelijk lange of onvoldoende bepaalde
      termijn geeft om op een aanbod of een andere verklaring van de wederpartij te reageren;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.b
    text: |-
      dat de inhoud van de verplichtingen van de gebruiker wezenlijk beperkt ten opzichte van hetgeen de wederpartij,
      mede gelet op de wettelijke regels die op de overeenkomst betrekking hebben, zonder dat beding redelijkerwijs mocht
      verwachten;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.c
    text: |-
      dat de gebruiker de bevoegdheid verleent een prestatie te verschaffen die wezenlijk van de toegezegde prestatie
      afwijkt, tenzij de wederpartij bevoegd is in dat geval de overeenkomst te ontbinden;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.d
    text: |-
      dat de gebruiker van zijn gebondenheid aan de overeenkomst bevrijdt of hem de bevoegdheid daartoe geeft, anders dan
      op in de overeenkomst vermelde gronden die van dien aard zijn dat deze gebondenheid niet meer van hem kan worden
      gevergd;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.e
    text: dat de gebruiker een ongebruikelijk lange of onvoldoende bepaalde termijn voor de nakoming geeft;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.f
    text: dat de gebruiker of een derde geheel of ten dele bevrijdt van een wettelijke verplichting tot schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.g
    text: |-
      dat een de wederpartij volgens de wet toekomende bevoegdheid tot verrekening uitsluit of beperkt of de gebruiker
      een verdergaande bevoegdheid tot verrekening verleent dan hem volgens de wet toekomt;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.h
    text: |-
      dat als sanctie op bepaalde gedragingen van de wederpartij, nalaten daaronder begrepen, verval stelt van haar
      toekomende rechten of van de bevoegdheid bepaalde verweren te voeren, behoudens voor zover deze gedragingen het
      verval van die rechten of verweren rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.i
    text: |-
      dat voor het geval de overeenkomst wordt beëindigd anders dan op grond van het feit dat de wederpartij in de
      nakoming van haar verbintenis is tekortgeschoten, de wederpartij verplicht een geldsom te betalen, behoudens voor
      zover het betreft een redelijke vergoeding voor door de gebruiker geleden verlies of gederfde winst;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.j
    text: |-
      dat de wederpartij verplicht tot het sluiten van een overeenkomst met de gebruiker of met een derde, tenzij dit,
      mede gelet op het verband van die overeenkomst met de in dit artikel bedoelde overeenkomst, redelijkerwijs van de
      wederpartij kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.k
    text: |-
      dat voor een overeenkomst als bedoeld in [artikel 236, onderdeel j][ref1], een duur bepaalt van meer dan een jaar,
      tenzij de wederpartij de bevoegdheid heeft de overeenkomst telkens na een jaar op te zeggen;


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel236
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '236'
        afdeling: '3'
  - number: 237.l
    text: |-
      dat de wederpartij aan een opzegtermijn bindt die langer is dan drie maanden of langer dan de termijn waarop de
      gebruiker de overeenkomst kan opzeggen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.m
    text: |-
      dat voor de geldigheid van een door de wederpartij te verrichten verklaring een strengere vorm dan het vereiste van
      een onderhandse akte stelt;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: 237.n
    text: |-
      dat bepaalt dat een door de wederpartij verleende volmacht onherroepelijk is of niet eindigt door haar dood of
      ondercuratelestelling, tenzij de volmacht strekt tot levering van een registergoed.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel237
  - number: '238'
    text: |-
      Bij een overeenkomst als bedoeld in de [artikelen 236][ref1] en [237][ref2], kan jegens de wederpartij geen beroep
      worden gedaan op het feit dat:


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel237
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '236'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '237'
        afdeling: '3'
  - number: 238.a
    text: |-
      de overeenkomst in naam van een derde is gesloten, indien dit beroep berust op het enkele feit dat een beding van
      deze strekking in de algemene voorwaarden voorkomt;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel238
  - number: 238.b
    text: |-
      de algemene voorwaarden beperkingen bevatten van de bevoegdheid van een gevolmachtigde van de gebruiker die zo
      ongebruikelijk zijn dat de wederpartij ze zonder het beding niet behoefde te verwachten, tenzij zij ze kende.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel238
  - number: '240.1'
    text: |-
      Een rechtspersoon als bedoeld in het tweede lid, is bevoegd om tegen een gebruiker een vordering in te
      stellen, strekkende tot het onredelijk bezwarend verklaren van een beding in diens algemene voorwaarden; de
      [artikelen 233, onderdeel a][ref1], [236][ref2] en [237][ref3] zijn van overeenkomstige toepassing. Voor de
      toepassing van de vorige zin wordt een beding dat in strijd is met een dwingende wetsbepaling, als onredelijk
      bezwarend aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel233
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel236
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel237
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '233'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '236'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '237'
        afdeling: '3'
  - number: '240.2'
    text: |-
      De vordering komt toe aan rechtspersonen die ten doel hebben de behartiging van belangen van eindgebruikers van
      niet voor een beroep of bedrijf bestemde goederen. Zij kan slechts betrekking hebben op algemene voorwaarden
      die worden gebruikt of bestemd zijn te worden gebruikt in overeenkomsten met personen wier belangen door de
      rechtspersoon worden behartigd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel240
  - number: '240.3'
    text: |-
      De eiser is niet ontvankelijk indien niet blijkt dat hij, alvorens de vordering in te stellen, de gebruiker de
      gelegenheid heeft geboden om in onderling overleg de algemene voorwaarden zodanig te wijzigen dat de bezwaren
      die de grond voor de vordering zouden opleveren, zijn weggenomen. Een termijn van zes maanden na schriftelijke
      kennisgeving van de bezwaren is daartoe in elk geval voldoende.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel240
  - number: '240.4'
    text: |-
      Voor zover een rechtspersoon met het gebruik van bedingen in algemene voorwaarden heeft ingestemd, komt hem geen
      vordering als bedoeld in het eerste lid, toe.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel240
  - number: '241.1'
    text: |-
      Het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba is
      bij uitsluiting bevoegd tot kennisneming van vorderingen als bedoeld in [artikel 240][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel240
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '240'
        afdeling: '3'
  - number: '241.2'
    text: |-
      De in [artikel 240, tweede lid][ref1], bedoelde rechtspersonen hebben de bevoegdheden, geregeld
      in de [artikelen 214][ref2] en [287 van het Wetboek van Burgerlijke Rechtsvordering BES][ref3];
      [artikel 290 van dat wetboek][ref4] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0028496#Artikel214
      [ref3]: https://wetten.overheid.nl/BWBR0028496#Artikel287
      [ref4]: https://wetten.overheid.nl/BWBR0028496#Artikel290
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '240'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028496
        artikel: '214'
      - id: ref3
        bwb_id: BWBR0028496
        artikel: '287'
      - id: ref4
        bwb_id: BWBR0028496
        artikel: '290'
  - number: '241.3'
    text: 'Op vordering van de eiser kan aan de uitspraak worden verbonden:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel241
  - number: 241.3.a
    text: een verbod van het gebruik van de door de uitspraak getroffen bedingen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel241
  - number: 241.3.b
    text: |-
      een veroordeling tot het openbaar maken of laten openbaar maken van de uitspraak, zulks op door de rechter te
      bepalen wijze en op kosten van de door de rechter aan te geven partij of partijen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel241
  - number: '241.4'
    text: |-
      De rechter kan in zijn uitspraak aangeven op welke wijze het onredelijk bezwarend karakter van de bedingen waarop
      de uitspraak betrekking heeft, kan worden weggenomen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel241
  - number: '241.5'
    text: |-
      Geschillen ter zake van de tenuitvoerlegging van de in het derde lid bedoelde veroordelingen, alsmede van de
      veroordeling tot betaling van een dwangsom, zo deze is opgelegd, worden bij uitsluiting door het Hof beslist.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel241
  - number: '242.1'
    text: |-
      Op vordering van een gebruiker tegen wie de in [artikel 240, eerste lid][ref1], bedoelde uitspraak is gedaan, kan
      de rechter die uitspraak wijzigen of opheffen op grond dat zij ten gevolge van een wijziging in de omstandigheden
      niet langer gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel240
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '240'
        afdeling: '3'
  - number: '242.2'
    text: |-
      De vordering wordt gericht tegen de rechtspersoon op wiens vordering de uitspraak was gedaan. Indien echter
      deze rechtspersoon is ontbonden, worden de in het verzoekschrift genoemde andere rechtspersonen als bedoeld in
      [artikel 240, tweede lid][ref1], opgeroepen om over het verzoek als belanghebbenden te worden gehoord; de rechter
      kan ook zulke rechtspersonen doen oproepen die niet in het verzoekschrift worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel240
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '240'
        afdeling: '3'
  - number: '242.3'
    text: |-
      [Artikel 241, eerste en tweede lid, derde lid, onderdeel b, en vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel241
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '241'
        afdeling: '3'
  - number: '242.4'
    text: |-
      Het eerste tot en met derde lid is niet van toepassing voor zover de uitspraak betrekking had op een beding dat
      door de wet als onredelijk bezwarend wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel242
  - number: '243'
    text: |-
      Een beding in algemene voorwaarden dat door degene jegens wie een verbod tot gebruik ervan is uitgesproken,
      in strijd met het verbod in een overeenkomst wordt opgenomen, is vernietigbaar. [Artikel 235][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel235
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '235'
        afdeling: '3'
  - number: '244.1'
    text: |-
      Een persoon die handelt in de uitoefening van een beroep of bedrijf, kan geen beroep doen op een beding in een
      overeenkomst met een partij die ter zake van de goederen of diensten waarop die overeenkomst betrekking heeft, met
      gebruikmaking van algemene voorwaarden overeenkomsten met haar afnemers heeft gesloten, voor zover een beroep op
      dat beding onredelijk zou zijn wegens zijn nauwe samenhang met een in de algemene voorwaarden voorkomend beding
      dat krachtens deze afdeling is vernietigd of door een uitspraak als bedoeld in [artikel 240, eerste lid][ref1],
      is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel240
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '240'
        afdeling: '3'
  - number: '244.2'
    text: |-
      Is tegen een gebruiker een vordering als bedoeld in [artikel 240, eerste lid][ref1], ingesteld, dan is hij bevoegd
      die persoon in het geding te roepen, ten einde voor recht te horen verklaren dat het beroep onredelijk zou zijn.
      [Artikel 241, tweede lid, derde lid, onderdeel b, vierde en vijfde lid][ref2], alsmede de [artikelen 71][ref3],
      [72][ref4] en [76 van het Wetboek van Burgerlijke Rechtsvordering BES][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0028496#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0028496#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0028496#Artikel76
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '240'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '241'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0028496
        artikel: '71'
      - id: ref4
        bwb_id: BWBR0028496
        artikel: '72'
      - id: ref5
        bwb_id: BWBR0028496
        artikel: '76'
  - number: '244.3'
    text: |-
      Op de uitspraak is [artikel 242][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel242
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '242'
        afdeling: '3'
  - number: '244.4'
    text: |-
      Op eerdere overeenkomsten met betrekking tot de voormelde goederen en diensten is het eerste tot en met derde lid
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel244
  - number: '245'
    text: Deze afdeling is noch van toepassing op arbeidsovereenkomsten, noch op collectieve arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel245
  - number: '246'
    text: |-
      Van de [artikelen 231 tot en met 244][ref1] kan niet worden afgeweken. De bevoegdheid om een beding krachtens deze
      afdeling door een buitengerechtelijke verklaring te vernietigen, kan niet worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel231
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel246
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '231'
        afdeling: '3'
  - number: '247.1'
    text: |-
      Op overeenkomsten tussen partijen die handelen in de uitoefening van een beroep of bedrijf en die beide in de
      openbare lichamen Bonaire, Sint Eustatius en Saba gevestigd zijn, is deze afdeling van toepassing, ongeacht het
      recht dat de overeenkomst beheerst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel247
  - number: '247.2'
    text: |-
      Op overeenkomsten tussen partijen die handelen in de uitoefening van een beroep of bedrijf en die niet beide in de
      openbare lichamen Bonaire, Sint Eustatius en Saba gevestigd zijn, is deze afdeling niet van toepassing, ongeacht
      het recht dat de overeenkomst beheerst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel247
  - number: '247.3'
    text: |-
      Een partij is in de zin van het eerste en tweede lid in de openbare lichamen Bonaire, Sint Eustatius en Saba
      gevestigd, indien haar hoofdvestiging of, zo de prestatie volgens de overeenkomst door een andere vestiging dan de
      hoofdvestiging moet worden verricht, deze andere vestiging zich in de openbare lichamen Bonaire, Sint Eustatius en
      Saba bevindt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel247
  - number: '247.4'
    text: |-
      Op overeenkomsten tussen een gebruiker en een wederpartij, natuurlijk persoon, die niet handelt in de uitoefening
      van een beroep of bedrijf, is, indien de wederpartij haar gewone verblijfplaats in de openbare lichamen Bonaire,
      Sint Eustatius en Saba heeft, deze afdeling van toepassing, ongeacht het recht dat de overeenkomst beheerst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel247
  - number: '248.1'
    text: |-
      Een overeenkomst heeft niet alleen de door partijen overeengekomen rechtsgevolgen, maar ook die welke, naar de aard
      van de overeenkomst, uit de wet, de gewoonte of de eisen van redelijkheid en billijkheid voortvloeien.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel248
  - number: '248.2'
    text: |-
      Een tussen partijen als gevolg van de overeenkomst geldende regel is niet van toepassing, voor zover dit in de
      gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel248
  - number: '249'
    text: |-
      De rechtsgevolgen van een overeenkomst gelden mede voor de rechtverkrijgenden onder algemene titel, tenzij uit de
      overeenkomst iets anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel249
  - number: '250'
    text: |-
      Bij overeenkomst kan worden afgeweken van de volgende artikelen van deze afdeling, met uitzondering van de
      [artikelen 251, derde lid][ref1], [252, tweede lid][ref2], voor zover het de eis van een notariële akte betreft, en
      derde lid, [253, eerste lid][ref3], [257][ref4], [258][ref5], [259][ref6] en [260][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel253
      [ref4]: https://wetten.overheid.nl/BWBR0028749#Artikel257
      [ref5]: https://wetten.overheid.nl/BWBR0028749#Artikel258
      [ref6]: https://wetten.overheid.nl/BWBR0028749#Artikel259
      [ref7]: https://wetten.overheid.nl/BWBR0028749#Artikel260
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '251'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '252'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '253'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0028749
        artikel: '257'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0028749
        artikel: '258'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0028749
        artikel: '259'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0028749
        artikel: '260'
        afdeling: '4'
  - number: '251.1'
    text: |-
      Staat een uit een overeenkomst voortvloeiend, voor overgang vatbaar recht in een zodanig verband met een aan de
      schuldeiser toebehorend goed, dat hij bij dat recht slechts belang heeft zolang hij het goed behoudt, dan gaat dat
      recht over op degene die dat goed onder bijzondere titel verkrijgt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel251
  - number: '251.2'
    text: |-
      Is voor het recht een tegenprestatie overeengekomen, dan gaat de verplichting tot het verrichten van die
      tegenprestatie mee over voor zover deze betrekking heeft op de periode na de overgang. De vervreemder blijft
      naast de verkrijger jegens de wederpartij aansprakelijk, behoudens voor zover deze zich na de overgang in geval
      van uitblijven van de tegenprestatie van haar verbintenis kan bevrijden door ontbinding of beëindiging van de
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel251
  - number: '251.3'
    text: |-
      Het eerste en het tweede lid gelden niet, indien de verkrijger van het goed tot de wederpartij bij de overeenkomst
      een verklaring richt dat hij de overgang van het recht niet aanvaardt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel251
  - number: '251.4'
    text: Uit de rechtshandeling waarbij het goed wordt overgedragen, kan voortvloeien dat geen overgang plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel251
  - number: '252.1'
    text: |-
      Bij een overeenkomst kan worden bedongen dat de verplichting van een der partijen om iets te dulden of niet te
      doen ten aanzien van een haar toebehorend registergoed, zal overgaan op degenen die het goed onder bijzondere titel
      zullen verkrijgen, en dat mede gebonden zullen zijn degenen die van de rechthebbende een recht tot gebruik van het
      goed zullen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: '252.2'
    text: |-
      Voor de werking van het beding is vereist dat van de overeenkomst tussen partijen een notariële akte wordt
      opgemaakt, gevolgd door inschrijving daarvan in de openbare registers. Degene jegens wie de verplichting bestaat
      waarop het beding betrekking heeft, moet in de akte ter zake van de inschrijving in het openbaar lichaam Bonaire,
      Sint Eustatius of Saba woonplaats kiezen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: '252.3'
    text: 'Ook na inschrijving heeft het beding geen werking jegens:'
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: 252.3.a
    text: |-
      degenen die vóór de inschrijving onder bijzondere titel een recht op het goed of tot gebruik van het goed hebben
      verkregen;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: 252.3.b
    text: |-
      een beslaglegger op het goed of een recht daarop, indien de inschrijving op het tijdstip van de inschrijving van
      het proces-verbaal van inbeslagneming nog niet had plaats gevonden;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: 252.3.c
    text: |-
      degenen die hun recht hebben verkregen van iemand die ingevolge de onderdelen a of b niet aan de bedongen
      verplichting gebonden was.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: '252.4'
    text: |-
      Is voor de verplichting een tegenprestatie overeengekomen, dan gaat bij de overgang van de verplichting het recht
      op de tegenprestatie mee over, voor zover deze betrekking heeft op de periode na de overgang en ook het beding
      omtrent deze tegenprestatie in de registers ingeschreven is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: '252.5'
    text: |-
      Het eerste tot en met vierde lid is niet van toepassing op verplichtingen die een rechthebbende beperken in zijn
      bevoegdheid het goed te vervreemden of te bezwaren.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel252
  - number: '253.1'
    text: |-
      Een overeenkomst schept voor een derde het recht een prestatie van een der partijen te vorderen of op andere wijze
      jegens een van hen een beroep op de overeenkomst te doen, indien de overeenkomst een beding van die strekking
      inhoudt en de derde dit beding aanvaardt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel253
  - number: '253.2'
    text: Tot de aanvaarding kan het beding door degene die het heeft gemaakt, worden herroepen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel253
  - number: '253.3'
    text: |-
      Een aanvaarding of herroeping van het beding geschiedt door een verklaring, gericht tot een van de beide andere
      betrokkenen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel253
  - number: '253.4'
    text: |-
      Is het beding onherroepelijk en jegens de derde om niet gemaakt, dan geldt het als aanvaard, indien het ter kennis
      van de derde is gekomen en door deze niet onverwijld is afgewezen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel253
  - number: '254.1'
    text: Nadat de derde het beding heeft aanvaard, geldt hij als partij bij de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel254
  - number: '254.2'
    text: |-
      Hij kan, indien dit met de strekking van het beding in overeenstemming is, daaraan ook rechten ontlenen over de
      periode vóór de aanvaarding.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel254
  - number: '255.1'
    text: |-
      Heeft een beding ten behoeve van een derde ten opzichte van die derde geen gevolg, dan kan degene die het beding
      heeft gemaakt, hetzij zichzelf, hetzij een andere derde als rechthebbende aanwijzen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel255
  - number: '255.2'
    text: |-
      Hij wordt geacht zichzelf als rechthebbende te hebben aangewezen, wanneer hem door degene van wie de prestatie
      is bedongen, een redelijke termijn voor de aanwijzing is gesteld en hij binnen deze termijn geen aanwijzing heeft
      uitgebracht.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel255
  - number: '256'
    text: |-
      De partij die een beding ten behoeve van een derde heeft gemaakt, kan nakoming jegens de derde vorderen, tenzij
      deze zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel256
  - number: '257'
    text: |-
      Kan een partij bij een overeenkomst ter afwering van haar aansprakelijkheid voor een gedraging van een aan
      haar ondergeschikte aan de overeenkomst een verweermiddel jegens haar wederpartij ontlenen, dan kan ook de
      ondergeschikte, indien hij op grond van deze gedraging door de wederpartij wordt aangesproken, dit verweermiddel
      inroepen, als ware hijzelf bij de overeenkomst partij.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel257
  - number: '258.1'
    text: |-
      De rechter kan op verlangen van een der partijen de gevolgen van een overeenkomst wijzigen of deze geheel of
      gedeeltelijk ontbinden op grond van onvoorziene omstandigheden die van dien aard zijn dat de wederpartij naar
      maatstaven van redelijkheid en billijkheid ongewijzigde instandhouding van de overeenkomst niet mag verwachten. Aan
      de wijziging of ontbinding kan terugwerkende kracht worden verleend.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel258
  - number: '258.2'
    text: |-
      Een wijziging of ontbinding wordt niet uitgesproken, voor zover de omstandigheden krachtens de aard van de
      overeenkomst of de in het verkeer geldende opvattingen voor rekening komen van degene die zich erop beroept.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel258
  - number: '258.3'
    text: |-
      Voor de toepassing van dit artikel staat degene op wie een recht of een verplichting uit een overeenkomst is
      overgegaan, met een partij bij die overeenkomst gelijk.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel258
  - number: '259.1'
    text: |-
      Indien een overeenkomst ertoe strekt een rechthebbende op of een gebruiker van een registergoed als zodanig te
      verplichten tot een prestatie die niet bestaat in of gepaard gaat met het dulden van voortdurend houderschap, kan
      de rechter op zijn verlangen de gevolgen van de overeenkomst wijzigen of deze geheel of gedeeltelijk ontbinden,
      indien:
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel259
  - number: 259.1.a
    text: |-
      ten minste tien jaren na het sluiten van de overeenkomst zijn verlopen en het ongewijzigd voortduren van de
      verplichting in strijd is met het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel259
  - number: 259.1.b
    text: |-
      de schuldeiser bij de nakoming van de verplichting geen redelijk belang meer heeft en het niet aannemelijk is dat
      dit belang zal terugkeren.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel259
  - number: '259.2'
    text: |-
      Voor de termijn, vermeld in het eerste lid, onderdeel a, telt mee de gehele periode waarin rechthebbenden op of
      gebruikers van het goed aan een beding van dezelfde strekking gebonden zijn geweest. De termijn geldt niet, voor
      zover de strijd met het algemeen belang hierin bestaat dat het beding een beletsel vormt voor verwerkelijking van
      een geldend ontwikkelingsplan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel259
  - number: '260.1'
    text: |-
      Een wijziging of ontbinding als bedoeld in de [artikelen 258][ref1] en [259][ref2], kan worden uitgesproken onder
      door de rechter te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel259
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '258'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '259'
        afdeling: '4'
  - number: '260.2'
    text: |-
      Indien de rechter op grond van de [artikelen 258][ref1] en [259][ref2] de overeenkomst wijzigt of gedeeltelijk
      ontbindt, kan hij bepalen dat een of meer der partijen de overeenkomst binnen een bij de uitspraak vast te stellen
      termijn door een schriftelijke verklaring geheel zal kunnen ontbinden. De wijziging of gedeeltelijke ontbinding
      treedt niet in, voordat deze termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel259
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '258'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '259'
        afdeling: '4'
  - number: '260.3'
    text: |-
      Is de overeenkomst die op grond van de [artikelen 258][ref1] en [259][ref2] wordt gewijzigd of geheel of
      gedeeltelijk ontbonden, ingeschreven in de openbare registers, dan kan ook de uitspraak waarbij de wijziging
      of ontbinding plaatsvond, daarin worden ingeschreven, mits deze uitspraak in kracht van gewijsde is gegaan of
      uitvoerbaar bij voorraad is.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel259
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '258'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '259'
        afdeling: '4'
  - number: '260.4'
    text: |-
      Wordt iemand te dier zake opgeroepen aan zijn overeenkomstig [artikel 252, tweede lid, eerste zin][ref1],
      gekozen woonplaats, dan zijn daarmee tevens opgeroepen al zijn rechtverkrijgenden die geen nieuwe inschrijving
      hebben genomen. [Artikel 29, tweede lid, en derde lid, tweede tot en met vierde zin, van Boek 3][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel29
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '252'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '29'
  - number: '260.5'
    text: |-
      Andere rechtsfeiten die een ingeschreven overeenkomst wijzigen of beëindigen, zijn eveneens inschrijfbaar, voor
      zover het rechterlijke uitspraken betreft, mits zij in kracht van gewijsde zijn gegaan of uitvoerbaar bij voorraad
      zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel260
  - number: '261.1'
    text: |-
      Een overeenkomst is wederkerig, indien elk van beide partijen een verbintenis op zich neemt ter verkrijging van de
      prestatie waartoe de wederpartij zich daartegenover jegens haar verbindt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel261
  - number: '261.2'
    text: |-
      De bepalingen omtrent wederkerige overeenkomsten zijn van overeenkomstige toepassing op andere rechtsbetrekkingen
      die strekken tot het wederzijds verrichten van prestaties, voor zover de aard van die rechtsbetrekkingen zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel261
  - number: '262.1'
    text: |-
      Komt een der partijen haar verbintenis niet na, dan is de wederpartij bevoegd de nakoming van haar daartegenover
      staande verplichtingen op te schorten.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel262
  - number: '262.2'
    text: |-
      In geval van gedeeltelijke of niet behoorlijke nakoming is opschorting slechts toegelaten, voor zover de
      tekortkoming haar rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel262
  - number: '263.1'
    text: |-
      De partij die verplicht is het eerst te presteren, is niettemin bevoegd de nakoming van haar verbintenis op te
      schorten, indien na het sluiten van de overeenkomst te harer kennis gekomen omstandigheden haar goede grond geven
      te vrezen dat de wederpartij haar daartegenover staande verplichtingen niet zal nakomen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel263
  - number: '263.2'
    text: |-
      In geval er goede grond bestaat te vrezen dat slechts gedeeltelijk of niet behoorlijk zal worden nagekomen, is de
      opschorting slechts toegelaten voor zover de tekortkoming haar rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel263
  - number: '264'
    text: |-
      In geval van opschorting op grond van de [artikelen 262][ref1] en [263][ref2] zijn de
      [artikelen 54, onderdelen b en c][ref3], en [55][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel263
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0028749#Artikel55
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '262'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '263'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '54'
        afdeling: '7'
      - id: ref4
        bwb_id: BWBR0028749
        artikel: '55'
        afdeling: '7'
  - number: '265.1'
    text: |-
      Iedere tekortkoming van een partij in de nakoming van een van haar verbintenissen geeft aan de wederpartij de
      bevoegdheid om de overeenkomst geheel of gedeeltelijk te ontbinden, tenzij de tekortkoming, gezien haar bijzondere
      aard of geringe betekenis, deze ontbinding met haar gevolgen niet rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel265
  - number: '265.2'
    text: |-
      Voor zover nakoming niet blijvend of tijdelijk onmogelijk is, ontstaat de bevoegdheid tot ontbinding pas, wanneer
      de schuldenaar in verzuim is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel265
  - number: '266.1'
    text: |-
      Geen ontbinding kan worden gegrond op een tekortkoming in de nakoming van een verbintenis ten aanzien waarvan de
      schuldeiser zelf in verzuim is.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel266
  - number: '266.2'
    text: |-
      Wordt echter tijdens het verzuim van de schuldeiser behoorlijke nakoming geheel of gedeeltelijk onmogelijk, dan kan
      de overeenkomst ontbonden worden, indien door schuld van de schuldenaar of zijn ondergeschikte is tekortgeschoten
      in de zorg die in de gegeven omstandigheden van hem mocht worden gevergd.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel266
  - number: '267.1'
    text: De ontbinding vindt plaats door een schriftelijke verklaring van de daartoe gerechtigde.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel267
  - number: '267.2'
    text: Zij kan ook op zijn vordering door de rechter worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel267
  - number: '268'
    text: |-
      De bevoegdheid tot buitengerechtelijke ontbinding vervalt door verjaring van de rechtsvordering tot ontbinding.
      De verjaring staat niet in de weg aan gerechtelijke of buitengerechtelijke ontbinding ter afwering van een op de
      overeenkomst steunende rechtsvordering of andere rechtsmaatregel.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel268
  - number: '269'
    text: |-
      De ontbinding heeft geen terugwerkende kracht, behoudens dat een aanbod tot nakoming, gedaan nadat de ontbinding is
      gevorderd, geen werking heeft indien de ontbinding wordt uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel269
  - number: '270'
    text: |-
      Een gedeeltelijke ontbinding houdt een evenredige vermindering in van de wederzijdse prestaties in hoeveelheid
      of hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel270
  - number: '271'
    text: |-
      Een ontbinding bevrijdt de partijen van de daardoor getroffen verbintenissen. Voor zover deze reeds zijn nagekomen,
      blijft de rechtsgrond voor deze nakoming in stand, maar ontstaat voor partijen een verbintenis tot ongedaanmaking
      van de reeds door hen ontvangen prestaties.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel271
  - number: '272.1'
    text: |-
      Sluit de aard van de prestatie uit dat zij ongedaan wordt gemaakt, dan treedt daarvoor een vergoeding in de plaats
      ten belope van haar waarde op het tijdstip van de ontvangst.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel272
  - number: '272.2'
    text: |-
      Heeft de prestatie niet aan de verbintenis beantwoord, dan wordt deze vergoeding beperkt tot het bedrag van de
      waarde die de prestatie voor de ontvanger op dit tijdstip in de gegeven omstandigheden werkelijk heeft gehad.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel272
  - number: '273'
    text: |-
      Een partij die een prestatie heeft ontvangen, is vanaf het tijdstip dat zij redelijkerwijs met een ontbinding
      rekening moet houden, verplicht er als een zorgvuldig schuldenaar zorg voor te dragen dat de ingevolge
      die ontbinding verschuldigde ongedaanmaking van de prestatie mogelijk zal zijn. [Artikel 78][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel78
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '78'
        paragraaf: '1'
        afdeling: '9'
  - number: '274'
    text: |-
      Heeft een partij in weerwil van een dreigende ontbinding te kwader trouw een prestatie ontvangen, dan wordt zij na
      de ontbinding geacht vanaf de ontvangst van de prestatie in verzuim geweest te zijn.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel274
  - number: '275'
    text: |-
      De [artikelen 120 tot en met 124 van Boek 3][ref1] zijn van overeenkomstige toepassing met betrekking tot hetgeen
      daarin is bepaald omtrent de afgifte van vruchten en de vergoeding van kosten en schade.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel120
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '120'
  - number: '276'
    text: |-
      Op de onbekwame die een prestatie heeft ontvangen, rusten de in deze afdeling omschreven verplichtingen
      slechts, voor zover het ontvangene hem tot werkelijk voordeel heeft gestrekt of in de macht van zijn wettelijke
      vertegenwoordiger is gekomen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel276
  - number: '277.1'
    text: |-
      Wordt een overeenkomst geheel of gedeeltelijk ontbonden, dan is de partij wier tekortkoming een grond voor
      ontbinding heeft opgeleverd, verplicht haar wederpartij de schade te vergoeden die deze lijdt doordat geen
      wederzijdse nakoming, doch ontbinding van de overeenkomst plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel277
  - number: '277.2'
    text: |-
      Indien de tekortkoming niet aan de schuldenaar kan worden toegerekend, is het eerste lid slechts van toepassing
      binnen de grenzen van [artikel 78][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel78
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '78'
        paragraaf: '1'
        afdeling: '9'
  - number: '278.1'
    text: |-
      De partij die ontbinding kiest van een reeds uitgevoerde overeenkomst, nadat de verhouding in waarde tussen hetgeen
      wederzijds bij ongedaanmaking zou moeten worden verricht, zich ten gunste van haar heeft gewijzigd, is verplicht
      door bijbetaling de oorspronkelijke waardeverhouding te herstellen, indien aannemelijk is dat zij zonder deze
      wijziging geen ontbinding zou hebben gekozen.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel278
  - number: '278.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval de partij ten gunste van wie de wijziging is ingetreden,
      op andere grond dan ontbinding de stoot tot ongedaanmaking geeft en aannemelijk is dat zij daartoe zonder deze
      wijziging niet zou zijn overgegaan.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel278
  - number: '279.1'
    text: |-
      Op overeenkomsten waaruit tussen meer dan twee partijen verbintenissen voortvloeien, vinden de bepalingen
      betreffende wederkerige overeenkomsten met inachtneming van het tweede en het derde lid overeenkomstige toepassing,
      voor zover de aard van de overeenkomst zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel279
  - number: '279.2'
    text: |-
      De partij die een verbintenis op zich heeft genomen ter verkrijging van een daartegenover van een of meer der
      andere partijen bedongen prestatie, kan haar recht op ontbinding gronden op een tekortkoming in de nakoming van de
      verbintenis jegens haarzelf.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel279
  - number: '279.3'
    text: |-
      Schiet een partij met samenhangende rechten en verplichtingen zelf tekort in de nakoming van haar verbintenis, dan
      kunnen in ieder geval de overige partijen gezamenlijk de overeenkomst ontbinden.
    url: https://wetten.overheid.nl/BWBR0028749/2010-10-10#Artikel279
