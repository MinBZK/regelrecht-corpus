preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Volksgezondheid, Welzijn en Sport;

    Gelet op Richtlijn nr. 78/52/EEG van de Raad van de Europese Gemeenschappen van 13 december 1977 tot vaststelling
    van de communautaire criteria voor de nationale programma’s voor de versnelde uitroeiing van brucellose,
    tuberculose en endemische leukose bij runderen (PbEG 1978, L 15), Richtlijn nr. 80/217/EEG van de Raad van de
    Europese Gemeenschappen van 22 januari 1980 tot vaststelling van gemeenschappelijke maatregelen ter bestrijding
    van klassieke varkenspest (PbEG L 47), Richtlijn nr. 82/894/EEG van de Raad van de Europese Gemeenschappen van
    21 december 1982 inzake de melding van dierziekten in de Gemeenschap (PbEG L 378), Richtlijn nr. 85/511/EEG van
    de Raad van de Europese Gemeenschappen van 18 november 1985 tot vaststelling van gemeenschappelijke maatregelen
    ter bestrijding van mond- en klauwzeer (PbEG L 315), Beschikking nr. 90/424/EEG van de Raad van de Europese
    Gemeenschappen van 26 juni 1990 betreffende bepaalde uitgaven op veterinair gebied (PbEG L 224), Richtlijn nr.
    90/426/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van veterinairrechtelijke
    voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde landen (PbEG L 224),
    Richtlijn nr. 91/68/EEG van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
    voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46), Richtlijn nr. 92/35/
    EEG van de Raad van de Europese Gemeenschappen van 29 april 1992 tot vaststelling van controlevoorschriften en
    van maatregelen ter bestrijding van paardepest (PbEG L 157), Richtlijn nr. 92/40/EEG van de Raad van de Europese
    Gemeenschappen van 19 mei 1992 tot vaststelling van communautaire maatregelen voor de bestrijding van aviaire
    influenza (PbEG L 167), Richtlijn nr. 92/66/EEG van de Raad van de Europese Gemeenschappen van 14 juli 1992
    tot vaststelling van communautaire maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L 260),
    Richtlijn nr. 92/117/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 inzake maatregelen voor
    de bescherming tegen bepaalde zoönoses en bepaalde zoönoseverwekkers bij dieren en in produkten van dierlijke
    oorsprong ten einde door voedsel overgedragen infecties en vergiftigingen te voorkomen (PbEG 1993, L 62),
    Richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van specifieke maatregelen ten
    aanzien van vesiculaire varkensziekte (PbEG 1993, L 62) en Richtlijn nr. 93/53/EEG van de Raad van de Europese
    Gemeenschappen van 24 juni 1993 tot vaststelling van minimale communautaire maatregelen voor de bestrijding van
    bepaalde visziekten (PbEG L 175);

    Gelet op de artikelen 15, 100 en 107 van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden, het Landbouwschap, het Produktschap voor Pluimvee en
    Eieren, het Produktschap Vee en Vlees, het Produktschap voor Vis en Visprodukten, het Bedrijfschap voor de Handel
    in Vee en het Bedrijfschap voor de Pluimveehandel en -industrie;

    Besluit:
