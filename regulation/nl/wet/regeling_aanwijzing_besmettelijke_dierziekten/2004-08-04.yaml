articles:
  - number: '1'
    text: |-
      1

      In deze regeling wordt verstaan onder wet: [Gezondheids- en welzijnswet voor dieren][ref1].

      2 Voor de toepassing van [artikel 10b][ref2] wordt onder abortus verstaan: het spontaan meer dan 21 dagen eerder
      dan de gemiddelde draagtijd van het desbetreffende runderras ter wereld brengen van een vrucht of vruchten door een
      rund, ingeval de dracht meer dan 100 dagen heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0007933#Artikel10b
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
      - id: ref2
        bwb_id: BWBR0007933
        artikel: 10b
  - number: '2'
    text: |-
      Als besmettelijke dierziekten als bedoeld in artikel 15 van de wet worden bij vee aangewezen:

        - runderpest;
        - mond- en klauwzeer;
        - klassieke varkenspest;
        - Afrikaanse varkenspest;
        - rabies;
        - dourine;
        - kwade droes;
        - virale paardenencefalomyelitiden;
        - infectieuze anemie;
        - miltvuur;
        - Afrikaanse paardepest;
        - vesiculaire stomatitis;
        - trichinellose;
        - brucellose;
        - endemische leukose bij runderen;
        - tuberculose ten gevolge van M. bovis;
        - tuberculose ten gevolge van M. tuberculosis;
        - bovine spongiforme encefalopathie, scrapie en andere overdraagbare spongiforme encefalopathieën (TSE’s);
        - besmettelijke bovine pleuropneumonie;
        - Teschener-ziekte (besmettelijke varkensverlamming);
        - vesiculaire varkensziekte;
        - ziekte van Aujeszky;
        - blue tongue;
        - pest van de kleine herkauwer;
        - Rift Valley koorts;
        - schape- en geitepokken;
        - nodulaire dermatose (lumpy skin disease) en
        - enzoötische hemorraghische ziekte bij herten.
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel2
  - number: '3'
    text: |-
      Als besmettelijke dierziekten als bedoeld in artikel 15 van de wet worden bij pluimvee aangewezen:

      a. vogelpest (aviaire influenza) en

      b. pseudo-vogelpest (Newcastle disease).
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel3
  - number: '4'
    text: |-
      Als besmettelijke dierziekte als bedoeld in [artikel 15 van de wet][ref1] wordt bij bijen aangewezen:

      a. Amerikaans vuilbroed;

      b. kleine bijenkastkever (Aethina tumida) en

      c. Tropilaelapsmijt (Tropilaelaps spp).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
  - number: '5'
    text: |-
      Als besmettelijke dierziekten als bedoeld in artikel 15 van de wet worden bij nertsen aangewezen:

      a. rabies;

      b. ziekte van Aujeszky;

      c. overdraagbare spongiforme encefalopathieën (TSE’s);

      d. brucellose;

      e. tuberculose en;

      f. miltvuur.
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel5
  - number: '6'
    text: |-
      Als besmettelijke dierziekten als bedoeld in [artikel 15 van de wet][ref1] worden bij zoogdieren niet zijnde vee en
      nertsen aangewezen:

      a. rabies;

      b. mond- en klauwzeer;

      c. vesiculaire stomatitis;

      d. ziekte van Aujeszky;

      e. overdraagbare spongiforme encefalopathieën (TSE’s);

      f. brucellose;

      g. tuberculose;

      h. hemorragische koortsen, Ebola en Marburg, veroorzaakt door virussen van de familie Filoviridae;

      i. simian immunodeficiency virusinfecties;

      j. tularaemie;

      k. miltvuur en

      l. apenpokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
  - number: '7'
    text: |-
      Als besmettelijke dierziekten als bedoeld in artikel 15 van de wet worden bij andere vogels dan pluimvee
      aangewezen:

      a. psittacose;

      b. pseudo-vogelpest (Newcastle disease) en

      c. vogelpest (aviaire influenza).
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel7
  - number: '8'
    text: |-
      Als besmettelijke dierziekten als bedoeld in artikel 15 van de wet worden bij beenvissen aangewezen:

      a. infectieuze zalmanemie;

      b. infectieuze hematopoïetische necrose en

      c. virale hemorragische septikemie.
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel8
  - number: 8a
    text: |-
      Als besmettelijke dierziekten als bedoeld in [artikel 15 van de wet][ref1] worden bij tweekleppigen aangewezen:

      a. bonamiosis veroorzaakt door Bonamia ostreae, Bonamia exitiosus of Mikrocytos roughleyi;

      b. marteiliosis veroorzaakt door Marteilia refringens of door Marteilia sidneyi;

      c. haplosporidiosis veroorzaakt door Haplosporidium nelsoni of door Haplosporidium costale;

      d. perkinosis veroorzaakt door Perkinsus marinus, Perkinsus olseni of Perkinsus atlanticus;

      e. microcytosis veroorzaakt door Mikrocytos mackini;

      f. verwelkingssyndroom bij zeeoren veroorzaakt door Candidatus Xenohaliotis californiensis.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
  - number: '9'
    text: |-
      Als besmettelijke dierziekten als bedoeld in artikel 100 van de wet worden aangewezen:

      a. salmonellose;

      b. campylobacteriose;

      c. listeriose;

      d. toxoplasmose;

      e. echinococcose;

      f. yersiniose;

      g. leptospirose ten gevolge van Leptospira hardjo en

      h. zwoegerziekte.
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel9
  - number: '10'
    text: |-
      1 Aan de houder van een dier wordt vrijstelling verleend van de kennisgeving van het feit dat dat dier
      verschijnselen vertoont van ziekte van Aujeszky, bedoeld in artikel 19 van de wet, indien wordt voldaan aan het
      tweede en derde lid.

      2 Indien een dier verschijnselen van de ziekte van Aujeszky vertoont of indien de sterfte van varkens op een
      bedrijf bepaalde waarden overschrijdt zoals omschreven in [bijlage I][ref1], stuurt de houder verdacht materiaal
      naar de regionale gezondheidsdienst voor dieren.

      3 Indien de verdenking van een klinische uitbraak als bedoeld in het tweede lid wordt bevestigd door de regionale
      gezondheidsdienst voor dieren met een daartoe geëigende onderzoeksmethode, geeft de houder van het dier kennis van
      de ziekte van Aujeszky aan de ambtenaar bedoeld in artikel 114, tweede lid, van de wet.

      4 De vrijstelling is van overeenkomstige toepassing op de kennisgeving door de dierenarts, bedoeld in artikel
      100 van de wet, van de ziekte van Aujeszky, met dien verstande dat hij van de bevestiging door de regionale
      gezondheidsdienst van dieren tevens kennis geeft aan de ambtenaar bedoeld in artikel 114, tweede lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007933
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007933
  - number: 10a
    text: |-
      1 Een melding als bedoeld in artikel 100 van de wet vindt voor BSE in ieder geval plaats bij runderen ouder dan
      twintig maanden, die gedragsstoornissen of neurologische symptomen vertonen en waarbij de ziekte op grond van een
      reactie op een behandeling of op grond van een laboratoriumonderzoek niet kan worden uitgesloten.

      2 Een melding als bedoeld in artikel 100 van de wet vindt voor scrapie in ieder geval plaats bij schapen en geiten
      ouder dan twaalf maanden, die gedragsstoornissen of neurologische symptomen vertonen en waarbij de ziekte op grond
      van een reactie op een behandeling of op grond van een laboratorium-onderzoek niet kan worden uitgesloten.
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel10a
  - number: 10b
    text: |-
      1 Voor zover een rund abortus vertoont, wordt aan de houder van dit rund vrijstelling verleend van de kennisgeving
      van dit verschijnsel van brucellose, bedoeld in artikel 19 van de wet, indien voldaan wordt aan het tweede en derde
      lid.

      2 Indien een rund abortus vertoont, stuurt de houder binnen 7 dagen na de abortus een door een dierenarts bij dit
      rund genomen bloedmonster aan een door de minister van Landbouw, Natuurbeheer en Visserij aangewezen laboratorium
      ten behoeve van overeenkomstig bijlage C van [richtlijn nr. 64/432/EEG](31964L0432) uit te voeren serologisch
      onderzoek.

      3 Zodra de houder ervan op de hoogte is gesteld dat de abortus blijkens het in het tweede lid bedoelde onderzoek
      vermoedelijk aan brucellose te wijten is, geeft de houder terstond kennis van dit vermoeden aan de ambtenaar,
      bedoeld in artikel 114, tweede lid, van de wet.

      4

      De vrijstelling is van overeenkomstige toepassing op de in artikel 100 van de wet bedoelde kennisgeving van
      brucellose bij een rund door de dierenarts.
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel10b
  - number: 10c
    text: |-
      De termijn, bedoeld in [artikel 3, laatste onderdeel oo, van het Besluit verdachte dieren][ref1] is:

      a. bij TSE’s bij schapen en geiten 20 jaar;

      b. bij bonamiosis veroorzaakt door Bonamia exitiosus of Mikrocytos roughleyi 3 maanden;

      c. bij perkinosis veroorzaakt door Perkinsus atlanticus 3 maanden;

      d. bij het verwelkingssyndroom bij zeeoren veroorzaakt door Candidatus Xenohaliotis californiensis 8 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel3
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '3'
  - number: 10d
    text: |-
      De termijn, bedoeld in [artikel 5, eerste lid, laatste onderdeel mm, van het Besluit verdachte dieren][ref1] is:

      a. bij TSE’s bij schapen en geiten 4 maanden;

      b. bij bonamiosis veroorzaakt door Bonamia exitiosus of Mikrocytos roughleyi 3 maanden;

      c. bij perkinosis veroorzaakt door Perkinsus atlanticus 3 maanden;

      d. bij het verwelkingssyndroom bij zeeoren veroorzaakt door Candidatus Xenohaliotis californiensis 8 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel5
    url: https://wetten.overheid.nl/BWBR0007933/2004-08-04#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0006829
        artikel: '5'
  - number: 10e
    text: |-
      Deze regeling berust mede op [verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement en de Raad van
      de Europese Unie van 22 mei 2001 (PbEG L147) houdende vaststelling van voorschriften inzake preventie, bestrijding
      en uitroeiing van bepaalde overdraagbare spongiforme encefalopatieën, [richtlijn nr. 95/70/EG](31995L0070)
      van de Raad van de Europese Unie van 22 december 1995 tot vaststelling van minimale communautaire maatregelen
      ter bestrijding van bepaalde ziekten van tweekleppige weekdieren (PbEG L 332) en de [artikelen 3][ref1] en
      [5 van het Besluit verdachte dieren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006829#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006829#Artikel5
