---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_arbeid_vreemdelingen
regulatory_layer: WET
publication_date: '2021-10-27'
valid_from: '2013-01-01'
bwb_id: BWBR0007149
url: https://wetten.overheid.nl/BWBR0007149/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen met betrekking tot de
    tewerkstelling van vreemdelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
  - number: 1.b
    text: 'werkgever:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
  - number: 1.b.1°
    text: degene die in de uitoefening van een ambt, beroep of bedrijf een ander arbeid laat verrichten;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
  - number: 1.b.2°
    text: de natuurlijke persoon die een ander huishoudelijke of persoonlijke diensten laat verrichten;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
  - number: 1.c
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.d
    text: |-
      niet eerder toegelaten vreemdeling: een vreemdeling die niet eerder over een voor het verrichten van arbeid geldige
      vergunning tot verblijf heeft beschikt, dan wel een vreemdeling die, na over een zodanige vergunning te hebben
      beschikt, zijn hoofdverblijf weer buiten Nederland heeft gevestigd dan wel buiten Nederland heeft voortgezet;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
  - number: 1.e
    text: |-
      tewerkstellingsvergunning: een vergunning als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: 1.f
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.g
    text: |-
      prioriteitgenietend aanbod: aanbod van de zijde van Nederlanders en vreemdelingen als bedoeld in de
      [artikelen 3, eerste lid, onder a][ref1], en [4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '3'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '4'
        paragraaf: II
  - number: '2.1'
    text: |-
      Het is een werkgever verboden een vreemdeling in Nederland arbeid te laten verrichten zonder
      tewerkstellingsvergunning.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing met betrekking tot een vreemdeling ten aanzien van
      wie tevens een ander als werkgever optreedt, indien die ander beschikt over een voor de desbetreffende arbeid
      geldige tewerkstellingsvergunning.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel2
  - number: 2a.1
    text: |-
      Een werkgever die een vreemdeling arbeid in Nederland laat verrichten, ten aanzien waarvan het verbod, bedoeld
      in [artikel 2][ref1], niet geldt, is verplicht dit gegeven schriftelijk te melden ten minste twee werkdagen voor
      aanvang van de werkzaamheden aan een bij ministeriële regeling aan te wijzen instantie, onder overlegging van een
      verklaring en bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: 2a.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet, indien de werkgever reeds uit hoofde van andere, bij
      algemene maatregel van bestuur aan te wijzen, bepalingen een meldingsplicht heeft.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel2a
  - number: 2a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het model van de verklaring en de over te
      leggen bewijsstukken, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel2a
  - number: '3.1'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is niet van toepassing met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: 3.1.a
    text: |-
      een vreemdeling ten aanzien van wie ingevolge bepalingen, vastgesteld bij overeenkomst met andere mogendheden dan
      wel bij een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, een tewerkstellingsvergunning
      niet mag worden verlangd;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel3
  - number: 3.1.b
    text: |-
      een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] voor het verrichten van arbeid als zelfstandige, voor zover deze
      vreemdeling arbeid verricht als zelfstandige;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.1.c
    text: |-
      een vreemdeling die behoort tot een bij algemene maatregel van bestuur aangewezen categorie, dan wel bij een
      algemene maatregel van bestuur aangewezen categorie van werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      Van de bepalingen, bedoeld in het eerste lid, onder *a*, wordt door Onze Minister mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is evenmin van toepassing met betrekking tot een vreemdeling
      die beschikt over een krachtens de [Vreemdelingenwet 2000][ref2] afgegeven vergunning, welke is voorzien van een
      aantekening van Onze Minister van Justitie waaruit blijkt dat aan die vergunning geen beperkingen zijn verbonden
      voor het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0011823
  - number: '4.2'
    text: 'Een zodanige aantekening wordt afgegeven aan een vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel4
  - number: 4.2.a
    text: |-
      die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder b of d, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.2.b
    text: |-
      die gedurende een ononderbroken tijdvak van drie jaar heeft beschikt over een voor het verrichten van arbeid
      geldige verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1] en
      die nadien zijn hoofdverblijf niet buiten Nederland heeft gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 4.2.c
    text: die behoort tot een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel4
  - number: '5.1'
    text: Onze Minister is bevoegd tot het afgeven, verlengen en intrekken van tewerkstellingsvergunningen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister kan de in het eerste lid bedoelde bevoegdheden delegeren aan het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel5
  - number: '6.1'
    text: Een tewerkstellingsvergunning wordt aangevraagd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel6
  - number: '6.2'
    text: Op een aanvraag wordt binnen vijf weken na ontvangst beslist.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel6
  - number: '7'
    text: |-
      De tewerkstellingsvergunning vermeldt de naam en de plaats van vestiging van de werkgever, de persoonsgegevens van
      de vreemdeling, de geldigheidsduur van de tewerkstellingsvergunning, alsmede een omschrijving van de aard en de
      plaats van de door de vreemdeling te verrichten arbeid.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel7
  - number: '8.1'
    text: 'Een tewerkstellingsvergunning wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.1.a
    text: indien voor de desbetreffende arbeidsplaats prioriteitgenietend aanbod op de arbeidsmarkt beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.1.b
    text: |-
      indien het een arbeidsplaats betreft waarvan de beschikbaarheid niet ten minste vijf weken vóór het indienen van de
      aanvraag aan het Uitvoeringsinstituut werknemersverzekeringen is gemeld;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.1.c
    text: 'indien het een vreemdeling betreft:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.1.c.1°
    text: |-
      die niet beschikt over een voor het verrichten van arbeid geldige vergunning tot verblijf, noch een zodanige
      vergunning heeft aangevraagd, noch, voor zover ter verkrijging van een dergelijke vergunning vereist, een
      machtiging tot voorlopig verblijf heeft aangevraagd, dan wel
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.1.c.2°
    text: aan wie een vergunning tot verblijf is geweigerd of wiens vergunning tot verblijf is ingetrokken;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.1.d
    text: |-
      indien het een niet eerder toegelaten vreemdeling betreft, die met de desbetreffende arbeid over
      een periode van een maand niet ten minste een bedrag verdient gelijk aan het minimumloon, bedoeld in
      [artikel 8, onder a, van de Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 8.1.e
    text: |-
      indien het een arbeidsplaats betreft die behoort tot een bij algemene maatregel van bestuur aangewezen categorie
      van werkzaamheden, waarvan het niet in het Nederlands belang is deze door vreemdelingen te laten verrichten.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onder bij of krachtens algemene maatregel van bestuur te stellen voorwaarden is het eerste lid, onder a,
      b en d, niet van toepassing op de vreemdeling die de toegang tot Nederland niet is geweigerd en door wie
      of ten behoeve van wie een asielaanvraag is ingediend en die ten bewijze daarvan door Onze Minister voor
      Immigratie en Asiel in het bezit is gesteld van een daartoe aangewezen document, dan wel houder is van een
      al dan niet voorwaardelijke vergunning tot verblijf en niet beschikt over een aantekening als bedoeld in
      [artikel 4, eerste lid, van de wet][ref1], gelet op de verbetering van de kwaliteit van het verblijf van die
      vreemdeling arbeid mag verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel4
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '4'
  - number: '8.3'
    text: 'In door Onze Minister te bepalen gevallen kan:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.3.1°
    text: in buitengewone omstandigheden worden afgeweken van het eerste lid, onder *b*;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.3.2°
    text: |-
      ten behoeve van de bevordering van internationale handelscontacten worden afgeweken van het eerste lid, onder *a*
      en *b*;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: 8.3.3°
    text: |-
      in het kader van scholing, opleiding, internationale uitwisseling en andere internationale culturele contacten
      alsmede ten behoeve van vreemdelingen die beschikken over een voor het verrichten van arbeid geldige vergunning tot
      verblijf, worden afgeweken van het eerste lid, onder *a*, *b* en *d*.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: '8.4'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel8
  - number: '9.1'
    text: 'Een tewerkstellingsvergunning kan worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.a
    text: |-
      indien de werkgever niet kan aantonen voldoende inspanningen te hebben gepleegd de arbeidsplaats door
      prioriteitgenietend op de arbeidsmarkt beschikbaar aanbod te vervullen;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.b
    text: |-
      indien van de te vervullen arbeidsplaats de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden
      beneden het niveau liggen dat wettelijk is vereist of in desbetreffende bedrijfstak gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.c
    text: |-
      indien voorzienbaar is dat binnen een redelijke termijn voor de desbetreffende arbeidsplaats prioriteitgenietend
      aanbod op de arbeidsmarkt beschikbaar zal komen;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.d
    text: |-
      indien het een niet eerder toegelaten vreemdeling betreft, wiens leeftijd niet valt binnen bij ministeriële
      regeling gestelde leeftijdsgrenzen;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.e
    text: |-
      ingevolge het niet in acht nemen van een beperking waaronder een eerdere vergunning is verleend of wegens het niet
      naleven van een daaraan verbonden voorschrift;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.f
    text: indien geen passende huisvesting voor de vreemdeling beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.g
    text: |-
      indien het een eerder toegelaten vreemdeling betreft voor wie op grond van [artikel 11, vierde lid][ref1], een
      niet-verlengbare tijdelijke tewerkstellingsvergunning is verleend en die daarna zijn hoofdverblijf niet ten minste
      één jaar buiten Nederland heeft verplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel11
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '11'
        paragraaf: II
  - number: 9.1.h
    text: |-
      indien de werving niet heeft plaatsgevonden op een wijze die voor de desbetreffende sector is overeengekomen bij
      een convenant dat voldoet aan bij ministeriële regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.1.i
    text: |-
      indien door de werkgever anderszins belemmeringen zijn opgeworpen waardoor de arbeidsplaats niet overeenkomstig het
      bij of krachtens deze wet bepaalde door aanbod op de arbeidsmarkt vervuld kon worden.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, onderdeel h, wordt met betrekking tot de eisen waaraan de
      convenanten moeten voldoen, in ieder geval opgenomen dat het Uitvoeringsinstituut werknemersverzekeringen:
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.2.a
    text: partij is bij het convenant;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.2.b
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid in kennis stelt van het voornemen inzake het tot stand brengen
      van een convenant;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: 9.2.c
    text: het convenant in de Staatscourant publiceert nadat het tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel9
  - number: '10'
    text: 'Aan een tewerkstellingsvergunning kunnen voorschriften worden verbonden welke ertoe strekken:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel10
  - number: 10.a
    text: |-
      dat de werkgever inspanningen pleegt arbeidsplaatsen door prioriteitgenietend op de arbeidsmarkt beschikbaar aanbod
      te doen vervullen;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel10
  - number: 10.b
    text: |-
      dat in de onderneming in de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden voor de vervulling van
      arbeidsplaatsen door prioriteitgenietend aanbod gelegen beletselen, worden opgeheven;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel10
  - number: 10.c
    text: |-
      dat de overeenkomst tot het verrichten van arbeid met een niet eerder toegelaten vreemdeling schriftelijk wordt
      aangegaan en dat daarvan een afschrift ter beschikking wordt gesteld aan de vergunning verlenende instantie;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel10
  - number: 10.d
    text: |-
      dat de werkgever geheel of gedeeltelijk door opleiding of scholing voorziet in het in de toekomst aanwezig zijn van
      een voor zijn arbeidsorganisatie geschikt aanbod.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel10
  - number: '11.1'
    text: Een tewerkstellingsvergunning wordt voor ten hoogste drie jaar verleend.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een tewerkstellingsvergunning die is verleend met toepassing van [artikel 8, tweede lid][ref1], is niet vatbaar
      voor verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
        paragraaf: II
  - number: '11.3'
    text: |-
      Ten behoeve van tijdelijk werk wordt een tewerkstellingsvergunning voor ten hoogste vier en twintig weken verleend,
      indien de desbetreffende arbeid wordt verricht door een niet eerder toegelaten vreemdeling. Deze vreemdeling
      mag gedurende een periode van acht en twintig weken direct voorafgaande aan de tewerkstellingsvergunning
      niet over een voor het verrichten van arbeid geldige verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] hebben beschikt. Deze tewerkstellingsvergunning is niet vatbaar
      voor verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '11.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat voor andere categorieën van vreemdelingen
      of categorieën van werkzaamheden, dan die bedoeld in het tweede of derde lid, een tewerkstellingsvergunning die
      voor minder dan drie jaar is verleend, niet wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel11
  - number: '12.1'
    text: 'Een tewerkstellingsvergunning wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel12
  - number: 12.1.a
    text: |-
      indien de voor verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn geweest, dat op de
      aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel12
  - number: 12.1.b
    text: indien gebleken is dat aan de vreemdeling verblijf in Nederland is geweigerd;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel12
  - number: 12.1.c
    text: indien van de tewerkstellingsvergunning geen gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Justitie, ten aanzien van een vreemdeling als bedoeld in
      [artikel 8, onder h, van de Vreemdelingenwet 2000][ref1] afwijken van het eerste lid onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '13'
    text: |-
      Onverminderd de [artikelen 11, tweede lid][ref1], en [12, eerste lid][ref2] kan weigering van verlenging of
      intrekking van een tewerkstellingsvergunning slechts geschieden ingevolge:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel12
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '11'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '12'
        paragraaf: II
  - number: 13.a
    text: het niet in acht nemen van een beperking waaronder de tewerkstellingsvergunning is verleend, of
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel13
  - number: 13.b
    text: het niet naleven van een aan de tewerkstellingsvergunning verbonden voorschrift.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel14
  - number: '14.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien de werkgever door een vreemdeling arbeid laat verrichten waarbij die arbeid feitelijk worden
      verricht bij een andere werkgever, draagt de eerstgenoemde werkgever er bij aanvang van de arbeid door
      de vreemdeling onverwijld zorg voor dat de andere werkgever een afschrift van het document, bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1], van de vreemdeling
      ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '15.2'
    text: |-
      De werkgever die het afschrift van het document, bedoeld in het eerste lid, ontvangt, stelt de identiteit van de
      vreemdeling vast aan de hand van het genoemde document en neemt het afschrift op in de administratie.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel15
  - number: '15.3'
    text: |-
      De werkgever, bedoeld in het tweede lid, bewaart het afschrift tot tenminste vijf jaren na het einde van het
      kalenderjaar waarin de arbeid door de vreemdeling is beëindigd.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel15
  - number: '15.4'
    text: |-
      De vreemdeling verstrekt een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] aan de werkgever, die
      het afschrift van het document, bedoeld in het eerste lid, ontvangt, en stelt die werkgever in de gelegenheid een
      afschrift van dit document te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '16.1'
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 14][ref1], zijn bevoegd bij het verwerken
      van persoonsgegevens gebruik te maken van het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
        paragraaf: III
  - number: '16.2'
    text: |-
      Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan de door Onze Minister aangewezen
      ambtenaren, bedoeld in [artikel 14][ref1], kosteloos alle gegevens en inlichtingen te verstrekken die noodzakelijk
      zijn voor het toezicht op de naleving van het bepaalde bij of krachtens deze wet. Bestuursorganen kunnen daarbij
      gebruik maken van het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer, voor zover zij
      daartoe gerechtigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
        paragraaf: III
  - number: '16.3'
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 14][ref1], verstrekken andere bestuursorganen
      kosteloos gegevens welke zij behoeven ter uitvoering van hun taak. De laatste volzin van het tweede lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
        paragraaf: III
  - number: '16.4'
    text: |-
      De in het tweede en derde lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel16
  - number: '16.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze waarop in
      ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel16
  - number: '16.6'
    text: |-
      Voor de toepassing van dit artikel worden met bestuursorganen gelijkgesteld instellingsbesturen van uit de openbare
      kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare kas bekostigde scholen en instellingen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel16
  - number: '17'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner indien sprake is van een redelijk vermoeden van een overtreding als bedoeld in
      [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '18'
        paragraaf: IV
  - number: 17a
    text: |-
      De toezichthouder is te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Hij kan daartoe
      de uitlevering vorderen tegen een door hem afgegeven schriftelijk bewijs. Zodra het belang van onderzoek omtrent
      de overtreding zulks toelaat wordt het in beslag genomen voorwerp teruggegeven aan degene bij wie het in beslag
      is genomen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17a
  - number: 17b.1
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar kan, nadat een overtreding van een
      voorschrift of verbod bij of krachtens deze wet is geconstateerd die bestuurlijk beboetbaar is gesteld, aan de
      werkgever een schriftelijke waarschuwing geven dat bij herhaling van de overtreding of bij een latere overtreding
      van eenzelfde in de waarschuwing aangegeven wettelijke verplichting of verbod of bij of krachtens algemene
      maatregel van bestuur aan te wijzen soortgelijke verplichtingen of verboden, door hem een bevel kan worden opgelegd
      dat door hem aangewezen werkzaamheden voor ten hoogste drie maanden worden gestaakt dan wel niet mogen worden
      aangevangen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17b
  - number: 17b.2
    text: |-
      Indien een waarschuwing als bedoeld in het eerste lid is gegeven en herhaling van de overtreding of een latere
      overtreding als bedoeld in het eerste lid is geconstateerd, kan door de ambtenaar, bedoeld in het eerste lid,
      aan de werkgever bij beschikking een bevel als bedoeld in het eerste lid worden opgelegd dat wordt opgevolgd met
      ingang van het in de beschikking aangeven tijdstip. Deze beschikking wordt niet gegeven zolang wegens de eerste
      overtreding, bedoeld in het eerste lid, nog niet een bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17b
  - number: 17b.3
    text: De constatering van de overtreding, bedoeld in het eerste of tweede lid, wordt vastgelegd in een boeterapport.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17b
  - number: 17b.4
    text: |-
      De waarschuwing, bedoeld in het eerste lid, vervalt indien na de dagtekening van de waarschuwing vijf jaren zijn
      verstreken. [Artikel 5:34, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 17b.5
    text: |-
      De ambtenaar, bedoeld in het eerste lid, is bevoegd met betrekking tot het bevel, bedoeld in het tweede lid,
      met inbegrip van de oplegging van een last onder bestuursdwang, de nodige maatregelen te treffen, de nodige
      aanwijzingen te geven en de hulp van de sterke arm in te roepen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17b
  - number: 17b.6
    text: |-
      Ieder wie zulks aangaat is verplicht zich te gedragen overeenkomstig een bevel als bedoeld in het tweede lid en een
      maatregel of aanwijzing als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17b
  - number: 17b.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17b
  - number: 17d
    text: |-
      Een beschikking op grond van deze wet van een ambtenaar als bedoeld in [artikel 17b, eerste lid][ref1], wordt
      genomen namens Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
        paragraaf: III
  - number: '18.1'
    text: |-
      Als overtreding wordt aangemerkt het niet naleven van de [artikelen 2, eerste lid][ref1], en [15][ref2] en het
      bepaalde bij of krachtens [artikel 2a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '15'
        paragraaf: III
      - id: ref3
        bwb_id: BWBR0007149
        artikel: 2a
        paragraaf: II
  - number: '18.2'
    text: |-
      Als overtreding wordt tevens aangemerkt het door de werkgever niet naleven van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1] voor zover het betreft het door de toezichthouder uitoefenen
      van bevoegdheden ter vaststelling van de identiteit van degene die voor de werkgever arbeid verricht of heeft
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18b.1
    text: |-
      Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1] vermeldt het rapport in ieder
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18b.1.a
    text: de bij de overtreding betrokken persoon of personen;
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel18b
  - number: 18b.1.b
    text: |-
      het officiële nummer waaronder het betreffende vervoermiddel is geregistreerd, voor zover in verband met de
      overtreding van belang.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel18b
  - number: 18b.2
    text: |-
      Het rapport wordt toegezonden aan de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19a.1
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar legt namens hem de bestuurlijke boete
      op aan degene op wie de verplichtingen rusten welke voortvloeien uit deze wet, voor zover het niet naleven daarvan
      is aangeduid als een overtreding.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19a
  - number: 19a.2
    text: |-
      De terzake van deze wet gestelde overtredingen, gelden ten opzichte van elk persoon, met of ten aanzien van wie een
      overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19a
  - number: 19d.1
    text: |-
      De bestuurlijke boete die voor een overtreding kan worden opgelegd bedraagt ten hoogste het bedrag van de vijfde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 19d.2
    text: |-
      Onverminderd het eerste lid verhoogt de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar de
      op te leggen bestuurlijke boete met 100 procent van het boetebedrag, vastgesteld op grond van het zesde lid,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding een eerdere
      overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven
      van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is
      geconstateerd en de bestuurlijke boete wegens de eerdere overtreding onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19d.3
    text: |-
      De verhoging van de bestuurlijke boete, bedoeld in het tweede lid, bedraagt 200 procent indien zowel de overtreding
      als de eerdere overtreding, bedoeld in dat lid, bij of krachtens algemene maatregel van bestuur zijn aangewezen als
      ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19d
  - number: 19d.4
    text: |-
      Onverminderd het eerste lid verhoogt de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar de op
      te leggen bestuurlijke boete met 200 procent van het boetebedrag, vastgesteld op grond van het zesde lid, indien
      binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding twee maal een eerdere
      overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven
      van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is
      geconstateerd en de bestuurlijke boeten wegens de eerdere overtredingen onherroepelijk zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19d.5
    text: |-
      In afwijking van het tweede en vierde lid is het tijdvak van vijf jaar in die leden tien jaar indien de
      onherroepelijke boetes, bedoeld in die leden, zijn opgelegd wegens bij of krachtens algemene maatregel van bestuur
      aangewezen ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19d
  - number: 19d.6
    text: |-
      Onze Minister stelt beleidsregels vast waarin de boetebedragen voor de overtredingen worden vastgesteld.
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is van toepassing indien een artikel gesteld bij of
      krachtens deze wet op grond waarvan een bestuurlijke boete kan worden opgelegd, niet is nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 19d.7
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep de
      hoogte van de bestuurlijke boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 19f
    text: |-
      Indien een bestuurlijke boete ten onrechte is opgelegd, wordt deze binnen zes weken nadat is vastgesteld dat de
      bestuurlijke boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel19f
  - number: '20'
    text: |-
      Een tewerkstellingsvergunning anders dan die bedoeld in [artikel 11, tweede en derde lid][ref1], behoudt haar
      geldigheid, totdat de termijn voor het instellen van beroep tegen een beschikking, inhoudende de intrekking van die
      vergunning is verstreken, of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel11
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '11'
        paragraaf: II
  - number: '22'
    text: Onze Minister stelt nadere regels ter bevordering van een goede uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      De werkgever is verplicht de vreemdeling die arbeid heeft verricht zijn loon als bedoeld in artikel 2, onderdeel
      j, van de Richtlijn nr. 2009/52/EG van het Europees Parlement en de Raad van 18 juni 2009 tot vaststelling van
      minimumnormen inzake sancties en maatregelen tegen werkgevers van illegaal verblijvende onderdanen van derde landen
      (PbEU 2009 L 168) te voldoen.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel23
  - number: '23.2'
    text: |-
      Indien een werkgever een vreemdeling arbeid doet verrichten in strijd met [artikel 2][ref1], wordt de vreemdeling
      vermoed gedurende ten minste zes maanden werkzaam te zijn voor die werkgever tegen het loon, bedoeld in het eerste
      lid, en voor de duur van het verrichten van de arbeid die in de desbetreffende bedrijfstak gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: '23.3'
    text: De vreemdeling kan tevens elke naast hogere werkgever aansprakelijk stellen voor de nakoming van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel23
  - number: '23.4'
    text: |-
      Een vordering uit hoofde van het derde lid is slechts mogelijk indien een vordering op de naast lagere werkgever
      niet is geslaagd.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel23
  - number: '23.5'
    text: De kantonrechter is bevoegd kennis te nemen van vorderingen op grond van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel23
  - number: '28'
    text: De Wet arbeid buitenlandse werknemers wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel28
  - number: '29'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel29
  - number: '30'
    text: 'Deze wet wordt aangehaald als: Wet arbeid vreemdelingen.'
    url: https://wetten.overheid.nl/BWBR0007149/2013-01-01#Artikel30
