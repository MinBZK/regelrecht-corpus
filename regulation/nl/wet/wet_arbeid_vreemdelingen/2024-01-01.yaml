  - number: 12b
    text: |-
      Onze Minister kan voorts een tewerkstellingsvergunning intrekken of Onze Minister van Veiligheid en Justitie kan
      voorts een gecombineerde vergunning intrekken indien de werkgever binnen een periode van vijf jaar voorafgaand aan
      het moment waarop de vergunning wordt ingetrokken:

      a. een bestuurlijke boete is opgelegd op grond van:

      1°. [artikel 10:1 van de Arbeidstijdenwet][ref1];

      2°. [artikel 33 van de Arbeidsomstandighedenwet][ref2];

      3°. [artikel 18b van de Wet minimumloon en minimumvakantiebijslag][ref3];

      4°. [artikel 18][ref4] van de Wet arbeid vreemdelingen; of

      5°. [artikel 16 van de Wet allocatie arbeidskrachten door intermediairs][ref5];

      b. gestraft is op grond van:

      1°. [artikel 273f van het Wetboek van Strafrecht][ref6];

      2°. [artikel 11:3 van de Arbeidstijdenwet][ref7]; of

      3°. [artikel 32 van de Arbeidsomstandighedenwet][ref8].


