        artikel: '107'
  - number: 5a
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat voor bepaalde categorieën van werkzaamheden of, indien
      daarvoor een volkenrechtelijke verplichting bestaat, voor bepaalde categorieën van vreemdelingen een limiet aan het
      aantal te verlenen tewerkstellingsvergunningen of gecombineerde vergunningen wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Een tewerkstellingsvergunning wordt aangevraagd door de werkgever.

      2 Op een aanvraag wordt binnen vijf weken na ontvangst beslist.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel6
  - number: '7'
    text: |-
      1 De tewerkstellingsvergunning en het aanvullend document als onderdeel van de gecombineerde vergunning vermelden
      de naam en de plaats van vestiging van de werkgever en andere identificerende gegevens van de werkgever, het loon
      van de vreemdeling, de persoonsgegevens van de vreemdeling, de geldigheidsduur van de tewerkstellingsvergunning
      of de gecombineerde vergunning, alsmede een omschrijving van de aard en de plaats van de door de vreemdeling te
      verrichten arbeid.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de identificerende gegevens,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister weigert een tewerkstellingsvergunning of Onze Minister van Veiligheid en Justitie weigert een
      gecombineerde vergunning:

      a. indien voor de desbetreffende arbeidsplaats prioriteitgenietend aanbod op de arbeidsmarkt aanwezig is;

      b. indien het een arbeidsplaats betreft waarvan de beschikbaarheid niet ten minste vijf weken voor het indienen van
      de aanvraag aan het Uitvoeringsinstituut werknemersverzekeringen is gemeld;

      c. indien de werkgever niet kan aantonen voldoende inspanningen te hebben gepleegd de arbeidsplaats door
      prioriteitgenietend aanbod op de arbeidsmarkt te vervullen:

      d. indien van de te vervullen arbeidsplaats de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden
      beneden het niveau liggen dat wettelijk is vereist of in de desbetreffende bedrijfstak gebruikelijk is;

      e. indien het een vreemdeling betreft:

      1°. die niet beschikt over een voor het verrichten van arbeid geldige verblijfsvergunning, noch een zodanige
      vergunning heeft aangevraagd, noch, voor zover ter verkrijging van een dergelijke vergunning vereist, een
      machtiging tot voorlopig verblijf heeft aangevraagd, dan wel

      2°. aan wie een verblijfsvergunning is geweigerd of wiens verblijfsvergunning is ingetrokken;

      f. indien het een vreemdeling betreft, die met de desbetreffende arbeid over een periode
      van een maand niet ten minste een bedrag verdient gelijk aan het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1];

      g. indien het een arbeidsplaats betreft die behoort tot een bij algemene maatregel van bestuur aangewezen categorie
      van werkzaamheden, waarvan het niet in het Nederlands belang is deze door vreemdelingen te laten verrichten; of

      h. indien het een categorie van werkzaamheden of van vreemdelingen betreft waarvoor overeenkomstig
      [artikel 5a][ref2] een limiet aan het aantal te verlenen tewerkstellingsvergunningen of gecombineerde vergunningen
      is gesteld, welke limiet is bereikt.

      2 Onder bij of krachtens algemene maatregel van bestuur te stellen voorwaarden is het eerste lid, onder a, b, c,
      f en h niet van toepassing op de vreemdeling die de toegang tot Nederland niet is geweigerd en door wie of ten
      behoeve van wie een asielaanvraag is ingediend en die ten bewijze daarvan door Onze Minister van Veiligheid en
      Justitie in het bezit is gesteld van een daartoe aangewezen document, en niet beschikt over een aantekening als
      bedoeld in [artikel 4, eerste lid][ref3], van de wet, en die gelet op de verbetering van de kwaliteit van het
      verblijf van die vreemdeling arbeid mag verrichten.

      3 In door Onze Minister te bepalen gevallen kan:

      a. in buitengewone omstandigheden worden afgeweken van het eerste lid, onder b;

      b. ten behoeve van de bevordering van internationale handelscontacten of in het kader van de uitoefening van een
      geestelijke, godsdienstige of levensbeschouwelijke functie worden afgeweken van het eerste lid, onder a, b, c en f;

      c. in het kader van scholing, opleiding, vrijwilligerswerk, internationale uitwisseling en andere internationale
      culturele contacten alsmede ten behoeve van vreemdelingen die beschikken over een voor het verrichten van arbeid
      geldige verblijfsvergunning, worden afgeweken van het eerste lid, onder a, b, c, d en f; of

      d. in afwijking van het eerste lid, onder b, een kortere termijn dan vijf weken gelden indien het
      Uitvoeringsinstituut werknemersverzekeringen voor ommekomst van die termijn heeft vastgesteld dat er voor de
      desbetreffende arbeidsplaats geen prioriteitgenietend aanbod op de arbeidsmarkt aanwezig is.

      4 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
