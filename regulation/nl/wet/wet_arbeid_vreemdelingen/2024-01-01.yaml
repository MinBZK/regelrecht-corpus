  - number: '23'
    text: |-
      1 De werkgever is verplicht de vreemdeling die arbeid heeft verricht zijn loon als bedoeld in artikel 2, onderdeel
      j, van de Richtlijn nr. 2009/52/EG van het Europees Parlement en de Raad van 18 juni 2009 tot vaststelling van
      minimumnormen inzake sancties en maatregelen tegen werkgevers van illegaal verblijvende onderdanen van derde landen
      (PbEU 2009 L 168) te voldoen.

      2 Indien een werkgever een vreemdeling arbeid doet verrichten in strijd met [artikel 2][ref1], wordt de vreemdeling
      vermoed gedurende ten minste zes maanden werkzaam te zijn voor die werkgever tegen het loon, bedoeld in het eerste
      lid, en voor de duur van het verrichten van de arbeid die in de desbetreffende bedrijfstak gebruikelijk is.

      3 De vreemdeling kan tevens elke naast hogere werkgever aansprakelijk stellen voor de nakoming van het eerste lid.

      4 Een vordering uit hoofde van het derde lid is slechts mogelijk indien een vordering op de naast lagere werkgever
      niet is geslaagd.

      5 De kantonrechter is bevoegd kennis te nemen van vorderingen op grond van het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: '24'
    text: |-
      De artikelen van deze wet zijn slechts op vreemdelingen die rechten ontlenen aan het Aanvullend Protocol bij
      de Overeenkomst waarbij een associatie tot stand gebracht wordt tussen de Europese Economische Gemeenschap en
      Turkije of het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije van toepassing, voor zover ze geen nieuwe
      beperkingen als bedoeld in artikel 41 van dat protocol en artikel 13 van dat besluit opleveren.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel24
  - number: '28'
    text: De Wet arbeid buitenlandse werknemers wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel28
  - number: '29'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel29
  - number: '30'
    text: 'Deze wet wordt aangehaald als: Wet arbeid vreemdelingen.'
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel30
