  - number: '3'
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is niet van toepassing met betrekking tot:

      a. een vreemdeling ten aanzien van wie ingevolge bepalingen, vastgesteld bij overeenkomst met andere
      mogendheden dan wel bij een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, een
      tewerkstellingsvergunning of een gecombineerde vergunning niet mag worden verlangd;

      b. een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref2] voor het verrichten van arbeid als zelfstandige, voor zover deze
      vreemdeling arbeid verricht als zelfstandige;

      c. een vreemdeling die behoort tot een bij of krachtens algemene maatregel van bestuur aangewezen categorie, dan
      wel bij of krachtens algemene maatregel van bestuur aangewezen categorie van werkzaamheden verricht.

      2 Van de bepalingen, bedoeld in het eerste lid, onder *a*, wordt door Onze Minister mededeling gedaan in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
