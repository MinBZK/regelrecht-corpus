  - number: '2'
    text: |-
      1 Het is een werkgever verboden een vreemdeling in Nederland arbeid te laten verrichten zonder
      tewerkstellingsvergunning of zonder dat een vreemdeling in het bezit is van een gecombineerde vergunning voor
      werkzaamheden bij die werkgever.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing met betrekking tot een vreemdeling ten aanzien
      van wie tevens een ander als werkgever optreedt, indien die ander beschikt over een voor de desbetreffende arbeid
      geldige tewerkstellingsvergunning of indien die vreemdeling beschikt over een gecombineerde vergunning voor
      werkzaamheden bij die werkgever.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel2
  - number: 2a
    text: |-
      1 Een werkgever die een vreemdeling arbeid in Nederland laat verrichten, ten aanzien waarvan het verbod, bedoeld
      in [artikel 2][ref1], niet geldt en die niet behoort tot de categorie vreemdelingen, bedoeld in artikel 3, eerste
      lid, onderdeel a, is verplicht dit gegeven schriftelijk te melden ten minste twee werkdagen voor aanvang van de
      werkzaamheden aan een bij ministeriële regeling aan te wijzen instantie, onder overlegging van een verklaring en
      bewijsstukken.

      2 De verplichting, bedoeld in het eerste lid, geldt niet, indien de werkgever reeds uit hoofde van andere, bij
      algemene maatregel van bestuur aan te wijzen, bepalingen een meldingsplicht heeft.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het model van de verklaring en de over
      te leggen bewijsstukken, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
