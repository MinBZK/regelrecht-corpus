  - number: '22'
    text: Onze Minister stelt nadere regels ter bevordering van een goede uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel22
  - number: 22a
    text: |-
      Het ontwerp voor een krachtens de [artikelen 5, vierde lid][ref1], en [22][ref2] vast te stellen ministeriële
      regeling wordt, voor zover deze betrekking heeft op wijziging van de lijst van sectoren, bedoeld in artikel 2,
      tweede lid, van [Richtlijn 2014/36](32014L0036)/EU van het Europees Parlement en de Raad van 26 februari 2014
      betreffende de voorwaarden voor toegang en verblijf van onderdanen van derde landen met het oog op tewerkstelling
      als seizoenarbeider (PbEU 2014, L 94), aan de Tweede Kamer der Staten-Generaal overgelegd. De ministeriële regeling
      wordt niet eerder vastgesteld dan vier weken na de overlegging van het ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel22
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel22a
