  - number: 18b
    text: |-
      1 Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1] vermeldt het rapport in ieder
      geval:

      a. de bij de overtreding betrokken persoon of personen;

      b. het officiële nummer waaronder het betreffende vervoermiddel is geregistreerd, voor zover in verband met de
      overtreding van belang.

      2 Het rapport wordt toegezonden aan de op grond van [artikel 19a, eerste lid][ref2], aangewezen ambtenaar.


