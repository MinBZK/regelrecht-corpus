  - number: '10'
    text: |-
      1 Onze Minister kan voorschriften verbinden aan een tewerkstellingsvergunning of Onze Minister van Veiligheid en
      Justitie kan voorschriften verbinden aan een gecombineerde vergunning, die ertoe strekken:

      a. dat de werkgever inspanningen pleegt arbeidsplaatsen door prioriteitgenietend op de arbeidsmarkt beschikbaar
      aanbod te doen vervullen;

      b. dat in de onderneming in de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden voor de vervulling
      van arbeidsplaatsen door prioriteitgenietend aanbod gelegen beletselen, worden opgeheven;

      c. dat de overeenkomst tot het verrichten van arbeid schriftelijk wordt aangegaan en dat daarvan een afschrift ter
      beschikking wordt gesteld aan de vergunningverlenende instantie;

      d. dat de werkgever geheel of gedeeltelijk door opleiding of scholing voorziet in het in de toekomst aanwezig zijn
      van een voor zijn arbeidsorganisatie geschikt aanbod;

      e. dat de werkgever economische activiteiten gaat verrichten en stukken van de start van de activiteiten ter
      beschikking stelt aan de vergunningverlenende instantie.

      2
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel10
  - number: '11'
    text: |-
      1 Een tewerkstellingsvergunning wordt voor ten hoogste drie jaar verleend.

      2 Ten behoeve van tijdelijk werk wordt een tewerkstellingsvergunning voor ten hoogste vier en twintig weken
      verleend, indien de desbetreffende arbeid wordt verricht door een niet eerder toegelaten vreemdeling. Deze
      vreemdeling mag gedurende een periode van veertien weken direct voorafgaande aan de tewerkstellingsvergunning
      niet over een voor het verrichten van arbeid geldige verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] hebben beschikt.

      3 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat een tewerkstellingsvergunning voor
      bepaalde categorieën van werkzaamheden voor een kortere periode dan drie jaar wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel11
