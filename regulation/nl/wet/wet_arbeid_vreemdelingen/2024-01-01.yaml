  - number: 19a
    text: |-
      1 Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar legt namens hem de bestuurlijke
      boete op aan degene op wie de verplichtingen rusten welke voortvloeien uit deze wet, voor zover het niet naleven
      daarvan is aangeduid als een overtreding.

      2 De terzake van deze wet gestelde overtredingen, gelden ten opzichte van elk persoon, met of ten aanzien van wie
      een overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel19a
  - number: 19d
    text: |-
      1 De bestuurlijke boete die voor een overtreding kan worden opgelegd bedraagt ten hoogste het bedrag van de vijfde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].

      2 Onverminderd het eerste lid verhoogt de op grond van [artikel 19a, eerste lid][ref2], aangewezen ambtenaar
      de op te leggen bestuurlijke boete met 100 procent van het boetebedrag, vastgesteld op grond van het zesde lid,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding een eerdere
      overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven
      van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is
      geconstateerd en de bestuurlijke boete wegens de eerdere overtreding onherroepelijk is geworden.

      3 De verhoging van de bestuurlijke boete, bedoeld in het tweede lid, bedraagt 200 procent indien zowel de
      overtreding als de eerdere overtreding, bedoeld in dat lid, bij of krachtens algemene maatregel van bestuur zijn
      aangewezen als ernstige overtredingen.

      4 Onverminderd het eerste lid verhoogt de op grond van [artikel 19a, eerste lid][ref3], aangewezen ambtenaar de
      op te leggen bestuurlijke boete met 200 procent van het boetebedrag, vastgesteld op grond van het zesde lid, indien
      binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding twee maal een eerdere
      overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven
      van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is
      geconstateerd en de bestuurlijke boeten wegens de eerdere overtredingen onherroepelijk zijn geworden.

      5 In afwijking van het tweede en vierde lid is het tijdvak van vijf jaar in die leden tien jaar indien de
      onherroepelijke boetes, bedoeld in die leden, zijn opgelegd wegens bij of krachtens algemene maatregel van bestuur
      aangewezen ernstige overtredingen.

      6 Onze Minister stelt beleidsregels vast waarin de boetebedragen voor de overtredingen worden vastgesteld.
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref4] is van toepassing indien een artikel gesteld bij of
      krachtens deze wet op grond waarvan een bestuurlijke boete kan worden opgelegd, niet is nageleefd.

      7 In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref5] kan de rechter in beroep of hoger beroep
      de hoogte van de bestuurlijke boete ook ten nadele van de belanghebbende wijzigen.


