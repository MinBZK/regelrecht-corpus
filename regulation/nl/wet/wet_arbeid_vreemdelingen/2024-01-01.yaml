  - number: 19f
    text: |-
      Indien een bestuurlijke boete ten onrechte is opgelegd, wordt deze binnen zes weken nadat is vastgesteld dat de
      bestuurlijke boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel19f
  - number: 19g
    text: |-
      1 De toezichthouder of de door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 19a, eerste lid][ref1],
      maken het feit dat een bestuurlijke boete is opgelegd wegens overtreding van deze wet als bedoeld in
      [artikel 18][ref2], dat een besluit is genomen als bedoeld in [artikel 17b, tweede lid][ref3], of dat na een
      afgerond onderzoek geen overtreding is geconstateerd openbaar teneinde de naleving van deze wet te bevorderen en
      inzicht te geven in het uitvoeren van toezicht op grond van deze wet.

      2 Bij de openbaarmaking, bedoeld in het eerste lid, is
      [artikel 5.1, eerste lid, onderdelen c, d en e, en tweede lid, onderdeel f, van de Wet open overheid][ref4] van
      overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de openbaar te maken gegevens,
      waaronder de mogelijke reactie van een belanghebbende in verband met de openbaarmaking van zijn gegevens, de
      termijn waarop deze gegevens beschikbaar worden gesteld en de wijze waarop de openbaarmaking plaatsvindt.

      4 Indien geen overtreding is geconstateerd als bedoeld in het eerste lid, is op dat besluit tot openbaarmaking
      [artikel 4:8 van de Algemene wet bestuursrecht][ref5] niet van toepassing.

      5 De openbaarmaking, bedoeld in het eerste lid, geschiedt niet eerder dan nadat tien werkdagen zijn verstreken na
      de dag waarop het besluit aan belanghebbende bekend is gemaakt.

      6 Bij de openbaarmaking wordt vermeld of tegen een besluit tot oplegging van een bestuurlijke boete of een besluit
      als bedoeld in [artikel 17b, tweede lid][ref6], een rechtsmiddel is ingesteld dan wel of daartoe de mogelijkheid
      bestaat.

      7 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref7], wordt de openbaarmaking opgeschort totdat de
      voorzieningenrechter een uitspraak heeft gedaan.

      8 Indien de openbaarmaking, bedoeld in het eerste lid, in strijd is of zou kunnen komen met het doel van het
      toezicht op de naleving van deze wet dat door de toezichthouders wordt uitgeoefend, blijft openbaarmaking
      achterwege.


