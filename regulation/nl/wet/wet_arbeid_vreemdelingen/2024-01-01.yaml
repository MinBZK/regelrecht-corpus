        bwb_id: BWBR0006297
        artikel: '1'
  - number: '16'
    text: |-
      1 De toezichthouder is bevoegd bij het verwerken van persoonsgegevens gebruik te maken van het burgerservicenummer.

      2 Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan de toezichthouder kosteloos alle
      gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet. Bestuursorganen kunnen daarbij gebruik maken van het burgerservicenummer of het
      vreemdelingennummer, bedoeld in [artikel 107, derde lid, van de Vreemdelingenwet 2000][ref1], voor zover zij
      daartoe gerechtigd zijn.

      3 De toezichthouder verstrekt andere bestuursorganen kosteloos gegevens welke zij behoeven ter uitvoering van hun
      taak. De laatste volzin van het tweede lid is van overeenkomstige toepassing.

      4 De in het tweede en derde lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.

      5 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze waarop in
      ieder geval gegevens dienen te worden verstrekt.

      6 Voor de toepassing van dit artikel worden met bestuursorganen gelijkgesteld instellingsbesturen van uit de
      openbare kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare kas bekostigde scholen en
      instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: '17'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner indien sprake is van een redelijk vermoeden van een overtreding als bedoeld in
      [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '18'
        paragraaf: IV
  - number: 17a
    text: |-
      De toezichthouder is te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Hij kan daartoe
      de uitlevering vorderen tegen een door hem afgegeven schriftelijk bewijs. Zodra het belang van onderzoek omtrent
      de overtreding zulks toelaat wordt het in beslag genomen voorwerp teruggegeven aan degene bij wie het in beslag
      is genomen.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel17a
  - number: 17b
    text: |-
      1 Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar kan, nadat een overtreding van een
      voorschrift of verbod bij of krachtens deze wet is geconstateerd die bestuurlijk beboetbaar is gesteld, aan de
      werkgever een schriftelijke waarschuwing geven dat bij herhaling van de overtreding of bij een latere overtreding
      van eenzelfde in de waarschuwing aangegeven wettelijke verplichting of verbod of bij of krachtens algemene
      maatregel van bestuur aan te wijzen soortgelijke verplichtingen of verboden, door hem een bevel kan worden opgelegd
      dat door hem aangewezen werkzaamheden voor ten hoogste drie maanden worden gestaakt dan wel niet mogen worden
      aangevangen.

      2 Indien een waarschuwing als bedoeld in het eerste lid is gegeven en herhaling van de overtreding of een latere
      overtreding als bedoeld in het eerste lid is geconstateerd, kan door de ambtenaar, bedoeld in het eerste lid,
      aan de werkgever bij beschikking een bevel als bedoeld in het eerste lid worden opgelegd dat wordt opgevolgd met
      ingang van het in de beschikking aangeven tijdstip. Deze beschikking wordt niet gegeven zolang wegens de eerste
      overtreding, bedoeld in het eerste lid, nog niet een bestuurlijke boete is opgelegd.

      3 De constatering van de overtreding, bedoeld in het eerste of tweede lid, wordt vastgelegd in een boeterapport.

      4 De waarschuwing, bedoeld in het eerste lid, vervalt indien na de dagtekening van de waarschuwing vijf jaren zijn
      verstreken.

      5 De ambtenaar, bedoeld in het eerste lid, is bevoegd met betrekking tot het bevel, bedoeld in het tweede lid,
      met inbegrip van de oplegging van een last onder bestuursdwang, de nodige maatregelen te treffen, de nodige
      aanwijzingen te geven en de hulp van de sterke arm in te roepen.

      6 Ieder wie zulks aangaat is verplicht zich te gedragen overeenkomstig een bevel als bedoeld in het tweede lid en
      een maatregel of aanwijzing als bedoeld in het vijfde lid.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel17b
  - number: 17d
    text: |-
      Een beschikking op grond van deze wet van een ambtenaar als bedoeld in de [artikelen 17b, eerste lid][ref1], en
      [19g, eerste lid][ref2], wordt genomen namens Onze Minister.


