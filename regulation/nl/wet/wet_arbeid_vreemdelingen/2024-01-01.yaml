  - number: '5'
    text: |-
      1 Onze Minister is bevoegd tot het afgeven en intrekken van tewerkstellingsvergunningen.

      2 Onze Minister wijst een instantie aan die Onze Minister van Veiligheid en Justitie adviseert inzake het verlenen,
      verlengen of intrekken van een gecombineerde vergunning.

      3 Het advies, bedoeld in het tweede lid, wordt binnen een termijn van vijf weken na ontvangst van het verzoek om
      advies uitgebracht.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de advisering, bedoeld in het
      tweede lid.

      5 De werkgever verstrekt op verzoek van de aangewezen instantie, bedoeld in het tweede lid, kosteloos alle gegevens
      en inlichtingen die noodzakelijk zijn voor het uitbrengen van het in dat lid bedoelde advies.

      6 Bestuursorganen zijn bevoegd uit eigen beweging en desgevraagd verplicht aan Onze Minister, dan wel aan de
      aangewezen instantie, bedoeld in het tweede lid, of het Uitvoeringsinstituut werknemersverzekeringen, kosteloos
      de gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van het bepaalde bij
      of krachtens deze wet. Bestuursorganen kunnen daarbij gebruikmaken van het vreemdelingennummer, bedoeld in
      [artikel 107, derde lid, van de Vreemdelingenwet 2000][ref1], of het burgerservicenummer. Bij algemene maatregel
      van bestuur kunnen regels worden gesteld omtrent deze gegevensverstrekking.

      7 De in het zesde lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      betrokkene daardoor onevenredig wordt geschaad.

      8 Onze Minister kan de in het eerste lid bedoelde bevoegdheden delegeren aan het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel5
    references:
