preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen met betrekking tot de
    tewerkstelling van vreemdelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. werkgever:

      1°. degene die in de uitoefening van een ambt, beroep of bedrijf een ander arbeid laat verrichten;

      2°. de natuurlijke persoon die een ander huishoudelijke of persoonlijke diensten laat verrichten;

      c. vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];

      d. niet eerder toegelaten vreemdeling: een vreemdeling die niet eerder over een voor het verrichten van arbeid
      geldige vergunning tot verblijf heeft beschikt, dan wel een vreemdeling die, na over een zodanige vergunning
      te hebben beschikt, zijn hoofdverblijf weer buiten Nederland heeft gevestigd dan wel buiten Nederland heeft
      voortgezet;

      e. tewerkstellingsvergunning: vergunning voor een werkgever die wordt verleend door Onze Minister op grond
      van [artikel 5, eerste lid][ref2], ten behoeve van een vreemdeling die rechtmatig verblijf heeft of heeft
      aangevraagd, anders dan op grond van een verblijfsvergunning regulier voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref3] die is verleend onder de beperking «arbeid in loondienst» of
      «lerend werken»;

      f. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      g. prioriteitgenietend aanbod: aanbod van de zijde van Nederlanders en vreemdelingen als bedoeld in de
      [artikelen 3, eerste lid, onder a][ref5], en [4, eerste lid][ref6];

      h. gecombineerde vergunning: verblijfsvergunning regulier voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref7], verleend door Onze Minister van Veiligheid en Justitie onder de
      beperking «arbeid in loondienst», «lerend werken» of «seizoenarbeid», tevens zijnde vergunning voor het verrichten
      van werkzaamheden bij een specifieke werkgever, met het aanvullend document;

      i. aanvullend document: document waarin de aanvullende informatie is opgenomen, bedoeld in artikel 6, eerste lid,
      tweede alinea, van de Richtlijn 2011/98/EU van het Europees Parlement en de Raad van 13 december 2011 betreffende
      één enkele aanvraagprocedure voor een gecombineerde vergunning voor onderdanen van derde landen om te verblijven en
      te werken op het grondgebied van een lidstaat, alsmede inzake een gemeenschappelijk pakket rechten voor werknemers
      uit derde landen die legaal in een lidstaat verblijven (PbEU 2011, L343);

      j. toezichthouder: de toezichthouder, bedoeld in de [Algemene wet bestuursrecht][ref8], en als zodanig aangewezen
      op grond van [artikel 14, eerste lid][ref9].


