  - number: 15a
    text: |-
      De werkgever is verplicht om binnen 48 uren na een daartoe strekkende vordering van de toezichthouder de
      identiteit vast te stellen van een persoon van wie op grond van feiten en omstandigheden het vermoeden
      bestaat dat hij arbeid voor hem verricht of heeft verricht, aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en de toezichthouder
      te informeren door een afschrift van dit document te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel15a
    references:
