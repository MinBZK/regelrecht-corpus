  - number: 12a
    text: |-
      Onze Minister kan een tewerkstellingsvergunning intrekken of Onze Minister van Veiligheid en Justitie kan een
      gecombineerde vergunning intrekken indien:

      a. indien de werkgever geen erkende referent is als bedoeld in
      [artikel 1, onderdeel t, van de Vreemdelingenwet 2000][ref1] omdat zijn erkenning is ingetrokken of geschorst of
      omdat zijn aanvraag tot erkenning is afgewezen, of

      b. indien de werkgever een referent is als bedoeld in [artikel 1, onderdeel s, van de Vreemdelingenwet 2000][ref2]
      of een erkende referent als bedoeld in artikel 1, onderdeel t, van die wet en hem op grond van
      [artikel 55a van die wet][ref3] binnen een periode van vijf jaar direct voorafgaande aan de aanvraag voor een
      tewerkstellingsvergunning of gecombineerde vergunning een bestuurlijke boete is opgelegd of indien hij in die
      periode is gestraft op grond van [artikel 108 van die wet][ref4];

      c. het een gecombineerde vergunning betreft, eveneens met toepassing van de in
      [artikel 19 van de Vreemdelingenwet 2000][ref5] bedoelde intrekkingsgronden voor een verblijfsvergunning regulier
      voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref6].


