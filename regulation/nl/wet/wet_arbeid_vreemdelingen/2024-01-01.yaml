  - number: '14'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel14
  - number: '15'
    text: |-
      1 Indien de werkgever door een vreemdeling arbeid laat verrichten waarbij die arbeid feitelijk wordt
      verricht bij een andere werkgever, draagt de eerstgenoemde werkgever er bij aanvang van de arbeid door
      de vreemdeling onverwijld zorg voor dat de andere werkgever een afschrift van het document, bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1], van de vreemdeling
      ontvangt.

      2 De werkgever die het afschrift van het document, bedoeld in het eerste lid, ontvangt, stelt de identiteit van de
      vreemdeling vast aan de hand van het genoemde document en neemt het afschrift op in de administratie.

      3 De verplichting, bedoeld in het eerste lid, om een afschrift van het document te verstrekken, aan de andere
      werkgever is niet van toepassing, indien de vreemdeling die onderdaan is van een lidstaat van de Europese Unie, dan
      wel de Europese Economische Ruimte dan wel van Zwitserland, tenzij ten aanzien van de vreemdeling de artikelen 1
      tot en met 5 van Verordening (EU) Nr. 492/2011 van het Europees Parlement en de Raad van 5 april 2011 betreffende
      het vrije verkeer van werknemers binnen de Unie (PbEU 2011, L 141) niet van toepassing zijn.

      4 De werkgever, bedoeld in het tweede lid, bewaart het afschrift tot tenminste vijf jaren na het einde van het
      kalenderjaar waarin de arbeid door de vreemdeling is beëindigd.

      5 De vreemdeling verstrekt een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref2] aan de werkgever, die
      het afschrift van het document, bedoeld in het eerste lid, ontvangt, en stelt die werkgever in de gelegenheid een
      afschrift van dit document te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007149/2024-01-01#Artikel15
