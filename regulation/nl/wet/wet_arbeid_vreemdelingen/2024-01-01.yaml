  - number: 11a
    text: |-
      Het loon, bedoeld in [artikel 7][ref1], wordt door de werkgever over een periode van ten hoogste een maand,
      bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel7
