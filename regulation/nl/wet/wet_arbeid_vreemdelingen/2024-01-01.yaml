    text: |-
      1 Onze Minister kan een tewerkstellingsvergunning intrekken of Onze Minister van Veiligheid en Justitie kan een
      gecombineerde vergunning intrekken:

      a. indien de voor verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn geweest, dat op de
      aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest;

      b. indien gebleken is dat aan de vreemdeling verblijf in Nederland is geweigerd;

      c. indien van de tewerkstellingsvergunning geen gebruik wordt gemaakt.

      2 Onze Minister kan, na overleg met Onze Minister van Justitie, ten aanzien van een vreemdeling als bedoeld in
      [artikel 8, onder h, van de Vreemdelingenwet 2000][ref1] afwijken van het eerste lid onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
