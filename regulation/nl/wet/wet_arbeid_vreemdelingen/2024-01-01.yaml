  - number: '9'
    text: |-
      1 Onze Minister kan een tewerkstellingsvergunning weigeren of Onze Minister van Veiligheid en Justitie kan een
      gecombineerde vergunning weigeren:

      a. indien voorzienbaar is dat binnen een redelijke termijn voor de desbetreffende arbeidsplaats prioriteitgenietend
      aanbod op de arbeidsmarkt beschikbaar zal komen;

      b. indien het een niet eerder toegelaten vreemdeling betreft, wiens leeftijd niet valt binnen bij ministeriële
      regeling gestelde leeftijdsgrenzen;

      c. ingevolge het niet in acht nemen van een beperking waaronder een eerdere vergunning is verleend of wegens het
      niet naleven van een daaraan verbonden voorschrift;

      d. indien geen passende huisvesting voor de vreemdeling beschikbaar is;

      e. indien de werving niet heeft plaatsgevonden op een wijze die voor de desbetreffende sector is overeengekomen bij
      een convenant dat voldoet aan bij ministeriële regeling gestelde eisen;

      f. indien door de werkgever anderszins belemmeringen zijn opgeworpen waardoor de arbeidsplaats niet overeenkomstig
      het bij of krachtens deze wet bepaalde door aanbod op de arbeidsmarkt vervuld kon worden;

      g. indien de werkgever bij een eerder verleende vergunning het loon, bedoeld in [artikel 7][ref1], niet over een
      periode van ten hoogste een maand aan de vreemdeling heeft uitbetaald;

      h. indien bij de werkgever geen economische activiteit plaatsvindt;

      i. indien binnen een periode van vijf jaar direct voorafgaande aan de aanvraag voor een tewerkstellingsvergunning
      of gecombineerde vergunning een tewerkstellingsvergunning of gecombineerde vergunning is ingetrokken wegens het
      niet naleven van het voorschrift, bedoeld in [artikel 10, tweede lid][ref2];

      j. indien de werkgever geen erkende referent is als bedoeld in
      [artikel 1, onderdeel t, van de Vreemdelingenwet 2000][ref3] omdat zijn erkenning is ingetrokken of geschorst of
      omdat zijn aanvraag tot erkenning is afgewezen;

      k. indien de werkgever een referent is als bedoeld in [artikel 1, onderdeel s, van de Vreemdelingenwet 2000][ref4]
      of een erkende referent als bedoeld in artikel 1, onderdeel t, van die wet en hem op grond van
      [artikel 55a van die wet][ref5] binnen een periode van vijf jaar direct voorafgaande aan de aanvraag voor een
      tewerkstellingsvergunning of gecombineerde vergunning een bestuurlijke boete is opgelegd of indien hij in die
      periode is gestraft op grond van [artikel 108 van die wet][ref6];

      l. indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan de aanvraag voor een
      tewerkstellingsvergunning of gecombineerde vergunning een bestuurlijke boete is opgelegd wegens het niet
      of onvoldoende afdragen van loonbelasting, premies voor de werknemersverzekeringen of premies voor de
      volksverzekeringen of inkomensafhankelijke bijdrage, dan wel een bestuurlijke boete is opgelegd op grond van een
      overtreding als bedoeld in:

      1°. [artikel 10:1 van de Arbeidstijdenwet][ref7];

      2°. [artikel 33 van de Arbeidsomstandighedenwet][ref8];

      3°. [artikel 18b van de Wet minimumloon en minimumvakantiebijslag][ref9];

      4°. [artikel 18][ref10]; of

      5°. [artikel 16 van de Wet allocatie arbeidskrachten door intermediairs][ref11];

      m. indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan de aanvraag voor een
      tewerkstellingsvergunning of gecombineerde vergunning is gestraft op grond van:

      1°. [artikel 273f, van het Wetboek van Strafrecht][ref12];

      2°. [artikel 11:3 van de Arbeidstijdenwet][ref13]; of

      3°. [artikel 32 van de Arbeidsomstandighedenwet][ref14].

      2 In de ministeriële regeling, bedoeld in het eerste lid, onderdeel e, wordt met betrekking tot de eisen waaraan de
      convenanten moeten voldoen, in ieder geval opgenomen dat het Uitvoeringsinstituut werknemersverzekeringen:

      a. partij is bij het convenant;

      b. Onze Minister in kennis stelt van het voornemen inzake het tot stand brengen van een convenant;

      c. het convenant in de Staatscourant publiceert.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de toepassing van het eerste lid.


