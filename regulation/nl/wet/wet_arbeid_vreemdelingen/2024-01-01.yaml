  - number: '4'
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is evenmin van toepassing met betrekking tot een
      vreemdeling die beschikt over een krachtens de [Vreemdelingenwet 2000][ref2] afgegeven verblijfsvergunning, welke
      is voorzien van een aantekening van Onze Minister van Veiligheid en Justitie waaruit blijkt dat aan die vergunning
      geen beperkingen zijn verbonden voor het verrichten van arbeid.

      2 Een zodanige aantekening wordt uitsluitend afgegeven aan een vreemdeling:

      a. die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder b of d, van de Vreemdelingenwet 2000][ref3];

      b. die gedurende een ononderbroken tijdvak van vijf jaar heeft beschikt over een voor het verrichten van arbeid
      geldige verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref4] en
      die nadien zijn hoofdverblijf niet buiten Nederland heeft gevestigd; of

      c. die behoort tot een bij algemene maatregel van bestuur aangewezen categorie.


