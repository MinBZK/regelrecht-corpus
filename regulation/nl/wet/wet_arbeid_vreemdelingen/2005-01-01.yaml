---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_arbeid_vreemdelingen
regulatory_layer: WET
publication_date: '2021-10-27'
valid_from: '2005-01-01'
bwb_id: BWBR0007149
url: https://wetten.overheid.nl/BWBR0007149/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen met betrekking tot de
    tewerkstelling van vreemdelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.1.b
    text: 'werkgever:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.1.b.1°
    text: degene die in de uitoefening van een ambt, beroep of bedrijf een ander arbeid laat verrichten;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.1.b.2°
    text: de natuurlijke persoon die een ander huishoudelijke of persoonlijke diensten laat verrichten;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.1.c
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.1.d
    text: |-
      niet eerder toegelaten vreemdeling: een vreemdeling die niet eerder over een voor het verrichten van arbeid geldige
      vergunning tot verblijf heeft beschikt, dan wel een vreemdeling die, na over een zodanige vergunning te hebben
      beschikt, zijn hoofdverblijf weer buiten Nederland heeft gevestigd dan wel buiten Nederland heeft voortgezet;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.1.e
    text: |-
      tewerkstellingsvergunning: een vergunning als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: 1.1.f
    text: |-
      Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 1.1.g
    text: |-
      prioriteitgenietend aanbod: aanbod van de zijde van Nederlanders en vreemdelingen als bedoeld in de
      [artikelen 3, eerste lid, onder ][ref1], en [4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '3'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '4'
        paragraaf: II
  - number: '1.2'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.2.a
    text: 'beboetbaar feit: een gedraging in strijd met deze wet ter zake waarvan een boete kan worden opgelegd;'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: 1.2.b
    text: |-
      boete: de bestuurlijke sanctie die bestaat uit de onvoorwaardelijke verplichting tot het betalen van een bepaalde
      geldsom aan de Staat.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het is een werkgever verboden een vreemdeling in Nederland arbeid te laten verrichten zonder
      tewerkstellingsvergunning.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing met betrekking tot een vreemdeling ten aanzien van
      wie tevens een ander als werkgever optreedt, indien die ander beschikt over een voor de desbetreffende arbeid
      geldige tewerkstellingsvergunning.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is niet van toepassing met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: 3.1.a
    text: |-
      een vreemdeling ten aanzien van wie ingevolge bepalingen, vastgesteld bij overeenkomst met andere mogendheden dan
      wel bij een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, een tewerkstellingsvergunning
      niet mag worden verlangd;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel3
  - number: 3.1.b
    text: |-
      een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] voor het verrichten van arbeid als zelfstandige, voor zover deze
      vreemdeling arbeid verricht als zelfstandige;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.1.c
    text: |-
      een vreemdeling die behoort tot een bij algemene maatregel van bestuur aangewezen categorie, dan wel bij een
      algemene maatregel van bestuur aangewezen categorie van werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel3
  - number: '3.2'
    text: |-
      Van de bepalingen, bedoeld in het eerste lid, onder *a*, wordt door Onze Minister mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is evenmin van toepassing met betrekking tot een vreemdeling
      die beschikt over een krachtens de [Vreemdelingenwet 2000][ref2] afgegeven vergunning, welke is voorzien van een
      aantekening van Onze Minister van Justitie waaruit blijkt dat aan die vergunning geen beperkingen zijn verbonden
      voor het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0011823
  - number: '4.2'
    text: 'Een zodanige aantekening wordt afgegeven aan een vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel4
  - number: 4.2.a
    text: |-
      die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder b of d, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.2.b
    text: |-
      die gedurende een ononderbroken tijdvak van drie jaar heeft beschikt over een voor het verrichten van arbeid
      geldige verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1] en
      die nadien zijn hoofdverblijf niet buiten Nederland heeft gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 4.2.c
    text: die behoort tot een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel4
  - number: '5.1'
    text: Onze Minister is bevoegd tot het afgeven, verlengen en intrekken van tewerkstellingsvergunningen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel5
  - number: '5.2'
    text: Onze Minister kan de in het eerste lid bedoelde bevoegdheden delegeren aan de Centrale organisatie werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel5
  - number: '6.1'
    text: Een tewerkstellingsvergunning wordt aangevraagd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel6
  - number: '6.2'
    text: Op een aanvraag wordt binnen vijf weken na ontvangst beslist.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel6
  - number: '7'
    text: |-
      De tewerkstellingsvergunning vermeldt de naam en de plaats van vestiging van de werkgever, de persoonsgegevens van
      de vreemdeling, de geldigheidsduur van de tewerkstellingsvergunning, alsmede een omschrijving van de aard en de
      plaats van de door de vreemdeling te verrichten arbeid.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel7
  - number: '8.1'
    text: 'Een tewerkstellingsvergunning wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.1.a
    text: indien voor de desbetreffende arbeidsplaats prioriteitgenietend aanbod op de arbeidsmarkt beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.1.b
    text: |-
      indien het een arbeidsplaats betreft waarvan de beschikbaarheid niet ten minste vijf weken vóór het indienen van de
      aanvraag aan de Centrale organisatie werk en inkomen is gemeld;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.1.c
    text: 'indien het een vreemdeling betreft:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.1.c.1°
    text: |-
      die niet beschikt over een voor het verrichten van arbeid geldige vergunning tot verblijf, noch een zodanige
      vergunning heeft aangevraagd, noch, voor zover ter verkrijging van een dergelijke vergunning vereist, een
      machtiging tot voorlopig verblijf heeft aangevraagd, dan wel
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.1.c.2°
    text: aan wie een vergunning tot verblijf is geweigerd of wiens vergunning tot verblijf is ingetrokken;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.1.d
    text: |-
      indien het een niet eerder toegelaten vreemdeling betreft, die met de desbetreffende arbeid over een periode van
      een maand niet ten minste een bedrag verdient gelijk aan het minimumloon, bedoeld in [artikel 8, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 8.1.e
    text: |-
      indien het een arbeidsplaats betreft die behoort tot een bij algemene maatregel van bestuur aangewezen categorie
      van werkzaamheden, waarvan het niet in het Nederlands belang is deze door vreemdelingen te laten verrichten.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat een vreemdeling die de toegang tot
      Nederland niet is geweigerd en door wie of ten behoeve van wie een asielaanvraag is ingediend en die ten bewijze
      daarvan door Onze Minister van Justitie in het bezit is gesteld van een daartoe aangewezen document, dan wel houder
      is van een al dan niet voorwaardelijke vergunning tot verblijf en niet beschikt over een aantekening als bedoeld
      in [artikel 4, eerste lid][ref1], van de wet, gelet op de verbetering van de kwaliteit van het verblijf van die
      vreemdeling arbeid mag verrichten, waarbij kan worden afgeweken van het eerste lid, onderdelen a, b en d.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '4'
        paragraaf: II
  - number: '8.3'
    text: 'In door Onze Minister te bepalen gevallen kan:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.3.1°
    text: in buitengewone omstandigheden worden afgeweken van het eerste lid, onder *b*;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.3.2°
    text: |-
      ten behoeve van de bevordering van internationale handelscontacten worden afgeweken van het eerste lid, onder *a*
      en *b*;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: 8.3.3°
    text: |-
      in het kader van scholing, opleiding, internationale uitwisseling en andere internationale culturele contacten
      alsmede ten behoeve van vreemdelingen die beschikken over een voor het verrichten van arbeid geldige vergunning tot
      verblijf, worden afgeweken van het eerste lid, onder *a*, *b* en *d*.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: '8.4'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel8
  - number: '9.1'
    text: 'Een tewerkstellingsvergunning kan worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.a
    text: |-
      indien de werkgever niet kan aantonen voldoende inspanningen te hebben gepleegd de arbeidsplaats door
      prioriteitgenietend op de arbeidsmarkt beschikbaar aanbod te vervullen;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.b
    text: |-
      indien van de te vervullen arbeidsplaats de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden
      beneden het niveau liggen dat wettelijk is vereist of in desbetreffende bedrijfstak gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.c
    text: |-
      indien voorzienbaar is dat binnen een redelijke termijn voor de desbetreffende arbeidsplaats prioriteitgenietend
      aanbod op de arbeidsmarkt beschikbaar zal komen;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.d
    text: |-
      indien het een niet eerder toegelaten vreemdeling betreft, wiens leeftijd niet valt binnen bij ministeriële
      regeling gestelde leeftijdsgrenzen;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.e
    text: |-
      ingevolge het niet in acht nemen van een beperking waaronder een eerdere vergunning is verleend of wegens het niet
      naleven van een daaraan verbonden voorschrift;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.f
    text: indien geen passende huisvesting voor de vreemdeling beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.g
    text: |-
      indien het een eerder toegelaten vreemdeling betreft voor wie op grond van [artikel 11, vierde lid][ref1], een
      niet-verlengbare tijdelijke tewerkstellingsvergunning is verleend en die daarna zijn hoofdverblijf niet ten minste
      één jaar buiten Nederland heeft verplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel11
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '11'
        paragraaf: II
  - number: 9.1.h
    text: |-
      indien de werving niet heeft plaatsgevonden op een wijze die voor de desbetreffende sector is overeengekomen bij
      een convenant dat voldoet aan bij ministeriële regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.1.i
    text: |-
      indien door de werkgever anderszins belemmeringen zijn opgeworpen waardoor de arbeidsplaats niet overeenkomstig het
      bij of krachtens deze wet bepaalde door aanbod op de arbeidsmarkt vervuld kon worden.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: '9.2'
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, onderdeel h, wordt met betrekking tot de eisen waaraan de
      convenanten moeten voldoen, in ieder geval opgenomen dat de Centrale organisatie werk en inkomen:
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.2.a
    text: partij is bij het convenant;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.2.b
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid in kennis stelt van het voornemen inzake het tot stand brengen
      van een convenant;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: 9.2.c
    text: het convenant in de Staatscourant publiceert nadat het tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel9
  - number: '10'
    text: 'Aan een tewerkstellingsvergunning kunnen voorschriften worden verbonden welke ertoe strekken:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel10
  - number: 10.a
    text: |-
      dat de werkgever inspanningen pleegt arbeidsplaatsen door prioriteitgenietend op de arbeidsmarkt beschikbaar aanbod
      te doen vervullen;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel10
  - number: 10.b
    text: |-
      dat in de onderneming in de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden voor de vervulling van
      arbeidsplaatsen door prioriteitgenietend aanbod gelegen beletselen, worden opgeheven;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel10
  - number: 10.c
    text: |-
      dat de overeenkomst tot het verrichten van arbeid met een niet eerder toegelaten vreemdeling schriftelijk wordt
      aangegaan en dat daarvan een afschrift ter beschikking wordt gesteld aan de vergunning verlenende instantie;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel10
  - number: 10.d
    text: |-
      dat de werkgever geheel of gedeeltelijk door opleiding of scholing voorziet in het in de toekomst aanwezig zijn van
      een voor zijn arbeidsorganisatie geschikt aanbod.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel10
  - number: '11.1'
    text: Een tewerkstellingsvergunning wordt voor ten hoogste drie jaar verleend.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een tewerkstellingsvergunning die is verleend met toepassing van [artikel 8, tweede lid][ref1], is niet vatbaar
      voor verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
        paragraaf: II
  - number: '11.3'
    text: |-
      Ten behoeve van tijdelijk werk wordt een tewerkstellingsvergunning voor ten hoogste vier en twintig weken verleend,
      indien de desbetreffende arbeid wordt verricht door een niet eerder toegelaten vreemdeling. Deze vreemdeling
      mag gedurende een periode van acht en twintig weken direct voorafgaande aan de tewerkstellingsvergunning
      niet over een voor het verrichten van arbeid geldige verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1] hebben beschikt. Deze tewerkstellingsvergunning is niet vatbaar
      voor verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: '11.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat voor andere categorieën van vreemdelingen
      of categorieën van werkzaamheden, dan die bedoeld in het tweede of derde lid, een tewerkstellingsvergunning die
      voor minder dan drie jaar is verleend, niet wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel11
  - number: '12.1'
    text: 'Een tewerkstellingsvergunning wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel12
  - number: 12.1.a
    text: |-
      indien de voor verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn geweest, dat op de
      aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel12
  - number: 12.1.b
    text: indien gebleken is dat aan de vreemdeling verblijf in Nederland is geweigerd;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel12
  - number: 12.1.c
    text: indien van de tewerkstellingsvergunning geen gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Justitie, ten aanzien van een vreemdeling als bedoeld in
      [artikel 8, onder h, van de Vreemdelingenwet 2000][ref1] afwijken van het eerste lid onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '13'
    text: |-
      Onverminderd de [artikelen 11, tweede lid][ref1], en [12, eerste lid][ref2] kan weigering van verlenging of
      intrekking van een tewerkstellingsvergunning slechts geschieden ingevolge:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel12
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '11'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '12'
        paragraaf: II
  - number: 13.a
    text: het niet in acht nemen van een beperking waaronder de tewerkstellingsvergunning is verleend, of
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel13
  - number: 13.b
    text: het niet naleven van een aan de tewerkstellingsvergunning verbonden voorschrift.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel14
  - number: '14.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien de werkgever door een vreemdeling arbeid laat verrichten waarbij die arbeid feitelijk worden
      verricht bij een andere werkgever, draagt de eerstgenoemde werkgever er bij aanvang van de arbeid door
      de vreemdeling onverwijld zorg voor dat de andere werkgever een afschrift van het document, bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1], van de vreemdeling
      ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '15.2'
    text: |-
      De werkgever die het afschrift van het document, bedoeld in het eerste lid, ontvangt, stelt de identiteit van de
      vreemdeling vast aan de hand van het genoemde document en neemt het afschrift op in de administratie.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel15
  - number: '15.3'
    text: |-
      De werkgever, bedoeld in het tweede lid, bewaart het afschrift tot tenminste vijf jaren na het einde van het
      kalenderjaar waarin de arbeid door de vreemdeling is beëindigd.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel15
  - number: '15.4'
    text: |-
      De vreemdeling verstrekt een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] aan de werkgever, die
      het afschrift van het document, bedoeld in het eerste lid, ontvangt, en stelt die werkgever in de gelegenheid een
      afschrift van dit document te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '16.1'
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 14][ref1], zijn bevoegd bij
      het verwerken van persoonsgegevens gebruik te maken van het sociaal-fiscaal nummer, bedoeld in
      [artikel 47b, derde lid, van de Algemene wet inzake rijksbelastingen][ref2], voor zover dat voor de uitoefening van
      hun taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 47b
  - number: '16.2'
    text: |-
      Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan de door Onze Minister aangewezen
      ambtenaren, bedoeld in [artikel 14][ref1], kosteloos alle gegevens en inlichtingen te verstrekken die noodzakelijk
      zijn voor het toezicht op de naleving van het bepaalde bij of krachtens deze wet. Bestuursorganen kunnen daarbij
      gebruik maken van het sociaal-fiscaal nummer voor zover zij daartoe gerechtigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
        paragraaf: III
  - number: '16.3'
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 14][ref1], verstrekken andere bestuursorganen
      kosteloos gegevens welke zij behoeven ter uitvoering van hun taak. De laatste volzin van het tweede lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
        paragraaf: III
  - number: '16.4'
    text: |-
      De in het tweede en derde lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel16
  - number: '16.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze waarop in
      ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel16
  - number: '16.6'
    text: |-
      Voor de toepassing van dit artikel worden met bestuursorganen gelijkgesteld instellingsbesturen van uit de openbare
      kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare kas bekostigde scholen en instellingen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel16
  - number: '17'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner indien sprake is van een redelijk vermoeden van een beboetbaar feit als bedoeld in
      [artikel 18][ref1] of van een strafbaar feit als bedoeld in [artikel 19c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel19c
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '18'
        paragraaf: IV
      - id: ref2
        bwb_id: BWBR0007149
        artikel: 19c
        paragraaf: IV
  - number: 17a
    text: |-
      De toezichthouder is te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Hij kan daartoe de
      uitlevering vorderen tegen een door hem afgegeven schriftelijk bewijs. Zodra het belang van onderzoek omtrent het
      beboetbare feit zulks toelaat wordt het in beslag genomen voorwerp teruggegeven aan degene bij wie het in beslag
      is genomen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel17a
  - number: '18'
    text: |-
      Als beboetbaar feit wordt aangemerkt het niet naleven van de [artikelen 2, eerste lid][ref1], en [15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel15
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '15'
        paragraaf: III
  - number: 18a.1
    text: Beboetbare feiten kunnen worden begaan door natuurlijke personen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.2
    text: 'Indien een beboetbaar feit wordt begaan door een rechtspersoon, kan de boete worden opgelegd aan:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.2.1°
    text: de rechtspersoon, of
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.2.2°
    text: |-
      degene die opdracht heeft gegeven tot de gedraging waardoor in strijd met de verplichtingen die voortvloeien uit
      deze wet is gehandeld alsmede tegen hem die feitelijke leiding heeft gegeven aan die gedraging, of
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.2.3°
    text: de onder 1° en 2° genoemde tezamen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.3
    text: 'Voor de toepassing van het eerste en tweede lid wordt met een rechtspersoon gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.3.1°
    text: de vennootschap zonder rechtspersoonlijkheid,
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.3.2°
    text: de maatschap,
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.3.3°
    text: de rederij, en
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18a.3.4°
    text: het doelvermogen.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Indien de toezichthouder vaststelt, dat een beboetbaar feit is begaan, maakt hij daarvan zo spoedig mogelijk een
      rapport op.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.2
    text: 'Het rapport is gedagtekend en vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.2.a
    text: de naam van degene die het beboetbaar feit heeft begaan;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.2.b
    text: de aard van het beboetbare feit onder vermelding van het wettelijke voorschrift waarmee in strijd is gehandeld;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.2.c
    text: de aanduiding van de plaats waar en het tijdstip waarop het beboetbaar feit is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.2.d
    text: de bij het beboetbaar feit betrokken persoon of personen;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.2.e
    text: |-
      het officiële nummer waaronder een betreffend vervoermiddel is geregistreerd, voor zover in verband met een
      beboetbaar feit van belang.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Indien de toezichthouder, bedoeld in het eerste lid, jegens de bij een beboetbaar feit betrokken persoon een
      handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat jegens hem wegens het begaan
      van het beboetbaar feit een rapport als bedoeld in het eerste lid zal worden opgemaakt, is die persoon niet langer
      verplicht terzake enige verklaring af te leggen. De in de eerste volzin bedoelde persoon wordt hiervan in kennis
      gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.4
    text: |-
      Het rapport wordt toegezonden aan de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 18b.5
    text: |-
      Gelijktijdig met de toezending, bedoeld in het vierde lid, wordt het rapport in afschrift toegezonden of uitgereikt
      aan de persoon, bedoeld in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: 18b.6
    text: |-
      Op verzoek van de in het vijfde lid bedoelde persoon die het rapport wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, zorgt de toezichthouder, bedoeld in het eerste lid, er zoveel mogelijk voor
      dat de in het rapport vermelde informatie aan hem wordt medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel18b
  - number: '19.1'
    text: |-
      Indien de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar voornemens is om degene door wie een
      beboetbaar feit is begaan een boete op te leggen, wordt deze hiervan in kennis gesteld onder vermelding van de
      gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: '19.2'
    text: |-
      Op verzoek van de in het eerste lid bedoelde persoon die de kennisgeving wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, zorgt de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar
      er zoveel mogelijk voor dat de in de kennisgeving vermelde gronden aan hem worden medegedeeld in voor hem
      begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: '19.3'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de op grond van
      [artikel 19a, eerste lid][ref2], aangewezen ambtenaar binnen een door hem te bepalen termijn de persoon, bedoeld
      in het eerste lid, in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen
      alvorens de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: '19.4'
    text: |-
      Indien de persoon, bedoeld in het derde lid, zijn zienswijze mondeling naar voren brengt en hij de Nederlandse taal
      onvoldoende begrijpt, zorgt de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar, op diens verzoek
      ervoor dat een tolk wordt benoemd die hem kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan
      geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19a.1
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar legt namens hem de boete op aan degene
      op wie de verplichtingen rusten welke voortvloeien uit deze wet, voor zover het niet naleven daarvan is aangeduid
      als een beboetbaar feit.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19a
  - number: 19a.2
    text: |-
      De terzake van deze wet gestelde beboetbare feiten, gelden ten opzichte van elk persoon, met of ten aanzien van wie
      een beboetbaar feit is begaan.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19a
  - number: 19b.1
    text: |-
      Geen boete wordt opgelegd indien degene op wie de verplichtingen rusten welke voortvloeien uit deze wet, is
      overleden.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19b
  - number: 19b.2
    text: Geen boete wordt opgelegd, indien een beboetbaar feit tevens een strafbaar feit oplevert.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19b
  - number: 19c
    text: |-
      Een beboetbaar feit wordt aangemerkt als een strafbaar feit indien binnen een periode van 48 maanden tweemaal voor
      een zelfde feit, elk afzonderlijk in een periode van maximaal 24 maanden voorafgaand aan dat feit, een boete is
      opgelegd en onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19c
  - number: 19d.1
    text: 'De hoogte van de boete, die voor een beboetbaar feit kan worden opgelegd, is, indien begaan door:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19d
  - number: 19d.1.a
    text: een natuurlijk persoon, gelijk aan de geldsom van ten hoogste € 11 250,
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19d
  - number: 19d.1.b
    text: een rechtspersoon, gelijk aan de geldsom van ten hoogste € 45 000.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19d
  - number: 19d.2
    text: |-
      Onverminderd het eerste lid verhoogt de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar de boete
      met 50% van de geldsom, indien terzake het plegen van het beboetbare feit nog geen 24 maanden zijn verstreken nadat
      het feit is geconstateerd en het opleggen van een vroegere boete wegens het niet naleven van dezelfde wettelijke
      verplichting onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19d.3
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep de
      hoogte van de boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 19e.1
    text: |-
      Een boete wordt opgelegd bij beschikking van de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19e.2
    text: 'In de beschikking wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
  - number: 19e.2.a
    text: de hoogte van de boete;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
  - number: 19e.2.b
    text: het beboetbare feit ter zake waarvan de boete opgelegd wordt;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
  - number: 19e.2.c
    text: |-
      de natuurlijke persoon of rechtspersoon op wie de verplichting rust tot naleving van deze wet, voor zover deze
      verplichting is aangeduid als beboetbaar feit;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
  - number: 19e.2.d
    text: de bij het beboetbare feit betrokken persoon of personen;
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
  - number: 19e.2.e
    text: de termijn waarbinnen de boete moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
  - number: 19e.3
    text: |-
      De beschikking wordt gegeven binnen dertien weken na dagtekening van het rapport, bedoeld in [artikel 18b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel18b
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 18b
        paragraaf: IV
  - number: 19e.4
    text: |-
      Op verzoek van de in het tweede lid, onderdeel c, bedoelde persoon die de inhoud van de beschikking wegens zijn
      gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, zorgt de ambtenaar, bedoeld in het eerste lid,
      er zoveel mogelijk voor dat de in die beschikking vermelde informatie aan hem wordt medegedeeld in een voor hem
      begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19e
  - number: 19f.1
    text: |-
      De bevoegdheid om een boete op te leggen vervalt na verloop van twee jaren na de dag waarop het beboetbare feit
      is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19f
  - number: 19f.2
    text: De beslissing om een boete op te leggen stuit de in het eerste lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19f
  - number: 19g.1
    text: |-
      De boete wordt betaald binnen zes weken nadat de beschikking, bedoeld in [artikel 19e, eerste lid][ref1], is
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19e
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19e
        paragraaf: IV
  - number: 19g.2
    text: |-
      Bij overlijden van degene aan wie een boete is opgelegd, vervalt de opgelegde boete voor zover de geldsom nog niet
      is geïnd.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19g
  - number: 19h.1
    text: |-
      Bij gebreke van betaling maant de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar degene aan wie
      de boete is opgelegd schriftelijk aan binnen een termijn van twee weken alsnog aan zijn verplichtingen te voldoen.
      De verschuldigde boete wordt verhoogd met de kosten die op de aanmaning betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19h.2
    text: |-
      De aanmaning bevat de aanzegging, dat de boete, voor zover deze binnen de in de aanmaning gestelde termijn niet
      wordt voldaan, wordt ingevorderd overeenkomstig [artikel 19i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19i
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19i
        paragraaf: IV
  - number: 19i.1
    text: |-
      Bij gebreke van betaling vordert de op grond van [artikel 19a, eerste lid][ref1], aangewezen ambtenaar van degene
      aan wie de boete is opgelegd de verschuldigde boete, verhoogd met de op de aanmaning en invordering betrekking
      hebbende kosten, bij dwangbevel in.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19a
        paragraaf: IV
  - number: 19i.2
    text: |-
      Het dwangbevel wordt op kosten van de degene aan wie de boete is opgelegd bij deurwaardersexploit betekend en
      levert een executoriale titel op in de zin van [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 19i.3
    text: |-
      Gedurende zes weken na de dag van betekening van het dwangbevel staat verzet tegen het dwangbevel open door
      dagvaarding van de Staat.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19i
  - number: 19i.4
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de beschikking, bedoeld in [artikel 19e, eerste lid][ref1],
      niet is ontvangen of dat de bij die beschikking opgelegde boete ten onrechte of op een te hoge geldsom is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19e
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19e
        paragraaf: IV
  - number: 19i.5
    text: Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningsrechter desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19i
  - number: 19j
    text: |-
      Indien een boete ten onrechte is opgelegd, wordt de betaalde geldsom, vermeerderd met de wettelijke rente, binnen
      zes weken nadat is vastgesteld dat de boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel19j
  - number: '20'
    text: |-
      Een tewerkstellingsvergunning anders dan die bedoeld in [artikel 11, tweede en derde lid][ref1], behoudt haar
      geldigheid, totdat de termijn voor het instellen van beroep tegen een beschikking, inhoudende de intrekking van die
      vergunning is verstreken, of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel11
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '11'
        paragraaf: II
  - number: '21'
    text: |-
      [Artikel 71, eerste tot en met vierde lid, van de Vreemdelingenwet 2000][ref1] is van toepassing ten aanzien
      van beroepen tegen besluiten, gegeven op grond van deze wet, met uitzondering van een beschikking als bedoeld in
      [artikel 19e, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel19e
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: 19e
        paragraaf: IV
  - number: '22'
    text: Onze Minister stelt nadere regels ter bevordering van een goede uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel22
  - number: '23'
    text: |-
      Indien een werkgever een vreemdeling arbeid doet verrichten in strijd met [artikel 2][ref1], wordt de vreemdeling
      vermoed gedurende ten minste zes maanden werkzaam te zijn voor die werkgever tegen een beloning en een arbeidsduur
      die in de betreffende bedrijfstak gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: '24.1'
    text: |-
      Een verklaring, verleend krachtens de artikelen 2 en 3 van de Wet arbeid buitenlandse werknemers, wordt gedurende
      drie jaar na het tijdstip van inwerkingtreding van deze wet gelijkgesteld met een aantekening als bedoeld in
      [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '4'
        paragraaf: II
  - number: '24.2'
    text: |-
      Een vergunning, verleend krachtens artikel 4 van de Wet arbeid buitenlandse werknemers, wordt voor de
      geldigheidsduur daarvan, doch ten hoogste gedurende drie jaar na het tijdstip van inwerkingtreding van deze wet,
      gelijkgesteld met een tewerkstellingsvergunning als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
        paragraaf: II
  - number: '28'
    text: De Wet arbeid buitenlandse werknemers wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel28
  - number: '29'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel29
  - number: '30'
    text: 'Deze wet wordt aangehaald als: Wet arbeid vreemdelingen.'
    url: https://wetten.overheid.nl/BWBR0007149/2005-01-01#Artikel30
