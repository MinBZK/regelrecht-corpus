  - number: '4'
    text: |-
      Bij een aanvraag voor een EASA-standaard-BvL en een EASA-beperkt-BvL wordt een volledig ingevuld en ondertekend
      acceptatierapport conform het model als opgenomen in [bijlage 1][ref1] bij deze regeling betreffende de BvL-
      acceptatiekeuring gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030372
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel4
