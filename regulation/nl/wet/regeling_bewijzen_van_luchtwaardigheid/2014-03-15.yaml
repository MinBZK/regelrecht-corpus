  - number: '8'
    text: |-
      Voor een luchtvaartuig dat is vervaardigd in een staat, waarmee Nederland een overeenkomst heeft gesloten inzake
      wederzijdse erkenning van bewijzen van luchtwaardigheid en dat wordt geïmporteerd uit een staat waarmee de minister
      geen overeenkomst heeft gesloten inzake wederzijdse erkenning van bewijzen van luchtwaardigheid, worden ten behoeve
      van de afgifte van een ICAO-standaard-BvL, de in [artikel 5][ref1] genoemde gegevens ingediend en daarnaast de
      volgende documenten overgelegd:

      a. het destijds door de staat, waarin het luchtvaartuig is vervaardigd, afgegeven BvL voor export;

      b. documenten waaruit blijkt dat het luchtvaartuig in overeenstemming is met het door de minister geaccepteerd
      type-ontwerp, dan wel met een aanvullend type-certificaat dat voor het type-ontwerp is afgegeven;

      c. documenten waaruit blijkt dat de van toepassing zijnde luchtwaardigheidsaanwijzingen als bedoeld in
      [artikel 9][ref2] zijn uitgevoerd; en

      d. documenten waaruit blijkt dat het luchtvaartuig na inspectie luchtwaardig is bevonden en geschikt voor veilige
      operatie.


      [ref1]: https://wetten.overheid.nl/BWBR0030372#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030372#Artikel9
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel8
    references:
