preamble:
  text: |-
    Gelet op artikel 3.24 van de Wet luchtvaart, en de artikelen 8, derde lid, 13, aanhef en onderdelen a, b, en c, en
    artikel 20 van het Besluit luchtvaartuigen 2008;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AR:* Airworthiness Review, beoordeling van de luchtwaardigheid van een luchtvaartuig conform Part M, subpart I,
      van [verordening (EG) nr. 2042/2003](32003R2042);
        - *algemene luchtvaart:* luchtvaart met vleugelvliegtuigen met een maximale startmassa van 5700 kg of
      minder, helikopters met een maximale startmassa van 2730 kg of minder, ballonnen, heteluchtschepen en
      (motor)zweefvliegtuigen;
        - *BvL-acceptatiekeuring:* inspectie van een luchtvaartuig in het kader van de afgifte van een bewijs van
      luchtwaardigheid, naar aanleiding waarvan de minister wordt geadviseerd over de luchtwaardigheid van dat
      luchtvaartuig;
        - *BvL-verlengingsinspectie:* inspectie van een luchtvaartuig in het kader van de verlenging van een bewijs
      van luchtwaardigheid, naar aanleiding waarvan de minister wordt geadviseerd over de luchtwaardigheid van dat
      luchtvaartuig;
        - *erkend bedrijf:* bedrijf dat door de minister op grond van
      [artikel 17 van het Besluit luchtvaartuigen 2008][ref1] is erkend;
        - *exportinspectie:* inspectie van een luchtvaartuig op luchtwaardigheidseisen van het importerende land in
      het kader van de export van het luchtvaartuig, naar aanleiding waarvan de minister wordt geadviseerd over de
      luchtwaardigheid van dat luchtvaartuig;
        - *FAA:* Federal Aviation Administration, de Amerikaanse luchtvaartautoriteit;
        - *geaccepteerd type-ontwerp:* type-ontwerp dat naar het oordeel van de minister voldoet aan een ontwerp dat is
      goedgekeurd conform ICAO Annex 8 door de staat van ontwerp, zijnde een verdragsland, door middel van een civiel
      goedgekeurd type-ontwerp;
        - *gemachtigde:* door een erkend bedrijf aangewezen personeelslid, dat gemachtigd is een BvL-acceptatiekeuring, een
      BvL-verlengingsinspectie of een exportinspectie uit te voeren en het rapport daarover voorzien van een verklaring
      als bedoeld in artikel 9, onderdeel b, te ondertekenen;
        - *maximale startmassa:* massa die een luchtvaartuig mag hebben wanneer het zich van het aardoppervlak verheft;
        - *minister:* Minister van Infrastructuur en Milieu;
        - *orphan aircraft:* reeds in het Nederlandse luchtvaartuigregister ingeschreven luchtvaartuig waarvan het ICAO-
      BvL door de minister is vervangen door een speciaal-BvL, als gevolg van het intrekken door de staat van ontwerp van
      zijn verklaring tot ondersteuning van het ontwerp;
        - *Transport Canada:* de Canadese luchtvaartautoriteit;
        - *verdragsland:* land waarmee in het kader van de volgende verdragen een overeenkomst is gesloten inzake de
      wederzijdse erkenning van bewijzen van luchtwaardigheid: het op 13 september 1995 te ’s-Gravenhage tot stand
      gekomen Verdrag tussen de Verenigde Staten van Amerika en het Koninkrijk der Nederlanden inzake de bevordering
      van de veiligheid van de luchtvaart (Trb. 1996, 3), de op 17 december 2009 te Brussel tot stand gekomen
      Luchtvervoersovereenkomst tussen Canada en de Europese Gemeenschap en haar lidstaten (Trb. 2010, 211) en, de op
      22 april 1960 te Parijs gesloten Multilaterale Overeenkomst inzake bewijzen van luchtwaardigheid van ingevoerde
      luchtvaartuigen (Trb. 1961, 117);
        - *Verdrag van Chicago:* het op 7 december 1944 te Chicago tot stand gekomen verdrag inzake de internationale
      burgerluchtvaart (Trb. 1973, 109).


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
