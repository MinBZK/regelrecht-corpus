        bwb_id: BWBR0030372
  - number: '5'
    text: |-
      Bij een aanvraag voor een ICAO-standaard-BvL worden ten minste ingediend:

      a. een gewichts- en zwaartepuntsrapport en indien vereist door de van toepassing zijnde luchtwaardigheidseisen,
      een beladingsschema;

      b. het vlieghandboek, indien vereist door de van toepassing zijnde luchtwaardigheidseisen;

      c. de historische gegevens ter vaststelling van de productie, modificatie en onderhoudsstandaard van het
      luchtvaartuig;

      d. een nauwkeurige omschrijving van de eventuele afwijkingen ten opzichte van het geaccepteerde type-ontwerp.
      Indien de aanvrager hieraan niet kan voldoen, worden de gegevens ingediend, aan de hand waarvan de bedoelde
      afwijkingen kunnen worden vastgesteld; en

      e. een volledig ingevuld en ondertekend acceptatierapport betreffende de BvL-acceptatiekeuring conform het model
      als opgenomen in [bijlage 1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0030372
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel5
    references:
