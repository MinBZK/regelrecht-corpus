        artikel: '9'
        paragraaf: '4'
  - number: '9'
    text: |-
      Voorafgaand aan de afgifte van een ICAO-standaard-BvL worden de verplichte luchtwaardigheidsaanwijzingen van het
      land van ontwerp en de Nederlandse bijzondere luchtwaardigheidsaanwijzingen opgevolgd.
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel9
  - number: '10'
    text: |-
      Bij een aanvraag voor een export-BvL worden de volgende gegevens ingediend:

      a. een verklaring van de bevoegde autoriteit van de staat van invoer waarin wordt vermeld welke
      luchtwaardigheidseisen van toepassing zijn, alsmede de eventuele afwijkingen van de luchtwaardigheidseisen die door
      de staat van invoer worden geaccepteerd;

      b. een volledig ingevuld en ondertekend inspectierapport conform het model als opgenomen in [bijlage 1][ref1]
      bij deze regeling betreffende de exportinspectie, die niet eerder is uitgevoerd dan 60 dagen voorafgaande aan
      de datum van de aanvraag voor een export BvL, waaruit blijkt en waarin wordt verklaard dat het luchtvaartuig in
      overeenstemming is met de onder a. genoemde luchtwaardigheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0030372
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0030372
  - number: '11'
    text: |-
      1 De eigenaar of houder van een luchtvaartuig dient een aanvraag voor verlenging van de termijn van geldigheid van
      een ICAO-standaard-BvL dan wel een speciaal-BvL van een orphan aircraft in bij de minister.

      2 Bij een aanvraag als bedoeld in het eerste lid worden de volgende bescheiden gevoegd:

      a. een volledig ingevuld en ondertekend inspectierapport van de BvL-verlengingsinspectie, conform het model als
      opgenomen in [bijlage 2][ref1] bij deze regeling, uitgevoerd door een daartoe erkend bedrijf, of

      b. een inspectierapport van een volledige AR, uitgevoerd door een daartoe door de minister erkende CAMO.

      3 Een inspectierapport wordt ten minste 8 dagen voor de vervaldatum van de termijn van geldigheid van het BvL of
      het ARC ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0030372
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030372
  - number: '12'
    text: |-
      1 De verlenging van de termijn van geldigheid van een ICAO-standaard-BvL dan wel een speciaal-BvL van een orphan
      aircraft kan tot hoogstens zes maanden na het verstrijken van de op het BvL vermelde termijn van geldigheid
      geschieden, indien in het inspectierapport een negatief advies wordt gegeven over de luchtwaardigheid van het
      luchtvaartuig.

      2 Bij verlenging van de termijn van geldigheid van een ICAO-standaard-BvL of een speciaal-BvL van een orphan
      aircraft, of bij herafgifte van een ARC wordt aan de aanvrager van de verlenging een nieuw BvL of ARC gezonden,
      waaruit blijkt tot en met welke datum het document geldig is.

      6 Voor een Nederlands luchtvaartuig dat volledig wordt ingezet voor niet-militaire staatsactiviteiten of diensten
      wordt het ICAO-standaard-BvL voor ten hoogste 3 jaar geldig gehouden door telkens na 1 en 2 jaar een eenvoudige AR
      inspectie overeenkomstig Part M.A.901 (f) van verordening (EG) nr. 2042/2003 uit te voeren.
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel12
  - number: '13'
    text: |-
      1 De minister kan een steekproef uitvoeren op een BvL-verlengingsinspectie of een AR in het kader van het houden
      van toezicht op het erkende bedrijf.

      2 Op de aanvraag, bedoeld in [artikel 11, eerste lid][ref1], wordt door de eigenaar of houder van het luchtvaartuig
      dat behoort tot de algemene luchtvaart, aangegeven op welke datum en op welke plaats in Nederland het luchtvaartuig
      gereed zal staan voor een mogelijke steekproef.

      3 Tussen de datum waarop de aanvraag bij de minister wordt ingediend en de datum van de mogelijke steekproef wordt
      een termijn van ten minste 8 dagen aangehouden.

      4 Voor een luchtvaartuig dat niet behoort tot de algemene luchtvaart worden zo nodig datum, tijdstip en plaats
      door de minister, na overleg met de eigenaar of houder van het luchtvaartuig, vastgesteld en schriftelijk aan de
      eigenaar of houder meegedeeld.

      5 De eigenaar of houder van het luchtvaartuig neemt zo spoedig mogelijk contact op met de minister als het
      luchtvaartuig door overmacht niet op de op de aanvraag aangegeven of door de minister vastgestelde plaats of datum
      gereed kan staan voor een mogelijke steekproef.


      [ref1]: https://wetten.overheid.nl/BWBR0030372#Artikel11
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030372
        artikel: '11'
        paragraaf: '6'
  - number: '14'
    text: |-
      1 Indien is gebleken dat de gegevens, zoals door de minister zijn vermeld op een BvL of een ARC, onjuist zijn,
      wordt een BvL of een ARC dat de juiste gegevens vermeldt, aan de eigenaar of houder van het luchtvaartuig gezonden.

      2 De eigenaar of houder zendt een eerder ontvangen BvL of ARC binnen een week na de datum van verzending van het in
      het eerste lid bedoelde gewijzigde exemplaar aan de minister.
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel14
  - number: '15'
    text: |-
      Bij de overdracht van een luchtvaartuig wordt een BvL of een ARC door de voormalige eigenaar of houder van dat
      luchtvaartuig overgedragen aan de nieuwe eigenaar of houder van dat luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel15
  - number: '16'
    text: |-
      1 Een BvL of een door de minister uitgegeven ARC wordt door de minister vernieuwd, bij verlies of indien het
      onleesbaar, beschadigd of anderszins onbruikbaar is geworden.

      2 Bij verlies wordt bij de aanvraag tot vernieuwing van een BvL of een ARC een afschrift van het proces-verbaal van
      de aangifte van verlies overgelegd.

      3 Indien een BvL of een ARC wegens verlies is vernieuwd en het verloren document wordt teruggevonden, zendt de
      eigenaar of houder van het luchtvaartuig het teruggevonden BvL of ARC zo spoedig mogelijk aan de minister.

      4 Indien een BvL of een ARC anders dan wegens verlies is vernieuwd, zendt de eigenaar of houder van het
      luchtvaartuig het oorspronkelijke BvL of ARC binnen een week na de datum van verzending van het vernieuwde document
      aan de minister.
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel16
  - number: '17'
    text: |-
      1 Een BvL-acceptatiekeuring, een BvL-verlengingsinspectie dan wel een exportinspectie wordt uitgevoerd door een
      erkend bedrijf.

      2 Wanneer bijzondere omstandigheden daartoe aanleiding geven kan de minister een BvL-acceptatiekeuring, een BvL-
      verlengingsinspectie, een exportinspectie dan wel een AR uitvoeren.

      3 De minister voert een BvL-acceptatiekeuring, een BvL-verlengingsinspectie dan wel een exportinspectie in ieder
      geval uit wanneer er geen door hem daartoe erkend bedrijf is.

      4 De minister voert een AR in ieder geval uit wanneer er geen daartoe erkende CAMO is.

      5 Indien een BvL-acceptatiekeuring, een BvL-verlengingsinspectie, een exportinspectie dan wel een AR door de
      minister in het buitenland wordt uitgevoerd worden de eventuele kosten van een door hem te verrichten onderzoek in
      het kader van de inspectie door de eigenaar of houder van het betreffende luchtvaartuig gedragen.
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel17
  - number: '18'
    text: |-
      1 Degene die bevoegd is tot het uitvoeren van een BvL-verlengingsinspectie of een exportinspectie bepaalt de
      inhoud van de technische inspectie, met dien verstande dat in de algemene luchtvaart ten minste de ‘check and
      inspect’-punten van de 100-uursinspectie of jaarlijkse inspectie of een daaraan gelijkwaardige inspectie worden
      uitgevoerd, indien de laatste inspectie langer dan een half jaar geleden heeft plaatsgevonden.

      2 Een acceptatiekeuring wordt uitgevoerd conform de in [bijlage 1][ref1] opgenomen lijst van items.

      3 De BvL-verlengingsinspectie wordt niet eerder dan twee maanden voor het verlopen van de termijn van geldigheid
      van het bewijs van luchtwaardigheid uitgevoerd.

      4 Uiterlijk op de ochtend van de datum van de steekproef, bedoeld in [artikel 13][ref2], is het inspectierapport
      conform het model volgens [bijlage 2][ref3] voor de minister beschikbaar.


