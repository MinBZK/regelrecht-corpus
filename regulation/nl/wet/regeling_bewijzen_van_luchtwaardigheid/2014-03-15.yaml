        bwb_id: BWBR0030372
  - number: '6'
    text: |-
      1 Voor een luchtvaartuig dat voldoet aan een door de minister geaccepteerd type-ontwerp, dat is ontworpen, gebouwd,
      beproefd en uitgerust in de Verenigde Staten van Amerika en wordt geïmporteerd uit de Verenigde Staten van Amerika,
      worden ten behoeve van de afgifte van een ICAO-standaard-BvL de in [artikel 5][ref1] genoemde gegevens ingediend en
      worden daarnaast gegevens overgelegd waarmee wordt aangetoond dat het luchtvaartuig:

      a. is ontworpen, gebouwd, beproefd en uitgerust overeenkomstig de van toepassing zijnde wetten, bepalingen en eisen
      van de Verenigde Staten van Amerika;

      b. voldoet aan alle bijzondere eisen die op de datum van de aanvraag voor een ICAO-standaard-BvL van toepassing
      zijn, voor zover die eisen ter kennis zijn gebracht van de Verenigde Staten van Amerika;

      c. is voorzien van een door de FAA afgegeven BvL voor export naar Nederland dat niet eerder is afgegeven dan 60
      dagen onmiddellijk voorafgaand aan de datum van de aanvraag voor een ICAO-standaard-BvL.

      2 Voor een luchtvaartuig dat voldoet aan een door de minister geaccepteerd type-ontwerp, dat is ontworpen, gebouwd,
      beproefd en uitgerust in Canada en wordt geïmporteerd uit Canada worden ten behoeve van de afgifte van een ICAO-
      standaard-BvL de in [artikel 5][ref2] genoemde gegevens ingediend en worden daarnaast gegevens overgelegd waarmee
      wordt aangetoond dat het luchtvaartuig:

      a. is ontworpen, gebouwd, beproefd en uitgerust overeenkomstig de van toepassing zijnde wetten, bepalingen en eisen
      van Canada;

      b. voldoet aan alle bijzondere eisen die op de datum van de aanvraag voor een ICAO-standaard-BvL van toepassing
      zijn;

      c. is voorzien van een door Transport Canada afgegeven BvL voor export naar Nederland dat niet eerder is afgegeven
      dan 60 dagen onmiddellijk voorafgaand aan de datum van de aanvraag voor een ICAO-standaard-BvL.

      3 Voor een luchtvaartuig dat voldoet aan een door de minister geaccepteerd type-ontwerp, dat is ontworpen, gebouwd,
      beproefd en uitgerust op het grondgebied van een overeenkomstsluitende staat als bedoeld in de Multilaterale
      Overeenkomst inzake bewijzen van luchtwaardigheid van ingevoerde luchtvaartuigen (Trb. 1961, 117) en die binnen het
      raam van die overeenkomst wordt geïmporteerd, worden ten behoeve van de afgifte van een ICAO-standaard-BvL de in
      [artikel 5][ref3] genoemde gegevens ingediend en worden daarnaast gegevens overgelegd waarmee wordt aangetoond dat
      het luchtvaartuig:

      a. is ontworpen, gebouwd, beproefd en uitgerust overeenkomstig de van toepassing zijnde regelgeving en eisen van de
      staat waarin dat is gebeurd;

      b. voldoet aan de van toepassing zijnde minimum eisen die zijn vastgesteld overeenkomstig het Verdrag van Chicago;

      c. voldoet aan alle overige bijzondere eisen, die op de datum van de aanvraag voor een ICAO-standaard-BvL van
      toepassing zijn, voor zover die eisen ter kennis zijn gebracht van de overeenkomstsluitende staten.

      d. is voorzien van een door de exporterende staat afgegeven BvL of een BvL voor export naar Nederland, dat niet
      eerder is afgegeven dan 60 dagen onmiddellijk voorafgaand aan de datum van de aanvraag voor een ICAO-standaard-BvL.


      [ref1]: https://wetten.overheid.nl/BWBR0030372#Artikel5
