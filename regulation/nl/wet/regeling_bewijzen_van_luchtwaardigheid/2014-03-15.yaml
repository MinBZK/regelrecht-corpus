    text: |-
      1 De minister kan toestaan dat bij de aanvraag voor een bewijs van luchtwaardigheid gegevens op microfilms of
      computer-gegevensdragers worden verstrekt.

      2 De aanvrager verstrekt daartoe benodigde apparatuur aan de minister.

      3 Deze apparatuur dient binnen enkele seconden een afdruk van het geprojecteerde beeld of de gegevens te kunnen
      vervaardigen.
    url: https://wetten.overheid.nl/BWBR0030372/2014-03-15#Artikel2
  - number: '3'
    text: |-
      1 Deze regeling is niet van toepassing op amateurbouwluchtvaartuigen en MLA’s.

      2 Indien de eigenaar of houder van een amateurbouwluchtvaartuig of MLA daarom verzoekt zijn de
      [artikelen 11, derde lid, aanhef en onderdeel a, en vijfde lid][ref1], [13][ref2], [17][ref3] en [18][ref4]
      voorzover het betreft verlengingsinspecties, tevens van toepassing op amateurbouwluchtvaartuigen en MLA’s.


