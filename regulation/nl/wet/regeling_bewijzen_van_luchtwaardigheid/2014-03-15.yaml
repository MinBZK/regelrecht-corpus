  - number: '7'
    text: |-
      1 Voor een luchtvaartuig dat voldoet aan een door de minister geaccepteerd type-ontwerp, dat in de Verenigde
      Staten van Amerika is vervaardigd en dat uit een andere staat waarmee de minister een overeenkomst heeft
      gesloten, aangaande wederzijdse erkenning van bewijzen van luchtwaardigheid, wordt geïmporteerd, worden ten
      behoeve van de afgifte van een ICAO-standaard-BvL de in [artikel 5][ref1] genoemde gegevens ingediend, de in
      [artikel 6, eerste lid, onderdeel a en b][ref2] bedoelde gegevens overgelegd en door de aanvrager nog de volgende
      bescheiden ingediend:

      a. het destijds afgegeven Amerikaanse BvL voor export;

      b. een BvL, of een BvL voor export naar Nederland, afgegeven door de staat waaruit het luchtvaartuig wordt
      geïmporteerd, niet eerder dan 60 dagen, onmiddellijk voorafgaande aan de datum van de aanvraag voor een ICAO-
      standaard-BvL.

      2 Voor een luchtvaartuig dat voldoet aan een door de minister geaccepteerd type-ontwerp, dat in Canada
      is vervaardigd en dat uit een andere staat waarmee de minister een overeenkomst heeft gesloten, aangaande
      wederzijdse erkenning van bewijzen van luchtwaardigheid, wordt geïmporteerd, worden ten behoeve van
      de afgifte van een ICAO-standaard-BvL, de in [artikel 5][ref3] genoemde gegevens ingediend, de in
      [artikel 6, tweede lid, onderdelen a en b][ref4] bedoelde gegevens overgelegd en door de aanvrager nog de volgende
      gegevens ingediend:

      a. het destijds afgegeven Canadese BvL voor export;

      b. een BvL of een BvL voor export naar Nederland, afgegeven door de staat waaruit het luchtvaartuig wordt
      geïmporteerd, niet eerder dan 60 dagen, onmiddellijk voorafgaande aan de datum van de aanvraag voor een ICAO-
      standaard-BvL.

      3 Voor een luchtvaartuig dat voldoet aan een door de minister geaccepteerd type-ontwerp, dat is vervaardigd in
      een overeenkomstsluitende staat als bedoeld in de Multilaterale Overeenkomst inzake bewijzen van luchtwaardigheid
      van ingevoerde luchtvaartuigen (Trb. 1961, 117) en dat uit een andere staat waarmee de minister een overeenkomst
      heeft gesloten aangaande wederzijdse erkenning van bewijzen van luchtwaardigheid, wordt geïmporteerd, worden ten
      behoeve van de afgifte van een ICAO-standaard-BvL, de in [artikel 5][ref5] genoemde gegevens ingediend, de in
      [artikel 6, derde lid, onderdelen a tot en met c][ref6] bedoelde gegevens overgelegd en door de aanvrager nog de
      volgende bescheiden ingediend:

      a. het destijds door de staat, waarin het luchtvaartuig is vervaardigd, afgegeven export-BvL;

      b. een BvL, of een BvL voor export naar Nederland, afgegeven door de staat waaruit het luchtvaartuig wordt
      geïmporteerd, niet eerder dan 60 dagen, onmiddellijk voorafgaande aan de datum van de aanvraag voor een ICAO-
      standaard-BvL.


