$id: verhaalswet_ongevallen_ambtenaren
regulatory_layer: WET
publication_date: '2019-05-16'
valid_from: '1965-09-15'
bwb_id: BWBR0002500
url: https://wetten.overheid.nl/BWBR0002500/1965-09-15
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wettelijke regeling te treffen voor het verhaal
    van uitkeringen of verstrekkingen, bij ongeval krachtens zijn rechtspositieregeling verleend aan personeel, waarvan
    de bezoldiging of de beloning ten laste komt van de openbare geldmiddelen, en aan de nagelaten betrekkingen van
    dat personeel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt onder ambtenaar verstaan:'
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel1
  - number: 1.a
    text: |-
      degene, die uit hoofde van een dienstverhouding een bezoldiging of een beloning geniet, welke hetzij direct, hetzij
      ingevolge een subsidieregeling ten laste komt van de openbare geldmiddelen;
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel1
  - number: 1.b
    text: de dienstplichtige militair.
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel1
  - number: '2.1'
    text: |-
      Het lichaam dat aan of ten behoeve van een ambtenaar krachtens diens rechtspositieregeling uitkeringen of
      verstrekkingen verleent ter zake van een aan deze overkomen ongeval, heeft voor de kosten van deze voorzieningen
      verhaal op degene die, bij ontbreken van die voorzieningen, in verband met het veroorzaken van het ongeval jegens
      de ambtenaar naar burgerlijk recht aansprakelijk zou zijn voor de alsdan door deze geleden schade. Het verhaal kan
      niet ten nadele van de ambtenaar worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel2
  - number: '2.2'
    text: |-
      Is de ambtenaar ten gevolge van het ongeval geheel of voor een deel van zijn normale diensttijd verhinderd
      zijn dienst te verrichten, dan worden de krachtens zijn rechtspositieregeling over de periode van die gehele of
      gedeeltelijke verhindering uitbetaalde bezoldiging of beloning en hiermede verband houdende uitkeringen - met
      inbegrip van de ingehouden loonbelasting en van de premie voor sociale voorzieningen - geheel of voor een met de
      mate van de verhindering overeenkomend deel onder de in het eerste lid bedoelde uitkeringen begrepen.
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de uitkeringen of verstrekkingen, krachtens de voor de
      ambtenaar geldende rechtspositieregeling ter zake van het ongeval aan of ten behoeve van hemzelf verleend na zijn
      ontslag dan wel aan of ten behoeve van zijn nagelaten betrekkingen na zijn overlijden ten gevolge van het ongeval.
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel2
  - number: '2.4'
    text: |-
      Voor zover het eerste lid niet rechtstreeks van toepassing is, is het van overeenkomstige toepassing op de
      uitkeringen, door het lichaam, dat belast is met de uitvoering van een publiekrechtelijke ziektekostenregeling voor
      ambtenaren, aan een deelnemer in die regeling verleend ter zake van een aan deze of aan zijn gezinsleden overkomen
      ongeval.
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel2
  - number: '3'
    text: |-
      Hij die op grond van het bepaalde in [artikel 2][ref1] wordt aangesproken, is tegenover het verhalend lichaam
      niet gehouden tot betaling van een hoger bedrag dan hij zou hebben moeten betalen, wanneer hij, bij ontbreken
      van de in [artikel 2][ref2] bedoelde voorzieningen, door de getroffene of door diens nagelaten betrekkingen tot
      schadevergoeding was aangesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0002500#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002500#Artikel2
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002500
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002500
        artikel: '2'
  - number: '4'
    text: |-
      Indien ten gevolge van een subsidie- of vergoedingsregeling de in [artikel 2][ref1] bedoelde voorzieningen in feite
      ten laste komen van een of meer andere lichamen dan het lichaam dat tot verlening daarvan is gehouden, komt het
      verhaal aan dat andere lichaam of, aan elk voor een evenredig deel, aan die andere lichamen toe.


      [ref1]: https://wetten.overheid.nl/BWBR0002500#Artikel2
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002500
        artikel: '2'
  - number: '6.1'
    text: |-
      Bepalingen, krachtens welke de aanspraken van een ambtenaar of gewezen ambtenaar dan wel van hun nagelaten
      betrekkingen op uitkeringen of verstrekkingen, als bedoeld in [artikel 2][ref1], afhankelijk worden gesteld van de
      cessie van rechten, welke zij ter zake van het ongeval tegenover derden mochten kunnen doen gelden, vervallen op de
      dag, waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002500#Artikel2
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002500
        artikel: '2'
  - number: '6.2'
    text: |-
      Voor zover vóór de dag, waarop deze wet in werking treedt, reeds uitkeringen of verstrekkingen, als bedoeld in
      [artikel 2][ref1], mochten zijn verleend zonder dat reeds cessie van mogelijke rechten tegenover derden heeft
      plaatsgevonden, blijven de in het eerste lid bedoelde bepalingen ten aanzien van deze uitkeringen of verstrekkingen
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002500#Artikel2
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002500
        artikel: '2'
  - number: '6.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bepalingen in een publiekrechtelijke
      ziektekostenregeling voor ambtenaren, krachtens welke aanspraken van een deelnemer in die regelingen op uitkeringen
      ter zake van een aan deze of aan zijn gezinsleden overkomen ongeval afhankelijk worden gesteld van de cessie van
      rechten, welke zij ter zake van dat ongeval tegenover derden mochten kunnen doen gelden.
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel6
  - number: '7'
    text: Deze wet kan worden aangehaald als "Verhaalswet ongevallen ambtenaren".
    url: https://wetten.overheid.nl/BWBR0002500/1965-09-15#Artikel7
