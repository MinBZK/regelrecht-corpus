preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen ten aanzien van de toegang tot de
    particuliere ziektekostenverzekeringen en ten aanzien van uitbreiding van de personele werkingssfeer van de in
    de Ziekenfondswet (Stb. 1964, 392) geregelde verplichte verzekering, onder opheffing van de in die wet geregelde
    bejaardenverzekering en vrijwillige verzekering, alsmede enige andere wijzigingen in de Ziekenfondswet en andere
    wetten aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003934/1999-01-01#ArtikelAanhef
articles:
  - number: '14'
    text: |-
      1

      2

      3 De ziekenfondsen dragen er zorg voor dat het bedrag dat na de inwerkingtreding van deze wet nog resteert ter
      uitvoering van de vrijwillige verzekering, na aftrek van de door de Ziekenfondsraad verantwoord geachte kosten,
      wordt aangewend op een door Onze Minister en Onze Minister van Financiën, gehoord de Ziekenfondsraad, aan te geven
      wijze ten behoeve van een bij dat besluit aan te geven bestemming.
    url: https://wetten.overheid.nl/BWBR0003934/1999-01-01#Artikel14
