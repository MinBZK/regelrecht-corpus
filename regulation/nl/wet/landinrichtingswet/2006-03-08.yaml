  - number: '147'
    text: |-
      1 Toewijzing van gronden voor doeleinden van openbaar nut, voor zover daarin is voorzien door middel van toepassing
      van [artikel 142, eerste lid, aanhef en onder ][ref1], en [artikel 143, eerste lid, aanhef en onder ][ref2], vindt
      plaats tegen betaling van een tussen de landinrichtingscommissie en het Rijk, een ander openbaar lichaam of een
      andere rechtspersoon overeengekomen en door Onze Minister goedgekeurd bedrag, dat niet minder bedraagt dan de
      werkelijke waarde van de grond. Indien de toewijzing grond betreft waarvan de eigenaar een beroep heeft gedaan
      op het bepaalde in [artikel 146, eerste lid][ref3], vindt deze toewijzing plaats tegen betaling van de in die
      bepalingen omschreven vergoeding.

      2 Behoudens in het geval van [artikel 146, eerste lid][ref4], wordt het door het openbaar lichaam of een andere
      rechtspersoon betaalde bedrag in mindering gebracht op de ingevolge [artikel 222][ref5] ten laste van de eigenaren
      vallende uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel142
