  - number: '59'
    text: |-
      1 De griffier van de rechtbank doet onverwijld bij aangetekende brief afschriften van de ingediende stukken aan de
      andere partij of partijen, voor zover deze hem bekend zijn, en aan de landinrichtingscommissie toekomen.

      2 Op het niet-ontvangen van de stukken kan geen beroep worden gedaan.

      3 Onverwijld zendt de landinrichtingscommissie alle haar ter beschikking staande stukken aan de voorzitter van
      de pachtkamer.

      4 Elke wederpartij kan binnen een maand na de dagtekening van de in het eerste lid bedoelde brief een
      verweerschrift, al dan niet vergezeld van bewijsstukken, bij de voorzitter van de pachtkamer indienen.

      5 De griffier doet onverwijld bij aangetekende brief afschrift van de ingediende stukken aan de andere partij of
      partijen toekomen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel59
  - number: '60'
    text: |-
      1 De voorzitter van de pachtkamer kan nader bewijs of verhoor van partijen of de landinrichtingscommissie bevelen.

      2 Hij doet zo spoedig mogelijk uitspraak en bepaalt bij zijn beschikking hetgeen geregistreerd wordt.

      3 De beslissing van de voorzitter van de pachtkamer is niet een uitspraak ten principale omtrent de
      rechtsverhouding tussen partijen.

      4 Tegen de beslissing staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel60
  - number: '61'
    text: |-
      De landinrichtingscommissie zendt met betrekking tot het in te richten gebied aan gedeputeerde staten een lijst van
      hen, die als pachter zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel61
  - number: '62'
    text: |-
      1 De oproeping tot de stemming geschiedt bij aangetekende brief, waarin wordt gewezen op het rechtsgevolg, hetwelk
      de wet aan de stemming verbindt.

      2 Van de oproeping geschiedt openbare kennisgeving op de wijze, in [artikel 55, tweede lid][ref1], voorgeschreven.

      3 Op het niet-ontvangen van de oproeping kan geen beroep worden gedaan.

      4 De stemming wordt niet gehouden, dan nadat ten minste drie weken zijn verstreken sedert de verzending der
      aangetekende brieven, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel55
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '55'
        hoofdstuk: III
        afdeling: II
  - number: '63'
    text: |-
      1 Men kan in persoon of bij gemachtigde aan de stemming deelnemen.

      2 Niemand kan als gemachtigde van meer dan één persoon optreden.

      3 Als gemachtigde wordt slechts toegelaten hij, die desverlangd aan de voorzitter van het stembureau een
      schriftelijke volmacht overlegt en van wiens machtiging gedeputeerde staten ten minste twee dagen vóór de dag der
      stemming schriftelijk bericht van de lastgever hebben ontvangen.

      4 De voorzitter van het stembureau kan weigeren personen, die de volle ouderdom van achttien jaren niet hebben
      bereikt of die onder curatele zijn gesteld, als gemachtigde toe te laten.

      5 De stemmen worden geheim uitgebracht.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel63
  - number: '64'
    text: |-
      1 Ten behoeve van de stemopneming en de vaststelling van de uitslag der stemming worden stembureaus en een
      hoofdstembureau ingesteld.

      2 De voorzitter van het hoofdstembureau wordt door gedeputeerde staten uit hun midden benoemd.

      3 Ter bijstand van het hoofdstembureau kan een administratief bureau worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel64
  - number: '65'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden met betrekking tot de stemming nadere regelen gesteld.

      2 De in het eerste lid bedoelde regelen kunnen onder meer betrekking hebben op:

      a. de instelling, samenstelling en werkwijze van stembureaus, een hoofdstembureau en een administratief bureau;

      b. de oproeping voor de stemming;

      c. het verlenen van een volmacht;

      d. de verklaring van erfrecht;

      e. de aanwijzing en beschikbaarstelling van stemlokalen en de vergoeding van de daaruit voortvloeiende kosten;

      f. de stembiljetten;

      g. het stemmen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel65
  - number: '66'
    text: |-
      1 Voor het nemen van het besluit tot ruilverkaveling wordt vereist de toestemming:

      a. hetzij van de meerderheid van hen, die met betrekking tot het in te richten gebied in de kadastrale registratie
      als eigenaar staan vermeld, en van hen, die als pachters zijn geregistreerd, gezamenlijk voor zover zij aan de
      stemming deelnemen, met dien verstande dat hij, die met betrekking tot het in te richten gebied in de kadastrale
      registratie als eigenaar staat vermeld en tevens als pachter is geregistreerd, ten behoeve van zichzelf, slechts
      één stem kan uitbrengen;

      b. hetzij van hen, die gezamenlijk van meer dan de helft van de totale grootte, waarvoor stemmen zijn uitgebracht,
      blijkens het kadaster eigenaar dan wel blijkens de registratie pachter zijn van tot het in te richten gebied
      behorende onroerende zaken.

      2 Bij het bepalen van de meerderheid in kadastrale grootte worden de volgende regels in acht genomen:

      a. ingeval onroerende zaken aan twee of meer eigenaren gezamenlijk toebehoren, wordt iedere mede-eigenaar geacht
      eigenaar te zijn van een evenredig deel;

      b. ingeval op onroerende zaken een recht van opstal, erfpacht, vruchtgebruik, gebruik of bewoning bestaat, tellen
      de stemmen van degenen aan wie de bezwaarde eigendom toebehoort en degenen aan wie deze rechten toebehoren elk
      voor de helft van de oppervlakte van de onroerende zaak waarop zodanig recht rust, met dien verstande dat, indien
      een onroerende zaak aan meer dan één van de genoemde rechten is onderworpen, de stemmen van degenen aan wie deze
      rechten toebehoren elk voor een gelijk deel van de helft van de oppervlakte van de onroerende zaak, welke aan deze
      rechten is onderworpen, tellen;

      c. ingeval onroerende zaken verpacht zijn, tellen de stemmen van de eigenaar en van de pachter elk voor de helft
      van de oppervlakte van de onroerende zaak die verpacht is, met dien verstande dat:

      1°. indien een onroerende zaak aan meerdere pachters gezamenlijk is verpacht, de stemmen van de pachters elk voor
      een evenredig deel van de helft van de grootte van de onroerende zaak, die verpacht is, tellen, en

      2°. indien een onroerende zaak is onderverpacht, de stemmen van de pachter en van de onderpachter elk voor een
      evenredig deel van de grootte van de onroerende zaak, waarvoor de pachter stemgerechtigd is, tellen;

      d. ingeval onroerende zaken aan een of meer van de onder *b* bedoelde rechten zijn onderworpen en deze onroerende
      zaken tevens verpacht zijn, tellen de stemmen van degenen aan wie de bezwaarde eigendom toebehoort en degenen
      aan wie deze rechten toebehoren tezamen voor de helft van de grootte van de onroerende zaken, die aan genoemde
      rechten zijn onderworpen en die tevens verpacht zijn. Ten aanzien van deze helft is het bepaalde onder *b* van
      overeenkomstige toepassing.

      3 Stemmen welke van onwaarde zijn worden voor de toepassing van dit artikel niet in aanmerking genomen.

      4 Voor de toepassing van dit artikel worden met personen, die in de kadastrale registratie als eigenaar staan
      vermeld, onderscheidenlijk als pachter zijn geregistreerd, gelijkgesteld zij, die door een verklaring van erfrecht
      als bedoeld in [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1], aantonen erfgenaam van een zodanige
      persoon te zijn. Is de nalatenschap ingevolge [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref2] verdeeld,
      dan wordt met de in de vorige zin bedoelde eigenaar, onderscheidenlijk pachter, gelijkgesteld de in de verklaring
      van erfrecht genoemde echtgenoot of geregistreerde partner van de erflater. Is de nalatenschap niet in Nederland
      opengevallen, dan wordt de verklaring van erfrecht vervangen door een, door de ter plaatse bevoegde autoriteit
      opgestelde en ondertekende, verklaring houdende:

      a. voor zover bekend de naam, voornamen, geboortedatum, de wettelijke woonplaats met adres, het beroep, de
      burgerlijke staat en de datum van overlijden van de erflater;

      b. voor zover bekend de naam, voornamen, geboortedatum, de wettelijke woonplaats met adres, het beroep en de
      burgerlijke staat van de erfgenamen met vermelding van ieders aandeel;

      c. zo mogelijk de naam, voornamen, de geboortedatum en de wettelijke woonplaats met adres van de wettelijke
      vertegenwoordigers van de onder *b* bedoelde personen, daaronder begrepen de bewindvoerders;

      d. een nauwkeurige aanwijzing van de uiterste wil of, bij wettelijke erfopvolging, van de betrekking tussen de
      erflater en de erfgenamen;

      e. een verklaring van de autoriteit, die de akte heeft opgemaakt, dat hij zich van de juistheid van hetgeen daarin
      is vermeld, zo goed mogelijk heeft overtuigd.

      5 Voor de toepassing van dit artikel worden als in de kadastrale registratie vermelde eigenaren uitsluitend
      aangemerkt diegenen, die deze hoedanigheid bezitten aan het einde van de zevende dag, voorafgaande aan die der
      stemming. Het in de vorige volzin bepaalde geldt niet ten aanzien van erfgenamen van personen die op grond van het
      aldaar bepaalde als in de kadastrale registratie vermelde eigenaren worden aangemerkt.

      6 Voor de toepassing van het eerste lid, onder *b*, wordt onder eigenaar niet verstaan degene aan wie de bezwaarde
      eigendom toebehoort van onroerende zaken, voor zover daarop een recht van beklemming rust.

      7 Voor de toepassing van het eerste en het tweede lid, wordt onder grootte verstaan de grootte volgens de
      kadastrale registratie van elk der betrokken percelen en, indien het een gedeelte van een perceel betreft,
      bovendien de grootte van dat gedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel13
