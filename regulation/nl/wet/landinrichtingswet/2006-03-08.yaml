        artikel: '131'
        hoofdstuk: VI
        afdeling: I
  - number: '134'
    text: |-
      1 De eigendom, het beheer en het onderhoud van de openbare wegen, en de waterlopen met de daartoe behorende
      kunstwerken kunnen niet aan het Rijk worden toegewezen of onttrokken dan nadat Onze betrokken Minister daarin heeft
      toegestemd, met dien verstande dat toestemming niet vereist is voor toewijzing van eigendom, beheer en onderhoud
      van openbare wegen en waterlopen met de daartoe behorende kunstwerken welke voorheen bij het Rijk in eigendom,
      beheer en onderhoud waren.

      2 De toestemming, bedoeld in het eerste lid, kan worden onthouden wegens strijd met het recht of het algemeen
      belang.

      3 Wanneer de in [artikel 131, tweede en vierde lid][ref1], bedoelde voorstellen betrekking hebben op een gebied,
      dat in meer dan een provincie is gelegen, wordt het in [artikel 133, eerste lid][ref2], bedoelde besluit genomen
      door gedeputeerde staten van ieder van die provincies voor het gedeelte van zodanig gebied, dat in hun provincies
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel133
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel134
