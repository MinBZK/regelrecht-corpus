  - number: '13'
    text: |-
      Op de voet van het bij of krachtens deze wet bepaalde kan landinrichting plaatsvinden in de vorm van:

      a. herinrichting;

      b. ruilverkaveling;

      c. aanpassingsinrichting, dan wel

      d. ruilverkaveling bij overeenkomst.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel13
  - number: '14'
    text: |-
      1 Voor herinrichting komen in aanmerking gebieden, die ruimtelijk naast een agrarische functie ook in belangrijke
      mate een niet-agrarische functie vervullen of moeten vervullen.

      2 Bij herinrichting worden in ieder geval met betrekking tot één of meer van de in [artikel 5][ref1] genoemde
      aangelegenheden maatregelen en voorzieningen getroffen, al dan niet met inbegrip van herverkaveling op de voet van
      [Hoofdstuk VII][ref2] van het gehele in te richten gebied of van één of meer gedeelten daarvan.

      3 Herverkaveling van het in te richten gebied, of een gedeelte daarvan, kan in één of meer blokken plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003793
        hoofdstuk: VII
  - number: '15'
    text: |-
      1 Voor ruilverkaveling komen in aanmerking gebieden, die ruimtelijk een overwegend agrarische functie, doch niet in
      belangrijke mate een niet-agrarische functie vervullen of moeten vervullen.

      2 Bij ruilverkaveling worden in ieder geval met betrekking tot één of meer van de in [artikel 5][ref1] genoemde
      aangelegenheden, maatregelen en voorzieningen getroffen, met inbegrip van herverkaveling op de voet van
      [Hoofdstuk VII][ref2] van het gehele in te richten gebied.

      3 Herverkaveling van het in te richten gebied kan in één of meer blokken plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003793
        hoofdstuk: VII
  - number: '16'
    text: |-
      1 Aanpassingsinrichting vindt plaats in een gebied in samenhang met het treffen van een op zichzelf staande
      infrastructurele voorziening van nationaal of regionaal belang.

      2 Bij aanpassingsinrichting vindt herverkaveling in één blok plaats en kunnen maatregelen en voorzieningen
      worden getroffen met betrekking tot de infrastructuur, de land-, tuin- en bosbouw, de natuur, het landschap en
      de openluchtrecreatie.

      3 De in het eerste lid bedoelde voorziening maakt geen deel uit van het in het tweede lid bedoelde blok.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel16
  - number: '17'
    text: |-
      Ruilverkaveling bij overeenkomst is de vorm van landinrichting, waarbij drie of meer eigenaren zich verbinden
      bepaalde, hun toebehorende onroerende zaken samen te voegen, de verkregen massa op bepaalde wijze te verkavelen en
      onder elkaar bij notariële akte te verdelen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel17
  - number: '18'
    text: |-
      1 Er is een Voorbereidingsschema Landinrichting.

      2 Het voorbereidingsschema geeft de gebieden aan met betrekking waartoe herinrichting of ruilverkaveling wordt
      voorbereid.

      3 Het voorbereidingsschema wordt jaarlijks vastgesteld.

      4 De vaststelling van het voorbereidingsschema vindt, mede op de grondslag van het structuurschema, plaats door
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel18
  - number: '19'
    text: |-
      1 Gedeputeerde staten doen jaarlijks, elk voor hun provincie, voorstellen aan Onze Minister toekomen ten behoeve
      van de vaststelling van het voorbereidingsschema.

      2 Gedeputeerde staten nemen bij het doen van de in het vorige lid bedoelde voorstellen in aanmerking:

      a. het structuurschema;

      b. de zienswijze van Onze Minister omtrent een overeenkomstig [artikel 23][ref1] ingediend verzoek om
      landinrichting in voorbereiding te nemen;

      c. het provinciaal ruimtelijk beleid, voor zover dit is neergelegd in een streekplan of een besluit van provinciale
      staten, de provinciale planologische commissie gehoord.

      3 Indien gedeputeerde staten voornemens zijn een vorm van landinrichting voor te stellen aan Onze Minister, die
      afwijkt van de vorm van landinrichting zoals deze vervat is in het verzoek, als bedoeld in [artikel 23][ref2],
      horen zij de indieners van het verzoek, alvorens het voorstel aan Onze Minister toe te zenden.

      4 De voorstellen geven voor ieder gebied waarop zij betrekking hebben aan, of herinrichting dan wel ruilverkaveling
      wordt voorgesteld en of het besluit tot herinrichting dan wel het besluit tot ruilverkaveling wordt voorbereid,
      hetzij op de wijze als bedoeld in [Titel 3-6 van dit Hoofdstuk][ref3], hetzij op de wijze als bedoeld in
      [Titel 7 van dit Hoofdstuk][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0003793#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0003793#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '23'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003793
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003793
        hoofdstuk: III
  - number: '20'
    text: |-
      1 Het voorbereidingsschema geeft voor ieder daarop vermeld gebied aan of herinrichting dan wel ruilverkaveling
      wordt voorbereid.

      2 Indien een gebied voor de eerste keer op het voorbereidingsschema wordt vermeld, worden daarbij aangegeven:

      a. de voorlopige grenzen van het in te richten gebied alsmede van ieder tot dat gebied behorend blok;

      b. de overwegingen en uitgangspunten voor het in voorbereiding nemen van herinrichting, onderscheidenlijk
      ruilverkaveling.

      3 Indien een gebied voor de eerste keer op het voorbereidingsschema wordt vermeld en de daarbij aangegeven vorm van
      landinrichting en de wijze van voorbereiding een andere is dan bij het voorstel, dient daarover overeenstemming met
      de gedeputeerde staten te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel20
  - number: '21'
    text: |-
      1 Indien de vaststelling van het voorbereidingsschema tot gevolg heeft dat:

      a. de voorlopige grenzen van het in te richten gebied of van een tot dat gebied behorend blok worden gewijzigd,
      dan wel

      b. voor het in te richten gebied de in voorbereiding zijnde vorm van landinrichting wordt gewijzigd,

      is [artikel 20, tweede en derde lid][ref1], van overeenkomstige toepassing.

      2 Indien de vaststelling van het voorbereidingsschema tot gevolg heeft dat een gebied niet langer wordt vermeld,
      wordt zulks op het voorbereidingsschema aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel20
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '20'
        hoofdstuk: III
  - number: '22'
    text: |-
      1 Onze Minister zendt het voorbereidingsschema toe aan de colleges van gedeputeerde staten en maakt een uittreksel
      van het voorbereidingsschema bekend in de Nederlandse Staatscourant.

      2 Een in het vorig lid bedoeld uittreksel geeft de op het voorbereidingsschema vermelde gebieden aan, alsmede voor
      elk zodanig gebied of herinrichting dan wel ruilverkaveling wordt voorbereid.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel22
  - number: '23'
    text: |-
      Een verzoek om landinrichting in voorbereiding te nemen, kan worden ingediend door:

      a. Onze Minister wie het aangaat;

      b. provinciale staten, colleges van burgemeester en wethouders, besturen van waterschappen en besturen van lichamen
      zoals bedoeld in [artikel 134 van de Grondwet][ref1],

      c. verenigingen met volledige rechtsbevoegdheid en stichtingen, die belangen behartigen welke door landinrichting
      kunnen worden gediend,

      d. natuurlijke personen en rechtspersonen, die gezamenlijk ten minste dertig procent van de oppervlakte van het in
      te richten gebied in eigendom dan wel in gebruik hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '24'
    text: |-
      1 Het verzoek moet schriftelijk en met redenen omkleed worden ingediend bij Onze Minister.

      2 Het verzoek gaat vergezeld van een kaart, waarop het in te richten gebied is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel24
  - number: '25'
    text: |-
      Onze Minister brengt het verzoek onverwijld ter kennis van:

      a. de colleges van gedeputeerde staten van de provincies,

      b. de colleges van burgemeester en wethouders van de gemeenten,

      c. de waterschappen,

      op welker grondgebied het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel25
  - number: '26'
    text: |-
      1 Onze Minister stelt binnen een tijdvak van twee jaren na datum van de indiening van het verzoek, als bedoeld in
      [artikel 24][ref1], zijn zienswijze daaromtrent op en brengt deze schriftelijk ter kennis van:

      a. de colleges van gedeputeerde staten van de provincies,

      b. de colleges van burgemeester en wethouders van de gemeenten,

      c. de waterschappen,

      op welker grondgebied het verzoek betrekking heeft, alsmede van

      d. de indieners van het verzoek of, indien er meer dan vijf indieners zijn, tenminste de eerste vijf ondertekenaars
      van dit verzoek.

      2 De zienswijze bevat:

      a. de grenzen van het gebied alsmede ingeval van herinrichting die van de blokken;

      b. met betrekking tot het gebied:

      1. een beschrijving van de bestaande toestand;

      2. een aanduiding van de ruimtelijke ontwikkeling;

      3. een beschrijving van de wenselijk geachte inrichting;

      c. op grondslag van het bepaalde onder b en het structuurschema, de motivering of landinrichting al dan niet
      wenselijk is en zo ja, in welke vorm;

      d. de wijze van voorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel24
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '24'
        hoofdstuk: III
  - number: '27'
    text: |-
      1 Nadat een gebied voor de eerste keer op het voorbereidingsschema is vermeld stellen gedeputeerde staten een
      landinrichtingscommissie met betrekking tot dat gebied in.

      2 Gedeputeerde staten zenden bericht van de instelling van een landinrichtingscommissie aan Onze Minister, alsmede
      aan:

      a. de colleges van gedeputeerde staten van de overige provincies,

      b. de colleges van burgemeester en wethouders van de gemeenten en

      c. de waterschappen,

      op welker grondgebied het in te richten gebied is gelegen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel27
  - number: '28'
    text: |-
      1 Een landinrichtingscommissie bestaat uit ten hoogste zeven leden, waaronder een voorzitter en een
      plaatsvervangend voorzitter.

      2 Indien de aard of omvang van het gebied daartoe aanleiding geeft, kunnen gedeputeerde staten besluiten, dat de
      landinrichtingscommissie zal bestaan uit een daarbij vast te stellen aantal van meer dan zeven leden.

      3 Bij algemene maatregel van bestuur worden nadere regelen gegeven met betrekking tot de wijze van benoeming, de
      zittingsduur, de schorsing en het ontslag van de leden van een landinrichtingscommissie alsmede met betrekking tot
      de aan hen toe te kennen vergoedingen.

      4 Gedeputeerde staten kunnen adviserende leden benoemen. Het derde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel28
  - number: '29'
    text: De landinrichtingscommissie is bevoegd al dan niet uit haar midden, sub-commissies in te stellen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel29
  - number: '30'
    text: |-
      1 Onze Minister voegt aan de landinrichtingscommissie een secretaris toe.

      2 Het bestuur van de Dienst voor het kadaster en de openbare registers wijst in overeenstemming met Onze Minister
      een ingenieur van het kadaster en één of meer plaatsvervangers aan, die de landinrichtingscommissie bijstaan.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel30
  - number: '31'
    text: |-
      1 De landinrichtingscommissie kan geen besluiten nemen, indien niet ten minste de helft van het aantal leden
      aanwezig is. De voorzitter en de secretaris voeren de besluiten uit; zij kunnen daartoe rechtshandelingen
      verrichten en in rechte optreden.

      2 De Staat garandeert de nakoming van de verplichtingen, die voortvloeien uit de in het eerste lid bedoelde
      rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel31
  - number: '32'
    text: Onze Minister stelt regelen betreffende de werkwijze van de landinrichtingscommissie vast.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel32
  - number: '33'
    text: |-
      Voor een gebied, waarvoor herinrichting dan wel ruilverkaveling wordt voorbereid, wordt een
      landinrichtingsprogramma vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel33
  - number: '34'
    text: |-
      1 Indien herinrichting wordt voorbereid, wordt in het programma aangegeven of herverkaveling op de voet van
      [Hoofdstuk VII][ref1] zal plaatsvinden.

      2 Indien ruilverkaveling, dan wel herinrichting waarbij herverkaveling op de voet van [Hoofdstuk VII][ref2] zal
      plaatsvinden, wordt voorbereid, wordt in het programma vermeld of zodanige herverkaveling in één of meer blokken
      zal plaatsvinden. Daarbij wordt ieder blok aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003793
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        hoofdstuk: VII
  - number: '35'
    text: |-
      1 Het landinrichtingsprogramma bevat:

      a. de zo nauwkeurig mogelijk bepaalde grenzen van het in te richten gebied alsmede die van ieder tot dat gebied
      behorend blok;

      b. met betrekking tot het in te richten gebied, op de grondslag van de in [artikel 20, tweede lid, onder ][ref1],
      bedoelde overwegingen en uitgangspunten:

      1. een beschrijving van de bestaande toestand;

      2. de aanduiding van de ruimtelijke ontwikkeling;

      3. de nadere uitwerking van de uitgangspunten en de doeleinden van herinrichting, onderscheidenlijk
      ruilverkaveling;

      4. de aanduiding en de ruimtelijke aspecten van de te treffen maatregelen en voorzieningen;

      5. aanduidingen inzake de grondverwerving;

      6. een beschrijving van de te verwachten gevolgen van de onder 4 en 5 bedoelde maatregelen en voorzieningen voor
      de economische toestand met inbegrip van de werkgelegenheid, de leef- en werkomstandigheden, de natuur en het
      landschap en de gesteldheid van water, bodem en lucht;

      7. een voorlopige raming van de kosten en de voorgestelde verdeling daarvan;

      c. een of meer kaarten waarop het onder *a* en *b* gestelde alsmede in voorkomende gevallen de in
      [artikel 36][ref2] bedoelde beheersgebieden en reservaatsgebieden zoveel mogelijk afzonderlijk worden weergegeven.

      2 Onze Minister kan bepalen dat door Onze Minister aangewezen voorzieningen van openbaar nut slechts in het
      kader van de landinrichting tot stand worden gebracht, indien tussen de landinrichtingscommissie en het betrokken
      openbaar lichaam overeenstemming is verkregen over de geldelijke bijdrage van het lichaam in de kosten van de
      verwezenlijking van het landinrichtingsplan en over de voorwaarden waaronder de betaling zal plaatsvinden, en Onze
      Minister instemt met deze bijdrage en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel36
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '36'
        hoofdstuk: III
  - number: '36'
    text: |-
      Het landinrichtingsprogramma bevat tevens

      a. indien in één of meer gebieden de uitoefening van de landbouw mede gericht dient te worden op doeleinden van
      natuur- of landschapsbehoud,

      b. indien in één of meer gebieden het beheer in de toekomst uitsluitend of nagenoeg uitsluitend gericht dient te
      zijn op doeleinden van natuur- of landschapsbehoud,

      de begrenzing in hoofdlijnen van deze beheersgebieden onderscheidenlijk reservaatsgebieden.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel36
  - number: '37'
    text: |-
      1 Op de voorbereiding van een ontwerp-landinrichtingsprogramma als bedoeld in [artikel 40, eerste lid][ref1],
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing, met dien verstande
      dat daaraan toepassing wordt gegeven door de landinrichtingscommissie. Onder het in het tweede lid bedoelde
      voorontwerp van het landinrichtingsprogramma wordt het ingevolge [artikel 3:11, eerste lid][ref3], door de
      landinrichtingscommissie ter inzage te leggen ontwerp verstaan.

      2 De landinrichtingscommissie stelt een voorontwerp van het landinrichtingsprogramma op na overleg met de colleges
      van burgemeester en wethouders van de betrokken gemeenten en de besturen van de betrokken waterschappen.

      3 Het voorontwerp kan met betrekking tot eenzelfde aangelegenheid meer dan één mogelijkheid van te treffen
      maatregelen of voorzieningen bevatten.

      4 Onder betrokken gemeenten en waterschappen worden verstaan de gemeenten en waterschappen, waarin het gebied als
      bedoeld in [artikel 35, eerste lid, onder a][ref4], is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel311
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel35
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '40'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 3:11
      - id: ref4
        bwb_id: BWBR0003793
        artikel: '35'
        hoofdstuk: III
  - number: '40'
    text: |-
      1 De landinrichtingscommissie stelt het landinrichtingsprogramma in ontwerp vast en zendt dit aan gedeputeerde
      staten.

      2 Gedeputeerde staten brengen het ontwerp onverwijld ter kennis van de colleges van gedeputeerde staten van de
      andere provincies, op welker grondgebied dit mede betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel40
  - number: '41'
    text: |-
      1 Gedeputeerde staten stellen het landinrichtingsprogramma vast na toetsing van het ontwerp aan de hoofdlijnen
      van het provinciaal ruimtelijk beleid, zoals deze hun grondslag vinden in of redelijkerwijs voorvloeien uit een
      streekplan of een ander besluit van provinciale staten, de provinciale planologische commissie gehoord.

      2 Op de voorbereiding van het landinrichtingsprogramma is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing. De terinzagelegging geschiedt tevens ter secretarie van de gemeenten en de waterschappen die geheel
      of gedeeltelijk zijn gelegen in het in te richten gebied. Zienswijzen kunnen naar voren worden gebracht door een
      ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '43'
    text: |-
      1 Indien provinciale staten voornemens zijn af te wijken van het ontwerp, wordt alvorens zij het
      landinrichtingsprogramma vaststellen, advies ingewonnen van de landinrichtingscommissie.

      2 Voorzover provinciale staten het landinrichtingsprogramma vaststellen in afwijking van het in het vorige
      lid bedoelde advies, zenden gedeputeerde staten het besluit daartoe binnen twee weken na vaststelling aan Onze
      Minister.

      3 Het gedeelte van het in het vorige lid bedoelde besluit, waarbij wordt afgeweken van het in het eerste lid
      bedoelde advies, kan door Ons worden vernietigd.

      4 Het koninklijk besluit tot vernietiging wordt in het *Staatsblad*geplaatst.

      5 Een voordracht tot vernietiging wordt Ons door Onze Minister gedaan.

      6 Een besluit tot vernietiging kan niet worden genomen, indien een jaar is verstreken na de ontvangst van het in
      het tweede lid bedoelde besluit. Wij behouden Ons voor de termijn van een jaar met zes maanden te verlengen.

      7 Onze Minister zendt het besluit tot vernietiging onverwijld aan:

      a. de landinrichtingscommissie;

      b. provinciale staten;

      c. de gemeenten en de waterschappen op welker grondgebied het besluit tot vernietiging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel43
  - number: '45'
    text: |-
      1 Provinciale Staten bezien, in hoeverre met toepassing van [artikel 152 van de Provinciewet][ref1]
      de bevoegdheden als bedoeld in de [artikelen 41, eerste lid][ref2], [43, eerste en tweede lid][ref3],
      [ 46, eerste en tweede lid][ref4], en [51, eerste lid][ref5], kunnen worden gedelegeerd aan gedeputeerde staten.

      2 Voor zover de bevoegdheden als bedoeld in het eerste lid zijn gedelegeerd aan gedeputeerde staten, is
      [artikel 41,derde lid][ref6], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0003793#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0003793#Artikel41
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '41'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '43'
