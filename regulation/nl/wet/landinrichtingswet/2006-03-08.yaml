  - number: '223'
    text: |-
      1 De kosten die ten laste van de gezamenlijke eigenaren komen worden omgeslagen over de kavels naar de mate
      van het nut, zoals bepaald op grond van de schatting bedoeld in [artikel 210, eerste lid, onder ][ref1], dat de
      landinrichting voor de eigenaar heeft gehad, met dien verstande dat

      a. geen heffing en invordering plaatsvindt indien de door een eigenaar verschuldigde kosten geringer zijn dan een
      bij algemene maatregel van bestuur vast te stellen bedrag;

      b. het door een eigenaar te betalen gedeelte der kosten, de waardevermeerdering als gevolg van landinrichting niet
      te boven gaat.

      2 Terzake van het op grond van de lijst der geldelijke regelingen, zoals zij door de rechtbank is gesloten, door de
      eigenaar verschuldigde bedrag rust op de hem toegedeelde kavels onder de naam van "landinrichtingsrenten", verder
      te noemen rente, een schuldplichtigheid ten behoeve van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel210
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '210'
        hoofdstuk: VII
  - number: '224'
    text: |-
      1 De rente wordt geheven van degene die als bezitter, eigenaar of beperkt gerechtigde het genot heeft van één of
      meer toegedeelde kavels, bedoeld in [artikel 223][ref1].

      2 In geval van vruchtgebruik op een toegedeelde kavel is de eigenaar van die kavel verplicht aan de vruchtgebruiker
      daarvan bij het eindigen van het recht van vruchtgebruik te vergoeden, hetgeen die vruchtgebruiker in verband met
      de vermindering van de waarde van de op de voet van [artikel 230][ref2] berekende rente geacht moet worden voor
      aflossing te hebben betaald.

      3 In geval van het recht van opstal is de rente slechts verschuldigd, voor zover zodanig recht niet betreft het
      leggen en houden van leidingen in, op of boven de onroerende zaak van een ander.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel223
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel230
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel224
    references:
