  - number: '136'
    text: |-
      Voor zover het openbaar lichaam voorheen niet was belast met het beheer en het onderhoud van openbare wegen,
      waterlopen, dijken en kaden met de daartoe behorende kunstwerken gaan in afwijking van het bepaalde in de
      [artikelen 1 en 2 van de Waterstaatswet 1900][ref1] (*Stb.* 176) en de [artikelen 18][ref2], [19][ref3] en
      [20 van de Wegenwet][ref4] het beheer en het onderhoud, door het enkele feit van de aanwijzing in beheer en
      onderhoud, over op het tijdstip als bedoeld in de [artikelen 133, eerste lid][ref5], of [134][ref6].


