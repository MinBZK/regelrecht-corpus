  - number: '221'
    text: |-
      De kosten van landinrichting worden gedragen door het Rijk, andere openbare lichamen en eigenaren op de voet van de
      navolgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel221
  - number: '222'
    text: |-
      1 Ten laste van het Rijk komen de kosten van de Dienst voor het kadaster en de openbare registers, van het
      bijeenroepen en houden van vergaderingen en van het doen van openbare kennisgevingen.

      2 Eveneens komen ten laste van het Rijk vergoedingen welke voortvloeien uit de toepassing van het bepaalde
      in [artikel 146, derde lid][ref1], en welke niet in de verrekening, bedoeld in de [artikelen 145][ref2] en
      [210, eerste lid, onder ][ref3], zijn begrepen.

      3 Ten laste van andere openbare lichamen komen de kosten waartoe zij zich op grond van
      [artikel 35, tweede lid][ref4], en [artikel 87, vierde lid][ref5], dan wel anderszins bij overeenkomst, hebben
      verplicht.

      4 Ten laste van de gezamenlijke eigenaren komen de kosten van landinrichting, die gemaakt zijn ten behoeve van
      het blok, voor zover deze niet gedekt worden door een rijksbijdrage of voor zover de betaling van deze lasten niet
      bij overeenkomst is verzekerd. Deze kosten worden uit ’s Rijks kas voorgeschoten volgens een door Ons vastgestelde
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel145
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel210
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0003793#Artikel87
