  - number: '151'
    text: |-
      1 De in [artikel 150][ref1] bedoelde aanspraak bestaat slechts, indien de pachtovereenkomst aan de
      landinrichtingscommissie ter registratie is ingezonden.

      2 De inzending ter registratie dient plaats te vinden binnen dertig dagen na een door de landinrichtingscommissie
      te bepalen tijdstip.

      3 Indien de pachtovereenkomst na het in het tweede lid bedoelde tijdstip is aangegaan, dient de inzending ter
      registratie plaats te vinden binnen dertig dagen na de goedkeuring van die overeenkomst door de grondkamer, doch
      uiterlijk tot een door de landinrichtingscommissie vast te stellen tijdstip.

      4 De landinrichtingscommissie maakt de in het tweede en derde lid bedoelde tijdstippen bekend in ten minste twee
      dag- of nieuwsbladen die in het gebied, waarin het blok is gelegen, worden verspreid en in de gemeenten die geheel
      of gedeeltelijk zijn gelegen in zodanig gebied, op de aldaar gebruikelijke wijze.

      5 Van de registratie wordt door de landinrichtingscommissie een bewijs afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel150
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '150'
        hoofdstuk: VII
  - number: '152'
    text: |-
      1 De landinrichtingscommissie zendt aan de wederpartij van degene, die een pachtovereenkomst ter registratie heeft
      ingezonden, bij aangetekende brief bericht van de inzending ter registratie.

      2 De wederpartij kan zijn bezwaren tegen de registratie binnen veertien dagen na de dagtekening van de in het
      eerste lid bedoelde brief schriftelijk aan de landinrichtingscommissie kenbaar maken.

      3 Indien overeenkomstig het bepaalde in het tweede lid bezwaren kenbaar zijn gemaakt, stelt de
      landinrichtingscommissie, onder vaststelling van die bezwaren, bij aangetekende brief partijen ervan in kennis, dat
      binnen dertig dagen na de dagtekening van deze brief bij de landinrichtingscommissie dient te worden ingezonden,
      hetzij een door beide partijen ondertekende akte, waaruit blijkt dat overeenstemming is verkregen, hetzij een
      gewaarmerkt afschrift van het verzoekschrift, waarbij de meest gerede partij de beslissing van de pachtkamer van de
      rechtbank van het arrondissement waarin de desbetreffende onroerende zaak geheel of grotendeels is gelegen, heeft
      ingeroepen. De waarmerking van het afschrift geschiedt door de griffier van de rechtbank.

      4 Indien de landinrichtingscommissie bevindt, dat met betrekking tot de ter registratie ingezonden
      pachtovereenkomst de [artikelen 2][ref1], tweede lid, en [158 van de Pachtwet][ref2] (*Stb.* 1958, 37) niet zijn in
      acht genomen, draagt zij voor zover nodig partijen bij aangetekende brief op de beslissing van de grondkamer in te
      roepen en binnen dertig dagen na de dagtekening van deze brief een door de secretaris van de grondkamer gewaarmerkt
      afschrift van het verzoekschrift in te zenden.

      5 Indien de landinrichtingscommissie bevindt, dat met betrekking tot de ter registratie ingezonden
      pachtovereenkomst [artikel 2, eerste lid, van de Pachtwet][ref3] niet in acht is genomen, draagt zij voor zover
      nodig partijen bij aangetekende brief op de beslissing van de pachtkamer van de rechtbank in te roepen en binnen
      dertig dagen na de dagtekening van deze brief een door de griffier van de rechtbank gewaarmerkt afschrift van het
      verzoekschrift in te zenden.

      6 Indien aan het bepaalde in het derde-vijfde lid geen gevolg is gegeven, is de landinrichtingscommissie bevoegd
      met het bestaan der pachtovereenkomst geen rekening te houden.

      7 De grondkamer en de pachtkamer van de rechtbank en in beroep de Centrale Grondkamer en de pachtkamer van het
      gerechtshof te Arnhem behandelen de verzoeken en vorderingen, bedoeld in het derde-vijfde lid, vóór alle andere
      zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002269#Artikel158
      [ref3]: https://wetten.overheid.nl/BWBR0002269#Artikel2
