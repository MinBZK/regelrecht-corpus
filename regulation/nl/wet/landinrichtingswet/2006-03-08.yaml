  - number: '208'
    text: |-
      1 De akte van toedeling wordt ondertekend door de rechter-commissaris en de voorzitter en de secretaris van de
      landinrichtingscommissie.

      2 Zij geldt als titel voor de daarin omschreven rechten. Door de inschrijving van de akte in de openbare registers
      worden de daarin omschreven onroerende zaken en beperkte rechten verkregen.

      3 Op grond van de akte wordt in de openbare registers bij elke hypothecaire inschrijving, onderscheidenlijk
      bij elke inschrijving van een beslag aangetekend, dat de hypotheek onderscheidenlijk het beslag in het vervolg
      zal rusten op de in de akte aangewezen kavels of gedeelten daarvan, dan wel op de rechten waaraan die kavels of
      gedeelten daarvan zijn onderworpen.

      4 De bewaarder van het kadaster en de openbare registers haalt ambtshalve door de door de inschrijving van de akte
      van toedeling niet meer bestaande inschrijvingen van de in [artikel 207, vijfde lid][ref1], bedoelde hypotheken
      en beslagen.

      5 De bewaarder van het kadaster en de openbare registers zendt zo spoedig mogelijk per brief aan elke eigenaar
      van, alsmede aan elke beperkt gerechtigde met betrekking tot de onroerende zaak een kennisgeving van het resultaat
      van de bijhouding van de kadastrale registratie die op grond van de inschrijving van de akte plaatsvindt. De brief
      vermeldt de dag van de verzending alsmede de in de kadastrale registratie vermeld staande gegevens omtrent de
      rechten, de rechthebbenden, als bedoeld in de [Kadasterwet][ref2], de grootte en de kadastrale aanduiding van de
      onroerende zaak, waarop de kennisgeving betrekking heeft. De [artikelen 56][ref3] zijn niet van toepassing op de in
      de eerste zin bedoelde bijhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel207
      [ref2]: https://wetten.overheid.nl/BWBR0004541
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel208
