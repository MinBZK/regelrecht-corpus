  - number: '148'
    text: |-
      Voor zover het belang van de landinrichting zich hiertegen niet verzet, wordt aan iedere eigenaar een recht
      toegedeeld met betrekking tot onroerende zaken van gelijke hoedanigheid en gebruiksbestemming als te zijnen aanzien
      in het blok is opgenomen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel148
  - number: '149'
    text: |-
      Elke kavel moet zo worden gevormd, dat hij:

      a. uitweg heeft op een openbare land- of waterweg en zo mogelijk daaraan belendt;

      b. zonodig en mogelijk de gelegenheid tot behoorlijke afwatering heeft.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel149
  - number: '150'
    text: |-
      1 Iedere pachter van in een blok gelegen onroerende zaken heeft aanspraak op het in pacht verkrijgen van een waarde
      in kavels, naar de maatstaven, als bedoeld in het tweede lid.

      2 [Artikel 139, tweede lid][ref1], en de [artikelen 140-144][ref2], [146][ref3], [147, eerste lid][ref4], en
      [148][ref5], zijn van toepassing, met dien verstande dat, in plaats van "eigenaar" wordt gelezen "pachter".


