  - number: '146'
    text: |-
      1 De eigenaar van onroerende zaken, die zijn begrepen in de voornemens inzake de toewijzing als
      bedoeld in [artikel 75, eerste lid, onder ][ref1], en [artikel 102, eerste lid, onder ][ref2],
      voorzover zulks geschiedt met toepassing van de artikelen [142, eerste lid, aanhef en onder ][ref3], en
      [143, eerste lid, aanhef en onder ][ref4], ontvangt voor die zaken op zijn verzoek in afwijking van het bepaalde in
      de [artikelen 141-143][ref5], algehele vergoeding in geld.

      2 De landinrichtingscommissie is, nadat Onze Minister daarin heeft toegestemd, bevoegd te bepalen dat een eigenaar,
      in afwijking van het bepaalde in de [artikelen 141-143][ref6], algehele vergoeding in geld zal ontvangen, wanneer
      de waarde van de rechten op zijn in een blok gelegen onroerende zaken zo gering is, dat de toepassing van de
      [artikelen 141-143][ref7] zou leiden tot de vorming van een niet behoorlijk te exploiteren kavel en hij geen
      redelijk belang heeft bij het verkrijgen van een zodanige kavel.

      3 De toestemming, bedoeld in het tweede lid, kan worden onthouden wegens strijd met het recht of het algemeen
      belang.

      4 De eigenaar van andere onroerende zaken dan de in het tweede lid bedoelde, die zulks nadat het besluit tot
      landinrichting is genomen, doch vóór een op voorstel van de landinrichtingscommissie door Onze Minister te bepalen
      tijdstip schriftelijk aan de landinrichtingscommissie verzoekt, ontvangt, in afwijking van het bepaalde in de
      [artikelen 141-143][ref8] een vergoeding in geld gelijk aan de werkelijke waarde van zijn onroerende zaken.

      5 Onze Minister maakt het in het vierde lid bedoelde tijdstip bekend in de *Staatscourant*, in ten minste twee dag-
      of nieuwsbladen die in het gebied, waarin het blok is gelegen worden verspreid en in de gemeenten die geheel of
      gedeeltelijk zijn gelegen in zodanig gebied, op de aldaar gebruikelijke wijze.

      6 Zodra de lijst van rechthebbenden te zijnen aanzien vaststaat, ontvangt de in het vierde lid bedoelde eigenaar,
      die schriftelijk afstand heeft gedaan van het gebruik van de onroerende zaak waarop zijn recht betrekking heeft, op
      zijn verzoek een voorschot in geld op de vergoedingen bedoeld in het vierde lid.

      7 De eigenaar kan de rechter-commissaris verzoeken het bedrag van het voorschot vast te stellen. Alvorens het
      bedrag van het voorschot vast te stellen hoort de rechter-commissaris de landinrichtingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel102
