  - number: '204'
    text: |-
      Op verzoek van de landinrichtingscommissie wordt degene, aan wie krachtens het plan van toedeling een onroerende
      zaak in eigendom of in gebruik toekomt, op bevelschrift van de rechter-commissaris desnoods door middel van de
      sterke arm bij voorraad in de macht daarvan gesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel204
  - number: '205'
    text: |-
      1 De landinrichtingscommissie kan in afwijking van het bepaalde in [artikel 199, eerste lid, onder ][ref1],
      bepalen, dat de lijst van rechthebbenden, het register van schattingsuitkomsten en het plan van toedeling
      gelijktijdig zullen worden opgemaakt en ter inzage gelegd.

      2 In het in het eerste lid bedoelde geval worden eerst de bezwaren tegen de lijst van rechthebbenden en tegen het
      register van schattingsuitkomsten en vervolgens die tegen het plan van toedeling behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel199
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '199'
        hoofdstuk: VII
  - number: '206'
    text: |-
      1 Indien de behandeling van de bezwaren tegen de lijst van rechthebbenden en tegen het register van
      schattingsuitkomsten wijziging van het ter inzage gelegde plan van toedeling noodzakelijk maakt, brengt de
      landinrichtingscommissie die wijziging in dat plan aan, zodra en voor zover de lijst van rechthebbenden en het
      register van schattingsuitkomsten zijn komen vast te staan.

      2 De landinrichtingscommissie doet aan de betrokken belanghebbenden schriftelijk mededeling van de door haar in
      het plan van toedeling aangebrachte wijzigingen. Zij stelt de betrokken belanghebbenden in de gelegenheid uiterlijk
      veertien dagen na de verzending van die mededeling schriftelijke bezwaren tegen de aangebrachte wijzigingen bij
      haar in te dienen.

      3 Voor zover in het geval, bedoeld in het tweede lid, bezwaren zijn ingediend, worden deze bezwaren te zamen met de
      eerder tegen het plan van toedeling ingediende bezwaren behandeld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel206
  - number: '207'
    text: |-
      1 Zodra gedeputeerde staten de besluiten inzake de toewijzing, bedoeld in de [artikelen 133][ref1] en [137][ref2]
      hebben genomen, het plan van toedeling vaststaat en de lijst van rechthebbenden door de rechtbank is gesloten,
      maakt een door de landinrichtingscommissie aangewezen notaris de akte van toedeling op.

      2 In de akte wordt opgenomen een kaart van het blok met aanwijzing van de kavels, de wegen en waterlopen en de
      gronden die op de voet van de [artikelen 133][ref3] en [137][ref4] zijn toegewezen, een en ander voor zover gelegen
      binnen het blok.

      3 In de akte worden voorts opgenomen:

      a. de in de [artikelen 133][ref5] en [137][ref6] bedoelde besluiten, andere dan de in
      [artikel 138, tweede lid][ref7], bedoelde besluiten, voor zover deze niet door Ons ingevolge
      [artikel 138, vierde lid][ref8], zijn gewijzigd;

      b. Onze ingevolge [artikel 138, vierde lid][ref9], genomen besluiten, voor zover deze geen betrekking hebben op de
      in [artikel 138, tweede lid][ref10], bedoelde besluiten;

      een en ander voor zover deze besluiten betrekking hebben op toewijzing in eigendom.

      4 De omschrijving van de kavels, de wegen en de waterlopen, begrepen in de in het derde lid onder *a*
      en *b*, bedoelde besluiten, die op de in het tweede lid bedoelde kaart zijn afgebeeld en die daarop
      voorzien zijn van een nummer, geschiedt door vermelding van het nummer waarmee zij op die kaart voorkomen.
      [Artikel 20, eerste lid, van de Kadasterwet][ref11] is niet van toepassing voor zover het betreft het vermelden van
      de aard en de plaatselijke aanduiding zo deze er is, van onroerende zaken.

      5 In de akte van toedeling worden tevens vermeld de hypotheken en de beslagen die door de inschrijving van de akte
      van toedeling niet meer blijven bestaan.

      6 Het bepaalde in de [artikelen 18, eerste en vijfde lid][ref12], en [24, tweede lid onder ][ref13], is van
      overeenkomstige toepassing op de akte van toedeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel133
