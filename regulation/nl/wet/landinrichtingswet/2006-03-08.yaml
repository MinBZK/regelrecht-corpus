  - number: '87'
    text: |-
      1 Indien een herinrichting wordt voorbereid op de wijze als bedoeld in [artikel 86][ref1], wordt in het plan
      aangegeven of herverkaveling op de voet van [Hoofdstuk VII][ref2] zal plaatsvinden.

      2 Indien ruilverkaveling, dan wel herinrichting, waarbij herverkaveling op de voet van [Hoofdstuk VII][ref3] zal
      plaatsvinden, wordt voorbereid op de wijze als bedoeld in [artikel 86][ref4], wordt in het plan vermeld of zodanige
      herverkaveling in één of meer blokken zal plaatsvinden. Daarbij wordt ieder blok aangegeven.

      3 Onverminderd het bepaalde in de [artikelen 74][ref5] en [75][ref6] bevat het landinrichtingsplan voor een gebied
      waarop het bepaalde in [artikel 86][ref7] van toepassing is tevens:

      a. met betrekking tot het in te richten gebied, op de grondslag van de in [artikel 20, tweede lid, onder ][ref8],
      bedoelde overwegingen en uitgangspunten, de nadere uitwerking van de uitgangspunten en de doeleinden van
      herinrichting onderscheidenlijk ruilverkaveling;

      b. een beschrijving van de te verwachten gevolgen van de onder [artikel 74, eerste lid, onder ][ref9], bedoelde
      maatregelen en voorzieningen voor de economische toestand met inbegrip van de werkgelegenheid, de leef- en
      werkomstandigheden, de natuur en het landschap en de gesteldheid van water, bodem en lucht.

      4 Onze Minister kan bepalen dat door Onze Minister in het landinrichtingsplan aangewezen voorzieningen van openbaar
      nut slechts in het kader van landinrichting tot stand worden gebracht, indien tussen de landinrichtingscommissie
      en het betrokken openbaar lichaam overeenstemming is verkregen over de geldelijke bijdrage van het lichaam in
      de kosten van de verwezenlijking van het landinrichtingsplan en over de voorwaarden waaronder de betaling zal
      plaatsvinden, en Onze Minister instemt met deze bijdrage en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel86
