  - number: '135'
    text: |-
      1 Tot het tijdstip van de toewijzing bedoeld in [artikel 133, eerste lid][ref1], berust het beheer en het onderhoud
      van de openbare wegen, waterlopen, dijken en kaden met de daarbij behorende kunstwerken bij de beheers- en
      onderhoudsplichtigen, die voor de desbetreffende landinrichting daarmee belast waren.

      2 In afwijking van het eerste lid berust het beheer en onderhoud bij de landinrichtingscommissie indien het
      betreft verbetering van de in dat lid bedoelde voorzieningen, vanaf het tijdstip waarop de landinrichtingscommissie
      opdracht geeft tot de uitvoering van de verbeteringswerken tot het tijdstip waarop de landinrichtingscommissie aan
      het openbaar lichaam of de rechtspersoon, bedoeld in [artikel 133, eerste lid][ref2], heeft verklaard dat de werken
      zijn voltooid.

      3 Het beheer en het onderhoud van nieuwe voorzieningen als bedoeld in het eerste lid, berust bij de
      landinrichtingscommissie tot het tijdstip van de toewijzing bedoeld in dat lid, of indien dit later valt,
      het tijdstip waarop de landinrichtingscommissie aan het openbaar lichaam of de rechtspersoon, bedoeld in
      [artikel 133, eerste lid][ref3], heeft verklaard dat de werken zijn voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel133
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel133
