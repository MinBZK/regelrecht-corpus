  - number: '211'
    text: |-
      De landinrichtingscommissie gaat nadat [artikel 210][ref1] toepassing heeft gevonden zo spoedig mogelijk over tot
      het opmaken van de lijst der geldelijke regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel210
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '210'
        hoofdstuk: VII
  - number: '212'
    text: |-
      1 De lijst der geldelijke regelingen houdt in:

      a. de uitkomsten der schatting volgens [artikel 210, eerste lid, onder ][ref1], alsmede de zo nauwkeurig mogelijke
      opgave van de daaruit op grond van artikel 223, eerste lid, voortvloeiende kosten voor de betrokken eigenaren;

      b. de uitkomsten der schatting volgens [artikel 210, eerste lid, onder ][ref2], alsmede een opgave van de
      daarmede verband houdende geldelijke verrekeningen voor de betrokken eigenaren als gevolg van de toepassing van
      [artikel 144, tweede lid][ref3];

      c. een opgave van de geldelijke verrekeningen voor de betrokken eigenaren als gevolg van:

      1°. de toepassing van de artikelen[ 145][ref4] en [146, eerste en tweede lid][ref5];

      2°. de toepassing van de artikelen [146, vierde lid][ref6], en [150][ref7];

      3°. de toepassing van [artikel 160][ref8];

      4°. de toe te kennen schadevergoedingen, andere dan die bedoeld in [artikel 129][ref9];

      5°. de overige zaken;

      d. de uitkomsten der schatting volgens [artikel 210, eerste lid, onder ][ref10], alsmede een opgave van de daarmede
      verband houdende geldelijke verrekeningen tussen de oude en de nieuwe eigenaar.

      2 Voor de bepaling van de in het eerste lid, onder *b* en onder *c*, sub 1°, bedoelde verrekening kunnen
      de waarden, zoals deze door de sluiting van het in [artikel 185, vijfde lid][ref11], bedoelde register van
      schattingsuitkomsten zijn komen vast te staan, worden geactualiseerd met inachtneming van bij of krachtens algemene
      maatregel van bestuur te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel210
