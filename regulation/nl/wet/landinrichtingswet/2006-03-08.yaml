  - number: '55'
    text: |-
      1 Het verzoek tot registratie moet binnen een maand na een door de landinrichtingscommissie te bepalen tijdstip
      worden ingediend.

      2 De landinrichtingscommissie maakt het in het eerste lid bedoelde tijdstip bekend in ten minste twee dag- of
      nieuwsbladen, die in zodanig gebied worden verspreid en in de gemeenten, die geheel of gedeeltelijk in zodanig
      gebied zijn gelegen, op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel55
  - number: '56'
    text: |-
      1 Indien de pachter niet voldoet aan de voorwaarden, gesteld in [artikel 54, tweede lid][ref1], deelt de
      landinrichtingscommissie hem mee, dat hij niet in aanmerking komt voor registratie.

      2 Indien de pachter voldoet aan de voorwaarden, gesteld in [artikel 54, tweede lid][ref2], beschrijft de
      landinrichtingscommissie het gepachte door vermelding van de kadastrale aanduiding van die onroerende zaken en
      van de grootte volgens de kadastrale registratie van elk der desbetreffende percelen en, indien het gepachte een
      gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte; de landinrichtingscommissie vermeldt
      tevens de oppervlakte, waarvoor de pachter stemgerechtigd is.

      3 De landinrichtingscommissie zendt zo spoedig mogelijk aan partijen bij de pachtovereenkomst, voor zover deze
      bekend zijn, bij aangetekende brief bericht van het verzoek, onder vermelding van de kadastrale aanduiding van het
      gepachte, de grootte volgens de kadastrale registratie van elk der desbetreffende percelen en, indien het gepachte
      een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte, alsmede onder vermelding van de
      oppervlakte, waarvoor de pachter stemgerechtigd is.

      4 Op het niet-ontvangen van het bericht kan geen beroep worden gedaan.

      5 Partijen kunnen hun bedenkingen binnen veertien dagen na de dagtekening van de in het derde lid bedoelde brief
      schriftelijk bij de landinrichtingscommissie naar voren brengen.

      6 Voor de toepassing van de vorige leden en van de [artikelen 57-60][ref3] wordt onder partijen mede verstaan
      degene, die op het tijdstip van de indiening van het verzoek tot registratie in de kadastrale registratie als
      eigenaar staat vermeld, indien deze niet de verpachter is.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel57
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel56
