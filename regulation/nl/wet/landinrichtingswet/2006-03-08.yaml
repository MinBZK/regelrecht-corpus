  - number: '3'
    text: |-
      1 Voor zover niet anders bepaald wordt onder "gedeputeerde staten" verstaan het college van gedeputeerde staten van
      de provincie, waarin het in te richten gebied geheel of grotendeels is gelegen.

      2 Het in het eerste lid bedoelde college neemt de besluiten, bedoeld in de [artikelen 42][ref1], [43][ref2],
      [46][ref3], [51][ref4], [80][ref5], [82][ref6], [85, eerste lid][ref7], [90][ref8], [92][ref9], [107][ref10],
      [109][ref11], [115, eerste lid][ref12], [131, derde lid][ref13], [133, eerste lid][ref14], en [137][ref15], niet
      dan in overeenstemming met de colleges van gedeputeerde staten van de andere provincies, waarin het in te richten
      gebied mede is gelegen.

      3 Wij nemen de in het tweede lid bedoelde besluiten, indien de betrokken organen ter zake niet tot overeenstemming
      zijn gekomen.


