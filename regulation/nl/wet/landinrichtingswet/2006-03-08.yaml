  - number: '4'
    text: |-
      Landinrichting strekt tot verbetering van de inrichting van het landelijk gebied overeenkomstig de functies van dat
      gebied, zoals deze in het kader van de ruimtelijke ordening zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel4
  - number: '5'
    text: |-
      Landinrichting kan maatregelen en voorzieningen omvatten ten behoeve van onder meer:

      a. de land-, tuin- en bosbouw;

      b. de natuur en het landschap;

      c. de infrastructuur;

      d. de openluchtrecreatie, en

      e. de cultuurhistorie.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel5
  - number: '6'
    text: |-
      1 Er is een Structuurschema Landinrichting.

      2 Het structuurschema bevat voor een daarin vermelde tijd de hoofdlijnen en beginselen van het nationale
      landinrichtingsbeleid en geeft in het bijzonder inzicht in de ruimtelijke aspecten van dat beleid. Het
      structuurschema wordt aangemerkt als een onderdeel van het Regeringsbeleid als bedoeld in [artikel 2][ref1] (*Stb.*
      1962, 286).


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: '9'
    text: |-
      1 Wanneer Onze Minister het ten behoeve van de voorbereiding van landinrichting nodig acht, dat grond wordt
      betreden of daarop gravingen of opmetingen worden verricht of tekens gesteld, moet hij, die de eigendom van de
      grond heeft of hij, aan wie een beperkt recht toebehoort, waaraan de grond is onderworpen, dan wel de gebruiker van
      de grond, dit gedogen.

      2 De burgemeester is bevoegd tot toepassing van bestuursdwang ter handhaving van de in het eerste lid bedoelde
      gedoogplicht.

      3 De schade, die uit de toepassing van het eerste lid voortvloeit, wordt vanwege de Staat vergoed. Het verzoek om
      schadevergoeding moet worden ingediend bij Onze Minister. Bij geschil over het beloop van de schade wordt dit op
      verzoek van de meest gerede partij, nadat de wederpartij de gelegenheid heeft gehad haar belangen te verdedigen,
      door de kantonrechter van de rechtbank van het arrondissement waarin de desbetreffende onroerende zaak geheel of
      grotendeels is gelegen, bij beschikking vastgesteld. Tegen de uitspraak staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel9
  - number: '10'
    text: |-
      1 Geen wijziging wordt gebracht in de rechten en de gebruikstoestand ten aanzien van:

      a. begraafplaatsen, crematoria en bewaarplaatsen bedoeld in onderscheidenlijk de [artikelen 23][ref1], [49][ref2],
      [62, eerste lid, onder ][ref3];

      b. gesloten begraafplaatsen dan wel graven of grafkelders als bedoeld in
      [artikel 85 van de Wet op de lijkbezorging][ref4], binnen de termijnen en anders dan op de wijze, omschreven in
      [artikel 46, tweede en derde lid, van die wet][ref5].

      2 Zonder instemming van Onze Minister van Defensie wordt geen wijziging gebracht in de gebruikstoestand van
      onroerende zaken die een militaire bestemming hebben.

      3 Zonder toestemming van de eigenaar wordt geen wijziging gebracht in diens recht ten aanzien van gebouwen.

      4 Onze Minister kan in overeenstemming met gedeputeerde staten toestaan, dat van de bepaling in het derde lid wordt
      afgeweken, indien zij de totstandkoming van de landinrichting in de weg zou staan.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0005009#Artikel85
      [ref5]: https://wetten.overheid.nl/BWBR0005009#Artikel46
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel10
