  - number: '86'
    text: |-
      Voor een gebied waarvoor op het voorbereidingsschema in een vereenvoudigde voorbereiding van herinrichting dan
      wel ruilverkaveling is voorzien, wordt geen landinrichtingsprogramma als bedoeld in [Titel 3][ref1] vastgesteld,
      doch wordt overeenkomstig het bepaalde in de [artikelen 74-85][ref2] een landinrichtingsplan vastgesteld met
      inachtneming van de [artikelen 87-93][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003793#HoofdstukIII
