        hoofdstuk: VIII
  - number: '225'
    text: |-
      De rente bedraagt zes percent van het ingevolge [artikel 223, eerste lid][ref1], verschuldigde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel223
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '223'
        hoofdstuk: VIII
  - number: '226'
    text: |-
      1 De rente wordt geheven over zesentwintig achtereenvolgende jaren, te beginnen met het kalenderjaar volgende
      op dat waarin de kennisgeving van het bedrag van die rente ter opneming in de kadastrale registratie door het
      desbetreffende kantoor van de Dienst voor het kadaster en de openbare registers is ontvangen.

      2 Op verzoek van degene die als bezitter, eigenaar of beperkt gerechtigde het genot heeft wordt de rente voor de
      ten tijde van de indiening van het verzoek nog niet aangevangen kalenderjaren ineens voldaan met inachtneming van
      het bepaalde in [artikel 230][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel230
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '230'
        hoofdstuk: VIII
  - number: '227'
    text: |-
      Het op de voet van [artikel 225][ref1] berekende bedrag van de verschuldigde rente wordt door de zorg van het
      bestuur van de Dienst voor het kadaster en de openbare registers in de kadastrale registratie bij de desbetreffende
      percelen opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel225
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '225'
        hoofdstuk: VIII
  - number: '228'
    text: |-
      1 Indien een perceel wordt gesplitst, wordt de voor dat perceel vastgestelde rente van de nog niet aangevangen
      kalenderjaren verdeeld over de na de splitsing ontstane percelen naar verhouding van de grootten van die percelen
      volgens de kadastrale registratie.

      2 Indien een perceel of een gedeelte daarvan wordt samengevoegd met een ander perceel of met een gedeelte daarvan,
      wordt de rente voor het door samenvoeging ontstane perceel voor de nog niet aangevangen kalenderjaren bepaald door
      samenvoeging van de rentebedragen die rusten op de bij die samenvoeging betrokken percelen of de gedeelten daarvan.

      3 [ Artikel 227][ref1] vindt toepassing ten aanzien van rentebedragen die op de voet van het eerste of het tweede
      lid zijn bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel227
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '227'
        hoofdstuk: VIII
  - number: '229'
    text: |-
      1 De rente wordt geheven en ingevorderd door of vanwege Onze Minister van Financiën.

      2 De heffing en de invordering van de rente geschieden met toepassing van de
      [Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301) en de [Invorderingswet 1990][ref2] (*Stb.* 221) als
      ware die rente een rijksbelasting.

      3 De rente wordt geheven bij wege van aanslag. Indien met betrekking tot een zelfde perceel twee of meer personen
      renteplichtig zijn kan de rente bij wege van één aanslag worden geheven ten name van één van hen.

      4 Bezwaar en beroep bedoeld in [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref3] kunnen niet zijn
      gegrond op de stelling dat het op grond van [artikel 223][ref4] verschuldigde bedrag ten onrechte of te hoog is
      vastgesteld.

      5 Indien met toepassing van de tweede volzin van het derde lid de aanslag ten name van één renteplichtige is
      gesteld kan:

      a. de ontvanger de aanslag op het gehele perceel verhalen ten name van degene te wiens name de aanslag is gesteld,
      zonder rekening te houden met de rechten van de overige renteplichtigen;

      b. de renteplichtige die de aanslag heeft voldaan hetgeen hij meer heeft voldaan dan overeenkomt met zijn
      renteplicht verhalen op de overige renteplichtigen naar evenredigheid van ieders renteplicht.

      6 Van het vijfde lid, aanhef en onderdeel *b*, kan bij overeenkomst worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel223
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel229
    references:
