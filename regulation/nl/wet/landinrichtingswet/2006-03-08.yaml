  - number: '197'
    text: |-
      In het plan van toedeling kunnen met toestemming van hen, die bevoegd zijn te beschikken ten aanzien van niet
      in het blok gelegen onroerende zaken, regelingen worden opgenomen betreffende grenswijzigingen, burenrechten en
      erfdienstbaarheden.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel197
  - number: '198'
    text: |-
      De landinrichtingscommissie stelt op één of meer door haar te bepalen plaatsen en tijdstippen de eigenaren en
      gebruikers in de gelegenheid hun wensen ten aanzien van het plan van toedeling kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel198
  - number: '199'
    text: |-
      1 Nadat met betrekking tot het blok:

      a. de lijst van rechthebbenden in zoverre is komen vast te staan, dat nog uitsluitend het rechtsmiddel van cassatie
      kan worden toegepast;

      b. het register van schattingsuitkomsten is gesloten;

      c. het begrenzingenplan voor het gehele blok is vastgesteld;

      d. het in het [derde lid van artikel 151][ref1] laatstbedoelde tijdstip is verstreken;

      e. [artikel 198][ref2] toepassing heeft gevonden;

      legt de landinrichtingscommissie het plan van toedeling gedurende een maand kosteloos voor een ieder ter inzage op
      één of meer door haar te bepalen plaatsen.

      2 Van de terinzagelegging geeft de landinrichtingscommissie tevoren openbare kennis in ten minste twee dag-
      of nieuwsbladen die in het gebied, waarin het blok is gelegen, worden verspreid en in de gemeenten, die geheel
      of gedeeltelijk zijn gelegen in zodanig gebied, op de aldaar gebruikelijke wijze alsmede bijzondere kennis bij
      aangetekende brief aan de haar bekende belanghebbenden.

      3 De kennisgevingen houden mededeling in van de bevoegdheid tot het indienen van bezwaren.

      4 Op het niet-ontvangen zijn van de bijzondere kennisgeving kan geen beroep worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel198
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '151'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '198'
        hoofdstuk: VII
  - number: '200'
    text: |-
      Uiterlijk veertien dagen na de laatste dag, waarop het plan van toedeling ter inzage heeft gelegen, kan iedere
      belanghebbende zijn bezwaren tegen het plan van toedeling schriftelijk bij de landinrichtingscommissie indienen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel200
  - number: '201'
    text: |-
      Indien daartegen binnen de termijn en op de wijze in [artikel 200][ref1] bepaald geen bezwaren zijn ingediend,
      staat het plan van toedeling vast. Daarvan maakt de landinrichtingscommissie proces-verbaal op, waarvan zij
      afschrift zendt aan de rechter-commissaris en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel200
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '200'
        hoofdstuk: VII
  - number: '202'
    text: |-
      Op de behandeling van bezwaren zijn de navolgende artikelen van overeenkomstige toepassing:

      a. de [artikelen 172][ref1], [173][ref2] en [174][ref3];

      b. [artikel 175][ref4], met dien verstande dat het derde lid als volgt wordt gelezen: In de oproeping wordt gewezen
      op het rechtsgevolg dat de wet aan het niet-bijwonen van de behandeling verbindt;

      c. [artikel 176][ref5], met uitzondering van het zesde lid, eerste volzin;

      d. de [artikelen 178][ref6] en [179, eerste volzin][ref7];

      e. [artikel 185][ref8], met dien verstande dat het vijfde lid als volgt wordt gelezen: de rechtbank stelt het plan
      van toedeling vast nadat zij in alle geschillen daaromtrent heeft beslist;

      f. de [artikelen 186][ref9], [187][ref10] en [188, eerste volzin][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel173
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel175
      [ref5]: https://wetten.overheid.nl/BWBR0003793#Artikel176
