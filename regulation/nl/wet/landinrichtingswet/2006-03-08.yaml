    text: |-
      1 Gedeputeerde staten nemen het besluit tot herinrichting gelijktijdig met het besluit tot vaststelling van het
      landinrichtingsplan.

      2 Indien gedeputeerde staten het landinrichtingsplan met toepassing van [artikel 82, tweede lid][ref1],
      vaststellen, nemen zij in afwijking van het bepaalde in het eerste lid het besluit tot herinrichting eerst nadat de
      in [artikel 82, zesde lid][ref2], bedoelde termijn is verstreken of zoveel eerder als Onze Minister te kennen heeft
      gegeven van een voordracht tot vernietiging af te zien.


