  - number: '125'
    text: |-
      1 Gedeputeerde staten kunnen in overeenstemming met Onze Minister bepalen, dat met name genoemde andere dan in
      [artikel 127, eerste lid][ref1], bedoelde werken worden uitgevoerd door openbare lichamen, die met het beheer of
      onderhoud daarvan zijn of vermoedelijk zullen worden belast, waarbij een doelmatig verband met andere werken voor
      zoveel mogelijk verzekerd zal zijn.

      2 Omtrent een gecoördineerde uitvoering der voorzieningen plegen de in het eerste lid bedoelde openbare lichamen
      overleg met de landinrichtingscommissie alsmede, indien aanpassingsinrichting plaatsvindt, met het bevoegd
      bestuursorgaan.

      3 Omtrent de uitvoering van werken waarvan het beheer en het onderhoud vermoedelijk ten laste van het Rijk zullen
      komen, beslist de daarbij betrokken Minister, gehoord Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel127
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '127'
        hoofdstuk: VI
  - number: '126'
    text: |-
      Voor zover toepassing is gegeven aan [artikel 189, derde lid][ref1], kunnen het Rijk en de in dat lid bedoelde
      openbare lichamen en rechtspersonen op de aan hen in tijdelijk gebruik gegeven gronden alle werkzaamheden
      verrichten of doen verrichten, welke zij dienstig achten ter verwezenlijking van de in het landinrichtingsplan dan
      wel aanpassingsplan omschreven doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel189
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '189'
        hoofdstuk: VII
  - number: '127'
    text: |-
      1 Indien aanpassingsinrichting plaatsvindt voert het bevoegd bestuursorgaan de werken uit, die strekken tot de
      totstandkoming van de in [artikel 94][ref1] bedoelde voorziening.

      2 Indien aanpassingsinrichting plaatsvindt plegen de landinrichtingscommissie en het bevoegd bestuursorgaan overleg
      over een gecoördineerde uitvoering der voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel94
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel127
