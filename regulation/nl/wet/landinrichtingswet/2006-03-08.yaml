  - number: '84'
    text: |-
      1 Een landinrichtingsplan kan worden gewijzigd tot het tijdstip waarop voor het betrokken gedeelte van het gebied
      het besluit tot vaststelling van het in [artikel 131][ref1] bedoelde begrenzingenplan, of een gedeelte daarvan,
      wordt genomen.

      2 Gedeputeerde staten kunnen tot het tijdstip als bedoeld in het eerste lid de landinrichtingscommissie een
      aanwijzing geven met betrekking tot een op te stellen wijziging van het landinrichtingsplan, indien zich zodanige
      omstandigheden voordoen, dat één of meer wezenlijke onderdelen van het landinrichtingsplan niet of ontoereikend
      kunnen worden verwezenlijkt.

      3 De landinrichtingscommissie kan aan gedeputeerde staten haar zienswijze kenbaar maken omtrent het bestaan van
      omstandigheden als bedoeld in het tweede lid.

      4 In afwijking van de [artikelen 74 tot en met 83][ref2] kunnen de grenzen van een blok worden gewijzigd door de
      landinrichtingscommissie in overeenstemming met de belanghebbende eigenaren.

      5 Maakt de landinrichtingscommissie van deze bevoegdheid gebruik dan doet zij hiervan mededeling aan gedeputeerde
      staten, de rechter-commissaris en de belanghebbende eigenaren.

      6 In afwijking van het eerste lid kan een landinrichtingsplan waarvoor geen begrenzingenplan als bedoeld
      in [artikel 131][ref3] wordt vastgesteld, worden gewijzigd tot het plan van toedeling overeenkomstig
      [artikel 199, eerste lid][ref4], ter inzage wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel131
