  - number: '131'
    text: |-
      1 De landinrichtingscommissie stelt voor een gebied waarvoor een landinrichtingsplan dan wel een aanpassingsplan is
      vastgesteld, in zijn geheel of in gedeelten een ontwerp van een begrenzingenplan op. Zij vervaardigt daartoe één of
      meer kaarten, waarop zo nauwkeurig mogelijk worden aangegeven:

      a. het stelsel van wegen, waterlopen, dijken en kaden met de daartoe behorende kunstwerken, alsmede de
      voorzieningen samenhangende met de wegen en waterlopen, zoals deze zijn omschreven in het landinrichtingsplan dan
      wel aanpassingsplan;

      b. de gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en elementen van landschappelijke,
      recreatieve, cultuurhistorische of natuurwetenschappelijke waarde, alsmede de andere voorzieningen van openbaar nut
      zoals deze zijn omschreven in het landinrichtingsplan dan wel aanpassingsplan.

      2 De landinrichtingscommissie zendt het ontwerp toe aan gedeputeerde staten vergezeld van een voorstel tot
      vaststelling van het begrenzingenplan.

      3 Gedeputeerde staten stellen het begrenzingenplan vast en doen van hun besluit daartoe afschrift met de daarbij
      behorende kaart of kaarten toekomen aan de landinrichtingscommissie en aan de betrokken openbare lichamen.

      4 De landinrichtingscommissie doet gedeputeerde staten, gelijktijdig met het in het tweede lid bedoelde voorstel,
      toekomen:

      a. een voorstel inzake de regeling van de eigendom, het beheer en het onderhoud van de openbare wegen en waterlopen
      met de daarbij behorende kunstwerken en het beheer en onderhoud van dijken en kaden met de daarbij behorende
      kunstwerken;

      b. een voorstel inzake de toewijzing van de eigendom van de in het eerste lid, onder *b*, bedoelde gebieden,
      elementen en voorzieningen.

      5 Indien een landinrichtingsplan geen voornemens als bedoeld in [artikel 75, eerste lid, onder ][ref1], bevat,
      wordt geen begrenzingenplan opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel75
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '75'
        hoofdstuk: III
  - number: '132'
    text: |-
      1 In elk blok zijn de wegen met de daartoe behorende kunstwerken, welke voorheen voor het openbaar verkeer
      waren opengesteld en niet in het begrenzingenplan zijn opgenomen, in afwijking van het bepaalde in de
      [artikelen 8 en 9 van de Wegenwet][ref1] (*Stb.* 1930, 342) door het enkele feit van de- niet-opneming aan
      het openbaar verkeer onttrokken. In elk blok is aan wegen met de daartoe behorende kunstwerken, welke in het
      begrenzingenplan zijn opgenomen, maar die voorheen niet voor het openbaar verkeer waren opengesteld, in afwijking
      van het bepaalde in de [artikelen 4 en 5 van de Wegenwet][ref2] door het enkele feit van de opneming in het
      begrenzingenplan de bestemming van openbare weg gegeven.

      2 Aan wegen met de daartoe behorende kunstwerken gelegen buiten een blok is in afwijking van het bepaalde in de
      [artikelen 4 en 5 van de Wegenwet][ref3] door het enkele feit van de opneming in het begrenzingenplan de bestemming
      van openbare weg gegeven.

      3 De in de vorige leden bedoelde rechtsgevolgen gaan in op de dag volgend op de in [artikel 131, vijfde lid][ref4],
      bedoelde kennisgeving.

      4 In afwijking van het derde lid kunnen gedeputeerde staten besluiten dat de in dat lid bedoelde rechtsgevolgen
      ingaan op een nader door hen te bepalen tijdstip, dat voor de onderscheidene wegen met de daartoe behorende
      kunstwerken verschillend kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel4
