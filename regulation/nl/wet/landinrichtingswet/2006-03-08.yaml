  - number: '57'
    text: |-
      1 De landinrichtingscommissie beslist zo spoedig mogelijk of al dan niet tot registratie wordt overgegaan.

      2 De landinrichtingscommissie stelt bij aangetekende brief partijen in kennis van haar beschikking.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel57
  - number: '58'
    text: |-
      1 Partijen kunnen binnen een maand na de dagtekening van de in [artikel 57, tweede lid][ref1], bedoelde brief
      bij een met redenen omkleed verzoekschrift, vergezeld van de nodige bewijsstukken en van een afschrift van de
      beschikking van de landinrichtingscommissie, deze onderwerpen aan de uitspraak van de voorzitter van de pachtkamer
      van de rechtbank van het arrondissement waarin het gepachte geheel of grotendeels is gelegen.

      2 In afwijking van het bepaalde in het eerste lid kan de partij, die geen bedenkingen overeenkomstig het bepaalde
      in [artikel 56, vijfde lid][ref2], naar voren heeft gebracht, geen gebruik maken van de hem in het eerste lid
      verleende bevoegdheid, indien de landinrichtingscommissie overeenkomstig het verzoek en de gegevens, vermeld in de
      brief, bedoeld in [artikel 56, derde lid][ref3], heeft beslist.

      3 Alle stukken worden ingediend met afschriften voor de partijen, die bij de procedure betrokken zijn, alsmede voor
      de landinrichtingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel56
