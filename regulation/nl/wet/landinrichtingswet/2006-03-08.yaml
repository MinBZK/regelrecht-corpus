      In afwijking van [artikel 80, eerste lid][ref1], stellen gedeputeerde staten het landinrichtingsplan vast na
      toetsing van het ontwerp aan de hoofdlijnen van het provinciaal ruimtelijk beleid, zoals deze hun grondslag vinden
      in of redelijkerwijs voortvloeien uit een streekplan of een ander besluit van provinciale staten, de provinciale
      planologische commissie gehoord.


