preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen met betrekking tot inrichting
    van de landelijke gebieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      bevoegd bestuursorgaan: bestuursorgaan, dat bevoegd is tot besluitneming inzake de verwezenlijking van
      infrastructurele voorzieningen van nationaal of regionaal belang;

      blok: een geheel van in een herverkaveling begrepen onroerende zaken;

      eigenaar: hij, die eigenaar is van een tot het blok behorende onroerende zaak en hij, aan wie een recht van opstal,
      erfpacht, beklemming, vruchtgebruik, gebruik of bewoning toebehoort, waaraan een in het blok begrepen onroerende
      zaak is onderworpen, met dien verstande, dat onder het recht van opstal niet wordt begrepen dat recht voor zover
      het betreft het leggen en houden van leidingen in, op of boven de onroerende zaak van een ander;

      rechthebbende: de eigenaar en hij, aan wie een niet onder de omschrijving van eigenaar genoemd beperkt recht
      toebehoort, waaraan een tot het blok behorende onroerende zaak is onderworpen, hij aan wie met betrekking tot zulk
      een zaak een recht van huur toebehoort of hij aan wie met betrekking tot zulk een zaak een recht als bedoeld in
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1] toebehoort;

      structuurschema: het structuurschema, bedoeld in [artikel 6][ref2];

      voorbereidingsschema: het voorbereidingsschema, bedoeld in [artikel 18][ref3];

      herverkaveling: de samenvoeging, verkaveling en verdeling van onroerende zaken met toepassing van
      [Hoofdstuk VII][ref4];

      openbare registers: de openbare registers, bedoeld in afdeling 1 van titel 2 van Boek 3 van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel6
