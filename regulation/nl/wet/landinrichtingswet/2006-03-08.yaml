  - number: '67'
    text: De voorzitter van het hoofdstembureau maakt onverwijld de uitslag van de stemming bekend.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel67
  - number: '68'
    text: |-
      Indien niet tot ruilverkaveling is besloten, stellen gedeputeerde staten alle stukken die op de voorbereiding van
      de ruilverkaveling betrekking hebben, in handen van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel68
  - number: '69'
    text: |-
      [Artikel 47][ref1] is van overeenkomstige toepassing, met dien verstande, dat in de plaats van "besluit tot
      herinrichting" wordt gelezen: "besluit tot ruilverkaveling".


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel47
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '47'
        hoofdstuk: III
  - number: '70'
    text: |-
      1 Met ingang van het tijdstip waarop het ontwerp van het landinrichtingsplan ter inzage is gelegd tot het tijdstip
      waarop het landinrichtingsplan voor de betrokken onroerende zaken is verwezenlijkt, is het, behoudens daartoe door
      de landinrichtingscommissie verleende toestemming, verboden handelingen te verrichten, die de verwezenlijking van
      het plan ernstig belemmeren.

      2 Het eerste lid is van overeenkomstige toepassing indien het landinrichtingsplan in gedeelten wordt voorbereid of
      vastgesteld, dan wel wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel70
  - number: '71'
    text: |-
      1 Nadat het besluit tot ruilverkaveling is genomen is het eigenaren en gebruiksgerechtigden van in een blok gelegen
      onroerende zaken verboden handelingen te verrichten, of handelingen welke voor een normale bedrijfsvoering zijn
      vereist, achterwege te laten, indien daardoor de waarde van de betrokken onroerende zaken zou veranderen, tenzij de
      landinrichtingscommissie daarmee heeft ingestemd.

      2 Waardevermeerdering, ontstaan nadat het besluit tot ruilverkaveling is genomen, behoeft niet te worden vergoed,
      tenzij deze waardevermeerdering het gevolg is van handelingen, waarmee de landinrichtingscommissie heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel71
  - number: '72'
    text: |-
      Aan een werknemer wordt door Onze Minister uit ’s Rijks kas een geldelijke bijdrage verleend in door hem te bepalen
      gevallen en volgens door hem te stellen regelen, indien het bedrijf waarin de werknemer werkzaam is, ten gevolge
      van de toepassing van [artikel 11][ref1] of van [artikel 146][ref2] wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel146
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel72
