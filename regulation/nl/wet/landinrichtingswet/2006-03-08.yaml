      - id: ref1
        bwb_id: BWBR0003793
        artikel: '11'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '146'
        hoofdstuk: VII
  - number: '73'
    text: |-
      1 Voor een gebied, met betrekking waartoe het besluit tot herinrichting, onderscheidenlijk ruilverkaveling, is
      genomen wordt een landinrichtingsplan vastgesteld.

      2 Het met betrekking tot het gebied vastgestelde landinrichtingsprogramma vormt de grondslag voor het in het vorige
      lid bedoelde landinrichtingsplan.

      3 Het landinrichtingsplan kan in gedeelten worden voorbereid of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel73
  - number: '74'
    text: |-
      1 Het landinrichtingsplan bevat:

      a. de grenzen van het in te richten gebied, alsmede die van ieder tot dat gebied behorende blok;

      b. een beschrijving van de bestaande toestand;

      c. een aanduiding van de ruimtelijke ontwikkeling;

      d. een omschrijving van de te treffen maatregelen en voorzieningen, met, in voorkomende gevallen, vermelding van de
      daarvoor benodigde gronden;

      e. een raming van de kosten en de verdeling daarvan;

      f. één of meer kaarten, die met inachtneming van [artikel 75, tweede lid][ref1], zijn vervaardigd.

      2 De in het eerste lid, onder *d*, bedoelde maatregelen en voorzieningen kunnen onder meer omvatten:

      a. wijziging van het stelsel van wegen, waterlopen, dijken en kaden met de daarbij behorende kunstwerken;

      b. veiligstelling, aanleg en ontwikkeling van gebieden van belang uit een oogpunt van natuur- en landschapsbehoud
      en elementen van landschappelijke, recreatieve, cultuurhistorische en natuurwetenschappelijke waarde;

      c. uitvoering van andere dan onder *a* en *b* begrepen werken van openbaar nut.

      3 Indien [artikel 35, tweede lid][ref2], is toegepast worden de aldaar bedoelde voorzieningen slechts in het
      landinrichtingsplan opgenomen, nadat de aldaar bedoelde instemming is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel35
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '75'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '35'
        hoofdstuk: III
  - number: '75'
    text: |-
      1 Het landinrichtingsplan bevat tevens:

      a. de begrenzing van de in [artikel 36][ref1] bedoelde beheersgebieden onderscheidenlijk reservaatsgebieden;

      b. de voornemens inzake de toewijzing onderscheidenlijk regeling van de eigendom, het beheer en het onderhoud van
      de openbare wegen, waterlopen, dijken en kaden met de daarbij behorende kunstwerken;

      c. de voornemens, alsmede de overwegingen waarop deze zijn gegrond, inzake de toewijzing, met de daarbij in acht te
      nemen voorwaarden, van de eigendom van

        - gebieden van belang uit een oogpunt van natuur- en landschapsbehoud;
        - elementen van landschappelijke, recreatieve, cultuurhistorische en natuurwetenschappelijke waarde;
        - onroerende zaken, waarop andere werken van openbaar nut zullen worden uitgevoerd,

      die voor herinrichting overeenkomstig het derde lid, onder *a*, en voor ruilverkaveling overeenkomstig het vierde
      lid, onder *b*, op de kaarten zijn aangegeven.

      2 Op de in [artikel 74, eerste lid, onder ][ref2], bedoelde kaarten worden zo nauwkeurig mogelijk aangegeven:

      a. de grenzen van het in te richten gebied;

      b. de grenzen van ieder blok;

      c. de te handhaven openbare wegen, waterlopen, dijken en kaden;

      d. de te handhaven gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en elementen van
      landschappelijke, recreatieve, cultuurhistorische en natuurwetenschappelijke waarde;

      e. de in [artikel 74, eerste lid, onder ][ref3], bedoelde maatregelen en voorzieningen;

      f. in voorkomend geval, de grenzen van de in het eerste lid, onder *a*, bedoelde gebieden.

      3 Onverminderd het bepaalde in het tweede lid wordt bij herinrichting ten aanzien van de in
      [artikel 74, eerste lid, onder ][ref4] bedoelde maatregelen en voorzieningen op de kaarten afzonderlijk en zo
      nauwkeurig mogelijk aangegeven:

      a. maatregelen en voorzieningen, voor de verwezenlijking waarvan de verwerving van eigendom van grond noodzakelijk
      is;

      b. maatregelen en voorzieningen, voor de verwezenlijking waarvan [artikel 141][ref5] kan worden toegepast.

      4 Onverminderd het bepaalde in het tweede lid worden bij ruilverkaveling ten aanzien van de in
      [artikel 74, eerste lid, onder ][ref6], bedoelde maatregelen en voorzieningen op de kaarten afzonderlijk en zo
      nauwkeurig mogelijk aangegeven:

      a. maatregelen en voorzieningen voor de verwezenlijking waarvan [artikel 142, eerste lid, aanhef en onder ][ref7],
      kan worden toegepast;

      b. maatregelen en voorzieningen voor de verwezenlijking waarvan [artikel 142, eerste lid, aanhef en onder ][ref8],
      kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel36
