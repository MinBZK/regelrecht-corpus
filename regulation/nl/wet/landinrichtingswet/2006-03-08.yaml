    text: |-
      Gedeputeerde staten nemen het besluit tot herinrichting, dan wel het besluit dat een stemming wordt gehouden
      ter verkrijging van de beslissing of ruilverkaveling zal plaatsvinden met inachtneming van onderscheidenlijk de
      [afdeling II][ref1] en [III][ref2].


