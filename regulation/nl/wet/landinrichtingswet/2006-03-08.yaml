  - number: '232'
    text: |-
      1 Na beëindiging der werkzaamheden draagt de landinrichtingscommissie alle stukken, op de landinrichting betrekking
      hebbende, over aan Onze Minister.

      2 Zodra de overdracht heeft plaatsgevonden is de landinrichtingscommissie van rechtswege ontbonden.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel232
  - number: '240'
    text: |-
      1 Wij behouden Ons voor te bepalen, dat een ruilverkaveling waartoe het besluit tot ruilverkaveling is genomen voor
      het krachtens [artikel 241, tweede lid][ref1], bepaalde tijdstip zal worden voltooid volgens de bepalingen van de
      Ruilverkavelingswet 1954, met dien verstande dat artikel 125 van die wet als volgt wordt gelezen:

      Artikel 125. - 1. De rente wordt geheven en ingevorderd door of vanwege Onze Minister van Financiën.

      2 De heffing en de invordering van de rente geschieden met toepassing van de
      [Algemene wet inzake rijksbelastingen][ref2] (*Stb.* 1959, 301) en de [Invorderingswet 1990][ref3] (*Stb.* 221) als
      ware die rente een rijksbelasting.

      3

      4 Bezwaar en beroep bedoeld in [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref4] kunnen niet zijn
      gegrond op de stelling dat het op grond van [artikel 117][ref5] verschuldigde bedrag ten onrechte of te hoog is
      vastgesteld.

      5 Indien met toepassing van de tweede volzin van het derde lid de aanslag ten name van één renteplichtige is
      gesteld kan:

      a. de ontvanger de aanslag op het gehele perceel verhalen ten name van degene te wiens name de aanslag is gesteld,
      zonder rekening te houden met de rechten van de overige renteplichtigen;

      b. de renteplichtige die de aanslag heeft voldaan hetgeen hij meer heeft voldaan dan overeenkomt met zijn
      renteplicht verhalen op de overige renteplichtigen naar evenredigheid van ieders renteplicht.

      6

      7

      8 Indien ten aanzien van een voorontwerp van een rapport als bedoeld in het vorige lid inspraak heeft
      plaatsgevonden, kan Onze Minister bepalen dat deze inspraak in de plaats treedt van de inspraak bedoeld
      in [artikel 38][ref6], dan wel dat deze inspraak in de plaats treedt van de inspraak als bedoeld in
      [artikel 77][ref7], voortvloeiende uit de toepassing van [Hoofdstuk III, Titel 7][ref8].

      9 Voor een gebied, waarvoor een rapport als bedoeld in artikel 34 van de Ruilverkavelingswet 1954 aan gedeputeerde
      staten is toegezonden, doch waarvoor de stemming als bedoeld in artikel 37 dier wet nog niet is gehouden treedt
      genoemd rapport in de plaats van het ontwerp-landinrichtingsplan zoals voorbereid op de wijze als bedoeld in
      [Hoofdstuk III, Titel 7][ref9].

      10 Voor een gebied waarvoor een rapport als bedoeld in artikel 34 van de Ruilverkavelingswet 1954 door
      gedeputeerde staten is vastgesteld en waarvoor de in artikel 37 dier wet bedoelde stemming nog niet is
      gehouden, treedt het vorengenoemde rapport in de plaats van het landinrichtingsplan dat met toepassing van
      [Hoofdstuk III, Titel 7][ref10] is vastgesteld.

      11 De ingevolge artikel 51 van de Ruilverkavelingswet 1954 benoemde plaatselijke commissie wordt beschouwd als
      landinrichtingscommissie als bedoeld in [Hoofdstuk III, Titel 2][ref11].

      12

      13 Onze Minister kan voor ruilverkavelingen waartoe het besluit tot ruilverkaveling is genomen voor het krachtens
      [artikel 241, tweede lid][ref12], bepaalde tijdstip procedure-onderdelen en proceduremomenten ingevolge de
      Ruilverkavelingswet 1954 gelijkstellen aan procedureonderdelen en proceduremomenten ingevolge deze wet.

      14 Op ruilverkavelingen waartoe is besloten vóór 1 juli 1975 blijven de artikelen 119, 121 en 127, van de
      Ruilverkavelingswet 1954, zoals zij voor dat tijdstip luidden, van toepassing.

      15

      16 de Ontgrondingenwet is niet van toepassing op het uitvoeren van ruilverkavelingen, als bedoeld in het
      eerste lid, met uitzondering van ontgrondingen welke geschieden ter verkrijging van het voor de werken nodige
      bodemmateriaal.

      17 Geldig is een beding in een pachtovereenkomst, als bedoeld in [artikel 14 van de Pachtwet][ref13] (*Stb.* 1958,
      37), ingevolge hetwelk de lasten, welke de verpachter krachtens een ruilverkaveling, als bedoeld in het eerste lid,
      zijn opgelegd ten dele ten laste van de pachter komen.

      18 Een overeenkomst tot vervreemding van land, als bedoeld in [artikel 6 van de Wet agrarisch grondverkeer][ref14]
      wordt goedgekeurd, indien het een ruilverkavelingsovereenkomst als bedoeld in artikel 4 van de Ruilverkavelingswet
      1954 betreft, welke voldoet aan door Onze Minister te stellen eisen.

      19 De ruilverkaveling Tubbergen waarvoor het besluit tot ruilverkaveling is genomen op 21 december 1971, wordt niet
      in uitvoering genomen.

      20 Op nog ingevolge de bepalingen van de Ruilverkavelingswet 1954 verschuldigde ruilverkavelingsrente zijn,
      onverminderd het bepaalde in het [veertiende lid, de artikelen 224][ref15], [226, tweede lid][ref16], en
      [227 tot en met 230][ref17] van overeenkomstige toepassing.


