  - number: '230'
    text: |-
      1 Vóór of op 1 juli van elk jaar kan de rente over de nog niet ingetreden jaren worden afgekocht voor haar waarde
      op genoemde dag.

      2 Ter berekening van die waarde wordt het over een jaar verschuldigde bedrag geacht op de eerste juli van dat jaar
      te verschijnen. De berekening geschiedt voorts naar de rentevoet van drie vijfachtste percent.

      3 De verdere bepalingen omtrent de afkoop worden door Onze Minister van Financiën vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel230
  - number: '231'
    text: |-
      1 Overtreding van het bepaalde in de [artikelen 48][ref1], [49][ref2], [70][ref3], [71][ref4], [116][ref5] en
      [117][ref6] wordt gestraft met geldboete van de derde categorie.

      2 Het strafbare feit wordt als een overtreding beschouwd.


