  - number: '85'
    text: |-
      1 Bij het landinrichtingsplan kan worden bepaald dat, indien het belang van de herverkaveling zulks vordert,
      gedeputeerde staten bevoegd zijn op voorstel van de landinrichtingscommissie, met instemming van Onze Minister en
      met inachtneming van in het plan vervatte regelen het landinrichtingsplan uit te werken en de daarin omschreven
      maatregelen en voorzieningen uit te breiden.

      2 De in het eerste lid bedoelde uitwerking, onderscheidenlijk uitbreiding, maakt deel uit van het
      landinrichtingsplan.

      3 Op de voorbereiding van het plan tot uitwerking, onderscheidenlijk uitbreiding is
      [afdeling 3.4 van de Algemene wet bestuursrecht van toepassing][ref1]. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
