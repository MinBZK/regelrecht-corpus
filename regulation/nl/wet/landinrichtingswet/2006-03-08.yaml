      1 Gedeputeerde staten nemen het besluit, dat een stemming wordt gehouden ter verkrijging van de beslissing of
      ruilverkaveling zal plaatsvinden, gelijktijdig met het besluit tot vaststelling van het landinrichtingsplan.

      2 Indien gedeputeerde staten het landinrichtingsplan met toepassing van [artikel 82, tweede lid][ref1],
      vaststellen, nemen zij in afwijking van het bepaalde in het eerste lid, het besluit dat een stemming
      wordt gehouden ter verkrijging van de beslissing of ruilverkaveling zal plaatsvinden, eerst nadat de in
      [artikel 82, zesde lid][ref2], bedoelde termijn is verstreken of zoveel eerder als Onze Minister te kennen heeft
      gegeven van een voordracht tot vernietiging af te zien.


