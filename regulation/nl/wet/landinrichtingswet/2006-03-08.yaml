  - number: '217'
    text: |-
      1 Nadat zij omtrent alle geschillen betreffende de lijst der geldelijke regelingen heeft beslist, sluit
      de rechtbank de lijst der geldelijke regelingen. Zij geeft hiervan kennis aan Onze Minister en aan de
      landinrichtingscommissie.

      2 Tegen de uitspraak van de rechtbank bestaat behalve cassatie geen rechtsmiddel open. [Artikel 182][ref1] is van
      overeenkomstige toepassing.

      3 Indien de cassatie, als bedoeld in het tweede lid leidt tot een vermindering van de schuldplichtigheid, worden de
      geldelijke gevolgen daarvan door het Rijk gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel182
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '182'
        hoofdstuk: VII
  - number: '218'
    text: |-
      De lijst der geldelijke regelingen, zoals zij door de rechtbank is gesloten, geldt als titel voor de daarin
      omschreven vorderingen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel218
  - number: '219'
    text: |-
      1 De landinrichtingscommissie kan bepalen dat het plan van toedeling en de lijst der geldelijke regelingen
      gelijktijdig zullen worden opgemaakt en ter inzage gelegd. Alsdan worden eerst de bezwaren tegen het plan van
      toedeling en vervolgens die tegen de lijst der geldelijke regelingen behandeld.

      2 In de lijst der geldelijke regelingen dienen te worden opgenomen de geldelijke gevolgen van de behandeling van de
      bezwaren tegen het plan van toedeling.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel219
  - number: '220'
    text: |-
      1 Indien bij toepassing van [artikel 219][ref1] de behandeling van de bezwaren tegen het plan van
      toedeling wijzigingen van de ter inzage gelegde lijst der geldelijke regelingen noodzakelijk maakt, doet de
      landinrichtingscommissie de betrokken belanghebbenden schriftelijk mededeling van de geldelijke gevolgen, welke de
      behandeling van de bezwaren tegen het plan van toedeling heeft voor de lijst der geldelijke regelingen.

      2 De landinrichtingscommissie stelt in dat geval de betrokken belanghebbenden in de gelegenheid uiterlijk veertien
      dagen na de verzending van die mededeling schriftelijk bezwaren tegen die geldelijke gevolgen in te dienen.

      3 Voor zover in het geval, bedoeld in het tweede lid, bezwaren zijn ingediend, worden deze bezwaren tezamen met de
      eerder tegen de lijst der geldelijke regelingen ingediende bezwaren behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel219
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '219'
        hoofdstuk: VII
  - number: 220a
    text: |-
      De [hoofdstukken 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing ten aanzien
      van de bezwaren, bedoeld in de [artikelen 152, tweede lid][ref3], [170, eerste lid][ref4], [191][ref5],
      [200][ref6], [205, tweede lid][ref7], [214][ref8], en [219, eerste lid][ref9], en van het beroep, bedoeld in
      [artikel 157, tweede lid][ref10].


