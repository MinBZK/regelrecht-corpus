  - number: '140'
    text: |-
      Onder waarde wordt in de [artikelen 141-145][ref1] verstaan de waarde, bedoeld in
      [artikel 162, tweede lid, onder ][ref2], zoals deze op grond van de schatting is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel162
