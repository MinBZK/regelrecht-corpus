        artikel: '94'
        hoofdstuk: IV
  - number: '128'
    text: |-
      1 Binnen het in te richten gebied kunnen op de terreinen metingen en waarnemingen worden verricht en tekens worden
      gesteld en binnen een blok kan houtgewas worden geplant en gekapt, en kunnen zoden, aarde, grind en andere specie
      aan de terreinen worden onttrokken of daarop worden neergelegd.

      2 Binnen een blok kunnen werken worden uitgevoerd met betrekking tot de ontsluiting, waterbeheersing, inrichting en
      profielopbouw der gronden.

      3 Binnen een blok kunnen opstallen worden afgebroken, verbouwd, verplaatst, gebouwd of herbouwd, indien dit naar
      het oordeel van Onze Minister nodig is ter verwezenlijking van het landinrichtingsplan, of een vastgesteld gedeelte
      daarvan.

      4 De uitvoering van de werken, bedoeld in het eerste-derde lid mag niet ter hand worden genomen, alvorens door de
      zorg van de landinrichtingscommissie een beschrijving is gemaakt van de betrokken onroerende zaak, door middel van
      daartoe geschikte middelen, voor zover dit niet bij de eerste schatting is geschied.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel128
  - number: '129'
    text: |-
      1 Hij, die de eigendom van een onroerende zaak heeft of hij, aan wie een beperkt recht toebehoort, waaraan een
      onroerende zaak is onderworpen dan wel de gebruiker van een onroerende zaak, moet gedogen, dat het bepaalde
      in de [artikelen 124-128][ref1] wordt uitgevoerd en dat daartoe zijn gebouwen en terreinen worden betreden.
      [Artikel 9, tweede lid][ref2], is van overeenkomstige toepassing.

      2 De schade, welke uit de toepassing van de [artikelen 124-128][ref3] voortvloeit, wordt vergoed. Het verzoek om
      schadevergoeding wordt ingediend bij de landinrichtingscommissie. Bij geschil over het beloop der schade wordt dit
      op verzoek van de meest gerede partij, nadat de wederpartij de gelegenheid heeft gehad haar belangen te verdedigen,
      door de rechtbank bij beschikking vastgesteld. Tegen de uitspraak staat geen rechtsmiddel open.

      3 Aan de belanghebbende, bedoeld in het eerste lid, wordt op zijn verzoek een voorschot op de schadevergoeding
      toegekend. Het bedrag van het voorschot wordt op verzoek van de belanghebbende door de rechter-commissaris
      vastgesteld, gehoord de landinrichtingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel124
