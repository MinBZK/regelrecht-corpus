  - number: '76'
    text: |-
      1 Op de voorbereiding van een ontwerp landinrichtingsplan als bedoeld in [artikel 79, eerste lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing, met dien verstande dat
      daaraan toepassing wordt gegeven door de landinrichtingscommissie. Onder het in het tweede lid bedoelde voorontwerp
      van het landinrichtingsplan wordt het ingevolge [artikel 3:11, eerste lid][ref3], door de landinrichtingscommissie
      ter inzage te leggen ontwerp verstaan.

      2 De landinrichtingscommissie stelt een voorontwerp van het landinrichtingsplan op na overleg met de colleges van
      burgemeester en wethouders van de betrokken gemeenten en de besturen van de betrokken waterschappen.

      3 Het voorontwerp kan met betrekking tot eenzelfde aangelegenheid meer dan één mogelijkheid van te treffen
      maatregelen of voorzieningen bevatten.

      4 Voor zover het voorontwerp uitvoering van werken op onroerende zaken bevat, waarvan de eigendom, het beheer
      of het onderhoud bij een gemeente of waterschap berust, stelt de landinrichtingscommissie het daarop betrekking
      hebbende gedeelte van het voorontwerp op in overeenstemming met het college van burgemeester en wethouders van die
      gemeente of dat waterschap.

      5 Onder betrokken gemeenten en waterschappen worden verstaan de gemeenten en waterschappen, waarin het gebied
      bedoeld in [artikel 74, eerste lid, onder a][ref4], is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel311
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel74
