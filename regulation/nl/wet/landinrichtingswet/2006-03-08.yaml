  - number: '139'
    text: |-
      1 Iedere eigenaar heeft aanspraak op het verkrijgen van een recht van dezelfde aard als hij had op de in een blok
      gelegen onroerende zaken, op de voet van het in de [artikelen 141][ref1], [142][ref2] en [143][ref3] bepaalde.

      2 De in het eerste lid bedoelde aanspraak bestaat niet ten aanzien van rechten op onroerende zaken, die voor de
      verwezenlijking van het landinrichtingsplan ter onteigening zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel141
