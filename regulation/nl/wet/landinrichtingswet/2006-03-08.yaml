  - number: '79'
    text: |-
      1 De landinrichtingscommissie stelt het landinrichtingsplan in ontwerp vast en zendt dit aan gedeputeerde staten.

      2 Gedeputeerde staten brengen het ontwerp onverwijld ter kennis van de colleges van gedeputeerde staten van de
      andere provincies, op welker grondgebied dit mede betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel79
  - number: '80'
    text: |-
      1 Gedeputeerde staten stellen het landinrichtingsplan vast.

      2 Op de voorbereiding van het landinrichtingsplan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. De terinzagelegging geschiedt tevens ter secretarie van de gemeenten en de waterschappen die geheel
      of gedeeltelijk zijn gelegen in het in te richten gebied. Zienswijzen kunnen naar voren worden gebracht door een
      ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel80
