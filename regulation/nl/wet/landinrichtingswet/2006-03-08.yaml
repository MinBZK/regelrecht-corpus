  - number: '137'
    text: |-
      Binnen zes maanden na ontvangst van de in [artikel 131, tweede en vierde lid][ref1], bedoelde voorstellen, wijzen
      gedeputeerde staten de eigendom van gebieden van belang uit een oogpunt van natuur- en landschapsbehoud, elementen
      van landschappelijke, recreatieve, cultuurhistorische of natuurwetenschappelijke waarde en de overige gronden
      bestemd voor doeleinden van openbaar nut, met uitzondering van die, bedoeld in [artikel 133][ref2], toe aan

      a. het Rijk, dan wel

      b. in overeenstemming met Onze Minister aan een ander openbaar lichaam of een andere rechtspersoon dan het Rijk,
      indien deze andere rechtspersoon daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel131
