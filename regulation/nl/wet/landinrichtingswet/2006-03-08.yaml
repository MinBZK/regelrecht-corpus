  - number: '143'
    text: |-
      1 Bij aanpassingsinrichting wordt de totale waarde van de in het blok opgenomen gronden tot een maximum van drie
      procent verminderd met de waarde van de in het blok gelegen gronden, benodigd voor:

      a. de in [artikel 141, eerste lid, onder ][ref1], genoemde aangelegenheden, en, voor zover ten aanzien van de
      betreffende gronden geen toepassing is gegeven aan het bepaalde in [artikel 146, eerste lid][ref2]:

      b. het verwezenlijken van maatregelen en voorzieningen met betrekking tot de natuur, het landschap en de
      openluchtrecreatie.

      2 Bij aanpassingsinrichting staat de aan een eigenaar toe te delen waarde in kavels tot de na toepassing van het
      eerste lid verkregen waarde als de waarde van zijn rechten op de in het blok gelegen gronden tot de totale waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel146
