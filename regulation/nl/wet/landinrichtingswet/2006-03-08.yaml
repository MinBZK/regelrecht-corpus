      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '81'
    text: |-
      De vaststelling van de hoogte van de door het Rijk te dragen kosten zoals deze in het landinrichtingsplan worden
      opgenomen, geschiedt in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel81
  - number: '82'
    text: |-
      1 Indien gedeputeerde staten voornemens zijn af te wijken van het ontwerp, winnen zij advies in van de
      landinrichtingscommissie, alvorens zij het landinrichtingsplan vaststellen.

      2 Voor zover gedeputeerde staten het landinrichtingsplan vaststellen in afwijking van het in het vorige lid
      bedoelde advies, zenden zij hun besluit daartoe binnen twee weken na vaststelling aan Onze Minister.

      3 Het gedeelte van het in het vorige lid bedoelde besluit, waarbij wordt afgeweken van het in het eerste lid
      bedoelde advies, kan door Ons worden vernietigd.

      4 Het koninklijk besluit tot vernietiging wordt in het *Staatsblad* geplaatst.

      5 Een voordracht tot vernietiging wordt Ons door Onze Minister gedaan.

      6 Een besluit tot vernietiging kan niet worden genomen, indien een jaar is verstreken na de ontvangst van het in
      het tweede lid bedoelde besluit. Wij behouden Ons voor de termijn van een jaar met zes maanden te verlengen.

      7 Onze Minister zendt het besluit tot vernietiging onverwijld aan:

      a. de landinrichtingscommissie;

      b. gedeputeerde staten;

      c. de gemeenten en de waterschappen op welker grondgebied het besluit tot vernietiging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel82
  - number: '83'
    text: |-
      Tegen de in [artikel 75, eerste lid, onder c][ref1], bedoelde voornemens tot toewijzing van de eigendom, voor zover
      zulks geschiedt met toepassing van [artikel 142, eerste lid, aanhef en onder b en c][ref2], dan wel met toepassing
      van [artikel 122 van de Onteigeningswet][ref3], kunnen uitsluitend rechthebbenden en pachters die zich tijdig
      tot gedeputeerde staten hebben gewend met bedenkingen tegen deze voornemens of die bedenkingen hebben tegen deze
      voornemens voor zover deze afwijken van die in het ter inzage gelegde ontwerp van het landinrichtingsplan beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel122
