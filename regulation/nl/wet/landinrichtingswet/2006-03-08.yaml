  - number: '203'
    text: |-
      Indien overeenkomstig de arresten van de Hoge Raad inzake de bezwaren tegen de lijst van rechthebbenden door de
      rechtbank wijzigingen in die lijst worden aangebracht, alsmede indien ingevolge het bepaalde in [artikel 152][ref1]
      wijzigingen worden aangebracht in de registratie, bedoeld in [artikel 151][ref2], brengt de rechtbank de daardoor
      noodzakelijk geworden wijzigingen in het plan van toedeling aan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel151
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel203
