  - number: '138'
    text: |-
      1 Gedeputeerde staten doen van hun besluiten, bedoeld in de [artikelen 133][ref1] en [137][ref2], mededeling door
      toezending van een afschrift aan de landinrichtingscommissie.

      2 Van de besluiten van gedeputeerde staten inzake de toewijzing van de eigendom van

      a. de openbare wegen en waterlopen met de daartoe behorende kunstwerken;

      b. gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en elementen van landschappelijke,
      recreatieve, cultuurhistorische of natuurwetenschappelijke waarde,

      een en ander voor zover zij gelegen zijn buiten een blok, wordt een akte opgemaakt door een door de
      landinrichtingscommissie aan te wijzen notaris en ondertekend door de voorzitter en de secretaris van de
      landinrichtingscommissie.

      3 Door de inschrijving van de akte in de openbare registers wordt de daarin omschreven eigendom verkregen.

      4 Tegen een besluit als bedoeld in [artikel 133][ref3] kunnen uitsluitend belanghebbende openbare lichamen en
      andere rechtspersonen, met uitzondering van de rechtspersonen waarvan de toewijzing of regeling is geschied met
      toepassing van [artikel 133, vierde lid][ref4], beroep instellen bij de Afdeling bestuursrechtspraak van de Raad
      van State.

      5 Gedeputeerde staten doen van de uitspraak in beroep mededeling door toezending van een afschrift ervan aan de
      landinrichtingscommissie, alsmede ter inschrijving in de openbare registers, aan het desbetreffende kantoor van de
      Dienst voor het kadaster en de openbare registers:

      a. indien door de uitspraak in beroep de eigendom aan een ander openbaar lichaam wordt toegewezen dan in de in het
      tweede lid bedoelde akte is vermeld;

      b. indien de in [artikel 207][ref5] bedoelde akte van toedeling is ingeschreven in de openbare registers en door de
      uitspraak in beroep de eigendom aan een ander openbaar lichaam of een andere rechtspersoon wordt toegewezen dan in
      die akte is vermeld.

      6 Door inschrijving van de uitspraak in beroep in de openbare registers wordt de in die uitspraak omschreven
      eigendom verkregen door de in die uitspraak genoemde openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel133
