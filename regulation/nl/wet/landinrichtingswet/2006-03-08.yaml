  - number: '209'
    text: |-
      Na de inschrijving van de akte van toedeling wordt hij, aan wie daarbij enige onroerende zaak in eigendom of
      gebruik is toegedeeld, op bevelschrift van de rechter-commissaris desnoods door middel van de sterke arm, in de
      macht daarvan gesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel209
  - number: '210'
    text: |-
      1 De landinrichtingscommissie geeft, op een tijdstip door haar te bepalen, aan de schatters, bedoeld in
      [artikel 164][ref1], opdracht tot het schatten van:

      a. voor iedere eigenaar de verandering van de waarde van de gronden en de overige onroerende zaken als gevolg van
      de landinrichting, voor zover niet begrepen onder *b*;

      b. de in artikel [144, tweede lid][ref2], bedoelde verandering van de waarde der gronden;

      c. bij overgang der onroerende zaken de verrekenposten tussen de oude en nieuwe eigenaar, te weten:

      1°. de waardeveranderingen, bedoeld in de artikelen [49][ref3], [71][ref4] en [117][ref5], voor zover deze voor
      verrekening in aanmerking komen en daarmede bij de eerste schatting nog geen rekening is gehouden;

      2°. de waarde der gebouwen, werken en beplantingen;

      3°. de andere dan agrarische waarde der gronden;

      4°. de overige zaken.

      2 De in het eerste lid, onder *c*, sub 1°, 2° en 3°, bedoelde waarden worden vastgesteld naar het tijdstip
      van de in[ artikel 199, eerste lid][ref6], bedoelde ter inzagelegging van het plan van toedeling. De schatting
      van de zaken bedoeld in het eerste lid, onder *c*, sub 4°, kan zo nodig plaatsvinden naar het tijdstip van de
      kavelovergang.

      3 Bij regeling van Onze Minister worden nadere regels gesteld over de wijze waarop de schatting wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel144
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel71
      [ref5]: https://wetten.overheid.nl/BWBR0003793#Artikel117
      [ref6]: https://wetten.overheid.nl/BWBR0003793#Artikel199
