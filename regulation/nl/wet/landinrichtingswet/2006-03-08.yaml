  - number: '153'
    text: |-
      1 Bestaande pachtverhoudingen blijven zoveel mogelijk gehandhaafd. Wanneer het belang van de landinrichting
      zulks dringend vordert, kan de landinrichtingscommissie een bestaande pachtverhouding opheffen en een nieuwe
      pachtverhouding vestigen in dier voege, dat aan een verpachter een pachter uit de in[ artikel 150][ref1] bedoelde
      pachters wordt toegewezen.

      2 De landinrichtingscommissie bepaalt tot welk tijdstip de uit een nieuw gevestigde pachtverhouding voortvloeiende
      pachtovereenkomst zal gelden en of deze overeenkomst, indien zij voor kortere dan de wettelijke duur zal gelden,
      voor verlenging vatbaar zal zijn. Zij draagt daarbij zorg, dat de pachter en de verpachter, wat het einde en de
      verlengbaarheid der overeenkomst betreft, zoveel mogelijk dezelfde aanspraken behouden als zij aan de opgeheven
      pachtverhouding konden ontlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel150
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '150'
        hoofdstuk: VII
  - number: '154'
    text: |-
      De landinrichtingscommissie deelt zo spoedig mogelijk nadat het plan van toedeling is komen vast te staan, aan de
      grondkamer mede welke pachtverhoudingen gehandhaafd, welke opgeheven en welke nieuw gevestigd zijn onder vermelding
      van de namen en woonplaatsen van partijen in de pachtverhoudingen, de onroerende zaken waarop deze betrekking
      hebben en de bepalingen op grond van [artikel 153][ref1] inzake de duur en de verlengbaarheid der uit de gevestigde
      pachtverhoudingen voortvloeiende pachtovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel153
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '153'
        hoofdstuk: VII
  - number: '155'
    text: |-
      1 De grondkamer ontwerpt de pachtovereenkomsten, welke uit de gevestigde pachtverhoudingen voortvloeien, en neemt
      daarin op de in [artikel 153, tweede lid][ref1], bedoelde bepalingen.

      2 Indien ingevolge het bepaalde in [artikel 153][ref2] een overeenkomst, geldende voor kortere dan de wettelijke
      duur, verlengbaar zal zijn, doet de grondkamer daarvan blijken door een op de ontwerp-pachtovereenkomst gestelde en
      door haar ondertekende verklaring.

      3 De grondkamer zendt de ontwerp-pachtovereenkomst aan hen, die daarbij partijen zullen zijn, en stelt hen in de
      gelegenheid binnen dertig dagen na toezending de ondertekende overeenkomst aan de grondkamer te doen toekomen.
      Betrokkenen kunnen de door hen overeengekomen pachtprijs, alsmede bijzondere bepalingen in de overeenkomst opnemen.

      4 Op de in het vorige lid bedoelde pachtovereenkomsten vinden de bepalingen van de [Pachtwet][ref3] toepassing,
      met dien verstande dat de grondkamer niet treedt in de beoordeling van de bepalingen der overeenkomst, welke
      voortvloeien uit de pachtverhouding, zoals deze door het plan van toedeling is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0002269
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '153'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '153'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0002269
  - number: '156'
    text: |-
      Indien partijen niet binnen de in [artikel 155, derde lid][ref1], gestelde termijn tot inzending van de getekende
      pachtovereenkomst bij de grondkamer zijn overgegaan, maakt de grondkamer een akte in drievoud op, gelijkluidend aan
      de aan partijen gezonden ontwerp-pachtovereenkomst en bepaalt daarin de pachtprijs. De grondkamer ondertekent de
      akte en zendt een exemplaar daarvan bij aangetekende brief aan ieder der partijen toe.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel155
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '155'
        hoofdstuk: VII
  - number: '157'
    text: |-
      1 De akte heeft dezelfde kracht als een tussen partijen gesloten, door de grondkamer goedgekeurde,
      pachtovereenkomst.

      2 Het opmaken en ondertekenen van de akte is een beschikking van de grondkamer, waartegen partijen beroep kunnen
      instellen. Het beroep moet worden ingesteld binnen dertig dagen na de verzending van de in [artikel 156][ref1]
      bedoelde aangetekende brief.

      3 De Centrale Grondkamer, beslissende op een beroep, als bedoeld in het tweede lid, kan de akte wijzigen met
      uitzondering van bepalingen, welke voortvloeien uit de pachtverhouding, zoals deze door het plan van toedeling is
      komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel156
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '156'
        hoofdstuk: VII
  - number: '158'
    text: |-
      1 Partijen in een gehandhaafde pachtverhouding zenden, binnen dertig dagen, nadat het plan van toedeling is komen
      vast te staan, een nieuwe overeenkomst ter goedkeuring bij de grondkamer in.

      2 De nieuwe overeenkomst eindigt op hetzelfde tijdstip als waarop de overeenkomst, waarvoor zij in de plaats
      treedt, zou zijn geëindigd. Indien laatstbedoelde overeenkomst voor de wettelijke duur gold, tekent de grondkamer
      op de nieuwe overeenkomst aan, dat deze verlengbaar zal zijn.

      3 Indien aan het bepaalde in het eerste lid niet is voldaan, vinden op verzoek van de meest gerede partijen de
      [artikelen 156][ref1] en [157][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel157
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '156'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '157'
        hoofdstuk: VII
  - number: '159'
    text: |-
      1 Alle pachtovereenkomsten, welke ingevolge de bepalingen van deze titel tot stand komen, treden van rechtswege
      in werking op het tijdstip, waarop de in [artikel 207][ref1] bedoelde akte van toedeling in de openbare registers
      wordt ingeschreven.

      Op hetzelfde tijdstip eindigen de pachtovereenkomsten, voor welke de eerstgenoemde pachtovereenkomsten in de plaats
      treden.

      2 Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van de rechtsverhoudingen, geregeld
      bij een akte, als bedoeld in[ artikel 156][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel207
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel156
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '207'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '156'
        hoofdstuk: VII
  - number: '160'
    text: |-
      1 In elk blok worden de niet onder [Titel 1][ref1] begrepen beperkte rechten, het recht van huur en de lasten,
      welke met betrekking tot de onroerende zaken bestaan, geregeld of opgeheven onder regeling van de geldelijke
      gevolgen daarvan; ruilverkavelingsrenten, herverkavelingsrenten, reconstructierenten, herinrichtingsrenten en
      landinrichtingsrenten worden afgekocht overeenkomstig de daaromtrent geldende wettelijke bepalingen.

      2 In het belang der herverkaveling kunnen beperkte rechten worden gevestigd.

      3 De hypotheken gaan met behoud van haar rang over op de kavels of gedeelten van kavels, welke in de plaats van de
      onroerende zaak, waarop zij rusten, worden toegedeeld. In de gevallen, voorzien in [artikel 146][ref2], oefenen de
      hypotheekhouder en degene, die op de zaak een recht van grondrente had, hun rechten uit op de wijze als omschreven
      in [artikel 43 van de onteigeningswet][ref3].

      4 Conservatoire en executoriale beslagen gaan over op de kavels of gedeelten van kavels, welke in de plaats van de
      onroerende zaak, waarop zij gelegd zijn, worden toegedeeld, alsmede op de geldsommen, welke in de plaats van kavels
      of ter zake van onderbedeling worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel146
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel43
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0003793
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '146'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '43'
  - number: '161'
    text: |-
      De landinrichtingscommissie stelt voor elk blok een zo volledig mogelijke lijst van rechthebbenden samen met
      vermelding van de aard en omvang van ieders recht.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel161
  - number: '162'
    text: |-
      1 Met betrekking tot ieder blok wordt een stelsel van classificatie van de gronden, hierna te noemen stelsel van
      classificatie, vastgesteld.

      2 Het stelsel van classificatie bevat:

      a. een algemene beschrijving van de aard, de kenmerken, het gebruik en zonodig de gesteldheid van de gronden;

      b. de indeling in klassen van de te schatten gronden;

      c. voor elke onder *b* bedoelde klasse de agrarische waarde per hectare, die als grondslag voor de toedeling zal
      dienen.

      3 Het stelsel van classificatie bevat tevens de grondslagen en de uitgangspunten voor:

      a. de bepaling van de waardeverandering van de tot het blok behorende gronden en overige onroerende zaken als
      gevolg van de verwezenlijking van het landinrichtingsplan;

      b. de bepaling van de vergoedingen, die verband houden met de overgang van onroerende zaken;

      c. de schatting van de andere dan de agrarische waarde.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel162
  - number: '163'
    text: Bij regeling van Onze Minister wordt het stelsel van classificatie vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel163
  - number: '164'
    text: |-
      1 De landinrichtingscommissie benoemt de schatters, die onder haar leiding de eerste schatting zullen verrichten.

      2 De landinrichtingscommissie kan zonodig voor de schatters één of meer plaatsvervangers benoemen.

      3 De schatters treden steeds in oneven getale op.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel164
  - number: '165'
    text: De schatters verrichten hun werkzaamheden met inachtneming van het stelsel van classificatie.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel165
  - number: '166'
    text: |-
      Met betrekking tot ieder blok wordt, met inachtneming van het stelsel van classificatie een eerste schatting
      uitgevoerd, waarbij de gronden in klassen worden ingedeeld, en de gegevens met betrekking tot de inrichting van de
      gronden worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel166
  - number: '167'
    text: |-
      De landinrichtingscommissie legt voor elk blok de uitkomsten van de eerste schatting vast in een register van
      schattingsuitkomsten en op een kaart waarop de klassegrenzen staan aangegeven.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel167
  - number: '168'
    text: |-
      1 De landinrichtingscommissie legt op één of meer door haar te bepalen plaatsen gedurende een maand kosteloos voor
      een ieder ter inzage:

      a. de lijst van rechthebbenden;

      b. het register van schattingsuitkomsten met een kaart waarop de klassegrenzen en de gegevens met betrekking tot de
      inrichting der gronden zijn aangegeven.

      2 Van de terinzagelegging geeft de landinrichtingscommissie tevoren openbare kennis in ten minste twee dag- of
      nieuwsbladen die in het gebied, waarin het blok is gelegen, worden verspreid en in de gemeenten, die geheel of
      gedeeltelijk zijn gelegen in zodanig gebied, op de aldaar gebruikelijke wijze, alsmede bijzondere kennis bij
      aangetekende brief aan de haar bekende belanghebbenden.

      3 De kennisgevingen houden mededeling in van de bevoegdheid tot het indienen van bezwaren.

      4 Op het niet-ontvangen zijn van de bijzondere kennisgeving kan geen beroep worden gedaan.

      5 De landinrichtingscommissie stelt de lijst van rechthebbenden in haar geheel of in uittreksel tegen betaling van
      de kosten verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel168
  - number: '169'
    text: |-
      Na de terinzagelegging bedoeld in [artikel 168, eerste lid][ref1], kunnen de grenzen van een blok niet meer worden
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel168
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '168'
        hoofdstuk: VII
  - number: '170'
    text: |-
      1 Uiterlijk veertien dagen na de laatste dag, waarop de in [artikel 168, eerste lid][ref1], bedoelde stukken
      ter inzage hebben gelegen, kan iedere belanghebbende zijn bezwaren tegen de toekenning en omschrijving van
      rechten op de lijst van rechthebbenden en tegen de uitkomsten van de eerste schatting schriftelijk bij de
      landinrichtingscommissie indienen.

      2 Na verloop van de in het eerste lid bepaalde termijn kunnen slechts zij als rechthebbende worden erkend, die
      voorkomen op de lijst van rechthebbenden of die tegen de daarop voorkomende toekenning of omschrijving van rechten
      bezwaren hebben ingediend, of hun rechtverkrijgenden.

      3 Rechtverkrijgende, als bedoeld in het tweede lid, is degene die een onroerende zaak, een beperkt recht of een
      recht als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref2] verkrijgt en waarvan de verkrijging
      blijkt uit in de openbare registers ingeschreven stukken, alsmede degene die onder algemene titel een recht van
      huur verkrijgt dat is vermeld op de lijst van rechthebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel168
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '168'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '252'
  - number: '171'
    text: |-
      Indien daartegen binnen de termijn en op de wijze, in [artikel 170, eerste lid][ref1], bepaald, geen bezwaren
      zijn ingediend, staan de rechten, zoals zij op de lijst van rechthebbenden zijn omschreven en toegekend, en de
      uitkomsten van de eerste schatting vast. Daarvan maakt de landinrichtingscommissie proces-verbaal op.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel170
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '170'
        hoofdstuk: VII
  - number: '172'
    text: |-
      1 Indien binnen de termijn en op de wijze in [artikel 170, eerste lid][ref1], bepaald, bezwaren zijn ingediend,
      onderzoekt de landinrichtingscommissie de bezwaren en tracht zij overeenstemming te bereiken.

      2 De landinrichtingscommissie maakt omtrent ieder bezwaarschrift als bedoeld in het eerste lid en het daaromtrent
      verhandelde afzonderlijk procesverbaal op en zendt daarvan zo spoedig mogelijk afschrift aan degene, die het
      bezwaar heeft ingediend, alsmede aan de haar bekende belanghebbenden.

      3 Voor zover overeenstemming is verkregen, wijzigt de landinrichtingscommissie zo nodig de lijst van rechthebbenden
      of het register van schattingsuitkomsten. De wijzigingen worden vermeld in de processen-verbaal als bedoeld in het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel170
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '170'
        hoofdstuk: VII
  - number: '173'
    text: |-
      De landinrichtingscommissie maakt omtrent ieder bezwaarschrift dat niet binnen de termijn of op de wijze in
      [artikel 170, eerste lid][ref1], bepaald, is ingediend, afzonderlijk proces-verbaal op waarin zij de redenen
      vermeldt op grond waarvan naar haar oordeel de indiening in strijd is met [artikel 170, eerste lid][ref2]. Zij
      zendt daarvan zo spoedig mogelijk afschrift aan degene die het bezwaar heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel170
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '170'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '170'
        hoofdstuk: VII
  - number: '174'
    text: |-
      De landinrichtingscommissie zendt zo spoedig mogelijk een afschrift van de in [artikel 168, eerste lid][ref1],
      bedoelde stukken, van de ingediende bezwaarschriften en van de krachtens de [artikelen 171][ref2], [172][ref3] en
      [173][ref4] opgemaakte processen-verbaal aan Onze Minister en aan de rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel168
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel173
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '168'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '171'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '172'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0003793
        artikel: '173'
        hoofdstuk: VII
  - number: '175'
    text: |-
      1 Zo spoedig mogelijk na ontvangst van een proces-verbaal, bedoeld in de [artikelen 172][ref1] of [173][ref2] stelt
      de rechter-commissaris tijd en plaats vast voor de behandeling van de bezwaren. Hij doet hiervan mededeling aan de
      landinrichtingscommissie en aan Onze Minister.

      2 De rechter-commissaris roept hen met wie omtrent hun bezwaar geen overeenstemming is verkregen en hen,
      wier bezwaren zijn opgenomen in een proces-verbaal als bedoeld in [artikel 173][ref3], alsmede de hem bekende
      belanghebbenden bij die bezwaren bij aangetekende brief op, om in persoon of bij schriftelijke gemachtigde bij de
      behandeling aanwezig te zijn.

      3 In de oproeping wordt gewezen op het rechtsgevolg dat de wet aan het niet-bijwonen van de behandeling en aan het
      vaststaan van de rechten verbindt.

      4 De behandeling vindt niet plaats dan nadat ten minste veertien dagen na het verzenden van de oproepingen zijn
      verstreken.

      5 Op het niet-ontvangen zijn van de oproeping kan geen beroep worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel173
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel173
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '172'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '173'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '173'
        hoofdstuk: VII
  - number: '176'
    text: |-
      1 De rechter-commissaris tracht overeenstemming te verkrijgen omtrent de door hem te behandelen bezwaren.

      2 Van de behandeling van de bezwaren door de rechter-commissaris maakt deel uit een plaatsopneming als bedoeld in
      [artikel 201 van het Wetboek van Burgerlijke rechtsvordering][ref1], indien degene die bezwaar maakt dit wenst.

      3 De rechter-commissaris doet zich bij de behandeling bijstaan door de griffier van de rechtbank.

      4 Bij de behandeling zijn aanwezig één of meer vertegenwoordigers van Onze Minister, één of meer vertegenwoordigers
      van de landinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger.

      5 Indien de behandeling niet op één dag kan aflopen, verdaagt de rechter-commissaris haar. Hij deelt het tijdstip
      van voortzetting mee aan hen, die verschenen zijn. Een nadere oproeping heeft niet plaats.

      6 Tijdens de behandeling worden eerst de toekenning en de vaststelling van de rechten en daarna de schattingen
      behandeld. Van het verhandelde omtrent elk van beide onderwerpen maakt de rechter-commissaris een afzonderlijk
      proces-verbaal op, waarvan hij afschrift zendt aan Onze Minister en de landinrichtingscommissie.

      7 Zij, die niet in persoon noch bij schriftelijk gemachtigde bij de behandeling van hun bezwaren aanwezig zijn,
      worden geacht die bezwaren te hebben ingetrokken.

      8 Het zesde lid is niet van toepassing op hen, die binnen een week na de dag van de behandeling bij aangetekende
      brief, gericht aan de rechter-commissaris, hun niet-verschijnen verklaren met een beroep op overmacht en de
      gegrondheid van deze bewering binnen een door de rechter-commissaris te bepalen termijn aan deze aannemelijk maken.

      9 Indien de rechter-commissaris het beroep op overmacht gegrond acht, stelt hij een nadere dag voor de behandeling
      van de bezwaren vast.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel201
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '201'
  - number: '177'
    text: |-
      1 Voor zover omtrent de toekenning, de aard en de omvang der rechten overeenstemming is verkregen, dan wel het in
      het zesde lid van het vorige artikel bedoelde geval zich voordoet, staan de rechten vast.

      2 Partijen, tussen wie geen overeenstemming is verkregen, worden door de rechter-commissaris naar een door hem te
      bepalen zitting van de rechtbank verwezen. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel177
  - number: '178'
    text: |-
      1 Voor zover de behandeling door de rechter-commissaris tot overeenstemming heeft geleid, wijzigt hij zonodig het
      register van schattingsuitkomsten. De rechter-commissaris maakt daarvan melding in het proces-verbaal.

      2 Voor zover geschillen blijven bestaan, verwijst de rechter-commissaris de zaak naar een nader te bepalen zitting
      van de rechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel178
  - number: '179'
    text: |-
      De rechtbank behandelt zaken betreffende de toekenning en de vaststelling van de rechten en de schattingen vóór
      elke andere, met uitzondering van die betreffende onteigening. Zaken betreffende de lijst van rechthebbenden worden
      behandeld voor zaken betreffende het register van schattingsuitkomsten.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel179
  - number: '180'
    text: |-
      1 Op de voor de behandeling van de bezwaren vastgestelde terechtzitting geven partijen wier zaken verwezen zijn
      ingevolge het bepaalde in [artikel 177, tweede lid][ref1], de gronden van hun beweringen en de middelen tot staving
      daarvan op bij conclusie, door een procureur ondertekend. Afschrift van de conclusie wordt op de terechtzitting in
      handen gesteld van de procureur van de wederpartij.

      2 Desgewenst kunnen partijen op een uiterlijk veertien dagen hierna te stellen, door de rechtbank te bepalen dag
      hun conclusies bij pleidooi door een advocaat doen toelichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel177
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '177'
        hoofdstuk: VII
  - number: '181'
    text: |-
      1 De rechtbank doet uiterlijk dertig dagen, nadat de in [artikel 180, eerste onderscheidenlijk tweede lid][ref1],
      bedoelde terechtzitting is gehouden, uitspraak.

      2 Tegen de uitspraak staat uitsluitend het rechtsmiddel van cassatie open.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel180
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '180'
        hoofdstuk: VII
  - number: '182'
    text: |-
      1 De cassatie wordt ingesteld binnen dertig dagen te rekenen van de dag, waarop het vonnis is uitgesproken.

      2 Zij geschiedt door een verklaring ter griffie van de rechtbank, die het vonnis heeft gewezen.

      3 Deze verklaring wordt binnen veertien dagen met een ontwikkeling van de gronden der cassatie aan de tegenpartij
      betekend en gaat vergezeld van dagvaarding tegen de eerstvolgende terechtzitting na verloop van de in het volgende
      lid bepaalde termijn.

      4 De tegenpartij is bevoegd te antwoorden binnen veertien dagen na de betekening ingevolge het vorige lid.

      5 In de genoemde terechtzitting nemen de partijen haar conclusies, desverkiezende bij pleidooi, mits in dezelfde
      terechtzitting, nader te ontwikkelen.

      6 Het openbaar ministerie neemt zijn conclusie uiterlijk veertien dagen na de terechtzitting.

      7 Uiterlijk zes weken na de terechtzitting doet de Hoge Raad uitspraak.

      8 De Hoge Raad zendt een afschrift van de uitspraak aan de rechter- commissaris.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel182
  - number: '183'
    text: |-
      1 Zodra omtrent alle bezwaren tegen de lijst van rechthebbenden onherroepelijk is beslist, sluit de rechtbank deze
      lijst, na haar zo nodig overeenkomstig haar uitspraken, onderscheidenlijk de arresten van de Hoge Raad, te hebben
      gewijzigd.

      2 Indien de uitspraak van de Hoge Raad een verwijzing naar een rechtbank behelst, dient de zaak binnen een maand na
      de uitspraak opnieuw aanhanging te worden gemaakt.

      3 Indien de in het vorige lid bedoelde termijn wordt overschreden, wordt het bezwaar geacht te zijn ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel183
  - number: '184'
    text: |-
      Nadat alle rechten betreffende de tot een blok behorende onroerende zaken zijn komen vast te staan, worden zij
      met wie geen overeenstemming omtrent de uitkomsten der schattingen is verkregen, één of meer vertegenwoordigers
      van Onze Minister alsmede van de landinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of
      diens plaatsvervanger door de griffier van de rechtbank bij aangetekende brief opgeroepen om te verschijnen op een
      door de rechtbank vastgestelde terechtzitting.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel184
  - number: '185'
    text: |-
      1 Op de voor de behandeling van de bezwaren vastgestelde terechtzitting, als bedoeld in [artikel 184][ref1],
      lichten zij van wie zaken zijn verwezen hun standpunt, hetzij in persoon, hetzij bij schriftelijk gemachtigde
      mondeling toe.

      2 De rechtbank hoort de bij het bezwaar betrokken haar bekende belanghebbenden, één of meer vertegenwoordigers van
      Onze Minister, één of meer vertegenwoordigers van de landinrichtingscommissie en de aan deze toegevoegde ingenieur
      van het kadaster of diens plaatsvervanger.

      3 Uiterlijk dertig dagen na de in het eerste lid bedoelde terechtzitting doet de rechtbank uitspraak.

      4 De rechtbank wijzigt zonodig het register van schattingsuitkomsten overeenkomstig haar uitspraak na de bij de
      wijziging betrokken belanghebbenden daarover te hebben gehoord.

      5 De rechtbank sluit het register van schattingsuitkomsten nadat zij in alle geschillen daaromtrent heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel184
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '184'
        hoofdstuk: VII
  - number: '186'
    text: |-
      Tegen de uitspraak van de rechtbank staat geen rechtsmiddel open, onverminderd de bevoegdheid van de procureur-
      generaal bij de Hoge Raad om zich in het belang der wet in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel186
  - number: '187'
    text: |-
      1 Voor een geding, voortvloeiende uit een verwijzing door de rechter-commissaris, als bedoeld in
      [artikel 177, tweede lid][ref1], en in [artikel 178, tweede lid][ref2], is alleen door de indiener
      van het bezwaarschrift, met wie geen overeenstemming is verkregen, vast recht, als bedoeld in de
      [Wet tarieven in burgerlijke zaken (Stb. 1960, 541)][ref3], verschuldigd.

      2 De kosten van een geding, als bedoeld in het eerste lid, komen ten laste van de belanghebbende, met wie
      geen overeenstemming is verkregen, indien deze in het ongelijk is gesteld; ten laste van de gezamenlijke
      belanghebbenden, indien hij in het gelijk wordt gesteld. Indien de rechter daartoe termen vindt in de
      omstandigheden van het geding, kan hij de kosten geheel of voor een deel compenseren.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel177
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel178
      [ref3]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '177'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '178'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0001852
  - number: '188'
    text: |-
      Zodra de lijst van rechthebbenden en het register van schattingsuitkomsten zijn gesloten, geeft de rechter-
      commissaris hiervan kennis aan Onze Minister en aan de landinrichtingscommissie. Hij zendt een afschrift van de
      lijst van rechthebbenden aan de landinrichtingscommissie en aan het desbetreffende kantoor van de Dienst voor het
      kadaster en de openbare registers.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel188
  - number: '189'
    text: |-
      1 Indien het belang van de landinrichting zulks vordert, kan de landinrichtingscommissie tot een blok
      behorende gronden tijdelijk in gebruik geven overeenkomstig een daartoe vastgesteld plan van tijdelijk gebruik.
      [Artikel 129][ref1] is van overeenkomstige toepassing.

      2 Met betrekking tot het tijdelijk in gebruik geven van gronden zijn de ter zake van pacht geldende wettelijke
      bepalingen niet van toepassing.

      3 Het plan van tijdelijk gebruik kan mede omvatten gronden die met toepassing van
      [artikel 142, eerste lid, aanhef en onder ][ref2], dan wel [artikel 143, eerste lid, aanhef en onder ][ref3],
      worden toegewezen aan het Rijk, openbare lichamen en rechtspersonen, mits de toewijzing vaststaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel143
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '129'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '142'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '143'
        hoofdstuk: VII
  - number: '190'
    text: |-
      1 De landinrichtingscommissie stelt voor het gehele blok of een gedeelte daarvan een ontwerp van een plan van
      tijdelijk gebruik op.

      2 De landinrichtingscommissie legt het ontwerp gedurende veertien dagen voor een ieder ter kosteloze inzage op een
      of meer door haar te bepalen plaatsen.

      3 Van de terinzagelegging geeft de landinrichtingscommissie tevoren openbare kennis in één of meer in het
      gebied waarop het ontwerp betrekking heeft, verspreide dag- of nieuwsbladen, en in de gemeenten, die geheel of
      gedeeltelijk zijn gelegen in zodanig gebied, op de aldaar gebruikelijke wijze, alsmede bijzondere kennis bij
      aangetekende brief aan de haar bekende belanghebbende gebruiksgerechtigden.

      4 De kennisgevingen houden mededeling in van de aan belanghebbende gebruiksgerechtigden toekomende bevoegdheid
      bezwaren tegen het ontwerp in te dienen.

      5 Op het niet-ontvangen zijn van de bijzondere kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel190
  - number: '191'
    text: |-
      Uiterlijk de veertiende dag na de laatste dag waarop het ontwerp ter inzage heeft gelegen, kan iedere
      belanghebbende gebruiksgerechtigde schriftelijk zijn bezwaren indienen bij de landinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel191
  - number: '192'
    text: |-
      Indien binnen de termijn en op de wijze in [artikel 191][ref1] bepaald geen bezwaren zijn ingediend, staat het plan
      van tijdelijk gebruik vast. Daarvan maakt de landinrichtingscommissie proces-verbaal op.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel191
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '191'
        hoofdstuk: VII
  - number: '193'
    text: |-
      1 Indien binnen de termijn en op de wijze in [artikel 191][ref1] bepaald bezwaren zijn ingediend, onderzoekt de
      landinrichtingscommissie de bezwaren en tracht zij overeenstemming te bereiken.

      2 De landinrichtingscommissie maakt omtrent ieder bezwaarschrift en het daaromtrent verhandelde proces-verbaal op
      en zendt daarvan zo spoedig mogelijk afschrift aan degene, die het bezwaar heeft ingediend.

      3 Indien in alle gevallen overeenstemming is verkregen vinden de bepalingen van [artikel 192][ref2] overeenkomstige
      toepassing.

      4 Indien omtrent één of meer bezwaren geen overeenstemming is verkregen, of de landinrichtingscommissie van oordeel
      is, dat de bezwaren niet tijdig zijn ingediend, legt zij gelijktijdig het ontwerp, de betrokken bezwaarschriften
      alsmede de daaromtrent opgemaakte processen-verbaal, voorzien van haar beschouwingen ter beslissing voor aan de
      rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel191
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel192
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '191'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '192'
        hoofdstuk: VII
  - number: '194'
    text: |-
      1 De [artikelen 175][ref1] en [176][ref2] zijn van overeenkomstige toepassing op de behandeling van de bezwaren
      door de rechter-commissaris.

      2 Na de behandeling van de bezwaren wijzigt de rechter-commissaris zo nodig het plan van tijdelijk gebruik en stelt
      dit vast.

      3 Tegen de uitspraak van de rechter-commissaris staat geen rechtsmiddel open.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel176
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '175'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '176'
        hoofdstuk: VII
  - number: '195'
    text: |-
      1 Bij regeling van Onze Minister worden regels voor het plan van toedeling vastgesteld.

      2 De regels, bedoeld in het eerste lid, bevatten de uitgangspunten voor:

      a. de toedeling van de rechten met betrekking tot de gronden, voor zover deze niet op de voet van de
      [artikelen 133][ref1] en [137][ref2] worden toegewezen;

      b. de in [artikel 160][ref3] bedoelde regeling, opheffing of vestiging van de beperkte rechten, het recht van huur
      en lasten, welke met betrekking tot de onroerende zaken bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel160
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '133'
        hoofdstuk: VI
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '137'
        hoofdstuk: VI
        afdeling: II
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '160'
        hoofdstuk: VII
  - number: '196'
    text: |-
      1 Met betrekking tot ieder blok ontwerpt de landinrichtingscommissie, met inachtneming van de regels, bedoeld in
      [artikel 195, eerste lid][ref1], een plan van toedeling.

      2 Het plan van toedeling bevat:

      a. de kavelindeling;

      b. de toedeling ingevolge [Titel 1][ref2] van rechten met betrekking tot de gronden, die niet ingevolge de
      [artikelen 133][ref3] en [137][ref4] zijn toegewezen;

      c. de ingevolge [Titel 2][ref5] te handhaven, op te heffen en te vestigen pachtverhoudingen, onder vermelding
      van de in [artikel 153, tweede lid][ref6], bedoelde bepalingen inzake de duur en de verlengbaarheid van de
      pachtovereenkomst;

      d. de in [artikel 160][ref7] bedoelde regeling, opheffing of vestiging van de beperkte rechten, het recht van huur
      en lasten, welke met betrekking tot de onroerende zaken bestaan;

      e. de bepalingen inzake de ingebruikneming van de kavels.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel133
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel137
      [ref5]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
      [ref6]: https://wetten.overheid.nl/BWBR0003793#Artikel153
      [ref7]: https://wetten.overheid.nl/BWBR0003793#Artikel160
