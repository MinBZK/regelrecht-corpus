  - number: '133'
    text: |-
      1 Binnen zes maanden na ontvangst van de in [artikel 131, tweede en vierde lid][ref1], bedoelde voorstellen wijzen
      gedeputeerde staten de eigendom van de openbare wegen en van de waterlopen met de daarbij behorende kunstwerken
      toe aan de naar hun oordeel daarvoor in aanmerking komende openbare lichamen of andere rechtspersonen, wijzen
      gedeputeerde staten het beheer en het onderhoud van openbare wegen met de daarbij behorende kunstwerken toe aan de
      naar hun oordeel daarvoor in aanmerking komende openbare lichamen en regelen gedeputeerde staten het beheer en het
      onderhoud van de waterlopen, dijken en kaden met de daarbij behorende kunstwerken.

      2 In afwijking van het bepaalde in het eerste lid, kunnen gedeputeerde staten, indien bijzondere omstandigheden
      daartoe aanleiding geven, het onderhoud van openbare wegen toewijzen aan andere rechtspersonen dan openbare
      lichamen.

      3 Alvorens te besluiten horen gedeputeerde staten de in het eerste lid bedoelde openbare lichamen en
      rechtspersonen, voor zover deze laatsten de eigendom, het beheer of het onderhoud hadden voor de landinrichting.

      4 Tenzij een rechtspersoon, niet zijnde een openbaar lichaam, voor de landinrichting de eigendom, het beheer en het
      onderhoud had, geschiedt de toewijzing en de regeling als bedoeld in dit artikel, niet dan nadat overeenstemming is
      verkregen met de betrokken rechtspersoon.

      5 De toewijzing van de eigendom, het beheer en het onderhoud geschiedt zonder geldelijke verrekening, met dien
      verstande dat dit in de gegeven omstandigheden niet tot onredelijke gevolgen voor het betrokken openbaar lichaam
      mag leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel131
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel133
    references:
      - id: ref1
