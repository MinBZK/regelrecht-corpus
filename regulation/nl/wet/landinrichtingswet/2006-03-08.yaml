      - id: ref5
        bwb_id: BWBR0003793
        artikel: '51'
        hoofdstuk: III
        afdeling: I
      - id: ref6
        bwb_id: BWBR0003793
        artikel: '41'
        hoofdstuk: III
  - number: '46'
    text: |-
      1 Provinciale staten nemen het besluit tot herinrichting gelijktijdig met het besluit tot vaststelling van het
      landinrichtingsprogramma.

      2 Indien provinciale staten het landinrichtingsprogramma met toepassing van [artikel 43, tweede lid][ref1],
      vaststellen, nemen zij in afwijking van het bepaalde in het eerste lid het besluit tot herinrichting eerst nadat
      de in [artikel 43, zesde lid][ref2], bedoelde termijn is verstreken of zo veel eerder als Onze Minister te kennen
      heeft gegeven van een voordracht tot vernietiging af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel43
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '43'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '43'
        hoofdstuk: III
  - number: '47'
    text: |-
      1 Gedeputeerde staten zenden afschrift van het besluit tot herinrichting naar Onze Minister, de
      landinrichtingscommissie en, indien met toepassing van [Hoofdstuk VII][ref1] herverkaveling zal plaatsvinden, naar
      de rechtbank, binnen welker rechtsgebied het in te richten gebied geheel of grotendeels is gelegen.

      2 De rechtbank benoemt na ontvangst van dit bericht één of meer rechters-commissarissen en doet hiervan mededeling
      aan gedeputeerde staten en aan de landinrichtingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003793
        hoofdstuk: VII
  - number: '48'
    text: |-
      1 Met ingang van het tijdstip waarop het ontwerp van het landinrichtingsplan ter inzage is gelegd tot het tijdstip
      waarop het landinrichtingsplan voor de betrokken onroerende zaken is verwezenlijkt, is het, behoudens daartoe door
      de landinrichtingscommissie verleende toestemming, verboden handelingen te verrichten, die de verwezenlijking van
      het plan ernstig belemmeren.

      2 Het eerste lid is van overeenkomstige toepassing indien het landinrichtingsplan in gedeelten wordt voorbereid of
      vastgesteld, dan wel wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel48
  - number: '49'
    text: |-
      1 Indien bij het besluit tot herinrichting is besloten tot herverkaveling van het gebied of van één of meer
      gedeelten daarvan, is het, nadat het besluit tot herinrichting is genomen, eigenaren en gebruiksgerechtigden van
      in een blok gelegen onroerende zaken verboden handelingen te verrichten, of handelingen welke voor een normale
      bedrijfsvoering zijn vereist, achterwege te laten, indien daardoor de waarde van de betrokken onroerende zaken zou
      veranderen, tenzij de landinrichtingscommissie daarmee heeft ingestemd.

      2 Waardevermeerdering, ontstaan nadat het besluit tot herinrichting is genomen, behoeft niet te worden vergoed,
      tenzij deze waardevermeerdering het gevolg is van handelingen, waarmee de landinrichtingscommissie heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel49
  - number: '50'
    text: |-
      Aan een werknemer wordt door Onze Minister uit ’s Rijks kas een geldelijke bijdrage verleend in door hem te bepalen
      gevallen en volgens door hem te stellen regelen, indien het bedrijf waarin de werknemer werkzaam is, ten gevolge
      van de toepassing van [artikel 11][ref1] of van [artikel 146][ref2] wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel146
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '11'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '146'
        hoofdstuk: VII
  - number: '51'
    text: |-
      1 Provinciale staten nemen het besluit, dat een stemming wordt gehouden ter verkrijging van de beslissing of
      ruilverkaveling zal plaatsvinden, gelijktijdig met het besluit tot vaststelling van het landinrichtingsprogramma.

      2 [Artikel 46, tweede lid][ref1], is van overeenkomstige toepassing, met dien verstande dat in plaats van "besluit
      tot herinrichting" wordt gelezen: besluit, dat een stemming wordt gehouden ter verkrijging van de beslissing of
      ruilverkaveling zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel46
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '46'
        hoofdstuk: III
  - number: '52'
    text: |-
      1 De beslissing of ruilverkaveling zal plaatsvinden, wordt genomen door degenen, die met betrekking tot het in te
      richten gebied:

      a. in de kadastrale registratie als eigenaar staan vermeld;

      b. overeenkomstig de [artikelen 54-61][ref1] als pachters van daartoe behorende onroerende zaken zijn
      geregistreerd.

      2 Ter verkrijging van de beslissing of ruilverkaveling zal plaatsvinden wordt zo spoedig mogelijk na het tijdstip,
      waarop het landinrichtingsprogramma is vastgesteld, onder verantwoordelijkheid van gedeputeerde staten een stemming
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel54
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '54'
        hoofdstuk: III
        afdeling: II
  - number: '53'
    text: |-
      1 De landinrichtingscommissie stelt met betrekking tot het in te richten gebied een lijst vast van degenen, die in
      de kadastrale registratie als eigenaar staan vermeld.

      2 Op de voorbereiding van de lijst is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      3 De landinrichtingscommissie zendt de in [artikel 3:12 van de Algemene wet bestuursrecht][ref2] bedoelde
      kennisgeving toe aan degenen die op het ontwerp van de lijst zijn vermeld.

      4 De terinzagelegging geschiedt ter secretarie van de provincies en gemeenten die geheel of gedeeltelijk zijn
      gelegen in het in te richten gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:12
  - number: '54'
    text: |-
      1 De landinrichtingscommissie registreert met betrekking tot het in te richten gebied op hun daartoe strekkend
      verzoek de pachters, die aan de in artikel 62, eerste lid, bedoelde stemming wensen deel te nemen.

      2 Voor registratie komt slechts in aanmerking de pachter:

      a. van onroerende zaken, gelegen binnen de begrenzing van het in te richten gebied, bedoeld in
      [artikel 35, eerste lid, onderdeel a][ref1];

      b. wiens schriftelijke pachtovereenkomst, welke zo nodig de goedkeuring van de grondkamer heeft verkregen:

      1°. geldt voor ten minste de wettelijke duur als bedoeld in [artikel 12, eerste lid, van de Pachtwet][ref2] (*Stb.*
      1958, 37);

      2°. is aangegaan voor een kortere duur als bedoeld in [artikel 12, derde lid, van die wet][ref3], doch nadien voor
      zes jaren is verlengd;

      3°. valt onder de termen van [artikel 58 van de bedoelde wet][ref4] en voor ten minste zes jaren is aangegaan,
      dan wel

      4°. met toepassing van [artikel 70][ref5] is aangegaan voor ten minste zes jaren.

      3 Inzending van de pachtovereenkomst geldt als een verzoek tot registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002269#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002269#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0002269#Artikel58
      [ref5]: https://wetten.overheid.nl/BWBR0002269#Artikel70
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '35'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002269
        artikel: '12'
