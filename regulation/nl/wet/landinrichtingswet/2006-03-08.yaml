  - number: '213'
    text: |-
      1 De lijst der geldelijke regelingen wordt door de landinrichtingscommissie gedurende een maand voor een ieder ter
      kosteloze inzage gelegd op een door haar te bepalen plaats.

      2 [ Artikel 199, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.

      3 De lijst der geldelijke regelingen wordt in haar geheel of in uittreksel tegen betaling der kosten beschikbaar
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel199
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '199'
        hoofdstuk: VII
  - number: '214'
    text: |-
      Uiterlijk de veertiende dag na de laatste dag, waarop de in [artikel 213][ref1] bedoelde lijst der geldelijke
      regelingen ter inzage heeft gelegen, kan iedere belanghebbende schriftelijk zijn bezwaren tegen de lijst der
      geldelijke regelingen bij de landinrichtingscommissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel213
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '213'
        hoofdstuk: VII
  - number: '215'
    text: |-
      Indien binnen de termijn en op de wijze in het [artikel 214][ref1] bepaald geen bezwaren zijn ingediend, staat de
      lijst der geldelijke regelingen vast. Daarvan maakt de landinrichtingscommissie een proces-verbaal op.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel214
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '214'
        hoofdstuk: VII
  - number: '216'
    text: |-
      Op de behandeling van bezwaren zijn de navolgende artikelen van overeenkomstige toepassing:

      a. de [artikelen 172][ref1], [173][ref2] en [174][ref3];

      b. [artikel 175][ref4], met dien verstande dat het derde lid als volgt wordt gelezen: In de oproeping wordt gewezen
      op het rechtsgevolg dat de wet aan het niet-bijwonen van de behandeling verbindt;

      c. de [artikelen 176][ref5], met uitzondering van het zesde lid, eerste volzin, [178][ref6], [179][ref7], eerste
      volzin, [185, eerste-vierde lid][ref8], en [187][ref9].


