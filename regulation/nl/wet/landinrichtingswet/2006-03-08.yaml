  - number: '141'
    text: |-
      1 Bij herinrichting wordt voor ieder blok de in het derde lid bedoelde totale waarde tot een maximum van drie
      procent verminderd met de waarde van de in dat blok gelegen gronden,

      a. die in het belang van het blok benodigd zijn voor het tot stand brengen of verbeteren van openbare wegen en
      waterlopen;

      b. die benodigd zijn voor de aanleg van de met die wegen en waterlopen samenhangende voorzieningen.

      2 Bij herinrichting staat de aan een eigenaar toe te delen waarde in kavels tot de na toepassing van het eerste lid
      verkregen waarde als de waarde van zijn rechten op in het blok gelegen gronden, tot de in het derde lid, bedoelde
      totale waarde.

      3 De totale waarde is de waarde van alle tot het blok behorende gronden, verminderd met de waarde van de voor de
      verwezenlijking van het landinrichtingsplan ter onteigening aangewezen gronden.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel141
  - number: '142'
    text: |-
      1 Bij ruilverkaveling wordt voor ieder blok de totale waarde van alle in het blok opgenomen gronden tot een maximum
      van vijf procent verminderd met de waarde van de in dat blok gelegen gronden, benodigd voor:

      a. de in [artikel 141, eerste lid, onder ][ref1], genoemde aangelegenheden, en, voor zover ten aanzien van de
      betreffende gronden geen toepassing is gegeven aan het bepaalde in [artikel 146, eerste lid][ref2]:

      b. het verwezenlijken van maatregelen en voorzieningen met betrekking tot de natuur en het landschap,

      c. het verwezenlijken van maatregelen en voorzieningen met betrekking tot andere doeleinden van openbaar nut.

      2 Bij ruilverkaveling staat de aan een eigenaar toe te delen waarde in kavels tot de na toepassing van het eerste
      lid verkregen waarde als de waarde van zijn rechten op de in het blok gelegen gronden tot de totale waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel146
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel142
