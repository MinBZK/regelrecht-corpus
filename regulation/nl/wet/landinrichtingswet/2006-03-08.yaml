  - number: '144'
    text: |-
      1 Van het bepaalde in de [artikelen 141, tweede lid][ref1], [142, tweede lid][ref2], en [143, tweede lid][ref3],
      mag worden afgeweken, indien deze bepalingen de totstandkoming van een behoorlijke herverkaveling in de weg zouden
      staan. Deze afwijking mag, tegen de wil van de eigenaar en van degene, die op de onroerende zaak een recht van
      hypotheek of van grondrente heeft, niet meer bedragen dan vijf procent van de waarde, waarop de eigenaar ingevolge
      de [artikelen 141, tweede lid][ref4], [142, tweede lid][ref5], en [143, tweede lid][ref6], aanspraak heeft.

      2 Indien tengevolge van de in [artikel 128][ref7] genoemde werkzaamheden waardeverandering ontstaat, kan de
      landinrichtingscommissie hiermede bij de toedeling rekening houden. Op verzoek van de eigenaar vindt echter
      verrekening in geld plaats op grondslag van die waardeverandering, voor zover het belang van de herverkaveling zich
      hiertegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel141
