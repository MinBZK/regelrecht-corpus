  - number: '94'
    text: |-
      Het bevoegd bestuursorgaan kan tot Onze Minister een met redenen omkleed verzoek richten aanpassingsinrichting te
      bevorderen met betrekking tot een gebied waarin een infrastructurele voorziening van nationaal of regionaal belang
      zal worden verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel94
  - number: '96'
    text: Onze Minister onderzoekt of, en zo ja, in hoeverre aanpassingsinrichting wenselijk is.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel96
  - number: '97'
    text: |-
      1 Onze Minister brengt haar zienswijze schriftelijk en met redenen omkleed ter kennis van het bevoegd
      bestuursorgaan en van gedeputeerde staten.

      2 Indien Onze Minister op grond van het in [artikel 96][ref1] bedoelde onderzoek van mening is dat
      aanpassingsinrichting wenselijk is, doet hij zijn zienswijze vergezeld gaan van een met redenen omkleed voorstel
      tot aanpassingsinrichting met betrekking tot dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel96
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '96'
        hoofdstuk: IV
  - number: '98'
    text: |-
      Het voorstel tot aanpassingsinrichting bevat:

      a. een beschrijving van de te treffen infrastructurele voorziening en de daaruit voortvloeiende nadelige gevolgen
      voor de inrichting van het gebied;

      b. de zo nauwkeurig mogelijk bepaalde grenzen van het in te richten gebied alsmede van het tot dat gebied behorende
      blok;

      c. aanduidingen inzake de ter opvanging van de nadelige gevolgen voor de inrichting van het gebied te treffen
      maatregelen en voorzieningen;

      d. aanduidingen inzake de grondverwerving;

      e. een raming van de kosten en de voorgestane verdeling daarvan;

      f. één of meer kaarten waarop de onder *b* bedoelde grenzen zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel98
  - number: '99'
    text: |-
      1 Gedeputeerde staten stellen, in overeenstemming met het bevoegd bestuursorgaan, met betrekking tot het in te
      richten gebied een landinrichtingscommissie in.

      2 [Artikel 27, tweede lid][ref1], alsmede het bij of krachtens de [artikelen 28-31][ref2] bepaalde is van
      overeenkomstige toepassing, met dien verstande dat:

      a. ten minste één van de leden van de landinrichtingscommissie wordt benoemd op voorstel van het bevoegd
      bestuursorgaan;

      b. het bevoegd bestuursorgaan één of meer adviserende leden van de landinrichtingscommissie kan benoemen;

      c. schorsing en ontslag van een onder *a* bedoeld lid en een onder *b* bedoeld adviserend lid plaatsvindt door het
      bevoegd bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel28
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '27'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '28'
        hoofdstuk: III
  - number: '100'
    text: |-
      Onze Minister stelt in overeenstemming met het bevoegd bestuursorgaan regelen betreffende de werkwijze van de
      landinrichtingscommissie vast.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel100
  - number: '101'
    text: |-
      Voor een gebied met betrekking waartoe een landinrichtingscommissie is ingesteld, wordt op de grondslag van het
      voorstel tot aanpassingsinrichting een aanpassingsplan vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel101
  - number: '102'
    text: |-
      1 Het aanpassingsplan bevat:

      a. de grenzen van het in te richten gebied, alsmede de grenzen van het blok;

      b. de omschrijving van de in het blok te treffen maatregelen en voorzieningen ten behoeve van de infrastructuur,
      de land-, tuin-, en bosbouw, de natuur, het landschap en de openluchtrecreatie, met vermelding van de daarvoor
      benodigde gronden;

      c. de voornemens inzake de regeling van de eigendom, het beheer en het onderhoud van de openbare wegen en
      waterlopen, met daarbij behorende kunstwerken, alsmede van het beheer en het onderhoud van dijken en kaden;

      d. de voornemens, alsmede de overwegingen waarop deze zijn gegrond, inzake de toewijzing, met de daarbij in acht
      te nemen voorwaarden, van de eigendom van gebieden van belang uit een oogpunt van natuur- en landschapsbehoud, van
      landschappelijke elementen en van elementen ten behoeve van de openluchtrecreatie die overeenkomstig het tweede
      lid, onder *b*, op de kaarten zijn aangegeven;

      e. de raming van de kosten en de verdeling daarvan;

      f. één of meer kaarten, waarop zo nauwkeurig mogelijk zijn aangegeven:

      1. de onder *a* bedoelde grenzen;

      2. de in het blok te handhaven openbare wegen, waterlopen, dijken en kaden;

      3. de in het blok te handhaven gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en
      landschappelijke elementen;

      4. de onder *b* bedoelde maatregelen en voorzieningen.

      2 Onverminderd het bepaalde in het eerste lid, onder *f*, worden op de kaarten afzonderlijk en zo nauwkeurig
      mogelijk aangegeven:

      a. maatregelen en voorzieningen voor de verwezenlijking waarvan [artikel 143, eerste lid, aanhef en onder ][ref1],
      kan worden toegepast;

      b. maatregelen en voorzieningen voor de verwezenlijking waarvan [artikel 143, eerste lid, aanhef en onder ][ref2],
      kan worden toegepast.

      3 [Artikel 35][ref3], tweede lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel35
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '143'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '143'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '35'
        hoofdstuk: III
  - number: '103'
    text: |-
      1 Op de voorbereiding van een ontwerp-aanpassingsplan als bedoeld in [artikel 106, eerste lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing, met dien verstande dat
      daaraan toepassing wordt gegeven door de landinrichtingscommissie. Onder het in het tweede lid bedoelde voorontwerp
      van het aanpassingsplan wordt het ingevolge [artikel 3:11, eerste lid][ref3], van de Algemene wet bestuursrecht
      door de landinrichtingscommissie ter inzage te leggen ontwerp verstaan.

      2 De landinrichtingscommissie stelt een voorontwerp van het aanpassingsplan op na overleg met het bevoegd
      bestuursorgaan.

      3 Het voorontwerp kan met betrekking tot eenzelfde aangelegenheid meer dan één mogelijkheid van te treffen
      maatregelen of voorzieningen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel311
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '106'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 3:11
  - number: '106'
    text: |-
      1 De landinrichtingscommissie stelt het aanpassingsplan in ontwerp vast na overleg met het bevoegd bestuursorgaan
      en zendt dit aan gedeputeerde staten en het bevoegd bestuursorgaan.

      2 Gedeputeerde staten brengen het ontwerp onverwijld ter kennis van de colleges van gedeputeerde staten van de
      andere provincies, op welker grondgebied dit mede betrekking heeft.

      3 Indien het ontwerp afwijkt van het voorontwerp, doet de landinrichtingscommissie hiervan mededeling aan het
      bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel106
  - number: '107'
    text: |-
      1 Gedeputeerde staten stellen het aanpassingsplan vast na toetsing van het ontwerp aan de hoofdlijnen van het
      provinciaal ruimtelijk beleid, zoals deze hun grondslag vinden in of redelijkerwijs voortvloeien uit een streekplan
      of een ander besluit van provinciale staten, de provinciale planologische commissie gehoord.

      2 Op de voorbereiding van het aanpassingsplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. De terinzagelegging geschiedt tevens ter secretarie van de gemeenten en de waterschappen die geheel
      of gedeeltelijk zijn gelegen in het in te richten gebied. Zienswijzen kunnen naar voren worden gebracht door een
      ieder.

      3 Het aanpassingsplan wordt vastgesteld binnen zes maanden nadat de termijn voor het naar voren brengen van
      zienswijzen is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '108'
    text: |-
      De vaststelling van de hoogte van de door het Rijk te dragen kosten zoals deze in het aanpassingsplan worden
      opgenomen, geschiedt in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel108
  - number: '109'
    text: |-
      1 Indien gedeputeerde staten voornemens zijn af te wijken van het ontwerp winnen zij advies in van de
      landinrichtingscommissie en het bevoegd bestuursorgaan, alvorens zij het aanpassingsplan vaststellen.

      2 Vaststelling van het aanpassingsplan door gedeputeerde staten in afwijking van een in het eerste lid bedoeld
      advies geschiedt niet dan nadat Onze Minister en het bevoegd bestuursorgaan gezamenlijk daarin hebben toegestemd.

      3 De toestemming, bedoeld in het tweede lid, kan worden onthouden wegens strijd met het recht of het algemeen
      belang.

      4 In geval van toepassing van het eerste lid zijn gedeputeerde staten bevoegd de in [artikel 107, derde lid][ref1]
      genoemde termijn met drie maanden te verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel107
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '107'
        hoofdstuk: IV
  - number: '110'
    text: |-
      Tegen de in[ artikel 102, eerste lid, onder d][ref1], bedoelde voornemens inzake toewijzing van de eigendom,
      voor zover zulks geschiedt met toepassing van [artikel 143, eerste lid, aanhef en onderdeel b][ref2], kunnen
      uitsluitend rechthebbenden en pachters die zich tijdig tot gedeputeerde staten hebben gewend met bedenkingen tegen
      deze voornemens of die bedenkingen hebben tegen deze voornemens voor zover deze afwijken van die in het ter inzage
      gelegde ontwerp van het aanpassingsplan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel143
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '102'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '143'
        hoofdstuk: VII
  - number: '111'
    text: |-
      1 Gedeputeerde staten nemen het besluit tot aanpassingsinrichting gelijktijdig met het besluit tot vaststelling van
      het aanpassingsplan dan wel binnen drie maanden na zodanig besluit.

      2 Indien het besluit van gedeputeerde staten tot vaststelling van het aanpassingsplan ingevolge
      [artikel 109, tweede lid][ref1], de toestemming behoeft van Onze Minister en het bevoegd bestuursorgaan
      gezamenlijk, nemen gedeputeerde staten, in afwijking van het bepaalde in het eerste lid, het besluit tot
      aanpassingsinrichting eerst nadat die toestemming is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel109
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '109'
        hoofdstuk: IV
  - number: '112'
    text: |-
      1 Bij overschrijding van de in de [artikelen 107, derde lid][ref1], [109][ref2] en [111, eerste lid][ref3],
      genoemde termijnen is Onze Minister bevoegd in bij algemene maatregel van bestuur te bepalen gevallen op verzoek
      van het bevoegd bestuursorgaan de in die artikelen bedoelde besluiten te nemen.

      2 Onze Minister doet van een besluit als bedoeld in het eerste lid mededeling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel111
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '107'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '109'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '111'
        hoofdstuk: IV
  - number: '113'
    text: |-
      1 Gedeputeerde staten zenden afschrift van het besluit tot aanpassingsinrichting naar Onze Minister, het bevoegd
      bestuursorgaan, de landinrichtingscommissie en de rechtbank, binnen welker rechtsgebied het in te richten gebied
      geheel of grotendeels is gelegen.

      2 De rechtbank benoemt na ontvangst van dit bericht één of meer rechters-commissarissen en doet hiervan mededeling
      aan gedeputeerde staten en aan de landinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel113
  - number: '114'
    text: |-
      1 Een aanpassingsplan kan worden gewijzigd tot het tijdstip waarop het besluit tot vaststelling van het
      begrenzingenplan, of een gedeelte daarvan, wordt genomen.

      2 Gedeputeerde staten kunnen tot het tijdstip als bedoeld in het eerste lid de landinrichtingscommissie een
      aanwijzing geven met betrekking tot een op te stellen wijziging van het aanpassingsplan, indien zich zodanige
      omstandigheden voordoen, dat één of meer wezenlijke onderdelen van het aanpassingsplan niet of ontoereikend kunnen
      worden verwezenlijkt.

      3 De landinrichtingscommissie kan aan gedeputeerde staten haar zienswijze kenbaar maken omtrent het bestaan van
      omstandigheden als bedoeld in het tweede lid.

      4 De [artikelen 103-110][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel103
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '103'
        hoofdstuk: IV
  - number: '115'
    text: |-
      1 Bij het aanpassingsplan kan worden bepaald dat, indien het belang van de herverkaveling zulks vordert,
      gedeputeerde staten bevoegd zijn op voorstel van de landinrichtingscommissie, met instemming van Onze Minister en
      het bevoegd bestuursorgaan en met inachtneming van in het plan vervatte regelen het aanpassingsplan uit te werken
      en de daarin omschreven maatregelen en voorzieningen uit te breiden.

      2 De in het eerste lid bedoelde uitwerking, onderscheidenlijk uitbreiding, maakt deel uit van het aanpassingsplan.

      3 Op de voorbereiding van de in het eerste lid bedoelde uitwerking, onderscheidenlijk uitbreiding is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '116'
    text: |-
      1 Met ingang van het tijdstip waarop het ontwerp van het aanpassingsplan ter inzage is gelegd tot het tijdstip
      waarop het aanpassingsplan voor de betrokken onroerende zaken is verwezenlijkt, is het, behoudens daartoe door de
      landinrichtingscommissie verleende toestemming, verboden handelingen te verrichten, die de verwezenlijking van het
      plan ernstig belemmeren.

      2 Het eerste lid is van overeenkomstige toepassing indien het aanpassingsplan wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel116
  - number: '117'
    text: |-
      1 Nadat het besluit tot aanpassingsinrichting is genomen is het eigenaren en gebruiksgerechtigden van in het blok
      gelegen onroerende zaken verboden handelingen te verrichten, of handelingen welke door een normale bedrijfsvoering
      zijn vereist, achterwege te laten, indien daardoor de waarde van de betrokken onroerende zaken zou veranderen,
      tenzij hun daartoe door de landinrichtingscommissie toestemming is verleend.

      2 Waardevermeerdering, ontstaan nadat het besluit tot aanpassingsinrichting is genomen, behoeft niet te worden
      vergoed, tenzij deze waardevermeerdering het gevolg is van handelingen, waarvoor de landinrichtingscommissie
      toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel117
  - number: '118'
    text: |-
      Aan een werknemer wordt door Onze Minister uit ’s Rijkskas een geldelijke bijdrage verleend in door hem te bepalen
      gevallen en volgens door hem te stellen regelen, indien het bedrijf waarin de werknemer werkzaam is, ten gevolge
      van de toepassing van [artikel 11][ref1] of van [artikel 146][ref2] wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel146
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '11'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '146'
        hoofdstuk: VII
  - number: '119'
    text: |-
      1 Een ruilverkavelingsovereenkomst wordt schriftelijk aangegaan en in de openbare registers ingeschreven.

      2 Door de inschrijving in de openbare registers wordt de ruilverkavelingsovereenkomst mede verbindend voor degenen,
      die na de inschrijving onder bijzondere titel in de rechten van de eigenaren opvolgen.

      3 Indien een ruilverkavelingsovereenkomst onroerende zaken omvat, waarop hypotheken, conservatoire of executoriale
      beslagen rusten, is de overeenkomst slechts rechtsgeldig, indien zij door de hypotheekhouders en beslagleggers is
      mede-ondertekend.

      4 De in[ artikel 17][ref1] bedoelde notariële akte wordt namens partijen ondertekend door hen, die daartoe bij de
      overeenkomst bevoegd zijn verklaard en wordt ingeschreven in de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel17
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '17'
        hoofdstuk: II
  - number: '120'
    text: |-
      Blijkt na het tot stand komen van de ruilverkavelingsovereenkomst, dat daaraan hebben deelgenomen partijen, die
      geen eigenaar waren, doch in de kadastrale registratie als zodanig vermeld stonden, dan wordt de overeenkomst
      niettemin geacht rechtsgeldig te zijn tot stand gekomen en treedt de werkelijke eigenaar in de rechten en
      verplichtingen, die de in zijn plaats opgetreden partij onbevoegdelijk verworven en op zich genomen heeft.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel120
  - number: '121'
    text: |-
      Men kan mede tot een ruilverkavelingsovereenkomst toetreden, ten einde tegen inbreng van geld kavels of tegen
      inbreng van onroerende zaken een geldsom te bedingen.
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel121
  - number: '122'
    text: |-
      1 Een beding in de overeenkomst, waarbij bepalingen van [Hoofdstuk VI][ref1], [VII][ref2] en [VIII][ref3]
      toepasselijk worden verklaard, treedt slechts in werking, indien en voor zover Onze Minister daarmee heeft
      ingestemd. Aan de instemming kunnen voorwaarden worden verbonden.

      2 De bepalingen van [Hoofdstuk VII, Titel 2][ref4] kunnen in de overeenkomst niet van overeenkomstige toepassing
      worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
      [ref3]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVIII
      [ref4]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003793
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003793
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003793
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0003793
        hoofdstuk: VII
  - number: '123'
    text: |-
      Het in [artikel 122][ref1] bedoelde, goedgekeurde beding, waarmee Onze Minister heeft ingestemd, heeft
      overeenkomstige rechtsgevolgen als de daarin van toepassing verklaarde wetsbepalingen. De in die wetsbepalingen
      aangewezen autoriteiten, colleges en ambtenaren verlenen op overeenkomstige wijze hun medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel122
    url: https://wetten.overheid.nl/BWBR0003793/2006-03-08#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '122'
        hoofdstuk: V
  - number: '124'
    text: |-
      1 Zodra een landinrichtingsplan of een gedeelte daarvan dan wel een aanpassingsplan is vastgesteld, kan de
      uitvoering hiervan ter hand worden genomen.

      2 Indien een landinrichtingsplan of een gedeelte daarvan is vastgesteld met toepassing van
      [artikel 82, tweede lid][ref1], kunnen Wij bepalen, dat in afwijking van het bepaalde in het eerste lid, de
      uitvoering van het in [artikel 82, derde lid][ref2], bedoelde gedeelte eerst ter hand wordt genomen, nadat de in
      [artikel 82, zesde lid][ref3], bedoelde termijn is verstreken.

      3 Onverminderd het bepaalde in de [artikelen 125-127][ref4] is de landinrichtingscommissie belast met de uitvoering
      van het landinrichtingsplan of het aanpassingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0003793#Artikel125
