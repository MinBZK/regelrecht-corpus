  - number: '10'
    text: |-
      1 De SG stelt een mandaatbesluit vast voor de rechtstreeks onder hem ressorterende dienstonderdelen.

      2 De DG’s stellen, in overeenstemming met de SG, een mandaatbesluit voor hun directoraat-generaal vast.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel10
  - number: '11'
    text: |-
      1 De SG en DG’s zijn hoofdbudgethouder voor wat betreft hun taken en zijn uit dien hoofde bevoegd verplichtingen –
      met financiële consequenties – aan te gaan en uitgaven goed te keuren binnen hun budgetten.

      2 In afwijking van het eerste lid, gaat de directeur-generaal Belastingdienst verplichtingen ten aanzien
      waarvan het verscherpt toezicht geldt, als bedoeld in [bijlage 3][ref1], slechts aan in overeenstemming met de
      hoofddirecteur Control en Financiën van directoraat-generaal Belastingdienst danwel de hoofddirecteur Financieel-
      Economische Zaken.

      3 De SG stelt, na advies van de hoofddirecteur FEZ, de hoogte vast van de budgetten bedoeld in het eerste lid.

      4 De hoofdbudgethouders zijn verantwoordelijk voor een adequaat financieel beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037135
  - number: '12'
    text: |-
      1 De SG en de DG’s kunnen voor de in [artikel 11][ref1] genoemde bevoegdheden ondermandaat verlenen aan
      budgethouders.

      2 In een ondermandaat wordt de omvang ervan aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Artikel11
