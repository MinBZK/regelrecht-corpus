  - number: 20c
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de algemene leiding van het DGBD, ten aanzien van
      onder hen ressorterende medewerkers voorbehouden, het besluiten:

      1. tot het vaststellen van de organisatie tot afdelingsniveau, en hiermee samenhangend het besluiten tot
      reorganisaties;

      2. tot het vaststellen van de formatie, waarbij tot wijzigingen in formatie van functies met salarisschaal 16 en
      hoger na overleg met de bestuursraad besloten wordt;

      3. tot het – met inachtneming van [artikel 20][ref1] – aanstellen, benoemen, plaatsen en ontslaan van ambtenaren
      in overige leidinggevende functies tot het niveau van afdelingshoofden of daarmee gelijk te stellen leidinggevende
      functies;

      4. tot het – met inachtneming van [artikel 20][ref2] – aanstellen, benoemen, plaatsen en ontslaan van ambtenaren in
      functies met een bezoldiging van salarisschaal 16 of hoger is verbonden. Benoemingen vinden plaats na overleg met
      de bestuursraad, en over de arbeidsvoorwaarden dient vooraf overleg met de pSG plaats te vinden;

      5. tot een bijzondere aanstelling in tijdelijke dienst ([artikel 6a ARAR][ref3]);

      6. tot een (tijdelijke) plaatsing in het buitenland;

      7. tot het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in de leden drie
      tot en met vijf van dit artikel;

      8. tot bezoldiging conform [artikel 8 van het BBRA 1984][ref4];

      9. tot – met inachtneming van [artikel 20][ref5] – bezoldiging conform de [artikelen 22a][ref6] en
      [7, tweede lid, van het BBRA 1984][ref7] van ambtenaren in:

      a. overige leidinggevende functies tot het niveau van afdelingshoofden of daarmee gelijk te stellen leidinggevende
      functies, of

      b. overige functies met een bezoldiging van salarisschaal 16 of hoger, na overleg met de pSG.

      10. het besluiten op verzoeken tot uitbreiding van een arbeidsduur van meer dan 36 uur per week;

      11. het binnen de rijksbrede en/of ministeriebrede kaders vaststellen van regels en beleid(skaders) inzake de
      bedrijfsvoering voor zover specifiek van toepassing bij het DGBD;

      12. tot disciplinaire maatregelen ([hoofdstuk 8 ARAR][ref8]) aan:

      a. leidinggevende functionarissen;

      b. (strategische) functionarissen met een bezoldiging van salarisschaal 15 of hoger.

      13. tot het verlenen van ontslag op grond van [artikel 99 van het ARAR][ref9];

      14. tot aanbestedingsprocedures, indien een andere dan de procedures als bedoeld in de [hoofdstukken 1.2][ref10] en
      [2.1 van de Aanbestedingswet 2012][ref11] wordt gevolgd;

      15. met betrekking tot (de aansprakelijkheidsstelling als gevolg van) dienstongevallen, beroepsziekten en
      beroepsincidenten, waarbij de pSG door de algemene leiding wordt geïnformeerd.


