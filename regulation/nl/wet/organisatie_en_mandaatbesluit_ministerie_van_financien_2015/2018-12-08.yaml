  - number: 4a
    text: |-
      1 De pSG is chief information officer (de CIO) voor het ministerie.

      2 De CIO heeft de volgende hoofdtaken:

      a. het inrichten van een CIO-stelsel voor het ministerie;

      b. de ambtelijke en politieke leiding gevraagd en ongevraagd adviseren over de doelstelling, uitvoering, kosten en
      risico’s van grote ICT-projecten;

      c. oordelen over de start van ICT-projecten en op kritieke momenten tijdens de uitvoering daarvan;

      d. opstellen en actueel houden van de departementale strategie en visie op geautomatiseerde informatievoorziening
      en ICT en deze ontwikkelen en onderhouden, vanuit de rijksbreed afgesproken kaders, de departementale architectuur
      en standaarden;

      e. bewaken van de samenhang in informatievoorziening en ICT-projecten binnen het ministerie door applicatie- en
      projectenportfoliomanagement;

      f. toezicht houden op de naleving van de rijksbrede kaders binnen het ministerie en het stellen van eisen aan
      projectbeheersingsmethodieken op basis van de rijksbrede kaders, en ondersteunen van audits, reviews en second
      opinions.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel4a
  - number: '5'
    text: |-
      1 Er is een bestuursraad. De bestuursraad overlegt regelmatig over de hoofdlijnen van beleidsontwikkeling en
      -uitvoering, over de hoofdlijnen van de departementale bedrijfsvoering en over al het andere dat nodig is voor een
      goed functioneren van het ministerie.

      2 De leden van de bestuursraad zijn:

      a) de SG;

      b) de directeur-generaal Belastingdienst;

      c) de directeur-generaal voor Fiscale Zaken;

      d) de directeur-generaal van de Rijksbegroting;

      e) de thesaurier-generaal;

      f) de pSG;

      g) de hoofddirecteur Financieel-Economische Zaken.

      De directie Bestuurlijke en Juridische Zaken verzorgt het secretariaat van de bestuursraad.

      3 Er is een bedrijfsvoeringsberaad. De volgende functionarissen voeren in het bedrijfsvoeringsberaad regelmatig
      collegiaal overleg over beleidsvoorstellen met betrekking tot de departementale bedrijfsvoering:

      a) de plaatsvervangend directeur-generaal Belastingdienst;

      b) de plaatsvervangend directeur-generaal voor Fiscale Zaken;

      c) de plaatsvervangend directeur-generaal van de Rijksbegroting;

      d) een directeur van de Generale Thesaurie;

      e) de hoofddirecteur Financieel-Economische Zaken;

      f) de directeur Bedrijfsvoering;

      g) een directeur van het SG-cluster

      4 De pSG is voorzitter van het bedrijfsvoeringsberaad.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel5
  - number: '6'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treedt de algemene leiding in
      contact met de bewindspersoon die het aangaat, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel6
  - number: '7'
    text: |-
      De topstructuur van het ministerie bestaat uit de hieronder genoemde organisatieonderdelen, alsmede de rechtstreeks
      daaronder ressorterende directies en diensten:

      a. Het cluster secretaris-generaal (SG-cluster);

      b. Het directoraat-generaal Belastingdienst (het DGBD);

      c. Het directoraat-generaal voor Fiscale Zaken (het DGFZ);

      d. Het directoraat-generaal van de Rijksbegroting (het DGRB);

      e. De Generale Thesaurie (de GT).
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel7
  - number: '8'
    text: |-
      1 De organisatie en taken van de topstructuur van het ministerie, alsmede de organisatie en taken van
      organisatieonderdelen ressorterend onder de topstructuur, worden vastgesteld zoals weergegeven in de bij dit
      besluit behorende [bijlage 1 (a tot met e)][ref1].

      2 Van het eerste lid is uitgezonderd de organisatie en taken van organisatieonderdelen ressorterend onder de
      topstructuur bij het DGBD, waarvoor de directeur-generaal Belastingdienst, in overeenstemming met de SG, een
      organisatiebesluit vaststelt.

      3 De algemene leiding van een directoraat-generaal wordt gevormd:

      a. voor het SG-cluster: door de SG en pSG;

      b. voor het DGBD, het DGFZ en het DGRB: door de directeur-generaal en de plaatsvervangend directeur-generaal;

      c. voor de GT: door de thesaurier-generaal en de plaatsvervangend thesaurier-generaal;

      4 Een van de directeuren van het directoraat-generaal (met uitzondering van het DGBD) is tevens de plaatsvervangend
      directeur-generaal. In de bij de mandaatbesluiten, als bedoeld in [artikel 10, tweede lid][ref2], van dit besluit,
      behorende [bijlagen 2][ref3] is opgenomen welke directeur tevens plaatsvervangend directeur-generaal is.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0037135#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel8
