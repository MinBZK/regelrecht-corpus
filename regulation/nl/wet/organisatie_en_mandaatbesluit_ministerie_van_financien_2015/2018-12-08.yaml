        artikel: '11'
        hoofdstuk: '4'
  - number: '13'
    text: |-
      1 De SG en DG’s hebben binnen het kader van de jaarplannen en binnen eventueel door de minister of namens de
      minister door de SG gegeven richtlijnen mandaat ten aanzien van het nemen van besluiten en afdoen van stukken
      betreffende alle aangelegenheden die behoren tot hun werkterrein tenzij bij wet anders is bepaald of de aard van de
      bevoegdheid zich daartegen verzet.

      2 De ondertekening van uitgaande stukken zal luiden als volgt:

      De Minister van Financiën, resp. De Staatssecretaris van Financiën,

      namens deze,

      gevolgd door de aanduiding van de (onder)gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel13
  - number: '14'
    text: |-
      1 De SG en de DG’s kunnen ieder voor hun werkterrein ondermandaat verlenen.

      2 Directeuren kunnen het aan hen verleende ondermandaat doormandateren. Voor ondermandaat door een directeur is de
      goedkeuring door de SG of de DG vereist.

      3 In een ondermandaat wordt de omvang ervan aangegeven.

      4 De directeur Bestuurlijke en Juridische Zaken draagt zorg voor openbare terinzagelegging op het ministerie en
      bekendmaking op de internetsite van het ministerie van de krachtens deze regeling verleende ondermandaten.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel14
  - number: '15'
    text: |-
      Onderdeel van deze regeling vormt een mandaatregister dat is opgenomen in [bijlage 2][ref1]. Het mandaatregister
      bevat handtekeningen en parafen van de in dit besluit gemandateerde functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0037135
  - number: '16'
    text: |-
      Bij het nemen van besluiten, afdoen van stukken en ondertekenen van uitgaande brieven met betrekking tot alle
      personeelsaangelegenheden, bedoeld in [bijlage 4][ref1] bij deze regeling, betreffende het kernministerie is advies
      van het hoofd Eenheid Organisatie en Personeel van de directie Bedrijfsvoering vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0037135
  - number: '17'
    text: |-
      Voor zover voorgenomen besluiten met financiële consequenties niet passen binnen de door de SG vastgestelde
      budgetten, is instemming van de hoofddirecteur Financieel-Economische Zaken vereist.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel17
  - number: '18'
    text: |-
      Voor de toepassing van deze regeling en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a. volmacht,

      en

      b. machtiging om in naam van een bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel18
  - number: '19'
    text: |-
      Aan de bewindspersonen is voorbehouden het afdoen en ondertekenen van stukken:

      a. gericht aan de Koning;

      b. gericht aan de Raad van State;

      c. gericht aan de ministerraad (van het Koninkrijk);

      d. gericht aan de Eerste of Tweede Kamer der Staten-Generaal;

      e. gericht aan de president van de Algemene Rekenkamer;

      f. gericht aan autoriteiten in binnen- en buitenland, gelijk of hoger in rang dan een minister of staatssecretaris;

      g. zijnde Ministeriële regelingen houdende algemeen verbindende voorschriften.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel19
  - number: '20'
    text: |-
      Aan de SG is voorbehouden:

      1. Het doen van voorstellen omtrent de vaststelling van de topstructuur van het ministerie, tot en met het niveau
      van directies, en hiermee samenhangend het besluiten tot reorganisaties;

      2. het vaststellen van de formatie, en hiermee samenhangend het besluiten tot reorganisaties:

      a. van het kernministerie,

      b. van de topstructuur van het DGBD, als opgenomen in [bijlage 1b][ref1];

      als bedoeld in [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering 2011][ref2], en
      na gehoord hebbende de bestuursraad;

      3. het aanstellen, benoemen, plaatsen en ontslaan van ambtenaren in functies behorende tot de topstructuur van het
      ministerie en de directoraten-generaal. Benoemingen vinden plaats na overleg met de bestuursraad;

      4. het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in het vorige lid;

      5. het besluiten tot bezoldiging conform de [artikelen 22a][ref3] en [7, tweede lid, van het BBRA 1984][ref4] van
      functionarissen behorende tot de topstructuur van het ministerie en de directoraten-generaal;

      6. het voeren van overleg met bonden over regelingen van rechtspositionele aard als bedoeld in
      [artikel 113 van het ARAR][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037135
