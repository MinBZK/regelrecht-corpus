  - number: 3a
    text: |-
      1 De plaatsvervangend secretaris-generaal (de pSG) is verantwoordelijk voor:

      a. de integrale ontwikkeling en realisering van de strategische doelstellingen op bedrijfsvoeringgebied voor het
      gehele ministerie, en

      b. de afstemming van de bedrijfsvoering op het primaire proces van het ministerie.

      2 De pSG is door middel van kaderstelling verantwoordelijk voor de bedrijfsvoering van het ministerie.

      3 De pSG is verantwoordelijk voor de beleidsterreinen van de onder hem ressorterende directies en diensten, genoemd
      in [bijlage 1a][ref1], voor de samenhang tussen die beleidsterreinen en voor de bijbehorende bedrijfsvoering.

      4 De pSG heeft de verantwoordelijkheid voor de bedrijfsvoering van de diensten en ZBO’s, genoemd in
      [bijlage 1a][ref2].

      5 Bij afwezigheid van de SG treedt de pSG op als plaatsvervanger ten aanzien van:

      a. De eigenaarsrol van de SG;

      b. Het overleg met de medezeggenschap en met de vakbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel3a
