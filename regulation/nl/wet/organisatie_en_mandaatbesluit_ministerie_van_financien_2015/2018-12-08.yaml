  - number: 20b
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de algemene leiding van een DG, uitgezonderd het
      DGBD, ten aanzien van onder hen ressorterende medewerkers voorbehouden, het besluiten:

      1. tot een bijzondere aanstelling in tijdelijke dienst ([artikel 6a ARAR][ref1]);

      2. tot een (tijdelijke) plaatsing in het buitenland;

      3. het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in de vorige twee
      leden;

      4. tot bezoldiging conform de [artikelen 22a][ref2] en [7, tweede lid, van het BBRA 1984][ref3] van:

      a. afdelingshoofden of daarmee gelijk te stellen functionarissen;

      b. directeuren (m.u.v. Algemeen directeur), sectormanagers en manager Bestuursondersteuning en Vaktechniek bij
      de ADR;

      5. tot disciplinaire maatregelen ([hoofdstuk 8 ARAR][ref4]);

      6. tot schadeloosstelling ([artikel 69 ARAR][ref5]);

      7. tot het verlenen van ontslag op grond van [artikel 99 van het ARAR][ref6];

      8. tot aanbestedingsprocedures, indien een andere dan de procedures als bedoeld in de [hoofdstukken 1.2][ref7] en
      [2.1 van de Aanbestedingswet 2012][ref8] wordt gevolgd;

      9. met betrekking tot (de aansprakelijkheidsstelling als gevolg van) dienstongevallen, beroepsziekten en
      beroepsincidenten, waarbij de pSG door de algemene leiding wordt geïnformeerd.


