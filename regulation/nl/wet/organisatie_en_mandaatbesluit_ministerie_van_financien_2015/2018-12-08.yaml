  - number: 20a
    text: |-
      Met inachtneming van [artikel 20][ref1] is aan de pSG voorbehouden:

      1. het, na overleg met de bestuursraad, doen van voorstellen omtrent de vaststelling van de organisatie van het
      kernministerie vanaf het niveau van afdelingen (of daarmee vergelijkbare organisatieonderdelen) en lager, en
      hiermee samenhangend het besluiten tot reorganisaties;

      2. het vaststellen van de formatie van het DGBD, voor zover het een uitbreiding van de totale formatie betreft;

      3. het – met inachtneming van het vorige artikel – aanstellen, benoemen, plaatsen en ontslaan van ambtenaren in
      overige leidinggevende functies bij het kernministerie tot het niveau van afdelingshoofden of daarmee gelijk te
      stellen leidinggevende functies;

      4. het – met inachtneming van het vorige artikel – aanstellen, benoemen, plaatsen en ontslaan van ambtenaren
      werkzaam in functies bij het kernministerie met een bezoldiging van salarisschaal 15 of hoger. Benoemingen vinden
      plaats na overleg met de bestuursraad;

      5. het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in de vorige twee
      leden;

      6. het besluiten tot (bijzondere) beloning conform [artikel 8 van het BBRA 1984][ref2] van functionarissen van
      het kernministerie;

      7. het besluiten op verzoeken van functionarissen van het kernministerie tot uitbreiding van een arbeidsduur van
      meer dan 36 uur per week;

      8. het voeren van overleg met bonden over regelingen van rechtspositionele aard als bedoeld in
      [artikel 113 van het ARAR][ref3] bij afwezigheid van de SG;

      9. het vaststellen van regelingen of maken van afspraken met betrekking tot sociaal flankerend beleid;

      10. het vaststellen van regels en beleid(skaders) inzake de bedrijfsvoering, waaronder regels die leiden tot
      wijzigingen in de rechten of verplichting van ambtenaren, voor zover van toepassing op ambtenaren van het gehele
      ministerie of het kernministerie;

      11. het besluiten tot het – al dan niet voorwaardelijk – opleggen van de disciplinaire maatregel van ontslag als
      bedoeld in [artikel 81, eerste lid, onder l, van het ARAR][ref4];

      12. het besluiten tot het – al dan niet voorwaardelijk – opleggen van disciplinaire maatregelen als bedoeld
      in [artikel 81 van het ARAR][ref5] aan functionarissen behorende tot de topstructuur van het ministerie en de
      directoraten-generaal;

      13. het verlenen van ontslag wegens reorganisatie;

      14. het sluiten van een vaststellingsovereenkomst in verband met het beëindigen van de aanstelling of
      tewerkstelling bij het ministerie of een wijziging van een reeds afgesloten vaststellingsovereenkomst;

      15. het verlenen van ontslag op grond van [artikel 99 van het ARAR][ref6], voor zover de daaraan gekoppelde
      financiële verplichtingen voor het ministerie (uitkering inclusief andere verstrekkingen en/of vergoedingen) per
      saldo hoger zijn dan bij een financiële verplichting op grond van WW en bovenwettelijk WW.


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Artikel20
