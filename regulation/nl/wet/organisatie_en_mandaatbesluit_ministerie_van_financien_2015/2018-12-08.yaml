    text: |-
      1 Met inachtneming van de taken als bedoeld in [artikel 8][ref1] en passend binnen de topstructuur als bedoeld in
      [artikel 7][ref2] kan de SG of de pSG tijdelijke organisatieonderdelen instellen.

      2 De SG kan de directeur-generaal Belastingdienst toestemming verlenen om, met inachtneming van de topstructuur van
      het DGBD en de taken genoemd in [bijlage 1b][ref3], tijdelijke organisatieonderdelen in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Artikel8
