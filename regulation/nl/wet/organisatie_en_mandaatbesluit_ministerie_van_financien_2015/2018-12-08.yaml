  - number: '4'
    text: |-
      De directeuren-generaal, onder wie de thesaurier-generaal, (de DG’s) zijn verantwoordelijk voor de beleidsterreinen
      van de onder hen ressorterende directies, genoemd in [bijlagen 1 b tot en met e][ref1], voor de samenhang tussen
      die beleidsterreinen en – met inachtneming van de [artikelen 20][ref2] en [20a][ref3] van dit besluit – voor
      de bijbehorende bedrijfsvoering. De DG’s hebben een plaatsvervanger, die hen bij afwezigheid vervangt. De DG’s
      geven leiding aan de onder hen ressorterende directeuren en voorzien daartoe in de nodige ondermandaten van die
      directeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
