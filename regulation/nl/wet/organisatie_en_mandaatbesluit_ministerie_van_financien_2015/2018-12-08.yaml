articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *het ministerie:* het Ministerie van Financiën;

      b. *het kernministerie:* het Ministerie van Financiën exclusief het directoraat-generaal Belastingdienst;

      c. *de minister:* de Minister van Financiën;

      d. *de staatssecretaris:* de Staatssecretaris van Financiën;

      e. *bewindspersoon:* de Minister of de Staatssecretaris van Financiën;

      f. *algemene leiding:* de secretaris-generaal, de plaatsvervangend secretaris-generaal en de directeuren-generaal;

      g. *mandaat:* de bevoegdheid om in naam van een bewindspersoon besluiten te nemen;

      h. *volmacht:* de bevoegdheid die een volmachtgever verleent aan een ander, de gevolmachtigde, om in zijn naam
      privaatrechtelijke rechtshandelingen te verrichten;

      i. *(hoofd)budgethouder:* hoofd van een organisatie-eenheid verantwoordelijk voor het financieel beheer van één of
      meer budgetten;

      j. *bedrijfsvoering:* onderwerpen op de terreinen van personeel en organisatie, informatievoorziening en ict,
      inkoop, huisvesting, facilitaire zaken en beveiliging.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel1
  - number: '2'
    text: |-
      Het ministerie werkt aan een goede financiële huishouding van Nederland, int belastingen op basis van solide
      fiscale regelgeving en ziet toe op een doelmatige besteding van overheidsgeld. Het ministerie maakt regels voor het
      goed functioneren van het financiële stelsel en werkt aan een sterke economische structuur die verankerd is in een
      economisch en financieel gezond Europa.

      De algemene leiding hanteert de basiswaarden van het ministerie en draagt zorg voor de bevordering van deze waarden
      onder de medewerkers. Zij stimuleert de toewijding, de deskundigheid, de professionaliteit en de aanspreekbaarheid
      van de medewerkers. De algemene leiding geeft ruimte aan talent in de organisatie en bevordert de samenwerking
      tussen dienstonderdelen en met andere ministeries. De algemene leiding legt over de bedrijfsvoering en het beheer
      van de haar toevertrouwde middelen op inzichtelijke wijze verantwoording af.
    url: https://wetten.overheid.nl/BWBR0037135/2018-12-08#Artikel2
  - number: '3'
    text: |-
      1 Overeenkomstig [artikel 1 van het Besluit regeling functie en verantwoordelijkheid van de secretaris-generaal][ref1]
      (Stb. 1988, 499), is de secretaris-generaal (de SG), met inachtneming van de aanwijzingen van de Minister, belast
      met de ambtelijke leiding van al hetgeen het ministerie betreft.

      2 Onverminderd de overige bepalingen van dit besluit waarin aan de SG mandaat wordt verleend, wordt aan de SG
      mandaat verleend voor:

      a) aangelegenheden op het gebied van de ambtelijke leiding van al hetgeen
      het ministerie betreft, zoals nader omschreven in de toelichting bij het
      [Besluit regeling functie en verantwoordelijkheid van de secretaris-generaal][ref2] (Stb. 1988, 499);

      b) het vaststellen van circulaires, met uitzondering van circulaires die naar het oordeel van de SG door een ander
      organisatieonderdeel als bedoeld in [artikel 7][ref3] moeten worden vastgesteld;

      c) het vaststellen van de werkterreinen van de directeuren-generaal, bedoeld in [artikel 4][ref4];

      d) het uitoefenen van de bevoegdheden van de minister inzake benoeming, schorsing, ontslag en vergoeding van
      ambtenaren en andere personen in organen van rechtspersonen en colleges, voor zover daarvoor geen mandaat, volmacht
      en machtiging is verleend aan een andere ambtenaar binnen het ministerie.

      3 De SG is verantwoordelijk voor de beleidsterreinen van de direct onder hem ressorterende directies en
      diensten, genoemd in [bijlage 1a][ref5], voor de samenhang tussen die beleidsterreinen en voor de bijbehorende
      bedrijfsvoering. De SG geeft leiding aan de onder hem ressorterende directeuren en voorziet daartoe in de nodige
      ondermandaten van die directeuren.

      4 De SG treft een vervangingsregeling inzake vervanging bij zijn afwezigheid, met inachtneming van
      [artikel 3a, vijfde lid][ref6].


