preamble:
  text: |-
    Gelet op:

    De artikelen 19, 37 en 56, eerste lid, van Verordening (EG) nr. 73/2009 van de Raad van de Europese Unie van
    19 januari 2009 tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse
    steunverlening aan landbouwers in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van
    bepaalde steunregelingen voor landbouwers, tot wijziging van Verordeningen (EG) nr. 1290/2005, (EG) nr. 247/2006,
    (EG) nr. 378/2007 en tot intrekking van Verordening (EG) nr. 1782/2003 (PbEU 2009, L 30);

    Artikel 31, eerste lid, van Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van 17 december
    2013 inzake steun voor plattelandsontwikkeling uit het Europees Landbouwfonds voor plattelandsontwikkeling (ELFPO)
    en tot intrekking van Verordening (EG) nr. 1698/2005 van de Raad (PbEU 2013, L 347);

    Artikel 1 van Verordening (EU) nr. 1360/2013 van de Raad van 2 december 2013 tot vaststelling van de bedragen
    van de productieheffingen in de sector suiker voor de verkoopseizoenen 2001/2002, 2002/2003, 2003/2004, 2004/2005
    en 2005/2006, de coëfficiënt voor de berekening van de aanvullende heffing voor de verkoopseizoenen 2001/2002 en
    2004/2005 en de bedragen die de suikerfabrikanten aan de suikerbietenverkopers moeten betalen vanwege het verschil
    tussen de maximumheffing en de te innen heffing voor de verkoopseizoenen 2002/2003, 2003/2004 en 2005/2006 (PbEU
    2013, L 343);

    De artikelen 24, eerste lid, en 25, eerste en tweede lid, van de Landbouwwet;

    Artikel 26, tweede lid, van het Uitvoeringsbesluit Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *formulier:* formulier als bedoeld in [bijlage 1][ref1] bij deze regeling;
        - *opgaveplichtige:* degene aan wie de minister het formulier langs schriftelijke of elektronische weg heeft
      toegezonden;
        - *verordening 73/2009:* [Verordening (EG) nr. 73/2009](32009R0073) van de Raad van de Europese Unie van 19 januari
      2009 tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening aan
      landbouwers in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen
      voor landbouwers, tot wijziging van Verordeningen (EG) nr. 1290/2005, (EG) nr. 247/2006, (EG) nr. 378/2007 en tot
      intrekking van Verordening (EG) nr. 1782/2003 (PbEU 2009, L 30);
        - *verordening 1305/2013:* Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van 17 december
      2013 inzake steun voor plattelandsontwikkeling uit het Europees Landbouwfonds voor plattelandsontwikkeling (ELFPO)
      en tot intrekking van [Verordening (EG) nr. 1698/2005](32005R1698) van de Raad (PbEU 2013, L 347).


      [ref1]: https://wetten.overheid.nl/BWBR0034935
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034935
  - number: '2'
    text: |-
      1 Het formulier is een beschrijvingsbiljet als bedoeld in [artikel 24, eerste lid, van de Landbouwwet][ref1].

      2 Een landbouwer verstrekt gegevens als bedoeld in
      [artikel 26, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref2] door middel van het formulier.

      3 Op grond van artikel 19, derde lid, van [verordening 73/2009](32009R0073), dient het formulier voor:

      a. het doen van de aanvraag, bedoeld in [artikel 55, eerste lid, van de Regeling GLB-inkomenssteun 2006][ref3],

      b. het verzoek om betalingen als bedoeld in artikel 36, onder a, onderdelen i en ii, van [verordening 1698/2005]
      (32005R1698),

      c. het verstrekken van informatie of een betaalverzoek als bedoeld in een Subsidieverordening natuur- en
      landschapsbeheer van een provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0019131
        artikel: '55'
  - number: '3'
    text: |-
      1 Het formulier heeft betrekking op de periode van 1 april 2014 tot en met 15 mei 2014.

      2 De periode, bedoeld in het eerste lid, is het tijdvak waarin de landbouwtelling, bedoeld in
      [artikel 25, eerste lid, van de Landbouwwet][ref1] wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '4'
    text: |-
      1 Een opgaveplichtige verstrekt:

      a. informatie naar de toestand van de veestapel zoals die was op 1 april 2014,

      b. informatie over de toestand van de beteelde percelen zoals die is of wordt verwacht op 15 mei 2014, en

      c. de naam van het gewas waarmee een perceel zal worden beteeld, als dat niet is beteeld op 15 mei 2014.

      2 Een opgaveplichtige verstrekt overige informatie naar de toestand op zijn onderneming op het moment van
      ondertekening van het formulier.
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel4
  - number: '5'
    text: |-
      1 De bedrijfsomvang wordt bepaald op basis van de totale standaardopbrengst van het bedrijf.

      2 De standaardopbrengst wordt vastgesteld met inachtneming van [bijlage 2][ref1].

      3 De bedrijfsomvang wordt uitgedrukt in euro's.


      [ref1]: https://wetten.overheid.nl/BWBR0034935
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034935
  - number: '6'
    text: |-
      Een opgaveplichtige kan het formulier langs elektronische weg invullen, ondertekenen en indienen op het
      internetadres www.mijnrvo.nl.
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel6
  - number: '7'
    text: |-
      1 De Minister verstrekt aan een opgaveplichtige een code waarmee deze toegang krijgt tot het elektronisch
      formulier.

      2 De Minister verstrekt aan een opgaveplichtige of diens gemachtigde een tancode ter ondertekening van het
      elektronisch formulier.

      3 De Minister kan besluiten geen tancode te verstrekken of al verstrekte tancodes in te trekken indien de
      ondertekenaar, een met de ondertekenaar geassocieerd bedrijf, of een met de ondertekenaar geassocieerde organisatie
      in het verleden een tancode heeft gebruikt in strijd met deze regeling of op andere wijze de integriteit van een
      verstrekte handtekening heeft geschonden.
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel7
  - number: '8'
    text: |-
      1 De Minister hoeft geen elektronisch formulier in behandeling nemen dat niet overeenkomstig deze regeling is
      ingediend.

      2 De Minister hoeft geen elektronisch verzonden bericht in behandeling te nemen voor zover de betrouwbaarheid of
      vertrouwelijkheid van dit bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het
      doel waarvoor het wordt gebruikt.

      3 De Minister informeert degene die het elektronisch formulier heeft ondertekend zo spoedig mogelijk van een
      besluit als bedoeld in het eerste of het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel8
  - number: '9'
    text: |-
      Het tijdstip waarop een elektronisch formulier door de Minister is ontvangen, is het tijdstip waarop alle vereiste
      bescheiden, bedoeld in de artikelen 12 en 13 van [Verordening (EG) nr. 1122/2009](32009R1122) van de Commissie
      van 30 november 2009 tot vaststelling van bepalingen ter uitvoering van [Verordening (EG) nr. 73/2009](32009R0073)
      van de Raad wat betreft de randvoorwaarden, de modulatie en het geïntegreerd beheers- en controlesysteem in het
      kader van de bij die verordening ingestelde regelingen inzake rechtstreekse steunverlening aan landbouwers en ter
      uitvoering van [Verordening (EG) nr. 1234/2007](32007R1234) van de Raad wat betreft de randvoorwaarden in het kader
      van de steunregeling voor de wijnsector (PbEU L 2009, 316) zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel9
  - number: '11'
    text: |-
      Door de minister op grond van de artikelen 1 en 2 van [verordening 1360/2013](32013R1360) verstrekte teruggaven
      aan een suikerfabrikant, suikerbietenteler of aan een producent van suiker, isocglucose of inulinestroop, die
      voor de inwerkingtreding van deze regeling zijn verstrekt, gelden als teruggaven die zijn verstrekt op grond van
      [artikel 5e van de Regeling suiker, isoglucose en inulinestroop 1999][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010502#Artikel5e
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010502
        artikel: 5e
  - number: '12'
    text: |-
      De [Regeling landbouwtelling en gecombineerde opgave 2013][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0033036
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033036
  - number: '13'
    text: Deze regeling treedt in werking op 1 april 2014, en werkt wat betreft artikel 11 terug tot en met 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel13
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling landbouwtelling en gecombineerde opgave 2014.'
    url: https://wetten.overheid.nl/BWBR0034935/2014-07-01#Artikel13
