  - number: '6'
    text: |-
      1 Geen subsidie wordt verleend:

      a. indien de subsidieverlening in strijd is met [verordening (EG) nr. 1257/1999](31999R1257), [verordening (EG) nr.
      445/2002](32002R0445), of het plattelandsontwikkelingsprogramma;

      b. indien de subsidieverlening een, op grond van [Verordening (EG) nr. 1257/1999](31999R1257) of [Verordening (EG)
      nr. 445/2002](32002R0445), ongeoorloofde samenloop van verschillende subsidies met zich meebrengt;

      c. voorzover enig bestuursorgaan of de Commissie van de Europese Gemeenschappen voor het project of de projecten,
      of de activiteit of activiteiten reeds een subsidie heeft verleend of zal verlenen, waardoor het totaal van de te
      ontvangen subsidie voor het project of de projecten, of de activiteit of activiteiten meer bedraagt dan

      i. het voor de desbetreffende projecten of activiteiten bij de desbetreffende maatregel bij steunintensiteit of
      toegepaste bedragen voor de desbetreffende categorie rechtspersonen of natuurlijke personen vermelde percentage van
      de subsidiabele kosten,

      ii. het percentage van de subsidiabele kosten waarnaar voor de desbetreffende categorie rechtspersonen of
      natuurlijke personen in de desbetreffende maatregel bij steunintensiteit of toegepaste bedragen wordt verwezen, of

      iii. indien van toepassing en het een lager bedrag is, het op de desbetreffende maatregel van toepassing zijnde
      maximale subsidiebedrag;

      d. indien de subsidieverlening betrekking heeft op projecten of activiteiten die worden verricht ter voldoening aan
      enige wettelijke verplichting.

      2 Geen subsidie wordt verleend voor projecten en activiteiten waarvan met de uitvoering een aanvang is gemaakt
      alvorens de ontvangst van de aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd. Onder
      het maken van een aanvang met de uitvoering van een investering wordt in ieder geval verstaan het aangaan van
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel6
  - number: '7'
    text: Subsidieaanvragen worden ingediend bij Gedeputeerde Staten van de desbetreffende provincie.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel7
  - number: '8'
    text: |-
      De minister stelt de beslissing tot het verlenen van subsidie vast binnen 26 weken na ontvangst van de
      subsidieaanvraag door Gedeputeerde Staten van de desbetreffende provincie. De minister kan deze termijn eenmalig
      met 13 weken verlengen.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel8
  - number: '9'
    text: De minister kan aan de subsidieontvanger een voorschot verlenen tot ten hoogste 80% van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel9
  - number: '10'
    text: |-
      1 Subsidie voor investeringen in landbouwbedrijven wordt slechts verleend voor investeringen in landbouwbedrijven
      die gericht zijn op:

      a. verlaging van productiekosten,

      b. verbetering en omschakeling van de productie,

      c. verhoging van de kwaliteit,

      d. instandhouding en verbetering van het natuurlijk milieu, de hygiënische omstandigheden en de normen op het
      gebied van dierenwelzijn, of

      e. bevordering van de diversificatie van landbouwactiviteiten.

      2 Subsidie voor investeringen in landbouwbedrijven wordt slechts verleend indien:

      a. de aanvrager voor eigen rekening en risico een landbouwbedrijf exploiteert,

      b. op het tijdstip van de indiening van de aanvraag de economische levensvatbaarheid van het landbouwbedrijf
      aantoonbaar is,

      c. het landbouwbedrijf voldoet aan de minimumeisen op het gebied van milieu, hygiëne en dierenwelzijn, hetgeen
      omvat de geldende nationale en Europese minimumnormen op het gebied van milieu, dierenwelzijn en hygiëne,
      hetgeen omvat de geldende normen bij of krachtens de Wet milieubeheer, de Wet verontreiniging oppervlaktewater,
      de [Meststoffenwet][ref1], de [Wet bodembescherming][ref2], de [Bestrijdingsmiddelenwet 1962][ref3], de
      [Gezondheids- en welzijnswet voor dieren][ref4], de [Diergeneesmiddelenwet][ref5] en de Plantenziektewet, en

      d. de aanvrager beschikt over voldoende agrarische vakbekwaamheid.

      3 Geen subsidie wordt verleend voor investeringen die gericht zijn op een productieverhoging waarvoor op de markt
      geen normale afzetmogelijkheden kunnen worden gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
