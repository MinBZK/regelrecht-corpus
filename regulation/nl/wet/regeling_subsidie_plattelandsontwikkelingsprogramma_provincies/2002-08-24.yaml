  - number: '17'
    text: |-
      1 De minister besluit tot weigering of intrekking van de subsidieverlening of de subsidievaststelling, indien de
      aanvrager naast de aanvraag tot subsidieverlening of subsidievaststelling op grond van deze regeling, in hetzelfde
      jaar een andere aanvraag tot subsidieverlening of subsidievaststelling bij een Nederlands bestuursorgaan heeft
      ingediend waarop dezelfde hoofdstukken van [verordening (EG) nr. 1257/1999](31999R1257) van toepassing zijn en deze
      andere aanvraag is door ernstige nalatigheid of opzet onjuist.

      2 De minister besluit tot weigering of intrekking van de subsidieverlening of de subsidievaststelling, indien
      de aanvrager naast de aanvraag tot subsidieverlening of subsidievaststelling op grond van deze regeling, in het
      voorafgaande jaar een andere aanvraag tot subsidieverlening of vaststelling bij een Nederlands bestuursorgaan heeft
      ingediend waarop dezelfde hoofdstukken van [verordening (EG) nr. 1257/1999](31999R1257) van toepassing zijn en deze
      andere aanvraag is door opzet onjuist.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel17
  - number: '18'
    text: |-
      1 Een aanvraag kan worden afgewezen en een beschikking, inhoudende de verstrekking van een subsidie op grond van
      deze regeling, kan worden ingetrokken of gewijzigd voorzover subsidieverstrekking in strijd zou zijn met ingevolge
      het Verdrag voor de lidstaat Nederland geldende verplichtingen.

      2 Bij de intrekking of wijziging kan worden bepaald dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Regeling subsidie plattelandsontwikkelingsprogramma provincies.'
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel19
  - number: 19a
    text: |-
      Voor aanvragen die vanaf 1 april 2002 zijn ingediend op grond van de

      a. Verordening plattelandsontwikkeling Gelderland,

      b. Subsidieverordening plattelandsontwikkeling provincie Limburg,

      c. Verordening plattelandsontwikkeling Noord-Brabant,

      d. Verordening plattelandsontwikkeling provincie Noord-Holland 2002,

      e. Verordening Plattelandsontwikkeling Overijssel,

      f. Verordening Plattelandsontwikkelingsplan Samenwerkingsverband Noord-Nederland,

      g. Subsidieverordening Europees plattelandsontwikkelingsprogramma Utrecht 2002,

      h. Verordening plattelandsontwikkeling Zeeland, of

      i. de Informatiebrochure PlattelandsOnwikkelingsProgramma van de provincie Zuid-Holland van juli 2002,

      is deze regeling van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel19a
  - number: '20'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel20
