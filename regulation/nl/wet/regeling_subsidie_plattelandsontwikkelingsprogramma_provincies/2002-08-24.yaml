preamble:
  text: |-
    Gelet op verordening (EG) nr. 1257/1999 van de Raad van 17 mei 1999 inzake steun voor plattelandsontwikkeling uit
    het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal
    verordeningen (PbEG L 160);

    Gelet op verordening (EG) nr. 445/2002 van de Commissie van 26 februari 2002 tot vaststelling van
    uitvoeringsbepalingen van Verordening (EG) nr. 1257/1999 van de Raad inzake steun voor plattelandsontwikkeling uit
    het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) (PbEG L 74);

    Gelet op verordening (EEG) nr. 4045/89 van de Raad van 21 december 1989 inzake de door de Lid-Staten uit te voeren
    controles op de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van het Europees
    Oriëntatie- en Garantiefonds voor de Landbouw en houdende intrekking van Richtlijn 77/435/EEG (PbEG L 388);

    Gelet op het programmeringsdocument voor plattelandsontwikkeling voor Nederland met betrekking tot de
    programmeringsperiode 2000-2006, zoals goedgekeurd door de Commissie van de Europese Gemeenschappen bij beschikking
    C(2000) 2751 def. van 28 september 2000, inclusief de door de Commissie van de Europese Gemeenschappen goedgekeurde
    wijzigingen van dit programmeringsdocument;

    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit
  url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              [verordening (EG) nr. 1257/1999](31999R1257):

              [verordening (EG) nr. 1257/1999](31999R1257) van de Raad van 17 mei 1999 inzake steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en
      instelling van een aantal verordeningen (PbEG L 160);



            c

              [verordening (EG) nr. 445/2002](32002R0445):

              [verordening (EG) nr. 445/2002](32002R0445) van de Commissie van 26 februari 2002 tot vaststelling
      van uitvoeringsbepalingen van [Verordening (EG) nr. 1257/1999](31999R1257) van de Raad inzake steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- Garantiefonds voor de Landbouw (EOGFL) (PbEG L 74);



            d

              [verordening (EEG) nr. 4045/89](31989R4045):

              [verordening (EEG) nr. 4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door de Lid-Staten
      uit te voeren controles op de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie
      van het Europees Oriëntatie- en Garantiefonds voor de Landbouw en houdende intrekking van [Richtlijn 77/435/EEG]
      (31977L0435) (PbEG L 388);



            e
            plattelandsontwikkelingsprogramma:

              programmeringsdocument voor plattelandsontwikkeling voor Nederland met betrekking tot de
      programmeringsperiode 2000-2006, zoals goedgekeurd door de Commissie van de Europese Gemeenschappen bij beschikking
      C(2000) 2751 def. van 28 september 2000, inclusief de door de Commissie van de Europese Gemeenschappen goedgekeurde
      wijzigingen van dit programmeringsdocument;



            f
            provinciaal programma:

              bijlage 2 van het plattelandsontwikkelingsprogramma;



            g
            kalenderjaar:

              jaar dat aanvangt op 1 januari en eindigt op 31 december;



            h
            Verdrag:

              [Verdrag tot oprichting van de Europese Gemeenschap](onbekend);



            i
            landbouwbedrijf:

              geheel van productie-eenheden in Nederland bestaande uit een of meer gebouwen of gedeelten daarvan en de
      daarbij behorende cultuurgrond, uitsluitend of deels dienende tot uitoefening van de landbouw;



            j
            agrarische vakbekwaamheid:

              bezit van een getuigschrift van een erkende landbouwkundige opleiding of van een opleiding van een hiermee
      gelijkwaardig niveau, of een werkervaring op een landbouwbedrijf voor een duur van ten minste drie jaren;



            k
            handelsdocumenten:

              documenten als bedoeld in artikel 1, tweede lid, en artikel 3 van [verordening (EEG) nr. 4045/89]
      (31989R4045);



            l
            maatregel:

              overeenkomstig punt 9 van de bijlage van [verordening (EG) nr. 445/2002](32002R0445) in het provinciaal
      programma beschreven maatregel;



            m
            communautaire bijdrage:

              ten behoeve van de desbetreffende maatregel overeenkomstig het bij deze maatregel vermelde percentage uit
      het Europees Oriëntatie- en Garantiefonds voor de Landbouw, afdeling Garantie, als onderdeel van de subsidie te
      financieren bedrag;



            n
            nationale bijdrage:

              door een of meer Nederlandse bestuursorganen of daarmee in het provinciaal programma gelijkgestelde
      organisaties, ten behoeve van de desbetreffende maatregel, te financieren bedrag;



            o
            beschikbaar bedrag:

              som van de communautaire bijdrage en de daarmee corresponderende nationale bijdrage;



            p
            subsidie:

              door de minister te verlenen bedrag, hetgeen
              ingeval aan een Nederlands bestuursorgaan of daarmee in het provinciaal programma gelijkgestelde
      organisatie subsidie wordt verleend, overeenkomt met het laagste bedrag van de volgende bedragen het bij de
      desbetreffende maatregel bij steunintensiteit of toegepaste bedragen voor deze categorie rechtspersonen vermelde
      percentage van de subsidiabele kosten, of het percentage van de subsidiabele kosten waarnaar voor deze categorie
      rechtspersonen in de desbetreffende maatregel bij steunintensiteit of toegepaste bedragen wordt verwezen,
      indien van toepassing, het bij de desbetreffende maatregel vermelde maximale subsidiebedrag of het maximale
      subsidiebedrag waarnaar in de desbetreffende maatregel wordt verwezen,
      het bedrag waarvoor subsidie is aangevraagd,
      ingeval aan een ander dan een Nederlandse bestuursorgaan of daarmee in het provinciaal programma gelijkgestelde
      organisatie subsidie wordt verleend, overeenkomt met het laagste bedrag van de volgende bedragen het bij de
      desbetreffende maatregel bij steunintensiteit of toegepaste bedragen voor deze categorie rechtspersonen of
      natuurlijke personen vermelde percentage van de subsidiabele kosten, of het percentage van de subsidiabele
      kosten waarnaar voor deze categorie rechtspersonen of natuurlijke personen in de desbetreffende maatregel bij
      steunintensiteit of toegepaste bedragen wordt verwezen
      indien van toepassing, het bij de desbetreffende maatregel vermelde maximale subsidiebedrag of het maximale
      subsidiebedrag waarnaar in de desbetreffende maatregel wordt verwezen,
      het bedrag waarvoor subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel1
  - number: '2'
    text: |-
      De minister kan ter uitvoering van het provinciaal programma overeenkomstig [verordening (EG) nr. 1257/1999]
      (31999R1257), [verordening (EG) nr. 445/2002](32002R0445) en deze regeling, na advies van Gedeputeerde Staten
      van de desbetreffende provincie, tot het beschikbaar bedrag subsidies verstrekken aan natuurlijke personen en
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel2
  - number: '3'
    text: |-
      1 De minister kan op voordracht van Gedeputeerde Staten van de desbetreffende provincie per jaar voor iedere
      provincie één of meer aanvraagperioden vaststellen voor subsidieaanvragen op grond van deze regeling.

      2 De minister stelt voor de aanvraagperiode of aanvraagperiodes per maatregel en per provincie op voordracht van
      Gedeputeerde Staten van de desbetreffende provincie de communautaire bijdrage vast.

      3 De minister stelt op voordracht van Gedeputeerde Staten van de desbetreffende provincie, gelijktijdig met het
      besluit, bedoeld in het tweede lid, de voorwaarden vast die worden gesteld aan de periode waarin de te subsidiëren
      projecten of activiteiten worden uitgevoerd en de bijbehorende uitgaven worden gedaan.

      4 De minister stelt op voordracht van Gedeputeerde Staten van de desbetreffende provincie, gelijktijdig met het
      besluit, bedoeld in het tweede lid, de wijze van verdeling van het beschikbare bedrag vast door

      a. beoordelingscriteria voor de mate waarin de subsidieaanvraag bijdraagt aan het bereiken van de doelstellingen
      van [verordening (EG) nr. 1257/1999](31999R1257), [verordening (EG) nr. 445/2002](32002R0445), en deze regeling, en

      b. de verhouding tussen deze beoordelingscriteria vast te stellen.

      5 De minister maakt de besluiten, bedoeld in het eerste, tweede, derde en vierde lid, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel3
  - number: '4'
    text: |-
      1 Gedeputeerde Staten beoordelen de subsidieaanvragen ten behoeve van het advies, bedoeld in [artikel 2][ref1], aan
      de hand van de volgende criteria:

      a. de verenigbaarheid van de subsidieaanvraag met [verordening (EG) nr. 1257/1999](31999R1257) en [verordening (EG)
      nr. 445/2002](32002R0445);

      b. de verenigbaarheid van de subsidieaanvraag met het plattelandsontwikkelingsprogramma, het provinciaal programma,
      deze regeling en het in [artikel 3, derde lid][ref2], bedoelde besluit;

      c. de mate waarin het project waarop de subsidieaanvraag betrekking heeft, bijdraagt aan de verwezenlijking van het
      plattelandsontwikkelingsprogramma, het provinciaal programma en voldoet aan de in [artikel 3, vierde lid][ref3],
      genoemde beoordelingscriteria.

      2 Gedeputeerde Staten kunnen de minister adviseren een aanvraag tot subsidieverlening geheel of gedeeltelijk af
      te wijzen.

      3 Gedeputeerde Staten brengen, na beoordeling van de subsidieaanvragen, een advies uit aan de minister in de vorm
      van een rangschikking van de aanvragen tot subsidieverlening waarover Gedeputeerde Staten ingevolge het tweede lid
      niet afwijzend adviseren, waarbij aanvragen tot subsidieverlening hoger worden gerangschikt naarmate ze naar het
      oordeel van de Gedeputeerde Staten meer voldoen aan de beoordelingscriteria, bedoeld in het eerste lid, onderdeel
      c.


      [ref1]: https://wetten.overheid.nl/BWBR0013683#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013683#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013683#Artikel3
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel4
