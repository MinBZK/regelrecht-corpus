  - number: '15'
    text: |-
      1 De subsidieontvanger is verplicht, voor zover [verordening (EEG) nr. 4045/89](31989R4045) van toepassing is:

      a. de handelsdocumenten gedurende ten minste drie jaren te bewaren, ingaande na afloop van het jaar waarin zij zijn
      opgesteld, en

      b. in geval de met de controle belaste functionarissen of daartoe gemachtigde personen dit eisen, uittreksels of
      kopieën van de handelsdocumenten te verstrekken.

      2 De subsidieontvanger is verplicht de fysieke en administratieve controles toe te staan van de door de minister
      aangewezen toezichthouders en van de bij of krachtens het Verdrag bevoegde Europese controleurs.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel15
  - number: '16'
    text: |-
      1 De subsidieontvanger is verplicht de activiteiten overeenkomstig de aanvraag uit te voeren en het bepaalde bij
      of krachtens [verordening (EG) nr. 1257/1999](31999R1257), [verordening (EG) nr. 445/2002](32002R0445) of deze
      regeling na te leven.

      2 De subsidieverlening onderscheidenlijk -vaststelling wordt ingetrokken indien de subsidieontvanger zijn
      verplichtingen ingevolge onderhavige regeling of de subsidiebeschikking niet nakomt.

      3 Onverminderd het bepaalde in de Algemene wet bestuursrecht, besluit de minister in ieder geval tot weigering of
      intrekking van de subsidieverlening of de subsidievaststelling, indien de aanvrager door ernstige nalatigheid of
      opzet een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend.

      4 [Artikel 4:49, eerste lid, onderdeel c, van de Algemene wet bestuursrecht][ref1] vindt geen toepassing ten
      aanzien van reeds uitbetaalde subsidies indien niet-nakoming van de uit deze verordening en de subsidiebeschikking
      voortvloeiende verplichtingen het gevolg is van:

      a. overmacht als bedoeld in artikel 33 van [verordening (EG) nr. 445/2002](32002R0445), of

      b. ruilverkaveling of een andere publiekrechtelijke landinrichtingsmaatregel als bedoeld in artikel 32 van
      [verordening (EG) nr. 445/2002](32002R0445).


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel16
