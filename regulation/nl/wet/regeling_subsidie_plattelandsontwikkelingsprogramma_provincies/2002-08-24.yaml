  - number: '11'
    text: |-
      Subsidie voor beroepsopleiding van landbouwers en andere personen die betrokken zijn bij landbouw- en
      bosbouwactiviteiten wordt slechts verleend indien de opleiding gericht is:

      a. op voorbereiding van de landbouwers op een kwalitatieve heroriëntering van de productie en op de toepassing
      van productiemethoden die verenigbaar zijn met het landschapsbehoud en landschapsverbetering, milieubescherming,
      hygiënische normen en dierenwelzijn, en op verwerving van vaardigheden die noodzakelijk zijn om landbouwers in
      staat te stellen economisch levensvatbare bedrijven te beheren, of

      b. op het bekwamen van boseigenaren en andere personen die bij bosbouwactiviteiten zijn betrokken, in de toepassing
      van bosbeheerpraktijken ter verbetering van de economische, de ecologische of de maatschappelijke functies van
      bossen.

      2. Geen subsidie wordt verleend voor een beroepsopleiding die onderdeel is van een normaal opleidingsprogramma of
      van leergangen voor middelbaar of hoger land- en bosbouwonderwijs.
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel11
  - number: '12'
    text: |-
      1 Subsidie voor investeringen in bedrijven voor de verbetering van de verwerking en afzet van landbouwproducten
      wordt slechts verleend, indien:

      a. op het tijdstip van de indiening van de aanvraag de economische levensvatbaarheid van het bedrijf van de
      aanvrager aantoonbaar is,

      b. het bedrijf voldoet aan de minimumeisen op het gebied van milieu, hygiëne en dierenwelzijn, hetgeen omvat
      de geldende nationale en Europese minimumnormen op het gebied van milieu, dierenwelzijn en hygiëne, hetgeen
      omvat de geldende normen bij of krachtens de Wet milieubeheer, de Wet verontreiniging oppervlaktewater,
      de [Meststoffenwet][ref1], de [Wet bodembescherming][ref2], de [Bestrijdingsmiddelenwet 1962][ref3], de
      [Gezondheids- en welzijnswet voor dieren][ref4], de [Diergeneesmiddelenwet][ref5] en de Plantenziektewet, en

      c. de investeringen betrekking hebben op de verwerking en afzet van producten opgenomen in bijlage I bij het
      Verdrag, met uitzondering van visserijproducten.

      2 Geen subsidie wordt verleend voor:

      a. investeringen die gericht zijn op een productieverhoging waarvoor op de markt geen normale afzetmogelijkheden
      kunnen worden gevonden,

      b. investeringen op het niveau van de detailhandel, en

      c. investeringen in de verwerking of afzet van producten uit derde landen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
      [ref2]: https://wetten.overheid.nl/BWBR0003818
