  - number: '14'
    text: |-
      1 Indien subsidie wordt verleend voor maatregelen ten behoeve van de bevordering van de aanpassing en de
      ontwikkeling van plattelandsgebieden, dienen de maatregelen gericht te zijn op de onderwerpen of activiteiten, als
      bedoeld in artikel 33 van [verordening (EG) nr. 1257/1999](31999R1257).

      2 Geen subsidie op grond van het eerste lid wordt verleend voor maatregelen waarvoor een subsidie kan worden
      verleend op grond van de [artikelen 10][ref1] tot en met [13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013683#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013683#Artikel13
    url: https://wetten.overheid.nl/BWBR0013683/2002-08-24#Artikel14
