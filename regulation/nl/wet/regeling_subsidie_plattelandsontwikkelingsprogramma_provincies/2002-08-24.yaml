  - number: '13'
    text: |-
      1 Subsidie voor maatregelen in de bosbouw wordt slechts verleend voor maatregelen die betrekking hebben op:

      a. bebossing van gronden;

      b. investeringen in bossen die gericht zijn op de verhoging van de economische, ecologische of maatschappelijke
      waarde;

      c. investeringen om de oogst, verwerking en afzet van bosbouwproducten te verbeteren en te rationaliseren;

      d. bevordering van nieuwe afzet- en gebruiksmogelijkheden voor bosbouwproducten;

      e. de instelling van verenigingen van boseigenaren, of

      f. herstel van het productiepotentieel van bossen die door een natuurramp of brand zijn beschadigd, en het treffen
      van preventieve voorzieningen.

      2 [Artikelen 10][ref1] en [12][ref2] zijn, in geval van investeringssteun, van overeenkomstige toepassing.

      3 Subsidie als bedoeld in het eerste lid, onderdeel a tot en met e, wordt slechts verleend voor bossen en gronden
      die eigendom zijn van particuliere personen, verenigingen van particuliere personen, gemeenten of verenigingen
      van gemeenten.

      4 Subsidie voor de bebossing van landbouwgrond, bedoeld in het eerste lid, onder a, wordt slechts verleend voor:

      a. de aanplantkosten, of

      b. de door de bebossing jaarlijks gederfde inkomsten voor een periode van maximaal 20 jaar.

      5 Geen subsidie als bedoeld in het vierde lid wordt verleend:

      a. aan landbouwers die een subsidie hebben ontvangen voor vervroegde uittreding, en

      b. voor de aanplant van kerstbomen.

      6 De voorwaarden, genoemd in hoofdstuk VIII van titel II van [verordening (EG) nr. 1257/1999](31999R1257) zijn van
      toepassing bij de subsidieverlening op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013683#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013683#Artikel12
