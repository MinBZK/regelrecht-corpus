  - number: '5'
    text: |-
      De minister beoordeelt de subsidieaanvragen ten behoeve van het besluit, bedoeld in [artikel 2][ref1], aan de hand
      van de criteria, genoemd in [artikel 4, eerste lid, onder a tot en met c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013683#Artikel2
