preamble:
  text: |-
    Mede namens de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 2.1.1, juncto artikel 12.3.48, tweede lid, artikel 7.2.4, lid 2 en lid 3a van de Wet educatie en
    beroepsonderwijs en artikel 2.2.3, derde lid, van het Uitvoeringsbesluit WEB;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021785/2007-05-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: de [Wet educatie en beroepsonderwijs][ref1];

      b. competenties: in het kader van het herontwerp van de kwalificatiestructuur mbo opgestelde eindtermen, die
      verwijzen naar onderliggende vaardigheden, kennis, en houdingsaspecten en expliciet zijn gerelateerd aan de
      toepassing in de praktijk;

      c. kwalificatieprofiel: het geheel van competenties, waaraan degene die de opleiding voltooit, dient te voldoen om
      in beroeps-, leer- en maatschappelijke situaties op adequate wijze te kunnen handelen;

      d. kwalificatiedossier: een inhoudelijke beschrijving van de kwalificatieprofielen, bestaande uit een deel A,
      waarin het beeld van de beroepengroep wordt omschreven, een deel B, waarin onder andere de competenties worden
      omschreven en een deel C, waarin onder andere de benodigde kennis en vaardigheden worden omschreven en een deel D
      waarin de ontwikkeling van het kwalificatiedossier wordt toegelicht en verantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0021785/2007-05-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '2'
    text: |-
      1 Voor de beroepsopleidingen die zijn opgenomen in [bijlage 1][ref1] behorende bij deze regeling, worden de
      kwalificatieprofielen voor het studiejaar 2007–2008 vastgesteld overeenkomstig [bijlage 2][ref2] behorende bij
      deze regeling.

      2 In [bijlage 1][ref3] wordt per beroepsopleiding vastgesteld:

      a. de leerweg waarin de beroepsopleiding kan worden verzorgd;

      b. de prijsfactor, bedoeld in [artikel 2.2.3, derde lid, van het Uitvoeringsbesluit WEB][ref4]; en

      c. de hoogte van de studielast, bedoeld in [artikel 7.2.4, tweede lid, onderdeel d, van de wet][ref5].


