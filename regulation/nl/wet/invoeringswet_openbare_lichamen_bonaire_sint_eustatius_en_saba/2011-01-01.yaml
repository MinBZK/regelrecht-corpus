---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: invoeringswet_openbare_lichamen_bonaire_sint_eustatius_en_saba
regulatory_layer: WET
publication_date: '2025-02-19'
valid_from: '2011-01-01'
bwb_id: BWBR0028063
url: https://wetten.overheid.nl/BWBR0028063/2011-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat met de eilandgebieden Bonaire, Sint Eustatius en Saba overeengekomen is
    dat zij als openbare lichamen een staatsrechtelijke positie krijgen binnen het Nederlandse staatsbestel en het in
    verband hiermee wenselijk is wettelijke regels te stellen over het in deze openbare lichamen toepasselijke recht,
    alsmede enkele andere voorzieningen te treffen van overgangsrechtelijke aard;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: In deze wet en de daarop berustende bepalingen wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel1
  - number: 1.a
    text: |-
      *tijdstip van transitie:* het tijdstip waarop
      __REF000___________________________________________________________________________________________________________
      _____ in werking treedt;


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028249
        artikel: I
  - number: 1.b
    text: |-
      *eilandgebieden:* de eilandgebieden Bonaire, Sint Eustatius en Saba, genoemd in artikel 1, onderdeel a, d en c, van
      de Staatsregeling van de Nederlandse Antillen, zoals die tot het tijdstip van transitie gold;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel1
  - number: 1.c
    text: '*openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel1
  - number: '2.1'
    text: |-
      In de openbare lichamen zijn de doorlopende teksten van de in de bijlage bij deze wet genoemde Nederlands-
      Antilliaanse regelingen, zoals deze bij besluit van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      van 6 oktober 2010 zijn vastgesteld en ter inzage zijn gelegd bij het ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties, als wet, algemene maatregel van bestuur of ministeriële regeling van toepassing overeenkomstig
      de status die de bijlage vermeldt. De regelingen worden in hun aldus verkregen status aangehaald op de wijze die de
      bijlage vermeldt.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel2
  - number: '2.2'
    text: |-
      Andere wettelijke regelingen dan die, bedoeld in het eerste lid, zijn in de openbare lichamen alleen van toepassing
      voor zover:
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel2
  - number: 2.2.a
    text: dit bij wettelijk voorschrift is bepaald;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel2
  - number: 2.2.b
    text: |-
      op andere wijze onmiskenbaar uit enig wettelijk voorschrift volgt dat die wettelijke voorschriften in de openbare
      lichamen van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het tweede lid laat onverlet de toepasselijkheid in de openbare lichamen van wettelijke regelingen die buiten het
      Europese deel van Nederland werking kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel2
  - number: '2.4'
    text: |-
      Voorzieningen van overgangsrechtelijke aard die zijn vastgesteld ten aanzien van de in de bijlage genoemde
      regelingen blijven van toepassing, tenzij bij wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel2
  - number: '3.1'
    text: |-
      De [Algemene wet bestuursrecht][ref1], met uitzondering van [hoofdstuk 9][ref2], is niet van toepassing op
      besluiten en handelingen van bestuursorganen die hun zetel hebben in het Europese deel van Nederland, ter
      uitvoering van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '9'
  - number: 3.1.a
    text: een wettelijke regeling die uitsluitend in de openbare lichamen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
  - number: 3.1.b
    text: |-
      een wettelijke regeling die op grond van [artikel 2, tweede lid][ref1], mede van toepassing is in de openbare
      lichamen, voor zover het besluit of de handeling gericht is tot een natuurlijk persoon of een rechtspersoon die
      ten tijde van het nemen van het besluit of het verrichten van de handeling ingezetene is van onderscheidenlijk
      gevestigd is in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      De [hoofdstukken 6 tot en met 8 van de Algemene wet bestuursrecht][ref1] zijn niet van toepassing op besluiten en
      handelingen van bestuursorganen die hun zetel hebben in het Europese deel van Nederland, ter uitvoering van een
      wettelijk voorschrift als bedoeld in artikel 2, derde lid, voor zover het desbetreffende besluit of de handeling
      gericht is tot een natuurlijk persoon of een rechtspersoon die ten tijde van het nemen van het besluit of het
      verrichten van de handeling ingezetene is van onderscheidenlijk gevestigd is in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
  - number: '3.3'
    text: |-
      [Hoofdstuk 9 van de Algemene wet bestuursrecht][ref1] is tevens van toepassing op gedragingen van in
      [artikel 1a, eerste lid, onder d en e, van de Wet Nationale ombudsman][ref2] bedoelde bestuursorganen met een zetel
      in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003372
        artikel: 1a
  - number: '3.4'
    text: |-
      In de gevallen, bedoeld in het eerste en tweede lid, is de [Wet administratieve rechtspraak BES][ref1] van
      toepassing voor zover sprake is van een beschikking in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028455
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028455
  - number: '3.5'
    text: |-
      Indien een beroepschrift tegen een beschikking op grond van een wettelijke regeling als bedoeld in het eerste
      lid, wordt ingediend bij een onbevoegde administratieve rechter, wordt het, nadat daarop de datum van ontvangst is
      aangetekend, zo spoedig mogelijk doorgezonden aan het bevoegde orgaan, onder gelijktijdige mededeling hiervan aan
      de afzender. [Artikel 6:15, derde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '3.6'
    text: |-
      Het tweede lid is niet van toepassing op besluiten en handelingen ten aanzien van ambtenaren als bedoeld in
      [artikel 1 van de Ambtenarenwet][ref1] als zodanig, die hun werkzaamheden verrichten in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
  - number: '3.7'
    text: |-
      Het eerste en tweede lid zijn evenmin van toepassing op de heffing en inning van belastingen of van rechten bij
      invoer.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel3
  - number: '4'
    text: |-
      Indien in een wettelijk voorschrift dat niet ingevolge [artikel 2, eerste of tweede lid][ref1], van toepassing
      is in de openbare lichamen, onderscheid wordt gemaakt tussen het land Nederland en de andere landen van het
      Koninkrijk, wordt, tenzij bij wettelijk voorschrift anders is bepaald, onder «Nederland» verstaan het Europese deel
      van Nederland en worden de openbare lichamen gelijkgesteld met andere landen van het Koninkrijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
        hoofdstuk: '2'
  - number: 4a
    text: |-
      In wettelijke regelingen en voorschriften zoals deze van toepassing zijn in de openbare lichamen wordt geen
      onderscheid gemaakt ten aanzien van de publiekrechtelijke rechtsgevolgen van huwelijken of geregistreerd
      partnerschappen voltrokken op grond van het in het Europese deel van Nederland geldende Burgerlijk Wetboek, en
      huwelijken, gesloten op grond van [Boek 1 van het Burgerlijk Wetboek BES][ref1] in een van de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: 4b.1
    text: 'Dit hoofdstuk is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4b
  - number: 4b.1.a
    text: de eilandsraden en de bestuursorganen van de openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4b
  - number: 4b.1.b
    text: de Rijksvertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4b
  - number: 4b.1.c
    text: personen die in de openbare lichamen werkzaam zijn onder verantwoordelijkheid van de centrale overheid.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4b
  - number: 4b.2
    text: |-
      In dit hoofdstuk worden onder «de organen van de openbare lichamen» en «de Rijksvertegenwoordiger» mede begrepen de
      onder hun onderscheidenlijk zijn verantwoordelijkheid werkzame personen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4b
  - number: 4c.1
    text: |-
      De in [artikel 4b, eerste lid][ref1], bedoelde organen en personen gebruiken de Nederlandse taal, tenzij bij of
      krachtens dit hoofdstuk anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel4b
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: 4b
        hoofdstuk: 2b
        paragraaf: '1'
  - number: 4c.2
    text: |-
      Zij kunnen een andere taal gebruiken dan bij of krachtens dit hoofdstuk is bepaald, indien het gebruik daarvan
      doelmatiger is en de belangen van derden daardoor niet onevenredig worden geschaad.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4c
  - number: 4d.1
    text: |-
      Een ieder kan de Nederlandse taal gebruiken in het verkeer met de in [artikel 4b, eerste lid][ref1], bedoelde
      organen en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel4b
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: 4b
        hoofdstuk: 2b
        paragraaf: '1'
  - number: 4d.2
    text: 'Een ieder kan:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4d
  - number: 4d.2.a
    text: het Papiaments gebruiken in het verkeer met de organen van het openbaar lichaam Bonaire;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4d
  - number: 4d.2.b
    text: het Engels gebruiken in het verkeer met de organen van het openbaar lichaam Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4d
  - number: 4d.3
    text: |-
      Een ieder kan het Papiaments ofwel het Engels gebruiken in het verkeer met de Rijksvertegenwoordiger en met
      personen die in de openbare lichamen werkzaam zijn onder verantwoordelijkheid van de centrale overheid.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4d
  - number: 4d.4
    text: |-
      Het tweede en derde lid gelden niet, indien het orgaan of de persoon heeft verzocht de Nederlandse taal te
      gebruiken op de grond, dat het gebruik van het Papiaments of het Engels tot een onevenredige belasting van het
      bestuurlijk verkeer zou leiden.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4d
  - number: 4e.1
    text: De organen van het openbaar lichaam Bonaire kunnen in het mondeling verkeer met een ieder het Papiaments gebruiken.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4e
  - number: 4e.2
    text: |-
      De organen van het openbaar lichaam Sint Eustatius of Saba kunnen in het mondeling verkeer met een ieder het Engels
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4e
  - number: 4e.3
    text: |-
      De Rijksvertegenwoordiger en personen die in de openbare lichamen werkzaam zijn onder verantwoordelijkheid van de
      centrale overheid kunnen in het mondeling verkeer met een ieder het Papiaments en het Engels gebruiken indien de
      wederpartij hierom heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4e
  - number: 4e.4
    text: |-
      Het eerste en tweede lid gelden niet, indien de wederpartij heeft verzocht de Nederlandse taal te gebruiken op de
      grond, dat het gebruik van het Papiaments of het Engels tot een onbevredigend verloop van het mondeling verkeer
      zou leiden.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4e
  - number: 4f.1
    text: |-
      De in [artikel 4b, eerste lid][ref1], bedoelde organen en personen maken in hun onderling schriftelijk verkeer
      en in het schriftelijke verkeer met in het Europese deel van Nederland gevestigde organen alleen gebruik van het
      Nederlands.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel4b
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: 4b
        hoofdstuk: 2b
        paragraaf: '1'
  - number: 4f.2
    text: |-
      Indien het gebruik daarvan doelmatiger is en de belangen van derden daardoor niet onevenredig worden geschaad
      kunnen in afwijking van het eerste lid:
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4f
  - number: 4f.2.a
    text: de organen van het openbare lichaam Bonaire in hun onderling schriftelijk verkeer het Papiaments gebruiken;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4f
  - number: 4f.2.b
    text: |-
      de organen van de openbare lichamen Sint Eustatius of Saba in hun onderling schriftelijk verkeer het Engels
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4f
  - number: 4f.3
    text: |-
      De in [artikel 4b, eerste lid][ref1], bedoelde organen en personen kunnen in hun onderling mondeling verkeer alleen
      gebruik van het Papiaments ofwel het Engels maken indien het gebruik daarvan doelmatiger is en de belangen van
      derden daardoor niet onevenredig worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel4b
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: 4b
        hoofdstuk: 2b
        paragraaf: '1'
  - number: 4g.1
    text: |-
      Een ieder kan in vergaderingen van de eilandsraad van het openbaar lichaam Bonaire dan wel van het openbaar lichaam
      Sint Eustatius of Saba het Papiaments onderscheidenlijk het Engels gebruiken.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4g
  - number: 4g.2
    text: |-
      Hetgeen in het Papiaments dan wel in het Engels is gezegd, wordt in het Papiaments onderscheidenlijk het Engels
      genotuleerd.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4g
  - number: 4h
    text: |-
      Onverminderd [artikel 4f][ref1] kan:


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel4f
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4h
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: 4f
        hoofdstuk: 2b
        paragraaf: '3'
  - number: 4h.a
    text: |-
      de eilandsraad van het openbaar lichaam Bonaire dan wel van het openbaar lichaam Sint Eustatius of Saba bij
      eilandsverordening regels stellen over het gebruik van het Papiaments onderscheidenlijk het Engels in schriftelijke
      stukken;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4h
  - number: 4h.b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voor de Rijksvertegenwoordiger regels stellen over het
      gebruik van het Papiaments ofwel het Engels in schriftelijke stukken;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4h
  - number: 4h.c
    text: |-
      Onze Minister wie het aangaat voor personen die in de openbare lichamen werkzaam zijn onder verantwoordelijkheid
      van de centrale overheid, regels stellen over het gebruik van het Papiaments ofwel het Engels in schriftelijke
      stukken.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4h
  - number: 4i.1
    text: |-
      Indien een schriftelijk stuk in het Papiaments ofwel het Engels is opgesteld, verstrekken de in
      [artikel 4b, eerste lid][ref1], bedoelde organen en personen daarvan op verzoek van een natuurlijk persoon of
      rechtspersoon die ingezetene is van of gevestigd is in de openbare lichamen een vertaling in de Nederlandse taal,
      tenzij het verstrekken tot een onevenredige belasting van het bestuurlijk verkeer zou leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel4b
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4i
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: 4b
        hoofdstuk: 2b
        paragraaf: '1'
  - number: 4i.2
    text: Het orgaan of de persoon kan voor het vertalen een vergoeding van ten hoogste de kosten verlangen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4i
  - number: 4i.3
    text: 'Voor het vertalen kan geen vergoeding worden verlangd, indien het schriftelijk stuk:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4i
  - number: 4i.3.a
    text: |-
      de notulen van de vergadering van de eilandsraad inhoudt, en het belang van de verzoeker rechtstreeks bij het
      genotuleerde is betrokken, dan wel de notulen van de vergadering van de eilandsraad inhoudt, en de vaststelling van
      een eilandsverordening of beleidsregels betreft, of
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4i
  - number: 4i.3.b
    text: een besluit of andere handeling inhoudt waarbij de verzoeker belanghebbende is.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4i
  - number: 4j.1
    text: 'Een schriftelijk stuk in het Papiaments of in het Engels wordt tevens in de Nederlandse taal opgesteld, indien het:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4j
  - number: 4j.1.a
    text: algemeen verbindende voorschriften of beleidsregels inhoudt, of
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4j
  - number: 4j.1.b
    text: is opgesteld ter directe voorbereiding van de onder a genoemde voorschriften of regels.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4j
  - number: 4j.2
    text: |-
      De bekendmaking, mededeling of terinzagelegging van een schriftelijk stuk als bedoeld in het eerste lid geschiedt
      in ieder geval ook in de Nederlandse taal, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel4j
  - number: '5'
    text: |-
      Vonnissen, door de rechter in het Europese deel van Nederland of in de openbare lichamen gewezen, en bevelen
      door hem uitgevaardigd, alsmede grossen van authentieke akten, aldaar verleden, kunnen overal in Nederland
      worden ten uitvoer gelegd, met inachtneming van de wettelijke bepalingen die van kracht zijn op de plaats waar de
      tenuitvoerlegging plaatsvindt. Bij algemene maatregel van bestuur kunnen dienaangaande en over de erkenning van
      vonnissen, bevelen en authentieke akten van andere landen nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de bevoegdheid van een Nederlands-Antilliaans bestuursorgaan tot het nemen van beslissingen in verband
      met de overgang van de eilandgebieden naar de status van openbaar lichaam binnen het Nederlandse staatsbestel is
      overgegaan op een Nederlands bestuursorgaan, worden beslissingen die op grond van die bevoegdheid vóór het tijdstip
      van transitie zijn genomen, gelijkgesteld met beslissingen die zijn genomen door het vanaf het tijdstip van
      transitie bevoegde Nederlandse bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is niet van toepassing op besluiten, houdende vaststelling van een eilandsverordening of
      eilandsbesluit, houdende algemene maatregelen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel6
  - number: '6.3'
    text: |-
      Meldingen en kennisgevingen aan bestuursorganen, die vóór het tijdstip van transitie zijn gedaan ter voldoening
      aan een Nederlands-Antilliaans wettelijk voorschrift, worden, voor zover zodanige melding of kennisgeving ook
      is vereist op grond van een ingevolge [artikel 2, eerste lid][ref1], in de openbare lichamen geldend wettelijk
      voorschrift, gelijkgesteld met een melding of kennisgeving ter voldoening aan dat in de openbare lichamen geldende
      voorschrift


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      Indien tot het nemen van een beschikking vóór het tijdstip van transitie een Nederlands-Antilliaans bestuursorgaan
      bevoegd is en vanaf dat tijdstip een Nederlands bestuursorgaan, wordt
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel6
  - number: 6.4.a
    text: een aanvraag die vóór dat tijdstip is ingediend, behandeld door het vanaf dat tijdstip bevoegde bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel6
  - number: 6.4.b
    text: |-
      de behandeling van een vóór dat tijdstip bij het bestuursorgaan van het eilandgebied onderscheidenlijk een ander
      bestuursorgaan van het land Nederlandse Antillen gemaakt bezwaar of ingesteld beroep, voortgezet door het vanaf dat
      tijdstip bevoegde bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel6
  - number: '6.5'
    text: |-
      Met ingang van het tijdstip van transitie zijn de ambtenaren en werklieden die tot dat tijdstip in dienst waren van
      de onderscheiden eilandgebieden van rechtswege aangesteld als ambtenaar onderscheidenlijk werkman in dienst van de
      onderscheiden openbare lichamen met een rechtspositie die gelijkwaardig is aan die welke voor elk van hen gold bij
      het eilandgebied.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd de [artikelen 215][ref1] en [216 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2],
      worden eilandsverordeningen en eilandsbesluiten, houdende algemene maatregelen, die door de eilandsraad,
      onderscheidenlijk het bestuurscollege van een eilandgebied zijn vastgesteld ten behoeve van een openbaar lichaam,
      met ingang van het tijdstip van transitie aangemerkt als door de eilandsraad onderscheidenlijk het bestuurscollege
      van het desbetreffende openbaar lichaam vastgestelde eilandsverordeningen onderscheidenlijk eilandsbesluiten,
      houdende algemene maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel215
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel216
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '215'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '216'
  - number: '8.1'
    text: |-
      Indien een strafbaar feit vóór het tijdstip van transitie is begaan, worden de strafbepalingen toegepast die gelden
      op het tijdstip van transitie, tenzij de strafbepalingen die golden op het tijdstip waarop het feit is begaan, voor
      de verdachte gunstiger zijn.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bepalingen over strafverzwaring, ingeval van herhaling van strafbare feiten, worden toegepast ook indien de
      vroegere veroordeling wegens een soortgelijk feit of de vrijwillige betaling van de geldboete vóór het tijdstip van
      transitie heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien voor het tijdstip van transitie in een strafzaak een dagvaarding in eerste aanleg is uitgebracht, wordt het
      strafprocesrecht toegepast dat gold op het tijdstip van het uitbrengen van die dagvaarding.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien voor het tijdstip van transitie strafrechtelijk onderzoek heeft plaatsgevonden en vóór het tijdstip van
      transitie geen dagvaarding in eerste aanleg is uitgebracht, wordt dit onderzoek geacht te hebben plaatsgevonden op
      basis van het strafprocesrecht dat geldt op het tijdstip van transitie.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel9
  - number: '10'
    text: |-
      Op vragen van overgangsrecht waartoe, als gevolg van invoering van deze wet en de
      [Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], de aanpassing
      van wetgeving van Nederlands-Antilliaanse oorsprong op het terrein van het privaatrecht
      aanleiding geeft, zijn de [Overgangswet nieuw Burgerlijk Wetboek BES][ref2] en de
      [Overgangswet nieuw Burgerlijk Wetboek BES, tweede gedeelte][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028129
      [ref2]: https://wetten.overheid.nl/BWBR0028466
      [ref3]: https://wetten.overheid.nl/BWBR0028301
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028129
      - id: ref2
        bwb_id: BWBR0028466
      - id: ref3
        bwb_id: BWBR0028301
  - number: '11.1'
    text: |-
      Ten aanzien van rechten en verplichtingen naar burgerlijk recht van de eilandgebieden treden de openbare lichamen
      op het tijdstip van transitie voor de eilandgebieden in de plaats.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel11
  - number: '11.2'
    text: |-
      Wettelijke procedures en rechtsgedingen waarbij een eilandgebied betrokken was, worden met ingang van het tijdstip
      van transitie voortgezet door of tegen het desbetreffende openbaar lichaam, voor zover dat openbaar lichaam
      op grond van het eerste lid in de plaats treedt voor dat eilandgebied. Ten aanzien van de rechtsgedingen is
      de [elfde afdeling van titel 2 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Afdeling11
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028496
        afdeling: '11'
  - number: '12'
    text: |-
      Op de dag voor het tijdstip van transitie bestaande rechten, gebaseerd op wettelijke regelingen die op het
      tijdstip van transitie hun rechtskracht verliezen, kunnen daarna geldend worden gemaakt, indien de redelijkheid en
      billijkheid dit vorderen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel12
  - number: '13'
    text: |-
      Indien in regelingen als bedoeld in [artikel 2, eerste lid][ref1], sprake is van een bevoegdheid tot
      het vaststellen van een eilandsbesluit, houdende algemene maatregelen, komt deze bevoegdheid toe aan de
      bestuurscolleges van de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      De bepalingen die voorkomen op de bij de [Coördinatiewet uitzonderingstoestanden behorende lijst A][ref1] zijn van
      overeenkomstige toepassing in de openbare lichamen, voor zover deze bepalingen niet reeds van toepassing zijn in de
      openbare lichamen, met dien verstande dat telkens in die bepalingen wordt gelezen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0007981
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007981
  - number: 14.a
    text: '«burgemeester»: gezaghebber;'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel14
  - number: 14.b
    text: |-
      «Onze Commissaris van de Koning», «Onze Commissaris in de provincie» en «Onze commissaris in de provincie»: de
      Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel14
  - number: '15.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2], kunnen, indien buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, bepalingen die
      voorkomen op de bij de [Coördinatiewet uitzonderingstoestanden behorende lijst A][ref3] voor de openbare lichamen
      gezamenlijk of ieder afzonderlijk in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007981
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007981
  - number: '15.2'
    text: |-
      Indien een koninklijk besluit als bedoeld in het eerste lid is vastgesteld, wordt onverwijld een voorstel van
      wet aan de Tweede Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel15
  - number: '15.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel15
  - number: '15.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel15
  - number: '15.5'
    text: |-
      Een koninklijk besluit als bedoeld in het eerste, tweede en vierde lid, wordt op de daarin te bepalen wijze
      bekendgemaakt. Het treedt in werking terstond na de bekendmaking. Het besluit wordt in ieder geval geplaatst in
      het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel15
  - number: '16'
    text: |-
      Indien in een koninklijk besluit als bedoeld in [artikel 15][ref1] voor de openbare lichamen gezamenlijk of ieder
      afzonderlijk één of meerdere bepalingen in werking worden gesteld, kunnen hiermee samenhangende in een koninklijk
      besluit aan te wijzen bepalingen bij dat besluit van overeenkomstige toepassing worden verklaard in de openbare
      lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel15
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '15'
        hoofdstuk: '5'
  - number: '17'
    text: |-
      Onze Minister wie het aangaat kan aan de gezaghebber of de Rijksvertegenwoordiger voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba mandaat verlenen tot het uitoefenen in de openbare lichamen van de bevoegdheden die
      zijn opgenomen in op grond van [artikel 15][ref1] in werking gestelde artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel15
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '15'
        hoofdstuk: '5'
  - number: 18.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent jeugdzorg in de openbare
      lichamen, met inbegrip van de toegang, het aanbod, de bekostiging en een bijdrage in de kosten van de jeugdzorg.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.1
  - number: 18.1.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt gedaan door
      Onze Minister voor Jeugd en Gezin.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.1
  - number: 18.2.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het voorkomen en bestrijden van
      een besmettelijke dierziekte.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.1
  - number: 18.2.1.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.1
  - number: 18.2.1.2.a
    text: het melden van een verdenking van of een besmetting met een besmettelijke dierziekte;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.1
  - number: 18.2.1.2.b
    text: een verplichting tot het laten doen of het dulden van onderzoek;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.1
  - number: 18.2.1.2.c
    text: een verplichting tot het behandelen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.1
  - number: 18.2.1.2.d
    text: een verbod op het vervoeren en verplaatsen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.1
  - number: 18.2.1.2.e
    text: |-
      een verplichting tot het doden van dieren of het onschadelijk maken van producten van dierlijke oorsprong, alsmede
      van andere producten en voorwerpen die dragers van smetstof kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.1
  - number: 18.2.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het invoeren en doorvoeren van
      dieren, producten van dierlijke oorsprong, alsmede van andere producten en voorwerpen die dragers van smetstof
      kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2.a
    text: een verbod op het invoeren of doorvoeren van de in het eerste lid bedoelde dieren, producten of voorwerpen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2.b
    text: de eisen waaraan de in het eerste lid bedoelde dieren, producten of voorwerpen aan moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2.c
    text: de afkomst van de in het eerste lid bedoelde dieren, producten of voorwerpen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2.d
    text: |-
      het aanmelden van het voornemen en de toestemming om de in het eerste lid bedoelde dieren, producten of voorwerpen
      in te voeren.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2.e
    text: de documenten die de in het eerste lid bedoelde dieren, producten of voorwerpen vergezellen of worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2.f
    text: de omtrent de in het eerste lid bedoelde dieren, producten of voorwerpen bij te houden en over te leggen gegevens;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.2.2.g
    text: |-
      de bij de in het eerste lid bedoelde dieren, producten of voorwerpen te verrichten onderzoeken en controles of het
      plaatsen in tijdelijke afzondering.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.2
  - number: 18.2.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de identificatie en registratie
      van dieren behorende tot bij die maatregel aangewezen diersoorten of diercategorieën.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.a
    text: de verplichting tot identificatie;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.b
    text: de hoedanigheid van de identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.c
    text: de gegevens die in of op de identificatiemiddelen worden vermeld of vastgelegd;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.d
    text: het moment van aanbrengen van identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.e
    text: de wijze waarop en het document waarin gegevens met betrekking tot de identificatie van dieren worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.f
    text: de plaats waar en wijze waarop de dieren worden gehouden;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.g
    text: de wijze waarop wordt omgegaan met ongemerkte dieren;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.3.2.h
    text: het heffen van een vergoeding van kosten.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.3
  - number: 18.2.4.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het doden van dieren en de
      productie van vlees na het slachten van dieren.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.a
    text: het aanmelden van het voornemen en de toestemming om dieren te slachten;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.b
    text: de wijze waarop dieren worden geslacht;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.c
    text: de situaties waarin dieren kunnen worden geslacht;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.d
    text: de plaats waar dieren worden geslacht en verwerkt en de toegang tot deze plaats;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.e
    text: |-
      de inrichting, uitvoering en vormgeving van ruimten waar dieren worden geslacht en verwerkt, waaronder de aanwezige
      voorzieningen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.f
    text: de personen die vlees bewerken, of daarbij betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.g
    text: voorwaarden waaronder vlees geschikt is voor menselijke consumptie;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.h
    text: de keuring van dieren;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.i
    text: het merken van dieren;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.j
    text: de inbeslagname of vernietiging van dode dieren of delen daarvan;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.k
    text: de opslag en het vervoer van vlees;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.l
    text: het bewerken en verwerken van vlees;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.m
    text: de verpakking en de verkoop van vlees;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4.2.n
    text: het bijhouden en overleggen van gegevens.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4
  - number: 18.2.4a
    text: |-
      Voor de toepassing van de [artikelen 18.2.4b][ref1], [18.2.4c][ref2], [18.2.4d][ref3] en [18.2.4e][ref4] wordt
      verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.4a.a
    text: '*«directeur»:* directeur van de Plantenziektenkundige Dienst alsmede de ambtenaar die hem vervangt;'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4a.b
    text: |-
      *«schadelijke organismen»:* voor planten of plantaardige producten schadelijke organismen van dierlijke of
      plantaardige aard, alsmede virussen, mycoplasma’s, viroïden, rickettsia’s of andere ziekteverwekkers;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4a.c
    text: '*«planten»:* levende planten en levende delen van planten, met inbegrip van verse vruchten en zaden;'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4a.d
    text: |-
      *«plantaardige producten»:* voortbrengselen van plantaardige oorsprong die niet verwerkt zijn of die slechts een
      eenvoudige bewerking hebben ondergaan, voor zover het geen planten betreft;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4a.e
    text: |-
      *«verhandelen»:* verkopen, te koop aanbieden of afleveren alsmede met het oog daarop voorhanden of in voorraad
      hebben;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4a.f
    text: '*«invoeren»:* brengen binnen de eilandgebieden;'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4a.g
    text: '*«uitvoeren»:* brengen buiten de eilandgebieden;'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4a.h
    text: '*«telen»:* brengen of houden van planten in grond of in een ander cultuurmedium.'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4a
  - number: 18.2.4b.1
    text: |-
      Ter voorkoming van het optreden en van de verbreiding van schadelijke organismen, kan Onze Minister de in- en
      uitvoer van schadelijke organismen, van planten of plantaardige producten, van grond of andere cultuurmedia en van
      voor planten of plantaardige producten gebruikt verpakkingsmateriaal verbieden of regels stellen waaraan voor, bij
      of na de invoer, onderscheidenlijk voor of bij de uitvoer moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2
    text: 'De in het eerste lid bedoelde regels kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2.a
    text: de eisen waaraan de aldaar genoemde zaken moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2.b
    text: het aanmelden van het voornemen tot invoer, onderscheidenlijk uitvoer;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2.c
    text: het te verrichten onderzoek;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2.d
    text: het in tijdelijke afzondering houden;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2.e
    text: de plaats van bestemming en het gebruiksdoel;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2.f
    text: |-
      het vervoer naar de plaats waar het onderzoek of de tijdelijke afzondering zal geschieden, naar de plaats van
      bestemming, dan wel naar de plaats van weder uitvoer;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.2.g
    text: |-
      de reiniging en ontsmetting van ruimten waarin ingevoerde zaken, genoemd in het eerste lid, zijn opgeslagen
      geweest, van transportmiddelen waarmee die zaken zijn vervoerd of verplaatst en van voorwerpen die bij de opslag,
      het vervoer of de verplaatsing zijn gebruikt.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.3
    text: |-
      De directeur is bevoegd, ter voorkoming van het optreden en van de verbreiding van schadelijke organismen,
      de in- en uitvoer van een zending, geheel of ten dele bestaande uit schadelijke organismen, planten,
      plantaardige producten, grond of andere cultuurmedia, of uit voor planten of plantaardige producten gebruikt
      verpakkingsmateriaal, te verbieden of voorschriften te geven waaraan voor, bij of na de invoer, onderscheidenlijk
      voor of bij de uitvoer van die zending moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4b.4
    text: |-
      Een ieder wie zulks aangaat is verplicht planten, plantaardige producten, grond of andere cultuurmedia en
      schadelijke organismen, die op grond van het krachtens de voorgaande leden bepaalde niet hadden mogen worden
      ingevoerd, overeenkomstig een hem door de directeur gegeven bevel binnen de daarin gestelde termijn uit te voeren
      dan wel te behandelen of te vernietigen en zo nodig daartoe op de in het bevel aangegeven wijze naar een daarin
      bepaalde plaats te brengen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4b
  - number: 18.2.4c.1
    text: |-
      Ter voorkoming van het optreden en van de verbreiding van schadelijke organismen en ter bestrijding daarvan kunnen
      door Onze Minister regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.1.a
    text: |-
      het telen, oogsten en rooien van planten, het geven van een bepaalde bestemming aan planten of plantaardige
      producten en het kenmerken, onder verzegeling brengen, bewaren, voorhanden of in voorraad hebben, verhandelen,
      verplaatsen, vervoeren, bewerken, behandelen en vernietigen of anderszins onschadelijk maken van planten
      en plantaardige producten, daarvoor gebruikt verpakkingsmateriaal, schadelijke organismen, grond of andere
      cultuurmedia en resten daarvan en afval van planten en plantaardige producten;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.1.b
    text: |-
      het reinigen en ontsmetten van ruimten, installaties, transportmiddelen, werktuigen en gereedschappen en het
      reinigen, ontsmetten of zo nodig vernietigen van gebruikte materialen en andere voorwerpen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.1.c
    text: het toepassen van ontsmettingsmaatregelen door personen bij het betreden of verlaten van ruimten of terreinen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.1.d
    text: het treffen van voorzieningen in of aan ruimten;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.1.e
    text: voor de teelt van planten te gebruiken of gebruikt water;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.1.f
    text: het melden van verschijnselen van aantasting van planten of plantaardige producten door schadelijke organismen, of
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.1.g
    text: |-
      andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van besluiten van volkenrechtelijke
      organisaties zulks met zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4c.2
    text: |-
      Indien een onmiddellijke voorziening geboden is, is Onze Minister bevoegd om, voor een termijn van ten hoogste
      vier maanden, ten aanzien van individuele gevallen voorschriften te geven betreffende hetgeen in het eerste lid
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4c
  - number: 18.2.4d
    text: |-
      Onze Minister is bevoegd in gevallen waarin de schade, welke het gevolg is van het toepassen van krachtens artikel
      18.3.4c gegeven voorschriften, onevenredig zwaar op een of meer personen zou drukken, uit ’s Rijks schatkist een
      tegemoetkoming te verlenen in de geleden schade.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4d
  - number: 18.2.4e
    text: |-
      Onze Minister kan, wanneer de toepassing van [18.2.4c][ref1] tot onbillijkheden aanleiding zou geven door of
      vanwege de directeur op ’s Rijks kosten bepaalde maatregelen tot wering en bestrijding van schadelijke organismen
      doen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.4e
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.5.1
    text: |-
      De voordracht voor een krachtens de [artikelen 18.2.1 tot en met 18.2.4][ref1] vast te stellen algemene maatregel
      van bestuur wordt gedaan door Onze Minister van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.5.2
    text: |-
      Voor de toepassing van de artikelen in deze paragraaf wordt onder Onze Minister verstaan: Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.5
  - number: 18.2.6.1
    text: |-
      Onze Minister kan, voor zover het belang van de gezondheid van de mens, dieren of planten, het belang van het
      welzijn van dieren of het belang van het milieu zich daartegen niet verzetten, van het bepaalde krachtens deze wet
      vrijstelling of ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.6
  - number: 18.2.6.2
    text: |-
      Aan een vrijstelling en een ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.6
  - number: 18.2.7.1
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens de [artikelen 18.2.1][ref1], [18.2.2][ref2] en
      [18.2.3][ref3], zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.7
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.7.2
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens de [artikelen 18.2.1][ref1], [18.2.2][ref2] en
      [18.2.3][ref3], worden gestraft met een hechtenis van ten hoogste een maand of een geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.7
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.8.1
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens [artikel 18.2.4][ref1] zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.8
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.8.2
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens [artikel 18.2.4][ref1], worden gestraft met een
      hechtenis van ten hoogste twee maanden of een geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.8
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.9.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze paragraaf zijn belast de bij besluit van
      Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.9
  - number: 18.2.9.2
    text: |-
      Onze Minister wijst ambtenaren aan die zijn belast met onderzoek naar de aanwezigheid van besmettelijke
      dierziekten.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.9
  - number: 18.2.9.3
    text: |-
      Met de opsporing van de bij de [artikelen 18.2.7][ref1] en [18.2.8][ref2], strafbaar gestelde feiten zijn,
      onverminderd [artikel 184 Wetboek van Strafvordering BES][ref3], belast de daartoe aangewezen buitengewone
      opsporingsambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.9
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 18.2.9.4
    text: Van een besluit als bedoeld in dit artikel wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.9
  - number: 18.2.10.1
    text: |-
      Toezichthouders zijn, uitsluitend voor zover dat voor de vervulling van hun taak redelijkerwijze noodzakelijk is,
      bevoegd:
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10.1.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10.1.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10.1.c
    text: |-
      goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10.1.d
    text: |-
      alle plaatsen met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner te betreden,
      eventueel vergezeld van door hen aangewezen personen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10.1.e
    text: vaartuigen, stilstaande voertuigen en de lading daarvan te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10.2
    text: |-
      Zo nodig wordt de toegang tot een plaats als bedoeld in het eerste lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10.3
    text: |-
      Een ieder is verplicht aan de toezichthouder alle medewerking te verlenen die op grond van het tweede lid wordt
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10
  - number: 18.2.10a.1
    text: |-
      Onze Minister kan bepalen dat vergoeding van kosten wordt geheven volgens een door Onze Minister vastgesteld tarief
      voor in het kader van de haar opgedragen taak door de bij of krachtens [artikel 18.2.9][ref1] aangewezen ambtenaren
      gedane onderzoekingen of verrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10a
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 18.2.10a.2
    text: |-
      Onze Minister kan regelen stellen met betrekking tot het heffen en betalen van de vergoeding. Daarbij kan worden
      bepaald dat de vergoeding wordt geheven door de instelling die de onderzoekingen of verrichtingen uitvoert.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.10a
  - number: 18.2.11
    text: |-
      De [artikelen 12 tot en met 35 van de Wet voorschriften bestrijdingsmiddelen BES][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028176#Artikel12
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.2.11
    references:
      - id: ref1
        bwb_id: BWBR0028176
        artikel: '12'
  - number: 18.3.1
    text: |-
      Personen die rechtmatig woonachtig zijn in de openbare lichamen en die niet kunnen voorzien in de noodzakelijke
      kosten van het bestaan hebben onder bij algemene maatregel van bestuur op voordracht van Onze Minister van Sociale
      Zaken en Werkgelegenheid te stellen voorwaarden recht op onderstand van overheidswege.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.2
    text: Het recht op onderstand bestaat jegens Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.3
    text: |-
      De onderstand en de daaraan te verbinden verplichtingen worden afgestemd op de omstandigheden, mogelijkheden en
      middelen van de belanghebbende, alsmede op het betoonde besef van verantwoordelijkheid voor de voorziening in het
      bestaan, rekening houdend met het niveau van de noodzakelijke kosten van het bestaan ter plaatse.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Sociale Zaken en
      Werkgelegenheid kunnen regels worden gesteld met betrekking tot het derde lid.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen op voordracht van Onze Minister van Sociale Zaken en
      Werkgelegenheid regels worden gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.5.a
    text: |-
      het door derden verstrekken van gegevens die noodzakelijk zijn voor de uitvoering van dit artikel en de krachtens
      het vierde lid gestelde regels;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.5.b
    text: |-
      het door Onze Minister van Sociale Zaken en Werkgelegenheid aan derden verstrekken van gegevens waarover hij
      beschikt uit hoofde van de uitvoering van dit artikel en de krachtens het vierde lid gestelde regels;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.5.c
    text: |-
      het verwerken van persoonsgegevens bij de uitvoering van dit artikel en de krachtens het vierde lid gestelde
      regels;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.5.d
    text: |-
      het van toepassing worden van onderdelen van de [Algemene wet bestuursrecht][ref1] bij de uitvoering van dit
      artikel en de krachtens het vierde lid gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 18.3.6
    text: |-
      Een besluit van Onze Minister van Sociale Zaken en Werkgelegenheid tot terugvordering
      van kosten van onderstand levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: 18.3.7
    text: |-
      Terugvordering van kosten van onderstand door Onze Minister van Sociale Zaken en Werkgelegenheid is bevoorrecht en
      volgt onmiddellijk na de vorderingen, bedoeld in [artikel 288 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel288
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '288'
  - number: 18.3.8
    text: |-
      De eilandbesturen van de openbare lichamen kunnen Onze Minister van Sociale Zaken en Werkgelegenheid voorstellen
      doen betreffende het beleid met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.3.9
    text: |-
      Het ontwerp van een krachtens het eerste, vierde of vijfde lid vast te stellen algemene maatregel van bestuur wordt
      aan de beide kamers der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van
      bestuur kan worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of
      namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens
      te kennen worden gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat
      geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.3
  - number: 18.4.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld op grond waarvan bij die maatregel aan te
      wijzen personen op de openbare lichamen tegen een daarbij te bepalen premie van rechtswege verzekerd zijn tegen de
      behoefte aan bij of krachtens die maatregel te bepalen zorg.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.1
  - number: 18.4.1.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt gedaan door
      Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.1
  - number: 18.4.1.3
    text: |-
      Ter zake van de kosten verbonden aan de geneeskundige verzorging als bedoeld in voornoemde algemene maatregel van
      bestuur is de werkgever een premie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.1
  - number: 18.4.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden op voordracht van Onze Minister van Volksgezondheid,
      Welzijn en Sport regels gesteld betreffende het verwerken van gegevens over iemands gezondheid ten behoeve van de
      verzekeringsadministratie en het heffen van premies.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.1
  - number: 18.4.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de verrekening van aanspraken
      krachtens dit artikel bij de vaststelling van schadevergoeding, waarop de verzekerde naar burgerlijk recht
      aanspraak kan maken ter zake van een feit, dat aanleiding geeft tot het verlenen van zorg, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.1
  - number: 18.4.1.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan bepaald worden dat Onze Minister recht heeft op verhaal van
      kosten die zijn veroorzaakt door degene die in verband met het in lid 5 bedoelde feit jegens de verzekerde naar
      burgerlijk recht tot schadevergoeding is verplicht, overeenkomstig daarbij te stellen regels.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.1
  - number: 18.4.2.1
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.2
  - number: 18.4.2.1.a
    text: |-
      het vervaardigen, invoeren, voorhanden hebben, afleveren en toepassen van medische hulpmiddelen in de openbare
      lichamen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.2
  - number: 18.4.2.1.b
    text: |-
      het aanwijzen van diensten of instellingen die in de openbare lichamen belast zijn met het goedkeuren van medische
      hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.2
  - number: 18.4.2.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt gedaan door
      Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.2
  - number: 18.4.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het in rekening brengen door
      zorgaanbieders van tarieven voor door die zorgaanbieders geleverde zorg. Tot die regels kan onder meer behoren
      het verbod om een tarief in rekening te brengen dat niet op een bij de maatregel omschreven wijze is vastgesteld,
      alsmede het toezicht op de naleving van de gestelde tariefsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.3.2
    text: 'Voor de toepassing van het eerste lid wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.3.2.a
    text: 'zorg:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.3.2.a.1°
    text: zorg of dienst als omschreven bij of krachtens het Besluit zorgverzekering BES;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.3.2.a.2°
    text: |-
      handelingen op het gebied van de gezondheidszorg als bedoeld in
      [artikel 1, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1], voor zover uitgevoerd,
      al dan niet onder eigen verantwoordelijkheid, door personen, ingeschreven in een register als bedoeld in
      [artikel 3 van die wet][ref2] of door personen als bedoeld in [artikel 34 van die wet][ref3] en voor zover die
      handelingen niet zijn begrepen onder 1°;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '34'
  - number: 18.4.3.2.b
    text: 'zorgaanbieder:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.3.2.b.1°
    text: de natuurlijke persoon of rechtspersoon die beroeps- of bedrijfsmatig zorg verleent;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.3.2.b.2°
    text: |-
      de natuurlijke persoon of rechtspersoon voor zover deze tarieven in rekening brengt namens, ten behoeve van of in
      verband met het verlenen van zorg door een zorgaanbieder als bedoeld onder 1°.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.3.3
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt gedaan door
      Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.3
  - number: 18.4.4.1
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.4
  - number: 18.4.4.1.a
    text: |-
      de opleidingseisen die gelden voor de uitoefening van beroepen in de individuele gezondheidszorg in de openbare
      lichamen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.4
  - number: 18.4.4.1.b
    text: het aan de bedoelde beroepen verbonden deskundigheidsgebied; en
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.4
  - number: 18.4.4.1.c
    text: de aan de bedoelde beroepen verbonden bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.4
  - number: 18.4.4.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt gedaan door
      Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.4
  - number: 18.4.5.1
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.1.a
    text: het bevorderen van de sociale samenhang in en leefbaarheid van dorpen, wijken en buurten;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.1.b
    text: |-
      op preventie gerichte ondersteuning van jeugdigen met problemen met opgroeien en van ouders met problemen met
      opvoeden;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.1.c
    text: het geven van informatie, advies en cliëntondersteuning;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.1.d
    text: |-
      het bevorderen van het zelfstandig functioneren van mensen met een beperking of een chronisch psychisch probleem
      en aan mensen met een psychosociaal probleem ten behoeve van het behouden en het bevorderen van hun zelfstandig
      functioneren;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.1.e
    text: |-
      het bieden van maatschappelijke opvang en vrouwenopvang en het voeren van beleid ter bestrijding van geweld dat
      door iemand uit de huiselijke kring van het slachtoffer is gepleegd;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.1.f
    text: |-
      het bevorderen van openbare geestelijke gezondheidszorg met uitzondering van het bieden van psychosociale hulp
      bij rampen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.2
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen regels worden gesteld met
      betrekking tot een eigen bijdrage voor de verleende ondersteuning, voor zover die bestaat uit het verlenen van een
      individuele voorziening in natura of een persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.5.3
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt gedaan door
      Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.5
  - number: 18.4.6.1
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de publieke gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.6
  - number: 18.4.6.2
    text: |-
      Onder publieke gezondheidszorg wordt verstaan: de gezondheidsbeschermende en gezondheidsbevorderende maatregelen
      voor de bevolking of specifieke groepen daaruit, waaronder begrepen het voorkómen en het vroegtijdig opsporen van
      ziekten.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.6
  - number: 18.4.7
    text: |-
      Ter zake van de infectieziektebestrijding kunnen bij of krachtens algemene maatregel van bestuur regels worden
      gesteld over:
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.7
  - number: 18.4.7.a
    text: de bestuurlijke en operationele organisatie van de bestrijding;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.7
  - number: 18.4.7.b
    text: de melding van infectieziekten;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.7
  - number: 18.4.7.c
    text: |-
      de maatregelen gericht op gebouwen, goederen en vervoermiddelen, waaronder ontsmettingsmaatregelen, het sluiten van
      gebouwen of terreinen en het verbieden tot het gebruik maken of betreden van vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.7
  - number: 18.4.7.d
    text: het opleggen van een verbod om beroeps- of bedrijfsmatig werkzaamheden te verrichten;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.7
  - number: 18.4.7.e
    text: |-
      de maatregelen met betrekking tot toelating tot of de onttrekking aan het vrije verkeer van personen en goederen in
      havens en luchthavens;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.7
  - number: 18.4.7.f
    text: het onderwerpen van personen aan de maatregelen van isolatie en quarantaine;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.7
  - number: 18.4.8
    text: |-
      De voordracht voor een krachtens de [artikelen 18.4.6][ref1] en [18.4.7][ref2] vast te stellen algemene maatregel
      van bestuur wordt gedaan door Onze Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.8
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 18.4.9.1
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens [artikel 18.4.7, onder b][ref1], worden bestraft met
      een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.9
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 18.4.9.2
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens [artikel 18.4.7, onder c en d][ref1], worden bestraft
      met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.9
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 18.4.9.3
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens [artikel 18.4.7, onder b, c en d][ref1], zijn
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.9
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 18.4.10.1
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens [artikel 18.4.7, onder e en f][ref1], worden bestraft
      met een gevangenisstraf van vier jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.10
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 18.4.10.2
    text: |-
      Gedragingen in strijd met de voorschriften, gesteld krachtens [artikel 18.4.7, onder e en f][ref1], zijn
      misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.10
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 18.4.11
    text: |-
      De [afdelingen 5.3][ref1] en [5.4 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.4
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '5.4'
  - number: 18.4.12.1
    text: |-
      Met het toezicht op de naleving van de krachtens de [artikelen 18.4.6][ref1] en [18.4.7][ref2] gestelde regels zijn
      belast de ambtenaren van het Staatstoezicht op de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.12
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 18.4.12.2
    text: |-
      Artikel 16.3.10 en de [artikelen 155 tot en met 163 van het Wetboek van Strafvordering BES][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.12
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
  - number: 18.4.13
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport wordt een rechtspersoon aangewezen die tot
      taak heeft laboratoriumonderzoeken te verrichten op het terrein van volksgezondheid en justitie en worden regels
      gesteld over welke instanties met een publiekrechtelijke taak een beroep op deze rechtspersoon kunnen doen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.13
  - number: 18.4.14
    text: |-
      Het ontwerp van een krachtens de [artikelen 18.4.1, eerste lid][ref1], [18.4.3, eerste lid][ref2],
      [18.4.5, eerste lid][ref3], of [18.4.6, eerste lid][ref4], vast te stellen algemene maatregel van bestuur wordt
      aan de beide kamers der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van
      bestuur kan worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of
      namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens
      te kennen worden gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat
      geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028063#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel18.4.14
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0028063
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '19.1'
    text: |-
      De bijlage kan worden gewijzigd bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in
      overeenstemming met Onze Ministers wie het mede aangaat, die in werking treedt op dezelfde dag waarop deze wet in
      werking treedt, met dien verstande dat toevoeging aan of verwijdering uit de bijlage van regelingen die de status
      van wet of algemene maatregel van bestuur verkrijgen of zouden verkrijgen slechts geschiedt, indien het ontbreken
      of vóórkomen van die regelingen in de bijlage zal leiden tot onaanvaardbare gevolgen.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, worden de doorlopende teksten vastgesteld van de
      regelingen die worden toegevoegd aan de bijlage.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel19
  - number: '20.1'
    text: |-
      Regelingen als bedoeld in [artikel 2, eerste lid][ref1], die de status van wet hebben verkregen, kunnen tot een
      jaar na het tijdstip van transitie bij regeling van Onze Minister wie het aangaat worden gewijzigd voor zover dit
      noodzakelijk is voor de toepassing van die regelingen of ter voorkoming van onaanvaardbare gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
        hoofdstuk: '2'
  - number: '20.2'
    text: |-
      Regelingen als bedoeld in [artikel 2, eerste lid][ref1], die de status van algemene maatregel van bestuur hebben
      verkregen, kunnen tot een jaar na het tijdstip van transitie bij regeling van Onze Minister wie het aangaat worden
      gewijzigd voor zover dit noodzakelijk is voor de toepassing van die regelingen of ter voorkoming van onaanvaardbare
      gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
        hoofdstuk: '2'
  - number: '20.3'
    text: |-
      Wijzigingen van regelingen die ingevolge [artikel 19][ref1] uit de bijlage zijn verwijderd, vervallen op het
      tijdstip van transitie van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel19
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '19'
        hoofdstuk: '7'
  - number: '20.4'
    text: |-
      Bij regeling van Onze Minister wie het aangaat kunnen wetten tot een jaar na het tijdstip van transitie worden
      gewijzigd voor zover dit noodzakelijk is in verband met de verwijdering uit of toevoeging aan de bijlage van
      regelingen op grond van [artikel 19][ref1] of in verband met wijziging van regelingen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel19
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '19'
        hoofdstuk: '7'
  - number: '20.5'
    text: |-
      Bij regeling van Onze Minister wie het aangaat kunnen algemene maatregelen van bestuur tot een jaar na het tijdstip
      van transitie worden gewijzigd voor zover dit noodzakelijk is in verband met de verwijdering uit of toevoeging aan
      de bijlage van regelingen op grond van [artikel 19][ref1] of in verband met wijziging van regelingen op grond van
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel19
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '19'
        hoofdstuk: '7'
  - number: '21.1'
    text: |-
      Na de inwerkingtreding van een krachtens [artikel 19][ref1] of [artikel 20, eerste of vierde lid][ref2],
      vastgestelde ministeriële regeling wordt zo spoedig mogelijk een voorstel van wet tot goedkeuring van de
      ministeriële regeling bij de Staten-Generaal ingediend. Indien het voorstel wordt ingetrokken of indien een
      van de Kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de wijziging van de bijlage
      onderscheidenlijk van de betreffende regeling onverwijld bij ministeriële regeling ongedaan gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel20
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '19'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0028063
        artikel: '20'
        hoofdstuk: '7'
  - number: '21.2'
    text: |-
      Na de inwerkingtreding van een krachtens [artikel 20, tweede of vijfde lid][ref1], vastgestelde ministeriële
      regeling wordt zo spoedig mogelijk een algemene maatregel van bestuur tot goedkeuring van de ministeriële regeling
      vastgesteld. Indien een zodanige algemene maatregel van bestuur niet wordt vastgesteld, wordt de wijziging van de
      betreffende regeling onverwijld bij ministeriële regeling ongedaan gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel20
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '20'
        hoofdstuk: '7'
  - number: '22.1'
    text: |-
      Bij regeling van Onze Minister wie het aangaat kunnen tot een jaar na het tijdstip van transitie met het oog
      op een goede invoering van de in [artikel 2, eerste lid][ref1], bedoelde regelingen, die de status van wet of
      algemene maatregel van bestuur hebben verkregen, of ter voorkoming van onaanvaardbare gevolgen voorzieningen worden
      getroffen, waarbij zo nodig kan worden afgeweken van de desbetreffende wet of algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
        hoofdstuk: '2'
  - number: '22.2'
    text: |-
      Indien een voorziening die bij ministeriële regeling is getroffen een structurele afwijking van de wet betreft,
      wordt zo spoedig mogelijk een wetsvoorstel ingediend dat ertoe strekt de wet zodanig te wijzigen dat de voorziening
      bij ministeriële regeling niet langer noodzakelijk is. Indien een voorziening die bij ministeriële regeling is
      getroffen een structurele afwijking van een algemene maatregel van bestuur betreft, wordt zo spoedig mogelijk een
      ontwerpbesluit in procedure gebracht die ertoe strekt de algemene maatregel van bestuur zodanig te wijzigen dat de
      voorziening bij ministeriële regeling niet langer noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22
  - number: 22a.1
    text: Dit artikel is van toepassing indien het tijdstip van transitie niet valt op 1 januari van enig kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: 22a.2
    text: |-
      Bij regeling van Onze Minister wie het aangaat kunnen aanvullende regels van overgangsrechtelijke aard worden
      gesteld die uitsluitend zien op de periode van het tijdstip van transitie tot 1 januari van het daarop volgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: 22a.3
    text: 'De regels, bedoeld in het tweede lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: 22a.3.a
    text: |-
      dat een Nederlands-Antilliaanse regeling die niet op de bijlage is vermeld als wet, algemene maatregel van bestuur
      of ministeriële regeling op de openbare lichamen van toepassing wordt verklaard;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: 22a.3.b
    text: |-
      wijzigingen van een onder a. bedoelde regeling met het oog op de goede werking van deze regeling binnen het
      Nederlandse staatsbestel;
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: 22a.3.c
    text: |-
      afwijkingen van een regeling die op de bijlage staat vermeld met het oog op de goede werking van deze regeling
      binnen het Nederlandse staatsbestel.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: 22a.4
    text: |-
      Bij de ministeriële regeling, bedoeld in het tweede lid, kan zo nodig worden afgeweken van de wet of algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: 22a.5
    text: |-
      Indien op grond van het derde lid, onder a, bij ministeriële regeling een Nederlands-Antilliaanse regeling als wet,
      algemene maatregel van bestuur of ministeriële regeling van toepassing wordt verklaard, wordt de doorlopende tekst
      van die Nederlands-Antilliaanse regeling als bijlage aan deze ministeriële regeling gevoegd.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel22a
  - number: '23'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan en voor de verschillende in de bijlage genoemde regelingen
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel23
  - number: '24.1'
    text: |-
      De teksten van de in de bijlage genoemde regelingen, zoals deze op het tijdstip van transitie bij wet of algemene
      maatregel van bestuur worden gewijzigd, worden in het Staatsblad geplaatst voor zover zij de status hebben van wet
      onderscheidenlijk algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel24
  - number: '24.2'
    text: |-
      De teksten van de in de bijlage genoemde regelingen, zoals deze op het tijdstip van transitie worden gewijzigd,
      worden in de Staatscourant geplaatst voor zover zij de status hebben van ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0028063/2011-01-01#Artikel25
