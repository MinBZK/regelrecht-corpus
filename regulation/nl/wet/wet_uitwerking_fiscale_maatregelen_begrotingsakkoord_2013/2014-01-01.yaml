  - number: XIX.1
    text: |-
      De omzetbelasting die na 30 september 2012 verschuldigd wordt ter zake van leveringen en diensten ter zake waarvan
      ingevolge [artikel VIII, onderdelen A en B][ref1], het tarief met ingang van 1 oktober 2012 wordt verhoogd en die
      zijn verricht vóór of op de eerstgenoemde datum, wordt berekend naar het tarief dat geldt op het tijdstip waarop de
      levering of de dienst wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0031798#ArtikelVIII
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0031798
        artikel: VIII
  - number: XIX.2
    text: |-
      Ingeval omzetbelasting vóór 1 oktober 2012 verschuldigd is ter zake van leveringen en diensten ter zake waarvan
      ingevolge [artikel VIII, onderdelen A en B][ref1], het tarief met ingang van 1 oktober 2012 wordt verhoogd en
      die worden verricht op of na deze datum, wordt hetgeen meer verschuldigd zou zijn geweest indien de belasting zou
      zijn berekend naar het tarief dat geldt op het tijdstip waarop de levering of de dienst wordt verricht, alsnog
      verschuldigd op 1 oktober 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0031798#ArtikelVIII
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0031798
        artikel: VIII
  - number: XIX.3
    text: |-
      Ingeval een ondernemer ingevolge een vóór 1 oktober 2012 gesloten overeenkomst na 30 september 2012 een onroerende
      zaak levert of een werk in onroerende staat oplevert tegen een vergoeding welke vervalt in termijnen, blijft
      ten aanzien van het gedeelte van de vergoeding dat gelijk is aan de som van de termijnen die op grond van die
      overeenkomst vóór 1 oktober 2012 zijn vervallen, de verhoging van het tarief van de omzetbelasting van 19% tot 21%
      buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXIX
  - number: XIX.4
    text: |-
      Ingeval een ondernemer na 30 september 2012 een onroerende zaak levert in de zin van
      [artikel 3, derde lid, onderdeel b, van de Wet op de omzetbelasting 1968][ref1], welke onroerende zaak ingevolge
      een vóór 1 oktober 2012 gesloten overeenkomst in opdracht is vervaardigd onder terbeschikkingstelling van stoffen,
      waaronder grond is begrepen, blijft de verhoging van het tarief van de omzetbelasting van 19% tot 21% buiten
      toepassing ten aanzien van het gedeelte van de vergoeding dat gelijk is aan de som van de termijnen die op grond
      van die overeenkomst vóór 1 oktober 2012 zijn vervallen en de in de vergoeding begrepen kosten van de vóór die
      datum ter beschikking gestelde stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
  - number: XIX.5
    text: |-
      In afwijking van het derde lid geldt ingeval een ondernemer ingevolge een vóór 28 april 2012 gesloten overeenkomst
      na 30 september 2012 een woning levert, dat ten aanzien van het gedeelte van de vergoeding dat gelijk is aan de som
      van de termijnen die op grond van die overeenkomst vóór 1 oktober 2013 zijn vervallen, de verhoging van het tarief
      van de omzetbelasting van 19% tot 21% buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXIX
  - number: XX.1
    text: |-
      [Artikel 84a van de Wet op de accijns][ref1] is van overeenkomstige toepassing op halfzware olie en gasolie die
      zijn voorzien van bij ministeriële regeling voorgeschreven herkenningsmiddelen voor zover deze oliën zich bevinden
      in opslagplaatsen, andere dan die van eindgebruikers van die oliën, tenzij deze eindgebruikers een of meer tanks
      hebben met een totale maximuminhoud van meer dan 5 000 liter.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel84a
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXX
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 84a
  - number: XX.2
    text: |-
      Voor de toepassing van het eerste lid wordt het bedrag van € 91, genoemd in
      [artikel 84a, zevende lid, van de Wet op de accijns][ref1], gelezen als € 250.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel84a
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXX
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 84a
  - number: XX.3
    text: |-
      In afwijking van [artikel 91, tweede lid, van de Wet op de accijns][ref1] wordt tot en met 30 juni 2013 toegestaan
      dat halfzware olie en gasolie die zijn voorzien van bij ministeriële regeling voorgeschreven herkenningsmiddelen
      of bestanddelen daarvan bevatten, ook in andere tanks dan tanks als bedoeld in artikel 91, tweede lid, onderdelen
      a tot en met c, van die wet, niet zijnde brandstoftanks van motorrijtuigen op de weg en van pleziervaartuigen,
      voorhanden zijn. Voor de periode van 1 juli 2013 tot en met 31 december 2013 kan de inspecteur dit toestaan in naar
      behoren gerechtvaardigde gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel91
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXX
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '91'
  - number: XX.4
    text: |-
      In geval van een verzoek om teruggaaf van accijns na 31 december 2012 voor halfzware olie en gasolie die zijn
      voorzien van bij ministeriële regeling voorgeschreven herkenningsmiddelen, wordt teruggaaf altijd verleend tegen
      het tarief, bedoeld in [artikel 27, derde lid, van de Wet op de accijns][ref1] zoals dit luidde op 31 december
      2012, tenzij belanghebbende aantoont dat de accijns is voldaan naar het tarief dat van toepassing is met ingang van
      1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel27
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXX
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '27'
  - number: XXI.1
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met dien verstande dat [artikel IV][ref1] voor het eerst toepassing vindt met betrekking tot boekjaren
      die aanvangen op of na 1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0031798#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelXXI
