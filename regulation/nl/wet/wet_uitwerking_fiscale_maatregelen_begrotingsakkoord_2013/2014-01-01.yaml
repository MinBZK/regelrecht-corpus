preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is spoedig een pakket maatregelen vast te stellen die
    bijdragen aan het structureel verbeteren van de overheidsfinanciën, het verstevigen van het vertrouwen van de
    financiële markten en het verder toekomstbestendig maken van de Nederlandse economie;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031798/2014-01-01#ArtikelAanhef
articles:
  - number: XVIII.1
    text: |-
      De [artikelen 10.1][ref1] en [10.3, tweede lid, van de Wet inkomstenbelasting 2001][ref2] en de
      [artikelen 32bb, negende lid][ref3], en [32bc, vierde lid, van de Wet op de loonbelasting 1964][ref4] vinden geen
      toepassing bij het begin van het kalenderjaar 2013.


