  - number: XX
    text: |-
      1 [Artikel 84a van de Wet op de accijns][ref1] is van overeenkomstige toepassing op halfzware olie en gasolie die
      zijn voorzien van bij ministeriële regeling voorgeschreven herkenningsmiddelen voor zover deze oliën zich bevinden
      in opslagplaatsen, andere dan die van eindgebruikers van die oliën, tenzij deze eindgebruikers een of meer tanks
      hebben met een totale maximuminhoud van meer dan 5 000 liter.

      2 Voor de toepassing van het eerste lid wordt het bedrag van € 91, genoemd in
      [artikel 84a, zevende lid, van de Wet op de accijns][ref2], gelezen als € 250.

      3 In afwijking van [artikel 91, tweede lid, van de Wet op de accijns][ref3] wordt tot en met 30 juni 2013
      toegestaan dat halfzware olie en gasolie die zijn voorzien van bij ministeriële regeling voorgeschreven
      herkenningsmiddelen of bestanddelen daarvan bevatten, ook in andere tanks dan tanks als bedoeld in artikel 91,
      tweede lid, onderdelen a tot en met c, van die wet, niet zijnde brandstoftanks van motorrijtuigen op de weg en van
      pleziervaartuigen, voorhanden zijn. Voor de periode van 1 juli 2013 tot en met 31 december 2013 kan de inspecteur
      dit toestaan in naar behoren gerechtvaardigde gevallen.

      4 In geval van een verzoek om teruggaaf van accijns na 31 december 2012 voor halfzware olie en gasolie die zijn
      voorzien van bij ministeriële regeling voorgeschreven herkenningsmiddelen, wordt teruggaaf altijd verleend tegen
      het tarief, bedoeld in [artikel 27, derde lid, van de Wet op de accijns][ref4] zoals dit luidde op 31 december
      2012, tenzij belanghebbende aantoont dat de accijns is voldaan naar het tarief dat van toepassing is met ingang van
      1 januari 2013.


