  - number: XIX
    text: |-
      1 De omzetbelasting die na 30 september 2012 verschuldigd wordt ter zake van leveringen en diensten ter zake
      waarvan ingevolge [artikel VIII, onderdelen A en B][ref1], het tarief met ingang van 1 oktober 2012 wordt verhoogd
      en die zijn verricht vóór of op de eerstgenoemde datum, wordt berekend naar het tarief dat geldt op het tijdstip
      waarop de levering of de dienst wordt verricht.

      2 Ingeval omzetbelasting vóór 1 oktober 2012 verschuldigd is ter zake van leveringen en diensten ter zake waarvan
      ingevolge [artikel VIII, onderdelen A en B][ref2], het tarief met ingang van 1 oktober 2012 wordt verhoogd en
      die worden verricht op of na deze datum, wordt hetgeen meer verschuldigd zou zijn geweest indien de belasting zou
      zijn berekend naar het tarief dat geldt op het tijdstip waarop de levering of de dienst wordt verricht, alsnog
      verschuldigd op 1 oktober 2012.

      3 Ingeval een ondernemer ingevolge een vóór 1 oktober 2012 gesloten overeenkomst na 30 september 2012 een
      onroerende zaak levert of een werk in onroerende staat oplevert tegen een vergoeding welke vervalt in termijnen,
      blijft ten aanzien van het gedeelte van de vergoeding dat gelijk is aan de som van de termijnen die op grond van
      die overeenkomst vóór 1 oktober 2012 zijn vervallen, de verhoging van het tarief van de omzetbelasting van 19% tot
      21% buiten toepassing.

      4 Ingeval een ondernemer na 30 september 2012 een onroerende zaak levert in de zin van
      [artikel 3, derde lid, onderdeel b, van de Wet op de omzetbelasting 1968][ref3], welke onroerende zaak ingevolge
      een vóór 1 oktober 2012 gesloten overeenkomst in opdracht is vervaardigd onder terbeschikkingstelling van stoffen,
      waaronder grond is begrepen, blijft de verhoging van het tarief van de omzetbelasting van 19% tot 21% buiten
      toepassing ten aanzien van het gedeelte van de vergoeding dat gelijk is aan de som van de termijnen die op grond
      van die overeenkomst vóór 1 oktober 2012 zijn vervallen en de in de vergoeding begrepen kosten van de vóór die
      datum ter beschikking gestelde stoffen.

      5 In afwijking van het derde lid geldt ingeval een ondernemer ingevolge een vóór 28 april 2012 gesloten
      overeenkomst na 30 september 2012 een woning levert, dat ten aanzien van het gedeelte van de vergoeding dat gelijk
      is aan de som van de termijnen die op grond van die overeenkomst vóór 1 oktober 2013 zijn vervallen, de verhoging
      van het tarief van de omzetbelasting van 19% tot 21% buiten toepassing blijft.


