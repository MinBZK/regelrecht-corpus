  - number: XVIII.2
    text: |-
      Bij de toepassing van [artikel 10.7, tweede en derde lid, van de Wet inkomstenbelasting 2001][ref1] bij het begin
      van het kalenderjaar 2013 wordt de toepassing van [artikel 10.1 van die wet][ref2] geacht te hebben plaatsgevonden
      op basis van een tabelcorrectiefactor als bedoeld in [artikel 10.2 van die wet][ref3] van 1.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
