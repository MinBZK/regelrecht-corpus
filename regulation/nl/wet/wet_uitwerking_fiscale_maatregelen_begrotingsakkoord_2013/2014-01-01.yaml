  - number: XXI
    text: |-
      1 Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met dien verstande dat [artikel IV][ref1] voor het eerst toepassing vindt met betrekking tot boekjaren
      die aanvangen op of na 1 januari 2013.

      2 In afwijking van het eerste lid treden de [artikelen XIII][ref2] en [XXa][ref3] in werking op een bij koninklijk
      besluit te bepalen tijdstip.

      3 [Artikel VI][ref4] en [artikel VII][ref5] werken terug tot en met 1 juli 2012.


