  - number: '10'
    text: |-
      1 Een subsidie voor de kosten van vergoeding ter beëindiging van een op een terrein gevestigde pachtovereenkomst
      als bedoeld in [artikel 2, onderdeel b][ref1], wordt slechts verleend, voorzover een instelling eigenaar of
      erfpachter is van een terrein waarop reeds vóór het tijdstip dat het terrein door die instelling is verworven,
      pachtrechten zijn gevestigd, en waarvoor naar het oordeel van de minister beëindiging van de op het terrein
      gevestigde pachtovereenkomst gewenst is vanuit het oogpunt van natuur- of landschapsbescherming, bescherming van
      cultuur-historische of bosbouwkundige waarden, of natuurontwikkeling alsmede de hoogte van de vergoeding niet meer
      bedraagt dan de gebruikelijk betaalde vergoedingen ter compensatie van het nadeel bij vroegtijdige beëindiging
      van pachtovereenkomsten.

      2 De subsidie, bedoeld in het eerste lid, bedraagt ten hoogste vijftig procent van de kosten van de vergoeding ter
      beëindiging van de op een terrein gevestigde pachtovereenkomst, met dien verstande dat de subsidie vermeerderd met
      subsidies of andere bijdragen die uit anderen hoofde met hetzelfde oogmerk worden verstrekt, alsmede vermeerderd
      met eigen middelen van de instelling die met hetzelfde oogmerk worden aangewend, niet meer dan honderd procent van
      het totaal van die kosten mag bedragen.

      3 De subsidieontvanger is verplicht om de beëindiging ten laatste te laten plaatsvinden binnen een tijdvak van
      twaalf weken na de subsidieverlening.

      4 De [artikelen 8, tweede lid][ref2], en [9][ref3] zijn van overeenkomstige toepassing.


