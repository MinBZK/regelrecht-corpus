        artikel: '2'
  - number: '54'
    text: |-
      1

      2 Te rekenen vanaf 1 januari 1993 vervallen voor de in het eerste lid bedoelde instellingen alle uit de Regeling
      bijdragen bos en landschapsbouw, respectievelijk de Regeling bijdragen bos en landschapsbouw 1991, voortvloeiende
      rechten, met uitzondering van de rechten die voortvloeien uit [artikel 10, vierde lid][ref1], van eerstgenoemde
      regeling, respectievelijk laatstgenoemde regeling.

      3 Voor zover nà 31 december 1992 subsidies op grond van een regeling als genoemd in het tweede lid zijn uitbetaald,
      wordt voor het jaar 1993 het bedrag van die subsidies, met uitzondering van de toeslag, bedoeld in het tweede lid,
      in mindering gebracht op het bedrag voor de subsidie, bedoeld in [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel11
