  - number: '19'
    text: |-
      Aanvragen tot subsidieverlening alsmede andere in het kader van deze paragraaf over te leggen bescheiden worden
      gericht aan de minister en ingediend bij de directeur.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel19
  - number: '20'
    text: |-
      a. Een aanvraag tot subsidieverlening voor de kosten van verwerving van een terrein als bedoeld in
      [artikel 6][ref1] wordt uiterlijk ingediend op de dag vóór het passeren van de koopakte.

      b. Een aanvraag tot subsidieverlening voor de kosten van vergoeding ter beëindiging van een pachtovereenkomst als
      bedoeld in [artikel 10][ref2] wordt uiterlijk ingediend op de dag vóór de beëindiging van de pachtovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel10
