    text: |-
      De minister kan met betrekking tot terreinen op aanvraag subsidies verlenen voor:

      a. De kosten van verwerving, en

      b. de vergoeding van de kosten voor beëindiging van pachtovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel2
  - number: '3'
    text: |-
      1 Voor subsidies als bedoeld in [artikel 2, onderdelen a en b][ref1], komen in aanmerking de volgende instellingen:

      a. Vereniging Natuurmonumenten;

      b. Stichting Het Groninger Landschap;

      c. Vereniging It Fryske Gea;

      d. Stichting Het Drentse Landschap;

      e. Stichting Het Landschap Overijssel;

      f. Stichting Het Geldersch Landschap;

      g. Stichting Het Utrechts Landschap;

      h. Stichting Het Zuidhollands Landschap;

      i. Stichting Het Landschap Noord-Holland;

      j. Stichting Het Zeeuwse Landschap;

      k. Stichting Het Brabants Landschap;

      l. Stichting Het Limburgs Landschap;

      m. Stichting Het Flevo-Landschap.

      2 Onverminderd het eerste lid, komen tot en met uiterlijk 31 december 2002 voor subsidies als bedoeld in
      [artikel 2, onderdelen a en b][ref2], tevens in aanmerking de volgende instellingen:

      a. Nederlandse Vereniging tot [Bescherming van Vogels][ref3];

      b. Stichting Marke Vragender Veen;

      c. G.A. van der Lugtstichting;

      d. Stichting Edwina van Heek;

      e. Stichting Gooisch Natuurreservaat.

      3 In afwijking van het tweede lid, komen de in dat lid genoemde instellingen tot een door de minister
      vast te stellen of nader vast te stellen tijdstip uitsluitend in aanmerking voor subsidies als bedoeld in
      [artikel 2, onderdelen a en b][ref4], voor zover die subsidies betrekking hebben op terreinen die zijn gelegen
      binnen gebieden die zijn aangegeven in een door de minister goedgekeurd begrenzingenplan. Ter verkrijging van
      de goedkeuring wordt het begrenzingenplan vóór 1 december 1993 bij de directeur ingediend. Wijzigingen in het
      goedgekeurde begrenzingenplan behoeven vóóraf de goedkeuring van de minister.


