  - number: '56'
    text: |-
      1 Met inachtneming van het bepaalde in het tweede lid treedt deze regeling in werking met ingang van de tweede dag
      na de dagtekening van de Staatscourant waarin zij wordt geplaatst en werkt zij terug tot en met 1 januari 1993.

      2 De [artikelen 1, onderdeel j][ref1], [2, onderdeel d][ref2], [3, zesde lid][ref3], [17][ref4], [18][ref5],
      [32][ref6] tot en met [36][ref7] en [47][ref8], treden zonder terugwerkende kracht in werking met ingang van 1
      januari 1994. [Artikel 53][ref9] werkt terug tot en met 4 maart 1993.

      3 Deze regeling kan worden aangehaald als: Regeling subsidies particuliere terreinbeherende
      natuurbeschermingsorganisaties.


