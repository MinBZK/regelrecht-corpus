preamble:
  text: |-
    Gezien het advies van de Bosbouwvoorlichtingsraad en de Natuurbeschermingsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
            instelling:

              instelling als bedoeld in [artikel 3][ref1], zijnde een vereniging met volledige rechtsbevoegdheid of een
      stichting;



            c
            terreinen:

              gronden, daaronder begrepen natuurterreinen, wateren, landgoederen, bossen en andere houtopstanden, alsmede
      de op die gronden gelegen objecten, die van belang of van potentieel belang zijn om hun natuurwetenschappelijke,
      landschappelijke of cultuur-historische betekenis of vanwege bosbouwkundige waarden;



            d
            natuurontwikkeling:

              het scheppen van de abiotische en biotische omstandigheden voor de ontwikkeling van natuurwaarden van
      nationale of internationale betekenis door middel van daarop toegesneden eenmalige maatregelen voor inrichting
      en beheer;



            e
            verwerving:

              verwerving van het recht van eigendom of het recht van erfpacht;



            f
            beheer:

              al hetgeen in een terrein wordt verricht ten behoeve van instandhouding en ontwikkeling van de in dat
      terrein aanwezige waarden van natuurwetenschappelijke, landschappelijke of cultuur-historische betekenis of vanwege
      de bosbouwkundige waarden, alsmede de daarmee verbonden administratie;



            g
            inrichting:

              het geschikt maken van een terrein voor de instandhouding, het herstel of de ontwikkeling van de
      natuurwaarden, landschappelijke waarden, cultuur-historische waarden of bosbouwkundige waarden en het daarmee
      samenhangende beheer;



            h
            natuurgebied:

              natuurgebied als bedoeld in [artikel 1, onderdeel r, van de Subsidieregeling natuurbeheer 2000][ref2];



            i
            invloedssfeer:

              gedeelte van een provincie, aangegeven op een door de minister en Gedeputeerde Staten vastgestelde kaart,
      waarbinnen een instelling eerstaangewezene is om terreinen te verwerven of in beheer te verkrijgen.



            j
            project:

              geheel van onderscheidbare éénmalige activiteiten, gericht op één of meer concrete resultaten ter
      instandhouding, herstel of ontwikkeling van
              natuurwaarden, landschappelijke waarden, cultuur-historische waarden of bosbouwkundige waarden;



            k
            directeur:

              de Directeur Dienst Landelijk Gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            l
            bureau:

              bureau beheer landbouwgronden als bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref3];



            m
            hervestiginskosten:

              kosten verbonden aan bedrijfshervestiging als bedoeld in artikel 1, onderdeel g, van de Regeling verlening
      hervestigingstoeslag, voor zover ter tegemoetkoming in die kosten op grond van die regeling een toeslag is
      verleend.



            n
            DLG:

              Dienst Landelijk Gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            o

              [verordening (EG) nr. 1257/1999](31999R1257):

              [verordening (EG) nr. 1257/1999](31999R1257) van de Raad van de Europese Unie van 17 mei 1999 betreffende
      steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot
      wijziging en instelling van een aantal verordeningen (PbEG L160);



            p
            EHS:

              ecologische hoofdstructuur, zoals die globaal is aangegeven op kaart 7 van de planologische kernbeslissing
      van het Structuurschema Groene Ruimte en zoals die, wat betreft reservaatsgebieden en natuurontwikkelingsprojecten,
      nader door de provincies is begrensd krachtens de Regeling beheersovereenkomsten en natuurontwikkeling, of zoals
      die globaal is aangegeven op kaart 5 van de planologische kernbeslissing van de Nota Ruimte (Kamerstukken II
      2004/05 29 435, nr. 125);



            q
            Groenfonds:

              Stichting Groenfonds, statutair gevestigd te ’s-Gravenhage.


