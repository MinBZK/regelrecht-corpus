  - number: '6'
    text: |-
      Een subsidie voor de kosten van verwerving van een terrein als bedoeld in [artikel 2, onderdeel a][ref1], wordt
      slechts verleend indien het aankoopbedrag niet meer bedraagt dan de reële marktwaarde en het terrein gelegen is:

      a. in een op grond van de Regeling beheersovereenkomsten en natuurontwikkeling begrensd natuurontwikkelingsproject
      of reservaatsgebied, of

      b. in een natuurgebied voor zover het een terrein betreft waarbinnen natuurontwikkeling wordt nagestreefd, of

      c. in een natuurgebied binnen de EHS.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel2
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel6
    references:
