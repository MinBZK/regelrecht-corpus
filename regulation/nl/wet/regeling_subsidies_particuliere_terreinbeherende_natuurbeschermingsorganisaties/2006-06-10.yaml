        paragraaf: '1'
  - number: '7'
    text: |-
      1 De subsidie, bedoeld in [artikel 6][ref1], bedraagt ten hoogste vijftig procent van de subsidiabele kosten, met
      dien verstande dat de subsidie vermeerderd met subsidies of andere bijdragen die uit andere hoofde met hetzelfde
      oogmerk worden verstrekt, alsmede vermeerderd met eigen middelen van de instelling die met hetzelfde oogmerk worden
      aangewend, niet meer dan honderd procent van het totaal van die kosten mag bedragen.

      2 Als subsidiabele kosten worden aangemerkt:

      a. het aankoopbedrag;

      b. het kadastraal recht en het registratierecht;

      c. veiling- en notariskosten;

      d. overdrachtsbelasting voor zover geen kwijtschelding of vermindering wordt verleend;

      e. schenkingsrecht voor zover geen kwijtschelding of vermindering wordt verleend;

      f. het afkoopbedrag van de landinrichtingsrente voor zover die rust op het verworven terrein;

      g. kosten verbonden aan het verlies bij verkoop of sloop van gebouwen;

      h. hervestigingskosten, voor zover deze kosten bij verkoop van gronden door het bureau aan de betrokken instelling
      in het aankoopbedrag van een terrein worden doorberekend.

      3 De minister kan bij de beschikking tot subsidieverlening besluiten dat tot een door hem vast te stellen
      maximumbedrag als subsidiabele kosten tevens worden aangemerkt:

      a. kosten van het wegwerken van het ten tijde van de verwerving aanwezige achterstallig onderhoud;

      b. kosten verbonden aan kleine investeringen ten behoeve van de inrichting van een terrein;

      c. kosten verbonden aan het tenietgaan van het op een terrein gevestigd recht van opstal;

      d. taxatie- en bemiddelingskosten.

      4 Kosten als bedoeld in de onderdelen a tot en met c van het derde lid worden niet als subsidiabele
      kosten aangemerkt, voor zover deze kosten verband houden met de verwerving van een terrein ten behoeve van
      natuurontwikkeling.

      5 In afwijking van het eerste lid, kan de minister besluiten de subsidie te verhogen voor:

      a. grondaankopen ten behoeve van de realisatie van Robuuste Verbindingen als bedoeld in de Nota Ruimte
      (kamerstukken II 2004-2005, 29 435, nr. 125), PKB-kaart 5, en die als zodanig zijn begrensd in de provinciale
      Natuurgebiedsplannen als bedoeld in [artikel 13 van de Subsidieregeling Natuurbeheer 2000][ref2];

      b. aankopen van landschapselementen als bedoeld in
      [artikel 74, tweede lid, onderdeel b, van de Landinrichtingswet][ref3], die zijn aangelegd in het kader van
      landinrichtingsprojecten;

      c. grondaankopen door één van de in [artikel 3][ref4] genoemde instellingen met het oogmerk deze grond om niet
      over te dragen aan Staatsbosbeheer en voor zover voor de aankoop of een geheel van aankopen en de aansluitende
      overdracht of overdrachten door of namens de minister toestemming is verleend; of

      d. de verwerving van terreinen die naar zijn oordeel gekenmerkt worden door de aanwezigheid van hoge actuele
      natuur-, landschappelijke, cultuurhistorische of bosbouwkundige waarden van nationale of internationale betekenis,
      waarvan die waarden aan acute bedreiging bloot staan, en dat verwerving naar zijn oordeel slechts kan worden
      gerealiseerd met een extra subsidie.

      6 Naast de gevallen, bedoeld in het vijfde lid, kan de minister besluiten de subsidie te verhogen, indien het
      provinciale aandeel voor grondaankopen, zoals overeengekomen in LNV-IPO-convenant 1997, is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel6
