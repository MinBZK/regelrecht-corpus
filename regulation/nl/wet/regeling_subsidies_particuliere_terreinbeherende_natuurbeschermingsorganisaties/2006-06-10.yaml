  - number: 4a
    text: |-
      1 De minister stelt jaarlijks voor alle in [artikel 2][ref1] genoemde categorieën subsidies gezamenlijk of voor
      elke categorie afzonderlijk een subsidieplafond vast.

      2 Indien het subsidieplafond wordt overschreden, kan de minister besluiten dat vanaf een door hem vast te stellen
      tijdstip geen aanvragen tot subsidieverlening als bedoeld in [artikel 2][ref2] meer kunnen worden ingediend. Dit
      besluit kan één of enkele categorieën subsidies betreffen.

      3 De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel2
