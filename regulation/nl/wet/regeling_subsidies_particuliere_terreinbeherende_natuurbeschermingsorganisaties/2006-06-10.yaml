  - number: '8'
    text: |-
      1 De subsidieontvanger is verplicht om:

      a. de daadwerkelijke verwerving van het terrein ten laatste te laten plaatsvinden binnen een tijdvak van twaalf
      weken na de subsidieverlening;

      b. voorzover de subsidieverlening tevens betrekking heeft op de subsidiabele kosten als bedoeld in
      [artikel 7, tweede lid, onderdeel f, of derde lid, onderdelen a tot en met c][ref1], die kosten te maken binnen een
      tijdvak van twee jaren na de subsidieverlening.

      2 Op verzoek van de betrokken instelling kan de minister de termijn, bedoeld in het eerste lid, onderdeel a,
      verlengen tot en met een door hem vast te stellen of nader vast te stellen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel7
