  - number: '21'
    text: |-
      Een aanvraag tot subsidieverlening, bedoeld in [artikel 6][ref1], respectievelijk [artikel 10][ref2], gaat in ieder
      geval vergezeld van:

      a. een kadastrale omschrijving van het terrein ten behoeve waarvan de subsidie wordt aangevraagd;

      b. een begroting van de met de verwerving, respectievelijk de beëindiging van de pachtovereenkomst, gemoeide
      kosten;

      c. in voorkomend geval, een overzicht van de subsidies of andere bijdragen die uit anderen hoofde met hetzelfde
      oogmerk worden verstrekt, respectievelijk van de eigen middelen van de instelling die met hetzelfde oogmerk worden
      aangewend, en

      d. voor zover het betreft een aanvraag tot subsidieverlening voor de kosten van verwerving van een terrein en die
      verwerving niet kan worden aangemerkt als een uitbreidingsaankoop, een globale visie op het na te streven beheer
      van het terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel10
