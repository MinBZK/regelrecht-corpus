  - number: '9'
    text: |-
      1 De subsidie, bedoeld in [artikel 6][ref1], wordt — uitgezonderd in geval van verwerving ten behoeve van
      natuurontwikkeling — in opdracht van de minister uitbetaald door de Vereniging tot Behoud van Natuurmonumenten in
      Nederland uit een lening die genoemde vereniging onder garantstelling van de Staat heeft afgesloten uitsluitend ten
      bate van de instelling aan welke de subsidie is verleend en ten behoeve van de verwerving van het terrein, bedoeld
      in [artikel 6][ref2]. De Staat vergoedt in dat geval de kosten van rente en aflossing van die lening.

      2 De minister kan het bepaalde in het eerste lid vanaf een door hem vast te stellen tijdstip tot en met een door
      hem vast te stellen of nader vast te stellen tijdstip buiten toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel6
