  - number: '22'
    text: De minister geeft een beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel22
  - number: '23'
    text: |-
      De minister kan op aanvraag een voorschot verlenen tot ten hoogste vijfennegentig procent van het bedrag vermeld
      in de beschikking tot subsidieverlening onderscheidenlijk van het bedrag waarop de subsidie overeenkomstig de
      beschikking tot subsidieverlening ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel23
  - number: '24'
    text: |-
      1 Binnen twaalf weken nadat een terrein daadwerkelijk is verworven, dient de subsidieontvanger een aanvraag tot
      subsidievaststelling in, vergezeld van:

      a. een afschrift van de notariële akte van de aankoop van het betrokken terrein;

      b. een overzicht van de kosten, bedoeld in [artikel 7, tweede lid, onderdelen a tot en met e][ref1], en — in
      voorkomend geval — een overzicht van de kosten, bedoeld in [artikel 7, derde lid, onderdeel d, en c][ref2], in
      voorkomend geval, een overzicht van de subsidies of andere bijdragen die uit anderen hoofde met hetzelfde oogmerk
      zijn verstrekt, respectievelijk van de eigen middelen van de instelling die met hetzelfde oogmerk zijn aangewend.

      2 Binnen twaalf weken nadat met betrekking tot een terrein de pachtovereenkomst is beëindigd, dient de
      subsidieontvanger een aanvraag tot subsidievaststelling in, vergezeld van:

      a. een afschrift van een schriftelijke overeenkomst tot beëindiging van de pachtovereenkomst danwel
      een afschrift van het besluit van de Pachtkamer tot ontbinding van de pachtovereenkomst als bedoeld in
      [artikel 51, eerste lid, van de Pachtwet][ref3];

      b. een overzicht van de kosten verbonden aan de beëindiging van de pachtovereenkomst, en

      c. in voorkomend geval, een overzicht van de subsidies of andere bijdragen die uit anderen hoofde met hetzelfde
      oogmerk zijn verstrekt, respectievelijk van de eigen middelen van de instelling die met hetzelfde oogmerk zijn
      aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002269#Artikel51
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006085
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002269
        artikel: '51'
  - number: '25'
    text: |-
      De minister geeft een beschikking tot subsidievaststelling ten aanzien van de subsidies, bedoeld in de
      [artikelen 6][ref1] en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel10
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006085
        artikel: '10'
        paragraaf: '3'
  - number: '28'
    text: |-
      De minister kan op aanvraag een voorschot verlenen tot ten hoogste vijfennegentig procent van het bedrag vermeld
      in de beschikking tot subsidieverlening onderscheidenlijk van het bedrag waarop de subsidie overeenkomstig de
      beschikking tot subsidieverlening ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel28
  - number: '37'
    text: |-
      De instelling draagt er zorg voor, dat de subsidie wordt gebruikt voor de doeleinden waarvoor zij wordt verstrekt
      en dat alle verder uit deze regeling voortvloeiende verplichtingen worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel37
  - number: '38'
    text: |-
      1 De instelling is verplicht een deugdelijke administratie en een doelmatig financieel beheer te voeren ten aanzien
      van de activiteiten waar de subsidieverlening betrekking op heeft en alle documenten waaronder afschriften van
      de notariële akten en koopcontracten te bewaren gedurende tenminste 3 jaren na datum van de subsidievaststelling
      conform artikel 4 van [verordening (EEG) nr. 4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door
      de Lid-Staten uit te voeren controles op de verrichtingen in het kader van de financieringsregeling van de afdeling
      Garantie van het Europees Oriëntatie- en Garantiefonds voor de Landbouw en houdende intrekking van [Richtlijn
      77/435/EEG](31977L0435) (PbEG L388).

      2 Omtrent de wijze van administreren kan de minister richtlijnen geven.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel38
  - number: '39'
    text: |-
      De instelling is verplicht mededeling te doen van alleen of met anderen opgerichte of nog op te richten
      privaatrechtelijke rechtspersonen die de financiële positie van de instelling in betekenende mate beïnvloeden of
      kunnen beïnvloeden. Zij is gehouden op verzoek van de minister inzage te verschaffen of te doen verschaffen in de
      financiële jaarstukken van zodanige rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel39
  - number: '40'
    text: |-
      Behoudens goedkeuring van de minister wordt een met een subsidie als bedoeld in [artikel 6][ref1] verworven terrein
      of een gedeelte daarvan niet vervreemd of in erfpacht uitgegeven, noch wordt het kenmerkend karakter van het
      terrein of delen ervan in strijd met het beheersvisie gewijzigd, dan wel aan derden toestemming daartoe verleend.
      Aan de goedkeuring kan de minister voorwaarden verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel6
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '6'
        paragraaf: '2'
  - number: '41'
    text: |-
      1 In de gevallen, genoemd in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan de minister een vergoeding voor vermogensvorming verschuldigd.

      2 Bij de bepaling van de hoogte van de vergoeding, bedoeld in het eerste lid, wordt — uitgezonderd in geval een
      subsidie als bedoeld in [artikel 6][ref2] is toegekend — uitgegaan van de waarde van de eigendommen en andere
      vermogensbestanddelen op het tijdstip waarop de financiële vergoeding verschuldigd wordt met dien verstande dat
      — in geval van ontvangst van schadevergoeding voor verlies of beschadiging van eigendommen — wordt uitgegaan
      van het bedrag dat de instelling als schadevergoeding ontvangt. Indien het onroerend goed betreft, geschiedt de
      waardebepaling door een onafhankelijke deskundige.

      3 In geval een subsidie als bedoeld in [artikel 6][ref3] is toegekend, wordt bij de bepaling van de hoogte van de
      vergoeding uitgegaan van de waarde van de eigendommen en andere vermogensbestanddelen ten tijde van verwerving.

      4 Toepassing van het eerste lid blijft achterwege, indien de activiteiten van de instelling nà toestemming van de
      minister door een andere rechtspersoon worden voortgezet en de activa tegen boekwaarde aan die andere rechtspersoon
      in eigendom zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006085#Artikel6
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
      - id: ref2
        bwb_id: BWBR0006085
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006085
        artikel: '6'
        paragraaf: '2'
  - number: '43'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2], worden terug te vorderen bedragen vermeerderd met de wettelijke
      rente vanaf het tijdstip van terugvordering tot aan het moment van algehele voldoening.

      2 Terugvordering van onverschuldigd betaalde subsidiebedragen en voorschotten blijft achterwege, indien het terrein
      aan de Staat wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:57
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '44'
    text: |-
      De instelling beschikt over statuten, die aan de minister ter kennisneming worden overgelegd. De instelling stelt
      de minister onverwijld in kennis van wijziging van de statuten.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel44
  - number: '45'
    text: Aan de toekenning van een subsidie kunnen geen rechten worden ontleend voor subsidies in daarop volgende jaren.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel45
  - number: '46'
    text: |-
      Bij beëindiging van de instelling behoeft de bestemming van een batig liquidatiesaldo de goedkeuring van de
      minister.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46
  - number: 46a
    text: |-
      Indien de aanvrager door ernstige nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of
      – vaststelling heeft ingediend of ernstig nalatig of opzettelijk anderszins onjuiste gegevens heeft verstrekt
      op grond van een andere regeling gebaseerd op titel II, hoofdstuk IX van de [verordening (EG) nr. 1257/99]
      (31999R1257), of indien een beschikking tot subsidieverlening is gewijzigd of ingetrokken op grond van
      [artikel 46b][ref1] of een beschikking tot subsidievaststelling is gewijzigd of ingetrokken op grond van
      [artikel 46c][ref2], wordt voor het betreffende kalenderjaar subsidieverlening geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel46b
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel46c
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: 46b
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006085
        artikel: 46c
        paragraaf: '7'
  - number: 46b
    text: |-
      Indien de aanvrager door ernstige nalatigheid of opzettelijk onjuiste gegevens heeft ingediend bij de aanvraag
      tot subsidieverlening of subsidievaststelling of ernstig nalatig of opzettelijk anderszins onjuiste gegevens
      heeft verstrekt op grond van een andere regeling gebaseerd op titel II, hoofdstuk IX van de [verordening (EG) nr.
      1257/99](31999R1257) wordt de beschikking tot subsidieverlening op grond van deze regeling gewijzigd of ingetrokken
      op een zodanige wijze dat voor het betreffende kalenderjaar geen recht op een bijdrage bestaat.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46b
  - number: 46c
    text: |-
      Indien de aanvrager door ernstige nalatigheid of opzettelijk onjuiste gegevens heeft ingediend bij de aanvraag
      tot subsidieverlening of subsidievaststelling of ernstig nalatig of opzettelijk anderszins onjuiste gegevens
      heeft verstrekt op grond van een andere regeling gebaseerd op titel II, hoofdstuk IX van de [verordening (EG) nr.
      1257/99](31999R1257) wordt de beschikking tot subsidievaststelling gewijzigd of ingetrokken op een zodanige wijze
      dat voor het betreffende kalenderjaar geen recht op een bijdrage bestaat.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46c
  - number: 46d
    text: |-
      Indien de aanvrager opzettelijk een onjuiste aanvraag tot subsidieverlening of subsidievaststelling heeft ingediend
      of opzettelijk anderszins foute gegevens heeft verstrekt op grond van een andere regeling gebaseerd op titel
      II, hoofdstuk IX van de [verordening (EG) nr. 1257/1999](31999R1257), of indien in geval van opzet een verleende
      subsidie is gewijzigd of ingetrokken op grond van [artikel 46b][ref1] of een vastgestelde subsidie is gewijzigd of
      ingetrokken op grond van [artikel 46c][ref2], wordt tevens geen subsidie verleend in het daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel46b
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel46c
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: 46b
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006085
        artikel: 46c
        paragraaf: '7'
  - number: 46e
    text: |-
      Indien de aanvrager in een jaar opzettelijk een onjuiste aanvraag tot subsidieverlening op grond van deze regeling
      heeft ingediend of opzettelijk anderszins foute gegevens heeft verstrekt wordt geen subsidie verleend voor het
      daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46e
  - number: 46f
    text: |-
      Op een verleende of vastgestelde subsidie worden in mindering gebracht de bedragen, die voor het verwerven van
      hetzelfde terrein uit anderen hoofde van overheidswege worden verstrekt, voorzover de subsidie en de ontvangen
      bedragen gezamenlijk meer bedragen dan 100% van de subsidiabele kosten op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46f
  - number: 46g
    text: Met het toezicht op de naleving van deze regeling zijn belast alle daartoe aangewezen medewerkers van DLG.
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel46g
  - number: '47'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 37 tot en met 46g][ref1] is tevens van toepassing op de Stichting Unie
      van Provinciale Landschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel37
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '37'
        paragraaf: '7'
  - number: 49a
    text: |-
      Deze regeling berust op [artikel 2 van de Kaderwet LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel2
    url: https://wetten.overheid.nl/BWBR0006085/2006-06-10#Artikel49a
