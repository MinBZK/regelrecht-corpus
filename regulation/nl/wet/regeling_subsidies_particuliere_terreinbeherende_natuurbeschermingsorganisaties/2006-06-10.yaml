    text: |-
      1 Een subsidie als bedoeld in [artikel 2][ref1] wordt slechts verleend:

      a. voorzover de behoefte aan een subsidie ten genoegen van de minister wordt aangetoond;

      b. indien aannemelijk wordt gemaakt dat met inbegrip van de subsidie een sluitende exploitatie is verzekerd.

      2 De verlening van een subsidie als bedoeld in [artikel 2, onderdeel a][ref2], wordt in ieder geval geweigerd,
      indien een terrein is gelegen buiten de invloedssfeer van de instelling die een aanvraag tot subsidieverlening
      heeft ingediend, behoudens ingeval de eerstaangewezene op grond van de door de minister en gedeputeerde staten
      vastgestelde kaart, met de desbetreffende verwerving of het desbetreffende beheer schriftelijk heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel2
