  - number: '2'
    text: |-
      1 De [Algemene bijstandswet][ref1], de [Invoeringswet herinrichting Algemene Bijstandswet][ref2],
      de [Wet inschakeling werkzoekenden][ref3], de [Wet financiering Abw, IOAW en IOAZ][ref4] en het
      [Besluit in- en doorstroombanen][ref5] worden ingetrokken.

      2 Voor de verschillende artikelen of onderdelen daarvan van de in het eerste lid genoemde wetten of het
      [Besluit in- en doorstroombanen][ref6] kan bij koninklijk besluit het tijdstip waarop deze vervallen verschillend
      worden gesteld.

      3 Bij ministeriële regeling kunnen regels worden gesteld voor de gevolgen van de toepassing van het tweede lid,
      waarbij zo nodig kan worden afgeweken van de in dat lid bedoelde artikelen of onderdelen daarvan.


