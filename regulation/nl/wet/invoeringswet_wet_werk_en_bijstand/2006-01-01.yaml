  - number: '11'
    text: |-
      1 [Artikel 50, tweede lid, van de Wet werk en bijstand][ref1] is tot een bij koninklijk besluit te bepalen tijdstip
      niet van toepassing op de belanghebbende die op de peildatum recht had op algemene bijstand en eigenaar was van een
      door hemzelf of zijn gezin bewoonde woonwagen of bewoond woonschip met bijbehorend erf.

      2 In afwijking van [artikel 8][ref2] wordt het in de woonwagen of het woonschip met bijbehorend erf gebonden
      vermogen van de belanghebbende, bedoeld in het eerste lid, met ingang van het tijdstip, bedoeld in het eerste lid,
      vastgesteld op de waarde ervan op dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0015704#Artikel8
