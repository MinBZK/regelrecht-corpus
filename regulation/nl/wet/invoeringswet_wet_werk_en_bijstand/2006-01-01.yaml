      1 Voor het eerste kalenderjaar waarop de [Wet werk en bijstand][ref1] betrekking heeft, worden de uitkeringen,
      bedoeld in [artikel 69, eerste lid, van voornoemde wet][ref2], vastgesteld binnen vier weken na inwerkingtreding
      van die wet.

      2 De vaststelling van de uitkering, bedoeld in
      [artikel 5, eerste lid, van de Wet financiering Abw, IOAW en IOAZ][ref3], voor de in het eerste kalenderjaar na de
      inwerkingtreding van de [artikelen 23][ref4] en [24][ref5] ten laste van de gemeente gebleven kosten, bedoeld in
      [artikel 3, eerste lid, onderdelen d en e, van voornoemde wet][ref6] geldt als de vaststelling van de uitkering,
      bedoeld in [artikel 58, eerste lid, van de IOAW][ref7] onderscheidenlijk de [IOAZ][ref8].


