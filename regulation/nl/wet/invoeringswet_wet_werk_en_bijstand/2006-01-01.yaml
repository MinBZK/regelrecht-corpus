  - number: '10'
    text: |-
      1 De belanghebbende die op de peildatum op grond van [artikel 39, tweede lid, van de Algemene bijstandswet][ref1]
      recht had op bijzondere bijstand, behoudt dit recht tot het tijdstip dat in de desbetreffende beschikking is
      bepaald, doch uiterlijk tot een jaar na inwerkingtreding van de [Wet werk en bijstand][ref2].

      2 Colleges kunnen ook na de inwerkingtreding van de [Wet werk en bijstand][ref3] bijzondere bijstand in de vorm van
      een collectieve aanvullende ziektekostenverzekering verstrekken.

      3 In afwijking van [artikel 35, eerste lid, van de Wet werk en bijstand][ref4], kan, onverminderd het eerste lid,
      bijzondere bijstand ook aan een persoon van 18 jaar en ouder, doch jonger dan 65 jaar, behorend tot een categorie
      chronisch zieken of gehandicapten, worden verleend, zonder dat wordt nagegaan of ten aanzien van die persoon
      kosten in verband met chronische ziekte of handicap ook daadwerkelijk noodzakelijk zijn of gemaakt zijn, indien ten
      aanzien van de categorie waartoe hij behoort aannemelijk is dat die zich in bijzondere omstandigheden bevindt die
      leiden tot bepaalde noodzakelijke kosten van bestaan waarin de algemene bijstand niet voorziet en die de aanwezige
      draagkracht te boven gaan.

      4 Het derde lid vervalt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0015703
