      1 Een dienstbetrekking als bedoeld in [artikel 4 van de Wet inschakeling werkzoekenden][ref1], een
      arbeidsovereenkomst als bedoeld in [artikel 5, eerste lid, van die wet][ref2] en een dienstbetrekking als
      bedoeld in [artikel 6 van het Besluit in- en doorstroombanen][ref3] gelden als een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref4].

      2 Op dienstbetrekkingen als bedoeld in de [Wet inschakeling werkzoekenden][ref5] blijft
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref6] alsmede de [artikelen 4, tweede, zesde en zevende lid][ref7],
      en [11, aanhef en onderdeel a, van de Wet inschakeling werkzoekenden][ref8] van toepassing. Op deze
      dienstbetrekkingen is [artikel 134, tweede lid, van de Ambtenarenwet][ref9] niet van toepassing.


