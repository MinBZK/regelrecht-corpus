  - number: '5'
    text: |-
      Op een aanvraag tot het verlenen van bijstand wordt beslist met toepassing van:

      a. de [Algemene bijstandswet][ref1], indien het recht op bijstand ingaat vóór of op de peildatum;

      b. de [Wet werk en bijstand][ref2], indien het recht op bijstand ingaat na de peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0015704/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0015703
  - number: '6'
    text: |-
      1 Onze Minister kan de verlening van bijstand aan een Nederlander die zich in het buitenland bevindt voortzetten
      ten aanzien van:

      a. degene die in december 1995 bijstand ontving op grond van [artikel 82][ref1] of
      [artikel 95 van de Algemene Bijstandswet][ref2], welke bijstand niet is geëindigd;

      b. degene die op enig moment in de periode van 26 weken onmiddellijk voorafgaand aan 31 december 1995 bijstand
      ontving op grond van [artikel 82 van de Algemene Bijstandswet][ref3], welke bijstand in die periode is geëindigd,
      indien belanghebbende binnen 26 weken na die datum opnieuw bijstand aanvraagt.

      2 De in het eerste lid bedoelde bijstand wordt afgestemd op de omstandigheden, mogelijkheden en middelen van de
      belanghebbende, rekening houdend met het niveau van de noodzakelijke kosten van het bestaan ter plaatse.

      3 [Hoofdstuk 2][ref4] en de [paragrafen 6.1 tot en met 6.5 van de Wet werk en bijstand][ref5] zijn, voor zover
      de omstandigheden het toelaten, van overeenkomstige toepassing, met dien verstande dat Onze Minister in de plaats
      treedt van het college.

      4 Zodra ten minste 26 weken zijn verstreken nadat de bijstand die werd verleend op grond van het eerste lid werd
      beëindigd, is dat lid ten aanzien van het desbetreffende geval niet langer van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Paragraaf6.1
    url: https://wetten.overheid.nl/BWBR0015704/2006-01-01#Artikel6
