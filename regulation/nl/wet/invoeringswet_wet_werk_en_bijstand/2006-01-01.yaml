  - number: '7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verlening van bijstand
      en bijstand ter voorziening in de behoefte aan bedrijfskapitaal op grond van de [Wet werk en bijstand][ref1]
      aan zelfstandigen en aan personen die algemene bijstand ontvangen en voornemens zijn een bedrijf of zelfstandig
      beroep te beginnen en zich in verband hiermee niet beschikbaar stellen voor arbeid in dienstbetrekking gedurende
      de voorbereidingsperiode van ten hoogste twaalf maanden, waarbij kan worden afgeweken van de [artikelen 9][ref2],
      [10][ref3], [11][ref4], [32][ref5], [34][ref6], [40][ref7], [41][ref8], [45][ref9], [77][ref10] en de
      [paragrafen 4.2][ref11], [6.1][ref12], [6.4][ref13] en [7.1 van die wet][ref14].


