  - number: '69'
    text: |-
      Met ingang van de datum van inwerkingtreding van de [Wet werk en bijstand][ref1] worden de in de
      [hoofdstukken 3][ref2] en [4 van voornoemde wet][ref3] genoemde bedragen en percentages op de in
      [paragraaf 4.2 van die wet][ref4] voorgeschreven wijze herzien, voorzover de ontwikkeling van het netto
      minimumloon, de netto aanspraak op minimumvakantiebijslag en het prijsindexcijfer van de gezinsconsumptie,
      gerekend vanaf 1 januari 2003, daartoe aanleiding geeft. Van de herziene normen en bedragen en van de dag waarop de
      herziening plaatsvindt, wordt door Onze Minister mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Paragraaf4.2
    url: https://wetten.overheid.nl/BWBR0015704/2006-01-01#Artikel69
