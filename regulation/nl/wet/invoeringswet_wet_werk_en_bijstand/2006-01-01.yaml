    text: |-
      Bij ministeriële regeling kunnen met het oog op de goede invoering van de [Wet werk en bijstand][ref1] regels
      worden gesteld waarbij zo nodig kan worden afgeweken van het bepaalde bij of krachtens voornoemde wet of deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
