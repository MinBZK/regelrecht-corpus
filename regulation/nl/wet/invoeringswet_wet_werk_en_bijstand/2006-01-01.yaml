  - number: '8'
    text: |-
      Als het vermogen dat vanaf de bijstandsverlening niet in aanmerking is genomen, bedoeld in
      [artikel 34, vierde lid, van de Wet werk en bijstand][ref1], van de belanghebbende aan wie op de peildatum
      algemene bijstand werd verleend, geldt het bedrag zoals dat laatstelijk vóór of op de peildatum door het college
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015704/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
  - number: '9'
    text: |-
      [Artikel 43, tweede lid, onderdelen m en n, van de Algemene bijstandswet][ref1] blijft in het eerste jaar waarop
      de [Wet werk en bijstand][ref2] betrekking heeft, van toepassing op de belanghebbende van wie op grond van
      [dat artikel][ref3] op de peildatum inkomsten niet tot zijn middelen werden gerekend, met dien verstande dat het
      bedrag dat op grond van [dat artikel][ref4] niet tot de middelen wordt gerekend, wordt vermenigvuldigd met:

      a. 1, in de eerste tot en met de derde maand na de peildatum;

      b. 0,75, in de vierde tot en met de zesde maand na de peildatum;

      c. 0,5, in de zevende tot en met de negende maand na de peildatum;

      d. 0,25, in de tiende tot en met de twaalfde maand na de peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0007333#Artikel43
