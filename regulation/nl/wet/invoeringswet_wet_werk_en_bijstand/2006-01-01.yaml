      [artikel 4, vierde lid, laatste volzin, van de Invoeringswet herinrichting Algemene Bijstandswet][ref2] blijven van
      toepassing op bijstand die op de peildatum werd verleend met toepassing van die artikelen.

      2 Indien in de periode tussen de datum van plaatsing van de [Wet werk en bijstand][ref3] in het Staatsblad en de
      inwerkingtreding van voornoemde wet bijstand is aangevraagd, wordt in voorkomende gevallen de krediethypotheek
