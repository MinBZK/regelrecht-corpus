    text: |-
      1 Op een bezwaar- of beroepschrift dat:

      a. vóór of op de peildatum is ingediend tegen een door het college op grond van de [Algemene bijstandswet][ref1],
      de [Wet inschakeling werkzoekenden][ref2] of het [Besluit in- en doorstroombanen][ref3] genomen besluit en waarop
      op die datum nog niet onherroepelijk is beslist;

      b. na de peildatum is ingediend tegen een op grond van de in het eerste lid bedoelde wetten of het
      [Besluit in- en doorstroombanen][ref4] met toepassing van artikel 2, tweede lid, na de peildatum genomen besluit
      en waarop nog niet onherroepelijk is beslist op het tijdstip dat de bepaling vervalt op grond waarvan het besluit
      is genomen;

      c. na de peildatum is ingediend en betrekking heeft op bijstandsverlening waarop ingevolge
      [artikel 12, eerste lid, de Algemene bijstandswet][ref5] van toepassing is;

      wordt beslist met toepassing van onderscheidenlijk de [Algemene bijstandswet][ref6], de
      [Wet inschakeling werkzoekenden][ref7] of het [Besluit in- en doorstroombanen][ref8].

      2 Het eerste lid is van overeenkomstige toepassing op verzoeken als bedoeld in
      [artikel 140 van de Algemene bijstandswet][ref9] en verzoeken om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref10].


