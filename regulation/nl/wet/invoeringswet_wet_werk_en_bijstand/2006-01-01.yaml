    text: |-
      1 De [Wet financiering Abw, IOAW en IOAZ][ref1] blijft van toepassing op:

      a. de vergoeding van en de uitkering voor vóór de inwerkingtreding van de
      [Wet werk en bijstand][ref2] ten laste van de gemeente gebleven kosten als bedoeld in
      [artikel 3, eerste lid, onderdelen a, b en c, van de in de aanhef genoemde wet][ref3];

      b. de vergoeding van vóór de inwerkingtreding van de [Wet werk en bijstand][ref4] gemaakte kosten als bedoeld in
      [artikel 12, eerste lid, onderdelen a, b en c, van de in de aanhef genoemde wet][ref5].

      2 De [artikelen 117][ref6], [130][ref7], [132][ref8] en [133 van de Algemene bijstandswet][ref9] blijven van
      toepassing op de uitvoering van die wet na de inwerkingtreding van de [Wet werk en bijstand][ref10].

      3 [Hoofdstuk V van de IOAZ][ref11] onderscheidenlijk de [IOAW][ref12] is van toepassing op:

      a. de vergoeding van en de uitkering voor vóór de inwerkingtreding van artikel 23
      onderscheidenlijk artikel 24 ten laste van de gemeente gebleven kosten als bedoeld in
      [artikel 3, eerste lid, onderdelen d en e, van de Wet financiering Abw, IOAW en IOAZ][ref13];

      b. de vergoeding van vóór de inwerkingtreding van artikel 23 onderscheidenlijk artikel 24 gemaakte kosten als
      bedoeld in [artikel 12, eerste lid, onderdeel d, van de Wet financiering Abw, IOAW en IOAZ][ref14].


