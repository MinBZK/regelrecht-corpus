  - number: '4'
    text: |-
      1 Door het college op grond van de [Algemene bijstandswet][ref1], de [Wet inschakeling werkzoekenden][ref2] of
      het [Besluit in- en doorstroombanen][ref3] genomen besluiten gelden als door hem genomen besluiten op grond van de
      [Wet werk en bijstand][ref4].

      2 In afwijking van het eerste lid gelden door het college op grond van de [Wet inschakeling werkzoekenden][ref5]
      of het [Besluit in- en doorstroombanen][ref6] ten aanzien van personen die een uitkering ontvangen op grond van
      de [IOAZ][ref7] of de [IOAW][ref8] genomen besluiten als door hem genomen besluiten op grond van de [IOAZ][ref9]
      onderscheidenlijk de [IOAW][ref10].

      3 Onverminderd de [artikelen 8 tot en met 12][ref11], brengt het college de in het eerste en het tweede lid
      bedoelde besluiten binnen 24 maanden na de inwerkingtreding van de [Wet werk en bijstand][ref12] in overeenstemming
      met onderscheidenlijk [die wet][ref13], de [IOAZ][ref14] of de [IOAW][ref15], voorzover deze besluiten afwijken van
      die wetten.

      4 Het college brengt vóór de inwerkingtreding van [artikel 23][ref16] onderscheidenlijk [artikel 24][ref17] op
      grond van de [IOAZ][ref18] of de [IOAW][ref19] genomen besluiten binnen 24 maanden na die inwerkingtreding in
      overeenstemming met de [artikelen 37][ref20] en [37a van de IOAZ][ref21] onderscheidenlijk de [IOAW][ref22], zoals
      deze artikelen luiden na de inwerkingtreding van de [onderdelen L en M van artikel 23][ref23] onderscheidenlijk
      [artikel 24][ref24].

      5 In dit hoofdstuk worden onder door het college genomen besluiten op grond van de [Algemene bijstandswet][ref25],
      de [Wet inschakeling werkzoekenden][ref26] of het [Besluit in- en doorstroombanen][ref27] mede verstaan door hem
      op grond van die wetten of dat besluit met toepassing van [artikel 2, tweede lid][ref28], na de peildatum genomen
      besluiten.


