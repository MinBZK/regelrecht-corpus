  - number: '71'
    text: |-
      1 Na inwerkingtreding van [artikel 3, vijfde lid, van de Wet werk en bijstand][ref1] berust het
      [Besluit aanwijzing registraties gezamenlijke huishouding 1998][ref2] mede op dat artikel.

      2 Na inwerkingtreding van [artikel 11, derde lid, van de Wet werk en bijstand][ref3] berust het
      [Besluit gelijkstelling vreemdelingen Abw, Ioaw, Ioaz, Wvg en Wik][ref4] mede op dat artikel.

      3 Na inwerkingtreding van [artikel 13, derde lid, van de Wet werk en bijstand][ref5] berust het
      [Besluit extramurale vrijheidsbeneming en sociale zekerheid][ref6] mede op dat artikel.

      4 Na inwerkingtreding van [artikel 64, tweede, zevende en achtste lid, van de Wet werk en bijstand][ref7] berust
      het [Besluit Inlichtingenbureau gemeenten][ref8] mede op dat artikel.

      5 Na inwerkingtreding van [artikelen 7, zesde lid][ref9], en [67, derde lid, van de Wet werk en bijstand][ref10]
      berust het [Besluit SUWI][ref11] mede op die artikelen.

      6 Na inwerkingtreding van [artikel 37, derde lid, van de Wet werk en bijstand][ref12] berust het
      [Besluit vaststelling rekenpremie wachtgeldfondsen][ref13] mede op dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
