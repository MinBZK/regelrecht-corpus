    text: |-
      Het deel van de subsidie, bedoeld in [artikel 14 van de Wet inschakeling werkzoekenden][ref1], van
      het kalenderjaar voorafgaand aan de inwerkingtreding van de [Wet werk en bijstand][ref2] dat op grond
      van [artikel 18, vierde lid, van de Wet inschakeling werkzoekenden][ref3], wordt toegevoegd aan de
      subsidie van het daaropvolgende kalenderjaar dan wel in dat jaar wordt besteed aan laatstgenoemde
      wet of de [Wet sociale werkvoorziening][ref4], wordt toegevoegd aan de uitkering, bedoeld in
      [artikel 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref5], van het eerste kalenderjaar waarop
      laatstgenoemde wet betrekking heeft, onderscheidenlijk besteed aan de [Wet sociale werkvoorziening][ref6].


