preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering van de Wet werk en bijstand en enkele
    daarmee samenhangende onderwerpen te regelen, zulks onder intrekking van de Algemene bijstandswet, de Invoeringswet
    herinrichting Algemene Bijstandswet, de Wet inschakeling werkzoekenden, de Wet financiering Abw, IOAW en IOAZ en
    het Besluit in- en doorstroombanen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015704/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Peildatum: de dag voorafgaand aan de inwerkingtreding van de [Wet werk en bijstand][ref1];

      c. [Algemene bijstandswet][ref2]: de [Algemene bijstandswet][ref3] zoals deze luidde op de peildatum;

      d. [Wet inschakeling werkzoekenden][ref4]: de [Wet inschakeling werkzoekenden][ref5] zoals deze luidde op de
      peildatum;

      e. [Wet financiering Abw, IOAW en IOAZ][ref6]: de [Wet financiering Abw, IOAW en IOAZ][ref7] zoals deze luidde op
      de peildatum;

      f. [Besluit in- en doorstroombanen][ref8]: het [Besluit in- en doorstroombanen][ref9] zoals dit luidde op de
      peildatum;

      g. IOAZ: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref10];

      h. IOAW: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref11];

      i. College: het college van burgemeester en wethouders, bedoeld in de [artikelen 10, derde lid][ref12], en
      [40, eerste lid, van de Wet werk en bijstand][ref13].


