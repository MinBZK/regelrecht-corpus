articles:
  - number: '1'
    text: |-
      Het percentage, bedoeld in de [artikelen 12, tweede lid, van de Algemene Kinderbijslagwet][ref1],
      [17, derde lid][ref2], [18, vierde lid][ref3], [29, derde lid][ref4],
      [29a, zesde lid][ref5], en [67, negende lid, van de Algemene nabestaandenwet][ref6],
      [2, elfde en twaalfde lid, van de Wet op het kindgebonden budget][ref7] en
      [62, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref8], voor een woonland anders dan:

      a. Nederland,

      b. een van de andere lidstaten van de Europese Unie,

      c. een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, en

      d. Zwitserland;

      bedraagt het in de bijlage bij deze regeling opgenomen percentage.


