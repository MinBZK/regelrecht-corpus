preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is een Nederlands Forensisch Instituut (hierna te noemen NFI).

      2 Het NFI ressorteert onder het Directoraat-Generaal Rechtshandhaving van het Ministerie van Justitie.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel1
  - number: '2'
    text: Het hoofd van het NFI wordt aangewezen door de Minister van Justitie en draagt de titel algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel2
  - number: '3'
    text: |-
      De algemeen directeur bewaakt de integriteit van het NFI en draagt, met inachtneming van de door de Minister van
      Justitie vereiste normen, bij voortduring zorg voor:

      a. de kwaliteit van de werkzaamheden, de producten en de bedrijfsvoering,

      b. de deskundigheid van de medewerkers.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel3
  - number: '4'
    text: |-
      Met het oog op de waarheidsvinding in strafzaken staat het NFI op het terrein van de forensische wetenschap ten
      dienste van het openbaar ministerie, de politie, overige personen en instanties die zijn belast met de opsporing
      van strafbare feiten, de zittende magistratuur en het ministerie van Justitie.

      Indien de bijzondere deskundigheid van het NFI of gronden aan het algemeen belang ontleend daartoe aanleiding
      geeft/geven, kan in overleg met de Minister van Justitie worden besloten dat het NFI ook diensten verricht
      in het kader van de ondersteuning bij de daadwerkelijke handhaving van de (inter)nationale rechtsorde of de
      hulpverleningstaak van politie (artikel 2, Politiewet 1993) dan wel ten behoeve van enig andere zaak.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel4
  - number: '5'
    text: |-
      De kerntaken van het NFI zijn:

      a. het verrichten van onafhankelijk forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en
      natuurwetenschappelijk gebied en het ter zake daarvan uitbrengen van verslag;

      b. het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken zowel ten behoeve van het NFI als
      politie en justitie;

      c. het zijn van (inter)nationaal kennis- en expertisecentrum op het gebied van het forensisch onderzoek.

      Op basis van bovenstaande kerntaken verleent het NFI producten en diensten op de terreinen van de forensische
      wetenschap.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel5
  - number: '6'
    text: |-
      1 De algemeen directeur van het NFI oefent de aan hem verleende bevoegdheden uit binnen de door de Minister van
      Justitie aangegeven kaders.

      2 De Minister stelt ten behoeve van een taakuitvoering van het NFI middelen ter beschikking.

      3 De algemeen directeur van het NFI legt met betrekking tot de besteding van de middelen, bedoeld in het tweede
      lid, rekening en verantwoording af.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel6
  - number: '7'
    text: |-
      Voor diensten welke worden verricht ten behoeve van personen en instellingen als genoemd in artikel 4 kunnen met
      inachtneming van de ter zake opgestelde regels kosten in rekening worden gebracht. Indien de ter zake opgestelde
      regels in een concreet geval geen duidelijkheid verschaffen overlegt de algemeen directeur van het NFI met de
      Directeur-Generaal Rechtshandhaving.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel7
  - number: '8'
    text: |-
      De Taakbeschikking Gerechtelijk Laboratorium en de Taakbeschikking voor het Laboratorium voor Gerechtelijke
      Pathologie (beschikkingen van 30 en 31 juli 1993, Stcrt. 150) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel8
  - number: '9'
    text: |-
      Deze beschikking wordt gepubliceerd in de Staatscourant en het Algemeen Politieblad en treedt in werking met ingang
      van de tweede dag na de datum van de uitgifte van de Staatscourant waarin deze beschikking wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel9
  - number: '10'
    text: Deze beschikking kan worden aangehaald als 'Taakbeschikking Nederlands Forensisch Instituut'.
    url: https://wetten.overheid.nl/BWBR0013052/2001-12-05#Artikel10
