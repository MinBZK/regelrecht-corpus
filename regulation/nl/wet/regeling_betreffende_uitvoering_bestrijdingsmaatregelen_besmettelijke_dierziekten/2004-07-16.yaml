preamble:
  text: |-
    Gelet op Richtlijn nr. 80/217/EEG van de Raad van de Europese Gemeenschappen van 22 januari 1980 tot vaststelling
    van gemeenschappelijke maatregelen ter bestrijding van klassieke varkenspest (PbEG L 47), Richtlijn nr. 85/511/EEG
    van de Raad van de Europese Gemeenschappen van 18 november 1985 tot vaststelling van gemeenschappelijke maatregelen
    ter bestrijding van mond- en klauwzeer (PbEG L 315), Richtlijn nr. 92/35/EEG van de Raad van de Europese
    Gemeenschappen van 29 april 1992 tot vaststelling van controlevoorschriften en van maatregelen ter bestrijding
    van paardepest (PbEG L 157), Richtlijn nr. 92/40/EEG van de Raad van de Europese Gemeenschappen van 19 mei 1992
    tot vaststelling van communautaire maatregelen voor de bestrijding van aviaire influenza (PbEG L 167), Richtlijn
    nr. 92/66/EEG van de Raad van de Europese Gemeenschappen van 14 juli 1992 tot vaststelling van communautaire
    maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L 260), Richtlijn nr. 92/119/EEG van de Raad van
    de Europese Gemeenschappen van 17 december 1992 tot vaststelling van algemene communautaire maatregelen voor de
    bestrijding van bepaalde dierziekten en van specifieke maatregelen ten aanzien van de vesiculaire varkensziekte
    (PbEG 1993, L 62) en Richtlijn nr. 93/53/EEG van de Raad van de Europese Gemeenschappen van 24 juni 1993 tot
    vaststelling van minimale communautaire maatregelen voor de bestrijding van bepaalde visziekten (PbEG L 175);

    Gelet op artikel 23 van de Gezondheids- en welzijnswet voor dieren en artikel 3, vierde lid, van de Destructiewet;

    Gezien het advies van de Raad voor dierenaangelegenheden, het Landbouwschap, het Produktschap Vee en Vlees,
    het Produktschap voor Pluimvee en Eieren, het Produktschap voor Vis en Visprodukten, het Bedrijfschap voor de
    Pluimveehandel en -industrie en het Bedrijfschap voor de Handel in Vee;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            wet:

              [Gezondheids- en welzijnswet voor dieren][ref1];



            b
             ambtenaar:

              ambtenaar, bedoeld in [artikel 114, tweede lid, van de wet][ref2];



            c
             Minister:

              Minister van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel1
