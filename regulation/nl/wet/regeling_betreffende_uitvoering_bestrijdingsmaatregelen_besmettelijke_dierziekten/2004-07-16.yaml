        artikel: '114'
  - number: '2'
    text: |-
      Als modellen van de waarschuwingsborden, bedoeld in [artikel 22, eerste lid, onderdeel c, van de wet][ref1],
      die geplaatst worden ter aanduiding van een gebied waar ingevolge [artikel 30 van de wet][ref2] een verbod tot
      vervoeren van kracht is, worden vastgesteld de in [Bijlage II][ref3] opgenomen modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0007936
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0007936
  - number: '3'
    text: |-
      1 Als modellen van de kentekenen, bedoeld in [artikel 22, eerste lid, onderdeel d, van de wet][ref1], die
      geplaatst worden bij een gebouw of terrein dat besmet is of van besmetting is verdacht worden vastgesteld de in
      [Bijlage III][ref2], [onder a][ref3], opgenomen modellen.

      2 Als model van het kenteken, bedoeld in artikel 22, tweede lid, onderdeel c, dat wordt gehecht aan een
      bijenwoning, wordt vastgesteld het in [Bijlage III][ref4], [onder b][ref5], opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007936
      [ref3]: https://wetten.overheid.nl/BWBR0007936
      [ref4]: https://wetten.overheid.nl/BWBR0007936
      [ref5]: https://wetten.overheid.nl/BWBR0007936
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0007936
      - id: ref3
        bwb_id: BWBR0007936
      - id: ref4
        bwb_id: BWBR0007936
      - id: ref5
        bwb_id: BWBR0007936
  - number: '4'
    text: |-
      1 De kentekenen of waarschuwingsborden worden aan de ingang van de besmette of van besmetting verdachte gebouwen en
      terreinen, aan de bijenwoning of rondom het krachtens artikel 30 van de wet aangewezen gebied aangebracht, gehecht
      of geplaatst en wel zodanig dat zij duidelijk van de openbare weg af zichtbaar zijn.

      2 Waarschuwingsborden kunnen langs de openbare weg vooraangekondigd worden.
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel4
  - number: '5'
    text: |-
      Het onschadelijk maken, bedoeld in artikel 22, eerste lid, onderdeel g, en het vernietigen, bedoeld in
      [artikel 22, tweede lid, onderdelen f en g van de wet][ref1], geschiedt:

      a. overeenkomstig de [Destructiewet][ref2] indien er sprake is van hoog-risico-materiaal, tenzij onschadelijkmaking
      door verbranden of begraven wordt bevolen;

      b. indien er geen sprake is van hoog-risico-materiaal:

      i. door verbranden, onderploegen, broeien, vermenging met een ontsmettingsmiddel als bedoeld in [artikel 9][ref3]
      of bij mest door verwerken in een mestverwerkingsinrichting, onverminderd de bepalingen van het Besluit gebruik
      dierlijke meststoffen op grond waarvan de mest tijdelijk wordt opgeslagen;

      ii. bij melk en melkprodukten en drijfmest mede door verandering van de zuurgraad of

      iii. door droge sterilisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002244
      [ref3]: https://wetten.overheid.nl/BWBR0007936#Artikel9
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0002244
      - id: ref3
        bwb_id: BWBR0007936
        artikel: '9'
        paragraaf: '4'
  - number: '6'
    text: |-
      1 Het verbranden, bedoeld in [artikel 5, onderdeel a][ref1], geschiedt door verbranding tot as ter plaatse of in
      een verbrandingsoven.

      2 Het begraven, bedoeld in [artikel 5, onderdeel a][ref2], geschiedt op zodanige diepte, dat de afstand van het
      hoogste gedeelte van hetgeen begraven wordt tot aan de rand van de kuil ten minste een meter bedraagt. De bodem
      van de kuil en hetgeen begraven wordt, wordt met een laag ongebluste kalk ter dikte van een decimeter bestrooid om
      tenslotte met een laag aarde tot minimaal aan de rand van de kuil te worden bedekt. Het begraven geschiedt op een
      geschikt terrein teneinde verontreiniging van het grondwater en iedere andere milieuhinder te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0007936#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007936#Artikel5
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007936
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007936
        artikel: '5'
        paragraaf: '3'
  - number: '7'
    text: |-
      1 Aan de ontsmetting gaat reiniging vooraf, behoudens die gevallen waarbij, ter beoordeling van de ambtenaar,
      wegens besmettingsgevaar voor de personen die met het reinigen zijn belast, voor de reiniging en ontsmetting eerst
      een voorlopige ontsmetting dient plaats te vinden. De reiniging dient plaats te vinden binnen de door de ambtenaar
      aangegeven termijn.

      2 De reiniging van gebouwen, terreinen, bewaarplaatsen van mest, dieren, voorwerpen en produkten geschiedt op de in
      de bijlage I beschreven wijze.

      3 Onverminderd het tweede lid dient de reiniging en ontsmetting in overeenstemming te zijn met de voor de
      betreffende dierziekte geldende communautaire bestrijdingsrichtlijn.
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel7
  - number: '8'
    text: |-
      Het ontsmetten van gebouwen, terreinen, bewaarplaatsen van mest, bijenwoningen, dieren, voorwerpen en produkten
      moet gericht zijn op het effectief en efficient onschadelijk maken van de smetstof, waarbij elk geval op zichzelf
      dient te worden beoordeeld en geschiedt op de in de bijlage I beschreven wijze.
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel8
  - number: '9'
    text: |-
      Het ontsmetten geschiedt met de volgende middelen:

      a. hitte in de vorm van:

      1. vuur;

      2. hete lucht;

      3. stoom;

      4. kokend water;

      b. ontsmettingsmiddelen die voor dat doel zijn toegelaten op grond van de [Bestrijdingsmiddelenwet 1962][ref1];

      c. andere door de Minister vast te stellen ontsmettingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: '10'
    text: |-
      De ambtenaar beslist in elk bijzonder geval op welke wijze het onschadelijk maken, het vernietigen en het reinigen
      en ontsmetten zal geschieden en welke reinigings- en ontsmettingsmiddelen daarbij moeten worden

      gebruikt.
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel10
  - number: '11'
    text: |-
      1 Na afloop van de reiniging vindt controle plaats door de ambtenaar.

      2 Het onschadelijk maken, het vernietigen en de ontsmetting geschieden onder leiding en toezicht van de in eerste
      lid bedoelde personen.

      3 De reiniging en ontsmetting wordt door de ambtenaar geregistreerd.
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel11
  - number: '12'
    text: In gevallen waarin deze regeling niet voorziet, beslist de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0007936/2004-07-16#Artikel12
  - number: '13'
    text: |-
      De Regeling houdende aanwijzing insectenverdelgingsmiddelen als ontsmettingsmiddel als bedoeld in artikel 10,
      onderdeel b, subonderdeel 13 van het Besluit van 23 februari 1922, ter uitvoering der [artikelen 6][ref1],
      [25][ref2], [30][ref3], [32][ref4] en [57 der Veewet][ref5] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel6
