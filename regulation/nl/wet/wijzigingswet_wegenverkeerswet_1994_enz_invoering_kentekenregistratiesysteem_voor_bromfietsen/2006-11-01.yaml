preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een kentekenregistratiesysteem voor bromfietsen
    in te voeren en in verband daarmee de Wegenverkeerswet 1994 en enkele andere wetten te wijzigen alsmede
    overgangsbepalingen terzake vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018326/2006-11-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      Aanvragen van kentekenbewijzen als bedoeld in [artikel IV][ref1] die zijn ingediend voor het tijdstip waarop
      dit artikel krachtens [artikel VI, tweede lid][ref2], vervalt, worden na dit tijdstip afgehandeld overeenkomstig
      [artikel IV][ref3], zoals dit luidde voor dit tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0018326#ArtikelIV
      [ref2]: https://wetten.overheid.nl/BWBR0018326#ArtikelVI
