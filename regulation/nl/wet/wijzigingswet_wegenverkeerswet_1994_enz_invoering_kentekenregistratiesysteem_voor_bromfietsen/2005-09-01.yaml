preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een kentekenregistratiesysteem voor bromfietsen
    in te voeren en in verband daarmee de Wegenverkeerswet 1994 en enkele andere wetten te wijzigen alsmede
    overgangsbepalingen terzake vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelAanhef
articles:
  - number: IV.1
    text: |-
      In afwijking van de [artikelen 48, eerste lid][ref1], en [50, eerste lid, van de Wegenverkeerswet 1994][ref2]
      wordt voor wat betreft bromfietsen die voor de datum van inwerkingtreding van [artikel I][ref3] van deze wet in
      het verkeer zijn gebracht, een kentekenbewijs door de Dienst Wegverkeer afgegeven zonder dat ten aanzien van de
      bromfiets waarvoor de afgifte wordt verlangd, behoeft te worden voldaan aan het in [artikel 48, eerste lid][ref4],
      bepaalde inzake de toelating van het voertuig of het gewijzigde voertuig tot het verkeer op de weg, mits wordt
      voldaan aan het tweede tot en met elfde lid alsmede het bepaalde krachtens het twaalfde en dertiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0018326#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '50'
      - id: ref3
        bwb_id: BWBR0018326
        artikel: I
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '48'
  - number: IV.2
    text: |-
      In het kader van de aanvraag van een kentekenbewijs stelt de eigenaar of houder van de bromfiets
      het voertuig voor een onderzoek ter beschikking van een door de Dienst Wegverkeer op grond van
      [artikel 62 van de Wegenverkeerswet 1994][ref1] erkend bedrijf waaraan de bevoegdheid is toegekend om een zodanig
      onderzoek te verrichten. Het erkende bedrijf stelt in het kader van het onderzoek de bij ministeriële regeling
      vastgestelde gegevens ten aanzien van de bromfiets vast en meldt deze gegevens terstond op door de Dienst
      Wegverkeer vastgestelde wijze aan deze dienst. Tevens vermeldt het bedrijf de gegevens op een registratieformulier
      en geeft dit vervolgens af aan de aanvrager. Indien de gegevens niet volledig, niet duidelijk of geheel niet
      kunnen worden vastgesteld, vermeldt het bedrijf dit op het formulier. De Dienst Wegverkeer stelt het model van het
      registratieformulier vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: IV.3
    text: |-
      De Dienst Wegverkeer onderwerpt ten minste drie van elke honderd voertuigen na een verricht onderzoek
      steekproefsgewijs aan een heronderzoek met het oog op een juiste uitvoering van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.4
    text: |-
      De aanvrager van een kentekenbewijs voor een bromfiets, ten aanzien waarvan een heronderzoek wordt geëist,
      is verplicht het voertuig op de plaats van het onderzoek beschikbaar te houden totdat het heronderzoek heeft
      plaatsgevonden. Deze verplichting geldt voor een periode van ten hoogste 90 minuten na de in het tweede lid
      bedoelde melding aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.5
    text: |-
      Het registratieformulier van een bromfiets, waarvoor een heronderzoek wordt geëist, wordt pas afgegeven op het
      moment dat de periode, bedoeld in het vierde lid, is verstreken of nadat het heronderzoek heeft plaatsgevonden.
      De geldigheid van het registratieformulier vervalt indien de aanvrager van het kentekenbewijs niet voldoet aan de
      in het vierde lid bedoelde verplichting of indien de gegevens op het formulier niet in overeenstemming zijn met de
      gegevens op het voertuig.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.6
    text: |-
      In afwijking van het tweede lid kan de eigenaar of houder van de bromfiets op aanvraag en tegen betaling van het
      door de Dienst Wegverkeer vastgestelde tarief het voertuig voor een onderzoek in het kader van de aanvraag van
      een kentekenbewijs ter beschikking stellen van de Dienst Wegverkeer. De Dienst Wegverkeer stelt in het kader van
      het onderzoek de bij ministeriële regeling vastgestelde gegevens ten aanzien van de bromfiets vast, vermeldt deze
      gegevens op het registratieformulier en geeft dit vervolgens af aan de aanvrager. Indien de gegevens niet volledig,
      niet duidelijk of geheel niet kunnen worden vastgesteld vermeldt de Dienst Wegverkeer dit op het formulier. Het
      derde tot en met het vijfde lid zijn niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.7
    text: |-
      De aanvrager van een kentekenbewijs verschijnt vervolgens persoonlijk bij een bij ministeriële
      regeling aangewezen instantie. Hij legt daarbij het in het tweede of zesde lid bedoelde
      registratieformulier alsmede een bij ministeriële regeling aangewezen legitimatiebewijs over. De
      instantie zendt de desbetreffende aanvraag met de bijbehorende gegevens naar de Dienst Wegverkeer.
      [Artikel 50, derde en vierde lid, van de Wegenverkeerswet 1994][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
  - number: IV.8
    text: |-
      De Dienst Wegverkeer neemt de aanvraag in behandeling en controleert de in het kader van het onderzoek, bedoeld
      in het tweede of zesde lid, verkregen gegevens en de gegevens ontvangen van de instantie, bedoeld in het zevende
      lid. Vervolgens geeft deze dienst een kentekenbewijs af, tenzij het negende lid van toepassing is, en verzendt het
      daarop naar de aanvrager.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.9
    text: |-
      De Dienst Wegverkeer houdt de beslissing op de aanvraag aan indien uit het in het tweede of zesde lid bedoelde
      registratieformulier blijkt dat het voertuigidentificatienummer op het voertuig onduidelijk of onvolledig is dan
      wel ontbreekt. De aanvrager kan in dat geval aan de Dienst Wegverkeer verzoeken om tot inslag of herinslag van
      bedoeld nummer over te gaan. In bij ministeriële regeling te bepalen gevallen geschiedt deze inslag of herinslag
      volgens de bij die regeling vastgestelde voorschriften door de Dienst Wegverkeer tegen betaling, op de door deze
      dienst vastgestelde wijze, van het door die dienst daarvoor vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.10
    text: 'De Dienst Wegverkeer weigert de afgifte van een kentekenbewijs indien:'
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.10.a
    text: |-
      de in het achtste lid bedoelde gegevens niet met elkaar in overeenstemming zijn of niet overeenkomen met de aan de
      dienst bekende gegevens;
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.10.b
    text: |-
      naar het oordeel van de dienst blijkt dat een of meer van de gegevens die op het voertuig moeten zijn aangebracht,
      geheel of gedeeltelijk ontbreken;
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.10.c
    text: |-
      voor wat betreft voertuigen die na 31 december 1973 in het verkeer zijn gebracht, naar het oordeel van de dienst
      blijkt dat het voertuig niet behoort tot een goedgekeurd type;
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.10.d
    text: voor het voertuig al eerder een kenteken is opgegeven;
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.10.e
    text: aan de dienst gebleken is dat het betrokken voertuig is gestolen of verduisterd, dan wel
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.10.f
    text: in andere bij algemene maatregel van bestuur vastgestelde gevallen overeenkomstig daarbij vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.11
    text: |-
      Bromfietsen die voor het tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet in het verkeer zijn
      gebracht, zijn voorzien van een bij algemene maatregel van bestuur vastgestelde aanduiding totdat voor het
      betrokken voertuig overeenkomstig dit artikel een kentekenbewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018326#ArtikelI
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0018326
        artikel: I
  - number: IV.12
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden vastgesteld omtrent het tweede tot en met elfde lid.
      Deze regels kunnen in elk geval betrekking hebben op het heronderzoek en de verplichtingen van de aanvrager in het
      kader daarvan, alsmede op het voeren van een aanduiding als bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: IV.13
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld ter uitvoering van het tweede tot en met elfde
      lid alsmede het bepaalde krachtens het twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelIV
  - number: V
    text: |-
      Aanvragen van kentekenbewijzen als bedoeld in [artikel IV][ref1] die zijn ingediend voor het tijdstip waarop
      dit artikel krachtens [artikel VI, tweede lid][ref2], vervalt, worden na dit tijdstip afgehandeld overeenkomstig
      [artikel IV][ref3], zoals dit luidde voor dit tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0018326#ArtikelIV
      [ref2]: https://wetten.overheid.nl/BWBR0018326#ArtikelVI
      [ref3]: https://wetten.overheid.nl/BWBR0018326#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0018326
        artikel: IV
      - id: ref2
        bwb_id: BWBR0018326
        artikel: VI
      - id: ref3
        bwb_id: BWBR0018326
        artikel: IV
  - number: VI.1
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelVI
  - number: VI.2
    text: |-
      [Artikel IV][ref1] vervalt met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      onderdelen daarvan verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018326#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0018326/2005-09-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0018326
        artikel: IV
