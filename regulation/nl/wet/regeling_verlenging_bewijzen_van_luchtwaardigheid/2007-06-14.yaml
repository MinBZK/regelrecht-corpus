preamble:
  text: |-
    Gelet op artikel 77, tweede lid, van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - Airworthiness Review: herbeoordeling van de luchtwaardigheid van een luchtvaartuig,
        - Airworthiness Review Certificate (ARC): een certificaat zoals gedefinieerd in
      [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref1],
        - algemene luchtvaart: luchtvaart met vleugelvliegtuigen met een maximale startmassa 5700 kg of minder, helikopters
      met een maximale startmassa 2730 kg of minder, ballonnen, hete luchtschepen en (motor)zweefvliegtuigen,
        - amateurluchtvaartuig: een luchtvaartuig dat, al dan niet volgens eigen ontwerp, is gebouwd door een amateurbouwer
      voor privé-gebruik, zonder commercieel oogmerk,
        - BvL: bewijs van luchtwaardigheid,
        - BvL-verlengingsinspectie: de inspectie van een luchtvaartuig in het kader van de verlenging van het BvL, naar
      aanleiding waarvan de minister wordt geadviseerd over de luchtwaardigheid van dat luchtvaartuig,
        - Continuous Airworthiness Management Organisation (CAMO): een organisatie zoals gedefinieerd in
      [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref2],
        - erkend bedrijf: een door de minister op grond van [artikel 93 van de RTL][ref3], tot het verrichten van onderhoud
      aan luchtvaartuigen erkend bedrijf,
        - erkend zweefvliegtechnicus: een zweefvliegtechnicus zoals gedefinieerd in artikel 1, onder a, van de Regeling
      erkende zweefvliegtechnici,
        - gemachtigde: een door het bedrijf aangewezen personeelslid, dat gemachtigd is een BvL-verlengingsinspectie uit te
      voeren en het rapport daarover te ondertekenen,
        - inspectie-instituut: een instituut zoals gedefinieerd in artikel 1, onder b, van de Regeling erkende
      zweefvliegtechnici,
        - JAR-OPS: JAR zoals gedefinieerd in [artikel 1, onder b, van de Regeling vergunning tot vluchtuitvoering][ref4],
        - JAR 145: JAR zoals gedefinieerd in [artikel 1, tweede lid, onder ab, van de RTL][ref5],
        - MAL: mededelingen aan Nederlandse luchtvarenden en eigenaren van luchtvaartuigen,
        - maximale startmassa: de startmassa, zoals gedefinieerd in [artikel 1, tweede lid, onder w, van de RTL][ref6],
        - de minister: de Minister van Verkeer en Waterstaat,
        - Part M: Bijlage 1 bij Verordening (EG) nr. 2042/2003 (PbEG L 315) waarin worden vastgesteld de maatregelen die
      moeten worden genomen om zeker te stellen dat de luchtwaardigheid van een luchtvaartuig wordt behouden, inclusief
      onderhoud, alsmede de voorwaarden die moeten worden vervuld door personen of organisaties die bij permanente
      luchtwaardigheid zijn betrokken,
        - Part 21: Part zoals gedefinieerd in [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref7],
        - Part 21, subpart H: subpart zoals gedefinieerd in [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref8],
        - ultra licht vliegtuig: een vliegtuig zoals gedefinieerd in
      [artikel 1, eerste lid, onder ab, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref9],
        - vergunninghouder: de houder van een op grond van [artikel 104, tweede lid, van de RTL][ref10] afgegeven
      vergunning tot vluchtuitvoering voor commercieel luchtvervoer volgens JAR-OPS.
        - Verordening (EG) nr. 1702/2003 (PbEG L 243):verordening zoals gedefinieerd in
      [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref11],
        - Verordening (EG) nr. 2042/2003 (PbEG L 315): verordening zoals gedefinieerd in
      [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref12].


