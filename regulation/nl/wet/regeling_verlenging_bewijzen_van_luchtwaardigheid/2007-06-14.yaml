  - number: '4'
    text: |-
      1 De minister is bevoegd een steekproef uit te voeren op een luchtvaartuig dat behoort tot de algemene luchtvaart.
      Op de aanvraag, bedoeld in [artikel 3, eerste lid][ref1], wordt door de eigenaar of houder van dat luchtvaartuig
      aangegeven op welke datum en op welke plaats in Nederland het luchtvaartuig gereed zal staan voor een mogelijke
      steekproef.

      2 Tussen de datum waarop de aanvraag bij de minister wordt ingediend en de datum van de mogelijke steekproef wordt
      een termijn van ten minste 8 dagen aangehouden.

      3 De eigenaar of houder neemt zo spoedig mogelijk contact op met de minister als het luchtvaartuig door overmacht
      niet op de in de aanvraag aangegeven plaats of datum gereed kan staan voor een mogelijke steekproef.


      [ref1]: https://wetten.overheid.nl/BWBR0011596#Artikel3
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel4
