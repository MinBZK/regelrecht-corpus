        artikel: '3'
        paragraaf: '3'
  - number: '5'
    text: |-
      1 De minister is bevoegd een steekproef uit te voeren op een luchtvaartuig dat niet behoort tot de algemene
      luchtvaart, in het kader van het houden van toezicht op het erkende bedrijf of de vergunninghouder.

      2 Datum, tijdstip en plaats worden door de minister, na overleg met de eigenaar of houder van het luchtvaartuig,
      vastgesteld en schriftelijk aan de eigenaar of houder meegedeeld.
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel5
  - number: '6'
    text: |-
      1 De minister verleent op aanvraag aan een erkend bedrijf de bevoegdheid tot het uitvoeren van BvL-
      verlengingsinspecties, indien:

      a. het bedrijf zijn bedrijfshandleiding heeft uitgebreid met een procedure met betrekking tot deze inspecties, en
      deze procedure is opgenomen in het kwaliteitsborgingssysteem van het erkende bedrijf, en

      b. de inspectie wordt uitgevoerd door een gemachtigde die de vereiste kennis, bedrevenheid en ervaring heeft,
      onafhankelijk is van het technisch beheer van het onderhoud van het luchtvaartuig en door de minister is
      geaccepteerd.

      2 De bevoegdheid tot het uitvoeren van BvL-verlengingsinspecties wordt opgenomen in het aanhangsel behorende bij
      het bewijs van erkenning.

      3 De in het eerste lid bedoelde bevoegdheid geldt voor het uitvoeren van BvL- verlengingsinspecties voor
      luchtvaartuigen die genoemd worden in de erkenning, met dien verstande dat voor bedrijven die werkzaamheden
      uitvoeren aan luchtvaartuigen die behoren tot de algemene luchtvaart, een regime geldt zoals omschreven in
      [bijlage 2][ref1].

      4 De aanvraag wordt ingediend door middel van een volledig ingevuld en ondertekend formulier, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0011596
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011596
  - number: '7'
    text: |-
      1 De minister verleent op aanvraag aan een erkend zweefvliegtechnicus de bevoegdheid tot het uitvoeren van BvL-
      verlengingsinspecties, indien:

      a. de erkend zweefvliegtechnicus, door tussenkomst van het inspectie-instituut, het handboek kwaliteitszorg
      voor erkende zweefvliegtechnici heeft uitgebreid met een procedure met betrekking tot deze inspecties, en deze
      procedure onderdeel is van de overeenkomst aangaande het toezicht van het inspectie-instituut op de erkend
      zweefvliegtechnicus, en

      b. de erkend zweefvliegtechnicus onafhankelijk is van het technisch beheer van het onderhoud van het luchtvaartuig.

      2 De bevoegdheid tot het uitvoeren van BvL-verlengingsinspecties wordt opgenomen in het aanhangsel behorende bij
      het bewijs van erkenning als zweefvliegtechnicus.

      3 De in het eerste lid bedoelde bevoegdheid geldt voor het uitvoeren van BvL-verlengingsinspecties voor
      (motor)zweefvliegtuigen waarvoor de erkend zweefvliegtechnicus erkend is onderhoudswerkzaamheden uit te voeren,
      zoals omschreven in [bijlage 2][ref1].

      4 [Artikel 6, vierde lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011596
      [ref2]: https://wetten.overheid.nl/BWBR0011596#Artikel6
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel7
