      - id: ref2
        bwb_id: BWBR0011596
        artikel: '6'
        paragraaf: '5'
  - number: '8'
    text: |-
      1 De minister verleent op aanvraag aan een vergunninghouder de bevoegdheid tot het uitvoeren van BvL-
      verlengingsinspecties, indien:

      a. de vergunninghouder zijn bedrijfshandleiding heeft uitgebreid met een procedure met betrekking tot die
      inspecties, en deze procedure is opgenomen in het kwaliteitsborgingssysteem van de vergunninghouder, en

      b. de inspectie wordt uitgevoerd door een gemachtigde die de vereiste kennis, bedrevenheid en ervaring heeft,
      onafhankelijk is van het technisch beheer van het onderhoud van het luchtvaartuig en door de minister is
      geaccepteerd.

      2 De bevoegdheid tot het uitvoeren van BvL-verlengingsinspecties wordt opgenomen in een aanhangsel behorende bij de
      vergunning tot vluchtuitvoering.

      3 De in het eerste lid bedoelde bevoegdheid geldt voor het uitvoeren van BvL-verlengingsinspecties voor de
      luchtvaartuigen die deel uitmaken van de eigen vloot van de vergunninghouder.

      4 [Artikel 6, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011596#Artikel6
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011596
        artikel: '6'
        paragraaf: '5'
  - number: '9'
    text: |-
      De minister kan de bevoegdheid tot het uitvoeren van BvL-verlengingsinspecties intrekken, indien:

      a. de voorwaarden op grond waarvan die bevoegdheid is verleend, niet worden nagekomen,

      b. een positief advies is uitgebracht over een niet luchtwaardig luchtvaartuig, of

      c. positieve adviezen zijn uitgebracht die op onderdelen onjuist zijn, zonder dat er sprake is van niet
      luchtwaardige luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel9
  - number: '10'
    text: |-
      1 Degene die bevoegd is tot het uitvoeren van een BvL-verlengingsinspectie bepaalt de inhoud van de technische
      inspectie, met dien verstande dat in de algemene luchtvaart tenminste de `check and inspect'-punten van de 100-
      uursinspectie of jaarlijkse inspectie of een daaraan gelijkwaardige inspectie worden uitgevoerd, indien de laatste
      inspectie langer dan een half jaar geleden heeft plaatsgevonden.

      2 De BvL-verlengingsinspectie wordt niet eerder dan twee maanden voor het verlopen van de termijn van geldigheid
      van het bewijs van luchtwaardigheid uitgevoerd.

      3 Uiterlijk op de ochtend van de datum van de steekproef is het inspectierapport conform het model volgens bijlage
      1 voor de minister beschikbaar.
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel10
  - number: '11'
    text: |-
      Aanvragen voor het verlengen van de termijn van geldigheid van een bewijs van luchtwaardigheid kunnen tot zes
      maanden na de inwerkingtreding van deze regeling vergezeld gaan van een inspectierapport dat is opgesteld volgens
      de bijlage bij MAL 125/92 dan wel, indien met individuele bedrijven daarover afspraken zijn gemaakt, volgens de
      afspraken met het betreffende bedrijf.
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel11
  - number: '12'
    text: De Beleidsregel BVL-V-inspecties voor ballonnen en luchtschepen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel12
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling verlenging bewijzen van luchtwaardigheid.'
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel14
