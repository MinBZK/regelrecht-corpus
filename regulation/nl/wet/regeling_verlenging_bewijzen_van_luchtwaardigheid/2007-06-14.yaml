  - number: 3.a
    text: |-
      1 In afwijking van [artikel 3][ref1] kan de Minister bij een aanvraag voor de verlenging van de termijn van
      geldigheid van een standaard-BvL voor een luchtvaartuig uit de algemene luchtvaart, op basis van een positief
      advies na een BvL-verlengingsinspectie van het daartoe erkende bedrijf of erkende zweefvliegtechnicus, een
      standaard-BvL voor onbepaalde duur tezamen met een ARC voor 1 jaar afgeven.

      2 In afwijking van [artikel 3][ref2] geeft de Minister bij een aanvraag voor de verlenging van de termijn van
      geldigheid van een standaard-BvL voor een luchtvaartuig uit de algemene luchtvaart, op basis van een positieve
      rapportage na een Airworthiness Review, van een daartoe erkende CAMO, volgens de voorschriften van artikel A.710
      van Part M, een standaard-BvL voor onbepaalde duur tezamen met een ARC voor 1 jaar af.

      3 In afwijking van [artikel 3][ref3] geeft voor luchtvaartuigen die voldoen aan artikel A.901(b) van Part M een
      daartoe erkende CAMO zelf het ARC uitgeven na een Airworthiness Review volgens de voorschriften van artikel A.710
      van Part M. Een kopie van het rapport dat is opgemaakt naar aanleiding van deze Airworthiness Review en een kopie
      van het ARC wordt aan de Minister gestuurd tezamen met een aanvraag voor een standaard-BvL van onbepaalde duur
      conform Part 21 Subpart H. De Minister zal op basis daarvan een standaard-BvL voor onbepaalde duur afgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011596#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011596#Artikel3
