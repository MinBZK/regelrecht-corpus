  - number: '2'
    text: |-
      1 Deze regeling is niet van toepassing op amateurluchtvaartuigen en ultra lichte vliegtuigen.

      2 De minister kan deze regeling op verzoek van de eigenaar of houder van een amateurluchtvaartuig of een ultra
      licht vliegtuig toepassen.
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel2
  - number: '3'
    text: |-
      1 De eigenaar of houder van een luchtvaartuig dient bij de minister een aanvraag in voor de verlenging van
      de termijn van geldigheid van het bewijs van luchtwaardigheid, alsmede een volledig ingevuld en ondertekend
      inspectierapport over de BvL-verlengingsinspectie, uitgevoerd door een daartoe bevoegd verklaard erkend bedrijf,
      erkend zweefvliegtechnicus, dan wel vergunninghouder, conform het model volgens [bijlage 1][ref1].

      2 De aanvraag wordt ingediend door middel van een volledig ingevuld en ondertekend formulier, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.

      3 Het inspectierapport wordt ten minste 8 dagen voor de vervaldatum van de termijn van geldigheid van het bewijs
      van luchtwaardigheid ingediend.

      4 In afwijking van het eerste lid kan de minister wanneer bijzondere omstandigheden daartoe aanleiding geven de
      BvL-verlengingsinspectie uitvoeren. Hij voert de BvL-verlengingsinspectie in ieder geval uit wanneer er geen erkend
      bedrijf, zweefvliegtechnicus of vergunninghouder als bedoeld in het eerste lid is.

      5 Indien de BvL-verlengingsinspectie door de minister in het buitenland wordt uitgevoerd, verklaart de eigenaar of
      houder zich bereid om de eventuele kosten te dragen van een door de minister te verrichten onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0011596
    url: https://wetten.overheid.nl/BWBR0011596/2007-06-14#Artikel3
