        bwb_id: BWBR0007921
  - number: '5'
    text: |-
      Op een meting als bedoeld in [artikel 23, eerste lid][ref1], en [artikel 53, eerste lid, van het besluit][ref2] is
      de [Regeling meetmethoden emissie-eisen stookinstallaties milieubeheer B][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0004795
