        bwb_id: BWBR0004795
  - number: '6'
    text: |-
      De afvalstoffen opgenomen in de [bijlage bij de Regeling scheiden en gescheiden houden van
      gevaarlijk afvalstoffen](onbekend) zijn aangewezen als gevaarlijke afvalstoffen als bedoeld in
      [artikel 37, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel37
