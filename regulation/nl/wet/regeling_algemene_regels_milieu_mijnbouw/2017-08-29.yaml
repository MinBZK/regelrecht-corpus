  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder ‘besluit’: [Besluit algemene regels milieu mijnbouw][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023771
    url: https://wetten.overheid.nl/BWBR0023851/2017-08-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023771
  - number: '2'
    text: |-
      Bij de toepassing van het [besluit][ref1] worden de volgende niet publiekrechtelijke regelingen of normen
      aangewezen:

      NEN 5744: 1991: Nederlandse norm voor Bodem – Monsterneming van grondwater ten behoeve van de bepaling van metalen,
      anorganische verbindingen, matig-vluchtige organische verbindingen en fysisch-chemische eigenschappen, juni 1991;

      PGS 15: Richtlijn PGS 15, getiteld ‘Opslag van verpakte gevaarlijke stoffen; Richtlijn voor brandveiligheid en
      milieuveiligheid’, zoals gepubliceerd op www.minvrom.nl in juni 2005 en de errata van 5 juli 2005;

      PGS 30: Richtlijn PGS 30, getiteld ‘Vloeibare aardolieproducten, Buitenopslag in kleine installaties’, zoals
      gepubliceerd op www.minvrom.nl in juni 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0014394
    url: https://wetten.overheid.nl/BWBR0023851/2017-08-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014394
  - number: '3'
    text: |-
      Het brandbestrijdingsplan bedoeld in [artikel 16 van het besluit][ref1], bevat de informatie als bedoeld in
      [bijlage V behorend bij artikel 3.9, onderdeel c van de Arbeidsomstandighedenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0023851/2017-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0008587
  - number: '4'
    text: |-
      De etmaalwaarden van de verkeersbewegingen bedoeld in [artikel 21 van het besluit][ref1], worden beoordeeld volgens
      de circulaire [Beoordeling geluidhinder wegverkeer in verband met vergunningverlening w.m.][ref2] (Stcrt. 1996,
      44).


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007921
    url: https://wetten.overheid.nl/BWBR0023851/2017-08-29#Artikel4
