preamble:
  text: |-
    Gelet op artikel 3, eerste lid, van de Regeling landbouwgrond Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011148/2000-02-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als formulier, bedoeld in artikel 3, eerste lid, van de Regeling landbouwgrond Meststoffenwet, wordt voor de jaren
      2000 en volgende vastgesteld het formulier dat is opgenomen als bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0011148/2000-02-10#Artikel1
  - number: '2'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011148/2000-02-10#Artikel2
