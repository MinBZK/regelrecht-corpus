  - number: 1.4.3
    text: |-
      De subsidie wordt binnen zes weken na vaststelling in één termijn dan wel in een bij de subsidievaststelling te
      bepalen aantal termijnen betaald, doch niet eerder dan na aanvang van het subsidietijdvak.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.4.3
  - number: 1.4.4
    text: |-
      De subsidieontvanger dient binnen dertien weken na afloop van de activiteiten of na afloop van het
      subsidieverleningstijdvak bij de minister een verslag van werkzaamheden en een financiële verantwoording in.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.4.4
  - number: 2.1.1
    text: |-
      De minister kan subsidie verstrekken voor activiteiten die strekken tot of dienstig zijn aan bevordering van de
      naleving van mensenrechten, vooral in landen waar de meest elementaire burgerrechten en politieke rechten worden
      geschonden, door ondersteuning van slachtoffers van schending van mensenrechten of door het bevorderen van respect
      voor mensenrechten, voor zover subsidiëring op grond van het overigens krachtens artikel 3 van de Kaderwet bepaalde
      niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.1.1
  - number: 2.1.2
    text: |-
      Met het oog op en binnen het raam van de doelstelling genoemd in [Artikel 2.1.1, onder b][ref1], komen voor
      subsidie in aanmerking activiteiten gericht op of ter bevordering van:

      a. versterking van nationale en regionale bestuursstructuren en bestuurscapaciteit en verbetering van de kwaliteit
      van bestuur,

      b. versterking van controlemechanismen van de bevolking op het bestuur alsmede de participatie van verschillende
      maatschappelijke geledingen in bestuur, onder meer door het versterken van de institutionele capaciteit van zowel
      de particuliere sector als de samenleving als geheel,

      c. constitutionele ontwikkeling en verbetering van wetgeving en rechtshandhaving dan wel het tot stand brengen
      daarvan,

      d. nationale verzoening en het consolideren van een vredescultuur en overige daarmee verband houdende activiteiten
      of

      e. vrije en eerlijke verkiezingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.1.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.1.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 2.1.3
    text: |-
      De minister kan met het oog op de bevordering van het transitieproces in Midden- en Oost-Europa subsidie verlenen
      ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. vestiging en versterking van pluriforme, democratische rechtsstaten,

      b. de opbouw van een maatschappelijke middenveld of ’civil society’,

      c. het proces van toetreding tot de Europese Unie of

      d. de versterking van centrale overheden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.1.3
  - number: 2.1.4
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.1.3][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. de mondigheid en organisatiegraad van burgers, de pluriformiteit van maatschappelijke organisaties, de
      mogelijkheden tot betrokkenheid van burgers bij de inrichting van hun maatschappij en het particulier initiatief,

      b. het functioneren van de rechtsstaat, de kwaliteit van wetgeving, rechtshandhaving en rechtspraak en de
      rechtsbescherming van burgers,

      c. het democratisch gehalte en verbetering van het functioneren van overheden, de transparantie van
      overheidsoptreden en de toegankelijkheid van de overheid voor burgers,

      d. het toerusten van centrale en decentrale overheden voor hun rol in toetreding tot de Europese Unie en de
      bevordering van de aanpassingen die daartoe nodig zijn,

      e. de structuur, capaciteit, kwaliteit en bestuurskracht van centrale overheden of

      f. kennisoverdracht, het financieel ondersteunen van studerenden en de ontwikkeling en uitvoering van opleidingen,
      cursussen, trainingen en stages.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.1.3
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 2.1.5
    text: |-
      De minister kan subsidie verstrekken voor activiteiten die strekken tot of dienstig zijn aan de ontwikkeling en
      uitvoering van het beleid van de minister op het gebied van mensenrechten, democratisering, goed bestuur, vrede
      en veiligheid, het milieu, de internationale rechtsorde, internationale juridische en justitiële samenwerking,
      de bevordering van de multilaterale samenwerking of de verbetering van bilaterale betrekkingen, voor zover
      subsidiëring op grond van het overigens krachtens artikel 3 van de Kaderwet bepaalde niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.1.5
  - number: 2.3.1
    text: |-
      1 De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan structurele
      armoedebestrijding in ontwikkelingslanden door middel van de interventiestrategieën directe armoedebestrijding,
      maatschappijopbouw of beleidsbeïnvloeding.

      2 De activiteiten omvatten de ondersteuning van particuliere organisaties in ontwikkelingslanden die naar
      doelstelling en werkzaamheden zijn gericht op een of meer van de in het derde lid genoemde thema’s, op een
      specifieke doelgroep, land of een regio dan wel op een andere wijze, als voorzien in een beleidsvoornemen, bedoeld
      in [artikel 1.1.6][ref1], betekenisvol bijdragen aan de realisering van de doelstelling, genoemd in het eerste lid.

      3 De thema’s, bedoeld in het tweede lid, zijn:

      a. duurzame economische ontwikkeling,

      b. menselijke ontwikkeling,

      c. sociaal-culturele ontwikkeling,

      d. politieke ontwikkeling,

      e. vrede en veiligheid,

      f. milieu en water, en

      g. gendergelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.6
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.6
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 2.3.2
    text: |-
      1 Subsidie voor activiteiten, bedoeld in [artikel 2.3.1, tweede lid][ref1], kan worden verleend aan particuliere
      organisaties zonder winstoogmerk die zijn gericht of mede gericht op structurele armoedebestrijding in de zin van
      [artikel 2.3.1][ref2].

      2 De beoordeling van subsidieaanvragen vindt plaats aan de hand van de maatstaven waarop de gegevens, bedoeld in de
      [artikelen 2.3.12][ref3] en [2.3.13][ref4], betrekking hebben.

      3 Organisaties, gevestigd in een ontwikkelingsland, wier activiteiten geheel of overwegend op dat land zijn gericht
      komen niet voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
