  - number: 2.3.10
    text: |-
      1 Subsidie wordt met toepassing van [artikel 1.1.7, derde lid][ref1], eens per jaar verleend voor een tijdvak van
      ten hoogste vier jaar.

      2 In afwijking van [artikel 1.1.6, eerste lid][ref2], maakt de minister uiterlijk negen maanden voorafgaand aan het
      subsidietijdvak zijn beleidsvoornemens bekend.

      3 Aanvragen kunnen tot uiterlijk 15 mei in het jaar voorafgaand aan het subsidietijdvak bij de minister worden
      ingediend. De minister beslist uiterlijk drie maanden voorafgaand aan het subsidietijdvak.

      4 Subsidie kan slechts worden verleend tot ten hoogste 65% van de jaarlijkse uitgaven van de ontvanger.
      Subsidieaanvragen om een bedrag lager dan € 100.000 komen niet voor toekenning in aanmerking.

      5 Geen subsidie wordt verleend indien dit tot samenloop met een andere aan dezelfde ontvanger op grond van
      deze afdeling verleende subsidie zou leiden. Organisaties die reeds direct of indirect door de minister worden
      gesubsidieerd komen niet in aanmerking voor een instellingssubsidie op grond van deze afdeling. Organisaties die op
      grond van deze afdeling een instellingssubsidie ontvangen komen niet in aanmerking voor een andere door de minister
      te verlenen subsidie, behoudens in gevallen voorzien in de beleidsvoornemens, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.7
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.6
