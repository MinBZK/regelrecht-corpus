  - number: 2.3.3
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.3.1][ref1], omvat het thema duurzame
      economische ontwikkeling activiteiten die strekken tot of dienstig zijn aan een duurzame economische ontwikkeling,
      daaronder begrepen maatschappelijk verantwoord ondernemen en versterking van de positie van ontwikkelingslanden in
      het wereldhandelsverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.3
    references:
      - id: ref1
