  - number: 1.2.9
    text: Voorschotten die blijkens de vaststelling te veel betaald zijn, worden onverwijld aan de minister terugbetaald.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.9
  - number: 1.3.1
    text: |-
      1 Instellingssubsidies kunnen slechts worden verstrekt aan instellingen die zich geheel of in overwegende mate
      richten op het uitvoeren van activiteiten waarvoor krachtens artikel 3, eerste lid, van de Kaderwet subsidie kan
      worden verleend.

      2 Een subsidieaanvraag gaat voor de eerste maal vergezeld van:

      a. een afschrift van de statuten dan wel de reglementen van de subsidieaanvrager, zoals deze laatstelijk zijn
      vastgesteld of gewijzigd en

      b. de meest recente jaarrekening dan wel een overzicht van de financiële situatie van de subsidieaanvrager en van
      instellingen waarmee de subsidieaanvrager een organisatorische of financiële band heeft.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.3.1
  - number: 1.3.2
    text: |-
      1 [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing, tenzij bij de subsidieverlening
      anders is bepaald.

      2 Voor de toepassing van [artikel 1.1.7, eerste lid][ref2], geldt als datum van ontvangst van aanvragen die
      eerder dan dertien weken voor aanvang van het subsidietijdvak waarin de activiteiten zullen worden uitgevoerd zijn
      ingediend de dag waarop die termijn van dertien weken aanvangt.

      3 De [Artikelen 1.2.2][ref3] tot en met [1.2.4][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
