        bwb_id: BWBR0010173
        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 2.3.7
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.3.1][ref1], omvat het thema vrede en
      veiligheid activiteiten die strekken tot of dienstig zijn aan:

      a. conflictpreventie, -beheersing en -⁠beslechting,

      b. vredesopbouw of

      c. rehabilitatie ofwel wederopbouw na conflict.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.7
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 2.3.8
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.3.1][ref1], omvat het thema milieu en
      water activiteiten die betrekking hebben op:

      a. drinkwater en sanitatie,

      b. duurzaam geïrrigeerde landbouw,

      c. duurzaam strooomgebiedbeheer,

      d. capaciteitsopbouw op het gebied van geïntegreerd waterbeheer,

      e. milieutoetsing en daaraan verwante activiteiten,

      f. duurzaam beheer en gebruik van biodiversiteit en bossen,

      g. woestijnbestrijding,

      h. klimaatbeleid,

      i. duurzame toegang tot energiediensten, zo mogelijk met toepassing van duurzame technologie,

      j. technologische vernieuwing,

      k. duurzame handel en investeringen, of

      l. milieugerelateerde gezondheidsproblemen.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.8
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 2.3.9
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.3.1][ref1], omvat het thema
      gendergelijkheid activiteiten die strekken tot of dienstig zijn aan:

      a. bevordering van een integrale, systematische en duurzame inbedding en doorwerking van het genderaspect in beleid
      en uitvoering ten aanzien van de thema's, genoemd in [artikel 2.3.1, derde lid, onderdelen a tot en met f][ref2],
      of

      b. ondersteuning van de vrouwenbeweging in ontwikkelingslanden.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.9
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0010173
