        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 2.3.4
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.3.1][ref1], omvat het thema menselijke
      ontwikkeling activiteiten die strekken tot of dienstig zijn aan:

      a. zorg voor reproductieve en seksuele gezondheid,

      b. activiteiten gericht op het voorkomen van een verdere verspreiding van HIV en AIDS en op beperking van de
      nadelige individuele en maatschappelijke gevolgen daarvan, of

      c. basisgezondheidszorg in relatie tot reproductieve gezondheid en HIV en AIDS.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.4
