preamble:
  text: |-
    Gelet op Artikel 3, eerste en tweede lid, van de Kaderwet subsidies Ministerie van Buitenlandse Zaken;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:



            a
             activiteitensubsidie:

              subsidie ten behoeve van activiteiten, gericht op vooraf omschreven doelstellingen en resultaten;



            b
             instellingssubsidie:

              subsidie ten behoeve van de integrale kosten van de werkzaamheden van een instelling;



            c
            ontwikkelingslanden:

              landen, vermeld in deel I, Developing Countries and Territories, van de in het kader van de Organisatie
      voor Economische Samenwerking en Ontwikkeling (OESO) door het Development Assistence Committee (DAC) meest recent
      vastgestelde List of Aid Recipients;



            d
            Kaderwet:

              [Kaderwet subsidies Ministerie van Buitenlandse Zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010178
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0010178
  - number: 1.1.2
    text: |-
      Subsidie op grond van deze regeling kan worden verstrekt voor de activiteiten, genoemd in [hoofdstuk II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010173#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0010173
        hoofdstuk: II
  - number: 1.1.3
    text: |-
      De bepalingen van dit hoofdstuk zijn van toepassing op de verstrekking van subsidies door de minister, voor zover
      krachtens artikel 3, tweede lid, van de Kaderwet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.3
  - number: 1.1.4
    text: |-
      Subsidie wordt slechts verleend aan rechtspersonen waarvan de statutaire doelstelling past binnen het doel van de
      subsidieverlening, die:

      a. in staat zijn tot een adequaat financieel beheer en

      b. door ervaringsdeskundigheid met betrekking tot activiteiten als waarvoor subsidie wordt gevraagd, een
      doelgerichte en doelmatige uitvoering van de activiteiten kunnen waarborgen.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.4
  - number: 1.1.5
    text: |-
      Subsidie kan in afwijking van [Artikel 1.1.4][ref1] worden verleend aan natuurlijke personen die voldoen aan
      [Artikel 1.1.4, onder a en b][ref2], indien dit met het oog op de uitvoering van de activiteiten waarvoor subsidie
      wordt verleend in het bijzonder aangewezen moet worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.4
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.4
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010173
        artikel: 1.1.4
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 1.1.5a
    text: |-
      Subsidie kan worden geweigerd, ingetrokken, vastgesteld op een lager bedrag dan bij de verlening is bepaald of
      gewijzigd ten nadele van de subsidieontvanger in het geval en onder de voorwaarden, bedoeld in [artikel 3 van de
      Wet bevordering integriteitsbeoordelingen door het openbaar bestuur](onbekend).
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.5a
  - number: 1.1.6
    text: |-
      1 De minister maakt uiterlijk twee weken voor aanvang van elk subsidietijdvak ten aanzien van elk van de krachtens
      artikel 3, eerste lid, van de Kaderwet nader bepaalde activiteiten zijn beleidsvoornemens met betrekking tot de
      verlening van subsidie bekend. De minister kan bij die gelegenheid tevens bekend maken welk bedrag in dat tijdvak
      beschikbaar is voor subsidieverlening, het subsidieplafond.

      2 Het subsidietijdvak, bedoeld in het eerste lid, valt samen met het kalenderjaar, tenzij bij de bekendmaking op
      grond van het eerste lid anders is bepaald.

      3 Bekendmaking van de beleidsvoornemens vindt plaats in de Staatscourant dan wel op een andere geschikte wijze,
      onder kennisgeving daarvan in de Staatscourant. Bekendmaking van de beleidsvoornemens kan achterwege blijven
      indien deze reeds bij eerdere gelegenheid zijn bekendgemaakt. De minister geeft daarvan kennis in de Staatscourant
      uiterlijk twee weken voor aanvang van het subsidietijdvak. Bekendmaking van een subsidieplafond vindt plaats in
      de Staatscourant.

      4 De minister kan bij de bekendmaking van een subsidieplafond bepalen dat bij de beoordeling van aanvragen mede
      acht wordt geslagen op een spreiding van uitgaven over de loop van het subsidietijdvak alsmede per categorie
      activiteiten afzonderlijke bedragen vaststellen voor doelgroepen, regio’s, thema’s, aard van de activiteiten, vorm
      van de subsidie en andere voor de subsidieverlening relevante invalshoeken.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.6
  - number: 1.1.7
    text: |-
      1 De minister behandelt subsidieaanvragen in volgorde van binnenkomst.

      2 De minister beslist binnen dertien weken na ontvangst van de aanvraag. De minister kan deze termijn verlengen met
      ten hoogste dertien weken.

      3 In afwijking van het eerste en tweede lid kan de minister bij de bekendmaking van zijn beleidsvoornemens dan wel
      het subsidieplafond bepalen dat met het oog op een onderlinge afweging van aanvragen dan wel met het oog op een
      spreiding van uitgaven over het subsidietijdvak op aanvragen wordt beslist na een of meer bepaalde data. Daarbij
      kan de minister bepalen dat met het oog op een verdeling van de beschikbare middelen de aanvragen die voor de
      aangeduide datum worden ingediend, worden gerangschikt naar bij de bekendmaking aangeduide maatstaven.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.7
  - number: 1.1.8
    text: |-
      1 De minister neemt bij de beoordeling van subsidieaanvragen, mede in relatie tot overige aanvragen waarop nog niet
      is beslist, in acht de mate waarin:

      a. de activiteiten bijdragen aan het realiseren van de doelstellingen van de subsidie, als omschreven krachtens
      artikel 3 van de Kaderwet,

      b. de subsidie in evenredige verhouding staat tot aard, omvang en beoogde resultaten van de activiteiten,

      c. de activiteiten een meer dan incidentele uitwerking kunnen hebben en

      d. draagvlak voor de activiteiten bestaat, bijvoorbeeld blijkend uit een bijdrage in de kosten door betrokkenen.

      2 De minister kan bij de beoordeling van subsidieaanvragen mede betrekken:

      a. de positie van vrouwen,

      b. de gevolgen voor het milieu,

      c. de naleving van internationaal aanvaarde humanitaire principes door de subsidieaanvrager, alsmede

      d. de gevolgen voor internationaal erkende burger-, politieke, economische, sociale en culturele rechten van de
      mens.

      3 De minister kan bij de beoordeling van subsidieaanvragen voorts rekening houden met:

      a. een spreiding van uitgaven over de loop van het subsidietijdvak,

      b. de mate waarin een spreiding van de beschikbare middelen over verschillende ontvangers bijdraagt aan de
      doelmatigheid van de besteding daarvan en in een evenredige verhouding staat tot de administratieve lasten bij de
      verstrekking van subsidie,

      c. de mate waarin de activiteiten waarvoor subsidie wordt gevraagd voorzien in een behoefte, mede gelet op het
      geheel van gesubsidieerde en anderszins bekostigde activiteiten en

      d. een evenwichtige spreiding over doelgroepen, regio’s, thema’s, aard van de activiteiten, vorm van de subsidie en
      andere voor de subsidieverlening relevante invalshoeken.

      4 Met het oog op de toepassing van dit Artikel kan de minister met toepassing van [Artikel 1.1.7, derde lid][ref1],
      de beslissing omtrent subsidieverlening aanhouden, zolang besluitvorming omtrent later ingediende aanvragen niet
      tot uitputting van de beschikbare middelen zou leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.7
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.8
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.7
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 1.1.9
    text: Subsidie wordt geweigerd indien de aanvraag wordt ingediend na aanvang van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.9
  - number: 1.1.10
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde wordt subsidie geweigerd indien:

      a. verlening niet verenigbaar is met het beleid van de minister ten aanzien van de buitenlandse betrekkingen en
      de ontwikkelingssamenwerking, zoals onder andere kenbaar uit de memorie van toelichting bij de begroting van het
      Ministerie van Buitenlandse Zaken, uit het verkeer tussen de minister en de Staten-Generaal, uit de bekendmaking
      van zijn beleidsvoornemens op grond van [Artikel 1.1.6, eerste lid][ref1], of uit andere geschikte vormen van
      bekendmaking of mededeling,

      b. het volkenrecht of andere internationale verplichtingen voor het Koninkrijk zich verzetten tegen verlening van
      de subsidie of

      c. de beschikbare middelen zijn uitgeput.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.6
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.10
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.6
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 1.1.11
    text: |-
      Subsidie wordt slechts verleend indien de aanvrager aannemelijk maakt dat de hem ten dienste staande financiële
      middelen, met inbegrip van de subsidie, voldoende zullen zijn om de voorgenomen activiteiten uit te voeren.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.11
  - number: 1.1.12
    text: |-
      Subsidie wordt verleend voor een bij de subsidieverlening vast te stellen tijdvak, maar niet langer dan voor
      de duur van de activiteiten. De minister kan op aanvraag van de subsidieontvanger het subsidieverleningstijdvak
      verlengen, zonder aanpassing van het subsidiebedrag, indien de activiteiten waarvoor subsidie werd verleend niet
      binnen het oorspronkelijke tijdvak konden worden voltooid.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.12
  - number: 1.1.13
    text: |-
      Subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [Artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: 1.1.14
    text: |-
      1 Subsidie wordt slechts verleend voor de noodzakelijke kosten van de voorgenomen activiteiten in het licht van de
      beoogde doelstellingen en resultaten voor zover redelijkerwijs niet gevergd kan worden dat deze uit eigen middelen
      of anderszins bekostigd worden.

      2 Subsidie wordt niet verleend ter dekking van tekorten na afloop van de activiteiten.

      3 Bij de subsidieverlening kan de minister bepalen dat het subsidiebedrag door hem kan worden bijgesteld in het
      licht van onvoorziene ontwikkelingen die niet aan de subsidieontvanger kunnen worden toegerekend en redelijkerwijze
      niet voor diens risico gelaten kunnen worden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.14
  - number: 1.1.15
    text: |-
      Bij de subsidieverlening kan worden bepaald dat de kosten van de activiteiten, bedoeld in
      [Artikel 1.1.14, eerste lid][ref1], op normatieve grondslag worden vastgesteld op voet van de gerealiseerde
      resultaten van de activiteiten of op andere bij de subsidieverlening bepaalde grondslag en dat in het
      subsidiebedrag een genormeerde vergoeding voor de personele en materiële kosten van de subsidieontvanger is
      begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.14
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.15
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.14
        hoofdstuk: I
        paragraaf: '6'
        afdeling: '1'
  - number: 1.1.16
    text: Subsidieverlening gaat vooraf aan subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.16
  - number: 1.1.17
    text: |-
      De minister kan aan de hand van een door de aanvrager verstrekte liquiditeitsprognose met betrekking tot de te
      subsidiëren activiteiten voorafgaand aan de subsidievaststelling voorschotten verlenen tot ten hoogste een bij de
      subsidieverlening vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.17
  - number: 1.1.18
    text: |-
      De minister beslist binnen dertien weken na ontvangst van de aanvraag tot subsidievaststelling. De minister kan
      deze termijn verlengen met ten hoogste dertien weken.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.18
  - number: 1.1.19
    text: |-
      1 De subsidieontvanger draagt zorg voor een overzichtelijke en doelmatige administratie die een juist, volledig en
      actueel beeld geeft van de activiteiten waarvoor subsidie is verleend en de verwezenlijking van de daarmee beoogde
      resultaten alsmede van de daarmee gemoeide uitgaven en inkomsten.

      2 Van alle uitgaven die betrekking hebben op activiteiten waarvoor subsidie is verleend alsmede van alle
      inkomsten die in aanmerking kunnen worden genomen bij de vaststelling van de subsidie bewaart de subsidieontvanger
      deugdelijke bewijsstukken.

      3 Als boekjaar geldt het kalenderjaar, tenzij bij de subsidieverlening anders is bepaald.

      4 De administratie en de daarbij behorende stukken worden tenminste tien jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.19
  - number: 1.1.20
    text: |-
      1 De subsidieontvanger draagt zorg voor een doelmatige besteding van de subsidie. De subsidie, daaronder begrepen
      de daarop ontvangen renteopbrengsten, wordt uitsluitend besteed voor de activiteiten waarvoor zij blijkens de
      subsidieverlening is bestemd.

      2 Bij de besteding van de subsidie doet de subsidieontvanger recht aan de volkenrechtelijke positie van het
      Koninkrijk.

      3 De subsidieontvanger geeft in voorkomend geval blijk van zijn bereidheid om zijn activiteiten af te stemmen op
      soortgelijke activiteiten van andere organisaties.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.20
  - number: 1.1.21
    text: |-
      1 De minister kan bij de subsidieverlening bepalen dat de subsidieontvanger op bij de verlening te bepalen
      tijdstippen de minister inlichtingen verstrekt over de voortgang van de activiteiten waarvoor subsidie is verleend
      en de verwezenlijking van de daarmee beoogde resultaten alsmede van de daarmee gemoeide uitgaven en inkomsten.

      2 De subsidieontvanger stelt de minister onverwijld in kennis van feiten of omstandigheden die redelijkerwijs van
      belang kunnen zijn voor wijziging of intrekking van de verlening of voor vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.21
  - number: 1.1.22
    text: |-
      In de beschikking tot subsidieverlening kunnen ten aanzien van goederen die met de subsidie worden aangeschaft
      voorschriften worden gegeven omtrent gebruik en bestemming daarvan na afloop van het subsidieverleningstijdvak
      of na uitvoering van de activiteiten waarvoor de goederen zijn verworven. De minister kan daarbij bepalen dat de
      goederen om niet of tegen een door hem te bepalen vergoeding worden overgedragen aan hem of aan door hem aan te
      wijzen derden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.22
  - number: 1.1.23
    text: |-
      In de beschikking tot subsidieverlening kan worden bepaald dat de minister vrijelijk en om niet gebruik kan maken
      van alle voortbrengselen waarop auteurs- of andere intellectuele eigendomsrechten kunnen gelden, die geheel of
      gedeeltelijk met de subsidie worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.23
  - number: 1.1.24
    text: |-
      De subsidieontvanger maakt bij publicaties inzake gesubsidieerde activiteiten en in correspondentie met derden
      die bij de uitvoering van de activiteiten zijn betrokken melding van de omstandigheid dat de activiteiten geheel
      of gedeeltelijk bekostigd zijn uit een subsidie verleend door de minister, tenzij de aard van de activiteiten, de
      hoedanigheid van de ontvanger of andere gewichtige omstandigheden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.1.24
  - number: 1.2.1
    text: |-
      1 De aanvraag tot verlening van een activiteitensubsidie omvat:

      a. een activiteitenplan,

      b. een begroting en

      c. een liquiditeitsprognose voor de eerstvolgende twaalf maanden.

      2 Indien de aanvraag om subsidie eerder dan dertien weken voor aanvang van het subsidietijdvak waarin de
      activiteiten zullen aanvangen wordt ingediend, schort de minister de behandeling op tot dertien weken voor aanvang
      van het subsidietijdvak. Voor de toepassing van [Artikel 1.1.7][ref1] geldt als datum van ontvangst van de aanvraag
      de dag waarop de termijn van dertien weken aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.7
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.7
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 1.2.2
    text: |-
      Het activiteitenplan omvat een overzicht van activiteiten, naar aard, omvang, fasering en onderling verband, in
      relatie tot de daarmee beoogde doelstellingen en resultaten en verwachte effecten voor de eerstvolgende twaalf
      maanden van het subsidieverleningstijdvak. Doelstellingen, resultaten en effecten worden waar mogelijk uitgedrukt
      in meetbare grootheden. Indien de activiteiten zich over een tijdvak van meer dan twaalf maanden uitstrekken gaat
      het activiteitenplan vergezeld van een globaal overzicht van werkzaamheden, doelstellingen, resultaten en verwachte
      effecten voor de resterende periode van het subsidieverleningstijdvak.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.2
  - number: 1.2.3
    text: |-
      De begroting geeft inzicht in de inkomsten, daaronder begrepen bijdragen van derden en uitgaven gerelateerd aan de
      voorgenomen activiteiten voor de eerstvolgende twaalf maanden van het subsidieverleningstijdvak en is voorzien van
      een postgewijze toelichting. Indien de activiteiten zich over een tijdvak van meer dan twaalf maanden uitstrekken
      gaat de begroting vergezeld van een financiële raming voor de daaropvolgende periode.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.3
  - number: 1.2.4
    text: |-
      1 Indien de activiteiten zich over een tijdvak van meer dan twaalf maanden uitstrekken, verstrekt de
      subsidieontvanger uiterlijk dertien weken voor aanvang van de dertiende maand een activiteitenplan, vergezeld
      van een begroting en een liquiditeitsprognose voor de daarop volgende periode van twaalf maanden. Bij de
      subsidieverlening kan worden bepaald dat activiteitenplan en begroting voor elke nieuwe periode de goedkeuring van
      de minister behoeven.

      2 Bij de subsidieverlening kan de minister bepalen dat het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.4
  - number: 1.2.5
    text: |-
      1 De subsidieontvanger draagt zorg dat de begroting niet wordt overschreden.

      2 Blijkt dat de werkelijke uitgaven aanzienlijk lager blijven of de inkomsten aanzienlijk hoger zijn dan de
      begroting, dan stelt de subsidieontvanger de minister daarvan zo spoedig mogelijk in kennis, onder opgave van de
      verschillen en de oorzaken daarvan.

      3 Wijzigingen van activiteitenplan en begroting worden vooraf schriftelijk aan de minister ter goedkeuring
      voorgelegd. Indien binnen acht weken na indiening van het verzoek om goedkeuring de minister niet van bedenkingen
      heeft blijk gegeven, is het verzoek goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.5
  - number: 1.2.6
    text: |-
      Indien de activiteiten zich over een tijdvak van meer dan een kalenderjaar uitstrekken kan bij de subsidieverlening
      worden bepaald dat de vaststelling van de subsidie plaats vindt per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.6
  - number: 1.2.7
    text: |-
      De aanvraag tot vaststelling van een activiteitensubsidie geschiedt binnen zes maanden na afloop van het
      subsidieverleningstijdvak dan wel na afloop van de activiteiten dan wel, indien toepassing is gegeven aan
      [Artikel 1.2.6][ref1], telkens binnen zes maanden na afloop van elk kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.2.6
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.2.7
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.2.6
        hoofdstuk: I
        afdeling: '2'
  - number: 1.2.8
    text: |-
      1 De aanvraag tot vaststelling geschiedt aan de hand van een verslag van werkzaamheden en een financiële
      verantwoording.

      2 Het verslag van werkzaamheden biedt inzicht in de mate waarin en de wijze waarop het activiteitenplan is
      uitgevoerd aan de hand van een overzicht van aard en omvang van de werkzaamheden en de daarmee behaalde resultaten.

      3 De financiële verantwoording biedt inzicht in de besteding van de subsidie, daaronder begrepen de daarop
      ontvangen renteopbrengsten, en verschaft de gegevens die voor de vaststelling van de subsidie noodzakelijk zijn. De
      verantwoording is ingericht overeenkomstig de begroting.

      4 Indien het subsidiebedrag gelijk is aan of hoger is dan € 5.000.000 of indien dit bij de subsidieverlening
      is bepaald, is [Artikel 4:78 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing. Het
      accountantsonderzoek, bedoeld in Artikel 4:78, eerste lid, heeft tevens betrekking op de naleving van de
      aan de subsidie verbonden voorschriften. In afwijking van Artikel 4:78, vierde lid, kan de verklaring,
      bedoeld in Artikel 4:78, derde lid, na afloop van het boekjaar worden ingediend, indien daartoe uit
      oogpunt van doelmatigheid van het onderzoek grond bestaat. De minister kan bij de subsidieverlening
      voorschriften verbinden aan de uitvoering van het onderzoek en de inrichting van de accountantsverklaring.
      De subsidieontvanger bedingt bij de accountant dat deze de voorschriften, bedoeld in de vorige volzin,
      in acht neemt en dat deze in voorkomend geval meewerkt aan de uitoefening van het toezicht op grond van
      [Artikel 6 van de Kaderwet subsidies Ministerie van Buitenlandse Zaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel478
      [ref2]: https://wetten.overheid.nl/BWBR0010178#Artikel6
