  - number: 2.3.11
    text: |-
      In de aanvraag zet de organisatie, onverminderd het overigens in deze regeling bepaalde, uiteen op welke wijze zij
      voldoet aan de vereisten die voortvloeien uit [artikel 2.3.1][ref1]. De aanvraag omvat daartoe een uiteenzetting
      over de organisatie en over de door haar voorgenomen werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.11
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 2.3.12
    text: |-
      In de uiteenzetting over de organisatie besteedt de aanvrager aandacht aan:

      a. de mate van draagvlak in de Nederlandse samenleving,

      b. de geschiedenis, missie en de relatie tussen missie en armoedebestrijding,

      c. de gehanteerde interventiestrategieën,

      d. de aard en kwaliteit van de relaties met partnerorganisaties,

      e. de aard en kwaliteit van de relaties met derden,

      f. de effecten en de duurzaamheid van de resultaten van de werkzaamheden van de organisatie,

      g. de wijze waarop organisatiestructuur en -cultuur bijdragen aan een doelmatige en doelgerichte dienstverlening
      aan partnerorganisaties en derden,

      h. de wijze waarop het beleid van de organisatie ten aanzien van personeel en innovatie bijdraagt aan een
      doelmatige en doelgerichte inzet van middelen,

      i. de wijze waarop de organisatie gestalte geeft aan de bewaking van voortgang en kwaliteit van beleid en
      programma’s van de organisatie, en

      j. het door de organisatie gevoerde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.12
  - number: 2.3.13
    text: |-
      In de uiteenzetting over de voorgenomen werkzaamheden komen aan de orde:

      a. de bijdrage van de werkzaamheden aan structurele armoedebestrijding in de zin van [artikel 2.3.1][ref1],

      b. de relatie tussen de aanvraag en de op grond van [artikel 1.1.6][ref2] door de minister geformuleerde
      beleidsvoornemens,

      c. de mate waarin de voorgenomen activiteiten vernieuwend zijn,

      d. het belang van de subsidie voor het verwezenlijken van de missie van de organisatie en voor haar continuïteit,

      e. het verband tussen doelen, middelen en resultaten,

      f. de mate waarin de beoogde resultaten specifiek, meetbaar, acceptabel, realistisch en tijdgebonden zijn
      omschreven,

      g. de doelgerichtheid en doelmatigheid van de inzet van middelen,

      h. de wijze waarop kwaliteitsbeheer, monitoring en evaluatie van de werkzaamheden gestalte krijgt,

      i. de mate waarin de voorgenomen werkzaamheden een hefboomeffect op andere initiatieven zullen genereren,

      j. de mate waarin en de wijze waarop de voorgenomen werkzaamheden een duurzame uitwerking zullen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.6
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.13
