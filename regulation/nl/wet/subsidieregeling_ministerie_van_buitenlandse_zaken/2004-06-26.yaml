  - number: 2.4.6
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan de uitvoering
      van internationaal onderwijs en - onderzoek dat een bijdrage levert aan de ontwikkeling en uitvoering van het
      beleid van de minister op het gebied van de ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.4.6
  - number: 2.4.7
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan een
      versterking van onderzoekscapaciteit in ontwikkelingslanden, bevordering van vraaggericht onderzoek, verbetering
      van de relatie tussen onderzoek en beleid of stimulering van samenwerking tussen onderzoekers in Nederland en in
      ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.4.7
  - number: 2.4.8
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.4.7][ref1], komen voor subsidie
      in aanmerking:

      a. meerjarig, multidisciplinair, locatiespecifiek onderzoek,

      b. meerjarig, multidisciplinair, bilateraal onderzoek gebaseerd op samenwerking tussen onderzoekers in Nederland en
      in ontwikkelingslanden en

      c. thematisch onderzoek, zoals op het terrein van landbouw, gezondheid, internationale economie, technologie,
      kleinbedrijf, conflict, geschiedenis en cultuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.4.7
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.4.8
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.4.7
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '4'
  - number: 2.4.11
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die in ontwikkelingslanden strekken tot of dienstig
      zijn aan:

      a. verbetering van de kwaliteit van het hoger onderwijs,

      b. institutionele versterking van instellingen voor hoger onderwijs of

      c. het vergroten van de capaciteit en de kwaliteit van menselijke hulpbronnen.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.4.11
  - number: 2.4.12
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.4.11][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. samenwerking tussen Nederlandse onderwijsinstellingen en onderwijsinstellingen in ontwikkelingslanden,

      b. financiële ondersteuning van studerenden in of afkomstig uit ontwikkelingslanden of

      c. kennisoverdracht, zoals het ontwikkelen en uitvoeren van cursussen, trainingen en stages.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.4.11
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.4.12
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.4.11
        hoofdstuk: II
        paragraaf: '5'
        afdeling: '4'
  - number: 2.4.16
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan bevordering
      van de sociale en politieke banden en de economische samenwerking tussen Nederland en landen die uit oogpunt van
      het beleid inzake de internationale betrekkingen specifieke aandacht behoeven.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.4.16
  - number: 2.5.1
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan bevordering
      van de internationale betrekkingen op cultureel gebied.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.5.1
  - number: 2.5.2
    text: |-
      1 Voor subsidie met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.5.1][ref1], komen
      in aanmerking:

      a. activiteiten in Nederland die de reputatie van Nederland als internationale culturele ontmoetingsplaats
      bevorderen,

      b. activiteiten tot behoud of herstel van Nederlands cultureel erfgoed,

      c. culturele presentaties waarvoor een bijzondere internationale belangstelling bestaat,

      d. samenwerkingsprojecten tussen Nederland en landen waarmee Nederland door nabuurschap, door culturele en
      historische betrekkingen, door hun betekenis als land van herkomst van in Nederland levende migranten of anderszins
      een bijzondere band heeft,

      e. grootschalige culturele manifestaties die een bijzondere bijdrage leveren aan de internationale profilering van
      Nederland op cultureel gebied,

      f. activiteiten die een bijdrage leveren aan een versterking van de culturele infrastructuur in de vorm van
      organisatorische en personele voorzieningen,

      g. kleinschalige lokale culturele projecten in het buitenland, gericht op de plaatselijke bevolking met een
      herkenbare Nederlandse component en

      h. activiteiten met het oog op de uitvoering van culturele verdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.5.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.5.2
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.5.1
        hoofdstuk: II
        afdeling: '5'
  - number: 2.5a.1
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. versterking van de culturele identiteit en de bevordering van het cultureel zelfbewustzijn van gemeenschappen in
      ontwikkelingslanden of

      b. de bevordering van het begrip tussen de verschillende culturen in ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.5a.1
  - number: 2.5a.2
    text: De subsidie wordt als activiteitensubsidie verleend.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.5a.2
  - number: 2.6.5
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan de sociaal-
      economische ontwikkeling en de bestrijding van armoede in ontwikkelingslanden door het bevorderen van personele
      samenwerking.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.5
  - number: 2.6.6
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.6.5][ref1], komen voor subsidie
      in aanmerking activiteiten gericht op of ter bevordering van personele samenwerking van Nederlandse organisaties
      werkzaam op het gebied van ontwikkelingssamenwerking en organisaties in ontwikkelingslanden aan de hand van een
      samenhangend geheel van activiteiten met een evenwichtige en doelmatige spreiding over doelgroepen, sectoren,
      prioritaire gebieden en andere beleidsaccenten.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.6.5
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.6
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.6.5
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '6'
  - number: 2.6.7
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan de sociaal-
      economische ontwikkeling en de bestrijding van armoede in ontwikkelingslanden door versterking van de vakbeweging
      in ontwikkelingslanden en bevordering van arbeidsrechten.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.7
  - number: 2.6.8
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.6.7][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van behoud of versterking van de positie van de vakbeweging
      in ontwikkelingslanden en bevordering van arbeidsrechten aan de hand van een over meerdere continenten gespreid
      en samenhangend geheel van activiteiten met een evenwichtige en doelmatige spreiding over doelgroepen, sectoren,
      prioritaire gebieden en andere beleidsaccenten.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.6.7
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.8
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.6.7
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '6'
  - number: 2.6.9
    text: |-
      Voor subsidie komen in aanmerking Nederlandse vakcentrales, gericht op de ondersteuning van ontwikkelingsprocessen
      in ontwikkelingslanden, die beschikken over een netwerk van relaties dat is toegesneden op thematische, sectorale
      en regionale spreiding van de activiteiten waarvoor subsidie wordt verleend en een daarmee samenhangende
      maatschappelijke verankering in Nederland.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.9
  - number: 2.6.10
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan de sociaal-
      economische ontwikkeling en de bestrijding van armoede in ontwikkelingslanden door een duurzame verbetering van de
      positie van groepen mensen in ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.10
  - number: 2.6.11
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.6.10][ref1], komen voor subsidie
      in aanmerking activiteiten gericht op of ter bevordering van ontwikkelingsprocessen in ontwikkelingslanden door
      de beschikbaarstelling van deskundigheid en financiële middelen door Nederlandse organisaties aan organisaties in
      ontwikkelingslanden en ten behoeve van de uitvoering van ontwikkelingsprojecten.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.6.10
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.11
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.6.10
        hoofdstuk: II
        paragraaf: '4'
        afdeling: '6'
  - number: 2.6.12
    text: |-
      Voor subsidie komen in aanmerking in Nederland gevestigde niet op het maken van winst gerichte rechtspersonen
      die naar statutaire doelstelling en feitelijke werkzaamheden zijn gericht op structurele armoedebestrijding in
      ontwikkelingslanden door de beschikbaarstelling van deskundigheid en beschikken over een netwerk van relaties en
      een ondersteuningsstructuur die een doeltreffende en doelmatige inzet van deze deskundigheid waarborgen.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.12
  - number: 2.6.13
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. versterking van het lokaal bestuur in ontwikkelingslanden door samenwerking met Nederlandse gemeenten,

      b. bevordering van kleinschalige plaatselijke of regionale activiteiten in Nederland met het oog op vergroting van
      kennis en inzicht in en de meningsvorming over ontwikkelingsamenwerking of het draagvlak voor het beleid inzake
      ontwikkelingsamenwerking: of

      c. bevordering van kleinschalige Nederlandse particuliere initiatieven op het terrein van
      ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.6.13
  - number: 2.7.1
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan versterking
      van de positie van ontwikkelingslanden in het wereldhandelsverkeer door de beschikbaarstelling van deskundigheid en
      andere vormen van assistentie aan overheden van ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.7.1
  - number: 2.7.3
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan bevordering
      van duurzame vergroting van werkgelegenheid en economische groei in ontwikkelingslanden door versterking van het
      bedrijfsleven in die landen of van transacties in het economisch verkeer met een vernieuwend of stimulerend effect
      op de verbetering van het milieu in ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.7.3
  - number: 2.7.4
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.7.3][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. de totstandkoming van joint-ventures van in Nederland gevestigde ondernemers afkomstig uit ontwikkelingslanden
      met partners in ontwikkelingslanden, door advisering, voorlichting en de beschikbaarstelling van bedrijfskredieten,

      b. de oprichting door in Nederland verblijvende ondernemers of aspirant ondernemers afkomstig uit
      ontwikkelingslanden van bedrijven in hun land van herkomst,

      c. de overdracht van kennis, inzichten en ervaringen van Nederlandse oud-managers aan en op verzoek van midden- en
      kleinbedrijven en instellingen in ontwikkelingslanden,

      d.

      e. deskundigheidsbevordering van ondernemers en hun werknemers in ontwikkelingslanden,

      f. kredietverstrekking aan ondernemers in ontwikkelingslanden,

      g.

      h. invoer van Nederlandse kapitaalgoederen, werken of diensten in ontwikkelingslanden,

      i. export van ontwikkelingslanden naar de Europese Unie,

      j.

      k. het verstrekken van financieringen en technische assistentie ten behoeve van bedrijven en financiële
      instellingen in ontwikkelingslanden.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.7.3
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.7.4
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.7.3
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '7'
  - number: 2.8.1
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan de
      verstrekking van leningen aan ontwikkelingslanden ten behoeve van investeringen in die landen tegen een rente die
      lager ligt dan de marktrente, door rentesubsidies en garantstellingen.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.8.1
  - number: 2.9.1
    text: |-
      1 De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. het lenigen, beperken of voorkomen van menselijke noden ten gevolge van conflicten, natuurrampen of andere
      noodsituaties of

      b. het ondersteunen van ontwikkelingen gericht op vreedzame beslechting van conflicten en verzoening van
      conflicterende belangen en van eerste aanzetten tot herstel en wederopbouw.

      2 Subsidie op grond van het eerste lid kan worden verleend ten behoeve van activiteiten in:

      a. ontwikkelingslanden en

      b. overige landen.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.9.1
  - number: 2.9.2
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.9.1, eerste lid, onder a][ref1],
      komen voor subsidie in aanmerking activiteiten gericht op of ter bevordering van:

      a. wat betreft acute noodsituaties directe hulpverlening gericht op toegang van slachtoffers tot primaire
      levensbehoeften,

      b. wat betreft chronische noodsituaties directe hulpverlening gericht op toegang van slachtoffers tot sociale
      basisvoorzieningen,

      c. versterking van de institutionele capaciteit, internationaal, in Nederland en in getroffen of kwetsbare
      gebieden, gericht op de leniging van acute menselijke noden,

      d. bevordering van de doelgerichtheid en doelmatigheid van de hulpverlening,

      e. beperking van humanitaire nood en materiële schade ten gevolge van rampen,

      f. het systematisch verzamelen en analyseren van informatie ten behoeve van de voortgangsbewaking en de evaluatie
      van hulpverlening in noodsituaties of

      g. deskundigheidsbevordering van degenen die met hulpverlening in noodsituaties zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.9.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.9.2
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.9.1
        hoofdstuk: II
        afdeling: '9'
  - number: 2.9.3
    text: |-
      1 Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.9.1, eerste lid, onder b][ref1],
      komen voor subsidie in aanmerking activiteiten gericht op of ter bevordering van:

      a. terugkeer en hervestiging van bevolkingsgroepen die ten gevolge van crises ontheemd zijn geraakt,

      b. de mogelijkheden voor slachtoffers om zelf in de benodigde bestaansmiddelen te voorzien,

      c. eerste aanzetten tot herstel en wederopbouw van fysieke infrastructuur, economie en maatschappij,

      d. opbouw, instandhouding en versterking van de institutionele capaciteit van organisaties gericht op
      conflictpreventie, - beheersing en -beslechting,

      e. deskundigheidsbevordering van degenen die met werkzaamheden op het gebied van conflictpreventie, -beheersing en
      -beslechting zijn belast of

      f. het systematisch verzamelen en analyseren van informatie ten behoeve van de voortgangsbewaking en de evaluatie
      van activiteiten op het gebied van conflictpreventie, -beheersing en -beslechting.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.9.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.9.3
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.9.1
        hoofdstuk: II
        afdeling: '9'
  - number: 2.9.4
    text: |-
      Onverminderd [Artikel 1.1.5][ref1] komen voor subsidieverlening op grond van [Artikel 2.9.2][ref2] uitsluitend in
      aanmerking rechtspersonen die voldoen aan de volgende eisen:

      a. naar doelstelling en feitelijke werkzaamheden gericht op een breed scala van werkzaamheden en

      b. wat betreft hulpverlening in noodsituaties aangesloten bij en handelend overeenkomstig de Code of Conduct for
      the International Red Cross and Red Crescent Movement and Non-Governmental Organizations in Disaster Relief of een
      daaraan gelijkwaardige gedragscode.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.5
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel2.9.2
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.9.4
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.5
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010173
        artikel: 2.9.2
        hoofdstuk: II
        afdeling: '9'
  - number: 2.9.5
    text: |-
      Subsidie kan worden verleend voor activiteiten waarmee reeds een aanvang is gemaakt indien:

      a. de activiteiten zo spoedeisend zijn dat van de aanvrager in redelijkheid niet gevergd kan worden dat deze zijn
      aanvraag voor aanvang daarvan had ingediend, b. de aanvrager bij aanvang van de activiteiten de minister daarvan in
      kennis heeft gesteld onder mededeling van het voornemen om een subsidieaanvraag in te dienen en

      c. de subsidieaanvraag binnen vier weken na aanvang van de activiteiten is ingediend.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.9.5
  - number: 2.9.6
    text: |-
      1 Af- en overschrijvingen tussen posten op de begroting voor activiteiten waarvoor op grond van
      [Artikel 2.9.2][ref1] subsidie is verleend, behoeven niet ter goedkeuring aan de minister te worden voorgelegd,
      indien:

      a. de af- en overschrijdingen het gevolg zijn gewijzigde of onvoorziene omstandigheden in een situatie van acute
      nood,

      b. de af- en overschrijdingen niet meer bedragen dan 25% van de desbetreffende posten en

      c. het totaal van de begroting niet wordt overschreden.

      2 Het eerste lid is niet van toepassing op vergoedingen voor expatriates, de aanschaf van transportmiddelen en van
      communicatie-apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.9.2
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.9.6
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.9.2
        hoofdstuk: II
        afdeling: '9'
  - number: 2.10.1
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. bevordering van kennis en inzicht in en de meningsvorming over aangelegenheden met betrekking tot
      ontwikkelingsamenwerking of

      b. bevordering van het draagvlak voor het beleid inzake ontwikkelingsamenwerking.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.10.1
  - number: 2.10.2
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.10.1][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. publieksvoorlichting in brede zin en voorlichting gericht op specifieke doelgroepen,

      b. themabijeenkomsten, congressen, discussiebijeenkomsten, internationale evenementen en manifestaties,

      c. de totstandkoming en distributie van publicaties of

      d. onderwijsactiviteiten die strekken tot of dienstig zijn aan het vergroten van de kennis over ontwikkelingslanden
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.10.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.10.2
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.10.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '10'
  - number: 2.10.3
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. bevordering van kennis en inzicht in en de meningsvorming over aangelegenheden met betrekking tot de
      buitenlandse betrekkingen,

      b. bevordering van het draagvlak voor het beleid inzake de buitenlandse betrekkingen of

      c. bevordering van een positieve beeldvorming over Nederland in het buitenland.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.10.3
  - number: 2.10.4
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.10.3][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. publieksvoorlichting in brede zin en voorlichting gericht op specifieke doelgroepen,

      b. themabijeenkomsten, congressen, discussiebijeenkomsten, internationale evenementen en manifestaties,

      c. de totstandkoming en distributie van publicaties of

      d. onderwijsactiviteiten die strekken tot of dienstig zijn aan het vergroten van de kennis van, inzicht in en de
      meningsvorming over aangelegenheden met betrekking tot de buitenlandse betrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.10.3
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.10.4
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.10.3
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '10'
  - number: 2.12.1
    text: |-
      1 De minister kan in bijzondere gevallen binnen het raam van [artikel 2 van de Kaderwet][ref1] subsidie verlenen

      a. ten behoeve van andere activiteiten dan bedoeld in hoofdstuk II, of

      b. in afwijking van een of meer bepalingen van hoofdstuk II, daaronder begrepen de met het oog daarop
      bekendgemaakte beleidsvoornemens op grond van [artikel 1.1.6][ref2],

      indien te subsidiëren activiteiten naar het oordeel van de minister een betekenisvolle bijdrage leveren aan de
      realisering van de beleidsdoelstellingen van de minister.

      2 Een beschikking tot subsidiëring in afwijking van een of meer bepalingen van hoofdstuk II vermeldt de bepalingen
      waarvan wordt afgeweken en heeft een werkingsduur van ten hoogste twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010178#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.6
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.12.1
    references:
      - id: ref1
        bwb_id: BWBR0010178
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0010173
        artikel: 1.1.6
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 2.13.1
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan bevordering
      van het welzijn van de medewerkers van het ministerie van Buitenlandse Zaken en hun gezinsleden.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.13.1
  - number: 2.13.2
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [Artikel 2.13.1][ref1], komen voor subsidie
      in aanmerking kleinschalige activiteiten gericht op alle medewerkers van het ministerie en hun gezinsleden ter
      bevordering van:

      a. sportieve, culturele en andere recreatieve activiteiten,

      b. algemene vorming of

      c. ondersteuning van medewerkers in moeilijke persoonlijke omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.13.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.13.2
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.13.1
        hoofdstuk: II
        afdeling: '13'
  - number: '3.1'
    text: |-
      De verplichting op grond van [Artikel 1.1.6, eerste lid][ref1], geldt eerst met betrekking tot subsidietijdvakken
      in 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.6
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.6
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '3.2'
    text: |-
      Deze regeling, met uitzondering van [Artikel 2.7.4, onderdelen d, g, h en j][ref1], treedt in werking met ingang
      van 1 januari 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.7.4
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel3.2
    references:
