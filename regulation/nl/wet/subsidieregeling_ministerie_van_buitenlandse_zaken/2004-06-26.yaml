        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 2.3.5
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.3.1][ref1], omvat het thema sociaal-
      culturele ontwikkeling activiteiten die strekken tot of dienstig zijn aan:

      a. de bevordering van de beschikbaarheid en toegang tot het basic education,

      b. de deelname aan culturele activiteiten als middel tot maatschappelijke ontwikkeling,

      c. de bevordering van communicatieprocessen met het oog op vergroting van de maatschappelijke participatie van
      burgers.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.3.1
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '3'
  - number: 2.3.6
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.3.1][ref1], omvat het thema politieke
      ontwikkeling activiteiten die strekken tot of dienstig zijn aan:

      a. de bevordering van de naleving van mensenrechten of

      b. de bevordering van een open en voor verantwoording vatbare wijze van bestuur, vestiging of versterking van de
      rechtsstaat en bevordering van democratiseringsprocessen.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel2.3.6
    references:
