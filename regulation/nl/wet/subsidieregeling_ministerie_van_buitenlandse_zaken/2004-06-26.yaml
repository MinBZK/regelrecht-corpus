    text: |-
      1 Deze afdeling is, met uitzondering van de [artikelen 2.3.1][ref1] en [2.3.3 tot en met 2.3.9][ref2], niet van
      toepassing op de verlening van subsidie door een Nederlandse vertegenwoordiging namens de minister.

      2 Deze afdeling is, met uitzondering van de [artikelen 2.3.1, eerste lid][ref3], en [2.3.3 tot en met 2.3.9][ref4],
      niet van toepassing op de verlening van subsidie aan organisaties, die naar doelstelling en werkzaamheden zijn
      gericht op een van de thema’s, genoemd in [artikel 2.3.1, derde lid][ref5], waarop de minister op grond van
      statutaire of organisatorische voorzieningen zeggenschap kan uitoefenen ten aanzien van een of meer van de in
      [artikel 2.3.12][ref6] bedoelde onderwerpen.

      3 De minister kan bij de bekendmaking van een beleidsvoornemen op grond van [artikel 1.1.6][ref7] afwijken van
      [artikel 2.3.10][ref8].


