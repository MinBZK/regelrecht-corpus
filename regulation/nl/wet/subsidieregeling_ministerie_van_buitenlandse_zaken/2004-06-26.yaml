  - number: 1.3.3
    text: |-
      Wijzigingen van activiteitenplan en begroting worden vooraf schriftelijk aan de minister ter goedkeuring
      voorgelegd. Indien binnen acht weken na indiening van het verzoek om goedkeuring de minister niet van bedenkingen
      heeft blijk gegeven, is het verzoek goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.3.3
  - number: 1.3.4
    text: |-
      Voor de beschikbaarstelling van goederen aan derden of het verrichten van diensten voor derden brengt de
      subsidieontvanger een vergoeding in rekening die ten minste kostendekkend is. Deze verplichting geldt niet ten
      aanzien van derden die tot de doelgroep van de subsidie behoren.
    url: https://wetten.overheid.nl/BWBR0010173/2004-06-26#Artikel1.3.4
  - number: 1.3.5
    text: |-
      Indien de subsidieontvanger zijn inkomsten in overwegende mate ontleent aan de subsidie vormt de subsidieontvanger
      een egalisatiereserve als bedoeld in [Artikel 4:72, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel472
