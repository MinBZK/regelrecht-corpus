  - number: '21'
    text: |-
      De meetresultaten van de ingevolge de [artikelen 16][ref1] en [17][ref2] uitgevoerde metingen en de bewerking
      daarvan ingevolge de [artikelen 18][ref3], [19][ref4] en [20][ref5] dienen in een rapport te worden vastgelegd.
      Tevens dient daarin te worden vermeld:

      a. de voor elke component of parameter toegepaste meetmethode;

      b. de bedrijfscondities van de stookinstallatie voor zover gegevens daarover noodzakelijk zijn voor de vaststelling
      of aan de van toepassing zijnde emissie-eis wordt voldaan.


