  - number: '22'
    text: |-
      1 Voor de bemonstering van kolen en voor de bepaling van het zwavelgehalte van een brandstof is het
      [Besluit bepalingsmethode zwavelgehalte brandstoffen][ref1] (Stcrt. 1974, 215) van toepassing.

      2 De bepaling van de stookwaarde van een brandstof dient, tenzij het vierde lid wordt toegepast, te geschieden:

      1º. bij kolen volgens de norm NEN-ISO 1928;

      2º. bij zware stookolie volgens de norm NEN 1884;

      3º. bij lichte stookolie en gasolie volgens de methode ASTM D 2382;

      4º. bij aardgas volgens de methode ASTM D 1826.

      3 Indien voor de stookwaarde van een vloeibare brandstof of van aardgas een in de praktijk gangbare waarde
      beschikbaar is, mag deze waarde worden gehanteerd.

      4 In afwijking van het eerste, tweede en derde lid mogen ook andere methoden worden toegepast, indien kan worden
      aangetoond dat met deze andere methoden:

      a. meetresultaten worden verkregen die niet significant verschillen van meetresultaten verkregen volgens de
      desbetreffende methode genoemd in het eerste, tweede of derde lid, en

      b. een gelijke of betere herhaalbaarheid wordt verkregen dan met de betreffende methode genoemd in het eerste,
      tweede of derde lid.


