  text: |-
    Gelet op artikel 4 van het Besluit emissie-eisen stookinstallaties Hinderwet (Stb. 1990, 197);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            het besluit:

              het [besluit emissie-eisen stookinstallaties milieubeheer B][ref1];



            b

              *ISO:*


              International Standard Organisation;



            c

              *DP:*


              Draft Proposal;



            d

              *NPR:*


              Nederlandse Praktijk Richtlijn;



            e

              *ASTM:*


              American Society for Testing and Materials;



            f

              *NEN:*


              een door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm;



            g

              *NEN-ISO:*


              een door de International Organization for Standardization opgestelde en door het Nederlands Normalisatie
      Instituut (NNI) als Nederlandse norm aanvaarde en uitgegeven norm.


      [ref1]: https://wetten.overheid.nl/BWBR0004833
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004833
  - number: '2'
    text: |-
      Voor de berekening van de uitworp van een stookinstallatie geldt als het volume van het rookgas: het volume bij
      een temperatuur van 273 Kelvin en een druk van 101,3 kPa, na aftrek van het volume van het erin aanwezige water,
      berekend als waterdamp.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel2
  - number: '3'
    text: |-
      1 Bij stookinstallaties waarbij krachtens het besluit metingen moeten worden uitgevoerd, dienen zodanige
      voorzieningen te worden aangebracht, dat het uitvoeren van deze metingen op verantwoorde wijze mogelijk is.

      2 De voorzieningen bedoeld in het eerste lid, dienen te worden aangebracht na overleg met de vergunningverlener of
      na overleg met een door de vergunningverlener aan te wijzen instelling.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel3
  - number: '4'
    text: |-
      1 De ter controle van een emissie-eis geïnstalleerde monstername- en analyseapparatuur alsmede de apparatuur
      voor de automatische verwerking van meetresultaten, dient zo spoedig mogelijk nadat de emissie-eis op de
      stookinstallatie van toepassing is geworden goed te functioneren.

      2 De apparatuur als bedoeld in het eerste lid dient zodanig te worden onderhouden, dat het goed functioneren zoveel
      mogelijk blijft gewaarborgd.

      3 Bij een continue meting dient te kunnen worden aangetoond dat zoveel als mogelijk is met goed functionerende
      apparatuur is gemeten.

      4 Het goed functioneren dient door of vanwege de vergunninghouder te kunnen worden aangetoond. Daarbij dient voor
      de gehaltebepaling:

      a. van zwaveldioxide de norm ISO/DP 7934,

      b. van stikstofoxiden de norm NEN 2044,

      c. van stof de richtlijn NPR 2788,

      te worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel4
  - number: '5'
    text: |-
      1 In geval de werking van de apparatuur als bedoeld in [artikel 4, eerste lid][ref1], gestoord is, dienen:

      a. onverwijld de nodige maatregelen te worden genomen om aan de storing een einde te maken;

      b. geen wijzigingen in het gebruik van de stookinstallatie te worden aangebracht, die een substantiële stijging van
      de uitworp van de te meten verontreinigende stof te weeg kunnen brengen.

      2 Indien een storing langer duurt dan 48 uur dient onverwijld de vergunningverlener te worden gewaarschuwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel4
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      De rechtstreekse continue meting van de concentratie aan zwaveldioxide in het rookgas dient te worden uitgevoerd
      met monstername- en analyse-apparatuur, die voldoet aan de kwaliteitseisen als vermeld in de ontwerpnorm ISO/
      DP 7935.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel6
  - number: '7'
    text: |-
      De rechtstreekse continue meting van de concentratie aan stikstofoxiden in het rookgas dient te worden uitgevoerd
      volgens een methode die overeenstemt met de algemeen aanvaarde meetpraktijk.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel7
  - number: '8'
    text: |-
      1 Bij toepassing van een methode als bedoeld in [artikel 7][ref1], kan worden volstaan met het continu meten van de
      concentratie aan stikstofmonoxide, indien kan worden aangetoond dat het gehalte aan stikstofdioxide kleiner is dan
      10 procent van het gehalte aan stikstofoxiden.

      2 Het aantonen als bedoeld in het eerste lid dient te geschieden aan de hand van een meting volgens de norm NEN
      2039, of met een andere methode indien daarbij meetresultaten worden verkregen die niet significant verschillen
      van meetresultaten verkregen met metingen volgens de norm NEN 2039 en ten minste een gelijke herhaalbaarheid wordt
      verkregen als met de methode volgens de norm NEN 2039.

      3 Bij toepassing van het eerste lid dient de continu gemeten massaconcentratie aan stikstofmonoxide, berekend
      als stikstofdioxide, verhoudingsgewijs te worden vermeerderd met het bij de metingen, bedoeld in het tweede lid,
      bepaalde gehalte aan stikstofdioxide.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel7
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Indien de concentratie aan stikstofoxiden in de rookgassen wordt bepaald aan de hand van een
      uitworpkarakteristiek als bedoeld in [voorschrift 10.3.3, onder b, van bijlage I van het besluit](onbekend), moet
      de stookinstallatie op zodanige wijze worden gebruikt dat de uitworpkarakteristiek daarop van toepassing is.

      2 De uitworpkarakteristiek dient opnieuw te worden bepaald indien er wijzigingen aan de stookinstallatie worden
      aangebracht die de bestaande uitworpkarakteristiek kunnen beïnvloeden.

      3 Bij het vaststellen van de uitworpkarakteristiek dient de concentratie aan stikstofoxiden in de rookgassen te
      worden gemeten volgens de norm NEN 2044.

      4 In afwijking van het derde lid mag de concentratie aan stikstofoxiden in de rookgassen ook worden gemeten volgens
      de norm NEN 2039, of met een andere methode indien daarbij meetresultaten worden verkregen die niet significant
      verschillen van meetresultaten verkregen met metingen volgens de norm NEN 2039 en ten minste een gelijke
      herhaalbaarheid wordt verkregen als met de methode volgens de norm NEN 2039.

      5 Bij toepassing van [voorschrift 10.3.3, onder b, van bijlage I van het besluit](onbekend) op een gasturbine of
      gasturbine-installatie, dient tevens de geïnjecteerde hoeveelheid inert materiaal continu te worden bepaald.

      6 Continue meting van een parameter als bedoeld in [voorschrift 10.3.3, onder b, van bijlage I van het besluit]
      (onbekend), dient te worden uitgevoerd volgens een methode die overeenstemt met de algemeen aanvaarde meetpraktijk.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel9
  - number: '10'
    text: |-
      Continue meting voor de bepaling van de concentratie aan stof in het rookgas dient te worden uitgevoerd met een
      optische rookdichtheidsmeter.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel10
  - number: '11'
    text: |-
      1 Bij een continue meting als bedoeld in de [artikelen 6][ref1], [7][ref2], of [10][ref3] dienen tevens alle
      parameters die noodzakelijk zijn om vast te stellen of aan de van toepassing zijnde emissie-eis is voldaan, continu
      te worden gemeten.

      2 Continue meting van een parameter als bedoeld in het eerste lid, dient te worden uitgevoerd volgens een methode
      die overeenstemt met de algemeen aanvaarde meetpraktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004795#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004795#Artikel10
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004795
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004795
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Bij een continue meting dienen de meetresultaten continu te worden geregistreerd.

      2 Tevens dient te worden geregistreerd:

      a. de voor een component en de voor een parameter toegepaste meetmethode;

      b. voor zover van toepassing, de vastgestelde uitworpkarakteristiek;

      c. de bedrijfscondities van de stookinstallaties, voor zover die gegevens noodzakelijk zijn voor de vaststelling of
      aan de van toepassing zijnde emissie-eis wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel12
  - number: '13'
    text: |-
      1 Aan de hand van de ingevolge [artikel 12][ref1] geregistreerde gegevens dient, met inachtneming van het bepaalde
      in het tweede lid en betrokken op de werkelijke tijd dat de stookinstallatie in gebruik is, te worden berekend en
      vervolgens geregistreerd:

      a. indien [voorschrift 10.2.6, 10.3.4 of 10.4.3 van bijlage I van het besluit](onbekend) van toepassing is, van de
      massaconcentratie aan onderscheidenlijk zwaveldioxide, stikstofoxiden of stof in het rookgas:

      1º. elke kalenderdag van de twee voorafgaande kalenderdagen, het 48-uursgemiddelde, en

      2º. van elke kalendermaand, het kalendermaandgemiddelde,

      b. indien [voorschrift 10.3.13, onder a, van bijlage I van het besluit](onbekend) van toepassing is, van iedere
      kalerderdag het 24-uursgemiddelde en indien [voorschrift 10.3.13, onder b, van bijlage I](onbekend) van toepassing
      is, van ieder opeenvolgend half uur het halfuurgemiddelde van de met de rookgassen uitgeworpen hoeveelheid
      stikstofoxiden, berekend als stikstofdioxide en herleid naar grammen per Gigajoule bij ISO-luchtcondities.

      2 De gemiddelde waarden, bedoeld in het eerste lid, onder a, dienen te worden herleid op rookgas met een
      volumegehalte aan zuurstof als bepaald in [voorschrift 1.1 van bijlage I van het besluit](onbekend).

      3 De gemiddelde waarden bedoeld in het eerste lid, onder a, dienen in klassen te worden ingedeeld en per
      kalenderjaar als percentielwaarden te worden geregistreerd.

      4 De klassen, bedoeld in het derde lid, dienen zodanig te zijn vastgesteld, dat toepassing kan worden gegeven aan
      [voorschrift 10.2.6, 10.3.4 en 10.4.3 van bijlage I van het besluit](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel12
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel13
