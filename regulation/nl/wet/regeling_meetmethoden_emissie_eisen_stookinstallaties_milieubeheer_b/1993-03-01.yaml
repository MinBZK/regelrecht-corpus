        paragraaf: '2'
  - number: '14'
    text: |-
      1 Voor de herleiding naar ISO-luchtcondities als bedoeld in [artikel 13, eerste lid, onder b][ref1], dient de
      volgende formule te worden toegepast:



              E =

                stikstofoxidenuitworp herleid tot ISO-luchtcondities



              Em =

                gemeten stikstofoxidenuitworp



              Pref =

                compressor einddruk (absoluut) onder ISO-luchtcondities



              Pm =

                gemeten compressor einddruk (absoluut)



              Tm =

                inlaatlucht temperatuur (Kelvin)



              xm =

                gemeten vochtgehalte van de inlaatlucht (in kg. water per kg. droge lucht).




      2 In afwijking van het eerste lid mag een andere formule worden toegepast indien kan worden aangetoond, dat
      toepassing daarvan een nauwkeuriger resultaat oplevert dan toepassing van de formule vermeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel13
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15'
    text: |-
      1 De afzonderlijke metingen voor de bepaling van de concentraties aan:

      a. zwaveldioxide dienen te worden uitgevoerd volgens de norm ISO/DP 7934;

      b. stikstofoxiden dienen te worden uitgevoerd volgens de norm NEN 2044;

      c. stof dienen te worden uitgevoerd volgens de richtlijn NPR 2788.

      2 In afwijking van het eerste lid, onder a en b, mogen de afzonderlijke metingen voor de bepaling van de
      concentraties aan:

      a. zwaveldioxide worden uitgevoerd met apparatuur die voldoet aan kwaliteitseisen als vermeld in de ontwerpnorm
      ISO-DP 7935;

      b. stikstofoxiden worden uitgevoerd volgens de norm NEN 2039, of met een andere methode indien daarbij
      meetresultaten worden verkregen die niet significant verschillen van meetresultaten verkregen met metingen volgens
      de norm NEN 2039 en ten minste een gelijke herhaalbaarheid wordt verkregen als met de methode volgens de norm NEN
      2039.

      3 Indien een methode als bedoeld in het tweede lid, onder a, wordt toegepast, is
      [artikel 4, vierde lid, onder a][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel4
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16'
    text: |-
      1 Een afzonderlijke meting bestaat uit een serie van ten minste drie metingen.

      2 De duur van een meting dient niet meer dan een half uur te bedragen. Wanneer het meettechnisch niet mogelijk is
      de meting in die tijd uit te voeren mag de meting ten hoogste twee uur bedragen.

      3 In afwijking van het tweede lid dienen bij toepassing van de norm NFN 2044 per meting binnen een half uur vier
      monsters van het rookgas te worden getrokken en van alle monsters de concentratie aan stikstofoxiden te worden
      bepaald.

      4 Bij toepassing van de [voorschriften 10.2.12, 10.3.9 of 10.4.9 van bijlage I van het besluit](onbekend) dient een
      serie van negen metingen te worden verricht.

      5 De serie van negen metingen, bedoeld in het vierde lid, dient binnen een periode van een week te worden
      uitgevoerd. Het tweede en derde lid zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel16
  - number: '17'
    text: |-
      1 Bij een afzonderlijke meting dienen tevens die parameters te worden bepaald, die noodzakelijk zijn voor de
      vaststelling of aan de van toepassing zijnde emissie-eis is voldaan.

      2 In afwijking van het bepaalde in het eerste lid mag voor de vaststelling van de uitworp van stikstofoxiden
      met het rookgas bij een gasturbine, een gasturbine-installatie of een zelfaanzuigende zuigermotor in plaats van
      de bepaling van de volumehoeveelheid aangezogen lucht het door de leverancier van de stookinstallatie opgegeven
      luchtverbruik van die stookinstallatie gehanteerd worden.

      3 De bepaling van een parameter als bedoeld in het eerste lid, dient te worden uitgevoerd tegelijk met de
      ingevolge [artikel 16, eerste of vierde lid][ref1], uit te voeren metingen en met een methode in overeenstemming
      met de algemeen aanvaarde meetpraktijk. [Artikel 16, tweede en derde lid][ref2], zijn daarbij van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004795#Artikel16
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004795
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '18'
    text: |-
      1 Bij een gasturbine, een gasturbine-installatie of een zuigermotor dient de gemeten concentratie aan
      stikstofoxiden in het rookgas te worden herleid op grammen per Gigajoule bij ISO-luchtcondities.

      2 Bij ketelinstallaties dienen de op grond van [artikel 16][ref1] en [17][ref2] verkregen meetresultaten te
      worden herleid op rookgas met een volumegehalte aan zuurstof als bepaald in [voorschrift 1.1 van bijlage I van het
      besluit](onbekend).

      3 De na toepassing van het eerste of het tweede lid verkregen waarde dient als halfuurgemiddelde te worden berekend
      en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004795#Artikel17
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004795
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '19'
    text: |-
      1 Bij een gasturbine of gasturbineinstallatie is voor de herleiding naar ISO-luchtcondities [artikel 14][ref1] van
      overeenkomstige toepassing.

      2 Bij een zuigermotor mag:

      a. indien tijdens de afzonderlijke meting de temperatuur van de aangezogen lucht lager is dan 288 Kelvin en de
      vochtigheid van de aangezogen lucht hoger is dan 0,0063 kg water per kg lucht, de gemeten waarde gelijk worden
      gesteld aan de naar ISO-luchtcondities gecorrigeerde waarde;

      b. in de andere gevallen dan die bedoeld onder a, 95 procent van de gemeten waarde gelijk worden gesteld aan de
      naar ISO-luchtcondities gecorrigeerde waarde.

      3 In afwijking van het tweede lid mag de herleiding naar ISO-luchtcondities geschieden op een andere wijze, indien
      kan worden aangetoond dat zulks een nauwkeuriger resultaat oplevert dan toepassing van het bepaalde in het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel14
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004795
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '20'
    text: |-
      Bij de metingen als bedoeld in het [artikel 16, vierde lid][ref1], gelden de emissie-eisen als in acht genomen,
      indien:

      a. het gemiddelde van de met toepassing van de [artikelen 17][ref2] en [18][ref3] verkregen meetuitkomsten van deze
      serie in negen metingen lager ligt dan de getalwaarde van de emissie-eis, en

      b. acht van de negen meetuitkomsten, bedoeld onder a, lager liggen dan de getalwaarde van de emissie-eis.


      [ref1]: https://wetten.overheid.nl/BWBR0004795#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004795#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004795#Artikel18
    url: https://wetten.overheid.nl/BWBR0004795/1993-03-01#Artikel20
