preamble:
  text: |-
    Gelet op de artikelen 5, 5bis en 5ter van Verordening (EEG) nr. 3013/89 van de Raad van 25 september 1989 houdende
    een gemeenschappelijke ordening der markten in de sector schape- en geitenvlees (PbEG L 298) en de ter uitvoering
    daarvan vastgestelde Raads- en Commissieverordeningen;

    Gelet op afdeling 1 en artikel 30bis van Verordening (EEG) nr. 805/68 houdende een gemeenschappelijke ordening der
    markten in de sector rundvlees van de Raad van de Europese Gemeen-schappen van 27 juni 1968 (PbEG L 148) en de ter
    uitvoering daarvan vastgestelde Raads- en Commissieverordeningen;

    Gelet op de artikelen 1, 5 en 6 van Verordening (EEG) nr. 3508/92 tot instelling van een geïntegreerd beheers-
    en controlesysteem voor bepaalde communautaire steunregelingen van de Raad van de Europese Gemeenschappen van 27
    november 1992 (PbEG L 355) en de ter uitvoering daarvan vastgestelde Commissieverordeningen;

    Overwegende dat toepassing moet worden gegeven aan de hiervoor genoemde verordeningen en de ter uitvoering daarvan
    vastgestelde Raads- en Commissieverordeningen;

    Overwegende dat de bepalingen van meergenoemde verordeningen rechtstreekse werking in de Nederlandse rechtssfeer
    hebben, zij het dat ten behoeve van de juiste uitvoering een nadere invulling van deze bepalingen regelgeving
    noodzakelijk is;

    Voorts gelet op de artikelen 15, 19, 26, 27 en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a
              minister:

                Minister van Landbouw, Natuur en Voedselkwaliteit;



              b
               LASER:

                Dienst Landelijke Service bij regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



              c
              AID:

                Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



              d

                [verordening 3508/92](31992R3508):

                [Verordening (EEG) nr. 3508/92](31992R3508) van de Raad van de Europese Gemeenschappen van 27 november
      1992 tot instelling van een geïntegreerd beheers- en controlesysteem voor bepaalde communautaire steunregelingen
      (PbEG L 355);



              e

                [verordening 2419/2001](32001R2419):

                [Verordening (EEG) nr. 2419/2001](32001R2419) van de Commissie van de Europese Gemeenschappen van 11
      december 2001 houdende uitvoeringsbepalingen inzake het bij [Verordening (EEG) nr. 3508/92](31992R3508) van de Raad
      ingestelde geïntegreerd beheers- en controlesysteem voor bepaalde communautaire steunregelingen (PbEG L 327);



              f

                [verordening 1254/1999](31999R1254):

                [Verordening (EEG) nr. 1254/1999](31999R1254) van de Raad van de Europese Gemeenschappen van 17 mei 1999
      houdende een gemeenschappelijke ordening der markten in de sector rundvlees (PbEG L 160);



              g

                [verordening 2342/1999](31999R2342):

                [Verordening (EEG) nr. 2342/1999](31999R2342) van de Commissie van de Europese Gemeenschappen van
      28 oktober 1999 tot vaststelling van uitvoeringsbepalingen van [verordening (EG) nr. 1254/1999](31999R1254)
      van de Raad houdende een gemeenschappelijke ordening der markten in de sector rundvlees met betrekking tot de
      premieregelingen (PbEG L 281);



              h

                [verordening 1760/2000](32000R1760):

                [Verordening (EG) nr. 1760/2000](32000R1760) van het Europees Parlement en de Raad van de Europese
      Gemeenschappen van 17 juli 2000 tot vaststelling van een identificatie- en registratieregeling voor runderen en
      inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van [Verordening (EG) nr. 820/97]
      (31997R0820) van de Raad;



              i

                [verordening 2529/2001](32001R2529):

                [Verordening (EG) nr. 2529/2001](32001R2529) van de Raad van de Europese Gemeenschappen van 19 december
      2001 houdende een gemeenschappelijke ordening der markten in de sector schapen- en geitenvlees (PbEG L 341);



              j

                [verordening 2550/2001](32001R2550):

                [Verordening (EG) nr. 2550/2001](32001R2550) van de Commissie van de Europese Gemeenschappen van 21
      december 2001 tot vaststelling van uitvoeringsbepalingen voor [Verordening (EG) nr. 2529/2001](32001R2529) van de
      Raad van 19 december 2001 houdende een gemeenschappelijke ordening der markten in de sector schapen- en geitenvlees
      en tot wijziging van [verordening (EG) nr. 2419/2001](32001R2419)(PbEG L 341);



              k
              dieren:

                ooien, vaarzen, koeien, zoogkoeien, stieren en ossen;



              l
               runderen:

                vaarzen, koeien, zoogkoeien, stieren en ossen;



              m
               ooi:

                vrouwelijk schaap dat ten minste één keer heeft gelammerd of ten minste één jaar oud is;



              n
              koe:

                vrouwelijk rund van tenminste acht maanden, dat heeft gekalfd;



              o
              vaars:

                vrouwelijk rund van ten minste acht maanden, dat nog niet heeft gekalfd;



              p
              zoogkoe:

                koe van een vleesras of koe die is voortgekomen uit een kruising met een dergelijk ras en die deel uit
      maakt van een bestand dat wordt gebruikt voor het opfokken van kalveren voor de vleesproductie;



              q
               stieren:

                ongecastreerde mannelijke runderen, met uitzondering van mannelijke runderen die op k.i.-stations worden
      gehouden en waarvan het hoofddoel is de productie van sperma;



              r
              ossen:

                gecastreerde mannelijke runderen;



              s
               producent:

                individueel bedrijfshoofd, natuurlijke of rechtspersoon of, voorzover het stieren-, ossen-
      of zoogkoeienhouderij betreft, samenwerkingsverband van natuurlijke of rechtspersonen, niet zijnde een
      producentengroepering ongeacht de rechtspositie van die groepering en van haar leden, van wie, respectievelijk
      waarvan het bedrijf zich op het grondgebied van Nederland bevindt en die ofwel runderen houdt, ofwel ten minste 10
      ooien houdt;



              t
              huurder:

                degene die op grond van een schriftelijke overeenkomst met het verhurend bedrijfshoofd verantwoordelijk
      is voor het houden van een kudde ooien of een deel daarvan;



              u
               terreinbeherende organisatie:

                privaatrechtelijke rechtspersoon die gronden in eigendom, vruchtgebruik, erfpacht of pacht heeft en in
      voorkomende gevallen blijkens zijn statuten ten doel heeft deze gronden te beheren uit oogpunt van natuurbeheer;
      publiekrechtelijke rechtspersoon;



              v
               bedrijf:

                geheel van in Nederland gelegen productie-eenheden die de producent ingevolge een recht van eigendom,
      een zakelijk gebruiksrecht, een door de grondkamer goedgekeurde of geregistreerde pachtovereenkomst, een
      pachtovereenkomst als bedoeld in artikel 58 van de Pachtwet of een grondgebruiksverklaring als bedoeld in artikel 1
      van de Regeling landbouwgrond Meststoffenwet in beheer heeft, dan wel.
      door de producent beheerde grond dan wel grond tijdelijk in gebruik gekregen op grond van een overeenkomstig
      artikel 192, respectievelijk artikel 194, van de Landinrichtingswet vastgesteld plan van tijdelijk gebruik, dan
      wel krachtens artikel 46, vierde lid, van de Reconstructiewet Midden-Delfland of krachtens artikel 28, vierde lid,
      van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën, dan wel grond tijdelijk in gebruik
      gekregen van de Dienst Landelijk Gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit, of
      de in Nederland gelegen bedrijfsgebouwen waarvan de producent op basis van een schriftelijke overeenkomst ten
      minste gedurende de aanhoudperiode als bedoeld in het vierde lid het gebruik heeft, of
      in Nederland gelegen grond welke door een terreinbeherende organisatie op basis van een schriftelijke overeenkomst
      ten minste gedurende 7 maanden met ingang van 31 maart van het jaar waarin de premie wordt aangevraagd, aan de
      producent in gebruik is gegeven, of
      voorzover het een producent van schapenvlees betreft en onverminderd het hiervoor gestelde: andere dan de
      bovenbedoelde grond of gebouwen die de producent voor de productie van schapenvlees in gebruik heeft mits de in
      artikel 5.3, eerste en tweede lid, bedoelde schriftelijke mededeling door LASER is ontvangen;



              w
              oppervlakte cultuurgrond:

                totale tot het bedrijf behorende areaal aan bouwland, blijvend grasland, meerjarige cultures en tuinen
      voor eigen gebruik;



              x
              GVE:

                grootvee-eenheden die worden berekend door omrekening van de aantallen dieren als bedoeld in artikel
      12 van [verordening 1254/1999](31999R1254) aan de hand van de tabel in bijlage III van [verordening 1254/1999]
      (31999R1254);



              y
              veebezetting:

                het aantal mannelijke runderen, zoogkoeien en vaarzen, schapen en geiten waarvoor in een bepaald jaar
      door de producent premie-aanvragen zijn ingediend en het aantal melkkoeien dat nodig is voor de productie van de
      aan de producent toegekende totale individuele referentiehoeveelheid;



              z
              individuele referentiehoeveelheid:

                in artikel 1, eerste lid, onderdeel f, van de Regeling Superheffing 1993 bedoelde referentiehoeveelheid
      melk waarover geen heffing verschuldigd is en die op het bedrijf beschikbaar is als bedoeld in artikel 17, eerste
      lid, onder a, van [verordening 2342/1999](31999R2342);



              aa
              voederareaal:

                oppervlakte van het bedrijf welke gedurende een aaneengesloten periode van ten minste zeven maanden
      beschikbaar is voor de rundvee- en schapen- of geitenhouderij op dat bedrijf en die wordt berekend overeenkomstig
      het bepaalde in artikel 12, tweede lid, onder b, van [verordening 1254/1999](31999R1254);



              bb
              veebezettingsgetal:

                rekenkundige verhouding, uitgedrukt in GVE per hectare, tussen de veebezetting en het voederareaal van
      het bedrijf die wordt vastgesteld overeenkomstig artikel 12, tweede lid, van [verordening 1254/1999](31999R1254)
      en, in geval van extensivering, artikel 13, derde lid, van [verordening 1254/1999](31999R1254);



              cc
              grasland:

                weidegrond welke voor ten minste 50% uit grassen bestaat en welke bestemd is voor beweiding met dieren of
      voor de winning van het gewas voor vervoedering aan dieren;



              dd
               perceel landbouwgrond:

                ononderbroken stuk grond waarop één gewas wordt geteeld door één producent;



              ee
               probleemgebied:

                gebied als bedoeld in artikel 5, eerste lid, van [verordening 2529/2001](32001R2529) van de Raad van 19
      december 2001 (PbEG L 341);



              ff
               premie:

                premie als bedoeld in artikel 5, eerste lid, van [verordening 2467/98](31998R2467), dan wel premie als
      bedoeld in artikel 4, eerste lid, dan wel premie als bedoeld in artikel 6, eerste lid, dan wel premie als bedoeld
      in artikel 11, eerste lid, van [verordening 1254/1999](31999R1254);



              gg
               extensiveringsbedrag:

                extra bedrag dat overeenkomstig artikel 13 van [verordening 1254/1999](31999R1254) wordt toegekend;



              hh
              deelnamemelding:

                melding als bedoeld in artikel 34 van [verordening 2342/1999](31999R2342);



              ii
              nationale reserve:

                reserve als bedoeld in artikel 7, eerste lid, van [verordening 2467/98](31998R2467), onderscheidenlijk
      als bedoeld in artikel 9, eerste lid, van [verordening 1254/1999](31999R1254);



              jj
               jaar:

                kalenderjaar;



              kk
              nge's:

                Nederlandse grootte-eenheden, door het Landbouw Economisch Instituut berekende verhoudingsgetallen die
      een beoordeling mogelijk maken van de productie-omvang van het gehele landbouwbedrijf en van afzonderlijke takken;



              ll
               oormerk:

                identificatiemerkteken als bedoeld in artikel 5, tweede lid, onder a, van [Richtlijn 92/102/EEG]
      (31992L0102) van de Raad van 27 november 1992 (PbEG L 355);



              mm
               I & R-systeem rund:

                gecomputeriseerd gegevensbestand als bedoeld in artikel 3, onderdeel b, en artikel 5 van [verordening
      1760/2000](32000R1760);



              nn
               paspoort:

                paspoort als bedoeld in artikel 3, eerste lid, van de
      [Regeling handel levende dieren en levende producten][ref1];



              oo
               bedrijfsregister:

                register als bedoeld in artikel 7, eerste lid, eerste streepje, van [verordening 1760/2000](32000R1760);



              pp
              UBN:

                uniek bedrijfsnummer als bedoeld in
      [artikel 3, tweede lid, van de Regeling identificatie en registratie van dieren 2003][ref2].




      2 In het kader van [artikel 5.4][ref3] wordt onder bedrijf verstaan het geheel van de door de producent beheerde
      productie-eenheden, bedoeld in het eerste lid, onderdeel v, sub 1° tot en met 4°, die de producent voor de
      productie van schapenvlees in gebruik heeft.

      3 Indien een producent beschikt over voederareaal dat gedeeltelijk ligt in België of Duitsland in de onmiddellijke
      nabijheid van zijn bedrijf, kan dit areaal op zijn verzoek geacht worden deel uit te maken van zijn bedrijf.

      4 De aanhoudperiode gedurende welke de dieren waarvoor premie is aangevraagd op het bedrijf moeten worden gehouden,
      beloopt voor:

        - ooien: een aaneengesloten periode van 100 dagen gerekend vanaf de eerste dag na het einde van de aanvraagperiode;
        - stieren of ossen: een aaneengesloten periode van twee maanden te rekenen vanaf de dag na de dag van ontvangst
      door LASER van de premie-aanvraag;
        - zoogkoeien: een aaneengesloten periode van zes maanden te rekenen vanaf de dag na de dag van ontvangst door LASER
      van de premie-aanvraag;
        - runderen waarvoor premie als bedoeld in artikel 2.3, tweede lid, wordt aangevraagd: een aaneengesloten periode
      van tenminste twee maanden.


