  - number: '8.1'
    text: |-
      1 De Uitvoeringsregeling EEG-premie schapevleesproducenten 1993, de Uitvoeringsregeling EEG-premie
      rundvleesproducenten 1993 en de Uitvoeringsregeling EEG-premie aanhouden zoogkoeienbestand 1993 worden ingetrokken.

      2 De in het eerste lid genoemde regelingen blijven evenwel van toepassing op aanvragen ingediend vóór de
      inwerkingtreding van de onderhavige regeling en waarop nog niet onherroepelijk is beslist.

      3 Voor zover op grond van de in het eerste lid bedoelde regelingen voor het jaar 1996 periodes, waarin aanvragen
      of meldingen kunnen worden gedaan, door middel van publicatie in de Staatscourant bekend zijn gemaakt, worden die
      periodes geacht betrekking te hebben op deze regeling.
