  - number: '5.4'
    text: |-
      1 Schapenvleesproducenten, die zijn gevestigd in een probleemgebied, komen in aanmerking voor een aanvullende
      premie per ooi als bedoeld in artikel 5 van verordening 2529/2001.

      2 Schapenvleesproducenten worden beschouwd als gevestigd in een probleemgebied indien tenminste 50% van de
      oppervlakte cultuurgrond van het bedrijf van de producent in een probleemgebied is gelegen.

      3 Om in aanmerking te komen voor een aanvullende premie als bedoeld in het eerste lid, voegt de producent bij
      zijn premie-aanvraag een specifieke aangifte als bedoeld in artikel 4, eerste lid, onderdeel b, van [verordening
      2550/2001](32001R2550).

      4 Uit de specifieke aangifte, bedoeld in het derde lid, blijkt de ligging van alle gronden die tot het bedrijf van
      de producent behoren alsmede de oppervlakte die in een probleemgebied is gelegen.

      5 Bij de specifieke aangifte voegt de producent een topografische kaart met een schaal van 1:10.000, afkomstig van
      de Topografische Dienst Nederland, met een unieke topografische perceelsnummering waaruit blijkt welke percelen van
      de totale oppervlakte cultuurgrond in een probleemgebied zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel5.4
  - number: '5.5'
    text: |-
      1. Onverminderd het bepaalde in [verordening 2419](onbekend)/2001 moet de producent in de aanvraag vermelden of hij
      melk van ooien of zuivelprodukten van ooien verkoopt en onverminderd het bepaalde in [artikel 5.3][ref1] volledig
      aangeven waar het schapenbestand zich gedurende de aanhoudperiode zal bevinden.

      2. Onverminderd het bepaalde in [verordening 2419](onbekend)/2001 vermeldt de producent in zijn aanvraag voor zover
      van toepassing:

      a. de gegevens ter identificatie van het inschaarbedrijf en de plaats waar de ooien gedurende de aanhoudperiode
      worden ingeschaard en de periode van inscharing;

      b. de gegevens ter identificatie van het bedrijf van de huurder en het aantal verhuurde ooien dat hij laat houden;

      c. het loondienstverband en de identiteit van de andere producent;

      d. de gegevens ter identificatie van het bedrijf van de ingebruikgever van de gebouwen en de gronden alsmede de
      plaats waar de ooien gedurende de aanhoudperiode verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel5.3
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '5.3'
        hoofdstuk: '5'
  - number: '6.1'
    text: |-
      Voor een premie komen slechts zoogkoeienproducenten in aanmerking die:

      a. het runderbestand op het bedrijf dat zij beheren uitsluitend gebruiken voor het opfokken van kalveren voor de
      vleesproduktie en gedurende twaalf maanden, te rekenen vanaf de dag van ontvangst door LASER van de aanvraag, geen
      melk en geen zuivelprodukten leveren, behoudens de rechtstreekse levering van het bedrijf aan de consument dan wel

      b. het runderbestand op het bedrijf dat zij beheren zowel gebruiken voor het opfokken van kalveren voor de
      vleesproduktie als voor het leveren van melk of zuivelprodukten, en

      c. gedurende tenminste zes maanden, te rekenen vanaf de dag volgend op die van ontvangst door LASER van de
      aanvraag, op het bedrijf een aantal zoogkoeien houden dat tenminste gelijk is aan 60% en een aantal vaarzen houden
      dat tenminste gelijk is aan 15% van het aantal zoogkoeien waarvoor de premie is aangevraagd.

      d. Het in onderdeel c genoemde minimum aantal vaarzen geldt niet voor een producent die voor minder dan 14
      zoogkoeien premie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Een premie wordt de producent slechts verleend:

      a. voor niet meer zoogkoeien dan het aantal premierechten waarover de producent beschikt;

      b. tot het voor het bedrijf van de producent ingevolge artikel 12, eerste lid, van [verordening 1254/1999]
      (31999R1254) geldende maximum veebezettingsgetal;

      c. voor de aan te houden zoogkoeien die vanaf het moment van ontvangst door LASER van de eerste premieaanvraag
      zoogkoeien in het oor zijn voorzien van een oormerk; en

      d. voor de aan te houden zoogkoeien die tenminste eenmaal hebben gekalfd in de periode die loopt van twintig
      maanden voor tot en met vier maanden na de datum waarop de betrokken aanvraagperiode is geopend en waarvan de
      kalveren niet binnen vier maanden na hun geboorte uit het betrokken beslag zijn afgevoerd.

      2 Een premie wordt voorts de producent slechts verleend indien hij:

      a. een bedrijfsregister bijhoudt;

      b. voldoet aan de bij of krachtens de Regeling handel levende dieren en levende producten vastgestelde regelen
      terzake van het paspoort, en

      c. voldoet aan de bij of krachtens het [Besluit identificatie en registratie van dieren][ref1] vastgestelde regelen
      ter zake van het merken.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: 6.2a
    text: |-
      1 In de aanvraag worden de zoogkoeien door de producent geïdentificeerd.

      2 Indien gedurende de aanhoudperiode de in de aanvraag vermelde zoogkoeien en vaarzen worden vervangen, wordt de
      vervanging:

      a. binnen drie dagen na de dag van de vervanging aangetekend op een daartoe door LASER vastgesteld formulier; en

      b. binnen tien werkdagen na de dag van vervanging gemeld aan LASER middels een daartoe door LASER vastgesteld
      formulier.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel6.2a
  - number: 6.2b
    text: |-
      1 De premie voor zoogkoeien bedraagt het bedrag dat voortvloeit uit artikel 6, vierde lid, van [verordening
      1254/1999](31999R1254).

      2 De premie als bedoeld in het eerste lid wordt aangevuld met 25% van het bedrag dat wordt berekend door
      overeenkomstige toepassing van [artikel 4.7, tweede lid, de onderdelen a tot en met e][ref1], met dien verstande
      dat voor de in onderdeel e bedoelde ‘categorie stieren en ossen’ wordt gelezen het aantal zoogkoeien dat
      overeenkomt met het maximum aantal premierechten overeenkomstig bijlage II van [verordening 1254/1999](31999R1254).


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel6.2b
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '4.7'
        hoofdstuk: 4A
  - number: 6.2c
    text: |-
      1 Het bedrag van de premie, bedoeld in [artikel 6.2a][ref1], wordt verhoogd met een extensiveringsbedrag ten
      bedrage van:

      a. € 66,- voor de jaren 2000 en 2001 indien de veebezetting lager is dan 1,6 GVE per hectare en € 33,- indien de
      veebezetting ten minste 1,6 GVE per hectare bedraagt, doch minder dan 2,0 GVE per hectare;

      b. € 80,- voor het jaar 2002 en de daarop volgende jaren indien de veebezetting lager is dan 1,4 GVE per hectare en
      € 40,- indien de veebezetting ten minste 1,4 GVE per hectare bedraagt, doch minder dan 1,8 GVE per hectare.

      2 De verhoging wordt niet verstrekt indien:

      a. de aanvraag daartoe niet overeenkomstig [artikel 4.2a][ref2] is ingediend, in voorkomend geval gewijzigd
      overeenkomstig [artikel 4.2b][ref3], dan wel is ingetrokken;

      b. de veebezetting hoger is dan de, overeenkomstig de [artikelen 4.2a][ref4] en [4.2b][ref5] door de producent
      opgegeven veebezetting;

      c. op enig tijdstip in het betrokken kalenderjaar het aantal op het bedrijf van de producent aanwezige GVE groter
      is dan 120% van de door de betrokken producent overeenkomstig de [artikelen 4.2a][ref6] en [4.2b][ref7] opgegeven
      veebezetting.


