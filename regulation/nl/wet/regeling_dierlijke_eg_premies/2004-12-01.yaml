  - number: '1.2'
    text: |-
      Alle bepalingen die ten aanzien van een producent gelden, zijn van overeenkomstige toepassing op een
      producentengroepering, tenzij hierna anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel1.2
  - number: '1.3'
    text: |-
      Indien de fysieke of financiële structuur van een bedrijf na 30 juni 1992 is of wordt gewijzigd hoofdzakelijk met
      het doel de verplichtingen van de in [artikel 1.1, eerste lid][ref1], genoemde verordeningen of deze regeling te
      ontgaan, wordt deze wijziging buiten beschouwing gelaten voor de toepassing van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '2.1'
    text: |-
      LASER is belast met de uitvoering van deze regeling, waaronder begrepen het uitreiken van formulieren, alsmede met
      het in ontvangst nemen van de formulieren en de bijbehorende bijlagen.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.1
  - number: '2.2'
    text: |-
      Producenten die premierechten hebben verkregen op grond van de Uitvoeringsregeling EEG-premie
      schapevleesproducenten 1993 en de Uitvoeringsregeling EEG-premie aanhouden zoogkoeienbestand 1993 worden geacht
      over die premierechten in het kader van deze regeling te beschikken.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Terzake van het gedurende de desbetreffende aanhoudperiode op hun bedrijf aanhouden van een zoogkoe, stier, os,
      onderscheidenlijk ooi, wordt jaarlijks op daartoe strekkende aanvraag, na afloop van het betrokken verkoopseizoen,
      overeenkomstig de bepalingen van deze regeling en de [verordeningen 1254/1999](31999R1254), [2342/1999]
      (31999R2342), [2529/2001](32001R2529) en [2550/2001](32001R2550) aan producenten premie verstrekt.

      2 Terzake van het slachten of uitvoeren naar een derde land van een rund dat op de datum van de slacht,
      onderscheidenlijk uitvoer naar een derde land, blijkens de gegevens uit het I & R-systeem rund tenminste
      acht maanden oud is, wordt op daartoe strekkende aanvraag overeenkomstig de bepalingen van deze regeling en
      [verordeningen 1254/1999](31999R1254) en [2342/1999](31999R2342) aan producenten premie verstrekt.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.3
  - number: '2.4'
    text: |-
      Om voor premie als bedoeld in [artikel 2.3, eerste lid][ref1], in aanmerking te komen:

      a. dient de producent een premieaanvraag dieren in, die in één of meer door de minister vast te stellen
      aanvraagperioden per jaar door LASER moet zijn ontvangen.

      b. kan per aanvraagperiode slechts eenmaal een aanvraag worden ingediend, welke ten minste betrekking heeft op tien
      ooien, onderscheidenlijk drie stieren, drie ossen of drie zoogkoeien.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4a
    text: |-
      1 Om voor premie als bedoeld in [artikel 2.3, tweede lid][ref1], in aanmerking te komen dient de producent,
      onverminderd [artikel 2.4b][ref2], een deelnamemelding in.

      2 In de deelnamemelding verklaart de producent in ieder geval in aanmerking te willen komen voor premie, bedoeld
      in [artikel 2.3, tweede lid][ref3], alsmede dat terzake van het slachten van op zijn bedrijf gehouden runderen in
      een in Nederland gelegen abattoir de aanvraag voor premie namens deze producent door het betrokken abattoir wordt
      ingediend.

      3 Indien zich wijzigingen voordoen in de door de producent op de deelnamemelding vermelde gegevens stelt hij LASER
      daarvan in kennis door middel van een nieuwe deelnamemelding, welke moet zijn ontvangen binnen veertien dagen nadat
      de desbetreffende wijziging is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0008007#Artikel2.4b
      [ref3]: https://wetten.overheid.nl/BWBR0008007#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008007
        artikel: 2.4b
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008007
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4b
    text: |-
      1 De producent kan een aanvraag voor premie als bedoeld in [artikel 2.3, tweede lid][ref1], uitsluitend indienen na
      ontvangst van diens deelnamemelding.

      2 Aanvragen voor premie ter zake van het slachten van runderen in een in Nederland gelegen abattoir worden ingediend
      door melding van de slacht overeenkomstig de [Regeling identificatie en registratie van dieren 2003][ref2] door het
      betrokken abattoir aan het I & R-systeem rund.

      3 Aanvragen voor premie ter zake van het slachten van runderen in een buiten Nederland gelegen abattoir worden
      ingediend binnen zes maanden na de slachtdatum, doch uiterlijk op de laatste dag van februari van het volgende
      jaar, waarbij de in artikel 35, eerste lid, aanhef en onder a, van [verordening 2342/1999](31999R2342) bedoelde
      bewijsstukken worden overgelegd.

      4 Aanvragen voor premie ter zake van de uitvoer van runderen naar een derde land worden ingediend binnen zes
      maanden na de datum waarop, blijkens de bij het Produktschap Vee en Vlees berustende gegevens met betrekking tot
      de exportrestitutie, het betrokken rund het grondgebied van de Gemeenschap heeft verlaten, doch uiterlijk op de
      laatste dag van februari van het volgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.4b
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005662
  - number: '2.5'
    text: |-
      1 Voor iedere aanvraag, met uitzondering van een aanvraag voor premie als bedoeld in
      [artikel 2.3, tweede lid][ref1], ter zake van het slachten van runderen in een in Nederland gelegen abattoir,
      mededeling of deelnamemelding, in het kader van deze regeling maakt de producent gebruik van een daartoe door LASER
      vastgesteld formulier dat door de producent volledig en naar waarheid wordt ingevuld, ondertekend en gedagtekend.

      2 Bij de indiening van een formulier, of het verstrekken van een mededeling, bedoeld in het eerste lid, legt
      de producent alle bewijsstukken over die LASER nodig acht voor de beoordeling of aanspraak op premie kan worden
      gemaakt.

      3 De producent is verplicht degene die belast is met de uitvoering van deze regeling op diens verzoek alle ter zake
      van die gegevens gewenste nadere inlichtingen terstond en naar waarheid te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5a
    text: |-
      1 Een premie-aanvraag kan te allen tijde geheel of gedeeltelijk worden ingetrokken, echter indien LASER of de AID
      de producent in kennis heeft gesteld van:

      a. onregelmatigheden in zijn premie-aanvraag, of

      b. het voornemen bij de producent een controle ter plaatse uit te voeren, waarbij vervolgens onregelmatigheden
      worden ontdekt, mogen de bij de onregelmatigheden betrokken gedeelten van de aanvraag niet worden ingetrokken.

      2 Van de intrekking, bedoeld in het eerste lid, wordt LASER schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.5a
  - number: '2.6'
    text: |-
      1 Behoudens gevallen als bedoeld in [artikel 2.9][ref1], wordt de premie, waarvoor de aanvraag, niet binnen de
      door de minister voor die aanvraag vastgestelde periode door LASER is ontvangen, verlaagd door de premie waarop
      de producent recht zou hebben indien de aanvraag tijdig zou zijn ontvangen, met 1% per werkdag vertraging te
      verminderen.

      2 Indien de aanvraag meer dan 25 kalenderdagen na sluiting van de aanvraagperiode door LASER is ontvangen, wordt de
      aanvraag afgewezen.

      3 Een aanvraag als bedoeld in het eerste lid wordt slechts in behandeling genomen indien de in
      [artikel 2.5, tweede lid][ref2], bedoelde bewijsstukken binnen de desbetreffende aanvraagperiode, dan wel uiterlijk
      op een nader door LASER vastgesteld tijdstip, door LASER zijn ontvangen.

      4 In afwijking van het eerste lid wordt een aanvraag als bedoeld in [artikel 2.4b, tweede lid][ref3], afgewezen
      indien de melding van de slacht niet binnen 25 dagen na de slacht van het betrokken rund heeft plaatsgevonden op de
      wijze zoals bepaald in de [Regeling identificatie en registratie van dieren 2003][ref4].

      5 In afwijking van het eerste lid wordt een aanvraag als bedoeld in
      [artikel 2.4b, derde lid, onderscheidenlijk het vierde lid][ref5], alsmede een melding als bedoeld in
      [artikel 2.4b, tweede lid][ref6], afgewezen indien deze niet voor het uit de regeling voortvloeiend tijdstip, door
      LASER is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0008007#Artikel2.5
      [ref3]: https://wetten.overheid.nl/BWBR0008007#Artikel2.4b
      [ref4]: https://wetten.overheid.nl/BWBR0005662
      [ref5]: https://wetten.overheid.nl/BWBR0008007#Artikel2.4b
      [ref6]: https://wetten.overheid.nl/BWBR0008007#Artikel2.4b
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.6
