  - number: '2.7'
    text: De minister beslist op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.7
  - number: 2.7a
    text: |-
      Indien een bedrijf volledig wordt overgedragen nadat een premieaanvraag dieren is ingediend en voordat aan alle
      verplichtingen voor het verstrekken van premie is voldaan, kan aan de verkrijger van het bedrijf de desbetreffende
      aangevraagde premie worden verstrekt indien:

      a. LASER de schriftelijke melding van de overdracht door de verkrijger binnen een maand na de overdracht ontvangt,

      b. de verkrijger LASER verzoekt om betaling van de door de wederpartij aangevraagde premie,

      c. de verkrijger alle door LASER verlangde bewijsstukken overlegt, en

      d. wordt voldaan aan alle voorwaarden voor de verstrekking van de premie.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.7a
  - number: '2.8'
    text: |-
      1 Indien enige verplichting op grond van de toepasselijke communautaire regelgeving of deze regeling niet wordt
      nageleefd, vinden de daartoe gestelde regelen in [verordening 3508/92](31992R3508) en [verordening 2419/2001]
      (32001R2419) en in voorkomend geval [Verordening 2550/2001](32001R2550) toepassing.

      2 Het eerste lid vindt geen toepassing indien de producent overeenkomstig artikel 44, tweede lid, van [verordening
      2419/2001](32001R2419), LASER binnen de in voornoemd artikel gestelde termijn schriftelijk in kennis heeft gesteld
      van andere dan aan ernstige nalatigheid of aan opzet toe te schrijven fouten in zijn aanvraag.

      3 Onverminderd de maatregelen op grond van het eerste lid ontvangt een producent geen runderpremie naar aanleiding
      van de ingediende premieaanvragen, indien hij in het jaar waarin de premie is aangevraagd een overtreding heeft
      begaan van:

      a. [artikel 3 van het Besluit verboden stoffen Diergeneesmiddelenwet][ref1];

      b. [artikel 3 van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref2];

      c. verordeningen van het Produktschap Vee en Vlees ter uitvoering van
      [artikel 2, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref3].

      4 Bij herhaling van de overtreding, bedoeld in het tweede lid, besluit de minister dat een producent geen premie
      ontvangt voor runderen als bedoeld in de onderhavige regeling gedurende twee jaren volgend op het jaar waarin de
      producent de herhaalde overtreding heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008785#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008825#Artikel2
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0008785
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008825
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008825
        artikel: '2'
  - number: 2.8a
    text: |-
      Geen premie, bedoeld in [artikel 2.3, tweede lid][ref1], terzake van het slachten, wordt verleend indien
      de slachtmelding wordt verricht door een abattoir dat door toepassing van artikel 42 van [verordening 2419]
      (onbekend)/2001 is uitgesloten van het recht verklaringen of certificaten af te geven met het oog op de toekenning
      van premie.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.8a
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.9'
    text: |-
      1 De producent is verplicht door middel van een in [artikel 2.5][ref1] bedoeld formulier LASER in kennis te stellen
      van iedere vermindering van het aantal dieren waarvoor premie is aangevraagd.

      2 LASER ontvangt de kennisgeving, bedoeld in het eerste lid, vergezeld van de relevante bewijsstukken, in geval
      van natuurlijke omstandigheden als bedoeld in artikel 41 van [verordening 2419](onbekend)/2001 binnen 10 werkdagen
      volgende op de dag nadat de vermindering de producent bekend is geworden, en in geval van overmacht of buitengewone
      omstandigheden als bedoeld in artikel 48 van [verordening 2419](onbekend)/2001 binnen 10 werkdagen vanaf het
      tijdstip waarop dit voor de producent mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '3.1'
    text: |-
      Overeenkomstig [verordening 1254/1999](31999R1254), [verordening 2342/1999](31999R2342), verordening 2529/2001
      en [verordening 2550/2001](32001R2550) worden vanuit de nationale reserve specifieke premierechten toegekend aan
      producenten.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Producenten die in 2004 voor het eerst een premie-aanvraag voor ooien of zoogkoeien indienen, komen in aanmerking
      voor toekenning van specifieke premierechten indien zij ten genoegen van de minister aantonen:

      a. dat zij tussen het begin van de aanvraagperiode voor specifieke rechten van het kalenderjaar 2003, indien
      het ooien betreft, respectievelijk het begin van de aanvraagperiode voor specifieke rechten van het kalenderjaar
      2001, indien het zoogkoeien betreft, en de eerste dag van de aanvraagperiode voor specifieke rechten in
      het betrokken kalenderjaar ten behoeve van de schapenhouderij, respectievelijk de zoogkoeienhouderij, een
      investeringsverplichting zijn aangegaan van minimaal € 11.344,51 voor de uitbreiding van de stalling en van de
      stalinrichting van ooien, respectievelijk zoogkoeien,

      b. dat deze verplichting schriftelijk is vastgesteld en onomkeerbaar is, en

      c. dat met die investering een bedrijf van tenminste 60 nge’s is ontstaan.

      2 De toekenning, als bedoeld in het eerste lid, geschiedt op basis van de volgende formule: het bedrag van de
      investeringsverplichting gedeeld door 227, indien het ooien betreft en gedeeld door 1135 indien het zoogkoeien
      betreft, met dien verstande dat het aantal toe te kennen premierechten het aantal ooien, respectievelijk
      zoogkoeien, waarvoor de investering is verricht niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 Producenten die op het moment van de aanvraag van premie voor ooien of zoogkoeien beschikken over minimaal
      50 ooien, respectievelijk 10 zoogkoeien, en die aantonen dat zij ten behoeve van de uitbreiding van de voor de
      schapenhouderij, respectievelijk zoogkoeienhouderij, te gebruiken grond een deel van door andere producenten voor
      de schapenhouderij, respectievelijk voor de zoogkoeienhouderij, gebruikte grond hebben verworven, waardoor een
      minimum bedrijfsomvang van ten minste 60 nge’s is ontstaan, komen in aanmerking voor de toekenning van specifieke
      premierechten op voorwaarde dat:

      a. zij de grond tussen het begin van de aanvraagperiode van het kalenderjaar 2003, indien het ooien betreft,
      respectievelijk het begin van de aanvraagperiode van het kalenderjaar 2001, indien het zoogkoeien betreft, en de
      eerste dag van de aanvraagperiode in het betrokken kalenderjaar in eigendom of in vruchtgebruik hebben verkregen,
      op basis van een door de grondkamer goedgekeurd of geregistreerd pachtcontract hebben gepacht dan wel in erfpacht
      hebben,

      b. de verworven grond direct voorafgaand aan de verwerving reeds voor ten minste twee jaar ten behoeve van de
      schapenhouderij, respectievelijk de zoogkoeienhouderij in gebruik is geweest, en

      c. de verworven grond een omvang van tenminste 5 hectare heeft.

      2 De toekenning, als bedoeld in het eerste lid, geschiedt op basis van de volgende formule: aantal hectaren van de
      verworven grond vermenigvuldigd met 12, indien het ooien betreft en, indien het zoogkoeien betreft, vermenigvuldigd
      met 1,8.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.3
  - number: '3.4'
    text: |-
      De producent die op grond van de [artikelen 3.2][ref1] of [3.3][ref2] aanspraak wenst te maken op toekenning van
      specifieke premierechten voor ooien, of zoogkoeien, dient in een daartoe door de minister vastgestelde periode een
      aanvraag in bij LASER.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0008007#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008007
        artikel: '3.3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.5'
    text: |-
      Indien het aantal aangevraagde specifieke premierechten groter is dan het aantal daarvoor beschikbare premierechten
      vindt een proportionele vermindering van de individueel toe te kennen specifieke premierechten plaats.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.5
  - number: 3.5a
    text: |-
      1 Producenten die op het moment van de aanvraag van premie voor ooien of zoogkoeien op hun bedrijf meer ooien,
      respectievelijk zoogkoeien aanhouden dan het aantal waarvoor zij over premierechten beschikken komen in aanmerking
      voor specifieke premierechten.

      2 Secifieke premierechten op grond van het eerste lid worden alleen toegekend na de toekenning van specifieke
      premierechten op grond van [artikel 3.2][ref1] en [3.3][ref2] en de nationale reserve nog niet is uitgeput.

      3 Indien het aantal toe te kennen specifieke premierechten op grond van het eerste lid groter is dan het aantal
      daarvoor beschikbare premierechten vindt een proportionele vermindering van de individueel toe te kennen specifieke
      premierechten plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0008007#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.5a
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008007
        artikel: '3.3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.6'
    text: Een tijdelijke overdracht van premierechten is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.6
  - number: '3.7'
    text: |-
      In geval van overdracht van premierechten zonder dat daarbij het bedrijf van de producent wordt overgedragen,
      vervalt 1% van de over te dragen rechten zonder vergoeding aan de nationale reserve, met dien verstande dat ten
      minste één premierecht moet worden afgestaan indien het ooien betreft.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.7
  - number: 3.7a
    text: |-
      Bij overdracht van premierechten voor zoogkoeien zonder dat daarbij het bedrijf van de producent wordt overgedragen
      bedraagt het minimumaantal premierechten dat wordt overgedragen:

      a. 5, voor producenten die beschikken over premierechten voor meer dan 25 zoogkoeien, en

      b. 3, voor producenten die beschikken over premierechten voor ten minste tien en ten hoogste 25 zoogkoeien.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.7a
  - number: '3.8'
    text: |-
      Aanspraak op overgedragen premierechten kan slechts worden verkregen indien:

      a. LASER door zowel de vervreemder als de verkrijger in een door de minister vastgestelde periode van de overdracht
      in kennis is gesteld,

      b. is voldaan aan afdeling 2 van hoofdstuk III van [verordening 2342/1999](31999R2342) indien het premierechten
      voor zoogkoeien betreft, de artikelen 12 tot en met 15 van [verordening 2550/2001](32001R2550) indien het
      premierechten voor ooien betreft, en deze paragraaf, en

      c. de overdracht door LASER is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel3.8
  - number: '4.1'
    text: |-
      1 Het voederareaal moet beschikbaar zijn met ingang van 31 maart van het jaar waarin de premie wordt aangevraagd.

      2 Indien het voederareaal gezamenlijk wordt gebruikt, wordt dit areaal met het oog op de bepaling van het voor
      iedere producent geldende veebezettingsgetal over de belanghebbende producenten verdeeld in verhouding tot het
      gebruik of recht op gebruik dat zij van dit areaal maken.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Om voor premie in aanmerking te komen, dient de producent van runderen een aanvraag oppervlakten, als bedoeld in
      artikel 6 van de Regeling EG-steunverlening akkerbouwgewassen, in bij LASER.

      2 De aanvraag oppervlakten heeft betrekking op percelen landbouwgrond die elk een oppervlakte hebben van ten minste
      0,3 hectare.

      3 Het eerste lid is niet van toepassing op de producent die wordt vrijgesteld van de toepassing van het
      veebezettingsgetal en geen aanvullende premie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.2
  - number: 4.2a
    text: |-
      1 Om voor het extensiveringsbedrag in aanmerking te komen, vraagt de producent zulks aan in zijn aanvraag
      oppervlakten.

      2 In de kalenderjaren 2000 en 2001 komt slechts in aanmerking voor het extensiveringsbedrag de producent die op
      zijn bedrijf blijkens het I & R-systeem rund een veebezetting aanhoudt die:

      a. kleiner is dan 1,6 GVE per hectare, dan wel

      b. gelijk is of groter is dan 1,6 GVE per hectare, doch niet meer dan 2 GVE per hectare

      3 Met ingang van het kalenderjaar 2002 komt slechts in aanmerking voor het extensiveringsbedrag de producent die op
      zijn bedrijf blijkens het I & R-systeem rund een veebezetting aanhoudt die:

      a. kleiner is dan 1,4 GVE per hectare, dan wel

      b. gelijk is of groter is dan 1,4 GVE per hectare, doch niet meer dan 1,8 GVE per hectare.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.2a
  - number: 4.2b
    text: |-
      1 De aanvraag voor het extensiveringsbedrag kan worden ingetrokken tot het tijdstip waarop controle van het
      aantal dieren op het bedrijf heeft plaatsgevonden, dan wel van een voorgenomen controle melding aan de producent
      is gedaan.

      2 De producent doet van de wijziging, bedoeld in het eerste lid, of de intrekking, bedoeld in het tweede lid,
      melding aan LASER.

      3 De producent doet van de intrekking, bedoeld in het eerste lid, melding aan LASER.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.2b
  - number: '4.3'
    text: |-
      LASER deelt de producent het voor hem vastgestelde veebezettingsgetal mede en het daaruit voortvloeiende aantal GVE
      waarvoor premie kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 Indien runderen tijdens de aanhoudperiode worden verplaatst van het ene UBN naar het andere UBN van het
      bedrijf van de producent, stelt de producent LASER hiervan voorafgaand aan de verplaatsing schriftelijk op de
      hoogte. De producent bewaart een afschrift van het formulier aan LASER bij zijn bedrijfsadministratie, genoemd in
      [artikel 4.5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0008007
        artikel: '4.5'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '4.5'
    text: |-
      1 De producent is verplicht in zijn bedrijfsadministratie alle in deze regeling en door LASER voorgeschreven
      bewijsstukken te bewaren;

      2 De bedrijfsadministratie wordt door de producent op eerste vordering aan de bevoegde ambtenaar van de AID ter
      inzage gegeven.

      3 De producent bewaart de bedrijfsadministratie op zijn bedrijf ten minste drie jaar na afloop van het jaar waarin
      premie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.5
  - number: '4.6'
    text: |-
      Premie wordt de producent slechts verstrekt ten behoeve van runderen die:

      a. op zijn bedrijf, blijkens het I & R-systeem rund gedurende de aanhoudperiode zijn aangehouden;

      b. blijkens het I & R-systeem rund na afloop van de in onderdeel a genoemde periode binnen één maand worden geslacht
      in een abattoir waarvan de houder overeenkomstig de [Regeling identificatie en registratie van dieren 2003][ref1]
      een bedrijfsregister bijhoudt of met het oog op slacht naar een andere lidstaat worden verzonden, dan wel binnen
      twee maanden in geval van uitvoer naar een derde land, en.

      c. overeenkomstig de bepalingen gesteld bij en krachtens [verordening 1760/2000](32000R1760) zijn geïdentificeerd
      en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '4.7'
    text: |-
      1 De premie voor stieren of ossen bedraagt het bedrag dat voortvloeit uit artikel 11, tweede lid, van [verordening
      1254/1999](31999R1254).

      2 De premie, bedoeld in het eerste lid, wordt voor stieren of ossen die blijkens het I & R-systeem rund ten minste
      15 maanden oud zijn, aangevuld met een bedrag dat wordt berekend door:

      a. de gemiddelde slachtwaarde van in 1999 geslachte dieren in de categorie koeien en vaarzen, de categorie stieren
      en ossen, onderscheidenlijk de gemiddelde opbrengstwaarde in de categorie zoogkoeien, te berekenen;

      b. deze waarden vervolgens uit te drukken in een factor waarin de waarde per categorie zich tot de waarden van de
      andere categorieën verhoudt, waarbij de laagste waarde wordt uitgedrukt in factor 1;

      c. de in 2002 geslachte aantallen dieren van ten minste 15 maanden oud waarvoor slachtpremie is verstrekt in de
      categorieën koeien en vaarzen, stieren en ossen, onderscheidenlijk het aantal zoogkoeien dat overeenkomt met het
      maximum aantal premierechten overeenkomstig bijlage II van [verordening 1254/1999](31999R1254), te vermenigvuldigen
      met de bij de onderscheiden categorieën behorende verhoudingsfactor, zoals vastgesteld op grond van onderdeel b;

      d. het maximumbedrag van bijlage IV van [verordening 1254/1999](31999R1254) te delen door de som van de op grond
      van onderdeel c berekende getallen;

      e. het aldus berekende bedrag te vermenigvuldigen met de voor de categorie stieren en ossen, op grond van onderdeel
      b berekende verhoudingsfactor.

      3 De premie voor vrouwelijke runderen bedraagt het bedrag dat voortvloeit uit artikel 11, tweede lid, van
      [verordening 1254/1999](31999R1254).

      4 De premie als bedoeld in het derde lid wordt voor vrouwelijke runderen die blijkens het I & R-systeem rund ten
      minste 15 maanden oud zijn aangevuld met een bedrag dat wordt berekend door overeenkomstige toepassing van het
      tweede lid, onderdelen a tot en met e, met dien verstande dat voor de in onderdeel e bedoelde ‘categorie stieren en
      ossen’ wordt gelezen: categorie koeien en vaarzen.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.7
  - number: '4.8'
    text: |-
      Geen premie wordt verstrekt voor runderen waarvan de geboortedatum, de datum van aanvoer op en afvoer van het
      bedrijf van de producent, of de datum van de slacht, onderscheidenlijk uitvoer naar een andere lidstaat of derde
      land, niet in het I & R-systeem rund zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel4.8
  - number: '5.1'
    text: Premie per ooi bedraagt het bedrag dat voortvloeit uit artikel 4, vierde lid, van verordening 2529/2001.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel5.1
  - number: '5.2'
    text: |-
      Het aantal voor de premie in aanmerking te nemen ooien bedraagt niet minder dan tien en is ten hoogste gelijk aan
      het aantal ooien dat op de dag van indiening van de aanvraag op het bedrijf van de producent voor diens rekening
      wordt aangehouden, doch nooit groter dan het aantal premierechten waarover de producent beschikt.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 De producent doet, indien hij de aan te houden ooien dan wel een gedeelte daarvan gaat aanhouden op gronden of in
      gebouwen als bedoeld in de definitie van bedrijf, bedoeld in [artikel 1.1, eerste lid, onderdeel v, sub 5°][ref1],
      hiervan mededeling in de aanvraag, bedoeld in [artikel 2.5][ref2]. De mededeling wordt mede ondertekend door de
      ingebruikgever.

      2 Indien de producent gedurende de aanhoudperiode de aan te houden ooien dan wel een gedeelte daarvan alsnog
      gaat aanhouden op gronden of in gebouwen als bedoeld in het eerste lid, en hij daarvan in de aanvraag, bedoeld
      in [artikel 2.5][ref3], geen mededeling heeft gedaan, stelt hij LASER hiervan voorafgaand aan de verplaatsing
      schriftelijk op de hoogte door middel van een verplaatsingsverklaring, die voldoet aan [artikel 2.5][ref4].

      3 De producent geeft de gronden of gebouwen waarnaar ingevolge het eerste en tweede lid van het onderhavige artikel
      wordt verplaatst, aan op een door de producent bij het verplaatsingsformulier dan wel het formulier, bedoeld in
      [artikel 2.5][ref5], gevoegde topografische kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0008007#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0008007#Artikel2.5
