  - number: '6.3'
    text: |-
      Het minimumpercentage voor het gebruik van premierechten voor zoogkoeien, bedoeld in artikel 23, vierde lid, van
      [verordening 2342/1999](31999R2342), bedraagt 90.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel6.3
  - number: '6.4'
    text: |-
      Ingeval aanpassing van individuele maxima van premierechten voor zoogkoeien als bedoeld in artikel 7, derde lid,
      van [verordening 1254/1999](31999R1254) moet geschieden, vindt van rechtswege een proportionele vermindering plaats
      van het aantal premierechten voor zoogkoeien van individuele producenten met ingang van 1 januari van het jaar
      waarvoor premie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel6.4
  - number: '7.1'
    text: |-
      1 Een premie wordt de producent slechts verleend:

      a. tot het voor het bedrijf van de producent ingevolge artikel 12, eerste lid, van [verordening 1254/1999]
      (31999R1254) geldende maximum veebezettingsgetal;

      b. voor de aan te houden stieren of ossen die vanaf het moment van ontvangst door LASER van de eerste premie-
      aanvraag stieren of premie-aanvraag ossen in het oor zijn voorzien van een oormerk,

      c. indien de producent een bedrijfsregister bijhoudt;

      d. indien de producent voldoet aan de bij of krachtens de Regeling handel levende dieren en levende producten
      vastgestelde regelen terzake van het paspoort, en.

      e. indien de producent voldoet aan de bij of krachtens het [Besluit identificatie en registratie van dieren][ref1]
      vastgestelde regelen ter zake van het merken.

      2 Een premie wordt de producent slechts verleend voor de stieren of ossen waarvoor hij op zijn
      verzoek uiterlijk op de dag van ontvangst door LASER van de premie-aanvraag stieren of de premie-
      aanvraag ossen, doch niet langer dan twee weken daaraan voorafgaand, van een bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref2] aangewezen dienst een document heeft verkregen waarin de
      stieren of ossen waarvoor premie wordt aangevraagd met hun registratienummers zijn vermeld.

      3 Het in het tweede lid bedoelde document dient de producent bij zijn premie-aanvraag stieren of premie-aanvraag
      ossen te voegen en vormt onderdeel van de premie-aanvraag.

      4 De producent bewaart een door LASER aan hem verstrekt afschrift van het in het tweede lid bedoelde document vanaf
      het begin van de aanhoudperiode bij zijn boekhouding, genoemd in [artikel 4.5, tweede lid][ref3].

      5 Ten behoeve van de vaststelling van de in het tweede lid bedoelde termijn is bepalend de datum van afgifte zoals

      vermeld op het document, als bedoeld in het tweede lid.

      6 De producent voegt bij zijn premie- aanvraag ossen een verklaring van een dierenarts of een krachtens de
      [Wet op de uitoefening van de diergeneeskunde 1990][ref4] geregistreerde castreur dat de dieren waarvoor premie
      wordt aangevraagd, zijn gecastreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
      [ref2]: https://wetten.overheid.nl/BWBR0009019
      [ref3]: https://wetten.overheid.nl/BWBR0008007#Artikel4.5
      [ref4]: https://wetten.overheid.nl/BWBR0004730
