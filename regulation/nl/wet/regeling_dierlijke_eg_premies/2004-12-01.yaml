  - number: '7.2'
    text: |-
      Indien de producent een dier uit een andere Lid-Staat betrekt waarvoor in die Lid-Staat nog geen premie
      voor de betrokken leeftijdstranche is verleend, legt de producent om voor premie in aanmerking te komen bij
      de premie-aanvraag stieren of premie-aanvraag ossen een volledig en naar waarheid ingevuld document over
      van de Lid-Staat van herkomst van het betrokken dier waarvan de gegevens overeenkomen met die van het model
      dat is opgenomen in bijlage I van [verordening 2342/1999](31999R2342), dan wel het bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1] genoemde dierpaspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '7.3'
    text: |-
      Indien het totaal aantal stieren en ossen waarvoor premie is aangevraagd en die voldoen aan de voorwaarden voor
      verlening van de premie, het regionale maximum overschrijdt, wordt het aantal stieren en ossen dat voor premie in
      aanmerking komt in het betrokken jaar per producent evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel7.3
  - number: 7.3a
    text: |-
      De premie per stier of os bedraagt het bedrag dat voortvloeit uit artikel 4, zevende lid van [verordening
      1254/1999](31999R1254).
    url: https://wetten.overheid.nl/BWBR0008007/2004-12-01#Artikel7.3a
  - number: 7.3b
    text: |-
      1 Het bedrag van de premie, bedoeld in [artikel 7.3a][ref1], wordt verhoogd met een extensiveringsbedrag ten
      bedrage van:

      a. € 66,- voor de jaren 2000 en 2001 indien de veebezetting lager is dan 1,6 GVE per hectare en € 33,- indien de
      veebezetting ten minste 1,6 GVE per hectare bedraagt, doch minder dan 2,0 GVE per hectare;

      b. € 80,- voor het jaar 2002 en de daarop volgende jaren indien de veebezetting lager is dan 1,4 GVE per hectare en
      € 40,- indien de veebezetting ten minste 1,4 GVE per hectare bedraagt, doch minder dan 1,8 GVE per hectare.

      2 De verhoging wordt niet verstrekt indien:

      a. de aanvraag daartoe niet overeenkomstig [artikel 4.2a][ref2] is ingediend, in voorkomend geval gewijzigd
      overeenkomstig [artikel 4.2b][ref3], dan wel is ingetrokken;

      b. de veebezetting hoger is dan de overeenkomstig de [artikelen 4.2a][ref4] en [4.2b][ref5] door de producent
      opgegeven veebezetting;

      c. op enig tijdstip in het betrokken kalenderjaar het aantal op het bedrijf van de producent aanwezige GVE
      groter is dan 120% van de door de producent overeenkomstig de [artikelen 4.2a][ref6] en [4.2b][ref7] opgegeven
      veebezetting.


