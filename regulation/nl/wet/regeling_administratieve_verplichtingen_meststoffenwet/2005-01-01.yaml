  - number: '1.2'
    text: |-
      Deze regeling berust op [artikel 7a van de wet][ref1] voor zover het betreft [paragraaf 1][ref2],
      de [artikelen 5a][ref3] en [5aa][ref4] en [paragraaf 6][ref5] van deze regeling, op de
      [artikelen 52, aanhef en onderdelen d, e en f][ref6], en [53, aanhef en onderdelen c, d, f en g, van de wet][ref7]
      voor zover het betreft de [paragrafen 1][ref8], [2][ref9] en [6][ref10] van deze regeling, op
      [artikel 53, aanhef en onderdelen c en d, van de wet][ref11] voor zover het betreft de [paragrafen 1][ref12],
      [3][ref13] en [6][ref14] van deze regeling, op [artikel 58am van de wet][ref15] voor zover het
      betreft [paragraaf 1][ref16], [artikel 5c][ref17] en [paragraaf 6][ref18] van deze regeling, op
      [artikel 59, eerste en derde lid, van de wet][ref19] voor zover het betreft [paragraaf 1][ref20], de
      [artikelen 5b][ref21], [5ba][ref22], [16f][ref23], [16g][ref24] en [16k][ref25] en [paragraaf 6][ref26] van deze
      regeling, op de [artikelen 2][ref27] en [6 van het besluit][ref28] voorzover het betreft [paragraaf 1][ref29],
      de [artikelen 13, eerste en tweede lid][ref30], [14][ref31], [16a, eerste en tweede lid][ref32],
      [16b, eerste lid en tweede lid][ref33], [16c][ref34], [16d][ref35], [16e][ref36] en [paragraaf 6][ref37] van
      deze regeling, op [artikel 5, eerste lid, van het besluit][ref38] voor zover het betreft [paragraaf 1][ref39],
      [artikel 5d][ref40] en [paragraaf 6][ref41] van deze regeling, en op de [artikelen 8][ref42] en
      [13, derde lid, van het besluit][ref43] voor zover het betreft de [paragraaf 1][ref44], de [artikelen 15][ref45],
      [16][ref46], [16a][ref47], [16b][ref48], [16c][ref49] en [paragraaf 6][ref50] van deze regeling.


