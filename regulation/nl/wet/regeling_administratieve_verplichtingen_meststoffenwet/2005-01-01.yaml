        artikel: 5c
        paragraaf: 2a
      - id: ref9
        bwb_id: BWBR0009228
  - number: 5d.2
    text: |-
      De persoon, rechtspersoon of het samenwerkingsverband van personen of rechtspersonen, bedoeld in
      [artikel 5a][ref1], onderscheidenlijk [5aa][ref2], doet van een verkleining van de tot het bedrijf behorende
      oppervlakte landbouwgrond of natuurterrein of van een wijziging van de onderscheiden teelten op de percelen van
      de tot het bedrijf behorende oppervlakte landbouwgrond ten opzichte van de ingevolge de [artikelen 5a][ref3],
      [5aa][ref4], [5ba][ref5] en [5c][ref6] verstrekte gegevens melding aan de Dienst Regelingen door inzending van het
      formulier, zoals opgenomen in [bijlage 15][ref7], dat overeenkomstig de daarbij aangegeven wijze volledig en juist
      is ingevuld, ingeval op enig moment in het desbetreffende jaar niet langer sprake is van een mestplaatsingsruimte
      of mestaanvoerruimte die ten minste zo groot is als de som van


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref5]: https://wetten.overheid.nl/BWBR0009228#Artikel5ba
      [ref6]: https://wetten.overheid.nl/BWBR0009228#Artikel5c
      [ref7]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref4
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref5
        bwb_id: BWBR0009228
        artikel: 5ba
        paragraaf: 2a
      - id: ref6
        bwb_id: BWBR0009228
        artikel: 5c
        paragraaf: 2a
      - id: ref7
        bwb_id: BWBR0009228
  - number: 5d.2.a
    text: |-
      de hoeveelheid dierlijke meststoffen die op jaarbasis uitgaande van de op dat moment gehouden dieren op het bedrijf
      wordt geproduceerd en
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
  - number: 5d.2.b
    text: |-
      de hoeveelheid dierlijke meststoffen waarvoor op grond van een mestafzetovereenkomst een verplichting tot aanvoer
      op het bedrijf geldt.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
  - number: 5d.3
    text: De melding geschiedt uiterlijk dertig dagen na
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
  - number: 5d.3.a
    text: |-
      de dag waarop de desbetreffende wijziging zich heeft voorgedaan, indien de melding betrekking heeft op de gegevens,
      bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
  - number: 5d.3.b
    text: het moment, bedoeld in het tweede lid, indien de melding betrekking heeft op de in dat lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
  - number: 5d.4
    text: |-
      De hoeveelheid dierlijke meststoffen, bedoeld in het tweede lid, onderdeel a, wordt vastgesteld op basis van
      het aantal op het desbetreffende moment gehouden dieren van de onderscheiden diercategorieën en op basis van de
      forfaitaire excretienormen voor de onderscheiden diercategorieën, uitgedrukt in kilogrammen stikstof per dier per
      jaar, opgenomen in [bijlage E bij de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 5d.5
    text: |-
      De verplichting tot het doen van de melding, bedoeld in het eerste en tweede lid, geldt niet in de periode van 1
      januari 2005 tot en met 15 mei 2005.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
  - number: 5d.6
    text: |-
      In zoverre in afwijking van het eerste lid wordt, ingeval landbouwgrond of natuurterrein op basis van een
      vastgesteld plan van toedeling in gebruik wordt genomen, de melding gedaan door inzending van het formulier
      zoals opgenomen in [bijlage 14][ref1], dat is ingevuld en ondertekend door de gebruiker en geparafeerd door de
      landinrichtingscommissie, reconstructiecommissie onderscheidenlijk herinrichtingscommissie van het desbetreffende
      herverkavelingsblok ingeval het formulier is ingevuld overeenkomstig de bij die commissie bekende gegevens. In deze
      melding wordt de titel vermeld op grond waarvan de percelen landbouwgrond of natuurterrein of gedeelten daarvan bij
      het bedrijf in gebruik zullen zijn na het passeren van een akte van toedeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0009228
  - number: '6.1'
    text: |-
      De aanmelding, bedoeld in [artikel 22 van de wet][ref1], geschiedt door op de daartoe bestemde plaats op het tijdig
      ingediende aangiftebiljet voor de verfijnde mineralenheffingen van de aanmelding melding te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel22
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '22'
  - number: '6.2'
    text: |-
      De aanmelding geschiedt vóór 1 september van het jaar volgend op het jaar waarop de aanmelding betrekking heeft en
      geldt tevens voor de jaren volgend op het jaar waarop de aanmelding betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het bedrijf is niet langer aangemeld indien het aangifte doet van de heffingen, bedoeld in [titel 1][ref1] van
      [hoofdstuk IV van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '6.4'
    text: |-
      Het formulier, bedoeld in het eerste lid, is opgenomen in [bijlage 5][ref1], indien de aanmelding betrekking heeft
      op het jaar 1998, en in [bijlage 5A][ref2], indien de aanmelding betrekking heeft op het jaar 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0009228
      [ref2]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009228
      - id: ref2
        bwb_id: BWBR0009228
  - number: '7'
    text: |-
      Een bedrijf komt niet in aanmerking voor de in [artikel 22 van de wet][ref1] bedoelde mogelijkheid indien ten
      aanzien van het desbetreffende kalenderjaar niet wordt voldaan aan de [artikelen 2][ref2] en [4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel4
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0009228
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009228
        artikel: '4'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      De administratie, bedoeld in [artikel 2, eerste en tweede lid van het besluit][ref1], bevat de gegevens en wordt
      opgemaakt overeenkomstig [artikel 2][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel2
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009228
        artikel: '2'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid wordt de administratie opgemaakt overeenkomstig [artikel 3a][ref1] dan wel
      [3b][ref2] van deze regeling indien het desbetreffende artikel op het bedrijf van de producent van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel3b
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 3a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 3b
        paragraaf: '2'
  - number: '14.1'
    text: |-
      De producent van dierlijke meststoffen op wie [artikel 2, eerste en tweede lid van het besluit][ref1] van
      toepassing is, verstrekt vóór 1 september van het jaar volgend op het desbetreffende kalenderjaar aan de Dienst
      regelingen gegevens over de in het betreffende kalenderjaar gehouden aantallen dieren en de in dat kalenderjaar bij
      het bedrijf behorende oppervlakte grond.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel2
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '2'
  - number: '14.2'
    text: |-
      De verstrekking van deze gegevens geschiedt door indiening van het volledig ingevulde en ondertekende formulier,
      zoals opgenomen in: - [bijlage 10F][ref1], indien ten aanzien van het bedrijf van de producent de verfijnde
      mineralenheffingen worden geheven en de gegevens betrekking hebben op het jaar 2004;
        - [bijlage 11F][ref2], indien ten aanzien van het bedrijf van de producent de forfaitaire mineralenheffingen worden
      geheven en de gegevens betrekking hebben op het jaar 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009228
      [ref2]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009228
      - id: ref2
        bwb_id: BWBR0009228
  - number: '14.3'
    text: |-
      Van de in het eerste lid genoemd verplichtingen is vrijgesteld de producent van dierlijke meststoffen die
      ingevolge [artikel 9a van de Regeling uitvoering heffingen en verrekening Meststoffenwet][ref1] is vrijgesteld
      van de verplichting tot het doen van aangifte van de heffingen, bedoeld in [hoofdstuk IV, titels 1][ref2] en
      [2, van de Meststoffenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008480#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0004054
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008480
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0004054
      - id: ref3
        bwb_id: BWBR0004054
  - number: '15.1'
    text: |-
      De leverancier en de afnemer van dierlijke en overige organische meststoffen kunnen elkaar ter zake van het
      ondertekenen van een afleveringsbewijs machtigen mits zij gebruik maken van het machtigingsformulier, en mits zij
      voldoen aan de in dit formulier gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het machtigingsformulier, bedoeld in het eerste lid, wordt vastgesteld overeenkomstig [bijlage 6][ref1] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009228
  - number: '16.1'
    text: |-
      Als bewijs, bedoeld in [artikel 7, eerste lid, van het besluit][ref1], wordt vastgesteld het vervoersbewijs
      dierlijke meststoffen dat is opgenomen in [bijlage 7][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009228
  - number: '16.2'
    text: |-
      Het afleveringsbewijs voor overige organische meststoffen, bedoeld in
      [artikel 13, eerste lid, van het besluit][ref1] wordt vastgesteld overeenkomstig [bijlage 8][ref2] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009228
  - number: 16a.1
    text: |-
      Bij de aflevering van een vracht dierlijke meststoffen aan een vervoerder die deze vracht doorlevert aan een
      afnemer worden de onderdelen 1, 3a, 3b, met uitzondering van de postcode van de losplaats en de datum en het
      tijdstip van het lossen, 3c, met uitzondering van de code van het laboratorium en de kilogrammen fosfaat en
      stikstof, en 4 van het vervoersbewijs ingevuld en wordt het vervoersbewijs door de leverancier ondertekend.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16a
  - number: 16a.2
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt met gebruikmaking van het
      formulier dat als model X , onderscheidenlijk model VII, VIII, IX , XI, of XII in
      [artikel 4 van de Regeling vaststelling formulieren Wet verplaatsing mestproductie][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006457#Artikel4
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006457
        artikel: '4'
  - number: 16a.3
    text: |-
      Indien de dierlijke meststoffen niet worden geanalyseerd, worden, in zoverre in afwijking van het eerste lid,
      de onderdelen 3b, voorzover dit betrekking heeft op het nettogewicht van de dierlijke meststoffen, en 3c van het
      vervoersbewijs niet ingevuld.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16a
  - number: 16a.4
    text: |-
      Indien de weging van de dierlijke meststoffen na de aflevering, bedoeld in het eerste lid, plaatsvindt, wordt, in
      zoverre in afwijking van dat lid, terstond na de weging bij onderdeel 3b van het vervoersbewijs het nettogewicht
      van de dierlijke meststoffen door de vervoerder ingevuld. Indien de weging bij de aflevering, bedoeld in het eerste
      lid plaatsvindt, wordt in zoverre in afwijking van dat lid, het geschat gewicht niet ingevuld.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16a
  - number: 16a.5
    text: |-
      Voor de toepassing van het eerste lid behoeft bij onderdeel 3b van het vervoersbewijs het combinatienummer
      uitsluitend ingevuld te worden, indien de betrokken vracht bestaat uit vloeibare dierlijke meststoffen die
      geanalyseerd worden.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16a
  - number: 16a.6
    text: |-
      Voor de toepassing van het eerste en tweede lid behoeft bij onderdeel 1 en bij onderdeel 5 van het vervoersbewijs
      het registratienummer van de opslag uitsluitend ingevuld te worden, indien de desbetreffende dierlijke
      meststoffen afkomstig zijn uit, onderscheidenlijk worden opgeslagen in een ingevolge [artikel 5][ref1] of
      [7 van het Besluit voorraden Meststoffenwet][ref2] aangemelde mestopslag.


      [ref1]: https://wetten.overheid.nl/BWBR0008980#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008980#Artikel7
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0008980
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008980
        artikel: '7'
  - number: 16a.7
    text: |-
      In zoverre in afwijking van het eerste en tweede lid, kunnen de in die leden bedoelde gegevens ook op het
      vervoersbewijs worden vermeld door middel van het printen van deze gegevens in de door de Dienst regelingen
      aangegeven volgorde binnen de daarvoor op het vervoersbewijs bestemde ruimte.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16a
  - number: 16b.1
    text: |-
      Indien de vracht dierlijke meststoffen wordt vervoerd voordat aflevering heeft plaatsgevonden, worden door de
      vervoerder op het tijdstip van het laden van het vervoermiddel de onderdelen 1, 3a, 3b, met uitzondering van de
      datum en het tijdstip van het lossen, 3c, met uitzondering van de code van het laboratorium en de kilogrammen
      fosfaat en stikstof, en 4 van het vervoersbewijs ingevuld en wordt het vervoersbewijs bij onderdeel 1 door de
      vervoerder, als ware hij reeds leverancier, ondertekend.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16b
  - number: 16b.2
    text: |-
      Indien de afgeleverde dierlijke meststoffen worden vervoerd door de afnemer die deze vracht lost op zijn bedrijf
      of onderneming, worden op het tijdstip van het lossen van het vervoermiddel bij onderdeel 3b van het op de vracht
      betrekking hebbende vervoersbewijs de postcode van de losplaats en de datum en het tijdstip van het ingevuld.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16b
  - number: 16b.3
    text: |-
      [Artikel 16a, derde tot en met zevende lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16a
        paragraaf: '5'
  - number: 16b.4
    text: |-
      [Artikel 14, tweede lid, van het besluit][ref1] is uitsluitend van toepassing voor zover dit betrekking heeft op de
      in het eerste lid bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel14
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '14'
  - number: 16c
    text: |-
      De vervoerder van een vracht dierlijke meststoffen die zijn geanalyseerd vult, zodra hij de door het laboratorium
      verstrekte analyseresultaten heeft ontvangen, bij onderdeel 3c van het op die vracht betrekking hebbende
      vervoersbewijs de code van dat laboratorium en de kilogrammen fosfaat en stikstof van de geanalyseerde dierlijke
      meststoffen in.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16c
  - number: 16d.1
    text: |-
      De vervoerder van een vracht dierlijke meststoffen overlegt de met betrekking tot die vracht op het vervoersbewijs
      ingevulde gegevens aan de Dienst regelingen binnen tien werkdagen na het vervoer van de dierlijke meststoffen door
      indiening van het origineel van het desbetreffende door hem ondertekende vervoersbewijs.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16d
  - number: 16d.2
    text: |-
      Indien de dierlijke meststoffen worden geanalyseerd, overlegt de vervoerder van een vracht dierlijke meststoffen de
      met betrekking tot die vracht op het vervoersbewijs ingevulde gegevens aan de Dienst regelingen door indiening van
      het origineel van het desbetreffende door hem ondertekende vervoersbewijs binnen dertig werkdagen na het vervoer
      van de dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16d
  - number: 16e.1
    text: |-
      De vervoerder van een vracht dierlijke meststoffen overlegt met betrekking tot die vracht de in
      [artikel 16a, eerste lid][ref1], bedoelde gegevens aan de in dat lid bedoelde leverancier door verstrekking van een
      afschrift van het op die vracht betrekking hebbende vervoersbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16a
        paragraaf: '5'
  - number: 16e.2
    text: |-
      De vervoerder van een vracht dierlijke meststoffen overlegt met betrekking tot die vracht de in
      [artikel 16a, eerste en tweede lid][ref1], bedoelde gegevens aan de in het tweede lid bedoelde afnemer door
      verstrekking van een afschrift van het op die vracht betrekking hebbende vervoersbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16a
        paragraaf: '5'
  - number: 16f
    text: |-
      In zoverre in afwijking van de [artikelen 16a, eerste lid][ref1], en [16b, eerste lid][ref2], behoeft op het
      vervoersbewijs bij onderdeel 3c niet het nummer van de deksel van de monsterpot of sealzak en het nummer van de
      monsterpot ingevuld te worden, indien de vervoerder een koppeling tussen het vervoersbewijs en de monsterverpakking
      heeft aangebracht door identieke etiketten die voorzien zijn van een unieke alfanumerieke code op de
      monsterverpakking en op het vervoersbewijs te bevestigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel16b
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16a
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 16b
        paragraaf: '5'
  - number: 16g.1
    text: |-
      De vervoerder van een vracht dierlijke meststoffen is met betrekking tot die vracht vrijgesteld van de
      verplichting, bedoeld in [artikel 16c][ref1], en van de in [artikel 16d, eerste lid][ref2], neergelegde
      verplichting om de in dat lid bedoelde gegevens te overleggen door indiening van het origineel van het
      vervoersbewijs, indien is voldaan aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16c
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel16d
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16c
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 16d
        paragraaf: '5'
  - number: 16g.1.a
    text: |-
      De in [artikel 16d, eerste lid][ref1], bedoelde gegevens alsmede de op desbetreffende vracht betrekking hebbende
      code van het laboratorium en de kilogrammen fosfaat en stikstof worden elektronisch bij de Dienst regelingen
      ingediend met gebruikmaking van het door de Dienst regelingen daartoe verstrekte software-programma;


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16d
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16d
        paragraaf: '5'
  - number: 16g.1.b
    text: |-
      de onder a bedoelde gegevens worden onder vermelding van het mestnummer van de desbetreffende vervoerder,
      ondertekend door middel van een persoonlijke gebruikerscode die overeenkomstig [artikel 16h][ref1] door de Minister
      op naam van de desbetreffende vervoerder is geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16h
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16h
        paragraaf: '5'
  - number: 16g.1.c
    text: de ontvangst van de elektronisch ingediende gegevens is door de Dienst regelingen bevestigd;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
  - number: 16g.1.d
    text: |-
      de elektronisch ingediende gegevens zijn niet ingevolge [artikel 16i][ref1] door de Minister geweigerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16i
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 16i
        paragraaf: '5'
  - number: 16g.1.e
    text: |-
      de vervoerder houdt een chronologisch overzicht bij van de door hem overeenkomstig dit artikel verzonden
      elektronische berichten;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
  - number: 16g.1.f
    text: |-
      de vervoerder bewaart gedurende 5 jaar in zijn administratie het origineel van het desbetreffende vervoersbewijs
      alsmede de op de vracht waarop dit vervoersbewijs betrekking heeft betreffende analyseresultaten, en
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
  - number: 16g.1.g
    text: |-
      de vervoerder dient op eerste verzoek van de Dienst regelingen het origineel van het desbetreffende vervoersbewijs,
      nadat hij hierop bij onderdeel 3c de code van het laboratorium en de kilogrammen fosfaat en stikstof van de
      geanalyseerde dierlijke meststoffen heeft ingevuld, bij de Dienst regelingen in.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
  - number: 16g.1
    text: |-
      Als tijdstip waarop de gegevens zijn ontvangen, geldt het tijdstip waarop deze gegevens het systeem voor
      gegevensverwerking van de Dienst regelingen hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16g
  - number: 16h.1
    text: |-
      De aanvraag tot registratie van een persoonlijke gebruikerscode geschiedt via de internetsite van het Ministerie
      van Landbouw, Natuur en Voedselkwaliteit onder vermelding van het mestnummer en het elektronische postadres van
      de aanvrager.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16h
  - number: 16h.2
    text: De Minister kan verzoeken om een bewijs van de juistheid van de bij de aanvraag verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16h
  - number: 16h.3
    text: |-
      De geregistreerde gebruikerscode wordt geactiveerd nadat de aanvrager een door hem schriftelijk ondertekend
      ontvangstbewijs heeft geretourneerd.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16h
  - number: 16i.1
    text: |-
      De Minister kan elektronisch verschafte gegevens weigeren voor zover de aanvaarding daarvan tot een onevenredige
      belasting voor de Minister zou leiden dan wel voor zover de betrouwbaarheid of vertrouwelijkheid van het
      desbetreffende bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel
      waarvoor het wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16i
  - number: 16i.2
    text: De Minister deelt de weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16i
  - number: 16j.1
    text: |-
      Een bedrijfsoverdracht wordt binnen dertig dagen nadat zij plaatsvond door de vervreemder en de verkrijger van het
      bedrijf gezamenlijk gemeld aan de Dienst regelingen.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16j
  - number: 16j.2
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt met gebruikmaking van het formulier zoals opgenomen in bijlage
      16, onderscheidenlijk het formulier dat als model X, onderscheidenlijk model VII, VIII, IX, XI, of XII in
      [artikel 4 van de Regeling vaststelling formulieren Wet verplaatsing mestproductie][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006457#Artikel4
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16j
    references:
      - id: ref1
        bwb_id: BWBR0006457
        artikel: '4'
  - number: 16k.1
    text: |-
      De producent van dierlijke meststoffen en de gebruiker van meststoffen zijn vrijgesteld van de in
      [artikel 2, tweede lid, van het Besluit administratieve verplichtingen Meststoffenwet][ref1] gestelde verplichting
      voor zover het betreft het bijhouden van een administratie met betrekking tot de aan hen afgeleverde andere
      meststoffen die fosfaat bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel2
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16k
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '2'
  - number: 16k.2
    text: |-
      De leverancier en de afnemer zijn vrijgesteld van de verplichtingen, bedoeld in de [artikelen 7, vierde lid][ref1],
      [10][ref2], [11][ref3] en [12 van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009000#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009000#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009000#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009000#Artikel12
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel16k
    references:
      - id: ref1
        bwb_id: BWBR0009000
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009000
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009000
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0009000
        artikel: '12'
  - number: '17'
    text: |-
      De bijlagen bij deze regeling liggen ter inzake in de bibliotheek van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit en bij de Dienst regelingen.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel17
  - number: '18'
    text: Deze regeling treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Regeling administratieve verplichtingen Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel19
