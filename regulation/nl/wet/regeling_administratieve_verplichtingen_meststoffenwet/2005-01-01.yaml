      - id: ref4
        bwb_id: BWBR0009228
      - id: ref5
        bwb_id: BWBR0009228
      - id: ref6
        bwb_id: BWBR0009228
  - number: '2.2'
    text: |-
      De administratie wordt binnen de in de bijlagen, bedoeld in het eerste lid, aangegeven termijnen en overeenkomstig
      de daarbij aangegeven wijze volledig en juist bijgehouden.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel2
  - number: '2.3'
    text: |-
      In zoverre in afwijking van het eerste en tweede lid wordt voor de invulling van het formulier, opgenomen in
      [bijlage 1F][ref1], onderscheidenlijk [1G][ref2], als beginaantal dieren behorend tot de diercategorie die in
      [bijlage A bij de wet][ref3] wordt aangeduid met nummer 210, aangemerkt het aantal dieren dat bij aanvang van de op
      1 januari lopende mestperiode is opgezet, verminderd met het van dit aantal sindsdien verkochte en gestorven aantal
      dieren, en worden tegelijk met de laatste aflevering voor de slacht van de hennen van een mestperiode ook de hanen
      van die mestperiode aangemerkt als afgeleverd voor de slacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009228
      [ref2]: https://wetten.overheid.nl/BWBR0009228
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009228
      - id: ref2
        bwb_id: BWBR0009228
      - id: ref3
        bwb_id: BWBR0004054
  - number: '2.4'
    text: |-
      In de plaats van de formulieren, bedoeld in het eerste lid, kunnen andere gegevensdragers als administratie worden
      gebruikt indien deze tenminste dezelfde gegevens bevatten en deze gegevens op vergelijkbare wijze zijn gerangschikt
      en berekend als voorgeschreven bij gebruik van het desbetreffende formulier.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel2
  - number: '2.5'
    text: |-
      Voorzover de administratie, bedoeld in het eerste lid, door een derde wordt bijgehouden, maakt de heffingplichtige
      steeds binnen 14 dagen aantekening van elke wijziging in de aantallen dieren en beschikt hij steeds binnen
      een maand na afloop van een kalendermaand over een afschrift van de tot en met die kalendermaand bijgewerkte
      administratie.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel2
  - number: '3'
    text: |-
      In zoverre in afwijking van [artikel 2][ref1] kan de heffingplichtige ten aanzien van een bedrijf volstaan met het
      bijhouden van de administratie van de tot het bedrijf behorende oppervlakte landbouwgrond, indien het bedrijf op
      elk moment in het desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: '2'
        paragraaf: '2'
  - number: 3.a
    text: |-
      de veebezetting is niet groter dan twee grootvee-eenheden per hectare van de tot het bedrijf behorende oppervlakte
      landbouwgrond;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3
  - number: 3.b
    text: de veebezetting is niet groter dan drie grootvee-eenheden.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3
  - number: 3a
    text: |-
      In zoverre in afwijking van [artikel 2][ref1] kan de heffingplichtige ten aanzien van een bedrijf
      waarvan in het desbetreffende kalenderjaar de veebezetting gemiddeld niet groter is dan 2,5 grootvee-
      eenheden per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond, bedoeld in
      [artikel 1, eerste lid, onderdeel q, van de wet][ref2], een administratie van het aantal gehouden, uitgeschaarde
      of tijdelijk elders ter weiding ondergebrachte dieren bijhouden met gebruikmaking van het formulier, opgenomen in
      [bijlage 3D][ref3], dat overeenkomstig de daarop aangegeven termijnen en overeenkomstig de daarbij aangegeven wijze
      volledig en juist wordt ingevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0009228
  - number: 3b.1
    text: |-
      In zoverre in afwijking van [artikel 2][ref1] houdt de heffingplichtige een administratie bij van het op 1 april
      van het desbetreffende jaar gehouden aantal dieren, met gebruikmaking van het formulier dat is opgenomen in
      [bijlage 3D][ref2] en dat overeenkomstig de daarbij aangegeven wijze volledig en juist wordt ingevuld, ten aanzien
      van een bedrijf dat in het desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009228
  - number: 3b.1.a
    text: |-
      de veebezetting is op geen enkel moment groter dan 0,3 grootvee-eenheden per hectare van de op dat moment bij het
      bedrijf behorende oppervlakte grond;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3b
  - number: 3b.1.b
    text: |-
      de aanvoer van meststoffen en de productie van dierlijke meststoffen bedragen in totaal niet meer dan 15 kilogram
      fosfaat van de gemiddeld in dat jaar bij het bedrijf behorende oppervlakte grond.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3b
  - number: 3b.2
    text: |-
      De productie van dierlijke meststoffen wordt bepaald door het aantal op 1 april van het desbetreffende jaar
      gehouden dieren te vermenigvuldigen met de voor de dieren van de onderscheiden diercategorieën opgenomen forfaits
      in [bijlage A bij de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 3c.1
    text: |-
      [Artikel 2][ref1] is in een kalenderjaar niet van toepassing ten aanzien van een bedrijf dat op elk moment in het
      desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: '2'
        paragraaf: '2'
  - number: 3c.1.a
    text: |-
      de veebezetting is niet groter dan twee grootvee-eenheden per hectare van de tot het bedrijf behorende oppervlakte
      landbouwgrond;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
  - number: 3c.1.b
    text: de veebezetting is niet groter dan drie grootvee-eenheden;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
  - number: 3c.1.c
    text: de tot het bedrijf behorende oppervlakte landbouwgrond is niet groter dan drie hectare;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
  - number: 3c.1.d
    text: |-
      de som van de tot dan toe in dat jaar aangevoerde dierlijke en overige organische meststoffen en de productie van
      meststoffen door de op dat moment gehouden dieren op jaarbasis, uitgedrukt in kilogrammen fosfaat, is per hectare
      van de op dat moment tot het bedrijf behorende oppervlakte landbouwgrond ten hoogste 85 kilogram fosfaat;
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
  - number: 3c.1.e
    text: |-
      het bedrijf sluit geen mestafzetovereenkomst en is niet verplicht op grond van een mestafzetovereenkomst dierlijke
      meststoffen op het bedrijf aan te voeren.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
  - number: 3c.2
    text: |-
      Op de vaststelling van de hoeveelheid aangevoerde dierlijke en overige organische meststoffen, bedoeld in het
      eerste lid, onderdeel d, is het bij en krachtens [artikel 17, tweede, derde en vierde lid, van de wet][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel17
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '17'
  - number: 3c.3
    text: |-
      De productie van dierlijke meststoffen op jaarbasis, bedoeld in het eerste lid, onderdeel d, wordt vastgesteld op
      basis van het aantal op het desbetreffende moment gehouden dieren van de onderscheiden diercategorieën en op basis
      van de forfaitaire productienormen voor de onderscheiden diercategorieën, uitgedrukt in kilogrammen fosfaat per
      dier per jaar, opgenomen in [bijlage A bij de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 3d
    text: |-
      Voor de toepassing van de [artikelen 3 tot en met 3c][ref1] geschiedt de omrekening van dieren van de onderscheiden
      diercategorieën naar grootvee-eenheden overeenkomstig de daarvoor in [bijlage A bij de wet][ref2] opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004054
  - number: 5a.1
    text: |-
      De persoon of rechtspersoon die, of het samenwerkingsverband van personen of rechtspersonen dat op een bedrijf
      meststoffen aanvoert of dierlijke meststoffen produceert, verstrekt elk kalenderjaar vóór 16 mei, aan het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit gegevens als bedoeld in [artikel 7a van de wet][ref1], door
      inzending van het daartoe door de Minister van Landbouw, Natuur en Voedselkwaliteit vastgestelde formulier, dat
      overeenkomstig de daarbij aangegeven wijze volledig en naar waarheid wordt ingevuld, bij het op het formulier
      vermelde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 7a
  - number: 5a.2
    text: |-
      De inzending van het formulier kan op elektronische wijze geschieden. Op elektronische inzending is de
      [Regeling landbouwtelling en GDI 2004][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016525
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0016525
  - number: 5a.3
    text: |-
      Van de verplichting, neergelegd in het eerste lid, zijn in 2004 vrijgesteld personen, rechtspersonen of
      samenwerkingsverbanden van personen of rechtspersonen die in 2001, 2002 of 2003, hebben voldaan aan die
      verplichting.
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5a
  - number: 5aa
    text: |-
      Indien een persoon, rechtspersoon of samenwerkingsverband van personen of rechtspersonen in het desbetreffende
      kalenderjaar pas na de datum, bedoeld in [artikel 5a, eerste lid][ref1], aanvangt met het aanvoeren van
      meststoffen of het produceren van dierlijke meststoffen op een bedrijf, verstrekt hij gegevens als bedoeld in
      [artikel 7a van de wet][ref2] door inzending bij de Dienst Regelingen van het formulier, zoals opgenomen in
      [bijlage 15][ref3], dat overeenkomstig de daarbij aangegeven wijze volledig en juist is ingevuld, uiterlijk dertig
      dagen na het moment van aanvang van deze aanvoer of productie.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5aa
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 7a
      - id: ref3
        bwb_id: BWBR0009228
  - number: 5b
    text: |-
      [Artikel 5a][ref1], onderscheidenlijk [artikel 5aa][ref2], is in een kalenderjaar niet van toepassing ten aanzien
      van een bedrijf als bedoeld in [artikel 3c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel3c
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0009228
        artikel: 3c
        paragraaf: '2'
  - number: 5ba
    text: |-
      Indien na de datum, genoemd in [artikel 5a, eerste lid][ref1], op enig moment niet meer wordt voldaan aan
      de voorwaarden, bedoeld in [artikel 5b][ref2] in samenhang met [artikel 3c][ref3], geschiedt de verstrekking
      van de gegevens, bedoeld in [artikel 5a, eerste lid][ref4], [artikel 5aa][ref5], in zoverre in afwijking
      van [artikel 5a][ref6], door inzending bij de Dienst Regelingen van het formulier, zoals opgenomen in
      [bijlage 15][ref7], dat overeenkomstig de daarbij aangegeven wijze volledig en juist is ingevuld, uiterlijk dertig
      dagen na dat moment.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel3c
      [ref4]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref5]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref6]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref7]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5ba
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 5b
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0009228
        artikel: 3c
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref5
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref6
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref7
        bwb_id: BWBR0009228
  - number: 5c
    text: |-
      De in [artikel 58am van de wet][ref1] bedoelde aanmelding van landbouwgrond, onderscheiden naar grasland, bouwland
      beteeld met maïs, ander bouwland en braakland, en natuurterrein geschiedt bij het Ministerie van Landbouw, Natuur
      en Voedselkwaliteit door:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58am
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58am
  - number: 5c.a
    text: |-
      verstrekking van gegevens met betrekking tot de landbouwgrond en het natuurterrein overeenkomstig
      [artikel 5a][ref1], [5aa][ref2] of [5ba][ref3], of,


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel5ba
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0009228
        artikel: 5ba
        paragraaf: 2a
  - number: 5c.b
    text: |-
      ingeval met betrekking tot de landbouwgrond en het natuurterrein nog geen gegevens overeenkomstig
      [artikel 5a][ref1], [5aa][ref2] of [5ba][ref3] zijn verstrekt, door inzending van het formulier, zoals opgenomen
      in [bijlage 15][ref4], dat overeenkomstig de daarbij aangegeven wijze volledig en juist is ingevuld, bij de Dienst
      Regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel5ba
      [ref4]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0009228
        artikel: 5ba
        paragraaf: 2a
      - id: ref4
        bwb_id: BWBR0009228
  - number: 5d.1
    text: |-
      De persoon, rechtspersoon of het samenwerkingsverband van personen of rechtspersonen, bedoeld in
      [artikel 5a][ref1], onderscheidenlijk [artikel 5aa][ref2], doet van een wijziging in de titels, bedoeld in
      de [artikelen 1, eerste lid, onderdelen q en w, en derde lid][ref3], en [1a, tweede lid, van de wet][ref4] op
      grond waarvan percelen landbouwgrond of natuurterrein of gedeelten daarvan bij het bedrijf in gebruik zijn ten
      opzichte van de overeenkomstig de [artikelen 5a][ref5], [5aa][ref6], [5ba][ref7] en [5c][ref8] verstrekte gegevens
      melding aan de Dienst Regelingen door inzending van het formulier, zoals opgenomen in [bijlage 14][ref9], dat
      overeenkomstig de daarbij aangegeven wijze volledig en juist is ingevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel1a
      [ref5]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref6]: https://wetten.overheid.nl/BWBR0009228#Artikel5aa
      [ref7]: https://wetten.overheid.nl/BWBR0009228#Artikel5ba
      [ref8]: https://wetten.overheid.nl/BWBR0009228#Artikel5c
      [ref9]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 1a
      - id: ref5
        bwb_id: BWBR0009228
        artikel: 5a
        paragraaf: 2a
      - id: ref6
        bwb_id: BWBR0009228
        artikel: 5aa
        paragraaf: 2a
      - id: ref7
