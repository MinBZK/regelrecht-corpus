  - number: '2.1'
    text: |-
      De heffingplichtige bedoeld in [artikel 14][ref1], onderscheidenlijk [22 van de wet][ref2], houdt per bedrijf een
      administratie bij van het aantal gehouden, uitgeschaarde of tijdelijk elders ter weiding ondergebrachte dieren
      en van de tot het bedrijf behorende oppervlakte grond, met gebruikmaking van het formulier, zoals opgenomen in: -
      [bijlage 1F][ref3], indien het de dieradministratie betreft met betrekking tot het jaar 2004;
        - [bijlage 1G][ref4], indien het de dieradministratie betreft met betrekking tot het jaar 2005;
        - [bijlage 2F][ref5], indien het de grondadministratie betreft met betrekking tot het jaar 2004;
        - [bijlage 2G][ref6], indien het de grondadministratie betreft met betrekking tot het jaar 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009228
      [ref4]: https://wetten.overheid.nl/BWBR0009228
      [ref5]: https://wetten.overheid.nl/BWBR0009228
      [ref6]: https://wetten.overheid.nl/BWBR0009228
    url: https://wetten.overheid.nl/BWBR0009228/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '14'
      - id: ref2
