  - number: 5aa
    text: |-
      Indien een persoon, rechtspersoon of samenwerkingsverband van personen of rechtspersonen in het desbetreffende
      kalenderjaar pas na de datum, bedoeld in [artikel 5a, eerste lid, onderscheidenlijk derde lid][ref1], aanvangt met
      het aanvoeren van meststoffen of het produceren van dierlijke meststoffen op een bedrijf, verstrekt hij gegevens
      als bedoeld in [artikel 7a van de wet][ref2] door inzending bij de Dienst Basisregistratie van het Ministerie van
      Landbouw, Natuurbeheer en Visserij van het formulier, zoals opgenomen in bijlage 15, dat overeenkomstig de daarbij
      aangegeven wijze volledig en juist is ingevuld, uiterlijk dertig dagen na het moment van aanvang van deze aanvoer
      of productie.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel7a
