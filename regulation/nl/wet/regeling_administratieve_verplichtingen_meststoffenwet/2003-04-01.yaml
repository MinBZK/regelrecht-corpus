  - number: 16a
    text: |-
      1 Bij de aflevering van een vracht dierlijke meststoffen aan een vervoerder die deze vracht doorlevert aan een
      afnemer worden de onderdelen 1, 3a, 3b, met uitzondering van de postcode van de losplaats en de datum en het
      tijdstip van het lossen, 3c, met uitzondering van de code van het laboratorium en de kilogrammen fosfaat en
      stikstof, en 4 van het vervoersbewijs ingevuld en wordt het vervoersbewijs door de leverancier ondertekend.

      2 De melding, bedoeld in het eerste lid, geschiedt met gebruikmaking van het formulier dat als model X ,
      onderscheidenlijk model VII, VIII, IX , XI, of XII in artikel 4 van de Regeling vaststelling formulieren
      [Wet verplaatsing mestproductie][ref1] is vastgesteld.

      3 Indien de dierlijke meststoffen niet worden geanalyseerd, worden, in zoverre in afwijking van het eerste lid,
      de onderdelen 3b, voorzover dit betrekking heeft op het nettogewicht van de dierlijke meststoffen, en 3c van het
      vervoersbewijs niet ingevuld.

      4 Indien de weging van de dierlijke meststoffen na de aflevering, bedoeld in het eerste lid, plaatsvindt, wordt,
      in zoverre in afwijking van dat lid, terstond na de weging bij onderdeel 3b van het vervoersbewijs het nettogewicht
      van de dierlijke meststoffen door de vervoerder ingevuld. Indien de weging bij de aflevering, bedoeld in het eerste
      lid plaatsvindt, wordt in zoverre in afwijking van dat lid, het geschat gewicht niet ingevuld.

      5 Voor de toepassing van het eerste lid behoeft bij onderdeel 3b van het vervoersbewijs het combinatienummer
      uitsluitend ingevuld te worden, indien de betrokken vracht bestaat uit vloeibare dierlijke meststoffen die
      geanalyseerd worden.

      6 Voor de toepassing van het eerste en tweede lid behoeft bij onderdeel 1 en bij onderdeel 5 van het vervoersbewijs
      het registratienummer van de opslag uitsluitend ingevuld te worden, indien de desbetreffende dierlijke meststoffen
      afkomstig zijn uit, onderscheidenlijk worden opgeslagen in een ingevolge [artikel 5][ref2] of 7 van het
      [Besluit voorraden Meststoffenwet][ref3] aangemelde mestopslag.

      7 In zoverre in afwijking van het eerste en tweede lid, kunnen de in die leden bedoelde gegevens ook op het
      vervoersbewijs worden vermeld door middel van het printen van deze gegevens in de door het Bureau Heffingen
      aangegeven volgorde binnen de daarvoor op het vervoersbewijs bestemde ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0006285
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008980
