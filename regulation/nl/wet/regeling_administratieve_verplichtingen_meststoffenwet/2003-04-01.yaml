  - number: 16g
    text: |-
      1 De vervoerder van een vracht dierlijke meststoffen is met betrekking tot die vracht vrijgesteld van de
      verplichting, bedoeld in [artikel 16c][ref1], en van de in [artikel 16d, eerste lid][ref2], neergelegde
      verplichting om de in dat lid bedoelde gegevens te overleggen door indiening van het origineel van het
      vervoersbewijs, indien is voldaan aan elk van de volgende voorwaarden:

      a. De in [artikel 16d, eerste lid][ref3], bedoelde gegevens alsmede de op desbetreffende vracht betrekking hebbende
      code van het laboratorium en de kilogrammen fosfaat en stikstof worden elektronisch bij het Bureau Heffingen
      ingediend met gebruikmaking van het door het Bureau Heffingen daartoe verstrekte software-programma;

      b. de onder a bedoelde gegevens worden onder vermelding van het mestnummer van de desbetreffende vervoerder,
      ondertekend door middel van een persoonlijke gebruikerscode die overeenkomstig [artikel 16h][ref4] door de Minister
      op naam van de desbetreffende vervoerder is geregistreerd;

      c. de ontvangst van de elektronisch ingediende gegevens is door het Bureau Heffingen bevestigd;

      d. de elektronisch ingediende gegevens zijn niet ingevolge [artikel 16i][ref5] door de Minister geweigerd;

      e. de vervoerder houdt een chronologisch overzicht bij van de door hem overeenkomstig dit artikel verzonden
      elektronische berichten;

      f. de vervoerder bewaart gedurende 5 jaar in zijn administratie het origineel van het desbetreffende vervoersbewijs
      alsmede de op de vracht waarop dit vervoersbewijs betrekking heeft betreffende analyseresultaten, en

      g. de vervoerder dient op eerste verzoek van het Bureau Heffingen het origineel van het desbetreffende
      vervoersbewijs, nadat hij hierop bij onderdeel 3c de code van het laboratorium en de kilogrammen fosfaat en
      stikstof van de geanalyseerde dierlijke meststoffen heeft ingevuld, bij het Bureau Heffingen in.

      1 Als tijdstip waarop de gegevens zijn ontvangen, geldt het tijdstip waarop deze gegevens het systeem voor
      gegevensverwerking van het Bureau Heffingen hebben bereikt.


