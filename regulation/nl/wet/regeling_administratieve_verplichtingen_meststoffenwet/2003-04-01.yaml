preamble:
  text: >-
    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;


    Gelet op de artikelen 13ak, aanhef en onderdelen d, e en f, en 13al, aanhef en onderdelen f en g, van de
    Meststoffenwet voor zover het betreft de paragrafen 1, 2 en 6 van deze regeling, gelet op artikel 13al, aanhef en
    onderdelen c en d, van de Meststoffenwet voor zover het betreft de paragrafen 1, 3 en 6 van deze regeling, gelet op
    artikel 13x, tweede lid, van de Meststoffenwet voor zover het betreft de paragrafen 1, 4 en 6 van deze regeling, en
    gelet op de artikelen 2, derde lid, 6, eerste lid, 8, eerste en tweede lid, 12, zesde lid, en 13, derde lid juncto
    8, eerste en tweede lid, van het Besluit administratieve verplichtingen Meststoffenwet voor zover het betreft de
    paragrafen 1, 5 en 6 van deze regeling.


    Besluit:
  url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a
               wet:

                Meststoffenwet;



              b
               besluit:

                Besluit administratieve verplichtingen Meststoffenwet;



              c
              dieren:

                dieren van de onderscheiden diersoorten, onderverdeeld in categorieën per soort, die zijn opgenomen in
      bijlage A bij de wet.



              d
              vracht dierlijke meststoffen:

                hoeveelheid dierlijke meststoffen die als eenheid in een afzonderlijk vervoermiddel al dan niet met
      aanhanger wordt aangevoerd op of afgevoerd van een bedrijf of een intermediaire onderneming;



              e
              doorleveren:

                aanvoeren en zonder tussenopslag weer afvoeren van een vracht dierlijke meststoffen;



              f
              vervoeren:

                elk feitelijk transporteren van dierlijke meststoffen of overige organische meststoffen met behulp van
      een vervoermiddel, het laden en lossen van deze meststoffen inbegrepen;



              g
              vervoerder:

                persoon of rechtspersoon die, of samenwerkingsverband van personen of rechtspersonen dat in het kader van
      zijn onderneming of zijn bedrijf dierlijke meststoffen of overige organische meststoffen vervoert.




      2 Deze regeling berust op artikel 7a van de wet voor zover het betreft paragraaf 1, de artikelen 5a en 5aa en
      paragraaf 6 van deze regeling, op de artikelen 52, aanhef en onderdelen d, e en f, en 53, aanhef en onderdelen c,
      d, f en g, van de wet voor zover het betreft de paragrafen 1, 2 en 6 van deze regeling, op artikel 53, aanhef en
      onderdelen c en d, van de wet voor zover het betreft de paragrafen 1, 3 en 6 van deze regeling, op artikel 58am van
      de wet voor zover het betreft paragraaf 1, artikel 5c en paragraaf 6 van deze regeling, op artikel 59, eerste en
      derde lid, van de wet voor zover het betreft paragraaf 1, de artikelen 5b, 5ba, 16f, 16g en 16k en paragraaf 6 van
      deze regeling, op de artikelen 2 en 6 van het besluit voorzover het betreft paragraaf 1, de artikelen 13, eerste
      en tweede lid, 14, 16a, eerste en tweede lid, 16b, eerste lid en tweede lid, 16c, 16d, 16e en paragraaf 6 van deze
      regeling, op artikel 5, eerste lid, van het besluit voor zover het betreft paragraaf 1, artikel 5d en paragraaf 6
      van deze regeling, en op de artikelen 8 en 13, derde lid, van het besluit voor zover het betreft de paragraaf 1, de
      artikelen 15, 16, 16a, 16b, 16c en paragraaf 6 van deze regeling.
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel1
  - number: '2'
    text: |-
      1 De heffingplichtige bedoeld in [artikel 14][ref1], onderscheidenlijk 22 van de wet, houdt per bedrijf een
      administratie bij van het aantal gehouden, uitgeschaarde of tijdelijk elders ter weiding ondergebrachte dieren en
      van de tot het bedrijf behorende oppervlakte grond, met gebruikmaking van het formulier, zoals opgenomen in:

      - bijlage 1D, indien het een dieradministratie betreft met betrekking tot het jaar 2002;
      - bijlage 1E, indien het een dieradministratie betreft met betrekking tot het jaar 2003;
      - bijlage 2D, indien het een grondadministratie betreft met betrekking tot het jaar 2002;
      - bijlage 2E, indien het een grondadministratie betreft met betrekking tot het jaar 2003.

      2 De administratie wordt binnen de in de bijlagen, bedoeld in het eerste lid, aangegeven termijnen en
      overeenkomstig de daarbij aangegeven wijze volledig en juist bijgehouden.

      3 In zoverre in afwijking van het eerste en tweede lid wordt voor de invulling van het formulier,
      opgenomen in bijlage 1D, onderscheidenlijk 1E, als beginaantal dieren behorend tot de diercategorie die in
      [bijlage A bij de wet][ref2] wordt aangeduid met nummer 210, aangemerkt het aantal dieren dat bij aanvang van de op
      1 januari lopende mestperiode is opgezet, verminderd met het van dit aantal sindsdien verkochte en gestorven aantal
      dieren, en worden tegelijk met de laatste aflevering voor de slacht van de hennen van een mestperiode ook de hanen
      van die mestperiode aangemerkt als afgeleverd voor de slacht.

      4 In de plaats van de formulieren, bedoeld in het eerste lid, kunnen andere gegevensdragers als administratie
      worden gebruikt indien deze tenminste dezelfde gegevens bevatten en deze gegevens op vergelijkbare wijze zijn
      gerangschikt en berekend als voorgeschreven bij gebruik van het desbetreffende formulier.

      5 Voorzover de administratie, bedoeld in het eerste lid, door een derde wordt bijgehouden, maakt de
      heffingplichtige steeds binnen 14 dagen aantekening van elke wijziging in de aantallen dieren en beschikt hij
      steeds binnen een maand na afloop van een kalendermaand over een afschrift van de tot en met die kalendermaand
      bijgewerkte administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel2
