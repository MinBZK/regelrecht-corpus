  - number: '14'
    text: |-
      1 De producent van dierlijke meststoffen op wie [artikel 2, eerste en tweede lid][ref1] van het besluit van
      toepassing is, verstrekt vóór 1 september van het jaar volgend op het desbetreffende kalenderjaar aan het Bureau
      Heffingen gegevens over de in het betreffende kalenderjaar gehouden aantallen dieren en de in dat kalenderjaar bij
      het bedrijf behorende oppervlakte grond.

      2 De verstrekking van deze gegevens geschiedt door indiening van het volledig ingevulde en ondertekende formulier,
      zoals opgenomen in:

      - bijlage 10D, indien ten aanzien van het bedrijf van de producent de verfijnde mineralenheffingen worden geheven
      en de gegevens betrekking hebben op het jaar 2002;
      - bijlage 11D, indien ten aanzien van het bedrijf van de producent de forfaitaire mineralenheffingen worden geheven
      en de gegevens betrekking hebben op het jaar 2002.


