  - number: '3'
    text: |-
      In zoverre in afwijking van [artikel 2][ref1] kan de heffingplichtige ten aanzien van een bedrijf volstaan met het
      bijhouden van de administratie van de tot het bedrijf behorende oppervlakte landbouwgrond, indien het bedrijf op
      elk moment in het desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:

      a. de veebezetting is niet groter dan twee grootvee-eenheden per hectare van de tot het bedrijf behorende
      oppervlakte landbouwgrond;

      b. de veebezetting is niet groter dan drie grootvee-eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009228
        artikel: '2'
        paragraaf: '2'
  - number: 3a
    text: |-
      In zoverre in afwijking van [artikel 2][ref1] kan de heffingplichtige ten aanzien van een bedrijf
      waarvan in het desbetreffende kalenderjaar de veebezetting gemiddeld niet groter is dan 2,5 grootvee-
      eenheden per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond, bedoeld in
      [artikel 1, eerste lid, onderdeel q, van de wet][ref2], een administratie van het aantal gehouden, uitgeschaarde
      of tijdelijk elders ter weiding ondergebrachte dieren bijhouden met gebruikmaking van het formulier, opgenomen
      in bijlage 3B, dat overeenkomstig de daarop aangegeven termijnen en overeenkomstig de daarbij aangegeven wijze
      volledig en juist wordt ingevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel3a
    references:
      - id: ref1
