  - number: 5d
    text: |-
      1 De persoon, rechtspersoon of het samenwerkingsverband van personen of rechtspersonen, bedoeld in
      [artikel 5a][ref1], onderscheidenlijk [artikel 5aa][ref2], doet van een wijziging in de titels, bedoeld in de
      [artikelen 1, eerste lid, onderdelen q en w, en derde lid][ref3], en [1a, tweede lid, van de wet][ref4] op grond
      waarvan percelen landbouwgrond of natuurterrein of gedeelten daarvan bij het bedrijf in gebruik zijn ten opzichte
      van de overeenkomstig de [artikelen 5a][ref5], [5aa][ref6], [5ba][ref7] en [5c][ref8] verstrekte gegevens melding
      aan de Dienst Basisregistraties van het Ministerie van Landbouw, Natuurbeheer en Visserij door inzending van het
      formulier, zoals opgenomen in bijlage 14, dat overeenkomstig de daarbij aangegeven wijze volledig en juist is
      ingevuld.

      2 De persoon, rechtspersoon of het samenwerkingsverband van personen of rechtspersonen, bedoeld in
      [artikel 5a][ref9], onderscheidenlijk 5aa, doet van een verkleining van de tot het bedrijf behorende oppervlakte
      landbouwgrond of natuurterrein of van een wijziging van de onderscheiden teelten op de percelen van de tot
      het bedrijf behorende oppervlakte landbouwgrond ten opzichte van de ingevolge de [artikelen 5a][ref10],
      [5aa][ref11], [5ba][ref12] en [5c][ref13] verstrekte gegevens melding aan de Dienst Basisregistraties van het
      Ministerie van Landbouw, Natuurbeheer en Visserij door inzending van het formulier, zoals opgenomen in bijlage
      15, dat overeenkomstig de daarbij aangegeven wijze volledig en juist is ingevuld, ingeval op enig moment in het
      desbetreffende jaar niet langer sprake is van een mestplaatsingsruimte of mestaanvoerruimte die ten minste zo groot
      is als de som van

      a de hoeveelheid dierlijke meststoffen die op jaarbasis uitgaande van de op dat moment gehouden dieren op het
      bedrijf wordt geproduceerd en

      b. de hoeveelheid dierlijke meststoffen waarvoor op grond van een mestafzetovereenkomst een verplichting tot
      aanvoer op het bedrijf geldt.

      3 De melding geschiedt uiterlijk dertig dagen na

      a. de dag waarop de desbetreffende wijziging zich heeft voorgedaan, indien de melding betrekking heeft op de
      gegevens, bedoeld in het eerste lid;

      b. het moment, bedoeld in het tweede lid, indien de melding betrekking heeft op de in dat lid bedoelde gegevens.

      4 De hoeveelheid dierlijke meststoffen, bedoeld in het tweede lid, onderdeel a, wordt vastgesteld op basis van
      het aantal op het desbetreffende moment gehouden dieren van de onderscheiden diercategorieën en op basis van de
      forfaitaire excretienormen voor de onderscheiden diercategorieën, uitgedrukt in kilogrammen stikstof per dier per
      jaar, opgenomen in [bijlage E bij de wet][ref14].


