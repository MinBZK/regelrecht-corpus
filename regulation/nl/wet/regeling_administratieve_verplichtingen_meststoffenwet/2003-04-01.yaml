  - number: 16h
    text: >-
      1 De aanvraag tot registratie van een persoonlijke gebruikerscode geschiedt via de internetsite van het Ministerie
      van Landbouw, Natuurbeheer en Visserij onder vermelding van het mestnummer en het elektronische postadres van de
      aanvrager.


      2 De Minister kan verzoeken om een bewijs van de juistheid van de bij de aanvraag verstrekte gegevens.


      3 De geregistreerde gebruikerscode wordt geactiveerd nadat de aanvrager een door hem schriftelijk ondertekend
      ontvangstbewijs heeft geretourneerd.
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel16h
  - number: 16i
    text: >-
      1 De Minister kan elektronisch verschafte gegevens weigeren voor zover de aanvaarding daarvan tot een onevenredige
      belasting voor de Minister zou leiden dan wel voor zover de betrouwbaarheid of vertrouwelijkheid van het
      desbetreffende bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel
      waarvoor het wordt gebruikt.


      2 De Minister deelt de weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel16i
  - number: 16j
    text: |-
      1 Een bedrijfsoverdracht of een wijziging van de tot het bedrijf behorende oppervlakte landbouwgrond wordt binnen
      dertig dagen nadat zij plaatsvond door de vervreemder en de verkrijger van het bedrijf, onderscheidenlijk de
      landbouwgrond, gezamenlijk gemeld aan het Bureau Heffingen.

      2 De melding, bedoeld in het eerste lid, geschiedt met gebruikmaking van het formulier dat als model X,
      onderscheidenlijk model VII, VIII, IX, XI, of XII in artikel 4 van de Regeling vaststelling formulieren
      [Wet verplaatsing mestproductie][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel16j
    references:
      - id: ref1
        bwb_id: BWBR0006285
  - number: 16k
    text: |-
      1 De producent van dierlijke meststoffen en de gebruiker van meststoffen zijn vrijgesteld van de in
      [artikel 2, tweede lid, van het Besluit administratieve verplichtingen Meststoffenwet][ref1] gestelde verplichting
      voor zover het betreft het bijhouden van een administratie met betrekking tot de aan hen afgeleverde andere
      meststoffen die fosfaat bevatten.

      2 De leverancier en de afnemer zijn vrijgesteld van de verplichtingen, bedoeld in de
      [artikelen 7, vierde lid][ref2], [10][ref3], [11][ref4] en [12 van het besluit][ref5].


