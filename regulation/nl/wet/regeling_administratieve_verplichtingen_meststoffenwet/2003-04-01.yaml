  - number: 5a
    text: |-
      1 De persoon of rechtspersoon die, of het samenwerkingsverband van personen of rechtspersonen
      dat op een bedrijf meststoffen aanvoert of dierlijke meststoffen produceert, verstrekt elk
      kalenderjaar vóór de uiterste ontvangstdatum, genoemd in de ministeriële regeling die ingevolge
      [artikel 8, eerste lid, van de Regeling EG-steunverlening akkerbouwgewassen][ref1] voor het desbetreffende
      jaar is vastgesteld, aan het Ministerie van Landbouw, Natuurbeheer en Visserij gegevens als bedoeld in
      [artikel 7a van de wet][ref2], door inzending van het daartoe door de minister van Landbouw, Natuurbeheer en
      Visserij vastgestelde formulier, dat overeenkomstig de daarbij aangegeven wijze volledig en naar waarheid wordt
      ingevuld, bij het op het formulier vermelde adres.

      2 De inzending van het formulier kan op elektronische wijze geschieden. Op elektronische inzending is de
      [Regeling elektronische indiening GDI 2003][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0014886
