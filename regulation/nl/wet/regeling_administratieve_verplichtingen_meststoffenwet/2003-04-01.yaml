  - number: 3b
    text: |-
      1 In zoverre in afwijking van [artikel 2][ref1] kan de heffingplichtige opgave doen van het op 1 april van het
      desbetreffende jaar gehouden aantal dieren, met gebruikmaking van het formulier dat is opgenomen in bijlage 3B en
      dat overeenkomstig de daarbij aangegeven wijze volledig en juist wordt ingevuld, ten aanzien van een bedrijf dat in
      het desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:

      a. de veebezetting is op geen enkel moment groter dan 0,3 grootvee-eenheden per hectare van de op dat moment bij
      het bedrijf behorende oppervlakte grond;

      b. de aanvoer van meststoffen en de productie van dierlijke meststoffen bedragen in totaal niet meer dan 15
      kilogram fosfaat van de gemiddeld in dat jaar bij het bedrijf behorende oppervlakte grond.

      2 De productie van dierlijke meststoffen wordt bepaald door het aantal op 1 april van het desbetreffende jaar
      gehouden dieren te vermenigvuldigen met de voor de dieren van de onderscheiden diercategorieën opgenomen forfaits
      in [bijlage A bij de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel3b
