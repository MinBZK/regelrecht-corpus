        bwb_id: BWBR0009000
        artikel: '14'
  - number: 16c
    text: >-
      De vervoerder van een vracht dierlijke meststoffen die zijn geanalyseerd vult, zodra hij de door het laboratorium
      verstrekte analyseresultaten heeft ontvangen, bij onderdeel 3c van het op die vracht betrekking hebbende
      vervoersbewijs de code van dat laboratorium en de kilogrammen fosfaat en stikstof van de geanalyseerde dierlijke
      meststoffen in.
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel16c
  - number: 16d
    text: >-
      1 De vervoerder van een vracht dierlijke meststoffen overlegt de met betrekking tot die vracht op het
      vervoersbewijs ingevulde gegevens aan het Bureau Heffingen binnen tien werkdagen na het vervoer van de dierlijke
      meststoffen door indiening van het origineel van het desbetreffende door hem ondertekende vervoersbewijs.


      2 Indien de dierlijke meststoffen worden geanalyseerd, overlegt de vervoerder van een vracht dierlijke meststoffen
      de met betrekking tot die vracht op het vervoersbewijs ingevulde gegevens aan het Bureau Heffingen door indiening
      van het origineel van het desbetreffende door hem ondertekende vervoersbewijs binnen dertig werkdagen na het
      vervoer van de dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel16d
  - number: 16e
    text: |-
      1 De vervoerder van een vracht dierlijke meststoffen overlegt met betrekking tot die vracht de in
      [artikel 16a, eerste lid][ref1], bedoelde gegevens aan de in dat lid bedoelde leverancier door verstrekking van een
      afschrift van het op die vracht betrekking hebbende vervoersbewijs.

      2 De vervoerder van een vracht dierlijke meststoffen overlegt met betrekking tot die vracht de in
      [artikel 16a, eerste en tweede lid][ref2], bedoelde gegevens aan de in het tweede lid bedoelde afnemer door
      verstrekking van een afschrift van het op die vracht betrekking hebbende vervoersbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009228/2003-04-01#Artikel16e
