  - number: 3c
    text: |-
      1 [Artikel 2][ref1] is in een kalenderjaar niet van toepassing ten aanzien van een bedrijf dat op elk moment in het
      desbetreffende kalenderjaar voldoet aan elk van de volgende voorwaarden:

      a. de veebezetting is niet groter dan twee grootvee-eenheden per hectare van de tot het bedrijf behorende
      oppervlakte landbouwgrond;

      b. de veebezetting is niet groter dan drie grootvee-eenheden;

      c. de tot het bedrijf behorende oppervlakte landbouwgrond is niet groter dan drie hectare;

      d. de som van de tot dan toe in dat jaar aangevoerde dierlijke en overige organische meststoffen en de productie
      van meststoffen door de op dat moment gehouden dieren op jaarbasis, uitgedrukt in kilogrammen fosfaat, is per
      hectare van de op dat moment tot het bedrijf behorende oppervlakte landbouwgrond ten hoogste 85 kilogram fosfaat;

      e. het bedrijf sluit geen mestafzetovereenkomst en is niet verplicht op grond van een mestafzetovereenkomst
      dierlijke meststoffen op het bedrijf aan te voeren.

      2 Op de vaststelling van de hoeveelheid aangevoerde dierlijke en overige organische meststoffen, bedoeld in het
      eerste lid, onderdeel d, is het bij en krachtens [artikel 17, tweede, derde en vierde lid, van de wet][ref2]
      bepaalde van overeenkomstige toepassing.

      3 De productie van dierlijke meststoffen op jaarbasis, bedoeld in het eerste lid, onderdeel d, wordt vastgesteld op
      basis van het aantal op het desbetreffende moment gehouden dieren van de onderscheiden diercategorieën en op basis
      van de forfaitaire productienormen voor de onderscheiden diercategorieën, uitgedrukt in kilogrammen fosfaat per
      dier per jaar, opgenomen in [bijlage A bij de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004054
