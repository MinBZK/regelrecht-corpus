  - number: 5c
    text: |-
      De in [artikel 58am van de wet][ref1] bedoelde aanmelding van landbouwgrond, onderscheiden naar grasland, bouwland
      beteeld met maïs, ander bouwland en braakland, en natuurterrein geschiedt bij het Ministerie van Landbouw,
      Natuurbeheer en Visserij door:

      a. verstrekking van gegevens met betrekking tot de landbouwgrond en het natuurterrein overeenkomstig
      [artikel 5a][ref2], 5aa of 5ba, of,

      b. ingeval met betrekking tot de landbouwgrond en het natuurterrein nog geen gegevens overeenkomstig
      [artikel 5a][ref3], 5aa of 5ba zijn verstrekt, door inzending van het formulier, zoals opgenomen in bijlage 15, dat
      overeenkomstig de daarbij aangegeven wijze volledig en juist is ingevuld, bij de Dienst Basisregistraties van het
      Ministerie van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58am
      [ref2]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
