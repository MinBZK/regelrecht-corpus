  - number: 5ba
    text: |-
      Indien na de datum, bedoeld in [artikel 5a, eerste lid, onderscheidenlijk derde lid][ref1], op enig moment niet
      meer wordt voldaan aan de voorwaarden, bedoeld in [artikel 5b][ref2], geschiedt de verstrekking van de gegevens,
