  - number: 3d
    text: |-
      Voor de toepassing van de [artikelen 3 tot en met 3c][ref1] geschiedt de omrekening van dieren van de onderscheiden
      diercategorieën naar grootvee-eenheden overeenkomstig de daarvoor in [bijlage A bij de wet][ref2] opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0009228#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004054
