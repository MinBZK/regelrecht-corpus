  - number: '6'
    text: |-
      1 De aanmelding, bedoeld in [artikel 22 van de wet][ref1], geschiedt door indiening bij het Hoofd van het Bureau
      heffingen van een door de minister vastgesteld formulier, dat volledig is ingevuld en ondertekend, dan wel door
      op de daartoe bestemde plaats op het tijdig ingediende aangiftebiljet voor de verfijnde mineralenheffingen van de
      aanmelding melding te maken.

      2 De aanmelding geschiedt vóór 1 september van het jaar volgend op het jaar waarop de aanmelding betrekking heeft
      en geldt tevens voor de jaren volgend op het jaar waarop de aanmelding betrekking heeft.

      3 Het bedrijf is niet langer aangemeld indien het aangifte doet van de heffingen, bedoeld in [titel 1][ref2] van
      [hoofdstuk IV van de wet][ref3].

      4 Het formulier, bedoeld in het eerste lid, is opgenomen in bijlage 5, indien de aanmelding betrekking heeft op het
      jaar 1998, en in bijlage 5A, indien de aanmelding betrekking heeft op het jaar 1999.


