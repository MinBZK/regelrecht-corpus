        artikel: '8'
        paragraaf: '2'
  - number: '10'
    text: |-
      Voor subsidie voor plaatsing komt in aanmerking, de intermediair door wiens bemiddeling een oudere werkloze een
      dienstbetrekking van tenminste drie maanden heeft aanvaard, en de oudere werkloze in deze dienstbetrekking:

      a. ieder aangiftetijdvak verloonde uren heeft genoten; en

      b. gemiddeld in de gehele periode over ten minste de helft van het aantal uren waarop zijn uitkering, op grond
      van [hoofdstuk II van de Werkloosheidswet][ref1], was gebaseerd, doch over niet minder dan gemiddeld 12 uren per
      week, verloonde uren heeft genoten, waarbij loon geacht wordt te zijn genoten in het aangiftetijdvak waarover de
      werkgever of de inhoudingsplichtige van dat loon opgave heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: '11'
    text: |-
      1 De subsidie bedraagt bij een plaatsing in een dienstverband van tenminste drie maanden € 300,–.

      2 Indien de plaatsing, bedoeld in het eerste lid, tenminste zes maanden heeft geduurd, wordt het bedrag, genoemd in
      het eerste lid, aangevuld met € 700,–.

      3 Indien de plaatsing, bedoeld in het eerste lid, tenminste twaalf maanden heeft geduurd, wordt het bedrag, genoemd
      in het tweede lid, aangevuld met € 500,–.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel11
  - number: '12'
    text: |-
      1 De subsidieaanvrager kan, ten behoeve van dezelfde oudere werkloze, slechts eenmaal voor een subsidie, als
      bedoeld in [artikel 11][ref1], onderscheidenlijk eerste, tweede of derde lid, in aanmerking komen.

      2 De aanvraag voor de subsidie als bedoeld in [artikel 11, eerste lid][ref2], wordt binnen 45 kalenderdagen
      na afloop van de periode van 3 maanden ingediend met gebruikmaking van een door UWV beschikbaar gesteld
      aanvraagformulier.

      3 In aanvulling op de aanvraag bedoeld in het tweede lid, wordt de aanvraag voor subsidie als bedoeld in
      [artikel 11, tweede lid][ref3], binnen 45 kalenderdagen na afloop van de periode van 6 maanden ingediend met
      gebruikmaking van een door UWV beschikbaar gesteld aanvraagformulier.

      4 In aanvulling op de aanvraag bedoeld in het derde lid, wordt de aanvraag voor subsidie als bedoeld in
      [artikel 11, derde lid][ref4], binnen 45 kalenderdagen na afloop van de periode van 12 maanden ingediend met
      gebruikmaking van een door UWV beschikbaar gesteld aanvraagformulier.

      5 De aanvraag is volledig als het aanvraagformulier volledig is ingevuld en is ondertekend door de aanvrager en
      alle gevraagde bijlagen zijn bijgevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033947#Artikel11
