        bwb_id: BWBR0033947
        artikel: '17'
        paragraaf: '4'
  - number: '21'
    text: |-
      Op subsidies verleend op grond van deze regeling is de [Algemene regeling SZW-subsidies][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009211
  - number: '22'
    text: |-
      1 De minister verleent aan het UWV het volgende mandaat:

      a. het UWV is bevoegd om in het kader van de uitvoering van deze regeling namens de minister besluiten te nemen,
      privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die een privaatrechtelijke
      rechtshandeling noch een besluit zijn;

      b. het UWV is bevoegd om in het kader van de uitvoering van deze regeling namens de minister te beslissen op
      bezwaarschriften, met dien verstande dat degene die betrokken is bij het besluitvormingsproces ten aanzien van het
      bezwaarschrift niet ook betrokken is geweest bij het besluitvormingsproces in eerste aanleg;

      c. het UWV is bevoegd om in het kader van de uitvoering van deze regeling namens de minister in rechte op te treden
      en tegen rechterlijke uitspraken hoger beroep of cassatie in te stellen, dan wel af te zien van hoger beroep of
      cassatie.

      2 Het UWV is bevoegd in het kader van de uitvoering van deze regeling tot het verlenen van ondermandaat of het
      doorverlenen van zijn andere vertegenwoordigingsbevoegdheden aan bij het UWV werkzame functionarissen.

      3 [Hoofdstuk 4 van het Organisatie-, mandaat- en volmachtbesluit SZW 2009][ref1] is van toepassing op de
      uitoefening van bevoegdheden op grond van deze regeling en tevens op de uitoefening van bevoegdheden die krachtens
      ondermandaat respectievelijk doorverlening van volmacht en machtiging worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024956
        hoofdstuk: '4'
  - number: '23'
    text: |-
      Het UWV brengt aan de minister inhoudelijk en financieel verslag uit over de uitvoering van de regeling
      overeenkomstig [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '24'
    text: |-
      1 Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling.

      2 Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel24
  - number: '25'
    text: |-
      1 Voor 1 oktober van elk jaar verstrekt het UWV aan de Minister een opgave van het totaalbedrag aan de voor het
      komende jaar geraamde lasten met betrekking tot deze regeling.

      2 In afwijking van het eerste lid, wordt de opgave van het totaalbedrag van de geraamde lasten voor het jaar 2013
      ingediend voor 1 oktober 2013.

      3 De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref1], een
      periodiek voorschot op het bedrag, bedoeld in het eerste lid, van de geraamde subsidielasten met als valutadatum de
      tweeëntwintigste dag van elke maand.

      4 De Minister kan, na overleg met het UWV, van de in het eerste en tweede lid bedoelde bedragen afwijken.


