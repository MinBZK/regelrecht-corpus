preamble:
  text: |-
    Gelet op artikelen 3 en 5 van de Kaderwet SZW-subsidies en 32d, eerste lid, van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aangiftetijdvak:* het tijdvak van vier weken dan wel één maand waarop de aangifte waarop de ingehouden
      loonbelasting wordt afgedragen, betrekking heeft danwel, indien de werkgever over een afwijkend tijdvak aangifte
      doet, het tijdvak waarover loon is betaald van vier weken of één maand of herleid tot vier weken of één maand;
        - *arbeidsmarktregio:* een arbeidsmarktregio die is opgenomen in [bijlage 1][ref1] bij deze regeling;
        - *dienstbetrekking:* dienstbetrekking als bedoeld in [hoofdstuk I van de Werkloosheidswet][ref2];
        - *ervaringscertificaat:* een overzicht van de door de persoon in de praktijk geleerde en erkende competenties
      zoals zijn kennis, vaardigheden en kwaliteiten;
        - *intermediair:* de rechtspersoon die bemiddelingsactiviteiten verricht tussen werkzoekenden en werkgevers, met
      als doel de werkzoekende duurzaam te plaatsen in een dienstbetrekking en die als zodanig staat ingeschreven bij de
      Kamer van Koophandel;
        - *kansberoep:* beroep waarvan het UWV heeft geoordeeld dat daarvoor een aanmerkelijke hoeveelheid vacatures is in
      de betreffende arbeidsmarktregio;
        - *minister:* Minister van Sociale Zaken en Werkgelegenheid;
        - *oudere werkloze:* de persoon die recht heeft op een uitkering op grond van
      [hoofdstuk II van de Werkloosheidswet][ref3] en die op de dag van aanvang van de scholing of EVC-procedure, dan wel
      op de dag van aanvang van de dienstbetrekking de leeftijd van 50 jaar heeft bereikt;
        - *EVC-procedure:* procedure Erkenning van Verworven Competenties zijnde een geheel van processtappen
      en gehanteerde instrumenten waarmee de verworven competenties van deelnemers worden beoordeeld, door een
      erkende aanbieder, ten opzichte van een specifieke landelijke standaard, resulterend in afgifte van een
      ervaringscertificaat;
        - *scholing:* het volgen van een opleiding of een training gericht op het verwerven van vaardigheden en
      competenties die benodigd zijn om een beroep of functie uit te kunnen oefenen dan wel werkzaamheden in de
      uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep te kunnen verrichten en die leidt tot
      een door een branche of sector erkend certificaat of diploma;
        - *UWV:* Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033947
