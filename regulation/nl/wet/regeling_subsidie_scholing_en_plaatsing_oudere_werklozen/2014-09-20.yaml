  - number: '20'
    text: |-
      De verleende subsidie wordt teruggevorderd indien deze ten onrechte of voor een te hoog bedrag is verstrekt of
      indien niet aan de verplichtingen, bedoeld in [artikel 17][ref1], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033947#Artikel17
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel20
    references:
