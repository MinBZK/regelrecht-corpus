  - number: '16'
    text: |-
      1 De subsidieaanvraag voor scholing wordt ingediend in de periode vanaf de datum van inwerkingtreding van deze
      regeling tot en met 30 september 2016.

      2 De subsidieaanvraag voor plaatsing kan worden ingediend voor dienstverbanden aangevangen vanaf de datum
      van inwerkingtreding van deze regeling tot en met 30 september 2016, binnen de gestelde termijnen, bedoeld in
      [artikel 12][ref1].

      3 Een subsidieaanvraag die is ingediend na afloop van de periode, bedoeld in het eerste en tweede lid, wordt niet
      in behandeling genomen.

      4 De subsidie wordt toegekend aan de subsidieaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0033947#Artikel12
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0033947
        artikel: '12'
        paragraaf: '3'
  - number: '17'
    text: |-
      1 De subsidieaanvrager aan wie subsidie voor scholing is toegekend is verplicht onverwijld een melding te doen
      aan het UWV zodra aannemelijk is dat de scholing niet of niet geheel zal plaatsvinden, of dat niet aan de overige
      verplichtingen zal worden voldaan.

      2 De subsidieaanvrager aan wie subsidie voor scholing of plaatsing is toegekend is verplicht desgevraagd alle
      medewerking te verlenen aan een steekproef.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel17
  - number: '18'
    text: |-
      Het subsidieplafond voor scholing en plaatsing tezamen bedraagt voor de periode vanaf de datum van inwerkingtreding
      van deze regeling tot en met 31 oktober 2017, € 42.000.000,–.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel18
  - number: '19'
    text: |-
      1 Voor het bepalen van het bereiken van het subsidieplafond worden de subsidieaanvragen op volgorde van
      binnenkomst behandeld, waarbij alleen volledige subsidieaanvragen in behandeling worden genomen. Van een volledige
      subsidieaanvraag is sprake indien wordt voldaan aan de [artikelen 6][ref1] of [12][ref2].

      2 Wanneer de subsidieaanvrager op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref3] de gelegenheid
      heeft gehad zijn aanvraag aan te vullen, geldt als datum van binnenkomst de datum van ontvangst van de volledige
      aanvraag.

      3 Indien subsidievaststelling op grond van de subsidieaanvragen die op dezelfde datum zijn binnengekomen leidt
      tot overschrijding van het van toepassing zijnde subsidieplafond, wordt, indien de volgorde van binnenkomst van
      die aanvragen niet kan worden vastgesteld, in afwijking van het eerste lid, met betrekking tot die aanvragen de
      volgorde door loting vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0033947#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0033947#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
