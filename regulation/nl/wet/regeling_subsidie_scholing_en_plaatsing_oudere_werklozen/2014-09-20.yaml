  - number: '13'
    text: |-
      1 De subsidie wordt geweigerd, indien:

      a. de volledige aanvraag niet is ontvangen binnen de termijn, genoemd in [artikel 12][ref1]; of

      b. de plaatsing waarvoor de subsidie wordt aangevraagd reeds uit andere publieke middelen wordt gefinancierd.

      2 Het eerste lid, onderdeel a, is niet van toepassing op de aanvrager wiens onvolledige aanvraag
      binnen de termijn, genoemd in [artikel 12][ref2], is ontvangen en die door het UWV op grond van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref3] in de gelegenheid is gesteld om zijn aanvraag aan te vullen.


