        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '8'
    text: Het UWV beslist binnen acht weken na ontvangst van de volledige aanvraag op die aanvraag.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel8
  - number: '9'
    text: |-
      Binnen 30 kalenderdagen na het afgeven van de beschikking, bedoeld in [artikel 8][ref1], betaalt het UWV de
      subsidie aan de subsidieaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0033947#Artikel8
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel9
