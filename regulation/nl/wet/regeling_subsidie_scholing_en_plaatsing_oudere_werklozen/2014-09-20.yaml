  - number: '2'
    text: |-
      De minister verstrekt op aanvraag subsidie voor op vacature of op zelfstandig ondernemen gerichte scholing en voor
      plaatsing van een oudere werkloze bij een werkgever, door een intermediair.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel2
  - number: '3'
    text: |-
      1 Voor subsidie voor scholing, gestart op of na de dag van inwerkingtreding van deze regeling, en die maximaal één
      jaar duurt, komt in aanmerking de oudere werkloze die:

      a. een verklaring van de werkgever heeft waarin wordt vermeld dat de werkgever de intentie heeft om de oudere
      werkloze, uiterlijk op de eerste dag van de kalendermaand volgend op de kalendermaand waarin de scholing is
      afgerond, voor tenminste drie maanden, en gemiddeld voor de helft van het aantal uren waarop de uitkering, op grond
      van [hoofdstuk II van de Werkloosheidswet][ref1], is vastgesteld, doch niet minder dan gemiddeld 12 uren per week,
      in dienst te nemen; of

      b. een scholing gaat volgen die opleidt naar een kansberoep.

      2 Voor subsidie voor scholing, gestart op of na de dag van inwerkingtreding van deze regeling, kan op aanvraag in
      aanmerking komen, de oudere werkloze, indien:

      a. de scholing naar het oordeel van het UWV noodzakelijk is;

      b. zonder scholing vrijwel geen uitzicht bestaat op het op korte termijn kunnen aanvaarden van een
      dienstbetrekking; en

      c. de scholing maximaal één jaar duurt.

      3 Voor subsidie voor scholing kan op aanvraag in aanmerking komen de oudere werkloze, die via een EVC-procedure,
      zijn competenties en ervaring in een ervaringscertificaat laat vastleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: '4'
    text: |-
      Voor subsidie voor scholing komt in aanmerking de werkgever die de oudere werkloze uiterlijk de eerste dag van de
      kalendermaand volgend op de kalendermaand waarin de scholing is afgerond, in dienst neemt, met dien verstande dat
      de dienstbetrekking wordt aangegaan voor:

      a. tenminste drie maanden; en

      b. gemiddeld tenminste de helft van het aantal uren waarop de uitkering, op grond van
      [hoofdstuk II van de Werkloosheidswet][ref1], is vastgesteld, doch niet voor minder dan gemiddeld 12 uren per week.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: '5'
    text: |-
      De subsidie voor scholing bedraagt 100% van de werkelijke kosten van de scholing, tot een maximum van € 1.000,–,
      inclusief BTW, per oudere werkloze en wordt desgevraagd ofwel aan de oudere werkloze, dan wel aan de werkgever
      verstrekt. Indien zowel de oudere werkloze, als de werkgever voor dezelfde scholing subsidie aanvragen, wordt de
      subsidie verstrekt aan de subsidieaanvrager wiens volledige subsidieaanvraag als eerste is ontvangen.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel5
  - number: '6'
    text: |-
      De subsidieaanvraag voor scholing wordt, uiterlijk twee weken na aanvang van die scholing, bij het UWV ingediend,
      met gebruikmaking van een door het UWV beschikbaar gesteld aanvraagformulier. De aanvraag is volledig als het
      aanvraagformulier volledig is ingevuld en is ondertekend door de aanvrager en alle gevraagde bijlagen zijn
      bijgevoegd.
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel6
  - number: '7'
    text: |-
      1 De subsidie voor scholing wordt geweigerd, indien:

      a. de volledige aanvraag is ontvangen na de termijn, bedoeld in [artikel 6][ref1];

      b. ten behoeve van dezelfde oudere werkloze subsidie voor scholing, op grond van deze regeling, reeds is verleend;
      of

      c. de kosten van scholing waarvoor de subsidie wordt aangevraagd reeds uit andere publieke middelen worden
      gefinancierd.

      2 Het eerste lid, onderdeel a, is niet van toepassing op de aanvrager wiens onvolledige aanvraag
      voor de aanvang van de scholing van de oudere werkloze is ontvangen en die door het UWV op grond van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2] in de gelegenheid is gesteld om zijn aanvraag aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0033947#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0033947/2014-09-20#Artikel7
    references:
