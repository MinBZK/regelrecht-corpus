    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 januari 2018.

      2 In afwijking van het eerste lid blijft deze regeling, zoals die luidde op 31 december 2017, van toepassing op de
      afwikkeling van de subsidie op grond van deze regeling.
