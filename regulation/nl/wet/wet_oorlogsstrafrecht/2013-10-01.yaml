preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bepalingen vast te stellen met betrekking tot in geval
    van oorlog gepleegde misdrijven en hun berechting, zomede enige wijzigingen aan te brengen in het Wetboek van
    Strafrecht, het Wetboek van Militair Strafrecht en de Invoeringswet Militair Straf- en Tuchtrecht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#ArtikelAanhef
articles:
  - number: I
    text: De navolgende bepalingen worden vastgesteld, die kunnen worden aangehaald als WET OORLOGSSTRAFRECHT
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#ArtikelI
  - number: '1'
    text: |-
      1 De bepalingen van deze wet zijn van toepassing op de misdrijven, in geval van oorlog begaan of eerst in geval van
      oorlog strafbaar, welke zijn omschreven in:

      1°. een der [Titels I][ref1] en [II van het Tweede Boek van het Wetboek van Strafrecht][ref2];

      2°. het [Wetboek van Militair Strafrecht][ref3];

      3°. de [artikelen 4 tot en met 7 van deze wet][ref4];

      4°. de [artikelen 131 tot en met 134][ref5], [189][ref6] en [416-417][ref7], indien het strafbare feit of het
      misdrijf, waarvan in die artikelen gesproken wordt, is een misdrijf als in dit artikel bedoeld.

      2 In geval van een gewapend conflict, dat niet als oorlog kan worden aangemerkt en waarbij Nederland is betrokken
      hetzij ter individuele of collectieve zelfverdediging, hetzij tot herstel van internationale orde en veiligheid,
      zijn de [artikelen 4 tot en met 7][ref8] van overeenkomstige toepassing en kunnen Wij bij algemene maatregel van
      bestuur bepalen, dat de overige bepalingen van deze wet geheel of ten dele van toepassing zullen zijn.

      3 Onder oorlog wordt begrepen burgeroorlog.


