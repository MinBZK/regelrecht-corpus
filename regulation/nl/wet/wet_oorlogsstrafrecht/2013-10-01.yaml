  - number: '11'
    text: |-
      De bij de [artikelen 4 tot en met 7][ref1] strafbaar gestelde feiten worden beschouwd als misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel4
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '4'
  - number: '12'
    text: |-
      1 Van de misdrijven, in [artikel 1][ref1] bedoeld, door wie ook begaan, nemen, behoudens het bepaalde in het tweede
      lid, kennis de gerechten bedoeld in de [Wet militaire strafrechtspraak][ref2], de Hoge Raad daaronder begrepen, op
      de wijze als in die wet bepaald.

      2 Indien de vervolging van een misdrijf als in [artikel 1][ref3] bedoeld plaats vindt na een vijandelijke bezetting
      van het grondgebied van het rijk in Europa of van een gedeelte daarvan, nemen bijzondere rechtbanken en het
      Bijzondere Hooggerechtshof van deze misdrijven kennis met uitzondering van de misdrijven, door militairen begaan,
      bedoeld in [artikel 1, eerste lid, onder 2°][ref4]., of omschreven in de [artikelen 131 tot en met 134][ref5],
      [189][ref6] of [416-417][ref7], indien het misdrijf, waarvan in die artikelen gesproken wordt, is een misdrijf als
      bedoeld in [artikel 1, eerste lid, onder 2°][ref8].

      3 Wij kunnen bij algemene maatregel van bestuur voorzieningen treffen omtrent de overgang van zaken naar de
      bijzondere gerechten alsmede omtrent de voorbereiding van de vervolging voor de tijd, dat deze gerechten nog niet
      zijn ingesteld. Daarbij kan tevens worden bepaald dat de bijzondere gerechten mede kennisnemen van misdrijven,
      omschreven in de [Wet internationale misdrijven][ref9].

      4 Wij behouden Ons voor bij algemene maatregel van bestuur te bepalen, dat wegens de geringe omvang of duur der
      bezetting het bepaalde in het tweede lid buiten toepassing zal blijven.

      5 Eveneens behouden Wij Ons voor bij algemene maatregel van bestuur te bepalen, dat na afloop van feitelijke
      oorlogshandelingen, ook wanneer daaraan niet een vijandelijke bezetting van het Rijk in Europa of van een gedeelte
      daarvan is voorafgegaan, het tweede lid in verband met de omvang en de aard der te berechten feiten toepassing
      zal vinden.


