  - number: '21'
    text: |-
      Op de rechtspleging bij de bijzondere rechtbanken en bij het Bijzondere Hooggerechtshof zijn de bepalingen van het
      [Wetboek van Strafvordering][ref1] van overeenkomstige toepassing, indien en voor zover van die bepalingen niet in
      deze wet wordt afgeweken, met dien verstande dat:

      1°. hetgeen daarin omtrent de rechtbank, derzelver voorzitter, de rechters, de rechter-commissaris, de officier van
      justitie en de griffier bij de rechtbank is bepaald, te dezen geldt voor de bijzondere rechtbank en de ambtsdragers
      bij dit college;

      2°. hetgeen daarin omtrent de Hoge Raad, deszelfs voorzitter en leden, de procureur-generaal en de griffier van de
      Hoge Raad is bepaald, te dezen geldt voor het Bijzondere Hooggerechtshof en de ambtsdragers bij dit Hof;

      3°. hetgeen daarin met betrekking tot de rechtbank of het gerechtshof en de leden der rechterlijke macht bij een
      dezer gerechten is bepaald, te dezen buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '22'
    text: |-
      Onze Minister van Justitie kan bepalen, dat in geval van een misdrijf, waarop deze wet van toepassing is, een bevel
      tot inverzekeringstelling, als bedoeld in [artikel 57 van het Wetboek van Strafvordering][ref1], gedurende een
      langere dan de in artikel 58, tweede lid, van dat Wetboek genoemde termijn van twee dagen van kracht zal zijn, met
      dien verstande dat de inverzekeringstelling niet langer dan een jaar mag duren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '23'
    text: |-
      1 Onze Minister van Justitie kan, indien zulks voor de goede gang van zaken nodig is, bepalen, dat bij een
      bijzondere rechtbank één of meer rechters belast worden met vereenvoudigde gerechtelijke afdoening van strafzaken
      overeenkomstig het bepaalde in deze afdeling.

      2 Deze worden op voordracht van de president voor de tijd van één jaar uit de rechtsgeleerde leden of
      plaatsvervangende leden van de bijzondere rechtbank door Onze Minister van Justitie aangewezen.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel23
  - number: '24'
    text: |-
      Indien naar het aanvankelijk oordeel van het openbaar ministerie in een zaak als hoofdstraf gevangenisstraf van ten
      hoogste zes jaren, hechtenis of geldboete dient te worden opgelegd en de zaak naar het aanvankelijk oordeel van het
      openbaar ministerie voor vereenvoudigde gerechtelijke afdoening in aanmerking komt, stelt het de stukken, vergezeld
      van een schriftelijke vordering tot oplegging van een bepaalde straf, te dien einde in handen van de rechter.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel24
  - number: '25'
    text: |-
      Indien de rechter oordeelt, dat de zaak niet voor vereenvoudigde gerechtelijke afdoening in aanmerking komt, geeft
      hij daarvan kennis aan het openbaar ministerie onder wederoverlegging der stukken.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel25
  - number: '26'
    text: |-
      1 Indien de rechter op grond van de stukken en het verhoor van de verdachte de overtuiging heeft bekomen, dat deze
      een misdrijf heeft begaan, waarop de bepalingen van deze wet van toepassing zijn, en deswege strafbaar is, kan hij
      de verdachte straf opleggen. De rechter is niet bevoegd tot oplegging van andere hoofdstraffen dan gevangenisstraf
      van ten hoogste zes jaren, hechtenis en geldboete.

      2 Indien de rechter niet de overtuiging heeft bekomen, dat de verdachte een bepaald feit, in de vordering van het
      openbaar ministerie vermeld, heeft begaan, spreekt hij hem ter zake van dat feit vrij.

      3 Indien de rechter de overtuiging heeft bekomen, dat de verdachte een bepaald feit, in de vordering van het
      openbaar ministerie vermeld, heeft begaan doch van oordeel is, dat dit niet is een misdrijf, waarop de bepalingen
      van deze wet van toepassing zijn, of dat de verdachte deswege niet strafbaar is, verklaart hij zich onbevoegd
      onderscheidenlijk ontslaat hij hem ter zake van dat feit van alle rechtsvervolging.

      4 De rechter geeft de beslissing, in dit artikel bedoeld, bij schriftelijke beschikking.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel26
  - number: '27'
    text: |-
      1 De rechter geeft de beschikking niet alvorens de verdachte te hebben gehoord. Hij doet de verdachte, die in
      verzekerde bewaring is, voor zich verschijnen. Indien de verdachte in vrijheid is, beveelt hij diens dagvaarding;
      indien de verdachte niet op de dagvaarding verschijnt, doet hij hem andermaal dagvaarden; hij kan daarbij diens
      medebrenging bevelen of zodanig bevel later uitvaardigen.

      2 De president van de bijzondere rechtbank voegt de verdachte, die geen raadsman heeft, uiterlijk de tiende dag
      vóór die, waarop het verhoor zal plaats vinden, een raadsman toe. Van deze toevoeging benevens van de datum van het
      verhoor wordt onverwijld schriftelijk kennis gegeven aan de raadsman en aan de verdachte.

      3 De rechter stelt de verdachte en diens raadsman desverlangd in de gelegenheid van de stukken kennis te nemen.

      4 Het openbaar ministerie en de raadsman van de verdachte zijn bevoegd het verhoor bij te wonen. In dat geval
      worden zij in de gelegenheid gesteld het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel27
  - number: '28'
    text: |-
      1 De beschikking behelst de naam van de rechter, de dag waarop de beschikking is genomen, en voor zover mogelijk
      naam en voornamen, leeftijd, geboorteplaats, beroep en woon- of verblijfplaats van de verdachte.

      2 De beschikking bevat voorts de beslissing op grond van [artikel 26][ref1] genomen. In geval van een beslissing
      als in het eerste lid van dat artikel bedoeld, vermeldt de beschikking de opgelegde straf en het strafbare feit
      volgens de wettelijke omschrijving ter zake waarvan de straf is opgelegd, met vermelding omstreeks welke tijd en
      waar ter plaatse het is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel26
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '26'
  - number: '29'
    text: |-
      1 De rechter doet de beschikking met de stukken onverwijld toekomen aan het openbaar ministerie.

      2 De beschikking wordt aan de verdachte in persoon betekend, tenzij zij is genomen en aan de verdachte in afschrift
      is uitgereikt aanstonds na het verhoor. In het laatste geval maakt de rechter van de uitreiking een acte op.
      Bij de uitreiking of betekening wordt de verdachte opmerkzaam gemaakt op de bevoegdheden, hem toegekend in de
      [artikelen 30][ref1] en [31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002099#Artikel31
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0002099
        artikel: '31'
  - number: '30'
    text: |-
      1 De verdachte is bevoegd uiterlijk binnen drie weken na de dagtekening van de beschikking, welke hem bij
      gelegenheid van zijn verhoor is uitgereikt, of anders binnen drie weken na de datum, waarop de beschikking
      hem in persoon is betekend, een verklaring van bezwaar af te leggen. De artikelen 449-452 van het
      [Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing.

      2 Gelijke bevoegdheid komt toe aan het openbaar ministerie binnen twee weken na dagtekening van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '31'
    text: |-
      Het openbaar ministerie en de verdachte kunnen afstand doen van de bevoegdheid om een verklaring van bezwaar af
      te leggen. [Artikel 454 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing, met dien
      verstande dat het openbaar ministerie en de verdachte ook aanstonds na de uitreiking van het afschrift van de
      beschikking bij gelegenheid van het verhoor afstand kunnen doen van de bevoegdheid een verklaring van bezwaar af te
      leggen; in dat geval wordt de acte door de rechter opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel454
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '454'
  - number: '32'
    text: |-
      1 Door een verklaring van bezwaar vervalt de beschikking.

      2 De beschikking vervalt eveneens, indien zij niet binnen drie maanden na haar dagtekening in afschrift uitgereikt
      of betekend is.

      3 Wanneer de termijn, in [artikel 30][ref1] genoemd, is verstreken zonder dat een verklaring van bezwaar is
      afgelegd, of zoveel eerder als zowel door het openbaar ministerie als door de verdachte afstand is gedaan van
      de bevoegdheid om een verklaring van bezwaar af te leggen, geldt de beschikking als een einduitspraak van de
      bijzondere rechtbank, waartegen geen gewoon rechtsmiddel openstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel30
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '30'
  - number: '33'
    text: |-
      1 De verdachte kan ter terechtzitting van het Bijzondere Hooggerechtshof omtrent zijn persoon en zijn persoonlijke
      omstandigheden worden gehoord.

      2 Te dien einde kan het Bijzondere Hooggerechtshof, indien de verdachte op de bepaalde rechtsdag niet ter
      terechtzitting aanwezig is, zowel bij de aanvang als gedurende de loop der behandeling der zaak bevelen, dat hij
      op een door het Hof te bepalen tijdstip ter terechtzitting aanwezig zal zijn en daartoe tevens zijn medebrenging
      gelasten.

      3 Het bepaalde in [artikel 310 van het Wetboek van Strafvordering][ref1] is voor de behandeling der zaak in
      cassatie van overeenkomstige toepassing, met dien verstande dat hetgeen daar ten aanzien van de rechtbank en de
      officier van justitie is bepaald, te dezen geldt voor het Bijzondere Hooggerechtshof en de procureur-generaal bij
      dat hof.

      4 Indien het Bijzondere Hooggerechtshof een nader onderzoek naar de omstandigheden, waaronder het misdrijf is
      begaan, of naar de persoon of de persoonlijke omstandigheden van de verdachte noodzakelijk oordeelt, zijn de
      [artikelen 316][ref2] en [317 van het Wetboek van Strafvordering][ref3] van overeenkomstige toepassing, met dien
      verstande, dat hetgeen daar ten aanzien van de rechtbank, de officier van justitie en de rechter-commissaris is
      bepaald, ten deze geldt voor het Bijzondere Hooggerechtshof, de procureur-generaal bij dat hof en de rechter-
      commissaris bij de bijzondere rechtbank, die in eerste aanleg uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel310
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel316
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel317
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '310'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '316'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '317'
  - number: '34'
    text: |-
      Indien een onderzoek als in [artikel 33, vierde lid][ref1], bedoeld, mede leidt tot het oordeel, dat de verdachte
      niet strafbaar is, kan het Bijzondere Hooggerechtshof de verdachte van rechtsvervolging ontslaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel33
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '33'
  - number: '35'
    text: |-
      Indien alleen door de verdachte beroep in cassatie is ingesteld, kan hij ter zake van hetgeen in eerste aanleg
      te zijnen aanzien bewezen is verklaard, slechts met eenparigheid van stemmen tot een zwaardere straf worden
      veroordeeld dan hem bij het vonnis van de bijzondere rechtbank is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel35
  - number: '36'
    text: |-
      1 In afwijking in zoverre van het bepaalde in [artikel 471, eerste lid, van het Wetboek van Strafvordering][ref1]
      geschiedt zowel in het daar als ook in het in [artikel 472, eerste en tweede lid, van dat Wetboek][ref2] bedoelde
      geval, de verwijzing naar een bijzondere rechtbank.

      2 Hetgeen bij de [artikelen 473][ref3] en [476 van dat Wetboek][ref4], alsmede bij de artikelen, waarnaar daarin
      wordt verwezen, omtrent het gerechtshof, deszelfs voorzitter en de advocaat-generaal is bepaald, is ten aanzien van
      de bijzondere rechtbank, derzelver voorzitter en de officier van justitie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel471
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel472
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel473
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel476
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '471'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '472'
      - id: ref3
