  - number: '4'
    text: |-
      De Nederlander, die vrijwillig in krijgsdienst treedt bij een buitenlandse mogendheid, wetende, dat deze met
      Nederland in oorlog is, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren
      of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel4
  - number: '5'
    text: |-
      1 Hij die in geval van oorlog opzettelijk een ander blootstelt aan opsporing, vervolging, vrijheidsberoving
      of -beperking, enige straf of enige maatregel door of vanwege de vijand of diens helpers, wordt gestraft met
      gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.

      2 Levenslange gevangenisstraf, of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt opgelegd, indien het feit zwaar lichamelijk letsel, de dood of de vermissing, waaruit redelijkerwijze de dood
      is af te leiden, ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel5
  - number: '6'
    text: |-
      Hij die een misdrijf begaat en daartoe gebruik maakt of dreigt te maken van macht, gelegenheid of middel, hem door
      de vijand geboden, wordt gestraft met:

      1°. het dubbele van de op dat misdrijf gestelde gevangenisstraf, indien deze niet meer dan tien jaren
      gevangenisstraf bedraagt;

      2°. levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren, of geldboete van de vijfde categorie
      indien op dat misdrijf gevangenisstraf van meer dan tien jaren is gesteld;
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel6
  - number: '7'
    text: |-
      Hij die in geval van oorlog opzettelijk gebruik maakt of dreigt te maken van macht, gelegenheid of middel hem
      door de vijand geboden, om een ander in zijn vermogen wederrechtelijk te benadelen of om zich of een ander
      wederrechtelijk te bevoordelen, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel7
  - number: 10a
    text: |-
      Bij veroordeling tot een gevangenisstraf van tenminste een jaar wegens een der
      in de [artikelen 4 tot en met 7][ref1] bedoelde feiten kan ontzetting van het in
      [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref2] vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel10a
