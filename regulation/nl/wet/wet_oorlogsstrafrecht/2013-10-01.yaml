        artikel: '473'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '476'
  - number: '37'
    text: |-
      1 In afwijking in zoverre van [artikel 482g van het Wetboek van Strafvordering][ref1], geschiedt in het daar
      bedoelde geval, de verwijzing naar een bijzondere rechtbank.

      2 Hetgeen bij [artikel 482g van het Wetboek van Strafvordering][ref2], alsmede bij de artikelen, waarnaar daarin
      wordt verwezen, omtrent de rechtbank, deszelfs voorzitter en de officier van justitie is bepaald, is ten aanzien
      van de bijzondere rechtbank, derzelver voorzitter en de officier van justitie bij die rechtbank van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel482g
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel482g
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel37
