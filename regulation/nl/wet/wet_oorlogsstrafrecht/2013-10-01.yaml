  - number: '13'
    text: |-
      1 De bijzondere rechtbanken en het Bijzondere Hooggerechtshof worden door Ons ingesteld en samengesteld.

      2 Het rechtsgebied en de plaats van vestiging der bijzondere rechtbanken en de plaats van vestiging van het
      Bijzondere Hooggerechtshof worden door Ons bij algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel13
  - number: '14'
    text: |-
      1 Het Bijzondere Hooggerechtshof en de bijzondere rechtbanken zijn samengesteld uit een rechtsgeleerde president en
      zoveel rechtsgeleerde vice-presidenten en rechtsgeleerde en militaire leden als nodig zal blijken.

      2 Bij het Bijzondere Hooggerechtshof zijn een procureur-generaal en zoveel advocaten-generaal, bij de bijzondere
      rechtbanken een officier van justitie en zoveel substituut-officieren als nodig zullen blijken. Bij ieder college
      is een griffier en zijn zoveel substituut-griffiers als nodig zal blijken.

      3 Wij kunnen plaatsvervangende rechtsgeleerde en militaire leden benoemen.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel14
  - number: '15'
    text: |-
      1 Tot de in [artikel 14][ref1] genoemde betrekkingen met uitzondering van die van militair lid en plaatsvervangend
      militair lid zijn benoembaar:

      1°. bij het Bijzondere Hooggerechtshof zij die benoembaar zijn onderscheidenlijk tot raadsheer in, advocaat-
      generaal bij of griffier of substituut-griffier van een gerechtshof;

      2°. bij de bijzondere rechtbanken zij die benoembaar zijn onderscheidenlijk tot rechter in, officier of substituut-
      officier van justitie bij of griffier of substituut-griffier van een arrondissements-rechtbank.

      2 De met rechtspraak belaste rechtsgeleerde leden der bijzondere colleges worden door Ons benoemd voor de duur der
      instandhouding van het college en bij voorkeur uit de leden van de rechterlijke macht, met rechtspraak belast.

      3 Tot militaire leden en plaatsvervangende militaire leden zijn benoembaar:

      1°. in het Bijzondere Hooggerechtshof opper- en vlagofficieren, al dan niet in actieve dienst;

      2°. in de bijzondere rechtbanken officieren, al dan niet in actieve dienst, die ten minste de rang van
      hoofdofficier hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel14
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '14'
  - number: '16'
    text: |-
      De leden van de bijzondere colleges ontvangen een bezoldiging, die bij de bijzondere rechtbanken een derde gedeelte
      van de bezoldiging voor overeenkomstige bedieningen bij de arrondissements-rechtbanken, en bij het Bijzondere
      Hooggerechtshof een derde gedeelte van de bezoldiging voor overeenkomstige bedieningen bij de Hoge Raad der
      Nederlanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel16
  - number: '17'
    text: |-
      1 Het Bijzondere Hooggerechtshof vonnist met vijf leden, waaronder tenminste een en ten hoogste twee militaire
      leden; indien er twee militaire leden zijn, zal zoveel mogelijk een hunner tot de zeemacht en een tot de landmacht
      behoren.

      2 De bijzondere rechtbanken vonnissen met drie leden, waaronder één militair lid.
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel17
  - number: '18'
    text: |-
      1 Tegen de vonnissen der bijzondere rechtbanken staat geen hoger beroep open.

      2 Tegen deze vonnissen kan beroep in cassatie op de voet van [artikel 19][ref1] worden ingesteld bij het Bijzondere
      Hooggerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel19
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '19'
  - number: '19'
    text: |-
      Onverminderd het bepaalde in [artikel 34][ref1] vernietigt het Bijzondere Hooggerechtshof de vonnissen der
      bijzondere rechtbanken:

      1°. wegens het verzuim van vormen, voorgeschreven op straffe van nietigheid, met dien verstande, dat een zodanig
      verzuim geen grond tot vernietiging behoeft te geven, indien redelijkerwijze moet worden aangenomen, dat de
      verdachte door het verzuim in zijn belangen niet is geschaad;

      2°. wegens verkeerde toepassing of schending der wet, waarmede te dezen wordt gelijkgesteld de oplegging van
      een straf of een maatregel, welke niet geacht kan worden te beantwoorden aan de ernst van het misdrijf, de
      omstandigheden, waaronder het is begaan, of de persoon of de persoonlijke omstandigheden van de veroordeelde;

      3°. wegens overschrijding van rechtsmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel34
    url: https://wetten.overheid.nl/BWBR0002099/2013-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002099
        artikel: '34'
  - number: '20'
    text: |-
      De bepalingen van de [wet op de rechterlijke organisatie][ref1] en het beleid der justitie, met uitzondering van
      de [artikelen 8, eerste lid][ref2], [15][ref3], [17][ref4] en [18][ref5], en de ter uitvoering van die wet gegeven
      regelingen zijn met betrekking tot de bijzondere colleges van overeenkomstige toepassing, indien en voor zover van
      die bepalingen niet in deze wet wordt afgeweken, met dien verstande dat ten aanzien van de bijzondere rechtbanken
      de bepalingen met betrekking tot de arrondissements-rechtbanken en ten aanzien van het Bijzondere Hooggerechtshof
      de bepalingen betreffende de Hoge Raad van overeenkomstige toepassing zijn, behoudens dat ten aanzien van het
      Bijzondere Hooggerechtshof aanbevelingen - voor vacatures waarin na de instelling moet worden voorzien - geschieden
      op de wijze als voor de gerechtshoven voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0002099#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002099#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002099#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0002099#Artikel18
