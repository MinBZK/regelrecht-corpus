  - number: '3'
    text: |-
      Onverminderd het te dien aanzien in het [Wetboek van Strafrecht][ref1] en het
      [Wetboek van Militair Strafrecht][ref2] bepaalde is de Nederlandse strafwet toepasselijk:

      1°. op ieder, die zich buiten het rijk in Europa schuldig maakt aan een misdrijf omschreven in de
      [artikelen 4][ref3]-[7 van deze wet][ref4], indien dit feit is gepleegd tegen of met betrekking tot een Nederlander
      of een Nederlands rechtspersoon of indien enig Nederlands belang daardoor is of kon worden geschaad;

      2°. op ieder, die zich buiten het rijk in Europa schuldig maakt aan een misdrijf, omschreven in een der
      [artikelen 131 tot en met 134][ref5], [189][ref6] en [416-417][ref7], indien het strafbare feit of het misdrijf,
      waarvan in die artikelen gesproken wordt, is een misdrijf als hiervoor onder 1°. bedoeld;

      3°. op de Nederlander, die zich buiten het rijk in Europa schuldig maakt aan een misdrijf, in [artikel 1][ref8]
      bedoeld.


