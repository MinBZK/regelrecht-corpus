  - number: Ia
    text: |-
      De Wet oorlogsstrafrecht is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba,
      met dien verstande dat voor de toepassing van de [artikelen 3, onderdelen 1° tot en met 3°][ref1], en
      [12, tweede en vijfde lid][ref2], van de Wet oorlogsstrafrecht in plaats van «het rijk in Europa» telkens wordt
      gelezen: Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002099#Artikel12
