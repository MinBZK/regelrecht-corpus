  - number: '2'
    text: |-
      Voor zover in deze wet niet anders is bepaald, vinden ten aanzien van de in [artikel 1][ref1] bedoelde
      misdrijven de bepalingen van het [Wetboek van Militair Strafrecht][ref2] en die ter uitvoering daarvan alsmede,
      behoudens de uitzonderingen bij dat Wetboek vastgesteld, de bepalingen van het gemene strafrecht toepassing,
      met dien verstande, dat waar in het [Wetboek van Militair Strafrecht][ref3] of in de bepalingen ter uitvoering
      daarvan gesproken wordt van de gerechten bedoeld in de [Wet militaire strafrechtspraak][ref4], of van in
      [artikel 2 van de Wet militaire strafrechtspraak][ref5] genoemde personen, daaronder worden begrepen de bij deze
      wet aangewezen gerechten onderscheidenlijk de personen vallende onder de rechtsmacht van deze gerechten.


      [ref1]: https://wetten.overheid.nl/BWBR0002099#Artikel1
