  - number: 22a.2
    text: |-
      De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur. Daarbij
      kan worden bepaald dat de boete wordt opgelegd voor elke dag die de betrokkene in overtreding is.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22a
  - number: 22a.3
    text: |-
      Alvorens over te gaan tot oplegging van een boete stelt de Bank de betrokkene schriftelijk op de hoogte van het
      voornemen een boete op te leggen, onder vermelding van de gronden waarop dat voornemen berust.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22a
  - number: 22a.4
    text: |-
