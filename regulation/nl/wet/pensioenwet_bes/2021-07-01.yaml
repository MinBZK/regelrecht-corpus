  - number: 23a
    text: |-
      De Bank verstrekt Onze Minister desgevraagd de gegevens of inlichtingen die deze behoeft om zich over de
      uitvoering van deze wet in de praktijk of over de uitvoerbaarheid van beleidsvoornemens of voorgenomen wettelijke
      voorschriften een oordeel te vormen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel23a
  - number: '25'
    text: Bij algemene maatregel van bestuur kunnen, nadere regelen tot uitvoering van deze wet worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel25
  - number: 25a
    text: |-
      Bij regeling van Onze Minister kunnen met het oog op een goede invoering van deze wet aanvullende regels van
      overgangsrecht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel25a
  - number: '26.1'
    text: |-
      De Bank kan, rekening houdend met de specifieke situatie van het pensioenfonds en in het belang van de aanspraak-
      en pensioengerechtigden, op aanvraag van een pensioenfonds geheel of gedeeltelijk, ontheffing verlenen van het
      bij of krachtens de [artikelen 2][ref1], [3][ref2], [5][ref3], [6][ref4], [7][ref5], [10][ref6], [13][ref7],
      [14, eerste lid][ref8], onder b, [16b][ref9], [17][ref10], [19][ref11] en [25][ref12] bepaalde, indien het
      pensioenfonds aantoont dat daaraan redelijkerwijs niet kan worden voldaan en dat de doeleinden die deze artikelen
      beogen te bereiken anderszins worden bereikt.


