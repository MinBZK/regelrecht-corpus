articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanspraakgerechtigde:*
      persoon die begunstigde is voor een nog niet ingegaan pensioen;
        - *afkoop:* iedere handeling waardoor pensioenaanspraken of pensioenrechten hun pensioenbestemming verliezen;
        - *Bank:* De Nederlandsche Bank N.V.;
        - *bedrijfstakpensioenfonds:* een pensioenfonds ten behoeve van een of meer bedrijfstakken of delen van een
      bedrijfstak;
        - *bijdrage:* iedere onder de naam van bijdrage, premie, inleg, contributie, koopsom, dan wel, indien de betaling
      in termijnen is overeengekomen, aflossing, of onder welke andere naam ook, ineens of periodiek verschuldigde
      geldsom bestemd voor de verzekering van pensioen;
        - *deelnemer:* de werknemer of gewezen werknemer die op grond van een pensioenovereenkomst aanspraken verwerft
      jegens een pensioenuitvoerder;
        - *externe deskundige:* externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1];
        - *gepensioneerde:* pensioengerechtigde voor wie het ouderdomspensioen is ingegaan;
        - *gewezen deelnemer:* de werknemer of gewezen werknemer door wie op grond van een pensioenovereenkomst geen
      pensioen meer wordt verworven en die bij beëindiging van de deelneming een pensioenaanspraak heeft behouden jegens
      een pensioenuitvoerder;
        - *Hof van Justitie:* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba;
        - *ondernemingspensioenfonds:* een pensioenfonds verbonden aan een onderneming of aan een groepsmaatschappij als
      bedoeld in [Boek 2 van het Burgerlijk Wetboek BES][ref2];
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *pensioen:* ouderdoms-, invaliditeits-, weduwen-, weduwnaars- en wezenpensioen;
        - *pensioenfonds:* een rechtspersoon, waarin ten behoeve van ten minste twee deelnemers, gewezen deelnemers of hun
      nabestaanden gelden worden of werden bijeengebracht en worden beheerd ter uitvoering van een pensioenregeling;
        - *pensioengerechtigde:* persoon voor wie op grond van een pensioenovereenkomst het pensioen is ingegaan;
        - *pensioenovereenkomst:* hetgeen tussen een werkgever en een werknemer is overgekomen betreffende pensioen;
        - *pensioenuitvoerder:* een ondernemingspensioenfonds, een bedrijfstakpensioenfonds of een verzekeraar die zetel
      hebben in het openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *transitiedatum:* het tijdstip waarop
      __REF002___________________________________________________________________________________________________________
      _____ in werking treedt;
        - *uitvoeringsovereenkomst:* de overeenkomst tussen een werkgever en een pensioenuitvoerder over de uitvoering van
      een of meer pensioenovereenkomsten;
        - *werkgever:* het hoofd van een onderneming of, zo deze een rechtspersoon is, die rechtspersoon zelve;
        - *werknemer:* ieder, die in dienst van een onderneming is.


