        bwb_id: BWBR0028712
        artikel: '25'
  - number: '26.2'
    text: |-
      De Bank kan in bijzondere gevallen, rekening houdend met de specifieke situatie van het pensioenfonds en in het
      belang van de aanspraak- en pensioengerechtigden, op aanvraag van een pensioenfonds, geheel of gedeeltelijk,
      ontheffing verlenen van het bij of krachtens [artikel 16a][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16a
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16a
  - number: '26.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld waaraan de houder van een ontheffing
      dient te voldoen en met betrekking tot het verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26
  - number: 26a
    text: |-
      Onze Minister kan na overleg met de Bank vrijstelling verlenen van de in [artikel 16a][ref1] en [16b][ref2]
      genoemde termijnen van 15 jaar respectievelijk drie en een jaar, indien er sprake is van een uitzonderlijke
      economische situatie waardoor de meeste pensioenfondsen niet kunnen voldoen aan de bij of krachtens deze wet
      gestelde vereisten inzake het vereiste eigen vermogen, de toereikende technische voorzieningen en de dekking
      daarvan door waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel16b
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16a
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 16b
  - number: 26b.1
    text: |-
      Indien een pensioenuitvoerder werkzaamheden uitbesteedt aan een derde draagt hij er zorg voor dat deze derde de bij
      of krachtens deze wet gestelde regels, die van toepassing zijn op de uitbestedende pensioenuitvoerder, naleeft.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26b
  - number: 26b.2
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26b
  - number: 26b.2.a
    text: werkzaamheden worden aangewezen die niet mogen worden uitbesteed;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26b
  - number: 26b.2.b
    text: |-
      regels worden gesteld met betrekking tot de uitbesteding in verband met het toezicht op de naleving van het bij of
      krachtens deze wet bepaalde; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26b
  - number: 26b.2.c
    text: regels worden gesteld met betrekking tot de beheersing van risico’s die verband houden met de uitbesteding.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel26b
  - number: '27.1'
    text: |-
      Overtreding van het bepaalde bij de [artikelen 4, tweede lid][ref1], [18][ref2], [19][ref3],
      [20, tweede lid][ref4], en [30, tweede en derde lid][ref5], wordt gestraft met een geldboete van de eerste
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028712#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0028712#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0028712#Artikel30
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028712
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0028712
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0028712
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0028712
        artikel: '30'
  - number: '27.2'
    text: |-
      Met dezelfde straf wordt gestraft overtreding van voorschriften, krachtens deze wet bij algemene maatregel van
      bestuur vastgesteld voor zover uitdrukkelijk als strafbaar feit in de zin van deze wet aangeduid.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel27
  - number: '27.3'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel27
  - number: '28'
    text: |-
      Het is een ieder verboden, hetgeen hem in zijn ambt, betrekking of hoedanigheid ten gevolge van de uitvoering of
      toepassing dezer wet nopens aangelegenheden van pensioenuitvoerders blijkt of medegedeeld wordt, verder bekend te
      maken dan dat ambt, die betrekking of die hoedanigheid met zich brengt.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel28
  - number: '29'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel29
  - number: '30.1'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel30
  - number: '30.2'
    text: |-
      Een voor 30 maart 1985 opgericht ondernemingspensioenfonds dat geen rechtspersoonlijkheid bezit, wordt geacht
      rechtspersoon te zijn vanaf 31 maart 1985. Het bepaalde in [artikel 4, tweede lid][ref1], is van overeenkomstige
      toepassing op een voor 30 maart 1985 opgericht ondernemingspensioenfonds met dien verstande dat de verplichting,
      bedoeld in de eerste volzin, van dat artikellid, binnen een maand vanaf 31 maart 1985 wordt nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel4
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '4'
  - number: '30.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel30
  - number: '30.4'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel30
  - number: '30.5'
    text: |-
      Een ondernemingspensioenfonds is niet verplicht tot toekenning van een premievrije aanspraak op weduwenpensioen
      op grond van artikel 8 van deze wet aan de vrouw wier huwelijk met een deelnemer voor 31 maart 1985 is geëindigd.
      Een bedrijfstakpensioenfonds of een verzekeraar is niet verplicht tot toekenning van een premievrije aanspraak op
      weduwenpensioen op grond van [artikel 8][ref1] van deze wet aan de vrouw wier huwelijk met een deelnemer voor de
      transitiedatum is geëindigd. Een pensioenuitvoerder is niet verplicht tot toekenning van een premievrije aanspraak
      op weduwnaarspensioen op grond van artikel 8 van deze wet aan de man wiens huwelijk met een deelnemer voor de
      transitiedatum is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel8
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '8'
  - number: '30.6'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel30
  - number: '31.1'
    text: |-
      De vrouw met wie een gewezen deelnemer aan een pensioenregeling welke wordt uitgevoerd door een
      ondernemingspensioenfonds op 31 maart 1985 is gehuwd, verkrijgt in geval van beëindiging van het huwelijk door
      echtscheiding of ontbinding na scheiding van tafel en bed, een zodanige premievrije aanspraak op weduwenpensioen
      als de gewezen deelnemer heeft behouden bij het eindigen van zijn deelneming; iedere andere aanspraak op
      weduwenpensioen welke uit de deelneming aan de pensioenregeling zou kunnen voortvloeien, vervalt. De vrouw
      ontvangt op haar verzoek een bewijs van haar aanspraak. Het [vierde lid van artikel 8][ref1] van deze wet is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel8
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '8'
  - number: '31.2'
    text: |-
      De vrouw met wie een gepensioneerde die deelnam aan een pensioenregeling welke wordt uitgevoerd door een
      ondernemingspensioenfonds op 31 maart 1985 is gehuwd, verkrijgt in geval van beëindiging van het huwelijk door
      echtscheiding of ontbinding na scheiding van tafel en bed, een zodanige premievrije aanspraak op weduwenpensioen
      als de gepensioneerde heeft behouden bij het ingaan van het ouderdomspensioen; iedere andere aanspraak op
      weduwenpensioen welke uit de deelneming aan de pensioenregeling zou kunnen voortvloeien, vervalt. De vrouw
      ontvangt op haar verzoek een bewijs van haar aanspraak. Het [vierde lid van artikel 8][ref1] van deze wet is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel8
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '8'
  - number: '31.3'
    text: |-
      De vrouw met wie een gewezen deelnemer aan een pensioenregeling welke wordt uitgevoerd door een
      bedrijfstakpensioenfonds of verzekeraar op de transitiedatum is gehuwd, verkrijgt in geval van beëindiging van
      het huwelijk door echtscheiding of ontbinding na scheiding van tafel en bed, een zodanige premievrije aanspraak
      op weduwenpensioen als de gewezen deelnemer heeft behouden bij het eindigen van zijn deelneming; iedere andere
      aanspraak op weduwenpensioen welke uit de deelneming aan de pensioenregeling zou kunnen voortvloeien, vervalt. De
      vrouw ontvangt op haar verzoek een bewijs van haar aanspraak. Het [vierde lid van artikel 8][ref1] van deze wet is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel8
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '8'
  - number: '31.4'
    text: |-
      De vrouw met wie een gepensioneerde die deelnam aan een pensioenregeling welke wordt uitgevoerd door een
      bedrijfstakpensioenfonds of verzekeraar op de transitiedatum is gehuwd, verkrijgt in geval van beëindiging van
      het huwelijk door echtscheiding of ontbinding na scheiding van tafel en bed, een zodanige premievrije aanspraak
      op weduwenpensioen als de gepensioneerde heeft behouden bij het ingaan van het ouderdomspensioen; iedere andere
      aanspraak op weduwenpensioen welke uit de deelneming aan de pensioenregeling zou kunnen voortvloeien, vervalt. De
      vrouw ontvangt op haar verzoek een bewijs van haar aanspraak. Het [vierde lid van artikel 8][ref1] van deze wet is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel8
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '8'
  - number: '31.5'
    text: |-
      De man met wie een gewezen deelnemer aan een pensioenregeling op de transitiedatum is gehuwd verkrijgt in geval
      van beëindiging van het huwelijk door echtscheiding of ontbinding na scheiding van tafel en bed, een zodanige
      premievrije aanspraak op weduwnaarspensioen als de gewezen deelnemer heeft verkregen bij het eindigen van
      zijn deelneming; iedere andere aanspraak op weduwnaarspensioen welke uit de deelneming aan de pensioenregeling
      zou kunnen voortvloeien, vervalt. De man ontvangt op zijn verzoek een bewijs van zijn aanspraak. Het
      [vierde lid van artikel 8][ref1] van deze wet is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel8
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '8'
  - number: '32.1'
    text: |-
      In afwijking van [artikel 1a][ref1] geldt de verplichting tot onderbrenging door het sluiten van een schriftelijke
      uitvoeringsovereenkomst niet ten aanzien van pensioenaanspraken die zijn verworven voor het tijdstip van
      inwerkingtreding van artikel 1a van deze wet, dat is gelegen een jaar na de transitiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 1a
  - number: '32.2'
    text: |-
      In afwijking van [artikel 16f][ref1] is het eerste boekjaar na de transitiedatum langer dan het kalenderjaar omdat
      de periode vanaf de transitiedatum tot 1 januari mede in aanmerking wordt genomen wanneer de transitiedatum niet op
      1 januari ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16f
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16f
  - number: '32.3'
    text: |-
      Tot drie jaar na de transitiedatum luidt de tekst van [artikel 14b, eerste lid, onderdelen b en c][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel14b
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 14b
  - number: 32.3.b
    text: het creëren van eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel32
  - number: 32.3.c
    text: het putten uit het eigen vermogen ten behoeve van de toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel32
  - number: '32.4'
    text: |-
      De [artikelen 13c][ref1] en [16a][ref2] treden in werking drie jaar na de transitiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel16a
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 13c
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 16a
  - number: '33'
    text: 'Deze wet wordt aangehaald als: Pensioenwet BES.'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel33
