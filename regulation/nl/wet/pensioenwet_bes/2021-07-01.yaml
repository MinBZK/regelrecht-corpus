      [5:44][ref8], [5:45][ref9], [5:46, derde lid][ref10], [5:49][ref11], [5:50][ref12], [5:54][ref13] en
      [10:3, vierde lid, van de Algemene wet bestuursrecht][ref14] zijn van overeenkomstige toepassing, met dien
      verstande dat:


