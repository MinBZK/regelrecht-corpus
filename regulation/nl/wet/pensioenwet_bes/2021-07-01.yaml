  - number: '1.2'
    text: 'Voor de toepassing van deze wet wordt:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1
  - number: 1.2.a
    text: met een onderneming gelijkgesteld elke instelling van welke aard ook;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1
  - number: 1.2.b
    text: degene die een vrij beroep uitoefent geacht een onderneming te drijven;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1
  - number: 1.2.c
    text: met een bedrijfstak gelijkgesteld een groep van instellingen, die niet, of niet alle ondernemingen zijn.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1
  - number: '1.3'
    text: Een ondernemingspensioenfonds kan aan meer dan een onderneming verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1
  - number: '1.4'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1
  - number: '1.5'
    text: |-
      Indien de onderneming, waaraan een pensioenfonds verbonden is, ophoudt te bestaan, wordt dat fonds voor de
      toepassing van deze wet geacht zijn karakter als ondernemingspensioenfonds niet van rechtswege te verliezen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1
  - number: 1a.1
    text: |-
      De werkgever brengt een pensioenovereenkomst, uiterlijk wanneer een werknemer pensioenaanspraken verwerft, onder
      door onmiddellijk een schriftelijke uitvoeringsovereenkomst te sluiten met en in stand te houden bij:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
  - number: 1a.1.a
    text: een pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
  - number: 1a.1.b
    text: een pensioenfonds uit een ander deel van het Koninkrijk; of
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
  - number: 1a.1.c
    text: |-
      een verzekeraar met een zetel buiten de openbare lichamen, mits die verzekeraar op grond van de
      [Wet financiële markten BES][ref1] het bedrijf van levensverzekeraar of schadeverzekeraar mag uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1a.2
    text: |-
      De in het eerste lid opgenomen verplichting van de werkgever tot het sluiten en in standhouden van een
      schriftelijke uitvoeringsovereenkomst geldt niet bij uitvoering door een bedrijfstakpensioenfonds, mits de
      werkgever:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
  - number: 1a.2.a
    text: |-
      gehouden is of zich verbonden heeft door lid te zijn van een werkgeversvereniging tot naleving van de statuten en
      reglementen van dit bedrijfstakpensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
  - number: 1a.2.b
    text: |-
      ten aanzien van zijn werknemers gebonden is door de [Pensioenwet ambtenaren BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028714
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028714
  - number: 1a.3
    text: |-
      De in het eerste lid opgenomen verplichtingen van de werkgever tot onderbrenging en het sluiten en in stand houden
      van een schriftelijke uitvoeringsovereenkomst gelden niet wanneer een pensioenovereenkomst is gesloten door een
      werkgever die tevens pensioenuitvoerder is, mits de pensioenovereenkomsten van deze werknemers worden ondergebracht
      bij de werkgever in zijn hoedanigheid van pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel1a
  - number: '2.1'
    text: |-
      De werkgever die ter uitvoering van pensioenovereenkomsten een ondernemingspensioenfonds aan zijn onderneming heeft
      verbonden, is toegetreden tot een bedrijfstakpensioenfonds of een uitvoeringsovereenkomst heeft gesloten met een
      verzekeraar, is gehouden ervoor zorg te dragen dat de pensioenuitvoerder de overeengekomen bijdragen ontvangt.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de pensioenovereenkomst inhoudt dat de omvang van de werkgeversbijdrage telkens aan het einde van een
      periode wordt vastgesteld, mag een zodanige periode niet langer dan een jaar duren. Indien de dienstbetrekking van
      een werknemer tijdens een zodanige periode eindigt, is de bijdrage naar tijdsevenredigheid verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      Indien een werkgever zich bij de pensioenovereenkomst de bevoegdheid tot vermindering of beëindiging van zijn
      bijdrage aan de pensioenregeling heeft voorbehouden, is hij verplicht van dit voorbehoud schriftelijk mededeling te
      doen aan de pensioenuitvoerder. Hij kan dit voorbehoud slechts maken voor het geval van een ingrijpende wijziging
      van omstandigheden. Wanneer hij voornemens is tot uitoefening van de bevoegdheid op grond van dit voorbehoud over
      te gaan, deelt hij dit onverwijld schriftelijk mede aan de pensioenuitvoerder, alsmede aan degenen, wier pensioen
      of aanspraak op pensioen daardoor wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel2
  - number: '3.1'
    text: |-
      De werkgever komt met het aan zijn onderneming verbonden ondernemingspensioenfonds schriftelijk een regeling
      omtrent de betaling van de bijdragen overeen, die ten minste voldoet aan de voorschriften van het tweede lid.
      Een werkgever die is toegetreden tot een bedrijfstakpensioenfonds, treft eveneens een zodanige regeling met
      het bedrijfstakpensioenfonds, indien en voor zover statuten en reglementen van dit fonds niet overeenkomstige
      voorschriften omtrent de betaling van de bijdragen bevatten. Een werkgever die pensioenovereenkomsten heeft
      ondergebracht bij een verzekeraar, komt met die verzekeraar een regeling omtrent de betaling van bijdragen overeen,
      die ten minste voldoet aan de voorschriften van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      De werkgever moet binnen tien dagen na afloop van elk kalenderkwartaal zijn eigen bijdrage in de voorziening voor
      elke deelnemer berekend over dat kwartaal alsmede de bijdragen, welke hij over dat kwartaal op het loon van de
      deelnemers heeft ingehouden, voldoen aan de pensioenuitvoerder. Wordt zijn bijdrage na afloop van een langere
      termijn dan een kwartaal vastgesteld, dan moet hij binnen tien dagen na afloop van elke kwartaal het vierde
      gedeelte van zijn geschatte jaarbijdrage voldoen, met dien verstande, dat hij zijn jaarbijdrage in haar geheel
      binnen negen maanden na afloop van het kalenderjaar moet hebben betaald.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel3
  - number: '3.3'
    text: |-
      Indien een werkgever zijn verplichting tot betaling niet binnen een maand na afloop van de in het vorige lid
      genoemde termijn is nagekomen, is ieder der bestuurders van het fonds respectievelijk is de verzekeraar gehouden
      ervoor zorg te dragen, dat dit binnen 30 dagen aan de Bank schriftelijk wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel3
  - number: '4.1'
    text: Als pensioenfonds mogen slechts werkzaam zijn rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Het bestuur van een pensioenfonds is verplicht zich binnen drie maanden na oprichting van het fonds bij Onze
      Minister en de Bank aan te melden met gebruikmaking van een door die Minister vast te stellen aanmeldingsformulier.
      Binnen dezelfde termijn zendt het bestuur een afschrift van de akte van oprichting, een door het bestuur
      gewaarmerkt exemplaar van de reglementen, alsmede een door het bestuur gewaarmerkt afschrift van de overeenkomst
      waarin de regeling omtrent de betaling van de bijdragen, als bedoeld in [artikel 3, eerste lid][ref1], eerste
      volzin, is opgenomen, in aan de genoemde minister en aan de Bank. Het bestuur van het fonds zendt een afschrift
      van de akte, houdende wijziging van de statuten, een door het bestuur gewaarmerkt exemplaar van wijzigingen van de
      reglementen, en voor zover het een ondernemingspensioenfonds betreft, een door het bestuur gewaarmerkt afschrift
      van wijzigingen van de overeenkomst, waarin de regeling omtrent de betaling van de bijdragen, als bedoeld in
      artikel 3, eerste lid, eerste volzin, is opgenomen, binnen drie maanden na de totstandkoming van die wijzigingen in
      aan de genoemde minister en aan de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel3
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '3'
  - number: '4.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      In het bestuur van een ondernemingspensioenfonds moeten de vertegenwoordigers van de in het fonds deelnemende
      werknemers en/of gewezen werknemers tenminste evenveel zetels bezetten als de vertegenwoordigers van de werkgever.
      Als voorzitter treedt op een door de vertegenwoordigers van de werknemers en/of gewezen werknemers en de
      vertegenwoordigers van de werkgever aan te wijzen onafhankelijke deskundige voor een nader door hen te bepalen
      termijn.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      De besluiten van het bestuur van een ondernemingspensioenfonds worden genomen bij volstrekte meerderheid van
      stemmen. Bij staking van stemmen wordt het voorstel geacht te zijn verworpen. Ieder lid van het bestuur kan slechts
      één stem uitbrengen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5
  - number: '5.3'
    text: |-
      In het bestuur van een bedrijfstakpensioenfonds hebben de vertegenwoordigers van werkgevers- en
      werknemersverenigingen in de betrokken bedrijfstak in gelijken getale zitting.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5
  - number: 5a.1
    text: Ten minste twee natuurlijke personen bepalen het dagelijks beleid van een pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.2
    text: |-
      De personen die het beleid van een pensioenfonds bepalen of mede bepalen richten zich bij de vervulling
      van hun taak naar de belangen van de bij het pensioenfonds betrokken deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden, de pensioengerechtigden en de werkgever en zorgen ervoor dat dezen zich door hen op
      evenwichtige wijze vertegenwoordigd kunnen voelen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.3
    text: |-
      Het beleid van een pensioenfonds wordt bepaald of mede bepaald door personen die deskundig zijn in verband met de
      uitoefening van het bedrijf van het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.4
    text: |-
      Iedere bestuurder van een pensioenfonds is bevoegd een deskundige te raadplegen, of zich krachtens een
      bestuursbesluit, waarbij ten minste een vierde van de bestuurders zich daarvoor heeft uitgesproken, ter vergadering
      door een deskundige te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.5
    text: |-
      Het bestuur van een pensioenfonds draagt er zorg voor dat de betrouwbaarheid van de personen die het beleid van het
      pensioenfonds bepalen of mede bepalen buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.6
    text: |-
      Het bestuur van het pensioenfonds meldt elke wijziging in de samenstelling van de personen die het beleid van het
      pensioenfonds bepalen of mede bepalen vooraf aan de Bank.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.7
    text: 'Een wijziging als bedoeld in het zesde lid wordt niet doorgevoerd indien:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.7.a
    text: |-
      de Bank binnen zes weken na ontvangst van de melding van de wijziging aan het pensioenfonds bekend maakt dat het
      niet met de voorgenomen wijziging instemt; of
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.7.b
    text: |-
      de Bank om nadere gegevens of inlichtingen heeft verzocht en binnen zes weken na ontvangst van die gegevens of
      inlichtingen aan het pensioenfonds bekend maakt dat het niet met de voorgenomen wijziging instemt.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.8
    text: |-
      Indien zich een wijziging voordoet van de antecedenten die van invloed is op de betrouwbaarheid van de personen,
      bedoeld in het vijfde lid, stelt het pensioenfonds de Bank daarvan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.9
    text: |-
      De betrouwbaarheid van een persoon staat buiten twijfel wanneer dat eenmaal door de Bank voor de toepassing
      van deze wet is vastgesteld, zolang niet een wijziging in de relevante feiten of omstandigheden een redelijke
      aanleiding geeft tot een nieuwe beoordeling.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5a.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het derde en het vijfde
      tot en met het achtste lid.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5a
  - number: 5b.1
    text: Een pensioenfonds richt zijn organisatie zodanig in dat deze een beheerste en integere bedrijfsvoering waarborgt.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid. De regels
      hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5b.2.a
    text: het beheersen van bedrijfsprocessen en bedrijfsrisico’s;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5b.2.b
    text: integriteit;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5b.2.c
    text: 'de soliditeit van het pensioenfonds, waaronder wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5b.2.c.1°
    text: het beheersen van financiële risico’s; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5b.2.c.2°
    text: het beheersen van andere risico’s die de soliditeit van het pensioenfonds kunnen aantasten;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5b.2.d
    text: het beheersen van de financiële positie over de lange termijn door periodiek een continuïteitsanalyse te maken.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5b
  - number: 5c.1
    text: |-
      Een pensioenuitvoerder richt zijn organisatie zodanig in dat een goed bestuur is gewaarborgd waardoor er in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5c
  - number: 5c.1.a
    text: verantwoording wordt afgelegd aan de aanspraak- en pensioengerechtigden en de werkgever; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5c
  - number: 5c.1.b
    text: intern toezicht is.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5c
  - number: 5c.2
    text: Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste lid regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel5c
  - number: '6.1'
    text: 'In de statuten en reglementen van een pensioenfonds worden bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.a
    text: de bestemming van het fonds;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.b
    text: het beheer van het fonds;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.c
    text: de soorten van deelnemers;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.d
    text: de inkomsten van het fonds;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.e
    text: de belegging van de gelden;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.f
    text: de aanspraken, welke de deelneming geeft, en het systeem van financiering van deze aanspraken;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.g
    text: de wijze, waarop de bestuursleden worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.h
    text: |-
      de gevallen, waarvoor de werkgever zich de bevoegdheid tot vermindering of beëindiging van zijn bijdrage heeft
      voorbehouden;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.i
    text: |-
      de wijziging van de statuten en reglementen, met name ook wat betreft wijziging van de rechten en verplichtingen
      der deelnemers en gewezen deelnemers in gevallen, waarin de financiële toestand van het fonds daartoe aanleiding
      geeft;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: 6.1.j
    text: |-
      de liquidatie van het fonds, met name ook wat betreft de verplichtingen van de liquidateuren en de bestemming van
      de bezittingen van het fonds.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: '6.2'
    text: |-
      In de reglementen van een pensioenfonds wordt tevens de datum van hun inwerkingtreding vermeld en, in geval van
      wijziging van die reglementen, de datum van inwerkingtreding van de wijziging.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      De statuten en reglementen van een bedrijfstakpensioenfonds omvatten tevens een omschrijving van de bedrijfstak of
      de bedrijfstakken of het deel van de bedrijfstak waarvoor het fonds geldt.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel6
  - number: '7.1'
    text: |-
      Degene, die korter dan vijf jaren aan een pensioenregeling heeft deelgenomen, ontvangt bij het eindigen van
      zijn deelneming anders dan door overlijden of het bereiken van de pensioengerechtigde leeftijd een uitkering ten
      minste gelijk aan de door hem betaalde bijdragen voor ouderdomspensioen, tenzij hij volgens het pensioenreglement
      soortgelijke aanspraken kan doen gelden als in het tweede lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      Degene, die tenminste vijf jaren aan een pensioenregeling heeft deelgenomen, verkrijgt bij het eindigen van zijn
      deelneming anders dan door overlijden of het bereiken van de pensioengerechtigde leeftijd een premievrije aanspraak
      op uitkeringen op de voet van de door en voor hem betaalde en uit hoofde van [artikel 2, tweede lid][ref1], nog
      verschuldigde bijdragen voor ouderdomspensioen naarmate de voor pensioeningang vereiste duur van de deelneming is
      verstreken alsmede een naar redelijkheid vast te stellen premievrije aanspraak op weduwen- of weduwnaarspensioen,
      indien dat is toegezegd. Hem wordt door het fondsbestuur of de verzekeraar een bewijs daarvan gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel2
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '2'
  - number: '7.3'
    text: |-
      Het pensioenreglement kan ten aanzien van degene, die, voordat hij in de regeling inzake ouderdomspensioen wordt
      opgenomen, in een andere regeling van de pensioenuitvoerder deelneemt, bepalen, dat voor de toepassing van de
      vorige leden zijn deelneming aan de pensioenregeling aanvangt op het tijdstip, waarop hij in de regeling inzake
      ouderdomspensioen wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7
  - number: '7.4'
    text: |-
      Het pensioenreglement kan bepalen, dat een premievrije aanspraak als in het tweede lid bedoeld vervangen kan
      worden door de uitbetaling van een bedrag ineens, indien de aanspraak toekomt aan degene, die bij het eindigen van
      de deelneming of op een later tijdstip ten genoegen van het fondsbestuur aannemelijk maakt binnenkort te zullen
      emigreren dan wel geëmigreerd te zijn buiten het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7
  - number: '7.5'
    text: |-
      Het pensioenreglement kan, in plaats van het in het eerste lid bedoelde tijdstip, waarop de deelneming eindigt, een
      later tijdstip van uitkering noemen, doch niet later dan twee jaren na het eindigen van die deelneming, noch later
      dan de pensioengerechtigde leeftijd.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7
  - number: 7a.1
    text: |-
      Afkoop is slechts mogelijk in bij of krachtens de [artikelen 7][ref1], [7b][ref2] en [13e][ref3] bedoelde situaties
      of in geval van toepassing van [artikel 8:9, tweede of derde lid, van de Wet financiële markten BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0028712#Artikel13e
      [ref4]: https://wetten.overheid.nl/BWBR0030883#Artikel8
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 7b
      - id: ref3
        bwb_id: BWBR0028712
        artikel: 13e
      - id: ref4
        bwb_id: BWBR0030883
        artikel: '8'
  - number: 7a.2
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7a
  - number: 7b.1
    text: |-
      De pensioenuitvoerder heeft het recht om bij ingang van een pensioen, een pensioen dat minder bedraagt dan een bij
      regeling van Onze Minister vast te stellen bedrag per jaar, behoudens in bij die regeling aan te wijzen gevallen,
      af te kopen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7b
  - number: 7b.2
    text: De pensioenuitvoerder stelt de afkoopwaarde ter beschikking aan de pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7b
  - number: 7b.3
    text: |-
      Indien uit de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindexcijfers voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba blijkt, dat het prijsindexcijfer voor het derde kwartaal van het
      lopende jaar, vergeleken met het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is gestegen
      of gedaald, stelt Onze Minister bedragen vast, die met ingang van 1 januari van het komende jaar in de plaats
      treden van het bedrag, bedoeld in het eerste lid. Onze Minister bepaalt welke consumentenprijsindexcijfers voor de
      toepassing van de eerste zin worden gebruikt. De consumentenprijsindexcijfers kunnen voor de onderscheiden openbare
      lichamen en voor belanghebbenden die woonachtig zijn buiten de openbare lichamen, verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7b
  - number: 7b.4
    text: Voor de toepassing van het eerste lid wordt het weduwen-, weduwnaars- en wezenpensioen als een eenheid beschouwd.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7b
  - number: 7b.5
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de wijze waarop de afkoopwaarde wordt
      berekend.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7b
  - number: 7c.1
    text: |-
      Een pensioenuitvoerder is bevoegd om op verzoek van een gewezen deelnemer de waarde van zijn pensioenaanspraken die
      voortvloeien uit een pensioenovereenkomst over te dragen aan de pensioenuitvoerder van de nieuwe werkgever van de
      gewezen deelnemer, mits onder pensioenuitvoerder van de nieuwe werkgever wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7c
  - number: 7c.1.a
    text: een pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7c
  - number: 7c.1.b
    text: |-
      een verzekeraar die het levensverzekeringsbedrijf uitoefent en in het bezit is van een vergunning, bedoeld in de
      [Wet financiële markten BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 7c.1.c
    text: |-
      een instantie die een pensioenregeling uitvoert van een volkenrechtelijke organisatie waarin het Koninkrijk der
      Nederlanden deelneemt; of
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7c
  - number: 7c.1.d
    text: |-
      een pensioenuitvoerder die door Onze Minister gelijkgesteld is met een instelling als bedoeld in een van de
      onderdelen a, b of c.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7c
  - number: 7c.2
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de berekening van de overdrachtswaarde
      alsmede de in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7c
  - number: 7d
    text: De uitkering, het kapitaal en de premie in het kader van een pensioenovereenkomst worden vastgesteld in US dollars.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7d
  - number: 7e
    text: |-
      In de pensioenovereenkomst wordt bepaald of er toeslagen worden verleend en, zo ja, wat het ambitieniveau is en
      welke voorwaarden gelden bij de toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7e
  - number: 7f.1
    text: |-
      Bij voorwaardelijke toeslagverlening dient er een consistent geheel te zijn tussen de gewekte verwachtingen, de
      financiering en het realiseren van voorwaardelijke toeslagen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7f
  - number: 7f.2
    text: Bij regeling van Onze Minister kan invulling worden gegeven aan het begrip consistentie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel7f
  - number: '8.1'
    text: |-
      De echtgenoot wiens huwelijk met een deelnemer eindigt door echtscheiding of ontbinding na scheiding van tafel en
      bed, verkrijgt ten minste een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de deelnemer
      ten behoeve van hem zou hebben behouden, indien op het tijdstip van de echtscheiding of van de ontbinding van
      het huwelijk na scheiding van tafel en bed zijn deelneming zou zijn geëindigd anders dan door overlijden of het
      bereiken van de pensioengerechtigde leeftijd. De echtgenoot ontvangt op zijn verzoek een bewijs van zijn aanspraak.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      De echtgenoot wiens huwelijk met een gewezen deelnemer eindigt door echtscheiding of ontbinding na scheiding
      van tafel en bed, verkrijgt een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de gewezen
      deelnemer ten behoeve van hem heeft behouden bij het eindigen van zijn deelneming. De echtgenoot ontvangt op zijn
      verzoek een bewijs van zijn aanspraak.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel8
  - number: '8.3'
    text: |-
      De echtgenoot wiens huwelijk met een gepensioneerde eindigt door echtscheiding of ontbinding na scheiding van tafel
      en bed, verkrijgt een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de gepensioneerde ten
      behoeve van zijn echtgenoot heeft behouden bij het ingaan van het ouderdomspensioen. De echtgenoot ontvangt op zijn
      verzoek een bewijs van zijn aanspraak.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel8
  - number: '8.4'
    text: |-
      Het bepaalde in het eerste, het tweede en derde lid vindt geen toepassing, indien de echtgenoten bij notarieel
      verleden akte anders overeenkomen, of de rechter bij het vonnis tot echtscheiding of tot ontbinding van het
      huwelijk na scheiding van tafel en bed op hun gemeenschappelijk verzoek anders beslist. Partijen leggen daarbij aan
      de notaris onderscheidenlijk de rechter een verklaring van de pensioenuitvoerder over, waarin die verklaart dat hij
      bereid is een uit de afwijking voortvloeiend pensioenrisico te dekken.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel8
  - number: '8.5'
    text: |-
      De aanspraak op weduwen- of weduwnaarspensioen ten behoeve van de echtgenoot van een deelnemer, gewezen deelnemer
      of gepensioneerde kan zonder zijn toestemming niet bij overeenkomst tussen zijn echtgenoot en de pensioenuitvoerder
      of de werkgever worden verminderd. Elk beding, strijdig met het bepaalde in de vorige zin, is nietig.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel8
  - number: '9'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel9
  - number: '10.1'
    text: |-
      Een pensioenfonds werkt volgens een actuariële en bedrijfstechnische nota betreffende het te voeren beleid, waarbij
      de financiële opzet en de grondslagen waarop het rust gemotiveerd omschreven zijn en waaruit blijkt dat wordt
      voldaan aan hetgeen bij of krachtens deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      Het bestuur van een pensioenfonds legt de in het eerste lid bedoelde nota over aan de Bank. Het bestuur van het
      fonds legt een wijziging in de nota onverwijld over aan de Bank.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel10
  - number: '10.3'
    text: |-
      Het bestuur van een pensioenfonds legt aan de Bank eenmaal in de vijf jaren of, zo deze zulks nodig acht, binnen
      kortere termijn, een door een actuaris samengestelde wetenschappelijke balans en verlies- en winstrekening, alsmede
      een actuarieel verslag betreffende het fonds over en jaarlijks een door een externe deskundige gecontroleerd
      verslag, waarin een volledig beeld van de financiële toestand van het fonds gegeven wordt en waaruit ten genoegen
      van de Bank blijkt, dat aan het bij of krachtens deze wet bepaalde wordt voldaan en dat de belangen der bij het
      fonds betrokken deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden voldoende
      gewaarborgd geacht kunnen worden.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel10
  - number: '10.4'
    text: |-
      Het samenstellen en het overleggen van de in het vorige lid bedoelde bescheiden dient te geschieden met
      inachtneming van de ter zake door de Bank gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel10
  - number: '11'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      Tot het samenstellen van de in [artikel 10][ref1] bedoelde bescheiden, alsmede tot het verrichten van andere tot de
      normale beroepsbezigheden van actuarissen behorende werkzaamheden ten behoeve van een pensioenfonds is tegenover de
      Bank niet bevoegd, degene, tegen wiens aanwijzing of handhaving bij het fonds de Bank bezwaar heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel10
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '10'
  - number: '12.2'
    text: |-
      De Bank kan tegen de aanwijzing of handhaving van een actuaris slechts bezwaar maken, indien de betrokkene naar
      haar oordeel, niet of niet meer de nodige waarborgen biedt, dat hij de hem toevertrouwde taak naar behoren zal
      vervullen. Het bezwaar wordt schriftelijk ter kennis gebracht van het betrokken fonds en van de betrokken actuaris.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel12
  - number: '12.3'
    text: Vervallen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel12
  - number: '12.4'
    text: Vervallen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel12
  - number: '13.1'
    text: |-
      Een pensioenfonds stelt toereikende technische voorzieningen vast met betrekking tot het geheel van
      pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13
  - number: '13.2'
    text: 'De berekening wordt uitgevoerd met inachtneming van de volgende beginselen:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13
  - number: 13.2.a
    text: |-
      de voor de berekening van de technische voorzieningen gebruikte grondslagen inzake overlijden of
      arbeidsongeschiktheid en levensverwachting worden gebaseerd op prudente beginselen; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13
  - number: 13.2.b
    text: |-
      de methode en de grondslag van de berekening van de technische voorzieningen blijven van boekjaar tot boekjaar
      ongewijzigd, tenzij wijzigingen daarin gerechtvaardigd zijn als gevolg van een verandering van de juridische,
      demografische of economische omstandigheden die aan de hypothesen ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van berekening van de
      toereikende technische voorzieningen, de daarbij in acht te nemen voorzichtigheidsmarges en kunnen regels worden
      gesteld over de frequentie waarmee de technische voorzieningen worden berekend.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13
  - number: 13a
    text: Ouderdomspensioen wordt gefinancierd op basis van kapitaaldekking.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13a
  - number: 13b.1
    text: |-
      Een pensioenfonds stelt een kostendekkende premie vast die bestaat uit de premie die actuarieel benodigd is in
      verband met de aangroei van de pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13b
  - number: 13b.2
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13b
  - number: 13c.1
    text: Een pensioenfonds beschikt over een vereist eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13c
  - number: 13c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de berekening en de
      samenstelling van het vereist eigen vermogen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13c
  - number: 13d
    text: De technische voorzieningen en de aan het pensioenfonds verstrekte leningen worden volledig door waarden gedekt.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13d
  - number: 13e.1
    text: 'Een pensioenfonds kan verworven pensioenaanspraken en pensioenrechten uitsluitend verminderen indien:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13e
  - number: 13e.1.a
    text: de technische voorzieningen niet meer volledig door waarden zijn gedekt;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13e
  - number: 13e.1.b
    text: |-
      het pensioenfonds niet in staat is binnen een redelijke termijn de technische voorzieningen door waarden te dekken
      zonder dat de belangen van deelnemers, gewezen deelnemers, pensioengerechtigden, andere aanspraakgerechtigden of de
      werkgever onevenredig worden geschaad; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13e
  - number: 13e.1.c
    text: |-
      alle overige beschikbare sturingsmiddelen, met uitzondering van het beleggingsbeleid, zijn ingezet zoals uitgewerkt
      in het kortetermijnherstelplan, bedoeld in [artikel 16b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16b
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16b
  - number: 13e.2
    text: |-
      Een pensioenfonds informeert de deelnemers, gewezen deelnemers, pensioengerechtigden en de werkgever schriftelijk
      over het besluit tot vermindering van pensioenaanspraken en pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13e
  - number: 13e.3
    text: |-
      De vermindering, bedoeld in het eerste lid, kan op zijn vroegst een maand nadat de deelnemers, gewezen deelnemers,
      pensioengerechtigden, werkgever en Bank hierover geïnformeerd zijn, worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel13e
  - number: '14.1'
    text: |-
      Een pensioenfonds voert een beleggingsbeleid dat in overeenstemming is met de prudent-person regel en met name
      gebaseerd is op de volgende uitgangspunten:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14
  - number: 14.1.a
    text: de waarden worden belegd in het belang van aanspraak- en pensioengerechtigden;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14
  - number: 14.1.b
    text: |-
      beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan het pensioenfonds premies betaalt, geschieden beleggingen in deze bijdragende ondernemingen
      prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14
  - number: 14.1.c
    text: de beleggingen worden gewaardeerd op basis van marktwaardering.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter waarborging van het prudente beleggingsbeleid nadere
      regels gesteld.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14
  - number: '14.3'
    text: |-
      De eisen die zijn opgenomen in het eerste lid, aanhef en onderdeel b, en de regels die op grond van het tweede
      lid worden gesteld ten aanzien van de diversificatie van waarden zijn niet van toepassing op beleggingen in
      staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14
  - number: '14.4'
    text: |-
      Ten aanzien van enig ondernemingspensioenfonds mag van het bepaalde in het eerste lid, onder b, worden afgeweken,
      indien en voor zover de werkgever nieuwe financiële verplichtingen op zich heeft genomen, alsook indien en voor
      zover het betreft financiële verplichtingen van de werkgever, die verband houden met verhogingen van aanspraken op
      pensioen over reeds verstreken jaren; zulks onder voorwaarde, dat de aanpassing aan dat artikel wordt nagestreefd
      volgens een door de Bank goedgekeurd plan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14
  - number: 14a.1
    text: |-
      Een pensioenfonds gaat geen leningen aan, tenzij de lening tijdelijk wordt aangegaan voor
      liquiditeitsdoelstellingen en treedt niet namens derde partijen op als garant.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14a
  - number: 14a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het eerste lid met
      betrekking tot de tijdelijkheid van de lening en de liquiditeitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14a
  - number: 14b.1
    text: 'Pensioenfondsen kunnen de voorwaardelijke toeslagverlening financieren door:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14b
  - number: 14b.1.a
    text: het creëren van technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14b
  - number: 14b.1.b
    text: het creëren van eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14b
  - number: 14b.1.c
    text: het putten uit het eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14b
  - number: 14b.1.d
    text: het hanteren van een opslag op de premie; of
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14b
  - number: 14b.1.e
    text: overrendement.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14b
  - number: 14b.2
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel14b
  - number: '15'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel15
  - number: '16'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16
  - number: 16a.1
    text: |-
      Wanneer een pensioenfonds voorziet of redelijkerwijs kan voorzien dat het niet meer voldoet of zal voldoen aan
      de bij of krachtens [artikel 13c][ref1] gestelde vereisten ten aanzien van het vereist eigen vermogen, meldt het
      pensioenfonds dit onverwijld aan de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13c
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 13c
  - number: 16a.2
    text: |-
      In de in het eerste lid bedoelde situatie dient het pensioenfonds binnen drie maanden of zoveel eerder
      als de Bank bepaalt ter instemming bij de Bank een concreet en haalbaar langetermijnherstelplan in. In
      dit langetermijnherstelplan werkt het pensioenfonds uit hoe het uiterlijk binnen 15 jaar zal voldoen aan
      [artikel 13c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13c
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 13c
  - number: 16a.3
    text: Het pensioenfonds handelt onverwijld overeenkomstig het langetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
  - number: 16a.4
    text: |-
      Het pensioenfonds rapporteert gedurende de uitvoering van het langetermijnherstelplan de Bank jaarlijks of het
      herstel verloopt overeenkomstig de doelstellingen van het langetermijnherstelplan; waarbij wordt aangegeven:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
  - number: 16a.4.a
    text: welke activiteiten het pensioenfonds in het afgelopen jaar heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
  - number: 16a.4.b
    text: welke resultaten deze activiteiten tot dan toe hebben gehad; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
  - number: 16a.4.c
    text: hoe de actuele positie van het pensioenfonds is.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
  - number: 16a.5
    text: |-
      De Bank beoordeelt ten minste eenmaal per drie jaar of aanvullende maatregelen nodig zijn zodat het
      langetermijnherstelplan ook daadwerkelijk kan worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
  - number: 16a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud en opstelling van een
      langetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16a
  - number: 16b.1
    text: |-
      Wanneer een pensioenfonds voorziet of redelijkerwijs kan voorzien dat het niet meer voldoet of niet zal voldoen
      aan de bij of krachtens de [artikelen 13][ref1] en [13d][ref2] gestelde vereisten ten aanzien van de toereikende
      technische voorzieningen, meldt het pensioenfonds dit onverwijld aan de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel13d
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 13d
  - number: 16b.2
    text: |-
      In de in het eerste lid bedoelde situatie dient het pensioenfonds binnen twee maanden of zoveel eerder als
      de Bank bepaalt, een concreet en haalbaar kortetermijnherstelplan ter instemming bij de Bank in. In dit
      kortetermijnherstelplan werkt het pensioenfonds uit hoe het uiterlijk binnen drie jaar zal voldoen aan de
      [artikelen 13][ref1] en [13d][ref2] waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel13d
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 13d
  - number: 16b.2.a
    text: de kans op herstel verbetert;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
  - number: 16b.2.b
    text: de risico’s voor de aanspraak- en pensioengerechtigden niet toenemen; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
  - number: 16b.2.c
    text: de kans op toeslagverlening niet negatief wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
  - number: 16b.3
    text: |-
      In afwijking van het tweede lid geldt voor het kortetermijnherstelplan een termijn van een jaar indien niet is
      voldaan aan de voorwaarden, genoemd in het tweede lid, onder a, b en c.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
  - number: 16b.4
    text: Het pensioenfonds handelt onverwijld overeenkomstig het kortetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
  - number: 16b.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud en opstelling van een
      kortetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16b
  - number: 16c.1
    text: |-
      Wanneer gedurende de looptijd van het langetermijnherstelplan, bedoeld in [artikel 16a][ref1], ingrijpende
      wijzigingen plaatsvinden in:


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16a
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16a
  - number: 16c.1.a
    text: de samenstelling van de technische voorzieningen; of
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16c
  - number: 16c.1.b
    text: de samenstelling, de omvang en de waarde van de beleggingen;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16c
  - number: 16c.2
    text: 'De Bank geeft aan of:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16c
  - number: 16c.2.a
    text: het bestaande langetermijnherstelplan kan worden gehandhaafd;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16c
  - number: 16c.2.b
    text: |-
      het langetermijnherstelplan binnen drie maanden dan wel eerder moet worden vervangen door een nieuw
      langetermijnherstelplan, waarbij rekening gehouden wordt met de reeds verstreken looptijd van het te vervangen
      langetermijnherstelplan. Dit nieuwe langetermijnherstelplan wordt ter instemming bij de Bank ingediend; dan wel
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16c
  - number: 16c.2.c
    text: |-
      het bestaande langetermijnherstelplan kan worden ingetrokken en niet vervangen hoeft te worden door een nieuw
      langetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16c
  - number: 16d.1
    text: |-
      Bij algemene maatregel van bestuur worden, ten behoeve van de berekeningen, bedoeld bij de [artikelen 5b][ref1],
      [13][ref2], [13b][ref3] en [16a][ref4] en [16b][ref5], regels gesteld over:


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028712#Artikel13b
      [ref4]: https://wetten.overheid.nl/BWBR0028712#Artikel16a
      [ref5]: https://wetten.overheid.nl/BWBR0028712#Artikel16b
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0028712
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0028712
        artikel: 13b
      - id: ref4
        bwb_id: BWBR0028712
        artikel: 16a
      - id: ref5
        bwb_id: BWBR0028712
        artikel: 16b
  - number: 16d.1.a
    text: het minimale percentage van het gemiddelde loon- of prijsindexcijfer;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16d
  - number: 16d.1.b
    text: het maximaal te hanteren gemiddelde rendement op vastrentende waarden; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16d
  - number: 16d.1.c
    text: de maximaal te hanteren risicopremies op onder andere aandelen en onroerend goed.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16d
  - number: 16d.2
    text: |-
      De in het eerste lid bedoelde regels kunnen worden aangepast wanneer dat noodzakelijk is, rekening houdend met
      financieel-economische ontwikkelingen in het verleden en realistische inzichten ten aanzien van toekomstige
      financieel-economische verwachtingen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16d
  - number: 16e.1
    text: |-
      Het pensioenfonds stelt een actuariële en bedrijfstechnische nota vast waarin in elk geval een omschrijving is
      opgenomen van de wijze waarop uitvoering wordt gegeven aan het bij of krachtens de [artikelen 5b][ref1], [7f][ref2]
      en [13 tot en met 14a][ref3] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel7f
      [ref3]: https://wetten.overheid.nl/BWBR0028712#Artikel13
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 7f
      - id: ref3
        bwb_id: BWBR0028712
        artikel: '13'
  - number: 16e.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de actuariële en
      bedrijfstechnische nota.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16e
  - number: 16e.3
    text: |-
      Voor zover risico’s zijn overgedragen, herverzekerd of ondergebracht kan de omschrijving, bedoeld in het eerste
      lid, beperkt blijven tot een verwijzing naar hetgeen daarover in de betreffende overeenkomsten is opgenomen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16e
  - number: 16f.1
    text: Een pensioenfonds doet het boekjaar gelijk lopen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16f
  - number: 16f.2
    text: |-
      Een pensioenfonds verstrekt periodiek binnen de daartoe vastgestelde termijnen staten aan de Bank die de Bank nodig
      heeft voor de juiste uitoefening van haar taak, bedoeld in [artikel 19a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel19a
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 19a
  - number: 16f.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16f
  - number: 16f.3.a
    text: de inhoud en de modellen van de staten; en
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16f
  - number: 16f.3.b
    text: de wijze, de periodiciteit en de termijnen van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16f
  - number: 16g.1
    text: |-
      De bevoegde actuaris die het actuarieel verslag waarmerkt, is onafhankelijk van het pensioenfonds en verricht geen
      andere werkzaamheden voor het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16g
  - number: 16g.2
    text: |-
      Het is de waarmerkende actuaris niet toegestaan de werkzaamheden, bedoeld in [artikel 16e][ref1], uit te oefenen
      voor een pensioenfonds wanneer een andere actuaris of andere deskundige die behoort tot dezelfde organisatie als
      de waarmerkende actuaris, andere werkzaamheden verricht voor hetzelfde pensioenfonds, tenzij de organisatie van de
      waarmerkende actuaris een door de Bank goedgekeurde gedragscode heeft over de onafhankelijkheid van de waarmerkende
      actuaris.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16e
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16e
  - number: 16h
    text: |-
      De Bank kan een pensioenfonds de verplichting opleggen om binnen een door de Bank te stellen termijn over te gaan
      tot herverzekering bij een verzekeraar, overdracht aan een verzekeraar of onderbrenging bij een pensioenfonds
      indien dit naar het oordeel van de Bank noodzakelijk is in verband met:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16h
  - number: 16h.a
    text: de actuariële en bedrijfstechnische opzet van het pensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16h
  - number: 16h.b
    text: de deskundigheid en betrouwbaarheid van het bestuur.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel16h
  - number: '17'
    text: |-
      Het bestuur van een pensioenfonds zorgt dat de deelnemers in het bezit gesteld worden van een exemplaar van de
      geldende statuten en reglementen van het fonds. De verzekeraar zorgt dat de deelnemers in het bezit worden gesteld
      van een exemplaar van de voor hen geldende reglementen. Het bestuur van een ondernemingspensioenfonds en de
      verzekeraar zorgen ervoor dat deelnemers in het bezit worden gesteld van een afschrift van de mededeling die de
      werkgever overeenkomstig [artikel 2, derde lid][ref1], eerste volzin, aan het fonds of de verzekeraar heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel2
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '2'
  - number: '18'
    text: |-
      Ieder der bestuurders van een pensioenfonds is verplicht te zorgen, dat het bepaalde bij of krachtens deze
      wet alsmede de bepalingen van de statuten en reglementen van het fonds worden nageleefd en dat, voor zover
      [artikel 10][ref1] toepassing vindt, het beleid van dat fonds gevoerd wordt overeenkomstig de in het eerste lid van
      dat artikel bedoelde actuariële en bedrijfstechnische nota.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel10
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '10'
  - number: '19'
    text: |-
      Ieder der bestuurders en ieder lid van het personeel van een pensioenfonds of van een verzekeraar is verplicht aan
      de Bank de inlichtingen te verstrekken, welke deze verlangt.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel19
  - number: 19a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      de Bank aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel19a
  - number: 19a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel19a
  - number: 19a.3
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '20.1'
    text: |-
      De Bank is bevoegd inzage te nemen of door personen, door haar bij uitdrukkelijke en bijzondere volmacht
      aangewezen, te doen nemen van de boeken en bescheiden van een pensioenuitvoerder. Gelijke bevoegdheid heeft
      de Bank ten aanzien van de boeken en bescheiden van een werkgever, die zijn pensioenovereenkomsten bij een aan
      zijn onderneming verbonden ondernemingspensioenfonds dan wel bij een bedrijfstakpensioenfonds of een verzekeraar
      heeft ondergebracht, voor zover deze boeken en bescheiden naar het oordeel van de Bank voor de door die werkgever
      getroffen pensioenvoorziening van belang zijn.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel20
  - number: '20.2'
    text: Hij, die de boeken of bescheiden onder zich heeft, is desgevorderd verplicht deze daartoe open te leggen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      De daartoe door de Bank gemachtigde personen hebben te allen tijde toegang tot de plaatsen, waar de boeken en
      bescheiden zich bevinden of vermoed worden zich te bevinden.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      Wordt hun de toegang geweigerd, ook na vertoon van hun machtiging, dan verschaffen zij zich die desnoods met
      inroeping van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel20
  - number: '20.5'
    text: |-
      Is de plaats tevens een woning of alleen door een woning toegankelijk, dan treden zij deze tegen de wil van de
      bewoner niet binnen dan op schriftelijke last van de Minister van Justitie, welke last bij het binnentreden wordt
      vertoond.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel20
  - number: '20.6'
    text: |-
      Degene die een woning binnentreedt, legitimeert zich vooraf en doet vooraf mededeling van het doel van het
      binnentreden.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel20
  - number: '20.7'
    text: |-
      Van het binnentreden wordt door hen proces-verbaal opgemaakt, dat binnen tweemaal vier en twintig uur aan degene,
      wiens woning is binnengetreden, in afschrift wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel20
  - number: '21.1'
    text: 'De Bank kan, indien:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21
  - number: 21.1.a
    text: |-
      de statuten en reglementen van een pensioenfonds niet aan de voorschriften van deze wet beantwoorden voor zover
      niet ingevolge [artikel 26][ref1] ontheffing is verleend, in strijd zijn met andere wettelijke bepalingen,
      of in enig ander opzicht niet deugdelijk zijn om overeenkomstig deze wet te dienen tot uitvoering van de
      pensioenovereenkomsten;


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel26
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '26'
  - number: 21.1.b
    text: |-
      de gang van zaken bij een zodanig fonds haar, hetzij in zijn geheel, hetzij op bepaalde onderdelen, onbevredigend
      voorkomt, haar opmerkingen daarover ter kennis brengen van het fondsbestuur.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      De Bank kan de door Onze Minister aangewezen representatieve organisaties van werkgevers en werknemers op de
      hoogte stellen van haar opmerkingen aan het fondsbestuur. Indien het bepaalde in eerste volzin toepassing heeft
      gevonden, brengt de Bank dit ter kennis van het fondsbestuur. De in dit lid bedoelde organisaties mogen niet tot
      openbaarmaking van de opmerkingen van de Bank in de pers, of anderszins, overgaan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21
  - number: '21.3'
    text: |-
      De Bank kan, indien het fondsbestuur in gebreke blijft aan deze opmerkingen gevolg te geven, tot openbaarmaking van
      haar opmerkingen in de pers, of anderszins, op kosten van het fonds overgaan.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21
  - number: '21.4'
    text: |-
      Voordat de Bank tot openbaarmaking van haar opmerkingen overgaat, geeft zij van haar besluit daartoe bij
      aangetekend schrijven kennis aan het fondsbestuur. Van een door het fondsbestuur ingediend beroepschrift wordt een
      afschrift aan de Bank gezonden. Het beroep schorst de openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21
  - number: '21.5'
    text: Vervallen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21
  - number: 21a.1
    text: |-
      De Bank kan een pensioenuitvoerder die niet voldoet aan hetgeen bij of krachtens deze wet is bepaald, door middel
      van het geven van een aanwijzing verplichten om binnen een door de Bank gestelde redelijke termijn ten aanzien van
      in de aanwijzingsbeschikking aangegeven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21a
  - number: 21a.2
    text: |-
      De Bank kan een aanwijzing als bedoeld in het eerste lid eveneens aan een pensioenfonds geven indien zij tekenen
      ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, de liquiditeit of de bedrijfsvoering van
      het pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel21a
  - number: '22.1'
    text: 'Op verzoek van de Bank kan het Hof van Justitie over een pensioenfonds een bewindvoerder aanstellen indien:'
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: 22.1.a
    text: |-
      het beheer van het fonds blijk geeft van een zodanig wanbeleid dat de belangen van de deelnemers en andere
      gerechtigden een onmiddellijke voorziening vereisen;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: 22.1.b
    text: het bestuur van het fonds is komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      De Bank dient haar verzoekschrift tot aanstelling van een bewindvoerder in tweevoud in. De griffier doet een
      exemplaar van het verzoekschrift onverwijld aan het fonds toekomen.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: '22.3'
    text: |-
      Indien het Hof van Justitie het verzoek toewijst, bepaalt het de duur waarvoor de bewindvoerder is aangesteld. Het
      kan deze duur op verzoek van de Bank of van de bewindvoerder verlengen dan wel verkorten. Het Hof van Justitie kan
      de bewindvoerder een bezoldiging toekennen ten laste van:
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: 22.3.a
    text: het pensioenfonds of, wanneer de financiële omstandigheden van het pensioenfonds dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: 22.3.b
    text: de werkgever of, wanneer de financiële omstandigheden van de werkgever dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: 22.3.c
    text: de Bank.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: '22.4'
    text: |-
      De bewindvoerder treedt in de plaats van het bestuur of een of meer door het Hof van Justitie aangewezen leden van
      het bestuur van het fonds.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: '22.5'
    text: |-
      De voorlopige tenuitvoerlegging van de beschikking tot aanstelling van een bewindvoerder kan worden bevolen, indien
      het verzoek daartoe is gedaan op een van de gronden, genoemd in het eerste lid, onderdelen a en b, van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028712/2021-07-01#Artikel22
  - number: 22a.1
    text: |-
      Onverminderd [artikel 27][ref1] kan de Bank indien niet of niet tijdig wordt voldaan aan een uit deze wet
      voortvloeiende verplichting, een geldboete opleggen ter zake van overtreding van voorschriften gesteld
      bij of krachtens de [artikelen 1a][ref2], [5a, eerste, tweede en vijfde tot en met achtste lid][ref3],
      [5b][ref4], [7e][ref5], [13b][ref6], [13c, tweede lid][ref7], [13e][ref8], [14, eerste en tweede lid][ref9],
      [14a, eerste en tweede lid][ref10], [14b][ref11], [16a, eerste tot en met vierde lid en zesde lid][ref12],
      [16b, eerste tot en met derde lid][ref13], [16c][ref14], [16e, tweede lid][ref15],
      [16f, eerste tot en met derde lid][ref16], [21a, eerste lid][ref17] en [26b, eerste lid][ref18], van de wet en van
      [artikel 5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref19] zoals van toepassing verklaard in
      [artikel 19a][ref20] van de wet.


