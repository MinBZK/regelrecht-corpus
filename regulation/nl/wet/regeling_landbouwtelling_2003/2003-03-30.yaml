$id: regeling_landbouwtelling_2003
regulatory_layer: WET
publication_date: '2004-03-30'
valid_from: '2003-03-30'
bwb_id: BWBR0014885
url: https://wetten.overheid.nl/BWBR0014885/2003-03-30
preamble:
  text: |-
    Gelet op de artikelen 24 en 25 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *LASER:* Agentschap LASER van het Ministerie van Landbouw, Natuurbeheer en Visserij;

      b. *beschrijvingsbiljet:* in [bijlage I][ref1] opgenomen modelformulier voor de periodieke inventarisatie in de
      land- en tuinbouw;

      c. *opgaveplichtige:* persoon die, anders dan in het kader van de teelt van griendhout, riet en biezen, in de
      landbouw zijn hoofdbestaan of een gedeelte van zijn bestaan vindt, voor zover aan hem een beschrijvingsbiljet,
      bedoeld in onderdeel c, dan wel anderszins een oproep voor de landbouwtelling is uitgereikt of toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014885
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014885
  - number: '2'
    text: |-
      In het tijdvak dat loopt van 1 april 2003 tot en met 15 mei 2003 wordt een landbouwtelling gehouden als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '3'
    text: |-
      Ten behoeve van de telling, bedoeld in [artikel 2][ref1], wordt een beschrijvingsbiljet uitgereikt of verzonden
      door de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014885#Artikel2
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014885
        artikel: '2'
  - number: '4'
    text: |-
      1 De opgaveplichtige verstrekt de ten aanzien van de veestapel gevraagde gegevens naar de toestand op 1 april 2003.

      2 De opgaveplichtige verstrekt de ten aanzien van de oppervlakten gevraagde gegevens naar de toestand op 1 april
      2003. Indien een oppervlakte op 1 april 2003 nog niet is beteeld, wordt de eerstvolgende geplande teelt opgegeven.

      3 Onverminderd het eerste en tweede lid, verstrekt de opgaveplichtige de op het beschrijvingsbiljet gevraagde
      gegevens naar de toestand op de datum van verzending, tenzij op het biljet of door LASER anders is aangegeven, en
      neemt daarbij de overige op het biljet of door LASER gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel4
  - number: '5'
    text: |-
      1 De opgaveplichtige ondertekent het beschrijvingsbiljet en doet dat binnen veertien dagen na dagtekening van de
      aanbieding aan LASER toekomen.

      2 Indien het beschrijvingsbiljet aangetekend aan de opgaveplichtige is toegezonden, doet deze dat binnen vijf dagen
      ingevuld en ondertekend aan LASER toekomen.
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel5
  - number: '6'
    text: |-
      In afwijking van [artikel 5][ref1] kan de opgaveplichtige een elektronisch beschrijvingsbiljet aan LASER doen
      toekomen onder de voorwaarden van de Regeling elektronische indiening GDI 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0014885#Artikel5
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014885
        artikel: '5'
  - number: '7'
    text: |-
      1 Voor de bepaling van de bedrijfsomvang geldt dat één Nederlandse grootte-eenheid gelijk is aan 1375 eenheden
      bruto standaardsaldo.

      2 De bruto standaardsaldi respectievelijk de Nederlandse grootte-eenheid worden vastgesteld als vermeld in
      [bijlage II][ref1].

      3 Bruto-standaardsaldi worden overeenkomstig [bijlage II][ref2] omgerekend in Nederlandse grootte-eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0014885
      [ref2]: https://wetten.overheid.nl/BWBR0014885
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014885
      - id: ref2
        bwb_id: BWBR0014885
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling landbouwtelling 2003.'
    url: https://wetten.overheid.nl/BWBR0014885/2003-03-30#Artikel9
