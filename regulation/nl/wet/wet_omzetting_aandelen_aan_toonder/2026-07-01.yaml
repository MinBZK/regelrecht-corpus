preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de mogelijkheden van misbruik van aandelen aan toonder
    te beperken in Europees Nederland, Bonaire, Sint Eustatius en Saba door de identiteit van houders van aandelen aan
    toonder vast te stellen;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041991/2026-07-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel I, onderdeel B][ref1], [artikel III][ref2], en [artikel IV][ref3] die in werking treden met ingang van
      zeven jaar na het tijdstip van inwerkingtreding van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0041991#ArtikelI
