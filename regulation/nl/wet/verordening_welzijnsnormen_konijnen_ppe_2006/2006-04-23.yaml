  - number: '16.2'
    text: |-
      Aan een ontheffing kunnen voorschriften of voorwaarden worden verbonden. Een ontheffing kan onder beperkingen
      worden verleend. De ontheffing kan te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel16
  - number: '17.1'
    text: 'Deze verordening wordt aangehaald als: Verordening welzijnsnormen konijnen (PPE) 2006.'
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel17
  - number: '17.2'
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na de dag van publicatie in het Verordeningenblad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel17
