$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verordening_welzijnsnormen_konijnen_ppe_2006
regulatory_layer: WET
publication_date: '2014-12-24'
valid_from: '2006-04-23'
bwb_id: BWBR0019560
url: https://wetten.overheid.nl/BWBR0019560/2006-04-23
preamble:
  text: |-
    Gelet op de artikelen 93, eerste lid, 95, 102 en 104 van de Wet op de bedrijfsorganisatie, en de artikelen 4, 6 en
    7 van het Instellingsbesluit Productschap Pluimvee en Eieren,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:






                  a. productschap:


                  Productschap Pluimvee en Eieren;




                  b. bestuur:


                  bestuur van het productschap;




                  c. voorzitter:


                  voorzitter van het productschap;




                  d. konijnen:


                  dieren van de soort Oryctolagus cuniculus, behorende tot de orde der Lagomorpha, die worden gehouden
      voor de productie van nakomelingen bestemd voor menselijke consumptie of voor de productie van konijnenvlees
      bestemd voor menselijke consumptie;




                  e. konijnenhouder:


                  de ondernemer die konijnen houdt;




                  f. voedsters:


                  alle vrouwelijke konijnen die ten minste eenmaal zijn gedekt of geïnsemineerd waaronder niet-gespeende
      jongen;




                  g. vleeskonijnen:


                  jonge konijnen vanaf het spenen tot de leeftijd van ca. 80 dagen;




                  h. opfokkonijnen:


                  nog niet dekrijpe konijnen die worden gehouden voor de fokkerij, vanaf de leeftijd van ca. 80 dagen tot
      de eerste dekking of inseminatie;




                  i. fokrammen:


                  mannelijke konijnen die ten minste éénmaal gedekt hebben óf waar ten minste éénmaal sperma van is
      afgenomen en bestemd zijn voor het fokken van vleeskonijnen of fokmateriaal;




                  j. spenen:


                  het scheiden van de jonge konijnen van de voedster;




                  k. kooi:


                  afgesloten ruimte bestemd voor het houden van konijnen;




                  l. nestkast:


                  de ruimte, verbonden met de kooi, waar de voedster haar jongen werpt;




                  m. nestmateriaal:


                  bodemmateriaal voor de nestkast;




                  n. groep:


                  aantal konijnen dat samen in een kooi is gehuisvest;




                  o. uitvalpercentage:


                  het aantal niet-levend afgevoerde gespeende konijnen gedeeld door (het aantal aangekochte gespeende
      konijnen vermeerderd met het aantal levende gespeende konijnen) vermenigvuldigd met 100 procent.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel1
  - number: '2.1'
    text: 'De huisvesting van voedsters voldoet ten minste aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.1.a
    text: |-
      3 dagen voor de verwachte datum van werpen tot en met 18 dagen na het werpen heeft een voedster de beschikking over
      een nestkast, met een minimale oppervlakte van 700 cm2 , voorzien van nestmateriaal;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.1.b
    text: |-
      de kooi is voorzien van een horizontaal aangebracht plateau, waarvan de oppervlakte ten minste 900 cm2 bedraagt.
      De afstand van het plateau tot aan de bodem en van het plateau tot aan de bovenkant van de kooi moet minimaal 25
      cm bedragen.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.1.c
    text: |-
      per voedster is een vloeroppervlakte van ten minste 4500 cm2 beschikbaar, waarbij de oppervlakte van de vloer van
      de nestkast en van het plateau kunnen worden meegerekend;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.1.d
    text: de hoogte van de kooi is over ten minste 1/3 deel van het vloeroppervlak ten minste 60 cm;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.1.e
    text: |-
      indien een deel van de kooi een gaasbodem heeft, dient het gaas van het bovenliggende draad een diameter te hebben
      van ten minste 3,0 mm. Hierbij moet de afstand tussen het middelpunt van de bovenliggende draden minimaal 10 mm en
      maximaal 16 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: '2.2'
    text: |-
      De huisvesting van voedsters die drachtig of dekrijp zijn èn van opfokkonijnen voldoet ten minste aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.2.a
    text: per voedster of opfokkonijn is een vloeroppervlakte van ten minste 2000 cm2 beschikbaar;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.2.b
    text: de hoogte van de kooi is op elk punt binnen de kooi ten minste 40 cm;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.2.c
    text: |-
      indien een deel van de kooi een gaasbodem heeft, dient het gaas van het bovenliggende draad een diameter te hebben
      van ten minste 3,0 mm. Hierbij moet de afstand tussen het middelpunt van de bovenliggende draden minimaal 10 mm en
      maximaal 16 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: '2.4'
    text: 'De huisvesting van vleeskonijnen voldoet ten minste aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.4.a
    text: vleeskonijnen worden in groepen van ten minste 2 dieren gehouden;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.4.b
    text: |-
      indien een groep uit minder dan 5 dieren bestaat is per vleeskonijn een vloeroppervlakte van ten minste 700 cm2
      beschikbaar;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.4.c
    text: |-
      indien een groep uit 5 of meer dieren bestaat is per vleeskonijn een vloeroppervlakte van ten minste 600 cm2
      beschikbaar;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.4.d
    text: de afstand tussen de bovenkant en de onderkant van de kooi bedraagt overal ten minste 40 cm;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.4.e
    text: |-
      indien plateaus zijn aangebracht dienen deze minimaal 10 cm breed te zijn en de afstand van het plateau tot aan de
      bodem en van het plateau tot aan de bovenkant van de kooi moet minimaal 25 cm zijn. De oppervlakte van het plateau
      kan worden meegerekend in de totale vloeroppervlakte. Daarnaast dient op minimaal ¼ van de totale vloeroppervlakte
      de afstand tussen de bodem en de bovenkant van de kooi 40 cm hoog te zijn;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: 2.4.f
    text: |-
      indien de kooi een gaasbodem heeft, dient het gaas van het bovenliggende draad een diameter te hebben van ten
      minste 3,0 mm. Hierbij moet de afstand tussen het middelpunt van de bovenliggende draden minimaal 10 mm en maximaal
      16 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel2
  - number: '3.1'
    text: Konijnen krijgen dagelijks de beschikking over voldoende speelmateriaal of ruwvoer.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel3
  - number: '3.2'
    text: Het materiaal is niet schadelijk voor de gezondheid van de konijnen.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel3
  - number: '4.1'
    text: |-
      In de stal wordt een dag- en nachtritme gehanteerd dat bestaat uit minimaal 8 uur licht en minimaal 8 uur donker,
      waarvan in beide gevallen 4 uur aaneengesloten.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel4
  - number: '4.2'
    text: |-
      De lichtintensiteit in de stal bedraagt voor voedsters en fokrammen op dierhoogte minimaal 20 Lux gedurende ten
      minste 8 uur per dag.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel4
  - number: '4.3'
    text: |-
      Tussen de licht- en donkerperiode wordt voor voedsters en fokrammen een schemerperiode van minimaal een uur
      toegepast.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel4
  - number: '5.1'
    text: Konijnen hebben onbeperkt toegang tot drinkwater.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel5
  - number: '5.2'
    text: |-
      Konijnen hebben onbeperkt toegang tot voer. In geval het voer over een aantal maaltijden per dag wordt gespreid,
      dient de totale hoeveelheid minimaal de dagelijkse voederbehoefte te omvatten .
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel5
  - number: '6'
    text: De minimale leeftijd van een opfokkonijn voor de 1e dekking of inseminatie bedraagt 15 weken.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel6
  - number: '7.1'
    text: |-
      De konijnenhouder controleert ten minste twee keer per etmaal de gezondheid van de konijnen, het goed functioneren
      van voer- en watervoorzieningen en het stalklimaat.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel7
  - number: '7.2'
    text: Klinisch zieke konijnen worden afgescheiden van klinisch gezonde konijnen, tenzij een dierenarts anders beslist.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel7
  - number: '7.3'
    text: Konijnen die ondraaglijk lijden dienen te worden gedood.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel7
  - number: '7.4'
    text: Dode konijnen dienen onmiddellijk uit de stal te worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel7
  - number: '8.1'
    text: De konijnenhouder draagt er zorg voor dat het uitvalpercentage op maandbasis niet hoger is dan 10%.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel8
  - number: '8.2'
    text: Zodra het uitvalpercentage op maandbasis hoger is dan 10% raadpleegt de konijnenhouder een dierenarts.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel8
  - number: '8.3'
    text: |-
      Zodra wordt vastgesteld dat het uitvalpercentage op jaarbasis hoger is dan 10% raadpleegt de konijnenhouder een
      in konijnengezondheidszorg gespecialiseerde dierenarts om maatregelen te nemen gericht op het verlagen van het
      uitvalpercentage. Deze dierenarts is een andere dan de op grond van het tweede lid geraadpleegde dierenarts.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel8
  - number: '8.4'
    text: |-
      De door de in het derde lid bedoelde dierenarts gegeven adviezen worden schriftelijk vastgelegd en worden door de
      konijnenhouder opgevolgd.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel8
  - number: '8.5'
    text: De adviezen van de dierenarts worden gedurende twee jaar door de konijnenhouder in zijn administratie bewaard.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel8
  - number: '8.6'
    text: |-
      Alle door de dierenarts gemaakte kosten - in verband met de in de leden 2, 3 en 4 verrichte werkzaamheden - komen
      voor rekening van de konijnenhouder.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel8
  - number: '9.1'
    text: 'De konijnenhouder houdt in zijn administratie maandelijks nauwgezet de volgende gegevens bij:'
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.a
    text: het aantal levend geboren konijnen;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.b
    text: het aantal konijnen dat gespeend wordt;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.c
    text: |-
      het aantal voedsters, vleeskonijnen, fokrammen en opfokkonijnen dat van buiten het bedrijf van de konijnenhouder
      wordt aangevoerd;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.d
    text: het uitvalpercentage van voedsters en opfokkonijnen gezamenlijk en het uitvalpercentage van vleeskonijnen;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.e
    text: het aantal voedsters, vleeskonijnen, fokrammen en opfokkonijnen dat levend wordt afgevoerd;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.f
    text: de al dan niet op advies van of door een dierenarts verstrekte preventieve of curatieve medicaties of vaccinaties;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.g
    text: de uitgevoerde ingrepen;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: 9.1.h
    text: eventuele calamiteiten.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: '9.2'
    text: |-
      De konijnenhouder voert een zodanige administratie, dat de gegevens, genoemd in het eerste lid, te allen tijde op
      een eenvoudige wijze kunnen worden gekend.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel9
  - number: '10.1'
    text: |-
      De konijnenhouder laat zich jaarlijks ten minste één maal op eigen kosten controleren op de naleving van het
      bepaalde in deze verordening door een door de voorzitter erkende controle-instantie.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel10
  - number: '10.2'
    text: |-
      De konijnenhouder is er voor verantwoordelijk dat het rapport van bevindingen van de controle als bedoeld in het
      eerste lid binnen veertien dagen na de dag van de controle door het productschap is ontvangen.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel10
  - number: '10.3'
    text: |-
      Indien de voorzitter vaststelt dat de konijnenhouder de verordening niet naleeft, kan de voorzitter de
      konijnenhouder bij besluit verplichten tot een herstelcontrole door de in het eerste lid bedoelde controle-
      instantie.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel10
  - number: '11.1'
    text: |-
      De controle-instantie als bedoeld in [artikel 10, eerste lid][ref1], kan op aanvraag worden erkend door de
      voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0019560#Artikel10
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019560
        artikel: '10'
        paragraaf: '10'
  - number: '11.2'
    text: |-
      De te erkennen controle-instantie voldoet aan de criteria voor erkenning zoals deze door het bestuur bij besluit
      zijn vastgesteld. Het bestuursbesluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel11
  - number: '11.3'
    text: |-
      De erkenning kan tijdelijk en onder voorwaarden worden verleend en kan worden ingetrokken indien blijkt dat niet
      meer aan de voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel11
  - number: '12.1'
    text: |-
      Het toezicht op de naleving van de bij of krachtens deze verordening gestelde voorschriften wordt namens het
      productschap uitgeoefend door een door het bestuur bij besluit aangewezen dienst en door het bestuur aangewezen
      personen. Dit besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel12
  - number: '12.2'
    text: 'Ondernemers zijn verplicht:'
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel12
  - number: 12.2.a
    text: |-
      aan de door het bestuur aangewezen personen al die gegevens te verstrekken of te doen verstrekken, die nodig zijn
      voor de vervulling van hun taak;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel12
  - number: 12.2.b
    text: |-
      aan de door het bestuur aangewezen personen inzage te geven of te doen geven van die boeken en bescheiden, die
      nodig zijn voor de vervulling van hun taak;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel12
  - number: 12.2.c
    text: |-
      aan de door het bestuur aangewezen personen te allen tijde toegang te geven of te doen geven tot hun
      bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar dan wel voorraden (waaronder begrepen
      verpakkingsmateriaal), tot het bedrijf van de ondernemer behorende, zijn opgeslagen dan wel worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel12
  - number: 12.2.d
    text: |-
      te gedogen dat de door het bestuur aangewezen personen monsters nemen uit de voorraden van het bedrijf van de
      ondernemer (waaronder begrepen verpakkingsmateriaal), ongeacht de plaats waar of waarin zich die voorraden bevinden
      en de ondernemer zal alsdan de van hem gevorderde medewerking verlenen overeenkomstig de aanwijzingen en van de
      door het bestuur aangewezen
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel12
  - number: '12.3'
    text: |-
      De in het eerste lid bedoelde personen zijn bevoegd berechtingsrapporten ten behoeve van tuchtrechtelijke
      afhandeling op te maken.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel12
  - number: '13'
    text: |-
      Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld zoals
      voorzien in de [Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016341
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016341
  - number: '14.1'
    text: |-
      De door het productschap uit hoofde van deze verordening verkregen gegevens omtrent ondernemingen worden in handen
      gesteld van de voorzitter; zij worden, behoudens aan personeelsleden van het secretariaat van het productschap
      alsmede ten behoeve van de handhaving van het bepaalde in deze verordening, niet verder bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel14
  - number: '14.2'
    text: |-
      De door de voorzitter aangewezen rechtspersoon, dienst en personen dienen, ter bescherming van de privacy van
      de ondernemer, vertrouwelijk en op verantwoorde wijze om te gaan met de uit hoofde van het toezicht verkregen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel14
  - number: '14.3'
    text: |-
      De voorzitter kan, in afwijking van het gestelde in het eerste lid, besluiten tot bekendmaking van getotaliseerde
      gegevens omtrent groepen van ondernemingen, doch nimmer op zodanige wijze dat daaruit gegevens omtrent een bepaalde
      onderneming kunnen worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel14
  - number: '15.1'
    text: |-
      Indien een huisvestingssysteem voor konijnen op het moment van inwerkingtreding van deze verordening reeds in
      gebruik was, is [artikel 2, eerste lid, onder b, c, d en e, en het tweede respectievelijk vierde lid][ref1], op
      de betrokken konijnenhouder niet van toepassing gedurende een periode van 10 jaar na inwerkingtreding van deze
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0019560#Artikel2
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019560
        artikel: '2'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid dient de huisvesting van de konijnen vijf jaar na de datum van
      inwerkingtreding van deze verordening, te voldoen aan een aantal onderdelen van de huisvestingseisen en wel zodanig
      dat een score van minimaal 50% van het maximaal te behalen aantal punten wordt behaald volgens het puntensysteem
      zoals opgenomen in [bijlage 1][ref1] bij deze verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0019560
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019560
  - number: '15.3'
    text: |-
      [Artikel 2, derde lid][ref1] treedt in werking 5 jaar na inwerkingtreding van deze verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0019560#Artikel2
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019560
        artikel: '2'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Na een periode van vijf jaar na inwerkingtreding van deze verordening kan door de voorzitter op schriftelijk
      verzoek van de konijnenhouder ontheffing worden verleend van het bepaalde in [artikel 15, tweede lid][ref1] voor
      een periode van maximaal vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019560#Artikel15
    url: https://wetten.overheid.nl/BWBR0019560/2006-04-23#Artikel16
    references:
