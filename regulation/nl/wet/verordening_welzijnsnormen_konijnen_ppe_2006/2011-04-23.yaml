  - number: '16'
    text: |-
      1 De voorzitter kan op schriftelijk verzoek van de konijnenhouder van de in het tweede lid genoemde bepalingen
      ontheffing verlenen ingeval de konijnenhouder ten genoegen van de voorzitter aantoont:

      a. zijn onderneming noodgedwongen te beëindigen na een periode van vijf jaar na inwerkingtreding van deze
      verordening;

      b. voornemens te zijn een innovatieve ontwikkeling gericht op verbetering van het dierenwelzijn door te voeren,
      maar dat deze wordt belemmerd door één of meer bepalingen van de verordening.

      2 Een ontheffing als bedoeld in het eerste lid, onder a, kan worden verleend ten aanzien van het bepaalde in
      [artikel 15, tweede lid][ref1]. Een ontheffing als bedoeld in het eerste lid, onder b, kan worden verleend ten
      aanzien van één of meer bepalingen van de verordening.

      3 Aan een ontheffing kunnen voorschriften of voorwaarden worden verbonden. Een ontheffing kan onder beperkingen
      worden verleend. Een ontheffing kan te allen tijde worden ingetrokken. Indien een ontheffing als bedoeld in het
      eerste lid, onder a., wordt ingetrokken, is de overgangsbepaling van [artikel 15, eerste lid][ref2], niet meer
      van toepassing.

      4 Een ontheffing wordt verleend voor de duur van één jaar. Op aanvraag kan verlenging van de ontheffing worden
      verleend voor een periode van één jaar en zo vervolgens telkens voor een periode van één jaar. Een ontheffing als
      bedoeld in het eerste lid, onder a, vervalt in ieder geval op het moment van afloop van de periode, bedoeld in
      [artikel 15, eerste lid][ref3].

      5 Alvorens te beslissen tot het verlenen van een ontheffing als bedoeld in het eerste lid, onder b, wint de
      voorzitter advies in bij de Klankbordgroep Praktijkonderzoek Konijnenhouderij van het productschap.


