        artikel: '10'
        paragraaf: '10'
  - number: '12'
    text: |-
      1 Het toezicht op de naleving van de bij of krachtens deze verordening gestelde voorschriften wordt namens het
      productschap uitgeoefend door een door het bestuur bij besluit aangewezen dienst en door het bestuur aangewezen
      personen. Dit besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.

      2 Ondernemers zijn verplicht:

      a. aan de door het bestuur aangewezen personen al die gegevens te verstrekken of te doen verstrekken, die nodig
      zijn voor de vervulling van hun taak;

      b. aan de door het bestuur aangewezen personen inzage te geven of te doen geven van die boeken en bescheiden, die
      nodig zijn voor de vervulling van hun taak;

      c. aan de door het bestuur aangewezen personen te allen tijde toegang te geven of te doen geven tot
      hun bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar dan wel voorraden (waaronder begrepen
      verpakkingsmateriaal), tot het bedrijf van de ondernemer behorende, zijn opgeslagen dan wel worden vervoerd;

      d. te gedogen dat de door het bestuur aangewezen personen monsters nemen uit de voorraden van het bedrijf van de
      ondernemer (waaronder begrepen verpakkingsmateriaal), ongeacht de plaats waar of waarin zich die voorraden bevinden
      en de ondernemer zal alsdan de van hem gevorderde medewerking verlenen overeenkomstig de aanwijzingen en van de
      door het bestuur aangewezen

      3 De in het eerste lid bedoelde personen zijn bevoegd berechtingsrapporten ten behoeve van tuchtrechtelijke
      afhandeling op te maken.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel12
  - number: '13'
    text: |-
      Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld zoals
      voorzien in de [Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016341
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016341
  - number: '14'
    text: |-
      1 De door het productschap uit hoofde van deze verordening verkregen gegevens omtrent ondernemingen worden
      in handen gesteld van de voorzitter; zij worden, behoudens aan personeelsleden van het secretariaat van het
      productschap alsmede ten behoeve van de handhaving van het bepaalde in deze verordening, niet verder bekendgemaakt.

      2 De door de voorzitter aangewezen rechtspersoon, dienst en personen dienen, ter bescherming van de privacy van
      de ondernemer, vertrouwelijk en op verantwoorde wijze om te gaan met de uit hoofde van het toezicht verkregen
      gegevens.

      3 De voorzitter kan, in afwijking van het gestelde in het eerste lid, besluiten tot bekendmaking van getotaliseerde
      gegevens omtrent groepen van ondernemingen, doch nimmer op zodanige wijze dat daaruit gegevens omtrent een bepaalde
      onderneming kunnen worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel14
  - number: '15'
    text: |-
      1 Indien een huisvestingssysteem voor konijnen op het moment van inwerkingtreding van deze verordening reeds in
      gebruik was, is [artikel 2, eerste lid, onder b, c, d en e, en het tweede respectievelijk vierde lid][ref1], op
      de betrokken konijnenhouder niet van toepassing gedurende een periode van 10 jaar na inwerkingtreding van deze
      verordening.

      2 Onverminderd het bepaalde in het eerste lid dient de huisvesting van de konijnen vijf jaar na de datum van
      inwerkingtreding van deze verordening, te voldoen aan een aantal onderdelen van de huisvestingseisen en wel zodanig
      dat een score van minimaal 50% van het maximaal te behalen aantal punten wordt behaald volgens het puntensysteem
      zoals opgenomen in [bijlage 1][ref2] bij deze verordening.

      3 De punten die kunnen worden behaald of zijn behaald door te voldoen aan [artikel 2, eerste lid, onder e.][ref3],
      worden alleen toegekend dan wel behouden indien daarnaast is voldaan aan het bepaalde in artikel 2, eerste lid,
      onder f.

      4 [Artikel 2, derde lid][ref4] treedt in werking 5 jaar na inwerkingtreding van deze verordening.


