preamble:
  text: |-
    Gelet op de artikelen 93, eerste lid, 95, 102 en 104 van de Wet op de bedrijfsorganisatie, en de artikelen 4, 6 en
    7 van het Instellingsbesluit Productschap Pluimvee en Eieren,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:








                  a. productschap:


                  Productschap Pluimvee en Eieren;




                  b. bestuur:


                  bestuur van het productschap;




                  c. voorzitter:


                  voorzitter van het productschap;




                  d. konijnen:


                  dieren van de soort Oryctolagus cuniculus, behorende tot de orde der Lagomorpha, die worden gehouden
      voor de productie van nakomelingen bestemd voor menselijke consumptie of voor de productie van konijnenvlees
      bestemd voor menselijke consumptie;




                  e. konijnenhouder:


                  de ondernemer die konijnen houdt;




                  f. voedsters:


                  alle vrouwelijke konijnen die ten minste eenmaal zijn gedekt of geïnsemineerd waaronder niet-gespeende
      jongen;




                  g. vleeskonijnen:


                  jonge konijnen vanaf het spenen tot de leeftijd van ca. 80 dagen;




                  h. opfokkonijnen:


                  nog niet dekrijpe konijnen die worden gehouden voor de fokkerij, vanaf de leeftijd van ca. 80 dagen tot
      de eerste dekking of inseminatie;




                  i. fokrammen:


                  mannelijke konijnen die ten minste éénmaal gedekt hebben óf waar ten minste éénmaal sperma van is
      afgenomen en bestemd zijn voor het fokken van vleeskonijnen of fokmateriaal;




                  j. spenen:


                  het scheiden van de jonge konijnen van de voedster;




                  k. kooi:


                  afgesloten ruimte bestemd voor het houden van konijnen;




                  l. nestkast:


                  de ruimte, verbonden met de kooi, waar de voedster haar jongen werpt;




                  m. nestmateriaal:


                  bodemmateriaal voor de nestkast;




                  n. groep:


                  aantal konijnen dat samen in een kooi is gehuisvest;




                  o. uitvalpercentage:


                  het aantal niet-levend afgevoerde gespeende konijnen gedeeld door (het aantal aangekochte gespeende
      konijnen vermeerderd met het aantal levende gespeende konijnen) vermenigvuldigd met 100 procent.




                  p. leefoppervlakte:


                  de voor een konijn beschikbare oppervlakte, bestaande uit de vloeroppervlakte van de kooi plus de
      bodemoppervlakte van een eventuele nestkast plus de oppervlakte van een eventueel plateau.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel1
  - number: '2'
    text: |-
      1 De huisvesting van voedsters voldoet ten minste aan de volgende eisen:

      a. 3 dagen voor de verwachte datum van werpen tot en met 18 dagen na het werpen heeft een voedster de beschikking
      over een nestkast, met een minimale oppervlakte van 700 cm2 , voorzien van nestmateriaal;

      b. de kooi is voorzien van een horizontaal aangebracht plateau, waarvan de oppervlakte ten minste 900 cm2 bedraagt.
      De breedte van het plateau bedraagt ten minste 20 cm. Indien het plateau van draadgaas is gemaakt, is de diameter
      van de bovenliggende draad ten minste 2,45 mm. De afstand van het plateau tot aan de bodem van de kooi en van het
      plateau tot aan de bovenkant van de kooi bedraagt ten minste 25 cm.

      c. per voedster is een vloeroppervlakte van ten minste 4500 cm2 beschikbaar, waarbij de oppervlakte van de vloer
      van de nestkast en van het plateau kunnen worden meegerekend;

      d. de hoogte van de kooi is over ten minste 950 cm2 van het vloeroppervlak ten minste 60 cm. De doorgang van de
      bodem naar het plateau is ten minste 25 cm breed.

      e. indien een deel van de kooi een gaasbodem heeft, dient het gaas van het bovenliggende draad een diameter te
      hebben van ten minste 3,0 mm. Hierbij moet de afstand tussen het middelpunt van de bovenliggende draden minimaal 10
      mm en maximaal 16 mm bedragen.

      2 De huisvesting van voedsters die drachtig of dekrijp zijn èn van opfokkonijnen voldoet ten minste aan de volgende
      eisen:

      a. per voedster of opfokkonijn is een vloeroppervlakte van ten minste 2000 cm2 beschikbaar;

      b. de hoogte van de kooi is over ten minste 80% van het vloeroppervlak van de kooi ten minste 40 cm;

      c. indien een deel van de kooi een gaasbodem heeft, dient het gaas van het bovenliggende draad een diameter te
      hebben van ten minste 3,0 mm. Hierbij moet de afstand tussen het middelpunt van de bovenliggende draden minimaal 10
      mm en maximaal 16 mm bedragen.

      3 De huisvesting van fokrammen voldoet ten minste aan de volgende eisen:

      a. per fokram is een vloeroppervlakte van ten minste 4000 cm2 beschikbaar;

      b. de hoogte van de kooi is overal ten minste 60 cm;

      c. indien de kooi een gaasbodem heeft, dient het gaas van het bovenliggende draad een diameter te hebben van ten
      minste 3,0 mm. Hierbij moet de afstand tussen het middelpunt van de bovenliggende draden minimaal 10 mm en maximaal
      16 mm bedragen.

      4 De huisvesting van vleeskonijnen voldoet ten minste aan de volgende eisen:

      a. vleeskonijnen worden in groepen van ten minste 2 dieren gehouden;

      b. indien een groep uit minder dan 5 dieren bestaat is per vleeskonijn een vloeroppervlakte van ten minste 700
      cm2 beschikbaar;

      c. indien een groep uit 5 of meer dieren bestaat is per vleeskonijn een vloeroppervlakte van ten minste 600 cm2
      beschikbaar;

      d. de afstand tussen de bovenkant en de onderkant van de kooi bedraagt over ten minste 80% van het vloeroppervlak
      ten minste 40 cm;

      e. indien plateaus zijn aangebracht dienen deze minimaal 10 cm breed te zijn en de afstand van het plateau tot
      aan de bodem en van het plateau tot aan de bovenkant van de kooi moet minimaal 25 cm zijn. De oppervlakte van
      het plateau kan worden meegerekend in de totale vloeroppervlakte. Daarnaast dient op minimaal ¼ van de totale
      vloeroppervlakte de afstand tussen de bodem en de bovenkant van de kooi 40 cm hoog te zijn;

      f. indien de kooi een gaasbodem heeft, dient het gaas van het bovenliggende draad een diameter te hebben van ten
      minste 3,0 mm. Hierbij moet de afstand tussen het middelpunt van de bovenliggende draden minimaal 10 mm en maximaal
      16 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel2
  - number: '3'
    text: |-
      1 Konijnen hebben te allen tijde de beschikking over ruwvoer of knaagmateriaal dat voorziet in de knaagbehoefte

      2 Het materiaal is niet schadelijk voor de gezondheid van de konijnen.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel3
  - number: '4'
    text: |-
      1 In de stal wordt een dag- en nachtritme gehanteerd dat bestaat uit minimaal 8 uur licht en minimaal 8 uur donker,
      waarvan in beide gevallen 4 uur aaneengesloten.

      2 De lichtintensiteit in de stal bedraagt voor voedsters en fokrammen op dierhoogte minimaal 20 Lux gedurende ten
      minste 8 uur per dag.

      3 Tussen de licht- en donkerperiode wordt voor voedsters en fokrammen een schemerperiode van minimaal een uur
      toegepast.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel4
  - number: '5'
    text: |-
      1 Konijnen hebben onbeperkt toegang tot drinkwater.

      2 Konijnen hebben onbeperkt toegang tot voer. In geval het voer over een aantal maaltijden per dag wordt gespreid,
      dient de totale hoeveelheid minimaal de dagelijkse voederbehoefte te omvatten .
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel5
  - number: '6'
    text: De minimale leeftijd van een opfokkonijn voor de 1e dekking of inseminatie bedraagt 15 weken.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel6
  - number: '7'
    text: |-
      1 De konijnenhouder controleert ten minste twee keer per etmaal de gezondheid van de konijnen, het goed
      functioneren van voer- en watervoorzieningen en het stalklimaat.

      2 Klinisch zieke konijnen worden afgescheiden van klinisch gezonde konijnen, tenzij een dierenarts anders beslist.

      3 Konijnen die ondraaglijk lijden dienen te worden gedood.

      4 Dode konijnen dienen onmiddellijk uit de stal te worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel7
  - number: '8'
    text: |-
      1 De konijnenhouder draagt er zorg voor dat het uitvalpercentage op maandbasis niet hoger is dan 10%.

      2 Zodra het uitvalpercentage op maandbasis hoger is dan 10% raadpleegt de konijnenhouder een dierenarts.

      3 Zodra wordt vastgesteld dat het uitvalpercentage op jaarbasis hoger is dan 10% raadpleegt de konijnenhouder een
      in konijnengezondheidszorg gespecialiseerde dierenarts om maatregelen te nemen gericht op het verlagen van het
      uitvalpercentage. Deze dierenarts is een andere dan de op grond van het tweede lid geraadpleegde dierenarts.

      4 De door de in het derde lid bedoelde dierenarts gegeven adviezen worden schriftelijk vastgelegd en worden door de
      konijnenhouder opgevolgd.

      5 De adviezen van de dierenarts worden gedurende twee jaar door de konijnenhouder in zijn administratie bewaard.

      6 Alle door de dierenarts gemaakte kosten - in verband met de in de leden 2, 3 en 4 verrichte werkzaamheden - komen
      voor rekening van de konijnenhouder.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel8
  - number: '9'
    text: |-
      1 De konijnenhouder houdt in zijn administratie maandelijks nauwgezet de volgende gegevens bij:

      a. het aantal levend geboren konijnen;

      b. het aantal konijnen dat gespeend wordt;

      c. het aantal voedsters, vleeskonijnen, fokrammen en opfokkonijnen dat van buiten het bedrijf van de konijnenhouder
      wordt aangevoerd;

      d. het uitvalpercentage van voedsters en opfokkonijnen gezamenlijk en het uitvalpercentage van vleeskonijnen;

      e. het aantal voedsters, vleeskonijnen, fokrammen en opfokkonijnen dat levend wordt afgevoerd;

      f. de al dan niet op advies van of door een dierenarts verstrekte preventieve of curatieve medicaties of
      vaccinaties;

      g. de uitgevoerde ingrepen;

      h. eventuele calamiteiten.

      2 De konijnenhouder voert een zodanige administratie, dat de gegevens, genoemd in het eerste lid, te allen tijde op
      een eenvoudige wijze kunnen worden gekend.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel9
  - number: '10'
    text: |-
      1 De konijnenhouder laat zich jaarlijks ten minste één maal op eigen kosten controleren op de naleving van het
      bepaalde in deze verordening door een door de voorzitter erkende controle-instantie.

      2 De konijnenhouder is er voor verantwoordelijk dat het rapport van bevindingen van de controle als bedoeld in het
      eerste lid binnen veertien dagen na de dag van de controle door het productschap is ontvangen.

      3 Indien de voorzitter vaststelt dat de konijnenhouder de verordening niet naleeft, kan de voorzitter de
      konijnenhouder bij besluit verplichten tot een herstelcontrole door de in het eerste lid bedoelde controle-
      instantie.
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel10
  - number: '11'
    text: |-
      1 De controle-instantie als bedoeld in [artikel 10, eerste lid][ref1], kan op aanvraag worden erkend door de
      voorzitter.

      2 De te erkennen controle-instantie voldoet aan de criteria voor erkenning zoals deze door het bestuur bij besluit
      zijn vastgesteld. Het bestuursbesluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.

      3 Aan een erkenning kunnen nadere voorschriften of voorwaarden worden verbonden. De erkenning kan door de
      voorzitter worden ingetrokken indien is vastgesteld dat niet langer aan de criteria voor erkenning of de aan de
      erkenning verbonden nadere voorschriften of voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019560#Artikel10
    url: https://wetten.overheid.nl/BWBR0019560/2011-04-23#Artikel11
    references:
