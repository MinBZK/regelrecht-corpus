        artikel: '28'
        hoofdstuk: '6'
  - number: '32'
    text: |-
      Het is verboden op veiligheidscomponenten merktekens of opschriften aan te brengen die misleidend kunnen zijn
      ten aanzien van de betekenis of vorm van de CE-markering, of die de zichtbaarheid of de leesbaarheid van een CE-
      markering verminderen.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel32
  - number: '33'
    text: |-
      1 Het is verboden zonder kabelbaanvergunning een kabelbaaninstallatie te bouwen en in bedrijf te stellen, of te
      handelen in strijd met de voorschriften van de kabelbaanvergunning.

      2 Het is verboden een kabelbaaninstallatie in bedrijf te stellen of in bedrijf te hebben indien de
      kabelbaanvergunning is geschorst.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel33
  - number: '34'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft, ressorterende onder een ander ministerie
      dan dat van Onze Minister, wordt het desbetreffende besluit genomen in overeenstemming met de minister van dat
      andere ministerie.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel34
  - number: '35'
    text: |-
      1 Deze wet is niet van toepassing op subsystemen en veiligheidscomponenten die voor de inwerkingtreding van deze
      wet in de handel zijn gebracht.

      2 [Artikel 20, eerste lid][ref1], is niet van toepassing op het in bedrijf hebben van een kabelbaaninstallaties die
      voor de inwerkingtreding van deze wet in bedrijf is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel20
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '20'
        hoofdstuk: '5'
  - number: '36'
    text: |-
      1 Tot 4 mei 2004 zijn de [artikelen 3, eerste en tweede lid][ref1], [8][ref2], [11][ref3] en [14][ref4] niet van
      toepassing op het in de handel brengen van veiligheidscomponenten en subsystemen.

      2 Tot 4 mei 2004 zijn de [artikelen 20, eerste lid][ref5], [21, eerste en tweede lid][ref6], niet van toepassing op
      de bouw en inbedrijfstelling van kabelbaaninstallaties, met dien verstande dat voor kabelbaaninstallaties waarvoor
      voor 4 mei 2004 een bouwvergunning is verleend, maar waarvan met de bouw op de datum van inwerkingtreding nog niet
      is aangevangen, een kabelbaanvergunning is vereist.

      3 De [artikelen 31, eerste en tweede lid][ref7], en [33, eerste lid][ref8] zijn tot 4 mei 2004 niet van toepassing.


