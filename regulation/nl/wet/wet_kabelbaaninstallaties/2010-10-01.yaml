        artikel: '27'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '28'
        hoofdstuk: '6'
  - number: '30'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde in
      [artikel 20, eerste lid][ref1], en ter uitvoering van de maatregelen bedoeld in [artikel 27, eerste lid][ref2], en
      [artikel 28, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0016366#Artikel28
