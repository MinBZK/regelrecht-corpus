  - number: '2'
    text: |-
      Deze wet is niet van toepassing op:

      a. liften;

      b. traditioneel gebouwde kabeltrams;

      c. installaties die worden gebruikt voor landbouwdoeleinden;

      d. attractie- en speeltoestellen;

      e. mijnbouwinstallaties en installaties die worden aangelegd of gebruikt voor industriële doeleinden;

      f. kabelponten;

      g. tandradbanen;

      h. met kettingen voortbewogen installaties.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel2
  - number: '3'
    text: |-
      1 Veiligheidscomponenten worden slechts in de handel gebracht of in bedrijf gesteld indien zij voldoen aan de
      essentiële eisen en zijn voorzien van een CE-markering.

      2 Subsystemen worden slechts in de handel gebracht of in bedrijf gesteld indien zij voldoen aan de essentiële eisen
      en zijn voorzien van een EG-keuringscertificaat.

      3 Een kabelbaaninstallatie wordt slechts in bedrijf gesteld en gehouden indien zij voldoet aan de essentiële eisen
      en bij gebruik volgens haar bestemming geen gevaar oplevert voor de veiligheid en de gezondheid van personen en de
      veiligheid van goederen.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel3
  - number: '4'
    text: |-
      1 Veiligheidscomponenten, subsystemen en kabelbaaninstallaties die overeenstemmen met door Onze Minister aan te
      wijzen nationale normen ter omzetting van geharmoniseerde normen, als bedoeld in artikel 3, tweede lid, van de
      richtlijn, worden vermoed te voldoen aan de essentiële eisen.

      2 Bij het ontbreken van op Europees niveau geharmoniseerde normen, kan Onze Minister normen aanwijzen die van
      belang zijn voor de juiste toepassing van de essentiële eisen.

      3 De referentienummers van de normen bedoeld in het eerste lid en tweede lid, worden bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan, met inachtneming van bijlage VIII van de richtlijn, keuringsinstanties aanwijzen die belast
      zijn met:

      a. door hem aan te geven taken in het kader van de procedures van overeenstemmingsbeoordeling, zoals opgenomen in
      de bijlagen V en VII van de richtlijn;

      b. het uitvoeren van veiligheidsanalyses als omschreven in bijlage III van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel5
  - number: '6'
    text: |-
      1 Aan een aanwijzing als bedoeld in [artikel 5][ref1] kunnen beperkingen en voorschriften worden verbonden. De
      voorschriften kunnen mede betrekking hebben op de door de keuringsinstanties in rekening te brengen tarieven.

      2 Bij ministeriële regeling kunnen regels worden gesteld betreffende de criteria voor de aanwijzing van instanties
      als bedoeld in [artikel 5][ref2], de wijze van beoordeling, het op keuringsinstanties uit te oefenen toezicht en de
      door instanties verschuldigde vergoeding voor de kosten van de beoordeling en de uitoefening van het toezicht.

      3 Onze Minister trekt een aanwijzing als bedoeld in [artikel 5][ref3] in:

      a. op verzoek van de desbetreffende instantie;

      b. indien hij van oordeel is dat de desbetreffende instantie niet meer voldoet aan de criteria van bijlage VIII
      van de richtlijn of de criteria voor de beoordeling van keuringsinstanties, opgenomen in de ministeriële regeling,
      bedoeld in het tweede lid;

      c. indien de desbetreffende instantie de aan de aanwijzing verbonden voorschriften niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016366#Artikel5
