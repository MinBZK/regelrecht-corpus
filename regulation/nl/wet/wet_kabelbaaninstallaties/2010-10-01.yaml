  - number: '31'
    text: |-
      1 Het is verboden veiligheidscomponenten of subsystemen in de handel te brengen die niet voldoen aan de essentiële
      eisen en die niet zijn voorzien van een CE-markering respectievelijk van een EG-keuringscertificaat.

      2 Het is verboden op veiligheidscomponenten een CE-markering aan te brengen of subsystemen te voorzien
      van een EG-keuringscertificaat indien deze veiligheidscomponenten of subsystemen niet in overeenstemming
      zijn met de essentiële eisen, of indien voor deze veiligheidscomponenten of subsystemen geen procedure van
      overeenstemmingsbeoordeling is gevolgd.

      3 Het is verboden te handelen in strijd met een verbod of een maatregel op grond van [artikel 27, eerste lid][ref1]
      en [artikel 28, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel28
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel31
    references:
