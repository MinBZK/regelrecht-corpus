  - number: '37'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van deze wet gelden met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel37
  - number: '38'
    text: |-
      Voorzover op grond van de Overeenkomst inzake de Europese Economische Ruimte de richtlijn ook verbindend is
      voor een staat, niet zijnde een lidstaat van de Europese Unie, wordt deze staat voor de toepassing van deze wet
      gelijkgesteld met een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel38
  - number: '43'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met uitzondering van de [artikelen 40 tot en met 42][ref1], die in werking treden op een bij koninklijk
      besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel40
