        hoofdstuk: '3'
  - number: '8'
    text: |-
      1 Voordat een veiligheidscomponent of een subsysteem in de handel wordt gebracht, volgt de constructeur voor
      veiligheidscomponenten en subsystemen een procedure van overeenstemmingsbeoordeling.

      2 De constructeur kiest voor de uitvoering van een procedure van overeenstemmingsbeoordeling een keuringsinstantie
      die bevoegd is om de in het kader van die procedure aan een keuringsinstantie opgedragen taken te verrichten.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel8
  - number: '9'
    text: |-
      1 Een procedure van overeenstemmingsbeoordeling behelst voor een veiligheidscomponent een van de in bijlage V van
      de richtlijn bedoelde procedures:

      a. het in module B beschreven EG-typeonderzoek, aangevuld met de in module D beschreven procedure van
      productiekwaliteitsborging;

      b. het in module B beschreven EG-typeonderzoek, aangevuld met de in module F beschreven procedure van
      productkeuring;

      c. de in module H beschreven procedure van volledige kwaliteitsborging; of

      d. de in module G beschreven procedure van eenheidskeuring.

      2 Indien een procedure als bedoeld in het eerste lid, onderdeel a of b, wordt gevolgd, kan voor de aanvullende
      procedure een andere keuringsinstantie worden gekozen dan voor het EG-typeonderzoek.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel9
  - number: '10'
    text: |-
      1 De constructeur stelt voor een veiligheidscomponent ten aanzien waarvan op basis van een procedure van
      overeenstemmingsbeoordeling is vastgesteld dat deze voldoet aan de essentiële eisen, in de laatste fase van het
      productieproces een EG-verklaring van overeenstemming op, overeenkomstig bijlage IV van de richtlijn en voorziet de
      veiligheidscomponent van een CE-markering.

      2 De CE-markering wordt zodanig op de veiligheidscomponent of een daaraan bevestigd plaatje aangebracht, dat het
      zichtbaar en leesbaar is.

      3 Indien de procedure bedoeld in [artikel 9, eerste lid, onderdeel a of onderdeel c][ref1], is gevolgd, brengt de
      constructeur naast de CE-markering het identificatienummer van de keuringsinstantie aan die de procedure uitvoert.
      Het tweede lid is van overeenkomstige toepassing op het aanbrengen van het identificatienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel9
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '11'
    text: |-
      1 Een procedure van overeenstemmingsbeoordeling behelst voor een subsysteem de in bijlage VII van de richtlijn
      bedoelde EG-keuring in de ontwerpfase, de productiefase en bij de aflevering.

      2 De constructeur stelt voor een subsysteem ten aanzien waarvan op basis van procedure van
      overeenstemmingsbeoordeling is vastgesteld dat het voldoet aan de essentiële eisen, een EG-verklaring van
      overeenstemming op overeenkomstig bijlage VI van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel11
  - number: '12'
    text: |-
      De constructeur verleent de keuringsinstantie en de door deze ingevolge [artikel 15, tweede lid][ref1], aangewezen
      natuurlijke personen of rechtspersonen, alle medewerking voorzover dat noodzakelijk is ten behoeve van de procedure
      van overeenstemmingsbeoordeling en de uitoefening van andere in deze wet bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel15
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '13'
    text: |-
      1 De constructeur informeert de keuringsinstantie die de procedure van overeenstemmingsbeoordeling uitvoert
      of heeft uitgevoerd, over alle wijzigingen die zich voordoen ten aanzien van het ontwerp, het toegepaste
      kwaliteitssysteem als bedoeld in module B of H van bijlage V, of het productieproces van de desbetreffende
      veiligheidscomponent of het desbetreffende subsysteem.

      2 De constructeur bewaart alle op grond van bijlage V en VII van de richtlijn in het kader van een procedure
      van overeenstemmingsbeoordeling aan de keuringsinstantie te verstrekken en van de keuringsinstantie ontvangen
      documentatie gedurende een periode van 30 jaar na de productie van de laatste veiligheidscomponent of het laatste
      subsysteem.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel13
  - number: '14'
    text: |-
      1 Voorzover de constructeur niet aan een verplichting, bedoeld in deze paragraaf, heeft voldaan, rust een
      dergelijke verplichting op de natuurlijke persoon of rechtspersoon die het product in de handel brengt. Zodra
      de persoon die het product in de handel brengt aan deze verplichting heeft voldaan, is de verplichting voor de
      constructeur opgeheven.

      2 De verplichtingen, bedoeld in deze paragraaf, gelden eveneens voor degene die veiligheidscomponenten of
      subsystemen vervaardigt voor eigen gebruik.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel14
  - number: '15'
    text: |-
      1 Een keuringsinstantie neemt bij de uitvoering van de taken waarmee zij in het kader van de procedures van
      overeenstemmingsbeoordeling is belast, de in bijlage V en VII van de richtlijn opgenomen regels in acht.

      2 Een keuringsinstantie is bevoegd om met inachtneming van bij ministeriële regeling gegeven voorschriften, de
      in module B van bijlage V van de richtlijn bedoelde beproevingen en controles te doen verrichten door andere
      natuurlijke personen of rechtspersonen.

      3 Indien een keuringsinstantie de in module D of H van bijlage V van de richtlijn bedoelde procedure uitvoert, is
      daarbij tenminste een persoon betrokken met ervaring in beoordeling van de toegepaste technologie.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel15
  - number: '16'
    text: |-
      1 Een keuringsinstantie draagt zorg voor het aanbrengen van haar identificatienummer op elke veiligheidscomponent
      waarvan zij op basis van de procedure bedoeld in [artikel 9, eerste lid, onderdeel b of d][ref1], heeft vastgesteld
      dat de veiligheidscomponent voldoet aan de essentiële eisen.

      2 Een keuringsinstantie stelt ten aanzien van de in het kader van de procedure bedoeld in
      [artikel 9, eerste lid, onderdeel b of d][ref2], verrichte proeven een schriftelijke verklaring van overeenstemming
      op.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel9
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '17'
    text: |-
      1 Een keuringsinstantie stelt voor een subsysteem waarvan zij op basis van de procedure bedoeld in
      [artikel 11, eerste lid][ref1], heeft vastgesteld dat het voldoet aan de essentiële eisen, een EG-verklaring van
      overeenstemming, overeenkomstig bijlage VI en een EG-keuringscerficaat overeenkomstig bijlage VII van de richtlijn
      op, en bepaalt daarbij welke technische documentatie bij het EG-keuringscertificaat wordt gevoegd.

      2 De technische documentatie bedoeld in het eerste lid, omvat in ieder geval:

      a. noodzakelijke documenten met betrekking tot de kenmerken van het desbetreffende subsysteem;

      b. de gebruiksvoorwaarden, de gebruiksbeperkingen en de onderhoudsvoorschriften, en

      c. de EG-verklaringen van overeenstemming van in het desbetreffende subsysteem toegepaste veiligheidscomponenten.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel11
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18'
    text: |-
      1 De keuringsinstantie stelt de andere keuringsinstanties op de hoogte van afgifte, intrekking, weigering of
      aanvulling van verklaringen van EG-typeonderzoek, kwaliteitssysteemgoedkeuringen, certificaten van EG-ontwerp
      onderzoek, EG-keuringscertificaten en van ontvangen aanvragen voor het verrichten van een keuring.

      2 Een keuringsinstantie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel18
  - number: '19'
    text: |-
      1 Indien de keuringsinstantie die een verklaring van EG-typeonderzoek of een EG-keuringscertificaat heeft
      afgegeven, vermoedt dat de desbetreffende veiligheidscomponent of het desbetreffende subsysteem niet meer voldoet
      aan de essentiële eisen, stelt zij daarnaar een onderzoek in.

      2 Een verklaring van EG-typeonderzoek of een EG-keuringscertificaat wordt door de keuringsinstantie ingetrokken,
      indien het in het eerste lid bedoelde onderzoek uitwijst dat de desbetreffende veiligheidscomponent of het
      desbetreffende subsysteem niet meer aan de essentiële eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel19
  - number: '20'
    text: |-
      1 Voor het bouwen en in bedrijf stellen en hebben van een kabelbaaninstallatie is een kabelbaanvergunning
      van Onze Minister vereist. Een voor een kabelbaaninstallatie verleende vergunning geldt voor eenieder die de
      kabelbaaninstallatie bouwt of in bedrijf stelt en houdt. De vergunninghouder draagt ervoor zorg dat de aan de
      vergunning verbonden voorschriften worden nageleefd.

      2 Aan een kabelbaanvergunning kunnen voorschriften en beperkingen worden verbonden. Een kabelbaanvergunning kan
      worden verleend voor een in de vergunning bepaalde tijd.

      3 Indien Onze Minister van oordeel is dat de in de kabelbaaninstallatie toe te passen veiligheidscomponenten
      of subsystemen ten aanzien van ontwerp of constructie innoverende kenmerken vertonen, kan hij aan de vergunning
      bijzondere voorschriften en beperkingen verbinden. Hij stelt de Commissie van de Europese Gemeenschappen hiervan
      onverwijld in kennis.

      4 De beperkingen waaronder een kabelbaanvergunning is verleend en de aan een vergunning verbonden voorschriften
      kunnen ambtshalve of op aanvraag worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel20
  - number: '21'
    text: |-
      1 De opdrachtgever laat voorafgaand aan de aanvraag voor een omgevingsvergunning voor een bouwactiviteit als
      bedoeld in [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] en voor een
      kabelbaanvergunning, door een daartoe bevoegde keuringsinstantie een veiligheidsanalyse uitvoeren als omschreven in
      bijlage III van de richtlijn.

      2 Bij de veiligheidsanalyse worden alle veiligheidsaspecten van de kabelbaaninstallatie en de omgeving van de
      kabelbaaninstallatie in het kader van ontwerp, uitvoering en inbedrijfstelling, betrokken.

      3 De keuringsinstantie stelt aan de hand van de veiligheidsanalyse een veiligheidsrapport op, waarin wordt
      aangegeven welke maatregelen nodig zijn om risico's uit te sluiten. Het veiligheidsrapport bevat een lijst van de
      in de desbetreffende kabelbaaninstallatie opgenomen veiligheidscomponenten en subsystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
  - number: '22'
    text: |-
      1 Een aanvraag voor een kabelbaanvergunning wordt gelijktijdig ingediend met de aanvraag voor een
      omgevingsvergunning als bedoeld in [artikel 21, eerste lid][ref1] voor de desbetreffende installatie. Onze Minister
      bevordert een gecoördineerde voorbereiding en inhoudelijke afstemming van beide vergunningen. Burgemeester en
      wethouders van de betrokken gemeente verlenen de daarvoor benodigde medewerking.

      2 Bij de aanvraag voor een kabelbaanvergunning worden overgelegd:

      a. de voor de kabelbaaninstallatie opgestelde veiligheidsanalyse bedoeld in [artikel 21][ref2] en het op basis
      daarvan opgestelde veiligheidsrapport;

      b. de EG-verklaringen van overeenstemming en de EG-keuringscertificaten van alle in de kabelbaaninstallatie toe te
      passen veiligheidscomponenten en subsystemen;

      c. een kopie van de aanvraag voor een bouwvergunning.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanvraag van een
      kabelbaanvergunning en de daarbij in te dienen gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel21
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '21'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '21'
        hoofdstuk: '5'
  - number: '23'
    text: |-
      1 Een kabelbaanvergunning wordt slechts verleend indien de kabelbaaninstallatie, mits naar behoren geïnstalleerd
      en onderhouden, en in overeenstemming met haar bestemming gebruikt, de veiligheid en gezondheid van personen en de
      veiligheid van goederen niet in gevaar kan brengen.

      2 Een kabelbaanvergunning wordt in ieder geval geweigerd indien:

      a. de kabelbaaninstallatie niet voldoet aan de essentiële eisen;

      b. de kabelbaaninstallatie niet voldoet aan de voorwaarden van het veiligheidsrapport;

      c. de in de kabelbaaninstallatie toe te passen veiligheidscomponenten niet zijn voorzien van een CE-markering of de
      toe te passen subsystemen niet zijn voorzien van een EG-keuringscertificaat.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel23
  - number: '24'
    text: |-
      1 De kabelbaanvergunning kan worden geschorst of ingetrokken indien:

      a. de voorschriften van de kabelbaanvergunning niet worden nageleefd;

      b. de kabelbaaninstallatie gevaar oplevert voor de veiligheid en de gezondheid van personen en de veiligheid van
      goederen;

      c. de kabelbaaninstallatie permanent buiten gebruik is gesteld.

      2 De schorsing wordt opgeheven indien de redenen tot schorsing niet meer bestaan.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel24
  - number: '25'
    text: |-
      De vergunninghouder bewaart de volgende documenten en bewaart kopieën van deze documenten bij de
      kabelbaaninstallatie:

      a. de kabelbaanvergunning;

      b. het veiligheidsrapport bedoeld in [artikel 21][ref1];

      c. de veiligheidsanalyse bedoeld in [artikel 21][ref2];

      d. de EG-keuringscertificaten van de toegepaste subsystemen en technische documentatie inclusief alle documenten
      met betrekking tot de kenmerken van de kabelbaaninstallatie;

      e. de EG-verklaringen van overeenstemming van de toegepaste veiligheidscomponenten;

      f. de documenten met betrekking tot onderhoud, toezicht, afstelling en instandhouding van de kabelbaaninstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel21
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '21'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '21'
        hoofdstuk: '5'
  - number: '26'
    text: |-
      1 De kosten die samenhangen met de behandeling van de aanvraag en de afgifte, wijziging of schorsing van een
      kabelbaanvergunning, alsmede met de afgifte van duplicaten en gewaarmerkte afschriften van een kabelbaanvergunning,
      worden ten laste gebracht van de aanvrager van de kabelbaanvergunning.

      2 De tarieven ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel26
  - number: '27'
    text: |-
      1 Indien Onze Minister van oordeel is dat een veiligheidscomponent die is voorzien van een CE-markering, of een
      subsysteem dat is voorzien van een EG-verklaring van overeenstemming, ook wanneer die veiligheidscomponent of
      dat subsysteem in overeenstemming met zijn bestemming wordt gebruikt en op de juiste wijze wordt onderhouden,
      de veiligheid of gezondheid van personen of de veiligheid van goederen in gevaar kan brengen, neemt hij passende
      voorlopige maatregelen. Hij kan het gebruik verbieden, aan het gebruik beperkingen stellen, verbieden dat het in de
      handel wordt gebracht of voorwaarden verbinden aan het in de handel brengen.

      2 Onze Minister stelt de Commissie van de Europese Gemeenschappen onmiddellijk en onder opgaaf van redenen in
      kennis van maatregelen als bedoeld in het eerste lid. Daarbij vermeldt hij of de maatregelen voortvloeien uit het
      niet beantwoorden aan de essentiële eisen of een verkeerde toepassing van of een leemte in de normen bedoeld in
      [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel4
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '4'
        hoofdstuk: '2'
  - number: '28'
    text: |-
      1 Indien Onze Minister van oordeel is dat op een veiligheidscomponent ten onrechte een CE-markering is aangebracht,
      of een subsysteem ten onrechte is voorzien van een EG-verklaring van overeenstemming, neemt hij passende
      maatregelen om deze veiligheidscomponent uit de handel te nemen, of verbiedt hij dat deze veiligheidscomponent of
      dit subsysteem in de handel wordt gebracht. Hij kan het gebruik verbieden of daaraan beperkingen stellen.

      2 Onze Minister stelt andere lidstaten van de Europese Unie en de Commissie van de Europese Gemeenschappen in
      kennis van maatregelen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel28
  - number: '29'
    text: |-
      De constructeur of degene die verantwoordelijk is voor het in de handel brengen, verleent alle medewerking die
      noodzakelijk is voor de uitvoering van maatregelen als bedoeld in de [artikelen 27][ref1] en [28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel28
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel29
    references:
