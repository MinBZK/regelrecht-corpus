preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 2000/9/EG van het Europees Parlement
    en de Raad van de Europese Unie van 20 maart 2000 betreffende kabelbaaninstallaties voor personenvervoer (PbEG
    L 106), noodzakelijk is regels te stellen met betrekking tot de productie, de keuring en de exploitatie van
    kabelbaaninstallaties voor personenvervoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. richtlijn: [richtlijn nr. 2000/9/EG](32000L0009) van het Europees Parlement en de Raad van de Europese Unie van
      20 maart 2000 betreffende kabelbaaninstallaties voor personenvervoer (PbEG L106);

      b. kabelbaaninstallatie: installatie als bedoeld in artikel 1, tweede, derde en vijfde lid, eerste streepje, van
      de richtlijn;

      c. veiligheidscomponent: veiligheidscomponent als bedoeld in artikel 1, vijfde lid, tweede streepje, van de
      richtlijn;

      d. subsysteem: onderdeel van een kabelbaaninstallatie als bedoeld in bijlage I van de richtlijn;

      e. opdrachtgever: natuurlijke persoon of rechtspersoon voor wiens rekening een kabelbaaninstallatie wordt gebouwd,
      of diens gemachtigde;

      f. constructeur: fabrikant van een veiligheidscomponent of een subsysteem, of ontwerper of bouwer van een
      kabelbaaninstallatie, of diens in de Gemeenschap gevestigde gemachtigde;

      g. essentiële eisen: essentiële eisen bedoeld in bijlage II van de richtlijn;

      h. CE-markering: symbool weergegeven in bijlage IX van de richtlijn;

      i. overeenstemmingsbeoordeling: onderzoek naar het voldoen aan de essentiële eisen van veiligheidscomponenten of
      subsystemen;

      j. kabelbaanvergunning: vergunning als bedoeld in [artikel 20, eerste lid][ref1];

      k. keuringsinstantie: ingevolge [artikel 5][ref2] aangewezen instantie;

      l. Onze Minister: Onze Minister van Verkeer en Waterstaat.

      2 In [hoofdstuk 4, paragraaf 1][ref3], en [hoofdstuk 5][ref4], wordt onder keuringsinstantie mede verstaan een
      door een andere lidstaat van de Europese Unie bij de Commissie van de Europese Gemeenschappen aangemelde instantie,
      belast met de in het kader van de procedure van overeenstemmingsbeoordeling in bijlage V en VII van de richtlijn
      uit te voeren taken, dan wel het uitvoeren van een veiligheidsanalyse op grond van bijlage III van de richtlijn.

      3 In deze wet wordt onder het bouwen van een kabelbaaninstallatie mede verstaan het vernieuwen, veranderen of
      vergroten van een kabelbaaninstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016366#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0016366#Hoofdstuk5
