  - number: '7'
    text: |-
      Onze Minister stelt onverwijld de Commissie van de Europese Gemeenschappen en de andere lidstaten van de Europese
      Unie in kennis van een aanwijzing of een intrekking daarvan ingevolge [artikel 5][ref1] onderscheidenlijk
      [artikel 6, derde lid][ref2], en vermeldt in geval van een aanwijzing de aan de aangewezen instantie toegekende
      taken.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel6
    url: https://wetten.overheid.nl/BWBR0016366/2010-10-01#Artikel7
