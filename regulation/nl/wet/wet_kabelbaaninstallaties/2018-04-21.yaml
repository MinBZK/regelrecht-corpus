---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_kabelbaaninstallaties
regulatory_layer: WET
publication_date: '2005-01-25'
valid_from: '2018-04-21'
bwb_id: BWBR0016366
url: https://wetten.overheid.nl/BWBR0016366/2018-04-21
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 2000/9/EG van het Europees Parlement
    en de Raad van de Europese Unie van 20 maart 2000 betreffende kabelbaaninstallaties voor personenvervoer (PbEG
    L 106), noodzakelijk is regels te stellen met betrekking tot de productie, de keuring en de exploitatie van
    kabelbaaninstallaties voor personenvervoer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *CE-markering:* CE-markering als bedoeld in
      artikel 3, onderdeel 27, van de verordening;
        - *conformiteitsbeoordelingsinstantie:* ingevolge [artikel 5][ref1] aangewezen instantie;
        - *essentiële eisen:* essentiële eisen, genoemd in bijlage II bij de verordening;
        - *EU-conformiteitsverklaring:* EU-conformiteitsverklaring als bedoeld in artikel 19 van de verordening;
        - *kabelbaaninstallatie:* kabelbaaninstallatie als bedoeld in artikel 3, onderdeel 1, van de verordening;
        - *kabelbaanvergunning:* vergunning als bedoeld in [artikel 20, eerste lid][ref2];
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *subsysteem:* subsysteem als bedoeld in artikel 3, onderdeel 2, van de verordening;
        - *veiligheidscomponent:* veiligheidscomponent als bedoeld in artikel 3, onderdeel 4, van de verordening;
        - *verordening:* Verordening (EU) nr. 2016/424 van het Europees Parlement en de Raad van 9 maart 2016 betreffende
      kabelbaaninstallaties en tot intrekking van [Richtlijn 2000/9/EG](32000L0009) (PbEU 2016, L 81).


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel20
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '20'
        hoofdstuk: '5'
  - number: '1.2'
    text: |-
      In deze wet wordt onder bouwen van een kabelbaaninstallatie mede verstaan: vernieuwen, veranderen of
      vergroten van een kabelbaaninstallatie waarvoor een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref1] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '2'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: 2.a
    text: |-
      liften die vallen onder [Richtlijn 2014/33](32014L0033)/EU van het Europees Parlement en de Raad van 26 februari
      2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake liften en veiligheidscomponenten voor
      liften (PbEU 2014, L 96);
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: 2.b
    text: |-
      kabelbaaninstallaties die van historisch of cultureel belang zijn of als cultureel erfgoed zijn aangemerkt,
      die vóór 1 januari 1986 in bedrijf zijn gesteld en vandaag nog worden geëxploiteerd, en die geen ingrijpende
      wijzigingen wat betreft ontwerp of bouw hebben ondergaan, met inbegrip van specifiek daarvoor ontworpen subsystemen
      en veiligheidscomponenten;
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: 2.c
    text: installaties die worden gebruikt voor land- en bosbouwdoeleinden;
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: 2.d
    text: |-
      kabelbaaninstallaties voor het bereiken van berghutten die uitsluitend bestemd zijn voor het vervoer van goederen
      en specifiek aangewezen personen;
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: 2.e
    text: |-
      al dan niet vaste toestellen en installaties die uitsluitend bedoeld zijn voor vrijetijdsbesteding en recreatie, en
      niet voor personenvervoer;
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: 2.f
    text: |-
      mijnbouwinstallaties of andere industriële installaties op een vaste locatie die worden gebruikt voor industriële
      activiteiten, of
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: 2.g
    text: installaties waarbij de gebruikers of de vervoermiddelen zich op het water bewegen.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel2
  - number: '3'
    text: 'Een kabelbaaninstallatie wordt slechts in bedrijf gesteld en gehouden indien zij:'
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel3
  - number: 3.a
    text: voldoet aan de essentiële eisen, en
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel3
  - number: 3.b
    text: |-
      bij gebruik volgens haar bestemming geen gevaar oplevert voor de veiligheid en de gezondheid van personen en de
      veiligheid van goederen.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel3
  - number: '5'
    text: |-
      Onze Minister kan, met inachtneming van de artikelen 23 tot en met 30 van de verordening, op verzoek
      conformiteitsbeoordelingsinstanties aanwijzen die bevoegd zijn tot de uitvoering van conformiteitsbeoordelingen
      volgens één van de procedures, bedoeld in artikel 18, tweede lid, van de verordening en in overeenstemming met de
      verplichtingen, bedoeld in artikel 34 van de verordening.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel5
  - number: '6.1'
    text: |-
      Aan een aanwijzing als bedoeld in [artikel 5][ref1] kunnen beperkingen en voorschriften worden verbonden. De
      voorschriften kunnen mede betrekking hebben op de door de conformiteitsbeoordelingsinstanties in rekening te
      brengen tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een conformiteitsbeoordelingsinstantie een vergoeding verschuldigd
      is voor de kosten van de beoordeling van het verzoek tot aanwijzing als bedoeld in [artikel 5][ref1] en de
      uitoefening van het toezicht, volgens de daarbij vast te stellen tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.3'
    text: |-
      Onze Minister beperkt, schorst of trekt een aanwijzing als bedoeld in [artikel 5][ref1] in:


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '5'
        hoofdstuk: '3'
  - number: 6.3.a
    text: op verzoek van de desbetreffende conformiteitsbeoordelingsinstantie;
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel6
  - number: 6.3.b
    text: |-
      indien is gebleken dat de desbetreffende conformiteitsbeoordelingsinstantie niet langer voldoet aan de eisen,
      genoemd in artikel 26 van de verordening, of de verplichtingen, genoemd in de artikelen 28, 34, 35, 36 of 38 van de
      verordening, niet nakomt, of
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel6
  - number: 6.3.c
    text: |-
      indien de desbetreffende conformiteitsbeoordelingsinstantie de aan de aanwijzing verbonden voorschriften niet
      naleeft.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel6
  - number: '7'
    text: Onze Minister verricht de taken van de aanmeldende autoriteit in de zin van de verordening.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel7
  - number: '20.1'
    text: |-
      Voor het bouwen en in bedrijf stellen en hebben van een kabelbaaninstallatie is een kabelbaanvergunning van
      Onze Minister vereist. Een voor een kabelbaaninstallatie verleende vergunning geldt voor eenieder die de
      kabelbaaninstallatie bouwt of in bedrijf stelt en houdt.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel20
  - number: '20.2'
    text: |-
      Aan een kabelbaanvergunning kunnen voorschriften en beperkingen worden verbonden. Een kabelbaanvergunning kan
      worden verleend voor een in de vergunning bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel20
  - number: '20.3'
    text: |-
      De beperkingen waaronder een kabelbaanvergunning is verleend en de aan een vergunning verbonden voorschriften
      kunnen ambtshalve of op aanvraag worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel20
  - number: '22.1'
    text: |-
      Een aanvraag voor een kabelbaanvergunning wordt gelijktijdig ingediend met de
      aanvraag voor een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref1] voor de desbetreffende
      installatie. Onze Minister bevordert een gecoördineerde voorbereiding en inhoudelijke afstemming van beide
      vergunningen. Burgemeester en wethouders van de betrokken gemeente verlenen de daarvoor benodigde medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '22.2'
    text: |-
      Bij de aanvraag voor een kabelbaanvergunning wordt een kopie van de aanvraag voor een omgevingsvergunning voor een
      bouwactiviteit overgelegd, naast de documenten, bedoeld in artikel 9, tweede lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel22
  - number: '22.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanvraag van een
      kabelbaanvergunning en de daarbij in te dienen gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel22
  - number: '23.1'
    text: |-
      Een kabelbaanvergunning wordt slechts verleend indien de kabelbaaninstallatie, mits naar behoren geïnstalleerd en
      onderhouden, en in overeenstemming met haar bestemming gebruikt, de veiligheid en gezondheid van personen en de
      veiligheid van goederen niet in gevaar kan brengen.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel23
  - number: '23.2'
    text: |-
      Een kabelbaanvergunning wordt in ieder geval geweigerd indien de kabelbaaninstallatie niet voldoet aan de eisen uit
      de verordening of deze wet.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel23
  - number: '24.1'
    text: 'De kabelbaanvergunning kan worden geschorst of ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel24
  - number: 24.1.a
    text: de voorschriften van de kabelbaanvergunning niet worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel24
  - number: 24.1.b
    text: |-
      de kabelbaaninstallatie gevaar oplevert voor de veiligheid en de gezondheid van personen en de veiligheid van
      goederen;
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel24
  - number: 24.1.c
    text: de kabelbaaninstallatie permanent buiten gebruik is gesteld.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel24
  - number: '24.2'
    text: De schorsing wordt opgeheven indien de redenen tot schorsing niet meer bestaan.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel24
  - number: '25'
    text: |-
      De vergunninghouder bewaart een kopie van de kabelbaanvergunning bij de kabelbaaninstallatie, naast de documenten,
      bedoeld in artikel 9, tweede lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel25
  - number: '26.1'
    text: |-
      De kosten die samenhangen met de behandeling van de aanvraag en de afgifte, wijziging of schorsing van een
      kabelbaanvergunning, alsmede met de afgifte van duplicaten en gewaarmerkte afschriften van een kabelbaanvergunning,
      worden ten laste gebracht van de aanvrager van de kabelbaanvergunning.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel26
  - number: '26.2'
    text: De tarieven ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel26
  - number: '27'
    text: |-
      Indien Onze Minister van oordeel is dat een subsysteem dat of een veiligheidscomponent die is voorzien van een CE-
      markering, ook wanneer dat subsysteem of die veiligheidscomponent in overeenstemming met zijn bestemming wordt
      gebruikt en op de juiste wijze wordt onderhouden, de veiligheid of gezondheid van personen of de veiligheid
      van goederen in gevaar kan brengen, verbiedt hij het gebruik van het subsysteem of de veiligheidscomponent,
      stelt hij daaraan beperkingen, verbindt hij voorwaarden aan het in de handel brengen van het subsysteem of de
      veiligheidscomponent, verbiedt hij dat het subsysteem of de veiligheidscomponent in de handel wordt gebracht of
      verplicht hij dat het subsysteem of de veiligheidscomponent uit de handel wordt genomen of wordt teruggeroepen.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel27
  - number: '28'
    text: |-
      Indien Onze Minister van oordeel is dat ten aanzien van een subsysteem of veiligheidscomponent sprake is van één
      of meer van de feiten, genoemd in artikel 43, eerste lid, van de verordening, verbiedt hij het gebruik van het
      subsysteem of de veiligheidscomponent, stelt hij daaraan beperkingen, verbindt hij voorwaarden aan het in de handel
      brengen van het subsysteem of de veiligheidscomponent, verbiedt hij dat het subsysteem of de veiligheidscomponent
      in de handel wordt gebracht of verplicht hij dat het subsysteem of de veiligheidscomponent uit de handel wordt
      genomen of wordt teruggeroepen.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel28
  - number: '30'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde in de
      [artikelen 3, aanhef en onderdeel b][ref1], [20, eerste lid][ref2], [24, eerste lid][ref3], [25][ref4], [27][ref5]
      en [28][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0016366#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0016366#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0016366#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0016366#Artikel28
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '20'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0016366
        artikel: '24'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0016366
        artikel: '25'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0016366
        artikel: '27'
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0016366
        artikel: '28'
        hoofdstuk: '6'
  - number: '31.1'
    text: |-
      Het is verboden veiligheidscomponenten of subsystemen in de handel te brengen die niet voldoen aan de essentiële
      eisen en die niet zijn voorzien van een CE-markering of een EU-conformiteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel31
  - number: '31.2'
    text: |-
      Het is verboden op subsystemen of veiligheidscomponenten een CE-markering aan te brengen of daarvoor een EU-
      conformiteitsverklaring op te stellen indien de subsystemen of veiligheidscomponenten niet in overeenstemming zijn
      met de essentiële eisen of indien voor de subsystemen of veiligheidscomponenten geen conformiteitsbeoordeling als
      bedoeld in [artikel 5][ref1] is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '5'
        hoofdstuk: '3'
  - number: '31.3'
    text: |-
      Het is verboden te handelen in strijd met een verbod of een maatregel op grond van de [artikelen 27][ref1] en
      [28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel28
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '27'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '28'
        hoofdstuk: '6'
  - number: '32'
    text: |-
      Het is verboden op subsystemen of veiligheidscomponenten merktekens of opschriften aan te brengen die misleidend
      kunnen zijn ten aanzien van de betekenis of vorm van de CE-markering, of die de zichtbaarheid of de leesbaarheid
      van een CE-markering verminderen.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel32
  - number: '33.1'
    text: |-
      Het is verboden zonder kabelbaanvergunning een kabelbaaninstallatie te bouwen en in bedrijf te stellen, of te
      handelen in strijd met de voorschriften van de kabelbaanvergunning.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel33
  - number: '33.2'
    text: |-
      Het is verboden een kabelbaaninstallatie in bedrijf te stellen of in bedrijf te hebben indien de
      kabelbaanvergunning is geschorst.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel33
  - number: '34.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de verordening of deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft ressorterende onder een
      ander ministerie dan dat van Onze Minister wordt het desbetreffende besluit genomen in overeenstemming met de
      minister van dat andere ministerie.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel34
  - number: '34.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel34
  - number: '35.1'
    text: 'Deze wet is niet van toepassing op subsystemen en veiligheidscomponenten die in de handel zijn gebracht:'
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel35
  - number: 35.1.a
    text: voor 23 maart 2004, of
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel35
  - number: 35.1.b
    text: |-
      tussen 23 maart 2004 en 21 april 2018, als die vielen onder het toepassingsbereik van deze wet zoals die luidde
      voor 21 april 2018 en daarmee in overeenstemming zijn.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel35
  - number: '35.2'
    text: |-
      [Artikel 20, eerste lid][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel20
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '20'
        hoofdstuk: '5'
  - number: 35.2.a
    text: het in bedrijf hebben van een kabelbaaninstallatie die in bedrijf is gesteld voor 23 maart 2004, of
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel35
  - number: 35.2.b
    text: |-
      het in bedrijf stellen van een kabelbaaninstallatie die is gebouwd voor 21 april 2018, als die viel onder het
      toepassingsbereik van deze wet zoals die luidde voor 21 april 2018 en daarmee in overeenstemming is.
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel35
  - number: '36'
    text: |-
      Een kabelbaanvergunning die vóór 21 april 2018 is verleend op basis van artikel 20 van de wet zoals die luidde voor
      die datum berust op [artikel 20][ref1] van de wet zoals die luidt vanaf die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel20
    url: https://wetten.overheid.nl/BWBR0016366/2018-04-21#Artikel36
