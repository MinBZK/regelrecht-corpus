        artikel: 33a
        hoofdstuk: '7'
      - id: ref8
        bwb_id: BWBR0016366
        artikel: 34c
        hoofdstuk: 8a
  - number: '31.1'
    text: |-
      Het is verboden veiligheidscomponenten of subsystemen in de handel te brengen die niet voldoen aan de essentiële
      eisen en die niet zijn voorzien van een CE-markering of een EU-conformiteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel31
  - number: '31.2'
    text: |-
      Het is verboden op subsystemen of veiligheidscomponenten een CE-markering aan te brengen of daarvoor een EU-
      conformiteitsverklaring op te stellen indien de subsystemen of veiligheidscomponenten niet in overeenstemming zijn
      met de essentiële eisen of indien voor de subsystemen of veiligheidscomponenten geen conformiteitsbeoordeling als
      bedoeld in [artikel 5][ref1] is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel5
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '5'
        hoofdstuk: '3'
  - number: '31.3'
    text: |-
      Het is verboden te handelen in strijd met een verbod of een maatregel op grond van de [artikelen 27][ref1] en
      [28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel28
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '27'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '28'
        hoofdstuk: '6'
  - number: '32'
    text: |-
      Het is verboden op subsystemen of veiligheidscomponenten merktekens of opschriften aan te brengen die misleidend
      kunnen zijn ten aanzien van de betekenis of vorm van de CE-markering, of die de zichtbaarheid of de leesbaarheid
      van een CE-markering verminderen.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel32
  - number: '33.1'
    text: |-
      Het is verboden zonder kabelbaanvergunning een kabelbaaninstallatie te bouwen en in bedrijf te stellen, of te
      handelen in strijd met de voorschriften van de kabelbaanvergunning.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel33
  - number: '33.2'
    text: |-
      Het is verboden een kabelbaaninstallatie in bedrijf te stellen of in bedrijf te hebben indien de
      kabelbaanvergunning is geschorst.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel33
  - number: 33a
    text: Het is verboden in strijd te handelen met artikel 7 van [verordening (EU) nr. 2019/1020](32920R2019).
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel33a
  - number: '34.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de verordening of deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft ressorterende onder een
      ander ministerie dan dat van Onze Minister wordt het desbetreffende besluit genomen in overeenstemming met de
      minister van dat andere ministerie.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34
  - number: '34.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34
  - number: 34a.1
    text: |-
      De ingevolge [artikel 34, eerste lid][ref1], aangewezen ambtenaren zijn in afwijking van
      [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref2], bevoegd met medeneming van de benodigde
      apparatuur een woning te betreden zonder toestemming van de bewoner ten behoeve van de uitoefening van de
      bevoegdheden, bedoeld in artikel 14, vierde lid, onderdelen a, d en e, van [verordening (EU) nr. 2019/1020]
      (32920R2019).


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '34'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 34a.2
    text: |-
      Voor het uitoefenen van de bevoegdheid, bedoeld in het eerste lid, is een voorafgaande machtiging vereist van de
      rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 34a.3
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het tweede lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34a
  - number: 34a.4
    text: |-
      De [artikelen 2][ref1] en [3 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
  - number: 34b.1
    text: |-
      De ingevolge [artikel 34, eerste lid][ref1], aangewezen ambtenaren zijn bevoegd om, ter uitvoering van [verordening
      (EU) nr. 2019/1020](32920R2019), onder verstrekking van onjuiste of onvolledige gegevens met betrekking tot hun
      identiteit en hoedanigheid, subsystemen of veiligheidscomponenten te verkrijgen ten behoeve van het controleren
      van de kenmerken van deze subsystemen of veiligheidscomponenten en de verificatie van de documenten en de
      hieraan gerelateerde handelingen te verrichten voor zover dat voor de vervulling van hun taak noodzakelijk is.
      [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '34'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 34b.2
    text: |-
      De ambtenaar die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan een
      schriftelijk verslag op waarin hij vermeldt:
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34b.2.a
    text: zijn naam of nummer en hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34b.2.b
    text: de motivering van de noodzaak tot uitoefening van de bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34b.2.c
    text: de voorschriften op de naleving waarvan wordt toegezien;
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34b.2.d
    text: |-
      het adres, waaronder indien van toepassing, het elektronische adres waar het subsysteem of de veiligheidscomponent,
      is verkregen, en voor zover bekend, de omschrijving van de betrokken marktdeelnemer, bedoeld in artikel 3,
      onderdeel 13, van [verordening (EU) nr. 2019/1020](32920R2019);
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34b.2.e
    text: |-
      de onjuiste of onvolledige gegevens die zijn verstrekt bij de verkrijging van het subsysteem of de
      veiligheidscomponent;
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34b.2.f
    text: de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34b.2.g
    text: wat de uitkomst is van het onderzoek van het verkregen subsysteem of de verkregen veiligheidscomponent.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34b
  - number: 34c.1
    text: |-
      Ter uitvoering van [verordening (EU) nr. 2019/1020](32920R2019) kan Onze Minister, indien er geen andere
      doeltreffende middelen voorhanden zijn om een ernstig risico als bedoeld in artikel 3, onderdeel 20, van
      [verordening (EU) nr. 2019/1020](32920R2019), gevormd door een subsysteem of een veiligheidscomponent, weg
      te nemen, een zelfstandige last opleggen aan degene die daartoe in staat is, om inhoud te verwijderen van
      of de toegang te beperken tot een online interface als bedoeld in artikel 3, onderdeel 15, van [verordening
      (EU) nr. 2019/1020](32920R2019) of opdracht te geven tot de duidelijke weergave van een waarschuwing voor
      eindgebruikers, bedoeld in artikel 3, onderdeel 21, van [verordening (EU) nr. 2019/1020](32920R2019), wanneer zij
      zich toegang verschaffen tot een online interface.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34c
  - number: 34c.2
    text: |-
      Indien niet binnen de daarvoor gestelde termijn aan een last als bedoeld in het eerste lid is voldaan, kan Onze
      Minister een zelfstandige last opleggen aan een aanbieder van diensten van de informatiemaatschappij, als bedoeld
      in artikel 3, onderdeel 14, van [verordening (EU) nr. 2019/1020](32920R2019) om alle maatregelen te treffen die
      redelijkerwijs van hem kunnen worden gevergd om de toegang tot een online interface te beperken, onder meer door
      een daarvoor in aanmerking komende derde te verzoeken dergelijke maatregelen uit te voeren.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34c
  - number: 34c.3
    text: |-
      Degene tot wie een zelfstandige last als bedoeld in het eerste of tweede lid is gericht, handelt overeenkomstig
      die last.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34c
  - number: 34c.4
    text: |-
      Op grond van het eerste of tweede lid kan geen zelfstandige last worden opgelegd die leidt tot het blokkeren of
      filteren van internetverkeer.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34c
  - number: 34c.5
    text: |-
      Voor een zelfstandige last als bedoeld in het eerste of tweede lid is voorafgaande machtiging vereist van de
      rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 34c.6
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het vijfde lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister, binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34c
  - number: 34c.7
    text: |-
      Onze Minister maakt de machtiging van de rechter-commissaris gelijktijdig met de zelfstandige last, bedoeld in het
      eerste of tweede lid, bekend.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34c
  - number: 34d
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing voor zover de ingevolge
      [artikel 34, eerste lid][ref2], aangewezen ambtenaren bijstand verlenen aan een markttoezichtautoriteit als
      bedoeld in artikel 3, onderdeel 4, van [verordening (EU) nr. 2019/1020](32920R2019), uit een andere lidstaat van de
      Europese Unie op grond van artikel 22 of artikel 23 van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0016366#Artikel34
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0016366
        artikel: '34'
        hoofdstuk: '8'
  - number: '35.1'
    text: 'Deze wet is niet van toepassing op subsystemen en veiligheidscomponenten die in de handel zijn gebracht:'
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel35
  - number: 35.1.a
    text: voor 23 maart 2004, of
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel35
  - number: 35.1.b
    text: |-
      tussen 23 maart 2004 en 21 april 2018, als die vielen onder het toepassingsbereik van deze wet zoals die luidde
      voor 21 april 2018 en daarmee in overeenstemming zijn.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel35
  - number: '35.2'
    text: |-
      [Artikel 20, eerste lid][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel20
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '20'
        hoofdstuk: '5'
  - number: 35.2.a
    text: het in bedrijf hebben van een kabelbaaninstallatie die in bedrijf is gesteld voor 23 maart 2004, of
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel35
  - number: 35.2.b
    text: |-
      het in bedrijf stellen van een kabelbaaninstallatie die is gebouwd voor 21 april 2018, als die viel onder het
      toepassingsbereik van deze wet zoals die luidde voor 21 april 2018 en daarmee in overeenstemming is.
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel35
  - number: '36'
    text: |-
      Een kabelbaanvergunning die vóór 21 april 2018 is verleend op basis van artikel 20 van de wet zoals die luidde voor
      die datum berust op [artikel 20][ref1] van de wet zoals die luidt vanaf die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel20
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '20'
        hoofdstuk: '5'
  - number: '43'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met uitzondering van de [artikelen 40 tot en met 42][ref1], die in werking treden op een bij koninklijk
      besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016366#Artikel40
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0016366
        artikel: '40'
        hoofdstuk: '10'
  - number: '44'
    text: 'Deze wet wordt aangehaald als: Wet kabelbaaninstallaties.'
    url: https://wetten.overheid.nl/BWBR0016366/2024-01-01#Artikel44
