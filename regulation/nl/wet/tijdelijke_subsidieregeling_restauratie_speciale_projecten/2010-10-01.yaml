  - number: '10'
    text: |-
      Direct na de subsidieverlening verstrekt de minister aan de subsidieontvanger een voorschot van 80 procent van de
      verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel10
  - number: '11'
    text: |-
      1 Binnen 13 weken na afronding van de activiteiten waarvoor subsidie is verleend, dient de subsidieontvanger een
      aanvraag tot vaststelling van de subsidie in.

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een prestatieverklaring en een financieel verslag.

      3 In de prestatieverklaring toont de subsidieontvanger aan dat de activiteiten waarvoor de subsidie is verleend
      zijn verricht en dat aan de aan de subsidie verbonden verplichtingen is voldaan. De minister kan een model
      vaststellen voor de prestatieverklaring.

      4 De prestatieverklaring gaat vergezeld van een inspectierapport dat is opgesteld na afronding van de activiteiten
      waarvoor subsidie is verleend.

      5 Het financieel verslag geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en besteding van de subsidie door de subsidieontvanger. De minister kan een model vaststellen voor het
      financieel verslag.

      6 Het financieel verslag gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. In de verklaring verklaart de accountant
      dat de bedragen in het financieel verslag juist zijn en doet hij tevens een uitspraak over de naleving door de
      subsidieontvanger van de in het controle protocol genoemde voorschriften.

      7 De subsidieontvanger bedingt bij de accountant dat deze zijn onderzoek inricht overeenkomstig een door de
      minister vast te stellen controleprotocol.

      8 De minister kan de subsidieontvanger verplichten de desbetreffende originele rekeningen en betalingsbewijzen
      te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
