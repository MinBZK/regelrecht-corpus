  - number: '8'
    text: De minister beslist binnen dertien weken op een aanvraag tot verlening van subsidie.
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel8
  - number: '9'
    text: |-
      1 De [artikelen 23 tot en met 29 van het Besluit][ref1] zijn van overeenkomstige toepassing met dien verstande dat
      instandhoudingsplan wordt gelezen als restauratieplan.

      2 Voor zover voor de activiteiten waarvoor subsidie wordt verleend een vergunning als bedoeld in
      [artikel 2.1, eerste lid, onder f, van de Wet algemene bepalingen omgevingsrecht][ref2] is vereist, vangen die
      activiteiten niet aan zonder of in afwijking van de vergunning.

      3


