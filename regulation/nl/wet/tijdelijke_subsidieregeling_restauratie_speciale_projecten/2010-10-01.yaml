preamble:
  text: |-
    Gelet op artikel 43, vijfde lid, van het Besluit rijkssubsidiëring instandhouding monumenten en artikel 3, tweede
    lid, en artikel 4, tweede lid, van de Wet overige OCW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Besluit:* [Besluit rijkssubsidiëring instandhouding monumenten][ref1];
        - *inspectierapport:* rapport met betrekking tot een beschermd monument dat de technische of fysieke staat van dat
      monument beschrijft, en dat is opgesteld door een ter zake deskundige persoon of instantie;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0019439
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019439
  - number: '2'
    text: |-
      De minister kan uitsluitend ten behoeve van de restauratie van de volgende beschermde monumenten subsidie
      verstrekken:

      a. Havenkerk te Schiedam;

      b. Prinsenhof te Groningen;

      c. Groot Lankum te Franeker;

      d. Wintertuin te Baarn;

      e. Steenfabriek te Randwijk;

      f. Badpaviljoen te Hindelopen;

      g. Belfort te Sluis;

      h. Panorama Mesdag te ’s-Gravenhage;

      i. Portugese Synagoge te Amsterdam;

      j. Justus van Effencomplex te Rotterdam;

      k. Synagoge aan de Hofstraat te Alkmaar.
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel2
  - number: '3'
    text: |-
      Het subsidieplafond bedraagt voor:

      a. Havenkerk te Schiedam: € 1 miljoen;

      b. Prinsenhof te Groningen: € 1 miljoen;

      c. Groot Lankum te Franeker: € 1 miljoen;

      d. Wintertuin te Baarn: € 1,5 miljoen;

      e. Steenfabriek te Randwijk: € 700.000;

      f. Badpaviljoen te Hindelopen: € 600.000;

      g. Belfort te Sluis: € 600.000;

      h. Panorama Mesdag te ’s-Gravenhage: € 400.000;

      i. Portugese Synagoge te Amsterdam: € 430.000;

      j. Justus van Effencomplex te Rotterdam: € 1,5 miljoen;

      k. Synagoge aan de Hofstraat te Alkmaar: € 300.000.
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel3
  - number: '4'
    text: |-
      1 Subsidiabel zijn de kosten van werkzaamheden, maatregelen en voorzieningen als bedoeld in de Leidraad
      subsidiabele instandhoudingskosten Brim 2010, opgenomen als [bijlage bij de Regeling rijkssubsidiëring
      instandhouding monumenten](onbekend), met dien verstande dat:

      a. kosten uitsluitend subsidiabel zijn voorzover de werkzaamheden:

      1°. strekken tot restauratie van een monument als bedoeld in [artikel 3][ref1] en zijn monumentale waarden,

      2°. sober en doelmatig zijn,

      3°. technisch noodzakelijk zijn, en

      4°. de werkzaamheden zijn gericht op maximaal behoud van aanwezige monumentale waarden, in het bijzonder
      historische materialen en constructies;

      b. kosten voor werkzaamheden gericht op het voorkomen van verval of het voorkomen van vervolgschade subsidiabel
      zijn;

      c. kosten voor werkzaamheden gericht op vervanging van materialen die hun functie niet meer kunnen vervullen
      subsidiabel zijn;

      d. kosten voor werkzaamheden gericht op reconstructie niet subsidiabel zijn, tenzij deze in uitzonderlijke gevallen
      naar het oordeel van de minister ter versterking van de monumentale waarden gewenst zijn; en

      e. kosten voor werkzaamheden die voortvloeien uit veranderd gebruik, alsmede kosten voor werkzaamheden die zijn
      gericht op comfortverbetering niet subsidiabel zijn.

      2 Indien de restauratie waarvoor subsidie wordt gevraagd reeds aangevangen is, komen onverminderd het eerste lid,
      tevens voor subsidie in aanmerking de gemaakte kosten in verband met de restauratie voor zover die kosten in 2010
      zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0027593#Artikel3
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027593
        artikel: '3'
  - number: '5'
    text: |-
      De activiteiten waarvoor subsidie wordt verstrekt vangen aan of zijn reeds aangevangen in 2010 en zijn afgerond
      voor 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel5
  - number: '6'
    text: |-
      1 Per monument als bedoeld in [artikel 2][ref1] wordt één aanvraag voor subsidie ingediend.

      2 Voor zover de minister niet reeds beschikt over deze documenten, gaat een aanvraag vergezeld van:

      a. een restauratieplan; en

      b. een globale begroting van de kosten van de voorgenomen restauratiewerkzaamheden.

      3 Een restauratieplan omvat in ieder geval:

      a. tekeningen van de bestaande toestand van het monument;

      b. tekeningen waarop de voorgenomen restauratiewerkzaamheden of wijzigingen van het monument staan aangegeven; en

      c. een op de technische staat van het monument gebaseerd bestek of gebaseerde werkomschrijving per onderdeel van de
      restauratiewerkzaamheden van de toe te passen constructies, materialen, afwerkingen en kleuren alsmede van de wijze
      van verwerking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0027593#Artikel2
    url: https://wetten.overheid.nl/BWBR0027593/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027593
        artikel: '2'
  - number: '7'
    text: |-
      1 Een aanvraag tot verlening van subsidie wordt ingediend voor 1 augustus 2010.

      2 In afwijking van het eerste lid kan de minister voor [artikel 2, onderdeel j][ref1], een andere indieningsdatum
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0027593#Artikel2
