$id: regeling_inschrijving_nederlandse_burgerluchtvaartuigen
regulatory_layer: WET
publication_date: '2023-11-24'
valid_from: '2024-01-01'
bwb_id: BWBR0012878
url: https://wetten.overheid.nl/BWBR0012878/2024-01-01
preamble:
  text: |-
    Gelet op de artikelen 3.2, tweede lid, 3.3, vijfde lid, 3.5, vijfde lid van de Wet luchtvaart en artikel 3 van het
    Besluit luchtwaardigheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanvrager:* degene op wiens naam de minister een luchtvaartuig zal
      inschrijven indien deze aan de hier gestelde regels voldoet;
        - *CAMO:* ingevolge bijlage V quater (Part CAMO) bij verordening (EU) nr. 1321/2014 erkende management organisatie
      voor blijvende luchtwaardigheid (Continuing Airworthiness Management Organisation);
        - *CAO:* ingevolge bijlage V quinquies (Part CAO) bij [verordening (EG) nr. 1321/2014](32014R1321) erkende
      organisatie voor blijvende luchtwaardigheid (Continuing Airworthiness Organisation);
        - *Luchtvaartprotocol:* het op 6 november 2001 te Kaapstad tot stand gekomen Protocol bij het Verdrag inzake
      internationale zakelijke rechten op mobiel materieel betreffende voor luchtvaartuigmaterieel specifieke
      aangelegenheden (Trb. 2009, 86);
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *register:* Nederlandse register voor burgerluchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 3.2, tweede lid][ref1], [3.3, vijfde lid][ref2], en
      [3.5, vijfde lid, van de Wet luchtvaart][ref3] en [artikel 4 van het Besluit luchtvaartuigen 2008][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0023922#Artikel4
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0023922
        artikel: '4'
  - number: '2.1'
    text: |-
      Het aanvraagformulier voor inschrijving, wijziging van de inschrijving van een luchtvaartuig in het register of
      vernieuwing van het bewijs van inschrijving wordt volledig ingevuld en ondertekend door de aanvrager. Het formulier
      wordt door de minister elektronisch beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij de aanvraag tot inschrijving, voor wijziging van een inschrijving van een luchtvaartuig in het register of
      vernieuwing van het bewijs van inschrijving worden de in deze regeling genoemde gegevens ingediend.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      De gegevens, bedoeld in het tweede lid, worden op een zodanig tijdstip ingediend, dat de beoordeling waarop de
      inschrijving respectievelijk de wijziging van de inschrijving van het betrokken luchtvaartuig in het register is
      gebaseerd, tijdig kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel2
  - number: '3'
    text: 'De houder van het luchtvaartuig is verplicht de minister zo spoedig mogelijk in te lichten indien:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
  - number: 3.a
    text: het luchtvaartuig definitief niet meer aan het luchtverkeer deelneemt;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
  - number: 3.b
    text: |-
      het luchtvaartuig is overgedragen aan een andere houder of eigenaar onder opgave van diens naam, adres, woonplaats
      dan wel zetel, land van vestiging en datum van overdracht;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
  - number: 3.c
    text: het luchtvaartuig in het buitenland is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
  - number: 3.d
    text: het bewijs van inschrijving verloren is gegaan;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
  - number: 3.e
    text: |-
      hij vrijwillig het beheer van het luchtvaartuig uitbesteedt aan een CAMO, dan wel een CAO, door middel van het
      overleggen van in ieder geval een kopie van de pagina’s van het contract waaruit de namen van de partijen, de
      ondertekening, de reikwijdte en de geldigheidsduur van het contract blijkt;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
  - number: 3.f
    text: |-
      het contract, bedoeld onder e en in [artikel 7, onderdeel d][ref1], en de overeenkomst bedoeld in
      [artikel 8, eerste lid][ref2], is beëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012878#Artikel8
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012878
        artikel: '8'
        paragraaf: '3'
  - number: 3.g
    text: |-
      de houder, de eigenaar of de vertegenwoordiger bedoeld in
      [artikel 3, vierde lid, van het Besluit luchtvaartuigen 2008][ref1] niet meer voldoet aan de eisen voor het
      verkrijgen van een inschrijving, of


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel3
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '3'
  - number: 3.h
    text: |-
      de gegevens, bedoeld in [paragraaf 8][ref1], zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Paragraaf8
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012878
        paragraaf: '8'
  - number: '4.1'
    text: |-
      Bij de aanvraag tot inschrijving van het luchtvaartuig in het register wordt een bewijs van eigendom van het
      luchtvaartuig overgelegd.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: '4.2'
    text: 'Indien het luchtvaartuig vanuit het buitenland wordt ingevoerd, wordt ingediend:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: 4.2.a
    text: |-
      een algemene beschrijving van het luchtvaartuig met, indien van toepassing, vermelding van het aantal en type
      voortstuwingsinrichtingen en luchtschroeven;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: 4.2.b
    text: 'een bewijs dat:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: 4.2.b.1
    text: het luchtvaartuig niet, dan wel niet meer in het buitenland is ingeschreven, of
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: 4.2.b.2
    text: |-
      het luchtvaartuig ingevolge de artikelen IX, eerste lid, onderdeel a, en vijfde lid, onderdelen a en b, en XIII van
      het Luchtvaartprotocol uit een buitenlands register had moeten worden gederegistreerd.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      Wanneer het tweede lid, onderdeel b, onder 2°, van toepassing is wordt tevens ingediend correspondentie die
      aantoont dat de gemachtigde partij, of de door hem aangewezen persoon, overeenkomstig de artikelen IX, eerste lid,
      onderdeel a, en vijfde lid, onderdelen a en b, en XIII van het Luchtvaartprotocol het buitenlands register om de
      doorhaling van de inschrijving van het luchtvaartuig heeft verzocht en dat ondanks dat het verzoek naar behoren is
      ingediend de deregistratie niet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het tweede lid, onderdeel b, onder 2°, en het derde lid, zijn uitsluitend van toepassing indien de aanvrager
      ingezetene is van de openbare lichamen Bonaire, Sint-Eustatius of Saba en de inschrijving van het desbetreffende
      luchtvaartuig ten behoeve van exploitatie in één van deze lichamen plaats zal vinden.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel4
  - number: '5.1'
    text: 'Door een natuurlijke persoon worden de volgende gegevens ingediend:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel5
  - number: 5.1.a
    text: |-
      een niet ouder dan 6 maanden, gewaarmerkt afschrift uit de basisregistratie personen, of, in geval van een
      persoon woonachtig buiten Nederland, van een vergelijkbare administratie, waarop door deze administratie ook de
      nationaliteit is vermeld; of,
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      een niet ouder dan 6 maanden, gewaarmerkt afschrift uit de basisregistratie personen, of, in geval van een persoon
      die niet is ingeschreven in de basisregistratie personen, van een vergelijkbare administratie, alsmede een kopie
      van een geldig paspoort of ander geldig identiteitsbewijs waaruit de nationaliteit onomstotelijk blijkt.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      Ingeval van meerdere houders, wordt een verklaring inzake het optreden van één van de houders als contactpersoon
      ingediend, waarbij van iedere houder de gegevens, bedoeld in het eerste lid worden ingediend. Een formulier voor
      deze verklaring is kosteloos te verkrijgen bij de minister.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel5
  - number: '6'
    text: 'Door een rechtspersoon worden de volgende gegevens ingediend:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel6
  - number: 6.a
    text: |-
      een niet ouder dan 6 maanden gewaarmerkt uittreksel uit het Handelsregister van de Kamer van Koophandel, of, in
      geval van een rechtspersoon gevestigd buiten Nederland, van een vergelijkbare instantie;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel6
  - number: 6.b
    text: |-
      op verzoek van de minister een afschrift van de statuten of vergelijkbare documenten, waaruit blijkt, wie de
      rechtspersoon in en buiten rechte vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel6
  - number: '7'
    text: |-
      Een aanvrager, bedoeld in [artikel 3, vierde lid, van het Besluit luchtvaartuigen 2008][ref1], dient naast de
      gegevens volgens [artikel 5][ref2] of [6][ref3], de volgende gegevens in:


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012878#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0012878#Artikel6
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023922
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012878
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012878
        artikel: '6'
        paragraaf: '3'
  - number: 7.a
    text: |-
      een schriftelijke verklaring, dat het beheer van het luchtvaartuig zal worden uitgevoerd vanuit Nederland door een
      vertegenwoordiger van de aanvrager. Een formulier voor deze verklaring is kosteloos te verkrijgen bij de minister;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel7
  - number: 7.b
    text: |-
      indien het beheer wordt gevoerd door een natuurlijke persoon gaat de verklaring, bedoeld in onderdeel a, vergezeld
      van een niet ouder dan 6 maanden, gewaarmerkt afschrift uit de basisregistratie personen, waaruit blijkt dat de
      woonplaats van de vertegenwoordiger, bedoeld in onderdeel a, in Nederland is gelegen;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel7
  - number: 7.c
    text: |-
      indien het beheer wordt gevoerd door een rechtspersoon gaat de verklaring, bedoeld in onderdeel a, vergezeld van
      een niet ouder dan 6 maanden, gewaarmerkt uittreksel uit het handelsregister van de Kamer van Koophandel, waaruit
      blijkt dat de vestigingsplaats van de vertegenwoordiger, bedoeld in onderdeel a, in Nederland is gelegen;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel7
  - number: 7.d
    text: |-
      indien de aanvrager verplicht is het beheer van het luchtvaartuig uit te besteden aan een CAMO wordt in ieder
      geval een kopie van de pagina’s van het contract overgelegd waaruit de namen van de partijen, de ondertekening, de
      reikwijdte en de geldigheidsduur van het contract blijkt.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel7
  - number: '8'
    text: |-
      Onverminderd het bepaalde in de [artikelen 5][ref1], [6][ref2] en [7][ref3] dient een aanvrager, niet tevens
      zijnde de eigenaar de volgende gegevens in:


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012878#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012878#Artikel7
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012878
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012878
        artikel: '7'
        paragraaf: '3'
  - number: '8.1'
    text: een afschrift van de overeenkomst tussen de eigenaar en de aanvrager.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel8
  - number: '8.2'
    text: |-
      een door de eigenaar en aanvrager ondertekende verklaring, waarin is gesteld dat de aanvrager de ingevolge
      wettelijke bepalingen op de eigenaar rustende verplichtingen ten aanzien van het luchtvaartuig zal nakomen. Een
      formulier voor deze verklaring is kosteloos te verkrijgen bij de minister.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij de aanvraag tot wijziging van de in het register opgenomen gegevens van het luchtvaartuig worden de gewijzigde
      gegevens als bedoeld in de [artikelen 4 tot en met 8][ref1] overgelegd, waaruit de aard van de gevraagde wijziging
      blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel4
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '4'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Bij de aanvraag tot wijziging van de tenaamstelling van de inschrijving van het luchtvaartuig wordt naast de
      gegevens vermeld in de [artikelen 5 tot en met 8][ref1], een door de vorige eigenaar of eigenaren ondertekende
      verklaring, dat het luchtvaartuig is overgedragen aan de aanvrager ingediend, onder opgave van de datum van
      overdracht, naam, adres, woonplaats dan wel zetel en land van vestiging van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel5
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '5'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      Bij de aanvraag tot vernieuwing van het bewijs van inschrijving wordt een schriftelijke verklaring inzake de reden
      van vernieuwing overgelegd.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel10
  - number: '10.2'
    text: |-
      In geval van vermissing van het bewijs van inschrijving wordt bij de aanvraag tot vernieuwing van het bewijs van
      inschrijving een afschrift van het proces-verbaal van de aangifte van vermissing overgelegd.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien een bewijs van inschrijving wegens verlies is vernieuwd en het bewijs wordt teruggevonden, is de houder
      verplicht het teruggevonden bewijs zo spoedig mogelijk aan de minister te zenden.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel10
  - number: '10.4'
    text: |-
      Indien een bewijs van inschrijving anders dan wegens verlies is vernieuwd, is de houder verplicht het
      oorspronkelijke bewijs uiterlijk op de achtste dag na de datum van verzending van het vernieuwde bewijs aan de
      minister te zenden.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel10
  - number: '11.1'
    text: De aanvraag tot doorhaling van de inschrijving geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      De aanvraag tot doorhaling van de inschrijving bevat ten minste het nationaliteitskenmerk en het
      inschrijvingskenmerk alsmede het type en serienummer van het door te halen luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
  - number: '11.3'
    text: 'De aanvraag tot doorhaling van de inschrijving is ondertekend door:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
  - number: 11.3.a
    text: 'bij natuurlijke personen: alle eigenaren van het luchtvaartuig;'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
  - number: 11.3.b
    text: |-
      bij rechtspersonen: alle eigenaren die de rechtspersoon in en buiten rechte vertegenwoordigen zoals bedoeld in
      [artikel 5, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel5
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '5'
        paragraaf: '3'
  - number: '11.4'
    text: |-
      De minister stelt de houder van het luchtvaartuig schriftelijk op de hoogte van de doorhaling van de inschrijving,
      tenzij er bijzondere redenen zijn om de houder van het luchtvaartuig niet op de hoogte te stellen van de doorhaling
      van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
  - number: '11.5'
    text: |-
      In geval van gewenste inschrijving in een buitenlands luchtvaartuigenregister kan de minister de betreffende
      buitenlandse autoriteit op de hoogte stellen van de doorhaling van de inschrijving in het register.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
  - number: '11.6'
    text: |-
      Ingeval van een niet-ambtshalve doorhaling van de inschrijving, vindt de doorhaling slechts
      plaats, indien blijkt, dat het luchtvaartuig niet is teboekgesteld, als bedoeld in de
      [titel 15 van Boek 8 van het Burgerlijk Wetboek][ref1], of dat, zo het is teboekgesteld, de houders van
      ingeschreven rechten en de beslagleggers zijn voldaan of hun toestemming tot de doorhaling verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '13'
    text: 'In het register wordt aantekening gehouden van:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
  - number: 13.a
    text: |-
      indien de houder een natuurlijke persoon is de naam, de voorletters, het adres, de woonplaats, de geboortedatum en
      de geboorteplaats van de houder alsmede het land van vestiging indien de houder niet woonachtig is in Nederland;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
  - number: 13.b
    text: |-
      indien de houder een rechtspersoon is de naam, het adres en de vestigingsplaats van de houder alsmede het land van
      vestiging indien de houder niet gevestigd is in Nederland;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
  - number: 13.c
    text: |-
      de naam en het land van vestiging van de fabrikant alsmede de soort, de typeaanduiding, het serienummer, het
      nationaliteitskenmerk en het inschrijvingskenmerk van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
  - number: 13.d
    text: de datum van inschrijving onderscheidenlijk van wijziging van de inschrijving van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
  - number: 13.e
    text: de datum alsmede de reden van doorhaling van de inschrijving;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
  - number: 13.f
    text: |-
      Indien de houder van het luchtvaartuig niet tegelijkertijd de eigenaar is wordt eveneens aantekening gehouden van
      de gegevens van de eigenaar bedoeld onder a en b;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
  - number: 13.g
    text: |-
      Indien de houder van het luchtvaartuig niet tegelijkertijd de eigenaar is wordt eveneens aantekening gehouden van
      de gegevens bedoeld in [artikel 8][ref1] en de termijn voor welke de overeenkomst tussen de houder en eigenaar
      is aangegaan;


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel8
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '8'
        paragraaf: '3'
  - number: 13.h
    text: |-
      Indien de houder van het luchtvaartuig geen woonplaats dan wel statutaire zetel, hoofdbestuur of hoofdvestiging
      in Nederland heeft, wordt eveneens aantekening gehouden van de gegevens van de vertegenwoordiger van de houder,
      bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel5
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '5'
        paragraaf: '3'
  - number: 13.i
    text: |-
      Indien het luchtvaartuig is teboekgesteld, als bedoeld in de [titel 15 van Boek 8 van het Burgerlijk Wetboek][ref1]
      wordt eveneens aantekening gehouden van het nummer van de teboekstelling als genoemd in de `Maatregel te boek
      gestelde luchtvaartuigen 1996'.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005034
  - number: '14.1'
    text: |-
      Het nationaliteitskenmerk bestaat uit PH. Dit kenmerk wordt met een koppelteken verbonden met het
      inschrijvingskenmerk.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: '14.2'
    text: 'Het inschrijvingskenmerk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: 14.2.a
    text: cijfers voor zweef- en motorzweefvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: 14.2.b
    text: |-
      een cijfer-letter-cijfercombinatie voor MLA’s, MLH’s, lichte gyrokopters, gemotoriseerde schermvliegtuigen en
      paramotortrikes;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: 14.2.c
    text: een cijfer-letter-lettercombinatie voor onbemande luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: 14.2.d
    text: drie letters voor de overige luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het inschrijvingskenmerk begint niet met de letter Q en veroorzaakt geen verwarring met nood-, spoed- of
      waarschuwingssignalen. Het inschrijvingskenmerk is evenmin in strijd met de goede zeden.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: '14.4'
    text: De letter IJ wordt geschreven als Y.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel14
  - number: '15.1'
    text: |-
      De kenmerken worden aan de buitenzijde van het luchtvaartuig op een duurzame wijze aangebracht. De kenmerken worden
      altijd schoon en zichtbaar gehouden en stichten geen verwarring.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: '15.2'
    text: 'Op luchtschepen worden de kenmerken aangebracht op de romp of op de staartvlakken, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.2.a
    text: |-
      op de romp de kenmerken op zowel de linker als de rechter zijde van de romp in de lengterichting worden aangebracht
      en tevens symmetrisch op de bovenzijde van de romp, waarbij de top van de letters naar voren zijn gericht;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.2.b
    text: 'op de staartvlakken de kenmerken op de horizontale en de verticale staartvlakken worden aangebracht, waarbij:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.2.b.1°
    text: |-
      De kenmerken op de horizontale staartvlakken worden aangebracht op de rechterhelft aan de bovenzijde en op de
      linkerhelft aan de onderzijde;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.2.b.2°
    text: |-
      De kenmerken op de verticale staartvlakken worden aangebracht op elke zijde van de staartvlakken met de kenmerken
      horizontaal.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: '15.3'
    text: 'Op ballonnen worden de kenmerken aangebracht als volgt:'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.3.a
    text: |-
      op bolvormige ballonnen: op twee diametraal tegenover elkaar gelegen plaatsen nabij de maximale omtrek van de
      ballon, waarbij de kenmerken zowel vanaf de zijkant als vanaf de grond zichtbaar zijn;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.3.b
    text: |-
      op niet-bolvormige ballonnen: op twee tegenover elkaar gelegen plaatsen onmiddellijk onder de maximale
      dwarsdoorsnede van de ballon, dan wel op twee tegenover elkaar gelegen plaatsen, indien er geen sprake is van een
      maximale dwarsdoorsnede van de ballon, waarbij de kenmerken zowel vanaf de zijkant als vanaf de grond zichtbaar
      zijn;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: '15.4'
    text: |-
      Op de vleugels van luchtvaartuigen, anders dan bedoeld in het tweede en derde lid, worden de kenmerken aangebracht
      als volgt:
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.4.a
    text: |-
      op de linkerhelft van de onderzijde of over de gehele onderzijde, waarbij het nationaliteitskenmerk op de
      linkerhelft is aangebracht en het inschrijvingskenmerk op de rechterhelft;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.4.b
    text: zo mogelijk op gelijke afstand van de voor- en achterrand van de vleugel;
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.4.c
    text: met de top van de letters of cijfers naar voren gericht.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: '15.5'
    text: |-
      Op de romp of de staartvlakken of overeenkomstige delen van luchtvaartuigen, anders dan bedoeld in het tweede en
      derde lid, worden de kenmerken aangebracht aan elke buitenzijkant:
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.5.a
    text: tussen de vleugel en de staartvlakken, of
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: 15.5.b
    text: op de bovenhelft van de verticale staartvlakken aan elke zijde van de staartvlakken.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: '15.6'
    text: |-
      Indien het luchtvaartuig niet is voorzien van vleugels, romp, staartvlakken of overeenkomstige delen die bruikbaar
      zijn om de kenmerken op aan te brengen, worden de kenmerken, bedoeld in het vierde en vijfde lid, op een zodanige
      manier aangebracht dat het luchtvaartuig toch duidelijk herkenbaar is.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: '15.7'
    text: |-
      Met betrekking tot een luchtvaartuig, waarmee binnen het vluchtinformatiegebied Amsterdam testvluchten in het
      kader van onderhoud of demonstratievluchten worden uitgevoerd, dan wel dat luchtvaartuig voor overschilderen wordt
      overgebracht van een luchtvaartterrein binnen Nederland naar een ander luchtvaartterrein binnen Nederland, is het
      vierde lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel15
  - number: '16.1'
    text: De letters en cijfers van het nationaliteitskenmerk en het inschrijvingskenmerk zijn alle van gelijke hoogte.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel16
  - number: '16.2'
    text: De kenmerken op luchtschepen en ballonnen zijn ten minste 50 centimeter hoog.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel16
  - number: '16.3'
    text: De kenmerken op de vleugels zijn ten minste 50 centimeter hoog.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel16
  - number: '16.4'
    text: De kenmerken op de romp, staartvlakken en overeenkomstige delen zijn ten minste 30 centimeter hoog.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel16
  - number: '16.5'
    text: |-
      Indien het niet mogelijk is de kenmerken met de in het tweede, derde of vierde lid aangegeven hoogte aan te
      brengen, mogen de afmetingen van de kenmerken kleiner zijn, maar niet kleiner dan noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel16
  - number: '17.1'
    text: |-
      De letters zijn Romeins, zonder ornamenten en bij voorkeur volgens het model zoals in [bijlage 2][ref1] van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012878
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012878
  - number: '17.2'
    text: |-
      De cijfers zijn Arabisch, zonder ornamenten en bij voorkeur volgens het model zoals in [bijlage 2][ref1] van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012878
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012878
  - number: '17.3'
    text: |-
      De breedte van het koppelteken en van ieder cijfer of iedere letter, uitgezonderd de letter l en het cijfer 1, is
      twee derde van de hoogte, behalve indien het model overeenkomstig de bij deze regeling behorende [bijlage 2][ref1]
      wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012878
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012878
  - number: '17.4'
    text: |-
      De dikte van de lijnen, die strak moeten zijn, bedraagt een zesde van de hoogte van de cijfers of letters, behalve
      indien het model overeenkomstig de bij deze regeling behorende [bijlage 2][ref1] wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012878
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012878
  - number: '17.5'
    text: |-
      De afstand tussen de cijfers, letters en het koppelteken bedraagt ten minste een kwart van de breedte van de
      cijfers en letters.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel17
  - number: '17.6'
    text: De kleur van de kenmerken onderscheidt zich duidelijk van de ondergrond.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel17
  - number: '17.7'
    text: De kleur van de diverse karakters is zo veel mogelijk gelijk.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      In bijzondere gevallen kan de minister toestemming verlenen voor het voeren van andere kenmerken. Aan de
      toestemming kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd met die voorschriften
      of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien sprake is van een luchtvaartuig van historische waarde kunnen de nationaliteits- en inschrijvingskenmerken
      worden gevoerd op ten minste beide zijden van het luchtvaartuig met een hoogte van ten minste 5 centimeter, mits
      een uit historisch oogmerk ander kenmerk, dat is geaccepteerd door de minister, wordt gevoerd op de plaatsen en met
      de grootte, bedoeld in de [artikelen 15 tot en met 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012878#Artikel15
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012878
        artikel: '15'
        paragraaf: '9'
  - number: '18.3'
    text: |-
      Het aanbrengen van militaire kenmerken dan wel voormalige militaire kenmerken op luchtvaartuigen als bedoeld
      in het eerste lid is slechts toegestaan na het overleggen aan de minister van een schriftelijke instemming van
      de militaire luchtvaart autoriteit van het Ministerie van Defensie en, indien van toepassing, de betreffende
      buitenlandse militaire autoriteiten.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel18
  - number: '18.4'
    text: |-
      De houder van een luchtvaartuig waarop een kenmerk is aangebracht als bedoeld in het eerste lid stelt de minister
      zo spoedig mogelijk op de hoogte indien deze kenmerken zijn verwijderd.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      Luchtvaartuigen zijn voorzien van een identificatieplaat, waarin ten minste het nationaliteitskenmerk en het
      inschrijvingskenmerk zijn gegraveerd.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel19
  - number: '19.2'
    text: |-
      De identificatieplaat is gemaakt van vuurvast materiaal en is behoorlijk bevestigd op een goed zichtbare plaats,
      bij voorkeur en voor zover van toepassing bij de hoofdingang van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel19
  - number: '20'
    text: Deze regeling treedt in werking met ingang van 15 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling inschrijving Nederlandse burgerluchtvaartuigen.'
    url: https://wetten.overheid.nl/BWBR0012878/2024-01-01#Artikel21
