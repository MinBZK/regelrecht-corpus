        artikel: '2'
      - id: ref2
        bwb_id: BWBR0048458
        artikel: '3'
  - number: '5'
    text: |-
      Evidente staatloosheid kan tevens op niet-judiciële wijze worden vastgesteld, met toepassing van bij of krachtens
      algemene maatregel van bestuur te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister verstrekt aan de vreemdeling zonder rechtmatig verblijf in de zin van de
      [Vreemdelingenwet 2000][ref1] een identificatiedocument indien aan de volgende voorwaarden is voldaan:

      a. de vreemdeling is vastgesteld staatloos als bedoeld in [artikel 4][ref2] of [5][ref3];

      b. biometrische gegevens van de vreemdeling als bedoeld in [artikel 106a van de Vreemdelingenwet][ref4] zijn
      beschikbaar; en

      c. de vreemdeling heeft bij de indiening van zijn verzoek om verstrekking van een identificatiedocument de bij
      ministeriële regeling te bepalen leges voldaan.

      2 Onze Minister kan een model vaststellen voor het identificatiedocument.

      3 Bij ministeriële regeling kan worden voorzien in intrekking en vervanging van het identificatiedocument en in een
      verplichting tot het inleveren van het identificatiedocument.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0048458#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0048458#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel106a
    url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#Artikel6
