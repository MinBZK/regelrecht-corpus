  - number: '4'
    text: |-
      Aan een onherroepelijk geworden beschikking van de rechtbank, gegeven met toepassing van de [artikelen 2][ref1] en
      [3][ref2], is elk met de uitvoering van enige wettelijke regeling belast orgaan gebonden, zolang niet is gebleken
      dat de betrokkene ten aanzien van wie de beschikking is genomen een nationaliteit heeft verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0048458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048458#Artikel3
    url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#Artikel4
    references:
