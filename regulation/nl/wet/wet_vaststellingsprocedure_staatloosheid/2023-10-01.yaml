  - number: '9'
    text: |-
      De opneming van het gegeven dat een ingeschrevene geen nationaliteit bezit in de basisregistratie personen
      voorafgaande aan de inwerkingtreding van deze wet blijft in stand bij inwerkingtreding van deze wet en wordt
      beheerst door het materiële recht en procesrecht zoals dat gold voor inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#Artikel9
  - number: '10'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Wet vaststellingsprocedure staatloosheid.'
