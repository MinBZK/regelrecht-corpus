preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een vaststellingsprocedure staatloosheid in te stellen,
    gelet op het Verdrag betreffende de status van staatlozen en het Verdrag tot beperking der staatloosheid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de daarop rustende bepalingen wordt onder «Onze Minister» verstaan: Onze
      Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#Artikel1
  - number: '2'
    text: |-
      1 Een ieder die, buiten een bij enige rechterlijke instantie aanhangige zaak, daarbij onmiddellijk belang heeft
      en in Nederland zijn woonplaats of gewone verblijfplaats heeft, kan bij de rechtbank Den Haag een verzoek indienen
      tot vaststelling van zijn staatloosheid. Het verzoek kan ook strekken tot de vaststelling dat de betrokkene op een
      bepaald tijdstip staatloos was.

      2 De rechtbank stelt de staatloosheid van de verzoeker vast, indien hem niet is gebleken dat de verzoeker door
      enige staat, krachtens diens wetgeving, als onderdaan wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0048458/2023-10-01#Artikel2
  - number: '3'
    text: |-
      1 Omtrent verzoeken als bedoeld in [artikel 2][ref1] hoort de rechtbank de Staat. In afwijking van
      [artikel 79 van het Wetboek van Burgerlijke Rechtsvordering][ref2] kan de Staat zonder advocaat in rechte optreden.

      2 Indien de verzoeker tevens een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref3] heeft ingediend, is een verzoek als bedoeld in artikel 2
      niet-ontvankelijk zolang de beschikking van Onze Minister op die aanvraag nog niet onherroepelijk is.

      3 De rechtbank beslist binnen zes maanden na indiening van het verzoek. Hij kan deze termijn verlengen met nog eens
      zes maanden, indien hij dat noodzakelijk acht.

      4 Indien na de indiening van het verzoek een aanvraag voor een verblijfsvergunning voor bepaalde tijd als bedoeld
      in [artikel 28 van de Vreemdelingenwet 2000][ref4] wordt gedaan, houdt de rechtbank de behandeling van de zaak
      aan totdat de beschikking van Onze Minister op die aanvraag onherroepelijk is geworden. Het derde lid is niet van
      toepassing.

      5 Van de beschikking van de rechtbank staat uitsluitend beroep in cassatie open.


      [ref1]: https://wetten.overheid.nl/BWBR0048458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel28
