      1 Voor de beroepsopleidingen opgenomen in
      __REF000___________________________________________________________________________________________________________
      ___________________________, worden de eindtermen voor het studiejaar 2006–2007 vastgesteld overeenkomstig
      [bijlage 2 behorende bij die regeling][ref2].

      2 Per beroepsopleiding opgenomen in
      __REF000___________________________________________________________________________________________________________
      ___________________________, wordt overeenkomstig [bijlage 2 bij die regeling][ref4] vastgesteld:

      a. de onderverdeling in deelkwalificaties,

      b. de leerweg waarin de beroepsopleiding kan worden verzorgd,

      c. of de beroepsopleiding voor bekostiging in aanmerking komt,

      d. de prijsfactor, bedoeld in [artikel 2.2.3, derde lid, van het Uitvoeringsbesluit WEB][ref5].


