  - number: '2'
    text: |-
      1 Voor de beroepsopleidingen opgenomen in [bijlage 1][ref1] behorende bij deze regeling worden de eindtermen voor
      het studiejaar 2005–2006 vastgesteld overeenkomstig [bijlage 2][ref2] behorende bij deze regeling.

      2 In bijlage 1 wordt per beroepsopleiding vastgesteld:

      a. de leerweg waarin de beroepsopleiding kan worden verzorgd,

      b. of de beroepsopleiding voor bekostiging in aanmerking komt,

      c. de prijsfactor, bedoeld in [artikel 2.2.3, derde lid, van het Uitvoeringsbesluit WEB][ref3], en

      d. de hoogte van de studielast, bedoeld in [artikel 7.2.4, tweede lid onderdeel d, van de wet][ref4].


