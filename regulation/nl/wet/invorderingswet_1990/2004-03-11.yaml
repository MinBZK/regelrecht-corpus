  - number: '25.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling, mits
      voldoende zekerheid is gesteld, voor belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd
      door de toepassing van [artikel 3 116, vierde lid, van de Wet inkomstenbelasting 2001][ref1]. Het uitstel wordt
      beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.6.a
    text: |-
      indien zich een omstandigheid voordoet waardoor de woning ophoudt een eigen woning te zijn in de zin van
      [artikel 3 111 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.6.b
    text: |-
      indien de belastingschuldige een voordeel geniet als bedoeld in [artikel 3 116, eerste lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.6.c
    text: |-
      indien zich een omstandigheid voordoet als bedoeld in [artikel 3 116, derde lid, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25.7'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het verlenen van uitstel van
      betaling als bedoeld in artikel 224 van het Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.8'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van
      uitstel van betaling voor de duur van tien jaar, mits voldoende zekerheid is gesteld, voor
      belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd door de toepassing van
      [artikel 4.16, eerste lid, onderdeel e, van de Wet inkomstenbelasting 2001][ref1] indien de verkrijger
      een natuurlijk persoon is die niet in Nederland woont en de verkregen aandelen of winstbewijzen
      geen deel uitmaken van het vermogen van een voor zijn rekening gedreven Nederlandse onderneming
      als bedoeld in [artikel 7.2 van die wet][ref2] of behoren tot het resultaat uit een werkzaamheid in
      Nederland van hem, of door de toepassing van [artikel 4.16, eerste lid, onderdeel h][ref3], of van
      [artikel 7.5, vierde, vijfde of zevende lid, van die wet][ref4]. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
