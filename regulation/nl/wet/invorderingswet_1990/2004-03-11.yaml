        hoofdstuk: VI
        afdeling: '1'
  - number: '56.2'
    text: |-
      Ten aanzien van degene die een ingevolge [artikel 55][ref1] verschuldigd bedrag heeft voldaan, is het eerste lid
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel55
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '55'
        hoofdstuk: VI
        afdeling: '3'
  - number: '56.3'
    text: |-
      Degene die het ingevolge het eerste lid verschuldigde bedrag heeft voldaan, wordt geacht tot dit bedrag de
      belasting van de belastingschuldige ingevolge de [artikelen 33, eerste lid, onderdeel a][ref1], of [36][ref2] te
      hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel36
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '33'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
  - number: '56.4'
    text: Van het eerste, tweede en derde lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel56
  - number: '57'
    text: |-
      De aansprakelijke die in de belasting heeft bijgedragen, is bij zijn verhaal op de belastingschuldige of de mede-
      aansprakelijke uitsluitend gesubrogeerd in het voorrecht van ’s Rijks schatkist overeenkomstig [artikel 21][ref1].
      De eerste volzin is van overeenkomstige toepassing ten aanzien van de belastingschuldige en de aansprakelijke die
      in de belasting heeft bijgedragen indien [artikel 54][ref2] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel54
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '54'
        hoofdstuk: VI
        afdeling: '2'
  - number: '58'
    text: 'De belastingschuldige of een aansprakelijk gestelde is gehouden desgevraagd aan de ontvanger:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel58
  - number: 58.a
    text: de gegevens en inlichtingen te verstrekken welke voor de invordering te zijnen aanzien van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel58
  - number: 58.b
    text: |-
      de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan - zulks ter keuze van de ontvanger - waarvan
      de raadpleging van belang kan zijn voor de vaststelling van de feiten welke invloed kunnen uitoefenen op de
      invordering te zijnen aanzien, voor dit doel beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel58
  - number: '59.1'
    text: |-
      De in [artikel 58, onderdeel b][ref1], bedoelde verplichting geldt onverminderd voor een derde bij wie zich
      gegevensdragers bevinden van degene die gehouden is deze, of de inhoud daarvan, aan de ontvanger voor raadpleging
      beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
  - number: '59.2'
    text: |-
      De ontvanger stelt degene wiens gegevensdragers hij bij een derde voor raadpleging vordert, gelijktijdig hiervan
      in kennis.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel59
  - number: '60.1'
    text: |-
      De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze - zulks ter keuze van de ontvanger - en binnen een door de ontvanger te stellen
      redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel60
  - number: '60.2'
    text: |-
      Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel60
  - number: '61'
    text: |-
      Voor een weigering om te voldoen aan de in de [artikelen 58][ref1], [59][ref2] en [60][ref3] omschreven
      verplichtingen kan niemand zich met vrucht beroepen op de omstandigheid dat hij uit enigerlei hoofde tot
      geheimhouding verplicht is, zelfs niet indien deze hem bij een wettelijke bepaling is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel60
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '59'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '60'
        hoofdstuk: VII
  - number: '62.1'
    text: |-
      Met betrekking tot administratieplichtigen als bedoeld in
      [artikel 52 van de Algemene wet inzake rijksbelastingen][ref1], zijn de in de [artikelen 58][ref2], [59][ref3] en
      [60][ref4] geregelde verplichtingen van overeenkomstige toepassing ten behoeve van de invordering van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel60
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '59'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '60'
        hoofdstuk: VII
  - number: '62.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de personen en de lichamen als bedoeld in
      [artikel 55 van de Algemene wet inzake rijksbelastingen][ref1], voor zover het de in dat artikel bedoelde gegevens
      en inlichtingen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel55
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '55'
  - number: '62.3'
    text: |-
      [Artikel 55 van de Algemene wet inzake rijksbelastingen][ref1] is van toepassing met dien verstande dat voor
      inspecteur wordt gelezen ontvanger en voor belastingwet wordt gelezen Invorderingswet 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel55
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '55'
  - number: '63'
    text: |-
      Voor een weigering om te voldoen aan de verplichtingen ten behoeve van de invordering van derden kunnen alleen
      bekleders van een geestelijk ambt, notarissen, advocaten, procureurs, artsen en apothekers zich beroepen op de
      omstandigheid, dat zij uit hoofde van hun stand, ambt of beroep tot geheimhouding verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel63
  - number: 63a
    text: |-
      De verplichtingen welke volgens dit hoofdstuk bestaan jegens de ontvanger, gelden mede jegens iedere door Onze
      Minister aangewezen andere ambtenaar van de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel63a
  - number: '64.1'
    text: |-
      Degene die niet voldoet aan de verplichtingen hem bij [artikel 60, tweede lid][ref1], opgelegd, wordt gestraft met
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel60
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '60'
        hoofdstuk: VII
  - number: '64.2'
    text: 'Degene die ingevolge deze wet verplicht is tot:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel64
  - number: 64.2.a
    text: het verstrekken van inlichtingen of gegevens, en deze niet, onjuist of onvolledig verstrekt;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel64
  - number: 64.2.b
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze niet voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel64
  - number: 64.2.c
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze in valse of vervalste vorm voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel64
  - number: '65.1'
    text: |-
      Degene die opzettelijk een der feiten begaat, omschreven in [artikel 64, tweede lid, onderdeel a of b][ref1],
      wordt, indien het feit ertoe strekt dat te weinig belasting wordt ingevorderd, gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig ingevorderde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '64'
        hoofdstuk: VIII
  - number: '65.2'
    text: |-
      Degene die opzettelijk het feit begaat, omschreven in [artikel 64, tweede lid, onderdeel c][ref1], wordt, indien
      het feit ertoe strekt dat te weinig belasting wordt ingevorderd, gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de te
      weinig ingevorderde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '64'
        hoofdstuk: VIII
  - number: '65.3'
    text: |-
      Het recht tot strafvervolging op de voet van dit artikel vervalt, indien de schuldige alsnog juiste en volledige
      inlichtingen of gegevens verstrekt voordat hij weet of redelijkerwijs moet vermoeden dat een of meer van de
      in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde personen of een of meer ambtenaren van de
      rijksbelastingdienst de onjuistheid of onvolledigheid bekend is of bekend zal worden, mits het niet tijdig
      verstrekken van de gevraagde inlichtingen of gegevens niet van invloed is geweest op de verhaalsmogelijkheden met
      betrekking tot de belastingschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '65.4'
    text: |-
      Indien het feit, ter zake waarvan de verdachte kan worden vervolgd, zowel valt onder een van de strafbepalingen van
      het eerste of het tweede lid, als onder die van [artikel 225, tweede lid, van het Wetboek van Strafrecht][ref1], is
      strafvervolging op grond van genoemd artikel 225, tweede lid, uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
  - number: 65a
    text: |-
      De in deze wet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij deze
      wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel65a
  - number: '66'
    text: |-
      Hoofdstuk IX, afdeling 2 - met uitzondering van [artikel 72][ref1] - en [afdeling 3, van de Algemene wet inzake
      rijksbelastingen](onbekend) is van toepassing met betrekking tot de in [artikel 64][ref2] strafbaar gestelde
      feiten, met dien verstande dat voor belastingwet wordt gelezen Invorderingswet 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '72'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '64'
        hoofdstuk: VIII
  - number: '67.1'
    text: |-
      Het is een ieder verboden hetgeen hem in enige werkzaamheid bij de uitvoering van deze wet, of in verband daarmede,
      nopens de persoon of de zaken van een ander blijkt of medegedeeld wordt, verder bekend te maken dan nodig is voor
      de uitvoering van deze wet of voor de heffing van enige rijksbelasting.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel67
  - number: '67.2'
    text: Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel67
  - number: '68'
    text: |-
      De verzending en de betekening van de stukken betreffende de invordering van de rechten van successie, van overgang
      en van schenking kan plaatsvinden aan de ingevolge [artikel 43 van de Successiewet 1956][ref1] gekozen woonplaats
      dan wel aan de werkelijke woonplaats of plaats van vestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel43
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '43'
  - number: '69'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel69
  - number: '70'
    text: |-
      [Artikel 22, derde lid][ref1], vervalt op 1 januari 1993, tenzij voordien een wetsvoorstel, houdende een
      definitieve regeling omtrent het fiscaal bodemrecht bij de Tweede Kamer der Staten-Generaal is ingediend, dan wel
      een wetsvoorstel houdende een verlenging van de geldigheidsduur van voornoemde bepaling voor een tijd van niet
      langer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel22
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: '71'
    text: De inwerkingtreding van deze wet wordt nader bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel71
  - number: '72'
    text: Deze wet kan worden aangehaald als Invorderingswet 1990.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel72
