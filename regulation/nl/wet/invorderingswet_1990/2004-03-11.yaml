        bwb_id: BWBR0011353
        artikel: '7'
  - number: 25.8.a
    text: |-
      ingeval aandelen of winstbewijzen die aan het uitstel ten grondslag
      liggen, worden vervreemd in de zin van [artikel 4.12][ref1]
      of __REF001________________________________________________________________________________________________________
      _________. In geval van een vervreemding in de zin van
      [artikel 4.16, eerste lid, onderdelen d, e, f en g, van de Wet inkomstenbelasting 2001][ref3] kan het uitstel van
      betaling onder nader te stellen voorwaarden worden voortgezet;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 25.8.b
    text: |-
      ingeval de vennootschap waarin de aandelen of winstbewijzen worden gehouden, haar onderneming geheel of nagenoeg
      geheel heeft gestaakt en haar reserves geheel of nagenoeg geheel heeft uitgekeerd, dan wel, ingeval geen
      onderneming is gedreven, haar reserves geheel of nagenoeg geheel heeft uitgekeerd;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.8.c
    text: |-
      in geval van een teruggaaf van wat op aandelen of bewijzen van deelgerechtigdheid in een fonds voor gemene rekening
      is gestort dan wel van wat door houders van winstbewijzen is gestort of ingelegd.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.9'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor de
      duur van ten hoogste tien jaren, mits voldoende zekerheid is gesteld, voor belastingaanslagen voor zover daarin
      is begrepen inkomstenbelasting ter zake van de vervreemding van tot een aanmerkelijk belang behorende aandelen of
      winstbewijzen aan een natuurlijk persoon of rechtspersoon als bedoeld in de tweede volzin, indien die persoon de
      overdrachtsprijs is schuldig gebleven of de aandelen of winstbewijzen geschonken heeft gekregen, de bezittingen van
      de vennootschap waarop het aanmerkelijk belang betrekking heeft niet in belangrijke mate onmiddellijk of middellijk
      bestaan uit beleggingen en aandelen zijn vervreemd die ten minste vijf percent van het geplaatste kapitaal van de
      vennootschap uitmaken. Een vervreemding als bedoeld in de eerste volzin, is een vervreemding aan:
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.9.a
    text: kind, pleegkind of kleinkind, of hun partner;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.9.b
    text: de partner;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.9.c
    text: |-
      een in Nederland gevestigde en naar Nederlands recht opgerichte naamloze of besloten vennootschap met beperkte
      aansprakelijkheid waarvan alle aandelen worden gehouden door een persoon als bedoeld in onderdeel *a* of*b*.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.10'
    text: |-
      Voor de toepassing van het negende lid wordt het begrip vervreemding opgevat overeenkomstig [artikel 4.12][ref1] en
      [4.16, eerste lid, onderdelen a, b en c, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '25.11'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor
      de duur van vijf jaar voor belastingaanslagen betreffende de rechten van successie of schenking, bedoeld in
      [artikel 31a, derde lid, van de Successiewet 1956][ref1]. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel31a
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
