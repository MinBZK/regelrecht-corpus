  - number: '2.1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.a
    text: |-
      rijksbelastingen: belastingen welke van rijkswege door de rijksbelastingdienst
      worden geheven, alsmede rechten bij invoer en rechten bij uitvoer als bedoeld in
      [artikel 1, tweede lid, onderscheidenlijk derde lid, van de Douanewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '1'
  - number: 2.1.b
    text: |-
      heffingsrente en revisierente: de heffingsrente en de revisierente, bedoeld in
      [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VA
  - number: 2.1.c
    text: |-
      Communautair douanewetboek: [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen
      van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (*PbEG* L 302);
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.d
    text: |-
      toepassingsverordening Communautair douanewetboek: [verordening (EEG) nr. 2454/93](31993R2454) van de Commissie
      van de Europese Gemeenschappen van 2 juli 1993 houdende vaststelling van enkele bepalingen ter uitvoering van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen tot vaststelling van het
      communautair douanewetboek (*PbEG* L 253);
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.e
    text: |-
      compenserende rente: de compenserende rente, bedoeld in artikel 519 van de toepassingsverordening Communautair
      douanewetboek;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.f
    text: |-
      kosten van ambtelijke werkzaamheden: de kosten, bedoeld in [hoofdstuk 4, paragraaf 2, van de Douanewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007632
        paragraaf: '2'
  - number: 2.1.g
    text: |-
      bestuurlijke boeten: de verzuimboeten en de vergrijpboeten, bedoeld in
      [hoofdstuk VIIIA van de Algemene wet inzake rijksbelastingen][ref1], dan wel in enige andere wettelijke regeling
      betreffende de heffing van rijksbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VIIIA
  - number: 2.1.h
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.i
    text: 'directeur, inspecteur of ontvanger: de functionaris die als zodanig bij ministeriële regeling is aangewezen;'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.j
    text: 'belastingdeurwaarder: de door Onze Minister als zodanig aangewezen ambtenaar van de rijksbelastingdienst;'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.k
    text: 'belastingschuldige: degene te wiens naam de belastingaanslag is gesteld;'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.l
    text: |-
      werknemer, artiest, beroepssporter, buitenlands gezelschap, dienstbetrekking en inhoudingsplichtige: de werknemer,
      de artiest, de beroepssporter, het buitenlandse gezelschap, de dienstbetrekking en de inhoudingsplichtige in de zin
      van de [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 2.1.m
    text: |-
      belastingaanslag: de voorlopige aanslag, de aanslag, de uitnodiging tot betaling, de navorderingsaanslag en de
      naheffingsaanslag, alsmede de voorlopige conserverende aanslag, de conserverende aanslag en de conserverende
      navorderingsaanslag in de inkomstenbelasting, het recht van successie en het recht van schenking;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.1.n
    text: 'kind: eerstegraads bloedverwant en aanverwant in de neergaande lijn.'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: '2.2'
    text: 'Deze wet verstaat mede onder:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.2.a
    text: |-
      rijksbelastingen: de heffingsrente, de revisierente, de compenserende rente, de kosten van ambtelijke
      werkzaamheden, alsmede de bestuurlijke boeten;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.2.b
    text: |-
      wettelijke regeling betreffende de heffing van rijksbelastingen: de wettelijke bepalingen, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de Douanewet][ref1], voor zover deze betrekking hebben op de heffing van
      rijksbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '2'
  - number: 2.2.c
    text: |-
      belastingaanslag: een ingevolge de [Algemene wet inzake rijksbelastingen][ref1] of enige andere wettelijke regeling
      betreffende de heffing van rijksbelastingen vastgestelde beschikking of uitspraak strekkende tot - al dan niet
      nadere - vaststelling van een ingevolge die regelingen verschuldigd of terug te geven bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 2.2.d
    text: 'aanslagbiljet: de kennisgeving van de beschikking of de uitspraak, bedoeld in onderdeel c;'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.2.e
    text: 'invorderen van rijksbelastingen: het betalen van een terug te geven bedrag aan rijksbelastingen.'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van deze wet geldt, in afwijking in zoverre van het eerste en het tweede lid en behoudens voor
      zover daarvan moet worden afgeweken ingevolge het elders in deze wet bepaalde, als belastingaanslag:
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: 2.3.a
    text: |-
      de belastingaanslag na toepassing van de ingevolge de [Algemene wet inzake rijksbelastingen][ref1] of enige andere
      wettelijke regeling betreffende de heffing van rijksbelastingen voorziene verrekeningen;


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 2.3.b
    text: |-
      ingeval een aanslagbiljet naast een of meer belastingaanslagen als bedoeld in onderdeel a een of meer ingevolge het
      tweede lid, onderdeel c, met een belastingaanslag gelijkgestelde beschikkingen omvat: het gezamenlijke bedrag van
      de ingevolge de op het aanslagbiljet vermelde belastingaanslagen in te vorderen bedragen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: '2.4'
    text: |-
      Ingeval het derde lid, aanhef en onderdeel b, toepassing vindt, worden de op het aanslagbiljet vermelde
      bestanddelen - wat belasting betreft na de in het derde lid, onderdeel a, bedoelde verrekening - tot een negatief
      bedrag geacht naar evenredigheid te zijn verrekend met de bestanddelen tot een positief bedrag en omgekeerd.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: '2.5'
    text: |-
      Bepalingen van deze wet die rechtsgevolgen verbinden aan het aangaan, het bestaan, de beëindiging of het
      beëindigd zijn van een huwelijk zijn van overeenkomstige toepassing op het aangaan, het bestaan, de beëindiging
      onderscheidenlijk het beëindigd zijn van een geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel2
  - number: '3.1'
    text: De ontvanger is belast met de invordering van de rijksbelastingen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel3
  - number: '3.2'
    text: |-
      Naast de bevoegdheden die de ontvanger heeft ingevolge deze wet, beschikt hij ook over de bevoegdheden die een
      schuldeiser heeft op grond van enige andere wettelijke bepaling.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel3
  - number: '3.3'
    text: |-
      In alle rechtsgedingen voortvloeiende uit de uitoefening van zijn taak treedt de ontvanger als zodanig in rechte
      op.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het eerste lid kan Onze Minister van Landbouw, Natuurbeheer en Visserij bij ministeriële regeling
      de gevallen aanwijzen waarin de invordering van landbouwheffingen geschiedt door een ander dan de ontvanger.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel3
  - number: '4'
    text: |-
      Tot het verrichten van de bij of krachtens de wet aan een deurwaarder opgedragen werkzaamheden is, voor zover
      die werkzaamheden geschieden in opdracht van een ontvanger en betreffen de vervolgingen voor de invordering van
      rijksbelastingen, uitsluitend een belastingdeurwaarder bevoegd.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel4
  - number: '5.1'
    text: |-
      De bevoegdheid van een directeur, inspecteur of ontvanger is niet bepaald naar een geografische indeling van
      Nederland.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de functionaris, bedoeld in
      [artikel 2, eerste lid, onderdeel i][ref1], onder wie een belastingschuldige ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
  - number: '6.1'
    text: |-
      De bepalingen van deze wet strekken zich niet alleen uit tot de rijksbelastingen, maar ook tot de opcenten, de
      betalingskorting, de renten en de kosten.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel6
  - number: '6.2'
    text: |-
      Onder opcenten worden verstaan niet alleen die welke ten behoeve van het Rijk, doch ook die welke ten behoeve van
      andere openbare lichamen worden geheven.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel6
  - number: '7.1'
    text: 'De toerekening van de betalingen geschiedt achtereenvolgens aan:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel7
  - number: 7.1.a
    text: de kosten;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel7
  - number: 7.1.b
    text: de betalingskorting;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel7
  - number: 7.1.c
    text: de rente;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel7
  - number: 7.1.d
    text: de belastingaanslag.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel7
  - number: '7.2'
    text: |-
      Toerekening van betalingen op een belastingaanslag geschiedt, behoudens voorzover daarvan moet
      worden afgeweken ingevolge het elders in deze wet bepaalde, naar evenredigheid aan de belasting,
      aan de heffingsrente, aan de revisierente, aan de compenserende rente, aan de kosten van
      ambtelijke werkzaamheden, aan de bestuurlijke boeten, aan de toeslagen en aan de opcenten, met
      dien verstande dat indien [artikel 9.1, derde lid, van de Wet inkomstenbelasting 2001][ref1] of
      [artikel 27, tweede lid, van de Wet op de loonbelasting 1964][ref2] toepassing heeft gevonden, de toerekening in de
      eerste plaats geschiedt aan de belasting en vervolgens aan de premie volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel27
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '27'
  - number: '7.3'
    text: De ontvanger is verplicht voor iedere contante betaling een kwitantie af te geven.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel7
  - number: '8.1'
    text: |-
      De ontvanger maakt de belastingaanslag bekend door toezending of uitreiking van het door de inspecteur voor
      de belastingschuldige opgemaakte aanslagbiljet, met dien verstande dat een uitnodiging tot betaling, door de
      inspecteur vastgesteld in de vorm van een elektronisch bericht, door de ontvanger langs elektronische weg aan de
      belastingschuldige wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel8
  - number: '8.2'
    text: Een belastingaanslag is door de belastingschuldige in zijn geheel verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel8
  - number: '9.1'
    text: Een belastingaanslag is invorderbaar twee maanden na de dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid is een navorderingsaanslag, alsmede een conserverende navorderingsaanslag
      invorderbaar één maand na de dagtekening van het aanslagbiljet en een naheffingsaanslag invorderbaar veertien dagen
      na de dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: '9.3'
    text: |-
      Een ingevolge [artikel 2, tweede lid, onderdeel c][ref1], met een belastingaanslag gelijkgestelde beschikking
      inzake een bestuurlijke boete die gelijktijdig en in verband met de vaststelling van een belastingaanslag als
      bedoeld in [artikel 2, eerste lid, onderdeel m][ref2], is opgelegd, is invorderbaar overeenkomstig de bepalingen
      die gelden voor die belastingaanslag. Een ingevolge [artikel 2, tweede lid, onderdeel c][ref3], met een
      belastingaanslag gelijkgestelde beschikking inzake heffings- of revisierente is invorderbaar overeenkomstig de
      bepalingen die gelden voor de belastingaanslag, bedoeld in [artikel 2, eerste lid, onderdeel m][ref4], waarop de
      heffings- of revisierente betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
  - number: '9.4'
    text: |-
      Een uitnodiging tot betaling, alsmede een ingevolge [artikel 2, tweede lid, onderdeel c][ref1], met een
      belastingaanslag gelijkgestelde beschikking inzake compenserende rente, inzake kosten van ambtelijke werkzaamheden
      of inzake een bestuurlijke boete als bedoeld in [hoofdstuk 5 van de Douanewet][ref2], is invorderbaar tien dagen na
      de dagtekening van het aanslagbiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007632
        hoofdstuk: '5'
  - number: '9.5'
    text: |-
      In afwijking van het eerste lid is een voorlopige aanslag in de inkomstenbelasting of in de vennootschapsbelasting
      en een voorlopige conserverende aanslag in de inkomstenbelasting, waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld, invorderbaar in zoveel gelijke termijnen als er na de maand,
      die in de dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn
      vervalt één maand na de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand later.
      Indien de toepassing van de eerste volzin niet leidt tot meer dan twee maandelijkse termijnen, vindt het eerste
      lid toepassing.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: '9.6'
    text: |-
      In afwijking van het eerste en het vijfde lid is een belastingaanslag als bedoeld in het vijfde lid, die een uit
      te betalen bedrag behelst, invorderbaar in zoveel gelijke termijnen als er met inbegrip van de maand die in de
      dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn vervalt aan
      het eind van de maand van de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand
      later.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: '9.7'
    text: |-
      In afwijking van het eerste lid is een voorlopige aanslag waarvan het aanslagbiljet een dagtekening heeft die ligt
      voor het jaar waarover deze is vastgesteld, invorderbaar in zoveel gelijke termijnen als er maanden van het jaar
      zijn. De eerste termijn vervalt aan het eind van de eerste maand van het jaar waarover de voorlopige aanslag is
      vastgesteld en elk van de volgende termijnen telkens een maand later.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: '9.8'
    text: 'In afwijking van het tweede lid is terstond invorderbaar een naheffingsaanslag ter zake van:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: 9.8.a
    text: |-
      de belasting van personenauto’s en motorrijwielen, die is opgelegd aan een ander dan een vergunninghouder als
      bedoeld in [artikel 8 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel8
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '8'
  - number: 9.8.b
    text: |-
      de belasting zware motorrijtuigen, die is opgelegd aan de houder van een ander motorrijtuig dan bedoeld in
      [artikel 6, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel6
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '6'
  - number: '9.9'
    text: |-
      In afwijking van het vierde lid is een uitnodiging tot betaling die is vastgesteld overeenkomstig een op een
      kalendermaand betrekking hebbende, aanvullende aangifte als bedoeld in artikel 76, tweede lid, van het Communautair
      douanewetboek invorderbaar vijftien dagen na de maand waarover de aangifte is gedaan. In afwijking in zoverre van
      de eerste volzin is de uitnodiging tot betaling ter zake van de aangifte over de maand februari invorderbaar na
      zestien maart.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: '9.10'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de in de voorgaande leden gestelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '9.11'
    text: |-
      De verplichting tot betaling wordt niet geschorst door de indiening van een bezwaar- of beroepschrift inzake een
      belastingaanslag.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 9][ref1] is een belastingaanslag van de belastingschuldige die een te innen bedrag
      behelst terstond en tot het volle bedrag invorderbaar indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: 10.1.a
    text: |-
      de belastingschuldige in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard en die belastingaanslag onder de werking van de
      schuldsaneringsregeling valt;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
  - number: 10.1.b
    text: |-
      de ontvanger aannemelijk maakt dat gegronde vrees bestaat dat goederen van de belastingschuldige zullen worden
      verduisterd;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
  - number: 10.1.c
    text: |-
      de belastingschuldige Nederland metterwoon wil verlaten dan wel zijn plaats van vestiging wil overbrengen naar een
      plaats buiten Nederland, tenzij hij aannemelijk maakt dat de belastingschuld kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
  - number: 10.1.d
    text: |-
      de belastingschuldige buiten Nederland woont of gevestigd is dan wel in Nederland geen vaste woonplaats of plaats
      van vestiging heeft en de ontvanger aannemelijk maakt dat gegronde vrees bestaat dat de belastingschuld niet kan
      worden verhaald;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
  - number: 10.1.e
    text: |-
      op goederen waarop een belastingschuld van de belastingschuldige kan worden verhaald beslag is gelegd voor zijn
      belastingschuld;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
  - number: 10.1.f
    text: goederen van de belastingschuldige worden verkocht ten gevolge van een beslaglegging namens derden;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
  - number: 10.1.g
    text: |-
      ten laste van de belastingschuldige een vordering wordt gedaan als bedoeld in [artikel 19][ref1], tenzij hij
      aannemelijk maakt dat de belastingschuld kan worden verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
        hoofdstuk: III
  - number: 10.1.h
    text: |-
      met inachtneming van artikel 198 van het Communautair douanewetboek ten laste van de belastingschuldige aanvulling
      of vervanging van een gestelde zekerheid is geëist, doch die aanvulling of vervanging niet tijdig overeenkomstig
      [artikel 56 van de Douanewet][ref1] wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel56
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '56'
  - number: '10.2'
    text: |-
      Het eerste lid is in de gevallen bedoeld in de onderdelen *a*, *e*,*f* en *g* niet van toepassing op een voorlopige
      aanslag in de inkomstenbelasting of in de vennootschapsbelasting waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
  - number: '10.3'
    text: |-
      Het eerste lid is in het geval, bedoeld in onderdeel h, uitsluitend van toepassing op een uitnodiging tot betaling
      en op een ingevolge [artikel 2, tweede lid, onderdeel c][ref1], met een belastingaanslag gelijkgestelde beschikking
      inzake compenserende rente, inzake kosten van ambtelijke werkzaamheden of inzake een bestuurlijke boete als bedoeld
      in [hoofdstuk 5 van de Douanewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007632
        hoofdstuk: '5'
  - number: '11'
    text: |-
      Indien de belastingschuldige een belastingaanslag niet binnen de gestelde termijn betaalt, maant de ontvanger hem
      schriftelijk aan om alsnog binnen tien dagen na de dagtekening van de aanmaning te betalen, onder kennisgeving dat
      de belastingschuldige anders door de middelen bij de wet bepaald tot betaling zal worden gedwongen. De aanmaning
      kan betrekking hebben op verschillende belastingaanslagen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel11
  - number: '12'
    text: |-
      Indien de belastingschuldige na de aanmaning in gebreke blijft, kan de invordering van de belastingaanslag
      geschieden bij een door de ontvanger uit te vaardigen dwangbevel. Het dwangbevel kan betrekking hebben op
      verschillende belastingaanslagen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel12
  - number: '13.1'
    text: |-
      De betekening van het dwangbevel geschiedt overeenkomstig de regels van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] met betrekking tot de betekening van exploten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '13.2'
    text: |-
      Indien de betekening geschiedt overeenkomstig [artikel 47 van het Wetboek van Burgerlijke Rechtsvordering][ref1],
      vermeldt de envelop, in afwijking van de tweede volzin van het tweede lid van dat artikel, in plaats van de naam,
      de hoedanigheid, het kantooradres en telefoonnummer van de deurwaarder, welke ontvanger de opdracht tot betekening
      heeft verstrekt, alsmede diens kantooradres en telefoonnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '2'
  - number: '13.3'
    text: |-
      De betekening van het dwangbevel met het bevel tot betaling kan ook geschieden door het ter post bezorgen van een
      voor de belastingschuldige bestemd afschrift van het dwangbevel met bevel tot betaling door de ontvanger. Indien
      het dwangbevel ten uitvoer wordt gelegd als bedoeld in [artikel 14][ref1], wordt het bevel tot betaling geacht te
      zijn betekend door de belastingdeurwaarder die belast is met de tenuitvoerlegging. Uit de ongeopende envelop waarin
      het afschrift ter post wordt bezorgd, blijkt naast de naam en het adres van de belastingschuldige, het kantooradres
      en telefoonnummer van de ontvanger, alsmede een aanduiding dat de inhoud de onmiddellijke aandacht behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
  - number: '13.4'
    text: 'Betekening op de voet van het derde lid is niet mogelijk ingeval:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel13
  - number: 13.4.a
    text: de ontvanger is gebleken dat de aanmaning de belastingschuldige niet heeft bereikt, of
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel13
  - number: 13.4.b
    text: |-
      de invordering geschiedt met toepassing van [artikel 15, eerste lid, aanhef en onderdeel a of onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel15
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '15'
        hoofdstuk: III
  - number: '13.5'
    text: |-
      Voor de toepassing van de [artikelen 14][ref1], [19][ref2] en [20][ref3] wordt het dwangbevel met bevel tot
      betaling dat op de voet van het derde lid is betekend, geacht te zijn betekend twee dagen na de datum van de
      terpostbezorging van het dwangbevel met bevel tot betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel20
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '19'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '20'
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '14.2'
    text: |-
      Tenuitvoerlegging op grond van het [Wetboek van Burgerlijke Rechtsvordering][ref1] van een dwangbevel, dat
      op de voet van [artikel 13, derde lid][ref2], is betekend, geschiedt niet dan na betekening van een hernieuwd
      bevel tot betaling. De betekening van het hernieuwd bevel tot betaling geschiedt overeenkomstig de regels van
      het [Wetboek van Burgerlijke Rechtsvordering][ref3] met betrekking tot de betekening van exploten, met dien
      verstande dat indien de betekening geschiedt overeenkomstig [artikel 47 van die wet][ref4] het exploot van de
      belastingdeurwaarder een bevel inhoudt om binnen twee dagen te betalen; [artikel 13, tweede li][ref5]d, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0001827
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel13
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001827
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '47'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
  - number: '14.3'
    text: |-
      Het tweede lid vindt geen toepassing ingeval het dwangbevel met toepassing van
      [artikel 15, eerste lid, aanhef en onderdeel c][ref1], terstond ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel15
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '15'
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Met betrekking tot een naheffingsaanslag als bedoeld in [artikel 9, achtste lid][ref1], en in de gevallen bedoeld
      in [artikel 10][ref2] kan:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel10
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '10'
        hoofdstuk: II
  - number: 15.1.a
    text: |-
      een dwangbevel zonder voorafgaande aanmaning worden uitgevaardigd, of indien reeds een aanmaning is verzonden, in
      afwijking van de daarbij gestelde betalingstermijn, terstond worden uitgevaardigd;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel15
  - number: 15.1.b
    text: een dwangbevel terstond na het bevel tot betaling ten uitvoer worden gelegd;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel15
  - number: 15.1.c
    text: |-
      een dwangbevel indien het bevel tot betaling reeds is gedaan, in afwijking van de daarbij gestelde
      betalingstermijn, terstond ten uitvoer worden gelegd;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel15
  - number: 15.1.d
    text: |-
      een dwangbevel indien het hernieuwd bevel tot betaling, bedoeld in [artikel 14, tweede lid,][ref1] reeds is gedaan,
      in afwijking van de daarbij gestelde betalingstermijn, terstond ten uitvoer worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
  - number: '15.2'
    text: |-
      Met betrekking tot een naheffingsaanslag als bedoeld in [artikel 9, achtste lid][ref1],
      kan, ingeval een dwangbevel terstond na het opleggen van die aanslag wordt
      uitgevaardigd, de betekening en de tenuitvoerlegging van dat dwangbevel, in afwijking van
      [artikel 64, eerste lid en tweede lid, eerste volzin, van het Wetboek van Burgerlijke Rechtsvordering][ref2],
      geschieden op alle dagen en uren.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '64'
  - number: '16'
    text: |-
      Indien een dwangbevel dat is uitgevaardigd voor een gedeelte van een belastingaanslag ten uitvoer wordt gelegd
      door beslaglegging, kunnen bij datzelfde dwangbevel alle tot het tijdstip van beslaglegging vervallen termijnen
      van de belastingaanslag worden ingevorderd, mits het op dat tijdstip invorderbare bedrag uit het dwangbevel is op
      te maken.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel16
  - number: '17.1'
    text: |-
      De belastingschuldige kan tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de rechtbank van het
      arrondissement waarbinnen hij woont of is gevestigd. Indien de belastingschuldige buiten Nederland woont of is
      gevestigd dan wel in Nederland geen vaste woonplaats of plaats van vestiging heeft, kan hij in verzet komen bij
      de rechtbank van het arrondissement waarbinnen het kantoor is gevestigd van de ontvanger die het dwangbevel heeft
      uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel17
  - number: '17.2'
    text: |-
      Het verzet vangt aan met dagvaarding door de belastingschuldige als eiser aan de ontvanger die het dwangbevel heeft
      uitgevaardigd als gedaagde. Het verzet schorst de tenuitvoerlegging van het dwangbevel voor zover deze door het
      verzet wordt bestreden.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel17
  - number: '17.3'
    text: |-
      Het verzet kan niet zijn gegrond op de stelling dat het aanslagbiljet, de aanmaning of het op de voet van
      [artikel 13, derde lid][ref1], betekende dwangbevel niet is ontvangen. Bovendien kan het verzet niet zijn gegrond
      op de stelling dat de belastingaanslag ten onrechte of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel13
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
  - number: '19.1'
    text: 'Een derde die:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: 19.1.a
    text: loon;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: 19.1.b
    text: uitkeringen op grond van sociale zekerheidswetten, uitgezonderd kinderbijslag onder welke benaming ook;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: 19.1.c
    text: pensioen en lijfrente;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: 19.1.d
    text: uitkeringen uit levens-, invaliditeits-, ongevallen- of ziekengeldverzekering;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: 19.1.e
    text: |-
      uitkeringen tot levensonderhoud, verschuldigd krachtens [boek 1 van het Burgerlijk Wetboek][ref1], of tot
      vergoeding van schade door het derven van levensonderhoud;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 19.1.f
    text: |-
      uitkeringen of buitengewone pensioenen op grond van een wettelijke regeling voor oorlogsgetroffenen of voor degenen
      die hun vervangende dienstplicht vervullen;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: '19.2'
    text: |-
      Een huurder, een pachter, een curator in een faillissement en een houder van penningen is op vordering van
      de ontvanger verplicht uit de gelden die hij aan de belastingschuldige verschuldigd is of uit de gelden of
      de penningen die hij ten behoeve van de belastingschuldige onder zich heeft, de belastingaanslagen van de
      belastingschuldige te betalen. Een curator in een faillissement van de belastingschuldige is voorts bevoegd uit
      eigen beweging uit de gelden die hij ten behoeve van de belastingschuldige onder zich heeft, de belastingaanslagen
      van de belastingschuldige te betalen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: '19.3'
    text: |-
      De vordering geschiedt bij beschikking. Voor het doen van een vordering dient de ontvanger te beschikken over een
      aan de belastingschuldige betekend dwangbevel met bevel tot betaling. Indien de vordering op de voet van het eerste
      lid, onderdeel a, wordt gedaan (loonvordering) en het dwangbevel op de voet van [artikel 13, derde lid][ref1],
      is betekend, moet de vordering vooraf worden gegaan door een schriftelijke aankondiging van de ontvanger aan
      de belastingschuldige, inhoudende dat hij voornemens is een loonvordering te doen. De loonvordering wordt in
      dat geval niet eerder gedaan dan zeven dagen na de dagtekening van de vooraankondiging. De in de derde volzin
      bedoelde aankondiging blijft achterwege indien de vordering wordt gedaan jegens degene die reeds op vordering
      van de ontvanger een belastingaanslag van de belastingschuldige betaalt of zou moeten betalen. De beschikking
      heeft rechtsgevolg zodra zij is bekendgemaakt aan degene jegens wie de vordering is gedaan. De ontvanger maakt
      de beschikking tevens bekend aan de belastingschuldige. Indien de vordering wordt gedaan jegens de curator
      in een faillissement vindt de tweede volzin geen toepassing en blijft bekendmaking van de beschikking aan de
      belastingschuldige achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel13
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
  - number: '19.4'
    text: |-
      De belastingschuldige kan op de voet van [artikel 17][ref1] in verzet komen tegen de vordering als ware deze de
      tenuitvoerlegging van een dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
        hoofdstuk: III
  - number: '19.5'
    text: |-
      Degene jegens wie een vordering is gedaan is verplicht aan die vordering te voldoen zonder daartoe een verificatie
      en beëdiging van schuldvordering, een rangregeling of rechterlijke uitspraak te mogen afwachten. De eerste volzin
      vindt geen toepassing in zoverre onder hem beslag is gelegd of verzet is gedaan ter zake van schulden waaraan
      voorrang boven vorderingen wegens rijksbelastingen is toegekend. Voldoening aan de vordering geldt als betaling aan
      de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: '19.6'
    text: |-
      De ontvanger vervolgt degene die in gebreke blijft aan de vordering te voldoen bij executoriaal beslag volgens de
      regels van het [tweede boek, tweede titel, tweede afdeling, van het Wetboek van Burgerlijke Rechtsvordering][ref1].
      De kosten van vervolging komen voor rekening van degene die in gebreke blijft zonder dat hij deze kan verhalen op
      de belastingschuldige.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingTweede
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Tweede
  - number: '19.7'
    text: |-
      Het eerste tot en met zesde lid zijn niet van toepassing op belastingaanslagen ten aanzien waarvan de
      schuldsaneringsregeling natuurlijke personen werkt.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel19
  - number: '20.1'
    text: |-
      Een dwangbevel kan bij rechterlijk vonnis ten uitvoer worden gelegd door lijfsdwang overeenkomstig de
      [artikelen 585 tot en met 600 van het Wetboek van Burgerlijke Rechtsvordering][ref1]. Het geding daartoe wordt
      gevoerd voor de rechtbank van het arrondissement waarbinnen het kantoor is gevestigd van de ontvanger die het
      dwangbevel heeft uitgevaardigd. Voor de toepassing van [artikel 585, onder a][ref2], treedt voor de aldaar bedoelde
      vonnissen en beschikkingen in de plaats het dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel585
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel585
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '585'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '585'
  - number: '20.2'
    text: |-
      Met betrekking tot belastingaanslagen die zijn verschuldigd door lichamen in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1], kan lijfsdwang worden toegepast ten aanzien van bestuurders of
      vereffenaars van die lichamen of, bij ontstentenis, ten aanzien van de laatst afgetreden of ontslagen bestuurders
      of vereffenaars, tenzij het niet aan hen te wijten is dat de belasting niet is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '21.1'
    text: ’s Rijks schatkist heeft een voorrecht op alle goederen van de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel21
  - number: '21.2'
    text: |-
      Het voorrecht gaat boven alle andere voorrechten met uitzondering van die van de [artikelen 287][ref1] en
      [288 onder a][ref2], alsmede dat van [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref3] voor zover de
      kosten zijn gemaakt na de dagtekening van het aanslagbiljet. Het voorrecht gaat tevens boven pand, voor zover
      het pandrecht rust op een zaak als is bedoeld in [artikel 22, derde lid][ref4], die zich op de bodem van de
      belastingschuldige bevindt en tegen inbeslagneming waarvan derden zich op die grond niet kunnen verzetten. Het
      behoudt deze rang in geval van faillissement van de belastingschuldige of toepassing ten aanzien van hem van de
      schuldsaneringsregeling natuurlijke personen, ongeacht of tevoren inbeslagneming heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel284
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel22
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '284'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: '22.1'
    text: |-
      Derden die geheel of gedeeltelijk recht menen te hebben op roerende zaken waarop ter zake van een belastingschuld
      beslag is gelegd, kunnen een beroepschrift richten tot de directeur, mits zulks doende vóór de verkoop en uiterlijk
      binnen zeven dagen, te rekenen van de dag der beslaglegging. Het beroepschrift wordt ingediend bij de ontvanger,
      tegen een door deze af te geven ontvangbewijs. De directeur neemt zo spoedig mogelijk een beslissing. De verkoop
      mag niet plaats hebben, dan acht dagen na de betekening van die beslissing aan de reclamant en aan degene tegen wie
      het beslag is gelegd, met nadere bepaling van de dag van verkoop.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: '22.2'
    text: |-
      Door het indienen van een beroepschrift op de voet van het eerste lid, verliest de belanghebbende niet het recht om
      zijn verzet voor de burgerlijke rechter te brengen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: '22.3'
    text: |-
      Behoudens in het geval dat er een recht van terugvordering bestaat jegens degene die een zaak onrechtmatig of van
      een onbevoegde heeft verkregen, kunnen derden echter nimmer verzet in rechte doen tegen de beslaglegging ter zake
      van naheffingsaanslagen in:
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22.3.a
    text: |-
      de loonbelasting ten laste van inhoudingsplichtigen met uitzondering van naheffingsaanslagen ter zake van
      huispersoneel;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22.3.b
    text: |-
      de omzetbelasting, alsmede de belasting van personenauto’s en motorrijwielen ten laste van een ander dan degene op
      wiens naam het kenteken is gesteld;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22.3.c
    text: de accijns;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22.3.d
    text: de verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22.3.e
    text: |-
      de in [artikel 1 van de Wet belastingen op milieugrondslag][ref1] genoemde belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
  - number: 22.3.f
    text: de dividendbelasting;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22.3.g
    text: de kansspelbelasting ten laste van inhoudingsplichtigen; en
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22.3.h
    text: de assurantiebelasting,
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22
  - number: 22a.1
    text: |-
      Dit artikel is van toepassing op naheffingsaanslagen in de motorrijtuigenbelasting welke zijn vastgesteld op
      de voet van [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet op de motorrijtuigenbelasting 1994][ref1]
      ten name van degene op wiens naam het voor het motorrijtuig opgegeven kenteken is gesteld, alsmede op de met die
      naheffingsaanslagen verband houdende kosten, renten en bestuurlijke boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel7
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '7'
  - number: 22a.2
    text: |-
      Voor de in het eerste lid bedoelde vorderingen kan door de ontvanger verhaal worden genomen op elk motorrijtuig
      waarvan het opgegeven kenteken ten name van de in het eerste lid bedoelde natuurlijke persoon of rechtspersoon is
      gesteld, zonder dat enig ander enig recht op deze motorrijtuigen kan tegenwerpen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22a
  - number: 22a.3
    text: |-
      Uitwinning van motorrijtuigen als bedoeld in het tweede lid is niet mogelijk voorzover degene die enig recht op een
      dergelijk motorrijtuig heeft goederen van degene op wiens naam het voor die motorrijtuigen opgegeven kenteken is
      gesteld, aanwijst die voor de in het eerste lid bedoelde vorderingen voldoende verhaal bieden.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22a
  - number: 22a.4
    text: |-
      De in [artikel 78 van de Wet op de motorrijtuigenbelasting 1994][ref1] bedoelde ambtenaren zijn bevoegd de hen in
      de [artikelen 78][ref2] en [79 van die wet][ref3] toegekende bevoegdheden mede uit te oefenen ten behoeve van de
      toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel79
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '79'
  - number: '23'
    text: |-
      De ontvanger kan de belastingaanslagen in de inkomstenbelasting, voorzover zij betrekking hebben op goederen,
      verkregen onder de ontbindende voorwaarde van overlijden waarbij zich een opschortende voorwaarde ten gunste
      van een verwachter aansluit, op goederen waarvan de belastingschuldige het wettelijk vruchtgenot heeft, dan
      wel op goederen die de belastingschuldige ter beschikking staan krachtens een genotsrecht als bedoeld in
      [artikel 5.22, derde lid, van de Wet inkomstenbelasting 2001][ref1], op die goederen verhalen als waren zij niet
      met die rechten bezwaard, een en ander voorzover deze goederen bestanddelen vormen van de rendementsgrondslag,
      bedoeld in [artikel 5.3 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '24.1'
    text: |-
      Met betrekking tot rijksbelastingen en andere belastingen en heffingen voor zover
      de invordering daarvan aan de ontvanger is opgedragen, is verrekening op de voet van
      [afdeling 12 van Titel 1 van Boek 6 van het Burgerlijk Wetboek][ref1] niet mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling12
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '12'
  - number: '24.2'
    text: |-
      De ontvanger is ten aanzien van de belastingschuldige bevoegd aan hem uit te betalen en van hem te innen
      bedragen ter zake van de in het eerste lid bedoelde rijksbelastingen en andere belastingen en heffingen met
      elkaar te verrekenen. Met betrekking tot door de ontvanger uit te betalen en te innen bedragen aan belasting
      welker verschuldigdheid materieel is ontstaan over dan wel in een tijdvak waarin de belastingschuldige
      deel uitmaakt of uitmaakte van een fiscale eenheid als bedoeld in [artikel 15, eerste lid][ref1], of
      [artikel 15a, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref2], kunnen aan die belastingschuldige
      uit te betalen bedragen, behalve met van deze te innen bedragen, worden verrekend met te innen bedragen van een
      andere maatschappij die in dat tijdvak deel uitmaakt of uitmaakte van vorenbedoelde fiscale eenheid. De vorige
      volzin vindt toepassing, voor zoveel nodig in afwijking van hetgeen voortvloeit uit het eerste lid, ongeacht het
      in staat van surseance van betaling of van faillissement geraken van de in die volzin bedoelde belastingschuldige
      of andere maatschappij. Op verzoek van de belastingschuldige is de ontvanger verplicht te verrekenen. Als tijdstip
      van verrekening geldt de dagtekening van het aanslagbiljet waaruit van het uit te betalen bedrag blijkt. In
      afwijking van de vorige volzin geldt met betrekking tot een verrekening van een termijn van een voorlopige aanslag
      als bedoeld in [artikel 9, zesde en zevende lid][ref3], als tijdstip van verrekening het tijdstip waarop de
      desbetreffende termijn vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15a
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: '24.3'
    text: |-
      De verrekening is ook mogelijk ingeval de termijn, bedoeld in [artikel 9][ref1], nog niet is verstreken, met
      dien verstande dat indien het betreft belastingaanslagen als bedoeld in [artikel 9, vijfde en zevende lid][ref2],
      verrekening alleen mogelijk is met belastingaanslagen die op dezelfde belasting en hetzelfde tijdvak betrekking
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: '24.4'
    text: |-
      De ontvanger verrekent de in [artikel 27][ref1], bedoelde betalingskorting met het bedrag van de belastingaanslag
      ter zake waarvan de betalingskorting wordt verleend. Voorts verrekent de ontvanger de in [artikel 27][ref2],
      bedoelde betalingskorting met het uit te betalen bedrag van de vermindering van de belastingaanslag ter zake
      waarvan de betalingskorting is verleend. Op de in dit lid bedoelde verrekeningen zijn het tweede en derde lid niet
      van toepassing. Als tijdstip van verrekening geldt het tijdstip waarop de betalingskorting wordt verleend of de
      dagtekening van de kennisgeving waarmee de vermindering wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
  - number: '24.5'
    text: |-
      De verrekening is niet mogelijk met betrekking tot een belastingaanslag die een uit te betalen bedrag
      behelst indien deze vordering door de belastingschuldige onder bijzondere titel is overgedragen, mits de
      ontvanger met de overdracht heeft ingestemd. Verrekening is voorts niet mogelijk met betrekking tot een
      belastingaanslag die een uit te betalen bedrag behelst indien op deze vordering een pandrecht als bedoeld
      in [artikel 239 van Boek 3 van het Burgerlijk Wetboek][ref1] is gevestigd, mits de ontvanger op het tijdstip
      waarop het pandrecht hem wordt medegedeeld met het pandrecht heeft ingestemd. De ontvanger is verplicht bij
      beschikking met de overdracht of het pandrecht in te stemmen indien op het tijdstip van de mededeling van de
      akte van overdracht of van het pandrecht ten name van de belastingschuldige geen voor verrekening vatbare schuld
      invorderbaar is. De ontvanger kan bij beschikking instemming met de overdracht of het pandrecht weigeren. De
      ontvanger maakt de beschikking bekend door middel van een gedagtekende kennisgeving waarin, bij weigering tot
      instemming met de overdracht of het pandrecht, de grond is vermeld waarop de weigering berust.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel239
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '239'
  - number: '24.6'
    text: 'In afwijking in zoverre van het vijfde lid is ook na de instemming, bedoeld in dat lid, verrekening mogelijk van:'
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
  - number: 24.6.a
    text: |-
      de in [artikel 27][ref1], bedoelde betalingskorting met het bedrag van de belastingaanslag ter zake waarvan de
      betalingskorting wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
  - number: 24.6.b
    text: |-
      de in [artikel 27][ref1], bedoelde betalingskorting met het uit te betalen bedrag van de vermindering van de
      belastingaanslag ter zake waarvan de betalingskorting is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
  - number: 24.6.c
    text: |-
      belastingaanslagen die een uit te betalen bedrag behelzen met belastingaanslagen die op dezelfde belasting en
      hetzelfde tijdvak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
  - number: '24.7'
    text: |-
      De belastingschuldige kan binnen een week na de dagtekening van de in het vijfde lid bedoelde kennisgeving waarmee
      de beschikking is bekendgemaakt beroep instellen bij de directeur. Het beroepschrift wordt ingediend bij de
      ontvanger tegen een door deze af te geven ontvangbewijs. De directeur neemt zo spoedig mogelijk een beslissing
      en maakt deze bekend aan de belastingschuldige door middel van een gedagtekende kennisgeving. Indien op het
      beroepschrift afwijzend wordt beslist, vindt verrekening niet eerder plaats dan nadat na de dagtekening van de
      kennisgeving waarmee de beslissing van de directeur is bekendgemaakt acht dagen zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
  - number: '24.8'
    text: |-
      Met betrekking tot het bedrag waarvoor krachtens
      __REF000___________________________________________________________________________________________________________
      ____, uitstel van betaling is verleend, is gedurende het uitstel verrekening niet mogelijk, tenzij de
      belastingschuldige dit verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '24.9'
    text: De ontvanger maakt de verrekening onverwijld bekend.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel24
  - number: '25.1'
    text: |-
      De ontvanger kan onder door hem te stellen voorwaarden aan een belastingschuldige voor een bepaalde tijd bij
      beschikking uitstel van betaling verlenen. Gedurende het uitstel vangt de dwanginvordering niet aan, dan wel wordt
      deze geschorst.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.2'
    text: Het uitstel kan tussentijds bij beschikking worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verlenen van uitstel
      van betaling voor de duur van ten hoogste tien jaren in de gevallen waarin belastingaanslagen in de rechten van
      successie of schenking zijn opgelegd en door de voldoening daarvan zonder uitstel een sociaal-economisch dan wel
      cultureel belang in gevaar zou komen en dat uitstel niet of onvoldoende mogelijk is ingevolge de overige leden van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel
      van betaling voor de duur van 12 maanden en voor de eventuele verlenging daarvan op grond van
      [artikel 3.64, derde lid, van de Wet inkomstenbelasting 2001][ref1], mits voldoende zekerheid is gesteld,
      voor belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd door de toepassing van
      [artikel 3.64, eerste lid, van de Wet inkomstenbelasting 2001][ref2]. Het uitstel wordt beëindigd indien de
      herinvesteringen niet leiden tot in Nederland belastbare winst van de onderneming en bij emigratie van de
      belastingschuldige.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van
      uitstel van betaling voor de duur van tien jaar, mits voldoende zekerheid is gesteld, voor
      belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd door de toepassing van
      de [artikelen 3.83, eerste lid of tweede lid][ref1], [3.133, tweede lid, onderdelen h of j][ref2],
      [3.136, eerste lid][ref3], of [7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref4].
      Het uitstel wordt beëindigd indien zich een omstandigheid voordoet als genoemd in
      [artikel 19b, eerste lid, of tweede lid, eerste volzin, van de Wet op de loonbelasting 1964][ref5],
      [artikel 3.133, tweede lid, onderdelen a tot en met g, i en k][ref6], of
      [artikel 3.135, eerste lid, van de Wet inkomstenbelasting 2001][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
