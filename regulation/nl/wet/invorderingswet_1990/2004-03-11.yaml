        hoofdstuk: VI
        afdeling: '1'
  - number: '55.2'
    text: |-
      Indien de opdrachtgever ingevolge [artikel 35a][ref1] belasting heeft voldaan, draagt, in afwijking in zoverre van
      het eerste lid, tevens een aannemer bij die met betrekking tot het desbetreffende werk ingevolge [artikel 35][ref2]
      aansprakelijk is. Indien een koper ingevolge [artikel 35b][ref3] belasting heeft voldaan, dragen, in afwijking in
      zoverre van het eerste lid, tevens de opdrachtgever onderscheidenlijk een aannemer bij die met betrekking tot het
      desbetreffende werk ingevolge [artikel 35a][ref4] onderscheidenlijk [artikel 35][ref5] aansprakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel35b
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel35
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel55
    references:
