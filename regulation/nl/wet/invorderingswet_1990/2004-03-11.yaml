        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
  - number: '55.3'
    text: |-
      In afwijking in zoverre van de voorgaande leden bedraagt de bijdrage niet meer dan het bedrag waarvoor ieders
      aansprakelijkheid ingevolge de desbetreffende bepaling bestaat. Een als gevolg van de toepassing van de vorige
      volzin ontstaan tekort wordt met inachtneming van de voorgaande leden over de anderen verdeeld.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel55
  - number: '55.4'
    text: |-
      Degene die meer heeft bijgedragen dan overeenkomt met zijn op de voet van de voorgaande leden bepaalde aandeel,
      heeft voor dat meerdere verhaal op degene die minder dan zijn dienovereenkomstig bepaalde aandeel heeft
      bijgedragen. Blijkt verhaal op een of meer van degenen op wie verhaal kan worden genomen geheel of gedeeltelijk
      onmogelijk, dan wordt dat tekort met inachtneming van de voorgaande leden over de anderen verdeeld.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel55
  - number: '55.5'
    text: |-
      Ieder die in de belasting heeft bijgedragen, blijft gerechtigd het bijgedragene alsnog van de belastingschuldige
      terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel55
  - number: '55.6'
    text: Van de voorgaande leden kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel55
  - number: '56.1'
    text: |-
      Degene die op de voet van de [artikelen 33, eerste lid, onderdelen b en c][ref1], [34][ref2], [35][ref3],
      [35a][ref4], [35b][ref5] of [37][ref6] voor de voldoening van een belastingschuld geheel of ten dele aansprakelijk
      is gesteld, kan voor hetgeen hij in de belasting heeft bijgedragen verhaal nemen op ieder van degenen, die
      ingevolge de [artikelen 33, eerste lid, onderdeel a][ref7], of [36][ref8] voor die belastingschuld hoofdelijk
      aansprakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel35b
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel37
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel33
      [ref8]: https://wetten.overheid.nl/BWBR0004770#Artikel36
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '33'
