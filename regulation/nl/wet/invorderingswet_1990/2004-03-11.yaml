preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 22 mei 1845 (Stb. 1926, 334) op de
    invordering van ’s Rijks directe belastingen te vervangen door een meer overzichtelijke en op verschillende punten
    herziene wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#ArtikelAanhef
articles:
  - number: '1.1'
    text: Deze wet geldt bij de invordering van rijksbelastingen.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel1
  - number: '1.2'
    text: |-
      Op deze wet zijn [artikel 3:40][ref1], [hoofdstuk 4][ref2], [afdeling 5.2](onbekend), de [hoofdstukken 6][ref3] en
      [7][ref4] en [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel1
    references:
