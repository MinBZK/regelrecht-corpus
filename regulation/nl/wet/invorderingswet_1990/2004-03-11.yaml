        artikel: 31a
  - number: 25.12.a
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.12.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.13'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling
      voor de duur van tien jaar voor belastingaanslagen in de rechten van successie of schenking voor zover
      die rechten kunnen worden toegerekend aan de verkrijging van een vordering op een medeverkrijger ter zake
      van door deze medeverkrijger verkregen ondernemingsvermogen, aandelen of winstbewijzen als bedoeld in
      [artikel 35b, tweede lid, van de Successiewet 1956][ref1]. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
  - number: 25.13.a
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.13.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.13.c
    text: |-
      ingeval zich ten aanzien van de medeverkrijger tijdens de in de eerste volzin bedoelde periode een gebeurtenis
      voordoet als bedoeld in [artikel 53b, derde lid, van de Successiewet 1956][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel53b
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 53b
  - number: 25.13.d
    text: voor zover de vordering, bedoeld in de eerste volzin, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.14'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor
      de duur van ten hoogste tien jaar, mits voldoende zekerheid is gesteld, voor belastingaanslagen voorzover daarin
      is begrepen inkomstenbelasting die is verschuldigd wegens het beëindigen van een terbeschikkingstelling in de
      zin van [artikel 3.91][ref1] of [artikel 3.92 van de Wet inkomstenbelasting 2001][ref2] van een zaak zonder
      dat sprake is van een vervreemding van die zaak en welke belasting kan worden toegerekend aan het verschil
      tussen de boekwaarde en de waarde in het economische verkeer van die zaak. Het uitstel wordt slechts verleend
      voorzover de belastingschuldige geacht wordt over onvoldoende middelen – andere dan de desbetreffende zaak –
      te beschikken om zonder uitstel de belasting te voldoen en aannemelijk maakt dat de belasting binnen de periode
      waarvoor het uitstel wordt verleend, kan worden voldaan. Voor de toepassing van de tweede volzin blijven
      voorts buiten aanmerking de aandelen in of de winstbewijzen van een vennootschap waarin de belastingschuldige
      of een met hem verbonden persoon een aanmerkelijk belang heeft op grond van [artikel 4.10][ref3] en
      [artikel 4.11 van de Wet inkomstenbelasting 2001][ref4] indien het verschuldigd worden van de belasting voortvloeit
      uit de toepassing van de in artikel 3.92, eerste lid, onderdeel a, slot, van die wet bedoelde uitzondering ten
      aanzien van de terbeschikkingstelling in de zin van dat artikel aan die vennootschap. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 25.14.a
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.14.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.14.c
    text: in geval van overlijden van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.14.d
    text: ingeval de desbetreffende zaak wordt vervreemd.
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: '25.15'
    text: |-
      Voor de toepassing van het achtste tot en met veertiende lid zijn de
      [artikelen 4.3 tot en met 4.5a van de Wet inkomstenbelasting 2001][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '25.16'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor
      de duur van ten hoogste tien jaar, mits voldoende zekerheid is gesteld, voor belastingaanslagen voorzover daarin
      is begrepen inkomstenbelasting die bij staking van een onderneming is verschuldigd en kan worden toegerekend
      aan het verschil tussen de boekwaarde en de waarde in het economische verkeer van een woning als bedoeld in
      [artikel 3.19, eerste lid, van de Wet inkomstenbelasting 2001][ref1] die na het staken wordt aangemerkt als een
      eigen woning als bedoeld in [artikel 3.111 van die wet][ref2]. Het uitstel wordt slechts verleend voorzover de
      belastingschuldige geacht wordt over onvoldoende middelen – andere dan de eigen woning – te beschikken om zonder
      uitstel de belasting te voldoen en aannemelijk maakt dat de belasting binnen de periode waarvoor uitstel wordt
      verleend, kan worden voldaan. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.16.a
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.16.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
  - number: 25.16.c
    text: |-
      in geval van overlijden van de belastingschuldige, tenzij de partner, bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1], aannemelijk maakt dat de resterende belasting binnen de
      periode waarvoor uitstel is verleend, zal worden voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2004-03-11#Artikel25
    references:
