  - number: 70ba
    text: |-
      Indien de ontvanger het verleende uitstel van betaling, bedoeld in [artikel 70b][ref1], beëindigt, kan volgens bij
      ministeriële regeling te stellen regels kwijtschelding worden verleend voor zover de belasting waarvoor uitstel van
      betaling is verleend, hoger is dan de belasting die zou zijn geheven indien de belastingschuldige op het moment van
      de omstandigheid op grond waarvan het uitstel van betaling wordt beëindigd, in Nederland zou hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel70b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70ba
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 70b
        hoofdstuk: X
  - number: 70c.1
    text: |-
      Indien ingevolge [artikel 10bis.4, vierde lid, van de Wet inkomstenbelasting 2001][ref1] een kapitaalverzekering
      eigen woning wordt geacht tot uitkering te zijn gekomen, is de verzekeraar van die uitkering tot ten hoogste
      de waarde in het economische verkeer daarvan aansprakelijk voor de belasting die ter zake door de gerechtigde
      is verschuldigd. Indien ingevolge [artikel 10bis.5, vijfde lid, van de Wet inkomstenbelasting 2001][ref2] een
      spaarrekening eigen woning of een beleggingsrecht eigen woning geacht wordt te zijn gedeblokkeerd, is de bank
      waarbij die rekening wordt aangehouden, onderscheidenlijk de beheerder waarbij dat recht wordt aangehouden,
      aansprakelijk voor de belasting die ter zake door de rekeninghouder, onderscheidenlijk eigenaar, is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 10bis
      - id: ref2
        bwb_id: BWBR0011353
        artikel: 10bis
  - number: 70c.2
    text: |-
      Het bedrag van de verschuldigde belasting wordt gesteld op het evenredig gedeelte van de belasting die meer is
      verschuldigd ter zake van alle kapitaalverzekeringen eigen woning, alle spaarrekeningen eigen woning en alle
      beleggingsrechten eigen woning die in het jaar ingevolge [artikel 10bis.4, vierde lid][ref1], onderscheidenlijk
      [artikel 10bis.5, vijfde lid, van de Wet inkomstenbelasting 2001][ref2] worden geacht tot uitkering te zijn
      gekomen, onderscheidenlijk worden geacht te zijn gedeblokkeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 10bis
      - id: ref2
        bwb_id: BWBR0011353
        artikel: 10bis
  - number: 70c.3
    text: |-
      [Artikel 2.16, derde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 70c.4
    text: |-
      Zo spoedig mogelijk nadat de aansprakelijkheid ingevolge het eerste lid is ontstaan, wordt aan de verzekeraar, de
      bank, onderscheidenlijk de beheerder van de beleggingsinstelling, schriftelijk mededeling gedaan van het bedrag
      waarvoor deze aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70c
  - number: 70ca
    text: |-
      Indien de ontvanger het verleende uitstel van betaling, bedoeld in [artikel 25, vijfde lid][ref1],
      beëindigt omdat een aanspraak ingevolge een pensioenregeling als bedoeld in
      [artikel 38n, eerste lid, van de Wet op de loonbelasting 1964][ref2] ingevolge artikel 38n, tweede lid, van die
      wet gedeeltelijk wordt prijsgegeven en voor het overige wordt afgekocht of omdat een aanspraak ingevolge een
      oudedagsverplichting als bedoeld in [artikel 38p van die wet][ref3] wordt afgekocht, wordt volgens bij ministeriële
      regeling te stellen regels kwijtschelding verleend voor zover de belasting en de revisierente waarvoor uitstel
      van betaling is verleend hoger is dan de belasting en de revisierente die zou zijn geheven, onderscheidenlijk in
      rekening gebracht, indien de belastingschuldige op het moment van die handeling in Nederland zou hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38n
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel38p
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70ca
    references:
