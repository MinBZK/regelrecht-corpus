  - number: 2.1.aa
    text: |-
        - *Koninkrijk:* Koninkrijk der Nederlanden;
        - *Rijk:* het land Nederland, zijnde Nederland en de BES eilanden;
        - *Nederland:* het in Europa gelegen deel van het Koninkrijk, met dien verstande dat voor de heffing
      van de inkomstenbelasting, de loonbelasting, de vennootschapsbelasting en de assurantiebelasting
      Nederland tevens omvat de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref1], voorzover deze grenst aan de territoriale
      zee in Nederland;
        - *BES eilanden:* de openbare lichamen Bonaire, Sint Eustatius en Saba, met daaronder begrepen, met inachtneming van
      de [Rijkswet tot vaststelling van een zeegrens tussen Curaçao en Bonaire, en tussen Sint Maarten en Saba][ref2],
      het buiten de territoriale zee van de BES eilanden gelegen deel van de zeebodem en de ondergrond daarvan, voor
      zover het Koninkrijk daar op grond van het internationale recht ten behoeve van de exploratie en de exploitatie
      van natuurlijke rijkdommen soevereine rechten mag uitoefenen, alsmede de in, op, of boven dat gebied aanwezige
      installaties en andere inrichtingen ten behoeve van de exploratie en exploitatie van natuurlijke rijkdommen in
      dat gebied;


      [ref1]: https://wetten.overheid.nl/BWBR0010480#Artikel1
