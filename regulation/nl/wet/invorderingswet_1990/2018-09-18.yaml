        artikel: 38p
  - number: 70cb.b
    text: |-
      volgens bij ministeriële regeling te stellen regels kwijtschelding verleend voor het bedrag waarvoor het uitstel
      van betaling op grond van onderdeel a wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70cb
