    text: voor zover de vordering, bedoeld in de eerste volzin, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.14'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor de
      duur van ten hoogste tien jaar, mits voldoende zekerheid is gesteld, voor belastingaanslagen voor zover daarin is
      begrepen inkomstenbelasting die is verschuldigd wegens het beëindigen van een terbeschikkingstelling van een zaak
      in de zin van [artikel 3.91][ref1] of [artikel 3.92 van de Wet inkomstenbelasting 2001][ref2], welke belasting
      kan worden toegerekend aan het verschil tussen de boekwaarde en de waarde in het economisch verkeer van die zaak,
      ingeval de zaak waarvan de terbeschikkingstelling is beëindigd: a. niet is vervreemd; b. is vervreemd waarbij de
      koper de overdrachtsprijs schuldig is gebleven, of c. is geschonken. Het uitstel wordt beëindigd: 1°. wanneer de
      zaak niet is vervreemd: ingeval de zaak wordt vervreemd, in geval de belastingschuldige overlijdt, in geval van
      faillissement van de belastingschuldige of in geval de schuldsanering natuurlijke personen ten aanzien van hem
      van toepassing is; 2°. wanneer de overdrachtsprijs schuldig is gebleven: ingeval aflossingen plaatsvinden, in
      geval de koper de zaak vervreemdt, in geval de belastingschuldige overlijdt, in geval van faillissement van de
      belastingschuldige of in geval de schuldsanering natuurlijke personen ten aanzien van hem van toepassing is; 3°.
      wanneer is geschonken: ingeval de begiftigde de zaak vervreemdt, in geval de belastingschuldige overlijdt, in geval
      van faillissement van de belastingschuldige of in geval de schuldsanering natuurlijke personen ten aanzien van hem
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25.15'
    text: |-
      Voor de toepassing van het achtste tot en met veertiende lid zijn de
      [artikelen 4.3 tot en met 4.5a van de Wet inkomstenbelasting 2001][ref1] en
      [artikel 2, derde lid, onderdeel f, van de Algemene wet inzake rijksbelastingen][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
