      in afwijking van [artikel 25, vijfde lid][ref1], het verleende uitstel van betaling voor de belastingaanslag alleen
      beëindigd, voor zover de belasting en de revisierente waarvoor uitstel van betaling is verleend niet toerekenbaar
      is aan het gedeelte van de aanspraak dat wordt omgezet in een aanspraak ingevolge een oudedagsverplichting als
      bedoeld in [artikel 38p van de Wet op de loonbelasting 1964][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38p
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70cb
