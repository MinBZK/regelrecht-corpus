  - number: 70b.1
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot op de voet van
      [artikel 25, zesde lid][ref1], zoals dat luidde op 31 december 2012, verleend uitstel van betaling
      alsmede met betrekking tot het verlenen van uitstel van betaling voor belastingaanslagen betreffende
      de inkomstenbelasting die is verschuldigd door de toepassing van [artikel 3.116, vierde lid][ref2],
      of [artikel 3.116a, vijfde lid, van de Wet inkomstenbelasting 2001][ref3], zoals die artikelen luidden
      op 31 december 2012, onderscheidenlijk door de toepassing van [artikel 10bis.4, vierde lid][ref4], of
      [artikel 10bis.5, vijfde lid, van de Wet inkomstenbelasting 2001][ref5]. De in de eerste volzin bedoelde regels
      kunnen mede betrekking hebben op het stellen van voldoende zekerheid. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
