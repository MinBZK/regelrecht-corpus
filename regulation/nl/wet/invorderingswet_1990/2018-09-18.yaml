        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.16.a
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.16.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.16.c
    text: |-
      in geval van overlijden van de belastingschuldige, tenzij de partner, bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1], aannemelijk maakt dat de resterende belasting binnen de
      periode waarvoor uitstel is verleend, zal worden voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 25.16.d
    text: ingeval zich een omstandigheid voordoet waardoor de woning ophoudt een eigen woning te zijn.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.17'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor de
      duur van tien jaar voor belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd bij staking door
      overlijden als bedoeld in [artikel 3.58, eerste lid, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25.18'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling, mits
      voldoende zekerheid is gesteld, voor belastingaanslagen waarin is begrepen inkomstenbelasting ter zake van winst
      behaald met of bij het staken van een onderneming of een gedeelte van een onderneming door de overdracht aan een
      natuurlijk persoon die de onderneming voortzet en de overdrachtsprijs geheel of gedeeltelijk schuldig is gebleven.
      Het uitstel heeft betrekking op de in de eerste volzin bedoelde belasting voorzover die betrekking heeft op de
      overdracht van vermogensbestanddelen aan de daar bedoelde persoon. Het uitstel wordt verleend voor een gedeelte
      in evenredigheid met de verhouding tussen het, op het moment met ingang waarvan het uitstel wordt verleend,
      schuldig gebleven gedeelte van de overdrachtsprijs en de totale overdrachtsprijs voor de duur van de overeengekomen
      aflossingsperiode, doch tot uiterlijk het begin van het tiende jaar na afloop van het kalenderjaar waarop de
      belastingaanslag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.19'
    text: |-
      Het uitstel bedoeld in het vorige lid wordt aan het begin van elk kalenderjaar, te beginnen bij de aanvang van
      het eerste kalenderjaar volgend op het kalenderjaar waarin de voor de belastingaanslag geldende enige of laatste
      betalingstermijn vervalt, voor een evenredig gedeelte beëindigd waarbij de teller is één en de noemer gelijk
      aan het aantal nog resterende gehele jaren van de overeengekomen aflossingsperiode plus één, doch maximaal tien
      minus het aantal van de reeds verstreken jaren sedert het einde van het kalenderjaar waarop de belastingaanslag
      betrekking heeft. Het uitstel wordt voorts beëindigd:
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.19.a
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.19.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.19.c
    text: in geval van overlijden van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.19.d
    text: |-
      voorzover aan het begin van het kalenderjaar het bedrag van het resterende uitstel uitgaat boven het bedrag dat
      gelijk is aan het gedeelte van de in het vorige lid bedoelde belasting in evenredigheid met de verhouding tussen
      het nog niet ontvangen deel van de overdrachtsprijs en de totale overdrachtsprijs;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.19.e
    text: |-
      voorzover op de dag volgend op de dag waarop de enige of laatste betalingstermijn is vervallen het resterende
      uitstel uitgaat boven het bedrag dat gelijk is aan het gedeelte van de in het vorige lid bedoelde belasting
      in evenredigheid met de verhouding tussen 1e het aantal nog resterende gehele jaren van de overeengekomen
      aflossingstermijn plus één doch maximaal negen verminderd met de reeds verstreken jaren sedert het einde van het
      kalenderjaar waarop de belastingaanslag betrekking heeft, en 2e het aantal gehele jaren van de overeengekomen
      aflossingsperiode, doch maximaal tien. Ingeval de in het vorige lid bedoelde natuurlijk persoon de daar bedoelde
      onderneming staakt, kan de ontvanger het uitstel beëindigen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.20'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling,
      mits voldoende zekerheid is gesteld, voor belastingaanslagen betreffende de erfbelasting ter zake van de
      verkrijging van de blote eigendom van een woning, bedoeld in [artikel 35g van de Successiewet 1956][ref1],
      alsmede ter zake van de verkrijging van een onderbedelingsvordering, bedoeld in het vierde lid van dat
      artikel. Het uitstel wordt slechts verleend voor zover degene van wie op grond van de bevoegdheid, bedoeld in
      [artikel 78, eerste lid, van de Successiewet 1956][ref2], wordt gevorderd de erfbelasting ter zake van de blote
      eigendom voor te schieten of uit de met vruchtgebruik bezwaarde goederen te voldoen, onderscheidenlijk degene
      die op grond van [artikel 14, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref3] dan wel op grond van het
      testament gehouden is tot voldoening van de erfbelasting ter zake van de onderbedelingsvordering, niet in staat
      is anders dan met buitengewoon bezwaar als bedoeld in [artikel 26][ref4] de erfbelasting te betalen, waarbij het
      vruchtgebruik van de woning, dan wel – voor zover de hiervoor bedoelde persoon de eigendom van de woning heeft –
      de woning, bedoeld in [artikel 35g van de Successiewet 1956][ref5], buiten beschouwing blijft. Het uitstel wordt
      beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35g
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0002226#Artikel35g
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35g
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '26'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0002226
        artikel: 35g
  - number: 25.20.a
    text: |-
      ingeval de woning voor de vruchtgebruiker niet langer een eigen woning is als bedoeld in
      [artikel 3.111 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.20.b
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.20.c
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.20.d
    text: bij vervreemding van de blote eigendom;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.20.e
    text: voor zover de onderbedelingsvordering, bedoeld in de eerste volzin, wordt afgelost.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.21'
    text: |-
      Voor de toepassing van het vierde, vijfde, achtste en zeventiende lid wordt de belastingrente en voor de toepassing
      van het vijfde lid wordt voorts de revisierente gelijkgesteld met de inkomstenbelasting waarmee deze samenhangen.
      Voor de toepassing van het negende, elfde, veertiende, zestiende en achttiende lid wordt de belastingrente
      voorzover deze samenhangt met de inkomstenbelasting waarvoor op de voet van die leden uitstel van betaling wordt
      verleend, gelijkgesteld met die belasting. Voor de toepassing van het twaalfde lid, wordt de belastingrente
      gelijkgesteld met de erfbelasting waarmee deze samenhangt. Voor de toepassing van het dertiende lid wordt de
      belastingrente voor zover deze samenhangt met de erfbelasting waarvoor op de voet van dat lid uitstel van betaling
      wordt verleend, gelijkgesteld met die belasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25a.1
    text: |-
      Op verzoek van een belastingschuldige die woont of is gevestigd in een lidstaat van de Europese Unie of
      in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte wordt onder bij
      ministeriële regeling te stellen regels uitstel van betaling verleend, mits voldoende zekerheid is gesteld, voor
      belastingaanslagen voor zover daarin is begrepen vennootschapsbelasting of inkomstenbelasting die betrekking
      heeft op voordelen ter zake van vermogensbestanddelen die bij de belastingschuldige bij het vaststellen van de
      belastingaanslag in aanmerking zijn genomen terwijl bij die belastingschuldige deze voordelen niet in aanmerking
      zouden zijn genomen ingeval deze ter zake van die vermogensbestanddelen voor de heffing van vennootschapsbelasting,
      onderscheidenlijk inkomstenbelasting, belastingplichtig in Nederland zou zijn gebleven. De in de eerste volzin
      bedoelde regels zien op de uitvoering van dit artikel, waaronder begrepen regels betreffende de administratieve
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: 25a.2
    text: 'Het uitstel van betaling, bedoeld in het eerste lid, wordt beëindigd:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: 25a.2.a
    text: |-
      ingeval de belastingschuldige niet meer woont of is gevestigd in een lidstaat van de Europese Unie of in een staat
      die partij is bij de overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: 25a.2.b
    text: ingeval niet meer wordt voldaan aan de bij de in het eerste lid bedoelde ministeriële regeling gestelde regels;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: 25a.2.c
    text: ingeval niet meer voldoende zekerheid is gesteld, of
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: 25a.2.d
    text: |-
      voor zover de in het eerste lid bedoelde voordelen ter zake van vermogensbestanddelen bij de belastingschuldige in
      aanmerking zouden zijn genomen indien hij belastingplichtig in Nederland zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: 25a.3
    text: |-
      In afwijking van het tweede lid, onderdeel d, wordt op verzoek van de belastingschuldige het bedrag waarvoor op
      grond van het eerste lid uitstel van betaling is verkregen, in tien gelijke jaarlijkse termijnen voldaan waarvan de
      eerste termijn één maand na de dagtekening van het aanslagbiljet vervalt en elk van de volgende termijnen telkens
      een jaar later.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: 25a.4
    text: |-
      De in het eerste en het derde lid bedoelde verzoeken worden gedaan tegelijk met de aangifte waarin een voordeel als
      bedoeld in het eerste lid is opgenomen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25a
  - number: '26.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld krachtens welke aan de belastingschuldige die niet in staat is
      anders dan met buitengewoon bezwaar een belastingaanslag geheel of gedeeltelijk te betalen, gehele of gedeeltelijke
      kwijtschelding kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
  - number: '26.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld krachtens welke aan de belastingschuldige ter zake van belasting
      waarvoor op de voet van [artikel 25, vijfde lid][ref1], uitstel van betaling is verleend, kwijtschelding van
      belasting kan worden verleend indien dit uitstel eindigt doordat de termijn, bedoeld in artikel 25, vijfde lid,
      tweede volzin, is verstreken. Kwijtschelding van belasting kan worden verleend tot een bedrag gelijk aan het nog
      openstaande bedrag nadat de termijn, bedoeld in artikel 25, vijfde lid, tweede volzin, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '26.3'
    text: |-
      Indien de ontvanger het op de voet van [artikel 25, vijfde lid][ref1], verleende uitstel van betaling beëindigt
      omdat zich met betrekking tot een aanspraak uit een overeenkomst van levensverzekering of een aanspraak ingevolge
      een pensioenregeling een omstandigheid voordoet als bedoeld in [artikel 25, vijfde lid, vierde volzin][ref2], kan
      krachtens bij ministeriële regeling te stellen regels aan de belastingschuldige kwijtschelding van belasting worden
      verleend voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 26.3.a
    text: |-
      die belasting hoger is dan de belasting die zou zijn geheven ter zake van de hiervoor bedoelde omstandigheid indien
      de belastingschuldige op het moment waarop die omstandigheid zich voordeed in Nederland zou hebben gewoond;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
  - number: 26.3.b
    text: |-
      de omstandigheid die ingevolge [artikel 25, vijfde lid, vierde volzin][ref1], tot beëindiging van het uitstel van
      betaling heeft geleid, ingevolge een regeling ter voorkoming van dubbele belasting niet belastbaar is in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '26.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld krachtens welke aan de belastingschuldige ter zake van belasting
      waarvoor op de voet van [artikel 25, achtste lid][ref1], uitstel van betaling is verleend, kwijtschelding van
      belasting kan worden verleend tot een bedrag gelijk aan de in Nederland verschuldigde dividendbelasting of, indien
      dit meer bedraagt, aan de in Nederland verschuldigde inkomstenbelasting wegens reguliere voordelen in de zin van
      [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref2] met betrekking tot de aandelen of winstbewijzen waarop het
      uitstel betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: '26.5'
    text: |-
      Voorzover de ontvanger het op de voet van [artikel 25, achtste lid][ref1], verleende uitstel van betaling beëindigt
      omdat aandelen of winstbewijzen worden vervreemd in de zin van [artikel 25, achtste lid, onderdeel a][ref2], kan
      krachtens bij ministeriële regeling te stellen regels kwijtschelding worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 26.5.a
    text: |-
      indien de waarde in het economische verkeer van die aandelen of winstbewijzen is gedaald, anders dan door
      uitkering van winstreserves, teruggaaf van wat is gestort of ingelegd of overgang van rechten op andere
      aandelen of winstbewijzen, in vergelijking tot die waarde ten tijde van het belastbare feit ter zake waarvan de
      belastingaanslag is vastgesteld – tot een bedrag gelijk aan een vierde van de in deze volzin bedoelde waardedaling;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
  - number: 26.5.b
    text: |-
      indien het heffingsrecht wegens vervreemding van die aandelen of winstbewijzen ingevolge de
      [Belastingregeling voor het Koninkrijk][ref1], de Belastingregeling voor het land Nederland of een verdrag ter
      voorkoming van dubbele belasting aan een ander land van het Koninkrijk, aan een ander heffingsgebied binnen het
      Rijk, respectievelijk aan een andere mogendheid is toegewezen – tot een bedrag gelijk aan de aldaar ter zake van
      die vervreemding feitelijk geheven belasting;


      [ref1]: https://wetten.overheid.nl/BWBR0002464
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002464
  - number: 26.5.c
    text: |-
      voor zover de belasting waarvoor op de voet van [artikel 25, achtste lid][ref1], uitstel van betaling is verleend,
      hoger is dan de belasting die zou zijn geheven indien de belastingschuldige op het moment van die vervreemding in
      Nederland zou hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '26.7'
    text: |-
      Voor de toepassing van dit artikel zijn de [artikelen 4.3 tot en met 4.5a van de Wet inkomstenbelasting 2001][ref1]
      en [artikel 2, derde lid, onderdeel f, van de Algemene wet inzake rijksbelastingen][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '26.8'
    text: |-
      Voor de toepassing van het tweede lid worden de belastingrente en de revisierente gelijkgesteld met de
      inkomstenbelasting waarmee deze samenhangen. Voor de toepassing van dit artikel wordt de belastingrente voorzover
      deze samenhangt met de inkomstenbelasting waarvoor op de voet van dit artikel kwijtschelding wordt verleend,
      gelijkgesteld met die belasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel26
  - number: '27.1'
    text: |-
      De ontvanger kan de verjaring van een rechtsvordering tot betaling stuiten door een schriftelijke mededeling waarin
      hij zich ondubbelzinnig zijn recht op betaling voorhoudt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27
  - number: '27.2'
    text: |-
      Indien een belastingschuldige is opgehouden te bestaan en voor zover voor zijn belastingschuld een
      aansprakelijkstelling als bedoeld in [artikel 49, eerste lid][ref1], heeft plaatsgevonden, treedt de aansprakelijk
      gestelde voor die belastingschuld in de plaats van de belastingschuldige, voor zover het betreft de stuiting van de
      verjaring of de verlenging van de verjaringstermijn van de rechtsvordering tot betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel49
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '49'
        hoofdstuk: VI
        afdeling: '2'
  - number: 27bis
    text: |-
      Indien een bedrag aan rechten bij invoer of rechten bij uitvoer geheel of gedeeltelijk wordt terugbetaald of
      kwijtgescholden en ter zake van dat bedrag kredietrente of vertragingsrente in rekening was gebracht, wordt het
      deel van de kredietrente of vertragingsrente dat betrekking heeft op het terug te betalen of kwijt te schelden
      bedrag eveneens terugbetaald, onderscheidenlijk kwijtgescholden.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27bis
  - number: 27ter.1
    text: |-
      De ontvanger stelt het bedrag van de kredietrente, de vertragingsrente of de rente, bedoeld in artikel 116,
      zesde lid, tweede en derde volzin, van het Douanewetboek van de Unie, vast bij voor bezwaar vatbare beschikking.
      Dat bedrag wordt op het afschrift van de uitspraak afzonderlijk vermeld of op andere wijze schriftelijk kenbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27ter
  - number: 27ter.2
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de beschikking, bedoeld in het eerste lid, is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27ter
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 27quater
    text: |-
      Dit hoofdstuk is niet van toepassing op te innen of terug te betalen bedragen aan rechten bij invoer, rechten bij
      uitvoer, kredietrente, vertragingsrente en rente op achterstallen en belastingen of heffingen waarop de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], van overeenkomstige
      toepassing zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27quater
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 27a.1
    text: |-
      Ingeval op een belastingaanslag als bedoeld in [artikel 9, vijfde lid][ref1], die een te innen bedrag behelst
      en invorderbaar is in meer dan één termijn, op de eerste vervaldag ten minste het bedrag van de belastingaanslag
      verminderd met het bedrag van de te verlenen betalingskorting is betaald, wordt een betalingskorting verleend over
      het bedrag van de belastingaanslag. De te verlenen betalingskorting wordt berekend over de helft van het tijdvak
      dat aanvangt op de dag na de vervaldag van de voor de belastingaanslag geldende eerste betalingstermijn en eindigt
      op de vervaldag van de voor de belastingaanslag geldende laatste betalingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: 27a.2
    text: |-
      Ingeval een belastingaanslag ter zake waarvan de betalingskorting is verleend, wordt verminderd, wordt de
      betalingskorting teruggenomen over het bedrag van de vermindering, doch ten hoogste over het positieve bedrag van
      die belastingaanslag. De terug te nemen betalingskorting wordt berekend over de helft van het tijdvak dat aanvangt
      op de dag na de dagtekening van het afschrift van de uitspraak of de dagtekening van de kennisgeving waarmee
      de vermindering wordt bekendgemaakt en eindigt op de vervaldag van de voor de belastingaanslag geldende laatste
      betalingstermijn.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27a
  - number: 27a.3
    text: |-
      De betalingskorting wordt berekend naar het in [artikel 29][ref1] bedoelde percentage dat geldt op de vervaldag van
      de voor de belastingaanslag geldende eerste betalingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel29
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '29'
        hoofdstuk: V
  - number: '28.1'
    text: |-
      Bij overschrijding van de voor de belastingaanslag geldende enige of laatste betalingstermijn wordt aan de
      belastingschuldige rente – invorderingsrente – in rekening gebracht over het op de belastingaanslag openstaande
      bedrag met dien verstande dat invorderingsrente niet in rekening wordt gebracht voor zover met de belastingaanslag
      wordt verrekend een belastingaanslag die op dezelfde belasting en hetzelfde tijdvak betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28
  - number: '28.2'
    text: |-
      De invorderingsrente wordt enkelvoudig berekend over het tijdvak dat aanvangt op de dag waarop de belastingaanslag
      invorderbaar is ingevolge [artikel 9][ref1] en eindigt op de dag voorafgaand aan die van de betaling. Voor de
      toepassing van de eerste volzin blijft [artikel 10][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel10
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '10'
        hoofdstuk: II
  - number: '28.3'
    text: |-
      Invorderingsrente wordt niet in rekening gebracht over de tijd voor welke de belastingschuldige krachtens
      [artikel 25, derde, vijfde, achtste, negende, elfde, zeventiende, achttiende of negentiende lid][ref1], uitstel van
      betaling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '28.4'
    text: |-
      In afwijking in zoverre van het derde lid wordt invorderingsrente in rekening gebracht voor zover het krachtens
      [artikel 25, vijfde, achtste, negende, elfde, zeventiende, achttiende of negentiende lid][ref1], verleende uitstel
      door de ontvanger wordt beëindigd of voor zover betaling niet plaatsvindt binnen de termijn waarvoor uitstel van
      betaling is verleend. Bij algemene maatregel van bestuur wordt het tijdvak bepaald waarover in deze situaties
      invorderingsrente wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: 28a.1
    text: |-
      Indien de ontvanger een aan een belastingplichtige uit te betalen bedrag niet binnen 6 weken na de dagtekening van
      de daartoe strekkende belastingaanslag uitbetaalt of verrekent, wordt aan de belastingplichtige invorderingsrente
      vergoed.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28a
  - number: 28a.2
    text: |-
      De invorderingsrente wordt enkelvoudig berekend over het tijdvak dat aanvangt op de dag na de dagtekening van
      de tot uitbetaling strekkende belastingaanslag of beschikking en eindigt op de dag voorafgaand aan die van de
      betaling. In afwijking van de eerste volzin wordt invorderingsrente niet berekend over dagen waarover ingevolge
      [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref1] reeds belastingrente is vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VA
  - number: 28a.3
    text: |-
      Invorderingsrente wordt niet vergoed voor zover het aan de belastingplichtige is te wijten dat de uitbetaling niet
      tijdig is geschied.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28a
  - number: 28a.4
    text: |-
      Dit artikel is niet van toepassing op een voorlopige aanslag als bedoeld in [artikel 9, vijfde lid][ref1], die een
      uit te betalen bedrag behelst als bedoeld in het zesde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: 28b.1
    text: |-
      Indien een belastingaanslag wordt verminderd of herzien tot een lager bedrag dan inmiddels op die aanslag is
      betaald en de belastingschuldige eerder een verzoek om uitstel van betaling met betrekking tot het door hem
      bestreden bedrag van die aanslag heeft gedaan dat door de ontvanger bij beschikking is afgewezen, wordt aan de
      belastingschuldige invorderingsrente vergoed.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28b
  - number: 28b.2
    text: |-
      De invorderingsrente wordt enkelvoudig berekend over het tijdvak dat aanvangt de dag na de dag waarop de
      belastingaanslag waarvoor een verzoek om uitstel van betaling bij beschikking is afgewezen, invorderbaar is
      ingevolge [artikel 9][ref1] en eindigt 6 weken na de dagtekening van de vermindering of de herziening en heeft als
      grondslag het terug te geven bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: 28c.1
    text: |-
      Voor zover de ontvanger op grond van een beschikking van de inspecteur gehouden is belasting terug te geven omdat
      de desbetreffende belasting in strijd met het Unierecht is geheven, wordt op verzoek aan de belastingschuldige
      invorderingsrente vergoed.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28c
  - number: 28c.2
    text: |-
      De invorderingsrente, bedoeld in het eerste lid, wordt enkelvoudig berekend over het tijdvak dat aanvangt op de
      dag na die waarop de belasting is betaald, voldaan of afgedragen en eindigt op de dag voorafgaand aan die van
      de terugbetaling en heeft als grondslag het aan de belastingschuldige terug te geven of teruggegeven bedrag. In
      afwijking van de eerste volzin wordt de invorderingsrente, bedoeld in het eerste lid, niet berekend over dagen
      waarover ingevolge [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref1] belastingrente wordt vergoed of
      waarover ingevolge [artikel 28b][ref2] invorderingsrente wordt vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel28b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VA
      - id: ref2
        bwb_id: BWBR0004770
        artikel: 28b
        hoofdstuk: V
  - number: 28c.3
    text: |-
      De termijn voor het indienen van een verzoek om vergoeding van invorderingsrente op grond van dit artikel eindigt
      zes weken na dagtekening van de beschikking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel28c
  - number: '29'
    text: |-
      Het percentage van de invorderingsrente is gelijk aan dat van de ingevolge
      [artikel 120, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1] bij algemene maatregel van bestuur
      vastgestelde wettelijke rente, bedoeld in [artikel 119 van Boek 6 van dat wetboek][ref2], met dien verstande dat
      het eerstgenoemde percentage ten minste 4 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '119'
  - number: '30.1'
    text: |-
      De ontvanger stelt het bedrag van de betalingskorting en van de invorderingsrente vast bij voor bezwaar vatbare
      beschikking. Het bedrag van de betalingskorting wordt op het aanslagbiljet afzonderlijk vermeld of op andere wijze
      schriftelijk kenbaar gemaakt. Het bedrag van de invorderingsrente wordt op het afschrift van de uitspraak of de
      kennisgeving waarmee de vermindering wordt bekendgemaakt afzonderlijk vermeld of op andere wijze schriftelijk
      kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel30
  - number: '30.2'
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de in het eerste lid bedoelde beschikking is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '31'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de bij de berekening van betalingskorting en
      invorderingsrente toe te passen afrondingen en voor het niet terugnemen van betalingskorting onderscheidenlijk
      niet in rekening brengen van invorderingsrente die een bij die regeling bepaald bedrag niet te boven gaat. Voorts
      kunnen bij ministeriële regeling nadere regels worden gesteld met betrekking tot een doelmatige invordering van
      betalingskorting en invorderingsrente.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel31
  - number: 31a
    text: |-
      Onze Minister kan in het kader van een regeling voor onderling overleg op grond van het Verdrag ter afschaffing
      van dubbele belasting in geval van winstcorrecties tussen verbonden ondernemingen (*Trb.* 1990, 173), de
      [Belastingregeling voor het Koninkrijk][ref1] of een verdrag ter voorkoming van dubbele belasting, voor bepaalde
      gevallen of groepen van gevallen afwijkingen toestaan van de [artikelen 28][ref2], [29][ref3], [30][ref4] en
      [31][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002464
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel31
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002464
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '28'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '29'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '30'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '31'
        hoofdstuk: V
  - number: '32.1'
    text: |-
      De bepalingen van dit hoofdstuk laten, behoudens voor zover anders is vermeld, onverlet het bepaalde met betrekking
      tot de aansprakelijkheid in enige andere wettelijke regeling.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel32
  - number: '32.2'
    text: |-
      De bepalingen van dit hoofdstuk strekken zich mede uit tot in te vorderen bedragen die verband houden met de
      belasting waarvoor de aansprakelijkheid geldt, een en ander voor zover het belopen daarvan aan de aansprakelijke is
      te wijten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel32
  - number: '33.1'
    text: |-
      In afwijking in zoverre van andere wettelijke regelingen is hoofdelijk aansprakelijk voor de rijksbelastingen,
      verschuldigd door:
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel33
  - number: 33.1.a
    text: |-
      een lichaam zonder rechtspersoonlijkheid of een rechtspersoonlijkheid bezittend lichaam dat niet volledig
      rechtsbevoegd is: ieder van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel33
  - number: 33.1.b
    text: |-
      een niet in Nederland gevestigd lichaam: de leider van zijn vaste inrichting in Nederland dan wel zijn in Nederland
      wonende of gevestigde vaste vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel33
  - number: 33.1.c
    text: |-
      een lichaam dat is ontbonden: ieder van de met de vereffening belaste personen - met uitzondering van de door de
      rechter benoemde vereffenaar - voor zover het niet betalen van de belastingschuld het gevolg is van aan hem te
      wijten kennelijk onbehoorlijk bestuur, met dien verstande dat geen aansprakelijkstelling kan plaatsvinden indien na
      de ontbinding drie jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel33
  - number: '33.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder lichamen verstaan lichamen in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1] en wordt als bestuurder aangemerkt de volledig aansprakelijke vennoot
      van een maat- of vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '33.3'
    text: |-
      Voor de toepassing van dit artikel wordt ingeval een bestuurder van een lichaam zelf een lichaam is, onder
      bestuurder mede verstaan ieder van de bestuurders van het laatstbedoelde lichaam.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel33
  - number: '33.4'
    text: |-
      Degene die op grond van het eerste lid, onderdelen *a* en *b*, aansprakelijk is, is niet aansprakelijk voor zover
      hij bewijst dat het niet aan hem is te wijten dat de belasting niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel33
  - number: '34.1'
    text: |-
      Ingeval een werknemer met instandhouding van de dienstbetrekking tot zijn inhoudingsplichtige, de uitlener, door
      deze ter beschikking is gesteld aan een derde, de inlener, om onder diens toezicht of leiding werkzaam te zijn,
      is de inlener hoofdelijk aansprakelijk voor de loonbelasting welke de uitlener verschuldigd is in verband met het
      verrichten van die werkzaamheden door die werknemer alsmede voor de omzetbelasting welke de uitlener, dan wel –
      in geval doorlening plaatsvindt – de in het tweede lid bedoelde doorlener verschuldigd is in verband met dat ter
      beschikking stellen. In afwijking in zoverre van [artikel 32, tweede lid][ref1], is de inlener niet aansprakelijk
      voor de in verband met de heffing van loonbelasting of van omzetbelasting opgelegde bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel32
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '32'
        hoofdstuk: VI
        afdeling: '1'
  - number: '34.2'
    text: 'Onder inlener wordt mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
  - number: 34.2.a
    text: |-
      de doorlener, zijnde degene aan wie een werknemer ter beschikking is gesteld en die deze werknemer vervolgens ter
      beschikking stelt aan een derde om onder diens toezicht of leiding werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
  - number: 34.2.b
    text: |-
      de in onderdeel a bedoelde derde, aan wie door een doorlener een werknemer ter beschikking is gesteld om onder
      toezicht of leiding van die derde werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
  - number: '34.3'
    text: |-
      Indien een inlener ingevolge een overeenkomst met de uitlener ten behoeve van de voldoening van
      loonbelasting, omzetbelasting en sociale verzekeringspremies in verband met het verrichten van werkzaamheden
      door een ter beschikking gestelde werknemer, alsmede met dat ter beschikking stellen, een bedrag
      heeft overgemaakt op een rekening die door die uitlener ten behoeve van de betaling van loonbelasting,
      omzetbelasting en sociale verzekeringspremies wordt gehouden bij een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank mag uitoefenen, wordt het bedrag waarvoor
      de aansprakelijkheid van de inlener uit hoofde van het eerste en tweede lid met betrekking tot die werkzaamheden en
      dat ter beschikking stellen in eerste aanleg bestaat, verminderd met dat overgemaakte bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '34.4'
    text: |-
      Het derde lid is niet van toepassing voor zover de inlener wist of redelijkerwijs moest vermoeden dat de uitlener
      in gebreke zou blijven het op de in dat lid bedoelde rekening gestorte bedrag aan te wenden voor de betaling van
      loonbelasting, omzetbelasting of sociale verzekeringspremies.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
  - number: '34.5'
    text: |-
      De aansprakelijkheid op grond van het eerste lid geldt niet met betrekking tot de loonbelasting en de
      omzetbelasting verschuldigd door de uitlener, indien aannemelijk is dat het niet betalen door de uitlener noch aan
      hem noch aan een inlener is te wijten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
  - number: '34.6'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
  - number: '34.7'
    text: |-
      Dit artikel is niet van toepassing indien de werkzaamheden die door de ter beschikking gestelde werknemer zijn
      verricht, ondergeschikt zijn aan een tussen de uitlener en de inlener, dan wel tussen de doorlener en de inlener,
      gesloten overeenkomst van koop en verkoop van een bestaande zaak.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel34
  - number: '35.1'
    text: 'De aannemer is hoofdelijk aansprakelijk voor de loonbelasting:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.1.a
    text: |-
      die de onderaannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende onderaannemers wordt
      uitgevoerd, iedere volgende onderaannemer verschuldigd is in verband met het verrichten van werkzaamheden door zijn
      werknemers ter zake van dat werk;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.1.b
    text: |-
      voor de betaling waarvan de onderaannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende
      onderaannemers wordt uitgevoerd, iedere volgende onderaannemer ingevolge [artikel 34][ref1] hoofdelijk
      aansprakelijk is ter zake van dat werk.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
        hoofdstuk: VI
        afdeling: '1'
  - number: '35.2'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.2.a
    text: |-
      aannemer: degene die zich jegens een ander, de opdrachtgever, verbindt om buiten dienstbetrekking een werk van
      stoffelijke aard uit te voeren tegen een te betalen prijs;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.2.b
    text: |-
      onderaannemer: degene die zich jegens een aannemer verbindt om buiten dienstbetrekking het in onderdeel *a*
      bedoelde werk geheel of gedeeltelijk uit te voeren tegen een te betalen prijs.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: '35.3'
    text: 'Voor de toepassing van dit artikel wordt:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.3.a
    text: de onderaannemer ten opzichte van zijn onderaannemer als aannemer beschouwd;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.3.b
    text: |-
      met een aannemer gelijkgesteld degene die zonder daartoe van een opdrachtgever opdracht te hebben gekregen buiten
      dienstbetrekking in de normale uitoefening van zijn bedrijf een werk van stoffelijke aard uitvoert;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.3.c
    text: |-
      ten opzichte van de aannemer als onderaannemer beschouwd de verkoper van een toekomstige zaak, voor zover de koop
      en verkoop voortvloeit uit of verband houdt met het in het tweede lid, onderdeel *a*, bedoelde werk.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: '35.4'
    text: 'De voorgaande leden zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.4.a
    text: |-
      indien een werk tot de uitvoering waarvan een onderaannemer zich jegens een aannemer heeft verbonden, geheel of
      grotendeels wordt verricht op de plaats waar de onderneming van de onderaannemer is gevestigd met uitzondering van
      de vervaardiging en elke daarop gerichte handeling van kleding, andere dan schoeisel, of
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35.4.b
    text: |-
      indien de uitvoering van een werk waartoe een onderaannemer zich jegens een aannemer heeft verbonden, ondergeschikt
      is aan een tussen hen gesloten overeenkomst van koop en verkoop van een bestaande zaak.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: '35.5'
    text: |-
      Indien een aannemer ingevolge een overeenkomst met een onderaannemer, ten behoeve van de voldoening van
      loonbelasting en sociale verzekeringspremies met betrekking tot het door die onderaannemer aangenomen werk,
      een bedrag heeft overgemaakt op een rekening die door die onderaannemer ten behoeve van de betaling van
      loonbelasting en sociale verzekeringspremies wordt gehouden bij een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank mag uitoefenen wordt het bedrag waarvoor
      de aansprakelijkheid van de aannemer uit hoofde van het eerste lid met betrekking tot dat werk in eerste aanleg
      bestaat, verminderd met dat overgemaakte bedrag. De vorige volzin is niet van toepassing voor zover de aannemer
      wist of redelijkerwijs moest vermoeden dat een onderaannemer in gebreke zou blijven het op de in de eerste volzin
      bedoelde rekening gestorte bedrag aan te wenden voor de betaling van loonbelasting of sociale verzekeringspremies.
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de toepassing van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '35.6'
    text: |-
      De aansprakelijkheid op grond van het eerste lid geldt niet met betrekking tot de loonbelasting verschuldigd door
      een onderaannemer, indien aannemelijk is dat het niet betalen door de onderaannemer noch aan hem noch aan een
      aannemer is te wijten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35
  - number: 35a.1
    text: |-
      De opdrachtgever is hoofdelijk aansprakelijk voor de loonbelasting ter zake van een werk, inhoudende de
      vervaardiging en elke daarop gerichte handeling van kleding, andere dan schoeisel:
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35a.1.a
    text: |-
      die de aannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende onderaannemers wordt
      uitgevoerd, iedere volgende onderaannemer verschuldigd is in verband met het verrichten van werkzaamheden door zijn
      werknemers ter zake van dat werk;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35a.1.b
    text: |-
      voor de betaling waarvan de aannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende
      onderaannemers wordt uitgevoerd, iedere volgende onderaannemer ingevolge [artikel 35][ref1] hoofdelijk
      aansprakelijk is ter zake van dat werk.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel35
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
  - number: 35a.2
    text: |-
      In dit artikel wordt onder opdrachtgever verstaan degene die buiten dienstbetrekking in de normale uitoefening van
      zijn bedrijf met een ander, de aannemer, een overeenkomst heeft gesloten om voor hem een werk als bedoeld in het
      eerste lid uit te voeren tegen een te betalen prijs.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35a.3
    text: |-
      Voor de toepassing van dit artikel wordt met een opdrachtgever gelijkgesteld degene die buiten dienstbetrekking
      in de normale uitoefening van zijn bedrijf kleding, andere dan schoeisel, koopt die nog geheel of gedeeltelijk
      vervaardigd moet worden en met een aannemer de verkoper daarvan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35a.4
    text: |-
      [Artikel 35, tweede lid, derde lid, onderdelen a en c, en vijfde lid][ref1], is van overeenkomstige toepassing, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel35
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
  - number: 35a.4.a
    text: |-
      in het tweede lid, onderdeel a, van dat artikel voor een werk van stoffelijke aard moet worden gelezen: een werk,
      inhoudende de vervaardiging en elke daarop gerichte handeling van kleding, andere dan schoeisel;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35a.4.b
    text: |-
      de toepassing van het derde lid, onderdeel a, van dat artikel er niet toe kan leiden dat de wederpartij van de
      aannemer als opdrachtgever als bedoeld in het tweede lid wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35a.4.c
    text: |-
      in het vijfde lid van dat artikel voor «aannemer» moet worden gelezen: opdrachtgever, voor «onderaannemer»:
      aannemer en voor «het eerste lid»: het eerste lid van artikel 35a.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35a.5
    text: |-
      De aansprakelijkheid op grond van het eerste lid geldt niet met betrekking tot de loonbelasting verschuldigd door
      de aannemer of een onderaannemer, indien aannemelijk is dat het niet betalen door de aannemer of een onderaannemer
      noch aan de opdrachtgever, noch aan de aannemer of een onderaannemer is te wijten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35a
  - number: 35b
    text: |-
      Indien de belastingschuld betrekking heeft op een werk als bedoeld in [artikel 35a, eerste lid][ref1], is degene
      die buiten dienstbetrekking in de normale uitoefening van zijn bedrijf vervaardigde kleding koopt, hoofdelijk
      aansprakelijk voor de loonbelasting welke verschuldigd is ter zake van dat werk, tenzij aannemelijk is dat hij op
      het tijdstip van de koop niet wist of behoorde te weten dat ter zake van dat werk te weinig of geen loonbelasting
      zou worden betaald. In afwijking in zoverre van [artikel 32, tweede lid][ref2], is degene die op grond van de
      eerste volzin aansprakelijk is niet aansprakelijk voor de in verband met de heffing van loonbelasting opgelegde
      bestuurlijke boete. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing
      van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel32
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 35a
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '32'
        hoofdstuk: VI
        afdeling: '1'
  - number: '36.1'
    text: |-
      Hoofdelijk aansprakelijk is voor de loonbelasting, de omzetbelasting, de accijns, de
      verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak, de in
      [artikel 1 van de Wet belastingen op milieugrondslag][ref1] genoemde belastingen en de
      kansspelbelasting verschuldigd door een rechtspersoonlijkheid bezittend lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref2] dat volledig rechtsbevoegd is, voor zover het aan de heffing van
      vennootschapsbelasting is onderworpen: ieder van de bestuurders overeenkomstig het bepaalde in de volgende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002320
  - number: '36.2'
    text: |-
      Het lichaam als bedoeld in het eerste lid is verplicht om onverwijld nadat gebleken is dat het niet tot betaling
      van loonbelasting, omzetbelasting, accijns, verbruiksbelasting van alcoholvrije dranken, verbruiksbelasting van
      pruimtabak of snuiftabak, een van de in [artikel 1 van de Wet belastingen op milieugrondslag][ref1] genoemde
      belastingen of de kansspelbelasting in staat is, daarvan schriftelijk mededeling te doen aan de ontvanger en,
      indien de ontvanger dit verlangt, nadere inlichtingen te verstrekken en stukken over te leggen. Elke bestuurder
      is bevoegd om namens het lichaam aan deze verplichting te voldoen. Bij of krachtens algemene maatregel van bestuur
      worden nadere regels gesteld met betrekking tot de inhoud van de mededeling, de aard en de inhoud van de te
      verstrekken inlichtingen en de over te leggen stukken, alsmede de termijnen waarbinnen het doen van de mededeling,
      het verstrekken van de inlichtingen en het overleggen van de stukken dienen te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
  - number: '36.3'
    text: |-
      Indien het lichaam op juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan, is een
      bestuurder aansprakelijk indien aannemelijk is, dat het niet betalen van de belastingschuld het gevolg is van
      aan hem te wijten kennelijk onbehoorlijk bestuur in de periode van drie jaren, voorafgaande aan het tijdstip van
      de mededeling.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
  - number: '36.4'
    text: |-
      Indien het lichaam niet of niet op juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan,
      is een bestuurder op de voet van het bepaalde in het derde lid aansprakelijk, met dien verstande dat wordt vermoed
      dat de niet betaling aan hem is te wijten en dat de periode van drie jaren wordt geacht in te gaan op het tijdstip
      waarop het lichaam in gebreke is. Tot de weerlegging van het vermoeden wordt slechts toegelaten de bestuurder
      die aannemelijk maakt dat het niet aan hem is te wijten dat het lichaam niet aan zijn in het tweede lid bedoelde
      verplichting heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
  - number: '36.5'
    text: 'Voor de toepassing van dit artikel wordt onder bestuurder mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
  - number: 36.5.a
    text: de gewezen bestuurder tijdens wiens bestuur de belastingschuld is ontstaan;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
  - number: 36.5.b
    text: |-
      degene ten aanzien van wie aannemelijk is dat hij het beleid van het lichaam heeft bepaald of mede heeft bepaald
      als ware hij bestuurder, met uitzondering van de door de rechter benoemde bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
  - number: 36.5.c
    text: |-
      indien een bestuurder van een lichaam een lichaam is in de zin van de [Algemene wet inzake rijksbelastingen][ref1]:
      ieder van de bestuurders van het laatstbedoelde lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '36.6'
    text: De tweede volzin van het vierde lid is niet van toepassing op de gewezen bestuurder.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
  - number: '36.7'
    text: |-
      Voor de toepassing van dit artikel wordt onder belasting uitsluitend verstaan de belasting die het lichaam als
      inhoudingsplichtige of als ondernemer is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
  - number: '36.8'
    text: |-
      Indien de bestuurder van het lichaam ingevolge dit artikel aansprakelijk is en niet in staat is tot betaling
      van zijn schuld terzake, zijn de door die bestuurder onverplicht verrichte rechtshandelingen waardoor de
      mogelijkheid tot verhaal op hem is verminderd, vernietigbaar en kan de ontvanger deze vernietigingsgrond inroepen,
      indien aannemelijk is dat deze rechtshandelingen geheel of nagenoeg geheel met dat oogmerk zijn verricht.
      [Artikel 45, leden 4 en 5, van Boek 3 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel45
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '45'
  - number: 36b.1
    text: |-
      Hoofdelijk aansprakelijk is voor de loonbelasting of de omzetbelasting waarvoor een rechtspersoonlijkheid
      bezittend lichaam in de zin van de [Algemene wet inzake rijksbelastingen][ref1] dat volledig rechtsbevoegd
      is, voorzover het aan de heffing van de vennootschapsbelasting is onderworpen, bij beschikking als bedoeld in
      [artikel 49, eerste lid][ref2], aansprakelijk is gesteld (aansprakelijkheidsschuld): ieder van de bestuurders van
      dat lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel49
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '49'
        hoofdstuk: VI
        afdeling: '2'
  - number: 36b.2
    text: |-
      [Artikel 36, tweede tot en met zesde lid en achtste lid][ref1], is van overeenkomstige toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel36
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
  - number: 36b.2.a
    text: |-
      in het [tweede lid van artikel 36][ref1] voor «loonbelasting, omzetbelasting, accijns, verbruiksbelasting
      voor alcoholvrije dranken, verbruiksbelasting van pruimtabak of snuiftabak, een van de in
      [artikel 1 van de Wet belastingen op milieugrondslag][ref2] genoemde belastingen of de kansspelbelasting» moet
      worden gelezen: de aansprakelijkheidsschuld;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '1'
  - number: 36b.2.b
    text: |-
      in het [derde lid van artikel 36][ref1] voor «belastingschuld» moet worden gelezen «aansprakelijkheidsschuld», en
      voor «drie jaren»: zeven jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel36
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
  - number: 36b.2.c
    text: |-
      in het [vierde lid van artikel 36][ref1] voor «drie jaren» moet worden gelezen: zeven jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel36
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
  - number: 36b.2.d
    text: |-
      in het [vijfde lid, onderdeel a, van artikel 36][ref1] voor «belastingschuld» moet worden gelezen:
      aansprakelijkheidsschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel36
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
  - number: '37.1'
    text: |-
      Voor zover zulks niet reeds uit [artikel 33, eerste lid, onderdeel b][ref1], volgt is hoofdelijk aansprakelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel33
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '33'
        hoofdstuk: VI
        afdeling: '1'
  - number: 37.1.a
    text: voor de loonbelasting verschuldigd door een niet in Nederland wonende of gevestigde inhoudingsplichtige,
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel37
  - number: 37.1.b
    text: voor de omzetbelasting verschuldigd door een niet in Nederland wonende of gevestigde ondernemer,
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel37
  - number: 37.1.c
    text: |-
      voor de loonbelasting die een niet in Nederland wonende of gevestigde aannemer, opdrachtgever of koper is
      verschuldigd op grond van de [artikelen 35][ref1], [35a][ref2] of [35b][ref3]: de leider van de vaste inrichting in
      Nederland, de in Nederland wonende of gevestigde vaste vertegenwoordiger, of degene die de leiding heeft van de in
      Nederland verrichte werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel35b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: 35a
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: 35b
        hoofdstuk: VI
        afdeling: '1'
  - number: '37.2'
    text: |-
      Hoofdelijk aansprakelijk voor de loonbelasting met betrekking tot de gage van de niet in Nederland wonende artiest
      of beroepssporter dan wel het buitenlandse gezelschap is de persoon die of het lichaam dat het optreden of de
      sportbeoefening in Nederland organiseert, mede organiseert of doet organiseren.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel37
  - number: '37.3'
    text: |-
      Degene die op grond van het eerste lid aansprakelijk is, is niet aansprakelijk voor zover hij bewijst dat het niet
      aan hem is te wijten dat door de inhoudingsplichtige, door de ondernemer, dan wel door de aannemer, opdrachtgever
      of koper de belasting niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel37
  - number: '38.1'
    text: 'Hoofdelijk aansprakelijk is:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel38
  - number: 38.1.a
    text: |-
      voor de van een werknemer, een artiest, een beroepssporter of een buitenlands gezelschap ten onrechte niet
      ingehouden loonbelasting: de werknemer, de artiest, de beroepssporter, het gezelschap of de leden van het
      gezelschap;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel38
  - number: 38.1.b
    text: 'voor de van een belastingplichtige ten onrechte niet ingehouden kansspelbelasting: de belastingplichtige.'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel38
  - number: '38.2'
    text: |-
      Niet aansprakelijk is de werknemer, de artiest, de beroepssporter, het buitenlandse gezelschap, het lid
      van het buitenlandse gezelschap of de belastingplichtige die de inspecteur omtrent de nalatigheid van de
      inhoudingsplichtige in kennis heeft gesteld voordat hij weet of redelijkerwijze moet vermoeden dat de inspecteur
      met deze nalatigheid bekend is of bekend zal worden.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel38
  - number: '39'
    text: |-
      Hoofdelijk aansprakelijk is voor de vennootschapsbelasting die over een tijdvak is geheven
      van een fiscale eenheid als bedoeld in [artikel 15, eerste of tweede lid][ref1], of
      [artikel 15a, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref2]: elk van de dochtermaatschappijen,
      onderscheidenlijk elk van de ledenmaatschappijen die in dat tijdvak deel uitmaakt of uitmaakte van die fiscale
      eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15a
  - number: '40.1'
    text: |-
      De natuurlijke persoon die, al dan niet tezamen met zijn partner en zijn bloedverwanten in de rechte
      lijn, of het lichaam dat, al dan niet tezamen met een of meer verbonden lichamen als bedoeld in
      [artikel 10a van de Wet op de vennootschapsbelasting 1969][ref1], direct of indirect, voor ten minste één derde
      gedeelte van het geplaatste kapitaal aandeelhouder is in een vennootschap waarvan het kapitaal geheel of ten
      dele in aandelen is verdeeld en waarvan de bezittingen in belangrijke mate bestaan uit beleggingen, daaronder
      begrepen liquide middelen, en die aandelen of een gedeelte daarvan vervreemdt, is aansprakelijk voor een gedeelte
      van de vennootschapsbelasting die de desbetreffende vennootschap is verschuldigd aan het einde van het jaar
      waarin de vervreemding plaatsvindt en de vennootschapsbelasting die verschuldigd wordt over de drie jaren daarna
      in verband met de op het tijdstip van de vervreemding aanwezige stille en in het kader van de heffing van de
      vennootschapsbelasting toegelaten fiscale reserves indien het vermogen van de vennootschap anders dan ten gevolge
      van de normale bedrijfsvoering van de vennootschap is verminderd in de vijf jaren voorafgaande aan het jaar van de
      vervreemding, in het jaar van de vervreemding, dan wel in de drie jaren daarna.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: '40.2'
    text: |-
      Degene die op grond van het eerste lid aansprakelijk is, is niet aansprakelijk voorzover zekerheid is gesteld voor
      het in het eerste lid bedoelde gedeelte van de vennootschapsbelasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
  - number: '40.3'
    text: |-
      Het in het eerste lid bedoelde gedeelte van de vennootschapsbelasting waarvoor de aansprakelijkheid geldt, wordt
      bepaald naar het gedeelte van het vermogen van de vennootschap waarop krachtens de vervreemde aandelen aanspraak
      zou kunnen worden gemaakt ingeval op het tijdstip van de vervreemding de vennootschap zou worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
  - number: '40.4'
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing met betrekking tot de vervreemder van een
      belang of een gedeelte daarvan in een lichaam dat een niet in aandelen verdeeld kapitaal heeft. Voor de toepassing
      van de eerste volzin wordt onder belang verstaan een gerechtigdheid, direct of indirect, tot ten minste een derde
      gedeelte van het vermogen of van het resultaat van het lichaam.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
  - number: '40.5'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing met betrekking tot de
      aandeelhouder of belanghouder in een lichaam ingeval dat lichaam een deelneming in de zin van de
      [Wet op de vennootschapsbelasting 1969][ref1] geheel of voor een gedeelte vervreemdt en de aandeelhouder of
      belanghouder voldoet aan het kwantitatieve criterium van het eerste lid onderscheidenlijk vierde lid, tweede
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002672
  - number: '40.6'
    text: |-
      Een persoon of lichaam is, in afwijking van het eerste lid, niet aansprakelijk voor de
      vennootschapsbelasting die is of wordt verschuldigd in verband met een op het tijdstip van de
      vervreemding van de aandelen bij de vennootschap aanwezige egalisatiereserve als bedoeld in
      [artikel 3.53, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1] en de op dat tijdstip bij de
      vennootschap aanwezige stille reserves, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 40.6.a
    text: deze reserves betrekking hebben op roerende zaken, onroerende zaken of vermogensrechten;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
  - number: 40.6.b
    text: |-
      de zaken en rechten waarop de reserves betrekking hebben ten minste gedurende zes maanden na de vervreemding van de
      aandelen in bezit zijn van de vennootschap; en
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
  - number: 40.6.c
    text: |-
      de persoon of het lichaam bewijst dat het niet aan hem is te wijten dat het vermogen van de vennootschap
      ontoereikend is voor het voldoen van de vennootschapsbelasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel40
  - number: '41.1'
    text: |-
      Hoofdelijk aansprakelijk is voor de vennootschapsbelasting en de dividendbelasting verschuldigd door een lichaam
      dat aan de heffing van vennootschapsbelasting is onderworpen en waarvan de plaats van vestiging niet langer in
      Nederland is gelegen: ieder van de met de verplaatsing belaste personen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel41
  - number: '41.2'
    text: |-
      Degene die op grond van het eerste lid aansprakelijk is, is niet aansprakelijk voor zover hij bewijst dat het niet
      aan hem is te wijten dat de belasting niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel41
  - number: '42.1'
    text: |-
      Indien krachtens [artikel 18 van de Wet op belastingen van rechtsverkeer][ref1] (*Stb.* 1970, 611)
      overdrachtsbelasting ter zake van een verkrijging moet worden voldaan ter gelegenheid van de aanbieding ter
      registratie van de door de notaris ter zake opgemaakte akte, is de notaris hoofdelijk aansprakelijk voor die
      belasting tot het bedrag dat ingevolge de inhoud van de akte is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel18
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '18'
  - number: '42.2'
    text: |-
      Indien overdrachtsbelasting verschuldigd is ter zake van een verkrijging als bedoeld in
      [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref1] en het eerste lid niet van toepassing
      is, is degene die de economische eigendom overdraagt hoofdelijk aansprakelijk voor die belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
  - number: 42a
    text: |-
      Natuurlijke personen voor wie, anders dan als ondernemer in de zin van de [Wet op de omzetbelasting 1968][ref1],
      diensten worden verricht als bedoeld in [artikel 6j, aanhef en onderdeel a, van die wet][ref2], zijn hoofdelijk
      aansprakelijk voor de omzetbelasting die verschuldigd is door de ondernemer die de dienst verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel6j
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 6j
  - number: 42c.1
    text: |-
      Hoofdelijk aansprakelijk voor de omzetbelasting die verschuldigd is ter zake van de levering van bij ministeriële
      regeling aan te wijzen goederen, is de natuurlijke persoon of rechtspersoon, die ondernemer is in de zin van de
      [Wet op de omzetbelasting 1968][ref1], aan wie de levering is verricht en die wist of behoorde te weten dat de ter
      zake van die levering verschuldigde omzetbelasting niet of niet volledig is of zal worden voldaan. De vorige volzin
      is van overeenkomstige toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 42c.1.a
    text: |-
      ondernemers die voorafgaand aan de in die volzin bedoelde levering leveringen van die goederen hebben verricht,
      indien deze leveringen hebben plaatsgevonden op of na de datum waarop die goederen bij ministeriële regeling zijn
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42c
  - number: 42c.1.b
    text: ondernemers aan wie op de in die volzin bedoelde levering volgende leveringen van die goederen zijn verricht;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42c
  - number: 42c.1.c
    text: |-
      de ondernemer die tezamen met de op grond van de voorgaande bepalingen van dit lid aansprakelijke ondernemer
      ingevolge [artikel 7, vierde lid, van de Wet op de omzetbelasting 1968][ref1] is aangemerkt of is aangemerkt
      geweest als één ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 42c.2
    text: |-
      Voor de toepassing van het eerste lid wordt een ondernemer geacht te hebben geweten dat de omzetbelasting die
      verschuldigd is ter zake van de in dat lid bedoelde levering niet of niet volledig is of zal worden voldaan, indien
      hij door het niet of niet volledig voldaan zijn van de in dat lid bedoelde belasting voordeel heeft behaald, tenzij
      hij aannemelijk maakt dat dat voordeel niet voortvloeit uit of geen verband houdt met het niet of niet volledig
      voldaan zijn van die belasting. Voor de toepassing van de eerste volzin wordt een ondernemer in ieder geval geacht
      voordeel te hebben behaald als aan hem voor de goederen een vergoeding in rekening is gebracht die op het tijdstip
      van de levering lager is dan het bedrag dat bij vrije mededinging zou moeten worden betaald of die lager is dan de
      vergoeding die aan zijn leverancier of aan elk van de leveranciers ter zake van voorafgaande verkrijgingen van die
      goederen in rekening is gebracht.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42c
  - number: 42c.3
    text: |-
      Dit artikel is niet van toepassing indien de in het eerste lid bedoelde omzetbelasting verschuldigd is ter
      zake van een tijdens surséance van betaling of faillissement, of tijdens het van toepassing zijn van de
      schuldsaneringsregeling natuurlijke personen, verrichte levering door een ondernemer, diens bewindvoerder
      of curator of door een pandhouder in het kader van de uitoefening van een op de geleverde goederen gevestigd
      pandrecht.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42c
  - number: 42d
    text: |-
      Hoofdelijk aansprakelijk is voor de omzetbelasting die verschuldigd is ter zake van de levering van een zaak: de
      pandhouder, de hypotheekhouder of de executant die zich heeft verhaald op het door de koper betaalde bedrag, voor
      zover dat betrekking heeft op de ter zake van de levering verschuldigde omzetbelasting. De eerste volzin is niet
      van toepassing ingeval de pandhouder, onderscheidenlijk de hypotheekhouder, onderscheidenlijk de executant, niet
      wist en ook niet behoorde te weten dat de omzetbelasting niet of niet volledig door de belastingschuldige is of zal
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel42d
  - number: '43.1'
    text: |-
      Natuurlijke personen en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1], die ingevolge
      [artikel 7, vierde lid, van de Wet op de omzetbelasting 1968][ref2] zijn aangemerkt als één ondernemer, zijn
      hoofdelijk aansprakelijk voor de omzetbelasting welke verschuldigd is door deze ondernemer, dan wel - indien de
      inspecteur niet schriftelijk ervan in kennis is gesteld dat op grond van gewijzigde omstandigheden niet langer een
      eenheid bestaat als is bedoeld in die bepaling - door deze personen en lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '43.2'
    text: |-
      Indien aan de ondernemer, bedoeld in het eerste lid, een vermindering of teruggaaf van omzetbelasting wordt
      verleend, kan de ontvanger, met inachtneming van [artikel 54][ref1], deze vermindering of teruggaaf bevrijdend
      voldoen aan één van de natuurlijke personen of lichamen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel54
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '54'
        hoofdstuk: VI
        afdeling: '2'
  - number: 43a
    text: |-
      Bij toepassing van [artikel 32 van de Wet op de loonbelasting 1964][ref1] is iedere inhoudingsplichtige die
      ingevolge het eerste lid van dat artikel samen met andere inhoudingsplichtigen als één inhoudingsplichtige
      wordt beschouwd hoofdelijk aansprakelijk voor de loonbelasting die deze inhoudingsplichtigen ingevolge
      dat artikel gezamenlijk zijn verschuldigd met betrekking tot vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g, van de Wet op de loonbelasting 1964][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '44.1'
    text: |-
      Indien op grond van [artikel 2.15 van de Wet inkomstenbelasting 2001][ref1] inkomensbestanddelen van
      een minderjarig kind zijn toegerekend aan de belastingschuldige, is dat kind aansprakelijk voor een
      gedeelte van de verschuldigde inkomstenbelasting. Dit gedeelte wordt gesteld op een evenredig gedeelte
      van de verschuldigde belasting, bepaald naar de verhouding waarin het belastbare resultaat uit overige
      werkzaamheden, bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b, en derde lid][ref2], en
      [3.92 van de Wet inkomstenbelasting 2001][ref3], de belastbare inkomsten uit eigen woning, het belastbare inkomen
      uit aanmerkelijk belang of het belastbare inkomen uit sparen en beleggen van dat kind dat bij de vaststelling van
      de belastingschuld in aanmerking is genomen, staat tot het inkomen uit werk en woning, het inkomen uit aanmerkelijk
      belang onderscheidenlijk het belastbare inkomen uit sparen en beleggen dat tot de belastingschuld heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '44.2'
    text: |-
      Indien op grond van [artikel 2.17, tweede tot en met zesde lid, van de Wet inkomstenbelasting 2001][ref1]
      belastbare inkomsten uit eigen woning, inkomen uit aanmerkelijk belang vóór vermindering met de persoonsgebonden
      aftrek of bestanddelen van de rendementsgrondslag van een derde geacht worden bij de belastingschuldige op te
      komen, te zijn opgekomen of tot zijn bezit te behoren dan wel te hebben behoord, is die derde aansprakelijk voor
      een gedeelte van de verschuldigde inkomstenbelasting. Dit gedeelte wordt gesteld op een evenredig gedeelte van de
      verschuldigde belasting, bepaald naar de verhouding waarin de belastbare inkomsten uit eigen woning, het inkomen
      uit aanmerkelijk belang of het belastbare inkomen uit sparen en beleggen van die derde dat bij de vaststelling van
      de belastingschuld in aanmerking is genomen, staat tot het inkomen uit werk en woning, het inkomen uit aanmerkelijk
      belang onderscheidenlijk het belastbare inkomen uit sparen en beleggen dat tot de belastingschuld heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '44.3'
    text: |-
      [Artikel 2.16, derde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 44a.1
    text: |-
      Indien ingevolge de [artikelen 3.133][ref1], [3.135][ref2] of [3.136 van de Wet inkomstenbelasting 2001][ref3],
      premies voor een aanspraak op periodieke uitkeringen als negatieve uitgaven voor inkomensvoorzieningen in
      aanmerking worden genomen, is de verzekeraar van die aanspraak tot ten hoogste de waarde in het economische verkeer
      daarvan aansprakelijk voor de belasting die ter zake door de verzekeringnemer of de gerechtigde is verschuldigd,
      alsmede voor de revisierente die ingevolge [artikel 30][ref4] in verband daarmee is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel30i
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 30i
  - number: 44a.2
    text: |-
      Het bedrag van de verschuldigde belasting wordt gesteld op het evenredig gedeelte van de belasting die
      meer is verschuldigd ter zake van alle in het jaar ingevolge de [artikelen 3.133][ref1], [3.135][ref2]
      of [3.136 van de Wet inkomstenbelasting 2001][ref3], als negatieve uitgaven voor inkomensvoorzieningen
      in aanmerking genomen premies alsmede het over die premies behaalde rendement, bedoeld in
      [artikel 3 137 van de Wet inkomstenbelasting 2001][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 44a.3
    text: |-
      [Artikel 2.16, derde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 44a.4
    text: |-
      Zo spoedig mogelijk nadat de aansprakelijkheid ingevolge het eerste lid is ontstaan, wordt aan de verzekeraar
      schriftelijk mededeling gedaan van het bedrag waarvoor deze aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44a
  - number: 44a.5
    text: |-
      Bij ministeriële regeling kan worden bepaald dat degene die op grond van het eerste
      lid aansprakelijk is, niet aansprakelijk is indien de lijfrenteverplichting in de in
      [artikel 3.133, tweede lid, onderdeel h, van de Wet inkomstenbelasting 2001][ref1] bedoelde situatie overgaat,
      of beoordeeld aan het einde van het kalenderjaar in enig voorafgaand kalenderjaar is overgegaan, op een niet
      in Nederland gevestigd pensioenfonds of lichaam dat het verzekeringsbedrijf uitoefent en dit pensioenfonds of
      lichaam aansprakelijkheid aanvaardt voor de belasting die terzake door de verzekeringnemer of de gerechtigde
      is verschuldigd, alsmede voor de in verband daarmee verschuldigde revisierente. De eerste volzin is van
      overeenkomstige toepassing indien de verzekeringnemer of de gerechtigde terzake voldoende zekerheid heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 44a.6
    text: |-
      Indien met betrekking tot een lijfrenterekening of lijfrentebeleggingsrecht als bedoeld in
      [artikel 3.126a van de Wet inkomstenbelasting 2001][ref1] negatieve uitgaven voor inkomensvoorziening in aanmerking
      worden genomen, is dit artikel van overeenkomstige toepassing met betrekking tot de bank of beleggingsonderneming
      waarbij de lijfrenterekening wordt aangehouden, onderscheidenlijk de beheerder van het lijfrentebeleggingsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 44a.7
    text: |-
      Dit artikel is niet van toepassing op de belasting en revisierente ter zake van negatieve
      uitgaven voor inkomensvoorzieningen die in aanmerking zijn genomen in verband met een afkoop als
      bedoeld in [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref1],
      voor zover de afkoop heeft geleid tot afkoopsommen ter zake waarvan met toepassing van
      [artikel 34, tweede lid, van de Wet op de loonbelasting 1964][ref2] een heffing is verschuldigd naar een tarief
      van 52%.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel34
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '34'
  - number: 44b.1
    text: |-
      Indien ingevolge de toepassing van
      [artikel 19b, eerste lid of tweede lid, eerste volzin, van de Wet op de loonbelasting 1964][ref1] in verbinding
      met [artikel 3.81 van de Wet inkomstenbelasting 2001][ref2] of van [artikel 3.83, eerste of tweede lid][ref3],
      dan wel [artikel 7.2, achtste lid, van de laatstgenoemde wet][ref4] de aanspraak ingevolge een pensioenregeling
      tot het loon wordt gerekend is de verzekeraar van die aanspraak tot ten hoogste de waarde in het economische
      verkeer daarvan aansprakelijk voor de belasting die terzake door de gerechtigde is verschuldigd, alsmede voor de
      revisierente die ingevolge [artikel 30i van de Algemene wet inzake rijksbelastingen][ref5] in verband daarmee is
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel30i
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 30i
  - number: 44b.2
    text: |-
      Het bedrag van de verschuldigde belasting wordt gesteld op het evenredig gedeelte van de
      belasting die meer is verschuldigd terzake van alle in het jaar ingevolge de toepassing van
      [artikel 19b, eerste lid of tweede lid, eerste volzin, van de Wet op de loonbelasting 1964][ref1]
      of van [artikel 3.83, eerste of tweede lid][ref2], dan wel
      [artikel 7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref3] tot loon gerekende aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 44b.3
    text: |-
      [Artikel 2.16, derde lid, van de Wet inkomstenbelasting 2001][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 44b.4
    text: |-
      Zo spoedig mogelijk nadat de aansprakelijkheid ingevolge het eerste lid is ontstaan, wordt aan de verzekeraar
      schriftelijk mededeling gedaan van het bedrag waarvoor deze aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44b
  - number: 44b.5
    text: |-
      Bij ministeriële regeling kan worden bepaald dat degene die op grond van het eerste lid aansprakelijk
      is, niet aansprakelijk is indien de verplichting ingevolge een pensioenregeling in de in
      [artikel 19b, zesde lid, van de Wet op de loonbelasting 1964][ref1] bedoelde situatie overgaat op een niet in
      Nederland gevestigd pensioenfonds of lichaam dat het verzekeringsbedrijf uitoefent en dit pensioenfonds of lichaam
      aansprakelijkheid aanvaardt voor de belasting die terzake door de gerechtigde is verschuldigd, alsmede voor
      de in verband daarmee verschuldigde revisierente. De eerste volzin is van overeenkomstige toepassing indien de
      verzekeringnemer of de gerechtigde terzake voldoende zekerheid heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
  - number: '45.1'
    text: |-
      Voor belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd ter zake van geconserveerd inkomen
      als bedoeld in [artikel 2.8, zevende lid, van de Wet inkomstenbelasting 2001][ref1] is aansprakelijk degene aan
      wie de belastingschuldige de aandelen of winstbewijzen heeft vervreemd en welke vervreemding heeft geleid tot het
      geconserveerde inkomen, of, voor zover aandelen of winstbewijzen nadien zijn geschonken waarbij het uitstel op
      grond van [artikel 25, achtste lid, onderdeel a][ref2], is voortgezet, degene die deze aandelen of winstbewijzen
      heeft verkregen, voor zover de belastingschuld aan die aandelen of winstbewijzen kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '45.2'
    text: |-
      Aansprakelijkheid op grond van het eerste lid ontstaat indien het uitstel van betaling op grond van
      [artikel 25, achtste lid, onderdelen a, b of c][ref1], is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '46.1'
    text: |-
      Ieder van de erfgenamen is naar evenredigheid van zijn erfdeel aansprakelijk voor de door en bij het overlijden van
      de erflater door de legatarissen verschuldigde erfbelasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel46
  - number: '46.2'
    text: |-
      De erfgenamen zijn hoofdelijk aansprakelijk voor de erfbelasting die door en bij het overlijden van de erflater is
      verschuldigd door verkrijgers die buiten Nederland wonen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel46
  - number: '46.3'
    text: De schenker is hoofdelijk aansprakelijk voor de schenkbelasting verschuldigd door de begiftigde.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel46
  - number: '47.1'
    text: |-
      Executeurs en door de rechter benoemde vereffenaars van nalatenschappen zijn hoofdelijk aansprakelijk voor al de
      door en bij het overlijden van de erflater verschuldigde erfbelasting, tenzij de aangifte voor de erfbelasting niet
      door hen is gedaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel47
  - number: '47.2'
    text: |-
      De aansprakelijkheid op grond van het eerste lid geldt niet voor zover een executeur aannemelijk maakt dat het
      niet aan hem te wijten is dat de aanslag tot een te laag bedrag is vastgesteld of anderszins te weinig belasting
      is geheven.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel47
  - number: '48.1'
    text: |-
      Erfgenamen zijn niet verder aansprakelijk dan ieder tot het beloop van zijn erfdeel vermeerderd met het bedrag van
      hetgeen hem is gelegateerd - één en ander naar de waarde in het economische verkeer op het tijdstip van overlijden
      van de erflater - voor:
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel48
  - number: 48.1.a
    text: navorderings- en naheffingsaanslagen die na het overlijden van de belastingschuldige worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel48
  - number: 48.1.b
    text: |-
      bedragen die na het overlijden van de hoofdelijk aansprakelijk gestelde worden vastgesteld op de voet van
      [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel49
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '49'
        hoofdstuk: VI
        afdeling: '2'
  - number: '48.2'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel *b*, zijn erfgenamen niet aansprakelijk voor bedragen
      waarvoor de ontvanger de erflater op grond van [artikel 36][ref1] of [36b][ref2] na diens overlijden aansprakelijk
      stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel36b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: 36b
        hoofdstuk: VI
        afdeling: '1'
  - number: 48a
    text: |-
      Een derde die kan beschikken over een bankrekeningnummer waarop inkomstenbelasting is uitbetaald, is hoofdelijk
      aansprakelijk voor de inkomstenbelasting die een belastingschuldige is verschuldigd voor zover het bedrag
      aan verschuldigde inkomstenbelasting is betaald op die bankrekening. Voor zover een verschuldigd bedrag aan
      inkomstenbelasting voortvloeit uit de toepassing van [artikel 15 van de Algemene wet inzake rijksbelastingen][ref1],
      wordt het bedrag waarvoor de derde aansprakelijk is, bepaald op het gedeelte van het door de belastingschuldige
      verschuldigde bedrag dat in dezelfde verhouding staat tot het door de belastingschuldige verschuldigde bedrag als
      de aan de derde over het belastingjaar uitbetaalde voorlopige teruggaaf inkomstenbelasting in verhouding staat tot
      het totale bedrag van de over het belastingjaar uitbetaalde voorlopige teruggaven inkomstenbelasting, een en ander
      voor zover dit bedrag kan worden toegerekend aan de aan die derde uitbetaalde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel15
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '15'
  - number: '49.1'
    text: |-
      Aansprakelijkstelling geschiedt bij voor bezwaar vatbare beschikking door de ontvanger en vindt niet plaats vóór
      het tijdstip waarop de belastingschuldige in gebreke is met de betaling van zijn belastingschuld. De beschikking
      vermeldt in ieder geval het bedrag waarvoor de aansprakelijkheid bestaat en de termijn waarbinnen het bedrag moet
      worden betaald. Voor zover de aansprakelijkstelling betrekking heeft op een bestuurlijke boete, geschiedt zij met
      overeenkomstige toepassing van [hoofdstuk VIIIA, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '49.2'
    text: |-
      Op de in het eerste lid bedoelde beschikking is [afdeling 4.4.2 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.2
  - number: '49.3'
    text: De ontvanger maakt de beschikking bekend door toezending als aangetekend stuk.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
  - number: '49.4'
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de in het eerste lid bedoelde beschikking is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '49.5'
    text: |-
      Met betrekking tot het vierde lid zijn de [artikelen 25, derde lid][ref1], en
      [27e van de Algemene wet inzake rijksbelastingen][ref2] niet van toepassing indien het niet aan de aansprakelijk
      gestelde is te wijten dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27e
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 27e
  - number: 49.5.a
    text: de vereiste aangifte niet is gedaan; of
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
  - number: 49.5.b
    text: |-
      niet volledig is voldaan aan de verplichtingen ingevolge de artikelen [41][ref1], [47][ref2],
      [47a][ref3], [49][ref4] en [52 van die wet][ref5], alsmede aan de verplichtingen ingevolge
      [artikel 53, eerste, tweede en derde lid, van die wet][ref6] voor zover het verplichtingen van
      administratieplichtigen betreft ten behoeve van de heffing van de belasting waarvan de inhouding aan hen is
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 47a
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '49'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '49.6'
    text: |-
      De ontvanger stelt de aansprakelijk gestelde desgevraagd op de hoogte van de gegevens met betrekking tot de
      belasting waarvoor hij aansprakelijk is gesteld voor zover deze gegevens voor het maken van bezwaar, het instellen
      van beroep of beroep in cassatie redelijkerwijs van belang kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
  - number: '49.7'
    text: |-
      Het bezwaar kan geen betrekking hebben op feiten of omstandigheden die van belang zijn geweest bij de vaststelling
      van een belastingaanslag en ter zake waarvan een onherroepelijke rechterlijke uitspraak is gedaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel49
  - number: '51.1'
    text: |-
      Op een conservatoir beslag door de ontvanger ten laste van degene die aansprakelijk is of wordt gesteld, is
      [artikel 700, derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel700
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '700'
  - number: '51.2'
    text: 'Het beslag vervalt van rechtswege indien:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel51
  - number: 51.2.a
    text: |-
      de aansprakelijk gestelde bezwaar heeft gemaakt tegen de beschikking, bedoeld in [artikel 49, eerste lid][ref1],
      en de ontvanger niet binnen vier maanden na de dagtekening van de beschikking uitspraak heeft gedaan op het
      bezwaarschrift; of


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel49
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '49'
        hoofdstuk: VI
        afdeling: '2'
  - number: 51.2.b
    text: |-
      vóór het leggen van het beslag geen aansprakelijkstelling heeft plaatsgevonden en aansprakelijkstelling niet alsnog
      plaatsvindt binnen drie maanden na het leggen van het beslag.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel51
  - number: '51.3'
    text: |-
      De voorzieningenrechter van de rechtbank die het verlof tot het leggen van het beslag heeft verleend, kan de
      termijn, bedoeld in het tweede lid, onderdeel b, verlengen indien de ontvanger dit vóór het verstrijken van de
      termijn verzoekt. Tegen de beschikking, bedoeld in de vorige volzin, is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel51
  - number: '51.4'
    text: |-
      Ingeval een conservatoir derdenbeslag van rechtswege is vervallen, stelt de ontvanger de derdebeslagene daarvan
      schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel51
  - number: '52.1'
    text: |-
      Het bedrag, vermeld in een beschikking als bedoeld in [artikel 49, eerste lid][ref1], is invorderbaar zes weken
      na de dagtekening van de beschikking. De [artikelen 9, tiende lid][ref2], [11][ref3], [12][ref4], [13][ref5],
      [14][ref6] en [19][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '49'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '11'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '12'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '19'
        hoofdstuk: III
  - number: '52.2'
    text: |-
      De aansprakelijk gestelde kan tegen de tenuitvoerlegging van een dwangbevel inzake de invordering van een
      aansprakelijkheidsschuld in verzet komen op overeenkomstige wijze als een belastingschuldige op de voet van
      [artikel 17][ref1], met dien verstande dat het bepaalde in het [derde lid van dat artikel][ref2] eveneens
      geldt voor het niet ontvangen zijn van de beschikking, bedoeld in [artikel 49, eerste lid][ref3], en voor
      de omstandigheden die aan de orde zijn of hadden kunnen worden gesteld bij het maken van bezwaar tegen de in
      [artikel 49, eerste lid][ref4], bedoelde beschikking, bij het instellen van beroep ter zake van een uitspraak
      op het desbetreffende bezwaar of bij het instellen van beroep in cassatie ter zake van een uitspraak op het
      desbetreffende beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel49
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '17'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '49'
        hoofdstuk: VI
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '49'
        hoofdstuk: VI
        afdeling: '2'
  - number: '53.1'
    text: |-
      De bepalingen van de [eerste][ref1] en de [tweede afdeling van hoofdstuk IV][ref2] inzake verhaalsrechten en
      verrekening, met uitzondering van [artikel 24, tweede lid][ref3], vinden overeenkomstige toepassing ten aanzien van
      de aansprakelijk gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004770#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004770
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '24'
        hoofdstuk: IV
        afdeling: '2'
  - number: '53.2'
    text: |-
      Het bepaalde in [artikel 25][ref1] met betrekking tot de mogelijkheid van uitstel van betaling vindt
      overeenkomstige toepassing ten aanzien van de aansprakelijk gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '53.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld krachtens welke de aansprakelijk gestelde die niet in staat is
      anders dan met buitengewoon bezwaar het bedrag waarvoor hij aansprakelijk is gesteld geheel of gedeeltelijk te
      voldoen, geheel of gedeeltelijk wordt ontslagen van zijn betalingsverplichting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel53
  - number: '54.1'
    text: |-
      Een teruggaaf als gevolg van een vermindering van een belastingaanslag waarop het door de aansprakelijk
      gestelde betaalde bedrag is afgeboekt, alsmede een teruggaaf als gevolg van een vermindering van een aanslag
      waarmee een voorlopige aanslag, waarop het door de aansprakelijk gestelde betaalde bedrag is afgeboekt,
      op de voet van [artikel 15 van de Algemene wet inzake rijksbelastingen][ref1] is verrekend, komt niet
      toe aan de belastingschuldige doch aan de aansprakelijk gestelde, tot het bedrag dat hij op grond van die
      aansprakelijkstelling heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel15
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '15'
  - number: '54.2'
    text: |-
      Indien een aanslag na de verrekening van een voorlopige aanslag met die aanslag leidt tot een teruggaaf, wordt deze
      teruggaaf voor de toepassing van het eerste lid aangemerkt als een vermindering van de voorlopige aanslag.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel54
  - number: '54.3'
    text: |-
      De ontvanger doet aan de belastingschuldige mededeling van zijn voornemen tot betaling van de in het eerste lid
      bedoelde teruggaaf aan de aansprakelijk gestelde, dan wel van zijn voornemen tot verrekening op de voet van artikel
      24 van die teruggaaf.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel54
  - number: '54.4'
    text: |-
      Indien meer dan één aansprakelijk gestelde recht hebben op dezelfde teruggaaf, komt het bedrag van de teruggaaf toe
      aan ieder van hen naar evenredigheid van ieders op grond van de aansprakelijkstelling betaalde bedrag.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel54
  - number: '55.1'
    text: |-
      Indien verhaal op de belastingschuldige door degene die ingevolge
      [artikel 33, eerste lid, onderdelen a, b of c][ref1], [34][ref2], [35][ref3], [35a][ref4], [35b][ref5], [36][ref6],
      [36b][ref7] of [37][ref8] belasting heeft voldaan geheel of gedeeltelijk onmogelijk blijkt en ter zake van de
      belastingschuld twee of meer personen ingevolge de desbetreffende bepaling hoofdelijk aansprakelijk zijn, dragen
      dezen onderling voor gelijke delen in het onverhaald gebleven deel bij. Indien [artikel 35][ref9], [35a][ref10]
      of [35b][ref11] van toepassing is en het aandeel in het totaal van het uit te voeren werk dat ieder van de
      hoofdelijk aansprakelijken heeft laten uitvoeren kan worden vastgesteld, draagt, in afwijking in zoverre van de
      eerste volzin, ieder in evenredigheid met dat aandeel bij. Voor de toepassing van dit artikel worden voorts de
      opdrachtgever en de koper geacht dat werk geheel te hebben laten uitvoeren door een onderaannemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel35b
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel36
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel36b
      [ref8]: https://wetten.overheid.nl/BWBR0004770#Artikel37
      [ref9]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref10]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref11]: https://wetten.overheid.nl/BWBR0004770#Artikel35b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '33'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '34'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: 35a
        hoofdstuk: VI
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: 35b
        hoofdstuk: VI
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: 36b
        hoofdstuk: VI
        afdeling: '1'
      - id: ref8
        bwb_id: BWBR0004770
        artikel: '37'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref9
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref10
        bwb_id: BWBR0004770
        artikel: 35a
        hoofdstuk: VI
        afdeling: '1'
      - id: ref11
        bwb_id: BWBR0004770
        artikel: 35b
        hoofdstuk: VI
        afdeling: '1'
  - number: '55.2'
    text: |-
      Indien de opdrachtgever ingevolge [artikel 35a][ref1] belasting heeft voldaan, draagt, in afwijking in zoverre van
      het eerste lid, tevens een aannemer bij die met betrekking tot het desbetreffende werk ingevolge [artikel 35][ref2]
      aansprakelijk is. Indien een koper ingevolge [artikel 35b][ref3] belasting heeft voldaan, dragen, in afwijking in
      zoverre van het eerste lid, tevens de opdrachtgever onderscheidenlijk een aannemer bij die met betrekking tot het
      desbetreffende werk ingevolge [artikel 35a][ref4] onderscheidenlijk [artikel 35][ref5] aansprakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel35b
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel35
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel55
    references:
      - id: ref1
