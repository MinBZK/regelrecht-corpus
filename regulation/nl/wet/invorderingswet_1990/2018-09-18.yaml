    text: |-
      Indien een aanspraak ingevolge een pensioenregeling als bedoeld in
      [artikel 38n, eerste lid, van de Wet op de loonbelasting 1964][ref1] ingevolge artikel 38n, tweede lid, van
      die wet gedeeltelijk wordt prijsgegeven en voor het overige wordt omgezet in een aanspraak ingevolge een
      oudedagsverplichting als bedoeld in [artikel 38p van die wet][ref2], wordt:


