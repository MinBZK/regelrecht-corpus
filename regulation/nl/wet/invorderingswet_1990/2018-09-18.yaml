    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.13.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.13.c
    text: |-
      ingeval zich ten aanzien van de medeverkrijger tijdens de in de eerste volzin bedoelde periode een gebeurtenis
      voordoet als bedoeld in [artikel 35e, eerste lid, van de Successiewet 1956][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35e
