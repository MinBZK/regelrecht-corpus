  - number: '4'
    text: |-
      Tot het verrichten van de bij of krachtens de wet aan een deurwaarder opgedragen werkzaamheden is, voor zover
      die werkzaamheden geschieden in opdracht van een ontvanger en betreffen de vervolgingen voor de invordering van
      rijksbelastingen, uitsluitend een belastingdeurwaarder bevoegd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel4
  - number: '5.1'
    text: |-
      De bevoegdheid van een directeur, inspecteur of ontvanger is niet bepaald naar een geografische indeling van het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de functionaris, bedoeld in
      [artikel 2, eerste lid, onderdeel i][ref1], onder wie een belastingschuldige ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
  - number: '6.1'
    text: |-
      De bepalingen van deze wet strekken zich niet alleen uit tot de rijksbelastingen, maar ook tot de daarmee
      samenhangende opcenten, de betalingskorting, de renten en de kosten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel6
  - number: '6.2'
    text: |-
      Onder opcenten worden verstaan niet alleen die welke ten behoeve van de rijksoverheid, doch ook die welke ten
      behoeve van andere openbare lichamen met uitzondering van de BES eilanden worden geheven.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 4:92, eerste lid, van de Algemene wet bestuursrecht][ref1] geschiedt de toerekening van
      de betalingen achtereenvolgens aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7.1.a
    text: de kosten;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7
  - number: 7.1.b
    text: de betalingskorting;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7
  - number: 7.1.c
    text: de rente;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7
  - number: 7.1.d
    text: de belastingaanslag.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7
  - number: '7.2'
    text: |-
      Toerekening van betalingen op een belastingaanslag geschiedt, behoudens voorzover daarvan moet worden
      afgeweken ingevolge deze wet, naar evenredigheid aan de op het aanslagbiljet vermelde in te vorderen
      bedragen, met dien verstande dat indien [artikel 9.1, derde lid, van de Wet inkomstenbelasting 2001][ref1] of
      [artikel 27b, eerste lid, van de Wet op de loonbelasting 1964][ref2] toepassing heeft gevonden, de toerekening in
      de laatste plaats geschiedt aan de premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 27b
  - number: '7.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor een van het eerste lid afwijkende toerekening
      van betalingen op een uitnodiging tot betaling indien het recht van de Europese Unie daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7
  - number: 7a.1
    text: |-
      In afwijking van [artikel 4:89, eerste lid, van de Algemene wet bestuursrecht][ref1] vindt uitbetaling aan
      de belastingschuldige van inkomstenbelasting uitsluitend plaats op een daartoe door de belastingschuldige
      bestemde bankrekening die op naam staat van de belastingschuldige. De belastingschuldige kan
      niet meer dan één bankrekening bestemmen voor de uitbetaling van inkomstenbelasting en voor de in
      [artikel 25 van de Algemene wet inkomensafhankelijke regelingen][ref2] bedoelde uitbetaling van de hem toekomende
      voorschotten en tegemoetkomingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '25'
  - number: 7a.2
    text: |-
      Ingeval de belastingschuldige geen bankrekening heeft bestemd voor betaling van rijksbelastingen dan wel andere
      belastingen of heffingen voor zover de invordering daarvan is opgedragen aan de ontvanger betaalt de ontvanger op
      een bankrekening die op naam staat van de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7a
  - number: 7a.3
    text: Het tweede lid is van overeenkomstige toepassing op andere door de ontvanger uit te betalen bedragen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7a
  - number: 7a.4
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen kan worden afgeweken van het eerste lid. Daarbij worden regels
      gesteld met betrekking tot de bestemming van een andere bankrekening voor de uitbetaling van inkomstenbelasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7a
  - number: 7b
    text: |-
      Een vordering op de ontvanger tot uitbetaling van een bedrag aan inkomstenbelasting is niet vatbaar voor
      vervreemding of verpanding. In afwijking van de eerste volzin is vervreemding of verpanding wel mogelijk aan een
      financiële onderneming als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 7c.1
    text: |-
      In afwijking van [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt in het verkeer tussen
      belastingschuldigen en de directeur, de ontvanger of de belastingdeurwaarder een bericht uitsluitend elektronisch
      verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 7c.2
    text: Bij ministeriële regeling wordt bepaald op welke wijze het elektronische berichtenverkeer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7c
  - number: 7c.3
    text: |-
      Bij ministeriële regeling kunnen berichten en groepen van belastingschuldigen worden aangewezen waarvoor, alsmede
      omstandigheden worden aangewezen waaronder, het berichtenverkeer kan plaatsvinden anders dan langs elektronische
      weg.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel7c
  - number: '8.1'
    text: |-
      De ontvanger maakt de belastingaanslag bekend door verzending of uitreiking van het door de inspecteur voor de
      belastingschuldige opgemaakte aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel8
  - number: '8.2'
    text: Een belastingaanslag is door de belastingschuldige in zijn geheel verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel8
  - number: '9.1'
    text: Een belastingaanslag is invorderbaar zes weken na de dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid is een navorderingsaanslag, alsmede een conserverende navorderingsaanslag
      invorderbaar één maand na de dagtekening van het aanslagbiljet en een naheffingsaanslag invorderbaar veertien dagen
      na de dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '9.3'
    text: |-
      Een ingevolge [artikel 2, tweede lid, onderdeel c][ref1], met een belastingaanslag gelijkgestelde beschikking
      inzake een bestuurlijke boete die gelijktijdig en in verband met de vaststelling van een belastingaanslag als
      bedoeld in [artikel 2, eerste lid, onderdeel m][ref2], is opgelegd, is invorderbaar overeenkomstig de bepalingen
      die gelden voor die belastingaanslag. Een ingevolge [artikel 2, tweede lid, onderdeel c][ref3], met een
      belastingaanslag gelijkgestelde beschikking inzake belasting- of revisierente is invorderbaar overeenkomstig de
      bepalingen die gelden voor de belastingaanslag, bedoeld in [artikel 2, eerste lid, onderdeel m][ref4], waarop de
      belasting- of revisierente betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
  - number: '9.4'
    text: |-
      Een uitnodiging tot betaling, alsmede een ingevolge [artikel 2, tweede lid, onderdeel c][ref1], met een
      belastingaanslag gelijkgestelde beschikking inzake rente op achterstallen, inzake kosten van ambtelijke
      werkzaamheden of inzake een bestuurlijke boete als bedoeld in [hoofdstuk 9 van de Algemene douanewet][ref2], is
      invorderbaar tien dagen na de dagtekening van het aanslagbiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0023746
        hoofdstuk: '9'
  - number: '9.5'
    text: |-
      In afwijking van het eerste lid is een voorlopige aanslag in de inkomstenbelasting of in de vennootschapsbelasting
      en een voorlopige conserverende aanslag in de inkomstenbelasting, waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld, invorderbaar in zoveel gelijke termijnen als er na de maand, die
      in de dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn vervalt
      één maand na de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand later. Indien
      de toepassing van de eerste volzin niet leidt tot meer dan één termijn, vindt het eerste lid toepassing.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '9.6'
    text: |-
      In afwijking van het eerste en het vijfde lid is een belastingaanslag als bedoeld in het vijfde lid, die een uit
      te betalen bedrag behelst, invorderbaar in zoveel gelijke termijnen als er met inbegrip van de maand die in de
      dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn vervalt aan
      het eind van de maand van de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand
      later.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '9.7'
    text: |-
      In afwijking van het eerste lid is een voorlopige aanslag waarvan het aanslagbiljet een dagtekening heeft die ligt
      voor het jaar waarover deze is vastgesteld, invorderbaar in zoveel gelijke termijnen als er maanden van het jaar
      zijn. De eerste termijn vervalt aan het eind van de eerste maand van het jaar waarover de voorlopige aanslag is
      vastgesteld en elk van de volgende termijnen telkens een maand later.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '9.8'
    text: 'In afwijking van het tweede lid is terstond invorderbaar een naheffingsaanslag ter zake van:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: 9.8.a
    text: |-
      de belasting van personenauto’s en motorrijwielen, die is opgelegd aan een ander dan een vergunninghouder als
      bedoeld in [artikel 8 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel8
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '8'
  - number: 9.8.b
    text: |-
      de belasting zware motorrijtuigen, die is opgelegd aan de houder van een ander motorrijtuig dan bedoeld in
      [artikel 6, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel6
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '6'
  - number: '9.9'
    text: |-
      In afwijking van het vierde lid is een uitnodiging tot betaling die is vastgesteld overeenkomstig een op
      een kalendermaand betrekking hebbende, aanvullende aangifte als bedoeld in artikel 167, eerste lid, van het
      Douanewetboek van de Unie invorderbaar vijftien dagen na de maand waarover de aangifte is gedaan. In afwijking
      in zoverre van de eerste volzin is de uitnodiging tot betaling ter zake van de aangifte over de maand februari
      invorderbaar na zestien maart.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '9.10'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de in de voorgaande leden gestelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '9.11'
    text: 'In afwijking van het eerste lid is een belastingaanslag die een uit te betalen bedrag behelst niet invorderbaar:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: 9.11.a
    text: |-
      zolang over de juistheid van het adresgegeven van de belastingschuldige gerede twijfel bestaat of zolang dit
      gegeven ontbreekt;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: 9.11.b
    text: 'indien er op het moment dat er na het tijdstip waarop de belastingschuld is ontstaan vijf jaren zijn verstreken:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: 9.11.b.1°
    text: gerede twijfel bestaat over de juistheid van het adresgegeven van de belastingschuldige; of
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: 9.11.b.2°
    text: het adresgegeven van de belastingschuldige ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '9.12'
    text: |-
      De verplichting tot betaling wordt niet geschorst door de indiening van een bezwaar- of beroepschrift inzake een
      belastingaanslag.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 9][ref1] is een belastingaanslag van de belastingschuldige die een te innen bedrag
      behelst terstond en tot het volle bedrag invorderbaar indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: 10.1.a
    text: |-
      de belastingschuldige in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard en die belastingaanslag onder de werking van de
      schuldsaneringsregeling valt;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
  - number: 10.1.b
    text: |-
      de ontvanger aannemelijk maakt dat gegronde vrees bestaat dat goederen van de belastingschuldige zullen worden
      verduisterd;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
  - number: 10.1.c
    text: |-
      de belastingschuldige Nederland metterwoon wil verlaten dan wel zijn plaats van vestiging wil overbrengen naar een
      plaats buiten Nederland, tenzij hij aannemelijk maakt dat de belastingschuld kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
  - number: 10.1.d
    text: |-
      de belastingschuldige buiten Nederland woont of gevestigd is dan wel in Nederland geen vaste woonplaats of plaats
      van vestiging heeft en de ontvanger aannemelijk maakt dat gegronde vrees bestaat dat de belastingschuld niet kan
      worden verhaald;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
  - number: 10.1.e
    text: |-
      op goederen waarop een belastingschuld van de belastingschuldige kan worden verhaald beslag is gelegd voor zijn
      belastingschuld;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
  - number: 10.1.f
    text: goederen van de belastingschuldige worden verkocht ten gevolge van een beslaglegging namens derden;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
  - number: 10.1.g
    text: |-
      ten laste van de belastingschuldige een vordering wordt gedaan als bedoeld in [artikel 19][ref1], tenzij hij
      aannemelijk maakt dat de belastingschuld kan worden verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
        hoofdstuk: III
  - number: 10.1.h
    text: |-
      met inachtneming van artikel 97 van het Douanewetboek van de Unie ten laste van de belastingschuldige aanvulling of
      vervanging van een gestelde zekerheid is geëist, doch die aanvulling of vervanging niet tijdig overeenkomstig het
      krachtens [artikel 2:1, aanhef en onder j, van de Algemene douanewet][ref1] bepaalde, wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '2'
  - number: '10.2'
    text: |-
      Het eerste lid is in de gevallen bedoeld in de onderdelen a, e, f en g niet van toepassing op een voorlopige
      aanslag in de inkomstenbelasting of in de vennootschapsbelasting waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
  - number: '10.3'
    text: |-
      Het eerste lid is in het geval, bedoeld in onderdeel h, uitsluitend van toepassing op een uitnodiging tot betaling
      en op een ingevolge [artikel 2, tweede lid, onderdeel c][ref1], met een belastingaanslag gelijkgestelde beschikking
      inzake rente op achterstallen, inzake kosten van ambtelijke werkzaamheden of inzake een bestuurlijke boete als
      bedoeld in [hoofdstuk 9 van de Algemene douanewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0023746
        hoofdstuk: '9'
  - number: '11'
    text: |-
      Indien de belastingschuldige een belastingaanslag niet binnen de gestelde termijn betaalt, maant de ontvanger hem
      schriftelijk aan om alsnog binnen twee weken na de dagtekening van de aanmaning te betalen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel11
  - number: '12.1'
    text: De invordering van de belastingaanslag kan geschieden bij een door de ontvanger uit te vaardigen dwangbevel.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van [artikel 4:119, eerste lid, van de Algemene wet bestuursrecht][ref1] kunnen bij het dwangbevel
      tevens de kosten van de aanmaning, de kosten van het dwangbevel en de rente worden ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '13.1'
    text: |-
      In afwijking van [artikel 4:123 van de Algemene wet bestuursrecht][ref1] geschiedt de betekening van het dwangbevel
      overeenkomstig de regels van het [Wetboek van Burgerlijke Rechtsvordering][ref2] met betrekking tot de betekening
      van exploten. Het dwangbevel vermeldt dat de belastingschuldige tegen de tenuitvoerlegging van een dwangbevel in
      verzet kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001827
  - number: '13.2'
    text: |-
      Indien de betekening geschiedt overeenkomstig [artikel 47 van het Wetboek van Burgerlijke Rechtsvordering][ref1],
      vermeldt de envelop, in afwijking van de tweede volzin van het tweede lid van dat artikel, in plaats van de naam,
      de hoedanigheid, het kantooradres en telefoonnummer van de deurwaarder, welke ontvanger de opdracht tot betekening
      heeft verstrekt, alsmede diens kantooradres en telefoonnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '2'
  - number: '13.3'
    text: |-
      In afwijking van [artikel 4:123 van de Algemene wet bestuursrecht][ref1] kan de betekening van het dwangbevel met
      bevel tot betaling ook geschieden door het ter post bezorgen van een voor de belastingschuldige bestemd afschrift
      van het dwangbevel met bevel tot betaling door de ontvanger. Indien het dwangbevel ten uitvoer wordt gelegd als
      bedoeld in [artikel 14][ref2], wordt het bevel tot betaling geacht te zijn betekend door de belastingdeurwaarder
      die belast is met de tenuitvoerlegging. Uit de ongeopende envelop waarin het afschrift ter post wordt bezorgd,
      blijkt de naam en het adres van de belastingschuldige, alsmede een aanduiding dat de inhoud de onmiddellijke
      aandacht behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
  - number: '13.4'
    text: 'Betekening op de voet van het derde lid is niet mogelijk ingeval:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel13
  - number: 13.4.a
    text: de ontvanger is gebleken dat de aanmaning de belastingschuldige niet heeft bereikt, of
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel13
  - number: 13.4.b
    text: |-
      de invordering geschiedt met toepassing van [artikel 15, eerste lid, aanhef en onderdeel a of onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel15
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '15'
        hoofdstuk: III
  - number: '13.5'
    text: |-
      Voor de toepassing van de [artikelen 14][ref1], [19][ref2] en [20][ref3] wordt het dwangbevel met bevel tot
      betaling dat op de voet van het derde lid is betekend, geacht te zijn betekend twee dagen na de datum van de
      terpostbezorging van het dwangbevel met bevel tot betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel20
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '19'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '20'
        hoofdstuk: III
  - number: '14.1'
    text: |-
      In afwijking van [artikel 4:116 van de Algemene wet bestuursrecht][ref1] geschiedt de tenuitvoerlegging van
      een dwangbevel, dat op de voet van [artikel 13, derde lid][ref2], is betekend, niet dan na betekening van een
      hernieuwd bevel tot betaling. De betekening van het hernieuwd bevel tot betaling geschiedt overeenkomstig de
      regels van het [Wetboek van Burgerlijke Rechtsvordering][ref3] met betrekking tot de betekening van exploten, met
      dien verstande dat indien de betekening geschiedt overeenkomstig [artikel 47 van die wet][ref4] het exploot van
      de belastingdeurwaarder een bevel inhoudt om binnen twee dagen te betalen; [artikel 13, tweede li][ref5]d, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0001827
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel13
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001827
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '47'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
  - number: '14.2'
    text: |-
      Het eerste lid vindt geen toepassing ingeval het dwangbevel met toepassing van
      [artikel 15, eerste lid, aanhef en onderdeel c][ref1], terstond ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel15
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '15'
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Met betrekking tot een naheffingsaanslag als bedoeld in [artikel 9, achtste lid][ref1], en in de gevallen bedoeld
      in [artikel 10][ref2] kan:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel10
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '10'
        hoofdstuk: II
  - number: 15.1.a
    text: |-
      een dwangbevel zonder voorafgaande aanmaning worden uitgevaardigd, of indien reeds een aanmaning is verzonden, in
      afwijking van de daarbij gestelde betalingstermijn, terstond worden uitgevaardigd;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel15
  - number: 15.1.b
    text: een dwangbevel terstond na het bevel tot betaling ten uitvoer worden gelegd;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel15
  - number: 15.1.c
    text: |-
      een dwangbevel indien het bevel tot betaling reeds is gedaan, voor zover nodig in afwijking van de daarbij gestelde
      betalingstermijn, terstond ten uitvoer worden gelegd;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel15
  - number: 15.1.d
    text: |-
      een dwangbevel indien het hernieuwd bevel tot betaling, bedoeld in [artikel 14, eerste lid,][ref1] reeds is gedaan,
      in afwijking van de daarbij gestelde betalingstermijn, terstond ten uitvoer worden gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
  - number: 15.1.e
    text: |-
      de betekening en de tenuitvoerlegging van een dwangbevel, in afwijking
      van [artikel 64, eerste en tweede lid, eerste volzin][ref1], en
      [artikel 438b van het Wetboek van Burgerlijke Rechtsvordering][ref2], in bij of krachtens algemene maatregel van
      bestuur te bepalen situaties geschieden op alle dagen en uren.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel438b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 438b
  - number: '15.2'
    text: |-
      De voordracht voor een krachtens het eerste lid, onderdeel e, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel15
  - number: '16'
    text: |-
      Indien executoriaal beslag is gelegd op een in een of meer termijnen door de ontvanger uit te betalen bedrag op
      grond van een voorlopige aanslag in de inkomstenbelasting als bedoeld in [artikel 9, zesde lid][ref1], wordt het
      beslag geacht mede te omvatten een in termijnen uit te betalen bedrag op grond van een voorlopige aanslag in de
      inkomstenbelasting als bedoeld in artikel 9, zesde lid, over een volgend jaar voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: 16.a
    text: de uit te betalen termijnen van de voorlopige aanslagen op elkaar aansluiten, en
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel16
  - number: 16.b
    text: de schuld waarvoor beslag is gelegd niet geheel is voldaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel16
  - number: '17'
    text: |-
      1 De belastingschuldige kan tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de rechtbank van
      het arrondissement waarbinnen hij woont of is gevestigd. Indien de belastingschuldige buiten Nederland woont of
      is gevestigd dan wel in Nederland geen vaste woonplaats of plaats van vestiging heeft, kan hij in verzet komen bij
      de rechtbank van het arrondissement waarbinnen het kantoor is gevestigd van de ontvanger die het dwangbevel heeft
      uitgevaardigd.

      2 Het verzet vangt aan door indiening van een procesinleiding door de belastingschuldige als eiser aan de ontvanger
      die het dwangbevel heeft uitgevaardigd als verweerder.

      3 Het verzet kan niet zijn gegrond op de stelling dat het aanslagbiljet, de aanmaning, het op de voet
      van [artikel 13, derde lid][ref1], betekende dwangbevel of de schriftelijke mededeling, genoemd in
      [artikel 27, eerste lid][ref2], niet is ontvangen, tenzij de belastingschuldige aannemelijk maakt dat ontvangst
      redelijkerwijs moet worden betwijfeld. Bovendien kan het verzet niet zijn gegrond op de stelling dat de
      belastingaanslag ten onrechte of tot een te hoog bedrag is vastgesteld.

      1 De belastingschuldige kan tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de rechtbank van
      het arrondissement waarbinnen hij woont of is gevestigd. Indien de belastingschuldige buiten Nederland woont of
      is gevestigd dan wel in Nederland geen vaste woonplaats of plaats van vestiging heeft, kan hij in verzet komen bij
      de rechtbank van het arrondissement waarbinnen het kantoor is gevestigd van de ontvanger die het dwangbevel heeft
      uitgevaardigd.

      2 Het verzet vangt aan met dagvaarding door de belastingschuldige als eiser aan de ontvanger die het dwangbevel
      heeft uitgevaardigd als gedaagde.

      3 Het verzet kan niet zijn gegrond op de stelling dat het aanslagbiljet, de aanmaning, het op de voet
      van [artikel 13, derde lid][ref3], betekende dwangbevel of de schriftelijke mededeling, genoemd in
      [artikel 27, eerste lid][ref4], niet is ontvangen, tenzij de belastingschuldige aannemelijk maakt dat ontvangst
      redelijkerwijs moet worden betwijfeld. Bovendien kan het verzet niet zijn gegrond op de stelling dat de
      belastingaanslag ten onrechte of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel27
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '27'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '27'
        hoofdstuk: IV
        afdeling: '3'
  - number: '18.1'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] is de bestuurder van een motorrijtuig verplicht dat te doen
      stilstaan teneinde de tenuitvoerlegging van een dwangbevel te doen plaatsvinden. De bestuurder van het motorrijtuig
      is verplicht de daartoe door de in de eerste volzin bedoelde ambtenaren gegeven aanwijzingen op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '18.2'
    text: |-
      De tenuitvoerlegging van een dwangbevel op de voet van het eerste lid en de daaraan voorafgaande betekening van het
      hernieuwde bevel tot betaling kunnen, in afwijking van de [artikelen 64, eerste en tweede lid, eerste volzin][ref1],
      en [438b van het Wetboek van Burgerlijke Rechtsvordering][ref2], geschieden op alle dagen en uren.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel438b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 438b
  - number: '18.3'
    text: |-
      In afwijking van [artikel 14, eerste lid][ref1], kan een hernieuwd bevel tot betaling ook worden betekend aan de
      bestuurder van het motorrijtuig, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '14'
        hoofdstuk: III
  - number: '18.4'
    text: |-
      In afwijking van [artikel 434 van het Wetboek van Burgerlijke Rechtsvordering][ref1] kan machtiging van de
      belastingdeurwaarder ook plaatsvinden door middel van het beschikbaar stellen van de gegevens van een dwangbevel
      waarvan de tenuitvoerlegging op de voet van het eerste lid dient plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel434
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '434'
  - number: '18.5'
    text: |-
      Ingeval de schuld waarvoor op de voet van het eerste lid beslag is gelegd een bij
      ministeriële regeling te bepalen bedrag te boven gaat, wordt voor de toepassing van
      [artikel 446 van het Wetboek van Burgerlijke Rechtsvordering][ref1] in elk geval aangenomen dat het voor het behoud
      van de op de voet van het eerste lid in executoriaal beslag genomen zaken redelijkerwijze noodzakelijk is dat deze
      zaken in gerechtelijke bewaring worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel446
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '446'
  - number: '19.1'
    text: 'Een derde die:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: 19.1.a
    text: loon;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: 19.1.b
    text: uitkeringen op grond van sociale zekerheidswetten, uitgezonderd kinderbijslag onder welke benaming ook;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: 19.1.c
    text: |-
      pensioen en lijfrente, waaronder mede worden verstaan uitkeringen ingevolge een lijfrenterekening of
      lijfrentebeleggingsrecht als bedoeld in [artikel 3.126a van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 19.1.d
    text: uitkeringen uit levens-, invaliditeits-, ongevallen- of ziekengeldverzekering;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: 19.1.e
    text: |-
      uitkeringen tot levensonderhoud, verschuldigd krachtens [boek 1 van het Burgerlijk Wetboek][ref1], of tot
      vergoeding van schade door het derven van levensonderhoud;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 19.1.f
    text: |-
      uitkeringen of buitengewone pensioenen op grond van een wettelijke regeling voor oorlogsgetroffenen of voor degenen
      die hun vervangende dienstplicht vervullen;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: '19.2'
    text: |-
      Het eerste lid, tweede volzin, vindt alleen toepassing indien de belastingschuldige op het tijdstip waarop de
      vordering wordt gedaan, meer dan één belastingaanslag waarvan de enige of laatste betalingstermijn met ten minste
      twee maanden is overschreden, niet heeft betaald en hij met betrekking tot deze belastingaanslagen:
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: 19.2.a
    text: |-
      geen verzoek om uitstel van betaling heeft gedaan, niet in aanmerking komt voor uitstel van betaling of de gestelde
      voorwaarden voor uitstel van betaling niet is nagekomen, en
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: 19.2.b
    text: |-
      geen verzoek om kwijtschelding van belasting heeft gedaan of niet in aanmerking komt voor kwijtschelding van
      belasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: '19.3'
    text: |-
      Een huurder, een pachter, een curator in een faillissement en een houder van penningen is op vordering van
      de ontvanger verplicht uit de gelden die hij aan de belastingschuldige verschuldigd is of uit de gelden of
      de penningen die hij ten behoeve van de belastingschuldige onder zich heeft, de belastingaanslagen van de
      belastingschuldige te betalen. Een curator in een faillissement van de belastingschuldige is voorts bevoegd uit
      eigen beweging uit de gelden die hij ten behoeve van de belastingschuldige onder zich heeft, de belastingaanslagen
      van de belastingschuldige te betalen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: '19.4'
    text: |-
      Een betaaldienstverlener als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] is op vordering
      van de ontvanger verplicht, in zoverre onder blokkering van onttrekkingen aan de rekening, uit het tegoed van een
      rekening die een belastingschuldige bij hem heeft alsmede, indien de betaaldienstverlener en de belastingschuldige
      in samenhang met die rekening een overeenkomst inzake krediet zijn aangegaan, uit het ingevolge die overeenkomst
      verstrekte krediet, de belastingaanslagen van de belastingschuldige te betalen. De betaaldienstverlener is
      verplicht aan de vordering te voldoen, zonder zich daarbij op verrekening te kunnen beroepen. De verplichting tot
      betaling vervalt een week na de dag van bekendmaking van de vordering aan de betaaldienstverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '19.5'
    text: |-
      De vordering geschiedt bij beschikking. Voor het doen van een vordering dient de ontvanger te beschikken over een
      aan de belastingschuldige betekend dwangbevel met bevel tot betaling. Indien de vordering op de voet van het eerste
      lid, onderdeel a, wordt gedaan (loonvordering) en het dwangbevel op de voet van [artikel 13, derde lid][ref1],
      is betekend, moet de vordering vooraf worden gegaan door een schriftelijke aankondiging van de ontvanger aan
      de belastingschuldige, inhoudende dat hij voornemens is een loonvordering te doen. De loonvordering wordt in
      dat geval niet eerder gedaan dan zeven dagen na de dagtekening van de vooraankondiging. De in de derde volzin
      bedoelde aankondiging blijft achterwege indien de vordering wordt gedaan jegens degene die reeds op vordering
      van de ontvanger een belastingaanslag van de belastingschuldige betaalt of zou moeten betalen. De beschikking
      heeft rechtsgevolg zodra zij is bekendgemaakt aan degene jegens wie de vordering is gedaan. De ontvanger maakt
      de beschikking tevens bekend aan de belastingschuldige. Indien de vordering wordt gedaan jegens de curator
      in een faillissement vindt de tweede volzin geen toepassing en blijft bekendmaking van de beschikking aan de
      belastingschuldige achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel13
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '13'
        hoofdstuk: III
  - number: '19.6'
    text: |-
      De belastingschuldige kan op de voet van [artikel 17][ref1] in verzet komen tegen de vordering als ware deze de
      tenuitvoerlegging van een dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
        hoofdstuk: III
  - number: '19.7'
    text: |-
      Degene jegens wie een vordering is gedaan is verplicht aan die vordering te voldoen zonder daartoe een verificatie
      en beëdiging van schuldvordering, een rangregeling of rechterlijke uitspraak te mogen afwachten. De eerste volzin
      vindt geen toepassing in zoverre onder hem beslag is gelegd of verzet is gedaan ter zake van schulden waaraan
      voorrang boven vorderingen wegens rijksbelastingen is toegekend. Voldoening aan de vordering geldt als betaling aan
      de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: '19.8'
    text: |-
      De ontvanger vervolgt degene die in gebreke blijft aan de vordering te voldoen bij executoriaal beslag volgens de
      regels van het [tweede boek, tweede titel, tweede afdeling, van het Wetboek van Burgerlijke Rechtsvordering][ref1].
      De kosten van vervolging komen voor rekening van degene die in gebreke blijft zonder dat hij deze kan verhalen op
      de belastingschuldige.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingTweede
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Tweede
  - number: '19.9'
    text: |-
      Het eerste tot en met achtste lid zijn niet van toepassing op belastingaanslagen ten aanzien waarvan de
      schuldsaneringsregeling natuurlijke personen werkt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: '19.10'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gevallen waarin en de wijze
      waarop het vierde lid toepassing kan vinden.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel19
  - number: '20.1'
    text: |-
      In afwijking in zoverre van [artikel 585, onder a, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      kan een dwangbevel of een vonnis strekkend tot betaling van schadevergoeding aan de ontvanger in verband met
      belastingschuld die niet is voldaan, bij rechterlijk vonnis ten uitvoer worden gelegd door lijfsdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel585
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '585'
  - number: '20.2'
    text: |-
      Met betrekking tot een dwangbevel dat is uitgevaardigd aan een lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1], kan lijfsdwang worden toegepast ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 20.2.a
    text: |-
      de bestuurder of vereffenaar van dat lichaam of, bij ontstentenis, ten aanzien van de laatst afgetreden of
      ontslagen bestuurder of vereffenaar; en
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel20
  - number: 20.2.b
    text: degene die het beleid van het lichaam heeft bepaald of mede heeft bepaald als ware hij bestuurder;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel20
  - number: '20.3'
    text: |-
      De [artikelen 586 tot en met 600 van het Wetboek van Burgerlijke Rechtsvordering][ref1] zijn van overeenkomstige
      toepassing op de tenuitvoerlegging door lijfsdwang, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel586
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '586'
  - number: '20.4'
    text: |-
      De gerechtelijke procedure tot toepassing van lijfsdwang wordt gevoerd voor de rechtbank van het arrondissement
      waarbinnen het kantoor is gevestigd van de ontvanger die het dwangbevel of de dagvaarding strekkend tot betaling
      van schadevergoeding heeft uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel20
  - number: '21.1'
    text: ’s Rijks schatkist heeft een voorrecht op alle goederen van de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel21
  - number: '21.2'
    text: |-
      Het voorrecht gaat boven alle andere voorrechten met uitzondering van die van de [artikelen 287][ref1] en
      [288 onder a][ref2], alsmede dat van [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref3] voor zover de
      kosten zijn gemaakt na de dagtekening van het aanslagbiljet. Het voorrecht gaat tevens boven pand, voor zover
      het pandrecht rust op een zaak als is bedoeld in [artikel 22, derde lid][ref4], die zich op de bodem van de
      belastingschuldige bevindt en tegen inbeslagneming waarvan derden zich op die grond niet kunnen verzetten. Het
      behoudt deze rang in geval van faillissement van de belastingschuldige of toepassing ten aanzien van hem van de
      schuldsaneringsregeling natuurlijke personen, ongeacht of tevoren inbeslagneming heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel284
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel22
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '284'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: '22.1'
    text: |-
      Derden die geheel of gedeeltelijk recht menen te hebben op roerende zaken waarop ter zake van een belastingschuld
      beslag is gelegd, kunnen een beroepschrift richten tot de directeur, mits zulks doende vóór de verkoop en uiterlijk
      binnen zeven dagen, te rekenen van de dag der beslaglegging. Het beroepschrift wordt ingediend bij de ontvanger,
      tegen een door deze af te geven ontvangbewijs. De directeur neemt zo spoedig mogelijk een beslissing. De verkoop
      mag niet plaats hebben, dan acht dagen na de betekening van die beslissing aan de reclamant en aan degene tegen wie
      het beslag is gelegd, met nadere bepaling van de dag van verkoop.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: '22.2'
    text: |-
      Door het indienen van een beroepschrift op de voet van het eerste lid, verliest de belanghebbende niet het recht om
      zijn verzet voor de burgerlijke rechter te brengen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: '22.3'
    text: |-
      Behoudens in het geval dat er een recht van terugvordering bestaat jegens degene die een zaak onrechtmatig of van
      een onbevoegde heeft verkregen, kunnen derden nimmer verzet in rechte doen tegen:
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.a
    text: 'de beslaglegging ter zake van naheffingsaanslagen in:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.a.1°
    text: |-
      de loonbelasting ten laste van inhoudingsplichtigen met uitzondering van naheffingsaanslagen ter zake van
      huispersoneel;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.a.2°
    text: |-
      de omzetbelasting, alsmede de belasting van personenauto’s en motorrijwielen ten laste van een
      ander dan degene op wiens naam het motorrijtuig is gesteld in het kentekenregister, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 22.3.a.3°
    text: de accijns;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.a.4°
    text: de verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.a.5°
    text: |-
      de in [artikel 1 van de Wet belastingen op milieugrondslag][ref1] genoemde belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
  - number: 22.3.a.6°
    text: de dividendbelasting;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.a.7°
    text: de kansspelbelasting ten laste van inhoudingsplichtigen;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.a.8°
    text: de assurantiebelasting;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.b
    text: 'de beslaglegging ter zake van:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.b.1°
    text: uitnodigingen tot betaling;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
  - number: 22.3.b.2°
    text: |-
      ingevolge [artikel 2, tweede lid, onderdeel c][ref1], met een belastingaanslag gelijkgestelde beschikkingen inzake
      belastingrente, inzake bestuurlijke boeten die worden opgelegd in verband met vorenbedoelde naheffingsaanslagen,
      inzake bestuurlijke boeten als bedoeld in [hoofdstuk 9 van de Algemene douanewet][ref2], inzake rente op
      achterstallen of inzake kosten van ambtelijke werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0023746
        hoofdstuk: '9'
  - number: 22bis.1
    text: |-
      In dit artikel wordt verstaan onder bodemzaak: een zaak als bedoeld in [artikel 22, derde lid][ref1], die zich op
      de bodem van de belastingschuldige bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel22
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: 22bis.2
    text: |-
      Houders van pandrechten of overige derden die geheel of gedeeltelijk recht hebben op een bodemzaak, zijn gehouden
      de ontvanger mededeling te doen van het voornemen hun rechten met betrekking tot deze bodemzaak uit te oefenen, dan
      wel van het voornemen enigerlei andere handeling te verrichten of te laten verrichten waardoor die zaak niet meer
      kwalificeert als bodemzaak.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.3
    text: |-
      De belastingschuldige is gehouden de ontvanger mededeling te doen van het voornemen enigerlei handeling te
      verrichten of te laten verrichten, dan wel medewerking aan een dergelijke handeling te verlenen, waardoor de zaak
      niet meer kwalificeert als bodemzaak.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.4
    text: |-
      Handelingen die worden verricht in de normale uitoefening van het bedrijf of beroep van de belastingschuldige
      behoeven niet te worden gemeld.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de mededeling, bedoeld in het tweede of
      derde lid, moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.6
    text: |-
      Gedurende vier weken na de mededeling, bedoeld in het tweede lid, mag de pandhouder of overige derde die de
      mededeling heeft gedaan, zijn rechten op de bodemzaak niet uitoefenen alsmede geen andere handeling verrichten of
      laten verrichten waardoor de ontvanger beperkt wordt in zijn recht met betrekking tot de bodemzaak. Gedurende vier
      weken na de mededeling, bedoeld in het derde lid, mag de belastingschuldige de bodemzaak niet vervreemden, niet
      enigerlei andere handeling verrichten of laten verrichten waardoor de ontvanger beperkt wordt in zijn recht met
      betrekking tot de bodemzaak, en niet zijn medewerking aan een dergelijke handeling verlenen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.7
    text: |-
      Indien de ontvanger na een mededeling als bedoeld in het tweede lid besluit geen beslag te leggen op de bodemzaak,
      doet hij de pandhouder of de overige derde, bedoeld in dat lid, daarvan zo spoedig mogelijk kennisgeving. Gedurende
      vier weken na de dagtekening van de kennisgeving zijn de houders van pandrechten of de overige derden, bedoeld
      in het tweede lid, tot wie die kennisgeving is gericht, bevoegd hun rechten met betrekking tot die bodemzaak uit
      te oefenen, dan wel enigerlei handeling te verrichten dan wel te laten verrichten waardoor de zaak niet meer als
      bodemzaak kwalificeert. Na verloop van vier weken na de dagtekening van de kennisgeving is op handelingen die door
      de pandhouder of de derde, bedoeld in het tweede lid, worden verricht dit artikel onverkort van toepassing. De
      vorige volzin is van overeenkomstige toepassing indien de ontvanger geen kennisgeving doet, waarbij de termijn van
      vier weken aanvangt na afloop van de in het zesde lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.8
    text: Het zevende lid is van overeenkomstige toepassing op de belastingschuldige, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.9
    text: |-
      De pandhouder of de overige derde, bedoeld in het tweede lid, die in gebreke is gebleven om de mededeling,
      bedoeld in dat lid, te doen, dan wel die handelt in strijd met het zesde lid, is op vordering van de ontvanger
      verplicht een met bescheiden gestaafde verklaring te doen omtrent de executiewaarde van de bodemzaak. Het door
      de belastingschuldige in gebreke blijven om de mededeling, bedoeld in het derde lid, te doen, en het handelen in
      strijd met het zesde lid, tweede volzin, worden aangemerkt als een in gebreke blijven van, onderscheidenlijk het
      handelen door, de pandhouder of de overige derde, bedoeld in het tweede lid, tenzij die pandhouder of die overige
      derde bewijst dat noch de zaak noch de opbrengst daarvan hem direct of indirect geheel of gedeeltelijk ten goede
      is gekomen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.10
    text: |-
      De verklaring, bedoeld in het negende lid, moet geschieden binnen veertien dagen na de dagtekening van de brief van
      de ontvanger waarin om verklaring wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.11
    text: De ontvanger stelt de executiewaarde van de bodemzaak vast bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.12
    text: |-
      De pandhouder of de overige derde, bedoeld in het tweede lid, is verplicht tot betaling van een bedrag
      bestaande uit de executiewaarde van de bodemzaak tot een beloop van maximaal het bedrag van de al dan
      niet in een naheffingsaanslag vervatte belastingschulden ter zake van rijksbelastingen, bedoeld in
      [artikel 22, derde lid][ref1], voor zover deze belastingschulden zijn ontstaan in de periode voorafgaande
      aan het tijdstip waarop de zaak niet meer als bodemzaak kwalificeert. De ontvanger stelt het beloop van de
      betalingsverplichting vast in de beschikking, bedoeld in het elfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel22
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
  - number: 22bis.13
    text: |-
      Voor de uit de beschikking, bedoeld in het twaalfde lid, voortvloeiende betalingsverplichting geldt een
      betalingstermijn van veertien dagen na de dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.14
    text: |-
      Indien de pandhouder of de overige derde, bedoeld in het tweede lid, het bedrag, bedoeld in het twaalfde lid, niet
      binnen de gestelde termijn betaalt, vordert de ontvanger dat bedrag in, als ware dat bedrag een rijksbelasting.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.15
    text: |-
      Betalingen gedaan ingevolge het dertiende lid door de pandhouder of de overige derde, bedoeld in het tweede lid,
      komen in mindering op de belastingschulden, bedoeld in het twaalfde lid, van de belastingschuldige wiens bodemzaak
      het betrof, met uitzondering van rente, kosten en boeten die zijn verschuldigd door de pandhouder of de overige
      derde, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.16
    text: |-
      De bevoegdheden van de ontvanger op grond van het negende, elfde, twaalfde en veertiende lid vervallen één jaar
      na het tijdstip waarop de zaak niet meer als bodemzaak kwalificeert, tenzij de ontvanger binnen dat jaar van de
      pandhouder of de overige derde, bedoeld in het tweede lid, een met bescheiden gestaafde verklaring heeft gevorderd
      omtrent de executiewaarde van de zaak.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.17
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de beschikking, bedoeld in het elfde lid, is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 22bis.18
    text: |-
      De pandhouder of de overige derde, bedoeld in het tweede lid, die op grond van het tiende lid tijdig heeft
      verklaard en tijdig heeft betaald ingevolge het dertiende lid, heeft voor het bedrag dat hij aan de ontvanger heeft
      betaald verhaal op belastingschuldige, bedoeld in het eerste lid. Bij dit verhaal vindt geen subrogatie plaats in
      het voorrecht van [artikel 21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
  - number: 22bis.19
    text: |-
      Dit artikel is niet van toepassing indien de waarde van de bodemzaken bij het aangaan van de overeenkomst tussen
      belastingschuldige en pandhouder of derden als bedoeld in het tweede lid onder een bij ministeriële regeling vast
      te stellen drempel blijft.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22bis.20
    text: Dit artikel vindt overeenkomstige toepassing tijdens de afkoelingsperiode.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22bis
  - number: 22a.1
    text: |-
      Dit artikel is van toepassing op naheffingsaanslagen in de motorrijtuigenbelasting welke zijn vastgesteld op
      de voet van [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet op de motorrijtuigenbelasting 1994][ref1]
      ten name van degene op wiens naam het motorrijtuig is gesteld in het kentekenregister, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref2], alsmede op de met die naheffingsaanslagen
      verband houdende kosten, renten en bestuurlijke boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 22a.2
    text: |-
      Voor de in het eerste lid bedoelde vorderingen kan door de ontvanger verhaal worden genomen op elk motorrijtuig dat
      op naam van de in het eerste lid bedoelde natuurlijke persoon of rechtspersoon is gesteld in het kentekenregister,
      genoemd in [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1], zonder dat enig ander enig
      recht op deze motorrijtuigen kan tegenwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 22a.3
    text: |-
      Uitwinning van motorrijtuigen als bedoeld in het tweede lid is niet mogelijk voorzover degene die enig recht
      op een dergelijk motorrijtuig heeft goederen van degene op wiens naam die motorrijtuigen zijn gesteld in het
      kentekenregister, genoemd in [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1], aanwijst die
      voor de in het eerste lid bedoelde vorderingen voldoende verhaal bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 22a.4
    text: |-
      De in [artikel 78 van de Wet op de motorrijtuigenbelasting 1994][ref1] bedoelde ambtenaren zijn bevoegd de hen in
      de [artikelen 78][ref2] en [79 van die wet][ref3] toegekende bevoegdheden mede uit te oefenen ten behoeve van de
      toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel79
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '79'
  - number: '23'
    text: |-
      De ontvanger kan de belastingaanslagen in de inkomstenbelasting, voorzover zij betrekking hebben op goederen,
      verkregen onder de ontbindende voorwaarde van overlijden waarbij zich een opschortende voorwaarde ten gunste
      van een verwachter aansluit, op goederen waarvan de belastingschuldige het wettelijk vruchtgenot heeft, dan
      wel op goederen die de belastingschuldige ter beschikking staan krachtens een genotsrecht als bedoeld in
      [artikel 5.22, derde lid, van de Wet inkomstenbelasting 2001][ref1], op die goederen verhalen als waren zij niet
      met die rechten bezwaard, een en ander voorzover deze goederen bestanddelen vormen van de rendementsgrondslag,
      bedoeld in [artikel 5.3 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 23a
    text: |-
      De ontvanger kan de belastingaanslagen, voor zover zij zijn opgelegd aan de belastingschuldige
      als gevolg van een toerekening van een afgezonderd particulier vermogen als bedoeld in
      [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1], verhalen op goederen van:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 23a.a
    text: het afgezonderd particulier vermogen;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel23a
  - number: 23a.b
    text: |-
      een derde waarin het afgezonderd particulier vermogen direct of indirect een belang heeft van 5 percent of meer,
      tot ten hoogste het belang van het afgezonderd particulier vermogen in die derde; zonder dat enig ander enig recht
      op die goederen kan tegenwerpen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel23a
  - number: '24.1'
    text: 'De ontvanger is ten aanzien van de belastingschuldige bevoegd:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
  - number: 24.1.a
    text: |-
      aan de belastingschuldige uit te betalen en van de belastingschuldige te innen bedragen ter zake van
      rijksbelastingen en andere belastingen en heffingen voor zover de invordering daarvan aan de ontvanger is
      opgedragen met elkaar te verrekenen;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
  - number: 24.1.b
    text: |-
      aan de belastingschuldige uit te betalen bedragen ter zake van met de in onderdeel a bedoelde rijksbelastingen en
      andere belastingen en heffingen verband houdende vorderingen op de Staat of de ontvanger te verrekenen met van de
      belastingschuldige te innen bedragen ter zake van rijksbelastingen en andere belastingen en heffingen voor zover de
      invordering daarvan aan de ontvanger is opgedragen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
  - number: '24.2'
    text: |-
      De verrekening is ook mogelijk ingeval de termijn, bedoeld in [artikel 9][ref1], nog niet is verstreken, met
      dien verstande dat indien het betreft belastingaanslagen als bedoeld in [artikel 9, vijfde en zevende lid][ref2],
      verrekening alleen mogelijk is met belastingaanslagen die op dezelfde belasting en hetzelfde tijdvak betrekking
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
        hoofdstuk: II
  - number: '24.3'
    text: |-
      De ontvanger verrekent de in [artikel 27a, eerste lid][ref1], bedoelde betalingskorting met het bedrag van
      de belastingaanslag ter zake waarvan de betalingskorting wordt verleend. Voorts verrekent de ontvanger de in
      [artikel 27a, tweede lid][ref2], bedoelde betalingskorting met het uit te betalen bedrag van de vermindering van
      de belastingaanslag ter zake waarvan de betalingskorting is verleend. Op de in dit lid bedoelde verrekeningen
      zijn het eerste en tweede lid niet van toepassing. Als tijdstip van verrekening geldt het tijdstip waarop de
      betalingskorting wordt verleend of de dagtekening van de kennisgeving waarmee de vermindering wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
  - number: '24.4'
    text: |-
      Verrekening is niet mogelijk met betrekking tot een door de ontvanger uit te betalen bedrag indien deze vordering
      door de gerechtigde onder bijzondere titel is overgedragen, mits de ontvanger met de overdracht heeft ingestemd.
      Verrekening is voorts niet mogelijk met betrekking tot een door de ontvanger uit te betalen bedrag indien op deze
      vordering een pandrecht als bedoeld in [artikel 239 van Boek 3 van het Burgerlijk Wetboek][ref1] is gevestigd,
      mits de ontvanger op het tijdstip waarop het pandrecht hem wordt medegedeeld met het pandrecht heeft ingestemd.
      De ontvanger is verplicht bij beschikking met de overdracht of het pandrecht in te stemmen indien op het tijdstip
      van de mededeling van de akte van overdracht of van het pandrecht ten name van de belastingschuldige geen voor
      verrekening vatbare schuld invorderbaar is. De ontvanger kan bij beschikking instemming met de overdracht of het
      pandrecht weigeren. De ontvanger maakt de beschikking bekend door middel van een gedagtekende kennisgeving waarin,
      bij weigering tot instemming met de overdracht of het pandrecht, de grond is vermeld waarop de weigering berust.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel239
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '239'
  - number: '24.5'
    text: 'In afwijking in zoverre van het vierde lid is ook na de instemming, bedoeld in dat lid, verrekening mogelijk van:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
  - number: 24.5.a
    text: |-
      de in [artikel 27a, eerste lid][ref1], bedoelde betalingskorting met het bedrag van de belastingaanslag ter zake
      waarvan de betalingskorting wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
  - number: 24.5.b
    text: |-
      de in [artikel 27a, tweede lid][ref1], bedoelde betalingskorting met het uit te betalen bedrag van de vermindering
      van de belastingaanslag ter zake waarvan de betalingskorting is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 27a
        hoofdstuk: V
  - number: 24.5.c
    text: |-
      belastingaanslagen die een uit te betalen bedrag behelzen met belastingaanslagen die op dezelfde belasting en
      hetzelfde tijdvak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
  - number: '24.6'
    text: |-
      De belastingschuldige kan binnen een week na de dagtekening van de in het vierde lid bedoelde kennisgeving waarmee
      de beschikking is bekendgemaakt beroep instellen bij de directeur. Het beroepschrift wordt ingediend bij de
      ontvanger tegen een door deze af te geven ontvangbewijs. De directeur neemt zo spoedig mogelijk een beslissing
      en maakt deze bekend aan de belastingschuldige door middel van een gedagtekende kennisgeving. Indien op het
      beroepschrift afwijzend wordt beslist, vindt verrekening niet eerder plaats dan nadat na de dagtekening van de
      kennisgeving waarmee de beslissing van de directeur is bekendgemaakt acht dagen zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
  - number: '24.7'
    text: |-
      Met betrekking tot het bedrag waarvoor krachtens
      __REF000___________________________________________________________________________________________________________
      _____________, uitstel van betaling is verleend, is gedurende het uitstel verrekening niet mogelijk, tenzij de
      belastingschuldige dit verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
  - number: '24.8'
    text: De ontvanger maakt de verrekening onverwijld bekend.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
  - number: '24.9'
    text: |-
      In afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1] is
      verrekening ook mogelijk van een voorlopige aanslag tot een negatief bedrag als bedoeld in
      [artikel 13, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel13
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '13'
  - number: '25.1'
    text: |-
      De ontvanger kan onder door hem te stellen voorwaarden aan een belastingschuldige voor een bepaalde tijd bij
      beschikking uitstel van betaling verlenen. Gedurende het uitstel vangt de dwanginvordering niet aan, dan wel wordt
      deze geschorst.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.2'
    text: Het uitstel kan tussentijds bij beschikking worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verlenen van uitstel
      van betaling voor de duur van ten hoogste tien jaren in de gevallen waarin belastingaanslagen in de schenk- of
      erfbelasting zijn opgelegd en door de voldoening daarvan zonder uitstel een sociaal-economisch dan wel cultureel
      belang in gevaar zou komen en dat uitstel niet of onvoldoende mogelijk is ingevolge de overige leden van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel
      van betaling voor de duur van 12 maanden en voor de eventuele verlenging daarvan op grond van
      [artikel 3.64, derde lid, van de Wet inkomstenbelasting 2001][ref1], mits voldoende zekerheid is gesteld,
      voor belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd door de toepassing van
      [artikel 3.64, eerste lid, van de Wet inkomstenbelasting 2001][ref2]. Het uitstel wordt beëindigd indien de
      herinvesteringen niet leiden tot in Nederland belastbare winst van de onderneming en bij emigratie van de
      belastingschuldige.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van
      uitstel van betaling voor belastingaanslagen betreffende de inkomstenbelasting die is
      verschuldigd door de toepassing van de [artikelen 3.83, eerste lid of tweede lid][ref1],
      [3.133, tweede lid, onderdelen h of j][ref2], [3.136, eerste, tweede, derde, vierde of vijfde lid][ref3],
      of [7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref4]. Het in de eerste volzin bedoelde uitstel
      wordt verleend tot uiterlijk het begin van het tiende jaar na afloop van het kalenderjaar waarop de
      belastingaanslag betrekking heeft. De in de eerste volzin bedoelde regels kunnen mede betrekking hebben op
      het stellen van voldoende zekerheid. Het uitstel wordt beëindigd indien zich een omstandigheid voordoet als
      genoemd in [artikel 19b, eerste lid, of tweede lid, eerste volzin, van de Wet op de loonbelasting 1964][ref5],
      [artikel 3.133, tweede lid, onderdelen a tot en met g, i en k][ref6], of
      [artikel 3.135, eerste lid, van de Wet inkomstenbelasting 2001][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 19b
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25.7'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het verlenen van uitstel van
      betaling als bedoeld in de artikelen 110 en 111 van het Douanewetboek van de Unie.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.8'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor
      belastingaanslagen betreffende de inkomstenbelasting die is verschuldigd ter zake van geconserveerd inkomen als
      bedoeld in [artikel 2.8, vierde, vijfde, zesde of zevende lid, van de Wet inkomstenbelasting 2001][ref1] of ter
      zake van geconserveerd inkomen door de toepassing van [artikel 4.16, eerste lid, onderdeel h, van die wet][ref2] of
      van [artikel 7.5, vierde, vijfde of zevende lid, van die wet][ref3]. De in de eerste volzin bedoelde regels kunnen
      mede betrekking hebben op het stellen van voldoende zekerheid. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 25.8.a
    text: |-
      ingeval aandelen of winstbewijzen die aan het uitstel ten grondslag
      liggen, worden vervreemd in de zin van de [artikelen 4.12][ref1] of
      __REF001___________________________________________________________________________________________________________
      ____________________. In geval van een vervreemding in het kader van een aandelenfusie als
      bedoeld in [artikel 3.55 van de Wet inkomstenbelasting 2001][ref3], een splitsing als bedoeld in
      [artikel 3.56 van die wet][ref4] of een fusie als bedoeld in [artikel 3.57 van die wet][ref5] kan het uitstel
      van betaling onder nader te stellen voorwaarden worden voortgezet. In geval van een vervreemding in de zin van
      artikel 4.16, eerste lid, onderdelen e, f en g, van de Wet inkomstenbelasting 2001 of wegens een verdeling van een
      nalatenschap of een huwelijksgemeenschap binnen twee jaren na het overlijden van de erflater onderscheidenlijk na
      de ontbinding van de huwelijksgemeenschap, kan het uitstel van betaling eveneens onder nader te stellen voorwaarden
      worden voortgezet. In geval van schenking aan een natuurlijk persoon kan het uitstel van betaling eveneens onder
      nader te stellen voorwaarden worden voortgezet, mits de verkrijger reeds gedurende de 36 maanden die onmiddellijk
      voorafgaan aan het tijdstip van de schenking in dienstbetrekking is van de vennootschap waarop de aandelen of
      winstbewijzen betrekking hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.8.b
    text: |-
      ingeval de vennootschap waarin de belastingschuldige de aandelen of winstbewijzen houdt, reserves aan de
      belastingschuldige heeft uitgedeeld, voor een bedrag ter grootte van 25 percent van de uitgedeelde reserves op de
      aandelen of winstbewijzen die aan het uitstel ten grondslag liggen, verminderd met de over die uitgedeelde reserves
      in Nederland verschuldigde dividendbelasting of inkomstenbelasting en de daarover in het buitenland feitelijk
      geheven belasting;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.8.c
    text: |-
      in geval van een teruggaaf van wat op aandelen of bewijzen van deelgerechtigdheid in een fonds voor gemene rekening
      is gestort dan wel van wat door houders van winstbewijzen is gestort of ingelegd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.9'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor de
      duur van ten hoogste tien jaar, mits voldoende zekerheid is gesteld, voor belastingaanslagen voor zover daarin is
      begrepen inkomstenbelasting ter zake van een vervreemding van tot een aanmerkelijk belang behorende aandelen of
      winstbewijzen aan een natuurlijk persoon of aan een rechtspersoon als bedoeld in de tweede volzin, indien de koper
      de tegenprestatie schuldig is gebleven, de vervreemde aandelen ten minste vijf percent van het geplaatste kapitaal
      van de vennootschap uitmaken en de bezittingen van de vennootschap waarop het aanmerkelijk belang betrekking
      heeft niet in belangrijke mate onmiddellijk of middellijk bestaan uit beleggingen. Een rechtspersoon als bedoeld
      in de eerste volzin is een besloten vennootschap of een andere vennootschap waarvan het kapitaal in aandelen is
      verdeeld en in een aandelenregister de aandeelhouders worden geadministreerd, welke is gevestigd in een lidstaat
      van de Europese Unie of een bij ministeriële regeling aangewezen andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, en waarvan alle aandelen worden gehouden door een natuurlijk persoon.
      Het uitstel wordt beëindigd indien aflossingen plaatsvinden dan wel de koper van de aandelen of winstbewijzen deze
      vervreemdt of wanneer daaruit reguliere voordelen van substantiële omvang worden genoten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.10'
    text: |-
      Voor de toepassing van het negende lid wordt het begrip vervreemding opgevat overeenkomstig [artikel 4.12][ref1] en
      [4.16, eerste lid, onderdelen a, b en c, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '25.11'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor de
      duur van ten hoogste tien jaar, mits voldoende zekerheid is gesteld, voor belastingaanslagen voor zover daarin is
      begrepen inkomstenbelasting ter zake van inkomen uit aanmerkelijk belang omdat de vennootschap waarop het belang
      betrekking heeft op verzoek van haar aandeelhouder aandelen in een andere vennootschap heeft overgedragen aan een
      natuurlijk persoon of aan een rechtspersoon als bedoeld in het negende lid, tweede volzin, tegen een tegenprestatie
      lager dan de waarde in het economische verkeer. Dit uitstel wordt slechts verleend wanneer de overgedragen
      aandelen ten minste vijf percent van het geplaatste kapitaal van de vennootschap uitmaken en de bezittingen van de
      vennootschap waarop de overgedragen aandelen betrekking hebben niet in belangrijke mate onmiddellijk of middellijk
      bestaan uit beleggingen. Het uitstel wordt beëindigd indien de begiftigde aandelen of winstbewijzen welke aan het
      uitstel ten grondslag liggen, vervreemdt of wanneer daaruit reguliere voordelen van substantiële omvang worden
      genoten.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: '25.12'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling
      voor de duur van tien jaren voor belastingaanslagen betreffende de schenk- of erfbelasting, bedoeld in
      [artikel 35b, derde lid, van de Successiewet 1956][ref1]. Het uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
  - number: 25.12.a
    text: in geval van faillissement van de belastingschuldige;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.12.b
    text: ingeval de schuldsaneringsregeling natuurlijke personen ten aanzien van de belastingschuldige van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
  - number: 25.12.c
    text: |-
      ingeval zich ten aanzien van de verkrijger tijdens de in de eerste volzin bedoelde periode een gebeurtenis voordoet
      als bedoeld in [artikel 35e, eerste lid, van de Successiewet 1956][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35e
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35e
  - number: '25.13'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling voor de
      duur van tien jaar voor belastingaanslagen in de schenk- of erfbelasting voor zover die belastingen kunnen worden
      toegerekend aan de verkrijging van een vordering op een medeverkrijger ter zake van door deze medeverkrijger
      verkregen ondernemingsvermogen, als bedoeld in [artikel 35c, eerste lid, van de Successiewet 1956][ref1]. Het
      uitstel wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel25
    references:
