  - number: 70b.2
    text: |-
      Met betrekking tot een verleend uitstel van betaling als bedoeld in het eerste lid zijn
      [artikel 24, zevende lid][ref1], [artikel 25, eenentwintigste lid, eerste volzin][ref2], en
      [artikel 28, derde en vierde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
