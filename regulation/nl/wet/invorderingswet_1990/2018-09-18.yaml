        hoofdstuk: VI
        afdeling: '1'
  - number: '56.2'
    text: |-
      Ten aanzien van degene die een ingevolge [artikel 55][ref1] verschuldigd bedrag heeft voldaan, is het eerste lid
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel55
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '55'
        hoofdstuk: VI
        afdeling: '3'
  - number: '56.3'
    text: |-
      Degene die het ingevolge het eerste lid verschuldigde bedrag heeft voldaan, wordt geacht tot dit bedrag de
      belasting van de belastingschuldige ingevolge de [artikelen 33, eerste lid, onderdeel a][ref1], [36][ref2] of
      [36b][ref3] te hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel36b
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '33'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '36'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: 36b
        hoofdstuk: VI
        afdeling: '1'
  - number: '56.4'
    text: Van het eerste, tweede en derde lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel56
  - number: '57'
    text: |-
      De aansprakelijke die in de belasting heeft bijgedragen, is bij zijn verhaal op de belastingschuldige of de mede-
      aansprakelijke uitsluitend gesubrogeerd in het voorrecht van ’s Rijks schatkist overeenkomstig [artikel 21][ref1].
      De eerste volzin is van overeenkomstige toepassing ten aanzien van de belastingschuldige en de aansprakelijke die
      in de belasting heeft bijgedragen indien [artikel 54][ref2] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel54
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '54'
        hoofdstuk: VI
        afdeling: '2'
  - number: 57a.1
    text: |-
      De ontvanger houdt op zijn naam een rekening aan bij een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank mag uitoefenen (vrijwaringsrekening)
      waarop de in [artikel 34][ref2], [artikel 35][ref3] en [artikel 35a][ref4] bedoelde inleners, onderscheidenlijk
      aannemers en opdrachtgevers, bedragen kunnen storten ten behoeve van het door hun uitleners, onderscheidenlijk
      onderaannemers en aannemers, bij de ontvanger aan te houden depot.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '34'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: 35a
        hoofdstuk: VI
        afdeling: '1'
  - number: 57a.2
    text: |-
      Een uitlener, een onderaannemer of een aannemer die voldoet aan bij ministeriële regeling te stellen voorwaarden,
      kan de ontvanger verzoeken ten behoeve van hem een depot aan te houden. De ontvanger beslist op het verzoek
      bij een voor bezwaar vatbare beschikking. Ook het opheffen van een depot geschiedt bij een voor bezwaar
      vatbare beschikking. Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake deze beschikkingen is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 57a.3
    text: |-
      Degene ten behoeve van wie de ontvanger een depot aanhoudt (de depotbegunstigde), kan over het tegoed van het
      depot beschikken voor de voldoening van loonbelasting, omzetbelasting of sociale verzekeringspremies. Indien de
      depotbegunstigde na aanmaning in gebreke blijft en in de gevallen bedoeld in [artikel 10][ref1], is de ontvanger
      ook zelf bevoegd tot een zodanige aanwending over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel10
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '10'
        hoofdstuk: II
  - number: 57a.4
    text: |-
      De depotbegunstigde kan tevens over het tegoed van het depot beschikken voor het overboeken naar andere depots, een
      en ander als bedoeld in [artikel 34, derde lid, tweede volzin][ref1], [artikel 35, vijfde lid, tweede volzin][ref2]
      en [artikel 35a, vierde lid][ref3]. Voor zover de overboeking geen betrekking heeft op loonbelasting,
      omzetbelasting of sociale verzekeringspremies als aldaar bedoeld, is de depotbegunstigde naar wie is overgeboekt,
      verplicht de overboeking ongedaan te maken door terugboeking naar het depot waarvan de overboeking afkomstig is.
      Voor zover de depotbegunstigde naar wie is overgeboekt, zich niet houdt aan deze verplichting, is de ontvanger
      bevoegd de overboeking ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel35a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '35'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: 35a
        hoofdstuk: VI
        afdeling: '1'
  - number: 57a.5
    text: |-
      Voor zover het tegoed van het depot uitgaat boven hetgeen de depotbegunstigde verschuldigd is aan loonbelasting,
      omzetbelasting en sociale verzekeringspremies, en hetgeen hij naar verwachting binnenkort aan zodanige schulden zal
      moeten voldoen, kan hij de ontvanger verzoeken het tegoed aan te wenden voor de voldoening van andere belastingen
      of heffingen waarvan de invordering aan de ontvanger is opgedragen. Indien de depotbegunstigde na aanmaning in
      gebreke blijft en in de gevallen bedoeld in [artikel 10][ref1], is de ontvanger ook zelf bevoegd tot een zodanige
      aanwending over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel10
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '10'
        hoofdstuk: II
  - number: 57a.6
    text: |-
      Bij opheffing van een depot keert de ontvanger het tegoed ervan uit aan de depotbegunstigde. [Artikel 24][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
        hoofdstuk: IV
        afdeling: '2'
  - number: 57a.7
    text: |-
      Over het tegoed van een depot vergoedt de ontvanger aan de depotbegunstigde een rente als bedoeld in
      [artikel 9 van de Wet op de consignatie van gelden][ref1], welke rente wordt bijgeschreven bij het tegoed en wordt
      berekend volgens de regels van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003338
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003338
  - number: 57a.8
    text: Het tegoed van een depot is niet vatbaar voor beslag of verpanding en kan niet worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
  - number: 57a.9
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel,
      waaronder regels dat de ontvanger in afwijking van [artikel 7a][ref1] terug te geven bedragen aan loonbelasting,
      omzetbelasting en sociale verzekeringspremies kan uitbetalen door bijboeking op het depot van degene die recht
      heeft op de terugbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 7a
        hoofdstuk: I
  - number: '58.1'
    text: 'De belastingschuldige of een aansprakelijk gestelde is gehouden desgevraagd aan de ontvanger:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel58
  - number: 58.1.a
    text: de gegevens en inlichtingen te verstrekken welke voor de invordering te zijnen aanzien van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel58
  - number: 58.1.b
    text: |-
      de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan - zulks ter keuze van de ontvanger - waarvan
      de raadpleging van belang kan zijn voor de vaststelling van de feiten welke invloed kunnen uitoefenen op de
      invordering te zijnen aanzien, voor dit doel beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel58
  - number: '58.2'
    text: |-
      Een ieder die de leeftijd van veertien jaar heeft bereikt, is verplicht op vordering van de ontvanger terstond een
      identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage aan te bieden,
      indien dit van belang kan zijn voor de invordering.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '59.1'
    text: |-
      De in [artikel 58, eerste lid, onderdeel b][ref1], bedoelde verplichting geldt onverminderd voor een derde bij
      wie zich gegevensdragers bevinden van degene die gehouden is deze, of de inhoud daarvan, aan de ontvanger voor
      raadpleging beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
  - number: '59.2'
    text: |-
      De ontvanger stelt degene wiens gegevensdragers hij bij een derde voor raadpleging vordert, gelijktijdig hiervan
      in kennis.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel59
  - number: '60.1'
    text: |-
      De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze - zulks ter keuze van de ontvanger - en binnen een door de ontvanger te stellen
      redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel60
  - number: '60.2'
    text: |-
      Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel60
  - number: '61'
    text: |-
      Voor een weigering om te voldoen aan de in de [artikelen 58][ref1], [59][ref2] en [60][ref3] omschreven
      verplichtingen kan niemand zich met vrucht beroepen op de omstandigheid dat hij uit enigerlei hoofde tot
      geheimhouding verplicht is, zelfs niet indien deze hem bij een wettelijke bepaling is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel60
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '59'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '60'
        hoofdstuk: VII
  - number: '62.1'
    text: |-
      Met betrekking tot administratieplichtigen als bedoeld in
      [artikel 52 van de Algemene wet inzake rijksbelastingen][ref1], zijn de in de [artikelen 58][ref2], [59][ref3] en
      [60][ref4] geregelde verplichtingen van overeenkomstige toepassing ten behoeve van de invordering van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel60
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '59'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '60'
        hoofdstuk: VII
  - number: '62.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de personen en de lichamen als bedoeld in
      [artikel 55 van de Algemene wet inzake rijksbelastingen][ref1], voor zover het de in dat artikel bedoelde gegevens
      en inlichtingen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel55
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '55'
  - number: '62.3'
    text: |-
      [Artikel 55 van de Algemene wet inzake rijksbelastingen][ref1] is van toepassing met dien verstande dat voor
      inspecteur wordt gelezen ontvanger en voor belastingwet wordt gelezen Invorderingswet 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel55
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '55'
  - number: '62.4'
    text: |-
      [Artikel 49a van de Algemene wet inzake rijksbelastingen][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel49a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 49a
  - number: 62bis.1
    text: |-
      Financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      bank mogen uitoefenen zijn gehouden aan de ontvanger kosteloos de volgende gegevens inzake bankrekeningen te
      verstrekken: het bankrekeningnummer en de naam, het adres, de woonplaats en de geboortedatum van de houder van
      de bankrekening, voor zover die gegevens van belang zijn voor de uitbetaling van inkomstenbelasting, bedoeld in
      [artikel 7a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62bis
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0004770
        artikel: 7a
        hoofdstuk: I
  - number: 62bis.2
    text: De gegevens worden verstrekt binnen een door de ontvanger te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62bis
  - number: 62bis.3
    text: |-
      De ontvanger kan bepalen dat bij het verstrekken van de gegevens tevens het burgerservicenummer van degene op wie
      de gegevens betrekking hebben dient te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62bis
  - number: 62bis.4
    text: |-
      Bij het verwerken van de gegevens maken de financiële ondernemingen, bedoeld in het eerste lid, in hun eigen
      administratie gebruik van het burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62bis
  - number: 62a.1
    text: |-
      Ingeval een persoon als bedoeld in de [artikelen 58, eerste lid][ref1], [59, eerste lid][ref2] en
      [62, eerste lid][ref3], een door de ontvanger op een van die leden gebaseerde verplichting is nagekomen maar
      van oordeel is dat de verplichting onrechtmatig is opgelegd, kan hij verzoeken om vergoeding van kosten die
      rechtstreeks verband houden met deze nakoming. De ontvanger beslist op dat verzoek bij voor bezwaar vatbare
      beschikking en kent een redelijke kostenvergoeding toe in geval van een onrechtmatig opgelegde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel62
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '59'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '62'
        hoofdstuk: VII
  - number: 62a.2
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de in het eerste lid bedoelde beschikking is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '63'
    text: |-
      Voor een weigering om te voldoen aan de verplichtingen ten behoeve van de invordering van derden kunnen alleen
      bekleders van een geestelijk ambt, notarissen, advocaten, artsen en apothekers zich beroepen op de omstandigheid,
      dat zij uit hoofde van hun stand, ambt of beroep tot geheimhouding verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63
  - number: 63a
    text: |-
      De verplichtingen welke volgens dit hoofdstuk bestaan jegens de ontvanger, gelden mede jegens iedere door Onze
      Minister aangewezen andere ambtenaar van de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63a
  - number: 63aa.1
    text: |-
      Indien een Commissiebesluit als bedoeld in [artikel 1 van de Wet terugvordering staatssteun][ref1] verplicht tot
      terugvordering van staatssteun en die staatssteun voortvloeit uit de toepassing van deze wet, wordt die staatsteun
      voor de toepassing van deze wet aangemerkt als in te vorderen belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0040718#Artikel1
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63aa
    references:
      - id: ref1
        bwb_id: BWBR0040718
        artikel: '1'
  - number: 63aa.2
    text: 'Bij invordering op grond van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63aa
  - number: 63aa.2.a
    text: |-
      zijn de ingevolge andere bepalingen van deze wet ter zake geldende verjaringstermijnen en voorwaarden niet van
      toepassing; en
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63aa
  - number: 63aa.2.b
    text: |-
      zijn [artikel 20b van de Algemene wet inzake rijksbelastingen][ref1] en
      [artikel 4 van de Wet terugvordering staatssteun][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20b
      [ref2]: https://wetten.overheid.nl/BWBR0040718#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63aa
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 20b
      - id: ref2
        bwb_id: BWBR0040718
        artikel: '4'
  - number: 63ab.1
    text: |-
      Ten aanzien van de invordering van teruggevorderde staatssteun als bedoeld in
      [artikel 20a van de Algemene wet inzake rijksbelastingen][ref1] en van staatssteun die ingevolge
      [artikel 63aa][ref2] is aangemerkt als in te vorderen belasting, zijn niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel63aa
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63ab
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 20a
      - id: ref2
        bwb_id: BWBR0004770
        artikel: 63aa
        hoofdstuk: VIIbis
  - number: 63ab.1.a
    text: |-
      de [artikelen 25][ref1], [26][ref2] en [27][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel27
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63ab
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '26'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '27'
        hoofdstuk: IV
        afdeling: '3'
  - number: 63ab.1.b
    text: |-
      de [afdelingen 4.4.2][ref1] en [4.4.3 van de Algemene wet bestuursrecht][ref2], met uitzondering van
      [artikel 4:97 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63ab
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 4.4.3
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 63ab.2
    text: 'Geen invorderingsrente wordt in rekening gebracht:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63ab
  - number: 63ab.2.a
    text: |-
      voor zover de belastingaanslag is opgelegd vanwege de terugvordering van staatssteun, bedoeld in
      [artikel 20a van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63ab
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 20a
  - number: 63ab.2.b
    text: |-
      ter zake van staatssteun die ingevolge [artikel 63aa][ref1] is aangemerkt als in te vorderen belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel63aa
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63ab
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 63aa
        hoofdstuk: VIIbis
  - number: 63b.1
    text: |-
      Indien de belastingschuldige de belasting welke bij wege van aanslag wordt geheven niet, gedeeltelijk niet dan wel
      niet binnen de op het aanslagbiljet vermelde termijn of termijnen heeft betaald, vormt dit een verzuim ter zake
      waarvan de ontvanger hem bij voor bezwaar vatbare beschikking een bestuurlijke boete van ten hoogste € 5.278 kan
      opleggen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63b
  - number: 63b.2
    text: |-
      Degene die niet voldoet aan de verplichting hem opgelegd bij [artikel 60, tweede lid][ref1], begaat een verzuim ter
      zake waarvan de ontvanger hem bij voor bezwaar vatbare beschikking een bestuurlijke boete van ten hoogste € 5.278
      kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel60
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '60'
        hoofdstuk: VII
  - number: 63b.3
    text: |-
      Het opleggen van de boete, bedoeld in het eerste en tweede lid, geschiedt met overeenkomstige
      toepassing van de [artikelen 67g, tweede lid][ref1], [67pa, eerste lid][ref2], en
      [67pb van de Algemene wet inzake rijksbelastingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67g
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67pa
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67pb
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67g
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67pa
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67pb
  - number: 63b.4
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de in het eerste en tweede lid bedoelde
      beschikking is [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 63b.5
    text: |-
      Een door de ontvanger opgelegde bestuurlijke boete is invorderbaar zes weken na de dagtekening van de beschikking
      waarbij deze is opgelegd, met overeenkomstige toepassing van de regels die gelden voor de invordering van de
      belastingaanslag in verband waarmee deze is opgelegd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63b
  - number: 63c.1
    text: |-
      Het in [artikel 63b, eerste en tweede lid][ref1], genoemde bedrag wordt elke vijf jaar, met ingang van 1 januari
      van een jaar, bij ministeriële regeling gewijzigd. Deze wijziging vindt voor het eerst plaats per 1 januari 2015.
      De [artikelen 10.1][ref2] en [10.2 van de Wet inkomstenbelasting 2001][ref3] zijn van overeenkomstige toepassing,
      met dien verstande dat als tabelcorrectiefactor wordt genomen het product van de factoren van de laatste vijf
      kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel63b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 63b
        hoofdstuk: VIIa
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 63c.2
    text: |-
      De gewijzigde bedragen vinden voor het eerst toepassing met betrekking tot verzuimen die zijn begaan na het begin
      van het kalenderjaar bij de aanvang waarvan de bedragen zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel63c
  - number: '64.1'
    text: 'Degene die ingevolge deze wet verplicht is tot:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel64
  - number: 64.1.a
    text: het verstrekken van inlichtingen of gegevens, en deze niet, onjuist of onvolledig verstrekt;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel64
  - number: 64.1.b
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze niet voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel64
  - number: 64.1.c
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze in valse of vervalste vorm voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel64
  - number: '64.2'
    text: |-
      Degene die niet voldoet aan de hem bij [artikel 58, tweede lid][ref1], opgelegde verplichting, wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '58'
        hoofdstuk: VII
  - number: '65.1'
    text: |-
      Degene die opzettelijk een der feiten begaat, omschreven in [artikel 64, eerste lid, onderdeel a of b][ref1],
      wordt, indien het feit ertoe strekt dat te weinig belasting wordt ingevorderd, gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig ingevorderde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '64'
        hoofdstuk: VIII
  - number: '65.2'
    text: |-
      Degene die opzettelijk het feit begaat, omschreven in [artikel 64, eerste lid, onderdeel c][ref1], wordt, indien
      het feit ertoe strekt dat te weinig belasting wordt ingevorderd, gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de te
      weinig ingevorderde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '64'
        hoofdstuk: VIII
  - number: '65.3'
    text: |-
      Indien het feit, ter zake waarvan de verdachte kan worden vervolgd, zowel valt onder een van de strafbepalingen van
      het eerste of het tweede lid, als onder die van [artikel 225, tweede lid, van het Wetboek van Strafrecht][ref1], is
      strafvervolging op grond van genoemd artikel 225, tweede lid, uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '65.4'
    text: |-
      Indien de schuldige een van de strafbare feiten, omschreven in het eerste en tweede lid, in zijn beroep begaat, kan
      hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel65
  - number: 65a
    text: |-
      De in deze wet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij deze
      wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel65a
  - number: '66'
    text: |-
      Hoofdstuk IX, afdeling 2 - met uitzondering van [artikel 72][ref1] - en [afdeling 3, van de Algemene wet inzake
      rijksbelastingen](onbekend) is van toepassing met betrekking tot de in [artikel 64][ref2] strafbaar gestelde
      feiten, met dien verstande dat voor belastingwet wordt gelezen Invorderingswet 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '72'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '64'
        hoofdstuk: VIII
  - number: '67.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan noodzakelijk is voor de
      uitvoering van deze wet of voor de heffing van enige rijksbelasting (geheimhoudingsplicht).
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67
  - number: '67.2'
    text: 'De geheimhoudingsplicht geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67
  - number: 67.2.a
    text: enig wettelijk voorschrift tot de bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67
  - number: 67.2.b
    text: |-
      bij regeling van Onze Minister is bepaald dat bekendmaking noodzakelijk is voor de goede vervulling van een
      publiekrechtelijke taak van een bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67
  - number: 67.2.c
    text: |-
      bekendmaking plaatsvindt aan degene op wie de gegevens betrekking hebben voorzover deze gegevens door of namens hem
      zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67
  - number: '67.3'
    text: In andere gevallen dan bedoeld in het tweede lid kan Onze Minister ontheffing verlenen van de geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67
  - number: 67a.1
    text: |-
      Ter bevordering van een doelmatige invordering van de uit een belastingwet voortvloeiende schuld of van een op
      grond van deze wet of een belastingwet op te leggen bestuurlijke boete kan de ontvanger afwijken van het overigens
      bij of krachtens deze wet bepaalde, indien:
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67a
  - number: 67a.1.a
    text: de belastingschuldige instemt met deze wijze van invorderen, en
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67a
  - number: 67a.1.b
    text: |-
      de invordering niet leidt tot voldoening van een lagere schuld dan de schuld die voortvloeit uit de belastingwet
      of tot voldoening van een lagere bestuurlijke boete dan de op grond van deze wet of de belastingwet opgelegde
      bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67a
  - number: 67a.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67a
  - number: 67a.3
    text: |-
      In afwijking van [artikel 2, eerste lid, onderdeel k][ref1], wordt voor de toepassing
      van dit artikel mede verstaan onder belastingschuldige: degene die zonder toepassing van
      [artikel 64 van de Algemene wet inzake rijksbelastingen][ref2] een belastingschuldige als bedoeld in artikel 2,
      eerste lid, onderdeel k, zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel64
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '64'
  - number: '68'
    text: |-
      De verzending en de betekening van de stukken betreffende de invordering van de schenk- en erfbelasting kan
      plaatsvinden aan de ingevolge [artikel 43 van de Successiewet 1956][ref1] gekozen woonplaats dan wel aan de
      werkelijke woonplaats of plaats van vestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel43
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '43'
  - number: '69'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel69
  - number: '70'
    text: |-
      [Artikel 22, derde lid][ref1], vervalt op 1 januari 1993, tenzij voordien een wetsvoorstel, houdende een
      definitieve regeling omtrent het fiscaal bodemrecht bij de Tweede Kamer der Staten-Generaal is ingediend, dan wel
      een wetsvoorstel houdende een verlenging van de geldigheidsduur van voornoemde bepaling voor een tijd van niet
      langer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel22
    url: https://wetten.overheid.nl/BWBR0004770/2018-09-18#Artikel70
