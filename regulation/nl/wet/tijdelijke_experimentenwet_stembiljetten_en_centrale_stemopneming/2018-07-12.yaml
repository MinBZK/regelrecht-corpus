  - number: '4'
    text: |-
      1 Dit artikel is van toepassing indien Onze Minister voor een experiment een stembiljet vaststelt waarbij logo’s
      van politieke groeperingen kunnen worden gebruikt.

      2 In het register, bedoeld in de [artikelen G 1][ref1] of [Y 2][ref2] juncto artikel G 1, van de Kieswet, worden
      tevens de logo’s van politieke groeperingen bijgehouden.

      3 Een politieke groepering kan het centraal stembureau verzoeken haar logo te registreren, dan wel haar
      geregistreerde logo te wijzigen. Verzoeken die zijn ontvangen na de tweeënveertigste dag voor de kandidaatstelling,
      blijven voor de daaropvolgende verkiezing buiten behandeling.

      4 Het centraal stembureau beschikt slechts afwijzend op het verzoek, indien:

      a. bij dat centraal stembureau de aanduiding van de politieke groepering niet is geregistreerd en, indien van
      toepassing, een reeds ingediend verzoek tot registratie van de aanduiding wordt afgewezen;

      b. het logo strijdig is met de openbare orde;

      c. het logo geheel of in de hoofdzaak overeenstemt met een reeds geregistreerde logo van een andere politieke
      groepering, of met een logo waarvoor reeds eerder op grond van dit artikel een registratieverzoek is ontvangen, en
      daardoor verwarring te duchten is;

      d. het logo anderszins misleidend is voor de kiezers;

      e. het logo geheel of in hoofdzaak overeenstemt met die van een rechtspersoon die bij onherroepelijke rechterlijke
      uitspraak verboden is verklaard en deswege is ontbonden;

      f. het verzoek op dezelfde dag bij het centraal stembureau is ingekomen als een ander verzoek, strekkende tot
      inschrijving van een geheel of in hoofdzaak overeenstemmend logo, tenzij dat andere verzoek reeds op een van de
      onder a tot en met e genoemde gronden moet worden afgewezen.

      5 Het centraal stembureau schrapt het logo van een politieke groepering wanneer het de aanduiding van die politieke
      groepering schrapt, dan wel op verzoek van die politieke groepering.

      6 [Artikel Y 10 van de Kieswet][ref3] is van overeenkomstige toepassing.

      7 [Artikel G 5 van de Kieswet][ref4] is van overeenkomstige toepassing op een besluit dat is genomen op grond van
      dit artikel.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop een logo wordt overgelegd.


