  - number: '5'
    text: |-
      1 Onze Minister zendt voor 1 januari 2018 aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van het experiment in de praktijk, alsmede een standpunt inzake de voortzetting van die maatregel, anders
      dan als experiment.

      2 Bij de algemene maatregel van bestuur, bedoeld in [artikel 3, tweede lid][ref1], worden tevens de criteria voor
      de evaluatie van de experimenten geregeld.


