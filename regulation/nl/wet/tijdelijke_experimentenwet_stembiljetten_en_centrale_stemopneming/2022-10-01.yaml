  - number: '3.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel3
  - number: '3.4'
    text: |-
      Een voorziening als bedoeld in [artikel 2, derde lid][ref1], wordt slechts aangewezen indien deze ten minste aan de
      volgende vereisten voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0033598#Artikel2
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033598
        artikel: '2'
  - number: 3.4.a
    text: het geheime karakter van de stemming is voldoende gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel3
  - number: 3.4.b
    text: de transparantie, controleerbaarheid en betrouwbaarheid van de verkiezing is voldoende gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel3
  - number: 4a.1
    text: Artikel 4 van deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel4a
  - number: 4a.2
    text: |-
      De [artikelen Ya 43][ref1], [Ya 45][ref2] en [Ya 46, eerste, derde en vijfde lid, van de Kieswet][ref3] zijn van
      overeenkomstige toepassing op een beschikking die is genomen op grond van artikel 4.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0004627
  - number: '5.1'
    text: |-
      Onze Minister zendt na elk experiment aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk.
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel5
  - number: '5.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 3, tweede lid][ref1], worden tevens de criteria voor de
      evaluatie van de experimenten geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0033598#Artikel3
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel5
