preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is tijdelijke regels vast te stellen voor experimenten met
    stembiljetten, ter bevordering van de mogelijkheid voor kiezers buiten Nederland hun stem tijdig uit te brengen,
    alsmede tijdelijke regels vast te stellen voor experimenten met een centrale opzet van de stemopneming, ter
    bevordering van de efficiency, transparantie en controleerbaarheid van de stemopneming;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan besluiten dat experimenten plaatsvinden bij een stemopneming tijdens verkiezingen als bedoeld
      in de [Kieswet][ref1] en de [Wet algemene regels herindeling][ref2] met als doel de invoering van een centrale
      opzet van de stemopneming op gemeentelijk niveau op één of meer locaties, waardoor de efficiency, transparantie en
      controleerbaarheid van de stemopneming worden bevorderd.

      2 Onze Minister kan, na instemming van de betrokken gemeenteraden, gemeenten aanwijzen waar een experiment wordt
      gehouden.

      3 Onze Minister wijst de voorzieningen aan die bij een experiment worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0003718
    url: https://wetten.overheid.nl/BWBR0033598/2022-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0003718
  - number: '3'
    text: |-
      1 De experimenten vinden voor zover mogelijk plaats overeenkomstig hetgeen bij en krachtens de [Kieswet][ref1]
      is bepaald.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de experimenten en de daarbij
      te gebruiken voorzieningen. Deze regels kunnen op het naastlagere niveau afwijken van het bepaalde bij en krachtens
      de volgende onderdelen:

      a. de [artikelen E 4 tot en met E 10][ref2] en [E 11, derde, vierde en vijfde lid, van de Kieswet][ref3] zodat bij
      een experiment gemeentelijke stembureaus kunnen worden ingesteld en de taken van hoofdstembureaus kunnen worden
      toebedeeld aan de gemeentelijke stembureaus en het centrale stembureau;

      b. de [artikelen J 1, vierde lid][ref4], [J 4a, derde lid][ref5], en [J 35][ref6], de [hoofdstukken N][ref7] en
      [O][ref8], en de [artikelen P 1][ref9], [P 21, derde lid][ref10], en [P 22, van de Kieswet][ref11] met betrekking
      tot de stemopneming en de taken en werkwijze van het stembureau, het briefstembureau, de burgemeester, het
      hoofdstembureau en centraal stembureau bij de vaststelling van de verkiezingsuitslag;

      c. de [artikelen Y 2][ref12], [Y 22 tot en met Y 23][ref13], [Y 24][ref14] en [Y 39, van de Kieswet][ref15] zodat
      een experiment ook tijdens de verkiezing van de Nederlandse leden van het Europees Parlement kan worden gehouden.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.

      4 Een voorziening als bedoeld in [artikel 2, derde lid][ref16], wordt slechts aangewezen indien deze ten minste aan
      de volgende vereisten voldoet:

      a. het geheime karakter van de stemming is voldoende gewaarborgd; en

      b. de transparantie, controleerbaarheid en betrouwbaarheid van de verkiezing is voldoende gewaarborgd.


