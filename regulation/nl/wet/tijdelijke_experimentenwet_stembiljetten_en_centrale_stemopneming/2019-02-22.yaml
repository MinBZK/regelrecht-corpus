preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is tijdelijke regels vast te stellen voor experimenten met
    stembiljetten, ter bevordering van de mogelijkheid voor kiezers buiten Nederland hun stem tijdig uit te brengen,
    alsmede tijdelijke regels vast te stellen voor experimenten met een centrale opzet van de stemopneming, ter
    bevordering van de efficiency, transparantie en controleerbaarheid van de stemopneming;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister kan besluiten dat experimenten plaatsvinden bij een stemming of stemopneming tijdens verkiezingen als
      bedoeld in de [Kieswet][ref1] en de [Wet algemene regels herindeling][ref2] met als doel de invoering van:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0003718
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0003718
  - number: 2.1.a
    text: |-
      een stembiljet, waardoor de mogelijkheid voor kiezers buiten Nederland hun stem tijdig uit te brengen wordt
      bevorderd, doordat het stembiljet eerder kan worden toegezonden of van de elektronische weg gebruik kan worden
      gemaakt; of
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel2
  - number: 2.1.b
    text: |-
      een centrale opzet van de stemopneming op gemeentelijk niveau op één of meer locaties, waardoor de efficiency,
      transparantie en controleerbaarheid van de stemopneming worden bevorderd.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan, na instemming van de betrokken gemeenteraden, gemeenten aanwijzen waar een experiment wordt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel2
  - number: '2.3'
    text: Onze Minister wijst de voorzieningen aan die bij een experiment worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel2
  - number: '3.1'
    text: |-
      De experimenten vinden voor zover mogelijk plaats overeenkomstig hetgeen bij en krachtens de [Kieswet][ref1] is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de experimenten en de daarbij te
      gebruiken voorzieningen. Deze regels kunnen op het naastlagere niveau afwijken van het bepaalde bij en krachtens de
      volgende onderdelen:
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
  - number: 3.2.a
    text: |-
      de [artikelen E 4 tot en met E 10][ref1] en [E 11, derde, vierde en vijfde lid, van de Kieswet][ref2] zodat bij
      een experiment gemeentelijke stembureaus kunnen worden ingesteld en de taken van hoofdstembureaus kunnen worden
      toebedeeld aan de gemeentelijke stembureaus en het centrale stembureau;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: 3.2.b
    text: |-
      de [artikelen J 20][ref1], [M 1][ref2] en [M 2][ref3], [M 6 tot en met M 12][ref4] en
      [M 14 tot en met M 17, van de Kieswet][ref5] met betrekking tot het verzenden en retourneren van bescheiden, de
      wijze waarop de stem wordt uitgebracht, de werkwijze en samenstelling van het briefstembureau, de inrichting van
      het briefstembureaulokaal, en de gang van zaken bij de ontvangst en het openen van retourenveloppen;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_2
