    text: |-
      de [artikelen Y 2][ref1], [Y 22 tot en met Y 23][ref2], [Y 24][ref3] en [Y 39, van de Kieswet][ref4] zodat een
      experiment ook tijdens de verkiezing van de Nederlandse leden van het Europees Parlement kan worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627
      [ref4]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
    references:
