      - id: ref4
        bwb_id: BWBR0004627
  - number: '3.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
  - number: '3.4'
    text: |-
      Een voorziening als bedoeld in [artikel 2, derde lid][ref1], wordt slechts aangewezen indien deze ten minste aan de
      volgende vereisten voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0033598#Artikel2
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033598
        artikel: '2'
  - number: 3.4.a
    text: het geheime karakter van de stemming is voldoende gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
  - number: 3.4.b
    text: de transparantie, controleerbaarheid en betrouwbaarheid van de verkiezing is voldoende gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel3
  - number: '4.1'
    text: |-
      Dit artikel is van toepassing indien Onze Minister voor een experiment een stembiljet vaststelt waarbij logo’s van
      politieke groeperingen kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: '4.2'
    text: |-
      In het register, bedoeld in de [artikelen G 1][ref1] of [Y 2][ref2] juncto artikel G 1, van de Kieswet, worden
      tevens de logo’s van politieke groeperingen bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: '4.3'
    text: |-
      Een politieke groepering kan het centraal stembureau verzoeken haar logo te registreren, dan wel haar
      geregistreerde logo te wijzigen. Verzoeken die zijn ontvangen na de tweeënveertigste dag voor de kandidaatstelling,
      blijven voor de daaropvolgende verkiezing buiten behandeling.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: '4.4'
    text: 'Het centraal stembureau beschikt slechts afwijzend op het verzoek, indien:'
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: 4.4.a
    text: |-
      bij dat centraal stembureau de aanduiding van de politieke groepering niet is geregistreerd en, indien van
      toepassing, een reeds ingediend verzoek tot registratie van de aanduiding wordt afgewezen;
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: 4.4.b
    text: het logo strijdig is met de openbare orde;
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: 4.4.c
    text: |-
      het logo geheel of in de hoofdzaak overeenstemt met een reeds geregistreerde logo van een andere politieke
      groepering, of met een logo waarvoor reeds eerder op grond van dit artikel een registratieverzoek is ontvangen, en
      daardoor verwarring te duchten is;
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: 4.4.d
    text: het logo anderszins misleidend is voor de kiezers;
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: 4.4.e
    text: |-
      het logo geheel of in hoofdzaak overeenstemt met die van een rechtspersoon die bij onherroepelijke rechterlijke
      uitspraak verboden is verklaard en deswege is ontbonden;
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: 4.4.f
    text: |-
      het verzoek op dezelfde dag bij het centraal stembureau is ingekomen als een ander verzoek, strekkende tot
      inschrijving van een geheel of in hoofdzaak overeenstemmend logo, tenzij dat andere verzoek reeds op een van de
      onder a tot en met e genoemde gronden moet worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: '4.5'
    text: |-
      Het centraal stembureau schrapt het logo van een politieke groepering wanneer het de aanduiding van die politieke
      groepering schrapt, dan wel op verzoek van die politieke groepering.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: '4.6'
    text: |-
      [Artikel Y 10 van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '4.7'
    text: |-
      [Artikel G 5 van de Kieswet][ref1] is van overeenkomstige toepassing op een besluit dat is genomen op grond van
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '4.8'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop een logo wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister zendt voor 1 januari 2020 aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk, alsmede een standpunt inzake de voortzetting van die maatregel, anders dan als
      experiment.
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel5
  - number: '5.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 3, tweede lid][ref1], worden tevens de criteria voor de
      evaluatie van de experimenten geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0033598#Artikel3
    url: https://wetten.overheid.nl/BWBR0033598/2019-02-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033598
        artikel: '3'
