---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verordening_financien_bedrijfslichamen_2011
regulatory_layer: WET
publication_date: '2015-03-06'
valid_from: '2013-05-04'
bwb_id: BWBR0029876
url: https://wetten.overheid.nl/BWBR0029876/2013-05-04
preamble:
  text: |-
    Gehoord de Bestuurskamer en de Toezichtkamer;

    Gelet op de artikelen 35, 122 en 125 van de Wet op de bedrijfsorganisatie;

    Gelet op de Instellingsverordening Bestuurskamer 2008;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze verordening wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel1
  - number: '1.2'
    text: |-
      Deze verordening is mede van toepassing op voorzieningen ter gemeenschappelijke behartiging van belangen als
      bedoeld in [artikel 109 en verder van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel109
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '109'
  - number: '2.1'
    text: |-
      De financiële jaarstukken van bedrijfslichamen bestaan uit de meerjarenraming, de begroting en de jaarrekening, die
      integraal in onderling verband tot elkaar staan.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel2
  - number: '2.2'
    text: |-
      De meerjarenraming, de begroting en de jaarrekening geven volgens normen die in het maatschappelijk verkeer
      als aanvaardbaar worden beschouwd een zodanig inzicht dat een verantwoord oordeel kan worden gevormd over het
      financieel beheer in het algemeen en het vermogen en de geraamde en gerealiseerde baten en lasten in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel2
  - number: '3.1'
    text: Voor de meerjarenraming, de begroting en de jaarrekening wordt het stelsel van baten en lasten gehanteerd.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel3
  - number: '3.2'
    text: Boekjaren komen overeen met kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel3
  - number: '3.3'
    text: |-
      De indeling van de meerjarenraming, de begroting en de jaarrekening kan slechts om gegronde redenen afwijken van
      die van het voorafgaande boekjaar; in de toelichting worden de verschillen aangegeven en gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel3
  - number: '4.1'
    text: |-
      De baten en lasten worden ingedeeld in de baten- en lastenrubrieken, vermeld in [bijlage 1][ref1] bij deze
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0029876
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029876
  - number: '4.2'
    text: |-
      In de meerjarenraming, de begroting en de jaarrekening mogen baten en lasten of activa en passiva niet tegen elkaar
      wegvallen, indien deze posten afzonderlijk moeten worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel4
  - number: '5.1'
    text: |-
      Bij de meerjarenraming, de begroting en de jaarrekening worden de gehanteerde grondslagen voor de bepaling van de
      baten en lasten en voor de waardering van de activa en passiva vermeld.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel5
  - number: '5.2'
    text: |-
      Slechts om gegronde redenen kunnen de bepaling van de baten en de lasten en de waardering van de activa en de
      passiva geschieden op andere grondslagen dan die welke in het voorafgaande boekjaar zijn toegepast. De reden
      van de verandering wordt in de toelichting uiteengezet. Tevens wordt inzicht gegeven in de betekenis ervan voor
      de financiële positie en voor de baten en de lasten aan de hand van aangepaste cijfers voor het desbetreffende
      boekjaar en het daaraan voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel5
  - number: '6.1'
    text: Het bestuur van een bedrijfslichaam legt het vermogensbeleid schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel6
  - number: '6.2'
    text: 'Met het vermogensbeleid wordt ten minste een onderbouwd inzicht verschaft in:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel6
  - number: 6.2.a
    text: de financieringsbehoefte en de omvang van de benodigde middelen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel6
  - number: 6.2.b
    text: |-
      het streefniveau voor de som van de algemene reserve en bestemmingsreserves in samenhang met de
      financieringsbehoefte en de omvang van de benodigde middelen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel6
  - number: 6.2.c
    text: |-
      de maatregelen die worden getroffen om het gewenste streefniveau te realiseren, in het geval het gewenste
      streefniveau niet is gerealiseerd of naar verwachting niet wordt gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel6
  - number: 6.2.d
    text: |-
      de uitgangspunten en de bijbehorende criteria voor het beheer van de financiële vaste activa, vlottende activa en
      de liquide middelen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel6
  - number: '6.3'
    text: |-
      De in het tweede lid onder d. genoemde uitgangspunten en criteria behelzen ten minste de aard, de mate van directe
      opeisbaarheid, de samenstelling en de in acht te nemen prudentie.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel6
  - number: '7.1'
    text: Activa en passiva worden gewaardeerd op basis van de verkrijgings- of vervaardigingsprijs.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: '7.2'
    text: 'In afwijking van het bepaalde in het eerste lid worden:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: 7.2.a
    text: |-
      voorraden tegen opbrengstwaarde gewaardeerd indien de opbrengstwaarde lager is dan de verkrijgings- of
      vervaardigingsprijs;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: 7.2.b
    text: vorderingen, onder aftrek van eventuele voorzieningen wegens oninbaarheid, tegen de nominale waarde gewaardeerd;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: 7.2.c
    text: liquide middelen tegen de nominale waarde gewaardeerd;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: 7.2.d
    text: schulden tegen de nominale waarde gewaardeerd;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: 7.2.e
    text: voorzieningen tegen de nominale waarde gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid wordt bij de waardering van de vaste activa rekening gehouden
      met een vermindering of vermeerdering van hun waarde, indien deze vermindering respectievelijk vermeerdering naar
      verwachting bestendig is.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel7
  - number: '8.1'
    text: |-
      Waardevermindering of waardevermeerdering van de in [artikel 7, tweede lid][ref1] bedoelde activa worden
      onafhankelijk van het resultaat van het boekjaar in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029876#Artikel7
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029876
        artikel: '7'
        paragraaf: '2'
  - number: '8.2'
    text: Het verschil tussen verkrijgingsprijs en marktwaarde van effecten wordt in de toelichting op de balans opgenomen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel8
  - number: '9.1'
    text: Bij toepassing van waarderings- en afschrijvingsmethoden wordt het toerekeningsbeginsel in acht genomen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel9
  - number: '9.2'
    text: De methoden volgens welke de afschrijvingen zijn berekend worden in de toelichting op de balans uiteengezet.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel9
  - number: '10.1'
    text: Jaarlijks wordt een meerjarenraming opgesteld. Deze maakt deel uit van de toelichting op de begroting.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel10
  - number: '10.2'
    text: |-
      De meerjarenraming geeft, voor het begrotingsjaar en een periode van ten minste de twee daarop volgende jaren, een
      getrouw, duidelijk en stelselmatig inzicht in de ontwikkeling van de baten, de lasten en het vermogen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel10
  - number: '10.3'
    text: Uitgangspunt voor de meerjarenraming is het beleid dat ten grondslag ligt aan de bedragen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel10
  - number: '11.1'
    text: De begroting bestaat ten minste uit de begrotingsverordening en de toelichting daarop.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel11
  - number: '11.2'
    text: |-
      De begrotingsverordening wordt ingericht overeenkomstig [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029876
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029876
  - number: '11.3'
    text: |-
      De begroting geeft een getrouw, duidelijk en stelselmatig inzicht in de omvang van alle begrote baten en lasten van
      het begrotingsjaar, het saldo daarvan alsmede de stand van de reserves.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel11
  - number: '11.4'
    text: |-
      Het in het derde lid genoemde inzicht omvat, in samenhang met de meerjarenraming, ten minste de beleidsvoornemens
      die aan de begroting ten grondslag liggen en het te voeren vermogensbeleid.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel11
  - number: '12.1'
    text: |-
      In de begroting worden de belangrijkste posten en de belangrijkste verschillen ten opzichte van het vorige
      begrotingsjaar toegelicht.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: '12.2'
    text: 'De toelichting bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.a
    text: |-
      een specificatie van de baten en lasten als bedoeld in [bijlage 2][ref1] aangevuld met bedragen voor begin- en
      eindstand van de omvang van de algemene reserve, bestemmingsreserves en eventuele bestemmingsfondsen;


      [ref1]: https://wetten.overheid.nl/BWBR0029876
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029876
  - number: 12.2.b
    text: |-
      een overzicht van de algemene heffings-, bestemmingsheffings- en retributieverordeningen die ten grondslag liggen
      aan de begroting, met hun tarieven, heffingsgrondslagen, begrote bruto-heffingsopbrengst(en), eventuele aftrek als
      bedoeld in [artikel 126, zesde lid, van de wet][ref1] en begrote netto-opbrengst(en);


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '126'
  - number: 12.2.c
    text: een uiteenzetting over de financiële positie van het bedrijfslichaam;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.d
    text: een overzicht van de personele sterkte, zowel uitgedrukt in aantal personeelsleden als in voltijdeenheden;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.e
    text: 'een overzicht van de personeelskosten gespecificeerd naar:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.e.a
    text: salarissen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.e.b
    text: socialeverzekeringspremies;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.e.c
    text: pensioenpremies;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.e.d
    text: niet in premieverband betaalde sociale lasten en overige personeelskosten van het eigen personeel;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.f
    text: |-
      een overzicht van de vergoedingen van de voorzitter, ingericht overeenkomstig het bepaalde in
      __REF000___________________________________________________________________________________________________________
      ___________;


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
  - number: 12.2.g
    text: |-
      vermelding van de benoemingsgerechtigde organisaties waaraan subsidie wordt verstrekt of waarvan diensten worden
      ingekocht, alsmede instellingen waarin deze organisaties participeren en waaraan subsidie wordt verstrekt of
      waarvan diensten ten behoeve van de sector of het schap worden ingekocht, plus de daarmee gemoeide bedragen en
      de bestedingsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: 12.2.h
    text: |-
      vermelding van de overige personen en rechtspersonen waaraan subsidie wordt verstrekt of waarvan diensten ten
      behoeve van de sector worden ingekocht, plus de daarmee gemoeide bedragen en de bestedingsdoeleinden; hierbij geldt
      als ondergrens: 50.000 euro per subsidie of ingekochte dienst ten behoeve van de sector of, indien het totaal aan
      subsidies of ingekochte diensten niet méér bedraagt dan een miljoen euro, vijf procent van het begrote bedrag aan
      subsidies en ingekochte diensten;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: '12.3'
    text: |-
      De specificaties en overzichten in het tweede lid onder a., d., e. en f. bevatten de bedragen van het komende
      begrotingsjaar, het lopende begrotingsjaar en de gerealiseerde bedragen van het daaraan voorafgaande verslagjaar.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel12
  - number: '13.1'
    text: |-
      Een bedrijfslichaam kan slechts overgaan tot het verstrekken van subsidie of het inkopen van diensten ten behoeve
      van de sector indien aan de volgende uitgangspunten is voldaan:
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel13
  - number: 13.1.a
    text: |-
      het doel van de subsidie of de ingekochte dienst ten behoeve van de sector is herleidbaar tot de taken en
      bevoegdheden van het bedrijfslichaam, bedoeld in [artikel 71 van de wet][ref1] en in zijn instellingsbesluit;


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel71
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '71'
  - number: 13.1.b
    text: |-
      het doel van de subsidie of de ingekochte dienst ten behoeve van de sector is niet of niet goed te bereiken door
      middel van financiering door privaatrechtelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel13
  - number: 13.1.c
    text: |-
      het bedrijfslichaam kan de activiteiten waarvoor de subsidie wordt verleend of de dienst ten behoeve van de sector
      wordt ingekocht niet of niet goed zelf uitvoeren;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel13
  - number: 13.1.d
    text: |-
      de activiteiten waarvoor de subsidie wordt verleend of de dienst ten behoeve van de sector wordt ingekocht komen
      in beginsel ten goede aan alle ondernemingen waarvoor het bedrijfslichaam is ingesteld, of die behoren tot een
      bepaalde branche of sector binnen zijn werkingssfeer, en de daarbij betrokken personen; en
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel13
  - number: 13.1.e
    text: |-
      er is voorzien in een tijdige evaluatie van de doelmatigheid en de doeltreffendheid van de subsidie of de
      ingekochte dienst ten behoeve van de sector.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel13
  - number: '13.2'
    text: |-
      In het geval de besluitvorming door het bestuur van het bedrijfslichaam over het verlenen van subsidie of het
      inkopen van een dienst ten behoeve van de sector plaatsvindt via de begroting wordt in de toelichting op de
      begroting voor deze subsidie of in te kopen dienst ten behoeve van de sector verantwoord op welke wijze aan de
      onderdelen a. tot en met e., genoemd in het eerste lid, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel13
  - number: '14.1'
    text: |-
      In het geval van een overschrijding van de in de begroting uitgetrokken bedragen van de lasten, alsmede voor lasten
      welke in de begroting niet waren voorzien, wordt een herziene begroting opgesteld.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel14
  - number: '14.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing indien het bedrag van de overschrijding respectievelijk
      van de onvoorziene lasten niet meer dan vijf procent van de totale lasten bedraagt of indien blijkt dat voor de
      overschrijding compensatie in de totale baten wordt gevonden.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel14
  - number: '15'
    text: |-
      Transacties die geen onderdeel zijn van de reguliere bedrijfsvoering of het primaire proces van de bedrijfslichamen
      worden, voor zover deze zijn voorzien, opgenomen in de jaarlijkse begroting en daarin afzonderlijk toegelicht. In
      andere gevallen worden voor dergelijke transacties herziene begrotingsverordeningen opgesteld.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel15
  - number: '16.1'
    text: 'De jaarrekening bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel16
  - number: 16.1.a
    text: de rekening van baten en lasten en de toelichting daarop;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel16
  - number: 16.1.b
    text: de balans en de toelichting daarop.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel16
  - number: '16.2'
    text: |-
      De jaarrekening wordt vastgesteld met inachtneming van hetgeen omtrent de financiële positie op de balansdatum is
      gebleken tussen het moment van opmaken van de jaarrekening en het tijdstip van vaststelling daarvan, voor zover
      deze aanvullende informatie onontbeerlijk is voor het in [artikel 2][ref1] bedoelde inzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0029876#Artikel2
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029876
        artikel: '2'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      De jaarrekening geeft, in samenhang met de meerjarenraming en de begroting, inzicht in de betekenis van de
      resultaten van het gevoerde beleid, dat ten grondslag heeft gelegen aan de bedragen in de rekening, voor het te
      voeren beleid.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel17
  - number: '17.2'
    text: |-
      De jaarrekening geeft, in samenhang met de meerjarenraming en de begroting, inzicht in de betekenis van de
      resultaten van het gevoerde vermogensbeleid voor het te voeren vermogensbeleid.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel17
  - number: '18'
    text: |-
      De rekening van baten en lasten en de toelichting daarop geven getrouw, duidelijk en stelselmatig de omvang van
      alle baten en alle lasten, alsmede het saldo daarvan weer.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel18
  - number: '19'
    text: |-
      Het besluit tot vaststelling van de rekening van baten en lasten is ingericht overeenkomstig de inrichting van
      de begrotingsverordening en bevat, zoals schematisch weergegeven in [bijlage 3][ref1], de voor het verslagjaar
      gerealiseerde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0029876
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0029876
  - number: '20'
    text: |-
      De toelichting op de rekening van baten en lasten is ingericht overeenkomstig de inrichting van de toelichting op
      de begroting zoals bepaald in [artikel 12][ref1], aangevuld met:


      [ref1]: https://wetten.overheid.nl/BWBR0029876#Artikel12
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0029876
        artikel: '12'
        paragraaf: '4'
  - number: 20.a
    text: een toelichting op belangrijke afwijkingen tussen begrote en gerealiseerde baten en lasten;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel20
  - number: 20.b
    text: |-
      een overzicht van de personele sterkte per 1 januari en per 31 december van het verslagjaar, zowel uitgedrukt in
      aantal personeelsleden als in voltijdeenheden en aangevuld met een overzicht van de verdeling van de personele
      sterkte – omgerekend naar voltijdeenheden – over de door het bedrijfslichaam gehanteerde salarisschalen/
      functiegroepen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel20
  - number: 20.c
    text: |-
      De specificaties en de overzichten in de toelichting op de rekening van baten en lasten hebben betrekking op het
      verslagjaar, de begroting voor dat jaar en het voorgaande verslagjaar.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel20
  - number: 20.d
    text: |-
      Een toelichting op de toepassing van de onderdelen a. tot en met e., genoemd in het
      [eerste lid van artikel 13][ref1], bij verleende subsidies en ingekochte diensten ten behoeve van de sector.


      [ref1]: https://wetten.overheid.nl/BWBR0029876#Artikel13
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0029876
        artikel: '13'
        paragraaf: '4'
  - number: '21.1'
    text: |-
      De balans, zoals schematisch weergegeven in [bijlage 4][ref1], geeft tezamen met de toelichting daarop getrouw,
      duidelijk en stelselmatig de financiële positie en de samenstelling daarvan in actief- en passiefposten op het
      einde van het verslagjaar weer.


      [ref1]: https://wetten.overheid.nl/BWBR0029876
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0029876
  - number: '21.2'
    text: De balans bevat ook de cijfers van het voorafgaande verslagjaar.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel21
  - number: '22'
    text: |-
      In de toelichting op de balans wordt vermeld tot welke belangrijke, niet uit de balans blijkende, financiële
      verplichtingen het bedrijfslichaam voor de toekomst is verbonden, zoals die welke voortvloeien uit langlopende
      overeenkomsten of bijzondere kortlopende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel22
  - number: '23.1'
    text: |-
      In de balans worden de activa onderscheiden in vaste en vlottende activa, al naar gelang zij zijn bestemd om de
      uitoefening van de werkzaamheid van het bedrijfslichaam al dan niet bestendig te dienen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel23
  - number: '23.2'
    text: Onder de vaste activa worden afzonderlijk opgenomen de materiële en de financiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel23
  - number: '23.3'
    text: |-
      Onder de vlottende activa worden afzonderlijk opgenomen de voorraden, de vorderingen, de overlopende activa voor
      zover deze niet zijn begrepen in de vorderingen en de liquide middelen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel23
  - number: '24.1'
    text: 'In de toelichting op de balans worden onder de materiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: 24.1.a
    text: bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: 24.1.b
    text: overige aan de bedrijfsuitoefening dienstbare materiële vaste activa;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: 24.1.c
    text: overige niet aan de bedrijfsuitoefening dienstbare materiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: '24.2'
    text: 'In de toelichting op de balans worden onder de financiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: 24.2.a
    text: deelnemingen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: 24.2.b
    text: langlopende leningen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: 24.2.c
    text: effecten.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: '24.3'
    text: |-
      In de toelichting op de balans wordt het bruto-verloop van de vaste activa gedurende het verslagjaar weergegeven
      in een sluitend overzicht van de beginstanden, van de mutaties waaronder mede begrepen afschrijvingen en
      waardeverminderingen en van de eindstanden op de balansdatum.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: '24.4'
    text: |-
      In de toelichting op de balans wordt verslag gedaan van het gevoerde vermogensbeleid en de daarbij behaalde
      resultaten.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel24
  - number: '25'
    text: |-
      In de toelichting op de balans worden onder de tot de vlottende activa behorende vorderingen afzonderlijk
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel25
  - number: 25.a
    text: vorderingen uit hoofde van heffingen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel25
  - number: 25.b
    text: |-
      vorderingen op stichtingen, fondsen of instellingen waarmee het bedrijfslichaam een bestendige zakelijke relatie
      heeft;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel25
  - number: 25.c
    text: overige vorderingen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel25
  - number: '26.1'
    text: |-
      Onder de passiva worden afzonderlijk opgenomen het eigen vermogen, de voorzieningen, de langlopende schulden en de
      vlottende passiva.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel26
  - number: '26.2'
    text: |-
      Onder de vlottende passiva worden afzonderlijk opgenomen de kortlopende schulden en de overlopende passiva voor
      zover deze niet zijn begrepen in de schulden.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel26
  - number: '27.1'
    text: Onder langlopende schulden worden verstaan de schulden met een resterende looptijd van één jaar of langer.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel27
  - number: '27.2'
    text: |-
      In de toelichting op de balans worden onder de langlopende schulden afzonderlijk opgenomen hypothecaire leningen en
      andere leningen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel27
  - number: '27.3'
    text: |-
      Van de in het tweede lid bedoelde leningen worden naast de omvang van de resterende schuldbedragen vermeld de
      verstrekte zekerheden, de resterende looptijden en de werkelijke rentepercentages.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel27
  - number: '28'
    text: |-
      In de toelichting op de balans worden onder de tot de vlottende passiva behorende kortlopende schulden afzonderlijk
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel28
  - number: 28.a
    text: |-
      schulden aan stichtingen, fondsen of instellingen waarmee het bedrijfslichaam een bestendige zakelijke relatie
      heeft;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel28
  - number: 28.b
    text: banksaldi;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel28
  - number: 28.c
    text: schulden ter zake van belastingen en premies sociale verzekering;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel28
  - number: 28.d
    text: schulden ter zake van pensioenen;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel28
  - number: 28.e
    text: overige schulden.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel28
  - number: '29'
    text: 'Reserves worden in de balans onderscheiden naar:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel29
  - number: 29.a
    text: de algemene reserve;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel29
  - number: 29.b
    text: de bestemmingsreserves; en
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel29
  - number: 29.c
    text: de bestemmingsfondsen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel29
  - number: '30.1'
    text: |-
      In de toelichting op de balans wordt van de algemene reserve, de bestemmingsreserves en de bestemmingsfondsen voor
      het verslagjaar een verloopoverzicht gegeven met het beginsaldo, de mutaties en het eindsaldo.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel30
  - number: '30.2'
    text: |-
      Mutaties van de algemene reserve, de bestemmingsreserves en de bestemmingsfondsen zijn alleen mogelijk indien deze
      passen in de doelstelling van de betreffende reserve of het betreffende fonds.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel30
  - number: '30.3'
    text: Rente- of dividendontvangsten op reserves worden geboekt ten gunste van de rekening van baten en lasten.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel30
  - number: '31'
    text: 'In de toelichting op de balans worden eventuele stille reserves of tekorten geraamd, indien:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel31
  - number: 31.a
    text: de actuele waarde van materiële vaste activa belangrijk afwijkt van de boekwaarde;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel31
  - number: 31.b
    text: de actuarieel wenselijke omvang van voorzieningen belangrijk afwijkt van de feitelijke omvang daarvan.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel31
  - number: '32'
    text: |-
      De som van de algemene reserve en de bestemmingsreserves is maximaal gelijk aan het totaal van de lasten over het
      verslagjaar.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel32
  - number: '33'
    text: |-
      Op voorzieningen en niet in de balans opgenomen verplichtingen is van toepassing Richtlijn B10 van de Richtlijnen
      voor de jaarverslaggeving voor kleine rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel33
  - number: '34.1'
    text: In de toelichting op de balans wordt elke voorziening afzonderlijk vermeld en toegelicht.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: '34.2'
    text: |-
      Per voorziening wordt het bruto verloop gedurende het verslagjaar in een sluitend overzicht weergegeven. Daaruit
      blijken:
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: 34.2.a
    text: het saldo aan het begin van het jaar;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: 34.2.b
    text: de toevoegingen in het jaar ten laste van de rekening van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: 34.2.c
    text: de vermeerderingen in het jaar door ontvangen subsidies;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: 34.2.d
    text: de vermeerderingen in het jaar door overige ontvangsten van derden;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: 34.2.e
    text: de vrijgevallen bedragen in het jaar ten gunste van de rekening van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: 34.2.f
    text: de aanwending in het jaar;
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: 34.2.g
    text: het saldo aan het einde van het jaar.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel34
  - number: '35.1'
    text: |-
      Externe en onafhankelijke controle van de jaarrekening wordt door het bestuur opgedragen aan een accountant die
      is ingeschreven in het accountantsregister genoemd in [artikel 36 van de Wet op het accountantsberoep][ref1], niet
      zijnde een interne accountant van een bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '36'
  - number: '35.2'
    text: De onafhankelijke accountant brengt omtrent zijn onderzoek verslag uit aan het (dagelijks) bestuur.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel35
  - number: '35.3'
    text: |-
      De onafhankelijke accountant geeft de uitslag van zijn onderzoek weer in een controleverklaring omtrent de
      getrouwheid van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel35
  - number: '36.1'
    text: |-
      Bij zijn controle betrekt de onafhankelijke accountant de naleving door het bedrijfslichaam van deze verordening.
      Hiervan geeft de accountant kennis in zijn verklaring.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel36
  - number: '36.2'
    text: |-
      De in [artikel 35, derde lid][ref1] bedoelde accountantsverklaring wordt tegelijk met de jaarrekening van het
      bedrijfslichaam aan de Toezichtkamer overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0029876#Artikel35
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029876
        artikel: '35'
        paragraaf: '6'
  - number: '37'
    text: |-
      Op gemotiveerd verzoek van het bestuur van een bedrijfslichaam kan door de Toezichtkamer in bijzondere gevallen,
      waarin de nakoming van een bij deze verordening opgelegde verplichting op overwegende bezwaren stuit, of wegens
      andere bijzondere omstandigheden, aan het bedrijfslichaam ontheffing van die verplichting worden verleend. Aan deze
      ontheffing kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel37
  - number: '38.1'
    text: |-
      Er is een commissie met vertegenwoordigers van bedrijfslichamen en van het secretariaat van de Bestuurskamer,
      die de Bestuurskamer gevraagd en ongevraagd adviseert over de voorschriften en richtlijnen voor de begroting en
      jaarverslaglegging en de toepassing ervan.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel38
  - number: '38.2'
    text: De leden van de commissie worden benoemd door de Bestuurskamer.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel38
  - number: '39'
    text: |-
      De [Verordening financiën bedrijfslichamen 1999][ref1] wordt ingetrokken, met dien verstande dat hij van kracht
      blijft voor de begrotingen en de jaarrekeningen over de aan 2012 voorafgaande begrotingsjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009299
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009299
  - number: '40'
    text: Deze verordening wordt bekendgemaakt in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel40
  - number: '41'
    text: |-
      Deze verordening treedt in werking met ingang van 1 januari 2012, met dien verstande dat hij voor het eerst wordt
      toegepast bij het opstellen van de begrotingen voor het jaar 2012.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel41
  - number: '42'
    text: Deze verordening wordt aangehaald als Verordening financiën bedrijfslichamen 2011.
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel42
  - number: B2:1
    text: 'De begroting van baten en lasten van het (bedrijfslichaam) voor (jaar) is als volgt:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel1
  - number: B2:2
    text: De verordening treedt in werking met ingang van 1 januari (jaar).
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel2
  - number: B2:3
    text: Deze verordening wordt aangehaald als Verordening Begroting (jaar). (plaats), (datum) voorzitter secretaris
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel3
  - number: B3:1
    text: 'De rekening van baten en lasten van het (bedrijfslichaam) over (jaar) is als volgt:'
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel1
  - number: B3:2
    text: Dit besluit wordt aangehaald als Besluit rekening baten en lasten (jaar). (plaats), (datum) voorzitter secretaris
    url: https://wetten.overheid.nl/BWBR0029876/2013-05-04#Artikel2
