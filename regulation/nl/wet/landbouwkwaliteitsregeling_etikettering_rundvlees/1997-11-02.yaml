$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: landbouwkwaliteitsregeling_etikettering_rundvlees
regulatory_layer: WET
publication_date: '2007-09-28'
valid_from: '1997-11-02'
bwb_id: BWBR0008931
url: https://wetten.overheid.nl/BWBR0008931/1997-11-02
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Economische Zaken;

    Gelet op verordening (EG) nr. 1141/97 van de Commissie van de Europese Gemeenschappen van 23 juni 1997 houdende
    nadere bepalingen ter uitvoering van verordening (EG) nr. 820/97 van de Raad wat de etikettering van rundvlees
    en rundvleesproducten betreft (PbEG L 165) en de artikelen 3 en 4 van het Landbouwkwaliteits-besluit etikettering
    rundvlees;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            besluit:

              [Landbouwkwaliteitsbesluit etikettering rundvlees][ref1];



            b

              [verordening 1141/97](31997R1141):

              [verordening (EG) nr. 1141/97](31997R1141) van de Commissie van de Europese Gemeenschappen van 23 juni
      1997 houdende nadere bepalingen ter uitvoering van [verordening (EG) nr. 820/97](31997R0820) van de Raad wat de
      etikettering van rundvlees en rundvleesproducten betreft (PbEG L 165).


      [ref1]: https://wetten.overheid.nl/BWBR0008947
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008947
  - number: '2'
    text: |-
      Het Produktschap wordt aangewezen als de bevoegde autoriteit, bedoeld in artikel 20 van [verordening 820/97]
      (31997R0820).
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel2
  - number: '3.1'
    text: |-
      Het bestuur van het Produktschap is belast met het nemen van de in [artikel 3, eerste lid, van het besluit][ref1]
      genoemde besluiten en maatregelen met inachtneming van het bepaalde in [verordening 820/97](31997R0820) en
      [verordening 1141/97](31997R1141).


      [ref1]: https://wetten.overheid.nl/BWBR0008947#Artikel3
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008947
        artikel: '3'
  - number: '3.2'
    text: 'Bij verordening van het bestuur van het Produktschap worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.2.a
    text: |-
      de wijze waarop de aanvraag, bedoeld in [artikel 3, eerste lid, onderdeel a, van het besluit][ref1] wordt
      ingediend, alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0008947#Artikel3
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008947
        artikel: '3'
  - number: 3.2.b
    text: |-
      de maatregelen, bedoeld in [artikel 3, eerste lid, onderdeel c, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008947#Artikel3
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008947
        artikel: '3'
  - number: '4.1'
    text: |-
      De erkenning van een controledienst als bedoeld in [artikel 3, eerste lid, onderdeel b, van het besluit][ref1],
      wordt verleend indien: de controledienst beschikt over een voor de controle, bedoeld in artikel 14 van [verordening
      820/97](31997R0820), relevante erkenning overeenkomstig de Europese norm EN/45011, of de controledienst naar
      het oordeel van het Produktschap voldoet aan de in de bij deze regeling behorende bijlage genoemde eisen inzake
      organisatie, personeel, werkwijze en verantwoording van de controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008947#Artikel3
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008947
        artikel: '3'
  - number: '4.2'
    text: |-
      De erkenning vervalt op 1 januari 2000 indien de controledienst op deze datum niet beschikt over een relevante
      erkenning overeenkomstig de Europese norm EN/45011.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel4
  - number: '4.3'
    text: |-
      Indien de controledienst niet meer aan de in het eerste lid genoemde voorwaarden voldoet, trekt het Produktschap de
      erkenning in.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel4
  - number: '4.4'
    text: |-
      De erkenning vervalt op het moment dat de controledienst in staat van faillissement wordt verklaard of surséance
      van betaling wordt verleend.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel4
  - number: '5.1'
    text: |-
      Het Produktschap houdt een register bij waarin de in artikel 5 van [verordening 1141/97](31997R1141) genoemde
      gegevens worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel5
  - number: '5.2'
    text: Een ieder heeft inzage in het in het eerste lid genoemde register.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel5
  - number: '6'
    text: |-
      Het Produktschap verstrekt de Minister van Landbouw, Natuurbeheer en Visserij, al dan niet op verzoek, alle
      mededelingen of inlichtingen, afschriften van uitgestuurde stukken daaronder begrepen, dan wel verleent medewerking
      aan al hetgeen van belang is of zou kunnen zijn voor de uitoefening van het toezicht op de tenuitvoerlegging van
      het besluit.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop het
      [Landbouwkwaliteitsbesluit etikettering rundvlees][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0008947
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008947
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Landbouwkwaliteitsregeling etikettering rundvlees.'
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel8
  - number: '1.1'
    text: |-
      Het beleid en de procedures van de controledienst zijn niet discriminerend. De omvang, het lidmaatschap van een
      bepaalde organisatie of het aantal reeds afgegeven controle-rapprtages zijn voor de controledienst geen redenen om
      verzoeken om controle af te wijzen.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel1
  - number: '1.2'
    text: |-
      De controledienst beschikt over rechtspersoonlijkheid en de in het kader van de onderhavige regeling te verrichten
      controle-activiteiten passen binnen de statutaire doelstelling.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel1
  - number: '1.3'
    text: |-
      De controledienst heeft adequate voorzieningen om de onafhankelijkheid ten opzichte van de bedrijven die worden
      gecontroleerd te garanderen en verleent deze bedrijven tijdens het controlebezoek geen met de controle-activiteit
      conflicterende diensten.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel1
  - number: '1.4'
    text: |-
      De controledienst heeft adequate voorzieningen ter dekking van geldelijke verplichtingen, is financieel gezond en
      vrij van financiële druk die de controle-werkzaamheden kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel1
  - number: '1.5'
    text: |-
      Het personeel van de controledienst, noch de personen die bij de controlewerkzaamheden worden ingeschakeld, zijn
      betrokken bij de productie van of de handel in producten die worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel1
  - number: '1.6'
    text: De controledienst beschikt over een klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel1
  - number: '2.1'
    text: |-
      Het personeel dat belast is met de controles is competent voor de opgedragen taken, waarbij het niveau van
      de theoretische en praktische kennis wordt gewaarborgd door een, afhankelijk van de aard van de controle-
      werkzaamheden, relevante opleiding. De minimum relevante eisen waaraan het personeel moet voldoen zijn door de
      controledienst vastgelegd, mede in verband met de effectiviteit en uniformiteit van de beoordelingen en controles.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel2
  - number: '2.2'
    text: |-
      De controledienst verstrekt het controlepersoneel heldere en actuele instructies met betrekking tot hun
      verplichtingen en verantwoordelijkheden.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel2
  - number: '2.3'
    text: Het controlepersoneel is contractueel gehouden aan de vertrouwelijkheid van de opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel2
  - number: '3.1'
    text: |-
      De controledienst beperkt zijn voorwaarden, beoordelingen en beslissingen tot de zaken die binnen het kader van de
      betreffende controle-activiteit vallen.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: '3.2'
    text: |-
      De controledienst houdt een overzicht bij van de productspecificaties die worden gecontroleerd, de daarin vermelde
      informatie en de naam van de betreffende handelaar of vereniging.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: '3.3'
    text: |-
      De controle wordt uitgevoerd overeenkomstig de eisen die daaraan door [verordening 830/97](31997R0830) en 1141/97
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: '3.4'
    text: |-
      De controledienst documenteert de controleregels zodanig dat inzicht wordt verschaft omtrent de aard en de
      kwaliteit van de controles. De controlecriteria zijn openbaar. In deze documentatie worden, indien van toepassing,
      tenminste de volgende gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.4.a
    text: |-
      procedures voor de beoordeling van de juistheid van de informatie op het etiket, waaronder de bij de controle te
      hanteren checklist;
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.4.b
    text: administratieve procedures en documentcontrole;
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.4.c
    text: de operationele en functionele verplichtingen en verantwoordelijkheden van betrokkenen;
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.4.d
    text: een overzicht van de controles in de onderscheidenlijke schakels en de daarbij gevolgde procedures.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: '3.5'
    text: |-
      De onder punt 4.a. genoemde checklist bevat tenminste de eisen van de productspecificatie (ofwel de claim).
      Deze checklist wordt op het bedrijf dat wordt gecontroleerd ingevuld en voor gezien geparafeerd door een daartoe
      geautoriseerde werknemer van het bedrijf, alsmede voorzien van de naam en de handtekening van de controleur. Op
      deze checklist worden de volgende gegevens vermeld:
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.5.a
    text: onvolkomenheden en tekortkomingen;
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.5.b
    text: de actie die door het bedrijf ondernomen wordt;
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.5.c
    text: het tijdstip waarop de actie uitgevoerd is, alsmede
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: 3.5.d
    text: het moment waarop gecontroleerd is of de actie daadwerkelijk uitgevoerd is.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: '3.6'
    text: |-
      De controledienst die een gedeelte van de controlewerkzaamheden aan andere controlediensten uitbesteedt, toont aan
      dat deze diensten bekwaam zijn om deze diensten te verrichten, houdt een overzicht bij een van de werkzaamheden die
      zijn uitbesteed en bevestigt dat zij verantwoordelijk bliijft voor deze uitbestede werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
  - number: '3.7'
    text: |-
      De controledienst voert interne audits en periodieke beoordelingen uit om de overeenstemming met de criteria van
      deze blijage te verifiëren. Deze beoordelingen worden op verzoek aan het PVV beschikbaar worden gesteld
    url: https://wetten.overheid.nl/BWBR0008931/1997-11-02#Artikel3
