  - number: '2'
    text: |-
      1 De gemeenten komen in aanmerking voor een aanvullende uitkering, onder de in deze regeling genoemde voorwaarden,
      teneinde hen in staat te stellen allochtone vrouwen deel te laten nemen aan een inburgeringsvoorziening en deze
      inburgeringsvoorziening te laten afsluiten met het inburgeringsexamen.

      2 Het college van burgemeester en wethouders dient binnen vier weken na inwerkingtreding van deze regeling bij
      Onze Minister een aanvraag in voor de aanvullende uitkering. De aanvraag gaat vergezeld van een wijziging van het
      ontwikkelingsprogramma.

      3 Het gewijzigde ontwikkelingsprogramma bevat een gemotiveerde keuze van de resultaten die het college van
      burgemeester en wethouders wil bereiken ten aanzien van:

      a. het aantal allochtone vrouwen, behorend tot de categorie ‘uitkeringsgerechtigd’, en het aantal allochtone
      vrouwen, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’, met wie in 2006 een overeenkomst
      als bedoeld in [artikel 8][ref1] wordt gesloten;

      b. het aantal allochtone vrouwen, behorend tot de categorie ‘uitkeringsgerechtigd’, en het aantal allochtone
      vrouwen, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’, dat uiterlijk 31 december 2009 zal
      hebben deelgenomen aan het inburgeringsexamen.

      4 Het procentuele aandeel van elke gemeente behorend tot de G30 in de middelen voor bevordering van de inburgering
      van allochtone vrouwen is opgenomen in de bijlage bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020127#Artikel8
