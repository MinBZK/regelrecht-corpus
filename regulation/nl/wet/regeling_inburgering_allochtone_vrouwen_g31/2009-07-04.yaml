  - number: '6'
    text: |-
      1 Het college van burgemeester en wethouders stelt de inburgeringsvoorziening vast, waarbij zoveel mogelijk wordt
      aangesloten bij de persoonlijke situatie van de desbetreffende allochtone vrouw.

      2 Het college van burgemeester en wethouders draagt er zorg voor dat de inburgeringsvoorziening toeleidt naar
      het inburgeringsexamen en op uiterlijk 31 december 2009 wordt afgesloten door middel van deelname aan het
      inburgeringsexamen.
    url: https://wetten.overheid.nl/BWBR0020127/2009-07-04#Artikel6
  - number: '7'
    text: |-
      1 Het inburgeringsexamen toetst de beheersing van:

      a. de Nederlandse taal op het niveau A2 van het Europees Raamwerk voor Moderne Vreemde Talen voor
      spreekvaardigheid, luistervaardigheid en gespreksvaardigheid;

      b. de Nederlandse taal op het niveau A1 van het Europees Raamwerk voor Moderne Vreemde Talen voor
      schrijfvaardigheid en leesvaardigheid; en

      c. Kennis van de Nederlandse Samenleving op de domeinen ‘Werk en inkomen’, ‘Omgangsvormen, waarden en normen’,
      ‘Wonen’, ‘Gezondheid en gezondheidszorg’, ‘Geschiedenis en geografie’, ‘Instanties’, ‘Staatsinrichting en
      rechtsstaat’ en ‘Onderwijs en opvoeding’.

      2 Het inburgeringsexamen bestaat uit een centraal deel en uit een praktijkdeel.

      3 Het centrale deel van het inburgeringsexamen wordt afgenomen door de IB-Groep en bestaat uit:

      a. een elektronisch praktijkexamen;

      b. een toets gesproken Nederlands, en

      c. een examen in de kennis van de Nederlandse samenleving.

      4 Het praktijkdeel van het inburgeringsexamen wordt afgenomen door de IB-Groep en de door de IB-Groep aangewezen
      exameninstellingen en bestaat uit een assessment, een portfolio dan wel een combinatie daarvan. Het praktijkdeel
      omvat een beoordeling van de taalvaardigheden in een aantal praktijksituaties, ontleend aan het domein
      ‘Burgerschap’ en het domein ‘Werk’ dan wel het domein ‘Onderwijs, gezondheid en opvoeding’.

      5 Het resultaat van beide delen van het inburgeringsexamen wordt vastgesteld door de IB-Groep en de door de IB-
      Groep aangewezen exameninstellingen en wordt uitgedrukt in ‘geslaagd’ of ‘niet geslaagd’. Het inburgeringsexamen is
      behaald indien alle daartoe behorende examens met goed gevolg zijn afgelegd.

      6 Ten bewijze dat het inburgeringsexamen is behaald, wordt door de IB-Groep aan de allochtone vrouw een diploma
      uitgereikt, waarvan het model door de Minister voor Vreemdelingenzaken en Integratie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020127/2009-07-04#Artikel7
  - number: '8'
    text: |-
      1 Het college van burgemeester en wethouders sluit een overeenkomst met de allochtone vrouw die een
      inburgeringsvoorziening krijgt. De overeenkomst wordt door partijen niet later ondertekend dan 31 december 2006.

      2 De overeenkomst bevat ten minste bepalingen met betrekking tot:

      a. het doel van de inburgeringsvoorziening;

      b. de onderdelen van de inburgeringsvoorziening;

      c. de rechten en de verplichtingen van de partijen bij de overeenkomst;

      d. de gevolgen welke zijn verbonden aan niet-nakoming van de overeenkomst.

      3 Het college van burgemeester en wethouders sluit op grond van deze regeling met een allochtone vrouw slechts
      één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020127/2009-07-04#Artikel8
