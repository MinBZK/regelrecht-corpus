preamble:
  text: |-
    Handelende in overeenstemming met de Minister voor Vreemdelingenzaken en Integratie;

    Gelet op artikel 16, eerste en tweede lid, van het Besluit brede doeluitkering sociaal, integratie en veiligheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020127/2009-07-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties;

      b. Besluit: het [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1];

      c. Brede doeluitkering: brede doeluitkering sociaal, integratie en veiligheid;

      d. G30: de gemeenten Alkmaar, Almelo, Amersfoort, Amsterdam, Arnhem, Breda, Den Haag, Deventer, Dordrecht,
      Eindhoven, Emmen, Enschede, Groningen, Haarlem, Heerlen, Helmond, Hengelo (Overijssel), ’s-Hertogenbosch,
      Leeuwarden, Leiden, Lelystad, Maastricht, Nijmegen, Rotterdam, Schiedam, Tilburg, Utrecht, Venlo, Zaanstad en
      Zwolle;

      e. allochtone vrouw: de vrouw die

      1°. behoort tot de eerste generatie niet-westerse allochtonen, dan wel de eerste generatie allochtonen afkomstig
      uit de voormalige Sovjet-Unie of voormalig Joegoslavië;

      2°. geen nieuwkomer is als bedoeld in de [Wet inburgering nieuwkomers][ref2];

      3°. geen inburgeringsprogramma voor oudkomers volgt op grond van het
      [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref3], de
      [Regeling inburgering oudkomers 25 gemeenten 2005][ref4], de [Regeling inburgering oudkomers G25 2006][ref5] of de
      [Regeling inburgering oudkomers niet-G56 2006][ref6];

      4°. al voor langere tijd rechtmatig in Nederland verblijft, anders dan voor een tijdelijk doel als bepaald bij of
      krachtens de [Wet inburgering nieuwkomers][ref7], en

      5°. algemene bijstand of een uitkering ontvangt op grond van de
      [Werkloosheidswet][ref8], de [Wet op de arbeidsongeschiktheidsverzekering][ref9], de
      [Wet inkomensvoorziening oudere en gedeeltelijke arbeidsongeschikte werkloze werknemers][ref10], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref11],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref12], de
      [Wet arbeidsongeschiktheidsverzekering jonggehandicapten][ref13],
      de [Wet werk en inkomen naar arbeidsvermogen][ref14], de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref15] of de
      [Tijdelijke regeling inkomensgevolgen herbeoordeelde arbeidsongeschikten][ref16], en aan wie in het kader van de
      uitvoering van voornoemde wetten of regelingen een voorziening is aangeboden gericht op arbeidsinschakeling, dan
      wel

      6°. geen inkomsten uit tegenwoordige arbeid, algemene bijstand of een uitkering als bedoeld onder 5° geniet;

      f. categorie ‘uitkeringsgerechtigd’: de categorie, genoemd in onderdeel e, onder 5°;

      g. categorie ‘niet-werkend en niet-uitkeringsgerechtigd’: de categorie, genoemd in onderdeel e, onder 6°;

      h. aanvullende uitkering: een verhoging van de brede doeluitkering ;

      i. inburgeringsvoorziening: de inburgeringsvoorziening, bedoeld in [artikel 6][ref17];

      j. inburgeringsexamen: het inburgeringsexamen, bedoeld in [artikel 7][ref18];

      k. IB-Groep: de Informatie Beheer Groep, genoemd in de [Wet verzelfstandiging Informatiseringsbank][ref19].


