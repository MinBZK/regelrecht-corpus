  - number: '3'
    text: |-
      Onze Minister neemt een beschikking tot verlening van de aanvullende uitkering binnen zes weken na het tijdstip
      waarop de in [artikel 2][ref1] bedoelde aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020127#Artikel2
    url: https://wetten.overheid.nl/BWBR0020127/2009-07-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020127
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      De normvergoedingen welke ten aanzien van de resultaten, genoemd in [artikel 2, derde lid][ref1], worden
      gehanteerd, zijn:

      a. € 1854,– voor iedere allochtone vrouw, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’,
      respectievelijk € 1271,– voor iedere allochtone vrouw, behorend tot de categorie ‘uitkeringsgerechtigd’, met wie in
      2006 een overeenkomst is gesloten;

      b. € 4807,– voor iedere allochtone vrouw, behorend tot de categorie ‘niet-werkend en niet-uitkeringsgerechtigd’,
      respectievelijk € 3294,– voor iedere allochtone vrouw, behorend tot de categorie ‘uitkeringsgerechtigd’, die
      uiterlijk 31 december 2009 heeft deelgenomen aan het inburgeringsexamen.


