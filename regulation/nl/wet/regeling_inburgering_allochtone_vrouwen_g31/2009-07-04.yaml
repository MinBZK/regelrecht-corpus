      [artikel 3][ref1] is verleend.

      2 Het voorschot wordt na het besluit tot verlening van de aanvullende uitkering betaald bij de eerstvolgende
      voorschotverlening zoals die plaatsvindt op grond van [artikel 20 van het Besluit][ref2].


