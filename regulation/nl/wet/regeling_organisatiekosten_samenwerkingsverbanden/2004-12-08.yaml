$id: regeling_organisatiekosten_samenwerkingsverbanden
regulatory_layer: WET
publication_date: '2004-12-10'
valid_from: '2004-12-08'
bwb_id: BWBR0011017
url: https://wetten.overheid.nl/BWBR0011017/2004-12-08
preamble:
  text: |-
    Gelet op artikel 2 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             LASER:

              Dienst Landelijke service bij regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel1
  - number: '2'
    text: |-
      1 De minister kan subsidie verstrekken aan samenwerkingsverbanden ter bevordering van kennis, inzicht en kundigheid
      van hun leden en aangeslotenen betreffende natuurbeheer en daarmee samenhangende onderwerpen, alsmede ter
      bevordering van coördinatie van activiteiten terzake.

      2 De minister stelt jaarlijks een subsidieplafond vast voor subsidies als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel2
  - number: '3'
    text: |-
      Subsidie als bedoeld in [artikel 2][ref1] wordt uitsluitend verstrekt aan samenwerkingsverbanden als bedoeld in
      de artikelen 4 en 5 van de Subsidieregeling agrarisch natuurbeheer aan welke subsidie is verleend op grond van
      die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011017#Artikel2
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011017
        artikel: '2'
  - number: '4'
    text: |-
      1 Subsidie als bedoeld in [artikel 3][ref1] dient tegelijkertijd te worden aangevraagd met een subsidie als bedoeld
      artikel 2 van de Subsidieregeling agrarisch natuurbeheer.

      2 Aanvragen tot subsidieverlening uit hoofde van deze regeling worden ingediend bij de directeur van LASER met
      gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van LASER.

      3 Aanvragen worden onderscheiden naar provincies waarin het desbetreffende terrein of het grootste deel daarvan
      is gelegen.

      4 De minister verdeelt de beschikbare bedragen naar de datum van ontvangst van de subsidieaanvragen. Bij
      gelijktijdige datum van ontvangst van de subsidieaanvragen wordt de volgorde van behandeling bepaald door loting.
      Als datum van ontvangst van de aanvraag wordt aangemerkt de datum waarop de aanvraag volledig is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011017#Artikel3
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011017
        artikel: '3'
  - number: '5'
    text: Subsidie wordt verstrekt voor een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel5
  - number: '6'
    text: |-
      1 De subsidie bedraagt 100% van de kosten met een maximumbedrag van:

      € 15,88 per hectare voor het eerste jaar;

      € 11,34 per hectare voor het tweede jaar;

      € 9,08 per hectare voor het derde jaar;

      € 6,81 per hectare voor het vierde jaar.

      2. Aanvragers, die voor 1 januari 2001 een aanvraag hebben ingediend, ontvangen voor het eerste en tweede jaar een
      bijdrage van € 15, 88 per hectare.

      2 Onder kosten als bedoeld in het eerste lid worden verstaan, kosten voor:

      a. voorlichting;

      b. opleiding en begeleiding;

      c. onderzoek, en

      d. contractbesprekingen ten behoeve van een subsidieaanvraag voor de Subsidieregeling agrarisch natuurbeheer.

      3 Het aantal hectares waarvoor subsidie wordt verleend is gelijk aan of minder dan het aantal hectares waarvoor
      subsidie wordt verleend op grond van de Subsidieregeling agrarisch natuurbeheer.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel6
  - number: '7'
    text: |-
      De beschikking tot subsidieverlening vermeldt in ieder geval:

      a. het aantal hectares waarop de subsidieverlening betrekking heeft en het subsidiebedrag, en

      b. de datum met ingang waarvan het jaar waarover subsidie wordt verleend, aanvangt.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel7
  - number: 7a
    text: |-
      Binnen 8 weken na de beschikking tot subsidieverlening wordt een voorschot van 80% van de bijdrage voor het eerste
      jaar verleend.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel7a
  - number: '8'
    text: |-
      1 Binnen 8 weken na afloop van een tijdvak dient de subsidieontvanger voor het desbetreffende terrein een aanvraag
      tot subsidievaststelling over dat tijdvak in bij de directeur van LASER met gebruikmaking van een daartoe bestemd
      aanvraagformulier dat verkrijgbaar is bij de directeur van LASER.

      2 De subsidieontvanger geeft in de aanvraag in ieder geval aan:

      a. welke kosten, voorzover relevant, hij heeft gemaakt, en

      b. ten behoeve waarvan hij kosten heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel8
  - number: '9'
    text: |-
      1 Subsidies of voorschotten daarop worden verleend onder voorbehoud van goedkeuring van de Commissie van de
      Europese Gemeenschappen.

      2 De beslissing tot verlening van een subsidie of een voorschot daarop kan worden ingetrokken of gewijzigd ter
      verkrijging van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling, of wegens het
      uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling organisatiekosten samenwerkingsverbanden.'
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0011017/2004-12-08#Artikel11
