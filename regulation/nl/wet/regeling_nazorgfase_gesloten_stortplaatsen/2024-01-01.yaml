articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Ontwerpprocedure grondwatermonitoring:* Ontwerp-procedure grondwatermonitoring stortplaatsen (Vereniging van
      Afvalverwerkers, Utrecht, november 1995);
        - *Richtlijn dichte eindafwerking:* Richtlijn voor dichte eindafwerking op afval- en reststofbergingen
      (Publikatiereeks bodembescherming nr. 1991/2);
        - *Richtlijn geohydrologische isolatie:* Richtlijn geohydrologische isolatie van bestaande stortplaatsen
      (Vereniging van Afvalverwerkers, Utrecht, juli 1997).
    url: https://wetten.overheid.nl/BWBR0005877/2024-01-01#Artikel1
  - number: '2'
    text: |-
      Deze regeling berust op de [artikelen 8.49, vijfde lid][ref1], en [21.6, vierde lid, van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.49
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel21.6
    url: https://wetten.overheid.nl/BWBR0005877/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8.49'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '21.6'
  - number: '15'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      gesloten stortplaats: stortplaats die ingevolge artikel 8.47, derde lid, van de wet voor gesloten is verklaard;

      gedeputeerde staten: gedeputeerde staten van de provincie waarin de gesloten stortplaats geheel of gedeeltelijk
      is gelegen.

      2 De Richtlijn dichte eindafwerking, de Richtlijn geohydrologische isolatie en de Ontwerpprocedure
      grondwatermonitoring zijn van overeenkomstige toepassing op gesloten stortplaatsen.
    url: https://wetten.overheid.nl/BWBR0005877/2024-01-01#Artikel15
  - number: '16'
    text: |-
      Gedeputeerde staten zenden jaarlijks voor 1 maart aan Onze Minister de op grond van de
      [artikelen 17 tot en met 21][ref1] verkregen gegevens ten aanzien van de gesloten stortplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel17
    url: https://wetten.overheid.nl/BWBR0005877/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005877
        artikel: '17'
        hoofdstuk: '6'
  - number: '17'
    text: |-
      1 De hoeveelheid en de samenstelling van het percolaat wordt in de nazorgfase halfjaarlijks gecontroleerd.

      2 In afwijking van het eerste lid kunnen gedeputeerde staten de metingen van de hoeveelheid en samenstelling van
      het percolaat minder frequent uitvoeren indien de evaluatie van de gegevens aangeeft dat langere tussenpozen even
      effectief zijn.

      3 De [artikelen 9.18, eerste lid, onder a, en vierde lid][ref1], [9.20][ref2] en
      [9.25, tweede, derde en vierde lid, onder a, van de Omgevingsregeling][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel9.18
      [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel9.20
      [ref3]: https://wetten.overheid.nl/BWBR0045528#Artikel9.25
    url: https://wetten.overheid.nl/BWBR0005877/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045528
        artikel: '9.18'
      - id: ref2
        bwb_id: BWBR0045528
        artikel: '9.20'
      - id: ref3
        bwb_id: BWBR0045528
        artikel: '9.25'
  - number: '18'
    text: |-
      1 De hoeveelheid en samenstelling van het in de omgeving aanwezige oppervlaktewater wordt in de nazorgfase
      halfjaarlijks vastgesteld; bemonstering geschiedt op ten minste twee door het bevoegd gezag aan te geven punten,
      één stroomopwaarts en één stroomafwaarts van de stortplaats.

      2 In afwijking van het eerste lid kunnen gedeputeerde staten de metingen van de hoeveelheid en de samenstelling van
      het oppervlaktewater minder frequent uitvoeren, indien:

      a. dit op grond van de kenmerken van de stortplaats niet vereist is, dan wel

      b. de evaluatie van de gegevens aangeeft dat langere tussenpozen even effectief zijn.
    url: https://wetten.overheid.nl/BWBR0005877/2024-01-01#Artikel18
  - number: '19'
    text: |-
      1 De samenstelling en atmosferische druk van de gasuitstoot wordt halfjaarlijks gemeten.

      2 De gascontrole is representatief voor elk gedeelte van de stortplaats.

      3 De metingen hebben betrekking op gassen die vrijkomen bij de biologische afbraak van het organisch materiaal in
      de afvalstoffen, met name CH, CO en O.

      4 De doelmatigheid van het gasopvangsysteem wordt regelmatig gecontroleerd.

      5 In afwijking van het eerste lid, kunnen gedeputeerde staten bepalen dat metingen van de samenstelling en
      atmosferische druk minder frequent mogen worden uitgevoerd als de evaluatie van de gegevens aangeeft dat langere
      tussenpozen even effectief zijn.
    url: https://wetten.overheid.nl/BWBR0005877/2024-01-01#Artikel19
  - number: '20'
    text: |-
      1 De gemiddeld hoogste en gemiddeld laagste grondwaterstand worden halfjaarlijks vastgesteld.

      2 In afwijking van het eerste lid wordt in geval van veranderende grondwaterniveaus de frequentie verhoogd.

      3 De [artikelen 9.9][ref1], [9.10][ref2], [9.13, eerste en derde lid][ref3],
      [9.14, eerste en tweede lid, aanhef en onder a en c, en derde lid][ref4],
      [9.18, tweede tot en met vierde lid][ref5], [9.19][ref6] en
      [9.25, tweede, derde en vierde lid, onder a, van de Omgevingsregeling][ref7], zijn van overeenkomstige toepassing.


