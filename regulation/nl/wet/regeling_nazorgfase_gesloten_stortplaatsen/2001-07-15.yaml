        bwb_id: BWBR0005858
  - number: '2'
    text: |-
      Indien het bevoegd gezag een vergunning verleent voor een stortplaats, is het verplicht in het belang van de
      bescherming van de bodem aan de vergunning in ieder geval de voorschriften te verbinden, waarvan de inhoud is
      aangegeven in de [artikelen 3][ref1] tot en met [14b][ref2], voor zover in die artikelen niet anders is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005877#Artikel14b
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005877
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005877
        artikel: 14b
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '3'
    text: |-
      1 Ten minste twee maal per maand, en wel op of rondom de 14e en de 28e van de maand wordt in de
      grondwaterbemonsteringsbuizen, bedoeld in [artikel 8, eerste lid][ref1], van het Stortbesluit, de grondwaterstand
      van de bodem ter plaatse waar is of wordt gestort, gemeten overeenkomstig NEN 5120: 1991 NL en NEN 5120/A1: 1997
      NL.

      2 De gemiddeld hoogste en gemiddeld laagste grondwaterstand worden vastgesteld door een ter zake kundige. Teneinde
      vast te stellen of de gegevens die uit de metingen zijn verkregen representatief zijn voor de bodem ter plaatse
      waar is of wordt gestort worden de resultaten van de metingen, bedoeld in het eerste lid, vergeleken met alle
      beschikbare gegevens van de grondwaterstanden verkregen uit peilbuizen in hetzelfde geohydrologische systeem,
      die zijn opgenomen in het Archief van grondwaterstanden van TNO, voor zover laatstbedoelde gegevens betrekking
      hebben op dezelfde periode en op de daaraan voorafgaande aaneengesloten periode van minimaal vijf jaren. Bij
      de vaststelling van de gemiddeld hoogste en gemiddeld laagste grondwaterstand wordt tevens gebruik gemaakt van
      profielbeschrijvingen van de bodem ter plaatse van de aanleg van de stortplaats.

      3 Ter plaatse waar is of wordt gestort, wordt door een ter zake kundige een onderzoek uitgevoerd naar de
      geohydrologische situatie en de invloed van de stortplaats daarop. Met de gegevens uit dit onderzoek wordt rekening
      gehouden bij de bepaling van de te verwachten gemiddeld hoogste en gemiddeld laagste grondwaterstand onder invloed
      van de stortplaats.

      4 Ter plaatse waar is of wordt gestort, wordt door een ter zake kundige een onderzoek uitgevoerd naar de
      zettingsgevoeligheid van de bodem. De resultaten van dit onderzoek worden betrokken bij de bepaling van de ligging
      van de stortzool ten opzichte van de te verwachten gemiddeld hoogste grondwaterstand.

      5 Indien de verwachting bestaat dat de werkelijke gemiddeld hoogste of gemiddeld laagste grondwaterstand onder
      invloed van een kunstmatige grondwaterstandverandering significant zal afwijken van de ingevolge het eerste en
      tweede lid vastgestelde grondwaterstand, kan een andere gemiddeld hoogste en gemiddeld laagste grondwaterstand
      worden vastgesteld.

      6 De resultaten van het in het derde lid bedoelde onderzoek en de in het eerste lid bedoelde metingen worden,
      voordat de stortplaats wordt ingericht en vervolgens telkens na verloop van één jaar naar het bevoegd gezag
      gezonden. Bij stortplaatsen die reeds zijn ingericht voor de inwerkingtreding van het Stortbesluit, worden
      de resultaten voor de eerste maal binnen één jaar na die inwerkingtreding naar het bevoegd gezag gezonden en
      vervolgens telkens na verloop van één jaar.


