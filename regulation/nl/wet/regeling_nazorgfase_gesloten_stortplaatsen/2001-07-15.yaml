        bwb_id: BWBR0005877
        artikel: '17'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005877
        artikel: '21'
        hoofdstuk: '6'
  - number: '17'
    text: |-
      1 De hoeveelheid en de samenstelling van het percolaat wordt in de nazorgfase halfjaarlijks gecontroleerd.

      2 In afwijking van het eerste lid kunnen gedeputeerde staten de metingen van de hoeveelheid en samenstelling van
      het percolaat minder frequent uitvoeren indien de evaluatie van de gegevens aangeeft dat langere tussenpozen even
      effectief zijn.

      3 De [artikelen 10, derde, vijfde en achtste lid][ref1] en [11, tweede tot en met vierde lid][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005877#Artikel11
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel17
