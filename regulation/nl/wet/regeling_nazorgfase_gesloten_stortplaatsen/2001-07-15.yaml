  - number: '4'
    text: |-
      1 Bij het verbinden van voorschriften aan de vergunning die betrekking hebben op de onderafdichting, wordt een
      beschermingsniveau geboden dat ten minste gelijkwaardig is aan de bescherming van de bodem die is beoogd met het
      gestelde in de Richtlijn onderafdichtingen.

      2 Indien de afstand tussen de onderkant van het afval en de te verwachten gemiddeld hoogste grondwaterstand 0,5
      meter bedraagt, dient boven de afdichting en direct onder het afval, een tussenlaag van grind met een dikte van
      minstens 0,2 meter aanwezig te zijn als capillair onderbrekende laag. Tussen de grindlaag en het afval dient een
      steunmat te zijn aangebracht.

      3 De toepassing van stoffen die de bodem kunnen verontreinigen in mineraal afdichtingsmateriaal dat voor de
      onderafdichting wordt gebruikt, is niet toegestaan.

      4 Bij het verbinden van voorschriften aan de vergunning die betrekking hebben op de onderafdichting worden, indien
      vanwege de stortplaatsspecifieke geohydrologische situatie, geen sprake is van een voldoende geohydrologische
      barrière, civieltechnische of geohydrologische maatregelen getroffen die ten minste voldoen aan de Richtlijn
      geohydrologische isolatie en de Ontwerpprocedure grondwatermonitoring.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel4
  - number: '5'
    text: |-
      1 Bij het verbinden van voorschriften aan de vergunning die betrekking hebben op de bovenafdichting, wordt een
      beschermingsniveau geboden dat ten minste gelijkwaardig is aan de bescherming van de bodem die is beoogd met het
      gestelde in de Richtlijn dichte eindafwerking.

      2 Indien bij de bovenafdichting gebruik wordt gemaakt van milieuverontreinigende stoffen, wordt er voor gezorgd dat
      door de afdichtingsconstructie geen verontreiniging van bodem en oppervlaktewater kan optreden.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel5
  - number: 5a
    text: |-
      1 De metingen van de samenstelling en atmosferische druk van de gasuitstoot, bedoeld in artikel 6a van het
      Stortbesluit:

      a. zijn representatief voor elk gedeelte van de stortplaats;

      b. hebben betrekking op gassen die vrijkomen bij de biologische afbraak van het organisch materiaal in de
      afvalstoffen, met name CH, CO en O.

      2 Het bevoegd gezag kan bepalen dat metingen van de samenstelling en de atmosferische druk minder frequent mogen
      worden uitgevoerd als de evaluatie van de gegevens aangeeft dat langere tussenpozen even effectief zijn.

      3 In plaats van de maandelijkse metingen van de atmosferische druk kan worden volstaan met metingen van één maal
      per jaar voorzover het vrijkomende gas wordt benut of afgefakkeld.

      4 In plaats van de maandelijkse metingen van de samenstelling van de gasuitstoot kan worden volstaan met:

      a. metingen die nodig zijn voor de goede werking van de benuttingsinstallatie voorzover het vrijkomende gas wordt
      benut en de gassen CH, CO en O omvat;

      b. metingen van één maal per jaar voorzover het vrijkomende gas wordt afgefakkeld.

      5 De metingen van de samenstelling van de gasuitstoot in de gevallen bedoeld in het vierde lid, onder a en b,
      worden verricht in de verzamelleiding van het stortgasonttrekkingssysteem.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel5a
  - number: '6'
    text: |-
      1 Indien redelijkerwijs te verwachten is dat stortgas uit de stortplaats vrijkomt, vindt controle plaats op
      de dichtheid van de bovenafdichting door middel van een onderzoek naar het uittreden van stortgas door de
      bovenafdichting. Dit onderzoek vindt elke zes maanden plaats, overeenkomstig de methode aangegeven in hoofdstuk 13
      van de Richtlijn dichte eindafwerking.

      2 Controle op de dichtheid van de bovenafdichting door het inspecteren van de taluds op uittredend percolatiewater
      vindt elke zes maanden plaats door middel van de in het derde lid vermelde methode.

      3 Teneinde te onderzoeken of er sprake is van lekkage van percolatiewater ter plaatse van de teenconstructie,
      zijnde de verbindingsconstructie tussen de onder- en de bovenafdichting en het nabij gelegen deel van het talud,
      wordt de electrische geleidbaarheid van het water uit het drainagesysteem boven de bovenafdichting gemeten. Dit
      geschiedt overeenkomstig de methode, aangegeven in hoofdstuk 13 van de Richtlijn dichte eindafwerking.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel6
  - number: '7'
    text: |-
      Controle van de bovenafdichting op zakking vindt jaarlijks plaats, door hoogtemeting van het
      eindafwerkingsoppervlak overeenkomstig de methode, aangegeven in hoofdstuk 1.3 van de Richtlijn dichte
      eindafwerking.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel7
  - number: '8'
    text: |-
      1 Controle van de drainagesystemen van de onder- en bovenafdichting en het controledrainagesysteem onder de
      onderafdichting in het grondwater, vindt elke zes maanden plaats.

      2 Na het aanbrengen van drainagebuizen wordt direct vastgesteld of deze open zijn. Teneinde de goede werking van
      het drainagesysteem en het controledrainagesysteem te waarborgen, worden de buizen regelmatig en ten minste één
      keer per jaar doorgespoten, waarbij de doorspuitfrequentie proefondervindelijk door de vergunninghouder wordt
      bepaald.

      3 Het controleren van het functioneren van het drainagesysteem voor percolatiewater van de onderafdichting en van
      het controledrainagesysteem in het grondwater ten aanzien van de vloeistofstroming in drains en leidingen vindt
      plaats in de daartoe aangebrachte schachten c.q. inspectieputten of verzamelleidingen, overeenkomstig de methode
      aangegeven in de Richtlijn drainage- en controlesystemen.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel8
  - number: '9'
    text: |-
      1 De in [artikel 10][ref1] van het Stortbesluit bedoelde keuringen van de bodembeschermende voorzieningen en
      onderzoeken naar de technische staat geschieden overeenkomstig:

      a. hoofdstuk 15 van de Richtlijn dichte eindafwerking voor de bovenafdichting;

      b. de Richtlijn drainage- en controlesystemen met uitzondering van de paragrafen3.11 en 4.3.2 voor het opvang- en
      afvoersysteem van percolaat, voor de controle van de drainagevoorzieningen en voor de bemonsteringsdrainagebuizen;

      c. de Ontwerpprocedure grondwatermonitoring voor de bemonsteringspeilbuizen met uitzondering van bijlage V;

      d. de Richtlijn geohydrologische isolatie voor zover geohydrologische isolatie is vereist.

      2 Het percolaat wordt geanalyseerd op de door het bevoegd gezag voorgeschreven stoffen in verband met eventuele
      aantasting van de afdichting, de processen in de stortplaats en afvoer van het percolaat.

      3 De technische staat van de voorzieningen wordt in een rapport aangegeven, waarbij tevens een schatting van de
      resterende levensduur van de voorzieningen is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel10
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005877
        artikel: '10'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '10'
    text: |-
      1 Het in [artikel 9][ref1] van het Stortbesluit bedoelde onderzoek bestaat uit een bemonstering van het
      percolaat, van het water in de verschillende bemonsteringsbuizen en verzamelleidingen of inspectieputten
      van het drainagesysteem onder de onderafdichting van de stortplaats en van het grondwater in de
      grondwaterbemonsteringsbuizen die zijn voorgeschreven op grond van [artikel 8][ref2] van het Stortbesluit.

      2 De bemonsteringsfrequentie wordt bepaald door de stroomsnelheid van het grondwater onder de stortplaats: een maal
      per jaar voor een stroomsnelheid tussen 0 en 5 m/jaar, twee maal bij 5 tot 30 m/jaar en drie maal bij meer dan 30
      m/jaar. De stroomsnelheid van het grondwater wordt door een ter zake kundige vastgesteld.

      3 De verkregen monsters worden geanalyseerd op:

        - zuurgraad (pH);
        - elektrische geleidbaarheid;
        - chemisch zuurstofverbruik (CZV);
        - minerale olie;
        - vluchtige organische gehalogeneerde koolwaterstoffen (VOX), met inachtneming van het gestelde in het vierde lid;
        - chloride;
        - Kjeldahl-N of ammoniak (NH).

      4 Eénmaal per jaar wordt een gaschromatografisch-massaspectrometrisch onderzoek op organische verbindingen
      uitgevoerd. Op dat moment hoeft geen analyse op VOX plaats te vinden.

      5 Het bevoegd gezag kan afhankelijk van de samenstelling van het gestorte afval naast de in het derde lid genoemde
      parameters ook nog andere parameters aanwijzen.

      6 De hoeveelheid percolaat wordt maandelijks vastgesteld.

      7 In afwijking van het zesde lid kan het bevoegd gezag bepalen dat de controlefrequentie van de hoeveelheid van het
      percolaat wordt aangepast als:

      a. de structuur, de opbouw en de samenstelling van het gestorte afval hiertoe aanleiding geeft, of

      b. de evaluatie van de gegevens aangeeft dat langere tussenpozen even effectief zijn.

      8 De monsters van het percolaat worden op representatieve plaatsen genomen en zijn representatief voor de
      gemiddelde samenstelling van het percolaat. Het bemonsteren en meten van de hoeveelheid en samenstelling van het
      percolaat vindt plaats afzonderlijk op elk punt waar percolaat uit de stortplaats vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel9
