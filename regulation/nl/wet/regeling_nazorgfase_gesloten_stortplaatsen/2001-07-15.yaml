        artikel: '9'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '15'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      gesloten stortplaats: stortplaats die ingevolge artikel 8.47, derde lid, van de wet voor gesloten is verklaard;

      gedeputeerde staten: gedeputeerde staten van de provincie waarin de gesloten stortplaats geheel of gedeeltelijk
      is gelegen.

      2 De Richtlijn dichte eindafwerking, de Richtlijn geohydrologische isolatie en de Ontwerpprocedure
      grondwatermonitoring zijn van overeenkomstige toepassing op gesloten stortplaatsen.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel15
  - number: '16'
    text: |-
      Gedeputeerde staten zenden jaarlijks voor 1 maart aan de Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer de op grond van de [artikelen 17][ref1] tot en met [21][ref2] verkregen gegevens ten aanzien van de
      gesloten stortplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005877#Artikel21
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel16
    references:
