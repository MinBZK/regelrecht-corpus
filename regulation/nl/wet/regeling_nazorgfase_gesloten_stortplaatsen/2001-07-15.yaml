  - number: 14b
    text: |-
      Het in [artikel 9][ref1] van het Stortbesluit bedoelde urgentieplan op hoofdlijnen bevat ten minste:

      a. de te treffen maatregelen om verdere verspreiding van de verontreinigende stoffen te voorkomen;

      b. de te treffen maatregelen om de veroorzaakte bodemverontreiniging ongedaan te maken;

      c. voorzover geohydrologische maatregelen dienen te worden getroffen zijn deze maatregelen in overeenstemming met
      de Richtlijn geohydrologische isolatie;

      d. de termijnen die in acht genomen dienen te worden bij het uitvoeren van de maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel9
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel14b
