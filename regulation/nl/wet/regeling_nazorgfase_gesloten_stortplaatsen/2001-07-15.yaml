  - number: 10a
    text: |-
      Voor de controle van de samenstelling van het oppervlaktewater wordt een monster genomen dat representatief is voor
      de gemiddelde samenstelling van het oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel10a
  - number: '11'
    text: |-
      1 Het in artikel 10 van het Stortbesluit bedoelde onderzoek bestaat uit een bemonstering van het percolaat, van het
      water in de verschillende bemonsteringsbuizen en verzamelleidingen van het drainagesysteem onder de onderafdichting
      van de stortplaats, en van het grondwater in de grondwaterbemonsteringsbuizen die zijn voorgeschreven op grond van
      artikel 8 van het Stortbesluit.

      2 De verkregen monsters worden geanalyseerd op:

        - cadmium, chroom, koper, nikkel, lood, zink, kwik en arseen;
        - chloride, sulfaat, zuurgraad (pH), elektrische geleidbaarheid;
        - VOX;
        - minerale olie;
        - polycyclische aromatische koolwaterstoffen (PAK's).

      3 Analyse van de verkregen monsters op aromaten wordt uitgevoerd, indien het in artikel 10, vierde lid, bedoelde
      onderzoek de aanwezigheid daarvan signaleert.

      4 Het bevoegd gezag kan naast de in het tweede en derde lid genoemde parameters ook nog andere parameters aanwijzen
      die moeten worden geanalyseerd.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel11
  - number: '12'
    text: |-
      In afwijking van de [artikelen 10][ref1] en [11][ref2] kan het bevoegd gezag bepalen, dat analyse van een of meer
      van de in [artikel 10][ref3] of 11 genoemde elementen en verbindingen achterwege kan blijven, indien op grond van
      de samenstelling van de te storten stoffen buiten twijfel staat dat deze stoffen niet voorkomen in het percolaat
      van de stortplaats. Indien analyse van een of meer in deze artikelen niet genoemde elementen gewenst is, schrijft
      het bevoegd gezag bedoelde analyses voor.


