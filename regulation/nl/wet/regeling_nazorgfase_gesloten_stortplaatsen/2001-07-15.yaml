preamble:
  text: |-
    Gelet op de artikelen 1, vierde lid, 4, vijfde lid, 9, tweede lid en 10, tweede lid, van het Stortbesluit
    bodembescherming,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *Stortbesluit:*


              [Stortbesluit bodembescherming][ref1];




              *Richtlijn drainage- en controlesystemen:*


              Richtlijn drainagesystemen en controlesystemen grondwater voor stort- en opslagplaatsen (Heidemij
      Adviesbureau 1993);




              *Richtlijn onderafdichtingen:*


              Richtlijn onderafdichtingen voor stort- en opslagplaatsen (Heidemij Adviesbureau 1993);




              *Richtlijn dichte eindafwerking:*


              Richtlijn voor dichte eindafwerking op afval- en reststofbergingen (Publikatiereeks bodembescherming nr.
      1991/2);




              *Richtlijn geohydrologische isolatie:*


              Richtlijn geohydrologische isolatie van bestaande stortplaatsen (Vereniging van Afvalverwerkers, Utrecht,
      juli 1997);




              *Ontwerpprocedure grondwatermonitoring:*


              Ontwerp-procedure grondwatermonitoring stortplaatsen (Vereniging van Afvalverwerkers, Utrecht, november
      1995);




              *NEN:*


              door het Nederlands Normalisatie-instituut (NNI) uitgegeven norm;




              *TNO:*


              Nederlandse organisatie voor toegepast natuurwetenschappelijk onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005858
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel1
