  - number: '13'
    text: |-
      1 De werkwijze bij monsterneming, monstervoorbehandeling en analyse van de monsters van het grondwater, het
      percolaat en het oppervlaktewater is in overeenstemming met de normen opgenomen in de bijlage, behorende bij deze
      regeling.

      2 De analyse vindt plaats door een laboratorium dat een kwaliteitsborgingssysteem hanteert, gebaseerd op de
      Europese Norm NEN-EN-ISO/IEC 17025.
    url: https://wetten.overheid.nl/BWBR0005877/2001-07-15#Artikel13
  - number: '14'
    text: |-
      Bij het op schrift stellen van de op grond van de [artikelen 10][ref1] en [11][ref2] verkregen
      onderzoeksresultaten, wordt een vergelijking gemaakt tussen deze onderzoeksresultaten en de onderzoeksresultaten
      verkregen bij het onderzoek ten behoeve van de vergunningaanvraag. De resultaten van het onderzoek naar de
      kwaliteit van het water uit de grondwaterbemonsteringsdrainagebuizen en het water uit de stroomafwaarts van de
      stortplaats gelegen grondwaterbemonsteringspeilbuizen, worden vergeleken met de resultaten van het onderzoek naar
      de kwaliteit van het water uit de stroomopwaarts gelegen grondwaterbemonsteringspeilbuizen. De onderzoeksresultaten
      worden vergeleken met alle voorafgaande onderzoeksresultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005877#Artikel11
