  - number: 14a
    text: |-
      1 Op basis van een schriftelijk advies van een ter zake kundige worden aan de vergunning voorschriften verbonden
      met betrekking tot het vaststellen van referentiemeetpunten en controlemeetpunten.

      2 Voor de parameters, bedoeld in de [artikelen 10, derde en vijfde lid][ref1], en
      [11, tweede tot en met vierde lid][ref2], worden aan de hand van het bepaalde in het derde en vierde lid
      toetsingswaarden ter bepaling van de verslechtering van de grondwaterkwaliteit vastgesteld.

      3 De toetsingswaarde voor een stof wordt berekend door de signaalwaarde van de desbetreffende stof, gemeten op het
      referentiemeetpunt, te vermeerderen met 0,3 maal de streefwaarde van die stof bedoeld in de Circulaire streef- en
      interventiewaarden bodemsanering (Stcrt. 2000, 39).

      4 De signaalwaarde van de desbetreffende stof is:

      a. het rekenkundig gemiddelde van de achtergrondwaarden grondwater die op grond van de [artikelen 10][ref3] en
      [11][ref4] op een referentiemeetpunt zijn gemeten vermenigvuldigd met 1,3 indien minder dan 30 metingen op een
      referentiepunt zijn verricht, dan wel

      b. de waarde waar beneden 98% van de waarnemingen liggen, indien meer dan 30 metingen op een referentiepunt zijn
      uitgevoerd.

      5 Bij het overschrijden van de toetsingswaarde voor een van de stoffen wordt zo spoedig mogelijk door een ter zake
      kundige nogmaals een bemonstering en analyse van de stoffen uitgevoerd en wordt onderzocht of de overschrijding
      daadwerkelijk wordt veroorzaakt door de stortplaats.

      6 Het in [artikel 9, tweede lid, onder b][ref5], van het Stortbesluit bedoelde interventiepunt wordt bereikt als,
      met inachtneming van het vijfde lid, gebleken is dat voor een van de desbetreffende stoffen de toetsingswaarde
      is overschreden.


