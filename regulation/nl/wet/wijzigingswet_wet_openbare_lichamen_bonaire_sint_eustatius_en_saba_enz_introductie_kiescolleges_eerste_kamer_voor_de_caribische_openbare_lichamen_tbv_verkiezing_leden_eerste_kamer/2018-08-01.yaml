preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet openbare lichamen Bonaire, Sint Eustatius
    en Saba en de Kieswet aan te passen aan de wijziging van de Grondwet strekkende tot het opnemen van een
    constitutionele basis voor Caribische openbare lichamen en het regelen van een kiescollege voor de Eerste Kamer
    en in verband daarmee bepalingen vast te stellen over de instelling en samenstelling van een kiescollege voor de
    Eerste Kamer in ieder van de openbare lichamen, alsook over de verkiezing van de leden van de kiescolleges en de
    verkiezing van de leden van de Eerste Kamer door de leden van de kiescolleges tezamen met de leden van provinciale
    staten;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040700/2018-08-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      Na de eerste verkiezing van de leden van het kiescollege geschiedt in afwijking van
      [artikel V 4 van de Kieswet][ref1] het onderzoek van de geloofsbrieven van de benoemde leden van het kiescollege,
      bedoeld in dat artikel, door die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_4
    url: https://wetten.overheid.nl/BWBR0040700/2018-08-01#ArtikelIII
