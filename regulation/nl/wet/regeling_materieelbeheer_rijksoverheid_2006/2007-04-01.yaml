---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_materieelbeheer_rijksoverheid_2006
regulatory_layer: WET
publication_date: '2017-04-07'
valid_from: '2007-04-01'
bwb_id: BWBR0019767
url: https://wetten.overheid.nl/BWBR0019767/2007-04-01
preamble:
  text: |-
    Gelet op artikel 38, eerste lid, van de Comptabiliteitswet 2001;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: 1.1.a
    text: 'minister: de minister wie het aangaat;'
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: 1.1.b
    text: |-
      college: een college, genoemd in [artikel 1, eerste lid, onder e, van de Comptabiliteitswet 2001][ref1], wie het
      aangaat;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
  - number: 1.1.c
    text: |-
      materieelbeheer: de zorg voor niet-geldelijke zaken vanaf het moment van inbeheer- of ingebruikneming tot aan het
      moment van afstoting;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: 1.1.d
    text: 'overtolligstelling: de vaststelling dat een zaak niet langer nodig is voor de bedrijfsvoering;'
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: 1.1.e
    text: |-
      budgettairemiddelenafspraak: de afspraak tussen de Minister van Financiën en een minister of een college over de
      budgettaire bestemming van de opbrengst van een afgestoten zaak;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: 1.1.f
    text: |-
      budgettairebijdrageafspraak: de afspraak tussen de Minister van Financiën en een minister of een college over de
      budgettaire bijdrage van de minister, respectievelijk het college in de door de dienst Domeinen te maken kosten van
      afstoting van een zaak.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling worden tot onroerende zaken mede gerekend zaken ten aanzien waarvan aan de
      Staat een niet-zakelijk recht tot gebruik is verleend.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: '1.3'
    text: 'Deze regeling is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: 1.3.a
    text: de archieven van het Rijk;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
  - number: 1.3.b
    text: |-
      museale voorwerpen als bedoeld in [artikel 1, onderdeel c, van de Regeling materieelbeheer museale voorwerpen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020583#Artikel1
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020583
        artikel: '1'
  - number: '2.1'
    text: |-
      De minister of het college legt de beschrijving van de administratieve organisatie met betrekking tot het
      materieelbeheer vast en draagt zorg voor de toepassing van de in die administratieve organisatie vastgelegde
      procedures.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel2
  - number: '2.2'
    text: |-
      De minister of het college draagt er zorg voor dat in het kader van het gevoerde materieelbeheer een adequate
      administratie wordt bijgehouden.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel2
  - number: '3.1'
    text: |-
      In beheer of in gebruik genomen zaken worden zodanig beheerd of gebruikt dat onnodig kwaliteits- en
      kwantiteitsverlies worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel3
  - number: '3.2'
    text: |-
      Van door de minister of het college aan te wijzen roerende zaken wordt op niet vooraf aangekondigde momenten de
      aanwezigheid in de organisatie gecontroleerd. De resultaten van de controle worden in de administratie vastgelegd.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel3
  - number: '3.3'
    text: |-
      De minister of het college inventariseert de risico’s dat door oorzaken gelegen buiten de organisatie aan in beheer
      of in gebruik genomen zaken aanzienlijke schade kan worden toegebracht.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel3
  - number: '4.1'
    text: |-
      In beheer of in gebruik genomen zaken worden zodanig beheerd of gebruikt dat de kans op schade aan derden of
      aansprakelijkstelling door derden zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel4
  - number: '4.2'
    text: |-
      De minister of het college inventariseert de risico’s dat met in beheer of in gebruik genomen zaken aanzienlijke
      schade aan derden kan worden toegebracht, dan wel dat het beheer of het gebruik van die zaken aanleiding kan zijn
      tot aansprakelijkstelling door derden met aanzienlijke financiële gevolgen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel4
  - number: '5.1'
    text: |-
      Aan de hand van de inschatting van de kans dat de geïnventariseerde risico’s, bedoeld in de [artikelen 3][ref1] en
      [4][ref2], zich zullen voordoen, wordt besloten of en zo ja welke preventieve maatregelen moeten worden genomen
      ter voorkoming of beperking van de risico’s, dan wel welke repressieve maatregelen moeten worden genomen voor het
      herstel van de schade of de opvang van de gevolgen van aansprakelijkstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0019767#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019767#Artikel4
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019767
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0019767
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.2'
    text: |-
      De risico's van schade voor en aansprakelijkstelling van de Staat worden om redenen van doelmatigheid in het
      algemeen niet verzekerd. Een besluit tot verzekeren wordt genomen in overeenstemming met de Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel5
  - number: '5.3'
    text: |-
      In overleg tussen de minister of het college en de Minister van Financiën kan worden besloten, dat de afwikkeling
      van een schade of een aansprakelijkstelling namens het Rijk door de Minister van Financiën geschiedt.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel5
  - number: '6.1'
    text: |-
      Voorraden, voor zover deze benodigd zijn voor de bedrijfsvoering, worden zodanig aangehouden dat de continuïteit
      van de bedrijfsvoering voldoende gewaarborgd is en dat geen ondoelmatige voorraden ontstaan.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel6
  - number: '6.2'
    text: |-
      De minister of het college kan voorraden roerende zaken aanwijzen, waarop [artikel 7][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019767#Artikel7
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019767
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.1'
    text: Van aangewezen voorraden houdt de minister of het college een voorraadadministratie bij.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: '7.2'
    text: |-
      De administratie van een aangewezen voorraad, benodigd voor de bedrijfsvoering, bevat in het algemeen gegevens
      omtrent:
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: 7.2.a
    text: de aard van de in voorraad gehouden zaken in een bij elke zaak passende eenheid;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: 7.2.b
    text: de aanwezige hoeveelheden, alsmede de voorraadmutaties;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: 7.2.c
    text: de aanschafprijzen;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: 7.2.d
    text: de leveranciers;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: 7.2.e
    text: de locatie waar de voorraad wordt aangehouden;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: 7.2.f
    text: de namen van de voorraadbeheerders en van de beschikkende functionarissen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: '7.3'
    text: |-
      Tot afgifte van zaken uit een aangewezen voorraad is uitsluitend bevoegd de betrokken voorraadbeheerder in opdracht
      van de beschikkende functionarissen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: '7.4'
    text: Bij het beheer van een aangewezen voorraad wordt een voldoende functiescheiding toegepast.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: '7.5'
    text: |-
      In het algemeen ten minste eenmaal per jaar wordt door middel van een aanwezigheidscontrole, te verrichten door
      een van de voorraadbeheerder onafhankelijke functionaris, nagegaan of de voorraad in overeenstemming is met de
      bijgehouden voorraadadministratie. De resultaten van die controle worden betrouwbaar vastgelegd.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: '7.6'
    text: |-
      Na afloop van elk jaar legt de voorraadbeheerder verantwoording af over het door hem in het voorafgaande jaar
      gevoerde voorraadbeheer overeenkomstig de door de minister of het college vastgestelde procedure.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel7
  - number: '8.1'
    text: |-
      De minister of het college neemt over roerende zaken die niet langer nodig zijn voor de bedrijfsvoering van zijn
      ministerie, respectievelijk van het college zo spoedig mogelijk een besluit tot overtolligstelling.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.2'
    text: |-
      De minister of het college doet van een besluit tot overtolligstelling zo spoedig mogelijk mededeling aan de dienst
      Domeinen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.3'
    text: |-
      De minister of het college draagt overtollig gestelde, roerende zaken in tijdelijk beheer over aan de dienst
      Domeinen, tenzij het zaken betreft die door middel van inruil worden verkocht.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.4'
    text: |-
      De overdracht in tijdelijk beheer aan de dienst Domeinen geschiedt na acceptatie door de dienst Domeinen en met
      inachtneming van gemaakte budgettairemiddelenafspraken dan wel van gemaakte budgettairebijdrageafspraken.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.5'
    text: |-
      De dienst Domeinen draagt het materieelbeheer van overtollig gestelde zaken via ingebruikgeving aan andere
      ministers of colleges of via verhuur aan derden over, dan wel stoot die zaken via verkoop aan derden af. Verhuur of
      verkoop aan derden geschiedt tegen marktconforme prijzen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.6'
    text: |-
      De dienst Domeinen kan de kosten van afstoting geheel of gedeeltelijk aan de overtolligstellende minister of het
      college in rekening brengen, indien zij die kosten niet kan dekken uit de opbrengst van afstoting. Zij doet daarvan
      zo spoedig mogelijk mededeling aan de minister of het college.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.7'
    text: |-
      De dienst Domeinen kan toestemming verlenen dat afstoting door de minister of het college zelf plaatsvindt. Aan die
      toestemming kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.8'
    text: |-
      Roerende zaken die niet op de in het vijfde lid bedoelde wijze kunnen worden afgestoten of overgedragen, stoot de
      dienst Domeinen voor rekening van de minister of het college door middel van vernietiging af.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '8.9'
    text: |-
      Indien naar het oordeel van de dienst Domeinen de minister of het college een besluit tot overtolligstelling of
      een overdracht in tijdelijk beheer aan de dienst Domeinen ondoelmatig lang uitstelt, kan de dienst Domeinen, nadat
      de Minister van Financiën de minister of het college schriftelijk een voorstel tot overdracht in tijdelijk beheer
      heeft gedaan, de betrokken zaak zonder een besluit tot overtolligstelling in tijdelijk beheer overnemen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel8
  - number: '9.1'
    text: |-
      De minister of het college meldt de onroerende zaak, waarvan overtolligstelling wordt overwogen, zo spoedig
      mogelijk aan bij de dienst Domeinen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.2'
    text: |-
      De minister of het college neemt over een onroerende zaak die niet langer nodig is voor de bedrijfsvoering van zijn
      ministerie, respectievelijk van het college zo spoedig mogelijk een besluit tot overtolligstelling.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.3'
    text: |-
      De minister of het college doet van een besluit tot overtolligstelling zo spoedig mogelijk mededeling aan de dienst
      Domeinen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.4'
    text: |-
      De minister of het college draagt een overtollig gestelde, onroerende zaak in tijdelijk beheer over aan de dienst
      Domeinen. [Artikel 8, negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019767#Artikel8
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019767
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '9.5'
    text: |-
      De overdracht in tijdelijk beheer aan de dienst Domeinen geschiedt na acceptatie door de dienst Domeinen en met
      inachtneming van gemaakte budgettairemiddelenafspraken dan wel van gemaakte budgettairebijdrageafspraken.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.6'
    text: |-
      De dienst Domeinen draagt het materieelbeheer van een overtollig gestelde onroerende zaak via ingebruikgeving
      aan andere ministers of colleges of via verhuur aan derden over, dan wel stoot de zaak via verkoop aan derden af,
      tenzij hij in het belang van het Rijk besluit tot het aanhouden van een onroerende zaak in tijdelijk beheer.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.7'
    text: 'Bij ingebruikgeving, verhuur of verkoop wordt in het algemeen de volgende voorkeursvolgorde in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: 9.7.a
    text: ministeries en colleges;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: 9.7.b
    text: |-
      door het Rijk gesubsidiëerde organisaties, indien de minister ten laste van wiens begroting de subsidie is of
      wordt verstrekt, de dienst Domeinen verzoekt om een voorkeurspositie voor de betrokken organisatie bij de koop of
      de huur;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: 9.7.c
    text: gemeenten, provincies en waterschappen;
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: 9.7.d
    text: andere rechts- of natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.8'
    text: |-
      Aan de gebruiksgerechtigde die de onroerende zaak voorafgaand aan het moment van afstoting geheel of grotendeels
      in gebruik heeft, of aan een eigenaar van een aan de onroerende zaak aangrenzende onroerende zaak kan een
      voorkeurspositie bij de koop of de huur worden gegeven.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.9'
    text: |-
      Verkoop of verhuur aan derden geschiedt tegen marktconforme prijzen. Bij ingebruikgeving aan andere ministers of
      colleges vindt interne doorberekening plaats op basis van marktconforme prijzen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.10'
    text: |-
      Indien de dienst Domeinen overweegt af te wijken van de toepassing van het zevende lid, kan zij daarover het advies
      van de Raad voor Vastgoed Rijksoverheid vragen.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '9.11'
    text: |-
      Indien een afstoting of een overdracht als bedoeld in het zevende lid wordt overwogen, kan de dienst Domeinen
      daarover advies vragen aan de Raad voor Vastgoed Rijksoverheid als dat uit hoofde van de belangenafweging naar het
      oordeel van de dienst Domeinen wenselijk is.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel9
  - number: '10'
    text: |-
      De minister of het college kan in bijzondere omstandigheden met de instemming van de Minister van Financiën
      afwijken van de bepalingen van deze regeling.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel10
  - number: '11.1'
    text: |-
      De regels, bedoeld in [artikel 38, eerste lid, van de Comptabiliteitswet 2001][ref1], ten aanzien van het
      materieelbeheer, zoals die regels zijn vastgesteld bij de Regeling Rijksbegrotingsvoorschriften 2003 van 25
      september 2002, worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel38
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '38'
  - number: '11.2'
    text: 'Deze regeling wordt aangehaald als: Regeling materieelbeheer rijksoverheid 2006.'
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel11
  - number: '11.3'
    text: Deze regeling treedt in werking met ingang van 1 mei 2006 en werkt terug tot en met 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019767/2007-04-01#Artikel11
