$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringswet_verordening_erfrecht
regulatory_layer: WET
publication_date: '2014-11-14'
valid_from: '2015-08-17'
bwb_id: BWBR0035741
url: https://wetten.overheid.nl/BWBR0035741/2015-08-17
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat wetgeving nodig is ter uitvoering van de Verordening (EU) nr. 650/2012
    van het Europees Parlement en de Raad van 4 juli 2012 betreffende de bevoegdheid, het toepasselijke recht, de
    erkenning en de tenuitvoerlegging van beslissingen en de aanvaarding en de tenuitvoerlegging van authentieke akten
    op het gebied van erfopvolging, alsmede betreffende de instelling van een Europese erfrechtverklaring (PbEU 2012,
    L 201);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van de [artikelen 2 tot en met 9][ref1] van deze wet wordt verstaan onder «de verordening»: de
      verordening (EU) nr. 650/2012 van het Europees Parlement en de Raad van 4 juli 2012 betreffende de bevoegdheid,
      het toepasselijke recht, de erkenning en de tenuitvoerlegging van beslissingen en de aanvaarding en de
      tenuitvoerlegging van authentieke akten op het gebied van erfopvolging, alsmede betreffende de instelling van een
      Europese erfrechtverklaring (PbEU 2012, L 201).


      [ref1]: https://wetten.overheid.nl/BWBR0035741#Artikel2
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035741
        artikel: '2'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Een erfgenaam kan op grond van artikel 13 van de verordening een verklaring als bedoeld in
      [artikel 191 lid 1, eerste volzin, van Boek 4 van het Burgerlijk Wetboek][ref1] afleggen ter griffie van de
      rechtbank van zijn woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel191
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '191'
  - number: '2.2'
    text: |-
      Een wettelijke vertegenwoordiger van een erfgenaam kan op grond van artikel 13 van de verordening een verklaring
      als bedoeld in [artikel 193 lid 1 van Boek 4 van het Burgerlijk Wetboek][ref1] afleggen ter griffie van de
      rechtbank van zijn woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel193
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '193'
  - number: '2.3'
    text: |-
      Een legataris kan een verklaring betreffende aanvaarding of verwerping van een legaat als bedoeld in artikel 13 van
      de verordening afleggen ter griffie van de rechtbank van zijn woonplaats. De verklaring wordt in het boedelregister
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel2
  - number: '3.1'
    text: |-
      Het verlof tot tenuitvoerlegging, bedoeld in artikel 43 van de verordening, wordt bij verzoekschrift gevraagd aan
      de voorzieningenrechter. De [artikelen 985 tot en met 990 van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '985'
  - number: '3.2'
    text: Voor de indiening van het verzoekschrift is de bijstand van een advocaat niet vereist.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel3
  - number: '3.3'
    text: |-
      Het verzoekschrift wordt in de Nederlandse taal gesteld, onverminderd
      [artikel 15 van de Wet gebruik Friese taal][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034047#Artikel15
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034047
        artikel: '15'
  - number: '3.4'
    text: |-
      Onverminderd het bepaalde in artikel 47 van de verordening wordt bij ongenoegzaamheid van de bij het verzoekschrift
      overgelegde documenten aan de verzoeker de gelegenheid tot aanvulling gegeven.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel3
  - number: '3.5'
    text: |-
      Inwilliging van het verzoek geschiedt in de vorm van een eenvoudig verlof, dat op het overgelegde afschrift van de
      beslissing, dat door de bevoegde autoriteit is gewaarmerkt, wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel3
  - number: '3.6'
    text: |-
      Voor de toepassing van de [Wet griffierechten burgerlijke zaken][ref1] wordt het verzoek geacht een verzoek van
      onbepaalde waarde te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '3.7'
    text: |-
      Op het verzoek tot erkenning, bedoeld in hoofdstuk IV van de verordening, zijn de voorgaande leden van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel3
  - number: '4.1'
    text: |-
      De rechtbank waarvan de voorzieningenrechter op het verzoek om erkenning of tenuitvoerlegging
      heeft beslist, neemt kennis van het rechtsmiddel, bedoeld in artikel 50 van de verordening.
      [Artikel 93 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
  - number: '4.2'
    text: |-
      Het rechtsmiddel, bedoeld in artikel 50 van de verordening, wordt, indien het wordt ingesteld door de verzoeker,
      ingesteld binnen 30 dagen na de dagtekening van de beschikking waarbij het verlof is geweigerd.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel4
  - number: '4.3'
    text: 'Het rechtsmiddel bedoeld in artikel 51 van de verordening is: beroep in cassatie.'
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel4
  - number: '4.4'
    text: |-
      Het rechtsmiddel bedoeld in artikel 50 van de verordening en het rechtsmiddel bedoeld in artikel 51 van de
      verordening, worden ingesteld en behandeld met toepassing van de regels voor de verzoekschriftprocedure in eerste
      aanleg onderscheidenlijk in cassatie.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel4
  - number: '4.5'
    text: |-
      Voor de toepassing van de [Wet griffierechten in burgerlijke zaken][ref1] wordt het bij een rechtsmiddel ingestelde
      verzoek geacht een verzoek van onbepaalde waarde te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '5.1'
    text: |-
      Het verlof tot tenuitvoerlegging, bedoeld in artikel 60 van de verordening, wordt gevraagd bij verzoekschrift
      aan de voorzieningenrechter. [Artikel 993 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel993
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '993'
  - number: '5.2'
    text: |-
      Op verzoeken, bedoeld in het eerste lid, zijn [artikel 3, tweede tot en met zesde lid][ref1], en [artikel 4][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035741#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035741#Artikel4
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035741
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035741
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      De autoriteit, bedoeld in artikel 59, eerste lid, tweede volzin, en in artikel 60, tweede lid, van de verordening,
      is de notaris die de authentieke akte heeft verleden of de notaris die zijn protocol heeft overgenomen.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel6
  - number: '7'
    text: |-
      De [artikelen 3][ref1] en [4][ref2] zijn van overeenkomstige toepassing op het verlof tot tenuitvoerlegging van
      een gerechtelijke schikking als bedoeld in artikel 61 van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035741#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035741#Artikel4
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035741
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035741
        artikel: '4'
        paragraaf: '2'
  - number: '8'
    text: |-
      Als autoriteit van afgifte in de zin van artikel 64 van de verordening wordt aangewezen: een notaris met
      vestigingsplaats in Nederland.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel8
  - number: '9.1'
    text: |-
      De kantonrechter van de plaats waar de notaris die de Europese erfrechtverklaring heeft afgegeven kantoor houdt,
      is bevoegd van een rechtsmiddel als bedoeld in artikel 72, eerste lid, van de verordening kennis te nemen. Het
      rechtsmiddel wordt ingesteld en behandeld met toepassing van de regels voor de verzoekschriftprocedure.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel9
  - number: '9.2'
    text: |-
      Indien de kantonrechter vaststelt dat de Europese erfrechtverklaring niet met de werkelijkheid overeenstemt, als
      bedoeld in artikel 72, tweede lid, eerste volzin van de verordening, stelt hij een termijn vast waarbinnen de in
      [artikel 8][ref1] bedoelde autoriteit van afgifte deze verklaring moet corrigeren, wijzigen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0035741#Artikel8
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035741
        artikel: '8'
        paragraaf: '4'
  - number: '9.3'
    text: |-
      Bij toewijzing van het verzoek als bedoeld in artikel 72, tweede lid, tweede volzin van de verordening, stelt
      de kantonrechter een termijn vast waarbinnen de in [artikel 8][ref1] bedoelde autoriteit van afgifte een nieuwe
      beslissing moet nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0035741#Artikel8
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035741
        artikel: '8'
        paragraaf: '4'
  - number: '9.4'
    text: Tegen een beslissing ingevolge het tweede of derde lid staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel9
  - number: '14'
    text: Deze wet treedt in werking met ingang van 17 augustus 2015.
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet Verordening erfrecht.'
    url: https://wetten.overheid.nl/BWBR0035741/2015-08-17#Artikel15
