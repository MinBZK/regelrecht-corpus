        artikel: '12'
  - number: '6'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling wordt aangehaald als: Instellingsbesluit projectorganisatie InterCoach.
    url: https://wetten.overheid.nl/BWBR0015114/2006-01-01#Artikel6
