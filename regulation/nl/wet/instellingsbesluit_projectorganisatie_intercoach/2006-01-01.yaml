preamble:
  text: |-
    Gelet op artikel 6a, tweede lid, onder e, van het Organisatie-, mandaat- en volmachtbesluit SZW 2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015114/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            de projectorganisatie:

              de projectorganisatie InterCoach;



            b
            de projectleider:

              degene die is belast met de leiding van de projectorganisatie.
    url: https://wetten.overheid.nl/BWBR0015114/2006-01-01#Artikel1
  - number: '2'
    text: Er is een projectorganisatie InterCoach.
    url: https://wetten.overheid.nl/BWBR0015114/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 De projectorganisatie ressorteert rechtstreeks onder de plaatsvervangend secretaris-generaal.

      2 Aan het hoofd van de projectorganisatie staat een projectleider.
    url: https://wetten.overheid.nl/BWBR0015114/2006-01-01#Artikel3
  - number: '4'
    text: |-
      De projectorganisatie heeft de volgende taken:

      a. het organiseren van een leergang en follow-up voor directeuren met talent voor coachen;

      b. het bemiddelen bij coachtrajecten tussen tot coach opgeleide directeuren en collega's van andere ministeries;

      c. het onderhouden van een kwaliteitssysteem ter borging van de coachtrajecten.
    url: https://wetten.overheid.nl/BWBR0015114/2006-01-01#Artikel4
  - number: '5'
    text: |-
      1 De [artikelen 3][ref1] en
      [12 van het Organisatie-, mandaat- en volmachtbesluit plaatsvervangend secretaris-generaal SZW 2005][ref2] zijn van
      overeenkomstige toepassing op de projectleider.

      2 De plaatsvervangend secretaris-generaal stelt de jaarplannen vast van de projectorganisatie. Gegeven
      het budget dat door de secretaris-generaal aan de plaatsvervangend secretaris-generaal ter beschikking is
      gesteld, kent de plaatsvervangend secretaris-generaal aan de projectleider de budgetten toe waarover deze mag
      beschikken. De plaatsvervangend secretaris-generaal bewaakt de voortgang van de uitvoering van jaarplannen van
      de projectorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017833#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017833#Artikel12
    url: https://wetten.overheid.nl/BWBR0015114/2006-01-01#Artikel5
