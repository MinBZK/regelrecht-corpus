---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vergunningen_diergeneesmiddelen
regulatory_layer: WET
publication_date: '2005-12-29'
valid_from: '2002-01-01'
bwb_id: BWBR0006386
url: https://wetten.overheid.nl/BWBR0006386/2002-01-01
preamble:
  text: |-
    Gelet op richtlijn nr. 90/676/EEG van 13 december 1990 (PbEG L 373) tot wijziging van richtlijn nr. 81/851/EEG
    betreffende de onderlinge aanpassing van de wetgevingen der lid-staten inzake geneesmiddelen voor diergeneeskundig
    gebruik (PbEG L 317) en op de artikelen 24 en 27 van de Diergeneesmiddelenwet, de artikelen 26, 27 en 30 van
    het Eisen- en controlebesluit vergunningen diergeneesmiddelen 1993 en artikel 8 van het Besluit registratie,
    substanties en bijwerkingen;

    Gezien het advies van de Vereniging van Fabrikanten en Groothandelaren in Veterinaire Produkten (Fagrovet),
    de Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin) en de Vereniging van
    Nederlandse Fabrikanten van Veevoedertoevoegingen (Nefato), de Dibevo, het Landbouwschap en het Produktschap voor
    Veevoeder (Pvvr);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *wet:*


              [Diergeneesmiddelenwet][ref1];



            b

              *besluit:*


              [Eisen- en controlebesluit vergunningen diergeneesmiddelen 1993][ref2];



            c

              *gekanaliseerde diergeneesmiddelen:*


              diergeneesmiddelen als bedoeld in
      [artikel 2 van de Kanalisatieregeling diergeneesmiddelen en gemedicineerde voeders][ref3];



            d

              *vergunning:*


              vergunning als bedoeld in [artikel 21 van de wet][ref4];



            e

              *aanvrager:*


              degene die diergeneesmiddelen bereidt, verpakt, etiketteert of aflevert;



            f

              *vergunningenregister:*


              register als bedoeld in [artikel 27 van de wet][ref5];



            g

              *importeur:*


              degene die diergeneesmiddelen in Nederland invoert;



            h

              *bureau:*


              Bureau Registratie Diergeneesmiddelen, Postbus 289, 6700 AG Wageningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
      [ref2]: https://wetten.overheid.nl/BWBR0006290
      [ref3]: https://wetten.overheid.nl/BWBR0004033#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0003818#Artikel27
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
      - id: ref2
        bwb_id: BWBR0006290
      - id: ref3
        bwb_id: BWBR0004033
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0003818
        artikel: '27'
  - number: '2.1'
    text: |-
      Een aanvraag van een vergunning en een aanvraag tot wijziging van een vergunning worden ingediend bij het bureau
      door inzending van het formulier, bedoeld in Bijlage A bij deze regeling, en een bewijs van betaling van het
      bedrag, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel2
  - number: '2.2'
    text: Het aanvraagformulier gaat vergezeld van een recent uittreksel uit het handelsregister.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      De kosten verbonden aan de behandeling van een aanvraag van een vergunning en van een aanvraag tot wijziging van
      een vergunning bedragen: € 226,89 respectievelijk € 90,76.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Binnen twee weken na ontvangst van de aanvraag en het bedrag, bedoeld in [artikel 2, derde lid][ref1], wordt de
      ontvangst daarvan aan de aanvrager schriftelijk bevestigd onder vermelding van de datum en het nummer waaronder de
      aanvraag in behandeling is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel2
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Bij de bevestiging van de aanvraag wordt aan de aanvrager medegedeeld op welke datum het onderzoek ter plaatse,
      bedoeld in [artikel 4a][ref1], zal plaatsvinden en op welke datum de aanvrager de daarvoor verschuldigde kosten
      dient te hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: 4a
        paragraaf: '2'
  - number: '3.3'
    text: |-
      Op de in het eerste lid bedoelde aanvraag wordt beslist binnen 12 weken na ontvangst van het aanvraagformulier en
      het in [artikel 2, derde lid][ref1], bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel2
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Indien ten behoeve van de behandeling van een aanvraag, als bedoeld in [artikel 2, eerste lid][ref1], nadere
      gegevens met betrekking tot de in het besluit geregelde onderwerpen benodigd zijn, verstrekt de aanvrager deze op
      verzoek zo spoedig mogelijk, doch in elk geval binnen 8 weken na een daartoe strekkend verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel2
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '2'
        paragraaf: '2'
  - number: '4.2'
    text: In bijzondere gevallen kan de in het eerste lid bedoelde termijn éénmaal met 8 weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4
  - number: 4a.1
    text: |-
      Alvorens een vergunning wordt verleend of gewijzigd is een onderzoek ter plaatse noodzakelijk, tenzij de aanvraag
      een aanvraag tot wijziging van de vergunning betreft en uitsluitend betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
  - number: 4a.1.a
    text: administratieve gegevens, of
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
  - number: 4a.1.b
    text: |-
      het bereiden, verpakken, etiketteren of afleveren van een diergeneesmiddel indien: - dat middel dezelfde
      farmaceutische vorm heeft als een middel waarvoor ingevolge [artikel 21 van de wet][ref1] reeds aan de aanvrager
      een vergunning tot het verrichten van de betreffende handeling of handelingen is verleend, en
        - de handeling of handelingen met behulp van dezelfde apparatuur en in dezelfde lokaliteiten geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: 4a.2
    text: De aanvrager is de kosten van het onderzoek ter plaatse verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
  - number: 4a.3
    text: 'De kosten verbonden aan een onderzoek ter plaatse bedragen indien de aanvraag betrekking heeft op het:'
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
  - number: 4a.3.a
    text: bereiden, etiketteren of verpakken van diergeneesmiddelen € 907,56 per halve dag;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
  - number: 4a.3.b
    text: aleveren van diergeneesmiddelen € 226,89 per halve dag.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
  - number: 4a.4
    text: |-
      En onderzoek ter plaatse vindt niet plaats dan nadat bewijs van betaling van de kosten, bedoeld in het derde lid,
      door het bureau is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel4a
  - number: '5.1'
    text: |-
      De aanvraag wordt niet behandeld indien de verschuldigde kosten, bedoeld in [artikel 2, eerste lid][ref1], en
      [artikel 4a, derde lid][ref2], niet tijdig zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006386#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006386
        artikel: 4a
        paragraaf: '2'
  - number: '5.2'
    text: |-
      Indien de aanvrager in gebreke blijft de in [artikel 4, eerste lid][ref1], bedoelde gegevens binnen de gestelde
      termijn te verstrekken, wordt binnen 4 weken na het verstrijken van deze termijn een beslissing genomen op grond
      van de verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel4
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Als werkzaamheden, bedoeld in [artikel 30, tweede lid][ref1], van het besluit worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel30
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '30'
  - number: 6.a
    text: |-
      de werkzaamheden die worden uitgeoefend in het kader van de uitoefening van de diergeneeskunde in haar volle of
      beperkte omvang;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel6
  - number: 6.b
    text: |-
      het bedrijfsmatig houden van dieren, dan wel het onder zich houden van dieren van of voor anderen, anders dan in
      een onderneming waarin de landbouw, de veehouderij of de pluimveehouderij wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Indien de handelingen waarop de vergunning betrekking heeft plaatsvinden in combinatie met de in [artikel 6][ref1]
      genoemde werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel6
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '6'
        paragraaf: '3'
  - number: 7.a
    text: |-
      is de lokaliteit waarin gekanaliseerde diergeneesmiddelen worden bereid, verpakt, geëtiketteerd of afgeleverd, ten
      opzichte van de ruimten waarin de in [artikel 6][ref1] omschreven werkzaamheden worden verricht zodanig gelegen,
      dat daartussen geen rechtstreekse verbinding bestaat, en


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel6
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '6'
        paragraaf: '3'
  - number: 7.b
    text: |-
      dient de lokaliteit, die gebruikt wordt voor het bereiden, verpakken, etiketteren of afleveren van gekanaliseerde
      diergeneesmiddelen niet tevens voor de opslag van: - diergeneesmiddelen bestemd voor de aanwending bij de dieren
      die de vergunninghouder onder zich heeft;
        - diergeneesmiddelen bestemd voor de uitoefening van de in [artikel 6, onder a][ref1], bedoelde werkzaamheden;
        - geneesmiddelen voor humaan gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel6
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '6'
        paragraaf: '3'
  - number: '8'
    text: 'De inschrijving van een vergunning in het vergunningenregister geschiedt onder vermelding van:'
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel8
  - number: 8.a
    text: de soort vergunning;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel8
  - number: 8.b
    text: het nummer van de vergunning;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel8
  - number: 8.c
    text: naam en adres van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel8
  - number: 8.d
    text: de diergeneesmiddelen of de soorten diergeneesmiddelen waarop de vergunning betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel8
  - number: 8.e
    text: |-
      in voorkomend geval de substanties, bedoeld in artikel 8 van het Besluit registratie, substanties en bijwerkingen,
      waarop de vergunning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel8
  - number: '9'
    text: |-
      Als substanties bedoeld in artikel 8 van het Besluit registratie, substanties en bijwerkingen zijn de substanties
      aangewezen, die vermeld staan op de lijst opgenomen in de bij deze regeling behorende bijlage B.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Indien een besluit tot wijziging of intrekking van een vergunning onherroepelijk is geworden, wordt de inschrijving
      in het vergunningenregister gewijzigd dan wel doorgehaald, onder vermelding van de datum waarop het besluit is
      genomen.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een afschrift van het vergunningenregister ligt ter inzage in de bibliotheek van het Ministerie van Landbouw,
      Natuurbeheer en Visserij te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Van de inschrijving, doorhaling of wijziging van de inschrijving in het vergunningenregister wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel11
  - number: '12'
    text: |-
      De Minister van Landbouw, Natuurbeheer en Visserij kan op verzoek van een houder van een vergunning of van de
      bevoegde instanties van het land waar de diergeneesmiddelen worden ingevoerd ten behoeve van de uitvoer hiervan een
      verklaring certificeren, waaruit blijkt dat de betreffende fabrikant in het bezit is van een vergunning voor het
      bereiden, verpakken, etiketteren of afleveren van deze diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Een verzoek tot certificering als bedoeld in [artikel 12][ref1] wordt ingediend door inzending van een formulier
      overeenkomstig het bij deze regeling behorende model in bijlage C en van een bewijs van betaling van het bedrag,
      bedoeld in artikel 3, tweede lid, van de Regeling vergoeding werkzaamheden op verzoek 1993.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel12
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '12'
        paragraaf: '5'
  - number: '14'
    text: |-
      Een verzoek tot een erkenning als bedoeld in [artikel 26, eerste lid][ref1], van het besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel26
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '26'
  - number: 14.a
    text: wordt schriftelijk ingediend door een importeur bij de Minister van Landbouw, Natuurbeheer en Visserij;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel14
  - number: 14.b
    text: is met redenen omkleed;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel14
  - number: 14.c
    text: bevat de naam en het adres van de te erkennen fabrikant, en
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel14
  - number: 14.d
    text: |-
      bevat een verklaring van de importeur dat de in onderdeel c bedoelde fabrikant de betrokken diergeneesmiddelen
      bereidt, verpakt of etiketteert, en aflevert volgens normen die tenminste gelijkwaardig zijn aan die in de
      [artikelen 6 tot en met 21][ref1] van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel6
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '6'
  - number: '15'
    text: |-
      Een verzoek tot erkenning als bedoeld in [artikel 27, zesde lid][ref1], van het besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel27
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '27'
  - number: 15.a
    text: wordt schriftelijk ingediend bij de Minister van Landbouw, Natuurbeheer en Visserij;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel15
  - number: 15.b
    text: is met redenen omkleed;
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel15
  - number: 15.c
    text: bevat de naam en het adres van de te erkennen instelling,
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel15
  - number: 15.d
    text: |-
      bevat een verklaring van de importeur dat de betrokken partijen diergeneesmiddelen niet buiten Nederland worden
      gebracht, en
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel15
  - number: 15.e
    text: |-
      bevat een verklaring van de importeur dat de betrokken partijen diergeneesmiddelen door de in onderdeel c bedoelde
      instelling worden gecontroleerd volgens normen die tenminste gelijkwaardig zijn aan die in [artikel 27][ref1] van
      het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006290#Artikel27
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006290
        artikel: '27'
  - number: '16.1'
    text: |-
      Aanvraagformulieren, overeenkomstig de bij deze regeling behorende modellen in bijlage A en C, zijn op aanvraag
      verkrijgbaar bij het bureau.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde aanvraagformulieren liggen ter inzage in de bibliotheek van het Ministerie van
      Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Bij een houder van een vergunning tot het bereiden, verpakken of etiketteren van diergeneesmiddelen wordt ten
      minste om de twee jaar een inspectie, als bedoeld in [artikel 25, derde lid, van de wet][ref1] uitgevoerd.
      De houder van de vergunning is de kosten verbonden aan de inspectie, bedoeld in het eerste lid, verschuldigd.
      De kosten bedragen € 907,56 per halve dag. Van de inspectie wordt vooraf kennis gegeven aan de houder van de
      vergunning. Bij de kennisgeving wordt opgave gedaan van het aantal halve dagen dat voor de inspectie benodigd
      zal zijn en de kosten die de vergunninghouder in verband daarmee, ingevolge het tweede lid, verschuldigd is. Een
      inspectie vindt niet plaats dan nadat bewijs van betaling van de kosten, bedoeld in het tweede lid, door het bureau
      is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel25
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '25'
  - number: '18'
    text: |-
      De Aanvraagregeling vergunningen, de Regeling nadere eisen ten aanzien van vergunningen en de Regeling inrichting
      vergunningenregister worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      Deze regeling treedt, met uitzondering van [artikel 9][ref1], in werking met ingang van 1 januari 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel9
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '9'
        paragraaf: '4'
  - number: '19.2'
    text: |-
      [Artikel 9][ref1] treedt in werking met ingang van de dag waarop het Besluit registratie, substanties en
      bijwerkingen in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel9
    url: https://wetten.overheid.nl/BWBR0006386/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '9'
        paragraaf: '4'
  - number: '20'
    text: |-
