        artikel: '4'
  - number: VIII
    text: |-
      1 Deze wet treedt, met uitzondering van [artikel I, onderdeel D][ref1], in werking met ingang van 1 juli 1994.

      2 [Artikel I, onderdeel D][ref2], treedt in werking met ingang van 1 januari 1995. De invoering van dat artikel
      heeft in ten hoogste vier fasen plaats.

      3 Onze Minister van Welzijn, Volksgezondheid en Cultuur zendt - met het oog op mogelijke aanpassing - voor 1
      januari 1996 aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de artikelen I,
      onderdelen A tot en met C en VI van deze wet in de praktijk.


