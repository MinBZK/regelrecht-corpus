preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat het wenselijk is personen van 65 jaar of ouder, die een
    verzekeringsplichtig inkomen hebben dat niet meer bedraagt dan f 30 500 per jaar, op te nemen in de verplichte
    ziekenfondsverzekering, onder gelijktijdige aanpassing van de AOW-rechten en de ziekenfondspremie over die rechten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006722/1994-07-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      Artikel 3, eerste lid, onder *c*, van de [Ziekenfondswet][ref1] geldt niet voor degene die op de dag voorafgaande
      aan de dag waarop dat artikelonderdeel op hem van toepassing wordt, deelnam aan een publiekrechtelijke
      ziektekostenregeling voor ambtenaren, als bedoeld in artikel 4, zestiende lid, onder *b*, van die wet of als
      gezinslid in de zin van die regeling werd aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0006722/1994-07-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: VII
    text: |-
      In afwijking van [artikel 4 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1]
      wordt het in 1994 mede te financieren bedrag vastgesteld op f 433 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel4
    url: https://wetten.overheid.nl/BWBR0006722/1994-07-01#ArtikelVII
    references:
      - id: ref1
