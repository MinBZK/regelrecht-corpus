---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: rijkswet_op_de_consulaire_tarieven
regulatory_layer: WET
publication_date: '2010-09-01'
valid_from: '2010-10-10'
bwb_id: BWBR0013618
url: https://wetten.overheid.nl/BWBR0013618/2010-10-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bepalingen betreffende de heffing van
    kanselarijrechten die zijn neergelegd in de Wet op de Kanselarijrechten 1948 te vervangen door een vereenvoudigd
    tariefstelsel;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: In deze wet en de daarop berustende bepalingen wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel1
  - number: 1.1°
    text: 'Onze Minister: Onze Minister van Buitenlandse Zaken,'
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel1
  - number: 1.2°
    text: 'de Gevolmachtigde Minister: de Gevolmachtigde Minister van Aruba, Curaçao of Sint Maarten in Nederland.'
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      De belanghebbende is aan Onze Minister dan wel indien dat bij algemene maatregel van rijksbestuur is bepaald aan de
      Gevolmachtigde Minister een bij of krachtens algemene maatregel van rijksbestuur te bepalen vergoeding verschuldigd
      voor het verlenen van de bij of krachtens algemene maatregel van rijksbestuur aangeduide diensten met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: 2.1.a
    text: |-
      de uitoefening van de bij of krachtens de [Consulaire Wet][ref1] aan consulaire ambtenaren verleende bevoegdheden,


      [ref1]: https://wetten.overheid.nl/BWBR0001847
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001847
  - number: 2.1.b
    text: het verstrekken van consulaire verklaringen met het oog op het vervoeren van een stoffelijk overschot of een urn,
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: 2.1.c
    text: |-
      het verstrekken van verklaringen omtrent de burgerlijke staat en andere de persoon betreffende gegevens die tot
      bewijs strekken,
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: 2.1.d
    text: |-
      het verlenen van bijstand, zoals bemiddeling bij het oplossen van financiële en andere de belanghebbende
      betreffende problemen die verband houden met het verblijf in het buitenland,
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: 2.1.e
    text: |-
      het verschaffen van informatie en het bemiddelen bij het verkrijgen daarvan anders dan in het kader van de
      toepassing van de [Wet openbaarheid van bestuur][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 2.1.f
    text: |-
      het legaliseren en verifiëren van documenten en het bemiddelen bij het doen legaliseren en verifiëren van
      documenten,
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: 2.1.g
    text: |-
      het bemiddelen met het oog op het verrichten van rechtshandelingen en het verstrekken van verklaringen en andere
      documenten ten behoeve van belanghebbende door de bevoegde instanties van andere mogendheden,
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: 2.1.h
    text: de verlening van visa en
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: 2.1.i
    text: overige diensten verleend door Onze Minister dan wel de Gevolmachtigde Minister.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      De bepaling van de onderscheiden vergoedingen op grond van het eerste lid geschiedt zoveel mogelijk op grondslag
      van de werkelijke kosten die de gebruikelijke dienstverrichting meebrengt.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid kunnen de diensten en de daarvoor in rekening te brengen vergoeding bij of
      krachtens algemene maatregel van bestuur worden aangeduid respectievelijk vastgesteld, indien Onze Minister de
      dienst in Nederland verricht.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel2
  - number: '3'
    text: |-
      De vergoeding op grond van [artikel 2][ref1] wordt verhoogd met een vergoeding voor:


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel2
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '2'
  - number: 3.a
    text: |-
      reis- en verblijfskosten indien de dienst is verricht buiten de daartoe door Onze Minister dan wel de
      Gevolmachtigde Minister bestemde gebouwen en plaatsen,
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel3
  - number: 3.b
    text: kosten die niet zijn begrepen in de gebruikelijke dienstverrichting en
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel3
  - number: 3.c
    text: kosten die voortvloeien uit de inschakeling van derden bij het verrichten van de dienst.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel3
  - number: '4'
    text: |-
      De vergoeding op grond van de [artikelen 2][ref1] en [3][ref2] is verschuldigd, ook als de dienst door
      omstandigheden die niet aan Onze Minister dan wel de Gevolmachtigde Minister kunnen worden toegerekend niet is
      voltooid of de dienst niet tot het beoogde resultaat heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013618#Artikel3
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013618
        artikel: '3'
  - number: '5'
    text: |-
      Onze Minister dan wel de Gevolmachtigde Minister kan bepalen dat de vergoeding op grond van de [artikelen 2][ref1]
      en [3][ref2] niet of niet geheel verschuldigd is, op verzoek van de belanghebbende die voor aanvang van de
      dienstverrichting zijn onvermogen aannemelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013618#Artikel3
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013618
        artikel: '3'
  - number: '6.1'
    text: |-
      De vergoeding wordt vastgesteld en is verschuldigd in de valuta, waarin de bedragen bij of krachtens algemene
      maatregel van rijksbestuur dan wel algemene maatregel van bestuur op grond van [artikel 2][ref1] zijn uitgedrukt.


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel2
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '2'
  - number: '6.2'
    text: |-
      In afwijking van het eerste lid kan de vergoeding worden betaald in de valuta van het land waar de
      dienstverrichting heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Indien de omstandigheden in een land daartoe aanleiding geven, kan bij of krachtens algemene maatregel van
      rijksbestuur worden bepaald dat de vergoeding wordt betaald in andere valuta dan de valuta, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel6
  - number: '6.4'
    text: |-
      De omrekening uit of naar de valuta, waarin de bedragen bij of krachtens algemene maatregel van rijksbestuur op
      grond van [artikel 2][ref1] zijn uitgedrukt, geschiedt overeenkomstig de bij de vaststelling van de vergoeding
      bepaalde wisselkoers. Deze wisselkoers wordt zo veel mogelijk op grondslag van de koers van de dag bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel2
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '2'
  - number: '7.1'
    text: |-
      De vergoeding op grond van [artikel 2][ref1] is bij vooruitbetaling verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel2
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '2'
  - number: '7.2'
    text: |-
      De vergoeding op grond van [artikel 3][ref1] wordt vastgesteld na beëindiging van de dienstverrichting. Onze
      Minister dan wel de Gevolmachtigde Minister kan verlangen dat voor de aanvang van de dienstverrichting zekerheid
      wordt gesteld en kan betaling van een of meer voorschotten vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel3
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '3'
  - number: '8'
    text: |-
      Nadere voorschriften voor de vaststelling en de betaling van de vergoeding kunnen worden vastgesteld
      bij of krachtens algemene maatregel van rijksbestuur dan wel, indien toepassing is gegeven aan
      [artikel 2, derde lid][ref1], bij of krachtens algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0013618#Artikel2
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013618
        artikel: '2'
  - number: '9'
    text: |-
      Onze Minister zendt binnen drie jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid, doelmatigheid en de effecten van de toepassing van deze wet en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel9
  - number: '10'
    text: |-
      De [Wet op de kanselarijrechten 1948][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002043
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002043
  - number: '11'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Rijkswet op de consulaire tarieven.'
    url: https://wetten.overheid.nl/BWBR0013618/2010-10-10#Artikel12
