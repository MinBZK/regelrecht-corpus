        bwb_id: BWBR0034162
        artikel: '3'
  - number: '10'
    text: |-
      1 Tenzij anders overeengekomen werkt de instelling mee aan het overdragen van intellectuele eigendomsrechten ten
      behoeve van Onze Minister ter zake van de taken, genoemd in [artikel 2][ref1] en [3][ref2], en doet voor zover de
      [Auteurswet][ref3] dit toestaat, tevens afstand van persoonlijkheidsrechten als bedoeld in de Auteurswet die haar
      of haar personeel toebehoren.

      2 Voor zover de taken, genoemd in [artikel 2][ref4] en [3][ref5], tot stand komen met gebruikmaking van reeds
      bestaande, niet aan de instelling toekomende intellectuele eigendomsrechten, draagt de instelling zorg voor het
      verlenen van adequate gebruiksrechten aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
