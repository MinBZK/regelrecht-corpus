        artikel: '3'
  - number: '2'
    text: |-
      1 Stichting leerplanontwikkeling heeft tot taak:

      a. het ontwikkelen en onderhouden van landelijke leerplankaders,

      b. het ondersteunen en adviseren van Onze Minister met betrekking tot leerplanontwikkeling,

      c. het uitvoeren van onderzoek ter ondersteuning van de taken, genoemd in dit artikel, of

      d. het uitvoeren van aanvullende activiteiten, niet zijnde activiteiten gericht op het nascholen van leraren, die
      samenhangen met de taken, genoemd in dit artikel.

      2 Onze Minister kan Stichting leerplanontwikkeling subsidie verstrekken voor de taken, genoemd in dit artikel.
    url: https://wetten.overheid.nl/BWBR0034162/2020-08-01#Artikel2
  - number: '3'
    text: |-
      1 Stichting Cito Instituut voor Toetsontwikkeling heeft tot taak:

      a. het ontwikkelen van de centrale eindtoets, bedoeld in
      [artikel 9b, eerste lid, van de Wet op het primair onderwijs][ref1] en
      [artikel 18b, eerste lid, van de Wet op de expertisecentra][ref2], en de toets,
      bedoeld in artikel 9b, tweede lid, tweede volzin, van de Wet op het primair onderwijs en
      [artikel 18b, tweede lid, tweede volzin, van de Wet op de expertisecentra][ref3].

      b. het ontwikkelen van de centrale examens, bedoeld in de [Wet op het voortgezet onderwijs][ref4],
      de [Wet op het voortgezet onderwijs BES][ref5], de [Wet educatie en beroepsonderwijs][ref6] en de
      [Wet educatie en beroepsonderwijs BES][ref7],

      c. het uitvoeren van onderzoek ter ondersteuning van de taken, genoemd in dit artikel, of

      d. het uitvoeren van aanvullende activiteiten die samenhangen met de taken, genoemd in dit artikel.

      2 Onze Minister kan Stichting Cito Instituut voor Toetsontwikkeling subsidie verstrekken voor de taken, genoemd in
      het eerste lid.

      3 Onze Minister kan Stichting Cito Instituut voor Toetsontwikkeling subsidie verstrekken voor het ontwikkelen van
      de toetsen, bedoeld in [artikel 11, zevende lid, van de Wet op de expertisecentra][ref8].


