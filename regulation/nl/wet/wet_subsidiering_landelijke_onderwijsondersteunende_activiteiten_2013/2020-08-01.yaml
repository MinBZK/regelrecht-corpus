  - number: '8'
    text: |-
      1 Onze Minister stelt jaarlijks het bedrag vast dat ten hoogste beschikbaar is voor de verlening van
      subsidies ten behoeve van de taken, genoemd in [artikel 2, eerste lid, onderdelen a tot en met c][ref1], en
      [artikel 3, eerste lid, onderdelen a tot en met c][ref2]. Hij bepaalt daarbij hoe het beschikbare bedrag of de
      beschikbare bedragen worden verdeeld.

      2 Onze Minister kan jaarlijks het bedrag vaststellen dat ten hoogste beschikbaar is voor de activiteiten, genoemd
      in [artikel 2, eerste lid, onderdeel d][ref3], en [artikel 3, eerste lid, onderdeel d][ref4]. Hij kan daarbij
      bepalen hoe het beschikbare bedrag of de beschikbare bedragen worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
