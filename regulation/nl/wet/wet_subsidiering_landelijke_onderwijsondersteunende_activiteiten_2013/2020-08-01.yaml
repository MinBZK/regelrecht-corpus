  - number: '9'
    text: |-
      De voor de taken, genoemd in [artikel 2][ref1] en [3][ref2], gebruikte gegevens en de resultaten van die taken
      worden door de instellingen openbaar gemaakt, tenzij bijzondere omstandigheden zich hiertegen verzetten. Bij
      ministeriële regeling en bij de subsidieverlening kan worden bepaald dat openbaarmaking geheel of gedeeltelijk
      achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
    url: https://wetten.overheid.nl/BWBR0034162/2020-08-01#Artikel9
    references:
