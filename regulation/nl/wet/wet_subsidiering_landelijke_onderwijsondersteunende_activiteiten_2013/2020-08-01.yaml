  - number: '5'
    text: |-
      Onze Minister maakt eenmaal per twee jaar voor 1 april een Kaderbrief SLOA bekend op het terrein van
      leerplanontwikkeling en de doelen van toetsen en examens. De Kaderbrief SLOA heeft betrekking op de twee
      kalenderjaren die volgen op het jaar waarin de brief bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0034162/2020-08-01#Artikel5
  - number: '6'
    text: |-
      Onverminderd de mogelijkheden tot weigering van subsidieverlening ingevolge de [Algemene wet bestuursrecht][ref1]
      kan een subsidieverlening worden geweigerd indien Onze Minister van oordeel is dat:

      a. de aanvraag niet past binnen de Kaderbrief SLOA, of

      b. mag worden verwacht dat de met subsidiëring beoogde doelstellingen niet worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0034162/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '7'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:

      a. de aanvraag van een subsidie en de besluitvorming daarover,

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald,

      c. de activiteiten waarvoor subsidie wordt verstrekt,

      d. de voorwaarden waaronder de subsidie wordt verleend,

      e. de verplichtingen van de instellingen,

      f. de vaststelling van de subsidie,

      g. intrekking en wijziging van de subsidieverlening of subsidievaststelling,

      h. de betaling van de subsidie en het verlenen van voorschotten,

      i. het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref1], of

      j. andere criteria voor de verstrekking van subsidie.

      2 Bij de regels, bedoeld in het eerste lid, wordt voor zover nodig onderscheid gemaakt tussen subsidie voor:

      a. de taken, genoemd in [artikel 2, eerste lid, onderdelen a tot en met c][ref2], en
      [artikel 3, eerste lid, onderdelen a tot en met c][ref3], en

      b. de taken, genoemd in [artikel 2, eerste lid, onderdeel d][ref4], en
      [artikel 3, eerste lid, onderdeel d][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel424
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0034162#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0034162#Artikel3
