preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de taken van de Stichting Cito Instituut
    voor Toetsontwikkeling en de Stichting Leerplanontwikkeling wettelijk te verankeren en om de middelen voor
    onderwijsonderzoek doelmatiger en effectiever te organiseren en dat het in verband hiermee wenselijk is een nieuwe
    Wet subsidiëring landelijke onderwijsondersteunende activiteiten vast te stellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#ArtikelAanhef
