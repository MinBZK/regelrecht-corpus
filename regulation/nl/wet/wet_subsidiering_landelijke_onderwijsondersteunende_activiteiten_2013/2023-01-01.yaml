        bwb_id: BWBR0034162
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034162
        artikel: '3'
  - number: '8.1'
    text: |-
      Onze Minister stelt jaarlijks het bedrag vast dat ten hoogste beschikbaar is voor de verlening van
      subsidies ten behoeve van de taken, genoemd in [artikel 2, eerste lid, onderdelen a tot en met c][ref1], en
      [artikel 3, eerste lid, onderdelen a tot en met c][ref2]. Hij bepaalt daarbij hoe het beschikbare bedrag of de
      beschikbare bedragen worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034162
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034162
        artikel: '3'
  - number: '8.2'
    text: |-
      Onze Minister kan jaarlijks het bedrag vaststellen dat ten hoogste beschikbaar is voor de activiteiten, genoemd
      in [artikel 2, eerste lid, onderdeel d][ref1], en [artikel 3, eerste lid, onderdeel d][ref2]. Hij kan daarbij
      bepalen hoe het beschikbare bedrag of de beschikbare bedragen worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034162
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034162
        artikel: '3'
  - number: '8.3'
    text: |-
      Onze Minister kan jaarlijks het bedrag vaststellen dat ten hoogste beschikbaar is voor de activiteiten, genoemd in
      [artikel 3a][ref1] en, indien hieraan toepassing is gegeven, [artikel 3b][ref2]. Onze Minister kan daarbij bepalen
      hoe het beschikbare bedrag of de beschikbare bedragen worden verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3b
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034162
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0034162
        artikel: 3b
  - number: '9'
    text: |-
      De voor de taken, genoemd in de [artikelen 2 tot en met 3b][ref1], gebruikte gegevens en de resultaten van die
      taken worden door de instellingen openbaar gemaakt, tenzij bijzondere omstandigheden zich hiertegen verzetten.
      Bij ministeriële regeling en bij de subsidieverlening kan worden bepaald dat openbaarmaking geheel of gedeeltelijk
      achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0034162
        artikel: '2'
  - number: '10.1'
    text: |-
      Tenzij anders overeengekomen werkt de instelling mee aan het overdragen van intellectuele eigendomsrechten ten
      behoeve van Onze Minister ter zake van de taken, genoemd in de [artikelen 2 tot en met 3b][ref1], en doet voor
      zover de [Auteurswet][ref2] dit toestaat, tevens afstand van persoonlijkheidsrechten als bedoeld in de Auteurswet
      die haar of haar personeel toebehoren.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001886
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0034162
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001886
  - number: '10.2'
    text: |-
      Voor zover de taken, genoemd in de [artikelen 2 tot en met 3b][ref1], tot stand komen met gebruikmaking van reeds
      bestaande, niet aan de instelling toekomende intellectuele eigendomsrechten, draagt de instelling zorg voor het
      verlenen van adequate gebruiksrechten aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0034162
        artikel: '2'
  - number: '11.1'
    text: |-
      Met het toezicht op de naleving van de aan de instelling opgelegde verplichtingen zijn belast de bij besluit van
      Onze Minister aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel11
  - number: '11.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel11
  - number: '11.3'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, bedoeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '12.1'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet wettelijke taken internationalisering
      onderwijs aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel12
  - number: '13.1'
    text: |-
      Na de inwerkingtreding van deze wet berust de [Regeling OCW-subsidies][ref1] mede op [artikel 7][ref2] van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028820
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel7
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028820
      - id: ref2
        bwb_id: BWBR0034162
        artikel: '7'
  - number: '13.2'
    text: |-
      De [Wet subsidiëring landelijke onderwijsondersteunende activiteiten][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008725
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008725
  - number: '14'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel14
  - number: '15'
    text: |-
      Deze wet wordt aangehaald als: Wet subsidiëring landelijke onderwijsondersteunende activiteiten, met vermelding van
      het jaartal van het Staatsblad waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel15
