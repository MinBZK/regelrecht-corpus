    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *instelling:* rechtspersoon die op grond van
      [artikel 2][ref1], [3][ref2], [3a][ref3] of [3b][ref4] subsidie ontvangt,
        - *kennisveld:* instellingen waaraan beroepsonderwijs of een opleiding educatie als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref5] wordt verzorgd of geëxamineerd, instellingen en academische ziekenhuizen
      als bedoeld in [artikel 1.2 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6], en de
      Nederlandse organisatie voor wetenschappelijk onderzoek,
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap.


