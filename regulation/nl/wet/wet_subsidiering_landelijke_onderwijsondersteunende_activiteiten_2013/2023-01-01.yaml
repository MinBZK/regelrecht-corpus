  - number: '5'
    text: |-
      Onze Minister maakt eenmaal per twee jaar voor 1 april een Kaderbrief SLOA voor SLO en Cito bekend op het terrein
      van leerplanontwikkeling en de doelen van toetsen en examens. De Kaderbrief SLOA voor SLO en Cito heeft betrekking
      op de twee kalenderjaren die volgen op het jaar waarin de brief bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel5
  - number: 5a.1
    text: |-
      Onze Minister maakt eenmaal per twee jaar voor 1 april een Kaderbrief SLOA internationalisering bekend op het
      terrein van de taken, genoemd in de [artikelen 3a][ref1] en, indien hieraan toepassing is gegeven, [3b][ref2]. Deze
      Kaderbrief heeft betrekking op de twee kalenderjaren die volgen op het jaar waarin de brief bekend wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3b
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel5a
