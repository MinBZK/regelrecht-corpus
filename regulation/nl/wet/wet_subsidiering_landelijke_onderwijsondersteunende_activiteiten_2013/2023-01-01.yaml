  - number: 3a.1
    text: |-
      Stichting Nuffic is het nationaal informatiecentrum, bedoeld in artikel IX.2, eerste lid, van het Verdrag inzake
      de erkenning van kwalificaties betreffende hoger onderwijs in de Europese regio (Trb. 2002,137), is belast met
      de taken, bedoeld in artikel IX.2, tweede lid, van dit verdrag en is daarmee lid van het Europese Netwerk van
      nationale informatiecentra voor academische mobiliteit en erkenning, bedoeld in artikel X.3 van dit verdrag.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Stichting Nuffic is het kennis- en expertisecentrum op het gebied van internationalisering van het onderwijs en is
      belast met de volgende taken:
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3a
  - number: 3a.2.a
    text: |-
      het desgevraagd verstrekken van advies over de waarde en authenticiteit van een in een ander land dan Nederland
      behaald diploma of opleidingsdocument
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3a
  - number: 3a.2.a.1°
    text: |-
      aan het instellingsbestuur in het kader van de inschrijving van een student of aspirant-student, bedoeld in
      [hoofdstuk 7, titel 2, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


