  - number: 3a.4
    text: |-
      Onze Minister kan Stichting Nuffic aanwijzingen van algemene aard geven met betrekking tot de uitoefening van de
      taken, genoemd in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3a
  - number: 3a.5
    text: |-
      Indien Stichting Nuffic naar het oordeel van Onze Minister de taken, bedoeld het eerste en tweede lid, ernstig
      verwaarloost, en de door Onze Minister hierover gegeven aanwijzingen niet opvolgt, kan Onze Minister de
      noodzakelijke voorzieningen treffen. De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder
      getroffen dan nadat Stichting Nuffic in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog de taken, genoemd het eerste en tweede lid, naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3a
  - number: 3a.6
    text: |-
      Onze Minister stelt de beide Kamers der Staten-Generaal onverwijld in kennis van de getroffen voorzieningen bedoeld
      in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3a
  - number: 3b.1
    text: |-
      Onze Minister kan een rechtspersoon aanwijzen die tot taak heeft het kennisveld te informeren over het beleid van
      de Europese Unie op het gebied van onderwijs, onderzoek en innovatie en de mogelijkheden die dit beleid biedt.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: 3b.2
    text: 'Onze Minister kan de aanwijzing, bedoeld in het eerste lid, in ieder geval intrekken, indien de rechtspersoon:'
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: 3b.2.a
    text: naar het oordeel van Onze Minister zijn taak niet langer naar behoren uitoefent;
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: 3b.2.b
    text: niet voldoet aan hetgeen bij of krachtens de Comptabiliteitswet 2016 is bepaald;
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: 3b.2.c
    text: niet voldoet aan de in de aanwijzing gestelde eisen met betrekking tot toezicht en verantwoording; of
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: 3b.2.d
    text: het overleg, bedoeld in het derde lid, niet in voldoende mate pleegt.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: 3b.3
    text: |-
      De rechtspersoon pleegt over de uitoefening van haar taak geregeld overleg met de vertegenwoordigers van het
      kennisveld.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: 3b.4
    text: |-
      Onze Minister kan de rechtspersoon, bedoeld in het eerste lid, subsidie verstrekken voor de taken, genoemd in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel3b
  - number: '4'
    text: |-
