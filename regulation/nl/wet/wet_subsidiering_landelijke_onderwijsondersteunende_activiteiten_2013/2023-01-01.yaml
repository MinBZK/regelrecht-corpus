        artikel: '4'
  - number: 7.1.j
    text: andere criteria voor de verstrekking van subsidie.
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel7
  - number: '7.2'
    text: 'Bij de regels, bedoeld in het eerste lid, wordt voor zover nodig onderscheid gemaakt tussen subsidie voor:'
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel7
  - number: 7.2.a
    text: |-
      de taken, genoemd in [artikel 2, eerste lid, onderdelen a tot en met c][ref1],
      [artikel 3, eerste lid, onderdelen a tot en met c][ref2], [artikel 3a][ref3] en [3b][ref4], en


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0034162#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0034162#Artikel3b
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0034162
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0034162
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0034162
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0034162
        artikel: 3b
  - number: 7.2.b
    text: |-
      de taken, genoemd in [artikel 2, eerste lid, onderdeel d][ref1], en [artikel 3, eerste lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034162#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034162#Artikel3
    url: https://wetten.overheid.nl/BWBR0034162/2023-01-01#Artikel7
    references:
