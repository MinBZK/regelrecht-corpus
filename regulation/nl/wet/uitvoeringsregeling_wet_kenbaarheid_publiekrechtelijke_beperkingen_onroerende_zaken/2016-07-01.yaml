  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder wet: [Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016876
    url: https://wetten.overheid.nl/BWBR0022131/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016876
  - number: '2'
    text: |-
      De ingevolge [artikel 6 van de wet][ref1] in de gemeentelijke beperkingenregistratie op te nemen soorten gegevens,
      zijn vervat in [bijlage I][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022131
    url: https://wetten.overheid.nl/BWBR0022131/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0022131
  - number: '3'
    text: |-
      Het berichtenverkeer met de landelijke voorziening, bedoeld in [artikel 10, eerste lid, van de wet][ref1], vindt
      plaats overeenkomstig de in [bijlage II][ref2] bij deze regeling gegeven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022131
    url: https://wetten.overheid.nl/BWBR0022131/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0022131
  - number: '4'
    text: |-
      Voor zover in de [bijlagen I][ref1] en [II][ref2] bij deze regeling ten aanzien van producten technische
      voorschriften zijn gesteld als bedoeld in de [richtlijn nr. 98/34/EG](31998L0034) van het Europees Parlement
      en de Raad van de Europese Unie van 22 juni 1998 betreffende een informatieprocedure op het gebied van normen
      en technische voorschriften en regels betreffende de diensten van de informatiemaatschappij (PbEG L 204), zoals
      gewijzigd bij [richtlijn nr. 98/48/EG](31998L0048) van 20 juli 1998 (PbEG L 217), worden met die producten
      gelijkgesteld producten die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat
      van de Europese Unie dan wel rechtmatig zijn vervaardigd of in de handel zijn gebracht in een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat
      Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het
      niveau dat met die technische voorschriften wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0022131
      [ref2]: https://wetten.overheid.nl/BWBR0022131
    url: https://wetten.overheid.nl/BWBR0022131/2016-07-01#Artikel4
    references:
