preamble:
  text: >-
    gelet op artikel 71 van het Algemeen Rijksambtenarenreglement en artikel 46a van het Arbeidsovereenkomstenbesluit:


    Besluit:
  url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      a. *Ambtenaar:* degene op wie [artikel 71a van het Algemeen Rijksambtenarenreglement][ref1];

      b. *Bevoegd gezag:* de betrokken minister of de door deze als zodanig aangewezen functionaris;

      c. *Beoordelingsautoriteit:* de door het bevoegd gezag als zodanig aangewezen functionaris;

      d. *Functievervulling:* het totaal van prestaties en gedragingen van de ambtenaar tijdens de uitoefening van zijn
      functie;

      e. *Functiebestanddeel:* samenstel van werkzaamheden dat naar aard en/of gerichtheid een te onderscheiden eenheid
      in de functie vormt;

      f. *Algemeen gezichtspunt:* aspect van het arbeidsgedrag van belang voor het oordeel over de functievervulling en
      toepasbaar op een veelheid van functies;

      g. *Beoordeling:* oordeel over de functievervulling door de ambtenaar dat volgens de voorschriften van dit besluit
      tot stand komt;

      h. *Beoordelaar:* functionaris die door de beoordelingsautoriteit is aangewezen om de beoordeling op te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71a
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 71a
  - number: '2'
    text: >-
      1 Een beoordeling wordt opgemaakt over een tijdvak dat tenminste zes maanden en ten hoogste twee jaar omvat.


      2 Het beoordelingstijdvak strekt zich niet uit over een periode waarover reeds een beoordeling is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel2
  - number: '3'
    text: >-
      1 Aanwijzing als beoordelaar geschiedt op grond van (mede-)verantwoordelijkheid voor het functioneren van de te
      beoordelen ambtenaar.


      2 In de regel wordt meer dan één beoordelaar aangewezen. In elk geval wordt als zodanig aangewezen de directe
      hiërarchische chef van de betrokken ambtenaar.


      3 Het bevoegd gezag of de beoordelingsautoriteit kan bepalen dat bepaalde functionarissen als informant of adviseur
      ten behoeve van de beoordelaars optreden.


      4 Op verzoek van de te beoordelen ambtenaar om bepaalde functionarissen als adviseur of als informant aan te wijzen
      beslist de beoordelingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel3
  - number: '4'
    text: Het bevoegd gezag stelt het model vast van de lijst, waarop de beoordeling wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel4
  - number: '5'
    text: >-
      1 Een beoordeling wordt opgemaakt ten aanzien van functie-bestanddelen en/of algemene gezichtspunten.


      2 Het opmaken van de beoordeling geschiedt met inachtneming van de door of vanwege het bevoegd gezag opgedragen
      werkzaamheden en de daaraan verbonden eisen. Eisen waarvan de ambtenaar buiten zijn schuld geen kennis droeg,
      blijven daarbij buiten beschouwing.


      3 Indien de feitelijke verrichte werkzaamheden afwijken van die welke in het tweede lid zijn bedoeld, worden die op
      de beoordelingslijst vermeld.
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel5
  - number: '6'
    text: >-
      1 De beoordeling wordt zo spoedig mogelijk nadat die is opgemaakt ter kennis van de beoordelingsautoriteit
      gebracht.


      2 De beoordelingsautoriteit gaat na of hij zich op grond van eigen wetenschap met de beoordeling kan verenigen. Hij
      kan wijziging in de beoordeling brengen na overleg met de beoordelaar(s).


      3 De beoordelingsautoriteit beslist na overleg met de beoordelaars over de punten, waarop dezen geen
      overeenstemming hebben bereikt.


      4 De beoordeling wordt zo spoedig mogelijk nadat zij van de beoordelingsautoriteit is terug ontvangen door de
      beoordelaar(s) met de ambtenaar besproken. De beoordelingsautoriteit kan bepalen dat behalve de beoordelaar(s)
      andere personen aan het gesprek deelnemen.


      5 Een samenvatting van het beoordelingsgesprek wordt op de beoordelingslijst vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel6
  - number: '7'
    text: >-
      1 De ambtenaar kan binnen twee weken na het beoordelingsgesprek schriftelijk bedenkingen tegen de beoordeling
      indienen bij de beoordelingsautoriteit. De beoordelingsautoriteit kan de genoemde termijn verlengen.


      2 De beoordelingsautoriteit stelt namens het bevoegd gezag de beoordeling vast, wanneer de ambtenaar geen
      bedenkingen heeft ingediend binnen de in het eerste lid bedoelde termijn.


      3 De ambtenaar die bedenkingen heeft ingediend, wordt in de gelegenheid gesteld deze mondeling bij de
      beoordelingsautoriteit toe te lichten. Deze kan bepalen dat andere personen bij dit gesprek aanwezig zijn.


      4 De beoordelingsautoriteit wijzigt de beoordeling in zover hij de bedenkingen van de ambtenaar deelt en stelt de
      beoordeling namens het bevoegd gezag vast.


      5 Bij de vaststelling van de beoordeling deelt de beoordelingsautoriteit de ambtenaar schriftelijk mee of hij
      wijzigingen in de beoordeling heeft aangebracht, en, zo ja, welke. Daarbij vermeldt hij in voorkomend geval de
      redenen waarom hij niet of niet volledig aan de bedenkingen is tegemoet gekomen.
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel7
  - number: '8'
    text: |-
      1 De ambtenaar kan bezwaar maken tegen de vastgestelde beoordeling.

      2 Indien de ambtenaar bezwaar heeft gemaakt tegen de vastgestelde beoordeling, wint het bevoegd gezag alvorens
      hierop te beslissen, het advies in van een commissie, tenzij het bezwaar reeds aanstonds gegrond wordt geacht.

      3 Indien het bevoegd gezag niet onder toepassing van [artikel 7:13 van de Algemene wet bestuursrecht][ref1] een
      adviescommissie heeft belast met het adviseren omtrent bezwaren tegen vastgestelde beoordelingen, stelt het daartoe
      een commissie in; van de commissie maakt in elk geval deel uit een ambtenaar aangewezen door de tot de Centrale
      Commissie voor Georganiseerd Overleg in Ambtenarenzaken toegelaten centrales van verenigingen van ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel713
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel8
    references:
