        artikel: 7:13
  - number: '9'
    text: Dit besluit treedt in werking op een nader door het bevoegd gezag te bepalen datum, doch uiterlijk 1 juli 1986.
    url: https://wetten.overheid.nl/BWBR0003782/2002-02-02#Artikel9
