        artikel: '6'
  - number: '4.2'
    text: 'De Informatie Beheer Groep weigert registratie in het register uitsluitend, indien:'
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel4
  - number: 4.2.a
    text: |-
      de in het eerste lid bedoelde gegevens niet uiterlijk 1 juni van het desbetreffende jaar door de Informatie Beheer
      Groep zijn ontvangen, dan wel
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel4
  - number: 4.2.b
    text: |-
      deze uiterlijk op genoemde datum ontvangen gegevens naar het oordeel van de Informatie Beheer Groep niet volledig
      zijn en vervolgens niet binnen een door de Informatie Beheer Groep te bepalen termijn is voorzien in de ontbrekende
      gegevens.
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel4
  - number: '4.3'
    text: |-
      [Artikel 6.14, vijfde lid, eerste volzin, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel4
