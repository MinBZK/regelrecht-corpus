  - number: '5'
    text: |-
      De Informatie Beheer Groep maakt de uit [artikel 4][ref1] voortvloeiende wijzigingen in het register bekend voor 1
      juli van het desbetreffende jaar. Van deze bekendmaking wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0010415#Artikel4
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel5
    references:
