        bwb_id: BWBR0010415
        artikel: '4'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      Indien een opleiding waarvoor met het oog op een bepaald studiejaar een besluit op grond van [artikel 2 ][ref1]is
      genomen, in het register is geregistreerd, worden met ingang van dat studiejaar geen studenten en extraneï voor de
      eerste maal meer ingeschreven voor de opleiding of voor de opleidingen waarvoor de nieuw ingestelde opleiding in de
      plaats komt.


      [ref1]: https://wetten.overheid.nl/BWBR0010415#Artikel2
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel6
