preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is uitvoering te geven aan het in het hoger onderwijs- en
    onderzoekplan 1998 aangekondigde voornemen om opleidingen in het wetenschappelijk onderwijs op het gebied van de
    natuur en de opleidingen biologie en moleculaire wetenschappen verbonden aan de openbare universiteit te Wageningen
    inhoudelijk te vernieuwen; dat in verband hiermee een regeling wordt getroffen, op grond waarvan de periode waarin
    studenten aan deze opleidingen aanspraak op studiefinanciering hebben, met een jaar kan worden verlengd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#ArtikelAanhef
