  - number: '2.1'
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen kan op aanvraag van het instellingsbestuur in de jaren
      1999, 2000 en 2001 toestaan dat een opleiding op het gebied van de natuur met een studielast van 210 studiepunten
      wordt ingesteld. Onze Minister van Economische Zaken kan op aanvraag van het instellingsbestuur van de openbare
      universiteit te Wageningen in dezelfde jaren toestaan dat de de opleiding biologie en de opleiding moleculaire
      wetenschappen, elk met een studielast van 210 studiepunten, worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: '2.2'
    text: |-
      Het instellingsbestuur dient een aanvraag in bij Onze minister, wie het aangaat, ten behoeve van het studiejaar
      1999–2000 voor 1 mei 1999, ten behoeve van het studiejaar 2000–2001 voor 1 april 2000 dan wel ten behoeve van het
      studiejaar 2001–2002 voor 1 april 2001. Het instellingsbestuur toont daarin ten genoegen van Onze minister aan dat:
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.2.a
    text: de desbetreffende opleiding in een maatschappelijke behoefte voorziet,
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.2.b
    text: |-
      de inhoud van de desbetreffende opleiding ten opzichte van een of meer opleidingen op het gebied van de natuur
      dan wel de opleidingen biologie of moleculaire wetenschappen waarvan de studielast ten minste 168 studiepunten
      bedraagt, in belangrijke mate is vernieuwd en verbreed,
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.2.c
    text: |-
      het onderwijsprogramma van de desbetreffende opleiding zodanig is ingericht dat de daarvoor ingeschreven studenten
      bij een redelijke inspanning de opleiding binnen een redelijke studietijd kunnen voltooien, en
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.2.d
    text: de desbetreffende opleiding omvat
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.2.d.1°
    text: |-
      een afstudeerrichting gericht op de verkrijging van vaardigheden als wetenschappelijk onderzoeker of technologisch
      ontwerper,
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.2.d.2°
    text: |-
      in een voorkomend geval een afstudeerrichting gericht op het beroep van leraar voortgezet onderwijs van de eerste
      graad in een of meer met die opleiding verwante vakken in het voortgezet onderwijs, en
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.2.d.3°
    text: een of meer andere afstudeerrichtingen.
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: '2.3'
    text: |-
      [Artikel 6.3, tweede lid, van de wet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '2.4'
    text: 'Voor de toepassing van dit artikel wordt onder opleiding op het gebied van de natuur tevens verstaan:'
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.4.a
    text: de opleiding biomedische wetenschappen, verbonden aan de openbare universiteit te Leiden,
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.4.b
    text: de opleiding medische biologie, verbonden aan de openbare universiteit te Utrecht, en
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: 2.4.c
    text: de opleiding biomedische gezondheidswetenschappen, verbonden aan de bijzondere universiteit te Nijmegen.
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel2
  - number: '3'
    text: |-
      Indien de uitspraak op een beroep tegen een besluit van Onze Minister als bedoeld in [artikel 2, eerste lid][ref1],
      strekt tot toestemming als bedoeld in dat lid, treden de gevolgen daarvan in met ingang van het studiejaar dat
      aanvangt na het studiejaar waarin de uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010415#Artikel2
    url: https://wetten.overheid.nl/BWBR0010415/2013-07-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010415
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.1'
    text: |-
      In afwijking van [artikel 6.14, eerste lid, van de wet][ref1] en in afwijking van de termijnbepalingen, bedoeld
      in de [artikelen 6.13, tweede lid, derde volzin][ref2], en [6.14, tweede lid, eerste volzin, van de wet][ref3]
      registreert de Informatie Beheer Groep de in de ministeriële regeling, bedoeld in
      [artikel 7.4, negende lid, van de wet][ref4] opgenomen opleidingen in het register dat betrekking heeft op een van
      de studiejaren 1999–2000, 2000–2001 of 2001–2002, in het gedeelte Wetenschappelijk onderwijs, onderdeel Landbouw en
      natuurlijke omgeving, onderdeel Natuur of onderdeel Gezondheidszorg. [Artikel 6.13, vierde lid, van de wet][ref5]
      is van overeenkomstige toepassing. De registratie geschiedt overeenkomstig de door het instellingsbestuur
      verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
