$id: belemmeringenwet_verordeningen
regulatory_layer: WET
publication_date: '2012-06-05'
valid_from: '2006-03-08'
bwb_id: BWBR0001865
url: https://wetten.overheid.nl/BWBR0001865/2006-03-08
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen tot opheffing van belemmeringen
    bij de uitvoering van werken in het openbaar belang bevolen of ondernomen, uit bepalingen van verordeningen
    voortspruitende;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Wanneer ter uitvoering van openbare werken, die door het Rijk of eene provincie worden ondernomen, die door Ons,
      Onze Minister die het aangaat of door Provinciale Staten onderscheidenlijk Gedeputeerde Staten krachtens de wet
      worden bevolen, die ingevolge eene door Ons of van Onzentwege verleende concessie worden tot stand gebracht en
      waarvan het openbaar belang door Ons is erkend, of waarvan het algemeen nut uitdrukkelijk bij de wet is erkend,
      een werk of eene handeling noodig is in strijd met de bepaling eener gemeente-, waterschaps-, veenschaps- of
      veenpolderverordening, dan wordt voor dat geval door het bestuur, dat de verordening vaststelde, op aanvrage van
      den belanghebbende, van die bepaling ontheffing verleend.
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel1
  - number: '1.2'
    text: |-
      Aan die ontheffing kunnen geen andere voorwaarden worden verbonden, dan die welke op grond van die ontheffing in
      het belang van de gemeente, het waterschap, het veenschap of den veenpolder moeten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel1
  - number: '2.1'
    text: |-
      Wordt voor eenig werk of eenige handeling, in [art. 1][ref1] bedoeld, bij eene gemeente-, waterschaps-, veenschaps-
      of veenpolderverordening de vergunning van eenig bestuur gevorderd, dan wordt die door dat bestuur verleend en
      zulks onder geen andere voorwaarden dan die, welke op grond van die vergunning in het belang van de gemeente, het
      waterschap, het veenschap of den veenpolder moeten worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001865#Artikel1
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001865
        artikel: '1'
  - number: '2.2'
    text: |-
      Onder vergunning wordt in dit en de volgende artikelen mede begrepen de volgens eenige bepaling der verordening als
      ontheffing, dispensatie, afwijking, uitzondering of onder andere benaming van dien aard te nemen beschikking.
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel2
  - number: '3'
    text: |-
      Weigert het in de artt. 1 en 2 aangewezen bestuur de ontheffing of de vergunning te verleenen, blijft het in
      gebreke op de aanvrage daartoe van den belanghebbende te beslissen binnen een termijn, op diens verzoek te
      stellen door Gedeputeerde Staten van de provincie, waarin het werk of de handeling moet worden verricht, of
      stelt het voorwaarden in strijd met de voorgaande artikelen, dan kunnen Gedeputeerde Staten op aanvrage van den
      belanghebbende de verlangde ontheffing of vergunning, zoo noodig onder voorwaarden overeenkomstig de voorgaande
      artikelen, verleenen.
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel3
  - number: '5'
    text: |-
      De voorgaande artikelen zijn mede van toepassing wanneer ten behoeve van een werk of handeling ontheffing van de
      bepaling van een gemeente- of waterschapsverordening, of een daarbij gevorderde vergunning nodig is ter uitvoering
      van een openbaar werk dat door de raad onderscheidenlijk het college van burgemeester en wethouders van een
      gemeente of door het bestuur van een waterschap is bevolen en waarvan het openbaar belang door Ons is erkend.
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel5
  - number: '6'
    text: |-
      Strijdt het werk of de handeling, in [art. 1][ref1] of in [art. 5][ref2] bedoeld, met de bepaling eener provinciale
      verordening, dan wordt de ontheffing door de Gedeputeerde Staten verleend en zulks onder geen andere voorwaarden
      dan die welke op grond van die ontheffing in het provinciaal belang moeten worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001865#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001865#Artikel5
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001865
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001865
        artikel: '5'
  - number: '7'
    text: |-
      Wordt voor dat werk of die handeling krachtens eene provinciale verordening de vergunning of de goedkeuring eener
      vergunning van eenig bestuur, in [art. 2][ref1] bedoeld, van de Provinciale Staten of van Gedeputeerde Staten
      gevorderd, dan wordt die door hen verleend, en zulks onder geen andere voorwaarden dan die, welke op grond van die
      vergunning of goedkeuring in het belang van de gemeente, het waterschap, het veenschap of den veenpolder of in het
      provinciaal belang moeten worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001865#Artikel2
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001865
        artikel: '2'
  - number: '8.1'
    text: |-
      Weigeren de Staten of Gedeputeerde Staten de ontheffing, de vergunning of de goedkeuring te verlenen, of blijven
      zij in gebreke op de aanvraag daartoe binnen een bij koninklijk besluit te bepalen termijn te besluiten, of
      stellen zij voorwaarden in strijd met de [artikelen 6][ref1] en [7][ref2], dan kan de ontheffing, vergunning
      of goedkeuring bij koninklijk besluit, de Raad van State gehoord, zo nodig onder voorwaarden als bedoeld in die
      artikelen, worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001865#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001865#Artikel7
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001865
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001865
        artikel: '7'
  - number: '8.2'
    text: Het daartoe betrekkelijk besluit wordt in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel8
  - number: '8.3'
    text: |-
      Wanneer volgens de provinciale verordening niet de Staten of de Gedeputeerde Staten, maar eenig bestuur, in
      [art. 2][ref1] bedoeld, de verlangde vergunning heeft te verleenen, dan zijn in dezelfde gevallen de bepalingen van
      artt. 3 en 4 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001865#Artikel2
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001865
        artikel: '2'
  - number: '9'
    text: Deze wet kan worden aangehaald onder den naam "Belemmeringenwet Verordeningen".
    url: https://wetten.overheid.nl/BWBR0001865/2006-03-08#Artikel9
