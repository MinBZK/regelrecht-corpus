  text: |-
    Gelet op de artikelen 2, eerste lid, aanhef en onderdeel a, en 3 van de Kaderwet EZK- en LNV-subsidies en
    artikel 77, tweede lid, onderdeel e, van de Elektriciteitswet 1998;

    Besluit:
