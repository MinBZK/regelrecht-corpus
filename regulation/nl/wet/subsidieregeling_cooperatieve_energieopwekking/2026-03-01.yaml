  - number: '2.1'
    text: |-
      De minister kan op aanvraag subsidie verstrekken voor de productie van hernieuwbare elektriciteit met een
      productie-installatie aan:
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel2
  - number: 2.1.a
    text: een coöperatie die zich richt of mede richt op het opwekken van hernieuwbare energie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel2
  - number: 2.1.b
    text: een vereniging van eigenaars; of
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel2
  - number: 2.1.c
    text: |-
      een coöperatie die zich richt of mede richt op het opwekken van hernieuwbare energie gezamenlijk met een besloten
      vennootschap met beperkte aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel2
  - number: '2.2'
    text: |-
      Met het verstrekken van de subsidie wordt gedurende vijftien jaar het verschil tussen de gemiddelde kostprijs van
      deze hernieuwbare elektriciteit en de relevante gemiddelde marktprijs van elektriciteit geheel of gedeeltelijk
      gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel2
  - number: '2.3'
    text: |-
      De subsidie wordt uitsluitend verstrekt indien de minister de mogelijkheid tot het doen van een aanvraag
      tot subsidieverlening heeft opengesteld voor daarbij aan te wijzen categorieën productie-installaties, door
      vaststelling van een subsidieplafond en een periode voor indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel2
  - number: '2.4'
    text: |-
      De besloten vennootschap met beperkte aansprakelijkheid, bedoeld in het eerste lid, onderdeel c, heeft als enkel
      statutair doel het realiseren en exploiteren van een specifieke productie-installatie ten behoeve van de coöperatie
      waarmee de aanvraag wordt ingediend, waarbij het volledige eigendom van en de volledige zeggenschap over deze
      besloten vennootschap rust bij de coöperatie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel2
  - number: '3.1'
    text: 'Voor het bepalen van de subsidie wordt met elkaar vermenigvuldigd:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
  - number: 3.1.a
    text: |-
      het aantal kWh dat in elk kalenderjaar voor subsidie in aanmerking komt en waarvoor garanties van oorsprong voor
      netlevering zijn verstrekt die aantonen dat met de productie-installatie in het betreffende kalenderjaar dat aantal
      kWh is geproduceerd en op het elektriciteitsnet is ingevoed; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
  - number: 3.1.b
    text: |-
      het verschil tussen het in de beschikking tot subsidieverlening opgenomen basisbedrag en het voor het betreffende
      kalenderjaar op basis van [artikel 6][ref1] geldende definitieve correctiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel6
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '6'
        paragraaf: '3'
  - number: '3.2'
    text: |-
      De subsidie bedraagt de som van de voor ieder kalenderjaar volgens het eerste lid berekende bedragen over de hele
      subsidieperiode.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
  - number: '3.3'
    text: 'Indien de productie-installatie is aangesloten op het elektriciteitsnet met een grootverbruikersinstallatie:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
  - number: 3.3.a
    text: |-
      wordt bij het aantal kWh, bedoeld in het eerste lid, onderdeel a, opgeteld het aantal kWh dat in elk kalenderjaar
      voor subsidie in aanmerking komt en waarvoor garanties van oorsprong voor niet-netlevering zijn verstrekt die
      aantonen dat met de productie-installatie in het betreffende kalenderjaar dat aantal kWh is geproduceerd en op een
      installatie is ingevoed; en,
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
  - number: 3.3.b
    text: |-
      wordt, voor zover het een beschikking betreft op een aanvraag om subsidieverlening die op of na 2 april 2024 is
      ingediend, het aantal kWh dat in elk jaar voor subsidie in aanmerking komt, bedoeld in het eerste lid, onderdeel a,
      verminderd met het aantal kWh dat is ingevoed op een elektriciteitsnet gedurende elke periode waarin de waarde van
      elektriciteit negatief is.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
  - number: '3.4'
    text: Indien de uitkomst van de berekening, bedoeld in het eerste lid, onderdeel b, negatief is, bedraagt het bedrag nul.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel3
  - number: '4.1'
    text: |-
      Het aantal kWh dat jaarlijks voor subsidie in aanmerking komt, bedoeld in
      [artikel 3, eerste lid, onderdeel a, en derde lid][ref1], bedraagt ten hoogste het in de beschikking tot
      subsidieverlening voor een kalenderjaar vastgestelde maximum aantal kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel3
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '3'
        paragraaf: '3'
  - number: '4.2'
    text: |-
      Het maximum aantal kWh is gebaseerd op het vermogen van de productie-installatie en het voor die categorie
      productie-installaties geldende maximum aantal vollasturen.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel4
  - number: '4.3'
    text: |-
      Voor het berekenen van het maximum aantal kWh stelt de minister per aan te wijzen categorie productie-installaties
      een maximum aantal vollasturen vast.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel4
  - number: '5.1'
    text: De minister stelt per aan te wijzen categorie productie-installaties een basisbedrag per kWh vast.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel5
  - number: '5.2'
    text: |-
      Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per kWh voor het produceren van hernieuwbare
      elektriciteit per categorie productie-installaties.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel5
  - number: '5.3'
    text: Het basisbedrag dat geldt op het moment van aanvraag van de subsidie, geldt gedurende de hele subsidieperiode.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel5
  - number: '6.1'
    text: 'Het definitieve correctiebedrag bedraagt de som van:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel6
  - number: 6.1.a
    text: |-
      de elektriciteitsprijs voor elektriciteit die wordt ingevoed op het elektriciteitsnet of de elektriciteitsprijs
      voor elektriciteit die niet wordt ingevoed op het elektriciteitsnet;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel6
  - number: 6.1.b
    text: de waarde van garanties van oorsprong; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel6
  - number: 6.1.c
    text: |-
      andere correcties die een substantiële invloed hebben op het verschil tussen de gemiddelde kostprijs van
      hernieuwbare elektriciteit en de relevante gemiddelde marktprijs van elektriciteit en die voortvloeien uit
      maatregelen van de overheid.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel6
  - number: '6.2'
    text: |-
      De minister stelt jaarlijks voor 1 april per categorie productie-installaties het definitieve correctiebedrag voor
      het voorgaande kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel6
  - number: '6.3'
    text: |-
      Indien de productie-installatie is aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting, geldt
      voor het aantal kWh dat niet op een elektriciteitsnet is ingevoed, bij toepassing van het eerste lid, onderdeel a,
      de elektriciteitsprijs voor elektriciteit die niet op het elektriciteitsnet is ingevoed.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel6
  - number: '7'
    text: |-
      De elektriciteitsprijs, bedoeld in [artikel 6, eerste lid, onderdeel a][ref1], bedraagt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel6
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '6'
        paragraaf: '3'
  - number: 7.a
    text: |-
      elektriciteit die wordt ingevoed op het elektriciteitsnet: de gemiddelde waarde van elektriciteit die wordt
      ingevoed op het elektriciteitsnet die kan worden gecorrigeerd voor elke periode waarin de waarde voor elektriciteit
      negatief is, minus de profielkosten van elektriciteitslevering aan het elektriciteitsnet;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel7
  - number: 7.b
    text: |-
      elektriciteit die niet wordt ingevoed op het elektriciteitsnet: de gemiddelde waarde van elektriciteit die niet
      wordt ingevoed op het elektriciteitsnet.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de elektriciteitsprijs voor elektriciteit die wordt ingevoed op het elektriciteitsnet lager is dan de
      basiselektriciteitsprijs wordt in afwijking van [artikel 6, eerste lid, onderdeel a][ref1], in plaats van met de
      elektriciteitsprijs gerekend met die basiselektriciteitsprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel6
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '6'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Indien de elektriciteitsprijs voor elektriciteit die niet wordt ingevoed op het elektriciteitsnet lager is dan de
      basiselektriciteitsprijs wordt in afwijking van [artikel 6, eerste lid, onderdeel a][ref1], in plaats van met de
      elektriciteitsprijs gerekend met die basiselektriciteitsprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel6
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '6'
        paragraaf: '3'
  - number: '8.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid, en voor de vaststelling van het bedrag dat de subsidie ten hoogste
      bedraagt, bedoeld in [artikel 11][ref1], stelt de minister per aan te wijzen categorie productie-installaties een
      basiselektriciteitsprijs voor elektriciteit vast die kan verschillen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel11
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '11'
        paragraaf: '3'
  - number: 8.3.a
    text: elektriciteit die wordt ingevoed op het elektriciteitsnet; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
  - number: 8.3.b
    text: elektriciteit die niet wordt ingevoed op het elektriciteitsnet.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
  - number: '8.4'
    text: 'De basiselektriciteitsprijs bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
  - number: 8.4.a
    text: |-
      elektriciteit die wordt ingevoed op het elektriciteitsnet: tweederde van de lange termijn elektriciteitsprijs voor
      elektriciteit die wordt ingevoed op het elektriciteitsnet;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
  - number: 8.4.b
    text: |-
      elektriciteit die niet wordt ingevoed op het elektriciteitsnet: tweederde van de lange termijn elektriciteitsprijs
      voor elektriciteit die niet wordt ingevoed op het elektriciteitsnet.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
  - number: '8.5'
    text: |-
      De basiselektriciteitsprijs voor elektriciteit die wordt ingevoed op het elektriciteitsnet en de
      basiselektriciteitsprijs voor elektriciteit die niet wordt ingevoed op het elektriciteitsnet die gelden op het
      moment van aanvraag van de subsidie, gelden gedurende de hele subsidieperiode.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel8
  - number: '9.1'
    text: |-
      Voor de voorschotverlening stelt de minister jaarlijks voor 1 november een voorlopig correctiebedrag per categorie
      productie-installaties vast voor het daaropvolgende kalenderjaar, waarbij:
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel9
  - number: 9.1.a
    text: 'voor elektriciteit die wordt ingevoed op het elektriciteitsnet:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel9
  - number: 9.1.a.1°
    text: |-
      als elektriciteitsprijs wordt gehanteerd: de gemiddelde waarde van elektriciteit die wordt ingevoed op het
      elektriciteitsnet in de periode 1 september tot en met 31 augustus voorafgaand aan het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel9
  - number: 9.1.a.2°
    text: |-
      als profielkosten van elektriciteitslevering aan het elektriciteitsnet worden gehanteerd: de profielkosten die zijn
      vastgesteld in het voorgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel9
  - number: 9.1.b
    text: |-
      voor elektriciteit die niet wordt ingevoed op het elektriciteitsnet als elektriciteitsprijs wordt gehanteerd: de
      gemiddelde waarde van elektriciteit die niet is ingevoed op het elektriciteitsnet in de periode 1 september tot en
      met 31 augustus voorafgaand aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel9
  - number: '9.2'
    text: |-
      Voor de voorschotverlening stelt de minister, in afwijking van het eerste lid, een voorlopig correctiebedrag vast
      voor de op grond van [artikel 2, derde lid][ref1], aangewezen categorieën productie-installaties, waarmee het
      voorschot voor die categorieën productie-installaties wordt bepaald indien er voor die categorieën productie-
      installaties nog geen voorlopige correctiebedragen op grond van het eerste lid gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel2
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '2'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Indien in een kalenderjaar minder kWh is geproduceerd dan het aantal kWh dat in het betreffende kalenderjaar
      voor subsidie in aanmerking komt, wordt het verschil in kWh opgeteld bij het aantal kWh dat het daaropvolgende
      kalenderjaar voor subsidie in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel10
  - number: '10.2'
    text: |-
      Indien de subsidieperiode start op een andere datum dan 1 januari voor het eerste kalenderjaar waarover subsidie
      wordt verstrekt, bedraagt het aantal kWh dat in het betreffende kalenderjaar voor subsidie in aanmerking komt, bij
      toepassing van het eerste lid, een evenredig deel van het aantal maanden of van het kalenderjaar waarover subsidie
      wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel10
  - number: '10.3'
    text: |-
      Indien in een kalenderjaar meer kWh is geproduceerd of uit vorige jaren is overgebracht dan het aantal kWh dat
      het betreffende kalenderjaar voor subsidie in aanmerking komt, waarbij het verschil in kWh dat in een voorgaand
      kalenderjaar minder is geproduceerd ingevolge het eerste en tweede lid al is opgeteld, wordt het verschil in kWh
      opgeteld bij het aantal geproduceerde kWh van het volgende kalenderjaar tot een maximum van 25% van het aantal kWh
      dat in het desbetreffende kalenderjaar voor subsidie in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel10
  - number: '10.4'
    text: |-
      Bij de benutting van de opgetelde kWh, bedoeld in het derde lid, wordt voor een productie-installatie die is
      aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting, de productie van elektriciteit verdeeld
      in een deel elektriciteit dat op het elektriciteitsnet is ingevoed en een deel dat niet op het elektriciteitsnet
      is ingevoed.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel10
  - number: '11.1'
    text: 'Voor het bepalen van het bedrag dat de subsidie ten hoogste bedraagt, worden met elkaar vermenigvuldigd:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel11
  - number: 11.1.a
    text: |-
      het verschil tussen het in de beschikking tot subsidieverlening opgenomen basisbedrag en de in de beschikking tot
      subsidieverlening opgenomen basiselektriciteitsprijs; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel11
  - number: 11.1.b
    text: het in de beschikking tot subsidieverlening voor een kalenderjaar vastgesteld maximum aantal kWh.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel11
  - number: '11.2'
    text: |-
      De subsidie bedraagt ten hoogste de som van de voor ieder kalenderjaar volgens het eerste lid berekende bedragen
      over de hele subsidieperiode, en bedraagt niet meer dan € 30.000.000.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel11
  - number: '12.1'
    text: |-
      De minister verdeelt het in [artikel 2, derde lid][ref1], bedoelde subsidieplafond op volgorde van ontvangst van
      de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel2
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt voor de verdeling de dag waarop de aanvraag voldoet aan de wettelijke voorschriften
      als dag van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '12.3'
    text: |-
      Indien de minister op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt, stelt hij de
      onderlinge rangschikking van die aanvragen vast door loting.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel12
  - number: '12.4'
    text: |-
      Aanvragen die worden ontvangen op werkdagen na 17.00 uur of andere dagen, worden aangemerkt als ontvangen op de
      eerstvolgende werkdag.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel12
  - number: '13.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend bij de minister met gebruikmaking van een middel dat door de minister
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: '13.2'
    text: 'De aanvraag bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: 13.2.a
    text: de naam, het adres, de vestigingsplaats en het rekeningnummer van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: 13.2.b
    text: de postcoderoos;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: 13.2.c
    text: de categorie productie-installaties waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: 13.2.d
    text: de locatie waarop de productie-installatie wordt aangebracht;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: 13.2.e
    text: |-
      de hoeveelheid op te wekken en in te voeden kWh per kalenderjaar van de productie-installatie gedurende de periode
      waarover subsidie wordt aangevraagd; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: 13.2.f
    text: het tijdschema van de ingebruikname van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie met een vermogen van minder dan 1 MWp, waarbij sprake is van plaatsing op daken of bevestiging
      aan gevels, gaat de aanvraag vergezeld van een verklaring van de aanvrager dat het dak of de gevel geschikt
      is of wordt gemaakt voor de plaatsing volgens de normen van het [Besluit bouwwerken leefomgeving][ref1], met
      gebruikmaking van het middel dat door de minister beschikbaar wordt gesteld, tenzij sprake is van een aanvraag als
      bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0041297
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0041297
  - number: '13.4'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie met een vermogen van 1 MWp of meer, waarbij sprake is van plaatsing op daken of bevestiging aan
      gevels, gaat de aanvraag vergezeld van een verklaring van een constructeur over de belastbaarheid van het dak of de
      gevel volgens de normen van het [Besluit bouwwerken leefomgeving][ref1], met gebruikmaking van het middel dat door
      de minister beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041297
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0041297
  - number: '13.5'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie, waarbij het dak van een bestaand gebouw constructief wordt aangepast of een draagconstructie
      wordt toegepast die het dak ontlast en waarbij deze constructieve aanpassing noodzakelijk is voor de realisatie
      van de productie-installatie, dan wel bij het gebruik van het dak van een bestaand gebouw gebruik wordt gemaakt van
      een productie-installatie met een maximaal gewicht van 10 kilogram per vierkante meter bedekt dakoppervlak, wordt
      een verklaring aangeleverd van een constructeur over de belastbaarheid van het dak of de gevel volgens de normen
      van het [Besluit bouwwerken leefomgeving][ref1], met gebruikmaking van het middel dat door de minister beschikbaar
      wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041297
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0041297
  - number: '14.1'
    text: |-
      De aanvraag gaat vergezeld van een verklaring van de aanvrager dat hij ermee instemt dat de informatie over de
      productie-installatie die hij bij de aanvraag heeft verstrekt en de informatie over de productie-installatie die
      in de beschikking tot subsidieverlening is opgenomen, door de minister worden verstrekt aan de door de minister op
      grond van [artikel 2.58, vijfde lid, van de Energiewet][ref1] gemandateerde niet-ondergeschikte.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
  - number: '14.2'
    text: |-
      De aanvraag gaat vergezeld van een verklaring van de aanvrager dat hij ermee instemt
      dat de aan de minister verstrekte meetgegevens, bedoeld in [artikel 5][ref1] of
      [9 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref2], door de minister worden gebruikt
      voor de berekeningen op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel9
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035971
        artikel: '9'
  - number: '14.3'
    text: |-
      Indien de productie-installatie wordt aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting,
      gaat de aanvraag vergezeld van een verklaring van de netbeheerder over de beschikbaarheid van transportcapaciteit
      voor de nauwkeurig omschreven productie-installatie met gebruikmaking van het middel dat door de minister
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel14
  - number: '14.4'
    text: |-
      De verklaring van de netbeheerder is afgegeven niet meer dan een maand voorafgaand aan het indienen van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel14
  - number: '15.1'
    text: |-
      Indien de productie-installatie wordt aangebracht op, in of boven een onroerende zaak van een derde waarvoor een
      recht van opstal als bedoeld in [artikel 28, eerste lid][ref1], nodig is, gaat de aanvraag vergezeld van een
      ondertekende overeenkomst tussen subsidieontvanger en de derde. Uit de overeenkomst blijkt dat wordt beoogd een
      recht van opstal te vestigen als bedoeld in artikel 28, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel28
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '28'
        paragraaf: '5'
  - number: '15.2'
    text: |-
      Indien de productie-installatie wordt aangebracht op, in of boven een onroerende zaak van een derde waarvoor een
      huur- of gebruikersovereenkomst nodig is als bedoeld in [artikel 28, tweede of derde lid][ref1], gaat de aanvraag
      vergezeld van de huur- of gebruikersovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel28
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '28'
        paragraaf: '5'
  - number: '16.1'
    text: |-
      Indien de aanvraag wordt ingediend door een coöperatie, gaat de aanvraag vergezeld van de statuten van de
      coöperatie en een kopie van notariële akte van oprichting.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel16
  - number: '16.2'
    text: |-
      Indien de aanvraag wordt ingediend door een coöperatie gezamenlijk met een besloten vennootschap als bedoeld in
      [artikel 2, eerste lid, onderdeel c][ref1], gaat de aanvraag vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel2
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '2'
        paragraaf: '2'
  - number: 16.2.a
    text: de statuten van de besloten vennootschap en een kopie van notariële akte van oprichting; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel16
  - number: 16.2.b
    text: |-
      een verklaring gezamenlijke aanvraag en gegevens over de contactpersoon middels een door de minister beschikbaar
      gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel16
  - number: '17.1'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
  - number: 17.1.a
    text: de vergunningen die noodzakelijk zijn voor de realisatie van de productie-installatie; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
  - number: 17.1.b
    text: |-
      indien het een productie-installatie betreft die gebruik maakt van windenergie of waterkracht en die op grond van
      de [Omgevingswet][ref1] vergunningplichtig is: de aanvraag van de omgevingsvergunning krachtens de Omgevingswet.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '17.2'
    text: |-
      Voor de uitvoering van het eerste lid worden omgevingsvergunningen voor een omgevingsplanactiviteit als bedoeld in
      de [Omgevingswet][ref1] waaraan een termijn is verbonden als bedoeld in [artikel 5.36 van die wet][ref2] niet in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '17.3'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonlicht uitsluitend door middel van fotovoltaïsche zonnepanelen, die niet op of aan een gebouw zijn
      aangebracht maar op land staan, die natuurinclusief wordt gerealiseerd, zijn in de vergunning die op grond van
      [artikel 5.1, eerste lid, onderdeel a, van de Omgevingswet][ref1] noodzakelijk is voor de realisatie van de
      productie-installatie de volgende voorwaarden opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 17.3.a
    text: er is van bovenaf gezien minimaal 25% open ruimte tussen de tafels met zonnepanelen aanwezig;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
  - number: 17.3.b
    text: |-
      er is een inrichtingsplan en beheerplan dat ten doel heeft om verslechtering van de bodemkwaliteit, waterkwaliteit
      en ecologische kwaliteit te voorkomen, waarbij deze voorwaarden in ieder geval betrekking hebben op de periode
      waarvoor subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
  - number: 17.3.c
    text: |-
      de vergunninghouder monitort de effecten van de productie-installatie op de bodemkwaliteit, waterkwaliteit
      en biodiversiteit en neemt, indien nodig, aanvullende maatregelen om verslechtering van de bodemkwaliteit,
      waterkwaliteit en ecologische kwaliteit te voorkomen, waarbij deze voorwaarden in ieder geval betrekking hebben op
      de periode waarvoor subsidie wordt verleend; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
  - number: 17.3.d
    text: |-
      de vergunninghouder voert een nulmeting uit om de huidige waarde van de bodemkwaliteit, de waterkwaliteit en de
      ecologische kwaliteit vast te stellen.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel17
  - number: '18.1'
    text: De aanvraag gaat vergezeld van een haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel18
  - number: '18.2'
    text: 'De haalbaarheidsstudie bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel18
  - number: 18.2.a
    text: een omschrijving van de productie-installatie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel18
  - number: 18.2.b
    text: een exploitatieberekening;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel18
  - number: 18.2.c
    text: |-
      een financieringsplan, met een uitgesplitste begroting van alle noodzakelijke kosten, voor de productie-
      installatie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel18
  - number: 18.2.d
    text: |-
      indien de aanvraag een productie-installatie betreft die gebruik maakt van zonne-energie: een kaart van de locatie
      van de productie-installatie en indien van toepassing andere, te realiseren of reeds gerealiseerde productie-
      installaties die gebruik maken van zonne-energie, waarop de zonnepanelen zijn ingetekend;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel18
  - number: 18.2.e
    text: |-
      indien de aanvraag een productie-installatie betreft die gebruik maakt van windenergie: een windenergie-
      opbrengstberekening.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel18
  - number: '19.1'
    text: |-
      De exploitatieberekening, bedoeld in [artikel 18, tweede lid, onderdeel b][ref1], omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel18
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '18'
        paragraaf: '4'
  - number: 19.1.a
    text: een specificatie van de investeringskosten van de productie-installatie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel19
  - number: 19.1.b
    text: een overzicht van de kosten en baten van de productie-installatie; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel19
  - number: 19.1.c
    text: een berekening van het projectrendement over de hele subsidieperiode.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel19
  - number: '20.1'
    text: |-
      Indien de productie-installatie die gebruik maakt van windenergie een vermogen heeft van meer dan 100 kW, is de
      windenergie-opbrengstberekening, bedoeld in het [artikel 18, eerste lid, onderdeel e][ref1], opgesteld door een
      organisatie met expertise op het gebied van windenergie-opbrengstberekeningen, met gebruikmaking van gerenommeerde
      rekenmodellen, omgevingsmodellen, windmodellen en windkaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel18
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '18'
        paragraaf: '4'
  - number: '20.2'
    text: 'De wind-energieopbrengstberekening, bedoeld in het eerste lid, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: 20.2.a
    text: de locatiegegevens van de productie-installatie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: 20.2.b
    text: merk, type, ashoogte, rotordiameter en vermogenscurve van de beoogde productie-installatie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: 20.2.c
    text: de lokale windgegevens voor de productie-installatie; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: 20.2.d
    text: een berekening van de P50-waarde voor de netto elektriciteitsproductie op jaarbasis van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: '20.3'
    text: |-
      Bij de berekening van de P50-waarde voor de netto elektriciteitsproductie worden per windturbinelocatie op de
      beoogde ashoogte de beschikbaarheid, zogeffecten, elektriciteitsverliezen, eigen consumptie, turbinerendement,
      terugregelverliezen en een berekende windsnelheid opgenomen.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: '20.4'
    text: 'De berekende windsnelheid is:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: 20.4.a
    text: |-
      gebaseerd op de omgevingseffecten en lokale windgegevens voor de windturbinelocatie over een aaneengesloten periode
      van ten minste tien jaar; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: 20.4.b
    text: niet hoger dan de gemiddelde windsnelheid zoals bepaald met een door de minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel20
  - number: '21.1'
    text: De minister beslist op een aanvraag binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel21
  - number: '21.2'
    text: De termijn van dertien weken kan eenmaal met ten hoogste dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel21
  - number: '22.1'
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.a
    text: de aanvraag niet voldoet aan de bij of krachtens deze regeling gestelde bepalingen;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.b
    text: |-
      hij het onaannemelijk acht dat de productie-installatie binnen de op grond van [artikel 24, tweede lid][ref1],
      geldende uiterste termijn in gebruik wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel24
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '24'
        paragraaf: '5'
  - number: 22.1.c
    text: hij het onaannemelijk acht dat de productie-installatie de hele subsidieperiode in gebruik kan zijn;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.d
    text: 'hij het onaannemelijk acht dat de productie-installatie:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.d.1°
    text: uitvoerbaar is;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.d.2°
    text: technisch haalbaar is;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.d.3°
    text: financieel haalbaar is;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.d.4°
    text: economisch haalbaar is;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.e
    text: |-
      één of meer vergunningen als bedoeld in [artikel 17, eerste lid][ref1], indien van toepassing, niet zijn verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel17
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '17'
        paragraaf: '4'
  - number: 22.1.f
    text: de productie-installatie geheel of gedeeltelijk bestaat uit gebruikte materialen;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.g
    text: 'voor dezelfde productie-installatie al op grond van deze regeling subsidie is verstrekt, tenzij:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.g.1°
    text: de productie-installatie niet in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.g.2°
    text: er ten minste drie jaren zijn verstreken na de datum van de beschikking tot subsidieverlening; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.g.3°
    text: die beschikking door de minister is ingetrokken;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.h
    text: |-
      van rijkswege al een financiële tegemoetkoming of subsidie anders dan bedoeld in onderdeel g, is verstrekt voor de
      productie-installatie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.i
    text: |-
      er onomkeerbare investeringsverplichtingen voor de productie-installatie zijn aangegaan voor de datum waarop de
      subsidie is aangevraagd; of
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.j
    text: |-
      de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit uit
      zonne-energie, waarbij de zonnepanelen niet op of aan een gebouw zijn aangebracht of op water drijven, en voor
      een dergelijke productie-installatie in de openstellingsperiode, bedoeld in [artikel 2, derde lid][ref1], al
      een aanvraag is ingediend die voldoet aan de bij of krachtens deze regeling gestelde bepalingen en die eerder
      ingediende aanvraag betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel2
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '2'
        paragraaf: '2'
  - number: 22.1.j.1.
    text: op dezelfde locatie als waarop de productie-installatie uit de daarop volgende aanvraag moet worden aangebracht;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.j.2.
    text: |-
      op een locatie die grenst aan de locatie waarop de productie-installatie uit de daaropvolgende aanvraag moet worden
      aangebracht; of
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.j.3.
    text: |-
      op hetzelfde postcodegebied als waarbinnen de productie-installatie uit de daarop volgende aanvraag moet worden
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.k
    text: |-
      de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit uit
      windenergie met een of meer windturbines die een op de locatie bestaande windturbine of windturbines vervangen of
      die in de plaats komen van een windturbine of windturbines die eerder op de locatie hebben gestaan en:
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.k.1°
    text: |-
      het nominale en te realiseren vermogen van de productie-installatie ten opzichte van de te vervangen windturbine
      of windturbines of ten opzichte van de windturbine of windturbines die eerder op de locatie hebben gestaan, minder
      dan 1 MW per te vervangen windturbine of windturbines of per windturbine of windturbines die eerder op de locatie
      hebben gestaan toeneemt; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.1.k.2°
    text: |-
      de te vervangen windturbine of windturbines of de windturbine of windturbines die eerder op de locatie hebben
      gestaan op het in de aanvraag opgenomen moment van vervanging minder dan vijftien jaar op die locatie in gebruik
      zijn of zijn geweest en op het moment van het indienen van de aanvraag minder dan dertien jaar geleden in gebruik
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: '22.2'
    text: 'Er is geen sprake van dezelfde productie-installatie, bedoeld in het eerste lid, onderdeel g, indien:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.2.a
    text: het een productie-installatie op een andere locatie betreft;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: 22.2.b
    text: het een productie-installatie met een andere opwekkingstechnologie betreft.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel22
  - number: '23.1'
    text: De subsidie wordt verstrekt voor een periode van vijftien jaar.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel23
  - number: '23.2'
    text: De periode vangt aan op de datum van ingebruikname van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel23
  - number: '23.3'
    text: |-
      Indien aannemelijk is dat na afloop van de periode een ongebruikt aantal kWh zal resteren, verlengt de minister de
      periode voor het aflopen ervan.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel23
  - number: '23.4'
    text: 'De verlenging van de periode, bedoeld in het derde lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel23
  - number: 23.4.a
    text: ten hoogste een jaar en eindigt op het moment dat er geen aantal ongebruikt aantal kWh meer resteert;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel23
  - number: 23.4.b
    text: |-
      indien het een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonne-energie met een
      grootverbruikersaansluiting betreft met een beschikking op een aanvraag om subsidieverlening die in of na 2024 is
      ingediend, ten hoogste twee jaar en eindigt in ieder geval op het moment dat er geen aantal ongebruikt aantal kWh
      meer resteert.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel23
  - number: '24.1'
    text: |-
      De subsidieontvanger neemt de productie-installatie zo spoedig mogelijk na de datum van de beschikking tot
      subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel24
  - number: '24.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie uiterlijk binnen een door de minister per categorie productie-
      installatie vastgestelde termijn in gebruik.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel24
  - number: '24.3'
    text: |-
      De subsidieontvanger verstrekt de opdrachten voor de levering van onderdelen voor de bouw van de productie-
      installatie, die gebruik maakt van zonne-energie met een vermogen van 1 MWp of meer of windenergie, binnen achttien
      maanden na de datum van de beschikking tot subsidieverlening en zendt een afschrift aan de minister.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel24
  - number: '24.4'
    text: |-
      De subsidieontvanger draagt een beschikking tot subsidieverlening tot de datum van ingebruikname van de productie-
      installatie niet over aan een derde, tenzij de minister op voorafgaand verzoek van de subsidieontvanger daarvoor
      ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel24
  - number: '25.1'
    text: |-
      De subsidieontvanger realiseert de productie-installatie en heeft deze in gebruik volgens de gegevens zoals
      ingediend bij de aanvraag voor de subsidie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel25
  - number: '25.2'
    text: De verplichting, bedoeld in het eerste lid, geldt tot aan de dag waarop de subsidie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel25
  - number: '25.3'
    text: |-
      De minister kan op voorafgaand verzoek van de subsidieontvanger ontheffing verlenen van de verplichting, bedoeld in
      het eerste lid, in geval van vertragingen of essentiële wijzigingen. Aan de ontheffing kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel25
  - number: '25.4'
    text: |-
      De ontheffing wordt niet verleend indien dit zou inhouden dat de subsidieontvanger de productie-
      installatie later in gebruik neemt dan twee jaar na de dag waarop de productie-installatie op grond van
      [artikel 24, tweede lid][ref1], in gebruik moet zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel24
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '24'
        paragraaf: '5'
  - number: '26.1'
    text: |-
      Indien de productie-installatie een kleinverbruikersaansluiting heeft, draagt de subsidieontvanger er zorg voor
      dat de productie van de hernieuwbare elektriciteit door die productie-installatie jaarlijks wordt gemeten en wordt
      medegedeeld aan de minister.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel26
  - number: '26.2'
    text: |-
      Indien de productie-installatie een grootverbruikersaansluiting heeft, draagt de subsidieontvanger er zorg voor dat
      de productie van de hernieuwbare elektriciteit door die productie-installatie maandelijks wordt gemeten en wordt
      medegedeeld aan de minister.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel26
  - number: '27.1'
    text: De productie-installatie is eigendom van de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel27
  - number: '27.2'
    text: Voor deze regeling wordt financial lease gelijkgesteld met eigendom als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel27
  - number: '28.1'
    text: |-
      Indien de productie-installatie wordt aangebracht op, in of boven een onroerende zaak van een derde, heeft de
      subsidieontvanger een recht van opstal voor het in eigendom hebben of verkrijgen van de productie-installatie
      en het aanbrengen en in gebruik hebben van de productie-installatie op, in of boven de onroerende zaak door een
      notariële akte van vestiging van recht van opstal en inschrijving van die akte in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel28
  - number: '28.2'
    text: |-
      In afwijking van het eerste lid heeft de subsidieontvanger, indien de productie-installatie wordt aangebracht
      op, in of boven een onroerende zaak van een derde waarop een recht van erfpacht rust, een huur- of
      gebruikersovereenkomst met de erfpachter voor het in eigendom hebben of verkrijgen van de productie-installatie en
      het aanbrengen en in gebruik hebben van de productie-installatie op, in of boven de onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel28
  - number: '28.3'
    text: |-
      In afwijking van het eerste en tweede lid heeft de subsidieontvanger, indien hij een coöperatie is en de productie-
      installatie wordt aangebracht op, in of boven een gebouw dat in eigendom is van een vereniging van eigenaars,
      een huur- of gebruiksovereenkomst met de vereniging van eigenaars voor het aanbrengen en in gebruik hebben van de
      productie-installatie op, in of boven de onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel28
  - number: '28.4'
    text: |-
      In een geval als bedoeld in het eerste lid overlegt de subsidieontvanger uiterlijk twaalf maanden na de datum van
      de beschikking tot subsidieverlening een kopie van de akte van vestiging van het recht van opstal aan de minister.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel28
  - number: '28.5'
    text: |-
      Indien de subsidieontvanger een vereniging van eigenaars is, wordt de productie-installatie aangebracht op, in of
      boven een gebouw of de daarbij behorende grond, ter zake waarvan de vereniging van eigenaars is opgericht.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel28
  - number: '29.1'
    text: |-
      De productie-installatie is op niet meer dan één allocatiepunt aangesloten. Op het allocatiepunt zijn geen andere
      productie-installaties aangesloten.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel29
  - number: '29.2'
    text: |-
      Indien de productie-installatie wordt aangesloten op het elektriciteitsnet met een kleinverbruikersaansluiting, is
      het allocatiepunt een zuiver terugleverallocatiepunt.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel29
  - number: '30'
    text: |-
      Indien de productie-installatie wordt aangesloten op het elektriciteitsnet met een kleinverbruikersaansluiting
      en deze productie-installatie wordt aangebracht op een locatie waarvoor op grond van deze regeling al subsidie
      is verstrekt voor een andere productie-installatie die is aangesloten op het elektriciteitsnet met een
      kleinverbruikersaansluiting, zijn beide productie-installaties met één en dezelfde kleinverbruikersaansluiting
      aangesloten op het elektriciteitsnet.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel30
  - number: '31.1'
    text: |-
      Onverminderd [artikel 12 van boek 2 van het Burgerlijk Wetboek][ref1] draagt de subsidieontvanger, indien hij een
      coöperatie is, er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel12
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '12'
  - number: 31.1.a
    text: |-
      al zijn leden die niet geschorst zijn, toegang hebben tot de algemene vergadering en dat die leden daar elk één
      stem hebben over de in de beschikking tot subsidieverlening opgenomen productie-installatie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel31
  - number: 31.1.b
    text: |-
      indien personen die deel uitmaken van andere organen van de vereniging en die geen lid zijn in de algemene
      vergadering stemrecht kunnen uitoefenen, deze personen elk niet meer dan één stem hebben over de in de beschikking
      tot subsidieverlening opgenomen productie-installatie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel31
  - number: '31.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing indien aan de subsidieontvanger subsidie is verstrekt op grond
      van een aanvraag die is ingediend in 2021.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel31
  - number: '31.3'
    text: |-
      Indien de subsidie is verstrekt aan een coöperatie die zich richt of mede richt op het opwekken van hernieuwbare
      energie gezamenlijk met een besloten vennootschap met beperkte aansprakelijkheid, berust het volledige eigendom van
      en de volledige zeggenschap over deze besloten vennootschap bij de coöperatie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel31
  - number: '32'
    text: De productie-installatie is aangebracht in de bij beschikking tot subsidieverlening vastgestelde postcoderoos.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel32
  - number: '33.1'
    text: |-
      Indien de subsidieontvanger een coöperatie is, zijn de deelnemende leden op het moment dat de lijst van deelnemende
      leden overeenkomstig [artikel 37, eerste lid][ref1], aan de minister wordt overgelegd, woonachtig of gevestigd op
      een adres binnen de in de beschikking tot subsidieverlening vastgestelde postcoderoos.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel37
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '37'
        paragraaf: '5'
  - number: '33.2'
    text: |-
      Een lid dat na het moment dat de lijst van deelnemende leden overeenkomstig [artikel 37, eerste lid][ref1], aan
      de minister wordt overgelegd, deelnemend lid wordt, is op de datum van de ondertekening van de overeenkomst tussen
      het lid en de coöperatie tot vaststelling van de financiële inleg van het lid, woonachtig of gevestigd op een adres
      binnen de in de beschikking tot subsidieverlening vastgestelde postcoderoos.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel37
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '37'
        paragraaf: '5'
  - number: '33.3'
    text: Op een adres als bedoeld in het eerste of tweede lid, is niet meer dan één deelnemend lid woonachtig of gevestigd.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel33
  - number: '33.4'
    text: |-
      De minister kan de in de beschikking tot subsidieverlening vastgestelde postcoderoos op verzoek van de coöperatie
      wijzigen binnen een periode van twaalf maanden die ingaat op de datum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel33
  - number: '33.5'
    text: |-
      Indien de subsidieontvanger een vereniging van eigenaars is, is ten minste 75% van de leden op het moment dat
      de lijst van deelnemende leden overeenkomstig [artikel 37, vierde lid][ref1], aan de minister wordt overgelegd
      woonachtig of gevestigd in de in de aanvraag opgenomen postcoderoos.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel37
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '37'
        paragraaf: '5'
  - number: '34'
    text: |-
      Bij een postcodewijziging door de daartoe bevoegde instantie blijven voor de toepassing van deze regeling de
      postcodegebieden gelden zoals deze golden op de datum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel34
  - number: '35.1'
    text: |-
      Indien de subsidieontvanger een coöperatie is, bedraagt het aantal deelnemende leden vanaf het moment dat de
      lijst van deelnemende leden, overeenkomstig [artikel 37, eerste lid][ref1], aan de minister wordt overgelegd,
      ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel37
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '37'
        paragraaf: '5'
  - number: 35.1.a
    text: één deelnemend lid per 5 kWp vermogen bij een productie-installatie die gebruik maakt van zonne-energie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel35
  - number: 35.1.b
    text: één deelnemend lid per 5 kW vermogen bij een productie-installatie die gebruik maakt van windenergie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel35
  - number: '35.2'
    text: |-
      Indien de subsidieontvanger een vereniging van eigenaars is en de productie-installatie is aangebracht op, in of
      boven de grond ter zake waarvan de vereniging van eigenaars is opgericht, bedraagt het aantal leden op het moment
      dat de lijst van leden, overeenkomstig [artikel 37, vierde lid][ref1], aan de minister wordt overgelegd, ten
      minste:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel37
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '37'
        paragraaf: '5'
  - number: 35.2.a
    text: één lid per 5 kWp vermogen bij een productie-installatie die gebruik maakt van zonne-energie;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel35
  - number: 35.2.b
    text: één lid per 5 kW vermogen bij een productie-installatie die gebruik maakt van windenergie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel35
  - number: '35.3'
    text: |-
      Indien de productie-installatie wordt aangebracht op een locatie waarvoor op grond van deze regeling al subsidie is
      verstrekt aan de subsidieontvanger voor een andere productie-installatie, worden bij toepassing van het eerste en
      tweede lid de vermogens van alle productie-installaties op die locatie bij elkaar opgeteld.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel35
  - number: '36.1'
    text: |-
      Indien de subsidieontvanger een coöperatie is, wordt aan elk deelnemend lid elektriciteit met een
      kleinverbruikersaansluiting geleverd vanaf het moment dat de lijst van deelnemende leden overeenkomstig
      [artikel 37, eerste lid][ref1], aan de minister wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel37
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '37'
        paragraaf: '5'
  - number: '36.2'
    text: |-
      Aan een lid dat na het moment, bedoeld in het eerste lid, deelnemend lid wordt, wordt elektriciteit met een
      kleinverbruikersaansluiting geleverd vanaf het moment van ondertekening van de overeenkomst tussen het lid en de
      coöperatie tot vaststelling van de financiële inleg van dat lid.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel36
  - number: '36.3'
    text: |-
      Indien de subsidieontvanger een vereniging van eigenaars is, wordt vanaf het moment dat de lijst van deelnemende
      leden overeenkomstig [artikel 37, vierde lid][ref1], aan de minister wordt overgelegd, aan ten minste 75% van de
      leden elektriciteit met een kleinverbruikersaansluiting geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel37
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '37'
        paragraaf: '5'
  - number: '37.1'
    text: |-
      Indien de subsidieontvanger een coöperatie is, overlegt deze uiterlijk twaalf maanden na de datum van de
      beschikking tot subsidieverlening een lijst van deelnemende leden met de naam en het adres van elk deelnemend lid
      aan de minister.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel37
  - number: '37.2'
    text: Wijzigingen in de lijst van deelnemende leden worden eenmaal per jaar aan de minister gemeld.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel37
  - number: '37.3'
    text: |-
      De coöperatie overlegt op verzoek aan de minister van elk deelnemend lid een overeenkomst tussen het lid en de
      coöperatie tot vaststelling van de financiële inleg van het lid.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel37
  - number: '37.4'
    text: |-
      Indien de subsidieontvanger een vereniging van eigenaars is, overlegt deze uiterlijk twaalf maanden na de datum
      van de beschikking tot subsidieverlening een ledenlijst met de naam en het adres van elk deelnemend lid aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel37
  - number: '38.1'
    text: |-
      De subsidieontvanger doet onverwijld schriftelijk mededeling aan de minister van de indiening bij de rechtbank van
      een verzoek tot faillietverklaring van hem of tot verlening van surseance van betaling aan hem.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel38
  - number: '38.2'
    text: 'De subsidieontvanger doet onverwijld schriftelijk mededeling aan de minister zodra aannemelijk is dat:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel38
  - number: 38.2.a
    text: de productie-installatie niet of niet tijdig in gebruik zal worden genomen of in werking zal zijn; of
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel38
  - number: 38.2.b
    text: niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel38
  - number: '38.3'
    text: |-
      De subsidieontvanger verstrekt desgevraagd aan de minister alle overige bescheiden, gegevens of inlichtingen die
      nodig zijn voor een beslissing over de subsidie.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel38
  - number: '38.4'
    text: |-
      Indien er sprake is van een gezamenlijke aanvraag door een coöperatie en een besloten vennootschap als bedoeld in
      [artikel 2, eerste lid, onderdeel c][ref1], doen de subsidieontvangers onverwijld mededeling aan de minister over
      een wijziging in het eigendom of de zeggenschap van de coöperatie over de besloten vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel2
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '2'
        paragraaf: '2'
  - number: '39'
    text: |-
      De subsidieontvanger verleent tot en met vijf jaar na de datum van de beschikking tot subsidievaststelling
      medewerking aan een evaluatie van de doeltreffendheid en de effecten van de aan hem verleende subsidie, voor zover
      medewerking redelijkerwijs van hem kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel39
  - number: '40.1'
    text: De minister verstrekt ambtshalve één keer per jaar een voorschot.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel40
  - number: '40.2'
    text: 'Voor het bepalen van het voorschot wordt met elkaar vermenigvuldigd:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel40
  - number: 40.2.a
    text: het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel40
  - number: 40.2.b
    text: |-
      het in de beschikking tot subsidieverlening opgenomen basisbedrag minus het op grond van [artikel 9][ref1] geldende
      voorlopige correctiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel9
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '9'
        paragraaf: '3'
  - number: '40.3'
    text: |-
      Na ieder kalenderjaar wordt het voorschot in het daaropvolgende kalenderjaar bijgesteld aan de hand van de
      productie in het voorgaande kalenderjaar waarover garanties van oorsprong zijn afgegeven en het voor het voorgaande
      kalenderjaar vastgestelde definitieve correctiebedrag, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel6
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '6'
        paragraaf: '3'
  - number: '40.4'
    text: |-
      Indien de productie-installatie is aangesloten op het elektriciteitsnet met een grootverbruikersaansluiting, wordt
      de productie, bedoeld in het derde lid, in verband met een beschikking op een aanvraag om subsidieverlening die op
      of na 2 april 2024 is ingediend, verminderd met het aantal kWh dat is ingevoed op een elektriciteitsnet gedurende
      elke periode waarin de waarde voor elektriciteit negatief is.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel40
  - number: '40.5'
    text: |-
      Indien de meetgegevens niet beschikbaar zijn in het kalenderjaar, bedoeld in het tweede en derde lid, wordt in
      afwijking van het tweede en derde lid het voorschot uiterlijk vastgesteld in het eerstvolgende kalenderjaar nadat
      de meetgegevens beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel40
  - number: '41'
    text: |-
      De minister verstrekt het eerste voorschot aan de subsidieontvanger niet eerder dan nadat deze een rekening voor
      garanties van oorsprong als bedoeld in [artikel 1.1 van de Energiewet][ref1], heeft geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '1'
  - number: '42.1'
    text: Het voorschot wordt in maandelijkse bedragen uitbetaald.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: '42.2'
    text: 'Het maandelijkse bedrag bedraagt één-twaalfde van 80% van het product van:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: 42.2.a
    text: het in de beschikking tot subsidieverlening voor een kalenderjaar vastgestelde maximum aantal kWh; en
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: 42.2.b
    text: |-
      het in de beschikking tot subsidieverlening opgenomen basisbedrag minus het op grond van [artikel 9][ref1] geldende
      voorlopige correctiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel9
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '9'
        paragraaf: '3'
  - number: '42.3'
    text: |-
      Indien de subsidieperiode start op een andere datum dan 1 januari of eindigt op een andere datum dan 31 december,
      bedraagt voor het eerste jaar respectievelijk het laatste jaar van de periode waarover subsidie wordt verstrekt,
      het maandelijkse bedrag een evenredig deel van het aantal maanden of van het jaar waarover het voorschot wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: '42.4'
    text: 'De minister kan het maandelijkse bedrag herberekenen, indien:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: 42.4.a
    text: |-
      de subsidieontvanger een verzoek tot ontheffing als bedoeld in [artikel 25, derde lid][ref1], indient;


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel25
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '25'
        paragraaf: '5'
  - number: 42.4.b
    text: |-
      de maandelijkse productie gedurende ten minste twee maanden ten minste 50% zal achterblijven dan wel achter is
      gebleven ten opzichte van de in de beschikking tot voorschotverlening opgenomen maximum productie in kWh;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: 42.4.c
    text: |-
      de minister na het begin van de voorschotverlening meer dan een maand geen productiegegevens heeft ontvangen over
      de betreffende productie-installatie; of
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: 42.4.d
    text: |-
      de cumulatieve productie van hernieuwbare elektriciteit in het betreffende kalenderjaar ten minste 20% zal
      achterblijven dan wel achter is gebleven ten opzichte van de in de beschikking tot voorschotverlening opgenomen
      maximum productie in kWh.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel42
  - number: '43.1'
    text: |-
      De bijstelling van het voorschot, bedoeld in [artikel 40, derde lid][ref1], vindt plaats binnen zes maanden na
      afloop van het kalenderjaar aan de hand van:


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel40
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '40'
        paragraaf: '6'
  - number: 43.1.a
    text: de productie in het voorgaande kalenderjaar waarover garanties van oorsprong zijn afgegeven;
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel43
  - number: 43.1.b
    text: |-
      het voor het voorgaande kalenderjaar vastgestelde definitieve correctiebedrag, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel6
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '6'
        paragraaf: '3'
  - number: '43.2'
    text: |-
      Indien de som van de maandelijks bedragen die in het voorgaande kalenderjaar zijn verstrekt, minder bedraagt
      dan het op grond van het eerste lid bijgestelde voorschot, wordt het tekort aan verstrekte maandelijkse bedragen
      verrekend. De minister verstrekt het te weinig betaalde bedrag binnen zes weken na de datum van de bijstelling aan
      de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel43
  - number: '43.3'
    text: |-
      Indien de som van de maandelijkse bedragen die in een kalenderjaar zijn verstrekt, meer bedraagt dan het op grond
      van het eerste lid bijgestelde voorschot, kan de minister:
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel43
  - number: 43.3.a
    text: het teveel aan verstrekte maandelijkse bedragen geheel of deels terugvorderen na afloop van dat kalenderjaar; of
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel43
  - number: 43.3.b
    text: |-
      het teveel aan verstrekte maandelijkse bedragen in mindering brengen op het eerstvolgende te verstrekken
      maandelijkse bedrag en vervolgens op zoveel maandelijkse bedragen als nodig is om het teveel betaalde voorschot
      volledig te verrekenen.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel43
  - number: '44'
    text: 'De minister verstrekt geen voorschot indien de subsidieontvanger:'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel44
  - number: 44.a
    text: niet heeft voldaan aan de bij of krachtens deze regeling gestelde bepalingen; of
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel44
  - number: 44.b
    text: |-
      failliet is verklaard of aan hem surséance van betaling is verleend, dan wel een verzoek daartoe bij de rechtbank
      is ingediend.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel44
  - number: '45.1'
    text: |-
      De subsidieontvanger dient een aanvraag om subsidievaststelling in binnen zes maanden na het tijdstip waarop de
      subsidieperiode is verstreken.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel45
  - number: '45.2'
    text: De aanvraag wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel45
  - number: '46.1'
    text: |-
      De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag daartoe
      of nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel46
  - number: '46.2'
    text: |-
      Indien het definitieve correctiebedrag, bedoeld in [artikel 6, eerste lid][ref1], voor het laatste jaar waarin
      de subsidiabele productie heeft plaatsgevonden nog niet is vastgesteld op het moment dat de aanvraag tot
      subsidievaststelling is ingediend, wordt de termijn, bedoeld in het eerste lid, opgeschort met twee weken, ingaande
      na de dag nadat dit bedrag wel is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel6
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '6'
        paragraaf: '3'
  - number: 47a
    text: |-
      Op beschikkingen tot subsidieverlening die zijn afgegeven op aanvragen voor subsidie die zijn ontvangen voor
      inwerkingtreding van het [Besluit openstelling Subsidieregeling coöperatieve energieopwekking 2024][ref1] is
      [artikel 35, eerste en tweede lid][ref2], van toepassing zoals dat luidde voor de inwerkingtreding van de Regeling
      van de Minister voor Klimaat en Energie van 18 maart 2024, nr. WJZ/ 45392695, tot wijziging van de Subsidieregeling
      coöperatieve energieopwekking in verband met de Algemene Groepsvrijstellingsverordening en overige wijzigingen
      (Stcrt. 2024, 8919).


      [ref1]: https://wetten.overheid.nl/BWBR0049501
      [ref2]: https://wetten.overheid.nl/BWBR0044882#Artikel35
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0049501
      - id: ref2
        bwb_id: BWBR0044882
        artikel: '35'
        paragraaf: '5'
  - number: 47b
    text: |-
      Op beschikkingen tot subsidieverlening die zijn afgegeven op aanvragen voor subsidie die zijn ontvangen voor
      inwerkingtreding van het [Besluit openstelling Subsidieregeling coöperatieve energieopwekking 2026](onbekend)
      zijn [artikelen 7, eerste lid, onderdeel a][ref1], en [9, eerste lid, onderdeel a, subonderdeel 2°][ref2], van
      toepassing zoals die luidden voor 1 maart 2026.


      [ref1]: https://wetten.overheid.nl/BWBR0044882#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0044882#Artikel9
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0044882
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0044882
        artikel: '9'
        paragraaf: '3'
  - number: '48.1'
    text: Deze regeling treedt in werking met ingang van 1 april 2021.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel48
  - number: '48.2'
    text: |-
      Deze regeling vervalt met ingang van 1 april 2031, met dien verstande dat zij van toepassing blijft op subsidies
      die voor die datum zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel48
  - number: '49'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling coöperatieve energieopwekking.'
    url: https://wetten.overheid.nl/BWBR0044882/2026-03-01#Artikel49
