articles:
  - number: '1'
    text: |-
      In deze regeling en voor zover van toepassing in de besluiten, bedoeld in de [artikelen 2, derde lid][ref1],
      [4, derde lid][ref2], [5, eerste lid][ref3], [6, tweede lid][ref4], [8, derde lid][ref5], en [9][ref6], wordt
      verstaan onder: - *aansluiting:* aansluiting als bedoeld in [artikel 1.1 van de Energiewet][ref7];
        - *allocatiepunt:* een punt achter een aansluiting, waarmee een productie-installatie is
      aangesloten op het elektriciteitsnet, waar wordt gemeten en waaraan een marktpartij als bedoeld in
      [artikel 1 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref8] is gekoppeld;
        - *coöperatie:* coöperatie als bedoeld in [artikel 53, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref9];
        - *deelnemend lid:* lid van de coöperatie dat een financiële inleg heeft in de in de beschikking tot
      subsidieverlening opgenomen productie-installatie, zoals vastgelegd in een overeenkomst tussen het lid en de
      coöperatie;
        - *elektriciteitsnet:* transmissiesysteem of distributiesysteem voor elektriciteit als bedoeld in
      [artikel 1.1. van de Energiewet][ref10];
        - *garantie van oorsprong:* garantie van oorsprong voor duurzame elektriciteit als bedoeld in
      [artikel 1, eerste lid, onderdeel x, van de Elektriciteitswet 1998][ref11];
        - *garantie van oorsprong voor netlevering:* garantie van oorsprong voor elektriciteit die op het elektriciteitsnet
      wordt ingevoed;
        - *garanties van oorsprong voor niet-netlevering:* garantie van oorsprong voor elektriciteit die op een installatie
      wordt ingevoed;
        - *grootverbruikersaansluiting:* aansluiting met een totale maximale doorlaatwaarde van meer dan 3*80A;
        - *hernieuwbare elektriciteit:* elektriciteit, opgewekt in een productie-installatie die uitsluitend gebruik maakt
      van hernieuwbare energie;
        - *hernieuwbare energie:* energie uit hernieuwbare niet-fossiele bronnen, namelijk windenergie, zonne-energie
      (thermische zonne-energie en fotovoltaïsche energie) en geothermische energie, omgevingsenergie, getijdenenergie,
      golfslagenergie en andere energie uit de oceanen, waterkracht, en energie uit biomassa, stortgas, gas van
      rioolzuiveringsinstallaties, en biogas;
        - *kleinverbruikersaansluiting:* aansluiting met een totale maximale doorlaatwaarde van ten hoogste 3*80A;
        - *minister:* Minister van Klimaat en Groene Groei als bedoeld in
      [artikel 1, onderdeel c, van de Kaderwet EZ-, LVVN- en KGG-subsidies][ref12];
        - *netbeheerder:* transmissiesysteembeheerder of distributiesysteembeheerder als bedoeld in
      [artikel 1.1. van de Energiewet][ref13];
        - *P50-waarde voor de netto elektriciteitsproductie:* netto elektriciteitsproductie waarbij de verwachte
      jaarlijkse energieproductie voor een gegeven combinatie van locatie en productie-installatie, die gebruik maakt van
      windenergie, moet zijn bepaald met een waarschijnlijkheid van 50%;
        - *postcodegebied:* gebied waarbinnen de postcodes in het postcodesysteem beginnen met eenzelfde getal van vier
      cijfers;
        - *postcoderoos:* postcodegebied en de direct aangrenzende postcodegebieden;
        - *postcodesysteem:* postcodesysteem als bedoeld in [artikel 2, eerste lid, onderdeel j, van de Postwet 2009][ref14];
        - *productie-installatie:* samenstel van voorzieningen waarmee uitsluitend hernieuwbare elektriciteit wordt
      geproduceerd, waarbij onder een samenstel van voorzieningen wordt verstaan alle aanwezige middelen die onderling
      met elkaar zijn verbonden voor de productie van hernieuwbare elektriciteit;
        - *vereniging van eigenaars:* vereniging van eigenaars als bedoeld in
      [artikel 112, eerste lid, onderdeel e, van Boek 5 van het Burgerlijk Wetboek][ref15];
        - *zuiver terugleverallocatiepunt:* allocatiepunt waarop uitsluitend elektriciteit aan het elektriciteitsnet wordt
      geleverd en waarop geen elektriciteit van het elektriciteitsnet wordt afgenomen.


