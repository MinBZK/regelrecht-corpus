  - number: '167.5'
    text: |-
      Waar in deze wet sprake is van het tijdstip van de inwerkingtreding van deze wet wordt daarmede, behoudens in de in
      het derde lid genoemde artikelen en artikelleden en in [artikel 125][ref1], bedoeld 1 januari 1966.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel125
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel167
    references:
      - id: ref1
