  - number: '149.3'
    text: |-
      Voor de toepassing van dit artikel is [artikel 148, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel148
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '148'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: '150.1'
    text: |-
      Het gezamenlijk bedrag van de wezenpensioenen gaat een bedrag gelijk aan vijf zevende gedeelte van het bedrag
      waarvan die pensioenen zijn afgeleid niet te boven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150
  - number: '150.2'
    text: |-
      Indien wegens toepassing van het eerste lid de wezenpensioenen worden verminderd, geschiedt deze vermindering in
      evenredigheid naar de omvang van die pensioenen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150
  - number: '150.3'
    text: |-
      Bij de toepassing van dit artikel wordt de toeslag, bedoeld in [artikel 150b][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel150b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 150b
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 150a.1
    text: |-
      De nabestaande die de leeftijd van 65 jaar nog niet heeft bereikt, heeft tot de dag waarop hij die leeftijd bereikt
      recht op een toeslag op zijn volgens de voorgaande artikelen berekende pensioen ten bedrage van 15 percent van dat
      pensioen voorzover berekend over tijd vóór 1 augustus 2003 en van 7,5 percent voorzover berekend over tijd na 31
      juli 2003, behoudens het bepaalde in het tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150a
  - number: 150a.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een pensioen als daar bedoeld verstaan het pensioen nadat
      eventueel [hoofdstuk 25][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk25
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '25'
        afdeling: Vijfde
  - number: 150a.3
    text: |-
      Dit artikel is niet van toepassing ten aanzien van degene die recht heeft op bijzonder nabestaandenpensioen, noch
      degene wiens nabestaandenpensioen met toepassing van [artikel 147][ref1] opnieuw is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel147
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '147'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 150a.4
    text: |-
      De in het eerste lid bedoelde toeslag bedraagt ten hoogste vijftien percent van f 72.309,80 . Dit bedrag wordt
      telkens gewijzigd bij de ministeriële regeling, bedoeld in [artikel 157, derde lid][ref1], overeenkomstig de
      aanpassing van een bedrag dat, omgerekend naar euro's, op 1 januari 1985  € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel157
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '157'
        hoofdstuk: '26'
        afdeling: Vijfde
  - number: 150b.1
    text: |-
      De wees bedoeld in [artikel 148][ref1] heeft vanaf de eerste dag van de maand waarin hij de leeftijd van vijftien
      jaar heeft bereikt, recht op een toeslag op zijn volgens de voorgaande artikelen berekende pensioen ten bedrage van
      vijftien percent van dat pensioen, behoudens het bepaalde in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel148
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '148'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 150b.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een pensioen als daar bedoeld verstaan het pensioen nadat
      eventueel [hoofdstuk 25][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk25
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel150b
    references:
