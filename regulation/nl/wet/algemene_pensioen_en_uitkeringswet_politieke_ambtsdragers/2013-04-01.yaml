      - id: ref4
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '47'
    text: |-
      De weduwen- en wezenpensioenen toe te kennen uit hoofde van een overlijden op of na het tijdstip van de
      inwerkingtreding van deze wet van degenen, die zich krachtens artikel 50 van de wet van 1 augustus 1956, *Stb.*
      455, hebben uitgesproken voor de berekening van hun pensioen krachtens het bepaalde in artikel 68, tweede lid,
      van de Pensioenwet 1922, *Stb.* 240, zoals dit artikel luidde op 31 augustus 1956, worden berekend overeenkomstig
      [artikel 22][ref1], onderscheidenlijk [25][ref2], indien dit voor de belanghebbende voordeliger is.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel25
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '48'
    text: |-
      Voor de termijn van vijf achtereenvolgende jaren bedoeld in [artikel 31, eerste lid][ref1], telt mede de tijd voor
      het tijdstip van de inwerkingtreding van deze wet, gedurende welke de invordering van het pensioen achterwege is
      gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel31
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '31'
        hoofdstuk: '6'
        afdeling: Tweede
  - number: '49.1'
    text: |-
      Pensioenen ten aanzien waarvan artikel 11 of 20*a* van de wet van 1 augustus 1956, *Stb.* 455, toepassing heeft
      gevonden, worden, onverminderd de artikelen 93 en 94 zoals deze luidden op het tijdstip van inwerkingtreding van
      deze wet en met inachtneming van het volgende lid, met ingang van het tijdstip van de inwerkingtreding van deze
      wet of het later tijdstip waarop zij zijn ingegaan, nader vastgesteld zonder de in eerstgenoemde artikelen vervatte
      beperking.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel49
  - number: '49.2'
    text: |-
      De nadere vaststelling bedoeld in het vorige lid geschiedt zodanig, dat niet daadwerkelijk gelijktijdig vervulde
      diensttijd slechts wordt medegeteld bij de berekening van het pensioen waarbij die tijd het hoogste bedrag
      oplevert. Bij de toepassing van de vorige volzin wordt onder pensioen tevens verstaan een pensioen krachtens een
      andere regeling bedoeld in [artikel 34, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel34
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '34'
        hoofdstuk: '7'
        afdeling: Tweede
  - number: '49.3'
    text: |-
      De voorgaande leden vinden slechts toepassing, indien tengevolge daarvan de som van de pensioenen meer bedraagt
      dan deze zou hebben bedragen, indien de op de dag voor het tijdstip van de inwerkingtreding van deze wet van kracht
      geweest zijnde bepalingen van toepassing zouden zijn gebleven. Indien krachtens de voorgaande volzin geen nadere
      vaststelling der pensioenen plaatsvindt, is op het totaal der pensioenen [artikel 105][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '50'
    text: 'Voor de toepassing van het bij of krachtens deze afdeling bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50
  - number: 50.a
    text: 'kamerlid: lid van de Tweede Kamer der Staten-Generaal;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50
  - number: 50.b
    text: |-
      gewezen kamerlid: hij die uit hoofde van een aftreden als lid van de Tweede Kamer der Staten-Generaal uitzicht
      heeft op pensioen krachtens deze afdeling;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50
  - number: 50.c
    text: |-
      gepensioneerd kamerlid: hij die uit hoofde van een aftreden als lid van de Tweede Kamer der Staten-Generaal recht
      heeft op pensioen krachtens deze afdeling;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50
  - number: 50.d
    text: |-
      kamerlidtijd: tijd, gedurende welke belanghebbende als lid van de Tweede Kamer der Staten-Generaal is opgetreden en
      waarover schadeloosstelling is genoten;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50
  - number: 50.e
    text: |-
      berekeningsgrondslag: het bedrag van de op de dag vóór het aftreden geldende
      schadeloosstelling en aanspraak op eindejaarsuitkering, bedoeld in de [artikelen 2][ref1] en
      [2b van de Wet schadeloosstelling leden Tweede Kamer][ref2], waarbij de evenbedoelde aanspraak wordt berekend over
      de schadeloosstelling, bedoeld in [artikel 2 van de evengenoemde wet][ref3], verminderd met het in dat artikel
      bedoelde percentage van de vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: 2b
      - id: ref3
        bwb_id: BWBR0004939
        artikel: '2'
  - number: 50a.1
    text: |-
      Voor de toepassing van het bij of krachtens deze afdeling bepaalde wordt tevens als kamerlidtijd
      aangemerkt een periode van tijdelijk ontslag wegens zwangerschap en bevalling of ziekte, ingevolge
      [artikel X 10 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: 50a.2
    text: |-
      Deze wet is niet van toepassing op het kamerlid dat is benoemd in de plaats die is opengevallen als
      gevolg van het tijdelijk ontslag van een lid wegens zwangerschap en bevalling of ziekte, ingevolge
      [artikel X 12 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_12
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_12
  - number: '51.1'
    text: |-
      Aan een kamerlid wordt met ingang van de dag van zijn aftreden, indien hij nog niet de leeftijd van 65 jaar heeft
      bereikt, een uitkering toegekend op de voet van de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel51
  - number: '51.2'
    text: 'Het eerste lid vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel51
  - number: 51.2.a
    text: indien de belanghebbende daarom verzoekt, of indien hij zonder onderbreking weer als kamerlid optreedt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel51
  - number: 51.2.b
    text: indien aan de belanghebbende rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel51
  - number: '51.3'
    text: |-
      Tenzij de omstandigheid bedoeld in het tweede lid, onder b, te rekenen vanaf de dag van ingang van het ontslag
      even lang als of langer heeft geduurd dan de duur van de uitkering berekend volgens [artikel 52][ref1], wordt de
      uitkering alsnog toegekend met ingang van de dag dat die omstandigheid zich niet meer voordoet, voor de resterende
      duur.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
  - number: '51.4'
    text: |-
      Een tijdelijk ontslag als bedoeld in [artikel X 10 van de Kieswet][ref1], wordt niet aangemerkt als aftreden als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '52.1'
    text: |-
      De uitkering wordt toegekend voor een duur gelijk aan de tijd waarin de belanghebbende kamerlid is geweest, maar
      ten minste voor de duur van twee jaren en ten hoogste voor de duur van drie jaren en twee maanden. Indien de
      belanghebbende met een of meer onderbrekingen kamerlid is geweest, wordt in aanmerking genomen de tijd gedurende
      welke hij kamerlid is geweest in een tijdvak, laatstelijk voor zijn aftreden, waarin zijn kamerlidmaatschap voor
      ten hoogste een zesde deel van dat tijdvak is onderbroken.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52
  - number: '52.2'
    text: |-
      In afwijking van het eerste lid wordt de uitkering toegekend voor de duur van zes maanden, indien de belanghebbende
      korter dan drie maanden kamerlid is geweest.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52
  - number: '52.3'
    text: |-
      Indien de belanghebbende ten tijde van zijn aftreden de leeftijd van 55 jaar heeft bereikt en hij in het tijdvak
      van twaalf jaren dat direct aan zijn aftreden voorafgaat ten minste tien jaren kamerlid is geweest, wordt de
      uitkering voortgezet tot het tijdstip waarop hij de leeftijd van 65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52
  - number: '52.4'
    text: |-
      Voor de berekening van de uitkeringsduur, bedoeld in het eerste lid, en de tien jaren, bedoeld in het derde lid,
      wordt met tijd waarin de belanghebbende kamerlid is geweest gelijkgesteld de tijd waarin hij een functie heeft
      bekleed als genoemd in [artikel 2, tweede lid, onder a en d][ref1]. Indien sprake is van gelijkgestelde tijd als
      bedoeld in de vorige zin wordt met betrekking tot die tijd op dezelfde wijze als in de tweede zin van het eerste
      lid rekening gehouden met onderbrekingen in de uitoefening van deze functies.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '52.5'
    text: |-
      Voor de toepassing van dit artikel wordt onder kamerlid mede begrepen lid van het Europees Parlement, voorzover dat
      lidmaatschap niet gelijktijdig werd vervuld met het kamerlidmaatschap. Voor de vaststelling van de tijd gedurende
      welke de belanghebbende kamerlid is geweest, telt niet mee de tijd gedurende welke de schadeloosstelling als
      kamerlid niet werd genoten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52
  - number: '52.6'
    text: |-
      In geval van tussentijds vervallen van de uitkering krachtens [artikel 56, tweede lid, onder b][ref1], wordt
      de volgende uitkering toegekend ten minste tot het tijdstip waarop eerstgenoemde uitkering, indien zij niet was
      vervallen, zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel56
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '56'
        hoofdstuk: '10'
        afdeling: Derde
  - number: '52.7'
    text: |-
      In bijzondere gevallen kunnen Wij, de Raad van State gehoord, bepalen, dat de uitkering wordt voortgezet voor een,
      met inachtneming van [artikel 56][ref1] vast te stellen termijn, die op dezelfde wijze kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel56
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '56'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52a.1
    text: |-
      De belanghebbende die recht heeft op een uitkering als bedoeld in [artikel 51][ref1], is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel51
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '51'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52a.1.a
    text: in voldoende mate te trachten passende arbeid te vinden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.1.b
    text: aangeboden passende arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.1.c
    text: mee te werken aan activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.2
    text: 'De belanghebbende voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.2.a
    text: door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.2.b
    text: door eigen toedoen passende arbeid opgeeft;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.2.c
    text: eisen stelt die het aanvaarden of verkrijgen van passende arbeid belemmeren.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.3
    text: |-
      Onder passende arbeid als bedoeld in het eerste en tweede lid wordt verstaan alle arbeid die voor de krachten en
      de bekwaamheden van de belanghebbende is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of
      sociale aard niet van hem kan worden gevergd. Of arbeid passend is wordt in ieder geval bepaald door:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.3.a
    text: |-
      de aard van de arbeid, in relatie tot de eerder verrichte arbeid, een eerder uitgeoefend beroep of opgedane
      werkervaring;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.3.b
    text: het opleidingsniveau van de belanghebbende;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.3.c
    text: de reistijd naar en van het werk;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.3.d
    text: het geboden loon;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.3.e
    text: het werkloosheidsrisico.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.4
    text: |-
      Onze Minister is verantwoordelijk voor het in overleg met de belanghebbende opstellen van een plan voor het gericht
      zoeken naar en verwerven van passende arbeid, waarin de activiteiten zijn opgenomen die noodzakelijk zijn om te
      voldoen aan de verplichting, bedoeld in het eerste lid, onderdeel a. Bij algemene maatregel van bestuur worden
      nadere regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.4.a
    text: de onderdelen van het plan;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.4.b
    text: een tegemoetkoming voor de in het plan opgenomen activiteiten anders dan begeleiding;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.4.c
    text: de eisen die worden gesteld aan de organisatie die het plan opstelt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.5
    text: 'Dit artikel is niet van toepassing op de belanghebbende die:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52a.5.a
    text: |-
      een ambt heeft aanvaard als bedoeld in [artikel 2, tweede lid][ref1], en daaruit inkomsten geniet ten bedrage van
      70% of meer van de berekeningsgrondslag, bedoeld in [artikel 53][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52a.5.b
    text: |-
      recht heeft op een voortgezette uitkering ingevolge [artikel 53a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52a.6
    text: Dit artikel is niet van toepassing gedurende de eerste drie maanden na het aftreden van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52a
  - number: 52b.1
    text: |-
      Onze Minister kan de belanghebbende, bedoeld in [artikel 52a][ref1], verplichten zich bij het gericht zoeken naar
      en verwerven van passende arbeid planmatig te laten begeleiden en ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52b.2
    text: |-
      Onze Minister verstrekt de belanghebbende een tegemoetkoming in de kosten van planmatige begeleiding en
      ondersteuning bij het gericht zoeken naar en verwerven van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52b
  - number: 52b.3
    text: |-
      De tegemoetkoming bedraagt ten hoogste 20% van de berekeningsgrondslag, bedoeld in [artikel 53, tweede lid][ref1].
      De verplichte planmatige begeleiding en ondersteuning, bedoeld in het eerste lid, wordt volledig vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52b.4
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52b
  - number: 52b.4.a
    text: de aanvraag voor tegemoetkoming in de kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52b
  - number: 52b.4.b
    text: de voor vergoeding in aanmerking komende kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52b
  - number: 52b.4.c
    text: de eisen die worden gesteld aan de organisatie die de planmatige ondersteuning uitvoert.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52b
  - number: 52c.1
    text: |-
      Indien de belanghebbende een bij of krachtens [artikel 52a][ref1] of [52b][ref2] geregelde verplichting niet of
      niet behoorlijk is nagekomen, besluit Onze Minister tot gehele of gedeeltelijke inhouding van de uitkering. Onze
      Minister is bevoegd tot verrekening van de inhouding van de uitkering met betalingen aan belanghebbende op grond
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel52b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 52b
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52c.2
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52c
  - number: 52d
    text: |-
      De voordracht voor een krachtens de [artikelen 52a][ref1], [52b][ref2] of [52c][ref3] vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-
      Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel52b
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel52c
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 52b
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 52c
        hoofdstuk: '10'
        afdeling: Derde
  - number: '53.1'
    text: De uitkering bedraagt gedurende het eerste jaar 80% en vervolgens 70% van de berekeningsgrondslag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53
  - number: '53.2'
    text: |-
      Indien de belanghebbende op de dag voor zijn aftreden als kamerlid de verhoging
      of een toelage genoot, bedoeld in [artikel 12, eerste lid][ref1], respectievelijk
      [artikel 11, eerste en tweede lid, van de Wet schadeloosstelling leden Tweede Kamer][ref2], wordt de
      berekeningsgrondslag verhoogd met het bedrag van die verhoging respectievelijk toelage, inbegrepen de daarover
      geldende aanspraak op eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '11'
  - number: '53.3'
    text: |-
      Indien Wij in de bezoldiging van het Rijkspersoneel een wijziging aanbrengen wordt de berekeningsgrondslag,
      eventueel verhoogd ingevolge het tweede lid, voor de toepassing van het eerste lid met ingang van het tijdstip van
      ingang van de bezoldigingswijziging door Onze Minister overeenkomstig de wijziging aangepast.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53
  - number: 53a.1
    text: |-
      Indien de belanghebbende op de dag waarop de duur van de uitkering eindigt geheel of gedeeltelijk algemeen invalide
      is, wordt, met inachtneming van [artikel 56][ref1], de uitkering voor de duur van de invaliditeit voortgezet op de
      voet van [artikel 53b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '56'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53b
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53a.2
    text: |-
      Algemeen invalide, geheel of gedeeltelijk, in de zin van deze wet is hij die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekten of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen. Onder de eerstgenoemde
      arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden
      in staat is. Onder deze arbeid wordt niet begrepen arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: 53a.3
    text: |-
      Bij de vaststelling van de mate van algemene invaliditeit wordt buiten beschouwing gelaten of de betrokkene de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53a
  - number: 53a.4
    text: |-
      Indien de betrokkene zonder redelijke grond weigert deel te nemen aan een voor hem gewenste opleiding of scholing
      of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, wordt er bij de vaststelling van de mate
      van algemene invaliditeit van uitgegaan dat die opleiding of scholing is afgerond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53a
  - number: 53a.5
    text: Bij een algemene invaliditeit van minder dan 25 percent wordt de uitkering niet voortgezet.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53a
  - number: 53b.1
    text: |-
      De voortzetting van de uitkering vindt plaats als aangegeven in het tweede en derde lid en vervolgens als
      aangegeven in het vierde en het vijfde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.2
    text: |-
      De uitkering bedraagt gedurende een periode als aangegeven in het derde lid 70% van de berekeningsgrondslag,
      eventueel verhoogd en aangepast volgens [artikel 53][ref1], bij een algemene invaliditeit van 80% of meer, 60% van
      die berekeningsgrondslag bij een algemene invaliditeit van 55% tot 80% en 40% van die berekeningsgrondslag bij een
      algemene invaliditeit van 25% tot 55%.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.3
    text: |-
      De in het tweede lid bedoelde periode is ten hoogste voor de belanghebbende die op het tijdstip van voortzetting
      van de uitkering:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.3.58
    text: 'jaar of ouder is: zes jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.3.53
    text: 'jaar of ouder is: drie jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.3.48
    text: 'jaar of ouder is: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.3.43
    text: 'jaar of ouder is: anderhalf jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.3.38
    text: 'jaar of ouder is: een jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.3.33
    text: 'jaar of ouder is: een half jaar, en'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.4
    text: |-
      De uitkering bedraagt na afloop van de volgens het derde lid bepaalde periode een percentage, volgens het
      tweede lid, van een bedrag gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen de
      berekeningsgrondslag, eventueel verhoogd en aangepast volgens [artikel 53][ref1], en het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.5
    text: |-
      Voor de berekening van het in het vierde lid bedoelde bedrag geldt een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de betrokkene op het tijdstip van voortzetting van de uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.6
    text: |-
      Het minimumloon, bedoeld in het vierde lid, is het tot een jaarbedrag herleide minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1] of, indien het een betrokkene jonger dan 23 jaar betreft, het tot een
      jaarbedrag herleide voor zijn leeftijd geldende minimumloon per maand, bedoeld in [artikel 7, derde lid][ref2],
      en [artikel 8, derde lid, van de genoemde wet][ref3], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 53b.7
    text: |-
      De belanghebbende heeft recht op een aanvulling van de uitkering, indien die uitkering minder bedraagt dan het
      volgens het tweede lid vastgestelde percentage van de berekeningsgrondslag, eventueel verhoogd en aangepast volgens
      [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.8
    text: |-
      De aanvulling is gelijk aan het bedrag dat nodig is om de uitkering te verhogen tot het in het zevende lid bedoelde
      percentage van de berekeningsgrondslag, eventueel verhoogd en aangepast volgens [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.9
    text: |-
      In afwijking van het achtste lid is de aanvulling gelijk aan het bedrag dat nodig is om de uitkering te verhogen
      tot het in het tiende lid aangegeven percentage van de berekeningsgrondslag, eventueel verhoogd en aangepast
      volgens [artikel 53][ref1], indien de belanghebbende de keuze heeft gemaakt voor een verlaging van de inhouding
      ingevolge [artikel 106, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 53b.10
    text: |-
      Het in het negende lid bedoelde percentage bedraagt bij een algemene invaliditeit van 80% of meer 65%, bij een
      algemene invaliditeit van 55% tot 80%: 56% en bij een algemene invaliditeit van 25% tot 55%: 37%.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
  - number: 53b.11
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 106, eerste lid][ref1], worden regels gesteld met
      betrekking tot de verlaging, bedoeld in het negende lid. Onze Minister stelt regels met betrekking tot de wijze
      en het tijdstip waarop het lid van de Tweede Kamer der Staten-Generaal of het gewezen lid van de Tweede Kamer der
      Staten-Generaal de in het negende lid bedoelde keuze, die eenmalig is, kenbaar dient te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 53b.12
    text: |-
      Indien de wegens algemene invaliditeit voortgezette uitkering te zamen met inkomsten, bedoeld in
      [artikel 54][ref1], minder bedraagt dan het minimumloon wordt de uitkering verhoogd tot het minimumloon. De
      verhoging bedraagt niet meer dan het verschil tussen de uitkering en het bedrag waarvan deze is afgeleid en tevens
      niet meer dan 30% van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53c.1
    text: |-
      De voortzetting van de uitkering, bedoeld in [artikel 53a][ref1], geschiedt op aanvraag van de belanghebbende en
      voor termijnen van niet langer dan drie jaar, onverminderd het in deze wet bepaalde over herziening of intrekking
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53c.2
    text: |-
      Onze Minister stelt de belanghebbende uiterlijk vier maanden voor het verstrijken van de in het eerste lid bedoelde
      termijn schriftelijk in kennis van de mogelijkheid tot het doen van een aanvraag tot voortzetting van de uitkering
      na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53c
  - number: 53c.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt door de belanghebbende uiterlijk drie maanden voor het
      verstrijken van de in het eerste lid bedoelde termijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53c
  - number: 53c.4
    text: |-
      Indien Onze Minister niet tijdig beslist op een tijdig ingediende aanvraag als bedoeld in het derde lid, wordt de
      uitkering voortgezet tot het tijdstip van de beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53c
  - number: 53c.5
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt geacht tijdig te zijn ingediend indien Onze Minister de
      kennisgeving, bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving als bedoeld
      in het tweede lid de aanvraag wordt ingediend binnen een maand nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53c
  - number: 53c.6
    text: |-
      Indien de uitkering na afloop van de in het eerste lid bedoelde termijn wordt voortgezet, wordt de uitkering
      berekend op de wijze die van toepassing zou zijn geweest indien die termijn niet zou zijn afgelopen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53c
  - number: 53c.7
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat in bepaalde situaties geen
      termijn geldt dan wel een termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn van drie jaar.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53c
  - number: 53d.1
    text: |-
      Binnen een jaar na het tijdstip waarop de uitkering voor de eerste maal met toepassing van [artikel 53a][ref1]
      is voortgezet, doet Onze Minister een onderzoek instellen ten einde te doen bezien of er als gevolg van gronden
      die invloed hebben op de mate van algemene invaliditeit redenen aanwezig zijn voor herziening of intrekking van
      de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53d.2
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat geen termijn geldt dan wel een
      termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
  - number: 53d.3
    text: |-
      Onze Minister wijzigt ambtshalve of op aanvraag van de belanghebbende het bedrag van de uitkering bij wijziging van
      de mate van algemene invaliditeit.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
  - number: 53d.4
    text: 'Een wijziging van het bedrag van de uitkering gaat in:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
  - number: 53d.4.a
    text: |-
      indien daartoe een aanvraag is ingediend, met ingang van de eerste dag van de maand volgende op die waarin de
      aanvraag is ingekomen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
  - number: 53d.4.b
    text: |-
      indien de wijziging ambtshalve plaatsvindt, met ingang van de eerste dag van de maand volgende op die waarin de
      beslissing tot wijziging is genomen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
  - number: 53d.5
    text: |-
      De toepassing van [artikel 53a][ref1] wordt ten aanzien van een belanghebbende gestaakt indien en zolang hij niet
      voldoet aan een uitnodiging van Onze Minister zich te onderwerpen aan een onderzoek door een of meer door hem
      aangewezen geneeskundigen ter beantwoording van de vraag, of er nog sprake is van algemene invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53d.6
    text: |-
      Indien degene die recht heeft op wegens algemene invaliditeit voortgezette uitkering inkomsten uit of in
      verband met arbeid geniet, is Onze Minister bevoegd, zolang niet vaststaat of deze arbeid als arbeid, bedoeld in
      [artikel 53a, tweede lid][ref1], kan worden aangemerkt, niet tot herziening of intrekking van de uitkering over te
      gaan. De toepassing van de eerste volzin vindt ten hoogste plaats over een aaneengesloten periode van drie jaren,
      aanvangende op de eerste dag waarover de inkomsten uit of in verband met arbeid als bedoeld in de eerste volzin
      worden genoten. Deze periode wordt geacht niet te zijn onderbroken indien korter dan een maand geen inkomsten uit
      of in verband worden genoten. Na afloop van de in de tweede volzin genoemde periode wordt de in de eerste volzin
      bedoelde arbeid aangemerkt als arbeid, bedoeld in [artikel 53a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53e.1
    text: |-
      Op verzoek van een kamerlid doet Onze Minister een onderzoek instellen door een of meer door hem aangewezen
      geneeskundigen, ter beantwoording van de vraag of het kamerlid dat het verzoek deed algemene invalide is als
      bedoeld in [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53e.2
    text: |-
      Onze Minister brengt de uitkomst van een onderzoek dat is ingesteld ingevolge het eerste lid ter kennis van de
      verzoeker.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel53e
  - number: '54.1'
    text: |-
      De inkomsten die de belanghebbende geniet, worden bepaald overeenkomstig de regels van de
      [Wet inkomstenbelasting 2001][ref1] en worden met de uitkering verrekend over de maand waarop deze inkomsten
      betrekking hebben of geacht kunnen worden betrekking te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '54.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder inkomsten verstaan het gezamenlijk bedrag dat de belanghebbende
      wegens het verrichten van activiteiten geniet als
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
  - number: 54.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 54.2.b
    text: belastbaar loon uit of in verband met arbeid en
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
  - number: 54.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '54.3'
    text: |-
      De in het eerste lid bedoelde verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag
      waarmede de uitkering, vermeerderd met die inkomsten, het bedrag, waarvan de uitkering is afgeleid, overschrijdt.
      Bij de verrekening wordt voor de hoogte van de uitkering de op grond van [artikel 52c, eerste lid][ref1],
      opgelegde inhouding buiten beschouwing gelaten. Wanneer naast recht op een uitkering krachtens deze afdeling
      recht bestaat op een wachtgeld of uitkering krachtens een andere regeling, niet zijnde een uitkering krachtens
      de [Wet schadeloosstelling, uitkering en pensioen leden Europees Parlement][ref2], vindt het vorenstaande ten
      aanzien van bedoeld wachtgeld of uitkering geen toepassing, indien de uitkering krachtens deze afdeling elders voor
      verrekening met wachtgeld of uitkering in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52c
      [ref2]: https://wetten.overheid.nl/BWBR0003251
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52c
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0003251
  - number: '54.4'
    text: |-
      Indien in het bedrag der inkomsten bedoeld in de vorige leden, is of geacht kan worden te zijn begrepen een
      vergoeding ter zake van de premie [Algemene Ouderdomswet][ref1] en [Algemene nabestaandenwet][ref2], blijft deze
      vergoeding voor de toepassing van dit artikel buiten beschouwing. De vorige volzin is slechts van toepassing voor
      zover de daar bedoelde inkomsten betrekking hebben op een tijdvak gelegen voor 1 juni 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '54.5'
    text: Kinderbijslag wordt niet aangemerkt als inkomst.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
  - number: '54.6'
    text: |-
      Voor de toepassing van dit artikel ten aanzien van de voortgezette uitkering bedoeld in
      [artikel 52, zesde lid][ref1], en [artikel 53a][ref2], kan Onze Minister andere inkomsten aanmerken als te zijn
      genoten wegens activiteiten bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 54a.1
    text: |-
      De belanghebbende is verplicht van het ter hand nemen van enige activiteiten als bedoeld in
      [artikel 54, tweede lid][ref1], terstond mededeling te doen aan Onze Minister, onder opgave, voor zover mogelijk,
      van de inkomsten, die hij uit die activiteiten zal trekken. Zijn de inkomsten niet vooraf op te geven, dan doet
      hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave van de inkomsten, die hij sinds het ter hand
      nemen van de activiteiten of sinds de vorige opgave heeft genoten. Onze Minister geeft nadere voorschriften
      aangaande het doen van mededelingen door de belanghebbende met betrekking tot de activiteiten, bedoeld in
      [artikel 54, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 54a.2
    text: |-
      Brengt de aard van de activiteiten of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast van
      een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het einde van de evenbedoelde termijn. Ten
      aanzien van deze verrekening is [artikel 54][ref1] van toepassing, met dien verstande, dat zij geschiedt over de in
      de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 54a.3
    text: |-
      Onze Minister kan bij de vaststelling van het bedrag van de vermindering van de opgave van de belanghebbende
      afwijken.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54a
  - number: 54a.4
    text: |-
      De belanghebbende, aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin
      toe te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit hoofdstuk noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel54a
  - number: '55.1'
    text: De uitkering, berekend over een maand, wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel55
  - number: '55.2'
    text: |-
      De uitkering wordt niet uitbetaald zolang de belanghebbende niet of niet op de voorgeschreven wijze voldoet aan
      zijn verplichtingen op grond van [artikel 54a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 54a
        hoofdstuk: '10'
        afdeling: Derde
  - number: '56.1'
    text: De uitkering eindigt met ingang van de dag volgende op die, waarop het gewezen kamerlid is overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel56
  - number: '56.2'
    text: 'De uitkering vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel56
  - number: 56.2.a
    text: met ingang van de dag waarop het gewezen kamerlid de leeftijd van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel56
  - number: 56.2.b
    text: |-
      met ingang van de dag waarop het gewezen kamerlid wederom als kamerlid optreedt dan wel lid wordt van het Europees
      Parlement;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel56
  - number: 56.2.c
    text: |-
      wanneer tijdens de duur van de uitkering zich de omstandigheid voordoet, bedoeld in
      [artikel 51, tweede lid, onder b][ref1]. Zodra die omstandigheid zich niet langer voordoet is het daar bepaalde van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel51
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '51'
        hoofdstuk: '10'
        afdeling: Derde
  - number: '56.3'
    text: |-
      De uitkering kan geheel of ten dele vervallen worden verklaard indien de belanghebbende herhaaldelijk niet of niet
      op de voorgeschreven wijze voldoet aan zijn verplichtingen op grond van [artikel 54a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 54a
        hoofdstuk: '10'
        afdeling: Derde
  - number: '57.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van het gewezen kamerlid wordt aan de weduwe of weduwnaar, van wie de
      overledene niet duurzaam gescheiden leefde, een bedrag uitgekeerd, gelijk aan driemaal het bedrag der uitkering,
      dat over de laatste volle maand aan het gewezen kamerlid is uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel57
  - number: '57.2'
    text: |-
      Laat de overledene geen weduwe of weduwnaar na, van wie hij, onderscheidenlijk zij, niet duurzaam gescheiden
      leefde, dan geschiedt de uitkering ten behoeve van de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond, of minderjarige kinderen waarover de overledene de pleegouderlijke zorg droeg.
      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind, als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen, dan geschiedt de uitkering, indien de overledene kostwinner was van ouders, meerderjarige
      kinderen, broeders of zusters, ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel57
  - number: '57.3'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het eerste en tweede lid na, dan kan het aldaar bedoelde
      bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel57
  - number: '58.1'
    text: |-
      Een kamerlid heeft na zijn aftreden recht op pensioen, indien hij op de dag van ingang van zijn aftreden de
      leeftijd van 65 jaar heeft bereikt, tenzij hij op dat tijdstip wederom als kamerlid optreedt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58
  - number: '58.2'
    text: |-
      Een kamerlid dat is afgetreden voor het bereiken van de leeftijd van 65 jaar, verkrijgt recht op pensioen bij het
      bereiken van die leeftijd, tenzij hij op dat tijdstip wederom als kamerlid optreedt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58
  - number: 58a.1
    text: |-
      Het pensioen bedraagt voor ieder jaar van de kamerlidtijd 2 percent van de daarvoor geldende pensioengrondslag,
      volgens een of meer van de [artikelen 59][ref1], [59a][ref2] en [59aa][ref3]. Voor de toepassing van die artikelen
      wordt verstaan onder berekeningsgrondslag: de berekeningsgrondslag, bedoeld in [artikel 50, onderdeel e][ref4],
      aangepast volgens de regels, bedoeld in [artikel 105, derde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel59aa
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '59'
        hoofdstuk: '11'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 59a
        hoofdstuk: '11'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 59aa
        hoofdstuk: '11'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '50'
        hoofdstuk: '9'
        afdeling: Derde
      - id: ref5
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 58a.2
    text: |-
      In afwijking van het eerste lid behoort niet tot de berekeningsgrondslag de verhoging
      van de schadeloosstelling per 1 januari 2001 ingevolge dan wel op de voet van
      [artikel 3 van de Wet brutering overhevelingstoeslag lonen 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006353
        artikel: '3'
  - number: 58a.3
    text: |-
      Indien het gewezen kamerlid tevens is opgetreden als voorzitter, ondervoorzitter dan wel
      als fractievoorzitter wordt het pensioen voor ieder jaar dat het kamerlid als zodanig is
      opgetreden, verhoogd met 1,75 percent van de laatstelijk uit dien hoofde genoten toelage of
      verhoging van de schadeloosstelling, bedoeld in [artikel 11, eerste en tweede lid][ref1], en
      [artikel 12, eerste lid, van de Wet schadeloosstelling leden Tweede Kamer][ref2], inbegrepen de daarover geldende
      aanspraak op eindejaarsuitkering, bedoeld in [artikel 2b van die wet][ref3] en aangepast volgens de regels, bedoeld
      in [artikel 105, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel2b
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004939
        artikel: 2b
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 58a.4
    text: |-
      Als kamerlidtijd telt mee de tijd met recht op uitkering. Het pensioen over die tijd wordt berekend naar 2 percent
      per jaar over de eerste vier jaren van het recht op uitkering dan wel over de volledige tijd met recht op uitkering
      indien die tijd minder is dan vier jaren en vervolgens naar 1 percent per jaar. In het geval van een uitkering als
      bedoeld in [artikel 53a][ref1], wordt het pensioen over de tijd met recht op uitkering berekend naar 2 percent per
      jaar voor zover en voor zolang het percentage van de algemene invaliditeit 55 percent of meer bedraagt. Voor de
      toepassing van de vorige volzin wordt een uitkering als bedoeld in [artikel 51][ref2] aangemerkt als een uitkering
      als bedoeld in [artikel 53a][ref3], indien en zolang de belanghebbende tijdens de duur van de eerstbedoelde
      uitkering voor 55 percent of meer algemeen invalide is.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '51'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 58a.5
    text: |-
      In afwijking van het vierde lid wordt het pensioen over de in dat lid bedoelde tijd berekend naar de helft van het
      ingevolge dat lid toepasselijke percentage, over het gedeelte van die tijd waarin de uitkering is verminderd wegens
      het genieten van inkomsten als bedoeld in [artikel 54][ref1]. Geen meetelling van kamerlidtijd als bedoeld in het
      vierde lid vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 58a.5.a
    text: |-
      voor zover gedurende de in dat lid bedoelde tijd de uitkering wegens het genieten van inkomsten als bedoeld in
      [artikel 54][ref1] tot nihil is verminderd;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 58a.5.b
    text: |-
      in zover de belanghebbende die recht heeft op uitkering, maar die minder uitkering geniet dan de krachtens
      [artikel 106][ref1] berekende inhoudingen ter zake van ouderdom en overlijden, er geen zorg voor draagt dat het
      bedrag van deze inhoudingen, welk bedrag in dit geval als een op hem rustende schuld wordt beschouwd, bij het
      bereiken van de 65-jarige leeftijd is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 58a.5.c
    text: indien de belanghebbende daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
  - number: 58a.6
    text: |-
      Een kamerlid en een gewezen kamerlid hebben bij ingang van het pensioen eenmalig de keuzemogelijkheid het pensioen
      met 12 percent te verhogen, voorzover het is berekend over kamerlidtijd die is gelegen na 30 juni 1999 en die
      overeenkomt met de tijd die krachtens [artikel 67][ref1] voor de berekening van het nabestaandenpensioen in
      aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '67'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: 58a.7
    text: |-
      Met de verhoging van het pensioen, bedoeld in het zesde lid, vervalt de aanspraak op nabestaandenpensioen,
      voorzover opgebouwd na 30 juni 1999.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
  - number: 58a.8
    text: |-
      De keuze, bedoeld in het zesde lid, kan slechts worden gedaan met toestemming van de echtgenoot of de aangemelde
      partner. Onze Minister kan nadere regels stellen met betrekking tot het doen van de keuze.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
  - number: 58a.9
    text: |-
      De verhoging van het pensioen gaat in met ingang van de dag waarop het recht op pensioen ontstaat en is
      onherroepelijk.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58a
  - number: 58b.1
    text: |-
      Een gewezen kamerlid kan na afloop van de uitkeringsduur, bedoeld in [artikel 52, eerste of tweede lid][ref1], de
      vanaf 1 augustus 2003 opgebouwde aanspraken op eigen pensioen omzetten in een aanspraak op nabestaandenpensioen bij
      overlijden voor het bereiken van de leeftijd van 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 58b.2
    text: |-
      Voor de omzetting van het eigen pensioen, bedoeld in het eerste lid, stelt Onze Minister bij ministeriële regeling
      een leeftijdsafhankelijke ruilvoet vast.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58b
  - number: 58b.3
    text: |-
      Onze Minister informeert het gewezen kamerlid binnen vier maanden voor het einde van de uitkering over de
      mogelijkheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58b
  - number: 58b.4
    text: |-
      Het gewezen kamerlid dient zijn keuze binnen zes weken na ontvangst van deze mededeling schriftelijk aan Onze
      Minister mee te delen. Tot het moment van het eindigen van de termijn van zes weken, verkrijgt het gewezen kamerlid
      een premievrije aanspraak op nabestaandenpensioen overeenkomstig de tijd tot het moment van aftreden van het
      kamerlid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58b
  - number: 58b.5
    text: |-
      Als omzetting als bedoeld in het eerste lid gevolgd wordt door een waardeoverdracht als bedoeld in
      [artikel 107][ref1], wordt de vermindering van het eigen pensioen aangepast. De aanspraak op nabestaandenpensioen
      als bedoeld in het eerste lid, wordt omgezet in een aanspraak op eigen pensioen met inachtneming van de ruilvoet,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel107
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '107'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 58b.6
    text: |-
      Als een gewezen kamerlid op enig moment opnieuw kamerlid wordt, wordt de vermindering van het eigen pensioen,
      bedoeld in het eerste lid, aangepast. De aanspraak op nabestaandenpensioen als bedoeld in het eerste lid, wordt
      omgezet in een aanspraak op eigen pensioen met inachtneming van de ruilvoet, bedoeld in het tweede lid, behorende
      bij de leeftijd van het kamerlid op het moment dat hij opnieuw lid van de Tweede Kamer wordt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58b
  - number: 58b.7
    text: |-
      Het vijfde en zesde lid zijn niet van toepassing bij het einde van het huwelijk na aftreden van het kamerlid en
      voor waardeoverdracht of voor het opnieuw lid worden van de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel58b
  - number: '59.1'
    text: Voor tijd vóór 1 januari 1986 is de pensioengrondslag de berekeningsgrondslag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59
  - number: '59.2'
    text: |-
      De berekeningsgrondslag wordt voor de toepassing van het eerste lid vermenigvuldigd met 100/110 indien de
      schadeloosstelling laatstelijk is genoten tussen 31 december 1985 en 1 januari 1995. De aldus vastgestelde
      pensioengrondslag is echter niet lager dan de schadeloosstelling verminderd met € 2 867,89 . Het bedrag van
      € 2 867,89 wordt telkens gewijzigd bij de ministeriële regeling, bedoeld in [artikel 105, derde lid][ref1],
      overeenkomstig de aanpassing van een bedrag dat, omgerekend naar euro’s, op 1 januari 1985 € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '59.3'
    text: |-
      De berekeningsgrondslag wordt voor de toepassing van het eerste lid vermenigvuldigd met een debruteringsfactor
      overeenkomstig [artikel 59a, tweede lid][ref1], indien de schadeloosstelling laatstelijk is genoten na 31 december
      1994. Op het aldus gevonden bedrag is het tweede lid van dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel59a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 59a
        hoofdstuk: '11'
        afdeling: Derde
  - number: '59.4'
    text: |-
      [Hoofdstuk 17][ref1] is van toepassing op het pensioen, indien of voorzover berekend over de in het eerste lid
      bedoelde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 59a.1
    text: |-
      Voor tijd tussen 31 december 1985 en 1 januari 1995 is de pensioengrondslag de berekeningsgrondslag verminderd met
      een bedrag, genaamd franchise.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59a
  - number: 59a.2
    text: |-
      De berekeningsgrondslag wordt voor de toepassing van het eerste lid vermenigvuldigd met een
      debruteringsfactor indien de schadeloosstelling laatstelijk is genoten na 31 december 1994. Deze
      factor is de breuk, waarvan de teller honderd bedraagt en de noemer de som is van honderd en het
      percentage waarmee het inkomen als kamerlid per 1 januari 1995 uitsluitend ter uitvoering van
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________________________________ (Stb. 418) is
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006684#ArtikelII
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0006684
        artikel: II
  - number: 59a.3
    text: 'De in het eerste lid bedoelde franchise is:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59a
  - number: 59a.3.a
    text: |-
      voor het gepensioneerde kamerlid dat voor de toepassing van de [Algemene Ouderdomswet][ref1] als gehuwd wordt
      aangemerkt twintig zevende maal het tot een jaarbedrag herleide bedrag dat geldt voor een gehuwde per 1 januari van
      het jaar waarin het recht op pensioen ontstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 59a.3.b
    text: |-
      voor het gepensioneerde kamerlid dat voor de toepassing van de [Algemene Ouderdomswet][ref1] als ongehuwd wordt
      aangemerkt tien zevende maal het tot een jaarbedrag herleide bedrag dat geldt voor een ongehuwde per 1 januari van
      het jaar waarin het recht op pensioen ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 59a.4
    text: |-
      In de in het derde lid bedoelde bedragen is mede begrepen de bruto vakantie-uitkering waarop ingevolge de
      [Algemene Ouderdomswet][ref1] recht bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 59a.5
    text: |-
      Wanneer de in het derde lid bedoelde bedragen op grond van persoonlijke omstandigheden worden gewijzigd, wordt de
      pensioengrondslag herberekend. Het herberekende pensioen gaat, onverminderd [artikel 59c, tweede lid][ref1], in op
      dezelfde dag als waarop de bedoelde wijzigingen zich hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel59c
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 59c
        hoofdstuk: '11'
        afdeling: Derde
  - number: 59aa
    text: |-
      [Artikel 59a, eerste lid][ref1], is van toepassing op tijd na 31 december 1994, met dien verstande dat de franchise
      bij of krachtens algemene maatregel van bestuur wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel59a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59aa
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 59a
        hoofdstuk: '11'
        afdeling: Derde
  - number: 59b.1
    text: |-
      Het gepensioneerde kamerlid heeft recht op een toeslag op zijn pensioen indien dat pensioen is berekend met
      toepassing van de franchise bedoeld in [artikel 59a, derde lid, onderdeel a][ref1], en indien de kalendertijd,
      waarin de voor de berekening van zijn pensioen meetellende diensttijd is gelegen, geheel of gedeeltelijk samenvalt
      met kalendertijd, die in aanmerking is genomen bij de berekening van enig pensioen waarop zijn echtgenoot recht
      heeft, mits op laatstbedoeld pensioen een vermindering is toegepast uit hoofde van recht op ouderdomspensioen
      ingevolge de [Algemene Ouderdomswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 59a
        hoofdstuk: '11'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002221
  - number: 59b.2
    text: |-
      Voor de toepassing van dit artikel wordt mede als echtgenoot aangemerkt degene die voor de toepassing van de
      [Algemene Ouderdomswet][ref1] als echtgenoot van het gepensioneerde kamerlid wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 59b.3
    text: |-
      De in het eerste lid bedoeld toeslag bedraagt voor elk voor de berekening van het pensioen meetellend jaar binnen
      de samenlopende kalendertijd 0,525 percent van de franchise bedoeld in [artikel 59a, derde lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel59a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 59a
        hoofdstuk: '11'
        afdeling: Derde
  - number: 59b.4
    text: |-
      De toeslag wordt slechts toegekend op verzoek en gaat in op de dag waarop de in het eerste lid bedoelde
      omstandigheid is opgetreden, met dien verstande dat de toeslag niet vroeger ingaat dan een jaar voor de eerste dag
      van de maand waarin het verzoek is ingediend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59b
  - number: 59b.5
    text: |-
      Voor de toepassing van [hoofdstuk 5][ref1] wordt de toeslag ingevolge dit artikel niet onder pensioen begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '5'
        afdeling: Tweede
  - number: 59c.1
    text: |-
      Indien in het bedrag van het ouderdomspensioen, waaronder medebegrepen een eventuele toeslag en de vakantie-
      uitkering, ingevolge de [Algemene Ouderdomswet][ref1] een wijziging wordt aangebracht op grond van persoonlijke
      omstandigheden, is degene aan wie een pensioen krachtens dit hoofdstuk is toegekend over diensttijd vóór 1 januari
      1995, gehouden daarvan onverwijld kennis te geven aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 59c.2
    text: |-
      Indien de in het eerste lid bedoelde wijziging leidt tot verhoging van het pensioen krachtens dit hoofdstuk, gaat
      die verhoging niet vroeger in dan een jaar voor de eerste dag van de maand waarin de daarbedoelde kennisgeving werd
      gedaan of waarin die verhoging ambtshalve plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59c
  - number: 59c.3
    text: In bijzondere gevallen kan Onze Minister het tweede lid buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel59c
  - number: '60.1'
    text: De nabestaande van een kamerlid, gewezen kamerlid of gepensioneerd kamerlid heeft recht op pensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel60
  - number: '60.2'
    text: 'In afwijking van het eerste lid bestaat geen recht op nabestaandenpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel60
  - number: 60.2.a
    text: indien het huwelijk is gesloten nadat het gepensioneerde kamerlid de leeftijd van 65 jaar had bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel60
  - number: 60.2.b
    text: |-
      bij overlijden van een gewezen kamerlid vóór het bereiken van de leeftijd van 65 jaar, voorzover de pensioengeldige
      tijd van de overledene is gelegen na 31 juli 2003;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel60
  - number: 60.2.c
    text: |-
      bij overlijden van een gepensioneerd kamerlid, voorzover de pensioengeldige tijd van de overledene is gelegen na 30
      juni 1999 en de keuze is gedaan, bedoeld in [artikel 58a, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel58a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 58a
        hoofdstuk: '11'
        afdeling: Derde
  - number: '60.3'
    text: |-
      Voor de toepassing van het tweede lid geldt niet als gewezen kamerlid het gewezen kamerlid met recht op uitkering
      als bedoeld in [artikel 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel51
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '51'
        hoofdstuk: '10'
        afdeling: Derde
  - number: '62.1'
    text: |-
      Recht op bijzonder nabestaandenpensioen heeft de vrouw of man met wie een overleden kamerlid, gewezen kamerlid of
      gepensioneerd kamerlid gehuwd is geweest, mits:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: 62.1.a
    text: |-
      hij of zij recht op nabestaandenpensioen zou hebben gehad, indien het kamerlid, het gewezen kamerlid of
      gepensioneerd kamerlid op de dag van het vonnis, waarbij de echtscheiding of de ontbinding van het huwelijk is
      uitgesproken, zou zijn overleden, en
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: 62.1.b
    text: |-
      de onder *a* bedoelde dag ligt na het tijdstip van de inwerkingtreding van de Wet herziening echtscheidingsrecht en
      de echtscheiding of ontbinding van het huwelijk niet is uitgesproken met toepassing van het voor genoemd tijdstip
      geldende recht.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: '62.2'
    text: |-
      Eveneens heeft recht op bijzonder nabestaandenpensioen de vrouw of man van wie de aanmelding is geëindigd, mits zij
      of hij recht op nabestaandenpensioen zou hebben gehad, indien het kamerlid, het gewezen kamerlid of gepensioneerde
      kamerlid op de dag van eindigen van de aanmelding zou zijn overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: '62.3'
    text: 'In afwijking van het eerste en het tweede lid bestaat geen recht op bijzonder nabestaandenpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: 62.3.a
    text: |-
      indien het kamerlid, gewezen kamerlid of gepensioneerde kamerlid en de desbetreffende vrouw of man dat zijn
      overeengekomen bij huwelijkse voorwaarden, bij geschrift met het oog op het einde van het huwelijk of de
      aanmelding, en Onze Minister daarmee instemt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: 62.3.b
    text: |-
      indien de onder a bedoelde vrouw of man als gevolg van hertrouwen met of aanmelding door hetzelfde kamerlid wegens
      diens overlijden recht op nabestaandenpensioen heeft;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: 62.3.c
    text: |-
      bij overlijden van een kamerlid of gewezen kamerlid voor de leeftijd van 65 jaar, voorzover de pensioengeldige tijd
      van de overledene is gelegen na 31 juli 2003;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
  - number: 62.3.d
    text: |-
      bij overlijden van een gepensioneerd kamerlid, voorzover de pensioengeldige tijd van de overledene is gelegen na 30
      juni 1999 en de keuze is gedaan, bedoeld in [artikel 58a, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel58a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 58a
        hoofdstuk: '11'
        afdeling: Derde
  - number: '63'
    text: |-
      Na het overlijden van een kamerlid, gewezen kamerlid of gepensioneerd kamerlid hebben recht op wezenpensioen zijn
      kinderen die de leeftijd van eenentwintig jaren nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn
      dan wel niet partij zijn of partij zijn geweest bij een aanmelding, mits zij zijn geboren of geadopteerd voor zijn
      aftreden is ingegaan of in de periode waarin hij recht heeft op uitkering ter zake van het aftreden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel63
  - number: '64'
    text: |-
      Kinderen ten opzichte van welke aan een mannelijk kamerlid ten tijde van zijn overlijden een
      onderhoudsplicht krachtens [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1] dan wel
      [artikel 394 van Boek 1 van het Burgerlijk Wetboek BES][ref2] was opgelegd, dan wel door hem bij authentieke akte
      een dergelijke verplichting was erkend, hebben onder dezelfde voorwaarden als genoemd in [artikel 63][ref3] recht
      op wezenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel394
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel63
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '394'
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '63'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: '65.1'
    text: |-
      Kinderen voor welke het kamerlid, gewezen kamerlid of gepensioneerde kamerlid ten tijde van zijn overlijden
      de pleegouderlijke zorg droeg, hebben onder dezelfde voorwaarden als genoemd in [artikel 63][ref1], recht op
      wezenpensioen met dien verstande dat in plaats van het tijdstip van geboorte of adoptie het tijdstip van aanvang
      van de pleegouderlijke zorg in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel63
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '63'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: '65.2'
    text: |-
      Onder pleegouderlijke zorg bedoeld in het vorige lid wordt verstaan de zorg voor het onderhoud en de opvoeding
      van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een
      vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel65
  - number: '66.1'
    text: |-
      Indien een kamerlid, gewezen kamerlid of gepensioneerd kamerlid naar het oordeel van Onze Minister is vermist,
      hebben degenen die aan zijn overlijden recht op pensioen zouden ontlenen, recht op tijdelijk pensioen op dezelfde
      voet als in de voorgaande artikelen van dit hoofdstuk is omschreven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel66
  - number: '66.2'
    text: |-
      Het tijdelijk pensioen gaat van rechtswege over in een voortdurend pensioen zodra het overlijden van de vermiste
      vaststaat.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel66
  - number: '67.1'
    text: |-
      Het nabestaandenpensioen bedraagt vijf zevende gedeelte van het pensioen, waarop het overleden kamerlid als
      zodanig aanspraak zou hebben gehad, indien hij met ingang van de dag na die van zijn overlijden was ontslagen,
      of waarop het overleden gewezen kamerlid als zodanig recht of uitzicht had, een en ander met inachtneming van
      [artikel 60, tweede lid, onder b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel60
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '60'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: '67.2'
    text: 'In afwijking van het vorige lid bedraagt het pensioen van de nabestaande van hem die overlijdt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67
  - number: 67.2.a
    text: |-
      als kamerlid vóór het bereiken van de leeftijd van 65 jaar, vijf zevende gedeelte van het pensioen waarop
      dat kamerlid aanspraak zou hebben kunnen maken, indien hij tot het bereiken van evengenoemde leeftijd het
      kamerlidmaatschap zou hebben bekleed;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67
  - number: 67.2.b
    text: |-
      als gewezen kamerlid in de periode, waarover hem een uitkering is toegekend, vijf zevende gedeelte van het
      pensioen waarop het gewezen kamerlid aanspraak zou hebben kunnen maken, indien hij tot het bereiken van de leeftijd
      van 65 jaar recht op uitkering zou hebben gehad, met dien verstande dat voor de berekening van het pensioen de
      kamerlidtijd wordt doorgeteld naar de mate van medetelling van kamerlidtijd op de dag van overlijden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67
  - number: '67.3'
    text: |-
      Indien wegens eenzelfde sterfgeval voor een nabestaande recht ontstaat zowel op nabestaandenpensioen
      krachtens deze afdeling als op een nabestaandenpensioen krachtens of op de voet van de [tweede][ref1]
      of [vijfde afdeling van deze wet][ref2], wordt voor de berekening van de eigen pensioenen waarvan de
      nabestaandenpensioenen zijn afgeleid, tijd die zowel voor de berekening van eerstbedoeld pensioen als voor de
      berekening van het andere pensioen medetelt en niet daadwerkelijk gelijktijdig in de verschillende ambten is
      doorgebracht, slechts medegeteld voor de berekening van het pensioen, waarbij die tijd het hoogste bedrag oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Vijfde
  - number: '67.4'
    text: |-
      Bij de toepassing van de voorgaande leden wordt ten aanzien van het eigen pensioen voor zover
      [artikel 59a][ref1] daarop van toepassing is, in alle gevallen gerekend met de franchise bedoeld in
      [artikel 59a, derde lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel59a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 59a
        hoofdstuk: '11'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 59a
        hoofdstuk: '11'
        afdeling: Derde
  - number: 67a.1
    text: |-
      De nabestaande die jonger is dan 65 jaar maar geen recht heeft op nabestaandenuitkering ingevolge
      de [Algemene nabestaandenwet][ref1], zoals die wet geldt op 1 januari van het jaar waarin recht op
      nabestaandenpensioen ontstaat heeft recht op een toeslag op zijn volgens [artikel 67][ref2] berekende pensioen,
      indien dat is berekend of mede berekend over diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '67'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: 67a.2
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na 31 december
      1985 2,5 procent van 75 procent van het tot een jaarbedrag herleide bedrag van de nabestaandenuitkering en de
      vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 67a.3
    text: |-
      De nabestaande, bedoeld in het eerste lid, die jonger is dan 40 jaar, heeft recht op de in dat lid bedoelde toeslag
      voor de duur van 12 maanden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67a
  - number: 67a.4
    text: |-
      De toeslag gaat in met ingang van de maand waarin het recht daarop ontstaat en wordt met ingang van 1 januari van
      ieder jaar aangepast volgens de regels, bedoeld in [artikel 105, eerste lid][ref1], vanaf 1 juli 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 67a.5
    text: 'Het recht op toeslag vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67a
  - number: 67a.5.a
    text: met ingang van de eerste dag van de maand waarin de nabestaande 65 jaar wordt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67a
  - number: 67a.5.b
    text: |-
      met ingang van de maand volgend op die waarin de nabestaande hertrouwt, als partner wordt aangemeld of als
      samenwonend als bedoeld in de [Algemene nabestaandenwet][ref1] wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 67b.1
    text: |-
      De nabestaande die recht heeft op nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1], waarop
      inkomen in mindering wordt gebracht, heeft recht op een toeslag op zijn volgens [artikel 67][ref2] berekende
      pensioen, indien dat is berekend of mede berekend over diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '67'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: 67b.2
    text: |-
      Recht op toeslag heeft eveneens de nabestaande aan wie in het tijdvak van 1 juli 1996 tot 1 juli 1999
      nabestaandenpensioen is toegekend en op wiens uitkering ingevolge de [Algemene nabestaandenwet][ref1] in dat
      tijdvak inkomen in mindering is gebracht, met ingang van die vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 67b.3
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na 31
      december 1985 2,5 percent van het verschil tussen 75 percent van het tot een jaarbedrag herleide bedrag van de
      nabestaandenuitkering en de vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1], zoals die wet geldt
      op 1 januari van het jaar waarin recht op nabestaandenpensioen ontstaat, zonder de vermindering en het verminderde
      bedrag. De toeslag bedraagt niet meer dan 75 percent van het in de eerste volzin eerstbedoelde bedrag en kan niet
      negatief zijn. De toeslag wordt nader vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 67b.3.a
    text: |-
      met ingang van 1 januari van ieder jaar volgens de regels, bedoeld in [artikel 105, eerste lid][ref1], vanaf 1
      juli 1999;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 67b.3.b
    text: |-
      bij iedere nadere vaststelling van de verminderdering van een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 67b.4
    text: |-
      [Artikel 67a, vierde en vijfde lid][ref1], zijn mede van toepassing op de toeslag ingevolge dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 67a
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: 67c.1
    text: |-
      De nabestaande die recht heeft op nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1] en op
      1 januari 1998 55 jaar of ouder is, heeft recht op een toeslag op zijn volgens [artikel 67][ref2] berekende
      pensioen, indien dat is berekend of mede berekend over diensttijd na 31 december 1985, indien en voor zo lang
      hij recht heeft op een nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref3], die krachtens
      [artikel 67, derde of negende lid van die wet][ref4] vanaf 1 januari 1998 wordt verminderd wegens de omstandigheid
      dat de nabestaande vanaf een tijdstip voor 1 juli 1996 met dezelfde persoon onafgebroken ongehuwd samenwoont.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0007795
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67c
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '67'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0007795
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '67'
  - number: 67c.2
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na 31
      december 1985 2,5 procent van het verschil tussen 75 procent van het tot een jaarbedrag herleide bedrag van de
      nabestaandenuitkering en de vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1] zonder vermindering
      en het verminderde bedrag. De toeslag bedraagt niet meer dan 75 procent van het in de eerste volzin eerstbedoelde
      bedrag. De toeslag wordt vanaf 1 januari 1998 vastgesteld met inachtneming van de vanaf die datum geldende bedragen
      krachtens de [Algemene nabestaandenwet][ref2] en wordt vervolgens nader vastgesteld met ingang van 1 januari en 1
      juli aan de hand van de ontwikkeling van die bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67c
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0007795
  - number: 67c.3
    text: 'Het recht op de toeslag vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67c
  - number: 67c.3.a
    text: met ingang van de eerste dag van de maand waarin de nabestaande de 65-jarige leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67c
  - number: 67c.3.b
    text: met ingang van de maand volgend op die waarin de nabestaande trouwt of partij is bij een aanmelding;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67c
  - number: 67c.3.c
    text: |-
      met ingang van de eerste dag van de maand waarin de vermindering van de nabestaandenuitkering, bedoeld in het
      eerste lid, ongedaan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67c
  - number: 67c.4
    text: |-
      [Artikel 67a, vierde lid][ref1], is van overeenkomstige toepassing. [Artikel 67b][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel67b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel67c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 67a
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 67b
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '68.1'
    text: |-
      Het bijzonder nabestaandenpensioen bedraagt vijf zevende gedeelte van een eigen pensioen waarbij in aanmerking
      wordt genomen:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel68
  - number: 68.1.a
    text: |-
      de berekeningsgrondslag waarnaar het pensioen van het kamerlid, gewezen kamerlid of gepensioneerd kamerlid zou zijn
      berekend indien deze op de dag van ontbinding van het huwelijk dan wel van het einde van de aanmelding als partner
      recht op pensioen zou hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel68
  - number: 68.1.b
    text: |-
      pensioengeldige tijd die is gelegen vóór de onder a bedoelde dag, met dien verstande dat in de gevallen bedoeld in
      [artikel 62, derde lid, onder c en d][ref1], uitsluitend tijd vóór respectievelijk 1 augustus 2003 en 1 juli 1999
      in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel62
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '62'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: '68.2'
    text: |-
      Indien er recht bestaat op meer dan een bijzonder nabestaandenpensioen als bedoeld in
      [artikel 62, eerste of tweede lid][ref1], vindt het eerste lid overeenkomstige toepassing met dien verstande, dat
      voor de berekening van het bijzonder nabestaandenpensioen ontleend aan elk huwelijk en elke aanmelding waaraan een
      eerder huwelijk dan wel een eerdere aanmelding voorafgaat slechts de kamerlidtijd medetelt die samenloopt of geacht
      kan worden samen te lopen met de huwelijksduur dan wel de duur van de aanmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel62
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '62'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: '68.3'
    text: |-
      [Artikel 67, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '67'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '68.4'
    text: |-
      Indien er bij een overlijden recht bestaat op een of meer bijzondere nabestaandenpensioenen wordt het
      nabestaandenpensioen dat aan hetzelfde overlijden wordt ontleend met het bedrag daarvan verminderd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel68
  - number: '69'
    text: |-
      Indien een nabestaande hertrouwt, partij is bij een aanmelding of wordt aangemerkt als ongehuwd samenwonend als
      bedoeld in de [Algemene nabestaandenwet][ref1], wordt zijn pensioen opnieuw vastgesteld met ingang van de daarop
      volgende maand. Daarbij wordt uitsluitend de voor pensioen in aanmerking komende tijd van het kamerlid, het
      gewezen kamerlid of het gepensioneerde kamerlid in aanmerking genomen, die gelegen is voor het tijdstip van diens
      overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '70.1'
    text: 'Het wezenpensioen bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70
  - number: 70.1.a
    text: |-
      voor elk kind, wiens ouder aan het overlijden van het kamerlid, gewezen kamerlid of gepensioneerd kamerlid recht op
      pensioen ontleent, een zevende gedeelte;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70
  - number: 70.1.b
    text: |-
      voor elk ander kind, twee zevende gedeelte, van het pensioen van de overledene, berekend overeenkomstig
      [artikel 67][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '67'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '70.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder ouder mede begrepen de nabestaande, die op het tijdstip van diens
      overlijden de pleegouderlijke zorg had van het kind, bedoeld in [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel65
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '65'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: 70a.1
    text: Dit artikel is uitsluitend van toepassing op pensioenberekeningen over diensttijd na 31 december 1985.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70a
  - number: 70a.2
    text: |-
      De wees die geen recht heeft op wezenuitkering ingevolge de [Algemene nabestaandenwet][ref1] heeft recht op een
      toeslag op zijn volgens [artikel 70][ref2] berekende pensioen, tenzij zijn ouder recht heeft op halfwezenuitkering
      ingevolge de [Algemene nabestaandenwet][ref3]. Deze toeslag bedraagt jaarlijks voor elk voor de berekening van het
      wezenpensioen tellend jaar:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0007795
  - number: 70a.2.a
    text: |-
      voor de wees, bedoeld in [artikel 70, eerste lid, onder a][ref1], 0,375 percent van de tot een jaarbedrag herleide
      som van de nabestaandenuitkering en de halfwezenuitkering ingevolge de [Algemene nabestaandenwet][ref2], zoals
      die wet geldt op 1 januari van het jaar waarin recht op nabestaandenpensioen ontstaat, vermeerderd met de daarover
      berekende vakantie-uitkering ingevolge die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0007795
  - number: 70a.2.b
    text: |-
      voor de wees bedoeld in [artikel 70, eerste lid, onder b][ref1], 0,75 percent van het onder a bedoelde jaarbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel70
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: 70a.3
    text: |-
      Indien aanspraak ontstaat op de toeslag, bedoeld in het tweede lid, geeft de wees hiervan onverwijld kennis aan
      Onze Minister. De toeslag gaat niet eerder in dan een jaar voor de eerste dag van de maand waarin de kennisgeving
      werd gedaan of waarin die toeslag ambtshalve is toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70a
  - number: 70a.4
    text: |-
      De toeslag gaat in met ingang van de maand waarin het recht daarop ontstaat en wordt met ingang van 1 januari van
      ieder jaar aangepast volgens de regels, bedoeld in [artikel 105, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '71.1'
    text: |-
      Onze Minister maakt een herberekening van het wezenpensioen overeenkomstig de [artikelen 70][ref1] en [70a][ref2],
      wanneer het nabestaandenpensioen of het bijzonder nabestaandenpensioen van de ouder wegens diens overlijden is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel70a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 70a
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '71.2'
    text: |-
      Wanneer het nabestaandenpensioen van de ouder krachtens [artikel 69][ref1] wegens hertrouwen of
      een aanmelding opnieuw wordt vastgesteld, verhoogt Onze Minister het wezenpensioen bedoeld in
      [artikel 70, eerste lid, onder a][ref2], met een bedrag, dat zich verhoudt tot het bedrag van dat wezenpensioen,
      zoals het verschil tussen het nabestaandenpensioen bedoeld in [artikel 60][ref3], vóór en na toepassing van
      [artikel 69][ref4] zich verhoudt tot dat nabestaandenpensioen vóór die toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel69
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '69'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '60'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '69'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '71.3'
    text: |-
      Voor de toepassing van dit artikel is [artikel 70, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel70
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '72.1'
    text: |-
      Het gezamenlijk bedrag van de wezenpensioenen gaat een bedrag gelijk aan vijf zevende gedeelte van het bedrag
      waarvan die pensioenen zijn afgeleid niet te boven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel72
  - number: '72.2'
    text: |-
      Indien wegens toepassing van het eerste lid de wezenpensioenen worden verminderd, geschiedt deze vermindering in
      evenredigheid naar de omvang van die pensioenen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel72
  - number: '72.3'
    text: |-
      Bij de toepassing van dit artikel wordt de toeslag, bedoeld in [artikel 73a][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel73a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 73a
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '73.1'
    text: |-
      De nabestaande die de leeftijd van 65 jaar nog niet heeft bereikt, heeft tot de eerste dag van de maand waarin hij
      die leeftijd bereikt recht op een toeslag op zijn volgens de voorgaande artikelen berekende pensioen ten bedrage
      van 15 percent van dat pensioen voorzover berekend over tijd vóór 1 augustus 2003 en van 7,5 percent voorzover
      berekend over tijd na 31 juli 2003, behoudens het bepaalde in het tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel73
  - number: '73.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder een pensioen als daar bedoeld verstaan het pensioen nadat
      eventueel [hoofdstuk 17][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '73.3'
    text: |-
      Dit artikel is niet van toepassing ten aanzien van degene die recht heeft op bijzonder nabestaandenpensioen, noch
      degene wiens nabestaandenpensioen wegens hertrouwen of een aanmelding opnieuw is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel73
  - number: '73.4'
    text: |-
      De in het eerste lid bedoelde toeslag bedraagt ten hoogste vijftien percent van f 72.309,80 . Dit bedrag wordt
      telkens gewijzigd bij de ministeriële regeling, bedoeld in [artikel 105, derde lid][ref1], overeenkomstig de
      aanpassing van een bedrag dat, omgerekend naar euro's, op 1 januari 1985  € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 73a.1
    text: |-
      De wees bedoeld in [artikel 70][ref1] heeft vanaf de eerste dag van de maand waarin hij de leeftijd van vijftien
      jaar heeft bereikt, recht op een toeslag op zijn volgens de voorgaande artikelen berekende pensioen ten bedrage van
      vijftien percent van dat pensioen, behoudens het bepaalde in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel70
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: 73a.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een pensioen als daar bedoeld verstaan het pensioen nadat
      eventueel [hoofdstuk 17][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 73a.3
    text: |-
      De in het eerste lid bedoelde toeslag bedraagt ten hoogste vijftien percent van f 72.309,80 . Dit bedrag wordt
      telkens gewijzigd bij de ministeriële regeling, bedoeld in [artikel 105, derde lid][ref1], overeenkomstig de
      aanpassing van een bedrag dat op dat, omgerekend naar euro's, op 1 januari 1985  € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '74'
    text: |-
      Het tijdelijk pensioen is gelijk aan het pensioen waarop recht zou bestaan indien de vermiste op de dag van zijn
      vermissing was overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel74
  - number: '75'
    text: |-
      Het recht op pensioen vervalt indien gedurende vijf achtereenvolgende jaren iedere invordering achterwege is
      gebleven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel75
  - number: '76'
    text: |-
      Wij kunnen, de Raad van State gehoord, een door of als gevolg van de toepassing van [artikel 75][ref1] vervallen
      recht of uitzicht op pensioen herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel75
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '75'
        hoofdstuk: '13'
        afdeling: Derde
  - number: '79.1'
    text: |-
      Indien een nabestaande aan wie reeds een nabestaandenpensioen is toegekend, hetzij krachtens deze wet, hetzij
      krachtens een andere regeling, ter zake van een later huwelijk of een latere aanmelding eveneens recht op
      nabestaandenpensioen verkrijgt, hetzij krachtens deze wet, hetzij krachtens een andere regeling, wordt samenlopende
      tijd slechts medegeteld bij de berekening van het pensioen waarbij die tijd het hoogste bedrag oplevert.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel79
  - number: '79.2'
    text: |-
      Onder een pensioen krachtens een andere regeling als bedoeld in het vorige lid wordt verstaan een pensioen ten
      laste van de Nederlandse schatkist - anders dan ingevolge wettelijke garanties of ingevolge overneming van de
      verplichting tot betaling -, ten laste van Aruba, van Curaçao, van Sint Maarten, van de openbare lichamen Bonaire,
      Sint Eustatius of Saba, van een publiekrechtelijk lichaam in Nederland of in evengenoemde landen, dan wel ten laste
      van een door het openbaar gezag in Nederland, in die landen of in die openbare lichamen ingesteld fonds.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel79
  - number: 79a.1
    text: |-
      Indien een wees die reeds recht op een wezenpensioen heeft, hetzij krachtens deze wet, hetzij krachtens een andere
      regeling, daarna eveneens recht op enig ander wezenpensioen verkrijgt, hetzij krachtens deze wet, hetzij krachtens
      een andere regeling, wordt voor de berekening van de eigen pensioenen waarvan die wezenpensioenen zijn of geacht
      moeten worden te zijn afgeleid, samenlopende tijd slechts medegeteld bij de berekening van het pensioen, waarbij
      die tijd het hoogste bedrag oplevert.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel79a
  - number: 79a.2
    text: |-
      [Artikel 79, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel79
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '79'
        hoofdstuk: '14'
        afdeling: Derde
  - number: '80.1'
    text: |-
      Behoudens het in dit hoofdstuk verder bepaalde wordt op het tijdstip van de inwerkingtreding van deze wet
      ingetrokken de wet van 31 juli 1957, *Stb.* 324, houdende toekenning van een uitkering en een pensioen aan gewezen
      leden van de Tweede Kamer der Staten-Generaal, zomede van een pensioen aan hun weduwen en wezen, alsmede de
      overgangsbepalingen van die wet.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel80
  - number: '80.2'
    text: De artikelen 3, 9, 17 en 18 van de wet van 31 juli 1957, *Stb.* 324, blijven van toepassing tot 1 januari 1969.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel80
  - number: '80.3'
    text: |-
      Artikel 13, onder *a*, van de wet van 31 juli 1957, *Stb.* 324, blijft van toepassing tot het in
      [artikel 167, eerste lid][ref1], bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel167
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '167'
        hoofdstuk: '30'
        afdeling: Zesde
  - number: '81'
    text: |-
      De wettelijke bepalingen bedoeld in [artikel 80][ref1] blijven van kracht voor wat betreft de rechten en
      verplichtingen die op grond van die bepalingen voor het tijdstip van de inwerkingtreding van deze wet zijn ontstaan
      en die op dat tijdstip nog niet tot gelding zijn gebracht onderscheidenlijk waaraan op dat tijdstip nog niet is
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel80
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '80'
        hoofdstuk: '15'
        afdeling: Derde
  - number: '82'
    text: |-
      De met ingang van een datum voorafgaande aan het tijdstip van de inwerkingtreding van deze wet, aan afgetreden
      kamerleden en aan weduwen en wezen van kamerleden, gewezen kamerleden of gepensioneerde kamerleden toegekende
      uitkeringen en pensioenen worden met ingang van dat tijdstip geacht krachtens deze wet te zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel82
  - number: '83'
    text: |-
      De in de [hoofdstukken 10][ref1] en [11][ref2] van deze afdeling vervatte regelingen zullen geen toepassing
      vinden en in de plaats daarvan zullen de bepalingen omtrent het pensioen van afgetreden en aftredende kamerleden,
      zoals deze luidden op 31 augustus 1957, blijven gelden ten aanzien van hem, die op die datum het lidmaatschap
      van de Tweede Kamer der Staten-Generaal bekleedde en daartoe binnen drie maanden na het tijdstip, waarop hij is
      afgetreden, zonder onmiddellijk herkozen en toegelaten te zijn, schriftelijk aan Onze Minister de wens te kennen
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        hoofdstuk: '11'
        afdeling: Derde
  - number: '84.1'
    text: |-
      Ten aanzien van uitkeringen die zijn toegekend ter zake van een aftreden verleend met een ingangsdatum vóór 1
      januari 1969, blijft het bepaalde in artikel 5 van de wet van 31 juli 1957, *Stb.* 324, van kracht.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel84
  - number: '84.2'
    text: |-
      Op de in het vorige lid bedoelde uitkeringen is te rekenen van 1 januari 1969 af [artikel 105][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '84.3'
    text: |-
      Uitkeringen die zijn toegekend ter zake van een aftreden voor het tijdstip van de inwerkingtreding van deze wet,
      worden te rekenen van 1 januari 1969 of het latere tijdstip waarop de uitkering is ingegaan, overeenkomstig de in
      [artikel 53, eerste lid][ref1], genoemde percentages herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 84a.1
    text: |-
      De [artikelen 52, vierde lid][ref1], en [52a tot en met 52c][ref2] zijn niet van toepassing ter zake van een
      ontslag of aftreden dat is ingegaan vóór de datum van inwerkingtreding van die bepalingen. In dat geval wordt in
      artikel 52, eerste lid, voor «vier jaren» gelezen «zes jaren» en in artikel 52, derde lid, wordt voor «55 jaar»
      gelezen: 50 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 84a.2
    text: |-
      Ten aanzien van de belanghebbende die op het tijdstip van inwerkingtreding van [artikel 52, vierde lid][ref1], lid
      is van de Tweede Kamer van de Staten-Generaal en na de eerstvolgende verkiezing voor de leden van de Tweede Kamer
      niet wordt herbenoemd, dan wel bij herbenoeming onmiddellijk na de eerstvolgende verkiezing de leeftijd van 50 jaar
      heeft bereikt, wordt in artikel 52, eerste lid, voor «vier jaren» gelezen «zes jaren» en in artikel 52, derde lid,
      voor «55 jaar» gelezen: 50 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 84a.3
    text: |-
      Ten aanzien van de belanghebbende die op het tijdstip van inwerkingtreding van de
      [artikelen 52a tot en met 52c][ref1] lid is van de Tweede Kamer van de Staten-Generaal en na de eerstvolgende
      verkiezing voor de leden van de Tweede Kamer niet wordt herbenoemd, zijn de artikelen 52a tot en met 52c niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 84b
    text: |-
      Ten aanzien van de uitkeringen die zijn toegekend ter zake van een ontslag of aftreden vóór het tijdstip van
      inwerkingtreding van de [Wet aanpassing uitkeringsduur Appa][ref1], blijft de uitkeringsduur van kracht zoals deze
      gold op de dag voorafgaand aan dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0031991
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0031991
  - number: '85'
    text: |-
      Pensioenen toegekend of toe te kennen ter zake van een aftreden met een ingangsdatum gelegen vóór 1 januari 1969
      worden afgeleid van de laatstelijk als kamerlid genoten schadeloosstelling aangepast naar de regelen vastgesteld
      bij de algemene maatregel van bestuur bedoeld in [artikel 105][ref1], met dien verstande, dat, indien het betreft
      een aftreden vóór 1 januari 1959 de schadeloosstelling wordt verminderd overeenkomstig artikel 4, eerste lid, onder
      *b*, van de wet van 17 juli 1923, *Stb.* 364, zoals dit artikel luidde tot 1 januari 1959.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 85a.1
    text: |-
      In afwijking van [artikel 58b, derde lid][ref1], informeert Onze Minister het gewezen kamerlid van wie de
      uitkeringsduur, bedoeld in [artikel 52, eerste of tweede lid][ref2], is geëindigd in de periode gelegen tussen
      31 december 2007 en de dag van inwerkingtreding van de [Wet aanpassing Appa en enkele andere wetten 2011][ref3],
      binnen vier maanden na inwerkingtreding van de Wet aanpassing Appa en enkele andere wetten 2011 over de
      mogelijkheid, bedoeld in artikel 58b, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel58b
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0030652
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 58b
        hoofdstuk: '11'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0030652
  - number: 85a.2
    text: |-
      De gewezen minister kan tot een jaar na de inwerkingtreding van de
      [Wet aanpassing Appa en enkele andere wetten 2011][ref1] Onze Minister verzoeken tot omzetting van eigen pensioen
      in nabestaandenpensioen als bedoeld in [artikel 58b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030652
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel58b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0030652
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 58b
        hoofdstuk: '11'
        afdeling: Derde
  - number: '86.1'
    text: |-
      Aan de weduwe wier weduwenpensioen wegens een volgend huwelijk is geëindigd op grond van artikel 22 van de wet
      van 31 juli 1957, *Stb.* 324, of op grond van het vierde lid wordt op haar verzoek aan Onze Minister opnieuw
      weduwenpensioen toegekend indien dat huwelijk, anders dan door opvolgend huwelijk met rechterlijk verlof, wordt
      ontbonden. Indien haar ter zake van het latere huwelijk eveneens pensioen toekomt, hetzij krachtens deze wet,
      hetzij krachtens een andere regeling, als bedoeld in [artikel 79, tweede lid][ref1], wordt het opnieuw toe te
      kennen pensioen berekend met overeenkomstige toepassing van [artikel 69][ref2] en [artikel 79, eerste lid][ref3],
      tenzij toekenning van een dezer pensioenen, waarbij het recht op het andere pensioen vervalt, tot een hoger bedrag
      leidt. De vorige volzin vindt overeenkomstige toepassing, indien de weduwe ter zake van het latere huwelijk recht
      op bijzonder weduwenpensioen verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel79
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '79'
        hoofdstuk: '14'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '69'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '79'
        hoofdstuk: '14'
        afdeling: Derde
  - number: '86.2'
    text: |-
      Bij toekenning aan de weduwe van weduwenpensioen ingevolge het vorige lid wordt het wezenpensioen van haar
      kinderen, als bedoeld in [artikel 70, eerste lid, eerste volzin][ref1], nader vastgesteld overeenkomstig het
      bepaalde in dat artikel en met inachtneming van [artikel 71, tweede lid][ref2], indien [artikel 69][ref3]
      overeenkomstige toepassing vindt bij de berekening van het weduwenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel69
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '71'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '69'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: '86.3'
    text: |-
      Het weduwenpensioen of de weduwenpensioenen en het nader vastgestelde wezenpensioen gaan in met de dag volgende op
      die van de ontbinding van het huwelijk. Herberekening van de pensioenen ingevolge de laatste volzin van het eerste
      lid geschiedt met ingang van de dag, waarop het bijzonder weduwenpensioen ingaat of zou ingaan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel86
  - number: '86.4'
    text: |-
      In afwijking van [artikel 69][ref1] eindigt een ingevolge het eerste lid opnieuw toegekend weduwenpensioen, indien
      de weduwe hertrouwt met een man, met wie zij vóór 1 januari 1966 reeds gehuwd is geweest, met ingang van de maand
      volgende op die waarin zij hertrouwt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel69
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '69'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
  - number: 86a
    text: |-
      Indien krachtens [artikel U 31a van de Algemene burgerlijke pensioenwet](onbekend) of een in strekking met dat
      artikel overeenkomende bepaling in andere pensioenwetten recht op pensioen bestaat en voor het tijdstip van de
      inwerkingtreding van deze wet terzake van een eerder huwelijk reeds recht op pensioen bestond krachtens de wet van
      31 juli 1957 (*Stb.* 324), wordt laatstbedoeld pensioen met ingang van de dag, waarop eerstbedoeld pensioen ingaat,
      nader vastgesteld met overeenkomstige toepassing van [artikel 69][ref1] en [artikel 71, tweede lid][ref2], en is
      voorts [artikel 79, eerste lid][ref3], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel79
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '69'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '71'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '79'
        hoofdstuk: '14'
        afdeling: Derde
  - number: '87.1'
    text: |-
      Op verzoek wordt weduwenpensioen of wezenpensioen toegekend aan de weduwe, die voor het tijdstip van de
      inwerkingtreding van deze wet niet dan wel op dat tijdstip niet meer is hertrouwd, onderscheidenlijk aan de
      kinderen, die recht op weduwenpensioen of wezenpensioen hadden gehad, indien [artikel 60][ref1] had gegolden op het
      tijdstip van het overlijden waaraan zij zodanig recht konden ontlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel60
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '60'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: '87.2'
    text: |-
      Indien voor het tijdstip van de inwerkingtreding van deze wet ter zake van een ander huwelijk reeds recht
      op pensioen bestond krachtens de wet van 31 juli 1957 (*Stb.* 324), wordt het pensioen, waarop ter zake
      van het eerdere huwelijk krachtens de wet van 31 juli 1957 (*Stb.* 324) recht bestond dan wel krachtens het
      vorige lid recht bestaat, met ingang van de dag, waarop het krachtens het vorige lid toe te kennen pensioen
      ingaat, nader vastgesteld dan wel vastgesteld met overeenkomstige toepassing van [artikel 69][ref1] en
      [artikel 71, tweede lid][ref2], en is voorts [artikel 79, eerste lid][ref3], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel79
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '69'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '71'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '79'
        hoofdstuk: '14'
        afdeling: Derde
  - number: '87.3'
    text: |-
      Het vorige lid is van overeenkomstige toepassing, indien ter zake van een ander huwelijk voor het tijdstip van de
      inwerkingtreding van deze wet reeds recht op pensioen bestond krachtens een andere regeling als bedoeld in artikel
      19, tweede lid, van de wet van 31 juli 1957 (*Stb.* 324), dan wel recht op pensioen bestaat krachtens een in
      strekking met het eerste lid overeenkomende bepaling in andere pensioenwetten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel87
  - number: '87.4'
    text: |-
      Toekenning van pensioen krachtens het eerste lid vindt niet plaats, indien toepassing van het tweede lid of van het
      derde lid zou leiden tot een gezamenlijk bedrag aan pensioen lager dan het bedrag van het pensioen, waarop reeds
      recht bestond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel87
  - number: '87.5'
    text: |-
      Het verzoek bedoeld in het eerste lid moet bij Onze Minister worden ingediend binnen vijf jaren na het tijdstip van
      de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel87
  - number: '87.6'
    text: |-
      De in het eerste lid bedoelde pensioenen gaan in op het tijdstip van de inwerkingtreding van deze wet met dien
      verstande dat, indien het verzoek meer dan een jaar na het tijdstip bedoeld in [artikel 167, eerste lid][ref1], is
      gedaan, zij niet vroeger ingaan dan een jaar voor de eerste dag van de maand waarin het verzoek werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel167
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '167'
        hoofdstuk: '30'
        afdeling: Zesde
  - number: '89.1'
    text: |-
      Op verzoek wordt wezenpensioen toegekend aan het kind dat de leeftijd van eenentwintig jaren nog niet heeft bereikt
      en niet gehuwd is of gehuwd geweest is dat recht op zodanig pensioen had gehad, indien de [artikelen 64][ref1] en
      [65][ref2] hadden gegolden op het tijdstip van het overlijden waaraan zij zodanig recht konden ontlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel65
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '64'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '65'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
  - number: '89.3'
    text: |-
      Het in het eerste lid bedoelde pensioen gaat in op het tijdstip van de inwerkingtreding van deze wet met dien
      verstande dat, indien het verzoek meer dan een jaar na het tijdstip bedoeld in [artikel 167, eerste lid][ref1], is
      gedaan, het niet vroeger ingaat dan een jaar voor de eerste dag van de maand waarin het verzoek werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel167
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '167'
        hoofdstuk: '30'
        afdeling: Zesde
  - number: '90.1'
    text: |-
      De pensioenen toegekend aan weduwen en wezen van kamerleden, gewezen kamerleden of gepensioneerde kamerleden
      worden, voor zover het recht op pensioen niet is vervallen, met ingang van het tijdstip van de inwerkingtreding van
      deze wet herberekend, overeenkomstig [artikel 67][ref1] onderscheidenlijk [artikel 70][ref2], met inachtneming van
      de [artikelen 72][ref3] en [73][ref4], indien dit voor belanghebbenden voordeliger is. Bij de herberekening worden
      onder een uitkering als bedoeld in [artikel 51][ref5] mede begrepen uitkeringen, toegekend krachtens de wet van 31
      juli 1957, *Stb.* 324.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel73
      [ref5]: https://wetten.overheid.nl/BWBR0002691#Artikel51
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '67'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '70'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '72'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '73'
        hoofdstuk: '12'
        paragraaf: '2'
        afdeling: Derde
      - id: ref5
        bwb_id: BWBR0002691
        artikel: '51'
        hoofdstuk: '10'
        afdeling: Derde
  - number: '90.2'
    text: |-
      Het bepaalde in [artikel 85][ref1] is ten aanzien van toegekende of toe te kennen pensioenen aan weduwen en wezen
      van kamerleden, gewezen kamerleden of gepensioneerde kamerleden, die zijn afgetreden c.q. overleden vóór 1 januari
      1969, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel85
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '85'
        hoofdstuk: '15'
        afdeling: Derde
  - number: '91'
    text: |-
      Voor de termijn van vijf achtereenvolgende jaren bedoeld in [artikel 75][ref1], telt mede de tijd voor het tijdstip
      van de inwerkingtreding van deze wet, gedurende welke de invordering van het pensioen achterwege is gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel75
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '75'
        hoofdstuk: '13'
        afdeling: Derde
  - number: '92.1'
    text: |-
      Pensioenen ten aanzien waarvan artikel 10 of 19 van de wet van 31 juli 1957, *Stb.* 324, toepassing heeft gevonden,
      worden, onverminderd de [artikelen 93][ref1] en [94][ref2] zoals deze luidden op het tijdstip van inwerkingtreding
      van deze wet en met inachtneming van het volgende lid, met ingang van het tijdstip van de inwerkingtreding van deze
      wet of het later tijdstip waarop zij zijn ingegaan, nader vastgesteld zonder de in eerstgenoemde artikelen vervatte
      beperking.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel94
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '93'
        hoofdstuk: '16'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '94'
        hoofdstuk: '16'
        afdeling: Vierde
  - number: '92.2'
    text: |-
      De nadere vaststelling bedoeld in het vorige lid geschiedt zodanig, dat niet daadwerkelijk gelijktijdig vervulde
      kamerlidtijd slechts wordt medegeteld bij de berekening van het pensioen waarbij die tijd het hoogste bedrag
      oplevert. Bij toepassing van de vorige volzin wordt onder pensioen tevens verstaan een pensioen krachtens een
      andere regeling als bedoeld in [artikel 79, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel79
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '79'
        hoofdstuk: '14'
        afdeling: Derde
  - number: '92.3'
    text: |-
      De voorgaande leden vinden slechts toepassing, indien tengevolge daarvan de som van de pensioenen meer bedraagt
      dan deze zou hebben bedragen, indien de op de dag voor het tijdstip van de inwerkingtreding van deze wet van kracht
      geweest zijnde bepalingen van toepassing zouden zijn gebleven. Indien krachtens de voorgaande volzin geen nadere
      vaststelling der pensioenen plaatsvindt, is op het totaal der pensioenen [artikel 105][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '95.1'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
  - number: 95.1.a
    text: |-
      een pensioen: een pensioen of een gedeelte van een pensioen voor zover berekend over tijd voor 1 januari 1986 dat
      is toegekend of geacht wordt te zijn toegekend krachtens de [tweede][ref1] en [derde afdeling][ref2] van deze wet,
      met uitzondering van de overgangstoeslag bedoeld in artikel 4 van de derde afdeling van de Pensioenmaatregelen
      1963;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Derde
  - number: 95.1.b
    text: 'een algemeen pensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
  - number: 95.1.b.1e
    text: |-
      een bruto-ouderdomspensioen als bedoeld in de [Algemene Ouderdomswet][ref1], met inbegrip van de daarbij behorende
      vakantie-uitkering voor zover deze niet behoort tot de overlijdensuitkering krachtens [die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
  - number: 95.1.b.2e
    text: |-
      een nabestaandenuitkering, een halfwezenuitkering en een wezenuitkering ingevolge de
      [Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 95.1.b.3e
    text: |-
      een pensioen of uitkering toegekend krachtens een wettelijke regeling van Aruba, van Curaçao, van Sint Maarten,
      van een vreemde mogendheid of krachtens een wettelijke regeling die uitsluitend in de openbare lichamen Bonaire,
      Sint Eustatius en Saba van toepassing is en naar aard en strekking overeenkomend met een algemeen pensioen als
      omschreven onder 1e of 2e;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
  - number: 95.1.c
    text: 'een belanghebbende: degene die recht heeft op een pensioen.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
  - number: '95.2'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder het algemeen pensioen van de belanghebbende die de leeftijd van
      65 jaar heeft bereikt, mede begrepen het algemeen pensioen waarop zijn echtgenoot recht heeft, tenzij het echtpaar
      duurzaam gescheiden leeft. Voor de toepassing van de vorige volzin wordt mede als echtgenoot aangemerkt degene die
      voor de toepassing van de [Algemene Ouderdomswet][ref1] als echtgenoot van de belanghebbende wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '95.3'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt een pensioen als bedoeld in [artikel 101, vijfde lid][ref1], dan wel
      enig ander pensioen als bedoeld in [artikel 102, eerste lid][ref2], voorzover dit pensioen of gedeelte daarvan is
      berekend over tijd voor 1 januari 1986, in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel102
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '101'
        hoofdstuk: '17'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '102'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '96'
    text: |-
      Het pensioen waarop twee of meer volle wezen recht hebben wordt, indien het als een eenheid is toegekend, voor de
      toepassing van dit hoofdstuk geacht aan ieder van genoemde wezen te zijn toegekend tot een bedrag, gelijk aan dat
      pensioen gedeeld door hun aantal.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel96
  - number: '97.1'
    text: |-
      Voor een belanghebbende die tevens recht heeft op een algemeen pensioen, wordt het deel daarvan dat geacht kan
      worden betrekking te hebben op een tijd overeenkomende met de diensttijd, waarnaar zijn pensioen is of geacht wordt
      te zijn berekend, tot een maximum van 40 jaren, gerekend deel uit te maken van het bedrag van zijn pensioen, met
      dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
  - number: 97.1.a
    text: |-
      voor zover diensttijd met 3,5 percent per jaar met pensioen wordt vergolden, deze diensttijd met 2 wordt
      vermenigvuldigd;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
  - number: 97.1.b
    text: |-
      voor zover diensttijd met 0,875 percent per jaar met pensioen wordt vergolden, deze diensttijd met 0,5 wordt
      vermenigvuldigd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
  - number: '97.2'
    text: |-
      Het inbouwbedrag wordt berekend aan de hand van het bedrag van het algemeen pensioen zoals dat luidt op 1 januari
      van het jaar waarin het recht op ouderdomspensioen, nabestaandenpensioen, bijzonder nabestaandenpensioen of
      wezenpensioen ontstaat.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
  - number: '97.3'
    text: |-
      Indien het bedrag van het algemeen pensioen op grond van persoonlijke omstandigheden wordt gewijzigd, wordt de
      pensioengrondslag herberekend. Het herberekende pensioen gaat, onverminderd [artikel 14c, tweede lid][ref1], in op
      dezelfde dag als waarop de bedoelde wijziging zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14c
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 14c
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '97.4'
    text: |-
      Ten aanzien van hem die op het tijdstip met ingang waarvan voor hem recht op algemeen pensioen ontstaat, reeds
      recht op pensioen heeft, vindt het vorige lid toepassing met ingang van de eerste dag van de maand waarin het recht
      op algemeen pensioen is ontstaan, of zo veel later als het pensioen is ingegaan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
  - number: '97.5'
    text: |-
      Op een nabestaandenpensioen, niet zijnde een pensioen als bedoeld in [artikel 17][ref1] of [62][ref2], dat is
      afgeleid van een pensioen waarop, in verband met het recht op een algemeen pensioen voor gehuwden, het eerste lid
      van toepassing was, vindt dat lid niet eerder toepassing dan met ingang van de eerste dag van de maand, volgend op
      die waarin dat pensioen krachtens het bepaalde in [artikel 115, eerste lid][ref3], is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel115
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '62'
        hoofdstuk: '12'
        paragraaf: '1'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '115'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '97.6'
    text: |-
      Het inbouwbedrag overschrijdt niet het bedrag van het algemeen pensioen, dat geacht kan worden betrekking te hebben
      op het tijdvak, liggende tussen de aanvang en het einde van de diensttijd waarnaar het pensioen is of geacht wordt
      te zijn berekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel97
  - number: '98.1'
    text: |-
      Indien een belanghebbende een algemeen pensioen gaat genieten dan wel het genot van een algemeen pensioen of
      tijdelijke uitkering eindigt, of indien in het bedrag van het algemeen pensioen een wijziging wordt gebracht
      op grond van persoonlijke omstandigheden van hemzelf, zijn echtgenoot of zijn kinderen, is hij gehouden hiervan
      onverwijld kennis te geven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel98
  - number: '98.2'
    text: |-
      Indien een belanghebbende de in het vorige lid bedoelde kennisgeving niet onverwijld doet, gaat een verlaging van
      het inbouwbedrag niet vroeger in dan een jaar voor de eerste dag van de maand waarin de kennisgeving werd gedaan of
      waarin ambtshalve vermindering van het inbouwbedrag plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel98
  - number: '99'
    text: |-
      Voor de toepassing van [artikel 97][ref1] geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel97
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '97'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 99.a
    text: |-
      Het algemeen pensioen wordt geacht betrekking te hebben op het tijdvak liggende tussen de tijdstippen waarop
      belanghebbende de leeftijd van 15 jaar en die van 65 jaar heeft bereikt met dien verstande dat, indien een
      belanghebbende recht heeft op nabestaanden- of wezenpensioen, het vorenstaande overeenkomstige toepassing vindt in
      verband met degene aan wiens overlijden het recht op pensioen wordt ontleend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
  - number: 99.b
    text: |-
      Het recht op een algemeen pensioen, dat bestond op de dag waarop de rechthebbende is overleden of sedert welke
      hij is vermist, wordt geacht voort te duren tot het tijdstip waarop diens pensioen krachtens het bepaalde in
      [artikel 115, eerste lid][ref1], is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel115
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '115'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: 99.c
    text: |-
      Indien een nabestaande recht heeft op nabestaandenuitkering alsmede halfwezenuitkering ingevolge de
      [Algemene nabestaandenwet][ref1], maar geen van de kinderen aan welke de nabestaande het recht op
      halfwezenuitkering ontleent recht heeft op pensioen, wordt uitsluitend uitgegaan van het bedrag van de
      nabestaandenuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 99.e
    text: |-
      Als diensttijd wordt uitsluitend in aanmerking genomen de diensttijd, gelegen tussen de tijdstippen, waarop de
      leeftijd van 15 jaar en die van 65 jaar is bereikt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
  - number: 99.f
    text: |-
      De diensttijd, waarnaar een pensioen is berekend op grond van artikel 68, tweede lid, van de Pensioenwet 1922,
      *Stb.* 240, zoals dit artikel luidde op 31 augustus 1956, van hem die na het tijdstip van de inwerkingtreding van
      deze wet de wens te kennen geeft als bedoeld in [artikel 38, eerste lid][ref1], wordt tot een maximum van 2,4 jaar
      vermenigvuldigd met 4,76.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel38
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '38'
        hoofdstuk: '8'
        afdeling: Tweede
  - number: 99.g
    text: Een pensioen dat niet is berekend naar diensttijd wordt geacht te zijn berekend naar een diensttijd van 40 jaren.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
  - number: 99.h
    text: |-
      Diensttijd, waarnaar een pensioen is of geacht wordt te zijn berekend en die niet daadwerkelijk als politiek
      ambtsdrager is doorgebracht, wordt geacht aan te sluiten bij het einde van de ambtsvervulling waaraan het recht op
      pensioen is ontleend; voor zover dientengevolge deze diensttijd zich uitstrekt na het tijdstip waarop de leeftijd
      van 65 jaar is of zou zijn bereikt wordt die diensttijd, te rekenen van dat tijdstip, geacht te zijn doorgebracht,
      voor zover mogelijk gedurende tijdvakken van onderbreking van de daadwerkelijk als politiek ambtsdrager
      doorgebrachte tijd en voor het overige onmiddellijk voor de aanvang van de diensttijd waarnaar het pensioen is
      berekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
  - number: 99.i
    text: |-
      Van de diensttijd wordt buiten beschouwing gelaten de tijd, waarop betrekking heeft of geacht kan worden betrekking
      te hebben het bedrag van het algemeen pensioen, waarop aanspraak is verkregen door vrijwillige premiebetaling
      krachtens [artikel 45 van de Algemene Ouderdomswet][ref1] en [hoofdstuk 5 van de Algemene nabestaandenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0007795
        hoofdstuk: '5'
  - number: 99.j
    text: |-
      De vakantie-uitkeringen, bedoeld in de [Algemene Ouderdomswet][ref1] en de [Algemene nabestaandenwet][ref2], worden
      geacht op overeenkomstige wijze als het algemeen pensioen in termijnen te worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '100'
    text: |-
      Indien de belanghebbende een gehuwde vrouw is, wordt voor de toepassing van [artikel 97][ref1] uitgegaan van het
      algemeen pensioen voor een ongehuwde pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel97
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '97'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '101.1'
    text: |-
      Indien aan een belanghebbende meer dan een pensioen is of geacht wordt te zijn toegekend, en de diensttijd waarnaar
      die pensioenen zijn of geacht worden te zijn berekend geheel of gedeeltelijk samenvalt, overschrijdt de som van
      de inbouwbedragen - voor zover deze geacht kunnen worden betrekking te hebben op een tijd overeenkomende met de
      samenvallende diensttijd - niet het bedrag van het algemeen pensioen, dat geacht kan worden betrekking te hebben op
      een tijd overeenkomende met bedoelde samenvallende diensttijd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel101
  - number: '101.2'
    text: |-
      Indien een overschrijding als bedoeld in het vorige lid plaats zou vinden, wordt het voor ieder pensioen berekende
      inbouwbedrag, voor zover betrekking hebbende op samenvallende diensttijd als bedoeld in het vorige lid, verminderd
      tot een zodanig deel van het bedrag van het algemeen pensioen bedoeld aan het slot van het vorige lid, als elk
      inbouwbedrag zich verhoudt tot de som van die bedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel101
  - number: '101.3'
    text: |-
      Indien de som van de inbouwbedragen, ook na toepassing van het vorige lid, een bedrag gelijk aan 80 percent van
      het algemeen pensioen overschrijdt, wordt deze overschrijding in mindering gebracht op elk inbouwbedrag in de
      verhouding waarin elk van die bedragen staat tot de som daarvan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel101
  - number: '101.4'
    text: |-
      Indien aan een belanghebbende pensioen is of geacht wordt te zijn toegekend en tevens pensioen krachtens een
      andere regeling, als bedoeld in het volgende lid, is - of voor de toepassing van met dit hoofdstuk overeenkomende
      bepalingen van die regeling geacht wordt te zijn - toegekend, vinden de vorige leden voor zoveel mogelijk
      overeenkomstige toepassing. Het bepaalde in de vorige volzin geldt met dien verstande, dat indien het betreft
      pensioenen toegekend krachtens een militaire pensioenwet, voor de toepassing van dit artikel niet als diensttijd
      geldt de diensttijd, die krachtens die wet met vier per mille van de pensioengrondslag is vergolden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel101
  - number: '101.5'
    text: |-
      Onder een pensioen krachtens een andere regeling als bedoeld in het vorige lid wordt verstaan een pensioen ten
      laste van de Nederlandse schatkist - anders dan ingevolge wettelijke garanties of ingevolge overneming van de
      verplichting tot betaling -, ten laste van Aruba, van Curaçao, van Sint Maarten, van de openbare lichamen Bonaire,
      Sint Eustatius of Saba, van een publiekrechtelijk lichaam in Nederland of in evengenoemde landen, dan wel ten laste
      van een door het openbaar gezag in Nederland, in die landen of in die openbare lichamen ingesteld fonds.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel101
  - number: '101.6'
    text: |-
      Op verzoek van de belanghebbende wordt dit artikel overeenkomstig toegepast, indien aan diens echtgenoot een of
      meer pensioenen zijn of geacht worden te zijn toegekend, hetzij krachtens deze wet, hetzij krachtens een andere
      regeling als bedoeld in het vijfde lid. [Artikel 102, tweede lid][ref1], is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel102
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '102'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '102.1'
    text: |-
      Op verzoek van degene die aantoont, dat uit hoofde van zijn recht op algemeen pensioen een vermindering plaatsvindt
      van enig ander pensioen dan bedoeld in [artikel 101, vijfde lid][ref1], wordt het bedrag van die vermindering voor
      zoveel mogelijk in mindering gebracht op het inbouwbedrag. De vorige volzin is slechts van toepassing voor zover
      bedoelde vermindering betrekking heeft op tijd die gelijktijdig in de desbetreffende betrekkingen is of geacht kan
      worden te zijn vervuld. Aan diensttijd die niet daadwerkelijk in dienstverhouding of als politiek ambtsdrager is
      doorgebracht wordt een plaats toegekend overeenkomstig het bepaalde bij [artikel 99, onderdeel h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel99
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '101'
        hoofdstuk: '17'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '99'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '102.2'
    text: |-
      De vermindering van het inbouwbedrag bedoeld in het vorige lid gaat in met de dag waarop de in dat lid bedoelde
      omstandigheid is opgetreden, met dien verstande dat deze niet vroeger ingaat dan een jaar voor de eerste dag van de
      maand waarin het desbetreffende verzoek werd ingediend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel102
  - number: '102.3'
    text: |-
      Bij toepassing van het eerste lid wordt in geval op meer dan een pensioen recht bestaat, het bedrag van de in dat
      lid bedoelde vermindering op de inbouwbedragen in mindering gebracht naar verhouding van evenbedoelde bedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel102
  - number: '102.4'
    text: |-
      Indien de som van het inbouwbedrag en de vermindering van het andere pensioen, ook na toepassing van de overige
      bepalingen van dit artikel, een bedrag gelijk aan 80 percent van het algemeen pensioen overschrijdt, wordt van deze
      overschrijding een deel in mindering gebracht op het inbouwbedrag, en wel in de verhouding waarin de diensttijd
      waarnaar het pensioen, waarop vorenbedoeld inbouwbedrag betrekking heeft, is of wordt geacht te zijn berekend,
      staat tot het totaal van de diensttijden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel102
  - number: '102.5'
    text: |-
      Dit artikel is van overeenkomstige toepassing, indien een vermindering plaats vindt van enig ander pensioen dan
      bedoeld in [artikel 101, vijfde lid][ref1], toegekend aan de echtgenoot van belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel101
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '101'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '103'
    text: |-
      Indien een algemeen pensioen wordt toegekend of herzien over een tijdvak waarover reeds pensioen werd betaald
      en dientengevolge te veel pensioen is betaald, kan de Sociale verzekeringsbank het te veel betaalde pensioen ten
      behoeve van het lichaam te welks laste het pensioen komt, inhouden op het algemeen pensioen, voor zover betrekking
      hebbende op evengenoemd tijdvak.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel103
  - number: '104'
    text: |-
      De bepalingen van dit hoofdstuk blijven buiten toepassing ten aanzien van degenen die op grond van gemoedsbezwaren
      hun recht op algemeen pensioen niet geldend maken, met dien verstande dat zij zoveel mogelijk overeenkomstige
      toepassing vinden met betrekking tot diegenen van evenbedoelden, die recht hebben op een uitkering als bedoeld in
      [artikel 48 van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel48
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '48'
  - number: '105.1'
    text: |-
      Een pensioen op grond van de [tweede][ref1] of de [derde afdeling][ref2] van deze wet, daaronder niet
      begrepen de inbouw- en franchisebedragen, wordt telkens aangepast overeenkomstig een aanpassing aan een
      algemene bezoldigingswijziging, van een pensioen van een gepensioneerde overheidswerknemer in de zin van de
      [Wet privatisering ABP][ref3] die werkzaam is geweest in de sector Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
      [ref3]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0007791
  - number: '105.2'
    text: |-
      Indien aan een gepensioneerde overheidswerknemer, als bedoeld in het eerste lid, een eenmalige uitkering wordt
      toegekend, wordt aan degene die recht heeft op een pensioen, als bedoeld in dat lid, overeenkomstig een eenmalige
      uitkering toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel105
  - number: '105.3'
    text: |-
      Onze Minister stelt regels voor de toepassing van het eerste en het tweede lid. Deze regels werken zonodig terug
      tot en met de datum waarop een pensioenaanpassing is ingegaan of recht is ontstaan op een eenmalige uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel105
  - number: '106.1'
    text: |-
      Op de wedde van de minister en op de schadeloosstelling van het lid van de Tweede Kamer der
      Staten-Generaal, met inbegrip van de eventuele verhoging als fractievoorzitter, bedoeld in
      [artikel 12, eerste lid, van de Wet schadeloosstelling leden Tweede Kamer][ref1], en met inbegrip van de eventuele
      toelage als voorzitter of ondervoorzitter, bedoeld in [artikel 11, eerste en tweede lid, van genoemde wet][ref2]
      worden, volgens bij of krachtens algemene maatregel van bestuur te stellen regels, bedragen ingehouden
      overeenkomstig de inhouding van bedragen op de bezoldiging van degene die behoort tot het overheidspersoneel, ter
      zake van aanspraken bij werkloosheid, ziekte, arbeidsongeschiktheid, ouderdom en overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '11'
  - number: '106.2'
    text: |-
      Op de uitkering van de gewezen minister of het gewezen kamerlid worden, volgens bij of krachtens algemene
      maatregel van bestuur te stellen regelen, bedragen ingehouden overeenkomstig de inhouding van bedragen, terzake van
      aanspraken als bedoeld in het eerste lid, op een werkloosheids- of arbeidsongeschiktheidsuitkering op grond van een
      voor overheidspersoneel getroffen regeling.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel106
  - number: '106.3'
    text: |-
      Geen inhouding van bedragen ter zake van aanspraken bij ouderdom en overlijden vindt plaats voor zover tijd niet
      meetelt als pensioendiensttijd en op uitkeringen bedoeld in de [artikelen 8a][ref1] en [53a][ref2], alsmede in de
      gevallen bedoeld in de laatste volzin van de [artikelen 13a, tweede lid][ref3], en [58a, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel58a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 13a
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0002691
        artikel: 58a
        hoofdstuk: '11'
        afdeling: Derde
  - number: '107.1'
    text: |-
      Op aanvraag van een gewezen minister of een gewezen kamerlid draagt het Rijk de waarde van de door de aanvrager
      krachtens de tweede respectievelijk derde afdeling van deze wet verkregen pensioenaanspraken over, overeenkomstig
      de bepalingen in de [Pensioenwet][ref1] inzake waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '107.2'
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: '107.3'
    text: |-
      De waarde van de pensioenaanspraken die zijn verkregen uit hoofde van een recht op uitkering ter zake van ontslag
      of aftreden, wordt gerekend tot de waarde van de pensioenaanspraken, bedoeld in het eerste lid. Voor zover met de
      waarde van de pensioenaanspraken uit hoofde van het recht op uitkering bij de waardeoverdracht geen rekening is
      gehouden, wordt deze waarde na afloop van het recht op uitkering overgedragen, op dezelfde wijze als is bepaald in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel107
  - number: '107.4'
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt het Rijk ter uitvoering van dit artikel beschouwd als een
      overdragende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '107.5'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een minister of een kamerlid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel107
  - number: '108.1'
    text: |-
      Op aanvraag van een minister of een kamerlid is het Rijk verplicht om de waarde van door betrokkene opgebouwde
      pensioenaanspraken aan te wenden ter verwerving van pensioenaanspraken op grond van de tweede respectievelijk derde
      afdeling van deze wet. Deze waardeoverdracht geschiedt overeenkomstig de voorwaarden die in de [Pensioenwet][ref1]
      aan een ontvangende pensioenuitvoerder worden gesteld met betrekking tot de waardeoverdracht van opgebouwde
      pensioenaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '108.2'
    text: |-
      De overgedragen pensioenaanspraken worden beschouwd als aanspraken krachtens de [tweede][ref1], respectievelijk
      [derde afdeling][ref2] van deze wet en behandeld als een geheel met de aanspraken die de minister of het kamerlid
      verkrijgt krachtens de [tweede][ref3] respectievelijk [derde afdeling][ref4] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
      [ref3]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref4]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0002691
        afdeling: Derde
  - number: '108.3'
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: '108.4'
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt het Rijk ter uitvoering van dit artikel beschouwd als een
      ontvangende pensioenuitvoerder in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '108.5'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een minister of een kamerlid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel108
  - number: '109.1'
    text: Onze Minister beslist over de toekenning van pensioen op aanvraag door of vanwege de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel109
  - number: '109.2'
    text: Onze Minister is bevoegd een pensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel109
  - number: '109.3'
    text: Onze Minister is voorts bevoegd een voorschot op een pensioen te verlenen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel109
  - number: '110'
    text: |-
      In een beschikking tot toekenning van pensioen worden de voor het pensioen medetellende diensttijd alsmede het
      bedrag waarover het pensioen wordt berekend vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel110
  - number: '111'
    text: De stukken die Onze Minister nodig acht voor de toepassing van deze paragraaf zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel111
  - number: '112'
    text: |-
      Het eigen pensioen gaat in met de dag waarop het recht daarop ontstaat, met dien verstande dat het niet vroeger
      ingaat dan een jaar voor de eerste dag van de maand waarin de aanvraag werd ingediend of waarin ambtshalve
      toekenning plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel112
  - number: '113.1'
    text: |-
      Het nabestaanden- en wezenpensioen gaat in met de dag volgende op die van het overlijden van hem aan wie het wordt
      ontleend, met dien verstande dat [artikel 112][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel112
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '112'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '113.2'
    text: Het tijdelijk pensioen gaat in met een door Onze Minister te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel113
  - number: '114'
    text: |-
      Wanneer een vervallen recht op pensioen geheel of gedeeltelijk wordt hersteld gaat het pensioen in met de eerste
      dag van de maand waarin het herstel heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel114
  - number: '115.1'
    text: |-
      Elk pensioen eindigt met het einde van de maand waarin de rechthebbende is overleden. In geval van vermissing van
      de rechthebbende eindigt het pensioen met een door Onze Minister te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel115
  - number: '115.2'
    text: |-
      Het tijdelijk pensioen eindigt wanneer de vermiste in leven blijkt te zijn, met een door Onze Minister te bepalen
      dag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel115
  - number: '115.3'
    text: |-
      Een pensioen waarop het recht krachtens [artikel 29][ref1] vervallen is verklaard, eindigt met het einde van de
      maand waarin de beslissing inzake het vervallen verklaren is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel29
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '29'
        hoofdstuk: '6'
        afdeling: Tweede
  - number: '115.4'
    text: 'Het wezenpensioen eindigt voorts met het einde van de maand waarin:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel115
  - number: 115.4.a
    text: |-
      de rechthebbende de leeftijd van eenentwintig jaren heeft bereikt of, de leeftijd van van eenentwintig jaren nog
      niet bereikt hebbende, in het huwelijk is getreden dan wel partij is bij een aanmelding, of
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel115
  - number: 115.4.b
    text: |-
      ten opzichte van de rechthebbende ouderschap komt vast te staan van een een ander dan degene aan wiens overlijden
      het recht op wezenpensioen wordt ontleend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel115
  - number: '116.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van een gepensioneerd minister of kamerlid wordt aan diens nabestaande, van
      wie hij niet duurzaam gescheiden leefde, een uitkering toegekend ten bedrage van het pensioen van die minister of
      van dat kamerlid over een tijdvak van twee maanden (nabestaandenuitkering). Bij ontstentenis van een nabestaande
      van wie de overledene niet duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve van minderjarige kinderen
      tot wie de overledene in familierechtelijke betrekking stond, of minderjarige kinderen waarover de overledene de
      pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding
      van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een
      vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel116
  - number: '116.2'
    text: |-
      Indien de overleden gepensioneerde geen betrekkingen als bedoeld in het vorige lid nalaat, kan het daarbedoelde
      bedrag door Onze Minister geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte
      en van de lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel116
  - number: '116.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder pensioen verstaan het bedrag waarop de overledene recht had,
      eventueel na toepassing van [hoofdstuk 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '117.1'
    text: |-
      Indien meer pensioen is betaald dan overeenstemt met [artikel 115][ref1], wordt het te veel betaalde teruggevorderd
      voor zover verrekening daarvan kan plaatsvinden met een uitkering krachtens [artikel 116][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel116
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '115'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '116'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '117.2'
    text: |-
      Indien een vermiste in leven blijkt te zijn, kan hetgeen aan tijdelijk pensioen en aan uitkering, bedoeld in
      [artikel 116][ref1], is betaald worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel116
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '116'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '118.1'
    text: Onze Minister draagt zorg voor de betaling van de pensioenen. De betaling geschiedt in maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel118
  - number: '118.2'
    text: |-
      Wij geven bij algemene maatregel van bestuur voorschriften omtrent wijze en voorwaarden van de betaling. Daarbij
      kunnen Wij tevens regelen stellen met betrekking tot de betaling van bepaalde pensioenen over tijdvakken van langer
      dan een maand.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel118
  - number: '118.3'
    text: |-
      Het pensioen van een gewezen minister onderscheidenlijk van een gewezen lid van de Tweede Kamer der Staten-Generaal
      wordt niet genoten, zolang een gewezen minister wederom het ambt van Minister bekleedt of zolang een gewezen
      kamerlid na herkiezing, een schadeloosstelling bedoeld in de [Wet schadeloosstelling leden Tweede Kamer][ref1],
      ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004939
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0004939
  - number: '119.1'
    text: |-
      Indien een gepensioneerde in een inrichting ter verpleging van geesteszieken of van zwakzinnigen is opgenomen of,
      niet opgenomen zijnde in een zodanige inrichting, op grond van geestelijke gestoordheid niet in staat is kwijting
      te verlenen voor de uitbetaling van pensioen, is Onze Minister bevoegd het pensioen uit te betalen aan een door hem
      aan te wijzen persoon of instelling. In andere door hem aan te wijzen bijzondere gevallen is Onze Minister eveneens
      bevoegd het pensioen in plaats van aan de gepensioneerde zonder diens machtiging uit te betalen aan een door hem
      aan te wijzen persoon of instelling.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel119
  - number: '119.2'
    text: |-
      Indien een gepensioneerde ingevolge het bepaalde bij of krachtens de [artikelen 6][ref1] en
      [13 van de Algemene Wet Bijzondere Ziektekosten][ref2] een bijdrage verschuldigd is in de kosten van zorg,
      is Onze Minister bevoegd het pensioen tot ten hoogste het bedrag van die bijdrage in de plaats van aan de
      gepensioneerde zonder diens machtiging uit te betalen aan het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '119.3'
    text: |-
      Indien het bepaalde in het vorige lid toepassing vindt, heeft de in het eerste lid bedoelde bevoegdheid betrekking
      op het gedeelte van het pensioen, dat niet aan het in het tweede lid bedoelde orgaan wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel119
  - number: '120.1'
    text: |-
      Onze Minister betaalt de termijnen van een pensioen niet meer uit indien deze niet zijn ingevorderd binnen twee
      jaren na het einde van het tijdvak waarover zij zijn verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel120
  - number: '120.2'
    text: |-
      Indien naar het oordeel van Onze Minister de belanghebbende redelijkerwijs niet geacht kan worden in gebreke te
      zijn geweest vindt het vorige lid geen toepassing.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel120
  - number: '121'
    text: |-
      De besluiten ter uitvoering van deze wet, met uitzondering van de [Vijfde Afdeling][ref1], worden genomen door
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
  - number: '122.1'
    text: 'Onze Minister herziet een door hem genomen beslissing, indien:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel122
  - number: 122.1.a
    text: aan die beslissing een feitelijke onjuistheid ten grondslag ligt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel122
  - number: 122.1.b
    text: na die beslissing blijkt dat aan die beslissing andere feiten ten grondslag dienen te worden gelegd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel122
  - number: '122.2'
    text: |-
      Indien na een beslissing van Onze Minister de feiten waarmede in die beslissing rekening is gehouden zodanig zijn
      gewijzigd, dat deze beslissing anders zou luiden als zij nog genomen zou moeten worden, wijzigt Onze Minister de
      beslissing, rekening houdend met de gewijzigde feiten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel122
  - number: '122.3'
    text: |-
      Onze Minister herstelt een door hem genomen beslissing omtrent toekenning - inbegrepen aanpassing overeenkomstig
      [artikel 105][ref1] -, herziening, wijziging of betaalbaarstelling van een pensioen, indien daarin een onjuistheid,
      anders dan bedoeld in de vorige leden, voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '122.4'
    text: |-
      Indien vijf jaren zijn verstreken na de dagtekening van een overeenkomstig de vorige leden voor herziening,
      wijziging of herstel vatbare beslissing, kan Onze Minister die leden buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel122
  - number: '123.1'
    text: |-
      Een herzieningsbeslissing, een wijzigingsbeslissing en een herstelbeslissing vermelden de dag van de
      inwerkingtreding. Bij een herzieningsbeslissing is deze dag dezelfde als die waarop de herziene beslissing in
      werking is getreden, tenzij een latere dag wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel123
  - number: '123.2'
    text: |-
      Een herzieningsbeslissing leidt niet tot terugvordering of verrekening van reeds betaalde bedragen, tenzij de
      betrokkene redelijkerwijze had moeten begrijpen, dat hem te veel werd uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel123
  - number: '123.3'
    text: |-
      Een wijzigingsbeslissing leidt slechts tot terugvordering of verrekening van reeds betaalde bedragen indien de
      betrokkene, hoewel enige bepaling van deze wet hem daartoe verplicht of dit redelijkerwijs van hem mocht worden
      verwacht, heeft nagelaten aan Onze Minister mededeling te doen van een wijziging in de feiten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel123
  - number: '123.4'
    text: |-
      In afwijking van de vorige twee leden en onverminderd [artikel 117][ref1] is Onze Minister bevoegd tot
      terugvordering of verrekening van te veel betaalde bedragen, indien de herzieningsbeslissing, onderscheidenlijk de
      wijzigingsbeslissing is genomen binnen vier maanden na de dagtekening van de herziene beslissing, onderscheidenlijk
      binnen vier maanden nadat Onze Minister bericht heeft ontvangen van wijziging in de feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel117
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '117'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '123.5'
    text: |-
      Herstel van een beslissing, als bedoeld in [artikel 122, derde lid][ref1], binnen vier maanden na de dagtekening
      van de herstelde beslissing, leidt tot terugvordering of verrekening van te veel betaalde pensioenbedragen. Herstel
      van een beslissing, als bedoeld in de vorige volzin, na de daargenoemde termijn, leidt slechts tot terugvordering
      of verrekening van te veel betaalde pensioenbedragen, indien de betrokkene redelijkerwijze had moeten begrijpen,
      dat hem te veel werd uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel122
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '122'
        hoofdstuk: '18'
        paragraaf: '5'
        afdeling: Vierde
  - number: '124.1'
    text: |-
      De [artikelen 93][ref1] en [94][ref2] vinden tot het in [artikel 167, eerste lid][ref3], bedoelde tijdstip geen
      toepassing in gevallen waarin die toepassing zou leiden tot terugvordering van reeds betaalde pensioenbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel167
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '93'
        hoofdstuk: '16'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '94'
        hoofdstuk: '16'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '167'
        hoofdstuk: '30'
        afdeling: Zesde
  - number: '124.2'
    text: |-
      Ten aanzien van de in het vorige lid bedoelde pensioenen blijven tot het daar bedoelde tijdstip de artikelen 11 en
      20*a* van de wet van 1 augustus 1956, *Stb.* 455, en de artikelen 10 en 19 van de wet van 31 juli 1957, *Stb.* 324,
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel124
  - number: '124.3'
    text: |-
      Met ingang van het in het eerste lid bedoelde tijdstip worden de daar bedoelde pensioenen herberekend met
      inachtneming van de [artikelen 93][ref1] en [94][ref2] en wordt een toelage toegekend ten bedrage van het verschil
      tussen het bedrag van het toegekende pensioen en het bedrag van het herberekende pensioen. Op deze toelage, die
      voor de toepassing van [hoofdstuk 17][ref3] en van de [artikelen 118][ref4] en [119][ref5] als pensioen wordt
      aangemerkt, worden verhogingen van die pensioenen na het in de vorige volzin bedoelde tijdstip in mindering
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel119
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel118
      [ref5]: https://wetten.overheid.nl/BWBR0002691#Artikel119
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '93'
        hoofdstuk: '16'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '94'
        hoofdstuk: '16'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '119'
        hoofdstuk: '18'
        paragraaf: '4'
        afdeling: Vierde
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '118'
        hoofdstuk: '18'
        paragraaf: '4'
        afdeling: Vierde
      - id: ref5
        bwb_id: BWBR0002691
        artikel: '119'
        hoofdstuk: '18'
        paragraaf: '4'
        afdeling: Vierde
  - number: '125'
    text: |-
      In afwijking in zoverre van het bepaalde in [artikel 97][ref1] en onverminderd het bepaalde in
      [artikel 99, onder e][ref2], vindt voor de berekening van het inbouwbedrag geen vermenigvuldiging plaats van
      tijd, gelegen voor het tijdstip van de inwerkingtreding van deze wet die voor de berekening van een pensioen als
      daarbedoeld in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel99
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '97'
        hoofdstuk: '17'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '99'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '126.1'
    text: |-
      Voor de toepassing van deze wet wordt de overgangstoeslag toegekend krachtens artikel 4 van de derde afdeling van
      de Pensioenmaatregelen 1963, geacht krachtens deze wet te zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel126
  - number: '126.2'
    text: |-
      Met ingang van de dag waarop voor belanghebbende na de dag voorafgaand aan die van de inwerkingtreding van de
      Pensioenmaatregelen 1963, recht op een lager bedrag aan algemeen pensioen, als bedoeld in [artikel 95][ref1]
      ontstaat, of het recht op evenbedoeld algemeen pensioen vervalt dan wel recht op een hoger pensioen anders
      dan krachtens [artikel 105][ref2] ontstaat, vervalt de overgangstoeslag of wordt deze op zodanig lager bedrag
      vastgesteld, alsof de omstandigheid die tot wijziging luidde reeds op laatstbedoelde dag aanwezig was geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '95'
        hoofdstuk: '17'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '126.3'
    text: |-
      Het pensioen en de daarbij behorende overgangstoeslag worden als een eenheid beschouwd, waarop de op het
      pensioen betrekking hebbende wettelijke bepalingen van overeenkomstige toepassing zijn, met uitzondering van
      [artikel 105][ref1] en van [hoofdstuk 17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '127.1'
    text: |-
      Op verzoek van de weduwe, die aantoont, dat een rente of uitkering als bedoeld in artikel 19, onder 2e, der
      Ongevallenwet 1921, artikel 40, onder 2e, der Land- en Tuinbouwongevallenwet 1922, onderscheidenlijk artikel 2,
      tweede lid, der Zeeongevallenwet 1919 dan wel een zodanige uitkering krachtens de liquiditeitswet ongevallenwetten,
      daaronder begrepen de daarop verleende toe- en bijslagen anders dan ingevolge de Wet compensatie premie Algemene
      Ouderdomswet Ongevallenrentetrekkers, is beperkt uit hoofde van haar recht op algemeen weduwenpensioen als bedoeld
      in de Algemene Weduwen- en Wezenwet, wordt het bedrag van die beperking in mindering gebracht op het inbouwbedrag
      bedoeld in [artikel 97][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel97
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '97'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '127.2'
    text: |-
      Indien op de dag waarop het verzoek, bedoeld in het vorige lid, bij Onze Minister is ingekomen, meer dan een
      jaar is verstreken nadat de omstandigheid, bedoeld in het vorige lid, is opgetreden, gaat de in dat lid bedoelde
      vermindering niet vroeger in dan een jaar voor de eerste dag van de maand waarin het verzoek werd ingediend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel127
  - number: '128'
    text: |-
      De rechthebbende op een pensioen, die krachtens artikel 6 van de derde afdeling van de Pensioenmaatregelen 1963
      op de dag voor het tijdstip van de inwerkingtreding van deze wet een vergoeding geniet ter zake van de premie die
      van dat pensioen wordt geheven ingevolge de [Algemene Ouderdomswet][ref1] en de Algemene Weduwen- en Wezenwet, met
      uitzondering van degene op wie [artikel 108][ref2] toepassing vindt, heeft recht op een vergoeding ter zake van
      die premie. Deze vergoeding beloopt een zodanig gedeelte van bedoelde premie als wordt aangegeven door een breuk,
      waarvan de teller is 7,1 en de noemer 10,2 is.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel108
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '108'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '129'
    text: |-
      In afwijking van [artikel 122][ref1] is herziening van een in dat artikel bedoelde beslissing, die genomen is met
      toepassing van de in de [artikelen 35][ref2] en [80][ref3] genoemde wetten niet meer mogelijk nadat vijf jaren zijn
      verstreken sinds het tijdstip van de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel80
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '122'
        hoofdstuk: '18'
        paragraaf: '5'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '35'
        hoofdstuk: '8'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '80'
        hoofdstuk: '15'
        afdeling: Derde
  - number: '130.1'
    text: |-
      Deze afdeling is van overeenkomstige toepassing op burgemeesters, wethouders en leden van het dagelijks bestuur van
      een deelgemeente, met dien verstande dat wordt gelezen voor:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.1.a
    text: 'lid van gedeputeerde staten: burgemeester, wethouder of lid van het dagelijks bestuur van een deelgemeente;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.1.b
    text: 'provincie: gemeente;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.1.c
    text: 'provinciale staten: de raad;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.1.d
    text: 'gedeputeerde staten: college van burgemeester en wethouders.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: '130.2'
    text: |-
      Deze afdeling is van overeenkomstige toepassing op voorzitters en leden van het dagelijks bestuur van een
      waterschap, met dien verstande dat wordt gelezen voor:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.2.a
    text: 'lid van gedeputeerde staten: lid van het dagelijks bestuur van een waterschap, waaronder de voorzitter;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.2.b
    text: 'provincie: waterschap;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.2.c
    text: 'provinciale staten: het algemeen bestuur van een waterschap;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.2.d
    text: 'gedeputeerde staten: het dagelijks bestuur van een waterschap.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: '130.3'
    text: |-
      Onder lid van gedeputeerde staten wordt voor de toepassing van deze afdeling en de daarop gebaseerde bepalingen
      verstaan: de commissaris van de Koning of de gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: '130.4'
    text: |-
      In afwijking van het eerste, tweede en derde lid, zijn de [hoofdstukken 22 tot en met 29][ref1] niet van toepassing
      op de commissaris van de Koning, de burgemeester alsmede op de voorzitter en de leden van het dagelijks bestuur
      van het waterschap waarvan de aan hun functie verbonden werkzaamheden een dagtaak vormen. Voor de toepassing van de
      hoofdstukken 22 tot en met 29 wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk22
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 130.4.a
    text: '*gewezen lid van gedeputeerde staten:* hij die uit hoofde van een ontslag uitzicht op pensioen heeft;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.4.b
    text: '*gepensioneerd lid van gedeputeerde staten:* hij die uit hoofde van een ontslag recht heeft op pensioen;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.4.c
    text: |-
      *wedde:* wedde inclusief vakantie-uitkering en de eindejaarsuitkering, waarop het gewezen of gepensioneerd lid
      van gedeputeerde staten op de dag voorafgaande aan de dag, waarop hij ophield lid van gedeputeerde staten te zijn,
      aanspraak had, tenzij uit de desbetreffende bepaling het tegendeel blijkt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130.4.d
    text: |-
      *deeltijdfactor:* een breuk waarvan de teller wordt gevormd door de genoten wedde exclusief de vakantie-uitkering
      en de eindejaarsuitkering, en de noemer door het tot een jaarbedrag herleide bedrag waarvan die wedde is afgeleid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130
  - number: 130a
    text: |-
      Deze afdeling is niet van toepassing op een gedeputeerde die is benoemd met toepassing van
      [artikel 44b van de Provinciewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel44b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 44b
  - number: 130b.1
    text: |-
      Tenzij in de volgende leden anders is bepaald, is deze afdeling van overeenkomstige toepassing op de
      Rijksvertegenwoordiger, met dien verstande dat wordt gelezen voor:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
  - number: 130b.1.a
    text: 'lid van gedeputeerde staten: Rijksvertegenwoordiger;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
  - number: 130b.1.b
    text: 'provincie: Rijk;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
  - number: 130b.1.c
    text: 'provinciale staten: Onze Minister;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
  - number: 130b.1.d
    text: 'gedeputeerde staten: Onze Minister.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
  - number: 130b.2
    text: |-
      Voor zover het de Rijksvertegenwoordiger betreft, kunnen Wij in bijzondere gevallen, de Raad van State gehoord, in
      afwijking van [artikel 132, zesde lid][ref1], bepalen, dat de uitkering wordt voortgezet voor een, met inachtneming
      van [artikel 136][ref2] vast te stellen termijn, die op dezelfde wijze kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel136
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '136'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 130b.3
    text: |-
      Voor de toepassing van [artikel 137a][ref1] wordt gelezen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel137a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 137a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 130b.3.a
    text: |-
      [artikel 76, eerste lid, van de Provinciewet][ref1]:
      [artikel 200, eerste lid, Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel200
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '200'
  - number: 130b.3.b
    text: 'commissaris van de Koning: Rijksvertegenwoordiger.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
  - number: 130b.4
    text: |-
      In afwijking van [artikel 152, tweede lid][ref1], kunnen Wij, de Raad van State gehoord, een door of als gevolg van
      de toepassing van artikel 152, eerste lid, vervallen recht op pensioen herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel152
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '152'
        hoofdstuk: '24'
        afdeling: Vijfde
  - number: '131.1'
    text: |-
      Aan een lid van gedeputeerde staten wordt met ingang van de dag van zijn aftreden, indien hij nog niet de leeftijd
      van 65 jaar heeft bereikt, recht op uitkering verleend ten laste van de provincie waarin hij als zodanig optrad, op
      de voet van de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel131
  - number: '131.2'
    text: 'Het eerste lid vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel131
  - number: 131.2.a
    text: |-
      indien de belanghebbende daarom verzoekt, of indien hij zonder onderbreking weer als lid van gedeputeerde staten
      optreedt, tenzij hij als zodanig een betrekking in een mindere omvang is gaan uitoefenen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel131
  - number: 131.2.b
    text: indien aan de belanghebbende rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel131
  - number: '131.3'
    text: |-
      Tenzij de omstandigheid bedoeld in het tweede lid, onder b, te rekenen vanaf de dag van ingang van het ontslag
      even lang als of langer heeft geduurd dan de duur van de uitkering berekend volgens [artikel 132][ref1], wordt de
      uitkering alsnog toegekend met ingang van de dag dat die omstandigheid zich niet meer voordoet, voor de resterende
      duur.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '132.1'
    text: |-
      De uitkering wordt toegekend voor een duur gelijk aan de tijd waarin de belanghebbende lid van gedeputeerde staten
      is geweest, maar tenminste voor de duur van twee jaren en ten hoogste voor de duur van drie jaren en twee maanden.
      Indien de belanghebbende met een of meer onderbrekingen lid van gedeputeerde staten is geweest, wordt in aanmerking
      genomen de tijd gedurende welke hij lid van gedeputeerde staten is geweest in een tijdvak, laatstelijk voordat hij
      ophield lid van gedeputeerde staten te zijn, waarin zijn lidmaatschap van gedeputeerde staten voor ten hoogste een
      zesde deel van dat tijdvak is onderbroken.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132
  - number: '132.2'
    text: |-
      Indien de belanghebbende ten tijde van zijn aftreden als lid van gedeputeerde staten de leeftijd van 55 jaar heeft
      bereikt en hij in het tijdvak van twaalf jaren dat direct aan zijn aftreden voorafgaat ten minste tien jaren lid
      van gedeputeerde staten is geweest, wordt de uitkering voortgezet tot het tijdstip waarop hij de leeftijd van 65
      jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132
  - number: '132.3'
    text: |-
      Voor de berekening van de uitkeringsduur, bedoeld in het eerste lid, en de tien jaren, bedoeld in het tweede lid,
      wordt met tijd waarin de belanghebbende lid van gedeputeerde staten is geweest gelijkgesteld de tijd waarin hij
      een functie heeft bekleed als genoemd in [artikel 2, tweede lid, onder a, b en d][ref1]. Indien sprake is van
      gelijkgestelde tijd als bedoeld in de vorige zin wordt met betrekking tot die tijd op dezelfde wijze als in de
      tweede zin van het eerste lid rekening gehouden met onderbrekingen in de uitoefening van deze functies.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '132.4'
    text: |-
      In afwijking van het eerste lid wordt de uitkering toegekend voor de duur van zes maanden, indien de belanghebbende
      korter dan drie maanden lid van gedeputeerde staten is geweest.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132
  - number: '132.5'
    text: |-
      In geval van tussentijds vervallen van de uitkering krachtens [artikel 136, tweede lid, onder b][ref1], wordt
      de volgende uitkering toegekend ten minste tot het tijdstip, waarop eerstgenoemde uitkering, indien zij niet was
      vervallen, zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel136
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '136'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '132.6'
    text: |-
      In bijzondere gevallen kunnen provinciale staten bepalen dat de uitkering wordt voortgezet voor een met
      inachtneming van [artikel 136][ref1] vast te stellen termijn, welke op dezelfde wijze kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel136
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '136'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132a.1
    text: |-
      De belanghebbende die recht heeft op een uitkering als bedoeld in [artikel 131][ref1], is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel131
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '131'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132a.1.a
    text: in voldoende mate te trachten passende arbeid te vinden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.1.b
    text: aangeboden passende arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.1.c
    text: mee te werken aan activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.2
    text: 'De belanghebbende voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.2.a
    text: door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.2.b
    text: door eigen toedoen passende arbeid opgeeft;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.2.c
    text: eisen stelt die het aanvaarden of verkrijgen van passende arbeid belemmeren.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.3
    text: |-
      Onder passende arbeid wordt verstaan alle arbeid die voor de krachten en de bekwaamheden van de belanghebbende
      is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden
      gevergd. Of arbeid passend is wordt in ieder geval bepaald door:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.3.a
    text: |-
      de aard van de arbeid, in relatie tot de eerder verrichte arbeid, een eerder uitgeoefend beroep of opgedane
      werkervaring;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.3.b
    text: het opleidingsniveau van de belanghebbende;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.3.c
    text: de reistijd naar en van het werk;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.3.d
    text: het geboden loon;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.3.e
    text: het werkloosheidsrisico.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.4
    text: |-
      Gedeputeerde staten zijn verantwoordelijk voor het in overleg met de belanghebbende opstellen van een plan voor
      het gericht zoeken naar en verwerven van passende arbeid, waarin de activiteiten zijn opgenomen die noodzakelijk
      zijn om te voldoen aan de verplichting, bedoeld in het eerste lid, onderdeel a. Bij algemene maatregel van bestuur
      worden nadere regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.4.a
    text: de onderdelen van het plan;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.4.b
    text: een tegemoetkoming voor de in het plan opgenomen activiteiten anders dan begeleiding;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.4.c
    text: de eisen die worden gesteld aan de organisatie die het plan opstelt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.5
    text: 'Dit artikel is niet van toepassing op de belanghebbende die:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132a.5.a
    text: |-
      een ambt heeft aanvaard als bedoeld in [artikel 2, tweede lid][ref1], en daaruit inkomsten geniet ten bedrage van
      70% of meer van de wedde, bedoeld in [artikel 133][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132a.5.b
    text: |-
      recht heeft op een voortgezette uitkering ingevolge [artikel 133a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132a.6
    text: Dit artikel is niet van toepassing gedurende de eerste drie maanden na het aftreden van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132a
  - number: 132b.1
    text: |-
      Gedeputeerde staten kunnen de belanghebbende, bedoeld in [artikel 132a][ref1], verplichten zich bij het gericht
      zoeken naar en verwerven van passende arbeid planmatig te laten begeleiden en ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132b.2
    text: |-
      Gedeputeerde staten verstrekken de belanghebbende een tegemoetkoming in de kosten van planmatige begeleiding en
      ondersteuning bij het gericht zoeken naar en verwerven van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132b
  - number: 132b.3
    text: |-
      De tegemoetkoming bedraagt ten hoogste 20% van de laatstelijk als gedeputeerde per jaar genoten wedde, bedoeld in
      [artikel 133, tweede lid][ref1]. De verplichte planmatige begeleiding en ondersteuning, bedoeld in het eerste lid,
      wordt volledig vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132b.4
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132b
  - number: 132b.4.a
    text: de aanvraag voor tegemoetkoming in de kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132b
  - number: 132b.4.b
    text: de voor vergoeding in aanmerking komende kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132b
  - number: 132b.4.c
    text: de eisen die worden gesteld aan de organisatie die de planmatige ondersteuning uitvoert.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132b
  - number: 132c.1
    text: |-
      Indien de belanghebbende een bij of krachtens [artikel 132a][ref1] of [132b][ref2] geregelde verplichting niet
      of niet behoorlijk is nagekomen, besluiten gedeputeerde staten tot gehele of gedeeltelijke inhouding van de
      uitkering. Gedeputeerde staten zijn bevoegd tot verrekening van de inhouding van de uitkering met betalingen aan
      belanghebbende op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel132b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 132b
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132c.2
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel132c
  - number: '133.1'
    text: |-
      De uitkering bedraagt gedurende het eerste jaar 80% en vervolgens 70% van de laatstelijk als lid van gedeputeerde
      staten genoten wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133
  - number: '133.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder laatstelijk genoten wedde verstaan de wedde, waarop de
      belanghebbende op de dag voorafgaande aan de dag, waarop hij heeft opgehouden lid van gedeputeerde staten te zijn,
      aanspraak had of bij waarneming van zijn ambt zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133
  - number: '133.3'
    text: |-
      Indien Wij in de bezoldiging van het Rijkspersoneel een wijziging aanbrengen wordt de in het eerste lid
      bedoelde laatstelijk genoten wedde voor de toepassing van dat lid met ingang van het tijdstip van ingang van de
      bezoldigingswijziging overeenkomstig de wijziging aangepast.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133
  - number: 133a.1
    text: |-
      Indien de belanghebbende op de dag waarop de duur van de uitkering eindigt geheel of gedeeltelijk algemeen invalide
      is, wordt, met inachtneming van [artikel 136][ref1], de uitkering voor de duur van de invaliditeit voortgezet op de
      voet van [artikel 133b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel133b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '136'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 133b
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133a.2
    text: |-
      Algemeen invalide, geheel of gedeeltelijk, in de zin van deze wet is hij die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekten of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen. Onder de eerstgenoemde
      arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden
      in staat is. Onder deze arbeid wordt niet begrepen arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: 133a.3
    text: |-
      Bij de vaststelling van de mate van algemene invaliditeit wordt buiten beschouwing gelaten of de betrokkene de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133a
  - number: 133a.4
    text: |-
      Indien de betrokkene zonder redelijke grond weigert deel te nemen aan een voor hem gewenste opleiding of scholing
      of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, wordt er bij de vaststelling van de mate
      van algemene invaliditeit van uitgegaan dat die opleiding of scholing is afgerond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133a
  - number: 133a.5
    text: Bij een algemene invaliditeit van minder dan 25 percent wordt de uitkering niet voortgezet.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133a
  - number: 133b.1
    text: |-
      De voortzetting van de uitkering vindt plaats als aangegeven in het tweede en derde lid en vervolgens als
      aangegeven in het vierde en het vijfde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.2
    text: |-
      De uitkering bedraagt gedurende een periode als aangegeven in het derde lid 70% van de laatstelijk als lid van
      gedeputeerde staten genoten wedde, bedoeld in [artikel 133][ref1], bij een algemene invaliditeit van 80% of meer,
      60% van die wedde bij een algemene invaliditeit van 55% tot 80% en 40% van die wedde bij een algemene invaliditeit
      van 25% tot 55%.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133b.3
    text: |-
      De in het tweede lid bedoelde periode is ten hoogste voor de belanghebbende die op het tijdstip van voortzetting
      van de uitkering:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.3.58
    text: 'jaar of ouder is: zes jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.3.53
    text: 'jaar of ouder is: drie jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.3.48
    text: 'jaar of ouder is: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.3.43
    text: 'jaar of ouder is: anderhalf jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.3.38
    text: 'jaar of ouder is: een jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.3.33
    text: 'jaar of ouder is: een half jaar, en'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.4
    text: |-
      De uitkering bedraagt na afloop van de volgens het derde lid bepaalde periode een percentage, volgens het tweede
      lid, van een bedrag gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen de laatstelijk
      als lid van gedeputeerde staten genoten wedde, bedoeld in [artikel 133][ref1], en het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133b.5
    text: |-
      Voor de berekening van het in het vierde lid bedoelde bedrag geldt een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de betrokkene op het tijdstip van voortzetting van de uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.6
    text: |-
      Het minimumloon, bedoeld in het vierde lid, is het tot een jaarbedrag herleide minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1] of, indien het een betrokkene jonger dan 23 jaar betreft, het tot een
      jaarbedrag herleide voor zijn leeftijd geldende minimumloon per maand, bedoeld in [artikel 7, derde lid][ref2],
      en [artikel 8, derde lid, van de genoemde wet][ref3], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 133b.7
    text: |-
      De belanghebbende heeft recht op een aanvulling van de uitkering, indien die uitkering minder bedraagt dan het
      volgens het tweede lid vastgestelde percentage van de laatstelijk als lid van gedeputeerde staten genoten wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.8
    text: |-
      De aanvulling is gelijk aan het bedrag dat nodig is om de uitkering te verhogen tot het in het zevende lid bedoelde
      percentage van de laatstelijk als lid van gedeputeerde staten genoten wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.9
    text: |-
      In afwijking van het achtste lid is de aanvulling gelijk aan het bedrag dat nodig is om de uitkering te
      verhogen tot het in het tiende lid aangegeven percentage van de laatstelijk als lid van gedeputeerde staten
      genoten wedde, indien de belanghebbende de keuze heeft gemaakt voor een verlaging van de inhouding ingevolge
      [artikel 160, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel160
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '160'
        hoofdstuk: '28'
        afdeling: Vijfde
  - number: 133b.10
    text: |-
      Het in het negende lid bedoelde percentage bedraagt bij een algemene invaliditeit van 80% of meer 65%, bij een
      algemene invaliditeit van 55% tot 80%: 56% en bij een algemene invaliditeit van 25% tot 55%: 37%.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
  - number: 133b.11
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 160, eerste lid][ref1], worden regels gesteld met
      betrekking tot de verlaging, bedoeld in het negende lid. Regels op grond van [artikel 8b, elfde lid][ref2], zijn
      van overeenkomstige toepassing op de in het negende lid bedoelde keuze.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '160'
        hoofdstuk: '28'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8b
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 133b.12
    text: |-
      Indien de wegens algemene invaliditeit voortgezette uitkering te zamen met inkomsten, bedoeld in
      [artikel 134][ref1], minder bedraagt dan het minimumloon wordt de uitkering verhoogd tot het minimumloon. De
      verhoging bedraagt niet meer dan het verschil tussen de uitkering en het bedrag waarvan deze is afgeleid en tevens
      niet meer dan 30% van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133c.1
    text: |-
      De voortzetting van de uitkering, bedoeld in [artikel 133a][ref1], geschiedt op aanvraag van de belanghebbende en
      voor termijnen van niet langer dan drie jaar, onverminderd het in deze wet bepaalde over herziening of intrekking
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133c.2
    text: |-
      Gedeputeerde staten stellen de belanghebbende uiterlijk vier maanden voor het verstrijken van de in het eerste lid
      bedoelde termijn schriftelijk in kennis van de mogelijkheid tot het doen van een aanvraag tot voortzetting van de
      uitkering na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133c
  - number: 133c.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt door de belanghebbende uiterlijk drie maanden voor het
      verstrijken van de in het eerste lid bedoelde termijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133c
  - number: 133c.4
    text: |-
      Indien gedeputeerde staten niet tijdig beslissen op een tijdig ingediende aanvraag als bedoeld in het derde lid,
      wordt de uitkering voortgezet tot het tijdstip van de beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133c
  - number: 133c.5
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt geacht tijdig te zijn ingediend indien gedeputeerde staten de
      kennisgeving, bedoeld in het tweede lid, niet hebben gedaan dan wel indien bij een latere kennisgeving als bedoeld
      in het tweede lid de aanvraag wordt ingediend binnen een maand nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133c
  - number: 133c.6
    text: |-
      Indien de uitkering na afloop van de in het eerste lid bedoelde termijn wordt voortgezet, wordt de uitkering
      berekend op de wijze die van toepassing zou zijn geweest indien die termijn niet zou zijn afgelopen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133c
  - number: 133c.7
    text: |-
      Bepalingen op grond van [artikel 8c, zevende lid][ref1], zijn van overeenkomstige toepassing op in het eerste lid
      bedoelde belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8c
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 133d.1
    text: |-
      Binnen een jaar na het tijdstip waarop de uitkering voor de eerste maal met toepassing van [artikel 133a][ref1] is
      voortgezet, doen gedeputeerde staten een onderzoek instellen ten einde te doen bezien of er als gevolg van gronden
      die invloed hebben op de mate van algemene invaliditeit redenen aanwezig zijn voor herziening of intrekking van
      de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133d.2
    text: |-
      Bepalingen op grond van [artikel 8d, tweede lid][ref1], zijn van overeenkomstige toepassing op het in het eerste
      lid bedoelde onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8d
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8d
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 133d.3
    text: |-
      Gedeputeerde staten wijzigen ambtshalve of op aanvraag van de belanghebbende het bedrag van de uitkering bij
      wijziging van de mate van algemene invaliditeit.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
  - number: 133d.4
    text: 'Een wijziging van het bedrag van de uitkering gaat in:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
  - number: 133d.4.a
    text: |-
      indien daartoe een aanvraag is ingediend, met ingang van de eerste dag van de maand volgende op die waarin de
      aanvraag is ingekomen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
  - number: 133d.4.b
    text: |-
      indien de wijziging ambtshalve plaatsvindt, met ingang van de eerste dag van de maand volgende op die waarin de
      beslissing tot wijziging is genomen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
  - number: 133d.5
    text: |-
      De toepassing van [artikel 133a][ref1] wordt ten aanzien van een belanghebbende gestaakt indien en zolang hij niet
      voldoet aan een uitnodiging van gedeputeerde staten zich te onderwerpen aan een onderzoek door een of meer door hen
      aangewezen geneeskundigen ter beantwoording van de vraag, of er nog sprake is van algemene invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133d.6
    text: |-
      Indien degene die recht heeft op wegens algemene invaliditeit voortgezette uitkering inkomsten uit of in verband
      met arbeid geniet, zijn gedeputeerde staten bevoegd, zolang niet vaststaat of deze arbeid als arbeid, bedoeld in
      [artikel 133a, tweede lid][ref1], kan worden aangemerkt, niet tot herziening of intrekking van de uitkering over te
      gaan. De toepassing van de eerste volzin vindt ten hoogste plaats over een aaneengesloten periode van drie jaren,
      aanvangende op de eerste dag waarover de inkomsten uit of in verband met arbeid bedoeld in de eerste volzin worden
      genoten. Deze periode wordt geacht niet te zijn onderbroken indien korter dan een maand geen inkomsten uit of in
      verband worden genoten. Na afloop van de in de tweede volzin genoemde periode wordt de in de eerste volzin bedoelde
      arbeid aangemerkt als arbeid, bedoeld in [artikel 133a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133e.1
    text: |-
      Op verzoek van een lid van gedeputeerde staten doen provinciale staten een onderzoek instellen, door een of meer
      door hen aangewezen geneeskundigen, ter beantwoording van de vraag of het lid van gedeputeerde staten dat het
      verzoek deed algemeen invalide is als bedoeld in [artikel 133][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133e.2
    text: Provinciale staten brengen de uitkomst van een onderzoek als bedoeld in het eerste lid ter kennis van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel133e
  - number: '134.1'
    text: |-
      De inkomsten die de belanghebbende geniet, worden bepaald overeenkomstig de regels van de
      [Wet inkomstenbelasting 2001][ref1] en worden met de uitkering verrekend over de maand waarop deze inkomsten
      betrekking hebben of geacht kunnen worden betrekking te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '134.2'
    text: |-
      Voor de toepassing van het eerste lid worden onder inkomsten verstaan het gezamenlijk bedrag dat de belanghebbende
      wegens het verrichten van activiteiten, ter hand genomen met ingang van of na de dag waarop hij heeft opgehouden
      lid van gedeputeerde staten te zijn, geniet als
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
  - number: 134.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 134.2.b
    text: belastbaar loon uit of in verband met arbeid en
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
  - number: 134.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '134.3'
    text: 'Voor de toepassing van de vorige leden worden mede als inkomsten aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
  - number: 134.3.a
    text: |-
      de inkomsten wegens in het tweede lid bedoelde activiteiten ter hand genomen door de belanghebbende binnen één
      jaar, onmiddellijk voorafgaand aan het tijdstip van aftreden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
  - number: 134.3.b
    text: |-
      de inkomsten die worden genoten uit een betrekking waarin hij gedurende zijn zittingstijd als lid van gedeputeerde
      staten op non-activiteit was gesteld;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
  - number: 134.3.c
    text: de vaste vergoeding die wordt genoten als lid van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
  - number: '134.4'
    text: |-
      Indien de belanghebbende op of na de dag bedoeld in het tweede lid inkomsten of hogere inkomsten, anders dan ten
      gevolge van algemene loonsverhogingen, verkrijgt uit in het tweede lid bedoelde activiteiten ter hand genomen voor
      de dag van aftreden, anders dan bedoeld in het derde lid, is ten aanzien van die inkomsten of hogere inkomsten het
      bepaalde in het eerste lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
  - number: '134.5'
    text: |-
      De in het eerste lid bedoelde verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag
      waarmede de uitkering, vermeerderd met die inkomsten, de laatstelijk genoten wedde, waarvan de uitkering
      is afgeleid, overschrijdt. Bij de verrekening wordt voor de hoogte van de uitkering de op grond van
      [artikel 132c, eerste lid][ref1], opgelegde inhouding buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132c
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132c
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '134.6'
    text: |-
      Onder inkomsten bedoeld in de voorgaande leden wordt niet verstaan kinderbijslag alsmede de compensatie voor de
      premie ingevolge de [Algemene Ouderdomswet][ref1] en de [Algemene nabestaandenwet][ref2], welke in die inkomsten is
      of geacht kan worden te zijn begrepen. De vorige volzin is wat betreft de premiecompensatie slechts van toepassing
      voor zover de daar bedoelde inkomsten betrekking hebben of kunnen worden geacht betrekking te hebben op een tijdvak
      gelegen voor 1 juni 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '134.7'
    text: |-
      Een ministeriële regeling op grond van [artikel 9, zesde lid][ref1], geldt mede voor de toepassing van dit artikel,
      ten aanzien van de voortgezette uitkering bedoeld in [artikel 132, zesde lid][ref2], en in [artikel 133a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 134a.1
    text: |-
      De belanghebbende is verplicht van het ter hand nemen van enige activiteiten als bedoeld in
      [artikel 134, tweede lid][ref1], terstond mededeling te doen aan gedeputeerde staten onder opgave, voor zover
      mogelijk, van de inkomsten die hij uit die activiteiten zal trekken. Zijn de inkomsten niet vooraf op te geven
      dan doet hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave van de inkomsten, die hij sinds
      het ter hand nemen van de activiteiten of sinds de vorige opgave heeft genoten. Voorschriften, bedoeld in
      [artikel 9a, eerste lid, derde volzin][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 9a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 134a.2
    text: |-
      Brengt de aard van de activiteiten of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast
      van een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het eind van de evenbedoelde termijn. Ten
      aanzien van deze verrekening is [artikel 134][ref1] van toepassing, met dien verstande dat zij geschiedt over de in
      de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 134a.3
    text: |-
      Gedeputeerde staten kunnen bij de vaststelling van het bedrag van de vermindering van de opgave van de
      belanghebbende afwijken.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134a
  - number: 134a.4
    text: |-
      De belanghebbende aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin toe
      te stemmen dat allen, die daarvoor naar het oordeel van gedeputeerde staten in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit hoofdstuk noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel134a
  - number: '135.1'
    text: De uitkering, berekend over een maand, wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel135
  - number: '135.2'
    text: |-
      De uitkering wordt niet uitbetaald zolang de belanghebbende niet of niet op de voorgeschreven wijze voldoet aan
      zijn verplichtingen op grond van [artikel 134a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 134a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '136.1'
    text: De uitkering eindigt met ingang van de dag volgende op die, waarop de belanghebbende is overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel136
  - number: '136.2'
    text: 'De uitkering vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel136
  - number: 136.2.a
    text: met ingang van de dag waarop de belanghebbende de leeftijd van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel136
  - number: 136.2.b
    text: |-
      met ingang van de dag waarop de belanghebbende opnieuw lid van gedeputeerde staten wordt in de provincie ten laste
      waarvan de uitkering wordt genoten, tenzij hij als zodanig een betrekking is gaan uitoefenen in een mindere omvang
      dan voor het aftreden waaraan hij het recht op uitkering ontleent;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel136
  - number: 136.2.c
    text: |-
      wanneer tijdens de duur van de uitkering zich de omstandigheid voordoet, bedoeld in
      [artikel 131, tweede lid, onder b][ref1]. Zodra die omstandigheid zich niet langer voordoet is het daar bepaalde
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel131
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '131'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '136.3'
    text: |-
      De uitkering kan geheel of ten dele vervallen worden verklaard indien de belanghebbende herhaaldelijk niet of niet
      op de voorgeschreven wijze voldoet aan zijn verplichtingen op grond van [artikel 134a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 134a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '137.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de belanghebbende wordt aan de weduwe of weduwnaar een bedrag uitgekeerd
      gelijk aan de uitkering eventueel vermeerderd met de kinderbijslag voor het eerste en tweede kind waarop de
      belanghebbende ingevolge de [Algemene Kinderbijslagwet][ref1] op de dag van het overlijden recht had, over een
      tijdvak van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '137.2'
    text: |-
      Laat de overledene geen weduwe of weduwnaar na, dan geschiedt de uitkering van het in het eerste lid bedoelde
      bedrag ten behoeve van de minderjarige kinderen tot wie de overledene in familierechtelijke betrekking stond, of
      minderjarige kinderen waarover de overledene ten tijde van het overlijden de pleegouderlijke zorg droeg. Onder
      pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind, als was het een eigen
      kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen, dan geschiedt de uitkering van het in het eerste lid bedoelde bedrag indien de overledene
      kostwinner was van ouders, meerderjarige kinderen, broeders of zusters, ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel137
  - number: '137.3'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het eerste en tweede lid na, dan wordt het aldaar bedoelde
      bedrag geheel of ten dele uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging,
      indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel137
  - number: 137a.1
    text: |-
      Dit hoofdstuk is van overeenkomstige toepassing op degene die krachtens
      [artikel 76, eerste lid, van de Provinciewet][ref1], dan wel krachtens
      [artikel 78, eerste lid, van de Gemeentewet][ref2] het ambt van commissaris van de Koning, respectievelijk het ambt
      van burgemeester gedurende meer dan dertig dagen zonder onderbreking heeft waargenomen. Voor degene die aftreedt
      als waarnemer is de duur van de uitkering, ten dele in afwijking van [artikel 132][ref3], steeds gelijk aan de
      duur van de waarneming. De uitkering bedraagt het volgens [artikel 133][ref4] toepasselijke percentage van de als
      waarnemer genoten vergoeding en wordt aangepast overeenkomstig het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel137a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 137a.2
    text: |-
      In afwijking van [artikel 131][ref1] komt de uitkering die de provincie of de gemeente na ontheffing van de
      waarneming verschuldigd is op grond van het eerste lid ten laste van Hoofdstuk VII van de rijksbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel131
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel137a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '131'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 137b
    text: |-
      Bij eervol ontslag van een burgemeester wegens opheffing van de gemeente komt de uitkering ten laste van hoofdstuk
      VII van de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel137b
  - number: '138.1'
    text: |-
      Aan hem, die ophoudt lid van gedeputeerde staten te zijn, wordt, ten laste van de provincie waarin hij als zodanig
      optrad, recht op pensioen verleend, indien hij op het tijdstip waarop hij ophoudt lid van gedeputeerde staten te
      zijn, de leeftijd van 65 jaar heeft bereikt, tenzij hij op dat tijdstip weder als zodanig optreedt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138
  - number: '138.2'
    text: |-
      Aan hem, die ophoudt lid van gedeputeerde staten te zijn voor het bereiken van de leeftijd van 65 jaar, wordt
      recht op een pensioen verleend bij het bereiken van die leeftijd, tenzij hij op dat tijdstip weder als lid van
      gedeputeerde staten optreedt in de provincie ten laste waarvan het pensioen komt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138
  - number: 138a.1
    text: |-
      Het pensioen bedraagt voor ieder jaar als lid van gedeputeerde staten 2 percent van de daarvoor geldende
      pensioengrondslag, volgens een of meer van de [artikelen 139][ref1], [139a][ref2] en [139aa][ref3], waarbij
      niet in aanmerking wordt genomen de diensttijd, doorgebracht na het bereiken van de leeftijd van 65 jaar,
      voor zover de gewezen gedeputeerde bij of na het bereiken van die leeftijd wederom het ambt van lid van
      gedeputeerde staten in de betrokken provincie aanvaardt. Voor de toepassing van die artikelen wordt verstaan
      onder wedde: de wedde, bedoeld in [artikel 130, vierde lid, onder c][ref4], aangepast volgens de regels,
      bedoeld in [artikel 157, derde lid][ref5]. Ten aanzien van een lid van gedeputeerde staten dat voor zijn
      bezoldiging geacht wordt niet de volledige werkweek aan het ambt te besteden, is voor de toepassing van de
      [artikelen 139a][ref6] en [139aa][ref7] de wedde het tot een jaarbedrag herleide bedrag waarvan de wedde, bedoeld
      in [artikel 130, vierde lid, onder c][ref8], is afgeleid, aangepast volgens de in de tweede volzin bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel139aa
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel130
      [ref5]: https://wetten.overheid.nl/BWBR0002691#Artikel157
      [ref6]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
      [ref7]: https://wetten.overheid.nl/BWBR0002691#Artikel139aa
      [ref8]: https://wetten.overheid.nl/BWBR0002691#Artikel130
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '139'
        hoofdstuk: '22'
        afdeling: Vijfde
      - id: ref2
