        afdeling: Vierde
  - number: '160.1'
    text: |-
      Op de wedde van het lid van gedeputeerde staten worden, volgens bij of krachtens algemene maatregel van bestuur
      te stellen regelen, bedragen ingehouden overeenkomstig de inhouding van bedragen op de bezoldiging van degene
      die behoort tot het overheidspersoneel, ter zake van aanspraken bij werkloosheid, ziekte, arbeidsongeschiktheid,
      ouderdom en overlijden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160
  - number: '160.2'
    text: |-
      Op de uitkering van het gewezen lid van gedeputeerde staten worden, volgens bij of krachtens algemene maatregel van
      bestuur te stellen regelen, bedragen ingehouden overeenkomstig de inhouding van bedragen, terzake van aanspraken
      als bedoeld in het eerste lid, op een werkloosheids- of arbeidsongeschiktheidsuitkering op grond van een voor
      overheidspersoneel getroffen regeling.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160
  - number: '160.3'
    text: |-
      Geen inhouding van bedragen ter zake van aanspraken bij ouderdom en overlijden vindt plaats voor zover tijd niet
      meetelt als pensioendiensttijd en op uitkeringen bedoeld in de [artikelen 133a][ref1], alsmede in de gevallen
      bedoeld in [artikel 138a, derde lid, laatste volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel138a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 138a
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 160a.1
    text: |-
      Op aanvraag van een gewezen gedeputeerde draagt de desbetreffende provincie de waarde van de door de aanvrager
      krachtens de [vijfde afdeling][ref1] van deze wet verkregen pensioenaanspraken over, overeenkomstig de bepalingen
      in de [Pensioenwet][ref2] inzake waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0020809
  - number: 160a.2
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: 160a.3
    text: |-
      De waarde van de pensioenaanspraken die zijn verkregen uit hoofde van een recht op uitkering ter zake van ontslag
      of aftreden, wordt gerekend tot de waarde van de pensioenaanspraken, bedoeld in het eerste lid. Voor zover met de
      waarde van de pensioenaanspraken uit hoofde van het recht op uitkering bij de waardeoverdracht geen rekening is
      gehouden, wordt deze waarde na afloop van het recht op uitkering overgedragen, op dezelfde wijze als is bepaald in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160a
  - number: 160a.4
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt de provincie ter uitvoering van dit artikel beschouwd als een
      overdragende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160a
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: 160a.5
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160a
  - number: 160b.1
    text: |-
      Op aanvraag van een gedeputeerde is de desbetreffende provincie verplicht om de waarde van door betrokkene
      opgebouwde pensioenaanspraken aan te wenden ter verwerving van pensioenaanspraken op grond van de
      [vijfde afdeling][ref1] van deze wet. Deze waardeoverdracht geschiedt overeenkomstig de voorwaarden die in de
      [Pensioenwet][ref2] aan een ontvangende pensioenuitvoerder worden gesteld met betrekking tot de waardeoverdracht
      van opgebouwde pensioenaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0020809
  - number: 160b.2
    text: |-
      De overgedragen pensioenaanspraken worden beschouwd als aanspraken krachtens de [vijfde afdeling][ref1]
      van deze wet en behandeld als een geheel met de aanspraken die de gedeputeerde verkrijgt krachtens de
      [vijfde afdeling][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Vijfde
  - number: 160b.3
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: 160b.4
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt de provincie ter uitvoering van dit artikel beschouwd als een
      ontvangende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: 160b.5
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel160b
  - number: '162'
    text: |-
      De besluiten ter uitvoering van deze afdeling worden genomen door gedeputeerde staten, het college van burgemeester
      en wethouders onderscheidenlijk het dagelijks bestuur van het waterschap, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel162
  - number: '163.1'
    text: |-
      Bij verordening kan worden bepaald dat de pensioenen van gewezen leden van gedeputeerde staten zomede die van de
      weduwen en wezen van leden, gewezen leden of gepensioneerde leden van gedeputeerde staten, voor zover het recht
      daarop niet is vervallen, met ingang van het tijdstip van de inwerkingtreding van deze wet, worden herberekend
      overeenkomstig de [artikelen 90][ref1] en [92][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel92
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '90'
        hoofdstuk: '15'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '92'
        hoofdstuk: '15'
        afdeling: Derde
  - number: '163.2'
    text: |-
      De verordeningen vastgesteld op grond van de wet van 1 augustus 1956, *Stb.* 455, behouden hun rechtskracht
      gedurende twee jaren na het tijdstip van de inwerkingtreding van deze wet voor zover zij niet eerder door
      andere verordeningen overeenkomstig deze wet zijn vervangen. In laatstbedoelde verordeningen kunnen zo nodig
      overeenkomstige overgangsbepalingen worden opgenomen als vermeld in de [hoofdstukken 8][ref1] en [15][ref2], en
      in [artikel 124][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk15
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel124
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '8'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        hoofdstuk: '15'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '124'
        hoofdstuk: '19'
        afdeling: Vierde
  - number: '163.3'
    text: |-
      [Artikel 134, derde lid][ref1], vindt geen toepassing ten aanzien van uitkeringen toegekend ter zake van een
      aftreden voor het tijdstip van de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 163a
    text: |-
      In afwijking van [artikel 130][ref1] is deze afdeling niet van toepassing op gewezen commissarissen van de Koning,
      gewezen burgemeesters en gewezen leden van het dagelijks bestuur van een waterschap die in de vervulling van
      dat ambt overheidswerknemer waren in de zin van de [Wet privatisering ABP][ref2], en wier ontslag of aftreden is
      ingegaan vóór de datum van inwerkingtreding van die bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '130'
        hoofdstuk: '20'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0007791
  - number: 163b.1
    text: |-
      De [artikelen 132, derde lid][ref1], en [132a tot en met 132c][ref2] zijn niet van toepassing ter zake van een
      ontslag of aftreden dat is ingegaan vóór de datum van inwerkingtreding van die bepalingen. In artikel 132, eerste
      lid, wordt in dat geval voor «vier jaren» gelezen «zes jaren» en in artikel 132, tweede lid, wordt in dat geval
      voor «55 jaar» gelezen: 50 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 163b.2
    text: |-
      Ten aanzien van de belanghebbende die op het tijdstip van inwerkingtreding van [artikel 132, derde lid][ref1],
      is benoemd als lid van gedeputeerde staten, wethouder, lid van het dagelijks bestuur van een deelgemeente of lid
      van het dagelijks bestuur van een waterschap en op het tijdstip voorafgaand aan de inwerkingtreding van artikel
      132, derde lid, niet overheidswerknemer in de zin van de [Wet privatisering ABP][ref2] was, en na de eerstvolgende
      verkiezing voor de leden van provinciale staten, de gemeenteraad onderscheidenlijk het algemeen bestuur van het
      waterschap niet wordt herbenoemd, dan wel bij herbenoeming in hetzelfde ambt onmiddellijk na de eerstvolgende
      verkiezing de leeftijd van 50 jaar heeft bereikt, wordt in artikel 132, eerste lid, voor «vier jaren» gelezen «zes
      jaren» en in artikel 132, tweede lid, voor «55 jaar» gelezen: 50 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0007791
  - number: 163b.3
    text: |-
      Ten aanzien van de belanghebbende die op het tijdstip van inwerkingtreding van de
      [artikelen 132a tot en met 132c][ref1] is benoemd als lid van gedeputeerde staten, wethouder, lid van het
      dagelijks bestuur van een deelgemeente of lid van het dagelijks bestuur van een waterschap dat op het tijdstip
      voorafgaand aan de inwerkingtreding van de artikelen 132a tot en met 132c niet overheidswerknemer in de zin van
      de [Wet privatisering ABP][ref2] was, en na de eerstvolgende verkiezing voor de leden van provinciale staten, de
      gemeenteraad onderscheidenlijk het algemeen bestuur van het waterschap niet wordt herbenoemd, zijn de artikelen
      132a tot en met 132c niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
      [ref2]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0007791
  - number: 163c.1
    text: |-
      In afwijking van [artikel 138b, derde lid][ref1], informeert gedeputeerde staten het gewezen lid van
      gedeputeerde staten van wie de uitkeringsduur, bedoeld in [artikel 132, eerste of tweede lid][ref2],
      is geëindigd in de periode gelegen tussen 31 december 2007 en de dag van inwerkingtreding van de
      [Wet aanpassing Appa en enkele andere wetten 2011][ref3], binnen vier maanden na inwerkingtreding van de Wet
      aanpassing Appa en enkele andere wetten 2011 over de mogelijkheid, bedoeld in artikel 138b, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel138b
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0030652
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 138b
        hoofdstuk: '22'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0030652
  - number: 163c.2
    text: |-
      Het gewezen lid van gedeputeerde staten kan tot een jaar na de inwerkingtreding van de
      [Wet aanpassing Appa en enkele andere wetten 2011][ref1] gedeputeerde staten verzoeken tot omzetting van eigen
      pensioen in nabestaandenpensioen als bedoeld in [artikel 138b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030652
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel138b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163c
    references:
      - id: ref1
        bwb_id: BWBR0030652
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 138b
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 163d
    text: |-
      Ten aanzien van leden van het dagelijks bestuur van een waterschap die na de waterschapsverkiezingen in 2008 op
      8 januari 2009 zijn herbenoemd, wordt voor de opbouw van het pensioen over de pensioengeldige tijd tot en met
      7 januari 2009 gerekend met de pensioengrondslag gebaseerd op de wedde die het lid van het dagelijks bestuur genoot
      op 7 januari 2009.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163d
  - number: 163e
    text: |-
      Ten aanzien van de uitkeringen die zijn toegekend ter zake van een ontslag of aftreden vóór het tijdstip van
      inwerkingtreding van de [Wet aanpassing uitkeringsduur Appa][ref1], blijft de uitkeringsduur van kracht zoals deze
      gold op de dag voorafgaand aan dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0031991
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel163e
    references:
      - id: ref1
        bwb_id: BWBR0031991
  - number: '164'
    text: |-
      De kosten van de in deze wet bedoelde uitkeringen en pensioenen en de kosten van de overname van en de
      gedeeltelijke vergoeding van de premie die ingevolge de [Algemene Ouderdomswet][ref1] en de Algemene Weduwen- en
      Wezenwet daarover wordt geheven, voor zover niet is bepaald dat deze kosten ten laste van het Algemeen burgerlijk
      pensioenfonds komen, komen ten laste van Hoofdstuk VII van de rijksbegroting, voor zover deze kosten betrekking
      hebben op ministers, gewezen ministers, gepensioneerde ministers, nabestaanden en wezen van gewezen ministers,
      en ten laste van Hoofdstuk II van de rijksbegroting, indien meergenoemde kosten betrekking hebben op leden van de
      Tweede Kamer der Staten-Generaal, gepensioneerde kamerleden, nabestaanden en wezen van deze leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '166'
    text: 'Deze wet kan worden aangehaald als: Algemene pensioenwet politieke ambtsdragers.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel166
  - number: '167.1'
    text: |-
      Behoudens het tweede lid treedt deze wet in werking met ingang van de eerste dag van de maand volgende op die van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel167
  - number: '167.3'
    text: |-
      Met uitzondering van de in het tweede en vierde lid genoemde artikelen en onderdelen van artikelen en van
      de [artikelen 37][ref1], [39, tweede en derde lid][ref2], [43, tweede lid][ref3], [44, tweede lid][ref4],
      [45, tweede lid][ref5], [82][ref6], [84][ref7], [87, tweede lid][ref8], [88, tweede lid][ref9],
      [89, tweede lid][ref10], [118, derde lid][ref11], [128][ref12], [129][ref13] en [163, tweede en derde lid][ref14],
      werkt deze wet terug tot 1 januari 1966.


