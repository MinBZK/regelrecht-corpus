  - number: '156.1'
    text: Dit artikel is uitsluitend van toepassing op pensioenberekeningen over jaren gelegen voor 1 januari 1986.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel156
  - number: '156.2'
    text: |-
      Indien het bedrag dat tot grondslag heeft gestrekt voor de berekening van het pensioen, nadat dat bedrag is
      aangepast aan de hand van de regels, bedoeld in [artikel 157, derde lid][ref1], op de dag met ingang waarvan
      [artikel 155][ref2] voor de eerste maal ten aanzien van het pensioen toepassing vindt, lager is dan f 32.094,- ,
      wordt het met toepassing van laatstgenoemd artikel berekende inbouwbedrag vermenigvuldigd met een breuk, waarvan
      de teller is eerstbedoeld bedrag op bedoelde dag en waarvan de noemer is f 32.094,- . De uitkomst van deze
      vermenigvuldiging vormt in dat geval het inbouwbedrag. Het in de eerste volzin genoemd bedrag wordt gewijzigd bij
      de ministeriële regeling bedoeld in [artikel 157][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel157
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '157'
        hoofdstuk: '26'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '155'
        hoofdstuk: '25'
        paragraaf: '3'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '157'
        hoofdstuk: '26'
        afdeling: Vijfde
  - number: '156.3'
    text: |-
      Indien het pensioen rechtstreeks of middellijk is afgeleid van een eigen pensioen, geldt voor de toepassing van het
      vorige lid als grondslag voor de berekening van het pensioen, het bedrag dat heeft gestrekt tot grondslag voor de
      berekening van het eigen pensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel156
  - number: '156.4'
    text: |-
      Indien het bedrag van het algemeen ouderdomspensioen, dat gerekend wordt deel uit te maken van het pensioen,
      reeds is verminderd krachtens het eerste lid, vindt [artikel 102, eerste lid][ref1], slechts toepassing voor zover
      zulks nodig is om te voorkomen, dat de som van evenbedoeld verminderd bedrag en het bedrag van de vermindering,
      bedoeld in het [eerste lid van artikel 102][ref2], zou overschrijden het bedrag dat, zonder toepassing van het
      [eerste lid, krachtens artikel 97][ref3] gerekend zou worden deel uit te maken van het bedrag van het pensioen. De
      vorige volzin is van overeenkomstige toepassing in het geval bedoeld in [artikel 102, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel97
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel102
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '102'
        hoofdstuk: '17'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '102'
        hoofdstuk: '17'
