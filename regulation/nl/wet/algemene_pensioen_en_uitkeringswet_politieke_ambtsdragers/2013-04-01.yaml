        hoofdstuk: '22'
        afdeling: Vijfde
      - id: ref8
        bwb_id: BWBR0002691
        artikel: '130'
        hoofdstuk: '20'
        afdeling: Vijfde
  - number: 138a.2
    text: |-
      In afwijking van het eerste lid behoort niet tot de wedde de verhoging van de wedde per 1 januari 2001 ingevolge
      dan wel op de voet van [artikel 3 van de Wet brutering overhevelingstoeslag lonen 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0006353
        artikel: '3'
  - number: 138a.3
    text: |-
      Als tijd als lid van gedeputeerde staten telt mee de tijd met recht op uitkering. Het pensioen over die tijd wordt
      berekend naar 2 percent per jaar over de eerste vier jaren van het recht op uitkering dan wel over de volledige
      tijd met recht op uitkering indien die tijd minder is dan vier jaren en vervolgens naar 1 percent per jaar. In het
      geval van een uitkering als bedoeld in [artikel 133a][ref1], wordt het pensioen over de tijd met recht op uitkering
      berekend naar 2 percent per jaar voor zover en voor zolang het percentage van de algemene invaliditeit 55 percent
      of meer bedraagt. Voor de toepassing van de vorige volzin wordt een uitkering als bedoeld in [artikel 131][ref2]
      aangemerkt als een uitkering als bedoeld in [artikel 133a][ref3], indien en zolang de belanghebbende tijdens de
      duur van de eerstbedoelde uitkering voor 55 percent of meer algemeen invalide is.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel131
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '131'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 138a.4
    text: |-
      In afwijking van het derde lid wordt het pensioen over de in dat lid bedoelde tijd berekend naar de helft van het
      ingevolge dat lid toepasselijke percentage, over het gedeelte van die tijd waarin de uitkering is verminderd wegens
      het genieten van inkomsten als bedoeld in [artikel 134][ref1]. Geen meetelling van diensttijd als bedoeld in het
      derde lid vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 138a.4.a
    text: |-
      voor zover gedurende de in dat lid bedoelde tijd de uitkering wegens het genieten van inkomsten als bedoeld in
      [artikel 134][ref1] tot nihil is verminderd;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 138a.4.b
    text: |-
      in zover de belanghebbende die recht heeft op uitkering, maar die minder uitkering geniet dan de krachtens
      [artikel 160][ref1] berekende inhoudingen ter zake van ouderdom en overlijden, er geen zorg voor draagt dat het
      bedrag van deze inhoudingen, welk bedrag in dit geval als een op hem rustende schuld wordt beschouwd, bij het
      bereiken van de 65-jarige leeftijd is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel160
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '160'
        hoofdstuk: '28'
        afdeling: Vijfde
  - number: 138a.4.c
    text: indien de belanghebbende daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
  - number: 138a.5
    text: |-
      Een lid van gedeputeerde staten en een gewezen lid van gedeputeerde staten hebben bij ingang van het pensioen
      eenmalig de keuzemogelijkheid het pensioen met 12 percent te verhogen, voorzover het is berekend over tijd
      als lid van gedeputeerde staten die is gelegen na 30 juni 1999 en die overeenkomt met de tijd die krachtens
      [artikel 145][ref1] voor de berekening van het nabestaandenpensioen in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel145
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '145'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 138a.6
    text: |-
      Met de verhoging van het pensioen, bedoeld in het vijfde lid, vervalt de aanspraak op nabestaandenpensioen,
      voorzover opgebouwd na 30 juni 1999.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
  - number: 138a.7
    text: |-
      De keuze, bedoeld in het vijfde lid, kan slechts worden gedaan met toestemming van de echtgenoot of de aangemelde
      partner. De regels, bedoeld in [artikel 13a, achtste lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 138a.8
    text: |-
      De verhoging van het pensioen gaat in met ingang van de dag waarop het recht op pensioen ontstaat en is
      onherroepelijk.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138a
  - number: 138b.1
    text: |-
      Een gewezen lid van gedeputeerde staten kan na afloop van de uitkeringsduur, bedoeld in
      [artikel 132, eerste of tweede lid][ref1], de vanaf 1 augustus 2003 opgebouwde aanspraken op eigen pensioen
      omzetten in een aanspraak op nabestaandenpensioen bij overlijden voor het bereiken van de leeftijd van 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 138b.2
    text: |-
      Voor de omzetting van het eigen pensioen, bedoeld in het eerste lid, stelt Onze Minister bij ministeriële regeling
      een leeftijdsafhankelijke ruilvoet vast.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138b
  - number: 138b.3
    text: |-
      Gedeputeerde staten informeert het gewezen lid van gedeputeerde staten binnen vier maanden voor het einde van de
      uitkering over de mogelijkheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138b
  - number: 138b.4
    text: |-
      Het gewezen lid van gedeputeerde staten dient zijn keuze binnen zes weken na ontvangst van deze mededeling
      schriftelijk aan gedeputeerde staten mee te delen. Tot het moment van het eindigen van de termijn van zes weken,
      verkrijgt het gewezen lid van gedeputeerde staten een premievrije aanspraak op nabestaandenpensioen overeenkomstig
      de tijd tot het moment van aftreden van de minister.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138b
  - number: 138b.5
    text: |-
      Als omzetting als bedoeld in het eerste lid gevolgd wordt door een waardeoverdracht als bedoeld in
      [artikel 160a][ref1], wordt de vermindering van het eigen pensioen aangepast. De aanspraak op nabestaandenpensioen
      als bedoeld in het eerste lid, wordt omgezet in een aanspraak op eigen pensioen met inachtneming van de ruilvoet,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel160a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 160a
        hoofdstuk: '28'
        afdeling: Vijfde
  - number: 138b.6
    text: |-
      Als een gewezen lid van gedeputeerde staten op enig moment opnieuw lid van gedeputeerde staten wordt, wordt de
      vermindering van het eigen pensioen, bedoeld in het eerste lid, aangepast. De aanspraak op nabestaandenpensioen
      als bedoeld in het eerste lid, wordt omgezet in een aanspraak op eigen pensioen met inachtneming van de ruilvoet,
      bedoeld in het tweede lid, behorende bij de leeftijd van het lid van gedeputeerde staten op het moment dat hij
      opnieuw lid wordt van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138b
  - number: 138b.7
    text: |-
      Het vijfde en zesde lid zijn niet van toepassing bij het einde van het huwelijk na aftreden van het lid van
      gedeputeerde staten en voor waardeoverdracht of voor het opnieuw lid worden van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel138b
  - number: '139.1'
    text: Voor tijd vóór 1 januari 1986 is de pensioengrondslag de wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139
  - number: '139.2'
    text: |-
      De wedde wordt voor de toepassing van het eerste lid vermenigvuldigd met 100/110 indien deze laatstelijk is genoten
      tussen 31 december 1985 en 1 januari 1995. De aldus vastgestelde pensioengrondslag is echter niet lager dan de
      wedde verminderd met € 2 867,89 . Het bedrag van € 2 867,89 wordt telkens gewijzigd bij de ministeriële regeling,
      bedoeld in [artikel 157, derde lid][ref1], overeenkomstig de aanpassing van een bedrag dat, omgerekend naar euro’s,
      op 1 januari 1985 € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel157
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '157'
        hoofdstuk: '26'
        afdeling: Vijfde
  - number: '139.3'
    text: |-
      De wedde wordt voor de toepassing van het eerste lid vermenigvuldigd met een debruteringsfactor overeenkomstig
      [artikel 139a, tweede lid][ref1], indien deze laatstelijk is genoten na 31 december 1994. Op het aldus gevonden
      bedrag is het tweede lid van dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 139a
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: '139.4'
    text: |-
      Bij de berekening van een pensioen van een gewezen wethouder die voor 1 januari 1986 voor zijn bezoldiging geacht
      werd niet de volledige werkweek aan het wethouderschap te besteden, wordt de wedde, vastgesteld volgens het tweede
      of het derde lid, vermenigvuldigd met de deeltijdfactor.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139
  - number: '139.5'
    text: |-
      [Hoofdstuk 17][ref1] is van toepassing op het pensioen, voor zover berekend over de in het eerste lid bedoelde
      tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 139a.1
    text: |-
      Voor tijd tussen 31 december 1985 en 1 januari 1995 is de pensioengrondslag de wedde verminderd met een bedrag,
      genaamd franchise.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139a
  - number: 139a.2
    text: |-
      De wedde wordt voor de toepassing van het eerste lid vermenigvuldigd met een debruteringsfactor
      indien deze laatstelijk is genoten na 31 december 1994. Deze factor is de breuk, waarvan
      de teller honderd bedraagt en de noemer de som is van honderd en het percentage waarmee het
      inkomen als lid van gedeputeerde staten per 1 januari 1995 uitsluitend ter uitvoering van
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________________________________ (Stb. 418) is
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006684#ArtikelII
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0006684
        artikel: II
  - number: 139a.3
    text: 'De in het eerste lid bedoelde franchise is:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139a
  - number: 139a.3.a
    text: |-
      voor het gepensioneerde lid van gedeputeerde staten dat voor de toepassing van de [Algemene Ouderdomswet][ref1] als
      gehuwd wordt aangemerkt twintig zevende maal het tot een jaarbedrag herleide bedrag dat geldt voor een gehuwde per
      1 januari van het jaar waarin het recht op pensioen ontstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 139a.3.b
    text: |-
      voor het gepensioneerde lid van gedeputeerde staten dat voor de toepassing van de [Algemene Ouderdomswet][ref1] als
      ongehuwd wordt aangemerkt tien zevende maal het tot een jaarbedrag herleide bedrag dat geldt voor een ongehuwde per
      1 januari van het jaar waarin het recht op pensioen ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 139a.4
    text: |-
      In de in het derde lid bedoelde bedragen is mede begrepen de bruto vakantie-uitkering waarop ingevolge de
      [Algemene Ouderdomswet][ref1] recht bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 139a.5
    text: |-
      Wanneer de in het derde lid bedoelde bedragen op grond van persoonlijke omstandigheden worden gewijzigd, wordt de
      pensioengrondslag herberekend. Het herberekende pensioen gaat, onverminderd [artikel 139d, tweede lid][ref1], in op
      dezelfde dag als waarop de bedoelde wijzigingen zich hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139d
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 139d
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 139aa
    text: |-
      [Artikel 139a, eerste lid][ref1], is van toepassing op tijd na 31 december 1994, met dien verstande dat de
      franchise bij of krachtens algemene maatregel van bestuur wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139aa
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 139a
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 139b
    text: |-
      Tijd, doorgebracht als lid van gedeputeerde staten, gedurende welke de belanghebbende voor zijn bezoldiging geacht
      werd niet de volledige werkweek aan zijn ambt te besteden, telt voor de pensioenberekening met toepassing van
      [artikel 139a][ref1] of [139aa][ref2], dan wel met toepassing van beide artikelen, mee met inachtneming van de voor
      die tijd toepasselijke deeltijdfactor of deeltijdfactoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel139aa
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 139a
        hoofdstuk: '22'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 139aa
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 139c.1
    text: |-
      Het gepensioneerde lid van gedeputeerde staten heeft recht op een toeslag op zijn pensioen indien dat pensioen
      is berekend met toepassing van de franchise bedoeld in [artikel 139a, derde lid, onderdeel a][ref1], en indien
      de kalendertijd, waarin de voor de berekening van zijn pensioen meetellende diensttijd is gelegen, geheel of
      gedeeltelijk samenvalt met kalendertijd, die in aanmerking is genomen bij de berekening van enig pensioen waarop
      zijn echtgenoot recht heeft, mits op laatstbedoeld pensioen een vermindering is toegepast uit hoofde van recht op
      ouderdomspensioen ingevolge de [Algemene Ouderdomswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 139a
        hoofdstuk: '22'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002221
  - number: 139c.2
    text: |-
      Voor de toepassing van dit artikel wordt mede als echtgenoot aangemerkt degene die voor de toepassing van de
      [Algemene Ouderdomswet][ref1] als echtgenoot van het gepensioneerde lid van gedeputeerde staten wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139c
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 139c.3
    text: |-
      De in het eerste lid bedoelde toeslag bedraagt voor elk voor de berekening van het pensioen
      meetellend jaar binnen de samenlopende kalendertijd 0,525 percent van de franchise bedoeld in
      [artikel 139a, derde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 139a
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 139c.4
    text: |-
      De toeslag wordt slechts toegekend op verzoek en gaat in de op de dag waarop de in het eerste lid bedoelde
      omstandigheid is opgetreden, met dien verstande dat de toeslag niet vroeger ingaat dan een jaar voor de eerste dag
      van de maand waarin het verzoek is ingediend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139c
  - number: 139c.5
    text: |-
      Voor de toepassing van [hoofdstuk 23][ref1] wordt de toeslag ingevolge dit artikel niet onder pensioen begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk23
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '23'
        afdeling: Vijfde
  - number: 139d.1
    text: |-
      Indien in het bedrag van het ouderdomspensioen, waaronder medebegrepen een eventuele toeslag en de vakantie-
      uitkering, ingevolge de [Algemene Ouderdomswet][ref1] een wijziging wordt aangebracht op grond van persoonlijke
      omstandigheden, is degene aan wie een pensioen krachtens dit hoofdstuk is toegekend over diensttijd vóór 1 januari
      1995, gehouden daarvan onverwijld kennis te geven aan provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139d
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 139d.2
    text: |-
      Indien de in het eerste lid bedoelde wijziging leidt tot verhoging van het pensioen krachtens dit hoofdstuk, gaat
      die verhoging niet vroeger in dan een jaar voor de eerste dag van de maand waarin de daarbedoelde kennisgeving werd
      gedaan of waarin die verhoging ambtshalve plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139d
  - number: 139d.3
    text: In bijzondere gevallen kunnen provinciale staten het tweede lid buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel139d
  - number: '140.1'
    text: |-
      De nabestaande van een lid van gedeputeerde staten, gewezen lid van gedeputeerde staten of gepensioneerd lid van
      gedeputeerde staten heeft recht op pensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel140
  - number: '140.2'
    text: 'In afwijking van het eerste lid bestaat geen recht op nabestaandenpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel140
  - number: 140.2.a
    text: |-
      indien het huwelijk is gesloten nadat het gepensioneerde lid van gedeputeerde staten de leeftijd van 65 jaar had
      bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel140
  - number: 140.2.b
    text: |-
      bij overlijden van een gewezen lid van gedeputeerde staten vóór het bereiken van de leeftijd van 65 jaar, voorzover
      de pensioengeldige tijd van de overledene is gelegen na 31 juli 2003;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel140
  - number: 140.2.c
    text: |-
      bij overlijden van een gepensioneerd lid van gedeputeerde staten, voorzover de pensioengeldige tijd van de
      overledene is gelegen na 30 juni 1999 en de keuze is gedaan, bedoeld in [artikel 138a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel138a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 138a
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: '140.3'
    text: |-
      Voor de toepassing van het tweede lid geldt niet als gewezen lid van gedeputeerde staten het gewezen lid van
      gedeputeerde staten met recht op uitkering als bedoeld in [artikel 131][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel131
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '131'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '142.1'
    text: |-
      Ten laste van de provincie wordt recht op bijzonder nabestaandenpensioen verleend aan de vrouw of man met wie een
      overleden lid, gewezen lid of gepensioneerd lid van gedeputeerde staten gehuwd is geweest, mits:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: 142.1.a
    text: |-
      hij of zij recht op nabestaandenpensioen zou hebben gehad, indien het lid, gewezen lid of gepensioneerd lid
      van gedeputeerde staten op de dag van het vonnis, waarbij de echtscheiding of de ontbinding van het huwelijk is
      uitgesproken, zou zijn overleden, en
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: 142.1.b
    text: |-
      de onder *a* bedoelde dag ligt na het tijdstip van de inwerkingtreding van de Wet herziening echtscheidingsrecht en
      de echtscheiding of ontbinding van het huwelijk niet is uitgesproken met toepassing van het voor genoemd tijdstip
      geldende recht.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: '142.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de vrouw of man van wie de aanmelding is
      geëindigd, mits zij of hij recht op nabestaandenpensioen zou hebben gehad, indien het lid van gedeputeerde staten,
      het gewezen lid van gedeputeerde staten of gepensioneerde lid van gedeputeerde staten op de dag van eindigen van de
      aanmelding zou zijn overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: '142.3'
    text: 'In afwijking van het het eerste en het tweede lid bestaat geen recht op bijzonder nabestaandenpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: 142.3.a
    text: |-
      indien het lid van gedeputeerde staten, gewezen lid van gedeputeerde staten of gepensioneerde lid van gedeputeerde
      staten en de desbetreffende vrouw of man dat zijn overeengekomen bij huwelijkse voorwaarden, bij geschrift met het
      oog op het einde van het huwelijk of de aanmelding, en gedeptuteerde staten daarmee instemmen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: 142.3.b
    text: |-
      indien de onder a bedoelde vrouw of man als gevolg van hertrouwen met of aanmelding door hetzelfde lid van
      gedeputeerde staten wegens diens overlijden recht op nabestaandenpensioen heeft;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: 142.3.c
    text: |-
      bij overlijden van een lid van gedeputeerde staten of gewezen lid van gedeputeerde staten voor de leeftijd van 65
      jaar, voorzover de pensioengeldige tijd van de overledene is gelegen na 31 juli 2003;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
  - number: 142.3.d
    text: |-
      bij overlijden van een gepensioneerd lid van gedeputeerde staten, voorzover de pensioengeldige tijd van de
      overledene is gelegen na 30 juni 1999 en de keuze is gedaan, bedoeld in [artikel 138a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel138a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 138a
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: '143.1'
    text: 'Ten laste van de provincie wordt recht op wezenpensioen verleend aan:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel143
  - number: 143.1.a
    text: |-
      de kinderen, van hem die overlijdt als lid, gewezen of gepensioneerde lid van gedeputeerde staten, die de leeftijd
      van eenentwintig jaren nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn dan wel niet partij zijn
      of partij zijn geweest bij een aanmelding, mits zij zijn geboren of geadopteerd voor zijn aftreden is ingegaan of
      in de periode waarin hij recht heeft op uitkering ter zake van het aftreden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel143
  - number: 143.1.b
    text: |-
      de kinderen ten opzichte van welke aan een mannelijk lid, gewezen of gepensioneerd lid van gedeputeerde staten ten
      tijde van zijn overlijden een onderhoudsplicht krachtens [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1]
      dan wel [artikel 394 van Boek 1 van het Burgerlijk Wetboek BES][ref2] was opgelegd, dan wel door hem bij
      authentieke akte een dergelijke verplichting was erkend, onder dezelfde voorwaarden als genoemd in onderdeel *a*,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel394
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '394'
  - number: 143.1.c
    text: |-
      de kinderen voor welke het lid, gewezen lid of gepensioneerd lid van gedeputeerde staten ten tijd van zijn
      overlijden de pleegouderlijke zorg droeg, onder dezelfde voorwaarden als genoemd in onderdeel *a*, met dien
      verstande dat in plaats van het tijdstip van geboorte of adoptie het tijdstip van aanvang van de pleegouderlijke
      zorg in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel143
  - number: '143.2'
    text: |-
      Onder pleegouderlijke zorg bedoeld in het eerste lid, onder *c*, wordt verstaan de zorg voor het onderhoud en
      de opvoeding van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het
      genieten van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel143
  - number: '144.1'
    text: |-
      Indien een lid, gewezen lid of gepensioneerd lid van gedeputeerde staten is vermist, wordt aan degenen, die aan
      zijn overlijden recht op pensioen zouden ontlenen, ten laste van de provincie recht op tijdelijk pensioen op
      dezelfde voet als in de voorgaande artikelen van dit hoofdstuk is omschreven, verleend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel144
  - number: '144.2'
    text: |-
      Het tijdelijk pensioen gaat van rechtswege over in een voortdurend pensioen zodra het overlijden van de vermiste
      vaststaat.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel144
  - number: '145.1'
    text: |-
      Het nabestaandenpensioen bedraagt vijf zevende gedeelte van het pensioen, waarop het overleden lid van gedeputeerde
      staten als zodanig aanspraak zou hebben gehad, indien hij met ingang van de dag na die van zijn overlijden was
      ontslagen, of waarop het overleden gewezen lid van gedeputeerde staten als zodanig recht of uitzicht had, een en
      ander met inachtneming van [artikel 140, tweede lid, onder b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel140
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '140'
        hoofdstuk: '23'
        paragraaf: '1'
        afdeling: Vijfde
  - number: '145.2'
    text: 'In afwijking van het vorige lid bedraagt het pensioen van de nabestaande van hem die overlijdt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145
  - number: 145.2.a
    text: |-
      als lid van gedeputeerde staten vóór het bereiken van de leeftijd van 65 jaar, vijf zevende gedeelte van het
      pensioen waarop dit lid aanspraak zou hebben kunnen maken, indien hij zijn lidmaatschap tot het bereiken van
      evengenoemde leeftijd zou hebben bekleed;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145
  - number: 145.2.b
    text: |-
      als gewezen lid van gedeputeerde staten in de periode, waarover hem een uitkering is toegekend, vijf zevende
      gedeelte van het pensioen waarop het gewezen lid aanspraak zou hebben kunnen maken, indien hij tot het bereiken
      van de leeftijd van 65 jaar recht op uitkering zou hebben gehad, met dien verstande dat voor de berekening van het
      pensioen de diensttijd wordt doorgeteld naar de mate van medetelling van diensttijd op de dag van overlijden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145
  - number: '145.3'
    text: |-
      Indien wegens eenzelfde sterfgeval voor een nabestaande recht ontstaat op meer dan een nabestaandenpensioen
      op de voet van deze afdeling dan wel op een nabestaandenpensioen op de voet van deze afdeling en op een
      nabestaandenpensioen krachtens de [tweede][ref1] of [derde afdeling][ref2] van deze wet, wordt voor de berekening
      van de eigen pensioenen, waarvan de nabestaandenpensioenen zijn afgeleid, tijd die zowel voor de berekening van
      eerstbedoeld pensioen als voor de berekening van het andere pensioen medetelt en niet daadwerkelijk gelijktijdig in
      de verschillende ambten is doorgebracht, slechts medegeteld voor de berekening van het pensioen, waarbij die tijd
      het hoogste bedrag oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Derde
  - number: '145.4'
    text: |-
      Bij de toepassing van de voorgaande leden wordt ten aanzien van het eigen pensioen voor zover
      [artikel 139a][ref1] daarop van toepassing is, in alle gevallen gerekend met de franchise bedoeld in
      [artikel 139a, derde lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel139a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 139a
        hoofdstuk: '22'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 139a
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 145a.1
    text: |-
      De nabestaande die jonger is dan 65 jaar maar geen recht heeft op nabestaandenuitkering ingevolge de
      [Algemene nabestaandenwet][ref1], heeft recht op een toeslag op zijn volgens [artikel 145][ref2] berekende
      pensioen, indien dat is berekend of mede berekend over diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel145
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '145'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 145a.2
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na 31 december
      1985 2,5 procent van 75 procent van het tot een jaarbedrag herleide bedrag van de nabestaandenuitkering en de
      vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1], zoals die wet geldt op 1 januari van het jaar
      waarin recht op nabestaandenpensioen ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 145a.3
    text: |-
      De nabestaande, bedoeld in het eerste lid, die jonger is dan 40 jaar, heeft recht op de in dat lid bedoelde toeslag
      voor de duur van 12 maanden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145a
  - number: 145a.4
    text: |-
      De toeslag gaat in met ingang van de maand waarin het recht daarop ontstaat en wordt met ingang van 1 januari van
      ieder jaar aangepast volgens de regels, bedoeld in [artikel 157, eerste lid][ref1], vanaf 1 juli 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel157
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '157'
        hoofdstuk: '26'
        afdeling: Vijfde
  - number: 145a.5
    text: 'Het recht op toeslag vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145a
  - number: 145a.5.a
    text: met ingang van de dag waarop de nabestaande 65 jaar wordt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145a
  - number: 145a.5.b
    text: |-
      met ingang van de maand volgend op die waarin de nabestaande hertrouwt, als partner wordt aangemeld of als
      samenwonend als bedoeld in de [Algemene nabestaandenwet][ref1] wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 145b.1
    text: |-
      De nabestaande die recht heeft op nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1], waarop
      inkomen in mindering wordt gebracht, heeft recht op een toeslag op zijn volgens [artikel 145][ref2] berekende
      pensioen, indien dat is berekend of mede berekend over diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel145
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145b
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '145'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 145b.2
    text: |-
      Recht op toeslag heeft eveneens de nabestaande aan wie in het tijdvak van 1 juli 1996 tot 1 juli 1999
      nabestaandenpensioen is toegekend en op wiens uitkering ingevolge de [Algemene nabestaandenwet][ref1] in dat
      tijdvak inkomen in mindering is gebracht, met ingang van die vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 145b.3
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na
      31 december 1985 2,5 percent van het verschil tussen 75 percent van het tot een jaarbedrag herleide bedrag van de
      nabestaandenuitkering en de vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1], zoals die wet geldt
      op 1 januari van het jaar waarin recht op nabestaandenpensioen ontstaat, zonder de vermindering en het verminderde
      bedrag. De toeslag bedraagt niet meer dan 75 percent van het in de eerste volzin eerstbedoelde bedrag en kan niet
      negatief zijn. De toeslag wordt nader vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 145b.3.a
    text: |-
      met ingang van 1 januari van ieder jaar volgens de regels, bedoeld in [artikel 105, eerste lid][ref1], vanaf 1 juli
      1999;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 145b.3.b
    text: |-
      bij iedere nadere vaststelling van de verminderdering van een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 145b.3
    text: |-
      [Artikel 145a, vierde en vijfde lid][ref1], zijn mede van toepassing op de toeslag ingevolge dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel145a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 145a
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 145c.1
    text: |-
      De nabestaande die recht heeft op nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1] en op
      1 januari 1998 55 jaar of ouder is, heeft recht op een toeslag op zijn volgens [artikel 145][ref2] berekende
      pensioen, indien dat is berekend of mede berekend over diensttijd na 31 december 1985, indien en voor zo lang
      hij recht heeft op een nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref3], die krachtens
      [artikel 67, derde of negende lid van die wet][ref4] vanaf 1 januari 1998 wordt verminderd wegens de omstandigheid
      dat de nabestaande vanaf een tijdstip voor 1 juli 1996 met dezelfde persoon onafgebroken ongehuwd samenwoont.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel145
      [ref3]: https://wetten.overheid.nl/BWBR0007795
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145c
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '145'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0007795
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '67'
  - number: 145c.2
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na 31
      december 1985 2,5 procent van het verschil tussen 75 procent van het tot een jaarbedrag herleide bedrag van de
      nabestaandenuitkering en de vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1] zonder vermindering
      en het verminderde bedrag. De toeslag bedraagt niet meer dan 75 procent van het in de eerste volzin eerstbedoelde
      bedrag. De toeslag wordt vanaf 1 januari 1998 vastgesteld met inachtneming van de vanaf die datum geldende bedragen
      krachtens de [Algemene nabestaandenwet][ref2] en wordt vervolgens nader vastgesteld met ingang van 1 januari en 1
      juli aan de hand van de ontwikkeling van die bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145c
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0007795
  - number: 145c.3
    text: 'Het recht op de toeslag vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145c
  - number: 145c.3.a
    text: met ingang van de dag waarop de nabestaande de 65-jarige leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145c
  - number: 145c.3.b
    text: met ingang van de maand volgend op die waarin de nabestaande trouwt of partij is bij een aanmelding;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145c
  - number: 145c.3.c
    text: |-
      met ingang van de eerste dag van de maand waarin de vermindering van de nabestaandenuitkering, bedoeld in het
      eerste lid, ongedaan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145c
  - number: 145c.4
    text: |-
      [Artikel 145a, vierde lid][ref1], is van overeenkomstige toepassing. [Artikel 145b][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel145a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel145b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel145c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 145a
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 145b
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: '146.1'
    text: |-
      Het bijzonder nabestaandenpensioen bedraagt vijf zevende gedeelte van een eigen pensioen waarbij in aanmerking
      wordt genomen:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel146
  - number: 146.1.a
    text: |-
      de berekeningsgrondslag waarnaar het pensioen van het lid van gedeputeerde staten, gewezen lid van gedeputeerde
      staten of gepensioneerde lid van gedeputeerde staten zou zijn berekend indien deze op de dag van ontbinding van het
      huwelijk dan wel van het einde van de aanmelding als partner recht op pensioen zou hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel146
  - number: 146.1.b
    text: |-
      pensioengeldige tijd die is gelegen vóór de onder a bedoelde dag, met dien verstande dat in de gevallen bedoeld in
      [artikel 142, derde lid, onder c en d][ref1], uitsluitend tijd vóór respectievelijk 1 augustus 2003 en 1 juli 1999
      in aanmerking word genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel142
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '142'
        hoofdstuk: '23'
        paragraaf: '1'
        afdeling: Vijfde
  - number: '146.2'
    text: |-
      Indien er recht bestaat op meer dan een bijzonder nabestaandenpensioen als bedoeld in
      [artikel 142, eerste of tweede lid][ref1], vindt het eerste lid overeenkomstige toepassing met dien verstande, dat
      voor de berekening van het bijzonder nabestaandenpensioen ontleend aan elk huwelijk en elke aanmelding waaraan een
      eerder huwelijk dan wel een eerdere aanmelding voorafgaat slechts de diensttijd medetelt die samenloopt of geacht
      kan worden samen te lopen met de huwelijksduur dan wel de duur van de aanmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel142
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '142'
        hoofdstuk: '23'
        paragraaf: '1'
        afdeling: Vijfde
  - number: '146.3'
    text: |-
      [Artikel 145, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel145
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '145'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: '146.4'
    text: |-
      Indien er bij een overlijden recht bestaat op een of meer bijzondere nabestaandenpensioenen wordt het
      nabestaandenpensioen dat aan hetzelfde overlijden wordt ontleend met het bedrag daarvan verminderd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel146
  - number: '147'
    text: |-
      Indien een nabestaande hertrouwt, partij is bij een aanmelding of wordt aangemerkt als ongehuwd samenwonend als
      bedoeld in de [Algemene nabestaandenwet][ref1], wordt zijn pensioen opnieuw vastgesteld met ingang van de daarop
      volgende maand. Daarbij wordt uitsluitend de voor pensioen in aanmerking komende diensttijd van het lid van
      gedeputeerde staten, het gewezen lid van gedeputeerde staten of het gepensioneerde lid van gedeputeerde staten in
      aanmerking genomen, die gelegen is voor het tijdstip van diens overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '148.1'
    text: 'Het wezenpensioen bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148
  - number: 148.1.a
    text: |-
      voor elk kind, wiens ouder aan het overlijden van het lid, gewezen lid of gepensioneerd lid van gedeputeerde staten
      recht op pensioen ontleent, een zevende gedeelte;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148
  - number: 148.1.b
    text: |-
      voor elk ander kind, twee zevende gedeelte, van het pensioen van de overledene, berekend overeenkomstig
      [artikel 145][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel145
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '145'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: '148.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder ouder mede begrepen de nabestaande, die op het tijdstip van zijn
      overlijden de pleegouderlijke zorg had van het kind, bedoeld in [artikel 145][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel145
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '145'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 148a.1
    text: Dit artikel is uitsluitend van toepassing op pensioenberekeningen over diensttijd na 31 december 1985.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148a
  - number: 148a.2
    text: |-
      De wees die geen recht heeft op wezenuitkering ingevolge de [Algemene nabestaandenwet][ref1] heeft recht op een
      toeslag op zijn volgens [artikel 148][ref2] berekende pensioen, tenzij zijn ouder recht heeft op halfwezenuitkering
      ingevolge de [Algemene nabestaandenwet][ref3]. Deze toeslag bedraagt jaarlijks voor elk voor de berekening van het
      wezenpensioen tellend jaar:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel148
      [ref3]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '148'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0007795
  - number: 148a.2.a
    text: |-
      voor de wees, bedoeld in [artikel 148, eerste lid, onder a][ref1], 0,375 percent van de tot een jaarbedrag herleide
      som van de nabestaandenuitkering en de halfwezenuitkering ingevolge de [Algemene nabestaandenwet][ref2], zoals
      die wet geldt op 1 januari van het jaar waarin recht op nabestaandenpensioen ontstaat, vermeerderd met de daarover
      berekende vakantie-uitkering ingevolge die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel148
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '148'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0007795
  - number: 148a.2.b
    text: |-
      voor de wees bedoeld in [artikel 148, eerste lid, onder b][ref1], 0,75 percent van het onder *a* bedoelde
      jaarbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel148
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '148'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: 148a.3
    text: |-
      Indien aanspraak ontstaat op de toeslag, bedoeld in het tweede lid, geeft de wees hiervan onverwijld kennis aan de
      provincie. De toeslag gaat niet eerder in dan een jaar voor de eerste dag van de maand waarin de kennisgeving werd
      gedaan of waarin die toeslag ambtshalve is toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148a
  - number: 148a.4
    text: |-
      De toeslag gaat in met ingang van de maand waarin het recht daarop ontstaat en wordt met ingang van 1 januari van
      ieder jaar aangepast volgens de regels, bedoeld in [artikel 157, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel157
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel148a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '157'
        hoofdstuk: '26'
        afdeling: Vijfde
  - number: '149.1'
    text: |-
      Het wezenpensioen wordt herberekend overeenkomstig de [artikelen 148][ref1] en [148a][ref2], wanneer het
      nabestaandenpensioen of het bijzonder nabestaandenpensioen van de ouder wegens diens overlijden is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel148
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel148a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '148'
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 148a
        hoofdstuk: '23'
        paragraaf: '2'
        afdeling: Vijfde
  - number: '149.2'
    text: |-
      Wanneer het nabestaandenpensioen van de ouder krachtens [artikel 147][ref1] wegens hertrouwen dan wel een
      aanmelding opnieuw wordt vastgesteld, wordt het wezenpensioen bedoeld in [artikel 148, eerste lid, onder a][ref2],
      verhoogd met een bedrag dat zich verhoudt tot het bedrag van dat wezenpensioen, zoals het verschil tussen het
      nabestaandenpensioen bedoeld in [artikel 145][ref3], vóór en na toepassing van [artikel 147][ref4] zich verhoudt
      tot dat nabestaandenpensioen vóór die toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel148
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel145
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel147
