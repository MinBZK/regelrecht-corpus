        hoofdstuk: '26'
        afdeling: Vijfde
  - number: '151'
    text: |-
      Het tijdelijk pensioen is gelijk aan het pensioen waarop recht zou bestaan indien de vermiste op de dag van zijn
      vermissing was overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel151
  - number: '152.1'
    text: |-
      Het recht op pensioen vervalt indien gedurende vijf achtereenvolgende jaren iedere invordering achterwege is
      gebleven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel152
  - number: '152.2'
    text: Provinciale staten kunnen een op grond van het eerste lid vervallen recht op pensioen herstellen
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel152
  - number: '153'
    text: |-
      [Hoofdstuk 7 van deze wet][ref1] is van overeenkomstige toepassing ten aanzien van de in deze afdeling bedoelde
      pensioenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '7'
        afdeling: Tweede
  - number: '155'
    text: |-
      [Hoofdstuk 17][ref1] en de [artikelen 125 tot en met 127 van deze wet][ref2] zijn van overeenkomstige toepassing
      ten aanzien van de in deze afdeling bedoelde pensioenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel125
