        afdeling: Vierde
  - number: '157.1'
    text: |-
      Een pensioen op grond van deze afdeling, waaronder niet begrepen de inbouw- en franchisebedragen, wordt telkens
      aangepast overeenkomstig een aanpassing aan een algemene bezoldigingswijziging, van een pensioen van een
      gepensioneerde overheidswerknemer in de zin van de [Wet privatisering ABP][ref1] die werkzaam is geweest in de
      sector Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: '157.2'
    text: |-
      Indien aan een gepensioneerde overheidswerknemer, als bedoeld in het eerste lid, een eenmalige uitkering wordt
      toegekend, wordt aan degene die recht heeft op een pensioen, als bedoeld in dat lid, overeenkomstig een eenmalige
      uitkering toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel157
  - number: '157.3'
    text: |-
      Onze Minister stelt regels voor de toepassing van het eerste en het tweede lid. Deze regels werken zonodig terug
      tot en met de datum waarop een pensioenaanpassing is ingegaan of recht is ontstaan op een eenmalige uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel157
  - number: '158'
    text: |-
      Ten aanzien van de in deze afdeling bedoelde pensioenen zijn de [artikelen 111][ref1], [112][ref2], [113][ref3],
      [114][ref4], [115][ref5], [122][ref6], [123][ref7] en [128][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel113
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel114
      [ref5]: https://wetten.overheid.nl/BWBR0002691#Artikel115
      [ref6]: https://wetten.overheid.nl/BWBR0002691#Artikel122
      [ref7]: https://wetten.overheid.nl/BWBR0002691#Artikel123
      [ref8]: https://wetten.overheid.nl/BWBR0002691#Artikel128
