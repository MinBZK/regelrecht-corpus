---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: algemene_pensioen_en_uitkeringswet_politieke_ambtsdragers
regulatory_layer: WET
publication_date: '2022-10-11'
valid_from: '2013-04-01'
bwb_id: BWBR0002691
url: https://wetten.overheid.nl/BWBR0002691/2013-04-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regelingen tot toekenning van uitkering en van
    pensioen aan politieke ambtsdragers, zomede van pensioen aan hun nabestaanden, te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: - *Onze Minister:* Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel1
  - number: '1.2'
    text: |-
      Voor zover de voor uitkering en pensioen in aanmerking komende tijd kalenderjaren of kalendermaanden omvat, wordt
      deze tijd uitgedrukt in jaren, onderscheidenlijk maanden voor uitkering en pensioen in aanmerking komende tijd. De
      overige tijd wordt uitgedrukt in gedeelten van jaren, onderscheidenlijk gedeelten van maanden, waarbij het jaar op
      12 maanden en de maand op 30 dagen wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder pensioen tevens begrepen de toeslagen
      die in deze wet als zodanig zijn aangeduid, tenzij uit de desbetreffende bepalingen het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel1
  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
  - number: 2.1.a
    text: |-
      aanmelding: aanmelding als bedoeld in [artikel 2a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2.1.b
    text: |-
      nabestaande: de man of vrouw met wie de overleden politieke ambtsdrager, gewezen politieke ambtsdrager of
      gepensioneerde politieke ambtsdrager op de dag van overlijden gehuwd was, dan wel de man of vrouw ten aanzien van
      wie door de overledene aanmelding had plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
  - number: '2.2'
    text: Onder politieke ambtsdrager wordt verstaan voor de toepassing van
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
  - number: 2.2.a
    text: |-
      de [tweede afdeling][ref1] van deze wet: minister;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
  - number: 2.2.b
    text: |-
      de [derde afdeling][ref1] van deze wet: lid van de Tweede Kamer der Staten-Generaal;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Derde
  - number: 2.2.c
    text: |-
      de [vierde afdeling][ref1] van deze wet: minister of lid van de Tweede Kamer der Staten-Generaal;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVierde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vierde
  - number: 2.2.d
    text: |-
      de [vijfde afdeling][ref1] van deze wet: commissaris van de Koning, lid van gedeputeerde staten, burgemeester,
      wethouder, lid van het dagelijks bestuur van een deelgemeente, voorzitter of lid van het dagelijks bestuur van een
      waterschap of de Rijksvertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
  - number: '2.3'
    text: |-
      Waar in deze wet betekenis toekomt aan het gegeven dat een belanghebbende gehuwd is, gehuwd is geweest of een
      huwelijk aangaat, wordt mede begrepen onder gehuwd: als partner geregistreerd, respectievelijk onder huwelijk:
      geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2
  - number: 2a.1
    text: |-
      De politieke ambtsdrager, bedoeld in [artikel 2, tweede lid, onder a en b][ref1], alsmede de Rijksvertegenwoordiger
      kan bij Onze Minister één man of vrouw aanmelden, indien hij en deze man of vrouw:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2a.1.a
    text: |-
      beiden als ingezetene met het zelfde woonadres in de gemeentelijke basisadministratie persoonsgegevens zijn
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.1.b
    text: |-
      zich bij een notarieel verleden samenlevingscontract tegenover elkaar hebben verplicht om wederkerig bij te dragen
      in de kosten van levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.1.c
    text: beiden ongehuwd zijn;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.1.d
    text: beiden ten tijde van de aanmelding achttien jaar of ouder zijn en
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.1.e
    text: geen bloed- of aanverwanten in de rechte lijn zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.2
    text: |-
      Een gewezen politieke ambtsdrager als bedoeld in het eerste lid kan, voordat hij de leeftijd van 65 jaar heeft
      bereikt, eveneens een aanmelding doen als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.3
    text: |-
      Degene die een aanmelding doet, voegt daarbij een gewaarmerkt afschrift van de benodigde gegevens uit de
      gemeentelijke basisadministratie persoonsgegevens waaruit blijkt dat is voldaan aan de voorwaarde, gesteld in het
      eerste lid, onder *a*, alsmede een afschrift van het contract, bedoeld in het eerste lid, onder *b*, dan wel een
      uittreksel daaruit of een verklaring van een notaris dienaangaande, waaruit de wederzijdse onderhoudsplichtigheid
      blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.4
    text: |-
      Indien aan de voorwaarden voor aanmelding, gesteld in het eerste lid, niet wordt voldaan, weigert Onze Minister
      de aanmelding.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.5
    text: |-
      Onze Minister kan regels stellen omtrent de aanmelding door degene die niet als ingezetene in de gemeentelijke
      basisadministratie persoonsgegevens is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.6
    text: De aanmelding eindigt met het doorhalen ervan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.7
    text: 'Een aanmelding als bedoeld in het eerste lid wordt doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.7.a
    text: |-
      op de dag waarop een aanvraag daartoe van degene die de aanmelding heeft gedaan, dan wel van de man of vrouw die is
      aangemeld, is ontvangen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.7.b
    text: op de dag van overlijden van de man of vrouw die is aangemeld dan wel van degene die de aanmelding heeft gedaan, of
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.7.c
    text: |-
      op de dag waarop degene die de aanmelding heeft gedaan, dan wel de man of vrouw die is aangemeld, hetzij in het
      huwelijk treedt, hetzij partij is bij een volgende aanmelding.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.8
    text: |-
      Onze Minister kan, indien daartoe aanleiding bestaat, bevestiging vragen of nog aan de voorwaarden voor aanmelding
      wordt voldaan. Degene die de aanmelding heeft gedaan legt alsdan een schriftelijke verklaring ter zake over van
      hem en de aangemelde persoon gezamenlijk, alsmede een gewaarmerkt afschrift van de benodigde gegevens uit de
      gemeentelijke basisadministratie persoonsgegevens waaruit blijkt dat aan de voorwaarde, gesteld in het eerste
      lid, onder *a*, op het tijdstip van die verklaring wordt voldaan. Indien evenwel in de voorgaande periode
      het samenlevingscontract een wijziging heeft ondergaan die van belang kan zijn voor de aanmelding, wordt een
      afschrift van het gewijzigde contract overgelegd dan wel een uittreksel daaruit of een verklaring van een notaris
      dienaangaande, waaruit blijkt dat nog wordt voldaan aan de voorwaarde, bedoeld in het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.9
    text: |-
      Indien de bevestiging niet binnen zes weken wordt gedaan herhaalt Onze Minister zijn in het achtste lid bedoelde
      vraag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.10
    text: |-
      Indien de bevestiging niet binnen drie weken na de herhaalde vraag wordt gegeven, kan Onze Minister de aanmelding
      op een door hem vast te stellen datum doorhalen. De bedoelde datum is niet gelegen voor de datum waarop de in het
      achtste lid bedoelde bevestiging is gevraagd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
  - number: 2a.11
    text: |-
      Voor de toepassing van dit artikel ten aanzien van de Rijksvertegenwoordiger, kan voor «gemeentelijke
      basisadministratie persoonsgegevens» telkens worden gelezen: basisadministratie, als bedoeld in
      [artikel 2 van de Wet basisadministratie persoonsgegevens BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '2'
  - number: 2b.1
    text: |-
      [Artikel 2a][ref1] is van overeenkomstige toepassing op de politieke ambtsdrager, bedoeld in
      [artikel 2, tweede lid, onder d][ref2] met uitzondering van de Rijksvertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2b.2
    text: |-
      Voor de toepassing, bedoeld in het eerste lid, treden gedeputeerde staten, het college van burgemeester en
      wethouders onderscheidenlijk het dagelijks bestuur van het waterschap in de plaats van Onze Minister, uitgezonderd
      ten aanzien van diens bevoegdheid, gegeven in [artikel 2a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '3'
    text: |-
      De bepalingen van deze wet voor het nabestaandenpensioen zijn van overeenkomstige toepassing op het bijzonder
      nabestaandenpensioen, tenzij uit de desbetreffende bepalingen het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel3
  - number: '4'
    text: |-
      De bepalingen van deze wet voor het nabestaanden- en wezenpensioen zijn van overeenkomstige toepassing op het
      tijdelijk pensioen, tenzij uit de desbetreffende bepalingen het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel4
  - number: 4a
    text: |-
      Op een bij deze wet vastgestelde pensioenregeling zijn de [artikelen 47][ref1], [53][ref2], [55, vierde lid][ref3],
      en [97 van de Pensioenwet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel97
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '97'
  - number: '5.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder minister mede verstaan: staatssecretaris.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel5
  - number: '5.2'
    text: 'Voor de toepassing van het bij of krachtens deze afdeling bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel5
  - number: 5.2.a
    text: '*gewezen minister:* hij die uit hoofde van een ontslag uitzicht heeft op pensioen krachtens deze afdeling;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel5
  - number: 5.2.b
    text: '*gepensioneerd minister:* hij die uit hoofde van een ontslag recht heeft op pensioen krachtens deze afdeling.'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel5
  - number: '6.1'
    text: |-
      Aan een minister aan wie door Ons ontslag wordt verleend wordt met ingang van de dag van zijn ontslag, indien hij
      nog niet de leeftijd van 65 jaar heeft bereikt, een uitkering toegekend op de voet van de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
  - number: '6.2'
    text: 'Het eerste lid vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
  - number: 6.2.a
    text: indien de belanghebbende daarom verzoekt, of indien hij zonder onderbreking weer als minister optreedt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
  - number: 6.2.b
    text: indien aan de belanghebbende rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
  - number: '6.3'
    text: 'Wij, de Raad van State gehoord, kunnen bepalen dat geen uitkering wordt toegekend, indien de belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
  - number: 6.3.a
    text: |-
      zich in vreemde krijgsdienst of in vreemde overheidsdienst heeft begeven en naar Ons oordeel zich daardoor uit
      Nederlands nationaal oogpunt beschouwd onwaardig heeft gedragen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
  - number: 6.3.b
    text: |-
      wegens enig strafbaar feit is veroordeeld waaruit naar Ons oordeel blijkt dat hij zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
  - number: '6.4'
    text: |-
      Tenzij de omstandigheid bedoeld in het tweede lid, onder b, te rekenen vanaf de dag van ingang van het ontslag
      even lang als of langer heeft geduurd dan de duur van de uitkering berekend volgens [artikel 7][ref1], wordt de
      uitkering alsnog toegekend met ingang van de dag dat die omstandigheid zich niet meer voordoet, voor de resterende
      duur.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '7.1'
    text: |-
      De uitkering wordt toegekend voor een duur gelijk aan de tijd waarin de belanghebbende minister is geweest, maar
      ten minste voor de duur van twee jaren en ten hoogste voor de duur van drie jaren en twee maanden. Indien de
      belanghebbende met een of meer onderbrekingen minister is geweest, wordt in aanmerking genomen de tijd gedurende
      welke hij minister is geweest in een tijdvak, laatstelijk voor zijn ontslag, waarin zijn ministerschap voor ten
      hoogste een zesde deel van dat tijdvak is onderbroken.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid wordt de uitkering toegekend voor de duur van zes maanden, indien de belanghebbende
      korter dan drie maanden minister is geweest.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de belanghebbende ten tijde van zijn aftreden de leeftijd van 55 jaar heeft bereikt en hij in het tijdvak
      van twaalf jaren dat direct aan zijn ontslag voorafgaat ten minste tien jaren minister is geweest, wordt de
      uitkering voortgezet tot het tijdstip waarop hij de leeftijd van 65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7
  - number: '7.4'
    text: |-
      Voor de berekening van de uitkeringsduur, bedoeld in het eerste lid, en de tien jaren, bedoeld in het derde lid,
      wordt met tijd waarin de belanghebbende minister is geweest gelijkgesteld de tijd waarin hij een functie heeft
      bekleed als genoemd in [artikel 2, tweede lid, onder b en d][ref1]. Indien sprake is van gelijkgestelde tijd als
      bedoeld in de vorige zin wordt met betrekking tot die tijd op dezelfde wijze als in de tweede zin van het eerste
      lid rekening gehouden met onderbreking in de uitoefening van deze functies.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '7.5'
    text: |-
      In geval van tussentijds vervallen van de uitkering krachtens [artikel 11, tweede lid, onder b][ref1], wordt
      de volgende uitkering toegekend ten minste tot het tijdstip waarop eerstgenoemde uitkering, indien zij niet was
      vervallen, zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel11
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '11'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '7.6'
    text: |-
      In bijzondere gevallen kunnen Wij, de Raad van State gehoord, bepalen, dat de uitkering wordt voortgezet voor een,
      met inachtneming van [artikel 11][ref1] vast te stellen termijn, die op dezelfde wijze kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel11
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '11'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.1
    text: |-
      De belanghebbende die recht heeft op een uitkering als bedoeld in [artikel 6][ref1], is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.1.a
    text: in voldoende mate te trachten passende arbeid te vinden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.1.b
    text: aangeboden passende arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.1.c
    text: mee te werken aan activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.2
    text: 'De belanghebbende voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.2.a
    text: door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.2.b
    text: door eigen toedoen passende arbeid opgeeft;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.2.c
    text: eisen stelt die het aanvaarden of verkrijgen van passende arbeid belemmeren.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.3
    text: |-
      Onder passende arbeid wordt verstaan alle arbeid die voor de krachten en de bekwaamheden van de belanghebbende
      is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden
      gevergd. Of arbeid passend is wordt in ieder geval bepaald door:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.3.a
    text: |-
      de aard van de arbeid, in relatie tot de eerder verrichte arbeid, een eerder uitgeoefend beroep of opgedane
      werkervaring;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.3.b
    text: het opleidingsniveau van de belanghebbende;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.3.c
    text: de reistijd naar en van het werk;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.3.d
    text: het geboden loon;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.3.e
    text: het werkloosheidsrisico.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.4
    text: |-
      Onze Minister is verantwoordelijk voor het in overleg met de belanghebbende opstellen van een plan voor het gericht
      zoeken naar en verwerven van passende arbeid, waarin de activiteiten zijn opgenomen die noodzakelijk zijn om te
      voldoen aan de verplichting, bedoeld in het eerste lid, onderdeel a. Bij algemene maatregel van bestuur worden
      nadere regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.4.a
    text: de onderdelen van het plan;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.4.b
    text: een tegemoetkoming voor de in het plan opgenomen activiteiten anders dan begeleiding;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.4.c
    text: de eisen die worden gesteld aan de organisatie die het plan opstelt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.5
    text: 'Dit artikel is niet van toepassing op de belanghebbende die:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7a.5.a
    text: |-
      een ambt heeft aanvaard als bedoeld in [artikel 2, tweede lid][ref1], en daaruit inkomsten geniet ten bedrage van
      70% of meer van de wedde, bedoeld in [artikel 8][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.5.b
    text: |-
      recht heeft op een voortgezette uitkering ingevolge [artikel 8a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.6
    text: Dit artikel is niet van toepassing gedurende de eerste drie maanden na het aftreden van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7a
  - number: 7b.1
    text: |-
      Onze Minister kan de belanghebbende, bedoeld in [artikel 7a][ref1], verplichten zich bij het gericht zoeken naar en
      verwerven van passende arbeid planmatig te laten begeleiden en ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7b.2
    text: |-
      Onze Minister verstrekt de belanghebbende een tegemoetkoming in de kosten van planmatige begeleiding en
      ondersteuning bij het gericht zoeken naar en verwerven van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7b
  - number: 7b.3
    text: |-
      De tegemoetkoming bedraagt ten hoogste 20% van de laatstelijk als minister per jaar genoten wedde, bedoeld in
      [artikel 8, tweede lid][ref1]. De verplichte planmatige begeleiding en ondersteuning, bedoeld in het eerste lid,
      wordt volledig vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7b.4
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7b
  - number: 7b.4.a
    text: de aanvraag voor tegemoetkoming in de kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7b
  - number: 7b.4.b
    text: de voor vergoeding in aanmerking komende kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7b
  - number: 7b.4.c
    text: de eisen die worden gesteld aan de organisatie die de planmatige ondersteuning uitvoert.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7b
  - number: 7c.1
    text: |-
      Indien de belanghebbende een bij of krachtens [artikel 7a][ref1] of [7b][ref2] geregelde verplichting niet of
      niet behoorlijk is nagekomen, besluit Onze Minister tot gehele of gedeeltelijke inhouding van de uitkering. Onze
      Minister is bevoegd tot verrekening van de inhouding van de uitkering met betalingen aan belanghebbende op grond
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 7b
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7c.2
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel7c
  - number: '8.1'
    text: |-
      De uitkering bedraagt gedurende het eerste jaar 80% en vervolgens 70% van de laatstelijk als minister genoten
      wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8
  - number: '8.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder laatstelijk genoten wedde verstaan de wedde, de vakantie-uitkering
      en de eindejaarsuitkering waarop de belanghebbende aanspraak had op de dag voorafgaande aan de dag waarop hij als
      minister is ontslagen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8
  - number: '8.3'
    text: |-
      Indien Wij in de bezoldiging van het Rijkspersoneel een wijziging aanbrengen wordt de in het eerste lid
      bedoelde laatstelijk genoten wedde voor de toepassing van dat lid met ingang van het tijdstip van ingang van de
      bezoldigingswijziging door Onze Minister overeenkomstig de wijziging aangepast.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8
  - number: 8a.1
    text: |-
      Indien de belanghebbende op de dag waarop de duur van de uitkering eindigt geheel of gedeeltelijk algemeen invalide
      is, wordt, met inachtneming van [artikel 11][ref1], de uitkering voor de duur van de invaliditeit voortgezet op de
      voet van [artikel 8b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '11'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8b
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8a.2
    text: |-
      Algemeen invalide, geheel of gedeeltelijk, in de zin van deze wet is hij die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekten of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen. Onder de eerstgenoemde
      arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden
      in staat is. Onder deze arbeid wordt niet begrepen arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: 8a.3
    text: |-
      Bij de vaststelling van de mate van algemene invaliditeit wordt buiten beschouwing gelaten of de betrokkene de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8a
  - number: 8a.4
    text: |-
      Indien de betrokkene zonder redelijke grond weigert deel te nemen aan een voor hem gewenste opleiding of scholing
      of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, wordt er bij de vaststelling van de mate
      van algemene invaliditeit van uitgegaan dat die opleiding of scholing is afgerond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8a
  - number: 8a.5
    text: Bij een algemene invaliditeit van minder dan 25 percent wordt de uitkering niet voortgezet.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8a
  - number: 8b.1
    text: |-
      De voortzetting van de uitkering vindt plaats als aangegeven in het tweede en derde lid en vervolgens als
      aangegeven in het vierde en het vijfde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.2
    text: |-
      De uitkering bedraagt gedurende een periode als aangegeven in het derde lid 70% van de laatstelijk als minister
      genoten wedde, bedoeld in [artikel 8][ref1], bij een algemene invaliditeit van 80% of meer, 60% van deze wedde bij
      een algemene invaliditeit van 55% tot 80% en 40% van die wedde bij een algemene invaliditeit van 25% tot 55%.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8b.3
    text: |-
      De in het tweede lid bedoelde periode is ten hoogste voor de betrokkene die op het tijdstip van voortzetting van
      de uitkering:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.3.58
    text: 'jaar of ouder is: zes jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.3.53
    text: 'jaar of ouder is: drie jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.3.48
    text: 'jaar of ouder is: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.3.43
    text: 'jaar of ouder is: anderhalf jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.3.38
    text: 'jaar of ouder is: een jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.3.33
    text: 'jaar of ouder is: een half jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.4
    text: |-
      De uitkering bedraagt na afloop van de volgens het derde lid bepaalde periode een percentage, volgens het tweede
      lid, van een bedrag gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen de laatstelijk
      als minister genoten wedde, bedoeld in [artikel 8][ref1], en het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8b.5
    text: |-
      Voor de berekening van het in het vierde lid bedoelde bedrag geldt een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de belanghebbende op het tijdstip van voortzetting van de uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.6
    text: |-
      Het minimumloon, bedoeld in het vierde lid, is het tot een jaarbedrag herleide minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1] of, indien het een betrokkene jonger dan 23 jaar betreft, het tot een
      jaarbedrag herleide voor zijn leeftijd geldende minimumloon per maand, bedoeld in [artikel 7, derde lid][ref2],
      en [artikel 8, derde lid, van de genoemde wet][ref3], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 8b.7
    text: |-
      De belanghebbende heeft recht op een aanvulling van de uitkering, indien die uitkering minder bedraagt dan het
      volgens het tweede lid vastgestelde percentage van de laatstelijk als minister genoten wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.8
    text: |-
      De aanvulling is gelijk aan het bedrag dat nodig is om de uitkering te verhogen tot het in het zevende lid bedoelde
      percentage van de laatstelijk als minister genoten wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.9
    text: |-
      In afwijking van het achtste lid is de aanvulling gelijk aan het bedrag dat nodig is om de uitkering
      te verhogen tot het in het tiende lid aangegeven percentage van de laatstelijk als minister genoten
      wedde, indien de belanghebbende de keuze heeft gemaakt voor een verlaging van de inhouding ingevolge
      [artikel 106, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 8b.10
    text: |-
      Het in het negende lid bedoelde percentage bedraagt bij een algemene invaliditeit van 80% of meer 65%, bij een
      algemene invaliditeit van 55% tot 80%: 56% en bij een algemene invaliditeit van 25% tot 55%: 37%.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
  - number: 8b.11
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 106, eerste lid][ref1], worden regels gesteld met
      betrekking tot de verlaging, bedoeld in het negende lid. Onze Minister stelt regels met betrekking tot de wijze
      en het tijdstip waarop de minister of de gewezen minister de in het negende lid bedoelde keuze, die eenmalig is,
      kenbaar dient te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 8b.12
    text: |-
      Indien de wegens algemene invaliditeit voortgezette uitkering te zamen met inkomsten, bedoeld in [artikel 9][ref1],
      minder bedraagt dan het minimumloon wordt de uitkering verhoogd tot het minimumloon. De verhoging bedraagt niet
      meer dan het verschil tussen de uitkering en het bedrag waarvan deze is afgeleid en tevens niet meer dan 30% van
      het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8c.1
    text: |-
      De voortzetting van de uitkering, bedoeld in [artikel 8a][ref1], geschiedt op aanvraag van de belanghebbende en
      voor termijnen van niet langer dan drie jaar, onverminderd het in deze wet bepaalde over herziening of intrekking
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8c.2
    text: |-
      Onze Minister stelt de belanghebbende uiterlijk vier maanden voor het verstrijken van de in het eerste lid bedoelde
      termijn schriftelijk in kennis van de mogelijkheid tot het doen van een aanvraag tot voortzetting van de uitkering
      na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8c
  - number: 8c.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt door de belanghebbende uiterlijk drie maanden voor het
      verstrijken van de in het eerste lid bedoelde termijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8c
  - number: 8c.4
    text: |-
      Indien Onze Minister niet tijdig beslist op een tijdig ingediende aanvraag als bedoeld in het derde lid, wordt de
      uitkering voortgezet tot het tijdstip van de beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8c
  - number: 8c.5
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt geacht tijdig te zijn ingediend indien Onze Minister de
      kennisgeving, bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving als bedoeld
      in het tweede lid de aanvraag wordt ingediend binnen een maand nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8c
  - number: 8c.6
    text: |-
      Indien de uitkering na afloop van de in het eerste lid bedoelde termijn wordt voortgezet, wordt de uitkering
      berekend op de wijze die van toepassing zou zijn geweest indien die termijn niet zou zijn afgelopen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8c
  - number: 8c.7
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat in bepaalde situaties geen
      termijn geldt dan wel een termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn van drie jaar.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8c
  - number: 8d.1
    text: |-
      Binnen een jaar na het tijdstip waarop de uitkering voor de eerste maal met toepassing van [artikel 8a][ref1]
      is voortgezet, doet Onze Minister een onderzoek instellen ten einde te doen bezien of er als gevolg van gronden
      die invloed hebben op de mate van algemene invaliditeit redenen aanwezig zijn voor herziening of intrekking van
      de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8d.2
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat geen termijn geldt dan wel een
      termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
  - number: 8d.3
    text: |-
      Onze Minister wijzigt ambtshalve of op aanvraag van de belanghebbende het bedrag van de uitkering bij wijziging van
      de mate van algemene invaliditeit.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
  - number: 8d.4
    text: 'Een wijziging van het bedrag van de uitkering gaat in:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
  - number: 8d.4.a
    text: |-
      indien daartoe een aanvraag is ingediend, met ingang van de eerste dag van de maand volgende op die waarin de
      aanvraag is ingekomen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
  - number: 8d.4.b
    text: |-
      indien de wijziging ambtshalve plaatsvindt, met ingang van de eerste dag van de maand volgende op die waarin de
      beslissing tot wijziging is genomen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
  - number: 8d.5
    text: |-
      De toepassing van [artikel 8a][ref1] wordt ten aanzien van een belanghebbende gestaakt indien en zolang hij niet
      voldoet aan een uitnodiging van Onze Minister zich te onderwerpen aan een onderzoek door een of meer door hem
      aangewezen geneeskundigen ter beantwoording van de vraag, of er nog sprake is van algemene invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8d.6
    text: |-
      Indien degene die recht heeft op wegens algemene invaliditeit voortgezette uitkering inkomsten uit of in
      verband met arbeid geniet, is Onze Minister bevoegd, zolang niet vaststaat of deze arbeid als arbeid, bedoeld in
      [artikel 8a, tweede lid][ref1], kan worden aangemerkt, niet tot herziening of intrekking van de uitkering over te
      gaan. De toepassing van de eerste volzin vindt ten hoogste plaats over een aaneengesloten periode van drie jaren,
      aanvangende op de eerste dag waarover de inkomsten uit of in verband met arbeid als bedoeld in de eerste volzin
      worden genoten. Deze periode wordt geacht niet te zijn onderbroken indien korter dan een maand geen inkomsten
      uit of in verband met arbeid worden genoten. Na afloop van de in de tweede volzin genoemde periode wordt de in de
      eerste volzin bedoelde arbeid aangemerkt als arbeid, bedoeld in [artikel 8a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8e.1
    text: |-
      Op verzoek van een minister doet Onze Minister een onderzoek instellen door een of meer door hem aangewezen
      geneeskundigen, ter beantwoording van de vraag of de minister die het verzoek deed algemene invalide is als bedoeld
      in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8e.2
    text: |-
      Onze Minister brengt de uitkomst van een onderzoek dat is ingesteld ingevolge het eerste lid ter kennis van de
      verzoeker.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel8e
  - number: '9.1'
    text: |-
      De inkomsten die de belanghebbende geniet, worden bepaald overeenkomstig de regels van de
      [Wet inkomstenbelasting 2001][ref1] en worden met de uitkering verrekend over de maand waarop deze inkomsten
      betrekking hebben of geacht kunnen worden betrekking te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '9.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder inkomsten verstaan het gezamenlijk bedrag dat de belanghebbende
      wegens het verrichten van activiteiten geniet als
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
  - number: 9.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9.2.b
    text: belastbaar loon uit of in verband met arbeid en
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
  - number: 9.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag
      waarmede de uitkering, vermeerderd met die inkomsten, de laatstelijk genoten wedde, waarvan de uitkering
      is afgeleid, overschrijdt. Bij de verrekening wordt voor de hoogte van de uitkering de op grond van
      [artikel 7c, eerste lid][ref1], opgelegde inhouding buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7c
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '9.4'
    text: |-
      Indien in het bedrag der inkomsten bedoeld in de vorige leden, is of geacht kan worden te zijn begrepen een
      vergoeding ter zake van de premie [Algemene Ouderdomswet][ref1] en [Algemene nabestaandenwet][ref2], blijft deze
      vergoeding voor de toepassing van dit artikel buiten beschouwing. De vorige volzin is slechts van toepassing voor
      zover de daar bedoelde inkomsten betrekking hebben op een tijdvak gelegen voor 1 juni 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '9.5'
    text: Kinderbijslag wordt niet aangemerkt als inkomst.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
  - number: '9.6'
    text: |-
      Voor de toepassing van dit artikel ten aanzien van de voortgezette uitkering bedoeld in
      [artikel 7, zesde lid][ref1], en [artikel 8a][ref2], kan Onze Minister andere inkomsten aanmerken als te zijn
      genoten wegens activiteiten bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 9a.1
    text: |-
      De belanghebbende is verplicht van het ter hand nemen van enige activiteiten als bedoeld in
      [artikel 9, tweede lid][ref1], terstond mededeling te doen aan Onze Minister onder opgave, voor zover mogelijk,
      van de inkomsten, die hij uit die activiteiten zal trekken. Zijn de inkomsten niet vooraf op te geven, dan doet
      hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave van de inkomsten, die hij sinds het ter hand
      nemen van de activiteiten of sinds de vorige opgave heeft genoten. Onze Minister geeft nadere voorschriften
      aangaande het doen van mededelingen door de belanghebbende met betrekking tot de activiteiten bedoeld in
      [artikel 9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 9a.2
    text: |-
      Brengt de aard van de activiteiten of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast
      van een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het eind van de evenbedoelde termijn. Ten
      aanzien van deze verrekening is [artikel 9][ref1] van toepassing, met dien verstande, dat zij geschiedt over de in
      de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 9a.3
    text: |-
      Onze Minister kan bij de vaststelling van het bedrag van de vermindering van de opgave van de belanghebbende
      afwijken.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9a
  - number: 9a.4
    text: |-
      De belanghebbende aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin
      toe te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit hoofdstuk noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel9a
  - number: '10.1'
    text: De uitkering, berekend over een maand, wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel10
  - number: '10.2'
    text: |-
      De uitkering wordt niet uitbetaald zolang de belanghebbende niet of niet op de voorgeschreven wijze voldoet aan
      zijn verplichtingen op grond van [artikel 9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 9a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '11.1'
    text: De uitkering eindigt met ingang van de dag volgende op die, waarop de gewezen minister is overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
  - number: '11.2'
    text: 'De uitkering vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
  - number: 11.2.a
    text: met ingang van de dag waarop de gewezen minister de leeftijd van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
  - number: 11.2.b
    text: met ingang van de dag waarop de gewezen minister wederom minister wordt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
  - number: 11.2.c
    text: |-
      wanneer tijdens de duur van de uitkering zich de omstandigheid voordoet, bedoeld in
      [artikel 6, tweede lid, onder b][ref1]. Zodra die omstandigheid zich niet langer voordoet is het daar bepaalde van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '11.3'
    text: |-
      De uitkering kan geheel of ten dele vervallen worden verklaard indien de belanghebbende herhaaldelijk niet of niet
      op de voorgeschreven wijze voldoet aan zijn verplichtingen op grond van [artikel 9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 9a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '11.4'
    text: 'Voorts kunnen Wij, de Raad van State gehoord, de uitkering vervallen verklaren, indien de gewezen minister:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
  - number: 11.4.a
    text: |-
      zich in vreemde krijgsdienst of in vreemde overheidsdienst heeft begeven en naar Ons oordeel zich daardoor uit
      Nederlands nationaal oogpunt beschouwd onwaardig heeft gedragen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
  - number: 11.4.b
    text: |-
      wegens enig strafbaar feit is veroordeeld waaruit naar Ons oordeel blijkt dat hij zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel11
  - number: '12.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de gewezen minister wordt aan de weduwe of weduwnaar, van die de
      overledene niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de uitkering over een tijdvak van drie
      maanden vermeerderd met de kinderbijslag voor het eerste en tweede kind waarop de gewezen minister ingevolge de
      [Algemene Kinderbijslagwet][ref1] op de dag van het overlijden recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '12.2'
    text: |-
      Laat de overledene geen weduwe of weduwnaar na, van wie hij, onderscheidenlijk zij, niet duurzaam gescheiden
      leefde, dan geschiedt de uitkering van het in het eerste lid bedoelde bedrag, ten behoeve van de minderjarige
      kinderen die in familierechtelijke betrekking stonden tot de overledene, of minderjarige kinderen waarover de
      overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud
      en de opvoeding van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het
      genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen, dan geschiedt de uitkering van het in het
      eerste lid bedoelde bedrag, indien de overledene kostwinner was van ouders, meerderjarige kinderen, broeders of
      zusters, ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel12
  - number: '12.3'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het eerste en tweede lid na, dan kan het aldaar bedoelde
      bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel12
  - number: '13.1'
    text: |-
      Een minister heeft na zijn ontslag recht op pensioen, indien hij op de dag van ingang van het ontslag de leeftijd
      van 65 jaar heeft bereikt, tenzij hij op dat tijdstip wederom als minister optreedt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13
  - number: '13.2'
    text: |-
      Een minister wie ontslag is verleend vóór het bereiken van de leeftijd van 65 jaar, verkrijgt recht op pensioen bij
      het bereiken van die leeftijd, tenzij hij op dat tijdstip wederom het ambt van minister vervult.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13
  - number: 13a.1
    text: |-
      Het pensioen bedraagt voor ieder dienstjaar als minister 2 percent van de daarvoor geldende pensioengrondslag,
      volgens een of meer van de [artikelen 14][ref1], [14a][ref2] en [14aa][ref3]. Voor de toepassing van die artikelen
      wordt verstaan onder wedde: de laatstelijk genoten wedde, bedoeld in [artikel 8, tweede lid][ref4], aangepast
      volgens de regels, bedoeld in [artikel 105, derde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel14aa
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '14'
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 14a
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 14aa
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref5
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 13a.2
    text: |-
      In afwijking van het eerste lid behoort niet tot de wedde de verhoging van de wedde per 1 januari 2001 ingevolge
      dan wel op de voet van [artikel 3 van de Wet brutering overhevelingstoeslag lonen 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006353
        artikel: '3'
  - number: 13a.3
    text: |-
      Als diensttijd telt mee de tijd met recht op uitkering. Het pensioen over die tijd wordt berekend naar 2 percent
      per jaar over de eerste vier jaren van het recht op uitkering dan wel over de volledige tijd met recht op uitkering
      indien die tijd minder is dan vier jaren en vervolgens naar 1 percent per jaar. In het geval van een uitkering als
      bedoeld in [artikel 8a][ref1], wordt het pensioen over de tijd met recht op uitkering berekend naar 2 percent per
      jaar voor zover en voor zolang het percentage van de algemene invaliditeit 55 percent of meer bedraagt. Voor de
      toepassing van de vorige volzin wordt een uitkering als bedoeld in [artikel 7][ref2] aangemerkt als een uitkering
      als bedoeld in [artikel 8a][ref3], indien en zolang de belanghebbende tijdens de duur van de eerstbedoelde
      uitkering voor 55 percent of meer algemeen invalide is.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13a.4
    text: |-
      In afwijking van het derde lid wordt het pensioen over de in dat lid bedoelde tijd berekend naar de helft van het
      ingevolge dat lid toepasselijke percentage, over het gedeelte van die tijd waarin de uitkering is verminderd wegens
      het genieten van inkomsten als bedoeld in [artikel 9][ref1]. Geen meetelling van diensttijd als bedoeld in het
      derde lid vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13a.4.a
    text: |-
      voor zover gedurende de in dat lid bedoelde tijd de uitkering wegens het genieten van inkomsten als bedoeld in
      [artikel 9][ref1] tot nihil is verminderd;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13a.4.b
    text: |-
      in zover de belanghebbende die recht heeft op uitkering, maar die minder uitkering geniet dan de krachtens
      [artikel 106][ref1] berekende inhoudingen ter zake van ouderdom en overlijden, er geen zorg voor draagt dat het
      bedrag van deze inhoudingen, welk bedrag in dit geval als een op hem rustende schuld wordt beschouwd, bij het
      bereiken van de 65-jarige leeftijd is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 13a.4.c
    text: indien de belanghebbende daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
  - number: 13a.5
    text: |-
      Indien voor de pensioenberekening in aanmerking te nemen tijd als minister en als staatssecretaris voor het
      pensioen meetellen, wordt over elk van die tijden een afzonderlijk pensioen berekend. De som van die pensioenen
      wordt als een eenheid toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
  - number: 13a.6
    text: |-
      De minister en de gewezen minister hebben bij ingang van het pensioen eenmalig de keuzemogelijkheid het pensioen
      met 12 percent te verhogen, voorzover het is berekend over diensttijd die is gelegen na 30 juni 1999 en die
      overeenkomt met de tijd die krachtens [artikel 22][ref1] voor de berekening van het nabestaandenpensioen in
      aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 13a.7
    text: |-
      Met de verhoging van het pensioen, bedoeld in het zesde lid, vervalt de aanspraak op nabestaandenpensioen,
      voorzover opgebouwd na 30 juni 1999.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
  - number: 13a.8
    text: |-
      De keuze, bedoeld in het zesde lid, kan slechts worden gedaan met toestemming van de echtgenoot of de aangemelde
      partner. Onze Minister kan nadere regels stellen met betrekking tot het doen van de keuze.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
  - number: 13a.9
    text: |-
      De verhoging van het pensioen gaat in met ingang van de dag waarop het recht op pensioen ontstaat en is
      onherroepelijk.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13a
  - number: 13b.1
    text: |-
      De gewezen minister kan na afloop van de uitkeringsduur, bedoeld in [artikel 7, eerste of tweede lid][ref1], de
      vanaf 1 augustus 2003 opgebouwde aanspraken op eigen pensioen omzetten in een aanspraak op nabestaandenpensioen bij
      overlijden voor het bereiken van de leeftijd van 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13b.2
    text: |-
      Voor de omzetting van het eigen pensioen, bedoeld in het eerste lid, stelt Onze Minister bij ministeriële regeling
      een leeftijdsafhankelijke ruilvoet vast.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13b
  - number: 13b.3
    text: |-
      Onze Minister informeert de gewezen minister binnen vier maanden voor de afloop van zijn uitkering over de
      mogelijkheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13b
  - number: 13b.4
    text: |-
      De gewezen minister dient zijn keuze binnen zes weken na ontvangst van deze mededeling schriftelijk aan Onze
      Minister mee te delen. Tot het moment van het eindigen van de termijn van zes weken, verkrijgt de gewezen minister
      een premievrije aanspraak op nabestaandenpensioen overeenkomstig de tijd tot het moment van aftreden van de
      minister.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13b
  - number: 13b.5
    text: |-
      Als omzetting als bedoeld in het eerste lid gevolgd wordt door een waardeoverdracht als bedoeld in
      [artikel 107][ref1], wordt de vermindering van het eigen pensioen aangepast. De aanspraak op nabestaandenpensioen
      als bedoeld in het eerste lid, wordt omgezet in een aanspraak op eigen pensioen met inachtneming van de ruilvoet,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel107
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '107'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 13b.6
    text: |-
      Als een gewezen minister op enig moment opnieuw minister wordt, wordt de vermindering van het eigen pensioen,
      bedoeld in het eerste lid, aangepast. De aanspraak op nabestaandenpensioen als bedoeld in het eerste lid, wordt
      omgezet in een aanspraak op eigen pensioen met inachtneming van de ruilvoet, bedoeld in het tweede lid, behorende
      bij de leeftijd van de minister op het moment dat hij opnieuw het ambt van minister vervult.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13b
  - number: 13b.7
    text: |-
      Het vijfde en zesde lid zijn niet van toepassing bij het einde van het huwelijk na aftreden van de minister en voor
      waardeoverdracht of voor het opnieuw vervullen van het ministerschap.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel13b
  - number: '14.1'
    text: Voor tijd vóór 1 januari 1986 is de pensioengrondslag de wedde.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14
  - number: '14.2'
    text: |-
      De wedde wordt voor de toepassing van het eerste lid vermenigvuldigd met 100/110 indien deze laatstelijk is genoten
      tussen 31 december 1985 en 1 januari 1995. De aldus vastgestelde pensioengrondslag is echter niet lager dan de
      wedde verminderd met € 2 867,89 . Het bedrag van € 2 867,89  wordt telkens gewijzigd bij de ministeriële regeling,
      bedoeld in [artikel 105, derde lid][ref1], overeenkomstig de aanpassing van een bedrag dat, omgerekend naar euro’s,
      op 1 januari 1985 € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '14.3'
    text: |-
      De wedde wordt voor de toepassing van het eerste lid vermenigvuldigd met een debruteringsfactor overeenkomstig
      [artikel 14a, tweede lid][ref1], indien deze laatstelijk is genoten na 31 december 1994. Op het aldus gevonden
      bedrag is het tweede lid van dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 14a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '14.4'
    text: |-
      [Hoofdstuk 17][ref1] is van toepassing op het pensioen, indien of voorzover berekend over de in het eerste lid
      bedoelde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 14a.1
    text: |-
      Voor tijd tussen 31 december 1985 en 1 januari 1995 is de pensioengrondslag de wedde verminderd met een bedrag,
      genaamd franchise.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14a
  - number: 14a.2
    text: |-
      De wedde wordt voor de toepassing van het eerste lid vermenigvuldigd met een debruteringsfactor
      indien deze laatstelijk is genoten na 31 december 1994. Deze factor is de breuk,
      waarvan de teller honderd bedraagt en de noemer de som is van honderd en het percentage
      waarmee het inkomen als minister per 1 januari 1995 uitsluitend ter uitvoering van
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________________________________ (Stb. 418) is
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006684#ArtikelII
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0006684
        artikel: II
  - number: 14a.3
    text: 'De in het eerste lid bedoelde franchise is:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14a
  - number: 14a.3.a
    text: |-
      voor de gepensioneerde minister die voor de toepassing van de [Algemene Ouderdomswet][ref1] als gehuwd wordt
      aangemerkt twintig zevende maal het tot een jaarbedrag herleide bedrag dat geldt voor een gehuwde per 1 januari van
      het jaar waarin het recht op pensioen ontstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 14a.3.b
    text: |-
      voor de gepensioneerde minister die voor de toepassing van de [Algemene Ouderdomswet][ref1] als ongehuwd wordt
      aangemerkt tien zevende maal het tot een jaarbedrag herleide bedrag dat geldt voor een ongehuwde per 1 januari van
      het jaar waarin het recht op pensioen ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 14a.4
    text: |-
      In de in het derde lid bedoelde bedragen is mede begrepen de bruto vakantie-uitkering waarop ingevolge de
      [Algemene Ouderdomswet][ref1] recht bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 14a.5
    text: |-
      Wanneer de in het derde lid bedoelde bedragen op grond van persoonlijke omstandigheden worden gewijzigd, wordt de
      pensioengrondslag herberekend. Het herberekende pensioen gaat, onverminderd [artikel 14c, tweede lid][ref1], in op
      dezelfde dag als waarop de bedoelde wijzigingen zich hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14c
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 14c
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 14aa
    text: |-
      [Artikel 14a, eerste lid][ref1], is van toepassing op tijd na 31 december 1994, met dien verstande dat de franchise
      bij of krachtens algemene maatregel van bestuur wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14aa
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 14a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 14b.1
    text: |-
      De gepensioneerde minister heeft recht op een toeslag op zijn pensioen indien dat pensioen is berekend met
      toepassing van de franchise bedoeld in [artikel 14a, derde lid, onderdeel a][ref1], en indien de kalendertijd,
      waarin de voor de berekening van zijn pensioen meetellende diensttijd is gelegen, geheel of gedeeltelijk samenvalt
      met kalendertijd, die in aanmerking is genomen bij de berekening van enig pensioen waarop zijn echtgenoot recht
      heeft, mits op laatstbedoeld pensioen een vermindering is toegepast uit hoofde van recht op ouderdomspensioen
      ingevolge de [Algemene Ouderdomswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 14a
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002221
  - number: 14b.2
    text: |-
      Voor de toepassing van dit artikel wordt mede als echtgenoot aangemerkt degene die voor de toepassing van de
      [Algemene Ouderdomswet][ref1] als echtgenoot van de gepensioneerde minister wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 14b.3
    text: |-
      De in het eerste lid bedoelde toeslag bedraagt voor elk voor de berekening van het pensioen meetellend jaar binnen
      de samenlopende kalendertijd 0,525 percent van de franchise bedoeld in [artikel 14a, derde lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 14a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 14b.4
    text: |-
      De toeslag wordt slechts toegekend op verzoek en gaat in op de dag waarop de in het eerste lid bedoelde
      omstandigheid is opgetreden, met dien verstande dat de toeslag niet vroeger ingaat dan een jaar voor de eerste dag
      van de maand waarin het verzoek is ingediend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14b
  - number: 14b.5
    text: |-
      Voor de toepassing van [hoofdstuk 5][ref1] wordt de toeslag ingevolge dit artikel niet onder pensioen begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '5'
        afdeling: Tweede
  - number: 14c.1
    text: |-
      Indien in het bedrag van het ouderdomspensioen, waaronder medebegrepen een eventuele toeslag en de vakantie-
      uitkering, ingevolge de [Algemene Ouderdomswet][ref1] een wijziging wordt aangebracht op grond van persoonlijke
      omstandigheden, is degene aan wie een pensioen krachtens dit hoofdstuk is toegekend over diensttijd vóór 1 januari
      1995, gehouden daarvan onverwijld kennis te geven aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 14c.2
    text: |-
      Indien de in het eerste lid bedoelde wijziging leidt tot verhoging van het pensioen krachtens dit hoofdstuk, gaat
      die verhoging niet vroeger in dan een jaar voor de eerste dag van de maand waarin de daarbedoelde kennisgeving werd
      gedaan of waarin die verhoging ambtshalve plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14c
  - number: 14c.3
    text: In bijzondere gevallen kan Onze Minister het tweede lid buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel14c
  - number: '15.1'
    text: De nabestaande van een minister, gewezen minister of gepensioneerd minister heeft recht op pensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel15
  - number: '15.2'
    text: 'In afwijking van het eerste lid bestaat geen recht op nabestaandenpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel15
  - number: 15.2.a
    text: indien het huwelijk is gesloten nadat de gepensioneerde minister de leeftijd van 65 jaar had bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel15
  - number: 15.2.b
    text: |-
      bij overlijden van een gewezen minister vóór het bereiken van de leeftijd van 65 jaar, voorzover de pensioengeldige
      tijd van de overledene is gelegen na 31 juli 2003;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel15
  - number: 15.2.c
    text: |-
      bij overlijden van een gepensioneerd minister, voorzover de pensioengeldige tijd van de overledene is gelegen na 30
      juni 1999 en de keuze is gedaan, bedoeld in [artikel 13a, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '15.3'
    text: |-
      Voor de toepassing van het tweede lid geldt niet als gewezen minister de gewezen minister met recht op uitkering
      als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '17.1'
    text: |-
      Recht op bijzonder nabestaandenpensioen heeft de vrouw of man met wie een overleden minister, gewezen minister of
      gepensioneerd minister gehuwd is geweest, mits:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: 17.1.a
    text: |-
      hij of zij recht op nabestaandenpensioen zou hebben gehad, indien de minister, gewezen minister of gepensioneerd
      minister op de dag van het vonnis, waarbij de echtscheiding of de ontbinding van het huwelijk is uitgesproken, zou
      zijn overleden, en
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: 17.1.b
    text: |-
      de onder *a* bedoelde dag ligt na het tijdstip van de inwerkingtreding van de Wet herziening echtscheidingsrecht en
      de echtscheiding of ontbinding van het huwelijk niet is uitgesproken met toepassing van het voor genoemd tijdstip
      geldende recht.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: '17.2'
    text: |-
      Eveneens heeft recht op bijzonder nabestaandenpensioen de vrouw of man van wie de aanmelding is geëindigd, mits
      zij of hij recht op nabestaandenpensioen zou hebben gehad, indien de minister, de gewezen minister of gepensioneerd
      minister op de dag van eindigen van de aanmelding zou zijn overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: '17.3'
    text: 'In afwijking van het het eerste en het tweede lid bestaat geen recht op bijzonder nabestaandenpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: 17.3.a
    text: |-
      indien de minister, gewezen minister of gepensioneerd minister en de desbetreffende vrouw of man dat zijn
      overeengekomen bij huwelijkse voorwaarden, bij geschrift met het oog op het einde van het huwelijk of de
      aanmelding, en Onze Minister daarmee instemt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: 17.3.b
    text: |-
      indien de onder a bedoelde vrouw of man als gevolg van hertrouwen met of aanmelding door dezelfde minister wegens
      diens overlijden recht op nabestaandenpensioen heeft;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: 17.3.c
    text: |-
      bij overlijden van een minister of gewezen minister voor de leeftijd van 65 jaar, voorzover de pensioengeldige tijd
      van de overledene is gelegen na 31 juli 2003;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
  - number: 17.3.d
    text: |-
      bij overlijden van een gepensioneerd minister voorzover de pensioengeldige tijd van de overledene is gelegen na 30
      juni 1999 en de keuze is gedaan, bedoeld in [artikel 13a, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '18'
    text: |-
      Na het overlijden van een minister, gewezen minister of gepensioneerd minister hebben recht op wezenpensioen zijn
      kinderen die de leeftijd van eenentwintig jaren nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn
      dan wel niet partij zijn of partij geweest zijn bij een aanmelding, mits zij zijn geboren of geadopteerd voor zijn
      ontslag is ingegaan of in de periode waarin hij recht heeft op uitkering ter zake van het ontslag.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel18
  - number: '19'
    text: |-
      Kinderen ten opzichte van welke aan een mannelijke minister, gewezen of gepensioneerde minister ten tijde van
      zijn overlijden een onderhoudsplicht krachtens [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1] dan wel
      [artikel 394 van Boek 1 van het Burgerlijk Wetboek BES][ref2] was opgelegd, dan wel door hem bij authentieke akte
      een dergelijke verplichting was erkend, hebben onder dezelfde voorwaarden als genoemd in [artikel 18][ref3] recht
      op wezenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel394
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel18
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '394'
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '20.1'
    text: |-
      Kinderen voor welke de minister, gewezen minister of gepensioneerde minister ten tijde van zijn overlijden
      de pleegouderlijke zorg droeg, hebben onder dezelfde voorwaarden als genoemd in [artikel 18][ref1], recht op
      wezenpensioen met dien verstande dat in plaats van het tijdstip van geboorte of adoptie het tijdstip van aanvang
      van de pleegouderlijke zorg in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel18
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '20.2'
    text: |-
      Onder pleegouderlijke zorg bedoeld in het vorige lid wordt verstaan de zorg voor het onderhoud en de opvoeding
      van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een
      vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel20
  - number: '21.1'
    text: |-
      Indien een minister, gewezen minister of gepensioneerd minister naar het oordeel van Onze Minister is vermist,
      hebben degenen die aan zijn overlijden recht op pensioen zouden ontlenen, recht op tijdelijk pensioen op dezelfde
      voet als in de voorgaande artikelen van dit hoofdstuk is omschreven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel21
  - number: '21.2'
    text: |-
      Het tijdelijk pensioen gaat van rechtswege over in een voortdurend pensioen zodra het overlijden van de vermiste
      vaststaat.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel21
  - number: '22.1'
    text: |-
      Het nabestaandenpensioen bedraagt vijf zevende gedeelte van het pensioen, waarop de overleden minister als
      zodanig aanspraak zou hebben gehad indien hij met ingang van de dag na die van zijn overlijden was ontslagen
      of waarop de overleden gewezen minister als zodanig recht of uitzicht had, een en ander met inachtneming van
      [artikel 15, tweede lid, onder b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '15'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '22.2'
    text: 'In afwijking van het vorige lid bedraagt het pensioen van de nabestaande van hem die overlijdt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22
  - number: 22.2.a
    text: |-
      als minister vóór het bereiken van de leeftijd van 65 jaar, vijf zevende gedeelte van het pensioen waarop die
      minister aanspraak zou hebben kunnen maken, indien hij zijn ambt tot het bereiken van evengenoemde leeftijd zou
      hebben bekleed;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22
  - number: 22.2.b
    text: |-
      als gewezen minister in de periode, waarover hem een uitkering is toegekend, vijf zevende deel van het pensioen
      waarop de gewezen minister aanspraak zou hebben kunnen maken, indien hij tot het bereiken van de leeftijd van 65
      jaar recht op uitkering zou hebben gehad, met dien verstande, dat voor de berekening van het pensioen de diensttijd
      wordt doorgeteld naar de mate van medetelling van diensttijd op de dag van overlijden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22
  - number: '22.3'
    text: |-
      Indien wegens eenzelfde sterfgeval voor een nabestaande recht ontstaat zowel op nabestaandenpensioen
      krachtens deze afdeling als op een nabestaandenpensioen krachtens of op de voet van de [derde][ref1]
      of [vijfde afdeling van deze wet][ref2], wordt voor de berekening van de eigen pensioenen waarvan de
      nabestaandenpensioenen zijn afgeleid, tijd, die zowel voor de berekening van eerstbedoeld pensioen als voor de
      berekening van het andere pensioen medetelt en niet daadwerkelijk gelijktijdig in de verschillende ambten is
      doorgebracht, slechts medegeteld voor de berekening van het pensioen, waarbij die tijd het hoogste bedrag oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Vijfde
  - number: '22.4'
    text: |-
      Bij de toepassing van de voorgaande leden wordt ten aanzien van het eigen pensioen voor zover
      [artikel 14a][ref1] daarop van toepassing is, in alle gevallen gerekend met de franchise bedoeld in
      [artikel 14a, derde lid onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 14a
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 14a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 22a.1
    text: |-
      De nabestaande die jonger is dan 65 jaar maar geen recht heeft op nabestaandenuitkering ingevolge de
      [Algemene nabestaandenwet][ref1], heeft recht op een toeslag op zijn volgens [artikel 22][ref2] berekende pensioen,
      indien dat is berekend of mede berekend over diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 22a.2
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na 31 december
      1985 2,5 procent van 75 procent van het tot een jaarbedrag herleide bedrag van de nabestaandenuitkering en de
      vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1], zoals die wet geldt op 1 januari van het jaar
      waarin recht op nabestaandenpensioen ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 22a.3
    text: |-
      De nabestaande, bedoeld in het eerste lid, die jonger is dan 40 jaar, heeft recht op de in dat lid bedoelde toeslag
      voor de duur van 12 maanden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22a
  - number: 22a.4
    text: |-
      De toeslag gaat in met ingang van de maand waarin het recht daarop ontstaat en wordt met ingang van 1 januari van
      ieder jaar aangepast volgens de regels, bedoeld in [artikel 105, eerste lid][ref1], vanaf 1 juli 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 22a.5
    text: 'Het recht op toeslag vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22a
  - number: 22a.5.a
    text: met ingang van de dag waarop de nabestaande 65 jaar wordt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22a
  - number: 22a.5.b
    text: |-
      met ingang van de maand volgend op die waarin de nabestaande hertrouwt, als partner wordt aangemeld of als
      samenwonend als bedoeld in de [Algemene nabestaandenwet][ref1] wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 22b.1
    text: |-
      De nabestaande die recht heeft op nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1], waarop
      inkomen in mindering wordt gebracht, heeft recht op een toeslag op zijn volgens [artikel 22][ref2] berekende
      pensioen, indien dat is berekend of mede berekend over diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 22b.2
    text: |-
      Recht op toeslag heeft eveneens de nabestaande aan wie in het tijdvak van 1 juli 1996 tot 1 juli 1999
      nabestaandenpensioen is toegekend en op wiens uitkering ingevolge de [Algemene nabestaandenwet][ref1] in dat
      tijdvak inkomen in mindering is gebracht, met ingang van die vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 22b.3
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na
      31 december 1985 2,5 percent van het verschil tussen 75 percent van het tot een jaarbedrag herleide bedrag van de
      nabestaandenuitkering en de vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1], zoals die wet geldt
      op 1 januari van het jaar waarin recht op nabestaandenpensioen ontstaat, zonder de vermindering en het verminderde
      bedrag. De toeslag bedraagt niet meer dan 75 percent van het in de eerste volzin eerstbedoelde bedrag en kan niet
      negatief zijn. De toeslag wordt nader vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 22b.3.a
    text: |-
      met ingang van 1 januari van ieder jaar volgens de regels, bedoeld in [artikel 105, eerste lid][ref1], vanaf 1 juli
      1999;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 22b.3.b
    text: |-
      bij iedere nadere vaststelling van de verminderdering van een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 22b.4
    text: |-
      [Artikel 22a, vierde en vijfde lid][ref1], zijn mede van toepassing op de toeslag ingevolge dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 22a
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 22c.1
    text: |-
      De nabestaande die recht heeft op nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1] en op
      1 januari 1998 55 jaar of ouder is, heeft recht op een toeslag op zijn volgens [artikel 22][ref2] berekende
      pensioen, indien dat is berekend of mede berekend over diensttijd na 31 december 1985, indien en voor zo lang
      hij recht heeft op een nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref3], die krachtens
      [artikel 67, derde of negende lid van die wet][ref4] vanaf 1 januari 1998 wordt verminderd wegens de omstandigheid
      dat de nabestaande vanaf een tijdstip voor 1 juli 1996 met dezelfde persoon onafgebroken ongehuwd samenwoont.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007795
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel67
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0007795
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '67'
  - number: 22c.2
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het nabestaandenpensioen tellend jaar na 31
      december 1985 2,5 procent van het verschil tussen 75 procent van het tot een jaarbedrag herleide bedrag van de
      nabestaandenuitkering en de vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1] zonder vermindering
      en het verminderde bedrag. De toeslag bedraagt niet meer dan 75 procent van het in de eerste volzin eerstbedoelde
      bedrag. De toeslag wordt vanaf 1 januari 1998 vastgesteld met inachtneming van de vanaf die datum geldende bedragen
      krachtens de [Algemene nabestaandenwet][ref2] en wordt vervolgens nader vastgesteld met ingang van 1 januari en 1
      juli aan de hand van de ontwikkeling van die bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0007795
  - number: 22c.3
    text: 'Het recht op de toeslag vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22c
  - number: 22c.3.a
    text: met ingang van de dag waarop de nabestaande de 65-jarige leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22c
  - number: 22c.3.b
    text: met ingang van de maand volgend op die waarin de nabestaande trouwt of partij is bij een aanmelding;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22c
  - number: 22c.3.c
    text: |-
      met ingang van de eerste dag van de maand waarin de vermindering van de nabestaandenuitkering, bedoeld in het
      eerste lid, ongedaan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22c
  - number: 22c.4
    text: |-
      [Artikel 22a, vierde lid][ref1], is van overeenkomstige toepassing. [Artikel 22b][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel22b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 22a
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 22b
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '23.1'
    text: |-
      Het bijzonder nabestaandenpensioen bedraagt vijf zevende gedeelte van een eigen pensioen waarbij in aanmerking
      wordt genomen:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel23
  - number: 23.1.a
    text: |-
      de berekeningsgrondslag waarnaar het pensioen van de minister, gewezen minister of gepensioneerd minister zou zijn
      berekend indien deze op de dag van ontbinding van het huwelijk dan wel van het einde van de aanmelding als partner
      recht op pensioen zou hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel23
  - number: 23.1.b
    text: |-
      pensioengeldige tijd die is gelegen vóór de onder a bedoelde dag, met dien verstande dat in de gevallen bedoeld in
      [artikel 17, derde lid, onder c en d][ref1], uitsluitend tijd vóór respectievelijk 1 augustus 2003 en 1 juli 1999
      in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '23.2'
    text: |-
      Indien er recht bestaat op meer dan een bijzonder nabestaandenpensioen als bedoeld in
      [artikel 17, eerste of tweede lid][ref1], vindt het eerste lid overeenkomstige toepassing met dien verstande, dat
      voor de berekening van het bijzonder nabestaandenpensioen ontleend aan elk huwelijk en elke aanmelding waaraan een
      eerder huwelijk dan wel een eerdere aanmelding voorafgaat slechts de diensttijd medetelt die samenloopt of geacht
      kan worden samen te lopen met de huwelijksduur dan wel de duur van de aanmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '23.3'
    text: |-
      [Artikel 22, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '23.4'
    text: |-
      Indien er bij een overlijden recht bestaat op een of meer bijzondere nabestaandenpensioenen wordt het
      nabestaandenpensioen dat aan hetzelfde overlijden wordt ontleend met het bedrag daarvan verminderd.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel23
  - number: '24'
    text: |-
      Indien een nabestaande hertrouwt, partij is bij een aanmelding of wordt aangemerkt als ongehuwd samenwonend als
      bedoeld in de [Algemene nabestaandenwet][ref1], wordt zijn pensioen opnieuw vastgesteld met ingang van de daarop
      volgende maand. Daarbij wordt uitsluitend de voor pensioen in aanmerking komende diensttijd van de minister, de
      gewezen minister of de gepensioneerde minister in aanmerking genomen, die gelegen is voor het tijdstip van diens
      overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '25.1'
    text: 'Het wezenpensioen bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25
  - number: 25.1.a
    text: |-
      voor elk kind, wiens ouder aan het overlijden van de minister, gewezen minister of gepensioneerd minister recht op
      pensioen ontleent, een zevende gedeelte;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25
  - number: 25.1.b
    text: |-
      voor elk ander kind, twee zevende gedeelte, van het pensioen van de overledene, berekend overeenkomstig
      [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '25.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder ouder mede begrepen de nabestaande, die op het tijdstip van zijn
      overlijden de pleegouderlijke zorg had van het kind, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel20
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: 25a.1
    text: Dit artikel is uitsluitend van toepassing op pensioenberekeningen over diensttijd na 31 december 1985.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25a
  - number: 25a.2
    text: |-
      De wees die geen recht heeft op wezenuitkering ingevolge de [Algemene nabestaandenwet][ref1] heeft recht op een
      toeslag op zijn volgens [artikel 25][ref2] berekende pensioen, tenzij zijn ouder recht heeft op halfwezenuitkering
      ingevolge de [Algemene nabestaandenwet][ref3]. Deze toeslag bedraagt jaarlijks voor elk voor de berekening van het
      wezenpensioen tellend jaar:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0007795
  - number: 25a.2.a
    text: |-
      voor de wees, bedoeld in [artikel 25, eerste lid, onder a][ref1], 0,375 percent van de tot een jaarbedrag herleide
      som van de nabestaandenuitkering en de halfwezenuitkering ingevolge de [Algemene nabestaandenwet][ref2], zoals
      die wet geldt op 1 januari van het jaar waarin recht op nabestaandenpensioen ontstaat, vermeerderd met de daarover
      berekende vakantie-uitkering ingevolge die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0007795
  - number: 25a.2.b
    text: |-
      voor de wees bedoeld in [artikel 25, eerste lid, onder b][ref1], 0,75 percent van het onder *a* bedoelde
      jaarbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel25
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 25a.3
    text: |-
      Indien aanspraak ontstaat op de toeslag, bedoeld in het tweede lid, geeft de wees hiervan onverwijld kennis aan
      Onze Minister. De toeslag gaat niet eerder in dan een jaar voor de eerste dag van de maand waarin de kennisgeving
      werd gedaan of waarin die toeslag ambtshalve is toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25a
  - number: 25a.4
    text: |-
      De toeslag gaat in met ingang van de maand waarin het recht daarop ontstaat en wordt met ingang van 1 januari van
      ieder jaar aangepast volgens de regels, bedoeld in [artikel 105, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '26.1'
    text: |-
      Onze Minister maakt een herberekening van het wezenpensioen overeenkomstig de [artikelen 25][ref1] en [25a][ref2],
      wanneer het nabestaandenpensioen of het bijzonder nabestaandenpensioen van de ouder wegens diens overlijden is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 25a
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '26.2'
    text: |-
      Wanneer het nabestaandenpensioen van de ouder krachtens [artikel 24][ref1] wegens hertrouwen of
      een aanmelding opnieuw wordt vastgesteld, verhoogt Onze Minister het wezenpensioen bedoeld in
      [artikel 25, eerste lid, onder a][ref2], met een bedrag, dat zich verhoudt tot het bedrag van dat wezenpensioen,
      zoals het verschil tussen het nabestaandenpensioen bedoeld in [artikel 22][ref3], vóór en na toepassing van
      [artikel 24][ref4] zich verhoudt tot dat nabestaandenpensioen vóór die toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel24
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '26.3'
    text: |-
      Voor de toepassing van dit artikel is [artikel 25, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel25
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '27.1'
    text: |-
      Het gezamenlijk bedrag van de wezenpensioenen gaat een bedrag gelijk aan vijf zevende gedeelte van het bedrag
      waarvan die pensioenen zijn afgeleid niet te boven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27
  - number: '27.2'
    text: |-
      Indien wegens toepassing van het eerste lid de wezenpensioenen worden verminderd, geschiedt deze vermindering in
      evenredigheid naar de omvang van die pensioenen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27
  - number: '27.3'
    text: |-
      Bij de toepassing van dit artikel wordt de toeslag, bedoeld in [artikel 27b][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 27b
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 27a.1
    text: |-
      De nabestaande die de leeftijd van 65 jaar nog niet heeft bereikt, heeft tot de dag waarop hij die leeftijd bereikt
      recht op een toeslag op zijn volgens de voorgaande artikelen berekende pensioen ten bedrage van 15 percent van dat
      pensioen voorzover berekend over tijd vóór 1 augustus 2003 en van 7,5 percent voorzover berekend over tijd na 31
      juli 2003, behoudens het bepaalde in het tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27a
  - number: 27a.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een pensioen als daar bedoeld verstaan het pensioen nadat
      eventueel [hoofdstuk 17][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 27a.3
    text: |-
      Dit artikel is niet van toepassing ten aanzien van degene die recht heeft op bijzonder nabestaandenpensioen, noch
      degene wiens nabestaandenpensioen met toepassing van [artikel 24][ref1] opnieuw is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel24
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 27a.4
    text: |-
      De in het eerste lid bedoelde toeslag bedraagt ten hoogste vijftien percent van f 72.309,80 . Dit bedrag wordt
      telkens gewijzigd bij de ministeriële regeling, bedoeld in [artikel 105, derde lid][ref1], overeenkomstig de
      aanpassing van een bedrag dat, omgerekend naar euro's, op 1 januari 1985  € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 27b.1
    text: |-
      De wees bedoeld in [artikel 25][ref1] heeft vanaf de eerste dag van de maand waarin hij de leeftijd van vijftien
      jaar heeft bereikt, recht op een toeslag op zijn volgens de voorgaande artikelen berekende pensioen ten bedrage van
      vijftien percent van dat pensioen, behoudens het bepaalde in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel25
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 27b.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een pensioen als daar bedoeld verstaan het pensioen nadat
      eventueel [hoofdstuk 17][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 27b.3
    text: |-
      De in het eerste lid bedoelde toeslag bedraagt ten hoogste vijftien percent van f 72.309,80 . Dit bedrag wordt
      telkens gewijzigd bij de ministeriële regeling, bedoeld in [artikel 105, derde lid][ref1], overeenkomstig de
      aanpassing van een bedrag dat, omgerekend naar euro's, op 1 januari 1985  € 28 678,91 bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '28'
    text: |-
      Het tijdelijk pensioen is gelijk aan het pensioen waarop recht zou bestaan indien de vermiste op de dag van zijn
      vermissing was overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel28
  - number: '29'
    text: |-
      Wij, de Raad van State gehoord, verklaren het uitzicht of het recht op pensioen geheel of gedeeltelijk vervallen,
      indien degene die dat uitzicht of recht heeft:
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel29
  - number: 29.a
    text: |-
      zich in vreemde krijgsdienst of in vreemde overheidsdienst heeft begeven en naar Ons oordeel zich daardoor uit
      Nederlands nationaal oogpunt beschouwd onwaardig heeft gedragen;
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel29
  - number: 29.b
    text: |-
      wegens enig strafbaar feit is veroordeeld waaruit naar Ons oordeel blijkt dat hij zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel29
  - number: '30'
    text: |-
      In bijzondere gevallen kunnen Wij, de Raad van State gehoord, een door of als gevolg van de toepassing van
      [artikel 29][ref1] vervallen uitzicht of recht op pensioen geheel of gedeeltelijk herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel29
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '29'
        hoofdstuk: '6'
        afdeling: Tweede
  - number: '31.1'
    text: |-
      Het recht op pensioen vervalt indien gedurende vijf achtereenvolgende jaren iedere invordering achterwege is
      gebleven.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel31
  - number: '31.2'
    text: |-
      Wij kunnen, de Raad van State gehoord, een door of als gevolg van de toepassing van het vorige lid vervallen recht
      of uitzicht op pensioen herstellen.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel31
  - number: '34.1'
    text: |-
      Indien een nabestaande aan wie reeds een nabestaandenpensioen is toegekend, hetzij krachtens deze wet, hetzij
      krachtens een andere regeling, ter zake van een later huwelijk of een latere aanmelding eveneens recht op
      nabestaandenpensioen verkrijgt, hetzij krachtens deze wet, hetzij krachtens een andere regeling, wordt samenlopende
      tijd slechts medegeteld bij de berekening van het pensioen waarbij die tijd het hoogste bedrag oplevert.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel34
  - number: '34.2'
    text: |-
      Onder een pensioen krachtens een andere regeling als bedoeld in het vorige lid wordt verstaan een pensioen ten
      laste van de Nederlandse schatkist - anders dan ingevolge wettelijke garanties of ingevolge overneming van de
      verplichting tot betaling -, ten laste van Aruba, van Curaçao, van Sint Maarten, van de openbare lichamen Bonaire,
      Sint Eustatius of Saba, van een publiekrechtelijk lichaam in Nederland of in evengenoemde landen, dan wel ten laste
      van een door het openbaar gezag in Nederland, in die landen of in die openbare lichamen ingesteld fonds.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel34
  - number: 34a.1
    text: |-
      Indien een wees die reeds recht op een wezenpensioen heeft, hetzij krachtens deze wet, hetzij krachtens een andere
      regeling, daarna eveneens recht op enig ander wezenpensioen verkrijgt, hetzij krachtens deze wet, hetzij krachtens
      een andere regeling, wordt voor de berekening van de eigen pensioenen waarvan die wezenpensioenen zijn of geacht
      moeten worden te zijn afgeleid, samenlopende tijd slechts medegeteld bij de berekening van het pensioen, waarbij
      die tijd het hoogste bedrag oplevert.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel34a
  - number: 34a.2
    text: |-
      [Artikel 34, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel34
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '34'
        hoofdstuk: '7'
        afdeling: Tweede
  - number: '35.1'
    text: |-
      Behoudens het in dit hoofdstuk verder bepaalde wordt op het tijdstip van de inwerkingtreding van deze wet
      ingetrokken de wet van 1 augustus 1956, *Stb.* 455, houdende nadere regeling tot het toekennen van uitkering en
      van pensioen aan gewezen ministers, staatssecretarissen, leden van gedeputeerde staten ener provincie en wethouders
      ener gemeente, zomede van een pensioen aan hun weduwen en wezen, alsmede de overgangsbepalingen van die wet.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel35
  - number: '35.2'
    text: Artikel 4 van de wet van 1 augustus 1956, *Stb.* 455, blijft van toepassing tot 1 januari 1969.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel35
  - number: '35.3'
    text: |-
      Artikel 14, onder *a*, van de wet van 1 augustus 1956, *Stb.* 455, blijft van toepassing tot het in
      [artikel 167, eerste lid][ref1], bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel167
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '167'
        hoofdstuk: '30'
        afdeling: Zesde
  - number: '35.4'
    text: |-
      Te rekenen van 1 september 1956 af wordt in de opsomming van artikelen in de aanhef van artikel 50, eerste lid, van
      de wet van 1 augustus 1956, *Stb.* 455, ingevoegd: 14, onder *a*.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel35
  - number: '36'
    text: |-
      De wettelijke bepalingen bedoeld in [artikel 35][ref1] blijven van kracht voor wat betreft de rechten en
      verplichtingen die op grond van die bepalingen voor het tijdstip van de inwerkingtreding van deze wet zijn ontstaan
      en die op dat tijdstip nog niet tot gelding zijn gebracht onderscheidenlijk waaraan op dat tijdstip nog niet is
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel35
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '35'
        hoofdstuk: '8'
        afdeling: Tweede
  - number: 36a.1
    text: |-
      De [artikelen 7, derde en vierde lid][ref1], en [7a tot en met 7c][ref2] zijn niet van toepassing ter zake van een
      ontslag of aftreden dat is ingegaan vóór de datum van inwerkingtreding van die bepalingen. In dat geval wordt in
      artikel 7, eerste lid, voor «vier jaren» gelezen: zes jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 36a.2
    text: |-
      Ten aanzien van de belanghebbende die op het tijdstip van inwerkingtreding van de
      [artikelen 7a tot en met 7c][ref1] het ambt van minister vervult en geen ambt bekleedt in het na de eerstvolgende
      verkiezing voor de leden van de Tweede Kamer aantredende kabinet, zijn de artikelen 7a tot en met 7c niet van
      toepassing. In dat geval wordt in [artikel 7, eerste lid][ref2], voor «vier jaren» gelezen: zes jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel7
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '37'
    text: |-
      De met ingang van een datum voorafgaande aan het tijdstip van de inwerkingtreding van deze wet, aan ontslagen
      ministers en aan weduwen en wezen van ministers, gewezen ministers en gepensioneerde ministers toegekende
      uitkeringen en pensioenen worden met ingang van dat tijdstip geacht krachtens deze wet te zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel37
  - number: '38.1'
    text: |-
      Met inachtneming van het volgende lid zullen de [artikelen 6 tot en met 14 van deze wet][ref1] geen toepassing
      vinden en in de plaats daarvan zullen de daarmede overeenkomende artikelen van Ons besluit van 31 oktober 1952,
      *Stb.* 543, en van de Pensioenwet 1922, *Stb.* 240, alsmede artikel 68, vierde lid, van laatstgenoemde wet, zoals
      deze artikelen luidden op 31 augustus 1956, van overeenkomstige toepassing zijn ten aanzien van hem, die op 31
      augustus 1956 het ambt van minister bekleedde en daartoe binnen zes maanden na het tijdstip, waarop hem ontslag
      wordt verleend, schriftelijk aan Onze Minister de wens te kennen geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '38.2'
    text: |-
      Ten aanzien van de belanghebbende, die de in het vorige lid bedoelde wens heeft kenbaar gemaakt, wordt met
      ingang van de dag waarop hem pensioen als gewezen minister wordt toegekend, over de tijd voorafgaand aan het
      ministerschap, die krachtens de Pensioenwet 1922, *Stb.* 240, zoals die wet op 31 december 1965 luidde, als
      diensttijd in aanmerking kwam, op de voet van de Algemene burgerlijke pensioenwet ten laste van het Algemeen
      burgerlijk pensioenfonds pensioen toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel38
  - number: '38.3'
    text: |-
      Pensioenen die ten laste van het Algemeen burgerlijk pensioenfonds zijn toegekend op grond van artikel 52, tweede
      lid, van de wet van 1 augustus 1956, *Stb.* 455, worden voor zover het recht op dat pensioen niet is vervallen,
      met ingang van het tijdstip van de inwerkingtreding van deze wet herberekend op de voet van de bepalingen van de
      Algemene burgerlijke pensioenwet, indien zulks voor de belanghebbende voordeliger is.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel38
  - number: '38.4'
    text: |-
      In de gevallen waarin de tijd voorafgaand aan het ministerschap, die krachtens de Pensioenwet 1922, *Stb.* 240,
      zoals die wet op 31 december 1965 luidde, als diensttijd in aanmerking kwam en geacht moet worden met pensioen te
      zijn vergolden hoewel dit niet tot een afzonderlijk pensioen ten laste van het Algemeen burgerlijk pensioenfonds
      heeft geleid omdat het pensioen als gewezen minister reeds het geldende maximum als bedoeld in artikel 68, derde
      lid, van die wet, zoals dit artikel op 31 augustus 1956 luidde, had bereikt, wordt met ingang van het tijdstip van
      de inwerkingtreding van deze wet, over eerstbedoelde tijd ten laste van het Algemeen burgerlijk pensioenfonds op de
      voet van de bepalingen van de [Algemene burgerlijke pensioenwet](onbekend) pensioen toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel38
  - number: '39.1'
    text: |-
      Ten aanzien van de gewezen minister aan wie een uitkering is toegekend ter zake van een ontslag als zodanig
      ná 31 december 1963 doch vóór 1 september 1966, wordt het bedrag van de uitkering, na aftrek van de eventueel
      daarop toegepaste vermindering wegens inkomsten, verhoogd met een compensatie van de premie die ingevolge de
      [Algemene Ouderdomswet][ref1] en de Algemene Weduwen- en Wezenwet van de uitkering wordt geheven, van 5,6 ten
      honderd van bedoeld bedrag over het jaar 1964 en daarna van 7,1 ten honderd van bedoeld bedrag, met inachtneming
      van de desbetreffende maximale grens.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '39.2'
    text: |-
      Ten aanzien van uitkeringen die zijn toegekend ter zake van een ontslag voor het tijdstip van de inwerkingtreding
      van deze wet, blijft het bepaalde in artikel 3, eerste lid, en artikel 8, eerste lid, van de wet van 1 augustus
      1956, *Stb.* 455, van kracht.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel39
  - number: '39.3'
    text: |-
      Uitkeringen die zijn toegekend ter zake van een ontslag voor het tijdstip van de inwerkingtreding van deze wet,
      worden te rekenen van 1 januari 1969 of het latere tijdstip waarop de uitkering is ingegaan, overeenkomstig het
      bepaalde in [artikel 8][ref1] herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 39a
    text: |-
      Ten aanzien van de uitkeringen die zijn toegekend ter zake van een ontslag vóór het tijdstip van inwerkingtreding
      van de [Wet aanpassing uitkeringsduur Appa][ref1], blijft de uitkeringsduur van kracht zoals deze gold op de dag
      voorafgaand aan dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0031991
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0031991
  - number: '40'
    text: |-
      Pensioenen toegekend ter zake van een ontslag verleend met een ingangsdatum gelegen vóór 1 januari 1964 worden
      afgeleid van de laatstelijk als minister genoten wedde, nadat daarop in mindering is gebracht een zodanig gedeelte
      van de ter zake van die wedde berekende premie, als bedoeld in [artikel 23 van de Algemene Ouderdomswet][ref1], als
      geacht moet worden door wedde-verhoging te zijn gecompenseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel23
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '23'
  - number: 40a.1
    text: |-
      In afwijking van [artikel 13b, derde lid][ref1], informeert Onze Minister de gewezen minister van wie de
      uitkeringsduur, bedoeld in [artikel 7, eerste of tweede lid][ref2], is geëindigd in de periode gelegen tussen
      31 december 2007 en de dag van inwerkingtreding van de [Wet aanpassing Appa en enkele andere wetten 2011][ref3],
      binnen vier maanden na inwerkingtreding van de Wet aanpassing Appa en enkele andere wetten 2011 over de
      mogelijkheid, bedoeld in artikel 13b, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030652
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13b
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0030652
  - number: 40a.2
    text: |-
      De gewezen minister kan tot een jaar na de inwerkingtreding van de
      [Wet aanpassing Appa en enkele andere wetten 2011][ref1] Onze Minister verzoeken tot omzetting van eigen pensioen
      in nabestaandenpensioen als bedoeld in [artikel 13b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030652
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel13b
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0030652
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 13b
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '41.1'
    text: |-
      Aan de weduwe wier weduwenpensioen wegens een volgend huwelijk is geëindigd op grond van artikel 22 van de wet
      van 1 augustus 1956, *Stb.* 455, of op grond van het vierde lid wordt op haar verzoek aan Onze Minister opnieuw
      weduwenpensioen toegekend indien dat huwelijk, anders dan door opvolgend huwelijk met rechterlijk verlof, wordt
      ontbonden. Indien haar ter zake van het latere huwelijk eveneens pensioen toekomt, hetzij krachtens deze wet,
      hetzij krachtens een andere regeling, als bedoeld in [artikel 34, tweede lid][ref1], wordt het opnieuw toe te
      kennen pensioen berekend met overeenkomstige toepassing van [artikel 24][ref2] en [artikel 34, eerste lid][ref3],
      tenzij toekenning van een dezer pensioenen, waarbij het recht op het andere pensioen vervalt, tot een hoger bedrag
      leidt. De vorige volzin vindt overeenkomstige toepassing, indien de weduwe ter zake van het latere huwelijk recht
      op bijzonder weduwenpensioen verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel34
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '34'
        hoofdstuk: '7'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '34'
        hoofdstuk: '7'
        afdeling: Tweede
  - number: '41.2'
    text: |-
      Bij toekenning aan de weduwe van weduwenpensioen ingevolge het vorige lid wordt het wezenpensioen van haar
      kinderen, als bedoeld in [artikel 25, eerste lid, eerste volzin][ref1], nader vastgesteld overeenkomstig het
      bepaalde in dat artikel en met inachtneming van [artikel 26, tweede lid][ref2], indien [artikel 24][ref3]
      overeenkomstige toepassing vindt bij de berekening van het weduwenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel24
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: '41.3'
    text: |-
      Het weduwenpensioen of de weduwenpensioenen en het nader vastgestelde wezenpensioen gaan in met de dag volgende op
      die van de ontbinding van het huwelijk. Herberekening van de pensioenen ingevolge de laatste volzin van het eerste
      lid geschiedt met ingang van de dag, waarop het bijzonder weduwenpensioen ingaat of zou ingaan.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel41
  - number: '41.4'
    text: |-
      In afwijking van [artikel 24][ref1] eindigt een ingevolge het eerste lid opnieuw toegekend weduwenpensioen, indien
      de weduwe hertrouwt met een man, met wie zij vóór 1 januari 1966 reeds gehuwd is geweest, met ingang van de maand
      volgende op die waarin zij hertrouwt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel24
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 41a
    text: |-
      Indien krachtens [artikel U 31a van de Algemene burgerlijke pensioenwet](onbekend) of een in strekking met dat
      artikel overeenkomende bepaling in andere pensioenwetten recht op pensioen bestaat en voor het tijdstip van de
      inwerkingtreding van deze wet ter zake van een eerder huwelijk reeds recht op pensioen bestond krachtens de wet
      van 1 augustus 1956 (*Stb.* 455), wordt laatstbedoeld pensioen met ingang van de dag, waarop eerstbedoeld pensioen
      ingaat, nader vastgesteld met overeenkomstige toepassing van [artikel 24][ref1] en [artikel 26, tweede lid][ref2],
      en is voorts [artikel 34, eerste lid][ref3], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel34
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '34'
        hoofdstuk: '7'
        afdeling: Tweede
  - number: '42'
    text: |-
      Aan de weduwe en wezen van de gewezen minister aan wie op grond van artikel 54 van de wet van 1 augustus 1956,
      *Stb.* 455, geen pensioen is toegekend, wordt over de tijd voorafgaand aan het ministerschap, die krachtens de
      Pensioenwet 1922, *Stb.* 240, zoals die wet op 31 december 1965 luidde, als diensttijd in aanmerking kwam, met
      ingang van het tijdstip van de inwerkingtreding van deze wet ten laste van het Algemeen burgerlijk pensioenfonds
      pensioen toegekend op de voet van de bepalingen van de [Algemene burgerlijke pensioenwet](onbekend), met dien
      verstande dat [artikel U 37 van laatstbedoelde wet](onbekend) niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel42
  - number: '43.1'
    text: |-
      Op verzoek wordt weduwenpensioen of wezenpensioen toegekend aan de weduwe, die voor het tijdstip van de
      inwerkingtreding van deze wet niet dan wel op dat tijdstip niet meer is hertrouwd, onderscheidenlijk aan de
      kinderen, die recht op weduwenpensioen of wezenpensioen hadden gehad, indien [artikel 15][ref1] had gegolden op het
      tijdstip van het overlijden waaraan zij zodanig recht konden ontlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '15'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '43.2'
    text: |-
      Indien voor het tijdstip van de inwerkingtreding van deze wet ter zake van een ander huwelijk reeds recht op
      pensioen bestond krachtens de wet van 1 augustus 1956 (*Stb.* 455), wordt het pensioen, waarop ter zake van
      het eerdere huwelijk krachtens de wet van 1 augustus 1956 *(Stb.* 455) recht bestond dan wel krachtens het
      vorige lid recht bestaat, met ingang van de dag, waarop het krachtens het vorige lid toe te kennen pensioen
      ingaat, nader vastgesteld dan wel vastgesteld met overeenkomstige toepassing van [artikel 24][ref1] en
      [artikel 26, tweede lid][ref2], en is voorts [artikel 34, eerste lid][ref3], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel34
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '34'
        hoofdstuk: '7'
        afdeling: Tweede
  - number: '43.3'
    text: |-
      Het vorige lid is van overeenkomstige toepassing, indien ter zake van een ander huwelijk voor het tijdstip van de
      inwerkingtreding van deze wet reeds recht op pensioen bestond krachtens een andere regeling als bedoeld in artikel
      20*a*, tweede lid, van de wet van 1 augustus 1956 (*Stb.* 455), dan wel recht op pensioen bestaat krachtens een in
      strekking met het eerste lid overeenkomende bepaling in andere pensioenwetten.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel43
  - number: '43.4'
    text: |-
      Toekenning van pensioen krachtens het eerste lid vindt niet plaats, indien toepassing van het tweede lid of van het
      derde lid zou leiden tot een gezamenlijk bedrag aan pensioen lager dan het bedrag van het pensioen, waarop reeds
      recht bestond.
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel43
  - number: '43.6'
    text: |-
      De in het eerste lid bedoelde pensioenen gaan in op het tijdstip van de inwerkingtreding van deze wet met dien
      verstande dat, indien het verzoek meer dan een jaar na het tijdstip bedoeld in [artikel 167, eerste lid][ref1], is
      gedaan, zij niet vroeger ingaan dan een jaar voor de eerste dag van de maand waarin het verzoek werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel167
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '167'
        hoofdstuk: '30'
        afdeling: Zesde
  - number: '45.1'
    text: |-
      Op verzoek wordt wezenpensioen toegekend aan het kind dat de leeftijd van eenentwintig jaren nog niet heeft bereikt
      en niet gehuwd is of gehuwd geweest is dat recht op zodanig pensioen had gehad, indien de [artikelen 19][ref1] en
      [20][ref2] hadden gegolden op het tijdstip van het overlijden waaraan zij zodanig recht konden ontlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel20
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '45.3'
    text: |-
      Het in het eerste lid bedoelde pensioen gaat in op het tijdstip van de inwerkingtreding van deze wet met dien
      verstande dat, indien het verzoek meer dan een jaar na het tijdstip bedoeld in [artikel 167, eerste lid][ref1], is
      gedaan, het niet vroeger ingaat dan een jaar voor de eerste dag van de maand waarin het verzoek werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel167
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '167'
        hoofdstuk: '30'
        afdeling: Zesde
  - number: '46'
    text: |-
      De pensioenen toegekend aan weduwen en wezen van ministers, gewezen ministers of gepensioneerde ministers
      worden, voor zover het recht op pensioen niet is vervallen, met ingang van het tijdstip van de inwerkingtreding
      van deze wet herberekend overeenkomstig [artikel 22][ref1] onderscheidenlijk [25][ref2], met inachtneming van
      [artikel 27][ref3], indien dit voor de belanghebbende voordeliger is. Bij de herberekening worden onder een
      uitkering als bedoeld in [artikel 6][ref4] mede begrepen uitkeringen, toegekend aan gewezen ministers krachtens aan
      deze wet voorafgaande uitkeringsregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2013-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '2'
