  - number: 84c.1
    text: 'De uitkering van een betrokkene wordt voortgezet tot zijn pensioengerechtigde leeftijd indien hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
  - number: 84c.1.a
    text: lid was van de Tweede Kamer op 24 maart 2010,
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
  - number: 84c.1.b
    text: in zijn functie herbenoemd is onmiddellijk na de verkiezingen voor de Tweede Kamer van 9 juni 2010,
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
  - number: 84c.1.c
    text: bij de herbenoeming ten minste 50 jaar oud was en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
  - number: 84c.1.d
    text: |-
      voldoet aan de in [artikel 52, derde lid][ref1], bedoelde eisen ten aanzien van de diensttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 84c.2
    text: |-
      Uitkeringen ter zake van een aftreden vóór 27 juli 2013 worden verstrekt overeenkomstig de regels zoals die golden
      op de dag voorafgaand aan dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
  - number: 84c.3
    text: |-
      De uitkering van een betrokkene ter zake van een aftreden vóór 27 juli 2013 wordt voortgezet tot zijn
      pensioengerechtigde leeftijd indien zij is toegekend op grond van [artikel 52, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 84c.4
    text: |-
      [Artikel 52, derde lid][ref1], is niet van toepassing op een ontslag of aftreden dat is ingegaan voor de datum van
      inwerkingtreding van de [Wet verkorting duur voortgezette uitkering Appa][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0036870
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0036870
  - number: 84c.5
    text: |-
      Een belanghebbende die op de datum van inwerkingtreding van de
      [Wet verkorting duur voortgezette uitkering Appa][ref1] Kamerlid is, wordt bij zijn aftreden een uitkering
      verstrekt overeenkomstig de regels zoals die golden op de dag voorafgaand aan die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0036870
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0036870
  - number: 84c.6
    text: |-
      Een belanghebbende die op de datum van inwerkingtreding van de
      [Wet verkorting duur voortgezette uitkering Appa][ref1] Kamerlid is en als Kamerlid is herbenoemd onmiddellijk na
      de eerstvolgende kamerverkiezingen na die datum, wordt bij zijn aftreden een uitkering verstrekt overeenkomstig de
      regels zoals die golden op de dag voor die datum indien hij tevens op de datum van zijn herbenoeming:


      [ref1]: https://wetten.overheid.nl/BWBR0036870
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0036870
  - number: 84c.6.a
    text: |-
      negen jaar en zeven maanden of minder verwijderd is van de pensioengerechtigde leeftijd die is vastgesteld voor het
      kalenderjaar vijf jaren na aftreden, en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
  - number: 84c.6.b
    text: |-
      in het tijdvak van twaalf jaren ten minste tien jaren een functie heeft bekleed als genoemd in
      [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel84c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '95.1'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
  - number: 95.1.a
    text: |-
      een pensioen: een pensioen of een gedeelte van een pensioen voor zover berekend over tijd voor 1 januari 1986 dat
      is toegekend of geacht wordt te zijn toegekend krachtens de [tweede][ref1] en [derde afdeling][ref2] van deze wet,
      met uitzondering van de overgangstoeslag bedoeld in artikel 4 van de derde afdeling van de Pensioenmaatregelen
      1963;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Derde
  - number: 95.1.b
    text: 'een algemeen pensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
  - number: 95.1.b.1e
    text: |-
      een bruto-ouderdomspensioen als bedoeld in de [Algemene Ouderdomswet][ref1], met inbegrip van de daarbij behorende
      vakantie-uitkering voor zover deze niet behoort tot de overlijdensuitkering krachtens die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 95.1.b.2e
    text: |-
      een nabestaandenuitkering, en een wezenuitkering ingevolge de [Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 95.1.b.3e
    text: |-
      een pensioen of uitkering toegekend krachtens een wettelijke regeling van Aruba, van Curaçao, van Sint Maarten,
      van een vreemde mogendheid of krachtens een wettelijke regeling die uitsluitend in de openbare lichamen Bonaire,
      Sint Eustatius en Saba van toepassing is en naar aard en strekking overeenkomend met een algemeen pensioen als
      omschreven onder 1e of 2e;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
  - number: 95.1.c
    text: 'een belanghebbende: degene die recht heeft op een pensioen.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
  - number: '95.2'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder het algemeen pensioen van de belanghebbende die de
      pensioengerechtigde leeftijd heeft bereikt, mede begrepen het algemeen pensioen waarop zijn echtgenoot recht heeft,
      tenzij het echtpaar duurzaam gescheiden leeft. Voor de toepassing van de vorige volzin wordt mede als echtgenoot
      aangemerkt degene die voor de toepassing van de [Algemene Ouderdomswet][ref1] als echtgenoot van de belanghebbende
      wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '95.3'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt een pensioen als bedoeld in [artikel 101, vijfde lid][ref1], dan wel
      enig ander pensioen als bedoeld in [artikel 102, eerste lid][ref2], voorzover dit pensioen of gedeelte daarvan is
      berekend over tijd voor 1 januari 1986, in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel102
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '101'
        hoofdstuk: '17'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '102'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '96'
    text: |-
      Het pensioen waarop twee of meer volle wezen recht hebben wordt, indien het als een eenheid is toegekend, voor de
      toepassing van dit hoofdstuk geacht aan ieder van genoemde wezen te zijn toegekend tot een bedrag, gelijk aan dat
      pensioen gedeeld door hun aantal.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel96
  - number: '97.1'
    text: |-
      Voor een belanghebbende die tevens recht heeft op een algemeen pensioen, wordt het deel daarvan dat geacht kan
      worden betrekking te hebben op een tijd overeenkomende met de diensttijd, waarnaar zijn pensioen is of geacht wordt
      te zijn berekend, tot een maximum van 40 jaren, gerekend deel uit te maken van het bedrag van zijn pensioen, met
      dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
  - number: 97.1.a
    text: |-
      voor zover diensttijd met 3,5 percent per jaar met pensioen wordt vergolden, deze diensttijd met 2 wordt
      vermenigvuldigd;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
  - number: 97.1.b
    text: |-
      voor zover diensttijd met 0,875 percent per jaar met pensioen wordt vergolden, deze diensttijd met 0,5 wordt
      vermenigvuldigd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
  - number: '97.2'
    text: |-
      Het inbouwbedrag wordt berekend aan de hand van het bedrag van het algemeen pensioen zoals dat luidt op 1 januari
      van het jaar waarin het recht op ouderdomspensioen, nabestaandenpensioen, bijzonder nabestaandenpensioen of
      wezenpensioen ontstaat.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
  - number: '97.3'
    text: |-
      Indien het bedrag van het algemeen pensioen op grond van persoonlijke omstandigheden wordt gewijzigd, wordt de
      pensioengrondslag herberekend. Het herberekende pensioen gaat in op dezelfde dag als waarop de bedoelde wijziging
      zich heeft voorgedaan. Indien de herberekening leidt tot een verhoging van het pensioen, gaat die verhoging niet
      vroeger in dan een jaar voor de eerste dag van de maand waarin de betrokkene kennis heeft gegeven van de wijziging
      van persoonlijke omstandigheden of waarin de verhoging ambtshalve plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
  - number: '97.4'
    text: |-
      Ten aanzien van hem die op het tijdstip met ingang waarvan voor hem recht op algemeen pensioen ontstaat, reeds
      recht op pensioen heeft, vindt het vorige lid toepassing met ingang van de eerste dag van de maand waarin het recht
      op algemeen pensioen is ontstaan, of zo veel later als het pensioen is ingegaan.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
  - number: '97.5'
    text: |-
      Op een nabestaandenpensioen, niet zijnde een pensioen als bedoeld in [artikel 17][ref1] of [62][ref2], dat is
      afgeleid van een pensioen waarop, in verband met het recht op een algemeen pensioen voor gehuwden, het eerste lid
      van toepassing was, vindt dat lid niet eerder toepassing dan met ingang van de eerste dag van de maand, volgend op
      die waarin dat pensioen krachtens het bepaalde in [artikel 115, eerste lid][ref3], is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel115
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '62'
        hoofdstuk: '12'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '115'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '97.6'
    text: |-
      Het inbouwbedrag overschrijdt niet het bedrag van het algemeen pensioen, dat geacht kan worden betrekking te hebben
      op het tijdvak, liggende tussen de aanvang en het einde van de diensttijd waarnaar het pensioen is of geacht wordt
      te zijn berekend.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel97
  - number: '98.1'
    text: |-
      Indien een belanghebbende een algemeen pensioen gaat genieten dan wel het genot van een algemeen pensioen of
      tijdelijke uitkering eindigt, of indien in het bedrag van het algemeen pensioen een wijziging wordt gebracht
      op grond van persoonlijke omstandigheden van hemzelf, zijn echtgenoot of zijn kinderen, is hij gehouden hiervan
      onverwijld kennis te geven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel98
  - number: '98.2'
    text: |-
      Indien een belanghebbende de in het vorige lid bedoelde kennisgeving niet onverwijld doet, gaat een verlaging van
      het inbouwbedrag niet vroeger in dan een jaar voor de eerste dag van de maand waarin de kennisgeving werd gedaan of
      waarin ambtshalve vermindering van het inbouwbedrag plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel98
  - number: '99'
    text: |-
      Voor de toepassing van [artikel 97][ref1] geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel97
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '97'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 99.a
    text: |-
      Het algemeen pensioen wordt geacht betrekking te hebben op het tijdvak liggende tussen de
      tijdstippen waarop belanghebbende de aanvangsleeftijd en de pensioengerechtigde leeftijd, bedoeld in
      [artikel 1 van de Algemene Ouderdomswet][ref1] heeft bereikt met dien verstande dat, indien een belanghebbende
      recht heeft op nabestaanden- of wezenpensioen, het vorenstaande overeenkomstige toepassing vindt in verband met
      degene aan wiens overlijden het recht op pensioen wordt ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
  - number: 99.b
    text: |-
      Het recht op een algemeen pensioen, dat bestond op de dag waarop de rechthebbende is overleden of sedert welke
      hij is vermist, wordt geacht voort te duren tot het tijdstip waarop diens pensioen krachtens het bepaalde in
      [artikel 115, eerste lid][ref1], is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel115
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '115'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: 99.c
    text: |-
      Indien een nabestaande recht heeft op nabestaandenuitkering op grond van
      [artikel 14, eerste lid, onder a, van de Algemene nabestaandenwet][ref1], maar geen van de
      kinderen aan welke de nabestaande het recht op die nabestaandenuitkering ontleent recht heeft
      op pensioen, wordt uitsluitend uitgegaan van het bedrag van de nabestaandenuitkering, bedoeld in
      [artikel 17, eerste lid, van de Algemene nabestaandenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel17
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '17'
  - number: 99.e
    text: |-
      Als diensttijd wordt uitsluitend in aanmerking genomen de diensttijd, gelegen tussen de tijdstippen, waarop de
      aanvangsleeftijd en de pensioengerechtigde leeftijd, bedoeld in [artikel 1 van de Algemene Ouderdomswet][ref1]
      is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
  - number: 99.f
    text: |-
      De diensttijd, waarnaar een pensioen is berekend op grond van artikel 68, tweede lid, van de Pensioenwet 1922,
      *Stb.* 240, zoals dit artikel luidde op 31 augustus 1956, van hem die na het tijdstip van de inwerkingtreding van
      deze wet de wens te kennen geeft als bedoeld in [artikel 38, eerste lid][ref1], wordt tot een maximum van 2,4 jaar
      vermenigvuldigd met 4,76.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel38
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '38'
        hoofdstuk: '8'
        afdeling: Tweede
  - number: 99.g
    text: Een pensioen dat niet is berekend naar diensttijd wordt geacht te zijn berekend naar een diensttijd van 40 jaren.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
  - number: 99.h
    text: |-
      Diensttijd, waarnaar een pensioen is of geacht wordt te zijn berekend en die niet daadwerkelijk als politiek
      ambtsdrager is doorgebracht, wordt geacht aan te sluiten bij het einde van de ambtsvervulling waaraan het recht
      op pensioen is ontleend; voor zover dientengevolge deze diensttijd zich uitstrekt na het tijdstip waarop de
      pensioengerechtigde leeftijd is of zou zijn bereikt wordt die diensttijd, te rekenen van dat tijdstip, geacht te
      zijn doorgebracht, voor zover mogelijk gedurende tijdvakken van onderbreking van de daadwerkelijk als politiek
      ambtsdrager doorgebrachte tijd en voor het overige onmiddellijk voor de aanvang van de diensttijd waarnaar het
      pensioen is berekend.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
  - number: 99.i
    text: |-
      Van de diensttijd wordt buiten beschouwing gelaten de tijd, waarop betrekking heeft of geacht kan worden betrekking
      te hebben het bedrag van het algemeen pensioen, waarop aanspraak is verkregen door vrijwillige premiebetaling
      krachtens [artikel 45 van de Algemene Ouderdomswet][ref1] en [hoofdstuk 5 van de Algemene nabestaandenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0007795
        hoofdstuk: '5'
  - number: 99.j
    text: |-
      De vakantie-uitkeringen, bedoeld in de [Algemene Ouderdomswet][ref1] en de [Algemene nabestaandenwet][ref2], worden
      geacht op overeenkomstige wijze als het algemeen pensioen in termijnen te worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '100'
    text: |-
      Indien de belanghebbende een gehuwde vrouw is, wordt voor de toepassing van [artikel 97][ref1] uitgegaan van het
      algemeen pensioen voor een ongehuwde pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel97
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '97'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '101.1'
    text: |-
      Indien aan een belanghebbende meer dan een pensioen is of geacht wordt te zijn toegekend, en de diensttijd waarnaar
      die pensioenen zijn of geacht worden te zijn berekend geheel of gedeeltelijk samenvalt, overschrijdt de som van
      de inbouwbedragen - voor zover deze geacht kunnen worden betrekking te hebben op een tijd overeenkomende met de
      samenvallende diensttijd - niet het bedrag van het algemeen pensioen, dat geacht kan worden betrekking te hebben op
      een tijd overeenkomende met bedoelde samenvallende diensttijd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel101
  - number: '101.2'
    text: |-
      Indien een overschrijding als bedoeld in het vorige lid plaats zou vinden, wordt het voor ieder pensioen berekende
      inbouwbedrag, voor zover betrekking hebbende op samenvallende diensttijd als bedoeld in het vorige lid, verminderd
      tot een zodanig deel van het bedrag van het algemeen pensioen bedoeld aan het slot van het vorige lid, als elk
      inbouwbedrag zich verhoudt tot de som van die bedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel101
  - number: '101.3'
    text: |-
      Indien de som van de inbouwbedragen, ook na toepassing van het vorige lid, een bedrag gelijk aan 80 percent van
      het algemeen pensioen overschrijdt, wordt deze overschrijding in mindering gebracht op elk inbouwbedrag in de
      verhouding waarin elk van die bedragen staat tot de som daarvan.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel101
  - number: '101.4'
    text: |-
      Indien aan een belanghebbende pensioen is of geacht wordt te zijn toegekend en tevens pensioen krachtens een
      andere regeling, als bedoeld in het volgende lid, is - of voor de toepassing van met dit hoofdstuk overeenkomende
      bepalingen van die regeling geacht wordt te zijn - toegekend, vinden de vorige leden voor zoveel mogelijk
      overeenkomstige toepassing. Het bepaalde in de vorige volzin geldt met dien verstande, dat indien het betreft
      pensioenen toegekend krachtens een militaire pensioenwet, voor de toepassing van dit artikel niet als diensttijd
      geldt de diensttijd, die krachtens die wet met vier per mille van de pensioengrondslag is vergolden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel101
  - number: '101.5'
    text: |-
      Onder een pensioen krachtens een andere regeling als bedoeld in het vorige lid wordt verstaan een pensioen ten
      laste van de Nederlandse schatkist - anders dan ingevolge wettelijke garanties of ingevolge overneming van de
      verplichting tot betaling -, ten laste van Aruba, van Curaçao, van Sint Maarten, van de openbare lichamen Bonaire,
      Sint Eustatius of Saba, van een publiekrechtelijk lichaam in Nederland of in evengenoemde landen, dan wel ten laste
      van een door het openbaar gezag in Nederland, in die landen of in die openbare lichamen ingesteld fonds.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel101
  - number: '101.6'
    text: |-
      Op verzoek van de belanghebbende wordt dit artikel overeenkomstig toegepast, indien aan diens echtgenoot een of
      meer pensioenen zijn of geacht worden te zijn toegekend, hetzij krachtens deze wet, hetzij krachtens een andere
      regeling als bedoeld in het vijfde lid. [Artikel 102, tweede lid][ref1], is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel102
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '102'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '102.1'
    text: |-
      Op verzoek van degene die aantoont, dat uit hoofde van zijn recht op algemeen pensioen een vermindering plaatsvindt
      van enig ander pensioen dan bedoeld in [artikel 101, vijfde lid][ref1], wordt het bedrag van die vermindering voor
      zoveel mogelijk in mindering gebracht op het inbouwbedrag. De vorige volzin is slechts van toepassing voor zover
      bedoelde vermindering betrekking heeft op tijd die gelijktijdig in de desbetreffende betrekkingen is of geacht kan
      worden te zijn vervuld. Aan diensttijd die niet daadwerkelijk in dienstverhouding of als politiek ambtsdrager is
      doorgebracht wordt een plaats toegekend overeenkomstig het bepaalde bij [artikel 99, onderdeel h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel99
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '101'
        hoofdstuk: '17'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '99'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '102.2'
    text: |-
      De vermindering van het inbouwbedrag bedoeld in het vorige lid gaat in met de dag waarop de in dat lid bedoelde
      omstandigheid is opgetreden, met dien verstande dat deze niet vroeger ingaat dan een jaar voor de eerste dag van de
      maand waarin het desbetreffende verzoek werd ingediend.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel102
  - number: '102.3'
    text: |-
      Bij toepassing van het eerste lid wordt in geval op meer dan een pensioen recht bestaat, het bedrag van de in dat
      lid bedoelde vermindering op de inbouwbedragen in mindering gebracht naar verhouding van evenbedoelde bedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel102
  - number: '102.4'
    text: |-
      Indien de som van het inbouwbedrag en de vermindering van het andere pensioen, ook na toepassing van de overige
      bepalingen van dit artikel, een bedrag gelijk aan 80 percent van het algemeen pensioen overschrijdt, wordt van deze
      overschrijding een deel in mindering gebracht op het inbouwbedrag, en wel in de verhouding waarin de diensttijd
      waarnaar het pensioen, waarop vorenbedoeld inbouwbedrag betrekking heeft, is of wordt geacht te zijn berekend,
      staat tot het totaal van de diensttijden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel102
  - number: '102.5'
    text: |-
      Dit artikel is van overeenkomstige toepassing, indien een vermindering plaats vindt van enig ander pensioen dan
      bedoeld in [artikel 101, vijfde lid][ref1], toegekend aan de echtgenoot van belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel101
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '101'
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '103'
    text: |-
      Indien een algemeen pensioen wordt toegekend of herzien over een tijdvak waarover reeds pensioen werd betaald
      en dientengevolge te veel pensioen is betaald, kan de Sociale verzekeringsbank het te veel betaalde pensioen ten
      behoeve van het lichaam te welks laste het pensioen komt, inhouden op het algemeen pensioen, voor zover betrekking
      hebbende op evengenoemd tijdvak.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel103
  - number: '104'
    text: |-
      De bepalingen van dit hoofdstuk blijven buiten toepassing ten aanzien van degenen die op grond van gemoedsbezwaren
      hun recht op algemeen pensioen niet geldend maken, met dien verstande dat zij zoveel mogelijk overeenkomstige
      toepassing vinden met betrekking tot diegenen van evenbedoelden, die recht hebben op een uitkering als bedoeld in
      [artikel 48 van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel48
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '48'
  - number: '105.1'
    text: |-
      Een pensioen op grond van de [tweede][ref1] of de [derde afdeling][ref2] van deze wet, daaronder niet begrepen de
      inbouw- en franchisebedragen, wordt telkens aangepast overeenkomstig een verhoging met de consumentenprijsindex van
      een pensioen van een gepensioneerde overheidswerknemer in de zin van de [Wet privatisering ABP][ref3] die werkzaam
      is geweest bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
      [ref3]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0007791
  - number: '105.2'
    text: |-
      Indien aan een gepensioneerde overheidswerknemer, als bedoeld in het eerste lid, een eenmalige uitkering wordt
      toegekend, wordt aan degene die recht heeft op een pensioen, als bedoeld in dat lid, overeenkomstig een eenmalige
      uitkering toegekend.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel105
  - number: '105.3'
    text: |-
      Onze Minister kan regels stellen voor de toepassing van het eerste en het tweede lid. Deze regels werken zonodig
      terug tot en met de datum waarop een pensioenaanpassing is ingegaan of recht is ontstaan op een eenmalige
      uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel105
  - number: '106.1'
    text: |-
      Op de bezoldiging van de minister en op de schadeloosstelling van het lid van de Tweede Kamer
      der Staten-Generaal, met inbegrip van de eventuele verhoging als fractievoorzitter, bedoeld in
      [artikel 12, eerste lid, van de Wet schadeloosstelling leden Tweede Kamer][ref1], en met inbegrip van de eventuele
      toelage als voorzitter of ondervoorzitter, bedoeld in [artikel 11, eerste en tweede lid, van genoemde wet][ref2]
      worden, volgens bij of krachtens algemene maatregel van bestuur te stellen regels, bedragen ingehouden
      overeenkomstig de inhouding van bedragen op de bezoldiging van degene die behoort tot het overheidspersoneel, ter
      zake van aanspraken bij werkloosheid, ziekte, arbeidsongeschiktheid, ouderdom en overlijden. [Artikel 13d][ref3] is
      van overeenkomstige toepassing op de inhouding op de bezoldiging en de schadeloosstelling ter zake van aanspraken
      op ouderdom en overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 13d
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '106.2'
    text: |-
      Op de uitkering van de gewezen minister of het gewezen kamerlid worden, volgens bij of krachtens algemene
      maatregel van bestuur te stellen regelen, bedragen ingehouden overeenkomstig de inhouding van bedragen, terzake van
      aanspraken als bedoeld in het eerste lid, op een werkloosheids- of arbeidsongeschiktheidsuitkering op grond van een
      voor overheidspersoneel getroffen regeling.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel106
  - number: '106.3'
    text: |-
      Geen inhouding van bedragen ter zake van aanspraken bij ouderdom en overlijden vindt plaats voor zover tijd niet
      meetelt als pensioendiensttijd en op uitkeringen bedoeld in de [artikelen 8a][ref1] en [53a][ref2], alsmede op een
      uitkering gedurende de tijd dat de betrokkene voor 55 procent of meer algemeen invalide is.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: '107.1'
    text: |-
      Op aanvraag van een gewezen minister of een gewezen kamerlid draagt het Rijk de waarde van de door de aanvrager
      krachtens de tweede respectievelijk derde afdeling van deze wet verkregen pensioenaanspraken over, overeenkomstig
      de bepalingen in de [Pensioenwet][ref1] inzake waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '107.2'
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: '107.3'
    text: |-
      De waarde van de pensioenaanspraken die zijn verkregen uit hoofde van een recht op uitkering ter zake van ontslag
      of aftreden, wordt gerekend tot de waarde van de pensioenaanspraken, bedoeld in het eerste lid. Voor zover met de
      waarde van de pensioenaanspraken uit hoofde van het recht op uitkering bij de waardeoverdracht geen rekening is
      gehouden, wordt deze waarde na afloop van het recht op uitkering overgedragen, op dezelfde wijze als is bepaald in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel107
  - number: '107.4'
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt het Rijk ter uitvoering van dit artikel beschouwd als een
      overdragende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '107.5'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een minister of een kamerlid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel107
  - number: '108.1'
    text: |-
      Op aanvraag van een minister of een kamerlid is het Rijk verplicht om de waarde van door betrokkene opgebouwde
      pensioenaanspraken aan te wenden ter verwerving van pensioenaanspraken op grond van de tweede respectievelijk derde
      afdeling van deze wet. Deze waardeoverdracht geschiedt overeenkomstig de voorwaarden die in de [Pensioenwet][ref1]
      aan een ontvangende pensioenuitvoerder worden gesteld met betrekking tot de waardeoverdracht van opgebouwde
      pensioenaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '108.2'
    text: |-
      De overgedragen pensioenaanspraken worden beschouwd als aanspraken krachtens de [tweede][ref1], respectievelijk
      [derde afdeling][ref2] van deze wet en behandeld als een geheel met de aanspraken die de minister of het kamerlid
      verkrijgt krachtens de [tweede][ref3] respectievelijk [derde afdeling][ref4] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
      [ref3]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
      [ref4]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0002691
        afdeling: Derde
  - number: '108.3'
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: '108.4'
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt het Rijk ter uitvoering van dit artikel beschouwd als een
      ontvangende pensioenuitvoerder in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '108.5'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een minister of een kamerlid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel108
  - number: '109.1'
    text: Onze Minister beslist over de toekenning van pensioen op aanvraag door of vanwege de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel109
  - number: '109.2'
    text: Onze Minister is bevoegd een pensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel109
  - number: '109.3'
    text: Onze Minister is voorts bevoegd een voorschot op een pensioen te verlenen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel109
  - number: '110'
    text: |-
      In een beschikking tot toekenning van pensioen worden de voor het pensioen medetellende diensttijd alsmede het
      bedrag waarover het pensioen wordt berekend vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel110
  - number: '111'
    text: De stukken die Onze Minister nodig acht voor de toepassing van deze paragraaf zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel111
  - number: '115.1'
    text: |-
      Elk pensioen eindigt met het einde van de maand waarin de rechthebbende is overleden. In geval van vermissing van
      de rechthebbende eindigt het pensioen met een door Onze Minister te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel115
  - number: '115.2'
    text: |-
      Het tijdelijk pensioen eindigt wanneer de vermiste in leven blijkt te zijn, met een door Onze Minister te bepalen
      dag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel115
  - number: '115.3'
    text: |-
      Een pensioen waarop het recht krachtens [artikel 29][ref1] vervallen is verklaard, eindigt met het einde van de
      maand waarin de beslissing inzake het vervallen verklaren is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel29
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '29'
        hoofdstuk: '6'
        afdeling: Tweede
  - number: '115.4'
    text: 'Het wezenpensioen voorts eindigt op de laatste dag van de maand waarin de wees:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel115
  - number: 115.4.a
    text: vijfentwintig jaar is geworden of betrokken is bij een partnerschap; of
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel115
  - number: 115.4.b
    text: wettig kind is geworden van een ander dan degene aan wiens overlijden het recht op wezenpensioen wordt ontleend.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel115
  - number: '116.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van een gepensioneerd minister of gepensioneerd kamerlid wordt aan diens
      partner, van wie hij niet duurzaam gescheiden leefde, een uitkering toegekend ten bedrage van het pensioen van die
      minister of dat kamerlid over een tijdvak van twee maanden. Bij ontstentenis van een partner van wie de overledene
      niet duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve van wezen die aan het overlijden van de
      gepensioneerde op grond van deze wet recht op wezenpensioen ontlenen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel116
  - number: '116.2'
    text: |-
      Indien de overleden gepensioneerde geen betrekkingen als bedoeld in het vorige lid nalaat, kan het daarbedoelde
      bedrag door Onze Minister geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte
      en van de lijkbezorging, indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel116
  - number: '116.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder pensioen verstaan het bedrag waarop de overledene recht had,
      eventueel na toepassing van [hoofdstuk 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: '117.1'
    text: |-
      Indien meer pensioen is betaald dan overeenstemt met [artikel 115][ref1], wordt het te veel betaalde teruggevorderd
      voor zover geen verrekening daarvan kan plaatsvinden met een uitkering krachtens [artikel 116][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel116
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '115'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '116'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '117.2'
    text: |-
      Indien een vermiste in leven blijkt te zijn, kan hetgeen aan tijdelijk pensioen en aan uitkering, bedoeld in
      [artikel 116][ref1], is betaald worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel116
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '116'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '118.1'
    text: Onze Minister draagt zorg voor de betaling van de pensioenen. De betaling geschiedt in maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel118
  - number: '118.2'
    text: |-
      Wij geven bij algemene maatregel van bestuur voorschriften omtrent wijze en voorwaarden van de betaling. Daarbij
      kunnen Wij tevens regelen stellen met betrekking tot de betaling van bepaalde pensioenen over tijdvakken van langer
      dan een maand.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel118
  - number: '119.1'
    text: |-
      Indien een gepensioneerde in een inrichting ter verpleging van geesteszieken of van zwakzinnigen is opgenomen of,
      niet opgenomen zijnde in een zodanige inrichting, op grond van geestelijke gestoordheid niet in staat is kwijting
      te verlenen voor de uitbetaling van pensioen, is Onze Minister bevoegd het pensioen uit te betalen aan een door hem
      aan te wijzen persoon of instelling. In andere door hem aan te wijzen bijzondere gevallen is Onze Minister eveneens
      bevoegd het pensioen in plaats van aan de gepensioneerde zonder diens machtiging uit te betalen aan een door hem
      aan te wijzen persoon of instelling.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel119
  - number: '119.2'
    text: |-
      Indien een gepensioneerde ingevolge het bepaalde bij of krachtens de [Wet langdurige zorg][ref1] een bijdrage
      verschuldigd is in de kosten van zorg, is Onze Minister bevoegd het pensioen tot ten hoogste het bedrag van die
      bijdrage in de plaats van aan de gepensioneerde zonder diens machtiging uit te betalen aan het Zorginstituut
      Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '119.3'
    text: |-
      Indien het bepaalde in het vorige lid toepassing vindt, heeft de in het eerste lid bedoelde bevoegdheid betrekking
      op het gedeelte van het pensioen, dat niet aan het in het tweede lid bedoelde orgaan wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel119
  - number: '120.1'
    text: |-
      Onze Minister betaalt de termijnen van een pensioen niet meer uit indien deze niet zijn ingevorderd binnen twee
      jaren na het einde van het tijdvak waarover zij zijn verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel120
  - number: '120.2'
    text: |-
      Indien naar het oordeel van Onze Minister de belanghebbende redelijkerwijs niet geacht kan worden in gebreke te
      zijn geweest vindt het vorige lid geen toepassing.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel120
  - number: '121'
    text: |-
      De besluiten ter uitvoering van deze wet, met uitzondering van de [Vijfde Afdeling][ref1], worden genomen door
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
  - number: '122.1'
    text: 'Onze Minister herziet een door hem genomen beslissing, indien:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel122
  - number: 122.1.a
    text: aan die beslissing een feitelijke onjuistheid ten grondslag ligt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel122
  - number: 122.1.b
    text: na die beslissing blijkt dat aan die beslissing andere feiten ten grondslag dienen te worden gelegd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel122
  - number: '122.2'
    text: |-
      Indien na een beslissing van Onze Minister de feiten waarmede in die beslissing rekening is gehouden zodanig zijn
      gewijzigd, dat deze beslissing anders zou luiden als zij nog genomen zou moeten worden, wijzigt Onze Minister de
      beslissing, rekening houdend met de gewijzigde feiten.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel122
  - number: '122.3'
    text: |-
      Onze Minister herstelt een door hem genomen beslissing omtrent toekenning - inbegrepen aanpassing overeenkomstig
      [artikel 105][ref1] -, herziening, wijziging of betaalbaarstelling van een pensioen, indien daarin een onjuistheid,
      anders dan bedoeld in de vorige leden, voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: '122.4'
    text: |-
      Indien vijf jaren zijn verstreken na de dagtekening van een overeenkomstig de vorige leden voor herziening,
      wijziging of herstel vatbare beslissing, kan Onze Minister die leden buiten toepassing laten.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel122
  - number: '123.1'
    text: |-
      Een herzieningsbeslissing, een wijzigingsbeslissing en een herstelbeslissing vermelden de dag van de
      inwerkingtreding. Bij een herzieningsbeslissing is deze dag dezelfde als die waarop de herziene beslissing in
      werking is getreden, tenzij een latere dag wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel123
  - number: '123.2'
    text: |-
      Een herzieningsbeslissing leidt niet tot terugvordering of verrekening van reeds betaalde bedragen, tenzij de
      betrokkene redelijkerwijze had moeten begrijpen, dat hem te veel werd uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel123
  - number: '123.3'
    text: |-
      Een wijzigingsbeslissing leidt slechts tot terugvordering of verrekening van reeds betaalde bedragen indien de
      betrokkene, hoewel enige bepaling van deze wet hem daartoe verplicht of dit redelijkerwijs van hem mocht worden
      verwacht, heeft nagelaten aan Onze Minister mededeling te doen van een wijziging in de feiten.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel123
  - number: '123.4'
    text: |-
      In afwijking van de vorige twee leden en onverminderd [artikel 117][ref1] is Onze Minister bevoegd tot
      terugvordering of verrekening van te veel betaalde bedragen, indien de herzieningsbeslissing, onderscheidenlijk de
      wijzigingsbeslissing is genomen binnen vier maanden na de dagtekening van de herziene beslissing, onderscheidenlijk
      binnen vier maanden nadat Onze Minister bericht heeft ontvangen van wijziging in de feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel117
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '117'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '123.5'
    text: |-
      Herstel van een beslissing, als bedoeld in [artikel 122, derde lid][ref1], binnen vier maanden na de dagtekening
      van de herstelde beslissing, leidt tot terugvordering of verrekening van te veel betaalde pensioenbedragen. Herstel
      van een beslissing, als bedoeld in de vorige volzin, na de daargenoemde termijn, leidt slechts tot terugvordering
      of verrekening van te veel betaalde pensioenbedragen, indien de betrokkene redelijkerwijze had moeten begrijpen,
      dat hem te veel werd uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel122
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '122'
        hoofdstuk: '18'
        paragraaf: '5'
        afdeling: Vierde
  - number: '130.1'
    text: |-
      Deze afdeling is van overeenkomstige toepassing op burgemeesters en wethouders, met dien verstande dat wordt
      gelezen voor:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.1.a
    text: 'lid van gedeputeerde staten: burgemeester of wethouder;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.1.b
    text: 'provincie: gemeente;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.1.c
    text: 'provinciale staten: de raad;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.1.d
    text: 'gedeputeerde staten: college van burgemeester en wethouders.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: '130.2'
    text: |-
      Deze afdeling is van overeenkomstige toepassing op voorzitters en leden van het dagelijks bestuur van een
      waterschap, met dien verstande dat wordt gelezen voor:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.2.a
    text: 'lid van gedeputeerde staten: lid van het dagelijks bestuur van een waterschap, waaronder de voorzitter;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.2.b
    text: 'provincie: waterschap;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.2.c
    text: 'provinciale staten: het algemeen bestuur van een waterschap;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.2.d
    text: 'gedeputeerde staten: het dagelijks bestuur van een waterschap.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: '130.3'
    text: |-
      Onder lid van gedeputeerde staten wordt voor de toepassing van deze afdeling en de daarop gebaseerde bepalingen
      verstaan: de commissaris van de Koning of de gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: '130.4'
    text: |-
      In afwijking van het eerste, tweede en derde lid, zijn de [hoofdstukken 22 tot en met 29][ref1] niet van toepassing
      op de commissaris van de Koning, de burgemeester alsmede op de voorzitter en de leden van het dagelijks bestuur
      van het waterschap waarvan de aan hun functie verbonden werkzaamheden een dagtaak vormen. Voor de toepassing van de
      hoofdstukken 22 tot en met 29 wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk22
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '22'
        afdeling: Vijfde
  - number: 130.4.a
    text: '*gewezen lid van gedeputeerde staten:* hij die uit hoofde van een ontslag uitzicht op pensioen heeft;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.4.b
    text: '*gepensioneerd lid van gedeputeerde staten:* hij die uit hoofde van een ontslag recht heeft op pensioen;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.4.c
    text: |-
      *bezoldiging:* bezoldiging inclusief vakantie-uitkering en de eindejaarsuitkering, waarop het gewezen of
      gepensioneerd lid van gedeputeerde staten op de dag voorafgaande aan de dag, waarop hij ophield lid van
      gedeputeerde staten te zijn, aanspraak had, tenzij uit de desbetreffende bepaling het tegendeel blijkt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130.4.d
    text: |-
      *deeltijdfactor:* een breuk waarvan de teller wordt gevormd door de genoten bezoldiging exclusief de vakantie-
      uitkering en de eindejaarsuitkering, en de noemer door het tot een jaarbedrag herleide bedrag waarvan die
      bezoldiging is afgeleid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130
  - number: 130a
    text: |-
      Deze afdeling is niet van toepassing op een gedeputeerde die is benoemd met toepassing van
      [artikel 44b van de Provinciewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel44b
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 44b
  - number: 130b.1
    text: |-
      Tenzij in de volgende leden anders is bepaald, is deze afdeling van overeenkomstige toepassing op de
      Rijksvertegenwoordiger, met dien verstande dat wordt gelezen voor:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
  - number: 130b.1.a
    text: 'lid van gedeputeerde staten: Rijksvertegenwoordiger;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
  - number: 130b.1.b
    text: 'provincie: Rijk;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
  - number: 130b.1.c
    text: 'provinciale staten: Onze Minister;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
  - number: 130b.1.d
    text: 'gedeputeerde staten: Onze Minister.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
  - number: 130b.2
    text: |-
      Voor zover het de Rijksvertegenwoordiger betreft, kunnen Wij in bijzondere gevallen, de Raad van State gehoord, in
      afwijking van [artikel 132, zesde lid][ref1], bepalen, dat de uitkering wordt voortgezet voor een, met inachtneming
      van [artikel 136][ref2] vast te stellen termijn, die op dezelfde wijze kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel136
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '136'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 130b.3
    text: |-
      Voor de toepassing van [artikel 137a][ref1] wordt gelezen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel137a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 137a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 130b.3.a
    text: |-
      [artikel 76, eerste lid, van de Provinciewet][ref1]:
      [artikel 200, eerste lid, Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel200
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '200'
  - number: 130b.3.b
    text: 'commissaris van de Koning: Rijksvertegenwoordiger.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
  - number: 130b.4
    text: |-
      In afwijking van [artikel 152, tweede lid][ref1], kunnen Wij, de Raad van State gehoord, een door of als gevolg van
      de toepassing van artikel 152, eerste lid, vervallen recht op pensioen herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel152
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '152'
        hoofdstuk: '24'
        afdeling: Vijfde
  - number: '131.1'
    text: |-
      Een lid van gedeputeerde staten heeft met ingang van de dag van zijn ontslag recht op een uitkering op de voet
      van de volgende artikelen, indien hij nog niet de pensioengerechtigde leeftijd heeft bereikt en hij niet zonder
      onderbreking weer als lid van gedeputeerde staten optreedt in een betrekking van ten minste gelijke omvang.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
  - number: '131.2'
    text: |-
      De uitkering of, na verrekening ingevolge [artikel 134][ref1], het restant van de uitkering wordt niet uitbetaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 131.2.a
    text: |-
      voor zover en voor de periode dat de belanghebbende daarom met het oog op de toepassing van
      [artikel 132a, vierde lid, onder c][ref1], verzoekt;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 131.2.b
    text: voor de periode dat aan de belanghebbende rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
  - number: 131.2.c
    text: |-
      voor de periode dat de belanghebbende zicht onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
  - number: 131.2.d
    text: |-
      voor de periode dat de belanghebbende buiten Nederland woont of verblijf houdt anders dan wegens vakantie, met dien
      verstande dat [artikel 19, tiende, dertiende en veertiende lid, van de Werkloosheidswet][ref1] alsmede de regels
      die op grond van genoemd tiende lid gesteld zijn, van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
  - number: 131.2.e
    text: |-
      voor de periode dat de belanghebbende vakantie geniet buiten de bij algemene maatregel van bestuur gestelde
      periode.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
  - number: '131.3'
    text: |-
      Het niet uitbetalen van de uitkering op grond van het tweede lid, is niet van invloed op de met toepassing van
      [artikel 132, eerste of vierde lid][ref1], berekende duur waarvoor de uitkering is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '132.1'
    text: |-
      De uitkering wordt toegekend voor een duur gelijk aan de tijd waarin de belanghebbende lid van gedeputeerde staten
      is geweest, maar tenminste voor de duur van twee jaren en ten hoogste voor de duur van drie jaren en twee maanden.
      Indien de belanghebbende met een of meer onderbrekingen lid van gedeputeerde staten is geweest, wordt in aanmerking
      genomen de tijd gedurende welke hij lid van gedeputeerde staten is geweest in een tijdvak, laatstelijk voordat hij
      ophield lid van gedeputeerde staten te zijn, waarin zijn lidmaatschap van gedeputeerde staten voor ten hoogste een
      zesde deel van dat tijdvak is onderbroken.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132
  - number: '132.2'
    text: |-
      Als de belanghebbende ten tijde van zijn aftreden vijf jaren of minder verwijderd is van de voor hem van toepassing
      zijnde pensioengerechtigde leeftijd en hij in de daaraan voorafgaande periode van twaalf jaren ten minste tien
      jaren lid van gedeputeerde staten is geweest, wordt de uitkering voortgezet tot de pensioengerechtigde leeftijd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132
  - number: '132.3'
    text: |-
      Voor de berekening van de uitkeringsduur, bedoeld in het eerste lid, en de tien jaren, bedoeld in het tweede lid,
      wordt met tijd waarin de belanghebbende lid van gedeputeerde staten is geweest gelijkgesteld de tijd waarin hij
      een functie heeft bekleed als genoemd in [artikel 2, tweede lid, onder a, b en d][ref1]. Indien sprake is van
      gelijkgestelde tijd als bedoeld in de vorige zin wordt met betrekking tot die tijd op dezelfde wijze als in de
      tweede zin van het eerste lid rekening gehouden met onderbrekingen in de uitoefening van deze functies.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '132.4'
    text: |-
      In afwijking van het eerste lid wordt de uitkering toegekend voor de duur van zes maanden, indien de belanghebbende
      korter dan drie maanden lid van gedeputeerde staten is geweest.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132
  - number: '132.5'
    text: |-
      In geval van tussentijds vervallen van de uitkering krachtens [artikel 136, tweede lid, onder b][ref1], wordt
      de volgende uitkering toegekend ten minste tot het tijdstip, waarop eerstgenoemde uitkering, indien zij niet was
      vervallen, zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel136
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '136'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132a.1
    text: |-
      De belanghebbende aan wie een uitkering als bedoeld in [artikel 131][ref1] geheel of gedeeltelijk wordt uitbetaald
      en die niet binnen twaalf maanden de pensioengerechtigde leeftijd bereikt, is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel131
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '131'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132a.1.a
    text: in voldoende mate te trachten passende arbeid te vinden;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.1.b
    text: aangeboden passende arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.1.c
    text: mee te werken aan activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.2
    text: 'De belanghebbende voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.2.a
    text: door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.2.b
    text: door eigen toedoen passende arbeid opgeeft;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.2.c
    text: eisen stelt die het aanvaarden of verkrijgen van passende arbeid belemmeren.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.3
    text: |-
      [Artikel 7a, derde lid][ref1], is van overeenkomstige toepassing op een lid van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 132a.4
    text: 'Dit artikel is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.4.a
    text: |-
      op de belanghebbende die inkomsten geniet ten bedrage van 100% van de laatstelijk genoten bezoldiging,
      bedoeld in [artikel 133, tweede lid][ref1], of op de belanghebbende die een ambt heeft aanvaard als bedoeld in
      [artikel 2, tweede lid][ref2], en daaruit inkomsten geniet ten bedrage van 70% of meer van de laatstelijk genoten
      bezoldiging, bedoeld in artikel 133, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 132a.4.b
    text: |-
      op de belanghebbende die recht heeft op een voortgezette uitkering ingevolge [artikel 133a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132a.4.c
    text: voor de periode dat de belanghebbende die verzoekt af te zien van de uitbetaling van de gehele uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132a.5
    text: Dit artikel is niet van toepassing gedurende de eerste drie maanden na het aftreden van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132a
  - number: 132b.1
    text: |-
      De belanghebbende is verplicht door een re-integratiebureau een plan op te laten stellen voor het gericht
      zoeken naar en verwerven van passende arbeid, waarin de activiteiten zijn opgenomen die noodzakelijk zijn om te
      voldoen aan de verplichting, bedoeld in [artikel 132a, eerste lid, onderdeel a][ref1], en het plan, nadat het is
      goedgekeurd door gedeputeerde staten, onder begeleiding van een re-integratiebureau uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132b.2
    text: |-
      Behoudens de gevallen, bedoeld in [artikel 132a, vierde lid][ref1], heeft de belanghebbende vanaf het moment van
      zijn ontslag met in achtneming van de regels, bedoeld in het derde lid, recht op vergoeding van daadwerkelijk
      gemaakte kosten van het plan, bedoeld in het eerste lid, en van planmatige begeleiding en ondersteuning bij het
      gericht zoeken naar en verwerven van passende arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132b.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
  - number: 132b.3.a
    text: de onderdelen van het plan, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
  - number: 132b.3.b
    text: een tegemoetkoming voor de in het plan opgenomen activiteiten anders dan begeleiding en ondersteuning;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
  - number: 132b.3.c
    text: de eisen die worden gesteld aan het re-integratiebureau , bedoeld in het eerste en tweede lid;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
  - number: 132b.3.d
    text: de voor vergoeding in aanmerking te nemen kosten, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
  - number: 132b.3.e
    text: de bedrag dat ten hoogste op grond van het tweede lid kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
  - number: 132b.4
    text: |-
      In de regels, bedoeld in het derde lid, kan worden gedifferentieerd naar gelang de afstand die de belanghebbende
      heeft tot de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132b
  - number: 132c.1
    text: |-
      Indien de belanghebbende een bij of krachtens [artikel 132a][ref1] geregelde verplichting niet of niet behoorlijk
      is nagekomen, besluiten gedeputeerde staten tot gehele of gedeeltelijke inhouding van de uitkering. Gedeputeerde
      staten zijn bevoegd tot verrekening van de inhouding van de uitkering met betalingen aan belanghebbende op grond
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 132c.2
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel132c
  - number: '133.1'
    text: |-
      De uitkering bedraagt gedurende het eerste jaar 80% en vervolgens 70% van de laatstelijk als lid van gedeputeerde
      staten genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133
  - number: '133.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder laatstelijk genoten bezoldiging verstaan de bezoldiging, waarop de
      belanghebbende op de dag voorafgaande aan de dag, waarop hij heeft opgehouden lid van gedeputeerde staten te zijn,
      aanspraak had of bij waarneming van zijn ambt zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133
  - number: '133.3'
    text: |-
      Indien voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een wijziging van het loon is
      overeengekomen, wordt de in het eerste lid bedoelde laatstelijk genoten bezoldiging voor de toepassing van dat lid
      met ingang van het tijdstip van ingang van die wijziging door Onze Minister overeenkomstig de wijziging aangepast.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133
  - number: 133a.1
    text: |-
      Indien de belanghebbende op de dag waarop de duur van de uitkering eindigt geheel of gedeeltelijk algemeen invalide
      is, wordt, met inachtneming van [artikel 136][ref1], de uitkering voor de duur van de invaliditeit voortgezet op de
      voet van [artikel 133b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel133b
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '136'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 133b
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133a.2
    text: |-
      Algemeen invalide, geheel of gedeeltelijk, in de zin van deze wet is hij die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekten of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen. Onder de eerstgenoemde
      arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden
      in staat is. Onder deze arbeid wordt niet begrepen arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: 133a.3
    text: |-
      Bij de vaststelling van de mate van algemene invaliditeit wordt buiten beschouwing gelaten of de betrokkene de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133a
  - number: 133a.4
    text: |-
      Indien de betrokkene zonder redelijke grond weigert deel te nemen aan een voor hem gewenste opleiding of scholing
      of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, wordt er bij de vaststelling van de mate
      van algemene invaliditeit van uitgegaan dat die opleiding of scholing is afgerond.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133a
  - number: 133a.5
    text: Bij een algemene invaliditeit van minder dan 25 percent wordt de uitkering niet voortgezet.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133a
  - number: 133b.1
    text: |-
      De voortzetting van de uitkering vindt plaats als aangegeven in het tweede en derde lid en vervolgens als
      aangegeven in het vierde en het vijfde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.2
    text: |-
      De uitkering bedraagt gedurende een periode als aangegeven in het derde lid 70% van de laatstelijk als lid van
      gedeputeerde staten genoten bezoldiging, bedoeld in [artikel 133][ref1], bij een algemene invaliditeit van 80%
      of meer, 60% van die bezoldiging bij een algemene invaliditeit van 55% tot 80% en 40% van die bezoldiging bij een
      algemene invaliditeit van 25% tot 55%.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133b.3
    text: |-
      De in het tweede lid bedoelde periode is ten hoogste voor de belanghebbende die op het tijdstip van voortzetting
      van de uitkering:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.3.58
    text: 'jaar of ouder is: zes jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.3.53
    text: 'jaar of ouder is: drie jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.3.48
    text: 'jaar of ouder is: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.3.43
    text: 'jaar of ouder is: anderhalf jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.3.38
    text: 'jaar of ouder is: een jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.3.33
    text: 'jaar of ouder is: een half jaar, en'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.4
    text: |-
      De uitkering bedraagt na afloop van de volgens het derde lid bepaalde periode een percentage, volgens het tweede
      lid, van een bedrag gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen de laatstelijk
      als lid van gedeputeerde staten genoten bezoldiging, bedoeld in [artikel 133][ref1], en het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133b.5
    text: |-
      Voor de berekening van het in het vierde lid bedoelde bedrag geldt een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de betrokkene op het tijdstip van voortzetting van de uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.6
    text: |-
      Het minimumloon, bedoeld in het vierde lid, is het tot een jaarbedrag herleide minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1] of, indien het een betrokkene jonger dan 23 jaar betreft, het tot een
      jaarbedrag herleide voor zijn leeftijd geldende minimumloon per maand, bedoeld in [artikel 7, derde lid][ref2],
      en [artikel 8, derde lid, van de genoemde wet][ref3], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 133b.7
    text: |-
      De belanghebbende heeft recht op een aanvulling van de uitkering, indien die uitkering minder bedraagt dan
      het volgens het tweede lid vastgestelde percentage van de laatstelijk als lid van gedeputeerde staten genoten
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.8
    text: |-
      De aanvulling is gelijk aan het bedrag dat nodig is om de uitkering te verhogen tot het in het zevende lid bedoelde
      percentage van de laatstelijk als lid van gedeputeerde staten genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.9
    text: |-
      In afwijking van het achtste lid is de aanvulling gelijk aan het bedrag dat nodig is om de uitkering te verhogen
      tot het in het tiende lid aangegeven percentage van de laatstelijk als lid van gedeputeerde staten genoten
      bezoldiging, indien de belanghebbende de keuze heeft gemaakt voor een verlaging van de inhouding ingevolge
      [artikel 160, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel160
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '160'
        hoofdstuk: '28'
        afdeling: Vijfde
  - number: 133b.10
    text: |-
      Het in het negende lid bedoelde percentage bedraagt bij een algemene invaliditeit van 80% of meer 65%, bij een
      algemene invaliditeit van 55% tot 80%: 56% en bij een algemene invaliditeit van 25% tot 55%: 37%.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
  - number: 133b.11
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 160, eerste lid][ref1], worden regels gesteld met
      betrekking tot de verlaging, bedoeld in het negende lid. Regels op grond van [artikel 8b, elfde lid][ref2], zijn
      van overeenkomstige toepassing op de in het negende lid bedoelde keuze.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '160'
        hoofdstuk: '28'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8b
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 133b.12
    text: |-
      Indien de wegens algemene invaliditeit voortgezette uitkering te zamen met inkomsten, bedoeld in
      [artikel 134][ref1], minder bedraagt dan het minimumloon wordt de uitkering verhoogd tot het minimumloon. De
      verhoging bedraagt niet meer dan het verschil tussen de uitkering en het bedrag waarvan deze is afgeleid en tevens
      niet meer dan 30% van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133c.1
    text: |-
      De voortzetting van de uitkering, bedoeld in [artikel 133a][ref1], geschiedt op aanvraag van de belanghebbende en
      voor termijnen van niet langer dan drie jaar, onverminderd het in deze wet bepaalde over herziening of intrekking
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133c.2
    text: |-
      Gedeputeerde staten stellen de belanghebbende uiterlijk vier maanden voor het verstrijken van de in het eerste lid
      bedoelde termijn schriftelijk in kennis van de mogelijkheid tot het doen van een aanvraag tot voortzetting van de
      uitkering na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133c
  - number: 133c.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt door de belanghebbende uiterlijk drie maanden voor het
      verstrijken van de in het eerste lid bedoelde termijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133c
  - number: 133c.4
    text: |-
      Indien gedeputeerde staten niet tijdig beslissen op een tijdig ingediende aanvraag als bedoeld in het derde lid,
      wordt de uitkering voortgezet tot het tijdstip van de beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133c
  - number: 133c.5
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt geacht tijdig te zijn ingediend indien gedeputeerde staten de
      kennisgeving, bedoeld in het tweede lid, niet hebben gedaan dan wel indien bij een latere kennisgeving als bedoeld
      in het tweede lid de aanvraag wordt ingediend binnen een maand nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133c
  - number: 133c.6
    text: |-
      Indien de uitkering na afloop van de in het eerste lid bedoelde termijn wordt voortgezet, wordt de uitkering
      berekend op de wijze die van toepassing zou zijn geweest indien die termijn niet zou zijn afgelopen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133c
  - number: 133c.7
    text: |-
      Bepalingen op grond van [artikel 8c, zevende lid][ref1], zijn van overeenkomstige toepassing op in het eerste lid
      bedoelde belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8c
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 133d.1
    text: |-
      Binnen een jaar na het tijdstip waarop de uitkering voor de eerste maal met toepassing van [artikel 133a][ref1] is
      voortgezet, doen gedeputeerde staten een onderzoek instellen ten einde te doen bezien of er als gevolg van gronden
      die invloed hebben op de mate van algemene invaliditeit redenen aanwezig zijn voor herziening of intrekking van
      de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133d.2
    text: |-
      Bepalingen op grond van [artikel 8d, tweede lid][ref1], zijn van overeenkomstige toepassing op het in het eerste
      lid bedoelde onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8d
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8d
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 133d.3
    text: |-
      Gedeputeerde staten wijzigen ambtshalve of op aanvraag van de belanghebbende het bedrag van de uitkering bij
      wijziging van de mate van algemene invaliditeit.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
  - number: 133d.4
    text: 'Een wijziging van het bedrag van de uitkering gaat in:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
  - number: 133d.4.a
    text: |-
      indien daartoe een aanvraag is ingediend, met ingang van de eerste dag van de maand volgende op die waarin de
      aanvraag is ingekomen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
  - number: 133d.4.b
    text: |-
      indien de wijziging ambtshalve plaatsvindt, met ingang van de eerste dag van de maand volgende op die waarin de
      beslissing tot wijziging is genomen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
  - number: 133d.5
    text: |-
      De toepassing van [artikel 133a][ref1] wordt ten aanzien van een belanghebbende gestaakt indien en zolang hij niet
      voldoet aan een uitnodiging van gedeputeerde staten zich te onderwerpen aan een onderzoek door een of meer door hen
      aangewezen geneeskundigen ter beantwoording van de vraag, of er nog sprake is van algemene invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133d.6
    text: |-
      Indien degene die recht heeft op wegens algemene invaliditeit voortgezette uitkering inkomsten uit of in verband
      met arbeid geniet, zijn gedeputeerde staten bevoegd, zolang niet vaststaat of deze arbeid als arbeid, bedoeld in
      [artikel 133a, tweede lid][ref1], kan worden aangemerkt, niet tot herziening of intrekking van de uitkering over te
      gaan. De toepassing van de eerste volzin vindt ten hoogste plaats over een aaneengesloten periode van drie jaren,
      aanvangende op de eerste dag waarover de inkomsten uit of in verband met arbeid bedoeld in de eerste volzin worden
      genoten. Deze periode wordt geacht niet te zijn onderbroken indien korter dan een maand geen inkomsten uit of in
      verband worden genoten. Na afloop van de in de tweede volzin genoemde periode wordt de in de eerste volzin bedoelde
      arbeid aangemerkt als arbeid, bedoeld in [artikel 133a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133e.1
    text: |-
      Op verzoek van een lid van gedeputeerde staten doen provinciale staten een onderzoek instellen, door een of meer
      door hen aangewezen geneeskundigen, ter beantwoording van de vraag of het lid van gedeputeerde staten dat het
      verzoek deed algemeen invalide is als bedoeld in [artikel 133][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 133e.2
    text: Provinciale staten brengen de uitkomst van een onderzoek als bedoeld in het eerste lid ter kennis van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel133e
  - number: '134.1'
    text: |-
      De inkomsten die de belanghebbende geniet, worden bepaald overeenkomstig de regels van de
      [Wet inkomstenbelasting 2001][ref1] en worden met de uitkering verrekend over de maand waarop deze inkomsten
      betrekking hebben of geacht kunnen worden betrekking te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '134.2'
    text: |-
      Voor de toepassing van het eerste lid worden onder inkomsten verstaan het gezamenlijk bedrag dat de belanghebbende
      wegens het verrichten van activiteiten, ter hand genomen met ingang van of na de dag waarop hij heeft opgehouden
      lid van gedeputeerde staten te zijn, geniet als
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
  - number: 134.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 134.2.b
    text: belastbaar loon uit of in verband met arbeid en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
  - number: 134.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '134.3'
    text: 'Voor de toepassing van de vorige leden worden mede als inkomsten aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
  - number: 134.3.a
    text: |-
      de inkomsten wegens in het tweede lid bedoelde activiteiten ter hand genomen door de belanghebbende binnen één
      jaar, onmiddellijk voorafgaand aan het tijdstip van aftreden;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
  - number: 134.3.b
    text: |-
      de inkomsten die worden genoten uit een betrekking waarin hij gedurende zijn zittingstijd als lid van gedeputeerde
      staten op non-activiteit was gesteld;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
  - number: 134.3.c
    text: de vaste vergoeding die wordt genoten als lid van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
  - number: '134.4'
    text: |-
      Indien de belanghebbende op of na de dag bedoeld in het tweede lid inkomsten of hogere inkomsten, anders dan ten
      gevolge van algemene loonsverhogingen, verkrijgt uit in het tweede lid bedoelde activiteiten ter hand genomen voor
      de dag van aftreden, anders dan bedoeld in het derde lid, is ten aanzien van die inkomsten of hogere inkomsten het
      bepaalde in het eerste lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
  - number: '134.5'
    text: |-
      De in het eerste lid bedoelde verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag
      waarmede de uitkering, vermeerderd met die inkomsten, de laatstelijk genoten bezoldiging, waarvan de
      uitkering is afgeleid, overschrijdt. Bij de verrekening wordt voor de hoogte van de uitkering de op grond van
      [artikel 132c, eerste lid][ref1], opgelegde inhouding buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132c
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '134.6'
    text: |-
      Onder inkomsten bedoeld in de voorgaande leden wordt niet verstaan kinderbijslag alsmede de compensatie voor de
      premie ingevolge de [Algemene Ouderdomswet][ref1] en de [Algemene nabestaandenwet][ref2], welke in die inkomsten is
      of geacht kan worden te zijn begrepen. De vorige volzin is wat betreft de premiecompensatie slechts van toepassing
      voor zover de daar bedoelde inkomsten betrekking hebben of kunnen worden geacht betrekking te hebben op een tijdvak
      gelegen voor 1 juni 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '134.7'
    text: |-
      Een ministeriële regeling op grond van [artikel 9, zesde lid][ref1], geldt mede voor de toepassing van dit artikel,
      ten aanzien van de voortgezette uitkering bedoeld in [artikel 132, zesde lid][ref2], en in [artikel 133a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 134a.1
    text: |-
      De belanghebbende is verplicht van het ter hand nemen van enige activiteiten als bedoeld in
      [artikel 134, tweede lid][ref1], terstond mededeling te doen aan gedeputeerde staten onder opgave, voor zover
      mogelijk, van de inkomsten die hij uit die activiteiten zal trekken. Zijn de inkomsten niet vooraf op te geven
      dan doet hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave van de inkomsten, die hij sinds
      het ter hand nemen van de activiteiten of sinds de vorige opgave heeft genoten. Voorschriften, bedoeld in
      [artikel 9a, eerste lid, derde volzin][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 9a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 134a.2
    text: |-
      Brengt de aard van de activiteiten of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast
      van een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het eind van de evenbedoelde termijn. Ten
      aanzien van deze verrekening is [artikel 134][ref1] van toepassing, met dien verstande dat zij geschiedt over de in
      de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '134'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 134a.3
    text: |-
      Gedeputeerde staten kunnen bij de vaststelling van het bedrag van de vermindering van de opgave van de
      belanghebbende afwijken.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134a
  - number: 134a.4
    text: |-
      De belanghebbende aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin toe
      te stemmen dat allen, die daarvoor naar het oordeel van gedeputeerde staten in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit hoofdstuk noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel134a
  - number: '135.1'
    text: De uitkering, berekend over een maand, wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel135
  - number: '135.2'
    text: |-
      De uitkering wordt niet uitbetaald zolang de belanghebbende niet of niet op de voorgeschreven wijze voldoet aan
      zijn verplichtingen op grond van [artikel 134a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 134a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '136.1'
    text: De uitkering eindigt met ingang van de dag volgende op die, waarop de belanghebbende is overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel136
  - number: '136.2'
    text: 'De uitkering vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel136
  - number: 136.2.a
    text: met ingang van de dag waarop de belanghebbende de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel136
  - number: 136.2.b
    text: |-
      met ingang van de dag waarop de belanghebbende opnieuw lid van gedeputeerde staten wordt in de provincie ten laste
      waarvan de uitkering wordt genoten, tenzij hij als zodanig een betrekking is gaan uitoefenen in een mindere omvang
      dan voor het aftreden waaraan hij het recht op uitkering ontleent.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel136
  - number: '136.3'
    text: |-
      De uitkering kan geheel of ten dele vervallen worden verklaard indien de belanghebbende herhaaldelijk niet of niet
      op de voorgeschreven wijze voldoet aan zijn verplichtingen op grond van [artikel 134a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel134a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 134a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '137.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de belanghebbende wordt aan de partner, van die de overledene niet
      duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan driemaal het bedrag van de uitkering, dat over de
      laatste volle maand aan de belanghebbende is uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel137
  - number: '137.2'
    text: |-
      Laat de overledene geen partner na, van wie de overledene niet duurzaam gescheiden leefde, dan geschiedt de
      uitkering van het in het eerste lid bedoelde bedrag ten behoeve van de minderjarige kinderen tot wie de overledene
      in familierechtelijke betrekking stond, of minderjarige kinderen waarover de overledene ten tijde van het
      overlijden de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud
      en de opvoeding van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het
      genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen, dan geschiedt de uitkering van het in het
      eerste lid bedoelde bedrag indien de overledene kostwinner was van ouders, meerderjarige kinderen, broeders of
      zusters, ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel137
  - number: '137.3'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het eerste en tweede lid na, dan wordt het aldaar bedoelde
      bedrag geheel of ten dele uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging,
      indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel137
  - number: 137a.1
    text: |-
      Dit hoofdstuk is van overeenkomstige toepassing op degene die krachtens
      [artikel 76, eerste lid, van de Provinciewet][ref1], dan wel krachtens
      [artikel 78, eerste lid, van de Gemeentewet][ref2] het ambt van commissaris van de Koning, respectievelijk het ambt
      van burgemeester gedurende meer dan dertig dagen zonder onderbreking heeft waargenomen. Voor degene die aftreedt
      als waarnemer is de duur van de uitkering, ten dele in afwijking van [artikel 132][ref3], steeds gelijk aan de
      duur van de waarneming. De uitkering bedraagt het volgens [artikel 133][ref4] toepasselijke percentage van de als
      waarnemer genoten vergoeding en wordt aangepast overeenkomstig het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel133
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel137a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref4
        bwb_id: BWBR0002691
        artikel: '133'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 137a.2
    text: |-
      In afwijking van [artikel 131][ref1] komt de uitkering die de provincie of de gemeente na ontheffing van de
      waarneming verschuldigd is op grond van het eerste lid ten laste van Hoofdstuk VII van de rijksbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel131
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel137a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '131'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 137b
    text: |-
      Bij eervol ontslag van een burgemeester wegens opheffing van de gemeente komt de uitkering ten laste van hoofdstuk
      VII van de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel137b
  - number: '138'
    text: |-
      Een persoon die lid van gedeputeerde staten is geweest, heeft met overeenkomstige toepassing van
      [hoofdstuk 4][ref1] en de [artikelen 39c tot en met 40c][ref2] recht op ouderdomspensioen, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel40
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel138
