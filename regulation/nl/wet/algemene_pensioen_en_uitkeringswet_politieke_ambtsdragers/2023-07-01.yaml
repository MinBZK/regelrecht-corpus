        afdeling: Vijfde
  - number: '159'
    text: |-
      Het bepaalde in [artikel 116][ref1] is ten aanzien van de in deze afdeling bedoelde pensioenen van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel116
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel159
