valid_from: '2023-07-01'
bwb_id: BWBR0002691
url: https://wetten.overheid.nl/BWBR0002691/2023-07-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regelingen tot toekenning van uitkering en van
    pensioen aan politieke ambtsdragers, zomede van pensioen aan hun nabestaanden, te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: - *Onze Minister:* Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *pensioengerechtigde leeftijd:* de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref1];
        - *pensioenrichtleeftijd:* de pensioenrichtleeftijd, bedoeld in
      [artikel 18a van de Wet op de loonbelasting 1964][ref2], zoals dat artikel luidde op de dag voorafgaand aan het
      tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref3
        bwb_id: BWBR0048328
  - number: '1.2'
    text: |-
      Voor zover de voor uitkering en pensioen in aanmerking komende tijd kalenderjaren of kalendermaanden omvat, wordt
      deze tijd uitgedrukt in jaren, onderscheidenlijk maanden voor uitkering en pensioen in aanmerking komende tijd. De
      overige tijd wordt uitgedrukt in gedeelten van jaren, onderscheidenlijk gedeelten van maanden, waarbij het jaar op
      12 maanden en de maand op 30 dagen wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder pensioen tevens begrepen de toeslagen
      die in deze wet als zodanig zijn aangeduid, tenzij uit de desbetreffende bepalingen het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel1
  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
  - number: 2.1.a
    text: |-
      aanmelding: aanmelding als bedoeld in [artikel 2a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2.1.b
    text: |-
      partner: de persoon die met een politieke ambtsdrager, gewezen politieke ambtsdrager of gepensioneerde een huwelijk
      of een geregistreerd partnerschap is aangegaan, dan wel de persoon, die is aangemeld op de wijze, bedoeld in
      [artikel 2a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2.1.c
    text: |-
      partnerschap: het huwelijk, het geregistreerd partnerschap of de relatie tussen de aanmelder en degene die als zijn
      partner is aangemeld op de wijze, bedoeld in [artikel 2a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2.1.d
    text: 'pensioengeldige tijd: de tijd waarover pensioenaanspraken zijn opgebouwd op grond van deze wet.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
  - number: '2.2'
    text: Onder politieke ambtsdrager wordt verstaan voor de toepassing van
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
  - number: 2.2.a
    text: |-
      de [tweede afdeling][ref1] van deze wet: minister;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingTweede
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Tweede
  - number: 2.2.b
    text: |-
      de [derde afdeling][ref1] van deze wet: lid van de Tweede Kamer der Staten-Generaal;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Derde
  - number: 2.2.c
    text: |-
      de [vierde afdeling][ref1] van deze wet: minister of lid van de Tweede Kamer der Staten-Generaal;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVierde
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vierde
  - number: 2.2.d
    text: |-
      de [vijfde afdeling][ref1] van deze wet: commissaris van de Koning, lid van gedeputeerde staten,
      burgemeester, wethouder, lid van het dagelijks bestuur van een deelgemeente in de zin van
      [hoofdstuk V, paragraaf 2, van de Gemeentewet][ref2], zoals deze paragraaf luidde op de dag voorafgaand aan
      de datum van de verkiezing van de gemeenteraden in 2014, voorzitter of lid van het dagelijks bestuur van een
      waterschap of de Rijksvertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0005416
        paragraaf: '2'
  - number: '2.3'
    text: |-
      Waar in deze wet betekenis toekomt aan het gegeven dat een belanghebbende gehuwd is, gehuwd is geweest of een
      huwelijk aangaat, wordt mede begrepen onder gehuwd: als partner geregistreerd, respectievelijk onder huwelijk:
      geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
  - number: '2.4'
    text: 'In deze wet en de daarop berustende bepalingen wordt onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
  - number: 2.4.a
    text: ouderdomspensioen mede verstaan eigen pensioen als bedoeld in deze wet, zoals deze luidde voor 1 juli 2022;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
  - number: 2.4.b
    text: partnerpensioen mede verstaan nabestaandenpensioen als bedoeld in deze wet, zoals deze luidde voor 1 juli 2022.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2
  - number: 2a.1
    text: |-
      De politieke ambtsdrager, bedoeld in [artikel 2, tweede lid, onder a en b][ref1], alsmede de Rijksvertegenwoordiger
      kan bij Onze Minister één man of vrouw aanmelden, indien hij en deze man of vrouw:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2a.1.a
    text: beiden als ingezetene met het zelfde woonadres in de basisregistratie personen zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.1.b
    text: |-
      zich bij een notarieel verleden samenlevingscontract tegenover elkaar hebben verplicht om wederkerig bij te dragen
      in de kosten van levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.1.c
    text: beiden ongehuwd zijn;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.1.d
    text: beiden ten tijde van de aanmelding achttien jaar of ouder zijn en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.1.e
    text: geen bloed- of aanverwanten in de rechte lijn zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.2
    text: |-
      Een gewezen politieke ambtsdrager als bedoeld in het eerste lid kan, voordat hij de pensioengerechtigde leeftijd
      heeft bereikt, eveneens een aanmelding doen als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.3
    text: |-
      Degene die een aanmelding doet, voegt daarbij een gewaarmerkt afschrift van de benodigde gegevens uit de
      basisregistratie personen waaruit blijkt dat is voldaan aan de voorwaarde, gesteld in het eerste lid, onder a,
      alsmede een afschrift van het contract, bedoeld in het eerste lid, onder b, dan wel een uittreksel daaruit of een
      verklaring van een notaris dienaangaande, waaruit de wederzijdse onderhoudsplichtigheid blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.4
    text: |-
      Indien aan de voorwaarden voor aanmelding, gesteld in het eerste lid, niet wordt voldaan, weigert Onze Minister
      de aanmelding.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.5
    text: |-
      Onze Minister kan regels stellen omtrent de aanmelding door degene die niet als ingezetene in de basisregistratie
      personen is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.6
    text: De aanmelding eindigt met het doorhalen ervan.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.7
    text: 'Een aanmelding als bedoeld in het eerste lid wordt doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.7.a
    text: |-
      op de dag waarop een aanvraag daartoe van degene die de aanmelding heeft gedaan, dan wel van de man of vrouw die is
      aangemeld, is ontvangen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.7.b
    text: op de dag van overlijden van de man of vrouw die is aangemeld dan wel van degene die de aanmelding heeft gedaan, of
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.7.c
    text: |-
      op de dag waarop degene die de aanmelding heeft gedaan, dan wel de man of vrouw die is aangemeld, hetzij in het
      huwelijk treedt, hetzij partij is bij een volgende aanmelding.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.8
    text: |-
      Onze Minister kan, indien daartoe aanleiding bestaat, bevestiging vragen of nog aan de voorwaarden voor aanmelding
      wordt voldaan. Degene die de aanmelding heeft gedaan legt alsdan een schriftelijke verklaring ter zake over van
      hem en de aangemelde persoon gezamenlijk, alsmede een gewaarmerkt afschrift van de benodigde gegevens uit de
      basisregistratie personen waaruit blijkt dat aan de voorwaarde, gesteld in het eerste lid, onder a, op het tijdstip
      van die verklaring wordt voldaan. Indien evenwel in de voorgaande periode het samenlevingscontract een wijziging
      heeft ondergaan die van belang kan zijn voor de aanmelding, wordt een afschrift van het gewijzigde contract
      overgelegd dan wel een uittreksel daaruit of een verklaring van een notaris dienaangaande, waaruit blijkt dat nog
      wordt voldaan aan de voorwaarde, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.9
    text: |-
      Indien de bevestiging niet binnen zes weken wordt gedaan herhaalt Onze Minister zijn in het achtste lid bedoelde
      vraag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.10
    text: |-
      Indien de bevestiging niet binnen drie weken na de herhaalde vraag wordt gegeven, kan Onze Minister de aanmelding
      op een door hem vast te stellen datum doorhalen. De bedoelde datum is niet gelegen voor de datum waarop de in het
      achtste lid bedoelde bevestiging is gevraagd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
  - number: 2a.11
    text: |-
      Voor de toepassing van dit artikel ten aanzien van de Rijksvertegenwoordiger, kan voor
      «basisregistratie personen» telkens worden gelezen: basisadministratie, als bedoeld in
      [artikel 2 van de Wet basisadministratie persoonsgegevens BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '2'
  - number: 2b.1
    text: |-
      [Artikel 2a][ref1] is van overeenkomstige toepassing op de politieke ambtsdrager, bedoeld in
      [artikel 2, tweede lid, onder d][ref2] met uitzondering van de Rijksvertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 2b.2
    text: |-
      Voor de toepassing, bedoeld in het eerste lid, treden gedeputeerde staten, het college van burgemeester en
      wethouders onderscheidenlijk het dagelijks bestuur van het waterschap in de plaats van Onze Minister, uitgezonderd
      ten aanzien van diens bevoegdheid, gegeven in [artikel 2a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 2a
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '3'
    text: |-
      De bepalingen van deze wet voor het partnerpensioen zijn van overeenkomstige toepassing op het bijzonder
      partnerpensioen, tenzij uit de desbetreffende bepalingen het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel3
  - number: '4'
    text: |-
      De bepalingen van deze wet voor het partner- en wezenpensioen zijn van overeenkomstige toepassing op het tijdelijk
      pensioen, tenzij uit de desbetreffende bepalingen het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel4
  - number: 4a
    text: |-
      Op een bij of krachtens deze wet vastgestelde pensioenregeling zijn de [artikelen 47][ref1], [53][ref2],
      [55, vierde lid][ref3], en [97 van de Pensioenwet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel97
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '97'
  - number: '5.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder minister mede verstaan: staatssecretaris.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel5
  - number: '5.2'
    text: 'Voor de toepassing van het bij of krachtens deze afdeling bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel5
  - number: 5.2.a
    text: '*gewezen minister:* hij die uit hoofde van een ontslag uitzicht heeft op pensioen krachtens deze afdeling;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel5
  - number: 5.2.b
    text: '*gepensioneerd minister:* hij die uit hoofde van een ontslag recht heeft op pensioen krachtens deze afdeling;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel5
  - number: 5.2.c
    text: |-
      *overheidswerknemer:* een overheidswerknemer of een gewezen overheidswerknemer in de zin van de
      [Wet privatisering ABP][ref1], die werkzaam was bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: '6.1'
    text: |-
      Een minister aan wie door Ons ontslag wordt verleend, heeft met ingang van de dag van zijn ontslag, indien hij
      nog niet de pensioengerechtigde leeftijd heeft bereikt en hij niet zonder onderbreking weer als minister optreedt,
      recht op een uitkering op de voet van de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: '6.2'
    text: |-
      De uitkering of, na verrekening ingevolge [artikel 9][ref1], het restant van de uitkering, wordt niet uitbetaald
      voor de periode dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 6.2.a
    text: de belanghebbende Onze Minister daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: 6.2.b
    text: aan de belanghebbende rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: 6.2.c
    text: de belanghebbende zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: 6.2.d
    text: |-
      de belanghebbende buiten Nederland woont of verblijf houdt anders dan wegens vakantie, met dien verstande dat
      [artikel 19, tiende, dertiende en veertiende lid, van de Werkloosheidswet][ref1] alsmede de regels die op grond van
      genoemd tiende lid gesteld zijn, van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
  - number: 6.2.e
    text: de belanghebbende vakantie geniet buiten de bij algemene maatregel van bestuur gestelde periode.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: '6.3'
    text: 'Wij, de Raad van State gehoord, kunnen bepalen dat geen uitkering wordt toegekend, indien de belanghebbende:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: 6.3.a
    text: |-
      zich in vreemde krijgsdienst of in vreemde overheidsdienst heeft begeven en naar Ons oordeel zich daardoor uit
      Nederlands nationaal oogpunt beschouwd onwaardig heeft gedragen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: 6.3.b
    text: |-
      wegens enig strafbaar feit is veroordeeld waaruit naar Ons oordeel blijkt dat hij zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
  - number: '6.4'
    text: |-
      Het niet uitbetalen van de uitkering op grond van het tweede lid, is niet van invloed op de met toepassing van
      [artikel 7, eerste of tweede lid][ref1], berekende duur waarvoor de uitkering is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '7.1'
    text: |-
      De uitkering wordt toegekend voor een duur gelijk aan de tijd waarin de belanghebbende minister is geweest, maar
      ten minste voor de duur van twee jaren en ten hoogste voor de duur van drie jaren en twee maanden. Indien de
      belanghebbende met een of meer onderbrekingen minister is geweest, wordt in aanmerking genomen de tijd gedurende
      welke hij minister is geweest in een tijdvak, laatstelijk voor zijn ontslag, waarin zijn ministerschap voor ten
      hoogste een zesde deel van dat tijdvak is onderbroken.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid wordt de uitkering toegekend voor de duur van zes maanden, indien de belanghebbende
      korter dan drie maanden minister is geweest.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7
  - number: '7.3'
    text: |-
      Als de belanghebbende op de datum van zijn ontslag of aftreden vijf jaren of minder verwijderd is van de voor hem
      van toepassing zijnde pensioengerechtigde leeftijd en hij in de daaraan voorafgaande periode van twaalf jaren ten
      minste tien jaren Minister is geweest, wordt de uitkering voortgezet tot de pensioengerechtigde leeftijd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7
  - number: '7.4'
    text: |-
      Voor de berekening van de uitkeringsduur, bedoeld in het eerste lid, en de tien jaren, bedoeld in het derde lid,
      wordt met tijd waarin de belanghebbende minister is geweest gelijkgesteld de tijd waarin hij een functie heeft
      bekleed als genoemd in [artikel 2, tweede lid, onder b en d][ref1]. Indien sprake is van gelijkgestelde tijd als
      bedoeld in de vorige zin wordt met betrekking tot die tijd op dezelfde wijze als in de tweede zin van het eerste
      lid rekening gehouden met onderbreking in de uitoefening van deze functies.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '7.5'
    text: |-
      In geval van tussentijds vervallen van de uitkering krachtens [artikel 11, tweede lid, onder b][ref1], wordt
      de volgende uitkering toegekend ten minste tot het tijdstip waarop eerstgenoemde uitkering, indien zij niet was
      vervallen, zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel11
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '11'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.1
    text: |-
      De belanghebbende aan wie een uitkering als bedoeld in [artikel 6][ref1] geheel of gedeeltelijk wordt uitbetaald en
      die niet binnen twaalf maanden na ontslag de pensioengerechtigde leeftijd bereikt, is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.1.a
    text: in voldoende mate te trachten passende arbeid te vinden;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.1.b
    text: aangeboden passende arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.1.c
    text: mee te werken aan activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.2
    text: 'De belanghebbende voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.2.a
    text: door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.2.b
    text: door eigen toedoen passende arbeid opgeeft;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.2.c
    text: eisen stelt die het aanvaarden of verkrijgen van passende arbeid belemmeren.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.3
    text: |-
      [Artikel 24, derde lid, van de Werkloosheidswet][ref1] is van overeenkomstige toepassing op de belanghebbende, met
      dien verstande dat de termijn van zes maanden aanvangt na de termijn van drie maanden, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
  - number: 7a.4
    text: 'Dit artikel is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7a.4.a
    text: |-
      op de belanghebbende die inkomsten geniet ten bedrage van 100% van de laatstelijk als minister genoten bezoldiging,
      bedoeld in [artikel 8, tweede lid][ref1], of een ambt heeft aanvaard als bedoeld in [artikel 2, tweede lid][ref2],
      en daaruit inkomsten geniet ten bedrage van 70% of meer van de laatstelijk als minister genoten bezoldiging,
      bedoeld in artikel 8, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 7a.4.b
    text: |-
      op de belanghebbende die recht heeft op een voortgezette uitkering ingevolge [artikel 8a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.4.c
    text: |-
      voor de periode dat de uitkering of, na verrekening ingevolge [artikel 9][ref1], het restant van de uitkering op
      verzoek van de belanghebbende met toepassing van [artikel 6, tweede lid, onder a][ref2], niet wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7a.5
    text: Dit artikel is niet van toepassing gedurende de eerste drie maanden na het aftreden van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7a
  - number: 7b.1
    text: |-
      Onze Minister kan de belanghebbende, bedoeld in [artikel 7a][ref1], verplichten zich bij het gericht zoeken naar en
      verwerven van passende arbeid planmatig te laten begeleiden en ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7b.2
    text: |-
      Onze Minister verstrekt de belanghebbende een tegemoetkoming in de kosten van planmatige begeleiding en
      ondersteuning bij het gericht zoeken naar en verwerven van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7b
  - number: 7b.3
    text: |-
      De tegemoetkoming bedraagt ten hoogste 20% van de laatstelijk als minister per jaar genoten wedde, bedoeld in
      [artikel 8, tweede lid][ref1]. De verplichte planmatige begeleiding en ondersteuning, bedoeld in het eerste lid,
      wordt volledig vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7b.4
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7b
  - number: 7b.4.a
    text: de aanvraag voor tegemoetkoming in de kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7b
  - number: 7b.4.b
    text: de voor vergoeding in aanmerking komende kosten;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7b
  - number: 7b.4.c
    text: de eisen die worden gesteld aan de organisatie die de planmatige ondersteuning uitvoert.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7b
  - number: 7c.1
    text: |-
      Indien de belanghebbende een bij of krachtens [artikel 7a][ref1] of [7b][ref2] geregelde verplichting niet of
      niet behoorlijk is nagekomen, besluit Onze Minister tot gehele of gedeeltelijke inhouding van de uitkering. Onze
      Minister is bevoegd tot verrekening van de inhouding van de uitkering met betalingen aan belanghebbende op grond
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 7b
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 7c.2
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel7c
  - number: '8.1'
    text: |-
      De uitkering bedraagt gedurende het eerste jaar 80% en vervolgens 70% van de laatstelijk als minister genoten
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8
  - number: '8.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder laatstelijk genoten bezoldiging verstaan de bezoldiging, de
      vakantie-uitkering en de eindejaarsuitkering waarop de belanghebbende aanspraak had op de dag voorafgaande aan de
      dag waarop hij als minister is ontslagen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8
  - number: '8.3'
    text: |-
      Indien voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een wijziging van het loon is
      overeengekomen, wordt de in het eerste lid bedoelde laatstelijk genoten bezoldiging voor de toepassing van dat lid
      met ingang van het tijdstip van ingang van die wijziging door Onze Minister overeenkomstig de wijziging aangepast.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8
  - number: 8a.1
    text: |-
      Indien de belanghebbende op de dag waarop de duur van de uitkering eindigt geheel of gedeeltelijk algemeen invalide
      is, wordt, met inachtneming van [artikel 11][ref1], de uitkering voor de duur van de invaliditeit voortgezet op de
      voet van [artikel 8b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '11'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8b
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8a.2
    text: |-
      Algemeen invalide, geheel of gedeeltelijk, in de zin van deze wet is hij die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekten of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen. Onder de eerstgenoemde
      arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden
      in staat is. Onder deze arbeid wordt niet begrepen arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: 8a.3
    text: |-
      Bij de vaststelling van de mate van algemene invaliditeit wordt buiten beschouwing gelaten of de betrokkene de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8a
  - number: 8a.4
    text: |-
      Indien de betrokkene zonder redelijke grond weigert deel te nemen aan een voor hem gewenste opleiding of scholing
      of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, wordt er bij de vaststelling van de mate
      van algemene invaliditeit van uitgegaan dat die opleiding of scholing is afgerond.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8a
  - number: 8a.5
    text: Bij een algemene invaliditeit van minder dan 25 percent wordt de uitkering niet voortgezet.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8a
  - number: 8b.1
    text: |-
      De voortzetting van de uitkering vindt plaats als aangegeven in het tweede en derde lid en vervolgens als
      aangegeven in het vierde en het vijfde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.2
    text: |-
      De uitkering bedraagt gedurende een periode als aangegeven in het derde lid 70% van de laatstelijk als minister
      genoten bezoldiging, bedoeld in [artikel 8][ref1], bij een algemene invaliditeit van 80% of meer, 60% van deze
      bezoldiging bij een algemene invaliditeit van 55% tot 80% en 40% van die bezoldiging bij een algemene invaliditeit
      van 25% tot 55%.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8b.3
    text: |-
      De in het tweede lid bedoelde periode is ten hoogste voor de betrokkene die op het tijdstip van voortzetting van
      de uitkering:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.3.58
    text: 'jaar of ouder is: zes jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.3.53
    text: 'jaar of ouder is: drie jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.3.48
    text: 'jaar of ouder is: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.3.43
    text: 'jaar of ouder is: anderhalf jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.3.38
    text: 'jaar of ouder is: een jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.3.33
    text: 'jaar of ouder is: een half jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.4
    text: |-
      De uitkering bedraagt na afloop van de volgens het derde lid bepaalde periode een percentage, volgens het tweede
      lid, van een bedrag gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen de laatstelijk
      als minister genoten bezoldiging, bedoeld in [artikel 8][ref1], en het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '8'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8b.5
    text: |-
      Voor de berekening van het in het vierde lid bedoelde bedrag geldt een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de belanghebbende op het tijdstip van voortzetting van de uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.6
    text: |-
      Het minimumloon, bedoeld in het vierde lid, is het tot een jaarbedrag herleide minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1] of, indien het een betrokkene jonger dan 23 jaar betreft, het tot een
      jaarbedrag herleide voor zijn leeftijd geldende minimumloon per maand, bedoeld in [artikel 7, derde lid][ref2],
      en [artikel 8, derde lid, van de genoemde wet][ref3], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 8b.7
    text: |-
      De belanghebbende heeft recht op een aanvulling van de uitkering, indien die uitkering minder bedraagt dan het
      volgens het tweede lid vastgestelde percentage van de laatstelijk als minister genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.8
    text: |-
      De aanvulling is gelijk aan het bedrag dat nodig is om de uitkering te verhogen tot het in het zevende lid bedoelde
      percentage van de laatstelijk als minister genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.9
    text: |-
      In afwijking van het achtste lid is de aanvulling gelijk aan het bedrag dat nodig is om de uitkering
      te verhogen tot het in het tiende lid aangegeven percentage van de laatstelijk als minister genoten
      bezoldiging, indien de belanghebbende de keuze heeft gemaakt voor een verlaging van de inhouding ingevolge
      [artikel 106, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 8b.10
    text: |-
      Het in het negende lid bedoelde percentage bedraagt bij een algemene invaliditeit van 80% of meer 65%, bij een
      algemene invaliditeit van 55% tot 80%: 56% en bij een algemene invaliditeit van 25% tot 55%: 37%.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
  - number: 8b.11
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 106, eerste lid][ref1], worden regels gesteld met
      betrekking tot de verlaging, bedoeld in het negende lid. Onze Minister stelt regels met betrekking tot de wijze
      en het tijdstip waarop de minister of de gewezen minister de in het negende lid bedoelde keuze, die eenmalig is,
      kenbaar dient te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 8b.12
    text: |-
      Indien de wegens algemene invaliditeit voortgezette uitkering te zamen met inkomsten, bedoeld in [artikel 9][ref1],
      minder bedraagt dan het minimumloon wordt de uitkering verhoogd tot het minimumloon. De verhoging bedraagt niet
      meer dan het verschil tussen de uitkering en het bedrag waarvan deze is afgeleid en tevens niet meer dan 30% van
      het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8c.1
    text: |-
      De voortzetting van de uitkering, bedoeld in [artikel 8a][ref1], geschiedt op aanvraag van de belanghebbende en
      voor termijnen van niet langer dan drie jaar, onverminderd het in deze wet bepaalde over herziening of intrekking
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8c.2
    text: |-
      Onze Minister stelt de belanghebbende uiterlijk vier maanden voor het verstrijken van de in het eerste lid bedoelde
      termijn schriftelijk in kennis van de mogelijkheid tot het doen van een aanvraag tot voortzetting van de uitkering
      na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8c
  - number: 8c.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt door de belanghebbende uiterlijk drie maanden voor het
      verstrijken van de in het eerste lid bedoelde termijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8c
  - number: 8c.4
    text: |-
      Indien Onze Minister niet tijdig beslist op een tijdig ingediende aanvraag als bedoeld in het derde lid, wordt de
      uitkering voortgezet tot het tijdstip van de beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8c
  - number: 8c.5
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt geacht tijdig te zijn ingediend indien Onze Minister de
      kennisgeving, bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving als bedoeld
      in het tweede lid de aanvraag wordt ingediend binnen een maand nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8c
  - number: 8c.6
    text: |-
      Indien de uitkering na afloop van de in het eerste lid bedoelde termijn wordt voortgezet, wordt de uitkering
      berekend op de wijze die van toepassing zou zijn geweest indien die termijn niet zou zijn afgelopen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8c
  - number: 8c.7
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat in bepaalde situaties geen
      termijn geldt dan wel een termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn van drie jaar.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8c
  - number: 8d.1
    text: |-
      Binnen een jaar na het tijdstip waarop de uitkering voor de eerste maal met toepassing van [artikel 8a][ref1]
      is voortgezet, doet Onze Minister een onderzoek instellen ten einde te doen bezien of er als gevolg van gronden
      die invloed hebben op de mate van algemene invaliditeit redenen aanwezig zijn voor herziening of intrekking van
      de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8d.2
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat geen termijn geldt dan wel een
      termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
  - number: 8d.3
    text: |-
      Onze Minister wijzigt ambtshalve of op aanvraag van de belanghebbende het bedrag van de uitkering bij wijziging van
      de mate van algemene invaliditeit.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
  - number: 8d.4
    text: 'Een wijziging van het bedrag van de uitkering gaat in:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
  - number: 8d.4.a
    text: |-
      indien daartoe een aanvraag is ingediend, met ingang van de eerste dag van de maand volgende op die waarin de
      aanvraag is ingekomen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
  - number: 8d.4.b
    text: |-
      indien de wijziging ambtshalve plaatsvindt, met ingang van de eerste dag van de maand volgende op die waarin de
      beslissing tot wijziging is genomen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
  - number: 8d.5
    text: |-
      De toepassing van [artikel 8a][ref1] wordt ten aanzien van een belanghebbende gestaakt indien en zolang hij niet
      voldoet aan een uitnodiging van Onze Minister zich te onderwerpen aan een onderzoek door een of meer door hem
      aangewezen geneeskundigen ter beantwoording van de vraag, of er nog sprake is van algemene invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8d.6
    text: |-
      Indien degene die recht heeft op wegens algemene invaliditeit voortgezette uitkering inkomsten uit of in
      verband met arbeid geniet, is Onze Minister bevoegd, zolang niet vaststaat of deze arbeid als arbeid, bedoeld in
      [artikel 8a, tweede lid][ref1], kan worden aangemerkt, niet tot herziening of intrekking van de uitkering over te
      gaan. De toepassing van de eerste volzin vindt ten hoogste plaats over een aaneengesloten periode van drie jaren,
      aanvangende op de eerste dag waarover de inkomsten uit of in verband met arbeid als bedoeld in de eerste volzin
      worden genoten. Deze periode wordt geacht niet te zijn onderbroken indien korter dan een maand geen inkomsten
      uit of in verband met arbeid worden genoten. Na afloop van de in de tweede volzin genoemde periode wordt de in de
      eerste volzin bedoelde arbeid aangemerkt als arbeid, bedoeld in [artikel 8a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8e.1
    text: |-
      Op verzoek van een minister doet Onze Minister een onderzoek instellen door een of meer door hem aangewezen
      geneeskundigen, ter beantwoording van de vraag of de minister die het verzoek deed algemene invalide is als bedoeld
      in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 8e.2
    text: |-
      Onze Minister brengt de uitkomst van een onderzoek dat is ingesteld ingevolge het eerste lid ter kennis van de
      verzoeker.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel8e
  - number: '9.1'
    text: |-
      De inkomsten die de belanghebbende geniet, worden bepaald overeenkomstig de regels van de
      [Wet inkomstenbelasting 2001][ref1] en worden met de uitkering verrekend over de maand waarop deze inkomsten
      betrekking hebben of geacht kunnen worden betrekking te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '9.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder inkomsten verstaan het gezamenlijk bedrag dat de belanghebbende
      wegens het verrichten van activiteiten geniet als
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
  - number: 9.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9.2.b
    text: belastbaar loon uit of in verband met arbeid en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
  - number: 9.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag
      waarmede de uitkering, vermeerderd met die inkomsten, de laatstelijk genoten bezoldiging, waarvan de
      uitkering is afgeleid, overschrijdt. Bij de verrekening wordt voor de hoogte van de uitkering de op grond van
      [artikel 7c, eerste lid][ref1], opgelegde inhouding buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7c
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '9.4'
    text: |-
      Indien in het bedrag der inkomsten bedoeld in de vorige leden, is of geacht kan worden te zijn begrepen een
      vergoeding ter zake van de premie [Algemene Ouderdomswet][ref1] en [Algemene nabestaandenwet][ref2], blijft deze
      vergoeding voor de toepassing van dit artikel buiten beschouwing. De vorige volzin is slechts van toepassing voor
      zover de daar bedoelde inkomsten betrekking hebben op een tijdvak gelegen voor 1 juni 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '9.5'
    text: Kinderbijslag wordt niet aangemerkt als inkomst.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
  - number: '9.6'
    text: |-
      Voor de toepassing van dit artikel ten aanzien van de voortgezette uitkering bedoeld in
      [artikel 7, zesde lid][ref1], en [artikel 8a][ref2], kan Onze Minister andere inkomsten aanmerken als te zijn
      genoten wegens activiteiten bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 9a.1
    text: |-
      De belanghebbende is verplicht van het ter hand nemen van enige activiteiten als bedoeld in
      [artikel 9, tweede lid][ref1], terstond mededeling te doen aan Onze Minister onder opgave, voor zover mogelijk,
      van de inkomsten, die hij uit die activiteiten zal trekken. Zijn de inkomsten niet vooraf op te geven, dan doet
      hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave van de inkomsten, die hij sinds het ter hand
      nemen van de activiteiten of sinds de vorige opgave heeft genoten. Onze Minister geeft nadere voorschriften
      aangaande het doen van mededelingen door de belanghebbende met betrekking tot de activiteiten bedoeld in
      [artikel 9, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 9a.2
    text: |-
      Brengt de aard van de activiteiten of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast
      van een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het eind van de evenbedoelde termijn. Ten
      aanzien van deze verrekening is [artikel 9][ref1] van toepassing, met dien verstande, dat zij geschiedt over de in
      de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 9a.3
    text: |-
      Onze Minister kan bij de vaststelling van het bedrag van de vermindering van de opgave van de belanghebbende
      afwijken.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9a
  - number: 9a.4
    text: |-
      De belanghebbende aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin
      toe te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit hoofdstuk noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel9a
  - number: '10.1'
    text: De uitkering, berekend over een maand, wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel10
  - number: '10.2'
    text: |-
      De uitkering wordt niet uitbetaald zolang de belanghebbende niet of niet op de voorgeschreven wijze voldoet aan
      zijn verplichtingen op grond van [artikel 9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 9a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '11.1'
    text: De uitkering eindigt met ingang van de dag volgende op die, waarop de gewezen minister is overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
  - number: '11.2'
    text: 'De uitkering vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
  - number: 11.2.a
    text: met ingang van de dag waarop de gewezen minister de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
  - number: 11.2.b
    text: met ingang van de dag waarop de gewezen minister wederom minister wordt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
  - number: '11.3'
    text: |-
      De uitkering kan geheel of ten dele vervallen worden verklaard indien de belanghebbende herhaaldelijk niet of niet
      op de voorgeschreven wijze voldoet aan zijn verplichtingen op grond van [artikel 9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 9a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '11.4'
    text: 'Voorts kunnen Wij, de Raad van State gehoord, de uitkering vervallen verklaren, indien de gewezen minister:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
  - number: 11.4.a
    text: |-
      zich in vreemde krijgsdienst of in vreemde overheidsdienst heeft begeven en naar Ons oordeel zich daardoor uit
      Nederlands nationaal oogpunt beschouwd onwaardig heeft gedragen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
  - number: 11.4.b
    text: |-
      wegens enig strafbaar feit is veroordeeld waaruit naar Ons oordeel blijkt dat hij zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel11
  - number: '12.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de gewezen minister wordt aan de partner, van die de overledene niet
      duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan driemaal het bedrag van de uitkering, dat over de
      laatste volle maand aan de gewezen minister is uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel12
  - number: '12.2'
    text: |-
      Laat de overledene geen partner na, van wie hij niet duurzaam gescheiden leefde, dan geschiedt de uitkering van het
      in het eerste lid bedoelde bedrag, ten behoeve van de minderjarige kinderen die in familierechtelijke betrekking
      stonden tot de overledene, of minderjarige kinderen waarover de overledene de pleegouderlijke zorg droeg. Onder
      pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind, als was het een eigen
      kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen, dan geschiedt de uitkering van het in het eerste lid bedoelde bedrag, indien de overledene
      kostwinner was van ouders, meerderjarige kinderen, broeders of zusters, ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel12
  - number: '12.3'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het eerste en tweede lid na, dan kan het aldaar bedoelde
      bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel12
  - number: '13.1'
    text: Een persoon die minister is of minister is geweest, heeft recht op een ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13
  - number: '13.2'
    text: |-
      Het pensioen gaat in op de pensioengerechtigde leeftijd. Op verzoek van de betrokkene gaat het pensioen eerder of
      later in.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13
  - number: '13.3'
    text: |-
      Het pensioen kan niet eerder in gaan dan op de eerste dag van de maand waarin betrokkene de leeftijd van 60 jaar
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13
  - number: '13.4'
    text: |-
      Gedurende de tijd dat de betrokkene optreedt als minister en gedurende de tijd dat hij een uitkering geniet als
      bedoeld in [hoofdstuk 3][ref1], kan het pensioen niet ingaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '13.5'
    text: |-
      Het pensioen gaat, zo nodig in afwijking van het vierde lid, niet later in dan het tijdstip waarop de betrokkene de
      leeftijd heeft bereikt, bedoeld in [artikel 18a, vierde lid, van de Wet op de loonbelasting 1964][ref1], zoals dat
      artikel luidde op de dag voorafgaand aan het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0048328
  - number: '13.6'
    text: Nadat het pensioen is ingegaan worden geen aanspraken voor het pensioen opgebouwd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13
  - number: 13a.1
    text: |-
      De betrokkene bouwt gedurende ieder dienstjaar pensioenaanspraak op. De aanspraak bedraagt voor ieder dienstjaar
      een percentage van de pensioengrondslag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13a
  - number: 13a.2
    text: |-
      De opgebouwde aanspraak wordt geïndexeerd op een wijze die aansluit bij de indexering van de opbouw die wordt
      gehanteerd ten aanzien van het ouderdomspensioen van overheidswerknemers.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13a
  - number: 13b
    text: |-
      Ieder jaar dat de betrokkene als minister werkzaam is geweest, of in het genot is geweest van een uitkering als
      bedoeld in [hoofdstuk 3][ref1], is voor hem een dienstjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13c.1
    text: |-
      Het opbouwpercentage, bedoeld in [artikel 13a][ref1], dat voor enig dienstjaar wordt gehanteerd, is het percentage
      dat voor dat dienstjaar voor de opbouw van het ouderdomspensioen van overheidswerknemers wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13a
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 13c.2
    text: |-
      Gedurende de periode dat een uitkering als bedoeld in [hoofdstuk 3][ref1] wordt genoten, is het opbouwpercentage
      de helft van het percentage, bedoeld in het eerste lid. Gedurende de periode waarin de uitkering met toepassing van
      [artikel 6, tweede lid][ref2], niet wordt uitbetaald, is het opbouwpercentage nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel6
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13c.3
    text: |-
      In afwijking van het tweede lid wordt het opbouwpercentage niet gehalveerd gedurende de tijd dat de betrokkene voor
      55 procent of meer algemeen invalide is en de invaliditeit veroorzaakt is door een dienstongeval.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13c
  - number: 13c.4
    text: |-
      Gedurende de tijd waarin de uitkering is verminderd vanwege toepassing van [artikel 7c, eerste lid][ref1], of
      vanwege inkomsten als bedoeld in [artikel 9][ref2], wordt het met toepassing van het eerste tot en met derde lid
      gevonden opbouwpercentage vermenigvuldigd met een factor die gelijk is aan de verminderde uitkering gedeeld door de
      uitkering zonder vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7c
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel9
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7c
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '9'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13d.1
    text: |-
      De pensioengrondslag is gebaseerd op het pensioengevend loon verminderd met een bij een middelloonstelsel behorende
      franchise die wordt gehanteerd ten aanzien van overheidswerknemers. Het pensioengevend loon is de in het dienstjaar
      als Minister genoten bezoldiging, waaronder begrepen de vakantie-uitkering, de eindejaarsuitkering en een eenmalige
      uitkering, voor zover dit niet het in [artikel 18ga, eerste lid, van de Wet op de loonbelasting 1964][ref1]
      genoemde bedrag te boven gaat, op de peildatum van 1 januari van een kalenderjaar of op de datum waarop betrokkene
      tot minister is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18ga
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18ga
  - number: 13d.2
    text: |-
      Voor zover de betrokkene in het dienstjaar in het genot is van een uitkering als bedoeld in [hoofdstuk 3][ref1],
      is het eerste lid van overeenkomstige toepassing, met dien verstande dat de pensioengrondslag wordt gebaseerd op
      de laatstelijk voor het ontslag als minister genoten bezoldiging. De bezoldiging wordt geïndexeerd op een wijze
      die aansluit bij de overeenkomstige indexering die wordt gehanteerd ten aanzien van het ouderdomspensioen van
      overheidswerknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13e.1
    text: Het pensioen bedraagt op jaarbasis de som van de opgebouwde pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13e
  - number: 13e.2
    text: |-
      Voor zover het pensioen in gaat op een leeftijd die afwijkt van de pensioenrichtleeftijd die gold op het moment
      dat pensioenaanspraak werd opgebouwd, wordt voor de bepaling van de in het eerste lid bedoelde som dat deel
      van de aanspraak herrekend. Daarbij wordt voor het deel van de aanspraak dat is opgebouwd onder een lagere of
      hogere pensioenrichtleeftijd dan de leeftijd waarop het pensioen in gaat, de aanspraak verhoogd onderscheidenlijk
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13e
  - number: 13e.3
    text: |-
      Het pensioen kan op verzoek van de betrokkene in hoogte variëren in de loop der jaren, waarbij herrekening over
      de jaren plaats vindt. Daarbij wordt een eerdere verlaging of verhoging gecompenseerd door een latere verhoging
      onderscheidenlijk verlaging.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13e
  - number: 13e.4
    text: |-
      Bij de herrekening, bedoeld in het tweede en derde lid, wordt aangesloten bij de herrekening die in overeenkomstige
      gevallen wordt gehanteerd ten aanzien van overheidswerknemers.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13e
  - number: 13e.5
    text: |-
      Over de pensioenaanspraak van de persoon die aantreedt als Minister op of na de pensioenrichtleeftijd die geldt op
      het moment van zijn aantreden, vindt geen herrekening plaats als bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13e
  - number: 13f.1
    text: |-
      Een minister of gewezen minister kan bij de ingang van het pensioen de opgebouwde aanspraken op partnerpensioen als
      bedoeld in [hoofdstuk 5][ref1], omzetten in aanspraken op ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '5'
        afdeling: Tweede
  - number: 13f.2
    text: Met de keuze voor de omzetting vervalt de aanspraak op het partnerpensioen. De keuze is onherroepelijk.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13f
  - number: 13f.3
    text: De keuze voor de omzetting kan slechts worden gedaan met toestemming van de partner.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13f
  - number: 13f.4
    text: |-
      Bij de omzetting wordt een ruilvoet toegepast die aansluit bij de ruilvoet die in overeenkomstige gevallen wordt
      gehanteerd ten aanzien van overheidswerknemers.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13f
  - number: 13g.1
    text: |-
      Een gewezen minister kan na afloop van de uitkeringsduur, bedoeld in [artikel 7][ref1], een deel van de tussen
      1 augustus 2003 en 1 juli 2022 door hem opgebouwde aanspraken op ouderdomspensioen omzetten in een aanspraak op
      partnerpensioen bij overlijden voor het bereiken van de pensioengerechtigde leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13g
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 13g.2
    text: |-
      Onze Minister doet binnen vier maanden voor de afloop van de uitkering mededeling van deze omzettingsmogelijkheid.
      De gewezen minister maakt zijn keuze voor een omzetting binnen zes weken na de mededeling schriftelijk aan
      Onze Minister kenbaar. Tot het einde van die termijn verkrijgt de gewezen minister een premievrije aanspraak op
      partnerpensioen overeenkomstig de tijd tot het aftreden van de minister.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13g
  - number: 13g.3
    text: |-
      De in het eerste lid bedoelde omzetting wordt gevolgd door een omzetting van de verkregen aanspraken op
      partnerpensioen in een aanspraak op ouderdomspensioen indien:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13g
  - number: 13g.3.a
    text: |-
      de in het eerste lid bedoelde omzetting gevolgd wordt door een waardeoverdracht als bedoeld in
      [artikel 107][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel107
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13g
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '107'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 13g.3.b
    text: de gewezen minister opnieuw minister wordt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13g
  - number: 13g.3.c
    text: het huwelijk van de gewezen minister eindigt, anders dan door zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13g
  - number: 13g.4
    text: |-
      Bij de omzettingen wordt een ruilvoet toegepast die aansluit bij de ruilvoet die in overeenkomstige gevallen wordt
      gehanteerd ten aanzien van overheidswerknemers.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13g
  - number: 13h.1
    text: |-
      Indien het pensioenfonds ABP een verlaging als bedoeld in [artikel 134 Pensioenwet][ref1] toepast op de
      pensioenaanspraken of de pensioenrechten, verlaagt Onze Minister de in dit hoofdstuk bedoelde pensioenaanspraken en
      de pensioenen op overeenkomstige wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
  - number: 13h.2
    text: |-
      Onze Minister informeert de ministers en de gewezen ministers schriftelijk over zijn voornemen om de
      pensioenaanspraken of pensioenen te verlagen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13h
  - number: 13h.3
    text: De verlaging kan op zijn vroegst een maand nadat de betrokkenen hierover geïnformeerd zijn, in gaan.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13h
  - number: 13h.4
    text: |-
      Indien het pensioenfonds ABP een compensatie van een verlaging als bedoeld in [artikel 134 Pensioenwet][ref1]
      toepast, past Onze Minister de compensatie toe op overeenkomstige wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
  - number: 13i.1
    text: |-
      Als het pensioen op de dag van ingang op jaarbasis minder bedraagt dan het bedrag bedoeld in
      [artikel 66, eerste lid, van de Pensioenwet][ref1], wordt dit pensioen afgekocht door een uitkering ineens, mits
      de minister of gewezen minister daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
  - number: 13i.2
    text: |-
      Onze Minister kan een pensioen als bedoeld in het eerste lid eveneens afkopen, mits Onze Minister na het ontslag
      van de belanghebbende als minister ten minste vijf maal tevergeefs heeft gepoogd de overdrachtswaarde over te
      dragen als bedoeld in [artikel 13j, eerste lid][ref1], en na het ontslag ten minste vijf jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13j
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13j
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 13i.3
    text: |-
      Bij de vaststelling van de uitkering ineens wordt aangesloten bij de berekening die in overeenkomstige gevallen
      wordt gehanteerd ten aanzien van overheidswerknemers. [Artikel 66, achtste lid, van de Pensioenwet][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
  - number: 13j.1
    text: |-
      Onze Minister kan de overdrachtswaarde van de pensioenaanspraken van een gewezen minister met overeenkomstige
      toepassing van de [artikelen 70a][ref1] en [220b van de Pensioenwet][ref2] overdragen aan een pensioenuitvoerder
      als bedoeld in de [Pensioenwet][ref3], met dien verstande dat voor deze overeenkomstige toepassing Onze Minister
      wordt beschouwd als de overdragende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel220b
      [ref3]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 220b
      - id: ref3
        bwb_id: BWBR0020809
  - number: 13j.2
    text: |-
      Een pensioenuitvoerder als bedoeld in de [Pensioenwet][ref1] kan de pensioenaanspraken van een gewezen deelnemer
      als bedoeld in de Pensioenwet met overeenkomstige toepassing van [artikel 70a van de Pensioenwet][ref2] overdragen
      aan Onze Minister, met dien verstande dat voor deze overeenkomstige toepassing Onze Minister wordt beschouwd als de
      ontvangende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 70a
  - number: 13j.3
    text: |-
      De krachtens de [artikelen 70a, zesde lid][ref1], en [220b, vierde lid, onderdeel a, van de Pensioenwet][ref2]
      gestelde regels zijn van overeenkomstige toepassing op de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel220b
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 220b
  - number: '14.1'
    text: 'Bij algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.a
    text: de opbouw van aanspraken op pensioen waaronder de indexering daarvan;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.b
    text: de in aanmerking te nemen dienstjaren en het in aanmerking te nemen opbouwpercentage;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.c
    text: |-
      de bepaling van de pensioengrondslag, de in aanmerking te nemen bezoldiging waaronder de indexering daarvan en
      de franchise;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.d
    text: het bepalen van het pensioen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.e
    text: |-
      de herrekening, bedoeld in [artikel 13e, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13e
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13e
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 14.1.f
    text: |-
      de beperkingen die bij toepassing van [artikel 13e, derde lid][ref1], in acht worden genomen en de herrekening die
      bij die toepassing wordt gehanteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13e
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13e
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 14.1.g
    text: de verhoging van het pensioen door omzetting van partnerpensioen, waaronder de daarbij te hanteren ruilvoet;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.h
    text: |-
      de verlaging van het pensioen door omzetting in partnerpensioen, waaronder de daarbij te hanteren ruilvoet en de
      bepaling van dat partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.i
    text: |-
      de verlaging van het pensioen na verlaging van pensioenaanspraken en pensioenen door het pensioenfonds ABP
      overeenkomstig [artikel 134 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
  - number: 14.1.j
    text: de afkoop en de waardeoverdracht van een klein pensioen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: 14.1.k
    text: overige aspecten in het belang van een goede vaststelling en uitkering van het pensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: '14.2'
    text: |-
      Krachtens de maatregel, bedoeld in het eerste lid, kunnen nadere regels worden gesteld over de aanpassing van in de
      maatregel genoemde bedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
  - number: '14.3'
    text: |-
      Bij deze regels worden de voorwaarden en maxima in acht genomen die op grond van de
      [Wet op de loonbelasting 1964][ref1], zoals deze luidde op de dag voorafgaand aan het tijdstip van inwerkingtreding
      van de [Wet toekomst pensioenen][ref2], gelden voor een op een middelloonstelsel gebaseerd ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0048328
  - number: '15.1'
    text: |-
      De partner van een minister, gewezen minister of gepensioneerd minister heeft bij diens overlijden recht op
      partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
  - number: '15.2'
    text: Het partnerpensioen gaat in op de dag volgende op de dag van het overlijden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
  - number: '15.3'
    text: 'In afwijking van het eerste lid bestaat geen recht op partnerpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
  - number: 15.3.a
    text: indien het partnerschap is aangegaan nadat de gepensioneerde minister de pensioengerechtigde leeftijd had bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
  - number: 15.3.b
    text: |-
      bij overlijden van een gewezen minister vóór het bereiken van de pensioengerechtigde leeftijd, voor zover de
      pensioengeldige tijd is gelegen tussen 1 augustus 2003 en 1 juli 2022 en geen omzetting is gedaan als bedoeld in
      [artikel 13g, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13g
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13g
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 15.3.c
    text: |-
      bij overlijden van een gepensioneerd minister, voor zover de pensioengeldige tijd van de overledene is gelegen na
      30 juni 1999 en de keuze is gedaan, bedoeld in [artikel 13f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13f
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13f
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 15.3.d
    text: |-
      indien de partner de minister, gewezen minister of gepensioneerd minister opzettelijk van het leven heeft beroofd
      of daaraan medeplichtig is en hiervoor is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
  - number: '15.4'
    text: |-
      Voor de toepassing van het derde lid, onder b, geldt niet als gewezen minister de gewezen minister die recht heeft
      op een uitkering als bedoeld in [artikel 6, eerste lid][ref1], of [artikel 8a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '6'
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 8a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: '17.1'
    text: |-
      Bij een overlijden van de minister, de gewezen minister of de gepensioneerd minister heeft de gewezen partner recht
      op bijzonder partnerpensioen, mits:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: 17.1.a
    text: |-
      de gewezen partner recht op partnerpensioen zou hebben gehad, indien de minister, gewezen minister of
      gepensioneerde op de dag van het beëindigen van het partnerschap zou zijn overleden; en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: 17.1.b
    text: |-
      indien het partnerschap een huwelijk betrof, de dag van het vonnis, waarbij de echtscheiding of de ontbinding van
      het huwelijk is uitgesproken ligt na het tijdstip van de inwerkingtreding van de Wet herziening echtscheidingsrecht
      en de echtscheiding of de ontbinding van het huwelijk niet is uitgesproken met toepassing van het voor bedoeld
      tijdstip geldende recht.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: '17.2'
    text: 'In afwijking van het eerste lid heeft de gewezen partner bij overlijden geen recht op bijzonder partnerpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: 17.2.a
    text: |-
      indien de partners bij huwelijkse voorwaarden, bij voorwaarden bij geregistreerd partnerschap of bij een
      schriftelijk gesloten overeenkomst met het oog op het einde van het partnerschap dit overeenkomen en Onze Minister
      daarmee instemt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: 17.2.b
    text: |-
      indien betrokkene als gevolg van het aangaan van een nieuw partnerschap met dezelfde minister wegens diens
      overlijden recht op partnerpensioen heeft;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: 17.2.c
    text: |-
      bij overlijden van een minister of gewezen minister vóór het bereiken van de pensioengerechtigde leeftijd, voor
      zover de pensioengeldige tijd van de overledene is gelegen tussen 31 juli 2003 en 1 juli 2022;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: 17.2.d
    text: |-
      bij overlijden van een gepensioneerd minister voor zover de pensioengeldige tijd van de overledene is gelegen na
      30 juni 1999 en de keuze is gedaan, bedoeld in [artikel 13f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13f
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13f
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 17.2.e
    text: |-
      indien de gewezen partner de minister, gewezen minister of gepensioneerd minister opzettelijk van het leven heeft
      beroofd of daaraan medeplichtig is, en hiervoor is veroordeeld;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: 17.2.f
    text: |-
      indien bij de scheiding het partnerpensioen van de minister, de gewezen minister of de gepensioneerd minister is
      omgezet in een eigen aanspraak op ouderdomspensioen voor de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel17
  - number: '18.1'
    text: 'In deze afdeling wordt onder wees verstaan een kind van wie een verzorger is overleden en:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: 18.1.a
    text: |-
      die als kind van de minister, gewezen minister of gepensioneerd minister staat ingeschreven in de
      basisadministratie, bedoeld in de [Wet basisregistratie persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: 18.1.b
    text: |-
      dat deel uitmaakte van het gezin van de minister, gewezen minister of gepensioneerd minister, waarvoor deze de
      kosten van levensonderhoud droeg; of
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: 18.1.c
    text: |-
      voor wie de minister, gewezen minister of gepensioneerd minister ten tijde van overlijden een
      onderhoudsplicht krachtens [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1] dan wel
      [artikel 394 van Boek 1 van het Burgerlijk Wetboek BES][ref2] was opgelegd, dan wel door hem bij authentieke akte
      een dergelijke verplichting was erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel394
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '394'
  - number: '18.2'
    text: 'In deze afdeling wordt onder verzorger verstaan:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: 18.2.a
    text: de ouder van de wees indien de wees is geboren tijdens het huwelijk of geregistreerd partnerschap;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: 18.2.b
    text: de persoon die de wees heeft erkend of geadopteerd;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: 18.2.c
    text: de pleegouder van de wees.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: '18.3'
    text: |-
      Onder pleegouder bedoeld in het tweede lid, onder c, wordt verstaan de persoon die de zorg draagt voor het
      onderhoud en de opvoeding van het kind, als was het een eigen kind, onafhankelijk van enige verplichting daartoe of
      het genieten van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: '18.4'
    text: |-
      De wees heeft bij overlijden van zijn verzorger die minister, gewezen minister of gepensioneerd minister was recht
      op wezenpensioen, indien hij de leeftijd van vijfentwintig jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: '18.5'
    text: |-
      Het wezenpensioen gaat in op de dag volgende op de dag van het overlijden van de verzorger, bedoeld in het vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: '18.6'
    text: |-
      In afwijking van het vierde lid heeft een wees geen recht op wezenpensioen als hij opzettelijk de minister,
      gewezen minister of gepensioneerd minister van het leven heeft beroofd of daaraan medeplichtig is, en hiervoor
      is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel18
  - number: '21.1'
    text: |-
      Indien een minister, gewezen minister of gepensioneerd minister naar het oordeel van Onze Minister is vermist,
      hebben degenen die aan zijn overlijden recht op pensioen zouden ontlenen, recht op tijdelijk pensioen op dezelfde
      voet als in de voorgaande artikelen van dit hoofdstuk is omschreven.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel21
  - number: '21.2'
    text: Het tijdelijk pensioen gaat in op een door Onze Minister te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel21
  - number: '21.3'
    text: |-
      Het tijdelijk pensioen gaat van rechtswege over in een voortdurend pensioen zodra het overlijden van de vermiste
      vaststaat.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel21
  - number: '22.1'
    text: |-
      Het partnerpensioen, bedoeld in [artikel 15][ref1], bedraagt 70 procent van het ouderdomspensioen, waarop de
      overleden minister als zodanig aanspraak zou hebben gehad indien hij met ingang van de dag na die van zijn
      overlijden was ontslagen of waarop de overleden gewezen minister als zodanig recht of uitzicht had, een en ander
      met inachtneming van artikel 15, tweede lid, onder b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '15'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '22.2'
    text: 'In afwijking van het vorige lid bedraagt het partnerpensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel22
  - number: 22.2.a
    text: |-
      bij overlijden van een minister vóór het bereiken van de pensioengerechtigde leeftijd, 70 procent van
      het ouderdomspensioen waarop die minister aanspraak zou hebben kunnen maken, indien hij zijn ambt tot
      het bereiken van de pensioengerechtigde leeftijd zou hebben bekleed, zonder rekening te houden met
      [artikel 13e, tweede of derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13e
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13e
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 22.2.b
    text: |-
      bij overlijden van een gewezen minister in de periode, waarover hem een uitkering is toegekend, 70 procent van het
      ouderdomspensioen waarop de gewezen minister aanspraak zou hebben kunnen maken, indien hij tot het bereiken van
      de pensioengerechtigde leeftijd recht op uitkering zou hebben gehad, met dien verstande, dat voor de berekening
      van het ouderdomspensioen de diensttijd wordt doorgeteld naar de mate van medetelling van diensttijd op de dag
      van overlijden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel22
  - number: '22.3'
    text: |-
      Indien wegens eenzelfde overlijden voor een partner recht ontstaat zowel op partnerpensioen krachtens deze
      afdeling als op partnerpensioen krachtens of op de voet van de derde of vijfde afdeling van deze wet, wordt voor de
      berekening van de ouderdomspensioenen waarvan de partnerpensioenen zijn afgeleid, tijd die zowel voor de berekening
      van eerstbedoeld pensioen als voor de berekening van het andere pensioen meetelt en niet daadwerkelijk gelijktijdig
      in de verschillende ambten is doorgebracht, slechts meegeteld voor de berekening van het pensioen, waarbij die tijd
      het hoogste bedrag oplevert.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel22
  - number: '22.4'
    text: |-
      Bij de toepassing van het eerste tot en met derde lid wordt ten aanzien van het ouderdomspensioen opgebouwd tussen
      31 december 1985 en 1 januari 1995, gerekend met een bij of krachtens algemene maatregel van bestuur vastgestelde
      franchise.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel22
  - number: '23.1'
    text: 'Het bijzonder partnerpensioen bedraagt 70 procent van een ouderdomspensioen, waarbij in aanmerking wordt genomen:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel23
  - number: 23.1.a
    text: |-
      de berekeningsgrondslag waarnaar het ouderdomspensioen van de minister, gewezen minister of gepensioneerde zou
      zijn berekend indien deze op de dag van het beëindigen van het partnerschap recht op ouderdomspensioen zou hebben
      verkregen, zonder rekening te houden met [artikel 13e, tweede of derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13e
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13e
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 23.1.b
    text: 'pensioengeldige tijd die is gelegen vóór de onder a bedoelde dag, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel23
  - number: 23.1.b.i
    text: |-
      bij overlijden van een minister of gewezen minister voor de pensioengerechtigde leeftijd, uitsluitend tijd vóór
      1 augustus 2003 en na 1 juli 2022, in aanmerking wordt genomen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel23
  - number: 23.1.b.ii
    text: |-
      bij overlijden van een gepensioneerd minister uitsluitend tijd vóór 1 juli 1999 in aanmerking wordt genomen, indien
      de keuze is gedaan, bedoeld in [artikel 13f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13f
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13f
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '23.2'
    text: |-
      Indien er bij overlijden recht bestaat op meer dan een bijzonder partnerpensioen vindt het eerste lid
      overeenkomstige toepassing, met dien verstande dat voor de berekening van het bijzonder partnerpensioen ontleend
      aan elk partnerschap waaraan een eerder partnerschap voorafgaat slechts de diensttijd meetelt die samenloopt of
      geacht kan worden samen te lopen met de duur van het partnerschap.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel23
  - number: '23.3'
    text: |-
      Wanneer er in verband met hetzelfde overlijden behalve partnerpensioen ook recht op een of meer bijzondere
      partnerpensioenen bestaat, wordt het partnerpensioen verminderd met deze bijzondere partnerpensioenen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel23
  - number: '25.1'
    text: |-
      Het wezenpensioen bedraagt 14 procent van het ouderdomspensioen als de wees een verzorger als bedoeld in
      [artikel 18, tweede lid][ref1], heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel18
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '25.2'
    text: |-
      Het wezenpensioen bedraagt 28 procent van het ouderdomspensioen als er geen sprake is van een verzorger als bedoeld
      in [artikel 18, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel18
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '25.3'
    text: |-
      Onze Minister stelt het wezenpensioen, bedoeld in het eerste lid, opnieuw vast als de wees geen verzorger als
      bedoeld in [artikel 18, tweede lid][ref1], meer heeft. Het gewijzigde bedrag van het wezenpensioen gaat in met
      ingang van de eerste dag van de maand na de maand waarin de verzorger is overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel18
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: '25.4'
    text: 'Voor de toepassing van dit artikel is het ouderdomspensioen het ouderdomspensioen:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel25
  - number: 25.4.a
    text: |-
      voordat het pensioen is verlaagd of verhoogd met toepassing van [artikel 13e, tweede lid][ref1], [13f][ref2],
      [13g][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13e
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel13f
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel13g
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13e
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 13f
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 13g
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 25.4.b
    text: |-
      zonder rekening te houden met de toepassing [13e, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13e
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13e
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '27.1'
    text: |-
      Het gezamenlijk bedrag van de wezenpensioenen gaat een bedrag gelijk aan 70 procent van het bedrag waarvan die
      pensioenen zijn afgeleid niet te boven.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel27
  - number: '27.2'
    text: |-
      Indien wegens toepassing van het eerste lid de wezenpensioenen worden verminderd, geschiedt deze vermindering in
      evenredigheid naar de omvang van die pensioenen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel27
  - number: '28'
    text: |-
      Het tijdelijk pensioen is gelijk aan het pensioen waarop recht zou bestaan indien de vermiste op de dag van zijn
      vermissing was overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel28
  - number: 28a.1
    text: |-
      Als het partnerpensioen, het bijzonder partnerpensioen, het wezenpensioen of het tijdelijk pensioen op de dag van
      ingang op jaarbasis minder bedraagt dan het bedrag bedoeld in [artikel 66, eerste lid, van de Pensioenwet][ref1],
      wordt dit pensioen afgekocht door een uitkering ineens, mits de betrokkene daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
  - number: 28a.2
    text: |-
      Bij de vaststelling van de uitkering ineens wordt aangesloten bij de berekening die in overeenkomstige gevallen
      wordt gehanteerd ten aanzien van overheidswerknemers. [Artikel 66, achtste lid, van de Pensioenwet][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
  - number: 28a.3
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de afkoop van een klein pensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel28a
  - number: 28b
    text: |-
      Een partnerpensioen, een bijzonder partnerpensioen en een wezenpensioen wordt geïndexeerd op een wijze die gelijk
      is aan de indexering die wordt gehanteerd ten aanzien van het partnerpensioen, het bijzonder partnerpensioen en het
      wezenpensioen van overheidswerknemers.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel28b
  - number: '29'
    text: |-
      Wij, de Raad van State gehoord, verklaren het uitzicht of het recht op pensioen geheel of gedeeltelijk vervallen,
      indien degene die dat uitzicht of recht heeft:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel29
  - number: 29.a
    text: |-
      zich in vreemde krijgsdienst of in vreemde overheidsdienst heeft begeven en naar Ons oordeel zich daardoor uit
      Nederlands nationaal oogpunt beschouwd onwaardig heeft gedragen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel29
  - number: 29.b
    text: |-
      wegens enig strafbaar feit is veroordeeld waaruit naar Ons oordeel blijkt dat hij zich uit Nederlands nationaal
      oogpunt beschouwd onwaardig heeft gedragen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel29
  - number: '30.1'
    text: |-
      In bijzondere gevallen kunnen Wij, de Raad van State gehoord, een door of als gevolg van de toepassing van
      [artikel 29][ref1] vervallen uitzicht of recht op pensioen geheel of gedeeltelijk herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel29
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '29'
        hoofdstuk: '6'
        afdeling: Tweede
  - number: '30.2'
    text: |-
      Wanneer een vervallen recht op pensioen geheel of gedeeltelijk wordt hersteld gaat het pensioen in op de eerste dag
      van de maand waarin het herstel heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel30
  - number: '31.1'
    text: |-
      Het recht op pensioen vervalt indien gedurende vijf achtereenvolgende jaren iedere invordering achterwege is
      gebleven.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel31
  - number: '31.2'
    text: |-
      Wij kunnen, de Raad van State gehoord, een door of als gevolg van de toepassing van het vorige lid vervallen recht
      of uitzicht op pensioen herstellen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel31
  - number: '34.1'
    text: |-
      Indien een partner aan wie reeds een partnerpensioen is toegekend, hetzij krachtens deze wet, hetzij krachtens
      een andere regeling, ter zake van een later huwelijk of een latere aanmelding eveneens recht op partnerpensioen
      verkrijgt, hetzij krachtens deze wet, hetzij krachtens een andere regeling, wordt samenlopende tijd slechts
      medegeteld bij de berekening van het pensioen waarbij die tijd het hoogste bedrag oplevert.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34
  - number: '34.2'
    text: |-
      Onder een pensioen krachtens een andere regeling als bedoeld in het vorige lid wordt verstaan een pensioen ten
      laste van de Nederlandse schatkist - anders dan ingevolge wettelijke garanties of ingevolge overneming van de
      verplichting tot betaling -, ten laste van Aruba, van Curaçao, van Sint Maarten, van de openbare lichamen Bonaire,
      Sint Eustatius of Saba, van een publiekrechtelijk lichaam in Nederland of in evengenoemde landen, dan wel ten laste
      van een door het openbaar gezag in Nederland, in die landen of in die openbare lichamen ingesteld fonds.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34
  - number: 34a.1
    text: |-
      Indien een wees die reeds recht op een wezenpensioen heeft, hetzij krachtens deze wet, hetzij krachtens een andere
      regeling, daarna eveneens recht op enig ander wezenpensioen verkrijgt, hetzij krachtens deze wet, hetzij krachtens
      een andere regeling, wordt voor de berekening van de ouderdomspensioenen waarvan die wezenpensioenen zijn of geacht
      moeten worden te zijn afgeleid, samenlopende tijd slechts medegeteld bij de berekening van het pensioen, waarbij
      die tijd het hoogste bedrag oplevert.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34a
  - number: 34a.2
    text: |-
      [Artikel 34, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel34
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '34'
        hoofdstuk: '7'
        afdeling: Tweede
  - number: 34b
    text: |-
      Op uitkeringen en pensioenen op grond van deze afdeling is beslag mogelijk overeenkomstig de voorschriften van het
      gemene recht.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34b
  - number: 34c
    text: Onverschuldigd betaalde uitkeringen of pensioenen op grond van deze afdeling kunnen worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34c
  - number: 34d.1
    text: |-
      Met uitkeringen en pensioenen op grond van deze afdeling kan worden verrekend hetgeen de gewezen of gepensioneerde
      minister of zijn nagelaten betrekkingen zelf als zodanig aan de Staat verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34d
  - number: 34d.2
    text: |-
      Verrekening als bedoeld in het eerste lid kan plaatshebben ondanks gelegd beslag of toegepaste korting als bedoeld
      in [artikel 34e, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel34e
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 34e
        hoofdstuk: 7a
        afdeling: Tweede
  - number: 34d.3
    text: |-
      Verrekening als bedoeld in het eerste lid is slechts in zoverre geldig als een beslag op die uitkeringen of
      pensioenen geldig zou zijn, met dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding
      is verschuldigd eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 34e.1
    text: |-
      Op uitkeringen en pensioenen op grond van deze afdeling kan ten behoeve van een schuldeiser van de gewezen
      of gepensioneerde minister of zijn nagelaten betrekkingen een korting worden toegepast, mits de gewezen of
      gepensioneerde minister onderscheidenlijk zijn nagelaten betrekkingen de vordering van de schuldeiser erkent of
      erkennen dan wel het bestaan van de vordering blijkt uit een in kracht van gewijsde gegane rechterlijke uitspraak
      dan wel uit een authentieke akte.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34e
  - number: 34e.2
    text: Korting is slechts in zoverre geldig als een beslag op die uitkering of dat pensioen geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34e
  - number: 34e.3
    text: |-
      Beslag, faillissement, surseance van betaling en toepassing ten aanzien van de gewezen of gepensioneerde minister
      of zijn nagelaten betrekkingen van de schuldsaneringsregeling natuurlijke personen sluiten korting uit.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34e
  - number: 34f
    text: |-
      Voor de toepassing van [artikel 475b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      worden, onverminderd [artikel 34d, tweede lid][ref2], en [artikel 34e, derde lid][ref3], verrekening en korting
      gelijkgesteld met beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel34d
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel34e
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475b
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 34d
        hoofdstuk: 7a
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 34e
        hoofdstuk: 7a
        afdeling: Tweede
  - number: 34g
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de uitkering of
      het pensioen geschiedt de verdeling naar evenredigheid der inschulden, voor zover niet de ene schuldeiser voorrang
      heeft boven de anderen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34g
  - number: 34h.1
    text: |-
      Overdracht, inpandgeving of elke andere handeling waardoor de gewezen of gepensioneerde minister of zijn nagelaten
      betrekkingen enig recht op zijn uitkering of pensioen aan een derde toekent of toekennen, is slechts geldig voor
      dat deel van de uitkering of het pensioen waarop beslag geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34h
  - number: 34h.2
    text: |-
      Een volmacht tot voldoening of invordering van de uitkering of het pensioen is slechts geldig indien zij
      schriftelijk is verleend en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34h
  - number: 34i
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlasten de Staat, indien een gegeven opdracht tot de betaling of afgifte niet meer tijdig kon worden
      ingetrokken, toen de Staat van het eindigen van de volmacht kennis kreeg.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34i
  - number: 34j
    text: |-
      Beslag omvat in dit hoofdstuk ook de invordering, bedoeld in [artikel 19 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel34j
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: 39a
    text: |-
      Ten aanzien van de uitkeringen die zijn toegekend ter zake van een ontslag vóór het tijdstip van inwerkingtreding
      van de [Wet aanpassing uitkeringsduur Appa][ref1], blijft de uitkeringsduur van kracht zoals deze gold op de dag
      voorafgaand aan dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0031991
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0031991
  - number: 39b.1
    text: |-
      Uitkeringen ter zake van een ontslag vóór het tijdstip van inwerkingtreding van de
      [Wet aanpassing pensioenleeftijd Appa][ref1] worden verstrekt overeenkomstig de regels zoals die golden op de dag
      voorafgaand aan dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0033719
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0033719
  - number: 39b.2
    text: |-
      De uitkering van een betrokkene ter zake van een ontslag vóór het tijdstip van inwerkingtreding van de
      [Wet aanpassing pensioenleeftijd Appa][ref1] wordt voortgezet tot zijn pensioengerechtigde leeftijd indien zij is
      toegekend op grond van [artikel 7, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033719
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel7
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0033719
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '7'
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 40a.1
    text: |-
      De opbouw van aanspraken op het ouderdomspensioen geschiedt overeenkomstig de [artikelen 13 tot en met 14][ref1]
      voor dienstjaren vanaf 1 januari 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '13'
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 40a.2
    text: |-
      Voor dienstjaren vóór 1 januari 2014 geschiedt de opbouw overeenkomstig de regels zoals die golden op de dag
      voorafgaand aan de inwerkingtreding van de [Wet aanpassing pensioenleeftijd Appa][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033719
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0033719
  - number: 40a.3
    text: |-
      Indien de betrokkene op 31 december 2013 pensioen opbouwt op grond van [hoofdstuk 4][ref1], wordt de in het
      tweede lid bedoelde opbouw vastgesteld met als pensioengrondslag de grondslag die zou gelden als hij met ingang
      van 1 januari 2014 zou zijn ontslagen. Daarbij wordt de laatstelijk genoten wedde niet aangepast. De opgebouwde
      aanspraak wordt vervolgens geïndexeerd op een wijze die aansluit bij de indexering van de opbouw die wordt
      gehanteerd ten aanzien van het ouderdomspensioen van overheidswerknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 40a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40a
  - number: 40b.1
    text: |-
      Pensioenaanspraken en pensioenen kunnen met toepassing van [artikel 13h][ref1] worden verlaagd vanaf de
      inwerkingtreding van de [Wet aanpassing pensioenleeftijd Appa][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13h
      [ref2]: https://wetten.overheid.nl/BWBR0033719
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13h
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0033719
  - number: 40b.2
    text: |-
      Bij de toepassing kunnen tevens de pensioenaanspraken worden verlaagd die zijn opgebouwd vóór de inwerkingtreding
      van de [Wet aanpassing pensioenleeftijd Appa][ref1]. De verlaging kan eveneens betrekking hebben op de pensioenen
      die zijn gebaseerd op pensioenaanspraken die zijn opgebouwd vóór die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0033719
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0033719
  - number: 40b.3
    text: De toepassing vindt plaats ter zake van een verlaging door het pensioenfonds ABP vanaf 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40b
  - number: 40c.1
    text: |-
      Ingeval aan een gewezen minister reeds voor 1 juli 2022 een uitkering als bedoeld in [hoofdstuk 3][ref1] is
      toegekend, wordt in afwijking van [artikel 13c, tweede lid][ref2], het opbouwpercentage niet gehalveerd:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 13c
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 40c.1.a
    text: |-
      gedurende de eerste drie jaar en twee maanden van de uitkeringsperiode, te rekenen vanaf de datum waarop de
      uitkering is toegekend; en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40c
  - number: 40c.1.b
    text: |-
      gedurende de periode waarin de uitkering langer dan drie jaar en twee maanden wordt genoten en betrokkene voor 55
      procent of meer algemeen invalide is.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40c
  - number: 40c.2
    text: |-
      Bij een ontslag van een belanghebbende die op 1 juli 2022 het ambt van minister vervult is in afwijking van
      [artikel 13c, tweede lid][ref1], het eerste lid van overeenkomstige toepassing, tenzij de belanghebbende dit ambt
      opnieuw bekleedt in het eerstvolgende kabinet dat aantreedt na die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13c
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 40c.3
    text: |-
      Het opbouwpercentage, bedoeld in [artikel 13c][ref1], is nul indien de betrokkene daarom reeds voor 1 juli 2022
      heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13c
        hoofdstuk: '4'
        afdeling: Tweede
  - number: 40d.1
    text: |-
      De partner aan wie op grond van deze wet een partnerpensioen is toegekend in verband met een overlijden voor
      1 oktober 2022 en die de pensioengerechtigde leeftijd nog niet heeft bereikt maar geen recht heeft op een
      nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1], ontvangt tot hij die leeftijd bereikt een
      toeslag op zijn volgens [artikel 22][ref2] berekende pensioen, indien dat is berekend of mede is berekend over
      diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 40d.2
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het partnerpensioen tellend jaar na 31 december 1985
      2,5 procent van 75 procent van het tot een jaarbedrag herleide bedrag van de nabestaandenuitkering en de vakantie-
      uitkering ingevolge de [Algemene nabestaandenwet][ref1], zoals die wet geldt op 1 januari van het jaar waarin recht
      op partnerpensioen ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 40d.3
    text: |-
      Indien de partner, bedoeld in het eerste lid, bij de toekenning van het partnerpensioen jonger was dan 40 jaar,
      wordt de toeslag toegekend voor een periode van ten hoogste 12 maanden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40d
  - number: 40d.4
    text: |-
      De toeslag wordt met ingang van 1 januari van ieder jaar aangepast volgens de regels, bedoeld in
      [artikel 105, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 40d.5
    text: Het recht op toeslag eindigt met ingang van de dag waarop de partner de pensioengerechtigde leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40d
  - number: 40d.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op de partner aan wie op grond van deze wet een partnerpensioen
      is toegekend in verband met een overlijden binnen vijf jaar na 1 oktober 2022 en die de pensioengerechtigde
      leeftijd nog niet heeft bereikt, maar geen recht heeft op een nabestaandenuitkering ingevolge de
      [Algemene nabestaandenwet][ref1], indien de overledene aantoonbaar reeds ten tijde van het tijdstip van
      inwerkingtreding van de [Wet aanpassing Appa en enkele andere wetten 2021][ref2] ongeneeslijk ziek was en daardoor
      of door andere blijvende omstandigheden voor die datum geen aanvullende nabestaandenverzekering bij een verzekeraar
      heeft kunnen afsluiten tegen ten hoogste de dubbele basispremie.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0045388
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0045388
  - number: 40e.1
    text: |-
      De partner aan wie op grond van deze wet een partnerpensioen is toegekend in verband met een overlijden voor 1
      oktober 2022 en die recht heeft op een nabestaandenuitkering ingevolge de [Algemene nabestaandenwet][ref1], waarop
      inkomen in mindering wordt gebracht, heeft recht op een toeslag op zijn volgens [artikel 22][ref2] berekende
      pensioen, indien dat is berekend of mede is berekend over diensttijd na 31 december 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 40e.2
    text: |-
      Recht op toeslag heeft eveneens de partner aan wie in het tijdvak van 1 juli 1996 tot 1 juli 1999
      nabestaandenpensioen is toegekend en op wiens uitkering ingevolge de [Algemene nabestaandenwet][ref1] in dat
      tijdvak inkomen in mindering is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 40e.3
    text: |-
      De toeslag bedraagt jaarlijks voor elk voor de berekening van het partnerpensioen tellend jaar na 31 december
      1985 2,5 procent van het verschil tussen 75 procent van het tot een jaarbedrag herleide bedrag van de
      nabestaandenuitkering en de vakantie-uitkering ingevolge de [Algemene nabestaandenwet][ref1], zoals die wet geldt
      op 1 januari van het jaar waarin recht op partnerpensioen ontstaat, zonder de vermindering en het verminderde
      bedrag. De toeslag bedraagt niet meer dan 75 procent van het in de eerste volzin eerstbedoelde bedrag en kan niet
      negatief zijn. De toeslag wordt nader vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 40e.3.a
    text: |-
      met ingang van 1 januari van ieder jaar volgens de regels, bedoeld in [artikel 105, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '105'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 40e.3.b
    text: |-
      bij iedere nadere vaststelling van de vermindering van een uitkering ingevolge de [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 40e.4
    text: |-
      [Artikel 40d, vierde, vijfde en zesde lid][ref1], zijn mede van toepassing op de toeslag ingevolge dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel40d
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 40d
        hoofdstuk: '8'
        afdeling: Tweede
  - number: 40f.1
    text: |-
      De partner die de pensioengerechtigde leeftijd nog niet heeft bereikt, heeft tot de dag waarop hij die leeftijd
      bereikt recht op een toeslag op zijn volgens [artikel 22][ref1] berekende pensioen ten bedrage van 15 procent van
      dat pensioen voor zover dat is berekend over diensttijd vóór 1 augustus 2003 en van 7,5 procent voor zover berekend
      over de diensttijd na 31 juli 2003, behoudens het bepaalde in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel22
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 40f.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een pensioen als daar bedoeld verstaan het pensioen nadat
      eventueel [hoofdstuk 17][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 40f.3
    text: |-
      De compensatie bedraagt niet meer dan het voor overheidswerknemers gestelde grensbedrag voor compensatie voor
      premiebetaling AOW/Anw over nabestaandenpensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40f
  - number: 40f.4
    text: Dit artikel is niet van toepassing ten aanzien van degene die recht heeft op bijzonder partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40f
  - number: 40g.1
    text: |-
      In afwijking van [artikel 18, vierde lid][ref1], heeft de wees van een minister, gewezen minister of gepensioneerd
      minister die voor 1 juli 2022 is overleden, recht op een wezenpensioen, zolang hij de leeftijd van eenentwintig
      jaren nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel18
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40g
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: Tweede
  - number: 40g.2
    text: |-
      In afwijking van [artikel 115, vierde lid][ref1], eindigt het wezenpensioen, bedoeld in het eerste lid, op de
      laatste dag van de maand waarin de wees de leeftijd van 21 jaar heeft bereikt of betrokken is bij een partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel115
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40g
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '115'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: 40h.1
    text: |-
      Een wees met recht op wezenpensioen heeft, voor zover dat pensioen is berekend over de diensttijd voor 1 oktober
      2022, vanaf de eerste dag van de maand waarin hij de leeftijd van vijftien jaar heeft bereikt recht op een toeslag
      van vijftien procent van het wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40h
  - number: 40h.2
    text: |-
      Voor de toepassing van het tweede lid wordt onder wezenpensioen verstaan het pensioen nadat eventueel
      [hoofdstuk 17][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40h
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '17'
        afdeling: Vierde
  - number: 40h.3
    text: |-
      De in het eerste lid bedoelde compensatie gaat niet uit boven het fiscale maximum als bedoeld in de
      [Wet op de loonbelasting 1964][ref1] een bedraagt niet meer dan het voor wezen van overheidswerknemers gestelde
      grensbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40h
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 40h.4
    text: |-
      Voor de toepassing van [artikel 27][ref1] wordt de toeslag op grond van dit artikel buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel27
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel40h
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: Tweede
  - number: 45a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden omtrent de bepaling van het
      partnerpensioen, het bijzonder partnerpensioen, het wezenpensioen en het tijdelijk pensioen in verband met de
      inwerkingtreding van de [Wet aanpassing pensioenleeftijd Appa][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033719
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0033719
  - number: 45a.2
    text: |-
      Bij deze regels worden de voorwaarden en maxima in acht genomen die op grond van de
      [Wet op de loonbelasting 1964][ref1] gelden voor een op een middelloonstelsel gebaseerd partnerpensioen en
      wezenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '50'
    text: 'Voor de toepassing van het bij of krachtens deze afdeling bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50
  - number: 50.a
    text: 'kamerlid: lid van de Tweede Kamer der Staten-Generaal;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50
  - number: 50.b
    text: |-
      gewezen kamerlid: hij die uit hoofde van een aftreden als lid van de Tweede Kamer der Staten-Generaal uitzicht
      heeft op pensioen krachtens deze afdeling;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50
  - number: 50.c
    text: |-
      gepensioneerd kamerlid: hij die uit hoofde van een aftreden als lid van de Tweede Kamer der Staten-Generaal recht
      heeft op pensioen krachtens deze afdeling;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50
  - number: 50.d
    text: |-
      kamerlidtijd of kamerlidjaar: tijd of jaar, gedurende welke belanghebbende als lid van de Tweede Kamer der Staten-
      Generaal is opgetreden en waarover schadeloosstelling is genoten;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50
  - number: 50.e
    text: |-
      berekeningsgrondslag: het bedrag van de op de dag vóór het aftreden geldende
      schadeloosstelling en aanspraak op eindejaarsuitkering, bedoeld in de [artikelen 2][ref1] en
      [2b van de Wet schadeloosstelling leden Tweede Kamer][ref2], waarbij de evenbedoelde aanspraak wordt berekend over
      de schadeloosstelling, bedoeld in [artikel 2 van de evengenoemde wet][ref3], verminderd met het in dat artikel
      bedoelde percentage van de vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: 2b
      - id: ref3
        bwb_id: BWBR0004939
        artikel: '2'
  - number: 50a.1
    text: |-
      Voor de toepassing van het bij of krachtens deze afdeling bepaalde wordt tevens als kamerlidtijd
      aangemerkt een periode van tijdelijk ontslag wegens zwangerschap en bevalling of ziekte, ingevolge
      [artikel X 10 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: 50a.2
    text: |-
      Deze wet is niet van toepassing op het kamerlid dat is benoemd in de plaats die is opengevallen als
      gevolg van het tijdelijk ontslag van een lid wegens zwangerschap en bevalling of ziekte, ingevolge
      [artikel X 12 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_12
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_12
  - number: '51.1'
    text: |-
      Een kamerlid heeft met ingang van de dag van zijn aftreden, indien hij nog niet de pensioengerechtigde leeftijd
      heeft bereikt en hij niet zonder onderbreking weer als kamerlid optreedt, recht op een uitkering op de voet van de
      volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
  - number: '51.2'
    text: |-
      De uitkering of, na verrekening ingevolge [artikel 54][ref1], het restant van de uitkering wordt niet uitbetaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 51.2.a
    text: voor zover en voor de periode dat de belanghebbende daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
  - number: 51.2.b
    text: voor de periode dat aan de belanghebbende rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
  - number: 51.2.c
    text: |-
      voor de periode dat de belanghebbende zicht onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
  - number: 51.2.d
    text: |-
      voor de periode dat de belanghebbende buiten Nederland woont of verblijf houdt anders dan wegens vakantie, met dien
      verstande dat [artikel 19, tiende, dertiende en veertiende lid, van de Werkloosheidswet][ref1] alsmede de regels
      die op grond van genoemd tiende lid gesteld zijn, van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
  - number: 51.2.e
    text: |-
      voor de periode dat de belanghebbende vakantie geniet buiten de bij algemene maatregel van bestuur gestelde
      periode.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
  - number: '51.3'
    text: |-
      Het niet uitbetalen van de uitkering op grond van het tweede lid, is niet van invloed op de met toepassing van
      [artikel 52, eerste of tweede lid][ref1], berekende duur waarvoor de uitkering is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
  - number: '51.4'
    text: |-
      Een tijdelijk ontslag als bedoeld in [artikel X 10 van de Kieswet][ref1], wordt niet aangemerkt als aftreden als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '51.5'
    text: |-
      Indien de belanghebbende is geboren in Aruba, Curaçao, Sint Maarten, Bonaire, Sint Eustatius of Saba, of indien hij
      daar ten minste vijf jaren aaneengesloten heeft verbleven, wordt voor de toepassing van het tweede lid, onder d,
      voor «buiten Nederland» gelezen «buiten het Koninkrijk der Nederlanden».
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel51
  - number: '52.1'
    text: |-
      De uitkering wordt toegekend voor een duur gelijk aan de tijd waarin de belanghebbende kamerlid is geweest, maar
      ten minste voor de duur van twee jaren en ten hoogste voor de duur van drie jaren en twee maanden. Indien de
      belanghebbende met een of meer onderbrekingen kamerlid is geweest, wordt in aanmerking genomen de tijd gedurende
      welke hij kamerlid is geweest in een tijdvak, laatstelijk voor zijn aftreden, waarin zijn kamerlidmaatschap voor
      ten hoogste een zesde deel van dat tijdvak is onderbroken.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52
  - number: '52.2'
    text: |-
      In afwijking van het eerste lid wordt de uitkering toegekend voor de duur van zes maanden, indien de belanghebbende
      korter dan drie maanden kamerlid is geweest.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52
  - number: '52.3'
    text: |-
      Als de belanghebbende op de datum van zijn aftreden vijf jaren of minder verwijderd is van de voor hem van
      toepassing zijnde pensioengerechtigde leeftijd en hij in de daaraan voorafgaande periode hij in het tijdvak van
      twaalf jaren dat direct aan zijn aftreden voorafgaat ten minste tien jaren een functie heeft bekleed als genoemd in
      [artikel 2, tweede lid][ref1], wordt de uitkering voortgezet tot de pensioengerechtigde leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '52.4'
    text: |-
      Voor de berekening van de uitkeringsduur, bedoeld in het eerste lid, en de tien jaren, bedoeld in het derde lid,
      wordt met tijd waarin de belanghebbende kamerlid is geweest gelijkgesteld de tijd waarin hij een functie heeft
      bekleed als genoemd in [artikel 2, tweede lid, onder a en d][ref1]. Indien sprake is van gelijkgestelde tijd als
      bedoeld in de vorige zin wordt met betrekking tot die tijd op dezelfde wijze als in de tweede zin van het eerste
      lid rekening gehouden met onderbrekingen in de uitoefening van deze functies.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: '52.5'
    text: |-
      Voor de toepassing van dit artikel wordt onder kamerlid mede begrepen lid van het Europees Parlement, voorzover dat
      lidmaatschap niet gelijktijdig werd vervuld met het kamerlidmaatschap. Voor de vaststelling van de tijd gedurende
      welke de belanghebbende kamerlid is geweest, telt niet mee de tijd gedurende welke de schadeloosstelling als
      kamerlid niet werd genoten.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52
  - number: '52.6'
    text: |-
      In geval van tussentijds vervallen van de uitkering krachtens [artikel 56, tweede lid, onder b][ref1], wordt
      de volgende uitkering toegekend ten minste tot het tijdstip waarop eerstgenoemde uitkering, indien zij niet was
      vervallen, zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel56
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '56'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52a.1
    text: |-
      De belanghebbende aan wie een uitkering als bedoeld in [artikel 51][ref1] geheel of gedeeltelijk wordt uitbetaald
      en die niet binnen twaalf maanden de pensioengerechtigde leeftijd bereikt, is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel51
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '51'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52a.1.a
    text: in voldoende mate te trachten passende arbeid te vinden;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.1.b
    text: aangeboden passende arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.1.c
    text: mee te werken aan activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.2
    text: 'De belanghebbende voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.2.a
    text: door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.2.b
    text: door eigen toedoen passende arbeid opgeeft;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.2.c
    text: eisen stelt die het aanvaarden of verkrijgen van passende arbeid belemmeren.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.3
    text: |-
      [Artikel 7a, derde lid][ref1], is van overeenkomstige toepassing op een kamerlid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 7a
        hoofdstuk: '3'
        afdeling: Tweede
  - number: 52a.4
    text: 'Dit artikel is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.4.a
    text: |-
      op de belanghebbende die inkomsten geniet ten bedrage van 100% van berekeningsgrondslag, bedoeld in
      [artikel 50, onderdeel e][ref1], of een ambt heeft aanvaard als bedoeld in [artikel 2, tweede lid][ref2], en
      daaruit inkomsten geniet ten bedrage van 70% of meer van de berekeningsgrondslag, bedoeld in artikel 50, onderdeel
      e;


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '50'
        hoofdstuk: '9'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 52a.4.b
    text: |-
      op de belanghebbende die recht heeft op een voortgezette uitkering ingevolge [artikel 53a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52a.4.c
    text: voor de periode dat de belanghebbende verzoekt af te zien van de uitbetaling van de gehele uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52a.5
    text: Dit artikel is niet van toepassing gedurende de eerste drie maanden na het aftreden van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52a
  - number: 52b.1
    text: |-
      De belanghebbende is verplicht door een re-integratiebureau een plan op te laten stellen voor het gericht zoeken
      naar en verwerven van passende arbeid, waarin de activiteiten zijn opgenomen die noodzakelijk zijn om te voldoen
      aan de verplichting, bedoeld in [artikel 52a, eerste lid, onderdeel a][ref1], en het plan, nadat het is goedgekeurd
      door Onze Minister, onder begeleiding van een re-integratiebureau uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52b.2
    text: |-
      Behoudens de gevallen, bedoeld in [artikel 52a, vierde lid][ref1], heeft de belanghebbende vanaf het moment van
      zijn ontslag met in achtneming van de regels, bedoeld in het derde lid, recht op vergoeding van daadwerkelijk
      gemaakte kosten van het plan, bedoeld in het eerste lid, en van de begeleiding en ondersteuning bij de uitvoering
      van het plan.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52b.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
  - number: 52b.3.a
    text: de onderdelen van het plan, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
  - number: 52b.3.b
    text: een tegemoetkoming voor de in het plan opgenomen activiteiten anders dan begeleiding en ondersteuning;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
  - number: 52b.3.c
    text: de eisen die worden gesteld aan een re-integratiebureau als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
  - number: 52b.3.d
    text: de voor vergoeding in aanmerking te nemen kosten, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
  - number: 52b.3.e
    text: het bedrag dat ten hoogste op grond van het tweede lid kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
  - number: 52b.4
    text: |-
      In de regels, bedoeld in het derde lid, kan worden gedifferentieerd naar gelang de afstand die de belanghebbende
      heeft tot de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52b
  - number: 52c.1
    text: |-
      Indien de belanghebbende een bij of krachtens [artikel 52a][ref1] geregelde verplichting niet of niet behoorlijk is
      nagekomen, besluit Onze Minister tot gehele of gedeeltelijke inhouding van de uitkering. Onze Minister is bevoegd
      tot verrekening van de inhouding van de uitkering met betalingen aan belanghebbende op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 52c.2
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52c
  - number: 52d
    text: |-
      De voordracht voor een krachtens de [artikelen 52a][ref1], [52b][ref2] of [52c][ref3] vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-
      Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel52b
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel52c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52a
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 52b
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 52c
        hoofdstuk: '10'
        afdeling: Derde
  - number: '53.1'
    text: De uitkering bedraagt gedurende het eerste jaar 80% en vervolgens 70% van de berekeningsgrondslag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53
  - number: '53.2'
    text: |-
      Indien de belanghebbende op de dag voor zijn aftreden als kamerlid de verhoging
      of een toelage genoot, bedoeld in [artikel 12, eerste lid][ref1], respectievelijk
      [artikel 11, eerste en tweede lid, van de Wet schadeloosstelling leden Tweede Kamer][ref2], wordt de
      berekeningsgrondslag verhoogd met het bedrag van die verhoging respectievelijk toelage, inbegrepen de daarover
      geldende aanspraak op eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel11
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '11'
  - number: '53.3'
    text: |-
      Indien voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een wijziging van het loon is
      overeengekomen, wordt de berekeningsgrondslag, eventueel verhoogd ingevolge het tweede lid, voor de toepassing van
      het eerste lid met ingang van het tijdstip van ingang van die loonswijziging door Onze Minister overeenkomstig de
      wijziging aangepast.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53
  - number: 53a.1
    text: |-
      Indien de belanghebbende op de dag waarop de duur van de uitkering eindigt geheel of gedeeltelijk algemeen invalide
      is, wordt, met inachtneming van [artikel 56][ref1], de uitkering voor de duur van de invaliditeit voortgezet op de
      voet van [artikel 53b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53b
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '56'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53b
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53a.2
    text: |-
      Algemeen invalide, geheel of gedeeltelijk, in de zin van deze wet is hij die als rechtstreeks en objectief
      medisch vast te stellen gevolg van ziekten of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen. Onder de eerstgenoemde
      arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe de betrokkene met zijn krachten en bekwaamheden
      in staat is. Onder deze arbeid wordt niet begrepen arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: 53a.3
    text: |-
      Bij de vaststelling van de mate van algemene invaliditeit wordt buiten beschouwing gelaten of de betrokkene de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53a
  - number: 53a.4
    text: |-
      Indien de betrokkene zonder redelijke grond weigert deel te nemen aan een voor hem gewenste opleiding of scholing
      of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, wordt er bij de vaststelling van de mate
      van algemene invaliditeit van uitgegaan dat die opleiding of scholing is afgerond.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53a
  - number: 53a.5
    text: Bij een algemene invaliditeit van minder dan 25 percent wordt de uitkering niet voortgezet.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53a
  - number: 53b.1
    text: |-
      De voortzetting van de uitkering vindt plaats als aangegeven in het tweede en derde lid en vervolgens als
      aangegeven in het vierde en het vijfde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.2
    text: |-
      De uitkering bedraagt gedurende een periode als aangegeven in het derde lid 70% van de berekeningsgrondslag,
      eventueel verhoogd en aangepast volgens [artikel 53][ref1], bij een algemene invaliditeit van 80% of meer, 60% van
      die berekeningsgrondslag bij een algemene invaliditeit van 55% tot 80% en 40% van die berekeningsgrondslag bij een
      algemene invaliditeit van 25% tot 55%.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.3
    text: |-
      De in het tweede lid bedoelde periode is ten hoogste voor de belanghebbende die op het tijdstip van voortzetting
      van de uitkering:
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.3.58
    text: 'jaar of ouder is: zes jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.3.53
    text: 'jaar of ouder is: drie jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.3.48
    text: 'jaar of ouder is: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.3.43
    text: 'jaar of ouder is: anderhalf jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.3.38
    text: 'jaar of ouder is: een jaar;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.3.33
    text: 'jaar of ouder is: een half jaar, en'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.4
    text: |-
      De uitkering bedraagt na afloop van de volgens het derde lid bepaalde periode een percentage, volgens het
      tweede lid, van een bedrag gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen de
      berekeningsgrondslag, eventueel verhoogd en aangepast volgens [artikel 53][ref1], en het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.5
    text: |-
      Voor de berekening van het in het vierde lid bedoelde bedrag geldt een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de betrokkene op het tijdstip van voortzetting van de uitkering.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.6
    text: |-
      Het minimumloon, bedoeld in het vierde lid, is het tot een jaarbedrag herleide minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1] of, indien het een betrokkene jonger dan 23 jaar betreft, het tot een
      jaarbedrag herleide voor zijn leeftijd geldende minimumloon per maand, bedoeld in [artikel 7, derde lid][ref2],
      en [artikel 8, derde lid, van de genoemde wet][ref3], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 53b.7
    text: |-
      De belanghebbende heeft recht op een aanvulling van de uitkering, indien die uitkering minder bedraagt dan het
      volgens het tweede lid vastgestelde percentage van de berekeningsgrondslag, eventueel verhoogd en aangepast volgens
      [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.8
    text: |-
      De aanvulling is gelijk aan het bedrag dat nodig is om de uitkering te verhogen tot het in het zevende lid bedoelde
      percentage van de berekeningsgrondslag, eventueel verhoogd en aangepast volgens [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53b.9
    text: |-
      In afwijking van het achtste lid is de aanvulling gelijk aan het bedrag dat nodig is om de uitkering te verhogen
      tot het in het tiende lid aangegeven percentage van de berekeningsgrondslag, eventueel verhoogd en aangepast
      volgens [artikel 53][ref1], indien de belanghebbende de keuze heeft gemaakt voor een verlaging van de inhouding
      ingevolge [artikel 106, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '53'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 53b.10
    text: |-
      Het in het negende lid bedoelde percentage bedraagt bij een algemene invaliditeit van 80% of meer 65%, bij een
      algemene invaliditeit van 55% tot 80%: 56% en bij een algemene invaliditeit van 25% tot 55%: 37%.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
  - number: 53b.11
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 106, eerste lid][ref1], worden regels gesteld met
      betrekking tot de verlaging, bedoeld in het negende lid. Onze Minister stelt regels met betrekking tot de wijze
      en het tijdstip waarop het lid van de Tweede Kamer der Staten-Generaal of het gewezen lid van de Tweede Kamer der
      Staten-Generaal de in het negende lid bedoelde keuze, die eenmalig is, kenbaar dient te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel106
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '106'
        hoofdstuk: '18'
        paragraaf: '1'
        afdeling: Vierde
  - number: 53b.12
    text: |-
      Indien de wegens algemene invaliditeit voortgezette uitkering te zamen met inkomsten, bedoeld in
      [artikel 54][ref1], minder bedraagt dan het minimumloon wordt de uitkering verhoogd tot het minimumloon. De
      verhoging bedraagt niet meer dan het verschil tussen de uitkering en het bedrag waarvan deze is afgeleid en tevens
      niet meer dan 30% van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53c.1
    text: |-
      De voortzetting van de uitkering, bedoeld in [artikel 53a][ref1], geschiedt op aanvraag van de belanghebbende en
      voor termijnen van niet langer dan drie jaar, onverminderd het in deze wet bepaalde over herziening of intrekking
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53c.2
    text: |-
      Onze Minister stelt de belanghebbende uiterlijk vier maanden voor het verstrijken van de in het eerste lid bedoelde
      termijn schriftelijk in kennis van de mogelijkheid tot het doen van een aanvraag tot voortzetting van de uitkering
      na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53c
  - number: 53c.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt door de belanghebbende uiterlijk drie maanden voor het
      verstrijken van de in het eerste lid bedoelde termijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53c
  - number: 53c.4
    text: |-
      Indien Onze Minister niet tijdig beslist op een tijdig ingediende aanvraag als bedoeld in het derde lid, wordt de
      uitkering voortgezet tot het tijdstip van de beslissing op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53c
  - number: 53c.5
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt geacht tijdig te zijn ingediend indien Onze Minister de
      kennisgeving, bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving als bedoeld
      in het tweede lid de aanvraag wordt ingediend binnen een maand nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53c
  - number: 53c.6
    text: |-
      Indien de uitkering na afloop van de in het eerste lid bedoelde termijn wordt voortgezet, wordt de uitkering
      berekend op de wijze die van toepassing zou zijn geweest indien die termijn niet zou zijn afgelopen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53c
  - number: 53c.7
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat in bepaalde situaties geen
      termijn geldt dan wel een termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn van drie jaar.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53c
  - number: 53d.1
    text: |-
      Binnen een jaar na het tijdstip waarop de uitkering voor de eerste maal met toepassing van [artikel 53a][ref1]
      is voortgezet, doet Onze Minister een onderzoek instellen ten einde te doen bezien of er als gevolg van gronden
      die invloed hebben op de mate van algemene invaliditeit redenen aanwezig zijn voor herziening of intrekking van
      de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53d.2
    text: |-
      Onze Minister kan ten aanzien van bepaalde groepen algemeen invaliden bepalen dat geen termijn geldt dan wel een
      termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
  - number: 53d.3
    text: |-
      Onze Minister wijzigt ambtshalve of op aanvraag van de belanghebbende het bedrag van de uitkering bij wijziging van
      de mate van algemene invaliditeit.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
  - number: 53d.4
    text: 'Een wijziging van het bedrag van de uitkering gaat in:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
  - number: 53d.4.a
    text: |-
      indien daartoe een aanvraag is ingediend, met ingang van de eerste dag van de maand volgende op die waarin de
      aanvraag is ingekomen;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
  - number: 53d.4.b
    text: |-
      indien de wijziging ambtshalve plaatsvindt, met ingang van de eerste dag van de maand volgende op die waarin de
      beslissing tot wijziging is genomen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
  - number: 53d.5
    text: |-
      De toepassing van [artikel 53a][ref1] wordt ten aanzien van een belanghebbende gestaakt indien en zolang hij niet
      voldoet aan een uitnodiging van Onze Minister zich te onderwerpen aan een onderzoek door een of meer door hem
      aangewezen geneeskundigen ter beantwoording van de vraag, of er nog sprake is van algemene invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53d.6
    text: |-
      Indien degene die recht heeft op wegens algemene invaliditeit voortgezette uitkering inkomsten uit of in
      verband met arbeid geniet, is Onze Minister bevoegd, zolang niet vaststaat of deze arbeid als arbeid, bedoeld in
      [artikel 53a, tweede lid][ref1], kan worden aangemerkt, niet tot herziening of intrekking van de uitkering over te
      gaan. De toepassing van de eerste volzin vindt ten hoogste plaats over een aaneengesloten periode van drie jaren,
      aanvangende op de eerste dag waarover de inkomsten uit of in verband met arbeid als bedoeld in de eerste volzin
      worden genoten. Deze periode wordt geacht niet te zijn onderbroken indien korter dan een maand geen inkomsten uit
      of in verband worden genoten. Na afloop van de in de tweede volzin genoemde periode wordt de in de eerste volzin
      bedoelde arbeid aangemerkt als arbeid, bedoeld in [artikel 53a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53e.1
    text: |-
      Op verzoek van een kamerlid doet Onze Minister een onderzoek instellen door een of meer door hem aangewezen
      geneeskundigen, ter beantwoording van de vraag of het kamerlid dat het verzoek deed algemene invalide is als
      bedoeld in [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 53e.2
    text: |-
      Onze Minister brengt de uitkomst van een onderzoek dat is ingesteld ingevolge het eerste lid ter kennis van de
      verzoeker.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel53e
  - number: '54.1'
    text: |-
      De inkomsten die de belanghebbende geniet, worden bepaald overeenkomstig de regels van de
      [Wet inkomstenbelasting 2001][ref1] en worden met de uitkering verrekend over de maand waarop deze inkomsten
      betrekking hebben of geacht kunnen worden betrekking te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '54.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder inkomsten verstaan het gezamenlijk bedrag dat de belanghebbende
      wegens het verrichten van activiteiten geniet als
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
  - number: 54.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 54.2.b
    text: belastbaar loon uit of in verband met arbeid en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
  - number: 54.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '54.3'
    text: |-
      De in het eerste lid bedoelde verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag
      waarmede de uitkering, vermeerderd met die inkomsten, het bedrag, waarvan de uitkering is afgeleid, overschrijdt.
      Bij de verrekening wordt voor de hoogte van de uitkering de op grond van [artikel 52c, eerste lid][ref1],
      opgelegde inhouding buiten beschouwing gelaten. Wanneer naast recht op een uitkering krachtens deze afdeling
      recht bestaat op een wachtgeld of uitkering krachtens een andere regeling, niet zijnde een uitkering krachtens
      de [Wet schadeloosstelling, uitkering en pensioen leden Europees Parlement][ref2], vindt het vorenstaande ten
      aanzien van bedoeld wachtgeld of uitkering geen toepassing, indien de uitkering krachtens deze afdeling elders voor
      verrekening met wachtgeld of uitkering in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52c
      [ref2]: https://wetten.overheid.nl/BWBR0003251
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 52c
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0003251
  - number: '54.4'
    text: |-
      Indien in het bedrag der inkomsten bedoeld in de vorige leden, is of geacht kan worden te zijn begrepen een
      vergoeding ter zake van de premie [Algemene Ouderdomswet][ref1] en [Algemene nabestaandenwet][ref2], blijft deze
      vergoeding voor de toepassing van dit artikel buiten beschouwing. De vorige volzin is slechts van toepassing voor
      zover de daar bedoelde inkomsten betrekking hebben op een tijdvak gelegen voor 1 juni 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: '54.5'
    text: Kinderbijslag wordt niet aangemerkt als inkomst.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
  - number: '54.6'
    text: |-
      Voor de toepassing van dit artikel ten aanzien van de voortgezette uitkering bedoeld in
      [artikel 52, zesde lid][ref1], en [artikel 53a][ref2], kan Onze Minister andere inkomsten aanmerken als te zijn
      genoten wegens activiteiten bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '52'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 53a
        hoofdstuk: '10'
        afdeling: Derde
  - number: 54a.1
    text: |-
      De belanghebbende is verplicht van het ter hand nemen van enige activiteiten als bedoeld in
      [artikel 54, tweede lid][ref1], terstond mededeling te doen aan Onze Minister, onder opgave, voor zover mogelijk,
      van de inkomsten, die hij uit die activiteiten zal trekken. Zijn de inkomsten niet vooraf op te geven, dan doet
      hij tijdig vóór het verschijnen van elke uitkeringstermijn opgave van de inkomsten, die hij sinds het ter hand
      nemen van de activiteiten of sinds de vorige opgave heeft genoten. Onze Minister geeft nadere voorschriften
      aangaande het doen van mededelingen door de belanghebbende met betrekking tot de activiteiten, bedoeld in
      [artikel 54, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 54a.2
    text: |-
      Brengt de aard van de activiteiten of van de inkomsten mede, dat de inkomsten over een langere termijn moeten
      worden berekend, dan geschiedt de opgave dienovereenkomstig en wordt op de uitkering een vermindering toegepast van
      een voorlopig vastgesteld bedrag onder voorbehoud van verrekening aan het einde van de evenbedoelde termijn. Ten
      aanzien van deze verrekening is [artikel 54][ref1] van toepassing, met dien verstande, dat zij geschiedt over de in
      de vorige volzin bedoelde langere termijn in plaats van over iedere maand afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '54'
        hoofdstuk: '10'
        afdeling: Derde
  - number: 54a.3
    text: |-
      Onze Minister kan bij de vaststelling van het bedrag van de vermindering van de opgave van de belanghebbende
      afwijken.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54a
  - number: 54a.4
    text: |-
      De belanghebbende, aan wie uitkering is toegekend, wordt door het aanvaarden van de uitkering geacht erin
      toe te stemmen, dat allen, die daarvoor naar het oordeel van Onze Minister in aanmerking komen, omtrent zijn
      omstandigheden alle inlichtingen geven, welke voor de uitvoering van dit hoofdstuk noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel54a
  - number: '55.1'
    text: De uitkering, berekend over een maand, wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel55
  - number: '55.2'
    text: |-
      De uitkering wordt niet uitbetaald zolang de belanghebbende niet of niet op de voorgeschreven wijze voldoet aan
      zijn verplichtingen op grond van [artikel 54a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 54a
        hoofdstuk: '10'
        afdeling: Derde
  - number: '56.1'
    text: De uitkering eindigt met ingang van de dag volgende op die, waarop het gewezen kamerlid is overleden.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel56
  - number: '56.2'
    text: 'De uitkering vervalt:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel56
  - number: 56.2.a
    text: met ingang van de dag waarop het gewezen kamerlid de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel56
  - number: 56.2.b
    text: |-
      met ingang van de dag waarop het gewezen kamerlid wederom als kamerlid optreedt dan wel lid wordt van het Europees
      Parlement.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel56
  - number: '56.3'
    text: |-
      De uitkering kan geheel of ten dele vervallen worden verklaard indien de belanghebbende herhaaldelijk niet of niet
      op de voorgeschreven wijze voldoet aan zijn verplichtingen op grond van [artikel 54a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel54a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 54a
        hoofdstuk: '10'
        afdeling: Derde
  - number: '57.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van het gewezen kamerlid wordt aan de partner, van wie de overledene niet
      duurzaam gescheiden leefde, een bedrag uitgekeerd, gelijk aan driemaal het bedrag der uitkering, dat over de
      laatste volle maand aan het gewezen kamerlid is uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel57
  - number: '57.2'
    text: |-
      Laat de overledene geen partner na, van wie hij, onderscheidenlijk zij, niet duurzaam gescheiden leefde, dan
      geschiedt de uitkering ten behoeve van de minderjarige kinderen tot wie de overledene in familierechtelijke
      betrekking stond, of minderjarige kinderen waarover de overledene de pleegouderlijke zorg droeg. Onder
      pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind, als was het een eigen
      kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen, dan geschiedt de uitkering, indien de overledene kostwinner was van ouders, meerderjarige
      kinderen, broeders of zusters, ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel57
  - number: '57.3'
    text: |-
      Laat de overledene geen betrekkingen, als bedoeld in het eerste en tweede lid na, dan kan het aldaar bedoelde
      bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging, indien zijn nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel57
  - number: '58'
    text: |-
      Een persoon die kamerlid is of kamerlid is geweest, heeft met overeenkomstige toepassing van [hoofdstuk 4][ref1] en
      de [artikelen 39c tot en met 40c][ref2] recht op ouderdomspensioen, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel40
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '4'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '40'
        hoofdstuk: '8'
        afdeling: Tweede
  - number: '58.1'
    text: voor «dienstjaar» gelezen wordt «kamerlidjaar»; en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel58
  - number: '58.2'
    text: |-
      voor «[hoofdstuk 3][ref1]»gelezen wordt «[hoofdstuk 10][ref2]».


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '3'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0002691
        hoofdstuk: '10'
        afdeling: Derde
  - number: '60'
    text: |-
      De partner en de gewezen partner van een kamerlid, gewezen kamerlid of gepensioneerd kamerlid heeft met
      overeenkomstige toepassing van de [artikelen 15][ref1], [17][ref2], [21][ref3], [22 tot en met 23a][ref4],
      [28][ref5], [31][ref6] en [34][ref7], alsmede de [artikelen 40d tot en met 40f][ref8] en de nadere regels op
      grond van [artikel 45a][ref9] recht op partnerpensioen of bijzonder partnerpensioen, met dien verstande dat in
      [artikel 40c][ref10] voor «diensttijd» gelezen wordt «kamerlidtijd».


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel21
