        hoofdstuk: '21'
        afdeling: Vijfde
  - number: '140'
    text: |-
      De partner en de gewezen partner van een lid van gedeputeerde staten, gewezen lid van gedeputeerde staten of
      gepensioneerd lid van gedeputeerde staten heeft met overeenkomstige toepassing van de [artikelen 15][ref1],
