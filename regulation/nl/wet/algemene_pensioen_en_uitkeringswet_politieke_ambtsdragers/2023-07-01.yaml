  - number: '61'
    text: |-
      Na het overlijden van een kamerlid, gewezen kamerlid of gepensioneerd kamerlid hebben zijn wezen met
      overeenkomstige toepassing van de [artikelen 18][ref1], [21][ref2], [25][ref3], [27][ref4], [28][ref5],
      [28a][ref6], [31][ref7] en [34a][ref8] alsmede de [artikelen 40g][ref9] en [40h][ref10] en de nadere regels op
      grond van [45a][ref11] recht op een wezenpensioen.


