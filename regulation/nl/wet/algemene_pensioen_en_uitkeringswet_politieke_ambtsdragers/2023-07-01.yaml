  - number: 158a
    text: |-
      De rijksbelastingdienst verstrekt Onze Minister de benodigde gegevens ten behoeve van de verrekening van een
      belanghebbende van inkomsten met een uitkering als bedoeld in de [hoofdstukken 3][ref1], [10][ref2] en [21][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk10
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk21
