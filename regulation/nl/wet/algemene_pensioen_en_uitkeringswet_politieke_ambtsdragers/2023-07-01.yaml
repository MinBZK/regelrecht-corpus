  - number: '155'
    text: |-
      [Hoofdstuk 17][ref1] is van overeenkomstige toepassing ten aanzien van de in deze afdeling bedoelde pensioenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel155
