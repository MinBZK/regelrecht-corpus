        hoofdstuk: '17'
        afdeling: Vierde
  - number: '157'
    text: |-
      Ten aanzien van een pensioen op grond van deze afdeling, waaronder niet begrepen de inbouw- en franchisebedragen,
      is [artikel 105][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel105
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel157
