        artikel: '116'
        hoofdstuk: '18'
        paragraaf: '3'
        afdeling: Vierde
  - number: '160.1'
    text: |-
      Op de bezoldiging van het lid van gedeputeerde staten worden, volgens bij of krachtens algemene maatregel van
      bestuur te stellen regelen, bedragen ingehouden overeenkomstig de inhouding van bedragen op de bezoldiging
      van degene die behoort tot het overheidspersoneel, ter zake van aanspraken bij werkloosheid, ziekte,
      arbeidsongeschiktheid, ouderdom en overlijden. [Artikel 13d][ref1] is van overeenkomstige toepassing op de
      inhouding op de bezoldiging en de schadeloosstelling ter zake van aanspraken op ouderdom en overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 13d
        hoofdstuk: '4'
        afdeling: Tweede
  - number: '160.2'
    text: |-
      Op de uitkering van het gewezen lid van gedeputeerde staten worden, volgens bij of krachtens algemene maatregel van
      bestuur te stellen regelen, bedragen ingehouden overeenkomstig de inhouding van bedragen, terzake van aanspraken
      als bedoeld in het eerste lid, op een werkloosheids- of arbeidsongeschiktheidsuitkering op grond van een voor
      overheidspersoneel getroffen regeling.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160
  - number: '160.3'
    text: |-
      Geen inhouding van bedragen ter zake van aanspraken bij ouderdom en overlijden vindt plaats voor zover tijd niet
      meetelt als pensioendiensttijd en op uitkeringen bedoeld in de [artikelen 133a][ref1], alsmede op een uitkering
      gedurende de tijd dat de betrokkene voor 55 procent of meer algemeen invalide is.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel133a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 133a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 160a.1
    text: |-
      Op aanvraag van een gewezen gedeputeerde draagt de desbetreffende provincie de waarde van de door de aanvrager
      krachtens de [vijfde afdeling][ref1] van deze wet verkregen pensioenaanspraken over, overeenkomstig de bepalingen
      in de [Pensioenwet][ref2] inzake waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0020809
  - number: 160a.2
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: 160a.3
    text: |-
      De waarde van de pensioenaanspraken die zijn verkregen uit hoofde van een recht op uitkering ter zake van ontslag
      of aftreden, wordt gerekend tot de waarde van de pensioenaanspraken, bedoeld in het eerste lid. Voor zover met de
      waarde van de pensioenaanspraken uit hoofde van het recht op uitkering bij de waardeoverdracht geen rekening is
      gehouden, wordt deze waarde na afloop van het recht op uitkering overgedragen, op dezelfde wijze als is bepaald in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160a
  - number: 160a.4
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt de provincie ter uitvoering van dit artikel beschouwd als een
      overdragende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160a
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: 160a.5
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160a
  - number: 160b.1
    text: |-
      Op aanvraag van een gedeputeerde is de desbetreffende provincie verplicht om de waarde van door betrokkene
      opgebouwde pensioenaanspraken aan te wenden ter verwerving van pensioenaanspraken op grond van de
      [vijfde afdeling][ref1] van deze wet. Deze waardeoverdracht geschiedt overeenkomstig de voorwaarden die in de
      [Pensioenwet][ref2] aan een ontvangende pensioenuitvoerder worden gesteld met betrekking tot de waardeoverdracht
      van opgebouwde pensioenaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0020809
  - number: 160b.2
    text: |-
      De overgedragen pensioenaanspraken worden beschouwd als aanspraken krachtens de [vijfde afdeling][ref1]
      van deze wet en behandeld als een geheel met de aanspraken die de gedeputeerde verkrijgt krachtens de
      [vijfde afdeling][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
      [ref2]: https://wetten.overheid.nl/BWBR0002691#AfdelingVijfde
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        afdeling: Vijfde
  - number: 160b.3
    text: |-
      De bij of krachtens [artikel 71 van de Pensioenwet][ref1] gestelde regels zijn van overeenkomstige toepassing op
      de waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
  - number: 160b.4
    text: |-
      Voor de toepassing van de [Pensioenwet][ref1] wordt de provincie ter uitvoering van dit artikel beschouwd als een
      ontvangende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160b
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: 160b.5
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, regels stellen inzake
      de waardeoverdracht van de pensioenaanspraken van een gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel160b
  - number: '162'
    text: |-
      De besluiten ter uitvoering van deze afdeling worden genomen door gedeputeerde staten, het college van burgemeester
      en wethouders onderscheidenlijk het dagelijks bestuur van het waterschap, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162
  - number: 162a
    text: |-
      Op uitkeringen en pensioenen op grond van deze afdeling is beslag mogelijk overeenkomstig de voorschriften van het
      gemene recht.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162a
  - number: 162b
    text: Onverschuldigd betaalde uitkeringen of pensioenen op grond van deze afdeling kunnen worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162b
  - number: 162c.1
    text: |-
      Met uitkeringen en pensioenen op grond van dit hoofdstuk kan worden verrekend hetgeen de gewezen of gepensioneerde
      politieke ambtsdrager of zijn nagelaten betrekkingen zelf als zodanig aan de provincie, de gemeente of het
      waterschap verschuldigd is of zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162c
  - number: 162c.2
    text: |-
      Verrekening als bedoeld in het eerste lid kan plaatshebben ondanks gelegd beslag of toegepaste korting als bedoeld
      in [artikel 162d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel162d
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162c
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 162d
        hoofdstuk: 28a
        afdeling: Vijfde
  - number: 162c.3
    text: |-
      Verrekening als bedoeld in het eerste lid is slechts in zoverre geldig als een beslag op die uitkeringen of
      pensioenen geldig zou zijn, met dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding
      is verschuldigd eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 162d.1
    text: |-
      Op uitkeringen en pensioenen op grond van dit hoofdstuk kan ten behoeve van een schuldeiser van de gewezen
      of gepensioneerde politieke ambtsdrager of zijn nagelaten betrekkingen een korting worden toegepast, mits de
      gewezen of gepensioneerde politieke ambtsdrager onderscheidenlijk zijn nagelaten betrekkingen de vordering van de
      schuldeiser erkent of erkennen dan wel het bestaan van de vordering blijkt uit een in kracht van gewijsde gegane
      rechterlijke uitspraak dan wel uit een authentieke akte.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162d
  - number: 162d.2
    text: Korting is slechts in zoverre geldig als een beslag op die uitkeringen en pensioenen geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162d
  - number: 162d.3
    text: |-
      Beslag, faillissement, surseance van betaling en toepassing ten aanzien van de gewezen of gepensioneerde politieke
      ambtsdrager of zijn nagelaten betrekkingen van de schuldsaneringsregeling natuurlijke personen sluiten korting uit.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162d
  - number: 162e
    text: |-
      Voor de toepassing van [artikel 475b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] worden,
      onverminderd [artikel 162c, tweede lid][ref2], en [artikel 162d, derde lid][ref3], verrekening en korting
      gelijkgesteld met beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel162c
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel162d
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162e
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475b
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 162c
        hoofdstuk: 28a
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0002691
        artikel: 162d
        hoofdstuk: 28a
        afdeling: Vijfde
  - number: 162f
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de uitkeringen
      of pensioenen geschiedt de verdeling naar evenredigheid der inschulden, voor zover niet de ene schuldeiser voorrang
      heeft boven de anderen.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162f
  - number: 162g.1
    text: |-
      Overdracht, inpandgeving of elke andere handeling waardoor de gewezen of gepensioneerde politieke ambtsdrager of
      zijn nagelaten betrekkingen enig recht op zijn uitkering of pensioen aan een derde toekent of toekennen, is slechts
      geldig voor dat deel van de uitkering of het pensioen waarop beslag geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162g
  - number: 162g.2
    text: |-
      Een volmacht tot voldoening of invordering van de uitkering of het pensioen is slechts geldig indien zij
      schriftelijk is verleend en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162g
  - number: 162h
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van de uitkering of het
      pensioen is geëindigd, ontlasten de provincie, de gemeente of het waterschap, indien een gegeven opdracht tot de
      betaling of afgifte niet meer tijdig kon worden ingetrokken, toen de provincie, de gemeente of het waterschap van
      het eindigen van de volmacht kennis kreeg.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162h
  - number: 162i
    text: |-
      Beslag omvat in dit hoofdstuk ook de invordering, bedoeld in [artikel 19 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel162i
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: 163a
    text: |-
      In afwijking van [artikel 130][ref1] is deze afdeling niet van toepassing op gewezen commissarissen van de Koning,
      gewezen burgemeesters en gewezen leden van het dagelijks bestuur van een waterschap die in de vervulling van
      dat ambt overheidswerknemer waren in de zin van de [Wet privatisering ABP][ref2], en wier ontslag of aftreden is
      ingegaan vóór de datum van inwerkingtreding van die bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163a
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '130'
        hoofdstuk: '20'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0007791
  - number: 163b.1
    text: |-
      De [artikelen 132, derde lid][ref1], en [132a tot en met 132c][ref2] zijn niet van toepassing ter zake van een
      ontslag of aftreden dat is ingegaan vóór 27 februari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 163b.2
    text: |-
      De [artikelen 132a tot en met 132c][ref1] zijn niet van toepassing ten aanzien van het eerste ontslag of aftreden
      vanaf 27 februari 2010 van de betrokkenen die:


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: 132a
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 163b.2.a
    text: |-
      op die datum was benoemd als lid van gedeputeerde staten, wethouder, of lid van het dagelijks bestuur van een
      deelgemeente,
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163b
  - number: 163b.2.b
    text: |-
      onmiddellijk na de verkiezingen voor de leden van provinciale staten van 2 maart 2011, onderscheidenlijk de
      verkiezingen voor de gemeenteraad van 3 maart 2010 niet is herbenoemd.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163b
  - number: 163b.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing ten aanzien van een lid van het dagelijks bestuur van een
      waterschap dat geen overheidswerknemer in de zin van de [Wet privatisering ABP][ref1] is, met dien verstande dat
      het betreft de eerstvolgende verkiezingen voor het algemeen bestuur van het waterschap na 27 februari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163b
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 163c.1
    text: |-
      Deze afdeling is van overeenkomstige toepassing op leden van het dagelijks bestuur van een deelgemeente in de zin
      van hoofdstuk V, paragraaf 2, van de [Gemeentewet][ref1], zoals deze paragraaf luidde op de dag voorafgaand aan de
      datum van de verkiezing van de gemeenteraden in 2014, met dien verstande dat gelezen wordt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163c
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: 163c.1.a
    text: 'lid van gedeputeerde staten: lid van het dagelijks bestuur van een deelgemeente;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163c
  - number: 163c.1.b
    text: 'provincie: gemeente;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163c
  - number: 163c.1.c
    text: 'provinciale staten: de raad;'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163c
  - number: 163c.1.d
    text: 'gedeputeerde staten: college van burgemeester en wethouders.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163c
  - number: 163ca.1
    text: 'De uitkering van een betrokkene wordt voortgezet tot zijn pensioengerechtigde leeftijd indien hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.1.a
    text: |-
      op 27 februari 2010 benoemd was als lid van gedeputeerde staten, wethouder of lid van het dagelijks bestuur van
      een deelgemeente,
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.1.b
    text: |-
      in zijn functie herbenoemd is onmiddellijk na de verkiezingen voor de leden van provinciale staten van 2 maart
      2011, onderscheidenlijk de verkiezingen voor de gemeenteraad van 3 maart 2010,
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.1.c
    text: bij zijn herbenoeming ten minste 50 jaar oud was en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.1.d
    text: |-
      voldoet aan de in [artikel 132, tweede lid][ref1], bedoelde eisen ten aanzien van de diensttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 163ca.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een lid van het dagelijks bestuur van een
      waterschap dat geen overheidswerknemer in de zin van de [Wet privatisering ABP][ref1] is, met dien verstande dat
      het betreft de eerstvolgende verkiezingen voor het algemeen bestuur van het waterschap na 27 februari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 163ca.3
    text: 'De uitkering van een betrokkene wordt voortgezet tot zijn pensioengerechtigde leeftijd indien hij:'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.3.a
    text: |-
      op 27 februari 2010 benoemd was als lid van het dagelijks bestuur van een waterschap dat geen overheidswerknemer in
      de zin van de [Wet privatisering ABP][ref1] is,


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 163ca.3.b
    text: |-
      onmiddellijk na de eerstvolgende verkiezingen voor het algemeen bestuur van het waterschap na 27 februari 2010 niet
      is herbenoemd,
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.3.c
    text: bij zijn herbenoeming ten minste vijftig jaar oud is, en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.3.d
    text: |-
      in het tijdvak van twaalf jaren dat aan de datum van herbenoeming voorafgaat ten minste tien jaren lid van het
      dagelijks bestuur is geweest.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.4
    text: |-
      Uitkeringen ter zake van een ontslag of aftreden vóór 27 juli 2013 worden verstrekt overeenkomstig de regels zoals
      die golden op de dag voorafgaand aan dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
  - number: 163ca.5
    text: |-
      De uitkering van een betrokkene ter zake van een ontslag of aftreden vóór 27 juli 2013 wordt voortgezet tot zijn
      pensioengerechtigde leeftijd indien zij is toegekend op grond van [artikel 132, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
  - number: 163ca.6
    text: |-
      [Artikel 132, tweede lid][ref1], is niet van toepassing op een ontslag of aftreden dat is ingegaan voor de datum
      van inwerkingtreding van de [Wet verkorting duur voortgezette uitkering Appa][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0036870
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '132'
        hoofdstuk: '21'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0036870
  - number: 163ca.7
    text: |-
      Een belanghebbende die op de datum van inwerkingtreding van de
      [Wet verkorting duur voortgezette uitkering Appa][ref1] gedeputeerde is, wordt bij ontslag of aftreden een
      uitkering verstrekt overeenkomstig de regels zoals die golden op de dag vóór die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0036870
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163ca
    references:
      - id: ref1
        bwb_id: BWBR0036870
  - number: 163cb.1
    text: |-
      Een belanghebbende die op de datum van inwerkingtreding van de
      [Wet verkorting duur voortgezette uitkering Appa][ref1], lid van gedeputeerde staten, wethouder of lid van het
      dagelijks bestuur van een waterschap is en in dit ambt wordt herbenoemd na de eerstvolgende verkiezingen voor
      provinciale staten, de raad of het algemeen bestuur van het waterschap na die datum, wordt bij aftreden een
      uitkering verstrekt overeenkomstig de regels zoals die golden op de dag voor die datum, indien hij tevens op de
      datum van zijn herbenoeming:


      [ref1]: https://wetten.overheid.nl/BWBR0036870
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163cb
    references:
      - id: ref1
        bwb_id: BWBR0036870
  - number: 163cb.1.a
    text: |-
      negen jaar en zeven maanden of minder verwijderd is van de pensioengerechtigde leeftijd die is vastgesteld voor het
      kalenderjaar vijf jaren na het ontslag of aftreden, en
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163cb
  - number: 163cb.1.b
    text: |-
      in het tijdvak van twaalf jaren dat aan de datum van herbenoeming voorafgaat ten minste tien jaren een functie
      heeft bekleed als genoemd in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163cb
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '2'
        hoofdstuk: '1'
        afdeling: Eerste
  - number: 163cb.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij een herbenoeming van een commissaris van de Koning, een
      burgemeester en een voorzitter van een waterschap.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163cb
  - number: 163d
    text: |-
      Ten aanzien van leden van het dagelijks bestuur van een waterschap die na de waterschapsverkiezingen in 2008 op
      8 januari 2009 zijn herbenoemd, wordt voor de opbouw van het pensioen over de pensioengeldige tijd tot en met
      7 januari 2009 gerekend met de pensioengrondslag gebaseerd op de bezoldiging die het lid van het dagelijks bestuur
      genoot op 7 januari 2009.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163d
  - number: 163e
    text: |-
      Ten aanzien van de uitkeringen die zijn toegekend ter zake van een ontslag of aftreden vóór het tijdstip van
      inwerkingtreding van de [Wet aanpassing uitkeringsduur Appa][ref1], blijft de uitkeringsduur van kracht zoals deze
      gold op de dag voorafgaand aan dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0031991
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel163e
    references:
      - id: ref1
        bwb_id: BWBR0031991
  - number: '164'
    text: |-
      De kosten van de in deze wet bedoelde uitkeringen en pensioenen en de kosten van de overname van en de
      gedeeltelijke vergoeding van de premie die ingevolge de [Algemene Ouderdomswet][ref1] en de Algemene Weduwen- en
      Wezenwet daarover wordt geheven, voor zover niet is bepaald dat deze kosten ten laste van het Algemeen burgerlijk
      pensioenfonds komen, komen ten laste van Hoofdstuk VII van de rijksbegroting, voor zover deze kosten betrekking
      hebben op ministers, gewezen ministers, gepensioneerde ministers, nabestaanden en wezen van gewezen ministers,
      en ten laste van Hoofdstuk II van de rijksbegroting, indien meergenoemde kosten betrekking hebben op leden van de
      Tweede Kamer der Staten-Generaal, gepensioneerde kamerleden, nabestaanden en wezen van deze leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 164a.1
    text: |-
      Onze Minister, gedeputeerde staten van een provincie, het college van burgemeester en wethouders van een
      gemeente en het dagelijks bestuur van een waterschap verstrekken op verzoek van de politieke ambtsdrager
      tijdig zijn gegevens met betrekking tot pensioenaanspraken door middel van het pensioenregister, bedoeld in
      [artikel 51, eerste lid, van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel51
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '51'
  - number: 164a.2
    text: |-
      [Artikel 51, vierde lid, van de Pensioenwet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel51
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '51'
  - number: '165'
    text: |-
      Voor de jaren tot en met de dag voorafgaand aan het tijdstip van inwerkingtreding van de
      [Wet toekomst pensioenen][ref1] dat [artikel 18a van de Wet op de loonbelasting 1964][ref2] geen bepaling kent van
      de pensioenrichtleeftijd, is de pensioenrichtleeftijd 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0048328
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0048328
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18a
  - number: '166'
    text: 'Deze wet kan worden aangehaald als: Algemene pensioen- en uitkeringswet politieke ambtsdragers.'
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel166
  - number: '167.1'
    text: |-
      Behoudens het tweede lid treedt deze wet in werking met ingang van de eerste dag van de maand volgende op die van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel167
  - number: '167.3'
    text: |-
      Met uitzondering van de in het tweede en vierde lid genoemde artikelen en onderdelen van artikelen en van
      de [artikelen 37][ref1], [39, tweede en derde lid][ref2], [43, tweede lid][ref3], [44, tweede lid][ref4],
      [45, tweede lid][ref5], [82][ref6], [84][ref7], [87, tweede lid][ref8], [88, tweede lid][ref9],
      [89, tweede lid][ref10], [118, derde lid][ref11], [128][ref12], [129][ref13] en [163, tweede en derde lid][ref14],
      werkt deze wet terug tot 1 januari 1966.


