        artikel: '40'
        hoofdstuk: '8'
        afdeling: Tweede
  - number: 138.a
    text: gedeputeerde staten in de plaats treden van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel138
  - number: 138.b
    text: |-
      voor «[hoofdstuk 3][ref1]» gelezen wordt «[hoofdstuk 21][ref2]».


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk21
    url: https://wetten.overheid.nl/BWBR0002691/2023-07-01#Artikel138
