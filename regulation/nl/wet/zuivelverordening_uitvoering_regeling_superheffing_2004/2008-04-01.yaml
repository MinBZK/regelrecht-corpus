  - number: '14'
    text: |-
      1 De in [artikel 23, derde lid, van de regeling][ref1] bedoelde verzoeken worden gedaan op een door het
      productschap voorgeschreven formulier.

      2 De in [artikel 23, derde lid, van de regeling][ref2] bedoelde datum is:

        - voor permanente omzetting 1 januari in de betrokken heffingsperiode;
        - voor tijdelijke omzetting 16 februari in de betrokken heffingsperiode.

      3 De producent kan in de heffingsperiode maximaal 30.000 kg referentiehoeveelheid tijdelijk omzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel23
