      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0016539#Artikel19
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel13
