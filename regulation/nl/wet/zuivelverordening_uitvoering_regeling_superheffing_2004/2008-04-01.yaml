articles:
  - number: '1'
    text: |-
      In deze verordening worden de definities gehanteerd van
      [artikel 1 van de Regeling superheffing en melkpremie 2004][ref1]. In aanvulling daarop wordt verstaan onder:









                  voorzitter


                  :


                  de voorzitter van het productschap;




                  registratienummer


                  :


                  het door het productschap gehanteerde registratienummer van de producent;




                  regeling


                  :


                  de [Regeling superheffing en melkpremie 2004][ref2];




                  superheffing


                  :


                  de in [Paragraaf 2][ref3] van de regeling bedoelde heffing;


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016539
      [ref3]: https://wetten.overheid.nl/BWBR0016539#Paragraaf2
