  - number: '8'
    text: |-
      De koper zendt aan de producent die superheffing is verschuldigd, een nota waarop het bedrag is vermeld dat wordt
      ingehouden ingevolge [artikel 16 van de regeling][ref1]. Op de nota worden tevens de gegevens vermeld op basis
      waarvan het te innen bedrag is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel16
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel8
    references:
