  - number: '10'
    text: |-
      1 De in [artikel 9, eerste lid, van de regeling][ref1] bedoelde kennisgeving wordt gedaan op een door het
      productschap voorgeschreven formulier. De in [artikel 9, derde lid, van de regeling][ref2] bedoelde datum is 15
