      2 Bij het in het eerste lid bedoelde formulier worden documenten gevoegd ten bewijze van de overdracht alsmede de
      overeenkomst met betrekking tot de overgang van de referentiehoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0016539#Artikel9
