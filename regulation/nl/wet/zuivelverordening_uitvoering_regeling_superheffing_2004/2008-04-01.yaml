        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016539
        artikel: '5'
  - number: 9a
    text: |-
      De in [artikel 6a, vijfde lid, van de regeling][ref1] bedoelde datum is 1 december in de betrokken heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel6a
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel9a
