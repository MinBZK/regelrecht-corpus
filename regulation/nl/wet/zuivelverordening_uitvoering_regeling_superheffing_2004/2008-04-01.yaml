        artikel: '5'
        paragraaf: '2'
  - number: '3'
    text: |-
      De koper doet vóór 15 mei in de volgende heffingsperiode aan het productschap opgave van de bij hem geregistreerde
      natuurlijke of rechtspersonen met een referentiehoeveelheid die in de heffingsperiode geen melk hebben geleverd,
      onder vermelding van naam, adres en registratienummer.
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel3
  - number: '4'
    text: |-
      1 De koper doet ten aanzien van in de heffingsperiode van producenten ontvangen melk vóór 15 mei in de volgende
      heffingsperiode aan het productschap opgave, op de door het productschap voorgeschreven wijze, van:

        - het totaal van de feitelijk geleverde hoeveelheden melk;
        - het gemiddelde vetgehalte van het totaal van de feitelijk geleverde hoeveelheden melk;
        - het totaal van de toegedeelde kilogrammen melk en vet waarover de producenten beschikken;
        - het totaal van de hoeveelheden melk, na correctie per producent, van de feitelijk geleverde hoeveelheden melk
      op grond van de vergelijking van het geconstateerde gemiddelde vetgehalte met het voor de producent geldende
      representatieve vetgehalte;

      en van de per producent geleverde hoeveelheden melk, onderscheiden naar:

        - de feitelijk geleverde hoeveelheden melk, in totaal en per maand;
        - de hoeveelheid vet van die melk, in totaal en per maand;
        - de hoeveelheden melk, na correctie van de feitelijk geleverde hoeveelheden melk op grond van de vergelijking van
      het geconstateerde gemiddelde vetgehalte met het voor de producent geldende representatieve vetgehalte;

      onder vermelding van naam, adres, registratienummer van de producent.

      2 De koper doet ten aanzien van in de heffingsperiode van anderen dan producenten ontvangen melk desgevraagd opgave
      aan het productschap van:

        - de, per leverancier, aan de koper geleverde hoeveelheden melk, alsmede de hoeveelheid vet van die melk onder
      vermelding van naam en adres van de leverancier, en/of
        - het totaal van de door anderen dan de producenten aan de koper geleverde hoeveelheden melk en de totale
      hoeveelheid vet van die melk.
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel4
  - number: '5'
    text: |-
      De producent die in een heffingsperiode hoeveelheden melk en/of andere zuivelproducten rechtstreeks verkoopt of
      overdraagt doet vóór 15 mei in de volgende heffingsperiode daarvan opgave aan het productschap, op een door het
      productschap voorgeschreven formulier.
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel5
  - number: '6'
    text: |-
      1 Het melkequivalent van room en boter wordt vastgesteld overeenkomstig artikel 12, eerste lid, onderdeel a en b,
      van de commissieverordening.

      2 Voor de vaststelling van het melkequivalent van kaas wordt 1 kg kaas gelijkgesteld met 9,5 kg melk. Rekening
      houdend met het drogestofgehalte en het vetgehalte van de betrokken kaassoort kan een lagere factor dan 9,5
      worden gehanteerd, indien de producent ten genoegen van het productschap aantoont dat voor de bereiding van die
      kaassoort een lagere hoeveelheid melk wordt gebruikt. Dit geldt niet, indien de kaas is bereid uit melk waaraan
      vet is onttrokken en het betrokken melkvet bij de vaststelling van de grondslag voor de eventuele heffing niet
      is meegeteld.

      3 Voor de vaststelling van het melkequivalent van andere zuivelproducten dan bedoeld in het eerste en tweede lid
      wordt:

        - indien het yoghurt, pap, vla en andere vloeibare zuivelproducten betreft, de factor 1 gehanteerd;
        - indien het kwark betreft, de factor 3 gehanteerd.

      4 Indien de in het derde lid bedoelde producten zijn bereid uit melk waaraan melkvet is onttrokken en het betrokken
      melkvet bij de vaststelling van de grondslag voor de eventuele heffing is meegeteld, wordt met inachtneming hiervan
      een lagere hoeveelheid vastgesteld.

      5 Indien de in het derde lid bedoelde producten zijn bereid uit melk waaraan melkvet is toegevoegd, en het
      betrokken melkvet bij de vaststelling van de grondslag voor de eventuele heffing niet is meegeteld, wordt met
      inachtneming hiervan een hogere hoeveelheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel6
  - number: '7'
    text: |-
      De koper stelt de in [artikel 4][ref1] bedoelde hoeveelheden melk en vet vast overeenkomstig het bepaalde
      bij en krachtens de [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref2] (Verordeningenblad
      Bedrijfsorganisatie, 25 november 2005, nr. 67), dan wel op grond van een andere methodiek welke naar het oordeel
      van de voorzitter voldoende waarborgen biedt voor een nauwkeurige vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0016873#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017209
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel7
    references:
