        bwb_id: BWBR0016539
        artikel: '16'
  - number: '9'
    text: |-
      De in [artikel 5, derde lid, van de regeling][ref1] bedoelde melding wordt gedaan op een door het productschap
      voorgeschreven formulier. De in [artikel 5, derde lid, van de regeling][ref2] bedoelde datum is 16 februari in de
      betrokken heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0016539#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016539#Artikel5
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel9
    references:
