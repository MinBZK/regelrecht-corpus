    text: |-
      De in de [artikelen 3][ref1], [4][ref2] en [5][ref3] van deze verordening bedoelde opgaven worden volledig, naar
      waarheid en met inachtneming van de voorgeschreven onderscheidingen en aanwijzingen gedaan en worden gedateerd en
      ondertekend bij het productschap ingediend binnen de gestelde termijnen en met de voorgeschreven periodiciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0016873#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016873#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0016873#Artikel5
    url: https://wetten.overheid.nl/BWBR0016873/2008-04-01#Artikel2
    references:
