  - number: '23'
    text: |-
      1 Met betrekking tot de vaststelling van de uitslag van een proeve van bekwaamheid is
      [artikel 22, behoudens het vijfde lid][ref1], van overeenkomstige toepassing.

      2 Indien de examinator een proeve van bekwaamheid positief beoordeelt, tekent hij dit aan op het examenformulier en
      tekent hij namens de minister de verlenging dan wel de hernieuwde afgifte aan op het document waarop bewijzen van
      bevoegdheid en bevoegdverklaringen zijn weergegeven.

      3 Indien de examinator een proeve van bekwaamheid negatief beoordeelt, tekent hij dit aan op het examenformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel22
