preamble:
  text: |-
    Gelet op de artikelen 14, vierde lid, en 16 van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: Minister van Verkeer en Waterstaat;

      b. praktijkexamen: het onderzoek naar de mate waarin een kandidaat voldoet aan de bedrevenheideisen, bedoeld in de
      Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001, ten behoeve van de afgifte van
      een bewijs van bevoegdheid of een bevoegdverklaring;

      c. proeve van bekwaamheid: het onderzoek naar de mate waarin een kandidaat voldoet aan de bedrevenheideisen,
      bedoeld in de Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001, ten behoeve van de
      verlenging of de hernieuwde afgifte van een bevoegdverklaring;

      d. protocolhouder: een geregistreerde dan wel gekwalificeerde opleidingsinstelling of een luchtvaartmaatschappij
      die met de minister een protocol betreffende het toedelen van examinatoren heeft afgesloten;

      e. theorie-examen: het onderzoek naar de mate waarin een kandidaat voldoet aan de kenniseisen, bedoeld in de
      Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001, ten behoeve van afgifte van een
      bewijs van bevoegdheid of een bevoegdverklaring.

      2 In deze regeling wordt met de volgende toevoegingen bedoeld:

      a. A: de categorie vliegtuigen (Aeroplanes);

      b. H: de categorie helikopters (Helicopters);

      c. FB: de categorie vrije ballonnen (Free Balloons);

      e. E: boordwerktuigkundige (Cockpit Flight Engineer).
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel1
  - number: '2'
    text: |-
      De examenplanning, de examenlocaties en het verschuldigde examengeld worden bekendgemaakt in de Aeronautical
      Information Circular, serie B.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel2
  - number: '3'
    text: |-
      1 De kandidaat of de door hem gemachtigde opleidingsinstelling doet een aanvraag voor het afleggen van een theorie-
      examen op een door de minister beschikbaar gesteld aanvraagformulier.

      2 De minister verstrekt de kandidaat voor een theorie-examen een toelatingsbewijs, dat:

      a. voor ATPL, CPL, behoudens CPL(FB), en IR geldig is voor alle vakken, voor ten hoogste vier examenpogingen per
      vak en voor ten hoogste zes examenzittingen;

      b. voor CPL(FB), PPL en RPL geldig is voor alle vakken en meerdere pogingen;

      c. het persoonsgebonden registratienummer en de geldigheidsduur van het toelatingsbewijs, te weten 18 maanden,
      gerekend vanaf de eerste dag van de maand na de maand waarin voor het eerst aan een examenzitting is deelgenomen,
      vermeldt.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel3
  - number: '4'
    text: |-
      De kandidaat wordt slechts toegelaten tot het examen indien hij het verschuldigde examengeld heeft betaald en hij
      voor aanvang van het examen op de examenlocatie de volgende bescheiden overlegt:

      a. een wettig en geldig legitimatiebewijs, en

      b. een geldig toelatingsbewijs als bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel3
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017237
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Voor het afleggen van een theorie-examen is de kandidaat examengeld verschuldigd, volgens het door de minister
      vastgestelde en bekendgemaakte tarief. Voor de betaling van het examengeld ontvangt de kandidaat een factuur.

      2 Indien de examineringinstantie uiterlijk acht dagen vóór de voor het desbetreffende theorie-examen vastgestelde
      datum schriftelijk bericht heeft ontvangen, dat de kandidaat niet aan het examen of een onderdeel daarvan zal
      deelnemen, zal het examengeld, verminderd met de administratiekosten, aan de kandidaat worden gerestitueerd.

      3 Bij het niet dan wel niet tijdig verschijnen op het theorie-examen of op grond van geweigerde toegang als
      gevolg van het niet kunnen tonen van een geldig legitimatiebewijs of een geldig toelatingsbewijs als bedoeld in
      [artikel 3, tweede lid][ref1], dan wel bij ongeldigverklaring van de uitslag van het desbetreffende theorie-examen,
      wordt het examengeld niet gerestitueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel3
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017237
        artikel: '3'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De kandidaat rondt het gehele theorie-examen af binnen 18 maanden, gerekend vanaf de eerste dag van de maand na
      de maand waarin de kandidaat voor het eerst heeft deelgenomen aan een examenzitting.

      2 Indien de kandidaat niet in ten hoogste vier examenpogingen per vak binnen ten hoogste zes examenzittingen voor
      alle vakken van het desbetreffende theorie-examen is geslaagd, is de kandidaat afgewezen.

      3 In het geval van het tweede lid vervallen de reeds behaalde resultaten en dient de kandidaat opnieuw het gehele
      theorie-examen af te leggen.

      4 De minister kan, in overleg met de opleidingsinstelling, bepalen dat de kandidaat een extra theorieopleiding
      volgt, voordat het theorie-examen opnieuw wordt afgelegd.

      5 In afwijking van het tweede lid geldt voor het theorie-examen voor RPL, PPL en CPL(FB) geen beperking ten aanzien
      van het aantal examenpogingen en -zittingen.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel6
  - number: '7'
    text: |-
      Bij het afnemen van een theorie-examen gelden wat betreft de examenvakken en duur van het examen de volgende eisen:

      a. voor ATPL, CPL, behoudens CPL(FB), en IR: de eisen, gesteld in bijlage 1 bij JAR-FCL 1.470;

      b. voor PPL(A) en RPL(A) respectievelijk PPL(H) en RPL(H): de eisen, gesteld in Bijlage 1 bij JAR-FCL 1.130 & 1.135
      respectievelijk Bijlage 1 bij JAR-FCL 2.130 & 2.135;

      c. voor CPL(FB): de eisen, gesteld in [tabel 1 van bijlage 1][ref1], behorende bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017237
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017237
  - number: '8'
    text: |-
      1 De theorie-examens worden schriftelijk afgenomen.

      2 In afwijking van het eerste lid wordt het theorie-examen voor CSR mondeling afgenomen tijdens het praktijkexamen.

      3 De taal waarin de theorie-examens worden afgenomen is:

      a. voor ATPL, CPL, behoudens het CPL(FB), en IR: Engels;

      b. voor CPL(FB), PPL en RPL: Nederlands.

      4 De minister stelt de inhoud van de examens vast.

      5 Ten behoeve van het theorie-examen wordt een huishoudelijk reglement opgesteld.

      6 Het gebruik van andere dan de in [tabel 2 van bijlage 1][ref1], behorende bij deze regeling, vermelde materialen
      is tijdens het theorie-examen niet toegestaan.

      7 Na afloop van het theorie-examen wordt het gemaakte examenwerk tezamen met de verstrekte materialen, bedoeld in
      het zesde lid, en de examenopgaven ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0017237
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017237
  - number: '9'
    text: |-
      1 Tegen de kandidaat die tijdens het afleggen van het theorie-examen onregelmatigheden pleegt, kunnen maatregelen
      worden getroffen.

      2 Vastgestelde onregelmatigheden dienen door de surveillant onmiddellijk schriftelijk te worden gemeld aan de
      minister. Zo nodig wordt het niet-toegestane materiaal door de surveillant in beslag genomen en onmiddellijk
      overgedragen aan de minister.

      3 Voorafgaand aan het opleggen van een maatregel wordt de kandidaat gehoord. Mogelijk in beslag genomen materiaal
      kan na het horen worden teruggegeven aan de kandidaat.

      4 De kandidaat en de opleidingsinstelling worden van de maatregel schriftelijk in kennis gesteld.

      5 Als maatregel, bedoeld in dit artikel, kan de minister de uitslag van het desbetreffende theorie-examen ongeldig
      verklaren.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel9
  - number: '10'
    text: |-
      1 De beoordeling in hoeverre de kandidaat aan de kenniseisen voldoet, wordt uitgedrukt in een percentage van het
      totaal per vak toe te kennen aantal punten.

      2 Een kandidaat is geslaagd voor een vak indien ten minste 75% van het totaal aan het desbetreffende vak toegekend
      aantal punten is behaald.

      3 Het eindresultaat van de beoordeling per examen luidt:

      a. indien alle vakken zijn behaald binnen het toegestane aantal pogingen en examenzittingen, bedoeld in
      [artikel 7][ref1]: geslaagd;

      b. in de overige gevallen: afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel7
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017237
        artikel: '7'
        paragraaf: '2'
  - number: '11'
    text: |-
      Na het afleggen van een of meer vakken dan wel de afronding van het theorie-examen, voorziet de minister de
      kandidaat van een resultaatbrief.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel11
  - number: '12'
    text: |-
      1 De kandidaat die het niet eens is met de uitslag van het theorie-examen kan binnen 14 dagen na de dag waarop de
      resultaatbrief is ontvangen schriftelijk een met redenen omkleed verzoek om herziening bij de minister indienen.

      2 Het verzoekschrift wordt ondertekend en bevat de naam en het adres van de kandidaat, alsook het registratienummer
      van diens toelatingsbewijs.

      3 Op verzoek kan de kandidaat, bedoeld in het eerste lid, inzage krijgen in het theorie-examen.

      4 De minister neemt binnen tien weken na ontvangst van het verzoekschrift een beslissing op het verzoek.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel12
  - number: '13'
    text: |-
      Een praktijkexamen en een proeve van bekwaamheid worden afgenomen op een luchtvaartuig dan wel een STD, die daartoe
      gekwalificeerd is op grond van de [Regeling kwalificatie STD’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010764
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010764
  - number: '14'
    text: |-
      1 De kandidaat of een door hem daartoe gemachtigde opleidingsinstelling doet een aanvraag voor het afleggen
      van een praktijkexamen of proeve van bekwaamheid op een door de minister dan wel een protocolhouder verstrekt
      aanvraagformulier.

      2 Indien de opleidingsinstelling op het aanvraagformulier verklaart dat de kandidaat de vereiste opleiding
      binnen de maximale termijn heeft doorlopen dan wel dat de kandidaat die een geïntegreerde opleiding volgt, het
      desbetreffende theorie-examen heeft behaald en voldoende is voorbereid op het praktijkexamen, verstrekt de minister
      dan wel een protocolhouder de aanvrager een examenformulier.

      3 Indien een kandidaat die een aanvraag doet voor het afleggen van het praktijkexamen voor het bewijs van
      bevoegdheid CPL(FB) aantoont dat het desbetreffende theorie-examen is behaald en aan de ervaringseisen is voldaan,
      verstrekt de minister de kandidaat een examenformulier.

      4 De minister dan wel een protocolhouder verstrekt de aanvrager van een proeve van bekwaamheid de desbetreffende
      examenformulieren.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel14
  - number: '15'
    text: |-
      1 De kandidaat laat zich ten behoeve van het afleggen van een praktijkexamen of proeve van bekwaamheid een
      geautoriseerde examinator als bedoeld in [Hoofdstuk 2 van de Regeling examinatoren voor luchtvarenden 2004][ref1]
      toedelen door:

      a. een protocolhouder; of

      b. de minister.

      2 De datum, tijdstip en locatie waarop het praktijkexamen of de proeve van bekwaamheid wordt afgelegd, worden
      vastgesteld door degene die krachtens het eerste lid de examinator toedeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0017236#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017236
        hoofdstuk: '2'
  - number: '16'
    text: |-
      1 Een kandidaat is voor het afleggen van een praktijkexamen of proeve van bekwaamheid een vergoeding verschuldigd
      aan:

      a. indien [artikel 15, eerste lid, onderdeel a][ref1], van toepassing is: de protocolhouder, voor zover deze de
      kosten doorberekent;

      b. indien [artikel 15, eerste lid, onderdeel b][ref2], van toepassing is: de minister.

      2 Het bedrag van de vergoeding, bedoeld in het eerste lid, wordt vastgesteld op grondslag van
      [artikel 4 van de Regeling examinatoren voor luchtvarenden 2004][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0017237#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0017236#Artikel4
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017237
        artikel: '15'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017237
        artikel: '15'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017236
        artikel: '4'
  - number: '17'
    text: |-
      De kandidaat wordt slechts toegelaten tot het praktijkexamen of de proeve van bekwaamheid indien hij voor aanvang
      aan de examinator, bedoeld in [artikel 15][ref1], de volgende bescheiden overlegt:

      a. een wettig en geldig legitimatiebewijs; en

      b. een examenformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel15
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017237
        artikel: '15'
        paragraaf: '3'
  - number: '18'
    text: |-
      1 De kandidaat dan wel de opleidingsinstelling draagt zorg voor de beschikbaarheid van een luchtvaartuig of STD,
      voor zover van toepassing, voor het afleggen van een praktijkexamen of een proeve van bekwaamheid.

      2 Praktijkexamens en proeven van bekwaamheid voor een ATPL, CFEL of een multi-pilot type bevoegdverklaring worden
      uitgevoerd in een STD als bedoeld in [artikel 13][ref1], tenzij er geen STD beschikbaar is die het voor een
      examenonderdeel vereiste niveau van kwalificatie heeft, dan wel er voor het desbetreffende type luchtvaartuig geen
      gekwalificeerde STD voorhanden is.

      3 De examenonderdelen die niet geëxamineerd kunnen worden in een STD, worden afgenomen in een luchtvaartuig van het
      desbetreffende type of de desbetreffende klasse.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel13
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017237
        artikel: '13'
        paragraaf: '3'
  - number: '19'
    text: |-
      1 Een praktijkexamen en een proeve van bekwaamheid bestaan uit examensecties. Examensecties zijn onderverdeeld in
      examenitems, die uitsluitend positief of negatief kunnen worden beoordeeld.

      2 Voor de beoordeling van examenitems worden met betrekking tot vliegers van vliegtuigen en helikopters, alsmede
      met betrekking tot boordwerktuigkundigen, de volgende toleranties toegepast:

      a. voor ATPL(A) respectievelijk ATPL(H): de toleranties, bedoeld in bijlage 1 bij JAR-FCL 1.240 en 1.295,
      onderdelen 13 en 14, respectievelijk JAR-FCL 2.240 en 2.295, onderdelen 13 en 14;

      b. voor CFEL: de toleranties, bedoeld in bijlage 1 bij JAR-FCL 4.240;

      c. voor CPL(A) respectievelijk CPL(H): de toleranties, bedoeld in bijlage 1 bij JAR-FCL 1.170, onderdelen 12 en 13,
      respectievelijk bijlage 1 bij JAR-FCL 2.170, onderdelen 12 en 13;

      d. voor PPL(A) of RPL(A) respectievelijk PPL(H) of RPL(H): de toleranties, bedoeld in bijlage 1 bij JAR-FCL 1.130
      en 1.135, onderdelen 17 en 18, respectievelijk bijlage 1 bij JAR-FCL 2.130 en 2.135, onderdelen 17 en 18;

      e. voor IR(A) respectievelijk IR(H):de toleranties, bedoeld in bijlage 1 bij JAR-FCL 1.210, onderdelen 12 en 13,
      respectievelijk bijlage 1 bij JAR-FCL 2.210, onderdelen 12 en 13;

      f. voor een type- of klassebevoegdverklaring (A) respectievelijk (H) respectievelijk (E): de toleranties, bedoeld
      in bijlage 1 bij JAR-FCL 1.240 en 1.295, onderdelen 13 en 14, respectievelijk bijlage 1 bij JAR-FCL 2.240 en 2.295,
      onderdelen 13 en 14 respectievelijk bijlage 1 bij JAR-FCL 4.240.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel19
  - number: '20'
    text: |-
      1 Bij het afnemen van een praktijkexamen wordt ten aanzien van de bewijzen van bevoegdheid uitgegaan van de
      volgende eisen en procedures, met dien verstande dat alle examensecties binnen ten hoogste 6 maanden worden
      behaald:

      a. voor ATPL(A) respectievelijk ATPL(H): de eisen, bedoeld in JAR-FCL 1.295 en bijlage 1 bij JAR-FCL 1.240 en
      1.295, 1 - 12, respectievelijk JAR-FCL 2.295 en bijlage 1 bij JAR-FCL 2.240 en 2.295, 1 - 12;

      b. voor CFEL: de eisen, bedoeld in bijlage 1 bij JAR-FCL 4.240;

      c. voor CPL(A) respectievelijk CPL(H): de eisen, bedoeld in JAR-FCL 1.170 en bijlage 1 bij JAR-FCL 1.170, 1 - 11
      respectievelijk 2.170 en bijlage 1 bij JAR-FCL 2.170, 1 - 11;

      d. voor PPL(A) respectievelijk PPL(H): de eisen, bedoeld in JAR-FCL 1.135 en bijlage 1 bij JAR-FCL 1.130 en 1.135,
      6 - 16 respectievelijk JAR-FCL 2.135 en bijlage 1 bij JAR-FCL 2.130 en 2.135, 6 - 16;

      e. voor RPL(A), RPL(H) respectievelijk CPL(FB):

      1°. de kandidaat heeft instructie gevolgd op dezelfde klasse vliegtuig, hetzelfde type helikopter
      respectievelijk dezelfde klasse vrije ballon als waarop het examen wordt afgelegd, wat betreft
      RPL(A) en RPL(H) in overeenstemming met de eisen gesteld aan opleidingsluchtvaartuigen in
      [bijlage 2 bij de Regeling opleidingsinstellingen voor luchtvarenden 2001][ref1],

      2°. extra vlieg- respectievelijk vaarinstructie kan worden vereist nadat de kandidaat is afgewezen en wordt vereist
      indien de kandidaat niet in twee pogingen alle secties heeft behaald,

      3°. de kandidaat mag een onbeperkt aantal examenpogingen doen,

      4°. het praktijkexamen kan geheel, respectievelijk gedeeltelijk wat betreft de niet voltooide secties, opnieuw
      worden afgelegd indien het examen wordt afgebroken door de examinator,

      5°. iedere manoeuvre of procedure van het examen mag door de kandidaat worden herhaald,

      6°. de examinator kan het examen afbreken indien de vaardigheid, waarvan de kandidaat blijk geeft, een volledig
      nieuw examen vereist, en

      7°. de examinator is niet betrokken bij de bediening van het luchtvaartuig tenzij diens tussenkomst noodzakelijk is
      in het belang van de veiligheid of teneinde vertraging van overig verkeer te voorkomen.

      2 Onverminderd het eerste lid is bij het afnemen van het praktijkexamen [bijlage 2][ref2], behorende bij deze
      regeling van toepassing. Van [deze bijlage][ref3] kan worden afgeweken indien de strikte naleving ervan in het
      concrete geval niet nodig is en een onevenredig nadeel voor de kandidaat zou opleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0012923
      [ref2]: https://wetten.overheid.nl/BWBR0017237
      [ref3]: https://wetten.overheid.nl/BWBR0017237
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel20
    references:
