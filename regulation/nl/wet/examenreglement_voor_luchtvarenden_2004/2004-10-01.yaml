  - number: '26'
    text: |-
      1 Om de minister desgevraagd van advies te dienen en te ondersteunen wat betreft de theorie-examinering betreffende
      ATPL, CPL en IR respectievelijk PPL en RPL kan een Nationaal Expert Team ATPL/CPL/ IR en een Nationaal Expert Team
      CPL(FB)/PPL/RPL instellen.

      2 Om de minister desgevraagd van advies te dienen en bij te staan wat betreft het standaardiseren en bewaken van de
      kwaliteit van de praktijkexamens kan de minister een Nationaal Expert Team-Praktijk instellen.

      3 Het Nationaal Expert Team-Praktijk kan subcommissies, met de benaming standaardisatiecommissies instellen.
    url: https://wetten.overheid.nl/BWBR0017237/2004-10-01#Artikel26
  - number: '27'
    text: |-
      1 Een Nationaal Expert Team bestaat uit een door de minister vast te stellen aantal leden, die door de minister
      worden benoemd voor een periode van ten hoogste 3 jaar. De leden kunnen telkens voor ten hoogste 3 jaar worden
      herbenoemd.

      2 Leden van een Nationaal Expert Team als bedoeld in [artikel 26, eerste lid][ref1], kunnen worden benoemd uit de
      kring van deskundigen met betrekking tot de relevante theorie-examenvakken.

      3 Leden van het Nationaal Expert Team-Praktijk als bedoeld in [artikel 26, tweede lid][ref2],
      kunnen worden benoemd uit de kring van examinatoren en senior-examinatoren, als bedoeld in de
      [Regeling examinatoren voor luchtvarenden 2004][ref3].

      4 De minister verleent tussentijds ontslag aan een lid van een Nationaal Expert Team:

      a. op eigen verzoek, of

      b. wegens ongeschiktheid voor de functie,

      5 Elk Nationaal Expert Team stelt een reglement vast ter nadere regeling van haar werkzaamheden. Het reglement
      behoeft de goedkeuring van de minister.

      6 De leden van een Nationaal Expert Team als bedoeld in [artikel 26, eerste lid][ref4], houden de inhoud van
      theorie-examenvragen geheim.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel26
