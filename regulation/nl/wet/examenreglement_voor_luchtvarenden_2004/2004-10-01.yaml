  - number: '25'
    text: |-
      1 In afwijking van [artikel 14 tot en met 22][ref1] kan de kandidaat aantonen te voldoen aan de bedrevenheidseisen
      voor afgifte, verlenging of hernieuwde afgifte, bedoeld in de Regeling bewijzen van bevoegdheid en
      bevoegdverklaringen voor luchtvarenden 2001, door met goed gevolg een praktijkexamen of proeve van bekwaamheid af
      te leggen, afgenomen door een examinator die in overeenstemming met de bepalingen van JAR-FCL is geautoriseerd door
      de bevoegde autoriteit van een staat, bedoeld in [artikel 1 van de Regeling aanwijzing JAA-landen 2003][ref2].

      2 Het gestelde in het eerste lid geldt niet:

      a. in het kader van de afgifte van een bewijs van bevoegdheid, daarbij inbegrepen de gelijktijdig af te geven
      algemene en bijzondere bevoegdverklaringen, en

      b. voor houders van een RPL of een CPL(FB).

      3 Een praktijkexamen of proeve van bekwaamheid, bedoeld in het eerste lid, wordt door de kandidaat afgelegd en
      door de examinator afgenomen in overeenstemming met de voor het relevante praktijkexamen of de relevante proeve van
      bekwaamheid op JAR-FCL gebaseerde in de desbetreffende staat geldende regels.

      4 Met betrekking tot de vaststelling van de uitslag van zowel een praktijkexamen als een proeve van bekwaamheid is
      [artikel 22][ref3] van overeenkomstige toepassing.

      5 De uitslag wordt slechts vastgesteld na het overleggen aan de minister van een bewijs dat de examinator is
      toegedeeld in overeenstemming met de in de desbetreffende staat, bedoeld in het eerste en derde lid, geldende
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel14
