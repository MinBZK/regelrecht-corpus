  - number: '21'
    text: |-
      1 Bij het afnemen van een praktijkexamen of een proeve van bekwaamheid wordt, wat betreft de bevoegdverklaringen,
      uitgegaan van de volgende eisen en procedures, met dien verstande dat alle examensecties binnen ten hoogste 6
      maanden worden behaald:

      a. voor IR(A) respectievelijk IR(H): de eisen, bedoeld in JAR-FCL 1.210 en bijlage 1 bij JAR-FCL 1.210, 1 - 11,
      respectievelijk JAR-FCL 2.210 en bijlage 1 bij JAR-FCL 2.210, 1 - 11;

      b. voor type- en klassebevoegdverklaringen (A) respectievelijk (H) respectievelijk (E): de eisen, bedoeld in JAR-
      FCL 1.262 en bijlage 1 bij JAR-FCL 1.240 en 1.295, 1 - 12, respectievelijk JAR-FCL 2.245, 2.262 en bijlage 1 bij
      JAR-FCL 2.240 en 2.295, 1-12, respectievelijk JAR-FCL 4.245, 4.262 en bijlage 1 bij JAR-FCL 4.240;

      c. voor FI(A) en IRI(A) respectievelijk FI(H) en IRI(H): de eisen, bedoeld in JAR-FCL 1.345 en bijlage 1 en 2 bij
      JAR-FCL 1.330 en 1.345 respectievelijk JAR-FCL 2.345 en bijlage 1 bij JAR-FCL 2.330 en 2.345;

      d. voor CRI(A): de eisen bedoeld in bijlage 1 bij JAR-FCL 1.330 en 1.345, examensecties 1, 2, 3, 5 en 7, voor
      zover het betreft meermotorige vliegtuigen, en examensecties 1, 2, 3, 4 en 7, voor zover het betreft eenmotorige
      vliegtuigen;

      e. voor RFI(A) respectievelijk RFI(H): bijlage 1 bij JAR-FCL 1.330 respectievelijk bijlage 1 bij JAR-FCL 2.330,
      waarbij in plaats van FI, RFI moet worden gelezen en de onderdelen 7 en 8 van de bedoelde bijlage niet van
      toepassing zijn. Tijdens het praktijkexamen toont de aanvrager aan in staat te zijn een leerling-vlieger op te
      leiden voor een RPL, inclusief voor- en nabespreking van de vliegles en theorie;

      f. voor klassebevoegdverklaringen in het bewijs van bevoegdheid CPL(FB): de eisen bedoeld in [bijlage 2][ref1],
      behorende bij deze regeling.

      2 Onverminderd het eerste lid is bij het afnemen van het praktijkexamen [bijlage 2][ref2], behorende bij deze
      regeling van toepassing. Van [deze bijlage][ref3] kan worden afgeweken indien de strikte naleving ervan in het
      concrete geval niet nodig is en een onevenredig nadeel voor de kandidaat zou opleveren.


