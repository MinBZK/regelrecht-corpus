  - number: '22'
    text: |-
      1 De uitslag van een praktijkexamen wordt vastgesteld door de minister aan de hand van de gegevens die door de
      examinator, bedoeld in [artikel 15, eerste lid][ref1], op het examenformulier zijn aangetekend.

      2 Als uitslag van een praktijkexamen wordt vastgesteld:

      a. indien alle vereiste examensecties, zonodig na herhaling, positief beoordeeld zijn: geslaagd;

      b. indien de kandidaat voor ten hoogste één examensectie negatief is beoordeeld, en, indien het een praktijkexamen
      voor ATPL of een multi-pilot typebevoegdverklaring met uitzondering van CFEL betreft, voor ten hoogste vijf
      examenitems binnen een examensectie negatief is beoordeeld: gedeeltelijk geslaagd;

      c. indien de kandidaat, na gedeeltelijk geslaagd te zijn, opnieuw examen aflegt voor de niet behaalde sectie en
      wederom negatief wordt beoordeeld voor een sectie: afgewezen;

      d. in alle overige gevallen: afgewezen.

      3 Een kandidaat wordt voor een examensectie negatief beoordeeld indien binnen die sectie een of meerdere
      examenitems negatief zijn beoordeeld.

      4 Indien het resultaat van het praktijkexamen positief is beoordeeld als bedoeld in het tweede lid onder a behoudt
      dit resultaat gedurende zes maanden na het behalen daarvan zijn geldigheid.

      5 De minister voorziet de kandidaat van een resultaatbrief met de uitslag van het praktijkexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0017237#Artikel15
