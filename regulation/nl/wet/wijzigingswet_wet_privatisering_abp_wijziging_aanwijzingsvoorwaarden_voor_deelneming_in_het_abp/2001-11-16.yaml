regulatory_layer: WET
publication_date: '2007-11-13'
valid_from: '2001-11-16'
valid_to: '2007-11-13'
bwb_id: BWBR0012904
url: https://wetten.overheid.nl/BWBR0012904/2001-11-16
preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de voorwaarden voor de aanwijzing van een
    privaatrechtelijk lichaam waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP worden gewijzigd;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012904/2001-11-16#ArtikelAanhef
articles:
  - number: II
    text: >-
      De voorwaarden voor aanwijzing van een lichaam waarvan de werknemers deelnemen in de Stichting Pensioenfonds ABP
      zoals die gelden op de dag voorafgaande aan de datum van inwerkingtreding van deze wet, blijven van toepassing op
      aanwijzingen die op of na die datum plaatsvinden en waarvoor het schriftelijk verzoek dat leidt tot de voordracht,
      bedoeld in artikel 3, eerste lid, voor die datum bij genoemde stichting is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0012904/2001-11-16#ArtikelII
  - number: III
    text: >-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012904/2001-11-16#ArtikelIII
