preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Telecommunicatiewet, de Wet Onafhankelijke
    post- en telecommunicatie autoriteit en een aantal aanverwante wetten en nadere regels aan te passen aan de nieuwe
    richtlijnen en een nieuwe verordening op het gebied van openbare elektronische communicatienetwerken en -diensten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031609/2013-03-15#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 [Artikel 3.14, tweede tot en met vijfde lid][ref1], zoals dit luidt met ingang van het tijdstip van
      inwerkingtreding van deze wet, is tot en met 24 mei 2016 niet van toepassing op een vergunning voor het gebruik van
      frequentieruimte die is verleend voor 25 mei 2011.

      2 [Artikel 3.5, tweede tot en met vijfde lid][ref2], zoals dit luidt met ingang van het tijdstip van
      inwerkingtreding van deze wet, is tot en met 24 mei 2016 niet van toepassing op een vergunning voor het gebruik van
      frequentieruimte die is verleend voor 25 mei 2011.


