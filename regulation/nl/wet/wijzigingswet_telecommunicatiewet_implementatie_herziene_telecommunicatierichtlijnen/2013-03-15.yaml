      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3.18'
  - number: VIb
    text: |-
      [Artikel 7.4a van de Telecommunicatiewet][ref1] is tot een jaar na de datum van inwerkingtreding van dat artikel
      niet van toepassing op overeenkomsten gesloten vóór de datum van inwerkingtreding van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7.4a
