        artikel: '6.5'
  - number: VIa
    text: |-
      Vergunningen voor het verspreiden van programma-aanbod anders dan ter uitvoering van de publieke mediaopdracht die
      zijn verleend of verlengd op grond van de [Telecommunicatiewet][ref1] zoals die luidde tussen 1 januari 2009 en
      het tijdstip van inwerkingtreding van artikel I, onderdeel A, van het bij koninklijke boodschap van 9 april 2008
      ingediende voorstel van wet houdende wijziging van de Telecommunicatiewet in verband met de Nota frequentiebeleid
      2005 () worden geacht te zijn getoetst aan [artikel 3.18 van de Telecommunicatiewet][ref2] zoals dat luidde na
      dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.18
    url: https://wetten.overheid.nl/BWBR0031609/2013-03-15#ArtikelVIa
    references:
