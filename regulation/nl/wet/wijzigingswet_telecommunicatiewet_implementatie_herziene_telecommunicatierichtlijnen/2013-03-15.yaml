  - number: VI
    text: |-
      Na inwerkingtreding van deze wet berust het [Besluit Interoperabiliteit][ref1] op
      [artikel 6.5, tweede en derde lid, van de Telecommunicatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016700
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0031609/2013-03-15#ArtikelVI
