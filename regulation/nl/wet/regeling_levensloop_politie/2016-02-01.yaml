preamble:
  text: |-
    Gelet op artikel 47a van het Besluit algemene rechtspositie politie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
  - number: 1.a
    text: '*ABP:* het Algemeen Burgerlijk Pensioenfonds;'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
  - number: 1.b
    text: |-
      *Pensioenovereenkomst ABP:* de tussen overheidswerkgevers verenigd in de Stichting Verbond Sectorwerkgevers
      Overheid en de Algemene Centrale van Overheidspersoneel op 15 maart 1995 gesloten, en op 14 februari 2013
      gewijzigde, overeenkomst voor een pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
  - number: 1.c
    text: |-
      *ambtenaar:* ambtenaar, bedoeld in [artikel 1, eerste lid, onderdeel i, van het Barp][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.d
    text: |-
      *Barp:* [Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
  - number: 1.e
    text: |-
      *Bbp:* [Besluit bezoldiging politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006517
  - number: 1.f
    text: '*Belastingplan:* verzamelwet fiscale wetgeving in enig jaar;'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
  - number: 1.g
    text: |-
      *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1, eerste lid, onderdeel l, van het Barp][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.h
    text: |-
      *bron:* een van de bronnen, genoemd in [artikel 3, eerste lid][ref1], van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0033849#Artikel3
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033849
        artikel: '3'
  - number: 1.i
    text: |-
      *instelling:* kredietinstelling naar keuze van de ambtenaar, onderscheidenlijk een verzekeraar naar keuze van de
      ambtenaar als bedoeld in [artikel 19g, vierde lid, van de Wet op de loonbelasting 1964][ref1] zoals dit artikel
      luidde op 31 december 2011;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 1.j
    text: |-
      *eindeloopbaanverlof:* verlof dat de ambtenaar wordt verleend op grond van deze regeling direct
      voorafgaand aan zijn ontslag op grond van de [artikelen 87a][ref1], [88][ref2], [88a][ref3], of
      [94, eerste lid, onderdeel h, van het Barp][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel87a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 87a
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '88'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: 88a
      - id: ref4
        bwb_id: BWBR0006516
        artikel: '94'
  - number: 1.k
    text: |-
      *levensloopaanspraken:* de bij een instelling opgebouwde voorziening in geld, vermeerderd met de daarop gekweekte
      inkomsten en de daarmee behaalde rendementen, die is bestemd voor een uitkering gedurende het eindeloopbaanverlof
      of tussentijdsverlof of met ingang van 1 januari 2013 op grond van [artikel 39d, eerste lid, van de Wlb][ref1],
      zoals dit artikel luidt op 1 januari 2013, voor de financiering van elk ander doeleinde;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
  - number: 1.l
    text: |-
      *levenslooprekening:* geblokkeerde rekening op naam van de ambtenaar bij een instelling als bedoeld in
      [artikel 61c van de Uitvoeringsregeling loonbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61c
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61c
  - number: 1.m
    text: |-
      *levensloopverzekering:* verzekering op naam van de ambtenaar bij een instelling als bedoeld in
      [artikel 61d van de Uitvoeringsregeling loonbelasting 2001][ref1], zoals dit artikel luidde op 31 december 2011;


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61d
  - number: 1.n
    text: |-
      *loon:* loon als bedoeld in [artikel 10 van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
  - number: 1.o
    text: |-
      *tussentijdsverlof:* verlof dat de ambtenaar wordt verleend op grond van deze regeling niet zijnde
      eindeloopbaanverlof;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
  - number: 1.p
    text: |-
      *Wlb:* [Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '2.1'
    text: |-
      De ambtenaar kan door middel van het inzetten van bronnen een geldelijke voorziening sparen ten behoeve van een
      periode van tussentijdsverlof of eindeloopbaanverlof of op grond van [artikel 39d, eerste lid, van de Wlb][ref1],
      zoals dit artikel luidt op 1 januari 2013, met ingang van 1 januari 2013 voor de financiering van elk ander
      doeleinde.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
  - number: '2.2'
    text: |-
      De mogelijkheid tot het inzetten van bronnen voor het sparen van een geldelijke voorziening ten behoeve van een
      periode van tussentijdsverlof of eindeloopbaanverlof, geldt tot en met 31 december 2011, of tot en met 31 december
      2021, indien [artikel 39d, eerste lid, van de Wlb][ref1], zoals dit artikel luidt op 1 januari 2013, van toepassing
      is op de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
  - number: '3.1'
    text: |-
      Met inachtneming van deze regeling kan de ambtenaar voor het sparen van de geldelijke voorziening jaarlijks geld-
      en tijdbronnen inzetten die in de zin [artikel 10 van de Wlb][ref1] als loon worden gekwalificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
  - number: '3.2'
    text: |-
      Wanneer als tijdbron vakantie-uren worden ingezet, geldt dat van de in een kalenderjaar toegekende vakantie-uren
      op basis van de [artikelen 17][ref1], [18][ref2] en [19 van het Barp][ref3] maximaal het verschil tussen deze
      toegekende vakantie-uren en 144 vakantie-uren bij een volledige betrekking kan worden afgezien, dan wel, indien de
      ambtenaar een andere betrekking heeft, een evenredig deel hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel19
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '19'
  - number: '3.3'
    text: |-
      Indien van toepassing, wordt de waarde van de bron vastgesteld op de waarde op de dag waarop het bedrag wordt
      gestort op de levenslooprekening of in de levensloopverzekering.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel3
  - number: '3.4'
    text: |-
      De som van de in te zetten bronnen mag per kalenderjaar niet meer bedragen dan het bedrag dat wordt vastgesteld
      met toepassing van [artikel 61e van de Uitvoeringsregeling loonbelasting 2001][ref1] zoals dit artikel luidde op 1
      januari 2006, respectievelijk [artikel 5.6 van de Uitvoeringsregeling loonbelasting 2011][ref2], zoals dit artikel
      luidde op 31 december 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel5
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61e
      - id: ref2
        bwb_id: BWBR0028236
        artikel: '5'
  - number: '3.5'
    text: |-
      In afwijking van het vierde lid geldt, voor de ambtenaar, die op 31 december 2005 de leeftijd
      van 51 jaar maar niet de leeftijd van 56 heeft bereikt, het bedrag dat met toepassing van
      [artikel 109 van de Uitvoeringsregeling loonbelasting 2001][ref1], zoals dit artikel luidde op 1 januari 2006,
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel109
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '109'
  - number: '3.6'
    text: |-
      Voor zover de som van de ingezette bronnen uitgaat boven hetgeen in dit artikel is toegestaan, wordt dit
      meerdere overeenkomstig [artikel 61e, tweede lid, van de Uitvoeringsregeling loonbelasting 2001][ref1],
      zoals dit artikel luidde op 1 januari 2006, respectievelijk
      [artikel 5.6, tweede lid, van de Uitvoeringsregeling loonbelasting 2011][ref2], zoals dit artikel luidde op 31
      december 2011,aan de ambtenaar als loon uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel5
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61e
      - id: ref2
        bwb_id: BWBR0028236
        artikel: '5'
  - number: '4.1'
    text: |-
      De ambtenaar kan bij het bevoegd gezag tot wederopzegging een aanvraag tot het opbouwen van een voorziening
      ingevolge deze regeling indienen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: '4.2'
    text: 'In zijn aanvraag meldt de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: 4.2.a
    text: welke bronnen moeten worden ingezet en tot welk bedrag, en
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: 4.2.b
    text: of de inzet van een bron maandelijks of eenmalig geschiedt, en
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: 4.2.c
    text: of hij reeds levensloopaanspraken heeft opgebouwd.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: '4.3'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: 4.3.a
    text: |-
      een schriftelijke verklaring van de instelling waar de ambtenaar een levenslooprekening heeft geopend of
      levensloopverzekering heeft afgesloten; waarbij de verklaring de gegevens bevat van deze rekening respectievelijk
      verzekering waar de in te zetten bronnen op moeten worden gestort;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: 4.3.b
    text: |-
      in het geval de ambtenaar geen levensloopaanspraken ingevolge een levensloopregeling heeft bij één of meer gewezen
      inhoudingsplichtigen, een schriftelijke verklaring van de ambtenaar hieromtrent;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: 4.3.c
    text: |-
      in het geval de ambtenaar levensloopaanspraken ingevolge een levensloopregeling heeft bij één of meer gewezen
      inhoudingsplichtigen, een schriftelijke verklaring van de ambtenaar over de omvang van de levensloopaanspraken
      op 1 januari van het jaar van de aanvraag en bij welke instelling of instellingen deze levensloopaanspraken wordt
      aangehouden; en
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: 4.3.d
    text: |-
      een schriftelijke verklaring waarin de ambtenaar verklaart dat hij geen loon spaart of in het lopende jaar heeft
      gespaard ingevolge een spaarloonregeling als bedoeld in [artikel 32 van de Wlb][ref1] zoals dit artikel luidde op
      31 december 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
  - number: '4.4'
    text: |-
      De ambtenaar, die een aanvraag voor onbepaalde tijd voor het opbouwen van een voorziening heeft ingediend en
      levensloopaanspraken ingevolge een levensloopregeling heeft bij één of meer gewezen inhoudingsplichtigen, verstrekt
      het bevoegd gezag jaarlijks een schriftelijke verklaring over de omvang van deze levensloopaanspraken en bij welke
      instelling of instellingen deze levensloopaanspraken wordt aangehouden.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel4
  - number: '5.1'
    text: |-
      Het bevoegd gezag beslist binnen zes weken na ontvangst van de aanvraag tot het opbouwen van een voorziening
      ingevolge deze regeling.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel5
  - number: '5.2'
    text: 'Het bevoegd gezag wijst de aanvraag af, indien:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel5
  - number: 5.2.a
    text: |-
      op 1 januari van het kalenderjaar sprake is van de situatie bedoeld in
      [artikel 61e eerste lid, onderdeel b, van de Uitvoeringsregeling loonbelasting 2001][ref1],
      zoals dit artikel luidde op 1 januari 2006, resp.
      [artikel 5.6, eerste lid, onderdeel b, van de Uitvoeringsregeling loonbelasting 2011][ref2], zoals dit artikel
      luidde op 31 december 2011;


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel5
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61e
      - id: ref2
        bwb_id: BWBR0028236
        artikel: '5'
  - number: 5.2.b
    text: |-
      de ambtenaar al deelnemer is aan een spaarloonregeling als bedoeld in [artikel 32 van de Wlb][ref1], zoals dit
      artikel luidde op 31 december 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
  - number: '5.3'
    text: |-
      De aanvraag kan door het bevoegd gezag worden afgewezen indien niet alle met de aanvraag gemoeide bescheiden zijn
      overlegd.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel5
  - number: '6.1'
    text: |-
      Uiterlijk de tweede betaalperiode volgend op de betaalperiode waarin het bevoegd gezag de aanvraag tot het opbouwen
      van een voorziening ingevolge deze regeling heeft toegekend, wordt aangevangen met het storten van maandelijks
      ingezette bronnen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel6
  - number: '6.2'
    text: |-
      Het storten van eenmalig ingezette bronnen vindt plaats in de maand dat deze bron aan de ambtenaar betaalbaar wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel6
  - number: '6.3'
    text: |-
      Stortingen van bronnen waaraan geen inhouding is verbonden, vinden uiterlijk plaats in december van het
      kalenderjaar waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel6
  - number: '6.4'
    text: |-
      Een ambtenaar kan ieder moment schriftelijk verzoeken te stoppen met het sparen voor de geldelijke voorziening.
      Uiterlijk de tweede betaalperiode volgend op de betaalperiode waarin het bevoegd gezag het verzoek heeft ontvangen,
      stopt het bevoegd gezag met het storten van de in te zetten bronnen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel6
  - number: '6.5'
    text: |-
      In het kalenderjaar van stopzetting kan de ambtenaar geen nieuwe aanvraag tot het opbouwen van een voorziening
      ingevolge deze regeling indienen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel6
  - number: '7.1'
    text: 'Over de levensloopaanspraken wordt alleen beschikt:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
  - number: 7.1.a
    text: |-
      ten behoeve van het uitbetalen van een inkomen aan de ambtenaar tijdens het tussentijdsverlof dan wel het
      eindeloopbaanverlof;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
  - number: 7.1.b
    text: |-
      ten behoeve van het uitbetalen van een inkomen aan de ambtenaar tijdens ouderschapsverlof, bedoeld in
      [artikel 41 van het Barp][ref1] of [artikel 6:1 van de Wet arbeid en zorg][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel6
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '6'
  - number: 7.1.c
    text: |-
      op verzoek van de ambtenaar ten behoeve van het omzetten van levensloopaanspraken in een aanspraak op
      ouderdomspensioen op grond van het Pensioenreglement van de Stichting Pensioenfonds ABP, mits na de omzetting de
      aanspraak op de ouderdomspensioen nog blijft binnen de in of krachtens [hoofdstuk IIB van de Wlb][ref1] gestelde
      grenzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid kan met ingang van 1 januari 2013 op grond van [artikel 39d, lid 1, Wlb][ref1],
      zoals dit artikel luidt op 1 januari 2013, ten behoeve van andere doeleinden dan de in het eerste lid genoemde,
      over de levensloopafspraken worden beschikt. Indien evenwel op grond van [artikel 39d, lid 2, van de Wlb][ref2],
      door de ambtenaar in het kalenderjaar 2013 ineens wordt beschikt over de tot dan opgebouwde levensloopaanspraken
      dan is artikel 2 nadien niet meer van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 39d
  - number: '7.3'
    text: |-
      In geval van overlijden van de ambtenaar worden de levensloopaanspraken zo spoedig mogelijk
      na het overlijden uitgekeerd aan de erfgenamen van de ambtenaar, met inachtneming van
      [artikel 61h, tweede lid, van de Uitvoeringsregeling loonbelasting 2001][ref1], zoals dit artikel luidde op 1
      januari 2006, resp. [artikel 5.8, tweede lid, van de Uitvoeringsregeling loonbelasting 2011][ref2], zoals dit
      artikel luidde op 31 december 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61h
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel5
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61h
      - id: ref2
        bwb_id: BWBR0028236
        artikel: '5'
  - number: '7.4'
    text: |-
      In afwijking van het tweede lid worden de levensloopaanspraken niet uitgekeerd aan de erfgenamen, indien de
      ambtenaar bij een levensloopverzekering hiervoor heeft gekozen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
  - number: '7.5'
    text: Bij beëindiging van de dienstbetrekking worden de levensloopaanspraken afgekocht indien de ambtenaar dat verzoekt.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
  - number: '7.6'
    text: |-
      Gedurende de dienstbetrekking worden de levensloopaanspraken op geen enkele wijze afgekocht, vervreemd,
      prijsgegeven dan wel formeel of feitelijk als voorwerp van zekerheid aangeboden anders dan ten behoeve van de
      in [artikel 61k, derde lid, van de Uitvoeringsregeling loonbelasting 2001][ref1], zoals dit artikel luidde op 31
      december 2011, bedoelde verpanding.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61k
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61k
  - number: '7.7'
    text: |-
      In afwijking van het zesde lid mag een levensloopverzekering voorzien in de mogelijkheid van gehele of
      gedeeltelijke afkoop van de levensloopaanspraken voor zover overeenkomstig [artikel 19g, tweede lid, de Wlb][ref1],
      zoals dit artikel luidde op 31 december 2011, over de voorziening wordt beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: '8.1'
    text: Tussentijdsverlof is een periode van onbezoldigd verlof van minimaal twee maanden en maximaal twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel8
  - number: '8.2'
    text: Eindeloopbaanverlof is een periode van onbezoldigd verlof van minimaal twee maanden en maximaal 36 maanden.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het tweede lid is de maximale duur van het eindeloopbaanverlof twaalf maanden indien de periode
      van onbezoldigd verlof wordt genoten direct voorafgaand aan het ontslag op grond van [artikel 88][ref1] of
      [artikel 88a van het Barp][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 88a
  - number: '8.4'
    text: |-
      De minimale duur van twee maanden voor tussentijdsverlof of eindeloopbaanverlof geldt niet indien op de ambtenaar
      [artikel 39d, tweede lid, van de Wlb][ref1], zoals dit artikel op 31 december 2012 luidde, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
  - number: '9.1'
    text: |-
      De ambtenaar dient uiterlijk zes maanden voor de gewenste aanvang van het tussentijdsverlof of eindeloopbaanverlof
      een aanvraag in tot het opnemen van de levensloopaanspraken.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid kan het bevoegde gezag toestaan dat een kortere aanvraagtermijn in acht wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: '9.3'
    text: |-
      De ambtenaar dient desgewenst uiterlijk gelijktijdig met de aanvraag voor ouderschapsverlof als bedoeld in
      [artikel 41 van het Barp][ref1], een aanvraag in tot het opnemen van de levensloopaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel41
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '41'
  - number: '9.4'
    text: 'In zijn aanvraag meldt de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: 9.4.a
    text: de begin- en einddatum van de gewenste verlofperiode;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: 9.4.b
    text: het aantal uren levensloopverlof dat wordt opgenomen;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: 9.4.c
    text: de verdeling van uren levensloopverlof over de weken;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: 9.4.d
    text: |-
      of de stortingen op de levenslooprekening of levensloopverzekering moeten worden beëindigd en indien dit het geval
      is wanneer deze stortingen moeten worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: 9.4.e
    text: de omvang van de levensloopaanspraken die worden aangewend tijdens de verlofperiode; en
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
  - number: 9.4.f
    text: |-
      zijn toestemming dat het bevoegd gezag bij een voor de ambtenaar positieve beslissing op de aanvraag mede namens
      hem aan de instelling verzoekt maandelijks een deel van de levensloopaanspraken dat overeenkomt met het bedrag,
      bedoeld in [artikel 12, eerste lid][ref1], aan het bevoegd gezag beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0033849#Artikel12
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0033849
        artikel: '12'
  - number: '10.1'
    text: 'Het bevoegd gezag kent de aanvraag tot het verlenen van tussentijdsverlof toe, tenzij:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel10
  - number: 10.1.a
    text: ernstige bezwaren voor de bedrijfsvoering voortvloeien uit toekenning van het verzoek;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel10
  - number: 10.1.b
    text: |-
      in de drie jaren voorafgaande aan het moment waarop de gewenste verlofperiode aanvangt aan de ambtenaar reeds
      eerder een tussentijdsverlof op grond van deze regeling is toegekend door hetzelfde bevoegd gezag; of
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel10
  - number: 10.1.c
    text: |-
      de levensloopaanspraken ontoereikend zijn om het op de ambtenaar te verhalen gedeelte van de pensioenbijdrage,
      contributies en loonheffing te voldoen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel10
  - number: '10.2'
    text: |-
      Het bevoegd gezag kent de aanvraag tot het opnemen van eindeloopbaanverlof toe, tenzij de levensloopaanspraken
      ontoereikend zijn om het op de ambtenaar te verhalen pensioenbijdrage, contributies en loonheffing te voldoen.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel10
  - number: '10.3'
    text: |-
      Het bevoegd gezag maakt het besluit op de aanvraag binnen zes weken na de datum waarop deze ontvangen is bekend aan
      de ambtenaar en de levensloopinstelling.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel10
  - number: '10.4'
    text: |-
      Tijdens de periode van tussentijdsverlof of eindeloopbaanverlof kan de ambtenaar geen aanvraag doen tot
      vermindering van de arbeidstijd conform [artikel 13a van het Barp][ref1], dan wel komt de ingevolge artikel 13a van
      het Barp verleende vermindering van de arbeidstijd te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
  - number: '11.1'
    text: Het levensloopverlof kan voor een deel van de voor de ambtenaar geldende arbeidsduur worden toegekend.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel11
  - number: '11.2'
    text: Het levensloopverlof wordt in hele uren toegekend.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel11
  - number: '12.1'
    text: |-
      Tijdens de periode waarin tussentijdsverlof, eindeloopbaanverlof of ouderschapsverlof wordt genoten, verstrekt
      het bevoegd gezag op grond van [artikel 39d van de Wlb][ref1], zoals dit artikel luidde op 31 december 2012, de
      ambtenaar maandelijks een gelijk bedrag dat, tezamen met het daarnaast van het bevoegd gezag genoten loon, niet
      hoger is dan het loon in de maand voorafgaande aan het tussentijdsverlof, eindeloopbaanverlof of ouderschapsverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
  - number: '12.2'
    text: 'Op het bedrag, bedoeld in het eerste lid, wordt indien het tussentijdsverlof betreft ingehouden:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: 12.2.a
    text: |-
      het op de ambtenaar te verhalen gedeelte van de pensioenpremies, als bedoeld in en berekend op voet artikel 4 van
      de Pensioenovereenkomst ABP in samenhang met [artikel 4b van het Bbp][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel4b
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 4b
  - number: 12.2.b
    text: de loonheffing; en
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: 12.2.c
    text: de contributies waarmee de ambtenaar heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: '12.3'
    text: 'Op het bedrag, bedoeld in het eerste lid, wordt indien het eindeloopbaanverlof betreft ingehouden:'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: 12.3.a
    text: |-
      gedurende de eerste twaalf maanden van het eindeloopbaanverlof het op de ambtenaar te verhalen gedeelte van
      de pensioenpremies, als bedoeld in en berekend op de voet van artikel 4, tweede lid, en artikel 5 van de
      Pensioenovereenkomst ABP in samenhang met [artikel 4b van het Bbp][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel4b
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: 4b
  - number: 12.3.b
    text: |-
      na de eerste twaalf maanden van het eindeloopbaanverlof het op de ambtenaar te verhalen gedeelte van de
      pensioenpremies, als bedoeld in en berekend op de voet van artikel 4, tweede lid, onderdelen b, c en d, van de
      Pensioenovereenkomst ABP;
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: 12.3.c
    text: de loonheffing; en
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: 12.3.d
    text: de contributies waarmee de ambtenaar heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: '12.4'
    text: Op het bedrag, bedoeld in het eerste lid, wordt indien het ouderschapsverlof betreft de loonheffing ingehouden.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
  - number: '12.5'
    text: |-
      Het bepaalde in het eerste lid is, op grond van [artikel 39d van de Wlb][ref1], zoals dit artikel luidt op 1
      januari 2013 tot en met 31 december 2021, niet meer van toepassing met ingang van 1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
  - number: '13.1'
    text: |-
      Indien de ambtenaar tijdens de periode waarin tussentijdsverlof of eindeloopbaanverlof wordt genoten ongeschikt
      is tot het verrichten van zijn arbeid wegens ziekte, is hij verplicht daarvan terstond mededeling te doen aan het
      bevoegd gezag. De ambtenaar is tevens verplicht zijn herstel terstond te melden.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel13
  - number: '13.2'
    text: |-
      Indien de ambtenaar tijdens tussentijdsverlof in totaliteit meer dan 28 dagen ziek is, wordt, als de periode waarin
      het tussentijdsverlof wordt genoten is vastgesteld op twaalf maanden, de tussentijdsverlofperiode opgeschort. Als
      de periode waarin het tussentijdsverlof wordt genoten korter is dan twaalf maanden wordt het aantal dagen, bedoeld
      in de eerste volzin, vastgesteld naar rato van die kortere periode.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel13
  - number: '13.3'
    text: |-
      De opschorting van de levensloopperiode, bedoeld in het tweede lid, geldt niet in het geval van ziekte tijdens
      eindeloopbaanverlof.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel13
  - number: '13.4'
    text: |-
      Zodra de in het tweede lid bedoelde ambtenaar is hersteld maakt hij samen met het bevoegd gezag een afspraak over
      het resterende tussentijdsverlof.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel13
  - number: '13.5'
    text: |-
      Voor de toepassing van [artikel 42 van het Bbp][ref1] wordt, wat de vaststelling van de eerste ziektedag betreft,
      de periode waarin tussentijdsverlof wordt genoten gelijk gesteld aan buitengewoon verlof zonder behoud van
      bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel42
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '42'
  - number: '14.1'
    text: |-
      Ingeval de ambtenaar tijdens het levensloopverlof aanspraak heeft op zwangerschaps- en bevallingsverlof, wordt het
      levensloopverlof opgeschort.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel14
  - number: '14.2'
    text: |-
      Na afloop van het zwangerschaps- en bevallingsverlof maakt de ambtenaar samen met het bevoegd gezag een afspraak
      over het hervatten van het resterende levensloopverlof.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel14
  - number: '15'
    text: |-
      De ambtenaar verstrekt uiterlijk 1 mei van enig kalenderjaar aan het bevoegd gezag een overzicht van de opgebouwde
      levensloopaanspraken per 1 januari van het lopende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel15
  - number: '16'
    text: |-
      De [Regeling verlofsparen politie][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015806
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015806
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2006 en vervalt met ingang van 1 januari 2022.
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Regeling levensloop politie.'
    url: https://wetten.overheid.nl/BWBR0033849/2016-02-01#Artikel18
