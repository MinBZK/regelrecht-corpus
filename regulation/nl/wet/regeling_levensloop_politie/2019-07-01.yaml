  - number: '2'
    text: |-
      1 De ambtenaar kan door middel van het inzetten van bronnen een geldelijke voorziening sparen ten behoeve van een
      periode van tussentijdsverlof of eindeloopbaanverlof of op grond van [artikel 39d, eerste lid, van de Wlb][ref1],
      zoals dit artikel luidt op 1 januari 2013, met ingang van 1 januari 2013 voor de financiering van elk ander
      doeleinde.

      2 De mogelijkheid tot het inzetten van bronnen voor het sparen van een geldelijke voorziening ten behoeve van een
      periode van tussentijdsverlof of eindeloopbaanverlof, geldt tot en met 31 december 2011, of tot en met 31 december
      2021, indien [artikel 39d, eerste lid, van de Wlb][ref2], zoals dit artikel luidt op 1 januari 2013, van toepassing
      is op de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
