  - number: '13'
    text: |-
      1 Indien de ambtenaar tijdens de periode waarin tussentijdsverlof of eindeloopbaanverlof wordt genoten ongeschikt
      is tot het verrichten van zijn arbeid wegens ziekte, is hij verplicht daarvan terstond mededeling te doen aan het
      bevoegd gezag. De ambtenaar is tevens verplicht zijn herstel terstond te melden.

      2 Indien de ambtenaar tijdens tussentijdsverlof in totaliteit meer dan 28 dagen ziek is, wordt, als de periode
      waarin het tussentijdsverlof wordt genoten is vastgesteld op twaalf maanden, de tussentijdsverlofperiode
      opgeschort. Als de periode waarin het tussentijdsverlof wordt genoten korter is dan twaalf maanden wordt het aantal
      dagen, bedoeld in de eerste volzin, vastgesteld naar rato van die kortere periode.

      3 De opschorting van de levensloopperiode, bedoeld in het tweede lid, geldt niet in het geval van ziekte tijdens
      eindeloopbaanverlof.

      4 Zodra de in het tweede lid bedoelde ambtenaar is hersteld maakt hij samen met het bevoegd gezag een afspraak over
      het resterende tussentijdsverlof.

      5 Voor de toepassing van [artikel 42 van het Bbp][ref1] wordt, wat de vaststelling van de eerste ziektedag
      betreft, de periode waarin tussentijdsverlof wordt genoten gelijk gesteld aan buitengewoon verlof zonder behoud
      van bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel42
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '42'
  - number: '14'
    text: |-
      1 Ingeval de ambtenaar tijdens het levensloopverlof aanspraak heeft op zwangerschaps- en bevallingsverlof, wordt
      het levensloopverlof opgeschort.

      2 Na afloop van het zwangerschaps- en bevallingsverlof maakt de ambtenaar samen met het bevoegd gezag een afspraak
      over het hervatten van het resterende levensloopverlof.
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel14
  - number: '15'
    text: |-
      De ambtenaar verstrekt uiterlijk 1 mei van enig kalenderjaar aan het bevoegd gezag een overzicht van de opgebouwde
      levensloopaanspraken per 1 januari van het lopende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel15
