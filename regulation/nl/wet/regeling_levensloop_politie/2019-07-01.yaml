  - number: '3'
    text: |-
      1 Met inachtneming van deze regeling kan de ambtenaar voor het sparen van de geldelijke voorziening jaarlijks geld-
      en tijdbronnen inzetten die in de zin [artikel 10 van de Wlb][ref1] als loon worden gekwalificeerd.

      2 Wanneer als tijdbron vakantie-uren worden ingezet, geldt dat van de in een kalenderjaar toegekende vakantie-
      uren op basis van de [artikelen 17][ref2], [18][ref3] en [19 van het Barp][ref4] maximaal het verschil tussen deze
      toegekende vakantie-uren en 144 vakantie-uren bij een volledige betrekking kan worden afgezien, dan wel, indien de
      ambtenaar een andere betrekking heeft, een evenredig deel hiervan.

      3 Als tijdbron kunnen geen levenfase-uren worden ingezet.

      4 Indien van toepassing, wordt de waarde van de bron vastgesteld op de waarde op de dag waarop het bedrag wordt
      gestort op de levenslooprekening of in de levensloopverzekering.

      5 De som van de in te zetten bronnen mag per kalenderjaar niet meer bedragen dan het bedrag dat wordt vastgesteld
      met toepassing van [artikel 61e van de Uitvoeringsregeling loonbelasting 2001][ref5] zoals dit artikel luidde op 1
      januari 2006, respectievelijk [artikel 5.6 van de Uitvoeringsregeling loonbelasting 2011][ref6], zoals dit artikel
      luidde op 31 december 2011.

      6 In afwijking van het vierde lid geldt, voor de ambtenaar, die op 31 december 2005 de leeftijd
      van 51 jaar maar niet de leeftijd van 56 heeft bereikt, het bedrag dat met toepassing van
      [artikel 109 van de Uitvoeringsregeling loonbelasting 2001][ref7], zoals dit artikel luidde op 1 januari 2006,
      is vastgesteld.

      7 Voor zover de som van de ingezette bronnen uitgaat boven hetgeen in dit artikel is toegestaan, wordt dit
      meerdere overeenkomstig [artikel 61e, tweede lid, van de Uitvoeringsregeling loonbelasting 2001][ref8],
      zoals dit artikel luidde op 1 januari 2006, respectievelijk
      [artikel 5.6, tweede lid, van de Uitvoeringsregeling loonbelasting 2011][ref9], zoals dit artikel luidde op 31
      december 2011,aan de ambtenaar als loon uitgekeerd.


