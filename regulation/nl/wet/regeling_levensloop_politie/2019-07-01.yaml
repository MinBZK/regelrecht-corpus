  - number: '6'
    text: |-
      1 Uiterlijk de tweede betaalperiode volgend op de betaalperiode waarin het bevoegd gezag de aanvraag tot het
      opbouwen van een voorziening ingevolge deze regeling heeft toegekend, wordt aangevangen met het storten van
      maandelijks ingezette bronnen.

      2 Het storten van eenmalig ingezette bronnen vindt plaats in de maand dat deze bron aan de ambtenaar betaalbaar
      wordt gesteld.

      3 Stortingen van bronnen waaraan geen inhouding is verbonden, vinden uiterlijk plaats in december van het
      kalenderjaar waarop de aanvraag betrekking heeft.

      4 Een ambtenaar kan ieder moment schriftelijk verzoeken te stoppen met het sparen voor de geldelijke voorziening.
      Uiterlijk de tweede betaalperiode volgend op de betaalperiode waarin het bevoegd gezag het verzoek heeft ontvangen,
      stopt het bevoegd gezag met het storten van de in te zetten bronnen.

      5 In het kalenderjaar van stopzetting kan de ambtenaar geen nieuwe aanvraag tot het opbouwen van een voorziening
      ingevolge deze regeling indienen.
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel6
  - number: '7'
    text: |-
      1 Over de levensloopaanspraken wordt alleen beschikt:

      a. ten behoeve van het uitbetalen van een inkomen aan de ambtenaar tijdens het tussentijdsverlof dan wel het
      eindeloopbaanverlof;

      b. ten behoeve van het uitbetalen van een inkomen aan de ambtenaar tijdens ouderschapsverlof, bedoeld in
      [artikel 41 van het Barp][ref1] of [artikel 6:1 van de Wet arbeid en zorg][ref2]; of

      c. op verzoek van de ambtenaar ten behoeve van het omzetten van levensloopaanspraken in een aanspraak op
      ouderdomspensioen op grond van het Pensioenreglement van de Stichting Pensioenfonds ABP, mits na de omzetting de
      aanspraak op de ouderdomspensioen nog blijft binnen de in of krachtens [hoofdstuk IIB van de Wlb][ref3] gestelde
      grenzen.

      2 In afwijking van het eerste lid kan met ingang van 1 januari 2013 op grond van [artikel 39d, lid 1, Wlb][ref4],
      zoals dit artikel luidt op 1 januari 2013, ten behoeve van andere doeleinden dan de in het eerste lid genoemde,
      over de levensloopafspraken worden beschikt. Indien evenwel op grond van [artikel 39d, lid 2, van de Wlb][ref5],
      door de ambtenaar in het kalenderjaar 2013 ineens wordt beschikt over de tot dan opgebouwde levensloopaanspraken
      dan is artikel 2 nadien niet meer van toepassing.

      3 In geval van overlijden van de ambtenaar worden de levensloopaanspraken zo spoedig mogelijk
      na het overlijden uitgekeerd aan de erfgenamen van de ambtenaar, met inachtneming van
      [artikel 61h, tweede lid, van de Uitvoeringsregeling loonbelasting 2001][ref6], zoals dit artikel luidde op 1
      januari 2006, resp. [artikel 5.8, tweede lid, van de Uitvoeringsregeling loonbelasting 2011][ref7], zoals dit
      artikel luidde op 31 december 2011.

      4 In afwijking van het tweede lid worden de levensloopaanspraken niet uitgekeerd aan de erfgenamen, indien de
      ambtenaar bij een levensloopverzekering hiervoor heeft gekozen.

      5 Bij beëindiging van de dienstbetrekking worden de levensloopaanspraken afgekocht indien de ambtenaar dat
      verzoekt.

      6 Gedurende de dienstbetrekking worden de levensloopaanspraken op geen enkele wijze afgekocht, vervreemd,
      prijsgegeven dan wel formeel of feitelijk als voorwerp van zekerheid aangeboden anders dan ten behoeve van de
      in [artikel 61k, derde lid, van de Uitvoeringsregeling loonbelasting 2001][ref8], zoals dit artikel luidde op 31
      december 2011, bedoelde verpanding.

      7 In afwijking van het zesde lid mag een levensloopverzekering voorzien in de mogelijkheid van gehele of
      gedeeltelijke afkoop van de levensloopaanspraken voor zover overeenkomstig [artikel 19g, tweede lid, de Wlb][ref9],
      zoals dit artikel luidde op 31 december 2011, over de voorziening wordt beschikt.


