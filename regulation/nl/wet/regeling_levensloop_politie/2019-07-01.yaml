  - number: '5'
    text: |-
      1 Het bevoegd gezag beslist binnen zes weken na ontvangst van de aanvraag tot het opbouwen van een voorziening
      ingevolge deze regeling.

      2 Het bevoegd gezag wijst de aanvraag af, indien:

      a. op 1 januari van het kalenderjaar sprake is van de situatie bedoeld in
      [artikel 61e eerste lid, onderdeel b, van de Uitvoeringsregeling loonbelasting 2001][ref1],
      zoals dit artikel luidde op 1 januari 2006, resp.
      [artikel 5.6, eerste lid, onderdeel b, van de Uitvoeringsregeling loonbelasting 2011][ref2], zoals dit artikel
      luidde op 31 december 2011;

      b. de ambtenaar al deelnemer is aan een spaarloonregeling als bedoeld in [artikel 32 van de Wlb][ref3], zoals dit
      artikel luidde op 31 december 2011.

      3 De aanvraag kan door het bevoegd gezag worden afgewezen indien niet alle met de aanvraag gemoeide bescheiden
      zijn overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel5.6
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel32
