  - number: '8'
    text: |-
      1 Tussentijdsverlof is een periode van onbezoldigd verlof van minimaal twee maanden en maximaal twaalf maanden.

      2 Eindeloopbaanverlof is een periode van onbezoldigd verlof van minimaal twee maanden en maximaal 36 maanden.

      3 In afwijking van het tweede lid is de maximale duur van het eindeloopbaanverlof twaalf maanden indien de
      periode van onbezoldigd verlof wordt genoten direct voorafgaand aan het ontslag op grond van [artikel 88][ref1] of
      [artikel 88a van het Barp][ref2].

      4 De minimale duur van twee maanden voor tussentijdsverlof of eindeloopbaanverlof geldt niet indien op de ambtenaar
      [artikel 39d, tweede lid, van de Wlb][ref3], zoals dit artikel op 31 december 2012 luidde, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel88a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
