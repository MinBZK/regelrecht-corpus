  - number: '9'
    text: |-
      1 De ambtenaar dient uiterlijk zes maanden voor de gewenste aanvang van het tussentijdsverlof of
      eindeloopbaanverlof een aanvraag in tot het opnemen van de levensloopaanspraken.

      2 In afwijking van het eerste lid kan het bevoegde gezag toestaan dat een kortere aanvraagtermijn in acht wordt
      genomen.

      3 De ambtenaar dient desgewenst uiterlijk gelijktijdig met de aanvraag voor ouderschapsverlof als bedoeld in
      [artikel 41 van het Barp][ref1], een aanvraag in tot het opnemen van de levensloopaanspraken.

      4 In zijn aanvraag meldt de ambtenaar:

      a. de begin- en einddatum van de gewenste verlofperiode;

      b. het aantal uren levensloopverlof dat wordt opgenomen;

      c. de verdeling van uren levensloopverlof over de weken;

      d. of de stortingen op de levenslooprekening of levensloopverzekering moeten worden beëindigd en indien dit het
      geval is wanneer deze stortingen moeten worden beëindigd;

      e. de omvang van de levensloopaanspraken die worden aangewend tijdens de verlofperiode; en

      f. zijn toestemming dat het bevoegd gezag bij een voor de ambtenaar positieve beslissing op de aanvraag mede namens
      hem aan de instelling verzoekt maandelijks een deel van de levensloopaanspraken dat overeenkomt met het bedrag,
      bedoeld in [artikel 12, eerste lid][ref2], aan het bevoegd gezag beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0033849#Artikel12
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel9
