articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *ABP:* het Algemeen Burgerlijk Pensioenfonds;

      b. *Pensioenovereenkomst ABP:* de tussen overheidswerkgevers verenigd in de Stichting Verbond Sectorwerkgevers
      Overheid en de Algemene Centrale van Overheidspersoneel op 15 maart 1995 gesloten, en op 14 februari 2013
      gewijzigde, overeenkomst voor een pensioenregeling;

      c. *ambtenaar:* ambtenaar, bedoeld in [artikel 1, eerste lid, onderdeel i, van het Barp][ref1];

      d. *Barp:* [Besluit algemene rechtspositie politie][ref2];

      e. *Bbp:* [Besluit bezoldiging politie][ref3];

      f. *Belastingplan:* verzamelwet fiscale wetgeving in enig jaar;

      g. *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1, eerste lid, onderdeel l, van het Barp][ref4];

      h. *bron:* een van de bronnen, genoemd in [artikel 3, eerste lid][ref5], van deze regeling;

      i. *instelling:* kredietinstelling naar keuze van de ambtenaar, onderscheidenlijk een verzekeraar naar keuze van
      de ambtenaar als bedoeld in [artikel 19g, vierde lid, van de Wet op de loonbelasting 1964][ref6] zoals dit artikel
      luidde op 31 december 2011;

      j. *eindeloopbaanverlof:* verlof dat de ambtenaar wordt verleend op grond van deze regeling
      direct voorafgaand aan zijn ontslag op grond van de [artikelen 88a][ref7], [88d][ref8] of
      [94, eerste lid, onderdeel h, van het Barp][ref9];

      k. *levensfase-uren:* levensfase-uren als bedoeld in [artikel 1, eerste lid, onderdeel rr, van het Barp][ref10];

      l. *levensloopaanspraken:* de bij een instelling opgebouwde voorziening in geld, vermeerderd met
      de daarop gekweekte inkomsten en de daarmee behaalde rendementen, die is bestemd voor een uitkering
      gedurende het eindeloopbaanverlof of tussentijdsverlof of met ingang van 1 januari 2013 op grond van
      [artikel 39d, eerste lid, van de Wlb][ref11], zoals dit artikel luidt op 1 januari 2013, voor de financiering van
      elk ander doeleinde;

      m. *levenslooprekening:* geblokkeerde rekening op naam van de ambtenaar bij een instelling als bedoeld in
      [artikel 61c van de Uitvoeringsregeling loonbelasting 2001][ref12];

      n. *levensloopverzekering:* verzekering op naam van de ambtenaar bij een instelling als bedoeld in
      [artikel 61d van de Uitvoeringsregeling loonbelasting 2001][ref13], zoals dit artikel luidde op 31 december 2011;

      o. *loon:* loon als bedoeld in [artikel 10 van de Wet op de loonbelasting 1964][ref14];

      p. *tussentijdsverlof:* verlof dat de ambtenaar wordt verleend op grond van deze regeling niet zijnde
      eindeloopbaanverlof;

      q. *Wlb:* [Wet op de loonbelasting 1964][ref15].


