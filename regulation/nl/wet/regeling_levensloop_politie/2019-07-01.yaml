  - number: '4'
    text: |-
      1 De ambtenaar kan bij het bevoegd gezag tot wederopzegging een aanvraag tot het opbouwen van een voorziening
      ingevolge deze regeling indienen.

      2 In zijn aanvraag meldt de ambtenaar:

      a. welke bronnen moeten worden ingezet en tot welk bedrag, en

      b. of de inzet van een bron maandelijks of eenmalig geschiedt, en

      c. of hij reeds levensloopaanspraken heeft opgebouwd.

      3 De aanvraag gaat vergezeld van:

      a. een schriftelijke verklaring van de instelling waar de ambtenaar een levenslooprekening heeft geopend of
      levensloopverzekering heeft afgesloten; waarbij de verklaring de gegevens bevat van deze rekening respectievelijk
      verzekering waar de in te zetten bronnen op moeten worden gestort;

      b. in het geval de ambtenaar geen levensloopaanspraken ingevolge een levensloopregeling heeft bij één of meer
      gewezen inhoudingsplichtigen, een schriftelijke verklaring van de ambtenaar hieromtrent;

      c. in het geval de ambtenaar levensloopaanspraken ingevolge een levensloopregeling heeft bij één of meer gewezen
      inhoudingsplichtigen, een schriftelijke verklaring van de ambtenaar over de omvang van de levensloopaanspraken
      op 1 januari van het jaar van de aanvraag en bij welke instelling of instellingen deze levensloopaanspraken wordt
      aangehouden; en

      d. een schriftelijke verklaring waarin de ambtenaar verklaart dat hij geen loon spaart of in het lopende jaar heeft
      gespaard ingevolge een spaarloonregeling als bedoeld in [artikel 32 van de Wlb][ref1] zoals dit artikel luidde op
      31 december 2011.

      4 De ambtenaar, die een aanvraag voor onbepaalde tijd voor het opbouwen van een voorziening heeft ingediend en
      levensloopaanspraken ingevolge een levensloopregeling heeft bij één of meer gewezen inhoudingsplichtigen, verstrekt
      het bevoegd gezag jaarlijks een schriftelijke verklaring over de omvang van deze levensloopaanspraken en bij welke
      instelling of instellingen deze levensloopaanspraken wordt aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel4
