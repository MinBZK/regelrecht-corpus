  - number: '10'
    text: |-
      1 Het bevoegd gezag kent de aanvraag tot het verlenen van tussentijdsverlof toe, tenzij:

      a. ernstige bezwaren voor de bedrijfsvoering voortvloeien uit toekenning van het verzoek;

      b. in de drie jaren voorafgaande aan het moment waarop de gewenste verlofperiode aanvangt aan de ambtenaar reeds
      eerder een tussentijdsverlof op grond van deze regeling is toegekend door hetzelfde bevoegd gezag; of

      c. de levensloopaanspraken ontoereikend zijn om het op de ambtenaar te verhalen gedeelte van de pensioenbijdrage,
      contributies en loonheffing te voldoen.

      2 Het bevoegd gezag kent de aanvraag tot het opnemen van eindeloopbaanverlof toe, tenzij de levensloopaanspraken
      ontoereikend zijn om het op de ambtenaar te verhalen pensioenbijdrage, contributies en loonheffing te voldoen.

      3 Het bevoegd gezag maakt het besluit op de aanvraag binnen zes weken na de datum waarop deze ontvangen is bekend
      aan de ambtenaar en de levensloopinstelling.

      4 Tijdens de periode van tussentijdsverlof of eindeloopbaanverlof kan de ambtenaar geen aanvraag doen tot
      vermindering van de arbeidstijd conform [artikel 13a van het Barp][ref1], dan wel komt de ingevolge artikel 13a van
      het Barp verleende vermindering van de arbeidstijd te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel13a
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 13a
  - number: '11'
    text: |-
      1 Het levensloopverlof kan voor een deel van de voor de ambtenaar geldende arbeidsduur worden toegekend.

      2 Het levensloopverlof wordt in hele uren toegekend.
    url: https://wetten.overheid.nl/BWBR0033849/2019-07-01#Artikel11
  - number: '12'
    text: |-
      1 Tijdens de periode waarin tussentijdsverlof, eindeloopbaanverlof of ouderschapsverlof wordt genoten, verstrekt
      het bevoegd gezag op grond van [artikel 39d van de Wlb][ref1], zoals dit artikel luidde op 31 december 2012, de
      ambtenaar maandelijks een gelijk bedrag dat, tezamen met het daarnaast van het bevoegd gezag genoten loon, niet
      hoger is dan het loon in de maand voorafgaande aan het tussentijdsverlof, eindeloopbaanverlof of ouderschapsverlof.

      2 Op het bedrag, bedoeld in het eerste lid, wordt indien het tussentijdsverlof betreft ingehouden:

      a. het op de ambtenaar te verhalen gedeelte van de pensioenpremies, als bedoeld in en berekend op voet artikel 4
      van de Pensioenovereenkomst ABP in samenhang met [artikel 4b van het Bbp][ref2];

      b. de loonheffing; en

      c. de contributies waarmee de ambtenaar heeft ingestemd.

      3 Op het bedrag, bedoeld in het eerste lid, wordt indien het eindeloopbaanverlof betreft ingehouden:

      a. gedurende de eerste twaalf maanden van het eindeloopbaanverlof het op de ambtenaar te verhalen gedeelte
      van de pensioenpremies, als bedoeld in en berekend op de voet van artikel 4, tweede lid, en artikel 5 van de
      Pensioenovereenkomst ABP in samenhang met [artikel 4b van het Bbp][ref3];

      b. na de eerste twaalf maanden van het eindeloopbaanverlof het op de ambtenaar te verhalen gedeelte van de
      pensioenpremies, als bedoeld in en berekend op de voet van artikel 4, tweede lid, onderdelen b, c en d, van de
      Pensioenovereenkomst ABP;

      c. de loonheffing; en

      d. de contributies waarmee de ambtenaar heeft ingestemd.

      4 Op het bedrag, bedoeld in het eerste lid, wordt indien het ouderschapsverlof betreft de loonheffing ingehouden.

      5 Het bepaalde in het eerste lid is, op grond van [artikel 39d van de Wlb][ref4], zoals dit artikel luidt op 1
      januari 2013 tot en met 31 december 2021, niet meer van toepassing met ingang van 1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel4b
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel4b
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
