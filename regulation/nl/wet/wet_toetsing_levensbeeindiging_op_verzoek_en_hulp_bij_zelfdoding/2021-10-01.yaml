        bwb_id: BWBR0012410
        artikel: '17'
        hoofdstuk: III
        paragraaf: '8'
  - number: '19'
    text: |-
      1 Op voordracht van Onze Ministers worden bij algemene maatregel van bestuur met betrekking tot de commissies
      regels gesteld betreffende

      a. hun aantal en relatieve bevoegdheid;

      b. hun vestigingsplaats.

      2 Bij of krachtens algemene maatregel van bestuur kunnen Onze Ministers met betrekking tot de commissies nadere
      regels stellen betreffende

      a. hun omvang en samenstelling;

      b. hun werkwijze en verslaglegging;

      c. het overleg met een vertegenwoordiger van het College van procureurs-generaal en een vertegenwoordiger van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel19
  - number: 19a
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba met inachtneming van het in
      dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel19a
  - number: 19b
    text: |-
      1 Voor de toepassing van:

        - [artikel 1, onderdeel b][ref1], wordt in plaats van
      «[artikel 294, tweede lid, tweede volzin, Wetboek van Strafrecht][ref2]» gelezen: artikel 307, tweede lid, tweede
      volzin, van het Wetboek van Strafrecht BES.
        - [artikel 1, onderdeel f][ref3], wordt in plaats van «een regionale toetsingscommissie als bedoeld in
      [artikel 3][ref4]» gelezen: een commissie als bedoeld in [artikel 19c][ref5].
        - [artikel 2, eerste lid, aanhef][ref6], wordt in plaats van
      «[artikel 293, tweede lid, van het Wetboek van Strafrecht][ref7]» gelezen:
      [artikel 306, tweede lid, van het Wetboek van Strafrecht BES][ref8].
        - [artikel 8, eerste lid][ref9], wordt in plaats van «[artikel 7, tweede lid, van de Wet op de lijkbezorging][ref10]»
      gelezen: [artikel 1, derde lid, van de Wet verklaringen van overlijden BES][ref11].
        - [artikel 8, derde lid][ref12], vervalt: of de betrokken hulpverleners.
        - [artikel 9, tweede lid, aanhef][ref13], wordt in plaats van «het College van procureurs-generaal» gelezen: de
      procureur-generaal.

      2 [Artikel 1, onder e][ref14], is niet van toepassing.


