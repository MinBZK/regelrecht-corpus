  - number: '23'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel23
  - number: '24'
    text: 'Deze wet wordt aangehaald als: Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding.'
