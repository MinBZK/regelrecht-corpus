  - number: '3'
    text: |-
      1 Er zijn regionale commissies voor de toetsing van meldingen van gevallen van levensbeëindiging
      op verzoek en hulp bij zelfdoding als bedoeld in [artikel 293, tweede lid][ref1], onderscheidelijk
      [294, tweede lid, tweede volzin, van het Wetboek van Strafrecht][ref2].

      2 Een commissie bestaat uit een oneven aantal leden, waaronder in elk geval één rechtsgeleerd lid, tevens
      voorzitter, één arts en één deskundige inzake ethische of zingevingsvraagstukken. Van een commissie maken mede deel
      uit plaatsvervangende leden van elk van de in de eerste volzin genoemde categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel293
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel294
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '293'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '294'
  - number: '4'
    text: |-
      1 De voorzitter en de leden, alsmede de plaatsvervangende leden worden door Onze Ministers benoemd voor de tijd van
      vier jaar. Herbenoeming kan eenmaal plaatsvinden voor de tijd van vier jaar.

      2 Een commissie heeft een secretaris en één of meer plaatsvervangend secretarissen, allen rechtsgeleerden, die door
      Onze Ministers worden aangewezen. De secretaris heeft in de vergaderingen van de commissie een raadgevende stem.
      De aanwijzing eindigt van rechtswege met ingang van de datum dat de uitoefening van de functie van secretaris of
      plaatsvervangend secretaris geen onderdeel meer uitmaakt van de werkzaamheden van de betreffende ambtenaar.

      3 De secretaris is voor zijn werkzaamheden voor de commissie uitsluitend verantwoording schuldig aan de commissie.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel4
  - number: '5'
    text: |-
      De voorzitter en de leden, alsmede de plaatsvervangende leden kunnen te allen tijde op hun eigen verzoek worden
      ontslagen door Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel5
  - number: '6'
    text: |-
      De voorzitter en de leden, alsmede de plaatsvervangende leden kunnen door Onze Ministers worden ontslagen wegens
      ongeschiktheid of onbekwaamheid of op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel6
  - number: '7'
    text: |-
      1 Onverminderd de [artikelen 4 tot en met 6][ref1] worden bij of krachtens algemene maatregel van bestuur regels
      gesteld over de rechtspositie van de voorzitters, waaronder in ieder geval regels over de vergoeding.

      2 De regels, bedoeld in het eerste lid, kunnen voor de onderscheiden voorzitters verschillend worden vastgesteld
      naar gelang de aard en omvang van de door hen te verrichten werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel4
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012410
        artikel: '4'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8'
    text: |-
      1 De commissie beoordeelt op basis van het verslag bedoeld in
      [artikel 7, tweede lid, van de Wet op de lijkbezorging][ref1], of de arts die levensbeëindiging op verzoek heeft
      toegepast of hulp bij zelfdoding heeft verleend, heeft gehandeld overeenkomstig de zorgvuldigheidseisen, bedoeld
      in [artikel 2][ref2].

      2 De commissie kan de arts verzoeken zijn verslag schriftelijk of mondeling aan te vullen, indien dit voor een
      goede beoordeling van het handelen van de arts noodzakelijk is.

      3 De commissie kan bij de gemeentelijke lijkschouwer, de consulent of de betrokken hulpverleners inlichtingen
      inwinnen, indien dit voor een goede beoordeling van het handelen van de arts noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012410#Artikel2
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0012410
        artikel: '2'
        hoofdstuk: II
  - number: '9'
    text: |-
      1 De commissie brengt haar gemotiveerde oordeel binnen zes weken na ontvangst van het verslag als bedoeld in
      [artikel 8, eerste lid][ref1], schriftelijk ter kennis van de arts.

      2 De commissie brengt haar oordeel ter kennis van het College van procureurs-generaal en de inspecteur van de
      Inspectie gezondheidszorg en jeugd:

      a. indien de arts naar het oordeel van de commissie niet heeft gehandeld overeenkomstig de zorgvuldigheidseisen,
      bedoeld in [artikel 2][ref2]; of

      b. indien de situatie zich voordoet als bedoeld in [artikel 12, laatste volzin van de Wet op de lijkbezorging.][ref3]

      De commissie stelt de arts hiervan in kennis.

      3 De in het eerste lid genoemde termijn kan eenmaal voor ten hoogste zes weken worden verlengd. De commissie stelt
      de arts hiervan in kennis.

      4 De commissie is bevoegd het door haar gegeven oordeel mondeling tegenover de arts nader toe te lichten. Deze
      mondelinge toelichting kan plaatsvinden op verzoek van de commissie of op verzoek van de arts.


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012410#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel12
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012410
        artikel: '8'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012410
        artikel: '2'
        hoofdstuk: II
      - id: ref3
