preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het Wetboek van Strafrecht een
    strafuitsluitingsgrond op te nemen voor de arts die met inachtneming van wettelijk vast te leggen
    zorgvuldigheidseisen levensbeëindiging op verzoek toepast of hulp bij zelfdoding verleent, en daartoe bij wet een
    meldings- en toetsingsprocedure vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Ministers: de Ministers van Justitie en van Volksgezondheid, Welzijn en Sport;

      b. hulp bij zelfdoding: het opzettelijk een ander bij zelfdoding behulpzaam zijn of hem de middelen daartoe
      verschaffen als bedoeld in [artikel 294, tweede lid, tweede volzin, Wetboek van Strafrecht][ref1];

      c. de arts: de arts die volgens de melding levensbeëindiging op verzoek heeft toegepast of hulp bij zelfdoding
      heeft verleend;

      d. de consulent: de arts die is geraadpleegd over het voornemen van een arts om levensbeëindiging op verzoek toe te
      passen of hulp bij zelfdoding te verlenen;

      e. de hulpverleners: hulpverleners als bedoeld in
      [artikel 446, eerste lid, van boek 7 van het Burgerlijk Wetboek][ref2];

      f. de commissie: een regionale toetsingscommissie als bedoeld in [artikel 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel294
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel446
      [ref3]: https://wetten.overheid.nl/BWBR0012410#Artikel3
