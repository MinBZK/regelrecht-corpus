        artikel: '12'
  - number: '10'
    text: |-
      De commissie is verplicht aan de officier van justitie desgevraagd alle inlichtingen te verstrekken, welke hij
      nodig heeft:

      1°. ten behoeve van de beoordeling van het handelen van de arts in het geval als bedoeld in
      [artikel 9, tweede lid][ref1]; of

      2°. ten behoeve van een opsporingsonderzoek.

      Van het verstrekken van inlichtingen aan de officier van justitie doet de commissie mededeling aan de arts.


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel9
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012410
        artikel: '9'
        hoofdstuk: III
        paragraaf: '4'
  - number: '11'
    text: |-
      De commissie draagt zorg voor registratie van de ter beoordeling gemelde gevallen van levensbeëindiging op verzoek
      of hulp bij zelfdoding. Bij ministeriële regeling van Onze Ministers kunnen daaromtrent nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel11
  - number: '12'
    text: |-
      1 Een oordeel wordt vastgesteld bij gewone meerderheid van stemmen.

      2 Een oordeel wordt vastgesteld door drie leden van de commissie die elk een van de in
      [artikel 3, tweede lid, eerste zin][ref1], genoemde categorieën van deskundigheid vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel3
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012410
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13'
    text: |-
      De voorzitters van de regionale toetsingscommissies voeren ten minste twee maal per jaar overleg met elkaar over
      werkwijze en functioneren van de commissies. Bij het overleg worden uitgenodigd een arts en een deskundige inzake
      ethische of zingevingsvraagstukken die ieder de andere leden van de betreffende categorie van deskundigheid
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel13
  - number: '14'
    text: |-
      De leden en plaatsvervangend leden van de commissie zijn verplicht tot geheimhouding van de gegevens waarover zij
      bij de taakuitvoering de beschikking krijgen, behoudens voor zover enig wettelijk voorschrift hen tot mededeling
      verplicht of uit hun taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel14
  - number: '15'
    text: |-
      Een lid van de commissie, dat voor de behandeling van een zaak zitting heeft in de commissie, verschoont zich en
      kan worden gewraakt indien er feiten of omstandigheden bestaan waardoor de onpartijdigheid van zijn oordeel schade
      zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel15
  - number: '16'
    text: |-
      Een lid, een plaatsvervangend lid en de secretaris van de commissie onthouden zich van het geven van een oordeel
      over het voornemen van een arts om levensbeëindiging op verzoek toe te passen of hulp bij zelfdoding te verlenen.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel16
  - number: '17'
    text: |-
      1 De commissies brengen jaarlijks vóór 1 april aan Onze Ministers een gezamenlijk verslag van werkzaamheden uit
      over het afgelopen kalenderjaar. Onze Ministers stellen hiervoor bij ministeriële regeling een model vast.

      2 Het in het eerste lid bedoelde verslag van werkzaamheden vermeldt in ieder geval:

      a. het aantal gemelde gevallen van levensbeëindiging op verzoek en hulp bij zelfdoding waarover de commissie een
      oordeel heeft uitgebracht;

      b. de aard van deze gevallen;

      c. de oordelen en de daarbij gemaakte afwegingen.
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel17
  - number: '18'
    text: |-
      Onze Ministers brengen jaarlijks ter gelegenheid van het indienen van de begroting aan de Staten-
      Generaal verslag uit met betrekking tot het functioneren van de commissies naar aanleiding van het in
      het[ artikel 17, eerste lid][ref1], bedoelde verslag van werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel17
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel18
