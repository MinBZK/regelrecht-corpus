  - number: 19c
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], is er een door Onze Ministers aan te wijzen commissie, die bevoegd
      is de meldingen van gevallen van levensbeëindiging op verzoek en hulp bij zelfdoding als bedoeld in artikel 306,
      tweede lid, onderscheidenlijk 307, tweede lid, tweede volzin, van het Wetboek van Strafrecht BES te toetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel3
