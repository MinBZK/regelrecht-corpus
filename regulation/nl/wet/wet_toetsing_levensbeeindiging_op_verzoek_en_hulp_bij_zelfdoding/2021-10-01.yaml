  - number: '2'
    text: |-
      1 De zorgvuldigheidseisen, bedoeld in [artikel 293, tweede lid, Wetboek van Strafrecht][ref1], houden in dat de
      arts:

      a. de overtuiging heeft gekregen dat er sprake was van een vrijwillig en weloverwogen verzoek van de patiënt,

      b. de overtuiging heeft gekregen dat er sprake was van uitzichtloos en ondraaglijk lijden van de patiënt,

      c. de patiënt heeft voorgelicht over de situatie waarin deze zich bevond en over diens vooruitzichten,

      d. met de patiënt tot de overtuiging is gekomen dat er voor de situatie waarin deze zich bevond geen redelijke
      andere oplossing was,

      e. ten minste één andere, onafhankelijke arts heeft geraadpleegd, die de patiënt heeft gezien en schriftelijk zijn
      oordeel heeft gegeven over de zorgvuldigheidseisen, bedoeld in de onderdelen a tot en met d, en

      f. de levensbeëindiging of hulp bij zelfdoding medisch zorgvuldig heeft uitgevoerd.

      2 Indien de patiënt van zestien jaren of ouder niet langer in staat is zijn wil te uiten, maar voordat hij in die
      staat geraakte tot een redelijke waardering van zijn belangen terzake in staat werd geacht, en een schriftelijke
      verklaring, inhoudende een verzoek om levensbeëindiging, heeft afgelegd, dan kan de arts aan dit verzoek gevolg
      geven. De zorgvuldigheidseisen, bedoeld in het eerste lid, zijn van overeenkomstige toepassing.

      3 Indien de minderjarige patiënt een leeftijd heeft tussen de zestien en achttien jaren en tot een redelijke
      waardering van zijn belangen terzake in staat kan worden geacht, kan de arts aan een verzoek van de patiënt om
      levensbeëindiging of hulp bij zelfdoding gevolg geven, nadat de ouder of de ouders die het gezag over hem uitoefent
      of uitoefenen dan wel zijn voogd bij de besluitvorming zijn betrokken.

      4 Indien de minderjarige patiënt een leeftijd heeft tussen de twaalf en zestien jaren en tot een redelijke
      waardering van zijn belangen terzake in staat kan worden geacht, kan de arts, indien een ouder of de ouders die het
      gezag over hem uitoefent of uitoefenen dan wel zijn voogd zich met de levensbeëindiging of hulp bij zelfdoding kan
      of kunnen verenigen, aan het verzoek van de patiënt gevolg geven. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel293
    url: https://wetten.overheid.nl/BWBR0012410/2021-10-01#Artikel2
