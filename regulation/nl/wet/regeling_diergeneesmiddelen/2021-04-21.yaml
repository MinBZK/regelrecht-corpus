    Gelet op

    Beschikking van de Raad van 17 december 1999 betreffende het op de markt brengen en het toedienen van boviene
    somatotropine (BST) en tot intrekking van Beschikking 90/218/EEG (1999/879/EG);

    Richtlijn 90/167/EEG van de Raad van 26 maart 1990 tot vaststelling van de voorwaarden voor de bereiding, het in de
    handel brengen en het gebruik van diervoeders met medicinale werking (PbEG 1990, L 092);

    Richtlijn 91/412/EEG van de Commissie van de Europese Gemeenschappen van 23 juli 1991 tot vastlegging van
    beginselen en richtsnoeren inzake goede praktijken bij het vervaardigen van geneesmiddelen voor diergeneeskundig
    gebruik (PbEG 1991, L 228);

    Richtlijn 96/22/EG van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de veehouderij, van
    bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking, alsmede van β-agonisten
    en tot intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG 1996, L 125);

    Richtlijn 96/23/EG van de Raad van 29 april 1996 inzake controlemaatregelen ten aanzien van bepaalde stoffen en
    residuen daarvan in levende dieren en in producten daarvan en tot intrekking van de Richtlijnen 85/358/EEG en
    86/469/EEG en de Beschikkingen 89/187/EEG en 91/664/EEG (PbEG 1996, L 125);

    Richtlijn 2001/82/EG van het Europees Parlement en de Raad van 6 november 2001 tot vaststelling van een
    communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG 2001, L 311);

    Richtlijn 2004/28/EG van het Europees Parlement en de Raad van 31 maart 2004 tot wijziging van Richtlijn 2001/82/EG
    tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEU 2004,
    L 136);

    Richtlijn 2006/130/EG van de Commissie van de Europese Gemeenschappen van 11 december 2006 tot uitvoering van
    Richtlijn nr. 2001/82/EG van het Europees Parlement en de Raad, wat betreft de vaststelling van criteria voor
    de vrijstelling van het vereiste van een voorschrift van een dierenarts voor het verstrekken van bepaalde
    geneesmiddelen voor diergeneeskundig gebruik ten behoeve van voor de productie van levensmiddelen bestemde dieren
    (PbEG 2006, L 349);

    Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 tot
    vaststelling van communautaire procedures voor het verlenen van vergunningen en het toezicht op geneesmiddelen voor
    menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau (PbEU 2004, L 136);

    Verordening (EG) nr. 470/2009 van het Europees Parlement en de Raad van 6 mei 2009 tot vaststelling van
    communautaire procedures voor het vaststellen van grenswaarden voor residuen van farmacologisch werkzame stoffen in
    levensmiddelen van dierlijke oorsprong (PbEU 2009, L 152);

    Verordening (EG) nr. 1950/2006 van de Commissie van de Europese Gemeenschappen van 13 december 2006 tot
    vaststelling, overeenkomstig Richtlijn 2001/82/EG van het Europees Parlement en de Raad tot vaststelling van
    een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik van een lijst van stoffen die
    essentieel zijn voor de behandeling van paardachtigen (PbEG 2006, L 367);

    Verordening (EG) nr. 1234/2008 van de Commissie van de Europese Gemeenschappen van 24 november 2008 betreffende het
    onderzoek van wijzigingen in de voorwaarden van vergunningen voor het in de handel brengen van geneesmiddelen voor
    menselijk gebruik en geneesmiddelen voor diergeneeskundig gebruik (PbEU 2008. L 334);

    Verordening (EU) nr. 37/2010 van de Commissie van de Europese Unie van 22 december 2009 betreffende farmacologisch
    werkzame stoffen en de indeling daarvan op basis van maximumwaarden voor residuen in levensmiddelen van dierlijke
    oorsprong (PbEU 2010, L 15);

