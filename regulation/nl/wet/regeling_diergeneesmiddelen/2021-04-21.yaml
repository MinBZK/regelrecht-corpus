  - number: '3.8'
    text: |-
      Vrijstelling wordt verleend van het verbod, gesteld in [artikel 2.19, eerste lid, van de wet][ref1], voor het
      bereiden, bewerken, verwerken, verpakken, etiketteren, in Nederland brengen, vervoeren, ontvangen, voorhanden
      hebben, in voorraad hebben of toepassen van diergeneesmiddelen ten behoeve van dierproeven, voor zover deze proeven
      worden verricht met toepassing van de [Wet op de dierproeven][ref2] door de in die wet bedoelde vergunninghouders,
      onverminderd [artikel 3.11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003081
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.8
