  - number: 10a.1
    text: |-
      Als ziekteverwekkers als bedoeld in [artikel 7a.1 van het besluit][ref1] worden aangewezen de in [bijlage 10][ref2]
      genoemde ziekteverwekkers.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7A
      [ref2]: https://wetten.overheid.nl/BWBR0032626
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: 7A
      - id: ref2
        bwb_id: BWBR0032626
  - number: 10a.2
    text: |-
      Als ziekteverwekkers als bedoeld in [artikel 7a.2, eerste lid, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7A
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: 7A
  - number: 10a.2.a
    text: het mond- en klauwzeervirus;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.2
  - number: 10a.2.b
    text: het Afrikaanse varkenspestvirus;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.2
  - number: 10a.2.c
    text: het klassieke varkenspestvirus;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.2
  - number: 10a.2.d
    text: het aviaire influenzavirus.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.2
  - number: 10a.3.1
    text: |-
      Het voorhanden of in voorraad hebben van ziekteverwekkers als bedoeld in [artikel 10a.2][ref1] is uitsluitend
      toegestaan aan door de minister erkende laboratoria, voorzieningen of andere natuurlijke of rechtspersonen als
      bedoeld in artikel 16, eerste lid, van verordening (EU) 2016/429 van het Europees Parlement en de Raad van 9 maart
      2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied
      van diergezondheid (‘diergezondheidswetgeving’) (PbEU 2016, L84).


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel10a
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.3.2
    text: 'De minister verleent een erkenning als bedoeld in het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.2.a
    text: |-
      de in voorhanden zijnde of in voorraad gehouden ziekteverwekker, bedoeld in [artikel 10a.2][ref1], uitsluitend
      bestemd is voor het gebruik voor wetenschappelijke doeleinden, diagnose of de ontwikkeling, productie of controle
      van diergeneesmiddelen; en


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel10a
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a.3.2.b
    text: is voldaan aan artikel 16, eerste lid, van de in het eerste lid genoemde verordening.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.3
    text: |-
      Een aanvraag tot erkenning als bedoeld in het eerste lid geschiedt met gebruikmaking van een middel dat daartoe
      door de minister beschikbaar is gesteld en bevat in ieder geval gegevens waaruit blijkt dat wordt voldaan aan het
      tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.4
    text: |-
      De minister kan een erkenning als bedoeld in het eerste lid schorsen voor een door hem te bepalen termijn indien
      niet wordt voldaan aan het tweede lid, onderdelen a of b.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.5
    text: 'De minister kan een erkenning als bedoeld in het eerste lid, intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.5.a
    text: |-
      na afloop van de schorsing, bedoeld in het vierde lid, blijkt dat nog steeds niet wordt voldaan aan het tweede lid,
      onderdelen a of b;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.5.b
    text: |-
      blijkt dat binnen een periode van twaalf maanden na afloop van de schorsingstermijn, bedoeld in het vierde lid,
      wederom niet wordt voldaan aan het tweede lid, onderdelen a of b.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.6
    text: |-
      Voordat een besluit tot schorsing of intrekking wordt genomen, wordt de belanghebbende van het laboratorium, de
      voorziening of de natuurlijke of rechtspersoon in de gelegenheid gesteld binnen een bepaalde termijn alsnog aan het
      tweede lid, onderdelen a en b, te voldoen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: 10a.3.7
    text: |-
      De minister kan de erkenning met onmiddellijke ingang intrekken indien het belang van de dier- of volksgezondheid
      dat vereist.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10a.3
  - number: '11.1'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2013 met uitzondering van de
      [artikelen 2.34 tot en met 2.37][ref1] en [2.40 tot en met 2.44][ref2], die in werking treden met ingang van 4
      augustus 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel11.1
