  - number: 10.4.1
    text: |-
      In overeenstemming met artikel 16, eerste lid, aanhef, van [richtlijn 2001/82/EG](32001L0082) in
      samenhang met [artikel 2.20, eerste lid][ref1] en [11.1, eerste lid, tweede volzin, van de wet][ref2]
      en [artikel 9.3 van het besluit][ref3] is het toegestaan een homeopathisch diergeneesmiddel
      dat is vermeld op de Lijst van homeopathische diergeneesmiddelen 1993, bedoeld in
      [artikel 2, eerste lid, van het Besluit uitzonderingen registratieregime diergeneesmiddelen][ref4], zoals die
      gold voor 13 januari 2006 bij de inwerkingtreding van de Diergeneesmiddelenregeling, in de handel te brengen tot 1
      januari 2014.


