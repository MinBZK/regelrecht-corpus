  - number: 10.1.3
    text: |-
      In afwijking van [artikel 3.7, tweede lid][ref1], is het iedere natuurlijke persoon en rechtspersoon toegestaan
      een verpakking als bedoeld in [artikel 77, tweede lid, van de Diergeneesmiddelenregeling][ref2], zoals dat artikel
      gold bij de inwerkingtreding van deze regeling, aan een houder van dieren af te leveren tot 1 januari 2014 en, na
      die datum, tot het tijdstip waarop een besluit als bedoeld in het tweede lid is genomen, met inachtneming van de
      informatie als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel77
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel10.1
