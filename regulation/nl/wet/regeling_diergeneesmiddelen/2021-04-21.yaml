  - number: 10.4.2
    text: |-
      Indien voor 1 januari 2014 een aanvraag als bedoeld in [artikel 2.1][ref1] in samenhang met de
      [artikelen 3.4][ref2] of [3.5 van het besluit][ref3] wordt ingediend, blijft het na 1 januari 2014 toegestaan het
      diergeneesmiddel, bedoeld in het eerste lid, in de handel te brengen tot een besluit op de aanvraag is genomen
      en het diergeneesmiddel met betrekking tot de samenstelling, verpakking en informatie in, op of bij de verpakking
      voldoet aan het dossier dat bij de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel3
