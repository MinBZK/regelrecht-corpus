articles:
  - number: 1.1.1
    text: |-
      In deze regeling wordt verstaan onder: - *antimicrobiële diergeneesmiddelen:* diergeneesmiddelen, niet zijnde sera
      of entstoffen, die substanties bevatten die al dan niet na omzetting, in staat zijn in een dier de vermeerdering
      van micro-organismen of virussen te verhinderen bij een concentratie van 10 microgram/ml of lager, of die in staat
      zijn de groei van een cultuur van micro-organismen of virussen tegen te gaan bij een concentratie van 5 microgram/
      ml of lager;
        - *algemene benaming:* de door de Wereldgezondheidsorganisatie aanbevolen algemene internationale benaming of, bij
      ontstentenis daarvan, de algemeen gangbare benaming;
        - *aquacultuurdieren:* levende vissen en schaal- en weekdieren die afkomstig zijn van een bedrijf, met inbegrip van
      voor een bedrijf bestemde dieren die oorspronkelijk in het wild leefden;
        - *autovaccin:* entstof die bereid is met behulp van een uit één of meer dieren geïsoleerde pathogene organismen
      of antigenen met het oog op de incidentele toepassing bij datzelfde dier of diezelfde dieren of dieren die daarmee
      tezamen worden gehouden op dezelfde locatie;
        - *Beschikking 1999/879/EG:* Beschikking van de Raad van 17 december 1999 betreffende het op de markt brengen en
      het toedienen van boviene somatotropine (BST) en tot intrekking van Beschikking 90/218/EEG (PbEG 1999 L 879);
        - *besluit:* [Besluit diergeneesmiddelen][ref1];
        - *Commissie:* Commissie registratie diergeneesmiddelen, bedoeld in [artikel 2.1][ref2];
        - *experimentele keuring:* een keuring voor controle als bedoeld in artikel 82, eerste lid, van [Richtlijn 2001/82/
      EG](32001L0082);
        - *hormoonpreparaten:* diergeneesmiddelen die geheel of gedeeltelijk bestaan uit één of meer substanties die al dan
      niet na omzetting in het lichaam in een dier een fysiologisch gelijksoortige of tegengestelde werking uitoefenen
      als een of meer natuurlijke hormonen of die bestemd zijn om de werking van hormonen of endocriene organen
      rechtstreeks te beïnvloeden, zonder effect te hebben op de immuniteit van een dier;
        - *ingrijpende wijziging:* ingrijpende wijziging van type II als bedoeld in artikel 2, derde lid, en bijlage II,
      onderdeel 2, bij [Verordening (EG) nr. 1234/2008](32008R1234);
        - *kleine wijziging van de eerste categorie:* kleine wijziging van type IA als bedoeld in artikel 2, tweede lid, en
      bijlage II, onderdeel 1, bij [Verordening (EG) nr. 1234/2008](32008R1234);
        - *kleine wijziging van de tweede categorie:* kleine wijziging van type IB als bedoeld in artikel 2, vijfde lid,
      van [Verordening (EG) nr. 1234/2008](32008R1234);
        - *landbouwhuisdieren:* runderen, varkens, schapen, geiten, eenhoevigen, pluimvee en tamme konijnen, alsook wilde
      dieren van genoemde soorten en wilde herkauwers, voor zover zij op een bedrijf worden gehouden;
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *partijvrijgiftecertificaat:* document op grond waarvan de desbetreffende partij in de handel mag worden
      gebracht;
        - *partijvrijgiftedocument:* document opgesteld door de houder van de vergunning voor vervaardiging, degene
      die melding doet van invoer of de houder van de vergunning voor invoer ter zake van een bepaalde partij van
      een diergeneesmiddel: a. waarin is vermeld de naam en het registratienummer van het middel, het nummer van de
      desbetreffende partij en de partijgrootte, b. dat ondertekend is door de persoon die verantwoordelijk is voor de
      kwaliteitszorg, bedoeld in [artikel 4.2, eerste lid, onderdeel f, van het besluit][ref3], c. dat een verklaring
      bevat dat: 1°. de bereiding en de kwaliteitscontroles van die partij in overeenstemming zijn met de eisen die
      aan goede praktijken bij het vervaardigen van een diergeneesmiddel zijn gesteld, en 2°. de partij voldoet aan de
      documenten, waaronder het dossier, die overeenkomstig artikel 12, derde lid, van [richtlijn 2001/82/EG](32001L0082)
      zijn overgelegd bij de aanvraag om een vergunning voor het in de handel brengen van het betrokken diergeneesmiddel;
        - *partijprotocol:* document opgesteld door de houder van de vergunning voor vervaardiging van een bepaalde
      partij van een diergeneesmiddel waarop het verloop en de technische en wetenschappelijke resultaten van de bij de
      vergunning voor het in de handel brengen voorgeschreven controles zijn vermeld of, indien het product is ingevoerd
      uit een land niet behorend tot een EER-lidstaat, het verloop en de technische en wetenschappelijke resultaten van
      de controles, die voor de invoer zijn voorgeschreven;
        - *reconstitutie:* het bijeenbrengen van verschillende componenten tot een gebruiksklaar diergeneesmiddel;
        - *resistentie-inducerende diergeneesmiddelen:* diergeneesmiddelen die een blijvende resistentie kunnen induceren
      bij voordien voor dat diergeneesmiddel gevoelige pathogene micro-organismen, virussen, inwendige parasieten of
      uitwendige parasieten;
        - *Richtlijn 90/167/EEG:* [Richtlijn 90/167/EEG](31990L0167) van de Raad van 26 maart 1990 tot vaststelling van de
      voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale werking (PbEG
      1990, L 092);
        - *Richtlijn 91/412/EEG:* [Richtlijn nr. 91/412/EEG](31991L0412) van de Commissie van de Europese Gemeenschappen
      van 23 juli 1991 tot vastlegging van beginselen en richtsnoeren inzake goede praktijken bij het vervaardigen van
      geneesmiddelen voor diergeneeskundig gebruik (PbEG 1991, L 228);
        - *Richtlijn 2006/130/EG:* [Richtlijn nr. 2006/130/EG](32006L0130) van de Commissie van de Europese Gemeenschappen
      van 11 december 2006 tot uitvoering van [Richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement en de
      Raad, wat betreft de vaststelling van criteria voor de vrijstelling van het vereiste van een voorschrift van een
      dierenarts voor het verstrekken van bepaalde geneesmiddelen voor diergeneeskundig gebruik ten behoeve van voor de
      productie van levensmiddelen bestemde dieren (PbEG 2006, L 349);
        - *uitbreiding van een vergunning voor het in de handel brengen:* uitbreiding als bedoeld in bijlage I bij
      [Verordening (EG) nr. 1234/2008](32008R1234);
        - *veiligheidsonderzoek na verstrekking van een vergunning voor het in de handel brengen:* een farmaco-
      epidemiologisch onderzoek of een klinische proef die overeenkomstig de vergunning voor het in de handel brengen
      wordt uitgevoerd teneinde een gevaar voor de veiligheid in verband met een diergeneesmiddel waarvoor de vergunning
      is verstrekt te specificeren of te onderzoeken;
        - *Verordening (EG) nr. 1950/2006:* [Verordening (EG) nr. 1950/2006](32006R1950) van de Commissie van de Europese
      Gemeenschappen van 13 december 2006 tot vaststelling, overeenkomstig [Richtlijn 2001/82/EG](32001L0082) van
      het Europees Parlement en de Raad tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor
      diergeneeskundig gebruik van een lijst van stoffen die essentieel zijn voor de behandeling van paardachtigen (PbEG
      2006, L 367);
        - *Verordening (EG) nr. 1234/2008:* [Verordening (EG) nr. 1234/2008](32008R1234) van de Commissie van de Europese
      Gemeenschappen van 24 november 2008 betreffende het onderzoek van wijzigingen in de voorwaarden van vergunningen
      voor het in de handel brengen van geneesmiddelen voor menselijk gebruik en geneesmiddelen voor diergeneeskundig
      gebruik (PbEU 2008. L 334);
        - *Verordening (EU) nr. 37/2010:* Verordening (EU) nr. 37/2010 van de Commissie van de Europese Unie van 22
      december 2009 betreffende farmacologisch werkzame stoffen en de indeling daarvan op basis van maximumwaarden voor
      residuen in levensmiddelen van dierlijke oorsprong (PbEU 2010, L 15);
        - *verordening (EU) nr. 2017/625:* verordening (EU) nr. 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), (EG) nr. [396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151). (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen (EG) nr. [1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [2007/43/EG](31943R2007), [2008/119/
      EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de Verordeningen [(EG) nr.
      854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en de Raad, de Richtlijnen
      [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/EEG](32396R0091), [96/23/EG]
      (31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit [92/438/EEG](32338R0092) van
      de Raad (verordening officiële controles) (Pb EU L 95).


