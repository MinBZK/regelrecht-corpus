  - number: 8.7.a
    text: Wageningen Bioveterinary Research van Stichting Wageningen Research;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.7
  - number: 8.7.b
    text: Wageningen Food Safety Research van Stichting Wageningen Research;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.7
  - number: 8.7.c
    text: Rijksinstituut voor volksgezondheid en milieu van het Ministerie van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.7
  - number: 8.8.1
    text: 'Het is een ieder verboden:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.8.1.a
    text: |-
      landbouwhuisdieren of aquacultuurdieren waarbij op enigerlei wijze substanties als bedoeld in bijlage II en III
      van [Richtlijn 96/22/EG](31996L0022) met thyreostatische, oestrogene, androgene of gestagene werking alsmede ß-
      agonisten zijn toegepast in de handel te brengen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.8.1.b
    text: |-
      landbouwhuisdieren of aquacultuurdieren in de handel te brengen waarbij op enigerlei wijze in strijd met
      [Verordening (EG) nr. 470/2009](32009R0470) zijn toegepast:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.8.1.b.1°
    text: farmacologisch werkzame substanties als bedoeld in de bijlage bij Verordening (EU) nr. 37/2010, of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.8.1.b.2°
    text: |-
      farmacologisch werkzame substanties die in een lijst zijn ingedeeld overeenkomstig artikel 14, tweede lid,
      onderdeel d, van [verordening (EG) nr. 470/2009](32009R0470);
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.8.1.c
    text: |-
      landbouwhuisdieren of aquacultuurdieren in de handel te brengen waarvoor in het geval van toediening van toegestane
      stoffen of producten de daarvoor voorgeschreven wachttijd niet in acht is genomen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.8.1.d
    text: verwerkte producten of vlees van dieren als bedoeld in de onderdelen a en b in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.8.2
    text: |-
      Het eerste lid, onderdelen a, b en d, is niet van toepassing op dieren als bedoeld in het eerste lid, onderdeel
      a, en verwerkte producten of vlees van die dieren, indien bij die dieren diergeneesmiddelen zijn toegepast
      overeenkomstig bij of krachtens [artikel 2.19 van de wet][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 8.8.3
    text: |-
      Het eerste lid, aanhef en onderdeel b, is niet van toepassing op dieren als bedoeld in het eerste lid, onderdeel
      a, en verwerkte producten of vlees van die dieren, indien overeenkomstig de artikelen 18 en 19 van [verordening
      (EG) nr. 470/2009](32009R0470) een actiedrempel voor een farmacologisch werkzame substantie is vastgesteld en deze
      actiedrempel niet is overschreden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.8
  - number: 8.10.1
    text: |-
      De verschillende betrokken partners in de veehouderijsector voeren zelf kwaliteitscontrole
      uit, gericht op de naleving van [artikel 2.2, vijfde lid, van de Wet dieren][ref1],
      [artikel 2.8 van het Besluit houders van dieren][ref2] en [artikel 8.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel8
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: 8.10.2
    text: 'Bij kwaliteitscontrole als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.10
  - number: 8.10.2.a
    text: |-
      worden de zelfcontrolemaatregelen opgenomen in daarvoor in aanmerking komende algemene voorwaarden voor merken
      en labels;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.10
  - number: 8.10.2.b
    text: |-
      vervallen de voordelen, verbonden aan de deelname aan een kwaliteitscontrolesysteem, voor een bedrijf ten aanzien
      waarvan vanwege niet-naleving van regels als bedoeld in het eerste lid, maatregelen als bedoeld in artikel 138,
      eerste lid, van verordening (EU) 2017/625 of artikel 5.10, 5.11 of 5.12 van de wet maatregelen zijn getroffen,
      gedurende een periode van ten minste twaalf maanden vanaf de datum vanaf de datum dat deze maatregelen zijn
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.10
  - number: '8.19'
    text: |-
      De Minister is bevoegd tot aanwijzing van nationale referentielaboratoria als bedoeld in artikel 100, eerste lid,
      eerste zin, van verordening (EU) 2017/625, ten aanzien van onderwerpen die diergeneesmiddelen of substanties als
      bedoeld in [artikel 8.8][ref1] betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel8
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: 9.1.1
    text: |-
      Voor de betaling van een op grond van deze regeling verzonden factuur met betrekking tot een retributie geldt een
      betalingstermijn van dertig dagen, gerekend vanaf de datering van de factuur.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
  - number: 9.1.2
    text: |-
      Indien dertig dagen na de datering van de in het eerste lid bedoelde factuur het verschuldigde niet is voldaan,
      deelt de minister aan de schuldenaar mede, dat zolang het verschuldigde niet is voldaan, de behandeling van de
      aanvraag, het verrichten van werkzaamheden of het leveren van materialen is opgeschort tot:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
  - number: 9.1.2.a
    text: de factuur is voldaan, of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
  - number: 9.1.2.b
    text: |-
      betaling van de verschuldigde bedragen naar het oordeel van de minister voldoende is gegarandeerd door borgstelling
      door een door de schuldenaar voorgestelde bankinstelling, welke instelling zich voor twee jaar borg stelt voor
      betaling van de verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
  - number: 9.1.3
    text: Na de mededeling, bedoeld in het tweede lid, kan worden overgegaan tot gerechtelijke invordering.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
  - number: 9.1.4
    text: Voor zover verschuldigd, is de omzetbelasting in het tarief begrepen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
  - number: 9.1.5
    text: |-
      Indien een vergoeding als bedoeld in [artikel 9.1, eerste lid, onderdeel b, van de wet][ref1] niet wordt voldaan,
      kan de minister besluiten de instandhouding beëindigen door schorsing of intrekking van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
  - number: 9.1.6
    text: |-
      Indien een vergoeding als bedoeld in [artikel 9.1, eerste lid, onderdeel c, van de wet][ref1] niet wordt voldaan,
      kan de minister de ontheffing intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
  - number: 9.2.1
    text: |-
      De jaarlijkse vergoeding van kosten terzake van de instandhouding van een vergunning voor het in de handel
      brengen van diergeneesmiddelen als bedoeld in [artikel 9.1, eerste lid, onderdeel b][ref1], in samenhang met
      [2.19, eerste lid, van de wet][ref2], bedraagt € 522.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 9.2.2
    text: |-
      In afwijking van het eerste lid bedraagt de jaarlijkse vergoeding van kosten voor homeopathische diergeneesmiddelen
      als bedoeld in de [artikel 3.4 van het besluit][ref1] € 261,–.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 9.2.3
    text: |-
      In afwijking van het eerste lid bedraagt de jaarlijkse vergoeding van kosten voor homeopathische diergeneesmiddelen
      als bedoeld in de [artikel 3.5, eerste lid, van het besluit][ref1] voorzover dit artikel betrekking heeft op
      gezelschapsdieren en exotische diersoorten € 261,–.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 9.2.4
    text: |-
      In afwijking van het eerste lid bedraagt de jaarlijkse vergoeding van kosten voor een toestemming als bedoeld in
      [artikel 3.7, tweede lid, onderdeel b][ref1], € 261,–.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 9.2.5
    text: |-
      In afwijking van het eerste lid bedraagt de jaarlijkse vergoeding van kosten voor een
      vergunning als bedoeld in [artikel 4.1, eerste lid][ref1], [4.21, eerste lid][ref2], en
      [artikel 5.1, met uitzondering van het derde lid][ref3], van het besluit € 52,–.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 9.2.6
    text: |-
      In afwijking van het eerste lid bedraagt de jaarlijkse vergoeding van kosten na een melding als bedoeld in
      [artikel 4.1, tweede lid][ref1], van het besluit: € 30,–.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 9.2.7
    text: |-
      In afwijking van het eerste lid bedraagt de vergoeding een gedeelte van een jaar nadat de vergunning is verstrekt
      naar rato van het aantal maanden waarin het is toegestaan het diergeneesmiddel in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.2
  - number: 9.3.1
    text: |-
      Voor de vergoeding van kosten terzake van een onderzoek, bedoeld in
      [artikel 9.1, eerste lid, onderdeel g, van de Wet dieren][ref1] met betrekking tot diergeneesmiddelen of andere
      substanties worden in aanmerking genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
  - number: 9.3.1.a
    text: |-
      het onderzoek naar de redenen voor de aanwezigheid van residuen in de onderzochte monsters op enig bedrijf waar de
      bemonsterde dieren of producten van afkomstig zijn of kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.1.b
    text: het nemen van monsters;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.1.c
    text: de analyse van de genomen monsters;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.1.d
    text: overige onderzoeken.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2
    text: |-
      De kosten, bedoeld in het eerste lid, worden door de minister in rekening gebracht en zijn, in voorkomend geval,
      opgebouwd uit de volgende componenten:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2.a
    text: laboratoriumkosten;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2.b
    text: met de analyse van de monsters gemoeide verzendkosten;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2.c
    text: administratiekosten;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2.d
    text: verblijfskosten van de bij de werkzaamheden betrokkenen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2.e
    text: reiskosten van de bij de werkzaamheden betrokkenen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2.f
    text: een bedrag per uur per met de werkzaamheden belaste persoon;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.2.g
    text: overige kosten die verband houden met de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
  - number: 9.3.3
    text: |-
      Indien kosten in rekening worden gebracht in verband met een controle op aangewezen substanties in dieren of
      dierlijke producten als bedoeld in [artikel 8.8][ref1] kan het in het eerste lid bedoelde bedrag in rekening worden
      gebracht tezamen met voor de uitvoering van [hoofdstuk 8, paragraaf 3][ref2], in rekening te brengen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032626
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '9.4'
    text: |-
