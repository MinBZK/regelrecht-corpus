  - number: 2.5.d.7°
    text: toepassing tijdens drachtigheid, lactatie of eierproductie,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.d.8°
    text: interactie met andere diergeneesmiddelen of andere vormen van interactie,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.d.9°
    text: dosering en wijze van toepassing,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.d.10°
    text: |-
      in voorkomend geval van overdosering: - de symptomen,
        - de noodprocedures, en
        - de tegengiffen,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.d.11°
    text: |-
      de in acht te nemen wachttermijnen bij dieren die voor de productie van levensmiddelen zijn bestemd voor de
      verschillende levensmiddelen, waaronder die waarvoor geen wachttermijn is,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.e
    text: 'farmacologiche eigenschappen:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.e.1°
    text: dynamische eigenschappen,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.e.2°
    text: farmacokinetische bijzonderheden,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.f
    text: 'de volgende farmaceutische gegevens:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.f.1°
    text: lijst van hulpstoffen,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.f.2°
    text: voornaamste onverenigbaarheden,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.f.3°
    text: |-
      uiterste houdbaarheidsdatum bij een ongeopende verpakking en zo nodig de uiterste gebruiksdatum na reconstitutie
      van het diergeneesmiddel of wanneer de primaire verpakking voor het eerst wordt geopend,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.f.4°
    text: bijzondere voorzorgsmaatregelen bij opslag,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.f.5°
    text: aard en samenstelling van de primaire verpakking,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.f.6°
    text: |-
      bijzondere voorzorgsmaatregelen bij de verwijdering van niet-toegepaste diergeneesmiddelen of, in voorkomend geval,
      van afvalstoffen die ontstaan bij het toepassen van diergeneesmiddelen,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.g
    text: |-
      de houder van de vergunning voor het in de handel brengen, bedoeld in [artikel 2.12 van het besluit][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.5.h
    text: |-
      het nummer van de vergunning, bedoeld in [artikel 2.12 van het besluit][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.5.i
    text: |-
      de datum van de eerste verstrekking van de vergunning en indien van toepassing van de verlenging van de vergunning,
      en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
  - number: 2.5.j
    text: |-
      datum van herziening van de samenvatting van de productkenmerken na een besluit tot verlenging, wijziging of
      gedeeltelijke intrekking van de vergunning, bedoeld in [hoofdstuk 2, paragraaf 5, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        paragraaf: '5'
  - number: 2.6.1
    text: |-
      De uitvoerige, kritische samenvattingen, bedoeld in [artikel 2.3, eerste lid, onderdeel b, van het besluit][ref1]
      worden opgesteld en ondertekend door personen die de vereiste technische capaciteiten of beroepskwalificaties
      bezitten.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.6.2
    text: |-
      De personen, bedoeld in het eerste lid, rechtvaardigen een eventuele verwijzing naar een bibliografie als bedoeld
      in [artikel 3.10 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 2.6.3
    text: |-
      Bij de samenvattingen, bedoeld in het eerste lid, wordt een beknopt curriculum vitae van de personen, bedoeld
      in het eerste lid, in een bijlage opgenomen, waarin de technische capaciteiten en beroepskwalificaties van deze
      personen zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.6
  - number: '2.7'
    text: |-
      De minister kan bij de behandeling van een aanvraag als bedoeld in [artikel 2.1 van het besluit][ref1] een
      diergeneesmiddel, waaronder een grondstof, tussenproduct of ander bestanddeel van dat diergeneesmiddel,
      onderwerpen aan een onderzoek door een laboratorium aangewezen krachtens een EU-rechtshandeling of krachtens
      [artikel 8.3 van het besluit][ref2] om:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel8
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '8'
  - number: 2.7.a
    text: te verzekeren dat de door de fabrikant toegepaste en in het dossier beschreven controlemethoden bevredigend zijn en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.7
  - number: 2.7.b
    text: |-
      zich ervan te vergewissen, met name door overleg met het aangewezen laboratorium, dat de door de aanvrager
      voorgelegde analytische methode voor de opsporing van residuen bevredigend is.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.7
  - number: '2.8'
    text: |-
      Een beoordelingsrapport als bedoeld in [artikel 2.12, onder c, van het besluit][ref1], bevat tenminste de
      beoordeling van en opmerkingen over het dossier betreffende de resultaten van:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.8.a
    text: de farmaceutische proeven,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.8
  - number: 2.8.b
    text: de onschadelijkheids- en residuproeven,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.8
  - number: 2.8.c
    text: de preklinische en klinische proeven,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.8
  - number: 2.8.d
    text: het onderzoek naar de veiligheid van de toediener, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.8
  - number: 2.8.e
    text: de milieurisicobeoordeling.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.8
  - number: 2.9.1
    text: |-
      De aanvrager van een vergunning voor het in de handel brengen van een diergeneesmiddel als bedoeld in
      [artikel 2.4 van het besluit][ref1], overlegt documenten waarin hij:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.9.1.a
    text: |-
      verklaart dat het ingediende dossier en de uitvoerige kritische samenvattingen in alle EER-lidstaten geheel gelijk
      zijn en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.9
  - number: 2.9.1.b
    text: |-
      aan Nederland verzoekt op te treden als referentielidstaat of vermeldt bij welke EER-lidstaat dit verzoek is
      ingediend.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.9
  - number: 2.9.2
    text: |-
      Indien de aanvrager aan de minister verzoekt om Nederland als referentielidstaat op te doen treden, overlegt hij
      een ontwerpbeoordelingsrapport, een ontwerpsamenvatting van de productkenmerken en een ontwerpetikettering en
      -bijsluiter.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.9
  - number: '2.10'
    text: Een vergunning voor het in de handel brengen van een diergeneesmiddel wordt geweigerd indien het diergeneesmiddel
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.10
  - number: 2.10.a
    text: 'een werkzame stof bevat:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.10
  - number: 2.10.a.1°
    text: |-
      die niet is opgenomen in een monografie die is opgenomen in een Europese farmacopee, samengesteld krachtens het
      op 22 juli 1964 te Straatsburg tot stand gekomen Verdrag inzake de samenstelling van een Europese farmacopee
      (Trb. 1966, 115) of een farmacopee van een EER-lidstaat en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.10
  - number: 2.10.a.2°
    text: |-
      waarvoor bij de aanvraag geen monografie is ingediend in overeenstemming met bijlage 1 van [richtlijn 2001/82/EG]
      (32001L0082), of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.10
  - number: 2.10.b
    text: |-
      een werkzame stof bevat die niet voldoet aan de in de desbetreffende monografie gegeven specificaties ten aanzien
      van de kwaliteit.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.10
  - number: '2.11'
    text: |-
      Een aanvraag om een vergunning voor het in de handel brengen van een diergeneesmiddel wordt niet in behandeling
      genomen, indien het diergeneesmiddel:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.11
  - number: 2.11.a
    text: |-
      wordt bereid, bewerkt of verwerkt met een ziekteverwekker die brucellosis melitensis, brucellosis suis, brucellosis
      bang of rundertuberculose kan veroorzaken,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.11
  - number: 2.11.b
    text: somatotropine bevat, waaronder somatotropine als bedoeld in beschikking 1999/879/EG, of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.11
  - number: 2.11.c
    text: een niet-geïnactiveerd hondsdolheidvirus bevat.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.11
  - number: '2.12'
    text: |-
      Een vergunning voor het in de handel brengen van een diergeneesmiddel wordt geweigerd indien het diergeneesmiddel
      bestemd is of mede bestemd is om te worden toegepast bij dieren die zijn bestemd voor de productie van
      levensmiddelen en het diergeneesmiddel:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.12
  - number: 2.12.a
    text: niet voldoet aan de voorwaarden in bijlage, tabel 1, Toegestane stoffen, bij Verordening (EU) nr. 37/2010,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.12
  - number: 2.12.b
    text: |-
      een substantie bevat dat niet is opgenomen in de bijlage, tabel 1, Toegestane stoffen, bij Verordening (EU) nr.
      37/2010,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.12
  - number: 2.12.c
    text: een substantie bevat dat is opgenomen in de bijlage, tabel 2, Verboden stoffen, bij Verordening (EU) nr. 37/2010,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.12
  - number: 2.12.d
    text: |-
      een substantie bevat als bedoeld in bijlage II bij [Richtlijn 96/22/EG](31996L0022), tenzij de aanvraag uitsluitend
      betrekking heeft op een toepassing voor therapeutische doeleinden als bedoeld in artikel 4, punt 2, van [Richtlijn
      nr. 96/22/EG](31996L0022) en het diergeneesmiddel niet een product als bedoeld in artikel 6, tweede lid, van
      [richtlijn 96/22/EG](31996L0022) is,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.12
  - number: 2.12.e
    text: |-
      een substantie bevat als bedoeld in bijlage III bij [Richtlijn 96/22/EG](31996L0022), tenzij de aanvraag
      uitsluitend betrekking heeft op een toepassing voor doeleinden als bedoeld in artikel 4 of 5 van [Richtlijn nr.
      96/22/EG](31996L0022) en het diergeneesmiddel niet een product als bedoeld in artikel 6, tweede lid, van [richtlijn
      96/22/EG](31996L0022) is,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.12
  - number: 2.12.f
    text: |-
      is bestemd voor de behandeling van paardachtigen met een substantie als bedoeld in bijlage I bij [Verordening (EG)
      nr. 1950/2006](32006R1950) en de aanvraag niet voldoet aan de in deze verordening gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.12
  - number: '2.13'
    text: |-
      De minister verbindt aan de vergunning voor het in de handel brengen van een diergeneesmiddel het
      voorschrift dat het diergeneesmiddel uitsluitend wordt afgeleverd na te zijn voorgeschreven als bedoeld in
      [artikel 5.8, aanhef en onder a, van het besluit][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
  - number: 2.13.a
    text: 'voor het diergeneesmiddel een leverings- of gebruiksbeperking geldt, waaronder:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.a.1°
    text: |-
      beperkingen die voortvloeien uit de ten uitvoerlegging van de van toepassing zijnde verdragen van de Verenigde
      Naties tegen sluikhandel in verdovende middelen en psychotrope stoffen,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.a.2°
    text: |-
      beperkingen die voortvloeien uit een EU-rechtshandeling op het gebied van diergezondheid, dierenwelzijn,
      volksgezondheid of het milieu,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.b
    text: |-
      het diergeneesmiddel bestemd is om te worden toegepast bij dieren die voor de productie van levensmiddelen
      zijn bestemd en ten minste één van de criteria, bedoeld in artikel 2, onderdelen a tot en met h, van [Richtlijn
      2006/130/EG](32006L0130) niet van toepassing is,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.c
    text: 'voor het diergeneesmiddel een bijzondere voorzorgsmaatregel geldt ten einde elk onnodig risico te vermijden voor:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.c.1°
    text: de diersoort die de doelgroep vormt,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.c.2°
    text: degene die de diergeneesmiddelen toepast,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.c.3°
    text: het milieu,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.d
    text: |-
      het diergeneesmiddel bestemd is voor een behandeling of een pathologisch proces waarvoor een nauwkeurige
      voorafgaande diagnose vereist is, of waarvan de toepassing van het diergeneesmiddel de diagnose of de therapie
      nadien kan bemoeilijken of beïnvloeden,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.e
    text: |-
      het noodzakelijk is dat de voor te schrijven hoeveelheid diergeneesmiddel beperkt blijft tot de beoogde behandeling
      of therapie, onder meer indien:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.e.1°
    text: |-
      er vóór de keuze van het toe te passen diergeneesmiddel een noodzaak is tot diagnosestelling, waaronder het gebruik
      van tests en andere diagnostische hulpmiddelen of instrumenten,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.e.2°
    text: |-
      toepassing van het diergeneesmiddel een risico met zich brengt voor het dier, degene die het diergeneesmiddel
      toepast, het milieu of de volksgezondheid, of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: 2.13.f
    text: |-
      het diergeneesmiddel een farmacologisch werkzame stof bevat die nog geen vijf jaar in de Europese Economische
      Ruimte in een diergeneesmiddel in de handel is.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.13
  - number: '2.14'
    text: |-
      De minister kan aan de vergunning voor het in de handel brengen van een diergeneesmiddel het voorschrift
      verbinden dat het diergeneesmiddel uitsluitend wordt afgeleverd na te zijn voorgeschreven als bedoeld in
      [artikel 5.8, aanhef en onder a, van het besluit][ref1], indien de Commissie registratie diergeneesmiddelen dit
      adviseert, omdat een diergeneesmiddel een risico met zich brengt voor het dier, degene die het diergeneesmiddel
      toepast, de volksgezondheid of het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
  - number: '2.15'
    text: |-
      De minister verbindt aan een vergunning voor het in de handel brengen het voorschrift dat een diergeneesmiddel
      als bedoeld in de [artikelen 2.13][ref1] en [2.14][ref2] door iedere houder van een vergunning voor kleinhandel
      kan worden afgeleverd, indien aan de vergunning het voorschrift, bedoeld in artikel 2.13, aanhef, is verbonden in
      verband met een risico voor de volksgezondheid, diergezondheid, dierenwelzijn of het milieu dat naar het oordeel
      van de minister beperkt is.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.16'
    text: |-
      De minister verbindt aan een vergunning voor het in de handel brengen het voorschrift dat een diergeneesmiddel als
      bedoeld in [artikelen 2.13][ref1] en [2.14][ref2] uitsluitend door een dierenarts of op recept van de dierenarts
      door een apotheker kan worden afgeleverd, indien aan de vergunning het voorschrift, bedoeld in artikel 2.13,
      aanhef, is verbonden in verband met een risico voor de volksgezondheid, diergezondheid, dierenwelzijn of het milieu
      dat naar het oordeel van de minister niet tot de conclusie leidt dat toepassing door de dierenarts noodzakelijk
      wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.17'
    text: |-
      De minister verbindt aan een vergunning voor het in de handel brengen het voorschrift dat een diergeneesmiddel
      als bedoeld in [artikelen 2.13][ref1] en [2.14][ref2] uitsluitend kan worden afgeleverd door toepassing door de
      dierenarts, indien de [artikelen 2.15][ref3] en [2.16][ref4] niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.18.1
    text: 'De minister kan aan een vergunning voor het in de handel brengen het voorschrift verbinden dat:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.18
  - number: 2.18.1.a
    text: |-
      een andere persoon dan een dierenarts eveneens gekwalificeerd is om het diergeneesmiddel, bedoeld in
      [artikel 2.13, aanhef][ref1], in afwijking van de [artikelen 2.15 tot en met 2.17][ref2] toe te passen of af te
      leveren, indien die toepassing of het afleveren nodig is voor de beroepsuitoefening van een dergelijke persoon
      onder de bij die vergunning te stellen voorschriften of


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.18.1.b
    text: |-
      een houder van een dier gekwalificeerd kan zijn om het diergeneesmiddel, bedoeld in [artikel 2.17][ref1], toe te
      passen bij een in het voorschrift te bepalen behandeling onder verantwoordelijkheid van de dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.18.2
    text: |-
      In afwijking van krachtens deze paragraaf aan een vergunning verbonden voorschriften worden in [bijlage 1][ref1]
      bij deze regeling toepassingen van werkzame stoffen aangewezen die als diergeneesmiddel bij een diersoort door:


      [ref1]: https://wetten.overheid.nl/BWBR0032626
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0032626
  - number: 2.18.2.a
    text: |-
      andere personen dan de dierenarts toegepast kunnen worden indien deze persoon naar het oordeel van de minister
      onder nader te stellen voorschriften voor die toepassing van een diergeneesmiddel voldoende gekwalificeerd is of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.18
  - number: 2.18.2.b
    text: |-
      houders van dieren onder verantwoordelijkheid van een dierenarts kunnen worden toegepast, indien houders van dieren
      naar het oordeel van de minister onder nader te stellen voorschriften voor die toepassing van een diergeneesmiddel
      voldoende gekwalificeerd zijn.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.18
  - number: 2.18.3
    text: |-
      Onverminderd [artikel 3:42, eerste lid, van de Algemene wet bestuursrecht][ref1] deelt de minister een besluit met
      betrekking tot [bijlage 1][ref2] mee op een website.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032626
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0032626
  - number: '2.19'
    text: 'De regels, gesteld in deze paragraaf, zijn van toepassing als:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.19
  - number: 2.19.a
    text: |-
      voorwaarde in verband met het overleggen van documenten als bedoeld in
      [artikel 2.3, derde lid, van het besluit][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.19.b
    text: |-
      voorschrift voor het in de handel brengen van een diergeneesmiddel met betrekking tot de verpakking en informatie
      op, bij of in de verpakking als bedoeld in [artikel 2.13 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.20.1
    text: 'De verpakking van een diergeneesmiddel:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.20
  - number: 2.20.1.a
    text: |-
      is ten minste bestand tegen elke normale behandeling, waarbij rekening wordt gehouden met de risico’s van het
      diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.20
  - number: 2.20.1.b
    text: is zodanig dat de inhoud niet kan ontsnappen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.20
  - number: 2.20.1.c
    text: |-
      is geschikt om de samenstelling en de zuiverheid van het daarin verpakte diergeneesmiddel te waarborgen gedurende
      de aangegeven houdbaarheidstermijn onder de voorgeschreven of aanbevolen bewaaromstandigheden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.20
  - number: 2.20.2
    text: |-
      De sluiting van de primaire verpakking en, in voorkomend geval, van de buitenverpakking is van zodanige aard dat
      deze niet zonder zichtbare en onherstelbare beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.20
  - number: 2.21.1
    text: |-
      Alle ingevolge deze paragraaf voorgeschreven informatie op, bij of in een verpakking is gesteld in de Nederlandse
      taal in goed leesbaar en onuitwisbaar schrift en in begrijpelijke bewoordingen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.21
  - number: 2.21.2
    text: Indien de bijsluiter in verschillende talen is opgesteld, is de informatie in alle gebruikte talen gelijk.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.21
  - number: 2.21.3
    text: |-
      Andere dan de ingevolge deze paragraaf voorgeschreven informatie komt op, bij of in een verpakking of op een
      begeleidend document slechts voor, indien deze informatie:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.21
  - number: 2.21.3.a
    text: niet met de voorgeschreven informatie in strijd is,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.21
  - number: 2.21.3.b
    text: |-
      niet misleidend is ten aanzien van aard, samenstelling, eigenschappen en toepassingswijze van het diergeneesmiddel
      en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.21
  - number: 2.21.3.c
    text: |-
      voor zover aangebracht op de primaire verpakking, buitenverpakking of de bijsluiter, deze informatie duidelijk
      gescheiden is van de voorgeschreven informatie.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.21
  - number: 2.22.1
    text: 'De primaire verpakking en, in voorkomend geval, de buitenverpakking van een diergeneesmiddel vermeldt:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.a
    text: |-
      de naam van het diergeneesmiddel, onmiddellijk gevolgd door de concentratie en de farmaceutische vorm met dien
      verstande dat in het geval het diergeneesmiddel slechts één werkzame stof bevat en de naam van het diergeneesmiddel
      een fantasienaam is, de algemene benaming wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.b
    text: |-
      de kwalitatieve en kwantitatieve samenstelling aan werkzame stoffen per doseringseenheid, of, naar gelang van de
      toedieningsvorm, voor een bepaald volume of een bepaald gewicht, waarbij de algemene benamingen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.c
    text: het nummer van de fabricagepartij;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.d
    text: het nummer van de vergunning voor het in de handel brengen, vooraf gegaan door de letters ‘Reg. NL’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.e
    text: |-
      de naam of handelsnaam en de woonplaats of plaats van vestiging van de houder van de vergunning voor het in de
      handel brengen als bedoeld in [artikel 2.1, eerste lid, van het besluit][ref1] en, in voorkomend geval, van de door
      de houder van de vergunning voor het in de handel brengen aangewezen vertegenwoordiger,


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.22.1.f
    text: |-
      de diersoort waarvoor het diergeneesmiddel uitsluitend is bestemd, onder vermelding van de dosering, de wijze van
      gebruik en eventueel de wijze van toepassing;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.g
    text: |-
      de wachttermijn bij dieren die voor de productie van levensmiddelen zijn bestemd voor alle betrokken diersoorten en
      voor de verschillende betrokken levensmiddelen afzonderlijk, waaronder die waarvoor geen wachttermijn is;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.h
    text: de uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.i
    text: de bijzondere voorzorgsmaatregelen voor bewaring;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.j
    text: |-
      de bijzondere voorzorgsmaatregelen bij het zich ontdoen van niet gebruikte diergeneesmiddelen en daarvan afkomstige
      afvalproducten;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.k
    text: de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.l
    text: |-
      de vermelding ‘diergeneesmiddel’ of ‘geneesmiddel voor diergeneeskundig gebruik’ met een vermelding voor
      diergeneesmiddelen:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.l.1°
    text: 'die zonder te zijn voorgeschreven verkrijgbaar zijn: ‘Vrij’.'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.l.2°
    text: |-
      die uitsluitend na te zijn voorgeschreven verkrijgbaar zijn als bedoeld in [artikel 5.8 van het besluit][ref1]
      ‘alleen afgeven op voorschrift van een dierenarts’ en de wijze van afleveren van het diergeneesmiddel:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
  - number: 2.22.1.l.2°.1°
    text: ‘uitsluitend op recept afleveren, dan wel ‘U.R.A.’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.l.2°.2°
    text: ‘uitsluitend aflevering door de dierenarts of op recept van de dierenarts door de apotheker’, dan wel ‘U.D.A.’,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.1.l.2°.3°
    text: '‘uitsluitend toepassing door de dierenarts’, dan wel: ‘U.D.D.’;'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.2
    text: |-
      In afwijking van het eerste lid, onderdeel b, kan de minister bij de vergunning voor het in de handel brengen
      toestaan dat de farmaceutische vorm en de inhoud naar gewicht, volume of doseringseenheid, alleen op de
      buitenverpakking wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.22.3
    text: |-
      Het eerste lid, onderdeel l, is overeenkomstig artikel 58, vijfde lid, van [richtlijn 2001/82/EG](32001L0082)
      mede van toepassing op een diergeneesmiddel waarvoor krachtens artikel 35, tweede lid, van [Verordening (EG)
      nr. 726/2004](32004R0726) een vergunning voor het in de handel brengen is verstrekt met dien verstande dat de
      vermelding met betrekking tot de wijze van afleveren, bedoeld in het eerste lid, onderdeel l, subonderdeel 2°, in
      een blauw omlijnd kader is opgenomen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.22
  - number: 2.23.1
    text: |-
      In afwijking van [artikel 2.22][ref1] wordt, indien de primaire verpakking bestaat uit een ampul, de informatie,
      bedoeld in dat artikel, uitsluitend vermeld op de buitenverpakking van de ampul.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.23.2
    text: 'Op de primaire verpakking van een ampul wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
  - number: 2.23.2.a
    text: de naam van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
  - number: 2.23.2.b
    text: de hoeveelheid werkzame stoffen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
  - number: 2.23.2.c
    text: de wijze van toediening;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
  - number: 2.23.2.d
    text: het nummer van de fabricagepartij;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
  - number: 2.23.2.e
    text: de uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
  - number: 2.23.2.f
    text: de vermelding ‘diergeneesmiddel’’ of ‘geneesmiddel voor diergeneeskundig gebruik’.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.23
  - number: '2.24'
    text: |-
      Wanneer een kleine primaire verpakking slechts één gebruiksdosis bevat en de informatie, bedoeld in
      [artikel 2.22][ref1] niet op de primaire verpakking kan worden vermeld, wordt die informatie op de buitenverpakking
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '2.25'
    text: |-
      Wanneer er geen buitenverpakking is wordt alle informatie, bedoeld in [artikel 2.22][ref1], op de primaire
      verpakking vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.1
    text: 'In de buitenverpakking is een bijsluiter opgenomen die ten minste informatie bevat:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
  - number: 2.26.1.a
    text: |-
      als bedoeld in [artikel 2.22, eerste lid, onderdeel a][ref1], alsmede in voorkomend geval een lijst van de namen
      waaronder het diergeneesmiddel in andere EER-lidstaten in de handel wordt gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.1.b
    text: |-
      als bedoeld in [artikel 2.22, eerste lid, onderdeel e, f, g, i, j en k][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.1.c
    text: over de therapeutische indicaties;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
  - number: 2.26.1.d
    text: |-
      over de contra-indicaties en bijwerkingen voorzover deze informatie noodzakelijk is voor het gebruik van het
      diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
  - number: 2.26.2
    text: |-
      Als de informatie, bedoeld in het eerste lid, onderdelen a tot en met d, op de primaire verpakking en op de
      buitenverpakking is aangebracht kan een bijsluiter achterwege worden gelaten.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
  - number: 2.26.3
    text: |-
      Indien een diergeneesmiddel alleen bestemd is om door een dierenarts toegepast te worden kan de minister bij de
      vergunning bepalen dat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
  - number: 2.26.3.a
    text: een bepaald gegeven niet op het etiket of in de bijsluiter behoeft te worden vermeld;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
  - number: 2.26.3.b
    text: de bijsluiter niet in het Nederlands behoeft te worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.26
  - number: '2.27'
    text: |-
      Het etiket van een diergeneesmiddel waarvoor overeenkomstig [artikel 3.5 van het besluit][ref1]
      een vergunning voor het in de handel brengen is verstrekt, vermeldt in afwijking van
      [artikel 2.22, eerste lid, onderdeel l, aanhef][ref2], duidelijk leesbaar: ‘homeopathisch diergeneesmiddel’ of
      homeopathisch geneesmiddel voor diergeneeskundig gebruik’.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '2.28'
    text: |-
      Het etiket van een diergeneesmiddel waarvoor overeenkomstig [artikel 3.4 van het besluit][ref1] een vergunning
      voor het in de handel brengen is verstrekt, vermeldt in afwijking van de [artikelen 2.22][ref2] en [2.27][ref3]:
      uitsluitend de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.28.a
    text: |-
      ‘homeopathisch diergeneesmiddel zonder goedgekeurde therapeutische indicaties’ of homeopathisch geneesmiddel voor
      diergeneeskundig gebruik zonder goedgekeurde therapeutische indicaties’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.b
    text: |-
      de naam van het diergeneesmiddel en de wetenschappelijke benaming van de homeopathische grondstof of grondstoffen,
      gevolgd door de verdunningsgraad, waarvoor gebruik wordt gemaakt van de Europese Farmacopee of bij ontstentenis
      daarvan, een in de EER-lidstaten officieel gebruikte farmacopee, met dien verstande dat indien het diergeneesmiddel
      uit meer dan één homeopathische grondstof bestaat, de etikettering naast de wetenschappelijke benaming van deze
      grondstoffen ook een fantasienaam kan vermelden;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.c
    text: het nummer waaronder de vergunning is verstrekt, voorafgegaan door de letters ‘Reg. NL H’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.d
    text: |-
      de naam of handelsnaam en het adres van de houder van de vergunning voor het in de handel brengen als bedoeld in
      [artikel 2.1, eerste lid, van het besluit][ref1] alsmede, indien de houder van de vergunning voor vervaardiging
      niet tevens houder van de vergunning voor het in de handel brengen is, de naam, de handelsnaam of het merk van de
      houder van de vergunning voor vervaardiging als bedoeld in [artikel 4.1, eerste lid, van het besluit][ref2] voor
      het bereiden van een diergeneesmiddel;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 2.28.e
    text: |-
      de diersoort of diersoorten waarvoor de dosering of doseringen waarin en de wijze of wijzen waarop het betrokken
      diergeneesmiddel uitsluitend mag worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.f
    text: het nummer van de fabricagepartij;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.g
    text: de uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.h
    text: de farmaceutische vorm;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.i
    text: de inhoud van de primaire verpakking naar gewicht, volume of aantal doses;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.j
    text: |-
      de aanbevelingen omtrent de wijze van bewaring en zo nodig aan wijzingen omtrent te nemen voorzorgsmaatregelen bij
      het zich ontdoen van niet gebruikte diergeneesmiddelen en daarvan afkomstige afvalproducten;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: 2.28.k
    text: zonodig de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.28
  - number: '2.29'
    text: |-
      Alle ingevolge deze paragraaf voorgeschreven informatie is van overeenkomstige toepassing bij
      een diergeneesmiddel waarvoor een vrijstelling of een ontheffing is verleend met toepassing van
      [hoofdstuk 3, paragraaf 5, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0032386
        paragraaf: '5'
  - number: '2.30'
    text: |-
      De vergunninghouder overlegt bij de aanvraag om verlenging van de vergunning voor het in de handel brengen
      het verslag, bedoeld in [artikel 6.1, onderdeel b][ref1], over perioden waarover nog geen verslag is
      overgelegd voorzover de informatie in dit verslag niet is opgenomen in een document in de lijst, bedoeld in
      [artikel 2.17, tweede lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
  - number: '2.31'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op een wijziging van een vergunning voor het in de handel brengen die
      niet met toepassing van een procedure als bedoeld in de [artikelen 2.1, derde lid][ref1], [2.4, tweede lid][ref2],
      [2.23][ref3], [2.24][ref4] of [2.25 van het besluit][ref5] is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0032386
        artikel: '2'
  - number: '2.32'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 22, 24 en 25 van [Verordening (EG) nr. 1234/2008]
      (32008R1234).
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.32
  - number: 2.33.1
    text: |-
      Een kennisgeving of een aanvraag van een wijziging van een vergunning voor het in de handel brengen van een
      diergeneesmiddel, die geen uitbreiding van die vergunning inhoudt, bevat de elementen, bedoeld in Bijlage IV bij
      [Verordening (EG) nr. 1234/2008](32008R1234).
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.33
  - number: 2.33.2
    text: |-
      Het nationaal voorschrift, bedoeld in onderdeel 6 van bijlage IV bij [Verordening (EG) nr. 1234/2008](32008R1234)
      is:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.33
  - number: 2.33.2.a
    text: |-
      bij een kleine wijziging van de eerste categorie: [artikel 9.9, eerste lid, onderdelen g en j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.33.2.b
    text: |-
      bij een kleine wijziging van de tweede categorie: [artikel 9.8, onderdeel d][ref1] en
      [artikel 9.9, onderdeel d][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.33.2.c
    text: |-
      bij een ingrijpende wijziging: [artikel 9.8, onderdeel a][ref1] en [artikel 9.9, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.34.1
    text: |-
      Een kennisgeving van een kleine wijziging van de eerste categorie van een vergunning voor het in de handel brengen
      van een diergeneesmiddel wordt in behandeling genomen in overeenstemming met artikel 13bis van [Verordening (EG)
      nr. 1234/2008](32008R1234).
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.34
  - number: 2.34.2
    text: |-
      Met overeenkomstige toepassing van [artikel 2.6 van het besluit][ref1] kan een indiener in de gelegenheid worden
      gesteld om een kennisgeving aan te vullen, ingeval de kennisgeving ongeldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.34.3
    text: |-
      Indien het besluit niet binnen de termijn, genoemd in artikel 13bis, tweede lid, van [Verordening
      (EG) nr. 1234/2008](32008R1234) wordt genomen, wordt de vergunning met toepassing van
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van rechtswege gewijzigd overeenkomstig de geldige
      kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.35.1
    text: |-
      Een aanvraag omtrent een kleine wijziging van de tweede categorie van een vergunning voor het in de handel
      brengen van een diergeneesmiddel wordt behandeling genomen in overeenstemming met artikel 13 ter of artikel 20 van
      [Verordening (EG) nr. 1234/2008](32008R1234).
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
  - number: 2.35.2
    text: |-
      Met overeenkomstige toepassing van [artikel 2.6 van het besluit][ref1] kan een indiener in de gelegenheid worden
      gesteld om een kennisgeving aan te vullen, ingeval de kennisgeving ongeldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.35.3
    text: |-
      Een besluit wordt genomen binnen de termijn, genoemd in artikel 13 ter, tweede lid, of artikel 20, zevende lid,
      onderdeel b, van [Verordening (EG) nr. 1234/2008](32008R1234) tenzij aan de houder van de vergunning bij toepassing
      van artikel 13 ter, tweede lid, van [Verordening (EG) nr. 1234/2008](32008R1234):
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
  - number: 2.35.3.a
    text: een ongunstig advies is gestuurd of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
  - number: 2.35.3.b
    text: een gelegenheid is geboden als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
  - number: 2.35.4
    text: |-
      Indien een houder van de vergunning een ongunstig advies is gestuurd, is artikel 13ter, derde en vierde lid van
      [Verordening (EG) nr. 1234/2008](32008R1234) van toepassing.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
  - number: 2.35.5
    text: |-
      Indien een gelegenheid is geboden als bedoeld in het derde lid, onderdeel b, wordt een besluit genomen binnen een
      termijn van 30 dagen na ontvangst van de aanvullingen, tenzij binnen deze termijn een ongunstig advies als bedoeld
      in het derde lid, onderdeel a, aan de houder van de vergunning is gestuurd.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
  - number: 2.35.6
    text: |-
      Indien het besluit niet wordt genomen binnen de termijn genoemd in het derde of vijfde lid, wordt de vergunning met
      toepassing van [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van rechtswege gewijzigd overeenkomstig
      de aanvraag en de ontvangen aanvullingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.36.1
    text: |-
      Een aanvraag omtrent een ingrijpende wijziging van een vergunning voor het in de handel brengen van een
      diergeneesmiddel wordt behandeling genomen in overeenstemming met artikel 13 quater of artikel 20 van [Verordening
      (EG) nr. 1234/2008](32008R1234).
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.36
  - number: 2.36.2
    text: |-
      Met overeenkomstige toepassing van [artikel 2.6 van het besluit][ref1] kan een aanvrager in de gelegenheid worden
      gesteld om een aanvraag aan te vullen, ingeval de aanvraag ongeldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: '2.37'
    text: |-
      Indien een kennisgeving of een aanvraag als bedoeld in [artikel 2.33][ref1] betrekking heeft op verscheidene
      wijzigingen, wordt de kennisgeving of aanvraag ingediend met inachtneming van artikel 13 quinquies of artikel 20
      van [Verordening (EG) nr. 1234/2008](32008R1234).


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '2.38'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op een wijziging van een vergunning voor het in de handel brengen die
      met toepassing van een procedure als bedoeld in de [artikelen 2.1, derde lid in samenhang met het vierde lid][ref1],
      [2.4, tweede lid][ref2], [2.23][ref3], [2.24][ref4] of [2.25 van het besluit][ref5] is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0032386
        artikel: '2'
  - number: '2.39'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 22, 24 en 25 van [Verordening (EG) nr. 1234/2008]
      (32008R1234) en de artikelen 41, tweede, derde, vierde en vijfde lid, en 42 van [Verordening (EG) nr. 726/2004]
      (32004R0726).
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.39
  - number: 2.40.1
    text: |-
      Een kennisgeving of een aanvraag van een wijziging, die geen uitbreiding van een vergunning voor het in de handel
      brengen van een diergeneesmiddel inhoudt, bevat de elementen, bedoeld in Bijlage IV bij [Verordening (EG) nr.
      1234/2008](32008R1234), tenzij de aanvraag betrekking heeft op een diergeneesmiddel waarvoor met toepassing van
      [Verordening (EG) nr.726/2004](32004R0726) een vergunning is verstrekt door de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.40
  - number: 2.40.2
    text: |-
      Het nationaal voorschrift, bedoeld in onderdeel 6 van bijlage IV bij [Verordening (EG) nr. 1234/2008](32008R1234)
      is:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.40
  - number: 2.40.2.a
    text: |-
      bij een kleine wijziging van de eerste categorie: [artikel 9.9, eerste lid, onderdelen h, i en j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.40.2.b
    text: |-
      bij een kleine wijziging van de tweede categorie: [artikel 9.8, onderdeel d, artikel 9.9, onderdelen e en f][ref1];;


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.40.2.c
    text: |-
      bij een ingrijpende wijziging: [artikel 9.8, onderdelen b en c][ref1], [artikel 9.9, onderdelen b en c][ref2]..


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel9
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.41.1
    text: |-
      Een kennisgeving van een kleine wijziging van de eerste categorie van een vergunning voor het in de handel brengen
      van een diergeneesmiddel wordt behandeling genomen volgens de procedure, bedoeld in artikel 8 van [Verordening (EG)
      nr. 1234/2008](32008R1234), in samenhang met artikel 11 van deze Verordening en bijlage IV bij deze Verordening.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.41
  - number: 2.41.2
    text: |-
      Met overeenkomstige toepassing van [artikel 2.6 van het besluit][ref1] kan een indiener in de gelegenheid worden
      gesteld om een kennisgeving aan te vullen, ingeval de kennisgeving ongeldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.41.3
    text: |-
      Indien het besluit niet binnen de termijn, genoemd in artikel 8, tweede lid, van [Verordening
      (EG) nr. 1234/2008](32008R1234) wordt genomen, wordt de vergunning met toepassing van
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van rechtswege gewijzigd overeenkomstig de geldige
      kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.42.1
    text: |-
      Een aanvraag omtrent een kleine wijziging van de tweede categorie van een vergunning voor het in de handel brengen
      van een diergeneesmiddel wordt in behandeling genomen:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.1.a
    text: |-
      overeenkomstig de procedure, bedoeld in artikel 9 van [Verordening (EG) nr. 1234/2008](32008R1234), in samenhang
      met artikel 11 van deze Verordening en bijlage IV bij deze Verordening, of, voor zover van toepassing,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.1.b
    text: |-
      overeenkomstig de procedure, bedoeld in artikel 20 van [Verordening (EG) nr. 1234/2008](32008R1234), in samenhang
      met bijlagen IV en V bij deze Verordening.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.2
    text: |-
      Met overeenkomstige toepassing van [artikel 2.6 van het besluit][ref1] kan een indiener in de gelegenheid worden
      gesteld om een kennisgeving aan te vullen, ingeval de kennisgeving ongeldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.42.3
    text: |-
      Een besluit wordt genomen binnen de termijn, genoemd in artikel 9, tweede lid, of artikel 20, zevende lid,
      onderdeel b, van [Verordening (EG) nr. 1234/2008](32008R1234) tenzij aan de houder van de vergunning bij toepassing
      van artikel 9, tweede lid, van [Verordening (EG) nr. 1234/2008](32008R1234):
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.3.a
    text: een ongunstig advies is gestuurd of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.3.b
    text: een gelegenheid is geboden als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.4
    text: |-
      Indien een houder van de vergunning een ongunstig advies is gestuurd, is artikel 9, derde en vierde lid van
      [Verordening (EG) nr. 1234/2008](32008R1234) van toepassing.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.5
    text: |-
      Indien een gelegenheid is geboden als bedoeld in het derde lid, onderdeel b, wordt een besluit genomen binnen een
      termijn van 30 dagen na ontvangst van de aanvullingen, tenzij binnen deze termijn een ongunstig advies als bedoeld
      in het derde lid, onderdeel a, aan de houder van de vergunning is gestuurd.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
  - number: 2.42.6
    text: |-
      Indien het besluit niet wordt genomen binnen de termijn genoemd in het derde of vijfde lid, wordt de vergunning met
      toepassing van [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van rechtswege gewijzigd overeenkomstig
      de aanvraag en de ontvangen aanvullingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '2.43'
    text: |-
      Een aanvraag omtrent een ingrijpende wijziging van een vergunning voor het in de handel brengen van een
      diergeneesmiddel wordt in behandeling genomen:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.43
  - number: 2.43.a
    text: |-
      overeenkomstig de procedure, bedoeld in artikel 10 van [Verordening (EG) nr. 1234/2008](32008R1234) in samenhang
      met artikel 11 van deze Verordening en bijlage IV bij deze Verordening, of, voor zover van toepassing,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.43
  - number: 2.43.b
    text: |-
      overeenkomstig de procedure, bedoeld in artikel 20 van [Verordening (EG) nr. 1234/2008](32008R1234), in samenhang
      met bijlagen IV en V bij deze Verordening.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.43
  - number: '2.44'
    text: |-
      Indien een kennisgeving of een aanvraag van een wijziging als bedoeld in de [artikelen 2.41][ref1], [2.42][ref2]
      onderscheidenlijk [2.43][ref3] betrekking heeft op verscheidene wijzigingen, wordt de kennisgeving gedaan of de
      aanvraag ingediend met inachtneming van artikel 7 van [Verordening (EG) nr. 1234/2008](32008R1234).


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '7'
  - number: '2.45'
    text: |-
      Een aanvrager kan aan de minister verzoeken een bijeenkomst van deskundigen te houden in het kader van de
      beoordeling van een diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.45
  - number: 2.46.1
    text: |-
      Het register, bedoeld in [artikel 2.26, derde lid, van het besluit][ref1], is openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 2.46.2
    text: |-
      In het register worden in voorkomend geval ter zake van het betrokken diergeneesmiddel onder vermelding van de
      datum aangetekend:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.a
    text: de verstrekking van een vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.b
    text: de verlenging van een vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.c
    text: de wijziging van een vergunning, waaronder wijziging van aan een vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.d
    text: de schorsing van een vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.e
    text: de opheffing van een schorsing van een vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.f
    text: de intrekking van een vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.g
    text: het vervallen van een vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.2.h
    text: het uitstel van het vervallen van een vergunning.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 2.46.3
    text: |-
      Vanaf de datum waarop een vergunning voor het in de handel brengen van een diergeneesmiddel is ingetrokken of
      vervallen worden de op dat diergeneesmiddel betrekking hebbende gegevens uit het register nog ten minste 10 jaar
      bewaard.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel2.46
  - number: 3.1.1
    text: |-
      Een vereenvoudigde aanvraag als bedoeld in [artikel 3.4 van het besluit][ref1] om vergunning voor een homeopathisch
      diergeneesmiddel wordt in behandeling genomen, indien het dossier voldoet aan artikel 12, derde lid, van [Richtlijn
      2001/82/EG](32001L0082), met uitzondering van artikel 12, derde lid, eerste alinea, onderdelen e, h tot en met k,
      n, p, en de tweede alinea van [Richtlijn 2001/82/EG](32001L0082) en in overeenstemming met bijlage I, titel IV,
      onder 2 van [richtlijn 2001/82/EG](32001L0082).


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 3.1.2
    text: |-
      Een vereenvoudigde aanvraag om vergunning voor een homeopathisch diergeneesmiddel dat is bestemd of
      mede is bestemd voor dieren die bestemd zijn voor de productie van levensmiddelen en overeenkomstig
      [artikel 3.4, eerste lid, van het besluit][ref1] is ingediend in overeenstemming met [Verordening (EG) nr.
      470/2009](32009R0470), voldoet aan Verordening (EU) nr. 37/2010.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 3.1.3
    text: |-
      Een vereenvoudigde aanvraag die betrekking heeft op een reeks diergeneesmiddelen die van dezelfde homeopathische
      grondstof of grondstoffen is afgeleid gaat vergezeld van de in artikel 18, tweede volzin, van [Richtlijn 2001/82/
      EG](32001L0082) genoemde documenten.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.1
  - number: 3.1.4
    text: |-
      Indien bij een vereenvoudigde aanvraag een verklaring wordt overgelegd dat de documenten die bij de aanvraag worden
      overgelegd identiek zijn aan de documenten, bedoeld in [artikel 25, onderdeel b, van de Geneesmiddelenwet][ref1],
      worden die documenten slechts beoordeeld indien dat in verband met de toepassing op dieren in het belang van de
      volksgezondheid, diergezondheid, dierenwelzijn of het milieu nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel25
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '25'
  - number: 3.2.1
    text: |-
      Een aanvraag om vergunning voor een homeopathisch diergeneesmiddel voor toepassing bij gezelschapsdieren of
      exotische diersoorten, die niet bestemd zijn voor de productie van levensmiddelen wordt in behandeling genomen
      zonder documenten inzake de proeven, bedoeld in [artikel 3.5, eerste lid, onderdelen a en b][ref1], indien de
      aanvrager door middel van gedetailleerde wetenschappelijke documentatie kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.2.1.a
    text: de aanvraag is afgestemd op de homeopathische veterinaire geneeskunde en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.2
  - number: 3.2.1.b
    text: het veiligheidsniveau aanvaardbaar is.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.2
  - number: 3.2.2
    text: |-
      Indien bij een aanvraag een verklaring wordt overgelegd dat de documenten die bij de aanvraag worden overgelegd
      identiek zijn aan de documenten, bedoeld in [artikel 25, onderdeel b, van de Geneesmiddelenwet][ref1], worden
      die documenten slechts beoordeeld indien dat in verband met de toepassing op dieren in het belang van de
      volksgezondheid, diergezondheid, dierenwelzijn of het milieu nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel25
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '25'
  - number: '3.3'
    text: 'Indien een aanvraag omtrent een vergunning voor een generiek diergeneesmiddel betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.3
  - number: 3.3.a
    text: |-
      een diergeneesmiddel van een referentiegeneesmiddel waarvoor de Europese Commissie een vergunning voor het in de
      handel brengen heeft verstrekt zijn de artikelen 3, derde en vierde lid, 41 tweede, derde en vierde lid, 34, vierde
      lid, onderdeel e, van [Verordening (EG) nr. 726/2004](32004R0726) van toepassing;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.3
  - number: 3.3.b
    text: |-
      een in Nederland octrooirechtelijk of door middel van een aanvullend beschermingscertificaat beschermd
      diergeneesmiddel dat wordt betrokken uit Bulgarije, Estland, Hongarije, Letland, Litouwen, Polen, Roemenië,
      Slovenië, Slowakije, Tsjechië en daarvoor ten tijde van de registratie van het octrooi of het aanvullende
      beschermingscertificaat in de desbetreffende EER-lidstaat niet een dergelijke bescherming kon worden verkregen,
      wordt bij de aanvraag tevens overgelegd een afschrift van de schriftelijke kennisgeving aan de houder van het
      octrooi of het aanvullende beschermingscertificaat of de begunstigde van die bescherming met betrekking tot het
      referentiegeneesmiddel waaruit blijkt dat de kennisgeving is gedaan ten minste een maand voor de dag waarop de
      aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.3
  - number: 3.4.1
    text: |-
      Een besluit omtrent een vergunning voor parallelle invoer van een diergeneesmiddel wordt genomen binnen 90 dagen na
      ontvangst van een volledige aanvraag.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.4
  - number: 3.4.2
    text: |-
      Indien de aanvraag, bedoeld in het eerste lid, betrekking heeft op een in Nederland octrooirechtelijk of door
      middel van een aanvullend beschermingscertificaat beschermd geneesmiddel voor diergeneeskundig gebruik dat wordt
      betrokken uit Bulgarije, Estland, Hongarije, Letland, Litouwen, Polen, Roemenië, Slovenië, Slowakije, Tsjechië
      en daarvoor ten tijde van de registratie van het octrooi of het aanvullende beschermingscertificaat in de
      desbetreffende EER-lidstaat niet een dergelijke bescherming kon worden verkregen, wordt bij de aanvraag tevens
      overgelegd een afschrift van de schriftelijke kennisgeving aan de houder van het octrooi of het aanvullende
      beschermingscertificaat of de begunstigde van die bescherming met betrekking tot het referentiegeneesmiddel waaruit
      blijkt dat de kennisgeving is gedaan ten minste een maand voor de dag waarop de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.4
  - number: '3.5'
    text: |-
      Een besluit omtrent een afgeleide vergunning voor het in de handel brengen van een diergeneesmiddel als bedoeld in
      [artikel 3.15 van het besluit][ref1] wordt genomen binnen 90 dagen na ontvangst van een volledige aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 3.7.1
    text: |-
      Vrijstelling wordt verleend van het verbod, gesteld in [artikel 2.19, eerste lid, van de wet][ref1]
      voor het in de handel brengen, vervoeren, aanbieden, ontvangen, voorhanden of in voorraad hebben en
      afleveren van diergeneesmiddelen die uitsluitend bestemd zijn voor toepassing bij dieren als bedoeld in
      [artikel 3.19, eerste lid, van het besluit][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 3.7.1.a
    text: |-
      het diergeneesmiddel is vervaardigd of ingevoerd in overeenstemming met [hoofdstuk 4 van het besluit][ref1], met
      uitzondering van [artikel 4.6, onderdeel a, van het besluit][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 3.7.1.b
    text: |-
      de verpakking en de etikettering van het diergeneesmiddel voldoen aan [hoofdstuk 2, paragraaf 4][ref1], met
      uitzondering van [artikel 2.22, eerste lid, onderdelen d en e, eerste zinsdeel][ref2], met betrekking tot de
      vergunning voor in de handel brengen,


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.7.1.c
    text: |-
      niet bij een besluit met betrekking tot het in de handel brengen van een diergeneesmiddel is gebleken dat de
      toepassing van een diergeneesmiddel met de betrokken farmacologisch werkzame stof zonder tussenkomst van een
      dierenarts een gevaar voor de diergezondheid, dierenwelzijn, volksgezondheid of het milieu kan opleveren.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
  - number: 3.7.2
    text: |-
      In afwijking van het eerste lid, onderdeel c, kan een houder van een vergunning voor vervaardiging of groothandel
      in ieder geval niet een antimicrobieel diergeneesmiddel aan een houder van een vergunning voor kleinhandel
      afleveren, tenzij:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
  - number: 3.7.2.a
    text: |-
      de verpakking niet meer dan vijf gram werkzame stof tetracycline, chloortetracyline, oxytetracycline of
      sulfonamiden bevat,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
  - number: 3.7.2.b
    text: |-
      de minister voor het diergeneesmiddel op aanvraag toestemming heeft verleend voor het in de handel brengen van dat
      diergeneesmiddel onder aan de toestemming te verbinden voorschriften, waaronder een voorschrift als bedoeld in de
      [artikelen 2.13 tot en met 2.18][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.7.2.c
    text: |-
      het diergeneesmiddel geen wezenlijke verschillen vertoont in samenstelling en werkzaamheid met een diergeneesmiddel
      waarvoor in een EER-lidstaat een vergunning voor het in de handel brengen van een diergeneesmiddel is verstrekt,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
  - number: 3.7.2.d
    text: |-
      alle wijzigingen van het diergeneesmiddel aan de minister zijn gemeld en volgens de aanwijzingen van de minister
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.7
  - number: 3.7.3
    text: |-
      De [artikelen 2.1, tweede lid][ref1], [2.2][ref2], [2.3, eerste lid, aanhef][ref3], [2.5][ref4],
      [2.6][ref5], [2.9, eerste lid, onderdelen b, c, d, f tot en met i][ref6], [2.12 tot met 2.17][ref7],
      [2.18, eerste, tweede en derde lid, vierde lid, eerste zinsdeel][ref8], en [2.20, eerste lid][ref9],
      [2.21, eerste lid][ref10], [2.22][ref11] en [2.26 van het besluit][ref12], het krachtens die artikelen bepaalde
      en de [artikelen 2.3][ref13], [2.4][ref14], [2.11][ref15], [2.12][ref16] en [2.46][ref17] zijn van overeenkomstige
      toepassing bij een aanvraag om toestemming als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel2
