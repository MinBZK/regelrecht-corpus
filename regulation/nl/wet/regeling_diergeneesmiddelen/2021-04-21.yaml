  - number: 3.9.1
    text: |-
      Een aanvraag om ontheffing als bedoeld in [artikel 3.22, derde lid, van het besluit][ref1] wordt ingediend door een
      in een EER-lidstaat gevestigd persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '3'
  - number: 3.9.2
    text: |-
      Een aanvraag bestaat uit een dossier dat is samengesteld volgens het daarvoor vastgestelde aanvraagformulier en
      waarvan het aanvraagformulier deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.9
  - number: 3.9.3
    text: Een besluit om ontheffing wordt binnen 60 dagen na ontvangst van een volledige aanvraag genomen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.9
  - number: 3.10.1
    text: |-
      Vrijstelling wordt verleend van het verbod, gesteld in [artikel 2.25, eerste lid, van de wet][ref1]
      voor het afleveren van diergeneesmiddelen aan een instelling die een ontheffing heeft als bedoeld
      in [artikel 3.22, derde lid, van het besluit][ref2] voor het bezit van een substantie als bedoeld in
      [artikel 4.1, eerste lid, van het besluit][ref3] in samenhang met [artikel 2.11, onderdelen b en c][ref4], of het
      bezit van een substantie als bedoeld in [artikel 2.12][ref5] zonder aan de voorwaarden te voldoen die zijn gesteld
      krachtens een in dat artikel bedoelde EU-rechtshandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '3'
      - id: ref3
