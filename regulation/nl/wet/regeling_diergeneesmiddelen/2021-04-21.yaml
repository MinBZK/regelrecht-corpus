      - id: ref5
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 3.10.2
    text: |-
      In afwijking van het eerste lid is het uitsluitend toegestaan aan de in [bijlage 3][ref1] genoemde instellingen
      voor gebruik voor wetenschappelijke doeleinden als bedoeld in [artikel 2.23, derde lid, van de wet][ref2] alle
      ziekteverwekkers voorhanden of in voorraad te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0032626
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0032626
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: '3.11'
    text: |-
      Een dier waarop een diergeneesmiddel of een andere substantie met mogelijk farmacologische werking is beproefd, of
      een levensmiddel van een dergelijk dier wordt niet in de handel gebracht, tenzij een ontheffing is verleend waarbij
      andersluidende voorschriften zijn gesteld en een wachttermijn is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.11
  - number: '3.12'
    text: |-
      In [bijlage 4][ref1] bij deze regeling zijn de vrijstellingen opgenomen die krachtens
      [hoofdstuk 3, paragraaf 5, van het besluit][ref2] en [artikel 10.1, eerste lid, van de wet][ref3] worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032626
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Paragraaf5
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0032626
      - id: ref2
        bwb_id: BWBR0032386
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 4.1.1
    text: |-
      Aanvragen om een vergunning voor vervaardiging van een diergeneesmiddel en een vergunning voor invoer worden
      ingediend met een door de minister vastgesteld formulier of een beschikbaar gestelde elektronische wijze van
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.1
  - number: 4.1.2
    text: |-
      Aanvragen om een vergunning voor het bezit van een substantie die een werkzame stof bevat worden ingediend met een
      door de minister vastgesteld formulier of een beschikbaar gestelde elektronische wijze van aanvragen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.1
  - number: 4.1.3
    text: |-
      Een aanvraag met betrekking tot een substantie als bedoeld in [artikel 4.1, eerste lid, van het besluit][ref1]
      wordt aangemerkt als een melding als bedoeld in artikel 4.1, tweede lid, van het besluit, indien de aanvraag is
      ingediend met het daartoe vastgestelde volledig ingevulde formulier en de aanvrager de substantie, bedoeld in
      artikel 4.1, eerste lid, onderdelen a en b, van het besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.1.3.a
    text: |-
      op voorraad heeft, voorhanden heeft, uitvoert in overeenstemming met de [artikelen 4.22][ref1] en
      [4.23 van het besluit][ref2] of na invoer overeenkomstig de [artikelen 4.19][ref3], [4.20][ref4] en
      [4.21 van het besluit][ref5] in de handel heeft of vervoert,


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.1.3.b
    text: |-
      de substantie, bedoeld in [artikel 4.1, eerste lid, onderdeel a, van het besluit][ref1] wordt bereid, bewerkt of
      verwerkt, in overeenstemming met door de Europese Commissie vastgestelde richtsnoeren voor de vervaardiging van
      grondstoffen als bedoeld in artikel 51, derde alinea, van [richtlijn 2001/82/EG](32001L0082) en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.1.3.c
    text: |-
      niet in de handel brengt, aanprijst, aanbiedt of aflevert aan andere personen dan houders van een vergunning voor
      vervaardiging of personen of instanties die het is toegestaan het desbetreffende diergeneesmiddel ex tempore te
      bereiden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.1
  - number: 4.2.1
    text: |-
      Het formulier, bedoeld in [artikel 4.1][ref1], wordt gevoegd bij de documenten, bedoeld in
      [artikel 4.2, eerste lid, aanhef, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.2.2
    text: Het formulier is verkrijgbaar bij de instantie waar de aanvraag wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.2
  - number: '4.3'
    text: |-
      Een preventief onderzoek als bedoeld in [artikel 8.1 van het besluit][ref1] blijft achterwege, indien de aanvraag
      betrekking heeft op een wijziging van de vergunning, bedoeld in [artikel 4.1][ref2] en deze aanvraag uitsluitend
      betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.a
    text: administratieve gegevens, of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.3
  - number: 4.3.b
    text: 'het bereiden, verpakken, etiketteren of afleveren van een diergeneesmiddel, indien:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.3
  - number: 4.3.b.1°
    text: |-
      dat middel dezelfde farmaceutische vorm heeft als een middel waarvoor ingevolge [artikel 4.1 van het besluit][ref1]
      reeds aan de aanvrager een vergunning tot het verrichten van de betreffende handeling of handelingen is verleend,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.3.b.2°
    text: de handeling of handelingen met behulp van dezelfde apparatuur en in dezelfde lokaliteiten geschied.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.3
  - number: '4.4'
    text: 'De regels, gesteld in deze paragraaf, zijn van toepassing als:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.4
  - number: 4.4.a
    text: |-
      voorwaarden voor het in behandeling nemen van de bij de aanvraag overgelegde documenten, bedoeld in
      [artikel 4.2, tweede lid, onderdeel a, van het besluit][ref1], voor een vergunning voor vervaardiging van een
      diergeneesmiddel, vergunning voor het bezit van een substantie die een werkzame stof bevat en een vergunning voor
      invoer en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.4.b
    text: |-
      algemene regels als bedoeld in [artikel 4.9, eerste lid][ref1], voor de uitoefening van een vergunning voor
      vervaardiging van een diergeneesmiddel, vergunning voor het bezit van een substantie die een werkzame stof bevat en
      een vergunning voor invoer.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.5.1
    text: |-
      De houder van een vergunning voor vervaardiging van een diergeneesmiddel oefent de vergunning uit in
      overeenstemming met artikel 50 van [Richtlijn 2001/82/EG](32001L0082), de artikelen 6 tot en met 14 van
      [richtlijn 91/412/EEG](31991L0412), alsmede door de Europese Commissie vastgestelde richtsnoeren als bedoeld in
      bedoeld in [artikel 2.19, derde lid][ref1], onderdeel f, van de wet voor de uitvoering van goede praktijken voor
      vervaardiging, in samenhang met de artikelen 50, onderdeel f, 51 en 55, eerste lid, onderdeel a, van [richtlijn
      2001/82/EG](32001L0082), die in [bijlage 5][ref2] bij deze regeling zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032626
  - number: 4.5.2
    text: |-
      Voor de toepassing van het eerste lid wordt aangewezen als bevoegde instantie als bedoeld in de artikelen 11,
      vierde lid, en 13 van [richtlijn nr. 91/412/EEG](31991L0412): de minister.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.5
  - number: 4.6.1
    text: |-
      De houder van de vergunning voor vervaardiging, indien deze een natuurlijke persoon is, of de persoon, bedoeld in
      [artikel 4.2, derde lid, van het besluit][ref1] beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.6.1.a
    text: |-
      een diploma, waaronder certificaten of andere bewijsstukken, die ter afsluiting van een universitaire opleiding
      zijn behaald, dan wel erkend in een EER-lidstaat of van een opleiding die door de minister als gelijkwaardig is
      erkend, die:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
  - number: 4.6.1.a.1°
    text: |-
      ten minste vier jaar theoretisch en praktisch onderwijs omvat in: - farmacie,
        - geneeskunde,
        - diergeneeskunde,
        - scheikunde,
        - farmaceutische scheikunde en technologie, of
        - biologie,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
  - number: 4.6.1.a.2°
    text: |-
      welke opleiding ten minste de basisvakken, bedoeld in [bijlage 6][ref1] omvat, en


      [ref1]: https://wetten.overheid.nl/BWBR0032626
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0032626
  - number: 4.6.1.a.3°
    text: |-
      zodanig is gedoceerd dat de betrokken persoon kwaliteitszorg bij de vervaardiging van diergeneesmiddelen kan
      uitoefenen, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
  - number: 4.6.1.b
    text: |-
      twee jaar praktijkervaring in één of meer ondernemingen met een vergunning voor
      vervaardiging voor diergeneesmiddelen of een fabrikantenvergunning als bedoeld in
      [artikel 18, eerste lid, van de Geneesmiddelenwet][ref1] met betrekking tot het uitvoeren van kwalitatieve analyses
      van geneesmiddelen, kwantitatieve analyse van werkzame stoffen, alsmede proeven en controles die noodzakelijk zijn
      om de kwaliteit van geneesmiddelen te garanderen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
  - number: 4.6.2
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan de minimumduur van de opleiding drie en een half jaar bedragen
      indien na de opleiding een periode van theoretische en praktische opleiding is gevolgd van tenminste één jaar,
      waarvan tenminste zes maanden stage is gelopen in een voor het publiek toegankelijke apotheek, hetgeen wordt
      afgesloten met een examen op universitair niveau.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
  - number: 4.6.3
    text: |-
      In afwijking van het eerste lid, onderdeel a, onder 1°, aanhef, wordt een diploma met een opleidingsduur van
      ten minste drie jaar dat door een EER-lidstaat als gelijkwaardig wordt erkend aan een diploma, waarvoor een
      opleidingsduur van vier jaar geldt geacht te voldoen aan de in het eerste lid, onderdeel a, bedoelde eis inzake
      duur, voor zover de diploma’s, certificaten of andere bewijsstukken voor afsluiting van de beide opleidingen door
      die EER-lidstaat als gelijkwaardig worden erkend.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
  - number: 4.6.4
    text: |-
      In afwijking van het eerste lid, onderdeel b, bedraagt de praktijkervaring, bedoeld in dat onderdeel, één jaar bij
      een opleidingsduur van ten minste vijf jaar en een half jaar bij een opleidingsduur van ten minste zes jaar.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
  - number: 4.6.5
    text: |-
      Indien de opleiding niet voldoet aan het eerste lid, onderdeel a, het tweede en derde lid, beoordeelt de minister,
      of de houder of de persoon, bedoeld in het eerste lid, aanhef, kennis bezit over de in het eerste lid, onderdeel a,
      onder 1°, genoemde vakken die op de vervaardiging van de controle op diergeneesmiddelen is afgestemd en bepaalt of
      de betrokken persoon voldoende deskundig is.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.6
  - number: 4.7.1
    text: |-
      In afwijking van [artikel 4.6][ref1] behoeft een persoon die voor 18 december 2001 in een EER-lidstaat de
      verantwoordelijkheid heeft gekregen voor de kwaliteitszorg voor de vervaardiging van diergeneesmiddelen als
      bedoeld in dat artikel, niet te beschikken over een in dat artikel genoemd diploma voor het uitvoeren van deze
      verantwoordelijkheid in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.2
    text: |-
      In afwijking van het eerste lid en [artikel 4.6][ref1] behoeft een persoon niet te voldoen aan de opleidingseisen,
      bedoeld in artikel 4.6, indien deze persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.2.a
    text: |-
      in Nederland vóór 9 oktober 1981 een universitaire of een daarmee gelijkwaardige opleiding
      in een exacte wetenschap is begonnen die leidt tot een bekwaamheid in de uitvoering van de in
      [artikel 4.2, eerste lid, onderdeel f, van het besluit][ref1] bedoelde kwaliteitszorg en


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.7.2.b
    text: |-
      vóór 9 oktober 1991 ten minste twee jaar in één of meer ondernemingen onder gezag van een voor kwaliteitszorg van
      diergeneesmiddelen bevoegde persoon praktische ervaring heeft opgedaan.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.7
  - number: 4.7.3
    text: |-
      In afwijking van het tweede lid, onderdeel b, geldt voor personen die vóór 9 oktober 1971 de in het tweede lid,
      onderdeel b, bedoelde praktische ervaring hebben opgedaan een termijn van ten minste drie jaar.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.7
  - number: '4.8'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 4.1 van het besluit][ref1] draagt er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.8.a
    text: |-
      de persoon, bedoeld in [artikel 4.6][ref1], in staat wordt gesteld zijn taak te vervullen, onder meer door alle
      noodzakelijke middelen te zijner beschikking te stellen en steeds de gelegenheid te geven om te onderzoeken of:


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.8.a.1°
    text: |-
      elke partij diergeneesmiddelen voldoet aan de regels, bedoeld in de artikelen 10 en 11 van [richtlijn nr. 91/412/
      EEG](31991L0412), de [artikelen 4.5][ref1], [4.6][ref2] en [4.7][ref3] alsmede aan de vergunning, bedoeld in
      [artikel 4.7 van het besluit][ref4], verbonden voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.8.a.2°
    text: |-
      de volgens de gedetailleerde richtsnoeren, bedoeld in artikel 51 van [richtlijn nr. 2001/82/EG](32001L0082),
      vereiste documenten of partijprotocollen aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
  - number: 4.8.b
    text: |-
      een diergeneesmiddel slechts voor de verkoop wordt afgeleverd, nadat een partijvrijgiftedocument is ondertekend
      door de persoon, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
  - number: 4.8.c
    text: |-
      de minister onverwijld ervan in kennis wordt gesteld, indien de persoon, bedoeld in [artikel 4.6][ref1], zijn
      controlewerkzaamheden niet langer uitoefent;


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.8.d
    text: |-
      als grondstof slechts werkzame stoffen worden gebruikt die zijn vervaardigd overeenkomstig door de Europese
      Commissie vastgestelde richtsnoeren inzake goede praktijken bij de vervaardiging van grondstoffen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
  - number: 4.8.e
    text: |-
      de persoon, bedoeld in [artikel 4.6][ref1], in overeenstemming met artikel 55, derde lid, van [richtlijn 2001/82/
      EG](32001L0082) een register of gelijkwaardig document bijhoudt en ten minste vijf jaar na de laatste aantekening
      ter beschikking houdt voor controle door ambtenaren die met het toezicht op de naleving zijn belast;


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.8.f
    text: |-
      een register wordt bijgehouden in overeenstemming met artikel 50, onderdeel g, van [richtlijn 2001/82/EG]
      (32001L0082) dat gedurende tenminste drie jaar voor toezicht op de naleving toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.8
  - number: 4.9.1
    text: |-
      Een houder van een vergunning voor vervaardiging of invoer levert een diergeneesmiddel af aan een andere houder
      van een vergunning voor vervaardiging of invoer of een vergunninghouder voor groothandel in overeenstemming met
      [hoofdstuk 2, paragraaf 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 4.9.2
    text: |-
      In afwijking van het eerste lid, kan een houder van een vergunning voor vervaardiging een diergeneesmiddel zonder
      buitenverpakking afleveren aan een houder van een vergunning voor vervaardiging of invoer, indien:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.9
  - number: 4.9.2.a
    text: |-
      bij het diergeneesmiddel een document is gevoegd dat de gegevens bevat die krachtens
      [hoofdstuk 2, paragraaf 4][ref1], op de buitenverpakking van het diergeneesmiddel worden vermeld;


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 4.9.2.b
    text: |-
      alle informatie die krachtens [hoofdstuk 2, paragraaf 4][ref1], op de buitenverpakking wordt vermeld, is
      aangebracht op de primaire verpakking;


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 4.9.2.c
    text: |-
      alle informatie die krachtens [hoofdstuk 2, paragraaf 4][ref1], op de bijsluiter wordt vermeld, in het document,
      bedoeld in onderdeel a, is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 4.10.1
    text: |-
      Het is uitsluitend aan een houder van een vergunning voor vervaardiging die diergeneesmiddel bereidt dat een
      serum, entstof of biologisch diagnosticum bevat, toegestaan een ziekteverwekker, voorhanden of in voorraad
      te houden voor de bereiding van, of de controle op dat diergeneesmiddel, indien voor dat diergeneesmiddel
      een vergunning voor het in de handel brengen is verstrekt of een vrijstelling is verleend, onverminderd
      [artikel 2.22, vierde lid, van de wet][ref1] en de [artikelen 3.9][ref2], [3.10][ref3] en [3.11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0032626#Artikel3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032626
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 4.10.2
    text: |-
      In afwijking van het eerste lid is het een dierenarts toegestaan een autovaccin te vervaardigen of bij een apotheek
      of een houder van een vergunning voor vervaardiging te doen vervaardigen voor dieren die de dierenarts onder zijn
      hoede heeft , indien bij toepassing van de [artikelen 5.1][ref1] en [5.2 van het Besluit diergeneeskundigen][ref2]
      slechts een ex tempore bereiding toepasbaar of beschikbaar is en het vaccin geen ziekteverwekker als bedoeld in
      [artikel 2.11, onderdelen a of c][ref3], bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '4.11'
    text: |-
      Het bereiden, verdelen of veranderen van een diergeneesmiddel als bedoeld in
      [artikel 4.18, eerste lid, onderdeel a, van het besluit][ref1] is slechts toegestaan aan een dierenarts of op
      recept door een apotheker, indien het diergeneesmiddel wordt verdeeld in een kleinere verpakking dan wel bereid
      of veranderd in een andere aanbiedingsvorm die past bij hetgeen noodzakelijk is voor de beoogde behandeling of
      therapie, onverminderd [hoofdstuk 2, paragraaf 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '4.12'
    text: |-
      Een bereiding als bedoeld in [artikel 4.18, eerste lid, onderdeel b, van het besluit][ref1] is toegestaan, indien
      aan elk van de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.12.a
    text: |-
      er is in Nederland geen diergeneesmiddel beschikbaar, waarvoor een vergunning voor het in de handel brengen is
      verstrekt of een vrijstelling of ontheffing als bedoeld in [hoofdstuk 3, paragraaf 5 van het besluit][ref1] of
      [artikel 10.1 van de wet][ref2] is verleend om een aandoening, dierziekte, zoönose, ziekteverschijnsel, gebrek, in-
      of uitwendig letsel of pijn bij een dier te voorkomen, te genezen, te verzachten, te onderkennen of op te heffen;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 4.12.b
    text: |-
      bij toepassing van de [artikelen 5.1][ref1] en [5.2 van het Besluit diergeneeskundigen][ref2] blijkt dat een
      behandeling met een ex tempore bereid diergeneesmiddel noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 4.12.c
    text: |-
      het diergeneesmiddel bevat, indien het is bestemd om te worden toegepast bij een dier dat voor de productie van
      levensmiddelen bestemd is, uitsluitend farmacologisch werkzame stoffen die voldoen aan de voorwaarden in bijlage,
      tabel 1, Toegestane stoffen, bij Verordening (EU) nr. 37/2010;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.d
    text: |-
      ingeval het diergeneesmiddel door een apotheker wordt bereid, wordt het diergeneesmiddel uitsluitend
      afgeleverd aan de dierenarts op wiens recept het middel is bereid, tenzij het diergeneesmiddel met toepassing
      van [artikel 5.1, vierde lid][ref1], of [5.2, vierde lid, van het Besluit diergeneeskundigen][ref2] onder
      verantwoordelijkheid van de dierenarts door een ander wordt toegepast, onverminderd artikel 5.2, negende lid, van
      het Besluit diergeneeskundigen;


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 4.12.e
    text: |-
      de dierenarts schrijft een wachttermijn voor, indien het diergeneesmiddel wordt bereid voor toepassing bij een dier
      dat voor de productie van levensmiddelen bestemd is;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.f
    text: de bereide hoeveelheid blijft beperkt tot hetgeen noodzakelijk is voor de beoogde behandeling of therapie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g
    text: |-
      de primaire verpakking en in voorkomend geval de buitenverpakking of zo nodig een bijsluiter vermelden de volgende
      informatie:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.1°
    text: de naam van de bereider;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.2°
    text: |-
      de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling van
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.3°
    text: de naam van de houder van het dier of de dieren waarvoor het diergeneesmiddel is bereid;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.4°
    text: de dosering waarin het diergeneesmiddel moet worden toegepast en de wijze van toepassing;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.5°
    text: |-
      de wachttermijn, indien het diergeneesmiddel wordt bereid voor toepassing bij een dier dat is bestemd voor de
      productie van levensmiddelen, voor de verschillende betrokken levensmiddelen afzonderlijk, waaronder die waarvoor
      geen wachttermijn is;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.6°
    text: de datum van bereiding;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.7°
    text: de bijzondere voorzorgsmaatregelen voor bewaring;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.8°
    text: zo nodig de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: 4.12.g.9°
    text: de uiterste gebruiksdatum, indien de maximale houdbaarheidstermijn minder dan drie jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.12
  - number: '4.13'
    text: |-
      Het lokaal, bedoeld in [artikel 4.9, eerste lid, onderdeel d, van het besluit][ref1], dat wordt gebruikt voor de
      vervaardiging van een diergeneesmiddel als bedoeld in de [artikelen 4.10][ref2], [4.11][ref3] of [4.12][ref4]:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.13.a
    text: |-
      is voldoende groot is en zodanig ingericht dat daarin alle handelingen, die volgens de vergunning kunnen worden
      uitgevoerd, naar behoren kunnen worden verricht;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.13
  - number: 4.13.b
    text: is voorzien van een vlakke, gladde en ondoorlaatbare vloer, zonder scheuren of open afvoeren;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.13
  - number: 4.13.c
    text: |-
      voldoet aan de [artikelen 5.2, onderdelen a en b][ref1], en [5.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '4.14'
    text: |-
      De regels, gesteld in deze paragraaf, zijn onverminderd de [paragrafen 1][ref1], [2][ref2] en [3][ref3], van
      toepassing als:


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032626
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032626
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.14.a
    text: controlevoorschrift bij invoer zonder vergunning vanuit een EER-lidstaat en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.14
  - number: 4.14.b
    text: voorschrift bij een vergunning voor invoer.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.14
  - number: '4.15'
    text: 'Bij de controle bij invoer vanuit een EER-lidstaat geldt dat:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.15
  - number: 4.15.a
    text: |-
      een controleverslag als bedoeld in [artikel 4.20, derde lid, van het besluit][ref1] voldoet aan de in de betrokken
      EER-lidstaat geldende regels alsmede aan de bij de vergunning voor de vervaardiging in die lidstaat gegeven
      voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.15.b
    text: |-
      alle door degene die diergeneesmiddelen invoert voor een partij diergeneesmiddelen bewaarde monsters van voldoende
      grootte zijn voor het verrichten van kwalitatieve en kwantitatieve controles;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.15
  - number: 4.15.c
    text: |-
      artikel 11, vierde lid, van [richtlijn 91/412/EG](31991L0412) van overeenkomstige toepassing is op de monsters,
      bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.15
  - number: '4.16'
    text: |-
      Een diergeneesmiddel dat met toepassing van [artikel 4.21, eerste lid, van het besluit][ref1] uit een land van
      buiten de Europese Economische Ruimte wordt ingevoerd en dat voor een andere EER-lidstaat bestemd is, wordt
      vergezeld van een kopie van de vergunning voor invoer, bedoeld in artikel 4.21, eerste lid, van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: '4.17'
    text: |-
      De houder van een vergunning voor invoer die van buiten de Europese Economische Ruimte een diergeneesmiddel,
      invoert, draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.17
  - number: 4.17.a
    text: |-
      door of onder verantwoordelijkheid van een persoon als bedoeld in [artikel 4.6][ref1] in Nederland wordt
      gecontroleerd dat de door hem op Nederlands grondgebied binnengebrachte partijen een volledige kwalitatieve
      analyse, een kwantitatieve analyse van ten minste alle werkzame bestanddelen en alle andere proefnemingen
      of controles hebben ondergaan die nodig zijn om de kwaliteit van de diergeneesmiddelen te waarborgen in
      overeenstemming met de artikelen 6 tot en met 14 van [richtlijn nr. 91/412/EG](31991L0412), de in het dossier,
      bedoeld in [artikel 2.3, van het besluit][ref2] beschreven fabricagewijze en testmethoden in overeenstemming met
      artikel 12, derde lid, onderdeel d, respectievelijk i, van [richtlijn 2001/82/EG](32001L0082);


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 4.17.b
    text: |-
      het verloop en het resultaat van de controle, bedoeld in onderdeel a, worden in een partijprotocol vastgelegd, dat
      wordt gedateerd en getekend door de persoon die de controle heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.17
  - number: 4.17.c
    text: |-
      indien een analyse, proefneming of controle als bedoeld in onderdeel a is uitgevoerd door een derde partij is de
      persoon bedoeld in onderdeel a tevens verantwoordelijk voor de kwaliteit van die analyse, proefneming of controle;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.17
  - number: 4.17.d
    text: |-
      een diergeneesmiddel slechts voor de verkoop wordt afgeleverd, nadat een partijvrijgiftedocument is ondertekend
      door de onder a, bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.17
  - number: 4.18.1
    text: |-
      In afwijking van [artikel 4.17][ref1] is de persoon, bedoeld in [artikel 4.6][ref2], ontheven van de verplichting
      een controle als bedoeld in artikel 4,17, onderdeel a, uit te voeren en een partijprotocol als bedoeld in artikel
      4.17, onderdeel b, vast te leggen bij partijen diergeneesmiddelen die van buiten de Europese Economische Ruimte
      worden ingevoerd, indien tussen de Europese Unie en het land van uitvoer passende afspraken zijn gemaakt om te
      waarborgen dat de houder van een vergunning voor vervaardiging van de betreffende diergeneesmiddelen in het land
      van uitvoer normen voor goede praktijken bij het vervaardigen hanteert die tenminste gelijkwaardig zijn aan die in
      de artikelen 6 tot en met 14 van [richtlijn nr. 91/412/EG](31991L0412) en de [artikelen 4.5 tot en met 4.9][ref3]
      en uit een door deze persoon ondertekent partijvrijgiftedocument blijkt dat de controles, bedoeld in artikel 4.17,
      eerste lid, onderdeel a, in dat land van uitvoer zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032626#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032626
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.18.2
    text: |-
      De minister doet mededeling in de Staatscourant van de vaststelling van de passende afspraken, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.18
  - number: 4.19.1
    text: |-
      [Hoofdstuk 2, paragraaf 4][ref1], inzake voorschriften voor de verpakking en etikettering is van toepassing bij
      uitvoer van een diergeneesmiddel met dien verstande dat alle informatie op, bij of in de verpakking is gesteld in
      de taal of één der talen van het land van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 4.19.2
    text: |-
      Het eerste lid is niet van toepassing, indien degene die het diergeneesmiddel uitvoert aantoont, dat de verpakking
      en etikettering van het diergeneesmiddel in overeenstemming is, of is gebracht met de eisen van het land van
      bestemming.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.19
  - number: '4.20'
    text: |-
      Bij de afgifte van een certificaat voor uitvoer als bedoeld in [artikel 4.23 van het besluit][ref1] aan de
      fabrikant of exporteur:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.20.a
    text: past de minister de geldende administratieve voorschriften van de Wereldgezondheidsorganisatie toe,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.20
  - number: 4.20.b
    text: |-
      verstrekt de minister een samenvatting van de productkenmerken met betrekking tot de voor uitvoer bestemde
      diergeneesmiddelen of bij gebreke daarvan een gelijkwaardig document.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.20
  - number: '4.21'
    text: |-
      Indien in de Europese Economische Ruimte geen vergunning voor het in de handel brengen voor een uit te voeren
      diergeneesmiddel is verstrekt, overlegt degene die een aanvraag als bedoeld in [artikel 4.23 van het besluit][ref1]
      indient aan de minister een verklaring waarin wordt uiteengezet waarom een dergelijke vergunning ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.22.1
    text: |-
      Een houder van een vergunning voor het vervaardigen van diergeneesmiddelen, een vergunning voor het bezit van een
      substantie die een werkzame stof bevat als bedoeld in [artikel 4.1 van het besluit][ref1] of een vergunning voor
      invoer als bedoeld in [artikel 4.21 van het besluit][ref2] voert een administratie inzake iedere transactie van
      diergeneesmiddelen, met inbegrip van monsters, overeenkomstig de wetgeving van het land van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.22.2
    text: |-
      De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een houder van een
      vergunning voor groothandel of een houder van een vergunning voor kleinhandel, bevat de kopieën van facturen met
      daarop of daarbij ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.2.a
    text: datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.2.b
    text: benaming en, in voorkomend geval, het nummer van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.2.c
    text: partijnummer;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.2.d
    text: afgeleverde hoeveelheid, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.2.e
    text: naam en adres van de ontvanger.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.3
    text: |-
      De administratie heeft tevens betrekking op de grondstoffen die door de houder van een vergunning als bedoeld in
      het eerste lid worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.4
    text: |-
      De houder van de vergunning houdt ten minste éénmaal per kalenderjaar een nauwkeurige controle van de administratie
      door vergelijking van de ontvangen en afgeleverde diergeneesmiddelen met de aanwezige voorraden, ten bewijze
      waarvan een verslag wordt gemaakt dat in elk geval de geconstateerde verschillen bevat.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.22.5
    text: |-
      De administratie en de bescheiden die verband houden met de aantekeningen in de administratie alsmede het verslag,
      bedoeld in het vierde lid, worden gedurende drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.22
  - number: 4.23.1
    text: |-
      In de registers, bedoeld in [artikel 4.16, derde lid][ref1], en [4.17, eerste lid, van het besluit][ref2], wordt
      aantekening gemaakt van iedere vergunning en melding, onder vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 4.23.1.a
    text: de soort vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.23
  - number: 4.23.1.b
    text: het nummer van de vergunning;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.23
  - number: 4.23.1.c
    text: naam en adres van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.23
  - number: 4.23.1.d
    text: de diergeneesmiddelen of de soorten diergeneesmiddelen waarop de vergunning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.23
  - number: 4.23.2
    text: Het register, bedoeld in het eerste lid, is openbaar.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel4.23
  - number: '5.1'
    text: |-
      Aanvragen om een vergunning voor groothandel en een vergunning voor kleinhandel worden ingediend met een door de
      minister vastgesteld formulier of beschikbaar gestelde elektronische wijze van aanvragen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.1
  - number: 5.2.1
    text: |-
      De houder van een vergunning voor groothandel en de houder van een vergunning voor kleinhandel dragen er zorg voor
      dat de lokalen, bedoeld in [artikel 5.2, eerste lid, onderdeel b, van het besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
  - number: 5.2.1.a
    text: goed onderhouden worden, schoon en opgeruimd zijn en goed worden verlicht;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.b
    text: |-
      zijn voorzien van een zodanige klimaatbeheersing dat de temperatuur, de vochtigheidsgraad en de ventilatie geen
      ongewenste invloed uitoefenen op de zich daarin bevindende diergeneesmiddelen en de temperatuur door de houder van
      de vergunning gecontroleerd en geregistreerd wordt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.c
    text: zijn uitgevoerd met vloeren, muren en plafonds zonder een voor reiniging belemmerende constructie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.d
    text: |-
      zodanig zijn ingericht dat door leidingen, ventilatoren en overige voorzieningen geen voor de reiniging
      ontoegankelijke plaatsen ontstaan;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.e
    text: mede door ontwerp en uitrusting van het gebouw optimale bescherming bieden tegen het binnendringen van ongedierte;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.f
    text: over voldoende capaciteit beschikken voor de ordelijke opslag van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.g
    text: |-
      zodanig zijn ingericht dat de opslagruimtes voor diergeneesmiddelen die uitsluitend worden afgeleverd na te zijn
      voorgeschreven niet toegankelijk zijn voor het publiek met uitzondering van een opslagruimte in een kleinhandel
      voor diergeneesmiddelen met de aanduiding ‘URA’, die zodanig is ingericht dat deze diergeneesmiddelen buiten het
      directe bereik van het publiek beschikbaar wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.h
    text: |-
      zijn voorzien van een afgescheiden opslagruimte voor diergeneesmiddelen die zijn afgekeurd, teruggeroepen of
      geretourneerd;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.i
    text: |-
      zodanig zijn ingericht dat diergeneesmiddelen die zich op laad- en losplaatsen bevinden tegen de invloed van
      weersomstandigheden beschermd zijn;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.j
    text: |-
      door het ontwerp, inrichting, en uitrusting blootstelling van het personeel aan gevaren van in het lokaal
      opgeslagen werkzame stoffen voorkomen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.1.k
    text: voor dieren een behuizing voor dieren bevat die goed is afgescheiden van andere ruimtes.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: 5.2.2
    text: |-
      Het eerste lid, onderdeel b, is van overeenkomstige toepassing ten aanzien van transportmiddelen waarmee
      diergeneesmiddelen worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.2
  - number: '5.3'
    text: |-
      De houder van een vergunning voor groothandel en de houder van een vergunning voor kleinhandel dragen er zorg voor
      dat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.3
  - number: 5.3.a
    text: de apparatuur door het ontwerp, gemakkelijk en grondig kan worden schoongemaakt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.3
  - number: 5.3.b
    text: de apparatuur door de wijze van installeren niet door een vergissing verkeerd gebruikt kan worden;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.3
  - number: 5.3.c
    text: |-
      reparatie- en onderhoudswerkzaamheden aan lokalen en apparatuur zodanig worden uitgevoerd dat er geen enkel risico
      is voor de kwaliteit van de diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.3
  - number: 5.3.d
    text: |-
      onderhoudswerkzaamheden aan meet- en controleapparatuur met regelmaat overeenkomstig passende methoden worden
      uitgevoerd, zodanig dat deze apparatuur gekalibreerd en gecontroleerd zijn.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.3
  - number: '5.4'
    text: |-
      Een houder van een vergunning voor groothandel en een houder van een vergunning voor kleinhandel leveren een
      diergeneesmiddel af aan een andere houder van een vergunning voor groothandel of kleinhandel af in overeenstemming
      is met [hoofdstuk 2, paragraaf 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '5.5'
    text: |-
      De houder van een vergunning voor groothandel draagt er zorg voor dat het personeel voldoende technisch geschoold
      is en de opgedragen werkzaamheden naar behoren kan verrichten.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.5
  - number: '5.6'
    text: |-
      De houder van de vergunning voor groothandel beschikt over een noodplan voor het uit de handel nemen van een
      diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.6
  - number: 5.7.1
    text: |-
      Een houder van een vergunning voor kleinhandel levert een diergeneesmiddel slechts af aan een houder van een
      dier met een niet verbroken, oorspronkelijke sluiting van de primaire verpakking en in voorkomend geval de
      buitenverpakking, en indien:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.1.a
    text: de houdbaarheidstermijn van het diergeneesmiddel niet verstreken is;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.1.b
    text: |-
      de aanduidingen op de primaire verpakking en in voorkomend geval de buitenverpakking of bijsluiter, in
      overeenstemming zijn met [hoofdstuk 2, paragraaf 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0032626
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 5.7.1.c
    text: |-
      het diergeneesmiddel, voor zover het is voorgeschreven, een goed zichtbare, duidelijk leesbare en onuitwisbare
      aanduiding van de volgende vermeldingen bevat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.1.c.1°
    text: het woord ‘dierenarts’, ‘apotheker’ of ‘vergunninghouder’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.1.c.2°
    text: de naam en het adres van de betreffende houder van de vergunning voor kleinhandel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.1.c.3°
    text: de datum van afleveren van het diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.2
    text: 'Het eerste lid, aanhef, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.2.a
    text: een diergeneesmiddel wordt afgeleverd door een dierenarts of apotheker en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: 5.7.2.b
    text: |-
      de oorspronkelijke sluiting is vervangen door een sluiting welke is voorzien van de naam en het adres van de
      betreffende dierenarts of apotheker.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.7
  - number: '5.8'
    text: |-
      Een houder van een vergunning voor kleinhandel houdt diergeneesmiddelen die uitsluitend worden afgeleverd na te
      zijn voorgeschreven, met het oog op het afleveren slechts voorhanden of in voorraad in een lokaal als bedoeld in
      [artikel 5.2][ref1], en levert deze slechts af:


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.8.a
    text: |-
      in een lokaal als bedoeld in [artikel 5.2][ref1] aan een houder van een dier,


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.8.b
    text: |-
      vanuit een lokaal als bedoeld in [artikel 5.2][ref1] met een voor het diergeneesmiddel geschikte wijze van vervoer
      op het bedrijf van de houder van het dier dat behandeld wordt, of


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.8.c
    text: |-
      vanuit een lokaal als bedoeld in [artikel 5.2][ref1] met een voor het diergeneesmiddel geschikte wijze van vervoer
      aan huis bij de houder van het dier, indien het dier niet voor de productie wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.8a
    text: |-
      [Artikel 5.7 van het Besluit diergeneeskundigen][ref1] en [artikel 5.8 van de Regeling diergeneeskundigen][ref2]
      zijn van overeenkomstige toepassing op het afleveren van diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.8a
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '5'
  - number: '5.9'
    text: |-
      Een dierenarts uit een andere EER-lidstaat die met toepassing van de Regeling erkenning EG-beroepskwalificaties
      uitoefening van de diergeneeskunde is toegelaten tot uitoefening van de diergeneeskunde, is bevoegd om kleine, de
      dagelijkse behoeften niet overschrijdende hoeveelheden diergeneesmiddelen, waarvoor in Nederland geen vergunning
      voor het in de handel brengen is verstrekt, met uitzondering van immunologische diergeneesmiddelen, te vervoeren,
      voorhanden te hebben, toe te passen en af te leveren, indien is voldaan aan deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.9
  - number: '5.10'
    text: |-
      Het is de dierenarts, bedoeld in [artikel 5.9][ref1], slechts toegestaan een diergeneesmiddel als bedoeld in
      artikel 5.9 toe te passen, af te leveren of met het oog daarop voorhanden of op voorraad te hebben indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.10.a
    text: |-
      voor het diergeneesmiddel in de EER-lidstaat waar de dierenarts als zodanig is gevestigd, overeenkomstig de
      bepalingen van [richtlijn nr. 2001/82/EG](32001L0082) een vergunning voor het in de handel brengen is verstrekt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
  - number: 5.10.b
    text: |-
      het diergeneesmiddel wordt toegepast onder de voorschriften die bij de vergunning voor het in de handel brengen in
      de lidstaat, bedoeld onder a, zijn gesteld met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
  - number: 5.10.b.1°
    text: |-
      de dierenarts bij het toepassen en afleveren van een diergeneesmiddel zich op de hoogte stelt van de geldende goede
      veterinaire praktijken, waaronder gidsen voor goede praktijken als bedoeld in [artikel 8.44 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 5.10.b.2°
    text: |-
      de dierenarts de wachttermijn in acht neemt die vermeld staat op het etiket van het betrokken diergeneesmiddel,
      tenzij hij redelijkerwijs geacht kan worden te weten dat overeenkomstig goede veterinaire praktijken, waaronder
      gidsen voor goede praktijken als bedoeld in onderdeel 1° een langere wachttermijn is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
  - number: 5.10.c
    text: |-
      de toe te passen hoeveelheid beperkt blijft tot een hoeveelheid die volgens goed veterinair gebruik voor de
      behandeling noodzakelijk is,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
  - number: 5.10.d
    text: |-
      indien de dierenarts het diergeneesmiddel toepast bij voedselproducerende dieren, hij kan aantonen
      dat het betrokken diergeneesmiddel kwalitatief en kwantitatief hetzelfde of dezelfde werkzame
      bestanddelen bevat als een hier in Nederland voor eenzelfde therapeutisch doel met toepassing van
      [artikel 2.1, eerste lid, van het besluit][ref1] in de handel gebracht diergeneesmiddel,


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 5.10.e
    text: |-
      het afleveren beperkt blijft tot hetgeen noodzakelijk is voor de voltooiing van de beoogde behandeling of therapie
      van door de dierenarts onderzochte dieren, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
  - number: 5.10.f
    text: de dierenarts het dier of de dieren waarvoor het diergeneesmiddel is bestemd onder zijn behandeling heeft.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.10
  - number: '5.11'
    text: |-
      Het is de dierenarts, bedoeld in [artikel 5.9][ref1], slechts toegestaan een diergeneesmiddel als bedoeld in
      artikel 5.9 te vervoeren of met het oog daarop voorhanden of op voorraad te hebben indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.11.a
    text: |-
      voor het diergeneesmiddel in de EER-lidstaat waar de dierenarts als zodanig is gevestigd, overeenkomstig de
      bepalingen van [richtlijn nr. 2001/82/EG](32001L0082) een vergunning voor het in de handel brengen is verstrekt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.11
  - number: 5.11.b
    text: |-
      het diergeneesmiddel wordt vervoerd en voorhanden is onder de voorschriften die bij de vergunning voor het in de
      handel brengen in de lidstaat, bedoeld onder a, zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.11
  - number: 5.11.c
    text: |-
      de dierenarts kan aantonen dat een diergeneesmiddel dat hij voorhanden heeft of vervoert voor een toepassing
      bij voedselproducerende dieren kwalitatief en kwantitatief hetzelfde werkzame bestanddeel of dezelfde werkzame
      bestanddelen bevat als een hier in Nederland voor eenzelfde therapeutisch doel met een door de minister verstrekte
      vergunning of verleende vrijstelling of ontheffing in de handel gebracht diergeneesmiddel,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.11
  - number: 5.11.d
    text: |-
      dit diergeneesmiddel zich bevindt in de oorspronkelijke primaire verpakking en buitenverpakking van degene, door
      wie het is vervaardigd, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.11
  - number: 5.11.e
    text: |-
      de aard en de hoeveelheid van het vervoerde diergeneesmiddel is afgestemd op de normale dagelijkse behoefte volgens
      goed veterinair gebruik voor de dieren waarvoor zijn hulp is ingeroepen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.11
  - number: '5.12'
    text: |-
      De dierenarts, bedoeld in [artikel 5.9][ref1], deelt, direct na toegepassing of aflevering van een
      diergeneesmiddel, aan de houder van het dier schriftelijk de wachttermijn mede die vermeld wordt op het etiket of
      de bijsluiter van het betrokken diergeneesmiddel, tenzij het diergeneesmiddel vergelijkbaar is met een in Nederland
      in de handel gebracht diergeneesmiddel, gezien de informatie in de samenvatting van de productkenmerken van de
      beide betrokken diergeneesmiddelen, maar in Nederland een andere wachttermijn is vastgesteld, in welk geval hij
      deze wachttermijn aan de houder van het dier schriftelijk mededeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.13.1
    text: 'Het recept bevat in ieder geval de volgende informatie in onderstaande volgorde:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.a
    text: de datum van uitschrijven;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.b
    text: de benaming en het registratienummer van het voorgeschreven diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.c
    text: de diersoort waarvoor het middel bestemd is;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.d
    text: de af te leveren hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.e
    text: de naam en het adres van de betreffende dierenarts;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.f
    text: |-
      de naam van de ontvanger en het adres of uniek bedrijfsnummer van de locatie waar de dieren, waarvoor het recept
      bedoeld is, gehouden worden;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.g
    text: in voorkomend geval, de in acht te nemen wachttermijn en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.1.h
    text: |-
      de handtekening van de betreffende dierenarts dan wel een zodanig elektronisch verzonden kenmerk of, zonder
      te zijn ondertekend, met een zodanige code beveiligd document dat een daartoe bevoegde persoon of instantie de
      authenticiteit ervan kan vaststellen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.2
    text: |-
      In het recept is de hoeveelheid af te leveren diergeneesmiddelen beperkt tot hetgeen noodzakelijk is om de beoogde
      behandeling of therapie uit te kunnen voeren:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.2.a
    text: in een periode van maximaal één maand na de datum van uitschrijven of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.2.b
    text: |-
      in een periode van maximaal één jaar na de datum van uitschrijven, indien het diergeneesmiddelen betreft die op de
      primaire verpakking of in de bijsluiter zijn aangemerkt als:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.2.b.1°
    text: ontwormingsmiddel,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.2.b.2°
    text: middel tegen parasieten,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.2.b.3°
    text: middel tegen schimmels,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.2.b.4°
    text: kalmeringsmiddel.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.13.3
    text: |-
      De dierenarts vermeldt op een recept voor het afleveren van een diergeneesmiddel als bedoeld in het tweede lid,
      onderdeel b, de frequentie van de behandeling.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.13
  - number: 5.14.1
    text: 'De dierenarts schrijft een recept uit om een diergeneesmiddel voor te schrijven, indien:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
  - number: 5.14.1.a
    text: |-
      de vergunning voor het in de handel brengen van het diergeneesmiddel bepaalt dat het diergeneesmiddel slechts na
      het voorschrijven wordt afgeleverd of toegepast,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
  - number: 5.14.1.b
    text: een vrijstelling of ontheffing voorziet in een voorschrijven door de dierenarts door middel van een recept, of
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
  - number: 5.14.1.c
    text: een diergeneesmiddel ex tempore wordt bereid.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
  - number: 5.14.2
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan een diergeneesmiddel door een dierenarts bij een dier worden
      toegepast of afgeleverd zonder recept, indien:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
  - number: 5.14.2.a
    text: |-
      de informatie, bedoeld in [artikel 5.13, eerste lid][ref1], in de administratie van de houder van dieren wordt
      opgenomen of, indien de houder van dieren zijn administratie door de dierenarts laat uitvoeren, in die van de
      dierenarts en


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 5.14.2.b
    text: |-
      geen nadere aanwijzingen van de dierenarts voor het gebruik, de toepassing of het bewaren van het diergeneesmiddel
      noodzakelijk zijn en daarbij, in voorkomend geval, een afwijkende wachttijd wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
  - number: 5.14.3
    text: |-
      De houder van een vergunning voor kleinhandel maakt van iedere levering die betrekking heeft op een deel van het
      recept, aantekening op het recept, onder vermelding van de datum.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
  - number: 5.14.4
    text: |-
      De houder van een vergunning voor kleinhandel levert geen diergeneesmiddelen op recept af na het verstrijken van
      een periode als bedoeld in [artikel 5.13, tweede lid, onderdeel a of onderdeel b][ref1], of in een hoeveelheid die
      niet overeenstemt met de volgens het recept nog uit te voeren behandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 5.15.1
    text: |-
      Een houder van een vergunning voor groothandel als bedoeld in [artikel 5.1, eerste lid, van het besluit][ref1]
      voert een administratie inzake iedere transactie met diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
  - number: 5.15.2
    text: |-
      De administratie, bedoeld in het eerste lid, inzake de aankoop van diergeneesmiddelen bevat de facturen behorende
      bij de ontvangst met daarop of daarbij ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.2.a
    text: datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.2.b
    text: benaming en, in voorkomend geval, het nummer van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.2.c
    text: partijnummer;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.2.d
    text: uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.2.e
    text: ontvangen hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.2.f
    text: naam van de leverancier.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.3
    text: |-
      De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een houder van een
      vergunning voor groothandel of een houder van een vergunning voor kleinhandel bevat de kopieën van facturen met
      daarop of daarbij ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.3.a
    text: datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.3.b
    text: benaming en, in voorkomend geval, het nummer van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.3.c
    text: partijnummer;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.3.d
    text: uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.3.e
    text: afgeleverde hoeveelheid, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.3.f
    text: naam en adres van de ontvanger.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.4
    text: |-
      De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een houder van een
      vergunning voor groothandel of een houder van een vergunning voor kleinhandel bevat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.4.a
    text: een betaalbewijs, voor zover het een transactie tegen betaling betreft, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.15.4.b
    text: een bewijs voor aflevering met de gegevens, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.15
  - number: 5.16.1
    text: |-
      Een houder van een vergunning voor kleinhandel als bedoeld in [artikel 5.1, tweede lid, van het besluit][ref1]
      voert een administratie inzake iedere transactie met diergeneesmiddelen, die uitsluitend worden afgeleverd na te
      zijn voorgeschreven als bedoeld in [artikel 5.8, aanhef en onder a, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '5'
  - number: 5.16.2
    text: |-
      De administratie, bedoeld in het eerste lid, inzake de aankoop van diergeneesmiddelen bevat de facturen behorende
      bij de ontvangst met daarop of daarbij ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.2.a
    text: datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.2.b
    text: benaming en, in voorkomend geval, het nummer van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.2.c
    text: partijnummer;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.2.d
    text: uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.2.e
    text: ontvangen hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.2.f
    text: naam van de leverancier.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.3
    text: |-
      De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een houder van een
      vergunning voor kleinhandel of een houder van een vergunning voor groothandel bevat de kopieën van facturen met
      daarop of daarbij ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.3.a
    text: datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.3.b
    text: benaming en, in voorkomend geval, het nummer van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.3.c
    text: partijnummer;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.3.d
    text: uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.3.e
    text: afgeleverde hoeveelheid, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.3.f
    text: naam en adres van de ontvanger.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.4
    text: |-
      De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een houder van dieren
      bevat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.4.a
    text: |-
      het recept, bedoeld in [artikel 5.13][ref1], voor zover een recept is uitgeschreven, en


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 5.16.4.b
    text: 'kopieën van facturen met daarop of daarbij ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.4.b.1°
    text: datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.4.b.2°
    text: benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.4.b.3°
    text: partijnummer;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.4.b.4°
    text: afgeleverde hoeveelheid, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.16.4.b.5°
    text: naam en adres van de ontvanger of uniek bedrijfsnummer van de locatie waarop de dieren gehouden worden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.16
  - number: 5.17.1
    text: |-
      De houders van de vergunningen, bedoeld in de [artikelen 5.15, eerste lid][ref1], en [5.16, eerste lid][ref2],
      houden ten minste éénmaal per kalenderjaar een nauwkeurige controle van de administratie, bedoeld in de artikelen
      5.15 en 5.16 door vergelijking van de ontvangen en afgeleverde diergeneesmiddelen met de aanwezige voorraden, ten
      bewijze waarvan een verslag wordt gemaakt dat in elk geval de geconstateerde verschillen bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: 5.17.2
    text: |-
      De administratie en de bescheiden die verband houden met de aantekeningen in de administratie bedoeld in
      [artikel, 5.15, eerste lid][ref1], alsmede het verslag, bedoeld in het eerste lid, worden gedurende drie jaar
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: 5.17.3
    text: |-
      De administratie en de bescheiden die verband houden met de aantekeningen in de administratie, bedoeld in
      [artikel 5.16, eerste lid][ref1], alsmede het verslag, bedoeld in het eerste lid, worden gedurende vijf jaar
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel5
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: '6.1'
    text: |-
      De houder van een vergunning voor het in de handel brengen van een diergeneesmiddel draagt er zorg voor dat een
      voor diergeneesmiddelenbewaking gekwalificeerde in de Europese Unie gevestigde persoon hem voordurend en zonder
      onderbreking bijstaat en verantwoordelijk is voor:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.1
  - number: 6.1.a
    text: |-
      de totstandbrenging en het beheer van een systeem dat waarborgt dat gegevens over alle vermoedelijke bijwerkingen,
      die aan het personeel van de onderneming, waaronder het verkooppersoneel en de artsenbezoekers worden gemeld, bij
      het Bureau worden gemeld, geordend en toegankelijk gemaakt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.1
  - number: 6.1.b
    text: |-
      het opstellen van een verslag van alle vermoedelijke bijwerkingen en vermoedelijke bijwerkingen bij de mens die
      zich in een EER-lidstaat of in een derde land voordoen, overeenkomstig de bepalingen van de richtsnoeren, bedoeld
      in artikel 77, eerste lid, van [richtlijn nr. 2001/82/EG](32001L0082);
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.1
  - number: 6.1.c
    text: |-
      een snelle en volledige beantwoording van elk verzoek van de minister om verstrekking van de nodige aanvullende
      gegevens voor de beoordeling van de aan een diergeneesmiddel verbonden voordelen en risico's, met inbegrip van
      gegevens over het afzetvolume van of het aantal recepten voor het betrokken diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.1
  - number: 6.1.d
    text: |-
      de verstrekking aan de minister van alle andere informatie die relevant is voor de beoordeling van de baten en
      risico's van een diergeneesmiddel, met inbegrip van relevante informatie over veiligheidsonderzoek na toelating.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.1
  - number: 6.2.1
    text: |-
      De houder van de vergunning voor het in de handel brengen van een diergeneesmiddel bewaart de verslagen, bedoeld in
      [artikel 6.1, onderdeel b][ref1], ten minste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel6
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.2
    text: |-
      De verslagen, bedoeld in het eerste lid, bevatten in elk geval de meldingen voortkomend uit het systeem, bedoeld
      in [artikel 6.1, onderdeel a][ref1], en gaan vergezeld van een wetenschappelijke beoordeling van de balans van de
      baten en de risico's van het diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel6
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3
    text: |-
      De vergunninghouder overlegt de in het eerste lid bedoelde verslagen aan de minister op een eerste daartoe
      strekkend verzoek in een frequentie van:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
  - number: 6.2.3.a
    text: |-
      ten minste eenmaal per zes maanden, vanaf het moment van verstrekken van de vergunning voor het in de handel
      brengen van het diergeneesmiddel waarop de verslagen betrekking hebben totdat het diergeneesmiddel voor het eerst
      in de handel wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
  - number: 6.2.3.b
    text: |-
      ten minste eenmaal per zes maanden, gedurende de eerste twee jaar na het voor het eerst in de handel brengen van
      het diergeneesmiddel waarop de verslagen betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
  - number: 6.2.3.c
    text: |-
      ten minste eenmaal per jaar in het derde en vierde jaar na het voor het eerst in de handel brengen van het
      diergeneesmiddel waarop de verslagen betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
  - number: 6.2.3.d
    text: |-
      ten minste eenmaal per drie jaar, vanaf het vijfde jaar na het voor het eerst in de handel brengen van het
      diergeneesmiddel waarop de verslagen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
  - number: 6.2.4
    text: |-
      De minister kan op aanvraag van de houder van de vergunning voor het in de handel brengen van een diergeneesmiddel
      in afwijking van het derde lid, onderdelen b tot en met d, en het vierde lid, in verband met de coördinatie van
      vergunningen voor diergeneesmiddelen tussen de Europese Commissie en EER-lidstaten voor de toepassing van de
      [artikelen 2.31 tot en met 2.44][ref1] in samenhang met [Verordening (EG) 1234/2008](32008R1234) besluiten een
      andere frequentie vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '6.3'
    text: |-
      De houder van een vergunning voor het in de handel brengen van een diergeneesmiddel stelt de bevoegde autoriteit
      van een EER-lidstaat, waar zich een voorval heeft voorgedaan, in voorkomend geval de minister, onverwijld doch
      uiterlijk binnen 15 dagen in kennis van:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.3
  - number: 6.3.a
    text: |-
      alle nieuwe informatie die kan leiden tot wijziging van de gegevens op grond waarvan de vergunning is verstrekt, in
      het bijzonder:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.3
  - number: 6.3.a.1°
    text: |-
      alle andere nieuwe informatie die op de beoordeling van de voordelen en risico’s van het gebruik van dat
      diergeneesmiddel van invloed kan zijn;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.3
  - number: 6.3.a.2°
    text: |-
      elke vermoedelijke ernstige bijwerking of bijwerking bij de mens die zich in Nederland of in een derde land
      voordoet en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis
      is gesteld;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.3
  - number: 6.3.a.3°
    text: |-
      elke vermoedelijke overdracht via een diergeneesmiddel van infectieuze stoffen die zich in een derde land voordoet
      en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis is gesteld;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.3
  - number: 6.3.b
    text: elke door hem voorgenomen wijziging van de gegevens op grond waarvan de vergunning is verstrekt.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.3
  - number: 6.4.1
    text: |-
      De houder van de vergunning voor het in de handel brengen van een diergeneesmiddel evalueert regelmatig de
      fabricage- en controlemethoden, bedoeld in artikel 12, derde lid, onderdelen d en i, van [richtlijn nr. 2001/82/EG]
      (32001L0082), die zijn vermeld in de documenten, bedoeld in [artikel 2.3, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 6.4.2
    text: |-
      De evaluatie heeft tot doel wijzigingen in de fabricage- en controlemethoden aan te brengen die nodig zijn om te
      waarborgen dat het diergeneesmiddel volgens algemeen aanvaarde wetenschappelijke methoden wordt vervaardigd en
      gecontroleerd als bedoeld in [artikel 2.13, onderdeel b, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 6.4.3
    text: |-
      Indien een evaluatie tot een wijziging van de fabricage- of controlemethoden leidt, neemt de houder van de
      vergunning voor het in de handel brengen alle maatregelen die noodzakelijk zijn voor wijziging van de gegevens die
      dienaangaande zijn vermeld in de documenten, bedoeld in [artikel 2.3, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '2'
  - number: 6.5.1
    text: |-
      Een dierenarts stelt de minister onverwijld doch uiterlijk binnen 15 dagen in kennis van elke vermoedelijk ernstige
      bijwerking, onverwachte bijwerking, of vermoedelijke bijwerking bij de mens, waaronder een verminderde werking
      of het ontbreken van de gestelde werking, bedoeld in [artikel 2.19, derde lid, onderdeel a, onder 1°][ref1], bij
      toepassing van het diergeneesmiddel volgens de primaire verpakking of indien de toepassing niet op de primaire
      verpakking is vermeld de bijsluiter.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel2
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.5.2
    text: |-
      In afwijking van het eerste lid kan de dierenarts de melding, bedoeld in het eerste lid, bij de houder van de
      vergunning voor het in handel brengen doen.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel6.5
  - number: 7.1.1
    text: |-
      Lokalen waarin voormengsels voor diervoeder met medicinale werking of diervoeders met medicinale werking worden
      opgeslagen, bewaard of vervaardigd zijn zodanig ingericht dat verschillende producten niet onbedoeld met elkaar in
      contact kunnen komen of verwisseld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.1
  - number: 7.1.2
    text: |-
      De lokalen, bedoeld in het eerste lid, zijn zodanig ingericht dat opslagruimtes voor voormengsels voor diervoeder
      met medicinale werking of diervoeders met medicinale werking niet toegankelijk zijn voor het publiek.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.1
  - number: '7.2'
    text: |-
      Installaties die worden gebruikt voor vervaardiging van diervoeders met medicinale werking functioneren zodanig
      dat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.2
  - number: 7.2.a
    text: het gebruikte diervoeder en het voormengsel tot een homogeen en stabiel product worden vermengd;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.2
  - number: 7.2.b
    text: |-
      versleping van stoffen andere dan stoffen, bedoeld in de [artikelen 7.3, eerste lid][ref1] en
      [7.4, eerste lid, van het besluit][ref2] die bestemd zijn om in het betreffende diervoeder met medicinale werking
      verwerkt te worden, zo veel mogelijk wordt voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.2.c
    text: een nauwkeurige dosering en weging mogelijk is.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.2
  - number: 7.3.1
    text: |-
      Het voormengsel voor een diervoeder met medicinale werking, bedoeld in
      [artikel 7.4, eerste lid, van het besluit][ref1], wordt toegevoegd aan het diervoeder, bedoeld in
      [artikel 7.3, eerste lid van het besluit][ref2], zo dicht mogelijk voor of in de menger, maar na de hamermolen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.3.2
    text: |-
      In afwijking van het eerste lid kan van toevoeging van het voormengsel na de hamermolen worden afgeweken indien de
      kwaliteit van het diervoeder met medicinale werking ten minste gelijk is aan de kwaliteit van het diervoeder met
      medicinale werking die wordt bereikt overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.3
  - number: '7.4'
    text: |-
      Voormengsels voor diervoeders met medicinale werking en diervoeders met medicinale werking worden op zodanige wijze
      opgeslagen dat:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.4
  - number: 7.4.a
    text: een goede kwaliteit van de producten gewaarborgd wordt;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.4
  - number: 7.4.b
    text: de producten geïdentificeerd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.4
  - number: 7.4.c
    text: verwisseling met andere producten wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.4
  - number: '7.5'
    text: |-
      Wanneer een diervoeder met medicinale werking wordt vervoerd met een transportmiddel waarmee producten zijn
      vervoerd die bij vermenging met het diervoeder met medicinale werking schade kunnen toebrengen aan dit diervoeder
      met medicinale werking, wordt het transportmiddel op de aanwezigheid van de producten gecontroleerd en indien
      nodig, gereinigd.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.5
  - number: '7.6'
    text: |-
      Een houder van een vergunning voor vervaardiging als bedoeld in [artikel 7.1, onderdeel a, van het besluit][ref1]
      neemt passende maatregelen opdat een optimale bedrijfshygiëne wordt verzekerd en ongewenste wisselwerking tussen
      diergeneesmiddelen en diervoeders uitgesloten wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.7.1
    text: |-
      Een houder van een vergunning voor vervaardiging als bedoeld in [artikel 7.1, onderdeel a, van het besluit][ref1]
      stelt een controleprogramma vast en voert dit uit.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.7.2
    text: |-
      Het controleprogramma, bedoeld in het eerste lid, heeft tot doel te borgen dat diervoeders met medicinale werking
      voldoen aan het bepaalde bij of krachtens de [artikelen 7.2 tot en met 7.6 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.7.3
    text: De resultaten van de controles, bedoeld in het eerste lid, worden gedurende twee jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.7
  - number: 7.8.1
    text: 'De verpakking van een diervoeder met medicinale werking vermeldt:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.a
    text: de vermelding ‘diervoeder met medicinale werking’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.b
    text: de diersoort waarvoor het diervoeder met medicinale werking uitsluitend is bestemd;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.c
    text: de uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.d
    text: het netto gewicht;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.e
    text: |-
      de naam of handelsnaam en de woonplaats of plaats van vestiging van de houder van de vergunning voor vervaardiging
      als bedoeld in [artikel 7.1, onderdeel a, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.8.1.f
    text: |-
      het nummer van de vergunning voor het in de handel brengen van het in het diervoeder met medicinale werking
      verwerkte diergeneesmiddel, vooraf gegaan door de letters ‘Reg. NL’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.g
    text: |-
      de concentratie en de farmaceutische vorm van het in het diervoeder met medicinale werking verwerkte
      diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.h
    text: de vermelding ‘wachttijd, zie recept’;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.1.i
    text: de vermelding ‘op recept van een dierenarts’.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.8.2
    text: |-
      Indien het diervoeder met medicinale werking in losgestorte vorm in de handel wordt gebracht, worden de gegevens,
      genoemd in het eerste lid, vermeld op een geleidedocument.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.8
  - number: 7.9.1
    text: |-
      Een aanvraag om een vergunning voor vervaardiging of invoer als bedoeld in [artikel 7.1 van het besluit][ref1]
      wordt ingediend met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.9.2
    text: |-
      Een aanvraag bevat ten minste een beschrijving van het proces van vervaardiging van diervoeders met medicinale
      werking.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.9
  - number: 7.9.3
    text: |-
      De melding, bedoeld in [artikel 7.9, derde lid, van het besluit][ref1] wordt gedaan met gebruikmaking van een
      middel dat daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: '7.10'
    text: |-
      Een aanvraag om een verklaring als bedoeld in [artikel 7.10, tweede lid, van het besluit][ref1] wordt ingediend met
      behulp van een door de minister vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.11.1
    text: |-
      Een diervoeder met medicinale werking wordt uitsluitend aan een houder van dieren afgeleverd overeenkomstig een
      recept van een dierenarts.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.11
  - number: 7.11.2
    text: |-
      Indien het een diervoeder met medicinale werking betreft dat is bestemd voor de behandeling van dieren waarvan
      het vlees, de slachtafvalleen of de producten bestemd zijn voor menselijke consumptie, levert een houder van
      een vergunning voor vervaardiging of invoer, bedoeld in [artikel 7.1, onderdeel a, van het besluit][ref1], niet
      meer diervoeder af dan de hoeveelheid die overeenkomstig het recept nodig is om de dieren gedurende één maand te
      behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.12.1
    text: |-
      Het recept voor de aflevering van een diervoeder met medicinale werking wordt vastgesteld overeenkomstig bijlage A
      bij Richtlijn 90/167/EEG, wordt voorzien van de datum van dagtekening van het recept en bestaat uit een origineel
      en drie afschriften.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.12
  - number: 7.12.2
    text: |-
      Het origineel en één afschrift van het recept zijn bestemd voor de houder van een vergunning voor vervaardiging
      of invoer, bedoeld in [artikel 7.1, onderdeel a, van het besluit][ref1], van het voorgeschreven diervoeder met
      medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '7'
  - number: 7.12.3
    text: De overige twee afschriften van het recept zijn bestemd voor de dierenarts en de houder van dieren.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.12
  - number: 7.12.4
    text: |-
      De houder van een vergunning voor vervaardiging of invoer, bedoeld in het tweede lid, overlegt het afschrift van
      het recept aan de houder van de dieren bij de aflevering van het voorgeschreven diervoeder met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.12
  - number: 7.12.5
    text: |-
      Een recept geeft slechts eenmalig recht op aflevering van het diervoeder met medicinale werking en behandeling van
      het betrokken dier met het voorgeschreven diervoeder met medicinale werking binnen een termijn van drie maanden na
      dagtekening van het recept.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.12
  - number: 7.12.6
    text: |-
      In het recept is de hoeveelheid af te leveren diervoeder met medicinale werking beperkt tot hetgeen noodzakelijk is
      om het met de behandeling beoogde doel te bereiken.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.12
  - number: 7.12.7
    text: |-
      Bij het uitschrijven van het recept vergewist de dierenarts zich ervan dat het diervoeder met medicinale werking
      niet dezelfde antibiotica of dezelfde coccidiostatica als werkzame stof bevat als die welke zijn verwerkt in de
      diervoeders die gewoonlijk worden gebruikt voor het voederen van de betreffende dieren.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.12
  - number: 7.13.1
    text: |-
      Een houder van een vergunning voor het vervaardigen van een diervoeder met medicinale werking, voert een
      administratie inzake iedere transactie met diervoeders met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.2
    text: 'De administratie, bedoeld in het eerste lid, bevat:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.2.a
    text: |-
      het recept, bedoeld in [artikel 7.12, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel7
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.13.2.b
    text: |-
      bewijzen, waaronder de facturen bij de ontvangst en de kopieën van facturen voor de aflevering, met ten minste de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.2.b.1°
    text: aard en hoeveelheid van de bereide en afgeleverde diervoeders met medicinale werking,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.2.b.2°
    text: aard en hoeveelheid van de diervoeders met medicinale werking die op het bedrijf opgeslagen zijn,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.2.b.3°
    text: |-
      aard en hoeveelheid van de diervoeders en de voormengsels voor diervoeders met medicinale werking die bij de
      bereiding van diervoeders met medicinale werking zijn gebruikt,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.2.b.4°
    text: naam en adres van de ontvanger, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.2.b.5°
    text: naam en adres van de dierenarts door wie het recept voor het diervoeder met medicinale werking werd uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.3
    text: |-
      In de administratie worden de gegevens, bedoeld in het tweede lid, onderdeel b, onder 3, voor elk voormengsel voor
      een diervoeder met medicinale werking en voor elk diervoeder met medicinale werking afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 7.13.4
    text: |-
      De administratie en de bescheiden die verband houden met de aantekeningen in de administratie worden gedurende drie
      jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel7.13
  - number: 8.1.1
    text: |-
      De aanvrager van een vergunning voor het in handel brengen van een diergeneesmiddel draagt er zorg voor dat één of
      meer monsters van het betrokken diergeneesmiddel, van de werkzame stof of stoffen, dan wel, in voorkomend geval,
      van de tussenproducten of van andere bestanddelen tijdens de behandeling van de aanvraag om een vergunning voor het
      in handel brengen van een diergeneesmiddel voor de beoordeling van het diergeneesmiddel beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.1
  - number: 8.1.2
    text: |-
      Het diergeneesmiddel wordt op verzoek van de minister binnen vijf weken gezonden aan een voor onderzoek door de
      minister aangewezen laboratorium.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.1
  - number: '8.2'
    text: |-
      De houder van een vergunning voor het in handel brengen van een diergeneesmiddel en de houder van een vergunning
      voor vervaardiging dragen er zorg voor dat van elke partij één of meer monsters van het betrokken diergeneesmiddel,
      van de werkzame stof of stoffen, dan wel, in voorkomend geval, van de tussenproducten of van andere bestanddelen
      voor controle beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.2
  - number: 8.3.1
    text: |-
      De houder van een vergunning voor het in de handel brengen van een immunologisch diergeneesmiddel
      overlegt kopieën van alle controleverslagen, ondertekend door de persoon, bedoeld in
      [artikel 4.9, eerste lid, onderdeel l, van het besluit][ref1] aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel4
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0032386
        artikel: '4'
  - number: 8.3.2
    text: |-
      Binnen een redelijke termijn en uiterlijk binnen 30 dagen overlegt de minister na een controle zonder experimentele
      keuring, een partijvrijgifte certificaat, indien het diergeneesmiddel aan de vergunning voor het in de handel
      brengen voldoet.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.3
  - number: 8.4.1
    text: |-
      Onverminderd [artikel 8.2][ref1] draagt de houder van een vergunning voor het in handel brengen van een
      immunologisch diergeneesmiddel er zorg voor dat van elke partij diergeneesmiddelen ten minste tot de uiterste
      gebruiksdatum ervan voldoende monsters in voorraad worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel8
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 8.4.2
    text: |-
      De monsters worden op verzoek van de minister snel verschaft aan het voor onderzoek door de minister aangewezen
      laboratorium.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.4
  - number: 8.5.1
    text: |-
      De minister kan, indien het om redenen van gezondheid van mens of dier noodzakelijk wordt geacht, artikel 82 van
      [richtlijn 2001/82/EG](32001L0082) toepassen en van de houder van de vergunning voor het in de handel brengen
      verlangen dat van partijen van een immunologisch diergeneesmiddel vóór deze in de handel worden gebracht, van het
      product in onverpakte vorm of van het diergeneesmiddel aan de minister monsters worden verschaft voor experimentele
      keuring door een door de minister aangewezen laboratorium.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.2
    text: |-
      Indien de houder van de vergunning voor het in de handel brengen van het diergeneesmiddel besluit om een partij
      diergeneesmiddelen de keuring, bedoeld in het eerste lid, niet te laten ondergaan, worden de diergeneesmiddelen
      niet in de handel gebracht.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3
    text: |-
      Indien de houder van de vergunning voor het in de handel brengen van het diergeneesmiddel besluit om een partij
      diergeneesmiddelen de keuring, bedoeld in het eerste lid, te laten ondergaan, zendt de houder van de vergunning
      voor het in de handel brengen met de monsters, bedoeld in het eerste lid, de volgende documenten:
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3.a
    text: een partijvrijgiftedocument;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3.b
    text: een partijprotocol, dat is gedagtekend en ondertekend door de persoon die verantwoordelijk is voor de controle;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3.c
    text: 'een schriftelijke verklaring dat met betrekking tot de ter controle aangeboden partij:'
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3.c.1°
    text: |-
      een voor die partij representatief monster bewaard wordt van een zodanige grootte, dat daarop een controle op
      conformiteit met de vergunning voor het in de handel brengen van het diergeneesmiddel kan worden verricht;
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3.c.2°
    text: het monster, bedoeld in subonderdeel 1°, gedurende de houdbaarheidstermijn bewaard zal worden,
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3.c.3°
    text: |-
      het in subonderdeel 1° bedoelde monster in elk geval een primaire verpakking van elk type omvat, indien de partij
      uit verschillende voor de gebruiker bestemde typen primaire verpakkingen bestaat, en
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.3.c.4°
    text: overeenstemming bestaat over het doen uitvoeren van een experimentele keuring.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.5.4
    text: |-
      De houder van de vergunning voor het in de handel brengen stelt het monster, bedoeld in het derde lid, onderdeel c,
      subonderdeel 1°, op verzoek van de minister binnen vijf dagen beschikbaar voor onderzoek door een door de minister
      aangewezen laboratorium.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.5
  - number: 8.6.1
    text: |-
      De uitslag van de keuring, bedoeld in [artikel 8.5, eerste lid][ref1], wordt binnen een termijn van 60 dagen aan
      de houder van de vergunning voor het in de handel brengen van een immunologisch diergeneesmiddel, de houder van de
      vergunning voor vervaardiging van het betrokken diergeneesmiddel, de andere betrokken EER-lidstaten en het Europees
      Directoraat voor de geneesmiddelenkwaliteit medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel8
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 8.6.2
    text: |-
      Indien de minister aan de Europese Commissie heeft medegedeeld dat voor het voltooien van analyses meer tijd
      nodig is, wordt de termijn, bedoeld in het eerste lid, verlengd met een termijn die nodig is om de analyses uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.6
  - number: 8.6.3
    text: Indien de uitslag gunstig is, wordt bij de mededeling een partijvrijgiftecertificaat verstrekt.
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.6
  - number: 8.6.4
    text: |-
      Indien de uitslag gunstig is en de termijn, bedoeld in het eerste of tweede lid, verstreken is, is een
      partijvrijgiftecertificaat met overeenkomstige toepassing van [4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      rechtswege verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0032626/2021-04-21#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '8.7'
    text: |-
      Als laboratorium voor onderzoek van monsters bij controle of onderzoek als bedoeld in de [artikelen 8.1][ref1],
      [8.3][ref2], [8.4][ref3] en [8.5 van het besluit][ref4] alsmede de [artikelen 8.1][ref5], [8.4][ref6] en
      [8.5, eerste en vierde lid][ref7], en als instelling als bedoeld in [artikel 3.22, vierde lid][ref8], worden
      aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0032386#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0032386#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel8
