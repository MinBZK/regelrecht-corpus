$id: regeling_externe_veiligheid_buisleidingen
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2020-04-01'
bwb_id: BWBR0029356
url: https://wetten.overheid.nl/BWBR0029356/2020-04-01
preamble:
  text: |-
    Handelende na overleg met de Ministers van Economische Zaken en van Defensie,

    Gelet op de artikelen 2, eerste lid, 3, tweede lid, 6, derde lid, 7, eerste lid, 12, derde lid, onderdeel b, en 13
    van het Besluit externe veiligheid buisleidingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *aardgas:* a. drooggas dat bij een temperatuur van –200C onder
      atmosferische druk geen vloeistoffractie meer afscheidt van het gas en met een dichtheid van 0,82 kg/m3en
      een calorische waarde van ten hoogste 36,4 MJ/m3, b. natgas dat naast aardgas ook condensaat bevat met een
      Condensaat-Gas Ratio kleiner dan of gelijk aan 80 m3/1.000.000 m3, en zuurgas dat naast aardgas minder dan 4,3%
      zwavelwaterstof bevat, c. hoogcalorisch aardgas, d. voor zover dit aardgas niet vloeibaar wordt getransporteerd en
      geen componenten bevat met toxische of explosieve effecten;
        - *aardolieproducten:* a. aardolie, b. aardgasolie, c. vloeibare aardolieproducten, en d. derivaten, voor zover
      deze geen componenten bevatten met toxische of explosieve effecten;
        - *besluit:* [Besluit externe veiligheid buisleidingen][ref1];
        - *brandbare stoffen:* stoffen die zijn geclassificeerd als ontvlambaar, licht ontvlambaar of zeer licht
      ontvlambaar, niet zijnde aardgas of aardolieproducten;
        - *Carola:* softwareprogramma voor het berekenen van het plaatsgebonden risico en het groepsrisico van ondergrondse
      buisleidingen met aardgas, versie nr. 1.0.0;
        - *Rekenmethodiek Bevb:* rekenmethodiek behorend bij het [Besluit externe veiligheid buisleidingen][ref2],
      bestaande uit de Handleiding Risicoberekeningen Bevb, versie nr. 3, uitgave 2019 en, indien het betreft
      ondergrondse buisleidingen: 1. voor aardgas: Carola, en 2. voor andere stoffen dan aardgas: Safeti-NL;
        - *Safeti-NL:* softwareprogramma voor het berekenen van het plaatsgebonden risico en het groepsrisico van
      inrichtingen en ondergrondse buisleidingen voor het transport van andere stoffen dan aardgas, versie nr. 8, uitgave
      2019;
        - *specifieke stoffen:* kooldioxide, zuurstof en stikstof;
        - *vergiftige stoffen:* stoffen die zijn geclassificeerd als acuut toxisch.


      [ref1]: https://wetten.overheid.nl/BWBR0028265
      [ref2]: https://wetten.overheid.nl/BWBR0028265
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028265
      - id: ref2
        bwb_id: BWBR0028265
  - number: '2'
    text: |-
      Als categorieën buisleidingen als bedoeld in [artikel 2, eerste lid, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel2
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '2'
  - number: 2.a
    text: buisleidingen voor aardgas met een uitwendige diameter van 50 mm of meer en een druk van 1.600 kPA of meer;
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel2
  - number: 2.b
    text: |-
      buisleidingen voor aardolieproducten met een uitwendige diameter van 70 mm of meer en een druk van 1.600 kPA of
      meer;
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel2
  - number: 2.c
    text: |-
      buisleidingen voor brandbare stoffen met een uitwendige diameter van 70 mm of meer of een binnendiameter van 50 mm
      of meer en een druk van 1.600 kPa of meer;
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel2
  - number: 2.d
    text: buisleidingen voor vergiftige stoffen, en
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel2
  - number: 2.e
    text: |-
      buisleidingen voor specifieke stoffen met een uitwendige diameter van 70 mm of meer of een binnendiameter van 50 mm
      of meer en een druk van 1.600 kPa of meer.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel2
  - number: '3'
    text: |-
      De [artikelen 6, eerste en tweede lid][ref1], en [17, eerste en tweede lid, van het besluit][ref2] zijn niet van
      toepassing op pijpleidingen als bedoeld in [artikel 92, onderdeel a, van het Mijnbouwbesluit][ref3] waarvan het
      plaatsgebonden risico in de loop der tijd kleiner wordt voor zover de overschrijding van de grenswaarde voor het
      plaatsgebonden risico maximaal 3 jaar voortduurt en het plaatsgebonden risico niet groter is dan 10-5 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel92
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028265
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '92'
  - number: '4'
    text: |-
      [Artikel 10 van het besluit][ref1] is niet van toepassing voor zover de exploitant reeds aan de daarin opgenomen
      meldplichten heeft voldaan op grond van het bepaalde bij of krachtens [artikel 100 van het Mijnbouwbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel100
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '100'
  - number: '5'
    text: 'Voor buisleidingen voor aardgas met een druk van 1.600 tot en met 4.000 kPa:'
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel5
  - number: 5.a
    text: |-
      is in afwijking van [artikel 6, tweede lid, van het besluit][ref1] het plaatsgebonden risico op een afstand van 4
      meter, gemeten uit het hart van de buisleiding, niet hoger dan 10-6 per jaar, en


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel6
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '6'
  - number: 5.b
    text: |-
      bedraagt in afwijking van [artikel 14, eerste lid, van het besluit][ref1] de belemmeringenstrook ten minste vier
      meter aan weerszijden van de buisleiding, gemeten vanuit het hart van die buisleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel14
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '14'
  - number: 5a.1
    text: |-
      [Artikel 6, tweede lid, van het besluit][ref1] is niet van toepassing voor zover de overschrijding van de waarde,
      genoemd in dat lid, het gevolg is van het op grond van een bestemmingsplan toelaten van de aanleg, bouw of
      vestiging van een risicoverhogend object in de directe omgeving van de buisleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0028265
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0028265
  - number: 5a.2
    text: |-
      De uitzondering, bedoeld in het eerste lid, is alleen van toepassing op bedrijventerreinen die als zodanig in een
      bestemmingsplan zijn bestemd en waar de vestiging van kwetsbare objecten is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel5a
  - number: '6.1'
    text: |-
      Het plaatsgebonden risico, bedoeld in [artikel 11 van het besluit][ref1], het groepsrisico, bedoeld in
      [artikel 12 van het besluit][ref2], en het effect van maatregelen ter beperking van het risico worden berekend met
      de Rekenmethodiek Bevb.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel12
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0028265
        artikel: '12'
  - number: '6.2'
    text: |-
      In afwijking van het eerste lid, wordt het plaatsgebonden risico en het groepsrisico van buisleidingen met
      specifieke kenmerken of omstandigheden, waarin de rekenmethodiek Bevb niet voorziet, berekend volgens de naar het
      oordeel van het bevoegd gezag beste wetenschappelijke inzichten inzake risicoberekeningen.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel6
  - number: '6.3'
    text: |-
      Het bevoegd gezag meldt de toepassing van het tweede lid zo spoedig mogelijk aan de Minister van Infrastructuur
      en Milieu.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel6
  - number: '7'
    text: |-
      Maatregelen ter beperking van het risico, waarvan de exploitant niet kan aantonen dat de maatregel voldoet aan de
      omschrijving in de Rekenmethodiek Bevb, hebben geen risicoverlagend effect in de risicoberekening.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel7
  - number: '8'
    text: |-
      De waarde, bedoeld in [artikel 12, derde lid, onderdeel b, van het besluit][ref1] is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel12
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '12'
  - number: 8.a
    text: |-
      het groepsrisico: 0,1 maal de waarden, genoemd in [artikel 12, eerste lid, onderdeel b, van het besluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel12
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '12'
  - number: 8.b
    text: |-
      de toename van het groepsrisico: minder dan 10%, voor zover de waarden, genoemd in
      [artikel 12, eerste lid, onderdeel b, van het besluit][ref1] niet worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel12
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '12'
  - number: '9.1'
    text: |-
      Met de Rekenmethodiek Bevb worden gelijkgesteld rekenmethodieken die rechtmatig zijn vervaardigd of in de handel
      zijn gebracht in een lidstaat van de Europese Unie of in een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij een tot een douane-unie strekkend verdrag, dan wel rechtmatig zijn vervaardigd in een
      staat die partij is bij een tot een vrijhandelszone strekkend Verdrag dat Nederland bindt, waarvan de resultaten
      gelijkwaardig zijn aan de resultaten van de Rekenmethodiek Bevb.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel9
  - number: '9.2'
    text: |-
      De Minister van Infrastructuur en Milieu besluit, gehoord het RIVM, op verzoek van het bevoegd gezag, of die
      rekenmethodiek gelijkwaardig is aan de Rekenmethodiek Bevb. Daarbij betrekt hij in elk geval de transparantie,
      reproduceerbaarheid, het toepassingsgebied en de ruimtelijke consequenties van die rekenmethodiek.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 1 januari 2011.
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling externe veiligheid buisleidingen.'
    url: https://wetten.overheid.nl/BWBR0029356/2020-04-01#Artikel11
