  - number: '6.2'
    text: |-
      1 Binnen het normale maatschappelijke risico vallende schade blijft voor rekening van de aanvrager.

      2 In ieder geval blijft voor rekening van de aanvrager:

      a. van schade in de vorm van een inkomensderving: een gedeelte gelijk aan twee procent van het inkomen onmiddellijk
      voor het ontstaan van de schade;

      b. van schade in de vorm van een vermindering van de waarde van een onroerende zaak: een gedeelte gelijk aan twee
      procent van de waarde van de onroerende zaak onmiddellijk voor het ontstaan van de schade, tenzij de vermindering
      het gevolg is:

      1°. van de bestemming van de tot de onroerende zaak behorende grond, of

      2°. van op de onroerende zaak betrekking hebbende regels als bedoeld in [artikel 3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
