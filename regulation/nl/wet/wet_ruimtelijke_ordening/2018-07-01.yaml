  - number: '7.2'
    text: |-
      Het is verboden gronden of bouwwerken te gebruiken in strijd met:

      a. een voorbereidingsbesluit of een verklaring als bedoeld in [artikel 4.1, vijfde lid][ref1], of
      [4.3, vierde lid][ref2], voor zover hierbij toepassing is gegeven aan [artikel 3.7, vierde lid][ref3], maar geen
      toepassing is gegeven aan de tweede volzin van dat lid;

      b. regels die zijn gesteld krachtens deze wet voor zover de overtreding daarvan is aangemerkt als strafbaar feit en
      voor zover daarop [artikel 2.1 van de Wet algemene bepalingen omgevingsrecht][ref4] niet van toepassing is.


