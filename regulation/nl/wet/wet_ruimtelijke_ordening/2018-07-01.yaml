  - number: '6.25'
    text: |-
      1 Indien provinciale staten met toepassing van [artikel 3.26, eerste lid][ref1], een inpassingsplan vaststellen, of
      gedeputeerde staten een omgevingsvergunning verlenen voor een project van provinciaal belang waarbij met toepassing
      van [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, treden, vanaf de terinzagelegging in ontwerp van het plan
      of de vergunning provinciale staten voor de toepassing van de bij of krachtens deze afdeling gestelde regels in de
      plaats van de gemeenteraad en gedeputeerde staten in de plaats van burgemeester en wethouders en wordt in plaats
      van «gemeente» telkens gelezen: provincie.

      2 Indien Onze Minister met toepassing van [artikel 3.28, eerste lid][ref3], een inpassingsplan vaststelt,
      of een omgevingsvergunning verleent voor een project van nationaal belang waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref4] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, treedt hij, vanaf de terinzagelegging in ontwerp van het
      plan of de vergunning voor de toepassing van de bij of krachtens deze afdeling gestelde regels in de plaats van
      de gemeenteraad en van burgemeester en wethouders en wordt in plaats van «de gemeente» of «een gemeente» telkens
      gelezen: het Rijk.

      3 Indien Onze Minister, in voorkomend geval gezamenlijk met Onze aangewezen Minister, met toepassing van
      [artikel 3.35][ref5] een inpassingsplan vaststelt, of een omgevingsvergunning verleent als bedoeld in het tweede
      lid, treedt, vanaf de terinzagelegging in ontwerp van het plan of de vergunning Onze Minister, in voorkomend geval
      gezamenlijk met Onze aangewezen Minister, voor de toepassing van de bij of krachtens deze afdeling gestelde regels
      in de plaats van de gemeenteraad en Onze Minister of Onze aangewezen Minister in de plaats van burgemeester en
      wethouders en wordt in plaats van «de gemeente» of «een gemeente» telkens gelezen: het Rijk.

      4 Indien, in andere gevallen dan bedoeld in het eerste tot en met het derde lid, de omgevingsvergunning, bedoeld in
      [artikel 6.17][ref6], door een ander orgaan dan burgemeester en wethouders wordt verleend, treedt dat orgaan voor
      de toepassing van de artikelen 6.17 en [6.21, derde lid][ref7], in de plaats van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.26
