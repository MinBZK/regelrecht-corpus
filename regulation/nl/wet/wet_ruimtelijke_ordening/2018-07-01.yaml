  - number: '6.16'
    text: |-
      Indien in een exploitatieplan het bedrag van de aan de exploitatie verbonden kosten, verminderd met de door de
      gemeente in verband met die exploitatie ontvangen of te ontvangen subsidies en bijdragen van derden, hoger is dan
      het in het exploitatieplan opgenomen bedrag van de opbrengsten van die exploitatie, kan de gemeente die kosten
      slechts verhalen tot maximaal het bedrag van die opbrengsten.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.16
  - number: '6.17'
    text: |-
      1 Burgemeester en wethouders verhalen de kosten, verbonden aan exploitatie van de gronden gelegen
      in een exploitatiegebied, door aan een omgevingsvergunning voor een bouwplan dat krachtens
      [artikel 6.12, eerste lid][ref1], is aangewezen, of een omgevingsvergunning voor een gedeelte daarvan, met
      inachtneming van het exploitatieplan het voorschrift te verbinden dat de vergunninghouder een exploitatiebijdrage
      aan de gemeente verschuldigd is, tenzij de bijdrage anderszins verzekerd is of voorafgaand aan de indiening van de
      bouwaanvraag een exploitatiebijdrage met betrekking tot de betreffende gronden overeengekomen en verzekerd is.

      2 Burgemeester en wethouders stellen bij de omgevingsvergunning een termijn waarbinnen de in het eerste
      lid bedoelde exploitatiebijdrage dient te worden betaald. Zij kunnen met betrekking tot deze bijdrage in de
      omgevingsvergunning een betalingsregeling opnemen, welke afhankelijk kan worden gesteld van de uitvoering
      van werken en bouwwerken, bedoeld in het exploitatieplan. Indien de betalingsregeling inhoudt dat gehele
      of gedeeltelijke betaling na de start van de bouw plaatsvindt, kunnen burgemeester en wethouders van de
      vergunninghouder aanvullende zekerheden met betrekking tot de betaling eisen. Hierover kunnen bij algemene
      maatregel van bestuur nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.12
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.17
    references:
      - id: ref1
