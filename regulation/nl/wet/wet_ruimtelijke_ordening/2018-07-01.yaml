  - number: '6.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inrichting en behandeling,
      en nadere regels omtrent de indiening, de motivering en de wijze van beoordeling, van een aanvraag voor een
      tegemoetkoming in de schade. Die regels kunnen de verplichting voor de gemeenteraad en provinciale staten inhouden
      hieromtrent een verordening vast te stellen.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.7
  - number: '6.8'
    text: |-
      1 Indien ten behoeve van belangen, uitsluitend of mede behartigd door een ander openbaar lichaam dan
      de gemeente, op schriftelijk verzoek van dat openbare lichaam, dan wel krachtens wettelijk voorschrift
      bepalingen in een bestemmingsplan of inpassingsplan, een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan wordt afgeweken, zijn opgenomen die hogere kosten voor de gemeente ten gevolge kunnen hebben en
      over de verdeling van deze kosten geen overeenstemming is bereikt, kunnen gedeputeerde staten op schriftelijk
      verzoek van burgemeester en wethouders dat openbare lichaam verplichten om aan de gemeente een vergoeding toe te
      kennen, voor zover:

      a. de kosten redelijkerwijs niet voor rekening van de gemeente behoren te blijven,

      b. de vergoeding niet voldoende anderszins is verzekerd en

      c. de vergoeding niet krachtens wettelijk voorschrift is uitgesloten.

      2 Het besluit op het verzoek van burgemeester en wethouders wordt genomen nadat het bestemmingsplan, inpassingsplan
      of de omgevingsvergunning, bedoeld in het eerste lid, in werking is getreden.

      3 In afwijking van het eerste lid wordt het besluit op het verzoek genomen door Onze Minister dan wel door Onze
      Minister en Onze Minister wie het mede aangaat, indien het andere openbare lichaam het Rijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.8
