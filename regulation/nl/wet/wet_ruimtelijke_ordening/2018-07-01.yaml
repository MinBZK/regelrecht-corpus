  - number: '6.21'
    text: |-
      1 Burgemeester en wethouders kunnen terstond na het overschrijden van de termijn van betaling van een gedeelte of
      het geheel van de exploitatiebijdrage, bedoeld in [artikel 6.17, eerste lid][ref1], besluiten dat het bouwen niet
      kan aanvangen of moet worden gestaakt totdat aan de betalingsverplichtingen is voldaan. Zij stellen de termijn,
      bedoeld in [artikel 5:24 van de Algemene wet bestuursrecht][ref2], op ten hoogste vier weken.

      2 Burgemeester en wethouders kunnen het verschuldigde bedrag, bedoeld in het eerste lid, bij dwangbevel invorderen.

      3 Indien niet binnen drie maanden na het besluit, bedoeld in het eerste lid, de desbetreffende bijdrage door de
      gemeente is ontvangen, kunnen burgemeester en wethouders de omgevingsvergunning geheel of gedeeltelijk intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel524
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.21
