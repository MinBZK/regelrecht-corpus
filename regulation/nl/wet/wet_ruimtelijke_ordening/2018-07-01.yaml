        artikel: 40b
  - number: '6.20'
    text: |-
      1 Binnen drie maanden na uitvoering van de in een exploitatieplan voorziene werken, werkzaamheden en maatregelen
      stellen burgemeester en wethouders een afrekening van dat exploitatieplan vast.

      2 Bij de afrekening worden de betaalde exploitatiebijdragen, bedoeld in [artikel 6.17, eerste lid][ref1],
      herberekend op grond van de totale kosten en het totale aantal gewogen eenheden in het exploitatiegebied. De
      basiseenheden en gewichtsfactoren, bedoeld in [artikel 6.18, tweede en derde lid][ref2], die zijn toegepast bij de
      berekening van een betaalde exploitatiebijdrage, worden ook toegepast bij de herberekening.

      3 Indien een herberekende exploitatiebijdrage meer dan vijf procent lager is dan een betaalde exploitatiebijdrage,
      betaalt de gemeente binnen een maand na vaststelling van de afrekening het verschil, voor zover het groter is dan
      vijf procent, naar evenredigheid terug met rente aan degene die ten tijde van de betaling van de bijdrage, of een
      gedeelte daarvan, houder was van de desbetreffende omgevingsvergunning, of diens rechtsopvolger.

      4 Indien ten minste negentig procent van de in het exploitatieplan begrote kosten is gerealiseerd, wordt op verzoek
      van degene die ten tijde van betaling van een exploitatiebijdrage als bedoeld in [artikel 6.17, eerste lid][ref3],
      houder was van de desbetreffende omgevingsvergunning, of diens rechtsopvolger, met betrekking tot de desbetreffende
      exploitatiebijdrage een afrekening opgesteld en gevolg gegeven aan het derde lid.

      5 Tegen een besluit omtrent de afrekening en de herberekende exploitatiebijdrage kan beroep worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.18
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6.17
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.20
