  - number: '8.2'
    text: |-
      1 Bij een beroep tegen een besluit omtrent vaststelling van een bestemmingsplan, een inpassingsplan of
      een rijksbestemmingsplan als bedoeld in [artikel 10.3, eerste lid][ref1], kunnen geen gronden worden
      aangevoerd die betrekking hebben op een aanwijzing als bedoeld in [artikel 4.2, eerste lid][ref2], of
      [artikel 4.4, eerste lid][ref3], waarop dat besluit berust, voor zover deze aanwijzing betrekking heeft op een
      daarbij concreet aangegeven locatie waarvan geen afwijking mogelijk is.

      2 De Afdeling bestuursrechtspraak van de Raad van State beslist binnen twaalf maanden na afloop van de
      beroepstermijn op een beroep tegen:

      a. een besluit omtrent vaststelling van een bestemmingsplan, een inpassingsplan of een rijksbestemmingsplan als
      bedoeld in [artikel 10.3, eerste lid][ref4],

      b. een besluit als bedoeld in [artikel 3.1, derde lid][ref5],

      c. een besluit omtrent wijziging of uitwerking van een bestemmingsplan overeenkomstig
      [artikel 3.6, eerste lid][ref6],

      d. een aanwijzingsbesluit als bedoeld in [artikel 3.8, zesde lid][ref7], of [artikel 3.26, tweede lid][ref8], in
      samenhang met [artikel 3.8, zesde lid][ref9],

      e. een besluit op een verzoek om een kostenvergoeding als bedoeld in [artikel 6.8][ref10] of [6.9][ref11], en

      f. een besluit omtrent vaststelling van een exploitatieplan voor gronden, begrepen in een gelijktijdig
      bekendgemaakt bestemmingsplan, inpassingsplan of wijzigingsplan als bedoeld in [artikel 3.6, eerste lid][ref12],
      alsmede herzieningen van het desbetreffende exploitatieplan en besluiten omtrent de afrekening en herberekende
      exploitatiebijdragen van het desbetreffende exploitatieplan.

      3 Indien het beroep een bestemmingsplan betreft ter uitvoering waarvan een verzoek tot onteigening is gedaan
      als bedoeld in [artikel 78 van de onteigeningswet][ref13], dan wel een bestemmingsplan waarin ingevolge
      [artikel 3.4][ref14] onderdelen zijn aangewezen ten aanzien waarvan de verwezenlijking in de naaste toekomst nodig
      wordt geacht, wordt het beroep behandeld voor andere ingestelde beroepen als bedoeld in het tweede lid.

      4 Als belanghebbende bij een besluit als bedoeld in de [artikelen 6.12, eerste en tweede lid][ref15], en
      [6.15, eerste lid][ref16], wordt in elk geval aangemerkt degene die een grondexploitatieovereenkomst heeft gesloten
      met betrekking tot in het desbetreffende besluit opgenomen gronden, of die eigenaar is van die gronden.


