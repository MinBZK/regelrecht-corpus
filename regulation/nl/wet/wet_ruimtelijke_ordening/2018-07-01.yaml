    text: |-
      1 De gemeenteraad stelt ten behoeve van een goede ruimtelijke ordening voor het gehele grondgebied van de gemeente
      een of meer structuurvisies vast waarin de hoofdzaken van het door de gemeente te voeren ruimtelijk beleid zijn
      vastgelegd.

      2 De gemeenteraad kan voor aspecten van het gemeentelijk ruimtelijk beleid een structuurvisie vaststellen.

      3 Voor zover een structuurvisie ontwikkelingen omvat, gaat die structuurvisie in op de wijze waarop de gemeenteraad
      zich voorstelt die ontwikkelingen te doen verwezenlijken.

      4 De gemeenteraad kan in samenwerking met de raden van andere gemeenten een structuurvisie vaststellen.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 Provinciale staten stellen ten behoeve van een goede ruimtelijke ordening voor het gehele grondgebied van de
      provincie een of meer structuurvisies vast waarin de hoofdzaken van het door de provincie te voeren ruimtelijk
      beleid zijn vastgelegd.

      2 Provinciale staten kunnen voor aspecten van het provinciaal ruimtelijk beleid een structuurvisie vaststellen.

      3 Voor zover een structuurvisie ontwikkelingen omvat, gaat die structuurvisie in op de wijze waarop provinciale
      staten zich voorstellen die ontwikkelingen te doen verwezenlijken.

      4 Provinciale staten kunnen in samenwerking met de staten van andere provincies een structuurvisie vaststellen.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Onze Minister, in overeenstemming met Onze Ministers die het mede aangaat, stelt ten behoeve van een goede
      ruimtelijke ordening voor het gehele land een of meer structuurvisies vast waarin de hoofdzaken van het door het
      Rijk te voeren ruimtelijk beleid zijn vastgelegd.

      2 Onze Minister of Onze Minister wie het aangaat, in overeenstemming met Onze Minister, kan ten behoeve van tot
      zijn beleidsterrein behorende aspecten van het nationale ruimtelijk beleid een structuurvisie vaststellen.

      3 Voor zover een structuurvisie ontwikkelingen omvat, gaat die structuurvisie tevens in op de wijze waarop Onze
      Minister zich voorstelt die ontwikkeling te doen verwezenlijken.

      4 Met het vaststellen van een structuurvisie als bedoeld in het eerste en tweede lid wordt niet eerder een aanvang
      gemaakt, dan nadat Onze Minister of Onze Minister wie het aangaat, in overeenstemming met Onze Minister, een
      beschrijving van de inrichting van de voorgenomen structuurvisie aan de Tweede Kamer der Staten-Generaal heeft
      overgelegd en de Tweede Kamer der Staten-Generaal deze beschrijving openbaar behandeld heeft. Indien de Tweede
      Kamer der Staten-Generaal niet binnen vier weken besluit tot openbare behandeling van de beschrijving van de
      inrichting van de voorgenomen structuurvisie, dan kan met het vaststellen van de structuurvisie aangevangen worden.
      Onze Minister of Onze Minister wie het aangaat, in overstemming met Onze Minister, stelt de Tweede Kamer der
      Staten-Generaal schriftelijk op de hoogte van de gevolgtrekkingen die hij aan de behandeling verbindt.

      5 Met verwezenlijking van de structuurvisie wordt niet eerder een aanvang gemaakt dan acht weken nadat Onze
      Minister of Onze Minister wie het aangaat haar aan de Staten-Generaal heeft toegezonden. Indien door of namens
      een der Kamers der Staten-Generaal binnen acht weken na toezending van de structuurvisie te kennen wordt gegeven
      dat zij over de visie in het openbaar wil beraadslagen wordt met verwezenlijking van de structuurvisie niet
      eerder een aanvang gemaakt dan zes maanden na die toezending, dan wel indien de beraadslagingen op een eerder
      tijdstip zijn beëindigd, na die beraadslagingen. Onze Minister of Onze Minister wie het aangaat stelt de Staten-
      Generaal schriftelijk op de hoogte van de gevolgtrekkingen die hij voor het nationaal ruimtelijk beleid aan de
      beraadslagingen verbindt.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 De kennisgeving van het besluit tot vaststelling van een structuurvisie geschiedt tevens langs elektronische weg.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorbereiding,
      vormgeving, inrichting en beschikbaarstelling van structuurvisies.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel2.4
  - number: '3.1'
    text: |-
      1 De gemeenteraad stelt voor het gehele grondgebied van de gemeente een of meer bestemmingsplannen vast, waarbij
      ten behoeve van een goede ruimtelijke ordening de bestemming van de in het plan begrepen grond wordt aangewezen
      en met het oog op die bestemming regels worden gegeven. Deze regels betreffen in elk geval regels omtrent het
      gebruik van de grond en van de zich daar bevindende bouwwerken. Deze regels kunnen tevens strekken ten behoeve
      van de uitvoerbaarheid van in het plan opgenomen bestemmingen, met dien verstande dat deze regels ten aanzien van
      woningbouwcategorieën uitsluitend betrekking hebben op percentages gerelateerd aan het plangebied.

      2 De bestemming van gronden, met inbegrip van de met het oog daarop gestelde regels, wordt binnen een periode van
      tien jaar, gerekend vanaf de datum van vaststelling van het bestemmingsplan, telkens opnieuw vastgesteld.

      3 Telkens indien de gemeenteraad van oordeel is dat de in het bestemmingsplan aangewezen bestemmingen en de met het
      oog daarop gegeven regels in overeenstemming zijn met een goede ruimtelijke ordening, kan hij, in afwijking van het
      tweede lid, besluiten tot verlenging van de periode van tien jaar, genoemd in dat lid, met tien jaar. In aanvulling
      op [artikel 3:42 van de Algemene wet bestuursrecht][ref1] plaatsen burgemeester en wethouders de kennisgeving van
      het besluit tot verlenging tevens in de Staatscourant en voorts geschiedt deze langs elektronische weg.

      4 Indien niet voor het verstrijken van de periode van tien jaar, genoemd in het tweede of het derde lid, de
      raad onderscheidenlijk opnieuw een bestemmingsplan heeft vastgesteld dan wel een verlengingsbesluit heeft
      genomen, vervalt de bevoegdheid tot het invorderen van rechten terzake van na dat tijdstip door of vanwege het
      gemeentebestuur verstrekte diensten die verband houden met het bestemmingsplan.

      5 Van overschrijding van de in het tweede lid bedoelde periode doen burgemeester en wethouders
      schriftelijk mededeling. Zij leggen deze mededeling bij het bestemmingsplan waarin de bestemming
      van de grond laatstelijk is aangewezen, ter gemeentesecretarie voor een ieder ter inzage.
      [Artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing. Van de
      terinzagelegging wordt tevens mededeling gedaan in de Staatscourant en voorts langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel342
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.1
