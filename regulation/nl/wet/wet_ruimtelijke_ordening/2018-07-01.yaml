  - number: '3.36'
    text: |-
      1 Indien een bestuursorgaan dat in eerste aanleg bevoegd is een besluit als bedoeld in
      [artikel 3.35, eerste lid, onder b][ref1], te nemen, niet of niet tijdig overeenkomstig de aanvraag beslist,
      dan wel een beslissing neemt die naar het oordeel van Onze ingevolge artikel 3.35, derde lid, aangewezen
      Minister en Onze Minister wie het mede aangaat wijziging behoeft, kunnen Onze bedoelde Ministers gezamenlijk een
      beslissing nemen. In dat geval treedt dit besluit in de plaats van het besluit van het in eerste aanleg bevoegde
      bestuursorgaan. Indien Onze in de eerste volzin bedoelde Ministers voornemens zijn zelf een beslissing te nemen,
      plegen zij overleg met het bestuursorgaan dat in eerste aanleg bevoegd is te beslissen.

      2 Indien bij toepassing van het eerste lid de beslissing op een aanvraag wordt genomen door Onze in dat lid
      bedoelde Ministers, stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter
      zake ontvangen rechten in ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
