  - number: 3.1a
    text: |-
      [Artikel 3.1, tweede, vierde en vijfde lid][ref1], is niet van toepassing op bestemmingsplannen die elektronisch
      raadpleegbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
