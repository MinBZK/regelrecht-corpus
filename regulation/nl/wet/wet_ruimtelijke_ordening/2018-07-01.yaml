  - number: '3.35'
    text: |-
      1 Bij wet of een besluit van Onze Minister of een Onzer andere Ministers, in overeenstemming met het gevoelen van
      de ministerraad, kan worden bepaald dat de verwezenlijking van een onderdeel van het nationaal ruimtelijk beleid
      wenselijk maakt dat:

      a. een inpassingsplan als bedoeld in [artikel 3.28][ref1] wordt vastgesteld
      of een omgevingsvergunning wordt verleend waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan of de beheersverordening wordt afgeweken;

      b. de voorbereiding en bekendmaking van nader aan te duiden, op aanvraag of ambtshalve te nemen besluiten wordt
      gecoördineerd, of

      c. een inpassingsplan als bedoeld in [artikel 3.28][ref3] dan wel een wijziging of uitwerking van een
      inpassingsplan, wordt vastgesteld of een omgevingsvergunning wordt verleend waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref4] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, en de voorbereiding en bekendmaking daarvan wordt
      gecoördineerd met de voorbereiding en bekendmaking van besluiten als bedoeld onder b.

      2 In een wet of besluit als bedoeld in de aanhef van het eerste lid strekkende tot toepassing van dat lid, onder a
      of c, wordt de Minister aangewezen die, in afwijking van [artikel 3.28, tweede lid][ref5], in de plaats treedt van
      burgemeester en wethouders en gezamenlijk met Onze Minister in de plaats treedt van de gemeenteraad.

      3 In een wet of besluit als bedoeld in de aanhef van het eerste lid strekkende tot toepassing van dat lid,
      onder b of c, wordt de Minister aangewezen die eerstverantwoordelijk is voor de gecoördineerde voorbereiding en
      bekendmaking. Deze Minister kan van andere bestuursorganen de medewerking vorderen, die voor het welslagen van de
      coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking. Tevens kan worden bepaald dat
      deze Minister en Onze Minister wie het mede aangaat gezamenlijk met uitsluiting van een in eerste aanleg bevoegd
      bestuursorgaan, een voor bedoelde verwezenlijking benodigd besluit op aanvraag of ambtshalve nemen.

      4 Bij de gecoördineerde voorbereiding en bekendmaking als bedoeld in het eerste lid, onder b of
      c, wordt de procedure beschreven in de [artikelen 3.31][ref6] en [3.32][ref7], respectievelijk
      die procedure in samenhang met hetzij, in geval van een inpassingsplan, de procedure beschreven in
      [artikel 3.8, eerste, derde en vijfde lid][ref8], hetzij, in geval van een omgevingsvergunning, de uitgebreide
      voorbereidingsprocedure beschreven in [paragraaf 3.3 van de Wet algemene bepalingen omgevingsrecht][ref9]
      toegepast, met dien verstande dat Onze in de wet of het besluit, bedoeld in de aanhef van het eerste lid,
      aangewezen Minister in de plaats treedt van burgemeester en wethouders en deze Minister en Onze Minister
      gezamenlijk in de plaats van de gemeenteraad. In geval van een omgevingsvergunning als bedoeld in de eerste volzin
      treden de betrokken besluiten in werking met ingang van de dag na die waarop de beroepstermijn afloopt.

      5 Indien ten aanzien van de verwezenlijking van een onderdeel van het nationaal ruimtelijk beleid het maken
      van een milieueffectrapport krachtens [artikel 7.2 van de Wet milieubeheer][ref10] verplicht is, gaat de
      kennisgeving, bedoeld in [artikel 7.9, eerste lid][ref11], onderscheidenlijk de mededeling, bedoeld in
      [artikel 7.27, eerste lid][ref12], dan wel [artikel 7.24, eerste lid van die wet][ref13], vergezeld van een globale
      beschrijving van de gevolgen voor het ruimtelijk beleid, van de sociaal-economische gevolgen en van de gevolgen
      voor andere daarbij betrokken belangen, die van die verwezenlijking te verwachten zijn.

      6 Indien toepassing wordt gegeven aan het eerste lid, onder c, en het inpassingsplan, bedoeld in
      [artikel 3.28][ref14] is aangewezen als plan bij de voorbereiding waarvan krachtens de [artikelen 7.2][ref15]
      of [7.2a van de Wet milieubeheer][ref16] een milieueffectrapport moet worden gemaakt, en één van de besluiten,
      bedoeld in het eerste lid, onder b, is aangewezen als besluit bij de voorbereiding waarvan krachtens artikel
      7.2 van de Wet milieubeheer een milieueffectrapport moet worden gemaakt, vindt de raadpleging op grond van
      [artikel 7.25][ref17] of [artikel 7.27, tweede lid, van de Wet milieubeheer][ref18] gelijktijdig plaats met
      de raadpleging op grond van [artikel 7.8 van die wet][ref19] respectievelijk vindt de kennisgeving op grond
      van artikel 7.27, derde lid, van de Wet milieubeheer gelijktijdig plaats met de kennisgeving op grond van
      [artikel 7.9, eerste lid, van die wet][ref20]. In afwijking van [artikel 7.26][ref21] of artikel 7.27, zevende
      lid, van de Wet milieubeheer kan de termijn, bedoeld in dat artikel of dat artikellid, tweemaal met ten hoogste zes
      weken worden verlengd.

      7 [Artikel 3.30, derde lid][ref22] is van overeenkomstige toepassing met dien verstande dat in plaats van
      «bestemmingsplan» wordt gelezen: inpassingsplan. Voor zover een omgevingsvergunning voor een aanlegactiviteit als
      bedoeld in [artikel 2.1, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref23] is vereist,
      geldt die eis niet voor de uitvoering van werken of werkzaamheden ter uitvoering van een inpassingsplan of een
      omgevingsvergunning als bedoeld in het eerste lid, onder c, in het gebied dat in dat plan is begrepen.

      8 Voor zover de verwezenlijking van een onderdeel van het nationaal ruimtelijk beleid onevenredig wordt belemmerd
      door bepalingen die – al dan niet krachtens de wet – bij of krachtens een regeling van een provincie, gemeente
      of waterschap zijn vastgesteld, kunnen die bepalingen bij het nemen en uitvoeren van de besluiten, bedoeld in het
      eerste lid, om dringende redenen buiten toepassing worden gelaten.

      9 Een besluit als bedoeld in de aanhef van het eerste lid, wordt toegezonden aan de beide Kamers der Staten-
      Generaal. Aan het besluit wordt geen uitvoering gegeven dan nadat beide Kamers daarmee hebben ingestemd. Met het
      besluit wordt geacht te zijn ingestemd indien geen van beide Kamers binnen vier weken na de toezending van dat
      besluit een besluit heeft genomen omtrent de behandeling daarvan.


