  - number: '6.15'
    text: |-
      1 Een exploitatieplan wordt na inwerkingtreding ten minste eenmaal per jaar herzien totdat de in dat
      exploitatieplan voorziene werken, werkzaamheden en bouwwerken zijn gerealiseerd. Indien tegen een exploitatieplan
      beroep is ingesteld, vangt de termijn aan op de dag nadat een beslissing omtrent het exploitatieplan onherroepelijk
      is geworden.

      2 Een uitwerkingsplan als bedoeld in [artikel 3.6, eerste lid, onder b][ref1], dat gronden bevat waarvoor in het
      exploitatieplan een globale omschrijving is vastgesteld, treedt niet in werking voordat een herziening van het
      exploitatieplan met betrekking tot de desbetreffende gronden is vastgesteld en bekendgemaakt.

      3 Bij een herziening van een exploitatieplan is [artikel 6.14, eerste lid][ref2], niet van toepassing en kan de
      mededeling, bedoeld in [artikel 6.14, tweede lid][ref3], achterwege blijven voor zover de herziening uitsluitend
      betrekking heeft op:

      a. een uitwerking en detaillering van de ramingen van kosten en opbrengsten;

      b. een aanpassing van deze ramingen met inachtneming van de in het exploitatieplan aangegeven methoden van
      indexering;

      c. een vervanging van de ramingen van de kosten door gerealiseerde kosten, of

      d. andere niet-structurele onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6
