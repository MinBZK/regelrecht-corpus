        artikel: 5:24
  - number: '6.22'
    text: |-
      1 Een gemeente verstrekt een aan de vergunninghouder verschuldigde financiële bijdrage indien de prestaties waaraan
      die bijdrage is gerelateerd, overeenkomstig het exploitatieplan zijn verricht en een verzoek tot betaling bij de
      gemeente is ingediend.

      2 Op het verstrekken van een bijdrage als bedoeld in het eerste lid is
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '6.23'
    text: |-
      De gemeenteraad kan met betrekking tot de grondexploitatie een verordening vaststellen, welke bepalingen kan
      bevatten met betrekking tot de procedure voor het totstandkomen van een overeenkomst over grondexploitatie en de
      inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.23
  - number: '6.24'
    text: |-
      1 Bij het aangaan van een overeenkomst over grondexploitatie kunnen burgemeester en wethouders in de overeenkomst
      bepalingen opnemen inzake:

      a. financiële bijdragen aan de grondexploitatie alsmede op basis van een vastgestelde structuurvisie, aan
      ruimtelijke ontwikkelingen;

      b. verrekening van schade die op grond van [artikel 6.1][ref1] voor vergoeding in aanmerking zou komen.

      2 Na vaststelling van een exploitatieplan nemen burgemeester en wethouders bij het aangaan van een overeenkomst
      over grondexploitatie het exploitatieplan in acht, met dien verstande dat de overeenkomst bepalingen kan bevatten
      over de uitwerking van onderwerpen uit het exploitatieplan, maar geen bepalingen kan bevatten over onderwerpen
      welke deel kunnen uitmaken van een exploitatieplan, maar daarin niet zijn opgenomen.

      3 Van de overeenkomst wordt binnen twee weken na het sluiten daarvan door burgemeester en wethouders kennis gegeven
      in een van gemeentewege uitgegeven blad of een dag-, nieuws- of huis-aan-huisblad.

      4 [Artikel 6.4a, tweede lid][ref2], is van overeenkomstige toepassing ten aanzien van degene die een overeenkomst
      heeft gesloten over grondexploitatie waarin een regeling van verhaal van planschade is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.4a
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.24
