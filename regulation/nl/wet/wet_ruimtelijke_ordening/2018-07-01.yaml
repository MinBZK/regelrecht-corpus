  - number: 4.3a
    text: |-
      1 Bij de algemene maatregel van bestuur, bedoeld in [artikel 4.3, eerste lid][ref1], kan worden bepaald dat Onze
      Minister of Onze Minister die het aangaat in overeenstemming met Onze Minister, op aanvraag van burgemeester en
      wethouders of gedeputeerde staten, ontheffing kan verlenen van krachtens dat lid vast te stellen regels, voor
      zover de verwezenlijking van het gemeentelijk onderscheidenlijk provinciaal ruimtelijk beleid wegens bijzondere
      omstandigheden onevenredig wordt belemmerd in verhouding tot de met die regels te dienen nationale belangen. Aan
      de ontheffing kunnen voorschriften worden verbonden indien de betrokken nationale belangen dat met het oog op een
      goede ruimtelijke ordening noodzakelijk maken.

      2 Voor zover de ontheffing wordt aangevraagd met het oog op een voorgenomen
      besluit tot verlenen van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van
      het bestemmingsplan of de beheersverordening wordt afgeweken, wordt deze ontheffing aangemerkt als een verklaring
      van geen bedenkingen als bedoeld in [artikel 2.27, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.27
