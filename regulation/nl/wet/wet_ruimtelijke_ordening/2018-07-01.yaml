  - number: '6.1'
    text: |-
      1 Burgemeester en wethouders kennen degene die in de vorm van een inkomensderving of een vermindering van de
      waarde van een onroerende zaak schade lijdt of zal lijden als gevolg van een in het tweede lid genoemde oorzaak, op
      aanvraag een tegemoetkoming toe, voor zover de schade redelijkerwijs niet voor rekening van de aanvrager behoort te
      blijven en voor zover de tegemoetkoming niet voldoende anderszins is verzekerd.

      2 Een oorzaak als bedoeld in het eerste lid is:

      a. een bepaling van een bestemmingsplan, beheersverordening of inpassingsplan, niet zijnde een bepaling als bedoeld
      in [artikel 3.3][ref1], [artikel 3.6, eerste lid][ref2], of [artikel 3.38, derde of vierde lid][ref3];

      b. een bepaling van een wijziging krachtens [artikel 3.6, eerste lid, onder a][ref4], niet zijnde een bepaling als
      bedoeld in artikel 3.6, tweede lid, of van een uitwerking krachtens artikel 3.6, eerste lid, onder b, of een nadere
      eis krachtens artikel 3.6, eerste lid, onder d;

      c. een besluit omtrent een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, c of g, van de Wet algemene bepalingen omgevingsrecht][ref5];

      d. de aanhouding van een besluit omtrent het verlenen van een omgevingsvergunning ingevolge
      [artikel 3.3, eerste lid][ref6], of [3.4 van de Wet algemene bepalingen omgevingsrecht][ref7];

      e. een bepaling van een provinciale verordening als bedoeld in [artikel 4.1, derde lid][ref8], of
      van een algemene maatregel van bestuur als bedoeld in [artikel 4.3, derde lid][ref9], voor zover
      die bepaling een weigeringsgrond bevat als bedoeld in [artikel 2.10, eerste lid, onder c][ref10], of
      [2.11, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref11];

      f. een bepaling van een exploitatieplan als bedoeld in [artikel 6.12, eerste lid][ref12], voor zover die bepaling
      een weigeringsgrond bevat als bedoeld in [artikel 2.10, eerste lid, onder c][ref13], [2.11, eerste lid][ref14], of
      [2.12, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref15];

      g. een koninklijk besluit als bedoeld in [artikel 10.4][ref16].

      3 De aanvraag bevat een motivering, alsmede een onderbouwing van de hoogte van de gevraagde tegemoetkoming.

      4 Een aanvraag voor een tegemoetkoming in schade ten gevolge van een oorzaak als bedoeld in het tweede lid, onder
      a, b, c, e, f of g, moet worden ingediend binnen vijf jaar na het moment waarop die oorzaak onherroepelijk is
      geworden.

      5 Een aanvraag voor een tegemoetkoming in schade ten gevolge van een aanhouding als bedoeld in het tweede
      lid, onder d, kan eerst, en moet worden ingediend binnen vijf jaar na terinzagelegging van het vastgestelde
      bestemmingsplan.

      6 Schade als gevolg van een bepaling als bedoeld in [artikel 3.3][ref17] of
      [artikel 3.6, eerste lid, onder c][ref18], of [artikel 3.38, derde of vierde lid][ref19], wordt eerst vastgesteld
      op grond van een krachtens die bepalingen genomen besluit.


