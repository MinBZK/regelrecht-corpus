  - number: '3.37'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorbereiding,
      vormgeving, inrichting en beschikbaarstelling en nadere regels omtrent inhoud en uitvoerbaarheid van
      bestemmingsplannen en inpassingsplannen. Tevens kunnen regels worden gesteld omtrent de inhoud van de bij een plan
      behorende toelichting.

      2 Bij de maatregel, bedoeld in het eerste lid, kunnen voorts regels worden gesteld omtrent het gebruik van gegevens
      en onderzoeken die ten grondslag liggen aan bestemmingsplannen en inpassingsplannen.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.37
  - number: '3.38'
    text: |-
      1 Onverminderd de gevallen waarin bij of krachtens wettelijk voorschrift een bestemmingsplan is vereist, kan de
      gemeenteraad in afwijking van [artikel 3.1][ref1] voor die delen van het grondgebied van de gemeente waar geen
      ruimtelijke ontwikkeling wordt voorzien, in plaats van een bestemmingsplan een beheersverordening vaststellen
      waarin het beheer van dat gebied overeenkomstig het bestaande gebruik wordt geregeld. De kennisgeving van een
      besluit tot vaststelling van een beheersverordening geschiedt tevens langs elektronische weg.

      2 De verordening wordt in elk geval binnen tien jaar na de vaststelling herzien.
      [Artikel 3.1, vierde lid, en vijfde lid, eerste en tweede volzin][ref2], is van overeenkomstige toepassing.

      3 Om overeenkomstig de verordening bestaand gebruik te handhaven en te beschermen kan bij de verordening worden
      bepaald dat het verboden is om binnen daartoe aangegeven gebied zonder omgevingsvergunning:

      a. bepaalde werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren;

      b. bouwwerken te slopen.

      4 Bij de verordening kan worden bepaald dat, met inachtneming van de bij de verordening te geven regels, bij een
      omgevingsvergunning kan worden afgeweken van bij de verordening aan te geven regels.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vormgeving, inrichting en
      beschikbaarstelling en nadere regels omtrent de inhoud van de verordening.

      6 [Artikel 3.6a][ref3] is van overeenkomstige toepassing met dien verstande dat voor «bestemmingsplan» wordt
      gelezen: beheersverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6a
