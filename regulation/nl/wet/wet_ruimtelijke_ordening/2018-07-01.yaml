  - number: '3.2'
    text: |-
      Bij een bestemmingsplan kunnen voorlopige bestemmingen worden aangewezen en met het oog hierop voorlopige regels
      worden gegeven. Een voorlopige bestemming geldt voor een daarbij te stellen termijn van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.2
  - number: '3.3'
    text: |-
      Om te voorkomen dat in een bestemmingsplan begrepen grond minder geschikt wordt voor de verwezenlijking van de
      daaraan bij het plan te geven bestemming dan wel om een overeenkomstig het plan verwezenlijkte bestemming te
      handhaven en te beschermen, kan bij het bestemmingsplan worden bepaald, dat het verboden is om binnen een bij dat
      plan aangegeven gebied zonder omgevingsvergunning:

      a. bepaalde werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren;

      b. bouwwerken te slopen.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.3
  - number: '3.4'
    text: |-
      Bij een bestemmingsplan kunnen, voor zover het gronden betreft waarvan het gebruik afwijkt van het plan, een of
      meer onderdelen worden aangewezen ten aanzien waarvan de verwezenlijking in de naaste toekomst nodig wordt geacht.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      Bij een bestemmingsplan kunnen gebieden worden aangewezen waarbinnen de daar aanwezige bouwwerken dienen te worden
      gemoderniseerd of vervangen door gelijksoortige bebouwing van gelijke of nagenoeg gelijke bouwmassa. Zolang deze
      modernisering of vervanging niet is verwezenlijkt, wordt het gebruik van die bouwwerken aangemerkt als afwijkend
      van het plan.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Bij een bestemmingsplan kan worden bepaald dat met inachtneming van de bij het plan te geven regels:

      a. burgemeester en wethouders binnen bij het plan te bepalen grenzen het plan kunnen wijzigen;

      b. burgemeester en wethouders het plan moeten uitwerken;

      c. bij een omgevingsvergunning kan worden afgeweken van bij het plan aan te geven regels;

      d. burgemeester en wethouders ten aanzien van in het plan omschreven onderwerpen of onderdelen nadere eisen kunnen
      stellen.

      2 Een wijzigingsbevoegdheid als bedoeld in het eerste lid, onder a, kan mede een uitwerkingsplicht als bedoeld in
      het eerste lid, onder b, inhouden.

      3 Een wijziging of uitwerking als bedoeld in het eerste lid, onder a of b, maakt deel uit van het plan en kan,
      zolang de bestemming nog niet is verwezenlijkt, worden vervangen door een nieuwe wijziging of uitwerking.

      4 Belanghebbenden worden in de gelegenheid gesteld hun zienswijzen omtrent een voorgenomen nadere eis als bedoeld
      in het eerste lid naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.6
  - number: 3.6a
    text: |-
      Bij een bestemmingsplan kan worden uitgesloten dat daarvan voor bepaalde termijn kan
      worden afgeweken door middel van een omgevingsvergunning waarbij toepassing is gegeven aan
      [artikel 2.12, eerste lid, onder a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref1] indien het
      belang ter bescherming waarvan een bepaalde bestemming in het plan is opgenomen zich daarmee niet verdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.6a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.12'
  - number: '3.7'
    text: |-
      1 De gemeenteraad kan verklaren dat een bestemmingsplan wordt voorbereid.

      2 Bij het voorbereidingsbesluit wordt bepaald voor welk gebied het geldt en met ingang van welke dag het in werking
      treedt.

      3 Om te voorkomen dat een bij het voorbereidingsbesluit aangewezen gebied minder geschikt wordt voor de
      verwezenlijking van de daaraan bij het plan te geven bestemming, kan [artikel 3.3][ref1] overeenkomstig worden
      toegepast.

      4 Om te voorkomen dat een bij een voorbereidingsbesluit aangewezen gebied minder geschikt wordt voor de
      verwezenlijking van een daaraan bij het plan te geven bestemming, kan bij het besluit tevens worden bepaald dat het
      verboden is het gebruik van daarbij aangewezen gronden of bouwwerken te wijzigen. Hierbij kan mede worden bepaald
      dat binnen de bij het voorbereidingsbesluit te geven regels bij een omgevingsvergunning van het verbod kan worden
      afgeweken.

      5 Een voorbereidingsbesluit vervalt, indien niet binnen een jaar na de datum van inwerkingtreding daarvan een
      ontwerp voor een bestemmingsplan ter inzage is gelegd.

      6 Een voorbereidingsbesluit vervalt tevens op het moment waarop het bestemmingsplan ter voorbereiding waarvan het
      besluit is genomen, in werking treedt.

      7 Een voorbereidingsbesluit wordt bekendgemaakt door terinzagelegging van dit besluit.
      [Artikel 3:42 van de Algemene wet bestuursrecht][ref2] is van toepassing. Van het voorbereidingsbesluit wordt
      tevens mededeling gedaan in de Staatscourant en voorts langs elektronische weg.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de vormgeving, inrichting en
      beschikbaarstelling van het voorbereidingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel342
