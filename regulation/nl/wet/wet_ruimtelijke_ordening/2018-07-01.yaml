  - number: '4.4'
    text: |-
      1 Indien nationale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kan Onze Minister
      of Onze Minister wie het aangaat in overeenstemming met Onze Minister:

      a. een gemeenteraad een aanwijzing geven binnen een daarbij te bepalen termijn een bestemmingsplan vast te stellen
      overeenkomstig daarbij gegeven voorschriften omtrent de inhoud van dat bestemmingsplan;

      b. provinciale staten een aanwijzing geven binnen een daarbij te bepalen termijn van ten hoogste zes maanden
      toepassing te geven aan [artikel 4.1][ref1];

      c. gedeputeerde staten een aanwijzing geven binnen een daarbij te bepalen termijn van ten hoogste drie maanden
      toepassing te geven aan [artikel 4.2][ref2].

      2 Er wordt niet overgegaan tot toepassing van het eerste lid, dan na overleg met burgemeester en wethouders
      onderscheidenlijk gedeputeerde staten en niet eerder dan vier weken nadat de Tweede Kamer der Staten-Generaal in
      kennis is gesteld van het voornemen tot het nemen van het besluit.

      3 Bij de toepassing van het eerste lid kan Onze Minister of Onze Minister wie het aangaat in overeenstemming
      met Onze Minister, tevens verklaren dat een bestemmingsplan als bedoeld in het eerste lid door de gemeente
      wordt voorbereid. [Artikel 3.7, eerste tot en met zevende lid][ref3], is van overeenkomstige toepassing. Bij
      de vormgeving en beschikbaarstelling van het voorbereidingsbesluit wordt overeenkomstige toepassing gegeven aan
      de krachtens [artikel 3.7, achtste lid][ref4], gestelde regels. Een door Onze Minister of Onze Minister wie het
      aangaat in overeenstemming met Onze Minister vastgesteld voorbereidingsbesluit wordt gelijkgesteld met een door de
      gemeenteraad vastgesteld voorbereidingsbesluit.

      4 Op de voorbereiding van een besluit tot aanwijzing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] van toepassing. De kennisgeving van het ontwerp-besluit en
      van het besluit tot aanwijzing geschiedt tevens langs elektronische weg.

      5 De bij of krachtens de algemene maatregel van bestuur gegeven regels, bedoeld in [artikel 4.2, vijfde lid][ref6],
      zijn van overeenkomstige toepassing.


