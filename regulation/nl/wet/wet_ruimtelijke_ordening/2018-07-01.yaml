  - number: '3.31'
    text: |-
      1 In door de gemeenteraad met toepassing van [artikel 3.30][ref1] aangewezen gevallen bevorderen burgemeester en
      wethouders een gecoördineerde voorbereiding van de bij of krachtens dat artikel aangeduide besluiten. Burgemeester
      en wethouders kunnen andere bestuursorganen verzoeken de medewerking te verlenen, die voor het welslagen van de
      coördinatie nodig is. Met het oog hierop zendt een bestuursorgaan dat bevoegd is op een aanvraag voor een dergelijk
      besluit te beslissen hun onverwijld een afschrift van die aanvraag.

      2 Ten aanzien van aanvragen als bedoeld in het eerste lid, zijn burgemeester en wethouders mede bevoegd deze in te
      dienen bij de bevoegde bestuursorganen.

      3 Op de voorbereiding van besluiten, bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:

      a. de kennisgevingen, bedoeld in [artikel 3:12 van die wet][ref3], tevens worden gedaan in de Staatscourant en
      voorts langs elektronische weg;

      b. burgemeester en wethouders ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kunnen geven
      aan [artikel 3:11, eerste lid, van die wet][ref4] en de kennisgevingen, bedoeld in [artikel 3:12 van die wet][ref5]
      voor verschillende onderwerpen kunnen samenvoegen in een kennisgeving, die door burgemeester en wethouders wordt
      gedaan;

      c. de ontwerpen van besluiten binnen een door burgemeester en wethouders in overeenstemming met het desbetreffend
      bevoegd gezag te bepalen termijn worden toegezonden aan burgemeester en wethouders, die zorg dragen voor de in
      [artikel 3:13, eerste lid, van die wet][ref6] bedoelde toezending;

      d. zienswijzen door een ieder naar voren kunnen worden gebracht;

      e. in afwijking van [artikel 3:18 van die wet][ref7] de besluiten worden genomen binnen een door burgemeester en
      wethouders in overeenstemming met het desbetreffend bevoegd gezag te bepalen termijn;

      f. de besluiten onverwijld worden toegezonden aan burgemeester en wethouders;

      g. burgemeester en wethouders beslissen over de toepassing van [artikel 3:18, tweede lid, van die wet][ref8];

      h. de in [artikel 3:44 van die wet][ref9] bedoelde toezending tevens geschiedt aan burgemeester en wethouders.


