  - number: 4.1a
    text: |-
      1 Bij de verordening, bedoeld in [artikel 4.1, eerste lid][ref1], kan worden bepaald dat gedeputeerde staten op
      aanvraag van burgemeester en wethouders ontheffing kunnen verlenen van krachtens dat lid vast te stellen regels,
      voor zover de verwezenlijking van het gemeentelijk ruimtelijk beleid wegens bijzondere omstandigheden onevenredig
      wordt belemmerd in verhouding tot de met die regels te dienen provinciale belangen. Aan de ontheffing kunnen
      voorschriften worden verbonden indien de betrokken provinciale belangen dat met het oog op een goede ruimtelijke
      ordening noodzakelijk maken.

      2 Voor zover de ontheffing wordt aangevraagd met het oog op een voorgenomen
      besluit tot verlening van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van
      het bestemmingsplan of de beheersverordening wordt afgeweken, wordt deze ontheffing aangemerkt als een verklaring
      van geen bedenkingen als bedoeld in [artikel 2.27, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel4.1a
