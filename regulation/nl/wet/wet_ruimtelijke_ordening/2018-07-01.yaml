  - number: 3.36b
    text: |-
      1 De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden, nadat:

      a. een bestemmings- of inpassingsplan, of een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van
      het geldende bestemmingsplan wordt afgeweken, als bedoeld in [artikel 3.30, eerste lid, onder b][ref3],
      onderscheidenlijk de [artikelen 3.33, eerste lid, onder b][ref4], of [3.35, eerste lid, onder c][ref5], is
      vastgesteld, respectievelijk is verleend;

      b. een bestemmings- of inpassingsplan waarbij toepassing is gegeven aan
      [artikel 3.4][ref6], dan wel een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref7] van het
      geldende bestemmingsplan wordt afgeweken, gelijktijdig met een exploitatieplan is bekendgemaakt.

      2 Voor zover nodig in afwijking van [artikel 37, tweede lid][ref8], of
      [54i, eerste lid, van de onteigeningswet][ref9], doet de rechtbank niet eerder uitspraak dan nadat het onderdeel
      van het bestemmingsplan, inpassingsplan of de omgevingsvergunning, bedoeld in het eerste lid, ter uitvoering
      waarvan wordt onteigend, onherroepelijk is geworden blijkens een uitspraak van de Afdeling bestuursrechtspraak
      van de Raad van State dan wel een verklaring van de secretaris van de Raad van State of van de griffier van de
      betrokken rechtbank.


