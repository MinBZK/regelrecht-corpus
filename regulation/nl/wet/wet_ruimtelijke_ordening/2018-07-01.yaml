        afdeling: '6.4'
  - number: '6.18'
    text: |-
      1 Ten behoeve van het bepalen van de exploitatiebijdrage, bedoeld in [artikel 6.17, eerste lid][ref1], worden in
      het exploitatieplan uitgiftecategorieën vastgesteld. Zo nodig wordt daarbinnen een verder onderscheid aangebracht.

      2 Per onderscheiden categorie wordt een basiseenheid vastgesteld in een hoeveelheid vierkante meters
      grondoppervlakte, een hoeveelheid vierkante meters vloeroppervlakte, of een andere hiermee vergelijkbare maatstaf.

      3 Door elke basiseenheid te vermenigvuldigen met een per categorie vastgestelde gewichtsfactor worden gewogen
      eenheden vastgesteld.

      4 De gewogen eenheden in het exploitatiegebied worden bij elkaar opgeteld.

      5 Het verhaalbare bedrag per gewogen eenheid is het ten hoogste verhaalbare bedrag, bedoeld in
      [artikel 6.16][ref2], gedeeld door het overeenkomstig het vierde lid berekende aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.16
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.18
