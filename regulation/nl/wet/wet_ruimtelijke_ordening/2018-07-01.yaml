  - number: '6.13'
    text: |-
      1 Een exploitatieplan bevat:

      a. een kaart van het exploitatiegebied;

      b. een omschrijving van de werken en werkzaamheden voor het bouwrijp maken van het exploitatiegebied, de aanleg van
      nutsvoorzieningen, en het inrichten van de openbare ruimte in het exploitatiegebied;

      c. een exploitatieopzet, bestaande uit:

      1°. voor zover nodig een raming van de inbrengwaarden van de gronden, welke inbrengwaarden voor de toepassing van
      deze afdeling worden beschouwd als kosten in verband met de exploitatie van die gronden;

      2°. een raming van de andere kosten in verband met de exploitatie, waaronder een raming van de schade die op grond
      van [artikel 6.1][ref1] voor vergoeding in aanmerking zou komen;

      3°. een raming van de opbrengsten van de exploitatie, alsmede de peildatum van de onder 1° tot en met 3° bedoelde
      ramingen;

      4°. een tijdvak waarbinnen de exploitatie van de gronden zal plaatsvinden;

      5°. voor zover nodig een fasering van de uitvoering van werken, werkzaamheden, maatregelen en bouwplannen, en zo
      nodig koppelingen hiertussen;

      6°. de wijze van toerekening van de te verhalen kosten aan de uit te geven gronden.

      2 Een exploitatieplan kan bevatten:

      a. een kaart waarop het voorgenomen grondgebruik is aangegeven en de gronden welke de gemeente beoogt te verwerven;

      b. eisen voor de werken en werkzaamheden voor het bouwrijp maken van het exploitatiegebied, de aanleg van
      nutsvoorzieningen, en het inrichten van de openbare ruimte in het exploitatiegebied;

      c. regels omtrent het uitvoeren van de onder b bedoelde werken en werkzaamheden;

      d. een uitwerking van de in [artikel 3.1, eerste lid][ref2], en
      [artikel 2.22, zesde lid, van de Wet algemene bepalingen omgevingsrecht][ref3] bedoelde regels met betrekking tot
      de uitvoerbaarheid;

      e. regels met inachtneming waarvan bij een omgevingsvergunning kan worden afgeweken van bij het exploitatieplan aan
      te geven regels.

      3 Voor gronden, waarvoor nog een uitwerking als bedoeld in [artikel 3.6, eerste lid, onder b][ref4],
      moet worden vastgesteld, of waarvoor ingevolge de fasering geen omgevingsvergunning als bedoeld in
      [artikel 6.17, eerste lid][ref5], kan worden verleend, kunnen de onderdelen van een exploitatieplan, bedoeld in het
      eerste en tweede lid, een globale inhoud hebben.

      4 Voor de berekening van de kosten en opbrengsten wordt ervan uitgegaan dat het exploitatiegebied in zijn geheel in
      exploitatie zal worden gebracht.

      5 Indien geen sprake is van onteigening wordt de inbrengwaarde van gronden vastgesteld met overeenkomstige
      toepassing van de [artikelen 40b tot en met 40f van de onteigeningswet][ref6]. Voor gronden welke onteigend zijn
      of waarvoor een onteigeningsbesluit is genomen, of welke op onteigeningsbasis zijn of worden verworven, is de
      inbrengwaarde gelijk aan de schadeloosstelling ingevolge de [onteigeningswet][ref7].

      6 Kosten in verband met werken, werkzaamheden en maatregelen waarvan het exploitatiegebied of een gedeelte
      daarvan profijt heeft, en welke toerekenbaar zijn aan het exploitatieplan worden naar evenredigheid opgenomen in
      de exploitatieopzet.

      7 Bovenplanse kosten kunnen voor meerdere locaties of gedeeltes daarvan in de explotatieopzet worden opgenomen in
      de vorm van een fondsbijdrage, indien er voor deze locaties of gedeeltes daarvan een structuurvisie is vastgesteld
      welke aanwijzingen geeft over de bestedingen die ten laste van het fonds kunnen komen.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de exploitatieopzet en de
      daarin op te nemen opbrengsten, en de verhaalbare kostensoorten.

      9 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de beschikbaarstelling van
      het exploitatieplan en nadere regels worden gesteld over:

      a. de kaarten, eisen en regels, bedoeld in het eerste en tweede lid;

      b. de manier van opstellen en de berekeningsmethode van de exploitatieopzet, en

      c. kosten, welke deel uitmaken van de exploitatieopzet.

      10 De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat het ontwerp is overgelegd aan beide kamers der Staten-Generaal, in de Staatscourant en langs
      elektronische weg is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen een bij die bekendmaking
      te stellen termijn van ten minste vier weken schriftelijk opmerkingen over het ontwerp ter kennis van Onze Minister
      te brengen.


