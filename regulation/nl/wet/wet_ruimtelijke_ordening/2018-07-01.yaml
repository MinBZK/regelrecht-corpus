  - number: '7.1'
    text: |-
      1 Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bepaalde bij of krachtens
      deze wet.

      2 Het in [artikel 5.2, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] bedoelde bestuursorgaan
      heeft tot taak zorg te dragen voor bestuursrechtelijke handhaving van de op grond van het bepaalde bij of krachtens
      deze wet voor degene die het project, bedoeld in dat lid, uitvoert, geldende voorschriften.

      3 Met betrekking tot de kwaliteit van de uitvoering en handhaving van het bepaalde bij of krachtens deze wet zijn
      de [artikelen 5.3 tot en met 5.25 van de Wet algemene bepalingen omgevingsrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel7.1
