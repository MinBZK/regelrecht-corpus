  - number: '3.26'
    text: |-
      1 Indien sprake is van provinciale belangen kunnen provinciale staten, de betrokken gemeenteraad gehoord, voor de
      daarbij betrokken gronden een inpassingsplan vaststellen.

      2 De [afdelingen 3.1][ref1], [3.2][ref2] en [3.3][ref3] zijn van overeenkomstige toepassing, met dien verstande
      dat voor «bestemmingsplan» «inpassingsplan» wordt gelezen en voor «gemeentebestuur» «provinciaal bestuur», en
      dat met betrekking tot [artikel 3.1][ref4] en [afdeling 3.2][ref5] provinciale staten in de plaats treden van de
      gemeenteraad, en gedeputeerde staten in de plaats treden van burgemeester en wethouders.

      3 Bij inpassingsplan kan worden bepaald in hoeverre bestemmingsplannen binnen het plangebied van het inpassingsplan
      hun werking behouden. Voor zover de werking niet bij inpassingsplan is geregeld, wordt het inpassingsplan geacht
      deel uit te maken van het bestemmingsplan of de bestemmingsplannen waarop het betrekking heeft.

      4 Provinciale staten kunnen bij een besluit als bedoeld in het eerste lid bepalen dat:

      a. gedeputeerde staten de bevoegdheden en verplichtingen, bedoeld in [artikel 3.6, eerste lid][ref6], uitoefenen,

      b. gedeputeerde staten beslissen op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, b, c of g, van de Wet algemene bepalingen omgevingsrecht][ref7].

      Gedeputeerde staten zenden terstond een afschrift aan burgemeester en wethouders van beschikkingen die zijn gegeven
      met toepassing van de bevoegdheden, bedoeld in de eerste volzin.

      5 De gemeenteraad is vanaf het moment waarop het ontwerp van het inpassingsplan ter inzage is gelegd, niet langer
      bevoegd tot vaststelling van een bestemmingsplan voor de gronden waarop dat inpassingsplan betrekking heeft. De
      bedoelde bevoegdheid ontstaat weer tien jaar na vaststelling van het inpassingsplan, dan wel eerder, indien het
      inpassingsplan dat bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
