  - number: '3.28'
    text: |-
      1 Indien sprake is van nationale belangen kan Onze Minister, de gemeenteraad en provinciale staten gehoord, voor de
      daarbij betrokken gronden een inpassingsplan vaststellen. Het horen van de gemeenteraad en provinciale staten kan
      worden gecombineerd met het overleg, bedoeld in [artikel 3.1.1 van het Besluit ruimtelijke ordening][ref1].

      2 De [afdelingen 3.1][ref2], [3.2][ref3] en [3.3][ref4], met uitzondering van
      [artikel 3.8, vierde en zesde lid][ref5], zijn van overeenkomstige toepassing, met dien verstande dat voor
      «bestemmingsplan» «inpassingsplan» wordt gelezen en voor «gemeentebestuur» «Onze Minister», en dat met betrekking
      tot [artikel 3.1][ref6] en [afdeling 3.2][ref7] Onze Minister in de plaats treedt van de gemeenteraad en van
      burgemeester en wethouders.

      3 Bij inpassingsplan kan worden bepaald in hoeverre bestemmingsplannen binnen het plangebied van het inpassingsplan
      hun werking behouden. Voor zover de werking niet bij inpassingsplan is geregeld, wordt het inpassingsplan geacht
      deel uit te maken van het bestemmingsplan of de bestemmingsplannen waarop het betrekking heeft.

      4 Onze Minister kan bij een besluit als bedoeld in het eerste lid bepalen dat hij:

      a. de bevoegdheden en verplichtingen, bedoeld in [artikel 3.6, eerste lid][ref8], uitoefent;

      b. beslist op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, b, c of g, van de Wet algemene bepalingen omgevingsrecht][ref9].

      Onze Minister zendt terstond een afschrift aan burgemeester en wethouders van beschikkingen die zijn gegeven met
      toepassing van de bevoegdheden, bedoeld in de eerste volzin.

      5 De gemeenteraad is, respectievelijk provinciale staten zijn, vanaf het moment waarop het ontwerp van het
      inpassingsplan ter inzage is gelegd, niet langer bevoegd tot vaststelling van een bestemmingsplan respectievelijk
      inpassingsplan voor de gronden waarop het inpassingsplan, bedoeld in het eerste lid, betrekking heeft. De
      bedoelde bevoegdheid ontstaat weer tien jaar na vaststelling van het inpassingsplan, dan wel eerder, indien het
      inpassingsplan dat bepaalt.

      6 De bevoegdheid tot het maken van provinciale verordeningen als bedoeld in [artikel 4.1][ref10] blijft gehandhaafd
      voor zover deze verordeningen niet met een krachtens het eerste lid vastgesteld inpassingsplan in strijd zijn.

      7 De bepalingen van een provinciale verordening als bedoeld in [artikel 4.1][ref11] blijven buiten toepassing voor
      zover zij met een krachtens het eerste lid vastgesteld inpassingsplan in strijd zijn.


