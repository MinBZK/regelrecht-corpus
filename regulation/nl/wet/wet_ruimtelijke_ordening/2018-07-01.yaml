  - number: '8.4'
    text: |-
      Indien gedurende de beroepstermijn met betrekking tot een besluit tot vaststelling van een bestemmingsplan of
      inpassingsplan of van een wijziging of uitwerking hiervan dan wel van een rijksbestemmingsplan bij de voorzitter
      van de Afdeling bestuursrechtspraak van de Raad van State een verzoek om voorlopige voorziening is gedaan, wordt
      de werking van het besluit opgeschort totdat op het verzoek is beslist. Bij de toewijzing van het verzoek geeft
      de voorzitter aan op welke onderdelen van het bestemmingsplan of inpassingsplan of van de wijziging of uitwerking
      hiervan de voorlopige voorziening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel8.4
  - number: '8.5'
    text: |-
      1 Onze Minister kan namens de Staat tot oprichting overgaan van een stichting die tot doel heeft de taak te
      verrichten, bedoeld in [artikel 8.6][ref1].

      2 Wijziging van de statuten van de stichting of ontbinding van de stichting behoeft de instemming van Onze
      Minister. Alvorens te beslissen over de toestemming hoort Onze Minister de Afdeling bestuursrechtspraak van de Raad
      van State.

      3 De statuten waarborgen dat de stichting haar werkzaamheden onpartijdig en onafhankelijk verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel8.6
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '8.6'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: '8.6'
    text: |-
      De stichting heeft tot taak aan de bestuursrechter op diens verzoek deskundigenbericht uit te brengen inzake
      beroepen op grond van deze wet. Op verzoek van de bestuursrechter brengt de stichting tevens deskundigenbericht uit
      inzake beroepen op grond van andere wetten voor zover het onderwerpen betreft die samenhangen met de ruimtelijke
      ordening.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel8.6
  - number: '8.7'
    text: |-
      De personen die deel uitmaken van de organen van de stichting en het personeel van de stichting vervullen geen
      functies en betrekkingen waarvan de uitoefening ongewenst is met het oog op de handhaving van de onpartijdigheid en
      onafhankelijkheid van de stichting dan wel het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel8.7
  - number: '8.8'
    text: |-
      1 Indien met toepassing van [artikel 8.5][ref1] een stichting is opgericht, verstrekt Onze Minister aan de
      stichting een subsidie overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen voorschriften,
      voor zover dat redelijkerwijs noodzakelijk is voor een goede taakuitoefening.

      2 [Artikel 8:36, eerste lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel8.5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel836
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel8.8
