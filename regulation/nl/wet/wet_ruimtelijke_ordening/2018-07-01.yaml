  - number: 3.9a
    text: |-
      1 Op de voorbereiding van een wijziging of uitwerking van een bestemmingsplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat de kennisgeving
      bedoeld in [artikel 3:12 van die wet][ref2], tevens langs elektronische weg geschiedt, dat het ontwerpbesluit
      met de hierbij behorende stukken tevens langs elektronische weg beschikbaar wordt gesteld, dat burgemeester
      en wethouders binnen acht weken na afloop van de termijn van terinzageligging omtrent de uitwerking of
      wijziging besluiten. Op het besluit tot vaststelling van een wijziging of uitwerking van een bestemmingsplan is
      [artikel 3.8, derde lid][ref3], van overeenkomstige toepassing.

      2 Het eerste lid is niet van toepassing op de afwijzing van een aanvraag om een wijziging of uitwerking van een
      bestemmingsplan vast te stellen.

      3 Tot een afwijzing als bedoeld in het tweede lid besluiten burgemeester en wethouders zo spoedig mogelijk, doch in
      elk geval binnen acht weken na ontvangst van de aanvraag.

      4 Een besluit tot vaststelling van een wijziging of uitwerking van een bestemmingsplan treedt in werking met ingang
      van de dag na die waarop de beroepstermijn afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
