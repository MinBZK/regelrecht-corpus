  - number: '6.14'
    text: |-
      1 Op de voorbereiding van een exploitatieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing, met dien verstande dat de kennisgeving tevens geschiedt aan degenen die in de kadastrale registratie
      staan vermeld als eigenaar van gronden in het exploitatiegebied en voorts langs elektronische weg geschiedt.

      2 Burgemeester en wethouders delen binnen vier weken nadat een exploitatieplan is vastgesteld,
      de eigenaren van de gronden in het exploitatiegebied schriftelijk mede dat een exploitatieplan is
      vastgesteld. Zij doen tevens mededeling van de terinzagelegging en de termijn waarbinnen beroep
      kan worden ingesteld en voorts geschiedt de kennisgeving langs elektronische weg. In afwijking van
      [artikel 3:1, eerste lid, onder b, van de Algemene wet bestuursrecht][ref2] zijn op een besluit tot vaststelling
      van een exploitatieplan de [artikelen 3:40][ref3], [3:42][ref4], [3:43][ref5], [3:44][ref6] en [3:45][ref7] en
      [afdeling 3.7 van die wet][ref8] van toepassing.


