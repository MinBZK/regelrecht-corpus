  - number: '3.30'
    text: |-
      1 Bij besluit van de gemeenteraad kunnen gevallen of categorieën van gevallen worden aangewezen waarin de
      verwezenlijking van een onderdeel van het gemeentelijk ruimtelijk beleid het wenselijk maakt dat:

      a. de voorbereiding en bekendmaking van nader aan te duiden, op aanvraag of ambtshalve te nemen besluiten worden
      gecoördineerd, of

      b. de voorbereiding en bekendmaking van een bestemmingsplan, een wijziging of
      uitwerking van een bestemmingsplan of een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, wordt gecoördineerd met de voorbereiding en bekendmaking
      van besluiten als bedoeld onder a.

      2 Bij de gecoördineerde voorbereiding en bekendmaking als bedoeld in het eerste lid, onder a of
      b, wordt de procedure beschreven in de [artikelen 3.31][ref2] en [3.32][ref3], respectievelijk die
      procedure in samenhang met hetzij, in geval van een bestemmingsplan, de procedure beschreven in
      [artikel 3.8][ref4], hetzij, in geval van een omgevingsvergunning, de uitgebreide procedure beschreven in
      [paragraaf 3.3 van de Wet algemene bepalingen omgevingsrecht][ref5] toegepast.

      3 Voor zover onder de besluiten, bedoeld in het eerste lid, onder b, mede een omgevingsvergunning is
      begrepen wordt bij de toepassing van de [artikelen 2.1, eerste lid, onder c][ref6], [2.10][ref7] en
      [2.11 van de Wet algemene bepalingen omgevingsrecht][ref8] in plaats van bestemmingsplan gelezen: bestemmingsplan,
      bedoeld in het eerste lid, onder b.


