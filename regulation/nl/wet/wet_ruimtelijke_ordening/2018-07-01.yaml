  - number: '3.33'
    text: |-
      1 Bij besluit van provinciale staten kunnen gevallen of categorieën van gevallen worden aangewezen waarin de
      verwezenlijking van een onderdeel van het provinciaal ruimtelijk beleid het wenselijk maakt dat:

      a. de voorbereiding en bekendmaking van nader aan te duiden, op aanvraag of ambtshalve te nemen besluiten worden
      gecoördineerd, of

      b. een inpassingsplan als bedoeld in [artikel 3.26][ref1] dan wel een wijziging of uitwerking van een
      inpassingsplan, wordt vastgesteld of een omgevingsvergunning wordt verleend waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, en de voorbereiding en bekendmaking daarvan wordt
      gecoördineerd met de voorbereiding en bekendmaking van besluiten als bedoeld onder a.

      2 Gedeputeerde staten kunnen van andere bestuursorganen, tenzij dit een bestuursorgaan van het Rijk is, de
      medewerking vorderen, die voor het welslagen van de coördinatie nodig is. Die bestuursorganen verlenen de van hen
      gevorderde medewerking.

      3 In een besluit als bedoeld in de aanhef van het eerste lid kunnen provinciale staten tevens bepalen
      dat gedeputeerde staten, met uitsluiting van het in eerste aanleg bevoegde bestuursorgaan, tenzij dit een
      bestuursorgaan van het Rijk is, de voor de bedoelde verwezenlijking benodigde besluiten op aanvraag of ambtshalve
      nemen.

      4 Bij de gecoördineerde voorbereiding en bekendmaking als bedoeld in het eerste lid, onder a of b, wordt
      de procedure beschreven in de [artikelen 3.31][ref3] en [3.32][ref4], respectievelijk die procedure in
      samenhang met hetzij, in geval van een inpassingsplan, de procedure beschreven in [artikel 3.8][ref5],
      hetzij, in geval van een omgevingsvergunning, de uitgebreide voorbereidingsprocedure beschreven in
      [paragraaf 3.3 van de Wet algemene bepalingen omgevingsrecht][ref6] toegepast, met dien verstande dat daarbij
      provinciale staten in de plaats treden van de gemeenteraad, en gedeputeerde staten in de plaats van burgemeester
      en wethouders.

      5 Indien ten aanzien van de verwezenlijking van een onderdeel van het provinciaal ruimtelijk beleid het
      maken van een milieueffectrapport krachtens [artikel 7.2 van de Wet milieubeheer][ref7] verplicht is, gaat
      de kennisgeving, bedoeld in [artikel 7.9, eerste lid][ref8], onderscheidenlijk de mededeling, bedoeld in
      [artikel 7.27, eerste lid][ref9], dan wel [artikel 7.24, eerste lid van die wet][ref10], vergezeld van een globale
      beschrijving van de gevolgen voor het ruimtelijk beleid, van de sociaal-economische gevolgen en van de gevolgen
      voor andere daarbij betrokken belangen, die van die verwezenlijking te verwachten zijn.

      6 [Artikel 3.30, derde lid][ref11], is van overeenkomstige toepassing met dien verstande dat in plaats van
      «bestemmingsplan» wordt gelezen: inpassingsplan.

      7 Voor zover de verwezenlijking van een onderdeel van het provinciaal ruimtelijk beleid onevenredig wordt belemmerd
      door bepalingen die – al dan niet krachtens de wet – bij of krachtens een regeling van een gemeente of waterschap
      zijn vastgesteld, kunnen die bepalingen bij het nemen en uitvoeren van de besluiten, bedoeld in het eerste lid,
      onder a of b, om dringende redenen buiten toepassing worden gelaten.


