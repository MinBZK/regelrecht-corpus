        artikel: '2.12'
  - number: '6.9'
    text: |-
      [Artikel 6.8][ref1] is van overeenkomstige toepassing indien ten behoeve van belangen,
      uitsluitend of mede behartigd door een ander openbaar lichaam dan de gemeente, op schriftelijk
      verzoek van dat openbare lichaam een omgevingsvergunning is verleend waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref2] tijdelijk van
      het bestemmingsplan wordt afgeweken, dan wel ingevolge [artikel 3.3, eerste lid, van die wet][ref3] is besloten
      tot aanhouding van de beslissing op een aanvraag om een omgevingsvergunning voor een bouw- of aanlegactiviteit als
      bedoeld in [artikel 2.1, eerste lid, onder a of b, van die wet][ref4], met dien verstande dat het verzoek om een
      kostenvergoeding slechts kan worden ingediend door burgemeester en wethouders. Het verzoek kan worden ingediend
      binnen vier weken nadat de omgevingsvergunning, dan wel het besluit tot aanhouding, onherroepelijk is geworden


