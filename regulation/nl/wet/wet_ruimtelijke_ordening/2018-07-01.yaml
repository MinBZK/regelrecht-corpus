preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, ter bevordering van een duurzame ruimtelijke kwaliteit,
    wenselijk is nieuwe regels te geven omtrent de ruimtelijke ordening teneinde de positie van het bestemmingsplan
    te versterken, de doelgerichtheid en doeltreffendheid van het ruimtelijk beleid te vergroten en de ruimtelijke
    regelgeving te vereenvoudigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      b. de inspecteur: de als zodanig bij besluit van Onze Minister aangewezen ambtenaar;

      c. omgevingsvergunning: omgevingsvergunning als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1];

      d. voorbereidingsbesluit: besluit als bedoeld in [artikel 3.7][ref2].

      2 In deze wet en de daarop berustende bepalingen wordt mede verstaan onder:

      a. grond, gronden of gebied: de onder- en bovengrond op verschillende niveaus, alsmede water, de territoriale zee
      en de exclusieve economische zone daaronder begrepen;

      b. vaststellen van een bestemmingsplan: herzien van een bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.7
