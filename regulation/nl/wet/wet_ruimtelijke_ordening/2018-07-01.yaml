  - number: '4.3'
    text: |-
      1 Indien nationale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kunnen
      bij of krachtens algemene maatregel van bestuur, op voordracht van Onze Minister of van Onze Minister
      die het aangaat in overeenstemming met Onze Minister, regels worden gesteld omtrent de inhoud van
      bestemmingsplannen, van provinciale inpassingsplannen en van omgevingsvergunningen waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van
      het bestemmingsplan of de beheersverordening wordt afgeweken, alsmede omtrent de inhoud van beheersverordeningen.
      Daarbij kan worden bepaald dat een regel slechts geldt voor een daarbij aangegeven gedeelte van het land. Bij de
      maatregel kan voorts worden bepaald onder welke voorwaarden en omstandigheden bij provinciale verordening van de
      krachtens dit lid gestelde regels ontheffing kan worden verleend, die regels in die verordening worden uitgewerkt
      of in die verordening aanvullende regels worden gesteld. Bij de vormgeving, inrichting en beschikbaarstelling
      van de regels wordt overeenkomstige toepassing gegeven aan de krachtens [artikel 4.1, vierde lid][ref2], gestelde
      regels. De kennisgeving van een besluit tot vaststelling van de algemene maatregel van bestuur geschiedt tevens
      langs elektronische weg.

      2 Tenzij bij de algemene maatregel van bestuur een andere termijn wordt gesteld, stelt de gemeenteraad binnen een
      jaar na inwerkingtreding van de maatregel een bestemmingsplan of een beheersverordening vast met inachtneming van
      de maatregel.

      3 Bij of krachtens een maatregel als bedoeld in het eerste lid kunnen regels worden gesteld die noodzakelijk zijn
      om te voorkomen dat in de maatregel begrepen gronden of bouwwerken minder geschikt worden voor de verwezenlijking
      van het doel van de maatregel zolang geen bestemmingsplan of beheersverordening als bedoeld in het tweede lid in
      werking is getreden. Bij de algemene maatregel van bestuur kunnen regels worden gesteld met inachtneming waarvan
      bij een omgevingsvergunning kan worden afgeweken van bij die maatregel aan te geven krachtens dit lid gestelde
      regels.

      4 Onze Minister of Onze Minister wie het aangaat in overeenstemming met Onze Minister, kan verklaren dat een
      algemene maatregel van bestuur wordt voorbereid. [Artikel 3.7, tweede, derde, vierde en zevende lid][ref3],
      zijn van overeenkomstige toepassing. In de verklaring kan Onze Minister of Onze Minister wie het aangaat
      in overeenstemming met Onze Minister bepalen dat Onze Minister, in voorkomend geval gezamenlijk met Onze
      Minister wie het aangaat, beslist op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onder a, b of g, van de Wet algemene bepalingen omgevingsrecht][ref4]. Het besluit
      vervalt bij de inwerkingtreding van de algemene maatregel van bestuur doch uiterlijk na negen maanden. Bij de
      vormgeving, inrichting en beschikbaarstelling van het voorbereidingsbesluit wordt overeenkomstige toepassing
      gegeven aan de krachtens [artikel 3.7, achtste lid][ref5], gestelde regels.

      5 De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp is overgelegd aan beide kamers der Staten-Generaal, in de Staatscourant en langs elektronische
      weg is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen een bij die bekendmaking te stellen
      termijn van ten minste vier weken schriftelijk of langs elektronische weg opmerkingen over het ontwerp ter kennis
      van Onze Minister te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4.1
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.7
