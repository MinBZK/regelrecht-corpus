        artikel: '8.5'
        hoofdstuk: '8'
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 8:36
  - number: '9.1'
    text: |-
      1 Er is in elke provincie een provinciale planologische commissie ten behoeve van het overleg over en de
      coördinatie van zaken betreffende provinciaal ruimtelijk beleid.

      2 Bij provinciale verordening worden regels gesteld omtrent de benoeming, samenstelling, taak en werkwijze van
      de commissie.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld terzake van de verordening, bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel9.1
  - number: '10.1'
    text: |-
      1 Burgemeester en wethouders en Onze Minister maken jaarlijks hun voornemens bekend met betrekking tot de wijze
      waarop in het komende jaar uitvoering zal worden gegeven aan de bestuursrechtelijke handhaving van het bepaalde bij
      of krachtens deze wet.

      2 Burgemeester en wethouders en Onze Minister doen jaarlijks verslag aan de gemeenteraad
      onderscheidenlijk de Staten-Generaal van de wijze waarop in het voorafgaande jaar uitvoering is
      gegeven aan de bestuursrechtelijke handhaving van het bepaalde bij of krachtens deze wet, alsmede
      van het door hen gevoerde beleid bij de uitvoering van de [hoofdstukken 3][ref1], [3a][ref2]
      en [4][ref3] alsmede de verlening van omgevingsvergunningen voor activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder a, b, c en g, van de Wet algemene bepalingen omgevingsrecht][ref4]. Gedeputeerde
      staten doen jaarlijks verslag aan provinciale staten van het door hen gevoerde beleid bij de uitvoering van
      de laatstgenoemde hoofdstukken. Burgemeester en wethouders en gedeputeerde staten zenden gelijktijdig met de
      aanbieding van het verslag aan de gemeenteraad, onderscheidenlijk provinciale staten een afschrift ervan aan de
      inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3A
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.1
