  - number: '6.6'
    text: |-
      1 Indien provinciale staten met toepassing van [artikel 3.26, eerste lid][ref1], een inpassingsplan vaststellen, of
      gedeputeerde staten een omgevingsvergunning verlenen voor een project van provinciaal belang waarbij met toepassing
      van [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, treden gedeputeerde staten voor de toepassing van de bij
      of krachtens deze afdeling gestelde regels in de plaats van burgemeester en wethouders.

      2 Indien Onze Minister met toepassing van [artikel 3.28, eerste lid][ref3], een inpassingsplan vaststelt,
      of een omgevingsvergunning verleent voor een project van nationaal belang waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref4] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, treedt hij voor de toepassing van de bij of krachtens
      deze afdeling gestelde regels in de plaats van burgemeester en wethouders.

      3 Indien Onze Minister gezamenlijk met Onze aangewezen Minister een besluit als bedoeld in het tweede lid neemt,
      treedt Onze aangewezen Minister voor de toepassing van de bij of krachtens deze afdeling gestelde regels in de
      plaats van burgemeester en wethouders.

      4 Bij toepassing van dit artikel wordt de aanvraag voor een tegemoetkoming in de schade ingediend bij burgemeester
      en wethouders. Deze dragen ervoor zorg dat de aanvraag onverwijld wordt doorgezonden naar het desbetreffende
      bestuursorgaan dat op de aanvraag beslist. Het recht, genoemd in [artikel 6.4][ref5], wordt geïnd door het
      beslissend bestuursorgaan; de gemeentelijke verordening, bedoeld in [artikel 6.4, derde lid][ref6], is hierop niet
      van toepassing.

      5 Dit artikel is van overeenkomstige toepassing op tegemoetkoming in schade ten gevolge van een oorzaak als bedoeld
      in [artikel 6.1, tweede lid, onder e][ref7].


