  - number: '10.2'
    text: |-
      1 Onderstaande personen, niet zijnde toezichthouders, hebben in de hierna genoemde gebieden toegang tot alle
      terreinen en gebouwen, niet zijnde woningen, voor zover dat redelijkerwijs voor de uitvoering van deze wet nodig
      is:

      a. in het gehele land: de door Onze Minister aan te wijzen personen;

      b. in een provincie: de door de Commissaris van de Koning aan te wijzen personen;

      c. in een gemeente: de burgemeester en de door hem aan te wijzen personen.

      2 Bij algemene maatregel van bestuur kan worden voorgeschreven dat ten aanzien van bepaalde terreinen of gebouwen
      de in het eerste lid bedoelde bevoegdheid slechts wordt uitgeoefend door bepaalde van de in het eerste lid genoemde
      personen.

      3 De in het eerste lid bedoelde personen verschaffen zich zo nodig toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.2
  - number: '10.3'
    text: |-
      1 Ten aanzien van gronden die geen deel uitmaken van het grondgebied van een gemeente of een provincie kan, voor
      zover zulks bij algemene maatregel van bestuur, op voordracht van Onze Minister gezamenlijk met Onze Minister van
      Verkeer en Waterstaat, is bepaald, een rijksbestemmingsplan worden vastgesteld.

      2 Op het rijksbestemmingsplan, bedoeld in het eerste lid, zijn van [hoofdstuk 3][ref1] de [afdelingen 3.1][ref2],
      [3.2][ref3], met uitzondering van [artikel 3.8, vierde en zesde lid][ref4], [afdeling 3.3][ref5] en
      [§ 3.6.1][ref6] en [afdeling 3.7][ref7] waar mogelijk van overeenkomstige toepassing, met dien verstande dat Onze
      Minister in de plaats treedt van de gemeenteraad en van burgemeester en wethouders.

      3 Bij de maatregel, bedoeld in het eerste lid, kunnen regels worden gesteld ten aanzien van de bestuursorganen
      die de in deze wet vervatte bevoegdheden uitoefenen en ten aanzien van de bij die uitvoering te betrekken
      bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
