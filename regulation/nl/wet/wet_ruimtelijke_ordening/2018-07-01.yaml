  - number: '6.12'
    text: |-
      1 De gemeenteraad stelt een exploitatieplan vast voor gronden waarop een bij algemene maatregel van bestuur
      aangewezen bouwplan is voorgenomen.

      2 In afwijking van het eerste lid kan de gemeenteraad bij een besluit tot vaststelling
      van een bestemmingsplan, een wijziging als bedoeld in [artikel 3.6, eerste lid][ref1],
      of naar aanleiding van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan of de beheersverordening wordt afgeweken besluiten geen exploitatieplan vast te stellen, in bij
      algemene maatregel van bestuur aangegeven gevallen of indien:

      a. het verhaal van kosten van de grondexploitatie over de in het plan of de vergunning begrepen gronden anderszins
      verzekerd is;

      b. het bepalen van een tijdvak of fasering als bedoeld in
      [artikel 6.13, eerste lid, onder c, 4°, onderscheidenlijk 5°][ref3], niet noodzakelijk is, en

      c. het stellen van eisen, regels, of een uitwerking van regels als bedoeld in
      [artikel 6.13, tweede lid, onderscheidenlijk b, c of d][ref4], niet noodzakelijk is.

      3 Met betrekking tot een omgevingsvergunning als bedoeld in het tweede lid alsmede bij een besluit tot vaststelling
      van een bestemmingsplan als bedoeld in [artikel 3.6, eerste lid, onder a][ref5], kan de gemeenteraad de
      bevoegdheden, bedoeld in het eerste en tweede lid, delegeren aan burgemeester en wethouders.

      4 Een exploitatieplan wordt gelijktijdig bekendgemaakt met het bestemmingsplan of de wijziging, bedoeld in
      [artikel 3.6, eerste lid][ref6], waarop het betrekking heeft. Een beslissing omtrent een exploitatieplan die
      betrekking heeft op een omgevingsvergunning wordt tegelijk met die vergunning bekendgemaakt.

      5 De gemeenteraad kan in samenwerking met de raden van aangrenzende gemeenten een intergemeentelijk exploitatieplan
      vaststellen. Burgemeester en wethouders van deze gemeenten leggen het vastgestelde plan gelijktijdig ter inzage.
      In afwijking van [artikel 3.8, derde lid][ref7], vangt de in dat lid genoemde termijn aan na vaststelling van het
      exploitatieplan door alle betrokken gemeenteraden.


