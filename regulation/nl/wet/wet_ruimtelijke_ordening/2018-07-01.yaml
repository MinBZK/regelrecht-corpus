  - number: '4.2'
    text: |-
      1 Indien provinciale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kunnen
      gedeputeerde staten aan de gemeenteraad een aanwijzing geven om binnen een daarbij te bepalen termijn een
      bestemmingsplan vast te stellen overeenkomstig daarbij gegeven voorschriften omtrent de inhoud van dat
      bestemmingsplan.

      2 Er wordt niet overgegaan tot toepassing van het eerste lid dan na overleg met burgemeester en wethouders en
      niet eerder dan vier weken nadat provinciale staten in kennis zijn gesteld van het voornemen tot het nemen van
      het besluit.

      3 Bij het toepassen van het eerste lid kunnen gedeputeerde staten tevens verklaren dat een bestemmingsplan als
      bedoeld in het eerste lid door de gemeente wordt voorbereid. [Artikel 3.7][ref1] is van overeenkomstige toepassing.
      Een door gedeputeerde staten vastgesteld voorbereidingsbesluit wordt gelijkgesteld met een door de gemeenteraad
      vastgesteld voorbereidingsbesluit.

      4 Op de voorbereiding van een besluit tot aanwijzing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing. De kennisgeving van het ontwerp-besluit en
      van het besluit tot aanwijzing geschiedt tevens langs elektronische weg.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven over de vormgeving, inrichting en
      beschikbaarstelling van de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel4.2
