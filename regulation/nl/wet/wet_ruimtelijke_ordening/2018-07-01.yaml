  - number: '10.4'
    text: |-
      1 Bij koninklijk besluit op voordracht van Onze Minister en Onze Minister wie het mede aangaat, kan worden bepaald
      dat deze wet niet van toepassing is op een bij dat besluit aan te wijzen werk of werkzaamheid ten behoeve van de
      landsverdediging.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de vormgeving van elektronisch
      beschikbaar gestelde informatie over het besluit.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.4
  - number: '10.5'
    text: |-
      Alle stukken opgemaakt ter verkrijging van de beschikking door de gemeente, de provincie en het Rijk over
      onroerende zaken teneinde uitvoering te kunnen geven aan een bestemmingsplan, zijn vrij van kosten van legalisatie
      en griffiekosten.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.5
  - number: '10.6'
    text: |-
      De kosten van de gemeente of de provincie, voortvloeiende uit de medewerking aan de uitvoering van
      deze wet, zijn uitgaven als bedoeld in [artikel 193 van de Gemeentewet][ref1] onderscheidenlijk
      [artikel 197 van de Provinciewet][ref2]. [Artikel 194 van de Gemeentewet][ref3] onderscheidenlijk
      [artikel 198 van de Provinciewet][ref4] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel194
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel198
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '193'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '194'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '198'
  - number: '10.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met het oog op de nakoming van
      voor Nederland verbindende internationale verplichtingen die betrekking hebben op of samenhangen met onderwerpen
      waarin bij of krachtens deze wet is voorzien.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.7
  - number: '10.8'
    text: |-
      1 Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.

      2 De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp is overgelegd aan beide kamers der Staten-Generaal, in de Staatscourant en langs elektronische
      weg is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen een bij die bekendmaking te stellen
      termijn van ten minste vier weken schriftelijk opmerkingen over het ontwerp ter kennis van Onze Minister te
      brengen.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.8
  - number: '10.9'
    text: |-
      Een in deze wet voorziene algemene maatregel van bestuur wordt, nadat zij is vastgesteld, toegezonden aan beide
      kamers der Staten-Generaal. Zij treedt niet eerder in werking dan met ingang van de eerste dag van de tweede
      kalendermaand na de dagtekening van het Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.9
  - number: '10.10'
    text: |-
      Onze Minister zendt binnen vijf jaar na het tijdstip van inwerkingtreding van deze wet, en vervolgens telkens na
      vijf jaar, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.10
  - number: '10.11'
    text: |-
      Voor de plaatsing van deze wet in het Staatsblad stelt Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer de nummering en lettering van de afdelingen, paragrafen, artikelen en onderdelen van artikelen
      van deze wet opnieuw vast en brengt hij de in deze wet voorkomende aanhalingen daarvan met de nieuwe nummering en
      lettering in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.11
  - number: '10.12'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.12
  - number: '10.13'
    text: 'Deze wet wordt aangehaald als: Wet ruimtelijke ordening.'
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel10.13
