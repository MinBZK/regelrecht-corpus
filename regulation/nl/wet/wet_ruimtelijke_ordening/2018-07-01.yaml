  - number: '6.19'
    text: |-
      De per omgevingsvergunning verschuldigde exploitatiebijdrage, bedoeld in [artikel 6.17, eerste lid][ref1], wordt
      berekend door het aantal gewogen eenheden en gedeeltes van eenheden, dat in het exploitatieplan is toegedeeld aan
      de in de vergunningaanvraag bedoelde gronden, dan wel indien dat tot een hoger aantal leidt, het aantal gewogen
      eenheden dat is opgenomen in de vergunningaanvraag, te vermenigvuldigen met het verhaalbare bedrag per gewogen
      eenheid en dit bedrag te verminderen met:

      a. de inbrengwaarde van de in de vergunningaanvraag bedoelde gronden, geraamd overeenkomstig de
      [artikelen 40b tot en met 40f van de onteigeningswet][ref2] voor zover deze niet volgens het exploitatieplan buiten
      het kostenverhaal blijven;

      b. de kosten die in verband met de exploitatie van de betreffende gronden door de aanvrager zijn gemaakt, welke
      kosten voor de berekening van het te verhalen bedrag niet hoger kunnen zijn dan de raming van die kosten in het
      exploitatieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel40b
