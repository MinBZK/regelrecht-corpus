    text: |-
      1 [Artikel 3.8][ref1] is niet van toepassing op de afwijzing van een aanvraag om een bestemmingsplan vast te
      stellen.

      2 Tot een afwijzing als bedoeld in het eerste lid besluit de gemeenteraad zo spoedig mogelijk doch in elk geval
      binnen acht weken na ontvangst van de aanvraag.


