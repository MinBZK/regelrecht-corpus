  - number: '8.3'
    text: |-
      1 Voor de mogelijkheid van beroep worden als één besluit aangemerkt:

      a. indien toepassing is gegeven aan [artikel 3.30, eerste lid, onder a][ref1], [3.33, eerste lid, onder a][ref2],
      of [3.35, eerste lid, onder b][ref3], de daarbedoelde besluiten;

      b. indien toepassing is gegeven aan [artikel 3.30, eerste lid, onder b][ref4], [3.33, eerste lid, onder b][ref5],
      of [3.35, eerste lid, onder c][ref6], het besluit omtrent vaststelling van het daarbedoelde bestemmingsplan of
      inpassingsplan, wijzigings- of uitwerkingsplan dan wel de omgevingsvergunning en de daarbedoelde besluiten,

      voor zover deze besluiten met toepassing van [artikel 3.32][ref7] gelijktijdig bekend zijn gemaakt.

      2 De bevoegde rechter beslist op een beroep als bedoeld in het eerste lid binnen zes maanden na ontvangst van het
      verweerschrift.

      3 Voor de mogelijkheid van beroep en de behandeling van en uitspraak op een beroep worden als
      één besluit aangemerkt de gelijktijdig bekendgemaakte besluiten omtrent vaststelling van een
      exploitatieplan en de vaststelling van een bestemmingsplan, een wijziging of uitwerking van
      een bestemmingsplan of de verlening van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref8] van het
      bestemmingsplan of de beheersverordening wordt afgeweken.

      4 Voor de mogelijkheid van beroep en de behandeling van en de uitspraak op een beroep worden de ontheffing,
      bedoeld in [artikel 4.1a][ref9] of [4.3a][ref10], en het besluit tot vaststelling van het bestemmingsplan of het
      provinciaal inpassingsplan ten behoeve waarvan die ontheffing is verleend, als één besluit, vastgesteld door de
      gemeenteraad onderscheidenlijk provinciale staten, aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.30
