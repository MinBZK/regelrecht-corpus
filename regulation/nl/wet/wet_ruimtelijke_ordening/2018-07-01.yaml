  - number: 3.36a
    text: |-
      1 Gevallen waarop krachtens de [artikelen 3.30][ref1], [3.33][ref2] of [3.35][ref3] de [artikelen 3.31][ref4]
      en [3.32][ref5] dan wel de [artikelen 3.31][ref6] en [3.32][ref7] in samenhang met [artikel 3.8][ref8] of
      [paragraaf 3.3 van de Wet algemene bepalingen omgevingsrecht][ref9] worden toegepast, worden voor de toepassing van
      de [Belemmeringenwet Privaatrecht][ref10] aangemerkt als bevattende openbare werken van algemeen nut.

      2 Indien voor de uitvoering van een of meer besluiten als bedoeld in [artikel 3.35, eerste lid, onder b][ref11],
      toepassing van de [Belemmeringenwet Privaatrecht][ref12] noodzakelijk is:

      a. kan Onze Minister in afwijking van [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref13]:

      1e. een andere plaats of gemeente aanwijzen waar de zitting plaats vindt;

      2e. bepalen dat de zitting wordt geleid door een door Onze Minister van Verkeer en Waterstaat aan te wijzen
      persoon;

      b. worden in afwijking van de artikelen 2, zevende lid, en [3, derde lid][ref14], juncto
      [2, zevende lid, van de Belemmeringenwet Privaatrecht][ref15] gedeputeerde staten niet gehoord.

      3 Indien voor de uitvoering van een of meer besluiten als bedoeld in [artikel 3.30, eerste lid, onder a][ref16],
      [3.33, eerste lid, onder a][ref17], of [3.35, eerste lid, onder b][ref18], toepassing
      van de [Belemmeringenwet Privaatrecht][ref19] noodzakelijk is, wordt, in afwijking van
      [artikel 4 van die wet][ref20], de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref21], of
      [artikel 3, tweede lid, van die wet][ref22] opgeschort totdat de termijn voor het indienen van een beroepschrift
      is verstreken.


