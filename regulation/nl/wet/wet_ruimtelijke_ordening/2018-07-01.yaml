  - number: '3.39'
    text: |-
      1 Op het tijdstip van inwerkingtreding van een beheersverordening voor een gebied waarvoor een bestemmingsplan
      geldt, vervalt het bestemmingsplan voor zover het op dat gebied betrekking heeft.

      2 Op het tijdstip van inwerkingtreding van een bestemmingsplan voor een gebied waarvoor een beheersverordening
      geldt, vervalt de beheersverordening voor zover zij op dat gebied betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel3.39
  - number: '4.1'
    text: |-
      1 Indien provinciale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk
      maken, kunnen bij of krachtens provinciale verordening regels worden gesteld omtrent
      de inhoud van bestemmingsplannen, van omgevingsvergunningen waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      van het bestemmingsplan of de beheersverordening wordt afgeweken, omtrent de daarbij behorende toelichting of
      onderbouwing, alsmede omtrent de inhoud van beheersverordeningen. Daarbij kan worden bepaald dat een regel slechts
      geldt voor een daarbij aangegeven gedeelte van het grondgebied van de provincie. De kennisgeving van een besluit
      tot vaststelling van de verordening geschiedt tevens langs elektronische weg.

      2 Tenzij bij de verordening een andere termijn wordt gesteld, stelt de gemeenteraad binnen een jaar na
      inwerkingtreding van de verordening een bestemmingsplan of een beheersverordening vast met inachtneming van de
      verordening.

      3 Bij of krachtens een verordening als bedoeld in het eerste lid kunnen regels worden gesteld die noodzakelijk zijn
      om te voorkomen dat in de verordening begrepen gronden of bouwwerken minder geschikt worden voor de verwezenlijking
      van het doel van de verordening zolang geen bestemmingsplan of beheersverordening als bedoeld in het tweede
      lid in werking is getreden. Bij de verordening kunnen regels worden gesteld met inachtneming waarvan bij een
      omgevingsvergunning kan worden afgeweken van bij die verordening aan te geven krachtens dit lid gestelde regels.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud, vormgeving,
      inrichting en beschikbaarstelling van de provinciale verordening.

      5 Provinciale staten kunnen verklaren dat een verordening wordt voorbereid.
      [Artikel 3.7, tweede, derde, vierde, zevende en achtste lid][ref2], zijn van overeenkomstige
      toepassing. In de verklaring kunnen provinciale staten bepalen dat gedeputeerde staten
      beslissen op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, b of g, van de Wet algemene bepalingen omgevingsrecht][ref3]. Het besluit
      vervalt bij de inwerkingtreding van de verordening doch uiterlijk na zes maanden.

      6 Een provinciale verordening als bedoeld in dit artikel wordt niet vastgesteld dan nadat het ontwerp in de
      Staatscourant, langs elektronische weg en op de in de provincie gebruikelijke wijze is bekendgemaakt en aan een
      ieder de gelegenheid is geboden om binnen een bij die bekendmaking te stellen termijn van ten minste vier weken
      schriftelijk of langs elektronische weg opmerkingen over het ontwerp ter kennis van provinciale staten te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.7
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
