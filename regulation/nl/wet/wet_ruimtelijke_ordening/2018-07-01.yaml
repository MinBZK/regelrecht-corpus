  - number: '3.8'
    text: |-
      1 Op de voorbereiding van een bestemmingsplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing, met dien verstande dat:

      a. de kennisgeving, bedoeld in [artikel 3:12 van die wet][ref2], tevens in de Staatscourant wordt geplaatst en
      voorts langs elektronische weg geschiedt, en het ontwerp-besluit met de hierbij behorende stukken tevens langs
      elektronische weg wordt beschikbaar gesteld;

      b. de kennisgeving, bedoeld in het eerste lid, onder a, gelijktijdig met de daar bedoelde plaatsing langs
      elektronische weg wordt toegezonden aan die diensten van Rijk en provincie die belast zijn met de behartiging van
      belangen die in het plan in het geding zijn, aan de betrokken waterschapsbesturen en aan de besturen van bij het
      plan een belang hebbende gemeenten;

      c. indien in het ontwerp gronden zijn aangewezen waarvan de bestemming in de naaste toekomst voor verwezenlijking
      in aanmerking komt, kennisgeving tevens geschiedt aan diegenen die in de basisregistratie kadaster staan vermeld
      als eigenaar van die gronden of als beperkt gerechtigde op die gronden;

      d. door een ieder zienswijzen omtrent het ontwerp bij de gemeenteraad naar voren kunnen worden gebracht;

      e. de gemeenteraad binnen twaalf weken na de termijn van terinzageligging beslist omtrent vaststelling van het
      bestemmingsplan.

      2 Voor zover het ontwerp van een bestemmingsplan zijn grondslag vindt in een aanwijzing, die betrekking heeft
      op een daarbij concreet aangegeven locatie, waarvan geen afwijking mogelijk is, kunnen zienswijzen daarop geen
      betrekking hebben.

      3 De bekendmaking van het besluit tot vaststelling van het bestemmingsplan geschiedt binnen twee weken na de
      vaststelling. Burgemeester en wethouders plaatsen de kennisgeving van het besluit tot vaststelling van het
      bestemmingsplan tevens in de Staatscourant en voorts geschiedt deze langs elektronische weg. Gelijktijdig verzenden
      zij de kennisgeving, bedoeld in de vorige volzin, langs elektronische weg aan de diensten en bestuursorganen
      bedoeld in het eerste lid, onder b, en stellen zij het besluit met de hierbij behorende stukken langs elektronische
      weg beschikbaar. In afwijking van [artikel 3:1, eerste lid, onder b, van de Algemene wet bestuursrecht][ref3] zijn
      op een besluit tot vaststelling van het bestemmingsplan de [artikelen 3:40][ref4], [3:42][ref5], [3:43][ref6],
      [3:44][ref7] en [3:45][ref8] en [afdeling 3.7 van die wet][ref9] van toepassing.

      4 In afwijking van het derde lid wordt het besluit tot vaststelling van het bestemmingsplan zes weken na de
      vaststelling bekendgemaakt, indien door gedeputeerde staten, Onze Minister of Onze Minister wie het aangaat een
      zienswijze is ingediend en deze niet volledig is overgenomen of indien de gemeenteraad bij de vaststelling van
      het bestemmingsplan daarin wijzigingen heeft aangebracht ten opzichte van het ontwerp, anders dan op grond van
      zienswijzen van gedeputeerde staten, Onze Minister of Onze Minister wie het aangaat. In zodanig geval zenden
      burgemeester en wethouders na de vaststelling onverwijld langs elektronische weg het raadsbesluit aan gedeputeerde
      staten onderscheidenlijk Onze Minister of Onze Minister wie het aangaat.

      5 Het besluit tot vaststelling van het bestemmingsplan treedt in werking met ingang van de dag na die waarop de
      beroepstermijn afloopt, behoudens voor zover het zesde lid van toepassing is.

      6 Indien aan de in het vierde lid bedoelde voorwaarden is voldaan kunnen gedeputeerde staten
      onderscheidenlijk Onze Minister, onverminderd andere aan hen toekomende bevoegdheden, binnen de in dat
      lid genoemde termijn met betrekking tot het desbetreffende onderdeel van het vastgestelde bestemmingsplan
      aan de gemeenteraad een aanwijzing als bedoeld in [artikel 4.2, eerste lid][ref10], onderscheidenlijk
      [artikel 4.4, eerste lid, onder a][ref11], geven, ertoe strekkende dat dat onderdeel geen deel blijft uitmaken van
      het bestemmingsplan zoals het is vastgesteld. [Artikel 4.2, tweede tot en met vierde lid][ref12], onderscheidenlijk
      [artikel 4.4, tweede tot en met vierde lid][ref13], zijn op deze aanwijzing niet van toepassing. De kennisgeving
      van het besluit tot aanwijzing geschiedt tevens langs elektronische weg. Gedeputeerde staten onderscheidenlijk
      Onze Minister vermelden in de redengeving de aan het besluit ten grondslag liggende feiten, omstandigheden en
      overwegingen die de provincie onderscheidenlijk het Rijk beletten het betrokken provinciaal onderscheidenlijk
      nationaal belang met inzet van andere aan hen toekomende bevoegdheden te beschermen. Het besluit tot vaststelling
      van het bestemmingsplan wordt alsdan met uitsluiting van dat onderdeel, samen met het aanwijzingsbesluit en op
      gelijke wijze door burgemeester en wethouders bekendgemaakt. De in het vierde lid genoemde termijn wordt hiertoe
      met een week verlengd. De termijn voor indiening van een beroepschrift tegen het aanwijzingsbesluit vangt aan met
      ingang van de dag na die waarop dit besluit ter inzage is gelegd. Zodra het aanwijzingsbesluit onherroepelijk is
      geworden vervalt het vaststellingsbesluit voor dat onderdeel.

      7 Van het aanwijzingsbesluit, bedoeld in het zesde lid, wordt mededeling gedaan aan diegenen die ten aanzien van
      het onderdeel van het bestemmingsplan dat bij dat aanwijzingsbesluit is betrokken een zienswijze naar voren hebben
      gebracht of een aanvraag tot vaststelling hebben ingediend.


