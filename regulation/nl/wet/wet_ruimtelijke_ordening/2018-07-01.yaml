  - number: '6.3'
    text: |-
      Met betrekking tot de voor tegemoetkoming in aanmerking komende schade betrekken burgemeester en wethouders bij hun
      beslissing op de aanvraag in ieder geval:

      a. de voorzienbaarheid van de schadeoorzaak;

      b. de mogelijkheden van de aanvrager om de schade te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Van de indiener van de aanvraag heffen burgemeester en wethouders een recht.

      2 Burgemeester en wethouders wijzen de indiener van de aanvraag op de verschuldigdheid van het recht en delen
      hem mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van de mededeling dient te zijn
      bijgeschreven op de rekening van de gemeente dan wel op de aangegeven plaats dient te zijn gestort. Indien het
      bedrag niet binnen deze termijn is bijgeschreven of gestort, verklaren zij de aanvraag niet-ontvankelijk, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.

      3 Het recht bedraagt € 300, welk bedrag bij verordening van de gemeenteraad met ten hoogste twee derde deel kan
      worden verhoogd of verlaagd.

      4 Indien op de aanvraag geheel of ten dele positief wordt beslist, storten burgemeester en wethouders aan de
      indiener het door hem betaalde recht terug.

      5 Het in het derde lid genoemde bedrag kan bij algemene maatregel van bestuur worden gewijzigd voor zover het
      prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0020449/2018-07-01#Artikel6.4
  - number: 6.4a
    text: |-
      1 Voor zover schade die op grond van de [artikelen 6.1 tot en met 6.3][ref1] voor tegemoetkoming in aanmerking zou
      komen, haar grondslag vindt in een besluit op een verzoek om ten behoeve van de verwezenlijking van een project
      bepalingen in een bestemmingsplan op te nemen of te wijzigen dan wel een omgevingsvergunning te verlenen voor een
      activiteit als bedoeld in [artikel 2.1, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref2],
      anders dan bedoeld in [artikel 6.8][ref3] of [6.9][ref4], kunnen burgemeester en wethouders met de verzoeker
      overeenkomen dat die schade geheel of gedeeltelijk voor zijn rekening komt.

      2 De verzoeker die een overeenkomst als bedoeld in het eerste lid heeft gesloten, is belanghebbende bij een besluit
      van burgemeester en wethouders op een aanvraag om tegemoetkoming op grond van [artikel 6.1][ref5] terzake van de
      vaststelling van het bestemmingsplan dan wel de verlening van de omgevingsvergunning waarom hij heeft verzocht.

      3 Degene die een financieel belang heeft bij de vaststelling van een exploitatiebijdrage, als bedoeld in
      [artikel 6.17, eerste lid][ref6], of de herberekening daarvan, is belanghebbende bij een besluit van burgemeester
      en wethouders op een aanvraag om tegemoetkoming op grond van [artikel 6.1][ref7] terzake van de vaststelling
      van het bestemmingsplan, de wijziging of de uitwerking, dan wel terzake van een omgevingsvergunning waarbij met
      toepassing van [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref8]
      van het bestemmingsplan of de beheersverordening wordt afgeweken indien de tegemoetkoming financiële gevolgen kan
      hebben voor de exploitatiebijdrage of de herberekening daarvan.


