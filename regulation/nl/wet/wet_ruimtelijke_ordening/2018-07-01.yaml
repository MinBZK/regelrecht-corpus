  - number: '3.10'
    text: |-
      Voor zover een ontwerp van een bestemmingsplan of de uitwerking van een bestemmingsplan als bedoeld in
      [artikel 3.6, eerste lid, aanhef en onder b][ref1], zijn grondslag vindt in een omgevingsvergunning, waarbij met
      toepassing van [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2]
      van het bestemmingsplan of de beheersverordening is afgeweken, kunnen zienswijzen geen betrekking hebben op dat
      deel van het ontwerpplan.


