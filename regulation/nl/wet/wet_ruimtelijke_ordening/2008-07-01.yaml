      projectbesluit gelijktijdig met een exploitatieplan is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.36b
