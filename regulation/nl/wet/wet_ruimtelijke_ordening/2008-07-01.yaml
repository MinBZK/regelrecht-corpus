        artikel: '10'
        hoofdstuk: '10'
  - number: 6.1.3
    text: De aanvraag bevat een motivering, alsmede een onderbouwing van de hoogte van de gevraagde tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.1
  - number: 6.1.4
    text: |-
      Een aanvraag voor een tegemoetkoming in schade ten gevolge van een oorzaak als bedoeld in het tweede lid, onder a,
      b, c, d, f of g, moet worden ingediend binnen vijf jaar na het moment waarop de oorzaak, bedoeld in het eerste lid,
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.1
  - number: 6.1.5
    text: |-
      Een aanvraag voor een tegemoetkoming in schade ten gevolge van een aanhouding als bedoeld in het tweede lid, onder
      e, kan eerst, en moet worden ingediend binnen vijf jaar na terinzagelegging van het vastgestelde bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.1
  - number: 6.2.1
    text: Binnen het normale maatschappelijke risico vallende schade blijft voor rekening van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.2
  - number: 6.2.2
    text: 'In ieder geval blijft voor rekening van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.2
  - number: 6.2.2.a
    text: |-
      van schade in de vorm van een inkomensderving: een gedeelte gelijk aan twee procent van het inkomen onmiddellijk
      voor het ontstaan van de schade;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.2
  - number: 6.2.2.b
    text: |-
      van schade in de vorm van een vermindering van de waarde van een onroerende zaak: een gedeelte gelijk aan twee
      procent van de waarde van de onroerende zaak onmiddellijk voor het ontstaan van de schade, tenzij de vermindering
      het gevolg is:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.2
  - number: 6.2.2.b.1°
    text: van de bestemming van de tot de onroerende zaak behorende grond, of
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.2
  - number: 6.2.2.b.2°
    text: |-
      van op de onroerende zaak betrekking hebbende regels als bedoeld in [artikel 3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '6.3'
    text: |-
      Met betrekking tot de voor tegemoetkoming in aanmerking komende schade betrekken burgemeester en wethouders bij hun
      beslissing op de aanvraag in ieder geval:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.3
  - number: 6.3.a
    text: de voorzienbaarheid van de schadeoorzaak;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.3
  - number: 6.3.b
    text: de mogelijkheden van de aanvrager om de schade te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.3
  - number: 6.4.1
    text: Van de indiener van de aanvraag heffen burgemeester en wethouders een recht.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4
  - number: 6.4.2
    text: |-
      Burgemeester en wethouders wijzen de indiener van de aanvraag op de verschuldigdheid van het recht en delen
      hem mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van de mededeling dient te zijn
      bijgeschreven op de rekening van de gemeente dan wel op de aangegeven plaats dient te zijn gestort. Indien het
      bedrag niet binnen deze termijn is bijgeschreven of gestort, verklaren zij de aanvraag niet-ontvankelijk, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4
  - number: 6.4.3
    text: |-
      Het recht bedraagt € 300, welk bedrag bij verordening van de gemeenteraad met ten hoogste twee derde deel kan
      worden verhoogd of verlaagd.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4
  - number: 6.4.4
    text: |-
      Indien op de aanvraag geheel of ten dele positief wordt beslist, storten burgemeester en wethouders aan de indiener
      het door hem betaalde recht terug.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4
  - number: 6.4.5
    text: |-
      Het in het derde lid genoemde bedrag kan bij algemene maatregel van bestuur worden gewijzigd voor zover het
      prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4
  - number: 6.4a.1
    text: |-
      Voor zover schade die op grond van de [artikelen 6.1 tot en met 6.3][ref1] voor tegemoetkoming in aanmerking
      zou komen, haar grondslag vindt in een besluit op een verzoek om ten behoeve van de verwezenlijking van een
      project bepalingen in een bestemmingsplan, een daaraan voorafgaand projectbesluit of een besluit als bedoeld in
      [artikel 3.40, eerste lid][ref2], daaronder begrepen, op te nemen of te wijzigen dan wel om ontheffing te verlenen,
      anders dan bedoeld in [artikel 6.8][ref3] of [6.9][ref4], kunnen burgemeester en wethouders met de verzoeker
      overeenkomen dat die schade geheel of gedeeltelijk voor zijn rekening komt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.4a.2
    text: |-
      De verzoeker die een overeenkomst als bedoeld in het eerste lid heeft gesloten, is belanghebbende bij een
      besluit van burgemeester en wethouders op een aanvraag om tegemoetkoming op grond van [artikel 6.1][ref1] terzake
      van de vaststelling van het bestemmingsplan, van het nemen van het projectbesluit of het besluit, bedoeld in
      [artikel 3.40, eerste lid][ref2], dan wel van de verlening van de ontheffing waarom hij heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 6.4a.3
    text: |-
      Degene die een financieel belang heeft bij de vaststelling van een exploitatiebijdrage, als bedoeld in
      [artikel 6.17, eerste lid][ref1], of de herberekening daarvan, is belanghebbende bij een besluit van burgemeester
      en wethouders op een aanvraag om tegemoetkoming op grond van [artikel 6.1][ref2] terzake van de vaststelling van
      het bestemmingsplan, de wijziging of de uitwerking, dan wel van het nemen van het projectbesluit of een besluit
      als bedoeld in [artikel 3.40, eerste lid][ref3], indien de tegemoetkoming financiële gevolgen kan hebben voor de
      exploitatiebijdrage of de herberekening daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.4a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: '6.5'
    text: |-
      Indien burgemeester en wethouders een tegemoetkoming als bedoeld in [artikel 6.1][ref1] toekennen, vergoeden
      burgemeester en wethouders daarbij tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.5.a
    text: de redelijkerwijs gemaakte kosten van rechtsbijstand en andere deskundige bijstand;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.5
  - number: 6.5.b
    text: de wettelijke rente, te rekenen met ingang van de datum van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.5
  - number: 6.6.1
    text: |-
      Indien provinciale staten met toepassing van [artikel 3.26, eerste lid][ref1], een inpassingsplan vaststellen, of
      met toepassing van [artikel 3.27][ref2] een projectbesluit nemen of een besluit als bedoeld in [artikel 3.41][ref3]
      nemen, treden gedeputeerde staten voor de toepassing van de bij of krachtens deze afdeling gestelde regels in de
      plaats van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 6.6.2
    text: |-
      Indien Onze Minister met toepassing van [artikel 3.28, eerste lid][ref1], een inpassingsplan vaststelt, of met
      toepassing van [artikel 3.29][ref2], een projectbesluit neemt of een besluit als bedoeld in [artikel 3.42][ref3]
      neemt, treedt hij voor de toepassing van de bij of krachtens deze afdeling gestelde regels in de plaats van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 6.6.3
    text: |-
      Indien Onze Minister gezamenlijk met Onze aangewezen Minister met toepassing van [artikel 3.35][ref1] een
      inpassingsplan vaststelt, of een projectbesluit neemt, treedt Onze aangewezen Minister voor de toepassing van de
      bij of krachtens deze afdeling gestelde regels in de plaats van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.3
        afdeling: '3.6'
  - number: 6.6.4
    text: |-
      Bij toepassing van dit artikel wordt de aanvraag voor een tegemoetkoming in de schade ingediend bij burgemeester
      en wethouders. Deze dragen ervoor zorg dat de aanvraag onverwijld wordt doorgezonden naar het desbetreffende
      bestuursorgaan dat op de aanvraag beslist. Het recht, genoemd in [artikel 6.4][ref1], wordt geïnd door het
      beslissend bestuursorgaan; de gemeentelijke verordening, bedoeld in [artikel 6.4, derde lid][ref2], is hierop niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.6.5
    text: |-
      Dit artikel is van overeenkomstige toepassing op tegemoetkoming in schade ten gevolge van een oorzaak als bedoeld
      in [artikel 6.1, tweede lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: '6.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inrichting en behandeling,
      en nadere regels omtrent de indiening, de motivering en de wijze van beoordeling, van een aanvraag voor een
      tegemoetkoming in de schade. Die regels kunnen de verplichting voor de gemeenteraad en provinciale staten inhouden
      hieromtrent een verordening vast te stellen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.7
  - number: 6.8.1
    text: |-
      Indien ten behoeve van belangen, uitsluitend of mede behartigd door een ander openbaar lichaam dan de gemeente,
      op schriftelijk verzoek van dat openbare lichaam, dan wel krachtens wettelijk voorschrift bepalingen in een
      bestemmingsplan of inpassingsplan, een daaraan voorafgaand projectbesluit daaronder begrepen, zijn opgenomen die
      hogere kosten voor de gemeente ten gevolge kunnen hebben en over de verdeling van deze kosten geen overeenstemming
      is bereikt, kunnen gedeputeerde staten op schriftelijk verzoek van burgemeester en wethouders dat openbare lichaam
      verplichten om aan de gemeente een vergoeding toe te kennen, voor zover:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.8
  - number: 6.8.1.a
    text: de kosten redelijkerwijs niet voor rekening van de gemeente behoren te blijven,
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.8
  - number: 6.8.1.b
    text: de vergoeding niet voldoende anderszins is verzekerd en
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.8
  - number: 6.8.1.c
    text: de vergoeding niet krachtens wettelijk voorschrift is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.8
  - number: 6.8.2
    text: |-
      Het besluit op het verzoek van burgemeester en wethouders wordt genomen nadat het bestemmingsplan of
      inpassingsplan, een daaraan voorafgaand projectbesluit daaronder begrepen, in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.8
  - number: 6.8.3
    text: |-
      In afwijking van het eerste lid wordt het besluit op het verzoek genomen door Onze Minister dan wel door Onze
      Minister en Onze Minister wie het mede aangaat, indien het andere openbare lichaam het Rijk is.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.8
  - number: '6.9'
    text: |-
      [Artikel 6.8][ref1] is van overeenkomstige toepassing indien ten behoeve van belangen, uitsluitend of mede
      behartigd door een ander openbaar lichaam dan de gemeente, op schriftelijk verzoek van dat openbare lichaam
      ontheffing is verleend als bedoeld in [artikel 3.22][ref2], dan wel is besloten tot aanhouding van de verlening
      van een bouw- of aanlegvergunning ingevolge [artikel 50, eerste lid, van de Woningwet][ref3] dan wel ingevolge
      [artikel 3.18, tweede lid][ref4], met dien verstande dat het verzoek om een kostenvergoeding slechts kan worden
      ingediend door burgemeester en wethouders. Het verzoek kan worden ingediend binnen vier weken nadat de ontheffing,
      dan wel het besluit tot aanhouding, onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 6.10.1
    text: |-
      Onze Minister of Onze Minister wie het aangaat, in overeenstemming met Onze Minister, kan ter uitvoering van het
      nationaal ruimtelijk beleid subsidies verstrekken ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.10
  - number: 6.10.1.a
    text: de ontwikkeling of vaststelling van ruimtelijke visies en plannen van provincies of gemeenten;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.10
  - number: 6.10.1.b
    text: |-
      de voorbereiding van projecten of activiteiten die voor de uitvoering van het nationaal ruimtelijk beleid van
      strategisch belang zijn;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.10
  - number: 6.10.1.c
    text: |-
      de verwezenlijking van projecten of activiteiten die voor de uitvoering van het nationaal ruimtelijk beleid van
      strategisch belang zijn.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.10
  - number: 6.10.2
    text: |-
      Onze Minister kan tevens subsidies verstrekken ten behoeve van bij een algemene maatregel van bestuur als bedoeld
      in [artikel 4.3][ref1] aangewezen activiteiten ter uitvoering van bij of krachtens die maatregel gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 6.11.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de wijze van verdeling van
      de subsidiegelden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.a
    text: |-
      de vaststelling van een subsidieplafond, het tijdvak waarvoor het subsidieplafond is vastgesteld, alsmede de wijze
      waarop dit bekend wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.b
    text: de subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.c
    text: de gevallen waarin subsidie wordt geweigerd;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.d
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.e
    text: de subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.f
    text: het intrekken of het ten nadele van de subsidie-ontvanger wijzigen van de subsidie zolang deze niet is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.g
    text: de betaling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.11.2.h
    text: het verlenen van voorschotten en de betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.11
  - number: 6.12.1
    text: |-
      De gemeenteraad stelt een exploitatieplan vast voor gronden waarop een bij algemene maatregel van bestuur
      aangewezen bouwplan is voorgenomen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
  - number: 6.12.2
    text: |-
      In afwijking van het eerste lid kan de gemeenteraad bij een besluit tot vaststelling van een bestemmingsplan,
      een wijziging als bedoeld in [artikel 3.6, eerste lid][ref1], een projectbesluit of een besluit als bedoeld in
      [artikel 3.40, eerste lid][ref2], besluiten geen exploitatieplan vast te stellen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 6.12.2.a
    text: |-
      het verhaal van kosten van de grondexploitatie over de in het plan of besluit begrepen gronden anderszins verzekerd
      is;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
  - number: 6.12.2.b
    text: |-
      het bepalen van een tijdvak of fasering als bedoeld in
      [artikel 6.13, eerste lid, onder c, 4°, onderscheidenlijk 5°][ref1], niet noodzakelijk is, en


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.12.2.c
    text: |-
      het stellen van eisen, regels, of een uitwerking van regels als bedoeld in
      [artikel 6.13, tweede lid, onderscheidenlijk b, c of d][ref1], niet noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.12.3
    text: |-
      De gemeenteraad kan de bevoegdheden, bedoeld in het eerste en tweede lid, bij een besluit tot vaststelling van een
      bestemmingsplan als bedoeld in [artikel 3.6, eerste lid, onder a][ref1], of bij een besluit bij een besluit als
      bedoeld in [artikel 3.10, vierde lid][ref2], delegeren aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 6.12.4
    text: |-
      Een exploitatieplan wordt gelijktijdig vastgesteld en bekendgemaakt met het bestemmingsplan, de wijziging, bedoeld
      in [artikel 3.6, eerste lid][ref1], het projectbesluit of het besluit, bedoeld in [artikel 3.40, eerste lid][ref2],
      waarop het betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 6.12.5
    text: |-
      De gemeenteraad kan in samenwerking met de raden van aangrenzende gemeenten een intergemeentelijk exploitatieplan
      vaststellen. Burgemeester en wethouders van deze gemeenten leggen het vastgestelde plan gelijktijdig ter inzage.
      In afwijking van [artikel 3.8, derde lid][ref1], vangt de in dat lid genoemde termijn aan na vaststelling van het
      exploitatieplan door alle betrokken gemeenteraden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 6.12.6
    text: |-
      Bij een exploitatieplan kan worden bepaald dat het verboden is bepaalde werken, geen bouwwerken zijnde,
      of werkzaamheden uit te voeren totdat voor de betreffende gronden een uitwerkingsplan als bedoeld in
      [artikel 3.6, eerste lid, onder b][ref1], in werking is getreden. Bij het exploitatieplan kan worden bepaald dat
      burgemeester en wethouders ontheffing kunnen verlenen van dit verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 6.13.1
    text: 'Een exploitatieplan bevat:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.a
    text: een kaart van het exploitatiegebied;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.b
    text: |-
      een omschrijving van de werken en werkzaamheden voor het bouwrijp maken van het exploitatiegebied, de aanleg van
      nutsvoorzieningen, en het inrichten van de openbare ruimte in het exploitatiegebied;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.c
    text: 'een exploitatieopzet, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.c.1°
    text: |-
      voor zover nodig een raming van de inbrengwaarden van de gronden, welke inbrengwaarden voor de toepassing van deze
      afdeling worden beschouwd als kosten in verband met de exploitatie van die gronden;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.c.2°
    text: |-
      een raming van de andere kosten in verband met de exploitatie, waaronder een raming van de schade die op grond van
      [artikel 6.1][ref1] voor vergoeding in aanmerking zou komen;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.13.1.c.3°
    text: een raming van de opbrengsten van de exploitatie, alsmede de peildatum van de onder 1 tot 3 bedoelde ramingen;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.c.4°
    text: een tijdvak waarbinnen de exploitatie van de gronden zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.c.5°
    text: |-
      voor zover nodig een fasering van de uitvoering van werken, werkzaamheden, maatregelen en bouwplannen, en zo nodig
      koppelingen hiertussen;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.1.c.6°
    text: de wijze van toerekening van de te verhalen kosten aan de uit te geven gronden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.2
    text: 'Een exploitatieplan kan bevatten:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.2.a
    text: een kaart waarop het voorgenomen grondgebruik is aangegeven en de gronden welke de gemeente beoogt te verwerven;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.2.b
    text: |-
      eisen voor de werken en werkzaamheden voor het bouwrijp maken van het exploitatiegebied, de aanleg van
      nutsvoorzieningen, en het inrichten van de openbare ruimte in het exploitatiegebied;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.2.c
    text: regels omtrent het uitvoeren van de onder b bedoelde werken en werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.2.d
    text: |-
      een uitwerking van de in de [artikelen 3.1, eerste lid][ref1], en [3.10, derde lid][ref2], bedoelde regels met
      betrekking tot de uitvoerbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 6.13.3
    text: |-
      Voor gronden, waarvoor nog een uitwerking als bedoeld in [artikel 3.6, eerste lid, onder b][ref1], moet worden
      vastgesteld, of waarvoor ingevolge de fasering geen bouwvergunning als bedoeld in [artikel 6.17, eerste lid][ref2],
      kan worden verleend, kunnen de onderdelen van een exploitatieplan, bedoeld in het eerste en tweede lid, een globale
      inhoud hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.13.4
    text: |-
      Voor de berekening van de kosten en opbrengsten wordt ervan uitgegaan dat het exploitatiegebied in zijn geheel in
      exploitatie zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.5
    text: |-
      Indien geen sprake is van onteigening wordt de inbrengwaarde van gronden vastgesteld met overeenkomstige toepassing
      van de [artikelen 40b tot en met 40f van de onteigeningswet][ref1]. Voor gronden welke onteigend zijn of waarvoor
      een onteigeningsbesluit is genomen, of welke op onteigeningsbasis zijn of worden verworven, is de inbrengwaarde
      gelijk aan de schadeloosstelling ingevolge de [onteigeningswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 40b
      - id: ref2
        bwb_id: BWBR0001842
  - number: 6.13.6
    text: |-
      Kosten in verband met werken, werkzaamheden en maatregelen waarvan het exploitatiegebied of een gedeelte daarvan
      profijt heeft, en welke toerekenbaar zijn aan het exploitatieplan worden naar evenredigheid opgenomen in de
      exploitatieopzet.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.7
    text: |-
      Bovenplanse kosten kunnen voor meerdere locaties of gedeeltes daarvan in de explotatieopzet worden opgenomen in
      de vorm van een fondsbijdrage, indien er voor deze locaties of gedeeltes daarvan een structuurvisie is vastgesteld
      welke aanwijzingen geeft over de bestedingen die ten laste van het fonds kunnen komen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de exploitatieopzet en de daarin
      op te nemen opbrengsten, en de verhaalbare kostensoorten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de beschikbaarstelling van het
      exploitatieplan en nadere regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.9.a
    text: de kaarten, eisen en regels, bedoeld in het eerste en tweede lid;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.9.b
    text: de manier van opstellen en de berekeningsmethode van de exploitatieopzet, en
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.9.c
    text: kosten, welke deel uitmaken van de exploitatieopzet.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.13.10
    text: |-
      De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat het ontwerp is overgelegd aan beide kamers der Staten-Generaal, in de Staatscourant en langs
      elektronische weg is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen een bij die bekendmaking
      te stellen termijn van ten minste vier weken schriftelijk opmerkingen over het ontwerp ter kennis van Onze Minister
      te brengen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.13
  - number: 6.14.1
    text: |-
      Op de voorbereiding van een exploitatieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing, met dien verstande dat de kennisgeving tevens geschiedt aan degenen die in de kadastrale registratie
      staan vermeld als eigenaar van gronden in het exploitatiegebied en voorts langs elektronische weg wordt verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 6.14.2
    text: |-
      Burgemeester en wethouders delen binnen vier weken nadat een exploitatieplan is vastgesteld, de eigenaren van
      de gronden in het exploitatiegebied schriftelijk mede dat een exploitatieplan is vastgesteld. Zij doen tevens
      mededeling van de terinzagelegging en de termijn waarbinnen beroep kan worden ingesteld en verzenden deze
      mededeling voorts langs elektronische weg
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.14
  - number: 6.15.1
    text: |-
      Een exploitatieplan wordt na inwerkingtreding ten minste eenmaal per jaar herzien totdat de in dat exploitatieplan
      voorziene werken, werkzaamheden en bouwwerken zijn gerealiseerd. Indien tegen een exploitatieplan beroep is
      ingesteld, vangt de termijn aan op de dag nadat een beslissing omtrent het exploitatieplan onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.15
  - number: 6.15.2
    text: |-
      Een uitwerkingsplan als bedoeld in [artikel 3.6, eerste lid, onder b][ref1], dat gronden bevat waarvoor in het
      exploitatieplan een globale omschrijving is vastgesteld, treedt niet in werking voordat een herziening van het
      exploitatieplan met betrekking tot de desbetreffende gronden is vastgesteld en bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 6.15.3
    text: |-
      Bij een herziening van een exploitatieplan is [artikel 6.14, eerste lid][ref1], niet van toepassing en kan de
      mededeling, bedoeld in [artikel 6.14, tweede lid][ref2], achterwege blijven voor zover de herziening uitsluitend
      betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.15.3.a
    text: een uitwerking en detaillering van de ramingen van kosten en opbrengsten;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.15
  - number: 6.15.3.b
    text: een aanpassing van deze ramingen met inachtneming van de in het exploitatieplan aangegeven methoden van indexering;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.15
  - number: 6.15.3.c
    text: een vervanging van de ramingen van de kosten door gerealiseerde kosten, of
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.15
  - number: 6.15.3.d
    text: andere niet-structurele onderdelen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.15
  - number: '6.16'
    text: |-
      Indien in een exploitatieplan het bedrag van de aan de exploitatie verbonden kosten, verminderd met de door de
      gemeente in verband met die exploitatie ontvangen of te ontvangen subsidies en bijdragen van derden, hoger is dan
      het in het exploitatieplan opgenomen bedrag van de opbrengsten van die exploitatie, kan de gemeente die kosten
      slechts verhalen tot maximaal het bedrag van die opbrengsten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Burgemeester en wethouders verhalen de kosten, verbonden aan exploitatie van de gronden gelegen in een
      exploitatiegebied, door aan een bouwvergunning voor een bouwplan dat krachtens [artikel 6.12, eerste lid][ref1],
      is aangewezen, met inachtneming van het exploitatieplan het voorschrift te verbinden dat de vergunninghouder een
      exploitatiebijdrage aan de gemeente verschuldigd is, tenzij de bijdrage anderszins verzekerd is of voorafgaand aan
      de indiening van de bouwaanvraag een exploitatiebijdrage met betrekking tot de betreffende gronden overeengekomen
      en verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.17.2
    text: |-
      Burgemeester en wethouders stellen bij de bouwvergunning een termijn waarbinnen de in het eerste lid bedoelde
      exploitatiebijdrage dient te worden betaald. Zij kunnen met betrekking tot deze bijdrage in de bouwvergunning een
      betalingsregeling opnemen, welke afhankelijk kan worden gesteld van de uitvoering van werken en bouwwerken, bedoeld
      in het exploitatieplan. Indien de betalingsregeling inhoudt dat gehele of gedeeltelijke betaling na de start van de
      bouw plaatsvindt, kunnen burgemeester en wethouders van de vergunninghouder aanvullende zekerheden met betrekking
      tot de betaling eisen. Hierover kunnen bij algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.17
  - number: 6.18.1
    text: |-
      Ten behoeve van het bepalen van de exploitatiebijdrage, bedoeld in [artikel 6.17, eerste lid][ref1], worden in het
      exploitatieplan uitgiftecategorieën vastgesteld. Zo nodig wordt daarbinnen een verder onderscheid aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.18.2
    text: |-
      Per onderscheiden categorie wordt een basiseenheid vastgesteld in een hoeveelheid vierkante meters
      grondoppervlakte, een hoeveelheid vierkante meters vloeroppervlakte, of een andere hiermee vergelijkbare maatstaf.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.18
  - number: 6.18.3
    text: |-
      Door elke basiseenheid te vermenigvuldigen met een per categorie vastgestelde gewichtsfactor worden gewogen
      eenheden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.18
  - number: 6.18.4
    text: De gewogen eenheden in het exploitatiegebied worden bij elkaar opgeteld.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.18
  - number: 6.18.5
    text: |-
      Het verhaalbare bedrag per gewogen eenheid is het ten hoogste verhaalbare bedrag, bedoeld in [artikel 6.16][ref1],
      gedeeld door het overeenkomstig het vierde lid berekende aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: '6.19'
    text: |-
      De per bouwvergunning verschuldigde exploitatiebijdrage, bedoeld in [artikel 6.17, eerste lid][ref1], wordt
      berekend door het aantal gewogen eenheden en gedeeltes van eenheden, dat in het exploitatieplan is toegedeeld aan
      de in de vergunningaanvraag bedoelde gronden, dan wel indien dat tot een hoger aantal leidt, het aantal gewogen
      eenheden dat is opgenomen in de vergunningaanvraag, te vermenigvuldigen met het verhaalbare bedrag per gewogen
      eenheid en dit bedrag te verminderen met:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.19.a
    text: |-
      de inbrengwaarde van de in de vergunningaanvraag bedoelde gronden, geraamd overeenkomstig de
      [artikelen 40b tot en met 40f van de onteigeningswet][ref1] voor zover deze niet volgens het exploitatieplan buiten
      het kostenverhaal blijven;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40b
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 40b
  - number: 6.19.b
    text: |-
      de kosten die in verband met de exploitatie van de betreffende gronden door de aanvrager zijn gemaakt, welke
      kosten voor de berekening van het te verhalen bedrag niet hoger kunnen zijn dan de raming van die kosten in het
      exploitatieplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.19
  - number: 6.20.1
    text: |-
      Binnen drie maanden na uitvoering van de in een exploitatieplan voorziene werken, werkzaamheden en maatregelen
      stellen burgemeester en wethouders een afrekening van dat exploitatieplan vast.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.20
  - number: 6.20.2
    text: |-
      Bij de afrekening worden de betaalde exploitatiebijdragen, bedoeld in [artikel 6.17, eerste lid][ref1], herberekend
      op grond van de totale kosten en het totale aantal gewogen eenheden in het exploitatiegebied. De basiseenheden en
      gewichtsfactoren, bedoeld in [artikel 6.18, tweede en derde lid][ref2], die zijn toegepast bij de berekening van
      een betaalde exploitatiebijdrage, worden ook toegepast bij de herberekening.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.20.3
    text: |-
      Indien een herberekende exploitatiebijdrage meer dan vijf procent lager is dan een betaalde exploitatiebijdrage,
      betaalt de gemeente binnen een maand na vaststelling van de afrekening het verschil, voor zover het groter is dan
      vijf procent, naar evenredigheid terug met rente aan degene die ten tijde van de betaling van de bijdrage, of een
      gedeelte daarvan, houder was van de desbetreffende bouwvergunning, of diens rechtsopvolger.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.20
  - number: 6.20.4
    text: |-
      Indien ten minste negentig procent van de in het exploitatieplan begrote kosten is gerealiseerd, wordt op verzoek
      van degene die ten tijde van betaling van een exploitatiebijdrage als bedoeld in [artikel 6.17, eerste lid][ref1],
      houder was van de desbetreffende bouwvergunning, of diens rechtsopvolger, met betrekking tot de desbetreffende
      exploitatiebijdrage een afrekening opgesteld en gevolg gegeven aan het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.20.5
    text: Tegen een besluit omtrent de afrekening en de herberekende exploitatiebijdrage kan beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.20
  - number: 6.21.1
    text: |-
      Burgemeester en wethouders kunnen terstond na het overschrijden van de termijn van betaling van een gedeelte of het
      geheel van de exploitatiebijdrage, bedoeld in [artikel 6.17, eerste lid][ref1], besluiten dat het bouwen niet kan
      aanvangen of moet worden gestaakt totdat aan de betalingsverplichtingen is voldaan. Zij stellen de termijn, bedoeld
      in [artikel 5:24 van de Algemene wet bestuursrecht][ref2], op ten hoogste vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6.21.2
    text: |-
      Burgemeester en wethouders kunnen na verloop van een maand na het verstrijken van een betalingstermijn bij
      dwangbevel het verschuldigde bedrag, bedoeld in het eerste lid, verhoogd met de op de invordering vallende
      kosten, invorderen. [Artikel 5:26, tweede tot en met vierde lid, van de Algemene wet bestuursrecht][ref1] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6.21.3
    text: |-
      Indien niet binnen drie maanden na het besluit, bedoeld in het eerste lid, de desbetreffende bijdrage door de
      gemeente is ontvangen, kunnen burgemeester en wethouders de bouwvergunning geheel of gedeeltelijk intrekken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.21
  - number: 6.22.1
    text: |-
      Een gemeente verstrekt een aan de vergunninghouder verschuldigde financiële bijdrage indien de prestaties waaraan
      die bijdrage is gerelateerd, overeenkomstig het exploitatieplan zijn verricht en een verzoek tot betaling bij de
      gemeente is ingediend.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.22
  - number: 6.22.2
    text: |-
      Op het verstrekken van een bijdrage als bedoeld in het eerste lid is
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '6.23'
    text: |-
      De gemeenteraad kan met betrekking tot de grondexploitatie een verordening vaststellen, welke bepalingen kan
      bevatten met betrekking tot de procedure voor het totstandkomen van een overeenkomst over grondexploitatie en de
      inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.23
  - number: 6.24.1
    text: |-
      Bij het aangaan van een overeenkomst over grondexploitatie kunnen burgemeester en wethouders in de overeenkomst
      bepalingen opnemen inzake:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.24
  - number: 6.24.1.a
    text: |-
      financiële bijdragen aan de grondexploitatie alsmede op basis van een vastgestelde structuurvisie, aan ruimtelijke
      ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.24
  - number: 6.24.1.b
    text: |-
      verrekening van schade die op grond van [artikel 6.1][ref1] voor vergoeding in aanmerking zou komen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.24.2
    text: |-
      Na vaststelling van een exploitatieplan nemen burgemeester en wethouders bij het aangaan van een overeenkomst over
      grondexploitatie het exploitatieplan in acht, met dien verstande dat de overeenkomst bepalingen kan bevatten over
      de uitwerking van onderwerpen uit het exploitatieplan, maar geen bepalingen kan bevatten over onderwerpen welke
      deel kunnen uitmaken van een exploitatieplan, maar daarin niet zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.24
  - number: 6.24.3
    text: |-
      Van de overeenkomst wordt binnen twee weken na het sluiten daarvan door burgemeester en wethouders kennis gegeven
      in een van gemeentewege uitgegeven blad of een dag-, nieuws- of huis-aan-huisblad.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.24
  - number: 6.24.4
    text: |-
      [Artikel 6.4a, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van degene die een overeenkomst
      heeft gesloten over grondexploitatie waarin een regeling van verhaal van planschade is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.25.1
    text: |-
      Indien provinciale staten met toepassing van [artikel 3.26, eerste lid][ref1], een inpassingsplan vaststellen, of
      met toepassing van [artikel 3.27][ref2] een projectbesluit nemen of een besluit als bedoeld in [artikel 3.41][ref3]
      nemen, treden provinciale staten voor de toepassing van de bij of krachtens deze afdeling gestelde regels in de
      plaats van de gemeenteraad en gedeputeerde staten in de plaats van burgemeester en wethouders en wordt in plaats
      van «gemeente» telkens gelezen: provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 6.25.2
    text: |-
      Indien Onze Minister met toepassing van [artikel 3.28, eerste lid][ref1], een inpassingsplan vaststelt, of met
      toepassing van [artikel 3.29][ref2], een projectbesluit neemt of een besluit als bedoeld in [artikel 3.42][ref3]
      neemt, treedt hij voor de toepassing van de bij of krachtens deze afdeling gestelde regels in de plaats van de
      gemeenteraad en van burgemeester en wethouders en wordt in plaats van «de gemeente» of «een gemeente» telkens
      gelezen: het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 6.25.3
    text: |-
      Indien Onze Minister, in voorkomend geval gezamenlijk met Onze aangewezen Minister, met toepassing van
      [artikel 3.35][ref1] een inpassingsplan vaststelt, of een projectbesluit neemt, treedt Onze Minister, in voorkomend
      geval gezamenlijk met Onze aangewezen Minister, voor de toepassing van de bij of krachtens deze afdeling gestelde
      regels in de plaats van de gemeenteraad en Onze Minister of Onze aangewezen Minister in de plaats van burgemeester
      en wethouders en wordt in plaats van «de gemeente» of «een gemeente» telkens gelezen: het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.3
        afdeling: '3.6'
  - number: '7.1'
    text: |-
      Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bepaalde bij of krachtens
      deze wet.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.2
  - number: 7.2.2
    text: |-
      De krachtens het eerste lid aangewezen ambtenaren zijn bevoegd met medeneming van de benodigde apparatuur een
      woning binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bepaalde bij of krachtens deze wet zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.3
  - number: 7.3.2
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 7.3.3
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving van
      het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens het
      eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip, de
      frequentie en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden bepaald dat daarbij
      gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.3
  - number: '7.4'
    text: |-
      De krachtens de [artikelen 7.2][ref1] en [7.3][ref2] aangewezen ambtenaren zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref3], belast met de opsporing van de feiten, strafbaar gesteld
      in de [artikelen 179 tot en met 182][ref4] en [184 van het Wetboek van Strafrecht][ref5], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '7.5'
    text: |-
      Indien een verzoek als bedoeld in [artikel 5:34 van de Algemene wet bestuursrecht][ref1] wordt gedaan, geeft het
      bestuursorgaan dat de last onder dwangsom heeft opgelegd zo spoedig mogelijk, doch uiterlijk binnen vier weken, de
      beschikking op het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 7.6.1
    text: |-
      Onze Minister kan, indien dat in het belang van een goede ruimtelijke ordening geboden is, vorderen dat het tot
      intrekken bevoegde bestuursorgaan binnen een door hem te stellen termijn de aanleg- of sloopvergunning intrekt.
      Indien burgemeester en wethouders of gedeputeerde staten de beschikking tot intrekking van de vergunning geven,
      zenden zij daarvan terstond afschrift aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Indien het bestuursorgaan aan de vordering geen gevolg geeft, kan Onze Minister tot zes weken na het verstrijken
      van de gestelde termijn een beschikking als bedoeld in het eerste lid geven. Onze Minister zendt van zijn
      beschikking terstond afschrift aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.6
  - number: '7.7'
    text: |-
      Gedeputeerde staten kunnen, indien dat met het oog op een goede ruimtelijke ordening ter behartiging van
      provinciale belangen geboden is, burgemeester en wethouders verzoeken binnen een bepaalde termijn de aanleg- of
      sloopvergunning in te trekken. Indien burgemeester en wethouders de beschikking tot intrekking van de vergunning
      geven, zenden zij daarvan terstond afschrift aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.7
  - number: 7.8.1
    text: |-
      Onze Minister kan, indien dat in het belang van een goede ruimtelijke ordening geboden is, vorderen dat
      burgemeester en wethouders ter zake van de overtreding van een bij of krachtens deze wet gesteld voorschrift binnen
      een door hem te stellen termijn een beschikking tot toepassing van bestuursdwang of oplegging van een last onder
      dwangsom uitvoeren, dan wel geven en uitvoeren. Burgemeester en wethouders doen van hun beschikking en de daaraan
      gegeven uitvoering schriftelijk mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.8
  - number: 7.8.2
    text: |-
      Indien burgemeester en wethouders niet of niet volledig gevolg geven aan een vordering kan Onze Minister voor
      rekening van de gemeente daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.8
  - number: 7.8.3
    text: |-
      [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is van toepassing, met dien verstande dat voor het
      bestuursorgaan dat bestuursdwang heeft toegepast wordt gelezen: burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 7.8.4
    text: |-
      Onze Minister kan bij zijn vorderingsbesluit bepalen dat in afwijking van
      [artikel 5:25 van de Algemene wet bestuursrecht][ref1] de aan de uitvoering van de beschikking verbonden kosten
      voor rekening van de gemeente blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '7.9'
    text: |-
      Gedeputeerde staten kunnen, indien dat met het oog op een goede ruimtelijke ordening ter behartiging van
      provinciale belangen geboden is, burgemeester en wethouders verzoeken binnen een bepaalde termijn gebruik te
      maken van hun bevoegdheden tot handhaving ter zake van de overtreding van een bij of krachtens deze wet gesteld
      voorschrift. Burgemeester en wethouders doen van hun beschikking en de daaraan gegeven uitvoering schriftelijk
      mededeling aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.9
  - number: 7.10.1
    text: |-
      Het is verboden gronden en bouwwerken te gebruiken of te laten gebruiken in strijd met een bestemmingsplan,
      een projectbesluit daaronder begrepen, een beheersverordening, een besluit als bedoeld in [artikel 3.40][ref1],
      [3.41][ref2] of [3.42][ref3], een voorbereidingsbesluit voor zover hierbij toepassing is gegeven aan het derde
      of vierde lid, een provinciale verordening of een algemene maatregel van bestuur, voor zover hierbij toepassing
      is gegeven aan [artikel 4.1, derde of vijfde lid][ref4], onderscheidenlijk [4.3, derde of vierde lid][ref5], of
      een aanwijzing voor zover hierbij toepassing is gegeven aan [artikel 4.2, derde lid][ref6], onderscheidenlijk
      [4.4, derde lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref6
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref7
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 7.10.2
    text: |-
      Een gedraging in strijd met een voorschrift dat is verbonden aan een krachtens deze wet verleende vergunning of
      ontheffing is verboden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.10
  - number: 7.10.3
    text: Overtreding van een verbod als bedoeld in het eerste of tweede lid is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel7.10
  - number: '8.1'
    text: |-
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 8.1.a
    text: |-
      een besluit op een verzoek om een kostenvergoeding als bedoeld in [artikel 6.8][ref1] of [6.9][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8.1.b
    text: |-
      een besluit omtrent herziening van een exploitatieplan, dat niet is voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede een besluit omtrent de afrekening en herberekende
      exploitatiebijdragen van een exploitatieplan;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8.1.c
    text: |-
      een aanwijzingsbesluit als bedoeld in [artikel 3.8, zesde lid][ref1], of [artikel 3.11, tweede lid][ref2], in
      samenhang met [artikel 3.8, zesde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 8.2.1
    text: 'Een belanghebbende kan bij de Afdeling bestuursrechtspraak van de Raad van State beroep instellen tegen:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
  - number: 8.2.1.a
    text: een besluit omtrent vaststelling van een bestemmingsplan of inpassingsplan;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
  - number: 8.2.1.b
    text: |-
      een besluit als bedoeld in [artikel 3.1, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 8.2.1.c
    text: |-
      een besluit omtrent wijziging of uitwerking van een bestemmingsplan overeenkomstig [artikel 3.6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 8.2.1.d
    text: |-
      een aanwijzingsbesluit als bedoeld in [artikel 3.8, zesde lid][ref1], of [artikel 3.11, tweede lid][ref2], in
      samenhang met [artikel 3.8, zesde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
