    text: |-
      Onverminderd het bepaalde in [artikel 59, eerste lid, van de onteigeningswet][ref1] kan het vonnis van de rechtbank
      niet eerder in de openbare registers worden ingeschreven dan nadat het bestemmingsplan, het inpassingsplan of het
      projectbesluit onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.36b
    references:
