    text: |-
      besluiten als bedoeld in [artikel 3.30, eerste lid, onder a of b][ref1], [3.33, eerste lid, onder a of b][ref2],
      of [3.35, eerste lid, onder a of b][ref3], indien bij deze of een andere wet tegen één of meer van deze besluiten
      beroep bij de Afdeling bestuursrechtspraak is opengesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
