      [3.33, eerste lid, onder a][ref2], of [3.35, eerste lid, onder a][ref3], toepassing
      van de [Belemmeringenwet Privaatrecht][ref4] noodzakelijk is, geldt in plaats van
      [artikel 4 van de Belemmeringenwet Privaatrecht][ref5] dat:


