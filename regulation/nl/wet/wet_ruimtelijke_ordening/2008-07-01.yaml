      - id: ref5
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 3.30.4
    text: |-
      Voor zover onder de besluiten, bedoeld in het eerste lid, onder b, mede een
      aanlegvergunning of bouwvergunning is begrepen, mag deze slechts en moet deze worden
      geweigerd, in afwijking van [artikel 3.16, eerste lid, onder a][ref1], onderscheidenlijk
      [artikel 44, eerste lid, onderdeel c, van de Woningwet][ref2], indien het aanleggen of het bouwen in strijd is met
      het bestemmingsplan, bedoeld in het eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '44'
  - number: 3.31.1
    text: |-
      In door de gemeenteraad met toepassing van [artikel 3.30][ref1] aangewezen gevallen bevorderen burgemeester en
      wethouders een gecoördineerde voorbereiding van de bij of krachtens dat artikel aangeduide besluiten. Burgemeester
      en wethouders kunnen andere bestuursorganen verzoeken de medewerking te verlenen, die voor het welslagen van de
      coördinatie nodig is. Met het oog hierop zendt een bestuursorgaan dat bevoegd is op een aanvraag voor een dergelijk
      besluit te beslissen hun onverwijld een afschrift van die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.31.2
    text: |-
      Ten aanzien van aanvragen als bedoeld in het eerste lid, zijn burgemeester en wethouders mede bevoegd deze in te
      dienen bij de bevoegde bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
  - number: 3.31.3
    text: |-
      Op de voorbereiding van besluiten, bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.31.3.a
    text: |-
      de kennisgevingen, bedoeld in [artikel 3:12 van die wet][ref1], tevens worden gedaan in de Staatscourant en voorts
      langs elektronische weg;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.31.3.b
    text: |-
      burgemeester en wethouders ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kunnen geven aan
      [artikel 3:11, eerste lid, van die wet][ref1] en de kennisgevingen, bedoeld in [artikel 3:12 van die wet][ref2]
      voor verschillende onderwerpen kunnen samenvoegen in een kennisgeving, die door burgemeester en wethouders wordt
      gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.31.3.c
    text: |-
      de ontwerpen van besluiten binnen een door burgemeester en wethouders in overeenstemming met het desbetreffend
      bevoegd gezag te bepalen termijn worden toegezonden aan burgemeester en wethouders, die zorg dragen voor de in
      [artikel 3:13, eerste lid, van die wet][ref1] bedoelde toezending;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.31.3.d
    text: zienswijzen door een ieder naar voren kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
  - number: 3.31.3.e
    text: |-
      in afwijking van [artikel 3:18 van die wet][ref1] de besluiten worden genomen binnen een door burgemeester en
      wethouders in overeenstemming met het desbetreffend bevoegd gezag te bepalen termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.31.3.f
    text: de besluiten onverwijld worden toegezonden aan burgemeester en wethouders;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
  - number: 3.31.3.g
    text: |-
      burgemeester en wethouders beslissen over de toepassing van [artikel 3:18, tweede lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.31.3.h
    text: |-
      de in [artikel 3:44 van die wet][ref1] bedoelde toezending tevens geschiedt aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '3.32'
    text: |-
      Burgemeester en wethouders maken de vaststelling van het in [artikel 3.30, eerste lid][ref1],
      bedoelde bestemmingsplan, en de andere besluiten voor zover ten aanzien van deze besluiten gezamenlijk
      [artikel 3.31, derde lid][ref2], is toegepast, gelijktijdig bekend. Zij doen mededeling van deze besluiten in de
      Staatscourant en voorts langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.33.1
    text: |-
      Bij besluit van provinciale staten kunnen gevallen of categorieën van gevallen worden aangewezen waarin de
      verwezenlijking van een onderdeel van het provinciaal ruimtelijk beleid het wenselijk maakt dat:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
  - number: 3.33.1.a
    text: |-
      de voorbereiding en bekendmaking van nader aan te duiden, op aanvraag of ambtshalve te nemen besluiten worden
      gecoördineerd, of
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
  - number: 3.33.1.b
    text: |-
      een inpassingsplan als bedoeld in [artikel 3.26][ref1], een daaraan voorafgaand projectbesluit daaronder begrepen,
      wordt vastgesteld en de voorbereiding en bekendmaking daarvan wordt gecoördineerd met de voorbereiding en
      bekendmaking van besluiten als bedoeld onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.33.2
    text: |-
      Gedeputeerde staten kunnen van andere bestuursorganen, tenzij dit een bestuursorgaan van het Rijk is, de
      medewerking vorderen, die voor het welslagen van de coördinatie nodig is. Die bestuursorganen verlenen de van hen
      gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
  - number: 3.33.3
    text: |-
      In een besluit als bedoeld in de aanhef van het eerste lid kunnen provinciale staten tevens bepalen dat
      gedeputeerde staten, met uitsluiting van het in eerste aanleg bevoegde bestuursorgaan, tenzij dit een
      bestuursorgaan van het Rijk is, de voor de bedoelde verwezenlijking benodigde besluiten op aanvraag of ambtshalve
      nemen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
  - number: 3.33.4
    text: |-
      Bij de gecoördineerde voorbereiding en bekendmaking als bedoeld in het eerste lid, onder a of b, wordt de
      procedure beschreven in de [artikelen 3.31][ref1] en [3.32][ref2], respectievelijk die procedure in samenhang
      met hetzij, in geval van een inpassingsplan, de procedure beschreven in [artikel 3.8][ref3], hetzij, in geval
      van een projectbesluit, de procedure beschreven in [artikel 3.11][ref4] toegepast, met dien verstande dat daarbij
      provinciale staten in de plaats treden van de gemeenteraad, en gedeputeerde staten in de plaats van burgemeester
      en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3.33.5
    text: |-
      Indien een besluit als bedoeld in het eerste lid, onder a, mede betrekking heeft op een besluit als bedoeld in
      [artikel 3.41][ref1], wordt de procedure beschreven in de [artikelen 3.31][ref2] en [3.32][ref3] in samenhang
      met de procedure beschreven in [artikel 3.11][ref4] toegepast, met dien verstande dat hierin in plaats van
      «projectbesluit» telkens wordt gelezen: «besluit als bedoeld in [artikel 3.41][ref5]» en dat provinciale staten in
      de plaats treden van de gemeenteraad en gedeputeerde staten in de plaats van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 3.33.6
    text: |-
      Indien ten aanzien van de verwezenlijking van een onderdeel van het provinciaal ruimtelijk beleid het maken van
      een milieueffectrapport krachtens [artikel 7.2][ref1] of [artikel 7.4 van de Wet milieubeheer][ref2] verplicht is,
      gaat de mededeling, bedoeld in [artikel 7.12, eerste lid][ref3], of [artikel 7.13, eerste lid, van die wet][ref4],
      vergezeld van een globale beschrijving van de gevolgen voor het ruimtelijk beleid, van de sociaal-economische
      gevolgen en van de gevolgen voor andere daarbij betrokken belangen, die van die verwezenlijking te verwachten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 3.33.7
    text: |-
      [Artikel 3.30, vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in plaats van
      «bestemmingsplan» wordt gelezen: inpassingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.33.8
    text: |-
      Voor zover de verwezenlijking van een onderdeel van het provinciaal ruimtelijk beleid onevenredig wordt belemmerd
      door bepalingen die – al dan niet krachtens de wet – bij of krachtens een regeling van een gemeente of waterschap
      zijn vastgesteld, kunnen die bepalingen bij het nemen en uitvoeren van de besluiten, bedoeld in het eerste lid,
      onder a of b, om dringende redenen buiten toepassing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.33
  - number: 3.34.1
    text: |-
      Indien een bestuursorgaan, uitgezonderd een bestuursorgaan van het Rijk, dat in eerste aanleg bevoegd is een
      besluit als bedoeld in [artikel 3.33, eerste lid, onder a of b][ref1], te nemen, niet of niet tijdig overeenkomstig
      de aanvraag beslist, dan wel een beslissing neemt die naar het oordeel van gedeputeerde staten wijziging behoeft,
      kunnen gedeputeerde staten een beslissing nemen. In dat geval treedt dit besluit in de plaats van het besluit van
      het in eerste aanleg bevoegde bestuursorgaan. Indien gedeputeerde staten voornemens zijn zelf een beslissing te
      nemen, plegen zij overleg met het bestuursorgaan dat in eerste aanleg bevoegd is te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.34.2
    text: |-
      Indien bij toepassing van het eerste lid de beslissing op een aanvraag wordt genomen door gedeputeerde staten,
      stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter zake ontvangen leges
      in de kas van de provincie.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.34
  - number: 3.35.1
    text: |-
      Bij wet of een besluit van Onze Minister of een Onzer andere Ministers, in overeenstemming met het gevoelen van
      de ministerraad, kan worden bepaald dat de verwezenlijking van een onderdeel van het nationaal ruimtelijk beleid
      wenselijk maakt dat:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.35
  - number: 3.35.1.a
    text: |-
      de voorbereiding en bekendmaking van nader aan te duiden, op aanvraag of ambtshalve te nemen besluiten wordt
      gecoördineerd, of
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.35
  - number: 3.35.1.b
    text: |-
      een inpassingsplan als bedoeld in [artikel 3.28][ref1], een daaraan voorafgaand projectbesluit daaronder begrepen,
      wordt vastgesteld en de voorbereiding en bekendmaking daarvan wordt gecoördineerd met de voorbereiding en
      bekendmaking van besluiten als bedoeld onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.35.2
    text: |-
      In een wet of besluit als bedoeld in de aanhef van het eerste lid strekkende tot vaststelling van een
      inpassingsplan wordt de Minister aangewezen die, in afwijking van [artikel 3.28, tweede lid][ref1], in de plaats
      treedt van burgemeester en wethouders en gezamenlijk met Onze Minister in de plaats treedt van de gemeenteraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.35.3
    text: |-
      In een wet of besluit als bedoeld in de aanhef van het eerste lid strekkende tot gecoördineerde voorbereiding
      en bekendmaking van besluiten wordt de Minister aangewezen die eerstverantwoordelijk is voor de gecoördineerde
      voorbereiding en bekendmaking. Deze Minister kan van andere bestuursorganen de medewerking vorderen, die voor
      het welslagen van de coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking. Tevens
      kan worden bepaald dat deze Minister en Onze Minister wie het mede aangaat gezamenlijk met uitsluiting van een in
      eerste aanleg bevoegd bestuursorgaan, een voor bedoelde verwezenlijking benodigd besluit op aanvraag of ambtshalve
      nemen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.35
  - number: 3.35.4
    text: |-
      Bij de gecoördineerde voorbereiding en bekendmaking als bedoeld in het eerste lid, onder a of b, wordt de procedure
      beschreven in de [artikelen 3.31][ref1] en [3.32][ref2], respectievelijk die procedure in samenhang met hetzij, in
      geval van een inpassingsplan, de procedure beschreven in [artikel 3.8, eerste, derde en vijfde lid][ref3], hetzij,
      in geval van een projectbesluit, de procedure beschreven in [artikel 3.11][ref4] toegepast, met dien verstande dat
      Onze in de wet of het besluit, bedoeld in de aanhef van het eerste lid, aangewezen Minister in de plaats treedt
      van burgemeester en wethouders en deze Minister en Onze Minister gezamenlijk in de plaats van de gemeenteraad.
      In geval van een projectbesluit treden de betrokken besluiten in werking met ingang van de dag na die waarop de
      beroepstermijn afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
