      [ref6]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0020449#Artikel3
