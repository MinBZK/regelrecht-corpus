  - number: 3.35.5
    text: |-
      Indien een besluit als bedoeld in het eerste lid, onder a, mede betrekking heeft op een besluit als bedoeld in
      [artikel 3.42][ref1], wordt de procedure beschreven in de [artikelen 3.31][ref2] en [3.32][ref3] in samenhang
      met de procedure beschreven in [artikel 3.11][ref4] toegepast, met dien verstande dat hierin in plaats van
      «projectbesluit» telkens wordt gelezen: «besluit als bedoeld in [artikel 3.42][ref5]» en dat Onze in de wet of
      het besluit, bedoeld in de aanhef van het eerste lid, aangewezen Minister in de plaats treedt van burgemeester en
      wethouders en deze Minister en Onze Minister gezamenlijk in de plaats treden van de gemeenteraad.


