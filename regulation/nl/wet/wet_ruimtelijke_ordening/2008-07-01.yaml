      een aanwijzing als bedoeld in [artikel 4.2, eerste lid][ref1], of [artikel 4.4, eerste lid][ref2], voor zover deze
      betrekking heeft op een daarbij concreet aangegeven locatie, waarvan geen afwijking mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
