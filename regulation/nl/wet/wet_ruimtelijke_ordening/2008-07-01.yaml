  - number: '3.25'
    text: 'De regels van een bestemmingsplan blijven buiten toepassing voor zover deze betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.25
  - number: 3.25.a
    text: |-
      het bouwen waarvoor krachtens [artikel 43, eerste lid, van de Woningwet][ref1] geen bouwvergunning vereist is, of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: 3.25.b
    text: |-
      het gebruik van bouwwerken en standplaatsen dat voldoet aan de voorschriften die zijn gegeven bij de algemene
      maatregel van bestuur, bedoeld in [artikel 43, eerste lid, onderdeel c, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: 3.26.1
    text: |-
      Indien sprake is van provinciale belangen kunnen provinciale staten, de betrokken gemeenteraad gehoord, voor de
      daarbij betrokken gronden een inpassingsplan vaststellen met uitsluiting van de bevoegdheid van de gemeenteraad om
      voor die gronden een bestemmingsplan vast te stellen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.26
  - number: 3.26.2
    text: |-
      De [afdelingen 3.1][ref1] en [3.2][ref2] zijn van overeenkomstige toepassing, met dien verstande dat voor
      «bestemmingsplan» «inpassingsplan» wordt gelezen en voor «gemeentebestuur» «provinciaal bestuur», en dat
      met betrekking tot [artikel 3.1][ref3] en [afdeling 3.2][ref4] provinciale staten in de plaats treden van de
      gemeenteraad, en gedeputeerde staten in de plaats treden van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0020449
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref4
        bwb_id: BWBR0020449
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.26.3
    text: |-
      Het inpassingsplan wordt geacht deel uit te maken van het bestemmingsplan of de bestemmingsplannen waarop het
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.26
  - number: 3.26.4
    text: |-
      Provinciale staten kunnen bij een besluit als bedoeld in het eerste lid bepalen dat ten aanzien van de bevoegdheden
      en verplichtingen, bedoeld in [artikel 3.3][ref1] in samenhang met [§ 3.4.1][ref2] en [§ 3.4.2][ref3],
      of in [artikel 3.6, eerste lid][ref4], dan wel in [Hoofdstuk IV, afdeling 1, van de Woningwet][ref5], met
      uitzondering van [artikel 57 van die wet][ref6], gedeputeerde staten in de plaats treden van burgemeester
      en wethouders. Gedeputeerde staten verstrekken burgemeester en wethouders de benodigde gegevens, bedoeld in
      [artikel 57 van die wet][ref7] ten behoeve van aantekening in het openbaar register. Indien provinciale staten
      toepassing hebben gegeven aan de eerste volzin ten aanzien van de bevoegdheden en verplichtingen, bedoeld in
      [artikel 3.3][ref8], worden ook de in [§ 3.4.3][ref9] geregelde bevoegdheden door gedeputeerde staten uitgeoefend
      met uitsluiting van de bevoegdheid terzake van burgemeester en wethouders. Gedeputeerde staten zenden van met
      toepassing van de in de eerste en tweede volzin bedoelde bevoegdheden gegeven beschikkingen terstond afschrift aan
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
