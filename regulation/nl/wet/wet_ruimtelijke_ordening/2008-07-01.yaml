  - number: 3.30.1
    text: |-
      Bij besluit van de gemeenteraad kunnen gevallen of categorieën van gevallen worden aangewezen waarin de
      verwezenlijking van een onderdeel van het gemeentelijk ruimtelijk beleid het wenselijk maakt dat:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.30
  - number: 3.30.1.a
    text: |-
      de voorbereiding en bekendmaking van nader aan te duiden, op aanvraag of ambtshalve te nemen besluiten worden
      gecoördineerd, of
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.30
  - number: 3.30.1.b
    text: |-
      de voorbereiding en bekendmaking van een bestemmingsplan, een daaraan voorafgaand projectbesluit daaronder
      begrepen, wordt gecoördineerd met de voorbereiding en bekendmaking van besluiten als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Bij de gecoördineerde voorbereiding en bekendmaking als bedoeld in het eerste lid, onder a of b, wordt de procedure
      beschreven in de [artikelen 3.31][ref1] en [3.32][ref2], respectievelijk die procedure in samenhang met hetzij,
      in geval van een bestemmingsplan, de procedure beschreven in [artikel 3.8][ref3], hetzij, in geval van een
      projectbesluit, de procedure beschreven in [artikel 3.11][ref4] toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
