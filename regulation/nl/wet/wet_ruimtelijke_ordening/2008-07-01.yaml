  - number: 3.35.6
    text: |-
      Indien ten aanzien van de verwezenlijking van een onderdeel van het nationaal ruimtelijk beleid het maken van een
      milieueffectrapport krachtens [artikel 7.2][ref1] of [artikel 7.4 van de Wet milieubeheer][ref2] verplicht is,
      gaat de mededeling, bedoeld in [artikel 7.12, eerste lid][ref3], of [artikel 7.13, eerste lid, van die wet][ref4],
      vergezeld van een globale beschrijving van de gevolgen voor het ruimtelijk beleid, van de sociaal-economische
      gevolgen en van de gevolgen voor andere daarbij betrokken belangen, die van die verwezenlijking te verwachten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
