  - number: 6.1.1
    text: |-
      Burgemeester en wethouders kennen degene die in de vorm van een inkomensderving of een vermindering van de waarde
      van een onroerende zaak schade lijdt of zal lijden als gevolg van een in het tweede lid genoemde oorzaak, op
      aanvraag een tegemoetkoming toe, voor zover de schade redelijkerwijs niet voor rekening van de aanvrager behoort te
      blijven en voor zover de tegemoetkoming niet voldoende anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.1
  - number: 6.1.2
    text: 'Een oorzaak als bedoeld in het eerste lid is:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel6.1
  - number: 6.1.2.a
    text: |-
