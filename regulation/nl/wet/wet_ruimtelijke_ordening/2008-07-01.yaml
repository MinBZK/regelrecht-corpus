  - number: 10.3.3
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, kunnen regels worden gesteld ten aanzien van de bestuursorganen die de
      in deze wet vervatte bevoegdheden uitoefenen en ten aanzien van de bij die uitvoering te betrekken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.3
  - number: 10.4.1
    text: |-
      Bij koninklijk besluit op voordracht van Onze Minister en Onze Minister wie het mede aangaat, kan worden bepaald
      dat deze wet niet van toepassing is op een bij dat besluit aan te wijzen werk of werkzaamheid ten behoeve van de
      landsverdediging.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.4
  - number: 10.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de vormgeving van elektronisch
      beschikbaar gestelde informatie over het besluit.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.4
  - number: '10.5'
    text: |-
      Alle stukken opgemaakt ter verkrijging van de beschikking door de gemeente, de provincie en het Rijk over
      onroerende zaken teneinde uitvoering te kunnen geven aan een bestemmingsplan, zijn vrij van kosten van legalisatie
      en griffiekosten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.5
  - number: '10.6'
    text: |-
      De kosten van de gemeente of de provincie, voortvloeiende uit de medewerking aan de uitvoering van
      deze wet, zijn uitgaven als bedoeld in [artikel 193 van de Gemeentewet][ref1] onderscheidenlijk
      [artikel 197 van de Provinciewet][ref2]. [Artikel 194 van de Gemeentewet][ref3] onderscheidenlijk
      [artikel 198 van de Provinciewet][ref4] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel194
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel198
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.6
