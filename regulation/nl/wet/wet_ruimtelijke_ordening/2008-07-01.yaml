  - number: 3.28.7
    text: |-
      De bepalingen van een provinciale verordening als bedoeld in [artikel 4.1][ref1] blijven buiten toepassing voor
      zover zij met een krachtens het eerste lid vastgesteld inpassingsplan in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.28
