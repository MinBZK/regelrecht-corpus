preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, ter bevordering van een duurzame ruimtelijke kwaliteit,
    wenselijk is nieuwe regels te geven omtrent de ruimtelijke ordening teneinde de positie van het bestemmingsplan
    te versterken, de doelgerichtheid en doeltreffendheid van het ruimtelijk beleid te vergroten en de ruimtelijke
    regelgeving te vereenvoudigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
  - number: 1.1.1.a
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
  - number: 1.1.1.b
    text: 'de inspecteur: de als zodanig bij besluit van Onze Minister aangewezen ambtenaar;'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
  - number: 1.1.1.c
    text: |-
      aanlegvergunning: vergunning als bedoeld in [artikel 3.3, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
    references:
