  - number: 3.29.1
    text: |-
      Onze Minister of Onze Minister wie het aangaat in overeenstemming met Onze Minister, kan, de gemeenteraad
      en provinciale staten gehoord, ten behoeve van de verwezenlijking van een project van nationaal belang een
      projectbesluit nemen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.29
  - number: 3.29.2
    text: |-
      De [artikelen 3.10 tot en met 3.14][ref1], met uitzondering van het vierde en zesde lid
      van het in [artikel 3.11, tweede lid][ref2], van overeenkomstige toepassing verklaarde
      [artikel 3.8, tweede tot en met zesde lid][ref3], en [3.28, vijfde tot en met zevende lid][ref4], zijn van
      overeenkomstige toepassing, met dien verstande dat Onze Minister in de plaats treedt van de gemeenteraad
      en van burgemeester en wethouders, dat in de [artikelen 3.13][ref5] en [3.14][ref6] in plaats van
      «bestemmingsplan» wordt gelezen: «inpassingsplan» en voor «gemeentebestuur» «Onze Minister», en dat in
      [artikel 3.28, zesde en zevende lid][ref7], in plaats van «krachtens het eerste lid vastgesteld inpassingsplan»
      wordt gelezen: vastgesteld projectbesluit.


