  - number: 3.28.5
    text: |-
      Onze Minister bepaalt in het vaststellingsbesluit tot welk tijdstip de uitsluiting van de bevoegdheid van de
      gemeenteraad tot vaststelling van een bestemmingsplan respectievelijk van provinciale staten tot vaststelling van
      een inpassingsplan voor de betrokken gronden voortduurt, met dien verstande dat dit tijdstip is gelegen binnen de
      periode van tien jaar, bedoeld in [artikel 3.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
