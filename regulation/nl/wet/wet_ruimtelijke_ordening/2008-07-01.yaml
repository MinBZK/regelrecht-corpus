        afdeling: '3.5'
  - number: 3.28.1
    text: |-
      Indien sprake is van nationale belangen kan Onze Minister, de gemeenteraad en provinciale staten gehoord, voor de
      daarbij betrokken gronden een inpassingsplan vaststellen met uitsluiting van de bevoegdheid van de gemeenteraad
      en van provinciale staten om voor die gronden een bestemmingsplan onderscheidenlijk een inpassingsplan vast te
      stellen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.28
  - number: 3.28.2
    text: |-
      De [afdelingen 3.1][ref1] en [3.2][ref2], met uitzondering van [artikel 3.8, vierde en zesde lid][ref3], zijn van
      overeenkomstige toepassing, met dien verstande dat voor «bestemmingsplan» «inpassingsplan» wordt gelezen en voor
      «gemeentebestuur» «Onze Minister», en dat met betrekking tot [artikel 3.1][ref4] en [afdeling 3.2][ref5] Onze
      Minister in de plaats treedt van de gemeenteraad en van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
