  - number: 3.28.6
    text: |-
      De bevoegdheid tot het maken van provinciale verordeningen als bedoeld in [artikel 4.1][ref1] blijft gehandhaafd
      voor zover deze verordeningen niet met een krachtens het eerste lid vastgesteld inpassingsplan in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.28
