      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel57
      [ref8]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
