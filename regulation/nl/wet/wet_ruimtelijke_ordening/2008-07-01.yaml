  - number: 4.3.5
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp is overgelegd aan beide kamers der Staten-Generaal, in de Staatscourant en langs elektronische
      weg is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen een bij die bekendmaking te stellen
      termijn van ten minste vier weken schriftelijk of langs elektronische weg opmerkingen over het ontwerp ter kennis
      van Onze Minister te brengen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Indien nationale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kan Onze Minister
      of Onze Minister wie het aangaat in overeenstemming met Onze Minister:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
  - number: 4.4.1.a
    text: |-
      een gemeenteraad een aanwijzing geven binnen een daarbij te bepalen termijn een bestemmingsplan vast te stellen
      overeenkomstig daarbij gegeven voorschriften omtrent de inhoud van dat bestemmingsplan;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
  - number: 4.4.1.b
    text: |-
      provinciale staten een aanwijzing geven binnen een daarbij te bepalen termijn van ten hoogste zes maanden
      toepassing te geven aan [artikel 4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.4.1.c
    text: |-
      gedeputeerde staten een aanwijzing geven binnen een daarbij te bepalen termijn van ten hoogste drie maanden
      toepassing te geven aan [artikel 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
    references:
      - id: ref1
