  - number: 3.28.3
    text: |-
      Het inpassingsplan wordt geacht deel uit te maken van het bestemmingsplan of de bestemmingsplannen waarop het
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.28
  - number: 3.28.4
    text: |-
      Onze Minister kan bij een besluit als bedoeld in het eerste lid bepalen dat ten aanzien van de bevoegdheden
      en verplichtingen, bedoeld in [artikel 3.3][ref1] in samenhang met [§ 3.4.1][ref2] en [§ 3.4.2][ref3], of in
      [artikel 3.6, eerste lid][ref4], dan wel in [Hoofdstuk IV, afdeling 1, van de Woningwet][ref5], met uitzondering
      van [artikel 57 van die wet][ref6], hij in de plaats treedt van burgemeester en wethouders. Onze Minister
      verstrekt burgemeester en wethouders de benodigde gegevens, bedoeld in [artikel 57 van die wet][ref7] ten behoeve
      van aantekening in het openbaar register. Indien Onze Minister toepassing heeft gegeven aan de eerste volzin ten
      aanzien van de bevoegdheden en verplichtingen, bedoeld in [artikel 3.3][ref8], worden ook de in [§ 3.4.3][ref9]
      geregelde bevoegdheden door hem uitgeoefend met uitsluiting van de bevoegdheid terzake van burgemeester en
      wethouders. Onze Minister zendt van met toepassing van de in de eerste en tweede volzin bedoelde bevoegdheden
      gegeven beschikkingen terstond afschrift aan burgemeester en wethouders.


