        artikel: 54n
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '59'
  - number: 3.37.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorbereiding, vormgeving,
      inrichting en beschikbaarstelling en nadere regels omtrent inhoud en uitvoerbaarheid van bestemmingsplannen en
      inpassingsplannen. Tevens kunnen regels worden gesteld omtrent de inhoud van de bij een plan behorende toelichting.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.37
  - number: 3.37.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorbereiding, vormgeving,
      inrichting, uitvoerbaarheid en beschikbaarstelling van een projectbesluit alsmede omtrent de inhoud van de bij een
      projectbesluit behorende ruimtelijke onderbouwing.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.37
  - number: 3.38.1
    text: |-
      Onverminderd de gevallen waarin bij of krachtens wettelijk voorschrift een bestemmingsplan is vereist, kan de
      gemeenteraad in afwijking van [artikel 3.1][ref1] voor die delen van het grondgebied van de gemeente waar geen
      ruimtelijke ontwikkeling wordt voorzien, in plaats van een bestemmingsplan een beheersverordening vaststellen
      waarin het beheer van dat gebied overeenkomstig het bestaande gebruik wordt geregeld. De kennisgeving van een
      besluit tot vaststelling van een beheersverordening geschiedt tevens langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.38.2
    text: |-
      De verordening wordt in elk geval binnen tien jaar na de vaststelling herzien.
      [Artikel 3.1, vierde lid, en vijfde lid][ref1], eerste en tweede volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.38.3
    text: |-
      Om overeenkomstig de verordening bestaand gebruik te handhaven en te beschermen kan bij de verordening worden
      bepaald dat het verboden is om binnen daartoe aangegeven gebied zonder, of in afwijking van een vergunning van
      burgemeester en wethouders:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.38
  - number: 3.38.3.a
    text: bepaalde werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.38
  - number: 3.38.3.b
    text: bouwwerken te slopen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.38
  - number: 3.38.4
    text: |-
      Bij de verordening kan worden bepaald dat burgemeester en wethouders met inachtneming van bij de verordening
      te geven regels ontheffing kunnen verlenen van bij de verordening aan te geven regels. De ontheffing kan onder
      beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden. Belanghebbenden worden in de
      gelegenheid gesteld hun zienswijzen omtrent een voorgenomen ontheffing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.38
  - number: 3.38.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vormgeving, inrichting en
      beschikbaarstelling en nadere regels omtrent de inhoud van de verordening.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.38
  - number: 3.38.6
    text: |-
      [Afdeling 3.4][ref1], met uitzondering van de [artikelen 3.17][ref2] en
      [3.18, tweede lid, onder c, en derde lid, onder e][ref3], is op het in de verordening begrepen gebied van
      overeenkomstige toepassing, met dien verstande dat voor «bestemmingsplan» of «bestemmingsplan, een projectbesluit
      daaronder begrepen,» telkens wordt gelezen: «verordening» en dat in [artikel 3.18, vierde lid][ref4], in plaats van
      «of [3.29][ref5]» wordt gelezen: , [3.29][ref6], [3.40][ref7], [3.41][ref8] of [3.42][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
