    text: |-
      een besluit op een verzoek om een kostenvergoeding als bedoeld in [artikel 6.8][ref1] of [6.9][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
