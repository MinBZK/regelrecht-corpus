  - number: 3.39.1
    text: |-
      Op het tijdstip van inwerkingtreding van een beheersverordening voor een gebied waarvoor een bestemmingsplan geldt,
      vervalt het bestemmingsplan voor zover het op dat gebied betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.39
  - number: 3.39.2
    text: |-
      Op het tijdstip van inwerkingtreding van een bestemmingsplan voor een gebied waarvoor een beheersverordening geldt,
      vervalt de beheersverordening voor zover zij op dat gebied betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.39
  - number: 3.40.1
    text: |-
      De gemeenteraad kan binnen een in een beheersverordening begrepen gebied ten behoeve van de verwezenlijking van
      een project van gemeentelijk belang dat een of meer bouwwerken, werken, geen bouwwerken zijnde of werkzaamheden
      of het gebruik van bouwwerken of gronden kan omvatten, en afwijkt van de verordening, besluiten dat de verordening
      buiten toepassing blijft. De [artikelen 3.10 tot en met 3.12][ref1] zijn van overeenkomstige toepassing. De bij of
      krachtens algemene maatregel van bestuur, bedoeld in [artikel 3.37, tweede lid][ref2], gestelde regels zijn op dit
      besluit van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.40.2
    text: |-
      Te zijner keuze stelt de gemeenteraad binnen een jaar nadat het besluit, bedoeld in het eerste lid, onherroepelijk
      is geworden een met dat besluit overeenkomende wijziging van de verordening vast, dan wel geeft hij overeenkomstige
      toepassing aan [artikel 3.13, eerste, tweede en vierde lid][ref1], met dien verstande dat hierin in plaats van
      «projectbesluit» telkens wordt gelezen: besluit als bedoeld in [artikel 3.40][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 3.40.3
    text: |-
      Zolang de gemeenteraad nog geen verordening als bedoeld in het tweede lid heeft vastgesteld, is
      [artikel 3.13, vierde lid][ref1], van overeenkomstige toepassing, met dien verstande dat in plaats van «het
      bestemmingsplan» wordt gelezen: «de verordening» en dat de in de tweede volzin vermelde tussenzin vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3.41.1
    text: |-
      Provinciale staten kunnen, de gemeenteraad gehoord, ten behoeve van de verwezenlijking van een project van
      provinciaal belang dat een of meer bouwwerken, werken, geen bouwwerken zijnde of werkzaamheden of het gebruik
      van bouwwerken of gronden kan omvatten, en afwijkt van de beheersverordening, besluiten dat de verordening buiten
      toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.41
  - number: 3.41.2
    text: |-
      Binnen een jaar nadat het besluit, bedoeld in het eerste lid, onherroepelijk is geworden, wordt toepassing
      gegeven aan [artikel 3.27, tweede lid][ref1], met dien verstande dat in de van overeenkomstige toepassing
      verklaarde [artikelen 3.10 tot en met 3.14][ref2] in plaats van «projectbesluit» telkens wordt gelezen: een
      besluit als bedoeld in [artikel 3.41, eerste lid][ref3]. Een aldus vastgesteld inpassingsplan wordt aangemerkt
      als bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 3.42.1
    text: |-
      Onze Minister of Onze Minister wie het aangaat in overeenstemming met Onze Minister, kan, de gemeenteraad en
      provinciale staten gehoord, ten behoeve van de verwezenlijking van een project van nationaal belang dat een of meer
      bouwwerken, werken, geen bouwwerken zijnde of werkzaamheden of het gebruik van bouwwerken of gronden kan omvatten,
      en afwijkt van de beheersverordening, besluiten dat de verordening buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.42
  - number: 3.42.2
    text: |-
      Binnen een jaar nadat het besluit, bedoeld in het eerste lid, onherroepelijk is geworden, wordt toepassing
      gegeven aan [artikel 3.29, tweede lid][ref1], met dien verstande dat in de van overeenkomstige toepassing
      verklaarde [artikelen 3.10 tot en met 3.14][ref2] in plaats van «projectbesluit» telkens wordt gelezen: een
      besluit als bedoeld in [artikel 3.42, eerste lid][ref3]. Een aldus vastgesteld inpassingsplan wordt aangemerkt
      als bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 4.1.1
    text: |-
      Indien provinciale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kunnen bij
      of krachtens provinciale verordening regels worden gesteld omtrent de inhoud van bestemmingsplannen, daaraan
      voorafgaande projectbesluiten daaronder begrepen, omtrent de daarbij behorende toelichting of onderbouwing, alsmede
      omtrent de inhoud van beheersverordeningen. Daarbij kan worden bepaald dat een regel slechts geldt voor een daarbij
      aangegeven gedeelte van het grondgebied van de provincie. De kennisgeving van een besluit tot vaststelling van de
      verordening geschiedt tevens langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Tenzij bij de verordening een andere termijn wordt gesteld, stelt de gemeenteraad binnen een jaar na
      inwerkingtreding van de verordening een bestemmingsplan of een beheersverordening vast met inachtneming van de
      verordening.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Bij of krachtens een verordening als bedoeld in het eerste lid kunnen regels worden gesteld die noodzakelijk zijn
      om te voorkomen dat in de verordening begrepen gronden of bouwwerken minder geschikt worden voor de verwezenlijking
      van het doel van de verordening zolang geen bestemmingsplan of beheersverordening als bedoeld in het tweede lid in
      werking is getreden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud, vormgeving,
      inrichting en beschikbaarstelling van de provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.1
  - number: 4.1.5
    text: |-
      Provinciale staten kunnen verklaren dat een verordening wordt voorbereid.
      [Artikel 3.7, tweede, derde, vierde, zevende en achtste lid][ref1], de [paragrafen 3.4.1][ref2] en [3.4.2][ref3]
      alsmede [Hoofdstuk IV, afdeling 1, van de Woningwet][ref4] met uitzondering van [artikel 57 van die wet][ref5],
      zijn van overeenkomstige toepassing, met dien verstande dat gedeputeerde staten in de plaats treden van
      burgemeester en wethouders, tenzij zij bij hun verklaring anders hebben bepaald. Gedeputeerde staten verstrekken
      burgemeester en wethouders de benodigde gegevens, bedoeld in [artikel 57 van de Woningwet][ref6], ten behoeve
      van de aantekening in het openbaar register. Het besluit vervalt bij de inwerkingtreding van de verordening doch
      uiterlijk na zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Afdeling1
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0020449
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0020449
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
      - id: ref4
        bwb_id: BWBR0005181
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '57'
      - id: ref6
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 4.1.6
    text: |-
      Het voorstel voor een ontwerp van een krachtens dit artikel vast te stellen provinciale verordening wordt niet
      gedaan dan nadat het ontwerp in de Staatscourant, langs elektronische weg en op de in de provincie gebruikelijke
      wijze is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen een bij die bekendmaking te stellen
      termijn van ten minste vier weken schriftelijk of langs elektronische weg opmerkingen over het ontwerp ter kennis
      van provinciale staten te brengen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Indien provinciale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kunnen
      gedeputeerde staten aan de gemeenteraad een aanwijzing geven om binnen een daarbij te bepalen termijn een
      bestemmingsplan vast te stellen overeenkomstig daarbij gegeven voorschriften omtrent de inhoud van dat
      bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Er wordt niet overgegaan tot toepassing van het eerste lid dan na overleg met burgemeester en wethouders en niet
      eerder dan vier weken nadat provinciale staten in kennis zijn gesteld van het voornemen tot het nemen van het
      besluit.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Bij het toepassen van het eerste lid kunnen gedeputeerde staten tevens verklaren dat een bestemmingsplan als
      bedoeld in het eerste lid door de gemeente wordt voorbereid. [Artikel 3.7][ref1] is van overeenkomstige toepassing.
      Een door gedeputeerde staten vastgesteld voorbereidingsbesluit wordt gelijkgesteld met een door de gemeenteraad
      vastgesteld voorbereidingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 4.2.4
    text: |-
      Op de voorbereiding van een besluit tot aanwijzing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. De kennisgeving van het ontwerp-besluit en
      van het besluit tot aanwijzing geschiedt tevens langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.2.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven over de vormgeving, inrichting en
      beschikbaarstelling van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Indien nationale belangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kunnen bij of
      krachtens algemene maatregel van bestuur, op voordracht van Onze Minister of van Onze Minister wie het aangaat in
      overeenstemming met Onze Minister, regels worden gesteld omtrent de inhoud van bestemmingsplannen en provinciale
      inpassingsplannen, daaraan voorafgaande projectbesluiten daaronder begrepen, alsmede van beheersverordeningen.
      Daarbij kan worden bepaald dat een regel slechts geldt voor een daarbij aangegeven gedeelte van het land. Bij
      de vormgeving, inrichting en beschikbaarstelling van de regels wordt overeenkomstige toepassing gegeven aan de
      krachtens [artikel 4.1, vierde lid][ref1], gestelde regels. De kennisgeving van een besluit tot vaststelling van de
      algemene maatregel van bestuur geschiedt tevens langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.3.2
    text: |-
      Tenzij bij de algemene maatregel van bestuur een andere termijn wordt gesteld, stelt de gemeenteraad binnen een
      jaar na inwerkingtreding van de maatregel een bestemmingsplan of een beheersverordening vast met inachtneming van
      de maatregel.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Bij of krachtens een maatregel als bedoeld in het eerste lid kunnen regels worden gesteld die noodzakelijk zijn
      om te voorkomen dat in de maatregel begrepen gronden of bouwwerken minder geschikt worden voor de verwezenlijking
      van het doel van de maatregel zolang geen bestemmingsplan of beheersverordening als bedoeld in het tweede lid in
      werking is getreden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.3
  - number: 4.3.4
    text: |-
      Onze Minister of Onze Minister wie het aangaat in overeenstemming met Onze Minister, kan verklaren dat een
      algemene maatregel van bestuur wordt voorbereid. [Artikel 3.7, tweede, derde, vierde en zevende lid][ref1],
      de [paragrafen 3.4.1][ref2] en [3.4.2][ref3] alsmede [Hoofdstuk IV, afdeling 1, van de Woningwet][ref4] met
      uitzondering van [artikel 57 van die wet][ref5], zijn van overeenkomstige toepassing, met dien verstande dat Onze
      Minister, in voorkomend geval gezamenlijk met Onze Minister wie het aangaat, in de plaats treedt van burgemeester
      en wethouders, tenzij zij bij hun verklaring anders hebben bepaald. Onze Minister, in voorkomend geval gezamenlijk
      met Onze Minister wie het aangaat, verstrekt burgemeester en wethouders de benodigde gegevens, bedoeld in
      [artikel 57 van die wet][ref6], ten behoeve van de aantekening in het openbaar register. Het besluit vervalt bij
      de inwerkingtreding van de algemene maatregel van bestuur doch uiterlijk na negen maanden. Bij de vormgeving,
      inrichting en beschikbaarstelling van het voorbereidingsbesluit wordt overeenkomstige toepassing gegeven aan de
      krachtens [artikel 3.7, achtste lid][ref7], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
