        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 1.1.1.d
    text: |-
      sloopvergunning: vergunning als bedoeld in [artikel 3.3, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 1.1.1.e
    text: |-
      voorbereidingsbesluit: besluit als bedoeld in [artikel 3.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 1.1.1.f
    text: |-
      projectbesluit: besluit, inhoudende dat ten behoeve van de verwezenlijking van een project, dat een of meer
      bouwwerken, werken geen bouwwerken zijnde of werkzaamheden of het daarbij behorende gebruik kan omvatten en dat
      afwijkt van het geldende bestemmingsplan, dit bestemmingsplan buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
  - number: 1.1.2
    text: 'In deze wet en de daarop berustende bepalingen wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
  - number: 1.1.2.a
    text: |-
      grond, gronden of gebied: de onder- en bovengrond op verschillende niveaus, alsmede water, de territoriale zee en
      de exclusieve economische zone daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
  - number: 1.1.2.b
    text: 'vaststellen van een bestemmingsplan: herzien van een bestemmingsplan.'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel1.1
  - number: 2.1.1
    text: |-
      De gemeenteraad stelt ten behoeve van een goede ruimtelijke ordening voor het gehele grondgebied van de gemeente
      een of meer structuurvisies vast. De structuurvisie bevat de hoofdlijnen van de voorgenomen ontwikkeling van dat
      gebied, alsmede de hoofdzaken van het door de gemeente te voeren ruimtelijk beleid. De structuurvisie gaat tevens
      in op de wijze waarop de raad zich voorstelt die voorgenomen ontwikkeling te doen verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.1
  - number: 2.1.2
    text: |-
      De gemeenteraad kan voor aspecten van het gemeentelijk ruimtelijk beleid een structuurvisie vaststellen. De
      structuurvisie bevat de hoofdlijnen van de voorgenomen ontwikkeling van die aspecten. De structuurvisie gaat tevens
      in op de wijze waarop de raad zich voorstelt die voorgenomen ontwikkeling te doen verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.1
  - number: 2.1.3
    text: |-
      De gemeenteraad kan in samenwerking met de raden van aangrenzende gemeenten voor een gebied behorende tot het
      grondgebied van de betrokken gemeenten een structuurvisie vaststellen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Provinciale staten stellen ten behoeve van een goede provinciale ruimtelijke ordening voor het gehele grondgebied
      van de provincie een of meer structuurvisies vast. De structuurvisie bevat de hoofdlijnen van de voorgenomen
      ontwikkeling van dat gebied, alsmede de hoofdzaken van het door de provincie te voeren ruimtelijk beleid. De
      structuurvisie gaat tevens in op de wijze waarop provinciale staten zich voorstellen die voorgenomen ontwikkeling
      te doen verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Provinciale staten kunnen voor aspecten van het provinciaal ruimtelijk beleid een structuurvisie vaststellen. De
      structuurvisie bevat de hoofdlijnen van de voorgenomen ontwikkeling van die aspecten. De structuurvisie gaat tevens
      in op de wijze waarop provinciale staten zich voorstellen die voorgenomen ontwikkeling te doen verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Provinciale staten kunnen in samenwerking met de staten van aangrenzende provincies voor een gebied behorende tot
      het grondgebied van de betrokken provincies een structuurvisie vaststellen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Onze Minister, in overeenstemming met Onze Ministers wie het aangaat, stelt ten behoeve van een goede nationale
      ruimtelijke ordening voor het gehele land een of meer structuurvisies vast. De structuurvisie bevat de hoofdlijnen
      van de voorgenomen ontwikkeling van dat gebied. De structuurvisie gaat tevens in op de wijze waarop Onze Minister
      zich voorstelt die voorgenomen ontwikkeling te doen verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Onze Minister of Onze Minister wie het aangaat, in overeenstemming met Onze Minister, kan ten behoeve van tot
      zijn beleidsterrein behorende aspecten van het nationale ruimtelijk beleid een structuurvisie vaststellen. De
      structuurvisie bevat de hoofdlijnen van de voorgenomen ontwikkeling van die aspecten. De structuurvisie gaat tevens
      in op de wijze waarop Onze Minister of Onze Minister wie het aangaat zich voorstelt die voorgenomen ontwikkeling te
      doen verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Met het vaststellen van een structuurvisie als bedoeld in het eerste en tweede lid wordt niet eerder een aanvang
      gemaakt, dan nadat Onze Minister of Onze Minister wie het aangaat, in overeenstemming met Onze Minister, een
      beschrijving van de inrichting van de voorgenomen structuurvisie aan de Tweede Kamer der Staten-Generaal heeft
      overgelegd en de Tweede Kamer der Staten-Generaal deze beschrijving openbaar behandeld heeft. Indien de Tweede
      Kamer der Staten-Generaal niet binnen vier weken besluit tot openbare behandeling van de beschrijving van de
      inrichting van de voorgenomen structuurvisie, dan kan met het vaststellen van de structuurvisie aangevangen worden.
      Onze Minister of Onze Minister wie het aangaat, in overstemming met Onze Minister, stelt de Tweede Kamer der
      Staten-Generaal schriftelijk op de hoogte van de gevolgtrekkingen die hij aan de behandeling verbindt.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Met verwezenlijking van de structuurvisie wordt niet eerder een aanvang gemaakt dan acht weken nadat Onze
      Minister of Onze Minister wie het aangaat haar aan de Staten-Generaal heeft toegezonden. Indien door of namens
      een der Kamers der Staten-Generaal binnen acht weken na toezending van de structuurvisie te kennen wordt gegeven
      dat zij over de visie in het openbaar wil beraadslagen wordt met verwezenlijking van de structuurvisie niet
      eerder een aanvang gemaakt dan zes maanden na die toezending, dan wel indien de beraadslagingen op een eerder
      tijdstip zijn beëindigd, na die beraadslagingen. Onze Minister of Onze Minister wie het aangaat stelt de Staten-
      Generaal schriftelijk op de hoogte van de gevolgtrekkingen die hij voor het nationaal ruimtelijk beleid aan de
      beraadslagingen verbindt.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.3
  - number: 2.4.1
    text: De kennisgeving van het besluit tot vaststelling van een structuurvisie geschiedt tevens langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorbereiding,
      vormgeving, inrichting en beschikbaarstelling van structuurvisies.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel2.4
  - number: 3.1.1
    text: |-
      De gemeenteraad stelt voor het gehele grondgebied van de gemeente een of meer bestemmingsplannen vast, waarbij
      ten behoeve van een goede ruimtelijke ordening de bestemming van de in het plan begrepen grond wordt aangewezen
      en met het oog op die bestemming regels worden gegeven. Deze regels betreffen in elk geval regels omtrent het
      gebruik van de grond en van de zich daar bevindende bouwwerken. Deze regels kunnen tevens strekken ten behoeve
      van de uitvoerbaarheid van in het plan opgenomen bestemmingen, met dien verstande dat deze regels ten aanzien van
      woningbouwcategorieën uitsluitend betrekking hebben op percentages gerelateerd aan het plangebied.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.1
  - number: 3.1.2
    text: |-
      De bestemming van gronden, met inbegrip van de met het oog daarop gestelde regels, wordt binnen een periode van
      tien jaar, gerekend vanaf de datum van vaststelling van het bestemmingsplan, telkens opnieuw vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Telkens indien de gemeenteraad van oordeel is dat de in het bestemmingsplan aangewezen bestemmingen en de met het
      oog daarop gegeven regels in overeenstemming zijn met een goede ruimtelijke ordening, kan hij, in afwijking van het
      tweede lid, besluiten tot verlenging van de periode van tien jaar, genoemd in dat lid, met tien jaar. In aanvulling
      op [artikel 3.42 van de Algemene wet bestuursrecht][ref1] plaatsen burgemeester en wethouders de kennisgeving van
      het besluit tot verlenging tevens in de Staatscourant en voorts geschiedt deze langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.1.4
    text: |-
      Indien niet voor het verstrijken van de periode van tien jaar, genoemd in het tweede of het derde lid, de
      raad onderscheidenlijk opnieuw een bestemmingsplan heeft vastgesteld dan wel een verlengingsbesluit heeft
      genomen, vervalt de bevoegdheid tot het invorderen van rechten terzake van na dat tijdstip door of vanwege het
      gemeentebestuur verstrekte diensten die verband houden met het bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.1
  - number: 3.1.5
    text: |-
      Van overschrijding van de in het tweede lid bedoelde periode doen burgemeester en wethouders
      schriftelijk mededeling. Zij leggen deze mededeling bij het bestemmingsplan waarin de bestemming
      van de grond laatstelijk is aangewezen, ter gemeentesecretarie voor een ieder ter inzage.
      [Artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing. Van de
      terinzagelegging wordt tevens mededeling gedaan in de Staatscourant en voorts langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '3.2'
    text: |-
      Bij een bestemmingsplan kunnen voorlopige bestemmingen worden aangewezen en met het oog hierop voorlopige regels
      worden gegeven. Een voorlopige bestemming geldt voor een daarbij te stellen termijn van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.2
  - number: '3.3'
    text: |-
      Om te voorkomen dat in een bestemmingsplan begrepen grond minder geschikt wordt voor de verwezenlijking van de
      daaraan bij het plan te geven bestemming dan wel om een overeenkomstig het plan verwezenlijkte bestemming te
      handhaven en te beschermen, kan bij het bestemmingsplan worden bepaald, dat het verboden is om binnen een bij dat
      plan aangegeven gebied zonder of in afwijking van een vergunning van burgemeester en wethouders:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.3
  - number: 3.3.a
    text: bepaalde werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.3
  - number: 3.3.b
    text: bouwwerken te slopen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.3
  - number: '3.4'
    text: |-
      Bij een bestemmingsplan kunnen, voor zover het gronden betreft waarvan het gebruik afwijkt van het plan, een of
      meer onderdelen worden aangewezen ten aanzien waarvan de verwezenlijking in de naaste toekomst nodig wordt geacht.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      Bij een bestemmingsplan kunnen gebieden worden aangewezen waarbinnen de daar aanwezige bouwwerken dienen te worden
      gemoderniseerd of vervangen door gelijksoortige bebouwing van gelijke of nagenoeg gelijke bouwmassa. Zolang deze
      modernisering of vervanging niet is verwezenlijkt, wordt het gebruik van die bouwwerken aangemerkt als afwijkend
      van het plan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Bij een bestemmingsplan kan worden bepaald dat burgemeester en wethouders met inachtneming van de bij het plan te
      geven regels:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.1.a
    text: binnen bij het plan te bepalen grenzen het plan kunnen wijzigen;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.1.b
    text: het plan moeten uitwerken;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.1.c
    text: van bij het plan aan te geven regels ontheffing kunnen verlenen;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.1.d
    text: ten aanzien van in het plan omschreven onderwerpen of onderdelen nadere eisen kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Een wijzigingsbevoegdheid als bedoeld in het eerste lid, onder a, kan mede een uitwerkingsplicht als bedoeld in het
      eerste lid, onder b, inhouden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.3
    text: |-
      Een wijziging of uitwerking als bedoeld in het eerste lid, onder a of b, maakt deel uit van het plan en kan, zolang
      de bestemming nog niet is verwezenlijkt, worden vervangen door een nieuwe wijziging of uitwerking.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.4
    text: |-
      Een ontheffing als bedoeld in het eerste lid, onder c, kan onder beperkingen worden verleend. Aan een ontheffing
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.6.5
    text: |-
      Belanghebbenden worden in de gelegenheid gesteld hun zienswijzen omtrent een voorgenomen ontheffing of nadere
      eis als bedoeld in het eerste lid naar voren te brengen. Op de voorbereiding van een uitwerking of wijziging is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing met dien verstande dat de kennisgeving,
      bedoeld in [artikel 3:12 van die wet][ref2], tevens langs elektronische weg geschiedt, dat het ontwerp-besluit
      met de hierbij behorende stukken tevens langs elektronische weg beschikbaar wordt gesteld, dat burgemeester en
      wethouders binnen acht weken na afloop van de termijn van terinzageligging omtrent de uitwerking of wijziging
      besluiten en dat de kennisgeving van het besluit tot vaststelling van de uitwerking of wijziging tevens langs
      elektronische weg geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.6.6
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overdraagbaarheid van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.6
  - number: 3.7.1
    text: De gemeenteraad kan verklaren dat een bestemmingsplan wordt voorbereid.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Bij het voorbereidingsbesluit wordt bepaald voor welk gebied het geldt en met ingang van welke dag het in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Om te voorkomen dat een bij het voorbereidingsbesluit aangewezen gebied minder geschikt wordt voor de
      verwezenlijking van de daaraan bij het plan te geven bestemming, kan [artikel 3.3][ref1] overeenkomstig worden
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.7.4
    text: |-
      Om te voorkomen dat een bij een voorbereidingsbesluit aangewezen gebied minder geschikt wordt voor de
      verwezenlijking van een daaraan bij het plan te geven bestemming, kan bij het besluit tevens worden bepaald dat het
      verboden is het gebruik van daarbij aangewezen gronden of bouwwerken te wijzigen. Hierbij kan mede worden bepaald
      dat burgemeester en wethouders binnen bij het besluit te geven regels van het verbod ontheffing kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
  - number: 3.7.5
    text: |-
      Een voorbereidingsbesluit vervalt, indien niet binnen een jaar na de datum van inwerkingtreding daarvan een ontwerp
      voor een bestemmingsplan ter inzage is gelegd. Een voorbereidingsbesluit vervalt tevens op het tijdstip waarop het
      bestemmingsplan ter voorbereiding waarvan het besluit is genomen, in werking treedt.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
  - number: 3.7.6
    text: |-
      In afwijking van het vijfde lid, eerste volzin, vervalt een voorbereidingsbesluit voor zover het een gebied
      betreft dat is begrepen in een projectbesluit waarbij toepassing is gegeven aan [artikel 3.13, tweede lid][ref1],
      indien niet binnen de bij dat projectbesluit genoemde termijn een ontwerp voor een bestemmingsplan waarbij dat
      projectbesluit is ingepast, ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3.7.7
    text: |-
      Een voorbereidingsbesluit wordt bekendgemaakt door terinzagelegging van dit besluit.
      [Artikel 3:42 van de Algemene wet bestuursrecht][ref1] is van toepassing. Van het voorbereidingsbesluit wordt
      tevens mededeling gedaan in de Staatscourant en voorts langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.7.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de vormgeving, inrichting en
      beschikbaarstelling van het voorbereidingsbesluit.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.7
  - number: 3.8.1
    text: |-
      Op de voorbereiding van een bestemmingsplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.8.1.a
    text: |-
      de kennisgeving, bedoeld in [artikel 3:12 van die wet][ref1], tevens in de Staatscourant wordt geplaatst en
      voorts langs elektronische weg geschiedt, en het ontwerp-besluit met de hierbij behorende stukken tevens langs
      elektronische weg wordt beschikbaar gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.8.1.b
    text: |-
      de kennisgeving, bedoeld in het eerste lid, onder a, gelijktijdig met de daar bedoelde plaatsing langs
      elektronische weg wordt toegezonden aan die diensten van Rijk en provincie die belast zijn met de behartiging van
      belangen die in het plan in het geding zijn, aan de betrokken waterschapsbesturen en aan de besturen van bij het
      plan een belang hebbende gemeenten;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
  - number: 3.8.1.c
    text: |-
      indien in het ontwerp gronden zijn aangewezen waarvan de bestemming in de naaste toekomst voor verwezenlijking in
      aanmerking komt, kennisgeving tevens geschiedt aan diegenen die in de basisregistratie kadaster staan vermeld als
      eigenaar van die gronden of als beperkt gerechtigde op die gronden;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
  - number: 3.8.1.d
    text: door een ieder zienswijzen omtrent het ontwerp bij de gemeenteraad naar voren kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
  - number: 3.8.1.e
    text: |-
      de gemeenteraad binnen twaalf weken na de termijn van terinzageligging beslist omtrent vaststelling van het
      bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
  - number: 3.8.2
    text: |-
      Voor zover het ontwerp van een bestemmingsplan zijn grondslag vindt in een aanwijzing, die betrekking heeft op een
      daarbij concreet aangegeven locatie, waarvan geen afwijking mogelijk is, kunnen zienswijzen daarop geen betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
  - number: 3.8.3
    text: |-
      De bekendmaking van het besluit tot vaststelling van het bestemmingsplan geschiedt binnen twee weken na de
      vaststelling. Burgemeester en wethouders plaatsen de kennisgeving van het besluit tot vaststelling van het
      bestemmingsplan tevens in de Staatscourant en voorts geschiedt deze langs elektronische weg. Gelijktijdig verzenden
      zij de kennisgeving, bedoeld in de vorige volzin, langs elektronische weg aan de diensten en bestuursorganen
      bedoeld in het eerste lid, onder b, en stellen zij het besluit met de hierbij behorende stukken langs elektronische
      weg beschikbaar. In afwijking van [artikel 3.1, eerste lid, onder b, van de Algemene wet bestuursrecht][ref1] zijn
      op een besluit tot vaststelling van het bestemmingsplan de [artikelen 3:40][ref2], [3:42][ref3] en [3:45][ref4] en
      [afdeling 3.7 van die wet][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.7
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005537
        afdeling: '3.7'
  - number: 3.8.4
    text: |-
      In afwijking van het derde lid wordt het besluit tot vaststelling van het bestemmingsplan zes weken na de
      vaststelling bekendgemaakt, indien door gedeputeerde staten of de inspecteur een zienswijze is ingediend en
      deze niet volledig is overgenomen of indien de gemeenteraad bij de vaststelling van het bestemmingsplan daarin
      wijzigingen heeft aangebracht ten opzichte van het ontwerp, anders dan op grond van zienswijzen van gedeputeerde
      staten of de inspecteur. In zodanig geval zenden burgemeester en wethouders na de vaststelling onverwijld langs
      elektronische weg het raadsbesluit aan gedeputeerde staten onderscheidenlijk de inspecteur.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
  - number: 3.8.5
    text: |-
      Het besluit tot vaststelling van het bestemmingsplan treedt in werking met ingang van de dag na die waarop de
      beroepstermijn afloopt, tenzij het zesde lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
  - number: 3.8.6
    text: |-
      Indien aan de in het vierde lid bedoelde voorwaarden is voldaan kunnen gedeputeerde staten onderscheidenlijk
      Onze Minister, onverminderd andere aan hen toekomende bevoegdheden, binnen de in dat lid genoemde
      termijn met betrekking tot het desbetreffende onderdeel van het vastgestelde bestemmingsplan aan
      de gemeenteraad een aanwijzing als bedoeld in [artikel 4.2, eerste lid][ref1], onderscheidenlijk
      [artikel 4.4, eerste lid, onder a][ref2], geven, ertoe strekkende dat dat onderdeel geen deel blijft uitmaken van
      het bestemmingsplan zoals het is vastgesteld. [Artikel 4.2, tweede tot en met vierde lid][ref3], onderscheidenlijk
      [artikel 4.4, tweede tot en met vierde lid][ref4], zijn op deze aanwijzing niet van toepassing. Gedeputeerde staten
      onderscheidenlijk Onze Minister vermelden in de redengeving de aan het besluit ten grondslag liggende feiten,
      omstandigheden en overwegingen die de provincie onderscheidenlijk het Rijk beletten het betrokken provinciaal
      onderscheidenlijk nationaal belang met inzet van andere aan hen toekomende bevoegdheden te beschermen. Het
      besluit tot vaststelling van het bestemmingsplan wordt alsdan met uitsluiting van dat onderdeel, samen met het
      aanwijzingsbesluit bekendgemaakt. De in het vierde lid genoemde termijn wordt hiertoe met een week verlengd. Zodra
      het aanwijzingsbesluit onherroepelijk is geworden vervalt het vaststellingsbesluit voor dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.9.1
    text: |-
      [Artikel 3.8][ref1] is niet van toepassing op de afwijzing van een aanvraag om een bestemmingsplan vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.9.2
    text: |-
      Tot een afwijzing als bedoeld in het eerste lid besluit de gemeenteraad zo spoedig mogelijk doch in elk geval
      binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.9
  - number: 3.10.1
    text: |-
      De gemeenteraad kan ten behoeve van de verwezenlijking van een project van gemeentelijk belang een projectbesluit
      nemen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.10
  - number: 3.10.2
    text: Het besluit bevat een goede ruimtelijke onderbouwing van het project.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.10
  - number: 3.10.3
    text: |-
      Aan het besluit kunnen voorschriften en beperkingen worden verbonden, welke tevens kunnen strekken ten behoeve
      van de uitvoerbaarheid van het project, met dien verstande dat de voorschriften en beperkingen ten aanzien van
      woningbouwcategorieën uitsluitend betrekking hebben op percentages gerelateerd aan het projectgebied.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.10
  - number: 3.10.4
    text: De gemeenteraad kan de bevoegdheid, bedoeld in het eerste lid, delegeren aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.10
  - number: 3.11.1
    text: |-
      Op de voorbereiding van een projectbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing, met dien verstande dat


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.11.1.a
    text: |-
      de kennisgeving, bedoeld in [artikel 3:12 van die wet][ref1], tevens in de Staatscourant wordt geplaatst en voorts
      langs elektronische weg geschiedt, en het ontwerp met de hierbij behorende stukken langs elektronische weg wordt
      beschikbaar gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.11.1.b
    text: |-
      de kennisgeving, bedoeld in het eerste lid, onder a, gelijktijdig met de daar bedoelde plaatsing langs
      elektronische weg wordt toegezonden aan die diensten van Rijk en provincie die belast zijn met de behartiging van
      belangen die in het besluit in het geding zijn, aan de betrokken waterschapsbesturen en aan de besturen van bij het
      besluit een belang hebbende gemeenten;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.11
  - number: 3.11.1.c
    text: |-
      kennisgeving tevens geschiedt aan diegenen die in de kadastrale registratie staan vermeld als eigenaar van de in
      het ontwerp-besluit begrepen gronden of als beperkt gerechtigde op die gronden;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.11
  - number: 3.11.1.d
    text: door een ieder zienswijzen omtrent het ontwerp-besluit naar voren kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.11
  - number: 3.11.1.e
    text: binnen twaalf weken na de termijn van terinzageligging wordt beslist omtrent vaststelling van het projectbesluit.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.11
  - number: 3.11.2
    text: |-
      [Artikel 3.8, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat in
      deze leden in plaats van «het bestemmingsplan», «het besluit tot vaststelling van het bestemmingsplan», «het
      vastgestelde bestemmingsplan» en «het vaststellingsbesluit» telkens wordt gelezen: het projectbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.12.1
    text: |-
      [Artikel 3.11][ref1] is niet van toepassing op de afwijzing van een aanvraag om een projectbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3.12.2
    text: |-
      Tot een afwijzing als bedoeld in het eerste lid besluit de gemeenteraad zo spoedig mogelijk doch in elk geval
      binnen acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Binnen een jaar nadat het projectbesluit onherroepelijk is geworden leggen burgemeester en wethouders een ontwerp
      voor een bestemmingsplan overeenkomstig dat projectbesluit ter inzage.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.13
  - number: 3.13.2
    text: Bij het projectbesluit kan de in het eerste lid genoemde termijn worden verlengd met
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.13
  - number: 3.13.2.a
    text: |-
      maximaal twee jaar indien op het tijdstip waarop dat besluit wordt genomen aannemelijk is dat de
      inpassing van het project in het bestemmingsplan zal plaatsvinden tezamen met de vaststelling ingevolge
      [artikel 3.1, tweede lid][ref1], van dat plan, of


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.13.2.b
    text: |-
      maximaal vier jaar indien op het tijdstip waarop dat besluit wordt genomen aannemelijk is dat de inpassing van
      het project in het bestemmingsplan zal plaatsvinden tezamen met de inpassing in dat plan van een project op
      aangrenzende gronden of op gronden die betrokken zijn in hetzelfde uit te werken bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.13
  - number: 3.13.3
    text: |-
      In afwijking van het eerste lid kan de gemeenteraad binnen een jaar nadat het projectbesluit onherroepelijk is
      geworden toepassing geven aan [artikel 3.38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 3.13.4
    text: |-
      De bevoegdheid tot het invorderen van rechten terzake van door of vanwege het gemeentebestuur verstrekte diensten
      die verband houden met het projectbesluit, wordt opgeschort tot het tijdstip waarop het bestemmingsplan dan wel de
      beheersverordening is vastgesteld waarin het project is ingepast. De bevoegdheid vervalt indien het bestemmingsplan
      dan wel de beheersverordening niet binnen zes maanden na het verstrijken van de in het eerste lid gestelde, in
      voorkomend geval krachtens het tweede lid verlengde, onderscheidenlijk de in het derde lid gestelde termijn is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.13
  - number: '3.14'
    text: |-
      Voor zover een ontwerp van een bestemmingsplan zijn grondslag vindt in een projectbesluit als bedoeld in
      [artikel 3.10][ref1], en dit ontwerp binnen de termijn bedoeld in [artikel 3.13, eerste of tweede lid][ref2], ter
      inzage is gelegd, kunnen zienswijzen geen betrekking hebben op dat deel van het ontwerp-bestemmingsplan dat zijn
      grondslag vindt in het projectbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '3.15'
    text: |-
      In de [artikelen 3.13][ref1] en [3.14][ref2] wordt onder «bestemmingsplan» mede begrepen een uitwerking van een
      bestemmingsplan als bedoeld in [artikel 3.6, eerste lid, aanhef en onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.16.1
    text: 'De aanlegvergunning mag alleen en moet worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
  - number: 3.16.1.a
    text: |-
      het werk of de werkzaamheid in strijd is met een bestemmingsplan een inpassingsplan, een projectbesluit onder deze
      plannen begrepen, of de krachtens zodanige plannen gestelde eisen, een beheersverordening, een besluit als bedoeld
      in [artikel 3.40][ref1], [3.41][ref2] of [3.42][ref3] hieronder begrepen, dan wel met een voorbereidingsbesluit;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 3.16.1.b
    text: |-
      voor het werk of de werkzaamheid een vergunning ingevolge de [Monumentenwet 1988][ref1], een provinciale of
      gemeentelijke monumentenverordening is vereist en deze niet is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 3.16.1.c
    text: |-
      het werk of de werkzaamheid in strijd is met de regels, gesteld bij of krachtens een verordening als bedoeld
      in [artikel 4.1, derde lid][ref1], of bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 4.3, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.16.2
    text: De vergunning kan onder beperkingen worden verleend en aan de vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
  - number: 3.16.3
    text: |-
      Indien de vergunning betrekking heeft op een beschermd stads- of dorpsgezicht respectievelijk een archeologisch
      attentiegebied als bedoeld in de [Monumentenwet 1988][ref1] zenden burgemeester en wethouders terstond na de
      bekendmaking een afschrift van hun besluit aan de Rijksdienst voor Archeologie, Cultuurlandschap en Monumenten
      respectievelijk aan deze Rijksdienst en aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 3.16.4
    text: |-
      De vergunning treedt, onverminderd het bepaalde in [artikel 8.4, derde lid][ref1], in werking met ingang van de
      zevende week na de dag waarop zij is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel8
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 3.16.5
    text: Bij algemene maatregel van bestuur worden regels gegeven omtrent de overdraagbaarheid van de aanlegvergunning.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.16
  - number: 3.17.1
    text: |-
      Indien het werk of de werkzaamheid slechts toelaatbaar is ingevolge een voorlopige bestemming of een voorlopige
      gebruiksregel, stellen burgemeester en wethouders overeenkomstig hetgeen bij het bestemmingsplan omtrent de duur
      van de bestemming is bepaald, in de vergunning een termijn na het verstrijken waarvan het werk of de werkzaamheid
      moet worden verwijderd of beëindigd of op andere wijze met het bestemmingsplan in overeenstemming moet worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Na het verstrijken van de in het eerste lid bedoelde termijn is de rechthebbende of zijn rechtsopvolger verplicht
      te zijner keuze het werk of de werkzaamheid te verwijderen of te beëindigen of in overeenstemming te brengen met
      het bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.17
  - number: 3.18.1
    text: |-
      Burgemeester en wethouders beslissen omtrent een aanvraag voor een aanlegvergunning binnen zes weken na de dag van
      ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.2
    text: |-
      In afwijking van het eerste lid houden burgemeester en wethouders de beslissing aan, indien er geen grond is de
      vergunning te weigeren en voor het gebied waarin het werk of de werkzaamheid zal worden uitgevoerd vóór de dag van
      ontvangst van de aanvraag:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.2.a
    text: een voorbereidingsbesluit in werking is getreden;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.2.b
    text: een bestemmingsplan in ontwerp ter inzage is gelegd;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.2.c
    text: |-
      een verklaring als bedoeld in [artikel 4.1, vijfde lid][ref1], of [artikel 4.3, vierde lid][ref2], is
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.18.3
    text: 'De aanhouding duurt totdat:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.3.a
    text: |-
      het voorbereidingsbesluit overeenkomstig [artikel 3.7, vijfde of zesde lid][ref1], is vervallen;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.18.3.b
    text: |-
      de termijn voor de vaststelling van het bestemmingsplan ingevolge [artikel 3.8, eerste lid, onder e][ref1], is
      overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.18.3.c
    text: |-
      de termijn voor de bekendmaking van het bestemmingsplan na de vaststelling ingevolge
      [artikel 3.8, derde, vierde of zesde lid][ref1], is overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.18.3.d
    text: het bestemmingsplan in werking is getreden;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.3.e
    text: |-
      de termijn genoemd in [artikel 4.1, vijfde lid][ref1], of [artikel 4.3, vierde lid][ref2], is overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.18.3.f
    text: |-
      de verordening, bedoeld in [artikel 4.1][ref1], of de algemene maatregel van bestuur, bedoeld in
      [artikel 4.3][ref2], in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.18.4
    text: 'In afwijking van het tweede lid kan de aanlegvergunning worden verleend indien:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.4.a
    text: het werk of de werkzaamheid niet in strijd is met het in voorbereiding zijnde bestemmingsplan, of
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: 3.18.4.b
    text: |-
      het een werk of werkzaamheid betreft ten aanzien waarvan [artikel 3.10][ref1], [3.22][ref2], [3.23][ref3],
      [3.27][ref4], [3.29][ref5], [3.40][ref6], [3.41][ref7] of [3.42][ref8] wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref6
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref7
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref8
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 3.18.5
    text: |-
      In afwijking van het eerste lid houden burgemeester en wethouders de beslissing eveneens aan indien er geen grond
      is de vergunning te weigeren en de aanvraag een werk of werkzaamheid betreft in een gebied, behorend tot een
      beschermd stads- of dorpsgezicht als bedoeld in de [Monumentenwet 1988][ref1], waarvoor nog geen ter bescherming
      daarvan strekkend bestemmingsplan of beheersverordening geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 3.18.6
    text: |-
      De aanhouding, bedoeld in het vijfde lid, duurt totdat een ter voldoening aan
      [artikel 36 van de Monumentenwet 1988][ref1] vast te stellen bestemmingsplan of beheersverordening in werking is
      getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel36
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '36'
  - number: 3.18.7
    text: |-
      Onverminderd het vierde lid, kunnen burgemeester en wethouders, in afwijking van het vijfde lid de aanlegvergunning
      verlenen indien het werk of de werkzaamheid niet strijdt met het in voorbereiding zijnde ter bescherming van het
      beschermde stads- of dorpsgezicht strekkende bestemmingsplan, een projectbesluit daaronder begrepen. Alvorens te
      besluiten horen burgemeester en wethouders de Rijksdienst voor Archeologie, Cultuurlandschap en Monumenten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.18
  - number: '3.19'
    text: 'Burgemeester en wethouders kunnen een aanlegvergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.19
  - number: 3.19.a
    text: blijkt dat de vergunning ten gevolge van een onjuiste of onvolledige opgave is verleend;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.19
  - number: 3.19.b
    text: |-
      binnen een bij de vergunning te bepalen termijn na de dagtekening van de vergunning geen begin met de werkzaamheden
      is gemaakt;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.19
  - number: 3.19.c
    text: de werkzaamheden langer dan een in de vergunning te bepalen termijn zijn gestaakt;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.19
  - number: 3.19.d
    text: |-
      in strijd wordt gehandeld met beperkingen waaronder de vergunning is verleend of met de voorschriften die aan de
      vergunning zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.19
  - number: 3.20.1
    text: |-
      Een sloopvergunning als bedoeld in [artikel 3.3][ref1] is niet vereist voor het slopen:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.20.1.a
    text: ingevolge een aanschrijving van burgemeester en wethouders ingevolge hoofdstuk III, afdeling 2, van de Woningwet;
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
  - number: 3.20.1.b
    text: |-
      van bouwwerken waarvoor ingevolge [artikel 43 van de Woningwet][ref1] geen bouwvergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: 3.20.2
    text: |-
      De sloopvergunning mag worden geweigerd indien een bouwvergunning kan worden verleend voor een in plaats van het te
      slopen bouwwerk op te richten bouwwerk doch deze vergunning nog niet is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
  - number: 3.20.3
    text: 'De sloopvergunning moet worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
  - number: 3.20.3.a
    text: |-
      ingevolge de [Monumentenwet 1988][ref1], een provinciale of een gemeentelijke monumentenverordening voor het slopen
      van het bouwwerk vergunning is vereist en deze niet is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 3.20.3.b
    text: |-
      de sloop in strijd zou zijn met de regels, gesteld bij of krachtens een verordening als bedoeld in
      [artikel 4.1, derde lid][ref1], of bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 4.3, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.20.4
    text: |-
      Burgemeester en wethouders beslissen omtrent een aanvraag voor een sloopvergunning binnen twaalf weken na de
      dag van ontvangst van de aanvraag. Indien de vergunning een woonkeet betreft onderscheidenlijk een bouwwerk dat
      behoort tot een beschermd stads- of dorpsgezicht als bedoeld in de [Monumentenwet 1988][ref1], doen burgemeester
      en wethouders tegelijk met of zo spoedig mogelijk na de bekendmaking mededeling van de aan beslissing aan de
      inspecteur onderscheidenlijk de Rijksdienst voor Archeologie, Cultuurlandschap en Monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 3.20.5
    text: |-
      In afwijking van het vierde lid kunnen burgemeester en wethouders de beslissing omtrent de sloopvergunning
      aanhouden indien voor een in de plaats van het te slopen bouwwerk op te richten bouwwerk bouwvergunning is
      aangevraagd, doch op die aanvraag nog niet onherroepelijk is beslist. De aanhouding duurt totdat onherroepelijk op
      de aanvraag om bouwvergunning is beslist.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
  - number: 3.20.6
    text: De vergunning kan onder beperkingen worden verleend en aan de vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
  - number: 3.20.7
    text: |-
      De vergunning treedt, onverminderd het bepaalde in [artikel 8.4, derde lid][ref1], in werking met ingang van de
      zevende week na de dag waarop zij is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel8
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 3.20.8
    text: Bij algemene maatregel van bestuur worden regels gegeven omtrent de overdraagbaarheid van de sloopvergunning.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.20
  - number: '3.21'
    text: |-
      Burgemeester en wethouders kunnen een sloopvergunning intrekken. [Artikel 3.19][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 3.22.1
    text: |-
      Burgemeester en wethouders kunnen met het oog op de voorziening in een tijdelijke behoefte voor een bepaalde
      termijn ontheffing verlenen van een bestemmingsplan. De termijn kan ten hoogste vijf jaar belopen. Aan de
      ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.22
  - number: 3.22.2
    text: |-
      Bij een bestemmingsplan kan de toepasselijkheid van dit artikel worden uitgesloten indien het belang ter
      bescherming waarvan een bepaalde bestemming in het plan is opgenomen zich niet verdraagt met een tijdelijke
      ontheffing als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.22
  - number: 3.22.3
    text: |-
      Na het verstrijken van de in het eerste lid genoemde termijn is degene aan wie de ontheffing is verleend of zijn
      rechtsopvolger onder algemene titel verplicht de met het bestemmingsplan strijdige situatie te zijner keuze hetzij
      in de oorspronkelijke toestand te herstellen hetzij met het bestemmingsplan in overeenstemming te brengen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld die bij het verlenen van tijdelijke ontheffing in
      acht genomen moeten worden. Tevens kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld
      omtrent de vormgeving, inrichting en beschikbaarstelling van de tijdelijke ontheffing.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Burgemeester en wethouders kunnen ten behoeve van bij of krachtens algemene maatregel van bestuur aan te geven
      gevallen ontheffing verlenen van het bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.23
  - number: 3.23.2
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.23
  - number: 3.23.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld die in acht genomen moeten worden alvorens
      ontheffing mag worden verleend. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld
      omtrent de vormgeving, inrichting en beschikbaarstelling alsmede omtrent de overdraagbaarheid van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.23
  - number: 3.24.1
    text: |-
      Burgemeester en wethouders beslissen binnen vier weken na ontvangst van de aanvraag voor een ontheffing als bedoeld
      in [artikel 3.22][ref1] of [3.23][ref2] of toepassing zal worden gegeven aan het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
  - number: 3.24.2
    text: Als besloten wordt geen toepassing te geven aan het derde lid, wordt de ontheffing geweigerd.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.24
  - number: 3.24.3
    text: |-
      Op de voorbereiding van een besluit omtrent een ontheffing als bedoeld in [artikel 3.22][ref1] of [3.23][ref2]
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing, met dien verstande dat burgemeester
      en wethouders binnen vier weken na afloop van de termijn van terinzageligging beslissen. De kennisgeving van het
      ontwerp-besluit en van het besluit tot ontheffing, bedoeld in [artikel 3.22][ref4] of [3.23][ref5], geschiedt
      tevens langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.24
