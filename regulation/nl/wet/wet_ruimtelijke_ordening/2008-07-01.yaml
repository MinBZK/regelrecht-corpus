        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 8.2.1.h
    text: |-
      een besluit omtrent vaststelling van een exploitatieplan voor gronden, begrepen in een gelijktijdig vastgesteld
      bestemmingsplan of wijzigingsplan als bedoeld in [artikel 3.6, eerste lid][ref1], alsmede herzieningen van het
      desbetreffende exploitatieplan en besluiten omtrent de afrekening en herberekende exploitatiebijdragen van het
      desbetreffende exploitatieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 8.2.2
    text: |-
      Bij een beroep tegen een besluit als bedoeld in het eerste lid, onder a, kunnen geen gronden worden aangevoerd die
      betrekking hebben op een aanwijzing als bedoeld in het eerste lid, onder f, waarop dat besluit berust.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
  - number: 8.2.3
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State beslist op een beroep als bedoeld in het eerste lid, onder a,
      b, c, d, g of h binnen twaalf maanden na afloop van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
  - number: 8.2.4
    text: |-
      Indien het beroep een bestemmingsplan betreft waarin ingevolge [artikel 3.4][ref1] onderdelen zijn aangewezen ten
      aanzien waarvan de verwezenlijking in de naaste toekomst nodig wordt geacht, wordt het beroep behandeld voor andere
      ingestelde beroepen als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 8.2.5
    text: |-
      Als belanghebbende bij een besluit als bedoeld in de [artikelen 6.12, eerste en tweede lid][ref1], en
      [6.15, eerste lid][ref2], wordt in elk geval aangemerkt degene die een grondexploitatieovereenkomst heeft gesloten
      met betrekking tot de in het desbetreffende besluit opgenomen gronden, of die eigenaar is van die gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 8.3.1
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als één
      besluit aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 8.3.1.a
    text: |-
      indien toepassing is gegeven aan [artikel 3.30, eerste lid, onder a][ref1], [3.33, eerste lid, onder a][ref2], of
      [3.35, eerste lid, onder a][ref3], de daarbedoelde besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.3
        afdeling: '3.6'
  - number: 8.3.1.b
    text: |-
      indien toepassing is gegeven aan [artikel 3.30, eerste lid, onder b][ref1], [3.33, eerste lid, onder b][ref2],
      of [3.35, eerste lid, onder b][ref3], het besluit omtrent vaststelling van het daarbedoelde bestemmingsplan en de
      daarbedoelde besluiten,


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.3
        afdeling: '3.6'
  - number: 8.3.2
    text: |-
      De bevoegde rechter beslist op een beroep als bedoeld in het eerste lid binnen zes maanden na ontvangst van het
      verweerschrift.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.3
  - number: 8.3.3
    text: |-
      Voor de mogelijkheid van beroep en de behandeling van en uitspraak op een beroep ingevolge
      [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als één besluit aangemerkt een besluit omtrent
      vaststelling van een exploitatieplan en een gelijktijdig vastgesteld bestemmingsplan of inpassingsplan,
      projectbesluit of besluit als bedoeld in [artikel 3.40, eerste lid][ref2], [3.41, eerste lid,][ref3] of
      [3.42, eerste lid][ref4], of een gelijktijdig vastgestelde wijziging of uitwerking van een bestemmingsplan of
      inpassingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 8.4.1
    text: |-
      Indien gedurende de beroepstermijn met betrekking tot een besluit tot vaststelling van een bestemmingsplan of
      inpassingsplan of van een wijziging of uitwerking hiervan bij de voorzitter van de Afdeling bestuursrechtspraak
      van de Raad van State een verzoek om voorlopige voorziening is gedaan, wordt de werking van het besluit opgeschort
      totdat op het verzoek is beslist. Bij de toewijzing van het verzoek geeft de voorzitter aan op welke onderdelen
      van het bestemmingsplan of inpassingsplan of van de wijziging of uitwerking hiervan de voorlopige voorziening
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.4
  - number: 8.4.2
    text: |-
      Indien gedurende de beroepstermijn met betrekking tot een projectbesluit als bedoeld in [artikel 3.10][ref1],
      [3.27][ref2] of [3.29][ref3] of een besluit als bedoeld in [artikel 3.40][ref4], [3.41][ref5] of [3.42][ref6] bij
      de bevoegde rechter een verzoek om voorlopige voorziening is gedaan, wordt de werking van het besluit opgeschort
      totdat op het verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
      - id: ref6
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: 3A
  - number: 8.4.3
    text: |-
      Indien gedurende de beroepstermijn met betrekking tot een besluit tot het verlenen van een aanleg- of
      sloopvergunning dan wel een ontheffing als bedoeld in [artikel 3.22][ref1] of [3.23][ref2] een verzoek om
      voorlopige voorziening is gedaan, wordt de werking van het besluit opgeschort totdat op het verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.3
        afdeling: '3.4'
  - number: 8.5.1
    text: |-
      Onze Minister kan namens de Staat tot oprichting overgaan van een stichting die tot doel heeft de taak te
      verrichten, bedoeld in [artikel 8.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel8
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.5.2
    text: |-
      Wijziging van de statuten van de stichting of ontbinding van de stichting behoeft de instemming van Onze Minister.
      Alvorens te beslissen over de toestemming hoort Onze Minister de Afdeling bestuursrechtspraak van de Raad van
      State.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.5
  - number: 8.5.3
    text: De statuten waarborgen dat de stichting haar werkzaamheden onpartijdig en onafhankelijk verricht.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.5
  - number: '8.6'
    text: |-
      De stichting heeft tot taak aan de administratieve rechter op diens verzoek deskundigenbericht uit te brengen
      inzake beroepen op grond van deze wet. Op verzoek van de administratieve rechter brengt de stichting tevens
      deskundigenbericht uit inzake beroepen op grond van andere wetten voor zover het onderwerpen betreft die
      samenhangen met de ruimtelijke ordening.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.6
  - number: '8.7'
    text: |-
      De personen die deel uitmaken van de organen van de stichting en het personeel van de stichting vervullen geen
      functies en betrekkingen waarvan de uitoefening ongewenst is met het oog op de handhaving van de onpartijdigheid en
      onafhankelijkheid van de stichting dan wel het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.7
  - number: 8.8.1
    text: |-
      Indien met toepassing van [artikel 8.5][ref1] een stichting is opgericht, verstrekt Onze Minister aan de stichting
      een subsidie overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen voorschriften, voor zover
      dat redelijkerwijs noodzakelijk is voor een goede taakuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel8
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.8.2
    text: |-
      [Artikel 8:36, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 9.1.1
    text: |-
      Er is in elke provincie een provinciale planologische commissie ten behoeve van het overleg over en de coördinatie
      van zaken betreffende provinciaal ruimtelijk beleid.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel9.1
  - number: 9.1.2
    text: |-
      Bij provinciale verordening worden regels gesteld omtrent de benoeming, samenstelling, taak en werkwijze van de
      commissie.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel9.1
  - number: 9.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld terzake van de verordening, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel9.1
  - number: 10.1.1
    text: |-
      Burgemeester en wethouders en Onze Minister maken jaarlijks hun voornemens bekend met betrekking tot de wijze
      waarop in het komende jaar uitvoering zal worden gegeven aan de bestuursrechtelijke handhaving van het bepaalde bij
      of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.1
  - number: 10.1.2
    text: |-
      Burgemeester en wethouders en Onze Minister doen jaarlijks verslag aan de gemeenteraad onderscheidenlijk de Staten-
      Generaal van de wijze waarop in het voorafgaande jaar uitvoering is gegeven aan de bestuursrechtelijke handhaving
      van het bepaalde bij of krachtens deze wet, alsmede van het door hen gevoerde beleid bij de uitvoering van de
      [hoofdstukken 3][ref1], [3a][ref2] en [4][ref3]. Gedeputeerde staten doen jaarlijks verslag aan provinciale staten
      van het door hen gevoerde beleid bij de uitvoering van de laatstgenoemde hoofdstukken. Burgemeester en wethouders
      en gedeputeerde staten zenden gelijktijdig met de aanbieding van het verslag aan de gemeenteraad, onderscheidenlijk
      provinciale staten een afschrift ervan aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk3A
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020449
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0020449
        hoofdstuk: '4'
  - number: 10.2.1
    text: |-
      Onderstaande personen, niet zijnde toezichthouders, hebben in de hierna genoemde gebieden toegang tot alle
      terreinen en gebouwen, niet zijnde woningen, voor zover dat redelijkerwijs voor de uitvoering van deze wet nodig
      is:
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.2
  - number: 10.2.1.a
    text: 'in het gehele land: de door Onze Minister aan te wijzen personen;'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.2
  - number: 10.2.1.b
    text: 'in een provincie: de door de Commissaris van de Koning aan te wijzen personen;'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.2
  - number: 10.2.1.c
    text: 'in een gemeente: de burgemeester en de door hem aan te wijzen personen.'
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.2
  - number: 10.2.2
    text: |-
      Bij algemene maatregel van bestuur kan worden voorgeschreven dat ten aanzien van bepaalde terreinen of gebouwen de
      in het eerste lid bedoelde bevoegdheid slechts wordt uitgeoefend door bepaalde van de in het eerste lid genoemde
      personen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.2
  - number: 10.2.3
    text: De in het eerste lid bedoelde personen verschaffen zich zo nodig toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.2
  - number: 10.3.1
    text: |-
      Ten aanzien van gronden die geen deel uitmaken van het grondgebied van een gemeente of een provincie kan, voor
      zover zulks bij algemene maatregel van bestuur, op voordracht van Onze Minister gezamenlijk met Onze Minister van
      Verkeer en Waterstaat, is bepaald, een rijksbestemmingsplan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel10.3
  - number: 10.3.2
    text: |-
      Op het rijksbestemmingsplan, bedoeld in het eerste lid, zijn van [hoofdstuk 3][ref1] de [afdelingen 3.1][ref2],
      [3.2][ref3], met uitzondering van [artikel 3.8, vierde en zesde lid][ref4], de [afdelingen 3.3][ref5] en
      [3.4][ref6], [§ 3.6.1][ref7] en [afdeling 3.7][ref8] waar mogelijk van overeenkomstige toepassing, met dien
      verstande dat Onze Minister in de plaats treedt van de gemeenteraad en van burgemeester en wethouders, en dat in
      [artikel 3.11, tweede lid][ref9], in plaats van «[artikel 3.8, derde tot en met zesde lid][ref10]» wordt gelezen:
      [artikel 3.8, derde en vijfde lid][ref11].


