        afdeling: '3.6'
  - number: 3.35.8
    text: |-
      Voor zover de verwezenlijking van een onderdeel van het nationaal ruimtelijk beleid onevenredig wordt belemmerd
      door bepalingen die – al dan niet krachtens de wet – bij of krachtens een regeling van een provincie, gemeente
      of waterschap zijn vastgesteld, kunnen die bepalingen bij het nemen en uitvoeren van de besluiten, bedoeld in het
      eerste lid, onder a of b, om dringende redenen buiten toepassing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.35
  - number: 3.35.8
    text: |-
      Een besluit als bedoeld in de aanhef van het eerste lid, wordt toegezonden aan de beide Kamers der Staten-Generaal.
      Aan het besluit wordt geen uitvoering gegeven dan nadat beide Kamers daarmee hebben ingestemd. Met het besluit
      wordt geacht te zijn ingestemd indien geen van beide Kamers binnen vier weken na de toezending van dat besluit een
      besluit heeft genomen omtrent de behandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.35
  - number: 3.36.1
    text: |-
      Indien een bestuursorgaan dat in eerste aanleg bevoegd is een besluit als bedoeld in
      [artikel 3.35, eerste lid, onder a][ref1], te nemen, niet of niet tijdig overeenkomstig de aanvraag beslist,
      dan wel een beslissing neemt die naar het oordeel van Onze ingevolge [artikel 3.35, derde lid][ref2], aangewezen
      Minister en Onze Minister wie het mede aangaat wijziging behoeft, kunnen Onze bedoelde Ministers gezamenlijk een
      beslissing nemen. In dat geval treedt dit besluit in de plaats van het besluit van het in eerste aanleg bevoegde
      bestuursorgaan. Indien Onze in de eerste volzin bedoelde Ministers voornemens zijn zelf een beslissing te nemen,
      plegen zij overleg met het bestuursorgaan dat in eerste aanleg bevoegd is te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.36
    references:
      - id: ref1
