  - number: 4.4.4
    text: |-
      Op de voorbereiding van een besluit tot aanwijzing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. De kennisgeving van het ontwerp-besluit en
      van het besluit tot aanwijzing geschiedt tevens langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.4.5
    text: |-
      De bij of krachtens de algemene maatregel van bestuur gegeven regels, bedoeld in [artikel 4.2, vijfde lid][ref1],
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
