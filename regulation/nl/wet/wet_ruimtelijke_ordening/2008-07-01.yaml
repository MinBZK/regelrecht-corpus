  - number: 3.36.2
    text: |-
      Indien bij toepassing van het eerste lid de beslissing op een aanvraag wordt genomen door Onze in dat lid bedoelde
      Ministers, stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter zake
      ontvangen leges in ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.36
  - number: 3.36a.1
    text: |-
      Gevallen waarop krachtens de [artikelen 3.30][ref1], [3.33][ref2] of [3.35][ref3] de [artikelen 3.31][ref4]
      en [3.32][ref5] dan wel de [artikelen 3.31][ref6] en [3.32][ref7] in samenhang met de [artikelen 3.8][ref8]
      of [3.11][ref9] worden toegepast, worden voor de toepassing van de [Belemmeringenwet Privaatrecht][ref10]
      aangemerkt als bevattende openbare werken van algemeen nut.


