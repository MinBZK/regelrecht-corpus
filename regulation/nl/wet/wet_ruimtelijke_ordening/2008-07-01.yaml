  - number: 3.26.5
    text: |-
      Provinciale staten bepalen in het vaststellingsbesluit tot welk tijdstip de uitsluiting van de bevoegdheid van de
      gemeenteraad tot vaststelling van een bestemmingsplan voor de betrokken gronden voortduurt, met dien verstande dat
      dit tijdstip is gelegen binnen de periode van tien jaar, bedoeld in [artikel 3.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.26
