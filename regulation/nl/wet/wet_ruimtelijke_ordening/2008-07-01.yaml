        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.4.2
    text: |-
      Er wordt niet overgegaan tot toepassing van het eerste lid, dan na overleg met burgemeester en wethouders
      onderscheidenlijk gedeputeerde staten en niet eerder dan vier weken nadat de Tweede Kamer der Staten-Generaal in
      kennis is gesteld van het voornemen tot het nemen van het besluit.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Bij de toepassing van het eerste lid kan Onze Minister of Onze Minister wie het aangaat in overeenstemming met
      Onze Minister, tevens verklaren dat een bestemmingsplan als bedoeld in het eerste lid door de gemeente wordt
      voorbereid. [Artikel 3.7, eerste tot en met zevende lid][ref1], is van overeenkomstige toepassing. Bij de
      vormgeving en beschikbaarstelling van het voorbereidingsbesluit wordt overeenkomstige toepassing gegeven aan
      de krachtens [artikel 3.7, achtste lid][ref2], gestelde regels. Een door Onze Minister of Onze Minister wie het
      aangaat in overeenstemming met Onze Minister vastgesteld voorbereidingsbesluit wordt gelijkgesteld met een door de
      gemeenteraad vastgesteld voorbereidingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel4.4
