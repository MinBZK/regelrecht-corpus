        bwb_id: BWBR0001842
        artikel: '59'
  - number: 3.36b.3
    text: |-
      In aanvulling op de [artikelen 54n][ref1] en [59 van de onteigeningswet][ref2] is ten behoeve van de in het
      tweede lid bedoelde inschrijving een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State dan
      wel een verklaring van de secretaris van de Raad van State nodig, waaruit blijkt dat het bestemmingsplan of het
      projectbesluit onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54n
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.36b
