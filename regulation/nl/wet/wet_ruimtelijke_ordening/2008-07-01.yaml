  - number: 3.36b.1
    text: |-
      De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden, nadat:


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
