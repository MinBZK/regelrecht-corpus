        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.27.1
    text: |-
      Provinciale staten kunnen, de gemeenteraad gehoord, ten behoeve van de verwezenlijking van een project van
      provinciaal belang, een projectbesluit nemen.
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.27
  - number: 3.27.2
    text: |-
      De [artikelen 3.10 tot en met 3.14][ref1], en [3.26, vierde en vijfde lid][ref2], zijn van overeenkomstige
      toepassing, met dien verstande dat in plaats van «bestemmingsplan» «inpassingsplan» wordt gelezen en voor
      «gemeentebestuur» «provinciaal bestuur», en dat provinciale staten in de plaats treden van de gemeenteraad, en
      gedeputeerde staten in de plaats treden van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0020449/2008-07-01#Artikel3.27
