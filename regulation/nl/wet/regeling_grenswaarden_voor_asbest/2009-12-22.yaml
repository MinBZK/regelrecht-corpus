  - number: '2'
    text: |-
      Ten aanzien van een nieuw bedrijf geldt voor het lozen van asbest als ten hoogste toelaatbare gewichtshoeveelheid
      de grenswaarde die overeenkomt met de waarde die het resultaat is van de toepassing van de beste bestaande
      technieken. Deze grenswaarde is ten aanzien van een bedrijf, behorende tot een van de in [bijlage I][ref1] vermelde
      bedrijfstakken in ieder geval niet hoger dan de in die bijlage voor die bedrijfstak aangegeven grenswaarde, bepaald
      op de wijze als aangegeven in [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004449
      [ref2]: https://wetten.overheid.nl/BWBR0004449
    url: https://wetten.overheid.nl/BWBR0004449/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004449
      - id: ref2
        bwb_id: BWBR0004449
  - number: '3'
    text: |-
      Ten aanzien van een bestaand bedrijf gelden voor het lozen van asbest als ten hoogste toelaatbare
      gewichtshoeveelheden ten aanzien van:

      a. een bedrijf, behorende tot één van de in [bijlage I][ref1] genoemde bedrijfstakken: met ingang van 30 juni
      1991: de in die bijlage voor die bedrijfstak aangegeven grenswaarde, bepaald op de in [bijlage II][ref2] aangegeven
      wijze;

      b. een bedrijf, behorende tot een niet in [bijlage I][ref3] genoemde bedrijfstak: de grenswaarde die op 31 december
      1988 overeenkomt met de waarde die het resultaat is van de toepassing van de beste bestaande technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0004449
      [ref2]: https://wetten.overheid.nl/BWBR0004449
      [ref3]: https://wetten.overheid.nl/BWBR0004449
    url: https://wetten.overheid.nl/BWBR0004449/2009-12-22#Artikel3
