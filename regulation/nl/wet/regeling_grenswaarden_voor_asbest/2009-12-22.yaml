preamble:
  text: |-
    Overwegende dat uitvoering moet worden gegeven aan de richtlijn van de Raad van de Europese Gemeenschappen van 19
    maart 1987, 87/217/EEG, inzake voorkoming en vermindering van verontreiniging van het milieu door asbest;

    Gelet op artikel 1a, eerste, tweede en derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004449/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            asbest:

              de volgende vezelachtige silicaten: crocidoliet (blauw asbest), actinoliet, anthofylliet, chrysotiel (wit
      asbest), amosiet (bruin asbest), tremoliet;



            b
            ruw asbest:

              het produkt verkregen bij een eerste verbrijzeling van asbesthoudend gesteente;



            c
            gebruik van asbest:

              werkzaamheden waarbij per jaar een hoeveelheid van meer dan 100 kg ruwe asbest wordt behandeld en die
      betrekking hebben op:
              de produktie van ruwe asbest uit asbesthoudend gesteente met uitzondering van alle procédés die
      rechtstreeks verbonden zijn met het winnen van het gesteente of
      de vervaardiging en industriële afwerking van de volgende produkten die ruwe asbest bevatten: astbestcement of
      asbestcementprodukten, asbestfrictiemateriaal, asbestfilters, asbestweefsels, asbestpapier en karton, dichtings-,
      verpakkings- en verstevigingsmateriaal van asbest, vloerbedekkingen van asbest, asbesthoudende vulmiddelen;



            d
            bestaand bedrijf:

              een bedrijf waarin asbest wordt gebruikt:
              waarvan de installaties voor dat gebruik zijn gebouwd voor 31 december 1988 of waarvoor voor die datum,
      voor het lozen in verband met dat gebruik, een vergunning is verleend op grond van de Wet verontreiniging
      oppervlaktewateren (Stb. 1981, 573) en
              waarvan de capaciteit voor dat gebruik op of na 31 december 1988 niet aanzienlijk is uitgebreid;



            e
            . nieuw bedrijf:

              elk ander bedrijf waarin asbest wordt gebruikt;



            f
            bijlage I:

              de bij deze regeling behorende [bijlage I][ref1];



            g
            bijlage II:

              de bij deze regeling behorende [bijlage II][ref2];



            h
            lozen:

              brengen van:
              stoffen in een oppervlaktewaterlichaam;
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0004449
      [ref2]: https://wetten.overheid.nl/BWBR0004449
    url: https://wetten.overheid.nl/BWBR0004449/2009-12-22#Artikel1
