$id: regeling_grenswaarden_voor_asbest
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '1993-09-01'
bwb_id: BWBR0004449
url: https://wetten.overheid.nl/BWBR0004449/1993-09-01
preamble:
  text: |-
    Overwegende dat uitvoering moet worden gegeven aan de richtlijn van de Raad van de Europese Gemeenschappen van 19
    maart 1987, 87/217/EEG, inzake voorkoming en vermindering van verontreiniging van het milieu door asbest;

    Gelet op artikel 1a, eerste, tweede en derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004449/1993-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            asbest:

              de volgende vezelachtige silicaten: crocidoliet (blauw asbest), actinoliet, anthofylliet, chrysotiel (wit
      asbest), amosiet (bruin asbest), tremoliet;



            b
            ruw asbest:

              het produkt verkregen bij een eerste verbrijzeling van asbesthoudend gesteente;



            c
            gebruik van asbest:

              werkzaamheden waarbij per jaar een hoeveelheid van meer dan 100 kg ruwe asbest wordt behandeld en die
      betrekking hebben op:
              de produktie van ruwe asbest uit asbesthoudend gesteente met uitzondering van alle procédés die
      rechtstreeks verbonden zijn met het winnen van het gesteente of
      de vervaardiging en industriële afwerking van de volgende produkten die ruwe asbest bevatten: astbestcement of
      asbestcementprodukten, asbestfrictiemateriaal, asbestfilters, asbestweefsels, asbestpapier en karton, dichtings-,
      verpakkings- en verstevigingsmateriaal van asbest, vloerbedekkingen van asbest, asbesthoudende vulmiddelen;



            d
            bestaand bedrijf:

              een bedrijf waarin asbest wordt gebruikt:
              waarvan de installaties voor dat gebruik zijn gebouwd voor 31 december 1988 of waarvoor voor die datum,
      voor het lozen in verband met dat gebruik, een vergunning is verleend op grond van de Wet verontreiniging
      oppervlaktewateren (Stb. 1981, 573) en
              waarvan de capaciteit voor dat gebruik op of na 31 december 1988 niet aanzienlijk is uitgebreid;



            e
            . nieuw bedrijf:

              elk ander bedrijf waarin asbest wordt gebruikt;



            f
            bijlage I:

              de bij deze regeling behorende bijlage I;



            g
            bijlage II:

              de bij deze regeling behorende bijlage II.
    url: https://wetten.overheid.nl/BWBR0004449/1993-09-01#Artikel1
  - number: '2'
    text: |-
      Ten aanzien van een nieuw bedrijf geldt voor het brengen van asbest in oppervlaktewateren als ten hoogste
      toelaatbare gewichtshoeveelheid de grenswaarde die overeenkomt met de waarde die het resultaat is van de toepassing
      van de beste bestaande technieken. Deze grenswaarde is ten aanzien van een bedrijf, behorende tot een van de in
      bijlage I vermelde bedrijfstakken in ieder geval niet hoger dan de in die bijlage voor die bedrijfstak aangegeven
      grenswaarde, bepaald op de wijze als aangegeven in bijlage II.
    url: https://wetten.overheid.nl/BWBR0004449/1993-09-01#Artikel2
  - number: '3'
    text: |-
      Ten aanzien van een bestaand bedrijf gelden voor het brengen van asbest in oppervlaktewateren als ten hoogste
      toelaatbare gewichtshoeveelheden ten aanzien van:

      a. een bedrijf, behorende tot één van de in bijlage I genoemde bedrijfstakken: met ingang van 30 juni 1991: de in
      die bijlage voor die bedrijfstak aangegeven grenswaarde, bepaald op de in bijlage II aangegeven wijze;

      b. een bedrijf, behorende tot een niet in bijlage I genoemde bedrijfstak: de grenswaarde die op 31 december 1988
      overeenkomt met de waarde die het resultaat is van de toepassing van de beste bestaande technieken.
    url: https://wetten.overheid.nl/BWBR0004449/1993-09-01#Artikel3
  - number: '4'
    text: |-
      1 Deze regeling treedt in werking met ingang van 31 december 1988.

      2 Zij wordt in het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0004449/1993-09-01#Artikel4
