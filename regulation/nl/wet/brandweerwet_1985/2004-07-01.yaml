  - number: 4a
    text: |-
      1 Het bestuur van de regionale brandweer stelt ingevolge [artikel 4, eerste lid, onderdeel 2, onder b][ref1],
      ten minste één maal in de vier jaren een organisatieplan vast. Het organisatieplan bevat de operationele
      prestaties van de regionale brandweer die nodig zijn om uitvoering te geven aan het beheersplan, bedoeld in
      [artikel 5 van de Wet rampen en zware ongevallen][ref2].

      2 Het organisatieplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding geven.

      3 Het plan bevat in ieder geval:

      a. de taken van de brandweer en de maatregelen gericht op de realisering daarvan;

      b. de werkwijzen van de brandweer en de maatregelen gericht op de realisering daarvan;

      c. de personeel- en materieelsterkte van de brandweer en de maatregelen gericht op de realisering daarvan;

      d. het opleidingsniveau en de geoefendheid van het brandweerpersoneel en de maatregelen gericht op de realisering
      daarvan.

      4 Het organisatieplan en de wijzigingen daarop worden toegezonden aan de besturen van
      het regionale college, bedoeld in [artikel 22 van de Politiewet 1993][ref3], en van het
      samenwerkingsverband inzake de geneeskundige hulpverlening bij ongevallen en rampen, bedoeld in
      [artikel 3 van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref4] en aan de commissaris van de
      Koning.

      5 Bij algemene maatregel van bestuur kunnen nadere eisen worden gesteld ten aanzien van de inhoud van het
      organisatieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel4
