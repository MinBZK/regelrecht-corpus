  - number: '2'
    text: |-
      Besluiten tot vaststelling, wijziging of intrekking van de in [artikel 1, tweede lid][ref1], bedoelde regels worden
      binnen een week na de vaststelling aan gedeputeerde staten gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel1
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel2
    references:
