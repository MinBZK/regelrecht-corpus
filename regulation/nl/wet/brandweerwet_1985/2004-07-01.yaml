  - number: 18f
    text: |-
      1 Bij algemene maatregel van bestuur worden nadere regels gegeven over:

      a. de taken en bevoegdheden van het bestuur,

      b. de openbaarheid van de vergaderingen van het bestuur, en

      c. de voorwaarden waaronder en de wijze waarop de bijdragen, bedoeld in [artikel 18][ref1], worden verstrekt.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de controle op de
      rechtmatigheid van het gevoerde financiële beheer en de verantwoording daarover en op de doelmatigheid van het
      beheer, de organisatie en het gevoerde beleid van het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18e
