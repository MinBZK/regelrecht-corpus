  - number: 18e
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verstrekt het instituut jaarlijks uit ’s Rijks kas
      een bijdrage met het oog op de kosten van de uitvoering van de in [artikel 18][ref1], bedoelde taken. Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties kan het instituut een tijdelijke bijdrage voor een bijzonder doel
      verstrekken.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan beleidsregels vaststellen over de uitvoering van
      de aan het instituut toegekende taken.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18a
