  - number: '5'
    text: |-
      1 Tot vergoeding van de kosten die voor de regionale brandweren voortvloeien uit de uitoefening van hun taken in
      het kader van de bestrijding van rampen en zware ongevallen in buitengewone omstandigheden en de voorbereiding
      daarop wordt uit ’s Rijks kas een bijdrage verleend.

      2 Bij algemene maatregel van bestuur worden regels gesteld over het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel5
  - number: '7'
    text: |-
      1 Indien de bijstand, verleend door de regionale brandweer waaraan de gemeente deelneemt, niet toereikend is,
      verzoekt de burgemeester Onze commissaris in de provincie de nodige voorzieningen te treffen.

      2 De burgemeester doet de voorzitter van het dagelijks bestuur van de regionale brandweer mededeling van het doen
      van een verzoek, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel7
  - number: '8'
    text: |-
      1 De voorzitter van het dagelijks bestuur van de regionale brandweer stelt op verzoek van Onze commissaris in de
      provincie waarin de plaats van vestiging is gelegen personeel en materieel ter beschikking ten behoeve van bijstand
      binnen de provincie. De gemeentebesturen verlenen de voorzitter de hiervoor nodige medewerking.

      2 Onze commissaris in de provincie doet Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties mededeling van
      het doen van een verzoek, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel8
  - number: '9'
    text: |-
      1 Indien de bijstand, verleend ingevolge [artikel 8][ref1], niet toereikend is, verzoekt Onze commissaris in de
      provincie Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nodige voorzieningen te treffen. Deze
      wendt zich tot Onze commissarissen van andere provincies.

      2 De voorzitter van het dagelijks bestuur van de regionale brandweer stelt op verzoek van Onze commissaris in de
      provincie waarin de plaats van vestiging is gelegen personeel en materieel ter beschikking ten behoeve van bijstand
      buiten de provincie. De gemeentebesturen verlenen de voorzitter de hiervoor nodige medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel8
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel9
