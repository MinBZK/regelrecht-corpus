  - number: '12'
    text: |-
      De gemeenteraad stelt bij verordening regels vast omtrent het voorkomen, beperken en bestrijden van brand, het
      beperken van brandgevaar en het voorkomen en beperken van ongevallen bij brand en al hetgeen daarmee verband houdt
      (brandbeveiligingsverordening), voor zover daarin niet bij of krachtens de [Woningwet][ref1] of enige andere wet
      is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel12
    references:
