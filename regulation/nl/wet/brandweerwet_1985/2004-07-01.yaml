      1 Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 13][ref1] en [17][ref2] zijn
      belast de bij besluit van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen ambtenaren.
      Zij kunnen tevens worden belast met het toezicht op de veiligheid en deugdelijkheid van brandweer- en
      reddingsmaterieel. Van het besluit wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      2 Met het toezicht op de naleving van de brandbeveiligingsverordening, bedoeld in [artikel 12][ref3], zijn belast
      de bij besluit van het college van burgemeester en wethouders aangewezen ambtenaren.


