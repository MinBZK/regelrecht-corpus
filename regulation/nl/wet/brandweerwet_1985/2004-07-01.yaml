  - number: '19'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties heeft tot taak:

      a. het toetsen van de wijze waarop een bestuursorgaan van een provincie, een gemeente, een lichaam dat bij
      gemeenschappelijke regeling is ingesteld dan wel een ander openbaar lichaam uitvoering geeft aan de taken met
      betrekking tot het voorkomen van, het voorbereiden op en het bestrijden van een brand, ongeval of ramp;

      b. het verrichten van onderzoek naar aanleiding van een brand, ongeval of ramp.

      2 Een bestuursorgaan van een provincie, een gemeente, een lichaam dat bij gemeenschappelijke regeling is
      ingesteld of een ander openbaar lichaam is desgevraagd verplicht de door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties aangewezen ambtenaren de inlichtingen te verstrekken die zij redelijkerwijs nodig hebben in
      verband met de uitvoering van een toets als bedoeld in het eerste lid, onderdeel *a*.

      3 Een bestuursorgaan van één van de openbare lichamen, bedoeld in het tweede lid, of van het Rijk dan wel een ieder
      die werkzaam is bij een organisatie, een instelling, een inrichting die of een bedrijf dat betrokken is bij een
      brand, ongeval of ramp is desgevraagd verplicht de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      aangewezen ambtenaren de inlichtingen te verstrekken die zij redelijkerwijs nodig hebben in verband met het
      verrichten van een onderzoek als bedoeld in het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel19
  - number: 19a
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toetst, in overeenstemming met Onze Ministers
      van Volkshuisvesting, Ruimtelijke Ordening en Milieu, van Volksgezondheid, Welzijn en Sport, van Verkeer en
      Waterstaat en van Sociale Zaken en Werkgelegenheid, periodiek de voorbereiding op de rampenbestrijding door de
      bestuursorganen, bedoeld in artikel 19, eerste lid, onderdeel a, en brengt in een multidisciplinaire rapportage aan
      de Tweede Kamer van de Staten-Generaal verslag uit van zijn bevindingen.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties informeert de Tweede Kamer van de Staten-Generaal
      jaarlijks over de wijze waarop in het daarop volgende jaar uitvoering zal worden gegeven aan het eerste lid door
      toezending van een werkprogramma.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel19a
  - number: '20'
    text: |-
      1 De burgemeester, de commandant van de gemeentelijke brandweer, de commandant van de regionale
      brandweer en het door hen aangewezen ter plaatse dienstdoende personeel van de brandweer, alsmede de
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen ambtenaren, bedoeld in
      [artikel 19, tweede en derde lid][ref1], hebben vrije toegang tot alle plaatsen, voor zover dat redelijkerwijs voor
      de vervulling van hun taak nodig is. Zo nodig verschaffen zij zich de toegang met behulp van de sterke arm. Zij
      kunnen zich bij het binnentreden doen vergezellen van door hen aangewezen personen.

      2 De burgemeester, de commandant van de gemeentelijke brandweer, de commandant van de regionale
      brandweer en het door hen aangewezen ter plaatse dienstdoende personeel van de brandweer, alsmede de
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen ambtenaren, bedoeld in
      [artikel 19, tweede en derde lid][ref2], zijn bevoegd alle benodigde uitrustingsstukken en hulpmiddelen op de
      plaatsen, bedoeld in het eerste lid, mee te nemen en daarvan op zodanige wijze gebruik te maken als zij voor een
      goede vervulling van hun taak noodzakelijk achten.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel19
