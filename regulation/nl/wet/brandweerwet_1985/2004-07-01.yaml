    text: |-
      1 Met de opsporing van de bij [artikel 23][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de ambtenaren, aangewezen bij besluit van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Onverminderd de eisen, gesteld krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 142, vierde lid, van het Wetboek van Strafvordering][ref3], kan slechts als opsporingsambtenaar worden
      aangewezen degene die voldoet aan de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te stellen
      regels over de eisen van bekwaamheid.

      3 De opsporingsambtenaren zijn bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.


