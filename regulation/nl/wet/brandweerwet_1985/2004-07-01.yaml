        bwb_id: BWBR0003764
        artikel: '1'
  - number: '4'
    text: |-
      1 Bij de regeling als bedoeld in [artikel 3, eerste lid][ref1], wordt een openbaar lichaam met de aanduiding
      regionale brandweer ingesteld. Het openbaar lichaam is rechtspersoon. Bij deze regeling worden door de deelnemende
      gemeenten aan het bestuur van de regionale brandweer in elk geval de volgende taken opgedragen:

      1°. Het zorgdragen voor:

      a. het instellen en in stand houden van een regionale brandweeralarmcentrale;

      b. het aanschaffen en beheren van gemeenschappelijk materieel;

      c. het benoemen, schorsen en ontslaan van de commandant en het overige personeel van de regionale brandweer en het
      vaststellen van een instructie voor het personeel;

      d. het beschikbaar stellen van personeel en materieel in de gevallen, bedoeld in de [artikelen 8][ref2] en
      [9][ref3];

      e. het voorbereiden van de coördinatie bij de bestrijding van rampen en zware ongevallen;

      f. het voorbereiden van de organisatie voor het optreden van de brandweer in buitengewone omstandigheden en het
      regelen van de operationele leiding bij de bestrijding van rampen en zware ongevallen;

      g. het verzamelen en evalueren van gegevens ten behoeve van de waarschuwing en alarmering van de bevolking in geval
      van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan daarvan;

      h. het waarschuwen van de bevolking door middel van het sirenenet, het verkennen van gevaarlijke stoffen en het
      verrichten van ontsmetting;

      2°. het vaststellen van:

      a. een beheersplan als bedoeld in [artikel 5 van de Wet rampen en zware ongevallen][ref4];

      b. een organisatieplan als bedoeld in [artikel 4a][ref5].

      3°. het adviseren van de gemeentebesturen:

      a. op het gebied van de brandpreventie,

      b. ter zake van voorbereidende maatregelen op het gebied van de brandbestrijding en -beperking in bepaalde
      objecten,

      c. over het aanschaffen van materieel, een en ander overeenkomstig de in de regeling neergelegde regels.

      4°. het verzorgen van:

      a. oefeningen met het oog op het optreden in groter verband;

      b. opleidingen.

      2 De regeling bevat bepalingen omtrent onderlinge bijstand bij het beperken en bestrijden van brand en bij de
      hulpverlening bij ongevallen en rampen, alsmede omtrent de feitelijke leiding over de brandweer bij het optreden in
      groter verband.


