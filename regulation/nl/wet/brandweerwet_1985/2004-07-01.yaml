  - number: 18b
    text: |-
      1 Het instituut heeft een bestuur dat uit vijf leden bestaat, waaronder de voorzitter.

      2 De voorzitter en de overige leden van het bestuur worden bij koninklijk besluit benoemd, geschorst en ontslagen.
      De Raad, bedoeld in [artikel 18][ref1], kan een aanbeveling doen voor de voordracht voor het koninklijk besluit
      tot benoeming.

      3 De leden van het bestuur hebben, behoudens tussentijds ontslag, zitting voor vier jaren. Zij kunnen ten hoogste
      eenmaal worden herbenoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18c
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 18c
  - number: 18c
    text: |-
      1 Het bestuur heeft de algemene leiding over het instituut.

      2 Het bestuur benoemt een directeur, die de dagelijkse leiding over het instituut heeft.

      3 Het bestuur stelt bij reglement regels over de inrichting en werkwijze van het instituut en nadere regels over de
      taken en bevoegdheden van de directeur vast.

      4 Het bestuur stelt jaarlijks een begroting van de inkomsten en uitgaven voor het daarop volgende kalenderjaar,
      een meerjarenraming van de inkomsten en uitgaven voor de daarop volgende vier kalenderjaren en de rekening en
      verantwoording van de inkomsten en uitgaven van het daaraan voorafgaande kalenderjaar vast. Deze behoeven de
      goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      5 Het bestuur verstrekt desgevraagd aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.

      6 Het bestuur stelt jaarlijks voor 1 april een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen kalenderjaar. Het
      verslag wordt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegezonden en algemeen verkrijgbaar
      gesteld.

      7 Het bestuur stelt bij reglement een Raad voor het Nederlands instituut voor brandweer en rampenbestrijding
      in, waarin vertegenwoordigers zitting hebben uit de kring van openbare lichamen en organisaties die een taak
      vervullen op het terrein van de brandweerzorg en rampenbestrijding. Het bestuur voert overleg met de Raad over
      aangelegenheden die betrekking hebben op het instituut in het algemeen en de opleidingen in het bijzonder. In het
      reglement, bedoeld in het derde lid, worden regels gegeven over de samenstelling, taak en werkwijze van de Raad
      alsmede over de wijze van benoeming van de leden van de Raad.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel18c
  - number: 18d
    text: |-
      1 Het personeel van het instituut is ambtenaar in de zin van de [Ambtenarenwet][ref1].

      2 De regels die op grond van [artikel 125, eerste lid, van de Ambtenarenwet][ref2] zijn vastgesteld voor de
      ambtenaren die bij een ministerie anders dan het Ministerie van Defensie zijn aangesteld, zijn van overeenkomstige
      toepassing op de ambtenaren die in dienst van het instituut zijn. Bij of krachtens algemene maatregel van bestuur
      kunnen nadere regels worden vastgesteld.

      3 In afwijking van de in het tweede lid bedoelde regels kunnen bij of krachtens algemene maatregel van bestuur
      regels worden gegeven voor de ambtenaren die bij het instituut zijn aangesteld voor de duur van een opleiding als
      bedoeld in [artikel 15][ref3], voor zover dit in verband met hun bijzondere positie noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0003764#Artikel15
