        artikel: '1'
  - number: '3'
    text: |-
      1 Op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze
      Minister van Volksgezondheid, Welzijn en Sport, wordt bij algemene maatregel van bestuur een verdeling van
      gemeenten in regio's vastgesteld. De colleges van burgemeester en wethouders van de gemeenten die behoren tot één
      regio treffen een gemeenschappelijke regeling teneinde een doelmatig georganiseerde en gecoördineerde uitvoering
      van de werkzaamheden, bedoeld in [artikel 1, zesde lid][ref1], te bewerkstelligen en overigens een goede
      hulpverlening bij een ongeval of ramp te bevorderen.

      2 De verdeling van gemeenten in regio's, bedoeld in het eerste lid, is gelijk aan de verdeling in de [bijlage
      behorend bij de Politiewet 1993](onbekend), met dien verstande dat daarvan kan worden afgeweken, indien
      dat noodzakelijk is voor een doelmatig georganiseerde en gecoördineerde uitvoering van de werkzaamheden ter
      voorbereiding en uitvoering van de rampenbestrijding.

      3 De voordracht van een algemene maatregel van bestuur, waarbij een van de [bijlage bij de Politiewet 1993]
      (onbekend) afwijkende verdeling van gemeenten in regio's wordt voorgesteld, vindt niet plaats dan nadat
      gedeputeerde staten van de provincie op wiens grondgebied de betrokken regio's zijn gelegen door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties gedurende een periode van ten minste acht weken in de gelegenheid zijn
      gesteld daaromtrent een advies uit te brengen. Gedeputeerde staten betrekken in hun advies de zienswijzen terzake
      van alle bij het advies betrokken openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel1
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel3
    references:
