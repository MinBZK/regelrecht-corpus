  - number: 18g
    text: |-
      1 Er is een Nederlands bureau brandweerexamens dat rechtspersoonlijkheid bezit.

      2 Het bureau heeft tot taak:

      a. te zorgen voor de ontwikkeling, de uitvoering, de organisatie en de afneming van een rijksexamen als bedoeld
      in [artikel 15][ref1];

      b. het afgeven van vrijstellingen en certificaten;

      c. het vaststellen van de uitslag van een examen en het adviseren aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties over het afgeven van een diploma.

      3 Het bureau kan andere werkzaamheden verrichten dan die welke uit het tweede lid voortvloeien, voor zover het
      betreft:

      a. het zorgen voor de ontwikkeling, de uitvoering, de organisatie en de afneming van andere examens op het gebied
      van de brandweerzorg en de rampenbestrijding dan die welke in het tweede lid, onder *a*, zijn bedoeld, alsmede het
      afgeven van vrijstellingen, certificaten en diploma's;

      b. het ontwikkelen, het in stand houden en het beschikbaar stellen van expertise met betrekking tot de examinering
      van opleidingen op het gebied van de brandweerzorg en de rampenbestrijding.

      4 De in het derde lid genoemde werkzaamheden mogen niet leiden tot concurrentievervalsing ten opzichte van private
      aanbieders van vergelijkbare diensten en worden tegen kostendekkende tarieven verricht.

      5 Het bureau heeft een bestuur dat bestaat uit zeven leden, de voorzitter daaronder begrepen.

      6 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties benoemt, schorst en ontslaat de leden van het
      bestuur. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan een vertegenwoordiger benoemen die
      deelneemt aan de beraadslagingen van het bestuur.

      7 Het bestuur stelt bij reglement regels met betrekking tot de uitvoering, de organisatie en de afneming van een
      rijksexamen als bedoeld in [artikel 15][ref2].

      8 Het bestuur verstrekt desgevraagd aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.

      9 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan beleidsregels vaststellen over de uitvoering van
      de aan het bureau toegekende taken.

      10 Het personeel van het bureau is ambtenaar in de zin van de [Ambtenarenwet][ref3], behoudens degenen met wie een
      arbeidsovereenkomst is gesloten naar burgerlijk recht. Het bestuur stelt bij reglement regels met betrekking tot de
      onderwerpen, genoemd in [artikel 125, eerste lid, van de Ambtenarenwet][ref4]. Indien het bestuur, ondanks daartoe
      strekkende uitnodiging, nalatig blijft hieraan uitvoering te geven, stelt Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties bedoeld reglement vast.

      11 De inkomsten van het bureau bestaan uit de kosten die het bij de uitvoering van de taken, bedoeld in het tweede
      lid, en de werkzaamheden, bedoeld in het derde lid, bij derden in rekening brengt en andere baten.

      12 De begroting van de inkomsten en uitgaven voor het daarop volgende kalenderjaar, de meerjarenraming van de
      inkomsten en uitgaven en het jaarverslag van het voorafgaande kalenderjaar behoeven de goedkeuring van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      13 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inrichting en
      de werkwijze van het bureau, de taak, de samenstelling en de openbaarheid van de vergaderingen van het bestuur en
      de controle op het financieel beheer.

      14 Het bureau stelt jaarlijks een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen en de
      doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen kalenderjaar. Het verslag
      wordt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegezonden en algemeen verkrijgbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001947
      [ref4]: https://wetten.overheid.nl/BWBR0001947#Artikel125
