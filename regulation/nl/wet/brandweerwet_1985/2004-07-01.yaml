        bwb_id: BWBR0005181
  - number: '13'
    text: |-
      1 Burgemeester en wethouders kunnen een inrichting die in geval van een brand of ongeval bijzonder gevaar kan
      opleveren voor de openbare veiligheid aanwijzen als bedrijfsbrandweerplichtig. Het hoofd of de bestuurder van
      een aangewezen inrichting is verplicht er voor te zorgen, dat in die inrichting kan worden beschikt over een
      bedrijfsbrandweer, die voldoet aan de bij de aanwijzing gestelde eisen inzake personeel en materieel. Voordat een
      aanwijzing plaatsvindt, horen burgemeester en wethouders het hoofd of de bestuurder van de inrichting.

      2 In afwijking van het eerste lid vindt de aanwijzing door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties plaats indien het een inrichting betreft die is gelegen op of deel uitmaakt van een bij de
      krijgsmacht in gebruik zijnd terrein, voor zover er gegevens in het geding zijn waarvan de geheimhouding door
      het belang van de veiligheid van de staat is geboden. Voordat een aanwijzing plaatsvindt, hoort Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties het hoofd of de bestuurder van de inrichting.

      3 Bij algemene maatregel van bestuur wordt bepaald welke inrichtingen kunnen worden aangewezen, welke eisen
      inzake personeel en materieel kunnen worden gesteld en worden nadere regels gegeven betreffende de wijze van
      totstandkoming van een aanwijzing.

      4 Het hoofd of de bestuurder van een inrichting als bedoeld in het derde lid is verplicht burgemeester en
      wethouders en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nodige inlichtingen te verstrekken ten
      behoeve van de uitoefening van de in dit artikel bedoelde bevoegdheid tot aanwijzing.

      5 Voor 1 februari van ieder jaar zendt het hoofd of de bestuurder van een aangewezen inrichting aan het
      gemeentebestuur en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een overzicht van de werkelijke
      sterkte van de bedrijfsbrandweer op 1 januari van dat jaar.

      6 Het hoofd of de bestuurder van een aangewezen inrichting draagt er zorg voor dat de bedrijfsbrandweer ter zake
      van het optreden, dat noodzakelijk is ter bestrijding van brand of van gevaar anderszins binnen de inrichting,
      de aanwijzingen opvolgt van degene die op grond van een wettelijk voorschrift met de feitelijke leiding van die
      bestrijding is belast.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel13
  - number: '14'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen voor het personeel van de gemeentelijke brandweer, de regionale
      brandweer en het Nederlands instituut voor brandweer en rampenbestrijding, bedoeld in [artikel 18][ref1], regels
      worden gegeven ten aanzien van:

      a. de eisen van aanstelling en bevordering;

      b. de rangen;

      c. de eisen met betrekking tot de keuring en de controle op lichamelijke en geestelijke geschiktheid;

      d. de kleding en de uitrusting.

      2 Bij algemene maatregel van bestuur worden regels gegeven betreffende de wijze waarop met de daarvoor in
      aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gepleegd over het ontwerp van een
      maatregel, vast te stellen krachtens het eerste lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 18a
  - number: '15'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke opleidingen worden afgesloten met een rijksexamen. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt het examenreglement vast en geeft het diploma af.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel15
  - number: '17'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gegeven betreffende de veiligheid, deugdelijkheid,
      normalisatie en standaardisatie waaraan brandweer- en reddingsmaterieel moet voldoen, dat met het oog op gebruik
      hier te lande wordt vervaardigd, ingevoerd of in de handel gebracht.

      2 Voor verrichtingen van overheidswege, die krachtens een algemene maatregel van bestuur als bedoeld in het eerste
      lid worden gedaan kunnen overeenkomstig daarbij te stellen regels vergoedingen in rekening worden gebracht. Deze
      vergoedingen worden niet in rekening gebracht aan publiekrechtelijke lichamen.
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel17
  - number: 18a
    text: |-
      1 Er is een Nederlands instituut voor brandweer en rampenbestrijding. Het instituut bezit rechtspersoonlijkheid.

      2 Het instituut heeft de volgende taken:

      a. het verzorgen van de officiersopleidingen voor de brandweer die met een rijksexamen als bedoeld in
      [artikel 15][ref1] worden afgesloten,

      b. het verzorgen van de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen andere
      opleidingen die met een rijksexamen als bedoeld in [artikel 15][ref2] worden afgesloten,

      c. het werven en selecteren van kandidaten voor opleidingen, bedoeld onder *a* en *b*, en

      d. het ontwikkelen van leerstof en instructiemethoden en -middelen voor de opleidingen, bedoeld onder *a* en *b*.

      3 Het instituut kan andere werkzaamheden verrichten dan die welke uit de in het tweede lid genoemde taken
      voortvloeien, voor zover het betreft:

      a. het verzorgen van andere opleidingen op het gebied van de brandweerzorg en de rampenbestrijding dan die welke in
      het tweede lid, onder *a* en *b* zijn bedoeld, en van oefeningen op dat gebied,

      b. het werven en selecteren van kandidaten voor opleidingen en oefeningen, bedoeld onder *a*,

      c. het ontwikkelen van leerstof en instructiemethoden en -middelen voor andere opleidingen dan die welke in het
      tweede lid, onder *a* en *b*, zijn bedoeld,

      d. het vaststellen van examenreglementen voor opleidingen die niet met een rijksexamen als bedoeld in
      [artikel 15][ref3] worden afgesloten,

      e. het ontwikkelen, in stand houden en beschikbaar stellen van expertise met betrekking tot de brandweerzorg en
      rampenbestrijding en

      f. het verrichten van andere activiteiten die de deskundigheid van personen op het gebied van de brandweerzorg en
      rampenbestrijding of het functioneren van de organisaties waarvoor zij werkzaam zijn, bevorderen.

      4 De in het derde lid genoemde werkzaamheden mogen niet leiden tot concurrentievervalsing ten opzichte van private
      aanbieders van vergelijkbare diensten en worden tegen kostendekkende tarieven verricht.

      5 De inkomsten van het instituut bestaan uit:

      a. de kosten die het instituut bij de uitvoering van de in het tweede lid bedoelde taken en de in het derde lid
      bedoelde werkzaamheden bij derden in rekening brengt,

      b. de bijdragen, bedoeld in [artikel 18][ref4], en

      c. andere baten.

      6 Het instituut trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn. In afwijking van de eerste
      volzin is het het instituut toegestaan ter overbrugging van tijdelijke kastekorten bij een kredietinstelling als
      bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref5] tijdelijke
      kredieten in rekening-courant op te nemen.


