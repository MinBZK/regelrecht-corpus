      1 Op overtreding van de regels van de brandbeveiligingsverordening en het bij of krachtens
      [artikel 17, eerste lid][ref1], bepaalde kan als straf gesteld worden hechtenis van ten hoogste een jaar of
      geldboete van de derde categorie.

      2 Overtreding van het bij of krachtens [artikel 13, eerste, vierde en vijfde lid][ref2] bepaalde wordt gestraft met
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie.

      3 In geval van overtreding van [artikel 13, eerste lid][ref3], kan als bijkomende straf worden opgelegd gehele of
      gedeeltelijke stillegging van de inrichting voor een tijd van ten hoogste een jaar.

      4 De feiten zijn overtredingen.


