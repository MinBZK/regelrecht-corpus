        bwb_id: BWBR0003764
        artikel: '8'
  - number: '10'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze commissaris in de provincie treffen de nodige
      voorbereidende maatregelen met het oog op de uitoefening van hun bevoegdheden bedoeld in de [artikelen 8][ref1]
      en [9][ref2]. Voorzover deze maatregelen van rechtstreeks belang zijn voor een regionale brandweer, treffen Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, onderscheidenlijk Onze commissaris in de provincie deze
      niet dan na overleg met Onze commissaris in de provincie, onderscheidenlijk de voorzitter van het dagelijks bestuur
      van de regionale brandweer.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel9
