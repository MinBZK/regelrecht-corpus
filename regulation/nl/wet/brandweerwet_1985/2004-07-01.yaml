      [artikelen 8, eerste lid][ref1] en [9, tweede lid][ref2], kan uit ’s Rijks kas een bijdrage worden verleend.

      2 Bij algemene maatregel van bestuur worden regels gesteld over het bepaalde in het eerste lid.


