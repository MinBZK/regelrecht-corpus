preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat nieuwe regels met betrekking tot het brandweerwezen
    worden vastgesteld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:

    Met betrekking tot het brandweerwezen wordt de volgende wet vastgesteld:
  url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is in elke gemeente een gemeentelijke brandweer, behoudens indien ingevolge samenwerking met andere gemeenten
      een regeling ter zake tot stand gekomen is.

      2 De gemeenteraad regelt de organisatie, het beheer en de taak van de gemeentelijke brandweer bij verordening.

      3 De regels inzake de organisatie betreffen in elk geval de personeels- en materieelssterkte. Bij algemene
      maatregel van bestuur kunnen over de minimumsterkte voorschriften worden gegeven.

      4 Burgemeester en wethouders hebben de zorg voor:

      a. het voorkomen, beperken en bestrijden van brand, het beperken van brandgevaar, het voorkomen en beperken van
      ongevallen bij brand en al hetgeen daarmee verband houdt;

      b. het beperken en bestrijden van gevaar voor mensen en dieren bij ongevallen anders dan bij brand.

      5 Burgemeester en wethouders zijn belast met het benoemen, schorsen en ontslaan van het personeel van de
      gemeentelijke brandweer.

      6 De taak van de brandweer bestaat in elk geval uit de feitelijke uitvoering van werkzaamheden ter zake van de in
      het vierde lid genoemde onderwerpen alsmede ter zake van het beperken en bestrijden van rampen en zware ongevallen
      als bedoeld in [artikel 1 van de Wet rampen en zware ongevallen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel1
    url: https://wetten.overheid.nl/BWBR0003764/2004-07-01#Artikel1
