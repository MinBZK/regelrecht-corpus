$id: brandweerwet_1985
regulatory_layer: WET
publication_date: '2007-12-11'
valid_from: '2006-03-08'
bwb_id: BWBR0003764
url: https://wetten.overheid.nl/BWBR0003764/2006-03-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat nieuwe regels met betrekking tot het brandweerwezen
    worden vastgesteld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:

    Met betrekking tot het brandweerwezen wordt de volgende wet vastgesteld:
  url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Er is in elke gemeente een gemeentelijke brandweer, behoudens indien ingevolge samenwerking met andere gemeenten
      een regeling ter zake tot stand gekomen is.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
  - number: '1.2'
    text: Burgemeester en wethouders regelen de organisatie, het beheer en de taak van de gemeentelijke brandweer.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
  - number: '1.3'
    text: |-
      De regels inzake de organisatie betreffen in elk geval de personeels- en materieelssterkte. Bij algemene maatregel
      van bestuur kunnen over de minimumsterkte voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
  - number: '1.4'
    text: 'Burgemeester en wethouders hebben de zorg voor:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
  - number: 1.4.a
    text: |-
      het voorkomen, beperken en bestrijden van brand, het beperken van brandgevaar, het voorkomen en beperken van
      ongevallen bij brand en al hetgeen daarmee verband houdt;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
  - number: 1.4.b
    text: het beperken en bestrijden van gevaar voor mensen en dieren bij ongevallen anders dan bij brand.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
  - number: '1.5'
    text: |-
      Burgemeester en wethouders zijn belast met het benoemen, schorsen en ontslaan van het personeel van de
      gemeentelijke brandweer.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
  - number: '1.6'
    text: |-
      De taak van de brandweer bestaat in elk geval uit de feitelijke uitvoering van werkzaamheden ter zake van de in het
      vierde lid genoemde onderwerpen alsmede ter zake van het beperken en bestrijden van rampen en zware ongevallen als
      bedoeld in [artikel 1 van de Wet rampen en zware ongevallen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel1
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '1'
  - number: '2'
    text: |-
      Besluiten tot vaststelling, wijziging of intrekking van de in [artikel 1, tweede lid][ref1], bedoelde regels worden
      binnen een week na de vaststelling aan gedeputeerde staten gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel1
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '1'
  - number: '3.1'
    text: |-
      Op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister
      van Volksgezondheid, Welzijn en Sport, wordt bij algemene maatregel van bestuur een verdeling van gemeenten
      in regio's vastgesteld. De colleges van burgemeester en wethouders van de gemeenten die behoren tot één regio
      treffen een gemeenschappelijke regeling teneinde een doelmatig georganiseerde en gecoördineerde uitvoering van de
      werkzaamheden, bedoeld in [artikel 1, zesde lid][ref1], te bewerkstelligen en overigens een goede hulpverlening bij
      een ongeval of ramp te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel1
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '1'
  - number: '3.2'
    text: |-
      De verdeling van gemeenten in regio's, bedoeld in het eerste lid, is gelijk aan de verdeling in de [bijlage
      behorend bij de Politiewet 1993](onbekend), met dien verstande dat daarvan kan worden afgeweken, indien
      dat noodzakelijk is voor een doelmatig georganiseerde en gecoördineerde uitvoering van de werkzaamheden ter
      voorbereiding en uitvoering van de rampenbestrijding.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel3
  - number: '3.3'
    text: |-
      De voordracht van een algemene maatregel van bestuur, waarbij een van de [bijlage bij de Politiewet 1993](onbekend)
      afwijkende verdeling van gemeenten in regio's wordt voorgesteld, vindt niet plaats dan nadat gedeputeerde staten
      van de provincie op wiens grondgebied de betrokken regio's zijn gelegen door Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties gedurende een periode van ten minste acht weken in de gelegenheid zijn gesteld daaromtrent
      een advies uit te brengen. Gedeputeerde staten betrekken in hun advies de zienswijzen terzake van alle bij het
      advies betrokken openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel3
  - number: '4.1'
    text: |-
      Bij de regeling als bedoeld in [artikel 3, eerste lid][ref1], wordt een openbaar lichaam met de aanduiding
      regionale brandweer ingesteld. Het openbaar lichaam is rechtspersoon. Bij deze regeling worden door de deelnemende
      gemeenten aan het bestuur van de regionale brandweer in elk geval de volgende taken opgedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel3
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '3'
  - number: 4.1.1°
    text: 'Het zorgdragen voor:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.1°.a
    text: het instellen en in stand houden van een regionale brandweeralarmcentrale;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.1°.b
    text: het aanschaffen en beheren van gemeenschappelijk materieel;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.1°.c
    text: |-
      het benoemen, schorsen en ontslaan van de commandant en het overige personeel van de regionale brandweer en het
      vaststellen van een instructie voor het personeel;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.1°.d
    text: |-
      het beschikbaar stellen van personeel en materieel in de gevallen, bedoeld in de [artikelen 8][ref1] en [9][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel9
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003764
        artikel: '9'
  - number: 4.1.1°.e
    text: het voorbereiden van de coördinatie bij de bestrijding van rampen en zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.1°.f
    text: |-
      het voorbereiden van de organisatie voor het optreden van de brandweer in buitengewone omstandigheden en het
      regelen van de operationele leiding bij de bestrijding van rampen en zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.1°.g
    text: |-
      het verzamelen en evalueren van gegevens ten behoeve van de waarschuwing en alarmering van de bevolking in geval
      van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan daarvan;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.1°.h
    text: |-
      het waarschuwen van de bevolking door middel van het sirenenet, het verkennen van gevaarlijke stoffen en het
      verrichten van ontsmetting;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.2°
    text: 'het vaststellen van:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.2°.a
    text: |-
      een beheersplan als bedoeld in [artikel 5 van de Wet rampen en zware ongevallen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel5
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '5'
  - number: 4.1.2°.b
    text: |-
      een organisatieplan als bedoeld in [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 4a
  - number: 4.1.3°
    text: 'het adviseren van de colleges van burgemeester en wethouders:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.3°.a
    text: op het gebied van de brandpreventie,
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.3°.b
    text: ter zake van voorbereidende maatregelen op het gebied van de brandbestrijding en -beperking in bepaalde objecten,
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.3°.c
    text: over het aanschaffen van materieel, een en ander overeenkomstig de in de regeling neergelegde regels.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.4°
    text: 'het verzorgen van:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.4°.a
    text: oefeningen met het oog op het optreden in groter verband;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4.1.4°.b
    text: opleidingen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: '4.2'
    text: |-
      De regeling bevat bepalingen omtrent onderlinge bijstand bij het beperken en bestrijden van brand en bij de
      hulpverlening bij ongevallen en rampen, alsmede omtrent de feitelijke leiding over de brandweer bij het optreden in
      groter verband.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4
  - number: 4a.1
    text: |-
      Het bestuur van de regionale brandweer stelt ingevolge [artikel 4, eerste lid, onderdeel 2, onder b][ref1],
      ten minste één maal in de vier jaren een organisatieplan vast. Het organisatieplan bevat de operationele
      prestaties van de regionale brandweer die nodig zijn om uitvoering te geven aan het beheersplan, bedoeld in
      [artikel 5 van de Wet rampen en zware ongevallen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel5
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003765
        artikel: '5'
  - number: 4a.2
    text: Het organisatieplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
  - number: 4a.3
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
  - number: 4a.3.a
    text: de taken van de brandweer en de maatregelen gericht op de realisering daarvan;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
  - number: 4a.3.b
    text: de werkwijzen van de brandweer en de maatregelen gericht op de realisering daarvan;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
  - number: 4a.3.c
    text: de personeel- en materieelsterkte van de brandweer en de maatregelen gericht op de realisering daarvan;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
  - number: 4a.3.d
    text: |-
      het opleidingsniveau en de geoefendheid van het brandweerpersoneel en de maatregelen gericht op de realisering
      daarvan.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
  - number: 4a.4
    text: |-
      Het organisatieplan en de wijzigingen daarop worden toegezonden aan de besturen van
      het regionale college, bedoeld in [artikel 22 van de Politiewet 1993][ref1], en van het
      samenwerkingsverband inzake de geneeskundige hulpverlening bij ongevallen en rampen, bedoeld in
      [artikel 3 van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref2] en aan de commissaris van de
      Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel3
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005276
        artikel: '3'
  - number: 4a.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere eisen worden gesteld ten aanzien van de inhoud van het
      organisatieplan.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel4a
  - number: '5.1'
    text: |-
      Tot vergoeding van de kosten die voor de regionale brandweren voortvloeien uit de uitoefening van hun taken in het
      kader van de bestrijding van rampen en zware ongevallen in buitengewone omstandigheden en de voorbereiding daarop
      wordt uit ’s Rijks kas een bijdrage verleend.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel5
  - number: '5.2'
    text: Bij algemene maatregel van bestuur worden regels gesteld over het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel5
  - number: '7.1'
    text: |-
      Indien de bijstand, verleend door de regionale brandweer waaraan de gemeente deelneemt, niet toereikend is,
      verzoekt de burgemeester Onze commissaris in de provincie de nodige voorzieningen te treffen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel7
  - number: '7.2'
    text: |-
      De burgemeester doet de voorzitter van het dagelijks bestuur van de regionale brandweer mededeling van het doen van
      een verzoek, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel7
  - number: '8.1'
    text: |-
      De voorzitter van het dagelijks bestuur van de regionale brandweer stelt op verzoek van Onze commissaris in
      de provincie waarin de plaats van vestiging is gelegen personeel en materieel ter beschikking ten behoeve van
      bijstand binnen de provincie. De colleges van burgemeester en wethouders verlenen de voorzitter de hiervoor nodige
      medewerking.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel8
  - number: '8.2'
    text: |-
      Onze commissaris in de provincie doet Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties mededeling van
      het doen van een verzoek, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel8
  - number: '9.1'
    text: |-
      Indien de bijstand, verleend ingevolge [artikel 8][ref1], niet toereikend is, verzoekt Onze commissaris in de
      provincie Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nodige voorzieningen te treffen. Deze
      wendt zich tot Onze commissarissen van andere provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel8
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '8'
  - number: '9.2'
    text: |-
      De voorzitter van het dagelijks bestuur van de regionale brandweer stelt op verzoek van Onze commissaris in
      de provincie waarin de plaats van vestiging is gelegen personeel en materieel ter beschikking ten behoeve van
      bijstand buiten de provincie. De colleges van burgemeester en wethouders verlenen de voorzitter de hiervoor nodige
      medewerking.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel9
  - number: '10'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze commissaris in de provincie treffen de nodige
      voorbereidende maatregelen met het oog op de uitoefening van hun bevoegdheden bedoeld in de [artikelen 8][ref1]
      en [9][ref2]. Voorzover deze maatregelen van rechtstreeks belang zijn voor een regionale brandweer, treffen Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, onderscheidenlijk Onze commissaris in de provincie deze
      niet dan na overleg met Onze commissaris in de provincie, onderscheidenlijk de voorzitter van het dagelijks bestuur
      van de regionale brandweer.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel9
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003764
        artikel: '9'
  - number: '11.1'
    text: |-
      In de kosten die voor de regionale brandweren en de gemeenten voortvloeien uit de uitvoering van de
      [artikelen 8, eerste lid][ref1] en [9, tweede lid][ref2], kan uit ’s Rijks kas een bijdrage worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel9
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003764
        artikel: '9'
  - number: '11.2'
    text: Bij algemene maatregel van bestuur worden regels gesteld over het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel11
  - number: '12'
    text: |-
      De gemeenteraad stelt bij verordening regels vast omtrent het voorkomen, beperken en bestrijden van brand, het
      beperken van brandgevaar en het voorkomen en beperken van ongevallen bij brand en al hetgeen daarmee verband houdt
      (brandbeveiligingsverordening), voor zover daarin niet bij of krachtens de [Woningwet][ref1] of enige andere wet
      is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '13.1'
    text: |-
      Burgemeester en wethouders kunnen een inrichting die in geval van een brand of ongeval bijzonder gevaar kan
      opleveren voor de openbare veiligheid aanwijzen als bedrijfsbrandweerplichtig. Het hoofd of de bestuurder van
      een aangewezen inrichting is verplicht er voor te zorgen, dat in die inrichting kan worden beschikt over een
      bedrijfsbrandweer, die voldoet aan de bij de aanwijzing gestelde eisen inzake personeel en materieel. Voordat een
      aanwijzing plaatsvindt, horen burgemeester en wethouders het hoofd of de bestuurder van de inrichting.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid vindt de aanwijzing door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties plaats indien het een inrichting betreft die is gelegen op of deel uitmaakt van een bij de
      krijgsmacht in gebruik zijnd terrein, voor zover er gegevens in het geding zijn waarvan de geheimhouding door
      het belang van de veiligheid van de staat is geboden. Voordat een aanwijzing plaatsvindt, hoort Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties het hoofd of de bestuurder van de inrichting.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel13
  - number: '13.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke inrichtingen kunnen worden aangewezen, welke eisen
      inzake personeel en materieel kunnen worden gesteld en worden nadere regels gegeven betreffende de wijze van
      totstandkoming van een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel13
  - number: '13.4'
    text: |-
      Het hoofd of de bestuurder van een inrichting als bedoeld in het derde lid is verplicht burgemeester en wethouders
      en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nodige inlichtingen te verstrekken ten behoeve
      van de uitoefening van de in dit artikel bedoelde bevoegdheid tot aanwijzing.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel13
  - number: '13.5'
    text: |-
      Voor 1 februari van ieder jaar zendt het hoofd of de bestuurder van een aangewezen inrichting aan burgemeester en
      wethouders en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een overzicht van de werkelijke sterkte
      van de bedrijfsbrandweer op 1 januari van dat jaar.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel13
  - number: '13.6'
    text: |-
      Het hoofd of de bestuurder van een aangewezen inrichting draagt er zorg voor dat de bedrijfsbrandweer ter zake
      van het optreden, dat noodzakelijk is ter bestrijding van brand of van gevaar anderszins binnen de inrichting,
      de aanwijzingen opvolgt van degene die op grond van een wettelijk voorschrift met de feitelijke leiding van die
      bestrijding is belast.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel13
  - number: '14.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor het personeel van de gemeentelijke brandweer, de regionale brandweer
      en het Nederlands instituut voor brandweer en rampenbestrijding, bedoeld in [artikel 18][ref1], regels worden
      gegeven ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 18a
  - number: 14.1.a
    text: de eisen van aanstelling en bevordering;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel14
  - number: 14.1.b
    text: de rangen;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel14
  - number: 14.1.c
    text: de eisen met betrekking tot de keuring en de controle op lichamelijke en geestelijke geschiktheid;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel14
  - number: 14.1.d
    text: de kleding en de uitrusting.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel14
  - number: '14.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven betreffende de wijze waarop met de daarvoor in aanmerking
      komende vakorganisaties van overheidspersoneel overleg wordt gepleegd over het ontwerp van een maatregel, vast te
      stellen krachtens het eerste lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel14
  - number: '15'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke opleidingen worden afgesloten met een rijksexamen. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt het examenreglement vast en geeft het diploma af.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel15
  - number: '17.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven betreffende de veiligheid, deugdelijkheid,
      normalisatie en standaardisatie waaraan brandweer- en reddingsmaterieel moet voldoen, dat met het oog op gebruik
      hier te lande wordt vervaardigd, ingevoerd of in de handel gebracht.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel17
  - number: '17.2'
    text: |-
      Voor verrichtingen van overheidswege, die krachtens een algemene maatregel van bestuur als bedoeld in het eerste
      lid worden gedaan kunnen overeenkomstig daarbij te stellen regels vergoedingen in rekening worden gebracht. Deze
      vergoedingen worden niet in rekening gebracht aan publiekrechtelijke lichamen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel17
  - number: 18a.1
    text: Er is een Nederlands instituut voor brandweer en rampenbestrijding. Het instituut bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.2
    text: 'Het instituut heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.2.a
    text: |-
      het verzorgen van de officiersopleidingen voor de brandweer die met een rijksexamen als bedoeld in
      [artikel 15][ref1] worden afgesloten,


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel15
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '15'
  - number: 18a.2.b
    text: |-
      het verzorgen van de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen andere
      opleidingen die met een rijksexamen als bedoeld in [artikel 15][ref1] worden afgesloten,


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel15
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '15'
  - number: 18a.2.c
    text: het werven en selecteren van kandidaten voor opleidingen, bedoeld onder *a* en *b*, en
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.2.d
    text: het ontwikkelen van leerstof en instructiemethoden en -middelen voor de opleidingen, bedoeld onder *a* en *b*.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.3
    text: |-
      Het instituut kan andere werkzaamheden verrichten dan die welke uit de in het tweede lid genoemde taken
      voortvloeien, voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.3.a
    text: |-
      het verzorgen van andere opleidingen op het gebied van de brandweerzorg en de rampenbestrijding dan die welke in
      het tweede lid, onder *a* en *b* zijn bedoeld, en van oefeningen op dat gebied,
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.3.b
    text: het werven en selecteren van kandidaten voor opleidingen en oefeningen, bedoeld onder *a*,
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.3.c
    text: |-
      het ontwikkelen van leerstof en instructiemethoden en -middelen voor andere opleidingen dan die welke in het tweede
      lid, onder *a* en *b*, zijn bedoeld,
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.3.d
    text: |-
      het vaststellen van examenreglementen voor opleidingen die niet met een rijksexamen als bedoeld in
      [artikel 15][ref1] worden afgesloten,


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel15
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '15'
  - number: 18a.3.e
    text: |-
      het ontwikkelen, in stand houden en beschikbaar stellen van expertise met betrekking tot de brandweerzorg en
      rampenbestrijding en
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.3.f
    text: |-
      het verrichten van andere activiteiten die de deskundigheid van personen op het gebied van de brandweerzorg en
      rampenbestrijding of het functioneren van de organisaties waarvoor zij werkzaam zijn, bevorderen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.4
    text: |-
      De in het derde lid genoemde werkzaamheden mogen niet leiden tot concurrentievervalsing ten opzichte van private
      aanbieders van vergelijkbare diensten en worden tegen kostendekkende tarieven verricht.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.5
    text: 'De inkomsten van het instituut bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.5.a
    text: |-
      de kosten die het instituut bij de uitvoering van de in het tweede lid bedoelde taken en de in het derde lid
      bedoelde werkzaamheden bij derden in rekening brengt,
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.5.b
    text: |-
      de bijdragen, bedoeld in [artikel 18][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18e
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 18e
  - number: 18a.5.c
    text: andere baten.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
  - number: 18a.6
    text: |-
      Het instituut trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn. In afwijking van de eerste
      volzin is het het instituut toegestaan ter overbrugging van tijdelijke kastekorten bij een kredietinstelling als
      bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] tijdelijke
      kredieten in rekening-courant op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 18b.1
    text: Het instituut heeft een bestuur dat uit vijf leden bestaat, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18b
  - number: 18b.2
    text: |-
      De voorzitter en de overige leden van het bestuur worden bij koninklijk besluit benoemd, geschorst en ontslagen.
      De Raad, bedoeld in [artikel 18][ref1], kan een aanbeveling doen voor de voordracht voor het koninklijk besluit
      tot benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18c
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 18c
  - number: 18b.3
    text: |-
      De leden van het bestuur hebben, behoudens tussentijds ontslag, zitting voor vier jaren. Zij kunnen ten hoogste
      eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18b
  - number: 18c.1
    text: Het bestuur heeft de algemene leiding over het instituut.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18c
  - number: 18c.2
    text: Het bestuur benoemt een directeur, die de dagelijkse leiding over het instituut heeft.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18c
  - number: 18c.3
    text: |-
      Het bestuur stelt bij reglement regels over de inrichting en werkwijze van het instituut en nadere regels over de
      taken en bevoegdheden van de directeur vast.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18c
  - number: 18c.4
    text: |-
      Het bestuur stelt jaarlijks een begroting van de inkomsten en uitgaven voor het daarop volgende kalenderjaar,
      een meerjarenraming van de inkomsten en uitgaven voor de daarop volgende vier kalenderjaren en de rekening en
      verantwoording van de inkomsten en uitgaven van het daaraan voorafgaande kalenderjaar vast. Deze behoeven de
      goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18c
  - number: 18c.5
    text: |-
      Het bestuur verstrekt desgevraagd aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18c
  - number: 18c.6
    text: |-
      Het bestuur stelt jaarlijks voor 1 april een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen kalenderjaar. Het
      verslag wordt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegezonden en algemeen verkrijgbaar
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18c
  - number: 18c.7
    text: |-
      Het bestuur stelt bij reglement een Raad voor het Nederlands instituut voor brandweer en rampenbestrijding
      in, waarin vertegenwoordigers zitting hebben uit de kring van openbare lichamen en organisaties die een taak
      vervullen op het terrein van de brandweerzorg en rampenbestrijding. Het bestuur voert overleg met de Raad over
      aangelegenheden die betrekking hebben op het instituut in het algemeen en de opleidingen in het bijzonder. In het
      reglement, bedoeld in het derde lid, worden regels gegeven over de samenstelling, taak en werkwijze van de Raad
      alsmede over de wijze van benoeming van de leden van de Raad.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18c
  - number: 18d.1
    text: |-
      Het personeel van het instituut is ambtenaar in de zin van de [Ambtenarenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 18d.2
    text: |-
      De regels die op grond van [artikel 125, eerste lid, van de Ambtenarenwet][ref1] zijn vastgesteld voor de
      ambtenaren die bij een ministerie anders dan het Ministerie van Defensie zijn aangesteld, zijn van overeenkomstige
      toepassing op de ambtenaren die in dienst van het instituut zijn. Bij of krachtens algemene maatregel van bestuur
      kunnen nadere regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
  - number: 18d.3
    text: |-
      In afwijking van de in het tweede lid bedoelde regels kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gegeven voor de ambtenaren die bij het instituut zijn aangesteld voor de duur van een opleiding als bedoeld
      in [artikel 15][ref1], voor zover dit in verband met hun bijzondere positie noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel15
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '15'
  - number: 18e.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verstrekt het instituut jaarlijks uit ’s Rijks kas een
      bijdrage met het oog op de kosten van de uitvoering van de in [artikel 18][ref1], bedoelde taken. Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties kan het instituut een tijdelijke bijdrage voor een bijzonder doel
      verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 18a
  - number: 18e.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan beleidsregels vaststellen over de uitvoering van de
      aan het instituut toegekende taken.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18e
  - number: 18f.1
    text: 'Bij algemene maatregel van bestuur worden nadere regels gegeven over:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18f
  - number: 18f.1.a
    text: de taken en bevoegdheden van het bestuur,
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18f
  - number: 18f.1.b
    text: de openbaarheid van de vergaderingen van het bestuur, en
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18f
  - number: 18f.1.c
    text: |-
      de voorwaarden waaronder en de wijze waarop de bijdragen, bedoeld in [artikel 18][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel18e
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: 18e
  - number: 18f.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven over de controle op de rechtmatigheid
      van het gevoerde financiële beheer en de verantwoording daarover en op de doelmatigheid van het beheer, de
      organisatie en het gevoerde beleid van het bestuur.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18f
  - number: 18g.1
    text: Er is een Nederlands bureau brandweerexamens dat rechtspersoonlijkheid bezit.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.2
    text: 'Het bureau heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.2.a
    text: |-
      te zorgen voor de ontwikkeling, de uitvoering, de organisatie en de afneming van een rijksexamen als bedoeld in
      [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel15
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '15'
  - number: 18g.2.b
    text: het afgeven van vrijstellingen en certificaten;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.2.c
    text: |-
      het vaststellen van de uitslag van een examen en het adviseren aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties over het afgeven van een diploma.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.3
    text: |-
      Het bureau kan andere werkzaamheden verrichten dan die welke uit het tweede lid voortvloeien, voor zover het
      betreft:
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.3.a
    text: |-
      het zorgen voor de ontwikkeling, de uitvoering, de organisatie en de afneming van andere examens op het gebied
      van de brandweerzorg en de rampenbestrijding dan die welke in het tweede lid, onder *a*, zijn bedoeld, alsmede het
      afgeven van vrijstellingen, certificaten en diploma's;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.3.b
    text: |-
      het ontwikkelen, het in stand houden en het beschikbaar stellen van expertise met betrekking tot de examinering van
      opleidingen op het gebied van de brandweerzorg en de rampenbestrijding.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.4
    text: |-
      De in het derde lid genoemde werkzaamheden mogen niet leiden tot concurrentievervalsing ten opzichte van private
      aanbieders van vergelijkbare diensten en worden tegen kostendekkende tarieven verricht.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.5
    text: Het bureau heeft een bestuur dat bestaat uit zeven leden, de voorzitter daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.6
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties benoemt, schorst en ontslaat de leden van het bestuur.
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan een vertegenwoordiger benoemen die deelneemt aan de
      beraadslagingen van het bestuur.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.7
    text: |-
      Het bestuur stelt bij reglement regels met betrekking tot de uitvoering, de organisatie en de afneming van een
      rijksexamen als bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel15
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '15'
  - number: 18g.8
    text: |-
      Het bestuur verstrekt desgevraagd aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.9
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan beleidsregels vaststellen over de uitvoering van de
      aan het bureau toegekende taken.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.10
    text: |-
      Het personeel van het bureau is ambtenaar in de zin van de [Ambtenarenwet][ref1], behoudens degenen met wie een
      arbeidsovereenkomst is gesloten naar burgerlijk recht. Het bestuur stelt bij reglement regels met betrekking tot de
      onderwerpen, genoemd in [artikel 125, eerste lid, van de Ambtenarenwet][ref2]. Indien het bestuur, ondanks daartoe
      strekkende uitnodiging, nalatig blijft hieraan uitvoering te geven, stelt Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties bedoeld reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0001947
      - id: ref2
        bwb_id: BWBR0001947
        artikel: '125'
  - number: 18g.11
    text: |-
      De inkomsten van het bureau bestaan uit de kosten die het bij de uitvoering van de taken, bedoeld in het tweede
      lid, en de werkzaamheden, bedoeld in het derde lid, bij derden in rekening brengt en andere baten.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.12
    text: |-
      De begroting van de inkomsten en uitgaven voor het daarop volgende kalenderjaar, de meerjarenraming van de
      inkomsten en uitgaven en het jaarverslag van het voorafgaande kalenderjaar behoeven de goedkeuring van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.13
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inrichting en de
      werkwijze van het bureau, de taak, de samenstelling en de openbaarheid van de vergaderingen van het bestuur en de
      controle op het financieel beheer.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: 18g.14
    text: |-
      Het bureau stelt jaarlijks een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen en de
      doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen kalenderjaar. Het verslag
      wordt aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel18g
  - number: '19.1'
    text: 'Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel19
  - number: 19.1.a
    text: |-
      het toetsen van de wijze waarop een bestuursorgaan van een provincie, een gemeente, een lichaam dat bij
      gemeenschappelijke regeling is ingesteld dan wel een ander openbaar lichaam uitvoering geeft aan de taken met
      betrekking tot het voorkomen van, het voorbereiden op en het bestrijden van een brand, ongeval of ramp;
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel19
  - number: 19.1.b
    text: |-
      het verrichten van onderzoek naar aanleiding van een brand, ongeval of ramp, tenzij de Onderzoeksraad voor
      veiligheid, bedoeld in [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], naar de brand, het ongeval
      of de ramp een onderzoek instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '2'
  - number: '19.2'
    text: |-
      Een bestuursorgaan van een provincie, een gemeente, een lichaam dat bij gemeenschappelijke regeling is
      ingesteld of een ander openbaar lichaam is desgevraagd verplicht de door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties aangewezen ambtenaren de inlichtingen te verstrekken die zij redelijkerwijs nodig hebben in
      verband met de uitvoering van een toets als bedoeld in het eerste lid, onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel19
  - number: '19.3'
    text: |-
      Een bestuursorgaan van één van de openbare lichamen, bedoeld in het tweede lid, of van het Rijk dan wel een ieder
      die werkzaam is bij een organisatie, een instelling, een inrichting die of een bedrijf dat betrokken is bij een
      brand, ongeval of ramp is desgevraagd verplicht de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      aangewezen ambtenaren de inlichtingen te verstrekken die zij redelijkerwijs nodig hebben in verband met het
      verrichten van een onderzoek als bedoeld in het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel19
  - number: 19a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toetst, in overeenstemming met Onze Ministers
      van Volkshuisvesting, Ruimtelijke Ordening en Milieu, van Volksgezondheid, Welzijn en Sport, van Verkeer en
      Waterstaat en van Sociale Zaken en Werkgelegenheid, periodiek de voorbereiding op de rampenbestrijding door de
      bestuursorganen, bedoeld in artikel 19, eerste lid, onderdeel a, en brengt in een multidisciplinaire rapportage aan
      de Tweede Kamer van de Staten-Generaal verslag uit van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel19a
  - number: 19a.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties informeert de Tweede Kamer van de Staten-Generaal
      jaarlijks over de wijze waarop in het daarop volgende jaar uitvoering zal worden gegeven aan het eerste lid door
      toezending van een werkprogramma.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel19a
  - number: '20.1'
    text: |-
      De burgemeester, de commandant van de gemeentelijke brandweer, de commandant van de regionale brandweer en het door
      hen aangewezen ter plaatse dienstdoende personeel van de brandweer, alsmede de door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties aangewezen ambtenaren, bedoeld in [artikel 19, tweede en derde lid][ref1], hebben
      vrije toegang tot alle plaatsen, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zo nodig
      verschaffen zij zich de toegang met behulp van de sterke arm. Zij kunnen zich bij het binnentreden doen vergezellen
      van door hen aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel19
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '19'
  - number: '20.2'
    text: |-
      De burgemeester, de commandant van de gemeentelijke brandweer, de commandant van de regionale brandweer en het door
      hen aangewezen ter plaatse dienstdoende personeel van de brandweer, alsmede de door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties aangewezen ambtenaren, bedoeld in [artikel 19, tweede en derde lid][ref1], zijn
      bevoegd alle benodigde uitrustingsstukken en hulpmiddelen op de plaatsen, bedoeld in het eerste lid, mee te nemen
      en daarvan op zodanige wijze gebruik te maken als zij voor een goede vervulling van hun taak noodzakelijk achten.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel19
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '19'
  - number: '21.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 13][ref1] en [17][ref2] zijn belast
      de bij besluit van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen ambtenaren. Zij kunnen
      tevens worden belast met het toezicht op de veiligheid en deugdelijkheid van brandweer- en reddingsmaterieel. Van
      het besluit wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel17
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003764
        artikel: '17'
  - number: '21.2'
    text: |-
      Met het toezicht op de naleving van de brandbeveiligingsverordening, bedoeld in [artikel 12][ref1], zijn belast de
      bij besluit van het college van burgemeester en wethouders aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel12
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '12'
  - number: '23.1'
    text: |-
      Op overtreding van de regels van de brandbeveiligingsverordening en het bij of krachtens
      [artikel 17, eerste lid][ref1], bepaalde kan als straf gesteld worden hechtenis van ten hoogste een jaar of
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel17
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '17'
  - number: '23.2'
    text: |-
      Overtreding van het bij of krachtens [artikel 13, eerste, vierde en vijfde lid][ref1] bepaalde wordt gestraft met
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel13
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '13'
  - number: '23.3'
    text: |-
      In geval van overtreding van [artikel 13, eerste lid][ref1], kan als bijkomende straf worden opgelegd gehele of
      gedeeltelijke stillegging van de inrichting voor een tijd van ten hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel13
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '13'
  - number: '23.4'
    text: De feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel23
  - number: '24.1'
    text: |-
      Met de opsporing van de bij [artikel 23][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de ambtenaren, aangewezen bij besluit van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '24.2'
    text: |-
      Onverminderd de eisen, gesteld krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 142, vierde lid, van het Wetboek van Strafvordering][ref1], kan slechts als opsporingsambtenaar worden
      aangewezen degene die voldoet aan de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te stellen
      regels over de eisen van bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '24.3'
    text: |-
      De opsporingsambtenaren zijn bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel24
  - number: '29'
    text: |-
      Deze wet kan worden aangehaald als Brandweerwet met vermelding van het jaartal van het *Staatsblad* waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#Artikel29
  - number: C
    text: |-
      De onderdelen A en B treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003764/2006-03-08#ArtikelC
