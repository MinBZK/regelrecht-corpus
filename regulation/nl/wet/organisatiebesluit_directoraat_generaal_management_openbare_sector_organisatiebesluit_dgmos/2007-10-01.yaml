    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.1
  - number: 7.1.b
    text: de afdeling Arbeidsvoorwaarden (AV);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.1
  - number: 7.1.c
    text: de afdeling Arbeidskwaliteit (AK);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.1
  - number: 7.1.d
    text: de afdeling Organisatie (O);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.1
  - number: 7.1.e
    text: de afdeling Informatie (I);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.1
  - number: 7.1.f
    text: het Programmabureau Vernieuwing HRM-stelsel RIJK (HRM).
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.1
  - number: 7.2.1
    text: De directiestaf staat onder leiding van de directeur.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.2
  - number: 7.2.2
    text: 'De directiestaf heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.2
  - number: 7.2.2.a
    text: het aangeven van de strategische lijn en het bewaken van de samenhang van het beleid van de directie;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.2
  - number: 7.2.2.b
    text: het onderhouden van de externe relaties met (P)SG-beraad, IG-beraad, ICPR en IODI;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.2
  - number: 7.2.2.c
    text: het zorgdragen voor de stafverbindingen en beheer.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.2
  - number: 7.3.1
    text: De afdeling Arbeidsvoorwaarden staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.3
  - number: 7.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.3
  - number: 7.3.2.a
    text: het zorgdragen voor de primaire en secundaire arbeidsvoorwaarden bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.3
  - number: 7.3.2.b
    text: de zorg voor de inactiviteitsregelingen voor het Rijk;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.3
  - number: 7.3.2.c
    text: de zorg voor het beloningsbeleid.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.3
  - number: 7.4.1
    text: De afdeling Arbeidskwaliteit staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.4.2.a
    text: het intern en extern bevorderen van de arbeidsmarktpositie van het Rijk;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.4.2.b
    text: het zorgdragen voor het verhogen van de interdepartementale doorstroom van personeel;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.4.2.c
    text: het bevorderen van het gebruik van eigen kwaliteit en capaciteit in de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.4.2.d
    text: het bevorderen van de ontwikkelingsmogelijkheden van medewerkers;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.4.2.e
    text: het zorgdragen voor de toepassing van het integriteitsbeleid van het Rijk;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.4.2.f
    text: het zorgdragen voor de toepassing van het arbeidsomstandighedenbeleid.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.4
  - number: 7.5.1
    text: De afdeling Organisatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.5
  - number: 7.5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.5
  - number: 7.5.2.a
    text: |-
      het ontwikkelen, implementeren, onderhouden en evalueren van een rapportagekader voor de departementale
      topstructuren en het adviseren over afzonderlijke departementale voorstellen betreffende de departementale
      inrichting en de topstructuren;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.5
  - number: 7.5.2.b
    text: |-
      het ontwikkelen, implementeren, onderhouden en evalueren van een rijksbrede concernvisie op de bedrijfsvoering en
      het bijdragen aan de voorbereiding van voorstellen tot verdere samenwerking en bundeling op dat terrein;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.5
  - number: 7.5.2.c
    text: |-
      het ontwikkelen, implementeren, onderhouden, evalueren van het verzelfstandigingbeleid en het toetsen van
      afzonderlijke verzelfstandigingvoorstellen;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.5
  - number: 7.5.2.d
    text: |-
      het ontwikkelen, implementeren, onderhouden, en evalueren van het toezichtbeleid en het adviseren over nieuwe
      ontwikkelingen op het terrein van het toezicht;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.5
  - number: 7.5.2.e
    text: |-
      het ontwikkelen, implementeren, onderhouden, en evalueren van het adviesstelsel en het toetsen van afzonderlijke
      voorstellen voor instelling van adviescolleges.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.5
  - number: 7.6.1
    text: De afdeling Informatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.6
  - number: 7.6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.6
  - number: 7.6.2.a
    text: |-
      het bevorderen van de doelmatigheid en de doeltreffendheid van de bedrijfsvoering bij het Rijk door de inzet van
      ICT;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.6
  - number: 7.6.2.b
    text: het daartoe bevorderen van de samenwerking tussen ministeries op het vlak van de ICT in de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.6
  - number: 7.6.2.c
    text: het optreden als opdrachtgever voor concernbrede ICT-voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.6
  - number: 7.7.1
    text: Het Programmabureau Vernieuwing HRM-stelsel RIJK staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.7
  - number: 7.7.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.7
  - number: 7.7.2.a
    text: |-
      het faciliteren en volgen van de uitvoering van departementale plannen ter verhoging van de kwaliteit van de HRM
      functie;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.7
  - number: 7.7.2.b
    text: het ondersteunen van de opdrachtgever ten aanzien van het inrichten van een Shared Service Center HRM;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.7
  - number: 7.7.2.c
    text: |-
      het uitvoeren van interdepartementaal onderzoek naar mogelijkheden voor de vorming van een Expertise- en
      Ontwikkelcentrum;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.7
  - number: 7.7.2.d
    text: het afronden van de pilot benchmarken.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel7.7
  - number: 8.1.1
    text: De Gemeenschappelijke Beheer Organisatie staat onder leiding van een directeur
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2
    text: 'De Gemeenschappelijke Beheerorganisatie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2.a
    text: het cluster Identificatie en Authenticatie (IA);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2.b
    text: het cluster Informatiebeveiliging (IB);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2.c
    text: het cluster Gegevensuitwisseling (GU);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2.d
    text: het cluster Open Standaarden (OS);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2.e
    text: het Bedrijfsbureau (BB);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2.f
    text: het cluster Dienstontwikkeling en Integratie (DI);
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.1.2.g
    text: het cluster Relatiebeheer (RB).
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.1
  - number: 8.2.1
    text: Het cluster Identificatie en Authenticatie staat onder leiding van een coördinator.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.2
  - number: 8.2.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.2
  - number: 8.2.2.a
    text: Het beheren en ontwikkelen van diensten van DigiD (inclusief PKI) en PA;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.2
  - number: 8.2.2.b
    text: Het uitvoeren van de bijzondere toezichthoudende functie op de certificaatproviders (Police Authority).
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.2
  - number: 8.3.1
    text: Het cluster Informatiebeveiliging staat onder leiding van een coördinator.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.3
  - number: 8.3.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.3
  - number: 8.3.2.a
    text: Het uitvoeren van de diensten van Govcert;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.3
  - number: 8.3.2.b
    text: Het uitvoeren van de diensten van de waarschuwingsdienst.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.3
  - number: 8.4.1
    text: Het cluster Gegevensuitwisseling staat onder leiding van een coördinator
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.4
  - number: 8.4.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.4
  - number: 8.4.2.a
    text: Het beheren en verder ontwikkelen van voorzieningen voor gegevensuitwisseling.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.4
  - number: 8.5.1
    text: Het cluster Open Standaarden staat onder leiding van een coördinator.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.5
  - number: 8.5.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.5
  - number: 8.5.2.a
    text: Het ondersteunen van de organen Standaardisatie College en Standaardisatie Forum;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.5
  - number: 8.5.2.b
    text: Het initiëren en onderhouden van contacten met communities die gericht zijn op het ontwikkelen van standaards.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.5
  - number: 8.6.1
    text: Het Bedrijfsbureau staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.6
  - number: 8.6.2
    text: 'Het Bedrijfsbureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.6
  - number: 8.6.2.a
    text: Het zorgdragen voor de levering/uitvoering van bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.6
  - number: 8.6.2.b
    text: Het uitvoeren van de secretariële en administratieve ondersteuning;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.6
  - number: 8.6.2.c
    text: Het bieden van ondersteuning voor juridische en communicatieve aspecten.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.6
  - number: 8.7.1
    text: Het cluster Dienstontwikkeling en Integratie staat onder leiding van een coördinator.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.7
  - number: 8.7.2
    text: 'Het cluster heeft de volgende taak:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.7
  - number: 8.7.2.a
    text: Het ontwikkelen en onderhouden van de samenhang van de diensten van de GBO op basis van een Dienstenstructuur;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.7
  - number: 8.7.2.b
    text: Het (door)ontwikkelen van de diensten van de GBO.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.7
  - number: '8.8'
    text: 'Het cluster Relatiebeheer is belast met de volgende taak:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.8
  - number: 8.8.a
    text: Het utvoeren van het relatiebeheer voor de GBO.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel8.8
  - number: 9.1.1
    text: De Werkmaatschappij staat onder leiding van een directeur;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.1
  - number: 9.1.2
    text: 'De Werkmaatschappij bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.1
  - number: 9.1.2.a
    text: de Houdstermaatschappij,
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.1
  - number: 9.1.2.b
    text: de Bedrijfseenheden.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.1
  - number: '9.2'
    text: 'Het onderdeel De Houdstermaatschappij heeft als taak om:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.2
  - number: 9.2.a
    text: |-
      Het in opdracht van de onderdelen PIOFACH-taken inkopen en hierover dienstverleningsafspraken maken bij aannemers
      binnen de Rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.2
  - number: 9.2.b
    text: Het voorbereiden, uitvoeren en handhaven van kaders voor het dienstverleningspakket;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.2
  - number: 9.2.c
    text: Het monitoren van de bedrijfsvoering aan de hand van controlrapportages;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.2
  - number: 9.2.d
    text: Het opstellen van de financiële verantwoording van de Werkmaatschappij;
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.2
  - number: 9.2.e
    text: Het voor het onderdeel de Initiatieven vervullen als kenniscentrum op het gebied van de PIOFACH deelgebieden.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.2
  - number: '9.3'
    text: 'Het onderdeel De Bedrijfseenheden heeft als taak om:'
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.3
  - number: 9.3.a
    text: |-
      Het in structurele samenwerkingsverbanden tussen 2 of meer departementen concreet leveren van producten en/of
      diensten.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel9.3
  - number: '10.1'
    text: |-
      [Artikel 3.26 van het Organisatiebesluit BZK 2006][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0020525
        artikel: '3'
  - number: '11.1'
    text: |-
      [Artikel 3.27 van het Organisatiebesluit BZK 2006][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0020525
        artikel: '3'
  - number: '12.1'
    text: |-
      Tot de taak van de dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan vermeld,
      in opdracht van de minister, de secretaris-generaal of de directeur-generaal, voor zover hogere wet- en regelgeving
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel12.1
  - number: 13.1.1
    text: De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel13.1
  - number: 13.1.2
    text: |-
      Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel13.1
  - number: '13.2'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel13.2
  - number: '14.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 januari 2006
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel14.1
  - number: '14.2'
    text: |-
      Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Management Openbare Sector
      (Organisatiebesluit DGMOS).
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel14.2
  - number: '14.3'
    text: |-
      Het [organisatiebesluit DGMOS][ref1] van 1 september 2004 wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018006
    url: https://wetten.overheid.nl/BWBR0020526/2007-10-01#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0018006
