    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel61
  - number: 6:1.d
    text: de afdeling Organisatie (O);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel61
  - number: 6:1.e
    text: de afdeling Informatie (I);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel61
  - number: 6:1.f
    text: het Programmabureau Vernieuwing HRM-stelsel RIJK (HRM).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel61
  - number: 6:2.1
    text: Het directiesecretariaat staat onder leiding van de directeur.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel62
  - number: 6:2.2
    text: 'Het directiesecretariaat heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel62
  - number: 6:2.2.a
    text: het aangeven van de strategische lijn en het bewaken van de samenhang van het beleid van de directie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel62
  - number: 6:2.2.b
    text: het onderhouden van de externe relaties met (P)SG-beraad, IG-beraad, ICPR en IODI;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel62
  - number: 6:2.2.c
    text: het zorgdragen voor de stafverbindingen en beheer.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel62
  - number: 6:3.1
    text: De afdeling Arbeidsvoorwaarden staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel63
  - number: 6:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel63
  - number: 6:3.2.a
    text: het zorgdragen voor de primaire en secundaire arbeidsvoorwaarden bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel63
  - number: 6:3.2.b
    text: de zorg voor de inactiviteitsregelingen voor het Rijk;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel63
  - number: 6:3.2.c
    text: de zorg voor het beloningsbeleid.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel63
  - number: 6:4.1
    text: De afdeling Arbeidskwaliteit staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:4.2.a
    text: het intern en extern bevorderen van de arbeidsmarktpositie van het Rijk;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:4.2.b
    text: het zorgdragen voor het verhogen van de interdepartementale doorstroom van personeel;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:4.2.c
    text: het bevorderen van het gebruik van eigen kwaliteit en capaciteit in de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:4.2.d
    text: het bevorderen van de ontwikkelingsmogelijkheden van medewerkers;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:4.2.e
    text: het zorgdragen voor de toepassing van het integriteitsbeleid van het Rijk;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:4.2.f
    text: het zorgdragen voor de toepassing van het arbeidsomstandighedenbeleid.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:5.1
    text: De afdeling Organisatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:5.2.a
    text: |-
      het ontwikkelen, implementeren, onderhouden en evalueren van een rapportagekader voor de departementale
      topstructuren en het adviseren over afzonderlijke departementale voorstellen betreffende de departementale
      inrichting en de topstructuren;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:5.2.b
    text: |-
      het ontwikkelen, implementeren, onderhouden en evalueren van een rijksbrede concernvisie op de bedrijfsvoering en
      het bijdragen aan de voorbereiding van voorstellen tot verdere samenwerking en bundeling op dat terrein;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:5.2.c
    text: |-
      het ontwikkelen, implementeren, onderhouden, evalueren van het verzelfstandigingbeleid en het toetsen van
      afzonderlijke verzelfstandigingvoorstellen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:5.2.d
    text: |-
      het ontwikkelen, implementeren, onderhouden, en evalueren van het toezichtbeleid en het adviseren over nieuwe
      ontwikkelingen op het terrein van het toezicht;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:5.2.e
    text: |-
      het ontwikkelen, implementeren, onderhouden, en evalueren van het adviesstelsel en het toetsen van afzonderlijke
      voorstellen voor instelling van adviescolleges.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:6.1
    text: De afdeling Informatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel66
  - number: 6:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel66
  - number: 6:6.2.a
    text: |-
      het bevorderen van de doelmatigheid en de doeltreffendheid van de bedrijfsvoering bij het Rijk door de inzet van
      ICT;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel66
  - number: 6:6.2.b
    text: het daartoe bevorderen van de samenwerking tussen ministeries op het vlak van de ICT in de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel66
  - number: 6:6.2.c
    text: het optreden als opdrachtgever voor concernbrede ICT-voorzieningen.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel66
  - number: 6:7.1
    text: Het Programmabureau Vernieuwing HRM-stelsel RIJK staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel67
  - number: 6:7.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel67
  - number: 6:7.2.a
    text: |-
      het faciliteren en volgen van de uitvoering van departementale plannen ter verhoging van de kwaliteit van de HRM-
      functie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel67
  - number: 6:7.2.b
    text: het ondersteunen van de opdrachtgever ten aanzien van het inrichten van een Shared Service Center HRM;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel67
  - number: 6:7.2.c
    text: |-
      het uitvoeren van interdepartementaal onderzoek naar mogelijkheden voor de vorming van een Expertise- en
      Ontwikkelcentrum;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel67
  - number: 6:7.2.d
    text: het afronden van de pilot benchmarken.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel67
  - number: 7:1.1
    text: Het Service Center staat onder leiding van een manager.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel71
  - number: 7:1.2
    text: 'Het Service Center bestaat uit de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel71
  - number: 7:1.2.a
    text: de afdeling Digitalisering Arbeidsmarkt (DA);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel71
  - number: 7:1.2.b
    text: de afdeling Merk en Communicatie (M&C);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel71
  - number: 7:1.2.c
    text: de afdeling Programma’s en Evenementen (P&E).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel71
  - number: 7.2.1
    text: De afdeling Digitalisering Arbeidsmarkt staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.a
    text: |-
      het (door)ontwikkelen van en zorgdragen voor de consistentie en integratie van de (toekomstige) digitale producten
      van het service center en E-HRM instrumenten;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.b
    text: |-
      het beheren van applicaties, gegevens, databases en datacommunicatie en het onderhouden van de digitale producten
      van het Service Center;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.c
    text: |-
      het fungeren als helpdesk voor beantwoording van vragen en het oplossen van storingen voor deelnemende organisaties
      en gebruikers;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.d
    text: het adviseren over het gebruik van E-HRM instrumenten op het gebied van in- door en uitstroom;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.e
    text: |-
      het verantwoordelijk zijn voor de technische en inhoudelijke functionaliteiten, het doel- en rechtmatig gebruik van
      de digitale producten;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.f
    text: het fungeren als intermediair voor de gebruikers en de overheidsorganisaties;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.g
    text: het genereren van de benodigde (management)informatie over het gebruik en de werking van de digitale producten;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.2.2.h
    text: het digitaal transparant houden van de arbeidsmarkt van internationale (overheids)organisaties.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: 7.3.1
    text: De afdeling Merk & Communicatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: 7.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: 7.3.2.a
    text: het versterken en bestendigen van de positie van het merk Rijk als werkgever op de interne en externe arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: 7.3.2.b
    text: het (door)ontwikkelen van en zorgdragen voor consistentie en inhoud van de campagne Werken bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: 7.3.2.c
    text: het adviseren over interne doorvertaling van de arbeidsmarktcommunicatie van het Rijk;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: 7.3.2.d
    text: het zorgdragen voor het communicatiebeleid van het Service Center en haar producten;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: 7.3.2.e
    text: het (doen) verzorgen van de periodieke uitgaven verRijking en het HRM-blad BinnenbeRijk.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: 7.4.1
    text: De afdeling Programma’s en Evenementen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 7.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 7.4.2.a
    text: het organiseren van (doelgroepgerichte) evenementen en beurzen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 7.4.2.b
    text: |-
      het organiseren van het gemeenschappelijk optreden namens de ministeries en onderdelen van het Service Center op
      door externen georganiseerde arbeidsmarkt gerelateerde beurzen en evenementen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 7.4.2.c
    text: het organiseren van trainingen en simulaties voor verschillende doelgroepen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 7.4.2.d
    text: het geven van voorlichting over het werken bij internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 7.4.2.e
    text: het zorgdragen voor het promotiemateriaal van het Service Center;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 7.4.2.f
    text: het organiseren en coördineren van de uitvoering van het Rijkstraineeprogramma.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 8:1
    text: 'Het Agentschap Informatievoorziening Overheidspersoneel bestaat uit de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel81
  - number: 8:1.a
    text: de stafafdeling (SA);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel81
  - number: 8:1.b
    text: de afdeling Salarisinformatie (SI);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel81
  - number: 8:1.c
    text: de afdeling Personeelsinformatie (PI).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel81
  - number: 8:2.1
    text: De stafafdeling staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel82
  - number: 8:2.2
    text: |-
      De stafafdeling draagt zorg voor ondersteuning van de directie en lijnafdelingen, op het gebied van
      personeelszaken, financiën, automatisering, facilitaire bedrijfsvoering, secretariële en administratieve
      ondersteuning, communicatie en quality assurance.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel82
  - number: 8:3.1
    text: De afdeling Salarisinformatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel83
  - number: 8:3.2
    text: |-
      De afdeling draagt zorg voor ontwerp, ontwikkeling, bouw en het in bedrijf houden van hoogwaardige
      informatiesystemen op het gebied van de salarisadministratie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel83
  - number: 8:4.1
    text: De afdeling Personeelsinformatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel84
  - number: 8:4.2
    text: |-
      De afdeling draagt zorg voor ontwerp, ontwikkeling, bouw en het in bedrijf houden van hoogwaardige
      informatiesystemen op het gebied van de financiële personeelsadministratie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel84
  - number: '9'
    text: |-
      [Artikel 3:24 van het Organisatiebesluit BZK 2004][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017563#Artikel3
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017563
        artikel: '3'
  - number: '10'
    text: |-
      Tot de taak van de dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan vermeld,
      in opdracht van de minister, de secretaris‑generaal of de directeur-generaal, voor zover hogere wet- en regelgeving
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel10
  - number: 11:1.1
    text: De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel111
  - number: 11:1.2
    text: |-
      Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel111
  - number: 11:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel112
  - number: 12:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2004.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel121
  - number: 12:2
    text: |-
      Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Management Openbare Sector
      (Organisatiebesluit DGMOS).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel122
  - number: 12:3
    text: |-
      Het [organisatiebesluit DGMOD][ref1] van 17 september 2003 wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015585
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0015585
