publication_date: '2006-11-21'
valid_from: '2006-01-01'
bwb_id: BWBR0018006
url: https://wetten.overheid.nl/BWBR0018006/2006-01-01
preamble:
  text: |-
    Gelet op artikel 4:2 van het Organisatiebesluit BZK 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - het Ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Minister voor Bestuurlijke Vernieuwing
      en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Management Openbare Sector.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Management Openbare Sector, genoemd in het
      [Organisatiebesluit BZK 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017563
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017563
  - number: 3:1
    text: |-
      1 Het bureau Directeur-generaal Management Openbare Sector staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het coördineren van de beleidsprocessen en het ondersteunen van de bestuursprocessen;

      b. het ontwikkelen van de kaderstelling op DG-niveau;

      c. het uitvoeren van de integrale control (beleids- en PIOFACH-control);

      d. het adviseren ten aanzien van het strategische beleid;

      e. de ondersteuning van het opdrachtgeverschap Gemeenschappelijke Diensten;

      f. de ondersteuning van het eigenaarschap van de agentschappen CAS en IVOP.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 4:1
    text: |-
      De directie Arbeidszaken Openbare Sector bestaat uit de volgende onderdelen:

      a. het Directiesecretariaat (DS);

      b. de afdeling Sociaal- en Economisch Beleid (S&E);

      c. de afdeling Arbeidsverhoudingen & Overlegstelsel (A&O);

      d. de afdeling Arbeidsvoorwaarden, Pensioenen en Internationale Zaken (AP&IZ);

      e. de afdeling Strategie & Planning (S&P);

      f. de afdeling Kennisinfrastructuur & Analyse (K&A);

      g. het bureau Verbond Sectorwerkgevers Overheid (VSO).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:2
    text: |-
      1 Het Directiesecretariaat staat onder leiding van de directeur.

      2 Het Directiesecretariaat heeft tot taak het verzorgen van de ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel42
  - number: 4:3
    text: |-
      1 De afdeling Sociaal en Economische Zaken staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het adviseren van de ministers ten behoeve van de ministerraad en de (sociaal-economische) onderraden;

      b. het als lid functioneren in de Corseib, het ambtelijk voorportaal van de Raad voor het Sociaal-Economisch en
      Inkomensbeleid en het vervangen van de dgMOS in CEC, REA en RSEIB;

      c. het signaleren van trends en ontwikkelingen en het uitvoeren van verkenningen;

      d. het adviseren over budgettaire aspecten van het beleid van de directie;

      e. het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot de
      topbeloningen, de ziektekosten, het arbeidsmarktbeleid het ziekteverzuimbeleid, de arbeidsongeschiktheid en de
      werkeloosheid Openbare Sector;

      f. het ontwikkelen van het beleid en het adviseren ten aanzien van de inrichting en de kosten van de sociale
      zekerheid, zowel t.a.v. het wettelijke als het bovenwettelijke deel;

      g. het verzorgen van het secretariaat van de Adviescommisie Management Openbare Sector (AMOS) en bij toerbeurt het
      secretariaat van de Raad voor Bestuur en Openbare Dienst (RBOD).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:4
    text: |-
      1 De afdeling Arbeidsverhoudingen en Overlegstelsel staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot de
      arbeidsverhoudingen en management (inclusief de [Ambtenarenwet][ref1]) binnen de Openbare Sector;

      b. het ontwikkelen en onderhouden van het model van het Overlegstelsel (i.c. normalisering);

      c. het formuleren van kaderstellend beleid ten aanzien van de inhoud en vormgeving van de ambtelijke rechtspositie
      en het verlenen van adviezen daarbij;

      d. het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot het
      subsidiebeleid ten behoeve van CAOP, SVO, EIPA en OSA;

      e. het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot het
      kaderstellend Integriteitsbeleid Openbare Sector;

      f. het realiseren van transparantie bij topbeloningen;

      g. het implementeren van EU-regelgeving en het ondersteunen van de directie Personeel, Organisatie en Informatie
      Rijk bij CAO-onderhandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 4:5
    text: |-
      1 De afdeling Arbeidsvoorwaarden, Pensioenen en Internationale Zaken staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot de
      arbeidsvoorwaarden (primair en secundair) voor personeel en management, pensioenregelingen en het -stelsel voor
      personeel en management, FPU en levensloopregelingen en het bevorderen van Nederlanders in dienst buitenlandse
      organisaties binnen de Openbare Sector;

      b. het voorbereiden, organiseren en verzorgen van de DG-conferenties;

      c. het opstellen van de speerpuntenbrief en de ruimtebrief;

      d. het verzorgen van het waarnemerschap bij CAO-besprekingen en onderhandelingen;

      e. het verzorgen van de internationale coördinatie op het gebied van arbeidsvoorwaarden binnen de EU;

      f. het verzorgen van de advisering en ondersteuning bij pensioenvraagstukken mede ten behoeve van de directie
      Personeel, Organisatie en Informatie Rijk.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:6
    text: |-
      1 De afdeling Strategie en Planning staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie op het gebied van bedrijfsvoering
      binnen de Openbare Sector, specifiek gerelateerd aan de factor arbeid;

      b. het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie op het gebied van management
      binnen de Openbare Sector;

      c. het opstellen van een onderzoekprogramma voor de periode van 1 tot 5 jaar;

      d. het verzorgen van de coördinatie bij de jaarplancyclus binnen de directie;

      e. het ontwikkelen van een visie en strategie;

      f. het verzorgen van de public relations voor de directie;

      g. het verzorgen van de evaluatiefunctie binnen de directie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:7
    text: |-
      1 De afdeling Kennisinfrastructuur en Analyse staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het op verzoek zelf uitvoeren of laten uitvoeren van onderzoek en analyses op het gebied van personeel,
      organisatie en arbeidsmarktbeleid binnen het Rijk en de Openbare Sector;

      b. het bieden van een kennisinfrastructuur op het gebied van personeel, organisatie en arbeidsmarkt binnen de
      Openbare Sector (incl. datamanagement, het verstrekken van adviezen over het gebruik van onderzoeksmethoden en
      -technieken en het opstellen van prognosemodellen voor het Rijk en de Openbare Sector);

      c. het ontwerpen en beheren van benchmark- en medewerkerstevredenheids-onderzoeken;

      d. het bieden van financiële en informatie-ondersteuning op het gebied van personeel, organisatie en
      arbeidsvoorwaardenbeleid sector Rijk (incl. CAO).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel47
  - number: 4:8
    text: |-
      1 De verantwoordelijkheid voor het Bureau Verbond Sectorwerkgevers Overheid is door de directeur-generaal
      Management Openbare Sector gemandateerd aan de directeur Arbeidszaken Openbare Sector.

      2 Het bureau staat onder leiding van een hoofd.

      3 Het bureau heeft tot taak het voeren van het secretariaat van het verbond van Sectorwerkgevers Overheid.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel48
  - number: 5:1
    text: |-
      De directie Innovatie en Informatiebeleid Openbare Sector bestaat uit de volgende onderdelen:

      a. het directiesecretariaat (DS);

      b. de afdeling Informatie-Infrastructuur (II);

      c. de afdeling Strategie en Innovatie (S&I);

      d. de afdeling Dienstverlening, Transparantie en Administratieve Lasten (DTA).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel51
  - number: 5:2
    text: |-
      1 Het directiesecretariaat staat onder leiding van de directeur.

      2 Het secretariaat heeft tot taak het verzorgen van de ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel52
  - number: 5:3
    text: |-
      1 De afdeling Informatie-Infrastructuur staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het bevorderen van een betrouwbare en veilige informatie-infrastructuur voor communicatie van en met de
      overheid;

      b. het bevorderen van eenmalige gegevensverstrekking met een stelsel van basisregistraties voor een doelmatige
      inrichting van de gegevenshuishouding van de overheid;

      c. het realiseren van een sluitend stelsel van persoonsnummers, met in achtneming van de privacy;

      d. het ontwikkelen van een overheidsarchitectuur met open standaarden en open source software;

      e. het faciliteren en bevorderen van informatiebeveiliging.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:4
    text: |-
      1 De afdeling Strategie en Innovatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ontwikkelen van een strategie voor het overheidsinformatiebeleid;

      b. het op gang brengen en ondersteunen van innovatie in de bedrijfsvoering van organisaties in de openbare sector
      en het doorvertalen van de innovatiepraktijk, met ICT als belangrijk hulpmiddel, naar beleid(skansen);

      c. het coördineren van de internationale dossiers van de directie en het daartoe onderhouden van internationale
      netwerken;

      d. het beheren van relatienetwerken tussen en binnen openbaar bestuur, wetenschap en bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel54
  - number: 5:5
    text: |-
      1 De afdeling Dienstverlening, Transparantie en Administratieve Lasten staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het vergroten van de toegankelijkheid van overheidsinformatie;

      b. het verbeteren van de dienstverlening van de overheid;

      c. het bevorderen van de regie van burgers over de eigen persoonsgegevens;

      d. het beheren van relatienetwerken met andere overheden;

      e. het coördineren van de administratieve lastenreductie van de burger (overheidsbreed), ICT en administratieve
      lasten.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 6:1
    text: |-
      De directie Personeel, Organisatie en Informatie Rijk bestaat uit de volgende onderdelen:

      a. het directiesecretariaat (DS);

      b. de afdeling Arbeidsvoorwaarden (AV);

      c. de afdeling Arbeidskwaliteit (AK);

      d. de afdeling Organisatie (O);

      e. de afdeling Informatie (I);

      f. het Programmabureau Vernieuwing HRM-stelsel RIJK (HRM).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel61
  - number: 6:2
    text: |-
      1 Het directiesecretariaat staat onder leiding van de directeur.

      2 Het directiesecretariaat heeft de volgende taken:

      a. het aangeven van de strategische lijn en het bewaken van de samenhang van het beleid van de directie;

      b. het onderhouden van de externe relaties met (P)SG-beraad, IG-beraad, ICPR en IODI;

      c. het zorgdragen voor de stafverbindingen en beheer.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel62
  - number: 6:3
    text: |-
      1 De afdeling Arbeidsvoorwaarden staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het zorgdragen voor de primaire en secundaire arbeidsvoorwaarden bij het Rijk;

      b. de zorg voor de inactiviteitsregelingen voor het Rijk;

      c. de zorg voor het beloningsbeleid.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel63
  - number: 6:4
    text: |-
      1 De afdeling Arbeidskwaliteit staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het intern en extern bevorderen van de arbeidsmarktpositie van het Rijk;

      b. het zorgdragen voor het verhogen van de interdepartementale doorstroom van personeel;

      c. het bevorderen van het gebruik van eigen kwaliteit en capaciteit in de rijksdienst;

      d. het bevorderen van de ontwikkelingsmogelijkheden van medewerkers;

      e. het zorgdragen voor de toepassing van het integriteitsbeleid van het Rijk;

      f. het zorgdragen voor de toepassing van het arbeidsomstandighedenbeleid.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel64
  - number: 6:5
    text: |-
      1 De afdeling Organisatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ontwikkelen, implementeren, onderhouden en evalueren van een rapportagekader voor de departementale
      topstructuren en het adviseren over afzonderlijke departementale voorstellen betreffende de departementale
      inrichting en de topstructuren;

      b. het ontwikkelen, implementeren, onderhouden en evalueren van een rijksbrede concernvisie op de bedrijfsvoering
      en het bijdragen aan de voorbereiding van voorstellen tot verdere samenwerking en bundeling op dat terrein;

      c. het ontwikkelen, implementeren, onderhouden, evalueren van het verzelfstandigingbeleid en het toetsen van
      afzonderlijke verzelfstandigingvoorstellen;

      d. het ontwikkelen, implementeren, onderhouden, en evalueren van het toezichtbeleid en het adviseren over nieuwe
      ontwikkelingen op het terrein van het toezicht;

      e. het ontwikkelen, implementeren, onderhouden, en evalueren van het adviesstelsel en het toetsen van afzonderlijke
      voorstellen voor instelling van adviescolleges.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel65
  - number: 6:6
    text: |-
      1 De afdeling Informatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het bevorderen van de doelmatigheid en de doeltreffendheid van de bedrijfsvoering bij het Rijk door de inzet
      van ICT;

      b. het daartoe bevorderen van de samenwerking tussen ministeries op het vlak van de ICT in de bedrijfsvoering;

      c. het optreden als opdrachtgever voor concernbrede ICT-voorzieningen.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel66
  - number: 6:7
    text: |-
      1 Het Programmabureau Vernieuwing HRM-stelsel RIJK staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het faciliteren en volgen van de uitvoering van departementale plannen ter verhoging van de kwaliteit van de
      HRM-functie;

      b. het ondersteunen van de opdrachtgever ten aanzien van het inrichten van een Shared Service Center HRM;

      c. het uitvoeren van interdepartementaal onderzoek naar mogelijkheden voor de vorming van een Expertise- en
      Ontwikkelcentrum;

      d. het afronden van de pilot benchmarken.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel67
  - number: 7:1
    text: |-
      1 Het Service Center staat onder leiding van een manager.

      2 Het Service Center bestaat uit de volgende afdelingen:

      a. de afdeling Digitalisering Arbeidsmarkt (DA);

      b. de afdeling Merk en Communicatie (M&C);

      c. de afdeling Programma’s en Evenementen (P&E).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel71
  - number: '7.2'
    text: |-
      1 De afdeling Digitalisering Arbeidsmarkt staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het (door)ontwikkelen van en zorgdragen voor de consistentie en integratie van de (toekomstige) digitale
      producten van het service center en E-HRM instrumenten;

      b. het beheren van applicaties, gegevens, databases en datacommunicatie en het onderhouden van de digitale
      producten van het Service Center;

      c. het fungeren als helpdesk voor beantwoording van vragen en het oplossen van storingen voor deelnemende
      organisaties en gebruikers;

      d. het adviseren over het gebruik van E-HRM instrumenten op het gebied van in- door en uitstroom;

      e. het verantwoordelijk zijn voor de technische en inhoudelijke functionaliteiten, het doel- en rechtmatig gebruik
      van de digitale producten;

      f. het fungeren als intermediair voor de gebruikers en de overheidsorganisaties;

      g. het genereren van de benodigde (management)informatie over het gebruik en de werking van de digitale producten;

      h. het digitaal transparant houden van de arbeidsmarkt van internationale (overheids)organisaties.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.2
  - number: '7.3'
    text: |-
      1 De afdeling Merk & Communicatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het versterken en bestendigen van de positie van het merk Rijk als werkgever op de interne en externe
      arbeidsmarkt;

      b. het (door)ontwikkelen van en zorgdragen voor consistentie en inhoud van de campagne Werken bij het Rijk;

      c. het adviseren over interne doorvertaling van de arbeidsmarktcommunicatie van het Rijk;

      d. het zorgdragen voor het communicatiebeleid van het Service Center en haar producten;

      e. het (doen) verzorgen van de periodieke uitgaven verRijking en het HRM-blad BinnenbeRijk.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      1 De afdeling Programma’s en Evenementen staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het organiseren van (doelgroepgerichte) evenementen en beurzen;

      b. het organiseren van het gemeenschappelijk optreden namens de ministeries en onderdelen van het Service Center op
      door externen georganiseerde arbeidsmarkt gerelateerde beurzen en evenementen;

      c. het organiseren van trainingen en simulaties voor verschillende doelgroepen;

      d. het geven van voorlichting over het werken bij internationale organisaties;

      e. het zorgdragen voor het promotiemateriaal van het Service Center;

      f. het organiseren en coördineren van de uitvoering van het Rijkstraineeprogramma.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel7.4
  - number: 8:1
    text: |-
      Het Agentschap Informatievoorziening Overheidspersoneel bestaat uit de volgende afdelingen:

      a. de stafafdeling (SA);

      b. de afdeling Salarisinformatie (SI);

      c. de afdeling Personeelsinformatie (PI).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel81
  - number: 8:2
    text: |-
      1 De stafafdeling staat onder leiding van een hoofd.

      2 De stafafdeling draagt zorg voor ondersteuning van de directie en lijnafdelingen, op het gebied van
      personeelszaken, financiën, automatisering, facilitaire bedrijfsvoering, secretariële en administratieve
      ondersteuning, communicatie en quality assurance.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel82
  - number: 8:3
    text: |-
      1 De afdeling Salarisinformatie staat onder leiding van een hoofd.

      2 De afdeling draagt zorg voor ontwerp, ontwikkeling, bouw en het in bedrijf houden van hoogwaardige
      informatiesystemen op het gebied van de salarisadministratie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel83
  - number: 8:4
    text: |-
      1 De afdeling Personeelsinformatie staat onder leiding van een hoofd.

      2 De afdeling draagt zorg voor ontwerp, ontwikkeling, bouw en het in bedrijf houden van hoogwaardige
      informatiesystemen op het gebied van de financiële personeelsadministratie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel84
  - number: '9'
    text: |-
      [Artikel 3:24 van het Organisatiebesluit BZK 2004][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017563#Artikel324
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017563
        artikel: 3:24
  - number: '10'
    text: |-
      Tot de taak van de dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan vermeld,
      in opdracht van de minister, de secretaris‑generaal of de directeur-generaal, voor zover hogere wet- en regelgeving
      zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel10
  - number: 11:1
    text: |-
      1 De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel111
  - number: 11:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel112
  - number: 12:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2004.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel121
  - number: 12:2
    text: |-
