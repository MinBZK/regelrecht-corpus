articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - het Ministerie: het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Minister voor Bestuurlijke Vernieuwing
      en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Management Openbare Sector.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Management Openbare Sector, genoemd in het
      [Organisatiebesluit BZK 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017563
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017563
  - number: 3:1.1
    text: Het bureau Directeur-generaal Management Openbare Sector staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 3:1.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 3:1.2.a
    text: het coördineren van de beleidsprocessen en het ondersteunen van de bestuursprocessen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 3:1.2.b
    text: het ontwikkelen van de kaderstelling op DG-niveau;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 3:1.2.c
    text: het uitvoeren van de integrale control (beleids- en PIOFACH-control);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 3:1.2.d
    text: het adviseren ten aanzien van het strategische beleid;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 3:1.2.e
    text: de ondersteuning van het opdrachtgeverschap Gemeenschappelijke Diensten;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 3:1.2.f
    text: de ondersteuning van het eigenaarschap van de agentschappen CAS en IVOP.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel31
  - number: 4:1
    text: 'De directie Arbeidszaken Openbare Sector bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:1.a
    text: het Directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:1.b
    text: de afdeling Sociaal- en Economisch Beleid (S&E);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:1.c
    text: de afdeling Arbeidsverhoudingen & Overlegstelsel (A&O);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:1.d
    text: de afdeling Arbeidsvoorwaarden, Pensioenen en Internationale Zaken (AP&IZ);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:1.e
    text: de afdeling Strategie & Planning (S&P);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:1.f
    text: de afdeling Kennisinfrastructuur & Analyse (K&A);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:1.g
    text: het bureau Verbond Sectorwerkgevers Overheid (VSO).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel41
  - number: 4:2.1
    text: Het Directiesecretariaat staat onder leiding van de directeur.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel42
  - number: 4:2.2
    text: Het Directiesecretariaat heeft tot taak het verzorgen van de ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel42
  - number: 4:3.1
    text: De afdeling Sociaal en Economische Zaken staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2.a
    text: het adviseren van de ministers ten behoeve van de ministerraad en de (sociaal-economische) onderraden;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2.b
    text: |-
      het als lid functioneren in de Corseib, het ambtelijk voorportaal van de Raad voor het Sociaal-Economisch en
      Inkomensbeleid en het vervangen van de dgMOS in CEC, REA en RSEIB;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2.c
    text: het signaleren van trends en ontwikkelingen en het uitvoeren van verkenningen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2.d
    text: het adviseren over budgettaire aspecten van het beleid van de directie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2.e
    text: |-
      het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot de topbeloningen,
      de ziektekosten, het arbeidsmarktbeleid het ziekteverzuimbeleid, de arbeidsongeschiktheid en de werkeloosheid
      Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2.f
    text: |-
      het ontwikkelen van het beleid en het adviseren ten aanzien van de inrichting en de kosten van de sociale
      zekerheid, zowel t.a.v. het wettelijke als het bovenwettelijke deel;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:3.2.g
    text: |-
      het verzorgen van het secretariaat van de Adviescommisie Management Openbare Sector (AMOS) en bij toerbeurt het
      secretariaat van de Raad voor Bestuur en Openbare Dienst (RBOD).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel43
  - number: 4:4.1
    text: De afdeling Arbeidsverhoudingen en Overlegstelsel staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:4.2.a
    text: |-
      het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot de
      arbeidsverhoudingen en management (inclusief de [Ambtenarenwet][ref1]) binnen de Openbare Sector;


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 4:4.2.b
    text: het ontwikkelen en onderhouden van het model van het Overlegstelsel (i.c. normalisering);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:4.2.c
    text: |-
      het formuleren van kaderstellend beleid ten aanzien van de inhoud en vormgeving van de ambtelijke rechtspositie en
      het verlenen van adviezen daarbij;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:4.2.d
    text: |-
      het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot het
      subsidiebeleid ten behoeve van CAOP, SVO, EIPA en OSA;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:4.2.e
    text: |-
      het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot het kaderstellend
      Integriteitsbeleid Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:4.2.f
    text: het realiseren van transparantie bij topbeloningen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:4.2.g
    text: |-
      het implementeren van EU-regelgeving en het ondersteunen van de directie Personeel, Organisatie en Informatie Rijk
      bij CAO-onderhandelingen.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel44
  - number: 4:5.1
    text: De afdeling Arbeidsvoorwaarden, Pensioenen en Internationale Zaken staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:5.2.a
    text: |-
      het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot de
      arbeidsvoorwaarden (primair en secundair) voor personeel en management, pensioenregelingen en het -stelsel voor
      personeel en management, FPU en levensloopregelingen en het bevorderen van Nederlanders in dienst buitenlandse
      organisaties binnen de Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:5.2.b
    text: het voorbereiden, organiseren en verzorgen van de DG-conferenties;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:5.2.c
    text: het opstellen van de speerpuntenbrief en de ruimtebrief;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:5.2.d
    text: het verzorgen van het waarnemerschap bij CAO-besprekingen en onderhandelingen;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:5.2.e
    text: het verzorgen van de internationale coördinatie op het gebied van arbeidsvoorwaarden binnen de EU;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:5.2.f
    text: |-
      het verzorgen van de advisering en ondersteuning bij pensioenvraagstukken mede ten behoeve van de directie
      Personeel, Organisatie en Informatie Rijk.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel45
  - number: 4:6.1
    text: De afdeling Strategie en Planning staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2.a
    text: |-
      het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie op het gebied van bedrijfsvoering
      binnen de Openbare Sector, specifiek gerelateerd aan de factor arbeid;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2.b
    text: |-
      het verzorgen van de beleidsontwikkeling, sturing, facilitering en coördinatie op het gebied van management binnen
      de Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2.c
    text: het opstellen van een onderzoekprogramma voor de periode van 1 tot 5 jaar;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2.d
    text: het verzorgen van de coördinatie bij de jaarplancyclus binnen de directie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2.e
    text: het ontwikkelen van een visie en strategie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2.f
    text: het verzorgen van de public relations voor de directie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:6.2.g
    text: het verzorgen van de evaluatiefunctie binnen de directie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel46
  - number: 4:7.1
    text: De afdeling Kennisinfrastructuur en Analyse staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel47
  - number: 4:7.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel47
  - number: 4:7.2.a
    text: |-
      het op verzoek zelf uitvoeren of laten uitvoeren van onderzoek en analyses op het gebied van personeel, organisatie
      en arbeidsmarktbeleid binnen het Rijk en de Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel47
  - number: 4:7.2.b
    text: |-
      het bieden van een kennisinfrastructuur op het gebied van personeel, organisatie en arbeidsmarkt binnen de Openbare
      Sector (incl. datamanagement, het verstrekken van adviezen over het gebruik van onderzoeksmethoden en -technieken
      en het opstellen van prognosemodellen voor het Rijk en de Openbare Sector);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel47
  - number: 4:7.2.c
    text: het ontwerpen en beheren van benchmark- en medewerkerstevredenheids-onderzoeken;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel47
  - number: 4:7.2.d
    text: |-
      het bieden van financiële en informatie-ondersteuning op het gebied van personeel, organisatie en
      arbeidsvoorwaardenbeleid sector Rijk (incl. CAO).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel47
  - number: 4:8.1
    text: |-
      De verantwoordelijkheid voor het Bureau Verbond Sectorwerkgevers Overheid is door de directeur-generaal Management
      Openbare Sector gemandateerd aan de directeur Arbeidszaken Openbare Sector.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel48
  - number: 4:8.2
    text: Het bureau staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel48
  - number: 4:8.3
    text: Het bureau heeft tot taak het voeren van het secretariaat van het verbond van Sectorwerkgevers Overheid.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel48
  - number: 5:1
    text: 'De directie Innovatie en Informatiebeleid Openbare Sector bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel51
  - number: 5:1.a
    text: het directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel51
  - number: 5:1.b
    text: de afdeling Informatie-Infrastructuur (II);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel51
  - number: 5:1.c
    text: de afdeling Strategie en Innovatie (S&I);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel51
  - number: 5:1.d
    text: de afdeling Dienstverlening, Transparantie en Administratieve Lasten (DTA).
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel51
  - number: 5:2.1
    text: Het directiesecretariaat staat onder leiding van de directeur.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel52
  - number: 5:2.2
    text: Het secretariaat heeft tot taak het verzorgen van de ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel52
  - number: 5:3.1
    text: De afdeling Informatie-Infrastructuur staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:3.2.a
    text: het bevorderen van een betrouwbare en veilige informatie-infrastructuur voor communicatie van en met de overheid;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:3.2.b
    text: |-
      het bevorderen van eenmalige gegevensverstrekking met een stelsel van basisregistraties voor een doelmatige
      inrichting van de gegevenshuishouding van de overheid;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:3.2.c
    text: het realiseren van een sluitend stelsel van persoonsnummers, met in achtneming van de privacy;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:3.2.d
    text: het ontwikkelen van een overheidsarchitectuur met open standaarden en open source software;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:3.2.e
    text: het faciliteren en bevorderen van informatiebeveiliging.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel53
  - number: 5:4.1
    text: De afdeling Strategie en Innovatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel54
  - number: 5:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel54
  - number: 5:4.2.a
    text: het ontwikkelen van een strategie voor het overheidsinformatiebeleid;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel54
  - number: 5:4.2.b
    text: |-
      het op gang brengen en ondersteunen van innovatie in de bedrijfsvoering van organisaties in de openbare sector en
      het doorvertalen van de innovatiepraktijk, met ICT als belangrijk hulpmiddel, naar beleid(skansen);
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel54
  - number: 5:4.2.c
    text: |-
      het coördineren van de internationale dossiers van de directie en het daartoe onderhouden van internationale
      netwerken;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel54
  - number: 5:4.2.d
    text: het beheren van relatienetwerken tussen en binnen openbaar bestuur, wetenschap en bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel54
  - number: 5:5.1
    text: De afdeling Dienstverlening, Transparantie en Administratieve Lasten staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 5:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 5:5.2.a
    text: het vergroten van de toegankelijkheid van overheidsinformatie;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 5:5.2.b
    text: het verbeteren van de dienstverlening van de overheid;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 5:5.2.c
    text: het bevorderen van de regie van burgers over de eigen persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 5:5.2.d
    text: het beheren van relatienetwerken met andere overheden;
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 5:5.2.e
    text: |-
      het coördineren van de administratieve lastenreductie van de burger (overheidsbreed), ICT en administratieve
      lasten.
    url: https://wetten.overheid.nl/BWBR0018006/2006-01-01#Artikel55
  - number: 6:1
    text: 'De directie Personeel, Organisatie en Informatie Rijk bestaat uit de volgende onderdelen:'
