  - number: 32r
    text: |-
      Het is een pensioeninstelling uit een andere lidstaat verboden bijdragen te aanvaarden van een in Nederland zetel
      hebbende bijdragende onderneming zonder:

      a. een daartoe verleende vergunning van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een
      andere lidstaat haar zetel heeft; en

      b. zonder de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling zetel heeft in kennis te hebben
      gesteld van het voornemen een pensioenregeling uit te voeren voor een in Nederland gevestigde bijdragende
      onderneming.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32r
  - number: 32s
    text: |-
      De Pensioen- & Verzekeringskamer is verplicht nauw samen te werken met de Europese Commissie en de bevoegde
      autoriteiten uit andere lidstaten dan Nederland, zoals voorgeschreven door [richtlijn 2003/41/EG](32003L0041).
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32s
  - number: 32t
    text: |-
      Wanneer bij het toezicht door de Pensioen- & Verzekeringskamer blijkt dat een pensioeninstelling uit een andere
      lidstaat bij de uitvoering van een pensioenregeling waaraan wordt bijgedragen door een in Nederland zetel hebbende
      bijdragende onderneming in strijd met de Nederlandse sociale en arbeidswetgeving of de [artikelen 17][ref1],
      [17a][ref2] en [17b][ref3] handelt, stelt de Pensioen- & Verzekeringskamer de bevoegde autoriteiten van de lidstaat
      waar de pensioeninstelling haar zetel heeft hiervan onverwijld in kennis, onder mededeling van deze kennisgeving
      aan de pensioeninstelling uit een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32t
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0002089
        artikel: 17b
  - number: 32u
    text: |-
      1 Indien een pensioeninstelling uit een andere lidstaat inbreuk blijft maken op de op de pensioenregeling
      toepasselijke Nederlandse sociale en arbeidswetgeving, in weerwil van de door de bevoegde autoriteiten van de
      lidstaat waar de pensioeninstelling uit een andere lidstaat haar zetel heeft getroffen maatregelen of omdat
      die bevoegde autoriteiten geen passende maatregelen hebben getroffen, kan de Pensioen- & Verzekeringskamer, na
      die bevoegde autoriteiten daarvan in kennis te hebben gesteld, passende maatregelen nemen om de inbreuk op de
      toepasselijke regelgeving door de pensioeninstelling te beëindigen en, voorzover zulks volstrekt noodzakelijk is,
      de pensioeninstelling te beletten activiteiten te verrichten voor de Nederlandse bijdragende onderneming.

      2 De Pensioen- & Verzekeringskamer kan, ter uitvoering van het eerste lid, de bevoegdheden, bedoeld in de
      [artikelen 23 tot en met 23b][ref1], toepassen.

      3 De Pensioen- & Verzekeringskamer kan, na toepassing van [artikel 32t][ref2], de bevoegdheden, bedoeld in
      de [artikelen 23 tot en met 23b][ref3], toepassen wanneer een pensioeninstelling uit een andere lidstaat
      [artikel 32r][ref4] niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32t
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel32r
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32u
