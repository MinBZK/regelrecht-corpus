  - number: 6ca
    text: |-
      1 Een geleding binnen de deelnemersraad kan bij de ondernemingskamer van het gerechtshof te Amsterdam beroep
      instellen tegen een besluit als bedoeld in artikel 6b, eerste lid, onderdeel f of g, van het bevoegde orgaan van
      het fonds, wanneer dat besluit niet in overeenstemming is met het advies van de deelnemersraad.

      2 Artikel 6c, derde tot en met tiende lid, is van overeenkomstige toepasssing.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel6ca
  - number: 6d
    text: |-
      1 Indien binnen de in [artikel 6c, derde lid][ref1], bedoelde termijn geen beroep bij de ondernemingskamer is
      ingesteld, kan de deelnemersraad of een gedeelte van ten minste 10% van de leden van de deelnemersraad een klacht
      indienen bij de Pensioen- & Verzekeringskamer op grond van het oordeel dat het bevoegde orgaan van het fonds
      bij een aangelegenheid als bedoeld in [artikel 6b, eerste lid][ref2], de belangen van belanghebbenden niet op
      evenwichtige wijze behartigt. De klacht wordt binnen acht weken na afloop van die termijn ingediend volgens door
      de Pensioen- & Verzekeringskamer te stellen regels. Die regels, welke de goedkeuring behoeven van Onze Minister,
      worden in de Staatscourant bekend gemaakt. Goedkeuring kan slechts worden onthouden wegens strijd met het recht of
      het algemeen belang.

      2 De Pensioen- & Verzekeringskamer geeft zo spoedig mogelijk, maar in elk geval binnen twaalf weken na dagtekening
      van de klacht, een oordeel. Zij stelt het bevoegde orgaan van het fonds en de deelnemersraad hiervan onverwijld
      in kennis.

      3 Indien de Pensioen- & Verzekeringskamer de klacht geheel of gedeeltelijk gegrond heeft verklaard, is het bevoegde
      orgaan van het fonds verplicht om binnen twaalf weken na dagtekening van de kennisgeving, bedoeld in het tweede
      lid, zijn zienswijze terzake aan de Pensioen- & Verzekeringskamer te berichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel6c
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel6b
