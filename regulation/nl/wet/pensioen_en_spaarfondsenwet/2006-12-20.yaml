  - number: '20'
    text: |-
      1 Het toezicht op de uitvoering van deze wet berust bij de Pensioen- & Verzekeringskamer.

      2 De Pensioen- & Verzekeringskamer beheert een register waarin alle pensioenfondsen met zetel in Nederland worden
      ingeschreven. In het register wordt, indien van toepassing, vermeld in welke lidstaten een fonds pensioenregelingen
      uitvoert.

      3 Onze Minister kan met betrekking tot de uitvoering van de [artikelen 2a][ref1], [2b][ref2], [2c][ref3],
      [3b][ref4], [6a][ref5], [6d][ref6], [7][ref7], [8][ref8], [8a][ref9], [8b][ref10], [8c][ref11], [25][ref12],
