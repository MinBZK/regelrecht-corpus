  - number: 10b
    text: |-
      1 Het boekjaar van een pensioenfonds of een spaarfonds loopt van 1 januari tot en met 31 december.

      2 Het bestuur van een pensioenfonds of een spaarfonds legt aan de Pensioen- & Verzekeringskamer jaarlijks binnen
      zes maanden na afloop van het boekjaar een jaarrekening, een jaarverslag en overige gegevens over het verstreken
      boekjaar over, waarin een volledig beeld van de financiële toestand van het fonds gegeven wordt en waaruit ten
      genoegen van die kamer blijkt dat wordt voldaan aan het bepaalde bij en krachtens deze wet en dat de belangen van
      de bij het fonds betrokken deelnemers, gewezen deelnemers en overige belanghebbenden voldoende gewaarborgd geacht
      kunnen worden. In de jaarrekening en het jaarverslag wordt rekening gehouden met iedere door het fonds uitgevoerde
      pensioenregeling.

      3 Het bestuur van een fonds ten aanzien waarvan [artikel 10][ref1] toepassing vindt legt aan de Pensioen- &
      Verzekeringskamer bovendien jaarlijks binnen zes maanden na afloop van het boekjaar een actuarieel verslag
      betreffende het fonds over, voorzien van de verklaring van een actuaris.

      4 De jaarrekening moet zijn voorzien van een verklaring omtrent de getrouwheid, ondertekend door een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      5 De accountant, bedoeld in het vierde lid, is verplicht desgevraagd aan de Pensioen- & Verzekeringskamer inzicht
      te bieden in zijn controlewerkzaamheden alsmede haar alle overige inlichtingen te verstrekken die redelijkerwijze
      geacht kunnen worden nodig te zijn voor de vervulling van de haar bij of krachtens deze wet opgelegde taak.
      De Pensioen- & Verzekeringskamer stelt het bestuur van het fonds in de gelegenheid aanwezig te zijn bij het
      verstrekken van inlichtingen door de accountant.

      6 Het vijfde lid is van overeenkomstige toepassing ten aanzien van de actuaris, bedoeld in het derde lid.

      7

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      wordt voldaan aan de verplichtingen, bedoeld in het eerste tot en met het zesde lid. Daarbij kunnen regels worden
      gesteld omtrent het in bepaalde gevallen meermalen per jaar overleggen van gegevens of verklaringen als bedoeld in
      dit artikel.

      9 De Pensioen- & Verzekeringskamer kan regels stellen met betrekking tot de wijze van overlegging van de in dit
      artikel bedoelde bescheiden.

      10 Indien de accountant naar het oordeel van de Pensioen- & Verzekeringskamer niet of niet meer de nodige
      waarborgen biedt dat deze de toevertrouwde taak met betrekking tot het fonds naar behoren zal vervullen, kan
      de Pensioen- & Verzekeringskamer bepalen dat hij niet bevoegd is de verklaring, bedoeld in het vierde lid, met
      betrekking tot dat fonds af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel10b
