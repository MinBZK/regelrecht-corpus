        artikel: 9c
  - number: '19'
    text: |-
      Een pensioenfonds, een spaarfonds, een werkgever en een verzekeraar als bedoeld in [artikel 2, vierde lid][ref1],
      verstrekken aan de Pensioen- & Verzekeringskamer binnen de door haar te bepalen termijn kosteloos de inlichtingen
      die zij voor de vervulling van de haar bij of krachtens deze wet opgelegde taak nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
