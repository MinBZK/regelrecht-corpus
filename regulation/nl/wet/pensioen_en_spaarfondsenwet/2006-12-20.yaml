  - number: 17a
    text: |-
      Onverminderd het bepaalde in [artikel 8, vierde lid][ref1], verstrekt het bestuur van een pensioenfonds op verzoek
      aan de deelnemer en de gewezen deelnemer binnen drie maanden een opgave van de hoogte van de opgebouwde aanspraken.

      Het fonds kan een vergoeding vragen van de aan de opgave verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel8
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '8'
  - number: 17b
    text: |-
      1 Het bestuur van een pensioenfonds verstrekt op verzoek aan de deelnemers, gewezen deelnemers, gepensioneerden en
      hun pensioengerechtigde nagelaten betrekkingen en hun vertegenwoordigers:

      a. voldoende inlichtingen over de rechten en plichten van de bij de pensioenregeling betrokken partijen;

      b. voldoende inlichtingen over de financiële, technische en andere aan de pensioenregeling verbonden risico's;

      c. voldoende inlichtingen over de aard en spreiding van de risico's;

      d. de jaarrekeningen en de jaarverslagen;

      e. binnen een redelijke termijn, alle relevante informatie over wijzigingen in de voorschriften inzake de
      pensioenregeling;

      f. de in [artikel 9c, derde lid][ref1], bedoelde verklaring inzake de beleggingsbeginselen;

      g. duidelijke en wezenlijke gegevens over:

      1°. indien van toepassing, het richtniveau van de pensioenuitkeringen;

      2°. het niveau van de uitkeringen in geval van beëindiging van de deelneming;

      3°. wanneer de deelnemer het beleggingsrisico draagt, alle beschikbare beleggingsmogelijkheden, indien van
      toepassing, en de feitelijke beleggingsportefeuille, evenals gegevens over de risicopositie en de kosten in verband
      met de beleggingen;

      4°. de modaliteiten voor de afkoop van de aanspraken op pensioen, onder aanwending van de afkoopsom om pensioen
      of aanspraken op pensioen te verwerven bij een ander pensioenfonds, beroepspensioenfonds, verzekeraar of
      pensioeninstelling uit een andere lidstaat in geval van beëindiging van de dienstbetrekking;

      h. beknopte informatie over de situatie van het pensioenfonds en over het actuele financieringsniveau van hun
      totale individuele aanspraken.

      2 Bij de ingang van zijn pensioen op grond van een pensioenregeling, ontvangt de pensioengerechtigde de nodige
      informatie over de uitkeringen waarop hij recht heeft en over de wijze van uitbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel9c
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel17b
