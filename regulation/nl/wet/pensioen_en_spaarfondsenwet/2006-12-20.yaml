        bwb_id: BWBR0002089
        artikel: 9a
      - id: ref6
        bwb_id: BWBR0002089
        artikel: 17b
  - number: 32k
    text: |-
      De Pensioen- & Verzekeringskamer kan de vergunning, bedoeld in [artikel 32i, onderdeel a][ref1], geheel of
      gedeeltelijk intrekken of daaraan nadere voorschriften verbinden wanneer:

      a. het pensioenfonds niet langer voldoet aan [artikel 32j][ref2];

      b. de bij de aanvraag verstrekte gegevens onjuist of onvolledig zijn en de verstrekking van de juiste of volledige
      gegevens tot een andere beschikking op de aanvraag tot verlening van de vergunning zou hebben geleid;

      c. de verlening van de vergunning anderszins onjuist was en het fonds dit wist of behoorde te weten, of

      d. van de vergunning gedurende twee jaren, na de dagtekening van de beschikking waarbij de vergunning is verleend,
      geen gebruik is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32i
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32j
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32k
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32i
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32j
  - number: 32l
    text: |-
      1 Een pensioenfonds stelt de Pensioen- & Verzekeringskamer in kennis van een voornemen bijdragen te gaan ontvangen
      van een bijdragende onderneming met zetel in een andere lidstaat dan Nederland.

      2 De kennisgeving, bedoeld in het eerste lid, gaat vergezeld van een opgave van:

      a. de lidstaat waarvan de voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is
      op de rechtsverhouding tussen de bijdragende onderneming en de werknemers;

      b. de naam van de bijdragende onderneming; en

      c. de voornaamste kenmerken van de pensioenregeling die voor die onderneming zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32l
  - number: 32m
    text: |-
      1 De Pensioen- & Verzekeringskamer doet binnen drie maanden na ontvangst van de gegevens, bedoeld in
      [artikel 32l, tweede lid][ref1], mededeling van deze gegevens aan de bevoegde autoriteiten van de lidstaat waarvan
      de voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de rechtsverhouding
      tussen de bijdragende onderneming en de werknemers of op degene die een vrij beroep uitoefent, tenzij het
      pensioenfonds niet beschikt over de vergunning, bedoeld in [artikel 32i][ref2], of de Pensioen- & Verzekeringskamer
      reden heeft te betwijfelen dat de administratieve structuur of de financiële positie van het pensioenfonds, of de
      goede reputatie en de beroepskwalificaties of beroepservaring van de personen die het fonds besturen met de in die
      lidstaat voorgenomen activiteiten verenigbaar zijn.

      2 De Pensioen- & Verzekeringskamer doet gelijktijdig mededeling aan het fonds van de verstrekking van de gegevens
      aan de bevoegde autoriteiten, bedoeld in het eerste lid.

      3 De Pensioen- & Verzekeringskamer doet mededeling aan het fonds van informatie over de toepasselijke bepalingen
      van sociale en arbeidswetgeving, ontvangen van de bevoegde autoriteiten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32l
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32i
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32m
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32l
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32i
  - number: 32n
    text: |-
      1 De Pensioen- & Verzekeringskamer verbiedt een pensioenfonds bijdragen te ontvangen van een onderneming
      met een zetel in een andere lidstaat wanneer de Pensioen- & Verzekeringskamer reden heeft tot twijfel als
      bedoeld in [artikel 32m, eerste lid][ref1], of het fonds niet beschikt over een vergunning, bedoeld in
      [artikel 32i, onderdeel a][ref2].

      2 De Pensioen- & Verzekeringskamer kan een fonds verbieden nog langer bijdragen te ontvangen van een bijdragende
      onderneming met zetel in een andere lidstaat wanneer door de bevoegde autoriteiten van de lidstaat waarvan de voor
      bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is, melding heeft gemaakt van een
      door het fonds gemaakte inbreuk op de toepasselijke sociale en arbeidswetgeving.

      3 De Pensioen- & Verzekeringskamer legt een verbod als bedoeld in dit artikel op in de vorm van een aanwijzing als
      bedoeld in [artikel 23][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32m
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32i
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel23
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32n
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32m
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32i
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '23'
  - number: 32o
    text: |-
      1 Een pensioenfonds kan na ontvangst van de mededeling, bedoeld in [artikel 32m, derde lid][ref1], dan wel nadat
      twee maanden zijn verstreken na ontvangst van de mededeling, bedoeld in [artikel 32m, tweede lid][ref2], beginnen
      met het uitvoeren van de voorgenomen pensioenregeling.

      2 Het fonds neemt bij de uitvoering van de pensioenregeling de op bedrijfspensioenvoorziening toepasselijke sociale
      en arbeidswetgeving en de voorschriften die krachtens de artikelen 11 en 18, zevende lid, van [richtlijn 2003/41/
      EG](32003L0041) moeten worden nageleefd, in acht. De Nederlandse sociale en arbeidswetgeving is niet van toepassing
      op de uitvoering van de pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32m
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32m
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32o
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32m
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32m
  - number: 32p
    text: |-
      De Pensioen- & Verzekeringskamer neemt, in coördinatie met de bevoegde autoriteiten van de lidstaat waarvan de
      voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de pensioenregeling,
      de nodige maatregelen om ervoor te zorgen dat een pensioenfonds of beroepspensioenfonds een einde maakt aan een
      vastgestelde inbreuk op de toepasselijke regelgeving.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32p
  - number: 32q
    text: |-
      1 De Pensioen- & Verzekeringskamer informeert, binnen twee maanden na de datum van ontvangst van gegevens als
      bedoeld in [artikel 32l, tweede lid][ref1], de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit
      een andere lidstaat haar zetel heeft en die deze gegevens hebben verstrekt, over de bepalingen van de Nederlandse
      sociale en arbeidswetgeving die van toepassing zijn op de pensioenregeling waaraan wordt bijgedragen door de in
      Nederland zetel hebbende bijdragende onderneming en de [artikelen 17][ref2], [17a][ref3] en [17b][ref4].

      2 De Pensioen- & Verzekeringskamer stelt de bevoegde autoriteiten, bedoeld in het eerste lid, in kennis van
      elke significante wijziging in de op de pensioenregeling toepasselijke sociale en arbeidswetgeving die gevolgen
      kan hebben voor de kenmerken van de pensioenregeling en voorts van iedere wijziging in de [artikelen 17][ref5],
      [17a][ref6] en [17b][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32l
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel17a
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel17b
      [ref5]: https://wetten.overheid.nl/BWBR0002089#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0002089#Artikel17a
      [ref7]: https://wetten.overheid.nl/BWBR0002089#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32q
