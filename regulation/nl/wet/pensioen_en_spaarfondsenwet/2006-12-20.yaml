      1 Overtreding van het bij de [artikelen 2, eerste lid][ref1], [3, eerste lid][ref2], [4, tweede lid][ref3],
      [10b, vijfde en zesde lid][ref4], [11, eerste en tweede lid][ref5], [18][ref6], [19][ref7],
      [22, tweede en vierde lid][ref8], [23, tweede lid][ref9], en [23l, eerste en derde lid][ref10], bepaalde wordt
      gestraft met een geldboete van de tweede categorie. Overtreding van het bepaalde in 32, vierde en vijfde lid, en
      32ba, wordt gestraft met een geldboete van de vierde categorie.

      2 Met een geldboete van de tweede categorie wordt gestraft overtreding van voorschriften, krachtens deze wet bij
      algemene maatregel van bestuur gegeven, voor zover uitdrukkelijk als strafbaar feit in de zin dezer wet aangeduid.

      3 De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.


