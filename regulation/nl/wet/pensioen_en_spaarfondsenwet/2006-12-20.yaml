  - number: 32c
    text: |-
      Ingeval het bepaalde in [artikel 5 van de Wet verevening pensioenrechten bij scheiding][ref1] toepassing vindt is
      het bepaalde bij of krachtens deze wet van overeenkomstige toepassing op het eigen recht op pensioen van de tot
      verevening gerechtigde echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel5
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '5'
  - number: 32d
    text: |-
      In de [artikelen 32d tot en met 32u][ref1] wordt verstaan onder:

      a. pensioenregeling:

      1°. een pensioenregeling op grond van een pensioentoezegging in de zin van [artikel 2, eerste lid][ref2], of een
      andere pensioenregeling welke niet bij of krachtens een wet is vastgesteld dan wel,

      2°. indien de bijdragende onderneming zetel heeft in een andere lidstaat dan Nederland, een overeenkomst, een
      trustakte of voorschriften waarin is bepaald welke pensioenuitkeringen worden toegezegd en onder welke voorwaarden;

      b. pensioen: pensioen op grond van een pensioenregeling als bedoeld onder a;

      c. deelnemer: een deelnemer aan een pensioenregeling als bedoeld onder a;

      d. gedetacheerd werknemer: een werknemer die in een andere lidstaat wordt gedetacheerd om daar te werken en die
      krachtens titel II van [verordening (EEG) nr. 1408/71](31971R1408) van de Raad van de Europese gemeenschappen
      van 14 juni 1971 betreffende de toepassing van de socialezekerheidsregelingen op loontrekkenden en hun gezinnen,
      die zich binnen de gemeenschap verplaatsen (PbEG L 149), onderworpen blijft aan de wetgeving van de lidstaat van
      oorsprong;

      e. [richtlijn 2003/41/EG](32003L0041): [richtlijn nr. 2003/41/EG](32003L0041) van het Europees Parlement en de
      Raad van de Europese Unie van 3 juni 2003 betreffende de werkzaamheden van en het toezicht op instellingen voor
      bedrijfspensioenvoorziening (PbEG L 235/10);

      f. bevoegde autoriteiten: de nationale autoriteiten van andere lidstaten dan Nederland die op grond van artikel
      6, onderdeel g, van [richtlijn 2003/41/EG](32003L0041) zijn aangewezen om de in die richtlijn vastgelegde taken
      te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32d
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32d
