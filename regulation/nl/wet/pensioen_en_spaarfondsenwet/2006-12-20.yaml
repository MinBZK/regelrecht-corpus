        artikel: 6a
  - number: 7a
    text: |-
      De opbouw en de financiering van de pensioenaanspraken vinden gedurende het deelnemerschap ten minste evenredig in
      de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel7a
  - number: '8'
    text: |-
      1 Degene, die aan een pensioenfonds heeft deelgenomen, verkrijgt, tenzij het bepaalde in het achtste lid toepassing
      vindt, bij het eindigen van zijn deelneming anders dan door overlijden of het bereiken van de pensioengerechtigde
      leeftijd een voor hem premievrije aanspraak op ouderdomspensioen en weduwen- of weduwnaarspensioen dan wel
      partnerpensioen, met inachtneming van het bepaalde in dit artikel.

      2 De gewezen deelnemer verkrijgt bij beëindiging van de deelneming ten minste een premievrije aanspraak op
      een evenredig ouderdomspensioen. Daaronder wordt verstaan het verschil tussen het ouderdomspensioen dat de
      gewezen deelnemer zou hebben gekregen als hij zou hebben deelgenomen tot de pensioengerechtigde leeftijd en
      het ouderdomspensioen dat hij zou hebben gekregen als hij zou hebben deelgenomen vanaf het tijdstip waarop zijn
      deelneming eindigde tot de pensioengerechtigde leeftijd. Bij de berekening bedoeld in de vorige volzin wordt,
      voor wat betreft de gegevens die voor de vaststelling van de pensioenaanspraken van belang zijn, uitgegaan van die
      gegevens, zoals deze gelden op het tijdstip waarop de deelneming is geëindigd.

      3 Indien een weduwen- of weduwnaarspensioen respectievelijk een partnerpensioen is toegezegd, verkrijgt de gewezen
      deelnemer bij beëindiging van de deelneming ten behoeve van zijn echtgenoot respectievelijk zijn partner een
      door het pensioenfonds naar redelijkheid vast te stellen premievrije aanspraak op weduwen- of weduwnaarspensioen
      respectievelijk partnerpensioen.

      4 Het pensioenfonds verstrekt de gewezen deelnemer bij beëindiging van de deelneming een opgave bevattende de
      hoogte van de premievrije aanspraken als bedoeld in het tweede en derde lid.

      5 Indien een instelling of persoon op ingegane ouderdomspensioenen van personen die tot de ingang van hun pensioen
      aan de regeling van het pensioenfonds hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft de gewezen
      deelnemer die aan dezelfde regeling van dat fonds heeft deelgenomen er jegens die instelling of persoon recht
      op dat hem op zijn ingegaan ouderdomspensioen overeenkomstige toeslagen worden verleend met inachtneming van
      dezelfde uitgangspunten. Op de overeenkomstige toeslagen kunnen in mindering worden gebracht toeslagen op zijn
      ingegaan ouderdomspensioen welke de gewezen deelnemer over hetzelfde tijdvak uit andere hoofde ontvangt. Een
      overeenkomstig recht op gelijke behandeling heeft zijn weduwe of weduwnaar voor wat betreft toeslagen op weduwen-
      of weduwnaarspensioen. De partner van een gewezen deelnemer na diens overlijden heeft eveneens een overeenkomstig
      recht op gelijke behandeling voor wat betreft toeslagen op zijn partnerpensioen.

      6 Indien een instelling of persoon op ingegane ouderdomspensioenen van personen die tot de ingang van hun pensioen
      aan de regeling van het pensioenfonds hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft de gewezen
      deelnemer die aan dezelfde regeling van dat fonds heeft deelgenomen er jegens die instelling of persoon recht
      op dat hem op zijn premievrije aanspraak op ouderdomspensioen overeenkomstige toeslagen worden verleend met
      inachtneming van dezelfde uitgangspunten. Op de overeenkomstige toeslagen kunnen in mindering worden gebracht
      toeslagen op zijn premievrije aanspraak op ouderdomspensioen welke de gewezen deelnemer over hetzelfde tijdvak
      uit andere hoofde ontvangt. Een overeenkomstig recht op gelijke behandeling heeft de gewezen deelnemer voor wat
      betreft toeslagen op zijn premievrije aanspraak op weduwen- of weduwnaarspensioen. De gewezen deelnemer heeft
      eveneens een overeenkomstig recht op gelijke behandeling voor wat betreft toeslagen op zijn premievrije aanspraak
      op partnerpensioen.

      7 Onze Minister kan aangeven wat voor de toepassing van het vijfde en zesde lid onder gewezen deelnemer en onder
      toeslagen wordt verstaan.

      8 De statuten en reglementen van een pensioenfonds kunnen bepalen dat degene die gedurende een tijdvak korter dan
      een jaar heeft deelgenomen aan een regeling inzake ouderdomspensioen van dat fonds, tenzij hij elders verworven
      pensioenaanspraken bij het fonds heeft ingebracht, bij beëindiging van de deelneming anders dan door overlijden of
      het bereiken van de pensioengerechtigde leeftijd een uitkering ontvangt die ten minste gelijk is aan de door hem
      voor ouderdomspensioen betaalde bijdragen.

      9 De statuten en reglementen van een pensioenfonds kunnen in plaats van het in het achtste lid bedoelde tijdstip,
      waarop de deelneming eindigt, een later tijdstip van uitkering noemen, doch niet later dan twee jaren na het
      eindigen van die deelneming, noch later dan het tijdstip waarop de pensioengerechtigde leeftijd wordt bereikt.

      10 Indien een pensioenregeling van een pensioenfonds kan worden beschouwd als alleen te worden bepaald door
      de door de werkgever of de deelnemer beschikbaar gestelde premies of bijdragen, is het tweede lid niet van
      toepassing en geldt dat de gewezen deelnemer bij beëindiging van de deelneming ten minste een premievrije
      aanspraak op ouderdomspensioen verkrijgt op de voet van de tot dan door hem en voor hem betaalde en uit hoofde
      van [artikel 2, zesde lid][ref1], nog verschuldigde bijdragen naarmate de voor pensioeningang vereiste duur van de
      deelneming is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel8
