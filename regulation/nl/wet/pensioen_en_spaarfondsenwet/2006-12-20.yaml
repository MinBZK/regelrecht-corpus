  - number: 23c
    text: |-
      1 Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete
      voor een afzonderlijke overtreding ten hoogste € 907 560 bedraagt.

      2 De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.

      3 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      4 De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien
      het bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog moet worden
      geacht.

      5 Voor overtreding van voorschriften, gesteld bij of krachtens een algemene maatregel van bestuur op
      grond van de [artikelen 2b, vijfde lid][ref1], [2c, tweede lid][ref2], [9d][ref3], [10, tweede lid][ref4],
      [10b, achtste lid][ref5], [32, negende lid][ref6] en [32b, derde lid][ref7], wordt het bedrag van de boete bepaald
      op de wijze als voorzien in de bijlage behorend bij die algemene maatregel van bestuur, met dien verstande dat de
      boete voor een afzonderlijke overtreding ten hoogste € 907 560 bedraagt. Ten aanzien van de regelen, bedoeld in
      [artikel 2, vierde lid, tweede volzin][ref8], is de eerste volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2b
