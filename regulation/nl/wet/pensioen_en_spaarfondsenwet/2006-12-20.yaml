  - number: 32ba
    text: |-
      1 Onverminderd het derde lid en de [artikelen 32a][ref1] en [32b][ref2] is een pensioenfonds uitsluitend bevoegd
      pensioen of aanspraken op pensioen af te kopen voor zover zijn statuten en reglementen dat mogelijk maken en
      indien:

      a. de rechthebbende daarmee instemt;

      b. die afkoop ertoe strekt het de rechthebbende mogelijk te maken om onder aanwending van de afkoopsom pensioen of
      aanspraken op pensioen overeenkomstig een toezegging omtrent pensioen van de werkgever die het af te kopen pensioen
      heeft toegezegd of op grond van een toezegging omtrent pensioen met dezelfde inhoud van een andere werkgever die
      de onderneming of een deel van de onderneming van de werkgever die het af te kopen pensioen heeft toegezegd, heeft
      overgenomen, te verwerven bij de instelling waar de werkgever de toezegging omtrent pensioen ter uitvoering heeft
      ondergebracht;

      c. met de pensioenbelangen van de echtgenoot of gewezen echtgenoot op redelijke wijze rekening is gehouden;

      d. de afkoopsom of zodanig wordt vastgesteld dat het te verwerven pensioen voor mannen en vrouwen gelijk is of,
      indien het pensioen wordt berekend of mede wordt berekend op grond van een geldelijke bijdrage, zodanig wordt
      vastgesteld dat de omvang van het te verwerven pensioen naar het inzicht op het tijdstip van vaststelling van die
      afkoopsom gelijk is;

      e. onverminderd de [artikelen 2b][ref3] en [2c][ref4], het in te kopen pensioen collectief actuarieel gelijkwaardig
      is aan het af te kopen pensioen;

      f. het pensioen of de aanspraken op pensioen worden verworven jegens een instelling:

      1°. waarop de Pensioen- & Verzekeringskamer toezicht houdt;

      2°. die bij ministeriële regeling is aangewezen;

      3°. die heeft voldaan aan de ingevolge de [artikel 37][ref5]
      of [38 van de Wet toezicht verzekeringsbedrijf 1993][ref6] vereiste procedure met betrekking tot een bijkantoor in
      Nederland, dan wel

      4°. die heeft voldaan aan de vereiste procedure, bedoeld in de
      [artikelen 111, eerste lid, onderdelen a tot en met c, of tweede lid][ref7],
      [113, eerste of vierde lid][ref8], [116, eerste lid, onderdelen a tot en met c, of derde lid][ref9],
      of [118, tweede of vijfde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref10] indien het de aldaar bedoelde
      dienstverrichting naar Nederland betreft; en

      g. het voornemen tot afkoop uiterlijk drie maanden voor de beoogde datum van afkoop schriftelijk wordt gemeld aan
      de Pensioen- & Verzekeringskamer in die gevallen waarin er sprake is van groepsgewijze afkoop en de Pensioen- &
      Verzekeringskamer binnen die periode niet van eventuele bezwaren heeft doen blijken.

      2 Indien de rechthebbende aan de onderneming verbonden is geweest of verbonden zou zijn geweest indien zijn
      deelneming niet was geëindigd, en deze onderneming is opgehouden te bestaan, kan ingeval van liquidatie van
      het pensioenfonds afkoop overeenkomstig het eerste lid plaatsvinden. Ingeval de afkoopsom wordt overgedragen
      aan een pensioenfonds zijn deze wet en de daarop berustende bepalingen van overeenkomstige toepassing.
      Indien de afkoopsom wordt overgedragen aan een verzekeraar als bedoeld in het eerste lid, onderdeel a, zijn
      [artikel 2, vierde lid][ref11] en de daarop berustende bepalingen van overeenkomstige toepassing.

      3 Een pensioenfonds is, voorzover zijn statuten en reglementen dat mogelijk maken, in afwijking van het eerste
      lid, onderdeel b, bevoegd aanspraken op pensioen af te kopen, indien die afkoop ertoe strekt het de rechthebbende
      mogelijk te maken om op de datum waarop het pensioen ingaat onder aanwending van de afkoopsom bij een andere
      instelling pensioen te verwerven, mits de afkoopsom rechtstreeks wordt overgedragen aan die instelling en wordt
      voldaan aan het eerste lid, onderdeel a, c, d, e en f . Ingeval deze andere instelling een pensioenfonds is, zijn
      deze wet en de daarop berustende bepalingen van overeenkomstige toepassing op dat pensioen. Indien deze andere
      instelling een verzekeraar is als bedoeld in het eerste lid, onderdeel c, zijn [artikel 2, vierde lid][ref12], en
      de daarop berustende bepalingen van overeenkomstige toepassing op dat pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32a
