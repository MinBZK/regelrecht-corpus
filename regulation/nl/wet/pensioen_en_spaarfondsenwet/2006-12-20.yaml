        artikel: '2'
  - number: 32e
    text: |-
      Deelnemers en andere rechthebbenden die zich na beëindiging van de deelneming aan een pensioenregeling naar een
      andere lidstaat begeven behouden hun aanspraak op pensioen in dezelfde mate als deelnemers en andere rechthebbenden
      die na beëindiging van de deelneming in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32e
  - number: 32f
    text: |-
      Het orgaan dat de pensioenregeling uitvoert, betaalt het pensioen op verzoek van de rechthebbende in een andere
      lidstaat dan de lidstaat waar dat orgaan is gevestigd, waarbij transactiekosten op het pensioen in mindering
      gebracht kunnen worden.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32f
  - number: 32g
    text: |-
      1 Een gedetacheerd werknemer kan tijdens de detachering blijven deelnemen aan de pensioenregeling.

      2 Indien tijdens detachering in Nederland de betaling van bijdragen in een andere lidstaat wordt voortgezet, worden
      de in Nederland gedetacheerde werknemer en diens werkgever vrijgesteld van de verplichting tot het betalen van
      bijdragen in Nederland.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32g
  - number: 32h
    text: |-
      1 Het orgaan dat de pensioenregeling uitvoert verstrekt deelnemers en gewezen deelnemers die zich naar een andere
      lidstaat begeven informatie over hun aanspraken op pensioenen en over de mogelijkheden die hun op grond van de
      pensioenregeling worden geboden.

      2 De informatie die op grond van het eerste lid wordt verstrekt is ten minste overeenkomstig de informatie die
      wordt verstrekt aan deelnemers en gewezen deelnemers die in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32h
  - number: 32i
    text: |-
      Het is een pensioenfonds verboden bijdragen te ontvangen van een bijdragende onderneming die zetel heeft in een
      andere lidstaat dan Nederland:

      a. zonder een daartoe door de Pensioen- & Verzekeringskamer verleende vergunning; en

      b. zonder de Pensioen- & Verzekeringskamer van het voornemen daartoe in kennis te hebben gesteld, op de wijze,
      bedoeld in [artikel 32l][ref1], en met inachtneming van [artikel 32o][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32l
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32o
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32i
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32l
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 32o
  - number: 32j
    text: |-
      De vergunning, bedoeld in [artikel 32i, onderdeel a][ref1], wordt op aanvraag door de Pensioen- & Verzekeringskamer
      verleend wanneer het fonds:

      a. is ingeschreven in het register, bedoeld in [artikel 20, tweede lid][ref2]; en

      b. voldoet aan de [artikelen 3a][ref3], [5, tweede lid][ref4], [9a, tweede lid][ref5], en [17b][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32i
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0002089#Artikel9a
      [ref6]: https://wetten.overheid.nl/BWBR0002089#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel32j
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32i
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '20'
