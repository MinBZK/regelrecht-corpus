        bwb_id: BWBR0002089
        artikel: 10b
  - number: '17'
    text: |-
      1 Het bestuur van een pensioen- of spaarfonds zorgt dat de deelnemers bij toetreding schriftelijk op de hoogte
      gesteld worden van de inhoud van de geldende statuten en reglementen van het fonds. Jaarlijks worden de deelnemers
      schriftelijk van de wijzigingen daarin door het bestuur op de hoogte gesteld.

      2 Jaarlijks verstrekt het bestuur van een pensioenfonds ten behoeve van de deelnemer een opgave van
      de hoogte van het te bereiken reglementaire pensioen en een opgave van de aan het desbetreffende
      of voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen. Het eerste jaar
      waarover de opgave van de waardeaangroei van de pensioenaanspraken als bedoeld in de eerste volzin wordt verstrekt
      is 2001.

      3 Het bestuur van een ondernemingspensioenfonds of spaarfonds zorgt dat de deelnemers in het bezit gesteld worden
      van een afschrift van de mededeling die de werkgever overeenkomstig [artikel 2, zevende lid, eerste volzin][ref2],
      of [artikel 3, vierde lid, eerste volzin][ref3], aan het fonds heeft gedaan.

      4 Het bestuur van een pensioen- of spaarfonds stelt de belanghebbenden in staat desgewenst van de geldende statuten
      en reglementen kennis te nemen.

      5 Het bestuur van het pensioenfonds verstrekt op verzoek van de deelnemer een opgave van de over
      de jaren 1994 tot en met 2000 toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref4] en de daarop berustende bepalingen.

      6 Het bestuur van een pensioenfonds, spaarfonds of verzekeraar verstrekt eenmalig aan de deelnemers, en aan de
      gewezen deelnemers eenmalig op verzoek, een opgave van de premievrije waarde op 1 januari 2006 van de aanspraken,
      opgebouwd ten behoeve van een pensioenuitkering in de periode voorafgaand aan de datum waarop de deelnemer of
      gewezen deelnemer de leeftijd van 65 jaar bereikt.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het bepaalde in het zesde lid,
      de wijze waarop de premievrije waarde wordt berekend en het tijdvak waarbinnen de eenmalige opgave wordt verstrekt.

      8 Het bestuur van een pensioenfonds, spaarfonds, beroepspensioenfonds of verzekeraar administreert de
      deelnemingsjaren van de deelnemers. Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de
      perioden die in aanmerking komen als deelnemingsjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
