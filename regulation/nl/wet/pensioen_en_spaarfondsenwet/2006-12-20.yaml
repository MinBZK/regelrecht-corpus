  - number: 9aa
    text: |-
      1 Een pensioenfonds kan, indien het fonds geen bijdragen ontvangt van een bijdragende onderneming die zetel heeft
      in een andere lidstaat dan Nederland, in afwijking van [artikel 9a, tweede lid][ref1], gedurende een korte periode
      over onvoldoende activa beschikken, mits het fonds beschikt over een daartoe opgesteld en door de Pensioen- &
      Verzekeringskamer goedgekeurd herstelplan.

      2 Wanneer een pensioenfonds niet meer over voldoende activa beschikt, dient het een concreet en haalbaar
      herstelplan in om tijdig de activa, die noodzakelijk zijn om de technische voorzieningen volledig te dekken, te
      herstellen. Het herstelplan houdt rekening met de gehele, specifieke situatie van het fonds.

      3 Wanneer een pensioenregeling tijdens de periode, bedoeld in het eerste en tweede lid, wordt beëindigd, stelt het
      pensioenfonds de Pensioen- & Verzekeringskamer hiervan op de hoogte en stelt het fonds een procedure vast om de
      op de beëindigde pensioenregeling betrekking hebbende activa en passiva aan een ander pensioenfonds, verzekeraar
      of pensioeninstelling uit een andere lidstaat over te dragen, welke procedure ter kennis van de Pensioen- &
      Verzekeringskamer wordt gebracht.

      4 Het pensioenfonds stelt, wanneer het derde lid van toepassing is, een algemeen overzicht van de procedure,
      bedoeld in het derde lid, beschikbaar voor de deelnemers, gewezen deelnemers, hun pensioengerechtigde
      nagelaten betrekkingen of de vertegenwoordigers van de genoemde personen in overeenstemming met het
      vertrouwelijkheidsbeginsel.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel9a
