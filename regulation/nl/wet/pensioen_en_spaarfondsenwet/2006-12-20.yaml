        artikel: '2'
  - number: 8a
    text: |-
      1 Indien het huwelijk van een deelnemer eindigt door echtscheiding of ontbinding na scheiding van tafel en bed,
      verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de
      deelnemer ten behoeve van die gewezen echtgenoot zou hebben verkregen, indien op het tijdstip van de echtscheiding
      of van de ontbinding van het huwelijk zijn deelneming zou zijn geëindigd anders dan door overlijden of het bereiken
      van de pensioengerechtigde leeftijd.

      2 Indien het huwelijk van een gewezen deelnemer eindigt door echtscheiding of ontbinding na scheiding van tafel en
      bed, verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de
      gewezen deelnemer ten behoeve van die gewezen echtgenoot heeft verkregen bij het eindigen van zijn deelneming.

      3 Het bepaalde in het eerste en tweede lid vindt geen toepassing, indien de man en de vrouw bij huwelijkse
      voorwaarden of bij een bij geschrift gesloten overeenkomst met het oog op de scheiding anders overeenkomen. De
      overeenkomst is slechts geldig indien aan de overeenkomst een verklaring van het fonds is gehecht, dat het bereid
      is een uit de afwijking voortvloeiend pensioenrisico te dekken.

      4 Het fonds verstrekt aan de gewezen echtgenoot van de deelnemer of gewezen deelnemer een bewijs van diens
      aanspraak.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel8a
  - number: 8b
    text: |-
      1 Degene, die aan een spaarfonds heeft deelgenomen, ontvangt, tenzij het bepaalde in het tweede lid toepassing
      vindt, bij het eindigen van zijn deelneming of op een in de statuten of reglementen van het fonds aangegeven later
      tijdstip een uitkering op de voet van de door en voor hem betaalde en uit hoofde van [artikel 3, derde lid][ref1],
      nog verschuldigde bijdragen.

      2 De statuten en reglementen van een spaarfonds kunnen bepalen dat degene, die korter dan een jaar aan het fonds
      heeft deelgenomen, bij het eindigen van zijn deelneming een uitkering ontvangt ten minste gelijk aan de door hem
      betaalde bijdragen.

      3 De statuten en reglementen van een spaarfonds kunnen in plaats van het in het tweede lid bedoelde tijdstip,
      waarop de deelneming eindigt, een later tijdstip van uitkering noemen, doch niet later dan twee jaren na het
      eindigen van de deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel3
