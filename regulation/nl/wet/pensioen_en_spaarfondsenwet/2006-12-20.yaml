  - number: 3b
    text: |-
      Door de overgang van een onderneming, bedoeld in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], waarbij
      ten aanzien van de aan die onderneming verbonden werknemers geen toezegging omtrent pensioen is gedaan en geen
      spaarregeling geldt, wordt:

      a. indien de verkrijger ten aanzien van de aan zijn onderneming verbonden werknemers voor het tijdstip van de
      overgang reeds een toezegging heeft gedaan, hij geacht deze tevens te hebben gedaan ten aanzien van de in de aanhef
      genoemde werknemers; dan wel

      b. indien ten aanzien van de aan de verkrijgende onderneming verbonden werknemers voor het tijdstip van de overgang
      reeds een spaarregeling van toepassing was, deze regeling tevens van toepassing op de in de aanhef genoemde
      werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel3b
