  - number: '33'
    text: |-
      Van burgerlijke rechtsvorderingen ter zake van deelneming in en uitkering uit een fonds, waarop deze wet van
      toepassing is, neemt de kantonrechter kennis.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel33
  - number: 33a
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel87
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:7
  - number: '34'
    text: |-
      Inlichtingen uit de basisadministratie persoonsgegevens en inlichtingen en uittreksels uit de registers van de
      burgerlijke stand, welke met het oog op deelneming in of uitkering uit een fonds, waarop deze wet van toepassing
      is, ten behoeve van deelnemers en gewezen deelnemers van een zodanig fonds worden gevraagd, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel34
  - number: '35'
    text: |-
      Pensioenfondsen brengen hun statuten en reglementen binnen twee jaar na inwerkingtreding van de Verzamelwet sociale
      verzekeringen 2003 in overeenstemming met de artikelen 2c, 6a, 6b en 6c, eerste en tiende lid, van de Pensioen-
      en spaarfondsenwet.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel35
  - number: '36'
    text: |-
      1 De [artikelen 929][ref1], [935, eerste lid][ref2], [936, tweede tot en met zesde lid][ref3],
      [941 vijfde lid][ref4], [969][ref5], [972][ref6],[ 977, tweede lid][ref7],[ 978][ref8], [979][ref9], [980][ref10]
      en [983 van Boek 7 van het Burgerlijk Wetboek][ref11] zijn niet van toepassing op verzekeringsovereenkomsten
      die worden gesloten in verband met een toezegging omtrent pensioen als bedoeld in deze wet, alsmede op
      verzekeringsovereenkomsten die worden gesloten in verband met een pensioenvoorziening, een deelneming in een
      pensioenfonds of pensioenregeling of een regeling die op grond van deze wet gelijkgesteld is met een toezegging
      omtrent pensioen.

      2 Het verminderen of vervallen van een uitkering op grond van een verzekeringsovereenkomst als bedoeld in het
      eerste lid op basis van [artikel 930, derde tot en met vijfde lid, van Boek 7 van het Burgerlijk Wetboek ][ref12]is
      niet mogelijk, tenzij door een persoon aan wie een toezegging omtrent pensioen is gedaan of door een persoon voor
      wie een pensioenvoorziening, deelneming of regeling geldt die op grond van deze wet daarmee gelijkgesteld is,
      niet is voldaan aan de in [artikel 928 van Boek 7 van het Burgerlijk Wetboek][ref13] omschreven mededelingsplicht
      betreffende zijn risico. In dat geval beperkt de vermindering of het verval van de uitkering zich tot het risico
      met betrekking tot de in de eerste zin bedoelde persoon. Voorzover de eerste zin in de weg staat aan vermindering
      dan wel verval van een uitkering, heeft het pensioenfonds of de verzekeraar een recht van verhaal op de werkgever.

      3 Een beding als bedoeld in [artikel 941, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref14] is nietig
      wanneer dit is opgenomen in een verzekeringsovereenkomst als bedoeld in het eerste lid.

      4 Voor zover bepalingen van de [titels 17][ref15] en [18 van Boek 7 van het Burgerlijk Wetboek][ref16] in
      strijd zijn met het bij of krachtens deze wet bepaalde, blijven die bepalingen van de [titels 17][ref17] en
      [18 van Boek 7 van het Burgerlijk Wetboek][ref18] buiten toepassing.


