      2 De [artikelen 5:32, tweede tot en met vijfde lid][ref33], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref34] zijn van toepassing.

      3 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.


