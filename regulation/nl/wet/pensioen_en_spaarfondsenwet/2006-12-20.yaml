  - number: 5a
    text: |-
      1 Een pensioenfonds en een spaarfonds beschikken over een gedragscode die voor bestuurders en medewerkers van het
      fonds voorschriften geeft ter voorkoming van belangenconflicten en van misbruik en oneigenlijk gebruik van de bij
      het fonds aanwezige informatie of zaken.

      2 De Pensioen- & Verzekeringskamer kan regels stellen met betrekking tot de inhoud van deze gedragscode.

      3 De Pensioen- & Verzekeringskamer kan gegevens of inlichtingen verkregen bij de vervulling van de haar ingevolge
      deze wet opgedragen taak verstrekken aan de autoriteiten die ingevolge de [Wet toezicht effectenverkeer 1995][ref1]
      zijn belast met het toezicht op het effectenverkeer, tenzij:

        - het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
        - het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
        - de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
        - de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen
      die deze wet beoogt te beschermen; of
        - onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007657
  - number: '6'
    text: |-
      1 In het bestuur van een bedrijfstakpensioenfonds moeten de vertegenwoordigers van werkgevers- en
      werknemersvakverenigingen in de betrokken bedrijfstak in gelijken getale zitting hebben.

      2 In het bestuur van een ondernemingspensioenfonds of van een spaarfonds moeten de vertegenwoordigers van de in het
      fonds deelnemende werknemers ten minste evenveel zetels bezetten als de vertegenwoordigers van de werkgever.

      3 Indien de statuten of reglementen van een fonds voorzien in stemgerechtigde vertegenwoordigers in het bestuur
      van anderen dan werknemers- of werkgeversvakverenigingen binnen de betrokken bedrijfstak onderscheidenlijk in
      het fonds deelnemende werknemers of de werkgever, worden die vertegenwoordigers voor de toepassing van het eerste
      onderscheidenlijk tweede lid gelijkgesteld met vertegenwoordigers van werknemersvakverenigingen onderscheidenlijk
      vertegenwoordigers van de in het fonds deelnemende werknemers.

      4 Ieder der bestuurders van een pensioenfonds of van een spaarfonds is bevoegd een deskundige te raadplegen,
      alsmede zich krachtens een bestuursbesluit, waarbij ten minste één vierde der bestuurders zich daarvoor heeft
      uitgesproken, ter vergadering door een deskundige te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel6
  - number: 6a
    text: |-
      1 Het bestuur van een bedrijfstakpensioenfonds is verplicht over te gaan tot het instellen van een deelnemersraad
      indien dit wordt verzocht door één of meer verenigingen die samen binnen het fonds tenminste een ledental
      hebben van 5% van het totale aantal van de in het fonds deelnemende werknemers en de gewezen deelnemers en hun
      pensioengerechtigde nagelaten betrekkingen. In de deelnemersraad zijn de in het fonds deelnemende werknemers en
      de gepensioneerden evenredig op basis van onderlinge getalsverhoudingen vertegenwoordigd. Op grond van door het
      bestuur van het fonds vast te stellen criteria kunnen daarnaast ook één of meer vertegenwoordigers van gewezen
      deelnemers met premievrije aanspraken op ouderdomspensioen in de deelnemersraad zitting hebben. In geval van
      verkiezing van de leden van de deelnemersraad door de belanghebbenden bij een fonds, kunnen slechts kandidaten
      worden voorgedragen door verenigingen, die elk afzonderlijk ten minste 1% van het aantal belanghebbenden, dan wel,
      indien dat aantal meer is dan 25 000, ten minste 250 belanghebbenden tot lid hebben; voor zover geen verkiezing
      door de belanghebbenden plaatsvindt, moeten verenigingen, die voldoen aan deze criteria, evenredig aan hun
      ledentallen binnen het fonds zijn vertegenwoordigd in de deelnemersraad; een en ander onverminderd de tweede zin.
      Het in de vierde zin bedoelde percentage en minimumaantal worden in de statuten en reglementen van een fonds niet
      hoger vastgesteld.

      2 Het bestuur van een ondernemingspensioenfonds is verplicht over te gaan tot het instellen van een deelnemersraad
      indien dit wordt verzocht door tenminste 5% van de personen die behoren tot de in het fonds deelnemende werknemers
      en de gewezen deelnemers en hun pensioengerechtigde nagelaten betrekkingen. In de deelnemersraad moeten de in
      het fonds deelnemende werknemers en de gepensioneerden evenredig op basis van onderlinge getalsverhoudingen
      zijn vertegenwoordigd. Op grond van door het bestuur van het fonds vast te stellen criteria kunnen daarnaast
      ook één of meer vertegenwoordigers van gewezen deelnemers met premievrije aanspraken op ouderdomspensioen in de
      deelnemersraad zitting hebben. In geval van verkiezing van de leden van de deelnemersraad door de belanghebbenden
      bij een fonds, kunnen kandidaten worden voorgedragen door verenigingen en door individuele belanghebbenden; in
      geval geen verkiezing door de belanghebbenden plaatsvindt, maar de leden worden benoemd door verenigingen, moeten
      deze verenigingen evenredig aan hun ledentallen binnen hun geleding binnen het fonds zijn vertegenwoordigd in de
      deelnemersraad, onverminderd de tweede zin.

      3 De [artikelen 6b][ref1], [6c][ref2], [6d][ref3] en [6e][ref4] zijn van overeenkomstige toepassing op een
      deelnemersraad, die krachtens de statuten en reglementen van een fonds is ingesteld anders dan met toepassing van
      het eerste en tweede lid, mits

      a. is voldaan aan de tweede zin van het eerste onderscheidenlijk tweede lid; en

      b. in geval van een bedrijfstakpensioenfonds tevens is voldaan aan de vierde en vijfde zin van het eerste lid en
      aan het vierde lid.

      4 Een vereniging als bedoeld in het eerste en tweede lid moet volledige rechtsbevoegdheid bezitten; haar statutair
      doel moet mede omvatten het behartigen van de belangen van haar leden als belanghebbenden bij een fonds.

      5 Onze Minister kan verenigingen aanwijzen op wie het eerste lid, vierde volzin, en het vierde lid, voor een bij
      die aanwijzing te bepalen periode niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel6b
