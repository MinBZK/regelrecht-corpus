  - number: '4'
    text: |-
      1 Als pensioen- of spaarfonds mogen slechts werkzaam zijn rechtspersonen met volledige rechtsbevoegdheid.

      2 Het bestuur van een pensioen- of spaarfonds is verplicht binnen drie maanden na oprichting van het fonds dit te
      melden bij de Pensioen- & Verzekeringskamer door middel van een door die kamer vast te stellen formulier.

      3

      4 Binnen de in het tweede lid genoemde termijn zendt het bestuur van een pensioen- of spaarfonds een afschrift
      van de akte van oprichting, een door het bestuur gewaarmerkt exemplaar van de reglementen, alsmede een door het
      bestuur gewaarmerkt afschrift van de overeenkomst, waarin de regeling omtrent de betaling van de bijdragen, als
      bedoeld in [artikel 3a, eerste lid, eerste volzin][ref1], is opgenomen, aan de Pensioen- & Verzekeringskamer . Het
      bestuur van het fonds, met uitzondering van een bedrijfstakpensioenfonds ten aanzien waarvan met toepassing van de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref2] een verplichting tot deelneming geldt dan
      wel een aanvraag tot een dergelijke verplichting in behandeling is, zendt een authentiek afschrift van de akte,
      houdende wijziging van de statuten, een door het bestuur gewaarmerkt exemplaar van wijzigingen van de reglementen,
      en een door het bestuur gewaarmerkt afschrift van de wijzigingen van de hiervoor bedoelde overeenkomst binnen drie
      maanden na de totstandkoming van die wijzigingen aan de Pensioen- & Verzekeringskamer.

      5 De statuten en reglementen van een pensioen- of spaarfonds moeten bepalingen inhouden, beantwoordende aan de
      voorschriften van de [artikelen 5][ref3], [6][ref4], [6a][ref5], [6b][ref6], [6c, eerste en tiende lid][ref7],
      [7a][ref8] tot en met [10b][ref9], [17][ref10], [17a][ref11] en [32b][ref12] en indien van toepassing aan de
      voorschriften van de [artikelen 2b][ref13], [2c][ref14] en [32ba][ref15], een en ander onverminderd het bepaalde
      in [artikel 7][ref16].

      6 Een pensioenfonds verricht slechts activiteiten in verband met pensioenuitkeringen en werkzaamheden die daarmee
      verband houden.


