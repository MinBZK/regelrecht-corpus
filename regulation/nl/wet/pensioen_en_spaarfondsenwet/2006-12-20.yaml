        artikel: 6a
  - number: 23a
    text: |-
      1 De Pensioen- & Verzekeringskamer kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen 2, eerste en vierde lid][ref1], [2b, eerste, derde, en vijfde lid][ref2],
      [2c][ref3], [3, eerste lid][ref4], [4, eerste, tweede, vierde en zesde lid][ref5],
      [5, eerste tot en met zevende lid][ref6], [5a, eerste lid][ref7], [6a][ref8], [6b, tweede en vierde lid][ref9],
      [6d, derde lid][ref10], [7][ref11], [7a][ref12], [8, vijfde en zesde lid][ref13], [9][ref14], [9a][ref15],
      [9aa][ref16], [9b][ref17], [9ba][ref18], [9c][ref19], [10, derde lid][ref20], [10a][ref21], [10b][ref22],
