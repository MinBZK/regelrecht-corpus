    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      [artikelen 9a][ref1], [9aa][ref2], [9b][ref3] en [9c][ref4]. Daarbij kan worden bepaald dat in geval van overdracht
      of herverzekering als bedoeld in [artikel 9][ref5], [artikel 9c][ref6] en die regels, met uitzondering van
      [artikel 9c, derde lid][ref7], niet van toepassing zijn dan wel anderszins daarvan mag worden afgeweken.


