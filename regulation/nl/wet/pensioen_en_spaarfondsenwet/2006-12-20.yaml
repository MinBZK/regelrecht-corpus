  - number: 6b
    text: |-
      1 De deelnemersraad adviseert het fonds desgevraagd of uit eigen beweging over aangelegenheden die het fonds
      betreffen. De deelnemersraad wordt in ieder geval in de gelegenheid gesteld advies uit te brengen over elk door een
      daartoe bevoegd orgaan van het fonds voorgenomen besluit tot:

      a. het nemen van maatregelen van algemene strekking;

      b. wijziging van de statuten en reglementen van het fonds;

      c. vaststelling van het jaarverslag, de begroting en de bescheiden bedoeld in de [artikelen 9c][ref1] en
      [10b][ref2] voorzover voor het fonds van toepassing;

      d. wijziging van de hoogte van ingegane pensioenen indien toepassing wordt gegeven aan het gestelde in
      [artikel 7, eerste lid, onderdeel ][ref3];

      e. het verlenen van toeslagen hoe ook genaamd of het aanbrengen van wijziging daarin voorzover die besluiten niet
      reeds onder onderdeel *b* vallen of verband houden met een toezegging neergelegd in een statutaire of reglementaire
      bepaling van het fonds;

      f. gehele of gedeeltelijke overdracht van de verplichtingen van het fonds;

      g. liquidatie van het fonds.

      2 Het advies van de deelnemersraad moet op een zodanig tijdstip worden gevraagd dat het van wezenlijke invloed
      kan zijn op de in het eerste lid bedoelde besluiten. Bij het vragen van advies wordt aan de deelnemersraad
      een overzicht verstrekt van de beweegredenen voor het besluit, alsmede van de gevolgen die het besluit naar te
      verwachten valt voor de belanghebbenden bij het fonds zal hebben.

      3 Het bestuur van het fonds en de deelnemersraad komen tenminste tweemaal per kalenderjaar in vergadering bijeen.
      Tijdens deze vergaderingen worden de aangelegenheden aan de orde gesteld waarover het bestuur of de deelnemersraad
      overleg wenselijk acht.

      4 Het bestuur van het fonds is verplicht desgevraagd aan de deelnemersraad tijdig alle inlichtingen en gegevens
      te verstrekken, die deze voor de vervulling van zijn taak redelijkerwijze nodig heeft. De inlichtingen worden
      desgevraagd schriftelijk verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel9c
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel7
