  - number: 6c
    text: |-
      1 Het bevoegde orgaan van het fonds deelt de deelnemersraad zo spoedig mogelijk schriftelijk mee, of het een advies
      inzake de in [artikel 6b, eerste lid][ref1], bedoelde aangelegenheden niet of niet geheel volgt, waarbij tevens
      wordt meegedeeld waarom van het advies of van een daarin vervat minderheidsadvies wordt afgeweken.

      2 De deelnemersraad kan bij de ondernemingskamer van het gerechtshof te Amsterdam beroep instellen tegen een
      besluit betreffende een aangelegenheid als bedoeld in [artikel 6b, eerste lid, eerste zin][ref2], of een besluit
      als bedoeld in de tweede zin van dat artikellid, hetzij wanneer de deelnemersraad met betrekking tot het besluit,
      in strijd met [artikel 6b, eerste lid, tweede zin][ref3], niet voorafgaand in de gelegenheid is gesteld advies
      uit te brengen, hetzij wanneer dat besluit niet in overeenstemming is met het advies van de deelnemersraad, hetzij
      wanneer feiten en omstandigheden bekend zijn geworden die, waren zij aan de deelnemersraad bekend geweest ten tijde
      van het uitbrengen van zijn advies, aanleiding zouden kunnen zijn geweest om dat advies niet uit te brengen zoals
      het is uitgebracht.

      3 Het beroep wordt ingediend bij verzoekschrift, binnen acht weken nadat de deelnemersraad van het besluit in
      kennis is gesteld. Het bevoegde orgaan van het fonds wordt van het ingestelde beroep in kennis gesteld. Het verzoek
      is niet-ontvankelijk, indien met betrekking tot dezelfde aangelegenheid een aanwijzing is gegeven door de Pensioen-
      & Verzekeringskamer.

      4 Het beroep kan uitsluitend worden ingesteld terzake dat het bevoegde orgaan van het fonds bij afweging van de
      betrokken belangen niet in redelijkheid tot zijn besluit had kunnen komen.

      5 De ondernemingskamer behandelt het verzoek met de meeste spoed. Alvorens te beslissen kan zij, ook ambtshalve,
      deskundigen, alsmede bij het fonds werkzame personen horen. Indien de ondernemingskamer het beroep gegrond bevindt,
      kan zij, indien de deelnemersraad daarom heeft verzocht, een of meer van de volgende voorzieningen treffen:

      a. het opleggen van de verplichting aan het bevoegde orgaan van het fonds om het besluit geheel of ten dele in te
      trekken, alsmede om aan te wijzen gevolgen van dat besluit ongedaan te maken;

      b. het opleggen van een verbod aan het bevoegde orgaan van het fonds om handelingen te verrichten of te doen
      verrichten ter uitvoering van het besluit of onderdelen daarvan.

      6 Het bevoegde orgaan moet aan de getroffen voorziening voldoen; een voorziening kan door derden verworven rechten
      echter niet aantasten.

      7 De ondernemingskamer kan haar beslissing op een verzoek tot het treffen van voorzieningen voor een door haar
      te bepalen termijn aanhouden, indien beide partijen daar om verzoeken, dan wel indien het bevoegde orgaan van het
      fonds op zich neemt het besluit waartegen beroep is ingesteld, in te trekken of te wijzigen, of bepaalde gevolgen
      van het besluit ongedaan te maken.

      8 Nadat het verzoekschrift is ingediend kan de ondernemingskamer, zo nodig onverwijld, voorlopige voorzieningen
      treffen. De derde zin van het vijfde lid en het zesde lid zijn van overeenkomstige toepassing.

      9 Van een beschikking van de ondernemingskamer staat uitsluitend beroep in cassatie open.

      10 De kosten van het voeren van rechtsgedingen door de deelnemersraad komen ten laste van het fonds, indien zij
      redelijkerwijs noodzakelijk zijn voor de vervulling van de taak van de deelnemersraad en het fonds van de te maken
      kosten vooraf in kennis is gesteld. In rechtsgedingen tussen het fonds en de deelnemersraad kan de deelnemersraad
      niet in de proceskosten worden veroordeeld.


