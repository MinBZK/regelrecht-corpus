  - number: 9a
    text: |-
      1 De aanspraak, bedoeld in [artikel 8, tweede lid][ref1], dient voor de deelnemer in elk geval steeds aan het
      einde van ieder kalenderjaar dan wel, indien dat eerder is, bij beëindiging van de deelneming, volledig te zijn
      gefinancierd. De Pensioen- & Verzekeringskamer kan op grond van bijzondere omstandigheden een langere termijn, van
      ten hoogste dertien weken, toestaan voor financiering als bedoeld in dit lid.

      2 Een pensioenfonds stelt toereikende technische voorzieningen vast met betrekking tot het geheel van uit de
      statuten en reglementen voortvloeiende pensioenverplichtingen en beschikt te allen tijde over voldoende en
      passende activa om deze technische voorzieningen te dekken. De technische voorzieningen worden elk jaar berekend.
      De berekening wordt uitgevoerd en gewaarmerkt door een actuaris op grond van met het bij of krachtens deze wet
      bepaalde overeenstemmende actuariële methoden en met inachtneming van de volgende beginselen:

      a. het minimumbedrag van de technische voorzieningen wordt berekend aan de hand van een voldoende prudente
      actuariële waardering, rekening houdend met alle verplichtingen inzake uitkeringen en inzake bijdragen,
      overeenkomstig de door het fonds uitgevoerde pensioenregeling. Het minimumbedrag moet voldoende zijn om te
      waarborgen dat de uitbetaling van reeds verschuldigde pensioenen aan de pensioengerechtigden, kan worden
      voortgezet, en om de verplichtingen te weerspiegelen die voortvloeien uit de opgebouwde pensioenrechten van de
      deelnemers. De economische en actuariële hypothesen die voor de waardering van de passiva worden gehanteerd, worden
      eveneens op prudente wijze bepaald, waarbij een redelijke marge voor negatieve afwijkingen in acht wordt genomen,
      indien van toepassing;

      b. de toegepaste maximale rentepercentages worden op prudente wijze bepaald. Bij de bepaling van deze prudente
      rentepercentages wordt rekening gehouden met:

      1°. het rendement van de overeenkomstige activa die door het pensioenfonds worden beheerd en met de toekomstige
      beleggingsopbrengsten, of

      2°. marktrendementen van kwalitatief hoogwaardige of staatsobligaties;

      c. de voor de berekening van de technische voorzieningen gebruikte tabellen inzake overlijden of
      arbeidsongeschiktheid en levensverwachting worden gebaseerd op prudente beginselen, rekening houdend met de
      hoofdkenmerken van de deelnemersgroep en de pensioenregelingen, in het bijzonder de verwachte veranderingen in de
      relevante risico's;

      d. de methode en de grondslag van de berekening van de technische voorzieningen blijven van boekjaar tot boekjaar
      ongewijzigd, tenzij wijzigingen daarin gerechtvaardigd zijn als gevolg van een verandering van de juridische,
      demografische of economische omstandigheden die aan de hypothesen ten grondslag liggen.

      3 Een pensioenfonds dat niet volledig het risico, bedoeld in [artikel 9, eerste lid][ref2], heeft overgedragen of
      herverzekerd houdt, naast de technische voorzieningen, permanent bij wijze van buffer een eigen vermogen aan dat:

      a. in overeenstemming is met het soort risico en de aard van het eigen vermogen met betrekking tot het geheel van
      de uit de statuten en reglementen voortvloeiende pensioenverplichtingen;

      b. vrij is van alle voorzienbare verplichtingen; en

      c. dient als veiligheidskapitaal om verschillen op te vangen tussen de verwachte en daadwerkelijke uitgaven en
      winsten.

      4 Bij algemene maatregel van bestuur worden regels gesteld over de berekening van het minimumbedrag van het eigen
      vermogen, bedoeld in het derde lid, overeenkomstig de artikelen 27 en 28 van [richtlijn nr. 2002/83/EG](32002L0083)
      van het Europees Parlement en de Raad van de Europese Unie van 5 november 2002 betreffende levensverzekering (PbEG
      L 345/24).


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel9
