  - number: 32b
    text: |-
      1 Een pensioenfonds is verplicht, tenzij naar het oordeel van de Pensioen- & Verzekeringskamer de financiële
      toestand van het fonds dat niet toelaat, in geval van individuele beëindiging van de deelneming anders dan door
      overlijden of het bereiken van de pensioengerechtigde leeftijd op verzoek van een gewezen deelnemer aanspraken op
      pensioen af te kopen, indien:

      a. die afkoop ertoe strekt het de rechthebbende mogelijk te maken om onder aanwending van de afkoopsom aanspraken
      op pensioen te verwerven bij de instelling waar de nieuwe onderneming waaraan hij verbonden is de toezegging
      omtrent pensioen ter uitvoering heeft ondergebracht,

      b. de afkoopsom rechtstreeks wordt overgedragen aan die instelling en

      c. de aanspraken op pensioen worden verworven jegens een instelling:

      1°. waarop de Pensioen- & Verzekeringskamer toezicht houdt;

      2°. die bij ministeriële regeling is aangewezen;

      3°. die heeft voldaan aan de ingevolge de [artikel 37][ref1] of
      [38 van de Wet toezicht verzekeringsbedrijf 1993][ref2] vereiste procedure met betrekking tot een bijkantoor in
      Nederland, dan wel

      4°. die heeft voldaan aan de vereiste procedure als bedoeld in de
      [artikelen 111, eerste lid, onderdelen a tot en met c, of tweede lid][ref3],
      [113, eerste of vierde lid][ref4], [116, eerste lid, onderdelen a tot en met c, of derde lid][ref5], of
      [118, tweede of vijfde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref6] indien het de aldaar bedoelde
      dienstverrichting naar Nederland betreft.

      2 Een pensioenfonds is verplicht op verzoek van een deelnemer de afkoopsom op grond van [het eerste
      lid, artikel 16a van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet](onbekend) en
      [artikel 41 van de Wet verplichte beroepspensioenregeling][ref7] aan te wenden ter verwerving van aanspraken op
      pensioen voor die deelnemer.

      3 Met betrekking tot het eerste en tweede lid worden bij of krachtens algemene maatregel van bestuur regels gesteld
      ten aanzien van de berekening van de waarde van de af te kopen aanspraken op pensioen en de met de afkoopsom
      in te kopen aanspraken op pensioen alsmede de in acht te nemen procedure. Deze regels kunnen met betrekking tot
      aanspraken op nabestaandenpensioen het recht op afkoop van de gewezen deelnemer beperken. De Stichting van de
      Arbeid verstrekt Onze Minister desgevraagd de ter zake benodigde inlichtingen.

      4 Een pensioenfonds is verplicht op verzoek van een gewezen deelnemer bij diens aanstelling in vaste dienst van
      een van de Europese Gemeenschappen een premievrije aanspraak op ouderdomspensioen, bedoeld in [artikel 8][ref8],
      af te kopen en de afkoopsom over te dragen aan de betrokken Gemeenschap. Bij de berekening van de afkoopsom zijn
      de rekenregels van het derde lid van toepassing. Een pensioenfonds is bevoegd op verzoek van de gewezen deelnemer
      en diens echtgenoot of partner een premievrije aanspraak op weduwen-, weduwnaars- of partnerpensioen in de in de
      eerste zin bedoelde afkoop en overdracht te betrekken.

      5 In afwijking van het eerste lid, onderdeel a, is het pensioenfonds bevoegd pensioen of aanspraken op pensioen
      af te kopen indien die afkoop ertoe strekt het de rechthebbende mogelijk te maken om onder aanwending van de
      afkoopsom pensioen of aanspraken op pensioen te verwerven overeenkomstig een beroepspensioenregeling ten aanzien
      waarvan [artikel 3 van de Wet verplichte beroepspensioenregeling][ref9] toepassing heeft gevonden. Het eerste lid,
      onderdeel b is van overeenkomstige toepassing. Het eerste lid, onderdeel c is van toepassing.


