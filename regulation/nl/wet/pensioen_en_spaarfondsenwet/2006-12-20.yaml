  - number: 9b
    text: |-
      1 Belegging van de daartoe beschikbare gelden van een spaarfonds moet op solide wijze geschieden.

      2 Vorderingen van een spaarfonds op de werkgever, alsmede belegging in aandelen in diens onderneming zijn
      toegelaten tot een bedrag gelijk aan het twintigste deel van de bezittingen van het fonds, vermeerderd met een
      bedrag gelijk aan de vrije reserve van dat fonds. Het bedrag van deze vorderingen en aandelen mag evenwel het
      tiende deel van de bezittingen van het fonds niet overschrijden.

      3 Het tweede lid is tot 23 september 2010 van overeenkomstige toepassing op een pensioenfonds of
      beroepspensioenfonds, tenzij het fonds bijdragen ontvangt van ondernemingen die zetel hebben in een andere lidstaat
      dan Nederland, in welk geval [artikel 9ba, eerste lid, onderdeel f][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel9ba
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 9ba
  - number: 9ba
    text: |-
      1 Een pensioenfonds voert een beleggingsbeleid dat in overeenstemming is met de prudent person-regel en met name
      met de volgende voorschriften:

      a. de activa worden belegd in het belang van de deelnemers, gewezen deelnemers, gepensioneerden en hun
      pensioengerechtigde nagelaten betrekkingen;

      b. de activa worden op zodanige wijze belegd dat de veiligheid, de kwaliteit, de liquiditeit en het rendement
      van de portefeuille als geheel zijn gewaarborgd. Activa die ter dekking van de technische voorzieningen worden
      aangehouden, worden voorts belegd op een wijze die strookt met de aard en de duur van de verwachte toekomstige
      pensioenuitkeringen;

      c. de activa worden hoofdzakelijk op gereglementeerde markten belegd. Beleggingen in niet tot de handel op een
      gereglementeerde financiële markt toegelaten activa, worden tot een prudent niveau beperkt;

      d. beleggingen in derivaten zijn toegestaan voorzover deze bijdragen tot een vermindering van het beleggingsrisico
      of een doeltreffend portefeuillebeheer vergemakkelijken. Dergelijke beleggingen worden op een prudente basis
      gewaardeerd, met inachtneming van de onderliggende activa, en worden mede in aanmerking genomen bij de waardering
      van de activa van het fonds. Het pensioenfonds vermijdt voorts een bovenmatig risico met betrekking tot één en
      dezelfde tegenpartij en tot andere derivatenverrichtingen;

      e. de activa worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in
      bepaalde activa, of een bepaalde emittent of groep van ondernemingen en risicoaccumulatie in de portefeuille
      als geheel worden vermeden. Beleggingen in activa, uitgegeven door dezelfde emittent of door emittenten die tot
      dezelfde groep behoren, mogen het pensioenfonds niet blootstellen aan bovenmatige risicoconcentratie;

      f. beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan het pensioenfonds bijdragen betaalt, geschieden beleggingen in deze bijdragende ondernemingen
      prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie.

      2 Het eerste lid, onderdelen e en f, is niet van toepassing op beleggingen in staatsobligaties.

      3 Het eerste lid, onderdeel f, is niet van toepassing tot 23 september 2010, tenzij het pensioenfonds bijdragen
      ontvangt van ondernemingen die zetel hebben in een andere lidstaat dan Nederland.

      4 Het is een pensioenfonds verboden leningen aan te gaan of namens derde partijen als garant op te treden, tenzij
      de lening tijdelijk wordt aangegaan voor liquiditeitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel9ba
  - number: 9c
    text: |-
      1 Het pensioenfonds stelt een actuariële en bedrijfstechnische nota vast waarin in elk geval een omschrijving is
      opgenomen van de wijze waarop uitvoering wordt gegeven aan het bepaalde in het tweede lid en het bepaalde bij en
      krachtens de [artikelen 9a][ref1], [9aa][ref2], [9b][ref3], [9ba][ref4] en [9d][ref5]. Het spaarfonds stelt een
      bedrijfstechnische nota vast waarin in elk geval een omschrijving is opgenomen van de wijze waarop uitvoering wordt
      gegeven aan het bepaalde bij en krachtens de [artikelen 9b][ref6] en [9d][ref7].

      2 Een pensioenfonds beschikt over goede administratieve en boekhoudkundige procedures en adequate interne
      controlemechanismen.

      3 In de actuariële en bedrijfstechnische nota wordt een verklaring inzake beleggingsbeginselen opgenomen
      welke verklaring ten minste onderwerpen omvat als toegepaste wegingsmethoden voor beleggingsrisico's, de
      risicobeheersprocedures en de strategische allocatie van activa in het licht van de aard en de looptijd van de
      pensioenverplichtingen. Deze verklaring wordt om de drie jaren en voorts onverwijld na iedere belangrijke wijziging
      van het beleggingsbeleid herzien.

      4 Het bestuur van het fonds legt de in het eerste lid bedoelde nota alsmede iedere wijziging daarvan onverwijld
      over aan de Pensioen- & Verzekeringskamer.

      5 De Pensioen- & Verzekeringskamer kan regels stellen met betrekking tot de tijdstippen en de wijze waarop
      uitvoering wordt gegeven aan het vierde lid.


