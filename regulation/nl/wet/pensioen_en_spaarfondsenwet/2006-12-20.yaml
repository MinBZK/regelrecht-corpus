        bwb_id: BWBR0002089
        artikel: 9c
  - number: '18'
    text: |-
      Ieder der bestuurders van een pensioenfonds of van een spaarfonds is verplicht te zorgen, dat het bepaalde bij of
      krachtens deze wet alsmede de bepalingen van de statuten en reglementen van het fonds worden nageleefd en dat, voor
      zover het een pensioenfonds betreft, het beleid van dat fonds gevoerd wordt overeenkomstig de in [artikel 9c][ref1]
      bedoelde actuariële en bedrijfstechnische nota.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel9c
    url: https://wetten.overheid.nl/BWBR0002089/2006-12-20#Artikel18
