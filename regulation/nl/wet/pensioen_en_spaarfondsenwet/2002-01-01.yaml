        bwb_id: BWBR0002089
        artikel: '8'
  - number: 9b
    text: |-
      1 Belegging van de daartoe beschikbare gelden van een pensioenfonds, een spaarfonds of een beroepspensioenfonds
      moet op solide wijze geschieden.

      2 Vorderingen van een ondernemingspensioenfonds of een spaarfonds op de werkgever, alsmede belegging in aandelen in
      diens onderneming zijn toegelaten tot een bedrag gelijk aan het twintigste deel van de bezittingen van het fonds,
      vermeerderd met een bedrag gelijk aan de vrije reserve van dat fonds. Het bedrag van deze vorderingen en aandelen
      mag evenwel het tiende deel van de bezittingen van het fonds niet overschrijden.

      3 Ten aanzien van een ondernemingspensioenfonds mag van het tweede lid worden afgeweken, voor zover de werkgever
      nieuwe financiële verplichtingen op zich heeft genomen, alsook voor zover het betreft financiële verplichtingen
      van de werkgever, die verband houden met verhogingen van aanspraken op pensioen over reeds verstreken jaren;
      zulks onder voorwaarde dat de aanpassing aan dat lid wordt nagestreefd volgens een plan waarmee de Pensioen- &
      Verzekeringskamer heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel9b
  - number: 9c
    text: |-
      1 Het pensioenfonds, dan wel het beroepspensioenfonds, stelt een actuariële en bedrijfstechnische nota vast waarin
      in elk geval een omschrijving is opgenomen van de wijze waarop uitvoering wordt gegeven aan het bepaalde bij en
      krachtens de [artikelen 9a][ref1], [9b][ref2] en [9d][ref3]. Het spaarfonds stelt een bedrijfstechnische nota vast
      waarin in elk geval een omschrijving is opgenomen van de wijze waarop uitvoering wordt gegeven aan het bepaalde bij
      en krachtens de [artikelen 9b][ref4] en [9d][ref5].

      2 Het bestuur van het fonds legt de in het eerste lid bedoelde nota alsmede iedere wijziging daarvan onverwijld
      over aan de Pensioen- & Verzekeringskamer.

      3 De Pensioen- & Verzekeringskamer kan regels stellen met betrekking tot de tijdstippen en de wijze waarop
      uitvoering wordt gegeven aan het tweede lid.


