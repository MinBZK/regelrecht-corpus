    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      [artikelen 9a][ref1], [9b][ref2] en [9c][ref3]. Daarbij kan worden bepaald dat in geval van overdracht of
      herverzekering als bedoeld in [artikel 9][ref4], [artikel 9c][ref5] en die regels niet van toepassing zijn dan wel
      anderszins daarvan mag worden afgeweken.


