  - number: 32c
    text: |-
      Ingeval het bepaalde in [artikel 5 van de Wet verevening pensioenrechten bij scheiding][ref1] toepassing vindt is
      het bepaalde bij of krachtens deze wet van overeenkomstige toepassing op het eigen recht op pensioen van de tot
      verevening gerechtigde echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel5
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '5'
  - number: 32d
    text: |-
      In de [artikelen 32e][ref1] tot en met [32h][ref2] wordt verstaan onder:

      a. pensioenregeling: een pensioenregeling op grond van een pensioentoezegging in de zin van
      [artikel 2, eerste lid][ref3], dan wel een andere pensioenregeling welke niet bij of krachtens een wet is
      vastgesteld;

      b. pensioen: pensioen op grond van een pensioenregeling als bedoeld onder a;

      c. deelnemer: een deelnemer aan een pensioenregeling als bedoeld onder a;

      d. lidstaat: een lidstaat van de Europese Unie;

      e. gedetacheerd werknemer: een werknemer die in een andere lidstaat wordt gedetacheerd om daar te werken en die
      krachtens titel II van [verordening (EEG) nr. 1408/71](31971R1408) van de Raad van de Europese gemeenschappen
      van 14 juni 1971 betreffende de toepassing van de socialezekerheidsregelingen op loontrekkenden en hun gezinnen,
      die zich binnen de gemeenschap verplaatsen (PbEG L 149), onderworpen blijft aan de wetgeving van de lidstaat van
      oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32e
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32h
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32e
      - id: ref2
