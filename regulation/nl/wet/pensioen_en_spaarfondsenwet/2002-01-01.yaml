  - number: 25a
    text: |-
      Ieder is verplicht aan Onze Minister of aan een bij ministeriële regeling aangewezen instelling desgevraagd
      alle inlichtingen te verstrekken die nodig zijn voor onderzoek inzake het ontbreken van aanvullende
      pensioenvoorzieningen voor werknemers.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel25a
  - number: '26'
    text: |-
      De pensioenfondsen en spaarfondsen zijn verplicht tot vergoeding van de kosten, welke aan de uitvoering van deze
      wet verbonden zijn. Onze Minister stelt hiervoor nadere regelen vast.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel26
  - number: '28'
    text: Wij behouden Ons voor, bij algemene maatregel van bestuur nadere regelen tot uitvoering van deze wet te geven.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel28
  - number: '29'
    text: |-
      1 De Pensioen- & Verzekeringskamer kan desgevraagd in bijzondere gevallen van het bepaalde bij of
      krachtens de [artikelen 2][ref1], [3][ref2], [3][ref3], [5, eerste lid][ref4], [6][ref5], [6a][ref6],
      [8, eerste tot en met vierde, achtste en negende lid][ref7], [8b][ref8], [9b, tweede lid][ref9],
      [10b, eerste tot en met derde lid][ref10], [32a, onderdeel c][ref11], en [artikel 32ba, eerste lid][ref12], onde
      rdeel f, ontheffing verlenen, indien die kamer van oordeel is, dat de belangen van de personen die betrokken zijn
      bij een pensioen- of spaarregeling voldoende gewaarborgd zijn. De ontheffing kan geen betrekking hebben op een
      verzoek om afkoop van pensioen of een aanspraak op pensioen, anders dan met het oog op verwerving van aanspraken op
      pensioen jegens een in het buitenland gevestigde instelling, en een verzoek om ontheffing van het voorschrift van
      gelijke behandeling wat betreft het verlenen van toeslagen.

      2 De ontheffing kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden; zij kan
      voorts worden gewijzigd en ingetrokken.

      3 De Pensioen- & Verzekeringskamer stelt beleidsregels vast met betrekking tot het nemen van beslissingen ter zake
      van ontheffing en publiceert die regels in de *Staatscourant*.


