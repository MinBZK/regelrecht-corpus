  - number: 2a
    text: |-
      1 Ingeval een werkgever een toezegging omtrent pensioen doet, mogen personen, verbonden aan zijn onderneming,
      niet worden uitgesloten van deelneming aan de betreffende pensioenregeling vanwege het minder dan de volledige
      arbeidstijd werkzaam zijn.

      2 Indien als voorwaarde voor toetreding tot de pensioenregeling een minimum loongrens wordt gesteld, wordt voor de
      toepassing van die loongrens het loon van een persoon die minder dan de volledige arbeidstijd werkzaam is, herleid
      naar het loon dat ingeval van een volledige arbeidstijd zou zijn verkregen.

      3 Bij de vaststelling van aanspraken op ouderdoms-, weduwen-, weduwnaars- en partnerpensioen worden aan personen
      die minder dan de volledige arbeidstijd werkzaam zijn ten minste pensioenaanspraken verleend naar evenredigheid van
      de aanspraken die ingeval van een volledige arbeidstijd zouden zijn verkregen.

      4 Bij de vaststelling van aanspraken op invaliditeitspensioen die aan de deelneming kunnen worden ontleend, is
      onderscheid op grond van het enkele feit van de omvang van de arbeidstijd niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel2a
  - number: 2b
    text: |-
      1 Indien in een pensioenregeling wordt voorzien in een ouderdomspensioen en een nabestaandenpensioen dat bij
      beëindiging van de deelneming een premievrije aanspraak oplevert, wordt aan een deelnemer of gewezen deelnemer,
      ongeacht zijn burgerlijke staat, de mogelijkheid geboden, in elk geval met ingang van de datum waarop het
      ouderdomspensioen ingaat of kan ingaan, in plaats van het nabestaandenpensioen te kiezen voor één of meer van de
      volgende vormen van ouderdomspensioen:

      a. een hoger ouderdomspensioen;

      b. een eerder ingaand ouderdomspensioen;

      c. een hoger en een eerder ingaand ouderdomspensioen.

      2 Het eerste lid is niet van toepassing op:

      a. het vrijwillige nabestaandenpensioen;

      b. het wezenpensioen;

      c. de aanspraak van de gewezen echtgenoot, bedoeld in [artikel 8a, eerste en tweede lid][ref1].

      3 De collectieve actuariële waarde van het ouderdomspensioen, bedoeld in het eerste lid, dat wordt gekozen in
      plaats van het nabestaandenpensioen, bedoeld in het eerste lid, is, ongeacht de datum waarop de keuze wordt
      gemaakt, ten minste gelijkwaardig aan de collectieve actuariële waarde van dat nabestaandenpensioen.

      4 Bij de keuze, bedoeld in het eerste lid is, in voorkomend geval in afwijking van [artikel 8c, tweede lid][ref2],
      de toestemming van de echtgenoot vereist of is de toestemming van de partner die is aangemeld in het kader van een
      partnerpensioen vereist. Voor de toepassing van dit artikellid is [artikel 32ba, eerste lid, onderdeel c][ref3],
      niet van toepassing.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      en het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel8a
