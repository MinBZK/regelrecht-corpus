  - number: '23'
    text: |-
      1 Indien de Pensioen- & Verzekeringskamer zulks noodzakelijk acht in het belang van de deelnemers, de gewezen
      deelnemers, of andere belanghebbenden, kan zij aan het bestuur van een pensioenfonds of een spaarfonds een
      aanwijzing geven.

      2 Het bestuur volgt een aanwijzing binnen de door de Pensioen- & Verzekeringskamer gestelde termijn op.

      3 De Pensioen- & Verzekeringskamer kan van haar aanwijzing mededeling doen aan:

      a. de deelnemersraad, bedoeld in [artikel 6a][ref1];

      b. de naar Ons oordeel representatieve centrale organisaties van werkgevers en van werknemers;

      c. organisaties van werkgevers en werknemers, behorende tot bij koninklijk besluit aangewezen categorieën;

      d. de bij koninklijk besluit aangewezen centrale organisaties van andere belanghebbenden;

      e. organisaties van andere belanghebbenden, behorende tot bij koninklijk besluit aangewezen categorieën.

      4 Een centrale organisatie als bedoeld in het derde lid kan van een op grond van dat lid meegedeelde aanwijzing
      mededeling doen aan bij haar aangesloten organisaties op het gebied van de bedrijfstak waarin het fonds werkt of
      waartoe de onderneming behoort waaraan het fonds is verbonden.

      5 De Pensioen- & Verzekeringskamer stelt het fondsbestuur van de toepassing van het derde lid in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel6a
