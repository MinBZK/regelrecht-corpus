  - number: 10b
    text: |-
      1 Het boekjaar van een pensioenfonds, een spaarfonds of een beroepspensioenfonds loopt van 1 januari tot en met
      31 december.

      2 Het bestuur van een pensioenfonds, een spaarfonds of een beroepspensioenfonds legt aan de Pensioen- &
      Verzekeringskamer jaarlijks binnen zes maanden na afloop van het boekjaar een jaarrekening, een jaarverslag
      en overige gegevens over het verstreken boekjaar over, waarin een volledig beeld van de financiële
      toestand van het fonds gegeven wordt en waaruit ten genoegen van die kamer blijkt dat wordt voldaan aan het
      bepaalde bij en krachtens deze wet alsmede, voor zover van toepassing, aan het bepaalde bij of krachtens de
      [Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref1], en dat de belangen van de bij het
      fonds betrokken deelnemers, gewezen deelnemers en overige belanghebbenden voldoende gewaarborgd geacht kunnen
      worden.

      3 Het bestuur van een fonds ten aanzien waarvan [artikel 10][ref2] toepassing vindt legt aan de Pensioen- &
      Verzekeringskamer bovendien jaarlijks binnen zes maanden na afloop van het boekjaar een actuarieel verslag
      betreffende het fonds over, voorzien van de verklaring van een actuaris.

      4 De jaarrekening moet zijn voorzien van een verklaring omtrent de getrouwheid, ondertekend door een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].

      5 De accountant, bedoeld in het vierde lid, is verplicht desgevraagd aan de Pensioen- & Verzekeringskamer
      inzicht te bieden in zijn controlewerkzaamheden alsmede haar alle overige inlichtingen te verstrekken die
      redelijkerwijze geacht kunnen worden nodig te zijn voor de vervulling van de haar bij of krachtens deze wet dan
      wel bij of krachtens de [Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref4] opgelegde
      taak. De Pensioen- & Verzekeringskamer stelt het bestuur van het fonds in de gelegenheid aanwezig te zijn bij het
      verstrekken van inlichtingen door de accountant.

      6 Het vijfde lid is van overeenkomstige toepassing ten aanzien van de actuaris, bedoeld in het derde lid.

      7 Voor zover een beroepspensioenregeling de mogelijkheid opent overeenkomstig
      __REF000___________________________________________________________________________________________________________
      _________ naar eigen keuze overeenkomsten van verzekering te sluiten met het in artikel 2, tweede lid, onderdeel
      a, van die wet bedoelde beroepspensioenfonds, dient de in het tweede lid bedoelde jaarrekening een afzonderlijke
      bedrijfsrekening te bevatten betreffende deze overeenkomsten van verzekering, waaruit onder meer duidelijk zal
      moeten blijken welke waarborgen ten behoeve van de betrokken deelnemers aanwezig zijn.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      wordt voldaan aan de verplichtingen, bedoeld in het eerste tot en met het zevende lid. Daarbij kunnen regels worden
      gesteld omtrent het in bepaalde gevallen meermalen per jaar overleggen van gegevens of verklaringen als bedoeld in
      dit artikel.

      9 De Pensioen- & Verzekeringskamer kan regels stellen met betrekking tot de wijze van overlegging van de in dit
      artikel bedoelde bescheiden.

      10 Indien de accountant naar het oordeel van de Pensioen- & Verzekeringskamer niet of niet meer de nodige
      waarborgen biedt dat deze de toevertrouwde taak met betrekking tot het fonds naar behoren zal vervullen, kan
      de Pensioen- & Verzekeringskamer bepalen dat hij niet bevoegd is de verklaring, bedoeld in het vierde lid, met
      betrekking tot dat fonds af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002830
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref4]: https://wetten.overheid.nl/BWBR0002830
      [ref5]: https://wetten.overheid.nl/BWBR0002830#Artikel2
