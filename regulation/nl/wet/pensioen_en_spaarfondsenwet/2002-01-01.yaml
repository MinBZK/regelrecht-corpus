  - number: 20a
    text: |-
      1 Onze Minister is bevoegd aan de Pensioen- & Verzekeringskamer de gegevens of inlichtingen te vragen die naar
      zijn oordeel nodig zijn voor een onderzoek naar de toereikendheid van deze wet of de wijze waarop de Pensioen- &
      Verzekeringskamer deze wet uitvoert of heeft uitgevoerd, indien dat ter wille van het bedrijfseconomisch toezicht
      nodig blijkt, alsmede gegevens of inlichtingen die betrekking hebben op de uitvoering van de artikelen, genoemd in
      [artikel 20, tweede lid][ref1].

      2 De Pensioen- & Verzekeringskamer is verplicht aan Onze Minister de in het eerste lid bedoelde gegevens of
      inlichtingen te verstrekken. Indien Onze Minister de Pensioen- & Verzekeringskamer vraagt bepaalde gegevens
      of inlichtingen te verstrekken die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke
      pensioen- of spaarfondsen zijn verstrekt of zijn verkregen, en die geen betrekking hebben op de uitvoering van
      de artikelen, genoemd in [artikel 20, tweede lid][ref2], is de Pensioen- & Verzekeringskamer niet verplicht deze
      gegevens of inlichtingen te verstrekken, indien deze betrekking hebben op of herleidbaar zijn tot een afzonderlijk
      pensioenfonds, spaarfonds, rechtspersoon, vennootschap of natuurlijke persoon, met uitzondering van gegevens of
      inlichtingen die betrekking hebben op of herleidbaar zijn tot een pensioenfonds of een spaarfonds dat in staat van
      faillissement is verklaard of op grond van een rechterlijke uitspraak is ontbonden.

      3 Onze Minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.

      4 Onze Minister mag de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend gebruiken voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      Pensioen- & Verzekeringskamer deze wet uitvoert of heeft uitgevoerd.

      5 Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen.

      6 Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      openbaar maken.

      7 De [Wet openbaarheid van bestuur][ref3] en de [Wet Nationale ombudsman][ref4] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht
      werkende onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0005252
