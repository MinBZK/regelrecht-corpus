  - number: '10'
    text: |-
      1 Indien een pensioenfonds, dan wel een beroepspensioenfonds, werkt volgens een actuariële en bedrijfstechnische
      nota als bedoeld in [artikel 9c][ref1], waaruit blijkt dat wordt voldaan aan het bepaalde bij en krachtens de
      [artikelen 9a][ref2] tot en met [9d][ref3] en bovendien aan de eisen die op grond van het tweede lid worden
      gesteld, behoeft overdracht of herverzekering van het risico, bedoeld in [artikel 9, eerste of tweede lid][ref4],
      niet plaats te hebben.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de eisen waaraan
      de financiële opzet in relatie tot het draagvlak van een pensioenfonds, dan wel een beroepspensioenfonds, moet
      voldoen teneinde de nakoming van de uit de pensioenregeling voortvloeiende verplichtingen op zodanige wijze te
      waarborgen dat toepassing kan worden gegeven aan het eerste lid. Deze regels kunnen verschillend worden gesteld
      voor verschillende categorieën van verzekerde risico's, van pensioenfondsen en van beroepspensioenfondsen.

      3 Zodra het fonds verplichtingen heeft ten aanzien waarvan [artikel 9, eerste of tweede lid][ref5], geen toepassing
      heeft gevonden doet het bestuur van het fonds daarvan onverwijld mededeling aan de Pensioen- & Verzekeringskamer.
      Het bepaalde bij en krachtens [artikel 9c, tweede en derde lid][ref6], is van overeenkomstige toepassing.


