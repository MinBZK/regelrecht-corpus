  - number: 6e
    text: |-
      Door middel van een besluit van het bestuur van het fonds kunnen aan de deelnemersraad verdere bevoegdheden dan de
      in deze wet genoemde worden toegekend. Een zodanig besluit wordt schriftelijk vastgelegd en behoeft de instemming
      van de deelnemersraad.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel6e
  - number: '7'
    text: |-
      1 In de statuten en reglementen van een pensioenfonds en van een spaarfonds worden bepalingen opgenomen
      betreffende:

      a. de bestemming van het fonds;

      b. het beheer van het fonds;

      c. de soorten van deelnemers;

      d. de inkomsten van het fonds;

      e. de belegging van de gelden;

      f. de aanspraken, welke de deelneming geeft, en het systeem van financiering van deze aanspraken;

      g. de wijze, waarop de bestuursleden en - indien krachtens het [eerste of tweede lid van artikel 6][ref1] de
      verplichting tot instelling van een deelnemersraad bestaat - de leden van de deelnemersraad worden aangewezen
      onderscheidenlijk gekozen;

      h. de gevallen, waarvoor de werkgever zich de bevoegdheid tot vermindering of beëindiging van zijn bijdrage heeft
      voorbehouden;

      i. de wijziging van de statuten en reglementen, met name ook wat betreft wijziging van de rechten en verplichtingen
      van de deelnemers, gewezen deelnemers en overige belanghebbenden in gevallen, waarin de financiële toestand van het
      fonds daartoe aanleiding geeft;

      j. de liquidatie van het fonds, met name ook wat betreft de verplichtingen van de liquidateuren en de bestemming
      van de bezittingen van het fonds.

      2 In de reglementen van een pensioenfonds en van een spaarfonds wordt tevens de datum van hun inwerkingtreding
      vermeld en, in geval van wijziging van die reglementen, de datum van inwerkingtreding van de wijziging.

      3 De statuten en reglementen van een bedrijfstakpensioenfonds moeten bovendien een omschrijving bevatten van de
      bedrijfstak of de bedrijfstakken, of het deel van de bedrijfstak, waarvoor het fonds geldt.

      4 Het is niet toegestaan in de statuten en reglementen van een pensioenfonds bepalingen op te nemen die het
      bestuurslidmaatschap onmogelijk maken op grond van de hoedanigheid van gewezen deelnemer of op grond van het
      bereikt hebben van een bepaalde leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 6a
  - number: 7a
    text: |-
      De opbouw en de financiering van de pensioenaanspraken vinden gedurende het deelnemerschap ten minste evenredig in
      de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel7a
  - number: '8'
    text: |-
      1 Degene, die aan een pensioenfonds heeft deelgenomen, verkrijgt, tenzij het bepaalde in het achtste lid toepassing
      vindt, bij het eindigen van zijn deelneming anders dan door overlijden of het bereiken van de pensioengerechtigde
      leeftijd een voor hem premievrije aanspraak op ouderdomspensioen en weduwen- of weduwnaarspensioen dan wel
      partnerpensioen, met inachtneming van het bepaalde in dit artikel.

      2 De gewezen deelnemer verkrijgt bij beëindiging van de deelneming ten minste een premievrije aanspraak op
      een evenredig ouderdomspensioen. Daaronder wordt verstaan het verschil tussen het ouderdomspensioen dat de
      gewezen deelnemer zou hebben gekregen als hij zou hebben deelgenomen tot de pensioengerechtigde leeftijd en
      het ouderdomspensioen dat hij zou hebben gekregen als hij zou hebben deelgenomen vanaf het tijdstip waarop zijn
      deelneming eindigde tot de pensioengerechtigde leeftijd. Bij de berekening bedoeld in de vorige volzin wordt,
      voor wat betreft de gegevens die voor de vaststelling van de pensioenaanspraken van belang zijn, uitgegaan van die
      gegevens, zoals deze gelden op het tijdstip waarop de deelneming is geëindigd.

      3 Indien een weduwen- of weduwnaarspensioen respectievelijk een partnerpensioen is toegezegd, verkrijgt de gewezen
      deelnemer bij beëindiging van de deelneming ten behoeve van zijn echtgenoot respectievelijk zijn partner een
      door het pensioenfonds naar redelijkheid vast te stellen premievrije aanspraak op weduwen- of weduwnaarspensioen
      respectievelijk partnerpensioen.

      4 Het pensioenfonds verstrekt de gewezen deelnemer bij beëindiging van de deelneming een opgave bevattende de
      hoogte van de premievrije aanspraken als bedoeld in het tweede en derde lid.

      5 Indien een instelling of persoon op ingegane ouderdomspensioenen van personen die tot de ingang van hun pensioen
      aan de regeling van het pensioenfonds hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft de gewezen
      deelnemer die aan dezelfde regeling van dat fonds heeft deelgenomen er jegens die instelling of persoon recht
      op dat hem op zijn ingegaan ouderdomspensioen overeenkomstige toeslagen worden verleend met inachtneming van
      dezelfde uitgangspunten. Op de overeenkomstige toeslagen kunnen in mindering worden gebracht toeslagen op zijn
      ingegaan ouderdomspensioen welke de gewezen deelnemer over hetzelfde tijdvak uit andere hoofde ontvangt. Een
      overeenkomstig recht op gelijke behandeling heeft zijn weduwe of weduwnaar voor wat betreft toeslagen op weduwen-
      of weduwnaarspensioen. De partner van een gewezen deelnemer na diens overlijden heeft eveneens een overeenkomstig
      recht op gelijke behandeling voor wat betreft toeslagen op zijn partnerpensioen.

      6 Indien een instelling of persoon op ingegane ouderdomspensioenen van personen die tot de ingang van hun pensioen
      aan de regeling van het pensioenfonds hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft de gewezen
      deelnemer die aan dezelfde regeling van dat fonds heeft deelgenomen er jegens die instelling of persoon recht
      op dat hem op zijn premievrije aanspraak op ouderdomspensioen overeenkomstige toeslagen worden verleend met
      inachtneming van dezelfde uitgangspunten. Op de overeenkomstige toeslagen kunnen in mindering worden gebracht
      toeslagen op zijn premievrije aanspraak op ouderdomspensioen welke de gewezen deelnemer over hetzelfde tijdvak
      uit andere hoofde ontvangt. Een overeenkomstig recht op gelijke behandeling heeft de gewezen deelnemer voor wat
      betreft toeslagen op zijn premievrije aanspraak op weduwen- of weduwnaarspensioen. De gewezen deelnemer heeft
      eveneens een overeenkomstig recht op gelijke behandeling voor wat betreft toeslagen op zijn premievrije aanspraak
      op partnerpensioen.

      7 Onze Minister kan aangeven wat voor de toepassing van het vijfde en zesde lid onder gewezen deelnemer en onder
      toeslagen wordt verstaan.

      8 De statuten en reglementen van een pensioenfonds kunnen bepalen dat degene die gedurende een tijdvak korter dan
      een jaar heeft deelgenomen aan een regeling inzake ouderdomspensioen van dat fonds, tenzij hij elders verworven
      pensioenaanspraken bij het fonds heeft ingebracht, bij beëindiging van de deelneming anders dan door overlijden of
      het bereiken van de pensioengerechtigde leeftijd een uitkering ontvangt die ten minste gelijk is aan de door hem
      voor ouderdomspensioen betaalde bijdragen.

      9 De statuten en reglementen van een pensioenfonds kunnen in plaats van het in het achtste lid bedoelde tijdstip,
      waarop de deelneming eindigt, een later tijdstip van uitkering noemen, doch niet later dan twee jaren na het
      eindigen van die deelneming, noch later dan het tijdstip waarop de pensioengerechtigde leeftijd wordt bereikt.

      10 Indien een pensioenregeling van een pensioenfonds kan worden beschouwd als alleen te worden bepaald door
      de door de werkgever of de deelnemer beschikbaar gestelde premies of bijdragen, is het tweede lid niet van
      toepassing en geldt dat de gewezen deelnemer bij beëindiging van de deelneming ten minste een premievrije
      aanspraak op ouderdomspensioen verkrijgt op de voet van de tot dan door hem en voor hem betaalde en uit hoofde
      van [artikel 2, zesde lid][ref1], nog verschuldigde bijdragen naarmate de voor pensioeningang vereiste duur van de
      deelneming is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
  - number: 8a
    text: |-
      1 Indien het huwelijk van een deelnemer eindigt door echtscheiding of ontbinding na scheiding van tafel en bed,
      verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de
      deelnemer ten behoeve van die gewezen echtgenoot zou hebben verkregen, indien op het tijdstip van de echtscheiding
      of van de ontbinding van het huwelijk zijn deelneming zou zijn geëindigd anders dan door overlijden of het bereiken
      van de pensioengerechtigde leeftijd.

      2 Indien het huwelijk van een gewezen deelnemer eindigt door echtscheiding of ontbinding na scheiding van tafel en
      bed, verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de
      gewezen deelnemer ten behoeve van die gewezen echtgenoot heeft verkregen bij het eindigen van zijn deelneming.

      3 Het bepaalde in het eerste en tweede lid vindt geen toepassing, indien de man en de vrouw bij huwelijkse
      voorwaarden of bij een bij geschrift gesloten overeenkomst met het oog op de scheiding anders overeenkomen. De
      overeenkomst is slechts geldig indien aan de overeenkomst een verklaring van het fonds is gehecht, dat het bereid
      is een uit de afwijking voortvloeiend pensioenrisico te dekken.

      4 Het fonds verstrekt aan de gewezen echtgenoot van de deelnemer of gewezen deelnemer een bewijs van diens
      aanspraak.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel8a
  - number: 8b
    text: |-
      1 Degene, die aan een spaarfonds heeft deelgenomen, ontvangt, tenzij het bepaalde in het tweede lid toepassing
      vindt, bij het eindigen van zijn deelneming of op een in de statuten of reglementen van het fonds aangegeven later
      tijdstip een uitkering op de voet van de door en voor hem betaalde en uit hoofde van [artikel 3, derde lid][ref1],
      nog verschuldigde bijdragen.

      2 De statuten en reglementen van een spaarfonds kunnen bepalen dat degene, die korter dan een jaar aan het fonds
      heeft deelgenomen, bij het eindigen van zijn deelneming een uitkering ontvangt ten minste gelijk aan de door hem
      betaalde bijdragen.

      3 De statuten en reglementen van een spaarfonds kunnen in plaats van het in het tweede lid bedoelde tijdstip,
      waarop de deelneming eindigt, een later tijdstip van uitkering noemen, doch niet later dan twee jaren na het
      eindigen van de deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel3
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '3'
  - number: 8c
    text: |-
      1 De aanspraak op ouderdomspensioen van een deelnemer of gewezen deelnemer kan zonder toestemming van diens
      echtgenoot niet bij overeenkomst tussen die deelnemer of gewezen deelnemer en het pensioenfonds of de werkgever
      worden verminderd anders dan bij afkoop zoals voorzien bij of krachtens deze wet, tenzij de echtgenoten het recht
      op pensioenverevening ingevolge de [Wet verevening pensioenrechten bij scheiding][ref1] (*Stb.* 1994, 342) hebben
      uitgesloten.

      2 De aanspraak op weduwen- of weduwnaarspensioen ten behoeve van de echtgenoot van een deelnemer of gewezen
      deelnemer kan zonder toestemming van die echtgenoot niet bij overeenkomst tussen de deelnemer of gewezen deelnemer
      en het pensioenfonds of de werkgever worden verminderd anders dan bij afkoop zoals voorzien bij of krachtens deze
      wet.

      3 Elk beding, strijdig met het bepaalde in het eerste en tweede lid, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: '9'
    text: |-
      1 De voor pensioenen bestemde gelden van een pensioenfonds moeten, tenzij [artikel 10][ref1] toepassing vindt,
      worden aangewend tot het overdragen of het herverzekeren van het uit de aangegane verplichtingen voortspruitende
      risico door het sluiten van overeenkomsten van verzekering met een verzekeraar:

      a. die in het bezit is van de ingevolge [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2]
      vereiste vergunning of heeft voldaan aan de ingevolge de artikelen 37 of 38 van die wet vereiste procedure met
      betrekking tot een bijkantoor in Nederland; of

      b. die heeft voldaan aan de vereiste procedure als bedoeld in de artikelen 111, eerste lid, onderdelen *a* tot en
      met *c*, of tweede lid, 113, eerste of vierde lid, 116, eerste lid, onderdelen *a* tot en met *c*, of derde lid, of
      118, tweede of vijfde lid, van genoemde wet indien het de aldaar bedoelde dienstverrichting naar Nederland betreft.

      2 De voor pensioenen bestemde gelden van een beroepspensioenfonds moeten, tenzij [artikel 10][ref3] toepassing
      vindt, worden aangewend tot het overdragen of het herverzekeren van het risico, dat voortspruit uit de in de
      statuten en enig pensioenreglement van het fonds neergelegde verplichtingen, door het sluiten van overeenkomsten
      van verzekering met een verzekeraar naar eigen keuze van de deelnemer, welke verzekeraar voldoet aan de vereisten,
      bedoeld in het eerste lid onder a of b.

      3 Ingeval het bepaalde in het eerste lid toepassing vindt of voor de inwerkingtreding van deze bepaling heeft
      gevonden, zijn de regelen, welke krachtens [artikel 2, vierde lid][ref4], zijn vastgesteld voor het geval dat een
      werkgever verzekeringsovereenkomsten sluit als daar bedoeld, van overeenkomstige toepassing, indien en voor zover
      een rechthebbende, niet zijnde een deelnemer, aanspraak op pensioen heeft jegens de verzekeraar, bedoeld in het
      eerste lid. Voor de toepassing van de regelen bedoeld in de vorige volzin wordt als verzekeringnemer aangemerkt
      het pensioenfonds dan wel, indien het fonds zijn rechten als verzekeringnemer aan de rechthebbende op het pensioen
      heeft overgedragen, deze rechthebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel2
