  - number: '4'
    text: |-
      1 Als pensioen- of spaarfonds mogen slechts werkzaam zijn rechtspersonen met volledige rechtsbevoegdheid.

      2 Het bestuur van een pensioen- of spaarfonds is verplicht binnen drie maanden na oprichting van het fonds dit te
      melden bij de Pensioen- & Verzekeringskamer door middel van een door die kamer vast te stellen formulier.

      3

      4 Binnen de in het tweede lid genoemde termijn zendt het bestuur van een pensioen- of spaarfonds een afschrift
      van de akte van oprichting, een door het bestuur gewaarmerkt exemplaar van de reglementen, alsmede een
      door het bestuur gewaarmerkt afschrift van de overeenkomst, waarin de regeling omtrent de betaling van de
      bijdragen, als bedoeld in [artikel 3][ref1], is opgenomen, aan de Pensioen- & Verzekeringskamer . Het bestuur
      van het fonds, met uitzondering van een bedrijfstakpensioenfonds ten aanzien waarvan met toepassing van de
      [Wet betreffende verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref2] een verplichting tot deelneming
      geldt dan wel een aanvraag tot een dergelijke verplichting in behandeling is, zendt een authentiek afschrift van
      de akte, houdende wijziging van de statuten, een door het bestuur gewaarmerkt exemplaar van wijzigingen van de
      reglementen, en een door het bestuur gewaarmerkt afschrift van de wijzigingen van de hiervoor bedoelde overeenkomst
      binnen drie maanden na de totstandkoming van die wijzigingen aan de Pensioen- & Verzekeringskamer.

      5 De statuten en reglementen van een pensioen- of spaarfonds moeten bepalingen inhouden, beantwoordende aan de
      voorschriften van de [artikelen 5][ref3], [6][ref4], [7a][ref5] tot en met [10b][ref6], [17][ref7], [17a][ref8]
      en [32b][ref9] en indien van toepassing aan de voorschriften van de [artikelen 2b][ref10] en [32ba][ref11], een en
      ander onverminderd het bepaalde in [artikel 7][ref12].


