  - number: '22'
    text: |-
      1 De Pensioen- & Verzekeringskamer is bevoegd inzage te nemen of door personen, door haar bij uitdrukkelijke en
      bijzondere machtiging aangewezen, te doen nemen van de zakelijke gegevens en bescheiden van een fonds, waarop
      deze wet van toepassing is. Gelijke bevoegdheid heeft de Pensioen- & Verzekeringskamer ten aanzien van de
      zakelijke gegevens en bescheiden van een verzekeraar, als bedoeld in [artikel 2, vierde lid][ref1], en van een
      werkgever, die zijn toezeggingen omtrent pensioen bij een aan zijn onderneming verbonden fonds dan wel bij een
      bedrijfstakpensioenfonds heeft ondergebracht, voor zover deze zakelijke gegevens en bescheiden naar het oordeel van
      de Pensioen- & Verzekeringskamer voor de door die werkgever getroffen pensioenvoorziening van belang zijn.

      2 Hij, die de zakelijke gegevens of bescheiden onder zich heeft, is desgevorderd verplicht deze daartoe open te
      leggen.

      3 Ten aanzien van de door de Pensioen- & Verzekeringskamer gemachtigde personen zijn de [artikelen 5:13][ref2] en
      [5:15 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.

      4 Het fonds, de werkgever en de verzekeraar zijn verplicht de zakelijke gegevens en bescheiden in Nederland
      beschikbaar te hebben en deze gedurende ten minste zeven jaren na het boekjaar waarop ze betrekking hebben
      beschikbaar te houden.

      5 Het vierde lid is niet van toepassing op een verzekeraar met zetel in een andere lidstaat van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel515
