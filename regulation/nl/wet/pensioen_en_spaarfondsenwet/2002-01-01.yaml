preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, regelen vast te stellen betreffende pensioen- en
    spaarvoorzieningen, met name bedrijfs- en ondernemingspensioenfondsen en ondernemingsspaarfondsen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop rustende bepalingen wordt verstaan onder:

      a. "pensioen": ouderdoms-, invaliditeits-, weduwen-, weduwnaars-, partner- en wezenpensioen;

      b. "bedrijfstakpensioenfonds": een in een bedrijfstak werkend fonds, waarin hetzij alleen ten bate van personen,
      die als werknemer, hetzij mede ten bate van personen, die in andere hoedanigheid in die bedrijfstak werkzaam zijn,
      gelden worden bijeengebracht, strekkende tot verzekering van pensioen;

      c. "ondernemingspensioenfonds": een aan een onderneming verbonden fonds, waarin ten bate van personen, die aan die
      onderneming verbonden zijn, gelden worden bijeengebracht, strekkende tot verzekering van pensioen;

      d. "ondernemingsspaarfonds": een aan een onderneming verbonden fonds, waarin voor personen, die aan die onderneming
      verbonden zijn, gelden worden bijeengespaard met het oog op een uitkering bij wijze van oudedagsverzorging;

      e. "werkgever": het hoofd van een onderneming of, zo deze een rechtspersoon is, die rechtspersoon zelve;

      f. "werknemer": ieder, die in dienst van een onderneming is;

      g. "deelnemer": ieder, ten bate van wie gelden in een fonds als bedoeld onder *b, c* of *d,* worden bijeengebracht;

      h. "bijdrage": iedere onder de naam van bijdrage, spaarbijdrage, premie, spaarpremie, inleg, contributie, koopsom,
      dan wel, indien de betaling in termijnen is overeengekomen, aflossing, of onder welke andere naam ook, ineens of
      periodiek verschuldigde geldsom bestemd voor de verzekering van pensioen of voor het sparen voor een uitkering bij
      wijze van oudedagsverzorging;

      i. "Onze Minister": Onze Minister van Sociale Zaken en Werkgelegenheid;

      j. "Pensioen- & Verzekeringskamer ": de Pensioen- & Verzekeringskamer , bedoeld in
      [artikel 2, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1];

      k. "nabestaandenpensioen": weduwen-, weduwnaars-, partner- of wezenpensioen;

      l. “beroepspensioenfonds”: een beroepspensioenfonds als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____, dat een pensioenregeling uitvoert ten aanzien waarvan [artikel 2, eerste lid, van die wet][ref3] toepassing
      heeft gevonden.

      2 In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. echtgenoten: geregistreerde partners;

      c. de man en de vrouw: de geregistreerde partners;

      d. huwelijk: geregistreerd partnerschap;

      e. gehuwden: als partner geregistreerden;

      f. huwelijkse voorwaarden: voorwaarden van een geregistreerd partnerschap;

      g. scheiding of echtscheiding: beëindiging van een geregistreerd partnerschap anders dan door de dood of
      vermissing;

      h. weduwe of weduwnaar: achtergebleven partij bij een geregistreerd partnerschap;

      i. weduwen- en weduwnaarspensioen: pensioen ten behoeve van achtergebleven geregistreerde partners.

      3 Voor de toepassing van deze wet wordt:

      a. met een bedrijfstak gelijkgesteld een groep van instellingen, die niet, of niet alle ondernemingen zijn;

      b. met een onderneming gelijkgesteld elke instelling van welke aard ook;

      c. degene, die een vrij beroep uitoefent (zoals een advocaat, notaris, accountant, actuaris), geacht een
      onderneming te drijven.

      4 Waar in deze wet gesproken wordt van pensioenfonds of spaarfonds, wordt daaronder verstaan een fonds, als bedoeld
      in het eerste lid onder *b* en *c,* onderscheidenlijk onder d.

      5 Een ondernemingspensioen- of spaarfonds kan aan meer dan één onderneming verbonden zijn.

      6 Een bedrijfstakpensioenfonds kan meer dan één bedrijfstak omvatten; ook kan de werking van zodanig fonds beperkt
      zijn tot een deel van een bedrijfstak.

      7 Tenzij anders vermeld is deze wet niet van toepassing op pensioen- of spaarfondsen, waarvoor bij een andere wet
        - met uitzondering van de [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref4] - of bij algemene
      maatregel van bestuur regelingen zijn vastgesteld.

      8 Indien de onderneming, waaraan een pensioenfonds of een spaarfonds verbonden is, ophoudt te bestaan, dan
      wel de verbondenheid van een pensioen- of spaarfonds aan de onderneming anderszins wordt beëindigd, gaat dat
      fonds binnen zes maanden over tot het overdragen of herverzekeren van het uit de aangegane verplichtingen
      voortspruitende risico door het sluiten van overeenkomsten van verzekering met een verzekeraar als bedoeld in
      [artikel 2, vierde lid][ref5].


