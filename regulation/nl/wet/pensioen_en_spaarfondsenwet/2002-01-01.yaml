  - number: 9a
    text: |-
      1 De bezittingen van een pensioenfonds, dan wel van een beroepspensioenfonds, moeten, tezamen met de te verwachten
      inkomsten, toereikend zijn ter dekking van de uit de statuten en reglementen voortvloeiende pensioenverplichtingen.

      2 De aanspraak, bedoeld in [artikel 8, tweede lid][ref1], dient voor de deelnemer in elk geval steeds aan het
      einde van ieder kalenderjaar dan wel, indien dat eerder is, bij beëindiging van de deelneming, volledig te zijn
      gefinancierd. De Pensioen- & Verzekeringskamer kan op grond van bijzondere omstandigheden een langere termijn, van
      ten hoogste dertien weken, toestaan voor financiering als bedoeld in dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel8
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel9a
    references:
