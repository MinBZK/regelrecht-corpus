  - number: '11'
    text: |-
      1 De accountant, bedoeld in [artikel 10b, vierde lid][ref1], meldt de Pensioen- & Verzekeringskamer zo spoedig
      mogelijk elke omstandigheid waarvan hij bij de uitvoering van zijn werkzaamheden als bedoeld in die bepaling kennis
      heeft gekregen en die:

      a. in strijd is met de bij of krachtens deze wet, dan wel bij of krachtens de Wet betreffende verplichte deelneming
      in een beroepspensioenregeling, geldende eisen en verplichtingen;

      b. de nakoming van de door het fonds aangegane verplichtingen bedreigt; of

      c. leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.

      2 Gelijke verplichting als bedoeld in het eerste lid, onderdelen a en b, rust op de actuaris, bedoeld in
      [artikel 10b, derde lid][ref2].

      3 De accountant, onderscheidenlijk de actuaris die op grond van dit artikel tot een melding aan de Pensioen- &
      Verzekeringskamer is overgegaan, is niet aansprakelijk voor schade die een derde dientengevolge lijdt, tenzij
      aannemelijk wordt dat, gelet op alle feiten en omstandigheden, in redelijkheid niet tot melding had mogen worden
      overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel10b
