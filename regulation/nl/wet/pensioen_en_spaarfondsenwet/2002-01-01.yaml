  - number: '32'
    text: |-
      1

      2 Overdracht, inpandgeving of elke andere handeling, waardoor de deelnemer of gewezen deelnemer enig recht op
      zijn pensioen of zijn aanspraak op pensioen aan een ander toekent, anders dan het verlenen van zekerheid voor het
      verkrijgen van uitstel van betaling als bedoeld in [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1] is
      slechts geldig voor zover beslag op zijn pensioen geldig zou zijn bij ontbreken van andere inkomsten.

      3 Volmacht tot invordering van het pensioen, onder welke vorm of welke benaming ook verleend, is steeds
      herroepelijk.

      4 Onverminderd het bepaalde in het vijfde lid, de [artikelen 32][ref2] en [32][ref3] en het bepaalde krachtens
      [artikel 2, vierde lid][ref4], kan pensioen of een aanspraak op pensioen slechts worden afgekocht in bij
      ministeriële regeling aan te wijzen gevallen.

      5 In afwijking van het bepaalde in het vorige lid heeft zowel het pensioenfonds of de verzekeraar zonder
      toestemming van de rechthebbende, als de rechthebbende zonder toestemming van het pensioenfonds of de verzekeraar
      het recht tot afkoop van het pensioen, indien het pensioen op het tijdstip van ingang een bedrag van € 332,29 per
      jaar niet te boven gaat. De afkoopsom wordt ter hand gesteld van de rechthebbende. In het geval de rechthebbende
      zich in het buitenland heeft gevestigd geldt voor het in de eerste volzin genoemde bedrag het tweevoudige en is het
      pensioenfonds of de verzekeraar op verzoek van de rechthebbende verplicht voor het tijdstip van ingang aanspraken
      op pensioen af te kopen indien op het tijdstip van afkoop de hoogte van de pensioenaanspraak het tweevoudige van
      het in de eerste volzin genoemde bedrag niet te boven gaat.

      6 Het bedrag, genoemd in het vorige lid, wordt bij ministeriële regeling telkens herzien met ingang van 1 januari
      met hetzelfde percentage waarmee de consumentenprijsindex Alle Huishoudens, zoals dat wordt berekend door het
      Centraal Bureau voor de Statistiek, over de maand oktober daaraan voorafgaande naar boven of beneden afwijkt van
      die index over de maand oktober van het jaar voorafgaande aan de eerstgenoemde maand oktober.

      7 De afkoopsom, bedoeld in het vijfde lid, is voor mannen en vrouwen gelijk.

      8 Elk beding, strijdig met een der voorgaande leden, is nietig.

      9 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het zevende lid.


