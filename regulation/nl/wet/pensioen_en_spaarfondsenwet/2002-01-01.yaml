  - number: 32a
    text: |-
      Onverminderd de [artikelen 32b][ref1] en [32ba][ref2] is een pensioenfonds uitsluitend bevoegd pensioen of
      aanspraken op pensioen af te kopen voor zover zijn statuten en reglementen dat mogelijk maken, indien de
      rechthebbende daarmee instemt en indien:

      a. die afkoop ertoe strekt het de rechthebbende mogelijk te maken om onder aanwending van de afkoopsom pensioen of
      aanspraken op pensioen te verwerven overeenkomstig een toezegging omtrent pensioen van een andere inhoud van een
      andere werkgever dan de werkgever die het af te kopen pensioen heeft toegezegd, bij de instelling waar die andere
      werkgever de toezegging omtrent pensioen heeft ondergebracht;

      b. de in onderdeel a bedoelde afkoopsom rechtstreeks wordt overgedragen aan de instelling jegens welke de in
      onderdeel a bedoelde aanspraken op pensioen worden verworven;

      c. het pensioen of de aanspraken op pensioen worden verworven jegens een instelling:

      1°. waarop de Pensioen- & Verzekeringskamer toezicht houdt;

      2°. die bij ministeriële regeling is aangewezen;

      3°. die heeft voldaan aan de ingevolge de [artikelen 37][ref3] of
      [38 van de Wet toezicht verzekeringsbedrijf 1993][ref4] vereiste procedure met betrekking tot een bijkantoor in
      Nederland; dan wel

      4°. die heeft voldaan aan de vereiste procedure als bedoeld in de [artikelen 111][ref5], eerste lid, onderdelen *a*
      tot en met *c*, of tweede lid, [113][ref6], eerste of vierde lid, [116][ref7], eerste lid, onderdelen *a* tot en
      met *c*, of derde lid, of [118, tweede of vijfde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref8] indien
      het de aldaar bedoelde dienstverrichting naar Nederland betreft;

      d. het voornemen tot afkoop uiterlijk drie maanden voor de beoogde datum van afkoop schriftelijk wordt gemeld aan
      de Pensioen- & Verzekeringskamer in die gevallen waarin er sprake is van groepsgewijze afkoop en de Pensioen- &
      Verzekeringskamer binnen die periode niet van eventuele bezwaren heeft doen blijken;

      e. met de pensioenbelangen van de echtgenoot of gewezen echtgenoot op redelijke wijze rekening is gehouden en

      f. het pensioen of de aanspraak op pensioen door de instelling jegens welke het pensioen of de aanspraak op
      pensioen wordt verworven, aldus wordt vastgesteld, dat de actuariële waarde ervan ten minste gelijk is aan de
      op dezelfde grondslagen berekende actuariële waarde van het af te kopen pensioen of de af te kopen aanspraken op
      pensioen.


