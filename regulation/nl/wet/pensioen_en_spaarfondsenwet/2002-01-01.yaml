  - number: '12'
    text: |-
      1 Tot het samenstellen van de in [artikel 10b, derde lid][ref1], bedoelde bescheiden, alsmede tot het verrichten
      van andere tot de normale beroepsbezigheden van actuarissen behorende werkzaamheden ten behoeve van een
      pensioenfonds, een spaarfonds of een beroepspensioenfonds is tegenover de Pensioen- & Verzekeringskamer niet
      bevoegd degene, tegen wiens aanwijzing of handhaving bij het fonds de Pensioen- & Verzekeringskamer bedenkingen
      heeft geuit.

      2 De Pensioen- & Verzekeringskamer kan tegen de aanwijzing of handhaving van een actuaris slechts bedenkingen
      uiten, indien de betrokkene, naar haar oordeel, niet of niet meer de nodige waarborgen biedt, dat hij de hem
      toevertrouwde taak naar behoren zal vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel10b
