  - number: 23c
    text: |-
      1 Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete
      voor een afzonderlijke overtreding ten hoogste € 907 560 bedraagt.

      2 De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.

      3 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      4 De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien
      het bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog moet worden
      geacht.

      5 Voor overtreding van voorschriften, gesteld bij of krachtens een algemene maatregel van bestuur op grond
      van de [artikelen 2b, vijfde lid][ref1], [9d][ref2], [10, tweede lid][ref3], [10b, achtste lid][ref4], en
      [32b, derde lid][ref5], wordt het bedrag van de boete bepaald op de wijze als voorzien in de bijlage behorend bij
      die algemene maatregel van bestuur, met dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste
      € 907 560 bedraagt. Ten aanzien van de regelen, bedoeld in [artikel 2, vierde lid, tweede volzin][ref6], is de
      eerste volzin van overeenkomstige toepassing.


