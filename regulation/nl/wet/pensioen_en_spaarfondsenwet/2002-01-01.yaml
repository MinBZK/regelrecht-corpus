        artikel: 32h
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '2'
  - number: 32e
    text: |-
      Deelnemers en andere rechthebbenden die zich na beëindiging van de deelneming aan een pensioenregeling naar een
      andere lidstaat begeven behouden hun aanspraak op pensioen in dezelfde mate als deelnemers en andere rechthebbenden
      die na beëindiging van de deelneming in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel32e
  - number: 32f
    text: |-
      Het orgaan dat de pensioenregeling uitvoert, betaalt het pensioen op verzoek van de rechthebbende in een andere
      lidstaat dan de lidstaat waar dat orgaan is gevestigd, waarbij transactiekosten op het pensioen in mindering
      gebracht kunnen worden.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel32f
  - number: 32g
    text: |-
      1 Een gedetacheerd werknemer kan tijdens de detachering blijven deelnemen aan de pensioenregeling.

      2 Indien tijdens detachering in Nederland de betaling van bijdragen in een andere lidstaat wordt voortgezet, worden
      de in Nederland gedetacheerde werknemer en diens werkgever vrijgesteld van de verplichting tot het betalen van
      bijdragen in Nederland.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel32g
  - number: 32h
    text: |-
      1 Het orgaan dat de pensioenregeling uitvoert verstrekt deelnemers en gewezen deelnemers die zich naar een andere
      lidstaat begeven informatie over hun aanspraken op pensioenen en over de mogelijkheden die hun op grond van de
      pensioenregeling worden geboden.

      2 De informatie die op grond van het eerste lid wordt verstrekt is ten minste overeenkomstig de informatie die
      wordt verstrekt aan deelnemers en gewezen deelnemers die in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel32h
  - number: '33'
    text: |-
      Van burgerlijke rechtsvorderingen ter zake van deelneming in en uitkering uit een fonds, waarop deze wet van
      toepassing is, neemt de kantonrechter kennis.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel33
  - number: 33a
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel87
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:7
  - number: '34'
    text: |-
      Inlichtingen uit de basisadministratie persoonsgegevens en inlichtingen en uittreksels uit de registers van de
      burgerlijke stand, welke met het oog op deelneming in of uitkering uit een fonds, waarop deze wet van toepassing
      is, ten behoeve van deelnemers en gewezen deelnemers van een zodanig fonds worden gevraagd, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel34
  - number: '38'
    text: Deze wet kan worden aangehaald onder de titel Pensioen- en spaarfondsenwet.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel38
