  - number: '3'
    text: |-
      1 Een werkgever, die voor personen, verbonden aan zijn onderneming, de gelegenheid opent of vóór de
      inwerkingtreding van dit artikel geopend heeft, tot sparen voor een uitkering bij wijze van oudedagsverzorging, is
      verplicht met het oog daarop aan de onderneming een spaarfonds te verbinden, dat beantwoordt aan de bepalingen van
      deze wet.

      2 Een werkgever is gehouden ervoor zorg te dragen dat het fonds de bijdragen ontvangt welke voor de uitvoering van
      de spaarregeling overeengekomen zijn.

      3 Indien een werkgever een zodanige regeling heeft getroffen dat de omvang van zijn bijdrage telkens aan het
      einde van een periode wordt vastgesteld, mag een zodanige periode niet langer dan een jaar duren. Indien de
      dienstbetrekking van een werknemer tijdens een zodanige periode eindigt, is de bijdrage naar tijdsevenredigheid
      verschuldigd.

      4 Indien een werkgever zich bij de aanvang of wijziging van de spaarregeling de bevoegdheid tot vermindering
      of beëindiging van zijn bijdrage aan de spaarregeling heeft voorbehouden, is hij verplicht van dit voorbehoud
      schriftelijk mededeling aan het fonds te doen. Hij kan dit voorbehoud slechts maken voor het geval van een
      ingrijpende wijziging van omstandigheden. Wanneer hij voornemens is tot uitoefening van de bevoegdheid op grond van
      dit voorbehoud over te gaan, deelt hij dit onverwijld schriftelijk aan het fonds en aan de deelnemers mede.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel3
  - number: 3a
    text: |-
      1 Een werkgever komt met het aan zijn onderneming verbonden fonds dan wel, indien een voorziening overeenkomstig
      [artikel 2, vierde lid, onder B][ref1], is getroffen, met de verzekeraar schriftelijk een regeling omtrent
      de betaling van de bijdragen overeen, welke ten minste voldoet aan de voorschriften van het volgende lid. Een
      werkgever, die is toegetreden tot een bedrijfstakpensioenfonds, treft eveneens een zodanige regeling met het
      bedrijfstakpensioenfonds, indien en voor zover de statuten en reglementen van dit fonds niet overeenkomstige
      voorschriften omtrent de betaling van de bijdragen bevatten.

      2 Onverminderd [artikel 9a, tweede lid][ref2], moet een werkgever binnen tien dagen na afloop van elk
      kalenderkwartaal zijn eigen bijdrage in de voorziening voor elke deelnemer of, indien een voorziening
      overeenkomstig [artikel 2, vierde lid, onder B][ref3], is getroffen, verzekerde, berekend over dat kwartaal
      alsmede de bijdragen, welke hij over dat kwartaal op het loon van de deelnemers of verzekerden heeft ingehouden,
      voldoen aan het fonds, onderscheidenlijk de verzekeraar. Wordt zijn bijdrage na afloop van een langere termijn dan
      een kwartaal vastgesteld, dan moet hij binnen tien dagen na afloop van elk kwartaal het vierde gedeelte van zijn
      geschatte jaarbijdrage voldoen, met dien verstande, dat hij zijn jaarbijdrage in haar geheel binnen zes maanden na
      afloop van het kalenderjaar moet hebben betaald.

      3 Indien een werkgever zijn verplichting tot betaling aan het pensioen- of spaarfonds niet binnen een maand na
      afloop van de in het tweede lid genoemde termijnen is nagekomen, is ieder der bestuurders van het fonds gehouden
      ervoor zorg te dragen, dat dit binnen 30 dagen aan de Pensioen- & Verzekeringskamer wordt medegedeeld.

      4 Indien een werkgever zijn verplichting tot betaling niet binnen een maand na afloop van de in het tweede
      lid genoemde termijnen is nagekomen, is hij, tenzij hij toepassing heeft gegeven aan het bepaalde in
      [artikel 2, zevende lid][ref4], laatste volzin, verplicht daarvan binnen drie maanden na afloop van die maand
      schriftelijk mededeling te doen aan degenen wier pensioen of aanspraak op pensioen daardoor wordt getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
