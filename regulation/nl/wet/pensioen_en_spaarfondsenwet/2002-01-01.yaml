        artikel: '23'
  - number: 23m
    text: |-
      1 Op verzoek van de Pensioen- & Verzekeringskamer kan de ondernemingskamer van het gerechtshof te Amsterdam over
      een pensioenfonds of een spaarfonds een bewindvoerder aanstellen, indien:

      a. het beheer van een fonds, waarop deze wet van toepassing is, blijk geeft van een zodanig wanbeleid dat de
      belangen van de deelnemers en andere gerechtigden een onmiddellijke voorziening vereisen;

      b. het bestuur van het fonds is komen te ontbreken.

      2 De Pensioen- & Verzekeringskamer dient haar verzoekschrift tot aanstelling van een bewindvoerder in tweevoud in.
      De griffier doet een exemplaar van het verzoekschrift onverwijld aan het fonds toekomen.

      3 Indien de ondernemingskamer het verzoek toewijst, bepaalt zij de duur waarvoor de bewindvoerder is aangesteld.
      Zij kan deze duur op verzoek van de Pensioen- & Verzekeringskamer of van de bewindvoerder verlengen dan wel
      verkorten. De ondernemingskamer kan de bewindvoerder een bezoldiging toekennen ten laste van het fonds of van de
      onderneming waaraan het fonds is verbonden.

      4 De bewindvoerder treedt in de plaats van het bestuur van het fonds.

      5 De voorlopige tenuitvoerlegging van de beschikking tot aanstelling van een bewindvoerder kan worden bevolen,
      indien het verzoek daartoe is gedaan op de grond, genoemd in het eerste lid, onder *a,* van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23m
  - number: '24'
    text: |-
      Telkenjare brengt de Pensioen- & Verzekeringskamer aan Ons verslag uit omtrent haar bevindingen betreffende de
      toepassing van deze wet.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel24
  - number: '25'
    text: |-
      1 De Pensioen- & Verzekeringskamer verzamelt en bewerkt ten behoeve van het door Onze Minister te voeren beleid
      inzake aanvullende pensioenvoorzieningen de daarvoor van belang zijnde gegevens met betrekking tot de aanvullende
      pensioenregelingen, alsmede met betrekking tot het aantal personen dat onder de werking van die regelingen valt.

      2 De instellingen die de in [artikel 2][ref1] bedoelde pensioentoezeggingen uitvoeren, zijn verplicht op verzoek
      van de Pensioen- & Verzekeringskamer alle gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van het
      eerste lid.

      3 Het bestuur van de Pensioen- & Verzekeringskamer raadpleegt de pensioenraad bedoeld in
      [artikel 3, onderdeel ][ref2] over de wijze van uitvoering van het eerste lid.

      4 Onze Minister of de Sociaal Economische Raad kunnen beschikken over de resultaten van de uitvoering van het
      eerste lid.

      5 Bij algemene maatregel van bestuur kan nader worden geregeld over welke gegevens van pensioenfondsen Onze
      Minister of de Sociaal Economische Raad kunnen beschikken bij de uitvoering van het eerste en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel3
