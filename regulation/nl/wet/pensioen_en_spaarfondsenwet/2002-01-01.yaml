  - number: 23d
    text: |-
      Degene jegens wie door de Pensioen- & Verzekeringskamer een handeling is verricht waaraan hij in redelijkheid
      de gevolgtrekking kan verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht
      ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om
      informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23d
  - number: 23e
    text: |-
      1 Indien de Pensioen- & Verzekeringskamer voornemens is een boete op te leggen geeft zij de betrokkene daarvan
      kennis onder vermelding van de gronden waarop het voornemen berust.

      2 In afwijking van [afdeling 4.1.2. van de Algemene wet bestuursrecht][ref1] stelt de Pensioen- & Verzekeringskamer
      de betrokkene in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen
      voordat de boete wordt opgelegd, tenzij het een overtreding betreft die in de bijlage, de algemene maatregel van
      bestuur of de regelen, bedoeld in [artikel 23c][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel23c
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 23c
  - number: 23f
    text: |-
      1 De Pensioen- & Verzekeringskamer legt de boete op bij beschikking.

      2 De beschikking vermeldt in ieder geval:

      a. het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;

      b. het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en

      c. de termijn, bedoeld in [artikel 23h, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel23h
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 23h
  - number: 23g
    text: |-
      1 De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.

      2 In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 23e, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel23e
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23g
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 23e
  - number: 23h
    text: |-
      1 De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 23e, tweede lid][ref1], is aangewezen.

      3 Indien de boete niet tijdig is betaald stuurt de Pensioen- & Verzekeringskamer schriftelijk een aanmaning om
      binnen twee weken de boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de
      aanzegging, dat de boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde
      lid zal worden ingevorderd.

      4 Bij gebreke van tijdige betaling kan de Pensioen- & Verzekeringskamer de boete, verhoogd met de kosten van de
      aanmaning en van de invordering, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      Pensioen- & Verzekeringskamer.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel23e
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 23e
  - number: 23i
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].

      2 Het recht tot strafvordering met betrekking tot een overtreding als bedoeld in [artikel 23b][ref2] vervalt,
      indien de Pensioen- & Verzekeringskamer ter zake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel23b
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 23b
  - number: 23j
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.

      2 De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23j
  - number: 23k
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23k
  - number: 23l
    text: |-
      1 Indien aan een aanwijzing als bedoeld in [artikel 23][ref1] binnen de gestelde termijn niet of onvoldoende
      gevolg is gegeven kan de Pensioen- & Verzekeringskamer aan het bestuur van het fonds aanzeggen dat het vanaf een
      bepaald tijdstip zijn bevoegdheden slechts mag uitoefenen na toestemming door een of meer door de Pensioen- &
      Verzekeringskamer aangewezen personen en met inachtneming van de opdrachten van deze personen; deze aanzegging
      wordt terstond van kracht.

      2 Indien naar het oordeel van de Pensioen- & Verzekeringskamer onverwijld ingrijpen noodzakelijk is kan zij zonder
      voorafgaande aanwijzing onmiddellijk uitvoering geven aan het eerste lid, nadat zij het bestuur in de gelegenheid
      heeft gesteld zijn mening over de onmiddellijke uitvoering te geven.

      3 Het bestuur verleent de door de Pensioen- & Verzekeringskamer aangewezen personen alle medewerking. De Pensioen-
      & Verzekeringskamer kan het bestuur toestaan bepaalde handelingen zonder machtiging te verrichten.

      4 De door de Pensioen- & Verzekeringskamer aangewezen personen oefenen hun bevoegdheden uit gedurende ten
      hoogste twee jaren na de bekendmaking van de aanzegging, bedoeld in het eerste lid, behoudens de bevoegdheid van
      de Pensioen- & Verzekeringskamer om deze termijn te verlengen telkens voor ten hoogste een jaar. Een zodanige
      verlenging maakt de Pensioen- & Verzekeringskamer aan het fonds bekend. De verlenging wordt terstond van kracht. De
      Pensioen- & Verzekeringskamer kan te allen tijde de door haar aangewezen personen door anderen vervangen.

      5 Voor schade ten gevolge van handelingen, die zijn verricht in strijd met een aanzegging als bedoeld in het eerste
      lid, zijn degenen die deze handelingen als orgaan van het fonds verrichten, persoonlijk aansprakelijk tegenover
      het fonds. Het fonds kan de ongeldigheid van deze handelingen inroepen, indien de wederpartij wist dat de vereiste
      toestemming ontbrak of daarvan niet onkundig kon zijn.

      6 De Pensioen- & Verzekeringskamer trekt in elk geval de maatregel, bedoeld in het eerste lid, in zodra zij van
      oordeel is, dat deze maatregel niet langer noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel23
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel23l
