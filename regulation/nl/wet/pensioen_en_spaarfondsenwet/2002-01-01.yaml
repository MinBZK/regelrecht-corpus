  - number: 2c
    text: |-
      1 Indien in een pensioenregeling de deelnemer of gewezen deelnemer de mogelijkheid wordt geboden in plaats van
      een bepaald soort pensioen geheel of gedeeltelijk te kiezen voor een ander soort pensioen, anders dan bedoeld in
      [artikel 2b][ref1], is de collectieve actuariële waarde van dat andere pensioen ten minste gelijkwaardig aan de
      collectieve actuariële waarde van het eerst genoemde pensioen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      keuzemogelijkheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2b
