  - number: '2'
    text: |-
      1 Een werkgever, die aan personen, verbonden aan zijn onderneming, toezeggingen omtrent pensioen doet of vóór de
      inwerkingtreding van dit artikel gedaan heeft, is verplicht ter uitvoering daarvan:

      a. hetzij toe te treden tot een bedrijfstakpensioenfonds;

      b. hetzij aan de onderneming een ondernemingspensioenfonds te verbinden;

      c. hetzij voorzieningen te treffen overeenkomstig het bepaalde in het vierde lid;

      een en ander met inachtneming van de bepalingen van deze wet.

      2 Tenzij het tegendeel uitdrukkelijk blijkt, wordt een werkgever geacht aan een persoon, als bedoeld in het
      vorige lid, een toezegging gedaan te hebben, indien die persoon behoort tot een groep van personen, voor wie in de
      onderneming een regeling betreffende pensioenen geldt.

      3 Het bepaalde in het eerste lid is niet van toepassing:

      a. op een toezegging, welke een werkgever doet bij of na de opzegging van de dienstbetrekking en welke betreft de
      uitkering van pensioen terstond na het eindigen van die dienstbetrekking;

      b. op een toezegging, welke een werkgever doet aan werknemers, die voor de onderneming buiten Nederland werkzaam
      zijn of bestemd zijn voor dadelijke tewerkstelling buiten Nederland, behalve indien zij hun woonplaats in Nederland
      hebben, onderscheidenlijk behouden;

      c. op een toezegging welke een werkgever, zijnde een naamloze vennootschap of een besloten vennootschap met
      beperkte aansprakelijkheid, doet aan een aan zijn onderneming verbonden persoon, die

      1e. houder of indirect houder is van aandelen, welke ten minste een tiende gedeelte van het geplaatste kapitaal van
      de vennootschap vertegenwoordigen, en

      2e. ten opzichte van de werkgever schriftelijk ermede heeft ingestemd dat de toezegging niet overeenkomstig het
      eerste lid wordt uitgevoerd, zulks indien en voor zolang aan het gestelde onder 1e wordt voldaan en de toezegging
      voldoet aan de met betrekking tot dit onderdeel bij ministeriële regeling vast te stellen nadere regels;

      d. op een toezegging respectievelijk een deel van een toezegging omtrent pensioen van een werkgever aan een persoon
      verbonden aan zijn onderneming op grond van diens leeftijd van 60 jaar of ouder respectievelijk 51 tot en met 59
      jaar op het tijdstip van de toezegging. Bij ministeriële regeling worden met betrekking tot dit onderdeel nadere
      regels gesteld.

      4 Voorzieningen, als bedoeld in het eerste lid, onder *c,* kan een werkgever treffen door:

      A.

      B. verzekeringsovereenkomsten te sluiten met een verzekeraar:

      1°. die in het bezit is van de ingevolge [artikel 24, eerste lid, van Wet toezicht verzekeringsbedrijf 1993][ref1]
      vereiste vergunning of heeft voldaan aan de ingevolge de artikelen 37 of 38 van die wet vereiste procedure met
      betrekking tot een bijkantoor in Nederland; of

      2°. die heeft voldaan aan de vereiste procedure als bedoeld in de artikelen 111, eerste lid, onderdelen *a* tot en
      met *c*, of tweede lid, 113, eerste of vierde lid, 116, eerste lid, onderdelen *a* tot en met *c*, of derde lid, of
      118, tweede of vijfde lid, van genoemde wet indien het de aldaar bedoelde dienstverrichting naar Nederland betreft.

      C. er voor te zorgen, dat personen, verbonden aan zijn onderneming, daartoe door hem geheel of ten dele in staat
      gesteld, zelf overeenkomsten als onder B bedoeld sluiten.

      Onze Minister stelt regelen vast met betrekking tot het geval een werkgever zijn toezegging uitvoert of heeft
      uitgevoerd door het treffen van voorzieningen, bedoeld in dit lid, onder B en C. Deze regelen moeten waarborgen,
      dat de positie van de betrokkenen met inachtneming van de aard van die voorzieningen niet beter of slechter is dan
      bij uitvoering van de toezegging op een van de andere wijzen voorzien in het eerste lid. Bedingen, die in strijd
      zijn met die regelen, zijn nietig.

      5 Een werkgever is gehouden ervoor zorg te dragen dat degene, aan wie hij de uitvoering van de pensioentoezegging
      heeft toevertrouwd, de overeengekomen bijdragen ontvangt.

      6 Indien de toezegging inhoudt dat de omvang van de werkgeversbijdrage telkens aan het einde van een periode wordt
      vastgesteld, mag een zodanige periode niet langer dan een jaar duren.

      7 Indien een werkgever zich bij de toezegging de bevoegdheid tot vermindering of beëindiging van zijn bijdrage aan
      de pensioenregeling heeft voorbehouden, is hij verplicht van dit voorbehoud schriftelijk mededeling te doen aan
      degene aan wie hij de uitvoering van de pensioentoezegging heeft toevertrouwd. Hij kan dit voorbehoud slechts maken
      voor het geval van een ingrijpende wijziging van omstandigheden. Wanneer hij voornemens is tot uitoefening van de
      bevoegdheid op grond van dit voorbehoud over te gaan, deelt hij dit onverwijld schriftelijk mede aan degene aan wie
      hij de uitvoering van de pensioentoezegging heeft toevertrouwd, alsmede aan degenen, wier pensioen of aanspraak op
      pensioen daardoor wordt getroffen.

      8 Bij algemene maatregel van bestuur worden regels gesteld omtrent het begrip «toezegging omtrent pensioen»,
      bedoeld in het eerste lid. Daarbij kunnen vrijwillige pensioenvoorzieningen onderscheidenlijk deelnemingen in
      een pensioenfonds of pensioenregeling, anders dan bedoeld in het negende en tiende lid, worden gelijkgesteld met
      pensioenvoorzieningen op grond van een toezegging omtrent pensioen onderscheidenlijk deelnemingen ter uitvoering
      van een toezegging omtrent pensioen.

      9 Met pensioenvoorzieningen op grond van een toezegging omtrent pensioen worden gelijkgesteld vrijwillige
      pensioenvoorzieningen en regelingen als bedoeld in [artikel 13, vierde lid, onderdeel ][ref2].

      10 Met deelneming in een pensioenfonds ter uitvoering van een toezegging omtrent
      pensioen wordt gelijkgesteld deelneming in een bedrijfstakpensioenfonds op grond van de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0012092
    url: https://wetten.overheid.nl/BWBR0002089/2002-01-01#Artikel2
