  - number: '21'
    text: |-
      1 De Pensioen- & Verzekeringskamer is, ter bevordering van een goede vervulling van de haar bij of krachtens deze
      wet opgelegde taken, bevoegd getuigen en deskundigen op te roepen; deze personen zijn verplicht op die oproep te
      verschijnen.

      2 De in het vorige lid bedoelde oproeping geschiedt op de wijze, door de Pensioen- & Verzekeringskamer te bepalen.

      3 De oproeping door middel van dagvaarding geschiedt door een deurwaarder of een ambtenaar, aangesteld voor
      de uitvoering van de politietaak, dan wel een andere ambtenaar of functionaris, voor zover die ambtenaar
      of functionaris door Onze Minister van Justitie daartoe is aangewezen, op de wijze, voorgeschreven bij de
      [artikelen 586][ref1] en [587 van het Wetboek van Strafvordering][ref2]. De termijn van dagvaarding bedraagt ten
      minste drie vrije dagen.

      4 Indien een getuige of deskundige niet op de dagvaarding verschijnt, kan de Pensioen- & Verzekeringskamer daarvan
      procesverbaal opmaken. Zij kan hem andermaal doen dagvaarden en daarbij een bevel tot medebrenging voegen.

      5 Tot het uitbrengen van een dagvaarding en tot de tenuitvoerlegging van een bevel tot medebrenging verleent het
      openbaar ministerie desgevorderd zijn tussenkomst.

      6 De getuigen zijn verplicht getuigenis af te leggen, behoudens verschoning wegens ambts- of beroepsgeheim. De
      deskundigen zijn verplicht om hun taak onpartijdig en naar beste weten te verrichten.

      7 De Pensioen- & Verzekeringskamer is bevoegd de getuige de eed af te nemen.
      [Artikel 177 van het Wetboek van Burgerlijke Rechtsvordering][ref3] is van toepassing.

      8 Tot het afnemen van verhoren van getuigen en deskundigen houdt de Pensioen- & Verzekeringskamer zitting ter
      plaatse, door haar naar gelang van de omstandigheden te bepalen. Zij kan aan een of meer van de leden van haar
      bestuur opdragen een getuige of deskundige te gaan horen.

      9 Aan getuigen en deskundigen wordt op hun verlangen door de voorzitter vergoeding toegeschat op de voet van het
      tarief, vastgesteld ingevolge [artikel 8:36 van de Algemene wet bestuursrecht][ref4].

      10 De kosten van de verrichtingen van deurwaarders worden berekend op de voet van het tarief van gerechtskosten
      in strafzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel586
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel587
