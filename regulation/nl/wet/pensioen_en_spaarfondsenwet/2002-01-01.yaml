  - number: '5'
    text: |-
      1 Het dagelijks beleid van een pensioen- of spaarfonds wordt bepaald door ten minste twee personen.

      2 De deskundigheid van de personen die het beleid van een pensioen- of spaarfonds bepalen of mede bepalen, dient
      naar het oordeel van de Pensioen- & Verzekeringskamer voldoende te zijn met het oog op de belangen van de bij het
      fonds betrokken deelnemers, gewezen deelnemers en overige belanghebbenden.

      3 De voornemens, de handelingen of de antecedenten van de personen die het beleid van het pensioen- of spaarfonds
      bepalen of mede bepalen, mogen de Pensioen- & Verzekeringskamer geen aanleiding geven tot het oordeel dat, met het
      oog op de belangen, bedoeld in het tweede lid, de betrouwbaarheid van deze personen niet buiten twijfel staat.

      4 De personen die het beleid van een pensioen- of spaarfonds bepalen of mede bepalen richten zich bij de
      vervulling van hun taak naar de belangen van de bij het fonds betrokken deelnemers, gewezen deelnemers en overige
      belanghebbenden en zorgen ervoor dat dezen zich door hen op evenwichtige wijze vertegenwoordigd kunnen voelen.

      5 Het bestuur van het fonds brengt elke wijziging in de samenstelling van de personen die het beleid van het fonds
      bepalen of mede bepalen vooraf ter kennis aan de Pensioen- & Verzekeringskamer .

      6 Een wijziging als bedoeld in het vijfde lid word niet doorgevoerd indien de Pensioen- & Verzekeringskamer
      binnen zes weken na ontvangst van de melding, of, indien de Pensioen- & Verzekeringskamer om nadere gegevens of
      inlichtingen heeft verzocht, binnen zes weken na ontvangst van die gegevens of inlichtingen aan het bestuur van het
      fonds bekend maakt dat zij niet met de voorgenomen wijziging instemt.

      7 Indien zich een wijziging voordoet van de antecedenten, bedoeld in het derde lid, stelt het bestuur van het fonds
      de Pensioen- & Verzekeringskamer daarvan onverwijld schriftelijk in kennis.

      8 De Pensioen- & Verzekeringskamer stelt beleidsregels vast met betrekking tot de toepassing van dit artikel.

      9 De Pensioen- & Verzekeringskamer verstrekt aan een autoriteit die ingevolge
      de[Wet toezicht kredietwezen 1992][ref1], de [Wet toezicht beleggingsinstellingen][ref2] onderscheidenlijk de
      [Wet toezicht effectenverkeer 1995][ref3] belast is met het toezicht op kredietinstellingen, beleggingsinstellingen
      onderscheidenlijk effectenbemiddelaars en vermogensbeheerders de gegevens of inlichtingen die zij verkregen heeft
      bij de vervulling van de haar ingevolge deze wet opgedragen taak en die betrekking hebben op de deskundigheid
      van personen als bedoeld in het tweede lid, onderscheidenlijk de voornemens, de handelingen of de antecedenten
      van personen als bedoeld in het derde lid, voor zover de Pensioen- & Verzekeringskamer van oordeel is dat deze
      gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het toezicht dat door die andere autoriteit
      wordt uitgeoefend.

      10 In dit artikel en de daarop berustende bepalingen wordt onder pensioenfonds mede verstaan een
      beroepspensioenfonds.


