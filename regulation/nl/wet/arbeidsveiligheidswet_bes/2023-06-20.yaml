---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: arbeidsveiligheidswet_bes
regulatory_layer: WET
publication_date: '2012-02-03'
valid_from: '2023-06-20'
bwb_id: BWBR0028228
url: https://wetten.overheid.nl/BWBR0028228/2023-06-20
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *arbeid:* alle werkzaamheden in een
      onderneming;
        - *arbeider:* een ieder die arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen worden met een onderneming gelijk gesteld:'
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.a
    text: inrichtingen tot het verplegen van zieken;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.b
    text: inrichtingen tot het verzorgen van hulpbehoevenden;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.c
    text: alle inrichtingen, bedrijven of takken van dienst onder beheer van de overheid of van publiekrechtelijke lichamen;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.d
    text: inrichtingen of bedrijven van verenigingen of van stichtingen;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.e
    text: kantoren van personen, die een vrij beroep uitoefenen, van verenigingen en van stichtingen;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.f
    text: sociëteiten;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.g
    text: |-
      het uitvoeren in eigen beheer van de bouw, de aanleg, de verbouwing, de herstelling, het onderhoud of de sloping
      van gebouwen;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.h
    text: |-
      het in eigen beheer graven, boren, verbeteren, uitdiepen en onderhouden van putten, alsmede de uitvoering van
      andere grondwerken;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: 1.2.i
    text: het uitvoeren van werken onder water.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel1
  - number: '2.1'
    text: |-
      Ter beveiliging van de arbeid kunnen bij of krachtens algemene maatregel van bestuur voorschriften worden gegeven
      ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.a
    text: het voorkomen van ongevallen;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.b
    text: het verschaffen van hulp bij ongevallen;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.c
    text: het voorkomen en beperken van brand en van ongevallen bij brand;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.d
    text: het voorkomen van vergiftiging, besmetting of beroepsziekten;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.e
    text: het verstrekken van drinkwater of andere alcoholvrije dranken;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.f
    text: het bevorderen van de zindelijkheid;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.g
    text: de aanwezigheid van voldoende zindelijke privaten en urinoirs;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.h
    text: het bevorderen van een dragelijke temperatuur;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.i
    text: de verlichting;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.j
    text: de electrische installaties;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.1.k
    text: |-
      het tegengaan van de verspreiding van schadelijke of hinderlijke dampen en van stof en, waar dit niet mogelijk is,
      de verwijdering daarvan.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid of de door hem daartoe aangewezen ambtenaar kan nadere
      voorschriften en aanwijzingen geven ten aanzien van de wijze van uitvoering van de in het eerste lid bedoelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid of de door hem daartoe aangewezen ambtenaar is bevoegd bij het
      niet nakomen van de voorschriften bij of krachtens deze wet gegeven, de arbeid ter plaatse waar deze voorschriften
      niet worden nagekomen te doen staken. Gelijke bevoegdheid bestaat ten aanzien van de arbeid die voor personen
      onmiddellijk gevaar oplevert.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.4'
    text: Het in het vorige lid bedoelde bevel tot staking van de arbeid moet schriftelijk en gedagtekend gegeven worden.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.5'
    text: |-
      Het besluit van Onze Minister van Sociale Zaken en Werkgelegenheid, houdende aanwijzing van de ambtenaar, bedoeld
      in het tweede en derde lid, wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.6'
    text: |-
      Het hoofd of de bestuurder van de onderneming is verplicht te zorgen, dat in zijn onderneming onverwijld aan een
      bevel als in het derde lid van dit artikel bedoeld wordt voldaan; hij is eveneens verplicht te zorgen dat de arbeid
      niet eerder wordt hervat dan nadat het bevel tot staking is ingetrokken door degene, die dit bevel gaf. Hij, die
      het bevel gaf, kan ter uitvoering hiervan de hulp inroepen van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.7'
    text: 'Het hoofd of de bestuurder van de onderneming geeft onverwijld kennis aan de ambtenaar, bedoeld in lid 2 van:'
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.7.a
    text: ongevallen met dodelijk gevolg;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.7.b
    text: ongevallen waarbij de getroffene of getroffenen in een verplegingsinrichting moeten worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.7.c
    text: |-
      ongevallen, die zodanige verwondingen veroorzaken, dat blijvende gehele of gedeeltelijke invaliditeit hier het
      gevolg van kan zijn;
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: 2.7.d
    text: ongevallen waarbij door toevallige omstandigheden geen persoonlijk letsel werd ondervonden.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.8'
    text: |-
      De ambtenaar bedoeld in lid 2 is te allen tijde bevoegd terzake van een ongeval een onderzoek in te stellen of te
      doen instellen.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.9'
    text: |-
      Het hoofd of de bestuurder van de onderneming is verplicht de nodige maatregelen te nemen, opdat ter plaatse van
      het ongeval alles zoveel mogelijk in onveranderde toestand blijft, tenzij daaruit gevaar kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.10'
    text: |-
      Het hoofd of de bestuurder van de onderneming is verplicht bij bovenbedoeld onderzoek de hulp te verlenen of te
      doen verlenen, die door de met het onderzoek belaste ambtenaren redelijkerwijze wordt verlangd om de oorzaak en de
      toedracht van het ongeval te kunnen vaststellen. Onder hulp wordt ten deze mede begrepen het afstaan van voorwerpen
      of stoffen in het belang van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.11'
    text: |-
      Een beschikking krachtens deze wet van de ambtenaar, bedoeld in het vijfde lid, wordt gegeven namens Onze Minister
      van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
  - number: '2.12'
    text: |-
      De bevoegdheden uit het derde en vierde lid zijn van overeenkomstige toepassing indien in verband met de
      epidemie van een infectieziekte behorend tot groep A1 of een directe dreiging daarvan als bedoeld in de
      [Wet publieke gezondheid][ref1], bij of krachtens wettelijk voorschrift dan wel gezien de stand van de wetenschap
      en professionele dienstverlening benodigde noodzakelijke maatregelen of voorzieningen die de kans op besmetting van
      arbeiders of derden in ondernemingen kunnen voorkomen of beperken, in ernstige mate niet worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: '3.1'
    text: |-
      Het hoofd of de bestuurder van een onderneming is verplicht te zorgen dat in zijn onderneming voorschriften of
      aanwijzingen gegeven bij of krachtens deze wet volledig nageleefd worden.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel3
  - number: '3.2'
    text: |-
      In een nijverheidsonderneming waar meer dan honderd arbeiders werkzaam zijn, is het hoofd of de bestuurder van die
      onderneming verplicht tenminste een persoon te belasten met het toezicht op de naleving van de bij of krachtens
      deze wet gegeven voorschriften of aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel3
  - number: '3.3'
    text: |-
      Gelijke verplichting als in het eerste lid van dit artikel op het hoofd of de bestuurder van een onderneming
      is gelegd, rust op de personen die ingevolge het tweede lid van dit artikel belast zijn met het toezicht op de
      naleving van enig voorschrift of aanwijzing gegeven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel3
  - number: '4.1'
    text: |-
      Wanneer bij of krachtens algemene maatregel van bestuur als in het [eerste lid van artikel 2][ref1] bedoeld, aan de
      arbeider gebods- of verbodsvoorschriften zijn gegeven, is deze gehouden die voorschriften op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028228#Artikel2
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028228
        artikel: '2'
  - number: '4.2'
    text: |-
      Die voorschriften moeten door het hoofd of de bestuurder van de onderneming aan alle in zijn onderneming werkzame
      arbeiders worden bekendgemaakt. Hij zal zorg dragen dat aan deze voorschriften wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel4
  - number: '4.3'
    text: |-
      Gelijke verplichtingen als in het tweede lid van dit artikel op het hoofd of bestuurder van een onderneming zijn
      gelegd, rusten op het toezicht houdend personeel voorzover het door het hoofd of de bestuurder van de onderneming
      is belast met de zorg voor de naleving van deze bepalingen.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel4
  - number: '4.4'
    text: |-
      Aan de verplichting van het hoofd of de bestuurder en het toezicht houdend personeel wordt geacht te zijn voldaan,
      wanneer zij aantonen, dat door hen de nodige bevelen zijn gegeven, de nodige middelen zijn verschaft en tevens
      het redelijkerwijze te vorderen toezicht is gehouden om de naleving te verzekeren van de bepalingen, voor welker
      naleving zij verplicht waren te zorgen.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel4
  - number: 4a
    text: |-
      Het hoofd of de bestuurder van de onderneming is verplicht aan de ambtenaar bedoeld in [artikel 2 lid 2][ref1]
      in het belang van de beveiliging van de arbeid, gelegenheid te geven en hulp te verlenen om monsters te nemen van
      stoffen of voorwerpen, welke in de onderneming ontstaan, worden verwerkt, vervaardigd, bereid of ten behoeve van de
      onderneming worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028228#Artikel2
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0028228
        artikel: '2'
  - number: 4b
    text: |-
      Het hoofd of de bestuurder van de onderneming is verplicht te zorgen, dat in zijn onderneming bij of krachtens
      algemene maatregel van bestuur aangewezen werktuigen, toestellen, vaten of gereedschappen niet worden vervaardigd,
      verkocht, verhuurd, afgeleverd of ten verkoop, ter verhuring of ter aflevering dan wel ten gebruik voorhanden
      worden gehouden, indien deze niet aan bij die algemene maatregel van bestuur gestelde voorschriften voldoen. Bij
      of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de constructie en de
      beproeving van bij of krachtens die algemene maatregel van bestuur aangewezen toestellen en vaten, welke gevaar
      voor ontploffing opleveren.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel4b
  - number: '5.1'
    text: |-
      Met hechtenis van ten hoogste drie maanden of geldboete van de eerste categorie wordt gestraft niet-naleving of
      niet-volledige naleving van:
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel5
  - number: 5.1.a
    text: |-
      een voorschrift gegeven krachtens [artikel 2 lid 1][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0028228#Artikel2
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028228
        artikel: '2'
  - number: 5.1.b
    text: |-
      een voorschrift of aanwijzing gegeven krachtens [artikel 2 lid 2][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0028228#Artikel2
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028228
        artikel: '2'
  - number: 5.1.c
    text: |-
      een verplichting ingevolge [artikel 3][ref1] of [artikel 4][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028228#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028228#Artikel4
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028228
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028228
        artikel: '4'
  - number: '5.2'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de tweede categorie wordt gestraft het hoofd of de
      bestuurder van een onderneming, die, nadat een bevel tot staking van de arbeid is gegeven, in strijd met dat bevel
      de arbeid doet of laat hervatten.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel5
  - number: '5.3'
    text: |-
      De bij het eerste lid van dit artikel strafbaar gestelde feiten worden beschouwd als overtredingen; de bij het
      tweede lid van dit artikel strafbaar gestelde feiten worden beschouwd als misdrijven.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel5
  - number: '5.4'
    text: |-
      In de gevallen waarin wegens overtreding straf wordt bepaald tegen het hoofd of de bestuurder, wordt geen straf
      uitgesproken tegen het hoofd of de bestuurder van wie blijkt dat de overtreding buiten zijn toedoen is gepleegd.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel5
  - number: '6.1'
    text: |-
      Met het opsporen der feiten strafbaar gesteld bij [artikel 5][ref1] zijn, behalve de bij
      [artikel 8 van het Wetboek van Strafvordering BES][ref2] aangewezen personen, belast de daartoe door Onze Minister
      van Justitie aan te wijzen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028228#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel8
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028228
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '8'
  - number: '6.2'
    text: |-
      De in het vorige lid bedoelde opsporingsambtenaren hebben toegang tot alle plaatsen, waar arbeid wordt verricht of
      pleegt te worden verricht.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel6
  - number: '6.3'
    text: Wordt hun de toegang geweigerd dan verschaffen zij zich die desnoods met inroeping van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel6
  - number: '6.4'
    text: |-
      Is de plaats bedoeld in het tweede lid van dit artikel tevens een woning of alleen door een woning toegankelijk,
      dan treden zij tegen de wil van de bewoner niet binnen dan op vertoon van een schriftelijke last van een ambtenaar
      van het openbaar ministerie, dan wel in diens tegenwoordigheid. Van dit binnentreden wordt door hen proces-
      verbaal opgemaakt en binnen twee maal vier en twintig uren aan degene, wiens woning is binnengetreden, in afschrift
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel6
  - number: '7.1'
    text: |-
      De in [artikel 6][ref1] bedoelde ambtenaren zijn verplicht tot geheimhouding van hetgeen hun in plaatsen waar zij
      krachtens dat artikel binnentreden, omtrent het daar uitgeoefend wordend bedrijf is bekend geworden, voor zover
      hetgeen hun bekend is geworden niet in strijd is met deze wet, met andere wetten of met de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028228#Artikel6
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028228
        artikel: '6'
  - number: '7.2'
    text: |-
      Hij, die opzettelijk de bij het vorige lid opgelegde geheimhouding schendt, wordt gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van de eerste categorie, met of zonder ontzetting van het recht om ambten of
      bepaalde ambten te bekleden.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel7
  - number: '7.3'
    text: |-
      Hij, aan wiens schuld schending van de geheimhouding te wijten is wordt gestraft met hechtenis van ten hoogste drie
      maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel7
  - number: '7.4'
    text: |-
      Geen vervolging heeft plaats dan op klachte van het hoofd of de bestuurder van de onderneming of van degene, de
      nadeel van de schending van de geheimhouding heeft ondervonden of kan ondervinden.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel7
  - number: '8.1'
    text: 'Deze wet wordt aangehaald als: Arbeidsveiligheidswet BES.'
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel8
  - number: '8.2'
    text: Zij treedt in werking met ingang van de dag na die harer afkondiging.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel8
  - number: '8.3'
    text: |-
      Met ingang van het in het vorige lid bedoelde tijdstip vervalt de Veiligheidslandsverordening 1942 (P.B. 1942,
      no. 162).
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel8
  - number: '9'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van deze landsverordening wordt het Veiligheidsbesluit I (P.B.
      1955, no. 102) geacht te zijn vastgesteld ter uitvoering van artikel 2 dezer landsverordening.
    url: https://wetten.overheid.nl/BWBR0028228/2023-06-20#Artikel9
