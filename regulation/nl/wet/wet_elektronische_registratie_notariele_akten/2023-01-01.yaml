  - number: V.3
    text: |-
      Het repertorium, bedoeld in [artikel 7, eerste lid, van de Registratiewet 1970][ref1], zoals deze luidde
      onmiddellijk voorafgaand aan de inwerkingtreding van deze wet, wordt binnen tien dagen na de datum, vermeld in
      de beschikking, bedoeld in het tweede lid, door de notaris ter naziening ingeleverd bij de inspecteur, bedoeld in
      [artikel 13, onderdeel a, van de Registratiewet 1970][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel13
