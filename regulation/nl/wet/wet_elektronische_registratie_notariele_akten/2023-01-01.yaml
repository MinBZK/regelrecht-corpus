preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat het wenselijk is notariële akten voortaan langs elektronische weg te
    registreren en langs elektronische weg te doen inschrijven in een door de Koninklijke Notariële Beroepsorganisatie
    gehouden repertorium alsmede de registratie van onderhandse akten gedeeltelijk af te schaffen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032526/2023-01-01#ArtikelAanhef
articles:
  - number: V.1
    text: |-
      Tot een bij koninklijk besluit te bepalen datum blijven met betrekking tot akten van notarissen en het repertorium
      de [Registratiewet 1970][ref1] en de [Wet op het notarisambt][ref2] van toepassing zoals deze luidden onmiddellijk
      voorafgaand aan de inwerkingtreding van deze wet, behalve indien ten aanzien van een notaris een onherroepelijke
      beschikking is genomen als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002739
      [ref2]: https://wetten.overheid.nl/BWBR0010388
    url: https://wetten.overheid.nl/BWBR0032526/2023-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002739
      - id: ref2
        bwb_id: BWBR0010388
  - number: V.2
    text: |-
      De inspecteur, bedoeld in [artikel 13, onderdeel a, van de Registratiewet 1970][ref1], kan ten aanzien
      van een notaris een beschikking geven die inhoudt dat met betrekking tot akten die hij opmaakt na
      de in die beschikking vermelde datum en de inschrijving in het repertorium van die akten niet langer
      de bepalingen van de [Registratiewet 1970][ref2] en de [Wet op het notarisambt][ref3] van toepassing
      zijn zoals deze luidden onmiddellijk voor de inwerkingtreding van deze wet. Voor akten als bedoeld in
      [artikel 4 van de Registratiewet 1970][ref4] geldt het bepaalde in de eerste volzin indien de dag waarop het
      overlijden of de vaststelling van vermissing van de beschikker, bedoeld in artikel 4 van de Registratiewet 1970,
      ter kennis van de notaris is gekomen na de datum, genoemd in de beschikking, ligt. De KNB ontvangt een afschrift
      van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002739
      [ref3]: https://wetten.overheid.nl/BWBR0010388
      [ref4]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0032526/2023-01-01#ArtikelV
    references:
