preamble:
  text: |-
    Gelet op artikel 5, tweede lid, van het Besluit ozonlaagafbrekende stoffen Wms 2003 en artikel 1, tweede lid, van
    het Besluit broeikasgassen Wms 2003;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. koelinstallatie: drukapparatuur of drukapparaten als bedoeld in
      [artikel 1, onderdeel e, van het Warenwetbesluit drukapparatuur][ref1] waarin zich een koudemiddel bevindt;

      b. koudemiddel: een gereguleerde stof, een preparaat dat een zodanige stof bevat of een onvolledig met uitsluitend
      fluor gehalogeneerde koolwaterstofverbinding met maximaal twee koolstofatomen, dan wel een preparaat dat een
      zodanige stof bevat;

      c. druk: druk gerelateerd aan de atmosferische druk, zijnde de overdruk, waarbij een vacuüm of onderdruk met een
      negatieve waarde wordt aangeduid;

      d. gebruiksaanwijzing: gebruiksaanwijzing als bedoeld in [artikel 23 van het Warenwetbesluit drukapparatuur][ref2];

      e. gediplomeerd persoon: natuurlijke persoon die beschikt over een diploma als bedoeld in
      [artikel 5, vierde lid, van het Besluit ozonlaagafbrekende stoffen milieubeheer][ref3] of
      [artikel 1, vierde lid, van het Besluit broeikasgassen in apparatuur op schepen milieubeheer][ref4];

      f. automatische lekdetectieapparatuur: apparatuur die deel uitmaakt van een koelinstallatie en waarmee een
      lekkage van koudemiddel met een concentratie van ten minste 100 p.p.m. aan koudemiddel tot ten minste de voor het
      toegepaste koudemiddel geldende MAC-waarde kan worden gemeten.

      2 Deze regeling is niet van toepassing op koelinstallaties op schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0015507#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007617#Artikel1
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel1.1
    references:
