        artikel: '1'
  - number: '2.1'
    text: |-
      1 De eigenaar van een koelinstallatie draagt zorg voor een zodanig beheer van de koelinstallatie dat verlies van
      koudemiddel gedurende het gebruik van de koelinstallatie wordt voorkomen.

      2 De eigenaar van een koelinstallatie draagt zorg voor controle en onderhoud van de koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel2.1
  - number: '3.1'
    text: |-
      1 Een koelinstallatie die volgens de gebruiksaanwijzing behoort te zijn gevuld met drie, doch ten hoogste dertig
      kilogram koudemiddel, wordt ten minste eenmaal per twaalf maanden gecontroleerd door een gediplomeerd persoon.

      2 Een koelinstallatie die volgens de gebruiksaanwijzing behoort te zijn gevuld met meer dan dertig, doch ten
      hoogste driehonderd kilogram koudemiddel, wordt ten minste eenmaal per zes maanden gecontroleerd door een
      gediplomeerd persoon.

      3 Een koelinstallatie die volgens de gebruiksaanwijzing behoort te zijn gevuld met meer dan driehonderd kilogram
      koudemiddel, wordt ten minste eenmaal per drie maanden gecontroleerd door een gediplomeerd persoon.

      4 In afwijking in zoverre van het tweede en derde lid, mag, indien de koelinstallatie is voorzien van automatische
      lekdetectieapparatuur, worden volstaan met onderscheidenlijk één controle per twaalf maanden en één controle per
      zes maanden.

      5 In afwijking in zoverre van het tweede lid, wordt een koelinstallatie als bedoeld in dat lid, die tijdelijk
      buiten bedrijf wordt gesteld en waarvan het koudemiddel is verzameld in een vloeistofvat of een condensor,
      gedurende de periode waarin de koelinstallatie buiten bedrijf is gesteld, eenmaal per twaalf maanden gecontroleerd
      op lekkage van koudemiddel.

      6 In afwijking in zoverre van het derde lid, wordt een koelinstallatie als bedoeld in dat lid, die tijdelijk buiten
      bedrijf wordt gesteld en waarvan het koudemiddel wordt verzameld in een vloeistofvat of een condensor, gedurende
      de periode waarin de koelinstallatie buiten bedrijf is gesteld eenmaal per zes maanden gecontroleerd op lekkage
      van koudemiddel.

      7 In een geval als bedoeld in het vijfde of zesde lid, wordt het vloeistofvat of de condensor verzegeld door
      een gediplomeerd persoon. Na het verbreken van de verzegeling wordt de koelinstallatie gecontroleerd door een
      gediplomeerd persoon.

      8 Ingeval van een mobiele koelinstallatie die in een voertuig is ingebouwd, mag de in het eerste lid bedoelde
      controle of één van de in het tweede tot en met het zesde lid bedoelde controles samenvallen met de vereiste APK-
      keuring van het voertuig.

      9 Indien in een geval als bedoeld in het eerste tot en met het zesde lid, het vermoeden van lekkage bestaat, wordt
      de controle uitgevoerd met behulp van lekdetectieapparatuur met een detectiegrens van ten minste vijf p.p.m bij de
      in de gebruiksaanwijzing voor een lekkagetest voorgeschreven druk.
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel3.1
  - number: '3.2'
    text: |-
      Een controle als bedoeld in [artikel 3.1][ref1] omvat in elk geval:

      a. controle op de aanwezigheid van de bij de koelinstallatie behorende gebruiksaanwijzing;

      b. controle van de voor de koelinstallatie vereiste apparatuur voor drukbeveiliging;

      c. controle van de lekdichtheid van de gehele koelinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020550#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0020550
        artikel: '3.1'
        paragraaf: '3'
  - number: '3.3'
    text: |-
      1 Indien een defect aan de koelinstallatie wordt geconstateerd waardoor verlies van koudemiddel optreedt of kan
      optreden, stelt de eigenaar van de koelinstallatie de installatie onverwijld buiten bedrijf.

      2 De eigenaar van de koelinstallatie draagt onverwijld het herstellen van een defect als bedoeld in het eerste lid
      op aan een gediplomeerd persoon die het defect onverwijld herstelt.

      3 Nadat een defect is hersteld, voert de gediplomeerde persoon een controle uit als bedoeld in [artikel 3.2][ref1].

      4 Zolang een defect als bedoeld in het eerste lid niet is hersteld, wordt de koelinstallatie niet bijgevuld met
      koudemiddel.

      5 De koelinstallatie wordt eerst opnieuw door de eigenaar van die installatie in bedrijf gesteld nadat een defect
      overeenkomstig het tweede lid is hersteld en de controle, bedoeld in het derde lid, is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020550#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020550
        artikel: '3.2'
        paragraaf: '3'
  - number: '3.4'
    text: |-
      1 Alvorens onderhouds- of herstelwerkzaamheden aan een koelinstallatie worden verricht, brengt de gediplomeerde
      persoon de druk in het gedeelte van de koelinstallatie waaraan de werkzaamheden worden verricht, op 1,05 bar of
      lager.

      2 Alvorens een koelinstallatie wordt ontmanteld, brengt de gediplomeerde persoon de druk op 0,3 bar (absoluut)
      of lager.

      3 De gediplomeerde persoon verstrekt aan de eigenaar van de koelinstallatie een schriftelijk bewijs van de
      toegepaste techniek bij het verrichten van onderhouds- of herstelwerkzaamheden van de koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel3.4
  - number: '3.5'
    text: |-
      Bij het verwijderen van olie uit een koelinstallatie neemt de gediplomeerde persoon zodanige maatregelen dat het
      koudemiddel dat vrijkomt uit de olie van de compressor, wordt opgevangen.
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Een controle als bedoeld in [artikel 3.1][ref1] wordt, nadat de koelinstallatie in werking is gesteld, uitgevoerd
      met behulp van lekdetectieapparatuur met een detectiegrens van ten minste vijf p.p.m., bij een druk, zoals
      aangegeven in de gebruiksaanwijzing.

      2 De gediplomeerde persoon verstrekt de eigenaar van de koelinstallatie een schriftelijk bewijs van de toegepaste
      procedure bij het controleren van de lekdichtheid en de resultaten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020550#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020550
        artikel: '3.1'
        paragraaf: '3'
  - number: '4.1'
    text: |-
      1 De eigenaar van een vaste koelinstallatie met drie kilogram of meer koudemiddel draagt er zorg voor dat in de
      directe nabijheid van die installatie een bij die installatie behorend logboek bevindt.

      2 Het eerste lid geldt niet voor een in dat lid bedoelde koelinstallatie in een container die bestemd is voor
      internationaal transport per zeeschip.

      3 De eigenaar van een koelinstallatie als bedoeld in het eerste lid draagt er zorg voor dat in het logboek door een
      gediplomeerd persoon wordt aangetekend:

      a. de datum van een controle en van onderhouds- of herstelwerkzaamheden;

      b. aard van de controle en van de onderhouds- of herstelwerkzaamheden;

      c. naam van de gediplomeerde persoon die de controle of onderhouds- of herstelwerkzaamheden heeft uitgevoerd en,
      indien van toepassing, de naam van de onderneming waarbij die persoon in dienst is;

      d. de resultaten van de controle en van de onderhouds- of herstelwerkzaamheden;

      e. het type en de hoeveelheid koudemiddel dat in de koelinstallatie aanwezig is;

      f. de hoeveelheid koudemiddel die uit de koelinstallatie is afgetapt;

      g. de hoeveelheid en soort koudemiddel waarmee de koelinstallatie is bijgevuld;

      h. een verklaring van lekdichtheid van de koelinstallatie;

      i. een verklaring van drukbeproeving van de koelinstallatie, en

      j. een verklaring van vacumeren en vullen van de koelinstallatie.

      4 De gediplomeerde persoon die de aantekeningen, bedoeld in het derde lid, in het bij de koelinstallatie behorende
      logboek maakt, voorziet die aantekeningen van zijn paraaf.

      5 De eigenaar van een koelinstallatie als bedoeld in het eerste lid bewaart de in het logboek bijgehouden gegevens,
      bedoeld in het vierde lid, gedurende ten minste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 De eigenaar van een mobiele koelinstallatie met drie kilogram of meer koudemiddel draagt er zorg voor dat zich in
      de directe nabijheid van die installatie een bij die installatie behorend logboek bevindt.

      2 Het eerste lid geldt niet voor een mobiele koelinstallatie in een container die bestemd is voor internationaal
      transport per zeeschip.

      3 Het logboek van een mobiele koelinstallatie die is ingebouwd in een motorrijtuig dat is toegelaten tot het
      verkeer op de weg ingevolge [hoofdstuk III van de Wegenverkeerswet 1994][ref1], bevindt zich op een goed bereikbare
      plaats in het voertuig. Een actueel afschrift van dat logboek bevindt zich bij de eigenaar van het voertuig.

      4 [Artikel 4.1, derde tot en met vijfde lid][ref2], is van overeenkomstige toepassing op een mobiele
      koelinstallatie als bedoeld in het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0020550#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0020550
        artikel: '4.1'
        paragraaf: '4'
  - number: '5.1'
    text: |-
      1 De eigenaar van een koelinstallatie die is voorzien van automatische lekdetectieapparatuur, draagt er zorg voor
      dat ten minste eenmaal per twaalf maanden de detectieapparatuur door een gediplomeerd persoon wordt gecontroleerd
      op meetnauwkeurigheid en alarmniveau en, indien nodig, wordt bijgeregeld door de fabrikant, de leverancier, de
      installateur van de apparatuur of een gespecialiseerd rijksinstituut.

      2 De eigenaar van de koelinstallatie draagt er zorg voor dat de resultaten van een controle en daaruit
      voortvloeiende werkzaamheden als bedoeld in het eerste lid, door degene die controle of werkzaamheden heeft
      verricht, worden aangetekend in het logboek dat bij die installatie behoort.
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel5.1
  - number: '6.1'
    text: |-
      1 Indien een koelinstallatie als bedoeld in [artikel 3.1, derde lid][ref1], of onderdelen van die installatie in
      een speciaal voor die installatie of die onderdelen bestemde ruimte is onderscheidenlijk zijn geplaatst, is op of
      bij de toegang van die ruimte duidelijk leesbaar vermeld het type koudemiddel en de hoeveelheid koudemiddel waarmee
      de koelinstallatie volgens de gebruiksaanwijzing behoort te zijn gevuld.

      2 Indien in de ruimte, bedoeld in het eerste lid, twee of meer koelinstallaties zijn geplaatst, is op of bij de
      toegang van die ruimte voor elke koelinstallatie duidelijk leesbaar vermeld het in die installaties aanwezige type
      koudemiddel en de hoeveelheid koudemiddel waarmee die koelinstallaties volgens de gebruiksaanwijzingen behoren te
      zijn gevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0020550#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020550
        artikel: '3.1'
        paragraaf: '3'
  - number: '6.2'
    text: |-
      1 Bij een koelinstallatie als bedoeld in [artikel 3.1, derde lid][ref1], zijn in elk geval de
      bedieningsvoorschriften, zoals opgenomen in de gebruiksaanwijzing, aanwezig, alsmede gegevens omtrent:

      a. naam van de bij een storing van de koelinstallatie in te schakelen gediplomeerde persoon met adres en
      telefoonnummer van het bedrijf waarbij die persoon werkzaam is, en

      b. een beschrijving van mogelijke storingen van de koelinstallatie, van de oorzaken van deze storingen en van de
      maatregelen waarmee deze storingen kunnen worden hersteld.

      2 Bij een koelinstallatie die is voorzien van automatische lekdetectieapparatuur, zijn voorts gegevens aanwezig
      omtrent:

      a. aanwijzingen voor het bedienen van de lekdetectieapparatuur;

      b. instructies voor het afvoeren van het koudemiddel;

      c. te nemen maatregelen bij lekkage van koudemiddel uit de koelinstallatie, en

      d. aanwijzingen voor de bediening van een noodventilatiesysteem, voorzover aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0020550#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020550
        artikel: '3.1'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel7.2
  - number: '7.3'
    text: 'Deze regeling wordt aangehaald als: Regeling lekdichtheid koelinstallaties in de gebruiksfase 2006.'
    url: https://wetten.overheid.nl/BWBR0020550/2008-06-01#Artikel7.3
