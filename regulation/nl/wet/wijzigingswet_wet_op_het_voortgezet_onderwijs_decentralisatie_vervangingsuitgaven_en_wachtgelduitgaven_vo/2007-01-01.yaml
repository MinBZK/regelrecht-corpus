        artikel: 96o
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96m
  - number: VII.1
    text: |-
      Tot het tijdstip waarop de algemene maatregel van bestuur op grond van
      [artikel 96n, eerste lid, van de Wet op het voortgezet onderwijs][ref1] in werking treedt, wordt binnen het raam
      van de door de begrotingswetgever beschikbaar gestelde middelen, jaarlijks de vermindering van de bekostiging in
      verband met de kosten van werkloosheidsuitkeringen en suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid anders dan op grond van de [Ziektewet][ref2] aan gewezen personeel van
      scholen vastgesteld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96n
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96n
      - id: ref2
        bwb_id: BWBR0001888
  - number: VII.2
    text: |-
      Een in het eerste lid bedoelde ministeriële regeling wordt aan de beide Kamers der Staten-Generaal overgelegd.
      De regeling treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door of namens
      een van beide Kamers de wens wordt te kennen gegeven dat het in die regeling geregelde onderwerp bij de wet wordt
      geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelVII
  - number: IX.1
    text: |-
      De werkingsduur van besluiten van Onze Minister van Onderwijs, Cultuur en Wetenschap en van Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit tot vermindering van de bekostiging op grond van de
      [artikelen 96o, eerste en vierde lid][ref1], en [96q.1 van de Wet op het voortgezet onderwijs][ref2], zoals
      luidend op de dag voor de inwerkingtreding van dit artikel, heeft betrekking op de periode tot de dag van de
      inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96q
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96o
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96q
  - number: IX.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op besluiten van de daarin genoemde ministers over de periode van
      1 april 1994 tot 1 augustus 1995 tot vermindering van de bekostiging in verband met vermijdbare ontslagen door een
      bevoegd gezag van scholen bekostigd op grond van de [Wet op het voortgezet onderwijs][ref1] en door besturen van
      centrale diensten als bedoeld in [artikel 53b van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel53b
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 53b
  - number: X
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelX
