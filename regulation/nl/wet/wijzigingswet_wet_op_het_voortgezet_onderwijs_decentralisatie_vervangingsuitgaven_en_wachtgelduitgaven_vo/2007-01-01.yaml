        bwb_id: BWBR0018327
        artikel: IV
  - number: VI
    text: |-
      [Artikel 96o, eerste en vierde tot en met zevende lid][ref1], en
      [artikel 96q.1 van de Wet op het voortgezet onderwijs][ref2] zoals luidend op de dag voor de
      inwerkingtreding van dit artikel blijven van kracht met betrekking tot de bekostiging, bedoeld in
      [artikel 96m, eerste lid, van de Wet op het voortgezet onderwijs][ref3] voorzover de inhoudingen op grond van
      genoemde artikelen betrekking hebben op de periode tot de inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96q
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelVI
    references:
