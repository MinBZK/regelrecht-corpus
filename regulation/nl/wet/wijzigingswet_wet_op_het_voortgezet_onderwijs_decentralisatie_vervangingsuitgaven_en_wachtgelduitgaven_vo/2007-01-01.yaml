preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bevoegde gezagsorganen in het voortgezet onderwijs zelf
    verantwoordelijkheid te laten dragen voor de vervanging bij afwezigheid van personeel;

    dat het tevens wenselijk is bevoegde gezagsorganen in het voortgezet onderwijs zelf verantwoordelijkheid te laten
    dragen voor kosten van werkloosheidsuitkeringen;

    dat het met het oog daarop noodzakelijk is de Wet op het voortgezet onderwijs aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Op geschillen die in bezwaar, beroep of hoger beroep aanhangig zijn of binnen de bezwaar- of beroepstermijn dan wel
      verschoonbaar daarbuiten aanhangig zijn gemaakt tegen voor de inwerkingtreding van dit lid genomen besluiten van de
      rechtspersoon, bedoeld in [artikel 98a, eerste lid, van de Wet op het voortgezet onderwijs][ref1], zoals luidend op
      de dag voor de inwerkingtreding van dit lid, blijven de op die datum geldende regelingen van toepassing. De eerste
      volzin is hangende het bezwaar, beroep of hoger beroep van overeenkomstige toepassing op de bevoegdheid tot het
      intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
  - number: II.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 98b, eerste lid, van de Wet op het voortgezet onderwijs][ref1], zoals luidend op de dag voor de
      inwerkingtreding van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
  - number: III.1
    text: |-
      Scholen kunnen uiterlijk tot de eerste dag van de derde kalendermaand na de
      inwerkingtreding van dit artikel een verzoek richten tot de rechtspersoon, bedoeld in
      [artikel 98a, eerste lid, van de Wet op het voortgezet onderwijs][ref1], zoals luidend op 31 december 2001, tot
      het voor hen uitvoeren van de uit dat artikellid voortvloeiende werkzaamheden ten aanzien van vervangingen in de
      periode tot en met de dag voor de inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
  - number: III.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, verricht de aldaar bedoelde werkzaamheden voor de laatste dag van de
      vijfde kalendermaand na de inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelIII
  - number: IV
    text: |-
      De rechtspersoon, bedoeld in [artikel 98b, eerste lid, van de Wet op het voortgezet onderwijs][ref1], zoals luidend
      op de dag voor de inwerkingtreding van dit artikel:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
  - number: IV.a
    text: |-
      handelt aanvragen als bedoeld in [artikel 96o, derde lid, van de Wet op het voortgezet onderwijs][ref1], zoals
      luidend op die dag, die betrekking hebben op ontslagen die uiterlijk op die dag worden geëffectueerd, af volgens de
      op die dag ter zake geldende regels;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96o
  - number: IV.b
    text: |-
      laat aanvragen als bedoeld in onderdeel a die voor die dag zijn ingediend en betrekking hebben op ontslagen die na
      die dag worden geëffectueerd, buiten verdere behandeling.
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelIV
  - number: V.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 98a, eerste lid, van de Wet op het voortgezet onderwijs][ref1],
      zoals luidend op de dag voor de inwerkingtreding van dit lid, brengt voor de eerste dag van
      de negende maand na de inwerkingtreding van dit lid aan Onze Minister over de periode waarover
      [artikel 123a, tweede lid, van de Wet op het voortgezet onderwijs][ref2], zoals dat artikel luidde op de dag
      voor de inwerkingtreding van dit lid, nog geen toepassing heeft gevonden, verslag uit over zijn werkzaamheden,
      voortvloeiend uit [artikel 98a van de Wet op het voortgezet onderwijs][ref3], zoals luidend op de dag voor
      de inwerkingtreding van dit lid. Dit verslag heeft eveneens betrekking op de werkzaamheden die op grond van
      [artikel III, tweede lid][ref4], zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel123a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
      [ref4]: https://wetten.overheid.nl/BWBR0018327#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelV
