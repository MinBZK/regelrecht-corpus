        artikel: 96q
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96m
  - number: VIa
    text: |-
      [Artikel 96o, derde lid, van de Wet op het voortgezet onderwijs][ref1] zoals luidend op de dag voor
      de inwerkingtreding van dit artikel blijft van kracht met betrekking tot de bekostiging, bedoeld in
      [artikel 96m, eerste lid, van de Wet op het voortgezet onderwijs][ref2] voor zover de inhoudingen op grond van
      eerstgenoemd artikellid betrekking hebben op de periode tot de inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelVIa
    references:
