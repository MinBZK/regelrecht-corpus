  - number: V.2
    text: |-
      [Artikel 123a, derde lid, van de Wet op het voortgezet onderwijs][ref1], zoals luidend op de dag voor de
      inwerkingtreding van dit lid, is van overeenkomstige toepassing op het in het eerste lid bedoelde verslag, met
      dien verstande dat in plaats van de datum 1 mei wordt gelezen: voor de eerste dag van de tiende maand na de
      inwerkingtreding van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel123a
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 123a
  - number: V.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 98b, eerste lid, van de Wet op het voortgezet onderwijs][ref1], zoals luidend op de dag voor de
      inwerkingtreding van dit lid, met dien verstande dat de laatste volzin van het eerste lid wordt gelezen: Dit
      verslag heeft eveneens betrekking op de werkzaamheden die op grond van [artikel IV][ref2] zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0018327#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0018327/2007-01-01#ArtikelV
