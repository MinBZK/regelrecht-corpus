articles:
  - number: '1'
    text: |-
      In de hierna te noemen gebieden wordt het uitoefenen van de burgerluchtvaart verboden tot een hoogte van 609,2 m
      boven gemiddeld zeeniveau.

      1 Een cirkelvormig gebied boven paleis Huis ten Bosch, aangeduid als EHP26 met een straal van 1852 m (1 zeemijl)
      met als middelpunt de coördinaten:

      52-05-45 NB

      04-20-30 OL

      met uitzondering van het gebied boven het terrein, dat als Malieveld bekend staat.

      2 Een rechthoekig gebied boven de paleizen Soestdijk en Drakensteijn, aangeduid als EHP25, waarvan de hoekpunten
      samenvallen met de coördinaten:

      52-11-08 NB - 05-12-30 OL

      52-12-22 NB - 05-17-15 OL

      52-11-21 NB - 05-17-56 OL

      52-10-09 NB - 05-13-11 OL.

      3 Een cirkelvormig gebied boven paleis Noordeinde en Noordeinde 66, aangeduid als EHP27, met een straal van 600 m
      met als middelpunt de coördinaten:

      52-04-53 NB

      004-18-26 OL.

      4 . Een cirkelvormig gebied boven landgoed De Horsten, aangeduid als EHP28, met een straal van 3704 m met als
      middelpunt de coördinaten:

      52°07'00" NB en 004°23'00" OL, als aangegeven in de bij deze regeling behorende [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007400
    url: https://wetten.overheid.nl/BWBR0007400/2003-05-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007400
  - number: '2'
    text: |-
      Het in het vorige artikel genoemde verbod is niet van toepassing op:

      a. Luchtvaartuigen van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten;

      b. Luchtvaartuigen die gebruikt worden ten behoeve van het vervoer van leden van het Koninklijk Huis, Staatshoofden
      en Ministers.

      c. helikopters die worden gebruikt voor spoedeisende hulpverlening door traumateams of voor zoek- en
      reddingsacties.
    url: https://wetten.overheid.nl/BWBR0007400/2003-05-23#Artikel2
  - number: '3'
    text: |-
      1 Het verbod, bedoeld in [artikel 1][ref1] geldt met betrekking tot de in het derde en vierde onderdeel genoemde
      gebieden niet voor:

      a. burgerluchtvaartuigen die toestemming hebben gekregen voor medegebruik van het militaire luchtvaartterrein
      Valkenburg en een klaring hebben gekregen voor het uitvoeren van de voorgeschreven naderings-, vertrek- of
      wachtprocedure;

      b. ambulancevluchten voor het Westeinde Ziekenhuis in Den Haag.

      2 Het verbod, bedoeld in [artikel 1][ref2], geldt niet voor burgerluchtvaartuigen die daarvan ontheffing hebben
      gekregen van de Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007400#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007400#Artikel1
    url: https://wetten.overheid.nl/BWBR0007400/2003-05-23#Artikel3
