    text: Het besluit van 19 april 1993/Nr. DGRLD/JBZ/L93.004096/Rijksluchtvaartdienst/Stcrt. 1993, 77 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007400/1996-03-09#Artikel4
  - number: '5'
    text: |-
