preamble:
  text: |-
    Gelet op artikel 12, eerste lid, onderdeel a, van de Wet Luchtverkeer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007400/1996-03-09#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      Het in het vorige artikel genoemde verbod is niet van toepassing op:

      a. Luchtvaartuigen van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten;

      b. Luchtvaartuigen die gebruikt worden ten behoeve van het vervoer van leden van het Koninklijk Huis, Staatshoofden
      en Ministers.

      c. helikopters die worden gebruikt voor spoedeisende hulpverlening door traumateams of voor zoek- en
      reddingsacties.
    url: https://wetten.overheid.nl/BWBR0007400/1996-03-09#Artikel2
  - number: '3'
    text: |-
      1 Het verbod, bedoeld in [artikel 1][ref1] geldt met betrekking tot de in het derde en vierde onderdeel genoemde
      gebieden niet voor:

      a. burgerluchtvaartuigen die toestemming hebben gekregen voor medegebruik van het militaire luchtvaartterrein
      Valkenburg en een klaring hebben gekregen voor het uitvoeren van de voorgeschreven naderings-, vertrek- of
      wachtprocedure;

      b. ambulancevluchten voor het Westeinde Ziekenhuis in Den Haag.

      2 Het verbod, bedoeld in [artikel 1][ref2], geldt niet voor burgerluchtvaartuigen die daarvan ontheffing hebben
      gekregen van de Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007400#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007400#Artikel1
    url: https://wetten.overheid.nl/BWBR0007400/1996-03-09#Artikel3
