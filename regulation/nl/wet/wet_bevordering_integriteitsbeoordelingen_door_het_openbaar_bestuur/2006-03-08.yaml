  - number: '32'
    text: Het bestuursorgaan of de aanbestedende dienst informeert de betrokkene dat het Bureau om advies is verzocht.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel32
  - number: '33'
    text: |-
      1 Voordat een bestuursorgaan aan een beschikking voorschriften verbindt als bedoeld in
      [artikel 3, zevende lid][ref1], en voordat een bestuursorgaan een voor de betrokkene negatieve beslissing
      neemt op grond van ernstig gevaar als bedoeld in [artikel 3, eerste lid][ref2], dan wel op grond van feiten
      of omstandigheden als bedoeld in [artikel 3, zesde lid][ref3], stelt het de betrokkene in de gelegenheid zijn
      zienswijze naar voren te brengen.

      2 Indien een bestuursorgaan een beschikking geeft, is in elk geval de persoon die in de beschikking wordt genoemd
      een belanghebbende in de zin van [artikel 4:8 van de Algemene wet bestuursrecht][ref4].

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de aanbestedende dienst die een besluit
      neemt terzake van de gunning van een overheidsopdracht, onderscheidenlijk inzake de toestemming, bedoeld
      in [artikel 5, derde lid, onderdeel c][ref5], of de ontbinding van de overeenkomst met de partij aan wie de
      overheidsopdracht is gegund.

      4 Voor de toepassing van het eerste en derde lid zijn de
      [artikelen 4:9 tot en met 4:12 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing.


