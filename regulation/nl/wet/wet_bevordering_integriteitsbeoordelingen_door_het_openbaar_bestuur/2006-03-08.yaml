  - number: '29'
    text: |-
      Het bestuursorgaan dat of de aanbestedende dienst die een advies ontvangt, kan dat advies gedurende twee jaren
      gebruiken in verband met een andere beslissing.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel29
  - number: '30'
    text: |-
      1 In de formulieren die dienen voor het aanvragen van een beschikking of die worden gebruikt in het kader
      van een aanbesteding, worden vragen opgenomen die erop gericht zijn het Bureau in staat te stellen het
      onderzoek naar feiten en omstandigheden als bedoeld in [artikel 3, tweede, derde en zesde lid][ref1], of
      [artikel 9, tweede lid][ref2], respectievelijk [artikel 9, tweede lid, onder a. en b.][ref3] uit te voeren alsmede
      onderzoek te verrichten naar de aspecten, bedoeld in [artikel 9, tweede lid, onder c. en d][ref4].

      2 De in het eerste lid bedoelde vragen omvatten in ieder geval die naar:

      a. de naam, het adres en de woonplaats of plaats van vestiging van de aanvrager of gegadigde;

      b. de naam, het adres en de woonplaats van de persoon die het formulier namens de aanvrager of gegadigde invult;

      c. het sociaal-fiscaalnummer van de persoon, bedoeld in de onderdelen a en b;

      d. het nummer van inschrijving bij de Kamer van Koophandel en Fabrieken;

      e. de rechtsvorm van de aanvrager of gegadigde;

      f. de handelsnaam of handelsnamen waarvan de aanvrager of gegadigde gebruik maakt of heeft gemaakt;

      g. de natuurlijke personen of rechtspersonen die, voorzover van toepassing:

      1°. direct of indirect leiding geven of hebben gegeven aan betrokkene;

      2°. direct of indirect zeggenschap hebben of hebben gehad over betrokkene;

      3°. direct of indirect vermogen verschaffen of hebben verschaft aan betrokkene;

      4°. onderaannemer van betrokkene zijn;

      h. de wijze van financiering.

      3 Het bestuursorgaan, onderscheidenlijk de aanbestedende dienst, verzoekt de betrokkene tevens om invulling van
      de in het eerste lid bedoelde formulieren, indien om advies wordt gevraagd met het oog op een beslissing terzake
      van de intrekking van een subsidie of vergunning, onderscheidenlijk de ontbinding van een overeenkomst inzake een
      overheidsopdracht.


