  - number: '28'
    text: |-
      1 Een ieder die krachtens deze wet de beschikking krijgt over gegevens met betrekking tot een derde, is verplicht
      tot geheimhouding daarvan, behoudens voorzover een bij deze wet gegeven voorschrift mededelingen toelaat.

      2 Het bestuursorgaan dat of de aanbestedende dienst die een advies ontvangt, geeft de daarin opgenomen gegevens
      niet door, behoudens aan:

      a. de aanvrager, dan wel de subsidie-ontvanger of vergunninghouder, uitsluitend voorzover dit noodzakelijk is
      ter motivering van de door deze gevraagde beschikking, onderscheidenlijk van de beschikking tot intrekking van de
      subsidie of vergunning;

      b. de gegadigde of de partij aan wie een overheidsopdracht is gegund, uitsluitend voorzover dit noodzakelijk
      is ter motivering van de weigering van de gunning van de overheidsopdracht of van de toestemming als bedoeld in
      [artikel 5, derde lid, onderdeel c][ref1], onderscheidenlijk van de beslissing tot ontbinding van de overeenkomst
      inzake die overheidsopdracht;

      c. de derde die in de motivering, bedoeld in de onderdelen a en b, wordt vermeld, uitsluitend voorzover de in die
      motivering opgenomen gegevens hem betreffen;

      d. de Algemene Rekenkamer;

      e. de Nationale ombudsman;

      f. het College bescherming persoonsgegevens;

      g. de rechter.

      3 Indien de betrokkene gebruik wenst te maken van de in [artikel 33, eerste, tweede en derde lid][ref2], bedoelde
      mogelijkheid om zijn zienswijze kenbaar te maken, wordt hem door het bestuursorgaan, onderscheidenlijk de
      aanbestedende dienst, de gelegenheid geboden het advies in te zien.

      4 Indien de betrokkene een beschikking dan wel de intrekking van een subsidie of vergunning, onderscheidenlijk de
      weigering van een overheidsopdracht of de ontbinding van een overeenkomst inzake een dergelijke opdracht, in rechte
      aanvecht, is hij bevoegd de in het eerste lid bedoelde gegevens bekend te maken aan de rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel33
