  - number: '6'
    text: |-
      1 Een subsidie aan een rechtspersoon of aan een natuurlijke persoon kan worden geweigerd dan wel worden
      ingetrokken in het geval en onder de voorwaarden, bedoeld in [artikel 3][ref1], indien dit in de desbetreffende
      subsidieregeling is bepaald.

      2 Voordat een beslissing als bedoeld in het eerste lid wordt genomen, kan het bestuursorgaan dat tot die beslissing
      bevoegd is, het Bureau om een advies vragen.

      3 Een subsidieregeling waarin is bepaald dat [artikel 3 van deze we][ref2]t van toepassing is en die niet bij wet
      of algemene maatregel van bestuur is geregeld, behoeft de goedkeuring van Onze Ministers, welke goedkeuring slechts
      kan worden onthouden wegens strijd met het recht of wegens onevenredigheid tussen enerzijds het belang dat moet
      worden gehecht aan de desbetreffende subsidie of subsidies en anderzijds de inbreuk op de persoonlijke levenssfeer
      ten gevolge van het aanvragen van een advies.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
