  - number: '10'
    text: |-
      Het Bureau heeft voorts tot taak bestuursorganen desgevraagd te informeren omtrent de in deze wet en in andere
      algemeen verbindende voorschriften neergelegde weigerings- en intrekkingsgronden inzake subsidies, vergunningen
      en ontheffingen.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel10
  - number: '11'
    text: |-
      Het Bureau kan indien daartoe aanleiding bestaat de officier van justitie, met het oog op diens bevoegdheid
      ingevolge artikel 26, berichten over het advies, indien daarin wordt aangegeven dat er sprake is van ernstig
      gevaar als bedoeld in artikel 3, eerste lid, of feiten en omstandigheden als bedoeld in artikel 3, zesde lid,
      onderscheidenlijk dat er reden is tot toepassing of overeenkomstige toepassing van een bepaling als bedoeld in
      artikel 9, tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel11
  - number: '12'
    text: |-
      1 Het Bureau verzamelt en analyseert persoonsgegevens uitsluitend ten behoeve van het advies.

      2 Het verzamelen van persoonsgegevens wordt beperkt tot:

      a. persoonsgegevens uit openbare registers,

      b. persoonsgegevens die overeenkomstig
      [artikel 8, aanhef en onderdeel e, van de Wet bescherming persoonsgegevens][ref1] zijn verkregen, en

      c. persoonsgegevens die op grond van [artikel 13][ref2] of [27][ref3] zijn verstrekt.

      3 Het Bureau kan bij het verzamelen van gegevens als bedoeld in het tweede lid, gebruik maken van het sociaal-
      fiscaalnummer.

      4 In afwijking van het tweede lid kan het Bureau in het geval dat het door de betrokkene ingevulde formulier,
      bedoeld in [artikel 30][ref4], onvoldoende informatie verschaft voor het onderzoek ten behoeve van het advies, dan
      wel de gegevens die door middel van dat formulier en uit de verschillende bestanden of registraties zijn verkregen
      niet gelijkluidend zijn, de betrokkene verzoeken om nadere gegevens over:

      a. de vertegenwoordigingsbevoegdheid van degene die het formulier heeft ingevuld;

      b. de identiteit en vertegenwoordigingsbevoegdheid van personen die direct of indirect leiding geven;

      c. de identiteit van personen die direct of indirect zeggenschap uitoefenen;

      d. de identiteit van personen die direct of indirect vermogen verschaffen;

      e. de wijze van financiering.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel30
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel12
