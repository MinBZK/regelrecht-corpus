  - number: '21'
    text: |-
      1 De algemene leiding, de organisatie en het beheer van het Bureau berusten bij Onze Minister van Justitie.

      2 De dagelijkse leiding berust bij de directeur van het Bureau.

      3 De directeur van het Bureau rapporteert, gevraagd en ongevraagd, rechtstreeks aan Onze Minister van Justitie al
      hetgeen van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel21
  - number: '22'
    text: |-
      Benoeming, schorsing en ontslag van de directeur van het Bureau geschiedt bij koninklijk besluit op voordracht van
      Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel22
  - number: '23'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties het budget en de formatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel23
  - number: '24'
    text: |-
      Onze Ministers brengen jaarlijks voor 1 mei aan beide kamers der Staten-Generaal een openbaar verslag uit van de
      wijze waarop het Bureau zijn taken in het afgelopen kalenderjaar heeft verricht.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel24
  - number: '25'
    text: |-
      1 Er is een begeleidingscommissie, die geregeld overleg voert met de directeur van het Bureau over de wijze waarop
      het Bureau zijn taak vervult.

      2 De leden van de begeleidingscommissie worden door Onze Ministers benoemd op zodanige wijze dat de in artikel 27,
      eerste lid, genoemde overheidsdiensten en -instellingen, alsmede de bestuursorganen en aanbestedende diensten zich
      in de commissie vertegenwoordigd kunnen weten.

      3 Bij regeling van Onze Ministers worden regels gegeven over de wijze waarop en de frequentie waarmee de directeur
      overleg voert met de begeleidingscommissie.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel25
  - number: '26'
    text: |-
      De officier van justitie die beschikt over gegevens die er op duiden dat een betrokkene in relatie staat tot
      strafbare feiten die reeds gepleegd zijn of, naar redelijkerwijs op grond van feiten of omstandigheden kan worden
      vermoed, gepleegd zullen worden, kan het bestuursorgaan of de aanbestedende dienst wijzen op de wenselijkheid het
      Bureau om een advies te vragen.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel26
  - number: '27'
    text: |-
      1 De volgende bestuursorganen verstrekken, voorzover het persoonsgegevens betreft voor de verwerking
      waarvan zij de verantwoordelijke zijn in de zin van de [Wet bescherming persoonsgegevens][ref1] dan wel de
      [Wet justitiële en strafvorderlijke gegevens][ref2] of de [Wet politieregisters][ref3], het Bureau desgevraagd
      alle persoonsgegevens die noodzakelijk zijn voor de uitvoering van de taak, bedoeld in [artikel 9][ref4]:

      a. Onze Minister van Financiën, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:

      1°. de Belastingdienst FIOD-ECD;

      2°. de rijksbelastingdienst;

      b. Onze Minister van Justitie, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:

      1°. de Centrale Justitiële Documentatie;

      2°. de Immigratie- en Naturalisatiedienst;

      3°. het Meldpunt Ongebruikelijke Transacties en die ingevolge
      [artikel 4, tweede lid, van de Wet melding ongebruikelijke transacties][ref5] kunnen worden verstrekt op grond van
      de [Wet politieregisters][ref6];

      4°. het openbaar ministerie;

      5°. het registratiesysteem Vennoot;

      c. Onze Minister van Landbouw, Natuurbeheer en Visserij, voorzover het bestanden betreft waarvan de gegevens worden
      verwerkt door de Algemene Inspectiedienst;

      d. Onze Minister van Sociale Zaken en Werkgelegenheid, voorzover het bestanden betreft waarvan de gegevens worden
      verwerkt door de Arbeidsinspectie of de Sociale Inlichtingen- en Opsporingsdienst;

      e. Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, voorzover het bestanden betreft
      waarvan de gegevens worden verwerkt door de VROM inlichtingen- en opsporingsdienst;

      f. de in [artikel 1, onderdeel f, van de Wet politieregisters][ref7] bedoelde bestuursorganen, voorzover het een
      politieregister betreft;

      g. het college van burgemeester en wethouders van een gemeente, voorzover het bestanden
      betreft waarvan de gegevens worden verwerkt door het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8], of door de
      gemeentelijke dienst die is belast met de uitvoering van de [Wet werk en bijstand][ref9], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref10] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref11];

      h. de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank;

      i. op voordracht van Onze Ministers, gedaan in overeenstemming met Onze Ministers wie het mede aangaat, bij
      algemene maatregel van bestuur aangewezen bestuursorganen. De voordracht voor een krachtens dit lid vast te stellen
      algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der
      Staten-Generaal is overgelegd.

      2 De persoonsgegevens, bedoeld in het eerste lid, worden niet verstrekt indien:

      a. zij zijn opgenomen in een bij algemene maatregel van bestuur aangewezen bestand,

      b. een zwaarwegend belang van de verstrekkende dienst of instelling aan de verstrekking in de weg staat, of

      c. bij opsporingsgegevens naar het oordeel van de officier van justitie, in overleg met een daartoe door het
      College van Procureurs-Generaal aangewezen officier van justitie, een zwaarwegend strafvorderlijk belang aan de
      verstrekking in de weg staat.

      3 Indien persoonsgegevens niet worden verstrekt op grond van het tweede lid, onderdeel b of c, wordt de
      weigering die gegevens te verstrekken nader gemotiveerd door de verantwoordelijke, bedoeld in het eerste lid,
      onderscheidenlijk de officier van justitie.

      4 De gegevensverstrekking ingevolge het eerste lid geschiedt kosteloos, voorzover bij of krachtens de wet niet
      anders is bepaald.

      5 Op voordracht van Onze Ministers worden bij of krachtens algemene maatregel van bestuur regels gegeven over de
      termijn waarbinnen de verstrekking van gegevens dient plaats te vinden en kunnen regels worden gegeven over de
      wijze van verstrekken van gegevens door de bestuursorganen, bedoeld in het eerste lid.


