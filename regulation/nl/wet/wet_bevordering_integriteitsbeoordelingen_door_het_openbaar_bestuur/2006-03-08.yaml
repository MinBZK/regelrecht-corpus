  - number: '13'
    text: |-
      1 Het Bureau kan ten behoeve van de uitvoering van de taak, bedoeld in artikel 9, de terzake bevoegde autoriteiten
      in het buitenland verzoeken na te gaan of aldaar strafrechtelijke gegevens bekend zijn van personen tot wie het
      onderzoek naar feiten en omstandigheden als bedoeld in de artikelen 3, tweede, derde en zesde lid, en 9, tweede
      lid, zich uitstrekt.

      2 Een verzoek als bedoeld in het eerste lid wordt uitsluitend door tussenkomst van de officier van justitie tot de
      bevoegde autoriteit gericht.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel13
  - number: '14'
    text: |-
      1 Het Bureau neemt in het advies geen gegevens op waarvan:

      a. de verstrekker heeft aangegeven dat deze, gelet op het karakter van die gegevens, niet aan de desbetreffende
      persoon ter kennis mogen worden gebracht, of

      b. de officier van justitie, bedoeld in het tweede lid, heeft aangegeven dat deze niet mogen worden gebruikt in
      verband met een zwaarwegend strafvorderlijk belang.

      2 Het College van Procureurs-Generaal wijst de officier van justitie aan, aan wie het advies, voordat dit wordt
      toegezonden aan het bestuursorgaan dat of de aanbestedende dienst die om advies hebben gevraagd, wordt voorgelegd
      met het oog op de beoordeling of daarin gegevens zijn opgenomen waarvan het gebruik een zwaarwegend strafvorderlijk
      belang schaadt.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel14
  - number: '15'
    text: |-
      1 Het advies wordt zo spoedig mogelijk gegeven, maar in ieder geval binnen een termijn van vier weken nadat het
      bestuursorgaan of de aanbestedende dienst een advies heeft aangevraagd.

      2 De in het eerste lid bedoelde termijn wordt opgeschort met ingang van de dag waarop het bestuursorgaan of
      de aanbestedende dienst is verzocht om gegevens die bij de aanvraag ontbreken of om aanvullende gegevens die
      noodzakelijk zijn voor het advies, tot de dag waarop die gegevens zijn ontvangen.

      3 Indien het advies niet binnen vier weken kan worden gegeven, stelt het Bureau het bestuursorgaan of de
      aanbestedende dienst daarvan in kennis en noemt hij daarbij een termijn waarbinnen het advies wel tegemoet kan
      worden gezien. Deze termijn bedraagt niet meer dan vier weken.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel15
  - number: '16'
    text: |-
      1 Het Bureau brengt een bijdrage in de kosten van het advies in rekening bij het bestuursorgaan dat of de
      aanbestedende dienst die het advies heeft gevraagd.

      2 Bij of krachtens algemene maatregel van bestuur, gegeven op voordracht van Onze Ministers, worden regels gegeven
      over de wijze waarop de in het eerste lid bedoelde bijdrage wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel16
  - number: '17'
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gegeven over de werkwijze van het Bureau, alsmede over
      de totstandkoming en inrichting van het advies.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel17
  - number: '18'
    text: |-
      Het Bureau registreert geen persoonsgegevens waarvan de verstrekker heeft aangegeven dat deze, gelet op het
      karakter van die gegevens, niet aan de desbetreffende persoon ter kennis mogen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel18
  - number: '19'
    text: |-
      Het Bureau kan persoonsgegevens die zijn verzameld of verkregen met het oog op de behandeling van een verzoek om
      advies, gedurende twee jaren verwerken in verband met een ander verzoek.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel19
  - number: '20'
    text: |-
      1 Voor zoveel nodig in afwijking van hetgeen in de [Wet openbaarheid van bestuur][ref1] en andere wetten is bepaald
      ten aanzien van verstrekking van gegevens, verstrekt het Bureau aan derden geen persoonsgegevens die het heeft
      verkregen in het kader van zijn taak, bedoeld in [artikel 9][ref2].

      2 Onder derden als bedoeld in het eerste lid worden mede begrepen andere dienstonderdelen van het Ministerie van
      Justitie en andere overheidsdiensten en -instellingen.

      3 In afwijking van het eerste lid kunnen in de volgende gevallen persoonsgegevens worden verstrekt:

      a. voorzover persoonsgegevens in het advies dienen te worden opgenomen in verband met de noodzakelijke motivering
      daarvan;

      b. in de berichtgeving, bedoeld in [artikel 11][ref3];

      c. ten behoeve van de uitoefening van de controlerende of toezichthoudende bevoegdheid van:

      1°. de Algemene Rekenkamer;

      2°. de Nationale ombudsman;

      3°. het College bescherming persoonsgegevens;

      d. indien toepassing wordt gegeven aan:

      1°. [artikel 125i][ref4] of [126a van het Wetboek van Strafvordering][ref5], of

      2°. [artikel 17 van de Wet op de inlichtingen- en veiligheidsdiensten][ref6];

      e. desgevraagd, ten behoeve van wetenschappelijk onderzoek en statistiek, met dien verstande dat de resultaten
      daarvan geen persoonsgegevens mogen bevatten en voorzover de persoonlijke levenssfeer van de geregistreerde
      daardoor niet onevenredig wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel11
