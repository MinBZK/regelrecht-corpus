  - number: '5'
    text: |-
      1 Een gegadigde voor een overheidsopdracht waarop de richtlijnen, bedoeld in [artikel 9, tweede lid][ref1], niet
      van toepassing zijn en die wordt gegund binnen de krachtens het tweede lid aangewezen sector, kan van de gunning
      van die opdracht worden uitgesloten met inachtneming van de criteria voor de kwalitatieve selectie in de zin van de
      richtlijnen, bedoeld in [artikel 9, tweede lid, onderdeel a][ref2].

      2 Op voordracht van Onze Ministers, gedaan in overeenstemming met Onze Ministers wie het mede aangaat, worden
      bij algemene maatregel van bestuur de sectoren aangewezen ten aanzien waarvan het wenselijk is dat, voordat een
      beslissing wordt genomen inzake de gunning van een overheidsopdracht of de ontbinding van een overeenkomst met de
      partij aan wie een overheidsopdracht is gegund, door het Bureau een advies kan worden uitgebracht. De voordracht
      voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      3 De aanbestedende dienst kan het Bureau om een advies vragen:

      a. voordat een beslissing wordt genomen inzake de gunning van een overheidsopdracht die valt binnen een krachtens
      het tweede lid aangewezen sector;

      b. in het geval die dienst bij overeenkomst heeft bedongen dat de overeenkomst ontbonden wordt, indien zich
      een van de situaties, bedoeld in [artikel 9, tweede lid][ref3], voordoet en de bij overeenkomst verstrekte
      overheidsopdracht binnen een krachtens het tweede lid aangewezen sector valt, alvorens zich op die ontbindende
      voorwaarde te beroepen;

      c. ten aanzien van een onderaannemer, uitsluitend met het oog op diens acceptatie als zodanig, indien de
      aanbestedende dienst in het bestek als voorwaarde heeft gesteld dat onderaannemers niet zonder toestemming van die
      dienst worden gecontracteerd en in het kader van die voorwaarde zich het recht heeft voorbehouden aan het Bureau
      een advies te vragen.


