preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat bestuursorganen over de mogelijkheid beschikken
    om bepaalde subsidies of vergunningen te weigeren of in te trekken indien er sprake is van gevaar dat strafbare
    feiten zullen worden gepleegd of van het vermoeden dat strafbare feiten zijn gepleegd, alsook om bepaalde
    overheidsopdrachten niet te gunnen of een overeenkomst terzake te ontbinden indien door bedrijven niet of niet
    meer wordt voldaan aan de vereisten inzake betrouwbaarheid, en dat bestuursorganen zich bij het nemen van die
    beslissingen daaromtrent kunnen laten adviseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. aanbestedende dienst: de Staat, een provincie, een gemeente, een waterschap, een openbaar lichaam als bedoeld
      in [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], een politieregio, een openbaar lichaam
      voor beroep en bedrijf dan wel een ander openbaar lichaam als bedoeld in [artikel 134 van de Grondwet][ref2], of
      een zelfstandig bestuursorgaan als bedoeld in het tweede lid;

      b. advies: het advies, bedoeld in [artikel 9][ref3];

      c. beschikking: een beschikking terzake van een subsidie, alsmede een beschikking terzake van een vergunning of
      ontheffing als bedoeld in:

      1°. [artikel 7][ref4];

      2°. [artikel 3 van de Drank- en Horecawet][ref5];

      3°. [artikel 6 van de Opiumwet][ref6];

      4°. [artikel 5, eerste en derde lid, van de Wet goederenvervoer over de weg][ref7];

      5°. [artikel 4 van de Wet personenvervoer 2000][ref8];

      6°. [artikel 8.1 van de Wet milieubeheer][ref9];

      7°. de [artikelen 40, eerste lid][ref10], en [61a van de Woningwet][ref11];

      d. bestand: elk gestructureerd geheel van persoonsgegevens als bedoeld in
      [artikel 1, onderdeel c, van de Wet bescherming persoonsgegevens][ref12];

      e. betrokkene: de aanvrager van een beschikking, de subsidie-ontvanger, de vergunninghouder, de gegadigde, de
      partij aan wie een overheidsopdracht is gegund, of de onderaannemer;

      f. Bureau: het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8][ref13];

      g. gegadigde: degene die zich heeft gemeld voor een aanbestedingsprocedure teneinde een aanbieding te doen, of
      heeft ingeschreven op een aanbestedingsprocedure dan wel in onderhandeling is getreden met een aanbestedende
      dienst;

      h. onderaannemer: een derde aan wie een deel van de overheidsopdracht in onderaanneming is of zal worden gegeven
      door degene aan wie de overheidsopdracht is of zal worden gegund;

      i. Onze Ministers: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Justitie;

      j. overheidsopdracht:

      1°. een opdracht die wordt verstrekt op basis van een schriftelijke overeenkomst onder bezwarende titel die is
      gesloten tussen enerzijds een aannemer, leverancier of dienstverlener en anderzijds een aanbestedende dienst, en
      die betrekking heeft op:

      a. de uitvoering dan wel het ontwerp alsmede de uitvoering van werken in het kader van beroepswerkzaamheden die
      zijn gebaseerd op de algemene systematische bedrijfsindeling, dan wel op het laten uitvoeren met welke middelen dan
      ook van een werk dat aan de door de aanbestedende dienst vastgestelde eisen voldoet,

      b. de aankoop, leasing, huur of huurkoop, met of zonder koopoptie, van producten, met dien verstande dat dit tevens
      de nodige werkzaamheden kan omvatten voor het aanbrengen en installeren van die producten bij de levering daarvan,
      of

      c. de uitvoering van diensten in de meest ruime zin;

      2°. het geheel van afspraken dat vastgelegd is in een schriftelijke overeenkomst tussen enerzijds een aanbestedende
      dienst en anderzijds een of meer private partijen, over de uitvoering van werken of diensten geheel of ten dele
      voor rekening en risico van een of meer van die private partijen;

      k. sector: een terrein van economische bedrijvigheid waarop overheidsopdrachten verstrekt kunnen worden;

      l. verwerking van persoonsgegevens: elke handeling of elk geheel van handelingen als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref14];

      m. sociaal-fiscaalnummer: het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref15].

      2 Op voordracht van Onze Ministers kunnen bij algemene maatregel van bestuur zelfstandige bestuursorganen worden
      aangewezen als aanbestedende dienst.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


