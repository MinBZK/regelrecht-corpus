  - number: '4'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 30, derde lid][ref1], wordt de weigering van de betrokkene,
      niet zijnde de partij aan wie een overheidsopdracht is gegund of de onderaannemer, om een formulier als
      bedoeld in [artikel 30, eerste lid][ref2], volledig in te vullen, aangemerkt als ernstig gevaar als bedoeld in
      [artikel 3, eerste lid][ref3].

      2 Het eerste lid is van overeenkomstige toepassing, indien de betrokkene, niet zijnde de gegadigde, de partij aan
      wie een overheidsopdracht is gegund of de onderaannemer, weigert aanvullende gegevens te verschaffen in het geval,
      bedoeld in [artikel 12, derde lid][ref4].


