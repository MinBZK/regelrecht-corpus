  - number: '43'
    text: |-
      De bepalingen van de in [hoofdstuk 5][ref1] genoemde wetten, zoals zij luiden na de inwerkingtreding van deze wet,
      zijn niet van toepassing op de aanvraag van een beschikking die voor die datum is ingediend, onderscheidenlijk de
      aanbestedingsprocedure of onderhandeling waarmee voor die datum een aanvang is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013798
        hoofdstuk: '5'
  - number: '44'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen Onze Ministers tijdelijk van een of meer bij of krachtens deze wet
      gegeven voorschriften afwijken of een zodanige afwijking toestaan.

      2 Indien toepassing wordt gegeven aan het eerste lid, worden in ieder geval bepaald:

      a. de wijze waarop tot een keuze voor een afwijking als bedoeld in het eerste lid, wordt gekomen,

      b. de voorschriften waarvan tijdelijk kan worden afgeweken, alsmede in welke zin van die voorschriften kan worden
      afgeweken,

      c. de ten hoogste toegestane tijdsduur van een afwijking als bedoeld in het eerste lid, en

      d. de wijze waarop tot de vaststelling wordt gekomen of de tijdelijke afwijking als bedoeld in het eerste lid
      zodanig geslaagd is dat het wettelijk voorschrift waarvan tijdelijk is afgeweken, zou moeten worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel44
  - number: '45'
    text: |-
      Onze Ministers zenden binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel45
  - number: '46'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel46
  - number: '47'
    text: 'Deze wet wordt aangehaald als: Wet bevordering integriteitsbeoordelingen door het openbaar bestuur.'
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel47
