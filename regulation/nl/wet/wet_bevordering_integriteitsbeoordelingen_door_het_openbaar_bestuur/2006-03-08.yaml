  - number: '8'
    text: Er is een Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur.
    url: https://wetten.overheid.nl/BWBR0013798/2006-03-08#Artikel8
  - number: '9'
    text: |-
      1 Het Bureau heeft tot taak aan bestuursorganen, voorzover deze bij of krachtens de wet de bevoegdheid
      hebben gekregen het Bureau daartoe te verzoeken, desgevraagd advies uit te brengen over de mate van gevaar,
      bedoeld in [artikel 3, eerste lid][ref1], of over de ernst van de feiten en omstandigheden, bedoeld in
      [artikel 3, zesde lid][ref2].

      2 Voorzover het gaat om een overheidsopdracht binnen een sector die is aangewezen ingevolge
      [artikel 5, tweede lid][ref3], heeft het Bureau voorts tot taak aanbestedende diensten desgevraagd advies uit te
      brengen over:

      a. feiten en omstandigheden die grond kunnen opleveren voor de toepassing ten aanzien van een gegadigde of,
      voorzover het gaat om diens acceptatie als bedoeld in [artikel 5, derde lid, onderdeel c][ref4], een onderaannemer
      van:

      1°. artikel 29 van de [richtlijn nr. 92/50/EEG](31992L0050) van de Raad van de Europese Gemeenschappen van 18 juni
      1992, betreffende de coördinatie voor het plaatsen van overheidsopdrachten voor dienstverlening (Pb EG L 209/1),

      2°. artikel 20 van de [richtlijn nr. 93/36/EEG](31993L0036) van de Raad van de Europese Gemeenschappen van 14 juni
      1993, betreffende de coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor leveringen (Pb EG
      L 199/1), of

      3°. artikel 24 van de [richtlijn nr. 93/37/EEG](31993L0037) van de Raad van de Europese Gemeenschappen van 14 juni
      1993, betreffende de coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor de uitvoering van
      werken (Pb EG L 199/54);

      b. feiten en omstandigheden die grond kunnen opleveren voor de overeenkomstige toepassing ten aanzien van een
      gegadigde of, voorzover het gaat om diens acceptatie als bedoeld in [artikel 5, derde lid, onderdeel c][ref5],
      een onderaannemer van de in onderdeel a genoemde bepalingen, indien de [richtlijn nr. 93/38/EEG](31993L0038) van
      de Raad van de Europese Gemeenschappen van 14 juni 1993, betreffende de coördinatie van de procedures voor het
      plaatsen van overheidsopdrachten in de sectoren water- en energievoorziening, vervoer en telecommunicatie (Pb. EG L
      199/84) op de aanbesteding van toepassing is;

      c. de mogelijkheid dat een gegadigde of onderaannemer wordt gefinancierd met uit gepleegde strafbare feiten
      verkregen of te verkrijgen, op geld waardeerbare voordelen;

      d. de mate van gevaar dat een gegadigde, indien de overheidsopdracht aan hem zou worden gegund, of de onderaannemer
      bij de uitvoering van die opdracht strafbare feiten zal plegen.


