  - number: '7'
    text: |-
      1 Een gemeentelijke vergunning die op grond van een verordening verplicht is gesteld voor een inrichting of
      bedrijf, kan door het college van burgemeester en wethouders respectievelijk de burgemeester, voorzover het een
      krachtens het tweede lid aangewezen inrichting of bedrijf betreft, worden geweigerd dan wel ingetrokken in het
      geval en onder de voorwaarden, bedoeld in [artikel 3][ref1].

      2 Op voordracht van Onze Ministers worden bij algemene maatregel van bestuur inrichtingen of bedrijven aangewezen
      ten aanzien waarvan het wenselijk is dat, voordat een beslissing als bedoeld in het eerste lid wordt genomen, door
      het Bureau een advies kan worden uitgebracht. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.

      3 Voordat een beslissing als bedoeld in het eerste lid wordt genomen, kan het college van burgemeester en
      wethouders respectievelijk de burgemeester het Bureau om een advies vragen.

      4 Het eerste tot en met het derde lid is van overeenkomstige toepassing op een gemeentelijke ontheffing.


