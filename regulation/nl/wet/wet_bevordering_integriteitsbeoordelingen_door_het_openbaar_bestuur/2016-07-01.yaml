  - number: '13'
    text: |-
      1 Het Bureau kan ten behoeve van de uitvoering van de taak, bedoeld in [artikel 9][ref1], de terzake
      bevoegde autoriteiten in het buitenland verzoeken na te gaan of aldaar strafrechtelijke gegevens
      bekend zijn van personen tot wie het onderzoek naar feiten en omstandigheden als bedoeld in de
      [artikelen 3, tweede, derde en zesde lid][ref2], en 9, tweede en derde lid zich uitstrekt.

      2 Een verzoek als bedoeld in het eerste lid wordt uitsluitend door tussenkomst van de officier van justitie tot de
      bevoegde autoriteit gericht, met uitzondering van een verzoek dat is gebaseerd op het Kaderbesluit nr. 2009/315/
      JBZ van de Raad van de Europese Unie van 26 februari 2009 betreffende de organisatie en de inhoud van uitwisseling
      van gegevens uit het strafregister tussen de lidstaten (Pb EU L93/23), dat door tussenkomst van Onze Minister
      geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel9
