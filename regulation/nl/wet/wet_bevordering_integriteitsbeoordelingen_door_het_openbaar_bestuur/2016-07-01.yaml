  - number: '4'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 30, derde lid][ref1], wordt de weigering van de betrokkene,
      niet zijnde de natuurlijke persoon of rechtspersoon aan wie een overheidsopdracht is gegund, de onderaannemer
      of de natuurlijke persoon of rechtspersoon met wie een vastgoedtransactie is aangegaan, om een formulier
      als bedoeld in artikel 30, vijfde lid, volledig in te vullen, aangemerkt als ernstig gevaar als bedoeld in
      [artikel 3, eerste lid][ref2].

      2 Het eerste lid is van overeenkomstige toepassing, indien de betrokkene, niet zijnde de gegadigde, de natuurlijke
      persoon of rechtspersoon aan wie een overheidsopdracht is gegund, de onderaannemer of de natuurlijke persoon of
      rechtspersoon met wie een vastgoedtransactie is aangegaan, weigert aanvullende gegevens te verschaffen in het
      geval, bedoeld in [artikel 12, vierde lid][ref3].


