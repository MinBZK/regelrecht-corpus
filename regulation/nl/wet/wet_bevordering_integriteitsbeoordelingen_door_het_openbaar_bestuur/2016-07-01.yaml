  - number: '21'
    text: |-
      1 De algemene leiding, de organisatie en het beheer van het Bureau berusten bij Onze Minister.

      2 De dagelijkse leiding berust bij de directeur van het Bureau.

      3 De directeur van het Bureau rapporteert, gevraagd en ongevraagd, rechtstreeks aan Onze Minister al hetgeen van
      belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel21
  - number: '22'
    text: |-
      Benoeming, schorsing en ontslag van de directeur van het Bureau geschiedt bij koninklijk besluit op voordracht van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel22
  - number: '23'
    text: Onze Minister bepaalt het budget en de formatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister brengt jaarlijks voor 1 mei aan beide kamers der Staten-Generaal een openbaar verslag uit van de
      wijze waarop het Bureau zijn taken in het afgelopen kalenderjaar heeft verricht.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel24
  - number: '26'
    text: |-
      De officier van justitie die beschikt over gegevens die er op duiden dat een betrokkene in relatie staat tot
      strafbare feiten die reeds gepleegd zijn of, naar redelijkerwijs op grond van feiten of omstandigheden kan worden
      vermoed, gepleegd zullen worden, kan het bestuursorgaan of de rechtspersoon met een overheidstaak wijzen op de
      mogelijkheid het Bureau om een advies te vragen.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel26
  - number: '27'
    text: |-
      1 De volgende bestuursorganen verstrekken, voorzover het persoonsgegevens betreft voor de verwerking
      waarvan zij de verantwoordelijke zijn in de zin van de [Wet bescherming persoonsgegevens][ref1] dan wel de
      [Wet justitiële en strafvorderlijke gegevens][ref2] of de [Wet politiegegevens][ref3], het Bureau desgevraagd alle
      persoonsgegevens die noodzakelijk zijn voor de uitvoering van de taak, bedoeld in [artikel 9][ref4]:

      a. Onze Minister van Financiën, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:

      1°. de Belastingdienst FIOD-ECD;

      2°. de rijksbelastingdienst;

      b. Onze Minister, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:

      1°. de Justitiële informatiedienst;

      2°. het Meldpunt ongebruikelijke transacties en die ingevolge
      [artikel 14, derde lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref5] kunnen worden
      verstrekt;

      3°. het openbaar ministerie;

      4°. de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet controle op rechtspersonen][ref6];

      5°. de bestanden waarvan de gegevens worden verwerkt door de Immigratie- en naturalisatiedienst;

      c. Onze Minister van Economische Zaken, Landbouw en Innovatie, voorzover het bestanden betreft waarvan de gegevens
      worden verwerkt door de Nederlandse Voedsel- en Warenautoriteit;

      d. Onze Minister van Sociale Zaken en Werkgelegenheid, voor zover het bestanden betreft waarvan de gegevens worden
      verwerkt door de Inspectie SZW;

      e. Onze Minister van Infrastructuur en Milieu, voorzover het bestanden betreft waarvan de gegevens worden verwerkt
      door de VROM inlichtingen- en opsporingsdienst;

      f. de in [artikel 1, onderdeel f, van de Wet politiegegevens][ref7] bedoelde bestuursorganen, voorzover het een
      politieregister betreft;

      g. het college van burgemeester en wethouders van een gemeente, voor zover het de
      verwerking van gegevens betreft voor de uitvoering van de [Participatiewet][ref8], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref9] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref10];

      h. het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;

      i. op voordracht van Onze Minister, gedaan in overeenstemming met Onze Minister wie het mede aangaat, bij algemene
      maatregel van bestuur aangewezen bestuursorganen. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.

      2 De persoonsgegevens, bedoeld in het eerste lid, worden niet verstrekt indien:

      a. zij zijn opgenomen in een bij algemene maatregel van bestuur aangewezen bestand,

      b. een zwaarwegend belang van de verstrekkende dienst of instelling aan de verstrekking in de weg staat, of

      c. bij opsporingsgegevens naar het oordeel van de officier van justitie, in overleg met een daartoe door het
      College van Procureurs-Generaal aangewezen officier van justitie, een zwaarwegend strafvorderlijk belang aan de
      verstrekking in de weg staat.

      3 Indien persoonsgegevens niet worden verstrekt op grond van het tweede lid, onderdeel b of c, wordt de
      weigering die gegevens te verstrekken nader gemotiveerd door de verantwoordelijke, bedoeld in het eerste lid,
      onderscheidenlijk de officier van justitie.

      4 De gegevensverstrekking ingevolge het eerste lid geschiedt kosteloos, voorzover bij of krachtens de wet niet
      anders is bepaald.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gegeven over de termijn waarbinnen de verstrekking
      van gegevens dient plaats te vinden en kunnen regels worden gegeven over de wijze van verstrekken van gegevens door
      de bestuursorganen, bedoeld in het eerste lid.


