  - number: '8'
    text: Er is een Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel8
  - number: '9'
    text: |-
      1 Het Bureau heeft tot taak aan bestuursorganen, voorzover deze bij of krachtens de wet de bevoegdheid
      hebben gekregen het Bureau daartoe te verzoeken, desgevraagd advies uit te brengen over de mate van gevaar,
      bedoeld in [artikel 3, eerste lid][ref1], of over de ernst van de feiten en omstandigheden, bedoeld in
      [artikel 3, zesde lid][ref2].

      2 Voorzover het gaat om een overheidsopdracht binnen een sector die is aangewezen ingevolge
      [artikel 5, tweede lid][ref3], heeft het Bureau voorts tot taak rechtspersonen met een overheidstaak desgevraagd
      advies uit te brengen over:

      a. feiten en omstandigheden die grond kunnen opleveren voor de toepassing ten aanzien van een gegadigde of, voor
      zover het gaat om diens acceptatie als bedoeld in [artikel 5, derde lid, onderdeel c][ref4], een onderaannemer
      van artikel 57 van richtlijn 2014/24/EU van het Europees Parlement en de Raad van 26 februari 2014 betreffende het
      plaatsen van overheidsopdrachten en tot intrekking van Richtlijn 2004/18/EG (PbEU 2014, L 94);

      b. feiten en omstandigheden die grond kunnen opleveren voor de overeenkomstige toepassing ten aanzien van een
      gegadigde of, voorzover het gaat om diens acceptatie als bedoeld in [artikel 5, derde lid, onderdeel c][ref5], een
      onderaannemer van de in onderdeel a genoemde bepalingen, indien richtlijn 2014/25/EU van het Europees Parlement en
      de Raad van 26 februari 2014 betreffende het plaatsen van opdrachten in de sectoren water- en energievoorziening,
      vervoer en postdiensten en houdende intrekking van Richtlijn 2004/17/EG (PbEU 2014, L 94) op de aanbesteding van
      toepassing is;

      c. de mogelijkheid dat een gegadigde of onderaannemer wordt gefinancierd met uit gepleegde strafbare feiten
      verkregen of te verkrijgen, op geld waardeerbare voordelen;

      d. de mate van gevaar dat een gegadigde, indien de overheidsopdracht aan hem zou worden gegund, of de onderaannemer
      bij de uitvoering van die opdracht strafbare feiten zal plegen.

      3 Voor zover het gaat om een vastgoedtransactie, heeft het Bureau tot taak rechtspersonen met een overheidstaak
      desgevraagd advies uit te brengen over:

      a. de mate van gevaar dat de vastgoedtransactie mede zal worden gebruikt om uit gepleegde strafbare feiten
      verkregen of te verkrijgen, op geld waardeerbare voordelen te benutten,

      b. de mate van gevaar dat in of met de onroerende zaak waar de vastgoedtransactie betrekking op heeft, mede
      strafbare feiten zullen worden gepleegd, of

      c. de ernst van de feiten en omstandigheden die er op wijzen of redelijkerwijs doen vermoeden dat ter verkrijging
      van een vastgoedtransactie een strafbaar feit is gepleegd.

      4 [Artikel 3, tweede tot en met vijfde en achtste lid][ref6], is van overeenkomstige toepassing.


