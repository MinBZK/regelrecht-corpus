url: https://wetten.overheid.nl/BWBR0013798/2016-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat bestuursorganen over de mogelijkheid beschikken
    om bepaalde subsidies of vergunningen te weigeren of in te trekken indien er sprake is van gevaar dat strafbare
    feiten zullen worden gepleegd of van het vermoeden dat strafbare feiten zijn gepleegd, alsook om bepaalde
    overheidsopdrachten niet te gunnen of een overeenkomst terzake te ontbinden indien door bedrijven niet of niet
    meer wordt voldaan aan de vereisten inzake betrouwbaarheid, en dat bestuursorganen zich bij het nemen van die
    beslissingen daaromtrent kunnen laten adviseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. rechtspersoon met een overheidstaak: de Staat, een provincie, een gemeente, een waterschap, een
      openbaar lichaam als bedoeld in [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1],
      de politie, een openbaar lichaam voor beroep en bedrijf dan wel een ander openbaar lichaam als bedoeld in
      [artikel 134 van de Grondwet][ref2], of een zelfstandig bestuursorgaan als bedoeld in het tweede lid;

      b. advies: het advies, bedoeld in [artikel 9][ref3];

      c. beschikking: een beschikking terzake van een subsidie, alsmede een beschikking terzake van een vergunning,
      toekenning, goedkeuring, erkenning, registratie of ontheffing als bedoeld in:

      1°. [artikel 7][ref4];

      2°. de [artikelen 3][ref5] en [30a van de Drank- en Horecawet][ref6];

      3°. [artikel 6 van de Opiumwet][ref7];

      4°. [artikel 2.1, eerste lid][ref8] en [artikel 7.1, eerste lid, van de Wet wegvervoer goederen][ref9];

      5°. de [artikelen 4][ref10] en [82b, vijfde lid, van de Wet personenvervoer 2000][ref11];

      6°. [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref12], artikel
      2.1, eerste lid, aanhef en onder e, van die wet voor zover dat onderdeel betrekking heeft op een inrichting als
      bedoeld in [artikel 1.1, eerste lid, van die wet][ref13], en artikel 2.1, eerste lid, aanhef en onder i, van die
      wet voor zover dat onderdeel betrekking heeft op een activiteit waarvoor bij algemene maatregel van bestuur op
      grond van [artikel 2.17 van die wet][ref14] is bepaald dat de beschikking in het geval en onder de voorwaarden,
      bedoeld in [artikel 3][ref15], kan worden geweigerd;

      7°. [artikel 27 van de Woningwet][ref16];

      8°. [artikel 4.3, derde lid, onderdeel b, van de Telecommunicatiewet][ref17];

      9°.

      10°. de [artikelen 9.2.3.3][ref18] en [11A.2 van de Wet milieubeheer][ref19] voor zover die artikelen betrekking
      hebben op een handeling onderscheidenlijk werkzaamheid waarvoor bij algemene maatregel van bestuur op grond van
      artikel 9.2.3.3 onderscheidenlijk artikel 11A.2 van de Wet milieubeheer is bepaald dat de beschikking in het geval
      en onder de voorwaarden, bedoeld in [artikel 3][ref20], kan worden geweigerd, dan wel ingetrokken;

      11°. de [artikelen 30b][ref21] en [30h van de Wet op de kansspelen][ref22];

      12°. [artikel 3:1 van de Algemene douanewet][ref23], voor zover dat artikel betrekking heeft op een handeling
      onderscheidenlijk werkzaamheid waarvoor bij of krachtens algemene maatregel van bestuur op grond van artikel
      3:1 van de Algemene douanewet is bepaald dat de beschikking in het geval en onder de voorwaarden, bedoeld in
      [artikel 3][ref24], kan worden geweigerd, dan wel ingetrokken;

      13°. [artikel 14, eerste lid, van de Wet strategische diensten][ref25];

      14°. de [artikelen 8, eerste lid][ref26], [21][ref27] en [22 van de Huisvestingswet 2014][ref28];

      15°. [artikel 15 van de Meststoffenwet][ref29].

      d. bestand: elk gestructureerd geheel van persoonsgegevens als bedoeld in
      [artikel 1, onderdeel c, van de Wet bescherming persoonsgegevens][ref30];

      e. betrokkene: de aanvrager van een beschikking, de subsidie-ontvanger, de vergunninghouder, de gegadigde, de
      natuurlijke persoon of rechtspersoon aan wie een overheidsopdracht is of zal worden gegund, de onderaannemer, de
      natuurlijke persoon of rechtspersoon met wie een vastgoedtransactie is of zal worden aangegaan;

      f. Bureau: het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8][ref31];

      g. gegadigde: degene die zich heeft gemeld voor een aanbestedingsprocedure teneinde een aanbieding te doen, of
      heeft ingeschreven op een aanbestedingsprocedure dan wel in onderhandeling is getreden met een rechtspersoon met
      een overheidstaak;

      h. onderaannemer: een derde aan wie een deel van de overheidsopdracht in onderaanneming is of zal worden gegeven
      door degene aan wie de overheidsopdracht is of zal worden gegund;

      i. Onze Minister: Onze Minister van Veiligheid en Justitie;

      j. overheidsopdracht:

      1°. een opdracht die wordt verstrekt op basis van een schriftelijke overeenkomst onder bezwarende titel die is
      gesloten tussen enerzijds een aannemer, leverancier of dienstverlener en anderzijds een rechtspersoon met een
      overheidstaak, en die betrekking heeft op:

      a. de uitvoering dan wel het ontwerp alsmede de uitvoering van werken in het kader van beroepswerkzaamheden die
      zijn gebaseerd op de algemene systematische bedrijfsindeling, dan wel op het laten uitvoeren met welke middelen dan
      ook van een werk dat aan de door de rechtspersoon met een overheidstaak vastgestelde eisen voldoet,

      b. de aankoop, leasing, huur of huurkoop, met of zonder koopoptie, van producten, met dien verstande dat dit tevens
      de nodige werkzaamheden kan omvatten voor het aanbrengen en installeren van die producten bij de levering daarvan,
      of

      c. de uitvoering van diensten in de meest ruime zin;

      2°. het geheel van afspraken dat vastgelegd is in een schriftelijke overeenkomst tussen enerzijds een rechtspersoon
      met een overheidstaak en anderzijds een of meer private partijen, over de uitvoering van werken of diensten geheel
      of ten dele voor rekening en risico van een of meer van die private partijen;

      k. sector: een terrein van economische bedrijvigheid waarop overheidsopdrachten verstrekt kunnen worden;

      l. verwerking van persoonsgegevens: elke handeling of elk geheel van handelingen als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref32];

      m. burgerservicenummer: het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref33];

      o. vastgoedtransactie: een overeenkomst of een andere rechtshandeling met betrekking tot een onroerende zaak met
      als doel:

      1°. het verwerven of vervreemden van een recht op eigendom of het vestigen, vervreemden of wijzigen van een
      zakelijk recht;

      2°. huur of verhuur;

      3°. het verlenen van een gebruikrecht; of

      4°. de deelname aan een rechtspersoon, een commanditaire vennootschap of een vennootschap onder firma die het
      recht op eigendom of een zakelijk recht met betrekking tot die onroerende zaak heeft of die onroerende zaak huurt
      of verhuurt.

      2 Bij algemene maatregel van bestuur kunnen zelfstandige bestuursorganen worden aangewezen als rechtspersoon met
      een overheidstaak als bedoeld in artikel 1, eerste lid, onderdeel a.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


