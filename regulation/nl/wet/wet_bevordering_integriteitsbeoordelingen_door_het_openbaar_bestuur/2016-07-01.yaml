  - number: '10'
    text: |-
      Het Bureau heeft voorts tot taak bestuursorganen desgevraagd te informeren omtrent de in deze wet en in andere
      algemeen verbindende voorschriften neergelegde weigerings- en intrekkingsgronden inzake subsidies, vergunningen
      en ontheffingen.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel10
  - number: '11'
    text: |-
      Het Bureau kan indien daartoe aanleiding bestaat de officier van justitie, met het oog op diens bevoegdheid
      ingevolge [artikel 26][ref1], berichten over gegevens die het heeft verkregen in het kader van zijn taak.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel26
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 11a
    text: |-
      Het Bureau bericht een bestuursorgaan of een rechtspersoon met een overheidstaak desgevraagd in het geval waarin
      hij bevoegd is tot toepassing van deze wet over:

      a. het feit of over de betrokkene, in de afgelopen twee jaren, een advies is uitgebracht dan wel een adviesaanvraag
      in behandeling is genomen, en zo ja

      b. voor welke beschikking, aanbesteding of vastgoedtransactie het advies is uitgebracht dan wel de adviesaanvraag
      in behandeling is genomen, en

      c. indien advies is uitgebracht: de mate van gevaar zoals dat is opgenomen in het advies.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel11a
  - number: '12'
    text: |-
      1 Het Bureau verzamelt en analyseert persoonsgegevens uitsluitend ten behoeve van het advies.

      2 Het verzamelen van persoonsgegevens wordt beperkt tot:

      a. persoonsgegevens uit openbare registers,

      b. persoonsgegevens die overeenkomstig
      [artikel 8, aanhef en onderdeel e, van de Wet bescherming persoonsgegevens][ref1] zijn verkregen, en

      c. persoonsgegevens die op grond van de [artikelen 13][ref2], [27][ref3] of [27a][ref4] zijn verstrekt.

      3 Het Bureau kan bij het verzamelen van gegevens als bedoeld in het tweede lid, gebruik maken van het
      burgerservicenummer.

      4 In afwijking van het tweede lid kan het Bureau in het geval dat het door de betrokkene ingevulde formulier,
      bedoeld in [artikel 30][ref5], onvoldoende informatie verschaft voor het onderzoek ten behoeve van het advies, dan
      wel de gegevens die door middel van dat formulier en uit de verschillende bestanden of registraties zijn verkregen
      niet gelijkluidend zijn, de betrokkene verzoeken om nadere gegevens over:

      a. de vertegenwoordigingsbevoegdheid van degene die het formulier heeft ingevuld;

      b. de identiteit en vertegenwoordigingsbevoegdheid van personen die direct of indirect leiding geven;

      c. de identiteit van personen die direct of indirect zeggenschap uitoefenen;

      d. de identiteit van personen die direct of indirect vermogen verschaffen;

      e. de wijze van financiering.


