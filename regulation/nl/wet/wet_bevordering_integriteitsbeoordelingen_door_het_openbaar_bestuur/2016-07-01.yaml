  - number: 5a
    text: |-
      Een rechtspersoon met een overheidstaak kan het Bureau om een advies vragen over een natuurlijke persoon of
      rechtspersoon met wie een vastgoedtransactie wordt of is aangegaan:

      a. alvorens een beslissing wordt genomen over het aangaan van een vastgoedtransactie;

      b. in het geval dat bij een vastgoedtransactie is bedongen dat de overeenkomst kan worden opgeschort of
      ontbonden dan wel de rechtshandeling kan worden beëindigd indien zich één van de situaties, bedoeld in
      [artikel 9, derde lid][ref1], voordoet, alvorens zich op die opschortende of ontbindende voorwaarde te beroepen.


