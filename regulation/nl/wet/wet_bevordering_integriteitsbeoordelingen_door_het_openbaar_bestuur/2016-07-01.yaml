  - number: '45'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van de [Evaluatie- en uitbreidingswet Bibob][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en effecten van de Wet bevordering integriteitsbeoordelingen
      door het openbaar bestuur in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0033159
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0033159
  - number: '46'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel46
  - number: '47'
    text: 'Deze wet wordt aangehaald als: Wet bevordering integriteitsbeoordelingen door het openbaar bestuur.'
    url: https://wetten.overheid.nl/BWBR0013798/2016-07-01#Artikel47
