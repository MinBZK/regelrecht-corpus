      1 Een gemeentelijke vergunning die op grond van een verordening verplicht is gesteld voor een inrichting of
      bedrijf, kan door het college van burgemeester en wethouders respectievelijk de burgemeester worden geweigerd dan
      wel ingetrokken in het geval en onder de voorwaarden, bedoeld in [artikel 3][ref1].

      2 Voordat een beslissing als bedoeld in het eerste lid wordt genomen, kan het college van burgemeester en
      wethouders respectievelijk de burgemeester het Bureau om een advies vragen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een gemeentelijke ontheffing.


