  - number: 1.1.g
    text: |-
      gegadigde: degene die zich heeft gemeld voor een aanbestedingsprocedure teneinde een aanbieding te doen, of heeft
      ingeschreven op een aanbestedingsprocedure dan wel in onderhandeling is getreden met een aanbestedende dienst;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.h
    text: |-
      onderaannemer: een derde aan wie een deel van de overheidsopdracht in onderaanneming is of zal worden gegeven door
      degene aan wie de overheidsopdracht is of zal worden gegund;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.i
    text: 'Onze Ministers: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.j
    text: 'overheidsopdracht:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.j.1°
    text: |-
      een opdracht die wordt verstrekt op basis van een schriftelijke overeenkomst onder bezwarende titel die is gesloten
      tussen enerzijds een aannemer, leverancier of dienstverlener en anderzijds een aanbestedende dienst, en die
      betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.j.1°.a
    text: |-
      de uitvoering dan wel het ontwerp alsmede de uitvoering van werken in het kader van beroepswerkzaamheden die zijn
      gebaseerd op de algemene systematische bedrijfsindeling, dan wel op het laten uitvoeren met welke middelen dan ook
      van een werk dat aan de door de aanbestedende dienst vastgestelde eisen voldoet,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.j.1°.b
    text: |-
      de aankoop, leasing, huur of huurkoop, met of zonder koopoptie, van producten, met dien verstande dat dit tevens de
      nodige werkzaamheden kan omvatten voor het aanbrengen en installeren van die producten bij de levering daarvan, of
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.j.1°.c
    text: de uitvoering van diensten in de meest ruime zin;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.j.2°
    text: |-
      het geheel van afspraken dat vastgelegd is in een schriftelijke overeenkomst tussen enerzijds een aanbestedende
      dienst en anderzijds een of meer private partijen, over de uitvoering van werken of diensten geheel of ten dele
      voor rekening en risico van een of meer van die private partijen;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.k
    text: 'sector: een terrein van economische bedrijvigheid waarop overheidsopdrachten verstrekt kunnen worden;'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: 1.1.l
    text: |-
      verwerking van persoonsgegevens: elke handeling of elk geheel van handelingen als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '1.2'
    text: |-
      Op voordracht van Onze Ministers kunnen bij algemene maatregel van bestuur zelfstandige bestuursorganen worden
      aangewezen als aanbestedende dienst.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: '1.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel1
  - number: '2'
    text: |-
      Ten aanzien van een subsidie wordt in deze wet onder intrekking tevens begrepen de vaststelling van de subsidie op
      een lager bedrag dan bij de verlening is bepaald, alsmede de wijziging van de subsidieverstrekking ten nadele van
      de subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel2
  - number: '3.1'
    text: |-
      Voorzover bestuursorganen bij of krachtens de wet daartoe de bevoegdheid hebben gekregen, kunnen zij weigeren een
      aangevraagde beschikking te geven dan wel een gegeven beschikking intrekken, indien ernstig gevaar bestaat dat de
      beschikking mede zal worden gebruikt om:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.1.a
    text: uit gepleegde strafbare feiten verkregen of te verkrijgen, op geld waardeerbare voordelen te benutten, of
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.1.b
    text: strafbare feiten te plegen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: '3.2'
    text: |-
      Voorzover het ernstig gevaar als bedoeld in het eerste lid, aanhef en onderdeel a, betreft, wordt de mate van het
      gevaar vastgesteld op basis van:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.2.a
    text: |-
      feiten en omstandigheden die erop wijzen of redelijkerwijs doen vermoeden dat de betrokkene in relatie staat tot
      strafbare feiten als bedoeld in het eerste lid, onderdeel a,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.2.b
    text: ingeval van vermoeden de ernst daarvan,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.2.c
    text: de aard van de relatie en
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.2.d
    text: de grootte van de verkregen of te verkrijgen voordelen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: '3.3'
    text: |-
      Voorzover het ernstig gevaar als bedoeld in het eerste lid, aanhef en onderdeel b, betreft, wordt de mate van het
      gevaar vastgesteld op basis van:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.3.a
    text: |-
      feiten en omstandigheden die erop wijzen of redelijkerwijs doen vermoeden dat de betrokkene in relatie staat tot
      strafbare feiten die zijn gepleegd bij activiteiten die overeenkomen of samenhangen met activiteiten waarvoor de
      beschikking wordt aangevraagd dan wel is gegeven,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.3.b
    text: ingeval van vermoeden de ernst daarvan,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.3.c
    text: de aard van de relatie en
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.3.d
    text: het aantal van de gepleegde strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: '3.4'
    text: 'De betrokkene staat in relatie tot strafbare feiten als bedoeld in het tweede en derde lid, indien:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.4.a
    text: hij deze strafbare feiten zelf heeft begaan,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.4.b
    text: |-
      hij direct of indirect leiding geeft dan wel heeft gegeven aan, zeggenschap heeft dan wel heeft
      gehad over of vermogen verschaft dan wel heeft verschaft aan een rechtspersoon in de zin van
      [artikel 51 van het Wetboek van Strafrecht][ref1] die deze strafbare feiten heeft begaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: 3.4.c
    text: |-
      een ander deze strafbare feiten heeft gepleegd en deze persoon direct of indirect leiding geeft dan wel heeft
      gegeven aan, zeggenschap heeft dan wel heeft gehad over, vermogen verschaft dan wel heeft verschaft aan betrokkene,
      of in een zakelijk samenwerkingsverband tot hem staat.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: '3.5'
    text: 'De weigering dan wel intrekking, bedoeld in het eerste lid, vindt slechts plaats indien deze evenredig is met:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.5.a
    text: de mate van het gevaar en
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: 3.5.b
    text: voorzover het ernstig gevaar als bedoeld in het eerste lid, onderdeel b, betreft, de ernst van de strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: '3.6'
    text: |-
      Eenzelfde bevoegdheid tot weigering dan wel intrekking als bedoeld in het eerste lid hebben bestuursorganen, indien
      feiten en omstandigheden erop wijzen of redelijkerwijs doen vermoeden dat ter verkrijging van de aangevraagde
      dan wel gegeven beschikking een strafbaar feit is gepleegd. De weigering dan wel intrekking vindt slechts plaats,
      indien deze tenminste evenredig is met, ingeval van vermoedens, de ernst daarvan en met de ernst van het strafbare
      feit.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: '3.7'
    text: |-
      Voorzover uit het advies van het Bureau blijkt dat geen sprake is van ernstig gevaar als bedoeld in het eerste lid,
      kan het bestuursorgaan bij mindere mate van gevaar aan de beschikking voorschriften verbinden. Deze voorschriften
      zijn gericht op het wegnemen of beperken van dergelijk gevaar.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel3
  - number: '4.1'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 30, derde lid][ref1], wordt de weigering van de betrokkene, niet
      zijnde de partij aan wie een overheidsopdracht is gegund of de onderaannemer, om een formulier als bedoeld
      in [artikel 30, eerste lid][ref2], volledig in te vullen, aangemerkt als ernstig gevaar als bedoeld in
      [artikel 3, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien de betrokkene, niet zijnde de gegadigde, de partij aan
      wie een overheidsopdracht is gegund of de onderaannemer, weigert aanvullende gegevens te verschaffen in het geval,
      bedoeld in [artikel 12, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel12
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '5.1'
    text: |-
      Een gegadigde voor een overheidsopdracht waarop de richtlijnen, bedoeld in [artikel 9, tweede lid][ref1], niet van
      toepassing zijn en die wordt gegund binnen de krachtens het tweede lid aangewezen sector, kan van de gunning van
      die opdracht worden uitgesloten met inachtneming van de criteria voor de kwalitatieve selectie in de zin van de
      richtlijnen, bedoeld in [artikel 9, tweede lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '5.2'
    text: |-
      Op voordracht van Onze Ministers, gedaan in overeenstemming met Onze Ministers wie het mede aangaat, worden
      bij algemene maatregel van bestuur de sectoren aangewezen ten aanzien waarvan het wenselijk is dat, voordat een
      beslissing wordt genomen inzake de gunning van een overheidsopdracht of de ontbinding van een overeenkomst met de
      partij aan wie een overheidsopdracht is gegund, door het Bureau een advies kan worden uitgebracht. De voordracht
      voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel5
  - number: '5.3'
    text: 'De aanbestedende dienst kan het Bureau om een advies vragen:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel5
  - number: 5.3.a
    text: |-
      voordat een beslissing wordt genomen inzake de gunning van een overheidsopdracht die valt binnen een krachtens het
      tweede lid aangewezen sector;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel5
  - number: 5.3.b
    text: |-
      in het geval die dienst bij overeenkomst heeft bedongen dat de overeenkomst ontbonden wordt, indien zich een van de
      situaties, bedoeld in [artikel 9, tweede lid][ref1], voordoet en de bij overeenkomst verstrekte overheidsopdracht
      binnen een krachtens het tweede lid aangewezen sector valt, alvorens zich op die ontbindende voorwaarde te
      beroepen;


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 5.3.c
    text: |-
      ten aanzien van een onderaannemer, uitsluitend met het oog op diens acceptatie als zodanig, indien de aanbestedende
      dienst in het bestek als voorwaarde heeft gesteld dat onderaannemers niet zonder toestemming van die dienst worden
      gecontracteerd en in het kader van die voorwaarde zich het recht heeft voorbehouden aan het Bureau een advies te
      vragen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel5
  - number: '6.1'
    text: |-
      Een subsidie aan een rechtspersoon of aan een natuurlijke persoon kan worden geweigerd dan wel worden
      ingetrokken in het geval en onder de voorwaarden, bedoeld in [artikel 3][ref1], indien dit in de desbetreffende
      subsidieregeling is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '6.2'
    text: |-
      Voordat een beslissing als bedoeld in het eerste lid wordt genomen, kan het bestuursorgaan dat tot die beslissing
      bevoegd is, het Bureau om een advies vragen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel6
  - number: '6.3'
    text: |-
      Een subsidieregeling waarin is bepaald dat [artikel 3 van deze we][ref1]t van toepassing is en die niet bij wet of
      algemene maatregel van bestuur is geregeld, behoeft de goedkeuring van Onze Ministers, welke goedkeuring slechts
      kan worden onthouden wegens strijd met het recht of wegens onevenredigheid tussen enerzijds het belang dat moet
      worden gehecht aan de desbetreffende subsidie of subsidies en anderzijds de inbreuk op de persoonlijke levenssfeer
      ten gevolge van het aanvragen van een advies.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '7.1'
    text: |-
      Een gemeentelijke vergunning die op grond van een verordening verplicht is gesteld voor een inrichting, kan door
      het gemeentebestuur, voorzover het een krachtens het tweede lid aangewezen inrichting betreft, worden geweigerd dan
      wel ingetrokken in het geval en onder de voorwaarden, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '7.2'
    text: |-
      Op voordracht van Onze Ministers worden bij algemene maatregel van bestuur inrichtingen aangewezen ten aanzien
      waarvan het wenselijk is dat, voordat een beslissing als bedoeld in het eerste lid wordt genomen, door het Bureau
      een advies kan worden uitgebracht. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel7
  - number: '7.3'
    text: |-
      Voordat een beslissing als bedoeld in het eerste lid wordt genomen, kan het gemeentebestuur het Bureau om een
      advies vragen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel7
  - number: '8'
    text: Er is een Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel8
  - number: '9.1'
    text: |-
      Het Bureau heeft tot taak aan bestuursorganen, voorzover deze bij of krachtens de wet de bevoegdheid hebben
      gekregen het Bureau daartoe te verzoeken, desgevraagd advies uit te brengen over de mate van gevaar, bedoeld in
      artikel 3, eerste lid, of over de ernst van de feiten en omstandigheden, bedoeld in artikel 3, zesde lid.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: '9.2'
    text: |-
      Voorzover het gaat om een overheidsopdracht binnen een sector die is aangewezen ingevolge artikel 5, tweede lid,
      heeft het Bureau voorts tot taak aanbestedende diensten desgevraagd advies uit te brengen over:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: 9.2.a
    text: |-
      feiten en omstandigheden die grond kunnen opleveren voor de toepassing ten aanzien van een gegadigde of, voorzover
      het gaat om diens acceptatie als bedoeld in artikel 5, derde lid, onderdeel c, een onderaannemer van:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: 9.2.a.1°
    text: |-
      artikel 29 van de [richtlijn nr. 92/50/EEG](31992L0050) van de Raad van de Europese Gemeenschappen van 18 juni
      1992, betreffende de coördinatie voor het plaatsen van overheidsopdrachten voor dienstverlening (Pb EG L 209/1),
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: 9.2.a.2°
    text: |-
      artikel 20 van de [richtlijn nr. 93/36/EEG](31993L0036) van de Raad van de Europese Gemeenschappen van 14 juni
      1993, betreffende de coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor leveringen (Pb EG
      L 199/1), of
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: 9.2.a.3°
    text: |-
      artikel 24 van de [richtlijn nr. 93/37/EEG](31993L0037) van de Raad van de Europese Gemeenschappen van 14 juni
      1993, betreffende de coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor de uitvoering van
      werken (Pb EG L 199/54);
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: 9.2.b
    text: |-
      feiten en omstandigheden die grond kunnen opleveren voor de overeenkomstige toepassing ten aanzien van een
      gegadigde of, voorzover het gaat om diens acceptatie als bedoeld in artikel 5, derde lid, onderdeel c, een
      onderaannemer van de in onderdeel a genoemde bepalingen, indien de [richtlijn nr. 93/38/EEG](31993L0038) van de
      Raad van Europese Gemeenschappen van 14 juni 1993, betreffende de coördinatie van de procedures voor het plaatsen
      van overheidsopdrachten in de sectoren water- en energievoorziening, vervoer en telecommunicatie (Pb. EG L 199/84)
      op de aanbesteding van toepassing is;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: 9.2.c
    text: |-
      de mogelijkheid dat een gegadigde of onderaannemer wordt gefinancierd met uit gepleegde strafbare feiten verkregen
      of te verkrijgen, op geld waardeerbare voordelen;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: 9.2.d
    text: |-
      de mate van gevaar dat een gegadigde, indien de overheidsopdracht aan hem zou worden gegund, of de onderaannemer
      bij de uitvoering van die opdracht strafbare feiten zal plegen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel9
  - number: '10'
    text: |-
      Het Bureau heeft voorts tot taak bestuursorganen desgevraagd te informeren omtrent de in deze wet en in andere
      algemeen verbindende voorschriften neergelegde weigerings- en intrekkingsgronden inzake subsidies, vergunningen
      en ontheffingen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel10
  - number: '11'
    text: |-
      Het Bureau kan indien daartoe aanleiding bestaat de officier van justitie, met het oog op diens bevoegdheid
      ingevolge artikel 26, berichten over het advies, indien daarin wordt aangegeven dat er sprake is van ernstig
      gevaar als bedoeld in artikel 3, eerste lid, of feiten en omstandigheden als bedoeld in artikel 3, zesde lid,
      onderscheidenlijk dat er reden is tot toepassing of overeenkomstige toepassing van een bepaling als bedoeld in
      artikel 9, tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel11
  - number: '12.1'
    text: Het Bureau verzamelt en analyseert persoonsgegevens uitsluitend ten behoeve van het advies.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: '12.2'
    text: 'Het verzamelen van persoonsgegevens wordt beperkt tot:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: 12.2.a
    text: persoonsgegevens uit openbare registers,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: 12.2.b
    text: |-
      persoonsgegevens die overeenkomstig [artikel 8, aanhef en onderdeel e, van de Wet bescherming persoonsgegevens][ref1]
      zijn verkregen, en


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel8
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '8'
  - number: 12.2.c
    text: persoonsgegevens die op grond van artikel 13 of 27 zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: '12.3'
    text: |-
      In afwijking van het tweede lid kan het Bureau in het geval dat het door de betrokkene ingevulde formulier,
      bedoeld in artikel 30, onvoldoende informatie verschaft voor het onderzoek ten behoeve van het advies, dan wel de
      gegevens die door middel van dat formulier en uit de verschillende bestanden of registraties zijn verkregen niet
      gelijkluidend zijn, de betrokkene verzoeken om nadere gegevens over:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: 12.3.a
    text: de vertegenwoordigingsbevoegdheid van degene die het formulier heeft ingevuld;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: 12.3.b
    text: de identiteit en vertegenwoordigingsbevoegdheid van personen die direct of indirect leiding geven;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: 12.3.c
    text: de identiteit van personen die direct of indirect zeggenschap uitoefenen;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: 12.3.d
    text: de identiteit van personen die direct of indirect vermogen verschaffen;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: 12.3.e
    text: de wijze van financiering.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel12
  - number: '13.1'
    text: |-
      Het Bureau kan ten behoeve van de uitvoering van de taak, bedoeld in artikel 9, de terzake bevoegde autoriteiten
      in het buitenland verzoeken na te gaan of aldaar strafrechtelijke gegevens bekend zijn van personen tot wie het
      onderzoek naar feiten en omstandigheden als bedoeld in de artikelen 3, tweede, derde en zesde lid, en 9, tweede
      lid, zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel13
  - number: '13.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt uitsluitend door tussenkomst van de officier van justitie tot de
      bevoegde autoriteit gericht.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel13
  - number: '14.1'
    text: 'Het Bureau neemt in het advies geen gegevens op waarvan:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel14
  - number: 14.1.a
    text: |-
      de verstrekker heeft aangegeven dat deze, gelet op het karakter van die gegevens, niet aan de desbetreffende
      persoon ter kennis mogen worden gebracht, of
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel14
  - number: 14.1.b
    text: |-
      de officier van justitie, bedoeld in het tweede lid, heeft aangegeven dat deze niet mogen worden gebruikt in
      verband met een zwaarwegend strafvorderlijk belang.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister van Justitie wijst de officier van justitie aan, aan wie het advies, voordat dit wordt toegezonden
      aan het bestuursorgaan dat of de aanbestedende dienst die om advies hebben gevraagd, wordt voorgelegd met het oog
      op de beoordeling of daarin gegevens zijn opgenomen waarvan het gebruik een zwaarwegend strafvorderlijk belang
      schaadt.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel14
  - number: '15.1'
    text: |-
      Het advies wordt zo spoedig mogelijk gegeven, maar in ieder geval binnen een termijn van vier weken nadat het
      bestuursorgaan of de aanbestedende dienst een advies heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel15
  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde termijn wordt opgeschort met ingang van de dag waarop het bestuursorgaan of
      de aanbestedende dienst is verzocht om gegevens die bij de aanvraag ontbreken of om aanvullende gegevens die
      noodzakelijk zijn voor het advies, tot de dag waarop die gegevens zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel15
  - number: '15.3'
    text: |-
      Indien het advies niet binnen vier weken kan worden gegeven, stelt het Bureau het bestuursorgaan of de
      aanbestedende dienst daarvan in kennis en noemt hij daarbij een termijn waarbinnen het advies wel tegemoet kan
      worden gezien. Deze termijn bedraagt niet meer dan vier weken.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel15
  - number: '16.1'
    text: |-
      Het Bureau brengt een bijdrage in de kosten van het advies in rekening bij het bestuursorgaan dat of de
      aanbestedende dienst die het advies heeft gevraagd.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel16
  - number: '16.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, gegeven op voordracht van Onze Ministers, worden regels gegeven
      over de wijze waarop de in het eerste lid bedoelde bijdrage wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel16
  - number: '17'
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gegeven over de werkwijze van het Bureau, alsmede over
      de totstandkoming en inrichting van het advies.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel17
  - number: '18'
    text: |-
      Het Bureau registreert geen persoonsgegevens waarvan de verstrekker heeft aangegeven dat deze, gelet op het
      karakter van die gegevens, niet aan de desbetreffende persoon ter kennis mogen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel18
  - number: '19'
    text: |-
      Het Bureau kan persoonsgegevens die zijn verzameld of verkregen met het oog op de behandeling van een verzoek om
      advies, gedurende twee jaren verwerken in verband met een ander verzoek.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel19
  - number: '20.1'
    text: |-
      Voor zoveel nodig in afwijking van hetgeen in de [Wet openbaarheid van bestuur][ref1] en andere wetten is bepaald
      ten aanzien van verstrekking van gegevens, verstrekt het Bureau aan derden geen persoonsgegevens die het heeft
      verkregen in het kader van zijn taak, bedoeld in artikel 9.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '20.2'
    text: |-
      Onder derden als bedoeld in het eerste lid worden mede begrepen andere dienstonderdelen van het Ministerie van
      Justitie en andere overheidsdiensten en -instellingen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: '20.3'
    text: 'In afwijking van het eerste lid kunnen in de volgende gevallen persoonsgegevens worden verstrekt:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.a
    text: |-
      voorzover persoonsgegevens in het advies dienen te worden opgenomen in verband met de noodzakelijke motivering
      daarvan;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.b
    text: in de berichtgeving, bedoeld in artikel 11;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.c
    text: 'ten behoeve van de uitoefening van de controlerende of toezichthoudende bevoegdheid van:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.c.1°
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.c.2°
    text: de Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.c.3°
    text: de Registratiekamer;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.d
    text: 'indien toepassing wordt gegeven aan:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: 20.3.d.1°
    text: |-
      [artikel 125i][ref1] of [126a van het Wetboek van Strafvordering][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel125i
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126a
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 125i
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126a
  - number: 20.3.d.2°
    text: |-
      [artikel 17 van de Wet op de inlichtingen- en veiligheidsdiensten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004244#Artikel17
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004244
        artikel: '17'
  - number: 20.3.e
    text: |-
      desgevraagd, ten behoeve van wetenschappelijk onderzoek en statistiek, met dien verstande dat de resultaten daarvan
      geen persoonsgegevens mogen bevatten en voorzover de persoonlijke levenssfeer van de geregistreerde daardoor niet
      onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel20
  - number: '21.1'
    text: De algemene leiding, de organisatie en het beheer van het Bureau berusten bij Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel21
  - number: '21.2'
    text: De dagelijkse leiding berust bij de directeur van het Bureau.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel21
  - number: '21.3'
    text: |-
      De directeur van het Bureau rapporteert, gevraagd en ongevraagd, rechtstreeks aan Onze Minister van Justitie al
      hetgeen van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel21
  - number: '22'
    text: |-
      Benoeming, schorsing en ontslag van de directeur van het Bureau geschiedt bij koninklijk besluit op voordracht van
      Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel22
  - number: '23'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties het budget en de formatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel23
  - number: '24'
    text: |-
      Onze Ministers brengen jaarlijks voor 1 mei aan beide kamers der Staten-Generaal een openbaar verslag uit van de
      wijze waarop het Bureau zijn taken in het afgelopen kalenderjaar heeft verricht.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel24
  - number: '25.1'
    text: |-
      Er is een begeleidingscommissie, die geregeld overleg voert met de directeur van het Bureau over de wijze waarop
      het Bureau zijn taak vervult.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel25
  - number: '25.2'
    text: |-
      De leden van de begeleidingscommissie worden door Onze Ministers benoemd op zodanige wijze dat de in artikel 27,
      eerste lid, genoemde overheidsdiensten en -instellingen, alsmede de bestuursorganen en aanbestedende diensten zich
      in de commissie vertegenwoordigd kunnen weten.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel25
  - number: '25.3'
    text: |-
      Bij regeling van Onze Ministers worden regels gegeven over de wijze waarop en de frequentie waarmee de directeur
      overleg voert met de begeleidingscommissie.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel25
  - number: '26'
    text: |-
      De officier van justitie die beschikt over gegevens die er op duiden dat een betrokkene in relatie staat tot
      strafbare feiten die reeds gepleegd zijn of, naar redelijkerwijs op grond van feiten of omstandigheden kan worden
      vermoed, gepleegd zullen worden, kan het bestuursorgaan of de aanbestedende dienst wijzen op de wenselijkheid het
      Bureau om een advies te vragen.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel26
  - number: '27.1'
    text: |-
      De volgende bestuursorganen verstrekken, voorzover het persoonsgegevens betreft voor de verwerking
      waarvan zij de verantwoordelijke zijn in de zin van de [Wet bescherming persoonsgegevens][ref1] dan wel de
      [Wet justitiële gegevens][ref2] of de [Wet politieregisters][ref3], het Bureau desgevraagd alle persoonsgegevens
      die noodzakelijk zijn voor de uitvoering van de taak, bedoeld in artikel 9:


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0014194
      [ref3]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0014194
      - id: ref3
        bwb_id: BWBR0004798
  - number: 27.1.a
    text: 'Onze Minister van Financiën, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.a.1°
    text: de Belastingdienst FIOD-ECD;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.a.2°
    text: de rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.b
    text: 'Onze Minister van Justitie, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.b.1°
    text: de Centrale Justitiële Documentatie;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.b.2°
    text: de Immigratie- en Naturalisatiedienst;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.b.3°
    text: |-
      het Meldpunt Ongebruikelijke Transacties en die ingevolge
      [artikel 4, tweede lid, van de Wet melding ongebruikelijke transacties][ref1] kunnen worden verstrekt op grond van
      de [Wet politieregisters][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004798
  - number: 27.1.b.4°
    text: het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.b.5°
    text: het registratiesysteem Vennoot;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.c
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij, voorzover het bestanden betreft die worden bewerkt door de
      Algemene Inspectiedienst;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.d
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid, voorzover het bestanden betreft waarvan de gegevens worden
      verwerkt door de Inspectiedienst SZW;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.e
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, voorzover het bestanden betreft waarvan
      de gegevens worden verwerkt door de Dienst Recherchezaken;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.f
    text: |-
      de in [artikel 1, onderdeel f, van de Wet politieregisters][ref1] bedoelde bestuursorganen, voorzover het een
      politieregister betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '1'
  - number: 27.1.g
    text: |-
      het college van burgemeester en wethouders van een gemeente, voorzover het bestanden betreft waarvan de gegevens
      worden verwerkt door de gemeentelijke dienst die is belast met de uitvoering van de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: 27.1.h
    text: |-
      het Landelijk instituut sociale verzekeringen, voorzover het bestanden betreft waarvan de gegevens worden verwerkt
      door de uitvoeringsinstellingen sociale verzekeringen;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.1.i
    text: |-
      op voordracht van Onze Ministers, gedaan in overeenstemming met Onze Ministers wie het mede aangaat, bij algemene
      maatregel van bestuur aangewezen bestuursorganen. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: '27.2'
    text: 'De persoonsgegevens, bedoeld in het eerste lid, worden niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.2.a
    text: zij zijn opgenomen in een bij algemene maatregel van bestuur aangewezen bestand,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.2.b
    text: een zwaarwegend belang van de verstrekkende dienst of instelling aan de verstrekking in de weg staat, of
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: 27.2.c
    text: |-
      bij opsporingsgegevens naar het oordeel van de officier van justitie, in overleg met een daartoe door het
      College van Procureurs-Generaal aangewezen officier van justitie, een zwaarwegend strafvorderlijk belang aan de
      verstrekking in de weg staat.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: '27.3'
    text: |-
      Indien persoonsgegevens niet worden verstrekt op grond van het tweede lid, onderdeel b of c, wordt de weigering die
      gegevens te verstrekken nader gemotiveerd door de verantwoordelijke, bedoeld in het eerste lid, onderscheidenlijk
      de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: '27.4'
    text: |-
      De gegevensverstrekking ingevolge het eerste lid geschiedt kosteloos, voorzover bij of krachtens de wet niet anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: '27.5'
    text: |-
      Op voordracht van Onze Ministers worden bij of krachtens algemene maatregel van bestuur regels gegeven over de
      termijn waarbinnen de verstrekking van gegevens dient plaats te vinden en kunnen regels worden gegeven over de
      wijze van verstrekken van gegevens door de bestuursorganen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel27
  - number: '28.1'
    text: |-
      Een ieder die krachtens deze wet de beschikking krijgt over gegevens met betrekking tot een derde, is verplicht tot
      geheimhouding daarvan, behoudens voorzover een bij deze wet gegeven voorschrift mededelingen toelaat.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: '28.2'
    text: |-
      Het bestuursorgaan dat of de aanbestedende dienst die een advies ontvangt, geeft de daarin opgenomen gegevens niet
      door, behoudens aan:
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: 28.2.a
    text: |-
      de aanvrager, dan wel de subsidie-ontvanger of vergunninghouder, uitsluitend voorzover dit noodzakelijk is ter
      motivering van de door deze gevraagde beschikking, onderscheidenlijk van de beschikking tot intrekking van de
      subsidie of vergunning;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: 28.2.b
    text: |-
      de gegadigde of de partij aan wie een overheidsopdracht is gegund, uitsluitend voorzover dit noodzakelijk is
      ter motivering van de weigering van de gunning van de overheidsopdracht of van de toestemming als bedoeld in
      [artikel 5, derde lid, onderdeel c][ref1], onderscheidenlijk van de beslissing tot ontbinding van de overeenkomst
      inzake die overheidsopdracht;


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel5
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '5'
        hoofdstuk: '2'
  - number: 28.2.c
    text: |-
      de derde die in de motivering, bedoeld in de onderdelen a en b, wordt vermeld, uitsluitend voorzover de in die
      motivering opgenomen gegevens hem betreffen;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: 28.2.d
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: 28.2.e
    text: de Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: 28.2.f
    text: de Registratiekamer;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: 28.2.g
    text: de rechter.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: '28.3'
    text: |-
      Indien de betrokkene gebruik wenst te maken van de in [artikel 33, eerste, tweede en derde lid][ref1], bedoelde
      mogelijkheid om zijn zienswijze kenbaar te maken, wordt hem door het bestuursorgaan, onderscheidenlijk de
      aanbestedende dienst, de gelegenheid geboden het advies in te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel33
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '28.4'
    text: |-
      Indien de betrokkene een beschikking dan wel de intrekking van een subsidie of vergunning, onderscheidenlijk de
      weigering van een overheidsopdracht of de ontbinding van een overeenkomst inzake een dergelijke opdracht, in rechte
      aanvecht, is hij bevoegd de in het eerste lid bedoelde gegevens bekend te maken aan de rechter.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel28
  - number: '29'
    text: |-
      Het bestuursorgaan dat of de aanbestedende dienst die een advies ontvangt, kan dat advies gedurende twee jaren
      gebruiken in verband met een andere beslissing.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel29
  - number: '30.1'
    text: |-
      In de formulieren die dienen voor het aanvragen van een beschikking of die worden gebruikt in het kader van een
      aanbesteding, worden vragen opgenomen die erop gericht zijn het Bureau in staat te stellen het onderzoek naar
      feiten en omstandigheden als bedoeld in [artikel 3, tweede, derde en zesde lid][ref1], uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '30.2'
    text: 'De in het eerste lid bedoelde vragen omvatten in ieder geval die naar:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.a
    text: de naam, het adres en de woonplaats of plaats van vestiging van de aanvrager of gegadigde;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.b
    text: de naam, het adres en de woonplaats van de persoon die het formulier namens de aanvrager of gegadigde invult;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.c
    text: het nummer van inschrijving bij de Kamer van Koophandel en Fabrieken;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.d
    text: de rechtsvorm van de aanvrager of gegadigde;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.e
    text: de handelsnaam of handelsnamen waarvan de aanvrager of gegadigde gebruik maakt of heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.f
    text: 'de natuurlijke personen of rechtspersonen die, voorzover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.f.1°
    text: direct of indirect leiding geven of hebben gegeven aan betrokkene;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.f.2°
    text: direct of indirect zeggenschap hebben of hebben gehad over betrokkene;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.f.3°
    text: direct of indirect vermogen verschaffen of hebben verschaft aan betrokkene;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.f.4°
    text: onderaannemer van betrokkene zijn;
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: 30.2.g
    text: de wijze van financiering.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: '30.3'
    text: |-
      Het bestuursorgaan, onderscheidenlijk de aanbestedende dienst, verzoekt de betrokkene tevens om invulling van
      de in het eerste lid bedoelde formulieren, indien om advies wordt gevraagd met het oog op een beslissing terzake
      van de intrekking van een subsidie of vergunning, onderscheidenlijk de ontbinding van een overeenkomst inzake een
      overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel30
  - number: '31'
    text: |-
      Indien het bestuursorgaan een advies aanvraagt, wordt de wettelijke termijn waarbinnen de beschikking dient te
      worden gegeven, opgeschort voor de duur van de periode die begint met de dag waarop het advies is aangevraagd en
      eindigt met de dag waarop dat advies is ontvangen, met dien verstande dat deze opschorting niet langer duurt dan de
      in [artikel 15, eerste lid][ref1], bedoelde termijn, vermeerderd met de duur van de eenmalige verlenging, bedoeld
      in [artikel 15, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel15
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '32'
    text: |-
      Het bestuursorgaan, onderscheidenlijk de aanbestedende dienst, informeert de betrokkene dat het om advies heeft
      verzocht.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel32
  - number: '33.1'
    text: |-
      Voordat een bestuursorgaan een voor de betrokkene negatieve beslissing neemt op grond van ernstig gevaar
      als bedoeld in [artikel 3, eerste lid][ref1], dan wel op grond van feiten of omstandigheden als bedoeld in
      [artikel 3, zesde lid][ref2], stelt het de betrokkene in de gelegenheid zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '33.2'
    text: |-
      Indien een bestuursorgaan een beschikking geeft, is in elk geval de persoon die in de beschikking wordt genoemd tot
      een belanghebbende in de zin van [artikel 4:8 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '33.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de aanbestedende dienst die een besluit
      neemt terzake van de gunning van een overheidsopdracht, onderscheidenlijk inzake de toestemming, bedoeld
      in [artikel 5, derde lid, onderdeel c][ref1], of de ontbinding van de overeenkomst met de partij aan wie de
      overheidsopdracht is gegund.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel5
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '5'
        hoofdstuk: '2'
  - number: '33.4'
    text: |-
      Voor de toepassing van het eerste en derde lid zijn de
      [artikelen 4:9 tot en met 4:12 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '43'
    text: |-
      De bepalingen van de in [hoofdstuk 5][ref1] genoemde wetten, zoals zij luiden na de inwerkingtreding van deze wet,
      zijn niet van toepassing op de aanvraag van een beschikking die voor die datum is ingediend, onderscheidenlijk de
      aanbestedingsprocedure of onderhandeling waarmee voor die datum een aanvang is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013798
        hoofdstuk: '5'
  - number: '44.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen Onze Ministers tijdelijk van een of meer bij of krachtens deze wet
      gegeven voorschriften afwijken of een zodanige afwijking toestaan.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel44
  - number: '44.2'
    text: 'Indien toepassing wordt gegeven aan het eerste lid, worden in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel44
  - number: 44.2.a
    text: de wijze waarop tot een keuze voor een afwijking als bedoeld in het eerste lid, wordt gekomen,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel44
  - number: 44.2.b
    text: |-
      de voorschriften waarvan tijdelijk kan worden afgeweken, alsmede in welke zin van die voorschriften kan worden
      afgeweken,
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel44
  - number: 44.2.c
    text: de ten hoogste toegestane tijdsduur van een afwijking als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel44
  - number: 44.2.d
    text: |-
      de wijze waarop tot de vaststelling wordt gekomen of de tijdelijke afwijking als bedoeld in het eerste lid zodanig
      geslaagd is dat het wettelijk voorschrift waarvan tijdelijk is afgeweken, zou moeten worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel44
  - number: '45'
    text: |-
      Onze Ministers zenden binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel45
  - number: '46'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel46
  - number: '47'
    text: 'Deze wet wordt aangehaald als: Wet bevordering integriteitsbeoordelingen door het openbaar bestuur.'
    url: https://wetten.overheid.nl/BWBR0013798/2004-05-01#Artikel47
