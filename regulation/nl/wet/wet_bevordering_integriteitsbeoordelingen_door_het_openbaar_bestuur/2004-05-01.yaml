  - number: 1.1.f
    text: |-
      Bureau: het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
