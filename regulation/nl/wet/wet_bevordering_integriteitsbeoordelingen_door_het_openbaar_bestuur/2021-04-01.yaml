      1 Een gegadigde voor een overheidsopdracht waarop de richtlijnen, genoemd in [artikel 9, tweede lid][ref1], niet
      van toepassing zijn, kan van de gunning van die opdracht of van het sluiten van de met een gunningsbeslissing
      beoogde overeenkomst worden uitgesloten met inachtneming van de criteria voor de kwalitatieve selectie in de zin
      van de richtlijnen, bedoeld in artikel 9, tweede lid, onderdeel a en b.

      2 De rechtspersoon met een overheidstaak kan het Bureau om een advies vragen:

      a. voordat een beslissing wordt genomen inzake de gunning van een overheidsopdracht of het sluiten van de met een
      gunningsbeslissing beoogde overeenkomst;

      b. in het geval die rechtspersoon bij overeenkomst heeft bedongen dat de overeenkomst ontbonden wordt, indien
      zich een van de situaties, bedoeld in [artikel 9, tweede lid][ref2], voordoet, alvorens zich op die ontbindende
      voorwaarde te beroepen;

      c. ten aanzien van een onderaannemer, uitsluitend met het oog op diens acceptatie als zodanig, indien de
      rechtspersoon met een overheidstaak in het bestek als voorwaarde heeft gesteld dat onderaannemers niet zonder
      toestemming van die rechtspersoon worden gecontracteerd en in het kader van die voorwaarde zich het recht heeft
      voorbehouden aan het Bureau een advies te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
