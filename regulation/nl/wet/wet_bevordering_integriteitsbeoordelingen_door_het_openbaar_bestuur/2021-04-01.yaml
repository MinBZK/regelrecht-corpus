    text: |-
      1 Ten aanzien van een subsidie wordt in deze wet onder intrekking tevens begrepen de vaststelling van de subsidie
      op een lager bedrag dan bij de verlening is bepaald, alsmede de wijziging van de subsidieverstrekking ten nadele
      van de subsidie-ontvanger.

      2 Onder subsidie wordt in deze wet mede verstaan: de bekostiging van onderwijs en onderzoek.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel2
  - number: '3'
    text: |-
      1 Voorzover bestuursorganen bij of krachtens de wet daartoe de bevoegdheid hebben gekregen, kunnen zij weigeren een
      aangevraagde beschikking te geven dan wel een gegeven beschikking intrekken, indien ernstig gevaar bestaat dat de
      beschikking mede zal worden gebruikt om:

      a. uit gepleegde strafbare feiten verkregen of te verkrijgen, op geld waardeerbare voordelen te benutten, of

      b. strafbare feiten te plegen.

      2 Voorzover het ernstig gevaar als bedoeld in het eerste lid, aanhef en onderdeel a, betreft, wordt de mate van het
      gevaar vastgesteld op basis van:

      a. feiten en omstandigheden die erop wijzen of redelijkerwijs doen vermoeden dat de betrokkene in relatie staat tot
      strafbare feiten als bedoeld in het eerste lid, onderdeel a,

      b. ingeval van vermoeden de ernst daarvan,

      c. de aard van de relatie en

      d. de grootte van de verkregen of te verkrijgen voordelen.

      3 Voorzover het ernstig gevaar als bedoeld in het eerste lid, aanhef en onderdeel b, betreft, wordt de mate van het
      gevaar vastgesteld op basis van:

      a. feiten en omstandigheden die erop wijzen of redelijkerwijs doen vermoeden dat de betrokkene in relatie staat tot
      strafbare feiten die zijn gepleegd bij activiteiten die overeenkomen of samenhangen met activiteiten waarvoor de
      beschikking wordt aangevraagd dan wel is gegeven,

      b. ingeval van vermoeden de ernst daarvan,

      c. de aard van de relatie en

      d. het aantal van de gepleegde strafbare feiten.

      4 De betrokkene staat in relatie tot strafbare feiten als bedoeld in het tweede en derde lid, indien:

      a. hij deze strafbare feiten zelf heeft begaan,

      b. hij direct of indirect leiding geeft dan wel heeft gegeven aan, zeggenschap heeft dan wel
      heeft gehad over of vermogen verschaft dan wel heeft verschaft aan een rechtspersoon in de zin van
      [artikel 51 van het Wetboek van Strafrecht][ref1] die deze strafbare feiten heeft begaan, of

      c. een ander deze strafbare feiten heeft gepleegd en deze persoon direct of indirect leiding geeft dan wel heeft
      gegeven aan, zeggenschap heeft dan wel heeft gehad over, vermogen verschaft dan wel heeft verschaft aan betrokkene,
      of in een zakelijk samenwerkingsverband tot hem staat of heeft gestaan.

      5 De weigering dan wel intrekking, bedoeld in het eerste lid, vindt slechts plaats indien deze evenredig is met:

      a. de mate van het gevaar en

      b. voorzover het ernstig gevaar als bedoeld in het eerste lid, onderdeel b, betreft, de ernst van de strafbare
      feiten.

      6 Eenzelfde bevoegdheid tot weigering dan wel intrekking als bedoeld in het eerste lid hebben bestuursorganen,
      indien feiten en omstandigheden erop wijzen of redelijkerwijs doen vermoeden dat ter verkrijging of behoud van
      de aangevraagde dan wel gegeven beschikking een strafbaar feit is gepleegd. De weigering dan wel intrekking vindt
      slechts plaats, indien deze tenminste evenredig is met, ingeval van vermoedens, de ernst daarvan en met de ernst
      van het strafbare feit.

      7 Voorzover blijkt dat geen sprake is van ernstig gevaar als bedoeld in het eerste lid, kan het bestuursorgaan bij
      mindere mate van gevaar aan de beschikking voorschriften verbinden. Deze voorschriften zijn gericht op het wegnemen
      of beperken van dergelijk gevaar. Het bestuursorgaan heeft eenzelfde bevoegdheid indien sprake is van een ernstig
      gevaar waarbij de ernst van de strafbare feiten weigering of intrekking van de beschikking niet rechtvaardigt. Het
      bestuursorgaan kan een op grond van deze bepaling gegeven voorschrift wijzigen. Indien niet wordt voldaan aan een
      op grond van deze bepaling gegeven voorschrift, kan het bestuursorgaan de beschikking intrekken.

      8 In dit artikel wordt mede verstaan onder strafbaar feit een overtreding waarvoor een bestuurlijke boete kan
      worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
