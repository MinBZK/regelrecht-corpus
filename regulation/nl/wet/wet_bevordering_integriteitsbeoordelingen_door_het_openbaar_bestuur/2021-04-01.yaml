  - number: 3a
    text: |-
      1 Onder feiten en omstandigheden als bedoeld in [artikel 3, tweede lid, onder a, en derde lid, onder a][ref1], die
      erop wijzen dat de betrokkene in relatie staat tot strafbare feiten, wordt verstaan:

      a. een veroordeling wegens een strafbaar feit;

      b. een onherroepelijke strafbeschikking;

      c. het vervallen van het recht tot strafvordering op grond van een transactie als bedoeld in
      [artikel 74 van het Wetboek van Strafrecht][ref2];

      d. een onherroepelijke beschikking tot het opleggen van een bestuurlijke boete;

      e. een beschikking tot het opleggen van een bestuurlijke boete waartegen beroep is ingesteld, waarop de
      bestuursrechter in eerste aanleg uitspraak heeft gedaan.

      2 Wordt een strafbaar feit niet vervolgd of de vervolging niet voortgezet, dan staat dat niet in de weg aan
      het geheel of ten dele op grond van dat strafbare feit vaststellen van de mate van gevaar als bedoeld in
      [artikel 3, tweede en derde lid][ref3].

      3 In geval van een rechterlijke uitspraak houdende vrijspraak of ontslag van alle rechtsvervolging, wordt de mate
      van gevaar als bedoeld in [artikel 3, tweede en derde lid][ref4], niet op grond van dat strafbare feit vastgesteld.


