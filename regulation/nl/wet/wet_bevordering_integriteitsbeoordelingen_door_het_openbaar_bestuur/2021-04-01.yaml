  - number: '32'
    text: |-
      Het bestuursorgaan of de rechtspersoon met een overheidstaak informeert de betrokkene dat het Bureau om advies
      is verzocht.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel32
  - number: '33'
    text: |-
      1 Voordat een bestuursorgaan aan een beschikking voorschriften verbindt als bedoeld in
      [artikel 3, zevende lid][ref1], en voordat een bestuursorgaan een voor de betrokkene en de in de voorgenomen
      beschikking in verband met deze gronden genoemde derde negatieve beslissing neemt op grond van ernstig gevaar
      als bedoeld in [artikel 3, eerste lid][ref2], dan wel op grond van feiten of omstandigheden als bedoeld in
      [artikel 3, zesde lid][ref3], stelt het de betrokkene en de in de voorgenomen beschikking in verband met deze
      gronden genoemde derde in de gelegenheid zijn zienswijze naar voren te brengen.

      2 Het eerste lid is van overeenkomstige toepassing op de rechtspersoon met een overheidstaak die een beslissing
      neemt ter zake van:

      a. de gunning van een overheidsopdracht of het sluiten van de met een gunningsbeslissing beoogde overeenkomst;

      b. de toestemming, bedoeld in [artikel 5, tweede lid, onderdeel c][ref4];

      c. de ontbinding van de overeenkomst met de partij aan wie de overheidsopdracht is gegund;

      d. het aangaan van een vastgoedtransactie;

      e. de opschorting of ontbinding van de overeenkomst of de beëindiging van de rechtsbehandeling waarmee de
      vastgoedtransactie is aangegaan.

      3 Voor de toepassing van het eerste en tweede lid zijn de
      [artikelen 4:9 tot en met 4:12 van de Algemene wet bestuursrecht][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
