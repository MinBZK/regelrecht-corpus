  - number: '13'
    text: |-
      1 Voor de uitvoering van de taken, bedoeld in [artikel 9][ref1], kan het Bureau de bevoegde buitenlandse
      autoriteiten verzoeken na te gaan of aldaar gegevens bekend zijn over natuurlijke personen of rechtspersonen tot
      wie zijn onderzoek zich uitstrekt. Het verzoek kan betrekking hebben op:

      a. strafrechtelijke gegevens, en

      b. gegevens over een overtreding waarvoor een bestraffende sanctie als bedoeld in
      [artikel 5:2, eerste lid, onderdeel c, van de Algemene wet bestuursrecht][ref2] kan worden opgelegd.

      2 Een verzoek als bedoeld in het eerste lid, aanhef en onderdeel a, wordt uitsluitend door tussenkomst van de
      officier van justitie tot de bevoegde autoriteit gericht, met uitzondering van een verzoek dat is gebaseerd op
      het Kaderbesluit nr. 2009/315/JBZ van de Raad van de Europese Unie van 26 februari 2009 betreffende de organisatie
      en de inhoud van uitwisseling van gegevens uit het strafregister tussen de lidstaten (Pb EU L93/23), dat door
      tussenkomst van Onze Minister geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel52
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel13
