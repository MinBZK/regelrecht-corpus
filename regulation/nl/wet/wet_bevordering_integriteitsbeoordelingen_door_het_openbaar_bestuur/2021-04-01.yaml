  - number: '21'
    text: |-
      1 De algemene leiding, de organisatie en het beheer van het Bureau berusten bij Onze Minister.

      2 De dagelijkse leiding berust bij de directeur van het Bureau.

      3 De directeur van het Bureau rapporteert, gevraagd en ongevraagd, rechtstreeks aan Onze Minister al hetgeen van
      belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel21
  - number: '22'
    text: |-
      Benoeming, schorsing en ontslag van de directeur van het Bureau geschiedt bij koninklijk besluit op voordracht van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel22
  - number: '23'
    text: Onze Minister bepaalt het budget en de formatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister brengt jaarlijks voor 1 mei aan beide kamers der Staten-Generaal een openbaar verslag uit van de
      wijze waarop het Bureau zijn taken in het afgelopen kalenderjaar heeft verricht.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel24
  - number: '26'
    text: |-
      De officier van justitie die beschikt over gegevens die er op duiden dat een betrokkene in relatie staat tot
      strafbare feiten die reeds gepleegd zijn of, naar redelijkerwijs op grond van feiten of omstandigheden kan worden
      vermoed, gepleegd zullen worden, kan het bestuursorgaan of de rechtspersoon met een overheidstaak wijzen op de
      mogelijkheid om eigen onderzoek als bedoeld in [artikel 7a, eerste lid][ref1], te doen en daarna eventueel het
      Bureau om een advies te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel7a
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: 7a
        hoofdstuk: 2a
  - number: '27'
    text: |-
      1 De volgende bestuursorganen verstrekken het Bureau desgevraagd alle gegevens die noodzakelijk zijn voor de
      uitvoering van de taak, bedoeld in [artikel 9][ref1]:

      a. Onze Minister van Financiën, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:

      1°. de Belastingdienst FIOD-ECD;

      2°. de rijksbelastingdienst;

      b. Onze Minister, voorzover het bestanden betreft waarvan de gegevens worden verwerkt door:

      1°. de Justitiële informatiedienst;

      2°. het Meldpunt ongebruikelijke transacties en die ingevolge
      [artikel 14, derde lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] kunnen worden
      verstrekt;

      3°. het openbaar ministerie;

      4°. de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet controle op rechtspersonen][ref3];

      5°. de Immigratie- en naturalisatiedienst;

      c. Onze Minister van Landbouw, Natuur en Voedselkwaliteit, voorzover het bestanden betreft waarvan de gegevens
      worden verwerkt door de Nederlandse Voedsel- en Warenautoriteit;

      d. Onze Minister van Sociale Zaken en Werkgelegenheid, voor zover het bestanden betreft waarvan de gegevens worden
      verwerkt door de Inspectie SZW;

      e. Onze Minister van Infrastructuur en Waterstaat, voorzover het bestanden betreft waarvan de gegevens worden
      verwerkt door de Inspectie Leefomgeving en Transport;

      f. de in [artikel 1, onderdeel f, van de Wet politiegegevens][ref4] bedoelde bestuursorganen, voorzover het een
      politieregister betreft;

      g. het college van burgemeester en wethouders van een gemeente, voor zover het de
      verwerking van gegevens betreft voor de uitvoering van de [Participatiewet][ref5], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7];

      h. het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;

      i. op voordracht van Onze Minister, gedaan in overeenstemming met Onze Minister wie het mede aangaat, bij algemene
      maatregel van bestuur aangewezen bestuursorganen. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd;

      j. Onze Minister van Volksgezondheid, Welzijn en Sport, voor zover het bestanden betreft waarvan de gegevens worden
      verwerkt door de Inspectie gezondheidszorg en jeugd;

      k. de burgemeester van een gemeente of het college van burgemeester en wethouders van een gemeente, voor zover het
      gegevens betreft omtrent overtredingen waarvoor een bestuurlijke boete kan worden opgelegd;

      l. gedeputeerde staten van een provincie en de commissaris van de Koning van een provincie, voor zover het gegevens
      betreft omtrent overtredingen waarvoor een bestuurlijke boete kan worden opgelegd;

      m. de raad van bestuur van de kansspelautoriteit, bedoeld in [artikel 33a van de Wet op de kansspelen][ref8];

      n. de Autoriteit Consument en Markt, bedoeld in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref9].

      2 Het eerste lid is uitsluitend van toepassing op persoonsgegevens, voor zover het persoonsgegevens betreft voor de
      verwerking waarvan de in het eerste lid bedoelde bestuursorganen de verwerkingsverantwoordelijke zijn in de zin van
      artikel 4 van de Algemene verordening gegevensbescherming dan wel de verwerkingsverantwoordelijke zijn in de zin
      van de [Wet justitiële en strafvorderlijke gegevens][ref10] of de [Wet politiegegevens][ref11].

      3 De gegevens, bedoeld in het eerste lid, worden niet verstrekt indien:

      a. zij zijn opgenomen in een bij algemene maatregel van bestuur aangewezen bestand,

      b. een zwaarwegend belang van de verstrekkende dienst of instelling aan de verstrekking in de weg staat, of

      c. bij opsporingsgegevens naar het oordeel van de officier van justitie, in overleg met een daartoe door het
      College van Procureurs-Generaal aangewezen officier van justitie, een zwaarwegend strafvorderlijk belang aan de
      verstrekking in de weg staat.

      4 Indien persoonsgegevens niet worden verstrekt op grond van het derde lid, onderdeel b of c, wordt de weigering
      die gegevens te verstrekken nader gemotiveerd door het bestuursorgaan, bedoeld in het eerste lid, onderscheidenlijk
      de officier van justitie.

      5 De gegevensverstrekking ingevolge het eerste lid geschiedt kosteloos, voorzover bij of krachtens de wet niet
      anders is bepaald.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gegeven over de termijn waarbinnen de verstrekking
      van gegevens dient plaats te vinden en kunnen regels worden gegeven over de wijze van verstrekken van gegevens door
      de bestuursorganen, bedoeld in het eerste lid.


