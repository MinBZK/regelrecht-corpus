    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 7a, derde lid][ref1], wordt de weigering van de vergunninghouder of
      de subsidie-ontvanger om een formulier als bedoeld in artikel 7a, vijfde lid, volledig in te vullen, aangemerkt als
      ernstig gevaar als bedoeld in [artikel 3, eerste lid][ref2].

      2 Indien toepassing wordt gegeven aan [artikel 12, derde lid][ref3], wordt de weigering van de aanvrager van een
      beschikking, de subsidie-ontvanger of de vergunninghouder om aanvullende gegevens te verschaffen, aangemerkt als
      een ernstig gevaar als bedoeld in [artikel 3, eerste lid][ref4].


