preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat bestuursorganen over de mogelijkheid beschikken
    om bepaalde subsidies of vergunningen te weigeren of in te trekken indien er sprake is van gevaar dat strafbare
    feiten zullen worden gepleegd of van het vermoeden dat strafbare feiten zijn gepleegd, alsook om bepaalde
    overheidsopdrachten niet te gunnen of een overeenkomst terzake te ontbinden indien door bedrijven niet of niet
    meer wordt voldaan aan de vereisten inzake betrouwbaarheid, en dat bestuursorganen zich bij het nemen van die
    beslissingen daaromtrent kunnen laten adviseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *advies:* het advies, bedoeld in [artikel 9][ref1];
        - *beschikking:* een beschikking ter zake van een subsidie, alsmede een beschikking ter zake van een vergunning,
      toekenning, goedkeuring, erkenning, registratie, aanwijzing of ontheffing voor zover: 1°. bij de wet is bepaald dat
      de beschikking in het geval en onder de voorwaarden, bedoeld in [artikel 3][ref2], kan worden geweigerd, dan wel
      ingetrokken, of 2°. bij de wet is bepaald dat bij of krachtens algemene maatregel van bestuur kan worden bepaald
      dat de beschikking in het geval en onder de voorwaarden, bedoeld in [artikel 3][ref3], kan worden geweigerd, dan
      wel ingetrokken;
        - *betrokkene:* de aanvrager van een beschikking, de subsidie-ontvanger, de vergunninghouder, de gegadigde, de
      natuurlijke persoon of rechtspersoon aan wie een overheidsopdracht is of zal worden gegund, de onderaannemer, de
      natuurlijke persoon of rechtspersoon met wie een vastgoedtransactie is of zal worden aangegaan of met wie wordt
      onderhandeld over een dergelijke transactie, en de beoogd verkrijger van de erfpacht waarvoor toestemming is
      gevraagd als bedoeld in de begripsbepaling «vastgoedtransactie», onder 5°;
        - *Bureau:* het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8][ref4];
        - *gegadigde:* degene die zich heeft gemeld voor een aanbestedingsprocedure teneinde een aanbieding te doen, of
      heeft ingeschreven op een aanbestedingsprocedure dan wel in onderhandeling is getreden met een rechtspersoon met
      een overheidstaak;
        - *onderaannemer:* een derde aan wie een deel van de overheidsopdracht in onderaanneming is of zal worden gegeven
      door degene aan wie de overheidsopdracht is of zal worden gegund;
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *overheidsopdracht:* overheidsopdracht als bedoeld in [artikel 1.1 van de Aanbestedingswet 2012][ref5];
        - *rechtspersoon met een overheidstaak:* de Staat, een provincie, een gemeente, een waterschap, een
      openbaar lichaam als bedoeld in [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref6],
      de politie, een openbaar lichaam voor beroep en bedrijf dan wel een ander openbaar lichaam als bedoeld in
      [artikel 134 van de Grondwet][ref7], of een rechtspersoon met een overheidstaak als bedoeld in het tweede lid;
        - *vastgoedtransactie:* een overeenkomst of een andere rechtshandeling met betrekking tot een onroerende zaak met
      als doel: 1°. het verwerven of vervreemden van een recht op eigendom of het vestigen, vervreemden of wijzigen van
      een zakelijk recht; 2°. huur of verhuur; 3°. het verlenen van een gebruikrecht; 4°. de deelname, met inbegrip van
      de vergroting, vermindering of beëindiging daarvan, aan een rechtspersoon, een commanditaire vennootschap of een
      vennootschap onder firma die het recht op eigendom of een zakelijk recht met betrekking tot die onroerende zaak
      heeft of zal hebben of die onroerende zaak huurt, zal huren, verhuurt, of zal verhuren; of 5°. toestemming voor
      vervreemding van erfpacht als bedoeld in [artikel 91, eerste lid, van Boek 5 van het Burgerlijk Wetboek][ref8].

      2 Bij algemene maatregel van bestuur kunnen rechtspersonen met een overheidstaak worden aangewezen als
      rechtspersoon met een overheidstaak als bedoeld in artikel 1, eerste lid.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      4 In deze wet en de daarop berustende bepalingen wordt onder overheidsopdracht mede verstaan: een speciale-
      sectoropdracht als bedoeld in [artikel 1.1 van de Aanbestedingswet 2012][ref9].


