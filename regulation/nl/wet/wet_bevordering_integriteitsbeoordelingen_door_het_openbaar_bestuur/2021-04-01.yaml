        artikel: 5:2
  - number: '14'
    text: |-
      1 Het Bureau neemt in het advies geen gegevens op waarvan:

      a. de verstrekker heeft aangegeven dat deze, gelet op het karakter van die gegevens, niet aan de desbetreffende
      persoon ter kennis mogen worden gebracht, of

      b. de officier van justitie, bedoeld in het tweede lid, heeft aangegeven dat deze niet mogen worden gebruikt in
      verband met een zwaarwegend strafvorderlijk belang.

      2 Het College van Procureurs-Generaal wijst de officier van justitie aan, aan wie het advies, voordat dit wordt
      toegezonden aan het bestuursorgaan dat of de rechtspersoon met een overheidstaak die om advies hebben gevraagd,
      wordt voorgelegd met het oog op de beoordeling of daarin gegevens zijn opgenomen waarvan het gebruik een
      zwaarwegend strafvorderlijk belang schaadt.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel14
  - number: '15'
    text: |-
      1 Het advies wordt zo spoedig mogelijk gegeven, maar in ieder geval binnen een termijn van acht weken nadat het
      bestuursorgaan of de rechtspersoon met een overheidstaak een advies heeft aangevraagd.

      2 De in het eerste lid bedoelde termijn wordt opgeschort met ingang van de dag waarop het bestuursorgaan, de
      rechtspersoon met een overheidstaak of de betrokkene is verzocht om gegevens die bij de aanvraag ontbreken of om
      aanvullende gegevens die noodzakelijk zijn voor het advies, tot de dag waarop die gegevens zijn ontvangen.

      3 Indien het advies niet binnen acht weken kan worden gegeven, stelt het Bureau het bestuursorgaan of de
      rechtspersoon met een overheidstaak daarvan in kennis en noemt hij daarbij een termijn waarbinnen het advies wel
      tegemoet kan worden gezien. Deze termijn bedraagt niet meer dan vier weken.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel15
  - number: '16'
    text: |-
      1 Het Bureau brengt een bijdrage in de kosten van het advies in rekening bij het bestuursorgaan dat of de
      rechtspersoon met een overheidstaak die het advies heeft gevraagd.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gegeven over de wijze waarop de in het eerste lid
      bedoelde bijdrage wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel16
  - number: '17'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gegeven over de werkwijze van het Bureau, alsmede over de
      totstandkoming en inrichting van het advies.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel17
  - number: '18'
    text: |-
      Het Bureau registreert geen persoonsgegevens waarvan de verstrekker heeft aangegeven dat deze, gelet op het
      karakter van die gegevens, niet aan de desbetreffende persoon ter kennis mogen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel18
  - number: '19'
    text: |-
      Het Bureau kan persoonsgegevens die zijn verzameld of verkregen met het oog op de behandeling van een verzoek om
      advies, gedurende vijf jaren verwerken in verband met een ander verzoek.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel19
  - number: '20'
    text: |-
      1 Voor zoveel nodig in afwijking van hetgeen in de [Wet openbaarheid van bestuur][ref1] en andere wetten is bepaald
      ten aanzien van verstrekking van gegevens, verstrekt het Bureau aan derden geen persoonsgegevens die het heeft
      verkregen in het kader van zijn taak, bedoeld in [artikel 9][ref2].

      2 Onder derden als bedoeld in het eerste lid worden mede begrepen andere onder de Minister van Justitie en
      Veiligheid ressorterende dienstonderdelen en andere overheidsdiensten en -instellingen.

      3 In afwijking van het eerste lid kunnen in de volgende gevallen persoonsgegevens worden verstrekt:

      a. voorzover persoonsgegevens in het advies dienen te worden opgenomen in verband met de noodzakelijke motivering
      daarvan;

      b. in de berichtgeving, bedoeld in de [artikelen 11][ref3] of [11a][ref4];

      c. ten behoeve van de uitoefening van de controlerende of toezichthoudende bevoegdheid van:

      1°. de Algemene Rekenkamer;

      2°. de Nationale ombudsman;

      3°. de Autoriteit persoonsgegevens;

      d. indien toepassing wordt gegeven aan:

      1°. de artikelen in het [Wetboek van Strafvordering][ref5] betreffende het vorderen van gegevens,

      2°. [artikel 39 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref6];

      e. desgevraagd, ten behoeve van kwaliteitstoetsing, wetenschappelijk onderzoek en statistiek, met dien verstande
      dat de resultaten daarvan geen persoonsgegevens mogen bevatten en voorzover de persoonlijke levenssfeer van de
      geregistreerde daardoor niet onevenredig wordt geschaad;

      f. ten behoeve van rechterlijke procedures of bezwaarprocedures waarbij het Bureau partij is;

      g. aan een tot oplegging van een bestuurlijke boete bevoegd bestuursorgaan ten behoeve van het melden van een
      overtreding;

      h. aan een opsporingsambtenaar ten behoeve van het doen van aangifte van een begaan strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
