  - number: '29'
    text: |-
      Het bestuursorgaan dat of de rechtspersoon met een overheidstaak die een advies ontvangt, kan dat advies gedurende
      vijf jaren gebruiken in verband met een andere beslissing.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel29
  - number: '31'
    text: |-
      Indien het bestuursorgaan een advies aanvraagt, wordt de wettelijke termijn waarbinnen de beschikking dient te
      worden gegeven, opgeschort voor de duur van de periode die begint met de dag waarop het advies is aangevraagd en
      eindigt met de dag waarop dat advies is ontvangen, met dien verstande dat deze opschorting niet langer duurt dan de
      in [artikel 15, eerste en tweede lid][ref1], bedoelde termijn, vermeerderd met de duur van de eenmalige verlenging,
      bedoeld in [artikel 15, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel15
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel31
