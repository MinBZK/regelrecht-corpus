  - number: 27a
    text: |-
      Afschriften van rechterlijke uitspraken en processen-verbaal van de mondelinge uitspraak in bestuursrechtelijke
      zaken worden desgevraagd aan het Bureau verstrekt overeenkomstig de daarop van toepassing zijnde wettelijke
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel27a
  - number: '28'
    text: |-
      1 Een ieder die krachtens deze wet de beschikking krijgt over gegevens met betrekking tot een derde, is verplicht
      tot geheimhouding daarvan, behoudens voorzover een bij deze wet gegeven voorschrift mededelingen toelaat.

      2 Het bestuursorgaan dat of de rechtspersoon met een overheidstaak die een advies ontvangt, geeft de daarin
      opgenomen gegevens niet door, behoudens aan:

      a. de betrokkene, uitsluitend voorzover dit noodzakelijk is ter motivering van de naar aanleiding van het advies te
      nemen beslissing;

      b. de derde die in de motivering, bedoeld in de onderdeel a, wordt vermeld, uitsluitend voorzover de in die
      motivering opgenomen gegevens hem betreffen;

      c. leden van het overleg, bedoeld in [artikel 13 van de Politiewet 2012][ref1], voor zover noodzakelijk voor
      het ondersteunen van het bestuursorgaan of de rechtspersoon met een overheidstaak bij de motivering van de naar
      aanleiding van het advies te nemen beslissing;

      d. een andere deelnemer aan een regionaal samenwerkingsverband voor de aanpak van georganiseerde criminaliteit
      van bestuursorganen, de politie, het openbaar ministerie, de rijksbelastingdienst, de belastingdienst FIOD-ECD, de
      Sociale Inlichtingen- en Opsporingsdienst en de Koninklijke marechaussee, voorzover de gegevens noodzakelijk zijn
      voor het ondersteunen van het bestuursorgaan of de rechtspersoon met een overheidstaak bij het toepassen van deze
      wet;

      e. de adviescommissie, bedoeld in [artikel 7:13 van de Algemene wet bestuursrecht][ref2];

      f. degene die door Onze Minister is verzocht om een kwaliteitstoetsing ten aanzien van de adviezen van het Bureau
      te verrichten, of degene die wetenschappelijk onderzoek of statistische activiteiten verricht, met dien verstande
      dat de resultaten daarvan geen persoonsgegevens mogen bevatten en voor zover de persoonlijke levenssfeer van de
      betrokkene daardoor niet onevenredig wordt geschaad;

      g. de Algemene Rekenkamer;

      h. de Nationale Ombudsman;

      i. de Autoriteit persoonsgegevens;

      j. de rechter;

      k. de met opsporing belaste ambtenaren indien toepassing wordt gegeven aan de artikelen in het Wetboek van
      Strafvordering betreffende het vorderen van gegevens;

      l. de inlichtingen- en veiligheidsdiensten indien toepassing wordt gegeven aan
      [artikel 39 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref3].

      3 Bij de toepassing van [artikel 33, eerste en tweede lid][ref4], verstrekt het bestuursorgaan of de rechtspersoon
      met een overheidstaak de betrokkene of de in artikel 33, eerste lid, bedoelde derde een afschrift van het advies en
      wijst hem daarbij schriftelijk op zijn geheimhoudingsplicht op grond van het eerste lid. De in artikel 33, eerste
      lid, bedoelde derde wordt het advies slechts verstrekt voor zover het op hem betrekking heeft.

      4 Indien een beschikking dan wel de intrekking van een subsidie of vergunning, de weigering van een
      overheidsopdracht of een vastgoedtransactie dan wel de ontbinding van een overeenkomst inzake een dergelijke
      opdracht of transactie, in rechte wordt aangevochten, is betrokkene bevoegd de in het eerste lid bedoelde gegevens
      bekend te maken aan de rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel713
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel33
