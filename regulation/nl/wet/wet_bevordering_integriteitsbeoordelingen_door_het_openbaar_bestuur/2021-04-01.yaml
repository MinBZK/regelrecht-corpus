  - number: 7a
    text: |-
      1 Indien een bestuursorgaan of rechtspersoon met een overheidstaak bevoegd is om advies te vragen aan het Bureau,
      kan dat orgaan of die rechtspersoon tevens zelf onderzoek verrichten naar feiten en omstandigheden als bedoeld in
      [artikel 3, tweede tot en met zesde lid][ref1], en [artikel 9, tweede en derde lid][ref2].

      2 De betrokkene verschaft het bestuursorgaan of de rechtspersoon met een overheidstaak de gegevens en bescheiden om
      deze in staat te stellen tot het eigen onderzoek, bedoeld in het eerste lid. Deze gegevens en bescheiden omvatten
      in ieder geval:

      a. de naam, het adres en de woonplaats of plaats van vestiging van de betrokkene;

      b. de naam, het adres en de woonplaats van de persoon door wie de betrokkene zich laat vertegenwoordigen;

      c. het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref3], van de persoon, bedoeld in de
      onderdelen a en b;

      d. het nummer van inschrijving bij de Kamer van Koophandel;

      e. de rechtsvorm van de betrokkene;

      f. de handelsnaam of handelsnamen waarvan de betrokkene gebruikmaakt of heeft gemaakt;

      g. de naam, het adres en de woonplaats van de natuurlijke personen of rechtspersonen die, voor zover van
      toepassing:

      1°. direct of indirect leiding geven of hebben gegeven aan betrokkene;

      2°. direct of indirect zeggenschap hebben of hebben gehad over betrokkene;

      3°. direct of indirect vermogen verschaffen of hebben verschaft aan betrokkene;

      4°. onderaannemer van betrokkene zijn;

      h. de wijze van financiering.

      3 De betrokkene verschaft het bestuursorgaan of de rechtspersoon met een overheidstaak tevens de gegevens
      en bescheiden, indien onderzoek wordt gedaan met het oog op een beslissing ter zake van de intrekking van
      een beschikking, onderscheidenlijk de ontbinding van een overeenkomst inzake een overheidsopdracht dan
      wel de opschorting of ontbinding van een overeenkomst of de beëindiging van een rechtshandeling inzake een
      vastgoedtransactie.

      4 Teneinde het Bureau in staat te stellen onderzoek te verrichten als bedoeld in deze wet, zendt het bestuursorgaan
      dat of de rechtspersoon met een overheidstaak die het Bureau om advies verzoekt, de door de betrokkene verstrekte
      gegevens en bescheiden, tezamen met de bevindingen van het eigen onderzoek, toe aan het Bureau.

      5 Bij ministeriële regeling worden een of meer formulieren vastgesteld voor het verstrekken van de in het tweede en
      derde lid bedoelde gegevens en bescheiden alsmede voor de bevindingen van het eigen onderzoek.

      6 [Artikel 28, tweede lid][ref4], is van overeenkomstige toepassing op de door het bestuursorgaan of de
      rechtspersoon met een overheidstaak van de betrokkene op grond van het tweede of derde lid verkregen gegevens
      alsmede op de bevindingen van het eigen onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
