  - number: '10'
    text: |-
      Het Bureau heeft voorts tot taak bestuursorganen desgevraagd te informeren omtrent de in deze wet en in andere
      algemeen verbindende voorschriften neergelegde weigerings- en intrekkingsgronden inzake subsidies, vergunningen
      en ontheffingen.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel10
  - number: '11'
    text: |-
      Indien het Bureau beschikt over gegevens die erop duiden dat een betrokkene in relatie staat tot strafbare feiten
      die reeds gepleegd zijn of – naar redelijkerwijs op grond van feiten of omstandigheden kan worden vermoed –
      gepleegd zullen worden, kan het een bestuursorgaan of een rechtspersoon met een overheidstaak wijzen op de
      mogelijkheid om eigen onderzoek als bedoeld in [artikel 7a, eerste lid][ref1], te doen en eventueel daarna het
      Bureau om een advies te vragen. In dit artikel wordt mede verstaan onder strafbaar feit een overtreding waarvoor
      een bestuurlijke boete kan worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel7a
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: 7a
        hoofdstuk: 2a
  - number: 11a
    text: |-
      Het Bureau bericht een bestuursorgaan of een rechtspersoon met een overheidstaak desgevraagd in het geval waarin
      hij bevoegd is tot toepassing van deze wet over:

      a. het feit of over de betrokkene, in de afgelopen twee jaren, een advies is uitgebracht dan wel een adviesaanvraag
      in behandeling is genomen, en zo ja

      b. voor welke beschikking, overheidsopdracht of vastgoedtransactie het advies is uitgebracht dan wel de
      adviesaanvraag in behandeling is genomen, en

      c. indien advies is uitgebracht: de mate van gevaar zoals dat is opgenomen in het advies.
    url: https://wetten.overheid.nl/BWBR0013798/2021-04-01#Artikel11a
  - number: '12'
    text: |-
      1 Het Bureau verzamelt en analyseert persoonsgegevens uitsluitend ten behoeve van het advies.

      2 Het verzamelen van persoonsgegevens wordt beperkt tot:

      a. persoonsgegevens uit openbare bronnen,

      b. persoonsgegevens die rechtstreeks zijn te herleiden tot gegevens uit openbare bronnen,

      c. persoonsgegevens die zijn verstrekt op grond van de [artikelen 7a, vierde lid][ref1], [13][ref2], [27][ref3] of
      [27a][ref4], en

      d. persoonsgegevens die zijn verkregen overeenkomstig artikel 6, eerste lid, aanhef en onder e, van de Algemene
      verordening gegevensbescherming.

      3 In afwijking van het tweede lid kan het Bureau in het geval dat het door de betrokkene ingevulde formulier,
      bedoeld in [artikel 7a][ref5], onvoldoende informatie verschaft voor het onderzoek ten behoeve van het advies, dan
      wel de gegevens die door middel van dat formulier en uit de verschillende bestanden of registraties zijn verkregen
      niet gelijkluidend zijn, de betrokkene verzoeken om nadere gegevens over:

      a. de vertegenwoordigingsbevoegdheid van degene die het formulier heeft ingevuld;

      b. de identiteit en vertegenwoordigingsbevoegdheid van personen die direct of indirect leiding geven;

      c. de identiteit van personen die direct of indirect zeggenschap uitoefenen;

      d. de identiteit van personen die direct of indirect vermogen verschaffen;

      e. de wijze van financiering;

      f. feiten en omstandigheden die van belang zijn om te beoordelen tot welke personen de betrokkene in een zakelijk
      samenwerkingsverband staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel27a
      [ref5]: https://wetten.overheid.nl/BWBR0013798#Artikel7a
