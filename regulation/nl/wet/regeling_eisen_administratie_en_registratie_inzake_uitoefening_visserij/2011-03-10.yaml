  - number: '30'
    text: |-
      1 Alle niet verwerkte of aan boord verwerkte vis die op Nederlands grondgebied wordt aan- of ingevoerd en die
      naar een andere plaats dan de plaats van aan- of invoer wordt vervoerd, moet totdat de eerste verkoop heeft
      plaatsgevonden, worden vergezeld door:

      a. een door de vervoerder opgesteld vervoersdocument dat de gegevens bevat, bedoeld in artikel 68, vijfde lid, van
      verordening nr. 1224/2009, of

      b. een kopie van het volledig en naar waarheid ingevulde logboek-, tevens vangstopgaveformulier, bedoeld in
      [artikel 15][ref1].

      2 In afwijking van het eerste lid moeten alle hoeveelheden schol van meer dan 500 kilogram en alle hoeveelheden
      tong van meer dan 300 kilogram die op Nederlands grondgebied wordt aan- of ingevoerd en die naar een andere
      plaats dan de plaats van aan- of invoer worden vervoerd, vergezeld gaan van een kopie van het logboek- tevens
      vangstopgaveformulier als bedoeld in [artikel 15][ref2].

      3 Het eerste lid is niet van toepassing ingeval voor aanvang van het begin van het vervoer elektronisch de gegevens
      opgenomen in het vervoersdocument, bedoeld in het eerste lid, onderdeel a, aan de AID heeft toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel15
