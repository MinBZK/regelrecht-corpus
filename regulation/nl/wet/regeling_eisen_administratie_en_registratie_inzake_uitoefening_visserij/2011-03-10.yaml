  - number: '31'
    text: |-
      Indien vis, die in een andere lidstaat van de Europese Gemeenschap dan Nederland wordt aangeland, voor het eerst
      op de markt wordt gebracht op Nederlands grondgebied, overhandigt de vervoerder van de vis binnen 48 uur na het
      tijdstip van aanlanding een kopie van het vervoersdocument aan een ambtenaar van de AID of deponeert de vervoerder
      deze in een vangstopgavebus.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel31
  - number: '32'
    text: |-
      In afwijking van [artikel 31][ref1] wordt elke hoeveelheid kabeljauw die is gevangen in de gebieden,
      bedoeld in artikel 3 van verordening nr. 1342/2008, en elke hoeveelheid van meer dan 50 kg heek die is
      gevangen in de gebieden, bedoeld in artikel 1 van [verordening nr. 811/2004](32004R0811), die wordt vervoerd
      naar een andere plaats dan de plaats van aanlanding of invoer, vergezeld van de documenten, genoemd in
      [artikel 29, tweede lid, onderdeel a][ref2], en [artikel 30, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020043#Artikel29
