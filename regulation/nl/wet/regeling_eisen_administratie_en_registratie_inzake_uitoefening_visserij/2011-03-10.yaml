  - number: '15'
    text: |-
      1 Degene die met een vissersvaartuig de visserij uitoefent is verplicht het logboek-, tevens vangstopgaveformulier,
      overeenkomstig het bepaalde inzake het invullen en opnemen van gegevens in [verordening nr. 2807/83](31983R2807)
      alsmede in [bijlage 2][ref1], bij te houden en in te vullen.

      2 In aanvulling op het eerste lid is degene die met een vissersvaartuig met een lengte over alles van minder dan 10
      meter de visserij uitoefent, verplicht alle vangsten van elke soort die aan boord worden gehouden in het logboek-,
      tevens vangstopgaveformulier te vermelden.

      3 Degene die met een vissersvaartuig of buitenlands vissersvaartuig de visserij uitoefent, vult dagelijks vóór
      24.00 uur en uiterlijk bij aankomst in een haven, alsmede bij controle op zee het logboekgedeelte van het originele
      exemplaar van het logboek-, tevens vangstopgaveformulier in.

      4 Degene die met een vissersvaartuig met een lengte over alles van meer dan 10 meter meer dan 50 kg van een
      bepaalde vissoort aanlandt, vult deze hoeveelheid in op het vangstopgavegedeelte van het logboek-, tevens
      vangstopgaveformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0020043
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020043
  - number: '16'
    text: |-
      Degene die met een vissersvaartuig een visreis maakt van meer dan 15 dagen is verplicht uiterlijk op de vijftiende
      dag en, voor zolang de visreis duurt, om de 15 dagen, op de wijze als bedoeld in bijlage VIII van [verordening
      nr. 2807/83](31983R2807), de gegevens, bedoeld in die bijlage, te melden aan de AID ter attentie van het Visserij
      Controle Centrum (postbus 234, 6460 AE Kerkrade, telefax (31) 455461011).
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel16
  - number: '17'
    text: |-
      Indien meer dan 10 ton haring, makreel, horsmakreel of een combinatie daarvan aan boord wordt gehouden van een
      vissersvaartuig of buitenlands vissersvaartuig, komt de opgave in het logboekgedeelte van het logboek-, tevens
      vangstopgaveformulier, van de hoeveelheden aan boord gehouden vis, overeen met de hoeveelheden die zijn opgegeven
      ingevolge [artikel 3, vijfde lid, onderdeel 9°, van de Regeling stelselmatige controle bij aanlanding 1988][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel3
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '3'
  - number: '18'
    text: |-
      1 In afwijking van artikel 5, tweede lid, van [verordening nr. 2807/83](31983R2807), geldt een tolerantiemarge
      van 8%, indien het betreft visreizen gemaakt door vissersvaartuigen of buitenlandse vissersvaartuigen in de
      geografische gebieden:

      a. bedoeld in artikel 3 van verordening nr. 1342/2008, en het vaartuigen betreft met een lengte over alles van van
      ten minste 10 meter;

      b. bedoeld in artikel 1 van [verordening nr. 811/2004](32004R0811);

      c. bedoeld in artikel 2 van [verordening (EG) nr. 2115/2005](32005R2115) van de Raad van de Europese Unie van 20
      december 2005 tot vaststelling van een herstelplan voor zwarte heilbot in het kader van de visserijorganisatie in
      het noordwestelijk deel van de Atlantische Oceaan (PbEU L 430), voor zover aldaar gevangen zwarte heilbot aan boord
      wordt gehouden.

      2 In afwijking van artikel 5, tweede lid, van verordening nr. 2807/83 geldt een tolerantiemarge van 10%, indien
      het betreft visreizen gemaakt door vissersvaartuigen of buitenlandse vissersvaartuigen in de geografische gebieden,
      bedoeld in artikel 1 van de verordening inzake weegprocedures, voor zover meer dan 10 ton haring, makreel of
      horsmakreel aan boord wordt gehouden.

      3 De tolerantiemarge van 8%, bedoeld in het eerste lid, is eveneens van toepassing op ramingen per soort van
      hoeveelheden schol en tong, uitgedrukt in kilogram levend gewicht, aan boord van vaartuigen die in de Noordzee
      hebben gevaren.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel18
  - number: '19'
    text: |-
      1 Degene die met een vissersvaartuig in een Nederlandse haven vis aanlandt, is verplicht:

      a. onverwijld, maar uiterlijk een half uur na aanlanding en vóór de lossing, de eerste kopie van het logboek-,
      tevens vangstopgaveformulier waarop de in [artikel 15, derde lid][ref1], bedoelde gegevens zijn ingevuld, in te
      dienen, en

      b. terstond na verkoop, maar uiterlijk 48 uur na afloop van de lossing, het volledig ingevulde originele exemplaar
      van het logboek-, tevens vangstopgaveformulier, in te dienen.

      2 Het indienen van de exemplaren van het logboek-, tevens vangstopgaveformulier, bedoeld in het eerste lid, vindt
      plaats door het in de haven van aanlanding:

      a. te overhandigen aan een functionaris of aan een ambtenaar van de AID, of

      b. te deponeren in een vangstopgavebus.

      3 Indien de vis in een andere haven dan de haven van aanlanding wordt verkocht, is in afwijking van het eerste
      lid, onderdeel b, en de aanhef van het tweede lid, degene die met een vissersvaartuig vis in een Nederlandse haven
      heeft aangeland, verplicht terstond na verkoop, maar uiterlijk binnen 48 uur na afloop van de lossing, het volledig
      ingevulde originele exemplaar van het logboek-, tevens vangstopgaveformulier, in de haven van verkoop in te dienen
      of te doen indienen door een daartoe door hem gemachtigde.

      4 De exemplaren van het logboek-, tevens vangstopgaveformulier, bedoeld in het eerste en derde lid:

      a. vermelden de vangsthoeveelheden per sector en uitgedrukt in kilogrammen;

      b. hebben betrekking op de periode sinds de vorige aanlanding, voor zover doorgebracht op zee, en

      c. zijn ondertekend door degene die met een vissersvaartuig in een Nederlandse haven vis aanlandt of, in de
      situatie, bedoeld in het derde lid, diens gemachtigde.

      5 Degene die met een vissersvaartuig vis aanlandt op een andere plaats dan de havens, bedoeld in
      [artikel 2, eerste lid, van de Regeling stelselmatige controle bij aanlanding 1988][ref2], waar geen
      vangstopgavebus is geplaatst, is verplicht het originele exemplaar van het logboek-, tevens vangstopgaveformulier
      terstond na verkoop van de vis, maar uiterlijk binnen 48 uur na lossing, in te dienen door middel van toezending
      aan het dichtstbijzijnde havenkantoor van de AID dan wel aan het havenkantoor van de AID in de plaats waar de vis
      wordt verkocht.

      6 Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op degene die:

      a. vis heeft overgeladen op een ander vaartuig;

      b. met zijn vissersvaartuig de visserij in span uitoefent en geen vis aanlandt.

      7 In afwijking van het eerste, tweede en vierde lid geeft een kapitein of diens vertegenwoordiger van een
      vissersvaartuig met een lengte over alles van 12 meter of meer en die op grond van [artikel 19a, tweede lid][ref3],
      verplicht is de gegevens opgenomen in de logboek-, tevens vangstopgaveformulier, elektronisch in te dienen, de
      gegevens, bedoeld in artikel 21 en artikel 23 van verordening nr. 1224/2009 binnen 24 uur nadat de aanlanding is
      voltooid elektronisch door aan de AID.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004267#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020043#Artikel19a
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel19
