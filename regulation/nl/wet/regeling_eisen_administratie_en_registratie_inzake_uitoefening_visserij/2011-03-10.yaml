  - number: '29'
    text: |-
      1 Indien de op Nederlands grondgebied aangevoerde vis voor de eerste keer via bemiddeling van een visafslag
      op de markt wordt gebracht, is de betreffende visafslag verplicht binnen 48 uur na de verkoop een elektronisch
      verkoopdocument aan te leveren aan de AID, overeenkomstig het model opgenomen in [bijlage 3][ref1].

      2 Het is verboden de op Nederlands grondgebied aangevoerde vis, die voor de eerste keer anders dan via bemiddeling
      van een visafslag op de markt wordt gebracht, in ontvangst te nemen en te vervoeren voordat de koper, in het geval
      dat de vis is verkocht, of de houder in de overige gevallen, heeft overhandigd aan een ambtenaar van de AID of
      heeft gedeponeerd in een vangstopgavebus, hetzij:

      a. een verkoopdocument, wanneer de vis is verkocht op de plaats van aanlanding;

      b. een kopie van de in [artikel 30][ref2] genoemde documenten, wanneer de vis te koop wordt aangeboden op een
      andere plaats dan de plaats van aanlanding, alsmede na de verkoop een verkoopdocument, of

      c. een overnameverklaring als bedoeld in het vijfde lid, wanneer de vis niet te koop wordt aangeboden of bestemd is
      om later te koop te worden aangeboden.

      3 De in het tweede lid bedoelde documenten worden binnen 48 uur na het voor het eerst op de markt brengen of de
      aanlanding overhandigd aan een ambtenaar van de AID of worden gedeponeerd in een vangstopgavebus, door:

      a. de koper, indien het verkoopdocumenten betreft, of

      b. de houder, indien het een van de andere in het tweede lid bedoelde documenten betreft.

      4 Het verkoopdocument, bedoeld in het eerste en het tweede lid, bevat de gegevens, bedoeld in artikel 64, eerste
      lid, van verordening nr. 1224/2009 en de inhoud van het verkoopdocument stemt overeen met de factuur of als zodanig
      dienstdoend document als bedoeld in de artikelen 218 en 219 van Richtlijn (EG) 2006/112 van de Raad van de Europese
      Gemeenschappen van 28 november 2006 betreffende het gemeenschappelijke stelsel van belasting over de toegevoegde
      waarde.

      5 De door de eigenaar van de aangevoerde vis of diens gemachtigde opgestelde overnameverklaring, bedoeld in het
      tweede lid, bevat ten minste de gegevens, bedoeld in artikel 66, derde lid, van verordening nr. 1224/2009.

      6 Indien vis die overeenkomstig het eerste of tweede lid als verkocht is opgegeven, naar een andere plaats dan de
      plaats van aanlanding of van invoer wordt vervoerd, is de vervoerder verplicht op elk moment, op verzoek van een
      met controle belaste ambtenaar, te bewijzen dat die vis daadwerkelijk is verkocht.

      7 Indien voor een bepaalde vissoort een minimumvismaat is vastgesteld op grond van artikel 4 van [verordening
      nr. 2371/2002](32002R2371), is elke ondernemer die verantwoordelijk is voor de verkoop, de opslag of het vervoer
      van partijen vis van een ondermaatse vissoort, verplicht op elk moment, op verzoek van een met controle belaste
      ambtenaar, het geografische oorspronggebied of de herkomst uit aquacultuur te bewijzen.

      8 De visafslag, respectievelijk de koper of houder, is in het geval, bedoeld in het eerste lid, respectievelijk
      het tweede lid, en voor zover het vis betreft als bedoeld in [artikel 33][ref3], verplicht een document als bedoeld
      in artikel 13 van de verordening inzake weegprocedures, binnen 48 uur na weging van de vis te overleggen aan een
      ambtenaar van de AID.

      9 Het is verboden in strijd te handelen met artikel 62, vijfde lid, van verordening nr. 1224/2009.

      10 Het verbod, bedoeld in het tweede lid, onderdeel a, is niet van toepassing ingeval van verkoop van
      visserijproducten van niet meer dan 30 kilogram die nadien niet op de markt worden gebracht maar uitsluitend voor
      particuliere consumptie worden gebruikt.

      11 In afwijking van het derde lid wordt een overnameverklaring als bedoeld in het tweede lid, onderdeel c, in
      het geval, bedoeld in artikel 66, eerste lid, van verordening nr. 1224/2009 binnen 24 uur na voltooiing van de
      aanlanding overhandigd aan een ambtenaar van de AID of gedeponeerd in een vangstopgavebus door de houder van het
      overnamedocument.


      [ref1]: https://wetten.overheid.nl/BWBR0020043
      [ref2]: https://wetten.overheid.nl/BWBR0020043#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0020043#Artikel33
