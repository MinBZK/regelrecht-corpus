      1 Het is verboden in strijd te handelen met artikel 12, eerste en tweede lid, artikel 14, eerste en tweede lid, en
      artikel 22, vijfde lid, van verordening nr. 1005/2008.

      2 Indien de invoer betrekking heeft op visserijproducten van de soorten, genoemd in artikel 2, onderdeel a, van
      verordening nr. 620/2010, artikel 3, onderdeel b en c, van verordening nr. 1984/2003 of artikel 3, onderdeel a, van
      verordening nr. 1035/2001, wordt voor de toepassing van het eerste lid gebruik gemaakt van:

      a. het vangstcertificaat, bedoeld in artikel 3, tweede lid, van verordening nr. 620/2010, dat overeenkomstig
      artikel 4 van die verordening is afgegeven, ingevuld en gewaarmerkt,

      b. het statistisch document, bedoeld in artikel 4 van verordening nr. 1984/2003, dat overeenkomstig dat artikel is
      afgegeven, ingevuld en gewaarmerkt, onderscheidenlijk

      c. het vangstdocument, bedoeld in artikel 3, onderdeel b, van verordening nr. 1035/2001, dat overeenkomstig die
      verordening is afgegeven, ingevuld en gewaarmerkt.

      3 In aanvulling op het eerste lid is de invoer van visserijproducten als bedoeld in artikel 2, achtste lid, van
      verordening nr. 1005/2008, verboden indien de invoer van die producten is geweigerd op grond van artikel 18, eerste
      en tweede lid, van die verordening.

      4 Indien de vrijgave en het in de handel brengen van visserijproducten op grond van artikel 17, zevende lid, van
      verordening nr. 1005/2008 is opgeschort, komen de kosten voor de opslag van die producten gedurende de periode,
      bedoeld in artikel 17, vijfde lid, van die verordening ten laste van de marktdeelnemer.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel34a
  - number: 34aa
    text: |-
      1 Indien het betreft visserijproducten van de soorten, genoemd in artikel 2, onderdeel a, van verordening nr.
      620/2010, is het verboden in strijd te handelen met de artikelen 3, tweede en tiende lid, en 4, eerste lid, van die
      verordening, voor zover deze artikelen betrekking hebben op aanlanden, overladen of intern verhandelen.

      2 Voor zover het betreft visserijproducten van de soorten, genoemd in artikel 3, onderdeel a, van verordening nr.
      1035/2001, is het verboden in strijd te handelen met de artikelen 8, 9 10, 11 en 12 van die verordening.

      3 De minister is de bevoegde autoriteit, bedoeld in artikel 4, tweede lid, van verordening nr. 620/2010.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel34aa
  - number: 34b
    text: |-
      1 Het vangstcertificaat, bedoeld in de artikelen 12 en 14, eerste lid, onderdeel a, en tweede lid, onderdeel c,
      onder i, van verordening nr. 1005/2008, het vangstdocument, bedoeld in artikel 13, eerste lid, van die verordening,
      het bewijs, bedoeld in artikel 14, eerste lid, onderdeel b, van die verordening, de verklaring, bedoeld in
      artikel 14, tweede lid, van die verordening, en de kopie van het vangstcertificaat, bedoeld in de artikelen 14,
      tweede lid, onderdeel c, onder ii, van die verordening worden overeenkomstig artikel 16, eerste lid, van die
      verordening of overeenkomstig artikel 8 van verordening nr. 1010/2009 ingeval de desbetreffende visserijproducten
      met de in dit artikel bedoelde vervoermiddelen wordt getransporteerd, ingediend bij de minister.

      2 De minister is de bevoegde instantie, bedoeld in artikel 4, derde lid, van verordening nr. 1984/2003.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel34b
  - number: 34c
    text: |-
      1 In afwijking van [artikel 34b][ref1] kunnen erkende marktdeelnemers als bedoeld in artikel 16, tweede lid, van
      verordening nr. 1005/2008, handelen overeenkomstig dat lid.

      2 Marktdeelnemers dienen een verzoek in tot erkenning bij de minister overeenkomstig artikel 14 van verordening
      nr. 1010/2009.

      3 De minister verleent de erkenning, bedoeld in het tweede lid, slechts indien de marktdeelnemer voldoet aan
      artikel 16, derde lid, onderdelen a tot en met g, van verordening nr. 1005/2008 en de artikelen 9 tot en met 13 van
      verordening nr. 1010/2009.

      4 De minister schorst de erkenning, bedoeld in het tweede lid, indien zich één van de in de artikelen 22 tot en met
      26 van verordening nr. 1010/2009 bedoelde gevallen voordoet.

      5 De minister trekt de erkenning in indien zich één van de in artikel 27 van verordening nr. 1010/2009 bedoelde
      gevallen voordoet.

      6 Het aantal invoeroperaties, bedoeld in artikel 16, derde lid, onderdeel b, van verordening nr. 1005/2008,
      bedraagt 50.


