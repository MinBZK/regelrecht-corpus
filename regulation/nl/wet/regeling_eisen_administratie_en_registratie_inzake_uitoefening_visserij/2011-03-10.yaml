  - number: 34e
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 21, eerste lid, van verordening nr. 1005/2008, 3, tweede
      lid, van verordening nr. 620/2010, voor zover dit artikel betrekking heeft op wederuitvoer, 6, tweede lid, van
      laatstgenoemde verordening, 6, eerste, vierde en zesde lid en 7 van verordening nr. 1984/2003 en 19, eerste lid,
      van verordening nr. 1035/2001.

      2 De minister is de bevoegde autoriteit, bedoeld in de artikel 7, eerste lid, van verordening nr. 620/2010, 6,
      tweede en vierde lid, van verordening nr. 1984/2003 en 19, eerste lid, van verordening nr. 1035/2001.

      3 De uitvoerder van producten, bedoeld in artikel 21, eerste lid, van verordening nr. 1005/2008, dient het verzoek
      tot invulling van het vangstcertificaat of een kopie van het vangstcertificaat, bedoeld in dat artikellid, in bij
      de minister.

      4 De uitvoerder van visserijproducten van de soorten, genoemd in artikel 2, onderdeel a, van verordening nr.
      620/2010, artikel 3, onderdeel b en c, van verordening nr. 1984/2003 of artikel 3, onderdeel a, van verordening nr.
      1035/2001, dient het verzoek tot waarmerking van het wederuitvoercertificaat, bedoeld in artikel 6, tweede lid, van
      verordening nr. 620/2010, artikel 6, tweede en vierde lid, van verordening nr. 1984/2003 onderscheidenlijk van het
      vangstdocument, bedoeld in artikel 19, eerste lid, van verordening nr. 1035/2001 in bij de minister.

      5 De in het vierde lid bedoelde verzoeken gaan vergezeld van de documenten, bedoeld in artikel 6, tweede lid, van
      verordening nr. 620/2010, artikel 6, tweede lid, van verordening nr. 1984/2003 onderscheidenlijk artikel 19, eerste
      lid, van verordening nr. 1035/2001.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel34e
  - number: 34f
    text: |-
      1 Ter uitvoering van artikel 15, eerste lid, van verordening nr. 1005/2008 wordt medewerking gevorderd van het
      Productschap Vis.

      2 De in het eerste lid bedoelde medewerking bestaat uit het overeenkomstig artikel 12, vierde lid, van verordening
      nr. 1005/2008 valideren van vangstcertificaten voor zover deze certificaten betrekking hebben op de vangst van
      garnalen of van platvis.

      3 In afwijking van [artikel 34d, derde lid][ref1], wordt het in dat lid bedoelde verzoek tot validatie, voor zover
      het betrekking heeft op de in het tweede lid van dit artikel bedoelde vissoorten, ingediend bij het Productschap
      Vis.


