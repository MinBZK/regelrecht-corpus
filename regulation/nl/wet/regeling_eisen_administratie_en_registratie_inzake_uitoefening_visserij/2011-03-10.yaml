        artikel: '29'
        paragraaf: '5'
  - number: '26'
    text: |-
      De aanvoerder van vis vermeldt in zijn administratie, bedoeld in [artikel 25, eerste lid][ref1], de volgende
      gegevens:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. per hoeveelheid, registratienummer en nationaliteit van het vaartuig waarmee de vis is gevangen of aangevoerd;

      d. de datum van de aanvoer van de vis;

      e. het vangstgebied van de vangst per deelgebied of sector;

      f. de plaats van opslag, in het geval de vis door hem wordt opgeslagen;

      g. de naam van de koper, in het geval de vis zonder bemiddeling van een veiling wordt verkocht;

      h. de naam van de bemiddelaar, in het geval de vis via de bemiddeling van een veiling ter verkoop wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel25
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '25'
        paragraaf: '5'
  - number: '27'
    text: |-
      1 Degene die in de uitoefening van een beroep of bedrijf vis afneemt, vermeldt in zijn administratie, bedoeld in
      [artikel 25, eerste lid][ref1], de volgende gegevens:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. de naam van de aanvoerders en de registratienummers en nationaliteit van de vaartuigen waarmee de vis is
      gevangen of aangevoerd;

      d. de datum van de aanvoer van de vis;

      e. het vangstgebied van de vangst per deelgebied of sector.

      2 Het eerste lid is niet van toepassing voor zover in de uitoefening van een beroep of bedrijf, in een voor het
      publiek toegankelijke ruimte uitsluitend aan particulieren vis te koop wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel25
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel27
    references:
