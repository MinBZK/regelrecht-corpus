  - number: 34d
    text: |-
      1 Het is verboden in strijd te handelen met de artikelen 15, eerste lid, van verordening nr. 1005/2008, 5, eerste
      en vijfde lid, van verordening nr. 1984/2003 en 18, eerste lid, van verordening nr. 1035/2001.

      2 De minister is de overheidsinstantie, bedoeld in artikel 12, vierde lid, van verordening nr. 1005/2008, en de
      bevoegde autoriteit, bedoeld in de artikelen 5, tweede lid, van verordening nr. 1984/2003 en 18, eerste lid, van
      verordening nr. 1035/2001.

      3 De uitvoerder van vangsten van een vissersvaartuig dient het verzoek tot validatie, bedoeld in de artikelen 15,
      eerste lid, van verordening nr. 1005/2008, 5, tweede lid, van verordening nr. 1984/2003 en 18, eerste lid, van
      verordening nr. 1035/2001, in bij de minister.
