    text: |-
      De ondernemer bewaart een kopie van alle door of namens hem ingevulde logboeken, tevens vangstopgaveformulieren,
      gedurende een periode van drie jaar vanaf 1 januari van het jaar dat volgt op het jaar waarin een formulier is
      ingediend.
