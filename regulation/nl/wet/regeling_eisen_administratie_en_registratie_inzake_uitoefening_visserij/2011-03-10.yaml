    text: |-
      1 Het is verboden in strijd te handelen met artikel 59, tweede lid, van verordening nr. 1224/2009.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing ingeval van verkoop van visserijproducten van niet
      meer dan 30 kilogram die nadien niet op de markt worden gebracht maar uitsluitend voor particuliere consumptie
      worden gebruikt.

      3 Het Productschap Vis registreert de kopers van visserijproducten van een vaartuig bij eerste verkoop, bedoeld in
      artikel 59, tweede lid, van verordening nr. 1224/2009.

      4 Het Productschap Vis stelt de lijst, bedoeld in artikel 2, eerste lid, van verordening nr. 1077/2008, op en
      publiceert deze op haar website tezamen met de lijst van geregistreerde kopers als bedoeld in het tweede lid.

      5 Het Productschap Vis neemt de aanwijzingen van de Minister in acht bij de uitvoering van het bepaalde in het
      tweede en derde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel29a
  - number: 29b
    text: |-
      In afwijking van [artikel 29, tweede en derde lid][ref1], geven kopers en visafslagen als bedoeld in artikel
      2, eerste lid, van verordening nr. 1077/2008 de verkoopdocumenten en overnameverklaringen, bedoeld in
      [artikel 29, eerste en tweede lid][ref2], elektronisch door aan de AID, met gebruikmaking van een door de Minister
      beschikbaar te stellen formaat.


