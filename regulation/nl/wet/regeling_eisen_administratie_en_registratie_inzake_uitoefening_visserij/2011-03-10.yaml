      1 Het is verboden in strijd te handelen met artikel 23.1 van bijlage IIc van verordening nr. 43/2009 van 16
      januari 2009 van de Raad van de Europese Unie tot vaststelling, voor 2009, van de vangstmogelijkheden voor sommige
      visbestanden en groepen visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap,
      in andere wateren met vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de visserij in acht te
      nemen voorschriften.

      2 Het wegen van tong als bedoeld in artikel 23.1 van bijlage IIc van verordening nr. 43/2009 van 16 januari 2009
      van de Raad van de Europese Unie tot vaststelling, voor 2009, van de vangstmogelijkheden voor sommige visbestanden
      en groepen visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere
      wateren met vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen
      voorschriften wordt gedaan met apparatuur die ten genoegen van de Minister is goedgekeurd, geijkt en verzegeld.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel33b
