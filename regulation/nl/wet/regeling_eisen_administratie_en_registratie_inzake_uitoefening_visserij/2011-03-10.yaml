  - number: 19b
    text: |-
      1 Het is verboden uit te varen indien het elektronisch registratie- en meldsysteem door technisch falen of een
      niet-functioneren niet functioneert.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing ingeval de AID toestemming heeft verleend om uit
      te varen.

      3 De AID verleent slechts toestemming als bedoeld in het tweede lid, nadat is aangetoond dat het elektronisch
      registratie- en meldsysteem weer functioneert.

      4 In geval het niet mogelijk is door een technisch falen of het niet functioneren van het elektronisch registratie-
      en meldsysteem om de logboek-, tevens vangstopgaveformulieren elektronisch door te geven aan de AID, deelt de
      kapitein of de reder van het vaartuig, of diens vertegenwoordiger, de gegevens uit het logboek, uit de aangifte van
      aanlanding en uit de aangifte van overlading dagelijks en niet later dan 24.00 uur schriftelijk of telefonisch aan
      de AID mee.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel19b
  - number: 19c
    text: |-
      In de gebieden, bedoeld in onderdeel 4.2 van bijlage IIa van de verordening inzake vangstmogelijkheden, is het
      verboden te handelen in strijd met artikel 28, eerste lid, van verordening nr. 1224/2009 voor zover het betreft
      vissersvaartuigen als bedoeld in onderdeel 4.2 van die bijlage IIa.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel19c
  - number: '20'
    text: |-
      1 Degene die met een buitenlands vissersvaartuig vis in een Nederlandse haven heeft aangeland, is verplicht
      terstond na verkoop, maar uiterlijk binnen 48 uur na afloop van de lossing, een kopie van het volledig ingevulde
      logboek-, tevens vangstopgaveformulier, in te dienen.

      2 Degene die met een buitenlands vissersvaartuig met een lengte over alles van meer dan 59 meter in een Nederlandse
      haven vis, afkomstig uit de wateren van een ander derde land dan Noorwegen of IJsland, aanlandt, is verplicht een
      kopie van het door dat derde land voorgeschreven logboek binnen 48 uur na afloop van de lossing in te dienen.

      3 [Artikel 19, tweede, vierde en zesde lid][ref1], is van toepassing op buitenlandse vaartuigen, met uitzondering
      van de verplichting de vangsthoeveelheden in de eenheid kilogrammen te vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel19
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '19'
        paragraaf: '4'
  - number: '21'
    text: |-
      1 De schipper van een vaartuig als bedoeld in artikel 2, tweede lid, van [verordening (EG) nr. 1093/94]
      (31994R1093) van de Raad van de Europese Gemeenschap van 6 mei 1994 tot vaststelling van de voorwaarden waaronder
      vissersvaartuigen van derde landen rechtstreeks mogen aanlanden en verkopen in de havens van de Gemeenschap (PbEG
      L 121) dat de vlag voert van, of geregistreerd is, in een andere staat dan een lidstaat van de Europese Gemeenschap
      is verplicht:

      a. aan boord een logboek bij te houden waarin wordt vermeld:

      1°. per vissoort de hoeveelheden die aan boord worden gehouden;

      2°. de datum waarop de vangsten hebben plaatsgevonden en in welk deelgebied of welke sector;

      3°. het gebruikte type vistuig.

      b. overeenkomstig [artikel 19, vierde lid][ref1], binnen 48 uur na afloop van de lossing een aangifte in te dienen
      waarin per sector en per vissoort wordt vermeld:

      1°. de datum en de plaats van de vangsten;

      2°. de aangevoerde hoeveelheden;

      3°. in geval van overlading het letterteken, nummer en nationaliteit van het vaartuig waarmee de vis is gevangen en
      waarvan de vis is overgeladen;

      4°. de wijze van verkoop.

      2 De aangifte, bedoeld in het eerste lid, onderdeel b, wordt gesteld in de Nederlandse, Franse, Duitse of Engelse
      taal.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel19
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel21
