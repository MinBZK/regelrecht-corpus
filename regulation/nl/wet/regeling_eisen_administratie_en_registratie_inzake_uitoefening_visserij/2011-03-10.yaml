  - number: '33'
    text: |-
      1 De koper van verse vis weegt alle door hem ontvangen hoeveelheden haring, makreel en horsmakreel die zijn
      gevangen in de gebieden, bedoeld in artikel 1 van de verordening inzake weegprocedures, overeenkomstig de artikelen
      6 en 9, vierde lid, van die verordening.

      2 Het wegen van vis als bedoeld in het eerste lid wordt gedaan met apparatuur die ten genoegen van de Minister is
      goedgekeurd, geijkt en verzegeld, als bedoeld in artikel 9, tweede lid, van de verordening inzake weegprocedures.

      3 Degene die de weging, bedoeld in het eerste lid, uitvoert, houdt een weeglogboek bij als bedoeld in artikel 9,
      derde lid, van de verordening inzake weegprocedures.

      4 De koper of houder van bevroren haring, makreel of horsmakreel, die zijn gevangen in de in het eerste lid
      bedoelde gebieden, weegt de van die vissoorten aangevoerde hoeveelheden overeenkomstig artikel 11, eerste lid, van
      de verordening inzake weegprocedures.

      5 Degene die de weging, bedoeld in het vierde lid, uitvoert, houdt een register bij als bedoeld in artikel 11,
      tweede lid, van de verordening inzake weegprocedures.

      6 Het is verboden in strijd te handelen met de artikelen 6, eerste lid, 10 en 11, derde lid, van de verordening
      inzake weegprocedures.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel33
  - number: 33a
    text: |-
      1 Het is verboden in strijd te handelen met artikel 20, eerste lid, van verordening nr. 1342/2008.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien de weging van de kabeljauw, bedoeld in
      artikel 20, eerste lid, van verordening nr. 1342/2008, plaatsvindt in een visafslag en als ook overigens wordt
      voldaan aan het bepaalde in artikel 20, tweede lid, van die verordening.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel33a
