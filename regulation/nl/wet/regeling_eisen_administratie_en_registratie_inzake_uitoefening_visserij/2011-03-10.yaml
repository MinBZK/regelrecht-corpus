  - number: 24a
    text: |-
      1 Degene die gevangen of geoogste visserij- en aquacultuurproducten voor de eerste verkoop aanbiedt, verdeelt de
      genoemde producten in partijen.

      2 Het is verboden in strijd te handelen met artikel 56, vierde lid, van verordening nr. 1224/2009.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel24a
  - number: '25'
    text: |-
      1 De administratie van de overdracht en de opslag van vis wordt:

      a. dagelijks bijgehouden door de aanvoerder van vis;

      b. dagelijks, maar uiterlijk voordat de vis de plaats van verkoop verlaat, per aanlanding bijgehouden door degene
      die in de uitoefening van een beroep of bedrijf vis afneemt en degene die zijn bemiddeling verleent bij het veilen
      van vis.

      2 Degene die zijn bemiddeling verleent bij het veilen van vis draagt er zorg voor dat op of bij de veiling
      aanwezige vis registratienummer en nationaliteit van het vaartuig waarmee de vis is gevangen of aangevoerd,
      duidelijk zijn vermeld.

      3 Degene die vis op de veiling aanwezig heeft, draagt er zorg voor dat op of bij de op de veiling aanwezige vis
      het registratienummer en nationaliteit van het vaartuig, waarmee deze vis is gevangen of aangevoerd, duidelijk
      zijn vermeld.

      4 Degene die zijn bemiddeling verleent bij het veilen van vis die afkomstig is van vaartuigen die de visserij
      in span uitoefenen, draagt er zorg voor dat op of bij de op de veiling aanwezige vis registratienummers en
      nationaliteit van de vaartuigen, waarmee deze vis is gevangen of aangevoerd, duidelijk zijn vermeld.

      5 Degene die vis op de veiling aanwezig heeft die afkomstig is van vaartuigen die de visserij in span hebben
      uitgeoefend, is verplicht op of bij de op de veiling aanwezige vis de registratienummers en nationaliteit van de
      vaartuigen te vermelden waarmee deze vis is gevangen of aangevoerd.

      6 De verplichting, bedoeld in het eerste lid geldt niet voor zover in de uitoefening van een beroep of bedrijf, in
      een voor het publiek toegankelijke ruimte uitsluitend aan particulieren vis te koop wordt aangeboden.

      7 De verplichtingen, bedoeld in het tweede tot en met vijfde lid, gelden niet indien de vis vergezeld gaat van een
      verkoopdocument als bedoeld in [artikel 29, vierde lid][ref1], dat op die vis betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel29
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel25
