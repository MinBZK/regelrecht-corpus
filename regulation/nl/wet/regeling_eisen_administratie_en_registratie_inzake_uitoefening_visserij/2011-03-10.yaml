  - number: '2'
    text: |-
      1 Deze regeling is van toepassing op de vissoorten, bedoeld in:

      a. bijlage I van [Verordening (EEG) nr. 3880/91](31991R3880) van de Raad van de Europese Gemeenschappen van
      17 december 1991 inzake de verstrekking van statistieken van de nominale vangsten van Lid-Staten die in het
      noordoostelijke gedeelte van de Atlantische Oceaan vissen (PbEG L 365);

      b. bijlage I van [Verordening (EEG) nr. 2018/93](31993R2018) van de Raad van de Europese Gemeenschappen van 30 juni
      1993 inzake de indiening van de vangsten en de visserijactiviteit van de Lid-Staten die in het noordwestelijk deel
      van de Atlantische Oceaan vissen (PbEG L 186) en

      c. bijlage 4 van [Verordening (EG) nr. 2597/95](31995R2597) van de Raad van de Europese Unie van 23 oktober 1995
      inzake de verstrekking van statistieken van de nominale vangsten van Lid-Staten in bepaalde gebieden buiten de
      Noordatlantische Oceaan (PbEG L 270).

      2 Voor de toepassing van het bepaalde in deze regeling vindt het aanlanden plaats op het tijdstip waarop het
      vissersvaartuig, buitenlands vissersvaartuig of het vissersvaartuig dat de vlag voert van, dan wel geregistreerd is
      in een derde land, direct of indirect verbinding met de wal heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel2
  - number: '3'
    text: |-
      1 Er is voor de Nederlandse kust in de Noordzee een exclusieve 12-mijlszone als bedoeld in artikel 17, tweede lid,
      van [verordening nr. 2371/2002](32002R2371).

      2 De in het eerste lid bedoelde zone strekt zich uit tot 12 zeemijlen, gemeten zeewaarts vanaf de basislijn van de
      territoriale zee van Nederland.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel3
  - number: '4'
    text: |-
      Het is verboden met een buitenlands vissersvaartuig de visserij uit te oefenen binnen de in [artikel 3][ref1]
      bedoelde zone anders dan voortvloeiend uit artikel 17, tweede lid, van [verordening nr. 2371/2002](32002R2371).


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel3
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '3'
        paragraaf: '1'
  - number: '5'
    text: |-
      Als registratiesysteem of -bestand als bedoeld in [artikel 6, tweede lid, van het Registratiebesluit][ref1] worden
      erkend de aanvoergegevensbestanden van:

      a. het Mosselkantoor van het Productschap Vis;

      b. de Coöperatieve Producentenorganisatie van de Nederlandse Kokkelcultuur U.A.;

      c. de Coöperatieve Producentenorganisatie Nederlandse Vissersbond IJsselmeer U.A.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel6
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '6'
  - number: '6'
    text: |-
      Het is verboden te vissen met een vissersvaartuig, indien de brutotonnage van dat vaartuig, zoals aangegeven in de
      op dat vaartuig betrekking hebbende meetbrief, niet is vastgesteld overeenkomstig artikel 4 van [verordening (EEG)
      nr. 2930/86](31986R2930) van de Raad van de Europese Gemeenschappen van 22 september 1986 houdende definities van
      de kenmerken van vissersvaartuigen (PbEG L 274).
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel6
  - number: '7'
    text: |-
      1 Het is verboden te vissen met een vissersvaartuig of buitenlands vissersvaartuig van meer dan 17 meter lengte in
      andere wateren dan als bedoeld in [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref1], zonder een
      document als bedoeld in artikel 3, tweede lid, van [verordening nr. 1381/87](31987R1381) aan boord te hebben.

      2 De bevoegde instantie tot waarmerking van de documenten, bedoeld in het eerste lid, voor vissersvaartuigen is de
      divisie Scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '8'
    text: |-
      De schipper is verplicht ervoor zorg te dragen dat:

      a. aan boord een loodsladder aanwezig is die schoon is en in goede staat wordt gehouden;

      b. de loodsladder te allen tijde voldoet aan het bepaalde in de onderdelen 1 tot en met 6 van bijlage II bij
      [verordening nr. 1382/87](31987R1382);

      c. aan boord voorzieningen als bedoeld in de onderdelen 7 tot en met 11 van bijlage II bij [verordening nr.
      1382/87](31987R1382) worden getroffen om de met controle belaste ambtenaren veilig en gemakkelijk aan en van boord
      te doen gaan.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden een vissersvaartuig bedrijfsmatig te gebruiken voor de in
      [artikel 3 van de Visserijwet 1963][ref1] bedoelde visserij, indien dit niet voorzien is van een registratienummer
      dat aangebracht is op de wijze, omschreven in artikel 1, eerste lid, eerste en tweede alinea, van [verordening nr.
      1381/87](31987R1381).

      2 Het is verboden in strijd te handelen met artikel 1, derde lid, van [verordening nr. 1381/87](31987R1381).


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '3'
  - number: '10'
    text: |-
      De gemeenten en de lettertekens waarmee de gemeenten worden aangeduid, bedoeld in
      [artikel 3, eerste lid, van het Registratiebesluit][ref1], zijn vastgesteld in [bijlage 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020043
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020043
  - number: '11'
    text: |-
      Inschrijving van vissersvaartuigen in het visserijregister vindt niet plaats onder een letterteken als bedoeld
      in [artikel 10][ref1], indien gedurende tenminste een jaar geen vissersvaartuig onder dat letterteken in het
      visserijregister geregistreerd heeft gestaan en vaststaat dat geen vaartuig meer in de desbetreffende gemeente
      kan havenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel10
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '10'
        paragraaf: '3'
  - number: '12'
    text: |-
      [Artikel 9][ref1] is van overeenkomstige toepassing op het registratienummer waaronder een buitenlands
      vissersvaartuig in die andere lidstaat is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel9
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '9'
        paragraaf: '3'
  - number: '13'
    text: |-
      1 Het is verboden kleine vaartuigen aan boord van een vissersvaartuig of buitenlands vissersvaartuig te houden
      zonder dat deze zijn voorzien van het registratienummer van het vaartuig aan boord waarvan het kleine vaartuig
      zich bevindt.

      2 Het in het eerste lid bedoelde registratienummer:

      a. is geplaatst op de romp van het vaartuig aan beide kanten van de boeg;

      b. is met wit geschilderd op een contrasterende ondergrond, en

      c. is duidelijk leesbaar.
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel13
  - number: '14'
    text: |-
      1 Het is verboden in de wateren, bedoeld in artikel 2 van verordening nr. 356/2005 een boomkor als bedoeld in
      artikel 3 van [verordening nr. 356/2005](32005R0356) voor de visserij te gebruiken, indien niet wordt voldaan aan
      [artikel 5][ref1] van deze verordening.

      2 Het is verboden in de wateren, bedoeld in artikel 2 van verordening nr. 356/2005 passieve vistuigen als bedoeld
      in artikel 3 van [verordening nr. 356/2005](32005R0356) voor de visserij te gebruiken, indien niet wordt voldaan
      aan de [artikelen 6 tot en met 8][ref2] van deze verordening.

      3 Het is verboden in de wateren, bedoeld in artikel 2 van verordening nr. 356/2005 een markeerboei die bestemd
      is om de plaats waar een vistuig zich bevindt aan te geven, in het water uit te zetten of aan boord van een
      vissersvaartuig of buitenlands vissersvaartuig te houden, indien niet wordt voldaan aan de artikelen 9 tot en met
      14 van [verordening nr. 356/2005](32005R0356).

      4 Het is verboden in strijd te handelen met artikel 2, tweede lid, van [verordening nr. 1381/87](31987R1381).


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020043#Artikel6
    url: https://wetten.overheid.nl/BWBR0020043/2011-03-10#Artikel14
