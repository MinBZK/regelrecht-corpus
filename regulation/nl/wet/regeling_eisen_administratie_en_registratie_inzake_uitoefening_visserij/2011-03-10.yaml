  - number: 19a
    text: |-
      1 In afwijking van [artikel 19, tweede, derde, vijfde en zesde lid][ref1], geeft een kapitein of diens
      vertegenwoordiger die met een vissersvaartuig vis aanlandt in een Nederlandse haven de gegevens opgenomen in de
      logboek-, tevens vangstopgaveformulieren, bedoeld in artikel 19, eerste lid, elektronisch door aan de AID, met
      gebruikmaking van een door de minister beschikbaar te stellen format.

      2 Het eerste lid is van toepassing op:

      a. vissersvaartuigen als bedoeld in artikel 1, eerste lid, onderdeel a, van verordening nr. 1077/2008 vanaf
      1 januari 2010;

      b. vissersvaartuigen als bedoeld in artikel 1, eerste lid, onderdeel b, van verordening nr. 1077/2008 vanaf 1 juli
      2010.

      3 De elektronische doorgifte van de gegevens, bedoeld in het eerste lid, vindt plaats in overeenstemming met de
      eisen van artikel 6, eerste tot en met vierde en zesde lid, van verordening nr. 1077/2008 met dien verstande dat in
      het eerste en tweede lid onder ‘bevoegde autoriteit’ moet worden verstaan: de AID.

      4 De kapitein van een vissersvaartuig, bedoeld in het eerste lid, bewaart een kopie van de in artikel 6, eerste
      lid, van verordening nr. 1077/2008 bedoelde informatie aan boord van het vissersvaartuig totdat de aangifte van
      aanlanding is ingediend.

      5 Op verzoek van een andere lidstaat van de Europese Gemeenschap als bedoeld in artikel 12, derde lid, van
      verordening nr. 1077/2008 zendt de kapitein of diens vertegenwoordiger de gegevens uit het logboek en een kopie
      van de ontvangstbevestiging, bedoeld in artikel 8 van verordening nr. 1077/2008, aan de bevoegde autoriteit van
      die lidstaat.

      6 Het is verboden te vissen in de wateren van de lidstaat, bedoeld in het vijfde lid, zolang niet voldaan is aan
      het verzoek, bedoeld in het vijfde lid.

      7 De gegevens opgenomen in de logboek-, tevens vangstopgaveformulieren, bedoeld in [artikel 19, eerste lid][ref2],
      en de melding, bedoeld in [artikel 3, vijfde lid, van de Regeling stelselmatige controle bij aanlanding 1988][ref3],
      mogen in één keer elektronisch worden doorgestuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0020043#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004267#Artikel3
