        artikel: '25'
        paragraaf: '5'
  - number: '28'
    text: |-
      Degene die zijn bemiddeling bij het veilen van vis verleent, vermeldt in zijn administratie, bedoeld in
      [artikel 25, eerste lid][ref1], de volgende gegevens:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. de naam van de aanvoerders en de registratienummers en nationaliteit van de vaartuigen waarmee de vis is
      gevangen of aangevoerd;

      d. de datum van de aanvoer van de vis;

      e. indien het vangstgebied door de aanvoerder bij het aanbieden van vis op de veiling is vermeld, het vangstgebied
      van de vangst per deelgebied of sector.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel25
