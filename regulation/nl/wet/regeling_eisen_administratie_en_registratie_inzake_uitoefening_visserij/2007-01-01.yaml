        artikel: '30'
        paragraaf: '5'
  - number: '33'
    text: |-
      1 De koper van verse vis weegt alle door hem ontvangen hoeveelheden haring, makreel en horsmakreel die zijn
      gevangen in de gebieden, bedoeld in onderdeel 1.1.1 van bijlage III van [verordening nr. 51/2006](32006R0051),
      overeenkomstig onderdeel 1.6 van die bijlage.

      2 De koper of houder van bevroren haring, makreel of horsmakreel, die zijn gevangen in de in het eerste lid
      bedoelde gebieden, weegt de van die vissoorten aangevoerde hoeveelheden overeenkomstig onderdeel 1.8.1 van bijlage
      III van [verordening nr. 51/2006](32006R0051).

      3 In afwijking van het tweede lid kan het gewicht van verpakte bevroren haring, makreel of horsmakreel worden
      bepaald overeenkomstig onderdeel 1.8.2 van bijlage III van [verordening nr. 51/2006](32006R0051).

      4 Onder representatief monster als bedoeld in onderdeel 1.8.2 van bijlage III van [verordening nr. 51/2006]
      (32006R0051) wordt verstaan een overeenkomstig [bijlage 4][ref1] bij deze regeling genomen en gewogen monster.

      5 Het wegen van vis als bedoeld in het eerste en tweede lid wordt gedaan met apparatuur die ten genoegen van
      de Minister van Landbouw, Natuur en Voedselkwaliteit is goedgekeurd, gekalibreerd en verzegeld, als bedoeld in
      onderdeel 1.10.2 van bijlage III van [verordening nr. 51/2006](32006R0051).

      6 Degene die de weging uitvoert houdt een logboek bij als bedoeld in onderdeel 1.10.2 van bijlage III van
      [verordening nr. 51/2006](32006R0051).


      [ref1]: https://wetten.overheid.nl/BWBR0020043
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020043
  - number: '34'
    text: |-
      1 Alle desbetreffende aantekeningen en bescheiden, zoals nota’s, brieven, boeken, registers, andere bewijsstukken,
      of andere hulpmiddelen waarin de gegevens als bedoeld in de [artikelen 29][ref1], [30][ref2], [32][ref3] en
      [33, zesde lid][ref4], zijn vastgelegd, dienen vanaf het tijdstip van hun opstelling of verkrijging tot het
      tijdstip waarop drie kalenderjaren zijn verlopen te worden bewaard.

      2 Op eerste vordering van een bevoegde ambtenaar van de AID dienen de aantekeningen en bescheiden als bedoeld in
      het eerste lid te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel29
