  - number: '36'
    text: >-
      De schipper is op eerste vordering van een ambtenaar van de AID verplicht te voldoen aan artikel 3, eerste en derde
      lid, van [verordening nr. 1382/87](31987R1382).
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel36
  - number: '37'
    text: |-
      De exemplaren van de documenten, bedoeld in de [artikelen 19, eerste en derde lid][ref1], [20, eerste lid][ref2],
      [21, eerste lid, onderdeel b][ref3], [22, eerste lid][ref4], [23, eerste lid, onderdeel c, d en e][ref5],
      [29, vierde en vijfde lid][ref6], en [artikel 30][ref7], zijn volledig en naar waarheid ingevuld.


