preamble:
  text: >-
    Handelende in overeenstemming met de Minister van Verkeer en Waterstaat;


    Gelet op Verordening (EEG) nr. 2807/83 van de Commissie van de Europese Gemeenschappen van 22 september 1983
    houdende uitvoeringsbepalingen inzake de registratie van gegevens over de visvangst van de Lid-Staten (PbEG L 276);


    Gelet op Verordening (EEG) nr. 1381/87 van de Commissie van de Europese Gemeenschappen van 20 mei 1987 inzake
    uitvoeringsbepalingen met betrekking tot kentekens voor vissersvaartuigen en met betrekking tot documenten aan
    boord van die vaartuigen (PbEG L 132);


    Gelet op Verordening (EEG) nr. 1382/87 van de Commissie van de Europese Gemeenschappen van 20 mei 1987 tot
    vaststelling van uitvoeringsbepalingen voor de inspectie van vissersvaartuigen (PbEG L 132);


    Gelet op Verordening (EEG) nr. 2847/93 van de Raad van de Europese Gemeenschappen van 12 oktober 1993 tot invoering
    van een controleregeling voor het gemeenschappelijk visserijbeleid (PbEG L 261);


    Gelet op Verordening (EG) nr. 1093/94 van de Raad van de Europese Unie van 6 mei 1994 tot vaststelling van de
    voorwaarden waaronder vissersvaartuigen van derde landen vangsten rechtstreeks mogen aanlanden en verkopen in de
    havens van de Gemeenschap (PbEG L 121);


    Gelet op de artikelen 4 en 17 van Verordening (EG) nr. 2371/2002 van de Raad van de Europese Unie van 20 december
    2002 inzake de instandhouding en de duurzame exploitatie van de visbestanden in het kader van het gemeenschappelijk
    visserijbeleid (PbEG L 358);


    Gelet op de artikelen 13 en 15 van Verordening (EG) nr. 423/2004 van de Raad van de Europese Unie van 26 februari
    2004 tot vaststelling van herstelmaatregelen voor bepaalde kabeljauwbestanden (PbEU L 70);


    Gelet op de artikelen 10 en 12 van Verordening (EG) nr. 811/2004 van de Raad van de Europese Unie van 21 april 2004
    tot vaststelling van herstelmaatregelen voor het noordelijke heekbestand (PbEU L 185);


    Gelet op Verordening (EG) nr. 356/2005 van de Commissie van de Europese Gemeenschappen van 1 maart 2005 houdende
    uitvoeringsbepalingen voor het merken en identificeren van passief vistuig en boomkorren (PbEU L 56);


    Gelet op Verordening (EG) nr. 51/2006 van de Raad van de Europese Unie van 22 december 2005 tot vaststelling,
    voor 2006, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in de wateren van de
    Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van toepassing zijn, en
    tot vaststelling van de bij de visserij in acht te nemen voorschriften (PbEU L 16);


    Gelet op de artikelen 3, 4 en 5 van het Reglement zee- en kustvisserij 1977;


    Gelet op de artikelen 3, 5 en 6, tweede en derde lid, van het Besluit registratie vissersvaartuigen 1998;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. Registratiebesluit: [Besluit registratie vissersvaartuigen 1998][ref1];

      b. vissersvaartuig: vaartuig als bedoeld in het [Registratiebesluit][ref2];

      c. buitenlands vissersvaartuig: vissersvaartuig dat de vlag voert van en geregistreerd is in een andere lidstaat
      van de Europese Gemeenschap dan Nederland;

      d. AID: Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      e. functionaris: functionaris als bedoeld in
      [artikel 1 van de Regeling stelselmatige controle bij aanlanding 1988][ref3];

      f. divisie Scheepvaart: divisie Scheepvaart van de Inspectie Verkeer en Waterstaat;

      g. schipper: elke gezagvoerder van een vissersvaartuig, buitenlands vissersvaartuig onderscheidenlijk een
      vissersvaartuig dat de vlag voert van, dan wel geregistreerd is in een derde land, of degene die de schipper
      vervangt;

      h. ondernemer: degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in
      [artikel 4 van het Registratiebesluit][ref4], is geregistreerd;

      i. deelgebied: zeegebied zoals omschreven in [bijlage 1 van de Regeling vangstbeperking][ref5];

      j. sector: zeegebied zoals omschreven in [bijlage 1 van de Regeling vangstbeperking][ref6];

      k. logboek-, tevens vangstopgaveformulier: het in [Verordening (EEG) nr. 2807/83](31983R2807) van de Commissie van
      de Europese Gemeenschappen van 22 september 1983 houdende uitvoeringsbepalingen inzake de registratie van gegevens
      over de visvangst van de Lid-Staten (PbEG L 276) voorgeschreven formulier overeenkomstig het model dat als bijlage
      I bij voornoemde verordening is opgenomen;

      l. meetbrief: Internationale Meetbrief (1969) dan wel bijzondere meetbrief als bedoeld in
      [artikel 4 van de Meetbrievenwet 1981][ref7], die is afgegeven overeenkomstig de bij of krachtens die wet gegeven
      bepalingen;

      m. registratienummer: combinatie van lettertekens en nummers die volgens de regelgeving in de verschillende
      lidstaten van de Europese Gemeenschap op vissersvaartuigen moet zijn aangebracht;

      n. vangstopgavebus: vangstopgavebus zoals aanwezig in iedere aangewezen haven op grond van de
      [Regeling stelselmatige controle bij aanlanding 1988][ref8], waarvan de exacte plaats gepubliceerd is op het LNV-
      loket.

      2 In deze regeling wordt voorts verstaan onder:

      a. [verordening nr. 2807/83](31983R2807): [Verordening (EEG) nr. 2807/83](31983R2807) van de Commissie van de
      Europese Gemeenschappen van 22 september 1983 houdende uitvoeringsbepalingen inzake de registratie van gegevens
      over de visvangst van de Lid-Staten (PbEG L 276);

      b. [verordening nr. 1381/87](31987R1381): [Verordening (EEG) nr. 1381/87](31987R1381) van de Commissie van
      de Europese Gemeenschappen van 20 mei 1987 inzake uitvoeringsbepalingen met betrekking tot kentekens voor
      vissersvaartuigen en met betrekking tot documenten aan boord van die vaartuigen (PbEG L 132);

      c. [verordening nr. 1382/87](31987R1382): [Verordening (EEG) nr. 1382/87](31987R1382) van de Commissie van
      de Europese Gemeenschappen van 20 mei 1987 tot vaststelling van uitvoeringsbepalingen voor de inspectie van
      vissersvaartuigen (PbEG L 132);

      d. [verordening nr. 2847/93](31993R2847): [Verordening (EEG) nr. 2847/93](31993R2847) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1993 tot invoering van een controleregeling voor het gemeenschappelijk visserijbeleid
      (PbEG L 261);

      e. [verordening nr. 2371/2002](32002R2371): [Verordening (EG) nr. 2371/2002](32002R2371) van de Raad van de
      Europese Unie van 20 december 2002 inzake de instandhouding en de duurzame exploitatie van de visbestanden in het
      kader van het gemeenschappelijk visserijbeleid (PbEG L 358);

      f. [verordening nr. 423/2004](32004R0423): [Verordening (EG) nr. 423/2004](32004R0423) van de Raad van de Europese
      Unie van 26 februari 2004 tot vaststelling van herstelmaatregelen voor bepaalde kabeljauwbestanden (PbEU L 70);

      g. [verordening nr. 811/2004](32004R0811): [Verordening (EG) Nr. 811/2004](32004R0811) van de Raad van de Europese
      Unie van 21 april 2004 tot vaststelling van herstelmaatregelen voor het noordelijke heekbestand (PbEU L 185);

      h. [verordening nr. 356/2005](32005R0356): [Verordening (EG) nr. 356/2005](32005R0356) van de Commissie van de
      Europese Gemeenschappen van 1 maart 2005 houdende uitvoeringsbepalingen voor het merken en identificeren van
      passief vistuig en boomkorren (PbEU L 56);

      i. [verordening nr. 51/2006](32006R0051): [Verordening (EG) nr. 51/2006](32006R0051) van de Raad van de Europese
      Unie van 22 december 2005 tot vaststelling, voor 2006, van de vangstmogelijkheden voor sommige visbestanden en
      groepen visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere
      wateren met vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen
      voorschriften (PbEU L 16).


