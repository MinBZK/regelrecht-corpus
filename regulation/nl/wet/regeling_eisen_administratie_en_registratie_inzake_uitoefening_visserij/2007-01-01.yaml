  - number: '30'
    text: |-
      Alle niet verwerkte of aan boord verwerkte vis die op Nederlands grondgebied wordt aan- of ingevoerd en die
      naar een andere plaats dan de plaats van aan- of invoer wordt vervoerd, moet totdat de eerste verkoop heeft
      plaatsgevonden, worden vergezeld door:

      a. een door de vervoerder opgesteld vervoersdocument dat de gegevens bevat, bedoeld in artikel 13, tweede lid, van
      [verordening nr. 2847/93](31993R2847);

      b. een kopie van het volledig en naar waarheid ingevulde logboek-, tevens vangstopgaveformulier, bedoeld in
      [artikel 15][ref1], of

      c. een kopie van het volledig en naar waarheid ingevulde document T 2 M, bedoeld in artikel 13, vierde lid, van
      [verordening nr. 2847/93](31993R2847).


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel15
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '15'
        paragraaf: '4'
  - number: '31'
    text: >-
      Indien vis, die in een andere lidstaat van de Europese Gemeenschap dan Nederland wordt aangeland, voor het eerst
      op de markt wordt gebracht op Nederlands grondgebied, overhandigt de vervoerder van de vis binnen 48 uur na het
      tijdstip van aanlanding een kopie van het vervoersdocument aan een ambtenaar van de AID of deponeert de vervoerder
      deze in een vangstopgavebus.
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel31
  - number: '32'
    text: |-
      In afwijking van [artikel 31][ref1] wordt elke hoeveelheid kabeljauw die is gevangen in de gebieden, bedoeld
      in artikel 2 van [verordening nr. 423/2004](32004R0423), en elke hoeveelheid van meer dan 50 kg heek die is
      gevangen in de gebieden, bedoeld in artikel 1 van [verordening nr. 811/2004](32004R0811), die wordt vervoerd
      naar een andere plaats dan de plaats van aanlanding of invoer, vergezeld van de documenten, genoemd in
      [artikel 29, tweede lid, onderdeel a][ref2], en [artikel 30, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020043#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0020043#Artikel30
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel32
    references:
