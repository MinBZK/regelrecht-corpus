  - number: '24'
    text: >-
      De ondernemer bewaart een kopie van alle door of namens hem ingevulde logboeken, tevens vangstopgaveformulieren,
      gedurende een periode van drie jaar vanaf 1 januari van het jaar dat volgt op het jaar waarin een formulier is
      ingediend.
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel24
  - number: '25'
    text: >-
      1 De administratie van de overdracht en de opslag van vis wordt:


      a. dagelijks bijgehouden door de aanvoerder van vis;


      b. dagelijks, maar uiterlijk voordat de vis de plaats van verkoop verlaat, per aanlanding bijgehouden door degene
      die in de uitoefening van een beroep of bedrijf vis afneemt en degene die zijn bemiddeling verleent bij het veilen
      van vis.


      2 Degene die zijn bemiddeling verleent bij het veilen van vis draagt er zorg voor dat op of bij de veiling
      aanwezige vis registratienummer en nationaliteit van het vaartuig waarmee de vis is gevangen of aangevoerd,
      duidelijk zijn vermeld.


      3 Degene die vis op de veiling aanwezig heeft, draagt er zorg voor dat op of bij de op de veiling aanwezige vis
      het registratienummer en nationaliteit van het vaartuig, waarmee deze vis is gevangen of aangevoerd, duidelijk
      zijn vermeld.


      4 Degene die zijn bemiddeling verleent bij het veilen van vis die afkomstig is van vaartuigen die de visserij
      in span uitoefenen, draagt er zorg voor dat op of bij de op de veiling aanwezige vis registratienummers en
      nationaliteit van de vaartuigen, waarmee deze vis is gevangen of aangevoerd, duidelijk zijn vermeld.


      5 Degene die vis op de veiling aanwezig heeft die afkomstig is van vaartuigen die de visserij in span hebben
      uitgeoefend, is verplicht op of bij de op de veiling aanwezige vis de registratienummers en nationaliteit van de
      vaartuigen te vermelden waarmee deze vis is gevangen of aangevoerd.


      6 De verplichting, bedoeld in het eerste lid geldt niet voor zover in de uitoefening van een beroep of bedrijf, in
      een voor het publiek toegankelijke ruimte uitsluitend aan particulieren vis te koop wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel25
  - number: '26'
    text: |-
      De aanvoerder van vis vermeldt in zijn administratie, bedoeld in [artikel 25, eerste lid][ref1], de volgende
      gegevens:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. per hoeveelheid, registratienummer en nationaliteit van het vaartuig waarmee de vis is gevangen of aangevoerd;

      d. de datum van de aanvoer van de vis;

      e. het vangstgebied van de vangst per deelgebied of sector;

      f. de plaats van opslag, in het geval de vis door hem wordt opgeslagen;

      g. de naam van de koper, in het geval de vis zonder bemiddeling van een veiling wordt verkocht;

      h. de naam van de bemiddelaar, in het geval de vis via de bemiddeling van een veiling ter verkoop wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel25
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '25'
        paragraaf: '5'
  - number: '27'
    text: |-
      1 Degene die in de uitoefening van een beroep of bedrijf vis afneemt, vermeldt in zijn administratie, bedoeld in
      [artikel 25, eerste lid][ref1], de volgende gegevens:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. de naam van de aanvoerders en de registratienummers en nationaliteit van de vaartuigen waarmee de vis is
      gevangen of aangevoerd;

      d. de datum van de aanvoer van de vis;

      e. het vangstgebied van de vangst per deelgebied of sector.

      2 Het eerste lid is niet van toepassing voor zover in de uitoefening van een beroep of bedrijf, in een voor het
      publiek toegankelijke ruimte uitsluitend aan particulieren vis te koop wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel25
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel27
