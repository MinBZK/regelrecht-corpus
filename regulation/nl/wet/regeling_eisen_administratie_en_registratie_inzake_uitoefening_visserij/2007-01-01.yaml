  - number: '41'
    text: |-
      1 Bescheiden die ingevolge de regelingen, bedoeld in [artikel 40][ref1], zijn verzameld, ingevuld, bewaard en
      bijgehouden, worden aangemerkt als bescheiden op grond van deze regeling.

      2 Voor zover er ter zake nog sprake is van enige bestuursrechtelijke afdoening, met inbegrip van bezwaar- en
      beroepsprocedures, vindt deze overeenkomstig de regelingen, bedoeld in [artikel 40][ref2] plaats.

      3 Bestaande aanspraken en verplichtingen bij, op grond of in het kader van de regelingen, bedoeld in
      [artikel 40][ref3], blijven in stand.


