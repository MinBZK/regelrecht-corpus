  - number: '35'
    text: |-
      Het bewijs van inschrijving, bedoeld in [artikel 6, vijfde lid, van het Registratiebesluit][ref1], is aanwezig aan
      boord van het desbetreffende vissersvaartuig en wordt op eerste vordering van de met controle belaste ambtenaren
      getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel6
    url: https://wetten.overheid.nl/BWBR0020043/2007-01-01#Artikel35
