  - number: '22'
    text: |-
      1 Degene die met een vissersvaartuig vis aanlandt in een haven van een andere lidstaat van de Europese Gemeenschap
      dan Nederland of die vis heeft overgeladen op een ander vaartuig en die in een haven van een andere lidstaat van
      de Europese Gemeenschap dan Nederland aanlandt of de visserij in span uitoefent en in een haven van een andere
      lidstaat van de Europese Gemeenschap dan Nederland aanlandt, is verplicht:

      a. binnen 48 uur na afloop van de lossing het roze exemplaar van het logboek-, tevens vangstopgaveformulier, dat
      voldoet aan het bepaalde in [artikel 19, vierde lid][ref1], af te geven of toe te zenden aan de bevoegde instanties
      van de lidstaat van aanvoer;

      b. binnen 48 uur na afloop van de lossing het originele exemplaar van het logboek-, tevens vangstopgaveformulier,
      dat voldoet aan het bepaalde in [artikel 19, vierde lid][ref2], toe te zenden aan de AID ter attentie van het
      Visserij Controle Centrum (postbus 234, 6460 AE Kerkrade, telefax (31) 455461011), en

      c. binnen 8 dagen na het tijdstip van aanlanding hiervan melding te maken door middel van het inleveren
      van het blauwe exemplaar van het logboek-, tevens vangstopgaveformulier, dat voldoet aan het bepaalde in
      [artikel 19, vierde lid][ref3], bij de AID ter attentie van het Visserij Controle Centrum (postbus 234, 6460 AE
      Kerkrade, telefax (31) 455461011).

      2 De verplichtingen, bedoeld in het eerste lid, onderdeel b en c, zijn ook van toepassing op degene die met een
      vissersvaartuig in een haven van een derde land vis aanlandt of die vis heeft overgeladen op een ander vaartuig en
      die in een haven van een derde land aanlandt of die de visserij in span uitoefent en die in een haven van een derde
      land aanlandt, tenzij het betreffende derde land een ander logboek dan het logboek-, tevens vangstopgaveformulier
      heeft voorgeschreven.


