  - number: '6'
    text: De in deze verordening genoemde tarieven zijn exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0022557/2008-01-01#Artikel6
  - number: '7'
    text: |-
      1 Deze verordening treedt in werking met ingang van 1 januari 2008.

      2 De [Verordening op de tarieven periodieke preventieve toetsing 2007][ref1] wordt ingetrokken op het tijdstip van
      inwerkingtreding van deze verordening.

      3 Deze verordening wordt aangehaald als: Verordening op de tarieven periodieke preventieve toetsing 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0019955
