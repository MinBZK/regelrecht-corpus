articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* Minister van Economische Zaken;

      b. *verordening 967/2006:* Verordening (EG) nr. 967/2006 van de Commissie van 29 juni 2006 tot vaststelling van
      bepalingen ter uitvoering van Verordening (EG) nr. 318/2006 met betrekking tot de productie buiten het quotum in de
      sector suiker (PbEU 2006, L 176);

      c. *Raad:* Raad van de Europese Unie;

      d. *verordening:* Verordening (EU) nr. 1308/2013 van het Europese Parlement en de Raad van 17 december 2013 tot
      vaststelling van een gemeenschappelijke ordening van de markten voor landbouwproducten en tot intrekking van de
      Verordeningen (EEG) nr. 922/72, (EEG) nr. 234/79, (EG) nr. 1037/2001 en (EG) nr. 1234/2007 van de Raad (PbEU 2013,
      L 347);

      e. *Commissie:* Commissie van de Europese Gemeenschappen;

      f. *suiker:* de producten, bedoeld in artikel 1, eerste lid, onderdeel b, van de verordening;

      g. *verordening 1360/2013:* Verordening (EU) nr. 1360/2013 van de Raad van 2 december 2013 tot vaststelling van de
      bedragen van de productieheffingen in de sector suiker voor de verkoopseizoenen 2001/2002, 2002/2003, 2003/2004,
      2004/2005 en 2005/2006, de coëfficiënt voor de berekening van de aanvullende heffing voor de verkoopseizoenen
      2001/2002 en 2004/2005 en de bedragen die de suikerfabrikanten aan de suikerbietenverkopers moeten betalen vanwege
      het verschil tussen de maximumheffing en de te innen heffing voor de verkoopseizoenen 2002/2003, 2003/2004 en
      2005/2006;

      h. *verordening 1370/2013:* Verordening (EU) nr. 1370/2013 van de Raad van 16 december 2013 houdende maatregelen
      tot vaststelling van steun en restituties in het kader van de gemeenschappelijke ordening van de markten voor
      landbouwproducten (PbEU 2013, L 346).
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel1
  - number: '2'
    text: |-
      1 Er is een Suikerbegeleidingscommissie die de Minister informeert over het gevoelen van het bedrijfsleven over het
      beleid op het gebied van suiker.

      2 De Suikerbegeleidingscommissie bestaat uit achttien leden van wie voor telkens vier jaar worden aangewezen:

      a. vijf leden door de Koninklijke Coöperatie Cosun U.A;

      b. drie leden door de Federatie van Land- en Tuinbouworganisaties (LTO Nederland);

      c. een lid door de Commissie voor de Suikerhandel van het Verbond van de Nederlandse Groothandel;

      d. een lid door de Federatie van de Groothandel in Levensmiddelen en Aanverwante artikelen;

      e. een lid door het Centraal Bureau Levensmiddelenhandel;

      f. drie leden door de gezamenlijke suikerverwerkende industrieën (CIUS-NL), waarmee zijn bedoeld de in de
      onderstaande lijst genoemde organisaties:

        - de Nederlandse Vereniging Frisdranken, Waters, Sappen (F.W.S.);
        - de Nederlandse Zuivel Organisatie;
        - de Vereniging voor de Bakkerij- en Zoetwarenindustrie (VBZ);
        - de Nederlandse Vereniging van Consumptie-ijsfabrikanten;

      g. een lid door de werkgroep Koolhydraten van de Vereniging van de Nederlandse Chemische Industrie (VNCI) en

      h. drie leden door organisaties van werknemers.

      3 In zoverre in afwijking van het tweede lid, worden als leden van de Suikerbegeleidingscommissie aangewezen de
      laatstelijk uit hoofde van de Regeling suiker, isoglucose en inulinestroop als lid van de in die regeling genoemde
      Suikerbegeleidingscommissie aangewezen personen voor de periode die overeenkomt met het, op het tijdstip van
      inwerkingtreding van het tweede lid, nog niet verstreken deel van de periode waarvoor de onderscheiden leden uit
      hoofde van de hiervoor genoemde regeling zijn aangewezen.

      4 De Suikerbegeleidingscommissie wijst uit haar midden een voorzitter aan.

      5 In zoverre in afwijking van het vierde lid, is de voorzitter van de Suikerbegeleidingscommissie de persoon die
      laatstelijk uit hoofde van de Regeling suiker, isoglucose en inulinestroop als voorzitter van de in die regeling
      genoemde Suikerbegeleidingscommissie is aangewezen tot het tijdstip waarop zijn lidmaatschap verstrijkt dan wel de
      Suikerbegeleidingscommissie uit haar midden een andere persoon als voorzitter aanwijst.

      6 Het secretariaat van de Suikerbegeleidingscommissie wordt verzorgd door de Minister.

      7 De Minister kan zich, indien het onderwerp daartoe naar zijn oordeel aanleiding geeft, in de door de
      Suikerbegeleidingscommissie te houden vergaderingen door een of meer door hem aan te wijzen personen doen
      vertegenwoordigen.

      8 De Suikerbegeleidingscommissie stelt haar huishoudelijk reglement vast.

      9 In zoverre in afwijking van het achtste lid, geldt als huishoudelijk reglement als bedoeld in dat artikellid,
      het huishoudelijk reglement, zoals laatstelijk vastgesteld op grond van de Regeling suiker, isoglucose
      en inulinestroop door de in die regeling genoemde Suikerbegeleidingscommissie, tot het tijdstip waarop de
      Suikerbegeleidingscommissie dit reglement vervangt.
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel2
  - number: '5'
    text: |-
      De Minister verleent op verzoek een erkenning aan producenten van suiker, isoglucose of aan de verwerkers van deze
      producten tot de producten, bedoeld in de bijlage van verordening 967/2006.
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel5
  - number: 5b
    text: |-
      Voor elk verkoopseizoen is een fabrikant een overschotheffing verschuldigd, door de Minister te bepalen over de
      geproduceerde hoeveelheden, bedoeld in de verordening en artikel 11 van verordening 1370/2013.
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel5b
  - number: 5c
    text: |-
      De Minister vordert een productieheffing in over het quotum, voor het betrokken verkoopseizoen overeenkomstig de
      verordening bij de producent die over een suiker- of isoglucosequotum beschikt.
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel5c
  - number: 5d
    text: |-
      De Minister vordert bij de producent een door de Europese Commissie vast te stellen heffing in over het extra
      quotum dat voor het betrokken verkoopseizoen wordt toegekend bij of krachtens de verordening.
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel5d
  - number: '7'
    text: |-
      De Minister stelt de quota, bedoeld in artikel 134 van de verordening vast. Deze beschikking wordt gepubliceerd in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel7
  - number: '8'
    text: De Regeling suiker, isoglucose en inulinestroop1 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010502/2021-10-01#Artikel8
