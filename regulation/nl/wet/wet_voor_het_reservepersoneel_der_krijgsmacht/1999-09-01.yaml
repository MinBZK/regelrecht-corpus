$id: wet_voor_het_reservepersoneel_der_krijgsmacht
regulatory_layer: WET
publication_date: '2007-12-11'
valid_from: '1999-09-01'
bwb_id: BWBR0003883
url: https://wetten.overheid.nl/BWBR0003883/1999-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van de herziening van het militair rechtspositierecht
    wenselijk is wijziging te brengen in de mede ter voldoening aan artikel 98 van de Grondwet gestelde bepalingen
    inzake het reserve-personeel der krijgsmacht en onder andere inzake de bevordering en het ontslag van reserve-
    officieren der krijgsmacht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Defensie;

      b. personeel: de militairen, behorende tot het reserve-personeel der krijgsmacht;

      c. werkelijke dienst: dienst gedurende de tijd welke het personeel onder de wapenen doorbrengt;

      d. groot verlof: de tijd gedurende welke het personeel zich niet in werkelijke dienst bevindt of moet bevinden.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel1
  - number: '2'
    text: |-
      Deze wet is van toepassing op hen, die krachtens bij de wet te stellen regelen verplicht, dan wel volgens bij of
      krachtens algemene maatregel van bestuur te stellen regelen vrijwillig tot het personeel behoren.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel2
  - number: '3'
    text: |-
      1 De autoriteiten, colleges en ambtenaren, daartoe bij koninklijk besluit of door de minister aangewezen, zijn
      verplicht tot het verstrekken van opgaven, inlichtingen en adviezen en het verlenen van medewerking in verband met
      de uitvoering van deze wet.

      2 Alle stukken, welke in verband met de bepalingen van deze wet of van te harer uitvoering gegeven voorschriften
      worden gevorderd, ingediend, overgelegd of uitgereikt, zijn vrij van legesheffing, van kosten van legalisatie en
      van griffiekosten.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel3
  - number: '4'
    text: |-
      1 Zij die tot het personeel behoren kunnen – onverminderd de verplichtingen op hen rustende krachtens deze of enige
      andere wet alsmede onverminderd die, welke zij vrijwillig op zich hebben genomen – worden verplicht:

      a. om in geval van buitengewone omstandigheden in werkelijke dienst te komen of te blijven, zolang Onze Minister
      dit vanwege die buitengewone omstandigheden nodig oordeelt;

      b. om, voorzover zulks door Onze Minister nodig wordt geoordeeld, in elk tijdvak van drie jaren in het belang
      van hun geoefendheid in werkelijke dienst te komen en te blijven voor ten hoogste zestig dagen, verdeeld over ten
      hoogste zes perioden;

      c. om, voorzover zulks door Onze Minister in het belang van hun verdere vorming nodig wordt geoordeeld, mondelinge
      of schriftelijke cursussen te volgen, dan wel daartoe in elk tijdvak van drie jaren in werkelijke dienst te komen
      en te blijven voor een periode van ten hoogste vijf dagen;

      2 Onze Minister kan een personeelslid vergunning verlenen om in werkelijke dienst te komen of te blijven buiten de
      tijd, welke verplicht in werkelijke dienst moet worden doorgebracht.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel4
  - number: 4a
    text: |-
      Zij die tot het personeel behoren kunnen zich voorts verplichten tot:

      a. het in werkelijke dienst komen en blijven voor het volgen van functietrainingen en opleidingen voor ten hoogste
      twee weken per jaar;

      b. het zich gedurende ten hoogste één jaar beschikbaar houden voor werkelijke dienst in het kader van een
      crisisbeheersings-, vredes- of humanitaire operatie en tot het voor inzet in een dergelijke operatie in werkelijke
      dienst komen en blijven voor zolang Onze Minister dit nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel4a
  - number: '5'
    text: De oproeping in werkelijke dienst geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister kan op aanvraag ontheffing van de verplichting tot opkomst in werkelijke dienst verlenen, tenzij
      het dienstbelang, afgewogen tegen het persoonlijk belang, zich om operationele redenen daartegen verzet. Aan de
      ontheffing is de verplichting verbonden de door Onze Minister in het belang van de dienst te geven voorschriften op
      te volgen.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel6
  - number: '7'
    text: |-
      1 Zij die tot het personeel behoren zijn gedurende het groot verlof verplicht de bij ministeriële regeling te geven
      administratieve voorschriften na te leven.

      2 Degenen, die niet aan de in het vorige lid bedoelde verplichting voldoen, kunnen door Onze Minister worden
      opgeroepen om voor de tijd, nodig om aan die verplichting te voldoen, doch ten hoogste voor een periode van vijf
      dagen, in werkelijke dienst te verblijven.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel7
  - number: '8'
    text: Het verlenen van groot verlof geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel8
  - number: '9'
    text: 'Deze wet wordt aangehaald als: Wet voor het reservepersoneel der krijgsmacht.'
    url: https://wetten.overheid.nl/BWBR0003883/1999-09-01#Artikel9
