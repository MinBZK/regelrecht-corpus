  - number: IX
    text: |-
      1 De titels, paragrafen en artikelen van [hoofdstuk 10 van de Wet milieubeheer][ref1] worden door Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer doorlopend genummerd. De verwijzingen in de
      [Wet milieubeheer][ref2] worden aan die nummering aangepast.

      2 De tekst van de [Wet milieubeheer][ref3] wordt door Onze Minister van Justitie in het *Staatsblad* geplaatst.

      3 De tekst van de krachtens de [artikelen II][ref4], [III][ref5] en [IV][ref6] ingevoegde en gewijzigde
      bepalingen van de [Wet verontreiniging oppervlaktewateren][ref7], de [Wet verontreiniging zeewater][ref8] en
      de [Wet op de economische delicten][ref9] worden door Onze Minister van Justitie in het *Staatsblad* geplaatst,
      nadat de verwijzingen in die wetten naar artikelen van de [Wet milieubeheer][ref10] door Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zijn aangepast aan de vernummering van die artikelen
      ingevolge het eerste lid.


