preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de huidige regelingen inzake het voorkomen en
    beperken van het ontstaan van afvalstoffen en het verwijderen van afvalstoffen, zoals die zijn opgenomen in de
    Afvalstoffenwet en de Wet chemische afvalstoffen, te verbeteren en aan te vullen en daarbij in het bijzonder
    aandacht te schenken aan de mogelijkheden tot preventie en hergebruik;

    dat het tevens wenselijk is die regelingen, gezien hun samenhang, te integreren en de geïntegreerde regeling op te
    nemen in de Wet milieubeheer;

    dat daarbij tevens uitvoering moet worden gegeven aan de richtlijnen van de Raad en van de Commissie van de
    Europese Gemeenschappen inzake afvalstoffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005986/1996-03-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      De Afvalstoffenwet (*Stb*. 1977, 455) en de Wet chemische afvalstoffen (*Stb*. 1981, 696) worden ingetrokken op een
      bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend
      kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005986/1996-03-01#ArtikelVI
  - number: VII
    text: |-
      In afwijking van de [artikelen 81 van de Provinciewet][ref1] (*Stb*. 1962, 17), 194 van de [gemeentewet][ref2]
      (*Stb*. 1931, 89) en 59, tweede lid, van de [Waterschapswet][ref3] blijven de bepalingen van verordeningen van
      provincies, van gemeenten en van waterschappen betreffende het onderwerp waarin deze wet voorziet - behoudens in
      de gevallen waarin strijd met de bij of krachtens deze wet gestelde voorschriften zou ontstaan - nog van kracht tot
      twee jaar na het in werking treden van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0005416
      [ref3]: https://wetten.overheid.nl/BWBR0005108
    url: https://wetten.overheid.nl/BWBR0005986/1996-03-01#ArtikelVII
