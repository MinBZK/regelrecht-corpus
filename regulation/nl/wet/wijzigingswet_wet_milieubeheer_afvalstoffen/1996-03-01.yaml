  - number: VIII
    text: |-
      1 Een vergunning of ontheffing, verleend krachtens de Afvalstoffenwet of de Wet chemische afvalstoffen, wordt,
      voor zover zij betrekking heeft op gedragingen waarvoor na het in werking treden van de onderscheidene bepalingen
      van [hoofdstuk 10 van de Wet milieubeheer][ref1] een vergunning of ontheffing krachtens die bepalingen vereist
      is, gelijk gesteld met een vergunning, onderscheidenlijk ontheffing, verleend krachtens de betrokken bepaling van
      dat hoofdstuk.

      2 Indien de aanvraag tot het geven van een beschikking krachtens de Afvalstoffenwet of de Wet chemische
      afvalstoffen is ingediend of het voornemen tot het geven van een zodanige beschikking krachtens wettelijk
      voorschrift aan degene tot wie de beschikking zal zijn gericht, is bekendgemaakt voor het tijdstip waarop deze wet
      met betrekking tot zodanige beschikking in werking treedt, blijft het voor dat tijdstip ten aanzien van zodanige
      beschikkingen geldende recht van toepassing tot het tijdstip waarop de beschikking onherroepelijk is geworden.

      3 Het binnen of buiten Nederlands grondgebied brengen van gevaarlijke afvalstoffen, waarvoor het verbod, gesteld
      in artikel 16, tweede lid, van de Wet chemische afvalstoffen, ingevolge de artikelen 16 tot en met 16*c* van
      die wet niet gold op het tijdstip onmiddellijk voorafgaand aan het tijdstip waarop die artikelen ingevolge
      [artikel VI][ref2] van deze wet vervallen, wordt gelijkgesteld met het binnen, onderscheidenlijk buiten
      Nederlands grondgebied brengen van gevaarlijke afvalstoffen overeenkomstig de [artikelen 10.35][ref3] tot en met
      [10.36][ref4].

      4 Indien voor het tijdstip waarop [artikel I][ref5] van deze wet in werking treedt, met betrekking tot een
      inrichting als aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref6], ontheffing is verleend
      van verboden of verplichtingen, gesteld bij een provinciale verordening, wordt de voor de inrichting geldende
      vergunning geacht toe te staan hetgeen die ontheffing toestaat gedurende de termijn waarvoor die ontheffing
      is verleend, dan wel, indien die ontheffing niet voor een bepaalde termijn is verleend, gedurende tien jaar -
      behoudens eerdere intrekking - na het tijdstip waarop [artikel I, onder C, onderdeel 5][ref7], van deze wet in
      werking treedt. De krachtens de [Wet milieubeheer][ref8] geldende vergunning wordt geacht mede te zijn verleend
      onder de beperkingen waaronder de betrokken ontheffing was verleend; voorschriften die aan die ontheffing waren
      verbonden, worden geacht mede aan die vergunning te zijn verbonden. Bij provinciale verordening kan worden bepaald
      dat de eerste volzin in daarbij aangewezen categorieën van gevallen buiten toepassing blijft.

      5 In afwijking van [artikel XIX van de wet van 2 juli 1992, ][ref9] blijven regels, gesteld bij een provinciale
      verordening, ter bescherming van de kwaliteit van het grondwater met het oog op de waterwinning, voor inrichtingen,
      als aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref10], - behoudens eerdere intrekking
        - van kracht tot twee jaar na het tijdstip van inwerkingtreding van deze wet. Indien een ontheffing is verleend
      krachtens een verordening als bedoeld in dit lid, wordt de voor de inrichting geldende vergunning geacht toe te
      staan hetgeen die ontheffing toestaat gedurende de tijd waarvoor die ontheffing is verleend, dan wel indien de
      ontheffing niet voor een bepaalde termijn is verleend, gedurende tien jaar - behoudens eerdere intrekking - na het
      tijdstip van inwerkingtreding van deze wet.

      6 Indien de aanvraag om een ontheffing krachtens een verordening als bedoeld in het vijfde lid, eerste volzin, is
      ingediend in de periode, genoemd in het vijfde lid, eerste volzin, blijft het voor die periode geldende recht ten
      aanzien van de ontheffingverlening van toepassing tot het tijdstip waarop de ontheffing onherroepelijk is geworden.

      7 Indien twee jaar na het tijdstip van inwerkingtreding van deze wet voor inrichtingen regels gelden als bedoeld
      in [artikel 8.46 van de Wet milieubeheer][ref11], ter bescherming van de kwaliteit van het grondwater met het
      oog op de waterwinning, blijven regels als bedoeld in het vijfde lid, nog van kracht tot een in de provinciale
      milieuverordening, bedoeld in [artikel 1.2 van de Wet milieubeheer][ref12], te stellen tijdstip.

      8 Een provinciale verordening ter bescherming van de kwaliteit van het grondwater met het oog op de waterwinning
      wordt voor de toepassing van de [artikelen 15.21][ref13], [15.22][ref14] en [15.34 van de Wet milieubeheer][ref15]
      gelijk gesteld met een verordening als bedoeld in [artikel 1.2 van de Wet milieubeheer][ref16]. Een verzoek
      om vergoeding ingediend voor het tijdstip van inwerkingtreding van deze wet, maar na 28 februari 1993, wordt
      gelijkgesteld met een verzoek om vergoeding ingediend na het tijdstip van inwerkingtreding van deze wet.


