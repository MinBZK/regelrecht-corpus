        bwb_id: BWBR0020762
        artikel: '8'
  - number: '5'
    text: |-
      De [Wet pleziervaartuigen][ref1] in samenhang met de in bijlage I van [richtlijn 2013/53](32013L0053)/EU opgenomen
      essentiële eisen voor de uitlaatemissies van voortstuwingsmotoren met betrekking tot stikstofoxiden wordt voor de
      toepassing van [artikel 5, vijfde en zesde lid, van het besluit][ref2], beschouwd als een alternatieve maatregel
      voor de beheersing van NO-emissies als bedoeld in voorschrift 13.1.b.ii van Bijlage VI van het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0008366
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel5
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008366
      - id: ref2
        bwb_id: BWBR0020762
        artikel: '5'
  - number: 5a
    text: |-
      De volgende schepen zijn uitgerust met voorzieningen om olierestanten of oliehoudende mengsels aan boord te houden
      of om deze overeenkomstig voorschrift 15.6 van Bijlage I bij het Verdrag te lozen:

      a. schepen van minder dan 400 GT, niet zijnde olietankschepen als bedoeld in onderdeel b, voor zover naar het
      oordeel van de Minister praktisch uitvoerbaar;

      b. olietankschepen van meer dan 150 GT en minder dan 400 GT, voor zover naar het oordeel van de Minister praktisch
      uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel5a
  - number: 5b
    text: |-
      De eisen bedoeld in voorschrift 18.8.2 van Bijlage I bij het Verdrag zijn de eisen, opgenomen in resolutie
      A.495(XII).
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel5b
  - number: 5c
    text: |-
      De eisen, bedoeld in voorschrift 30.6.5.2 van Bijlage I bij het Verdrag, zijn de eisen opgenomen in de
      specificaties voor het ontwerp, de installatie en werking van een deelstroomsysteem voor de regeling van lozingen
      overboord, die als [bijlage 1][ref1] bij deze regeling zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020786
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0020786
  - number: 5d
    text: |-
      De eisen, bedoeld in voorschrift 33.2 van Bijlage I bij het Verdrag, zijn de eisen, opgenomen in resolutie
      A.446(XI).
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel5d
  - number: 5f
    text: |-
      De volgende schepen zijn uitgerust met voorzieningen om het sanitair afval te kunnen lozen overeenkomstig de in
      Bijlage IV bij het Verdrag gegeven voorschriften:

      a. bestaande schepen als bedoeld in [artikel 5, vierde lid, onderdelen c en d, van het besluit][ref1] met een
      bouwdatum vóór 2 oktober 1983, voor zover naar het oordeel van de Minister praktisch uitvoerbaar;

      b. andere schepen dan die, bedoeld in [artikel 5, vierde lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel5
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel5f
