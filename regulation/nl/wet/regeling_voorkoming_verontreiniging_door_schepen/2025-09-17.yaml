  - number: '13'
    text: |-
      Voorschrift 4.2 van Bijlage I van het Verdrag en voorschrift 3.1.2 van Bijlage II van het Verdrag zijn met
      betrekking tot een lozing die voldoet aan de voorwaarden van artikel 4 van richtlijn 2005/35/EG voor alle schepen
      als bedoeld in artikel 2 van die richtlijn:

      a. met betrekking tot een lozing in de Nederlandse territoriale zee niet van toepassing;

      b. met betrekking tot een lozing in de Nederlandse exclusieve economische zone en op volle zee van toepassing voor
      de eigenaar, de kapitein of de bemanning.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel13
  - number: 13a
    text: |-
      Schepen die gebruik maken van emissiereductiemethoden als bedoeld in [artikel 14, tweede lid, onderdeel c][ref1],
      lozen het in het kader van deze methoden ontstane afvalwater in overeenstemming met de in bijlage II van [richtlijn
      2016/802](32016L0802)/EU opgenomen lozingscriteria.


      [ref1]: https://wetten.overheid.nl/BWBR0020786#Artikel14
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel13a
    references:
