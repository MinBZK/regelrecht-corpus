preamble:
  text: |-
    Gelet op de artikelen 1, tweede lid, 8, 11, 15, 32, 35, 38 van het Besluit voorkoming verontreiniging door schepen,
    artikel 2 van het Besluit havenontvangstvoorzieningen, artikel 13, derde lid,14, tweede lid, en 30 van de Wet
    voorkoming verontreiniging door schepen, alsmede op de in artikel 1 van deze regeling genoemde richtlijnen en
    verordeningen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. besluit: [Besluit voorkoming verontreiniging door schepen][ref1];

      b. [richtlijn 2013/53](32013L0053)/EU: [richtlijn nr. 2013/53](32013L0053)/EU van het Europees Parlement en de Raad
      van 20 november 2013 betreffende pleziervaartuigen en waterscooters en tot intrekking van [richtlijn nr. 94/25/
      EG](31994L0025);

      c. [richtlijn 96/98/EG](31996L0098): [richtlijn nr. 96/98/EG](31996L0098) van de Raad van de Europese Unie van
      20 december 1996 inzake uitrusting van zeeschepen (PbEG 1997, L 46);

      d. [richtlijn 2016/802](32016L0802)/EU: [richtlijn nr. 2016/802](32016L0802)/EU van het Europees Parlement en de
      Raad van 11 mei 2016 betreffende een vermindering van het zwavelgehalte van bepaalde vloeibare brandstoffen;

      e. [richtlijn 2005/35/EG](32005L0035): [richtlijn nr. 2005/35/EG](32005L0035) van het Europees Parlement en de
      Raad van de Europese Unie van 7 september 2005 inzake verontreiniging vanaf schepen en invoering van sancties voor
      inbreuken (PbEU L 255);

      f. verordening (EU) 530/2012: verordening (EU) nr. 530/2012 van het Europees Parlement en de Raad van 13 juni 2012
      betreffende het versneld invoeren van de vereisten inzake een dubbelwandige uitvoering of een gelijkwaardig ontwerp
      voor enkelwandige olietankschepen (PbEU L 172);

      g. [verordening (EG) 782/2003](32003R0782): [verordening (EG) nr. 782/2003](32003R0782) van het Europees Parlement
      en de Raad van de Europese Unie van 14 april 2003 houdende een verbod op organische tinverbindingen op schepen
      (PbEU L 115);

      h. emissiereductiemethode: technische methode als bedoeld in artikel 2 van richtlijn 1999/32/EG;

      i. gebied voor emissiebeheersing voor SO en fijnstof: gebied als bedoeld in voorschrift 14 van Bijlage VI van het
      Verdrag, waar bijzondere verplichte maatregelen voor emissies door schepen gelden teneinde lucht verontreiniging
      door SO en fijnstof en de daarmee gepaard gaande schadelijke invloed op de volksgezondheid en het milieu te
      voorkomen, beperken en beheersen;

      j. schip op zijn ligplaats: schip op zijn ligplaats als bedoeld in artikel 2 van richtlijn 1999/32/EG;

      k. IMDG-Code: de bij resolutie MSC.122(75) van de Maritieme Veiligheidscommissie van de IMO aangenomen
      Internationale Code voor gevaarlijke stoffen (International Maritime Dangerous Goods Code);

      l. resolutie A.495(XII): resolutie A.495(XII) van de Algemene Vergadering van de IMO, houdende herziene
      Specificaties voor olietankschepen met aangewezen schone-ballasttanks;

      m. resolutie A.446(XI): resolutie A.446(XI) van de Algemene Vergadering van de IMO, zoals gewijzigd door resolutie
      A.497(XII) en verder gewijzigd door resolutie A.897(21), houdende Specificaties voor het ontwerp, de werkwijze en
      de regeling van ruwe-oliewassystemen;

      n. resolutie A.1122(30): resolutie A.1122(30) van de Algemene Vergadering van de IMO, houdende de Code voor het
      vervoer en de behandeling van gevaarlijke en schadelijke vloeistoffen in bulk door offshore ondersteuningsschepen
      (OSV Chemical Code);

      o. Minister: Minister van Infrastructuur en Waterstaat;

      p. Caribisch-Nederlands schip: een schip dat op grond van de [Vaartuigenwet 1930 BES][ref2] is geregistreerd in de
      openbare lichamen Bonaire, Sint Eustatius of Saba;

      q. richtlijn 2014/90/EU: richtlijn nr. 2014/90/EU van het Europees Parlement en de Raad van de Europese Unie inzake
      uitrusting van zeeschepen en tot intrekking van richtlijn 96/98/EG van de Raad (PbEU L 257);

      r. verordening (EU) 2015/757: verordening (EU) 2015/757 van het Europees Parlement en de Raad van 29 april 2015
      betreffende de monitoring, de rapportage en de verificatie van kooldioxide-emissies door maritiem vervoer en tot
      wijziging van [Richtlijn 2009/16/EG](32009L0016);

      s. verordening (EU) 1257/2013: Verordening (EU) nr. 1257/2013 van het Europees Parlement en de Raad, van
      20 november 2013, inzake scheepsrecycling en tot wijziging van verordening (EG) nr. 1013/ 2006 en van [Richtlijn
      2009/16/EG](32009L0016);

      t. uitvoeringsverordening scheepsuitrusting: uitvoeringshandeling van de Europese Commissie betreffende de
      vereisten met betrekking tot het ontwerp, de constructie en de prestaties van en de beproevingsnormen voor de
      scheepsuitrusting, als bedoeld in artikel 35, tweede lid, van [richtlijn 2014/90](32014L0090)/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0003936
      [ref2]: https://wetten.overheid.nl/BWBR0028292
