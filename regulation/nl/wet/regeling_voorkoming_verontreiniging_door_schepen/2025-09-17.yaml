  - number: '2'
    text: |-
      Als bouwdatum van een schip wordt aangemerkt de dag waarop de kiel van het schip is gelegd, dan wel de
      dag waarop met inachtneming van hetgeen dienaangaande in de op grond van deze regeling toepasselijke code,
      resoluties, richtlijnen of verordeningen is bepaald, een met de kiellegging vergelijkbaar stadium is bereikt.
      [Artikel 4, tweede lid, van het besluit][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel4
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel2
