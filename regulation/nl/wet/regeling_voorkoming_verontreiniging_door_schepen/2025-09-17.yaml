        bwb_id: BWBR0020786
        artikel: '14'
        hoofdstuk: '4'
  - number: '14'
    text: |-
      1 In aanvulling op het verbod, bedoeld in [artikel 31, tweede lid, onderdeel a, van het besluit][ref1], is het
      verboden om:

      a. brandstofolie te gebruiken met een zwavelgehalte van meer dan 0,10% aan boord van Nederlandse schepen en
      buitenlandse schepen gedurende de tijd dat deze zich bevinden op de Nederlandse binnenwateren;

      b. brandstofolie te gebruiken met een zwavelgehalte van meer dan 0,10% aan boord van Nederlandse en buitenlandse
      schepen op hun ligplaats in havens, waarbij de bemanning voldoende tijd wordt gegeven om zo spoedig mogelijk
      na de aankomst op de ligplaats en zo laat mogelijk vóór vertrek indien nodig om te schakelen van of op andere
      brandstoffen.

      2 De verboden, bedoeld in het eerste lid, en het verbod, bedoeld in
      [artikel 31, tweede lid, onderdeel a, van het besluit][ref2] wat betreft het gebruik van brandstofolie in de
      Nederlandse territoriale zee en de Nederlandse EEZ, waaronder de gebieden voor emissiebeheersing van zwavel en
      fijnstof, zijn niet van toepassing op:

      a. brandstoffen als bedoeld in artikel 1, tweede lid, onderdelen a en c, van [richtlijn 2016/802](32016L0802)/EU;

      b. het gebruik van brandstoffen als bedoeld in artikel 1, tweede lid, onderdelen f en g, van [richtlijn 2016/802]
      (32016L0802)/EU;

      c. het gebruik van brandstoffen aan boord van schepen die gebruik maken van emissiereductiemethoden overeenkomstig
      artikel 8 van [richtlijn 2016/802](32016L0802)/EU.

      3 Het verbod, bedoeld in het eerste lid, onderdeel b, is niet van toepassing op:

      a. schepen die volgens een gepubliceerde dienstregeling minder dan twee uur op hun ligplaats zullen liggen;

      b. schepen die alle motoren uitschakelen en gebruikmaken van stroomvoorzieningen van het vasteland terwijl zij in
      een haven op hun ligplaats liggen.

      4 In afwijking van het tweede lid, aanhef en onderdeel c, geldt in geval van het gebruik van brandstofolie met een
      zwavelgehalte van meer dan 3,50% aan boord van schepen, de in deze aanhef en dit onderdeel bedoelde uitzondering
      alleen voor zover deze schepen gebruik maken van emissiereductiemethoden in een gesloten systeem.

      5 De Minister kan afwijking toestaan van de verboden, bedoeld in het eerste lid, en het verbod, bedoeld in
      [artikel 31, tweede lid, onderdeel a][ref3], van het besluit wat betreft het gebruik van brandstofolie in de
      Nederlandse territoriale zee en de Nederlandse EEZ, waaronder de gebieden voor emissiebeheersing van zwavel en
      fijnstof, voor proefnemingen met nieuwe emissiereductiemethoden.

      6 De uitoefening van de bevoegdheid, bedoeld in het vijfde lid, geschiedt in overeenstemming met artikel 10 van
      [richtlijn 2016/802](32016L0802)/EU.

      7 Toegestane proefnemingen met nieuwe emissiereductiemethoden worden toegepast overeenkomstig artikel 10 van
      [richtlijn 2016/802](32016L0802)/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0020762#Artikel31
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel14
