  - number: 12c
    text: |-
      1 De Minister geeft voor een schip dat met goed gevolg overeenkomstig artikel 8, vierde en vijfde lid, van
      verordening (EU) 1257/2013 is geïnspecteerd een internationaal certificaat betreffende de inventarisatie van
      gevaarlijke materialen als bedoeld in artikel 9, eerste lid, van die verordening af.

      2 De Minister verstrekt voor een schip dat met goed gevolg overeenkomstig artikel 8, zesde lid, van verordening
      (EU) 1257/2013 is geïnspecteerd een aantekening als bedoeld in artikel 9, tweede lid, van die verordening op het
      internationaal certificaat betreffende de inventarisatie van gevaarlijke materialen.

      3 De Minister geeft voor een schip dat met goed gevolg overeenkomstig artikel 8, zevende lid, van verordening (EU)
      1257/2013 is geïnspecteerd een internationaal certificaat inzake gereedheid voor recycling als bedoeld in artikel
      9, negende lid, van die verordening af.

      4 De minister kan een verklaring ter goedkeuring van een scheepsrecyclingplan afgeven aan de scheepseigenaar en de
      exploitant van de scheepsrecyclinginrichting.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel12c
  - number: 12d
    text: |-
      1 Indien een schip met goed gevolg overeenkomstig [artikel 12c, eerste lid][ref1], is geïnspecteerd, geeft de
      Minister tevens een internationaal certificaat betreffende de inventarisatie van gevaarlijke materialen als bedoeld
      in voorschrift 11, eerste lid, van de bijlage bij het Scheepsrecyclingsverdrag af.

      2 Indien een schip met goed gevolg overeenkomstig [artikel 12c, tweede lid][ref2], is geïnspecteerd,
      verstrekt de Minister tevens een aantekening als bedoeld in voorschrift 11, tweede lid van de bijlage bij
      het Scheepsrecyclingsverdrag op het internationaal certificaat betreffende de inventarisatie van gevaarlijke
      materialen.

      3 Indien een schip met goed gevolg overeenkomstig [artikel 12c, derde lid][ref3], is geïnspecteerd, geeft de
      Minister tevens een internationaal certificaat betreffende de gereedheid voor recycling als bedoeld in voorschrift
      11, elfde lid, van de bijlage bij het Scheepsrecyclingsverdrag af.

      4 Een verklaring als bedoeld in [artikel 12c, vierde lid][ref4], geldt tevens als een verklaring als bedoeld in
      voorschrift 9, onderdeel 4, van de bijlage bij het Scheepsrecyclingsverdrag.

      5 De geldigheidsduur van de certificaten, bedoeld in het eerste of derde lid, is gelijk aan de geldigheidsduur van
      de certificaten afgegeven op grond van [artikel 12c, eerste, onderscheidenlijk derde lid][ref5].


