  - number: 14a
    text: |-
      Offshore ondersteuningsschepen als bedoeld in resolutie A.1122(30), die beperkte hoeveelheden van de schadelijke
      stoffen, bedoeld in die resolutie, in bulk vervoeren, lozen in overeenstemming met de lozingsvoorschriften van
      die resolutie.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel14a
  - number: 14b
    text: |-
      De vaarsnelheid van ten minste 4 knopen als bedoeld in voorschrift 11.1.1 van Bijlage IV bij het Verdrag is zodanig
      dat deze consistent is met het goedgekeurde tempo van lozing.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel14b
  - number: 15a
    text: |-
      De eisen, bedoeld in voorschrift 18.8.2 van Bijlage I bij het Verdrag, zijn de eisen, opgenomen in resolutie
      A.495(XII).
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel15a
  - number: 15b
    text: |-
      De eisen, bedoeld in voorschrift 30.6.5.2 van Bijlage I bij het Verdrag, zijn de eisen opgenomen in de
      specificaties voor het ontwerp, de installatie en werking van een deelstroomsysteem voor de regeling van lozingen
      overboord, die als [bijlage 1][ref1] bij deze regeling zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020786
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0020786
  - number: 15c
    text: |-
      In alle bescheiden die betrekking hebben op het vervoer van een schadelijke stof in verpakte vorm worden vermeld:

      1°. het identificatienummer van de Verenigde Naties voor zover van toepassing,

      2°. de indeling in gevarenklassen, genoemd in de IMDG-Code, en

      3°. de hoeveelheden van die stoffen en, wanneer zij in transporttanks of vrachtcontainers worden vervoerd, de
      identificatietekens daarvan.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel15c
  - number: 15d
    text: |-
      Het ingevolge [artikel 34 van het besluit][ref1] toepasselijke voorschrift 18.2.4 van Bijlage VI bij het Verdrag is
      mede van toepassing op de kapitein van een buitenlands schip dat zich in een Nederlandse haven bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel34
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0020762
        artikel: '34'
  - number: 15e
    text: |-
      De ingevolge artikel 33, tweede lid, van het besluit toepasselijke voorschriften van Bijlage II bij het Verdrag met
      betrekking tot het vervoer van schadelijke vloeistoffen in bulk, gelden niet voor het vervoer in bulk van beperkte
      hoeveelheden van de schadelijke stoffen, bedoeld in resolutie A.1122(30) door offshore ondersteuningsschepen als
      bedoeld in die resolutie, mits dit vervoer voldoet aan de in die resolutie neergelegde eisen.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel15e
  - number: 15f
    text: |-
      De ingevolge artikel 33, derde lid, van het besluit toepasselijke voorschriften van Bijlage III bij het
      Verdrag met betrekking tot de wijze van merken en etikettering van verpakkingen en de voorschriften, bedoeld in
      [artikel 15c][ref1], gelden niet, voor zover de IMDG-Code dat bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0020786#Artikel15c
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel15f
