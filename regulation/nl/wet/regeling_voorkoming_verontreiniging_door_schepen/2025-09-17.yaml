  - number: 5h
    text: |-
      1 Dit artikel is van toepassing op schepen die vanuit een scheepsregister in een andere lidstaat van de Europese
      Unie of een staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte, zijn overgeschreven naar
      een Nederlands scheepsregister.

      2 Met de in de [artikelen 5a tot en met 5f][ref1] bedoelde technische normen of technische eisen worden
      gelijkgesteld daaraan gelijkwaardige technische normen of technische eisen, vastgesteld door of vanwege een andere
      lidstaat van de Europese Unie of een staat die partij is bij de overeenkomst inzake de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0020786#Artikel5a
