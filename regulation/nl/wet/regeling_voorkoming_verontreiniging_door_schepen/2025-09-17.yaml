        artikel: '4'
  - number: '3'
    text: |-
      Een olietankschip van 150 GT of meer voldoet in aanvulling op de ingevolge
      [artikel 5, eerste lid, van het besluit][ref1] toepasselijke eisen van Bijlage I van het Verdrag mede aan de eisen
      van verordening (EU) 530/2012.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel5
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020762
        artikel: '5'
  - number: '4'
    text: |-
      Overeenstemming met de artikelen 4 en 5 van de [verordening (EG) 782/2003](32003R0782) is een eis als bedoeld in
      [artikel 8, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel8
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel4
