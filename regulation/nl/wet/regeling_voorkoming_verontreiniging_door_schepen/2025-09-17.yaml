  - number: 1a_bis
    text: |-
      De [artikelen 2][ref1], [5a tot en met 5g][ref2], [11][ref3], [12a][ref4], [12b][ref5], [13][ref6], [14a][ref7],
      [14b][ref8] en [15a tot en met 15e][ref9] zijn tevens van toepassing op Caribisch-Nederlandse schepen, met dien
      verstande dat:

      a. voor het aanmerken van de dag waarop een met de kiellegging vergelijkbaar stadium is bereikt als bedoeld in
      [artikel 2][ref10], slechts de op grond van deze regeling toepasselijke code en resoluties in acht worden genomen;

      b. bij het toestaan van afwijking als bedoeld in [artikel 5g][ref11] slechts de op grond van deze regeling
      toepasselijke code en resoluties in acht worden genomen.


