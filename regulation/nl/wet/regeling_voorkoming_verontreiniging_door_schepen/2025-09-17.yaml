        artikel: '5'
  - number: 5g
    text: |-
      De Minister kan, met inachtneming van hetgeen dienaangaande in de op grond van deze regeling toepasselijke
      code, resoluties, richtlijnen en verordeningen is bepaald, afwijking toestaan van de in de [artikelen 3][ref1],
      [4][ref2] en [5b tot en met 5e][ref3] bedoelde eisen, indien aan boord van het schip een voorziening wordt
      getroffen die naar zijn oordeel ten minste gelijkwaardig is aan de op grond van deze artikelen geëiste voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0020786#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020786#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020786#Artikel5b
