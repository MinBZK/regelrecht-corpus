      1 Het onderzoek, bedoeld in [artikel 12a, eerste lid, onderdelen a en b][ref1], vindt plaats voordat het schip in
      dienst wordt gesteld of voordat de verklaring voor de eerste maal wordt afgegeven.

      2 Het in het eerste lid bedoelde onderzoek wordt herhaald binnen drie maanden voor of na de datum waarop twee
      jaar dan wel drie jaar is verstreken nadat het in het eerste lid bedoelde onderzoek heeft plaatsgevonden en, in
      verband met de vernieuwing van de verklaring, binnen drie maanden voor de afloop van de geldigheidsduur van de
      desbetreffende verklaring.


