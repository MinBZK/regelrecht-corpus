      1 Op verzoek van de reder kan de Minister een verklaring afgeven voor:

      a. schepen als bedoeld in [artikel 5a, onderdeel a][ref1], waarvan na onderzoek is gebleken dat deze voldoen aan de
      eis, bedoeld in de aanhef van [artikel 5a][ref2], en

      b. schepen als bedoeld in [artikel 5f, onderdeel b][ref3], waarvan na onderzoek is gebleken dat deze voldoen aan de
      eis, bedoeld in de aanhef van [artikel 5f.][ref4]

      2 De in het eerste lid bedoelde verklaringen hebben een geldigheidsduur van maximaal vijf jaren.


