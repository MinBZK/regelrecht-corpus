  - number: '6'
    text: |-
      Deze paragraaf is van toepassing op scheepsuitrusting waarvoor bij plaatsing aan boord van een schip, gelet op de
      op dat schip toepasselijke eisen, een typegoedkeuring is vereist.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel6
  - number: '7'
    text: |-
      1 Scheepsuitrusting als bedoeld in de [Wet scheepsuitrusting 2016](onbekend) mag slechts aan boord worden
      geplaatst, indien de scheepsuitrusting:

      a. is voorzien van een stuurwielmarkering als bedoeld in de [Wet scheepsuitrusting 2016](onbekend), of

      b. vergezeld gaat van:

      1°. een certificaat van gelijkwaardigheid als bedoeld in [artikel 5, derde lid, van de Wet scheepsuitrusting 2016]
      (onbekend);

      2°. een certificaat van gelijkwaardigheid ten behoeve van technische innovatie als bedoeld in
      [artikel 18, eerste lid, van de Regeling scheepsuitrusting 2016][ref1], of

      3°. een certificaat ten behoeve van beproeving als bedoeld in
      [artikel 19, eerste lid, van de Regeling scheepsuitrusting 2016][ref2].

      2 Gebruik van scheepsuitrusting waarvoor een certificaat als bedoeld in het eerste lid, onderdeel b of onderdeel
      c, is afgegeven, is slechts toegestaan met inachtneming van de aan het desbetreffende certificaat verbonden
      voorschriften of beperkingen. In het geval van beproeving blijft de oorspronkelijke stuurwielgemarkeerde
      scheepsuitrusting aan boord en zal die uitrusting te allen tijde gereed zijn voor onmiddellijk gebruik.

      3 Indien een schip zich in een haven buiten de Europese Unie bevindt en het vanuit het oogpunt van termijnen
      en kosten redelijkerwijs niet uitvoerbaar is om uitrusting aan boord te plaatsen waarvoor overeenkomstig
      richtlijn 2014/90/EU een EG-typegoedkeuring is verleend, kan in afwijking van het eerste lid, in uitzonderlijke
      omstandigheden vervangende scheepsuitrusting aan boord worden geplaatst die niet overeenkomstig richtlijn 2014/90/
      EU is goedgekeurd, mits daarbij wordt voldaan aan de in artikel 32, eerste tot en met vierde lid, van die richtlijn
      genoemde voorwaarden.

      4 Indien is aangetoond dat scheepsuitrusting waarop een stuurwielmarkering als bedoeld in de [Wet scheepsuitrusting
      2016](onbekend) is aangebracht niet in de handel verkrijgbaar is, kan in afwijking van het eerste lid, de minister
      toestemming verlenen om vervangende scheepsuitrusting aan boord te plaatsen, mits daarbij wordt voldaan aan de in
      artikel 32, vijfde tot en met achtste lid, van de richtlijn 2014/90/EU genoemde voorwaarden.

      5 Het eerste tot en met vierde lid zijn niet van toepassing op de plaatsing van emissiereductiemethoden aan boord
      van schepen die niet behoren tot de categorie schepen waarvoor een certificaat wordt afgegeven als bedoeld in
      [artikel 12, vierde lid, van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0038499#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0038499#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0003936#Artikel12
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038499
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0038499
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0003936
        artikel: '12'
  - number: '8'
    text: |-
      1 Scheepsuitrusting, niet zijnde uitrusting als bedoeld in [artikel 3 van de Wet scheepsuitrusting 2016](onbekend),
      is van een door het Hoofd van de Scheepvaartinspectie goedgekeurd type.

      2 De Minister kan in afwijking van [artikel 7][ref1] toestaan dat aan boord van bepaalde categorieën schepen,
      niet zijnde schepen die behoren tot de categorie schepen waarvoor mede in verband met het voldoen aan de
      eisen met betrekking tot de betreffende uitrusting een van de certificaten wordt verstrekt als bedoeld in
      [artikel 12 van het besluit][ref2], scheepsuitrusting wordt geplaatst die niet aan de vereisten als bedoeld
      in [artikel 3, eerste lid, van de Wet scheepsuitrusting 2016](onbekend) voldoet, en voor die uitrusting een
      typegoedkeuring verlenen, mits zulks zonder gevaar voor het milieu mogelijk is.

      3 Aan een typegoedkeuring als bedoeld in het eerste of tweede lid kunnen beperkingen met betrekking tot het gebruik
      van de desbetreffende uitrusting worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020786#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel12
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020786
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020762
        artikel: '12'
  - number: 8a
    text: |-
      1 Uitrusting waarvoor bij plaatsing aan boord van een Caribisch-Nederlands schip, gelet op de op dat schip
      toepasselijke eisen, een typegoedkeuring is vereist, is van een door de Minister goedgekeurd type.

      2 Met uitrusting van een door de Minister goedgekeurd type wordt gelijkgesteld uitrusting:

      a. die is voorzien van een stuurwielmarkering als bedoeld in de [Wet scheepsuitrusting 2016](onbekend);

      b. met betrekking waartoe een daaraan gelijkwaardige typegoedkeuring is verleend door de bevoegde autoriteit van de
      Verenigde Staten of van Canada, met inachtneming van de voor die goedkeuring opgestelde richtlijnen en standaarden
      van de IMO.

      3 Aan een typegoedkeuring als bedoeld in het eerste lid kunnen beperkingen met betrekking tot het gebruik van de
      desbetreffende uitrusting worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel8a
  - number: '9'
    text: |-
      Met een door de Minister verleende typegoedkeuring wordt gelijkgesteld een daaraan gelijkwaardige typegoedkeuring,
      verleend door of vanwege een andere lidstaat van de Europese Unie, dan wel door of vanwege een staat die partij is
      bij de Overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0020786/2025-09-17#Artikel9
  - number: '10'
    text: |-
      1 Emissiereductiemethoden zijn van een door de Europese Commissie goedgekeurd type.

      2 Proefnemingen met emissiereductiemethoden worden goedgekeurd door de Minister in overeenstemming met artikel 10,
      van [richtlijn 2016/802](32016L0802)/EU. [Artikel 9][ref1] is van overeenkomstige toepassing.


