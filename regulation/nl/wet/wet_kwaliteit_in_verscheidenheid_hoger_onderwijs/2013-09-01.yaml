preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet op het hoger onderwijs en wetenschappelijk
    onderzoek en enkele andere wetten aan te passen om een aantal beleidsvoornemens uit de Strategische Agenda Hoger
    Onderwijs, Onderzoek en Wetenschap 2011–2015 «Kwaliteit in verscheidenheid» te kunnen realiseren;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033693/2013-09-01#ArtikelAanhef
articles:
  - number: IV
    text: 'Deze wet wordt aangehaald als: Wet Kwaliteit in verscheidenheid hoger onderwijs.'
    url: https://wetten.overheid.nl/BWBR0033693/2013-09-01#ArtikelIV
  - number: V
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033693/2013-09-01#ArtikelV
