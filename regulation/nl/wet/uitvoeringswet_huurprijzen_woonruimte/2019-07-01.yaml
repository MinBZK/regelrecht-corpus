        artikel: '53'
        hoofdstuk: VI
  - number: '54.1'
    text: |-
      De [Huurprijzenwet woonruimte][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003221
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003221
  - number: '54.2'
    text: |-
      De [Wet op de huurcommissies][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003222
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003222
  - number: '55'
    text: |-
      Indien het bij koninklijke boodschap van 2 juli 1998 ingediende voorstel van wet tot vaststelling van
      [titel 7.4 (Huur) van het Burgerlijk Wetboek ][ref1](kamerstukken II 1997/98, 26 089, nrs. 1–2), na tot wet te zijn
      verheven, in werking treedt, treedt deze wet op hetzelfde tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '56'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet huurprijzen woonruimte.'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel56
