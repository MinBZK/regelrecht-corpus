  - number: '53'
    text: |-
      Onze Minister zendt binnen drie jaar na inwerkingtreding van [artikel 4a][ref1] van de Uitvoeringswet huurprijzen
      woonruimte aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de beslechting van de
      geschillen, bedoeld in artikel 4a, door de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
  - number: 53a
    text: |-
      Onverminderd [artikel 53][ref1] zendt Onze Minister voor Wonen en Rijksdienst binnen vijf jaar na inwerkingtreding
      van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de
      praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel53
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel53a
