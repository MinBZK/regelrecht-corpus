$id: uitvoeringswet_huurprijzen_woonruimte
regulatory_layer: WET
publication_date: '2025-06-13'
valid_from: '2019-07-01'
bwb_id: BWBR0014315
url: https://wetten.overheid.nl/BWBR0014315/2019-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is tegelijk met het voorstel van wet tot herziening van
    Boek 7A van het Burgerlijk Wetboek, waarbij een aantal bepalingen van de Huurprijzenwet woonruimte naar de nieuwe
    titel 7.4 van Boek 7 van dat wetboek wordt overgeheveld, de overige bepalingen van de Huurprijzenwet woonruimte
    en die van de Wet op de huurcommissies te integreren in een nieuw wetsvoorstel en deze bepalingen waar mogelijk te
    vereenvoudigen, alsmede op een aantal plaatsen inhoudelijke wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
  - number: 1.1.ao
    text: |-
      *bestuur:* bestuur als bedoeld in [artikel 3a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 3a
        hoofdstuk: II
        paragraaf: '1'
  - number: 1.1.a
    text: |-
      *gebrek:* gebrek als bedoeld in [artikel 7:241 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel241
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '241'
  - number: 1.1.b
    text: '*huurcommissie:* huurcommissie als bedoeld in artikel 3a;'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
  - number: 1.1.c
    text: |-
      *inflatiepercentage:* het onmiddellijk voorafgaand aan de datum van 1 juli, ieder jaar in januari door het Centraal
      Bureau voor de Statistiek bekendgemaakte percentage, waarmee de consumentenprijzen (alle huishoudens) ten opzichte
      van het aan die bekendmaking voorafgaande jaar zijn verhoogd;
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
  - number: 1.1.d
    text: '*Onze Minister:* Onze Minister voor Wonen en Rijksdienst;'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
  - number: 1.1.e
    text: |-
      *zittingscommissie:* zittingscommissie als bedoeld in [artikel 21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel21
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '21'
        hoofdstuk: V
        paragraaf: '1'
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder woonruimte, zelfstandige woning, woonwagen,
      standplaats, prijs, huurprijs, huishoudinkomen, inkomenstoetsjaar, peiljaar, kosten voor nutsvoorzieningen met
      een individuele meter, servicekosten en energieprestatievergoeding verstaan hetgeen daaronder wordt verstaan in
      [afdeling 5 van titel 7.4 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '5'
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op overeenkomsten van huur en verhuur van woonruimte die een gebruik betreffen, dat
      naar zijn aard slechts van korte duur is.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel2
  - number: '3.1'
    text: |-
      Op huurovereenkomsten waarop ingevolge
      __REF000___________________________________________________________________________________________________________
      ________________ ten dele van toepassing is, is deze wet slechts van toepassing voorzover dat uit die onderafdeling
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur wordt het in [artikel 7:247 van het Burgerlijk Wetboek][ref1] bedoelde bedrag
      van de huurprijs bij aanvang van de bewoning vastgesteld, waarboven ingevolge dat artikel voornoemde onderafdeling
      ten dele van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
  - number: 3a.1
    text: Er is een huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3a
  - number: 3a.2
    text: |-
      De huurcommissie bestaat uit een bestuur en minimaal vier en maximaal tien zittingsvoorzitters. Daarnaast bestaat
      de huurcommissie uit zittingsleden uit de kring van huurders onderscheidenlijk de kring van verhuurders. Voor de
      behandeling van geschillen als bedoeld in [artikel 4a][ref1] kunnen ook personen van buiten de kring van huurders
      onderscheidenlijk de kring van verhuurders zittingslid zijn. Het bestuur bestaat uit een voorzitter en een
      plaatsvervangend voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
  - number: 3a.3
    text: |-
      Het bestuur en de zittingsvoorzitters hebben tot taak binnen de huurcommissie de eenheid en de kwaliteit van de
      uitspraken, adviezen en verklaringen te bevorderen. Zij kunnen met het oog hierop regels stellen. Bij de uitvoering
      van deze taak treden zij niet in de procesrechtelijke behandeling van, de inhoudelijke beoordeling van alsmede de
      beslissing in een concrete zaak.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3a
  - number: 3a.4
    text: |-
      Indien ten aanzien van het stellen van de regels, bedoeld in het derde lid, tussen het bestuur enerzijds en de
      zittingsvoorzitters gezamenlijk anderzijds een verschil van mening bestaat, beslist het bestuur. Indien binnen het
      bestuur een verschil van mening bestaat, beslist de voorzitter. Indien binnen de kring van zittingsvoorzitters een
      verschil van mening bestaat, wordt onderling bij meerderheid van stemmen beslist, waarbij bij een staking van de
      stemmen binnen die kring het bestuur beslist.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3a
  - number: 3a.5
    text: |-
      In afwijking van [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1], heeft het bestuur, in plaats van
      het zelfstandig bestuursorgaan, de bevoegdheden en taken die zijn genoemd in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: 3b.1
    text: |-
      De voorzitter, de plaatsvervangend voorzitter en de zittingsvoorzitters worden door Onze Minister benoemd,
      geschorst en ontslagen. De voorzitter en de plaatsvervangend voorzitter worden benoemd voor een tijdvak van zes
      jaar en kunnen voor maximaal een aansluitend tijdvak van zes jaar als voorzitter onderscheidenlijk plaatsvervangend
      voorzitter worden herbenoemd. De zittingsvoorzitters worden over de benoeming en herbenoeming van de voorzitter
      en de plaatsvervangend voorzitter gehoord. De zittingsvoorzitters worden benoemd voor een tijdvak van vier jaar
      en kunnen voor maximaal twee aansluitende tijdvakken van vier jaar als zittingsvoorzitter worden herbenoemd. Het
      bestuur wordt over de benoeming en herbenoeming van de zittingsvoorzitters gehoord.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3b
  - number: 3b.2
    text: |-
      Aan de voorzitter en de zittingsvoorzitters moet op grond van het afleggen van een examen van een
      opleiding in het wetenschappelijk onderwijs door een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht zijn verleend, dan wel moeten die voorzitter
      en die zittingsvoorzitters op grond van het afleggen van een examen van een opleiding aan een universiteit dan wel
      de Open Universiteit waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft, het recht
      om de titel meester te voeren hebben verkregen, of blijk hebben gegeven op andere wijze de voor de functie van
      voorzitter onderscheidenlijk zittingsvoorzitter benodigde kennis te hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 3b.3
    text: |-
      Onverminderd [artikel 13, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], mogen de
      voorzitter, de plaatsvervangend voorzitter en de zittingsvoorzitters niet metterdaad betrokken zijn
      bij de uitoefening van een bedrijf dat werkzaam is of mede werkzaam is op het gebied van woonruimte,
      noch is het hen toegestaan beroepsmatig betrokken te zijn bij het beheer van en de beschikking
      over woonruimte dan wel deel uit te maken van het bestuur van een vereniging, vennootschap of
      stichting die daarbij is betrokken, of aangesloten te zijn bij een bewonerscommissie als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op het overleg huurders verhuurder][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 3b.4
    text: |-
      De voorzitter, de plaatsvervangend voorzitter en de zittingsvoorzitters genieten een bezoldiging, een vergoeding
      voor reis- en verblijfkosten en verdere vergoedingen volgens bij ministeriële regeling te geven regels. Hun
      rechtspositie wordt nader geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3b
  - number: 3c
    text: Het bestuur geeft leiding aan de werkzaamheden van de huurcommissie en de administratieve ondersteuning.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3c
  - number: 3d.1
    text: |-
      De zittingsleden worden op voordracht van het bestuur door Onze Minister benoemd, geschorst en ontslagen. De
      voordracht vindt plaats na overleg tussen het bestuur en de door Onze Minister daartoe aangewezen betrokken
      organisaties, die geacht kunnen worden de belangen van de huurders, onderscheidenlijk de belangen van de
      verhuurders te behartigen. De zittingsleden worden benoemd voor een tijdvak van vier jaar en kunnen voor maximaal
      twee aansluitende tijdvakken van vier jaar als zittingslid worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3d
  - number: 3d.2
    text: |-
      Tot zittingslid worden slechts benoemd personen die over voldoende deskundigheid beschikken om bij te dragen aan
      een behoorlijke uitoefening van de ingevolge de wet aan de huurcommissie opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3d
  - number: 3d.3
    text: |-
      De benoeming van de zittingsleden geschiedt zodanig dat de belangen van de huurders, onderscheidenlijk de belangen
      van de verhuurders gelijkelijk in de huurcommissie zijn vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3d
  - number: 3d.4
    text: Onze Minister neemt binnen zes weken nadat de voordracht is gedaan een beslissing over de benoeming.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3d
  - number: 3d.5
    text: |-
      De zittingsleden genieten een vergoeding voor reis- en verblijfkosten en verdere vergoedingen volgens bij
      ministeriële regeling te geven regels.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3d
  - number: 3e
    text: |-
      Onverminderd [artikel 12, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], worden de voorzitter,
      de plaatsvervangend voorzitter en de zittingsvoorzitters ook ontslagen indien zij de leeftijd van zeventig jaren
      hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3e
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: 3f.1
    text: |-
      Het bestuur stelt een bestuursreglement vast, gehoord de zittingsvoorzitters. Het reglement behoeft de
      goedkeuring van Onze Minister. [Artikel 11, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3f
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
  - number: 3f.2
    text: |-
      In het bestuursreglement worden de hoofdlijnen van de inrichting en de werkwijze van de organisatie van de
      huurcommissie, alsmede de zittingslocaties vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3f
  - number: 3g.1
    text: |-
      Er is een Raad van Advies. De Raad bestaat uit negen leden, die afkomstig zijn uit de door Onze Minister aangewezen
      organisaties van huurders en verhuurders en onafhankelijke organisaties of personen, waarbij die organisaties
      van huurders en verhuurders in de Raad gelijkelijk zijn vertegenwoordigd. De leden hebben een deskundigheid die
      relevant is in het kader van de advisering, bedoeld in het vijfde lid, en mogen niet tegelijkertijd deel uitmaken
      van de huurcommissie of van een zittingscommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3g
  - number: 3g.2
    text: |-
      De leden worden door Onze Minister benoemd, geschorst en ontslagen. Zij worden benoemd voor een tijdvak van vier
      jaar en kunnen voor een aansluitend tijdvak van vier jaar als lid van de Raad worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3g
  - number: 3g.3
    text: |-
      Onze Minister stelt met inachtneming van het eerste lid bij iedere benoeming de door hem daartoe aangewezen
      organisaties, die geacht kunnen worden de belangen van de huurders, onderscheidenlijk de belangen van de
      verhuurders, te behartigen, gedurende negen weken in de gelegenheid een aanbeveling te doen. Indien binnen een
      categorie van organisaties, die geacht kunnen worden de belangen van de huurders, onderscheidenlijk de belangen
      van de verhuurders, te behartigen, meer dan één organisatie is aangewezen om een aanbeveling te doen, stelt Onze
      Minister de betrokken organisaties slechts in de gelegenheid gezamenlijk een aanbeveling te doen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3g
  - number: 3g.4
    text: |-
      De benoeming van de leden die afkomstig zijn uit de door Onze Minister aangewezen onafhankelijke organisaties
      of personen vindt plaats op voordracht van het bestuur en na overleg tussen het bestuur en die organisaties of
      personen. Onze Minister neemt binnen zes weken na het doen van de voordracht een beslissing over de benoeming.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3g
  - number: 3g.5
    text: |-
      De Raad adviseert het bestuur over algemene aspecten van de huurgeschillenbeslechting, bedoeld in
      [artikel 4][ref1], en de beslechting van de geschillen, bedoeld in [artikel 4a][ref2], alsmede over de
      meerjarenstrategie, de ontwerpbegroting, het conceptjaarplan, de conceptjaarrekening en het conceptjaarverslag en
      kan het op verzoek dan wel uit eigen beweging in kennis stellen van de binnen de Raad levende standpunten. De Raad
      wordt voorts over de benoeming, de herbenoeming en het ontslag, behoudens het ontslag vanwege het bereiken van de
      voor hen geldende pensioengerechtigde leeftijd, van de voorzitter en de plaatsvervangend voorzitter gehoord. In het
      bestuursreglement, bedoeld in [artikel 3f][ref3], worden nadere regels gesteld omtrent de uitoefening van de taken
      en de bevoegdheden van de Raad en de wijze waarop het bestuur met de Raad overleg voert.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel3f
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3g
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: 3f
        hoofdstuk: II
        paragraaf: '1'
  - number: 3g.6
    text: |-
      [Artikel 3d, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3d
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3g
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 3d
        hoofdstuk: II
        paragraaf: '1'
  - number: 3h
    text: Onze Minister voorziet in de administratieve ondersteuning van de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3h
  - number: 3i.1
    text: |-
      Het bestuur houdt een openbaar register aan, waarin met weglating van de namen
      van de betrokken huurders, verhuurders, bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op het overleg huurders verhuurder][ref1] en huurdersorganisaties
      als bedoeld in artikel 1, eerste lid, onderdeel f, van die wet de slotwoorden van de uitspraken van de
      huurcommissie en van de voorzittersuitspraken zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3i
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 3i.2
    text: Bij ministeriële regeling kunnen regels worden gegeven omtrent de inrichting van het register.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3i
  - number: 3j.1
    text: |-
      In afwijking van [artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], strekt de
      bevoegdheid van Onze Minister tot het vernietigen van besluiten zich niet uit tot de uitspraken, de adviezen en de
      verklaringen van de huurcommissie onderscheidenlijk de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3j
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 3j.2
    text: |-
      Onze Minister treedt bij de uitvoering van de bevoegdheden, toegedeeld bij of krachtens de wet en de in het eerste
      lid genoemde wet niet in de procedurele behandeling van, de inhoudelijke beoordeling van alsmede de beslissing in
      een concrete zaak of in categorieën van zaken.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel3j
  - number: '4.1'
    text: |-
      De huurcommissie heeft de in het tweede tot en met vijfde lid en in de [artikelen 4a][ref1] en [5][ref2]
      aangegeven taken.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '4.2'
    text: 'De huurcommissie doet uitspraak:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
  - number: 4.2.a
    text: |-
      ingevolge [artikel 7:249 van het Burgerlijk Wetboek][ref1] over de redelijkheid van de overeengekomen
      aanvangshuurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
  - number: 4.2.b
    text: |-
      ingevolge [artikel 7:253 van het Burgerlijk Wetboek][ref1] over de redelijkheid van het voorstel tot verhoging van
      de huurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: 4.2.c
    text: |-
      ingevolge [artikel 7:254 van het Burgerlijk Wetboek][ref1] over de redelijkheid van het voorstel tot verlaging van
      de huurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel254
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '254'
  - number: 4.2.d
    text: |-
      ingevolge [artikel 7:255 van het Burgerlijk Wetboek][ref1] over het bedrag van de verhoging van de huurprijs na de
      totstandkoming van voorzieningen, veranderingen of toevoegingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
  - number: 4.2.e
    text: |-
      ingevolge [artikel 7:257 van het Burgerlijk Wetboek][ref1] over de in rekening te brengen huurprijs bij
      vermindering van het woongenot als gevolg van een gebrek;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: 4.2.f
    text: |-
      ingevolge [artikel 7:258 van het Burgerlijk Wetboek][ref1] over de huurprijs en het voorschotbedrag aan kosten voor
      nutsvoorzieningen met een individuele meter en servicekosten indien tussen partijen slechts een prijs en niet een
      huurprijs is overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel258
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '258'
  - number: 4.2.g
    text: |-
      ingevolge [artikel 7:260 van het Burgerlijk Wetboek][ref1] over de betalingsverplichting met betrekking tot de
      kosten voor nutsvoorzieningen met een individuele meter en servicekosten;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: 4.2.h
    text: |-
      ingevolge [artikel 7:261 van het Burgerlijk Wetboek][ref1] over het voorschotbedrag van de kosten voor
      nutsvoorzieningen met een individuele meter;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '261'
  - number: 4.2.i
    text: |-
      ingevolge [artikel 7:261a van het Burgerlijk Wetboek][ref1] over de energieprestatievergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 261a
  - number: '4.3'
    text: |-
      De huurcommissie doet uitspraak in gevallen waarin als gevolg van een uitspraak als bedoeld in de
      [artikelen 7:249][ref1] en [7:257 van het Burgerlijk Wetboek][ref2] de in rekening te brengen huurprijs in verband
      met gebreken is verlaagd, omtrent het verholpen zijn van die gebreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '257'
  - number: '4.4'
    text: |-
      De huurcommissie doet uitspraak indien ingevolge [artikel 20, zesde lid][ref1], verzet is gedaan tegen een
      uitspraak van de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel20
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '20'
        hoofdstuk: IV
  - number: '4.5'
    text: |-
      Indien de verhuurder een door de huurder bij hem schriftelijk ingediende klacht over de gedraging van de verhuurder
      in het kader van de door de verhuurder op basis van de tussen partijen geldende huurovereenkomst aan de huurder
      geleverde producten en verrichte diensten van de huurder niet binnen een redelijke termijn na indiening van die
      klacht inhoudelijk heeft behandeld dan wel indien de huurder niet instemt met de beoordeling van die klacht door
      de verhuurder, kan de huurder tot uiterlijk een jaar na het tijdstip waarop de gedraging van de verhuurder heeft
      plaatsgevonden de huurcommissie verzoeken uitspraak te doen in het geschil dat voortvloeit uit die klacht. Een
      gedraging van een persoon die werkzaam is onder de verantwoordelijkheid van de verhuurder, wordt aangemerkt als
      een gedraging van die verhuurder. Onder een gedraging wordt niet verstaan een gedraging ten aanzien van het toe- en
      afwijzen van een woonruimte, een wanbetaling, een huurbeëindiging of het afsluiten van nutsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
  - number: '4.6'
    text: |-
      De huurcommissie is niet bevoegd een uitspraak te doen indien het verzoek, bedoeld in het vijfde lid, betrekking
      heeft op:
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
  - number: 4.6.a
    text: een gedraging ten aanzien waarvan door een rechterlijke instantie uitspraak is gedaan,
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
  - number: 4.6.b
    text: een gedraging ten aanzien waarvan een procedure bij een rechterlijke instantie aanhangig is.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4
  - number: 4a
    text: 'De huurcommissie doet uitspraak in geschillen over:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4a
  - number: 4a.a
    text: |-
      het voeren van overleg en het verschaffen van informatie als bedoeld in de
      [Wet op het overleg huurders verhuurder][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: 4a.b
    text: |-
      het bevorderen van de werkzaamheden van een bewonerscommissie als bedoeld in [die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: 4a.c
    text: |-
      het vergoeden van kosten van een huurdersorganisatie als bedoeld in [die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: 4a.d
    text: |-
      overige verplichtingen die voortvloeien uit [die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: 4a.e
    text: |-
      het voeren van overleg als bedoeld in de [artikelen 43, tweede lid][ref1], [53, tweede lid, tweede volzin][ref2] en
      [55b, tweede lid, van de Woningwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel55b
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 55b
  - number: '5.1'
    text: |-
      De huurcommissie verstrekt desverzocht aan de rechter nadere inlichtingen over een door haar gedane uitspraak,
      alsmede, ingeval zij geen uitspraak heeft gedaan, indien de rechter geacht kan worden daarbij belang te hebben,
      over de aan een woonruimte toe te kennen kwaliteit en een voor die woonruimte redelijk te achten huurprijs.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel5
  - number: '5.2'
    text: |-
      De huurcommissie verstrekt desverzocht verklaringen aan Onze Minister en aan publiekrechtelijke lichamen die
      geacht kunnen worden daarbij belang te hebben, over de aan een woonruimte toe te kennen kwaliteit, de gebreken
      ten aanzien van die woonruimte en een voor die woonruimte redelijk te achten huurprijs. De hierbedoelde verklaring
      wordt niet gegeven, indien het belang van de verklaring is gelegen in de beoordeling door de verzoeker van een
      huurovereenkomst als bedoeld in [artikel 3][ref1]. Bij ministeriële regeling kunnen voor de uitvoering van de in de
      eerste volzin bedoelde taak nadere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: '5.3'
    text: |-
      De huurcommissie geeft ten aanzien van een huurovereenkomst als bedoeld in [artikel 3][ref1] desverzocht advies
      over aangelegenheden waaromtrent de huurcommissie bevoegd zou zijn uitspraak te doen indien [artikel 3][ref2]
      daaraan niet in de weg zou staan. De huurcommissie geeft een dergelijk advies slechts voorzover in de
      huurovereenkomst of anderszins tussen partijen is afgesproken dat de desbetreffende aangelegenheden bij geschil aan
      de huurcommissie worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel3
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: '6.1'
    text: 'De voorzitter heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel6
  - number: 6.1.a
    text: |-
      in afwijking van [artikel 4, eerste lid][ref1], in de in het tweede, derde en vijfde lid van dat artikel aangegeven
      gevallen en over geschillen als bedoeld in [artikel 4a][ref2] uitspraak te doen indien ten aanzien van een aan de
      huurcommissie gedaan verzoek een van de in [artikel 20, eerste lid][ref3], bedoelde gevallen zich voordoet;


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel20
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '20'
        hoofdstuk: IV
  - number: 6.1.b
    text: |-
      in de gevallen van een verzoek van de Belastingdienst/Toeslagen als bedoeld in
      [artikel 5, tweede lid, van de Wet op de huurtoeslag][ref1] binnen zes weken een verklaring te verstrekken omtrent
      de redelijkheid van de huurprijs en de juistheid van andere gegevens betreffende de woonruimte waarvoor een
      aanvraag om een huurtoeslag is ingediend, een en ander voorzover van belang voor de toepassing van genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '5'
  - number: '6.2'
    text: |-
      De voorzitter kan zich bij de uitoefening van de taken, bedoeld in het eerste lid, laten vervangen door een
      zittingsvoorzitter.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel6
  - number: '7.1'
    text: |-
      Voor het door de huurcommissie doen van een uitspraak als bedoeld in [artikel 4, tweede, derde of vijfde lid][ref1],
      is door de verzoeker een voorschot op de voor hem geldende vergoeding aan de Staat, bedoeld in het tweede lid,
      verschuldigd of door de partij die niet de verzoeker is, de voor hem geldende vergoeding, bedoeld in dat lid.
      Het bedrag van dat voorschot en die vergoeding wordt bij algemene maatregel van bestuur vastgesteld, mede aan de
      hand van het gegeven of de verzoeker of de partij die niet de verzoeker is een huurder of een verhuurder is en
      het aantal malen in drie achtereenvolgende kalenderjaren dat de huurcommissie uitspraak heeft gedaan op basis van
      een verzoek als bedoeld in de [artikelen 7: 249][ref2] en [7: 258, derde lid, van het Burgerlijk Wetboek][ref3],
      en daarbij, gelet op de strekking van het verzoekschrift, heeft geoordeeld dat de verhuurder de in het ongelijk
      gestelde partij is. De huurcommissie kan van de krachtens de algemene maatregel van bestuur vastgestelde bedragen,
      bedoeld in de tweede volzin, afwijken voor zover de toepassing gelet op het belang dat die bedragen beogen te
      beschermen naar haar oordeel zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel258
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '258'
  - number: '7.2'
    text: |-
      Bij het doen van een uitspraak geeft de huurcommissie gemotiveerd aan welke partij en tot welk bedrag een
      vergoeding aan de Staat verschuldigd is. Indien de huurcommissie van oordeel is dat de huurder niet ingevolge
      [artikel 7:253, tweede lid, tweede volzin, van het Burgerlijk Wetboek][ref1] gegevens met betrekking tot het
      huishoudinkomen heeft verstrekt, kan zij gemotiveerd uitspreken dat de verhuurder deze vergoeding niet is
      verschuldigd. Deze vergoeding is, in andere gevallen dan dat, bedoeld in de tweede volzin, verschuldigd door de
      partij die naar het oordeel van de huurcommissie geheel of voor het grootste deel, gelet op de strekking van het
      verzoekschrift, de in het ongelijk gestelde partij is. Indien de huurcommissie, in andere gevallen dan dat, bedoeld
      in de tweede volzin, van oordeel is dat beide partijen in ongeveer gelijke mate in het ongelijk worden gesteld, kan
      zij gemotiveerd uitspreken dat elke partij de helft van de voor hem geldende vergoeding aan de Staat verschuldigd
      is. In gevallen waarin de voorzitter bevoegd is tot het doen van een uitspraak, komen de in de eerste tot en met
      vierde volzin bedoelde bevoegdheden toe aan de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: '7.3'
    text: |-
      Indien naar het oordeel van de huurcommissie, gelet op de strekking van het verzoekschrift, en in andere gevallen
      dan die, bedoeld in het tweede lid, tweede volzin,
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: 7.3.a
    text: 'de verzoeker de geheel of voor het grootste deel in het gelijk gestelde partij is, wordt:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: 7.3.a.1°
    text: de bij wijze van voorschot betaalde voor hem geldende vergoeding terugbetaald, en
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: 7.3.a.2°
    text: bij de partij die niet de verzoeker is, de voor hem geldende vergoeding ingevorderd, dan wel
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: 7.3.b
    text: 'beide partijen in ongeveer gelijke mate in het ongelijk worden gesteld, wordt:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: 7.3.b.1°
    text: de helft van de bij wijze van voorschot door de verzoeker betaalde voor hem geldende vergoeding terugbetaald, en
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: 7.3.b.2°
    text: bij de partij die niet de verzoeker is, de helft van de voor hem geldende vergoeding ingevorderd.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: '7.4'
    text: |-
      Het bestuur roept de verzoeker bij schriftelijk bericht op, onder kennisgeving van de ontvangst van het verzoek,
      tot betaling van het in het eerste lid bedoelde voorschot op de vergoeding, voor zover dit op dat tijdstip nog niet
      is voldaan, binnen vier weken na de datum van verzending van dat bericht.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: '7.5'
    text: |-
      Ingeval de verzoeker het voorschot op de vergoeding niet binnen de in het vierde lid genoemde termijn heeft
      voldaan, wordt het verzoek niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de
      verzoeker in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: '7.6'
    text: 'Het betaalde voorschot op de vergoeding:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: 7.6.a
    text: |-
      wordt aan de verzoeker terugbetaald indien tussen partijen een vaststellingsovereenkomst als bedoeld in
      [artikel 7: 900 van het Burgerlijk Wetboek][ref1] is gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel900
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '900'
  - number: 7.6.b
    text: |-
      wordt voor de helft aan de verzoeker terugbetaald, indien de verzoekende partij binnen drie weken na verzending van
      het rapport van het voorbereidend onderzoek, bedoeld in [artikel 28, derde lid][ref1], te kennen geeft het geschil
      niet voort te zetten;


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel28
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '28'
        hoofdstuk: V
        paragraaf: '2'
  - number: 7.6.c
    text: wordt niet aan de verzoeker terugbetaald indien het verzoek na die termijn wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: '7.7'
    text: |-
      Het bestuur roept de partij die niet de verzoeker is bij schriftelijk bericht op tot betaling van de in het
      derde lid, onderdeel a, onder 2°, of onderdeel b, onder 2°, bedoelde vergoeding binnen vier weken na de datum van
      verzending van dat bericht. Onze Minister kan die vergoeding invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: '7.8'
    text: |-
      De voorzitter is bevoegd op verzoek van de verzoeker of de partij die niet de verzoeker is vrijstelling te verlenen
      van de aan de Staat verschuldigde vergoeding, bedoeld in het eerste lid en tweede lid. Zolang niet is beslist op
      een aanvraag om vrijstelling, wordt de in het vierde en zevende lid genoemde termijn opgeschort. Bij ministeriële
      regeling wordt bepaald in welke gevallen de voorzitter van de bevoegdheid, bedoeld in de eerste volzin, gebruik kan
      maken. [Artikel 6, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel6
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7.9'
    text: |-
      De huurcommissie kan bij gelijkluidende of nagenoeg gelijkluidende verzoeken ten aanzien van de partij die niet de
      verzoeker is en een verhuurder is, indien deze, naar het oordeel van de huurcommissie, gelet op de strekking van
      het verzoekschrift, de geheel of voor het grootste deel in het ongelijk gestelde partij is, dan wel in ongeveer
      gelijke mate als de partij die de verzoeker is in het ongelijk wordt gesteld, afwijken van het eerste lid, eerste
      volzin, voor zover toepassing gelet op het belang dat die volzin beoogt te beschermen naar haar oordeel zal leiden
      tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
  - number: '7.10'
    text: |-
      Indien de partij die, gelet op de strekking van het verzoekschrift, in het ongelijk wordt gesteld, uitsluitend
      in het ongelijk wordt gesteld op grond van een eigen oordeel van de huurcommissie ten aanzien van de waardering
      van de energieprestatie van de woonruimte, dat afwijkt van een voor die woonruimte, overeenkomstig de op grond
      van [artikel 120 van de Woningwet][ref1] gegeven regels omtrent de energieprestatie van gebouwen, afgegeven
      energieprestatiecertificaat, is die partij, in afwijking van het eerste lid, eerste volzin, geen vergoeding als
      bedoeld in dat lid verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
  - number: 7a.1
    text: |-
      Voor het door de huurcommissie doen van een uitspraak als bedoeld in [artikel 4a][ref1], is door de verzoeker een
      vergoeding aan de Staat verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
  - number: 7a.2
    text: Het bedrag van de in het eerste lid bedoelde vergoeding wordt bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7a
  - number: 7a.3
    text: |-
      Op verzoek van een verzoeker, is de voorzitter bevoegd vrijstelling te verlenen van de aan de Staat verschuldigde
      vergoeding, bedoeld in het eerste lid. Bij ministeriële regeling wordt bepaald in welke gevallen de voorzitter
      van de bevoegdheid, bedoeld in de eerste volzin, gebruik kan maken. [Artikel 6, tweede lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel6
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 7a.4
    text: |-
      Het [vierde, vijfde en zesde lid van artikel 7][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '8'
    text: |-
      Voor het door de huurcommissie uitbrengen van een advies als bedoeld in [artikel 5, derde lid][ref1], is door de
      verzoeker een vergoeding aan de Staat verschuldigd, waarvan het bedrag bij algemene maatregel van bestuur wordt
      vastgesteld, mede aan de hand van het gegeven of de verzoeker een huurder of een verhuurder is.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 8a
    text: |-
      Onder de naam verhuurderbijdrage legt de huurcommissie een bijdrage op ter bestrijding van de geraamde lasten van
      de huurcommissie in één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8a
  - number: 8b
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *bijdragejaar:* kalenderjaar waarover de verhuurderbijdrage is
      verschuldigd;
        - *huurwoning:* in Nederland gelegen voor verhuur bestemde woning die ingevolge
      [artikel 16 van de Wet waardering onroerende zaken][ref1] als één onroerende zaak
      wordt aangemerkt en waarvan de huurprijs niet hoger is dan het bedrag, genoemd in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2], met uitzondering van een woning die
      wordt verhuurd in het kader van het hotel-, pension-, kamp- en vakantiebestedingsbedrijf aan personen die in die
      woning voor een korte periode verblijf houden.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 8c
    text: |-
      Indien er ter zake van een huurwoning meer dan één genothebbende krachtens eigendom, bezit of beperkt recht
      is, wordt voor de verhuurderbijdrage de huurwoning in aanmerking genomen bij degene aan wie de beschikking,
      bedoeld in [artikel 22 van de Wet waardering onroerende zaken][ref1], ter zake van die huurwoning op de voet van
      [artikel 24, derde en vierde lid, van die wet][ref2] is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel24
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '24'
  - number: 8d
    text: |-
      Bijdrageplichtig voor de verhuurderbijdrage is de verhuurder die op grond van
      [artikel 1.9 van de Wet maatregelen woningmarkt 2014 II][ref1] over het kalenderjaar voorafgaande aan het
      bijdragejaar in de verhuurderheffing is betrokken en die bij aanvang van dat kalenderjaar het genot krachtens
      eigendom, bezit of beperkt recht heeft van meer dan 50 huurwoningen.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
  - number: 8e.1
    text: |-
      De totale opbrengst van de verhuurderbijdrage komt overeen met het geraamde bedrag op de begroting van Wonen en
      Rijksdienst over het bijdragejaar.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8e
  - number: 8e.2
    text: |-
      Om de verhuurderbijdrage te berekenen wordt het geraamde bedrag omgeslagen over de verhuurders naar rato van het
      aantal huurwoningen, waarbij de eerste 50 woningen niet worden meegeteld.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8e
  - number: 8f
    text: De verhuurderbijdrage wordt verschuldigd op uiterlijk 31 december van het bijdragejaar.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8f
  - number: 8g
    text: De huurcommissie kan de verhuurderbijdrage invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel8g
  - number: '9.1'
    text: Een verzoek aan de huurcommissie wordt schriftelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9
  - number: '9.2'
    text: |-
      De huurcommissie toetst bij aan haar gedane verzoeken of voldaan is aan de voor die verzoeken bij of krachtens
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref1], bij de [Wet op het overleg huurders verhuurder][ref2] en bij
      of krachtens deze wet gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
      - id: ref2
        bwb_id: BWBR0009810
  - number: '9.3'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:260, eerste lid, van het Burgerlijk Wetboek][ref1] is het
      verzoek niet-ontvankelijk indien het voorwerp van geschil een bedrag van minder dan € 36 beloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: '9.4'
    text: |-
      In geval van een verzoek als bedoeld in de [artikelen 7: 254][ref1], [7: 255, tweede lid][ref2],
      [7: 257, tweede lid][ref3], [7: 261, derde lid, van het Burgerlijk Wetboek][ref4] is het verzoek niet-ontvankelijk
      indien het voorwerp van geschil een bedrag van minder dan € 3 per maand beloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel255
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel261
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '255'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '257'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '261'
  - number: '9.5'
    text: De bedragen, genoemd in het derde en vierde lid, kunnen bij ministeriële regeling hoger of lager worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9
  - number: 9a.1
    text: |-
      Indien binnen een wooncomplex als bedoeld in [artikel 1 van de Wet op het overleg huurders verhuurder][ref1] sprake
      is van gelijkluidende of nagenoeg gelijkluidende verzoeken kunnen deze door ten minste de helft van de partijen
      die een woonruimte huren binnen dat wooncomplex of deel van dat wooncomplex collectief worden ingediend. Die
      partijen zijn daarbij elk het voorschot op de vergoeding aan de Staat, bedoeld in [artikel 7, tweede lid][ref2],
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: 9a.2
    text: |-
      Indien het verzoek naar het oordeel van de voorzitter niet voldoet aan de in het eerste lid genoemde
      vereisten, wordt het verzoek opgevat als per afzonderlijke woonruimte of groep van woonruimten ingediend.
      [Artikel 6, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel6
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 9a.3
    text: |-
      De huurcommissie kan ten aanzien van de partijen, bedoeld in het eerste lid, indien die, naar het oordeel van de
      huurcommissie, gelet op de strekking van het verzoekschrift , de geheel of voor het grootste deel in het ongelijk
      gestelde partijen zijn, dan wel in ongeveer gelijke mate als de partij die niet de verzoeker is in het ongelijk
      worden gesteld, afwijken van [artikel 7, eerste lid, eerste volzin][ref1], voor zover toepassing gelet op het
      belang dat die volzin beoogt te beschermen naar haar oordeel zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de waardering van de kwaliteit
      van een woonruimte, van de redelijkheid van de huurprijs en van wijziging daarvan, waarbij onderscheid kan
      worden gemaakt tussen woonruimte waarvoor de eigenaar een voor die woonruimte, overeenkomstig de op grond
      van [artikel 120 van de Woningwet][ref1] gegeven regels omtrent de energieprestatie van gebouwen, afgegeven
      energieprestatiecertificaat aan de huurder heeft verstrekt of indien dat niet het geval is daartoe op grond van die
      regels wel verplicht was, en overige woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '120'
  - number: '10.2'
    text: |-
      Bij ministeriële regeling wordt het maximale huurverhogingspercentage vastgesteld. Dit percentage wordt vastgesteld
      mede aan de hand van het gegeven of het huishoudinkomen over het peiljaar of het inkomenstoetsjaar van de
      op het tijdstip van de in het voorstel tot verhoging van de huurprijs genoemde ingangsdatum in de woonruimte
      wonende huurder en overige bewoners hoger is dan het krachtens [artikel 48, eerste lid, van de Woningwet][ref1]
      bepaalde bedrag, die huurder of die overige bewoner de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt, die huurder deel uitmaakt van een
      huishouden van 4 of meer personen, en of die woonruimte een zelfstandige woning vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '11.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:249 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de overeengekomen huurprijs. Als een dergelijk verzoek wordt mede aangemerkt
      een verzoek ingevolge [artikel 6, eerste lid, aanhef en onderdeel b][ref2], indien een aanvraag om een huurtoeslag
      voor de desbetreffende woonruimte is ingediend binnen de in [artikel 7: 249 van het Burgerlijk Wetboek][ref3]
      bedoelde termijn en indien en zodra de voorzitter op dat verzoek een verklaring heeft afgegeven waaruit blijkt dat
      de overeengekomen huurprijs hoger is dan de bij de desbetreffende woonruimte behorende maximale huurprijsgrens.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel249
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '249'
  - number: '11.2'
    text: |-
      De huurcommissie toetst in dat geval de redelijkheid van de overeengekomen huurprijs aan de krachtens
      [artikel 10, eerste lid][ref1], gegeven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Indien de huurcommissie de overeengekomen huurprijs niet redelijk acht, vermeldt zij in haar uitspraak de huurprijs
      die zij redelijk acht.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel11
  - number: '11.4'
    text: |-
      In geval sprake is van een huurovereenkomst als bedoeld in [artikel 3][ref1] spreekt de huurcommissie,
      indien de beoordeling, bedoeld in het tweede lid, zou leiden tot een huurprijs boven de in
      [artikel 7:247 van het Burgerlijk Wetboek][ref2] genoemde grens, uit dat de door partijen overeengekomen
      huurprijs redelijk is. Indien de huurprijs na de uitspraak van de huurcommissie en in voorkomend geval na de
      vaststelling ervan door de rechter onherroepelijk is komen vast te staan en niet boven die grens uitkomt, is
      [artikel 7:247][ref3] op die huurovereenkomst niet langer van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel247
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '247'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '247'
  - number: '11.5'
    text: |-
      De huurcommissie beoordeelt de kwaliteit van de woonruimte en de redelijkheid van de huurprijs naar de toestand op
      de datum van ingang van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel11
  - number: '12.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:249 van het Burgerlijk Wetboek][ref1] spreekt de huurcommissie
      tevens uit of zij van oordeel is dat de overeengekomen huurprijs of de op grond van [artikel 11, derde lid][ref2],
      redelijk geachte huurprijs, gelet op de gebreken ten aanzien van de woonruimte, in rekening dient te worden
      gebracht. Indien de huurcommissie van oordeel is dat die huurprijs, gelet op de gebreken, niet in rekening dient
      te worden gebracht, geeft zij deze gebreken in de uitspraak aan en vermeldt zij een in verhouding tot die gebreken
      lagere huurprijs als de in rekening te brengen huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel11
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven die de huurcommissie bij de beoordeling van
      de redelijkheid van de in rekening te brengen huurprijs in acht neemt.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel12
  - number: '12.3'
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de in rekening te brengen lagere huurprijs,
      zijnde de ingangsdatum van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel12
  - number: '12.4'
    text: |-
      De huurcommissie bepaalt in de uitspraak dat, nadat de in die uitspraak genoemde gebreken zijn verholpen, de in
      rekening te brengen lagere huurprijs niet meer van toepassing is met ingang van de eerste dag van de maand, volgend
      op die waarin de opheffing van die gebreken heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel12
  - number: '12.5'
    text: |-
      Indien tussen huurder en verhuurder geen overeenstemming bestaat over het al dan niet verholpen zijn van de
      gebreken, doet de huurcommissie daarover op verzoek van de verhuurder uitspraak. In voorkomend geval geeft zij
      daarbij aan in welke maand de opheffing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel12
  - number: '13.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:253 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de huurprijsverhoging die staat vermeld in het daaraan ten grondslag liggende
      voorstel. De huurcommissie spreekt uit welke huurprijsverhoging zij redelijk acht, in welk geval zij tevens
      aangeeft tot welke huurprijs die huurprijsverhoging leidt, dan wel dat zij een huurprijsverhoging niet redelijk
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: '13.2'
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de huurprijsverhoging, zijnde de in het in het
      eerste lid bedoelde voorstel vermelde datum van ingang, dan wel een latere datum indien de wet zulks voorschrijft.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel13
  - number: '13.3'
    text: |-
      De huurcommissie toetst het voorstel tot huurprijsverhoging aan het krachtens [artikel 10, tweede lid][ref1],
      geldende maximale huurverhogingspercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.4'
    text: |-
      Bij de beoordeling van de kwaliteit van de woonruimte worden voorzieningen die de huurder onverplicht voor eigen
      rekening heeft aangebracht en waardoor het woongerief geacht kan worden te zijn gestegen, buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel13
  - number: '13.5'
    text: |-
      De huurcommissie toetst het voorstel tot huurprijsverhoging, indien de huurder bezwaar heeft gemaakt tegen de
      woningwaardering in het voorstel, dan wel indien de huurprijs, vermeerderd met de voorgestelde huurprijsverhoging,
      de maximale huurprijsgrens zou kunnen overschrijden, tevens aan de krachtens [artikel 10, eerste lid][ref1],
      gegeven regels met betrekking tot de waardering van de kwaliteit van een woonruimte. Daarbij vormt de
      huurcommissie slechts een eigen oordeel over de kwaliteit van de woonruimte, voorzover die kwaliteit al dan niet
      op onderdelen voorwerp van geschil is tussen partijen. De huurcommissie vormt zich daarbij geen eigen oordeel
      over de energieprestatie van de woonruimte, indien de eigenaar een voor die woonruimte, overeenkomstig de op
      grond van [artikel 120 van de Woningwet][ref2] gegeven regels omtrent de energieprestatie van gebouwen, afgegeven
      energieprestatiecertificaat aan de huurder heeft verstrekt. Indien sprake is van een voorstel tot verhoging
      van de huurprijs als bedoeld in [artikel 7: 252a, eerste lid, van het Burgerlijk Wetboek][ref3], toetst de
      huurcommissie, voor zover het huishoudinkomen in het peiljaar voorwerp van geschil is tussen partijen, tevens of
      dat huishoudinkomen lager is dan of gelijk is aan het in artikel 10, tweede lid, bedoelde bedrag, dan wel hoger is
      dan dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 252a
  - number: '13.6'
    text: |-
      De huurcommissie beoordeelt de kwaliteit van de woonruimte en de redelijkheid van de wijziging van de huurprijs
      naar de toestand, met uitzondering van de bepaling van de hoogte van het huishoudinkomen, op het tijdstip van de in
      het voorstel tot verhoging van de huurprijs genoemde ingangsdatum.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel13
  - number: '14.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:254 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de huurprijsverlaging die staat vermeld in het daaraan ten grondslag liggende
      voorstel. De huurcommissie spreekt uit welke huurprijsverlaging zij redelijk acht, in welk geval zij tevens
      aangeeft tot welke huurprijs die huurprijsverlaging leidt, dan wel dat zij een huurprijsverlaging niet redelijk
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel254
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '254'
  - number: '14.2'
    text: |-
      Indien sprake is van een voorstel tot verlaging van de huurprijs als bedoeld in
      [artikel 7:252b, eerste lid, van het Burgerlijk Wetboek][ref1]: a. toetst de huurcommissie, voor zover het
      huishoudinkomen voorwerp van geschil is tussen partijen, of dat huishoudinkomen in het peiljaar: 1°. gelijk is
      aan of lager is dan het in [artikel 14, derde lid, van de Wet op de huurtoeslag][ref2] bedoelde bedrag, of 2°.
      gelijk is aan of lager is dan het in [artikel 10, tweede lid][ref3], bedoelde bedrag, b. is de huurprijs na een
      daling van het huishoudinkomen als bedoeld in [artikel 7:252b, eerste lid, van het Burgerlijk Wetboek][ref4]
      niet hoger dan de huurprijs die zou hebben gegolden, indien die over het tijdvak dat loopt van het tijdstip
      van het doen van het voorstel, bedoeld in de aanhef van dat artikellid, tot het tijdstip dat twee jaar daaraan
      voorafgaat, mede gebaseerd was geweest op het lagere huishoudinkomen en het daarmee corresponderende lagere
      maximale huurverhogingspercentage, en c. is de huurprijs na een daling van het huishoudinkomen als bedoeld in
      [artikel 7:252b, eerste lid, aanhef en onder 1°, van het Burgerlijk Wetboek][ref5] voorts niet hoger dan het
      krachtens [artikel 3, tweede lid][ref6], vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
      [ref6]: https://wetten.overheid.nl/BWBR0014315#Artikel3
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252b
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 252b
      - id: ref5
        bwb_id: BWBR0005290
        artikel: 252b
      - id: ref6
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: '14.3'
    text: |-
      [Artikel 13, tweede, vierde, vijfde, eerste en tweede volzin, en zesde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel13
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:255 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de huurprijswijziging die zij redelijk acht. De huurcommissie vermeldt in de uitspraak dat de
      overeengekomen huurprijs redelijk is dan wel welke de huurprijs is die zij redelijk acht, alsmede de datum van
      ingang van de huurprijswijziging, zijnde de eerste dag van de maand, volgend op die waarin de voorzieningen,
      veranderingen of verbeteringen zijn gereedgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
  - number: '15.2'
    text: |-
      De huurcommissie toetst of het bedrag van de verhoging van de huurprijs in redelijke verhouding staat tot
      de door de verhuurder gemaakte kosten met betrekking tot de voorzieningen, veranderingen of toevoegingen. De
      [artikelen 10, eerste lid][ref1], en [13, vierde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel13
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '16.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:257, tweede lid, van het Burgerlijk Wetboek][ref1] doet de
      huurcommissie uitspraak of zij van oordeel is dat de overeengekomen huurprijs, in verband met de gebreken ten
      aanzien van de woonruimte, in rekening dient te worden gebracht. Indien de commissie van oordeel is dat die
      huurprijs, in verband met de gebreken, niet in rekening dient te worden gebracht, geeft zij deze gebreken in de
      uitspraak aan en vermeldt zij een in verhouding tot die gebreken lagere huurprijs als de in rekening te brengen
      huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: '16.2'
    text: |-
      De huurcommissie neemt bij haar oordeel de krachtens [artikel 12, tweede lid][ref1], vastgestelde regels in acht,
      met dien verstande dat de huurcommissie zich slechts een eigen oordeel over de gebreken vormt, voorzover deze aan
      de verhuurder door middel van de in [artikel 7:207 van het Burgerlijk Wetboek][ref2] bedoelde kennisgeving door de
      huurder zijn gemeld, alsmede over de gebreken die van zodanige aard of samenhang zijn dat ze ook zonder aanzegging
      aan de verhuurder bekend moesten zijn, zulks naar de toestand op het tijdstip waarop de bedoelde kennisgeving door
      de huurder is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel207
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '207'
  - number: '16.3'
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de in rekening te brengen lagere huurprijs,
      zijnde de eerste dag van de maand, volgend op die waarin de in het tweede lid bedoelde aanzegging door de huurder
      aan de verhuurder is verzonden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel16
  - number: '16.4'
    text: |-
      [Artikel 12, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:258 van het Burgerlijk Wetboek][ref1] oordeelt de huurcommissie
      dat de voorgestelde huurprijs redelijk is als deze niet lager dan 55% van de overeengekomen prijs en het
      voorgestelde voorschotbedrag voor de kosten voor nutsvoorzieningen en servicekosten niet lager dan 25% van de
      overeengekomen prijs is. Indien de huurcommissie van oordeel is dat de voorgestelde huurprijs niet redelijk is,
      stelt zij deze vast op 55% van de overeengekomen prijs en, voor zover nodig, het voorgestelde voorschotbedrag op
      25% van de overeengekomen prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel258
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '258'
  - number: '17.2'
    text: |-
      Indien de huurcommissie van oordeel is dat niet een huurprijs is overeengekomen, vermeldt zij in haar uitspraak
      dat de door haar uitgesproken huurprijs en het voorschotbedrag voor de servicekosten in de plaats treden van de
      overeengekomen prijs met ingang van de eerste dag van de maand, volgend op die waarin het verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel17
  - number: 17a.1
    text: |-
      Ingeval bij een verzoek als bedoeld in [artikel 7:249][ref1], [7:253][ref2], [7:254][ref3], [7:255][ref4],
      [7:257, tweede lid][ref5], [7:260][ref6] of [7:261, derde lid, van het Burgerlijk Wetboek][ref7], blijkt dat de
      huurovereenkomst meer omvat dan het enkele gebruik van de woonruimte en bij die overeenkomst slechts de hoogte van
      de prijs en niet die van de huurprijs is vastgesteld, kan de huurcommissie, voordat een uitspraak wordt gegeven,
      ambtshalve de huurprijs vaststellen op 55% van de overeengekomen prijs en, voor zover nodig, het voorschotbedrag
      voor de kosten voor nutsvoorzieningen met een individuele meter en servicekosten op 25% van de overeengekomen
      prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel254
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel255
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel260
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel261
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '253'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '254'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '255'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '257'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '260'
      - id: ref7
        bwb_id: BWBR0005290
        artikel: '261'
  - number: 17a.2
    text: |-
      [Artikel 17, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel17
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '17'
        hoofdstuk: III
        paragraaf: '7'
  - number: '18.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:260 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de betalingsverplichting van de huurder met betrekking tot de servicekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: '18.2'
    text: |-
      De huurcommissie toetst de kosten voor nutsvoorzieningen met een individuele meter aan de voor de berekening
      daarvan geldende wettelijke voorschriften en aan de redelijkheid.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de verhuurder gebruik heeft gemaakt van het formulier, genoemd in
      [artikel 7:260, derde lid, van het Burgerlijk Wetboek][ref1], toetst de huurcommissie de servicekosten aan de voor
      de berekening daarvan geldende wettelijke voorschriften en aan de redelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: '18.4'
    text: |-
      Indien de verhuurder geen gebruik heeft gemaakt van het formulier, bedoeld in
      [artikel 7:260, derde lid, van het Burgerlijk Wetboek][ref1], dan wel indien dat formulier onvolledig is ingevuld,
      stelt de huurcommissie de servicekosten vast op een bij ministeriële regeling vastgesteld bedrag of indien de zaak
      of dienst door de verhuurder niet is geleverd op € 0.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: '19.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:261 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van het voorschotbedrag voor de kosten voor nutsvoorzieningen met een individuele
      meter.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '261'
  - number: '19.2'
    text: |-
      De huurcommissie beoordeelt of het voorschotbedrag voor de kosten voor nutsvoorzieningen met een individuele meter,
      indien nodig herleid tot een bedrag per jaar, in aanzienlijke mate afwijkt van hetgeen in redelijke verhouding
      staat tot de in het desbetreffende jaar te verwachten kosten voor nutsvoorzieningen met een individuele meter.
      Indien de huurcommissie van oordeel is dat daarvan sprake is, spreekt zij uit welk voorschotbedrag van de kosten
      voor nutsvoorzieningen met een individuele meter in redelijke verhouding staat tot de te verwachten kosten voor
      nutsvoorzieningen met een individuele meter.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19
  - number: '19.3'
    text: |-
      De in het tweede lid bedoelde te verwachten kosten voor nutsvoorzieningen met een individuele meter worden gesteld
      op het bedrag van de kosten voor nutsvoorzieningen met een individuele meter, opgenomen in het laatstelijk in
      de drie voorafgaande kalenderjaren door de verhuurder verstrekte verrekenoverzicht inzake de desbetreffende of
      soortgelijke serviceposten, verhoogd met het percentage waarmee de consumentenprijsindex voor werknemersgezinnen
      sedertdien is verhoogd. Indien geen verrekenoverzicht in de in de eerste volzin bedoelde periode is verstrekt,
      worden bedoelde kosten gesteld op de daarvoor als gebruikelijk aan te merken kosten.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19
  - number: '19.4'
    text: |-
      De huurcommissie vermeldt in haar uitspraak dat het door haar uitgesproken voorschotbedrag in de plaats treedt van
      het overeengekomen voorschotbedrag met ingang van de eerste dag van de maand, volgend op die waarin het verzoek
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19
  - number: 19bis.1
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:261a van het Burgerlijk Wetboek][ref1] doet de
      huurcommissie uitspraak omtrent de redelijkheid van de betalingsverplichting van de huurder ter zake van de
      energieprestatievergoeding. De huurcommissie toetst daarbij aan de in de leden 2 en 3 bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19bis
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 261a
  - number: 19bis.2
    text: |-
      De energieprestatievergoeding is gebaseerd op een door de verhuurder gegarandeerde minimale productie van duurzaam
      opgewekte finale energie op basis van een gegarandeerde maximale netto warmtevraag en bedraagt ten hoogste een bij
      of krachtens algemene maatregel van bestuur vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19bis
  - number: 19bis.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de gevallen
      waarin en de voorwaarden waaronder de energieprestatievergoeding kan worden overeengekomen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19bis
  - number: 19a.1
    text: |-
      Indien de huurcommissie constateert dat sprake is van een schending door de verhuurder van een verplichting die
      voortvloeit uit de [Wet op het overleg huurders verhuurder][ref1] waardoor de verzoeker is benadeeld, kan zij
      bepalen dat, voor zover het geschil betrekking heeft op voorgenomen beleid van een verhuurder als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet op het overleg huurders verhuurder][ref2], de uitvoering van dat
      beleid wordt opgeschort totdat het verzuim is hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009810
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009810
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 19a.2
    text: |-
      Indien de huurcommissie wordt verzocht te bepalen dat een genomen besluit van een verhuurder als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet op het overleg huurders verhuurder][ref1], tot wijziging van zijn
      beleid niet mag worden uitgevoerd, kan de huurcommissie bepalen dat een zodanig besluit niet mag worden uitgevoerd,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 19a.2.a
    text: |-
      dat besluit afwijkt van een advies als bedoeld in [artikel 5, eerste lid, van die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '5'
  - number: 19a.2.b
    text: |-
      die verhuurder de beslissing tot afwijking van dat advies niet heeft onderbouwd, of hij naar het oordeel van de
      huurcommissie onder afweging van de betrokken belangen niet in redelijkheid tot afwijking van dat advies had kunnen
      komen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19a
  - number: 19a.3
    text: |-
      De huurcommissie doet in geval van een geschil over de hoogte van de vergoeding, bedoeld in
      [artikel 7, eerste lid, van de Wet op het overleg huurders verhuurder][ref1], uitspraak over de redelijkheid van
      die vergoeding. De huurcommissie spreekt uit welke vergoeding zij redelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '7'
  - number: 19aa
    text: |-
      Indien de huurcommissie constateert dat de klacht, bedoeld in [artikel 4, vijfde lid][ref1], betrekking heeft op
      een gedraging van de verhuurder als bedoeld in dat artikellid waardoor de huurder is benadeeld, kan zij uitspreken
      dat de klacht gegrond is.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19aa
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: 19b.1
    text: |-
      De verhuurder vraagt en gebruikt de gegevens, die overeenkomstig
      [artikel 7: 252a, vierde tot en met zesde lid, van het Burgerlijk Wetboek][ref1] worden verstrekt, uitsluitend voor
      het doen van een voorstel tot verhoging van de huurprijs als bedoeld in het eerste lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 19b.2
    text: |-
      De betrokken gegevens, bedoeld in het eerste lid, worden bewaard totdat op het betrokken voorstel, bedoeld in
      [artikel 7:252a, eerste lid, van het Burgerlijk Wetboek][ref1], onherroepelijk is beslist of de voorgestelde
      verhoging van de huurprijs geacht wordt te zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 19b.3
    text: |-
      De verhuurder voert ten behoeve van een getrouwe weergave van de uitvoering en een effectief
      uitvoeringsproces een zodanige administratie dat de juiste, volledige en tijdige vastlegging is
      gewaarborgd van de gegevens met betrekking tot het huishoudinkomen die verband houden met de toepassing van
      [artikel 7: 252a, vierde tot en met zesde lid, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 19b.4
    text: |-
      Een ieder die kennis neemt van de gegevens, die overeenkomstig
      [artikel 7: 252a, vierde tot en met zesde lid, van het Burgerlijk Wetboek][ref1] worden verstrekt, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit
      zijn taak de noodzaak tot mededeling voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 19b.5
    text: |-
      Indien de verhuurder in strijd handelt met het eerste, tweede, derde of vierde lid kan de inspecteur, bedoeld in
      [artikel 7:252a, tweede lid, onderdeel e, van het Burgerlijk Wetboek][ref1], het afgeven van de huishoudverklaring,
      bedoeld in het tweede lid, onderdeel c, van dat artikel, weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
  - number: 19c
    text: |-
      De rijksbelastingdienst verstrekt jaarlijks aan het bestuur een overzicht van, indien sprake is van een
      verhuurder die krachtens eigendom, bezit of beperkt recht het genot heeft van meer dan 50 huurwoningen, de
      naam-, adres- en woonplaatsgegevens en de gegevens over het aantal huurwoningen van de verhuurders die op
      grond van [artikel 1.9 van de Wet maatregelen woningmarkt 2014 II][ref1] over het kalenderjaar voorafgaande
      aan het bijdragejaar in de verhuurderheffing zijn betrokken ten behoeve van de heffing en de inning van de
      verhuurderbijdrage. Hierbij wordt uitgegaan van de gegevens van de verhuurderheffing zoals die uiterlijk op 30 juni
      van het bijdragejaar luiden alsmede de aanvullingen en correcties die uiterlijk op die datum hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
  - number: 19d.1
    text: |-
      Het bestuur vraagt en gebruikt de gegevens, bedoeld in [artikel 19c][ref1], uitsluitend voor het heffen en het
      innen van de verhuurderbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel19c
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 19c
        hoofdstuk: IIIa
  - number: 19d.2
    text: |-
      De betrokken gegevens, bedoeld in het eerste lid, worden bewaard totdat de verhuurderbijdrage onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19d
  - number: 19d.3
    text: |-
      Het bestuur voert ten behoeve van een getrouwe weergave van de uitvoering en een effectief uitvoeringsproces
      een zodanige administratie dat de juiste, volledige en tijdige vastlegging is gewaarborgd van de gegevens met
      betrekking tot de bijdrage.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel19d
  - number: 20.1.a
    text: |-
      De voorzitter doet onverwijld, in ieder geval binnen vier weken na het verstrijken van de in
      [artikel 7, vierde lid][ref1], genoemde termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft
      te worden gedaan, na het tijdstip waarop de aldaar bedoelde vergoeding van de verzoeker is ontvangen, of binnen
      vier weken na het voorbereidend onderzoek, bedoeld in [artikel 28][ref2], schriftelijk en met redenen omkleed
      uitspraak, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel28
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '28'
        hoofdstuk: V
        paragraaf: '2'
  - number: 20.1.a.1°
    text: het verzoek kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: 20.1.a.2°
    text: het verzoek kennelijk redelijk of niet redelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: 20.1.a.3°
    text: het voorstel dat ten grondslag ligt aan het verzoek, kennelijk redelijk of niet redelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: 20.1.a.4°
    text: de aan het verzoek ten grondslag liggende bezwaren kennelijk gegrond of ongegrond zijn of
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: 20.1.a.5°
    text: de bezwaren tegen het aan het verzoek ten grondslag liggende voorstel kennelijk ongegrond zijn.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: 20.1.b
    text: |-
      Onverminderd onderdeel a doet de voorzitter binnen vier maanden na het verstrijken van de in
      [artikel 7, vierde lid][ref1], genoemde termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft
      te worden gedaan, na het tijdstip waarop de aldaar bedoelde vergoeding van de verzoeker is ontvangen of binnen
      vier maanden na het voorbereidend onderzoek, bedoeld in [artikel 28][ref2], desverzocht tevens schriftelijk en
      met redenen omkleed uitspraak indien in de huurovereenkomst of anderszins tussen partijen is afgesproken dat de
      desbetreffende aangelegenheden bij geschil aan de voorzitter kunnen worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel28
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '28'
        hoofdstuk: V
        paragraaf: '2'
  - number: '20.2'
    text: |-
      Van een kennelijk redelijk verzoek is in ieder geval sprake in het geval, bedoeld in
      [artikel 7:253, vijfde lid, van het Burgerlijk Wetboek][ref1], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: 20.2.a
    text: |-
      de huurcommissie in een eerdere uitspraak heeft uitgesproken dat op grond van
      [artikel 7:257 van het Burgerlijk Wetboek][ref1] een lagere huurprijs redelijk is en de in die uitspraak genoemde
      gebreken nog niet zijn verholpen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: 20.2.b
    text: |-
      het percentage van de in het voorstel opgenomen huurverhoging het in [artikel 10, tweede lid][ref1], bedoelde
      maximale huurverhogingspercentage te boven gaat, in welk geval het verzoek slechts kennelijk redelijk is, voorzover
      het dat percentage niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20.3'
    text: |-
      De voorzitter vermeldt in voorkomende gevallen in de uitspraak, bedoeld in het eerste lid, onderdeel a, tot welke
      huurprijs zijn uitspraak leidt, alsmede de datum van ingang. Hetgeen in deze wet is bepaald met betrekking tot een
      uitspraak van de huurcommissie is van overeenkomstige toepassing op de uitspraak van de voorzitter, bedoeld in het
      eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: '20.4'
    text: |-
      [Artikel 7][ref1] dan wel, voor geschillen als bedoeld in [artikel 4a][ref2], [artikel 7a][ref3] is van
      overeenkomstige toepassing, met dien verstande dat voor het door de huurcommissie doen van een uitspraak op het
      verzet, bedoeld in het zesde en zevende lid, niet opnieuw de in artikel 7 onderscheidenlijk artikel 7a bedoelde
      vergoeding aan de Staat verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel7a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: 7a
        hoofdstuk: II
        paragraaf: '3'
  - number: '20.5'
    text: Het bestuur zendt onverwijld een afschrift van de voorzittersuitspraak aan partijen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: '20.6'
    text: |-
      Tegen de uitspraak, bedoeld in het eerste lid, kan de huurder, verhuurder, huurdersorganisatie of bewonerscommissie
      binnen drie weken na verzending van het afschrift van die uitspraak schriftelijk en gemotiveerd in verzet gaan
      bij de huurcommissie. De voorzitter wijst in zijn uitspraak partijen op deze mogelijkheid, alsook op de vorm en de
      termijn die daarbij in acht genomen moeten worden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
  - number: '20.7'
    text: |-
      Is de huurcommissie van oordeel dat het verzet, bedoeld in het zesde lid, gegrond is, dan vervalt de uitspraak,
      bedoeld in het eerste lid, en wordt het aan de in het eerste lid bedoelde uitspraak ten grondslag liggende verzoek
      overeenkomstig [hoofdstuk III][ref1] door de huurcommissie in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        hoofdstuk: III
  - number: '20.8'
    text: |-
      Indien geen van de in het zesde lid genoemde partijen binnen de in dat lid genoemde termijn
      in verzet is gegaan, is hetgeen in [artikel 7:262 van het Burgerlijk Wetboek][ref1] dan wel
      [artikel 8a van de Wet op het overleg huurders verhuurder][ref2] is bepaald met betrekking tot een uitspraak van de
      huurcommissie, van overeenkomstige toepassing op de uitspraak van de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel8a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '262'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: 8a
  - number: '21.1'
    text: |-
      Het bestuur vormt voor de behandeling van zaken ter zitting bij bestuursreglement als bedoeld in [artikel 3f][ref1]
      zittingscommissies.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3f
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 3f
        hoofdstuk: II
        paragraaf: '1'
  - number: '21.2'
    text: |-
      De zittingscommissie houdt zitting in het arrondissement waarbinnen de woonruimte waarop het geschil betrekking
      heeft, is gelegen. Indien daartoe aanleiding bestaat kan het bestuur bepalen dat de zittingscommissie zitting houdt
      in een ander arrondissement dat binnen een redelijke afstand van die woonruimte ligt, waarbij een goede balans
      tussen enerzijds de laagdrempeligheid van de huurcommissie en anderzijds een efficiënte werkwijze wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel21
  - number: '21.3'
    text: |-
      Het bestuur wijst bij bestuursreglement als bedoeld in [artikel 3f][ref1] ten minste drie zittingslocaties als
      bedoeld in artikel 3f, tweede lid, aan waar een zittingscommissie geschillen als bedoeld in [artikel 4a][ref2]
      kan behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3f
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 3f
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
  - number: '22.1'
    text: |-
      De zittingscommissie houdt zitting en beraadslaagt met een zittingsvoorzitter en twee zittingsleden, waarvan een
      zittingslid afkomstig is uit de kring van huurders en een zittingslid afkomstig is uit de kring van verhuurders.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel22
  - number: '22.2'
    text: De voorzitter kan optreden als zittingsvoorzitter.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel22
  - number: '22.3'
    text: |-
      In afwijking van het eerste lid kunnen personen die niet uit de kring van huurders onderscheidenlijk de kring
      van verhuurders voortkomen, zittingslid zijn van een zittingscommissie die geschillen behandelt als bedoeld in
      [artikel 4a][ref1]. [Artikel 3d, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel3d
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 3d
        hoofdstuk: II
        paragraaf: '1'
  - number: '28.1'
    text: |-
      Alvorens een voorbereidend onderzoek in te stellen of een uitspraak te doen als bedoeld in
      [artikel 4, tweede, derde of vijfde lid][ref1], of [artikel 4a][ref2], wordt de partij die niet de verzoeker
      is, door het bestuur in kennis gesteld van de inhoud van het verzoek. Alvorens een uitspraak te doen als bedoeld
      in artikel 4, tweede, derde of vijfde lid, artikel 4a of [artikel 5, eerste lid][ref3], wordt een voorbereidend
      onderzoek ingesteld. Een zodanig onderzoek blijft achterwege indien de beschikbare stukken naar het oordeel van de
      voorzitter voldoende zijn ter voorbereiding van de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '28.2'
    text: |-
      Het voorbereidend onderzoek wordt ingesteld door het bestuur. In bijzondere gevallen kan de zittingsvoorzitter het
      onderzoek instellen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel28
  - number: '28.3'
    text: Van het voorbereidend onderzoek wordt een schriftelijk rapport opgemaakt.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel28
  - number: '28.4'
    text: |-
      In de gevallen waarin de voorzitter geen uitspraak als bedoeld in [artikel 20, eerste lid][ref1], doet, bepaalt
      het bestuur de dag en het uur, waarop het verzoek ter zitting van een zittingscommissie zal worden behandeld, zodra
      het voorbereidend onderzoek naar het oordeel van de voorzitter voltooid is, of, indien dit onderzoek ingevolge het
      eerste lid niet wordt ingesteld, reeds aanstonds.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel20
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '20'
        hoofdstuk: IV
  - number: '28.5'
    text: |-
      Het bestuur legt de op de zaak betrekking hebbende stukken tot de dag van de zitting ter inzage voor partijen of
      hun schriftelijk gemachtigden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel28
  - number: '28.6'
    text: |-
      Het bestuur geeft partijen van de gegevens omtrent de zitting onverwijld, doch ten minste twee weken voor de dag
      van de behandeling van het verzoek ter zitting, kennis. De kennisgeving gaat vergezeld van een afschrift van het
      in het derde lid bedoelde rapport of bevat de mededeling dat ter zake geen voorbereidend onderzoek nodig is geacht,
      zulks onder vermelding van de redenen die tot dat oordeel hebben geleid. De kennisgeving bevat voorts de mededeling
      dat de stukken overeenkomstig het vijfde lid ter inzage liggen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel28
  - number: '29'
    text: |-
      De voorzitter is bevoegd verzoeken welke gelijkluidend dan wel nagenoeg gelijkluidend zijn gevoegd door de
      huurcommissie te laten behandelen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel29
  - number: '30.1'
    text: |-
      Indien door een partij omtrent dezelfde woonruimte gelijktijdig meerdere verzoeken zijn ingediend, worden deze
      gevoegd behandeld.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel30
  - number: '30.2'
    text: |-
      Indien omtrent dezelfde woonruimte een verzoek als bedoeld in [artikel 7:257 van het Burgerlijk Wetboek][ref1] en
      een verzoek als bedoeld in [artikel 7:253 van dat wetboek][ref2] bij de huurcommissie zijn ingediend, beslist de
      huurcommissie op het eerstgenoemde verzoek alvorens op het andere verzoek te beslissen, tenzij de indiening van het
      eerstgenoemde verzoek heeft plaatsgevonden na het tijdstip waarop volgens het andere verzoek de wijziging van de
      huurprijs dient in te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '253'
  - number: '31.1'
    text: |-
      Voor de aanvang van de behandeling van het verzoek ter zitting kunnen de zittingsvoorzitter en elk van de aan de
      zitting deelnemende zittingsleden door een van de partijen worden gewraakt op grond van feiten of omstandigheden,
      die het vormen van een onpartijdig oordeel zouden kunnen bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel31
  - number: '31.2'
    text: |-
      Op grond van zodanige feiten of omstandigheden kan de zittingsvoorzitter, alsmede elk van de aan de zitting
      deelnemende zittingsleden, zich verschonen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel31
  - number: '31.3'
    text: |-
      De zittingsvoorzitter en de aan de zitting deelnemende zittingsleden, uitgezonderd de persoon ten aanzien van wie
      ingevolge het eerste of tweede lid wraking, onderscheidenlijk verschoning, wordt gevraagd, beslissen zo spoedig
      mogelijk of de wraking, onderscheidenlijk de verschoning, wordt toegestaan. In geval van staking van stemmen is
      het verzoek tot wraking of verschoning toegestaan. De behandeling van de zaak kan in dat geval tot een door de
      zittingsvoorzitter te bepalen dag en uur worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel31
  - number: '32.1'
    text: De zittingen van een zittingscommissie zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel32
  - number: '32.2'
    text: |-
      In het belang van de openbare orde of op verzoek van een van de partijen, indien haar belangen dit eisen, kan de
      zittingscommissie besluiten dat de zitting met gesloten deuren zal worden gehouden.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel32
  - number: '32.3'
    text: |-
      De beraadslaging en de beslissing over een verzoek als bedoeld in het tweede lid en [artikel 31, derde lid][ref1],
      geschiedt buiten aanwezigheid van partijen of derden.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel31
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '31'
        hoofdstuk: V
        paragraaf: '2'
  - number: '34.1'
    text: De zittingsvoorzitter heeft de leiding van de zitting.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel34
  - number: '34.2'
    text: |-
      De zittingsvoorzitter en de aan de zitting deelnemende zittingsleden van de zittingscommissie maken zich voor de
      aanvang van de behandeling van het verzoek bekend en ondervragen vervolgens partijen of hun gemachtigden alsmede
      door partijen voor de aanvang van de zitting aan de zittingsvoorzitter opgegeven getuigen en deskundigen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel34
  - number: '34.3'
    text: |-
      Partijen worden daarbij in de gelegenheid gesteld door tussenkomst van de zittingsvoorzitter ter zake dienende
      vragen tot elkaar te richten.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel34
  - number: '34.4'
    text: Voordat de behandeling ter zitting wordt gesloten, heeft ieder van de partijen het recht het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel34
  - number: '34.5'
    text: Zodra de behandeling ter zitting gesloten is, deelt de zittingsvoorzitter mede wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel34
  - number: '34.6'
    text: |-
      Indien een nader onderzoek noodzakelijk blijkt of indien een onderzoek alsnog wenselijk wordt geacht, kan
      de zittingsvoorzitter tot het instellen daarvan besluiten. In dat geval zijn de verdere bepalingen over het
      voorbereidend onderzoek van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel34
  - number: '34.7'
    text: |-
      Een zittingscommissie beraadslaagt buiten aanwezigheid van partijen of derden, beslist daarbij bij meerderheid
      van stemmen en baseert haar uitspraken uitsluitend op hetgeen ter zitting is besproken en op de stukken die
      overeenkomstig [artikel 28, vijfde lid][ref1], ter inzage zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel28
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '28'
        hoofdstuk: V
        paragraaf: '2'
  - number: '35'
    text: |-
      Indien een machtiging als bedoeld in [artikel 2:1, tweede lid, van de Algemene wet bestuursrecht][ref1] ontbreekt,
      kan een zittingscommissie de zaak aanhouden totdat de betrokken partij in de gelegenheid is geweest op de juiste
      wijze in zijn vertegenwoordiging te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '36'
    text: |-
      Bij de zittingen is een ambtenaar van de administratieve ondersteuning van de huurcommissie aanwezig. Hij houdt
      aantekening van al hetgeen daar wordt behandeld met vermelding van de zakelijke inhoud van de verklaringen van de
      door de zittingscommissie gehoorde personen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel36
  - number: '37.1'
    text: |-
      De huurcommissie doet binnen vier maanden na het verstrijken van de in [artikel 7, vierde lid][ref1], genoemde
      termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft te worden gedaan, na het tijdstip waarop
      de aldaar bedoelde vergoeding van de verzoeker is ontvangen, schriftelijk en met redenen omkleed uitspraak. In
      geval van een geschil als bedoeld in [artikel 4a][ref2] doet de huurcommissie uitspraak binnen acht weken na het
      verstrijken van de in artikel 7, vierde lid, genoemde termijn. In afwijking van de eerste en tweede volzin doet de
      huurcommissie in het geval dat de in de eerste, dan wel, tweede volzin genoemde termijn niet kan worden gehaald,
      uitspraak binnen een door de huurcommissie aan te geven langere termijn, mits zij aan beide partijen daarvan voor
      het verstrijken van de in de eerste, dan wel, tweede volzin genoemde termijn schriftelijk en met redenen omkleed
      heeft kennisgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
  - number: '37.2'
    text: |-
      De uitspraken van de huurcommissie vermelden de namen van degenen die aan de behandeling van de zaak ter zitting
      hebben deelgenomen. Zij worden door de desbetreffende zittingsvoorzitter ondertekend.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel37
  - number: '37.3'
    text: Het bestuur zendt onverwijld een afschrift van de uitspraak van de huurcommissie aan partijen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel37
  - number: '37.4'
    text: |-
      De huurcommissie wijst in haar uitspraak partijen op de in [artikel 7:262 van het Burgerlijk Wetboek][ref1]
      bedoelde mogelijkheid zich tot de rechter te wenden, alsook op de vorm en de termijn die daarbij in acht moeten
      worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel262
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '262'
  - number: '37.5'
    text: |-
      Indien in de uitspraak wordt vastgesteld dat een woonruimte een of meer gebreken vertoont die
      het woongenot ernstig schaden zendt het bestuur bovendien afschrift aan de inspecteur, bedoeld in
      [artikel 1, eerste lid, van de Woningwet][ref1], en aan burgemeester en wethouders van de gemeente waarin de
      woonruimte is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '38'
    text: |-
      De voorzitter, de plaatsvervangend voorzitter, de zittingsvoorzitters, de zittingsleden en de ambtenaren van de
      administratieve ondersteuning mogen zich, indien dit de onpartijdigheid in gevaar brengt, direct noch indirect in
      enig bijzonder onderhoud of gesprek inlaten met partijen of hun raadslieden, noch enige bijzondere onderrichting,
      memorie of geschriften aannemen over enige aangelegenheid, welke aanhangig is of waarvan zij weten of vermoeden,
      dat deze aanhangig zal worden bij de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel38
  - number: '39.1'
    text: |-
      Het bestuur kan, voor zover dat redelijkerwijs voor de uitoefening van de taken van de huurcommissie, bedoeld in de
      [artikelen 4, tweede tot en met vijfde lid][ref1], [4a][ref2] en [5][ref3], en de taken van de voorzitter, bedoeld
      in [artikel 6, eerste lid][ref4], nodig is, van de verhuurder inzage en het nemen van afschrift vorderen van boeken
      en andere zakelijke bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0014315#Artikel6
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0014315
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '39.2'
    text: |-
      De verhuurder is verplicht van hem krachtens het eerste lid gevorderde inzage en nemen van afschrift van boeken
      en andere zakelijke bescheiden te verlenen, een en ander op de wijze en binnen de termijn, door het bestuur te
      bepalen.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel39
  - number: '39.3'
    text: |-
      Het niet voldoen aan de in het tweede lid omschreven verplichting wordt gestraft met een geldboete van de tweede
      categorie. Het strafbare feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel39
  - number: '40.1'
    text: |-
      De zittingsvoorzitter en de zittingsleden hebben toegang tot alle woon- en bedrijfsruimten, alsmede tot ruimte die
      als zodanig kan worden gebruikt, voorzover dat redelijkerwijs voor de uitoefening van hun taak nodig is. Zij kunnen
      zich bij het betreden door bepaalde, door hen aan te wijzen personen doen vergezellen. Zo nodig verschaffen zij
      zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel40
  - number: '40.2'
    text: |-
      Dit artikel is niet van toepassing op geschillen als bedoeld in [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
  - number: '41.1'
    text: |-
      Wanneer de huurcommissie op een verzoek van de huurder of op een verzoek van de huurder of de verhuurder
      uitspraak heeft gedaan als bedoeld in [artikel 4, vijfde lid, eerste zin][ref1], onderscheidenlijk
      [artikel 4a, onderdeel e][ref2], worden de huurder en de verhuurder geacht te zijn overeengekomen wat in die
      uitspraak is vastgesteld, tenzij een van hen binnen acht weken nadat aan hen afschrift van die uitspraak is
      verzonden, een beslissing van de rechter heeft gevorderd over het punt waarover de huurcommissie om een uitspraak
      was verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
        hoofdstuk: II
        paragraaf: '2'
  - number: '41.2'
    text: Tegen een beslissing krachtens dit artikel is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel41
  - number: '46'
    text: |-
      Een voordracht voor een krachtens [artikel 3, tweede lid][ref1], [7, eerste lid][ref2], [7a, eerste lid][ref3],
      [8][ref4], [10, eerste lid][ref5], of [12, tweede lid][ref6], vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0014315#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: 7a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0014315
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0014315
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '47'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel47
  - number: 47.a
    text: |-
      ter uitvoering van [artikel 7:253 van het Burgerlijk Wetboek][ref1] regels worden gegeven met betrekking tot de
      voorwaarden waaraan het in het tweede lid van dat artikel bedoelde schrijven van de verhuurder aan de huurder dient
      te voldoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: 47.b
    text: |-
      ter uitvoering van [artikel 7:257 van het Burgerlijk Wetboek][ref1] regels worden gegeven met betrekking tot de
      voorwaarden waaraan een kennisgeving van de huurder aan de verhuurder van een gebrek dient te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: '49'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij een huurcommissie aanhangige verzoeken worden met
      toepassing van het vóór het tijdstip van inwerkingtreding van deze wet geldende recht behandeld door de
      huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel49
  - number: '50'
    text: De toepasselijkheid van de bepalingen van deze wet kan niet bij overeenkomst worden uitgesloten of beperkt.
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel50
  - number: '51'
    text: |-
      In elke na het verstrijken van de termijn, bedoeld in [artikel 7:260, tweede lid, van het Burgerlijk Wetboek][ref1],
      ingestelde rechtsvordering ter zake van de vergoedingen, bedoeld in het eerste lid van dat artikel, wordt een
      uitspraak van de huurcommissie dan wel beschikking van de rechter omtrent de betalingsverplichting van de huurder
      met betrekking tot deze vergoedingen overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: '52'
    text: |-
      In elke rechtsvordering ter zake van hetgeen onverschuldigd mocht zijn betaald in verband met een
      overeenkomst als bedoeld in [artikel 7:258 van het Burgerlijk Wetboek][ref1] waarbij partijen slechts
      de hoogte van de prijs en niet die van de huurprijs zijn overeengekomen, wordt een uitspraak van de
      huurcommissie, als bedoeld in [artikel 17][ref2], dan wel een beschikking van de rechter, als bedoeld in
      [artikel 7:262 van het Burgerlijk Wetboek][ref3] overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel262
    url: https://wetten.overheid.nl/BWBR0014315/2019-07-01#Artikel52
