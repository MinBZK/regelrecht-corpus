  - number: '5'
    text: |-
      1 De huurcommissie doet desverzocht uitspraak over de redelijkheid van een gebruiksvergoeding of een aanvullende
      vergoeding, als bedoeld in [artikel 51, eerste, onderscheidenlijk derde lid, van de Huisvestingswet][ref1] en over
      de wijziging daarvan, bedoeld in [artikel 52, eerste lid, van die wet][ref2].

      2 De huurcommissie verstrekt desverzocht aan de rechter nadere inlichtingen over een door haar gedane uitspraak,
      alsmede, ingeval zij geen uitspraak heeft gedaan, indien de rechter geacht kan worden daarbij belang te hebben,
      over de aan een woonruimte toe te kennen kwaliteit en een voor die woonruimte redelijk te achten huurprijs.

      3 De huurcommissie verstrekt desverzocht verklaringen aan Onze Minister en aan publiekrechtelijke lichamen die
      geacht kunnen worden daarbij belang te hebben, over de aan een woonruimte toe te kennen kwaliteit, de gebreken
      ten aanzien van die woonruimte en een voor die woonruimte redelijk te achten huurprijs. De hierbedoelde verklaring
      wordt niet gegeven, indien het belang van de verklaring is gelegen in de beoordeling door de verzoeker van een
      huurovereenkomst als bedoeld in [artikel 3][ref3], tenzij het belang daarvan gelegen is in de toepassing van
      [artikel 1, vierde lid, van de Huisvestingswet][ref4]. Onze Minister kan voor de uitvoering van de in de eerste
      volzin bedoelde taak nadere regels geven.

      4 De huurcommissie verstrekt desverzocht aan Onze Minister de gegevens die nodig zijn in het kader van het te
      voeren volkshuisvestingsbeleid.

      5 De huurcommissie geeft ten aanzien van een huurovereenkomst als bedoeld in [artikel 3][ref5] desverzocht advies
      over aangelegenheden waaromtrent de huurcommissie bevoegd zou zijn uitspraak te doen indien [artikel 3][ref6]
      daaraan niet in de weg zou staan. De huurcommissie geeft een dergelijk advies slechts voorzover in de
      huurovereenkomst of anderszins tussen partijen is afgesproken dat de desbetreffende aangelegenheden bij geschil aan
      de huurcommissie worden voorgelegd.


