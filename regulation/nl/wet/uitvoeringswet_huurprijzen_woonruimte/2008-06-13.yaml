  - number: '10'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de waardering van de kwaliteit van een
      woonruimte, van de redelijkheid van de huurprijs en van wijziging daarvan.

      2 Bij regeling van Onze Minister wordt het maximale huurverhogingspercentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel10
  - number: '11'
    text: |-
      1 In geval van een verzoek als bedoeld in [artikel 7:249 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de overeengekomen huurprijs. Als een dergelijk verzoek wordt mede aangemerkt
      een verzoek ingevolge [artikel 6, aanhef en onderdeel b][ref2], indien een aanvraag om een huurtoeslag voor de
      desbetreffende woonruimte is ingediend binnen de in [artikel 7: 249 van het Burgerlijk Wetboek][ref3] bedoelde
      termijn en indien en zodra de voorzitter van de huurcommissie op dat verzoek een verklaring heeft afgegeven
      waaruit blijkt dat de overeengekomen huurprijs hoger is dan de bij de desbetreffende woonruimte behorende maximale
      huurprijsgrens.

      2 De huurcommissie toetst in dat geval de redelijkheid van de overeengekomen huurprijs aan de krachtens
      [artikel 10, eerste lid][ref4], gegeven regels.

      3 Indien de huurcommissie de overeengekomen huurprijs niet redelijk acht, vermeldt zij in haar uitspraak de
      huurprijs die zij redelijk acht.

      4 In geval sprake is van een huurovereenkomst als bedoeld in [artikel 3][ref5] spreekt de huurcommissie,
      indien de beoordeling, bedoeld in het tweede lid, zou leiden tot een huurprijs boven de in
      [artikel 7:247 van het Burgerlijk Wetboek][ref6] genoemde grens, uit dat de door partijen overeengekomen
      huurprijs redelijk is. Indien de huurprijs na de uitspraak van de huurcommissie en in voorkomend geval na de
      vaststelling ervan door de rechter onherroepelijk is komen vast te staan en niet boven die grens uitkomt, is
      [artikel 7:247][ref7] op die huurovereenkomst niet langer van toepassing.

      5 De huurcommissie beoordeelt de kwaliteit van de woonruimte en de redelijkheid van de huurprijs naar de toestand
      op de datum van ingang van de huurovereenkomst.


