      1 In het rechtsgebied van ieder arrondissement zijn een of meer huurcommissies. Bij algemene maatregel van bestuur
      worden de ressorten van deze huurcommissies bepaald door vermelding van de gemeenten waarover deze ressorten zich
      uitstrekken.

      2 De huurcommissies zijn gevestigd in de gemeenten, waarvan de naam in de in het eerste lid bedoelde algemene
      maatregel van bestuur als aanduiding van het ressort van die commissie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel21
  - number: '22'
    text: |-
      1 Een huurcommissie heeft een voorzitter en een door Onze Minister te bepalen aantal leden.

      2 Onze Minister kan bepalen dat een huurcommissie tevens een plaatsvervangend voorzitter en plaatsvervangende leden
      heeft.

      3 Bij afwezigheid of ontstentenis van de voorzitter treedt op verzoek van de huurcommissie een voorzitter van een
      huurcommissie in een van de aangrenzende ressorten, als waarnemend voorzitter op. Bij verhindering van ieder der
      voorzitters van een huurcommissie in een aangrenzend ressort treedt op verzoek van de huurcommissie de voorzitter
      van een huurcommissie in een van de niet-aangrenzende ressorten als waarnemend voorzitter op. Is op deze wijze niet
      in de waarneming te voorzien, dan wijst de huurcommissie uit haar midden een waarnemend voorzitter aan.

      4 Bij afwezigheid of ontstentenis van een van de leden treedt een daartoe door de voorzitter aangewezen lid of
      plaatsvervangend lid als vervanger op.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel22
  - number: '23'
    text: |-
      1 De voorzitter en de plaatsvervangend voorzitter van een huurcommissie worden op voordracht van Onze Minister
      bij koninklijk besluit benoemd, geschorst en ontslagen. Zij worden benoemd voor een tijdvak van zes jaar en zijn
      voor een aansluitend tijdvak als voorzitter, onderscheidenlijk plaatsvervangend voorzitter, van die huurcommissie
      eenmaal herbenoembaar.

      2 De voorzitter moet:

      a. op grond van het afleggen van een examen van een opleiding in het wetenschappelijk onderwijs door een
      universiteit dan wel de Open Universiteit waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]
      betrekking heeft, de graad Bachelor op het gebied van het recht en tevens de graad Master op het gebied van het
      recht zijn verleend,

      b. op grond van het afleggen van een examen van een opleiding aan een universiteit dan wel de Open Universiteit
      waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] betrekking heeft, het recht om de titel
      meester te voeren hebben verkregen, of

      c. blijk hebben gegeven op andere wijze de voor de betrekking van voorzitter benodigde kennis te hebben verworven.

      3 De voorzitter mag niet metterdaad betrokken zijn bij de uitoefening van een bedrijf dat werkzaam is of mede
      werkzaam is op het gebied van woonruimte, noch is het hem toegestaan beroepsmatig betrokken te zijn bij het beheer
      van en de beschikking over woonruimte dan wel deel uit te maken van het bestuur van een vereniging, vennootschap of
      stichting, die daarbij is betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
