  - number: '47'
    text: |-
      1 Onze Minister:

      a. bepaalt aan welke voorwaarden een verzoek aan de huurcommissie dient te voldoen en welke gegevens daarbij dienen
      te worden verstrekt of overgelegd;

      b. bepaalt in welke gevallen de voorzitter van de huurcommissie van de bevoegdheid, bedoeld in
      [artikel 7, achtste lid][ref1], gebruik kan maken, en

      c. stelt ter uitvoering van [artikel 7:252, derde lid, van het Burgerlijk Wetboek][ref2] een formulier vast.

      2 Onze Minister kan:

      a. ter uitvoering van [artikel 7:253 van het Burgerlijk Wetboek][ref3] regels geven met betrekking tot de
      voorwaarden waaraan het in het tweede lid van dat artikel bedoelde schrijven van de verhuurder aan de huurder dient
      te voldoen;

      b. ter uitvoering van [artikel 7:257 van het Burgerlijk Wetboek][ref4] regels geven met betrekking tot de
      voorwaarden waaraan een kennisgeving van de huurder aan de verhuurder van een gebrek dient te voldoen;

      c. nadere voorschriften geven omtrent de wijze waarop de huurcommissie haar taken ingevolge deze wet uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel253
