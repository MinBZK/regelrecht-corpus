      1 In geval van een verzoek als bedoeld in [artikel 7:260 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de betalingsverplichting van de huurder met betrekking tot de servicekosten.

      2 De huurcommissie toetst de servicekosten aan de voor de berekening daarvan geldende wettelijke voorschriften en
      aan de redelijkheid.


