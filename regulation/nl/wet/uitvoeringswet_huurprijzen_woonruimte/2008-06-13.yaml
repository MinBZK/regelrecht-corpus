  - number: '6'
    text: |-
      De voorzitter van de huurcommissie heeft tot taak:

      a. in afwijking van [artikel 4, eerste lid][ref1], in de in het tweede en derde lid van dat artikel aangegeven
      gevallen uitspraak te doen indien ten aanzien van een aan de huurcommissie gedaan verzoek een van de in
      [artikel 20, eerste lid][ref2], bedoelde gevallen zich voordoet;

      b. in de gevallen van een verzoek van de Belastingdienst/Toeslagen als bedoeld in
      [artikel 5, tweede lid, van de Wet op de huurtoeslag][ref3] binnen zes weken een verklaring te verstrekken omtrent
      de redelijkheid van de huurprijs en de juistheid van andere gegevens betreffende de woonruimte waarvoor een
      aanvraag om een huurtoeslag is ingediend, een en ander voorzover van belang voor de toepassing van genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel5
