  - number: '9'
    text: |-
      1 De huurcommissie toetst bij aan haar gedane verzoeken of voldaan is aan de voor die verzoeken bij of krachtens
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref1] en bij of krachtens deze wet gestelde voorschriften.

      2 Een verzoek aan de huurcommissie dient schriftelijk te worden ingediend bij de huurcommissie in het ressort
      waarin de woonruimte is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
