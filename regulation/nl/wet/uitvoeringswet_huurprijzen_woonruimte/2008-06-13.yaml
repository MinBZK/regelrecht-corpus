      1 De voorzitter van de huurcommissie doet onverwijld, in ieder geval binnen vier weken na het verstrijken van de in
      [artikel 7, vijfde lid][ref1], genoemde termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft
      te worden gedaan, na het tijdstip waarop de aldaar bedoelde vergoeding van de verzoeker is ontvangen, schriftelijk
      en met redenen omkleed uitspraak, indien:

      a. het verzoek kennelijk niet-ontvankelijk is,

      b. het verzoek kennelijk redelijk of niet redelijk is,

      c. het voorstel dat ten grondslag ligt aan het verzoek, kennelijk redelijk of niet redelijk is,

      d. de aan het verzoek ten grondslag liggende bezwaren kennelijk gegrond of ongegrond zijn of

      e. de bezwaren tegen het aan het verzoek ten grondslag liggende voorstel kennelijk ongegrond zijn.

      2 Van een kennelijk redelijk verzoek is in ieder geval sprake in het geval, bedoeld in
      [artikel 7:253, vijfde lid, van het Burgerlijk Wetboek][ref2], tenzij:

      a. de huurcommissie in een eerdere uitspraak heeft uitgesproken dat op grond van
      [artikel 7:257 van het Burgerlijk Wetboek][ref3] een lagere huurprijs redelijk is en de in die uitspraak genoemde
      gebreken nog niet zijn verholpen;

      b. het percentage van de in het voorstel opgenomen huurverhoging het in [artikel 10, tweede lid][ref4], bedoelde
      maximale huurverhogingspercentage te boven gaat, in welk geval het verzoek slechts kennelijk redelijk is, voorzover
      het dat percentage niet overschrijdt.

      3 De voorzitter vermeldt in voorkomende gevallen in de uitspraak tot welke huurprijs de uitspraak van de voorzitter
      leidt, alsmede de datum van ingang.

      4 [Artikel 7][ref5] is van overeenkomstige toepassing, met dien verstande dat voor het door de huurcommissie doen
      van een uitspraak op het verzet, bedoeld in het zesde en zevende lid, niet opnieuw de in [artikel 7][ref6] bedoelde
      vergoeding aan de Staat verschuldigd is.

      5 De secretaris zendt onverwijld bij aangetekende brief of bij brief met ontvangstbevestiging een afschrift van de
      uitspraak van de voorzitter van de huurcommissie aan partijen.

      6 Tegen de uitspraak van de voorzitter van de huurcommissie, bedoeld in het eerste lid, kan de huurder of de
      verhuurder binnen drie weken na verzending van het afschrift van die uitspraak schriftelijk en gemotiveerd in
      verzet gaan bij de huurcommissie. De voorzitter van de huurcommissie wijst in zijn uitspraak partijen op deze
      mogelijkheid, alsook op de vorm en de termijn die daarbij in acht genomen moeten worden.

      7 Is de huurcommissie van oordeel dat het verzet, bedoeld in het zesde lid, gegrond is, dan vervalt de uitspraak
      van de voorzitter van de huurcommissie, bedoeld in het eerste lid, en wordt het aan de in het eerste lid bedoelde
      uitspraak ten grondslag liggende verzoek overeenkomstig [hoofdstuk III][ref7] door de huurcommissie in behandeling
      genomen.

      8 Indien noch de huurder noch de verhuurder binnen de in het zesde lid genoemde termijn in verzet is gegaan, is
      hetgeen in [artikel 7:262 van het Burgerlijk Wetboek][ref8] is bepaald met betrekking tot een uitspraak van de
      huurcommissie, van overeenkomstige toepassing op de uitspraak van de voorzitter van de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
