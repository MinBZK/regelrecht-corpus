    text: |-
      1 De huurcommissie heeft de in het tweede tot en met vierde lid en in [artikel 5][ref1] aangegeven taken.

      2 De huurcommissie doet uitspraak:

      a. ingevolge [artikel 7:249 van het Burgerlijk Wetboek][ref2] over de redelijkheid van de overeengekomen
      aanvangshuurprijs;

      b. ingevolge [artikel 7:253 van het Burgerlijk Wetboek][ref3] over de redelijkheid van het voorstel tot verhoging
      van de huurprijs;

      c. ingevolge [artikel 7:254 van het Burgerlijk Wetboek][ref4] over de redelijkheid van het voorstel tot verlaging
      van de huurprijs;

      d. ingevolge [artikel 7:255 van het Burgerlijk Wetboek][ref5] over het bedrag van de verhoging van de huurprijs na
      de totstandkoming van voorzieningen, veranderingen of toevoegingen;

      e. ingevolge [artikel 7:257 van het Burgerlijk Wetboek][ref6] over de in rekening te brengen huurprijs bij
      vermindering van het woongenot als gevolg van een gebrek;

      f. ingevolge [artikel 7:258 van het Burgerlijk Wetboek][ref7] over de huurprijs en het voorschotbedrag aan
      servicekosten indien tussen partijen slechts een prijs en niet een huurprijs is overeengekomen;

      g. ingevolge [artikel 7:260 van het Burgerlijk Wetboek][ref8] over de betalingsverplichting met betrekking tot
      de servicekosten;

      h. ingevolge [artikel 7:261 van het Burgerlijk Wetboek][ref9] over het voorschotbedrag van de servicekosten.

      3 De huurcommissie doet uitspraak in gevallen waarin als gevolg van een uitspraak als bedoeld in de
      [artikelen 7:249][ref10] en [7:257 van het Burgerlijk Wetboek][ref11] de in rekening te brengen huurprijs in
      verband met gebreken is verlaagd, omtrent het verholpen zijn van die gebreken.

      4 De huurcommissie doet uitspraak indien ingevolge [artikel 20, zesde lid][ref12], verzet is gedaan tegen een
      uitspraak van de voorzitter van de huurcommissie.


