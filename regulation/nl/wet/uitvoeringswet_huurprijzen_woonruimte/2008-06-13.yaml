        artikel: '21'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003222
  - number: 53a
    text: |-
      Indien deze wet later in werking treedt dan 1 juli van enig jaar, geldt [artikel 41][ref1] vanaf 1 januari van het
      daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel41
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '41'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53b
    text: |-
      De in [artikel 42, eerste lid][ref1], bedoelde opgave wordt voor de eerste maal verstrekt per de eerste datum
      van 1 januari, 1 mei of 1 september nadat sedert het in werking treden van deze wet ten minste vier maanden zijn
      verstreken. De in de eerste zin bedoelde opgave betreft de eerste maal het aantal van de sedert de vier daaraan
      voorafgaande maanden binnengekomen door de huurcommissie te behandelen onderscheidenlijk afgedane zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel42
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '42'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53c
    text: |-
      Het in [artikel 43][ref1] bedoelde verslag wordt voor de eerste maal opgesteld nadat sedert het
      tijdstip van in werking treden van deze wet een geheel kalenderjaar is verstreken. Over het daaraan
      voorafgaande kalenderjaar wordt door de huurcommissie verslag uitgebracht op de wijze als is aangegeven in
      [artikel 24 van de Wet op de huurcommissies][ref2], zoals dat artikel voor de inwerkingtreding van deze wet luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003222#Artikel24
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '43'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003222
        artikel: '24'
  - number: 53d
    text: |-
      [Artikel 46, eerste volzin][ref1], is niet van toepassing op het voor de eerste maal vaststellen van de in die
      volzin bedoelde algemene maatregelen van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel46
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '46'
        hoofdstuk: VI
  - number: '54'
    text: |-
      1 De [Huurprijzenwet woonruimte][ref1] wordt ingetrokken.

      2 De [Wet op de huurcommissies][ref2] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003221
      [ref2]: https://wetten.overheid.nl/BWBR0003222
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003221
      - id: ref2
        bwb_id: BWBR0003222
  - number: '55'
    text: |-
      Indien het bij koninklijke boodschap van 2 juli 1998 ingediende voorstel van wet tot vaststelling van
      [titel 7.4 (Huur) van het Burgerlijk Wetboek ][ref1](kamerstukken II 1997/98, 26 089, nrs. 1–2), na tot wet te zijn
      verheven, in werking treedt, treedt deze wet op hetzelfde tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '56'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet huurprijzen woonruimte.'
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel56
