  - number: '29'
    text: |-
      De voorzitter van de huurcommissie is bevoegd verzoeken welke gelijkluidend dan wel nagenoeg gelijkluidend zijn
      gevoegd door de huurcommissie te laten behandelen.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel29
  - number: '30'
    text: |-
      1 Indien door een partij omtrent dezelfde woonruimte gelijktijdig meerdere verzoeken zijn ingediend, worden deze
      door de huurcommissie gevoegd behandeld.

      2 Indien omtrent dezelfde woonruimte een verzoek als bedoeld in [artikel 7:257 van het Burgerlijk Wetboek][ref1]
      en een verzoek als bedoeld in [artikel 7:253 van dat wetboek][ref2] bij de huurcommissie zijn ingediend, beslist de
      huurcommissie op het eerstgenoemde verzoek alvorens op het andere verzoek te beslissen, tenzij de indiening van het
      eerstgenoemde verzoek heeft plaatsgevonden na het tijdstip waarop volgens het andere verzoek de wijziging van de
      huurprijs dient in te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '253'
  - number: '31'
    text: |-
      1 Voor de aanvang van de behandeling van het verzoek ter zitting kunnen de voorzitter en elk van de aan de zitting
      deelnemende leden door een van de partijen worden gewraakt op grond van feiten of omstandigheden, die het vormen
      van een onpartijdig oordeel zouden kunnen bemoeilijken.

      2 Op grond van zodanige feiten of omstandigheden kan de voorzitter, alsmede elk van de aan de zitting deelnemende
      leden, zich verschonen.

      3 De voorzitter en de aan de zitting deelnemende leden, uitgezonderd de persoon ten aanzien van wie ingevolge
      het eerste of tweede lid wraking, onderscheidenlijk verschoning, wordt gevraagd, beslissen zo spoedig mogelijk of
      de wraking, onderscheidenlijk de verschoning, wordt toegestaan. In geval van staking van stemmen is het verzoek
      tot wraking of verschoning toegestaan. De behandeling van de zaak kan in dat geval tot een door de voorzitter te
      bepalen dag en uur worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel31
  - number: '32'
    text: |-
      1 De zittingen van de huurcommissie zijn openbaar.

      2 In het belang van de openbare orde of op verzoek van een van de partijen, indien haar belangen dit eisen, kan de
      huurcommissie besluiten dat de zitting met gesloten deuren zal worden gehouden.

      3 De beraadslaging en de beslissing over een verzoek als bedoeld in het tweede lid en
      [artikel 31, derde lid][ref1], geschiedt buiten aanwezigheid van partijen of derden.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel31
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '31'
        hoofdstuk: V
        paragraaf: '2'
  - number: '33'
    text: |-
      De huurcommissie houdt zitting in haar vestigingsplaats. Indien daartoe aanleiding is, kan de voorzitter
      bepalen dat de huurcommissie ook zitting houdt in een andere gemeente in het ressort van de huurcommissie, of
      in een gemeente in een aangrenzend ressort mits die voorzitter tevens voorzitter is van de huurcommissie in dat
      aangrenzende ressort. In dat geval stellen burgemeester en wethouders van de betrokken gemeente de huurcommissie
      aldaar een passend lokaal ter beschikking.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel33
  - number: '34'
    text: |-
      1 De huurcommissie houdt zitting en beraadslaagt met de voorzitter, alsmede met twee leden, waarvan een lid
      afkomstig is uit de kring van huurders en een lid afkomstig is uit de kring van verhuurders. De voorzitter heeft de
      leiding van de zitting.

      2 De voorzitter en de aan de zitting deelnemende leden van de huurcommissie maken zich voor de aanvang van de
      behandeling van het verzoek bekend en ondervragen vervolgens partijen of hun gemachtigden alsmede door partijen
      voor de aanvang van de zitting aan de voorzitter opgegeven getuigen en deskundigen.

      3 Partijen worden daarbij in de gelegenheid gesteld door tussenkomst van de voorzitter ter zake dienende vragen tot
      elkaar te richten.

      4 Voordat de behandeling ter zitting wordt gesloten, heeft ieder van de partijen het recht het woord te voeren.

      5 Zodra de behandeling ter zitting gesloten is, deelt de voorzitter mede wanneer uitspraak zal worden gedaan.

      6 Indien een nader onderzoek noodzakelijk blijkt of indien een onderzoek alsnog wenselijk wordt geacht, kan de
      commissie tot het instellen daarvan besluiten, zulks onder gelijktijdige bepaling wie daarmee is belast. In dat
      geval zijn de verdere bepalingen over het voorbereidend onderzoek van overeenkomstige toepassing.

      7 De huurcommissie beraadslaagt buiten aanwezigheid van partijen of derden, beslist daarbij bij meerderheid
      van stemmen en baseert haar uitspraken uitsluitend op hetgeen ter zitting is besproken en op de stukken die
      overeenkomstig [artikel 28, zesde lid][ref1], ter inzage zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel28
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '28'
        hoofdstuk: V
        paragraaf: '2'
  - number: '35'
    text: |-
      Indien een machtiging als bedoeld in [artikel 2:1, tweede lid, van de Algemene wet bestuursrecht][ref1] ontbreekt,
      kan de huurcommissie de zaak aanhouden totdat de betrokken partij in de gelegenheid is geweest op de juiste wijze
      in zijn vertegenwoordiging te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel21
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:1
  - number: '36'
    text: |-
      De secretaris is bij de zittingen van de huurcommissie aanwezig. Hij houdt aantekening van al hetgeen daar
      wordt behandeld met vermelding van de zakelijke inhoud van de verklaringen van de door de huurcommissie gehoorde
      personen.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel36
  - number: '37'
    text: |-
      1 De huurcommissie doet binnen vier maanden na het verstrijken van de in [artikel 7, vijfde lid][ref1], genoemde
      termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft te worden gedaan, na het tijdstip waarop
      de aldaar bedoelde vergoeding van de verzoeker is ontvangen, schriftelijk en met redenen omkleed uitspraak. In
      afwijking van de eerste volzin doet de huurcommissie in het geval dat de in de eerste volzin genoemde termijn niet
      kan worden gehaald, uitspraak binnen een door de huurcommissie aan te geven langere termijn, mits zij aan beide
      partijen daarvan voor het verstrijken van de in de eerste volzin genoemde termijn schriftelijk en met redenen
      omkleed heeft kennisgegeven.

      2 De uitspraken van de huurcommissie vermelden de namen van degenen die aan de behandeling van de zaak ter zitting
      hebben deelgenomen. Zij worden door de voorzitter en de secretaris ondertekend.

      3 De secretaris zendt onverwijld bij aangetekende brief of bij brief met ontvangstbevestiging een afschrift van de
      uitspraak van de huurcommissie aan partijen.

      4 De huurcommissie wijst in haar uitspraak partijen op de in [artikel 7:262 van het Burgerlijk Wetboek][ref2]
      bedoelde mogelijkheid zich tot de rechter te wenden, alsook op de vorm en de termijn die daarbij in acht moeten
      worden genomen.

      5 Indien in de uitspraak wordt vastgesteld dat een woonruimte een of meer gebreken vertoont die
      het woongenot ernstig schaden zendt de secretaris bovendien afschrift aan de inspecteur, bedoeld in
      [artikel 1, eerste lid, van de Woningwet][ref3], en aan burgemeester en wethouders van de gemeente waarin de
      woonruimte is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel262
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '262'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '38'
    text: |-
      De voorzitter, de leden, de plaatsvervangende leden en de secretaris mogen zich direct noch indirect in enig
      bijzonder onderhoud of gesprek inlaten met partijen of hun raadslieden, noch enige bijzondere onderrichting,
      memorie of geschriften aannemen over enige aangelegenheid, welke aanhangig is of waarvan zij weten of vermoeden,
      dat deze aanhangig zal worden bij de huurcommissie waartoe zij behoren.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel38
  - number: '39'
    text: |-
      1 De huurcommissie kan, voorzover dat redelijkerwijs voor de uitoefening haar taak nodig is, van de verhuurder
      inzage en het nemen van afschrift vorderen van boeken en andere zakelijke bescheiden.

      2 De verhuurder is verplicht van hem krachtens het eerste lid gevorderde inzage en nemen van afschrift van boeken
      en andere zakelijke bescheiden te verlenen, een en ander op de wijze en binnen de termijn, door de voorzitter van
      de huurcommissie te bepalen.

      3 Het niet voldoen aan de in het tweede lid omschreven verplichting wordt gestraft met een geldboete van de tweede
      categorie. Het strafbare feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel39
  - number: '40'
    text: |-
      De voorzitter en de leden van een huurcommissie hebben toegang tot alle woon- en bedrijfsruimten, alsmede tot
      ruimte die als zodanig kan worden gebruikt, voorzover dat redelijkerwijs voor de uitoefening van hun taak nodig
      is. Zij kunnen zich bij het betreden door bepaalde, door hen aan te wijzen personen doen vergezellen. Zo nodig
      verschaffen zij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel40
  - number: '41'
    text: |-
      1 Een huurcommissie stelt, na overleg met de andere huurcommissies ten aanzien van de in het tweede lid bedoelde
      beleidsvoornemens, tijdig voor afloop van een kalenderjaar een jaarplan voor het volgende kalenderjaar vast.

      2 Het jaarplan geeft een schatting van het aantal zittingen dat de huurcommissie in het desbetreffende kalenderjaar
      zal houden, alsmede inzicht in de beleidsvoornemens van de huurcommissie voor het tijdvak vanaf 1 juli van het
      desbetreffende kalenderjaar tot 1 juli van het daaropvolgende jaar met betrekking tot toetsing van verzoeken
      als bedoeld in [artikel 9][ref1], voorzover die behoren tot de door Onze Minister daartoe aangewezen categorieën
      verzoeken.

      3 Het jaarplan wordt aan Onze Minister toegezonden. Het ligt voor een ieder ter inzage bij het secretariaat van
      de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel9
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '42'
    text: |-
      1 Ten minste eenmaal per vier maanden verstrekt de huurcommissie aan Onze Minister een opgave, houdende het aantal
      van de sedert de afsluiting van de vorige opgave binnengekomen, door de huurcommissie te behandelen zaken, alsmede
      het aantal sinds het tijdstip van afsluiting van de vorige opgave door haar afgedane zaken.

      2 De secretaris houdt een openbaar register aan, waarin met weglating van de namen van de betrokken huurders en
      verhuurders de slotwoorden van de uitspraken van de huurcommissie en van de uitspraken van de voorzitter van de
      huurcommissie zijn opgenomen.

      3 Onze Minister kan regels geven omtrent de inrichting van dit register. Tevens kan Onze Minister regels geven met
      betrekking tot door de secretaris aan te houden andere registers.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel42
  - number: '43'
    text: |-
      1 Een huurcommissie stelt jaarlijks voor 1 maart een verslag op van de werkzaamheden, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van haar werkwijze in het bijzonder in het afgelopen kalenderjaar.
      Het verslag geeft tevens inzicht in het gevoerde beleid van de huurcommissie in het afgelopen kalenderjaar met
      betrekking tot de toetsing van de ingevolge [artikel 41, tweede lid][ref1], aangewezen categorieën verzoeken.

      2 Het verslag wordt toegezonden aan Onze Minister, Onze Minister van Justitie en de rechter met wiens rechtsgebied
      dat van de huurcommissie samenvalt, en aan de andere huurcommissies.

      3 Het verslag wordt ingericht overeenkomstig door Onze Minister te geven regels. Het ligt voor een ieder ter inzage
      bij het secretariaat van de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel41
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '41'
        hoofdstuk: V
        paragraaf: '3'
  - number: '44'
    text: |-
      De huurcommissies verstrekken desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel44
  - number: '45'
    text: |-
      1 Onze Minister kan aan de huurcommissies, na overleg met de voorzitters van de huurcommissies, algemene
      aanwijzingen geven met betrekking tot de door de huurcommissies uit te oefenen taken.

      2 De in het eerste lid bedoelde aanwijzingen worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel45
  - number: '46'
    text: |-
      Krachtens de [artikelen 3, tweede lid][ref1], [7, derde lid][ref2],[ 8][ref3], [10, eerste lid][ref4], en
      [12, tweede lid][ref5], vast te stellen algemene maatregelen van bestuur treden niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin zij zijn geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel46
