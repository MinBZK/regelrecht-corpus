  - number: '8'
    text: |-
      Voor het door de huurcommissie uitbrengen van een advies als bedoeld in [artikel 5, vijfde lid][ref1], is door
      de verzoeker een vergoeding aan de Staat verschuldigd, waarvan het bedrag en de wijze van betaling bij algemene
      maatregel van bestuur worden vastgesteld.


