  - number: '7'
    text: |-
      1 Voor het door de huurcommissie doen van een uitspraak, met uitzondering van een uitspraak als bedoeld in
      [artikel 4, vierde lid][ref1], en [5, eerste lid][ref2], is door de verzoeker een voorschot op de vergoeding aan de
      Staat, als bedoeld in het tweede lid, verschuldigd.

      2 Bij het doen van de uitspraak geeft de huurcommissie gemotiveerd aan of de verzoeker een vergoeding aan de
      Staat verschuldigd is. Deze vergoeding is verschuldigd door de verzoeker indien deze naar het oordeel van de
      huurcommissie geheel of voor het grootste deel, gelet op de strekking van het verzoekschrift, de in het ongelijk
      gestelde partij is. Indien de huurcommissie van oordeel is dat beide partijen in ongeveer gelijke mate in het
      ongelijk worden gesteld, kan zij gemotiveerd uitspreken dat de verzoeker de helft van de vergoeding aan de Staat
      verschuldigd is. In gevallen waarin de voorzitter van de huurcommissie bevoegd is tot het doen van een uitspraak,
      komen de in de eerste tot en met derde volzin bedoelde bevoegdheden toe aan de voorzitter.

      3 Het bedrag en de wijze van betaling van het in het eerste lid bedoelde voorschot en de in het tweede lid bedoelde
      vergoeding worden bij algemene maatregel van bestuur vastgesteld.

      4 Na het doen van een uitspraak wordt de bij wijze van voorschot betaalde vergoeding terugbetaald, voorzover geen
      vergoeding verschuldigd is als bedoeld in het tweede lid.

      5 De huurcommissie roept de verzoeker bij schriftelijk bericht op, onder kennisgeving van de ontvangst van het
      verzoek, tot betaling van het in het eerste lid bedoelde voorschot op de vergoeding, voor zover dit op dat tijdstip
      nog niet is voldaan, binnen vier weken na de datum van verzending van dat bericht.

      6 Ingeval de verzoeker het voorschot op de vergoeding niet binnen de in het vijfde lid genoemde termijn heeft
      voldaan, wordt het verzoek niet-ontvankelijk verklaard.

      7 Indien het verzoek voor de uitspraak wordt ingetrokken, ontvangt de verzoeker het betaalde voorschot op de
      vergoeding niet terug.

      8 De voorzitter van de huurcommissie is bevoegd op verzoek vrijstelling te verlenen van de aan de Staat
      verschuldigde vergoeding, bedoeld in het eerste en tweede lid. Zolang niet is beslist op een aanvraag om
      vrijstelling van de in het eerste lid bedoelde vergoeding, wordt de in het vijfde lid genoemde termijn opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel5
