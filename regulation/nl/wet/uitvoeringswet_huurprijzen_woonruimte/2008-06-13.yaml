      - id: ref2
        bwb_id: BWBR0005682
  - number: '24'
    text: |-
      1 Onze Minister benoemt, schorst en ontslaat de leden en de plaatsvervangende leden van een huurcommissie.
      Zij worden benoemd voor een tijdvak van vier jaar en zijn als lid van die huurcommissie, onderscheidenlijk
      plaatsvervangend lid, voor een aansluitend tijdvak eenmaal herbenoembaar.

      2 Tot lid of plaatsvervangend lid worden slechts benoemd personen die over voldoende deskundigheid beschikken om
      bij te dragen aan een behoorlijke vervulling van de ingevolge de wet aan de huurcommissie opgedragen taken.

      3 De benoeming van de leden en de plaatsvervangende leden geschiedt zodanig dat in de huurcommissie leden en
      plaatsvervangende leden uit de kring van huurders, onderscheidenlijk uit de kring van verhuurders, gelijkelijk
      zijn vertegenwoordigd.

      4 Onze Minister stelt met inachtneming van het derde lid bij iedere benoeming de door hem daartoe aangewezen
      organisaties, die geacht kunnen worden de belangen van de huurders, onderscheidenlijk de belangen van de
      verhuurders, te behartigen, gedurende negen weken in de gelegenheid een aanbeveling te doen. Indien meer dan één
      organisatie is aangewezen om een aanbeveling te doen, stelt Onze Minister de betrokken organisaties slechts in
      de gelegenheid tezamen een aanbeveling te doen. Bij het doen van een aanbeveling wordt rekening gehouden met het
      tweede lid.

      5 Onze Minister neemt binnen zes weken na het verstrijken van de in het vierde lid bedoelde termijn over de
      benoeming een beslissing.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel24
  - number: '25'
    text: |-
      De voorzitter, de leden en de plaatsvervangende leden worden op eigen aanvraag ontslagen. Zij kunnen voorts worden
      geschorst of ontslagen wegens ongeschiktheid, onbekwaamheid of andere zwaarwegende gronden. De voorzitter wordt ook
      ontslagen indien hij de voor hem geldende pensioengerechtigde leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel25
  - number: '26'
    text: |-
      1 Een huurcommissie heeft een secretariaat.

      2 Onze Minister draagt zorg voor de instandhouding en inrichting van het secretariaat.

      3 Het secretariaat bestaat uit een secretaris, alsmede uit medewerkers, die onder leiding staan van de secretaris.

      4 De secretaris en de medewerkers van het secretariaat zijn voor hun werkzaamheden voor de huurcommissie
      uitsluitend verantwoording verschuldigd aan de huurcommissie.

      5 Onze Minister benoemt, bevordert, schorst en ontslaat de secretaris en de medewerkers van het secretariaat.
      De secretaris wordt slechts benoemd, bevorderd, geschorst of ontslagen na overleg met de voorzitter van de
      huurcommissie.

      6 Onze Minister kan een of meer medewerkers van het secretariaat aanwijzen als plaatsvervangend secretaris van
      de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel26
  - number: '27'
    text: |-
      1 De voorzitter geniet een bezoldiging welke bij algemene maatregel van bestuur wordt vastgesteld. Hij geniet
      voorts vergoeding voor reis- en verblijfkosten volgens bij algemene maatregel van bestuur te geven regels.

      2 De leden en de plaatsvervangende leden genieten een vergoeding voor reis- en verblijfkosten en verdere
      vergoedingen volgens bij regeling van Onze Minister te geven regels.
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel27
  - number: '28'
    text: |-
      1 Alvorens een voorbereidend onderzoek in te stellen of een uitspraak te doen als bedoeld in
      [artikel 4, tweede of derde lid][ref1], wordt de partij die niet de verzoeker is, in kennis gesteld van de
      inhoud van het verzoek. Alvorens een uitspraak te doen als bedoeld in [artikel 4, tweede of derde lid][ref2],
      of [artikel 5, eerste lid][ref3], wordt een voorbereidend onderzoek ingesteld. Een zodanig onderzoek blijft
      achterwege indien de beschikbare stukken naar het oordeel van de voorzitter voldoende zijn ter voorbereiding van
      de besluitvorming.

      2 Het voorbereidend onderzoek wordt ingesteld door de secretaris of door een door hem daartoe aangewezen ambtenaar
      van het secretariaat. In bijzondere gevallen kunnen de voorzitter of een of meer leden van de huurcommissie het
      onderzoek ook zelf instellen.

      3 Onze Minister kan nadere regels geven ten aanzien van de bij het voorbereidend onderzoek te volgen werkwijze.

      4 Van het ingestelde voorbereidend onderzoek wordt door de secretaris, onderscheidenlijk de voorzitter of de met
      het onderzoek belaste leden van de huurcommissie, een schriftelijk rapport opgemaakt.

      5 In de gevallen waarin de voorzitter geen uitspraak doet, bepaalt de voorzitter de dag en het uur, waarop het
      verzoek ter zitting van de huurcommissie zal worden behandeld, zodra het voorbereidend onderzoek naar het oordeel
      van de voorzitter voltooid is, of, indien dit onderzoek ingevolge het eerste lid niet wordt ingesteld, reeds
      aanstonds.

      6 De secretaris legt de op de zaak betrekking hebbende stukken tot de dag van de zitting bij het secretariaat ter
      inzage voor partijen of hun schriftelijk gemachtigden.

      7 De secretaris geeft partijen van de gegevens omtrent de zitting onverwijld, doch ten minste twee weken voor de
      dag van de behandeling van het verzoek ter zitting, kennis. De kennisgeving gaat vergezeld van een afschrift van
      het in het vierde lid bedoelde rapport of bevat de mededeling dat ter zake geen voorbereidend onderzoek nodig is
      geacht, zulks onder vermelding van de redenen die tot dat oordeel hebben geleid. De kennisgeving bevat voorts de
      mededeling dat de stukken overeenkomstig het zesde lid ter inzage liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2008-06-13#Artikel28
