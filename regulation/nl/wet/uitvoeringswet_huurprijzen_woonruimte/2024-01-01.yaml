  - number: '21'
    text: |-
      1 Het bestuur vormt voor de behandeling van zaken ter zitting bij bestuursreglement als bedoeld in
      [artikel 3f][ref1] zittingscommissies.

      2 De zittingscommissie houdt zitting in het arrondissement waarbinnen de woonruimte waarop het geschil betrekking
      heeft, is gelegen. Indien daartoe aanleiding bestaat kan het bestuur bepalen dat de zittingscommissie zitting houdt
      in een ander arrondissement dat binnen een redelijke afstand van die woonruimte ligt, waarbij een goede balans
      tussen enerzijds de laagdrempeligheid van de huurcommissie en anderzijds een efficiënte werkwijze wordt bevorderd.

      3 Het bestuur wijst bij bestuursreglement als bedoeld in [artikel 3f][ref2] ten minste drie zittingslocaties als
      bedoeld in artikel 3f, tweede lid, aan waar een zittingscommissie geschillen als bedoeld in [artikel 4a][ref3]
      kan behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3f
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel3f
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
