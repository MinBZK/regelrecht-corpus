  - number: '40'
    text: |-
      1 De zittingsvoorzitter en de zittingsleden hebben toegang tot alle woon- en bedrijfsruimten, alsmede tot ruimte
      die als zodanig kan worden gebruikt, voorzover dat redelijkerwijs voor de uitoefening van hun taak nodig is. Zij
      kunnen zich bij het betreden door bepaalde, door hen aan te wijzen personen doen vergezellen. Zo nodig verschaffen
      zij zich de toegang met behulp van de sterke arm.

      2 Dit artikel is niet van toepassing op geschillen als bedoeld in [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel40
