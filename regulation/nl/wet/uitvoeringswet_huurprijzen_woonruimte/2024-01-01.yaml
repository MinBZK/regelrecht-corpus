  - number: 12a
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:248, vierde lid, van het Burgerlijk Wetboek][ref1]
      doet de huurcommissie uitspraak over de redelijkheid van de huurprijsverhoging die volgt uit het in het
      derde lid van dat artikel bedoelde beding. De huurcommissie toetst de huurprijsverhoging aan het krachtens
      [artikel 10, derde lid][ref2], geldende maximale huurverhogingspercentage dan wel [artikel 10a, tweede lid][ref3].
      De huurcommissie vermeldt in de uitspraak de ingangsdatum van de huurprijsstijging, zijnde de uit de
      huurovereenkomst voortvloeiende datum, alsmede tot welke huurprijs toepassing van de tweede zin leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel248
