  - number: '20'
    text: |-
      1 a. De voorzitter doet onverwijld, in ieder geval binnen vier weken na het verstrijken van de in
      [artikel 7, vierde lid][ref1], genoemde termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft
      te worden gedaan, na het tijdstip waarop de aldaar bedoelde vergoeding van de verzoeker is ontvangen, of binnen
      vier weken na het voorbereidend onderzoek, bedoeld in [artikel 28][ref2], schriftelijk en met redenen omkleed
      uitspraak, indien:

      1°. het verzoek kennelijk niet-ontvankelijk is,

      2°. het verzoek kennelijk redelijk of niet redelijk is,

      3°. het voorstel dat ten grondslag ligt aan het verzoek, kennelijk redelijk of niet redelijk is,

      4°. de aan het verzoek ten grondslag liggende bezwaren kennelijk gegrond of ongegrond zijn of

      5°. de bezwaren tegen het aan het verzoek ten grondslag liggende voorstel kennelijk ongegrond zijn.

      b. Onverminderd onderdeel a doet de voorzitter binnen vier maanden na het verstrijken van de in
      [artikel 7, vierde lid][ref3], genoemde termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft
      te worden gedaan, na het tijdstip waarop de aldaar bedoelde vergoeding van de verzoeker is ontvangen of binnen
      vier maanden na het voorbereidend onderzoek, bedoeld in [artikel 28][ref4], desverzocht tevens schriftelijk en
      met redenen omkleed uitspraak indien in de huurovereenkomst of anderszins tussen partijen is afgesproken dat de
      desbetreffende aangelegenheden bij geschil aan de voorzitter kunnen worden voorgelegd.

      2 Van een kennelijk redelijk verzoek is in ieder geval sprake in het geval, bedoeld in
      [artikel 7:253, vijfde lid, van het Burgerlijk Wetboek][ref5], tenzij:

      a. de huurcommissie in een eerdere uitspraak heeft uitgesproken dat op grond van
      [artikel 7:257 van het Burgerlijk Wetboek][ref6] een lagere huurprijs redelijk is en de in die uitspraak genoemde
      gebreken nog niet zijn verholpen;

      b. het percentage van de in het voorstel opgenomen huurverhoging het in [artikel 10, tweede lid][ref7], bedoelde
      maximale huurverhogingspercentage te boven gaat, in welk geval het verzoek slechts kennelijk redelijk is, voorzover
      het dat percentage niet overschrijdt.

      3 De voorzitter vermeldt in voorkomende gevallen in de uitspraak, bedoeld in het eerste lid, onderdeel a, tot welke
      huurprijs zijn uitspraak leidt, alsmede de datum van ingang. Hetgeen in deze wet is bepaald met betrekking tot een
      uitspraak van de huurcommissie is van overeenkomstige toepassing op de uitspraak van de voorzitter, bedoeld in het
      eerste lid, onderdeel b.

      4 [Artikel 7][ref8] dan wel, voor geschillen als bedoeld in [artikel 4a][ref9], [artikel 7a][ref10] is van
      overeenkomstige toepassing, met dien verstande dat voor het door de huurcommissie doen van een uitspraak op het
      verzet, bedoeld in het zesde en zevende lid, niet opnieuw de in artikel 7 onderscheidenlijk artikel 7a bedoelde
      vergoeding aan de Staat verschuldigd is.

      5 Het bestuur zendt onverwijld een afschrift van de voorzittersuitspraak aan partijen.

      6 Tegen de uitspraak, bedoeld in het eerste lid, kan de huurder, verhuurder, huurdersorganisatie of
      bewonerscommissie binnen drie weken na verzending van het afschrift van die uitspraak schriftelijk en gemotiveerd
      in verzet gaan bij de huurcommissie. De voorzitter wijst in zijn uitspraak partijen op deze mogelijkheid, alsook op
      de vorm en de termijn die daarbij in acht genomen moeten worden.

      7 Is de huurcommissie van oordeel dat het verzet, bedoeld in het zesde lid, gegrond is, dan vervalt de uitspraak,
      bedoeld in het eerste lid, en wordt het aan de in het eerste lid bedoelde uitspraak ten grondslag liggende verzoek
      overeenkomstig [hoofdstuk III][ref11] door de huurcommissie in behandeling genomen.

      8 Indien geen van de in het zesde lid genoemde partijen binnen de in dat lid genoemde termijn
      in verzet is gegaan, is hetgeen in [artikel 7:262 van het Burgerlijk Wetboek][ref12] dan wel
      [artikel 8a van de Wet op het overleg huurders verhuurder][ref13] is bepaald met betrekking tot een uitspraak van
      de huurcommissie, van overeenkomstige toepassing op de uitspraak van de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
