  - number: '29'
    text: |-
      De voorzitter is bevoegd verzoeken welke gelijkluidend dan wel nagenoeg gelijkluidend zijn gevoegd door de
      huurcommissie te laten behandelen.
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel29
  - number: '30'
    text: |-
      1 Indien door een partij omtrent dezelfde woonruimte gelijktijdig meerdere verzoeken zijn ingediend, worden deze
      gevoegd behandeld.

      2 Indien omtrent dezelfde woonruimte een verzoek als bedoeld in [artikel 7:257 van het Burgerlijk Wetboek][ref1]
      en een verzoek als bedoeld in [artikel 7:253 van dat wetboek][ref2] bij de huurcommissie zijn ingediend, beslist de
      huurcommissie op het eerstgenoemde verzoek alvorens op het andere verzoek te beslissen, tenzij de indiening van het
      eerstgenoemde verzoek heeft plaatsgevonden na het tijdstip waarop volgens het andere verzoek de wijziging van de
      huurprijs dient in te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '253'
  - number: '31'
    text: |-
      1 Voor de aanvang van de behandeling van het verzoek ter zitting kunnen de zittingsvoorzitter en elk van de aan de
      zitting deelnemende zittingsleden door een van de partijen worden gewraakt op grond van feiten of omstandigheden,
      die het vormen van een onpartijdig oordeel zouden kunnen bemoeilijken.

      2 Op grond van zodanige feiten of omstandigheden kan de zittingsvoorzitter, alsmede elk van de aan de zitting
      deelnemende zittingsleden, zich verschonen.

      3 De zittingsvoorzitter en de aan de zitting deelnemende zittingsleden, uitgezonderd de persoon ten aanzien van
      wie ingevolge het eerste of tweede lid wraking, onderscheidenlijk verschoning, wordt gevraagd, beslissen zo spoedig
      mogelijk of de wraking, onderscheidenlijk de verschoning, wordt toegestaan. In geval van staking van stemmen is
      het verzoek tot wraking of verschoning toegestaan. De behandeling van de zaak kan in dat geval tot een door de
      zittingsvoorzitter te bepalen dag en uur worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel31
  - number: '32'
    text: |-
      1 De zittingen van een zittingscommissie zijn openbaar.

      2 In het belang van de openbare orde of op verzoek van een van de partijen, indien haar belangen dit eisen, kan de
      zittingscommissie besluiten dat de zitting met gesloten deuren zal worden gehouden.

      3 De beraadslaging en de beslissing over een verzoek als bedoeld in het tweede lid en
      [artikel 31, derde lid][ref1], geschiedt buiten aanwezigheid van partijen of derden.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel31
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '31'
        hoofdstuk: V
        paragraaf: '2'
  - number: '34'
    text: |-
      1 De zittingsvoorzitter heeft de leiding van de zitting.

      2 De zittingsvoorzitter en de aan de zitting deelnemende zittingsleden van de zittingscommissie maken zich voor de
      aanvang van de behandeling van het verzoek bekend en ondervragen vervolgens partijen of hun gemachtigden alsmede
      door partijen voor de aanvang van de zitting aan de zittingsvoorzitter opgegeven getuigen en deskundigen.

      3 Partijen worden daarbij in de gelegenheid gesteld door tussenkomst van de zittingsvoorzitter ter zake dienende
      vragen tot elkaar te richten.

      4 Voordat de behandeling ter zitting wordt gesloten, heeft ieder van de partijen het recht het woord te voeren.

      5 Zodra de behandeling ter zitting gesloten is, deelt de zittingsvoorzitter mede wanneer uitspraak zal worden
      gedaan.

      6 Indien een nader onderzoek noodzakelijk blijkt of indien een onderzoek alsnog wenselijk wordt geacht, kan
      de zittingsvoorzitter tot het instellen daarvan besluiten. In dat geval zijn de verdere bepalingen over het
      voorbereidend onderzoek van overeenkomstige toepassing.

      7 Een zittingscommissie beraadslaagt buiten aanwezigheid van partijen of derden, beslist daarbij bij meerderheid
      van stemmen en baseert haar uitspraken uitsluitend op hetgeen ter zitting is besproken en op de stukken die
      overeenkomstig [artikel 28, vijfde lid][ref1], ter inzage zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel28
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '28'
        hoofdstuk: V
        paragraaf: '2'
  - number: '35'
    text: |-
      Indien een machtiging als bedoeld in [artikel 2:1, derde lid, van de Algemene wet bestuursrecht][ref1] ontbreekt,
      kan een zittingscommissie de zaak aanhouden totdat de betrokken partij in de gelegenheid is geweest op de juiste
      wijze in zijn vertegenwoordiging te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel21
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:1
  - number: '36'
    text: |-
      Bij de zittingen is een ambtenaar van de administratieve ondersteuning van de huurcommissie aanwezig. Hij houdt
      aantekening van al hetgeen daar wordt behandeld met vermelding van de zakelijke inhoud van de verklaringen van de
      door de zittingscommissie gehoorde personen.
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel36
  - number: '37'
    text: |-
      1 De huurcommissie doet binnen vier maanden na het verstrijken van de in [artikel 7, vierde lid][ref1], genoemde
      termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft te worden gedaan, na het tijdstip waarop
      de aldaar bedoelde vergoeding van de verzoeker is ontvangen, schriftelijk en met redenen omkleed uitspraak. In
      geval van een geschil als bedoeld in [artikel 4a][ref2] doet de huurcommissie uitspraak binnen acht weken na het
      verstrijken van de in artikel 7, vierde lid, genoemde termijn. In afwijking van de eerste en tweede volzin doet de
      huurcommissie in het geval dat de in de eerste, dan wel, tweede volzin genoemde termijn niet kan worden gehaald,
      uitspraak binnen een door de huurcommissie aan te geven langere termijn, mits zij aan beide partijen daarvan voor
      het verstrijken van de in de eerste, dan wel, tweede volzin genoemde termijn schriftelijk en met redenen omkleed
      heeft kennisgegeven.

      2 De uitspraken van de huurcommissie vermelden de namen van degenen die aan de behandeling van de zaak ter zitting
      hebben deelgenomen. Zij worden door de desbetreffende zittingsvoorzitter ondertekend.

      3 Het bestuur zendt onverwijld een afschrift van de uitspraak van de huurcommissie aan partijen.

      4 De huurcommissie wijst in haar uitspraak partijen op de in [artikel 7:262 van het Burgerlijk Wetboek][ref3]
      bedoelde mogelijkheid zich tot de rechter te wenden, alsook op de vorm en de termijn die daarbij in acht moeten
      worden genomen.

      5 Indien in de uitspraak wordt vastgesteld dat een woonruimte een of meer gebreken vertoont die
      het woongenot ernstig schaden zendt het bestuur bovendien afschrift aan de inspecteur, bedoeld in
      [artikel 1, eerste lid, van de Woningwet][ref4], en aan burgemeester en wethouders van de gemeente waarin de
      woonruimte is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel262
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel37
