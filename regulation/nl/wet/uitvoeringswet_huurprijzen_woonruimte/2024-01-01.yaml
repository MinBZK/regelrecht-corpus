        artikel: 261a
  - number: 19a
    text: |-
      1 Indien de huurcommissie constateert dat sprake is van een schending door de verhuurder van een verplichting
      die voortvloeit uit de [Wet op het overleg huurders verhuurder][ref1] waardoor de verzoeker is benadeeld, kan
      zij bepalen dat, voor zover het geschil betrekking heeft op voorgenomen beleid van een verhuurder als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet op het overleg huurders verhuurder][ref2], de uitvoering van dat
      beleid wordt opgeschort totdat het verzuim is hersteld.

      2 Indien de huurcommissie wordt verzocht te bepalen dat een genomen besluit van een verhuurder als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet op het overleg huurders verhuurder][ref3], tot wijziging van zijn
      beleid niet mag worden uitgevoerd, kan de huurcommissie bepalen dat een zodanig besluit niet mag worden uitgevoerd,
      indien:

      a. dat besluit afwijkt van een advies als bedoeld in [artikel 5, eerste lid, van die wet][ref4], en

      b. die verhuurder de beslissing tot afwijking van dat advies niet heeft onderbouwd, of hij naar het oordeel van de
      huurcommissie onder afweging van de betrokken belangen niet in redelijkheid tot afwijking van dat advies had kunnen
      komen.

      3 De huurcommissie doet in geval van een geschil over de hoogte van de vergoeding, bedoeld in
      [artikel 7, eerste lid, van de Wet op het overleg huurders verhuurder][ref5], uitspraak over de redelijkheid van
      die vergoeding. De huurcommissie spreekt uit welke vergoeding zij redelijk acht.


