  - number: 3c
    text: Het bestuur geeft leiding aan de werkzaamheden van de huurcommissie en de administratieve ondersteuning.
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel3c
  - number: 3d
    text: |-
      1 De zittingsleden worden op voordracht van het bestuur door Onze Minister benoemd, geschorst en ontslagen.
      De voordracht vindt plaats na overleg tussen het bestuur en de door Onze Minister daartoe aangewezen betrokken
      organisaties, die geacht kunnen worden de belangen van de huurders, onderscheidenlijk de belangen van de
      verhuurders te behartigen. De zittingsleden worden benoemd voor een tijdvak van vier jaar en kunnen voor maximaal
      twee aansluitende tijdvakken van vier jaar als zittingslid worden herbenoemd.

      2 Tot zittingslid worden slechts benoemd personen die over voldoende deskundigheid beschikken om bij te dragen aan
      een behoorlijke uitoefening van de ingevolge de wet aan de huurcommissie opgedragen taken.

      3 De benoeming van de zittingsleden geschiedt zodanig dat de belangen van de huurders, onderscheidenlijk de
      belangen van de verhuurders gelijkelijk in de huurcommissie zijn vertegenwoordigd.

      4 Onze Minister neemt binnen zes weken nadat de voordracht is gedaan een beslissing over de benoeming.

      5 De zittingsleden genieten een vergoeding voor reis- en verblijfkosten en verdere vergoedingen volgens bij
      ministeriële regeling te geven regels.
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel3d
  - number: 3e
    text: |-
      Onverminderd [artikel 12, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], worden de voorzitter,
      de plaatsvervangend voorzitter en de zittingsvoorzitters ook ontslagen indien zij de leeftijd van zeventig jaren
      hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
