      In geval van een verzoek als bedoeld in [artikel 7:255a, derde lid, van het Burgerlijk Wetboek][ref1]
      doet de huurcommissie uitspraak omtrent de huurprijswijziging die zij redelijk acht.
      [Artikel 15, eerste lid, tweede volzin, en tweede lid, eerste volzin][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255a
