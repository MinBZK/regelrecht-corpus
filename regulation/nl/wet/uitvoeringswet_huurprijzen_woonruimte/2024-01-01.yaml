preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is tegelijk met het voorstel van wet tot herziening van
    Boek 7A van het Burgerlijk Wetboek, waarbij een aantal bepalingen van de Huurprijzenwet woonruimte naar de nieuwe
    titel 7.4 van Boek 7 van dat wetboek wordt overgeheveld, de overige bepalingen van de Huurprijzenwet woonruimte
    en die van de Wet op de huurcommissies te integreren in een nieuw wetsvoorstel en deze bepalingen waar mogelijk te
    vereenvoudigen, alsmede op een aantal plaatsen inhoudelijke wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      ao. *bestuur:* bestuur als bedoeld in [artikel 3a, tweede lid][ref1];

      a. *gebrek:* gebrek als bedoeld in [artikel 7:241 van het Burgerlijk Wetboek][ref2];

      b. *huurcommissie:* huurcommissie als bedoeld in artikel 3a;

      c. *inflatiepercentage:* het onmiddellijk voorafgaand aan de datum van 1 juli, ieder jaar in januari door het
      Centraal Bureau voor de Statistiek bekendgemaakte percentage, waarmee de consumentenprijzen (alle huishoudens) ten
      opzichte van het aan die bekendmaking voorafgaande jaar zijn verhoogd;

      d. *Onze Minister:* Onze Minister voor Wonen en Rijksdienst;

      e. *zittingscommissie:* zittingscommissie als bedoeld in [artikel 21, eerste lid][ref3].

      2 In deze wet en de daarop berustende bepalingen wordt onder woonruimte, zelfstandige woning, woonwagen,
      standplaats, prijs, huurprijs, huishoudinkomen, inkomenstoetsjaar, peiljaar, kosten voor nutsvoorzieningen met
      een individuele meter, servicekosten en energieprestatievergoeding verstaan hetgeen daaronder wordt verstaan in
      [afdeling 5 van titel 7.4 van Boek 7 van het Burgerlijk Wetboek][ref4].


