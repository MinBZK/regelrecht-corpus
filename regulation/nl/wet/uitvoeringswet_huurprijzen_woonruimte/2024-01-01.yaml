  - number: '16'
    text: |-
      1 In geval van een verzoek als bedoeld in [artikel 7:257, tweede lid, van het Burgerlijk Wetboek][ref1] doet
      de huurcommissie uitspraak of zij van oordeel is dat de overeengekomen huurprijs, in verband met de gebreken
      ten aanzien van de woonruimte, in rekening dient te worden gebracht. Indien de commissie van oordeel is dat die
      huurprijs, in verband met de gebreken, niet in rekening dient te worden gebracht, geeft zij deze gebreken in de
      uitspraak aan en vermeldt zij een in verhouding tot die gebreken lagere huurprijs als de in rekening te brengen
      huurprijs.

      2 De huurcommissie neemt bij haar oordeel de krachtens [artikel 12, tweede lid][ref2], vastgestelde regels in acht,
      met dien verstande dat de huurcommissie zich slechts een eigen oordeel over de gebreken vormt, voorzover deze aan
      de verhuurder door middel van de in [artikel 7:207 van het Burgerlijk Wetboek][ref3] bedoelde kennisgeving door de
      huurder zijn gemeld, alsmede over de gebreken die van zodanige aard of samenhang zijn dat ze ook zonder aanzegging
      aan de verhuurder bekend moesten zijn, zulks naar de toestand op het tijdstip waarop de bedoelde kennisgeving door
      de huurder is verzonden.

      3 De huurcommissie vermeldt in de uitspraak de datum van ingang van de in rekening te brengen lagere huurprijs,
      zijnde de eerste dag van de maand, volgend op die waarin de in het tweede lid bedoelde aanzegging door de huurder
      aan de verhuurder is verzonden.

      4 [Artikel 12, vierde en vijfde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel207
      [ref4]: https://wetten.overheid.nl/BWBR0014315#Artikel12
