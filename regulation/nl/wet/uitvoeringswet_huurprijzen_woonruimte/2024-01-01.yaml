  - number: '46'
    text: |-
      Een voordracht voor een krachtens [artikel 3, tweede lid][ref1], [7, eerste lid][ref2], [7a, eerste lid][ref3],
      [8][ref4], [artikel 10, eerste of derde lid][ref5], of [12, tweede lid][ref6], vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
