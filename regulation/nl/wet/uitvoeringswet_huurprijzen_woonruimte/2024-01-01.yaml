  - number: 3a
    text: |-
      1 Er is een huurcommissie.

      2 De huurcommissie bestaat uit een bestuur en minimaal vier en maximaal tien zittingsvoorzitters. Daarnaast
      bestaat de huurcommissie uit zittingsleden uit de kring van huurders onderscheidenlijk de kring van verhuurders.
      Voor de behandeling van geschillen als bedoeld in [artikel 4a][ref1] kunnen ook personen van buiten de kring van
      huurders onderscheidenlijk de kring van verhuurders zittingslid zijn. Het bestuur bestaat uit een voorzitter en een
      plaatsvervangend voorzitter.

      3 Het bestuur en de zittingsvoorzitters hebben tot taak binnen de huurcommissie de eenheid en de kwaliteit van de
      uitspraken, adviezen en verklaringen te bevorderen. Zij kunnen met het oog hierop regels stellen. Bij de uitvoering
      van deze taak treden zij niet in de procesrechtelijke behandeling van, de inhoudelijke beoordeling van alsmede de
      beslissing in een concrete zaak.

      4 Indien ten aanzien van het stellen van de regels, bedoeld in het derde lid, tussen het bestuur enerzijds en de
      zittingsvoorzitters gezamenlijk anderzijds een verschil van mening bestaat, beslist het bestuur. Indien binnen het
      bestuur een verschil van mening bestaat, beslist de voorzitter. Indien binnen de kring van zittingsvoorzitters een
      verschil van mening bestaat, wordt onderling bij meerderheid van stemmen beslist, waarbij bij een staking van de
      stemmen binnen die kring het bestuur beslist.

      5 In afwijking van [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref2], heeft het bestuur, in plaats
      van het zelfstandig bestuursorgaan, de bevoegdheden en taken die zijn genoemd in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel20
