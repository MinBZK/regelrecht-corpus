  - number: 4a
    text: |-
      De huurcommissie doet uitspraak in geschillen over:

      a. het voeren van overleg en het verschaffen van informatie als bedoeld in de
      [Wet op het overleg huurders verhuurder][ref1];

      b. het bevorderen van de werkzaamheden van een bewonerscommissie als bedoeld in [die wet][ref2];

      c. het vergoeden van kosten van een huurdersorganisatie als bedoeld in [die wet][ref3];

      d. overige verplichtingen die voortvloeien uit [die wet][ref4];

      e. het voeren van overleg als bedoeld in de [artikelen 43, tweede lid][ref5], [53, tweede lid, tweede volzin][ref6]
      en [55b, tweede lid, van de Woningwet][ref7].


