  - number: '4'
    text: |-
      1 De huurcommissie heeft de in het tweede tot en met vijfde lid en in de [artikelen 4a][ref1] en [5][ref2]
      aangegeven taken.

      2 De huurcommissie doet uitspraak:

      0a. ingevolge [artikel 7:248, vierde lid, van het Burgerlijk Wetboek][ref3] over verhoging van de huurprijs;

      a. ingevolge [artikel 7:249 van het Burgerlijk Wetboek][ref4] over de redelijkheid van de overeengekomen
      aanvangshuurprijs;

      b. ingevolge [artikel 7:253 van het Burgerlijk Wetboek][ref5] over de redelijkheid van het voorstel tot verhoging
      van de huurprijs;

      c. ingevolge [artikel 7:254 van het Burgerlijk Wetboek][ref6] over de redelijkheid van het voorstel tot verlaging
      van de huurprijs;

      d. ingevolge de [artikelen 7:255][ref7] en [7:255a van het Burgerlijk Wetboek][ref8] over het bedrag van de
      verhoging van de huurprijs na de totstandkoming van voorzieningen, veranderingen of toevoegingen;

      e. ingevolge [artikel 7:257 van het Burgerlijk Wetboek][ref9] over de in rekening te brengen huurprijs bij
      vermindering van het woongenot als gevolg van een gebrek;

      f. ingevolge [artikel 7:258 van het Burgerlijk Wetboek][ref10] over de huurprijs en het voorschotbedrag aan kosten
      voor nutsvoorzieningen met een individuele meter en servicekosten indien tussen partijen slechts een prijs en niet
      een huurprijs is overeengekomen;

      g. ingevolge [artikel 7:260 van het Burgerlijk Wetboek][ref11] over de betalingsverplichting met betrekking tot de
      kosten voor nutsvoorzieningen met een individuele meter en servicekosten;

      h. ingevolge [artikel 7:261 van het Burgerlijk Wetboek][ref12] over het voorschotbedrag van de kosten voor
      nutsvoorzieningen met een individuele meter;

      i. ingevolge [artikel 7:261a van het Burgerlijk Wetboek][ref13] over de energieprestatievergoeding;

      j. ingevolge [artikel 54a, zesde lid, van de Woningwet][ref14] over het voorstel tot huurverlaging als bedoeld in
      het eerste lid van dat artikel of het ontbreken daarvan.

      3 De huurcommissie doet uitspraak in gevallen waarin als gevolg van een uitspraak als bedoeld in de
      [artikelen 7:249][ref15] en [7:257 van het Burgerlijk Wetboek][ref16] de in rekening te brengen huurprijs in
      verband met gebreken is verlaagd, omtrent het verholpen zijn van die gebreken.

      4 De huurcommissie doet uitspraak indien ingevolge [artikel 20, zesde lid][ref17], verzet is gedaan tegen een
      uitspraak van de voorzitter.

      5 Indien de verhuurder een door de huurder bij hem schriftelijk ingediende klacht over de gedraging van de
      verhuurder in het kader van de door de verhuurder op basis van de tussen partijen geldende huurovereenkomst aan
      de huurder geleverde producten en verrichte diensten van de huurder niet binnen een redelijke termijn na indiening
      van die klacht inhoudelijk heeft behandeld dan wel indien de huurder niet instemt met de beoordeling van die klacht
      door de verhuurder, kan de huurder tot uiterlijk een jaar na het tijdstip waarop de gedraging van de verhuurder
      heeft plaatsgevonden de huurcommissie verzoeken uitspraak te doen in het geschil dat voortvloeit uit die klacht.
      Een gedraging van een persoon die werkzaam is onder de verantwoordelijkheid van de verhuurder, wordt aangemerkt als
      een gedraging van die verhuurder. Onder een gedraging wordt niet verstaan een gedraging ten aanzien van het toe- en
      afwijzen van een woonruimte, een wanbetaling, een huurbeëindiging of het afsluiten van nutsvoorzieningen.

      6 De huurcommissie is niet bevoegd een uitspraak te doen indien het verzoek, bedoeld in het vijfde lid, betrekking
      heeft op:

      a. een gedraging ten aanzien waarvan door een rechterlijke instantie uitspraak is gedaan,

      b. een gedraging ten aanzien waarvan een procedure bij een rechterlijke instantie aanhangig is.


