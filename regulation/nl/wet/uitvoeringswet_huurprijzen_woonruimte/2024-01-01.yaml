  - number: '6'
    text: |-
      1 De voorzitter heeft tot taak:

      a. in afwijking van [artikel 4, eerste lid][ref1], in de in het tweede, derde en vijfde lid van dat artikel
      aangegeven gevallen en over geschillen als bedoeld in [artikel 4a][ref2] uitspraak te doen indien ten aanzien
      van een aan de huurcommissie gedaan verzoek een van de in [artikel 20, eerste lid][ref3], bedoelde gevallen zich
      voordoet;

      b. in de gevallen van een verzoek van de Dienst Toeslagen als bedoeld in
      [artikel 5, tweede lid, van de Wet op de huurtoeslag][ref4] binnen zes weken een verklaring te verstrekken omtrent
      de redelijkheid van de huurprijs en de juistheid van andere gegevens betreffende de woonruimte waarvoor een
      aanvraag om een huurtoeslag is ingediend, een en ander voorzover van belang voor de toepassing van genoemde wet.

      2 De voorzitter kan zich bij de uitoefening van de taken, bedoeld in het eerste lid, laten vervangen door een
      zittingsvoorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
