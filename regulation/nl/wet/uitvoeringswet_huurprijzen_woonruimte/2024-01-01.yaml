      1 In geval van een verzoek als bedoeld in [artikel 7:260 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de betalingsverplichting van de huurder met betrekking tot de servicekosten.

      2 De huurcommissie toetst de kosten voor nutsvoorzieningen met een individuele meter aan de voor de berekening
      daarvan geldende wettelijke voorschriften en aan de redelijkheid.

      3 Indien de verhuurder gebruik heeft gemaakt van het formulier, genoemd in
      [artikel 7:260, derde lid, van het Burgerlijk Wetboek][ref2], toetst de huurcommissie de servicekosten aan de voor
      de berekening daarvan geldende wettelijke voorschriften en aan de redelijkheid.

      4 Indien de verhuurder geen gebruik heeft gemaakt van het formulier, bedoeld in
      [artikel 7:260, derde lid, van het Burgerlijk Wetboek][ref3], dan wel indien dat formulier onvolledig is ingevuld,
      stelt de huurcommissie de servicekosten vast op een bij ministeriële regeling vastgesteld bedrag of indien de zaak
      of dienst door de verhuurder niet is geleverd op € 0.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel260
