  - number: '13'
    text: |-
      1 In geval van een verzoek als bedoeld in [artikel 7:253 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de huurprijsverhoging die staat vermeld in het daaraan ten grondslag liggende
      voorstel. De huurcommissie spreekt uit welke huurprijsverhoging zij redelijk acht, in welk geval zij tevens
      aangeeft tot welke huurprijs die huurprijsverhoging leidt, dan wel dat zij een huurprijsverhoging niet redelijk
      acht.

      2 De huurcommissie vermeldt in de uitspraak de datum van ingang van de huurprijsverhoging, zijnde de in het in het
      eerste lid bedoelde voorstel vermelde datum van ingang, dan wel een latere datum indien de wet zulks voorschrijft.

      3 De huurcommissie toetst het voorstel tot huurprijsverhoging aan het krachtens [artikel 10, tweede lid][ref2],
      geldende maximale huurverhogingspercentage respectievelijk maximale huurverhogingsbedrag dan wel
      [artikel 10a][ref3].

      4 Bij de beoordeling van de kwaliteit van de woonruimte worden voorzieningen die de huurder onverplicht voor
      eigen rekening heeft aangebracht en waardoor het woongerief geacht kan worden te zijn gestegen, buiten beschouwing
      gelaten.

      5 De huurcommissie toetst het voorstel tot huurprijsverhoging, indien de huurder bezwaar heeft gemaakt
      tegen de woningwaardering in het voorstel, dan wel indien de huurprijs, vermeerderd met de voorgestelde
      huurprijsverhoging, de maximale huurprijsgrens zou kunnen overschrijden, tevens aan de krachtens
      [artikel 10, eerste lid][ref4], gegeven regels met betrekking tot de waardering van de kwaliteit van een
      woonruimte. Daarbij vormt de huurcommissie slechts een eigen oordeel over de kwaliteit van de woonruimte,
      voorzover die kwaliteit al dan niet op onderdelen voorwerp van geschil is tussen partijen. De huurcommissie
      vormt zich daarbij geen eigen oordeel over de energieprestatie van de woonruimte, indien de eigenaar een voor
      die woonruimte, overeenkomstig de op grond van [artikel 4.3, eerste lid, aanhef en onder a][ref5], in samenhang
      met [artikel 4.20, aanhef en onder f, van de Omgevingswet][ref6] gegeven regels omtrent de energieprestatie van
      gebouwen, afgegeven energieprestatiecertificaat aan de huurder heeft verstrekt. Indien sprake is van een voorstel
      tot verhoging van de huurprijs als bedoeld in [artikel 7: 252a, eerste lid, van het Burgerlijk Wetboek][ref7],
      toetst de huurcommissie, voor zover het huishoudinkomen in het peiljaar voorwerp van geschil is tussen partijen,
      tevens of dat huishoudinkomen lager is dan of gelijk is aan het op grond van artikel 10, tweede lid, onderdeel
      a, onder 1° dan wel onder 3°, voor het huishouden van de huurder toepasselijke bedrag, dan wel hoger is dan dat
      bedrag.

      6 De huurcommissie beoordeelt de kwaliteit van de woonruimte en de redelijkheid van de wijziging van de huurprijs
      naar de toestand, met uitzondering van de bepaling van de hoogte van het huishoudinkomen, op het tijdstip van de in
      het voorstel tot verhoging van de huurprijs genoemde ingangsdatum.


