  - number: '17'
    text: |-
      1 In geval van een verzoek als bedoeld in [artikel 7:258 van het Burgerlijk Wetboek][ref1] oordeelt de
      huurcommissie dat de voorgestelde huurprijs redelijk is als deze niet lager dan 55% van de overeengekomen prijs
      en het voorgestelde voorschotbedrag voor de kosten voor nutsvoorzieningen en servicekosten niet lager dan 25% van
      de overeengekomen prijs is. Indien de huurcommissie van oordeel is dat de voorgestelde huurprijs niet redelijk is,
      stelt zij deze vast op 55% van de overeengekomen prijs en, voor zover nodig, het voorgestelde voorschotbedrag op
      25% van de overeengekomen prijs.

      2 Indien de huurcommissie van oordeel is dat niet een huurprijs is overeengekomen, vermeldt zij in haar uitspraak
      dat de door haar uitgesproken huurprijs en het voorschotbedrag voor de servicekosten in de plaats treden van de
      overeengekomen prijs met ingang van de eerste dag van de maand, volgend op die waarin het verzoek is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel258
