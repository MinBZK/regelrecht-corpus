  - number: '47'
    text: |-
      Bij ministeriële regeling kunnen:

      a. ter uitvoering van [artikel 7:253 van het Burgerlijk Wetboek][ref1] regels worden gegeven met betrekking tot de
      voorwaarden waaraan het in het tweede lid van dat artikel bedoelde schrijven van de verhuurder aan de huurder dient
      te voldoen, en

      b. ter uitvoering van [artikel 7:257 van het Burgerlijk Wetboek][ref2] regels worden gegeven met betrekking tot de
      voorwaarden waaraan een kennisgeving van de huurder aan de verhuurder van een gebrek dient te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel47
