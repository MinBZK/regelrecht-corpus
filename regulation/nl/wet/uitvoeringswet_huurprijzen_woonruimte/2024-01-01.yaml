  - number: 7a
    text: |-
      1 Voor het door de huurcommissie doen van een uitspraak als bedoeld in [artikel 4a][ref1], is door de verzoeker een
      vergoeding aan de Staat verschuldigd.

      2 Het bedrag van de in het eerste lid bedoelde vergoeding wordt bij algemene maatregel van bestuur vastgesteld.

      3 Op verzoek van een verzoeker, is de voorzitter bevoegd vrijstelling te verlenen van de aan de Staat verschuldigde
      vergoeding, bedoeld in het eerste lid. Bij ministeriële regeling wordt bepaald in welke gevallen de voorzitter
      van de bevoegdheid, bedoeld in de eerste volzin, gebruik kan maken. [Artikel 6, tweede lid][ref2], is van
      overeenkomstige toepassing.

      4 Het [vierde, vijfde en zesde lid van artikel 7][ref3] zijn van overeenkomstige toepassing.


