  - number: '10'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de waardering van de
      kwaliteit van een woonruimte, van de redelijkheid van de huurprijs en van wijziging daarvan, waarbij
      onderscheid kan worden gemaakt tussen woonruimte waarvoor de eigenaar een voor die woonruimte,
      overeenkomstig de op grond van [artikel 4.3, eerste lid, aanhef en onder a][ref1], in samenhang met
      [artikel 4.20, aanhef en onder f, van de Omgevingswet][ref2] gegeven regels omtrent de energieprestatie van
      gebouwen, afgegeven energieprestatiecertificaat aan de huurder heeft verstrekt of indien dat niet het geval is
      daartoe op grond van die regels wel verplicht was, en overige woonruimte.

      2 Bij ministeriële regeling wordt het percentage dan wel het bedrag van de maximale huurverhoging vastgesteld, mede
      aan de hand van:

      a. het gegeven of het huishoudinkomen over het peiljaar of het inkomenstoetsjaar van de op het tijdstip van de
      in het voorstel tot verhoging van de huurprijs genoemde ingangsdatum in de woonruimte wonende huurder en overige
      bewoners:

      1°. niet hoger is dan € 52.753 indien het huishouden bestaat uit de huurder, dan wel niet hoger is dan € 61.046
      indien het huishouden bestaat uit de huurder en een of meer overige bewoners,

      2°. hoger is dan € 52.753 doch niet hoger dan € 62.191 indien het huishouden bestaat uit de huurder, dan wel hoger
      is dan € 61.046 doch niet hoger dan € 82.921 indien het huishouden bestaat uit de huurder en een of meer overige
      bewoners,

      3°. hoger is dan € 62.191 indien het huishouden bestaat uit de huurder, dan wel hoger is dan € 82.921 indien het
      huishouden bestaat uit de huurder en een of meer overige bewoners;

      b. de geldende huurprijs, en

      c. het gegeven of die woonruimte een zelfstandige woning vormt.

      Bij ministeriële regeling worden de bedragen, genoemd in onderdeel a, met ingang van 1 januari van
      elk jaar gewijzigd met het percentage waarmee per 1 januari van het peiljaar het bedrag, genoemd in
      [artikel 18, eerste lid, onderdeel d, van de Wet op de huurtoeslag][ref3] is gewijzigd.

      3 Het maximale huurverhogingspercentage voor huurovereenkomsten als bedoeld in
      [artikel 7:247 van het Burgerlijk Wetboek][ref4] in enig jaar is gelijk aan:

      a. (het gemiddelde van de prijsindexcijfers van de maanden december t-2 tot en met november t-1) / (het gemiddelde
      van de prijsindexcijfers van de maanden december t-3 tot en met november t-2) vermeerderd met één procentpunt,
      waarbij de prijsindexcijfers de cijfers uit de «Consumentenprijsindex Alle Huishoudens» van het Centraal Bureau
      voor de Statistiek zijn en de gemiddelde prijsindexcijfers worden berekend uit de prijsindexcijfers vermeld in het
      nummer van het Statistisch Bulletin, waarin het indexcijfer van november t-1 respectievelijk november t-2, al dan
      niet voorlopig, wordt gepubliceerd, dan wel, indien dat leidt tot een lager percentage;

      b. (het gemiddelde van de CAO-loonindexcijfers van de maanden december t-2 tot en met november t-1) / (het
      gemiddelde van de CAO-loonindexcijfers van de maanden december t-3 tot en met november t-2) waarbij de CAO-
      loonindexcijfers de cijfers uit de «CAO-loonindex Alle Economische Activiteiten, Cao-lonen per uur inclusief
      bijzondere beloningen» van het Centraal Bureau voor de Statistiek zijn en de gemiddelde loonindexcijfers worden
      berekend uit de CAO-loonindexcijfers vermeld in het nummer van het Statistisch Bulletin, waarin het indexcijfer
      van november t-1 respectievelijk november t-2, al dan niet voorlopig, wordt gepubliceerd, vermeerderd met één
      procentpunt.


