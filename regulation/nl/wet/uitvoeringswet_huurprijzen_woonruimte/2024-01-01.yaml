    text: |-
      1 In geval van een verzoek als bedoeld in [artikel 7:254 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de huurprijsverlaging die staat vermeld in het daaraan ten grondslag liggende
      voorstel. De huurcommissie spreekt uit welke huurprijsverlaging zij redelijk acht, in welk geval zij tevens
      aangeeft tot welke huurprijs die huurprijsverlaging leidt, dan wel dat zij een huurprijsverlaging niet redelijk
      acht.

      2 Indien sprake is van een voorstel tot verlaging van de huurprijs als bedoeld in
      [artikel 7:252b, eerste lid, van het Burgerlijk Wetboek][ref2]:

      a. toetst de huurcommissie, voor zover het huishoudinkomen voorwerp van geschil is tussen partijen, of dat
      huishoudinkomen in het peiljaar:

      1°. gelijk is aan of lager is dan het in [artikel 14, derde lid, van de Wet op de huurtoeslag][ref3] bedoelde
      bedrag, of

      2°. gelijk is aan of lager is dan het op grond van
      [artikel 10, tweede lid, onderdeel a, onder 1° dan wel onder 3°][ref4], voor het huishouden van de huurder
      toepasselijke bedrag,

      b. is de huurprijs na een daling van het huishoudinkomen als bedoeld in
      [artikel 7:252b, eerste lid, van het Burgerlijk Wetboek][ref5] niet hoger dan de huurprijs die zou hebben
      gegolden, indien die over het tijdvak dat loopt van het tijdstip van het doen van het voorstel, bedoeld in de
      aanhef van dat artikellid, tot het tijdstip dat drie jaar daaraan voorafgaat, mede gebaseerd was geweest op het
      lagere huishoudinkomen en het daarmee corresponderende lagere maximale huurverhogingspercentage respectievelijk
      lagere maximale huurverhogingsbedrag, en

      c. is de huurprijs na een daling van het huishoudinkomen als bedoeld in
      [artikel 7:252b, eerste lid, aanhef en onder 1°, van het Burgerlijk Wetboek][ref6] voorts niet hoger dan het
      krachtens [artikel 3, tweede lid][ref7], vastgestelde bedrag.

      3 [Artikel 13, tweede, vierde, vijfde, eerste en tweede volzin, en zesde lid][ref8], is van overeenkomstige
      toepassing.


