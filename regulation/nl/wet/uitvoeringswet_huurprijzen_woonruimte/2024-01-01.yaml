  - number: 10a
    text: |-
      1 In afwijking van [artikel 10, tweede lid][ref1], kan de huurprijs worden verhoogd tot ten hoogste:

      a. het bedrag dat voor dat jaar is voorzien in de bij aanvang van de huur overeengekomen stapsgewijze verhoging van
      de huurprijs, bedoeld in [artikel 7:252c onder a BW][ref2];

      b. het bedrag van de huurprijs direct voorafgaand aan de datum waarop de huurprijs overeenkomstig
      [artikel 7:252c onder b BW][ref3] niet is verhoogd respectievelijk is verlaagd, vermeerderd met de som van ten
      hoogste de krachtens [artikel 10, tweede lid][ref4], toegelaten verhogingen over de jaren sinds die datum.

      De onder b bedoelde verhoging leidt niet tot een hogere huurprijs dan het op de ingangsdatum van de voorgestelde
      huurverhoging in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref5] genoemde bedrag, tenzij
      de huurprijs op de dag voor de datum waarop de huurprijs niet is verhoogd respectievelijk is verlaagd, lager is dan
      wel op de dag na die datum hoger is dan het op die dag in dat artikel genoemde bedrag.

      2 In afwijking van [artikel 10, derde lid][ref6], kan de huurprijs, indien niet eerder dan drie jaar voor
      de ingangsdatum van de huurverhoging de huurprijs op schriftelijk verzoek van de huurder niet is verhoogd
      respectievelijk is verlaagd, worden verhoogd tot ten hoogste het bedrag van de huurprijs direct voorafgaand aan de
      datum waarop de huurprijs niet is verhoogd respectievelijk is verlaagd vermeerderd met de som van ten hoogste de
      krachtens artikel 10, derde lid, toegelaten verhogingen over de jaren sinds die datum. De in de eerste zin bedoelde
      verhoging leidt niet tot een hogere huurprijs dan het op de ingangsdatum van de voorgestelde huurverhoging in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref7] genoemde bedrag, tenzij de huurprijs op
      de dag voor de datum waarop de huurprijs niet is verhoogd respectievelijk is verlaagd, lager is dan wel op de dag
      na die datum hoger is dan het op die dag in dat artikel genoemde bedrag.


