  - number: '7'
    text: |-
      1 Voor het door de huurcommissie doen van een uitspraak als bedoeld in
      [artikel 4, tweede, derde of vijfde lid][ref1], is door de verzoeker een voorschot op de voor hem geldende
      vergoeding aan de Staat, bedoeld in het tweede lid, verschuldigd of door de partij die niet de verzoeker is,
      de voor hem geldende vergoeding, bedoeld in dat lid. Het bedrag van dat voorschot en die vergoeding wordt bij
      algemene maatregel van bestuur vastgesteld, mede aan de hand van het gegeven of de verzoeker of de partij die niet
      de verzoeker is een huurder of een verhuurder is en het aantal malen in drie achtereenvolgende kalenderjaren dat
      de huurcommissie uitspraak heeft gedaan op basis van een verzoek als bedoeld in de [artikelen 7: 249][ref2] en
      [7: 258, derde lid, van het Burgerlijk Wetboek][ref3], en daarbij, gelet op de strekking van het verzoekschrift,
      heeft geoordeeld dat de verhuurder de in het ongelijk gestelde partij is. De huurcommissie kan van de krachtens
      de algemene maatregel van bestuur vastgestelde bedragen, bedoeld in de tweede volzin, afwijken voor zover
      de toepassing gelet op het belang dat die bedragen beogen te beschermen naar haar oordeel zal leiden tot een
      onbillijkheid van overwegende aard.

      2 Bij het doen van een uitspraak geeft de huurcommissie gemotiveerd aan welke partij en tot welk bedrag een
      vergoeding aan de Staat verschuldigd is. Indien de huurcommissie van oordeel is dat de huurder niet ingevolge
      [artikel 7:253, tweede lid, tweede volzin, van het Burgerlijk Wetboek][ref4] gegevens met betrekking tot het
      huishoudinkomen heeft verstrekt, kan zij gemotiveerd uitspreken dat de verhuurder deze vergoeding niet is
      verschuldigd. Deze vergoeding is, in andere gevallen dan dat, bedoeld in de tweede volzin, verschuldigd door de
      partij die naar het oordeel van de huurcommissie geheel of voor het grootste deel, gelet op de strekking van het
      verzoekschrift, de in het ongelijk gestelde partij is. Indien de huurcommissie, in andere gevallen dan dat, bedoeld
      in de tweede volzin, van oordeel is dat beide partijen in ongeveer gelijke mate in het ongelijk worden gesteld, kan
      zij gemotiveerd uitspreken dat elke partij de helft van de voor hem geldende vergoeding aan de Staat verschuldigd
      is. In gevallen waarin de voorzitter bevoegd is tot het doen van een uitspraak, komen de in de eerste tot en met
      vierde volzin bedoelde bevoegdheden toe aan de voorzitter.

      3 Indien naar het oordeel van de huurcommissie, gelet op de strekking van het verzoekschrift, en in andere gevallen
      dan die, bedoeld in het tweede lid, tweede volzin,

      a. de verzoeker de geheel of voor het grootste deel in het gelijk gestelde partij is, wordt:

      1°. de bij wijze van voorschot betaalde voor hem geldende vergoeding terugbetaald, en

      2°. bij de partij die niet de verzoeker is, de voor hem geldende vergoeding ingevorderd, dan wel

      b. beide partijen in ongeveer gelijke mate in het ongelijk worden gesteld, wordt:

      1°. de helft van de bij wijze van voorschot door de verzoeker betaalde voor hem geldende vergoeding terugbetaald,
      en

      2°. bij de partij die niet de verzoeker is, de helft van de voor hem geldende vergoeding ingevorderd.

      4 Het bestuur roept de verzoeker bij schriftelijk bericht op, onder kennisgeving van de ontvangst van het verzoek,
      tot betaling van het in het eerste lid bedoelde voorschot op de vergoeding, voor zover dit op dat tijdstip nog niet
      is voldaan, binnen vier weken na de datum van verzending van dat bericht.

      5 Ingeval de verzoeker het voorschot op de vergoeding niet binnen de in het vierde lid genoemde termijn heeft
      voldaan, wordt het verzoek niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de
      verzoeker in verzuim is geweest.

      6 Het betaalde voorschot op de vergoeding:

      a. wordt aan de verzoeker terugbetaald indien tussen partijen een vaststellingsovereenkomst als bedoeld in
      [artikel 7: 900 van het Burgerlijk Wetboek][ref5] is gesloten;

      b. wordt voor de helft aan de verzoeker terugbetaald, indien de verzoekende partij binnen drie weken na verzending
      van het rapport van het voorbereidend onderzoek, bedoeld in [artikel 28, derde lid][ref6], te kennen geeft het
      geschil niet voort te zetten;

      c. wordt niet aan de verzoeker terugbetaald indien het verzoek na die termijn wordt ingetrokken.

      7 Het bestuur roept de partij die niet de verzoeker is bij schriftelijk bericht op tot betaling van de in het
      derde lid, onderdeel a, onder 2°, of onderdeel b, onder 2°, bedoelde vergoeding binnen vier weken na de datum van
      verzending van dat bericht. Onze Minister kan die vergoeding invorderen bij dwangbevel.

      8 De voorzitter is bevoegd op verzoek van de verzoeker of de partij die niet de verzoeker is vrijstelling te
      verlenen van de aan de Staat verschuldigde vergoeding, bedoeld in het eerste lid en tweede lid. Zolang niet is
      beslist op een aanvraag om vrijstelling, wordt de in het vierde en zevende lid genoemde termijn opgeschort. Bij
      ministeriële regeling wordt bepaald in welke gevallen de voorzitter van de bevoegdheid, bedoeld in de eerste
      volzin, gebruik kan maken. [Artikel 6, tweede lid][ref7], is van overeenkomstige toepassing.

      9 De huurcommissie kan bij gelijkluidende of nagenoeg gelijkluidende verzoeken ten aanzien van de partij die niet
      de verzoeker is en een verhuurder is, indien deze, naar het oordeel van de huurcommissie, gelet op de strekking
      van het verzoekschrift, de geheel of voor het grootste deel in het ongelijk gestelde partij is, dan wel in ongeveer
      gelijke mate als de partij die de verzoeker is in het ongelijk wordt gesteld, afwijken van het eerste lid, eerste
      volzin, voor zover toepassing gelet op het belang dat die volzin beoogt te beschermen naar haar oordeel zal leiden
      tot een onbillijkheid van overwegende aard.

      10 Indien de partij die, gelet op de strekking van het verzoekschrift, in het ongelijk wordt gesteld,
      uitsluitend in het ongelijk wordt gesteld op grond van een eigen oordeel van de huurcommissie ten aanzien
      van de waardering van de energieprestatie van de woonruimte, dat afwijkt van een voor die woonruimte,
      overeenkomstig de op grond van [artikel 4.3, eerste lid, aanhef en onder a][ref8], in samenhang met
      [artikel 4.20, aanhef en onder f, van de Omgevingswet][ref9] gegeven regels omtrent de energieprestatie van
      gebouwen, afgegeven energieprestatiecertificaat, is die partij, in afwijking van het eerste lid, eerste volzin,
      geen vergoeding als bedoeld in dat lid verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
