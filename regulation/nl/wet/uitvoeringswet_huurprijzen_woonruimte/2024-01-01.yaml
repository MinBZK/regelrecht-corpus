  - number: 3h
    text: Onze Minister voorziet in de administratieve ondersteuning van de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel3h
  - number: 3i
    text: |-
      1 Het bestuur houdt een openbaar register aan, waarin met weglating van de
      namen van de betrokken huurders, verhuurders, bewonerscommissies als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op het overleg huurders verhuurder][ref1] en huurdersorganisaties
      als bedoeld in artikel 1, eerste lid, onderdeel f, van die wet de slotwoorden van de uitspraken van de
      huurcommissie en van de voorzittersuitspraken zijn opgenomen.

      2 Bij ministeriële regeling kunnen regels worden gegeven omtrent de inrichting van het register.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel3i
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '1'
  - number: 3j
    text: |-
      1 In afwijking van [artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], strekt de
      bevoegdheid van Onze Minister tot het vernietigen van besluiten zich niet uit tot de uitspraken, de adviezen en de
      verklaringen van de huurcommissie onderscheidenlijk de voorzitter.

      2 Onze Minister treedt bij de uitvoering van de bevoegdheden, toegedeeld bij of krachtens de wet en de in het
      eerste lid genoemde wet niet in de procedurele behandeling van, de inhoudelijke beoordeling van alsmede de
      beslissing in een concrete zaak of in categorieën van zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0014315/2024-01-01#Artikel3j
