  - number: 19b
    text: |-
      1 De verhuurder vraagt en gebruikt de gegevens, die overeenkomstig
      [artikel 7: 252a, vierde tot en met zesde lid, van het Burgerlijk Wetboek][ref1] worden verstrekt, uitsluitend voor
      het doen van een voorstel tot verhoging van de huurprijs als bedoeld in het eerste lid van dat artikel.

      2 De betrokken gegevens, bedoeld in het eerste lid, worden bewaard totdat op het betrokken voorstel, bedoeld
      in [artikel 7:252a, eerste lid, van het Burgerlijk Wetboek][ref2], onherroepelijk is beslist of de voorgestelde
      verhoging van de huurprijs geacht wordt te zijn overeengekomen.

      3 De verhuurder voert ten behoeve van een getrouwe weergave van de uitvoering en een effectief
      uitvoeringsproces een zodanige administratie dat de juiste, volledige en tijdige vastlegging is
      gewaarborgd van de gegevens met betrekking tot het huishoudinkomen die verband houden met de toepassing van
      [artikel 7: 252a, vierde tot en met zesde lid, van het Burgerlijk Wetboek][ref3].

      4 Een ieder die kennis neemt van de gegevens, die overeenkomstig
      [artikel 7: 252a, vierde tot en met zesde lid, van het Burgerlijk Wetboek][ref4] worden verstrekt, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit
      zijn taak de noodzaak tot mededeling voortvloeit.

      5 Indien de verhuurder in strijd handelt met het eerste, tweede, derde of vierde lid kan de inspecteur, bedoeld in
      [artikel 7:252a, tweede lid, onderdeel e, van het Burgerlijk Wetboek][ref5], het afgeven van de huishoudverklaring,
      bedoeld in het tweede lid, onderdeel c, van dat artikel, weigeren.


