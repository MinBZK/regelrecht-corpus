    text: |-
      1 In geval van een verzoek als bedoeld in [artikel 7:261 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van het voorschotbedrag voor de kosten voor nutsvoorzieningen met een individuele
      meter.

      2 De huurcommissie beoordeelt of het voorschotbedrag voor de kosten voor nutsvoorzieningen met een individuele
      meter, indien nodig herleid tot een bedrag per jaar, in aanzienlijke mate afwijkt van hetgeen in redelijke
      verhouding staat tot de in het desbetreffende jaar te verwachten kosten voor nutsvoorzieningen met een individuele
      meter. Indien de huurcommissie van oordeel is dat daarvan sprake is, spreekt zij uit welk voorschotbedrag van de
      kosten voor nutsvoorzieningen met een individuele meter in redelijke verhouding staat tot de te verwachten kosten
      voor nutsvoorzieningen met een individuele meter.

      3 De in het tweede lid bedoelde te verwachten kosten voor nutsvoorzieningen met een individuele meter worden
      gesteld op het bedrag van de kosten voor nutsvoorzieningen met een individuele meter, opgenomen in het laatstelijk
      in de drie voorafgaande kalenderjaren door de verhuurder verstrekte verrekenoverzicht inzake de desbetreffende of
      soortgelijke serviceposten, verhoogd met het percentage waarmee de consumentenprijsindex voor werknemersgezinnen
      sedertdien is verhoogd. Indien geen verrekenoverzicht in de in de eerste volzin bedoelde periode is verstrekt,
      worden bedoelde kosten gesteld op de daarvoor als gebruikelijk aan te merken kosten.

      4 De huurcommissie vermeldt in haar uitspraak dat het door haar uitgesproken voorschotbedrag in de plaats treedt
      van het overeengekomen voorschotbedrag met ingang van de eerste dag van de maand, volgend op die waarin het verzoek
      is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261
