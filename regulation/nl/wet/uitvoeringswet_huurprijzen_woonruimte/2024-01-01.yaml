  - number: '9'
    text: |-
      1 Een verzoek aan de huurcommissie wordt schriftelijk ingediend.

      2 De huurcommissie toetst bij aan haar gedane verzoeken of voldaan is aan de voor die verzoeken bij of krachtens
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref1], bij de [Wet op het overleg huurders verhuurder][ref2] en bij
      of krachtens deze wet gestelde voorschriften.

      3 In geval van een verzoek als bedoeld in [artikel 7:260, eerste lid, van het Burgerlijk Wetboek][ref3] is het
      verzoek niet-ontvankelijk indien het voorwerp van geschil een bedrag van minder dan € 36 beloopt.

      4 In geval van een verzoek als bedoeld in de [artikelen 7: 254][ref4], [7: 255, tweede lid][ref5],
      [7:255a, derde lid][ref6], [7: 257, tweede lid][ref7], [7: 261, derde lid, van het Burgerlijk Wetboek][ref8] is het
      verzoek niet-ontvankelijk indien het voorwerp van geschil een bedrag van minder dan € 3 per maand beloopt.

      5 De bedragen, genoemd in het derde en vierde lid, kunnen bij ministeriële regeling hoger of lager worden gesteld.


