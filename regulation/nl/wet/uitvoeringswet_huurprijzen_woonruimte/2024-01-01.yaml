  - number: 9a
    text: |-
      1 Indien binnen een wooncomplex als bedoeld in [artikel 1 van de Wet op het overleg huurders verhuurder][ref1]
      sprake is van gelijkluidende of nagenoeg gelijkluidende verzoeken kunnen deze door ten minste de helft
      van de partijen die een woonruimte huren binnen dat wooncomplex of deel van dat wooncomplex collectief
      worden ingediend. Die partijen zijn daarbij elk het voorschot op de vergoeding aan de Staat, bedoeld in
      [artikel 7, tweede lid][ref2], verschuldigd.

      2 Indien het verzoek naar het oordeel van de voorzitter niet voldoet aan de in het eerste lid genoemde
      vereisten, wordt het verzoek opgevat als per afzonderlijke woonruimte of groep van woonruimten ingediend.
      [Artikel 6, tweede lid][ref3], is van overeenkomstige toepassing.

      3 De huurcommissie kan ten aanzien van de partijen, bedoeld in het eerste lid, indien die, naar het oordeel van de
      huurcommissie, gelet op de strekking van het verzoekschrift , de geheel of voor het grootste deel in het ongelijk
      gestelde partijen zijn, dan wel in ongeveer gelijke mate als de partij die niet de verzoeker is in het ongelijk
      worden gesteld, afwijken van [artikel 7, eerste lid, eerste volzin][ref4], voor zover toepassing gelet op het
      belang dat die volzin beoogt te beschermen naar haar oordeel zal leiden tot een onbillijkheid van overwegende aard.


