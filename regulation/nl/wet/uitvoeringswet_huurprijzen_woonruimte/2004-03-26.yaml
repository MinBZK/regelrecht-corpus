---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringswet_huurprijzen_woonruimte
regulatory_layer: WET
publication_date: '2025-06-13'
valid_from: '2004-03-26'
bwb_id: BWBR0014315
url: https://wetten.overheid.nl/BWBR0014315/2004-03-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is tegelijk met het voorstel van wet tot herziening van
    Boek 7A van het Burgerlijk Wetboek, waarbij een aantal bepalingen van de Huurprijzenwet woonruimte naar de nieuwe
    titel 7.4 van Boek 7 van dat wetboek wordt overgeheveld, de overige bepalingen van de Huurprijzenwet woonruimte
    en die van de Wet op de huurcommissies te integreren in een nieuw wetsvoorstel en deze bepalingen waar mogelijk te
    vereenvoudigen, alsmede op een aantal plaatsen inhoudelijke wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel1
  - number: 1.1.a
    text: |-
      huurcommissie: huurcommissie als bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel21
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '21'
        hoofdstuk: V
        paragraaf: '1'
  - number: 1.1.b
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel1
  - number: 1.1.c
    text: |-
      gebrek: gebrek als bedoeld in [artikel 7:241 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel241
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '241'
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder woonruimte, zelfstandige woning,
      woonwagen, standplaats, prijs, huurprijs en servicekosten verstaan hetgeen daaronder wordt verstaan in
      [afdeling 5 van titel 7.4 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '5'
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op overeenkomsten van huur en verhuur van woonruimte die een gebruik betreffen, dat
      naar zijn aard slechts van korte duur is.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel2
  - number: '3.1'
    text: |-
      Op huurovereenkomsten waarop ingevolge
      __REF000___________________________________________________________________________________________________________
      ________________ ten dele van toepassing is, is deze wet slechts van toepassing voorzover dat uit die onderafdeling
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur wordt het in [artikel 7:247 van het Burgerlijk Wetboek][ref1] bedoelde bedrag
      van de huurprijs bij aanvang van de bewoning vastgesteld, waarboven ingevolge dat artikel voornoemde onderafdeling
      ten dele van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '247'
  - number: '4.1'
    text: |-
      De huurcommissie heeft de in het tweede tot en met vierde lid en in [artikel 5][ref1] aangegeven taken.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.2'
    text: 'De huurcommissie doet uitspraak:'
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
  - number: 4.2.a
    text: |-
      ingevolge [artikel 7:249 van het Burgerlijk Wetboek][ref1] over de redelijkheid van de overeengekomen
      aanvangshuurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
  - number: 4.2.b
    text: |-
      ingevolge [artikel 7:253 van het Burgerlijk Wetboek][ref1] over de redelijkheid van het voorstel tot verhoging van
      de huurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: 4.2.c
    text: |-
      ingevolge [artikel 7:254 van het Burgerlijk Wetboek][ref1] over de redelijkheid van het voorstel tot verlaging van
      de huurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel254
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '254'
  - number: 4.2.d
    text: |-
      ingevolge [artikel 7:255 van het Burgerlijk Wetboek][ref1] over het bedrag van de verhoging van de huurprijs na de
      totstandkoming van voorzieningen, veranderingen of toevoegingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
  - number: 4.2.e
    text: |-
      ingevolge [artikel 7:257 van het Burgerlijk Wetboek][ref1] over de in rekening te brengen huurprijs bij
      vermindering van het woongenot als gevolg van een gebrek;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: 4.2.f
    text: |-
      ingevolge [artikel 7:258 van het Burgerlijk Wetboek][ref1] over de huurprijs en het voorschotbedrag aan
      servicekosten indien tussen partijen slechts een prijs en niet een huurprijs is overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel258
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '258'
  - number: 4.2.g
    text: |-
      ingevolge [artikel 7:260 van het Burgerlijk Wetboek][ref1] over de betalingsverplichting met betrekking tot de
      servicekosten;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: 4.2.h
    text: |-
      ingevolge [artikel 7:261 van het Burgerlijk Wetboek][ref1] over het voorschotbedrag van de servicekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '261'
  - number: '4.3'
    text: |-
      De huurcommissie doet uitspraak in gevallen waarin als gevolg van een uitspraak als bedoeld in de
      [artikelen 7:249][ref1] en [7:257 van het Burgerlijk Wetboek][ref2] de in rekening te brengen huurprijs in verband
      met gebreken is verlaagd, omtrent het verholpen zijn van die gebreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '257'
  - number: '4.4'
    text: |-
      De huurcommissie doet uitspraak indien ingevolge [artikel 20, zesde lid][ref1], verzet is gedaan tegen een
      uitspraak van de voorzitter van de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel20
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '20'
        hoofdstuk: IV
  - number: '5.1'
    text: |-
      De huurcommissie doet desverzocht uitspraak over de redelijkheid van een gebruiksvergoeding of een aanvullende
      vergoeding, als bedoeld in [artikel 51, eerste, onderscheidenlijk derde lid, van de Huisvestingswet][ref1] en over
      de wijziging daarvan, bedoeld in [artikel 52, eerste lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel52
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '52'
  - number: '5.2'
    text: |-
      De huurcommissie verstrekt desverzocht aan de rechter nadere inlichtingen over een door haar gedane uitspraak,
      alsmede, ingeval zij geen uitspraak heeft gedaan, indien de rechter geacht kan worden daarbij belang te hebben,
      over de aan een woonruimte toe te kennen kwaliteit en een voor die woonruimte redelijk te achten huurprijs.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel5
  - number: '5.3'
    text: |-
      De huurcommissie verstrekt desverzocht verklaringen aan Onze Minister en aan publiekrechtelijke lichamen die
      geacht kunnen worden daarbij belang te hebben, over de aan een woonruimte toe te kennen kwaliteit, de gebreken
      ten aanzien van die woonruimte en een voor die woonruimte redelijk te achten huurprijs. De hierbedoelde verklaring
      wordt niet gegeven, indien het belang van de verklaring is gelegen in de beoordeling door de verzoeker van een
      huurovereenkomst als bedoeld in [artikel 3][ref1], tenzij het belang daarvan gelegen is in de toepassing van
      [artikel 1, vierde lid, van de Huisvestingswet][ref2]. Onze Minister kan voor de uitvoering van de in de eerste
      volzin bedoelde taak nadere regels geven.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel1
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '1'
  - number: '5.4'
    text: |-
      De huurcommissie verstrekt desverzocht aan Onze Minister de gegevens die nodig zijn in het kader van het te voeren
      volkshuisvestingsbeleid.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel5
  - number: '5.5'
    text: |-
      De huurcommissie geeft ten aanzien van een huurovereenkomst als bedoeld in [artikel 3][ref1] desverzocht advies
      over aangelegenheden waaromtrent de huurcommissie bevoegd zou zijn uitspraak te doen indien [artikel 3][ref2]
      daaraan niet in de weg zou staan. De huurcommissie geeft een dergelijk advies slechts voorzover in de
      huurovereenkomst of anderszins tussen partijen is afgesproken dat de desbetreffende aangelegenheden bij geschil aan
      de huurcommissie worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel3
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: '6'
    text: 'De voorzitter van de huurcommissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel6
  - number: 6.a
    text: |-
      in afwijking van [artikel 4, eerste lid][ref1], in de in het tweede en derde lid van dat artikel aangegeven
      gevallen uitspraak te doen indien ten aanzien van een aan de huurcommissie gedaan verzoek een van de in
      [artikel 20, eerste lid][ref2], bedoelde gevallen zich voordoet;


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel20
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '20'
        hoofdstuk: IV
  - number: 6.b
    text: |-
      in de gevallen die bij algemene maatregel van bestuur krachtens
      [artikel 5, tweede lid, van de Huursubsidiewet][ref1] zijn aangewezen op verzoek van Onze Minister binnen zes
      weken een verklaring te verstrekken omtrent de redelijkheid van de huurprijs en de juistheid van andere gegevens
      betreffende de woonruimte waarvoor een aanvraag om huursubsidie is ingediend, een en ander voorzover van belang
      voor de toepassing van genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '5'
  - number: '7.1'
    text: |-
      Voor het door de huurcommissie doen van een uitspraak, met uitzondering van een uitspraak als bedoeld in
      [artikel 4, vierde lid][ref1], en [5, eerste lid][ref2], is door partijen een voorschot op de vergoeding aan de
      Staat, als bedoeld in het tweede lid, verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Bij het doen van de uitspraak geeft de huurcommissie gemotiveerd aan welke van beide partijen een vergoeding aan
      de Staat verschuldigd is. Deze vergoeding is verschuldigd door de partij die naar het oordeel van de huurcommissie
      geheel of voor het grootste deel, gelet op de strekking van het verzoekschrift, de in het ongelijk gestelde partij
      is. Indien de huurcommissie van oordeel is dat beide partijen in ongeveer gelijke mate in het ongelijk worden
      gesteld, kan zij gemotiveerd uitspreken dat beide partijen de helft van de vergoeding aan de Staat verschuldigd
      zijn. In gevallen waarin de voorzitter van de huurcommissie bevoegd is tot het doen van een uitspraak, komen de in
      de eerste tot en met derde volzin bedoelde bevoegdheden toe aan de voorzitter.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: '7.3'
    text: |-
      Het bedrag en de wijze van betaling van het in het eerste lid bedoelde voorschot en de in het tweede lid bedoelde
      vergoeding worden bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: '7.4'
    text: |-
      Na het doen van een uitspraak wordt de bij wijze van voorschot betaalde vergoeding terugbetaald, voorzover geen
      vergoeding verschuldigd is als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: '7.5'
    text: |-
      De huurcommissie roept partijen bij schriftelijk bericht op, onder kennisgeving van de ontvangst van het verzoek,
      alsmede onder kennisgeving van de inhoud van het verzoek aan de partij die niet de verzoeker is, tot betaling van
      de in het eerste lid bedoelde vergoeding, voorzover deze op dat tijdstip nog niet is voldaan, binnen vier weken na
      de datum van verzending van dat bericht.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: '7.6'
    text: |-
      Ingeval geen van beide partijen binnen de in het vijfde lid genoemde termijn de vergoeding heeft voldaan, wordt
      het verzoek niet-ontvankelijk verklaard. Ingeval alleen de niet-verzoekende partij binnen die termijn de vergoeding
      heeft voldaan, wordt het verzoek niet-ontvankelijk verklaard en wordt de bij wijze van voorschot door de niet-
      verzoekende partij betaalde vergoeding terugbetaald. Ingeval alleen de verzoekende partij binnen die termijn de
      vergoeding heeft voldaan, luidt de uitspraak zo veel mogelijk in overeenstemming met de strekking van het verzoek,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: 7.6.a
    text: het verzoek kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: 7.6.b
    text: het voorstel dat ten grondslag ligt aan het verzoek, kennelijk niet redelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: 7.6.c
    text: de aan het verzoek ten grondslag liggende bezwaren kennelijk ongegrond zijn, of
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: 7.6.d
    text: het verzoek kennelijk niet redelijk is.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: '7.7'
    text: |-
      Indien het verzoek voor de uitspraak wordt ingetrokken, ontvangt de partij die niet de verzoeker was, het betaalde
      voorschot op de vergoeding terug.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: '7.8'
    text: |-
      De voorzitter van de huurcommissie is bevoegd op verzoek vrijstelling te verlenen van de aan de Staat verschuldigde
      vergoeding, bedoeld in het eerste en tweede lid. Zolang niet is beslist op een aanvraag om vrijstelling van de in
      het eerste lid bedoelde vergoeding, wordt de in het vijfde lid genoemde termijn opgeschort.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel7
  - number: '8'
    text: |-
      Voor het door de huurcommissie uitbrengen van een advies als bedoeld in [artikel 5, vijfde lid][ref1], is door
      de verzoeker een vergoeding aan de Staat verschuldigd, waarvan het bedrag en de wijze van betaling bij algemene
      maatregel van bestuur worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.1'
    text: |-
      De huurcommissie toetst bij aan haar gedane verzoeken of voldaan is aan de voor die verzoeken bij of krachtens
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref1] en bij of krachtens deze wet gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '9.2'
    text: |-
      Een verzoek aan de huurcommissie dient schriftelijk te worden ingediend bij de huurcommissie in het ressort waarin
      de woonruimte is gelegen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel9
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de waardering van de kwaliteit van een
      woonruimte, van de redelijkheid van de huurprijs en van wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel10
  - number: '10.2'
    text: Bij regeling van Onze Minister wordt het maximale huurverhogingspercentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel10
  - number: '11.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:249 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de overeengekomen huurprijs. Als een dergelijk verzoek wordt mede aangemerkt
      een verzoek ingevolge [artikel 6, aanhef en onderdeel b][ref2], indien een aanvraag om huursubsidie voor de
      desbetreffende woonruimte is ingediend binnen de in [artikel 7: 249 van het Burgerlijk Wetboek][ref3] bedoelde
      termijn en indien en zodra de voorzitter van de huurcommissie op dat verzoek een verklaring heeft afgegeven
      waaruit blijkt dat de overeengekomen huurprijs hoger is dan de bij de desbetreffende woonruimte behorende maximale
      huurprijsgrens.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel249
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '249'
  - number: '11.2'
    text: |-
      De huurcommissie toetst in dat geval de redelijkheid van de overeengekomen huurprijs aan de krachtens
      [artikel 10, eerste lid][ref1], gegeven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Indien de huurcommissie de overeengekomen huurprijs niet redelijk acht, vermeldt zij in haar uitspraak de huurprijs
      die zij redelijk acht.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel11
  - number: '11.4'
    text: |-
      In geval sprake is van een huurovereenkomst als bedoeld in [artikel 3][ref1] spreekt de huurcommissie,
      indien de beoordeling, bedoeld in het tweede lid, zou leiden tot een huurprijs boven de in
      [artikel 7:247 van het Burgerlijk Wetboek][ref2] genoemde grens, uit dat de door partijen overeengekomen
      huurprijs redelijk is. Indien de huurprijs na de uitspraak van de huurcommissie en in voorkomend geval na de
      vaststelling ervan door de kantonrechter onherroepelijk is komen vast te staan en niet boven die grens uitkomt, is
      [artikel 7:247][ref3] op die huurovereenkomst niet langer van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel247
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '247'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '247'
  - number: '11.5'
    text: |-
      De huurcommissie beoordeelt de kwaliteit van de woonruimte en de redelijkheid van de huurprijs naar de toestand op
      de datum van ingang van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel11
  - number: '12.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:249 van het Burgerlijk Wetboek][ref1] spreekt de huurcommissie
      tevens uit of zij van oordeel is dat de overeengekomen huurprijs of de op grond van [artikel 11, derde lid][ref2],
      redelijk geachte huurprijs, gelet op de gebreken ten aanzien van de woonruimte, in rekening dient te worden
      gebracht. Indien de huurcommissie van oordeel is dat die huurprijs, gelet op de gebreken, niet in rekening dient
      te worden gebracht, geeft zij deze gebreken in de uitspraak aan en vermeldt zij een in verhouding tot die gebreken
      lagere huurprijs als de in rekening te brengen huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel11
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven die de huurcommissie bij de beoordeling van
      de redelijkheid van de in rekening te brengen huurprijs in acht neemt.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel12
  - number: '12.3'
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de in rekening te brengen lagere huurprijs,
      zijnde de ingangsdatum van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel12
  - number: '12.4'
    text: |-
      De huurcommissie bepaalt in de uitspraak dat, nadat de in die uitspraak genoemde gebreken zijn verholpen, de in
      rekening te brengen lagere huurprijs niet meer van toepassing is met ingang van de eerste dag van de maand, volgend
      op die waarin de opheffing van die gebreken heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel12
  - number: '12.5'
    text: |-
      Indien tussen huurder en verhuurder geen overeenstemming bestaat over het al dan niet verholpen zijn van de
      gebreken, doet de huurcommissie daarover op verzoek van de verhuurder uitspraak. In voorkomend geval geeft zij
      daarbij aan in welke maand de opheffing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel12
  - number: '13.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:253 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de huurprijsverhoging die staat vermeld in het daaraan ten grondslag liggende
      voorstel. De huurcommissie spreekt uit welke huurprijsverhoging zij redelijk acht, in welk geval zij tevens
      aangeeft tot welke huurprijs die huurprijsverhoging leidt, dan wel dat zij een huurprijsverhoging niet redelijk
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: '13.2'
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de huurprijsverhoging, zijnde de in het in het
      eerste lid bedoelde voorstel vermelde datum van ingang, dan wel een latere datum indien de wet zulks voorschrijft.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel13
  - number: '13.3'
    text: |-
      De huurcommissie toetst het voorstel tot huurprijsverhoging aan het krachtens [artikel 10, tweede lid][ref1],
      geldende maximale huurverhogingspercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.4'
    text: |-
      Bij de beoordeling van de kwaliteit van de woonruimte worden voorzieningen die de huurder onverplicht voor eigen
      rekening heeft aangebracht en waardoor het woongerief geacht kan worden te zijn gestegen, buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel13
  - number: '13.5'
    text: |-
      De huurcommissie toetst het voorstel tot huurprijsverhoging, indien de huurder bezwaar heeft gemaakt tegen de
      woningwaardering in het voorstel, dan wel indien de huurprijs, vermeerderd met de voorgestelde huurprijsverhoging,
      de maximale huurprijsgrens zou kunnen overschrijden, tevens aan de krachtens [artikel 10, eerste lid][ref1],
      gegeven regels met betrekking tot de waardering van de kwaliteit van een woonruimte. Daarbij vormt de huurcommissie
      slechts een eigen oordeel over de kwaliteit van de woonruimte, voorzover die kwaliteit al dan niet op onderdelen
      voorwerp van geschil is tussen partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.6'
    text: |-
      De huurcommissie beoordeelt de kwaliteit van de woonruimte en de redelijkheid van de wijziging van de huurprijs
      naar de toestand op het tijdstip van de in het voorstel tot verhoging van de huurprijs genoemde ingangsdatum.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel13
  - number: '13.7'
    text: |-
      Indien de huurcommissie op grond van het eerste lid van oordeel is dat een voorstel tot verhoging van de huurprijs
      als bedoeld in [artikel 7:252, tweede lid, aanhef en onderdeel f, van het Burgerlijk Wetboek][ref1], redelijk is
      en voorts constateert dat het formulier, bedoeld in het vierde lid van dat artikel, niet volledig is ingevuld,
      brengt de huurcommissie het voorgestelde percentage van de verhoging van de huurprijs terug tot het in genoemd
      artikelonderdeel bedoelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
  - number: '14.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:254 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van de huurprijsverlaging die staat vermeld in het daaraan ten grondslag liggende
      voorstel. De huurcommissie spreekt uit welke huurprijsverlaging zij redelijk acht, in welk geval zij tevens
      aangeeft tot welke huurprijs die huurprijsverlaging leidt, dan wel dat zij een huurprijsverlaging niet redelijk
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel254
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '254'
  - number: '14.2'
    text: |-
      [Artikel 13, tweede en vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel13
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:255 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de huurprijswijziging die zij redelijk acht. De huurcommissie vermeldt in de uitspraak dat de
      overeengekomen huurprijs redelijk is dan wel welke de huurprijs is die zij redelijk acht, alsmede de datum van
      ingang van de huurprijswijziging, zijnde de eerste dag van de maand, volgend op die waarin de voorzieningen,
      veranderingen of verbeteringen zijn gereedgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
  - number: '15.2'
    text: |-
      De huurcommissie toetst of het bedrag van de verhoging van de huurprijs in redelijke verhouding staat tot
      de door de verhuurder gemaakte kosten met betrekking tot de voorzieningen, veranderingen of toevoegingen. De
      [artikelen 10, eerste lid][ref1], en [13, vierde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel13
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '16.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:257, tweede lid, van het Burgerlijk Wetboek][ref1] doet de
      huurcommissie uitspraak of zij van oordeel is dat de overeengekomen huurprijs, in verband met de gebreken ten
      aanzien van de woonruimte, in rekening dient te worden gebracht. Indien de commissie van oordeel is dat die
      huurprijs, in verband met de gebreken, niet in rekening dient te worden gebracht, geeft zij deze gebreken in de
      uitspraak aan en vermeldt zij een in verhouding tot die gebreken lagere huurprijs als de in rekening te brengen
      huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: '16.2'
    text: |-
      De huurcommissie neemt bij haar oordeel de krachtens [artikel 12, tweede lid][ref1], vastgestelde regels in acht,
      met dien verstande dat de huurcommissie zich slechts een eigen oordeel over de gebreken vormt, voorzover deze aan
      de verhuurder door middel van de in [artikel 7:207 van het Burgerlijk Wetboek][ref2] bedoelde kennisgeving door de
      huurder zijn gemeld, alsmede over de gebreken die van zodanige aard of samenhang zijn dat ze ook zonder aanzegging
      aan de verhuurder bekend moesten zijn, zulks naar de toestand op het tijdstip waarop de bedoelde kennisgeving door
      de huurder is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel207
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '207'
  - number: '16.3'
    text: |-
      De huurcommissie vermeldt in de uitspraak de datum van ingang van de in rekening te brengen lagere huurprijs,
      zijnde de eerste dag van de maand, volgend op die waarin de in het tweede lid bedoelde aanzegging door de huurder
      aan de verhuurder is verzonden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel16
  - number: '16.4'
    text: |-
      Indien ondanks door de huurcommissie geconstateerde gebreken ten aanzien van de woonruimte de huurprijs door
      de huurcommissie redelijk wordt geacht, omdat de overeengekomen huurprijs gelijk is aan of lager is dan de in
      verhouding tot die gebreken ingevolge dit artikel ten laagste in een uitspraak te vermelden in rekening te brengen
      huurprijs, geeft de huurcommissie die gebreken in haar uitspraak aan, vermeldt de geldende huurprijs als de in
      rekening te brengen huurprijs en behandelt het verzoek voor het overige met overeenkomstige toepassing van het
      eerste lid, tweede volzin, en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel16
  - number: '16.5'
    text: |-
      [Artikel 12, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:258 van het Burgerlijk Wetboek][ref1] doet de
      huurcommissie uitspraak omtrent de vraag of partijen al dan niet een huurprijs zijn overeengekomen. Indien
      de huurcommissie van oordeel is dat partijen slechts de hoogte van de prijs en niet die van de huurprijs
      zijn overeengekomen, spreekt zij als huurprijs uit 55% van de geldende maximale huurprijsgrens, behorende bij
      de kwaliteit van de woonruimte, en spreekt zij, voorzover nodig, als voorschotbedrag voor de servicekosten
      uit een bedrag van 25% van die huurprijs. Indien het betreft een verzoek van de verhuurder, als bedoeld in
      [artikel 7:258, tweede volzin, van het Burgerlijk Wetboek][ref2], spreekt de huurcommissie, in afwijking van de
      tweede volzin, als huurprijs en voorzover nodig als voorschotbedrag voor de servicekosten uit een bedrag van 80%,
      onderscheidenlijk 20%, van de overeengekomen prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel258
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '258'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '258'
  - number: '17.2'
    text: |-
      De [artikelen 11, tweede lid][ref1], en [13, vierde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel13
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.3'
    text: |-
      Indien de huurcommissie van oordeel is dat niet een huurprijs is overeengekomen, vermeldt zij in haar uitspraak
      dat de door haar uitgesproken huurprijs en het voorschotbedrag voor de servicekosten in de plaats treden van de
      overeengekomen prijs met ingang van de eerste dag van de maand, volgend op die waarin het verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel17
  - number: '18.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:260 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de betalingsverplichting van de huurder met betrekking tot de servicekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel260
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '260'
  - number: '18.2'
    text: |-
      De huurcommissie toetst de servicekosten aan de voor de berekening daarvan geldende wettelijke voorschriften en aan
      de redelijkheid.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel18
  - number: '19.1'
    text: |-
      In geval van een verzoek als bedoeld in [artikel 7:261 van het Burgerlijk Wetboek][ref1] doet de huurcommissie
      uitspraak omtrent de redelijkheid van het voorschotbedrag voor de servicekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '261'
  - number: '19.2'
    text: |-
      De huurcommissie beoordeelt of het voorschotbedrag voor de servicekosten, indien nodig herleid tot een bedrag per
      jaar, in aanzienlijke mate afwijkt van hetgeen in redelijke verhouding staat tot de in het desbetreffende jaar
      te verwachten servicekosten. Indien de huurcommissie van oordeel is dat daarvan sprake is, spreekt zij uit welk
      voorschotbedrag van de servicekosten in redelijke verhouding staat tot de te verwachten servicekosten.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel19
  - number: '19.3'
    text: |-
      De in het tweede lid bedoelde te verwachten servicekosten worden gesteld op het bedrag van de servicekosten,
      opgenomen in het laatstelijk in de drie voorafgaande kalenderjaren door de verhuurder verstrekte verrekenoverzicht
      inzake de desbetreffende of soortgelijke serviceposten, verhoogd met het percentage waarmee het prijsindexcijfer
      voor de gezinsconsumptie voor werknemersgezinnen sedertdien is verhoogd. Indien geen verrekenoverzicht in de in de
      eerste volzin bedoelde periode is verstrekt, worden bedoelde kosten gesteld op de daarvoor als gebruikelijk aan te
      merken kosten.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel19
  - number: '19.4'
    text: |-
      De huurcommissie vermeldt in haar uitspraak dat het door haar uitgesproken voorschotbedrag in de plaats treedt van
      het overeengekomen voorschotbedrag met ingang van de eerste dag van de maand, volgend op die waarin het verzoek
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel19
  - number: '20.1'
    text: |-
      De voorzitter van de huurcommissie doet onverwijld, in ieder geval binnen vier weken na het verstrijken van de
      in [artikel 7, vijfde lid][ref1], genoemde termijn, dan wel, indien de in dat artikellid bedoelde oproep niet
      behoeft te worden gedaan, na het tijdstip waarop de aldaar bedoelde vergoeding van beide partijen is ontvangen,
      schriftelijk en met redenen omkleed uitspraak, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: 20.1.a
    text: het verzoek kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: 20.1.b
    text: het verzoek kennelijk redelijk of niet redelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: 20.1.c
    text: het voorstel dat ten grondslag ligt aan het verzoek, kennelijk redelijk of niet redelijk is,
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: 20.1.d
    text: de aan het verzoek ten grondslag liggende bezwaren kennelijk gegrond of ongegrond zijn of
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: 20.1.e
    text: de bezwaren tegen het aan het verzoek ten grondslag liggende voorstel kennelijk ongegrond zijn.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: '20.2'
    text: |-
      Van een kennelijk redelijk verzoek is in ieder geval sprake in het geval, bedoeld in
      [artikel 7:253, tweede en derde lid, van het Burgerlijk Wetboek][ref1], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: 20.2.a
    text: |-
      de huurcommissie in een eerdere uitspraak heeft uitgesproken dat op grond van
      [artikel 7:257 van het Burgerlijk Wetboek][ref1] een lagere huurprijs redelijk is en de in die uitspraak genoemde
      gebreken nog niet zijn verholpen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: 20.2.b
    text: |-
      het percentage van de in het voorstel opgenomen huurverhoging het in [artikel 10, tweede lid][ref1], bedoelde
      maximale huurverhogingspercentage te boven gaat, in welk geval het verzoek slechts kennelijk redelijk is, voorzover
      het dat percentage niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20.3'
    text: |-
      De voorzitter vermeldt in voorkomende gevallen in de uitspraak tot welke huurprijs de uitspraak van de voorzitter
      leidt, alsmede de datum van ingang.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: '20.4'
    text: |-
      [Artikel 7][ref1] is van overeenkomstige toepassing, met dien verstande dat voor het door de huurcommissie doen
      van een uitspraak op het verzet, bedoeld in het zesde en zevende lid, niet opnieuw de in [artikel 7][ref2] bedoelde
      vergoeding aan de Staat verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: '20.5'
    text: |-
      De secretaris zendt onverwijld bij aangetekende brief of bij brief met ontvangstbevestiging een afschrift van de
      uitspraak van de voorzitter van de huurcommissie aan partijen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: '20.6'
    text: |-
      Tegen de uitspraak van de voorzitter van de huurcommissie, bedoeld in het eerste lid, kan de huurder of de
      verhuurder binnen drie weken na verzending van het afschrift van die uitspraak schriftelijk en gemotiveerd in
      verzet gaan bij de huurcommissie. De voorzitter van de huurcommissie wijst in zijn uitspraak partijen op deze
      mogelijkheid, alsook op de vorm en de termijn die daarbij in acht genomen moeten worden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
  - number: '20.7'
    text: |-
      Is de huurcommissie van oordeel dat het verzet, bedoeld in het zesde lid, gegrond is, dan vervalt de uitspraak
      van de voorzitter van de huurcommissie, bedoeld in het eerste lid, en wordt het aan de in het eerste lid bedoelde
      uitspraak ten grondslag liggende verzoek overeenkomstig [hoofdstuk III][ref1] door de huurcommissie in behandeling
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014315
        hoofdstuk: III
  - number: '20.8'
    text: |-
      Indien noch de huurder noch de verhuurder binnen de in het zesde lid genoemde termijn in verzet is gegaan, is
      hetgeen in [artikel 7:262 van het Burgerlijk Wetboek][ref1] is bepaald met betrekking tot een uitspraak van de
      huurcommissie, van overeenkomstige toepassing op de uitspraak van de voorzitter van de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel262
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '262'
  - number: '21.1'
    text: |-
      In het rechtsgebied van ieder arrondissement zijn een of meer huurcommissies. Bij algemene maatregel van bestuur
      worden de ressorten van deze huurcommissies bepaald door vermelding van de gemeenten waarover deze ressorten zich
      uitstrekken.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel21
  - number: '21.2'
    text: |-
      De huurcommissies zijn gevestigd in de gemeenten, waarvan de naam in de in het eerste lid bedoelde algemene
      maatregel van bestuur als aanduiding van het ressort van die commissie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel21
  - number: '22.1'
    text: Een huurcommissie heeft een voorzitter en een door Onze Minister te bepalen aantal leden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister kan bepalen dat een huurcommissie tevens een plaatsvervangend voorzitter en plaatsvervangende leden
      heeft.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel22
  - number: '22.3'
    text: |-
      Bij afwezigheid of ontstentenis van de voorzitter treedt op verzoek van de huurcommissie een voorzitter van een
      huurcommissie in een van de aangrenzende ressorten, als waarnemend voorzitter op. Bij verhindering van ieder der
      voorzitters van een huurcommissie in een aangrenzend ressort treedt op verzoek van de huurcommissie de voorzitter
      van een huurcommissie in een van de niet-aangrenzende ressorten als waarnemend voorzitter op. Is op deze wijze niet
      in de waarneming te voorzien, dan wijst de huurcommissie uit haar midden een waarnemend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel22
  - number: '22.4'
    text: |-
      Bij afwezigheid of ontstentenis van een van de leden treedt een daartoe door de voorzitter aangewezen lid of
      plaatsvervangend lid als vervanger op.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel22
  - number: '23.1'
    text: |-
      De voorzitter en de plaatsvervangend voorzitter van een huurcommissie worden op voordracht van Onze Minister
      bij koninklijk besluit benoemd, geschorst en ontslagen. Zij worden benoemd voor een tijdvak van zes jaar en zijn
      voor een aansluitend tijdvak als voorzitter, onderscheidenlijk plaatsvervangend voorzitter, van die huurcommissie
      eenmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel23
  - number: '23.2'
    text: |-
      De voorzitter moet aan een universiteit dan wel de Open Universiteit waarop de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek betrekking heeft, het recht om de titel meester te voeren hebben verkregen of blijk
      hebben gegeven op andere wijze de voor de betrekking van voorzitter benodigde kennis te hebben verworven.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel23
  - number: '23.3'
    text: |-
      De voorzitter mag niet metterdaad betrokken zijn bij de uitoefening van een bedrijf dat werkzaam is of mede
      werkzaam is op het gebied van woonruimte, noch is het hem toegestaan beroepsmatig betrokken te zijn bij het beheer
      van en de beschikking over woonruimte dan wel deel uit te maken van het bestuur van een vereniging, vennootschap of
      stichting, die daarbij is betrokken.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel23
  - number: '24.1'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de leden en de plaatsvervangende leden van een huurcommissie. Zij worden
      benoemd voor een tijdvak van vier jaar en zijn als lid van die huurcommissie, onderscheidenlijk plaatsvervangend
      lid, voor een aansluitend tijdvak eenmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel24
  - number: '24.2'
    text: |-
      Tot lid of plaatsvervangend lid worden slechts benoemd personen die over voldoende deskundigheid beschikken om bij
      te dragen aan een behoorlijke vervulling van de ingevolge de wet aan de huurcommissie opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel24
  - number: '24.3'
    text: |-
      De benoeming van de leden en de plaatsvervangende leden geschiedt zodanig dat in de huurcommissie leden en
      plaatsvervangende leden uit de kring van huurders, onderscheidenlijk uit de kring van verhuurders, gelijkelijk
      zijn vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel24
  - number: '24.4'
    text: |-
      Onze Minister stelt met inachtneming van het derde lid bij iedere benoeming de door hem daartoe aangewezen
      organisaties, die geacht kunnen worden de belangen van de huurders, onderscheidenlijk de belangen van de
      verhuurders, te behartigen, gedurende negen weken in de gelegenheid een aanbeveling te doen. Indien meer dan één
      organisatie is aangewezen om een aanbeveling te doen, stelt Onze Minister de betrokken organisaties slechts in
      de gelegenheid tezamen een aanbeveling te doen. Bij het doen van een aanbeveling wordt rekening gehouden met het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel24
  - number: '24.5'
    text: |-
      Onze Minister neemt binnen zes weken na het verstrijken van de in het vierde lid bedoelde termijn over de benoeming
      een beslissing.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel24
  - number: '25'
    text: |-
      De voorzitter, de leden en de plaatsvervangende leden worden op eigen aanvraag ontslagen. Zij kunnen voorts worden
      geschorst of ontslagen wegens ongeschiktheid, onbekwaamheid of andere zwaarwegende gronden. De voorzitter wordt ook
      ontslagen indien hij de voor hem geldende pensioengerechtigde leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel25
  - number: '26.1'
    text: Een huurcommissie heeft een secretariaat.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel26
  - number: '26.2'
    text: Onze Minister draagt zorg voor de instandhouding en inrichting van het secretariaat.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel26
  - number: '26.3'
    text: Het secretariaat bestaat uit een secretaris, alsmede uit medewerkers, die onder leiding staan van de secretaris.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel26
  - number: '26.4'
    text: |-
      De secretaris en de medewerkers van het secretariaat zijn voor hun werkzaamheden voor de huurcommissie uitsluitend
      verantwoording verschuldigd aan de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel26
  - number: '26.5'
    text: |-
      Onze Minister benoemt, bevordert, schorst en ontslaat de secretaris en de medewerkers van het secretariaat.
      De secretaris wordt slechts benoemd, bevorderd, geschorst of ontslagen na overleg met de voorzitter van de
      huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel26
  - number: '26.6'
    text: |-
      Onze Minister kan een of meer medewerkers van het secretariaat aanwijzen als plaatsvervangend secretaris van de
      huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel26
  - number: '27.1'
    text: |-
      De voorzitter geniet een bezoldiging welke bij algemene maatregel van bestuur wordt vastgesteld. Hij geniet voorts
      vergoeding voor reis- en verblijfkosten volgens bij algemene maatregel van bestuur te geven regels.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel27
  - number: '27.2'
    text: |-
      De leden en de plaatsvervangende leden genieten een vergoeding voor reis- en verblijfkosten en verdere vergoedingen
      volgens bij regeling van Onze Minister te geven regels.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel27
  - number: '28.1'
    text: |-
      Alvorens een uitspraak te doen als bedoeld in [artikel 4, tweede of derde lid][ref1], of
      [artikel 5, eerste lid][ref2], wordt een voorbereidend onderzoek ingesteld. Een zodanig onderzoek blijft
      achterwege indien de beschikbare stukken naar het oordeel van de voorzitter voldoende zijn ter voorbereiding van
      de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '28.2'
    text: |-
      Het voorbereidend onderzoek wordt ingesteld door de secretaris of door een door hem daartoe aangewezen ambtenaar
      van het secretariaat. In bijzondere gevallen kunnen de voorzitter of een of meer leden van de huurcommissie het
      onderzoek ook zelf instellen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel28
  - number: '28.3'
    text: Onze Minister kan nadere regels geven ten aanzien van de bij het voorbereidend onderzoek te volgen werkwijze.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel28
  - number: '28.4'
    text: |-
      Van het ingestelde voorbereidend onderzoek wordt door de secretaris, onderscheidenlijk de voorzitter of de met het
      onderzoek belaste leden van de huurcommissie, een schriftelijk rapport opgemaakt.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel28
  - number: '28.5'
    text: |-
      In de gevallen waarin de voorzitter geen uitspraak doet, bepaalt de voorzitter de dag en het uur, waarop het
      verzoek ter zitting van de huurcommissie zal worden behandeld, zodra het voorbereidend onderzoek naar het oordeel
      van de voorzitter voltooid is, of, indien dit onderzoek ingevolge het eerste lid niet wordt ingesteld, reeds
      aanstonds.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel28
  - number: '28.6'
    text: |-
      De secretaris legt de op de zaak betrekking hebbende stukken tot de dag van de zitting bij het secretariaat ter
      inzage voor partijen of hun schriftelijk gemachtigden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel28
  - number: '28.7'
    text: |-
      De secretaris geeft partijen van de gegevens omtrent de zitting onverwijld, doch ten minste twee weken voor de dag
      van de behandeling van het verzoek ter zitting, kennis. De kennisgeving gaat vergezeld van een afschrift van het in
      het vierde lid bedoelde rapport of bevat de mededeling dat ter zake geen voorbereidend onderzoek nodig is geacht,
      zulks onder vermelding van de redenen die tot dat oordeel hebben geleid. De kennisgeving bevat voorts de mededeling
      dat de stukken overeenkomstig het zesde lid ter inzage liggen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel28
  - number: '29'
    text: |-
      De voorzitter van de huurcommissie is bevoegd verzoeken welke gelijkluidend dan wel nagenoeg gelijkluidend zijn
      gevoegd door de huurcommissie te laten behandelen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel29
  - number: '30.1'
    text: |-
      Indien door een partij omtrent dezelfde woonruimte gelijktijdig meerdere verzoeken zijn ingediend, worden deze door
      de huurcommissie gevoegd behandeld.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel30
  - number: '30.2'
    text: |-
      Indien omtrent dezelfde woonruimte een verzoek als bedoeld in [artikel 7:257 van het Burgerlijk Wetboek][ref1] en
      een verzoek als bedoeld in [artikel 7:253 van dat wetboek][ref2] bij de huurcommissie zijn ingediend, beslist de
      huurcommissie op het eerstgenoemde verzoek alvorens op het andere verzoek te beslissen, tenzij de indiening van het
      eerstgenoemde verzoek heeft plaatsgevonden na het tijdstip waarop volgens het andere verzoek de wijziging van de
      huurprijs dient in te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '253'
  - number: '31.1'
    text: |-
      Voor de aanvang van de behandeling van het verzoek ter zitting kunnen de voorzitter en elk van de aan de zitting
      deelnemende leden door een van de partijen worden gewraakt op grond van feiten of omstandigheden, die het vormen
      van een onpartijdig oordeel zouden kunnen bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel31
  - number: '31.2'
    text: |-
      Op grond van zodanige feiten of omstandigheden kan de voorzitter, alsmede elk van de aan de zitting deelnemende
      leden, zich verschonen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel31
  - number: '31.3'
    text: |-
      De voorzitter en de aan de zitting deelnemende leden, uitgezonderd de persoon ten aanzien van wie ingevolge het
      eerste of tweede lid wraking, onderscheidenlijk verschoning, wordt gevraagd, beslissen zo spoedig mogelijk of
      de wraking, onderscheidenlijk de verschoning, wordt toegestaan. In geval van staking van stemmen is het verzoek
      tot wraking of verschoning toegestaan. De behandeling van de zaak kan in dat geval tot een door de voorzitter te
      bepalen dag en uur worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel31
  - number: '32.1'
    text: De zittingen van de huurcommissie zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel32
  - number: '32.2'
    text: |-
      In het belang van de openbare orde of op verzoek van een van de partijen, indien haar belangen dit eisen, kan de
      huurcommissie besluiten dat de zitting met gesloten deuren zal worden gehouden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel32
  - number: '32.3'
    text: |-
      De beraadslaging en de beslissing over een verzoek als bedoeld in het tweede lid en [artikel 31, derde lid][ref1],
      geschiedt buiten aanwezigheid van partijen of derden.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel31
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '31'
        hoofdstuk: V
        paragraaf: '2'
  - number: '33'
    text: |-
      De huurcommissie houdt zitting in haar vestigingsplaats. Indien daartoe aanleiding is, kan de voorzitter
      bepalen dat de huurcommissie ook zitting houdt in een andere gemeente in het ressort van de huurcommissie, of
      in een gemeente in een aangrenzend ressort mits die voorzitter tevens voorzitter is van de huurcommissie in dat
      aangrenzende ressort. In dat geval stellen burgemeester en wethouders van de betrokken gemeente de huurcommissie
      aldaar een passend lokaal ter beschikking.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel33
  - number: '34.1'
    text: |-
      De huurcommissie houdt zitting en beraadslaagt met de voorzitter, alsmede met twee leden, waarvan een lid afkomstig
      is uit de kring van huurders en een lid afkomstig is uit de kring van verhuurders. De voorzitter heeft de leiding
      van de zitting.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel34
  - number: '34.2'
    text: |-
      De voorzitter en de aan de zitting deelnemende leden van de huurcommissie maken zich voor de aanvang van de
      behandeling van het verzoek bekend en ondervragen vervolgens partijen of hun gemachtigden alsmede door partijen
      voor de aanvang van de zitting aan de voorzitter opgegeven getuigen en deskundigen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel34
  - number: '34.3'
    text: |-
      Partijen worden daarbij in de gelegenheid gesteld door tussenkomst van de voorzitter ter zake dienende vragen tot
      elkaar te richten.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel34
  - number: '34.4'
    text: Voordat de behandeling ter zitting wordt gesloten, heeft ieder van de partijen het recht het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel34
  - number: '34.5'
    text: Zodra de behandeling ter zitting gesloten is, deelt de voorzitter mede wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel34
  - number: '34.6'
    text: |-
      Indien een nader onderzoek noodzakelijk blijkt of indien een onderzoek alsnog wenselijk wordt geacht, kan de
      commissie tot het instellen daarvan besluiten, zulks onder gelijktijdige bepaling wie daarmee is belast. In dat
      geval zijn de verdere bepalingen over het voorbereidend onderzoek van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel34
  - number: '34.7'
    text: |-
      De huurcommissie beraadslaagt buiten aanwezigheid van partijen of derden, beslist daarbij bij meerderheid
      van stemmen en baseert haar uitspraken uitsluitend op hetgeen ter zitting is besproken en op de stukken die
      overeenkomstig [artikel 28, zesde lid][ref1], ter inzage zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel28
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '28'
        hoofdstuk: V
        paragraaf: '2'
  - number: '35'
    text: |-
      Indien een machtiging als bedoeld in [artikel 2:1, tweede lid, van de Algemene wet bestuursrecht][ref1] ontbreekt,
      kan de huurcommissie de zaak aanhouden totdat de betrokken partij in de gelegenheid is geweest op de juiste wijze
      in zijn vertegenwoordiging te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '36'
    text: |-
      De secretaris is bij de zittingen van de huurcommissie aanwezig. Hij houdt aantekening van al hetgeen daar
      wordt behandeld met vermelding van de zakelijke inhoud van de verklaringen van de door de huurcommissie gehoorde
      personen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel36
  - number: '37.1'
    text: |-
      De huurcommissie doet binnen vier maanden na het verstrijken van de in [artikel 7, vijfde lid][ref1], genoemde
      termijn, dan wel, indien de in dat artikellid bedoelde oproep niet behoeft te worden gedaan, na het tijdstip waarop
      de aldaar bedoelde vergoeding van beide partijen is ontvangen, schriftelijk en met redenen omkleed uitspraak. In
      afwijking van de eerste volzin doet de huurcommissie in het geval dat de in de eerste volzin genoemde termijn niet
      kan worden gehaald, uitspraak binnen een door de huurcommissie aan te geven langere termijn, mits zij aan beide
      partijen daarvan voor het verstrijken van de in de eerste volzin genoemde termijn schriftelijk en met redenen
      omkleed heeft kennisgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: '37.2'
    text: |-
      De uitspraken van de huurcommissie vermelden de namen van degenen die aan de behandeling van de zaak ter zitting
      hebben deelgenomen. Zij worden door de voorzitter en de secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel37
  - number: '37.3'
    text: |-
      De secretaris zendt onverwijld bij aangetekende brief of bij brief met ontvangstbevestiging een afschrift van de
      uitspraak van de huurcommissie aan partijen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel37
  - number: '37.4'
    text: |-
      De huurcommissie wijst in haar uitspraak partijen op de in [artikel 7:262 van het Burgerlijk Wetboek][ref1]
      bedoelde mogelijkheid zich tot de kantonrechter te wenden, alsook op de vorm en de termijn die daarbij in acht
      moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel262
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '262'
  - number: '37.5'
    text: |-
      Indien in de uitspraak wordt vastgesteld dat een woonruimte een of meer gebreken vertoont die het woongenot ernstig
      schaden zendt de secretaris bovendien afschrift aan de inspecteur van de volkshuisvesting en aan burgemeester en
      wethouders van de gemeente waarin de woonruimte is gelegen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel37
  - number: '38'
    text: |-
      De voorzitter, de leden, de plaatsvervangende leden en de secretaris mogen zich direct noch indirect in enig
      bijzonder onderhoud of gesprek inlaten met partijen of hun raadslieden, noch enige bijzondere onderrichting,
      memorie of geschriften aannemen over enige aangelegenheid, welke aanhangig is of waarvan zij weten of vermoeden,
      dat deze aanhangig zal worden bij de huurcommissie waartoe zij behoren.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel38
  - number: '39.1'
    text: |-
      De huurcommissie kan, voorzover dat redelijkerwijs voor de uitoefening haar taak nodig is, van de verhuurder inzage
      en het nemen van afschrift vorderen van boeken en andere zakelijke bescheiden.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel39
  - number: '39.2'
    text: |-
      De verhuurder is verplicht van hem krachtens het eerste lid gevorderde inzage en nemen van afschrift van boeken en
      andere zakelijke bescheiden te verlenen, een en ander op de wijze en binnen de termijn, door de voorzitter van de
      huurcommissie te bepalen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel39
  - number: '39.3'
    text: |-
      Het niet voldoen aan de in het tweede lid omschreven verplichting wordt gestraft met een geldboete van de tweede
      categorie. Het strafbare feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel39
  - number: '40'
    text: |-
      De voorzitter en de leden van een huurcommissie hebben toegang tot alle woon- en bedrijfsruimten, alsmede tot
      ruimte die als zodanig kan worden gebruikt, voorzover dat redelijkerwijs voor de uitoefening van hun taak nodig
      is. Zij kunnen zich bij het betreden door bepaalde, door hen aan te wijzen personen doen vergezellen. Zo nodig
      verschaffen zij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel40
  - number: '41.1'
    text: |-
      Een huurcommissie stelt, na overleg met de andere huurcommissies ten aanzien van de in het tweede lid bedoelde
      beleidsvoornemens, tijdig voor afloop van een kalenderjaar een jaarplan voor het volgende kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel41
  - number: '41.2'
    text: |-
      Het jaarplan geeft een schatting van het aantal zittingen dat de huurcommissie in het desbetreffende kalenderjaar
      zal houden, alsmede inzicht in de beleidsvoornemens van de huurcommissie voor het tijdvak vanaf 1 juli van het
      desbetreffende kalenderjaar tot 1 juli van het daaropvolgende jaar met betrekking tot toetsing van verzoeken
      als bedoeld in [artikel 9][ref1], voorzover die behoren tot de door Onze Minister daartoe aangewezen categorieën
      verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel9
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '41.3'
    text: |-
      Het jaarplan wordt aan Onze Minister toegezonden. Het ligt voor een ieder ter inzage bij het secretariaat van de
      huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel41
  - number: '42.1'
    text: |-
      Ten minste eenmaal per vier maanden verstrekt de huurcommissie aan Onze Minister een opgave, houdende het aantal
      van de sedert de afsluiting van de vorige opgave binnengekomen, door de huurcommissie te behandelen zaken, alsmede
      het aantal sinds het tijdstip van afsluiting van de vorige opgave door haar afgedane zaken.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel42
  - number: '42.2'
    text: |-
      De secretaris houdt een openbaar register aan, waarin met weglating van de namen van de betrokken huurders en
      verhuurders de slotwoorden van de uitspraken van de huurcommissie en van de uitspraken van de voorzitter van de
      huurcommissie zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel42
  - number: '42.3'
    text: |-
      Onze Minister kan regels geven omtrent de inrichting van dit register. Tevens kan Onze Minister regels geven met
      betrekking tot door de secretaris aan te houden andere registers.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel42
  - number: '43.1'
    text: |-
      Een huurcommissie stelt jaarlijks voor 1 maart een verslag op van de werkzaamheden, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van haar werkwijze in het bijzonder in het afgelopen kalenderjaar.
      Het verslag geeft tevens inzicht in het gevoerde beleid van de huurcommissie in het afgelopen kalenderjaar met
      betrekking tot de toetsing van de ingevolge [artikel 41, tweede lid][ref1], aangewezen categorieën verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel41
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '41'
        hoofdstuk: V
        paragraaf: '3'
  - number: '43.2'
    text: |-
      Het verslag wordt toegezonden aan Onze Minister, Onze Minister van Justitie en de kantonrechter met wiens
      rechtsgebied dat van de huurcommissie samenvalt, en aan de andere huurcommissies.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel43
  - number: '43.3'
    text: |-
      Het verslag wordt ingericht overeenkomstig door Onze Minister te geven regels. Het ligt voor een ieder ter inzage
      bij het secretariaat van de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel43
  - number: '44'
    text: |-
      De huurcommissies verstrekken desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel44
  - number: '45.1'
    text: |-
      Onze Minister kan aan de huurcommissies, na overleg met de voorzitters van de huurcommissies, algemene aanwijzingen
      geven met betrekking tot de door de huurcommissies uit te oefenen taken.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel45
  - number: '45.2'
    text: De in het eerste lid bedoelde aanwijzingen worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel45
  - number: '46'
    text: |-
      Krachtens de [artikelen 3, tweede lid][ref1], [7, derde lid][ref2],[ 8][ref3], [10, eerste lid][ref4], en
      [12, tweede lid][ref5], vast te stellen algemene maatregelen van bestuur treden niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin zij zijn geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0014315
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0014315
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '47.1'
    text: 'Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
  - number: 47.1.a
    text: |-
      bepaalt aan welke voorwaarden een verzoek aan de huurcommissie dient te voldoen en welke gegevens daarbij dienen te
      worden verstrekt of overgelegd;
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
  - number: 47.1.b
    text: |-
      bepaalt in welke gevallen de voorzitter van de huurcommissie van de bevoegdheid, bedoeld in
      [artikel 7, achtste lid][ref1], gebruik kan maken, en


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47.1.c
    text: |-
      stelt ter uitvoering van [artikel 7:252, vierde lid, van het Burgerlijk Wetboek][ref1] een formulier vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
  - number: '47.2'
    text: 'Onze Minister kan:'
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
  - number: 47.2.a
    text: |-
      ter uitvoering van [artikel 7:253 van het Burgerlijk Wetboek][ref1] regels geven met betrekking tot de voorwaarden
      waaraan het in het tweede lid van dat artikel bedoelde verzoek van de verhuurder aan de huurder dient te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '253'
  - number: 47.2.b
    text: |-
      ter uitvoering van [artikel 7:257 van het Burgerlijk Wetboek][ref1] regels geven met betrekking tot de voorwaarden
      waaraan een kennisgeving van de huurder aan de verhuurder van een gebrek dient te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel257
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '257'
  - number: 47.2.c
    text: nadere voorschriften geven omtrent de wijze waarop de huurcommissie haar taken ingevolge deze wet uitvoert.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel47
  - number: '48'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens binnen vier
      jaar aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de
      huurcommissies.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel48
  - number: '49'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij een huurcommissie aanhangige verzoeken worden met
      toepassing van het vóór het tijdstip van inwerkingtreding van deze wet geldende recht behandeld door de
      huurcommissie.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel49
  - number: '50'
    text: De toepasselijkheid van de bepalingen van deze wet kan niet bij overeenkomst worden uitgesloten of beperkt.
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel50
  - number: '51'
    text: |-
      In elke na het verstrijken van de termijn, bedoeld in [artikel 7:259, tweede lid, van het Burgerlijk Wetboek][ref1],
      ingestelde rechtsvordering ter zake van de vergoedingen, bedoeld in het eerste lid van dat artikel, wordt een
      uitspraak van de huurcommissie dan wel beschikking van de kantonrechter omtrent de betalingsverplichting van de
      huurder met betrekking tot deze vergoedingen overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel259
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '259'
  - number: '52'
    text: |-
      In elke rechtsvordering ter zake van hetgeen onverschuldigd mocht zijn betaald in verband met een
      overeenkomst als bedoeld in [artikel 7:258 van het Burgerlijk Wetboek][ref1] waarbij partijen slechts
      de hoogte van de prijs en niet die van de huurprijs zijn overeengekomen, wordt een uitspraak van de
      huurcommissie, als bedoeld in [artikel 17][ref2], dan wel een beschikking van de kantonrechter, als bedoeld in
      [artikel 7:262 van het Burgerlijk Wetboek][ref3] overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel258
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel262
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '258'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '17'
        hoofdstuk: III
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '262'
  - number: '53.1'
    text: |-
      De huurcommissies, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], worden van de dag van
      inwerkingtreding van deze wet af geacht huurcommissies te zijn, bedoeld in [artikel 21 van deze wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel21
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '21'
        hoofdstuk: V
        paragraaf: '1'
  - number: '53.2'
    text: |-
      De voorzitter en de leden der huurcommissies blijven na de inwerkingtreding van deze wet in die kwaliteit werkzaam
      tot het tijdstip waarop ingevolge de [Wet op de huurcommissies][ref1] hun ontslag zou zijn ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003222
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003222
  - number: 53a
    text: |-
      Indien deze wet later in werking treedt dan 1 juli van enig jaar, geldt [artikel 41][ref1] vanaf 1 januari van het
      daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel41
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '41'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53b
    text: |-
      De in [artikel 42, eerste lid][ref1], bedoelde opgave wordt voor de eerste maal verstrekt per de eerste datum
      van 1 januari, 1 mei of 1 september nadat sedert het in werking treden van deze wet ten minste vier maanden zijn
      verstreken. De in de eerste zin bedoelde opgave betreft de eerste maal het aantal van de sedert de vier daaraan
      voorafgaande maanden binnengekomen door de huurcommissie te behandelen onderscheidenlijk afgedane zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel42
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '42'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53c
    text: |-
      Het in [artikel 43][ref1] bedoelde verslag wordt voor de eerste maal opgesteld nadat sedert het
      tijdstip van in werking treden van deze wet een geheel kalenderjaar is verstreken. Over het daaraan
      voorafgaande kalenderjaar wordt door de huurcommissie verslag uitgebracht op de wijze als is aangegeven in
      [artikel 24 van de Wet op de huurcommissies][ref2], zoals dat artikel voor de inwerkingtreding van deze wet luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003222#Artikel24
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel53c
    references:
