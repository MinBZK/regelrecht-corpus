        bwb_id: BWBR0014315
        artikel: '43'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003222
        artikel: '24'
  - number: 53d
    text: |-
      [Artikel 46, eerste volzin][ref1], is niet van toepassing op het voor de eerste maal vaststellen van de in die
      volzin bedoelde algemene maatregelen van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel46
    url: https://wetten.overheid.nl/BWBR0014315/2004-03-26#Artikel53d
