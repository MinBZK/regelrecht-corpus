---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: loodsenwet_2001_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028220
url: https://wetten.overheid.nl/BWBR0028220/2010-10-10
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.a
    text: '*Onze Minister:* Onze Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.b
    text: '*loods:* degene die krachtens deze wet bevoegd is als loods op te treden;'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.c
    text: |-
      *loodsplichtige scheepvaartwegen:* de scheepvaartwegen waarop krachtens deze wet de kapitein van een schip
      verplicht is gebruik te maken van de diensten van een loods;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.d
    text: |-
      *schip:* een schip als bedoeld in [artikel 2, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1], alsmede elk
      vaartuig, met inbegrip van een vaartuig zonder waterverplaatsing dat feitelijk wordt gebruikt of geschikt is om te
      worden gebruikt als middel tot verplaatsing te water, met inbegrip van een watervliegtuig, een draagvleugelboot,
      een luchtkussenvoertuig, een drijvend platform, een verplaatsbare boorinstallatie, een baggermolen, een drijvende
      kraan, een ponton en elk ander drijvend werktuig, drijvend voorwerp of drijvende inrichting van soortgelijke aard,
      gedurende de tijd dat het drijft, dan wel een samenstel van schepen of van een of meer schepen met een of meer
      andere vaartuigen, waarvan ten minste één schip deel uitmaakt dat ter voortbeweging gebruik maakt van zijn motor en
      dat dient voor het voortbewegen of het sturen van het samenstel;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
  - number: 1.1.e
    text: '*kapitein:* degene die is belast met het gezag over een schip;'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.f
    text: |-
      *scheepsbeheerder:* degene die het beheer over een schip heeft, hetzij hij eigenaar, reder of boekhouder van de
      rederij van het schip is, hetzij het schip hem in gebruik is gegeven.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.g
    text: |-
      *haven:* een binnenwater of een gedeelte daarvan dat bij eilandsverordening of eilandsbesluit, houdende algemene
      maatregelen, als haven is aangewezen;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.h
    text: '*bestuurscollege:* het bestuurscollege van het openbaar lichaam Bonaire, Sint Eustatius of Saba;.'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: 1.1.i
    text: |-
      *bruto-inhoud van een schip:* de op de zee- of meetbrief uitgedrukte maat of bij gebreke daarvan enig ander
      document waaruit de bruto inhoud blijkt.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      Een kapitein van een schip die daarmede een haven van Bonaire, Sint Eustatius of Saba wil binnenkomen of uitgaan
      of daarin wil verhalen, is verplicht zich te bedienen van een loods wanneer deze door een bestuurscollege daartoe
      is ter beschikking gesteld. Tevens kunnen scheepvaartwegen in de territoriale zee of in de exclusieve economische
      zone, welke niet voeren van of naar bedoelde havens, bij eilandsverordening als loodsplichtige scheepvaartwegen
      worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: '1.3'
    text: |-
      Bij eilandsverordening, kunnen zaken die geen schepen zijn voor de toepassing van deze wet en de daarop berustende
      bepalingen met een schip worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      De loods adviseert aan boord de kapitein of degene die de feitelijke leiding heeft over de te voeren navigatie. De
      loods mag met instemming van de kapitein de leiding over de navigatie voeren.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Voor zover de loods zijn functie niet aan boord van het te loodsen schip kan uitoefenen mag deze de kapitein of
      degene die de feitelijke leiding heeft over de te voeren navigatie vanaf een ander schip of vanaf de wal adviseren.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      In het belang van de orde en veiligheid van het scheepvaartverkeer of de instandhouding van scheepvaartwegen
      of werken gelegen in of over scheepvaartwegen of ter voorkoming of beperking van hinder of gevaar door
      het scheepvaartverkeer voor personen die zich anders dan op een schip te water bevinden of schade door
      het scheepvaartverkeer aan de landschappelijke of natuurwetenschappelijke waarden van een gebied waarin
      scheepvaartwegen zijn gelegen, worden bij ministeriële regeling regels gegeven die de loodsen voor en bij de
      uitoefening van hun beroep in acht dienen te nemen. Deze voorschriften hebben onder andere betrekking op de
      omstandigheden en voorwaarden waaronder en de plaatsen vanaf waar de loods adviezen als bedoeld in het tweede lid
      mag geven.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      De loods is, voor zover hij handelt in de uitoefening van de in [artikel 2][ref1] genoemde taken en bevoegdheden,
      slechts aansprakelijk voor schade door hem veroorzaakt door opzet of grove schuld.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel2
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '2'
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Het openbaar lichaam Bonaire, Sint Eustatius of Saba, dan wel een instantie of rechtspersoon aan wie het
      openbaar lichaam het loodswezen geheel of gedeeltelijk heeft op- of overgedragen, in wiens opdracht een loods
      zijn diensten verleent, is niet aansprakelijk voor het handelen of nalaten van de loods in de uitoefening van
      de in [artikel 2][ref1] genoemde taken en bevoegdheden noch voor het handelen of nalaten van degenen die bij de
      uitoefening van die taken betrokken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel2
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '2'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      Bij ministeriële regeling worden regels gegeven met betrekking tot de bevoegdheid van de loods ten aanzien van
      loodsplichtige scheepvaartwegen en categorieën van schepen, voor de toelating tot het verkrijgen van de bevoegdheid
      van loods, de toelating tot het beroep van loods, vakbekwaamheidseisen en de bij de beroepsuitoefening in acht te
      nemen verplichtingen, alsmede het verliezen van de bevoegdheid van loods.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Het is degene die daartoe niet bevoegd is, verboden diensten als loods aan te bieden dan wel te verlenen of te doen
      verlenen aan schepen.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel4
  - number: '5'
    text: |-
      De kapitein is verplicht om tijdens de vaart van het schip op loodsplichtige scheepvaartwegen gebruik te maken van
      de diensten van een loods.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5
  - number: 5a.1
    text: |-
      Van de verplichting, bedoeld in [artikel 5][ref1], zijn uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel5
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 5a.1.a
    text: Nederlandse oorlogsschepen;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.1.b
    text: |-
      schepen met een bruto inhoud van 50 ton of daarbeneden, mits deze vaartuigen geen ander vaartuig op sleeptouw
      hebben;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.1.c.1°
    text: |-
      schepen met een bruto inhoud van 300 ton of daarbeneden van petroleummaatschappijen of bij deze maatschappijen
      in gebruik, wanneer deze schepen dezelfde haven uit- en invaren teneinde binnen drie zeemijlen buiten die haven
      werkzaamheden te verrichten in verband met het bedrijf dier maatschappijen en dan terug te keren;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.1.c.2°
    text: |-
      schepen met een bruto inhoud van 300 ton of daarbeneden van petroleummaatschappijen of bij deze maatschappijen
      in gebruik, wanneer de havens van hetzelfde eiland worden in- en uitgevaren om materialen, gereedschappen en
      werktuigen of baggerspecie langs de kust te vervoeren of teneinde in een andere haven van hetzelfde eiland
      werkzaamheden te verrichten in verband met het bedrijf dier maatschappijen;een en ander voor zover deze schepen
      niet meer dan één vaartuig op sleeptouw hebben of niet meer dan twee vaartuigen op sleeptouw hebben met een
      gezamenlijke inhoud van ten hoogste 135 ton;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.1.d
    text: |-
      schepen die hun thuishaven hebben op Bonaire met een bruto-inhoud van meer dan 50, doch minder dan 250 ton, mits
      door het bestuurscollege van Bonaire voor het binnenvaren van, uitvaren van, of verhalen in die thuishaven een
      vergunning is afgegeven.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.2
    text: |-
      Bij eilandsverordening van Bonaire wordt de hoogte van het jaarlijks te betalen vergunningsrecht, alsmede de
      overige voorwaarden tot het verkrijgen ener vergunning als bedoeld in het eerste lid, onderdeel d, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.3
    text: |-
      Het bestuurscollege van Bonaire kan bij een met redenen omkleed besluit, gelezen het advies van de Havenmeester,
      weigeren een vergunning als bedoeld in het eerste lid, onderdeel d, te verlenen, indien het daartoe een gegronde
      reden aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.4
    text: |-
      Het bestuurscollege van Bonaire kan bij een met redenen omkleed besluit, gehoord het advies van de Havenmeester,
      een vergunning, als bedoeld in het eerste lid, onderdeel d, intrekken, indien:
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.4.a
    text: |-
      één of meer bepalingen van deze wet of de eilandsverordening, bedoeld in het tweede lid, door de vergunninghouder
      wordt overtreden;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.4.b
    text: een of meer bepalingen van het Havenreglement Bonaire door de vergunninghouder wordt overtreden;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.4.c
    text: |-
      een of meer van de aan de vergunning door het bestuurscollege verbonden vergunningsvoorwaarden door de
      vergunninghouder wordt overtreden;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.4.d
    text: het bestuurscollege daartoe een gegronde reden aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.5
    text: |-
      Tegen weigering of intrekking der vergunning staat beroep open bij de eilandsraad van Bonaire binnen 14 dagen na
      dagtekening van de betreffende beschikking. De eilandsraad beslist op het beroep binnen 28 dagen na het vervallen
      van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: 5a.6
    text: |-
      In geval van intrekking der vergunning, wordt, op daartoe gedaan verzoek en tegen overlegging van het schriftelijk
      bewijs van de vergunning, het reeds over het lopende jaar betaalde vergunningsrecht gerestitueerd met ingang van de
      eerste dag van de maand volgende op die waarin de beslissing tot intrekking der vergunning door het bestuurscollege
      is genomen.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel5a
  - number: '6.1'
    text: |-
      Onverminderd [artikel 5a][ref1] kan bij eilandsverordening vrijstelling worden verleend van de verplichting,
      bedoeld in artikel 5, voor:


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: 5a
        hoofdstuk: III
        paragraaf: '2'
  - number: 6.1.a
    text: daarbij aangewezen categorieën van schepen;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel6
  - number: 6.1.b
    text: |-
      schepen, indien de kapitein of een aan boord zijnde stuurman tijdens de vaart op de desbetreffende scheepvaartweg
      in het bezit is van een verklaring van vrijstelling als bedoeld in [artikel 9][ref1] en de leiding over de
      navigatie voert.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel9
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
  - number: '6.2'
    text: |-
      Door het bestuurscollege kan aan een schip dat gebruik maakt van een loodsplichtige scheepvaartweg, in bij
      eilandsverordening aan te geven gevallen, ontheffing worden verleend. Aan ontheffing kunnen voorschriften worden
      verbonden. Eveneens kunnen deze onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel6
  - number: '7'
    text: 'Bij eilandsverordening, kan worden bepaald in welke gevallen en omstandigheden, en op welke wijze:'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel7
  - number: 7.a
    text: |-
      de kapitein die op grond van [artikel 6, eerste lid, onderdeel b][ref1], van de loodsplicht is vrijgesteld,
      niettemin worden verplicht om tijdens de vaart van het schip op een loodsplichtige scheepvaartweg gebruik te maken
      van de diensten van een loods;


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel6
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
  - number: 7.b
    text: |-
      de kapitein worden verplicht om tijdens de vaart van het schip op een scheepvaartweg die niet een loodsplichtige
      is, gebruik te maken van de diensten van een loods; en
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel7
  - number: 7.c
    text: 'de kapitein worden verplicht ten behoeve van het loodsen aanwijzingen op te volgen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel7
  - number: 7.c.1°
    text: het gebruik van meer dan één loods;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel7
  - number: 7.c.2°
    text: |-
      het gebruik maken van de diensten van een loods aan boord van het schip, dan wel vanaf de wal of vanaf een ander
      schip.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Het bepaalde in deze paragraaf is van overeenkomstige toepassing ten aanzien van een schip dat geen zeeschip is
      alsmede ten aanzien van degene die daarover de feitelijke leiding heeft, indien dit schip zich op zee bevindt.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Een verklaring van vrijstelling wordt afgegeven aan degene die voldoet aan daartoe bij ministeriële regeling te
      stellen eisen.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de afgifte van de verklaring van vrijstelling,
      de opleiding en examinering van degenen die voor een dergelijke verklaring in aanmerking wensen te komen en worden
      een of meer instanties of instituten aangewezen die met het verzorgen van een opleiding en het afnemen van examens
      worden belast.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      De kosten verbonden aan de aanvraag en de afgifte van diploma's en verklaringen van vrijstelling als bedoeld in
      [artikel 9][ref1], de deelname aan de daarvoor vereiste opleidingen en examens en de afgifte van andere documenten,
      verplicht gesteld bij of krachtens deze wet, worden ten laste gebracht van de aanvrager van het diploma of andere
      documenten, onderscheidenlijk de kandidaat voor de bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel9
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
  - number: '10.2'
    text: Bij eilandsverordening worden de tarieven voor de kosten, bedoeld in het eerste lid, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      De kapitein op wie een verplichting als bedoeld in de [artikelen 1, tweede lid][ref1], [5][ref2] of [7][ref3]
      rust, is gehouden loodsgeld te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028220#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028220#Artikel7
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028220
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028220
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: '11.2'
    text: |-
      De kapitein die tijdens de vaart op een scheepvaartweg gebruik maakt van de diensten van een loods zonder dat
      daartoe op hem een verplichting als bedoeld in de [artikelen 5][ref1] of [7][ref2] rust, is gehouden daarvoor
      loodsgeld te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028220#Artikel7
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028220
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: '11.3'
    text: |-
      De verplichting, bedoeld in het eerste en tweede lid, rust mede op de scheepsbeheerder en diens vertegenwoordiger
      ieder afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      Bij ministeriële regeling worden na overleg met het openbaar lichaam Bonaire, Sint Eustatius of Saba of de
      instantie of rechtspersoon, bedoeld in [artikel 3, tweede lid][ref1], de minimumtarieven voor loodsgelden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel3
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '3'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      Het bestuurscollege stelt het loodsgeld vast met inachtneming van [artikel 13][ref1]. Hierbij kunnen voor
      verschillende typen schepen, al dan niet gerelateerd aan de lengte of bruto-inhoud van het schip dan wel het
      tijdsbeslag dat met loodsdienst is gemoeid, verschillende tarieven worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel13
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '13'
        hoofdstuk: IV
  - number: '12.3'
    text: |-
      Het bestuurscollege kan vrijstelling verlenen van de verplichting, bedoeld in [artikel 11][ref1], voor daarbij
      aangewezen categorieën van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel11
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '11'
        hoofdstuk: IV
  - number: '12.4'
    text: |-
      Het bestuurscollege kan voor een schip geheel of gedeeltelijk ontheffing verlenen van de verplichting, bedoeld in
      [artikel 11][ref1], in door het bestuurscollege te bepalen omstandigheden of gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel11
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '11'
        hoofdstuk: IV
  - number: '13.1'
    text: Het loodsgeld strekt tot vergoeding van de kosten met betrekking tot het loodsen.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13
  - number: '13.2'
    text: |-
      Het loodsgeld is verschuldigd aan het openbaar lichaam Bonaire, Sint Eustatius of Saba of de instantie of
      rechtspersoon, bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel3
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '3'
        hoofdstuk: II
  - number: 13a.1
    text: |-
      De betaling van het loodsgeld geschiedt ten kantore van het bestuurscollege of aan de door het bestuurscollege
      aangewezen ambtenaar voor uit zee komende schepen binnen zesmaal 24 uren, doch in ieder geval vóór het vertrek en
      voor naar zee gaande schepen vóór het vertrek.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13a
  - number: 13a.2
    text: |-
      Wanneer een schip niet in de hoofdplaats van een openbaar lichaam komt kan het loodsgeld ook worden betaald in
      handen van de ambtenaar van de loodsdienst alvorens deze van boord gaat.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13a
  - number: 13a.3
    text: |-
      Geen vertrekpas wordt uitgereikt aan schepen waarvan het verschuldigde loodsgeld niet is voldaan, tenzij volgens
      [artikel 13b][ref1] zekerheid is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel13b
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: 13b
        hoofdstuk: IV
  - number: 13a.4
    text: De loods zal zijn diensten niet verlenen alvorens hem gebleken is dat aan de bepalingen van deze wet is voldaan.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13a
  - number: 13b.1
    text: |-
      Het bestuurscollege kan toestaan dat een doorlopende zekerheid wordt gesteld tot een door hem te bepalen bedrag
      voor de betaling van de verschuldigde loodsgelden.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13b
  - number: 13b.2
    text: |-
      In geval van een zekerheidsstelling moeten de loodsgelden die in de loop van de maand vorderbaar zijn geworden,
      vóór de 10e dag van de daarop volgende maand worden betaald.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13b
  - number: 13b.3
    text: |-
      Bij niet nakoming van de bepaling van het tweede lid kan door het bestuurscollege de gunst van zekerheidsstelling
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13b
  - number: 13c.1
    text: |-
      De te stellen zekerheid kan zijn persoonlijk of zakelijk en dient te geschieden ten genoegen van het openbaar
      lichaam.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13c
  - number: 13c.2
    text: De kosten van de zekerheidsstelling komen ten laste van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13c
  - number: 13d
    text: |-
      Het bestuurscollege zorgt voor kennisgeving aan de loodsdienst van elke zekerheidsstelling en eventueel ook van het
      vervallen daarvan.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13d
  - number: 13e
    text: |-
      De terugvordering van teveel betaalde loodsgelden verjaart met één jaar, te rekenen van de dag waarop zij betaald
      zijn.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13e
  - number: 13f
    text: |-
      Het bestuurscollege kan in bijzondere gevallen van dwaling of van verschoonbaar verzuim in de nakoming van de
      bepalingen van deze wet gehele of gedeeltelijke kwijtschelding van het verschuldigde of restitutie van het betaalde
      loodsgeld verlenen.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13f
  - number: 13g
    text: |-
      Het bestuurscollege kan ontheffing of vermindering van het verschuldigde loodsgeld verlenen wanneer en naarmate
      door daden of verzuimen van ambtenaren van de loodsdienst schade aan of door een beloodst vaartuig is veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel13g
  - number: '14.1'
    text: |-
      Handelen in strijd met de voorschriften, gesteld bij [artikel 1, tweede lid][ref1], [5][ref2] en [11][ref3] of
      krachtens [artikel 2, derde lid][ref4], of overtreding van [artikel 4, tweede lid][ref5], wordt gestraft met hetzij
      hechtenis van ten hoogste twaalf maanden, hetzij geldboete van ten hoogste de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028220#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028220#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0028220#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0028220#Artikel4
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028220
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028220
        artikel: '11'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0028220
        artikel: '2'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0028220
        artikel: '4'
        hoofdstuk: II
  - number: '14.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Bij herhaling van een overtreding als bedoeld in het tweede lid, kan de geldboete worden verhoogd tot ten hoogste
      de keren van herhalen te vermenigvuldigen met ten hoogste de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Bij veroordeling wegens een overtreding als bedoeld in [artikel 14, tweede lid][ref1], kan het vonnis tevens
      inhouden:


      [ref1]: https://wetten.overheid.nl/BWBR0028220#Artikel14
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028220
        artikel: '14'
        hoofdstuk: V
  - number: 15.1.a
    text: schorsing of beperking van de bevoegdheid als loods voor de duur van ten hoogste een jaar;
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel15
  - number: 15.1.b
    text: verval of beperking van de bevoegdheid als loods.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Het in het eerste lid gestelde geldt ook bij veroordeling van de loods wegens handelen in strijd met of overtreden
      van verboden in andere wettelijke voorschriften die op scheepvaartwegen van toepassing zijn, indien de loods dit
      handelen of die overtreding heeft begaan bij de uitoefening van zijn beroep.
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 184 van het Wetboek van Strafvordering BES][ref1], belast de door Onze Minister van Justitie, in
      overeenstemming met Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Loodsenwet 2001 BES.'
    url: https://wetten.overheid.nl/BWBR0028220/2010-10-10#Artikel17
