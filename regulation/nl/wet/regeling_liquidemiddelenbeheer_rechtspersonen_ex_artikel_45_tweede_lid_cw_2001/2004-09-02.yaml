    Besluit:
  url: https://wetten.overheid.nl/BWBR0017132/2004-09-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De producten, bedoeld in [artikel 45, tweede lid, van de Comptabiliteitswet 2001][ref1] hebben uitsluitend de
      vorm van:

      a. producten waarbij de hoofdsom tenminste aan het einde van de looptijd intact is, uitgezet bij een instelling die
      voldoet aan de in het tweede lid bedoelde eisen;

      b. vastrentende waarden, uitgegeven door een instelling die voldoet aan de in het tweede lid bedoelde eisen.

      2 De producten en vastrentende waarden worden uitsluitend betrokken van instellingen die voldoen aan de eisen,
      bedoeld in [artikel 2 van de Regeling uitzettingen en derivaten decentrale overheden][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012076#Artikel2
