    url: https://wetten.overheid.nl/BWBR0017132/2004-09-01#Artikel1
  - number: 1.1.b
    text: vastrentende waarden, uitgegeven door een instelling die voldoet aan de in het tweede lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0017132/2004-09-01#Artikel1
  - number: '1.2'
    text: |-
