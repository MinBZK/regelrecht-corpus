preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, in de Wet op het voortgezet onderwijs en de Wet
    educatie en beroepsonderwijs meer ruimte te scheppen voor samenwerking tussen scholen voor voortgezet onderwijs
    onderling en met instellingen voor educatie en beroepsonderwijs, om te bevorderen dat meer onderwijsdeelnemers
    die bijzondere aandacht behoeven, de onderwijsinstelling met een diploma verlaten, onderwijsdeelnemers meer kansen
    hebben om vervolgonderwijs met gunstig resultaat te volgen, en onderwijsvoorzieningen doelmatiger worden gebruikt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018736/2006-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt, in overeenstemming met Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit, binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018736/2006-01-01#ArtikelIII
  - number: IV
    text: Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0018736/2006-01-01#ArtikelIV
