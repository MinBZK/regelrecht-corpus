preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat gewijzigde omstandigheden en inzichten het wenselijk maken de Wet van 30
    oktober 1930 tot regeling van het toegepast-natuurwetenschappelijk onderzoek (Stb. 416) door een nieuwe wettelijke
    regeling te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze minister: Onze minister van Economische Zaken en Klimaat;

      b. Onze ministers wie het mede aangaat: Onze ministers van defensie, van infrastructuur en milieu, van onderwijs,
      cultuur en wetenschap, van sociale zaken en werkgelegenheid, en van volksgezondheid, welzijn en sport;

      c. de Organisatie: de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel1
  - number: '2'
    text: |-
      Onze minister draagt zorg voor de samenhang en doeltreffendheid van het door de regering met betrekking tot de
      Organisatie te voeren beleid. Hij treft daartoe, in overeenstemming met Onze ministers wie het mede aangaat, de
      nodige voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel2
  - number: '3'
    text: |-
      1 Er is een Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO.

      2 Zij bezit rechtspersoonlijkheid en is gevestigd te Delft.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel3
  - number: '4'
    text: |-
      De Organisatie heeft ten doel ertoe bij te dragen dat op toepassing gericht technisch- en natuurwetenschappelijk
      onderzoek en daarmee te verbinden sociaal-wetenschappelijk en ander op toepassing gericht onderzoek op doelmatige
      wijze dienstbaar wordt gemaakt aan het algemeen belang en de daarbinnen te onderscheiden deelbelangen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel4
  - number: '5'
    text: |-
      De Organisatie tracht haar doel te bereiken door:

      a. het verrichten en doen verrichten van het in [artikel 4][ref1] omschreven onderzoek op werkterreinen te bepalen
      op eigen initiatief, dan wel na overleg met, in overeenstemming met, of in opdracht van de rijksoverheid, de lagere
      overheden, ondernemingen, andere maatschappelijke groeperingen en natuurlijke personen;

      b. het toegankelijk maken en overdragen van resultaten van het in [artikel 4][ref2] omschreven onderzoek door
      middel van voorlichting en advisering alsmede het begeleiden en ondersteunen van derden bij de toepassing van dit
      onderzoek;

      c. samenwerking met andere onderzoekinstellingen ter zake van het in [artikel 4][ref3] omschreven onderzoek en

      d. het leveren van bijdragen aan de coördinatie van het in [artikel 4][ref4] omschreven onderzoek in Nederland en
      aan internationale samenwerking op dit gebied;

      e. het verrichten van de werkzaamheden die haar voorts worden opgedragen bij wet of algemene maatregel van bestuur.


