  - number: '29'
    text: |-
      1 Indien de raad van bestuur naar het oordeel van Onze minister zijn taak ernstig verwaarloost, kan Onze minister
      de noodzakelijke voorzieningen treffen.

      2 De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de raad van bestuur
      in de gelegenheid is gesteld om binnen een door Onze minister te stellen termijn alsnog zijn taak naar behoren uit
      te voeren.

      3 Onze minister stelt de beide Kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel29
  - number: '32'
    text: |-
      De Organisatie wordt beheerd als een administratieve eenheid, zoveel doenlijk met inachtneming van
      bedrijfseconomische beginselen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel32
  - number: '33'
    text: |-
      1 Onze minister beslist op verzoek van de meest gerede partij bij geschillen tussen de raad van bestuur en de raad
      van toezicht omtrent de bij of krachtens de wet aan deze raden verleende bevoegdheden.

      2 Onze minister, handelend in overeenstemming met Onze minister van defensie, beslist op verzoek van de meest
      gerede partij bij geschillen tussen de raad van bestuur en de raad voor het defensie-onderzoek omtrent de bij of
      krachtens de wet aan deze raden verleende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel33
  - number: '34'
    text: |-
      Besluiten van de raad van bestuur tot het oprichten en ontbinden alsmede het besturen van en deelnemen in andere
      rechtspersonen behoeven de goedkeuring van de raad van toezicht. De goedkeuring kan slechts worden onthouden wegens
      strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel34
  - number: '35'
    text: |-
      De door de raad van bestuur vast te stellen regeling van de arbeidsvoorwaarden van de werknemers van de Organisatie
      behoeft de goedkeuring van de raad van toezicht. De goedkeuring kan slechts worden onthouden wegens strijd met het
      recht of het algemeen belang
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel35
  - number: '36'
    text: |-
      Het door de Organisatie in opdracht van anderen dan de rijksoverheid of de lagere overheden verrichte onderzoek is
      vertrouwelijk, voor zover de opdrachtgever van dat onderzoek dit heeft bedongen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel36
  - number: '37'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven terzake van in deze wet geregelde
      onderwerpen, voorzover in de wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel37
  - number: '38'
    text: |-
      Het strategisch plan, bedoeld in [artikel 19][ref1], wordt door de raad van bestuur voor de eerste maal bij Onze
      minister ingediend voor 1 april 1987.


      [ref1]: https://wetten.overheid.nl/BWBR0003906#Artikel19
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003906
        artikel: '19'
        hoofdstuk: '4'
  - number: '40'
    text: |-
      1 Op het tijdstip van inwerkingtreding van deze wet gaan alle rechten en verplichtingen van de Nederlandsche
      Centrale Organisatie voor toegepast-natuurwetenschappelijk onderzoek, bedoeld in de Wet van 30 oktober 1930 (*Stb.*
      416) over op de Organisatie, bedoeld in deze wet, zonder dat daarvoor een nadere akte wordt gevorderd.

      2 Wettelijke procedures en rechtsgedingen, waarbij de Nederlandsche Centrale Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek partij is, worden voortgezet ten name van de Organisatie.

      3 Ten aanzien van de in de vorige leden begrepen onroerende zaken zal verandering in de tenaamstelling in
      de kadastrale legger plaatshebben. De raad van bestuur doet de daartoe nodige opgave aan de desbetreffende
      hypotheekbewaarder.

      4 Terzake van verkrijgingen, bedoeld in dit artikel, is de [Wet op belastingen van rechtsverkeer][ref1] (*Stb.*
      1970, 611) niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002740
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002740
  - number: '41'
    text: |-
      De voorzitter en de andere leden van het dagelijks bestuur, bedoeld in het TNO-besluit 1980, worden op het tijdstip
      van inwerkingtreding van deze wet voorzitter en leden van de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel41
  - number: '42'
    text: |-
      Op het tijdstip van inwerkingtreding van deze wet worden al degenen, die in dienst zijn van de Nederlandsche
      Centrale Organisatie voor toegepast-natuurwetenschappelijk onderzoek, bedoeld in de wet van 30 oktober 1930, geacht
      in dienst te zijn van de Organisatie, bedoeld in deze wet, tenzij zij binnen twee maanden na dat tijdstip te kennen
      geven dit niet te wensen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel42
  - number: '43'
    text: |-
      Het verslag, bedoeld in artikel 12 van de Wet van 30 oktober 1930 (*Stb.* 416), wordt voor het laatst uitgebracht
      over het kalenderjaar, voorafgaande aan het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel43
  - number: '44'
    text: |-
      De Wet van 30 oktober 1930 tot regeling van het toegepast natuurwetenschappelijk onderzoek (*Stb.* 416) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel44
  - number: '45'
    text: |-
      1 Deze wet kan worden aangehaald als: TNO-wet.

      2 Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel45
