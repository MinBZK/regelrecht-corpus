      1 De besluiten van de raad van toezicht, bedoeld in de [artikelen 13, tweede lid][ref1], [14, tweede lid][ref2],
      [15, eerste lid][ref3], en [34][ref4], alsmede de besluiten van de raad voor defensie-onderzoek, bedoeld in de
      [artikelen 15, eerste lid][ref5], en [18, vierde lid][ref6], kunnen bij koninklijk besluit worden vernietigd.

      2 Het koninklijk besluit tot vernietiging wordt in het *Staatsblad* geplaatst.


