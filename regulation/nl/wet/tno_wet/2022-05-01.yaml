  - number: '6'
    text: De Organisatie heeft een raad van bestuur, een raad van toezicht en een raad voor het defensie-onderzoek.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel6
  - number: '7'
    text: |-
      1 De raad van bestuur bestaat uit een voorzitter en ten hoogste vier andere leden. Het lidmaatschap van de raad van
      bestuur is onverenigbaar met het lidmaatschap van de raad van toezicht.

      2 Wij benoemen en ontslaan de voorzitter en drie van de vier andere leden van de raad van bestuur op voordracht van
      Onze minister, gedaan in overeenstemming met het gevoelen van de raad van ministers. Wij benoemen en ontslaan het
      vierde andere lid van de raad van bestuur op voordracht van Onze minister van defensie, gedaan in overeenstemming
      met Onze minister en met het gevoelen van de raad van ministers. De raad van toezicht doet een aanbeveling voor
      de eerstgenoemde voordrachten, nadat hij de raad van bestuur daarover heeft gehoord. Voor de voordracht van Onze
      minister van defensie doen de raad van toezicht en de raad voor het defensie-onderzoek een gemeenschappelijke
      aanbeveling, nadat zij de raad van bestuur daarover hebben gehoord. De ondernemingsraad van de Organisatie wordt in
      de gelegenheid gesteld over deze aanbevelingen advies uit te brengen.

      3 De leden van de raad van bestuur zijn, behoudens door Ons op eigen verzoek van betrokkene, dan wel
      om zwaarwichtige redenen verleend ontslag, voor onbepaalde tijd in dienst van de Organisatie. Ontslag
      wordt in elk geval verleend met ingang van de dag waarop zij de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereiken.

      4 Zolang in een vacature in de raad van bestuur niet is voorzien, vormen de overblijvende leden de raad van
      bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '8'
    text: |-
      1 De raad van bestuur is, behoudens hetgeen ten aanzien van de raad voor het defensie-onderzoek is bepaald, belast
      met het besturen van de Organisatie.

      2 Alle bevoegdheden welke niet bij of krachtens de wet aan een ander orgaan van de Organisatie zijn opgedragen,
      komen toe aan de raad van bestuur.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel8
  - number: '9'
    text: |-
      1 De voorzitter en een ander lid van de raad van bestuur vertegenwoordigen de Organisatie in en buiten rechte.

      2 Terzake van aangelegenheden met betrekking tot de hoofdgroep voor defensie-onderzoek geschiedt deze
      vertegenwoordiging door het lid van de raad van bestuur dat is benoemd op voordracht van Onze minister van defensie
      en door de voorzitter van de raad van bestuur.

      3 De raad van bestuur kan bepalen dat andere personen in de Organisatie de bevoegdheid tot vertegenwoordiging,
      bedoeld in het eerste lid, in zijn naam uitoefenen.

      4 De raad van bestuur verstrekt aan de raad van toezicht en, voorzover het gaat om aangelegenheden betreffende
      de hoofdgroep voor defensie-onderzoek, aan de raad voor het defensie-onderzoek, tijdig de door hen noodzakelijk
      geachte inlichtingen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel9
  - number: '10'
    text: |-
      1 De raad van toezicht bestaat uit een voorzitter en zes andere leden.

      2 Wij benoemen en ontslaan de voorzitter en drie andere leden van de raad van toezicht op voordracht van Onze
      minister, gedaan in overeenstemming met het gevoelen van de raad van ministers en gehoord de raad van toezicht.
      Voor de voordracht van één der andere leden bedoeld in de vorige volzin wordt de ondernemingsraad van de
      Organisatie uitgenodigd een aanbeveling in te dienen van twee personen, die niet in dienst van de Organisatie zijn.

      3 Wij benoemen en ontslaan drie andere leden van de raad van toezicht op voordracht van Onze minster van onderwijs,
      cultuur en wetenschap gedaan na overleg met Onze minister, in overeenstemming met het gevoelen van de raad van
      ministers en gehoord de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel10
  - number: '11'
    text: |-
      1 De leden van de raad van toezicht worden benoemd voor een tijdvak van vijf jaren, behoudens door Ons tussentijds
      op eigen verzoek van betrokkene, dan wel om zwaarwichtige redenen verleend ontslag, en zijn éénmaal voor een
      tijdvak van vijf jaren herbenoembaar. Hun wordt ontslag verleend met ingang van de eerste dag van de maand, waarin
      zij de leeftijd van zeventig jaren bereiken.

      2 Zolang in een vacature in de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel11
  - number: '12'
    text: |-
      De leden van de raad van bestuur wonen de vergaderingen van de raad van toezicht bij, tenzij de raad van toezicht
      in voorkomende gevallen anders beslist.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel12
  - number: '13'
    text: |-
      1 De raad van toezicht heeft tot taak toezicht te houden op het beleid van de raad van bestuur. Hij staat de
      raad van bestuur met raad terzijde. Bij de vervulling van zijn taak richt de raad zich naar het belang van de
      Organisatie en neemt daarbij de doelstelling van de Organisatie, zoals geformuleerd in [artikel 4][ref1], tot zijn
      richtlijn.

      2 De raad van toezicht stelt een reglement vast betreffende zijn werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003906#Artikel4
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003906
        artikel: '4'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de Organisatie.

      2 De raad van toezicht kan zijn leden, ten laste van de Organisatie, een vergoeding voor hun werkzaamheden en een
      tegemoetkoming in de kosten toekennen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel14
  - number: '15'
    text: |-
      1 Het bestuur van de Organisatie en hetgeen verder de inrichting van de Organisatie betreft wordt, met inachtneming
      van het daaromtrent bij of krachtens deze wet bepaalde, nader bij reglement geregeld door de raad van bestuur,
      onder goedkeuring van de raad van toezicht en, voorzover het betreft de hoofdgroep voor defensie-onderzoek van de
      raad voor het defensie-onderzoek. De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het
      algemeen belang.

      2 Het reglement, bedoeld in het eerste lid, wordt toegezonden aan Onze minister.

      3 De Organisatie kent instituten die, met uitzondering van de instituten van de hoofdgroep voor defensie-onderzoek,
      worden ingesteld en opgeheven door de raad van bestuur, onder goedkeuring van de raad van toezicht.

      4 Er is per instituut een programma-adviesraad met adviserende bevoegdheden. Bij algemene maatregel van bestuur
      worden regels gegeven over de bevoegdheden van programma-adviesraden.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel15
  - number: '16'
    text: |-
      Er is een hoofdgroep voor defensie-onderzoek. Dit is een organisatorische eenheid die bestaat uit door de raad voor
      het defensie-onderzoek aangewezen instituten of andere onderdelen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel16
  - number: '17'
    text: |-
      1 De raad voor het defensie-onderzoek bestaat uit een voorzitter en ten hoogste twaalf andere leden die door Ons,
      op voordracht van Onze minister van defensie, worden benoemd en ontslagen. Als voorzitter treedt op het lid van de
      raad van bestuur bedoeld in de [tweede volzin van artikel 7, tweede lid][ref1]. Bij algemene maatregel van bestuur
      worden nadere regels gegeven over de samenstelling van de raad voor het defensie-onderzoek en de zittingstijd van
      zijn leden.

      2 De voorzitter van de raad van bestuur heeft toegang tot de vergaderingen van de raad voor het defensie-onderzoek.

      3 Zolang in een vacature in de raad voor het defensie-onderzoek niet is voorzien, vormen de overblijvende leden
      de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0003906#Artikel7
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003906
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '18'
    text: |-
      1 De raad voor het defensie-onderzoek stelt, met inachtneming van hetgeen ten aanzien van de raad van bestuur is
      bepaald, het met betrekking tot de hoofdgroep voor defensie-onderzoek te voeren beleid vast.

      2 Bij algemene maatregel van bestuur worden nadere regels gegeven over de taken en bevoegdheden met betrekking tot
      de hoofdgroep voor defensie-onderzoek, welke met uitsluiting van de raad van bestuur en de raad van toezicht aan de
      raad voor het defensie-onderzoek zijn opgedragen.

      3 De raad voor het defensie-onderzoek verstrekt Onze minister van defensie de gevraagde inlichtingen.

      4 De raad voor het defensie-onderzoek stelt een reglement vast betreffende zijn werkwijze. De raad voor het
      defensie-onderzoek heeft een eigen secretariaat; de kosten daarvan komen ten laste van de Organisatie.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel18
  - number: '19'
    text: |-
      1 De raad van bestuur dient éénmaal per vier jaren bij Onze minister een strategisch plan voor de Organisatie
      in, waarmee de raad van toezicht heeft ingestemd. Het onderdeel van het strategisch plan dat de hoofdgroep voor
      defensie-onderzoek betreft, wordt vastgesteld door de raad voor het defensie-onderzoek en behoeft de instemming van
      Onze minister van defensie. De raad van bestuur doet van het strategisch plan afschrift toekomen aan Onze ministers
      wie het mede aangaat.

      2 Het strategisch plan formuleert de op middellange en lange termijn te realiseren doelstellingen en de hoofdlijnen
      van het daarop te richten beleid. Het omschrijft de gebieden, de richtingen, de aard en het kwaliteitsniveau van
      de door de Organisatie te leveren prestaties, alsmede de financiële, personele, materiële en organisatorische
      voorwaarden die daartoe vervuld moeten worden.

      3 Het strategisch plan houdt rekening met het door de overheid gevoerde beleid en met het wetenschapsbudget, als
      bedoeld in [artikel 16a van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref1].

      4 Onze minister brengt zijn standpunt over het strategisch plan, bepaald in overeenstemming met Onze ministers van
      defensie, van onderwijs, cultuur en wetenschap en van volksgezondheid, welzijn en sport en met het gevoelen van de
      raad van ministers, binnen zes maanden na ontvangst van het plan ter kennis van de raad van bestuur. Onze minister
      doet daarvan en van het strategisch plan afschrift toekomen aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel16a
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: 16a
  - number: '20'
    text: |-
      De Organisatie verwerft haar geldmiddelen door het aanvaarden van van rijkswege te verstrekken subsidies, door het
      aanvaarden van subsidies en bijdragen van derden, door het in rekening brengen van vergoedingen voor in opdracht
      uitgevoerd onderzoek en andere werkzaamheden, door het aanvaarden van schenkingen, van erfstellingen en legaten, en
      uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel20
  - number: '21'
    text: |-
      1 Aan de Organisatie wordt jaarlijks van rijkswege een subsidie verstrekt. De raad van bestuur dient hiertoe
      jaarlijks voor 1 april bij Onze minister een met redenen omklede aanvraag en begroting voor het daaropvolgende jaar
      in. Het onderdeel van deze aanvraag dat de hoofdgroep voor defensie-onderzoek betreft wordt vastgesteld door de
      raad voor defensie-onderzoek.

      2 De begroting behelst een raming van de baten en lasten van de Organisatie en een raming van de inkomsten en
      uitgaven. In de begroting is een allocatie van middelen opgenomen die in overeenstemming is met het strategisch
      plan, bedoeld in [artikel 19][ref1].

      3 De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien. Uit de toelichting blijkt steeds
      welke begrotingsposten betrekking hebben op de uitoefening van de bij of krachtens de wet aan de Organisatie
      opgedragen taken dan wel op andere activiteiten.

      4 Tenzij de activiteiten waarop de begroting betrekking heeft nog niet eerder werden verricht, behelst de begroting
      een vergelijking met de begroting van het lopende jaar en de laatste jaarrekening, bedoeld in [artikel 25][ref2].
      De aanvraag voor subsidie behoeft de instemming van de raad van toezicht, met uitzondering van het onderdeel dat de
      hoofdgroep voor defensie-onderzoek betreft.

      5 Onze minister, in overeenstemming met Onze ministers van defensie, van onderwijs, cultuur en wetenschap en van
      volksgezondheid, welzijn en sport en met het gevoelen van de raad van ministers, doet de raad van bestuur in de
      jaarlijkse beschikking tot subsidieverlening mededeling van de voor het volgende kalenderjaar ten laste van de
      rijksbegroting beschikbare bedragen en de verdeling daarvan over de daarvoor in aanmerking komende hoofdstukken
      van de rijksbegroting. Onze minister geeft daarbij aan welke verplichtingen bestaan aangaande de bestemming van
      deze bedragen.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de subsidieverstrekking en over
      de bij de aanvraag over te leggen bescheiden. De raad van bestuur zendt van de aanvraag en de daarbij te voegen
      bescheiden een afschrift aan Onze ministers wie het mede aangaat.

      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de vaststelling van bedragen, bedoeld in het
      vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003906#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003906#Artikel25
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel21
