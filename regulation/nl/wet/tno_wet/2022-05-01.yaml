        artikel: '25'
        hoofdstuk: '6'
  - number: 21a
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet de raad van bestuur daarvan terstond mededeling aan
      Onze minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel21a
  - number: '22'
    text: |-
      Door de Organisatie kunnen financiële reserves worden gevormd, volgens door Onze minister in overeenstemming met
      Onze minister van financiën en, voorzover het betreft de hoofdgroep voor defensie-onderzoek, ook in overeenstemming
      met Onze minister van defensie te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel22
  - number: '24'
    text: |-
      1 De raad van toezicht verstrekt Onze minister de door hem noodzakelijk geachte inlichtingen.

      2 Het verstrekken van inlichtingen, als bedoeld in het vorige lid, blijft achterwege voorzover het betreft
      in opdracht uit te voeren dan wel uitgevoerd onderzoek, waarover door de Organisatie met een opdrachtgever
      geheimhouding is overeengekomen en voorzover het betreft gegevens die door natuurlijke of rechtspersonen
      vertrouwelijk aan de Organisatie zijn meegedeeld.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel24
  - number: '25'
    text: |-
      1 De raad van bestuur zendt jaarlijks voor 1 juli het jaarverslag en de jaarrekening over het voorafgaande
      kalenderjaar aan Onze minister. Het jaarverslag beschrijft de taakuitoefening en het gevoerde beleid en geeft aan
      in hoeverre de doelstellingen uit het strategisch plan, bedoeld in [artikel 19][ref1], zijn verwezenlijkt. Deze
      stukken behoeven de instemming van de raad van toezicht, en voor wat betreft het onderdeel dat betrekking heeft
      op de hoofdgroep voor defensie-onderzoek van de raad voor het defensie-onderzoek. De raad van bestuur doet daarvan
      afschrift toekomen aan Onze ministers wie het mede aangaat.

      2 Onze minister brengt deze stukken ter kennis van de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003906#Artikel19
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003906
        artikel: '19'
        hoofdstuk: '4'
  - number: '26'
    text: |-
      1 De jaarrekening, waarin rekening en verantwoording wordt afgelegd van het financieel beheer en van de geleverde
      prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de raad van toezicht aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Bij de aanwijzing van de accountant bedingt
      de raad van toezicht dat aan Onze minister desgevraagd inzicht wordt geboden in de controlewerkzaamheden van de
      accountant.

      3 De verklaring, bedoeld in het tweede lid, heeft mede betrekking op de rechtmatige inning en besteding van de
      middelen door de Organisatie.

      4 De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de inrichting van de werkzaamheden van de Organisatie voldoen aan eisen van doelmatigheid.

      5 Indien uitgaven zijn geschied in strijd met het bepaalde bij of krachtens de wet, dan wel indien werkzaamheden
      ten behoeve waarvan de subsidie, bedoeld in [artikel 21, eerste lid][ref3], is verleend, niet behoorlijk zijn
      uitgevoerd of de subsidie ondoelmatig is aangewend, kan Onze minister bepalen dat de daarmee gemoeide bedragen in
      mindering worden gebracht op de subsidie. Hij maakt dit binnen een jaar na de ontvangst van de jaarrekening bekend
      aan de raad van toezicht.

      6 Ten aanzien van de in het tweede lid bedoelde accountant is [artikel 24, tweede lid][ref4], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
