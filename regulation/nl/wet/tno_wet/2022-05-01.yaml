  - number: 26a
    text: |-
      Bij ministeriële regeling kunnen, de raad van bestuur gehoord, nadere voorschriften worden vastgesteld voor de
      inrichting van de begroting, het jaarverslag en de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0003906/2022-05-01#Artikel26a
  - number: '27'
    text: |-
      1 De raad van toezicht neemt een besluit omtrent de goedkeuring als bedoeld in de [artikelen 15, eerste lid][ref1],
      [34][ref2] en [35][ref3], dan wel een beslissing omtrent de instemming als bedoeld in de
      [artikelen 19, eerste lid][ref4], [21, vierde lid][ref5], en [25, eerste lid][ref6], binnen drie maanden na de dag
      waarop de stukken die goedkeuring dan wel instemming behoeven, hem zijn aangeboden.

      2 De raad voor het defensie-onderzoek neemt een besluit omtrent de goedkeuring als bedoeld in
      [artikel 15, eerste lid][ref7], dan wel een beslissing omtrent de instemming als bedoeld in
      [artikel 25, eerste lid][ref8], binnen drie maanden na de dag waarop de stukken die goedkeuring dan wel instemming
      behoeven, hem zijn aangeboden.

      3 De raad van toezicht, onderscheidenlijk de raad voor het defensie-onderzoek, wordt geacht goedkeuring dan wel
      instemming te hebben verleend, indien hij binnen de in de vorige leden gestelde termijn van drie maanden geen
      besluit aan de raad van bestuur heeft gezonden.


