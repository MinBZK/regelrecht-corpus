        artikel: '34'
  - number: '3.2'
    text: |-
      Het bestuurscollege volgt bij zijn oordeel of een onderwijsvoorziening een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1], een door de inspectie ter zake gegeven besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
        paragraaf: '1'
  - number: '3.3'
    text: |-
      Indien Onze Minister naar aanleiding van een melding als bedoeld in artikel 14 van de Wet op het onderwijstoezicht
      besluit dat een school niet langer voldoet aan de criteria die gelden voor een school als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1], dan volgt het bestuurscollege van het openbaar lichaam waarin de
      school is gevestigd dit besluit en oordeelt het dat de school niet langer een school is als bedoeld in artikel 1,
      onderdeel b, subonderdeel 3.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
        paragraaf: '1'
  - number: '3.4'
    text: |-
      Indien het besluit, bedoeld in het derde lid, daartoe aanleiding geeft, stelt het bestuurscollege de ouders
      van de leerlingen van de onderwijsvoorziening binnen 7 dagen schriftelijk op de hoogte van het feit dat de
      onderwijsvoorziening niet langer een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref1], of
      verzekert het er zich van dat de onderwijsvoorziening de ouders daarvan op de hoogte heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
        paragraaf: '1'
  - number: '4'
    text: |-
      Indien een leerplichtige jongere of een jongere die kwalificatieplichtig is meerderjarig is, rusten de
      verplichtingen en bevoegdheden die in deze wet zijn toebedeeld aan de in [artikel 6, eerste lid][ref1], bedoelde
      personen op de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Indien de kwaliteit van het niet uit ’s Rijks kas bekostigde onderwijs ernstig of langdurig tekortschiet, kan Onze
      Minister op verzoek van het hoofd van een school of instelling of uit eigener beweging in overeenstemming met het
      hoofd maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel5
  - number: '5.2'
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het hoofd van een school of instelling te
      laten bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de school of
      instelling ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel5
  - number: '6.1'
    text: |-
      Degene die het gezag over een jongere uitoefent, en degene die zich met de feitelijke verzorging van een jongere
      heeft belast, zijn verplicht overeenkomstig de bepalingen van deze wet te zorgen, dat de jongere als leerling
      van een school staat ingeschreven en deze school na inschrijving geregeld bezoekt. Bij de inschrijving wordt een
      van overheidswege verstrekt document of een bewijs van uitschrijving van een andere school overgelegd waarop de
      gegevens van de jongere betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en persoonsgebonden
      nummer BES zijn vermeld. Indien de in de eerste volzin bedoelde personen bij de inschrijving aannemelijk hebben
      gemaakt dat zij geen persoonsgebonden nummer BES van de jongere kunnen overleggen, leggen zij het persoonsgebonden
      nummer BES van de jongere over aan de school zodra zij daarvan kennis hebben gekregen.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde verplichtingen gelden niet voor zover de daarin bedoelde personen kunnen aantonen dat
      zij daarvoor niet verantwoordelijk kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel6
  - number: '6.3'
    text: |-
      De jongere die de leeftijd van 12 jaren heeft bereikt, is verplicht overeenkomstig de bepalingen van deze wet de
      school waaraan hij als leerling staat ingeschreven, geregeld te bezoeken, onverminderd het bepaalde in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel6
  - number: '7.1'
    text: |-
      De verplichting om te zorgen, dat een jongere als leerling van een school staat ingeschreven, begint op de eerste
      schooldag van de maand volgende op die waarin de jongere de leeftijd van vier jaar bereikt, en eindigt:
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel7
  - number: 7.1.a
    text: |-
      aan het einde van het schooljaar na afloop waarvan de jongere ten minste twaalf volledige schooljaren een of meer
      scholen heeft bezocht;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel7
  - number: 7.1.b
    text: aan het einde van het schooljaar waarin de jongere de leeftijd van zestien jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel7
  - number: '7.2'
    text: |-
      Een jongere die een basisschool in minder dan acht schooljaren heeft doorlopen, wordt voor de toepassing van het
      eerste lid onder a geacht reeds acht schooljaren een school te hebben bezocht.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel7
  - number: '8.1'
    text: |-
      Indien het een jongere betreft die ten minste de leeftijd van 14 jaar heeft bereikt en waarvan naar het oordeel
      van het bestuurscollege is komen vast te staan, dat hij niet geschikt is volledig onderwijs aan een school te
      volgen, kan het bestuurscollege van het openbaar lichaam waar de jongere als ingezetene is ingeschreven, op
      aanvraag van de in [artikel 6, eerste lid][ref1], bedoelde personen, in overeenstemming met het bevoegd gezag van
      de school, toestaan dat gedurende een bepaald schooljaar, voor zover nodig, in afwijking van het bepaalde in de
      [artikelen 33][ref2], [35][ref3] en [36 van de Wet voortgezet onderwijs BES][ref4] de jongere aan de school een
      programma volgt, dat naast algemeen vormend onderwijs en op het beroep gericht onderwijs tevens praktijktijd bevat,
      bestaande uit arbeid van lichte aard, te verrichten naast en in de samenhang met het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel36
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '36'
  - number: '8.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de school en dat ten minste bevat een
      beschrijving van de onderwijsdoelen en van de praktijktijd.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
  - number: '8.3'
    text: |-
      Alvorens het bestuurscollege besluit op de aanvraag, bedoeld in het eerste lid, hoort het bestuurscollege in elk
      geval:
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
  - number: 8.3.a
    text: degene die de aanvraag heeft ingediend en de jongere zelf, en
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
  - number: 8.3.b
    text: het hoofd van de school waar de jongere staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
  - number: '8.4'
    text: |-
      Het bestuurscollege besluit binnen 4 weken na ontvangst van de aanvraag, bedoeld in het eerste lid, en zendt binnen
      2 weken na het nemen van het besluit daarvan afschrift aan de in [artikel 6, eerste lid][ref1], bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '8.5'
    text: |-
      Indien de jongere nog steeds niet geschikt is volledig onderwijs als bedoeld in het eerste lid aan een school
      te volgen, kunnen de in [artikel 6, eerste lid][ref1], bedoelde personen het bestuurscollege ten minste acht
      weken voor het verstrijken van de periode waarvoor toestemming is verleend, aanvragen om de toestemming voor
      het daaropvolgend schooljaar te verlengen. De aanvraag gaat vergezeld van een verklaring van het hoofd van de
      school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van de wijze waarop uitvoering is
      gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het onderwijs, bedoeld in de
      [artikelen 33 tot en met 36 van de Wet voortgezet onderwijs BES][ref2], te ontraden is, alsmede dat voortzetting
      van het programma bijdraagt aan de ontwikkeling van de jongere. Het tweede en derde lid zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '33'
  - number: '8.6'
    text: |-
      Een jongere die wegens gedragsproblemen de veiligheid van medeleerlingen en personeel negatief beïnvloedt en die
      een grens heeft overschreden of dreigt te overschrijden en daardoor tijdelijk niet meer is te handhaven binnen
      de school, kan door het bestuurscollege van het openbaar lichaam waar de jongere als ingezetene is ingeschreven,
      op aanvraag van het bevoegd gezag van een school en na overleg met de in [artikel 6, eerste lid][ref1], bedoelde
      personen, opgedragen worden een niet vrijblijvend traject te volgen buiten de school. Dit traject wordt gevolgd
      binnen een afgebakende periode van enkele maanden, waarin de jongere gemotiveerd wordt om zijn schoolloopbaan te
      vervolgen. Dit traject wordt gevolgd in een daartoe door Onze Minister aangewezen organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Op aanvraag van de in [artikel 6, eerste lid][ref1], bedoelde personen kan het bestuurscollege van het openbaar
      lichaam waar de jongere als ingezetene is ingeschreven, toestaan dat de inschrijving van de jongere aan een school
      voor het laatste schooljaar, bedoeld in [artikel 7, eerste lid, onder a of b][ref2], wordt vervangen door de
      inschrijving als mbo-student of vavo-student van een instelling als bedoeld in [paragraaf 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030281
        paragraaf: '3'
  - number: '9.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de instelling waar de jongere ingeschreven
      wenst te worden. Het begeleidingsprogramma bevat ten minste een beschrijving van de onderwijs- en vormingsdoelen,
      waaronder algemeen vormend onderwijs en op het beroep gericht onderwijs, alsmede de wijze waarop arbeid van lichte
      aard zal worden verricht, naast het volgen van onderwijs aan een instelling als bedoeld in [paragraaf 3][ref1]
      doch niet in samenhang met het onderwijs. Indien het betreft een jongere, die ten tijde van de indiening van de
      aanvraag een programma als bedoeld in [artikel 8, eerste lid][ref2], volgt, gaat de aanvraag tevens vergezeld van
      een verklaring van het hoofd van de school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van
      de wijze waarop uitvoering is gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar
      het onderwijs, bedoeld in de [artikelen 33 tot en met 36 van de Wet voortgezet onderwijs BES][ref3], dan wel een
      voortgezette toepassing van artikel 8, eerste lid, te ontraden is.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0030281
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '33'
  - number: '9.3'
    text: |-
      Alvorens het bestuurscollege besluit op de aanvraag, bedoeld in het eerste lid, hoort het bestuurscollege in elk
      geval:
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel9
  - number: 9.3.a
    text: degene die de aanvraag heeft ingediend en de jongere zelf;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel9
  - number: 9.3.b
    text: |-
      het hoofd van de school waar de jongere het laatst stond ingeschreven en het hoofd van de instelling waar de
      jongere ingeschreven wenst te worden, en
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel9
  - number: 9.3.c
    text: de instellingen van maatschappelijke zorg die reeds bij de begeleiding van de jongere betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel9
  - number: '9.4'
    text: |-
      Het bestuurscollege besluit binnen 4 weken na ontvangst van de aanvraag, bedoeld in het eerste lid, en zendt binnen
      2 weken na het nemen van het besluit daarvan afschrift aan de in [artikel 6, eerste lid][ref1], bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      De verplichting om te zorgen, dat een jongere de school waar hij als leerling staat ingeschreven, geregeld bezoekt,
      begint op de dag waarop hij na inschrijving op die school kan plaats nemen en eindigt tegelijk met de verplichting
      om te zorgen dat hij als leerling van een school staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel10
  - number: '10.2'
    text: Het schoolbezoek vindt geregeld plaats zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel10
  - number: '11.1'
    text: |-
      De in [artikel 6, eerste lid][ref1], bedoelde personen zijn verplicht te zorgen dat de jongere overeenkomstig
      de bepalingen van deze paragraaf staat ingeschreven als leerling, vavo-student of mbo-student bij een
      school of instelling die volledig onderwijs, een bij de wet geregelde combinatie van leren en werken
      of een onderwijsprogramma als bedoeld in [artikel 27a, tweede lid][ref2], [27l, tweede lid][ref3],
      [62, derde lid, onderdeel d][ref4], of [114a, derde lid, onderdeel d, van de Wet voortgezet onderwijs BES][ref5]
      verzorgt en dat hij deze school of instelling na inschrijving geregeld bezoekt, als:


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27a
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel114a
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27a
      - id: ref3
        bwb_id: BWBR0030284
        artikel: 27l
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '62'
      - id: ref5
        bwb_id: BWBR0030284
        artikel: 114a
  - number: 11.1.a
    text: |-
      ten aanzien van de jongere de leerplicht, bedoeld in [paragraaf 2][ref1], is geëindigd, en


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030281
        paragraaf: '2'
  - number: 11.1.b
    text: de jongere geen startkwalificatie heeft behaald.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel11
  - number: '11.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet ten aanzien van jongeren die in
      het bezit zijn van een verklaring of een schooldiploma praktijkonderwijs als bedoeld in
      [artikel 73 van de Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel73
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '73'
  - number: '11.3'
    text: |-
      [Artikel 6, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van de verplichtingen, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '11.4'
    text: |-
      Als de inschrijving, bedoeld in het eerste lid, plaats vindt aan een andere school of instelling dan daarvoor
      door de jongere werd bezocht, wordt bij de inschrijving een van overheidswege verstrekt document of een bewijs
      van uitschrijving van een andere school of instelling overgelegd waarop de gegevens van de jongere betreffende
      zijn geslachtsnaam, voorletters, geboortedatum, geslacht en persoonsgebonden nummer BES zijn vermeld. Als de
      in [artikel 6, eerste lid][ref1], bedoelde personen bij de inschrijving aannemelijk hebben gemaakt dat zij geen
      persoonsgebonden nummer BES van de jongere kunnen overleggen, leggen zij het persoonsgebonden nummer BES van de
      jongere over aan de school zodra zij daarvan kennis hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '12'
    text: |-
      De verplichting, bedoeld in [artikel 11, eerste lid][ref1], vangt aan direct na het einde van de leerplicht,
      bedoeld in [paragraaf 2][ref2], en eindigt zodra de jongere de leeftijd van 18 jaar bereikt of een
      startkwalificatie heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030281
        paragraaf: '2'
  - number: '13.1'
    text: |-
      De jongere die als leerling, vavo-student of mbo-student van een school of instelling staat ingeschreven
      op grond van [artikel 11, eerste lid][ref1], is verplicht het volledige onderwijsprogramma , het
      volledige programma van de combinatie leren en werken respectievelijk het onderwijsprogramma, bedoeld
      in [artikel 27a, tweede lid][ref2], [27l, tweede lid][ref3], [62, derde lid, onderdeel d][ref4], of
      [114a, derde lid, onderdeel d, van de Wet voortgezet onderwijs BES][ref5], te volgen dat door die school of
      instelling wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27a
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel114a
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27a
      - id: ref3
        bwb_id: BWBR0030284
        artikel: 27l
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '62'
      - id: ref5
        bwb_id: BWBR0030284
        artikel: 114a
  - number: '13.2'
    text: |-
      De jongere voldoet aan de verplichting, bedoeld in [artikel 11, eerste lid][ref1], om de school of instelling na
      inschrijving geregeld te bezoeken, zolang hij geen les of praktijktijd verzuimt anders dan op een van de gronden,
      bedoeld in [artikel 20][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel20
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '20'
        paragraaf: '4'
  - number: '14'
    text: |-
      De in [artikel 6, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat een
      jongere als leerling van een school onderscheidenlijk als vavo-student of mbo-student van een instelling staat
      ingeschreven, zolang


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: 14.a
    text: |-
      de jongere op lichamelijke of psychische gronden niet geschikt is om tot een school onderscheidenlijk een
      instelling te worden toegelaten;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel14
  - number: 14.b
    text: |-
      zij tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning – of, indien zij geen vaste
      verblijfplaats hebben, op alle binnen de openbare lichamen – gelegen scholen onderscheidenlijk instellingen waarop
      de jongere geplaatst zou kunnen worden, overwegende bedenkingen hebben;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel14
  - number: 14.c
    text: |-
      de jongere als leerling van een inrichting van onderwijs buiten een van de openbare lichamen staat ingeschreven en
      deze inrichting geregeld bezoekt.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel14
  - number: '15.1'
    text: |-
      De in [artikel 6, eerste lid][ref1], bedoelde personen kunnen zich slechts beroepen op vrijstelling, indien zij aan
      het bestuurscollege van het openbaar lichaam waar de jongere als ingezetene is ingeschreven, hebben kennis gegeven,
      voor welke jongere en op welke grond zij daarop aanspraak menen te mogen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '15.2'
    text: 'Deze kennisgeving moet worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel15
  - number: 15.2.a
    text: |-
      ten minste een maand voordat de jongere leerplichtig wordt, indien zij betrekking heeft op de aanvang van de
      leerplicht, en
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel15
  - number: 15.2.b
    text: zolang nadien aanspraak op vrijstelling wordt gemaakt, elk jaar opnieuw voor 1 juli.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel15
  - number: '15.3'
    text: |-
      Het tweede lid onder b is niet van toepassing, indien uit de in [artikel 16][ref1] bedoelde verklaring blijkt, dat
      de jongere nooit geschikt zal zijn een school onderscheidenlijk een instelling te bezoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel16
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '16'
        paragraaf: '4'
  - number: '16'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 14, onderdeel a][ref1], kan slechts worden gedaan, indien
      bij de kennisgeving een verklaring van een door het bestuurscollege van het openbaar lichaam, waar de jongere
      als ingezetene is ingeschreven, aangewezen arts – niet zijnde de behandelende arts – of van een door het
      bestuurscollege aangewezen academisch gevormde of daarmede bij ministeriële regeling gelijkgestelde pedagoog
      of psycholoog is overgelegd, waaruit blijkt, dat deze de jongere niet geschikt acht om tot een school
      onderscheidenlijk een instelling te worden toegelaten. Deze verklaring mag niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
  - number: '17.1'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 14, onderdeel b][ref1], kan slechts worden gedaan, indien de
      kennisgeving de verklaring bevat, dat tegen de richting van het onderwijs op alle binnen redelijke afstand van de
      woning – of, bij het ontbreken van een vaste verblijfplaats, op alle binnen de openbare lichamen – gelegen scholen
      onderscheidenlijk instellingen waarop de jongere geplaatst zou kunnen worden, overwegende bedenkingen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
  - number: '17.2'
    text: |-
      Deze verklaring is niet geldig, indien de jongere in het jaar, voorafgaande aan de dagtekening van de kennisgeving,
      geplaatst is geweest op een school onderscheidenlijk een instelling van de richting waartegen bedenkingen worden
      geuit.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel17
  - number: '18'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 14, onderdeel c][ref1], kan slechts worden gedaan, indien bij
      de kennisgeving een verklaring is overgelegd van het hoofd van de inrichting van onderwijs waaruit blijkt, dat de
      jongere als leerling van deze inrichting staat ingeschreven en haar geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
  - number: '19'
    text: |-
      Op aanvraag van de in [artikel 6, eerste lid][ref1], bedoelde personen wordt een jongere binnen de in
      [artikel 7, eerste lid][ref2], en [artikel 12][ref3] omschreven tijdvakken door het hoofd slechts van de lijst der
      leerlingen, vavo-studenten of mbo-studenten uitgeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel12
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '12'
        paragraaf: '3'
  - number: 19.a
    text: wegens inschrijving van de jongere op een andere school of instelling;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel19
  - number: 19.b
    text: |-
      wegens vrijstelling op een der gronden, genoemd in [artikel 14][ref1], nadat aan het hoofd gebleken is, dat aan de
      [artikelen 15 tot en met 18][ref2] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel15
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '15'
        paragraaf: '4'
  - number: 19.c
    text: |-
      wegens de vrijstelling, bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel27
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '27'
        paragraaf: '4'
  - number: '20'
    text: |-
      De in [artikel 6, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting te zorgen dat de
      jongere de school waarop hij staat ingeschreven, geregeld bezoekt, en de leerplichtige jongere die de leeftijd
      van 12 jaren heeft bereikt alsmede de jongere die kwalificatieplichtig is, zijn vrijgesteld van de verplichting de
      school of de instelling geregeld te bezoeken, indien


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: 20.a
    text: de school onderscheidenlijk de instelling is gesloten of het onderwijs is geschorst;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
  - number: 20.b
    text: |-
      bij of op grond van algemeen verbindende voorschriften het bezoeken van de school onderscheidenlijk de instelling
      is verboden;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
  - number: 20.c
    text: |-
      de jongere bij wijze van tuchtmaatregel tijdelijk de toegang tot de school onderscheidenlijk de instelling is
      ontzegd;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
  - number: 20.d
    text: de jongere wegens ziekte verhinderd is de school onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
  - number: 20.e
    text: |-
      de jongere wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging verhinderd is de school
      onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
  - number: 20.f
    text: |-
      de jongere vanwege de specifieke aard van het beroep van een van de in [artikel 6, eerste lid][ref1], bedoelde
      personen slechts buiten de schoolvakanties met hen op vakantie kan gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: 20.g
    text: |-
      de jongere door andere gewichtige omstandigheden verhinderd is de school onderscheidenlijk de instelling te
      bezoeken.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel20
  - number: '21.1'
    text: |-
      De in [artikel 6, eerste lid][ref1], bedoelde personen zijn met betrekking tot de jongere die nog niet de leeftijd
      van zes jaar heeft bereikt, voor ten hoogste 5 uren per week vrijgesteld van de verplichting om te zorgen dat deze
      de school waarop hij staat ingeschreven, geregeld bezoekt. Van een beroep op deze vrijstelling wordt mededeling
      gedaan aan het hoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Naast de vrijstelling, bedoeld in het eerste lid, kan het hoofd op aanvraag van de in
      [artikel 6, eerste lid][ref1], bedoelde personen ten behoeve van de jongere bedoeld in het eerste lid, tot ten
      hoogste 5 uren per week vrijstelling verlenen van de verplichting om te zorgen dat deze de school waarop hij staat
      ingeschreven, geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '22'
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere kan slechts worden gedaan, indien daarvan binnen twee
      dagen na het ontstaan van de verhindering aan het hoofd kennis is gegeven, zo mogelijk met opgave van de aard van
      de ziekte.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel22
  - number: '23'
    text: |-
      Een beroep op vrijstelling wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging kan
      slechts worden gedaan indien daarvan uiterlijk twee dagen vóór de verhindering aan het hoofd kennis is gegeven.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel23
  - number: '24.1'
    text: |-
      Een beroep op vrijstelling wegens vakantie van de jongere, bedoeld in [artikel 20, onder f][ref1], kan slechts
      worden gedaan indien het hoofd op aanvraag van de in [artikel 6, eerste lid][ref2], bedoelde personen verlof heeft
      verleend dat de jongere voor de duur van het verlof de school onderscheidenlijk de instelling niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '20'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Verlof als bedoeld in het eerste lid kan door het hoofd slechts eenmaal voor ten hoogste tien dagen per schooljaar
      worden verleend en kan geen betrekking hebben op de eerste twee lesweken van het schooljaar. Het verlof, bedoeld in
      de eerste volzin, kan aan de jongere die kwalificatieplichtig is slechts worden verleend tot een evenredig deel van
      het aantal dagen dat hij op grond van [artikel 13][ref1] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel13
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '13'
        paragraaf: '3'
  - number: '25'
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere, wegens vervulling van plichten voortvloeiend
      uit godsdienst of levensovertuiging wordt gedaan door middel van kennisgeving aan het hoofd door de
      in [artikel 6, eerste lid][ref1], bedoelde personen, tenzij de leerplichtige jongere of de jongere die
      kwalificatieplichtig is niet meer woonachtig is bij deze personen, in welk geval de kennisgeving wordt gedaan door
      de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '26.1'
    text: |-
      Een beroep op vrijstelling wegens andere gewichtige omstandigheden als bedoeld in [artikel 20 onder g][ref1] kan
      slechts worden gedaan, indien het hoofd op aanvraag van de in [artikel 6, eerste lid][ref2], bedoelde personen
      verlof heeft verleend, dat de jongere de school onderscheidenlijk de instelling tijdelijk niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '20'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Indien geen verlof is gevraagd, kan het hoofd alsnog verlof verlenen, indien hem binnen twee dagen na het ontstaan
      van de verhindering de redenen daarvan worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel26
  - number: '26.3'
    text: |-
      Het hoofd kan ten aanzien van dezelfde jongere wegens de in het eerste lid bedoelde omstandigheden voor ten hoogste
      tien dagen per schooljaar verlof als bedoeld in dat lid verlenen. Indien het verlof ten aanzien van dezelfde
      jongere wordt gevraagd voor meer dan tien dagen per schooljaar, besluit de ambtenaar van het openbaar lichaam
      waar de jongere woonachtig is, het hoofd gehoord. Het verlof, bedoeld in de eerste volzin, kan aan de jongere die
      kwalificatieplichtig is slechts worden verleend tot een evenredig deel van het aantal dagen dat hij op grond van
      [artikel 13][ref1] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel13
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '13'
        paragraaf: '3'
  - number: '27'
    text: |-
      In andere gevallen dan genoemd in [artikel 14][ref1] kan het bestuurscollege op grond van bijzondere omstandigheden
      vrijstelling verlenen van de in [artikel 11][ref2] opgelegde verplichtingen, indien wordt aangetoond, dat de
      jongere op andere wijze voldoende onderwijs geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel11
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
  - number: 27a
    text: |-
      Bij vertrek uit een openbaar lichaam is een leerplichtige jongere die afwezig zal zijn gedurende de tijd dat er
      onderwijs wordt gegeven, in het bezit van een verklaring waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel27a
  - number: 27a.a
    text: hem vrijstelling, ontheffing of verlof is verleend als bedoeld in deze wet, of
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel27a
  - number: 27a.b
    text: |-
      hij zich heeft uitgeschreven uit het bevolkingsregister teneinde zich buiten het desbetreffende openbaar lichaam
      te vestigen.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel27a
  - number: '28.1'
    text: |-
      Het toezicht op de naleving van deze wet anders dan door de hoofden is opgedragen aan het bestuurscollege. Het
      wijst daartoe een of meer ambtenaren aan.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
  - number: '28.2'
    text: |-
      Alvorens hun ambt te aanvaarden, leggen deze ambtenaren in handen van de gezaghebber de eed of de belofte af,
      waarvan het formulier bij ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
  - number: '28.3'
    text: |-
      Deze ambtenaren zijn bevoegd hun taak uit te oefenen ten aanzien van leerlingen, vavo-studenten of mbo-studenten
      die in een van de openbare lichamen woon- of verblijfplaats hebben.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
  - number: '28.4'
    text: 'Het bestuurscollege stelt een instructie vast voor deze ambtenaren, die ten minste bevat:'
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
  - number: 28.4.a
    text: |-
      de wijze waarop de ambtenaren aan de in de [artikelen 26, derde lid][ref1], [34][ref2] en [35][ref3] bedoelde taken
      uitvoering geven;


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel35
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '26'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '34'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '35'
        paragraaf: '5'
  - number: 28.4.b
    text: |-
      de wijze waarop de gevallen van schoolverzuim die ter kennis van het openbaar lichaam worden gebracht, worden
      behandeld;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
  - number: 28.4.c
    text: de wijze waarop de ambtenaren bij de uitvoering van hun taken overleg plegen en samenwerken met hun ambtgenoten;
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
  - number: 28.4.d
    text: |-
      de aanwijzing van de diensten en instellingen waarmee de ambtenaren bij de uitvoering van hun taken dienen samen
      te werken.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
  - number: '28.5'
    text: |-
      Deze ambtenaren zijn belast met de opsporing van de bij deze wet strafbaar gestelde feiten, onverminderd
      [artikel 184 van het Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 28a.1
    text: Het toezicht op de naleving van deze wet door de hoofden is opgedragen aan de Inspectie van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28a
  - number: 28a.2
    text: |-
      Ten behoeve van het in het eerste lid bedoelde toezicht kan de Inspectie van het onderwijs ambtenaren als bedoeld
      in [artikel 28][ref1] aanwijzen indien het bestuurscollege hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel28
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '28'
        paragraaf: '5'
  - number: 28a.3
    text: |-
      Aan de aanwijzing, bedoeld in het tweede lid, ligt een samenwerkingsovereenkomst tussen de Inspectie van het
      onderwijs en het bestuurscollege ten grondslag, waarvoor het model bij ministeriële regeling wordt vastgesteld en
      waarin in ieder geval de werkzaamheden zijn opgenomen die door deze ambtenaren worden verricht.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28a
  - number: 28a.4
    text: |-
      Indien toepassing is gegeven aan het tweede lid, treft het bestuurscollege maatregelen om te voorkomen dat de
      aangewezen ambtenaren taken verrichten ten behoeve van het toezicht, bedoeld in [artikel 28][ref1], met betrekking
      tot de scholen of instellingen waarop hij als aangewezen ambtenaar toezicht houdt. De instructie, bedoeld in
      artikel 28, vierde lid, is niet van toepassing voor zover het de werkzaamheden van de aangewezen ambtenaren
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel28
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '28'
        paragraaf: '5'
  - number: 28a.5
    text: |-
      De ambtenaren, bedoeld in het tweede lid, zijn niet bevoegd om namens de minister een bestuurlijke boete op te
      leggen als bedoeld in [artikel 39][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel39
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '39'
        paragraaf: '6'
  - number: '29.1'
    text: |-
      Ambtenaren als bedoeld in [artikel 28][ref1], tonen bij de uitvoering van hun taak op verzoek van belanghebbenden
      hun legitimatiebewijs. Deze ambtenaren hebben toegang tot scholen en tot andere plaatsen, niet zijnde woningen,
      voor zover dat redelijkerwijs nodig is voor de uitvoering van hun taak, en kunnen zich indien nodig met behulp van
      de ambtenaren, genoemd in [artikel 36][ref2], toegang verschaffen. Deze ambtenaren kunnen zich doen vergezellen van
      door hen aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel36
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '28'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '36'
        paragraaf: '5'
  - number: '29.2'
    text: |-
      Een ieder is verplicht deze ambtenaren medewerking te verlenen door hun aanwijzingen te volgen, de door hen
      gevraagde inlichtingen volledig en naar waarheid te verstrekken en de benodigde bijstand te verstrekken, een en
      ander voor zover die medewerking redelijkerwijs nodig is bij de uitvoering van hun toezichthoudende taak.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel29
  - number: 29a.1
    text: |-
      Onverminderd het bepaalde in [artikel 28][ref1] kunnen ambtenaren belast met de grensbewaking, bedoeld in de
      [Wet toelating en uitzetting BES][ref2], indien er ernstige twijfel bestaat of er wordt voldaan aan de verplichting
      de school of de instelling geregeld te bezoeken, bij vertrek van een openbaar lichaam van een jongere op wie
      [artikel 6][ref3] of [11][ref4] van toepassing is, eisen dat deze de verklaring, bedoeld in [artikel 27a][ref5],
      toont.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028571
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0030281#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0030281#Artikel27a
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '28'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0028571
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0030281
        artikel: 27a
        paragraaf: '4'
  - number: 29a.2
    text: |-
      De ambtenaar, bedoeld in het eerste lid, belet de jongere die niet over de in het eerste lid bedoelde verklaring
      beschikt, de toegang tot luchtvaartuigen of schepen.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel29a
  - number: 29a.3
    text: |-
      De ambtenaar, bedoeld in het eerste lid, stelt de ambtenaar, bedoeld in [artikel 28][ref1], zo spoedig mogelijk in
      kennis van een beslissing als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel28
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '28'
        paragraaf: '5'
  - number: '30'
    text: |-
      Gemeenschappelijke regelingen op de openbare lichamen betreffende het toezicht op de naleving van deze wet, alsmede
      wijziging of intrekking daarvan, worden mede ter kennis gebracht van Onze Minister en van de openbare lichamen die
      bij de regeling zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel30
  - number: '31.1'
    text: |-
      De hoofden geven aan het bestuurscollege binnen zeven dagen kennis van de in- en uitschrijving van leerlingen,
      vavo-studenten of mbo-studenten ten aanzien van wie deze wet van toepassing is. Een beslissing tot verwijdering van
      een leerling, vavo-student of mbo-student wordt terstond gemeld.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel31
  - number: '31.2'
    text: |-
      Indien de jongere geen volledig onderwijsprogramma volgt, geeft het hoofd van een instelling
      aan het bestuurscollege bericht van het programma van de combinatie leren en werken, bedoeld in
      [artikel 13, eerste lid][ref1], dat door de jongere wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel13
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '13'
        paragraaf: '3'
  - number: '31.3'
    text: |-
      De hoofden geven aan het bestuurscollege en aan de ambtenaar alle inlichtingen die deze in verband met de
      uitvoering van deze wet verlangen.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel31
  - number: '31.4'
    text: |-
      In de kennisgeving, bedoeld in het eerste lid, en in de mededeling, bedoeld in het tweede lid, vermeldt het hoofd
      zo mogelijk het persoonsgebonden nummer BES van de jongere.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel31
  - number: '31.5'
    text: |-
      Indien het bestuurscollege van het openbaar lichaam waar de leerling, vavo-student of mbo-student woon- of
      verblijfplaats heeft zijn bevoegdheden op grond van deze wet heeft ondergebracht in een gemeenschappelijke
      regeling als bedoeld in [artikel 124, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], vindt de
      informatieverstrekking door de hoofden, bedoeld in dit artikel, plaats aan het orgaan dat daartoe volgens die
      gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel124
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '124'
  - number: '32'
    text: |-
      Het bestuurscollege controleert of de jongeren die als ingezetene zijn ingeschreven en nog leerplichtig of
      kwalificatieplichtig zijn, overeenkomstig de bepalingen van deze wet als leerling, vavo-student of mbo-student
      staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel32
  - number: '33.1'
    text: |-
      Indien een ingeschreven leerling van een school ten aanzien van wie deze wet van toepassing is zonder geldige
      reden les- of praktijktijd heeft verzuimd en dit verzuim gedurende een periode van vier opeenvolgende lesweken meer
      dan zestien uren les- of praktijktijd bedraagt, geeft het hoofd van de school hiervan onverwijld kennis aan het
      bestuurscollege van het openbaar lichaam waar de leerling woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel33
  - number: '33.2'
    text: |-
      Indien een ingeschreven mbo-student of vavo-student van een instelling ten aanzien van wie deze wet van toepassing
      is zonder geldige reden gedurende een periode van vier opeenvolgende lesweken in totaal zestien uren van de
      lestijd heeft verzuimd, geeft het hoofd van de instelling hiervan onverwijld kennis aan het bestuurscollege van het
      openbaar lichaam waar de mbo-student of vavo-student woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel33
  - number: '33.3'
    text: |-
      In de kennisgeving, bedoeld in het eerste en tweede lid, vermeldt het hoofd zo mogelijk het persoonsgebonden nummer
      BES van de jongere.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel33
  - number: '33.4'
    text: |-
      Indien het bestuurscollege van het openbaar lichaam waar de leerling, vavo-student of mbo-student woon- of
      verblijfplaats heeft zijn bevoegdheden op grond van deze wet heeft ondergebracht in een gemeenschappelijke regeling
      als bedoeld in [artikel 124, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], vindt de kennisgeving,
      bedoeld in het eerste of tweede lid, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling
      is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel124
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '124'
  - number: '34.1'
    text: |-
      Indien blijkt, dat een leerplichtige of kwalificatieplichtige jongere niet als leerling, vavo-student of mbo-
      student staat ingeschreven, zonder dat een grond voor vrijstelling aanwezig is, of indien een kennisgeving is
      ontvangen als bedoeld in [artikel 33][ref1] stelt de ambtenaar vanwege het bestuurscollege een onderzoek in. Hij
      hoort de in [artikel 6, eerste lid][ref2], bedoelde personen en tracht hen ertoe te bewegen hun verplichtingen na
      te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '33'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '34.2'
    text: |-
      Blijkt aan de ambtenaar dat de in [artikel 6, eerste lid][ref1], bedoelde personen weigeren de jongere als leerling
      van een school onderscheidenlijk als mbo-student of vavo-student bij een instelling te laten inschrijven, zonder
      dat zij op grond van [artikel 14][ref2] of [27][ref3] van deze verplichting zijn vrijgesteld, of dat zij niet
      zorgen, dat de leerplichtige jongere de school of de jongere die kwalificatieplichtig is de school of instelling
      geregeld bezoekt, zonder dat zij op grond van [artikel 20][ref4] van deze verplichting zijn vrijgesteld, dan zendt
      hij proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0030281#Artikel20
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '27'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0030281
        artikel: '20'
        paragraaf: '4'
  - number: '34.3'
    text: |-
      Blijkt aan de ambtenaar, dat de leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere die
      kwalificatieplichtig is het onderwijs aan de school of aan de instelling niet geregeld volgt zonder dat de jongere
      op grond van [artikel 20][ref1] van deze verplichting is vrijgesteld, dan hoort hij de jongere en tracht hem ertoe
      te bewegen zijn verplichtingen na te komen. Indien blijkt dat de leerplichtige jongere die de leeftijd van 12
      jaren heeft bereikt, of de jongere die kwalificatieplichtig is, weigert deze verplichtingen na te komen, zendt de
      ambtenaar proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel20
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '20'
        paragraaf: '4'
  - number: '34.4'
    text: |-
      Indien een onderwijsvoorziening niet langer een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1], onderzoekt de ambtenaar binnen vier weken nadat de ouders hiervan
      op de hoogte zijn gesteld, of de in [artikel 6, eerste lid][ref2], bedoelde personen de jongere bij een school
      hebben ingeschreven dan wel of een grond voor vrijstelling aanwezig is. Indien geen sprake is van een inschrijving
      bij een school dan wel een vrijstelling als bedoeld in [artikel 14][ref3] of [27][ref4], wijst hij onverwijld de
      in artikel 6, eerste lid, bedoelde personen op de verplichting, bedoeld in dat artikel. Indien de jongere niet
      binnen vier weken nadat de ambtenaar de in de vorige volzin bedoelde personen op hun verplichting heeft gewezen
      op een school staat ingeschreven en geen sprake is van een vrijstelling als bedoeld in artikel 14 of 27, zendt de
      ambtenaar proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0030281#Artikel27
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0030281
        artikel: '27'
        paragraaf: '4'
  - number: '34.5'
    text: |-
      Indien de in [artikel 6, eerste lid][ref1], bedoelde personen reeds eerder zijn veroordeeld wegens het niet nakomen
      van de verplichtingen, opgelegd in artikel 6, eerste lid, of [artikel 11][ref2], zendt de ambtenaar een afschrift
      van het proces-verbaal aan de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel11
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
  - number: '35'
    text: |-
      Indien aan het hoofd of aan de ambtenaar blijkt, dat een jongere in strijd met de ter zake geldende voorschriften
      arbeid verricht, geven zij hiervan terstond kennis aan een daartoe door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen onder hem ressorterende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel35
  - number: '36'
    text: |-
      Ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, zijn bevoegd een jongere die zij onder
      schooltijd op een voor het publiek toegankelijke plaats aantreffen, te brengen naar het hoofd van de school waarop
      de jongere als leerling staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel36
  - number: '37.1'
    text: |-
      Het bestuurscollege brengt jaarlijks vóór 1 oktober verslag uit aan de eilandsraad over het in het laatst
      afgesloten school- of cursusjaar in het openbaar lichaam gevoerde beleid inzake de handhaving van de leerplicht en
      de kwalificatieplicht en de resultaten daarvan.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel37
  - number: '37.2'
    text: |-
      Het bestuurscollege doet jaarlijks een opgave aan Onze Minister van de omvang en behandeling van het aan hem
      gemelde schoolverzuim in het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel37
  - number: '37.3'
    text: |-
      Het hoofd doet jaarlijks een opgave aan Onze Minister van de omvang van het schoolverzuim aan zijn school of
      instelling.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel37
  - number: '38.1'
    text: |-
      De in [artikel 6, eerste lid][ref1], bedoelde personen die de in artikel 6, eerste lid, of [artikel 11][ref2]
      opgelegde verplichtingen niet nakomen, worden gestraft met hechtenis van ten hoogste een maand of geldboete van de
      tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel11
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
  - number: '38.2'
    text: |-
      De leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere die kwalificatieplichtig is, die
      de verplichting tot geregeld volgen van het onderwijs niet nakomt, wordt gestraft met een hoofdstraf als genoemd
      in [artikel 9, tweede lid, van het Wetboek van Strafrecht BES][ref1], met dien verstande dat de geldboete een
      geldboete van de tweede categorie is.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel9
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '9'
  - number: '39'
    text: |-
      Onze Minister kan een bestuurlijke boete van ten hoogste USD 1300 per overtreding, met een maximum van USD 130 000
      per schooljaar, opleggen aan het hoofd dat:
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel39
  - number: 39.a
    text: |-
      in strijd handelt met [artikel 24, tweede lid][ref1], of [artikel 26, derde lid, eerste volzin][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel26
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '24'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '26'
        paragraaf: '4'
  - number: 39.b
    text: |-
      niet voldoet aan een der verplichtingen, opgelegd in de [artikelen 31][ref1] of [33][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel33
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '31'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '33'
        paragraaf: '5'
  - number: 39.c
    text: bij de uitvoering van deze wet onjuiste of onvolledige inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel39
  - number: '40'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel40
  - number: '41.1'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven voor de uitvoering van deze wet en worden de modellen
      vastgesteld van de kennisgevingen en mededelingen, bedoeld in de [artikelen 15][ref1], [31][ref2], [33][ref3] en
      [37, tweede en derde lid][ref4]. Bij deze regeling kan tevens worden bepaald dat de in artikel 37, tweede of derde
      lid, bedoelde opgave niet wordt gedaan aan Onze Minister maar aan het Centraal Bureau voor de Statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0030281#Artikel37
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '31'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '33'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0030281
        artikel: '37'
        paragraaf: '5'
  - number: '41.2'
    text: |-
      De formulieren van de kennisgevingen en mededelingen, bedoeld in de [artikelen 15][ref1], [31][ref2]
      en [33][ref3] zijn voor de belanghebbenden kosteloos op het bestuurskantoor van het openbaar lichaam
      verkrijgbaar. De formulieren voor de opgaven van gegevens ten behoeve van statistisch onderzoek als bedoeld in
      [artikel 37, tweede en derde lid][ref4] worden door het Rijk verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0030281#Artikel37
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '31'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '33'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0030281
        artikel: '37'
        paragraaf: '5'
  - number: '42.1'
    text: |-
      Ontheffingen en vrijstellingen die krachtens de Leerplichtlandsverordening of krachtens de Leerplichtwet BES zoals
      die wet op 10 oktober 2010 is komen te luiden, zijn verleend, worden geacht te zijn verleend krachtens deze wet
      voor de resterende duur waarvoor zij werden verleend.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel42
  - number: '42.2'
    text: |-
      Verzoeken die op grond van artikel 4 van de Leerplichtlandsverordening zoals luidend op 9 oktober 2010 of op grond
      van artikel 4 van de Leerplichtwet BES, zoals dat artikel op 10 oktober 2010 is komen te luiden, zijn gedaan en
      waarop op die dag nog niet is beslist, worden afgehandeld met inachtneming van de regels die bij of krachtens de
      Leerplichtlandsverordening zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel42
  - number: '43'
    text: |-
      Een school die op 9 oktober 2010 was aangemerkt als een niet bekostigde school, wordt met ingang
      van de datum van inwerkingtreding van dit artikel aangemerkt als een school als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
        paragraaf: '1'
  - number: 43a
    text: |-
      De [artikelen 3][ref1] en [5][ref2] die niet bij Besluit van 3 februari 2011, houdende vaststelling van het
      tijdstip van inwerkingtreding van een aantal onderdelen van de Aanpassingswet openbare lichamen Bonaire, Sint
      Eustatius en Saba (Stb. 2011, 34) in werking zijn getreden, treden in werking op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan, verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel5
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '5'
        paragraaf: '1'
  - number: '44'
    text: 'Deze wet wordt aangehaald als: Leerplichtwet BES.'
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel44
