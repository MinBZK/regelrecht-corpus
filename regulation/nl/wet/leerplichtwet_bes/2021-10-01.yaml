      persoonsgegevens van het openbaar lichaam dan wel het door Onze Minister uitgegeven onderwijsnummer.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel1
  - number: '2.1'
    text: 'Bij ministeriële regeling dan wel bij beschikking van Onze Minister kunnen:'
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel2
  - number: 2.1.a
    text: |-
      onderwijsinstellingen dan wel groepen daarvan worden aangewezen als school bedoeld in
      [artikel 1, onderdeel b subonderdeel 4][ref1],


