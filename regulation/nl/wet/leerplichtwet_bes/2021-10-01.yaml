    text: |-
      cursussen of instellingen waar onderwijs of vorming wordt gegeven dan wel groepen daarvan worden aangewezen als
      instelling bedoeld in [artikel 1, onderdeel c, subonderdeel 2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel2
    references:
