        paragraaf: '1'
  - number: '2.2'
    text: |-
      Onze Minister kan de aanwijzing intrekken indien het hoofd of het personeel van de school of instelling niet binnen
      de door hem gestelde redelijke termijn alle medewerking verleent die Onze Minister redelijkerwijs kan vorderen bij
      de uitoefening van zijn bevoegdheden. Indien het hoofd of het personeel van de school of instelling uit hoofde van
      ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen zij het verlenen van medewerking
      weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd [titel I van de Wet primair onderwijs BES][ref1] en
      [titel I van de Wet voortgezet onderwijs BES][ref2], moet een school als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0030280
      [ref2]: https://wetten.overheid.nl/BWBR0030284
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030280
      - id: ref2
        bwb_id: BWBR0030284
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '1'
        paragraaf: '1'
  - number: 3.1.a
    text: |-
      wat de inrichting van het basisonderwijs betreft, voldoen aan de criteria, bedoeld in de
      [artikelen 10, eerste, tweede, derde, lid 3a, vijfde, zesde lid onderdeel a, zevende en achtste lid][ref1],
      [11][ref2], [12][ref3] en [13, eerste volzin, van de Wet primair onderwijs BES][ref4], en tevens heeft de school
      een schoolplan dat ten minste een beschrijving bevat van het beleid inzake het onderwijs, bedoeld in artikel 10,
      derde lid, van genoemde wet;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel13
    url: https://wetten.overheid.nl/BWBR0030281/2021-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0030280
        artikel: '13'
  - number: 3.1.b
    text: |-
      wat de inrichting van het voortgezet onderwijs betreft, voldoen aan de criteria, bedoeld in de [artikelen 8][ref1],
      [42][ref2] en [47, eerste volzin, van de Wet voortgezet onderwijs BES][ref3], en tevens heeft de school
      een schoolplan dat ten minste een beschrijving bevat van het beleid inzake het onderwijs, bedoeld in
      [artikel 42 van genoemde wet][ref4] en besteedt het onderwijs binnen de eerste twee leerjaren van het voortgezet
      onderwijs aantoonbaar aandacht aan de kerndoelen, bedoeld in [artikel 34 van genoemde wet][ref5], en aansluitend
      aan de kerndoelen als onderwijsprogramma voor de eerste twee leerjaren, stelt het onderwijs de leerlingen
      aantoonbaar in staat om hun onderwijsloopbaan voort te zetten in het vervolgonderwijs op een niveau dat van de
      leerling verwacht mag worden.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel34
