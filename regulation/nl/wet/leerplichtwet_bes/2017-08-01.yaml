  - number: '13'
    text: |-
      1 De jongere die als leerling of deelnemer van een school of instelling staat ingeschreven
      op grond van [artikel 11, eerste lid][ref1], is verplicht het volledige onderwijsprogramma ,
      het volledige programma van de combinatie leren en werken, het onderwijsprogramma, bedoeld in
      [artikel 62, derde lid, onderdeel d, van de Wet voortgezet onderwijs BES][ref2], respectievelijk het
      onderwijsprogramma, bedoeld in [artikel 114a, derde lid, onderdeel d, van de Wet voortgezet onderwijs BES][ref3],
      te volgen dat door die school of instelling wordt aangeboden.

      2 De jongere voldoet aan de verplichting, bedoeld in [artikel 11, eerste lid][ref4], om de school of instelling na
      inschrijving geregeld te bezoeken, zolang hij geen les of praktijktijd verzuimt anders dan op een van de gronden,
      bedoeld in [artikel 20][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel114a
