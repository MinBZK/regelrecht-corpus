  - number: '3'
    text: |-
      1 Onverminderd [titel I van de Wet primair onderwijs BES][ref1] en
      [titel I van de Wet voortgezet onderwijs BES][ref2], moet een school als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref3],

      a. wat de inrichting van het basisonderwijs betreft, voldoen aan de criteria, bedoeld in de
      [artikelen 10, eerste, tweede, derde, vijfde, zesde lid onderdeel a, zevende en achtste lid][ref4], [11][ref5],
      [12][ref6] en [13, eerste volzin, van de Wet primair onderwijs BES][ref7], en tevens heeft de school een schoolplan
      dat ten minste een beschrijving bevat van het beleid inzake het onderwijs, bedoeld in artikel 10, derde lid, van
      genoemde wet;

      b. wat de inrichting van het voortgezet onderwijs betreft, voldoen aan de criteria, bedoeld in de
      [artikelen 8][ref8] en [47, eerste volzin, van de Wet voortgezet onderwijs BES][ref9], en tevens heeft de
      school een schoolplan dat ten minste een beschrijving bevat van het beleid inzake het onderwijs, bedoeld in
      [artikel 42 van genoemde wet][ref10] en besteedt het onderwijs binnen de eerste twee leerjaren van het voortgezet
      onderwijs aantoonbaar aandacht aan de kerndoelen, bedoeld in [artikel 34 van genoemde wet][ref11], en aansluitend
      aan de kerndoelen als onderwijsprogramma voor de eerste twee leerjaren, stelt het onderwijs de leerlingen
      aantoonbaar in staat om hun onderwijsloopbaan voort te zetten in het vervolgonderwijs op een niveau dat van de
      leerling verwacht mag worden.

      2 Het bestuurscollege volgt bij zijn oordeel of een onderwijsvoorziening een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref12], een door de inspectie ter zake gegeven besluit.

      3 Indien Onze Minister naar aanleiding van een melding als bedoeld in artikel 14 van de Wet op het
      onderwijstoezicht besluit dat een school niet langer voldoet aan de criteria die gelden voor een school als bedoeld
      in [artikel 1, onderdeel b, subonderdeel 3][ref13], dan volgt het bestuurscollege van het openbaar lichaam waarin
      de school is gevestigd dit besluit en oordeelt het dat de school niet langer een school is als bedoeld in artikel
      1, onderdeel b, subonderdeel 3.

      4 Indien het besluit, bedoeld in het derde lid, daartoe aanleiding geeft, stelt het bestuurscollege de ouders
      van de leerlingen van de onderwijsvoorziening binnen 7 dagen schriftelijk op de hoogte van het feit dat de
      onderwijsvoorziening niet langer een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref14], of
      verzekert het er zich van dat de onderwijsvoorziening de ouders daarvan op de hoogte heeft gesteld.


