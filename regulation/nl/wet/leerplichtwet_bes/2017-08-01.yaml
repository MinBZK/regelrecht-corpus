  - number: '30'
    text: |-
      Gemeenschappelijke regelingen op de openbare lichamen betreffende het toezicht op de naleving van deze wet, alsmede
      wijziging of intrekking daarvan, worden mede ter kennis gebracht van Onze Minister en van de openbare lichamen die
      bij de regeling zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel30
  - number: '31'
    text: |-
      1 De hoofden geven aan het bestuurscollege binnen zeven dagen kennis van de in- en afschrijving van leerlingen ten
      aanzien van wie deze wet van toepassing is. Een beslissing tot verwijdering van een leerling wordt terstond gemeld.

      2 Indien de jongere geen volledig onderwijsprogramma volgt, geeft het hoofd van een instelling
      aan het bestuurscollege bericht van het programma van de combinatie leren en werken, bedoeld in
      [artikel 13, eerste lid][ref1], dat door de jongere wordt gevolgd.

      3 De hoofden geven aan het bestuurscollege en aan de ambtenaar alle inlichtingen die deze in verband met de
      uitvoering van deze wet verlangen.

      4 In de kennisgeving, bedoeld in het eerste lid, en in de mededeling, bedoeld in het tweede lid, vermeldt het hoofd
      zo mogelijk het persoonsgebonden nummer BES van de jongere.

      5 Indien het bestuurscollege van het openbaar lichaam waar de leerling woon- of verblijfplaats heeft zijn
      bevoegdheden op grond van deze wet heeft ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 124, eerste lid, van de Wet gemeenschappelijke regelingen][ref2], vindt de informatieverstrekking door
      de hoofden, bedoeld in dit artikel, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel124
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '124'
  - number: '32'
    text: |-
      Het bestuurscollege controleert of de jongeren die als ingezetene zijn ingeschreven en nog leerplichtig of
      kwalificatieplichtig zijn, overeenkomstig de bepalingen van deze wet als leerling of deelnemer staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel32
  - number: '33'
    text: |-
      1 Indien een ingeschreven leerling van een school ten aanzien van wie deze wet van toepassing is zonder geldige
      reden les- of praktijktijd heeft verzuimd en dit verzuim gedurende een periode van vier opeenvolgende lesweken meer
      dan zestien uren les- of praktijktijd bedraagt, geeft het hoofd van de school hiervan onverwijld kennis aan het
      bestuurscollege van het openbaar lichaam waar de leerling woon- of verblijfplaats heeft.

      2 Indien een ingeschreven leerling van een instelling ten aanzien van wie deze wet van toepassing is zonder geldige
      reden gedurende een periode van vier opeenvolgende lesweken in totaal zestien uren van de lestijd heeft verzuimd,
      geeft het hoofd van de instelling hiervan onverwijld kennis aan het bestuurscollege van het openbaar lichaam waar
      de leerling woon- of verblijfplaats heeft.

      3 In de kennisgeving, bedoeld in het eerste en tweede lid, vermeldt het hoofd zo mogelijk het persoonsgebonden
      nummer BES van de jongere.

      4 Indien het bestuurscollege van het openbaar lichaam waar de leerling woon- of verblijfplaats heeft zijn
      bevoegdheden op grond van deze wet heeft ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 124, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], vindt de kennisgeving, bedoeld in het
      eerste of tweede lid, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel124
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '124'
  - number: '34'
    text: |-
      1 Indien blijkt, dat een leerplichtige of kwalificatieplichtige jongere niet als leerling of deelnemer staat
      ingeschreven, zonder dat een grond voor vrijstelling aanwezig is, of indien een kennisgeving is ontvangen als
      bedoeld in [artikel 33][ref1] stelt de ambtenaar vanwege het bestuurscollege een onderzoek in. Hij hoort de in
      [artikel 6, eerste lid][ref2], bedoelde personen en tracht hen ertoe te bewegen hun verplichtingen na te komen.

      2 Blijkt aan de ambtenaar dat de in [artikel 6, eerste lid][ref3], bedoelde personen weigeren de jongere als
      leerling van een school onderscheidenlijk als deelnemer bij een instelling te laten inschrijven, zonder dat zij op
      grond van [artikel 14][ref4] of [27][ref5] van deze verplichting zijn vrijgesteld, of dat zij niet zorgen, dat de
      leerplichtige jongere de school of de jongere die kwalificatieplichtig is de school of instelling geregeld bezoekt,
      zonder dat zij op grond van [artikel 20][ref6] van deze verplichting zijn vrijgesteld, dan zendt hij proces-verbaal
      van zijn bevindingen aan de officier van justitie.

      3 Blijkt aan de ambtenaar, dat de leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere
      die kwalificatieplichtig is het onderwijs aan de school of aan de instelling niet geregeld volgt zonder dat de
      jongere op grond van [artikel 20][ref7] van deze verplichting is vrijgesteld, dan hoort hij de jongere en tracht
      hem ertoe te bewegen zijn verplichtingen na te komen. Indien blijkt dat de leerplichtige jongere die de leeftijd
      van 12 jaren heeft bereikt, of de jongere die kwalificatieplichtig is, weigert deze verplichtingen na te komen,
      zendt de ambtenaar proces-verbaal van zijn bevindingen aan de officier van justitie.

      4 Indien een onderwijsvoorziening niet langer een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref8], onderzoekt de ambtenaar binnen vier weken nadat de ouders hiervan
      op de hoogte zijn gesteld, of de in [artikel 6, eerste lid][ref9], bedoelde personen de jongere bij een school
      hebben ingeschreven dan wel of een grond voor vrijstelling aanwezig is. Indien geen sprake is van een inschrijving
      bij een school dan wel een vrijstelling als bedoeld in [artikel 14][ref10] of [27][ref11], wijst hij onverwijld
      de in artikel 6, eerste lid, bedoelde personen op de verplichting, bedoeld in dat artikel. Indien de jongere niet
      binnen vier weken nadat de ambtenaar de in de vorige volzin bedoelde personen op hun verplichting heeft gewezen
      op een school staat ingeschreven en geen sprake is van een vrijstelling als bedoeld in artikel 14 of 27, zendt de
      ambtenaar proces-verbaal van zijn bevindingen aan de officier van justitie.

      5 Indien de in [artikel 6, eerste lid][ref12], bedoelde personen reeds eerder zijn veroordeeld wegens het niet
      nakomen van de verplichtingen, opgelegd in artikel 6, eerste lid, of [artikel 11][ref13], zendt de ambtenaar een
      afschrift van het proces-verbaal aan de raad voor de kinderbescherming.


