  - number: '10'
    text: |-
      1 De verplichting om te zorgen, dat een jongere de school waar hij als leerling staat ingeschreven, geregeld
      bezoekt, begint op de dag waarop hij na inschrijving op die school kan plaats nemen en eindigt tegelijk met de
      verplichting om te zorgen dat hij als leerling van een school staat ingeschreven.

      2 Het schoolbezoek vindt geregeld plaats zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel10
  - number: '11'
    text: |-
      1 De in [artikel 6, eerste lid][ref1], bedoelde personen zijn verplicht te zorgen dat de jongere overeenkomstig
      de bepalingen van deze paragraaf staat ingeschreven als leerling of deelnemer bij een school of instelling die
      volledig onderwijs, een bij de wet geregelde combinatie van leren en werken, een onderwijsprogramma als bedoeld in
      [artikel 62, derde lid, onderdeel d, van de Wet voortgezet onderwijs BES][ref2], dan wel een onderwijsprogramma als
      bedoeld in [artikel 114a, derde lid, onderdeel d, van de Wet voortgezet onderwijs BES][ref3] verzorgt en dat hij
      deze school of instelling na inschrijving geregeld bezoekt, als:

      a. ten aanzien van de jongere de leerplicht, bedoeld in [paragraaf 2][ref4], is geëindigd, en

      b. de jongere geen startkwalificatie heeft behaald.

      2 De verplichting, bedoeld in het eerste lid, geldt niet ten aanzien van jongeren die in
      het bezit zijn van een getuigschrift of een schooldiploma praktijkonderwijs als bedoeld in
      [artikel 73 van de Wet voortgezet onderwijs BES][ref5].

      3 [Artikel 6, tweede lid][ref6], is van overeenkomstige toepassing ten aanzien van de verplichtingen, bedoeld in
      het eerste lid.

      4 Als de inschrijving, bedoeld in het eerste lid, plaats vindt aan een andere school of instelling dan daarvoor
      door de jongere werd bezocht, wordt bij de inschrijving een van overheidswege verstrekt document of een bewijs
      van uitschrijving van een andere school of instelling overgelegd waarop de gegevens van de jongere betreffende
      zijn geslachtsnaam, voorletters, geboortedatum, geslacht en persoonsgebonden nummer BES zijn vermeld. Als de
      in [artikel 6, eerste lid][ref7], bedoelde personen bij de inschrijving aannemelijk hebben gemaakt dat zij geen
      persoonsgebonden nummer BES van de jongere kunnen overleggen, leggen zij het persoonsgebonden nummer BES van de
      jongere over aan de school zodra zij daarvan kennis hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel62
