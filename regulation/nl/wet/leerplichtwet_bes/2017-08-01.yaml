  - number: '14'
    text: |-
      De in [artikel 6, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat een
      jongere als leerling van een school onderscheidenlijk een instelling staat ingeschreven, zolang

      a. de jongere op lichamelijke of psychische gronden niet geschikt is om tot een school onderscheidenlijk een
      instelling te worden toegelaten;

      b. zij tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning – of, indien zij geen
      vaste verblijfplaats hebben, op alle binnen de openbare lichamen – gelegen scholen onderscheidenlijk instellingen
      waarop de jongere geplaatst zou kunnen worden, overwegende bedenkingen hebben;

      c. de jongere als leerling van een inrichting van onderwijs buiten een van de openbare lichamen staat ingeschreven
      en deze inrichting geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '15'
    text: |-
      1 De in [artikel 6, eerste lid][ref1], bedoelde personen kunnen zich slechts beroepen op vrijstelling, indien zij
      aan het bestuurscollege van het openbaar lichaam waar de jongere als ingezetene is ingeschreven, hebben kennis
      gegeven, voor welke jongere en op welke grond zij daarop aanspraak menen te mogen maken.

      2 Deze kennisgeving moet worden ingediend:

      a. ten minste een maand voordat de jongere leerplichtig wordt, indien zij betrekking heeft op de aanvang van de
      leerplicht, en

      b. zolang nadien aanspraak op vrijstelling wordt gemaakt, elk jaar opnieuw voor 1 juli.

      3 Het tweede lid onder b is niet van toepassing, indien uit de in [artikel 16][ref2] bedoelde verklaring blijkt,
      dat de jongere nooit geschikt zal zijn een school onderscheidenlijk een instelling te bezoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel16
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '16'
        paragraaf: '4'
  - number: '16'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 14, onderdeel a][ref1], kan slechts worden gedaan, indien
      bij de kennisgeving een verklaring van een door het bestuurscollege van het openbaar lichaam, waar de jongere
      als ingezetene is ingeschreven, aangewezen arts – niet zijnde de behandelende arts – of van een door het
      bestuurscollege aangewezen academisch gevormde of daarmede bij ministeriële regeling gelijkgestelde pedagoog
      of psycholoog is overgelegd, waaruit blijkt, dat deze de jongere niet geschikt acht om tot een school
      onderscheidenlijk een instelling te worden toegelaten. Deze verklaring mag niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
  - number: '17'
    text: |-
      1 Een beroep op vrijstelling op grond van [artikel 14, onderdeel b][ref1], kan slechts worden gedaan, indien de
      kennisgeving de verklaring bevat, dat tegen de richting van het onderwijs op alle binnen redelijke afstand van de
      woning – of, bij het ontbreken van een vaste verblijfplaats, op alle binnen de openbare lichamen – gelegen scholen
      onderscheidenlijk instellingen waarop de jongere geplaatst zou kunnen worden, overwegende bedenkingen bestaan.

      2 Deze verklaring is niet geldig, indien de jongere in het jaar, voorafgaande aan de dagtekening van de
      kennisgeving, geplaatst is geweest op een school onderscheidenlijk een instelling van de richting waartegen
      bedenkingen worden geuit.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
  - number: '18'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 14, onderdeel c][ref1], kan slechts worden gedaan, indien bij
      de kennisgeving een verklaring is overgelegd van het hoofd van de inrichting van onderwijs waaruit blijkt, dat de
      jongere als leerling van deze inrichting staat ingeschreven en haar geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
  - number: '19'
    text: |-
      Op aanvraag van de in [artikel 6, eerste lid][ref1], bedoelde personen wordt een jongere binnen de in
      [artikel 7, eerste lid][ref2], en [artikel 12][ref3] omschreven tijdvakken door het hoofd slechts van de lijst der
      leerlingen of deelnemers afgevoerd

      a. wegens inschrijving van de jongere op een andere school of instelling;

      b. wegens vrijstelling op een der gronden, genoemd in [artikel 14][ref4], nadat aan het hoofd gebleken is, dat aan
      de [artikelen 15 tot en met 18][ref5] is voldaan;

      c. wegens de vrijstelling, bedoeld in [artikel 27][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0030281#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0030281#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0030281#Artikel27
