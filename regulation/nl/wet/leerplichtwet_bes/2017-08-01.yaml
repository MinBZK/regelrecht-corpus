  - number: 43a
    text: |-
      De [artikelen 3][ref1] en [5][ref2] die niet bij Besluit van 3 februari 2011, houdende vaststelling van het
      tijdstip van inwerkingtreding van een aantal onderdelen van de Aanpassingswet openbare lichamen Bonaire, Sint
      Eustatius en Saba (Stb. 2011, 34) in werking zijn getreden, treden in werking op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan, verschillend kan worden vastgesteld.


