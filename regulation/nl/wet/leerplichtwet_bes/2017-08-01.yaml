  - number: '2'
    text: |-
      1 Bij ministeriële regeling dan wel bij beschikking van Onze Minister kunnen:

      a. onderwijsinstellingen dan wel groepen daarvan worden aangewezen als school bedoeld in
      [artikel 1, onderdeel b subonderdeel 4][ref1], en

      b. cursussen of instellingen waar onderwijs of vorming wordt gegeven dan wel groepen daarvan worden aangewezen als
      instelling bedoeld in [artikel 1, onderdeel c, subonderdeel 2][ref2].

      Aan de aanwijzing kunnen voorwaarden worden verbonden.

      2 Onze Minister kan de aanwijzing intrekken indien het hoofd of het personeel van de school of instelling niet
      binnen de door hem gestelde redelijke termijn alle medewerking verleent die Onze Minister redelijkerwijs kan
      vorderen bij de uitoefening van zijn bevoegdheden. Indien het hoofd of het personeel van de school of instelling
      uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen zij het verlenen van
      medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel1
