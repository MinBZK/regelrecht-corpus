  - number: '39'
    text: |-
      Onze minister kan een bestuurlijke boete van ten hoogste USD 1300 per overtreding, met een maximum van USD 130 000
      per schooljaar, opleggen aan het hoofd dat:

      a. in strijd handelt met [artikel 24, tweede lid][ref1], of [artikel 26, derde lid, eerste volzin][ref2],

      b. niet voldoet aan een der verplichtingen, opgelegd in de [artikelen 31][ref3] of [33][ref4], of

      c. bij de uitvoering van deze wet onjuiste of onvolledige inlichtingen verstrekt.


