  - number: '35'
    text: |-
      Indien aan het hoofd of aan de ambtenaar blijkt, dat een jongere in strijd met de ter zake geldende voorschriften
      arbeid verricht, geven zij hiervan terstond kennis aan een daartoe door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen onder hem ressorterende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel35
  - number: '36'
    text: |-
      Ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, zijn bevoegd een jongere die zij onder
      schooltijd op een voor het publiek toegankelijke plaats aantreffen, te brengen naar het hoofd van de school waarop
      de jongere als leerling staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel36
  - number: '37'
    text: |-
      1 Het bestuurscollege brengt jaarlijks vóór 1 oktober verslag uit aan de eilandsraad over het in het laatst
      afgesloten school- of cursusjaar in het openbaar lichaam gevoerde beleid inzake de handhaving van de leerplicht en
      de kwalificatieplicht en de resultaten daarvan.

      2 Het bestuurscollege doet jaarlijks een opgave aan Onze Minister van de omvang en behandeling van het aan hem
      gemelde schoolverzuim in het openbaar lichaam.

      3 Het hoofd doet jaarlijks een opgave aan Onze Minister van de omvang van het schoolverzuim aan zijn school of
      instelling.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel37
  - number: '38'
    text: |-
      1 De in [artikel 6, eerste lid][ref1], bedoelde personen die de in artikel 6, eerste lid, of [artikel 11][ref2]
      opgelegde verplichtingen niet nakomen, worden gestraft met hechtenis van ten hoogste een maand of geldboete van de
      tweede categorie.

      2 De leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere die kwalificatieplichtig
      is, die de verplichting tot geregeld volgen van het onderwijs niet nakomt, wordt gestraft met een hoofdstraf als
      genoemd in [artikel 9, tweede lid, van het Wetboek van Strafrecht BES][ref3], met dien verstande dat de geldboete
      een geldboete van de tweede categorie is.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel11
