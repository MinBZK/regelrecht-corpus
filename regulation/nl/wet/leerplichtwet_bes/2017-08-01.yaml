    text: |-
      Deze wet verstaat onder:

      a. **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. **school**:

      1°. een openbare of een uit openbare kas bekostigde bijzondere basisschool of school of inrichting voor voortgezet
      onderwijs;

      2°. een ingevolge [artikel 112 van de Wet voortgezet onderwijs BES][ref1] aangewezen bijzondere school voor
      voortgezet onderwijs;

      3°. een andere school die wat de inrichting van het onderwijs betreft, overeenkomt met de criteria, bedoeld in
      [artikel 3][ref2], en wat de bevoegdheden van leraren betreft, overeenkomt met een of meer van de onder 1° bedoelde
      scholen;

      4°. een andere krachtens [artikel 2, eerste lid, onder a][ref3], voor de toepassing van deze wet als school
      aangewezen onderwijsinstelling;

      c. **instelling**:

      1°. een instelling voor educatie en beroepsonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref4];

      2°. een andere krachtens [artikel 2, eerste lid, onder b][ref5], voor de toepassing van deze wet als instelling
      aangewezen cursus of instelling, waar onderwijs of vorming wordt gegeven;

      d. **hoofd**:

      1°. hij die met de leiding van de school is belast;

      2°. hij die met de leiding van de instelling is belast;

      e. **ambtenaar**: de ambtenaar, bedoeld in [artikel 28][ref6];

      f. **startkwalificatie**: een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onder b tot en met e, van de Wet educatie en beroepsonderwijs BES][ref7] of een diploma
      hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 13][ref8]
      onderscheidenlijk [artikel 14 van de Wet voortgezet onderwijs BES][ref9];

      g. **openbaar lichaam**: het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      h. **inspectie**: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref10];

      i. **persoonsgebonden nummer BES**: het ID-nummer dat van de jongere is opgenomen in de basisadministratie
      persoonsgegevens van het openbaar lichaam dan wel het door Onze Minister uitgegeven onderwijsnummer.


