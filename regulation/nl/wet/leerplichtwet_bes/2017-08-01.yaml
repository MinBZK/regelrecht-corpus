        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '13'
        paragraaf: '3'
  - number: '27'
    text: |-
      In andere gevallen dan genoemd in [artikel 14][ref1] kan het bestuurscollege op grond van bijzondere omstandigheden
      vrijstelling verlenen van de in [artikel 11][ref2] opgelegde verplichtingen, indien wordt aangetoond, dat de
      jongere op andere wijze voldoende onderwijs geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel11
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '11'
        paragraaf: '3'
  - number: 27a
    text: |-
      Bij vertrek uit een openbaar lichaam is een leerplichtige jongere die afwezig zal zijn gedurende de tijd dat er
      onderwijs wordt gegeven, in het bezit van een verklaring waaruit blijkt dat:

      a. hem vrijstelling, ontheffing of verlof is verleend als bedoeld in deze wet, of

      b. hij zich heeft uitgeschreven uit het bevolkingsregister teneinde zich buiten het desbetreffende openbaar lichaam
      te vestigen.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel27a
  - number: '28'
    text: |-
      1 Het toezicht op de naleving van deze wet is opgedragen aan het bestuurscollege. Het wijst daartoe een of meer
      ambtenaren aan.

      2 Alvorens hun ambt te aanvaarden, leggen deze ambtenaren in handen van de gezaghebber de eed of de belofte af,
      waarvan het formulier bij ministeriële regeling wordt vastgesteld.

      3 Deze ambtenaren zijn bevoegd hun taak uit te oefenen ten aanzien van leerlingen die in een van de openbare
      lichamen woon- of verblijfplaats hebben.

      4 Het bestuurscollege stelt een instructie vast voor deze ambtenaren, die ten minste bevat:

      a. de wijze waarop de ambtenaren aan de in de [artikelen 26, derde lid][ref1], [34][ref2] en [35][ref3] bedoelde
      taken uitvoering geven;

      b. de wijze waarop de gevallen van schoolverzuim die ter kennis van het openbaar lichaam worden gebracht, worden
      behandeld;

      c. de wijze waarop de ambtenaren bij de uitvoering van hun taken overleg plegen en samenwerken met hun ambtgenoten;

      d. de aanwijzing van de diensten en instellingen waarmee de ambtenaren bij de uitvoering van hun taken dienen samen
      te werken.

      5 Deze ambtenaren zijn belast met de opsporing van de bij deze wet strafbaar gestelde feiten, onverminderd
      [artikel 184 van het Wetboek van Strafvordering BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel26
