  - number: '9'
    text: |-
      1 Op aanvraag van de in [artikel 6, eerste lid][ref1], bedoelde personen kan het bestuurscollege van het openbaar
      lichaam waar de jongere als ingezetene is ingeschreven, toestaan dat de inschrijving van de jongere aan een school
      voor het laatste schooljaar, bedoeld in [artikel 7, eerste lid, onder a of b][ref2], wordt vervangen door de
      inschrijving als leerling van een instelling als bedoeld in [paragraaf 3][ref3].

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de instelling waar de jongere ingeschreven
      wenst te worden. Het begeleidingsprogramma bevat ten minste een beschrijving van de onderwijs- en vormingsdoelen,
      waaronder algemeen vormend onderwijs en op het beroep gericht onderwijs, alsmede de wijze waarop arbeid van lichte
      aard zal worden verricht, naast het volgen van onderwijs aan een instelling als bedoeld in [paragraaf 3][ref4]
      doch niet in samenhang met het onderwijs. Indien het betreft een jongere, die ten tijde van de indiening van de
      aanvraag een programma als bedoeld in [artikel 8, eerste lid][ref5], volgt, gaat de aanvraag tevens vergezeld van
      een verklaring van het hoofd van de school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van
      de wijze waarop uitvoering is gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar
      het onderwijs, bedoeld in de [artikelen 33 tot en met 36 van de Wet voortgezet onderwijs BES][ref6], dan wel een
      voortgezette toepassing van artikel 8, eerste lid, te ontraden is.

      3 Alvorens het bestuurscollege besluit op de aanvraag, bedoeld in het eerste lid, hoort het bestuurscollege in
      elk geval:

      a. degene die de aanvraag heeft ingediend en de jongere zelf;

      b. het hoofd van de school waar de jongere het laatst stond ingeschreven en het hoofd van de instelling waar de
      jongere ingeschreven wenst te worden, en

      c. de instellingen van maatschappelijke zorg die reeds bij de begeleiding van de jongere betrokken zijn.

      4 Het bestuurscollege besluit binnen 4 weken na ontvangst van de aanvraag, bedoeld in het eerste lid, en zendt
      binnen 2 weken na het nemen van het besluit daarvan afschrift aan de in [artikel 6, eerste lid][ref7], bedoelde
      personen.


