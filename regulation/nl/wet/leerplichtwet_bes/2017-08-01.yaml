        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '21'
    text: |-
      1 De in [artikel 6, eerste lid][ref1], bedoelde personen zijn met betrekking tot de jongere die nog niet de
      leeftijd van zes jaar heeft bereikt, voor ten hoogste 5 uren per week vrijgesteld van de verplichting om te zorgen
      dat deze de school waarop hij staat ingeschreven, geregeld bezoekt. Van een beroep op deze vrijstelling wordt
      mededeling gedaan aan het hoofd.

      2 Naast de vrijstelling, bedoeld in het eerste lid, kan het hoofd op aanvraag van de in
      [artikel 6, eerste lid][ref2], bedoelde personen ten behoeve van de jongere bedoeld in het eerste lid, tot ten
      hoogste 5 uren per week vrijstelling verlenen van de verplichting om te zorgen dat deze de school waarop hij staat
      ingeschreven, geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '22'
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere kan slechts worden gedaan, indien daarvan binnen twee
      dagen na het ontstaan van de verhindering aan het hoofd kennis is gegeven, zo mogelijk met opgave van de aard van
      de ziekte.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel22
  - number: '23'
    text: |-
      Een beroep op vrijstelling wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging kan
      slechts worden gedaan indien daarvan uiterlijk twee dagen vóór de verhindering aan het hoofd kennis is gegeven.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel23
  - number: '24'
    text: |-
      1 Een beroep op vrijstelling wegens vakantie van de jongere, bedoeld in [artikel 20, onder f][ref1], kan slechts
      worden gedaan indien het hoofd op aanvraag van de in [artikel 6, eerste lid][ref2], bedoelde personen verlof heeft
      verleend dat de jongere voor de duur van het verlof de school onderscheidenlijk de instelling niet bezoekt.

      2 Verlof als bedoeld in het eerste lid kan door het hoofd slechts eenmaal voor ten hoogste tien dagen per
      schooljaar worden verleend en kan geen betrekking hebben op de eerste twee lesweken van het schooljaar. Het
      verlof, bedoeld in de eerste volzin, kan aan de jongere die kwalificatieplichtig is slechts worden verleend tot een
      evenredig deel van het aantal dagen dat hij op grond van [artikel 13][ref3] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel13
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '20'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030281
        artikel: '13'
        paragraaf: '3'
  - number: '25'
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere, wegens vervulling van plichten voortvloeiend
      uit godsdienst of levensovertuiging wordt gedaan door middel van kennisgeving aan het hoofd door de
      in [artikel 6, eerste lid][ref1], bedoelde personen, tenzij de leerplichtige jongere of de jongere die
      kwalificatieplichtig is niet meer woonachtig is bij deze personen, in welk geval de kennisgeving wordt gedaan door
      de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
        paragraaf: '2'
  - number: '26'
    text: |-
      1 Een beroep op vrijstelling wegens andere gewichtige omstandigheden als bedoeld in [artikel 20 onder g][ref1]
      kan slechts worden gedaan, indien het hoofd op aanvraag van de in [artikel 6, eerste lid][ref2], bedoelde personen
      verlof heeft verleend, dat de jongere de school onderscheidenlijk de instelling tijdelijk niet bezoekt.

      2 Indien geen verlof is gevraagd, kan het hoofd alsnog verlof verlenen, indien hem binnen twee dagen na het
      ontstaan van de verhindering de redenen daarvan worden medegedeeld.

      3 Het hoofd kan ten aanzien van dezelfde jongere wegens de in het eerste lid bedoelde omstandigheden voor ten
      hoogste tien dagen per schooljaar verlof als bedoeld in dat lid verlenen. Indien het verlof ten aanzien van
      dezelfde jongere wordt gevraagd voor meer dan tien dagen per schooljaar, besluit de ambtenaar van het openbaar
      lichaam waar de jongere woonachtig is, het hoofd gehoord. Het verlof, bedoeld in de eerste volzin, kan aan de
      jongere die kwalificatieplichtig is slechts worden verleend tot een evenredig deel van het aantal dagen dat hij op
      grond van [artikel 13][ref3] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030281#Artikel13
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel26
    references:
      - id: ref1
