  - number: '42'
    text: |-
      1 Ontheffingen en vrijstellingen die krachtens de Leerplichtlandsverordening of krachtens de Leerplichtwet BES
      zoals die wet op 10 oktober 2010 is komen te luiden, zijn verleend, worden geacht te zijn verleend krachtens deze
      wet voor de resterende duur waarvoor zij werden verleend.

      2 Verzoeken die op grond van artikel 4 van de Leerplichtlandsverordening zoals luidend op 9 oktober 2010 of op
      grond van artikel 4 van de Leerplichtwet BES, zoals dat artikel op 10 oktober 2010 is komen te luiden, zijn gedaan
      en waarop op die dag nog niet is beslist, worden afgehandeld met inachtneming van de regels die bij of krachtens de
      Leerplichtlandsverordening zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel42
  - number: '43'
    text: |-
      Een school die op 9 oktober 2010 was aangemerkt als een niet bekostigde school, wordt met ingang
      van de datum van inwerkingtreding van dit artikel aangemerkt als een school als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel43
