  - number: '40'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0030281/2017-08-01#Artikel40
  - number: '41'
    text: |-
      1 Bij ministeriële regeling worden nadere voorschriften gegeven voor de uitvoering van deze wet en worden de
      modellen vastgesteld van de kennisgevingen en mededelingen, bedoeld in de [artikelen 15][ref1], [31][ref2],
      [33][ref3] en [37, tweede en derde lid][ref4]. Bij deze regeling kan tevens worden bepaald dat de in artikel 37,
      tweede of derde lid, bedoelde opgave niet wordt gedaan aan Onze Minister maar aan het Centraal Bureau voor de
      Statistiek.

      2 De formulieren van de kennisgevingen en mededelingen, bedoeld in de [artikelen 15][ref5], [31][ref6]
      en [33][ref7] zijn voor de belanghebbenden kosteloos op het bestuurskantoor van het openbaar lichaam
      verkrijgbaar. De formulieren voor de opgaven van gegevens ten behoeve van statistisch onderzoek als bedoeld in
      [artikel 37, tweede en derde lid][ref8] worden door het Rijk verstrekt.


