articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *Bijzondere informatie:* informatie waar kennisname door niet geautoriseerden nadelige gevolgen kan hebben voor
      de belangen van de Staat, van zijn bondgenoten of van één of meer ministeries;

      b. *Compromittering:* kennisname dan wel mogelijkheid tot kennisname van bijzondere informatie door niet
      geautoriseerden;

      c. *Rubriceren:* bepalen van het rubriceringsniveau en -duur van de bijzondere informatie op basis van de te
      verwachten nadelige gevolgen voor de belangen van de Staat, van zijn bondgenoten of van één of meer ministeries als
      (een deel van) deze informatie bekend wordt bij niet geautoriseerden;

      d. *Rubriceringsniveau:* aanduiding van de verwachte nadelige gevolgen aan de belangen van de Staat, van zijn
      bondgenoten of van één of meer ministeries als (een deel van) de informatie bekend wordt bij niet geautoriseerden;

      e. *Rubriceringsambtenaar:* ambtenaar bevoegd tot het vaststellen van rubriceringen, hiertoe aangewezen door de
      secretaris-generaal;

      f. *Vaststeller van de rubricering:* minister, staatssecretaris, secretaris-generaal of een door de secretaris-
      generaal aangewezen rubriceringsambtenaar;

      g. *Rijksdienst:* alle organisatieonderdelen waarvoor de ministeriële verantwoordelijkheid onverkort geldt.

      h. *Zorgdrager:* degene die bij of krachtens de wet belast is met de zorg voor de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel1
  - number: '2'
    text: |-
      1 Dit voorschrift met de bijbehorende toelichting en [bijlage 1][ref1] geldt voor de Rijksdienst, waartoe gerekend
      worden de ministeries met de daaronder ressorterende diensten, bedrijven en instellingen.

      2 Op de beveiliging van bijzondere informatie zijn de bepalingen van dit voorschrift als aanvulling op het
      [Besluit voorschrift informatiebeveiliging rijksdienst 2007][ref2] (VIR 2007) en het Beveiligingsvoorschrift Rijk
      2013 (BVR 2013) van toepassing.

      3 Bijzondere informatie die krachtens een internationaal verdrag of overeenkomst is verkregen, behoudt de
      toegekende rubricering en wordt beveiligd volgens het overeenkomstige nationale beveiligingsniveau. Voor zover voor
      de beveiliging van dergelijke informatie als gevolg van het verdrag of de overeenkomst afwijkende of verdergaande
      beveiligingsbepalingen bestaan worden deze bepalingen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0033507
      [ref2]: https://wetten.overheid.nl/BWBR0022141
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033507
      - id: ref2
        bwb_id: BWBR0022141
  - number: '3'
    text: |-
      Het beveiligingsbeleid dat door de secretaris-generaal wordt vastgesteld omvat ten minste de ministeriële
      uitgangspunten voor de beveiliging van, de toegang tot, het omgaan met en verwerken van bijzondere informatie zoals
      bedoeld in dit voorschrift en de wijze waarop:

      a. het ministerie informatie rubriceert;

      b. de secretaris-generaal vooraf toestemming verleent voor het verwerken van bijzondere informatie;

      c. het ministerie toezicht uitoefent op de beveiliging van bijzondere informatie.
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel3
  - number: '4'
    text: |-
      1 Informatie waarvan de geheimhouding vanwege het belang van de Staat, zijn bondgenoten of van één of meer
      ministeries is geboden, moet worden voorzien van een passend niveau van rubricering.

      2 Bijzondere informatie wordt als volgt gerubriceerd:

      a. Staatsgeheim ZEER GEHEIM (afgekort Stg.ZG)

      Indien kennisname door niet geautoriseerden zeer ernstige schade kan toebrengen aan een van de vitale belangen van
      de Staat of zijn bondgenoten

      b. Staatsgeheim GEHEIM (afgekort Stg.G)

      Indien kennisname door niet geautoriseerden ernstige schade kan toebrengen aan een van de vitale belangen van de
      Staat of zijn bondgenoten

      c. Staatsgeheim CONFIDENTIEEL (afgekort Stg.C)

      Indien kennisname door niet geautoriseerden schade kan toebrengen aan een van de vitale belangen van de Staat of
      zijn bondgenoten

      d. Departementaal VERTROUWELIJK (afgekort Dep.V.).

      Indien kennisname door niet geautoriseerden schade kan toebrengen aan de belangen van één of meerdere ministeries.

      3 De opsteller van de informatie doet een voorstel tot rubricering en brengt deze aan op de informatie. De
      vaststeller van de inhoud van de informatie stelt tevens de rubricering vast.
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel4
  - number: '5'
    text: |-
      1 Rubriceringen worden verbonden aan een maximum tijdsverloop of aan een bepaalde gebeurtenis. Na die periode of
      na die gebeurtenis weegt de vaststeller voor bijzondere informatie af of herziening, dan wel beëindiging van de
      rubricering, aan de orde is.

      2 Van het eerste lid van deze bepaling kan worden afgeweken in die gevallen waarin de rubricering betrekking heeft
      op:

      a. Bijzondere informatie die krachtens een internationaal verdrag of overeenkomst is verkregen;

      b. Staatsgeheimen die door de wet als zodanig zijn aangewezen.

      3 Uitsluitend de vaststeller van de rubricering is bevoegd de rubricering te herzien of te beëindigen.

      4 Bij overbrenging van bijzondere informatie naar een rijksarchiefbewaarplaats als bedoeld in de
      [Archiefwet 1995][ref1] vervalt de rubricering, tenzij de zorgdrager, na advies van de algemene rijksarchivaris,
      bepaalt dat deze gehandhaafd dan wel herzien moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '6'
    text: |-
      1 Bijzondere informatie wordt zodanig beveiligd dat:

      a. alleen personen die daartoe zijn geautoriseerd deze kunnen behandelen of inzien voor zover dit noodzakelijk is
      voor een goede uitoefening van hun taak en

      b. dat inbreuken op de beveiliging worden gedetecteerd en gedegen onderzoek naar (mogelijke) inbreuken mogelijk is.

      2 De beveiliging is ingericht op basis van risicomanagement.

      3 Bijzondere informatie die krachtens een internationaal verdrag of een internationale overeenkomst is verkregen
      wordt uitsluitend verwerkt nadat de autoriteit, die krachtens het betreffende verdrag verantwoordelijk is voor de
      beveiligingsregels ter bescherming van bijzondere informatie, haar goedkeuring aan de beveiliging heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel6
  - number: '7'
    text: |-
      1 Bij het buiten de rijksdienst brengen van bijzondere informatie, anders dan op grond van een wettelijke
      verplichting tot openbaarmaking, blijven de eisen aan de beveiliging en het toezicht daarop onverkort van kracht.

      2 Bijzondere informatie die krachtens een internationaal verdrag of een internationale overeenkomst is verkregen
      wordt uitsluitend na voorafgaande toestemming van het land of de internationale organisatie van herkomst
      doorgegeven aan externe partijen.
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel7
  - number: '8'
    text: |-
      1 Elke ambtenaar is verplicht de Beveiligingsambtenaar (BVA) onmiddellijk mededeling te doen van een inbreuk op de
      beveiliging die redelijkerwijs kan leiden, dan wel vermoedelijk of vaststaand heeft geleid, tot compromittering van
      bijzondere informatie.

      2 De BVA laat, nadat hij op de hoogte is gebracht van een inbreuk op de beveiliging, onmiddellijk (nood)maatregelen
      treffen om verdere inbreuk te voorkomen.

      3 De BVA onderzoekt of compromittering van bijzondere informatie heeft plaatsgevonden; indien dit het geval is doet
      hij hiervan mededeling aan de secretaris-generaal en adviseert over de noodzaak tot het instellen van een commissie
      van onderzoek.

      4 Indien de compromittering betrekking heeft op bijzondere informatie die is verkregen van een ander ministerie of
      krachtens internationaal verdrag of overeenkomst, doet de BVA bovendien mededeling aan dat betreffende ministerie
      of de krachtens het verdrag of de overeenkomst voor de beveiliging van die bijzondere informatie verantwoordelijke
      instantie.
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel8
  - number: '9'
    text: |-
      1 Een commissie van onderzoek wordt ingesteld door de secretaris-generaal.

      2 De commissie stelt een onderzoek in naar:

      a. de wijze waarop de compromittering heeft plaatsgevonden;

      b. de aard en de omvang van de schade aan de belangen van de Staat of zijn bondgenoten;

      c. de te nemen maatregelen om de schade te beperken en herhaling te voorkomen.

      3 De commissie voert, indien de gecompromitteerde bijzondere informatie (mede) afkomstig is van een ander
      ministerie, haar onderzoek uit in overleg met de BVA van dat ministerie. In het geval dat de gecompromitteerde
      bijzondere informatie krachtens een internationaal verdrag of overeenkomst is verkregen voert de commissie haar
      onderzoek uit in samenwerking met de instantie die krachtens het verdrag of de overeenkomst verantwoordelijk is
      voor de beveiliging ervan.

      4 De secretaris-generaal of een door hem aangewezen ambtenaar treft, op basis van de bevindingen van de commissie
      van onderzoek, maatregelen om de schade die de compromittering heeft toegebracht aan de veiligheid of andere
      gewichtige belangen van de Staat of zijn bondgenoten te beperken en herhaling van de compromittering te voorkomen.

      5 Indien het de compromittering van een staatsgeheim betreft stelt de secretaris-generaal het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst in kennis van de uitkomsten van het onderzoek. Bij het ministerie van Defensie
      wordt de Militaire Inlichtingen- en Veiligheidsdienst op de hoogte gesteld van de uitkomsten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0033507/2013-06-01#Artikel9
  - number: '10'
    text: |-
      1 Het [Besluit voorschrift informatiebeveiliging rijksdienst – bijzondere informatie][ref1] van 24 februari 2004
      wordt ingetrokken.

      2 Rubriceringen die zijn vastgesteld vóór inwerkingtreding van dit voorschrift worden uiterlijk tien jaar na
      vaststelling door de vaststeller onderzocht op de mogelijkheid om de rubricering te herzien of te beëindigen.

      3 Dit besluit en de daarbij behorende bijlagen treden in werking met ingang van 1 juni 2013.

      4 Dit besluit wordt aangehaald als: Besluit Voorschrift Informatiebeveiliging Rijksdienst Bijzondere Informatie
      2013 (VIRBI 2013).

      5 Dit besluit zal met de toelichting in de Staatscourant worden geplaatst. Van de ter inzage legging van de bij dit
      besluit behorende bijlagen zal mededeling worden gedaan in de Staatscourant.


