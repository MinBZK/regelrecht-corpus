  - number: '2.1'
    text: |-
      Het UWV stelt op aanvraag vast of recht op een tegemoetkoming bestaat. De herbeoordeelde dient de aanvraag in
      uiterlijk twee maanden na de datum waarop:
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
  - number: 2.1.a
    text: zijn arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
  - number: 2.1.b
    text: |-
      zijn recht op werkloosheidsuitkering is geëindigd omdat de voor hem geldende uitkeringsduur is verstreken, indien
      het derde lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
  - number: '2.2'
    text: |-
      De herbeoordeelde heeft recht op een tegemoetkoming voor de duur van twaalf maanden indien hij op de datum van
      verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering geen recht heeft op een werkloosheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de herbeoordeelde op de datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering recht
      heeft op een werkloosheidsuitkering waarvan de resterende duur minder bedraagt dan twaalf maanden, heeft hij recht
      op een tegemoetkoming. De duur van dat recht op tegemoetkoming is twaalf maanden verminderd met de periode waarover
      hij recht heeft gehad op die werkloosheidsuitkering, gerekend vanaf de datum van verlaging of intrekking van zijn
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
  - number: '2.4'
    text: |-
      Indien de herbeoordeelde op de datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering recht
      heeft op een werkloosheidsuitkering, maar de hoogte van deze uitkering niet wordt aangepast in verband met de
      verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering, heeft hij in afwijking van het tweede en derde
      lid recht op een tegemoetkoming voor de duur van twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
  - number: '2.5'
    text: |-
      Indien de herbeoordeelde geen recht heeft op een werkloosheidsuitkering omdat hij een uitkering ontvangt
      op grond van [hoofdstuk 3 van de Wet arbeid en zorg][ref1] of omdat hij ziekengeld ontvangt op grond van de
      [Ziektewet][ref2], wordt laatstgenoemde uitkering of dat ziekengeld voor de toepassing van het tweede, derde en
      vierde lid gelijkgesteld met een werkloosheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
