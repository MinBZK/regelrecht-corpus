        artikel: '18'
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0008657
        artikel: '2'
  - number: '3.3'
    text: |-
      Van een toename als bedoeld in het eerste lid is sprake, indien het inkomen uit of in verband met arbeid in
      de periode waarover recht op een tegemoetkoming bestaat, gemiddeld per dag hoger is dan het inkomen uit of
      in verband met arbeid in de zes kalendermaanden voorafgaand aan de datum van verlaging of intrekking van de
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel3
  - number: '3.4'
    text: |-
      Voor de toepassing van het derde lid wordt een periode waarover de tegemoetkoming op grond van
      [artikel 5, eerste lid][ref1], niet wordt betaald, aangemerkt als een periode waarover geen recht op tegemoetkoming
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel5
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: '5'
        hoofdstuk: '2'
  - number: '3.5'
    text: |-
      De arbeidsongeschiktheidsuitkering waar de herbeoordeelde recht op had op de dag voor de
      datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering, bedoeld in het
      eerste lid, wordt herzien met ingang van de dag waarop en de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder c, van de Wet minimumloon en minimumvakantiebijslag][ref1] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '4.1'
    text: |-
      De tegemoetkoming wordt door het UWV bij wege van een naar redelijkheid vast te stellen voorschot betaalbaar
      gesteld.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel4
  - number: '4.2'
    text: Het UWV betaalt het voorschot in de regel per maand.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel4
  - number: '4.3'
    text: |-
      De hoogte van de tegemoetkoming wordt zo spoedig mogelijk na het verstrijken van de periode waarover de
      herbeoordeelde recht heeft op een tegemoetkoming op grond van [artikel 2][ref1], definitief vastgesteld
      overeenkomstig [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017646#Artikel3
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017646
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.4'
    text: 'Indien bij de vaststelling blijkt dat het door het UWV op grond van het eerste lid betaalde voorschot:'
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel4
  - number: 4.4.a
    text: te hoog is, wordt de te veel betaalde tegemoetkoming teruggevorderd van de herbeoordeelde;
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel4
  - number: 4.4.b
    text: te laag is, wordt de te weinig betaalde tegemoetkoming door UWV betaald aan de herbeoordeelde.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel4
  - number: '5.1'
    text: 'De tegemoetkoming wordt niet betaald:'
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel5
  - number: 5.1.a
    text: |-
      indien de herbeoordeelde niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5.1.b
    text: voorzover de herbeoordeelde rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op categorieën van personen als bedoeld in
      [artikel 1 van het Besluit extramurale vrijheidsbeneming en sociale zekerheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011136#Artikel1
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011136
        artikel: '1'
  - number: '6'
    text: In de uitvoering van deze regeling wordt voorzien door het UWV.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel6
  - number: '7.1'
    text: In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door het Rijk.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.2'
    text: |-
      De middelen worden ter beschikking gesteld aan het UWV via de rekening-courant bij de Minister van Financiën, die
      het UWV op grond van [artikel 120, eerste lid, van de Wet financiering sociale verzekeringen][ref1] aanhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '120'
  - number: '7.3'
    text: |-
      [Artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en
      [artikel 120, derde lid, van de Wet financiering sociale verzekeringen][ref2] zijn van overeenkomstige toepassing
      bij de uitvoering van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '120'
  - number: '7.4'
    text: Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.5'
    text: |-
      Met inachtneming van het zesde, zevende en achtste lid brengt het UWV de uitgaven voor de tegemoetkomingen en de
      uitvoeringskosten in rekening bij de Minister.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.6'
    text: 'Op de zesde dag van elke maand verstrekt het UWV aan de Minister:'
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: 7.6.a
    text: een raming van de uitgaven verbonden aan de uitvoering van deze regeling in die maand;
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: 7.6.b
    text: |-
      een opgave van de gerealiseerde uitgaven verbonden aan de uitvoering van deze regeling over de maand gelegen twee
      maanden voor die maand.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.7'
    text: |-
      In de raming, bedoeld in het zesde lid, onderdeel a, worden overeenkomstig de bij deze regeling behorende
      [bijlage 1][ref1], afzonderlijk vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0017646
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017646
  - number: 7.7.a
    text: |-
      het totaalbedrag aan geraamde uitgaven voor de tegemoetkomingen op grond van deze regeling inclusief de op grond
      van enige wet over de tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen
      in mindering kunnen worden gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente,
      proceskosten en rentelasten, en
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: 7.7.b
    text: het totaalbedrag aan geraamde uitvoeringskosten op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.8'
    text: |-
      In de opgave van de gerealiseerde uitgaven, bedoeld in het zesde lid, onderdeel b, worden overeenkomstig de bij
      deze regeling behorende [bijlage 2][ref1], afzonderlijk vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0017646
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017646
  - number: 7.8.a
    text: |-
      het totaalbedrag aan uitbetaalde tegemoetkomingen op grond van deze regeling inclusief de op grond van enige
      wet over de tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen in mindering
      kunnen worden gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente, proceskosten en
      rentelasten, en
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: 7.8.b
    text: het totaalbedrag aan gerealiseerde uitvoeringskosten op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.9'
    text: |-
      Indien de in het zesde lid bedoelde dag een zaterdag, zondag of een algemeen erkende feestdag is, vindt de
      verstrekking plaats op de eerstvolgende dag die niet een zaterdag, zondag of een algemeen erkende feestdag is.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.10'
    text: |-
      Met als valutadag de elfde dag van elke maand draagt de Minister het bedrag van de geraamde uitgaven verbonden aan
      de uitvoering van deze regeling in die maand via de rekening-courant bij de Minister van Financiën af aan het UWV.
      De Minister kan, na overleg met het UWV, van het geraamde bedrag afwijken.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.11'
    text: |-
      Met als valutadag de elfde dag van elke maand verrekent de Minister het verschil tussen de gerealiseerde uitgaven
      en de geraamde uitgaven in de maand gelegen twee maanden voor die bedoeld in het tiende lid, met het bedrag,
      bedoeld in het tiende lid.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.12'
    text: |-
      [Artikel 16, eerste lid, van de Algemene Regeling SZW-subsidies][ref1] is niet van toepassing op verstrekking van
      tegemoetkomingen krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel16
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009211
        artikel: '16'
  - number: '7.13'
    text: Uiterlijk op 1 juni dient het UWV de afrekening over het afgelopen kalenderjaar bij de Minister in.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.14'
    text: |-
      In de afrekening, bedoeld in het dertiende lid, wordt, op basis van de jaarrekening, bedoeld in
      [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de kasstroom inzichtelijk gemaakt,
      en deze wordt afzonderlijk vermeld voor de tegemoetkomingen op grond van deze regeling inclusief de op grond
      van enige wet over de tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen
      in mindering kunnen worden gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente,
      proceskosten en rentelasten alsmede voor de uitvoeringskosten verbonden aan de uitvoering van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '7.15'
    text: |-
      Op grond van de afrekening, bedoeld in het dertiende lid, vindt voor 15 juli een betaling plaats ten gunste of ten
      laste van het UWV.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: '7.16'
    text: |-
      De Minister stelt jaarlijks voor 31 oktober de omvang van de middelen tot dekking van de uitgaven ter uitvoering
      van deze regeling vast, gespecificeerd overeenkomstig het achtste lid.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7
  - number: 7a
    text: |-
      Deze regeling berust mede op [artikel 77 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en
      [artikel 122 van de Wet financiering sociale verzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel122
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '122'
  - number: 7b
    text: |-
      [ Artikel 1, onderdeel d][ref1], zoals dat luidde op de dag voor inwerkingtreding van artikel XIIII, onderdeel A,
      van de regeling van 4 september tot wijziging van enige ministeriële regelingen in verband met de inwerkingtreding
      van de Wet wijziging WW-stelsel (Stcrt. 182) blijft van toepassing met betrekking tot een recht op uitkering
      waarvan de eerste werkloosheidsdag is gelegen voor de dag van inwerkingtreding van dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel1
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: '1'
        hoofdstuk: '1'
  - number: 7c.1
    text: |-
      [Artikel 2][ref1] zoals dat luidde op de dag voor inwerkingtreding van artikel I van de Regeling uitbreiding
      doelgroep verlenging tegemoetkoming TRI, blijft van toepassing met betrekking tot een recht op tegemoetkoming dat
      is aangevraagd voor of op die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel2
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: '2'
        hoofdstuk: '2'
  - number: 7c.2
    text: |-
      In afwijking van [artikel 2, eerste lid, tweede zin][ref1], kan een aanvraag op grond van dat artikel in ieder
      geval worden ingediend tot drie maanden na de dag van inwerkingtreding van de Regeling uitbreiding doelgroep
      verlenging tegemoetkoming TRI.


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel2
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: '2'
        hoofdstuk: '2'
  - number: 7c.3
    text: |-
      De herbeoordeelde wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken voor of op 23 september 2006
      en die
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
  - number: 7c.3.a
    text: |-
      vóór de datum van inwerkingtreding van de Regeling uitbreiding doelgroep verlenging tegemoetkoming TRI een aanvraag
      om een tegemoetkoming heeft gedaan; en
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
  - number: 7c.3.b
    text: |-
      op 23 maart 2007 geen recht had op een tegemoetkoming of een werkloosheidsuitkering waarvan de hoogte is aangepast
      in verband met de verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
  - number: 7c.4
    text: 'De duur van de extra tegemoetkoming is zes maanden verminderd met de periodes waarover:'
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
  - number: 7c.4.a
    text: |-
      de herbeoordeelde recht had op tegemoetkoming op grond van [artikel 2a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel2a
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: 2a
        hoofdstuk: '2'
  - number: 7c.4.b
    text: |-
      de herbeoordeelde recht had op een als gevolg van de verlaging of intrekking van de arbeidsongeschiktheidsuitkering
      ontstane of aangepaste werkloosheidsuitkering, gerekend vanaf zes maanden na de datum van verlaging of intrekking
      van zijn arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
  - number: 7c.5
    text: |-
      Het UWV stelt het recht op een extra tegemoetkoming op aanvraag vast. De aanvraag kan tot drie maanden na de datum
      van inwerkingtreding van de Regeling uitbreiding doelgroep verlenging tegemoetkoming TRI worden ingediend. Het
      recht gaat in op de datum van aanvraag, met dien verstande dat het recht niet eerder ontstaat dan op de datum van
      inwerkingtreding van die regeling. Met uitzondering van [artikel 2, eerste tot en met vierde lid][ref1], zijn de
      artikelen van deze regeling van toepassing op de extra tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel2
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: '2'
        hoofdstuk: '2'
  - number: '8'
    text: Deze regeling treedt in werking met ingang van 1 januari 2005 en vervalt met ingang van 1 januari 2011.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling inkomensgevolgen herbeoordeelde arbeidsongeschikten.'
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel9
