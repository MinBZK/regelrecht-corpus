  - number: '2.7'
    text: |-
      Bij de toepassing van het zesde lid wordt het niet of niet behoorlijk nakomen van een verplichting volgend uit
      het van overeenkomstige toepassing zijn van [artikel 80 van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      geacht het niet of niet behoorlijk nakomen van de verplichting volgend uit het van overeenkomstige toepassing zijn
      van [artikel 25, eerste lid, onderdeel a, van die wet][ref2] te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel25
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
    references:
      - id: ref1
