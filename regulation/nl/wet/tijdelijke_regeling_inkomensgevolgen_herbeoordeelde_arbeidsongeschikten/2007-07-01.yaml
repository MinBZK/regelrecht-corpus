        hoofdstuk: '5'
  - number: 1.c
    text: |-
      herbeoordeelde: de persoon wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken als gevolg
      van de toepassing van [artikel 34, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of
      [artikel 28, vijfde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] alsmede de persoon,
      bedoeld in [artikel 2, tweede lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref4],
      wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken;


