  - number: 1.b
    text: |-
      UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel1
    references:
