        artikel: '80'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '25'
  - number: '2.8'
    text: |-
      Voor de overeenkomstige toepassing van de [artikelen 25, eerste lid][ref1], en
      [28, onderdelen a, d, g, i, j en k, van de Wet op de arbeidsongeschiktheidsverzekering][ref2] en de daarop
      berustende bepalingen, wordt de tegemoetkoming geacht naar een uitkeringspercentage van 70% te zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
  - number: '2.9'
    text: |-
      Voor de toepassing van andere wetten dan de [Kaderwet SZW-subsidies][ref1] en de daarop berustende bepalingen,
      wordt een tegemoetkoming op grond van deze regeling aangemerkt als uitkering op grond van de verplichte verzekering
      op grond van de [Werkloosheidswet][ref2], met dien verstande dat de tegemoetkoming:


      [ref1]: https://wetten.overheid.nl/BWBR0008754
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008754
      - id: ref2
        bwb_id: BWBR0004045
  - number: 2.9.a
    text: |-
      voor de toepassing van de [Ziektewet][ref1] en de [Wet arbeid en zorg][ref2] en de daarop berustende
      bepalingen wordt aangemerkt als uitkering op grond van de verplichte verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0002524
  - number: 2.9.b
    text: |-
      voor het bepalen van het recht op toeslag op grond van de [Toeslagenwet][ref1] niet als zodanig wordt aangemerkt;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 2.9.c
    text: |-
      voor het bepalen van het recht op een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] niet als zodanig wordt aangemerkt voor de
      persoon wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken als gevolg van de toepassing
      van [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of
      [artikel 28, vijfde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel28
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '28'
  - number: '2.10'
    text: |-
      Het UWV kan het eerste lid, tweede zin, buiten toepassing laten of daarvan afwijken voor zover toepassing daarvan
      zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2
  - number: 2a.1
    text: |-
      De herbeoordeelde die in de periode waarin hij recht heeft op tegemoetkoming op grond van
      [artikel 2, tweede, derde][ref1] en vierde lid, of [artikel 7c, derde lid][ref2], deelneemt aan een voor hem naar
      het oordeel van het UWV noodzakelijke opleiding of scholing, behoudt in afwijking van die artikelleden dat recht
      totdat die opleiding of scholing is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017646#Artikel7c
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0017646
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017646
        artikel: 7c
        hoofdstuk: '4'
  - number: 2a.2
    text: 'Er is sprake van noodzakelijke opleiding of scholing als bedoeld in het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2a
  - number: 2a.2.a
    text: |-
      de opleiding of scholing bestaat uit het systematisch verwerven van kennis dan wel vaardigheden volgens een vooraf
      vastgesteld programma, waarbij de verworven kennis en vaardigheden worden getoetst;
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2a
  - number: 2a.2.b
    text: |-
      aannemelijk is dat de werknemer niet zonder opleiding of scholing een voor hem passend beroep of functie kan
      uitoefenen op de arbeidsmarkt en dat de voorgestelde opleiding of scholing daartoe een adequaat middel is; en
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2a
  - number: 2a.2.c
    text: aannemelijk is dat de opleiding of scholing relevant is voor de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2a
  - number: 2a.3
    text: |-
      Noodzakelijke opleiding of scholing bestaat in overwegende mate uit het verrichten van activiteiten die niet
      productie als doel hebben.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2a
  - number: 2a.4
    text: |-
      Opleiding of scholing als bedoeld in het eerste lid duurt maximaal één jaar. Het UWV kan in individuele gevallen
      een opleiding of scholing van een langere duur toestaan, doch niet meer dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel2a
  - number: '3.1'
    text: |-
      De herbeoordeelde ontvangt een tegemoetkoming ter hoogte van het verschil tussen de arbeidsongeschiktheidsuitkering
      waar hij recht op had op de dag voor de datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering
      en de arbeidsongeschiktheidsuitkering waar hij recht op heeft vanaf die datum. Hierop wordt in mindering gebracht
      de toename van het inkomen uit of in verband met arbeid vanaf de datum van verlaging of intrekking van zijn
      arbeidsongeschiktheidsuitkering ten opzichte van het inkomen uit of in verband met arbeid voor die datum.
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel3
  - number: '3.2'
    text: |-
      Indien met betrekking tot de herbeoordeelde op de dag voor de datum van verlaging of intrekking van zijn
      arbeidsongeschiktheidsuitkering [artikel 44 van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [artikel 58 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of
      [artikel 50 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] werd toegepast, wordt
      voor de toepassing van het eerste lid als de arbeidsongeschiktheidsuitkering waar hij recht op had op
      die dag aangemerkt de arbeidsongeschiktheidsuitkering, zoals deze met betrekking tot die dag zou zijn
      vastgesteld, indien de door de herbeoordeelde verrichte arbeid wel de arbeid zou zijn die is bedoeld
      in respectievelijk [artikel 18, vijfde lid, van de Wet op de arbeidsongeschiktheidsuitkering][ref4],
      [artikel 2, vierde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] en
      [artikel 2, vijfde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0008657#Artikel2
    url: https://wetten.overheid.nl/BWBR0017646/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
      - id: ref2
