    text: |-
      1 Het UWV stelt op aanvraag vast of recht op een tegemoetkoming bestaat.

      De herbeoordeelde dient de aanvraag in uiterlijk twee maanden na de datum waarop:

      a. zijn arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken; of

      b. zijn recht op werkloosheidsuitkering is geëindigd omdat de voor hem geldende uitkeringsduur is verstreken,
      indien het derde lid van toepassing is.

      Het recht op een tegemoetkoming gaat in op de dag waarop de herbeoordeelde de aanvraag heeft ingediend, met
      dien verstande dat het recht niet eerder ontstaat dan de datum waarop de uitkering is verlaagd of ingetrokken
      respectievelijk, in de situatie, bedoeld in de tweede zin, onderdeel b, de datum waarop het recht op
      werkloosheidsuitkering is geëindigd.

      2 De herbeoordeelde heeft recht op een tegemoetkoming voor de duur van twaalf maanden indien hij op de datum van
      verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering geen recht heeft op een werkloosheidsuitkering.

      3 Indien de herbeoordeelde op de datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering recht
      heeft op een werkloosheidsuitkering waarvan de resterende duur minder bedraagt dan twaalf maanden, heeft hij recht
      op een tegemoetkoming. De duur van dat recht op tegemoetkoming is twaalf maanden verminderd met de periode waarover
      hij recht heeft gehad op die werkloosheidsuitkering, gerekend vanaf de datum van verlaging of intrekking van zijn
      arbeidsongeschiktheidsuitkering.

      4 Indien de herbeoordeelde op de datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering recht
      heeft op een werkloosheidsuitkering, maar de hoogte van deze uitkering niet wordt aangepast in verband met de
      verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering, heeft hij in afwijking van het tweede en derde
      lid recht op een tegemoetkoming voor de duur van twaalf maanden.

      5 Indien de herbeoordeelde geen recht heeft op een werkloosheidsuitkering omdat hij een uitkering ontvangt
      op grond van [hoofdstuk 3 van de Wet arbeid en zorg][ref1] of omdat hij ziekengeld ontvangt op grond van de
      [Ziektewet][ref2], wordt laatstgenoemde uitkering of dat ziekengeld voor de toepassing van het tweede, derde en
      vierde lid gelijkgesteld met een werkloosheidsuitkering.

      6 Voor zover in deze regeling niet anders wordt bepaald, zijn de [artikelen 23, eerste lid][ref3],
      [24][ref4], [25, eerste lid, met uitzondering van de onderdelen b en c][ref5], [27][ref6],
      [28, onderdelen a, d, g, i, j en k][ref7], [29][ref8], [36a][ref9], [57][ref10], [57a][ref11], [57b][ref12],
      [80][ref13],[ 86b][ref14] en [87c van de Wet op de arbeidsongeschiktheidsverzekering][ref15] en de
      [artikelen 30, eerste lid][ref16], [32, tweede en derde lid][ref17], [88, eerste lid, onderdeel a][ref18],
      [90][ref19], en [131, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref20] en de daarop berustende
      bepalingen van overeenkomstige toepassing op de herbeoordeelde die recht heeft op een tegemoetkoming.

      7 Bij de toepassing van het zesde lid wordt het niet of niet behoorlijk nakomen van een verplichting volgend uit
      het van overeenkomstige toepassing zijn van [artikel 80 van de Wet op de arbeidsongeschiktheidsverzekering][ref21]
      geacht het niet of niet behoorlijk nakomen van de verplichting volgend uit het van overeenkomstige toepassing zijn
      van [artikel 25, eerste lid, onderdeel a, van die wet][ref22] te zijn.

      8 Voor de overeenkomstige toepassing van de [artikelen 25, eerste lid][ref23], en
      [28, onderdelen a, d, g, i, j en k, van de Wet op de arbeidsongeschiktheidsverzekering][ref24] en de daarop
      berustende bepalingen, wordt de tegemoetkoming geacht naar een uitkeringspercentage van 70% te zijn vastgesteld.

      9 Voor de toepassing van andere wetten dan de [Kaderwet SZW-subsidies][ref25] en de daarop berustende bepalingen,
      wordt een tegemoetkoming op grond van deze regeling aangemerkt als uitkering op grond van de verplichte verzekering
      op grond van de [Werkloosheidswet][ref26], met dien verstande dat de tegemoetkoming:

      a. voor de toepassing van de [Ziektewet][ref27] en de [Wet arbeid en zorg][ref28] en de daarop berustende
      bepalingen wordt aangemerkt als uitkering op grond van de verplichte verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref29];

      b. voor het bepalen van het recht op toeslag op grond van de [Toeslagenwet][ref30] niet als zodanig wordt
      aangemerkt; en

      c. voor het bepalen van het recht op een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref31] niet als zodanig wordt aangemerkt voor de
      persoon wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken als gevolg van de toepassing
      van [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref32] of
      [artikel 3:28, vijfde lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref33].

      10 Het UWV kan het eerste lid, tweede zin, buiten toepassing laten of daarvan afwijken voor zover toepassing
      daarvan zal leiden tot een onbillijkheid van overwegende aard.


