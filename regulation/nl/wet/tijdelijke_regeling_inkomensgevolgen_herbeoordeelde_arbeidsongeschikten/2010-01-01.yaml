preamble:
  text: |-
    Gelet op artikel 9 van de Kaderwet SZW-subsidies en de artikelen 30, eerste lid, onderdeel i, en 77, derde lid, van
    de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017646/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. de Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. herbeoordeelde: de persoon wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken als gevolg
      van de toepassing van [artikel 34, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2],
      [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] of
      [artikel 3:28, vijfde lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref4] alsmede de persoon,
      bedoeld in [artikel 2, tweede lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref5],
      wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken;

      d. werkloosheidsuitkering: een uitkering op grond van [hoofdstuk II van de Werkloosheidswet][ref6] en wachtgeld als
      bedoeld in [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref7];

      e. inkomen uit of in verband met arbeid: inkomen uit of in verband met arbeid in het bedrijfs- en beroepsleven als
      bedoeld in het [Inkomensbesluit Toeslagenwet][ref8];

      f. valutadag: de op de rekening-courantafschriften aangegeven dag van betaling.


