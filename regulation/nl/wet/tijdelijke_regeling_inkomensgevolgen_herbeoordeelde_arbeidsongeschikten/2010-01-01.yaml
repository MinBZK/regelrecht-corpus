  - number: '4'
    text: |-
      1 De tegemoetkoming wordt door het UWV bij wege van een naar redelijkheid vast te stellen voorschot betaalbaar
      gesteld.

      2 Het UWV betaalt het voorschot in de regel per maand.

      3 De hoogte van de tegemoetkoming wordt zo spoedig mogelijk na het verstrijken van de periode waarover de
      herbeoordeelde recht heeft op een tegemoetkoming op grond van [artikel 2][ref1], definitief vastgesteld
      overeenkomstig [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017646#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017646#Artikel3
