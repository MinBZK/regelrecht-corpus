  - number: '6'
    text: In de uitvoering van deze regeling wordt voorzien door het UWV.
    url: https://wetten.overheid.nl/BWBR0017646/2010-01-01#Artikel6
  - number: '7'
    text: |-
      1 In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door het Rijk.

      2 De middelen worden ter beschikking gesteld aan het UWV via de rekening-courant bij de Minister van Financiën, die
      het UWV op grond van [artikel 120, eerste lid, van de Wet financiering sociale verzekeringen][ref1] aanhoudt.

      3 [Artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] en
      [artikel 120, derde lid, van de Wet financiering sociale verzekeringen][ref3] zijn van overeenkomstige toepassing
      bij de uitvoering van deze regeling.

      4 Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      5 Met inachtneming van het zesde, zevende en achtste lid brengt het UWV de uitgaven voor de tegemoetkomingen en de
      uitvoeringskosten in rekening bij de Minister.

      6 Op de zesde dag van elke maand verstrekt het UWV aan de Minister een opgave van:

      a. overeenkomstig de bij deze regeling behorende [bijlage 1][ref4], het totaalbedrag aan geraamde uitgaven
      in die maand voor de tegemoetkomingen op grond van deze regeling inclusief de op grond van enige wet over de
      tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen in mindering kunnen worden
      gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente, proceskosten en rentelasten, en

      b. overeenkomstig de bij deze regeling behorende [bijlage 2][ref5], het totaalbedrag aan gerealiseerde uitgaven
      over de maand gelegen twee maanden voor die maand, aan tegemoetkomingen op grond van deze regeling inclusief de op
      grond van enige wet over de tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen
      in mindering kunnen worden gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente,
      proceskosten en rentelasten.

      7 In het jaarplan met begroting verstrekt het UWV elk jaar aan de Minister een opgave van het totaalbedrag aan
      geraamde uitvoeringskosten op grond van deze regeling in het komende jaar.

      8 Indien de in het zesde of zevende lid bedoelde dag een zaterdag, zondag of een algemeen erkende feestdag is,
      vindt de verstrekking plaats op de eerstvolgende dag die niet een zaterdag, zondag of een algemeen erkende feestdag
      is.

      9 Met als valutadag de elfde dag van elke maand draagt de Minister in die maand via de rekening-courant bij de
      Minister van Financiën af aan het UWV:

      a. het bedrag van de geraamde uitgaven voor de tegemoetkomingen op grond van deze regeling inclusief de op grond
      van enige wet over de tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen
      in mindering kunnen worden gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente,
      proceskosten en rentelasten, en

      b. ééntwaalfde van het bedrag aan geraamde uitvoeringskosten per jaar.

      De Minister kan, na overleg met het UWV, van deze bedragen afwijken.

      10 Met als valutadag de elfde dag van elke maand verrekent de Minister het verschil tussen de gerealiseerde
      uitgaven en de geraamde uitgaven voor de tegemoetkomingen op grond van deze regeling inclusief de op grond
      van enige wet over de tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen
      in mindering kunnen worden gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente,
      proceskosten en rentelasten, in de maand gelegen twee maanden voor die bedoeld in het negende lid, met het bedrag,
      bedoeld in het negende lid, onderdeel a.

      11 [Artikel 16, eerste lid, van de Algemene Regeling SZW-subsidies][ref6] is niet van toepassing op verstrekking
      van tegemoetkomingen krachtens deze regeling.

      12 Uiterlijk op 1 juni dient het UWV de afrekening van de tegemoetkomingen op grond van deze regeling en van de
      uitvoeringskosten over het afgelopen kalenderjaar bij de Minister in.

      13 In de afrekening, bedoeld in het dertiende lid, wordt, op basis van de jaarrekening, bedoeld in
      [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7], de kasstroom inzichtelijk gemaakt,
      en deze wordt afzonderlijk vermeld voor de tegemoetkomingen op grond van deze regeling inclusief de op grond
      van enige wet over de tegemoetkomingen door het UWV verschuldigde premies die niet op deze tegemoetkomingen
      in mindering kunnen worden gebracht en de uitgaven en ontvangsten die betrekking hebben op wettelijke rente,
      proceskosten en rentelasten alsmede voor de uitvoeringskosten verbonden aan de uitvoering van deze regeling.

      14 Op grond van de afrekening, bedoeld in het dertiende lid, vindt voor 15 juli een betaling plaats ten gunste of
      ten laste van het UWV.

      15 De Minister stelt jaarlijks voor 31 oktober de omvang van de middelen tot dekking van de uitgaven ter uitvoering
      van deze regeling vast, gespecificeerd overeenkomstig de bij deze regeling behorende [bijlage 2][ref8].


