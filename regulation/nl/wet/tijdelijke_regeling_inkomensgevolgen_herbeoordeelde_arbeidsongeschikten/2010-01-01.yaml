  - number: '3'
    text: |-
      1 De herbeoordeelde ontvangt een tegemoetkoming ter hoogte van het verschil tussen de
      arbeidsongeschiktheidsuitkering waar hij recht op had op de dag voor de datum van verlaging of intrekking van zijn
      arbeidsongeschiktheidsuitkering en de arbeidsongeschiktheidsuitkering waar hij recht op heeft vanaf die datum.
      Hierop wordt in mindering gebracht de toename van het inkomen uit of in verband met arbeid vanaf de datum van
      verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering ten opzichte van het inkomen uit of in verband met
      arbeid voor die datum.

      2 Indien met betrekking tot de herbeoordeelde op de dag voor de datum van verlaging of intrekking van zijn
      arbeidsongeschiktheidsuitkering [artikel 44 van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [artikel 58 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of
      [artikel 3:48 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3] werd toegepast, wordt
      voor de toepassing van het eerste lid als de arbeidsongeschiktheidsuitkering waar hij recht op had op
      die dag aangemerkt de arbeidsongeschiktheidsuitkering, zoals deze met betrekking tot die dag zou zijn
      vastgesteld, indien de door de herbeoordeelde verrichte arbeid wel de arbeid zou zijn die is bedoeld
      in respectievelijk [artikel 18, vijfde lid, van de Wet op de arbeidsongeschiktheidsuitkering][ref4],
      [artikel 2, vierde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] en
      [artikel 3:1, vijfde lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref6].

      3 Van een toename als bedoeld in het eerste lid is sprake, indien het inkomen uit of in verband met arbeid
      in de periode waarover recht op een tegemoetkoming bestaat, gemiddeld per dag hoger is dan het inkomen uit of
      in verband met arbeid in de zes kalendermaanden voorafgaand aan de datum van verlaging of intrekking van de
      arbeidsongeschiktheidsuitkering.

      4 Voor de toepassing van het derde lid wordt een periode waarover de tegemoetkoming op grond van
      [artikel 5, eerste lid][ref7], niet wordt betaald, aangemerkt als een periode waarover geen recht op tegemoetkoming
      bestaat.

      5 De arbeidsongeschiktheidsuitkering waar de herbeoordeelde recht op had op de dag voor de
      datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering, bedoeld in het
      eerste lid, wordt herzien met ingang van de dag waarop en de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder c, van de Wet minimumloon en minimumvakantiebijslag][ref8] wordt herzien.


