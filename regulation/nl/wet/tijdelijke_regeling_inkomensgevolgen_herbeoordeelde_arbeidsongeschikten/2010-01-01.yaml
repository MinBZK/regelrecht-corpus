  - number: 7c
    text: |-
      1 [Artikel 2][ref1] zoals dat luidde op de dag voor inwerkingtreding van artikel I van de Regeling uitbreiding
      doelgroep verlenging tegemoetkoming TRI, blijft van toepassing met betrekking tot een recht op tegemoetkoming dat
      is aangevraagd voor of op die dag.

      2 In afwijking van [artikel 2, eerste lid, tweede zin][ref2], kan een aanvraag op grond van dat artikel in ieder
      geval worden ingediend tot drie maanden na de dag van inwerkingtreding van de Regeling uitbreiding doelgroep
      verlenging tegemoetkoming TRI.

      3 De herbeoordeelde wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken voor of op 23 september 2006
      en die

      a. vóór de datum van inwerkingtreding van de Regeling uitbreiding doelgroep verlenging tegemoetkoming TRI een
      aanvraag om een tegemoetkoming heeft gedaan; en

      b. op 23 maart 2007 geen recht had op een tegemoetkoming of een werkloosheidsuitkering waarvan de hoogte is
      aangepast in verband met de verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering;

      heeft recht op een extra tegemoetkoming.

      4 De duur van de extra tegemoetkoming is zes maanden verminderd met de periodes waarover:

      a. de herbeoordeelde recht had op tegemoetkoming op grond van [artikel 2a][ref3]; en

      b. de herbeoordeelde recht had op een als gevolg van de verlaging of intrekking van de
      arbeidsongeschiktheidsuitkering ontstane of aangepaste werkloosheidsuitkering, gerekend vanaf zes maanden na de
      datum van verlaging of intrekking van zijn arbeidsongeschiktheidsuitkering.

      5 Het UWV stelt het recht op een extra tegemoetkoming op aanvraag vast. De aanvraag kan tot drie maanden na de
      datum van inwerkingtreding van de Regeling uitbreiding doelgroep verlenging tegemoetkoming TRI worden ingediend.
      Het recht gaat in op de datum van aanvraag, met dien verstande dat het recht niet eerder ontstaat dan op de datum
      van inwerkingtreding van die regeling. Met uitzondering van [artikel 2, eerste tot en met vierde lid][ref4], zijn
      de artikelen van deze regeling van toepassing op de extra tegemoetkoming.


