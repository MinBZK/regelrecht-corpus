  - number: 2a
    text: |-
      1 De herbeoordeelde die in de periode waarin hij recht heeft op tegemoetkoming op grond van
      [artikel 2, tweede, derde][ref1] en vierde lid, of [artikel 7c, derde lid][ref2], deelneemt aan een voor hem naar
      het oordeel van het UWV noodzakelijke opleiding of scholing, behoudt in afwijking van die artikelleden dat recht
      totdat die opleiding of scholing is beëindigd.

      2 Er is sprake van noodzakelijke opleiding of scholing als bedoeld in het eerste lid indien:

      a. de opleiding of scholing bestaat uit het systematisch verwerven van kennis dan wel vaardigheden volgens een
      vooraf vastgesteld programma, waarbij de verworven kennis en vaardigheden worden getoetst;

      b. aannemelijk is dat de werknemer niet zonder opleiding of scholing een voor hem passend beroep of functie kan
      uitoefenen op de arbeidsmarkt en dat de voorgestelde opleiding of scholing daartoe een adequaat middel is; en

      c. aannemelijk is dat de opleiding of scholing relevant is voor de arbeidsmarkt.

      3 Noodzakelijke opleiding of scholing bestaat in overwegende mate uit het verrichten van activiteiten die niet
      productie als doel hebben.

      4 Opleiding of scholing als bedoeld in het eerste lid duurt maximaal één jaar. Het UWV kan in individuele gevallen
      een opleiding of scholing van een langere duur toestaan, doch niet meer dan twee jaar.


