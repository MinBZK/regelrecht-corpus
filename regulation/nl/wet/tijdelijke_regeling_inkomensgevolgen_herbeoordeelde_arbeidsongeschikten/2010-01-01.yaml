  - number: '5'
    text: |-
      1 De tegemoetkoming wordt niet betaald:

      a. indien de herbeoordeelde niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1];

      b. voorzover de herbeoordeelde rechtens zijn vrijheid is ontnomen.

      2 Het eerste lid, onderdeel b, is niet van toepassing op categorieën van personen als bedoeld in
      [artikel 1 van het Besluit extramurale vrijheidsbeneming en sociale zekerheid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
