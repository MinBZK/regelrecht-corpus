  - number: '16'
    text: |-
      1 Indien het eindoordeel van de hertoetsing luidt als omschreven in [artikel 14 lid 3 onder c][ref1] stelt het
      college het bestuur daarvan in kennis.

      2 De in het vorige lid bedoelde in kennisstelling wordt begeleid van een deugdelijk gemotiveerd voorstel om een
      tuchtrechtelijke procedure tegen de verantwoordelijke accountant(s) aanhangig te maken, onder overhandiging door
      het toetsingsdossier.

      3 Het bestuur zal naar aanleiding van de omstandigheid als bedoeld in het eerste en tweede lid een tuchtrechtelijke
      procedure tegen de verantwoordelijke accountants) aanhangig maken, tenzij de redelijkheid of gewichtige redenen
      zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel14
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0014487
        artikel: '14'
        hoofdstuk: II
  - number: '17'
    text: |-
      1 Het college kan besluiten het eind oordeel als bedoeld in [artikel 14 lid 2][ref1] of het toetsingsdossier
      aan derden beschikbaar te stellen ten behoeve van de door deze derden uit te voeren beoordeling van de
      beroepsuitoefening door accountantskantoren) die hieraan verplicht zijn onderworpen.

      2 Aan de terbeschikkingstelling als bedoeld in het eerste lid kunnen voorwaarden worden verbonden.

      3 Het getoetste accountantskantoor alsmede de individuele accountant is niet gerechtigd enige informatie met
      betrekking tot de toetsing, in enige vorm of op enige wijze, aan derden kenbaar te maken.

      4 Het in het vorige lid bepaalde is niet van toepassing indien informatieverstrekking aan derden noodzakelijk is
      voor de uitvoering van de aanbevelingen en aanwijzingen van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel14
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014487
        artikel: '14'
        hoofdstuk: II
  - number: '18'
    text: |-
      1 Het college kan op verzoek van een koepel- of beroepsorganisatie het door deze organisatie ingestelde systeem van
      kwaliteitsborging accrediteren.

      2 Accreditatie houdt in dat de accountantskantoren, die lid zijn van de koepelorganisatie of waarvan de meerderheid
      van de maatschapsleden, vennoten, partners of hoe ook genaamd, lid is van de beroepsorganisatie, zijn vrijgesteld
      van toetsing door het college.

      3 Accountantskantoren die zijn onderworpen aan een systeem van kwaliteitsborging waarvoor een verzoek als bedoeld
      in lid 1 is ingediend, zijn gedurende de periode waarin het college op het verzoek nog geen beslissing heeft
      genomen, vrijgesteld van toetsing door het college.

      4 Ten behoeve van de accreditatie toetst het college de opzet en werking van het systeem van kwaliteitsborging.

      5 De accreditatie wordt verleend voor de duur van maximaal drie jaar. Verlenging voor telkens dezelfde termijn is
      mogelijk, indien en zolang als aan de door net college gestelde voorwaarden wordt voldaan.

      6 Het college kan te allen tijde de accreditatie intrekken.

      7 Het college zal aan de accreditatie voorwaarden verbinden.

      8 Het college kan te allen tijde de gestelde voorwaarden aanvullen of wijzigen indien het dit nodig acht voor het
      voortduren van de accreditatie.

      9 De koepel- of beroepsorganisatie doet onverwijld mededeling aan het college van wijzigingen in het
      geaccrediteerde systeem van kwaliteitsborging van de koepel- of beroepsorganisatie.

      10 Het college bericht de koepel- of beroepsorganisatie binnen een door het college te stellen termijn welke
      gevolgen de wijzigingen hebben voor de accreditatie.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel18
  - number: '19'
    text: |-
      1 Indien het eindoordeel naar aanleiding van een hertoetsing van een accountantskantoor door een koepel of
      beroepsorganisatie met een geaccrediteerd systeem van kwaliteitsborging de strekking heeft als omschreven in
      [artikel 14 lid 3 onder c][ref1], is deze koepel- of beroepsorganisatie gehouden het toetsingsdossier, opgesteld
      naar aanleiding van de hertoetsing, binnen twee weken na de vaststelling van het eindoordeel aan het college te
      zenden.

      2 Het college voert een toetsing uit op het van de koepel- of beroepsorganisatie ingevolge het eerste lid ontvangen
      toetsingsdossier. Ingeval het college oordeelt dat de koepel- of beroepsorganisatie in redelijkheid tot haar
      eindoordeel heeft kunnen komen vindt [artikel 16][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014487#Artikel16
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel19
