  - number: '20'
    text: |-
      1 Het college kan naar aanleiding van een daartoe door een accountantskantoor schriftelijk ingediend, gemotiveerd,
      verzoek besluiten tijdelijk vrijstelling van toetsing te verlenen.

      2 Tijdelijke vrijstelling kan slechts worden verleend op grond van bijzondere omstandigheden.

      3 Tijdelijke vrijstelling kan slechts worden verleend voor de duur van maximaal één jaar met de mogelijkheid tot
      verlenging.

      4 Een verzoek als bedoeld in het eerste lid, moet worden gedaan binnen vier weken na ontvangst van de mededeling
      als bedoeld in [artikel 9, lid 2][ref1], dat het accountantskantoor is geselecteerd voor toetsing.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel9
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel20
