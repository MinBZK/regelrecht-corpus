valid_to: '2008-12-31'
bwb_id: BWBR0014487
url: https://wetten.overheid.nl/BWBR0014487/2007-01-01
preamble:
  text: |-
    Gelet op artikel 19 van de Wet op de Registeraccountants;

    Stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening en de daarop rustende bepalingen wordt verstaan onder:

        - Orde: de Orde Koninklijk Nederlands Instituut van Registeraccountants;
        - bestuur het bestuur van de Orde;
        - college: het college toetsing kwaliteit
        - accountant: de openbaar accountant, de intern accountant en de overheidsaccountant, zoals gedefinieerd in de
      Verordening gedragscode;
        - accountantskantoor: de accountantspraktijk en de accountantsafdeling, zoals gedefinieerd in de Verordening
      gedragscode;
        - vestiging: een specifieke subgroep van een accountantskantoor, die wordt onderscheiden op basis van geografische
      criteria of op grond van eigenschappen van de praktijk;
        - koepelorganisatie: een organisatie waarbij een accountantskantoor is aangesloten en die het accountantskantoor
      bindende regels voor de kwaliteitsbeheersing heeft opgelegd, deze toetst en de naleving daarvan kan afdwingen;
        - beroepsorganisatie: een organisatie die aan de leden van die organisatie een dwingende inspanningsverplichting
      heeft opgelegd dat de accountantskantoren waarin zij optreden, beschikken over een intern
      kwaliteitsbeheersingsstelsel dat aan in Nederland algemeen aanvaarde normen voor de beroepsuitoefening voldoet, die
      de invoering en het gebruik van deze interne stelsels van kwaliteitsbeheersing bij de accountantskantoren toetst en
      die aan onvoldoende toetsingsresultaten adequate sancties tegen de betrokken leden verbindt;
        - stelsel van kwaliteitsbeheersing: de door een accountantskantoor getroffen maatregelen en ingestelde procedures
      voor de toetsing van de deskundigheid, de onafhankelijkheid en de kwaliteit van de werkzaamheden van de bij het
      accountantskantoor werkzame accountants en andere personen;
        - stelsel van kwaliteitsbewaking: de interne controle van het accountantskantoor op de naleving van de
      kwaliteitsbeheersingsmaatregelen;
        - systeem van kwaliteitsborging: de door een beroepsorganisatie of koepelorganisatie getroffen maatregelen en
      ingestelde procedures ter bevordering en handhaving van de deskundigheid, de onafhankelijkheid en de kwaliteit van
      de werkzaamheden van accountants en accountantskantoren;
        - (her)toetsing: de toetsing van de kwaliteit van de beroepsuitoefening van een accountant die optreedt in een
      accountantskantoor, door niet aan dat accountantskantoor gelieerde accountants aan de in Nederland algemeen
      aanvaarde normen voor de beroepsuitoefening;
        - onderzoeker: een persoon, belast met de uitvoering van de (her)toetsing van een accountantskantoor;
        - organisatie van openbaar belang: huishouding waarvoor bij het publiek een grote mate van belangstelling bestaat
      omdat de bedrijfsactiviteit, de omvang, het personeelsbestand of de bedrijfsstatus van dien aard is dat zij een
      breed scala van belanghebbenden bestrijkt, volgens een door het bestuur vast te stellen nadere uitwerking.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel1
  - number: '2'
    text: |-
      1 De accountant draagt er zorg voor dat het accountantskantoor waarin hij optreedt, beschikt over een intern
      stelsel van kwaliteitsbeheersing dat voldoet aan in Nederland algemeen aanvaarde normen voor de beroepsuitoefening.

      2 De in het eerste lid bedoelde normen zijn neergelegd in wettelijke voorschriften, verordeningen van de Orde, of
      worden door het bestuur – de leden gehoord – vastgelegd in nadere voorschriften, richtlijnen of meningsuitingen.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel2
  - number: '3'
    text: |-
      1 Teneinde de kwaliteit van de beroepsuitoefening van een accountant te kunnen beoordelen, wordt het
      accountantskantoor waarin de accountant optreedt aan toetsing onderworpen.

      2 De accountant spant zich ervoor in dat het accountantskantoor waarin hij optreedt, zijn medewerking verleent aan
      toetsing en de daaraan verbonden procedures als bedoeld in deze verordening.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel3
  - number: '4'
    text: |-
      1 De toetsing houdt een onderzoek in of het interne stelsel van kwaliteitsbeheersing in opzet en werking voldoet
      aan de in [artikel 2][ref1] bedoelde normen.

      2 De toetsing omvat alle vormen van dienstverlening van het accountantskantoor waarin de accountant optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel2
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014487
        artikel: '2'
        hoofdstuk: II
  - number: '5'
    text: |-
      1 Indien een accountantskantoor twee of meer vestigingen heeft, geldt de vestiging als eenheid van toetsing.

      2 Indien een accountantskantoor twee of meer vestigingen heeft, maakt een stelsel van kwaliteitsbewaking van de
      vestigingen onderdeel uit van het stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel5
  - number: '6'
    text: |-
      1 Er is een college toetsing kwaliteit.

      2 Het college is belast met de uitvoering van deze verordening.

      3 Het bestuur bepaalt het aantal leden en benoemt deze uit de leden van de Orde.

      4 Het bestuur wijst uit de leden van het college een voorzitter aan.

      5 De zittingsduur van de leden bedraagt maximaal drie jaar met eenmaal de mogelijkheid van herbenoeming voor
      wederom maximaal drie jaar. Degene die benoemd is ter vervulling van een tussentijds opengevallen plaats, treedt af
      op het tijdstip waarop degene in wiens plaats de benoeming is geschied had moeten aftreden.

      6 De leden van het college treden af volgens een door het bestuur vast te stellen rooster.

      7 De leden van het college ontvangen voor hun werkzaamheden een vergoeding van reis- en verblijfkosten en een
      vergoeding voor bestede tijd volgens door het bestuur vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel6
  - number: '7'
    text: |-
      1 De toetsing wordt uitgevoerd door één of meer onderzoekers. Ten minste één onderzoeker is accountant.

      2 Het college is belast met de selectie van de onderzoekers aan de hand van door het bestuur, op voorstel van het
      college, vastgestelde criteria.

      3 Voor elke uit te voeren toetsing stelt het college vast welke persoon (personen) als onderzoekers) zal (zullen)
      optreden, waarbij rekening wordt gehouden met aard en omvang van het te onderzoeken accountantskantoor en met
      mogelijke feiten en omstandigheden waardoor de onpartijdigheid van de onderzoekers) schade zou kunnen lijden.

      4 De onderzoeker ontvangt voor zijn werkzaamheden een vergoeding van reis- en verblijfkosten en een vergoeding voor
      bestede tijd volgens door het bestuur vast te stellen regelen.

      5 Met als doel kennis te nemen van de wijze van uitvoering van de Verordening op de kwaliteitstoetsing kan een
      medewerker van de AFM een toetsing bijwonen, in het kader van het voorbereiden van de taak van de AFM onder de
      [Wet toezicht accountantsorganisaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019468
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019468
  - number: '8'
    text: |-
      1 De onderzoeker voert de toetsing uit aan de hand van door het bestuur, op voorstel van het college, vastgestelde
      werkprogramma’s. De werkprogramma’s worden door het bestuur aan de leden van de Orde bekendgemaakt.

      2 Welk werkprogramma wordt toegepast, wordt bepaald aan de hand van door het bestuur, op voorstel van het college,
      vastgestelde criteria. De criteria worden door het bestuur aan de leden van de Orde bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel8
  - number: '9'
    text: |-
      1 Het college selecteert jaarlijks de accountantskantoren die in aanmerking komen voor een toetsing aan de hand van
      door het bestuur, op voorstel van het college, vastgestelde selectiecriteria, met inachtneming van het bepaalde in
      [artikel 10][ref1]. De criteria worden door het bestuur aan de leden van de Orde bekendgemaakt.

      2 Het college geeft het geselecteerde accountantskantoor te kennen dat het zal worden getoetst.

      3 Het college geeft het accountantskantoor minimaal zes weken van tevoren te kennen wanneer toetsing zal
      plaatsvinden en wie als onderzoeker is aangewezen.

      4 Indien geen medewerking aan de toetsing of de daaraan verbonden procedures wordt verleend zal een aanmaning
      tot medewerking door het college worden verstuurd. Indien binnen twee weken na verzending van de aanmaning geen
      medewerking wordt verleend, vindt de procedure van [artikel 16][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014487#Artikel16
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014487
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0014487
        artikel: '16'
        hoofdstuk: II
  - number: '10'
    text: |-
      1 Accountantskantoren die diensten verlenen aan organisaties van openbaar belang en/of beursgenoteerde
      ondernemingen worden eenmaal in de twee jaar aan toetsing onderworpen.

      2 Accountantskantoren die controle-opdrachten uitvoeren en geen diensten verlenen aan organisaties van openbaar
      belang en/of beursgenoteerde ondernemingen worden eenmaal in de vier jaar aan toetsing onderworpen.

      3 Accountantskantoren die geen controle-opdrachten uitvoeren en geen diensten verlenen aan organisaties van
      openbaar belang en/of beursgenoteerde ondernemingen worden eenmaal in de zes jaar aan toetsing onderworpen, met
      dien verstande dat deze termijn met twee jaar wordt ingekort indien het eindoordeel bij de laatst uitgevoerde
      (her)toetsing luidt als bedoeld in [artikel 14 lid 3 onder b of c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel14
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014487
        artikel: '14'
        hoofdstuk: II
  - number: '11'
    text: |-
      Jaarlijks stuurt het college alle accountantskantoren een vragenlijst teneinde inzicht in de specifieke situatie
      van deze kantoren te krijgen.

      Deze vragenlijst dient uiterlijk binnen vier weken ingevuld te worden geretourneerd.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het accountantskantoor stelt aan de onderzoeker alle gegevens ter beschikking, die deze nodig acht voor de
      vervulling van zijn werkzaamheden.

      2 Indien zich over de wijze van uitvoering van de toetsing een meningsverschil voordoet tussen het
      accountantskantoor en de onderzoeker zal de onderzoeker de kwestie voorleggen aan het college, dat zo snel
      mogelijk een uitspraak doet. Indien het accountantskantoor dan wel de onderzoeker zich niet kan verenigen met
      deze uitspraak, kan binnen zes weken na de uitspraak van het college de meest gerede partij het bestuur vragen een
      definitieve beslissing te nemen.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel12
  - number: '13'
    text: |-
      1 De onderzoeker neemt ter afronding van de toetsing, op hoofdlijnen zijn bevindingen door met het
      accountantskantoor.

      2 De onderzoeker stelt binnen een door het college te stellen termijn een conceptrapport op.

      3 Het conceptrapport als bedoeld in het tweede lid omvat naast de bevindingen van de onderzoeker tevens een
      deugdelijk gemotiveerd voorstel voor een oordeel als bedoeld in [artikel 14 lid 3][ref1].

      4 In het geval het voorstel voor een oordeel van de onderzoeker luidt als omschreven in
      [artikel 14 lid 3 onder b of c][ref2], zal de onderzoeker tevens een voorstel ten behoeve van het college doen,
      inhoudende aanbevelingen respectievelijk aanwijzingen voor het treffen van maatregelen ter verbetering.

      5 De onderzoeker stuurt het conceptrapport naar het accountantskantoor.

      6 Het accountantskantoor kan binnen twee weken schriftelijk commentaar op het conceptrapport zenden aan de
      onderzoeker.

      7 Binnen drie weken na afloop van de in het vorige lid bedoelde termijn maakt de onderzoeker zijn rapport
      definitief, en zendt dit onverwijld toe aan het college en het accountantskantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014487#Artikel14
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014487
        artikel: '14'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0014487
        artikel: '14'
        hoofdstuk: II
  - number: '14'
    text: |-
      1 Het accountantskantoor kan binnen een door het college te stellen termijn schriftelijk commentaar op het
      definitieve rapport van de onderzoeker aan het college zenden.

      2 Het college toetst het definitieve rapport en stelt naar aanleiding hiervan en het eventuele commentaar als
      bedoeld in het vorige lid een eindoordeel vast dat het binnen twee maanden na afloop van de in het eerste lid
      bedoelde termijn ter kennis brengt van het accountantskantoor.

      3 Het eindoordeel kan als volgt luiden:

      a. het interne stelsel van kwaliteitsbeheersing voldoet aan de in Nederland algemeen aanvaarde nonnen voor de
      beroepsuitoefening;

      b. het interne stelsel van kwaliteitsbeheersing voldoet aan de in Nederland algemeen aanvaarde normen voor de
      beroepsuitoefening, maar is vatbaar voor verbetering;

      c. het interne stelsel van kwaliteitsbeheersing voldoet niet aan de in Nederland algemeen aanvaarde normen voor
      de beroepsuitoefening.

      4 Indien het eindoordeel luidt als omschreven onder b of c van het vorige lid gaat het eindoordeel vergezeld van
      aanbevelingen respectievelijk aanwijzingen voor het treffen van maatregelen ter verbetering.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel14
  - number: '15'
    text: |-
      1 In het geval dat het eindoordeel luidt als omschreven in [artikel 14 lid 3 onder c][ref1], dient het
      accountantskantoor binnen een door het college te stellen termijn een verbeterplan bij het college in, dat
      gebaseerd is op de bij het eindoordeel gegeven aanwijzingen.

      2 Het in het eerste lid bedoelde verbeterplan dient te worden goedgekeurd door een daartoe door het college
      geaccrediteerde registeraccountant of organisatie.

      3 Na afloop van de in het eerste lid bedoelde termijn vindt er een gesprek plaats tussen het college en het
      accountantskantoor over het door het accountantskantoor ingediende verbeterplan.

      4 In het in het vorige lid bedoelde gesprek worden bindende afspraken gemaakt teneinde het stelsel van
      kwaliteitsbeheersing van het accountantskantoor binnen een bepaalde termijn aan de normen als bedoeld in
      [artikel 2][ref2] te laten voldoen.

      5 De in het vorige lid bedoelde afspraken worden door het college op schrift gesteld en ter ondertekening aan het
      accountantskantoor gezonden.

      6 Het college zal na afloop van de in vierde lid bedoelde termijn een hertoetsing laten uitvoeren bij het
      accountantskantoor.

      7 De hertoetsing geschiedt door tenminste twee onderzoekers, waarvan ten minste één onderzoeker een ander is dan
      degene, die de eerste toetsing heeft uitgevoerd. [Artikel 7, lid 3][ref3], [artikel 13][ref4] en [artikel 14][ref5]
      zijn op de aanwijzing van de onderzoekers, respectievelijk op de procedure van de toetsing, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014487#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0014487#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0014487#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0014487#Artikel14
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel15
