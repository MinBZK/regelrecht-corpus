        artikel: '9'
        hoofdstuk: II
  - number: '21'
    text: |-
      1 Het college kan op verzoek van een accountantskantoor besluiten de toetsing te doen uitvoeren door onderzoekers
      van een door het accountantskantoor in zijn verzoek genoemd ander accountantskantoor, in plaats van door
      onderzoekers, aangewezen door het college conform [artikel 7][ref1].

      2 Een verzoek als bedoeld in het eerste lid, dient te worden gedaan binnen vier weken na de mededeling als bedoeld
      in [artikel 9, lid 2][ref2], dat het accountantskantoor is geselecteerd voor toetsing.

      3 Het college zal aan zijn besluit voorwaarden verbinden.

      4 De toetsing als bedoeld in het eerste lid wordt uitgevoerd aan de hand van een door het college goedgekeurd
      werkprogramma.

      5 Het college stelt nadere criteria vast waaraan alle bij de uitvoering van de toetsing betrokken personen dienen
      te voldoen.

      6 Indien de toetsing niet volgens de voorwaarden wordt of is uitgevoerd of in geval van andere gewichtige redenen
      kan het college besluiten tot eigen toetsing over te gaan.

      7 Het accountantskantoor, dat de toetsing uitvoert, is gehouden het toetsingsdossier, opgesteld naar aanleiding van
      de toetsing, binnen zes weken na de toetsing aan het college te zenden.

      8 Het college toetst het van het toetsende accountantskantoor ontvangen toetsingsdossier.

      9 Indien een hertoetsing volgens [artikel 15, lid 6][ref3], noodzakelijk is, kan het college besluiten die
      hertoetsing door onderzoekers van hetzelfde accountantskantoor te doen uitvoeren, mits dit niet dezelfde personen
      zijn die de eerste toetsing hebben uitgevoerd.

      Ingeval het oordeel na een hertoetsing de strekking heeft als omschreven in [artikel 14 lid 3 onder c][ref4] vindt
      [artikel 16][ref5] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014487#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0014487#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0014487#Artikel14
