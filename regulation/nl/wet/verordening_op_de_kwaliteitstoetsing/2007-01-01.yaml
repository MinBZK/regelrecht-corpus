  - number: '22'
    text: |-
      1 Jaarlijks brengt het college aan het bestuur een verslag uit omtrent zijn werkzaamheden, waaronder een
      geanonimiseerd overzicht van de eindoordelen naar aanleiding van de in het afgelopen jaar gehouden toetsingen,
      opgesteld volgens de indeling van [artikel 10][ref1].

      2 Jaarlijks brengt het bestuur, na het in het eerste lid bedoelde verslag te hebben ontvangen, een geanonimiseerd
      verslag uit aan de leden van de Orde over de werkzaamheden van het college en de uitkomsten van de toetsingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel10
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel22
