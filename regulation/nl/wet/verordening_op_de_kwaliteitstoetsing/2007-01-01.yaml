        artikel: '10'
        hoofdstuk: II
  - number: '23'
    text: |-
      1 Voor de registeraccountant die betrokken is bij de uitvoering van deze verordening en daarbij kennis neemt
      van feiten of omstandigheden waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden,
      geldt buiten de gevallen voorzien in deze verordening een geheimhoudingsplicht terzake van die gegevens. Van
      vertrouwelijke gegevens in het kader van de toetsing verkregen, kan geen verder en ander gebruik worden gemaakt dan
      bij of krachtens deze verordening is vereist.

      2 De registeraccountant draagt er zorg voor dat voor of met hem werkzame personen zijn onderworpen aan de in het
      eerste lid omschreven geheimhouding.

      3 De registeraccountant is ter zake van de voldoening aan de in deze verordening opgenomen verplichtingen tegenover
      het college en de onderzoeker(s) ontheven van de plicht tot geheimhouding als bedoeld in artikel A-100.4, onderdeel
      d, en hoofdstuk A-140 van de Verordening gedragscode.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel23
  - number: '24'
    text: |-
      De kosten van de toetsing door het college zijn volgens door het bestuur, op voorstel van het college, vast te
      stellen tarieven voor rekening van het betrokken accountantskantoor. De tarieven worden door het bestuur aan de
      leden van de Orde bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel24
  - number: '25'
    text: |-
      1 De Verordening op de collegiale toetsing van 12 december 1996 wordt ingetrokken met dien verstande dat zij van
      toepassing blijft op aanhangige toetsingen.

      2 Besluiten genomen op basis van de Verordening op de collegiale toetsing van 12 december 1996 blijven van kracht
      voorzover overeenkomstige bevoegdheid bij of krachtens deze verordening is gegeven.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel25
  - number: '26'
    text: |-
      Het bestuur is bevoegd om nadere voorschriften vast te stellen terzake van de bij deze verordening geregelde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel26
  - number: '27'
    text: |-
      1 De verordening treedt in werking op 1 januari 2003.

      2 Deze verordening kan worden aangehaald als: Verordening op de kwaliteitstoetsing.
    url: https://wetten.overheid.nl/BWBR0014487/2007-01-01#Artikel27
