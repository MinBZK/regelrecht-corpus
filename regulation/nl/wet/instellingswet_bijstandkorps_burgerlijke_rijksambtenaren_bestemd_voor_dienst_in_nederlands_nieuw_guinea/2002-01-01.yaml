---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: instellingswet_bijstandkorps_burgerlijke_rijksambtenaren_bestemd_voor_dienst_in_nederlands_nieuw_guinea
regulatory_layer: WET
publication_date: '2001-11-01'
valid_from: '2002-01-01'
bwb_id: BWBR0002370
url: https://wetten.overheid.nl/BWBR0002370/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de voortschrijdende ontwikkeling in Nederlands-Nieuw-
    Guinea wenselijk is bij de wet regelen te stellen betreffende de rechtstoestand van Nederlanders, die ten dienste
    van het openbaar bestuur aldaar werkzaam zijn of zullen zijn;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: het Bijstandkorps:
      het Bijstandkorps bedoeld in [artikel 2][ref1]; Onze Minister: Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties; de Gouverneur: de Gouverneur van Nederlands-Nieuw-Guinea; Nederlander: Nederlander in de zin
      van de wet op het Nederlanderschap en het ingezetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel2
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '2'
  - number: '1.2'
    text: |-
      Tenzij het tegendeel blijkt, zijn in deze wet onder leden van het Bijstandkorps gewezen leden van dat korps
      begrepen.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel1
  - number: '2.1'
    text: Er is een Bijstandkorps van burgerlijke rijksambtenaren, dat bestemd is voor dienst in Nederlands-Nieuw-Guinea.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel2
  - number: '2.2'
    text: De leden van het Bijstandkorps worden in openbare dienst aangesteld om in Nederlands-Nieuw-Guinea werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Zij worden als zodanig met inachtneming van bij of krachtens algemene maatregel van bestuur te stellen regelen door
      Ons of door Onze Minister aangesteld en ontslagen.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel2
  - number: '3.1'
    text: Alleen Nederlanders kunnen tot lid van het Bijstandkorps worden aangesteld.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel3
  - number: '3.2'
    text: Wij kunnen in bijzondere gevallen anderen dan Nederlanders tot lid van het Bijstandkorps aanstellen.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      De leden van het Bijstandkorps worden, tenzij het tot aanstelling bevoegde gezag anders bepaalt, ter beschikking
      gesteld van het bevoegde gezag van Nederlands-Nieuw-Guinea om, met inachtneming van het bepaalde in de akte van
      aanstelling tot lid van het Bijstandkorps, te worden aangesteld in de daarvoor in aanmerking komende ambten van
      Nederlands-Nieuw-Guinea.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Ontslag van de leden van het Bijstandkorps als landsdienaar beëindigt niet tevens het lidmaatschap van het
      Bijstandkorps, tenzij bij algemene maatregel van bestuur anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel4
  - number: '5'
    text: 'De rechten en verplichtingen van de leden van het Bijstandkorps worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel5
  - number: 5.a
    text: door hetgeen bij of krachtens deze wet wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel5
  - number: 5.b
    text: |-
      door de voorschriften, welke met betrekking tot de in [artikel 4][ref1] bedoelde ambten zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel4
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '4'
  - number: '6.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ten aanzien van de leden van het Bijstandkorps, de Centrale
      Commissie voor Georganiseerd Overleg in Ambtenarenzaken gehoord, voorschriften vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.a
    text: aanstelling, schorsing en ontslag;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.b
    text: bij aanstelling toe te kennen voorlopige wedde;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.c
    text: uitzending en terbeschikkingstelling en daarmede verband houdende rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.d
    text: wedde - waarin een vergoeding voor expatriatie is begrepen - en toelagen;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.e
    text: aanspraken in geval van ziekte;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.f
    text: buiten Nederlands-Nieuw-Guinea door te brengen verloven;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.g
    text: aanspraken in het geval dat de bestemming in Nederlands-Nieuw-Guinea vervalt;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.h
    text: aanspraken bij ontslag;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.i
    text: |-
      de beperking van cumulatie van aanspraken op wedde, bezoldiging, vergoedingen en andere financiële aanspraken,
      welke de leden van het Bijstandkorps als zodanig en uit hoofde van het door hen beklede ambt van Nederlands-Nieuw-
      Guinea hetzij onder gelijke benaming, hetzij onder andere benaming bezitten;
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: 6.1.j
    text: instelling van een bijzondere commissie van overleg in Nederlands-Nieuw-Guinea.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Op gelijke wijze als in het eerste lid is bepaald kunnen ten aanzien van de leden van het Bijstandkorps
      voorschriften worden vastgesteld betreffende andere onderdelen van de rechtspositie dan die, welke in dat lid zijn
      genoemd.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel6
  - number: '8'
    text: |-
      Onder bij algemene maatregel van bestuur vast te stellen voorwaarden kunnen leden van het Bijstandkorps worden
      verplicht tijdelijk buiten Nederlands-Nieuw-Guinea werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel8
  - number: '9'
    text: |-
      Leden van het Bijstandkorps, die deel uitmaken van de zittende magistratuur in Nederlands-Nieuw-Guinea, kunnen,
      zolang zij een zodanige functie bekleden, niet dan op hun eigen verzoek als lid van het Bijstandkorps worden
      ontslagen noch als zodanig worden geschorst. Zij kunnen gedurende dat tijdvak niet worden verplicht tijdelijk
      buiten Nederlands-Nieuw-Guinea werkzaam te zijn. Hun kunnen geen voordelen worden onthouden welke de krachtens
      [artikel 6][ref1] vastgestelde voorschriften aan vergelijkbare leden van het Bijstandkorps toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel6
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '6'
  - number: '15.1'
    text: |-
      Met inachtneming van het overigens in deze wet terzake bepaalde worden aan gewezen leden van het Bijstandkorps,
      die als lid van dat korps in vaste dienst waren aangesteld, en hun weduwen en wezen, alsmede aan de weduwen en
      wezen van in vaste dienst aangestelde leden van genoemd korps, pensioenen en uitkeringen toegekend overeenkomstig
      het bij ordonnantie van 29 december 1958 (*Gouvernementsblad* No. 83) vastgestelde Pensioenreglement Nederlands-
      Nieuw-Guinea - verder aan te duiden als "het pensioenreglement" - zoals dat op de dag van inwerkingtreding van deze
      wet luidt.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel15
  - number: '15.2'
    text: |-
      Voor de toepassing van het eerste lid worden de leden van het Bijstandkorps, die als lid van dat korps in vaste
      dienst zijn aangesteld, aangemerkt als landsdienaren in de zin van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel15
  - number: '15.3'
    text: De leden van het Bijstandkorps zijn als zodanig geen ambtenaar in de zin van de Pensioenwet 1922 (*Stb.* 240).
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      De bij of krachtens het pensioenreglement aan de Gouverneur of andere gezaghebbenden in Nederlands-Nieuw-Guinea
      toegekende bevoegdheden worden uitgeoefend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      Verzoeken om toekenning van pensioen dienen te worden gericht aan Onze Minister onder overlegging van een
      verklaring dat belanghebbende de pensioenen en uitkeringen krachtens de voor landsdienaren van Nederlands-Nieuw-
      Guinea geldende pensioenregeling, welke ingevolge [artikel 21][ref1] geheel of gedeeltelijk in mindering kunnen
      worden gebracht, heeft aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel21
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '21'
  - number: '17.1'
    text: |-
      Bij de toepassing van [artikel 15][ref1] wordt de in [het eerste lid van artikel 6 onder ][ref2] bedoelde wedde
      als bezoldiging aangemerkt met dien verstande, dat voor vaststelling van de pensioengrondslag mede in aanmerking
      worden genomen de tot het tijdstip van inwerkingtreding van deze wet genoten bezoldigingen in de zin van het
      Pensioenreglement Nederlands-Nieuw-Guinea.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002370#Artikel6
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002370
        artikel: '6'
  - number: '17.2'
    text: |-
      Als pensioengrondslag van een gewezen lid van het Bijstandkorps, dat nog niet tot landsdienaar was aangesteld,
      wordt aangemerkt de wedde, waarop bij aanstelling tot landsdienaar recht zou zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel17
  - number: '18'
    text: |-
      Het ontslag van een lid van het Bijstandkorps, verleend omdat zijn bestemming in Nederlands-Nieuw-Guinea om
      uitsluitend bij de dienst gelegen redenen vervalt, wordt aangemerkt als een ontslag, bedoeld in artikel 9, vierde
      lid, van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      Krachtens deze wet wordt slechts pensioen toegekend aan degene, die op de dag, waarop het recht op pensioen
      ontstaat, Nederlander is.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel19
  - number: '19.2'
    text: Een krachtens deze wet toegekend pensioen vervalt indien de gepensioneerde niet langer Nederlander is.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel19
  - number: '19.3'
    text: |-
      In geval van toepassing van [het tweede lid van artikel 3][ref1] kan krachtens deze wet niettemin ook pensioen
      worden toegekend aan het gewezen lid van het Bijstandkorps, dat op de dag, waarop het recht op pensioen ontstaat,
      dezelfde nationaliteit bezit als bij zijn aanstelling tot lid van het Bijstandkorps, alsmede aan de nabestaanden
      van een overleden lid of gewezen lid van het Bijstandkorps, die op die dag dezelfde nationaliteit bezitten als dat
      lid of gewezen lid bij aanstelling tot lid van het Bijstandkorps bezat.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel3
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '3'
  - number: '19.4'
    text: |-
      In geval van toepassing van het derde lid vervalt een krachtens deze wet toegekend pensioen, indien de
      gepensioneerde niet langer de in dat lid bedoelde nationaliteit bezit, tenzij de belanghebbende Nederlander is
      geworden.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel19
  - number: '19.5'
    text: |-
      Onze Minister kan in overeenstemming met Onze Ministers van Financiën en van Sociale Zaken en Volksgezondheid in
      bijzondere gevallen bepalen, dat het recht op toekenning van een pensioen of het recht op een toegekend pensioen
      gehandhaafd blijft na wijziging in nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel19
  - number: '19.6'
    text: Voor de toepassing van dit artikel wordt statenloosheid als een vreemde nationaliteit aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel19
  - number: '20'
    text: |-
      De financiële aanspraken van de leden van het Bijstandkorps, voortvloeiende uit hetgeen krachtens [artikel 6][ref1]
      wordt bepaald, alsmede de krachtens deze wet toegekende pensioenen en uitkeringen, komen ten laste van 's Rijks
      begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel6
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '6'
  - number: '21.1'
    text: |-
      Op de pensioenen en uitkeringen, toegekend krachtens [artikel 15][ref1], wordt in mindering gebracht de tegenwaarde
      in euro's van de pensioenen en uitkeringen, welke de belanghebbenden ontvangen krachtens de voor landsdienaren van
      Nederlands-Nieuw-Guinea geldende pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel15
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '15'
  - number: '21.2'
    text: |-
      Indien het krachtens [artikel 15][ref1] toegekende pensioen over kortere pensioendiensttijd is berekend dan
      het pensioen, waarop de belanghebbende krachtens de voor landsdienaren van Nederlands-Nieuw-Guinea geldende
      pensioenregeling recht heeft, wordt slechts in mindering gebracht het gedeelte van het krachtens laatstbedoelde
      regeling ontvangen pensioen, dat betrekking heeft op het gedeelte van de pensioendiensttijd van dat pensioen,
      samenvallende met de pensioendiensttijd van het pensioen krachtens [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002370#Artikel15
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002370
        artikel: '15'
  - number: '21.3'
    text: Bij de toepassing van dit artikel worden algemene toeslagen en kortingen op de pensioenen in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel21
  - number: '22'
    text: |-
      Indien belanghebbenden geen pensioen of uitkering krachtens de voor landsdienaren van Nederlands-Nieuw-
      Guinea geldende pensioenregeling ontvangt en door hem geen verklaring werd overgelegd als bedoeld in het
      [tweede lid van artikel 16][ref1], wordt op het pensioen en de uitkering, toegekend krachtens [artikel 15][ref2],
      in mindering gebracht hetgeen in mindering zou zijn gebracht, indien het bepaalde in [artikel 21][ref3] toepassing
      had kunnen vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002370#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002370#Artikel21
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002370
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002370
        artikel: '21'
  - number: '23.1'
    text: |-
      Op de pensioenen, toegekend krachtens [artikel 15][ref1], zijn, bij een gelijktijdige aanspraak op pensioen
      krachtens de [Algemene Ouderdomswet][ref2] of de [Algemene nabestaandenwet][ref3], de wetten van 20 december 1956
      (*Stb.* 616) en 23 september 1959 (*Stb.* 340) van overeenkomstige toepassing, met dien verstande:


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0007795
  - number: 23.1.a
    text: |-
      dat voor de toepassing van deze wetten de pensioendiensttijd met 8/5 wordt vermenigvuldigd, tot een maximum van 40
      jaren, en voor de toepassing van de eerstgenoemde wet vervolgens wordt verminderd met de tijd gedurende welke na 1
      januari 1957 geen premie is verschuldigd geweest krachtens de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 23.1.b
    text: |-
      dat artikel 3, vierde en vijfde lid, van de wet van 20 december 1956 (*Stb.* 616), zomede artikel 14 van de wet
      van 23 september 1959 (*Stb.* 340) buiten toepassing blijven, indien het aldaar bedoelde andere pensioen is een
      pensioen als bedoeld in de artikelen 1 en 7 van de wet van 20 december 1956 (*Stb.* 616), in de artikelen 1 en 24
      van de wet van 23 september 1959 (*Stb.* 340), of in de artikelen 1 en 8 van de wet van 31 januari 1957 (*Stb.*
      30), dan wel een pensioen omschreven in [artikel 2, eerste lid, onder ][ref1] ( *Stb.* 1957, 319).


      [ref1]: https://wetten.overheid.nl/BWBR0002251#Artikel2
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002251
        artikel: '2'
  - number: '23.3'
    text: |-
      De bepalingen van dit artikel blijven buiten toepassing voor degenen, die op grond van gemoedsbezwaren hun
      aanspraak op uitkering op grond van de [Algemene nabestaandenwet][ref1] niet geldig maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '25.1'
    text: |-
      Nederlanders, die op het tijdstip van inwerkingtreding van deze wet in dienst van het Gouvernement van Nederlands-
      Nieuw-Guinea zijn anders dan op arbeidsovereenkomst, en op wie de "Bezoldigingsregeling Landsdienaren Nederlands-
      Nieuw-Guinea 1957" (*Gouvernementsblad* No. 24) van toepassing is, worden geacht op dat tijdstip aangesteld te zijn
      als lid van het Bijstandkorps.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      De in [artikel 6][ref1] bedoelde algemene maatregel van bestuur stelt ter uitvoering van het in het eerste lid
      bepaalde nadere overgangsregelingen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel6
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '6'
  - number: '26'
    text: |-
      Bij de toepassing van [artikel 15][ref1] op gewezen leden van het Bijstandkorps, die krachtens het bepaalde in het
      eerste lid van artikel 25 lid van dat korps waren en hun weduwen en wezen, alsmede op de weduwen en wezen van leden
      van het Bijstandkorps, die krachtens evengenoemde bepaling lid van het Bijstandkorps waren, is de ordonnantie van
      29 december 1958 (*Gouvernementsblad* no. 83), zoals die op de dag van inwerkingtreding van deze wet luidt, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel15
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '15'
  - number: '27.1'
    text: |-
      De ten laste van de begroting van Nederlands-Nieuw-Guinea komende pensioenen, welke voor de dag van
      inwerkingtreding van deze wet zijn toegekend aan hen, die op die dag Nederlander zijn, worden geacht mede krachtens
      deze wet te zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      Op de voet van deze wet worden mede pensioenen toegekend aan gewezen landsdienaren, die voor de dag van
      inwerkingtreding van deze wet zijn ontslagen met uitzicht op pensioen ten laste van de begroting van Nederlands-
      Nieuw-Guinea en aan hun weduwen en wezen, indien belanghebbenden op de dag, waarop recht ontstaat op pensioen ten
      laste van die begroting, Nederlander zijn.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel27
  - number: '28.1'
    text: |-
      Het Rijk vergoedt aan de besturen van instellingen van bijzonder onderwijs de aanspraken van hun personeel, ten
      behoeve waarvan ten laste van de begroting van Nederlands-Nieuw-Guinea subsidie wordt genoten en dat Nederlander
      is, welke overeenkomen met die, welke overeenkomstig personeel bij het openbaar onderwijs ontleent of zou ontlenen
      aan hetgeen krachtens [artikel 6][ref1] wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel6
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '6'
  - number: '28.2'
    text: |-
      Het in het eerste lid bedoelde personeel in dienst van instellingen van bijzonder onderwijs wordt voor de
      toepassing van de [artikelen 15 tot en met 19][ref1] en [21 tot en met 24][ref2] geacht lid van het Bijstandkorps
      te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002370#Artikel21
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002370
        artikel: '21'
  - number: '28.3'
    text: |-
      Op de voet van deze wet worden mede pensioenen toegekend aan voor de dag van inwerkingtreding van deze wet met
      uitzicht op pensioen ten laste van de begroting van Nederlands-Nieuw-Guinea ontslagen personeel als bedoeld in het
      eerste lid en aan de weduwen en wezen van dat personeel, indien belanghebbenden op de dag waarop recht ontstaat op
      pensioen ten laste van die begroting, Nederlander zijn.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel28
  - number: '29'
    text: |-
      Onze Minister en Onze Minister van Financiën kunnen bij gemeenschappelijke beschikking en onder daarbij te stellen
      voorwaarden aan rechtspersonen een overeenkomstige vergoeding als bedoeld in [het eerste lid van artikel 28][ref1]
      toekennen ter vergoeding van aanspraken van personeel, waarvan de bezoldiging uit de openbare kas
      van Nederlands-Nieuw-Guinea wordt bekostigd en hetwelk Nederlander is. Daarbij kan het bepaalde in
      [het tweede en het derde lid van artikel 28][ref2] van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002370#Artikel28
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002370
        artikel: '28'
  - number: '30'
    text: |-
      De bepalingen van [Titel II van de Ambtenarenwet 1929][ref1] vinden overeenkomstige toepassing op de wedde en
      toelagen, alsmede op de pensioenen, waarop de leden van het Bijstandkorps, dan wel hun weduwen en wezen aanspraak
      hebben ingevolge het bij en krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '31'
    text: |-
      Tegenover de Staat beschikt de gehuwde vrouw zelfstandig over de wedde en toelagen of over het pensioen, aan haar
      als lid of als gewezen lid van het Bijstandkorps door de Staat verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel31
  - number: '32'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën in bijzondere gevallen het bepaalde in
      [artikel 27][ref1], het [eerste en derde lid van artikel 28][ref2], en [artikel 29][ref3] van toepassing verklaren
      ten aanzien van anderen dan Nederlanders.


      [ref1]: https://wetten.overheid.nl/BWBR0002370#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002370#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002370#Artikel29
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002370
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002370
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002370
        artikel: '29'
  - number: '33'
    text: Deze wet treedt in werking met ingang van een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002370/2002-01-01#Artikel33
