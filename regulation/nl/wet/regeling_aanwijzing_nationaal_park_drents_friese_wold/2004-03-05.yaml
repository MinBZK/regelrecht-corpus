  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             overlegorgaan:

              overlegorgaan als bedoeld in [artikel 3][ref1];



            c
             nationaal park:

              gebied zoals omschreven in het Structuurschema Groene Ruimte (kamerstukken II 1992/93, 22880, nr. 5, blz.
      9).


      [ref1]: https://wetten.overheid.nl/BWBR0011550#Artikel3
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011550
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het natuurgebied Drents-Friese Wold, zoals aangegeven op de als bijlage bij
      deze regeling behorende kaart.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Drents-Friese Wold.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel3
  - number: '4'
    text: |-
      1 Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting, het beheer en het functioneren van het
      nationaal park Drents-Friese Wold overeenkomstig de doelstellingen van een nationaal park.

      2 Tot de taak, bedoeld in het eerste lid, behoort onder meer:

      a. het actualiseren van het beheers- en inrichtingsplan;

      b. het streven naar onderlinge afstemming van alle voor de inrichting en beheer van belang zijnde plannen en
      activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding van de voor het nationaal park Drents-Friese Wold
      beschikbare middelen in het kader van een jaarlijks voortschrijdend meerjarenprogramma met bijbehorende begroting;

      d. besteding van gelden op basis van het door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de besteding van gelden en coördinatie van de uitvoering van projecten binnen het kader
      van het beheers- en inrichtingsplan;

      e. het opstellen van een meerjarenprogramma voorlichting en educatie ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park Drents-Friese Wold.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park
      Drents-Friese Wold van 30 september 1998 en met inachtneming van hetgeen te dien aanzien bij brief 22 juli 1999,
      kenmerk DN. 993082, is gesteld.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. een door de minister te benoemen lid, tevens voorzitter;

      b. door de minister te benoemen leden, als vertegenwoordiger en op voordracht van respectievelijk:

      1. de provincie Drenthe;

      2. de provincie Friesland;

      3. de gemeente Diever;

      4. de gemeente Smilde;

      5. de gemeente Ooststellingwerf;

      6. het recreatieschap Zuid-West Drenthe;

      7. het waterschap Wold en Wieden en het waterschap Meppelerdiep;

      8. het waterschap de Stellingwerven en het waterschap de Tjonger-Compagnonsvaarten;

      9. Staatsbosbeheer;

      10. de stichting Het Drentse Landschap;

      11. de stichting Maatschappij van Weldadigheid;

      12. de vereniging Natuurmonumenten;

      c. een door de minister te benoemen lid als vertegenwoordiger van de bij het nationaal park Drents-Friese Wold
      betrokken agrarische grondeigenaren en grondgebruikers;

      d. een door de minister op voordracht van het overlegorgaan te benoemen lid als vertegenwoordiger van de bij het
      nationaal park Drents-Friese Wold betrokken kleine particuliere boseigenaren;

      e. een door de minister op voordracht van het overlegorgaan te benoemen lid als vertegenwoordiger van de
      toeristisch/recreatieve sector;

      f. de directeur van de Directie LNV Regio Noord van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel6
  - number: '7'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Drenthe te benoemen ambtenaar in dienst
      bij deze provincie.

      2 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationale park Drents-Friese Wold verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel8
  - number: '9'
    text: De Regeling aanwijzing nationaal park in oprichting Drents-Friese Woud wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant, waarin het wordt
      geplaatst en werkt terug tot en met 22 juli 1999.
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park Drents-Friese Wold.'
    url: https://wetten.overheid.nl/BWBR0011550/2004-03-05#Artikel11
