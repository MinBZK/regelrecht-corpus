  - number: '4'
    text: |-
      1 De voorzitter kan de erkenning van een laboratorium schorsen voor een door hem te bepalen termijn indien het
      laboratorium niet voldoet aan één of meer van de erkenningsvoorwaarden als bedoeld in de [bijlagen I][ref1],
      [II][ref2] of [III][ref3].

      2 In geval van een schorsing van de erkenning als bedoeld in het eerste lid, voert het laboratorium de activiteit
      waarvoor het geschorst is niet uit onder de betreffende erkenning.

      3 De voorzitter kan de erkenning van een laboratorium geheel of gedeeltelijk intrekken indien:

      a. het laboratorium zich niet houdt aan het bepaalde in het tweede lid;

      b. indien het laboratorium detectie en serotypering uitvoert in het kader van
      de [Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007][ref4], de
      [Verordening hygiënevoorschriften pluimveeverwerkende industrie (PPE) 2007][ref5] of de
      [Verordening hygiënevoorschriften kalkoenhouderij (PPE) 2009][ref6], zonder dat het een erkenning heeft voor de
      betreffende detectie en serotypering;

      c. na afloop van de schorsingstermijn, bedoeld in het eerste lid, blijkt dat het laboratorium nog steeds niet
      voldoet aan één of meer erkenningsvoorwaarden als bedoeld in de [bijlagen I][ref7], [II][ref8] of [III][ref9];

      d. blijkt dat binnen een periode van twaalf maanden na afloop van de schorsingstermijn, bedoeld in het eerste
      lid, het laboratorium opnieuw niet voldoet aan één of meer van de erkenningsvoorwaarden als bedoeld in de
      [bijlagen I][ref10], [II][ref11] of [III][ref12];

      e. het laboratorium niet voldoet aan één of meer erkenningsvoorwaarden als bedoeld in de [bijlagen I][ref13],
      [II][ref14] of [III][ref15], of naar het oordeel van de voorzitter afbreuk is gedaan aan de correctheid en
      betrouwbaarheid van de resultaten van het door het laboratorium uitgevoerde onderzoek.

      4 Voordat een besluit tot schorsing of intrekking wordt genomen, stelt de voorzitter het laboratorium
      in de gelegenheid om binnen een redelijke termijn alsnog aan de erkenningsvoorwaarden als bedoeld in de
      [bijlagen I][ref16], [II][ref17] of [III][ref18] te voldoen.

      5 In afwijking van het bepaalde in het vierde lid kan de voorzitter de erkenning met onmiddellijke ingang intrekken
      indien sprake is van een situatie als bedoeld in het derde lid, onderdeel d., en het belang van de dier- en
      volksgezondheid een intrekking met onmiddellijke ingang vereist.

      6 In afwijking van het bepaalde in het vierde lid kan de voorzitter de erkenning met onmiddellijke ingang schorsen
      of intrekken indien het belang van de dier- en volksgezondheid een schorsing of intrekking met onmiddellijke ingang
      vereist.


