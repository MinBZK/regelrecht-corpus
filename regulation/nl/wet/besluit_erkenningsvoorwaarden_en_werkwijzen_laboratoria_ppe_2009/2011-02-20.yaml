  - number: 4a
    text: |-
      Het productschap beheert een openbaar register waarin de erkenning van laboratoria alsmede de schorsing en
      intrekking van de erkenning van laboratoria zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0027283/2011-02-20#Artikel4a
  - number: '5'
    text: |-
      1 Het laboratorium voert de detectie van Salmonella uit overeenkomstig de daartoe vastgestelde methoden, opgenomen
      in [bijlage IV][ref1].

      2 Het laboratorium voert de serotypering van Salmonella uit overeenkomstig de daartoe vastgestelde methoden,
      opgenomen in [bijlage IV][ref2].

      3 Het laboratorium voert de detectie van Campylobacter uit overeenkomstig de daartoe vastgestelde methoden,
      opgenomen in [bijlage IV][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027283
      [ref2]: https://wetten.overheid.nl/BWBR0027283
      [ref3]: https://wetten.overheid.nl/BWBR0027283
    url: https://wetten.overheid.nl/BWBR0027283/2011-02-20#Artikel5
