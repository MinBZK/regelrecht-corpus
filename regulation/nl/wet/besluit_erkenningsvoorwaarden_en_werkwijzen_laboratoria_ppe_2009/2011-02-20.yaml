        artikel: '1'
  - number: '2'
    text: |-
      1 De voorzitter kan een laboratorium erkennen voor de detectie van Salmonella in de matrices mest, vlees of dons
      afkomstig van pluimvee indien het laboratorium naar zijn oordeel voldoet aan de in [bijlage I][ref1] opgenomen
      erkenningsvoorwaarden.

      2 De voorzitter kan een laboratorium erkennen voor de serotypering van Salmonella-isolaten indien het laboratorium
      naar zijn oordeel voldoet aan de in [bijlage II][ref2] opgenomen erkenningsvoorwaarden.

      3 De voorzitter kan een laboratorium erkennen voor de detectie van Campylobacter in de matrices mest of vlees
      indien het laboratorium naar zijn oordeel voldoet aan de in [bijlage III][ref3] opgenomen erkenningsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0027283
      [ref2]: https://wetten.overheid.nl/BWBR0027283
      [ref3]: https://wetten.overheid.nl/BWBR0027283
    url: https://wetten.overheid.nl/BWBR0027283/2011-02-20#Artikel2
    references:
