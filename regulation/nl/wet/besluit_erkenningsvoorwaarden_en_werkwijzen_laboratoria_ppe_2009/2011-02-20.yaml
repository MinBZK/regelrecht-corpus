      - id: ref3
        bwb_id: BWBR0027283
  - number: '3'
    text: |-
      1 Een laboratorium dat door de voorzitter op grond van [artikel 2][ref1] erkend is, blijft voldoen aan de
      erkenningsvoorwaarden als bedoeld in de [bijlagen I][ref2], [II][ref3] of [III][ref4].

      2 Zodra een erkend laboratorium niet meer voldoet aan de erkenningsvoorwaarden bedoeld in de [bijlagen I][ref5],
      [II][ref6] of [III][ref7], dan meldt het laboratorium dit onverwijld aan de voorzitter.


