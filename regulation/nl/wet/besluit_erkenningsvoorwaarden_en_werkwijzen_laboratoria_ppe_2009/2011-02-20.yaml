      - id: ref2
        bwb_id: BWBR0027283
      - id: ref3
        bwb_id: BWBR0027283
  - number: '6'
    text: |-
      1 Het nationaal referentielaboratorium voor de detectie van Salmonella is een erkend laboratorium voor de detectie
      van Salmonella als bedoeld in dit besluit.

      2 Het nationaal referentielaboratorium voor de serotypering van Salmonella isolaten is een erkend laboratorium voor
      de serotypering van Salmonella isolaten als bedoeld in dit besluit.

      3 Het nationaal referentielaboratorium voor de detectie van Campylobacter is een erkend laboratorium voor de
      detectie van Campylobacter als bedoeld in dit besluit.
    url: https://wetten.overheid.nl/BWBR0027283/2011-02-20#Artikel6
  - number: '7'
    text: |-
      Het laboratorium voert de detectie van Salmonella, de serotypering van Salmonella-isolaten of de detectie van
      Campylobacter uit op verzoek van de ondernemer.
    url: https://wetten.overheid.nl/BWBR0027283/2011-02-20#Artikel7
  - number: '8'
    text: Het laboratorium verleent medewerking aan controles, welke kunnen worden uitgevoerd in opdracht van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0027283/2011-02-20#Artikel8
  - number: '9'
    text: |-
      1 Het [Besluit erkenningsvoorwaarden en werkwijzen laboratoria (PPE) 2007][ref1] wordt ingetrokken.

