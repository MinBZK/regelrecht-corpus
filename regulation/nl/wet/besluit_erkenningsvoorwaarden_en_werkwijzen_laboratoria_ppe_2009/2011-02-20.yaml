articles:
  - number: '1'
    text: |-
      Dit besluit neemt de terminologie, als omschreven in
      [artikel 1 van de Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007][ref1],
      [artikel 1 van de Verordening hygiënevoorschriften pluimveeverwerkende industrie (PPE) 2007][ref2] en
      [artikel 1 van de Verordening hygiënevoorschriften kalkoenhouderij (PPE) 2009][ref3] over en verstaat daarnaast
      onder branchemethode: de door het bestuur vastgestelde methode voor de detectie of serotypering van monsters en
      verstaat onder pluimvee mede kalkoenen en verstaat onder KIPnet: de Centrale Database van het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0022479#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023512#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028052#Artikel1
    url: https://wetten.overheid.nl/BWBR0027283/2011-02-20#Artikel1
