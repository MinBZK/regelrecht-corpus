preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de in de Warenwet vervatte voorzieningen te verruimen
    ten behoeve van een doeltreffender bewaking van de goede hoedanigheden van waren, alsmede van een grotere
    duidelijkheid voor de afnemer en met name een goede voorlichting van de consument en tevens de bemoeienis van de
    besturen der gemeenten, onderscheidenlijk de besturen der provincies met betrekking tot de keuring van waren te
    doen vervallen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040825/2018-11-17#ArtikelAanhef
articles:
  - number: IX
    text: |-
      De tekst van de [Warenwet][ref1] wordt door Onze Minister van Volksgezondheid Volksgezondheid en Cultuur
      overgebracht in de wettelijke spelling, van een doorlopende nummering voorzien en door Onze Minister van Justitie
      in het Staatsblad geplaatst. De in de wetten genoemd in de [artikelen III][ref2], [IV][ref3], [V][ref4],
      [VI][ref5], [VII][ref6], en [VIII][ref7] opgenomen verwijzingen naar de op grond van de eerste volzin vernummerde
      Warenwet, worden voorts door Onze Minister in overeenstemming gebracht met bedoelde vernummering.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
