  - number: IX
    text: |-
      De tekst van de [Warenwet][ref1] wordt door Onze Minister van Volksgezondheid Volksgezondheid en Cultuur
      overgebracht in de wettelijke spelling, van een doorlopende nummering voorzien en door Onze Minister van Justitie
      in het Staatsblad geplaatst. De in de wetten genoemd in de [artikelen III][ref2], [IV][ref3], [V][ref4],
      [VI][ref5], [VII][ref6], en [VIII][ref7] opgenomen verwijzingen naar de op grond van de eerste volzin vernummerde
      Warenwet, worden voorts door Onze Minister in overeenstemming gebracht met bedoelde vernummering.


