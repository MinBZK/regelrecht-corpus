preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de in de Warenwet vervatte voorzieningen te verruimen
    ten behoeve van een doeltreffender bewaking van de goede hoedanigheden van waren, alsmede van een grotere
    duidelijkheid voor de afnemer en met name een goede voorlichting van de consument en tevens de bemoeienis van de
    besturen der gemeenten, onderscheidenlijk de besturen der provincies met betrekking tot de keuring van waren te
    doen vervallen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040825/1989-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 De tot het in werking treden van deze wet geldende besluiten berustende op het bij deze wet vervallen
      [artikel 13][ref1], onderscheidenlijk op de bij deze wet vervangen artikelen 14-16b van de Warenwet, dan wel
      op de [artikelen 14-16 van de Warenwet][ref2] (Stb. 1919, 581), blijven van kracht totdat zij door Ons worden
      ingetrokken. Zij kunnen tussentijds door toepassing van de in de eerste volzin genoemde artikelen nog worden
      gewijzigd.

      2 Het is verboden waren, ten aanzien waarvan niet is voldaan aan het bij of krachtens een besluit als bedoeld in
      het eerste lid bepaalde, te verhandelen of waren in strijd met het bij of krachtens zodanig besluit bepaalde te
      bereiden, te vervaardigen, samen te stellen, te verpakken, te bewaren, te behandelen, te vervoeren, in te voeren
      of door te voeren. Voor de toepassing van de vorige volzin wordt onder «verhandelen» verstaan hetgeen daaronder in
      [artikel 1 (nieuw) van de Warenwet][ref3] wordt verstaan, zulks behoudens het bepaalde in het vijfde lid.

      3 Met betrekking tot de in het eerste lid bedoelde besluiten zijn de artikelen 14i t/m 14o, [18][ref4],
      [20-26][ref5] en [28 van de Warenwet][ref6] zoals zij door de onderhavige wet komen te luiden, van overeenkomstige
      toepassing.

      4 Zolang een besluit als bedoeld in het eerste lid met betrekking tot een waar nog van kracht is, wordt voor
      de toepassing van het tweede lid, voor de in het derde lid bedoelde toepassing van de nieuwe artikelen 14i en
      [25 van de Warenwet][ref7], alsmede, voor zover de nieuwe [artikelen 15][ref8] en 15a van de Warenwet op die waar
      van toepassing zijn, voor de toepassing van deze artikelen, het voorhanden of in voorraad hebben van die waar
      slechts als verhandelen aangemerkt indien vaststaat dat zij voor aflevering bestemd is.

      5 Zolang een besluit als bedoeld in het eerste lid met betrekking tot een waar nog van kracht is, is het aan een
      ieder verboden in de uitoefening van een beroep of bedrijf die waar aan te prijzen op een wijze waarvan hij weet of
      redelijkerwijs moet vermoeden dat zij strijdig is met het ter zake van het voor die waar bezigen van aanduidingen
      bij of krachtens dat besluit bepaalde.

      6 Voor de toepassing van het tweede, het vierde en het vijfde lid, alsmede voor de in het derde lid bedoelde
      toepassing van de in dat lid genoemde artikelen van de[ Warenwet][ref9] worden alle zaken die in de in het eerste
      lid bedoelde besluiten als waar of ander artikel voorwerp van regeling zijn, als waren aangemerkt.

      7 Met betrekking tot algemene maatregelen van bestuur krachtens het eerste lid, tweede volzin, zijn de
      [artikelen 17 (nieuw), vierde en dertiende lid][ref10], en [29 van de Warenwet][ref11] van overeenkomstige
      toepassing.


