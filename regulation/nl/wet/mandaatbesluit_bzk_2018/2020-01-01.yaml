  - number: '6.7'
    text: |-
      1 Het mandaat van de directeur met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door het
      diensthoofd en de DG-controller goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor de
      directeur verantwoordelijk is met een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref1]
      van dit besluit.

      2 De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven
      te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een bewindspersoon, de
      secretaris-generaal of het diensthoofd, met instemming van de DG-Controller en binnen het vastgestelde budget dat
      aan het diensthoofd ter beschikking is gesteld.

      3 De directeur legt over het door hem gevoerde financiële beheer verantwoording af aan zijn leidinggevende.

      4 In afwijking van het derde lid legt de directeur binnen het SG-Cluster over het door hem gevoerde financiële
      beheer verantwoording af aan de directeur Concernondersteuning.

      5 De directeur van een agentschap is verantwoordelijk voor een kostendekkende exploitatie binnen de afspraken die
      hij met opdrachtgevers en de eigenaar heeft gemaakt. Voor het aangaan van financiële verplichtingen en het doen van
      uitgaven geldt voor de directeur een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref2]
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0041316
      [ref2]: https://wetten.overheid.nl/BWBR0041316
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0041316
      - id: ref2
        bwb_id: BWBR0041316
  - number: '6.8'
    text: |-
      1 De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder hem
      ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.

      2 De directeur die leiding geeft aan een agentschap is tevens bevoegd tot het verlenen van ondermandaat voor het
      uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied.

      3 De directeur kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      ten aanzien van aangelegenheden op het werkterrein van de functionaris.

      4 De directeur is bevoegd om in bijzondere gevallen, naast het bepaalde in het eerste, tweede en derde lid,
      mondeling of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald
      geval.

      5 Het verlenen van ondermandaat door de directeur, niet zijnde een directeur die leiding geeft aan een agentschap,
      voor het aangaan van financiële verplichtingen en het doen van uitgaven is enkel mogelijk aan in [bijlage 1][ref1]
      van dit besluit genoemde onder hem ressorterende functionarissen met inachtneming van het aldaar genoemde
      maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0041316
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0041316
  - number: '6.9'
    text: |-
      1 De directeur verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 6.8, vierde lid][ref1], beschreven situatie, in overeenstemming met het diensthoofd en met kennisgeving
      aan de directeur Concernondersteuning en de directeur Financieel-economische Zaken.

      2 De door de directeur gemandateerde, bedoeld in artikel 6.9, eerste lid, verleent ondermandaat bij schriftelijk
      besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur Concernondersteuning en aan de
      directeur Financieel-economische Zaken.

      3 De voorgeschreven overeenstemming uit het eerste lid is niet van toepassing op het verlenen van financieel
      ondermandaat door de directeur aan de in [bijlage 1][ref2] van dit besluit genoemde onder hem ressorterende
      functionarissen voor zover dit een bedrag van € 30.000 niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0041316#Artikel6.8
      [ref2]: https://wetten.overheid.nl/BWBR0041316
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0041316
        artikel: '6.8'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0041316
  - number: '6.10'
    text: |-
      De rechtstreeks onder de directeur ressorterende leidinggevenden zijn, voor zover door de directeur met
      toepassing van [artikel 6.8, eerste lid][ref1], niet anders is bepaald, ten aanzien van de onder hen ressorterende
      functionarissen bevoegd tot:

      a. het vaststellen van het wekelijkse werkrooster;

      b. het verlenen van vakantieverlof;

      c. het verlenen van buitengewoon verlof van korte duur;

      d. het accorderen van binnenlandse dienstreizen en daarbij gebruikte vervoermiddel;

      e. het voeren respectievelijk de verslaglegging van het gesprek, bedoeld in
      [artikel 71 van het Algemeen Rijksambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041316#Artikel6.8
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel6.10
