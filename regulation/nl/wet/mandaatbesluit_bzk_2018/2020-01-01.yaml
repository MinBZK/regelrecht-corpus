        artikel: '71'
  - number: '6.11'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de directeur worden diens taken volledig uitgeoefend door de
      plaatsvervangend directeur.

      2 De aanwijzing van een plaatsvervangend directeur geschiedt door de directeur met inachtneming van het
      [Organisatiebesluit BZK 2018](onbekend) en in overeenstemming met de leidinggevende van de directeur.

      3 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur worden
      de taken van de directeur bij wijze van plaatsvervanging uitgeoefend door de leidinggevende van de directeur.

      4 In afwijking van het vorige lid kan de plaatsvervanging van de directeur die leiding geeft aan een agentschap
      volledig worden uitgeoefend door de functionaris die daartoe door de directeur in overeenstemming met de
      leidinggevende van de directeur is aangewezen.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel6.11
  - number: '7.1'
    text: |-
      Het mandaat van de directeur Ambtenaar en Organisatie omvat tevens:

      a. het centraal opdrachtgeverschap aan P-Direkt voor de uitvoering van de standaard dienstverlening;

      b. het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      Het mandaat van de directeur Inkoop-, Facilitair- en Huisvestingbeleid Rijk omvat tevens:

      a. het centraal opdrachtgeverschap aan FM Haaglanden voor de uitvoering van de standaard dienstverlening;

      b. het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel7.2
  - number: '7.3'
    text: |-
      1 Het mandaat van de directeur Concernondersteuning omvat tevens de uitvoering van de rijksbrede inkoopcategorie
      Vervoer.

      2 Het mandaat van de directeur-generaal Rijksvastgoedbedrijf omvat tevens de uitvoering van de rijksbrede
      inkoopcategorie Energie.

      3 Het mandaat van de CIO BZK omvat tevens de uitvoering van de rijksbrede inkoopcategorie ICT-werkomgeving Rijk.

      4 De directeur Concernondersteuning kan de CIO BZK en de directeur-generaal Rijksvastgoedbedrijf instructies geven
      over de uitoefening van het mandaat, bedoeld in het tweede onderscheidenlijk derde lid, en inlichtingen vragen over
      de uitoefening dienaangaande.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      1 De maximumbedragen voor het aangaan van financiële verplichtingen en het doen van uitgaven, als vermeld in
      [bijlage 1][ref1] van dit besluit, zijn niet van toepassing op de in dit hoofdstuk verleende mandaten.

      2 Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Vervoer heeft de directeur Concernondersteuning mandaat samen met de secretaris-generaal.

      3 Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Energie heeft de directeur Rijksvastgoedbedrijf mandaat samen met de secretaris-generaal.

      4 Voor het aangaan van (meerjarige) verplichtingen boven de 10 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie ICT-werkomgeving Rijk heeft de CIO BZK mandaat samen met de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0041316
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0041316
  - number: '8.1'
    text: |-
      De uitoefening van een mandaat geschiedt met inachtneming van:

      a. algemene en bijzondere aanwijzingen van de mandaatgever ten aanzien van de uitoefening van het mandaat;

      b. departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;

      c. de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in het bijzonder
      de [Comptabiliteitswet 2016][ref1], de [Wet op de ondernemingsraden][ref2], het departementale kader voor
      externe inhuur, het [Organisatiebesluit BZK 2018](onbekend) en (de richtlijnen inzake) administratieve
      organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429
      [ref2]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
      - id: ref2
        bwb_id: BWBR0002747
  - number: '8.2'
    text: |-
      1 De uitoefening van een mandaat geschiedt binnen de door de secretaris-generaal vastgestelde kaders met betrekking
      tot het beleid en beheer inzake de bedrijfsvoering van het ministerie.

      2 De uitoefening van een mandaat geschiedt met inachtneming van de departementale procedures en richtlijnen.

      3 Afwijking van het eerste lid ten aanzien van een onder het diensthoofd ressorterend dienstonderdeel is slechts
      mogelijk in overeenstemming met de secretaris-generaal, de directeur Financieel-economische Zaken en de directeur
      van het SG-Cluster die het aangaat en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel8.2
  - number: '8.3'
    text: |-
      1 De gemandateerde is verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die
      inzicht bieden in het door en namens de gemandateerde gevoerde financiële beheer en beheer van niet-geldelijke
      zaken op grond van diens mandaat.

      2 De directeur Financieel-economische Zaken is bevoegd om de administraties, bedoeld in het eerste lid, te
      onderzoeken ten behoeve van de uitvoering van taken behorende tot hun werkterrein.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 Ondertekening van besluiten en stukken op grond van mandaat vindt plaats op de volgende wijze:

      De Minister van Binnenlandse Zaken en Koninkrijksrelaties,

      namens deze,

      (handtekening)

      (naam)

      (aanduiding functie gemandateerde)

      2 In afwijking van het eerste lid wordt een besluit van de Staatssecretaris als volgt ondertekend:

      De Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties,

      namens deze,

      (handtekening)

      (naam)

      (aanduiding functie gemandateerde)

      3 Bij ondertekening van besluiten en stukken op grond van volmacht wordt de aanduiding van de Minister dan wel de
      Staatssecretaris voorafgegaan door: Namens de Staat der Nederlanden.

      4 Bij ondertekening van besluiten en stukken door een plaatsvervanger wordt de handtekening voorafgegaan door: b/a.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel8.4
  - number: '8.5'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de bewindspersoon, de secretaris-generaal of het diensthoofd
      over de doorverlening van zijn mandaat.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel8.5
  - number: '9.1'
    text: |-
      1 De directeur Concernondersteuning is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de diensthoofden en de directeuren, ieder voor zover het hen aangaat, zijn
      verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur Concernondersteuning van de
      gegevens die een goed beheer van dit besluit onderscheidenlijk het mandaatregister mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur Concernondersteuning rapporteert aan de bewindspersonen en de secretaris-generaal over het beheer
      van dit besluit en het centrale mandaatregister.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel9.1
  - number: '9.2'
    text: |-
      1 De directeur Concernondersteuning draagt zorg voor de inrichting en het beheer van een centraal mandaatregister.

      2 Het register biedt inzicht in:

      a. de functies en namen van functionarissen aan wie door of namens een bewindspersoon (onder)mandaat is
      (door)verleend, met aanduiding van de verleende bevoegdheid;

      b. de functies en namen van functionarissen die een bewindspersoon vertegenwoordigen in een (bestuurs)orgaan van
      een rechtspersoon anders dan de Staat, met aanduiding van het (bestuurs)orgaan en de rechtspersoon.

      3 Het register is openbaar.

      4 De directeur Concernondersteuning draagt zorg voor de gegevensverstrekking uit het register. Bij de uitvoering
      van deze werkzaamheden pleegt hij zo nodig overleg met de directeur Constitutionele Zaken en Wetgeving
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel9.2
  - number: '9.3'
    text: |-
      1 In afwijking van [artikel 9.2, tweede lid][ref1], worden gegevens met betrekking tot de verlening van
      ondermandaat aan functionarissen in de rang van directeur en daaronder ressorterende functionarissen bij
      de Algemene Inlichtingen- en Veiligheidsdienst opgenomen in een door de directeur-generaal van de Algemene
      Inlichtingen- en Veiligheidsdienst bijgehouden mandaatregister.

      2 De directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst kan in overeenstemming met de
      secretaris-generaal nadere regels stellen ten aanzien van het register, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0041316#Artikel9.2
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0041316
        artikel: '9.2'
        hoofdstuk: '9'
  - number: '9.4'
    text: |-
      Wijziging van dit besluit geschiedt op initiatief van de directeur Concernondersteuning na advies van de directeur
      Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel9.4
  - number: '10.1'
    text: |-
      1 Besluiten of handelingen die op grond van het [Mandaatbesluit BZK 2016][ref1] zijn genomen of verricht in
      de periode tot de datum van inwerkingtreding van dit besluit en waarin op het tijdstip van inwerkingtreding
      van dit besluit niet is voorzien, worden aangemerkt als te zijn genomen of verricht namens de Minister of de
      Staatssecretaris.

      2 Vóór het tijdstip van inwerkingtreding van dit besluit van kracht zijnde mandaten, ondermandaten, volmachten
      en machtigingen, waarin op het tijdstip van inwerkingtreding van dit besluit niet is voorzien, blijven van kracht
      totdat op grond van dit besluit is voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in
      intrekking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0038549
