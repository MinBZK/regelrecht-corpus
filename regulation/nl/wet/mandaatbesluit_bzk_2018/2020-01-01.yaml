  - number: '4.6'
    text: |-
      1 Het mandaat van het diensthoofd met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan het diensthoofd ter beschikking is gesteld op basis van een door de
      secretaris-generaal en de directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van dat deel
      van de begroting waarvoor het diensthoofd verantwoordelijk is, met een maximumbedrag per (meerjarige) verplichting
      als vermeld in de [bijlage 1][ref1] van dit besluit.

      2 Het diensthoofd is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven
      te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een bewindspersoon of de
      secretaris-generaal, met instemming van de directeur Financieel-economische Zaken.

      3 Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor DBFMO-trajecten,
      reguliere projecten, integrale beheercontracten en huurcontracten heeft de directeur-generaal Rijksvastgoedbedrijf
      mandaat samen met de secretaris-generaal.

      4 Het diensthoofd legt over het door hem gevoerde financiële beheer verantwoording af aan de secretaris-generaal.

      5 In afwijking van het vierde lid legt de directeur-generaal binnen het SG-Cluster over het door hem gevoerde
      financiële beheer verantwoording af aan de directeur Concernondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0041316
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0041316
  - number: '4.7'
    text: |-
      1 Het diensthoofd is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.

      2 Het diensthoofd dat leiding geeft aan een agentschap is tevens bevoegd tot het verlenen van ondermandaat voor het
      uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied.

      3 Het diensthoofd kan bij toepassing van de bevoegdheid tot het verlenen van ondermandaat, bedoeld in het eerste
      lid, afwijken van hetgeen in dit besluit is bepaald over het mandaat van de directeur, met uitzondering van het
      bepaalde in [artikel 5.7][ref1].

      4 Het diensthoofd is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in het eerste, tweede
      en derde lid, mondeling of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor
      een bepaald geval.

      5 Het diensthoofd kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      of in bijzondere gevallen aan een andere functionaris.

      6 Het verlenen van ondermandaat door het diensthoofd, niet zijnde een diensthoofd dat leiding geeft aan een
      agentschap, voor het aangaan van financiële verplichtingen en het doen van uitgaven is enkel mogelijk aan in
      [bijlage 1][ref2] van dit besluit genoemde onder hem ressorterende functionarissen met inachtneming van het aldaar
      genoemde maximumgrensbedrag per (meerjarige) verplichting.

      7 Het diensthoofd kan voor de in [artikel 4.4a][ref3] genoemde bevoegdheid uitsluitend ondermandaat verlenen aan
      directeuren, afdelingshoofden en sectiehoofden van het Rijksvastgoedbedrijf.

      7 In aanvulling op het eerste lid kan de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst
      ondermandaat verlenen aan daartoe aangewezen niet-ondergeschikte functionarissen, werkzaam bij het Ministerie van
      Defensie, voor het uitoefenen van daartoe aangewezen personele bevoegdheden met toestemming van de gemandateerde en
      met toestemming van de Minister van Defensie.

      8 In aanvulling op het eerste lid kan de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst
      ondermandaat verlenen aan daartoe aangewezen niet-ondergeschikte functionarissen, werkzaam bij het Ministerie van
      Defensie, voor het uitoefenen van daartoe aangewezen bevoegdheden betreffende het afgeven van Verklaringen van geen
      bezwaar met toestemming van de gemandateerde en met toestemming van de Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0041316#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0041316
      [ref3]: https://wetten.overheid.nl/BWBR0041316#Artikel4.4a
