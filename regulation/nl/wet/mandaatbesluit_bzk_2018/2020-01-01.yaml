  - number: '3.3'
    text: |-
      1 Het mandaat van de secretaris-generaal is niet van toepassing op:

      a. beslissingen ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst, voor zover deze samenhangen
      met het werkterrein van het Bureau Algemene Bestuursdienst;

      b. de bevoegdheden die zijn toegedeeld aan het bestuur en de voorzitter van de huurcommissie;

      c. het nemen van besluiten en het afdoen en ondertekenen van stukken met betrekking tot personele
      beheersbeslissingen op grond van het [Mandaatbesluit Colleges financieel toezicht][ref1].

      2 Voor het aangaan van (meerjarige) verplichtingen op het terrein van ICT boven de 10 miljoen euro inclusief BTW
      per (meerjarige) verplichting heeft de secretaris-generaal volmacht samen met het betreffende diensthoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0035717
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035717
  - number: '3.4'
    text: |-
      1 De secretaris-generaal is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen respectievelijk tot het beperken of het intrekken daarvan.

      2 De secretaris-generaal kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende
      functionaris of in bijzondere gevallen aan een andere functionaris.

      3 De secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van deze paragraaf, mondeling of
      schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      De secretaris-generaal verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 3.4, derde lid][ref1], beschreven situatie, na advies van de directeur Constitutionele Zaken en Wetgeving,
      de directeur Financieel-economische Zaken en de directeur Concernondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0041316#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel3.5
