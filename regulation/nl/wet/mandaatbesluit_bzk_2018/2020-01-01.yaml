  - number: '4.4'
    text: |-
      Het mandaat van de directeur-generaal Overheidsorganisatie omvat tevens:

      a. de leiding van het overleg met de centrales van overheidspersoneel en de overheidswerkgevers of verenigingen van
      overheidswerkgevers, bedoeld in de Regeling overleg Raad voor het Overheidspersoneelsbeleid;

      b. de leiding van het overleg met de Sectorcommissie overleg rijkspersoneel, genoemd in het
      [Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel4.4
    references:
      - id: ref1
