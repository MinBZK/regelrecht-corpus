  text: |-
    Gelet op de artikelen 10:3, 10:9 en 10:12 van de Algemene wet bestuursrecht en artikel 4.6, eerste lid, van de
    Comptabiliteitswet 2016;

    Besluit vast te stellen het navolgende Mandaatbesluit:
  url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *ministerie:* het ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *Staatssecretaris:* de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

      d. *bewindspersoon:* de Minister of de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

      e. *diensthoofd:* een (programma)directeur-generaal en de plaatsvervangend directeur-generaal AIVD;

      f. *algemeen directeur:* de algemeen directeur Logius;

      g. *directeur:* de leidinggevende werkzaam binnen een in het [Organisatiebesluit BZK 2018][ref1] genoemd
      dienstonderdeel die rechtstreeks ressorteert onder de secretaris-generaal of een (programma)directeur-generaal;

      h. *mandaat:* de bevoegdheid om namens een bewindspersoon besluiten te nemen en stukken af te doen en te
      ondertekenen;

      i. *werkterrein:* de taken van de betreffende functionaris en zijn dienstonderdeel overeenkomstig het
      [Organisatiebesluit BZK 2018][ref2] en de daarop berustende bepalingen;

      j. *SG-Cluster:* de directies Concernondersteuning, Financieel-economische Zaken, Constitutionele Zaken en
      Wetgeving, BZK Flex en CIO & Informatiemanagement;

      k. *BZK Kerndepartement:* de directoraten-generaal Bestuur, Ruimte en Wonen, Koninkrijksrelaties en
      Overheidsorganisatie, het programma directoraat-generaal Omgevingswet en het SG-Cluster.


      [ref1]: https://wetten.overheid.nl/BWBR0041314
      [ref2]: https://wetten.overheid.nl/BWBR0041314
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0041314
      - id: ref2
        bwb_id: BWBR0041314
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a. volmacht om namens een bewindspersoon voor de Staat privaatrechtelijke rechtshandelingen te verrichten;

      b. machtiging om namens een bewindspersoon handelingen te verrichten die noch een besluit noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel1.2
  - number: '2.1'
    text: |-
      Mandaat wordt niet verleend met betrekking tot:

      a. het vaststellen van een algemeen verbindend voorschrift;

      b. het beslissen op een bezwaarschrift tegen een besluit dat persoonlijk door een bewindspersoon of de secretaris-
      generaal is genomen;

      c. het beslissen op een beroepschrift;

      d. het instellen van een agentschap bij het ministerie;

      e. het oprichten van een rechtspersoon;

      f. het geven van aanwijzingen aan een ander bestuursorgaan op grond van een wettelijk voorschrift;

      g. het toepassen van [aanwijzing 3 van de Aanwijzingen inzake externe contacten van rijksambtenaren](onbekend);

      h. het vaststellen van de organisatie van het ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1];

      i. het uitoefenen van de op grond van departementale regelgeving aan de Minister voorbehouden bevoegdheden met
      betrekking tot vertrouwensfuncties en veiligheidsonderzoeken;

      j. het instellen van een adviescommissie of klachtencommissie waarvan de voorzitter geen deel uitmaakt van het
      ministerie en niet werkzaam is onder verantwoordelijkheid van een bewindspersoon, en het benoemen en ontslaan van
      de (plaatsvervangend) voorzitter en (plaatsvervangend) leden van die commissie;

      k. het benoemen en ontslaan van departementale vertrouwenspersonen;

      l. het verlenen van goedkeuring aan, het schorsen of het vernietigen van, dan wel het onthouden van goedkeuring aan
      besluiten van een ander bestuursorgaan;

      m. het definitief buiten invordering stellen dan wel kwijtschelden van vorderingen op derden vanaf door de Minister
      van Financiën vastgestelde grensbedragen;

      n. het definitief vaststellen van een sectorale arbeidsvoorwaardenovereenkomst waarvoor de Minister
      verantwoordelijk is;

      o. een stuk dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een beslissing neemt die
      door een bewindspersoon behoort te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0041316/2020-01-01#Artikel2.1
    references:
