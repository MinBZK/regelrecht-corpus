preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het regresrecht van de uitvoeringsorganen van de
    sociale ziektekostenverzekeringen uit te breiden naar de Algemene Wet Bijzondere Ziektekosten en het regresrecht in
    de Ziekenfondswet te versterken, alsmede enkele technische wijzigingen in deze wetten aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010460/1999-07-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      [Artikel 65b van de Algemene Wet Bijzondere Ziektekosten][ref1] is uitsluitend van toepassing indien het feit dat
      aanleiding geeft tot het verlenen van zorg als bedoeld in artikel 6 van die wet, veroorzaakt is op of na de datum
      van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel65b
    url: https://wetten.overheid.nl/BWBR0010460/1999-07-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 65b
  - number: V
    text: |-
      Degenen die naar de omstandigheden beoordeeld hier te lande woonachtig zijn en die bij de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      _________________________________________________________________, de leeftijd van 65 jaar hadden bereikt
      en medeverzekerd waren ingevolge de [Ziekenfondswet][ref2], worden geacht te hebben voldaan aan de in
      [artikel 3, eerste lid, onder c, en zevende lid, van de Ziekenfondswet][ref3] genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0009271
      [ref2]: https://wetten.overheid.nl/BWBR0002460
