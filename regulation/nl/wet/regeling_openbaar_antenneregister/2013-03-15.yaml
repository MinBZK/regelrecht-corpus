articles:
  - number: '1.1'
    text: |-
      Aanbieders van mobiele terrestrische netwerken die op basis van
      [artikel 24, tweede lid, van het Frequentiebesluit 2013][ref1] gehouden zijn gegevens te verstrekken, verstrekken
      deze gegevens één keer per maand, met dien verstande dat er tussen de opeenvolgende momenten waarop de gegevens
      worden verstrekt niet meer dan 30 kalenderdagen verstreken zijn. Voor het eerst worden de gegevens uiterlijk op 30
      januari 2010 verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel24
    url: https://wetten.overheid.nl/BWBR0027031/2013-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '24'
  - number: '1.2'
    text: |-
      Anderen dan aanbieders als bedoeld in het eerste lid, die op basis van
      [artikel 24, tweede lid, van het Frequentiebesluit 2013][ref1] gehouden zijn gegevens te verstrekken, verstrekken
      deze gegevens voor het eerst uiterlijk op 30 januari 2010 en vervolgens binnen 30 kalenderdagen na de dag dat een
      wijziging in de verstrekte gegevens is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel24
    url: https://wetten.overheid.nl/BWBR0027031/2013-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '24'
  - number: '1.3'
    text: |-
      Diegenen die op basis van [artikel 25, tweede lid, van het Frequentiebesluit 2013][ref1] gehouden zijn gegevens
      te verstrekken, verstrekken deze gegevens voor het eerst uiterlijk op 30 januari 2010 en vervolgens binnen 30
      kalenderdagen na de dag dat een wijziging in de verstrekte gegevens is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel25
    url: https://wetten.overheid.nl/BWBR0027031/2013-03-15#Artikel1
