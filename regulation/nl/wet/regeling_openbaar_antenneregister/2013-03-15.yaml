        artikel: '25'
  - number: '2.1'
    text: |-
      Aanbieders als bedoeld in [artikel 1, eerste lid][ref1], verstrekken de gegevens digitaal aan de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0027031#Artikel1
    url: https://wetten.overheid.nl/BWBR0027031/2013-03-15#Artikel2
    references:
