  - number: '5'
    text: |-
      1 Het subsidieplafond bedraagt:

      a. voor periode 1 € 38.000.000; en

      b. voor periode 2 € 56.258.000.

      2 De minister verdeelt het uit hoofde van de subsidieplafonds beschikbare bedragen:

      a. in geval het subsidieplafond niet wordt uitgeput, conform de volledige subsidieaanvragen; of

      b. in geval het subsidieplafond wel wordt uitgeput, evenredig over de ingediende volledige aanvragen.

      3 Een subsidieaanvraag is volledig indien het aanvraagformulier is ingevuld, is ondertekend door een tekenbevoegd
      persoon van de aanvrager en de gevraagde documenten, bedoeld in [artikel 6, vierde lid][ref1], zijn overgelegd.

      4 In het geval van een onvolledige aanvraag wordt de zorgaanbieder in de gelegenheid gesteld de aanvraag binnen
      twee weken aan te vullen, krachtens [artikel 4:5, eerste lid, onder c, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044830#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
