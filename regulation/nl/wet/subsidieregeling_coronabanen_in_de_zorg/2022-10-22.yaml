  - number: '7'
    text: |-
      1 Het subsidiebedrag per werknemer bestaat uit:

      a. de voor hem verschuldigde loonkosten, tot een maximum van 120% van het wettelijk minimumloon;

      b. verschuldigde onregelmatigheidstoeslag, verschuldigde eindejaarsuitkering, verschuldigd vakantiegeld,
      verschuldigde pensioenafdrachten en sociale zekerheidslasten, in verband met de kosten, bedoeld onder a; en

      c. maximaal 20% van de kosten, bedoeld onder a, voor de begeleiding.

      2 In aanvulling op het eerste lid bestaat het bedrag van de subsidie voor een werknemer met een arbeidsovereenkomst
      als bedoeld in [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref1] tevens uit een transitievergoeding in
      verband met de activiteiten, bedoeld in [artikel 3, eerste lid][ref2].

      3 Het maximum subsidiebedrag voor een voltijds coronabaan van zes maanden bedraagt € 25.440.

      4 Het maximum subsidiebedrag per zorgaanbieder bedraagt € 4.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0044830#Artikel3
