        bwb_id: BWBR0044830
        artikel: '6'
  - number: '10'
    text: |-
      Onverminderd [hoofdstuk 5 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] is de subsidieontvanger verplicht:

      a. de voor de sector van de zorgaanbieder betreffende cao van toepassing te verklaren; en

      b. de werknemer in te schalen overeenkomstig de betreffende cao, bedoeld onder a, en de salarisschaal behorende bij
      de betreffende coronabaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037603
        hoofdstuk: '5'
  - number: '11'
    text: |-
      1 De minister kan een steekproef uitvoeren voorafgaand aan de vaststelling van subsidies als bedoeld in
      [artikel 8, onder a][ref1].

      2 Indien een subsidieontvanger binnen de steekproef, bedoeld in het eerste lid, valt, toont hij op de in de
      beschikking aangegeven wijze aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is
      voldaan aan de aan de verleende subsidie verbonden verplichtingen.

      3 De Minister besluit uiterlijk 4 november 2022 ambtshalve over de vaststelling van de subsidie.

      4 De subsidie wordt vastgesteld op een bedrag tot ten hoogste het in de verleningsbeschikking genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0044830#Artikel8
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel11
