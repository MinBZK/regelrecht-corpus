  - number: '6'
    text: |-
      1 De subsidieaanvraag ten behoeve van de activiteiten in periode 1 kan worden ingediend in de periode van 1 maart
      2021, 09:00 uur tot en met 31 maart 2021, 17:00 uur.

      2 De subsidieaanvraag ten behoeve van de activiteiten in periode 2 en het verzoek tot herziening van de
      subsidieverlening ten behoeve van de verlenging van de activiteiten in periode 1 kunnen worden ingediend in de
      periode van 14 juni 2021, 09:00 uur tot en met 25 juni 2021, 17:00 uur.

      3 Voor de aanvraag tot verlening van de subsidie wordt een door de minister vastgesteld formulier gebruikt.

      4 Een aanvraag of een verzoek als bedoeld in het tweede lid gaat in ieder geval vergezeld van:

      a. een opgave van:

      1° het aantal werknemers per coronabaan, inclusief de kosten, bedoeld in [artikel 7, eerste en tweede lid][ref1];

      2° het gemiddeld aantal werkuren per werknemer per week overeenkomstig het contract;

      3° het aantal werknemers dat een beroepsopleiding in de derde leerweg volgt als bedoeld in
      [artikel 3, tweede lid][ref2]; en

      4° de periode waarin de werknemer wordt ingezet bij de zorgaanbieder;

      b. een verklaring waarin de zorgaanbieder verklaart dat:

      1° deze met de werknemer een contract aangaat voor minimaal twee en maximaal zes maanden;

      2° deze de werknemer in periode 1 inzet op of na 1 januari 2021;

      3° deze de werknemer in periode 2 inzet op of na 1 juli 2021 maar uiterlijk 1 oktober 2021;

      4° de coronabanen niet reeds via andere bronnen als bedoeld in [artikel 3, vierde lid][ref3], gefinancierd worden;

      5° deze niet subsidie aanvraagt voor dezelfde werknemer in zowel periode 1 als periode 2 indien daarmee de totale
      maximale subsidiabele periode van zes maanden wordt overschreden; en

      6° deze een zorgaanbieder is als bedoeld in [artikel 1][ref4];

      c. een opgave van het nummer waarmee de zorgaanbieder geregistreerd is bij de Kamer van Koophandel waarmee tevens
      de AGB-code en WTZi-toelating wordt gecontroleerd;

      d. een opgave van het SBI-nummer waarmee de zorgaanbieder geregistreerd is in het handelsregister;

      e. een opgave van het aantal werkzame personen bij de zorgaanbieder op 1 januari 2021;

      f. een volmacht ingeval door een ander dan een tekenbevoegde persoon subsidie wordt aangevraagd; en

      g. een bankafschrift op naam van de aanvrager, dat niet ouder is dan drie maanden.

      5 De zorgaanbieder die een aanvraag of verzoek als bedoeld in het tweede lid indient, en niet beschikt over
      een AGB-code of WTZi-toelating als bedoeld in [artikel 1][ref5], doet de aanvraag vergezeld gaan van een van de
      volgende documenten:

      a. een betalingsbewijs of contract met financier; of

      b. een schriftelijke verklaring van een derde waaruit blijkt dat de aanvrager een zorgaanbieder is.

      6 Door het indienen van een aanvraag stemt de zorgaanbieder ermee in dat in ieder geval de volgende gegevens uit
      het subsidiedossier openbaar gemaakt kunnen worden:

      a. de naam en de vestigingsplaats van de subsidieaanvrager;

      b. het aantal werknemers dat coronabanen vervult;

      c. het verstrekte voorschot; en

      d. de verleende en vastgestelde subsidie.


