preamble:
  text: |-
    Gelet op de artikelen 3 en 5 van de Kaderwet VWS-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *AGB-code:* de Algemene GegevensBeheer-code van een zorgaanbieder zoals geregistreerd in het AGB-register dat
      wordt beheerd door Vektis;
        - *begeleiden:* activiteiten van de zorgaanbieder ten behoeve van een werknemer die dienen tot
      informatieverstrekking, instructie, ontwikkeling, werkbegeleiding, intervisie en supervisie, advisering en
      evaluatie, alsmede activiteiten tot bevordering van een optimale dienstbetrekking van een werknemer;
        - *cao:* een collectieve arbeidsovereenkomst als bedoeld in
      [artikel 1, eerste lid, van de Wet op de collectieve arbeidsovereenkomst][ref2];
        - *contract:* a. arbeidsovereenkomst als bedoeld in [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref3];
      b. uitzend- of detacheringsovereenkomst op basis waarvan een werknemer door een werkgever ter beschikking wordt
      gesteld van een zorgaanbieder om arbeid te verrichten onder toezicht en leiding van de zorgaanbieder;
        - *coronabaan:* tijdelijk ondersteunende corona-gerelateerde functie bij een zorgaanbieder;
        - *COVID-19 uitbraak:* de uitbraak van het coronavirus SARS-CoV-2 in Nederland;
        - *GGD:* gemeentelijke gezondheidsdienst als bedoeld in [artikel 14 van de Wet publieke gezondheid][ref4];
        - *handelsregister:* handelsregister als bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref5];
        - *jaarverslaggeving:* het geheel van verslaggevingsdocumenten bestaande uit de jaarrekening en de andere
      informatie waarbij de andere informatie bestaat uit het bestuursverslag, de overige gegevens en eventueel andere
      financiële en niet-financiële informatie;
        - *minister:* de Minister van Langdurige Zorg en Sport;
        - *onregelmatigheidstoeslag:* de in de cao of in het contract vastgelegde financiële vergoeding voor het werken op
      onregelmatige uren;
        - *periode 1:* periode van 1 januari 2021 tot en met 30 juni 2021;
        - *periode 2:* periode van 1 juli 2021 tot en met 31 december 2021;
        - *SBI-code:* code van de Standaard Bedrijfsindeling zoals gehanteerd door het Centraal Bureau voor de Statistiek
      waarmee de economische hoofd- of nevenactiviteit van een bedrijf wordt weergegeven in het handelsregister;
        - *transitievergoeding:* transitievergoeding als bedoeld in
      [artikel 673 van Boek 7 van het Burgerlijk Wetboek][ref6];
        - *verklaring inzake werkelijke kosten:* verklaring, ondertekend door ten minste één tekenbevoegd persoon van de
      zorgaanbieder, waarin de zorgaanbieder aantoont: a. dat de activiteiten waarvoor de subsidie is verstrekt zijn
      verricht, voorzien van een korte toelichting; b. dat aan de verleende subsidie verbonden verplichtingen is voldaan;
      en c. wat het totale bedrag van de gerealiseerde kosten van de activiteiten waarvoor subsidie is verleend en die
      werkelijk verricht zijn is;
        - *voltijds coronabaan:* een coronabaan die een arbeidsduur van gemiddeld 36 uur per week omvat;
        - *werknemer:* persoon die a. op basis van een arbeidsovereenkomst als bedoeld in
      [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref7] voor bepaalde tijd in dienst is bij een zorgaanbieder;
      b. op basis van een uitzend- of detacheringsovereenkomst door de werkgever ter beschikking wordt gesteld van een
      zorgaanbieder om arbeid te verrichten onder toezicht en leiding van de zorgaanbieder;
        - *wettelijk minimumloon:* het minimumloon als bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref8];
        - *WTZi-toelating:* toelating als bedoeld in [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref9];
        - *zorgaanbieder:* a. een privaatrechtelijke rechtspersoon die, een organisatorisch verband van natuurlijke
      personen dat of een natuurlijke persoon die: 1° bedrijfsmatig zorg verleent die wordt bekostigd op grond
      van een zorgverzekering als bedoeld in de [Zorgverzekeringswet][ref10]; 2° een zorgaanbieder is als
      bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref11]; 3° publieke gezondheidszorg als bedoeld in
      [artikel 1, onder c, van de Wet publieke gezondheid][ref12] verleent of doet verlenen; 4° bedrijfsmatig
      jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref13] doet verlenen; 5° een aanbieder is als bedoeld in
      [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref14]; 6° een ADL-aanbieder is als
      bedoeld in [artikel 1.1 van de Subsidieregeling ADL-assistentie][ref15]; 7° ten laste van een persoonsgebonden
      budget als bedoeld in [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref16]
      ondersteuning verleent; of 8° door middel van opdracht van een aanbieder als
      bedoeld onder 5° onmiddellijk of middellijk een voorziening in de zin van
      [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref17] levert; b. degene die: 1° in
      een register als bedoeld in [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref18] staat
      ingeschreven of een beroep uitoefent waarvan de opleiding krachtens [artikel 34, eerste lid, van die wet][ref19]
      is geregeld of aangewezen en 2° als solistisch werkende zorgverlener als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref20], zorg verleent als
      omschreven bij of krachtens de [Zorgverzekeringswet][ref21] of de [Wet langdurige zorg][ref22]; c. de
      GezondheidsZorg Asielzoekers Nederland B.V.; d. een GGD; e. een academisch ziekenhuis als bedoeld in
      [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref23].


