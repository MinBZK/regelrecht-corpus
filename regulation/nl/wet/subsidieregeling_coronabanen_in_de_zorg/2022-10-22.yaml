      - id: ref2
        bwb_id: BWBR0044830
        artikel: '3'
  - number: '8'
    text: |-
      De minister verstrekt:

      a. indien de subsidie minder dan € 25.000 bedraagt, een subsidie die ambtshalve wordt vastgesteld tot ten hoogste
      het bedrag waarvan de hoogte door de minister bij de verlening is genoemd;

      b. indien de subsidie € 25.000 of meer bedraagt, doch minder dan € 125.000 een subsidie waarbij op basis van een
      verklaring inzake werkelijke kosten wordt aangetoond dat de te subsidiëren activiteiten hebben plaatsgevonden
      overeenkomstig de aan de verleende subsidie verbonden verplichtingen; of

      c. indien de subsidie € 125.000 of meer bedraagt, een subsidie waarbij wordt aangetoond dat de te subsidiëren
      activiteiten hebben plaatsgevonden overeenkomstig de aan de verleende subsidie verbonden verplichtingen en waarbij
      tevens rekening en verantwoording wordt afgelegd in een separaat financieel verslag of in een financieel verslag
      als bijlage in de andere informatie van de jaarverslaggeving van de zorgaanbieder omtrent de met de gesubsidieerde
      activiteiten samenhangende kosten en baten.
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel8
  - number: '9'
    text: |-
      1 De minister besluit binnen 13 weken na ontvangst van de aanvraag, bedoeld in
      [artikel 6, eerste en tweede lid][ref1], en het verzoek, bedoeld in artikel 6, tweede lid, tot subsidieverlening.

      2 Het besluit tot subsidieverlening vermeldt in ieder geval:

      a. het aantal werknemers en coronabanen waarvoor subsidie wordt verleend;

      b. de hoogte van het subsidiebedrag;

      c. de wijze van verantwoording;

      d. de wijze waarop kan worden aangetoond dat de activiteiten verricht zijn; en

      e. de termijn waarbinnen de vaststelling van de subsidie moet worden aangevraagd.

      3 De minister verleent bij het besluit tot verlening van de subsidie een voorschot van 100% dat in een keer wordt
      uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0044830#Artikel6
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel9
    references:
