  - number: '14'
    text: |-
      1 In afwijking van [artikel 8][ref1] legt een GGD verantwoording af over de activiteiten waarvoor de subsidie is
      verleend, op de wijze bepaald in [artikel 17a van de Financiële-verhoudingswet][ref2].

      2 De GGD vraagt uiterlijk op 15 juli 2022 de vaststelling van de subsidie aan door verantwoordingsinformatie aan de
      minister te verstrekken op de wijze bedoeld in het eerste lid.

      3 [Artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref3] is van overeenkomstige
      toepassing op de verantwoordingsinformatie.

      4 De subsidie wordt vastgesteld op een bedrag tot ten hoogste het in de verleningsbeschikking genoemde bedrag.

      5 De minister besluit binnen 22 weken op een aanvraag tot vaststelling.


