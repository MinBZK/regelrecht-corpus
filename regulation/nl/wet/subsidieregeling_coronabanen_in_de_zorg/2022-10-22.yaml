        artikel: '8'
  - number: '13'
    text: |-
      1 Bij subsidies als bedoeld in [artikel 8, onder c][ref1], dient de zorgaanbieder uiterlijk 30 september 2022 een
      aanvraag in voor de vaststelling van de subsidie.

      2 Voor een aanvraag tot vaststelling van de subsidie wordt een door de minister vastgesteld formulier gebruikt.

      3 De zorgaanbieder legt rekening en verantwoording af aan de hand van een separaat financieel verslag of een
      financieel verslag als bijlage in de andere informatie van de jaarverslaggeving van de zorgaanbieder.

      4 Het financieel verslag, bedoeld in het derde lid, gaat vergezeld van een controleverklaring van een accountant
      overeenkomstig een door de minister vastgesteld en bekendgemaakt accountantsprotocol.

      5 De minister besluit binnen 22 weken op een aanvraag tot vaststelling.

      6 De subsidie wordt vastgesteld op een bedrag tot ten hoogste het in de verleningsbeschikking genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0044830#Artikel8
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel13
