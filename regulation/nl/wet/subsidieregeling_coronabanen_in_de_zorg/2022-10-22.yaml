  - number: '15'
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor zover
      toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen zal leiden tot een onbillijkheid
      van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel15
  - number: 15a
    text: |-
      De subsidieregeling, zoals deze luidde op 20 februari 2021, blijft van toepassing op subsidies die zijn verstrekt
      aan zorgaanbieders ten behoeve van activiteiten in periode 1.
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel15a
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2021. De regeling vervalt met ingang van 31 december 2023.
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel16
