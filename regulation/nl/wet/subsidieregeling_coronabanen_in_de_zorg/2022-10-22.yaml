  - number: '4'
    text: |-
      1 Subsidie wordt enkel verstrekt aan zorgaanbieders die op 1 januari 2021 in het handelsregister stonden
      ingeschreven met een hoofd- of nevenactiviteit met een SBI-code die in de Bijlage is opgenomen.

      2 In afwijking van het eerste lid, kan subsidie worden verstrekt aan een zorgaanbieder indien uit de aanduiding
      waarmee de zorgaanbieder op 1 januari 2021 is ingeschreven in het handelsregister, naar het oordeel van de minister
      blijkt dat de zorgaanbieder een hoofd- of nevenactiviteit uitvoert die in de Bijlage is opgenomen.

      3 De activiteiten, bedoeld in [artikel 3, eerste en tweede lid][ref1], zijn in totaal voor maximaal zes maanden
      subsidiabel in de periode van 1 januari 2021 tot en met 31 december 2021.

      4 Subsidie voor periode 1 wordt uitsluitend verstrekt indien:

      a. de werknemer vanaf 1 januari 2021 wordt ingezet bij de zorgaanbieder;

      b. het contract voor minimaal twee en maximaal zes maanden wordt aangegaan; en

      c. in het contract wordt vastgelegd dat de arbeidsduur in ieder geval gemiddeld 20 uur per week bedraagt.

      5 Subsidie voor periode 2 wordt uitsluitend verstrekt indien:

      a. de werknemer vanaf 1 juli 2021 maar voor 1 oktober 2021 wordt ingezet bij de zorgaanbieder;

      b. het contract voor minimaal twee en maximaal zes maanden wordt aangegaan; en

      c. in het contract wordt vastgelegd dat de arbeidsduur in ieder geval gemiddeld 20 uur per week bedraagt.

      6 De minister beslist afwijzend op een aanvraag indien het aantal personen dat coronabanen als bedoeld in
      [artikel 3, derde lid][ref2], verricht en waarvoor de zorgaanbieder subsidie aanvraagt, het aantal werkzame
      personen bij de zorgaanbieder met meer dan 100% doet toenemen.

      7 In afwijking van het zesde lid kan een zorgaanbieder met maximaal 2 werkzame personen subsidie voor in totaal 3
      coronabanen als bedoeld in [artikel 3, derde lid][ref3], aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0044830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0044830#Artikel3
