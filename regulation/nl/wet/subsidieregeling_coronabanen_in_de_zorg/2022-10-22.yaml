        artikel: '8'
  - number: '12'
    text: |-
      1 Bij subsidies als bedoeld in [artikel 8, onder b][ref1], dient de zorgaanbieder uiterlijk 3 juni 2022 een
      aanvraag in voor de vaststelling van de subsidie.

      2 Voor een aanvraag tot vaststelling van de subsidie wordt een door de minister vastgesteld formulier gebruikt.

      3 De zorgaanbieder toont aan de hand van een verklaring inzake werkelijke kosten aan dat de activiteiten zijn
      verricht en dat is voldaan aan de aan de verleende subsidie verbonden verplichtingen.

      4 De minister kan een steekproef uitvoeren voorafgaand aan de controle van de verklaring inzake werkelijke kosten,
      bedoeld in het derde lid.

      5 De Minister besluit uiterlijk 4 november 2022 op een aanvraag tot vaststelling van de subsidie.

      6 De subsidie wordt vastgesteld op een bedrag tot ten hoogste het in de verleningsbeschikking genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0044830#Artikel8
    url: https://wetten.overheid.nl/BWBR0044830/2022-10-22#Artikel12
