  - number: '3'
    text: |-
      1 De minister kan op aanvraag aan een zorgaanbieder een subsidie verstrekken voor het tewerkstellen en begeleiden
      van werknemers via coronabanen om de continuïteit van zorg tijdens de COVID-19 uitbraak te kunnen waarborgen.

      2 De minister kan op aanvraag aan een zorgaanbieder een subsidie verstrekken voor het via coronabanen
      tewerkstellen en begeleiden van werknemers die een beroepsopleiding in de derde leerweg volgen als bedoeld
      in [artikel 1.4.1, lid 1.a, van de Wet educatie en beroepsonderwijs][ref1] met als doel het behalen van een
      certificaat als bedoeld in [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref2].

      3 De coronabanen die in aanmerking komen voor subsidie zijn:

      a. coronabaan – gastheer of gastvrouw;

      b. coronabaan – zorg-assistent of zorgbuddy;

      c. coronabaan – ADL-ondersteuner;

      d. coronabaan – welzijn-assistent;

      e. coronabaan – ondersteuner zorgmedewerker; of

      f. coronabaan – ondersteuner veiligheid.

      4 Geen subsidie wordt verstrekt voor:

      a. de kosten van het tewerkstellen van werknemers die met de prestatiebeschrijving ‘meerkosten’ worden vergoed op
      grond van:

      1° de Beleidsregel continuïteitsbijdrage en meerkosten in verband met de uitbraak van het SARS-CoV-2 virus;

      2° de Beleidsregel SARS-CoV-2 virus extra kosten Wlz 2021;

      3° de Beleidsregel SARS-CoV-2 virus doorlopende kosten Wlz 2021; of

      4° de meerkostenregeling corona voor [Jeugdwet][ref3] en [Wmo 2015][ref4];

      b. de kosten van het tewerkstellen van werknemers die op grond van de
      [Subsidieregeling opschaling curatieve zorg COVID-19][ref5] worden vergoed;

      c. de kosten van het tewerkstellen en begeleiden van werknemers die op grond van het Kwaliteitsbudget
      Verpleeghuiszorg en de Transitiemiddelen Verpleeghuiszorg worden vergoed;

      d. andere kosten met betrekking tot het aannemen van werknemers die van overheidswege worden vergoed; en

      e. dezelfde werknemer waarvoor in periode 1 subsidie is verleend en in periode 2 een verzoek tot herziening van
      de subsidieverlening ten behoeve van de verlenging van de activiteiten in periode 1 is aangevraagd en daardoor de
      totale maximale subsidiabele periode van zes maanden wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.3
