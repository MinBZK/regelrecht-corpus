  - number: '2'
    text: |-
      Voorts verstrekt de justitiële documentatiedienst aan het hoofd van de Marine Inlichtingen Dienst, van de Militaire
      Inlichtingen Dienst en van de Luchtmacht Inlichtingen Dienst inlichtingen uit de strafregisters:

      a. omtrent de dienstplichtigen vóór hun inlijving;

      b. omtrent de naaste familieleden van personeel van de militaire departementen en der krijgsmacht, voor zover dit
      personeel met gegevens, materialen of andere objecten, welke als zeer geheim geclassificeerd zijn, in aanraking
      komt;

      c. omtrent de zakelijke en andere (incidentele) relaties van de Departementen van Oorlog en van Marine, voor zover
      deze met gegevens, materialen of andere objecten, welke als confidentieel zijn geclassificeerd, in aanraking komen;

      d. omtrent de naaste familieleden van de sub c genoemde personen, voor zover laatstgenoemden in aanraking komen met
      gegevens, materialen of andere objecten, welke als zeer geheim zijn geclassificeerd.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel2
  - number: 2a
    text: |-
      De justitiële documentatiedienst verstrekt aan het bevoegd gezag van noodwachten en noodwachtstaven inlichtingen
      uit de strafregisters, voor zover dit gezag de inlichtingen nodig heeft voor de hem toekomende bevoegdheid
      tot het nemen van beslissingen of het dienen van advies over de bestemming, de inlijving en het ontslag van
      noodwachtplichtigen en ander noodwachtpersoneel.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel2a
  - number: 2b
    text: |-
      1 De justitiële documentatiedienst verstrekt inlichtingen uit de strafregisters aan de secretarissen-generaal
      van de ministeries ten behoeve van het onderzoek naar personen, die worden of zijn belast met werkzaamheden
      in dienstbetrekking bij het Rijk, indien dit noodzakelijk is in verband met bijzondere eisen die aan de
      verantwoordelijkheid of de integriteit van deze personen worden gesteld.

      2 De justitiële documentatiedienst doet jaarlijks opgave aan de Minister van Justitie ten behoeve van welke
      werkzaamheden, bedoeld in het eerste lid, inlichtingen zijn verstrekt.

      3 Onze Minister van Justitie kan, in overeenstemming met Onze Minister van Binnenlandse Zaken, ten aanzien van
      bepaalde werkzaamheden de bevoegdheid om ingevolge het eerste lid gegevens te verstrekken beperken.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel2b
  - number: 2c
    text: |-
      1 De justitiële documentatiedienst verstrekt inlichtingen uit de strafregisters aan de griffiers van de Tweede en
      Eerste Kamer der Staten-Generaal, de secretaris van de Raad van State, de secretaris van de Algemene Rekenkamer,
      de directeur Nationale ombudsman, de directeur van het Kabinet der Koningin alsmede de secretaris van de Kanselarij
      der Nederlandse Orden ten behoeve van het onderzoek naar personen, die worden of zijn belast met werkzaamheden in
      dienstbetrekking bij respectievelijk de Tweede of Eerste Kamer der Staten-Generaal, de Raad van State, de Algemene
      Rekenkamer, de Nationale ombudsman, het Kabinet der Koningin of de Kanselarij der Nederlandse Orden, indien dit
      noodzakelijk is in verband met de bijzondere eisen die aan de verantwoordelijkheid of de integriteit van deze
      personen worden gesteld.

      2 Het tweede en derde lid van artikel 2b zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel2c
  - number: 2d
    text: |-
      De Centrale Justitiële Documentatie verstrekt inlichtingen uit de strafregisters aan de Minister van Justitie voor
      zover dit noodzakelijk is voor het onderzoek naar de antecedenten van tolken en vertalers die in aanmerking willen
      komen voor de verlening van hun diensten ten behoeve van justitiële werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel2d
  - number: 2e
    text: |-
      De Centrale Justitiële Documentatie verstrekt inlichtingen uit de strafregisters aan de Minister van Justitie
      voorzover dit noodzakelijk is voor het opdoen van kennis die van belang is voor een goede uitvoering van de in het
      wetsvoorstel justitiële gegevens (24 797) toegekende taak met betrekking tot de afgifte van de verklaring omtrent
      het gedrag.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel2e
  - number: '3'
    text: |-
      1 De justitiële documentatiedienst verstrekt inlichtingen uit de strafregister aan:

      de Centrale Directie der Posterijen, Telegrafie en Telefonie;

      de directeur van de Postcheque- en girodienst;

      de directeur van de Rijkspostspaarbank;

      de directeuren van de postdistricten;

      de directeuren van de telefoondistricten;

      de directeuren van de plaatselijke telefoondiensten te Amsterdam, Rotterdam en 's-Gravenhage;

      de directeuren van de telegraafkantoren te Amsterdam, Rotterdam en 's-Gravenhage;

      de chef van de spoorwegrecherche van de Nederlandse Spoorwegen;

      het hoofd van de Dienst Bedrijfsbeveiliging der Koninklijke Luchtvaart Maatschappij N.V.;

      het hoofd van de Bedrijfspolitie van Joh. Enschedé en Zonen Grafische Inrichting B.V.

      een en ander voor zover de genoemde personen dit nodig hebben in verband met de hun toekomende bevoegdheid tot het
      nemen van beslissingen of het dienen van advies over de benoeming en het ontslag van personeel bij de diensten,
      waarbij zij werkzaam zijn.

      2 De justitiële documentatiedienst verstrekt inlichtingen uit de strafregisters aan de directeur van de afdeling
      Beveiliging en transport van de Nederlandsche Bank N.V. voor zover deze dit nodig heeft in verband met het nemen
      van beslissingen of het dienen van advies over de benoeming en het ontslag van personeel bij de Bank of bij
      toeleveranciers aan deze bank van papier dat wordt gebruikt voor de vervaardiging van bankbiljetten.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel3
  - number: '4'
    text: |-
      De justitiële documentatiedienst verstrekt uittreksels uit de strafregisters ten behoeve van de afgifte van een
      paspoort of een toeristenkaart model B aan de autoriteiten, die bevoegd zijn deze te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel4
  - number: '5'
    text: |-
      De justitiële documentatiedienst verstrekt uittreksels uit de strafregisters aan de Kamers van Koophandel en
      Fabrieken ten behoeve van hun bij wet of besluit opgedragen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel5
  - number: '6'
    text: |-
      De justitiële documentatiedienst verstrekt uittreksels uit de strafregisters aan de voorzitter van de Sociaal-
      Economische Raad ten behoeve van de uitvoering van de Wet op de Assurantiebemiddeling.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel6
  - number: 6a
    text: |-
      De justitiële documentatiedienst verstrekt inlichtingen uit de strafregisters betreffende veroordelingen
      ter zake van de misdrijven, omschreven in de artikelen 26 en 36, derde lid, van de Wegenverkeerswet, aan de
      geneeskundige van het centraal bureau voor de afgifte van rijvaardigheidsbewijzen, ten behoeve van diens in het
      Wegenverkeersreglement aangegeven werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel6a
  - number: 6b
    text: |-
      De justitiële documentatiedienst verstrekt aan de voorzitter van de commissie, bedoeld in artikel 8, eerste lid,
      van de Wet voorlopige regeling schadefonds geweldsmisdrijven (Stb. 1975, 382), ten behoeve van de werkzaamheden
      die de commissie bij deze wet zijn opgedragen, uittreksels uit de strafregisters ten aanzien van slachtoffers van
      geweldsmisdrijven.
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel6b
  - number: '7'
    text: |-
      Dit besluit treedt in werking tegelijk met de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1].

      Het kan worden aangehaald als: Besluit inlichtingen strafregisters.


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#Artikel7
