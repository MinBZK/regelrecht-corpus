preamble:
  text: |-
    Gelet op het bepaalde in artikel 15 van de Wet op de justitiële documentatie en op de verklaring omtrent het
    gedrag.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0002295/2002-10-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De justitiële documentatiedienst verstrekt uittreksels uit de strafregisters aan
      de personen, genoemd in de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4] en
      [7 van het Besluit inlichtingen justitiële documentatie][ref5], voor de in die artikelen bedoelde doeleinden.

      2 De justitiële documentatiedienst verstrekt ook overigens inlichtingen uit de strafregisters aan het hoofd van
      de Algemene Inlichtingen- en Veiligheidsdienst, indien deze de inlichtingen voor de taakvervulling van de dienst
      nodig oordeelt.


