preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de uiterste betaaltermijn voor grote ondernemingen
    die een handelsovereenkomst sluiten met kleine of middelgrote ondernemingen te verkorten tot 30 dagen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046553/2022-07-01#ArtikelAanhef
articles:
  - number: IIa
    text: |-
      Onze Minister van Economische Zaken en Klimaat zendt in overeenstemming met Onze Minister voor Rechtsbescherming
      binnen twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en
      de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0046553/2022-07-01#ArtikelIIa
  - number: III
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0046553/2022-07-01#ArtikelIII
