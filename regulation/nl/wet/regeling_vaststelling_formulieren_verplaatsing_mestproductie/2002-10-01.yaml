valid_from: '2002-10-01'
bwb_id: BWBR0006457
url: https://wetten.overheid.nl/BWBR0006457/2002-10-01
preamble:
  text: |-
    Gelet op de artikelen 9, eerste lid, 10, eerste lid, 11, vierde lid, en 13, van de Wet verplaatsing mestproductie,
    in samenhang met de artikelen 2, 3 en 4 van de Regeling gegevensverstrekking Wet verplaatsing mestproductie,
    alsmede artikel 2 van de Regeling mestafzetovereenkomsten Wet verplaatsing mestproductie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006457/2002-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De formulieren, bedoeld in artikel 9, eerste lid, en 10, [eerste lid][ref1], van de
      [Wet verplaatsing mestproductie][ref2], worden vastgesteld volgens de bij deze regeling behorende modellen I, II,
      IV en XV.


      [ref1]: https://wetten.overheid.nl/BWBR0006285
      [ref2]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0006457/2002-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006285
      - id: ref2
        bwb_id: BWBR0006285
  - number: '4'
    text: |-
      De formulieren, bedoeld in
      [artikel 3, eerste lid, van de Regeling gegevensverstrekking Wet verplaatsing mestproductie][ref1], worden
      vastgesteld overeenkomstig de bij deze regeling behorende modellen VII, VIII, IX, XI, XII, XIII, XIV en XVI.


      [ref1]: https://wetten.overheid.nl/BWBR0006344#Artikel3
    url: https://wetten.overheid.nl/BWBR0006457/2002-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006344
        artikel: '3'
  - number: '5'
    text: |-
      De in de [artikelen 1][ref1] tot en met [4][ref2] bedoelde formulieren worden opgevraagd bij Bureau Heffingen te
      Assen en liggen ter inzage in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0006457#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006457#Artikel4
    url: https://wetten.overheid.nl/BWBR0006457/2002-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006457
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006457
        artikel: '4'
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006457/2002-10-01#Artikel6
  - number: '7'
    text: |-
      Deze regeling wordt aangehaald als: Regeling vaststelling formulieren verplaatsing mestproductie. Deze regeling,
      met uitzondering van de in de [artikelen 1][ref1] tot en met [4][ref2] bedoelde modellen, zal met de toelichting
      in de Staatscourant worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0006457#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006457#Artikel4
    url: https://wetten.overheid.nl/BWBR0006457/2002-10-01#Artikel7
