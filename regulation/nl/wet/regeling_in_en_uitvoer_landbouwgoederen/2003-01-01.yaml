        paragraaf: '1'
  - number: '45'
    text: |-
      In afwijking van het bepaalde in de [artikelen 35][ref1] en [41][ref2] en onverminderd het bepaalde in
      [artikel 96, vierde lid, onderdeel c][ref3], houdt het produktschap op verzoek van belanghebbende het
      voorfixatiecertificaat onder zich, onderscheidenlijk neemt het produktschap voorfixatiecertificaten in bewaring,
      en boekt daarop de uitvoer af aan de hand van het terugontvangen formulier L, bedoeld in [artikel 39][ref4]
      van de Douaneregeling, een en ander met inachtneming van de uitvoeringsbepalingen. Er mag slechts worden
      afgeboekt op het certificaat waarnaar is verwezen in het formulier L, bedoeld in [artikel 39][ref5]
      van de Douaneregeling, of in [artikel 84, derde lid][ref6], dan wel in de maandstaat, als bedoeld in
      [artikel 96, tweede lid, onderdelen c en d][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003381#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003381#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003381#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0003381#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0003381#Artikel39
      [ref6]: https://wetten.overheid.nl/BWBR0003381#Artikel84
      [ref7]: https://wetten.overheid.nl/BWBR0003381#Artikel96
